# Lượt 2, lô D8-L3, nhãn thẻ nao-10. Model: Claude Opus 5.5. Ngày 17/11/2026.
- trang: du-lieu/ngo-nhan/nao-10
  id: nhan
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC7835631/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3475349/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC8548459/"]
  trich: "Torrijos-Muelas và cộng sự 2021 (tổng quan hệ thống, Front Psychol): 'The myth about only 10% of brain use seems to be the most enduring neuromyth ... Scientific research shows how improbable this assertion may be, just taking into consideration that no one single brain area is 100% \"out of work,\" even when sleeping (Centre for Educational Research and Innovation and OECD, 2007).' Dekker và cộng sự 2012 xếp 'We only use 10% of our brain' là câu sai (I) trong 15 huyền thoại thần kinh."
  ghi_chu: "Tổng quan hệ thống 24 khảo sát (Torrijos-Muelas 2021) và tổng quan can thiệp (Rousseau 2021) đều coi câu này là huyền thoại thần kinh. OECD 2002/2007 xếp nó vào nhóm huyền thoại; tổng quan nêu chứng cứ phản bác: không vùng não nào ngừng hoạt động hoàn toàn, kể cả khi ngủ. Khẳng định chưa bao giờ có bằng chứng gốc, và dữ liệu hình ảnh não trái với nó: hợp 'Đã bị bác bỏ' theo mục 4. Đã đọc toàn văn cả ba bài qua Europe PMC. Chưa mở được nguồn riêng về chuyển hóa năng lượng của não; câu nhãn không cần điều này."
