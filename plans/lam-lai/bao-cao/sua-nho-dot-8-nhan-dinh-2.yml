- trang: trai-nghiem/linda
  id: n11
  cau: 'Đang tranh cãi: vì sao ta mắc bẫy; Gigerenzer phản biện rằng nhiều "lỗi" không vi phạm lý thuyết xác suất nếu phân biệt xác suất một trường hợp với tần suất; Hertwig và cộng sự (theo Chandrashekar và cộng sự, 2021) cho rằng người trả lời có thể hiểu từ "xác suất" và chữ "và" khác nghĩa toán học, và lần làm lại có đăng ký trước của Chandrashekar và cộng sự (2021) không thấy bằng chứng cho giả thuyết từ ngữ mơ hồ ấy; một số tác giả khác (Adler; Dulany và Hilton; Politzer và Noveck, theo Hertwig và Gigerenzer, 1999) cho rằng người ta hiểu (A) thành "nhân viên ngân hàng và không hoạt động nữ quyền"; theo Hertwig và Gigerenzer, kết quả không đồng nhất (các dự đoán mà Agnoli và Krantz, 1989, rút từ giả thuyết này không được xác nhận) nhưng nhìn chung ít nhất một phần người tham gia hiểu theo cách này.'
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n71
  cau: 'Khung "Khá vững": dãy từ nhiều âm tiết thường nhớ được ít hơn dãy từ ngắn; Oberauer và cộng sự (2018) gọi hiệu ứng độ dài từ (Baddeley và cộng sự 1975) là ổn định khi độ dài thay đổi bằng số âm tiết, quan sát được ở nhiều ngôn ngữ, và xếp mức B (phạm vi hẹp hơn mức A, vì chỉ thuộc trí nhớ cho lời nói); cách giải thích còn tranh cãi: từ dài và ngắn thường khác nhau cả ở số từ láng giềng có chính tả và âm gần giống, và khi cân bằng thêm các yếu tố này, hiệu ứng mất đi ở bài nhận diện thứ tự (Guitard, Neath và Surprenant 2025), như các nghiên cứu trước ở bài nhớ lại theo thứ tự mà họ dẫn; chưa chắc độ dài tự nó là nguyên nhân.'
  loai: nhan
