- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n30
  cau: Thí nghiệm gốc dùng sinh viên Stanford năm 1959.
  loai: lich-su
  nguon:
    - ten: "Festinger & Carlsmith (1959), J Abnorm Soc Psychol 58, 203-210: toàn văn (psychclassics.yorku.ca)"
      link: https://psychclassics.yorku.ca/Festinger/
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "sinh viên Mỹ năm 1959, với số tiền 1 và 20 đô-la mang ý nghĩa rất cụ thể trong bối cảnh đó". Chữ mới: "sinh viên Stanford". Lý do: bài ghi Stanford; "ý nghĩa rất cụ thể" của số tiền không có trong bài (n11). Review (Claude Sonnet 5.5, 10/11/2026): dung. F&C 1959: sinh viên nam lớp nhập môn ở Stanford; bài đăng 1959.'
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n28
  cau: MSCEIT là bài test giải các nhiệm vụ cảm xúc (nhìn khuôn mặt cho biết cảm xúc, dự đoán cảm xúc chuyển biến ra sao), không có tự đánh giá.
  loai: dinh-nghia
  nguon:
    - ten: "Mayer, Salovey, Caruso & Sitarenios (2003), Emotion 3(1), 97–105: toàn văn (PDF trong Internet Archive, bộ wikipedia-scholarly-sources-corpus)"
      link: https://doi.org/10.1037/1528-3542.3.1.97
  ket_qua_luot_1: dung
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n9
  cau: Nhóm đối chứng (không phải nói dối ai) chấm công việc −0,45 trên thang từ −5 (cực chán) đến +5 (cực thích), tức hơi nghiêng về phía chán.
  loai: so-lieu
  nguon:
    - ten: "Festinger & Carlsmith (1959), J Abnorm Soc Psychol 58, 203-210: toàn văn (psychclassics.yorku.ca)"
      link: https://psychclassics.yorku.ca/Festinger/
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Tức là: chán thật." Chữ mới: "Tức là hơi nghiêng về phía chán." Lý do: bài nói "somewhat on the negative side of the neutral point". Thang −5 đến +5: câu hỏi 1 ở mục Procedure. Review (Claude Sonnet 5.5, 10/11/2026): dung. F&C 1959: đối chứng trung bình −0,45 "somewhat on the negative side of the neutral point"; thang −5 đến +5 ở câu hỏi 1.'
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n66
  cau: 'Ngộ nhận 2: tái đánh giá là diễn giải lại ý nghĩa của tình huống để đổi tác động cảm xúc của nó, ví dụ nhìn nhận áp lực của sếp thay vì mặc định "sếp ghét mình"; các nghiên cứu ở đây không so sánh cách diễn giải sát sự thật với cách tô hồng, nên bài không khẳng định cách nào hiệu quả hơn.'
  loai: dinh-nghia
  nguon:
    - ten: "Gross & John (2003), J Pers Soc Psychol 85(2), 348–362: toàn văn (PDF ở onlineacademiccommunity.uvic.ca, đọc 10/11/2026); số trang theo bản in"
      link: https://doi.org/10.1037/0022-3514.85.2.348
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "Tái đánh giá hiệu quả là tìm một cách diễn giải khác mà vẫn đúng với sự thật ... Đó là mở rộng góc nhìn, không phải tô hồng thực tế." Chữ mới như câu. Lý do: khẳng định "hiệu quả là khi diễn giải đúng với sự thật" không có nguồn; Gross & John định nghĩa tái đánh giá chỉ là diễn giải lại để đổi tác động cảm xúc. Ví dụ về sếp là minh họa (gia-dinh). Review (Claude Opus 5.5, 10/11/2026): dung. Khớp định nghĩa của Gross & John 2003.'
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n20
  cau: Ở các mẫu biết chữ, tỉ lệ đúng cao hơn hẳn (63–97% tùy cảm xúc).
  loai: so-lieu
  nguon:
    - ten: "Ekman, Sorenson & Friesen (1969), Science 164(3875), 86–88: toàn văn (PDF trong Internet Archive, bộ wikipedia-scholarly-sources-corpus; Bảng 1 đọc từ ảnh chụp trang)"
      link: https://doi.org/10.1126/science.164.3875.86
  ket_qua_luot_1: dung
  ghi_chu: "Phép đọc bảng: giá trị nhỏ nhất và lớn nhất của ba cột biết chữ."
