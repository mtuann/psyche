- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n1
  cau: Nhiệm vụ 2–4–6 của Wason (1960) cho thấy ta có xu hướng tìm bằng chứng ủng hộ giả thuyết của mình thay vì tìm cách bác bỏ nó (mô tả của trang).
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n2
  cau: Quy tắc thật của Wason chỉ là ba số tăng dần bất kỳ; dãy 2–3–4 đúng, dãy 1–5–100 cũng đúng.
  loai: dinh-nghia
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n3
  cau: Nhiều người đoán một quy tắc hẹp hơn quy tắc thật, chẳng hạn mỗi số hơn số trước 2 đơn vị; trong thí nghiệm của Wason gần như mọi quy tắc sai đều thuộc kiểu hẹp hơn.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n4
  cau: Các dãy như 8–10–12, 20–22–24, 100–102–104 đều nhận "đúng" vì thỏa quy tắc thật, nên không dãy nào cho thấy phỏng đoán "số chẵn tăng đều" là sai.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n5
  cau: Họ thường nêu quy tắc sai chỉ sau vài lần thử (trung bình 3,7 dãy trước lần nêu sai đầu tiên).
  loai: so-lieu
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n6
  cau: Dãy đáng thử nhất là dãy có khả năng làm phỏng đoán sụp đổ, ví dụ 2–3–4 (không còn là số chẵn cách nhau 2); nếu dãy đó vẫn "đúng" thì phỏng đoán quá hẹp.
  loai: loi-khuyen
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n7
  cau: "Thiên kiến xác nhận (confirmation bias): xu hướng tìm hoặc diễn giải bằng chứng theo hướng có lợi cho niềm tin, kỳ vọng hay giả thuyết sẵn có."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n8
  cau: Khi đã có giả thuyết, ta còn có xu hướng ghi nhớ chi tiết "cùng phe" và xem nhẹ hay quên bằng chứng trái chiều.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n9
  cau: "Thiên kiến xác nhận thường không phải cố tình tự lừa dối mình: Nickerson mô tả nó là sự chọn lọc không chủ ý trong việc thu thập và dùng bằng chứng."
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n10
  cau: Ở nhiệm vụ 2–4–6, có cách giải thích rằng người tham gia xác nhận không phải vì muốn, mà vì không nghĩ ra cách bác bỏ (Evans, theo Nickerson).
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n11
  cau: Chỉ thử những dãy "khớp" với một phỏng đoán hẹp hơn quy tắc thật thì về mặt logic không thể cho thấy phỏng đoán đó sai.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n12
  cau: Peter Wason làm thí nghiệm 2–4–6 ở University College London, năm 1960.
  loai: lich-su
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n13
  cau: Người tham gia là 29 sinh viên đại học ngành tâm lý (17 nam, 12 nữ), được thử riêng từng người.
  loai: so-lieu
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n14
  cau: Người tham gia viết ra từng dãy ba số kèm lý do chọn; sau mỗi dãy, Wason cho biết dãy đó có tuân theo quy tắc hay không; họ chỉ nêu quy tắc khi đã rất tự tin.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n15
  cau: Nếu quy tắc nêu ra sai thì người tham gia được báo rồi thử tiếp; buổi thử dừng khi họ nêu đúng, quá 45 phút, hay muốn bỏ cuộc.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n16
  cau: Trong 29 người, 6 người tìm ra quy tắc đúng mà không nêu sai lần nào trước đó; 13 người nêu sai một lần; 9 người nêu sai từ hai lần trở lên; 1 người không đưa ra kết luận nào.
  loai: so-lieu
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n17
  cau: Gần như mọi quy tắc sai là quy tắc hẹp hơn quy tắc thật, ví dụ "tăng đều 2 đơn vị".
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n18
  cau: Những người nêu quy tắc sai ngay lần đầu thử trung bình 3,7 dãy trước khi nêu, so với 8,0 dãy ở 6 người nêu đúng ngay.
  loai: so-lieu
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n19
  cau: Tỉ lệ dãy không tuân theo quy tắc thật trong các dãy họ thử là 0,04 ở nhóm nêu sai ngay lần đầu, so với 0,21 ở nhóm nêu đúng ngay.
  loai: so-lieu
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n20
  cau: Wason kết luận rằng những người nêu sai từ hai lần trở lên không thể hoặc không muốn kiểm tra giả thuyết của mình theo cách có thể loại trừ nó.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n21
  cau: Gần bốn thập kỷ sau Wason, Nickerson (1998) công bố bài tổng quan trên Review of General Psychology.
  loai: lich-su
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n22
  cau: Bài tổng quan gom các phát hiện về thiên kiến xác nhận (tìm kiếm và diễn giải bằng chứng, ghi nhớ có chọn lọc, các ví dụ ngoài phòng thí nghiệm) thành một khung chung.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n23
  cau: Bài tổng quan nêu ví dụ thiên kiến xác nhận ở các bối cảnh như chẩn đoán y khoa, xét xử và khoa học.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n24
  cau: Trong thí nghiệm của Lord, Ross và Lepper, người ủng hộ và phản đối án tử hình đọc hai nghiên cứu (được giới thiệu là thật), một ủng hộ và một phản đối tính răn đe; cả hai phe đánh giá nghiên cứu ủng hộ quan điểm của mình là thuyết phục hơn.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n25
  cau: Sau khi đọc, cả hai phe đều nói rằng thái độ của mình đã cực đoan hơn theo hướng quan điểm ban đầu, nên bằng chứng "hỗn hợp" không làm ai lung lay.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n26
  cau: 'Phần "hai phe càng xa nhau hơn" mong manh hơn: trong một loạt nghiên cứu làm lại, khi đo thái độ trước và sau thì không thấy phân cực.'
  loai: tai-lap
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n27
  cau: Thiên kiến xác nhận không chỉ nằm ở khâu tìm kiếm bằng chứng mà còn ở khâu diễn giải bằng chứng.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n28
  cau: "Vững chắc: ta có xu hướng ưu tiên tìm và chọn thông tin phù hợp với niềm tin hay giả thuyết sẵn có."
  loai: nhan
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n29
  cau: Kiểu hành vi trong nhiệm vụ 2–4–6 được thấy ở thí nghiệm gốc của Wason và được các bài tổng quan sau đó ghi nhận (Klayman và Ha, 1987; Nickerson, 1998).
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n30
  cau: Một phân tích tổng hợp về việc chọn thông tin (Hart và cộng sự, 2009) thấy mức ưu tiên vừa phải cho thông tin hợp với niềm tin sẵn có (d = 0,36).
  loai: so-lieu
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n31
  cau: Mức ưu tiên ấy yếu đi khi niềm tin không quan trọng với người đó hay không được giữ chắc, và khi thông tin sẵn có kém chất lượng.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n32
  cau: "Đang tranh cãi: đó có phải là một thiên kiến có hại hay không."
  loai: nhan
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n33
  cau: "Klayman và Ha (1987) lập luận rằng nhiều hiện tượng gọi là thiên kiến xác nhận thực chất là chiến lược kiểm tra tích cực: thử những trường hợp được cho là có đặc tính cần kiểm tra thay vì những trường hợp được cho là không có."
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n34
  cau: Theo Klayman và Ha, trong điều kiện thực tế chiến lược này có thể là một cách làm rất tốt để xác định giả thuyết đúng hay sai, dù vẫn có thể gây lỗi hệ thống hay kém hiệu quả, như ở nhiệm vụ 2–4–6.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n35
  cau: Các nhà nghiên cứu còn tranh luận xem đây là một khiếm khuyết cần sửa hay một lối tắt tư duy chỉ thỉnh thoảng phản tác dụng.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n36
  cau: "Thiên kiến xác nhận theo nghĩa hẹp (Nickerson): xu hướng có hệ thống tìm thông tin ủng hộ niềm tin sẵn có, diễn giải thông tin mơ hồ theo hướng có lợi cho nó, và nhớ lại có chọn lọc."
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n37
  cau: Vấn đề chỉ nảy sinh khi giả thuyết quá hẹp so với sự thật, như trong nhiệm vụ 2–4–6, nơi quy tắc thật rộng hơn nhiều so với phỏng đoán "số chẵn tăng đều".
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n38
  cau: Khi muốn biết "thuốc này có chữa được bệnh không", cách tự nhiên là thử thuốc lên người bệnh chứ không phải lên người khỏe; theo Klayman và Ha, thói quen thử trường hợp "dương tính" như vậy thường là cách làm tốt trong điều kiện thực tế.
  loai: dinh-nghia
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n39
  cau: Theo Nickerson, ta dễ tin điều mình mong là đúng hơn điều mình muốn nó sai; ta có thể chọn lọc bằng chứng tìm kiếm và "nghiêng cán cân" khi cân nhắc, nhưng không thể phớt lờ hoàn toàn bằng chứng trái chiều.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n40
  cau: Điều này khớp với thí nghiệm của Lord, Ross và Lepper (1979), nơi mỗi phe đánh giá nghiên cứu ủng hộ quan điểm mình là thuyết phục hơn.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n41
  cau: Trước khi thu thập thêm bằng chứng ủng hộ, hãy viết ra một quan sát cụ thể mà nếu xảy ra sẽ khiến bạn bỏ giả thuyết; ở nhiệm vụ 2–4–6, đừng chỉ thử 8–10–12, hãy thử 2–3–4.
  loai: loi-khuyen
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n42
  cau: 'Đang tranh cãi (chip ở mục 1): hỏi "Điều gì sẽ chứng minh tôi sai?" giúp giảm thiên kiến xác nhận.'
  loai: nhan
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n43
  cau: Theo Nickerson (dẫn Evans, 1989), các thí nghiệm hướng dẫn người tham gia tìm bằng chứng bác bỏ đôi khi làm đổi hành vi nhưng thường không cải thiện thành tích.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n44
  cau: Trong thí nghiệm của Lord, Lepper và Preston (1984), người được yêu cầu xét điều ngược lại đã bớt thiên lệch khi đánh giá bằng chứng hơn so với những người chỉ được dặn hãy công bằng, không thiên vị.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n45
  cau: Khi đọc một bài báo hoàn toàn đồng tình với quan điểm của bạn, hãy dành vài phút xét vì sao điều ngược lại có thể đúng (tưởng tượng mình phải viết bài phản biện).
  loai: loi-khuyen
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n46
  cau: 'Khá vững (chip ở mục 2): "xét điều ngược lại" giúp đánh giá bằng chứng bớt thiên lệch.'
  loai: nhan
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n47
  cau: Gợi ý viết ra dự đoán của mình trước khi xem dữ liệu, để đối chiếu với dự đoán đã ghi thay vì với trí nhớ.
  loai: loi-khuyen
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n48
  cau: Kỹ thuật chỉ định người phản biện (devil's advocate) có hiệu quả đưa bằng chứng trái chiều vào bàn (chip Khá vững; "không xóa được thiên kiến của từng cá nhân, nhưng...").
  loai: loi-khuyen
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n49
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra nhiệm vụ 2–4–6 hay các dạng thiên kiến xác nhận tương tự trên người Việt; chưa có dữ liệu để kết luận người Việt "miễn nhiễm" hay "dễ mắc hơn".
  loai: thoi-su
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n50
  cau: Sự phân cực do người tham gia tự báo cáo về án tử hình rõ hơn ở người có quan điểm ban đầu cực đoan so với vừa phải (Miller và cộng sự, 1993); ở những chủ đề người Việt có niềm tin mạnh, ta có thể dự đoán hiệu ứng tương tự, nhưng đó chỉ là dự đoán.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n51
  cau: Người tham gia của Wason là sinh viên được mô tả là thông minh, và Nickerson (1998) nhấn mạnh thiên kiến này cũng được thấy ở những người làm khoa học.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n52
  cau: Mười dãy số chẵn tăng đều đều "đúng" cũng không loại trừ được quy tắc thật; số lượng bằng chứng khẳng định không bù được cho sự vắng mặt của một phép thử bác bỏ.
  loai: loi-khuyen
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n55
  cau: 'Câu hỏi 1: các dãy như 8–10–12, 20–22–24 không giúp vì chúng phù hợp cả với phỏng đoán sai ("số chẵn tăng đều") lẫn quy tắc thật ("ba số tăng dần bất kỳ"), nên không loại trừ được gì; một phép thử chỉ có giá trị khi có khả năng chứng minh bạn sai.'
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n56
  cau: "Câu hỏi 2: chỉ 6 trong 29 người tìm ra quy tắc đúng mà không nêu sai lần nào; phần lớn nêu sai ít nhất một lần (13 + 9 = 22 người)."
  loai: so-lieu
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n57
  cau: 'Câu hỏi 3: theo Klayman và Ha (1987), nhiều hiện tượng gọi là "thiên kiến xác nhận" thực chất là chiến lược kiểm tra tích cực, có thể là cách làm tốt trong điều kiện thực tế nhưng đôi khi gây lỗi hệ thống.'
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n58
  cau: "Câu hỏi 4: mỗi phe đánh giá nghiên cứu ủng hộ mình là thuyết phục hơn, và cả hai đều nói mình tin chắc hơn trước (thái độ cực đoan hơn theo hướng ban đầu, tự báo cáo)."
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n59
  cau: 'Câu hỏi 5: kỹ thuật "xét điều ngược lại" giúp đánh giá bằng chứng bớt thiên lệch hơn lời dặn chung chung hãy công bằng; nó không đảm bảo bạn sẽ đổi ý.'
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t1
  cau: "Mô tả: Kunda (1990) nêu lập luận có động cơ: ta suy luận không như thẩm phán vô tư mà như luật sư bào chữa cho kết luận mình muốn."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t2
  cau: "Mô tả: một số nghiên cứu thấy người giỏi suy luận còn bào chữa giỏi hơn, nhưng bằng chứng này chưa chắc."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t3
  cau: 'Khung "Tự trải nghiệm" (đáp án): phản ứng thường gặp, khớp "thiên kiến phủ nhận" của Taber và Lodge (2006), là phản biện lập luận trái chiều bằng một loạt câu hỏi soi mói, chứ không phải "mình sai rồi".'
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t4
  cau: 'Khi suy luận, ta tìm luận cứ có lợi và đánh giá bất đối xứng: phản biện lập luận trái chiều, dễ dãi với lập luận cùng phe (ẩn dụ "luật sư bào chữa").'
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t5
  cau: Ziva Kunda gọi sự bất đối xứng này là lập luận có động cơ (motivated reasoning) trong bài tổng quan năm 1990.
  loai: lich-su
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t6
  cau: "Điểm tinh tế trong lý thuyết của Kunda: ta không thể tin bất cứ điều gì mình muốn; khả năng đó bị giới hạn bởi khả năng bịa ra một lý do nghe có vẻ hợp lý."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t7
  cau: Lập luận có động cơ còn chi phối, theo Kunda, cả cách ta truy xuất, xây dựng và đánh giá niềm tin; thiên kiến xác nhận là một phần hẹp hơn.
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t8
  cau: Kunda (1990) là bài tổng quan lý thuyết trên Psychological Bulletin, gom nhiều nghiên cứu rải rác về cách động cơ ảnh hưởng đến suy luận thành một khung chung.
  loai: lich-su
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t9
  cau: "Kunda phân biệt hai loại động cơ: đi đến kết luận đúng (accuracy goals) và đi đến kết luận mình muốn (directional goals)."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t10
  cau: "Khi động cơ muốn kết luận X chiếm ưu thế, ta dùng những niềm tin và chiến lược dễ dẫn đến X nhất, qua ba con đường: truy xuất, xây dựng và đánh giá niềm tin, kể cả tìm kiếm thiên lệch trong trí nhớ."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t11
  cau: Ta chỉ tin được điều mình muốn khi nào dựng được một lý do biện minh nghe có vẻ hợp lý ("phanh" của lý thuyết).
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t12
  cau: Chính "phanh" này giải thích vì sao ta vừa thiên lệch vừa luôn cảm thấy mình rất có lý.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t13
  cau: "Taber và Lodge (2006): hai thí nghiệm về cách người ta đánh giá lập luận về chính sách ưu tiên và kiểm soát súng; người tham gia đọc lập luận ủng hộ và phản đối rồi đánh giá chúng."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t14
  cau: Ở một phần của nghiên cứu, người tham gia được tự chọn nguồn của các lập luận mình đọc.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t15
  cau: "Hiệu ứng thái độ có sẵn: lập luận cùng quan điểm sẵn có được đánh giá là mạnh hơn lập luận trái quan điểm."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t16
  cau: "Thiên kiến phủ nhận: người đọc phản biện các lập luận trái chiều và chấp nhận lập luận cùng chiều mà không xét nét."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t17
  cau: "Thiên kiến xác nhận: khi được tự chọn nguồn, người tham gia tìm bằng chứng ủng hộ quan điểm sẵn có."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t18
  cau: Theo các tác giả, cả thiên kiến xác nhận lẫn thiên kiến phủ nhận đều dẫn đến phân cực thái độ (thái độ sau mạnh hơn thái độ trước).
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t19
  cau: Điều này rõ nhất ở những người có quan điểm ban đầu mạnh nhất và am hiểu chính trị nhất.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t20
  cau: "Kahan và cộng sự (2017): khoảng 1.100 người Mỹ trưởng thành (1.111) làm một bài toán suy luận nhân quả từ bảng số liệu 2×2."
  loai: so-lieu
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t21
  cau: Một nhóm thấy dữ liệu được giới thiệu là về thuốc trị ban da mới (chủ đề trung tính); nhóm khác thấy bảng số liệu tương tự được giới thiệu là về lệnh cấm súng.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t22
  cau: Với chủ đề thuốc trị ban da, người có năng lực tính toán cao làm đúng hơn hẳn người thấp.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t23
  cau: Với chủ đề lệnh cấm súng, sự phân cực chính trị không giảm ở nhóm giỏi tính toán mà còn tăng lên.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t24
  cau: "Các tác giả gọi đây là số học có động cơ (motivated numeracy): động cơ bảo vệ bản sắc lái cách đọc số."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t25
  cau: Một lần làm lại lớn có đăng ký trước vẫn thấy người ta đọc số theo phe, nhưng không thấy xu hướng này tăng đều theo năng lực tính toán; nó chỉ rõ ở nhóm tính toán giỏi nhất (Persson và cộng sự, 2021).
  loai: tai-lap
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t26
  cau: "Kahan (2013): khoảng 1.750 người Mỹ làm Bài kiểm tra phản xạ nhận thức (CRT) của Frederick (2005)."
  loai: so-lieu
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t27
  cau: CRT là bài kiểm tra phản xạ nhận thức của Frederick (2005); bài toán bóng và chày là một câu của nó.
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t28
  cau: Sau khi làm CRT, người tham gia được cho biết một nghiên cứu (giả định) thấy người tin hay người không tin vào biến đổi khí hậu đạt điểm CRT cao hơn, rồi được hỏi CRT có đo được sự cởi mở không.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t29
  cau: Người có quan điểm chính trị khác nhau đánh giá CRT khác nhau tùy kết quả được nêu.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t30
  cau: Theo tóm tắt, những người đạt điểm CRT cao nhất lại là những người dễ thể hiện suy luận có động cơ nhất.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t31
  cau: "Tappin, Pennycook và Rand (2021): khi kiểm soát niềm tin có sẵn, bản sắc chính trị vẫn có tác động trực tiếp lên suy luận."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t32
  cau: Tappin, Pennycook và Rand (2021) không thấy bằng chứng rõ rằng sự tinh tường nhận thức làm tăng tác động của bản sắc chính trị lên suy luận.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t33
  cau: "Nhãn Khá vững: ta có xu hướng đánh giá thông tin theo hướng có lợi cho điều mình muốn tin."
  loai: nhan
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t34
  cau: "Ditto và cộng sự (2019): phân tích tổng hợp 51 thí nghiệm, hơn 18.000 người, thấy thiên lệch theo phe rõ (r = 0,245), tương đương ở người thiên tả (r = 0,235) và thiên hữu (r = 0,255)."
  loai: so-lieu
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t35
  cau: "Nhãn Đang tranh cãi: đọc bằng chứng trái chiều có khiến hai phe càng xa nhau không?"
  loai: nhan
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t36
  cau: 'Lord, Ross và Lepper (1979): người ủng hộ và phản đối án tử hình xem hai nghiên cứu (giả định) và báo cáo thái độ chuyển theo hướng ban đầu; "phân cực" là do người tham gia tự báo cáo.'
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t37
  cau: Khi đo thái độ trước và sau, Miller và cộng sự (1993) không thấy phân cực; Kuhn và Lao (1996) thấy phân cực thật là kết quả có thật nhưng hiếm gặp.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t38
  cau: Ba thí nghiệm lớn gần đây không thấy người ta tin chắc hơn sau khi đọc bằng chứng trái chiều (Guess và Coppock, 2020).
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t39
  cau: Điều vững hơn là ta đánh giá bằng chứng thiên lệch về phía mình.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t40
  cau: "Nhãn Đang tranh cãi: ranh giới giữa suy luận có động cơ và đánh giá hợp lý."
  loai: nhan
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t41
  cau: Bago và cộng sự (2023), về biến đổi khí hậu, không thấy hỗ trợ cho việc suy luận nhiều hơn làm tăng tác động của bản sắc chính trị so với các cách giải thích khác.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t42
  cau: "Nhãn Đã bị bác bỏ: cứ đưa đủ sự thật là người ta sẽ đổi ý."
  loai: nhan
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t43
  cau: "Kunda phân biệt hai loại mục tiêu: đúng và đạt kết luận mình muốn; mục tiêu chính xác dùng niềm tin và chiến lược hợp lý nhất, mục tiêu định hướng dùng những cái dễ dẫn đến kết luận mong muốn."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t44
  cau: Theo Kunda, các nghiên cứu thường tạo mục tiêu chính xác bằng cách tăng cái giá của việc phán đoán sai.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t45
  cau: "Nhận thức bảo vệ bản sắc (Kahan): trong các tranh cãi công cộng (biến đổi khí hậu, bạo lực súng đạn, an ninh quốc gia), niềm tin của ta là dấu hiệu lòng trung thành với nhóm; đổi ý đe dọa vị trí trong cộng đồng."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t46
  cau: Theo luận điểm bảo vệ bản sắc, năng lực suy luận được huy động để bảo vệ huy hiệu đó, và người giỏi suy luận có thể bảo vệ giỏi hơn (Kahan và cộng sự, 2017); lần làm lại năm 2021 chưa xác nhận rõ.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t47
  cau: "Stanovich, West và Toplak (2013): thiên lệch phe mình (myside bias) liên quan rất ít đến trí thông minh; người thông minh hơn không hẳn ít thiên lệch hơn."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t48
  cau: "Gợi ý 1: viết ra một bằng chứng cụ thể mà nếu tồn tại sẽ khiến bạn bỏ quan điểm hiện tại; không nghĩ ra thì có thể nên xem lại mình đang tìm sự thật hay bảo vệ lập trường (gợi ý của site, không phải kết quả nghiên cứu)."
  loai: loi-khuyen
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t49
  cau: "Gợi ý 2 (chip Khá vững): cân nhắc điều ngược lại giúp giảm thiên lệch khi đánh giá bằng chứng."
  loai: nhan
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t50
  cau: Lord, Lepper và Preston (1984) thấy chỉ dẫn "hãy cân nhắc điều ngược lại" giảm thiên lệch khi đánh giá bằng chứng nhiều hơn lời dặn "hãy công bằng".
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t51
  cau: Một nghiên cứu năm 2023 về COVID-19 thấy cân nhắc điều ngược lại sửa được phần nào thiên lệch, dù các cách sửa khác cho kết quả lẫn lộn (Greitemeyer, 2023).
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t52
  cau: Viết ra lập luận mạnh nhất cho quan điểm mình phản đối ("steelmanning") là một cách vận dụng ý này; chúng tôi không tìm thấy nghiên cứu nào kiểm tra riêng cách ấy.
  loai: loi-khuyen
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t53
  cau: 'Gợi ý 3: khi nổi nóng vì một số liệu, tự hỏi giận vì số liệu sai hay vì nó khiến "phe mình" trông tệ; phân biệt được giúp biết mình đang xét số liệu hay bảo vệ bản sắc (gợi ý của site).'
  loai: loi-khuyen
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t54
  cau: 'Gợi ý 4: tìm người cùng quan điểm nhưng có tiếng là công bằng với bằng chứng ("Hệ 2 thuê ngoài").'
  loai: loi-khuyen
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t56
  cau: Taber và Lodge (2006) hỏi về hai chủ đề chính trị Mỹ (kiểm soát súng, chính sách ưu tiên); Kahan và cộng sự (2017) khảo sát người Mỹ trưởng thành; Kunda (1990) là bài tổng quan của một tác giả ở Đại học Princeton (Mỹ).
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t57
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu công bố nào kiểm tra lập luận có động cơ về chính trị hay số học có động cơ trên người Việt.
  loai: thoi-su
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t58
  cau: 'Dự đoán (suy luận của site): nếu niềm tin là dấu hiệu lòng trung thành với nhóm, thì ở những nền văn hóa coi trọng hòa hợp tập thể và "giữ thể diện", động cơ này có thể mạnh hơn; cần nghiên cứu thực nghiệm trên người Việt.'
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t59
  cau: "Ngộ nhận: người thông minh, học cao thì không bị. Stanovich và cộng sự (2013) thấy thiên lệch phe mình liên quan rất ít đến trí thông minh; Kahan (2013) thấy người điểm CRT cao nhất dễ suy luận theo động cơ nhất, nhưng Tappin và cộng sự (2021) không thấy bằng chứng rõ cho việc sự tinh tường làm tăng hiệu ứng này."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t60
  cau: "Ngộ nhận: lập luận có động cơ nghĩa là cố tình nói dối. Không: Kunda mô tả quá trình dựng lý do nghe hợp lý; Kahan (2013) mô tả áp lực này là vô thức (unconscious pressure); người đọc phản biện lập luận trái chiều và chấp nhận lập luận cùng chiều mà không xét nét."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t61
  cau: "Ngộ nhận: chỉ phe bên kia mới thiên lệch. Phân tích tổng hợp 51 thí nghiệm (Ditto và cộng sự, 2019) thấy mức thiên lệch theo phe tương đương ở người thiên tả và thiên hữu."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t62
  cau: 'Ngộ nhận: tin điều vô lý vì thiếu thông tin. Mô hình "thiếu thông tin" một mình không đủ giải thích: người giỏi tính toán hơn không bớt phân cực (Kahan 2017) và người ta vẫn đọc số theo phe (Persson 2021); nhưng thông tin không vô ích (Guess và Coppock 2020 không thấy "phản tác dụng").'
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t65
  cau: "Quiz 1: điểm khác biệt cốt lõi: thẩm phán cân nhắc bằng chứng để đi đến kết luận, còn luật sư đã có sẵn kết luận cần bảo vệ rồi mới đi tìm bằng chứng phục vụ nó; lập luận có động cơ là thứ tự bị đảo ngược."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t66
  cau: 'Quiz 2: theo Kunda (1990), điều giới hạn khả năng "tin điều mình muốn" là khả năng dựng được một lý do biện minh nghe có vẻ hợp lý.'
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t67
  cau: 'Quiz 3: với bảng số liệu về lệnh cấm súng, nhóm giỏi tính toán nhất phân cực mạnh nhất; một lần làm lại năm 2021 chưa xác nhận rõ phần "càng giỏi càng lái khéo".'
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t68
  cau: "Quiz 4: trong Taber và Lodge (2006), thái độ của người tham gia trở nên mạnh hơn trước (phân cực thái độ), rõ nhất ở người có quan điểm ban đầu mạnh nhất và am hiểu chính trị nhất; thiên kiến phủ nhận: phản biện bằng chứng trái chiều, dễ dãi với bằng chứng cùng chiều."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t69
  cau: 'Quiz 5: mô hình "thiếu thông tin" không đủ để giải thích, vì người có quan điểm khác nhau đánh giá thông tin lệch theo phe, kể cả người giỏi tính toán; nếu cách đánh giá đã lệch theo phe, thêm thông tin chưa chắc làm người ta đổi ý, nhưng không có nghĩa thông tin vô ích.'
  loai: phat-hien
- trang: kham-pha/tu-duy/dunning-kruger
  id: n56
  cau: "Nhãn Vững chắc: con người nhìn chung tự xếp mình trên mức trung bình."
  loai: nhan
- trang: kham-pha/tu-duy/dunning-kruger
  id: n57
  cau: "Nhãn Khá vững: phản hồi và huấn luyện giúp người yếu tự đánh giá sát hơn (huấn luyện ngắn ở Kruger–Dunning nghiên cứu 4; phản hồi ở Ryvkin và cộng sự 2012)."
  loai: nhan
- trang: kham-pha/tu-duy/dunning-kruger
  id: n59
  cau: "Nhãn Đang tranh cãi: đường cong Dunning–Kruger là hiện tượng tâm lý thật hay nhiễu thống kê."
  loai: nhan
- trang: kham-pha/tu-duy/dunning-kruger
  id: n65
  cau: 'Nhãn Đã bị bác bỏ: đường cong "núi ngu dốt" là đồ thị từ nghiên cứu gốc.'
  loai: nhan
- trang: kham-pha/tu-duy/dunning-kruger
  id: n71
  cau: "Một cách đọc thận trọng: có thể có phần tâm lý thật, nhưng độ lớn của nó trong các đồ thị lan truyền có thể bị phóng đại bởi nhiễu thống kê; chúng tôi không thấy nguồn nào nói hai phía đã đi đến một kết luận chung."
  loai: nhan
- trang: kham-pha/tu-duy/dunning-kruger
  id: n74
  cau: "Chip Khá vững của lời khuyên 2: phản hồi và huấn luyện giúp người yếu tự đánh giá sát hơn."
  loai: nhan
- trang: kham-pha/tu-duy/dunning-kruger
  id: n80
  cau: "Chip Đang tranh cãi của lời khuyên 4: người giỏi cũng có thể ước lượng lệch, nhưng nguyên nhân còn tranh cãi."
  loai: nhan
- trang: kham-pha/tu-duy/dunning-kruger
  id: n61
  cau: Một lần làm lại lớn, khoảng 4.000 người mỗi nghiên cứu, cho thấy người kém ít nhận ra mình làm đúng hay sai hơn ở bài ngữ pháp và suy luận (Jansen và cộng sự, 2021).
  loai: so-lieu
- trang: kham-pha/tu-duy/dunning-kruger
  id: n73
  cau: "Lời khuyên 2: huấn luyện ngắn giúp nhóm yếu nhất nhìn thấy mình rõ hơn (nghiên cứu 4), phản hồi cũng giúp hiệu chỉnh (Ryvkin); áp vào đàn em, nhân viên mới, con cái là sự vận dụng của site: cho họ bài tập có đáp án đúng rõ ràng và phản hồi nhanh."
  loai: loi-khuyen
- trang: kham-pha/tu-duy/dunning-kruger
  id: n27
  cau: "Con số mỗi nghiên cứu hơi khác nhau (ví dụ nghiên cứu 1: nhóm yếu nhất tự xếp ở phân vị 58)."
  loai: so-lieu
- trang: kham-pha/tu-duy/dunning-kruger
  id: n54
  cau: Hiệu ứng better-than-average nhỏ hơn ở người Đông Á so với người Mỹ gốc Âu.
  loai: so-lieu
- trang: kham-pha/tu-duy/dunning-kruger
  id: n90
  cau: "Ngộ nhận: người thông minh miễn nhiễm. Nghiên cứu gốc đo năng lực theo từng lĩnh vực (hài hước, ngữ pháp, logic) và không bàn đến chuyện ai miễn nhiễm; ví dụ bác sĩ giỏi mới vào lĩnh vực đầu tư là giả định."
  loai: phat-hien
- trang: kham-pha/tu-duy/dunning-kruger
  id: n18
  cau: 'Nghiên cứu 1: "đáp án đúng" là mức độ trùng khớp với đánh giá của một nhóm diễn viên hài chuyên nghiệp.'
  loai: phat-hien
- trang: kham-pha/tu-duy/dunning-kruger
  id: n67
  cau: "Gánh nặng kép: cùng một vốn kiến thức vừa để làm đúng, vừa để chấm đúng bài của mình."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/dunning-kruger
  id: n72
  cau: 'Lời khuyên 1: ở lĩnh vực ít phản hồi khách quan, hãy tìm một "bảng điểm" bên ngoài; trong các thí nghiệm hiệu chỉnh, người kém nhất cải thiện nhiều nhất sau phản hồi (Ryvkin và cộng sự, 2012).'
  loai: loi-khuyen
