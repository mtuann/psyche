- trang: bang-chung/tuong-quan-nhan-qua
  id: t1
  cau: '"Người uống cà phê sống lâu hơn" — một tiêu đề kiểu này từng xuất hiện trên nhiều báo năm 2012.'
  loai: lich-su
- trang: bang-chung/tuong-quan-nhan-qua
  id: t2
  cau: Hơn 400.000 người Mỹ từ 50 đến 71 tuổi được theo dõi trong khoảng 13 năm.
  loai: so-lieu
- trang: bang-chung/tuong-quan-nhan-qua
  id: t3
  cau: Sau khi tính đến các yếu tố như hút thuốc, người uống 2–3 tách cà phê mỗi ngày có nguy cơ tử vong thấp hơn khoảng 10–13% so với người không uống.
  loai: so-lieu
- trang: bang-chung/tuong-quan-nhan-qua
  id: t4
  cau: "Khi mới chỉ điều chỉnh theo tuổi, kết quả ngược lại: người uống cà phê có nguy cơ tử vong cao hơn."
  loai: phat-hien
- trang: bang-chung/tuong-quan-nhan-qua
  id: t5
  cau: Người uống cà phê cũng hay hút thuốc hơn.
  loai: phat-hien
- trang: bang-chung/tuong-quan-nhan-qua
  id: t6
  cau: Điều chỉnh thêm theo việc hút thuốc và các yếu tố khác đã đủ đảo chiều kết luận.
  loai: phat-hien
- trang: bang-chung/tuong-quan-nhan-qua
  id: t7
  cau: Bản thân các tác giả viết rõ rằng nghiên cứu không thể kết luận cà phê gây ra tuổi thọ dài hơn; họ chỉ có thể nói hai thứ đi cùng nhau.
  loai: phat-hien
- trang: bang-chung/tuong-quan-nhan-qua
  id: t8
  cau: "Hai biến tương quan khi chúng thay đổi cùng nhau: biến này cao thì biến kia thường cũng cao (tương quan dương), hoặc thường thấp (tương quan âm); mức độ đo bằng hệ số tương quan r, từ −1 đến +1."
  loai: dinh-nghia
- trang: bang-chung/tuong-quan-nhan-qua
  id: t9
  cau: "r gần 0: mối quan hệ yếu, khó dự đoán biến này từ biến kia; r gần +1 hoặc −1: các điểm gần một đường thẳng, biến này dự đoán biến kia tốt."
  loai: dinh-nghia
- trang: bang-chung/tuong-quan-nhan-qua
  id: t13
  cau: Trong một tổng hợp về khác biệt cá nhân, các tác giả xếp r = 0,30 vào mức "lớn".
  loai: so-lieu
- trang: bang-chung/tuong-quan-nhan-qua
  id: t14
  cau: "Nhân quả ngược: B gây ra A (ví dụ người đang ốm có thể đã bỏ cà phê) là một cách giải thích có thể cho tương quan."
  loai: dinh-nghia
- trang: bang-chung/tuong-quan-nhan-qua
  id: t15
  cau: Một yếu tố C gây ra cả hai biến (biến gây nhiễu) là một cách giải thích có thể cho tương quan.
  loai: dinh-nghia
- trang: bang-chung/tuong-quan-nhan-qua
  id: t16
  cau: "Còn khả năng thứ tư: nếu tìm đủ nhiều cặp biến, sẽ có những cặp tương quan mà không có mối liên hệ nhân quả nào."
  loai: phat-hien
- trang: bang-chung/tuong-quan-nhan-qua
  id: t17
  cau: Biến gây nhiễu (confounding variable) là yếu tố liên quan đến cả hai biến đang xét, khiến chúng trông như có quan hệ nhân quả.
  loai: dinh-nghia
- trang: bang-chung/tuong-quan-nhan-qua
  id: t18
  cau: Các nghiên cứu tốt cố gắng "kiểm soát" những biến gây nhiễu đã biết, như Freedman và cộng sự đã làm với hút thuốc.
  loai: phat-hien
- trang: bang-chung/tuong-quan-nhan-qua
  id: t19
  cau: Phân tích thống kê chỉ xử lý được những biến đã đo, và đo chưa hoàn hảo; những biến chưa ai nghĩ tới thì không xử lý được.
  loai: phat-hien
- trang: bang-chung/tuong-quan-nhan-qua
  id: t20
  cau: Cách mạnh nhất để cân bằng cả những biến gây nhiễu chưa biết là thí nghiệm có phân nhóm ngẫu nhiên.
  loai: phat-hien
- trang: bang-chung/tuong-quan-nhan-qua
  id: t21
  cau: Năm 2012, Messerli đăng trên tạp chí New England Journal of Medicine một bài viết ngắn về sô-cô-la và giải Nobel.
  loai: lich-su
- trang: bang-chung/tuong-quan-nhan-qua
  id: t22
  cau: Messerli là bác sĩ chuyên về tăng huyết áp.
  loai: lich-su
- trang: bang-chung/tuong-quan-nhan-qua
  id: t23
  cau: Ở 23 quốc gia, lượng sô-cô-la tiêu thụ trên đầu người tương quan rất mạnh với số người đoạt giải Nobel trên đầu người, r = 0,79.
  loai: so-lieu
- trang: bang-chung/tuong-quan-nhan-qua
  id: t24
  cau: Tác giả nêu giả thuyết rằng flavanol trong ca cao có thể cải thiện nhận thức ở cấp dân số, đồng thời nói tới cả khả năng nhân quả ngược.
  loai: phat-hien
- trang: bang-chung/tuong-quan-nhan-qua
  id: t25
  cau: "Các phân tích sau đó không ủng hộ cách hiểu nhân quả: khi tính thêm những thực phẩm giàu flavanol khác, cách hiểu ấy không đứng vững."
  loai: phat-hien
- trang: bang-chung/tuong-quan-nhan-qua
  id: t26
  cau: Số giải Nobel của một nước được dự đoán chủ yếu bởi hoạt động khoa học, như số bài báo và chi cho nghiên cứu; thói quen ăn uống và kinh tế chỉ là yếu tố phụ.
  loai: phat-hien
- trang: bang-chung/tuong-quan-nhan-qua
  id: t27
  cau: "Nhãn Vững chắc: tương quan không đủ để kết luận nhân quả."
  loai: nhan
- trang: bang-chung/tuong-quan-nhan-qua
  id: t28
  cau: Ví dụ cà phê cho thấy việc điều chỉnh hay không điều chỉnh theo hút thuốc và các biến gây nhiễu khác có thể đảo ngược hẳn chiều của kết quả.
  loai: phat-hien
- trang: bang-chung/tuong-quan-nhan-qua
  id: t29
  cau: Nhiều câu hỏi không thể làm thí nghiệm (không thể bắt người ta hút thuốc 30 năm).
  loai: phat-hien
- trang: bang-chung/tuong-quan-nhan-qua
  id: t30
  cau: Khi nhiều phương pháp khác nhau, với các nguồn sai lệch khác nhau, cùng chỉ về một hướng, kết quả ít có khả năng là giả hơn nhiều.
  loai: phat-hien
- trang: bang-chung/tuong-quan-nhan-qua
  id: t31
  cau: Động từ như "liên quan đến", "gắn với", "đi kèm" thường chỉ tương quan; "làm tăng", "gây ra", "giúp", "khiến", "bảo vệ khỏi" là khẳng định nhân quả.
  loai: phat-hien
- trang: bang-chung/tuong-quan-nhan-qua
  id: t32
  cau: "Cần hỏi: nghiên cứu là quan sát hay thí nghiệm (chia nhóm ngẫu nhiên và can thiệp); nếu là quan sát thì biến gây nhiễu nào có thể giải thích kết quả; có khả năng nhân quả ngược không."
  loai: loi-khuyen
- trang: bang-chung/tuong-quan-nhan-qua
  id: t33
  cau: Nếu tin tức dùng động từ nhân quả cho một nghiên cứu quan sát, đó là dấu hiệu cảnh báo.
  loai: loi-khuyen
- trang: bang-chung/tuong-quan-nhan-qua
  id: b1
  cau: 'Với tiêu đề "Trẻ đi học thêm nhiều có điểm thi cao hơn": biến gây nhiễu (gia đình có điều kiện vừa cho con học thêm vừa có nhiều nguồn lực khác) và nhân quả ngược (học sinh vốn học tốt lại học thêm nhiều) là các cách giải thích khác có thể có.'
  loai: loi-khuyen
- trang: bang-chung/tuong-quan-nhan-qua
  id: b2
  cau: 'Với "Người hay dùng mạng xã hội có nhiều triệu chứng lo âu hơn": nhân quả ngược (người đang lo âu tìm đến mạng xã hội nhiều hơn) và biến gây nhiễu (cô đơn, căng thẳng công việc) là các cách giải thích khác có thể có.'
  loai: loi-khuyen
- trang: bang-chung/tuong-quan-nhan-qua
  id: b3
  cau: 'Với "Những thành phố có nhiều cảnh sát hơn có nhiều tội phạm hơn": nhân quả ngược (nơi nhiều tội phạm được bố trí nhiều cảnh sát hơn) và biến gây nhiễu (thành phố đông dân có nhiều cả hai) là các cách giải thích khác có thể có.'
  loai: loi-khuyen
- trang: bang-chung/tuong-quan-nhan-qua
  id: b4
  cau: 'Với "Người ngủ trưa thường xuyên có huyết áp thấp hơn": biến gây nhiễu (người có thời gian ngủ trưa có thể có công việc ít căng thẳng hơn hay lối sống khác) là cách giải thích khác có thể có.'
  loai: loi-khuyen
- trang: bang-chung/tuong-quan-nhan-qua
  id: b5
  cau: 'Với "Học sinh ăn sáng đầy đủ học giỏi hơn": biến gây nhiễu (gia đình có điều kiện chăm lo bữa sáng cũng thường chăm lo việc học) là cách giải thích khác có thể có.'
  loai: loi-khuyen
- trang: bang-chung/tuong-quan-nhan-qua
  id: q1
  cau: "Nghiên cứu cà phê 2012: điều chỉnh hay không điều chỉnh theo hút thuốc và các yếu tố gây nhiễu khác có thể đảo ngược chiều của kết quả; khi mới điều chỉnh theo tuổi, uống cà phê đi kèm nguy cơ tử vong cao hơn; ngay cả các tác giả cũng không kết luận nhân quả."
  loai: phat-hien
- trang: bang-chung/tuong-quan-nhan-qua
  id: q2
  cau: Tương quan giữa sô-cô-la và giải Nobel (r = 0,79) giữa các nước không chứng minh nhân quả; các phân tích sau đó thấy hoạt động khoa học của mỗi nước dự đoán số giải Nobel tốt hơn sô-cô-la. Tương quan rất mạnh không làm cho kết luận nhân quả mạnh hơn; những yếu tố khác có thể tạo ra tương quan rất cao.
  loai: phat-hien
- trang: bang-chung/tuong-quan-nhan-qua
  id: q3
  cau: Chữ "giúp" là một động từ nhân quả; nếu nghiên cứu chỉ quan sát, cách nói này đi xa hơn bằng chứng.
  loai: loi-khuyen
- trang: bang-chung/tuong-quan-nhan-qua
  id: q4
  cau: Mẫu lớn chỉ làm kết quả chính xác hơn, kể cả khi kết quả đó bị nhiễu; kiểm soát thống kê chỉ xử lý được các biến đã đo; phân nhóm ngẫu nhiên, khi đủ đông, làm các nhóm ít khác nhau một cách có hệ thống về mọi mặt, kể cả những mặt không ai đo.
  loai: phat-hien
- trang: bang-chung/tuong-quan-nhan-qua
  id: q5
  cau: "Hệ số tương quan r = −0,5: biến này cao thì biến kia có xu hướng thấp, ở mức khá rõ; dấu âm cho biết chiều, con số cho biết độ chặt; r không phải phần trăm thay đổi và không nói gì về nhân quả."
  loai: dinh-nghia
- trang: bang-chung/thi-nghiem-doi-chung
  id: d1
  cau: "Điểm căng thẳng có thể giảm vì hồi phục tự nhiên: nhiều khó khăn tự dịu đi theo thời gian."
  loai: phat-hien
- trang: bang-chung/thi-nghiem-doi-chung
  id: d2
  cau: "Hồi quy về trung bình: nếu người ta tham gia đúng lúc điểm đang cao bất thường, lần đo sau thường thấp hơn, dù có làm gì hay không."
  loai: dinh-nghia
- trang: bang-chung/thi-nghiem-doi-chung
  id: d3
  cau: "Kỳ vọng: người tin rằng mình đang được giúp có thể cảm thấy, và trả lời bảng hỏi, tốt hơn."
  loai: phat-hien
- trang: bang-chung/thi-nghiem-doi-chung
  id: d4
  cau: Người tham gia có thể trả lời theo điều họ nghĩ nhà nghiên cứu mong đợi.
  loai: phat-hien
- trang: bang-chung/thi-nghiem-doi-chung
  id: d5
  cau: Nhóm đối chứng là nhóm giống nhóm can thiệp, chỉ khác ở chỗ không nhận can thiệp; mọi yếu tố trên đều tác động lên cả hai nhóm, nên chênh lệch giữa hai nhóm mới là tác dụng của can thiệp.
  loai: dinh-nghia
- trang: bang-chung/thi-nghiem-doi-chung
  id: d6
  cau: "Phân nhóm ngẫu nhiên, khi đủ đông người, giúp hai nhóm ít khác nhau một cách có hệ thống về mọi mặt: tuổi, tính cách, mức căng thẳng ban đầu, và cả những yếu tố không ai nghĩ đến."
  loai: phat-hien
- trang: bang-chung/thi-nghiem-doi-chung
  id: d7
  cau: Nếu để người tham gia tự chọn nhóm, những người háo hức nhất có thể chọn dùng ứng dụng, và chính sự háo hức ấy có thể giải thích kết quả.
  loai: phat-hien
- trang: bang-chung/thi-nghiem-doi-chung
  id: d8
  cau: Thí nghiệm ngẫu nhiên có đối chứng là cách mạnh nhất để kết luận nhân quả.
  loai: phat-hien
- trang: bang-chung/thi-nghiem-doi-chung
  id: d9
  cau: Giả dược (placebo) là một can thiệp trông giống thật nhưng không có thành phần được cho là có tác dụng, như viên thuốc đường hay một ứng dụng "nghe nhạc thư giãn" thay cho ứng dụng thiền.
  loai: dinh-nghia
- trang: bang-chung/thi-nghiem-doi-chung
  id: d10
  cau: "Mù đơn: người tham gia không biết mình ở nhóm nào."
  loai: dinh-nghia
- trang: bang-chung/thi-nghiem-doi-chung
  id: d11
  cau: "Mù đôi: cả người tham gia lẫn người đo kết quả đều không biết; điều này ngăn kỳ vọng của nhà nghiên cứu ảnh hưởng đến cách họ đo và ghi nhận."
  loai: dinh-nghia
- trang: bang-chung/thi-nghiem-doi-chung
  id: d12
  cau: Nhiều cha mẹ tin rằng đường ảnh hưởng đến hành vi của trẻ.
  loai: lich-su
- trang: bang-chung/thi-nghiem-doi-chung
  id: d13
  cau: Thí nghiệm mù đôi cho trẻ ăn đường hoặc chất tạo ngọt mà người tham gia, cha mẹ và nhân viên nghiên cứu đều không biết; phân tích tổng hợp không thấy đường ảnh hưởng đến hành vi hay nhận thức của trẻ, dù chưa loại trừ được một tác dụng nhỏ hay tác dụng ở một nhóm trẻ nhất định.
  loai: phat-hien
- trang: bang-chung/thi-nghiem-doi-chung
  id: d14
  cau: Niềm tin của người lớn, chứ không phải đường, có thể là thứ khiến họ "thấy" trẻ thay đổi.
  loai: phat-hien
- trang: bang-chung/thi-nghiem-doi-chung
  id: d15
  cau: Một tổng quan Cochrane so sánh giả dược với không điều trị gì trong hơn 200 thử nghiệm ngẫu nhiên, ở khoảng 60 tình trạng bệnh khác nhau (Hróbjartsson và Gøtzsche, 2010).
  loai: so-lieu
- trang: bang-chung/thi-nghiem-doi-chung
  id: d16
  cau: Người ta hay nói giả dược có tác dụng rất mạnh.
  loai: lich-su
- trang: bang-chung/thi-nghiem-doi-chung
  id: d17
  cau: Nhìn chung, các tác giả không thấy giả dược có tác dụng lâm sàng quan trọng.
  loai: phat-hien
- trang: bang-chung/thi-nghiem-doi-chung
  id: d18
  cau: Trong một số bối cảnh, giả dược có thể ảnh hưởng đến các kết quả do người bệnh tự báo cáo, nhất là cảm giác đau và buồn nôn; ảnh hưởng lên cảm giác đau dao động từ không đáng kể đến quan trọng về lâm sàng.
  loai: phat-hien
- trang: bang-chung/thi-nghiem-doi-chung
  id: d19
  cau: Các tác giả lưu ý khó tách ảnh hưởng này khỏi việc người bệnh báo cáo thiên lệch.
  loai: phat-hien
- trang: bang-chung/thi-nghiem-doi-chung
  id: d20
  cau: Một phần mức cải thiện của "nhóm giả dược" trong các thử nghiệm thuốc có thể đến từ hồi phục tự nhiên và hồi quy về trung bình, chứ không hẳn do viên giả dược.
  loai: phat-hien
- trang: bang-chung/thi-nghiem-doi-chung
  id: d21
  cau: Tổng quan này so giả dược với không điều trị gì, thay vì chỉ nhìn mức cải thiện của nhóm giả dược, vì phần lớn báo cáo về tác dụng giả dược dựa trên nghiên cứu không phân ngẫu nhiên vào giả dược hay không điều trị.
  loai: phat-hien
- trang: bang-chung/thi-nghiem-doi-chung
  id: d22
  cau: 'Nên hỏi: có nhóm đối chứng không (chỉ "trước và sau" thì nói được rất ít về tác dụng); nhóm có chia ngẫu nhiên không; ai biết ai ở nhóm nào (kết quả tự báo cáo dễ bị kỳ vọng ảnh hưởng); nhóm đối chứng nhận gì (nên giống nhóm can thiệp ở mọi mặt trừ điều đang kiểm tra).'
  loai: loi-khuyen
- trang: bang-chung/thi-nghiem-doi-chung
  id: d23
  cau: "Nhãn Vững chắc: thí nghiệm ngẫu nhiên có đối chứng là cách mạnh nhất để kiểm tra một can thiệp."
  loai: nhan
- trang: bang-chung/thi-nghiem-doi-chung
  id: d24
  cau: "Giới hạn: không phải câu hỏi nào cũng làm thí nghiệm được (vì lý do đạo đức hoặc thực tế), và một thí nghiệm có mẫu nhỏ hay chỉ làm một lần vẫn có thể cho kết quả sai."
  loai: phat-hien
- trang: bang-chung/thi-nghiem-doi-chung
  id: d25
  cau: "Nhãn Khá vững: so với không điều trị, giả dược nhìn chung không có tác dụng lâm sàng quan trọng, nhưng có thể ảnh hưởng đến một số kết quả tự báo cáo như đau và buồn nôn."
  loai: nhan
- trang: bang-chung/thi-nghiem-doi-chung
  id: d26
  cau: "Chữ ở khung Khá vững: tổng quan Cochrane năm 2010 ghi nhận chỉ 8% số thử nghiệm có nguy cơ sai lệch thấp, và khó tách ảnh hưởng thật khỏi báo cáo thiên lệch."
  loai: so-lieu
- trang: bang-chung/thi-nghiem-doi-chung
  id: e1
  cau: "Gợi ý thiết kế lại: tuyển người tham gia rồi chia ngẫu nhiên thành hai nhóm."
  loai: loi-khuyen
- trang: bang-chung/thi-nghiem-doi-chung
  id: e2
  cau: Nhóm đối chứng dùng một ứng dụng khác trông hấp dẫn tương tự nhưng không có phần thiền, để kỳ vọng ở hai nhóm gần giống nhau.
  loai: loi-khuyen
- trang: bang-chung/thi-nghiem-doi-chung
  id: e3
  cau: Người phân tích dữ liệu không biết nhóm nào là nhóm nào.
  loai: loi-khuyen
- trang: bang-chung/thi-nghiem-doi-chung
  id: e4
  cau: Đăng ký trước kế hoạch (đo gì, khi nào, phân tích ra sao) để tách điều được dự đoán trước khỏi điều chỉ được giải thích sau khi đã thấy dữ liệu.
  loai: loi-khuyen
- trang: bang-chung/thi-nghiem-doi-chung
  id: e5
  cau: Báo cáo chênh lệch giữa hai nhóm, không chỉ mức thay đổi của nhóm dùng ứng dụng.
  loai: loi-khuyen
- trang: bang-chung/thi-nghiem-doi-chung
  id: q1
  cau: "200 người dùng một ứng dụng và căng thẳng giảm 30% sau 8 tuần: chưa thể kết luận ứng dụng có tác dụng vì không có nhóm đối chứng; hồi phục tự nhiên, hồi quy về trung bình và kỳ vọng đều có thể làm điểm giảm."
  loai: phat-hien
- trang: bang-chung/thi-nghiem-doi-chung
  id: q2
  cau: Phân nhóm ngẫu nhiên không làm từng cặp người giống nhau, nhưng với đủ người, các khác biệt sẽ cân bằng giữa hai nhóm.
  loai: phat-hien
- trang: bang-chung/thi-nghiem-doi-chung
  id: q3
  cau: Mù đôi ngăn kỳ vọng của cả hai phía (người tham gia và người đo) ảnh hưởng đến kết quả.
  loai: dinh-nghia
- trang: bang-chung/thi-nghiem-doi-chung
  id: q4
  cau: Theo tổng quan Cochrane 2010, so với không điều trị, giả dược nhìn chung không có tác dụng lâm sàng quan trọng, nhưng trong một số bối cảnh có thể ảnh hưởng đến kết quả tự báo cáo như cảm giác đau; hai câu tuyệt đối ("mạnh như thuốc thật", "hoàn toàn không có tác dụng") đều quá mức; các tác giả còn thận trọng về báo cáo thiên lệch.
  loai: phat-hien
- trang: bang-chung/do-lon-hieu-ung
  id: h1
  cau: Với một mẫu rất lớn (ví dụ 50.000 người), một chênh lệch nhỏ đến mức không ai nhận ra trong đời sống vẫn có thể có ý nghĩa thống kê.
  loai: phat-hien
- trang: bang-chung/do-lon-hieu-ung
  id: h2
  cau: '"Có ý nghĩa thống kê" cho biết kết quả khó có thể chỉ do may rủi nếu thật ra không có hiệu ứng nào.'
  loai: dinh-nghia
- trang: bang-chung/do-lon-hieu-ung
  id: h3
  cau: '"Có ý nghĩa thống kê" không cho biết hiệu ứng lớn hay nhỏ, quan trọng hay không.'
  loai: dinh-nghia
- trang: bang-chung/do-lon-hieu-ung
  id: h4
  cau: Mẫu càng lớn, những hiệu ứng càng nhỏ càng dễ có ý nghĩa thống kê.
  loai: phat-hien
- trang: bang-chung/do-lon-hieu-ung
  id: h5
  cau: Độ lớn hiệu ứng (effect size) đo chênh lệch hay mối quan hệ lớn đến đâu, theo một thang chuẩn hóa không phụ thuộc vào cỡ mẫu.
  loai: dinh-nghia
- trang: bang-chung/do-lon-hieu-ung
  id: h6
  cau: d của Cohen đo chênh lệch giữa hai nhóm bằng số độ lệch chuẩn; d = 0,5 nghĩa là trung bình nhóm này cao hơn nhóm kia nửa độ lệch chuẩn; g của Hedges gần giống d.
  loai: dinh-nghia
- trang: bang-chung/do-lon-hieu-ung
  id: h7
  cau: r là hệ số tương quan giữa hai biến.
  loai: dinh-nghia
- trang: bang-chung/do-lon-hieu-ung
  id: h8
  cau: Cohen (1988) đề xuất gọi d = 0,2 là nhỏ, 0,5 là trung bình và 0,8 là lớn.
  loai: lich-su
- trang: bang-chung/do-lon-hieu-ung
  id: h9
  cau: "Hình: hai phân bố chuẩn (độ lệch chuẩn 1) cách nhau d = 0,2; 0,5; 0,8 chồng nhau 92%, 80%, 69%."
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: h10
  cau: "Hình: xác suất một người chọn ngẫu nhiên từ nhóm B có điểm cao hơn một người chọn ngẫu nhiên từ nhóm A là 56%, 64%, 71% số cặp ứng với d = 0,2; 0,5; 0,8."
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: h11
  cau: Nếu điểm số của hai nhóm theo phân bố chuẩn với cùng độ lệch chuẩn, thì ngay cả với d = 0,8, hai nhóm vẫn chồng lên nhau khoảng 69%; nếu chọn ngẫu nhiên một người ở mỗi nhóm, người ở nhóm can thiệp chỉ cao hơn trong khoảng 71% số cặp.
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: h12
  cau: Ngay cả khi một can thiệp có hiệu ứng lớn, vẫn có không ít người ở nhóm đối chứng làm tốt hơn người ở nhóm can thiệp.
  loai: phat-hien
- trang: bang-chung/do-lon-hieu-ung
  id: h13
  cau: Theo Lakens (2013) kể lại, Cohen coi các mốc 0,2 / 0,5 / 0,8 chỉ nên dùng khi kết quả quá mới để so với các nghiên cứu liên quan.
  loai: lich-su
- trang: bang-chung/do-lon-hieu-ung
  id: h14
  cau: Các tổng hợp sau này cho thấy hiệu ứng điển hình trong tâm lý học khá khiêm tốn.
  loai: phat-hien
- trang: bang-chung/do-lon-hieu-ung
  id: h15
  cau: Gộp 322 phân tích tổng hợp trong tâm lý học xã hội, độ lớn trung bình là r = 0,21.
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: h16
  cau: Gộp 708 hệ số tương quan từ các phân tích tổng hợp về khác biệt cá nhân, các tác giả đề xuất đọc r = 0,10 / 0,20 / 0,30 là nhỏ / điển hình / lớn.
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: h17
  cau: Dưới 3% số hệ số tương quan đạt 0,50 trở lên.
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: h18
  cau: Funder và Ozer (2019) lập luận rằng một hiệu ứng nhỏ cho một sự kiện đơn lẻ vẫn có thể quan trọng khi tích lũy qua nhiều lần hoặc nhiều người.
  loai: phat-hien
- trang: bang-chung/do-lon-hieu-ung
  id: h19
  cau: "Funder và Ozer (2019): một hiệu ứng r ≥ 0,40 trong tâm lý học nhiều khả năng là ước lượng quá cao, hiếm khi giữ được trong mẫu lớn hay khi làm lại."
  loai: phat-hien
- trang: bang-chung/do-lon-hieu-ung
  id: h20
  cau: "Bảng: tự kiểm tra so với đọc lại (Rowland, 2014), g = 0,50."
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: h21
  cau: "Bảng: dạy khớp với \"phong cách học\" (Hattie và O'Leary, 2025), d = 0,04."
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: h22
  cau: 'Bảng: "cạn kiệt ý chí", dự án tái lập 36 phòng thí nghiệm (Vohs và cộng sự, 2021), d = 0,06.'
  loai: tai-lap
- trang: bang-chung/do-lon-hieu-ung
  id: h23
  cau: Nhãn Vững chắc cho hiệu ứng tự kiểm tra so với đọc lại (hàng đầu của bảng).
  loai: nhan
- trang: bang-chung/do-lon-hieu-ung
  id: h24
  cau: Nhãn Đã bị bác bỏ cho giả thuyết dạy khớp với "phong cách học" (hàng hai của bảng).
  loai: nhan
- trang: bang-chung/do-lon-hieu-ung
  id: h25
  cau: Nhãn Đang tranh cãi cho "cạn kiệt ý chí" (hàng ba của bảng).
  loai: nhan
- trang: bang-chung/do-lon-hieu-ung
  id: h26
  cau: Khi dự án Many Labs 2 làm lại 28 phát hiện ở nhiều quốc gia, độ lớn hiệu ứng trung vị giảm từ d = 0,60 ở nghiên cứu gốc xuống d = 0,15.
  loai: tai-lap
- trang: bang-chung/do-lon-hieu-ung
  id: h27
  cau: "Một lý do thường được nêu cho việc hiệu ứng co lại là thiên lệch xuất bản: kết quả mạnh dễ được đăng hơn kết quả không có hiệu ứng, nên các nghiên cứu đã đăng có thể phóng đại hiệu ứng."
  loai: phat-hien
- trang: bang-chung/do-lon-hieu-ung
  id: h28
  cau: Khi đọc một nghiên cứu đơn lẻ với hiệu ứng rất lớn, hãy thận trọng.
  loai: loi-khuyen
- trang: bang-chung/do-lon-hieu-ung
  id: h29
  cau: Nên tìm con số chênh lệch thật (ví dụ điểm trung bình tăng bao nhiêu, trên thang bao nhiêu điểm), độ lớn hiệu ứng (d, g, r), cỡ mẫu, và xem kết quả đã được làm lại chưa; mẫu rất lớn thì hiệu ứng nhỏ vẫn có ý nghĩa, mẫu rất nhỏ mà hiệu ứng rất lớn thì đáng ngờ.
  loai: loi-khuyen
- trang: bang-chung/do-lon-hieu-ung
  id: h30
  cau: 'Nhãn Vững chắc: "có ý nghĩa thống kê" không đồng nghĩa với "lớn" hay "quan trọng".'
  loai: nhan
- trang: bang-chung/do-lon-hieu-ung
  id: h31
  cau: "Việc hiệu ứng nhỏ đi khi làm lại cũng được thấy ở hai dự án tái lập lớn: Open Science Collaboration (2015) và Many Labs 2 (2018)."
  loai: tai-lap
- trang: bang-chung/do-lon-hieu-ung
  id: h32
  cau: "Bài tập: với d = 0,2, hai nhóm chồng lên nhau khoảng 92%, và nếu so ngẫu nhiên một người học với một người không học, người học chỉ hài lòng hơn trong khoảng 56% số trường hợp, so với 50% nếu khóa học không có tác dụng gì."
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: h33
  cau: "Nên hỏi thêm: kết quả đã được làm lại chưa; nhóm đối chứng nhận gì."
  loai: loi-khuyen
- trang: bang-chung/do-lon-hieu-ung
  id: q1
  cau: '"Có ý nghĩa thống kê" không nói gì về độ lớn hay tầm quan trọng, và không đảm bảo tái lập.'
  loai: phat-hien
- trang: bang-chung/do-lon-hieu-ung
  id: q2
  cau: Với d = 0,8, hai nhóm chồng lên nhau khoảng 69%; ngay cả hiệu ứng "lớn" theo quy ước của Cohen vẫn để lại phần chồng lấn rất lớn; phát hiện ở cấp độ nhóm không cho biết chắc chắn về từng người.
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: q3
  cau: Trung bình trong tâm lý học xã hội khoảng r = 0,21, và Gignac và Szodorai đề xuất đọc 0,20 là "điển hình".
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: q4
  cau: Nghiên cứu nhỏ vẫn có giá trị như một gợi ý, nhưng kinh nghiệm từ các dự án tái lập cho thấy hiệu ứng ban đầu thường bị phóng đại; một nghiên cứu 30 người báo cáo d = 1,5 cho một mẹo đơn giản nên được đón nhận thận trọng, chờ thêm bằng chứng.
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m1
  cau: Bài báo năm 2010 "The weirdest people in the world?" do Joseph Henrich, Steven Heine và Ara Norenzayan, Đại học British Columbia, viết.
  loai: lich-su
- trang: bang-chung/mau-va-chon-mau
  id: m2
  cau: '"96% người được nghiên cứu trong tâm lý học đến từ các nước chỉ chiếm 12% dân số thế giới" (con số được ba nhà khoa học Đại học British Columbia nêu trong bài báo năm 2010).'
  loai: so-lieu
- trang: bang-chung/mau-va-chon-mau
  id: m3
  cau: 'Khẳng định cũ: con số ấy "gây chấn động" và "được báo chí quốc tế đưa tin rộng rãi vào giữa năm 2010".'
  loai: lich-su
- trang: bang-chung/mau-va-chon-mau
  id: m4
  cau: "Theo phân tích của Arnett (2008) về các tạp chí hàng đầu của sáu chuyên ngành phụ trong tâm lý học, giai đoạn 2003–2007: 68% người tham gia đến từ Mỹ, và 96% đến từ các nước phương Tây công nghiệp hóa (Bắc Mỹ, châu Âu, Úc, Israel)."
  loai: so-lieu
- trang: bang-chung/mau-va-chon-mau
  id: m5
  cau: Có 73% tác giả chính của các bài báo ấy đang công tác tại các trường đại học ở Mỹ.
  loai: so-lieu
- trang: bang-chung/mau-va-chon-mau
  id: m6
  cau: Các nước phương Tây công nghiệp hóa ấy chỉ chiếm khoảng 12% dân số thế giới.
  loai: so-lieu
- trang: bang-chung/mau-va-chon-mau
  id: m7
  cau: "WEIRD viết tắt của Western, Educated, Industrialized, Rich, Democratic: người phương Tây có học, công nghiệp hóa, giàu có, dân chủ."
  loai: dinh-nghia
- trang: bang-chung/mau-va-chon-mau
  id: m8
  cau: Henrich và cộng sự lập luận rằng mẫu người được nghiên cứu không chỉ hẹp mà còn là một trong những nhóm kém đại diện nhất cho loài người.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m9
  cau: Ở nhiều lĩnh vực mà Henrich và cộng sự xem xét, như nhận thức hình ảnh, cảm nhận công bằng, lý luận đạo đức và hợp tác, người thuộc xã hội WEIRD thường là ngoại lệ so với phần còn lại của loài người.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m10
  cau: "Điểm chính của bài báo không phải là các nghiên cứu ấy làm sai, mà là phạm vi của kết luận: hỏi ai thì câu trả lời chắc chắn đúng cho những người như thế."
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m11
  cau: Mở rộng kết quả từ một nhóm hẹp ra cho cả nhân loại là bước nhảy chưa có cơ sở chắc từ trước.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m12
  cau: Tổng thể (population) là nhóm người mà ta muốn kết luận về họ; mẫu (sample) là nhóm người ta thực sự đo đạc, hỏi han.
  loai: dinh-nghia
- trang: bang-chung/mau-va-chon-mau
  id: m13
  cau: Hỏi thật nhiều người cùng một kiểu vẫn có thể cho kết quả lệch.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m14
  cau: Mẫu tốt phải giống tổng thể ở những đặc điểm quan trọng.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m15
  cau: "Chọn mẫu ngẫu nhiên: mỗi người trong tổng thể có cơ hội được chọn như nhau, như rút thăm."
  loai: dinh-nghia
- trang: bang-chung/mau-va-chon-mau
  id: m16
  cau: "Chọn mẫu thuận tiện: lấy những người dễ tiếp cận nhất (sinh viên lớp mình, người qua đường, bạn bè trên mạng)."
  loai: dinh-nghia
- trang: bang-chung/mau-va-chon-mau
  id: m17
  cau: Mẫu ngẫu nhiên có xu hướng giống tổng thể; sai số do chọn mẫu nhỏ dần khi mẫu lớn hơn.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m18
  cau: Chọn mẫu thuận tiện dễ làm, vì dùng kết quả hay người có sẵn.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m19
  cau: Chọn mẫu ngẫu nhiên phải rút thăm từ danh sách của cả tổng thể.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m20
  cau: Kết quả của chọn mẫu thuận tiện có thể rất tốt ở vài trường hợp, nhưng lệch nặng ở trường hợp khác.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m21
  cau: "Ví dụ về chọn mẫu ngẫu nhiên: bỏ tên cả lớp vào mũ rồi rút ra vài người."
  loai: dinh-nghia
- trang: bang-chung/mau-va-chon-mau
  id: m22
  cau: Phần lớn nghiên cứu tâm lý học trước nay dùng sinh viên đại học làm người tham gia.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m23
  cau: Sinh viên thường trẻ hơn, học vấn cao hơn và ít đa dạng hơn dân số chung.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m24
  cau: Mẫu toàn sinh viên không phải "con người nói chung".
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m25
  cau: Thiên lệch chọn mẫu (sampling bias) xảy ra khi cách thu thập mẫu khiến một số thành viên của tổng thể ít có khả năng được chọn hơn những người khác, và có thể dẫn tới kết luận sai về tổng thể.
  loai: dinh-nghia
- trang: bang-chung/mau-va-chon-mau
  id: m26
  cau: 'Mẫu tự nguyện: thăm dò "bạn có thích sản phẩm mới không" trên fanpage của chính công ty. Chỉ những người chọn trả lời mới có mặt trong mẫu, và người theo dõi fanpage vốn có thể đã thích thương hiệu.'
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m27
  cau: "Mẫu bỏ sót nhóm đã rời đi: khảo sát mức độ hài lòng của học viên đang học tại một trung tâm; người đã bỏ học giữa chừng không còn trong danh sách nên không có cơ hội vào mẫu."
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m28
  cau: 'Mẫu dễ tiếp cận: hỏi người qua đường ở quận 1 rồi kết luận về "người dân TP.HCM".'
  loai: dinh-nghia
- trang: bang-chung/mau-va-chon-mau
  id: m29
  cau: "Hệ quả chung là khái quát hóa quá đà: lấy kết quả từ mẫu hẹp để nói về tổng thể rộng."
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m30
  cau: Henrich và cộng sự nhận xét rằng các nhà khoa học hành vi thường đưa ra kết luận rộng về tâm lý con người dựa trên mẫu chỉ từ các xã hội WEIRD.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m31
  cau: Năm 1936, tạp chí Literary Digest của Mỹ làm một cuộc thăm dò dư luận về cuộc bầu cử tổng thống, và dự đoán ứng viên Alf Landon sẽ thắng.
  loai: lich-su
- trang: bang-chung/mau-va-chon-mau
  id: m32
  cau: Roosevelt thắng với khoảng 61% phiếu phổ thông.
  loai: so-lieu
- trang: bang-chung/mau-va-chon-mau
  id: m33
  cau: 'Đoạn cũ: Roosevelt thắng là "một trong những chiến thắng cách biệt nhất lịch sử Mỹ".'
  loai: so-lieu
- trang: bang-chung/mau-va-chon-mau
  id: m34
  cau: Danh sách gửi phiếu của Literary Digest được lập từ danh bạ điện thoại và danh sách đăng ký ô tô.
  loai: lich-su
- trang: bang-chung/mau-va-chon-mau
  id: m35
  cau: Chỉ khoảng 24% người nhận phiếu trả lời.
  loai: so-lieu
- trang: bang-chung/mau-va-chon-mau
  id: m36
  cau: 'Đoạn cũ: "năm 1936, chỉ những gia đình khá giả mới có điện thoại và ô tô, và nhóm này nghiêng về đảng Cộng hòa của Landon".'
  loai: lich-su
- trang: bang-chung/mau-va-chon-mau
  id: m37
  cau: Squire (1988), dùng dữ liệu một khảo sát của Gallup năm 1937, kết luận rằng cả cách chọn mẫu lẫn việc ai trả lời đều lệch, và hai điều đó cộng lại tạo ra ước tính sai nặng nề.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m38
  cau: "Bài học: một mẫu lệch cho kết quả không chính xác, và chỉ thu thêm câu trả lời theo cùng một cách thì không sửa được thiên lệch ấy."
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m39
  cau: "Khi đọc bất kỳ con số khảo sát nào, tự hỏi 3 câu: ai được hỏi, họ được chọn thế nào, kết luận nói về ai."
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m40
  cau: Ai được hỏi? Độ tuổi, nghề nghiệp, khu vực, và cả việc họ được tuyển vào nghiên cứu bằng cách nào.
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m41
  cau: Họ được chọn thế nào? Ngẫu nhiên như rút thăm, hay tự đăng ký, hay tình cờ gặp ngoài đường?
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m42
  cau: Kết luận nói về ai? Nếu kết luận nói về một nhóm rộng hơn hẳn nhóm được hỏi, hãy cảnh giác.
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m43
  cau: Khảo sát 1.000 sinh viên tại một trường rồi kết luận về "giới trẻ" là mẫu hẹp, khái quát hóa quá đà.
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m44
  cau: Khảo sát online với 50.000 độc giả của một trang tin là tự chọn tham gia, dễ lệch theo chân dung độc giả của trang đó.
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m45
  cau: Thăm dò ngẫu nhiên 1.200 người dân trên cả nước là cách làm tốt, nhưng vẫn cần xem tiếp cách đặt câu hỏi.
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m46
  cau: Chỉ viết "một nghiên cứu cho thấy", không nói ai được hỏi thì không đánh giá được mẫu; đừng tin vội.
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m47
  cau: Kết quả của mẫu thuận tiện có thể rất tốt trong một số trường hợp; nếu có lý do để tin câu trả lời không phụ thuộc vào đặc điểm của mẫu, mẫu thuận tiện vẫn hữu ích.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m48
  cau: Henrich và cộng sự cho thấy khó biết trước câu trả lời có phụ thuộc vào đặc điểm của mẫu hay không.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m49
  cau: Ngay cả ở nhận thức thị giác, mức bị đánh lừa bởi ảo ảnh Müller-Lyer cũng khác nhau rõ giữa các xã hội, và sinh viên Mỹ nằm ở đầu cực.
  loai: so-lieu
- trang: bang-chung/mau-va-chon-mau
  id: m50
  cau: Mẫu lệch, không giống tổng thể, cho kết luận sai về tổng thể.
  loai: nhan
- trang: bang-chung/mau-va-chon-mau
  id: m51
  cau: Cuộc thăm dò Literary Digest 1936 là ví dụ lịch sử của nguyên tắc ấy.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m52
  cau: Kết quả từ mẫu WEIRD không thể mặc nhiên coi là đúng cho cả loài người.
  loai: nhan
- trang: bang-chung/mau-va-chon-mau
  id: m53
  cau: Henrich và cộng sự tổng hợp nhiều so sánh giữa các nhóm xã hội và thấy người WEIRD thường là ngoại lệ ở nhiều lĩnh vực.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m54
  cau: Bài của Henrich và cộng sự là một tổng quan, không phải phân tích tổng hợp, và mức khác biệt thay đổi theo từng hiệu ứng.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m55
  cau: Ở dự án Many Labs 2, các so sánh thăm dò giữa nhóm WEIRD và ít WEIRD giải thích rất ít khác biệt.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m56
  cau: "Không đại diện cho học viên nói chung: người đang học khác với người đã bỏ học giữa chừng, và nhóm bất mãn nhất có thể đã rời đi từ lâu; đây là dạng mẫu bỏ sót nhóm đã rời đi."
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m57
  cau: 'Không đại diện cho "giới trẻ Việt Nam": sinh viên thường học vấn cao hơn dân số chung, nên khác với người đã đi làm hay người không học đại học; mẫu chỉ nói được về sinh viên trường X.'
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m58
  cau: "Không đại diện cho người tiêu dùng nói chung: chỉ những người chọn bình chọn mới có mặt trong mẫu, và người theo dõi trang của hãng có thể vốn đã thích thương hiệu; đây là mẫu tự chọn, thuận tiện, có khả năng lệch về phía tích cực."
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: q1
  cau: Một khảo sát thu được rất nhiều câu trả lời nhưng người trả lời được chọn theo cùng một cách lệch có thể sai nặng, vì mẫu lớn không tự sửa được thiên lệch chọn mẫu; cuộc thăm dò Literary Digest năm 1936 dự đoán sai người thắng cử, với danh sách gửi phiếu lệch và tỉ lệ trả lời khoảng 24%.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: q2
  cau: Bài báo của Henrich, Heine và Norenzayan không nói các nghiên cứu ấy làm sai; nó nói không có cơ sở chắc từ trước để coi một hiện tượng là phổ quát chỉ vì đã thấy ở một nhóm hẹp.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: q3
  cau: Mẫu tự chọn, chỉ gồm những người chọn trả lời, thuộc nhóm kết quả thường không đáng tin; một hãng chỉ đăng phiếu thăm dò trên trang của chính hãng sẽ có mẫu như vậy.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m59
  cau: Bài báo WEIRD gợi ý rằng người phương Tây có thể là "ngoại lệ" chứ không phải "chuẩn mực".
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m60
  cau: Các nhà nghiên cứu tâm lý học vẫn dùng sinh viên đại học làm mẫu, dù mẫu đó hẹp.
  loai: phat-hien
- trang: bang-chung/p-value
  id: p1
  cau: Năm 2016, Hiệp hội Thống kê Hoa Kỳ (ASA) ra một tuyên bố chính thức vì cách dùng và cách hiểu p-value hay bị sai lệch.
  loai: lich-su
- trang: bang-chung/p-value
  id: p2
  cau: Tuyên bố do Ronald L. Wasserstein và Nicole A. Lazar soạn thảo, đăng trên The American Statistician, số 70(2), trang 129–133.
  loai: lich-su
- trang: bang-chung/p-value
  id: p3
  cau: Theo thông cáo của ASA, đây là lần đầu Ban Giám đốc ASA, đại diện cho cộng đồng thống kê, ra một tuyên bố về những vấn đề này.
  loai: lich-su
- trang: bang-chung/p-value
  id: p4
  cau: Tuyên bố nêu sáu nguyên tắc, nhiều nguyên tắc trong đó nhằm sửa các hiểu lầm và cách dùng sai p-value.
  loai: phat-hien
- trang: bang-chung/p-value
  id: p5
  cau: "Tung một đồng xu công bằng 10 lần: trong 1024 khả năng đều nhau, có 10 cách được đúng 9 lần ngửa và 1 cách được 10 lần ngửa, tổng 11/1024, khoảng 1,1%."
  loai: so-lieu
- trang: bang-chung/p-value
  id: p6
  cau: p-value là xác suất thu được kết quả "lạ" như thế này (hoặc lạ hơn), nếu giả thuyết "không có gì đặc biệt" là đúng.
  loai: dinh-nghia
- trang: bang-chung/p-value
  id: p7
  cau: Theo cách nói của ASA, p-value cho biết dữ liệu không tương thích đến mức nào với một mô hình đã định trước.
  loai: dinh-nghia
- trang: bang-chung/p-value
  id: p8
  cau: p-value không phải xác suất giả thuyết đúng; đây là một hiểu lầm thường gặp, và là nguyên tắc thứ hai của tuyên bố ASA 2016.
  loai: dinh-nghia
- trang: bang-chung/p-value
  id: p9
  cau: 'Với p = 1,1% trong ví dụ đồng xu: không có nghĩa "xác suất đồng xu công bằng chỉ là 1,1%"; có nghĩa là nếu đồng xu công bằng thì kết quả 9/10 ngửa là chuyện hiếm (1,1%).'
  loai: phat-hien
- trang: bang-chung/p-value
  id: p10
  cau: Câu sai nói về đồng xu ("đồng xu công bằng với xác suất 1,1%"); câu đúng nói về dữ liệu trong một điều kiện giả định ("nếu đồng xu công bằng, dữ liệu này hiếm đến mức 1,1%").
  loai: phat-hien
- trang: bang-chung/p-value
  id: p11
  cau: Câu ta muốn trả lời thường là "giả thuyết có đúng không", nhưng p-value chỉ trả lời "dữ liệu có lạ không, nếu giả thuyết đúng"; một mình p-value không phải thước đo tốt cho bằng chứng về một mô hình hay giả thuyết.
  loai: phat-hien
- trang: bang-chung/p-value
  id: p12
  cau: 'p = 0,03 trong quảng cáo thuốc không có nghĩa là "thuốc hiệu quả với xác suất 97%", cũng không có nghĩa "chỉ có 3% là do ngẫu nhiên"; nó chỉ có nghĩa: nếu thuốc thực ra vô tác dụng, thì chênh lệch quan sát được là chuyện hiếm ở mức 3%.'
  loai: phat-hien
- trang: bang-chung/p-value
  id: p13
  cau: 'Thay vì chỉ hỏi "có ý nghĩa thống kê không", ta có thể hỏi một câu hữu ích hơn: "hiệu ứng lớn cỡ nào?", và khoảng tin cậy là một cách trả lời.'
  loai: phat-hien
- trang: bang-chung/p-value
  id: p14
  cau: Khoảng tin cậy 95% gồm các độ lớn hiệu ứng mà phép thử cho p lớn hơn 0,05; nếu khoảng này không chứa số 0, kết quả được gọi là "có ý nghĩa thống kê ở mức 5%", liên hệ với p < 0,05.
  loai: dinh-nghia
- trang: bang-chung/p-value
  id: p15
  cau: Với khoảng tin cậy 95% từ 5 đến 35 phút, ước lượng tốt nhất là thêm 20 phút.
  loai: phat-hien
- trang: bang-chung/p-value
  id: p16
  cau: Các giá trị trong khoảng từ 5 đến 35 phút tương thích với dữ liệu hơn các giá trị nằm ngoài khoảng, với điều kiện mô hình thống kê đúng.
  loai: phat-hien
- trang: bang-chung/p-value
  id: p17
  cau: "Khoảng tin cậy cho thấy những độ lớn của hiệu ứng tương thích với dữ liệu, kể cả hướng của hiệu ứng; p-value không đo độ lớn hay tầm quan trọng của kết quả: hai nghiên cứu cùng p = 0,03 có thể ẩn sau một hiệu ứng lớn hoặc một hiệu ứng nhỏ không đáng kể."
  loai: phat-hien
- trang: bang-chung/p-value
  id: p18
  cau: 0,05 là một quy ước, không phải chân lý toán học.
  loai: phat-hien
- trang: bang-chung/p-value
  id: p19
  cau: Ronald Fisher nêu ngưỡng 0,05 trong sách năm 1925 như một điểm tiện lợi để quyết định một chênh lệch có được coi là đáng kể hay không.
  loai: lich-su
- trang: bang-chung/p-value
  id: p20
  cau: Theo Jessica Utts, chủ tịch ASA năm 2016, ở một số lĩnh vực p-value đã trở thành "người gác cổng" quyết định công trình có được công bố hay không.
  loai: phat-hien
- trang: bang-chung/p-value
  id: p21
  cau: Theo Utts, thiên lệch biên tập này dẫn tới "ngăn kéo hồ sơ" (nghiên cứu có kết quả có ý nghĩa thống kê dễ được đăng hơn nhiều) và tới p-hacking.
  loai: phat-hien
- trang: bang-chung/p-value
  id: p22
  cau: "ASA nhấn mạnh: kết luận khoa học không nên chỉ dựa vào việc p-value có vượt qua một ngưỡng cụ thể hay không."
  loai: phat-hien
- trang: bang-chung/p-value
  id: p23
  cau: p = 0,049 và p = 0,051 gần như giống nhau về mặt bằng chứng, vì p-value thay đổi liên tục, nhưng một bên được gọi là "thành công", bên kia là "thất bại"; ranh giới mong manh ấy không nên quyết định số phận một nghiên cứu.
  loai: phat-hien
- trang: bang-chung/p-value
  id: p24
  cau: p-hacking là việc thử đi thử lại nhiều cách phân tích cho đến khi p-value "rơi" xuống dưới 0,05, rồi chỉ báo cáo cách phân tích "thành công".
  loai: dinh-nghia
- trang: bang-chung/p-value
  id: p25
  cau: Một cách p-hacking là quyết định có thu thêm dữ liệu hay không sau khi đã xem kết quả có ý nghĩa chưa.
  loai: phat-hien
- trang: bang-chung/p-value
  id: p26
  cau: Một cách p-hacking là đo nhiều biến kết quả (ví dụ 10 biến), chỉ báo cáo vài biến có p < 0,05 và bỏ qua các biến còn lại.
  loai: phat-hien
- trang: bang-chung/p-value
  id: p27
  cau: Một cách p-hacking là quyết định có loại một số điểm dữ liệu hay không sau khi xem việc loại ấy làm kết quả đổi thế nào.
  loai: phat-hien
- trang: bang-chung/p-value
  id: p28
  cau: Một cách p-hacking là chỉ báo cáo những nghiên cứu hay điều kiện cho kết quả "thành công".
  loai: phat-hien
- trang: bang-chung/p-value
  id: p29
  cau: Những cách làm này có thể làm tăng khả năng tìm ra bằng chứng "ủng hộ" một giả thuyết sai.
  loai: phat-hien
- trang: bang-chung/p-value
  id: p30
  cau: Kết quả có được theo cách ấy ít có khả năng tái lập hơn khi người khác làm lại.
  loai: phat-hien
- trang: bang-chung/p-value
  id: p31
  cau: "Nguyên tắc thứ tư của ASA: suy luận đúng đòi hỏi báo cáo đầy đủ và minh bạch."
  loai: phat-hien
- trang: bang-chung/p-value
  id: p32
  cau: "Hãy hỏi về độ lớn, không chỉ hỏi có/không: hiệu ứng là bao nhiêu, khoảng tin cậy rộng hay hẹp; một hiệu ứng nhỏ vẫn có thể cho p < 0,05 nếu mẫu đủ lớn."
  loai: loi-khuyen
- trang: bang-chung/p-value
  id: p33
  cau: 'Coi chừng "ngưỡng ma thuật": đừng để ranh giới 0,05 quyết định tất cả, hãy xem toàn bộ bằng chứng.'
  loai: loi-khuyen
- trang: bang-chung/p-value
  id: p34
  cau: "Tìm dấu hiệu p-hacking: nghiên cứu có đăng ký trước kế hoạch phân tích không, có báo cáo tất cả các biến đã đo không?"
  loai: loi-khuyen
- trang: bang-chung/p-value
  id: p35
  cau: 'Cách diễn đạt "p = 0,03, tức giả thuyết đúng 97%" là sai: p-value không phải xác suất giả thuyết đúng.'
  loai: loi-khuyen
- trang: bang-chung/p-value
  id: p36
  cau: '"Kết quả có ý nghĩa thống kê (p < 0,05)" đúng về mặt kỹ thuật, nhưng chưa nói hiệu ứng lớn hay nhỏ, quan trọng hay không.'
  loai: loi-khuyen
- trang: bang-chung/p-value
  id: p37
  cau: '"Thuốc giúp ngủ thêm 20 phút (khoảng tin cậy 95%: 5–35 phút)" là cách nói tốt hơn vì cho biết độ lớn và phạm vi các giá trị tương thích với dữ liệu.'
  loai: loi-khuyen
- trang: bang-chung/p-value
  id: p38
  cau: "Nếu nhóm nghiên cứu đã thử nhiều cách phân tích và chọn cách cho kết quả tốt nhất, đó là dấu hiệu p-hacking: nên dè dặt với kết quả."
  loai: loi-khuyen
- trang: bang-chung/p-value
  id: p39
  cau: p-value không phải xác suất giả thuyết đúng, và không đo độ lớn hay tầm quan trọng của hiệu ứng.
  loai: nhan
- trang: bang-chung/p-value
  id: p40
  cau: Tuyên bố của ASA (2016) và bài hướng dẫn của Greenland và cộng sự (2016) cùng nêu điều này.
  loai: phat-hien
- trang: bang-chung/p-value
  id: p41
  cau: p-hacking và báo cáo chọn lọc làm tăng khả năng có kết quả "có ý nghĩa" sai, và làm kết quả khó tái lập hơn.
  loai: nhan
- trang: bang-chung/p-value
  id: p42
  cau: Khảo sát nhà tâm lý học cho thấy các cách làm này khá phổ biến.
  loai: so-lieu
- trang: bang-chung/p-value
  id: p43
  cau: Mô phỏng và khảo sát cho thấy các cách làm này làm tăng dương tính giả; mức đóng góp của chúng vào tỉ lệ không tái lập quan sát được ở các dự án tái lập lớn chưa được đo trực tiếp.
  loai: phat-hien
- trang: bang-chung/p-value
  id: p44
  cau: 'B đúng: p-value là xác suất của dữ liệu (cực đoan như quan sát được, hoặc hơn), với giả định giả thuyết "không có tác dụng" là đúng.'
  loai: phat-hien
- trang: bang-chung/p-value
  id: p45
  cau: 'C sai: một nghiên cứu nhỏ trên 40 người không thể "chứng minh" trà có tác dụng cho mọi người.'
  loai: phat-hien
- trang: bang-chung/p-value
  id: p46
  cau: "D sai: p-value không đo độ lớn hay tầm quan trọng của hiệu ứng; một hiệu ứng rất nhỏ vẫn có thể cho p < 0,05 nếu mẫu đủ lớn."
  loai: phat-hien
- trang: bang-chung/p-value
  id: q1
  cau: 'p-value hay ý nghĩa thống kê không đo độ lớn của hiệu ứng hay tầm quan trọng của kết quả (nguyên tắc 5); p = 0,001 vì thế không cho biết hiệu ứng lớn hay nhỏ. Nguyên tắc 2: p-value không phải xác suất giả thuyết đúng, nên p = 0,001 không có nghĩa "xác suất giả thuyết đúng là 99,9%".'
  loai: phat-hien
- trang: bang-chung/p-value
  id: q2
  cau: Ngưỡng 0,05 là quy ước; nguyên tắc thứ ba của ASA nói kết luận khoa học không nên chỉ dựa vào việc p-value có vượt một ngưỡng nhất định hay không, nên với p = 0,049 và p = 0,051 bằng chứng của hai nghiên cứu gần giống nhau.
  loai: phat-hien
- trang: bang-chung/p-value
  id: q3
  cau: Báo cáo chọn lọc những kết quả có p dưới 0,05 là một trong các cách làm đáng ngờ được khảo sát ở các nhà tâm lý học; đăng ký trước kế hoạch và báo cáo đầy đủ là cách hạn chế vấn đề này.
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k1
  cau: "Open Science Collaboration: 270 tác giả cùng làm lại 100 nghiên cứu tâm lý đã công bố trong năm 2008 trên ba tạp chí."
  loai: so-lieu
- trang: bang-chung/khung-hoang-tai-lap
  id: k2
  cau: Kết quả được công bố trên tạp chí Science, tháng 8 năm 2015.
  loai: lich-su
- trang: bang-chung/khung-hoang-tai-lap
  id: k3
  cau: Mỗi nghiên cứu được một nhóm làm lại, dùng tài liệu gốc khi có và thiết kế được tính để có sức mạnh thống kê cao, nhằm giữ sát thiết kế của bản gốc.
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k4
  cau: Trong 100 nghiên cứu gốc, 97% báo cáo hiệu ứng có ý nghĩa thống kê.
  loai: so-lieu
- trang: bang-chung/khung-hoang-tai-lap
  id: k5
  cau: Khi làm lại, 36% cho hiệu ứng có ý nghĩa thống kê theo cùng hướng.
  loai: so-lieu
- trang: bang-chung/khung-hoang-tai-lap
  id: k6
  cau: Độ lớn hiệu ứng ở lần làm lại trung bình chỉ còn khoảng một nửa so với ban đầu.
  loai: so-lieu
- trang: bang-chung/khung-hoang-tai-lap
  id: k7
  cau: "Hình: 97% nghiên cứu gốc có ý nghĩa thống kê so với 36% khi làm lại; độ lớn hiệu ứng làm lại bằng khoảng một nửa gốc; 39% được đánh giá chủ quan là đã tái lập; 47% hiệu ứng gốc nằm trong khoảng tin cậy của hiệu ứng tái lập."
  loai: so-lieu
- trang: bang-chung/khung-hoang-tai-lap
  id: k8
  cau: "Các tác giả viết rằng không nên đọc kết quả này như một thất bại của tâm lý học: dự án cho thấy khoa học đang hoạt động như nó nên làm, và tích lũy bằng chứng là cách cộng đồng khoa học tự sửa mình."
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k9
  cau: Tái lập (replication) là làm lại một nghiên cứu với người tham gia mới, theo đúng thiết kế cũ, để xem hiệu ứng có xuất hiện trở lại không.
  loai: dinh-nghia
- trang: bang-chung/khung-hoang-tai-lap
  id: k10
  cau: Theo chính dự án năm 2015, một nghiên cứu đơn lẻ hầu như không bao giờ cho kết luận dứt khoát về một hiệu ứng; bằng chứng đáng tin hơn khi nhiều lần làm lại độc lập cùng cho thấy hiệu ứng.
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k11
  cau: '"Không tái lập được" không đơn giản có nghĩa là "phát hiện đó sai".'
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k12
  cau: Trong dự án năm 2015, 36% đạt ý nghĩa thống kê, 39% được đánh giá chủ quan là "đã tái lập", và 47% hiệu ứng gốc nằm trong khoảng tin cậy của hiệu ứng tái lập.
  loai: so-lieu
- trang: bang-chung/khung-hoang-tai-lap
  id: k13
  cau: Nhiều kết quả làm lại cho hiệu ứng nhỏ hơn và bằng chứng yếu hơn những gì bài báo gốc tuyên bố, thay vì biến mất hoàn toàn.
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k14
  cau: Open Science Collaboration và nhóm của Nosek (2022) nêu ba yếu tố có thể góp phần (sức mạnh thống kê thấp, p-hacking, thiên lệch xuất bản); cả ba thuộc về cách làm và động cơ chung của cộng đồng khoa học, không phải lỗi của một nhà nghiên cứu cụ thể.
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k15
  cau: Khi nghiên cứu có sức mạnh thống kê thấp lại đi cùng việc ưu tiên đăng kết quả dương tính, độ lớn hiệu ứng trong các bài đã đăng sẽ bị ước lượng cao một cách có hệ thống.
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k16
  cau: Với mẫu nhỏ, một chút may rủi cũng đủ tạo ra hiệu ứng "đẹp", giống như tung đồng xu 10 lần mà được 8 lần ngửa rồi kết luận đồng xu bị lệch.
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k17
  cau: 'Khẳng định cũ: "Nhiều nghiên cứu tâm lý dùng vài chục người tham gia."'
  loai: so-lieu
- trang: bang-chung/khung-hoang-tai-lap
  id: k18
  cau: 'P-hacking là "đào" dữ liệu cho đến khi ra kết quả: thử biến này không được thì thử biến khác, loại vài điểm số liệu "lạ", đổi cách phân tích, cho đến khi chỉ số p nhỏ hơn 0,05.'
  loai: dinh-nghia
- trang: bang-chung/khung-hoang-tai-lap
  id: k19
  cau: Càng làm nhiều lần, càng dễ gặp kết quả "đẹp" do may rủi, giống như bắn 100 mũi tên vào tường rồi vẽ hồng tâm quanh chỗ tên rơi nhiều nhất.
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k20
  cau: Nhà nghiên cứu có xu hướng công bố kết quả dương tính nhiều hơn kết quả âm tính, và các động cơ trong khoa học ưu tiên điều mới hơn việc kiểm tra lại.
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k21
  cau: Kết quả "không có gì xảy ra" vì thế dễ nằm im trong "ngăn kéo hồ sơ" (file drawer), không ai biết đến.
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k22
  cau: 'Bức tranh công bố bị lệch về một phía: thấy nhiều kết quả "thành công" hơn thực tế, và độ lớn hiệu ứng bị thổi phồng.'
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k23
  cau: Sức mạnh thống kê thấp có thể làm hiệu ứng may rủi bị tưởng là thật; p-hacking cho kết quả "đẹp" nhờ chọn lọc cách phân tích; thiên lệch xuất bản làm chỉ thấy phát hiện "thành công".
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k24
  cau: Đăng ký trước (preregistration) nghĩa là nhà nghiên cứu xác định câu hỏi nghiên cứu và kế hoạch phân tích trước khi thấy kết quả, và công khai kế hoạch ấy.
  loai: dinh-nghia
- trang: bang-chung/khung-hoang-tai-lap
  id: k25
  cau: Nhờ đó người đọc có thể phân biệt phân tích đã dự định từ trước với phân tích thêm vào sau, và biết mức tin cậy nên dành cho từng loại.
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k26
  cau: Registered Reports là một mô hình xuất bản trong đó tạp chí phản biện kế hoạch nghiên cứu trước khi có kết quả và nhận bài "về nguyên tắc" dựa trên tầm quan trọng của câu hỏi và chất lượng phương pháp.
  loai: dinh-nghia
- trang: bang-chung/khung-hoang-tai-lap
  id: k27
  cau: 'Nhờ vậy một nghiên cứu được thiết kế tốt nhưng cho kết quả "không có gì xảy ra" vẫn được đăng: tỉ lệ kết quả không có hiệu ứng được báo cáo ở Registered Reports cao hơn nhiều so với bài thông thường.'
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k28
  cau: Theo Nosek và cộng sự (2022), đến thời điểm bài tổng quan ấy viết, chưa có nghiên cứu nào cho biết kết quả từ Registered Reports có tái lập tốt hơn trung bình hay không.
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k29
  cau: "Tái lập thất bại không có nghĩa phát hiện gốc là bịa: có thể hiệu ứng thật nhưng nhỏ hơn, hoặc chỉ đúng trong một số điều kiện nhất định."
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k30
  cau: "Tái lập thành công không có nghĩa phát hiện là chân lý vĩnh viễn: nó chỉ có nghĩa là, với cách làm đó, hiệu ứng xuất hiện trở lại."
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k31
  cau: "Theo chính các tác giả, dự án này cho thấy khoa học đang hoạt động như nó nên làm: tích lũy bằng chứng là cách cộng đồng khoa học tự kiểm tra và tự sửa."
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k32
  cau: Chỉ một nghiên cứu duy nhất là dấu hiệu cảnh báo; đã được nhiều nhóm độc lập tái lập thì đáng tin hơn.
  loai: loi-khuyen
- trang: bang-chung/khung-hoang-tai-lap
  id: k33
  cau: Cỡ mẫu nhỏ (vài chục người) là dấu hiệu cảnh báo; cỡ mẫu lớn, được tính toán trước thì đáng tin hơn.
  loai: loi-khuyen
- trang: bang-chung/khung-hoang-tai-lap
  id: k34
  cau: Kết quả rất bất ngờ là dấu hiệu cảnh báo; kết quả bất ngờ nhưng đã có nghiên cứu khác lặp lại thì đáng tin hơn.
  loai: loi-khuyen
- trang: bang-chung/khung-hoang-tai-lap
  id: k35
  cau: Không thấy kế hoạch đăng ký trước là dấu hiệu cảnh báo; có preregistration hoặc là Registered Report thì đáng tin hơn.
  loai: loi-khuyen
- trang: bang-chung/khung-hoang-tai-lap
  id: k36
  cau: Tin tức dùng từ "chứng minh", "khẳng định" là dấu hiệu cảnh báo; từ "gợi ý", "cần thêm nghiên cứu" đáng tin hơn.
  loai: loi-khuyen
- trang: bang-chung/khung-hoang-tai-lap
  id: k37
  cau: 'Một câu hỏi hữu ích: "Nếu phát hiện này sai, ai sẽ kiểm tra lại, và việc kiểm tra lại có được ghi nhận, đăng bài không?" Open Science Collaboration chỉ ra rằng động cơ của nhà khoa học thường ưu tiên điều mới hơn việc kiểm tra lại.'
  loai: loi-khuyen
- trang: bang-chung/khung-hoang-tai-lap
  id: k38
  cau: Hiệu ứng được công bố trong tâm lý học thường lớn hơn khi được làm lại.
  loai: nhan
- trang: bang-chung/khung-hoang-tai-lap
  id: k39
  cau: "Ba dự án tái lập lớn, có đăng ký trước, cùng cho thấy hiệu ứng làm lại nhỏ hơn: Open Science Collaboration (2015) khoảng một nửa, Camerer và cộng sự (2018) khoảng 50%, Many Labs 2 (2018) trung vị d = 0,60 giảm còn 0,15."
  loai: so-lieu
- trang: bang-chung/khung-hoang-tai-lap
  id: k40
  cau: Điều này đúng ở nhiều nhóm người và nhiều nước.
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k41
  cau: Cỡ mẫu nhỏ, p-hacking và thiên lệch xuất bản là những nguyên nhân có khả năng góp phần.
  loai: nhan
- trang: bang-chung/khung-hoang-tai-lap
  id: k42
  cau: 'Bằng chứng chủ yếu là tương quan và lập luận: Open Science Collaboration gọi các thiên lệch này là "giải thích hợp lý", và mức đóng góp của từng yếu tố chưa được đo riêng.'
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: k43
  cau: "Nên rất thận trọng, gần như chưa tin gì cả: một nghiên cứu duy nhất, 30 sinh viên, chưa nhóm nào làm lại, không đăng ký kế hoạch trước."
  loai: loi-khuyen
- trang: bang-chung/khung-hoang-tai-lap
  id: k44
  cau: "Cần tái lập độc lập: ít nhất một nhóm khác, không liên quan đến nhóm gốc, làm lại và ra kết quả tương tự; một nghiên cứu duy nhất, mẫu nhỏ (30 người) dễ cho hiệu ứng được ước lượng quá cao, đúng bài học của dự án năm 2015."
  loai: loi-khuyen
- trang: bang-chung/khung-hoang-tai-lap
  id: k45
  cau: "Cần cỡ mẫu lớn và đăng ký trước: tính cỡ mẫu đủ lớn từ trước và công khai kế hoạch phân tích, để hạn chế p-hacking."
  loai: loi-khuyen
- trang: bang-chung/khung-hoang-tai-lap
  id: k46
  cau: '"Tăng 15 điểm IQ sau 10 phút nghe nhạc" là con số rất bất ngờ; theo Open Science Collaboration, hiệu ứng gốc càng bất ngờ thì càng có thể khó tái lập.'
  loai: loi-khuyen
- trang: bang-chung/khung-hoang-tai-lap
  id: k47
  cau: Một nghiên cứu duy nhất, dù kết quả có "gây sốc" đến đâu, cũng chỉ là điểm khởi đầu của bằng chứng, không phải kết luận.
  loai: loi-khuyen
- trang: bang-chung/khung-hoang-tai-lap
  id: q1
  cau: Trong 100 nghiên cứu gốc, 97 nghiên cứu có kết quả có ý nghĩa thống kê; ở bản làm lại, con số này là 36%; hiệu ứng trung bình còn khoảng một nửa so với bản gốc; không có nghĩa cả 100 nghiên cứu gốc bị chứng minh là sai.
  loai: so-lieu
- trang: bang-chung/khung-hoang-tai-lap
  id: q2
  cau: "Một lần làm lại không thấy hiệu ứng: chưa thể kết luận phát hiện gốc là sai, vì làm lại không thành công chưa chắc nghĩa là bằng chứng gốc là dương tính giả; sai khác nhỏ về mẫu, bối cảnh hay quy trình cũng có thể đổi hiệu ứng."
  loai: phat-hien
- trang: bang-chung/khung-hoang-tai-lap
  id: q3
  cau: Registered Reports khác bài thông thường ở chỗ tạp chí phản biện kế hoạch nghiên cứu và nhận bài về nguyên tắc từ trước khi có kết quả; vì nhận bài dựa trên câu hỏi và phương pháp, kết quả không có hiệu ứng vẫn có thể được đăng.
  loai: dinh-nghia
