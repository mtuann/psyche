# Lượt 2, lô D7-L1, phần a (Trầm cảm, Lo âu). Model: Claude Opus 5.5. Ngày: 16/11/2026.
# CDDR = WHO (2024), Clinical descriptions and diagnostic requirements for ICD-11 mental, behavioural
# or neurodevelopmental disorders, bản PDF tải từ trang WHO (số trang ghi theo số in trên trang).
# Bài báo: đọc tóm tắt qua Europe PMC, trừ khi ghi "toàn văn".
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n1
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content", "https://www.psychiatry.org/patients-families/depression/what-is-depression"]
  trich: "CDDR tr. 213: \"A depressive episode is differentiated from this common experience by the severity, range and duration of symptoms.\" APA: \"But being sad is not the same as having depression.\""
  ghi_chu: "Trang APA (bản do bác sĩ duyệt 4/2024) nêu thời gian hơn hai tuần và chín triệu chứng; không nêu chữ 'độ lan rộng', nhưng câu chủ yếu dựa vào ICD-11."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n2
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content", "https://www.psychiatry.org/patients-families/depression/what-is-depression"]
  trich: "CDDR tr. 3 (Introduction): \"Health-care professionals using the CDDR to make diagnoses should be qualified to do so by their clinical training and experience\". APA: \"a healthcare professional will conduct a thorough diagnostic evaluation that includes a comprehensive interview.\""
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n5
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 213: \"Some depression of mood is a normal reaction to severe adverse life events and problems (e.g. divorce, job loss) ... A depressive episode is differentiated from this common experience by the severity, range and duration of symptoms. If the diagnostic requirements for a depressive episode listed above are met, a depressive episode should still be considered present, even if there are identifiable life events that appear to have triggered the episode.\""
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n6
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content", "https://www.nhs.uk/mental-health/conditions/depression-in-adults/overview/"]
  trich: "CDDR tr. 212, triệu chứng của giai đoạn trầm cảm: \"Hopelessness about the future\"; \"Recurrent thoughts of death ... recurrent suicidal ideation\". NHS: \"It's important to seek help from a GP if you think you may be depressed.\""
  ghi_chu: "Lời khuyên tìm giúp đỡ, không phải chẩn đoán; phù hợp chuẩn mục 5 (có link Hỗ trợ)."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n7
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 213: \"Some depression of mood is a normal reaction to severe adverse life events and problems (e.g. divorce, job loss), and is common in the community.\""
  ghi_chu: "ICD-11 viết 'common' (thường gặp); 'rất thường gặp' hơi mạnh hơn chữ gốc một chút, không đổi ý."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n8
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression"]
  trich: "\"a depressed mood (feeling sad, irritable, empty)\"; triệu chứng kéo dài \"most of the day, nearly every day, for at least two weeks\"; kèm các triệu chứng khác (kém tập trung, tội lỗi, tuyệt vọng, ý nghĩ về cái chết, rối loạn giấc ngủ, ăn uống, mệt)."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n9
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression"]
  trich: "\"Depression can affect all aspects of life, including relationships with family, friends and community.\" Bản tin cũng nói trầm cảm có thể gây khó khăn ở trường và nơi làm việc."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n10
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 213: \"In some individuals, the affective component of a depressive episode may be primarily experienced and expressed as irritability, or as an absence of emotional experience (e.g. 'emptiness').\""
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n11
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression"]
  trich: "Bản tin (ngày 11/9/2026): năm 2023 \"an estimated 4% of the population experienced depression, including 5.2% of adults (4.1% among men and 6.2% among women)\"; trầm cảm ở phụ nữ nhiều hơn nam khoảng 1,5 lần."
  ghi_chu: "Thời sự: kiểm ngày 16/11/2026; 6,2/4,1 ≈ 1,5."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n12
  luot_2: dung
  nguon: ["https://www.psychiatry.org/News-room/News-Releases/APA-Releases-Diagnostic-and-Statistical-Manual-of"]
  trich: "Thông cáo ngày 18/3/2022: \"Today, the American Psychiatric Association (APA) released the Diagnostic And Statistical Manual of Mental Disorders, Fifth Edition, Text Revision (DSM-5-TR)\"."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n13
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content", "https://www.psychiatry.org/patients-families/depression/what-is-depression"]
  trich: "CDDR tr. 212: ít nhất năm triệu chứng (mười triệu chứng, ba cụm), hầu hết thời gian trong ngày, gần như mỗi ngày, ít nhất 2 tuần. CDDR tr. 8: ICD-11 và DSM-5 \"are quite similar to one another, though not identical\". APA: chín triệu chứng, \"most of the day, nearly every day, for more than two weeks\"."
  ghi_chu: "Khác biệt chính: ICD-11 có thêm 'tuyệt vọng về tương lai' (10 triệu chứng so với 9). 'Khá giống nhau' đúng mức."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n14
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 3: chẩn đoán cần người được đào tạo; \"The CDDR are written to allow for the exercise of clinical judgement\"."
  ghi_chu: "Câu đúng tinh thần chuẩn mục 5. Câu nửa về site (bài này), nửa về điều kiện chẩn đoán."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n15
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 212: \"At least one symptom from the affective cluster must be present\": \"Depressed mood ...\" hay \"Markedly diminished interest or pleasure in activities, especially those normally found to be enjoyable\"."
  ghi_chu: "gần chẩn đoán: viết theo dạng tiêu chí ('Cần có ít nhất…'). Nội dung đúng; nên giữ ngay cạnh lời 'chỉ chuyên gia mới chẩn đoán được' và không thêm số đếm triệu chứng."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n16
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 212–213, cụm nhận thức–hành vi và cụm thực vật: kém tập trung hay thiếu quyết đoán; vô giá trị hay tội lỗi quá mức; \"Hopelessness about the future\"; ý nghĩ lặp lại về cái chết; rối loạn giấc ngủ; thay đổi thèm ăn hay cân nặng; \"Psychomotor agitation or retardation (observable by others ...)\"; giảm năng lượng, mệt mỏi."
  ghi_chu: "gần chẩn đoán: danh sách triệu chứng gần như nguyên tiêu chí ICD-11; đã khung là 'chuyên gia xem xét', không có ngưỡng đếm. Nên giữ như vậy."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n17
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 212–213: \"most of the day, nearly every day, during a period lasting at least 2 weeks\"; \"The mood disturbance results in significant impairment ... If functioning is maintained, it is only through significant additional effort.\""
  ghi_chu: "gần chẩn đoán: câu có dạng tiêu chí thời gian; cùng nhóm với n15–n16."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n18
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content", "https://www.psychiatry.org/patients-families/depression/what-is-depression"]
  trich: "CDDR tr. 213: \"The symptoms are not better accounted for by bereavement. The symptoms are not a manifestation of another medical condition (e.g. a brain tumour), and are not due to the effects of a substance or medication ...\"; tr. 244: \"There is no history of manic, mixed or hypomanic episodes, which would indicate the presence of a bipolar disorder.\" APA: \"hormonal imbalances, vitamin deficiencies, neurological problems\"."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n19
  luot_2: dung
  nguon: ["https://www.psychiatry.org/patients-families/depression/what-is-depression"]
  trich: "\"a healthcare professional will conduct a thorough diagnostic evaluation that includes a comprehensive interview\" (kèm khám cơ thể); \"Laboratory and imaging tests may also be included in the evaluation as part of the medical screening.\""
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n20
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content", "https://www.nice.org.uk/guidance/ng222/chapter/Recommendations"]
  trich: "CDDR tr. 213: buồn là phản ứng bình thường, giai đoạn trầm cảm phân biệt theo mức độ, phạm vi, thời gian. NICE NG222: \"Less severe depression encompasses subthreshold and mild depression\" (trầm cảm dưới ngưỡng vẫn có lựa chọn điều trị)."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n21
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression"]
  trich: "\"Psychological treatments are the first treatments for depression.\" \"Effective psychological treatments for depression include:\" kích hoạt hành vi, CBT, liệu pháp liên cá nhân, liệu pháp giải quyết vấn đề."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n22
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression", "https://www.nice.org.uk/guidance/ng222/chapter/Recommendations"]
  trich: "WHO: trị liệu \"in person or online\"; \"Psychological treatments may be accessed through self-help manuals, websites and apps.\" NICE NG222, Guided self-help: \"Printed or digital materials ... Support from a trained practitioner who facilitates the self-help intervention\"."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n23
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression"]
  trich: "\"They can be combined with antidepressant medicines in moderate and severe depression.\" \"Antidepressant medicines are not needed for mild depression.\""
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n24
  luot_2: dung
  nguon: ["https://www.nice.org.uk/guidance/ng222/chapter/Recommendations"]
  trich: "NG222 (29/6/2022), 1.5: \"Do not routinely offer antidepressant medication as first-line treatment for less severe depression. Only offer it if that is the person's informed preference.\""
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n25
  luot_2: dung
  nguon: ["https://www.nice.org.uk/guidance/ng222/chapter/Recommendations"]
  trich: "1.4.12: \"Advise people taking antidepressant medication to talk with the person who prescribed their medication ... if they want to stop taking it.\" 1.4.13: \"if they stop taking it abruptly, miss doses or do not take a full dose, they may have withdrawal symptoms.\" Bảng 2: \"There may be side effects from the medication\"."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n26
  luot_2: dung
  nguon: ["https://www.nice.org.uk/guidance/ng222/chapter/Recommendations"]
  trich: "Bảng 1 (trầm cảm nhẹ hơn), Group exercise: \"A group physical activity intervention provided by a trained practitioner.\""
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n27
  luot_2: dung
  nguon: ["https://www.nice.org.uk/guidance/ng222/chapter/Recommendations"]
  trich: "Bảng 2, \"Treatment options for more severe depression in order of the committee's interpretation of their clinical and cost effectiveness\": dòng đầu \"Combination of individual cognitive behavioural therapy (CBT) and an antidepressant\"."
  ghi_chu: "NICE cũng ghi mọi lựa chọn trong bảng 2 đều có thể là lựa chọn đầu tiên."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n28
  luot_2: dung
  nguon: ["https://www.nice.org.uk/guidance/ng222/chapter/Recommendations"]
  trich: "\"Discuss with people with depression their preferences for treatments (including declining an offer of treatment, or changing their mind once a treatment has started)\"; mục shared decision making."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n29
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content", "https://www.psychiatry.org/patients-families/depression/what-is-depression"]
  trich: "CDDR tr. 212–216: mục 6A70 có yêu cầu chẩn đoán cụ thể (số triệu chứng, thời gian, suy giảm, loại trừ). APA: \"Depression is a real illness and help is available.\""
  ghi_chu: "Nhãn: câu nói về việc rối loạn được mô tả trong hai hệ thống phân loại, kiểm được trực tiếp; nhãn Vững chắc (nếu đó là nhãn của khung) hợp thước đo mục 4. Lượt 2 không thấy nhãn trong danh sách."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n30
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/36640411", "https://europepmc.org/article/MED/42538894"]
  trich: "Cuijpers và cs. (2023, World Psychiatry): \"We included 409 trials ... CBT had moderate to large effects compared to control conditions ... (g=0.79)\". Cipriani và cs. (2018, Lancet; tóm tắt in lại ở Focus): \"included 522 trials comprising 116 477 participants ... all antidepressants were more effective than placebo\"."
  ghi_chu: "Chỉ đọc tóm tắt."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n31
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/31922679", "https://europepmc.org/article/MED/36640411"]
  trich: "Cuijpers và cs. (2020): \"combined treatment was more effective than psychotherapy alone (RR=1.27 ...) and pharmacotherapy alone (RR=1.25 ...)\". Cuijpers và cs. (2023): \"Combined treatment was more effective than pharmacotherapies alone ... but it was not more effective than CBT alone at either time point.\""
  ghi_chu: "Chỉ đọc tóm tắt. Hai phân tích tổng hợp khác nhau ở so sánh kết hợp với chỉ liệu pháp tâm lý: câu viết đúng."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n32
  luot_2: qua-manh
  nguon: ["https://europepmc.org/article/MED/29486804", "https://europepmc.org/article/MED/36640411", "https://europepmc.org/article/MED/42538894"]
  trich: "Cuijpers và cs. (2019): \"The unadjusted effect size of psychotherapies compared with control groups was g = 0.70 ... Only 23% of the studies could be considered as a low risk of bias. When adjusting for several sources of bias, the effect size across all types of therapies dropped to g = 0.31\"; \"the effects of psychotherapy for depression are small\". Cipriani và cs.: OR đáp ứng so với giả dược từ 1,37 đến 2,13."
  cau_dung: "Liệu pháp tâm lý và thuốc chống trầm cảm giúp giảm triệu chứng ở nhiều người, nhưng không phải ở tất cả; so với nhóm đối chứng, mức hiệu quả trung bình từ nhỏ đến vừa, nhỏ hơn nữa khi chỉ tính các nghiên cứu ít sai lệch, và khác nhau nhiều giữa các người."
  ghi_chu: "Chỉ đọc tóm tắt. Sau hiệu chỉnh sai lệch, hiệu quả của liệu pháp tâm lý là nhỏ (g ≈ 0,31); thuốc so với giả dược cũng ở mức khiêm tốn. 'Ở mức vừa' cho cả hai là cận trên. Nhãn (nếu Vững chắc) cho ý 'có hiệu quả hơn đối chứng' thì đạt thước đo: nhiều phân tích tổng hợp lớn cùng chiều."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n33
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/35854107"]
  trich: "Moncrieff và cs. (Molecular Psychiatry, đăng trực tuyến 7/2022, số in 2023): \"The serotonin hypothesis of depression is still influential\"; các phân tích tổng hợp về 5-HIAA, serotonin huyết tương \"showed no association with depression\"; kết luận của bài: không có bằng chứng nhất quán rằng trầm cảm do serotonin thấp."
  ghi_chu: "Chỉ đọc tóm tắt."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n34
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/37322065"]
  trich: "Jauhar và cs. (2023, Molecular Psychiatry), tên bài: \"A leaky umbrella has little value: evidence clearly indicates the serotonin system is implicated in depression\"."
  ghi_chu: "Bài bình luận, không có tóm tắt; chỉ đọc tên bài và siêu dữ liệu."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n35
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression"]
  trich: "\"Depression results from a complex interaction of social, psychological, and biological factors.\""
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n36
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/11007705"]
  trich: "Sullivan, Neale, Kendler (2000): \"Five twin studies met the inclusion criteria ... (point estimate of heritability of liability=37%, 95% CI=31%-42%)\"."
  ghi_chu: "Chỉ đọc tóm tắt. Đây là phân tích tổng hợp năm nghiên cứu sinh đôi."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n37
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/35854107", "https://europepmc.org/article/MED/37322065"]
  trich: "Tổng quan ô dù không thấy bằng chứng nhất quán cho giả thuyết serotonin thấp; bài phản bác (2023) cho rằng bằng chứng \"clearly indicates the serotonin system is implicated in depression\"."
  ghi_chu: "Nhãn Đang tranh cãi hợp thước đo mục 4: các tổng hợp chất lượng cao đọc bằng chứng theo hai hướng."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n38
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression", "https://www.nhs.uk/mental-health/conditions/depression-in-adults/overview/"]
  trich: "WHO: \"Depression can happen to anyone.\"; \"complex interaction of social, psychological, and biological factors\"; có điều trị hiệu quả. NHS: \"Depression is not a sign of weakness or something you can 'snap out of' by 'pulling yourself together'.\""
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n39
  luot_2: dung
  nguon: ["https://www.rcpsych.ac.uk/mental-health/treatments-and-wellbeing/antidepressants", "https://www.nice.org.uk/guidance/ng222/chapter/Recommendations"]
  trich: "RCPsych: khó ngừng thuốc \"is more accurately described as physical dependence\"; nghiện được mô tả là thèm muốn, mất kiểm soát, \"a high\", khác với thuốc chống trầm cảm. NICE 1.4.13: ngừng đột ngột có thể gây triệu chứng ngừng thuốc, \"withdrawal symptoms do not affect everyone\"."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n40
  luot_2: dung
  nguon: ["https://www.nice.org.uk/guidance/ng222/chapter/Recommendations"]
  trich: "1.4.12: \"Explain that it is usually necessary to reduce the dose in stages over time (called 'tapering') but that most people stop antidepressants successfully.\"; nói chuyện với người kê đơn nếu muốn ngừng."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n41
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 213: \"If functioning is maintained, it is only through significant additional effort.\""
  ghi_chu: "Vế 'vẻ ngoài không cho biết tình trạng bên trong' là suy ra hợp lý từ câu trên."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n42
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression", "https://www.nhs.uk/mental-health/conditions/depression-in-adults/overview/"]
  trich: "WHO: triệu chứng \"most of the day, nearly every day, for at least two weeks\". NHS: \"It's important to seek help from a GP if you think you may be depressed.\""
  ghi_chu: "gần chẩn đoán (nhẹ): mốc 'hai tuần' trùng ngưỡng thời gian của tiêu chí; vế 'hoặc khi thấy không ổn kéo dài; không cần đủ nặng' đã tránh để người đọc hiểu là dưới hai tuần thì không cần giúp."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n43
  luot_2: dung
  nguon: ["https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/behaviours/help-for-suicidal-thoughts/"]
  trich: "\"If you have seriously harmed yourself\" hay nghĩ mình có thể sắp làm hại bản thân, \"call 999 for an ambulance or go straight to A&E\"; \"Let family or friends know what's going on for you.\""
  ghi_chu: "NHS dành cấp cứu cho lúc nguy hiểm cận kề; với ý nghĩ chưa cấp bách còn đường dây hỗ trợ, bác sĩ. Câu của trang khuyên cấp cứu rộng hơn, vẫn an toàn."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n45
  luot_2: dung
  nguon: ["https://www.nhs.uk/mental-health/conditions/depression-in-adults/overview/", "https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "NHS: \"Many people with depression also have symptoms of anxiety.\" CDDR tr. 284: \"Social anxiety disorder frequently co-occurs with other anxiety and fear-related disorders and depressive disorders.\""
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n47
  luot_2: khong-chac
  nguon: ["https://www.psychiatry.org/patients-families/depression/what-is-depression"]
  trich: "Trang APA liệt kê chín triệu chứng, \"most of the day, nearly every day, for more than two weeks\"; không nêu ngưỡng 'năm triệu chứng'."
  ghi_chu: "Ngưỡng 5/9 là tiêu chí A quen thuộc của DSM-5/DSM-5-TR, nhưng văn bản tiêu chí ở psychiatryonline.org bị chặn (403) và tài liệu mở của APA không nêu con số 5; chỉ thấy ở bản in lại thứ cấp. Theo yêu cầu chỉ dùng tài liệu chính thức của APA nên ghi khong-chac. gần chẩn đoán: con số 'năm trong chín triệu chứng' là ngưỡng đếm, dễ thành bảng tự chấm; nên bỏ con số khỏi thân bài và câu hỏi, hay giữ ở mục Nguồn kèm lời 'chỉ chuyên gia áp dụng'."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n48
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 212–213: \"at least 2 weeks\", \"nearly every day\", suy giảm rõ; \"a depressive episode should still be considered present, even if there are identifiable life events that appear to have triggered the episode\"."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n49
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content", "https://www.psychiatry.org/patients-families/depression/what-is-depression"]
  trich: "CDDR tr. 213–214, 244: loại trừ tang chế, bệnh cơ thể, chất, thuốc, tiền sử hưng cảm; yêu cầu suy giảm chức năng. APA: \"thorough diagnostic evaluation that includes a comprehensive interview\"."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n50
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression", "https://www.nice.org.uk/guidance/ng222/chapter/Recommendations"]
  trich: "WHO: \"Psychological treatments are the first treatments for depression. They can be combined with antidepressant medicines in moderate and severe depression.\" NICE: bàn lựa chọn điều trị theo mong muốn của người bệnh."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n51
  luot_2: dung
  nguon: ["https://www.nhs.uk/mental-health/conditions/depression-in-adults/overview/"]
  trich: "\"Depression is not a sign of weakness or something you can 'snap out of' by 'pulling yourself together'.\""
  ghi_chu: "Phần việc người thân nên làm (lắng nghe, kiên nhẫn, giúp tìm người có chuyên môn) là lời khuyên chung, không trái nguồn nào; lượt 2 không tìm được một câu nguồn nói đủ cả bốn ý."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n53
  luot_2: qua-manh
  nguon: ["https://www.nice.org.uk/guidance/ng222/chapter/Recommendations"]
  trich: "NG222, bảng 2, thuốc chống trầm cảm: \"Can be a selective serotonin reuptake inhibitor (SSRI), serotonin–norepinephrine reuptake inhibitor (SNRI), or other antidepressant if indicated\"; \"SSRIs are generally well tolerated, have a good safety profile and should be considered as the first choice for most people.\" Lựa chọn đứng đầu bảng là kết hợp CBT cá nhân với thuốc; \"all treatments in table 2 can be used as first-line treatments\"."
  cau_dung: "NICE NG222 (2022): với trầm cảm nặng hơn (vừa và nặng), thuốc chống trầm cảm có thể là SSRI, SNRI hay thuốc khác; SSRI nên được cân nhắc là lựa chọn đầu tiên cho phần lớn người bệnh."
  ghi_chu: "NICE chỉ đặt SSRI làm lựa chọn đầu, không xếp SNRI ngang hàng; và thuốc không phải lựa chọn đầu tay duy nhất. Vế DSM-5-TR '5/9 triệu chứng trong hai tuần': khong-chac như n47 (không mở được tài liệu chính thức của APA có con số 5). gần chẩn đoán: mục Nguồn có ngưỡng đếm '5/9', cùng lý do như n47."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n1
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content", "https://www.psychiatry.org/patients-families/anxiety-disorders/what-are-anxiety-disorders"]
  trich: "CDDR tr. 265–285: mục 6B00 lo âu lan tỏa, 6B01 hoảng sợ, 6B04 lo âu xã hội, mỗi mục có 'Boundary with normality'. APA: triệu chứng phải \"out of proportion to the situation, persistent, and interfere with daily functioning\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n2
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 3: \"Health-care professionals using the CDDR to make diagnoses should be qualified to do so by their clinical training and experience\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n5
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 267: \"Normal anxiety and worry are usually sufficiently self-regulated that they do not interfere with functioning or cause marked distress. In generalized anxiety disorder, the anxiety or worry is excessive, persistent and intense\"; tr. 265: \"symptoms severe enough to result in significant distress or impairment in functioning\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n6
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 265: \"fear represents a reaction to perceived imminent threat in the present, whereas anxiety is more future-oriented\"; rối loạn là khi sợ và lo \"excessive\"."
  ghi_chu: "Ẩn dụ, không phải định nghĩa chuẩn; không trái nguồn."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n7
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 3: người chẩn đoán cần được đào tạo lâm sàng để \"distinguish disorders from normal variation\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n8
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 267: \"At optimal levels, anxiety and worry may help to direct problem-solving efforts, focus attention adaptively and increase alertness. Normal anxiety and worry are usually sufficiently self-regulated that they do not interfere with functioning\"."
  ghi_chu: "ICD-11 viết 'optimal levels' (mức tối ưu); 'mức vừa phải' là cách dịch chấp nhận được."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n9
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content", "https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders"]
  trich: "CDDR tr. 265: \"excessive fear and anxiety ... severe enough to result in significant distress or impairment in functioning\". WHO: sợ và lo \"intense and excessive\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n10
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders"]
  trich: "Bản tin (15/9/2026): \"In 2023, 470 million people in the world had an anxiety disorder, making anxiety disorders the most common of all mental disorders.\" \"about 1 in 4 people in need (27.6%) receive any treatment\"."
  ghi_chu: "Thời sự: kiểm ngày 16/11/2026. WHO viết 'receive any treatment' (nhận bất kỳ điều trị nào)."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n11
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 265: \"One of the major ways in which different anxiety and fear-related disorders are distinguished from one another is the focus of apprehension\"; nhóm gồm lo âu lan tỏa, hoảng sợ, sợ khoảng rộng, ám ảnh sợ đặc hiệu, lo âu xã hội, lo âu chia ly, câm chọn lọc."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n12
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 266 (6B00): \"general apprehensiveness ... ('free-floating anxiety'); or excessive worry ... about negative events occurring in several different aspects of everyday life\"; kèm \"muscle tension or motor restlessness\", buồn nôn, tim đập nhanh, đổ mồ hôi, \"being 'on edge'\", khó tập trung, dễ cáu, rối loạn giấc ngủ; \"persist for at least several months, for more days than not\"."
  ghi_chu: "gần chẩn đoán: mô tả gần nguyên yêu cầu chẩn đoán ICD-11 kèm thời gian; cần đứng cạnh n15 (không phải bảng tự chấm) và lời 'chỉ chuyên gia'."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n13
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 271 (6B01): \"Recurrent panic attacks\"; \"At least some of the panic attacks are unexpected\"; triệu chứng gồm tim đập nhanh, khó thở, đau ngực, chóng mặt, \"fear of losing control\", \"fear of imminent death\"; sau đó \"persistent concern or worry ... (e.g. that the physiological symptoms may be those of a myocardial infarction), or by behaviours intended to avoid their recurrence (e.g. only leaving the home with a trusted companion)\"."
  ghi_chu: "gần chẩn đoán: như n12."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n14
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content", "https://www.psychiatry.org/patients-families/anxiety-disorders/what-are-anxiety-disorders"]
  trich: "CDDR tr. 284 (6B04): \"Marked and excessive fear or anxiety ... in one or more social situations such as social interactions (e.g. having a conversation), doing something while feeling observed (e.g. eating or drinking ...) or performing in front of others (e.g. giving a speech)\"; \"negatively evaluated\"; \"avoided or endured with intense fear\"; \"(e.g. at least several months)\". APA: nỗi sợ \"lasts at least six months\"."
  ghi_chu: "gần chẩn đoán: như n12."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n15
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 3: \"The CDDR are written to allow for the exercise of clinical judgement\"; tr. 284: \"clinical judgement should be applied to determine whether the reported fear ... is disproportionate\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n16
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 266: \"The symptoms are not a manifestation of another medical condition (e.g. hyperthyroidism), and are not due to the effects of a substance or medication on the central nervous system (e.g. caffeine, cocaine), including withdrawal effects (e.g. alcohol, benzodiazepines)\"; \"not better accounted for by another mental disorder\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n17
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 272: \"Panic attacks are common in the general population\"; tr. 271: \"the presence of panic attacks is not in itself sufficient to assign a diagnosis of panic disorder\"; tr. 285: \"it is common for individuals to experience anxiety about speaking in public\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n18
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders", "https://www.psychiatry.org/patients-families/anxiety-disorders/what-are-anxiety-disorders"]
  trich: "WHO: \"Anxiety disorders increase the risk for depression and substance use disorders\". APA: \"frequently occur alongside other conditions such as depression\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n19
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/29550689"]
  trich: "Hofmann & Hay (2018): \"Avoidance is typically considered a maladaptive behavioral response to excessive fear and anxiety, leading to the maintenance of anxiety disorders.\""
  ghi_chu: "Toàn văn (PMC5879019 qua NCBI E-utilities)."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n20
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/29550689"]
  trich: "Hofmann & Hay (2018), toàn văn: \"Avoidance is assumed to be learned through negative reinforcement because the avoidance behavior either prevents a stimulus from occurring or it reduces the potential harm\"; \"avoidance behaviors subsequently reduce the fear, thereby reinforcing the avoidance behavior\"; \"people with anxiety disorders often avoid these contextual cues, leading to the maintenance of the anxiety\"."
  ghi_chu: "Ý 'mất cơ hội học rằng thứ đó không nguy hiểm' là cách diễn giải phổ biến của mô hình học tập (tránh né chống lại sự dập tắt), khớp với 'resistant to extinction' trong bài."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n21
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders", "https://europepmc.org/article/MED/29550689"]
  trich: "WHO: CBT, \"including exposure therapy, in which people learn to face their fears\". Hofmann & Hay: \"repeated and prolonged exposure to a threat while discouraging patients from using avoidance strategies\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n22
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/29550689"]
  trich: "\"there are occasions when avoidance behaviors can serve as effective coping strategies ... We conclude that avoidance behaviors can be a valuable therapeutic element, depending on the function of these behaviors.\""
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n23
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders"]
  trich: "Các cách tiếp cận có \"the most evidence\" dựa trên CBT, gồm liệu pháp tiếp xúc."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n24
  luot_2: dung
  nguon: ["https://www.nice.org.uk/guidance/cg113/chapter/Recommendations", "https://www.nice.org.uk/guidance/cg159/chapter/Recommendations"]
  trich: "CG113 (hoảng sợ) 1.3.13: \"CBT should be used.\" CG113 (lo âu lan tỏa): \"If a person with GAD chooses a high-intensity psychological intervention, offer either CBT or applied relaxation\"; bước 2 là can thiệp cường độ thấp: \"individual non-facilitated self-help, individual guided self-help and psychoeducational groups\". CG159: \"Do not routinely offer group CBT in preference to individual CBT.\""
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n25
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders"]
  trich: "SSRI \"can also be useful in treating adults with anxiety disorders\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n26
  luot_2: dung
  nguon: ["https://www.nice.org.uk/guidance/cg113/chapter/Recommendations", "https://www.nice.org.uk/guidance/cg159/chapter/Recommendations"]
  trich: "CG113: \"Offer either an individual high-intensity psychological intervention ... or drug treatment\"; \"there is no evidence that either mode of treatment ... is better\". CG159: \"For adults who decline cognitive behavioural interventions and express a preference for a pharmacological intervention ... offer a selective serotonin reuptake inhibitor (SSRI)\"."
  ghi_chu: "CG159 nói 'người từ chối CBT'; 'không dùng được' rộng hơn chữ gốc một chút."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n27
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders", "https://www.nice.org.uk/guidance/cg113/chapter/Recommendations"]
  trich: "WHO: benzodiazepine \"generally not recommended for anxiety disorders because of their high potential for dependence\" và hiệu quả lâu dài hạn chế. CG113: \"Do not offer a benzodiazepine for the treatment of GAD ... except as a short-term measure during crises\"; 1.3.20: \"should not be prescribed for the treatment of individuals with panic disorder\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n28
  luot_2: dung
  nguon: ["https://www.psychiatry.org/patients-families/anxiety-disorders/what-are-anxiety-disorders", "https://europepmc.org/article/MED/24864005"]
  trich: "APA, phần CBT: \"Gradually face feared situations\". Craske và cs. (2014): hướng dẫn nhà lâm sàng tổ chức tiếp xúc theo kế hoạch cho từng rối loạn."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n29
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content", "https://www.psychiatry.org/patients-families/anxiety-disorders/what-are-anxiety-disorders"]
  trich: "CDDR tr. 266–285: yêu cầu chẩn đoán gồm loại nỗi sợ, thời gian, mức khổ sở hay suy giảm, tình trạng loại trừ. APA mô tả các rối loạn lo âu theo DSM-5-TR."
  ghi_chu: "Nhãn: câu kiểm trực tiếp được trong hai hệ thống phân loại; Vững chắc (nếu là nhãn của khung) hợp thước đo."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n30
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/29451967"]
  trich: "Carpenter và cs. (2018): \"We included 41 studies ... (N = 2,843)\"; \"moderate placebo-controlled effects of CBT on target disorder symptoms (Hedges' g = 0.56)\"; \"Large effect sizes were found for OCD, GAD, and acute stress disorder, and small to moderate effect sizes were found for PTSD, SAD, and PD\"; \"Interventions primarily using exposure strategies had larger effect sizes ... though this difference did not reach significance.\""
  ghi_chu: "Chỉ đọc tóm tắt. 41 thử nghiệm gồm cả OCD, PTSD, rối loạn stress cấp; câu của trang không nói 41 thử nghiệm chỉ về ba rối loạn lo âu, nên vẫn đúng."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n31
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/24864005"]
  trich: "Craske và cs. (2014): \"Exposure therapy is an effective approach for treating anxiety disorders, although a substantial number of individuals fail to benefit or experience a return of fear after treatment.\""
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n32
  luot_2: qua-manh
  nguon: ["https://europepmc.org/article/MED/29451967", "https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders"]
  trich: "Carpenter và cs. (2018): CBT hơn giả dược mức vừa (g = 0,56); can thiệp chủ yếu dùng tiếp xúc có hiệu quả lớn hơn \"though this difference did not reach significance\". WHO: các cách tiếp cận có nhiều bằng chứng nhất dựa trên CBT, \"including exposure therapy\"."
  cau_dung: "CBT, kể cả các kỹ thuật tiếp xúc, giảm triệu chứng của nhiều rối loạn lo âu: khá vững."
  ghi_chu: "Nhãn Khá vững hợp thước đo (hiệu quả so với giả dược chỉ nhỏ đến vừa ở lo âu xã hội và hoảng sợ; có phân tích tổng hợp nhưng khác nhau giữa các rối loạn). Chỗ quá mạnh là chữ 'nhất là': phân tích tổng hợp chính chưa thấy tiếp xúc hơn các kỹ thuật CBT khác có ý nghĩa thống kê, và chính n30 của trang nói vậy."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n33
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders"]
  trich: "Rối loạn lo âu \"result from a complex interaction of social, psychological and biological factors\"; người \"have lived through abuse, severe losses or other adverse experiences are more likely to develop one\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n34
  luot_2: qua-manh
  nguon: ["https://europepmc.org/article/MED/11578982"]
  trich: "Hettema, Neale, Kendler (2001): \"heritabilities of 0.43 for panic disorder and 0.32 for generalized anxiety disorder. For panic disorder, the remaining variance in liability could be attributed primarily to nonshared environment. For generalized anxiety disorder, this was true for men, but for women, a potentially significant role for common familial environment was also seen.\""
  cau_dung: "Phân tích tổng hợp các nghiên cứu sinh đôi ước tính gen giải thích khoảng 43% khác biệt về nguy cơ rối loạn hoảng sợ và 32% với lo âu lan tỏa; với rối loạn hoảng sợ, phần còn lại chủ yếu đến từ môi trường riêng của mỗi người, còn với lo âu lan tỏa ở nữ, môi trường chung của gia đình có thể cũng góp phần."
  ghi_chu: "Chỉ đọc tóm tắt. Hai con số đúng. Vế 'phần còn lại phần lớn đến từ trải nghiệm riêng' đúng cho hoảng sợ, nhưng tóm tắt nói rõ với lo âu lan tỏa ở nữ thì môi trường chung có thể đáng kể; 'môi trường riêng' trong mô hình sinh đôi cũng gồm sai số đo, nên 'trải nghiệm riêng' là cách nói hơi mạnh."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n35
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders", "https://europepmc.org/article/MED/11578982"]
  trich: "WHO: \"complex interaction of social, psychological and biological factors\". Hettema và cs.: \"underscoring the importance of identifying putative environmental risk factors\"."
  ghi_chu: "Nhãn (nếu Vững chắc hay Khá vững) hợp thước đo: ý 'nhiều yếu tố cùng tác động' có phân tích tổng hợp sinh đôi và nguồn chuẩn WHO; vế 'ở mỗi người chưa thể tách' là đúng về mặt phương pháp (hệ số di truyền là số của quần thể)."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n36
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/29550689", "https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders"]
  trich: "Hofmann & Hay: tránh né \"leading to the maintenance of anxiety disorders\"; WHO: tiếp xúc, \"in which people learn to face their fears\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n37
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders", "https://www.nhs.uk/mental-health/conditions/generalised-anxiety-disorder/overview/"]
  trich: "WHO: kỹ năng quản lý căng thẳng như thư giãn, chánh niệm \"can also reduce symptoms\"; cách tiếp cận có nhiều bằng chứng nhất dựa trên CBT; SSRI có thể hữu ích. NHS: \"A GP will usually advise you to try talking therapies before they prescribe medicine\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n38
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders"]
  trich: "Benzodiazepine \"generally not recommended for anxiety disorders because of their high potential for dependence\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n39
  luot_2: dung
  nguon: ["https://www.nhs.uk/mental-health/conditions/generalised-anxiety-disorder/overview/", "https://www.psychiatry.org/patients-families/anxiety-disorders/what-are-anxiety-disorders"]
  trich: "NHS: gặp bác sĩ nếu nghĩ mình có thể bị lo âu lan tỏa; lo âu \"affects your everyday life\". APA: triệu chứng \"persistent, and interfere with daily functioning\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n40
  luot_2: dung
  nguon: ["https://www.nhs.uk/conditions/chest-pain/", "https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "NHS: gọi 999 nếu \"you get sudden pain or discomfort in your chest that does not go away\" hay \"you have chest pain and you feel sweaty, sick, light headed or short of breath\"; cơn hoảng sợ là một nguyên nhân có thể của đau ngực. CDDR tr. 271: người bệnh lo \"that the physiological symptoms may be those of a myocardial infarction\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n41
  luot_2: dung
  nguon: ["https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/behaviours/help-for-suicidal-thoughts/"]
  trich: "\"call 999 for an ambulance or go straight to A&E\" khi đã hay có thể sắp làm hại bản thân."
  ghi_chu: "Phần số khẩn cấp là câu về trang Hỗ trợ (ve-site); kiểm ở hồ sơ Hỗ trợ."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n43
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 265–267: \"excessive fear and anxiety ... significant distress or impairment\"; \"Normal anxiety and worry are usually sufficiently self-regulated\"; tr. 3: người chẩn đoán cần được đào tạo."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n44
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/29550689"]
  trich: "\"avoidance behaviors subsequently reduce the fear, thereby reinforcing the avoidance behavior\"; tránh né \"leading to the maintenance of anxiety disorders\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n45
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content"]
  trich: "CDDR tr. 271–272: cơn lặp lại, một số bất ngờ, kèm lo lắng kéo dài hay hành vi tránh, suy giảm rõ; \"Panic attacks are common in the general population\"."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n46
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders", "https://www.nice.org.uk/guidance/cg113/chapter/Recommendations"]
  trich: "WHO: CBT gồm tiếp xúc có nhiều bằng chứng nhất; SSRI có thể hữu ích; benzodiazepine \"generally not recommended\". NICE CG113: CBT cho hoảng sợ, CBT hay thư giãn ứng dụng cho lo âu lan tỏa."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n47
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/29550689", "https://www.psychiatry.org/patients-families/anxiety-disorders/what-are-anxiety-disorders"]
  trich: "Hofmann & Hay: \"an overreliance on the escape strategy ... would lead to social isolation and increased anxiety\". APA: \"Gradually face feared situations\" (trong trị liệu)."
  ghi_chu: "Ý 'không ép' khớp n28 (tiếp xúc có kế hoạch, từng bước)."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n48
  luot_2: khong-chac
  nguon: ["https://www.psychiatry.org/patients-families/anxiety-disorders/what-are-anxiety-disorders", "https://www.nice.org.uk/guidance/cg113/chapter/Recommendations"]
  trich: "APA: lo âu xã hội \"lasts at least six months\". Trang APA không nêu thời gian hay số triệu chứng của lo âu lan tỏa và hoảng sợ. NICE CG113 có thật (26/1/2011, cập nhật 15/6/2020)."
  ghi_chu: "Lo âu xã hội ≥6 tháng: xác nhận qua APA. Lo âu lan tỏa '≥6 tháng, 3/6 triệu chứng' và hoảng sợ '≥1 tháng': đúng theo hiểu biết chung về DSM-5, nhưng không mở được văn bản tiêu chí của APA (psychiatryonline.org 403), nên ghi khong-chac theo yêu cầu. gần chẩn đoán: '3/6 triệu chứng' là ngưỡng đếm, dễ thành bảng tự chấm; nên bỏ số đếm hay để kèm lời 'chỉ chuyên gia áp dụng'."
