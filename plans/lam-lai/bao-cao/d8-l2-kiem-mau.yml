- trang: trai-nghiem/neo-gia
  id: n7
  cau: "Khá vững: hiệu ứng có cả khi neo hoàn toàn ngẫu nhiên và người quyết định là chuyên gia; bằng chứng về chuyên gia từ một số ít nghiên cứu vài chục người."
  loai: nhan
  nguon:
    - ten: "Tversky & Kahneman (1974), Science 185(4157), 1124–1131: câu trích lấy lại từ hồ sơ đã khóa linh-cam-va-xac-suat.yml (toàn văn, Internet Archive)"
      link: https://doi.org/10.1126/science.185.4157.1124
    - ten: "Englich, Mussweiler & Strack (2006), Pers Soc Psychol Bull 32(2), 188–200: toàn văn (PDF trong Internet Archive, bộ wikipedia-scholarly-sources-corpus), nghiên cứu 1–4"
      link: https://doi.org/10.1177/0146167205282152
  ket_qua_luot_1: da-sua
  ghi_chu: 'Cũ: "neo càng cực đoan … thì tác động càng khác" (mơ hồ, không nguồn): bỏ, thay bằng giới hạn về cỡ mẫu.'
- trang: trai-nghiem/linda
  id: n3
  cau: Mọi người thỏa (B) đều thỏa (A), nên xác suất của (B) không thể lớn hơn của (A); thêm một chi tiết chỉ có thể giữ nguyên hay làm giảm xác suất.
  loai: dinh-nghia
  nguon:
    - ten: "Tversky & Kahneman (1983), Psychol Rev 90(4), 293–315: câu trích lấy lại từ hồ sơ đã khóa kiem-dinh/kham-pha/tu-duy/linh-cam-va-xac-suat.yml (toàn văn, Internet Archive)"
      link: https://doi.org/10.1037/0033-295X.90.4.293
  ket_qua_luot_1: da-sua
  ghi_chu: 'Quy tắc xác suất. Công cụ cũ: "mỗi chi tiết … chỉ có thể làm nó khó đúng hơn" (sai khi xác suất giữ nguyên): sửa thành "giữ nguyên hay làm giảm".'
- trang: trai-nghiem/neo-gia
  id: n4
  cau: "Englich và cộng sự (2006), nghiên cứu 3: luật sư trẻ vừa bắt đầu làm thẩm phán ở Đức, hồ sơ vụ án giả định soạn sát thực tế, tự tung xúc xắc bị làm cho luôn ra tổng 3 hoặc 9 (tháng án treo); mức án trung bình 7,81 và 5,28 tháng."
  loai: so-lieu
  nguon:
    - ten: "Englich, Mussweiler & Strack (2006), Pers Soc Psychol Bull 32(2), 188–200: toàn văn (PDF trong Internet Archive, bộ wikipedia-scholarly-sources-corpus), nghiên cứu 1–4"
      link: https://doi.org/10.1177/0146167205282152
  ket_qua_luot_1: da-sua
  ghi_chu: 'Cũ: "thẩm phán hình sự Đức có kinh nghiệm đọc một hồ sơ vụ án có thật" (sai: nghiên cứu 3 là luật sư trẻ; hồ sơ là vụ án giả định sát thực tế); "7,8", "5,3" thành 7,81, 5,28. Sau lượt 2 (Opus, 17/11/2026): giữ; mọi chi tiết có nguyên văn trong toàn văn (lượt 2 chỉ đọc tóm tắt). Review: đạt (Claude Opus 5.5, 17/11/2026): tự mở toàn văn (bản PDF của bài PSPB 32(2) qua Wayback, như lượt 2 bổ sung), Nghiên cứu 3, tr. 193: "junior lawyers from different German courts who had recently received their law degree and had acquired their first experiences as judges"; xúc xắc "always showed the numbers 1 and 2" / "3 and 6", "3 vs. 9 months on probation"; M = 7.81 và 5.28; tài liệu là "fictitious shoplifting case" (tr. 191).'
- trang: trai-nghiem/linda
  id: n17
  cau: "Ngộ nhận: ở phiên bản xếp hạng, nhóm nghiên cứu sinh khoa học quyết định vẫn mắc lỗi ở tỉ lệ cao (85%)."
  loai: so-lieu
  nguon:
    - ten: "Tversky & Kahneman (1983), Psychol Rev 90(4), 293–315: câu trích lấy lại từ hồ sơ đã khóa kiem-dinh/kham-pha/tu-duy/linh-cam-va-xac-suat.yml (toàn văn, Internet Archive)"
      link: https://doi.org/10.1037/0033-295X.90.4.293
  ket_qua_luot_1: da-sua
  ghi_chu: 'Thêm "ở phiên bản xếp hạng"; ở phiên bản so hai phát biểu, phần lớn người đã học nhiều thống kê làm đúng. Sau lượt 2 (Opus, 17/11/2026): giữ. Review: đạt (Claude Opus 5.5, 17/11/2026): cùng bản in, Bảng 1: Sophisticated, Linda: V = 85, N = 32; nhóm tinh vi là "doctoral students in the decision science program of the Stanford Business School".'
