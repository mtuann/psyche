- trang: bat-dau/doc-nhan-chac-chan
  id: n8
  review: sai
  ghi_chu: 'Chữ trên trang đúng ý, nhưng nguồn của hồ sơ (bond2006, trích "We analyze the accuracy… synthesizing research results from 206 documents") chỉ là một ví dụ phân tích tổng hợp, không định nghĩa; cả hai lượt đều dẫn bài này. Loại dinh-nghia cần nguồn định nghĩa (mục 1). Đã mở Cochrane Handbook ch. 10 (cochrane.org, 30/10/2026): "Meta-analysis is the statistical combination of results from two or more separate studies." Chữ "gộp kết quả" thiếu ý "bằng thống kê", là chỗ phân biệt với tổng quan thường.'
  de_xuat: "*Phân tích tổng hợp* là bài dùng thống kê gộp kết quả của nhiều nghiên cứu để rút ra một ước lượng chung. (nguồn: Cochrane Handbook, ch. 10, thay bond2006)"
- trang: bat-dau/doc-nhan-chac-chan
  id: n10
  review: dung
  ghi_chu: 'Nosek và cộng sự (2018) tóm tắt: "define the research questions and analysis plan before observing the research outcomes… distinguishes… predictions from… postdictions"; chữ trang bám sát. Lượt 2 dẫn DOI của Hagger 2016 (không phải nguồn định nghĩa) nên chỉ dựa được vào lượt 1.'
- trang: bat-dau/doc-nhan-chac-chan
  id: n11
  review: dung
  ghi_chu: Trang bỏ con số (Cepeda có trang nhà duong-cong-quen), còn "rất nhiều thí nghiệm"; đúng với 317 thí nghiệm trong tóm tắt.
- trang: bat-dau/doc-nhan-chac-chan
  id: n12
  review: dung
  ghi_chu: "Nhãn Vững chắc cho hiệu ứng giãn cách: có phân tích tổng hợp lớn (Cepeda 2006), cùng chiều, không có thất bại tái lập lớn đã biết, nhiều tuổi và chất liệu. Đạt mục 4. Giới hạn (chỉ nhớ ngôn từ) đúng là của Cepeda, không đổi nhãn. Ví dụ minh họa; trang nhà gắn nhãn chính thức."
- trang: bat-dau/doc-nhan-chac-chan
  id: n13
  review: sai
  ghi_chu: 'Đọc tóm tắt Jussim và Harber (2005) qua Crossref (30/10/2026): "these effects are typically small, they do not accumulate greatly… and they may be more likely to dissipate than accumulate". Trang viết "thường nhỏ và hay phai đi hơn là tích tụ": "hay phai đi" thành khẳng định chắc, bài gốc chỉ nói "may be more likely". Phần còn lại đúng.'
  de_xuat: Tổng quan 35 năm nghiên cứu cho thấy hiệu ứng này có thật, nhưng thường nhỏ, không tích tụ nhiều theo thời gian, và có thể phai đi.
- trang: bat-dau/doc-nhan-chac-chan
  id: n15
  review: dung
  ghi_chu: "Khá vững theo mục 4: nhiều nghiên cứu cùng chiều, hiệu ứng nhỏ, khác nhau theo điều kiện (Jussim và Harber 2005: mạnh hơn ở nhóm bị kỳ thị; một phần do kỳ vọng chính xác). Không phải Đang tranh cãi vì sự tồn tại của hiệu ứng không bị mâu thuẫn. Khớp khung Khá vững của trang nhà thi-nghiem/pygmalion ở site cũ."
- trang: bat-dau/doc-nhan-chac-chan
  id: n18
  review: dung
  ghi_chu: 'Crossref (30/10/2026): Vohs 2021 "k = 36; N = 3,531… Confirmatory tests found a nonsignificant result (d = 0.06)"; Hagger 2016 N = 2.141, d = 0,04 (hai lượt). "Gần bằng 0" đúng cho phân tích xác nhận. Không có trang nhà trong nghien-cuu.yml nên con số được phép.'
- trang: bat-dau/doc-nhan-chac-chan
  id: n19
  review: dung
  ghi_chu: 'Đang tranh cãi đạt mục 4 (tái lập lớn đăng ký trước thất bại; hiệu ứng nhỏ hơn nhiều so với ban đầu). Hai tái lập thất bại đã sát mức "Đã bị bác bỏ" (mục 4: kiểm tra đủ mạnh liên tục thất bại), nhưng tóm tắt Vohs 2021 có lý do để chưa bác bỏ: phân tích thăm dò toàn mẫu d = 0,08 có ý nghĩa, Bayes "about equally likely", hiệu ứng lớn hơn ở người mệt. Đề nghị sửa ly_do: thay vế "các nguồn cho rằng tranh luận về phương pháp còn tiếp" (chưa có nguồn) bằng ý này của Vohs 2021; nhất quán với ngo-nhan.yml.'
- trang: bat-dau/doc-nhan-chac-chan
  id: n20
  review: dung
  ghi_chu: 'Pashler 2008: "virtually no evidence for the interaction pattern"; chữ trang "gần như không thấy bằng chứng ủng hộ" đúng. Loại nên là phat-hien (tổng quan, không phải tái lập), không đổi chữ.'
- trang: bat-dau/doc-nhan-chac-chan
  id: n21
  review: dung
  ghi_chu: 'Crossref (30/10/2026): "Drawing on 17 meta-analyses… studies testing the matching hypothesis (effect size d = .04)". Hattie 2025 không có hồ sơ nghiên cứu trong nghien-cuu.yml nên con số không trái luật trang nhà; người gom có thể rút về trang nhà phong-cach-hoc khi bài ấy lên.'
- trang: bat-dau/doc-nhan-chac-chan
  id: n22
  review: dung
  ghi_chu: 'Đã bị bác bỏ đạt điều kiện thứ nhất của mục 4 (Pashler 2008; Hattie 2025: "overwhelming evidence discrediting the matching hypothesis", d = 0,04). Có một phân tích tổng hợp 2024 (Clinton-Lisell và Litzinger, lượt 2 dẫn) thấy g = 0,31 nhưng tác giả vẫn kết luận lợi ích quá nhỏ và hiếm; không đủ để hạ xuống Đang tranh cãi ở trang ví dụ. Trang nhà kham-pha/tri-nho/phong-cach-hoc nên nhắc bài 2024 khi lên.'
- trang: bat-dau/doc-nhan-chac-chan
  id: n23
  review: dung
  ghi_chu: Câu chỉ nhắc lại điều kiện thứ ba của Đang tranh cãi ở mục 4; đúng. Thực chất là câu ve-site (không cần co_so), có thể đổi loại.
- trang: bat-dau/doc-nhan-chac-chan
  id: n25
  review: dung
  ghi_chu: Chữ cuối "có thể liên quan tới… sức mạnh thống kê thấp, thiên lệch xuất bản, báo cáo và phân tích có chọn lọc" khớp câu trích OSC 2015 (low-powered designs, emphasis on positive results, selective reporting/analysis); không còn "phần lớn… là do".
- trang: bat-dau/doc-nhan-chac-chan
