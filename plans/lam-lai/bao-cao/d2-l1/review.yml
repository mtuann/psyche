- trang: bat-dau/index
  id: n21
  review: dung
  ghi_chu: Trang và lời giải thích câu hỏi đều viết "Trong dự án này/Trong dự án ấy, mỗi nghiên cứu chỉ được làm lại một lần"; khớp OSC 2015 với mẫu 100 nghiên cứu.
- trang: bat-dau/index
  id: n23
  review: dung
  ghi_chu: "Klein 2018 tóm tắt: tái lập đăng ký trước 28 phát hiện, 125 mẫu; chữ cuối chỉ giữ điều đã kiểm."
- trang: bat-dau/index
  id: n24
  review: dung
  ghi_chu: 'Henrich 2010 mục 2.1 (dẫn Arnett 2008: 96% từ nước phương Tây công nghiệp hóa); có mốc "theo tổng hợp… (2010)", không đưa 96% (trang nhà bang-chung/mau-va-chon-mau).'
- trang: bat-dau/index
