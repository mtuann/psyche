  ghi_chu: Ba gạch đã bỏ khỏi trang (kiểm trên trang); thay bằng "Nhưng trực giác cũng có thể sai, như ba câu ở đầu trang cho thấy", câu này dựa vào phần đáp án đã có nguồn. Lượt 2 (qua-manh, Zebregs 2015) ủng hộ việc bỏ.
- trang: bat-dau/index
  id: n43
