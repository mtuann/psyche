  ghi_chu: 'So danh sách nguon của hồ sơ với khối "Nguồn đã dùng để kiểm chứng": thiếu hope-hyvongsong và findahelpline-vn, là hai nguồn đã mở cho câu "chưa tìm thấy đường dây quốc gia 24/7" (n25; Find A Helpline chỉ có link ở thân trang); dazzi2014 có link ngay trong câu. Các nguồn còn lại khớp.'
  de_xuat: 'Thêm một dòng: "Câu về đường dây quốc gia 24/7: danh bạ [Find A Helpline](https://findahelpline.com/countries/vn) và trang của các đường dây đã liệt kê ở đó, như [HOPE](https://hyvongsong.com) (12:00–00:00 hằng ngày, không 24/7)."'
