  id: n30
  review: sai
  ghi_chu: 'Danh sách link trong hồ sơ đã cũ: trang hiện link Đường cong quên, Thầy tin trò giỏi, trò có giỏi hơn? (thi-nghiem/pygmalion, thêm khi đổi ví dụ Khá vững), Mỗi người có một "phong cách học"?, Hiệu ứng lớn hay nhỏ?, Cập nhật; không còn link "Trí nhớ có giống cuốn băng ghi hình?" (kham-pha/tri-nho/bang-ghi-hinh). Mọi đích có trong trang.yml; npm test (link.test) đạt.'
  de_xuat: 'Sửa câu của hồ sơ: "Link trong trang: Đường cong quên, Thầy tin trò giỏi, trò có giỏi hơn?, Mỗi người có một “phong cách học”?, Hiệu ứng lớn hay nhỏ?, Cập nhật." (trang không cần sửa)'
