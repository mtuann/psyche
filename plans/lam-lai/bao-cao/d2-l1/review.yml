  ghi_chu: Câu đã bỏ khỏi trang; lượt 2 khong-chac cũng đề nghị bỏ hay làm mềm. Bỏ là đúng.
- trang: bat-dau/index
  id: n34
  review: dung
  ghi_chu: 'Vững chắc cho "khi làm lại quy mô lớn, một phần đáng kể phát hiện không lặp lại": OSC 2015 (36% so với 97%), Many Labs 2 (15/28 có ý nghĩa cùng chiều), hai RRR cạn kiệt ý chí, tổng quan Nosek 2022; nhiều dự án độc lập, nhiều nước, cùng chiều. Đạt mục 4. Ý chính đổi thành khẳng định kiểm được là đúng hướng.'
- trang: bat-dau/index
