  review: dung
  ghi_chu: 'OSC 2015 (hai lượt): mẫu là bài năm 2008 của PSCI, JPSP, JEP:LMC; 100 tái lập, 270 tác giả. "Ba tạp chí lớn" khớp "three important psychology journals".'
