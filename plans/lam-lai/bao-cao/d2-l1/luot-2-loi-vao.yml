  trich: "overwhelming evidence discrediting the matching hypothesis"
  ghi_chu: "Nhãn Đã bị bác bỏ chấp nhận được, nhưng lưu ý một phân tích tổng hợp 2024 (Clinton-Lisell & Litzinger) thấy g = 0,31, dù tác giả vẫn kết luận lợi ích 'too small and too infrequent'; đề nghị trang nói rõ đây là phản biện đã biết."
- trang: bat-dau/doc-nhan-chac-chan
  id: n23
  luot_2: dung
  nguon: ["https://doi.org/10.1177/0956797621989733"]
  trich: "preregistered analyses did not find evidence for a depletion effect"
  ghi_chu: "Khớp tiêu chí 'hiệu ứng nhỏ hơn nhiều tuyên bố ban đầu' trong thước đo mục 4."
- trang: bat-dau/doc-nhan-chac-chan
  id: n24
  luot_2: dung
  nguon: ["https://doi.org/10.1017/S0140525X0999152X"]
  trich: "there is substantial variability in experimental results across populations and WEIRD subjects are particularly unusual"
  ghi_chu: "Khớp; 'chưa chắc đúng với người Việt' là diễn đạt thận trọng."
- trang: bat-dau/doc-nhan-chac-chan
  id: n25
  luot_2: dung
  nguon: ["https://doi.org/10.1126/science.aac4716"]
  trich: "replication success was better predicted by the strength of original evidence"
  ghi_chu: "Ba nguyên nhân là lời giải thích chuẩn trong văn liệu tái lập; chỉ đọc tóm tắt OSC, câu dùng 'có thể liên quan' nên chấp nhận."
- trang: bat-dau/doc-nhan-chac-chan
  id: n26
  luot_2: dung
  nguon: ["https://doi.org/10.1111/j.1539-6053.2009.01038.x"]
  trich: "Further research on the use of learning-styles assessment ... may in some cases be warranted"
  ghi_chu: "Câu về đạo đức nghiên cứu, không cần nguồn ngoài ngữ cảnh; chấp nhận."
