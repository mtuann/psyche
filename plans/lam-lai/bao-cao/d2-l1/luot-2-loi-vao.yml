  ghi_chu: "Phần 'nhớ linh cảm đúng, quên sai' là thiên lệch xác nhận (không mở bài); phần 'chuyện cảm động thuyết phục hơn bảng số liệu' sai khi nói chung: phân tích tổng hợp thấy số liệu có ảnh hưởng mạnh hơn lên niềm tin và thái độ; chuyện mạnh hơn chỉ ở ý định hành động."
