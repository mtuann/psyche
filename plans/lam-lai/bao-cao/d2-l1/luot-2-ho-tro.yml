# Lượt 2, lô D2-L1, phần trang Hỗ trợ (ho-tro/index). Agent: Claude Opus 5.5.
# Mọi trang dưới đây mở ngày 30/10/2026, trừ khi ghi khác.
# Văn bản pháp luật: Luật Khám bệnh, chữa bệnh 15/2023/QH15 đọc ở văn bản hợp nhất 26/VBHN-VPQH (2026);
# Luật Viễn thông 24/2023/QH15 ở bản Công báo; Thông tư 27/2021/TT-BTTTT (sửa Phụ lục của Thông tư 22/2014/TT-BTTTT);
# Nghị định 96/2023/NĐ-CP ở bản toàn văn trên xaydungchinhsach.chinhphu.vn (bản PDF ký số trên vanban.chinhphu.vn là ảnh quét);
# Thông tư 26/2025/TT-BYT ở bản PDF trên datafiles.chinhphu.vn.

- trang: ho-tro/index
  id: n1
  luot_2: dung
  nguon: ["https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/behaviours/help-for-suicidal-thoughts/", "https://datafiles.chinhphu.vn/cpp/files/vbpq/2022/01/27-btttt.pdf"]
  trich: "NHS: \"If you have seriously harmed yourself ... or you feel that you may be about to harm yourself, call 999 for an ambulance or go straight to A&E.\" Thông tư 27/2021/TT-BTTTT, Phụ lục: \"115 Số dịch vụ gọi cấp cứu y tế ... dịch vụ khẩn cấp\"."
  ghi_chu: "Mở 30/10/2026. Lời khuyên khớp NHS (gọi cấp cứu hoặc đến khoa cấp cứu); 115 là số cấp cứu y tế theo quy hoạch kho số."

- trang: ho-tro/index
  id: n2
  luot_2: dung
  nguon: ["https://datafiles.chinhphu.vn/cpp/files/vbpq/2022/01/27-btttt.pdf", "https://vanban.chinhphu.vn/default.aspx?pageid=27160&docid=205070"]
  trich: "Thông tư 27/2021/TT-BTTTT (sửa Thông tư 22/2014/TT-BTTTT), Phụ lục quy hoạch số dịch vụ: \"115 – Số dịch vụ gọi cấp cứu y tế – 3 chữ số – Số dùng chung, dịch vụ toàn quốc, dịch vụ khẩn cấp\"."
  ghi_chu: "Mở 30/10/2026. Bản PDF là ảnh quét có lớp chữ hỏng dấu, đã đọc dòng 115 ở cả mạng cố định và di động. Bộ KH&CN có Thông tư 34/2026/TT-BKHCN về quy hoạch kho số (mst.gov.vn, 27/06/2026); chưa xác nhận được nó có thay Thông tư 22/2014 hay đổi số 115 không, nhưng các trang nhà nước năm 2025–2026 vẫn dùng 113, 114, 115."

- trang: ho-tro/index
  id: n3
  luot_2: dung
  nguon: ["https://datafiles.chinhphu.vn/cpp/files/vbpq/2022/01/27-btttt.pdf", "https://bocongan.gov.vn/bai-viet/gop-phan-dam-bao-an-ninh-trat-tu-an-toan-xa-hoi-tren-dia-ban-tinh-bac-lieu-d23-t40579"]
  trich: "Thông tư 27/2021, Phụ lục: \"113 – Số dịch vụ gọi công an – ... dịch vụ khẩn cấp\". Bộ Công an (Công an tỉnh Bạc Liêu, 06/08/2024): Cảnh sát 113 \"thường trực 24/24h tiếp nhận các thông tin về ANTT do Nhân dân báo trực tiếp qua số máy khẩn cấp 113\"."
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n4
  luot_2: dung
  nguon: ["https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/behaviours/help-for-suicidal-thoughts/"]
  trich: "\"Talk to someone you trust. Let family or friends know what's going on for you. They may be able to offer support and help keep you safe.\" ... \"get yourself to a safe place, like a friend's house\", \"be around other people\"."
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n5
  luot_2: dung
  nguon: ["https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/01/luat24.pdf", "https://datafiles.chinhphu.vn/cpp/files/vbpq/2022/01/27-btttt.pdf"]
  trich: "Luật Viễn thông 24/2023/QH15, Điều 25: \"1. Dịch vụ viễn thông khẩn cấp là dịch vụ gọi đến các số dịch vụ khẩn cấp của cơ quan công an, cứu hỏa, cấp cứu ... 3. Doanh nghiệp viễn thông có trách nhiệm ... c) Cung cấp miễn phí dịch vụ viễn thông khẩn cấp cho người sử dụng dịch vụ điện thoại.\""
  ghi_chu: "Mở 30/10/2026. Luật có hiệu lực từ 01/07/2024 (Công báo số 29+30, 05/01/2024). Số 113, 114, 115 là số dịch vụ khẩn cấp theo Phụ lục Thông tư 27/2021/TT-BTTTT. Luật miễn phí cuộc gọi (dịch vụ viễn thông), không nói về chi phí dịch vụ cấp cứu."

- trang: ho-tro/index
  id: n6
  luot_2: dung
  nguon: ["https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/low-mood-sadness-depression/"]
  trich: "\"Most people feel low sometimes, but if it's affecting your life ... Support is also available if you're finding it hard to cope with low mood\"; \"try talking about your feelings to a friend, family member, healthcare professional or counsellor\"."
  ghi_chu: "Mở 30/10/2026. NHS khuyên tìm người nói chuyện, kể cả chuyên gia, ngay cả khi chỉ là tâm trạng xuống, không đòi phải nặng."

- trang: ho-tro/index
  id: n9
  luot_2: qua-manh
  nguon: ["https://datafiles.chinhphu.vn/cpp/files/vbpq/2022/01/27-btttt.pdf", "https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/behaviours/help-for-suicidal-thoughts/"]
  trich: "Thông tư 27/2021, Phụ lục: \"113 – Số dịch vụ gọi công an\", \"114 – Số dịch vụ gọi cứu hỏa\", \"115 – Số dịch vụ gọi cấp cứu y tế\"."
  cau_dung: "115 là số cấp cứu y tế: gọi khi có tình huống sức khỏe nguy hiểm đến tính mạng, kể cả khi đã tự làm hại hoặc sắp tự làm hại."
  ghi_chu: "Mở 30/10/2026. Phần \"kể cả nguy cơ tự làm hại\" đúng (NHS: tự làm hại hay sắp tự làm hại thì gọi xe cấp cứu). Nhưng \"mọi trường hợp nguy hiểm đến tính mạng\" rộng hơn văn bản: cháy là 114, bạo lực, tội phạm là 113. Chỉ cần thu hẹp về \"cấp cứu y tế\"."

- trang: ho-tro/index
  id: n10
  luot_2: qua-manh
  nguon: ["https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/01/luat24.pdf", "https://xaydungchinhsach.chinhphu.vn/quy-dinh-moi-ve-truc-kham-chua-benh-tu-1-1-2024-119240103065651053.htm"]
  trich: "Luật Viễn thông 2023, Điều 25 khoản 3 điểm c: \"Cung cấp miễn phí dịch vụ viễn thông khẩn cấp cho người sử dụng dịch vụ điện thoại.\" Xây dựng chính sách (Chính phủ) về quy định trực từ 01/01/2024: cơ sở cấp cứu ngoại viện \"trực cấp cứu 24/24 giờ trong ngày (kể cả ngày lễ, ngày nghỉ)\"."
  cau_dung: "115: 24/7; cuộc gọi miễn phí."
  ghi_chu: "Mở 30/10/2026. 24/7 đúng. Văn bản chỉ bảo đảm miễn phí cuộc gọi. Tôi không tìm được văn bản chính thức nói dịch vụ cấp cứu, vận chuyển 115 miễn phí; các bài tìm thấy (chưa mở được trang chính thức) cho thấy giá vận chuyển cấp cứu ngoại viện do từng tỉnh quy định, ví dụ Hà Nội theo Quyết định 45/2017/QĐ-UBND. Viết \"miễn phí\" không kèm \"cuộc gọi\" có thể làm người đọc hiểu cả dịch vụ miễn phí."

- trang: ho-tro/index
  id: n11
  luot_2: dung
  nguon: ["https://datafiles.chinhphu.vn/cpp/files/vbpq/2022/01/27-btttt.pdf", "https://bocongan.gov.vn/bai-viet/gop-phan-dam-bao-an-ninh-trat-tu-an-toan-xa-hoi-tren-dia-ban-tinh-bac-lieu-d23-t40579"]
  trich: "Phụ lục Thông tư 27/2021: \"113 – Số dịch vụ gọi công an – dịch vụ khẩn cấp\". Bộ Công an: số 113 dùng \"khi cần báo tin các vụ việc về ANTT cho cơ quan Công an\" và khi cần Công an giúp đỡ lúc gặp nạn."
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n12
  luot_2: dung
  nguon: ["https://bocongan.gov.vn/bai-viet/gop-phan-dam-bao-an-ninh-trat-tu-an-toan-xa-hoi-tren-dia-ban-tinh-bac-lieu-d23-t40579"]
  trich: "Lực lượng Cảnh sát 113 \"thường trực 24/24h tiếp nhận các thông tin về ANTT do Nhân dân báo trực tiếp qua số máy khẩn cấp 113\"."
  ghi_chu: "Mở 30/10/2026. Bài trên cổng Bộ Công an (06/08/2024), nói về một tỉnh; tôi không thấy văn bản quy định chung giờ trực của 113, nhưng nhiều bài khác trên bocongan.gov.vn cùng nói trực 24/24."

- trang: ho-tro/index
  id: n13
  luot_2: dung
  nguon: ["https://tongdai111.vn/sites/gioi-thieu", "https://datafiles.chinhphu.vn/cpp/files/vbpq/2022/01/27-btttt.pdf"]
  trich: "Phụ lục Thông tư 27/2021: \"111 – Số dịch vụ gọi Tổng đài điện thoại quốc gia bảo vệ trẻ em\". tongdai111.vn: \"Tổng đài điện thoại Quốc gia Bảo vệ Trẻ em là dịch vụ công đặc biệt thành lập theo quy định của Luật trẻ em 2016\"."
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n14
  luot_2: dung
  nguon: ["https://tongdai111.vn/tin/cac-linh-vuc-hoat-dong-va-chuc-nang-cua-tong-dai-111", "https://tongdai111.vn/sites/gioi-thieu"]
  trich: "Tổng đài tiếp nhận thông tin \"từ trẻ em và người dân\"; \"Tiếp nhận thông báo, tố giác từ cơ quan, tổ chức, cơ sở giáo dục, gia đình, cá nhân qua điện thoại\"; các lĩnh vực gồm \"xâm hại, bạo lực trẻ em\", \"bị bóc lột, bị mua bán\", \"bị bỏ rơi, bỏ mặc, sao nhãng\", và tư vấn tâm lý."
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n15
  luot_2: dung
  nguon: ["https://tongdai111.vn/sites/gioi-thieu"]
  trich: "\"... chịu sự quản lý của Trung tâm Tư vấn và Dịch vụ Truyền Thông thuộc Cục Bà mẹ và Trẻ em - Bộ Y tế\" (dẫn Quyết định số 1688/QĐ-BYT ngày 19/5/2025)."
  ghi_chu: "Mở 30/10/2026. Đơn vị trực tiếp là Trung tâm Tư vấn và Dịch vụ Truyền thông, thuộc Cục Bà mẹ và Trẻ em, Bộ Y tế; câu của trang đúng ở mức Cục. Vài chỗ cũ trên cùng trang còn nhắc Bộ LĐ-TB&XH (trước khi chuyển về Bộ Y tế năm 2025)."

- trang: ho-tro/index
  id: n16
  luot_2: dung
  nguon: ["https://tongdai111.vn/sites/gioi-thieu"]
  trich: "\"Tổng đài hoạt động 24/24 và các cuộc gọi đến tổng đài là hoàn toàn miễn phí.\""
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n17
  luot_2: dung
  nguon: ["https://duongdaynongngaymai.vn/"]
  trich: "\"Hotline: 096 306 1414\"; \"096 306 1414 (13h00 - 20h30) Thứ 4, Thứ 5, Thứ 6, Thứ 7 & Chủ Nhật\"."
  ghi_chu: "Mở 30/10/2026. Trang chính thức là duongdaynongngaymai.vn (tìm qua Find A Helpline). Tên miền ngaymai.vn không phải của dự án (nay là trang lỗi; bản lưu cũ là một công ty thiết bị y tế), đừng dẫn."

- trang: ho-tro/index
  id: n18
  luot_2: dung
  nguon: ["https://duongdaynongngaymai.vn/"]
  trich: "\"Sơ cứu và hỗ trợ tâm lý miễn phí qua điện thoại cho người trầm cảm và người thân của họ\"; \"Dự án hỗ trợ người trẻ trầm cảm\"."
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n19
  luot_2: dung
  nguon: ["https://duongdaynongngaymai.vn/"]
  trich: "\"... do tác giả Đặng Hoàng Giang và chuyên gia tâm lý Nguyễn Hà Thành khởi xướng, và được triển khai bởi một nhóm tình nguyện viên ...\"; \"là dự án cộng đồng, phi lợi nhuận\"."
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n20
  luot_2: dung
  nguon: ["https://duongdaynongngaymai.vn/"]
  trich: "\"096 306 1414 (13h00 - 20h30) Thứ 4, Thứ 5, Thứ 6, Thứ 7 & Chủ Nhật\"."
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n21
  luot_2: dung
  nguon: ["https://duongdaynongngaymai.vn/"]
  trich: "\"Sơ cứu tâm lý miễn phí qua điện thoại\"."
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n22
  luot_2: dung
  nguon: ["https://csaga.org.vn/", "https://csaga.org.vn/lien-he.html"]
  trich: "\"Hotline tư vấn miễn phí về Bạo lực Giới - Bạo lực Gia đình và LGBTQ - Nữ Yêu Nữ: 024 3333 55 99\"."
  ghi_chu: "Mở 30/10/2026. Số văn phòng khác: (+84-024) 3754 0421 (trang Liên hệ), không phải hotline."

- trang: ho-tro/index
  id: n23
  luot_2: dung
  nguon: ["https://csaga.org.vn/"]
  trich: "\"Hotline tư vấn miễn phí về Bạo lực Giới - Bạo lực Gia đình và LGBTQ - Nữ Yêu Nữ\"."
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n24
  luot_2: dung
  nguon: ["https://csaga.org.vn/", "https://csaga.org.vn/lien-he.html"]
  trich: "Trang chủ và trang Liên hệ chỉ ghi số hotline, số văn phòng, địa chỉ; không có giờ trực."
  ghi_chu: "Mở 30/10/2026; đã tìm chữ \"giờ\", \"thứ\" trong cả hai trang, không có giờ trực."

- trang: ho-tro/index
  id: n25
  luot_2: khong-chac
  nguon: ["https://findahelpline.com/countries/vn", "https://hyvongsong.com/", "https://bvtt-tphcm.org.vn/lien-he/"]
  trich: "hyvongsong.com (HOPE): \"Đường dây nóng của chúng tôi hoạt động hằng ngày từ 12:00 đến 00:00\"; \"HOPE là một tổ chức phi lợi nhuận ... được thành lập vào năm 2025\"."
  ghi_chu: "Câu phủ định, không có nguồn bậc 1 nào xác nhận được. Lượt 2 tìm độc lập (30/10/2026) cũng không thấy đường dây quốc gia 24/7 riêng cho sức khỏe tâm thần người lớn hay phòng chống tự sát. Nhưng Find A Helpline có liệt kê một đường dây phòng chống tự sát mà trang có thể chưa nhắc: HOPE – Suicide Prevention Hotline, 0865 044 400, tổ chức phi lợi nhuận lập năm 2025, 12:00–00:00 hằng ngày (không 24/7, không phải của nhà nước). Bệnh viện Tâm thần TP.HCM có hotline 1900.1267 (không ghi giờ). Người gom nên xem có thêm HOPE vào trang không (sau khi kiểm như các đường dây khác), và giữ câu phủ định kèm mốc thời gian."

- trang: ho-tro/index
  id: n26
  luot_2: dung
  nguon: ["https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/behaviours/help-for-suicidal-thoughts/"]
  trich: "\"... or you feel that you may be about to harm yourself, call 999 for an ambulance or go straight to A&E.\""
  ghi_chu: "Mở 30/10/2026. 115 là số cấp cứu y tế 24/7 ở Việt Nam (xem n2, n10)."

- trang: ho-tro/index
  id: n27
  luot_2: dung
  nguon: ["https://findahelpline.com/countries/vn"]
  trich: "Trang liệt kê 5 dịch vụ ở Việt Nam (Ngày mai, HOPE, Tổng đài 111, đường dây của CSAGA, Ngôi nhà Bình yên); chân trang: Find A Helpline là \"a public service made with ♡ by ThroughLine\"."
  ghi_chu: "Mở 30/10/2026. Một số mục ghi \"Information verified by this helpline\" nhưng danh bạ do ThroughLine quản lý, không phải do các đơn vị ở Việt Nam."

- trang: ho-tro/index
  id: n28
  luot_2: khong-chac
  ghi_chu: "Chỉ kiểm được Bệnh viện Tâm thần TP.HCM (số ghi ở trang Liên hệ của bệnh viện). Trang của Bệnh viện Tâm thần Trung ương 1 (bvtttw1.gov.vn) và Bệnh viện Bạch Mai (bachmai.gov.vn) không mở được từ máy kiểm (kết nối bị từ chối, hết giờ chờ, ngày 30/10/2026), Internet Archive không có bản lưu dùng được; chưa tìm được trang chính thức của Bệnh viện Tâm thần Trung ương 2 (bvtttw2.vn không phân giải). Nên kiểm lại từ máy ở Việt Nam."

- trang: ho-tro/index
  id: n29
  luot_2: khong-chac
  ghi_chu: "Với Bệnh viện Tâm thần TP.HCM thì đúng: 028 39234675 là số \"Điện thoại\" chung ở mục liên hệ; đường dây bệnh viện gọi là \"HOTLINE\" là 1900.1267. Ba bệnh viện còn lại không mở được trang chính thức (xem n28), nên chưa xác nhận được số trên trang có phải số tổng đài chung hay không."

- trang: ho-tro/index
  id: n30
  luot_2: khong-chac
  ghi_chu: "bvtttw1.gov.vn không mở được (hết giờ chờ, 30/10/2026); không có bản lưu Internet Archive. Số 024 3385 3227 chỉ thấy ở danh bạ, trang thứ ba (Long Châu, Medpro), nên không đủ chuẩn."

- trang: ho-tro/index
  id: n31
  luot_2: khong-chac
  ghi_chu: "bachmai.gov.vn từ chối kết nối (30/10/2026); bản lưu Internet Archive 12/09/2024 của trang Viện Sức khỏe Tâm thần chỉ ghi hotline chung của Bạch Mai (1900.888.866 - 096.985.1616), không có số 024 3576 5344. Số này chỉ thấy ở danh bạ, trang thứ ba; một nguồn quốc tế nói nó nối tới phòng khám của Viện."

- trang: ho-tro/index
  id: n32
  luot_2: khong-chac
  ghi_chu: "Chưa tìm được trang chính thức của Bệnh viện Tâm thần Trung ương 2 (bvtttw2.vn, bvtttw2.gov.vn không phân giải, 30/10/2026). Không trang nào tôi mở được ghi số 0251 3822 965. Tuổi Trẻ (06/2025) đưa tin Đồng Nai đề xuất di dời bệnh viện: nên kiểm cả địa chỉ."

- trang: ho-tro/index
  id: n33
  luot_2: dung
  nguon: ["https://bvtt-tphcm.org.vn/lien-he/"]
  trich: "Trang Liên hệ: \"Điện thoại: (028) 39234675\"."
  ghi_chu: "Mở 30/10/2026. Chân trang chủ in thiếu một số: \"(028) 9234675\"; trang Liên hệ ghi đủ. Bệnh viện còn có HOTLINE 1900.1267."

- trang: ho-tro/index
  id: n34
  luot_2: dung
  nguon: ["https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-quy-dinh-chi-tiet-mot-so-dieu-cua-luat-kham-benh-chua-benh-119240115115947657.htm"]
  trich: "Nghị định 96/2023/NĐ-CP, Điều 5 khoản 8: cơ sở hướng dẫn thực hành tâm lý lâm sàng là \"bệnh viện hoặc cơ sở tâm lý lâm sàng, trong đó bệnh viện phải có phạm vi hoạt động chuyên môn về chuyên khoa tâm thần hoặc có bộ phận chuyên môn về tâm lý lâm sàng\"."
  ghi_chu: "Mở 30/10/2026. Văn bản cho thấy bệnh viện (không riêng bệnh viện tâm thần) có thể có chuyên khoa tâm thần hay bộ phận tâm lý lâm sàng; câu đã viết thận trọng (\"có thể có\", \"gọi hỏi trước\"). Ví dụ: Viện Sức khỏe Tâm thần thuộc Bệnh viện Bạch Mai, bệnh viện đa khoa."

- trang: ho-tro/index
  id: n35
  luot_2: dung
  nguon: ["https://baochinhphu.vn/nghi-quyet-cua-quoc-hoi-ve-sap-xep-don-vi-hanh-chinh-cap-tinh-102250612191145158.htm", "https://bvtt-tphcm.org.vn/"]
  trich: "Nghị quyết 202/2025/QH15 (12/6/2025) sắp xếp còn 34 tỉnh, thành; chính quyền mới hoạt động từ 1/7/2025. bvtt-tphcm.org.vn: đầu trang ghi \"Cơ sở 1: Số 766 đường Võ Văn Kiệt, Phường Chợ Quán\", chân trang vẫn ghi \"766 Võ Văn Kiệt, Phường 1, Quận 5\"."
  ghi_chu: "Mở 30/10/2026. Chính trang của một bệnh viện trong danh sách còn ghi địa chỉ theo địa giới cũ."

- trang: ho-tro/index
  id: n36
  luot_2: dung
  nguon: ["https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/low-mood-sadness-depression/", "https://www.nhs.uk/mental-health/advice-for-life-situations-and-events/how-to-help-someone-with-depression/"]
  trich: "\"Most people feel low sometimes\"; \"A low mood often gets better after a few days or weeks.\" \"Feeling down or depressed from time to time is normal. But if these feelings last 2 weeks or more, or start to affect everyday life, this can be a sign of depression.\""
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n37
  luot_2: dung
  nguon: ["https://www.nimh.nih.gov/health/publications/my-mental-health-do-i-need-help", "https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/low-mood-sadness-depression/"]
  trich: "NIMH: \"Have you had severe symptoms for 2 weeks or more? ... Seek professional help.\" NHS: \"See a GP if: you've had a low mood for more than 2 weeks\"; \"If your low mood does not go away and the things you're doing are not helping, then you may need medical help.\""
  ghi_chu: "Mở 30/10/2026. NIMH áp dụng cho cảm giác \"sad, stressed, or worried\"."

- trang: ho-tro/index
  id: n38
  luot_2: dung
  nguon: ["https://www.nimh.nih.gov/health/publications/my-mental-health-do-i-need-help", "https://www.nhs.uk/mental-health/advice-for-life-situations-and-events/how-to-help-someone-with-depression/"]
  trich: "NIMH, dấu hiệu nên tìm chuyên gia: \"Trouble completing your tasks and activities\", \"Changes in appetite, weight, sleep, or sex drive\". NHS: \"... or start to affect everyday life, this can be a sign of depression\"."
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n39
  luot_2: dung
  nguon: ["https://www.nimh.nih.gov/health/publications/warning-signs-of-suicide", "https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/low-mood-sadness-depression/"]
  trich: "NIMH, dấu hiệu cảnh báo: \"Using drugs or alcohol more often\" ... \"get help as soon as possible, particularly if the behavior is new or has increased recently.\" NHS: \"try not to use alcohol, cigarettes, gambling or drugs to relieve a low mood\"."
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n40
  luot_2: dung
  nguon: ["https://www.nhs.uk/mental-health/advice-for-life-situations-and-events/how-to-help-someone-with-depression/"]
  trich: "\"Someone who's depressed does not always realise or acknowledge that they're not feeling or behaving as they usually do. Often it's a partner, family member or carer who first realises that help's needed.\""
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n41
  luot_2: dung
  nguon: ["https://www.nimh.nih.gov/health/publications/my-mental-health-do-i-need-help", "https://www.nimh.nih.gov/health/publications/warning-signs-of-suicide"]
  trich: "\"If you are having thoughts of suicide or urges to hurt yourself, get immediate help.\" Dấu hiệu cảnh báo: \"Talking about: ... Being a burden to others\"."
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n43
  luot_2: dung
  nguon: ["https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/26-vbhn-vpqh.pdf", "https://www.nami.org/about-mental-illness/treatments/types-of-mental-health-professionals/"]
  trich: "Luật Khám bệnh, chữa bệnh, Điều 2 khoản 1: \"Khám bệnh là việc người hành nghề khám bệnh, chữa bệnh sử dụng kiến thức, phương pháp, kỹ thuật chuyên môn để đánh giá tình trạng sức khỏe...\"; khoản 4: người hành nghề là người đã được cấp giấy phép hành nghề. NAMI: psychiatrists \"can diagnose mental health conditions\"; psychologists \"can make diagnoses\"."
  ghi_chu: "Mở 30/10/2026. Văn bản hợp nhất 26/VBHN-VPQH (2026) của Luật 15/2023/QH15."

- trang: ho-tro/index
  id: n44
  luot_2: dung
  nguon: ["https://www.nami.org/about-mental-illness/treatments/types-of-mental-health-professionals/", "https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-quy-dinh-chi-tiet-mot-so-dieu-cua-luat-kham-benh-chua-benh-119240115115947657.htm"]
  trich: "NAMI: \"Psychiatrists are licensed medical doctors who have completed psychiatric training.\" Nghị định 96/2023 dùng chức danh \"bác sỹ với phạm vi hành nghề chuyên khoa tâm thần\"."
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n45
  luot_2: dung
  nguon: ["https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-quy-dinh-chi-tiet-mot-so-dieu-cua-luat-kham-benh-chua-benh-119240115115947657.htm"]
  trich: "Nghị định 96/2023, Điều 8 khoản 8: văn bằng để dự kiểm tra cấp giấy phép chức danh tâm lý lâm sàng: bác sỹ hoặc \"cử nhân tâm lý học ... và có chứng chỉ đào tạo chuyên khoa cơ bản về tâm lý lâm sàng\"; phạm vi chuyên khoa: \"thạc sỹ tâm lý học lâm sàng\", \"tiến sỹ tâm lý học lâm sàng\", văn bằng chuyên khoa tâm lý lâm sàng."
  ghi_chu: "Mở 30/10/2026. Đúng ở mức tóm tắt: không nhất thiết là bằng đại học ngành tâm lý lâm sàng; cử nhân tâm lý học (hay bác sĩ) cộng chứng chỉ đào tạo chuyên khoa cơ bản về tâm lý lâm sàng là đủ để dự kiểm tra."

- trang: ho-tro/index
  id: n46
  luot_2: dung
  nguon: ["https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/26-vbhn-vpqh.pdf"]
  trich: "Điều 26 khoản 1: chức danh phải có giấy phép hành nghề gồm bác sỹ, y sỹ, điều dưỡng, hộ sinh, kỹ thuật y, dinh dưỡng lâm sàng, cấp cứu viên ngoại viện, tâm lý lâm sàng, lương y, người có bài thuốc hoặc phương pháp chữa bệnh gia truyền."
  ghi_chu: "Mở 30/10/2026. Luật không có chức danh tham vấn viên hay chuyên viên tư vấn tâm lý, nên không đặt chuẩn đào tạo cho họ. Câu đúng; chỉ lưu ý luật không nhắc tới họ chứ không phải có điều khoản nói \"không đặt chuẩn\"."

- trang: ho-tro/index
  id: n47
  luot_2: dung
  nguon: ["https://baochinhphu.vn/dieu-kien-hanh-nghe-cong-tac-xa-hoi-102240906124055381.htm"]
  trich: "Điều kiện hành nghề theo Nghị định 110/2024/NĐ-CP: \"Đã tốt nghiệp trung cấp, cao đẳng, đại học, sau đại học chuyên ngành công tác xã hội, xã hội học, tâm lý học, giáo dục đặc biệt hoặc chuyên ngành khoa học xã hội khác theo quy định của pháp luật.\""
  ghi_chu: "Mở 30/10/2026. Bản PDF ký số trên vanban.chinhphu.vn (docid=211080) là ảnh quét, không trích được chữ; dẫn qua Báo Điện tử Chính phủ. Nghị định có hiệu lực 15/10/2024."

- trang: ho-tro/index
  id: n48
  luot_2: dung
  nguon: ["https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/26-vbhn-vpqh.pdf"]
  trich: "Điều 26 khoản 1 điểm a: \"Bác sỹ\" là chức danh phải có giấy phép hành nghề; khoản 3: Bộ trưởng Bộ Y tế quy định phạm vi hành nghề với từng chức danh."
  ghi_chu: "Mở 30/10/2026. Chuyên khoa tâm thần là phạm vi hành nghề ghi trên giấy phép bác sỹ (Nghị định 96/2023 dùng \"bác sỹ với phạm vi hành nghề chuyên khoa tâm thần\")."

- trang: ho-tro/index
  id: n49
  luot_2: dung
  nguon: ["https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/26-vbhn-vpqh.pdf"]
  trich: "Điều 26 khoản 1 điểm h: \"Tâm lý lâm sàng\"; Điều 120 khoản 1: \"Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2024\"."
  ghi_chu: "Mở 30/10/2026. Văn bản hợp nhất 2026 vẫn giữ nguyên các điều này. Lưu ý: kiểm tra đánh giá năng lực cho chức danh tâm lý lâm sàng chỉ bắt đầu từ 01/01/2029 (Điều 120 khoản 3 điểm c; Điều 121 khoản 8)."

- trang: ho-tro/index
  id: n50
  luot_2: dung
  nguon: ["https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/26-vbhn-vpqh.pdf"]
  trich: "Điều 26 khoản 1 liệt kê 10 chức danh phải có giấy phép (điểm a đến k); không có tham vấn viên, chuyên viên tư vấn tâm lý."
  ghi_chu: "Mở 30/10/2026. Khoản 2 cho phép Chính phủ bổ sung chức danh; chưa thấy văn bản bổ sung chức danh này."

- trang: ho-tro/index
  id: n51
  luot_2: dung
  nguon: ["https://baochinhphu.vn/dieu-kien-hanh-nghe-cong-tac-xa-hoi-102240906124055381.htm", "https://vanban.chinhphu.vn/?pageid=27160&docid=211080"]
  trich: "Điều kiện hành nghề: \"Có giấy chứng nhận đăng ký hành nghề công tác xã hội do cơ quan nhà nước có thẩm quyền cấp còn hiệu lực.\" \"Giấy chứng nhận đăng ký hành nghề được cấp có giá trị trong phạm vi toàn quốc và có thời hạn hiệu lực 05 năm.\""
  ghi_chu: "Mở 30/10/2026. Văn bản gốc trên vanban.chinhphu.vn là ảnh quét; đọc chữ qua Báo Điện tử Chính phủ. Chưa xác nhận được điều, khoản cụ thể trong Nghị định 110/2024."

- trang: ho-tro/index
  id: n52
  luot_2: dung
  nguon: ["https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/7/26-byt.pdf"]
  trich: "Thông tư 26/2025/TT-BYT, Điều 2: \"Người hành nghề khám bệnh, chữa bệnh có chứng chỉ hành nghề hoặc giấy phép hành nghề khám bệnh, chữa bệnh với chức danh là bác sỹ, y sỹ có thẩm quyền kê đơn thuốc.\""
  ghi_chu: "Mở 30/10/2026. Thông tư có hiệu lực 01/07/2025, thay Thông tư 52/2017/TT-BYT; áp dụng cho thuốc hóa dược, sinh phẩm điều trị ngoại trú. Luật Khám bệnh, chữa bệnh Điều 62 khoản 2 điểm a cũng giao người hành nghề \"kê đơn thuốc\"."

- trang: ho-tro/index
  id: n53
  luot_2: dung
  nguon: ["https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/7/26-byt.pdf"]
  trich: "Điều 2: thẩm quyền kê đơn thuộc người hành nghề \"với chức danh là bác sỹ, y sỹ\"."
  ghi_chu: "Mở 30/10/2026. Chức danh tâm lý lâm sàng không có trong Điều 2. (Người vừa là bác sỹ vừa có chứng chỉ tâm lý lâm sàng thì vẫn kê đơn theo chức danh bác sỹ, nếu giấy phép là bác sỹ.)"

- trang: ho-tro/index
  id: n54
  luot_2: dung
  nguon: ["https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/7/26-byt.pdf"]
  trich: "Điều 2: chỉ bác sỹ, y sỹ có thẩm quyền kê đơn thuốc."
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n55
  luot_2: dung
  nguon: ["https://www.nami.org/about-mental-illness/treatments/types-of-mental-health-professionals/", "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/26-vbhn-vpqh.pdf"]
  trich: "NAMI: psychiatrists \"can diagnose mental health conditions, prescribe and monitor medications and provide therapy.\" Luật Khám bệnh, chữa bệnh, Điều 62 khoản 2: người hành nghề \"a) Khám bệnh, chỉ định phương pháp chữa bệnh và kê đơn thuốc ... b) Căn cứ vào tình trạng bệnh của người bệnh, áp dụng điều trị ngoại trú, điều trị ban ngày hoặc điều trị nội trú\"."
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n56
  luot_2: dung
  nguon: ["https://www.nami.org/about-mental-illness/treatments/types-of-mental-health-professionals/"]
  trich: "Psychologists \"are trained to evaluate a person's mental health using clinical interviews, psychological evaluations and testing. They can make diagnoses and provide individual and group therapy.\""
  ghi_chu: "Mở 30/10/2026. Nguồn Mỹ. Chưa đọc được phụ lục phạm vi hành nghề tâm lý lâm sàng của Thông tư 32/2023/TT-BYT."

- trang: ho-tro/index
  id: n57
  luot_2: dung
  nguon: ["https://www.nhs.uk/mental-health/talking-therapies-medicine-treatments/talking-therapies-and-counselling/counselling/", "https://www.nami.org/about-mental-illness/treatments/types-of-mental-health-professionals/"]
  trich: "NHS, về counselling: \"You talk to a therapist about your thoughts, feelings and life experiences. They will listen to you and help you find your own solutions to problems.\""
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n58
  luot_2: dung
  nguon: ["https://www.nami.org/about-mental-illness/treatments/types-of-mental-health-professionals/"]
  trich: "\"Social workers (B.A. or B.S.) provide case management, inpatient discharge planning services, placement services and other services to support healthy living.\" Clinical social workers \"are also trained in case management and advocacy services.\""
  ghi_chu: "Mở 30/10/2026. Phần \"bảo vệ người yếu thế\" khớp vai trò advocacy; nguồn Mỹ."

- trang: ho-tro/index
  id: n59
  luot_2: dung
  nguon: ["https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-quy-dinh-chi-tiet-mot-so-dieu-cua-luat-kham-benh-chua-benh-119240115115947657.htm", "https://vanban.chinhphu.vn/?pageid=27160&docid=209491"]
  trich: "Nghị định 96/2023/NĐ-CP, Điều 3 khoản 6: \"Thời gian thực hành khám bệnh, chữa bệnh đối với chức danh tâm lý lâm sàng là 09 tháng.\""
  ghi_chu: "Mở 30/10/2026. Ngoại lệ theo Luật Điều 23 khoản 1: người đã hoàn thành chương trình đào tạo chuyên khoa, hay có giấy phép nước ngoài được thừa nhận, không phải thực hành. Hiệu lực: tính đến 30/10/2026 chưa thấy nghị định thay thế; Bộ Y tế có dự thảo sửa Nghị định 96 và Nghị quyết 21/2026/NQ-CP đổi thẩm quyền cấp phép, nên nên kiểm lại khi gia hạn."

- trang: ho-tro/index
  id: n60
  luot_2: dung
  nguon: ["https://www.nimh.nih.gov/health/topics/psychotherapies", "https://www.nhs.uk/mental-health/talking-therapies-medicine-treatments/talking-therapies-and-counselling/counselling/"]
  trich: "NIMH: \"What are the credentials and experience of the therapist?\" NHS: \"Before choosing a private counsellor, make sure they're on a register accredited by the Professional Standards Authority\"."
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n61
  luot_2: dung
  nguon: ["https://www.nimh.nih.gov/health/topics/psychotherapies", "https://www.nimh.nih.gov/health/find-help"]
  trich: "NIMH: \"Does the therapist recommend a specific time frame or number of sessions?\"; \"Are meetings confidential? How is confidentiality assured? Are there limits to confidentiality?\"; \"How much will treatment cost?\""
  ghi_chu: "Mở 30/10/2026. NIMH hỏi về khung thời gian và số buổi; thời lượng mỗi buổi thì NHS ghi \"Counselling sessions usually last 50 to 60 minutes\"."

- trang: ho-tro/index
  id: n62
  luot_2: khong-chac
  ghi_chu: "Không tìm được nguồn bậc 1 (NHS, NIMH, SAMHSA, WHO, APA) nói đúng ý \"thận trọng với nơi hứa chữa khỏi nhanh, cam kết kết quả, hay chỉ dựa vào một bài trắc nghiệm\". Trang APA về chọn nhà trị liệu chặn máy, trang Mind trả 403. Chỉ thấy ở trang của phòng khám và dịch vụ thương mại. NIMH (psychotherapies) gần nhất: nên hỏi mục tiêu, khung thời gian, cách đánh giá tiến bộ. Luật Khám bệnh, chữa bệnh Điều 7 cấm quảng cáo gian dối về khám chữa bệnh, nhưng không nói đúng ý này. Lời khuyên hợp lý; nên tìm nguồn chính thức hoặc ghi là lời khuyên của site."

- trang: ho-tro/index
  id: n63
  luot_2: dung
  nguon: ["https://www.nimh.nih.gov/health/topics/psychotherapies"]
  trich: "\"... it's important that you feel comfortable with the therapist and have confidence in their expertise.\" \"If you have been in therapy for what feels like a reasonable amount of time and are not getting better, talk to your therapist. You might want to explore other mental health professionals or approaches.\""
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n64
  luot_2: dung
  nguon: ["https://www.nhs.uk/mental-health/advice-for-life-situations-and-events/how-to-help-someone-with-depression/", "https://www.nimh.nih.gov/health/publications/5-action-steps-to-help-someone-having-thoughts-of-suicide"]
  trich: "NHS: \"Let them know you care and are there to listen.\" NIMH: \"BE THERE: Listening without judgment is key to learning what the person is thinking and feeling.\""
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n65
  luot_2: dung
  nguon: ["https://www.nhs.uk/mental-health/advice-for-life-situations-and-events/how-to-help-someone-with-depression/", "https://www.nimh.nih.gov/health/publications/5-action-steps-to-help-someone-having-thoughts-of-suicide"]
  trich: "NHS: \"Accept them as they are, without judging them.\" NIMH: \"Listening without judgment\"."
  ghi_chu: "Mở 30/10/2026. Hai câu ví dụ trong ngoặc là ví dụ của site, nguồn không trích."

- trang: ho-tro/index
  id: n66
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/24998511/", "https://doi.org/10.1017/S0033291714001299"]
  trich: "Dazzi T, Gribble R, Wessely S, Fear NT. Psychol Med. 2014;44(16):3361-3: \"We conducted a review of the published literature examining whether enquiring about suicide induces suicidal ideation ... None found a statistically significant increase in suicidal ideation among participants asked about suicidal thoughts.\""
  ghi_chu: "Đọc tóm tắt qua NCBI E-utilities (PMID 24998511), 30/10/2026. Đây là tổng quan ngắn (bài bình luận), không phải phân tích tổng hợp; câu \"một tổng quan các nghiên cứu\" là đúng mức. NIMH (5 Action Steps) cũng nói: \"Studies show that asking people if they are suicidal does not increase suicidal behavior or thoughts.\""

- trang: ho-tro/index
  id: n67
  luot_2: dung
  nguon: ["https://www.nimh.nih.gov/health/publications/5-action-steps-to-help-someone-having-thoughts-of-suicide"]
  trich: "\"ASK: 'Are you thinking about suicide?' It's not an easy question to ask, but it can help start a conversation.\""
  ghi_chu: "Mở 30/10/2026."

- trang: ho-tro/index
  id: n68
  luot_2: dung
  nguon: ["https://www.nhs.uk/mental-health/advice-for-life-situations-and-events/how-to-help-someone-with-depression/", "https://www.nimh.nih.gov/health/publications/5-action-steps-to-help-someone-having-thoughts-of-suicide"]
  trich: "NHS: \"Get information about the services available to them ...\"; \"Encourage them to talk to a GP.\" NIMH: \"HELP THEM CONNECT ... help them reach out to a trusted family member, friend, spiritual advisor, or mental health professional.\""
  ghi_chu: "Mở 30/10/2026. Ý chính (khuyến khích, cùng tìm thông tin) khớp; chi tiết \"đặt lịch, đi cùng\" là ví dụ của site, hai nguồn không nói từng chữ."

- trang: ho-tro/index
  id: n69
  luot_2: dung
  nguon: ["https://www.nhs.uk/mental-health/advice-for-life-situations-and-events/how-to-help-someone-with-depression/", "https://www.nimh.nih.gov/health/publications/5-action-steps-to-help-someone-having-thoughts-of-suicide"]
  trich: "NHS: \"You can also go to A&E or call 999 if: you're worried someone may harm themselves or others\". NIMH: \"BE THERE\", \"HELP KEEP THEM SAFE\"."
  ghi_chu: "Mở 30/10/2026. 115 là số cấp cứu y tế ở Việt Nam."

- trang: ho-tro/index
  id: n70
  luot_2: dung
  nguon: ["https://www.nhs.uk/mental-health/advice-for-life-situations-and-events/how-to-help-someone-with-depression/"]
  trich: "\"Take care of yourself and your own mental health.\""
  ghi_chu: "Mở 30/10/2026. Phần \"rất tốn sức\" là lời của site; NHS chỉ khuyên tự chăm sóc."
