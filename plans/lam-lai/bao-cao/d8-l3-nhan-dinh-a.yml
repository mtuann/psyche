- trang: bat-dau/ban-nghi-gi
  id: n1
  cau: Nhiều ngộ nhận ở đây được chính giáo viên và sinh viên tâm lý học tin.
  loai: phat-hien
- trang: ngo-nhan/index
  id: n1
  cau: Những khẳng định trên trang rất phổ biến, kể cả trong lớp học.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/bay-con-so
  id: nhan
  cau: '"Trí nhớ ngắn hạn của mọi người chứa được 7 món": đã bị bác bỏ.'
  loai: nhan
- trang: du-lieu/ngo-nhan/bay-con-so
  id: g1
  cau: 7 ± 2 của Miller (1956) là ước lượng ban đầu, đã tính cả các mẹo gom nhóm.
  loai: lich-su
- trang: du-lieu/ngo-nhan/bay-con-so
  id: g2
  cau: Cowan (2001), khi loại bỏ mẹo gom nhóm, ước lượng khoảng 4 cụm.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/bay-con-so
  id: g3
  cau: Con số chính xác còn tranh cãi; giới hạn tùy loại thông tin, cách đo và
    từng người.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/dang-bao-la-dung
  id: nhan
  cau: "Đã đăng trên báo khoa học thì kết luận là đúng: sai (đã bị bác bỏ)."
  loai: nhan
- trang: du-lieu/ngo-nhan/dang-bao-la-dung
  id: g1
  cau: "Nature (Van Noorden 2023): hơn 10.000 bài bị rút năm 2023, kỷ lục; hơn
    8.000 bài của Hindawi, lý do gồm thao túng có hệ thống quy trình xuất bản và
    phản biện."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/eq-hon-iq
  id: nhan
  cau: "EQ quyết định thành công nghề nghiệp nhiều hơn IQ: đang tranh cãi."
  loai: nhan
- trang: du-lieu/ngo-nhan/eq-hon-iq
  id: g1
  cau: Thông điệp "EQ quan trọng hơn IQ" là của bìa Time năm 1995.
  loai: lich-su
- trang: du-lieu/ngo-nhan/eq-hon-iq
  id: g2
  cau: "O'Boyle 2011: ba dòng đo EQ tương quan hiệu chỉnh .24–.30 với hiệu suất;
    dòng 2, 3 dự báo thêm ngoài IQ và Big Five."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/eq-hon-iq
  id: g3
  cau: "Joseph 2015: phần dự báo thêm của EQ dạng hỗn hợp gần bằng 0 khi kiểm soát
    đầy đủ."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/eq-hon-iq
  id: g4
  cau: "Joseph & Newman 2010: EQ năng lực tương quan với hiệu suất ρ ≈ .17, thấp
    hơn năng lực nhận thức."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/gach-chan-hieu-qua
  id: nhan
  cau: "Gạch chân, tô đậm là cách ôn bài hiệu quả: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/gach-chan-hieu-qua
  id: g1
  cau: "Dunlosky 2013: trong 10 kỹ thuật, gạch chân/tô đậm hiệu quả thấp; tự kiểm
    tra và ôn ngắt quãng hiệu quả cao."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/giau-hanh-phuc-thang
  id: nhan
  cau: "Càng giàu thì hạnh phúc càng tăng theo đường thẳng: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/giau-hanh-phuc-thang
  id: g1
  cau: "Kahneman & Deaton 2010: đánh giá cuộc sống tăng đều theo log thu nhập;
    hạnh phúc cảm xúc không tiến thêm sau khoảng 75.000 USD."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/giau-hanh-phuc-thang
  id: g2
  cau: "Killingsworth 2021: hạnh phúc trải nghiệm tăng tuyến tính theo log thu
    nhập, không ngưỡng."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/giau-hanh-phuc-thang
  id: g3
  cau: Mâu thuẫn được hòa giải năm 2023 trên dữ liệu người Mỹ, cách hòa giải còn
    bị bình luận.
  loai: lich-su
- trang: du-lieu/ngo-nhan/hoc-khi-ngu
  id: nhan
  cau: "Bật băng nghe khi ngủ là cách học thêm giờ hiệu quả: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/hoc-khi-ngu
  id: g1
  cau: 'Tổng quan 1955: hiệu ứng "học khi ngủ" (nếu có) xảy ra lúc nửa tỉnh nửa
    mê, không phải giấc ngủ thật.'
  loai: phat-hien
- trang: du-lieu/ngo-nhan/hoc-khi-ngu
  id: g2
  cau: "Phân tích tổng hợp 91 thí nghiệm (2020): nhắc lại ký ức trong giấc ngủ
    sóng chậm có tác dụng nhỏ (g = 0,27); nhắc trong REM hay lúc thức thì
    không."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/iq-co-dinh
  id: nhan
  cau: "IQ cố định, sinh ra sao cả đời vậy: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/iq-co-dinh
  id: g1
  cau: Thứ bậc tương đối khá ổn định và càng ổn định khi lớn; điểm cả thế hệ có
    thể tăng (Flynn).
  loai: phat-hien
- trang: du-lieu/ngo-nhan/iq-co-dinh
  id: g2
  cau: "Ritchie 2018: 142 hiệu ứng từ 42 bộ dữ liệu, hơn 600.000 người; mỗi năm
    học thêm khoảng 1–5 điểm IQ."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/khen-thong-minh
  id: nhan
  cau: 'Khen trẻ "thông minh" giúp trẻ tự tin và học giỏi hơn: đang tranh cãi.'
  loai: nhan
- trang: du-lieu/ngo-nhan/khen-thong-minh
  id: g1
  cau: "Mueller & Dweck 1998 (6 nghiên cứu, học sinh lớp 5): sau thất bại, trẻ
    được khen thông minh kém bền bỉ, kém thích thú, làm bài kém hơn trẻ được
    khen nỗ lực."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/khen-thong-minh
  id: g2
  cau: "Li & Bates 2019: làm lại sát Mueller & Dweck ở trẻ Trung Quốc 9–13 tuổi;
    không khác biệt ở 8 thước đo động lực và quy kết, chỉ điểm làm bài sau thất
    bại sát ngưỡng (p = .049)."
  loai: tai-lap
- trang: du-lieu/ngo-nhan/mau-sac
  id: nhan
  cau: "Sơn xanh giúp tập trung, sơn đỏ làm hăng hơn: đang tranh cãi (bằng chứng
    còn sơ khai)."
  loai: nhan
- trang: du-lieu/ngo-nhan/mau-sac
  id: g1
  cau: "Elliot & Maier 2014: màu có thể ảnh hưởng cảm xúc, nhận thức, hành vi,
    nhưng nghiên cứu còn sơ khai, cần làm rõ điều kiện và khả năng áp dụng trước
    khi khuyến nghị."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/mau-sac
  id: g2
  cau: Hiệu ứng "đỏ làm tăng sức hút" gần như không thấy lại trong các tái lập
    đăng ký trước.
  loai: tai-lap
- trang: du-lieu/ngo-nhan/mau-sac
  id: g3
  cau: (Đã bỏ) Không có màu nào "lập trình" được hành vi.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/mozart
  id: nhan
  cau: "Nghe nhạc Mozart làm trẻ thông minh hơn: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/mozart
  id: g1
  cau: Nghiên cứu gốc năm 1993 làm trên sinh viên đại học, đo một nhiệm vụ không
    gian ngay sau khi nghe nhạc.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/mozart
  id: g2
  cau: Các phân tích tổng hợp 1999 và 2010 thấy hiệu ứng rất nhỏ hoặc gần như
    không có, kèm dấu hiệu thiên lệch xuất bản.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/mozart
  id: g3
  cau: Tổng quan năm 2006 kết luận "hiệu ứng Mozart" không có đủ bằng chứng để làm
    cơ sở cho việc dạy học.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nao-10
  id: nhan
  cau: Khẳng định "con người chỉ dùng 10% bộ não" đã bị bác bỏ.
  loai: nhan
- trang: du-lieu/ngo-nhan/nao-10
  id: g1
  cau: Ghi hoạt động não và kích thích điện khi phẫu thuật chưa tìm thấy vùng não
    nào không có chức năng; tổn thương ở hầu như vùng nào cũng để lại khiếm
    khuyết.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nao-10
  id: g2
  cau: 'Khảo sát năm 2012: 48% giáo viên Anh và 46% giáo viên Hà Lan được hỏi đồng
    ý "ta chỉ dùng 10% bộ não".'
  loai: so-lieu
- trang: du-lieu/ngo-nhan/nao-10
  id: g3
  cau: (Đã bỏ) Não chỉ chiếm khoảng 2% khối lượng cơ thể nhưng dùng khoảng 20%
    năng lượng lúc nghỉ.
  loai: so-lieu
- trang: du-lieu/ngo-nhan/nao-nam-nu
  id: nhan
  cau: 'Não nam và nữ khác nhau căn bản như hai "loại" riêng: đã bị bác bỏ.'
  loai: nhan
- trang: du-lieu/ngo-nhan/nao-nam-nu
  id: g1
  cau: "Hơn 1.400 bộ não (2015): khác biệt trung bình có, nhưng phân bố chồng lấn
    rất nhiều; não có đặc điểm nhất quán ở một đầu rất hiếm."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nao-nam-nu
  id: g2
  cau: Phần lớn não là "khảm" của đặc điểm phổ biến hơn ở nữ, ở nam và ở cả hai.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/ngu-it-da-quen
  id: nhan
  cau: "Ngủ 4–5 tiếng mỗi đêm là đủ, miễn là đã quen: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/ngu-it-da-quen
  id: g1
  cau: "Van Dongen 2003: nằm giường 4 hay 6 tiếng mỗi đêm trong 14 ngày gây suy
    giảm nhận thức tích lũy, tương đương tới 2 đêm thức trắng."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/ngu-it-da-quen
  id: g2
  cau: Buồn ngủ tự báo cáo chỉ tăng thêm ít sau phản ứng ban đầu; người tham gia
    phần lớn không nhận ra mình suy giảm.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nguoi-ngoai-cuoc
  id: nhan
  cau: '"Càng đông người chứng kiến, nạn nhân càng khó được giúp": đang tranh cãi.'
  loai: nhan
- trang: du-lieu/ngo-nhan/nguoi-ngoai-cuoc
  id: g1
  cau: "Phân tích tổng hợp 2011: có người khác hiện diện thì mỗi người ít giúp
    hơn, nhất là khi tình huống mập mờ."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nguoi-ngoai-cuoc
  id: g2
  cau: "Camera 219 vụ xung đột ở Anh, Hà Lan, Nam Phi: khoảng 9/10 vụ có người can
    thiệp; càng đông càng dễ có người giúp."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/nhan-chung
  id: nhan
  cau: "Tận mắt chứng kiến thì khó nhận nhầm người: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/nhan-chung
  id: g1
  cau: Tính đến 11/2026, Innocence Project cho biết hơn 60% thân chủ của họ bị kết
    án oan dựa trên nhận dạng nhầm của nhân chứng.
  loai: thoi-su
- trang: du-lieu/ngo-nhan/nhan-chung
  id: g2
  cau: Trí nhớ được dựng lại, có thể bị thông tin sau sự kiện làm sai lệch; cảm
    giác chắc chắn có thể đi kèm ký ức sai.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nhin-mat-biet-cam-xuc
  id: nhan
  cau: "Nhìn nét mặt là biết chính xác người ta cảm thấy gì: đang tranh cãi."
  loai: nhan
- trang: du-lieu/ngo-nhan/nhin-mat-biet-cam-xuc
  id: g1
  cau: Trong phòng thí nghiệm với đáp án cho sẵn, người ta đoán nét mặt đúng trên
    mức may rủi; tỉ lệ đó bị thổi phồng bởi cách trắc nghiệm ép chọn.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nhin-mat-biet-cam-xuc
  id: g2
  cau: Ngoài đời, cùng một nét mặt có thể ứng với nhiều cảm xúc tùy ngữ cảnh.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/qua-day-thi-muon
  id: nhan
  cau: "Học ngoại ngữ sau tuổi dậy thì là quá muộn, không học nổi: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/qua-day-thi-muon
  id: g1
  cau: "Hartshorne 2018 (669.498 người): khả năng học ngữ pháp giữ gần nguyên đến
    17,4 tuổi rồi giảm dần đều."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/qua-day-thi-muon
  id: g2
  cau: Khả năng giảm dần, không mất ngay sau dậy thì; người bắt đầu muộn khó đạt
    ngữ pháp như bản ngữ hơn.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/ruou-ngu
  id: nhan
  cau: "Uống chút rượu trước khi ngủ giúp ngủ ngon suốt đêm: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/ruou-ngu
  id: g1
  cau: "Ở mọi liều: thiếp đi nhanh hơn, nửa đầu đêm liền hơn, nửa sau gián đoạn
    nhiều hơn."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/ruou-ngu
  id: g2
  cau: Giấc REM đầu tiên đến muộn hơn ở mọi liều; liều vừa và cao làm giảm tổng REM.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/ruou-ngu
  id: g3
  cau: (Đã bỏ) Ngủ sau khi uống rượu là giấc ngủ nông và đứt quãng, không phải ngủ
    sâu.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/stress-hai
  id: nhan
  cau: "Căng thẳng lúc nào cũng có hại, càng tránh càng tốt: đang tranh cãi."
  loai: nhan
- trang: du-lieu/ngo-nhan/stress-hai
  id: g1
  cau: Phản ứng căng thẳng là phản ứng báo động bình thường; theo mô hình của
    Selye, điều đáng lo là căng thẳng kéo dài.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/stress-hai
  id: g2
  cau: 'Crum 2013 (nghiên cứu 2): nhóm xem video "stress có lợi" báo cáo ít triệu
    chứng tâm lý hơn và tự đánh giá hiệu suất cao hơn; đều là tự báo cáo.'
  loai: phat-hien
- trang: du-lieu/ngo-nhan/than-kinh-moi
  id: nhan
  cau: "Não người trưởng thành không sinh thêm tế bào thần kinh mới: đang tranh
    cãi."
  loai: nhan
- trang: du-lieu/ngo-nhan/than-kinh-moi
  id: g1
  cau: "Spalding 2013 (carbon-14 từ thử hạt nhân): khoảng 700 tế bào thần kinh mới
    mỗi ngày ở mỗi hồi hải mã người trưởng thành, giảm nhẹ theo tuổi."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/than-kinh-moi
  id: g2
  cau: Sorrells 2018 không thấy tế bào thần kinh non ở người trưởng thành;
    Boldrini 2018 thấy ở người 14–79 tuổi.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/thang-do-dung-ten
  id: nhan
  cau: "Thang đo nào cũng đo đúng thứ tên của nó gọi: sai (đã bị bác bỏ)."
  loai: nhan
- trang: du-lieu/ngo-nhan/thang-do-dung-ten
  id: g1
  cau: "Độ giá trị: điểm phản ánh đúng khái niệm cần đo; Cronbach & Meehl (1955)
    trình bày cách hiểu giá trị cấu trúc."
  loai: dinh-nghia
- trang: du-lieu/ngo-nhan/thoi-mien
  id: nhan
  cau: "Thôi miên giúp nhớ lại chính xác: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/thoi-mien
  id: g1
  cau: "Tổng quan 2025: thôi miên không tăng nhớ chính xác ở bất kỳ nghiên cứu
    nào, có khi cản trở."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/thoi-mien
  id: g2
  cau: Thôi miên làm tăng việc nhớ ra chuyện chưa từng xảy ra; ký ức ấy tồn tại
    lâu và người ta khá tự tin vào nó.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/thoi-mien
  id: g3
  cau: "(Đã bỏ) Thí nghiệm 96 sinh viên: nhóm bị thôi miên không đoán ngày tháng
    đúng hơn nhưng ít chịu sửa đáp án."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/thuc-khuya-on-thi
  id: nhan
  cau: "Thức trắng đêm thay vì ngủ sau khi học không ảnh hưởng gì đến việc nhớ
    bài: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/thuc-khuya-on-thi
  id: g1
  cau: "Gais 2006 (trong-nhóm, 14 học sinh): ngủ đêm sau khi học nhớ nhiều từ hơn
    so với thức trắng, kiểm tra sau 48 giờ, dù đã ngủ bù."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/thuc-khuya-on-thi
  id: g2
  cau: Nghiên cứu không so việc dùng đêm thức để học thêm với đi ngủ.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/thuong-nao-cung-chet
  id: nhan
  cau: "Bất kỳ phần thưởng nào cũng giết chết đam mê: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/thuong-nao-cung-chet
  id: g1
  cau: "Deci 1971: nhóm được trả tiền về sau tự nguyện chơi ít hơn (p < 0,10);
    nhóm được khen không giảm."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/thuong-nao-cung-chet
  id: g2
  cau: "Deci 1999 (128 nghiên cứu): thưởng vật chất trông đợi làm giảm hứng thú tự
    nguyện; phản hồi tích cực làm tăng (d = 0,33)."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/thuong-ngoai
  id: nhan
  cau: '"Muốn ai chăm hơn thì cứ thưởng nhiều hơn": đang tranh cãi.'
  loai: nhan
- trang: du-lieu/ngo-nhan/thuong-ngoai
  id: g1
  cau: "Deci 1999 (128 nghiên cứu): thưởng vật chất, thưởng được trông đợi làm
    giảm hứng thú tự nguyện."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/thuong-ngoai
  id: g2
  cau: "Phần lớn nghiên cứu làm trong phòng thí nghiệm; Cerasoli 2014: thưởng và
    hứng thú nội tại có thể cùng dự báo hiệu quả công việc."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/trai-dau
  id: nhan
  cau: '"Trái dấu thì hút nhau" (khác mình nhiều thì dễ hấp dẫn hơn): đã bị bác bỏ.'
  loai: nhan
- trang: du-lieu/ngo-nhan/trai-dau
  id: g1
  cau: "Phân tích tổng hợp 313 nghiên cứu: giống nhau thực tế và cảm nhận đều đi
    cùng sức hút mạnh; ở các mối quan hệ đã có, chỉ giống nhau cảm nhận còn liên
    quan."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/trai-dau
  id: g2
  cau: Bằng chứng nghiêng về "giống nhau thì hút nhau", không ủng hộ "khác nhau
    thì hút nhau".
  loai: phat-hien
- trang: du-lieu/ngo-nhan/tram-cam-buon
  id: nhan
  cau: 'Trầm cảm chỉ là buồn nhiều, "vui lên" là hết: sai (đã bị bác bỏ).'
  loai: nhan
- trang: du-lieu/ngo-nhan/tram-cam-buon
  id: g1
  cau: Theo WHO, giai đoạn trầm cảm khác thay đổi tâm trạng thường ngày, kéo dài
    gần như cả ngày, gần như mỗi ngày, ít nhất hai tuần, kèm triệu chứng khác
    (khó tập trung, tội lỗi hay vô dụng, rối loạn giấc ngủ, mệt mỏi…).
  loai: lam-sang
- trang: du-lieu/ngo-nhan/tram-cam-buon
  id: g2
  cau: Trầm cảm có cách điều trị hiệu quả; kỳ thị là một rào cản của việc được
    chăm sóc.
  loai: lam-sang
- trang: du-lieu/ngo-nhan/trang-tron
  id: nhan
  cau: "Trăng tròn làm người ta hành xử kỳ lạ hơn (tai nạn, cấp cứu, gây gổ): đã
    bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/trang-tron
  id: g1
  cau: Phân tích tổng hợp 1985 (37 nghiên cứu) không thấy mối liên hệ đáng tin
    giữa pha mặt trăng và rối loạn hành vi.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/trang-tron
  id: g2
  cau: "Một khoa cấp cứu ở Mỹ, 4 năm, 150.999 lượt khám: ngày trăng tròn không
    khác về lượt khám, xe cấp cứu, nhập viện."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/trang-tron
  id: g3
  cau: "1.444 ca chấn thương nặng trong một năm: không khác biệt ngày trăng tròn,
    kể cả ca do bạo lực."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/tre-song-ngu-cham-noi
  id: nhan
  cau: "Trẻ học hai ngôn ngữ cùng lúc sẽ chậm nói: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/tre-song-ngu-cham-noi
  id: g1
  cau: Trẻ song ngữ từ nhỏ đạt mốc ngôn ngữ cùng tuổi trẻ đơn ngữ; từ đầu tiên
    khoảng 12 tháng.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/tre-song-ngu-cham-noi
  id: g2
  cau: "Hoff 2012 (22–30 tháng): so từng ngôn ngữ, trẻ đơn ngữ hơn về từ vựng và
    ngữ pháp; tổng vốn từ tương đương."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/trung-binh-dien-hinh
  id: nhan
  cau: '"Thu nhập trung bình là thu nhập của người điển hình": sai (đã bị bác bỏ).'
  loai: nhan
- trang: du-lieu/ngo-nhan/trung-binh-dien-hinh
  id: g1
  cau: "Phân phối lệch: trung bình thường bị đuôi kéo đi nhiều hơn trung vị (quy
    tắc thường đúng, không phải luật)."
  loai: dinh-nghia
- trang: du-lieu/ngo-nhan/trung-binh-dien-hinh
  id: g2
  cau: Trung vị là giá trị đứng chính giữa, cho biết người đứng giữa kiếm bao nhiêu.
  loai: dinh-nghia
- trang: du-lieu/ngo-nhan/tu-the-quyen-luc
  id: nhan
  cau: '"Tư thế quyền lực" làm tăng testosterone và dám mạo hiểm hơn: đã bị bác bỏ.'
  loai: nhan
- trang: du-lieu/ngo-nhan/tu-the-quyen-luc
  id: g1
  cau: "Ranehill và cộng sự (2015), mẫu lớn nam và nữ: không thấy tác dụng lên
    hormone và mức chấp nhận rủi ro."
  loai: tai-lap
- trang: du-lieu/ngo-nhan/tu-the-quyen-luc
  id: g2
  cau: Năm 2016, Dana Carney viết bà không còn tin hiệu ứng tư thế quyền lực là
    thật.
  loai: lich-su
- trang: du-lieu/ngo-nhan/tu-the-quyen-luc
  id: g3
  cau: Carney thừa nhận phần đo cảm giác quyền lực tự báo cáo trong bài gốc đã
    được chọn theo kết quả.
  loai: lich-su
