# Lượt 2, lô D7-L1 (Sức khỏe tâm thần), phần bổ sung: 16 nhận định.
# Model: Claude Opus 5.5. Ngày kiểm: 17/11/2026. Độc lập với lượt 1 (không mở kiem-dinh/, trang, báo cáo lượt 2 đầu).
# Ghi chú "gần chẩn đoán" chỉ ghi khi câu đọc lên như chẩn đoán, công cụ tự chấm hay lời khuyên điều trị cá nhân: không câu nào trong phần này.

- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n14
  luot_2: dung
  nguon:
    - "https://www.who.int/news/item/08-03-2024-new-manual-released-to-support-diagnosis-of-mental--behavioural-and-neurodevelopmental-disorders-added-in-icd-11"
    - "https://www.nhs.uk/mental-health/conditions/depression-in-adults/diagnosis/"
  trich: "WHO (ICD-11 CDDR): 'designed to support qualified mental health and other health professionals to identify and diagnose mental, behavioural and neurodevelopmental disorders in clinical settings'; 'aimed at mental health professionals and qualified non-specialist health professionals such as primary care physicians responsible for assigning these diagnoses'. NHS: 'The main way a GP will tell if you have depression is by asking you questions…'"
  ghi_chu: "Chẩn đoán do người có chuyên môn làm qua đánh giá lâm sàng (WHO, NHS). Phần trong ngoặc (link Hỗ trợ, vị trí ngay trước danh sách) là chuyện của site: không kiểm ở lượt 2, review kiểm trên trang. Câu là lời rào, không gần chẩn đoán."

- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n32
  luot_2: dung
  nguon:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6999031/"
    - "https://www.constantinyvesplessen.com/pdfs/Cuijpers%20et%20al.%20-%202023%20-%20Cognitive%20behavior%20therapy%20vs.%20control%20conditions,.pdf"
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC5889788/"
  trich: "Cuijpers 2019 (Epidemiol Psychiatr Sci): 'The unadjusted effect size of psychotherapies compared with control groups was g = 0.70… Only 23% of the studies could be considered as a low risk of bias. When adjusting for several sources of bias, the effect size across all types of therapies dropped to g = 0.31… the effects of psychotherapy for depression are small'. Cuijpers 2023 (World Psychiatry, bảng 2): CBT so với đối chứng g=0.79; chỉ nghiên cứu ít sai lệch 0.60; hiệu chỉnh sai lệch xuất bản 0.47; đáp ứng 42% so với 19%. Cipriani 2018 (Lancet): 'The random-effects summary SMD for all antidepressants was 0·30'; 'the summary effect sizes were mostly modest'; 'Given the modest effect sizes, non-response to antidepressants will occur.'"
  ghi_chu: "Đúng về chiều và mức: thuốc SMD khoảng 0,30 (nhỏ); liệu pháp tâm lý chưa hiệu chỉnh g 0,70–0,79 (vừa, gần lớn với CBT khi tính cả đối chứng danh sách chờ), giảm còn 0,31–0,60 khi chỉ tính nghiên cứu ít sai lệch hay hiệu chỉnh sai lệch xuất bản. Chữ 'từ nhỏ đến vừa' hơi thấp so với con số chưa hiệu chỉnh của CBT (tác giả gọi là 'moderate to large'), nhưng là cách nói thận trọng, không mạnh hơn bằng chứng. 'Khác nhau nhiều giữa các người': đúng nếu hiểu là kết quả (khoảng 42% đáp ứng, phần lớn không); nếu hiểu là hiệu quả riêng của điều trị khác nhau giữa người thì còn tranh cãi, review xem câu trên trang hiểu theo nghĩa nào. Nhãn: nhận định ở mức này hợp với các tổng hợp trên."

- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n15
  luot_2: dung
  nguon:
    - "https://www.who.int/news/item/08-03-2024-new-manual-released-to-support-diagnosis-of-mental--behavioural-and-neurodevelopmental-disorders-added-in-icd-11"
    - "https://www.nhs.uk/mental-health/conditions/generalised-anxiety-disorder/symptoms/"
  trich: "WHO (ICD-11 CDDR): 'designed to support qualified mental health and other health professionals to identify and diagnose…'. NHS (GAD): 'If you see a GP about symptoms of generalised anxiety disorder (GAD), they'll ask you some questions… This will help them to diagnose or rule out an anxiety disorder.'"
  ghi_chu: "Như tram-cam n14. Phần trong ngoặc là chuyện của site, review kiểm."

- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n32
  luot_2: dung
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/29451967/"
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC12004241/"
    - "https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders"
  trich: "Carpenter 2018 (41 thử nghiệm có đối chứng giả dược, N=2.843): 'moderate placebo-controlled effects of CBT on target disorder symptoms (Hedges' g = 0.56)… CBT is a moderately efficacious treatment for anxiety disorders when compared to placebo. More effective treatments are especially needed for PTSD, SAD, and PD.' Cuijpers 2025 (JAMA Psychiatry): g 0,5–1,0 với hoảng sợ, lo âu xã hội, lo âu lan tỏa; 'the effect sizes depended on the type of control condition'. WHO: 'The psychological interventions with the most evidence for treating a range of anxiety disorders are those based on principles of cognitive-behavioural therapy. These include exposure therapy'."
  ghi_chu: "Có nhiều phân tích tổng hợp cùng chiều, nhưng hiệu quả so với giả dược chỉ vừa, phụ thuộc loại đối chứng (danh sách chờ thổi phồng), nhỏ hơn với hoảng sợ, lo âu xã hội: nhãn Khá vững hợp thước đo, không quá mạnh. Trích Carpenter từ tóm tắt (PubMed)."

- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n34
  luot_2: dung
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/11578982/"
  trich: "Hettema, Neale & Kendler 2001 (Am J Psychiatry): 'Only for panic disorder and generalized anxiety disorder could the authors identify more than one large-scale twin study for meta-analysis. These yielded heritabilities of 0.43 for panic disorder and 0.32 for generalized anxiety disorder. For panic disorder, the remaining variance in liability could be attributed primarily to nonshared environment. For generalized anxiety disorder, this was true for men, but for women, a potentially significant role for common familial environment was also seen.'"
  ghi_chu: "Khớp từng ý. Chỉ đọc tóm tắt; tóm tắt có đủ các con số. 'Có thể cũng góp phần' đúng mức thận trọng của bài ('potentially', kết luận: 'the role of family environment in generalized anxiety disorder is uncertain')."

- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n12
  luot_2: dung
  nguon:
    - "https://www.who.int/news/item/08-03-2024-new-manual-released-to-support-diagnosis-of-mental--behavioural-and-neurodevelopmental-disorders-added-in-icd-11"
    - "https://www.samhsa.gov/find-support/how-to-cope/signs-of-needing-help"
  trich: "WHO (ICD-11 CDDR): chẩn đoán do 'qualified mental health and other health professionals'. SAMHSA: 'here are some common signs that you might need help with mental health, drugs, or alcohol' (danh sách dấu hiệu để quyết định tìm giúp đỡ, không phải tiêu chí chẩn đoán)."
  ghi_chu: "Lời rào đúng. Không gần chẩn đoán."

- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n17
  luot_2: dung
  nguon:
    - "https://luatvietnam.vn/y-te/luat-15-2023-qh15-242305-d1.html"
    - "https://trungtamytekhanhson.khanhhoa.gov.vn/wp-content/uploads/2024/01/Th%C3%B4ng-t%C6%B0-32-2023-TT-BYT.pdf"
    - "https://luatvietnam.vn/y-te/thong-tu-26-2025-tt-byt-quy-dinh-ke-don-thuoc-hoa-duoc-sinh-pham-tai-co-so-kham-chua-benh-404246-d1.html"
  trich: "Luật 15/2023/QH15, Điều 26.1: 'Chức danh chuyên môn phải có giấy phép hành nghề bao gồm: a) Bác sỹ; … h) Tâm lý lâm sàng; …'; Điều 120.1: 'Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2024'. TT 32/2023/TT-BYT, Điều 11 khoản 11: 'Phạm vi hành nghề của người hành nghề có chức danh chuyên môn là tâm lý lâm sàng quy định tại Phụ lục số XVI… bao gồm đánh giá các rối loạn tâm thần, chỉ định, xây dựng và triển khai các can thiệp tâm lý tại các cơ sở khám bệnh, chữa bệnh.' TT 26/2025/TT-BYT, Điều 2: 'Người hành nghề khám bệnh, chữa bệnh có chứng chỉ hành nghề hoặc giấy phép hành nghề khám bệnh, chữa bệnh với chức danh là bác sỹ, y sỹ có thẩm quyền kê đơn thuốc.'"
  ghi_chu: "Khớp cả ba văn bản. TT 26/2025 quy định kê đơn thuốc hóa dược, sinh phẩm trong điều trị ngoại trú, hiệu lực 01/7/2025. Luật và TT 32 đọc ở luatvietnam.vn (cơ sở dữ liệu pháp luật) và bản PDF trên cổng của Trung tâm Y tế Khánh Sơn (Khánh Hòa); bản PDF này không kèm Phụ lục XVI. Câu có tính thời sự (văn bản có thể bị sửa: tìm thấy tin Bộ Y tế dự thảo sửa TT 32): nên viết kèm mốc 'tính đến 11/2026' và đặt het_han. Lộ trình kiểm tra năng lực của Hội đồng Y khoa Quốc gia với tâm lý lâm sàng từ 01/01/2029 (Điều 120.3c) không mâu thuẫn với câu."

- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n38
  luot_2: dung
  nguon:
    - "https://www.nhs.uk/mental-health/conditions/depression-in-adults/diagnosis/"
    - "https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/low-mood-sadness-depression/"
    - "https://www.samhsa.gov/find-support/how-to-cope/signs-of-needing-help"
    - "https://www.who.int/news-room/fact-sheets/detail/depression"
  trich: "NHS: 'If you experience symptoms of depression for most of the day, every day for more than 2 weeks, you should seek help from a GP. It's particularly important to speak to a GP if you: … find your mood affects your work, other interests, and relationships…'; 'See a GP if: you've had a low mood for more than 2 weeks'. SAMHSA: 'It may be time to ask for help if you've had two or more weeks with changes to your thoughts, moods, or body that make it hard to manage work, school, home, or relationships'; dấu hiệu gồm 'Changes in how you sleep', 'Changes in your eating', 'Needing to use drugs or alcohol more and more often'. WHO: 'avoid or cut down on alcohol and don't use illicit drugs, which can make depression worse'."
  ghi_chu: "Ba mốc khớp nguồn chính thức (NHS, SAMHSA, WHO). Ý 'phải dùng rượu, chất kích thích để chịu đựng' là dấu hiệu nên tìm giúp đỡ: SAMHSA nêu việc dùng rượu, ma túy ngày càng nhiều và hậu quả của nó; NHS và WHO khuyên không dùng rượu, chất để giải tỏa vì làm tình trạng tệ hơn. Câu là gợi ý tìm người nói chuyện, không phải tiêu chí chẩn đoán; không gần chẩn đoán miễn là trang giữ lời rào đi kèm (n47)."

- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n47
  luot_2: dung
  nguon:
    - "https://www.who.int/news/item/08-03-2024-new-manual-released-to-support-diagnosis-of-mental--behavioural-and-neurodevelopmental-disorders-added-in-icd-11"
    - "https://www.nhs.uk/mental-health/conditions/depression-in-adults/diagnosis/"
  trich: "WHO (ICD-11 CDDR): hướng dẫn chẩn đoán dành cho 'qualified mental health and other health professionals… responsible for assigning these diagnoses in clinical settings'. NHS: GP chẩn đoán qua hỏi về sức khỏe, cảm xúc, ảnh hưởng tới đời sống, tiền sử."
  ghi_chu: "Như n12."

- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n5
  luot_2: dung
  nguon:
    - "https://www.who.int/news-room/fact-sheets/detail/depression"
    - "http://web.archive.org/web/20250630215110/https://onlinelibrary.wiley.com/doi/full/10.1002/wps.20238"
  trich: "WHO (trầm cảm, mục Self-care): 'Self-care can play an important role in managing symptoms of depression… stay connected to friends and family… talk to someone you trust about your feelings… seek help from a healthcare provider.' Wampold 2015 (World Psychiatry): 'Therapist expressed empathy is a primary common factor'; 59 nghiên cứu, 'a relatively large effect (d=0.63)'."
  ghi_chu: "Khớp. WHO đặt 'seek help from a healthcare provider' ngay trong danh sách tự chăm sóc, hợp với ý trò chuyện với bạn không thay được trị liệu khi cần. Wampold đọc qua bản lưu Wayback (30/6/2025) của trang Wiley; PMC4592639 chặn bot. Wampold cũng nói tương quan empathy–kết quả có thể một phần do đặc điểm người bệnh, nhưng câu trên trang không nói con số nên không cần thêm."

- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n22
  luot_2: dung
  nguon:
    - "https://doi.org/10.1002/wps.21069"
    - "https://www.constantinyvesplessen.com/pdfs/Cuijpers%20et%20al.%20-%202023%20-%20Cognitive%20behavior%20therapy%20vs.%20control%20conditions,.pdf"
  trich: "Cuijpers và cs. 2023 (World Psychiatry 22:105–115): 'The response rate was 0.42 (95% CI: 0.39-0.45) in CBT and 0.19 (95% CI: 0.18-0.21) in the control conditions, which resulted in a RR of 2.13… and a NNT of 4.7 (95% CI: 4.0-5.5) in favor of CBT'; phương pháp: 'response (i.e., a 50% reduction of depressive symptoms compared to baseline). If the response rate was not reported, we estimated it using a method based on the baseline means, the post-test means, the post-test standard deviations and the number of subjects'; bảng 3: 'Reported 10… Estimated 228'."
  ghi_chu: "Khớp từng số. 228/238 nhóm CBT có tỉ lệ ước tính, nên 'phần lớn ước tính từ điểm trung bình' đúng (ước tính từ trung bình đầu, cuối, độ lệch chuẩn và cỡ mẫu). Đọc toàn văn bản PDF của nhà xuất bản (có dòng tải từ Wiley) do một đồng tác giả (Plessen) đăng; Wiley và PMC chặn bot. Bối cảnh: NNT 4,7 cao lên 8,0 khi hiệu chỉnh sai lệch xuất bản và 6,3 khi chỉ tính nghiên cứu ít sai lệch."

- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n46
  luot_2: dung
  nguon:
    - "https://www.briancollinson.ca/wp-content/uploads/2010/06/Shedler-Efficacy-of-Psychodynamic-Psychotherapy-T-LAP-10-9-20091.pdf"
    - "https://pubmed.ncbi.nlm.nih.gov/17054212/"
  trich: "Shedler (bản in trước, American Psychologist 2010): 'included 23 randomized controlled trials of 1,431 patients (Abbass, Hancock, et al., 2006)… short term (<40 hours) psychodynamic psychotherapy with controls… yielding an overall effect size of .97 for general symptom improvement. The effect size increased to 1.51 when the patients were assessed at long term follow-up (>9 months post-treatment).' Abbass 2006 (Cochrane, tóm tắt): 'only a small number of studies contributed data for each category of disorder, there was significant heterogeneity between studies, and results were not always maintained in sensitivity analyses'; 'these findings should be interpreted with caution'."
  ghi_chu: "Khớp. Bản Shedler đọc được là bản tác giả 'in press, revised 10-9-2009' ('may not exactly replicate the final version'); bản APA không tải được. Shedler ghi chú (chú thích 7) rằng các con số lấy từ mô hình hiệu ứng ngẫu nhiên đã bỏ một nghiên cứu ngoại lai. Abbass 2006 đã có bản cập nhật 2014 (CD004687.pub4); câu chỉ nói điều Shedler dẫn nên không sai."

- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n55
  luot_2: dung
  nguon:
    - "https://www.nhs.uk/mental-health/conditions/depression-in-adults/diagnosis/"
    - "https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/stress/"
    - "https://www.samhsa.gov/find-support/how-to-cope/signs-of-needing-help"
    - "https://www.who.int/news-room/fact-sheets/detail/depression"
  trich: "NHS: 'It's particularly important to speak to a GP if you: … have thoughts of suicide or self-harm'; (căng thẳng) 'See a GP if: you're struggling to cope with stress; things you're trying yourself are not helping'. SAMHSA: 'two or more weeks with changes… that make it hard to manage work, school, home, or relationships'; dấu hiệu về giấc ngủ, dùng rượu, ma túy. WHO: 'If you think you are in immediate danger of harming yourself, contact any available emergency services or a crisis line.'"
  ghi_chu: "Khớp. 'Không cần đủ nặng': NHS khuyên gặp bác sĩ chỉ cần thấy khó đương đầu hay tự làm không đỡ, không đòi mức nặng. Câu có lời rào và link Hỗ trợ (phần link là chuyện của site). Không gần chẩn đoán."

- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n59
  luot_2: qua-manh
  nguon:
    - "https://doi.org/10.1038/s41598-021-90320-5"
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC8166974/"
  trich: "Imamura và cs. 2021 (Sci Rep 11:11353): 'Participants were recruited from nurses in a large general hospital in Hanoi… Program A (a free-choice, multimodule stress management), Program B (a fixed-order, internet cognitive behavioral therapy, iCBT), or a control group (treatment as usual)… 951 participants were randomly allocated… Program B showed a statistically significant effect on improving depressive symptoms at 3-month (p = 0.048), but not at 7-month (p = 0.92); Cohen's d was − 0.18 (95% CI − 0.34 to − 0.02) and 0.03… Program A failed to show a significant intervention effect on any of the outcomes at 3- or 7-month follow-up (p > 0.05).'"
  cau_dung: "Imamura và cộng sự (2021): 951 điều dưỡng ở một bệnh viện đa khoa lớn tại Hà Nội, so hai chương trình qua điện thoại thông minh với nhóm đối chứng; chỉ chương trình CBT theo thứ tự cố định giảm triệu chứng trầm cảm, ở mức nhỏ sau 3 tháng, không còn khác biệt sau 7 tháng; chương trình còn lại không cho thấy hiệu quả có ý nghĩa thống kê."
  ghi_chu: "Mọi con số và chiều kết quả khớp (toàn văn qua Europe PMC). Chỉ vế cuối quá mạnh: bài viết 'failed to show a significant intervention effect', tức không thấy khác biệt có ý nghĩa thống kê, không phải đã chứng minh 'không có hiệu quả'. Thêm 'một bệnh viện' cho rõ mẫu (một bệnh viện, không phải điều dưỡng cả Hà Nội) là tùy chọn."

- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n64
  luot_2: khong-chac
  nguon:
    - "http://web.archive.org/web/20250630215110/https://onlinelibrary.wiley.com/doi/full/10.1002/wps.20238"
    - "https://pubmed.ncbi.nlm.nih.gov/21604860/"
  trich: "Wampold 2015: 'A recent meta-analysis demonstrated that adapting evidence-based treatments by using an explanation congruent with the cultural group's beliefs… was more effective than unadapted evidence-based treatments, although the effect was modest (d=0.32, n=21)' (dẫn Benish, Quintana & Wampold 2011). Benish 2011 (tóm tắt): 'culturally adapted psychotherapy is more effective than unadapted, bona fide psychotherapy by d = 0.32'; bối cảnh: 'conventional psychotherapy is a practice most suitable for dominant cultural groups within North America and Western Europe but may be culturally incongruent with… ethnic and racial minority groups'."
  ghi_chu: "Vế đầu đúng: Wampold dẫn một phân tích tổng hợp (Benish 2011, 21 nghiên cứu), d = 0,32, Wampold gọi là 'modest'. Vế cuối 'các nghiên cứu ấy chủ yếu làm với người thuộc nhóm thiểu số ở Bắc Mỹ': tóm tắt của Benish chỉ nói về khách hàng thuộc nhóm thiểu số chủng tộc, sắc tộc, đặt trong bối cảnh Bắc Mỹ và Tây Âu; không nói các nghiên cứu làm ở đâu. Toàn văn Benish đóng (OpenAlex: closed), Wampold không nói về nơi làm. Nếu không mở được toàn văn Benish thì viết: 'các nghiên cứu ấy làm với người thuộc nhóm thiểu số chủng tộc, sắc tộc (ở các nước phương Tây)', hay bỏ 'ở Bắc Mỹ'."

- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n69
  luot_2: dung
  nguon:
    - "https://www.nice.org.uk/guidance/ng222/resources/depression-in-adults-treatment-and-management-pdf-66143832307909"
    - "https://www.constantinyvesplessen.com/pdfs/Cuijpers%20et%20al.%20-%202023%20-%20Cognitive%20behavior%20therapy%20vs.%20control%20conditions,.pdf"
  trich: "NICE NG222, 1.8.5: 'a course of psychological therapy (group CBT or mindfulness-based cognitive therapy [MBCT])' cho người có nguy cơ tái phát cao; 1.8.6: 'offer a course of therapy with an explicit focus on the development of relapse prevention skills and what is needed to stay well'. Cuijpers 2023: tỉ lệ đáp ứng CBT 42%; 'The effects of CBT did not differ significantly from those of pharmacotherapies at the short term, but were significantly larger at 6-12 month follow-up (g=0.34; 95% CI: 0.09-0.58), although the number of trials was small, and the difference was not significant in all sensitivity analyses' (bảng 4: 12 thử nghiệm)."
  ghi_chu: "Khớp. NICE dùng chữ 'consider' (1.8.5) cho người đã hết triệu chứng mà nguy cơ tái phát cao; 'khuyên' chấp nhận được. Có thể thêm 'và khác biệt không giữ ở mọi phân tích độ nhạy' để sát Cuijpers hơn; câu hiện tại đã có '(từ ít thử nghiệm)' nên không quá mạnh. Câu không khuyên dùng hay ngừng thuốc."
