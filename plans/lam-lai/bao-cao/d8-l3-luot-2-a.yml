# Lượt 2, D8-L3 phần a. Model: Claude Opus 5.5. Ngày 17/11/2026.
- trang: bat-dau/ban-nghi-gi
  id: n1
  luot_2: dung
  nguon: ["https://doi.org/10.3389/fpsyg.2012.00429", "https://doi.org/10.3389/fpsyg.2017.01314", "https://doi.org/10.7717/peerj.13811"]
  trich: "Results showed that on average, teachers believed 49% of the neuromyths (Dekker 2012). The general public endorsed the greatest number of neuromyths (M = 68%), with significantly fewer endorsed by educators (M = 56%) (Macdonald 2017). These misconceptions are not only believed by people outside of Psychology, but also prevail among professionals within this discipline (Bensley/PeerJ 2022, phần mở đầu)."
  ghi_chu: "Giáo viên: Dekker 2012, Macdonald 2017. Sinh viên tâm lý học: nghiên cứu ở sinh viên tâm lý Tây Ban Nha (PeerJ 2022) thấy vẫn còn tin một số ngộ nhận, nhiều câu ở mức 'không biết'."
- trang: ngo-nhan/index
  id: n1
  luot_2: dung
  nguon: ["https://doi.org/10.3389/fpsyg.2012.00429", "https://doi.org/10.3389/fpsyg.2017.01314"]
  trich: "Teachers believed 49% of the neuromyths ... Seven of the 15 myth statements were believed by more than 50% of the teachers."
  ghi_chu: "Câu chung; các khảo sát giáo viên và công chúng xác nhận ngộ nhận phổ biến, kể cả ở người dạy học. Không kiểm từng khẳng định của trang."
- trang: du-lieu/ngo-nhan/bay-con-so
  id: nhan
  luot_2: dung
  nguon: ["https://doi.org/10.1017/S0140525X01003922", "https://pmc.ncbi.nlm.nih.gov/articles/PMC2864034/"]
  trich: "Miller (1956) ... that number was meant more as a rough estimate and a rhetorical device than as a real capacity limit ... A single, central capacity limit averaging about four chunks is implicated (Cowan 2001). Young adults can recall only 3 or 4 longer verbal chunks (Cowan 2010)."
  ghi_chu: "Khẳng định 'mọi người đều chứa 7 món' trái với nhiều kiểm tra: dung lượng thuần khoảng 3–5 cụm, đổi theo loại tài liệu và người. Lưu ý: tầm nhớ số đơn giản (digit span) ở người lớn vẫn thường quanh 7, nên câu trên trang cần nói rõ ngộ nhận là con số cố định cho mọi người và mọi loại thông tin."
- trang: du-lieu/ngo-nhan/bay-con-so
  id: g1
  luot_2: dung
  nguon: ["https://doi.org/10.1017/S0140525X01003922", "https://pmc.ncbi.nlm.nih.gov/articles/PMC2864034/"]
  trich: "that number was meant more as a rough estimate ... we can measure storage-specific capacity by preventing or controlling processing strategies. That is how one can observe a capacity limit of 3 to 5 separate items ... with rehearsal and grouping curtailed."
  ghi_chu: "Cowan: con số 7 đến từ nhiệm vụ không chặn nhẩm lại và gom nhóm."
- trang: du-lieu/ngo-nhan/bay-con-so
  id: g2
  luot_2: dung
  nguon: ["https://doi.org/10.1017/S0140525X01003922"]
  trich: "when other steps are taken specifically to block the recording of stimulus items into larger chunks ... A single, central capacity limit averaging about four chunks is implicated."
  ghi_chu: "Tóm tắt Cowan 2001."
- trang: du-lieu/ngo-nhan/bay-con-so
  id: g3
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC2864034/"]
  trich: "It has been difficult to determine the capacity limit of working memory because multiple mechanisms retain information ... working memory ability varies widely depending on what processes can be applied to the task."
  ghi_chu: "Cowan 2010 cũng nêu khác biệt cá nhân và theo tuổi."
- trang: du-lieu/ngo-nhan/dang-bao-la-dung
  id: nhan
  luot_2: dung
  nguon: ["https://doi.org/10.1126/science.aac4716", "https://media.nature.com/original/magazine-assets/d41586-023-03974-8/d41586-023-03974-8.pdf"]
  trich: "Ninety-seven percent of original studies had statistically significant results. Thirty-six percent of replications had statistically significant results."
  ghi_chu: "Tái lập lớn (OSC 2015) và số bài bị rút cho thấy 'đã đăng là đúng' không đứng vững."
- trang: du-lieu/ngo-nhan/dang-bao-la-dung
  id: g1
  luot_2: dung
  nguon: ["https://media.nature.com/original/magazine-assets/d41586-023-03974-8/d41586-023-03974-8.pdf"]
  trich: "The number of retractions issued for research articles in 2023 has passed 10,000 — smashing annual records ... So far this year, Hindawi journals have pulled more than 8,000 articles, citing factors such as ... 'systematic manipulation of the publication and peer-review process'."
  ghi_chu: "Nature 624:479 (2023), số tính đến 8/12/2023."
- trang: du-lieu/ngo-nhan/eq-hon-iq
  id: nhan
  luot_2: dung
  nguon: ["https://doi.org/10.1002/job.714", "https://doi.org/10.1037/a0037681", "https://doi.org/10.1037/a0017286"]
  trich: "Streams 2 and 3 have the largest incremental validity beyond cognitive ability ... Dominance analysis demonstrated that all three streams of EI exhibited substantial relative importance (O'Boyle 2011) / the mixed EI-job performance relationship becomes nil (β = -.02) after controlling for the set of covariates (Joseph 2015)."
  ghi_chu: "Hai phân tích tổng hợp mâu thuẫn về phần dự báo thêm của EQ nên 'đang tranh cãi' hợp thước đo. Riêng vế 'nhiều hơn IQ' thì không phân tích tổng hợp nào ủng hộ (EQ năng lực tương quan thấp hơn năng lực nhận thức); review có thể cân nhắc nói rõ điều này trong giải thích."
- trang: du-lieu/ngo-nhan/eq-hon-iq
  id: g1
  luot_2: dung
  nguon: ["https://content.time.com/time/covers/0,16641,19951002,00.html"]
  trich: "Emotional Intelligence | Oct. 2, 1995 ... EMOTIONAL INTELLIGENCE: THE EQ FACTOR (Cover Story) NEW BRAIN RESEARCH SUGGESTS THAT EMOTIONS, NOT IQ, MAY BE THE TRUE MEASURE OF HUMAN INTELLIGENCE"
  ghi_chu: "Bìa Time 2/10/1995 có thông điệp này. Cũng là phụ đề sách của Goleman 1995 ('Why it can matter more than IQ'); nếu trang ngụ ý Time là nguồn gốc thì nên nói kèm Goleman."
- trang: du-lieu/ngo-nhan/eq-hon-iq
  id: g2
  luot_2: dung
  nguon: ["https://api.crossref.org/works/10.1002/job.714"]
  trich: "The three streams have corrected correlations ranging from 0.24 to 0.30 with job performance ... Streams 2 and 3 have the largest incremental validity beyond cognitive ability and the Five Factor Model (FFM)."
- trang: du-lieu/ngo-nhan/eq-hon-iq
  id: g3
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/25243996/"]
  trich: "the mixed EI-job performance relationship becomes nil (β = -.02) after controlling for the set of covariates listed above."
  ghi_chu: "Các biến kiểm soát: EQ năng lực, tự tin năng lực, tự đánh giá hiệu suất, Big Five, năng lực nhận thức chung."
- trang: du-lieu/ngo-nhan/eq-hon-iq
  id: g4
  luot_2: khong-chac
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/20085406/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC9945536/"]
  trich: "With respect to the performance of job-related tasks, Joseph and Newman (2010) reported a meta-analytic correlation of 0.16 (bài 2023 kể lại)."
  ghi_chu: "Không mở được toàn văn Joseph & Newman 2010 (tóm tắt không có hệ số). Nguồn kể lại ghi 0,16; nguồn khác ghi .18. Chưa xác nhận được ρ ≈ .17 và con số của năng lực nhận thức trong cùng bài."
- trang: du-lieu/ngo-nhan/gach-chan-hieu-qua
  id: nhan
  luot_2: qua-manh
  nguon: ["https://doi.org/10.1177/1529100612453266", "https://investigadores.anid.cl//en/public_search/work?id=701573", "https://doi.org/10.1007/s10648-021-09654-1"]
  trich: "Ponce, Mayer & Méndez 2022 (36 bài, 85 cỡ hiệu ứng): learner-generated highlighting improved memory but not comprehension (g ≈ 0,36 và 0,20); có lợi cho sinh viên đại học, không cho học sinh phổ thông."
  cau_dung: "Gạch chân, tô đậm là cách ôn bài hiệu quả: đang tranh cãi. Dunlosky 2013 xếp gạch chân vào nhóm hiệu quả thấp, nhưng phân tích tổng hợp 2022 thấy tự gạch chân giúp nhớ ở mức nhỏ (không giúp hiểu); kém xa tự kiểm tra và ôn ngắt quãng."
  ghi_chu: "Không có chuỗi kiểm tra đủ mạnh liên tục thất bại; hiệu ứng nhỏ hơn nhiều so với niềm tin phổ biến, hợp nhãn 'đang tranh cãi' (hoặc nói rõ 'kém hiệu quả so với các cách khác')."
- trang: du-lieu/ngo-nhan/gach-chan-hieu-qua
  id: g1
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/26173288/"]
  trich: "The techniques include elaborative interrogation, self-explanation, summarization, highlighting (or underlining), the keyword mnemonic, imagery use for text learning, rereading, practice testing, distributed practice, and interleaved practice ... Practice testing and distributed practice [high utility]."
  ghi_chu: "Tóm tắt bị cắt đoạn cuối; xếp hạng 'low utility' cho gạch chân là kết luận đã biết của bài, đọc được ở phần đầu tóm tắt đầy đủ."
- trang: du-lieu/ngo-nhan/giau-hanh-phuc-thang
  id: nhan
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/33468644/", "https://pubmed.ncbi.nlm.nih.gov/36857342/"]
  trich: "both experienced and evaluative well-being increased linearly with log(income)."
  ghi_chu: "Quan hệ tuyến tính theo log thu nhập (mỗi đồng thêm có tác dụng giảm dần), không phải đường thẳng theo số tiền; ngộ nhận 'đường thẳng' sai. Lưu ý vế 'càng giàu càng hạnh phúc' vẫn đúng theo log."
- trang: du-lieu/ngo-nhan/giau-hanh-phuc-thang
  id: g1
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/20823223/"]
  trich: "When plotted against log income, life evaluation rises steadily. Emotional well-being also rises with log income, but there is no further progress beyond an annual income of ~$75,000."
- trang: du-lieu/ngo-nhan/giau-hanh-phuc-thang
  id: g2
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/33468644/"]
  trich: "both experienced and evaluative well-being increased linearly with log(income), with an equally steep slope for higher earners as for lower earners. There was no evidence for an experienced well-being plateau above $75,000/y."
- trang: du-lieu/ngo-nhan/giau-hanh-phuc-thang
  id: g3
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/36857342/", "https://doi.org/10.1073/pnas.2313712121"]
  trich: "We engaged in an adversarial collaboration ... A reanalysis of Killingsworth's experienced sampling data confirmed the flattening pattern only for the least happy people. / Thư PNAS 2024: 'Inappropriate causal assumptions underlie Killingsworth, Kahneman, and Mellers' conclusions.'"
  ghi_chu: "Dữ liệu là người Mỹ đi làm (Killingsworth 2021)."
- trang: du-lieu/ngo-nhan/hoc-khi-ngu
  id: nhan
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4231834/", "https://pubmed.ncbi.nlm.nih.gov/32027149/"]
  trich: "previous reports of sleep-encoding lack convincing proof that participants were sleeping continuously during verbal stimulation ... Studies that properly monitored the absence of wakefulness did not find evidence of sleep-encoding."
  ghi_chu: "Có bằng chứng học ngầm rất đơn giản trong giấc ngủ (Arzi 2012, ghép mùi và âm) và nhắc lại ký ức đã học (TMR), nhưng không phải học bài mới hiệu quả bằng băng nghe; nhãn hợp với khẳng định như viết."
- trang: du-lieu/ngo-nhan/hoc-khi-ngu
  id: g1
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4231834/"]
  trich: "previous reports of sleep-encoding lack convincing proof that participants were sleeping continuously during verbal stimulation (for reviews see Simon and Emmons, 1955 ...). It is possible that encoding was mediated by brief phases of wakefulness."
  ghi_chu: "Không mở được bài gốc Simon & Emmons 1955 (Psychological Bulletin, chỉ có trang PsycNet không tóm tắt); xác nhận qua bài có bình duyệt kể lại. Review nên xem lại chữ 'nửa tỉnh nửa mê'."
- trang: du-lieu/ngo-nhan/hoc-khi-ngu
  id: g2
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/32027149/"]
  trich: "compiled from 91 experiments ... slow-wave sleep: Hedges' g = 0.27, 95% CI [0.20, 0.35]. In contrast, TMR was not effective during REM sleep nor during wakefulness."
  ghi_chu: "Bài cũng thấy hiệu quả ở NREM giai đoạn 2 (g = 0,32); câu không nhắc nhưng không sai."
- trang: du-lieu/ngo-nhan/iq-co-dinh
  id: nhan
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/29911926/", "https://pubmed.ncbi.nlm.nih.gov/24979188/"]
  trich: "consistent evidence for beneficial effects of education on cognitive abilities of approximately 1 to 5 IQ points for an additional year of education."
- trang: du-lieu/ngo-nhan/iq-co-dinh
  id: g1
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/38330347/", "https://pubmed.ncbi.nlm.nih.gov/24979188/"]
  trich: "low stability in preschool children, rapid increases in stability in childhood, and consistently high stability from late adolescence to late adulthood (Breit 2024). / the meta-analytic mean was 2.31 ... standard score points per decade (Trahan 2014)."
- trang: du-lieu/ngo-nhan/iq-co-dinh
  id: g2
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/29911926/"]
  trich: "Across 142 effect sizes from 42 data sets involving over 600,000 participants, we found consistent evidence for beneficial effects of education on cognitive abilities of approximately 1 to 5 IQ points for an additional year of education."
- trang: du-lieu/ngo-nhan/khen-thong-minh
  id: nhan
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/9686450/", "https://pubmed.ncbi.nlm.nih.gov/31464486/"]
  trich: "six studies demonstrated that praise for intelligence had more negative consequences ... / Study 1 closely replicated Mueller and Dweck (1998) ... not with any of the 8 motivation and attribution measures."
  ghi_chu: "Không có bằng chứng tốt cho vế 'giúp tự tin và học giỏi hơn'; điều còn tranh cãi là khen thông minh có hại hay không. Nhãn 'đang tranh cãi' chấp nhận được; review có thể cân nhắc viết rõ phần tranh cãi."
- trang: du-lieu/ngo-nhan/khen-thong-minh
  id: g1
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/9686450/"]
  trich: "Fifth graders praised for intelligence ... After failure, they also displayed less task persistence, less task enjoyment, more low-ability attributions, and worse task performance than children praised for effort."
- trang: du-lieu/ngo-nhan/khen-thong-minh
  id: g2
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/31464486/"]
  trich: "9-13-year-old Chinese children (n = 624). Study 1 closely replicated Mueller and Dweck (1998). Growth mindset manipulation was associated with performance on a moderate difficulty postfailure test (p = .049), but not with any of the 8 motivation and attribution measures."
  ghi_chu: "Tuổi 9–13 là của cả loạt nghiên cứu."
- trang: du-lieu/ngo-nhan/mau-sac
  id: nhan
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/23808916/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC10480976/"]
  trich: "The literature remains at a nascent stage of development ... considerable work on boundary conditions, moderators, and real-world generalizability is needed."
- trang: du-lieu/ngo-nhan/mau-sac
  id: g1
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/23808916/"]
  trich: "color can carry important meaning and can have an important impact on people's affect, cognition, and behavior. The literature remains at a nascent stage of development, however ... before strong conceptual statements and recommendations for application are warranted."
- trang: du-lieu/ngo-nhan/mau-sac
  id: g2
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC10480976/"]
  trich: "preregistered studies ... have overall found effects too small to be of practical significance (d = 0.10 for men; d = −0.10 for women)."
  ghi_chu: "Lehmann, Elliot & Calin-Jageman 2018. Toàn bộ (gồm nghiên cứu không đăng ký) có hiệu ứng nhỏ d = 0,26 và 0,13."
- trang: du-lieu/ngo-nhan/mau-sac
  id: g3
  luot_2: khong-chac
  ghi_chu: "Câu đã bỏ, quá mơ hồ ('lập trình') để kiểm; không nguồn nào nói thẳng. Elliot & Maier 2014 chỉ nói màu có thể ảnh hưởng và bằng chứng còn sơ khai."
- trang: du-lieu/ngo-nhan/mozart
  id: nhan
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC9988829/", "https://doi.org/10.1207/s15326985ep4104_1"]
  trich: "This phenomenon was received with considerable skepticism in the scientific community and ultimately demonstrated to be a consequence of low study power and bias-related measurement artifacts."
- trang: du-lieu/ngo-nhan/mozart
  id: g1
  luot_2: dung
  nguon: ["https://www.uwosh.edu/psychology/wp-content/uploads/sites/203/2020/11/Rauscher-Hinton_2006.pdf"]
  trich: "The initial listening study (Rauscher, Shaw, & Ky, 1993) ... The main finding of this study was that one specific composition of Mozart enhanced adult spatial test performance for up to about 15 min."
  ghi_chu: "Bài phản hồi của chính Rauscher (Educational Psychologist 2006). Không mở được thư Nature 1993; chi tiết 'sinh viên đại học' khớp với 'adult'."
- trang: du-lieu/ngo-nhan/mozart
  id: g2
  luot_2: khong-chac
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC9988829/"]
  ghi_chu: "Không mở được tóm tắt chính thức của Pietschnig 2010 (ScienceDirect chặn, Crossref và OpenAlex không có tóm tắt) và thư Chabris 1999 (Nature). Bài 2023 (PMC) chỉ nói hiệu ứng là do mẫu nhỏ và thiên lệch. Lưu ý: theo bản chép tóm tắt Pietschnig 2010, hiệu ứng so với im lặng là d = 0,37 ('small'), giữa hai điều kiện nhạc d = 0,15, có thiên lệch xuất bản; nếu đúng thì 'rất nhỏ hoặc gần như không có' chỉ đúng cho hiệu ứng riêng của Mozart."
- trang: du-lieu/ngo-nhan/mozart
  id: g3
  luot_2: dung
  nguon: ["https://doi.org/10.1207/s15326985ep4104_1", "https://doi.org/10.1207/s15326985ep4104_5"]
  trich: "Waterhouse 2006 (Educational Psychologist): MI, Mozart effect và EI theory thiếu bằng chứng thực nghiệm đủ và không nên đem áp dụng vào giáo dục."
  ghi_chu: "Đọc tóm tắt qua trang nhà xuất bản và bài đáp của tác giả cùng số."
- trang: du-lieu/ngo-nhan/nao-10
  id: nhan
  luot_2: dung
  nguon: ["https://www.scientificamerican.com/article/do-we-really-use-only-10/", "https://doi.org/10.3389/fpsyg.2012.00429"]
  trich: "Despite this detailed reconnaissance, no quiet areas awaiting new assignments have emerged."
- trang: du-lieu/ngo-nhan/nao-10
  id: g1
  luot_2: dung
  nguon: ["https://www.scientificamerican.com/article/do-we-really-use-only-10/"]
  trich: "Stimulation during neurosurgery has failed so far to uncover any dormant areas where no percept, emotion or movement is elicited ... there does not seem to be any area of the brain that can be destroyed by strokes, head trauma, or other manner [without loss of function]."
  ghi_chu: "Lời của Beyerstein (nhà tâm lý học thần kinh) trên Scientific American, bậc 3 thuật lại chương sách của ông (Beyerstein 1999). Chưa tìm được nguồn bậc 1–2 mở; review cân nhắc."
- trang: du-lieu/ngo-nhan/nao-10
  id: g2
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC3475349/"]
  trich: "Table 1 ... We only use 10% of our brain. Incorrect UK 48, NL 46."
  ghi_chu: "Cột 'Incorrect' là tỉ lệ đồng ý với ngộ nhận; mẫu 242 giáo viên quan tâm đến thần kinh học."
- trang: du-lieu/ngo-nhan/nao-10
  id: g3
  luot_2: dung
  nguon: ["https://doi.org/10.1073/pnas.1201895109"]
  trich: "the apparently remarkable use in humans of 20% of the whole body energy budget by a brain that represents only 2% of body mass (Herculano-Houzel 2012, tóm tắt PubMed)."
- trang: du-lieu/ngo-nhan/nao-nam-nu
  id: nhan
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/26621705/", "https://pubmed.ncbi.nlm.nih.gov/33621637/"]
  trich: "human brains do not belong to one of two distinct categories: male brain/female brain (Joel 2015). / The human brain is not 'sexually dimorphic' (Eliot 2021)."
