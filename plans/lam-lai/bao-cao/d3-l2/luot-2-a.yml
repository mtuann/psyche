  ghi_chu: "Ý \"định đoạt\" (tiền định) không có bằng chứng: tương quan nửa bản gốc, giảm tiếp khi kiểm soát, và hai phân tích đăng ký trước ở tuổi trưởng thành không thấy dự đoán. Nhãn Đã bị bác bỏ đúng cho ý \"định đoạt\", không cho mọi tương quan."
