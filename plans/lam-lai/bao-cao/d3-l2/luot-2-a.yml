  id: n44
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0033-295x.106.1.3"]
  trich: "A cool, cognitive \"know\" system and a hot, emotional \"go\" system ... The cool system ... is the seat of self-regulation and self-control. The hot system ... undermines efforts at self-control"
