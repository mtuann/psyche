  id: n68
  luot_2: dung
  nguon: ["https://doi.org/10.1111/cdev.14129"]
  trich: "Participants (n = 702; 83% White, 46% male) completed the Marshmallow Test at 54 months and survey measures at age 26 ... Using a preregistered analysis, Marshmallow Test performance was not strongly predictive of adult achievement, health, or behavior"
  ghi_chu: "Có tương quan đơn biến vừa phải với học vấn (r = .17) và BMI (r = -.17); gần như mọi hệ số hiệu chỉnh không có ý nghĩa, đúng với \"không dự đoán ổn định\"."
