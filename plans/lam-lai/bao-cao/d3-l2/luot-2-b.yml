- trang: thi-nghiem/little-albert
  id: n1
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "Just as his hand touched the animal the bar was struck immediately behind his head.; Unfortunately Albert was taken from the hospital the day the above tests were made."
- trang: thi-nghiem/little-albert
  id: n2
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/33090820/"]
  trich: "Our findings concur with the view that Watson and Rayner's conditioning procedure was largely ineffective"
  ghi_chu: "Bài đăng trực tuyến 10/2020, số in 2021 (History of Psychology 24(2)); đọc tóm tắt ở PubMed."
- trang: thi-nghiem/little-albert
  id: n3
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "He was on the whole stolid and unemotional.; the bar was struck immediately behind his head. The infant jumped violently and fell forward"
  ghi_chu: "Bài gốc ghi 'sau đầu' (behind his head); 'cứ mỗi lần chạm' đúng cho buổi 1, các lần ghép ở buổi sau không tả là lúc chạm. Chi tiết nhỏ, không đổi ý."
- trang: thi-nghiem/little-albert
  id: n4
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "In all seven joint stimulations were given to bring about the complete reaction."
- trang: thi-nghiem/little-albert
  id: n5
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "Rabbit alone... The reaction was pronounced.; Fur coat (seal)...; W. then brought the Santa Claus mask... pronouncedly negative."
  ghi_chu: "Bài gốc còn kể bông gòn (nhẹ hơn) và tóc của Watson."
- trang: thi-nghiem/little-albert
  id: n6
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "Unfortunately Albert was taken from the hospital the day the above tests were made. Hence the opportunity ... was denied us."
- trang: thi-nghiem/little-albert
  id: n7
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/33090820/"]
  trich: "the relatively weak signs of distress that Albert does display in the film can be readily accounted for by such factors as sensitization and maturational influences"
  ghi_chu: "Tóm tắt ở PubMed."
- trang: thi-nghiem/little-albert
  id: n8
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "These authors without adequate experimental evidence advanced the view that this range was increased by means of conditioned reflex factors."
  ghi_chu: "Watson và Morgan 1917, American Journal of Psychology (chú thích 1 của bài)."
- trang: thi-nghiem/little-albert
  id: n9
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "Can we condition fear of an animal, e.g., a white rat, by visually presenting it and simultaneously striking a steel bar?"
  ghi_chu: "Định nghĩa chuẩn của điều kiện hóa cổ điển; khớp quy trình trong bài gốc."
- trang: thi-nghiem/little-albert
  id: n10
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/33090820/"]
  trich: "one of the most widely cited studies in psychology... typically presented as evidence for the role of classical conditioning in fear development"
- trang: thi-nghiem/little-albert
  id: n11
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "At first there was considerable hesitation upon our part... A certain responsibility attaches to such a procedure."
- trang: thi-nghiem/little-albert
  id: n12
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "This infant was reared almost from birth in a hospital environment; his mother was a wet nurse in the Harriet Lane Home for Invalid Children."
- trang: thi-nghiem/little-albert
  id: n13
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "he was healthy from birth and one of the best developed youngsters... stolid and unemotional. His stability was one of the principal reasons... relatively little harm"
- trang: thi-nghiem/little-albert
  id: n14
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "confronted suddenly and for the first time successively with a white rat, a rabbit, a dog, a monkey, with masks with and without hair, cotton wool, burning newspapers... Manipulation was the most usual reaction"
- trang: thi-nghiem/little-albert
  id: n15
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "eight months, twenty-six days... The child started violently, his breathing was checked... lips began to pucker and tremble. On the third stimulation the child broke into a sudden crying fit."
- trang: thi-nghiem/little-albert
  id: n16
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "eleven months, three days... Not the slightest sign of a fear response was obtained in any situation."
- trang: thi-nghiem/little-albert
  id: n17
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "fell forward, burying his face in the mattress. He did not cry, however. 2. ... Again the infant jumped violently, fell forward and began to whimper."
- trang: thi-nghiem/little-albert
  id: n18
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "When the rat nosed the infant's left hand, the hand was immediately withdrawn."
- trang: thi-nghiem/little-albert
  id: n19
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "Rat alone. The instant the rat was shown the baby began to cry... began to crawl away so rapidly that he was caught with difficulty"
- trang: thi-nghiem/little-albert
  id: n20
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "Dog alone. The dog did not produce as violent a reaction as the rabbit... Two other observers did the same thing. He began immediately to play with their hair."
- trang: thi-nghiem/little-albert
  id: n21
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "It will be recalled that this was the first time any effort had been made to directly condition response to the dog and rabbit."
  ghi_chu: "Áo lông, bông gòn, tóc, mặt nạ không bao giờ được ghép với tiếng động."
- trang: thi-nghiem/little-albert
  id: n22
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "The response was much less marked than on first presentation... freshen up the reaction...; large well-lighted lecture room... Four people were present."
  ghi_chu: "Ở phòng giảng, lần đưa đầu chuột 'no sudden fear reaction', thỏ 'slight'; về sau trong cùng buổi phản ứng với thỏ lại 'pronounced'. Câu đúng cho các lần đầu ở phòng giảng."
- trang: thi-nghiem/little-albert
  id: n23
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "the dog, which had not barked before, barked three times loudly when only about six inches from the baby's face... produced a marked fear response in the adult observers!"
- trang: thi-nghiem/little-albert
  id: n24
  luot_2: sai
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "Rat then touched his hand. Albert withdrew it immediately, then leaned back... began to fret... covered his eyes with both hands."
  cau_dung: "Buổi 5 (1 tuổi 21 ngày, 31 ngày sau; suốt thời gian ấy bé ở nhà trẻ bệnh viện và không có thử nghiệm cảm xúc): phản ứng yếu đi phần nào nhưng bé vẫn né mặt nạ, áo lông, thỏ, chó; với chuột thì rụt tay, ngả người ra xa, quấy và lấy hai tay che mắt khi chuột bò lên ngực."
  ghi_chu: "Bài gốc không tả bé 'nhăn mặt' với chuột (chỉ rụt tay, ngả ra sau, 'fret', che mắt); 'puckered up his face' là với thỏ. Phần còn lại đúng."
- trang: thi-nghiem/little-albert
  id: n25
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "Albert was taken from the hospital the day the above tests were made."
- trang: thi-nghiem/little-albert
  id: n26
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "IV. If after a reasonable period such emotional responses have not died out, what laboratory methods can be devised for their removal?"
- trang: thi-nghiem/little-albert
  id: n27
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "Our own view, expressed above, which is possibly not very well grounded, is that these responses in the home environment are likely to persist indefinitely"
- trang: thi-nghiem/little-albert
  id: n28
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Jones/"]
  trich: "The research was conducted with the advice of Dr. John B. Watson; Peter was 2 years and 10 months old... afraid of a white rat, and this fear extended to a rabbit, a fur coat, a feather, cotton wool; About three years later"
- trang: thi-nghiem/little-albert
  id: n29
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Jones/"]
  trich: "Each day Peter and three other children were brought to the laboratory...; illness and quarantine... two months; we began another method of treatment, that of 'direct conditioning'"
  ghi_chu: "Đợt sợ trở lại được Jones giải thích bằng việc một con chó lớn nhảy vào Peter lúc rời bệnh viện."
- trang: thi-nghiem/little-albert
  id: n30
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Jones/"]
  trich: "He showed in the last interview... a genuine fondness for the rabbit... The fear of the cotton, the fur coat, feathers, was entirely absent... The study is still incomplete."
- trang: thi-nghiem/little-albert
  id: n31
  luot_2: qua-manh
  nguon: ["https://psychclassics.yorku.ca/Jones/", "https://doi.org/10.1037/e735962011-004"]
  cau_dung: "Mary Cover Jones báo cáo một ca (Peter); cách gỡ nỗi sợ của bà thường được xem là tiền thân của liệu pháp hành vi, trong đó có liệu pháp phơi nhiễm."
  ghi_chu: "'Một ca' và 'tiền thân' có cơ sở (Jones 1924; Jones được gọi là 'mother of behavior therapy', chỉ thấy tên bài, không đọc toàn văn). Vế 'minh chứng khoa học có thể tạo ra kiến thức mà không cần gây tổn thương vĩnh viễn' là lời đánh giá, không nguồn nào nói, và bài của Jones tự nhận chưa biết về nỗi sợ gốc và tương lai của Peter. Nếu trang chỉ ghi là chữ cũ đã bỏ thì việc bỏ là đúng."
- trang: thi-nghiem/little-albert
  id: n32
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Jones/"]
  trich: "This case made it possible for the experiment to continue where Dr. Watson had left off."
- trang: thi-nghiem/little-albert
  id: n33
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/25703487/", "https://doi.org/10.1038/mp.2015.88"]
  ghi_chu: "Vững chắc đạt thước đo: phân tích tổng hợp Duits 2015 (44 nghiên cứu, người bệnh và người khỏe đều có phản ứng sợ có điều kiện) và phân tích tổng hợp fMRI Fullana 2016; mô thức được tái lập ở rất nhiều phòng thí nghiệm. Tóm tắt."
- trang: thi-nghiem/little-albert
  id: n34
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/25703487/"]
  trich: "Forty-four studies... 963 anxiety disordered patients and 1,222 control subjects...; extinction processes are thought to underlie the beneficial effects of exposure treatment"
- trang: thi-nghiem/little-albert
  id: n35
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "Albert was taken from the hospital the day the above tests were made."
- trang: thi-nghiem/little-albert
  id: n36
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/33090820/", "https://psychclassics.yorku.ca/Watson/emotion.htm"]
  ghi_chu: "Bằng chứng mâu thuẫn: bài gốc khẳng định có điều kiện hóa và chuyển; phân tích phim (Powell và Schmaltz) và các phê bình trước đó cho rằng điều kiện hóa ít hay không có. Một ca nên không thể có tổng hợp; nhãn Đang tranh cãi hợp, không cao hơn thước đo."
- trang: thi-nghiem/little-albert
  id: n37
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/33090820/"]
  trich: "the tendency for viewers to perceive the film as a valid demonstration of fear conditioning is likely the result of expectancy effects"
- trang: thi-nghiem/little-albert
  id: n38
  luot_2: dung
  nguon: ["https://doi.org/10.1037/a0017234", "https://doi.org/10.1037/a0026720"]
  trich: "an employee at the Harriet Lane Home was Albert's mother. Contact with the woman's descendents led the authors to the individual they believe to be 'Little Albert'; Douglas Merritte (1919-1925)... died early with hydrocephalus"
  ghi_chu: "đọc tóm tắt qua OpenAlex (toan_van: false); năm sinh, năm mất và não úng thủy lấy từ tóm tắt Fridlund 2012 kể lại Beck 2009."
- trang: thi-nghiem/little-albert
  id: n39
  luot_2: dung
  nguon: ["https://doi.org/10.1037/a0026720", "https://doi.org/10.1037/a0036854"]
  trich: "Further inquiries found ample sources of information available to Watson that would have made him aware of Douglas/Albert's medical condition"
  ghi_chu: "đọc tóm tắt qua OpenAlex (toan_van: false); Powell 2014 tóm lại cáo buộc là Watson 'probably knew' và 'fraudulently hid'."
- trang: thi-nghiem/little-albert
  id: n40
  luot_2: dung
  nguon: ["https://doi.org/10.1037/a0036854"]
  trich: "Albert Barger, who appears to match the characteristics of Little Albert better than Douglas Merritte does... As for the allegations of fraudulent activity by Watson, we offer comments"
  ghi_chu: "đọc tóm tắt qua OpenAlex (toan_van: false)"
- trang: thi-nghiem/little-albert
  id: n41
  luot_2: dung
  nguon: ["https://api.openalex.org/works?filter=title.search:little%20albert,from_publication_date:2014-01-01", "https://doi.org/10.1037/hop0000087"]
  ghi_chu: "Sau 2014 có Digdon 2017 và 2020 (History of Psychology) bênh giả thuyết Barger và gọi các bài Merritte là 'rise and fall'; đó là một bên của tranh luận, chưa thấy bên Beck/Fridlund chấp nhận hay tổng quan độc lập kết luận. Câu viết thận trọng nên đúng; lượt 1 nên dẫn thêm Digdon 2020."
- trang: thi-nghiem/little-albert
  id: n42
  luot_2: dung
  nguon: ["https://doi.org/10.1037/a0017234", "https://doi.org/10.1037/a0036854", "https://doi.org/10.1037/a0037325", "https://doi.org/10.1037/hop0000087"]
  ghi_chu: "Hai giả thuyết có bằng chứng và phản bác qua lại (Beck 2009, Fridlund 2012 với Powell 2014, Digdon 2014, 2020): nhãn tranh cãi hợp."
- trang: thi-nghiem/little-albert
  id: n43
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm", "https://pubmed.ncbi.nlm.nih.gov/33090820/"]
  ghi_chu: "Bài gốc trình bày Albert như thí nghiệm kiểm tra điều kiện hóa cảm xúc; Powell và Schmaltz nêu phản biện."
- trang: thi-nghiem/little-albert
  id: n44
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm", "https://pubmed.ncbi.nlm.nih.gov/33090820/"]
  trich: "From the above results it would seem that emotional transfers do take place."
- trang: thi-nghiem/little-albert
  id: n45
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Jones/"]
  trich: "Through the presence of the pleasant stimulus (food) whenever the rabbit was shown, the fear was eliminated gradually"
- trang: thi-nghiem/little-albert
  id: n46
  luot_2: dung
  nguon: ["https://www.frontiersin.org/articles/10.3389/fnbeh.2015.00189/pdf"]
  trich: "Mowrer argued that as a result of Pavlovian fear conditioning (first factor)...; the two-factor theory of Mowrer proves unable to account for a series of experimental results and clinical observations"
- trang: thi-nghiem/little-albert
  id: n47
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Jones/"]
  trich: "Peter's fear of the animals which were shown him was probably not a directly conditioned fear... Where the fear originated and with what stimulus, is not known."
- trang: thi-nghiem/little-albert
  id: n48
  luot_2: dung
  nguon: ["https://www.nhs.uk/mental-health/conditions/phobias/overview/"]
  trich: "See a GP if: you think you have a phobia and the symptoms are affecting your life"
  ghi_chu: "Lời khuyên tìm giúp đỡ khi nỗi sợ ảnh hưởng cuộc sống khớp NHS; câu không chẩn đoán, không hướng dẫn điều trị. Phần 'xem trang Hỗ trợ' là về site."
- trang: thi-nghiem/little-albert
  id: n49
  luot_2: qua-manh
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/25703487/", "https://www.nice.org.uk/guidance/cg113/chapter/Recommendations"]
  trich: "Individual non-facilitated self-help: this is a self-administered intervention... usually with minimal therapist contact"
  cau_dung: "Liệu pháp phơi nhiễm: các quá trình tắt dần của nỗi sợ điều kiện hóa được cho là nền tảng của liệu pháp phơi nhiễm; liệu pháp này thường do chuyên gia thực hiện hoặc hướng dẫn, và trang không hướng dẫn tự làm."
  ghi_chu: "Vế đầu đúng theo Duits 2015. Vế 'đó là liệu pháp do chuyên gia thực hiện' nói tuyệt đối: hướng dẫn NICE CG113 có cả tự giúp dựa trên CBT, không cần hay chỉ cần rất ít liên lạc với nhà trị liệu. Câu sửa vẫn giữ lời không hướng dẫn tự làm."
- trang: thi-nghiem/little-albert
  id: n50
  luot_2: dung
  nguon: ["https://doi.org/10.1037/a0018916"]
  trich: "a change in the liking of a stimulus (CS) that results from pairing that stimulus with other positive or negative stimuli (US)... mean EC effect was d = .52"
  ghi_chu: "Đây là điều kiện hóa đánh giá (thích hay không thích), không phải nỗi sợ; 'như ghép đôi kiểu Watson' chỉ đúng nếu hiểu là cùng nguyên tắc ghép đôi. Tóm tắt."
- trang: thi-nghiem/little-albert
  id: n51
  luot_2: dung
  nguon: ["https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=(Vietnam%20OR%20Vietnamese)%20AND%20%22fear%20conditioning%22"]
  ghi_chu: "PubMed (Vietnam OR Vietnamese) AND 'fear conditioning': 1 kết quả, là bình luận về PTSD, không phải nghiên cứu trên trẻ sơ sinh Việt; OpenAlex cũng không thấy. Tra ngày 30/10/2026."
- trang: thi-nghiem/little-albert
  id: n52
  luot_2: qua-manh
  nguon: ["https://doi.org/10.1080/026999399379320", "https://psychclassics.yorku.ca/Watson/emotion.htm"]
  cau_dung: "Theo chuẩn đạo đức nghiên cứu hiện nay, một thí nghiệm cố ý gây sợ ở trẻ sơ sinh rồi không gỡ như vậy khó được hội đồng đạo đức chấp thuận; thí nghiệm một trẻ cũng không cho phép suy rộng rằng mọi lời dọa trẻ đều tạo nỗi sợ điều kiện hóa."
  ghi_chu: "Hai câu cũ nói quá: 'không bao giờ... hội đồng nào' là tuyệt đối, không nguồn nào kiểm được; 'cơ chế là phổ quát nên bài học... đều áp dụng được' suy từ một ca không đối chứng, mà chính bằng chứng ở Albert đang bị nghi ngờ. Nếu trang chỉ ghi là chữ cũ đã bỏ thì việc bỏ là đúng."
- trang: thi-nghiem/little-albert
  id: n53
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "Manipulation was the most usual reaction called out. At no time did this infant ever show fear in any situation.; Not the slightest sign of a fear response"
