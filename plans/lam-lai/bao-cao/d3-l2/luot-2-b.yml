  id: n54
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Watson/emotion.htm"]
  trich: "Unfortunately Albert was taken from the hospital the day the above tests were made.; IV. ... what laboratory methods can be devised for their removal?"
