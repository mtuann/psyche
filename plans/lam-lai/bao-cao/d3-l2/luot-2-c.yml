  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''all but two of the subjects in the aggressive condition performed the models'' novel aggressive responses''; the model ''sat on it and punched it repeatedly in the nose... struck the doll on the head... tossed the doll up in the air aggressively and kicked it'''
- trang: thi-nghiem/bandura
  id: n4
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''subjects in the other conditions only rarely exhibited such reactions''; ''approximately 70% of the subjects had zero scores'' (nhóm hiền lành và đối chứng).'
- trang: thi-nghiem/bandura
  id: n5
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''without any opportunity to perform the models'' behavior in the exposure setting, and without any reinforcers delivered either to the models or to the observers.'''
- trang: thi-nghiem/bandura
  id: n6
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''Much current research on social learning is focused on the shaping of new behavior through rewarding and punishing consequences.'''
- trang: thi-nghiem/bandura
  id: n7
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  - https://doi.org/10.1037/h0048687
  trich: 'Bandura, Ross & Ross (1961) ''social imitation may hasten or short-cut the acquisition of new behaviors''; mẫu: Stanford University Nursery School.'
  ghi_chu: Việc Bandura làm ở Stanford suy từ 'Stanford University Nursery School' trong bài; chức danh không ghi trong bài.
- trang: thi-nghiem/bandura
  id: n8
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  - https://doi.org/10.1037/a0018251
  - https://doi.org/10.1037/a0018566
  trich: Bài 1961 và tranh luận Anderson/Ferguson & Kilburn 2010 về bạo lực truyền thông.
  ghi_chu: Câu nhận định lịch sử/ ngữ cảnh, hợp lý.
- trang: thi-nghiem/bandura
  id: n9
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''The subjects were 36 boys and 36 girls enrolled in the Stanford University Nursery School. They ranged in age from 37 to 69 months, with a mean age of 52 months.'''
- trang: thi-nghiem/bandura
  id: n10
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: Nhóm đối chứng 24 trẻ; 48 trẻ còn lại chia nửa cho mẫu gây hấn và mẫu hiền lành (24 mỗi nhóm).
- trang: thi-nghiem/bandura
  id: n11
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''the model assembled the tinker toys in a quiet subdued manner totally ignoring the Bobo doll''; ''after approximately a minute had elapsed, the model turned to the Bobo doll''; ''Sock him in the nose'''
- trang: thi-nghiem/bandura
  id: n12
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''subjects in the experimental and control groups were matched individually on the basis of ratings of their aggressive behavior... arranged in triplets and assigned at random'''
  ghi_chu: Ghép theo điểm do người thí nghiệm và giáo viên chấm (không chỉ giáo viên); câu 'giáo viên đánh giá' hơi thiếu nhưng đúng ý.
- trang: thi-nghiem/bandura
  id: n13
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''Half the subjects in the aggressive and nonaggressive conditions observed same-sex models, while the remaining subjects in each group viewed models of the opposite sex.'''
- trang: thi-nghiem/bandura
  id: n14
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''At the end of 10 minutes, the experimenter entered the room''; trẻ làm tranh dán/in khoai, người mẫu ở góc đối diện.'
- trang: thi-nghiem/bandura
  id: n15
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''these were her very best toys, that she did not let just anyone play with them, and that she had decided to reserve these toys for the other children.'' (khoảng 2 phút sau khi trẻ chơi)'
- trang: thi-nghiem/bandura
  id: n16
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''all subjects, experimental and control, were subjected to mild aggression arousal to insure that they were under some degree of instigation to aggression.'''
- trang: thi-nghiem/bandura
  id: n17
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''The subject spent 20 minutes in this experiments room''; phòng có Bobo (3 feet), mallet, two dart guns; ''busying herself with paper work at a desk in the far corner'''
- trang: thi-nghiem/bandura
  id: n18
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''divided into 5-second intervals''; ''The male model scored the experimental sessions for all 72 children''; second observer scored half; ''product-moment coefficients being in the .90s'''
- trang: thi-nghiem/bandura
  id: n19
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''subjects who were exposed to the aggressive models could be readily identified through the distinctive behavior.'''
- trang: thi-nghiem/bandura
  id: n20
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''The main effect of treatment conditions is highly significant both for physical and verbal imitative aggression.'''
- trang: thi-nghiem/bandura
  id: n21
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''Approximately one-third of the subjects in the aggressive condition also repeated the model''s nonaggressive verbal responses while none of the subjects in either the nonaggressive or control groups made such remarks.'''
- trang: thi-nghiem/bandura
  id: n22
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''boys reproduced more imitative physical aggression than girls (t = 2.50 p < .01). The groups do not differ, however, in their imitation of verbal aggression.'''
- trang: thi-nghiem/bandura
  id: n23
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''The hypothesis that boys are more prone than girls to imitate aggression exhibited by a model was only partially confirmed''; hiệu ứng ''much more consistent and pronounced for the male model''.'
- trang: thi-nghiem/bandura
  id: n24
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: 'Nam xem mẫu nam: physical t=2.07 p<.05; verbal t=2.51 p<.05; nữ với mẫu nữ ''the mean differences did not reach statistical significance'' (ô nhỏ).'
  ghi_chu: 'Ô 6 trẻ: mỗi nhóm thí nghiệm 6 trẻ.'
- trang: thi-nghiem/bandura
  id: n25
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''except for the greater amount of mallet aggression exhibited by the control subjects, no significant differences were obtained between the nonaggressive and control groups''; ''comparison of subgroups... is likely to capitalize on chance differences'''
- trang: thi-nghiem/bandura
  id: n26
  luot_2: khong-chac
  nguon:
  - https://doi.org/10.1037/h0048687
  ghi_chu: 'Chỉ đọc được tóm tắt bị cắt trên PubMed/OpenAlex: một nhóm xem mẫu thật, một nhóm xem chính mẫu đó trên phim, nhóm thứ ba xem nhân vật hoạt hình. Cỡ mẫu (96, 48 trai và 48 gái, 24 mỗi nhóm) và có nhóm đối chứng riêng chưa xác nhận được; Wikipedia ghi 3 nhóm với đối chứng lấy từ 1961 (mâu thuẫn, nguồn bậc thấp). Toàn văn không mở được.'
- trang: thi-nghiem/bandura
  id: n27
  luot_2: khong-chac
  ghi_chu: 'Không mở được toàn văn 1963 để xác nhận ''gần gấp đôi'' và ''không khác đáng kể giữa người thật và phim''; tóm tắt bị cắt. Nguồn thứ cấp (Wikipedia: ba nhóm tăng gây hấn tương tự) chỉ gợi ý.'
- trang: thi-nghiem/bandura
  id: n28
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/h0048687
  trich: 'Tóm tắt: ''a test of the hypothesis that exposure of children to film-mediated aggressive models would increase the probability of Ss'' aggression to subsequent frustration'''
- trang: thi-nghiem/bandura
  id: n29
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/h0022070
  trich: 'Bandura (1965), JPSP 1:589; tóm tắt: ''models were rewarded or punished for exhibiting aggressive behavior... The number of different physical and verbal imitative responses emitted spontaneously by the children'''
  ghi_chu: Chỉ đọc tóm tắt.
- trang: thi-nghiem/bandura
  id: n30
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/h0022070
  trich: '''contemporaneous reinforcements are unnecessary for the acquisition of new matching responses''; ''reinforcements administered to a model exert their major influence on the performance of imitatively learned responses'''
  ghi_chu: Chỉ đọc tóm tắt.
- trang: thi-nghiem/bandura
  id: n31
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/h0022070
  trich: '''the significant effect of the model''s reinforcement contingencies is based predominantly on differences among the girls'' subgroups.'''
  ghi_chu: Chỉ đọc tóm tắt; khớp 'theo tóm tắt'.
- trang: thi-nghiem/bandura
  id: n32
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/h0022070
  trich: '''reinforcements administered to a model exert their major influence on the performance of imitatively learned responses'''
  ghi_chu: Câu 'không quyết định việc học' suy từ 'acquisition... may take place through contiguity'; hơi mạnh nhưng đúng ý tác giả. Chỉ đọc tóm tắt.
- trang: thi-nghiem/bandura
  id: n33
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  - https://doi.org/10.1037/h0022070
  trich: '''subjects learned to combine fractional responses into relatively complex novel patterns solely by observing... without any reinforcers delivered either to the models or to the observers''; 1965: ''contemporaneous reinforcements are unnecessary for the acquisition of new matching responses'''
  ghi_chu: 'Nhãn ''Khá vững'' không cao hơn thước: nhiều nghiên cứu cùng chiều, chưa có tái lập lớn có đăng ký trước hay phân tích tổng hợp riêng cho điểm này.'
- trang: thi-nghiem/bandura
  id: n34
  luot_2: qua-manh
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''The hypothesis that boys are more prone than girls... was only partially confirmed''; ''with only a small N in each cell the mean differences did not reach statistical significance''; ''a Sex x Model interaction... much more consistent and pronounced for the male model'''
  ghi_chu: 'Nhãn ''Khá vững'' cao hơn thước đo: bằng chứng về giới tính của mẫu chủ yếu từ vài nghiên cứu Bandura, mỗi ô 6 trẻ, so sánh nhóm con ''dễ nhờ may rủi'' (chính tác giả), và không có tổng hợp hay tái lập kiểm lại. ''Bé trai bắt chước gây hấn thể chất nhiều hơn'' có ý nghĩa thống kê trong bài 1961; ''mẫu nam ảnh hưởng rõ hơn'' chỉ là xu hướng.'
  cau_dung: 'Đang tranh cãi hay chưa đủ bằng chứng: bé trai bắt chước gây hấn thể chất nhiều hơn bé gái (t = 2,50, p < 0,01 ở bài 1961) và xu hướng mẫu nam có ảnh hưởng rõ hơn, nhưng dựa trên mẫu nhỏ, so sánh nhóm con, chưa có tái lập hay tổng hợp.'
- trang: thi-nghiem/bandura
  id: n35
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/a0018251
  - https://doi.org/10.1037/a0018566
  trich: 'Anderson 2010: ''violent video games is a causal risk factor''; Ferguson & Kilburn 2010: ''the final estimate of r = .15 is still indicative of only weak effects.'''
  ghi_chu: Nhãn 'Đang tranh cãi' hợp thước đo (bằng chứng chất lượng cao mâu thuẫn hay hiệu ứng nhỏ).
- trang: thi-nghiem/bandura
  id: n36
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/a0018251
  trich: '''The evidence strongly suggests that exposure to violent video games is a causal risk factor for increased aggressive behavior, aggressive cognition, and aggressive affect... little evidence of selection (publication) bias.'' Bài so sánh Nhật Bản với phương Tây.'
- trang: thi-nghiem/bandura
  id: n37
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/a0018566
  trich: '''included many studies that do not relate well to serious aggression, an apparently biased sample of unpublished studies... unstandardized aggression measures... r = .15 is still indicative of only weak effects.'''
- trang: thi-nghiem/bandura
  id: n38
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/a0018251
  - https://doi.org/10.1037/a0018566
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: Cả hai bài đều về trò chơi điện tử bạo lực.
  ghi_chu: 'Đúng: hai bài đều bàn về trò chơi điện tử.'
- trang: thi-nghiem/bandura
  id: n39
  luot_2: dung
  nguon:
  - https://openstax.org/books/psychology-2e/pages/6-4-observational-learning-modeling
  trich: '''Bandura described specific steps in the process of modeling that must be followed if learning is to be successful'': attention, retention, reproduction, motivation.'
  ghi_chu: Đọc qua công cụ đọc web.
- trang: thi-nghiem/bandura
  id: n40
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''social imitation may hasten or short-cut the acquisition of new behaviors without the necessity of reinforcing successive approximations as suggested by Skinner (1953).'''
- trang: thi-nghiem/bandura
  id: n41
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/h0022070
  trich: 'Tóm tắt 1965: tác động của thưởng phạt cho mẫu chủ yếu ở việc thể hiện, không ở việc tiếp thu.'
  ghi_chu: Chỉ đọc tóm tắt; 'thấy được thưởng thì muốn làm theo' là diễn giải chung.
- trang: thi-nghiem/bandura
  id: n42
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''aggression, however, is a highly masculine-typed behavior, boys should be more predisposed than girls toward imitating aggression''; ''only partially confirmed'''
- trang: thi-nghiem/bandura
  id: n43
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''children... reproduced a good deal of physical and verbal aggression... without any reinforcers delivered either to the models or to the observers'''
  ghi_chu: Lời khuyên hedged ('có thể'), khớp phạm vi.
- trang: thi-nghiem/bandura
  id: n44
  luot_2: khong-chac
  nguon:
  - https://doi.org/10.1037/h0048687
  ghi_chu: 'Bài 1963: tóm tắt PubMed chỉ nêu giả thuyết; không mở được kết quả. ''Mẫu trên phim làm tăng gây hấn'' phù hợp mô tả chung của nguồn thứ cấp nhưng chưa xác nhận bậc 1.'
- trang: thi-nghiem/bandura
  id: n45
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''except for the greater amount of mallet aggression exhibited by the control subjects, no significant differences were obtained between the nonaggressive and control groups''; mẫu nam hiền lành: ít gây hấn hơn đối chứng'
  ghi_chu: Câu ghi rõ thí nghiệm không đo cách dạy; đúng.
- trang: thi-nghiem/bandura
  id: n46
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: Bài 1961 là mẫu người thật; 1963 phim.
  ghi_chu: Lời khuyên hedged, nói rõ thí nghiệm không cho biết tác động ngoài đời. Phần 'học từ mẫu trên phim' dựa 1963 (chưa mở toàn văn).
- trang: thi-nghiem/bandura
  id: n47
  luot_2: dung
  ghi_chu: Phép tìm OpenAlex 30/10/2026 ('Bobo doll Vietnamese children imitation aggression') không ra nghiên cứu lặp lại. Phủ định không chứng minh hết được; câu đã có mốc 10/2026.
  nguon:
  - https://api.openalex.org/works?search=Bobo%20doll%20Vietnamese%20children%20imitation%20aggression
