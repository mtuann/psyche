  id: n21
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Harlow/love.htm
  trich: the disparity is so great as to suggest that the primary function of nursing as an affectional variable is that of insuring frequent and intimate body contact of the infant with the mother.
- trang: thi-nghiem/harlow
  id: n22
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Harlow/love.htm
  trich: One control group... raised on a single wire mother, and a second... on a single cloth mother. There were no differences between these two groups in amount of milk ingested or in weight gain.
