- trang: thi-nghiem/harlow
  id: n13
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Harlow/love.htm
  trich: 'contact comfort is a variable of overwhelming importance in the development of affectional response, whereas lactation is a variable of negligible importance. (Hình 5: ở cả hai điều kiện bú, thời gian trên mẹ vải lớn hơn hẳn)'
- trang: thi-nghiem/harlow
  id: n14
  luot_2: khong-chac
  trich: 'Text: ''With age and opportunity to learn, subjects with the lactating wire mother showed decreasing responsiveness to her and increasing responsiveness to the nonlactating cloth mother.'''
  ghi_chu: Harlow viết đúng như câu. Nhưng Hình 5 (giờ trung bình mỗi ngày, 25 ngày đầu, nhóm bú mẹ lưới) cho thấy thời gian trên mẹ lưới gần như phẳng, hơi tăng (khoảng 1,2 lên 1,8 giờ), chỉ thời gian trên mẹ vải tăng (khoảng 7 lên 16 giờ). Hình 6 (165 ngày) không đọc được. Khó xác nhận 'giảm dần' theo giờ tuyệt đối; có thể là giảm tương đối. Nên diễn đạt 'đáp ứng với mẹ lưới giảm tương đối, mẹ vải tăng'.
- trang: thi-nghiem/harlow
  id: n15
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Harlow/love.htm
  trich: the cloth mother is highly preferred over the wire one, and this differential selectivity is enhanced by age and experience... the variable of nursing appears to be of absolutely no importance
- trang: thi-nghiem/harlow
  id: n16
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Harlow/love.htm
  trich: four of our eight baby monkeys... three minutes into the strange environment of a room measuring six feet by six feet by six feet... twice a week for eight weeks
- trang: thi-nghiem/harlow
  id: n17
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Harlow/love.htm
  trich: they would explore and manipulate a stimulus and then return to the mother... Total emotionality score was cut in half when the mother was present.
- trang: thi-nghiem/harlow
  id: n18
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Harlow/love.htm
  trich: Frequently they would freeze in a crouched position
