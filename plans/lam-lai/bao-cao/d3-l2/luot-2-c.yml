  - https://psychclassics.yorku.ca/Harlow/fig5.jpg
  trich: 'Hình 5 và văn bản: dù sữa ở mẹ nào, khỉ ở trên mẹ vải 16-19 giờ/ngày.'
  ghi_chu: 'Nhãn ''Khá vững'' hợp thước đo mục 4: nhiều nghiên cứu cùng chiều nhưng không có phân tích tổng hợp hay tái lập có đăng ký trước, mẫu rất nhỏ (8 khỉ), một loài.'
- trang: thi-nghiem/harlow
  id: n34
  luot_2: khong-chac
  ghi_chu: 'Phần Harlow 1958 (4 trong 8 khỉ dùng mẹ vải làm căn cứ) đúng. Phần Suomi và cộng sự (1976, J Child Psychol Psychiatry 17:101-112; PMID 819450) không đọc được (không có tóm tắt), nên không xác nhận được mệnh đề ''khỉ trầm cảm sau tách phục hồi nhờ bạn cùng tuổi''. Phần ''gần với căn cứ an toàn của Bowlby (theo OpenStax)'': trang OpenStax 9.3 định nghĩa căn cứ an toàn nhưng không nối với thí nghiệm khỉ của Harlow. Câu ghép nhiều mệnh đề, nên tách.'
- trang: thi-nghiem/harlow
  id: n35
  luot_2: dung
  ghi_chu: 'Nhãn ''Đang tranh cãi'' cho việc suy rộng sang người: hợp lý; đây là chỗ giới hạn ngoại suy (loài khác, 8 khỉ, nuôi nhân tạo), chưa có nguồn cụ thể để so thước đo.'
  nguon:
  - https://psychclassics.yorku.ca/Harlow/love.htm
- trang: thi-nghiem/harlow
  id: n36
  luot_2: dung
  nguon:
  - https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development
  trich: '''Building on the work of Harlow and others, John Bowlby developed the concept of attachment theory.'' ''He defined attachment as the affectional bond or tie that an infant forms with the mother.'' ''A secure base is a parental presence that gives the child a sense of safety as he explores his surroundings.'''
  ghi_chu: Đọc qua công cụ đọc web.
