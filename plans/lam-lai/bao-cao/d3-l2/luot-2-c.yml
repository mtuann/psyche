  id: n28
  luot_2: dung
  nguon:
  - https://grants.nih.gov/policy-and-compliance/policy-topics/animal-welfare/laws-regulations/phs-policy
  trich: '''the IACUC shall conduct a review of those components related to the care and use of animals'' ... ''Procedures with animals will avoid or minimize discomfort, distress, and pain to the animals.'' (PHS Policy IV.C.1)'
  ghi_chu: Đúng với chuẩn Hoa Kỳ (PHS Policy); câu nói chung 'ngày nay'.
- trang: thi-nghiem/harlow
  id: n29
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Harlow/love.htm
  trich: The basic motives are... the primary drives... and all other motives, including love or affection, are derived or secondary drives. The mother is associated with the reduction of the primary drives... and through learning, affection or love is derived.
- trang: thi-nghiem/harlow
  id: n30
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Harlow/love.htm
  trich: It is entirely reasonable to believe that the mother through association with food may become a secondary-reinforcing agent, but this is an inadequate mechanism to account for the persistence of the infant-maternal ties.
