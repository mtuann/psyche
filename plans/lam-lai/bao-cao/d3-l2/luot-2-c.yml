- trang: thi-nghiem/bandura
  id: n2
  luot_2: sai
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''a 5-foot inflated Bobo doll'' (phòng người mẫu); ''a 3-foot Bobo doll'' (phòng thử của trẻ).'
  ghi_chu: 'Câu thiếu chính xác: búp bê 1,5 m (5 feet) là của người mẫu; búp bê trẻ thật sự chơi ở phòng thử cao 3 feet (khoảng 0,9 m).'
  cau_dung: Người mẫu đánh búp bê Bobo bơm hơi cao 5 feet (khoảng 1,5 m); búp bê ở phòng thử của trẻ cao 3 feet (khoảng 0,9 m).
