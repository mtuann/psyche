  ghi_chu: Phép tìm OpenAlex 30/10/2026 (Harlow, surrogate, Vietnam; orphanage attachment Vietnam) không ra bản lặp lại; chỉ thấy nghiên cứu liên quan nhà trẻ ở Việt Nam (ví dụ doi 10.4236/jss.2018.611021) không phải thí nghiệm tương tự. Phủ định không chứng minh hết được; câu đã có mốc 10/2026.
