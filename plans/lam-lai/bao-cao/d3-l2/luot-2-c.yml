  id: n31
  luot_2: dung
  nguon:
  - https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development
  trich: '''Harlow (1958) concluded that there was more to the mother-child bond than nourishment.'' ''Prior to this study, the medical and scientific communities generally thought'' babies become attached to the people who provide their nourishment.'
  ghi_chu: Đọc qua công cụ đọc web.
