  id: n19
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Harlow/love.htm
  trich: Four control infants never raised with a mother surrogate showed the same emotionality scores when the mother was absent as the experimental infants showed in the absence of the mother
- trang: thi-nghiem/harlow
  id: n20
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Harlow/love.htm
  trich: contact comfort is a variable of overwhelming importance in the development of affectional response, whereas lactation is a variable of negligible importance.
