  id: n25
  luot_2: dung
  nguon:
  - https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development
  trich: '''today his experiments are widely considered to be unethical and even cruel'' (Link to Learning, OpenStax Psychology 2e, mục 9.3).'
  ghi_chu: Đọc qua công cụ đọc web; câu trích đúng ý.
- trang: thi-nghiem/harlow
  id: n26
  luot_2: khong-chac
  ghi_chu: Có bài 'Induced depression in monkeys' (1974, Behavioral Biology; Crossref) nên đúng khung thời gian 1960-1970s, nhưng không mở được nội dung và không tìm được nguồn cụm 'pit of despair'. Không xác nhận được ở bậc 1-2.
- trang: thi-nghiem/harlow
  id: n27
  luot_2: dung
  ghi_chu: Câu mô tả điều đã bỏ khỏi trang, không phải khẳng định về nghiên cứu.
  nguon:
  - https://grants.nih.gov/policy-and-compliance/policy-topics/animal-welfare/laws-regulations/phs-policy
