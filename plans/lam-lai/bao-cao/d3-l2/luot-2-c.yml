  id: n48
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/a0018251
  trich: 'Tóm tắt: ''cross-cultural comparisons''; ''cultural differences between Japan and Western countries'''
  ghi_chu: 'Chỉ đọc tóm tắt: nó nêu so sánh Nhật-phương Tây; không thấy Việt Nam ở tóm tắt.'
- trang: thi-nghiem/bandura
  id: n49
  luot_2: dung
  ghi_chu: Lời khuyên thận trọng, khớp giới hạn.
  nguon:
  - https://doi.org/10.1037/a0018251
- trang: thi-nghiem/bandura
  id: n50
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  - https://doi.org/10.1037/a0018251
  - https://doi.org/10.1037/a0018566
  trich: Bài 1961 là phòng thí nghiệm; Anderson vs Ferguson mâu thuẫn.
- trang: thi-nghiem/bandura
  id: n51
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''treatment conditions did not influence the extent to which subjects engaged in aggressive gun play or punched the Bobo doll''; Bobo punching ''a response that is likely to be performed by children independently of a demonstration'''
- trang: thi-nghiem/bandura
  id: n52
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''To the extent that observation of adult models displaying aggression communicates permissiveness for aggressive behavior, such exposure may serve to weaken inhibitory responses''; ''The fact, however, that subjects expressed their aggression in ways that clearly resembled the novel patterns... provides striking evidence for the occurrence of learning by imitation.'''
- trang: thi-nghiem/bandura
  id: n53
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  ghi_chu: Bài 1961 (đọc gần hết) không có kiến nghị cấm trẻ xem bạo lực; câu là ngộ nhận cũ được nêu để bác. Không tìm được nguồn gốc của ngộ nhận.
- trang: thi-nghiem/bandura
  id: n54
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '36 boys and 36 girls... Stanford University Nursery School; ba điều kiện: aggressive, nonaggressive, control (24).'
- trang: thi-nghiem/bandura
  id: n55
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''observation of aggressive behavior exhibited by others tends to reduce the probability of aggression on the part of the observer''; ''if subjects in the nonaggressive condition expressed little aggression in the face of appropriate instigation, the presence of an inhibitory process would seem to be indicated.'''
- trang: thi-nghiem/bandura
  id: n56
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Bandura/bobo.htm
  trich: '''boys reproduced more imitative physical aggression than girls (t = 2.50 p < .01)''; ''only partially confirmed'''
- trang: thi-nghiem/bandura
  id: n57
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/h0022070
  trich: '''reinforcements administered to a model exert their major influence on the performance of imitatively learned responses''; ''contemporaneous reinforcements are unnecessary for the acquisition of new matching responses'''
  ghi_chu: Chỉ đọc tóm tắt; phần 'trẻ thấy mẫu bị phạt vẫn có thể tiếp thu' là diễn giải đúng ý tác giả.
- trang: thi-nghiem/bandura
  id: n58
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/h0022070
  trich: '''reinforcements administered to a model exert their major influence on the performance of imitatively learned responses'''
  ghi_chu: Câu nói rõ là suy ra từ cơ chế, không phải thử cách dạy; chỉ đọc tóm tắt.
