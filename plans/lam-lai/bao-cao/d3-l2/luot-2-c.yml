  id: n23
  luot_2: dung
  nguon:
  - https://doi.org/10.1073/pnas.54.1.90
  trich: Harlow, Dodsworth & Harlow (1965), 'Total social isolation in monkeys', PNAS 54(1):90-97.
  ghi_chu: Chỉ xác nhận được tiêu đề, tác giả, năm qua Crossref; không có tóm tắt.
- trang: thi-nghiem/harlow
  id: n24
  luot_2: khong-chac
  ghi_chu: Không mở được bài nào về kết quả cô lập (Harlow 1965 không có tóm tắt trên OpenAlex/Crossref; Suomi & Harlow 1972 chỉ thấy tiêu đề). Các chi tiết (sợ hãi, tự kích thích, không giao phối, mẹ không chăm con) phù hợp tài liệu chung nhưng chưa đối chiếu được bậc 1-2. Câu cũng nói về điều đã bỏ khỏi trang.
