  id: n4
  luot_2: dung
  nguon:
  - https://doi.org/10.1126/science.130.3373.421
  trich: 'Harlow & Zimmermann (1959), Science 130:421, tiêu đề: ''Affectional responses in the infant monkey; orphaned baby monkeys develop a strong and persistent attachment to inanimate surrogate mothers.'''
  ghi_chu: Chỉ đọc được tiêu đề và siêu dữ liệu (toàn văn có phí, không có tóm tắt); tiêu đề khớp câu. Phần 'bền' còn được ủng hộ bởi dữ liệu duy trì 185 ngày trong Harlow 1958.
- trang: thi-nghiem/harlow
  id: n5
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Harlow/love.htm
  trich: a cloth mother and a wire mother were placed in different cubicles attached to the infant's living cage
- trang: thi-nghiem/harlow
  id: n6
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Harlow/love.htm
  trich: The surrogate was made from a block of wood, covered with sponge rubber, and sheathed in tan cotton terry cloth. A light bulb behind her radiated heat.
- trang: thi-nghiem/harlow
  id: n7
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Harlow/love.htm
  trich: She is made of wire-mesh... and she is warmed by radiant heat. Her body differs in no essential way from that of the cloth mother surrogate other than in the quality of the contact comfort.
