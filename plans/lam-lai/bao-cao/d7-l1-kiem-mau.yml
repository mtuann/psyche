- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n6
  cau: Câu "không còn thấy gì đáng sống" là lý do để tìm sự giúp đỡ sớm (kèm link Hỗ trợ).
  loai: loi-khuyen
  nguon:
    - ten: "WHO, Depressive disorder (depression), tờ thông tin cập nhật 11/9/2026: toàn văn, đọc 16/11/2026"
      link: https://www.who.int/news-room/fact-sheets/detail/depression
    - ten: "WHO (2024), Clinical descriptions and diagnostic requirements for ICD-11 mental, behavioural and neurodevelopmental disorders (CDDR), ISBN 9789240077263: toàn văn (PDF 852 trang tải từ IRIS của WHO qua trang ấn phẩm; số trang in = số trang PDF trừ 18). Giai đoạn trầm cảm tr. 212–214; 6A70 tr. 244; 6B00 tr. 266–267; 6B01 tr. 271–272; 6B04 tr. 284–285"
      link: https://www.who.int/publications/i/item/9789240077263
  ket_qua_luot_1: da-sua
  ghi_chu: 'Thêm mới (trang cũ không nói gì về câu này trong ví dụ). Lý do: ví dụ có ý nghĩ "không còn thấy gì đáng sống"; theo hướng dẫn đưa tin an toàn, chỗ nhắc tới ý nghĩ này phải kèm đường tới trợ giúp.'
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n72
  cau: "Câu hỏi 2: Cuijpers 2023: g = 0,79, còn 0,47 sau hiệu chỉnh; 42% so với 19%; CBT chỉ hơn liệu pháp khác 0,06; NNT 4,7."
  loai: so-lieu
  nguon:
    - ten: "Cuijpers, Miguel, Harrer, Plessen, Ciharova, Ebert & Karyotaki (2023), World Psychiatry 22(1), 105–115: toàn văn (bản PMC9840507 lưu ở Internet Archive ngày 29/6/2023; PMC và Wiley chặn máy)"
      link: https://doi.org/10.1002/wps.21069
  ket_qua_luot_1: da-sua
  ghi_chu: 'Giải thích cũ: "cứ khoảng 5 người điều trị thì 1 người hưởng lợi thêm so với không điều trị (NNT = 4,7)". "So với không điều trị" thành "so với nhóm đối chứng" (đối chứng gồm chăm sóc thông thường); "hưởng lợi" thành "đáp ứng". Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): lượt 2 khong-chac vì không mở được toàn văn. Toàn văn Cuijpers 2023 (bản PMC9840507 lưu ở Internet Archive ngày 29/6/2023; lượt 1 đã đọc, nay đọc lại): bảng 2 "Only low risk of bias 90 0.60 (0.49‐0.71) … Publication bias correction 349 0.47 (0.35‐0.59)", chú thích bảng "The reported publication bias correction is that using the trim and fill procedure"; Kết quả: "The response rate was 0.42 (95% CI: 0.39‐0.45) in CBT and 0.19 (95% CI: 0.18‐0.21) in the control conditions, which resulted in a RR of 2.13 (95% CI: 1.96‐2.32) and a NNT of 4.7 (95% CI: 4.0‐5.5)"; bảng 3: tỉ lệ đáp ứng ước tính ở 228/238 so sánh. NNT 4,7 do bài tính từ RR gộp (phương pháp: NNT = 1/hiệu số nguy cơ, gộp riêng), không phải 1/(0,42 − 0,19) ≈ 4,3 từ hai tỉ lệ gộp riêng; giữ số của bài. Số 0,47 là trim and fill (chỉ hiệu chỉnh sai lệch xuất bản), không phải gộp cả lọc nguy cơ sai lệch như một nguồn bậc 3 viết. Giữ các số.'
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n37
  cau: 'Ngộ nhận "chỉ cần bình tĩnh, hít thở sâu": kỹ năng thư giãn có thể giúp giảm triệu chứng, nhưng rối loạn lo âu là tình trạng kéo dài, khó kiểm soát; điều trị có bằng chứng là các liệu pháp có cấu trúc như CBT, và khi cần là thuốc do bác sĩ kê.'
  loai: lam-sang
  nguon:
    - ten: "WHO, Anxiety disorders, tờ thông tin cập nhật 15/9/2026: toàn văn, đọc 16/11/2026"
      link: https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Sai ở cách diễn đạt. Kỹ thuật thư giãn có thể hỗ trợ… lời khuyên bình tĩnh đi giống như bảo người cận thị cố nhìn rõ đi." Bỏ so sánh với cận thị; dẫn WHO.'
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n27
  cau: Người có chuyên môn được đào tạo để lắng nghe không phán xét.
  loai: loi-khuyen
  nguon:
    - ten: "Black Dog Institute, What to expect from a mental health consultation (tờ thông tin, 2022): toàn văn (PDF 2 trang)"
      link: https://blackdoginstitute.org.au/wp-content/uploads/2022/08/What-to-expect-from-a-mental-health-consultation-fact-sheet.pdf
    - ten: "APA Dictionary of Psychology: mục psychotherapy, cognitive therapy, cognitive triad, automatic thoughts, psychodynamic psychotherapy, client-centered therapy: toàn văn, đọc 16/11/2026"
      link: https://dictionary.apa.org/
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "người có chuyên môn nghe những câu chuyện như vậy mỗi ngày — công việc của họ là lắng nghe không phán xét, chứ không phải đánh giá con người bạn". Bỏ "nghe mỗi ngày" (không nguồn).'
