- trang: trai-nghiem/mu-thay-doi
  id: n5
  cau: Trong thí nghiệm gốc năm 1997, mỗi ảnh hiện 240 ms, màn trống 80 ms, và mỗi ảnh hiện hai lần trước khi đổi.
  loai: so-lieu
  nguon:
    - ten: "Rensink, O'Regan & Clark (1997), Psychol Sci 8(5), 368–373: toàn văn (bản tác giả, UBC)"
      link: https://www2.psych.ubc.ca/~rensink/publications/download/PsychSci97-RR.pdf
  ket_qua_luot_1: da-sua
  ghi_chu: Thêm "mỗi ảnh hiện hai lần trước khi đổi" (đúng thiết kế A, A, A', A').
- trang: trai-nghiem/stroop
  id: n16
  cau: Hiệu ứng Stroop đã được nghiên cứu ở nhiều ngôn ngữ và hệ chữ viết.
  loai: phat-hien
  nguon:
    - ten: "MacLeod (1991), Psychol Bull 109(2), 163–203: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1037/0033-2909.109.2.163
    - ten: "Morikawa & Hồ Hoàng Hoa (1990), Percept Mot Skills 71(1), 249–258: tóm tắt (OpenAlex)"
      link: https://doi.org/10.2466/pms.1990.71.1.249
    - ten: "Doan & Swerdlow (1999), Percept Mot Skills 89(1), 173–182: tóm tắt (OpenAlex)"
      link: https://doi.org/10.2466/pms.1999.89.1.173
  ket_qua_luot_1: dung
  ghi_chu: "chưa chắc: tóm tắt MacLeod không nêu ngôn ngữ; lượt 2 mở toàn văn hay nguồn khác (nghiên cứu Stroop song ngữ, chữ Hán). Giải quyết sau lượt 2 (Claude Opus 5.5, 16/11/2026): hết chưa chắc: có cả nghiên cứu Stroop tiếng Việt (Morikawa & Hồ Hoàng Hoa 1990: Quốc ngữ, chữ Nôm, chữ Hán; Doan & Swerdlow 1999)."
- trang: trai-nghiem/stroop
  id: n20
  cau: "Câu hỏi 4, lời giải thích: một cách giải thích vì sao trả lời bằng lời cho hiệu ứng lớn hơn là câu trả lời sai và đúng cạnh tranh trên cùng một kênh lời nói; đây là một lý do không nên so thẳng kết quả bấm phím với con số 74% của Stroop (1935)."
  loai: phat-hien
  nguon:
    - ten: "Augustinova, Parris & Ferrand (2019), Front Psychol 10, 1786: toàn văn (Europe PMC, PMC6709679), Bảng 2"
      link: https://doi.org/10.3389/fpsyg.2019.01786
  ket_qua_luot_1: dung
  ghi_chu: 'chưa chắc: Augustinova thấy phần "xung đột đáp án" và "xung đột nhiệm vụ" lớn hơn khi nói, khớp ý "cạnh tranh ở khâu trả lời"; cách nói "cùng một kênh lời nói" là diễn giải của trang (câu đã ghi "một cách giải thích"). Lượt 2 đọc Thảo luận của bài.'
- trang: trai-nghiem/ebbinghaus
  id: n4
  cau: "Độ lớn của ảo giác phụ thuộc nhiều vào cách vẽ: một khảo sát có hệ thống với 27 cấu hình (3 cỡ vòng trung tâm × 3 cỡ vòng bao quanh × 3 khoảng cách) thấy ảo giác từ không có tới khoảng 10% kích thước vòng trung tâm, một phần ba số cấu hình không có ảo giác; với cấu hình kinh điển, một số nghiên cứu khác báo khoảng 10–20%."
  loai: so-lieu
  nguon:
    - ten: "Knol, Huys, Sarrazin & Jirsa (2015), Front Psychol 6, 1679: tóm tắt (OpenAlex)"
      link: https://doi.org/10.3389/fpsyg.2015.01679
    - ten: "Mruczek, Blair, Strother & Caplovitz (2015), Front Hum Neurosci 9, 77: toàn văn (PMC4332331), mục Giới thiệu"
      link: https://doi.org/10.3389/fnhum.2015.00077
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chỉ đổi cách dẫn: "tổng quan trong bài báo về Ebbinghaus động" thành "theo các nghiên cứu trước được tổng hợp trong Mruczek và cộng sự, 2015" (bài là nghiên cứu gốc, phần Giới thiệu tổng hợp các nghiên cứu trước). Giải quyết sau lượt 2 (Claude Opus 5.5, 16/11/2026): lượt 2 sai. Đã mở tóm tắt bài lượt 2 dẫn: tác giả là Knol, Huys, Sarrazin & Jirsa (2015), không phải Todorović & Jovanović; "The illusion magnitude ranged from zero to (exceptionally) 10% of the target size", "In 33% of the factor combinations there was no illusion effect". Mruczek 2015 (toàn văn) vẫn viết "around 10–20%" theo các nghiên cứu cũ và đo được khoảng 20% với hình tĩnh kinh điển. chỗ khó: hai nguồn tốt khác nhau về độ lớn (khác cấu hình). Câu mới nêu cả hai, ưu tiên khảo sát có hệ thống; viết khác cau_dung: review xem. review: sửa một chi tiết (Claude Opus 5.5, 17/11/2026). Đã mở toàn văn Knol 2015 (Europe PMC, PMC4631937): "three control conditions (isolated targets) … 3 × 3 × 3 + 3 factorial design"; "no significant illusion effect in 33% of the 27 applied parameter combinations". Ba điều kiện thêm là đối chứng (vòng trung tâm đứng một mình), không phải cấu hình của hình, nên "30 cấu hình" sai: sửa thành 27 (trên trang và cau). Phần còn lại khớp: "ranged from zero to (exceptionally) 10%", một phần ba cấu hình không có ảo giác; Mruczek 2015 (toàn văn PMC4332331): "Based on previous reports, the classic Ebbinghaus illusion may cause a target circle to appear around 10–20% larger (or smaller)". Câu nêu cả hai nguồn, không mạnh hơn cau_dung của lượt 2: đạt.'
- trang: trai-nghiem/stroop
  id: n11
  cau: "Các cách giải thích: tốc độ xử lý (đọc nhanh hơn gọi tên màu), tính tự động (đọc đã thành tự động), và mô hình mạng nơ-ron coi đọc và gọi tên màu là hai con đường cạnh tranh, chú ý tăng sức cho con đường đúng; các cách không loại trừ nhau, tranh luận về chi tiết vẫn tiếp tục."
  loai: dinh-nghia
  nguon:
    - ten: "MacLeod (1991), Psychol Bull 109(2), 163–203: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1037/0033-2909.109.2.163
  ket_qua_luot_1: dung
  ghi_chu: Trang không nói thuyết nào đúng; MacLeod thấy hai thuyết chính "chưa đủ" và nghiêng về thuyết xử lý song song (gồm mô hình mạng). Khớp "tranh luận về chi tiết vẫn tiếp tục".
