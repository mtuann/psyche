- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n1
  cau: Ảo giác Müller-Lyer và vòng tròn Ebbinghaus, các cách lý giải cơ chế, và phát hiện rằng người phương Tây dễ bị ảo giác Müller-Lyer hơn nhiều nền văn hóa khác (mô tả của trang).
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n2
  cau: Đoạn A `>-------<` và đoạn B `<------->` dài bằng nhau, nhưng đoạn A (cánh xòe ra ngoài) trông dài hơn.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n3
  cau: Đồng xu giữa vòng đồng xu to trông nhỏ hơn đồng xu giống hệt giữa vòng đồng xu nhỏ, dù chúng bằng nhau (ví dụ minh họa vòng tròn Ebbinghaus).
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n4
  cau: Bạn "thấy sai" dù mắt hoàn toàn khỏe (người có thị lực bình thường vẫn bị ảo giác hình học).
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n5
  cau: Ngay cả khi đã đo bằng thước và biết chắc hai đoạn bằng nhau, nhìn lại ta thường vẫn thấy chúng khác nhau; kiến thức thường không "sửa" ngay được cảm giác.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n6
  cau: 'Thị giác là quá trình dựng lại: não dùng kinh nghiệm và ngữ cảnh để đoán xem ngoài kia có gì; các "mẹo" này đúng trong hầu hết đời sống nhưng với một số hình thiết kế đặc biệt thì đoán sai một cách có hệ thống.'
  loai: dinh-nghia
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n7
  cau: Ảo giác Müller-Lyer được mô tả năm 1889.
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n8
  cau: Müller-Lyer là hai đoạn thẳng bằng nhau, một đoạn có hai "cánh" xòe ra ngoài ở hai đầu, đoạn kia có hai "cánh" khép vào; đoạn có cánh xòe ra trông dài hơn.
  loai: dinh-nghia
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n9
  cau: Vòng tròn Ebbinghaus còn gọi là vòng tròn Titchener; vòng tròn giữa các vòng tròn to trông nhỏ hơn vòng tròn y hệt giữa các vòng tròn nhỏ.
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n10
  cau: Ảo giác Ebbinghaus cho thấy ngữ cảnh bóp méo cảm nhận kích thước.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n11
  cau: Marshall Segall, Donald Campbell và Melville Herskovits so sánh mức độ bị ảo giác hình học ở nhiều xã hội khác nhau.
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n12
  cau: Dữ liệu được công bố trên Science năm 1963 (15 xã hội) và trong sách The Influence of Culture on Visual Perception (1966).
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n13
  cau: Người ở các xã hội ấy được đo mức độ bị ảo giác Müller-Lyer và một số ảo giác khác.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n14
  cau: Người Mỹ (sinh viên đại học) và nhóm người gốc châu Âu ở Johannesburg dễ bị ảo giác Müller-Lyer nhất.
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n15
  cau: Một số cộng đồng săn bắn hái lượm (như người San ở vùng Kalahari) gần như không bị ảo giác Müller-Lyer, hoặc bị rất nhẹ.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n16
  cau: "Với ảo giác đường ngang–dọc, chiều khác biệt đảo ngược: nhiều nhóm phi phương Tây bị lừa nhiều hơn người phương Tây."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n17
  cau: Thứ mà sách giáo khoa phương Tây trình bày như một "đặc điểm chung của mắt người" hóa ra mang dấu ấn của môi trường sống.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n18
  cau: 'Giả thuyết "thế giới thợ mộc" (carpentered world): người sống trong môi trường nhiều góc vuông có thể hình thành thói quen thị giác thích nghi với góc vuông; thói quen ấy với hình Müller-Lyer cho đáp án sai; người sống ở môi trường ít góc vuông ít bị lừa hơn.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n19
  cau: Henrich, Heine và Norenzayan (2010) dùng phát hiện của Segall và cộng sự làm ví dụ cho thấy tâm lý học không thể chỉ nghiên cứu sinh viên phương Tây rồi kết luận về "con người nói chung".
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n20
  cau: "Vững chắc: các ảo giác hình học tồn tại và đo được một cách ổn định."
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n21
  cau: "Khá vững: mức độ bị ảo giác khác nhau rõ rệt giữa các nền văn hóa."
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n22
  cau: Nghiên cứu của Segall và cộng sự trên 15 xã hội cho thấy khác biệt lớn và có hệ thống; việc người phương Tây ở nhóm dễ bị ảo giác Müller-Lyer nhất là phát hiện được trích dẫn, thảo luận rộng rãi.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n23
  cau: Dữ liệu nổi tiếng nhất đã cũ, và cả mức độ lẫn cách lý giải khác biệt này vẫn còn bị tranh cãi (van der Kamp và cộng sự, 2013).
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n24
  cau: "Đang tranh cãi: vì sao ảo giác xảy ra."
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n25
  cau: 'Có nhiều cách giải thích cạnh tranh nhau: não áp dụng nhầm "mẹo" chiều sâu (thuyết của Gregory), não xác định sai vị trí điểm cuối của đoạn thẳng do bị các "vây" kéo đi, hay sự tương phản kích thước với vật xung quanh.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n26
  cau: "Ba cách giải thích thường được nêu: hai cho Müller-Lyer (nhầm hằng số kích thước của Gregory; lệch điểm cuối) và một cho Ebbinghaus (tương phản và khung tham chiếu); chưa cách nào được coi là chắc chắn."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n27
  cau: 'Gregory: não diễn giải hai kiểu "vây" như hai kiểu góc ở những khoảng cách khác nhau, rồi hiệu chỉnh kích thước theo khoảng cách tưởng tượng; một số nhà nghiên cứu (Howe và Purves) không đồng ý.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n28
  cau: 'Lệch điểm cuối: các vây kéo vị trí cảm nhận của điểm cuối đoạn thẳng ra ngoài hoặc vào trong, nên đoạn thẳng bị "đo" sai ngay từ khâu định vị.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n29
  cau: Với vòng tròn Ebbinghaus, não đánh giá kích thước một cách tương đối — "nhỏ hơn những thứ xung quanh" — chứ không đo tuyệt đối (tương phản, khung tham chiếu).
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n30
  cau: "Điểm chung của cách giải thích thứ nhất và giả thuyết văn hóa: thị giác dùng ngữ cảnh và kinh nghiệm để suy luận về thế giới, và suy luận thì có thể sai."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n31
  cau: '"Mắt thấy" không phải bằng chứng cuối cùng: cảm nhận kích thước có thể bị ngữ cảnh bóp méo, và đo đạc, kiểm chứng độc lập đáng tin hơn cảm giác chắc chắn.'
  loai: loi-khuyen
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n32
  cau: Hiểu biết về ảo giác được dùng trong thiết kế giao thông (vạch kẻ đường tạo cảm giác đi nhanh), kiến trúc và thời trang.
  loai: loi-khuyen
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n33
  cau: Cho trẻ tự đo ảo giác Müller-Lyer bằng thước là một cách đơn giản để minh họa rằng cảm thấy chắc chắn khác với đúng.
  loai: loi-khuyen
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n34
  cau: Các ảo giác trong bài được đo với hình vẽ đơn giản trong phòng thí nghiệm.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n35
  cau: Ngoài đời, ta có thêm nhiều manh mối khác (chuyển động, hai mắt…); bài này không đo xem chúng làm mức bị ảo giác thay đổi ra sao. Ảo giác cho thấy thị giác có thể sai, không có nghĩa ta luôn nhìn sai.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n36
  cau: Theo giả thuyết "thế giới thợ mộc", người Việt sống ở đô thị (nhà hộp, chung cư, đường kẻ vạch) được dự đoán dễ bị ảo giác Müller-Lyer tương tự người phương Tây, còn người sống ở môi trường ít góc vuông hơn có thể ít bị hơn; đây mới là suy luận, chưa phải kết quả đo trên người Việt.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n37
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào đo các ảo giác này ở Việt Nam.
  loai: thoi-su
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n38
  cau: Phần lớn những gì ta "biết" về thị giác con người đến từ người phương Tây; số liệu nghiên cứu gốc có thể không đại diện cho mọi người.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n40
  cau: 'Ngộ nhận: "Mắt thấy tai nghe là chắc chắn nhất." Ảo giác cho thấy cảm nhận trực tiếp có thể sai một cách có hệ thống, ngay cả khi ta đã biết sự thật.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n41
  cau: 'Đã bị bác bỏ: "Người nào cũng bị ảo giác như nhau, vì mắt ai cũng giống nhau."'
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n42
  cau: 'Ngộ nhận: "Biết đó là ảo giác thì sẽ hết thấy sai." Thường là không: có thể đo bằng thước nhiều lần rồi nhìn lại vẫn thấy hai đoạn khác nhau; biết trước thường không tắt ngay được cảm giác ấy.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n43
  cau: "Quiz 1: điểm kỳ lạ nhất của ảo giác thị giác là biết chắc đáp án đúng rồi mà nhìn vào thường vẫn thấy sai; cảm giác sai thường vẫn còn sau khi đo; ảo giác này từng được nêu làm ví dụ cho kiểu xử lý ít chịu ảnh hưởng của niềm tin."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n44
  cau: "Quiz 2: nghiên cứu của Segall, Campbell và Herskovits phát hiện người Mỹ và người gốc châu Âu dễ bị lừa nhất; một số cộng đồng săn bắn hái lượm gần như không bị lừa; thứ tự đảo ngược giữa các loại ảo giác; 15 xã hội được đo trong nghiên cứu năm 1963."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n45
  cau: 'Quiz 3: giả thuyết "thế giới thợ mộc" cho rằng người sống trong môi trường nhiều góc vuông học được cách diễn giải hình 2D thành góc 3D, và "mẹo" này gây ra ảo giác với hình vẽ phẳng; não áp dụng kinh nghiệm về góc nhà, khung cửa vào cả những hình vẽ không liên quan.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n46
  cau: "Quiz 4: hiện tượng ảo giác thì vững (đo được, lặp lại được), nhưng vì sao nó xảy ra vẫn là câu hỏi mở (ba cách giải thích: mẹo chiều sâu, lệch điểm cuối, tương phản)."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n47
  cau: "Quiz 5: một lần tự đo trên công cụ không đủ để so sánh với nghiên cứu có kiểm soát; số liệu gốc chủ yếu từ người phương Tây."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n49
  cau: "Nguồn: Segall, Campbell & Herskovits (1963), Science, 139(3556), 769–771; (1966) The influence of culture on visual perception, Bobbs-Merrill; Henrich, Heine & Norenzayan (2010), Behav Brain Sci 33(2–3), 61–83; van der Kamp, Withagen & de Wit (2013), Atten Percept Psychophys 75(5), 1027–1038 (thông tin sách báo)."
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n1
  cau: Mù không chú ý được nêu trong Simons và Chabris (1999) và mù thay đổi trong Simons và Levin (1998).
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n2
  cau: "Video bóng rổ: hai đội chuyền bóng nhanh, một đội áo trắng, một đội áo đen; nhiệm vụ đếm số lần chuyền của đội áo trắng."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n3
  cau: Trong video, người mặc đồ khỉ đột đi giữa sân, dừng lại, đấm ngực rồi đi ra.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n4
  cau: Khỉ đột ở trên màn hình nhiều giây liền, ngay giữa khung hình.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n5
  cau: Hầu hết mọi người đều tin chắc "làm sao mà không thấy được một con khỉ đột".
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n6
  cau: Khoảng một nửa số người xem không thấy con khỉ đột (46% trong thí nghiệm chính; 50% ở bản đấm ngực), dù con khỉ đột đi ngay giữa màn hình suốt nhiều giây.
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n7
  cau: Khi được hỏi trước, đa số người tin chắc rằng mình sẽ thấy (xem khảo sát ở mục Mức độ chắc chắn).
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n8
  cau: "Sự chú ý giống đèn pin hơn camera an ninh: một chùm sáng hẹp soi rõ một vùng nhỏ, những gì ngoài chùm sáng có thể đi qua mà ta không hay biết."
  loai: dinh-nghia
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n9
  cau: Mù không chú ý (inattentional blindness) là không thấy một vật hoàn toàn nhìn thấy được, chỉ vì chú ý đang bận ở chỗ khác.
  loai: dinh-nghia
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n10
  cau: 'Mù không chú ý khác với "không nhìn": vật lạ đi qua ngay vùng bạn đang nhìn, nhưng bạn không nhận ra nó vì chú ý đang dồn cho việc đếm bóng.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n11
  cau: "Simons và Chabris dựng lại một ý tưởng cũ của Ulric Neisser bằng video hiện đại: hai đội chuyền bóng rổ, người xem đếm số lần chuyền của một đội, giữa video có người mặc đồ khỉ đột đi ngang."
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n12
  cau: Trong thí nghiệm nổi tiếng nhất về mù không chú ý, khoảng một nửa số người xem mải đếm đường chuyền bóng không thấy người mặc đồ khỉ đột đi ngang qua.
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n14
  cau: Mù thay đổi (change blindness) là không nhận ra một thay đổi lớn, vì ta không lưu chi tiết của cảnh vật như tưởng.
  loai: dinh-nghia
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n15
  cau: "Simons và Levin làm thí nghiệm ngoài đời thật: một người của nhóm nghiên cứu chặn người đi đường ở sân trường Cornell để hỏi đường; đang nói chuyện, hai người khiêng một cánh cửa gỗ đi ngang che khuất tầm nhìn khoảng một giây."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n16
  cau: Trong lúc đó, người hỏi đường lẩn ra sau cánh cửa và một trong hai người khiêng cửa ở lại, tiếp tục hỏi đường như không có gì xảy ra.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n17
  cau: Hai người đàn ông mặc đồ khác nhau, cao chênh nhau khoảng 5 cm, giọng nói khác nhau.
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n18
  cau: Khoảng một nửa số người được hỏi (8 trên 15 người) không nhận ra mình đang nói chuyện với một người hoàn toàn khác.
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n19
  cau: Trong biến thể sau, hai người đàn ông hóa trang thành công nhân xây dựng và chỉ chặn các sinh viên trẻ — nhóm trước đó luôn phát hiện ra sự tráo đổi; lần này chỉ 4 trên 12 người nhận ra.
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n20
  cau: 'Giả thuyết của các tác giả: ta mã hóa chi tiết của những người ta coi là "cùng nhóm" với mình, còn với người ta xếp vào loại "người lạ chung chung", não chỉ ghi lại một cái nhãn.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n21
  cau: Mù thay đổi là không nhận ra một thay đổi lớn, vì não không lưu chi tiết của cảnh vật như ta tưởng (câu cuối mục).
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n22
  cau: "Vững chắc: chú ý tập trung vào một việc có thể khiến ta bỏ lỡ vật hiển nhiên khác."
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n23
  cau: 'Khá vững: ta đánh giá quá cao khả năng "thấy hết" của mình.'
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n24
  cau: Trong khảo sát đại diện dân số Mỹ (làm tháng 6/2009, công bố 2011), 78% người đồng ý rằng người ta thường nhận ra vật bất ngờ xuất hiện trong tầm nhìn, ngay cả khi đang chú ý vào việc khác.
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n25
  cau: Trong thí nghiệm, kết quả cho thấy điều ngược lại với niềm tin của 78% người Mỹ.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n26
  cau: Niềm tin phổ biến này đi ngược với bằng chứng từ các thí nghiệm mù không chú ý, và có thể khiến ta chủ quan.
  loai: loi-khuyen
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n27
  cau: "Khá vững: mù thay đổi với người thật ngoài đời."
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n28
  cau: Thí nghiệm cánh cửa có mẫu nhỏ (15 người đi đường trong thí nghiệm đầu).
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n29
  cau: Kết quả cánh cửa phù hợp với nhiều nghiên cứu mù thay đổi trong phòng thí nghiệm.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n30
  cau: 'Ba cách giải thích thường được nêu: chú ý là tài nguyên có hạn; ta thấy những gì ta chờ đợi; cảm giác "thấy hết" có thể là ảo giác.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n31
  cau: 'Chú ý là tài nguyên có hạn: việc đếm bóng chiếm gần hết "băng thông", nên con khỉ đột bị xử lý ở mức sơ sài.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n32
  cau: Cảm giác "thấy hết" có thể vượt xa lượng chi tiết thật sự được lưu lại; thí nghiệm cánh cửa cho thấy ta có thể không nhận ra người đối diện bị đổi.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n33
  cau: Vừa lái xe vừa nói chuyện điện thoại làm phản ứng phanh chậm hơn và gặp nhiều tai nạn mô phỏng hơn, cả điện thoại cầm tay và rảnh tay.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n34
  cau: Mức suy giảm khi lái xe nói chuyện điện thoại có thể nghiêm trọng như khi lái xe say ở nồng độ cồn 0,08% (ngưỡng giới hạn theo luật ở Mỹ).
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n35
  cau: Cả điện thoại cầm tay và rảnh tay đều gây suy giảm như nhau (trong mô phỏng).
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n36
  cau: "Khá vững: đang lái xe thì đừng nghe điện thoại, kể cả rảnh tay."
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n37
  cau: "Một quy tắc đơn giản phù hợp với bằng chứng này: đang lái xe thì đừng nghe điện thoại, kể cả rảnh tay."
  loai: loi-khuyen
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n38
  cau: Trong nhà máy, công trường hay phòng mổ, giao một người vừa làm việc chính vừa "để mắt" thêm một việc là sự đảm bảo hão; quy trình an toàn tốt tách vai trò quan sát khỏi thao tác.
  loai: loi-khuyen
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n39
  cau: Khi kiểm tra bài thi, soát hợp đồng, tìm chìa khóa lúc vội, khả năng "nhìn mà không thấy" là rất thật; làm một việc một lúc, kiểm tra hai lượt độc lập cách nhau một quãng nghỉ.
  loai: loi-khuyen
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n40
  cau: Các thí nghiệm dùng tình huống được dàn dựng; các thí nghiệm này không cho biết điều gì xảy ra khi vật lạ thật sự nguy hiểm; mù không chú ý không có nghĩa ta mù hoàn toàn, mà có nghĩa chú ý có thể hẹp hơn ta tưởng.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n41
  cau: Các thí nghiệm gốc đều làm ở Mỹ, với người Mỹ; tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu mù không chú ý hay mù thay đổi nào thực hiện với người Việt.
  loai: thoi-su
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n42
  cau: Chưa có bằng chứng nào cho thấy một nền văn hóa miễn nhiễm với mù không chú ý (các thí nghiệm gốc đều ở Mỹ).
  loai: thoi-su
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n43
  cau: 'Đã bị bác bỏ: "Mắt tôi vẫn nhìn đường nên vừa lái xe vừa nghe điện thoại không sao." (ngộ nhận).'
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n44
  cau: Với đa số người, làm hai việc đòi hỏi chú ý cùng lúc thì kém hơn làm riêng từng việc.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n45
  cau: 'Ngộ nhận: "Nếu có chuyện lạ xảy ra ngay trước mắt, chắc chắn tôi sẽ thấy." 78% người Mỹ tin như vậy, và khoảng một nửa số người trong thí nghiệm con khỉ đột đã cho thấy điều ngược lại với chính mình.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n46
  cau: "Quiz 1: người xem không thấy khỉ đột vì chú ý dồn vào việc đếm bóng, không còn đủ để đăng ký vật lạ; khỉ đột đi qua ngay vùng đang nhìn; đây là định nghĩa của mù không chú ý."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n47
  cau: "Quiz 2: thí nghiệm cánh cửa cho thấy ngay cả khi nhìn thẳng và nói chuyện với một người, ta vẫn có thể không nhận ra người đó bị đổi thành người khác; thí nghiệm khỉ đột dùng vật xuất hiện bất ngờ; đây là mù thay đổi."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n48
  cau: "Quiz 3: 78% người Mỹ đồng ý (khảo sát Simons & Chabris 2011); niềm tin này có thể khiến ta chủ quan, tin rằng sẽ tự động thấy nguy hiểm nên vừa lái xe vừa làm việc khác."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n49
  cau: "Quiz 4: theo Strayer, Drews và Crouch (2006), điện thoại rảnh tay cũng gây suy giảm như cầm tay, và mức suy giảm có thể nghiêm trọng như lái xe khi say ở nồng độ cồn 0,08%."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n50
  cau: 'Quiz 5: tình huống tìm chìa khóa lúc vội rồi tìm lại thì thấy ngay: có thể là một dạng "nhìn mà không thấy", nhưng chỉ là một cách giải thích có thể; chưa thể kết luận.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nhin-ma-khong-thay
  id: n52
  cau: "Mục Nguồn: Simons & Chabris (1999), Perception 28(9), 1059–1074; Simons & Levin (1998), Psychon Bull Rev 5(4), 644–649; Simons & Chabris (2011), PLoS ONE 6(8), e22757; Strayer, Drews & Crouch (2006), Hum Factors 48(2), 381–391; Watson & Strayer (2010), Psychon Bull Rev 17(4), 479–485 (thông tin sách báo)."
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n1
  cau: 'Hiệu ứng bữa tiệc cocktail: khả năng theo dõi một giọng nói giữa đám đông ồn ào nhưng vẫn "bắt" được tên mình từ phía bị bỏ qua; từ nhiệm vụ nghe hai tai của Cherry (1953) và Moray (1959) đến cuộc tranh luận bộ lọc sớm/muộn của Broadbent và Treisman.'
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n2
  cau: Nhiều người từng gặp chuyện nghe thấy tên mình từ xa giữa nơi ồn ào; tuy vậy không phải ai cũng nhận ra tên mình trong thí nghiệm.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n3
  cau: Trong một thí nghiệm kinh điển, người tham gia đeo tai nghe, đọc đuổi một thông điệp ở tai này, còn ở tai kia (bị yêu cầu bỏ qua) người ta chèn tên của chính người tham gia.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n4
  cau: "Đáp án: chỉ khoảng một phần ba nhận ra tên mình: 34,6% trong lần làm lại của Wood và Cowan (1995), gần với 33% mà Conway và cộng sự (2001) thuật lại cho Moray (1959); đa số còn lại không biết tên mình vừa được nhắc."
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n5
  cau: 'Bộ lọc chú ý mạnh (khoảng hai phần ba số người không nhận ra tên mình) nhưng không tuyệt đối: những tín hiệu "quan trọng với mình" như tên riêng vẫn có thể lọt qua.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n6
  cau: "Hiệu ứng bữa tiệc cocktail (cocktail party effect): khả năng theo dõi một dòng âm thanh mình quan tâm giữa nhiều âm thanh cạnh tranh, đồng thời vẫn bắt được những tín hiệu đặc biệt quan trọng, điển hình là tên mình, từ phần âm thanh đang bị bỏ qua."
  loai: dinh-nghia
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n7
  cau: "Chú ý hoạt động như một bộ lọc có chọn lọc: giữ lại một luồng, gạt bớt phần còn lại, nhưng không gạt sạch hoàn toàn."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n8
  cau: Colin Cherry đưa hiện tượng vào phòng thí nghiệm và gọi nó là "bài toán bữa tiệc cocktail" (cocktail party problem).
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n9
  cau: "Nhiệm vụ đọc đuổi (shadowing): lặp lại ngay lập tức, từng chữ, thông điệp phát vào một tai, trong khi tai kia phát một thông điệp khác cần bỏ qua."
  loai: dinh-nghia
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n10
  cau: Người tham gia đọc đuổi rất tốt thông điệp ở tai được chú ý.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n11
  cau: Khi được hỏi về tai bị bỏ qua, họ gần như không biết gì về nội dung của nó.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n12
  cau: "Họ nhận ra những thay đổi vật lý rõ rệt: giọng đọc đổi từ nam sang nữ gần như luôn được nhận ra."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n13
  cau: Khi tiếng nói ở tai bị bỏ qua bị thay bằng một tiếng "bíp" đều đều (âm 400 Hz), người nghe luôn nhận ra.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n14
  cau: Khi tiếng nói bị phát ngược (nghe vẫn giống tiếng người nhưng vô nghĩa), phần lớn người nghe không nhận ra.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n15
  cau: Khi hai thông điệp do cùng một người đọc được trộn lẫn rồi phát vào cả hai tai, người nghe phải nghe đi nghe lại rất vất vả, nhưng vẫn tách được hai luồng nhờ ý nghĩa và ngữ pháp của câu.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n16
  cau: Chỉ khi Cherry ghép hai bài toàn sáo ngữ (câu cửa miệng) thì người nghe mới không tách được.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n17
  cau: Khi mỗi tai nhận một thông điệp riêng (do cùng một người đọc), việc tách luồng trở nên dễ dàng.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n18
  cau: "Cherry kết luận: ở tai bị bỏ qua, người nghe chỉ nhận ra vài đặc điểm thô của âm thanh, còn ngôn ngữ, từ ngữ và ý nghĩa thì gần như bị bỏ lọt."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n19
  cau: Broadbent (1958) về sau dựa vào kết quả này để cho rằng sự chú ý chọn luồng chủ yếu theo đặc điểm vật lý.
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n20
  cau: Neville Moray dùng nhiệm vụ đọc đuổi của Cherry để kiểm tra xem "hàng rào" chú ý có kín không; ông làm ba thí nghiệm, và kết quả của thí nghiệm thứ hai trở nên nổi tiếng.
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n21
  cau: "Thiết kế Moray (Thí nghiệm II): 12 người tham gia đọc đuổi 10 đoạn văn ngắn ở một tai; ở tai bị bỏ qua phát các chỉ dẫn, trong một nửa số chỉ dẫn câu mở đầu bằng tên của chính người tham gia."
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n22
  cau: "Những chỉ dẫn có gắn tên riêng được nghe thấy nhiều hơn hẳn chỉ dẫn không có tên: 20 trên 39 chỉ dẫn có tên được nghe, so với 4 trên 36 chỉ dẫn không tên."
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n23
  cau: Các nghiên cứu sau thuật lại kết quả của Moray là khoảng một phần ba số người nghe thấy tên mình.
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n24
  cau: Ở Thí nghiệm III, Moray dặn riêng một nhóm cố nhớ các con số ở tai bị bỏ qua, nhưng họ không nhớ được nhiều hơn nhóm không được dặn.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n25
  cau: 'Kết luận của Moray: kích thích duy nhất cho đến lúc đó được thấy xuyên qua hàng rào chú ý là tên của chính người tham gia; có lẽ chỉ những thứ "quan trọng" với người nghe mới làm được điều đó.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n26
  cau: Khi người tham gia được báo từ đầu rằng sẽ có chỉ dẫn đổi tai, họ nghe thấy chỉ dẫn nhiều hơn một chút (0,80 so với 0,33 lần mỗi người), nhưng chênh lệch chưa đạt mức có ý nghĩa thống kê 5%.
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n27
  cau: "Treisman (1960): hai đoạn văn đổi tai giữa chừng mà người tham gia không hay biết; thỉnh thoảng, đúng chỗ đổi tai, họ lỡ lặp lại một hai từ của tai kia nhưng không bao giờ theo sang tai kia lâu hơn thế; câu càng dễ đoán, lỗi này càng hay xảy ra."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n28
  cau: Nếu kênh bị bỏ qua bị chặn hoàn toàn trước khi xử lý ý nghĩa thì việc lỡ lặp từ ở tai kia không thể xảy ra; não phải "hiểu" được phần tiếp nối hợp lý của câu mới lỡ đuổi theo.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n29
  cau: "Wood và Cowan (1995) làm lại thí nghiệm của Moray sau 36 năm với thiết bị hiện đại hơn và mẫu lớn hơn (34 sinh viên); kết quả gần như trùng khớp: 34,6% cho biết nghe thấy tên mình ở tai bị bỏ qua."
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n30
  cau: "Những người nghe thấy tên mình cũng mắc nhiều lỗi đọc đuổi hơn ngay quanh thời điểm tên xuất hiện: chú ý của họ nhảy sang tai bị bỏ qua trong chốc lát, trượt mất vài chữ ở tai đang đọc đuổi."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n31
  cau: Conway, Cowan và Bunting (2001) đo dung lượng trí nhớ làm việc bằng bài operation span rồi cho làm nhiệm vụ đọc đuổi kèm tên riêng ở tai bị bỏ qua.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n32
  cau: Những người có dung lượng trí nhớ làm việc thấp hơn lại dễ nghe thấy tên mình hơn (65% so với 20%).
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n33
  cau: Trí nhớ làm việc phản ánh khả năng kiểm soát chú ý (gạt bỏ thông tin gây nhiễu); người kiểm soát kém hơn có hàng rào lỏng lẻo hơn nên tín hiệu từ kênh bị bỏ qua dễ lọt vào hơn.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n34
  cau: "Khá vững: ta có thể theo dõi một luồng âm thanh giữa nhiều nguồn ồn, và tín hiệu gắn với bản thân có thể lọt qua bộ lọc."
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n35
  cau: "Khá vững: trong điều kiện lab nghiêm ngặt, chỉ khoảng 1/3 số người nhận ra tên mình."
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n36
  cau: Một lần làm lại có đăng ký trước năm 2021 ra 29%; số lần làm lại trực tiếp còn ít, nên tỉ lệ chính xác có thể dao động theo cách đo và mẫu.
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n37
  cau: 'Khá vững: khả năng kiểm soát chú ý càng kém, càng dễ bị "bắt" bởi tên mình.'
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n38
  cau: "Röer và Cowan (2021): lần làm lại có đăng ký trước, đo trí nhớ làm việc bằng hai bài khác nhau (operation span và running span), thấy người span thấp dễ nhận ra tên mình hơn người span cao."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n38b
  cau: 'Đang tranh cãi: thông tin bị bỏ qua bị "chặn" ở khâu nào của quá trình xử lý.'
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n39
  cau: Broadbent (1958) cho rằng bộ lọc chặn ngay từ đầu, dựa trên đặc điểm vật lý, trước khi não xử lý ý nghĩa.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n40
  cau: 'Treisman (1964) phản biện bằng mô hình "suy giảm": thông tin bị bỏ qua chỉ bị làm yếu chứ không bị chặn hẳn, và những từ quan trọng (như tên mình) có "ngưỡng" thấp nên vẫn lọt qua.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n41
  cau: "Deutsch và Deutsch (1963): mọi thông tin đều được xử lý ý nghĩa đầy đủ, việc chọn lọc chỉ xảy ra ở khâu cuối (chọn lọc muộn)."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n42
  cau: Lavie (1995) đề xuất rằng chọn lọc sớm hay muộn có thể tùy vào gánh nặng tri giác của nhiệm vụ; đề xuất này cũng còn được bàn cãi.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n43
  cau: "Đã bị bác bỏ: ý tưởng ta nhớ được mọi thứ lọt vào tai."
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n44
  cau: "Danh sách từ lặp 35 lần ở tai bị bỏ qua không để lại dấu vết: bài nhận diện cho 1,9 trên 7 từ so với 2,6 trên 7 từ mới."
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n45
  cau: 'Bộ lọc sớm của Broadbent (1958), trong cuốn Perception and Communication: mọi thông tin giác quan đi qua một "cổ chai"; bộ lọc chọn một luồng dựa trên đặc điểm vật lý và chặn phần còn lại trước khi phân tích ý nghĩa; giải thích tốt Cherry nhưng không giải thích được tên riêng lọt qua.'
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n46
  cau: "Mô hình suy giảm của Treisman (1964): luồng bị bỏ qua chỉ bị vặn nhỏ, mỗi từ có một ngưỡng kích hoạt riêng; từ quan trọng (tên mình, từ gây sốc, từ liên quan nhu cầu hiện tại) có ngưỡng thấp; mô hình dung hòa được Cherry lẫn Moray."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n47
  cau: 'Chọn lọc muộn của Deutsch và Deutsch (1963): mọi kích thích đều được phân tích đầy đủ đến mức ý nghĩa; theo đó việc "nghe" tên mình không có gì đặc biệt.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n48
  cau: Hầu hết nhà nghiên cứu ngày nay cho rằng cả chọn lọc sớm lẫn muộn đều có vai trò (câu cuối mục lý thuyết, đã thay bằng Lavie 1995).
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n49
  cau: "Khá vững: giảm sự cạnh tranh ở tầng vật lý giúp tập trung trong môi trường ồn (lời khuyên mục áp dụng 1)."
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n50
  cau: "Khá vững: gọi tên một người cụ thể có thể dễ thu hút chú ý của người ấy hơn (lời khuyên mục áp dụng 2)."
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n51
  cau: Tín hiệu cảnh báo gắn với cá nhân ("Anh Ba, phía sau!") dễ được nghe thấy hơn tín hiệu chung chung; các hệ thống cảnh báo an toàn áp dụng nguyên tắc này.
  loai: loi-khuyen
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n52
  cau: Wood và Cowan (1995) thấy người nghe thấy tên mình mắc thêm lỗi ở nhiệm vụ chính ngay sau đó, tức là chú ý có vẻ đã "nhảy" sang kênh bị bỏ qua trong chốc lát; đó là một nhiệm vụ nghe trong phòng thí nghiệm, bài này không đo lái xe hay họp hành.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n53
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra hiệu ứng bữa tiệc cocktail trên người Việt; các nghiên cứu gốc (Cherry, Moray, Wood và Cowan, Conway và cộng sự) đều thực hiện với người nói tiếng Anh.
  loai: thoi-su
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n54
  cau: "Tiếng Việt là ngôn ngữ thanh điệu: cùng một âm tiết, thanh điệu khác nhau thì nghĩa khác nhau."
  loai: dinh-nghia
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n55
  cau: "Liệu thanh điệu giúp người Việt tách các luồng giọng nói dễ hơn, hay khiến việc theo dõi một luồng tốn nhiều tài nguyên chú ý hơn: chưa có dữ liệu; mọi câu trả lời hiện tại là suy đoán."
  loai: thoi-su
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n56
  cau: 'Liệu độ dài và cấu trúc của tên riêng (tên người Việt gồm họ, tên đệm và tên) có ảnh hưởng đến khả năng "xuyên qua" bộ lọc hay không: chưa có dữ liệu.'
  loai: thoi-su
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n57
  cau: 'Ngộ nhận: "Mọi thứ lọt vào tai đều được ghi nhớ, chỉ là ta không nhớ ra thôi." (Đã bị bác bỏ): nội dung kênh bị bỏ qua gần như không để lại dấu vết; dù danh sách từ lặp 35 lần, bài kiểm tra nhận diện sau đó không phát hiện được gì.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n58
  cau: 'Ngộ nhận: "Ai cũng sẽ nghe thấy tên mình được nhắc đến." Trong điều kiện phòng lab nghiêm ngặt, chỉ khoảng 1/3 số người nhận ra tên mình ở kênh bị bỏ qua (Wood và Cowan, 1995; Röer và Cowan, 2021); cảm giác "chắc chắn mình sẽ nghe thấy" cũng là một dạng đánh giá quá cao khả năng của bản thân.'
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n59
  cau: 'Ngộ nhận: "Càng cố tập trung thì càng không bị phân tâm bởi tên mình." Chưa hẳn: Conway và cộng sự (2001) cho thấy người có khả năng kiểm soát chú ý (trí nhớ làm việc) thấp hơn lại dễ bị tên mình "bắt" hơn; khác biệt này thấy ở mức nhóm người, chưa rõ cố gắng thêm trong một buổi có thay đổi được kết quả không.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n60
  cau: 'Quiz 1: trong nhiệm vụ đọc đuổi của Cherry (1953), người tham gia nhận ra từ tai bị bỏ qua chỉ những thay đổi vật lý (giọng nam đổi giọng nữ, tiếng nói đổi thành một tiếng "bíp"), còn nội dung thì gần như không biết gì.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n61
  cau: "Quiz 2: trong lần làm lại của Wood và Cowan (1995), khoảng một phần ba (34,6%) người tham gia nhớ đã nghe thấy tên mình; Conway (2001) thuật lại 33% cho Moray; lần làm lại có đăng ký trước năm 2021 ra 29%."
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n62
  cau: "Quiz 3: theo kết luận của Moray (1959), kích thích duy nhất được thấy xuyên qua hàng rào chú ý là tên của chính người tham gia; dù được lặp hay dặn riêng phải nhớ, các kích thích trung tính vẫn không xuyên qua được."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n63
  cau: 'Quiz 4: thí nghiệm "nhảy tai" của Treisman (1960): đôi khi người tham gia lỡ lặp lại một hai từ của tai kia, đúng phần nối tiếp hợp nghĩa; chứng tỏ nội dung kênh bị bỏ qua vẫn được xử lý ở mức nào đó; đòn mạnh vào mô hình lọc sớm nguyên bản.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n64
  cau: "Quiz 5: theo Conway, Cowan và Bunting (2001), người có dung lượng trí nhớ làm việc thấp hơn dễ nghe thấy tên mình ở kênh bị bỏ qua hơn, vì khả năng kiểm soát, gạt bỏ nhiễu của họ kém hơn."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/nghe-chon-loc
  id: n66
  cau: "Mục Nguồn: Broadbent (1958); Cherry (1953), J Acoust Soc Am 25(5), 975–979; Conway, Cowan & Bunting (2001), Psychon Bull Rev 8(2), 331–335; Deutsch & Deutsch (1963), Psychol Rev 70, 80–90; Lavie (1995), JEP:HPP 21(3), 451–468; Moray (1959), QJEP 11(1), 56–60; Röer & Cowan (2021), JEP:LMC 47(2), 234–242; Treisman (1960), QJEP 12(4), 242–248; Treisman (1964), Br Med Bull 20(1), 12–16; Wood & Cowan (1995), JEP:LMC 21(1), 255–260."
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n21
  cau: 'Vững chắc: chuyển đổi nhiệm vụ thường tốn "phí".'
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n22
  cau: "Khá vững: người đa nhiệm truyền thông nặng làm bài kiểm tra chú ý và trí nhớ kém hơn một chút."
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n24
  cau: "Đang tranh cãi: đa nhiệm gây ra suy giảm nhận thức, hay người khó tập trung mới đa nhiệm nhiều?"
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n27
  cau: "Đã bị bác bỏ: đa nhiệm nhiều giúp ta giỏi đa nhiệm, và não làm được hai việc khó cùng lúc."
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n34
  cau: "Đang tranh cãi: điện thoại để đâu khi cần tập trung (sự hiện diện của điện thoại có làm giảm tập trung không)."
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n35
  cau: 'Khá vững: gom thông báo thành từng đợt thay vì "ting" liên tục (lời khuyên mục áp dụng 2).'
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n37
  cau: "Khá vững: tự đo mức đa nhiệm của mình trong một tuần (mục áp dụng 3)."
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n38
  cau: 'Vững chắc: đừng nhầm "bận rộn" với "hiệu quả"; với việc khó, làm tuần tự từng việc thường phù hợp hơn làm song song (mục áp dụng 4).'
  loai: nhan
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n4
  cau: Đa nhiệm truyền thông (media multitasking) là dùng nhiều luồng truyền thông cùng lúc, hẹp hơn "đa nhiệm" nói chung; ví dụ vừa xem TV vừa lướt điện thoại, vừa học vừa nghe nhạc.
  loai: dinh-nghia
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n47
  cau: 'Quiz 1: phát hiện ngược trực giác nhất của Ophir, Nass và Wagner (2009): nhóm đa nhiệm truyền thông nặng, dù "luyện tập" chuyển đổi mỗi ngày, lại làm kém hơn nhóm nhẹ ở bài kiểm tra chuyển đổi nhiệm vụ, vì khó gạt bỏ thông tin gây nhiễu.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n32
  cau: "Giả thuyết thay thế (tự chọn): người khó tập trung, bốc đồng, ham cảm giác mới bị hút vào đa nhiệm nhiều hơn; chính đặc điểm tính cách đó giải thích điểm kiểm tra thấp."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n48
  cau: "Quiz 2: Uncapher và Wagner (2018) thận trọng vì hầu hết là nghiên cứu tương quan, chưa rõ chiều nhân quả."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n33
  cau: "Sanbonmatsu và cộng sự (2013): người đa nhiệm nhiều thường tự đánh giá khả năng đa nhiệm của mình cao hơn thực tế, trong khi khả năng thật của họ kém hơn."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n17
  cau: "Thiết kế: người tham gia làm bài trí nhớ làm việc và chú ý với điện thoại ở một trong ba nơi: trên bàn, trong túi hay cặp, hoặc ở phòng khác (theo mô tả của lần làm lại năm 2022)."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n29
  cau: "Phí chuyển đổi nhiệm vụ: mỗi lần chuyển việc, não cần chuẩn bị và chuyển bộ quy tắc của việc cũ sang việc mới, và việc cũ có thể còn gây nhiễu; điều này làm ta chậm hơn và dễ sai hơn."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n19
  cau: Một lần làm lại có đăng ký trước, dùng các bài và điều kiện của thí nghiệm gốc, không thấy hiệu ứng này (Ruiz Pardo và Minda, 2022).
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n1
  cau: Big Five là khung được dùng rất phổ biến trong nghiên cứu tính cách.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n2
  cau: Điểm số tính cách phân bố liên tục, không thành hai cụm rời; Big Five coi tính cách là các chiều liên tục.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n3
  cau: Tính cách là những khuôn mẫu suy nghĩ, cảm xúc và hành vi tương đối ổn định.
  loai: dinh-nghia
- trang: kham-pha/tinh-cach/big-five
  id: n4
  cau: Một cách đo thường dùng là bảng hỏi tự báo cáo rồi phân tích nhân tố để xem các câu trả lời đi chung với nhau.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n5
  cau: Từ hàng nghìn từ miêu tả, các cụm co lại còn năm, lặp lại qua nhiều thập kỷ, nhiều ngôn ngữ và nhiều cách đo; một số nghiên cứu tìm ra sáu hay không tái lập đúng năm.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n6
  cau: "Allport và Odbert (1936), hai nhà tâm lý học người Mỹ, xuất phát từ giả thuyết từ vựng: những khác biệt tính cách quan trọng sẽ được mã hóa thành từ trong ngôn ngữ."
  loai: lich-su
- trang: kham-pha/tinh-cach/big-five
  id: n7
  cau: Allport và Odbert lục từ điển tiếng Anh và trích ra khoảng 18.000 từ miêu tả con người.
  loai: so-lieu
- trang: kham-pha/tinh-cach/big-five
  id: n8
  cau: Trong danh sách đó, khoảng 4.500 từ miêu tả những đặc điểm ổn định, quan sát được.
  loai: so-lieu
- trang: kham-pha/tinh-cach/big-five
  id: n9
  cau: Tupes và Christal (hai nhà nghiên cứu của Không quân Mỹ) lấy 35 đặc điểm tiêu biểu, nhờ người khác đánh giá, ở tổng cộng 8 mẫu.
  loai: so-lieu
- trang: kham-pha/tinh-cach/big-five
  id: n10
  cau: Người được đánh giá đi từ quân nhân trong khóa huấn luyện đến sinh viên đại học và học viên cao học; người đánh giá từ người mới quen đến nhà tâm lý lâm sàng nhiều kinh nghiệm; thời gian quen biết từ 3 ngày đến hơn một năm.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n11
  cau: "Ở cả 8 mẫu, phân tích nhân tố cho ra 5 nhân tố khá mạnh và lặp lại: Surgency, Agreeableness, Dependability, Emotional Stability, Culture."
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n12
  cau: Báo cáo gốc là tài liệu kỹ thuật quân sự năm 1961, công bố lại trên tạp chí khoa học năm 1992.
  loai: lich-su
- trang: kham-pha/tinh-cach/big-five
  id: n13
  cau: Costa và McCrae xây dựng bảng hỏi; phiên bản đầu đo 3 chiều (lo âu, hướng ngoại, cởi mở), mỗi chiều gồm nhiều khía cạnh.
  loai: lich-su
- trang: kham-pha/tinh-cach/big-five
  id: n14
  cau: Bản NEO PI (1985) bổ sung dễ chịu và tận tâm; NEO-PI-R (1992) là công cụ đo cả năm chiều; mô hình gọi là Five-Factor Model (FFM).
  loai: lich-su
- trang: kham-pha/tinh-cach/big-five
  id: n15
  cau: "Năm chiều OCEAN: Openness (tò mò, thích cái mới, giàu tưởng tượng), Conscientiousness (ngăn nắp, kỷ luật, đáng tin), Extraversion (sôi nổi, thích giao tiếp, nhiều năng lượng), Agreeableness (tin tưởng, hợp tác, ấm áp), Neuroticism (dễ lo âu, buồn bã, nhạy cảm với stress)."
  loai: dinh-nghia
- trang: kham-pha/tinh-cach/big-five
  id: n16
  cau: 'John, Naumann và Soto (2008), chương "Paradigm shift to the integrative Big Five trait taxonomy: History, measurement, and conceptual issues", trong Handbook of Personality (ấn bản 3, Guilford, tr. 114–158), hệ thống hóa lịch sử, cách đo và vấn đề khái niệm của Big Five.'
  loai: lich-su
- trang: kham-pha/tinh-cach/big-five
  id: n17
  cau: McCrae và Costa (1997) so sánh cấu trúc nhân tố của 6 bản dịch NEO-PI-R (Đức, Bồ Đào Nha, Hebrew, Trung, Hàn, Nhật) với cấu trúc gốc của người Mỹ, trên tổng cộng 7.134 người.
  loai: so-lieu
- trang: kham-pha/tinh-cach/big-five
  id: n18
  cau: Cấu trúc 5 nhân tố được tái lập ở tất cả các mẫu, dù 6 ngôn ngữ thuộc 5 ngữ hệ khác nhau; các tác giả kết luận dữ liệu "rất ủng hộ" việc cấu trúc tính cách là phổ quát.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n19
  cau: Một khảo sát diện rộng ở 23 nước thu nhập thấp và trung bình thấy các câu hỏi Big Five thường không đo đúng các chiều dự định khi hỏi trực tiếp tại hộ gia đình.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n20
  cau: "Khá vững: 5 chiều lặp lại qua nhiều ngôn ngữ và cách đo, nhưng chưa phải ở mọi nơi."
  loai: nhan
- trang: kham-pha/tinh-cach/big-five
  id: n21
  cau: "Khá vững: Big Five dự báo được kết quả công việc, nhưng ở mức nhỏ đến vừa."
  loai: nhan
- trang: kham-pha/tinh-cach/big-five
  id: n22
  cau: Tận tâm dự báo hiệu suất công việc ở cả 5 nhóm nghề và cả 3 loại tiêu chí, ρ khoảng .20–.23.
  loai: so-lieu
- trang: kham-pha/tinh-cach/big-five
  id: n23
  cau: Hướng ngoại dự báo ở hai nghề cần giao tiếp (quản lý, ρ = .18; bán hàng, ρ = .15).
  loai: so-lieu
- trang: kham-pha/tinh-cach/big-five
  id: n24
  cau: "Mô hình HEXACO có 6 chiều, thêm chiều trung thực–khiêm tốn (Honesty-Humility: chân thành, công bằng, khiêm tốn)."
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n25
  cau: Trong các nghiên cứu Ashton và Lee dẫn, HEXACO dự báo hành vi sai trái ở nơi làm việc tốt hơn Big Five (hệ số tương quan bội .63 so với .47) và dự báo khả năng quấy rối tình dục (.54 khi thêm Honesty-Humility so với .34).
  loai: so-lieu
- trang: kham-pha/tinh-cach/big-five
  id: n26
  cau: "Đang tranh cãi: có đúng là 5 chiều, không hơn không kém? Phe HEXACO lập luận chiều thứ sáu đo điều Big Five bỏ sót."
  loai: nhan
- trang: kham-pha/tinh-cach/big-five
  id: n27
  cau: "Giả thuyết từ vựng: nếu một khác biệt tính cách thực sự quan trọng, con người sẽ đặt tên cho nó; vì vậy cấu trúc từ vựng phản ánh cấu trúc tính cách."
  loai: dinh-nghia
- trang: kham-pha/tinh-cach/big-five
  id: n28
  cau: Lý thuyết năm nhân tố của McCrae và Costa cho rằng sự trưởng thành của tính cách phần lớn do yếu tố di truyền quyết định.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n29
  cau: "Nghĩ theo điểm số, đừng nghĩ theo loại: Vững chắc."
  loai: nhan
- trang: kham-pha/tinh-cach/big-five
  id: n30
  cau: Người có điểm ở gần ranh giới dễ nhận "loại" khác khi làm lại bài test, dù điểm liên tục của họ chênh nhau rất ít.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n31
  cau: 'Đọc điểm số Big Five như mức trung bình, không như nhãn: điểm tận tâm thấp không có nghĩa là "lười"; điểm số không cho biết giá trị nghề nghiệp của một người. Khá vững.'
  loai: nhan
- trang: kham-pha/tinh-cach/big-five
  id: n32
  cau: Điểm Big Five đo xu hướng trung bình, không phải số phận từng hành động; một người hướng ngoại vẫn có lúc muốn ở một mình.
  loai: loi-khuyen
- trang: kham-pha/tinh-cach/big-five
  id: n33
  cau: Big Five là công cụ mô tả các chiều của tính cách bình thường, không phải công cụ chẩn đoán bệnh lý.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n34
  cau: "Hiểu giới hạn của bảng hỏi (điểm đo xu hướng trung bình; mô tả tính cách bình thường, không chẩn đoán): Vững chắc."
  loai: nhan
- trang: kham-pha/tinh-cach/big-five
  id: n35
  cau: Tính đến 11/2026, chúng tôi tìm thấy hai nghiên cứu có mẫu người Việt kiểm tra cấu trúc nhân tố của tính cách, với kết quả khác nhau; chưa tìm thấy nghiên cứu chuẩn hóa NEO-PI-R trên mẫu người Việt đại diện.
  loai: thoi-su
- trang: kham-pha/tinh-cach/big-five
  id: n36
  cau: Một khảo sát ở nông thôn Thái Lan và Việt Nam (3.811 người, hai đợt) thấy cấu trúc 5 nhân tố phù hợp với mô hình Big Five.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n37
  cau: Một nghiên cứu từ vựng tiếng Việt (710 người; 668 từ miêu tả tính cách) thấy mô hình Big Five và Big Six "không được tái lập tốt", cấu trúc 8 nhân tố dễ diễn giải nhất.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n38
  cau: Nghiên cứu của McCrae và Costa (1997) có bản dịch tiếng Trung, Hàn, Nhật nhưng không có tiếng Việt.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n39
  cau: Bản dịch một bài test chưa qua quy trình chuẩn hóa (dịch ngược, kiểm chứng cấu trúc nhân tố) thì chưa rõ có đo đúng điều bản gốc đo; điểm số chỉ nên xem là tham khảo, không dùng cho quyết định quan trọng như tuyển dụng.
  loai: loi-khuyen
- trang: kham-pha/tinh-cach/big-five
  id: n40
  cau: Một nghiên cứu được Pittenger (1993) dẫn lại thấy khoảng một nửa số người được xếp lại ở ít nhất một trong bốn thang khi làm lại MBTI sau 5 tuần.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n41
  cau: Barrick và Mount (1991) thấy hướng ngoại dự báo hiệu suất ở quản lý và bán hàng, còn ở các nhóm nghề khác hệ số nhỏ hơn; giá trị của mỗi chiều phụ thuộc hoàn cảnh.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n44
  cau: "Câu hỏi quiz 1: giả thuyết từ vựng nói rằng những khác biệt tính cách quan trọng sẽ được mã hóa thành từ trong ngôn ngữ."
  loai: dinh-nghia
- trang: kham-pha/tinh-cach/big-five
  id: n45
  cau: "Câu hỏi quiz 2: Tupes và Christal phân tích đánh giá trên 35 đặc điểm ở 8 mẫu và tìm ra 5 nhân tố lặp lại (gồm giải thích về 8 mẫu, người chấm)."
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n46
  cau: "Câu hỏi quiz 3: Big Five là 5 chiều liên tục vì điểm số phân bố liên tục, phần đông nằm quanh giữa; chia thành loại làm mất thông tin; người ở gần ranh giới dễ đổi loại khi làm lại."
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n47
  cau: "Câu hỏi quiz 4: cấu trúc 5 nhân tố được tái lập ở 6 bản dịch trên 7.134 người, bằng chứng mạnh cho tính phổ quát, dù không có nghĩa mọi chi tiết giống nhau."
  loai: so-lieu
- trang: kham-pha/tinh-cach/big-five
  id: n48
  cau: 'Câu hỏi quiz 5: tận tâm dự báo nhất quán ở cả 5 nhóm nghề; hướng ngoại dự báo ở quản lý, bán hàng, không nhất quán ở các nhóm nghề còn lại; không chiều nào "tốt tuyệt đối".'
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n49
  cau: 'Phần "Ngộ nhận": "Tính cách là cố định, không đổi được" là sai: mức trung bình các chiều dịch chuyển theo tuổi và thay đổi vẫn tiếp diễn ở tuổi trưởng thành.'
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n50
  cau: 'Phần "Ngộ nhận": "Hướng nội là kém, lo âu là xấu"; "Biết 5 chiều là biết hết về một người"; Big Five mô tả xu hướng trên năm chiều, điểm số không cho biết động cơ, giá trị hay câu chuyện đời.'
  loai: loi-khuyen
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n1
  cau: "Mô tả trang: ổn định thứ hạng tăng dần theo tuổi theo phân tích tổng hợp Roberts & DelVecchio (2000), nhưng mức trung bình các chiều vẫn dịch chuyển, nhất là ở tuổi 20–40."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n2
  cau: "Thứ hạng của một người so với bạn bè ngày càng ổn định theo tuổi; mức trung bình của cả nhóm dịch chuyển: nhìn chung càng lớn càng kỷ luật hơn, điềm tĩnh hơn, dễ chịu hơn."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n3
  cau: Ổn định thứ hạng (rank-order stability) là vị trí tương đối của bạn so với người khác có giữ nguyên không; thay đổi mức trung bình (mean-level change) là điểm trung bình của cả nhóm có dịch chuyển không.
  loai: dinh-nghia
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n4
  cau: Roberts và DelVecchio dùng phân tích tổng hợp gộp 152 nghiên cứu dọc với tổng cộng 3.217 hệ số tương quan test-retest.
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n5
  cau: Khi giữ khoảng cách giữa hai lần đo ở 6,7 năm, tương quan test-retest là .31 ở thời thơ ấu, .54 ở tuổi đại học, .64 ở tuổi 30 và bình nguyên khoảng .74 ở tuổi 50–70.
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n6
  cau: Khoảng cách giữa hai lần đo càng dài thì tương quan càng thấp; các chiều khí chất ở trẻ nhỏ kém ổn định hơn các chiều tính cách ở người lớn.
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n7
  cau: Roberts, Walton và Viechtbauer (2006) gộp 92 mẫu nghiên cứu dọc để xem mức trung bình thay đổi thế nào.
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n8
  cau: "Tính thống trị xã hội (một khía cạnh của hướng ngoại: sự tự tin, quyết đoán trong giao tiếp), tận tâm và ổn định cảm xúc tăng, mạnh nhất ở tuổi 20–40."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n9
  cau: "Tính sôi nổi xã hội (khía cạnh còn lại của hướng ngoại: thích giao du, cảm xúc tích cực, nhiều năng lượng) và tính cởi mở tăng ở tuổi vị thành niên rồi giảm ở tuổi già."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n10
  cau: Tính dễ chịu chỉ thay đổi đáng kể ở tuổi già.
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n11
  cau: Trong 6 nhóm đặc điểm được xét, có 4 nhóm thay đổi đáng kể ở tuổi trung niên và tuổi già.
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n12
  cau: Nghiên cứu càng kéo dài thì thay đổi đo được càng lớn, và nghiên cứu theo dõi nhóm trẻ tuổi hơn thấy thay đổi lớn hơn.
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n13
  cau: "Roberts và Mroczek (2008): theo tuổi, con người nhìn chung tự tin hơn, ấm áp hơn, tự chủ hơn, ổn định cảm xúc hơn; các thay đổi này diễn ra nhiều nhất ở tuổi 20–40."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n14
  cau: "Thay đổi mức trung bình vẫn xảy ra ở tuổi trung niên và tuổi già: theo các tác giả, tính cách có thể thay đổi ở mọi lứa tuổi."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n15
  cau: William James cho rằng tính cách "đông cứng như thạch cao" (set like plaster) từ tuổi 30 (James, 1890); nghiên cứu hiện đại không khớp với quan niệm này.
  loai: lich-su
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n16
  cau: Ở mọi giai đoạn, mỗi người có kiểu phát triển riêng, dường như gắn với những trải nghiệm cụ thể của giai đoạn đời ấy.
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n17
  cau: Bleidorn và cộng sự (2013) dùng mẫu internet 884.328 người trẻ trưởng thành ở 62 quốc gia.
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n18
  cau: Từ đầu đến giữa tuổi trưởng thành, ở nhiều nền văn hóa người ta trở nên dễ chịu hơn, tận tâm hơn và bớt lo âu hơn.
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n19
  cau: Ở những nền văn hóa đảm nhận trách nhiệm của vai trò người lớn sớm hơn, sự trưởng thành tính cách đến sớm hơn, phù hợp với lý thuyết đầu tư xã hội; đây là so sánh giữa các nền văn hóa, chưa chứng minh nguyên nhân.
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n20
  cau: "Vững chắc: ổn định thứ hạng tăng theo tuổi, đạt đỉnh khoảng .74 ở tuổi 50–70."
  loai: nhan
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n21
  cau: 'Khá vững: mức trung bình dịch chuyển theo hướng "trưởng thành".'
  loai: nhan
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n22
  cau: "Đang tranh cãi: vì sao tính cách thay đổi, do sinh học bên trong hay do vai trò xã hội? Lý thuyết năm nhân tố cho rằng sự trưởng thành phần lớn do di truyền; lý thuyết đầu tư xã hội cho rằng phần lớn do các bước chuyển sang vai trò người lớn."
  loai: nhan
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n23
  cau: "Theo Bleidorn (2013): lý thuyết năm nhân tố cho rằng sự trưởng thành tính cách phần lớn do di truyền quyết định; lý thuyết đầu tư xã hội cho rằng nó phần lớn là kết quả của các bước chuyển sang vai trò người lớn."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n24
  cau: 'Đừng "đóng đinh" bản thân hay người khác: thứ hạng khá ổn định nhưng mức độ vẫn có thể dịch chuyển, nhất là ở tuổi 20–40; ở tuổi trẻ thứ hạng còn "dẻo" (tương quan khoảng .3–.5).'
  loai: loi-khuyen
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n25
  cau: "Khá vững (chip mục Áp dụng 1): không đóng đinh bản thân hay người khác."
  loai: nhan
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n26
  cau: "Đang tranh cãi (chip mục Áp dụng 2): thay đổi tính cách gắn với trải nghiệm sống nhưng nguyên nhân chưa rõ; ở những nền văn hóa nơi vai trò người lớn đến sớm hơn, sự trưởng thành đến sớm hơn."
  loai: nhan
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n27
  cau: Một phân tích tổng hợp 207 nghiên cứu về can thiệp (chủ yếu điều trị lâm sàng) thấy điểm một số chiều tính cách đổi rõ rệt trong khoảng 24 tuần (ví dụ d = 0,37), nhiều nhất ở ổn định cảm xúc.
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n28
  cau: Thay đổi tích lũy theo thời gian (nghiên cứu càng dài thì thay đổi đo được càng lớn) và vẫn xảy ra ở tuổi trung niên và già; không cho biết một cá nhân cụ thể sẽ đổi bao nhiêu.
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n29
  cau: "Khá vững (chip mục Áp dụng 3): thay đổi tích lũy chậm và vẫn xảy ra ở người lớn tuổi."
  loai: nhan
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n30
  cau: Tính đến 11/2026, chúng tôi tìm thấy một nghiên cứu hai đợt có mẫu gồm cả người Việt (3.811 người ở nông thôn Thái Lan và Việt Nam); chưa tìm thấy nghiên cứu dọc dài hạn về thay đổi tính cách theo tuổi trên mẫu người Việt đại diện.
  loai: thoi-su
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n31
  cau: "Khảo sát 3.811 người ở nông thôn Thái Lan và Việt Nam: mức trung bình đổi nhỏ giữa hai đợt (Cohen's d từ 0,06 đến 0,21), tương quan test-retest trung bình giữa hai đợt là 0,21; thay đổi cá nhân liên quan đến các cú sốc và phần lớn không phụ thuộc tuổi, giới, học vấn."
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n32
  cau: Nghiên cứu 62 quốc gia cho thấy hướng "trưởng thành" từ đầu đến giữa tuổi trưởng thành ở nhiều nền văn hóa, còn thời điểm trưởng thành khác nhau giữa các nền văn hóa; áp vào Việt Nam chỉ là giả thuyết.
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n33
  cau: "Ngộ nhận: tính cách đông cứng sau 30 là sai; 4/6 nhóm đặc điểm thay đổi đáng kể ở tuổi trung niên và già (Roberts, Walton & Viechtbauer 2006)."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n34
  cau: "Ngộ nhận: nếu tính cách thay đổi thì đo tính cách vô nghĩa; không suy ra được: thứ hạng tương đối ổn định (tuổi đại học .54, tuổi 30 .64 khi đo cách 6,7 năm) trong khi mức trung bình dịch chuyển."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n35
  cau: 'Ngộ nhận: "càng già càng khó tính là quy luật" không có trong các nguồn của bài: ổn định cảm xúc và tận tâm tăng ở tuổi 20–40, dễ chịu chỉ đổi đáng kể ở tuổi già.'
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n36
  cau: "Quiz: ổn định thứ hạng nghĩa là vị trí tương đối được giữ nguyên theo thời gian; điểm số có thể tăng mà thứ hạng giữ nguyên."
  loai: dinh-nghia
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n37
  cau: "Quiz: ở tuổi 30 và tuổi 50–70 hệ số test-retest là .64 và khoảng .74 (khoảng đo cố định 6,7 năm); đường cong .31 → .54 → .64 → ~.74."
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n38
  cau: "Quiz: khoảng đo càng dài thì hệ số ổn định càng thấp; .74 không phải 1.0."
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n39
  cau: "Quiz: Roberts 2006: tính thống trị xã hội, tận tâm và ổn định cảm xúc tăng mạnh ở tuổi 20–40; sôi nổi xã hội và cởi mở tăng ở vị thành niên rồi giảm ở tuổi già; dễ chịu chỉ đổi ở tuổi già."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n40
  cau: "Quiz: Bleidorn 2013 phát hiện sự trưởng thành tính cách (dễ chịu, tận tâm, bớt lo âu) ở nhiều nền văn hóa, đến sớm hơn ở nơi vai trò người lớn đến sớm hơn."
  loai: phat-hien
- trang: kham-pha/tinh-cach/mbti
  id: n22
  cau: 'Bác bỏ: con người thuộc về một trong 16 "loại tính cách" rời rạc.'
  loai: nhan
- trang: kham-pha/tinh-cach/mbti
  id: n23
  cau: "Khá vững: nhát cắt nhị phân tại điểm giữa góp phần gây thiếu ổn định của nhãn loại."
  loai: nhan
- trang: kham-pha/tinh-cach/mbti
  id: n24
  cau: "Khá vững: Big Five có bằng chứng dự báo hiệu quả công việc, còn MBTI chưa có bằng chứng tương đương."
  loai: nhan
- trang: kham-pha/tinh-cach/mbti
  id: n25
  cau: "Đang tranh cãi: có nên dùng MBTI trong doanh nghiệp và tuyển dụng; phe bênh vực dựa vào độ tin cậy thang liên tục, phe phê bình nói nhãn bốn chữ cái thiếu ổn định và thiếu bằng chứng."
  loai: nhan
- trang: kham-pha/tinh-cach/mbti
  id: n31
  cau: "Đừng xem bốn chữ cái là căn cứ để tuyển dụng hay chọn nghề: các tổng quan đã mở không thấy đủ bằng chứng; Khá vững."
  loai: nhan
- trang: kham-pha/tinh-cach/mbti
  id: n32
  cau: Điểm liên tục của từng thang có độ tin cậy chấp nhận được; nhãn chữ cái không cho biết mức độ. Khá vững.
  loai: nhan
- trang: kham-pha/tinh-cach/mbti
  id: n33
  cau: Bốn chỉ số MBTI tương quan với bốn chiều Big Five; Big Five giữ thang liên tục và có bằng chứng dự báo hiệu quả công việc; Khá vững.
  loai: nhan
- trang: kham-pha/tinh-cach/mbti
  id: n41
  cau: "Quiz 2: theo NRC 1991, McCarley và Carskadon (1983) thấy 47% người giữ nguyên loại sau 5 tuần; Pittenger dẫn cùng nghiên cứu là khoảng 50% bị xếp lại ở ít nhất một thang."
  loai: so-lieu
- trang: kham-pha/tinh-cach/mbti
  id: n27
  cau: Boyle (1995) kết luận việc dùng MBTI thường quy không được khuyến nghị.
  loai: phat-hien
- trang: kham-pha/tinh-cach/mbti
  id: n42
  cau: "Quiz 3: McCrae và Costa (1989) không thấy ủng hộ cho các loại rời rạc; bốn chỉ số MBTI tương quan với các khía cạnh của bốn chiều Big Five."
  loai: phat-hien
- trang: kham-pha/tinh-cach/mbti
  id: n43
  cau: 'Quiz 4: tận tâm dự báo nhất quán ở cả 5 nhóm nghề và 3 loại tiêu chí, khoảng .20–.23; phương án nhiễu "hướng ngoại ~.50" và "ổn định cảm xúc ~.40" sai.'
  loai: so-lieu
- trang: kham-pha/tinh-cach/mbti
  id: n34
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra độ tin cậy hay giá trị của MBTI trên người Việt.
  loai: thoi-su
- trang: kham-pha/tinh-cach/mbti
  id: n14
  cau: McCrae và Costa (1989) so sánh MBTI với Big Five trên 468 người trưởng thành (267 nam, 201 nữ, 19–93 tuổi), dùng cả tự đánh giá và đánh giá của người quen.
  loai: so-lieu
- trang: kham-pha/tinh-cach/mbti
  id: n44
  cau: "Quiz 5: nên nhìn điểm số liên tục thay vì nhãn và không dùng nhãn loại làm căn cứ tuyển chọn; các tổng quan đã mở không thấy đủ bằng chứng để dùng nhãn loại trong tuyển chọn hay tư vấn nghề nghiệp."
  loai: loi-khuyen
- trang: kham-pha/tinh-cach/mbti
  id: n36
  cau: "Ngộ nhận: làm lại MBTI ra loại khác chưa chắc là tính cách đã đổi; một khả năng là bạn gần điểm cắt vì thay đổi nhãn tập trung ở người điểm gần giữa; điểm liên tục có độ tin cậy chấp nhận được."
  loai: phat-hien
