- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n1
  cau: Nhiệm vụ 2–4–6 của Wason (1960) cho thấy ta có xu hướng tìm bằng chứng ủng hộ giả thuyết của mình thay vì tìm cách bác bỏ nó (mô tả của trang).
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n2
  cau: Quy tắc thật của Wason chỉ là ba số tăng dần bất kỳ; dãy 2–3–4 đúng, dãy 1–5–100 cũng đúng.
  loai: dinh-nghia
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n3
  cau: Nhiều người đoán một quy tắc hẹp hơn quy tắc thật, chẳng hạn mỗi số hơn số trước 2 đơn vị; trong thí nghiệm của Wason gần như mọi quy tắc sai đều thuộc kiểu hẹp hơn.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n4
  cau: Các dãy như 8–10–12, 20–22–24, 100–102–104 đều nhận "đúng" vì thỏa quy tắc thật, nên không dãy nào cho thấy phỏng đoán "số chẵn tăng đều" là sai.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n5
  cau: Họ thường nêu quy tắc sai chỉ sau vài lần thử (trung bình 3,7 dãy trước lần nêu sai đầu tiên).
  loai: so-lieu
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n6
  cau: Dãy đáng thử nhất là dãy có khả năng làm phỏng đoán sụp đổ, ví dụ 2–3–4 (không còn là số chẵn cách nhau 2); nếu dãy đó vẫn "đúng" thì phỏng đoán quá hẹp.
  loai: loi-khuyen
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n7
  cau: "Thiên kiến xác nhận (confirmation bias): xu hướng tìm hoặc diễn giải bằng chứng theo hướng có lợi cho niềm tin, kỳ vọng hay giả thuyết sẵn có."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n8
  cau: Khi đã có giả thuyết, ta còn có xu hướng ghi nhớ chi tiết "cùng phe" và xem nhẹ hay quên bằng chứng trái chiều.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n9
  cau: "Thiên kiến xác nhận thường không phải cố tình tự lừa dối mình: Nickerson mô tả nó là sự chọn lọc không chủ ý trong việc thu thập và dùng bằng chứng."
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n10
  cau: Ở nhiệm vụ 2–4–6, có cách giải thích rằng người tham gia xác nhận không phải vì muốn, mà vì không nghĩ ra cách bác bỏ (Evans, theo Nickerson).
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n11
  cau: Chỉ thử những dãy "khớp" với một phỏng đoán hẹp hơn quy tắc thật thì về mặt logic không thể cho thấy phỏng đoán đó sai.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n12
  cau: Peter Wason làm thí nghiệm 2–4–6 ở University College London, năm 1960.
  loai: lich-su
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n13
  cau: Người tham gia là 29 sinh viên đại học ngành tâm lý (17 nam, 12 nữ), được thử riêng từng người.
  loai: so-lieu
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n14
  cau: Người tham gia viết ra từng dãy ba số kèm lý do chọn; sau mỗi dãy, Wason cho biết dãy đó có tuân theo quy tắc hay không; họ chỉ nêu quy tắc khi đã rất tự tin.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n15
  cau: Nếu quy tắc nêu ra sai thì người tham gia được báo rồi thử tiếp; buổi thử dừng khi họ nêu đúng, quá 45 phút, hay muốn bỏ cuộc.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n16
  cau: Trong 29 người, 6 người tìm ra quy tắc đúng mà không nêu sai lần nào trước đó; 13 người nêu sai một lần; 9 người nêu sai từ hai lần trở lên; 1 người không đưa ra kết luận nào.
  loai: so-lieu
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n17
  cau: Gần như mọi quy tắc sai là quy tắc hẹp hơn quy tắc thật, ví dụ "tăng đều 2 đơn vị".
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n18
  cau: Những người nêu quy tắc sai ngay lần đầu thử trung bình 3,7 dãy trước khi nêu, so với 8,0 dãy ở 6 người nêu đúng ngay.
  loai: so-lieu
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n19
  cau: Tỉ lệ dãy không tuân theo quy tắc thật trong các dãy họ thử là 0,04 ở nhóm nêu sai ngay lần đầu, so với 0,21 ở nhóm nêu đúng ngay.
  loai: so-lieu
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n20
  cau: Wason kết luận rằng những người nêu sai từ hai lần trở lên không thể hoặc không muốn kiểm tra giả thuyết của mình theo cách có thể loại trừ nó.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n21
  cau: Gần bốn thập kỷ sau Wason, Nickerson (1998) công bố bài tổng quan trên Review of General Psychology.
  loai: lich-su
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n22
  cau: Bài tổng quan gom các phát hiện về thiên kiến xác nhận (tìm kiếm và diễn giải bằng chứng, ghi nhớ có chọn lọc, các ví dụ ngoài phòng thí nghiệm) thành một khung chung.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n23
  cau: Bài tổng quan nêu ví dụ thiên kiến xác nhận ở các bối cảnh như chẩn đoán y khoa, xét xử và khoa học.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n24
  cau: Trong thí nghiệm của Lord, Ross và Lepper, người ủng hộ và phản đối án tử hình đọc hai nghiên cứu (được giới thiệu là thật), một ủng hộ và một phản đối tính răn đe; cả hai phe đánh giá nghiên cứu ủng hộ quan điểm của mình là thuyết phục hơn.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n25
  cau: Sau khi đọc, cả hai phe đều nói rằng thái độ của mình đã cực đoan hơn theo hướng quan điểm ban đầu, nên bằng chứng "hỗn hợp" không làm ai lung lay.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n26
  cau: 'Phần "hai phe càng xa nhau hơn" mong manh hơn: trong một loạt nghiên cứu làm lại, khi đo thái độ trước và sau thì không thấy phân cực.'
  loai: tai-lap
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n27
  cau: Thiên kiến xác nhận không chỉ nằm ở khâu tìm kiếm bằng chứng mà còn ở khâu diễn giải bằng chứng.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n28
  cau: "Vững chắc: ta có xu hướng ưu tiên tìm và chọn thông tin phù hợp với niềm tin hay giả thuyết sẵn có."
  loai: nhan
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n29
  cau: Kiểu hành vi trong nhiệm vụ 2–4–6 được thấy ở thí nghiệm gốc của Wason và được các bài tổng quan sau đó ghi nhận (Klayman và Ha, 1987; Nickerson, 1998).
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n30
  cau: Một phân tích tổng hợp về việc chọn thông tin (Hart và cộng sự, 2009) thấy mức ưu tiên vừa phải cho thông tin hợp với niềm tin sẵn có (d = 0,36).
  loai: so-lieu
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n31
  cau: Mức ưu tiên ấy yếu đi khi niềm tin không quan trọng với người đó hay không được giữ chắc, và khi thông tin sẵn có kém chất lượng.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n32
  cau: "Đang tranh cãi: đó có phải là một thiên kiến có hại hay không."
  loai: nhan
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n33
  cau: "Klayman và Ha (1987) lập luận rằng nhiều hiện tượng gọi là thiên kiến xác nhận thực chất là chiến lược kiểm tra tích cực: thử những trường hợp được cho là có đặc tính cần kiểm tra thay vì những trường hợp được cho là không có."
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n34
  cau: Theo Klayman và Ha, trong điều kiện thực tế chiến lược này có thể là một cách làm rất tốt để xác định giả thuyết đúng hay sai, dù vẫn có thể gây lỗi hệ thống hay kém hiệu quả, như ở nhiệm vụ 2–4–6.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n35
  cau: Các nhà nghiên cứu còn tranh luận xem đây là một khiếm khuyết cần sửa hay một lối tắt tư duy chỉ thỉnh thoảng phản tác dụng.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n36
  cau: "Thiên kiến xác nhận theo nghĩa hẹp (Nickerson): xu hướng có hệ thống tìm thông tin ủng hộ niềm tin sẵn có, diễn giải thông tin mơ hồ theo hướng có lợi cho nó, và nhớ lại có chọn lọc."
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n37
  cau: Vấn đề chỉ nảy sinh khi giả thuyết quá hẹp so với sự thật, như trong nhiệm vụ 2–4–6, nơi quy tắc thật rộng hơn nhiều so với phỏng đoán "số chẵn tăng đều".
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n38
  cau: Khi muốn biết "thuốc này có chữa được bệnh không", cách tự nhiên là thử thuốc lên người bệnh chứ không phải lên người khỏe; theo Klayman và Ha, thói quen thử trường hợp "dương tính" như vậy thường là cách làm tốt trong điều kiện thực tế.
  loai: dinh-nghia
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n39
  cau: Theo Nickerson, ta dễ tin điều mình mong là đúng hơn điều mình muốn nó sai; ta có thể chọn lọc bằng chứng tìm kiếm và "nghiêng cán cân" khi cân nhắc, nhưng không thể phớt lờ hoàn toàn bằng chứng trái chiều.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n40
  cau: Điều này khớp với thí nghiệm của Lord, Ross và Lepper (1979), nơi mỗi phe đánh giá nghiên cứu ủng hộ quan điểm mình là thuyết phục hơn.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n41
  cau: Trước khi thu thập thêm bằng chứng ủng hộ, hãy viết ra một quan sát cụ thể mà nếu xảy ra sẽ khiến bạn bỏ giả thuyết; ở nhiệm vụ 2–4–6, đừng chỉ thử 8–10–12, hãy thử 2–3–4.
  loai: loi-khuyen
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n42
  cau: 'Đang tranh cãi (chip ở mục 1): hỏi "Điều gì sẽ chứng minh tôi sai?" giúp giảm thiên kiến xác nhận.'
  loai: nhan
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n43
  cau: Theo Nickerson (dẫn Evans, 1989), các thí nghiệm hướng dẫn người tham gia tìm bằng chứng bác bỏ đôi khi làm đổi hành vi nhưng thường không cải thiện thành tích.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n44
  cau: Trong thí nghiệm của Lord, Lepper và Preston (1984), người được yêu cầu xét điều ngược lại đã bớt thiên lệch khi đánh giá bằng chứng hơn so với những người chỉ được dặn hãy công bằng, không thiên vị.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n45
  cau: Khi đọc một bài báo hoàn toàn đồng tình với quan điểm của bạn, hãy dành vài phút xét vì sao điều ngược lại có thể đúng (tưởng tượng mình phải viết bài phản biện).
  loai: loi-khuyen
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n46
  cau: 'Khá vững (chip ở mục 2): "xét điều ngược lại" giúp đánh giá bằng chứng bớt thiên lệch.'
  loai: nhan
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n47
  cau: Gợi ý viết ra dự đoán của mình trước khi xem dữ liệu, để đối chiếu với dự đoán đã ghi thay vì với trí nhớ.
  loai: loi-khuyen
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n48
  cau: Kỹ thuật chỉ định người phản biện (devil's advocate) có hiệu quả đưa bằng chứng trái chiều vào bàn (chip Khá vững; "không xóa được thiên kiến của từng cá nhân, nhưng...").
  loai: loi-khuyen
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n49
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra nhiệm vụ 2–4–6 hay các dạng thiên kiến xác nhận tương tự trên người Việt; chưa có dữ liệu để kết luận người Việt "miễn nhiễm" hay "dễ mắc hơn".
  loai: thoi-su
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n50
  cau: Sự phân cực do người tham gia tự báo cáo về án tử hình rõ hơn ở người có quan điểm ban đầu cực đoan so với vừa phải (Miller và cộng sự, 1993); ở những chủ đề người Việt có niềm tin mạnh, ta có thể dự đoán hiệu ứng tương tự, nhưng đó chỉ là dự đoán.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n51
  cau: Người tham gia của Wason là sinh viên được mô tả là thông minh, và Nickerson (1998) nhấn mạnh thiên kiến này cũng được thấy ở những người làm khoa học.
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n52
  cau: Mười dãy số chẵn tăng đều đều "đúng" cũng không loại trừ được quy tắc thật; số lượng bằng chứng khẳng định không bù được cho sự vắng mặt của một phép thử bác bỏ.
  loai: loi-khuyen
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n55
  cau: 'Câu hỏi 1: các dãy như 8–10–12, 20–22–24 không giúp vì chúng phù hợp cả với phỏng đoán sai ("số chẵn tăng đều") lẫn quy tắc thật ("ba số tăng dần bất kỳ"), nên không loại trừ được gì; một phép thử chỉ có giá trị khi có khả năng chứng minh bạn sai.'
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n56
  cau: "Câu hỏi 2: chỉ 6 trong 29 người tìm ra quy tắc đúng mà không nêu sai lần nào; phần lớn nêu sai ít nhất một lần (13 + 9 = 22 người)."
  loai: so-lieu
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n57
  cau: 'Câu hỏi 3: theo Klayman và Ha (1987), nhiều hiện tượng gọi là "thiên kiến xác nhận" thực chất là chiến lược kiểm tra tích cực, có thể là cách làm tốt trong điều kiện thực tế nhưng đôi khi gây lỗi hệ thống.'
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n58
  cau: "Câu hỏi 4: mỗi phe đánh giá nghiên cứu ủng hộ mình là thuyết phục hơn, và cả hai đều nói mình tin chắc hơn trước (thái độ cực đoan hơn theo hướng ban đầu, tự báo cáo)."
  loai: phat-hien
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n59
  cau: 'Câu hỏi 5: kỹ thuật "xét điều ngược lại" giúp đánh giá bằng chứng bớt thiên lệch hơn lời dặn chung chung hãy công bằng; nó không đảm bảo bạn sẽ đổi ý.'
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n1
  cau: 'Mô tả (description): 85% sinh viên ở một phiên bản của nghiên cứu gốc chọn đáp án "chi tiết hơn" dù về mặt logic nó không thể đúng hơn.'
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n2
  cau: Linda 31 tuổi, độc thân, thẳng thắn và rất thông minh; học triết học; thời sinh viên quan tâm đến phân biệt đối xử, công bằng xã hội và tham gia biểu tình chống vũ khí hạt nhân (đoạn mô tả của bài toán).
  loai: dinh-nghia
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n3
  cau: "Hai đáp án: (a) Linda là nhân viên ngân hàng; (b) Linda là nhân viên ngân hàng và là nhà hoạt động nữ quyền."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n4
  cau: "Đáp án đúng về mặt logic là (a): mọi nhân viên ngân hàng đồng thời là nhà hoạt động nữ quyền đều là nhân viên ngân hàng; tập (b) nằm trong tập (a) nên P(A và B) ≤ P(A)."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n5
  cau: Trong một phiên bản của nghiên cứu gốc (142 sinh viên đại học ở UBC chưa học thống kê), 85% chọn (b) giống người đọc.
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n6
  cau: Ở phiên bản xếp hạng tám phát biểu, nghiên cứu sinh chương trình khoa học quyết định cũng mắc lỗi với tỉ lệ tương tự (85%).
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n7
  cau: Trong nghiên cứu gốc, thứ hạng xác suất người tham gia gán cho các phát biểu gần như trùng thứ hạng độ giống (hệ số tương quan 0,98 với Linda); cảm giác "hợp" thắng cả quy tắc xác suất.
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n8
  cau: Heuristic là các nguyên tắc đơn giản hóa, thường hữu ích nhưng đôi khi dẫn đến lỗi nặng và có hệ thống (bias).
  loai: dinh-nghia
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n9
  cau: "Bài toán Linda là ví dụ nổi tiếng của hai ông: ở phiên bản xếp hạng, ngay cả nhóm đã học nhiều về xác suất cũng mắc lỗi."
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n10
  cau: Trong bài *Science* 1974, hai ông cho rằng khi đánh giá khả năng hay dự đoán giá trị, con người dựa vào một số ít nguyên tắc heuristic; chúng thường hữu ích nhưng đôi khi dẫn đến sai lệch nặng và có hệ thống.
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n11
  cau: Bài mô tả ba heuristic (đại diện, sẵn có, neo), kèm các thí nghiệm minh họa, nhiều thí nghiệm lấy từ công trình trước của hai ông.
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n12
  cau: 'Ví dụ "Steve" (nhút nhát, thích trật tự, đam mê chi tiết): người ta xếp các nghề theo xác suất và theo độ giống khuôn mẫu theo đúng một thứ tự.'
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n13
  cau: "Về tỉ lệ gốc: khi biết nhóm gồm 70 kỹ sư và 30 luật sư, hay ngược lại, người tham gia đưa ra những đánh giá xác suất gần như giống nhau cho từng bản mô tả."
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n14
  cau: Với bản mô tả vô thưởng vô phạt ("Dick"), họ cho xác suất làm kỹ sư là 0,5 ở cả hai nhóm (0,7 hay 0,3 kỹ sư).
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n15
  cau: 'Về cỡ mẫu: hỏi bệnh viện lớn (khoảng 45 ca sinh/ngày) hay nhỏ (khoảng 15 ca) ghi nhiều ngày hơn có hơn 60% bé trai, 21 sinh viên chọn bệnh viện lớn, 21 chọn nhỏ và 53 chọn "khoảng bằng nhau"; đúng ra bệnh viện nhỏ có nhiều ngày hơn.'
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n16
  cau: "Heuristic sẵn có: đánh giá tần suất dựa trên độ dễ nhớ lại; khi nghe danh sách người nổi tiếng nam và nữ, người tham gia cho rằng nhóm có nhiều người nổi tiếng hơn là nhóm đông hơn."
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n17
  cau: Hỏi từ bắt đầu bằng chữ r hay có r ở vị trí thứ ba nhiều hơn, đa số cho rằng từ bắt đầu bằng r nhiều hơn, kể cả với phụ âm như r hay k vốn gặp ở vị trí thứ ba nhiều hơn.
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n18
  cau: "Ấn tượng rõ nét và gần đây tăng cảm giác về khả năng xảy ra: tai nạn giao thông có vẻ dễ xảy ra hơn trong chốc lát sau khi ta thấy một chiếc xe lật bên đường."
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n19
  cau: "Heuristic neo: nhóm nhận số khởi đầu 10 (bánh xe may rủi) ước tính tỉ lệ nước châu Phi trong Liên Hợp Quốc với trung vị 25, nhóm nhận 65 cho 45; thưởng tiền cho độ chính xác không làm giảm hiệu ứng."
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n20
  cau: "Hai nhóm học sinh trung học ước tính trong 5 giây tích 8×7×6×5×4×3×2×1 hay 1×2×3×4×5×6×7×8: trung vị 2.250 và 512 (đáp án đúng 40.320)."
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n21
  cau: Hai ông kết luận các heuristic này rất tiết kiệm và thường hiệu quả, nhưng dẫn đến lỗi có hệ thống và dự đoán được.
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n22
  cau: Chín năm sau bài 1974, hai ông công bố trên Psychological Review một loạt thí nghiệm về lỗi conjunction fallacy.
  loai: lich-su
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n23
  cau: 'Conjunction fallacy: đánh giá "A và B" có khả năng cao hơn "A" khi so sánh trực tiếp.'
  loai: dinh-nghia
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n24
  cau: 'Nghiên cứu dùng nhiều biến thể: so sánh trực tiếp hai phát biểu, xếp hạng tám phát biểu, chấm xác suất thang 9 bậc, và phiên bản "đặt cược" (nếu có thể thắng 10 đô la khi đặt cược vào một sự kiện, bạn chọn đặt vào đâu).'
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n25
  cau: "Ba nhóm: ngây thơ (sinh viên đại học Stanford và UBC chưa học xác suất hay thống kê), trung gian (học viên cao học năm đầu ngành tâm lý và giáo dục, và sinh viên y Stanford, đã học thống kê), tinh vi (nghiên cứu sinh khoa học quyết định của Stanford Business School, đã học nhiều môn về xác suất, thống kê và lý thuyết quyết định)."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n26
  cau: Ở phiên bản xếp hạng, tỉ lệ mắc lỗi với Linda là 89%, 90% và 85% ở ba nhóm ngây thơ, trung gian và tinh vi.
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n27
  cau: "Các biến thể khác ở sinh viên chưa học thống kê cho tỉ lệ thấp hơn nhưng vẫn cao: 82% khi chấm xác suất trên thang 9 bậc."
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n28
  cau: 65% (n = 58) chọn lập luận "giống" (không hợp lệ) thay vì lập luận logic.
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n29
  cau: 57% (n = 75) mắc lỗi khi phát biểu (a) được viết là "nhân viên ngân hàng, dù có hay không là nhà hoạt động nữ quyền".
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n30
  cau: Khi 64 nghiên cứu sinh khoa học xã hội đã học nhiều môn thống kê (Berkeley, Stanford) chỉ phải so hai phát biểu, đa số làm đúng, nhưng 36% vẫn mắc lỗi.
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n31
  cau: Trong phép so sánh trực tiếp, cả người chưa học thống kê lẫn người đã học thường nhận ra hai tập hợp lồng nhau, nhưng người chưa học, khác người đã học, không thấy điều đó quyết định phán đoán xác suất.
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n32
  cau: "Với khung đặt cược, tỉ lệ vi phạm là 56% (n = 60): quá cao so với mức chấp nhận được, và thấp hơn hẳn mức điển hình của các phép so sánh xác suất."
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n33
  cau: 'Chú thích hình linda-venn: "85% người tham gia nghiên cứu gốc vẫn chọn (b)" và hình ghi P(A và B) ≤ P(A).'
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n34
  cau: "Vững chắc: lỗi conjunction fallacy trong bài toán Linda."
  loai: nhan
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n35
  cau: Trong một lần làm lại (Charness và cộng sự), 58% mắc lỗi khi không có thưởng, 33% khi có thưởng nhỏ, và còn ít hơn nữa khi được bàn với người khác.
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n36
  cau: Một phân tích tổng hợp (Yechiam và Zeif, 2023; 3.276 người) thấy thưởng tiền làm giảm lỗi conjunction ở mức nhỏ (d = 0,19).
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n37
  cau: Một lần làm lại có đăng ký trước (Chandrashekar và cộng sự, 2021; 1.032 người) vẫn thấy hiệu ứng ở bài toán Linda, nhưng không thấy ở bài thứ hai (James).
  loai: tai-lap
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n38
  cau: "Đang tranh cãi: vì sao ta mắc bẫy — heuristic hay cách diễn đạt?"
  loai: nhan
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n39
  cau: Theo Gigerenzer (1991), nhiều "lỗi" trong suy luận xác suất, trong đó có conjunction fallacy, thực ra không vi phạm lý thuyết xác suất nếu phân biệt xác suất của một trường hợp đơn lẻ với tần suất tương đối.
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n40
  cau: Theo mô tả của Chandrashekar và cộng sự (2021), Hertwig cho rằng dạng tần suất xóa hiệu ứng conjunction và hiệu ứng chủ yếu do từ ngữ mơ hồ; quan điểm này bị tranh cãi.
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n41
  cau: 'Chính Tversky và Kahneman (1983) đã nêu và thử cách hiểu "(a) là nhân viên ngân hàng và không phải nhà hoạt động nữ quyền": ở thang 9 bậc, 82% vẫn đánh giá (b) cao hơn (a).'
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n42
  cau: Hai ông nói đã thử một loạt cách chỉnh sửa "ngày càng tuyệt vọng" để buộc người tham gia theo quy tắc conjunction, nhưng không xóa được hiệu ứng ở người chưa học thống kê.
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n43
  cau: Tentori và cộng sự (2004) cho rằng việc đó có phải lỗi hay không phụ thuộc vào cách người ta hiểu các từ "xác suất" và "và".
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n44
  cau: Cuộc tranh luận về cơ chế đến nay chưa ngã ngũ hoàn toàn; các tác giả lần làm lại 2021 kêu gọi thêm các tái lập có đăng ký trước.
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n45
  cau: "Thay thế thuộc tính (Kahneman 2011): khi gặp câu hỏi khó, ta thường trả lời một câu dễ hơn mà không để ý mình đã đổi câu hỏi."
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n46
  cau: Kahneman mô tả kết quả Linda ở phiên bản xếp hạng là một thất bại của Hệ thống 2 (người tham gia có cơ hội phát hiện quy tắc nhưng không tận dụng); phiên bản so sánh hai phát biểu buộc phải so sánh rõ ràng, giúp nhiều người đã học thống kê tránh được lỗi.
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n47
  cau: Theo Kahneman, Hệ thống 1 vận hành nhanh, dựa vào ấn tượng và câu chuyện; Hệ thống 2 có kiểm soát, nhưng thường "ký duyệt" câu trả lời trực giác.
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n48
  cau: Ba cách giải thích không nhất thiết loại trừ nhau, và chưa rõ phần nào của hiệu ứng đến từ heuristic, phần nào từ cách diễn đạt câu hỏi.
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n49
  cau: 'Vững chắc (chip ở mục 1): quy tắc "chi tiết chỉ làm giảm khả năng".'
  loai: nhan
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n50
  cau: Mỗi chi tiết thêm vào một sự kiện chỉ có thể làm nó khó xảy ra hơn; câu chuyện hay không đồng nghĩa với xác suất cao.
  loai: loi-khuyen
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n51
  cau: "Khá vững (chip ở mục 2): tưởng tượng đặt tiền thật vào phán đoán giúp giảm lỗi conjunction."
  loai: nhan
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n52
  cau: Với khung đặt cược, tỉ lệ mắc lỗi là 56%, thấp hơn mức 85% của phiên bản chọn một trong hai (ở các nhóm sinh viên khác nhau).
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n53
  cau: Tversky và Kahneman phỏng đoán rằng khung đặt cược khiến người ta chú ý đến điều kiện thắng cược của từng phương án.
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n54
  cau: Khi phân vân giữa hai phán đoán, hãy tưởng tượng bạn phải đặt tiền thật vào một trong hai.
  loai: loi-khuyen
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n55
  cau: "Khá vững (chip ở mục 3): nghĩ bằng tần suất thay vì xác suất giúp giảm lỗi."
  loai: nhan
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n56
  cau: Một lần làm lại có đăng ký trước (Chandrashekar và cộng sự, 2021) vẫn thấy hiệu ứng Linda ở dạng tần suất, nên đây là công cụ hỗ trợ chứ không phải "thuốc chữa".
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n57
  cau: 'Thay vì hỏi "khả năng nào lớn hơn?", hãy hỏi: "Trong 100 người giống Linda, có bao nhiêu người là nhân viên ngân hàng? Trong số đó có bao nhiêu người đồng thời là nhà hoạt động nữ quyền?"'
  loai: loi-khuyen
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n58
  cau: Khi đánh giá bằng độ giống, người ta bỏ qua tỉ lệ gốc (ví dụ 70 kỹ sư/30 luật sư).
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n59
  cau: Khi một mô tả quá "đắt" về chi tiết, hãy lùi một bước và hỏi về tỉ lệ gốc trước khi để câu chuyện dẫn dắt; trang chưa dẫn nghiên cứu đo hiệu quả của cách làm này.
  loai: loi-khuyen
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n60
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra bài toán Linda hay lỗi conjunction fallacy trên người Việt.
  loai: thoi-su
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n61
  cau: Nghiên cứu gốc dùng sinh viên đại học và nghiên cứu sinh ở Mỹ và Canada (Stanford, Berkeley, UBC); bài công bố năm 1983.
  loai: lich-su
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n62
  cau: Nếu một phần hiệu ứng đến từ cách hiểu câu hỏi theo thói quen giao tiếp, thì thói quen giao tiếp khác nhau giữa các nền văn hóa có thể ảnh hưởng đến hiệu ứng; đây là suy luận của trang, chưa có dữ liệu.
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n63
  cau: "Ngộ nhận: mô tả càng chi tiết không làm tăng khả năng đúng; chi tiết làm tăng độ thuyết phục, không làm tăng độ có khả năng."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n64
  cau: "Ngộ nhận: ở phiên bản xếp hạng, nhóm nghiên cứu sinh ngành khoa học quyết định — được đào tạo xác suất bài bản — vẫn mắc lỗi ở tỉ lệ cao (85%)."
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n65
  cau: "Ngộ nhận: không có nghịch lý toán học ở đây; P(A và B) ≤ P(A) là hiển nhiên, điều đáng ngạc nhiên là ở nhiều phiên bản trực giác của người tham gia đi ngược với điều ấy."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n68
  cau: "Câu hỏi 1: (a) luôn có khả năng đúng hơn (b) vì mọi người thỏa (b) đều thỏa (a); quy tắc conjunction P(A và B) ≤ P(A), không có ngoại lệ."
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n69
  cau: "Câu hỏi 2: trong nghiên cứu gốc, khoảng 85% chọn (b) ở phiên bản chọn một trong hai, và 85–90% ở phiên bản xếp hạng, kể cả ở nhóm có trình độ thống kê cao."
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n70
  cau: 'Câu hỏi 3: theo thay thế thuộc tính của Kahneman, ta đổi câu hỏi khó ("xác suất nào lớn hơn?") thành câu dễ ("mô tả nào giống Linda hơn?") mà không hay biết.'
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n71
  cau: 'Câu hỏi 4: phê bình của Gigerenzer cho rằng nhiều "lỗi" như vậy không thực sự vi phạm lý thuyết xác suất nếu phân biệt xác suất của một trường hợp đơn lẻ với tần suất tương đối, và cách người đọc hiểu câu hỏi có thể khác cách hiểu toán học.'
  loai: phat-hien
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n72
  cau: "Câu hỏi 5: theo phỏng đoán của Tversky và Kahneman, khung đặt cược khiến người ta chú ý đến điều kiện thắng cược của từng phương án; mẹo này không xóa hẳn lỗi (56% vẫn mắc)."
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n1
  cau: "Mô tả (description): Kahneman (2011) cho rằng ta nghĩ bằng hai hệ, Hệ 1 nhanh trực giác, Hệ 2 chậm phân tích; bài toán bóng và chày cho thấy đáp án trực giác có thể bật ra trước; không phải tuyên bố nào trong sách cũng đứng vững sau khủng hoảng tái lập."
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n2
  cau: "Bài toán: bóng và chày giá 1,10 đô la, chày đắt hơn bóng đúng 1,00 đô la; hỏi giá quả bóng."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n3
  cau: Đáp án bật ra ngay trong đầu nhiều người là 10 xu — và đó là đáp án sai.
  loai: so-lieu
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n4
  cau: Đáp án đúng là 5 xu (chày 1,05 đô la, bóng 0,05 đô la); nếu bóng 10 xu thì tổng là 1,20 đô la.
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n5
  cau: Bài toán bóng và chày là câu đầu tiên trong bài kiểm tra của Shane Frederick (2005), sau này gọi là CRT.
  loai: lich-su
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n6
  cau: Bài toán không đánh đố kiến thức toán; nó bẫy bằng một đáp án trực giác bật ra nhanh, dù lời giải dễ hiểu khi được giải thích.
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n7
  cau: Kahneman đoạt giải Nobel năm 2002 cho công trình về phán đoán và ra quyết định mà ông làm cùng Amos Tversky.
  loai: lich-su
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n8
  cau: Kahneman mô tả tâm trí qua hai "nhân vật", Hệ 1 và Hệ 2.
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n9
  cau: 'Hệ 1 (tư duy nhanh): vận hành tự động và nhanh, ít hoặc không tốn sức, dựa vào trực giác; theo Kahneman nó nhận ra sự thù địch trong một giọng nói và trả lời ngay "2 + 2 = ?".'
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n10
  cau: "Hệ 2 (tư duy chậm): vận hành có kiểm soát, tốn nỗ lực, dựa vào phân tích; theo Kahneman nó làm phép nhân 17 × 24; nó theo dõi và điều khiển các suy nghĩ do Hệ 1 gợi ra."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n11
  cau: 'Hệ 1 liên tục đưa ra ấn tượng và đáp án nhanh gọn; Hệ 2 theo dõi chúng nhưng có thể lười biếng: người trả lời "10 xu" không chủ động kiểm tra, nên Hệ 2 chấp nhận đáp án mà lẽ ra nó có thể bác bỏ chỉ với chút nỗ lực; theo Kahneman nhiều sai lầm đến từ khâu kiểm tra bị bỏ qua đó.'
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n12
  cau: "Hệ 1/Hệ 2 là cách nói ẩn dụ: không phải hệ thống theo nghĩa thông thường, và không có một phần não nào mà mỗi hệ có thể gọi là nhà."
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n13
  cau: "Frederick đưa ba câu đố trông dễ nhưng đều gài một đáp án trực giác sai: bóng và chày; 5 máy làm 5 chi tiết trong 5 phút, 100 máy làm 100 chi tiết mất bao lâu; đám hoa súng gấp đôi mỗi ngày, phủ kín hồ sau 48 ngày thì phủ nửa hồ sau bao nhiêu ngày."
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n14
  cau: Trong mọi đáp án sai có thể nghĩ ra, ba đáp án trực giác (10 xu, 100 phút, 24 ngày) chiếm ưu thế; người ta không tính nhầm ngẫu nhiên.
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n15
  cau: 'Với bài bóng và chày, gần như mọi người không trả lời "10 xu" đều trả lời đúng "5 xu": bắt được lỗi của trực giác là coi như giải xong bài.'
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n16
  cau: 'Ngay cả nhiều người trả lời đúng cũng thường nghĩ đến đáp án sai trước khi sửa lại: "10 xu" hay bị gạch bên cạnh "5 xu", không bao giờ ngược lại.'
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n17
  cau: Frederick dùng ba câu này lập CRT, một thước đo khả năng hoặc xu hướng dừng lại suy nghĩ và không trả lời ngay đáp án đầu tiên bật ra.
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n18
  cau: Cuốn Thinking, Fast and Slow (FSG, New York, 2011) là bản tổng hợp nhiều năm nghiên cứu về phán đoán và ra quyết định của Kahneman cùng các cộng sự.
  loai: lich-su
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n19
  cau: Kahneman ghi trong sách rằng Keith Stanovich và Richard West là người đầu tiên đưa ra các thuật ngữ Hệ 1 và Hệ 2.
  loai: lich-su
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n20
  cau: "Bargh và cộng sự (1996): sinh viên Đại học New York (phần lớn 18–22 tuổi) ghép câu bốn từ; một nhóm có câu chứa từ gợi tuổi già (Florida, forgetful, bald, gray, wrinkle); khi đi hết hành lang ở một thí nghiệm khác, nhóm này đi chậm hơn đáng kể."
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n21
  cau: Hai số hiệu ứng d = 1,04 (thí nghiệm 2a) và d = 0,79 (2b), tính từ số liệu bài gốc.
  loai: so-lieu
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n22
  cau: 'Thí nghiệm này từng được xem là minh họa kinh điển cho sức mạnh của Hệ 1: Kahneman gọi nó là "instant classic".'
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n23
  cau: Doyen và cộng sự (2012) làm lại thí nghiệm đi chậm với mẫu lớn hơn (120 sinh viên Bỉ ở Brussels), đo tốc độ bằng cảm biến hồng ngoại, thay vì bấm giờ bằng tay như bản gốc.
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n24
  cau: "Thí nghiệm 1 của Doyen và cộng sự: không tìm thấy hiệu ứng priming nào."
  loai: tai-lap
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n25
  cau: 'Thí nghiệm 2: một nửa người làm thí nghiệm được gieo niềm tin rằng người tham gia sẽ đi chậm, nửa kia gieo điều ngược lại; hiệu ứng "đi chậm" chỉ xuất hiện khi người làm thí nghiệm tin rằng nó sẽ xuất hiện.'
  loai: tai-lap
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n26
  cau: Phỏng vấn sau thí nghiệm gợi ý rằng người tham gia đã nhận ra các từ gợi ý, tức là quá trình này có thể không vô thức như tưởng.
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n27
  cau: Kết quả của Doyen gợi ý rằng đôi khi không phải từ ngữ lái hành vi người tham gia mà kỳ vọng của người làm thí nghiệm có thể đã ảnh hưởng đến tốc độ đi bộ; các tác giả dẫn Rosenthal (1966) về hiệu ứng của người làm thí nghiệm.
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n28
  cau: Pashler, Harris và Coburn (2011) là một lần làm lại độc lập được ghi nhận là thất bại.
  loai: tai-lap
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n29
  cau: Tháng 9/2012, Kahneman gửi email cho các nhà nghiên cứu priming xã hội, cảnh báo rằng ông thấy một "tai nạn tàu hỏa" đang đến gần, và viết rằng lĩnh vực này đã thành "hình mẫu" của những nghi ngờ về tính liêm chính của nghiên cứu tâm lý.
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n30
  cau: Kahneman nêu trong email rằng nghi ngờ về độ vững của kết quả priming đến từ nhiều nguồn, trong đó có "nhiều thất bại tái lập được báo cáo".
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n31
  cau: "Phân tích tổng hợp của Weingarten và cộng sự (2016): 352 kích thước hiệu ứng từ 133 nghiên cứu cho thấy hiệu ứng priming hành vi nhìn chung nhỏ (d khoảng 0,33–0,35), chỉ bị lệch ít do việc chỉ đăng kết quả dương; phân tích nói về nhiều loại từ gợi ý."
  loai: so-lieu
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n32
  cau: "Khá vững: có những quá trình tư duy nhanh-tự động và những quá trình chậm-tốn sức."
  loai: nhan
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n33
  cau: Schneider và Shiffrin (1977) phân biệt xử lý tự động (không cần kiểm soát, không bị giới hạn năng lực, không nhất thiết cần chú ý) với xử lý có kiểm soát (cần chú ý, giới hạn năng lực, do người làm kiểm soát), qua thí nghiệm đo thời gian phản ứng và độ chính xác.
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n34
  cau: Các nhà nghiên cứu sau đó (Epstein, Stanovich, Evans) phát triển ý tưởng thành họ lý thuyết quá trình kép; Epstein (1994) đề xuất hai kiểu xử lý thông tin (hệ lý trí và hệ kinh nghiệm theo cảm xúc).
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n35
  cau: Đóng góp của Kahneman là kể các ý tưởng quá trình kép thành một câu chuyện dễ nhớ và dễ áp dụng cho đời sống; ông dùng các thuật ngữ do Stanovich và West đề xuất.
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n36
  cau: Theo Kahneman, Hệ 1 vận hành dựa trên ký ức liên tưởng (associative memory), là lõi của nó.
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n37
  cau: 'Theo Kahneman có một "luật ít tốn sức nhất": nếu có nhiều cách đạt cùng mục tiêu, người ta dần chọn cách đòi hỏi ít nỗ lực nhất.'
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n38
  cau: Theo Kahneman, trực giác có thể đáng tin trong môi trường đủ đều đặn để dự đoán, sau khi luyện tập lâu.
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n39
  cau: Theo Kahneman, người đang bận trí óc dễ chọn ích kỷ, dùng ngôn ngữ phân biệt giới tính và đưa ra phán đoán hời hợt hơn.
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n40
  cau: Hiệu ứng cạn kiệt ý chí (ego depletion, "khi mệt thì Hệ 2 yếu đi") không tái lập được trong một lần làm lại nhiều phòng thí nghiệm có đăng ký trước (23 phòng, 2.141 người; d = 0,04, khoảng tin cậy 95% [−0,07; 0,15]).
  loai: tai-lap
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n41
  cau: 'Khá vững: Hệ 2 thường "lười", hay phê duyệt đáp án của Hệ 1.'
  loai: nhan
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n42
  cau: "Đang tranh cãi: các từ ngữ vô thức có lái được hành vi phức tạp như tốc độ đi bộ hay không."
  loai: nhan
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n43
  cau: 'Đã bị bác bỏ: Hệ 1 và Hệ 2 là hai "bộ phận" riêng biệt trong não.'
  loai: nhan
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n44
  cau: "Các nghiên cứu then chốt thực hiện ở phương Tây: CRT trên sinh viên các trường đại học Mỹ (MIT, Princeton, Harvard, Carnegie Mellon, Michigan...), thí nghiệm priming ở New York, lần làm lại ở Brussels (Bỉ), và Kahneman làm việc tại Princeton."
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n45
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra CRT hay phân biệt Hệ 1/Hệ 2 trên người Việt.
  loai: thoi-su
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n46
  cau: Bài toán bóng và chày dùng đô la và xu; nếu chuyển sang tiền Việt với mệnh giá khác, cái bẫy trực giác có thể mạnh lên hay yếu đi; đó là suy đoán, cần nghiên cứu trên người Việt.
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n47
  cau: 'Ngộ nhận: Hệ 1 không "xấu": theo Kahneman, nó nhận ra sự thù địch trong giọng nói hay lái xe trên đường vắng; trực giác của chuyên gia có thể đáng tin trong môi trường đủ đều đặn sau luyện tập lâu; vấn đề là Hệ 2 không kiểm tra lại khi cần.'
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n48
  cau: "Ngộ nhận: Kahneman viết rằng, trừ một số tác động của tuổi tác, trực giác của ông vẫn dễ mắc quá tự tin, dự đoán cực đoan và ngộ nhận kế hoạch như trước khi ông nghiên cứu chúng; biết về hai hệ giúp nhận ra tình huống dễ sai."
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n49
  cau: "Ngộ nhận: một số hiệu ứng nổi tiếng trong sách, như từ ngữ về tuổi già làm người ta đi chậm, đã không tái lập được trong các lần làm lại có kiểm soát tốt hơn (Doyen 2012)."
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n52
  cau: 'Câu hỏi 1: nhiều người trả lời "10 xu" vì Hệ 1 đưa ra đáp án nhanh gọn (1,10 − 1,00 = 0,10) trước khi Hệ 2 kiểm tra xem đáp án có thỏa cả hai điều kiện không; cái bẫy ở tốc độ, không ở phép tính.'
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n53
  cau: "Câu hỏi 2: đóng góp chính của Frederick (2005) qua CRT là một thước đo khả năng hay xu hướng dừng lại suy nghĩ; ba câu đều gài đáp án trực giác sai, bắt được lỗi đó gần như đồng nghĩa với giải đúng (với bài bóng và chày)."
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n54
  cau: "Câu hỏi 3: kết quả chính của Doyen (2012): thí nghiệm 1 với đo đạc khách quan không thấy hiệu ứng priming; thí nghiệm 2 hiệu ứng chỉ xuất hiện khi người làm thí nghiệm tin rằng nó sẽ xuất hiện."
  loai: tai-lap
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n55
  cau: "Câu hỏi 4: theo mô hình Kahneman, ta mắc nhiều sai lầm dù biết tính vì Hệ 1 đưa đáp án trước còn Hệ 2 có thể lười kiểm tra lại; nhiều sai lầm không do thiếu kiến thức mà do khâu kiểm tra bị bỏ qua."
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n56
  cau: "Câu hỏi 5: Hệ 1 và Hệ 2 là cách nói ẩn dụ cho hai kiểu xử lý (nhanh-tự động và chậm-tốn sức); không có hai bộ phận tương ứng; Kahneman nhấn mạnh đây là hai nhân vật hư cấu."
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n57
  cau: "Mục Áp dụng 3 (checklist): nghiên cứu trước–sau ở tám bệnh viện (Haynes và cộng sự, 2009) thấy tử vong giảm từ 1,5% xuống 0,8% và biến chứng từ 11,0% xuống 7,0% sau khi dùng checklist an toàn phẫu thuật."
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n58
  cau: Một nghiên cứu ở 101 bệnh viện Ontario (Urbach và cộng sự, 2014) không thấy thay đổi đáng kể về tử vong và biến chứng khi áp dụng checklist (tử vong điều chỉnh 0,71% → 0,65%, OR 0,91, khoảng tin cậy 95% 0,80–1,03).
  loai: phat-hien
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n59
  cau: "Đang tranh cãi (chip ở mục 3): dùng checklist cho việc quan trọng lặp đi lặp lại."
  loai: nhan
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n60
  cau: "Gợi ý: với quyết định khó đảo ngược, tạo một khoảng dừng (vài phút đến vài ngày); Kahneman cho rằng không thể liên tục nghi ngờ mọi suy nghĩ, cách tốt nhất là nhận ra tình huống dễ sai và cố gắng hơn khi rủi ro cao."
  loai: loi-khuyen
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n61
  cau: "Gợi ý: viết phương trình ra giấy giúp giải bài toán bóng và chày; trang chưa dẫn nghiên cứu đo hiệu quả của cách làm này."
  loai: loi-khuyen
- trang: kham-pha/tu-duy/tu-duy-nhanh-cham
  id: n62
  cau: 'Hoài nghi với các tuyên bố "mẹo priming": các hiệu ứng priming hành vi gốc còn đang tranh cãi, nên đừng xây thói quen quan trọng dựa trên chúng.'
  loai: loi-khuyen
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t1
  cau: "Mô tả: Kunda (1990) nêu lập luận có động cơ: ta suy luận không như thẩm phán vô tư mà như luật sư bào chữa cho kết luận mình muốn."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t2
  cau: "Mô tả: một số nghiên cứu thấy người giỏi suy luận còn bào chữa giỏi hơn, nhưng bằng chứng này chưa chắc."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t3
  cau: 'Khung "Tự trải nghiệm" (đáp án): phản ứng thường gặp, khớp "thiên kiến phủ nhận" của Taber và Lodge (2006), là phản biện lập luận trái chiều bằng một loạt câu hỏi soi mói, chứ không phải "mình sai rồi".'
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t4
  cau: 'Khi suy luận, ta tìm luận cứ có lợi và đánh giá bất đối xứng: phản biện lập luận trái chiều, dễ dãi với lập luận cùng phe (ẩn dụ "luật sư bào chữa").'
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t5
  cau: Ziva Kunda gọi sự bất đối xứng này là lập luận có động cơ (motivated reasoning) trong bài tổng quan năm 1990.
  loai: lich-su
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t6
  cau: "Điểm tinh tế trong lý thuyết của Kunda: ta không thể tin bất cứ điều gì mình muốn; khả năng đó bị giới hạn bởi khả năng bịa ra một lý do nghe có vẻ hợp lý."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t7
  cau: Lập luận có động cơ còn chi phối, theo Kunda, cả cách ta truy xuất, xây dựng và đánh giá niềm tin; thiên kiến xác nhận là một phần hẹp hơn.
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t8
  cau: Kunda (1990) là bài tổng quan lý thuyết trên Psychological Bulletin, gom nhiều nghiên cứu rải rác về cách động cơ ảnh hưởng đến suy luận thành một khung chung.
  loai: lich-su
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t9
  cau: "Kunda phân biệt hai loại động cơ: đi đến kết luận đúng (accuracy goals) và đi đến kết luận mình muốn (directional goals)."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t10
  cau: "Khi động cơ muốn kết luận X chiếm ưu thế, ta dùng những niềm tin và chiến lược dễ dẫn đến X nhất, qua ba con đường: truy xuất, xây dựng và đánh giá niềm tin, kể cả tìm kiếm thiên lệch trong trí nhớ."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t11
  cau: Ta chỉ tin được điều mình muốn khi nào dựng được một lý do biện minh nghe có vẻ hợp lý ("phanh" của lý thuyết).
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t12
  cau: Chính "phanh" này giải thích vì sao ta vừa thiên lệch vừa luôn cảm thấy mình rất có lý.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t13
  cau: "Taber và Lodge (2006): hai thí nghiệm về cách người ta đánh giá lập luận về chính sách ưu tiên và kiểm soát súng; người tham gia đọc lập luận ủng hộ và phản đối rồi đánh giá chúng."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t14
  cau: Ở một phần của nghiên cứu, người tham gia được tự chọn nguồn của các lập luận mình đọc.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t15
  cau: "Hiệu ứng thái độ có sẵn: lập luận cùng quan điểm sẵn có được đánh giá là mạnh hơn lập luận trái quan điểm."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t16
  cau: "Thiên kiến phủ nhận: người đọc phản biện các lập luận trái chiều và chấp nhận lập luận cùng chiều mà không xét nét."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t17
  cau: "Thiên kiến xác nhận: khi được tự chọn nguồn, người tham gia tìm bằng chứng ủng hộ quan điểm sẵn có."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t18
  cau: Theo các tác giả, cả thiên kiến xác nhận lẫn thiên kiến phủ nhận đều dẫn đến phân cực thái độ (thái độ sau mạnh hơn thái độ trước).
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t19
  cau: Điều này rõ nhất ở những người có quan điểm ban đầu mạnh nhất và am hiểu chính trị nhất.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t20
  cau: "Kahan và cộng sự (2017): khoảng 1.100 người Mỹ trưởng thành (1.111) làm một bài toán suy luận nhân quả từ bảng số liệu 2×2."
  loai: so-lieu
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t21
  cau: Một nhóm thấy dữ liệu được giới thiệu là về thuốc trị ban da mới (chủ đề trung tính); nhóm khác thấy bảng số liệu tương tự được giới thiệu là về lệnh cấm súng.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t22
  cau: Với chủ đề thuốc trị ban da, người có năng lực tính toán cao làm đúng hơn hẳn người thấp.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t23
  cau: Với chủ đề lệnh cấm súng, sự phân cực chính trị không giảm ở nhóm giỏi tính toán mà còn tăng lên.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t24
  cau: "Các tác giả gọi đây là số học có động cơ (motivated numeracy): động cơ bảo vệ bản sắc lái cách đọc số."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t25
  cau: Một lần làm lại lớn có đăng ký trước vẫn thấy người ta đọc số theo phe, nhưng không thấy xu hướng này tăng đều theo năng lực tính toán; nó chỉ rõ ở nhóm tính toán giỏi nhất (Persson và cộng sự, 2021).
  loai: tai-lap
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t26
  cau: "Kahan (2013): khoảng 1.750 người Mỹ làm Bài kiểm tra phản xạ nhận thức (CRT) của Frederick (2005)."
  loai: so-lieu
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t27
  cau: CRT là bài kiểm tra phản xạ nhận thức của Frederick (2005); bài toán bóng và chày là một câu của nó.
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t28
  cau: Sau khi làm CRT, người tham gia được cho biết một nghiên cứu (giả định) thấy người tin hay người không tin vào biến đổi khí hậu đạt điểm CRT cao hơn, rồi được hỏi CRT có đo được sự cởi mở không.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t29
  cau: Người có quan điểm chính trị khác nhau đánh giá CRT khác nhau tùy kết quả được nêu.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t30
  cau: Theo tóm tắt, những người đạt điểm CRT cao nhất lại là những người dễ thể hiện suy luận có động cơ nhất.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t31
  cau: "Tappin, Pennycook và Rand (2021): khi kiểm soát niềm tin có sẵn, bản sắc chính trị vẫn có tác động trực tiếp lên suy luận."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t32
  cau: Tappin, Pennycook và Rand (2021) không thấy bằng chứng rõ rằng sự tinh tường nhận thức làm tăng tác động của bản sắc chính trị lên suy luận.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t33
  cau: "Nhãn Khá vững: ta có xu hướng đánh giá thông tin theo hướng có lợi cho điều mình muốn tin."
  loai: nhan
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t34
  cau: "Ditto và cộng sự (2019): phân tích tổng hợp 51 thí nghiệm, hơn 18.000 người, thấy thiên lệch theo phe rõ (r = 0,245), tương đương ở người thiên tả (r = 0,235) và thiên hữu (r = 0,255)."
  loai: so-lieu
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t35
  cau: "Nhãn Đang tranh cãi: đọc bằng chứng trái chiều có khiến hai phe càng xa nhau không?"
  loai: nhan
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t36
  cau: 'Lord, Ross và Lepper (1979): người ủng hộ và phản đối án tử hình xem hai nghiên cứu (giả định) và báo cáo thái độ chuyển theo hướng ban đầu; "phân cực" là do người tham gia tự báo cáo.'
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t37
  cau: Khi đo thái độ trước và sau, Miller và cộng sự (1993) không thấy phân cực; Kuhn và Lao (1996) thấy phân cực thật là kết quả có thật nhưng hiếm gặp.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t38
  cau: Ba thí nghiệm lớn gần đây không thấy người ta tin chắc hơn sau khi đọc bằng chứng trái chiều (Guess và Coppock, 2020).
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t39
  cau: Điều vững hơn là ta đánh giá bằng chứng thiên lệch về phía mình.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t40
  cau: "Nhãn Đang tranh cãi: ranh giới giữa suy luận có động cơ và đánh giá hợp lý."
  loai: nhan
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t41
  cau: Bago và cộng sự (2023), về biến đổi khí hậu, không thấy hỗ trợ cho việc suy luận nhiều hơn làm tăng tác động của bản sắc chính trị so với các cách giải thích khác.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t42
  cau: "Nhãn Đã bị bác bỏ: cứ đưa đủ sự thật là người ta sẽ đổi ý."
  loai: nhan
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t43
  cau: "Kunda phân biệt hai loại mục tiêu: đúng và đạt kết luận mình muốn; mục tiêu chính xác dùng niềm tin và chiến lược hợp lý nhất, mục tiêu định hướng dùng những cái dễ dẫn đến kết luận mong muốn."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t44
  cau: Theo Kunda, các nghiên cứu thường tạo mục tiêu chính xác bằng cách tăng cái giá của việc phán đoán sai.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t45
  cau: "Nhận thức bảo vệ bản sắc (Kahan): trong các tranh cãi công cộng (biến đổi khí hậu, bạo lực súng đạn, an ninh quốc gia), niềm tin của ta là dấu hiệu lòng trung thành với nhóm; đổi ý đe dọa vị trí trong cộng đồng."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t46
  cau: Theo luận điểm bảo vệ bản sắc, năng lực suy luận được huy động để bảo vệ huy hiệu đó, và người giỏi suy luận có thể bảo vệ giỏi hơn (Kahan và cộng sự, 2017); lần làm lại năm 2021 chưa xác nhận rõ.
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t47
  cau: "Stanovich, West và Toplak (2013): thiên lệch phe mình (myside bias) liên quan rất ít đến trí thông minh; người thông minh hơn không hẳn ít thiên lệch hơn."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t48
  cau: "Gợi ý 1: viết ra một bằng chứng cụ thể mà nếu tồn tại sẽ khiến bạn bỏ quan điểm hiện tại; không nghĩ ra thì có thể nên xem lại mình đang tìm sự thật hay bảo vệ lập trường (gợi ý của site, không phải kết quả nghiên cứu)."
  loai: loi-khuyen
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t49
  cau: "Gợi ý 2 (chip Khá vững): cân nhắc điều ngược lại giúp giảm thiên lệch khi đánh giá bằng chứng."
  loai: nhan
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t50
  cau: Lord, Lepper và Preston (1984) thấy chỉ dẫn "hãy cân nhắc điều ngược lại" giảm thiên lệch khi đánh giá bằng chứng nhiều hơn lời dặn "hãy công bằng".
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t51
  cau: Một nghiên cứu năm 2023 về COVID-19 thấy cân nhắc điều ngược lại sửa được phần nào thiên lệch, dù các cách sửa khác cho kết quả lẫn lộn (Greitemeyer, 2023).
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t52
  cau: Viết ra lập luận mạnh nhất cho quan điểm mình phản đối ("steelmanning") là một cách vận dụng ý này; chúng tôi không tìm thấy nghiên cứu nào kiểm tra riêng cách ấy.
  loai: loi-khuyen
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t53
  cau: 'Gợi ý 3: khi nổi nóng vì một số liệu, tự hỏi giận vì số liệu sai hay vì nó khiến "phe mình" trông tệ; phân biệt được giúp biết mình đang xét số liệu hay bảo vệ bản sắc (gợi ý của site).'
  loai: loi-khuyen
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t54
  cau: 'Gợi ý 4: tìm người cùng quan điểm nhưng có tiếng là công bằng với bằng chứng ("Hệ 2 thuê ngoài").'
  loai: loi-khuyen
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t56
  cau: Taber và Lodge (2006) hỏi về hai chủ đề chính trị Mỹ (kiểm soát súng, chính sách ưu tiên); Kahan và cộng sự (2017) khảo sát người Mỹ trưởng thành; Kunda (1990) là bài tổng quan của một tác giả ở Đại học Princeton (Mỹ).
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t57
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu công bố nào kiểm tra lập luận có động cơ về chính trị hay số học có động cơ trên người Việt.
  loai: thoi-su
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t58
  cau: 'Dự đoán (suy luận của site): nếu niềm tin là dấu hiệu lòng trung thành với nhóm, thì ở những nền văn hóa coi trọng hòa hợp tập thể và "giữ thể diện", động cơ này có thể mạnh hơn; cần nghiên cứu thực nghiệm trên người Việt.'
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t59
  cau: "Ngộ nhận: người thông minh, học cao thì không bị. Stanovich và cộng sự (2013) thấy thiên lệch phe mình liên quan rất ít đến trí thông minh; Kahan (2013) thấy người điểm CRT cao nhất dễ suy luận theo động cơ nhất, nhưng Tappin và cộng sự (2021) không thấy bằng chứng rõ cho việc sự tinh tường làm tăng hiệu ứng này."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t60
  cau: "Ngộ nhận: lập luận có động cơ nghĩa là cố tình nói dối. Không: Kunda mô tả quá trình dựng lý do nghe hợp lý; Kahan (2013) mô tả áp lực này là vô thức (unconscious pressure); người đọc phản biện lập luận trái chiều và chấp nhận lập luận cùng chiều mà không xét nét."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t61
  cau: "Ngộ nhận: chỉ phe bên kia mới thiên lệch. Phân tích tổng hợp 51 thí nghiệm (Ditto và cộng sự, 2019) thấy mức thiên lệch theo phe tương đương ở người thiên tả và thiên hữu."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t62
  cau: 'Ngộ nhận: tin điều vô lý vì thiếu thông tin. Mô hình "thiếu thông tin" một mình không đủ giải thích: người giỏi tính toán hơn không bớt phân cực (Kahan 2017) và người ta vẫn đọc số theo phe (Persson 2021); nhưng thông tin không vô ích (Guess và Coppock 2020 không thấy "phản tác dụng").'
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t65
  cau: "Quiz 1: điểm khác biệt cốt lõi: thẩm phán cân nhắc bằng chứng để đi đến kết luận, còn luật sư đã có sẵn kết luận cần bảo vệ rồi mới đi tìm bằng chứng phục vụ nó; lập luận có động cơ là thứ tự bị đảo ngược."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t66
  cau: 'Quiz 2: theo Kunda (1990), điều giới hạn khả năng "tin điều mình muốn" là khả năng dựng được một lý do biện minh nghe có vẻ hợp lý.'
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t67
  cau: 'Quiz 3: với bảng số liệu về lệnh cấm súng, nhóm giỏi tính toán nhất phân cực mạnh nhất; một lần làm lại năm 2021 chưa xác nhận rõ phần "càng giỏi càng lái khéo".'
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t68
  cau: "Quiz 4: trong Taber và Lodge (2006), thái độ của người tham gia trở nên mạnh hơn trước (phân cực thái độ), rõ nhất ở người có quan điểm ban đầu mạnh nhất và am hiểu chính trị nhất; thiên kiến phủ nhận: phản biện bằng chứng trái chiều, dễ dãi với bằng chứng cùng chiều."
  loai: phat-hien
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t69
  cau: 'Quiz 5: mô hình "thiếu thông tin" không đủ để giải thích, vì người có quan điểm khác nhau đánh giá thông tin lệch theo phe, kể cả người giỏi tính toán; nếu cách đánh giá đã lệch theo phe, thêm thông tin chưa chắc làm người ta đổi ý, nhưng không có nghĩa thông tin vô ích.'
  loai: phat-hien
- trang: kham-pha/tu-duy/dunning-kruger
  id: n56
  cau: "Nhãn Vững chắc: con người nhìn chung tự xếp mình trên mức trung bình."
  loai: nhan
- trang: kham-pha/tu-duy/dunning-kruger
  id: n57
  cau: "Nhãn Khá vững: phản hồi và huấn luyện giúp người yếu tự đánh giá sát hơn (huấn luyện ngắn ở Kruger–Dunning nghiên cứu 4; phản hồi ở Ryvkin và cộng sự 2012)."
  loai: nhan
- trang: kham-pha/tu-duy/dunning-kruger
  id: n59
  cau: "Nhãn Đang tranh cãi: đường cong Dunning–Kruger là hiện tượng tâm lý thật hay nhiễu thống kê."
  loai: nhan
- trang: kham-pha/tu-duy/dunning-kruger
  id: n65
  cau: 'Nhãn Đã bị bác bỏ: đường cong "núi ngu dốt" là đồ thị từ nghiên cứu gốc.'
  loai: nhan
- trang: kham-pha/tu-duy/dunning-kruger
  id: n71
  cau: "Một cách đọc thận trọng: có thể có phần tâm lý thật, nhưng độ lớn của nó trong các đồ thị lan truyền có thể bị phóng đại bởi nhiễu thống kê; chúng tôi không thấy nguồn nào nói hai phía đã đi đến một kết luận chung."
  loai: nhan
- trang: kham-pha/tu-duy/dunning-kruger
  id: n74
  cau: "Chip Khá vững của lời khuyên 2: phản hồi và huấn luyện giúp người yếu tự đánh giá sát hơn."
  loai: nhan
- trang: kham-pha/tu-duy/dunning-kruger
  id: n80
  cau: "Chip Đang tranh cãi của lời khuyên 4: người giỏi cũng có thể ước lượng lệch, nhưng nguyên nhân còn tranh cãi."
  loai: nhan
- trang: kham-pha/tu-duy/dunning-kruger
  id: n61
  cau: Một lần làm lại lớn, khoảng 4.000 người mỗi nghiên cứu, cho thấy người kém ít nhận ra mình làm đúng hay sai hơn ở bài ngữ pháp và suy luận (Jansen và cộng sự, 2021).
  loai: so-lieu
- trang: kham-pha/tu-duy/dunning-kruger
  id: n73
  cau: "Lời khuyên 2: huấn luyện ngắn giúp nhóm yếu nhất nhìn thấy mình rõ hơn (nghiên cứu 4), phản hồi cũng giúp hiệu chỉnh (Ryvkin); áp vào đàn em, nhân viên mới, con cái là sự vận dụng của site: cho họ bài tập có đáp án đúng rõ ràng và phản hồi nhanh."
  loai: loi-khuyen
- trang: kham-pha/tu-duy/dunning-kruger
  id: n27
  cau: "Con số mỗi nghiên cứu hơi khác nhau (ví dụ nghiên cứu 1: nhóm yếu nhất tự xếp ở phân vị 58)."
  loai: so-lieu
- trang: kham-pha/tu-duy/dunning-kruger
  id: n54
  cau: Hiệu ứng better-than-average nhỏ hơn ở người Đông Á so với người Mỹ gốc Âu.
  loai: so-lieu
- trang: kham-pha/tu-duy/dunning-kruger
  id: n90
  cau: "Ngộ nhận: người thông minh miễn nhiễm. Nghiên cứu gốc đo năng lực theo từng lĩnh vực (hài hước, ngữ pháp, logic) và không bàn đến chuyện ai miễn nhiễm; ví dụ bác sĩ giỏi mới vào lĩnh vực đầu tư là giả định."
  loai: phat-hien
- trang: kham-pha/tu-duy/dunning-kruger
  id: n18
  cau: 'Nghiên cứu 1: "đáp án đúng" là mức độ trùng khớp với đánh giá của một nhóm diễn viên hài chuyên nghiệp.'
  loai: phat-hien
- trang: kham-pha/tu-duy/dunning-kruger
  id: n67
  cau: "Gánh nặng kép: cùng một vốn kiến thức vừa để làm đúng, vừa để chấm đúng bài của mình."
  loai: dinh-nghia
- trang: kham-pha/tu-duy/dunning-kruger
  id: n72
  cau: 'Lời khuyên 1: ở lĩnh vực ít phản hồi khách quan, hãy tìm một "bảng điểm" bên ngoài; trong các thí nghiệm hiệu chỉnh, người kém nhất cải thiện nhiều nhất sau phản hồi (Ryvkin và cộng sự, 2012).'
  loai: loi-khuyen
