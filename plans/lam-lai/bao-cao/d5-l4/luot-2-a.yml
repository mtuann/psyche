  nguon: ["https://api.openalex.org/works/doi:10.1037/0022-3514.90.5.751", "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/142C913E7FA9E121277B29E994124EC5/S2398063X18000258a.pdf/div-class-title-the-contact-hypothesis-re-evaluated-div.pdf"]
  trich: "P&T 2006 (713 mẫu); Paluck 2019: 'consistent with Pettigrew and Tropp's (2006) conclusion that contact \"typically reduces prejudice.\" ... interventions directed at ethnic or racial prejudice generating substantially weaker effects'"
  ghi_chu: "Nhãn Vững chắc đạt thước đo (phân tích tổng hợp + cập nhật cùng chiều), có ghi giới hạn."
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
