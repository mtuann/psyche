  nguon: ["https://api.openalex.org/works/doi:10.1037/0022-3514.74.6.1464"]
  trich: "'When instructions oblige highly associated categories ... to share a response key, performance is faster ... This performance difference implicitly measures differential association'; 'Black + pleasant vs. White + pleasant'"
  ghi_chu: "Chỉ đọc được tóm tắt."
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n16
  luot_2: dung
  nguon: ["https://osf.io/download/wt5sv/"]
