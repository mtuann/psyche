  trich: "'large enough to explain discriminatory impacts that are societally significant either because they can affect many people simultaneously or because they can affect single persons repeatedly'"
  ghi_chu: "Bản đọc là bản thảo ngày 2/9/2014 trên OSF."
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n20
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1080/1047840X.2017.1335568", "https://api.osf.io/v2/files/553e57a38c5e4a219919a20e/", "https://api.openalex.org/works/doi:10.1037/a0032734"]
  trich: "Payne 2017: 'implicit biases are widespread and robust on average, yet are unstable across a few weeks'; 'most of the systematic variance in implicit bias is situational'; GBN: hiệu ứng nhỏ có thể lớn ở cấp xã hội"
  ghi_chu: "Nhãn Đang tranh cãi đạt thước đo (hai phân tích tổng hợp, hai cách diễn giải cạnh tranh)."
