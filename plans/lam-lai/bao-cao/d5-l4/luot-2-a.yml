  ghi_chu: "Không mở được toàn văn Allport (1954) (Internet Archive trả 401, mượn có kiểm soát); bài của Sage xác nhận antilocution là hình thức đầu và 'most elementary', nhưng thang năm mức đủ thứ tự chưa kiểm được ở nguồn bậc 1–2."
