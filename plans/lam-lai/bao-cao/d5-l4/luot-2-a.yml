  id: n21
  luot_2: dung
  nguon: ["https://osf.io/download/wt5sv/"]
  trich: "'Black respondents showed a weak preference for White over Black (d = .16)'; explicit 'preference for Black over White (d = .80)'; chú thích 6: bộ dữ liệu thận trọng 'face = -26ms (d = .12) ... Black respondents in the face task switch ... to a slight preference for Black over White'"
  ghi_chu: "Câu khớp; 'ở bài dùng khuôn mặt, xu hướng đảo chiều' đúng ở bộ dữ liệu thận trọng (một IP một lần), không phải toàn bộ."
