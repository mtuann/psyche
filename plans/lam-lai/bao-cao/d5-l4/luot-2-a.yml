  trich: "Vaidis 2024: 39 phòng thí nghiệm, 19 nước, N = 4.898; 'The primary analyses failed to support the core hypothesis: No significant difference ... under high choice compared with low choice.'"
  ghi_chu: "Nhãn Đang tranh cãi đạt thước đo mục 4 (tái lập lớn có đăng ký trước không ủng hộ phần lõi). Lưu ý đợt 2024 thử biến thể 'quyền chọn' (Croyle & Cooper 1983), không thao túng tiền thưởng."
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n16
  luot_2: dung
  nguon: ["http://gala.gre.ac.uk/id/eprint/45716/7/45716_EVANS_A_multilab_replication_of_the_induced_compliance_paradigm_of_cognitive_dissonance.pdf"]
  trich: "'In a total of 39 labs from 19 countries and 14 languages, participants (N = 4,898) ... writing a counterattitudinal essay under high choice, ... low choice, or ... neutral essay'"
  ghi_chu: "4.898 là số tuyển; sau loại trừ còn ít hơn (902 + 112 bị loại, một phòng bị loại hẳn). Đợt này không trả tiền thưởng theo kích cỡ."
