  trich: "GBN 2015: 'Attempts to use such measures diagnostically for individuals therefore risk undesirably high rates of erroneous classifications'; Oswald 2013: IAT là predictor yếu"
  ghi_chu: "Vế 'phe Oswald đồng ý' chỉ có tóm tắt Oswald 2013 (yếu dự đoán), không có câu nói trực tiếp về chẩn đoán cá nhân."
