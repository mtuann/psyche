  id: n24
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Festinger/", "https://openstax.org/books/psychology-2e/pages/12-3-attitudes-and-persuasion"]
  trich: "OpenStax: 'changing our discrepant behavior ... changing our cognitions through rationalization or denial ... adding a new cognition'; FC: tăng tầm quan trọng của lý do (thêm nhận thức hòa hợp)"
  ghi_chu: "Cách thứ tư (coi nhẹ mâu thuẫn) và sự phân loại bốn cách thuộc Festinger 1957, không mở sách; OpenStax nêu ba cách. Phần 'nhóm 1 đô-la đổi niềm tin' khớp bài gốc."
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n25
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Festinger/"]
  trich: "Diễn giải theo lý thuyết (đã ghi rõ trên trang)"
  ghi_chu: "Chỉ nói 'có thể'; không có nguồn thực nghiệm về 'khó đổi ý sau khi chọn' trong bài này, nhưng câu tự ghi là diễn giải lý thuyết."
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n26
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Lời khuyên dựa trên giả định 'ta bênh món đồ vừa mua'; không mở được nguồn bậc 1–2 kiểm điều đó (nguồn cổ điển là mô hình lựa chọn tự do, có tranh cãi về phương pháp). Trang đã ghi 'chưa kiểm trực tiếp'."
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n27
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Lời khuyên 'cho lối thoát giữ thể diện' suy từ lý thuyết, không nguồn bậc 1–2 nào mở được kiểm điều này; trang đã ghi 'chưa kiểm trực tiếp'."
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n28
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Hai vế ('nhận ra cơ chế không giúp hết bất hòa'; 'giúp phân biệt lý do thật với lý do bịa') không có nguồn bậc 1–2 mở được."
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n29
  luot_2: dung
  nguon: ["https://openstax.org/books/psychology-2e/pages/12-3-attitudes-and-persuasion", "http://gala.gre.ac.uk/id/eprint/45716/7/45716_EVANS_A_multilab_replication_of_the_induced_compliance_paradigm_of_cognitive_dissonance.pdf"]
  trich: "OpenStax: 'only conflicting cognitions that threaten individuals' positive self-image cause dissonance (Greenwald & Ronis, 1978)'; Vaidis 2024: không thấy khác biệt giữa quyền chọn cao và thấp"
