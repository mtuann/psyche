  id: n24
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Không mở được toàn văn Tajfel et al. (1971): chỉ có tóm tắt (xác nhận 'favoured their own group ... fairly irrelevant classification'). Chi tiết 'Klee hay Kandinsky, thực tế xếp ngẫu nhiên' chỉ gặp ở nguồn thứ cấp bậc 3."
