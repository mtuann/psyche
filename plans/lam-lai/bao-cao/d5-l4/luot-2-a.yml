  nguon: ["https://api.openalex.org/works/doi:10.1037/0022-3514.90.5.751"]
  trich: "'intergroup contact typically reduces intergroup prejudice. ... appears not to result from either participant selection or publication biases ... generalize to the entire outgroup'"
