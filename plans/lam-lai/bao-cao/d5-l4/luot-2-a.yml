  trich: "Vaidis: khác biệt có ý nghĩa giữa bài trái quan điểm và bài trung tính; khó chịu/xung đột cao hơn nhóm trung tính"
  ghi_chu: "Nhãn Khá vững chấp nhận được (nhiều mô hình cùng chiều, chưa có tái lập lớn phủ nhận phần 'có giảm mâu thuẫn'). Vế 'chưa có tổng hợp chung' không kiểm được đầy đủ, chỉ tìm Crossref ngắn."
