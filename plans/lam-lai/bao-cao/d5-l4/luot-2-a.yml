  trich: "Paluck: 'no randomized study with over-time outcome measurement has systematically varied ... Allport's facilitating conditions'"
  ghi_chu: "Nhãn Khá vững phù hợp thước đo. Giới hạn ở 27 thí nghiệm có đo sau thời gian."
