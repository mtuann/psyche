  id: n17
  luot_2: dung
  nguon: ["https://api.osf.io/v2/files/553e57a38c5e4a219919a20e/", "https://arxiv.org/pdf/2312.14984", "https://api.openalex.org/works/doi:10.1037/a0032734"]
  trich: "GBN 2015: OMBJT 'r = .148' (tập con Black–White, hành vi với nhóm bị kỳ thị); Oswald 2015 (trích trong arXiv 2312.14984): 'the mean correlation between the race IAT and negative microbehaviors ... was only .07, with a 95% confidence interval encompassing zero'; Oswald 2013: IAT 'performed no better than simple explicit measures'"
  ghi_chu: "Số 0,07 đọc qua trích dẫn Oswald 2015 trong arXiv; bài Oswald 2013 chưa mở toàn văn (chỉ tóm tắt). r = 0,148 làm tròn là 0,15, 'khoảng 0,14' chấp nhận được."
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n18
  luot_2: dung
