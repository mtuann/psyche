  trich: "'we assemble all intergroup contact studies that feature random assignment and delayed outcome measures, of which there are 27 in total'; 'the absence of studies addressing adults' racial or ethnic prejudices'"
  ghi_chu: "Vế 'thiếu nghiên cứu về định kiến của người trưởng thành' bài giới hạn ở định kiến chủng tộc/sắc tộc (có 6 nghiên cứu người lớn khác)."
