  trich: "Joseph & Newman 2010, Table 2: EI đo bằng test năng lực với năng lực nhận thức r = .22, ρ = .25 (28 mẫu, N = 5.538)."
  ghi_chu: "Phân tích tổng hợp cùng chiều; 'khá vững' dưới trần."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n66
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf"]
  trich: "Joseph & Newman 2010: ΔR² = .142 (mixed EI) nhưng ≈ .002 cho EI năng lực; Joseph et al. 2015: mixed EI–hiệu suất ρ = .29 và về −.02 sau khi kiểm soát các biến trùng lắp."
  ghi_chu: "Hai phân tích tổng hợp, kết quả phụ thuộc loại EI và biến kiểm soát; nhãn 'đang tranh cãi' hợp lý (thấp hơn trần)."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n70
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf"]
  trich: "Joseph & Newman 2010: tuyên bố 'EI is as strong a predictor of job performance as is IQ (Goleman, 1995)' là 'purported'; ρ với hiệu suất: EI năng lực .18, mixed .47 → .29 (Joseph 2015) rồi −.02 sau kiểm soát."
  ghi_chu: "Hai phân tích tổng hợp không ủng hộ tuyên bố 'tốt nhất, hơn IQ'; bài không đưa số IQ riêng, nhưng đủ cho nhãn bác bỏ phần tuyên bố mạnh này. Phạm vi: hiệu suất công việc, không phải 'thành công trong đời'."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n81
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf"]
  trich: "Joseph & Newman 2010: tự báo cáo và test năng lực chỉ tương quan ρ = .12; 'we caution against their application' (đo mixed/tự báo cáo); Joseph 2015: mixed EI trùng lắp lớn với tính cách, năng lực, tự hiệu quả (R = .79)."
  ghi_chu: "Lời khuyên hợp với bằng chứng về thang tự báo cáo; chưa có nghiên cứu riêng về 'test online'."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n85
  luot_2: qua-manh
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf"]
  trich: "Joseph & Newman 2010: mô hình thác (nhận biết → thấu hiểu → điều tiết → hiệu suất công việc) khớp dữ liệu tổng hợp; 'we have provided only a snapshot of the dynamic process'."
  cau_dung: "Đang tranh cãi: theo mô hình thác (tương quan tổng hợp, về hiệu suất công việc), điều tiết cảm xúc là khâu cuối trong chuỗi; chưa có thử nghiệm huấn luyện cho thấy rèn khâu này giúp làm việc với người khác tốt hơn."
  ghi_chu: "Dữ liệu là tương quan tổng hợp về hiệu suất công việc, không phải về 'làm việc với người khác'; chưa có thử nghiệm huấn luyện. Chỉ hợp ở mức 'đang tranh cãi' (gợi ý)."
