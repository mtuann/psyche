  trich: "Joseph et al. 2015: mixed EI 'strongly overlaps with a set of well-known psychological constructs' vì nội dung thang đo (heterogeneous domain sampling)."
  ghi_chu: "Phần 'yếu tố phương pháp tự báo cáo' là suy luận hợp lý của trang; ví dụ minh họa là ví dụ giả định."
