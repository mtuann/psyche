  trich: "Joseph & Newman 2010: 'we warn that the concept of overall EI ... is of limited conceptual value'; Joseph et al. 2015: kết luận khác nhau theo loại EI."
  ghi_chu: "Lời khuyên hỏi lại 'EQ nào, đo bằng gì' hợp với bằng chứng."
