  trich: "Joseph & Newman 2010 Table 4 (hiệu chỉnh tiêu chí và hạn chế biên độ): EQ test năng lực .17, mixed .42, năng lực nhận thức .40; Joseph et al. 2015: multiple R = .79 với các khái niệm cũ, β = −.02 sau đó; O'Boyle: 'cognitive intelligence is the single best predictor'."
  ghi_chu: "Câu có số mixed (.42) hơi cao hơn IQ (.40) và đã thừa nhận; phạm vi 'chúng tôi không tìm thấy' hợp với các phân tích tổng hợp đã đọc."
