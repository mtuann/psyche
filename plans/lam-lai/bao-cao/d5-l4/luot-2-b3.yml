  nguon: ["https://content.time.com/time/subscriber/article/0,33009,983503,00.html"]
  trich: "Bài bìa Time 2/10/1995: đề phụ 'EMOTIONS, NOT IQ, MAY BE THE TRUE MEASURE OF HUMAN INTELLIGENCE'; Joseph et al. 2015 cho rằng tuyên bố mạnh hơn IQ không được các phân tích tổng hợp ủng hộ."
  ghi_chu: "Không đọc được chữ trên bìa nên không xác nhận được rằng 'thông điệp trên bìa' đúng như trang mô tả (xem n6, n7). Nửa sau (không phải kết luận khoa học) khớp phân tích tổng hợp."
