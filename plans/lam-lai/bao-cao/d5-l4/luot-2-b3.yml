- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n1
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1002%252Fjlac.19345140116.zip/10.1002%252Fjob.714.pdf"]
  trich: "Joseph & Newman 2010: 'application of the EI label to 2 distinct sets of constructs (i.e., ability-based EI and mixed-based EI)', chia thêm theo phương pháp (test hay tự báo cáo); Joseph et al. 2015: ability EI và mixed EI là hai định nghĩa khác nhau; O'Boyle 2011: ba dòng."
  ghi_chu: "Phần 'EQ trên truyền thông' là cách phân loại của trang (xem n6–n9, n71); hai nghĩa đầu khớp tài liệu."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n2
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf"]
  trich: "Joseph & Newman 2010: tương quan hiệu chỉnh với hiệu suất: EQ test năng lực ρ = .18, mixed ρ = .47; Joseph et al. 2015: mixed ρ = .29 và β = −.02 sau kiểm soát."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n3
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.2190.zip/10.2190%252FDUGG-P24E-52WK-6CDG.pdf", "https://doi.org/10.2190/DUGG-P24E-52WK-6CDG"]
  trich: "Salovey & Mayer 1990, Imagination, Cognition and Personality 9(3):185–211: 'This article presents a framework for emotional intelligence, a set of skills hypothesized to contribute to the accurate appraisal and expression of emotion ...'."
  ghi_chu: "Số báo ghi 1989–90, DOI/ghi năm 1990."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n4
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf"]
  trich: "Joseph et al. 2015: 'Propelled by the New York Times bestseller of Daniel Goleman (1995), the concept of emotional intelligence (EI) has gained a great amount of public popularity and business attention'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n5
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf"]
  trich: "Danh mục tham khảo Joseph & Newman 2010 và O'Boyle 2011: 'Goleman, D. (1995). Emotional intelligence: Why it can matter more than IQ'; Joseph et al.: sách thuộc loại 'New York Times bestseller'."
  ghi_chu: "Chức danh 'nhà báo khoa học của New York Times' không có trong nguồn đã mở (kiến thức chung); nhan đề và năm đúng."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n6
  luot_2: khong-chac
  nguon: ["https://content.time.com/time/covers/0,16641,19951002,00.html", "https://content.time.com/time/subscriber/article/0,33009,983503,00.html"]
  trich: "Trang bìa lưu của Time ghi 'Emotional Intelligence | Oct. 2, 1995'; bài bìa của Nancy Gibbs ngày 2/10/1995 có đầu đề 'EMOTIONAL INTELLIGENCE: THE EQ FACTOR'."
  ghi_chu: "Xác nhận được số báo, ngày và chủ đề; dòng chữ trên bìa 'What's Your EQ?' là chữ trong ảnh bìa, không đọc được qua văn bản trang đã mở (bản bài đọc cũng bị cắt)."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n7
  luot_2: khong-chac
  nguon: ["https://content.time.com/time/subscriber/article/0,33009,983503,00.html"]
  trich: "Đề phụ bài bìa Time (Gibbs, 2/10/1995): 'NEW BRAIN RESEARCH SUGGESTS THAT EMOTIONS, NOT IQ, MAY BE THE TRUE MEASURE OF HUMAN INTELLIGENCE'."
  ghi_chu: "Bài nói cảm xúc có thể là thước đo trí thông minh thật sự, nhưng cụm 'yếu tố dự báo thành công trong đời mạnh nhất' trên bìa không đọc được bằng văn bản (chữ trong ảnh bìa)."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n8
  luot_2: khong-chac
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1002%252Fjlac.19345140116.zip/10.1002%252Fjob.714.pdf"]
  trich: "Joseph et al. 2015: 'New York Times bestseller of Daniel Goleman (1995)'; O'Boyle 2011: 'books on EI have been best-sellers'."
  ghi_chu: "Không nguồn bậc 1–2 đã mở nào nêu thời gian 'hơn một năm' trên danh sách bán chạy."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n9
  luot_2: dung
  nguon: ["https://content.time.com/time/subscriber/article/0,33009,983503,00.html"]
  trich: "Bài bìa Time 1995 có đầu đề 'THE EQ FACTOR'; O'Boyle 2011 và Joseph et al. 2015 gọi sách của Goleman là best-seller làm khái niệm phổ biến."
  ghi_chu: "Câu lịch sử khái quát; có dấu vết trên báo chí (Time) nhưng 'lan nhanh' không đo được."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n11
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.97.pdf"]
  trich: "Joseph & Newman 2010: ability-based EI gồm emotion perception, understanding, (facilitation), regulation, đo bằng test chấm đúng/sai theo 'expert or consensus scores' (MSCEIT, MEIS); Mayer et al. 2003: MSCEIT đo bốn nhánh."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n12
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf"]
  trich: "Joseph & Newman 2010: mixed EI đo bằng Bar-On EQ-i (1997), EIS của Schutte và cộng sự (1998) 'self-report'; mixed EI 'overlap somewhat with Big Five' (ρ với ổn định cảm xúc .53, hướng ngoại .46)."
  ghi_chu: "Số 33 câu của thang Schutte không đọc được trong nguồn đã mở; phần còn lại khớp."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n13
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1002%252Fjlac.19345140116.zip/10.1002%252Fjob.714.pdf"]
  trich: "Joseph & Newman 2010: EQ test năng lực ρ = .18 với hiệu suất; O'Boyle 2011: ba dòng ρ = .24–.30 và 'cognitive intelligence is the single best predictor of job performance'; Joseph et al. 2015: mixed EI β = −.02 sau kiểm soát."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n14
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf"]
  trich: "Joseph & Newman 2010: 'we warn that the concept of overall EI ... is of limited conceptual value due to inconsistent and low correlations among some types of EI measures'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n15
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.2190.zip/10.2190%252FDUGG-P24E-52WK-6CDG.pdf"]
  trich: "Salovey & Mayer 1990: tóm tắt 'a framework for ... we start by reviewing the debate ... then explore the literature ... A framework for integrating the research on emotion-related skills is then described'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n18
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.2190.zip/10.2190%252FDUGG-P24E-52WK-6CDG.pdf"]
  trich: "'We define emotional intelligence as the subset of social intelligence that involves the ability to monitor one's own and others' feelings and emotions, to discriminate among them and to use this information to guide one's thinking and actions.'"
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n19
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.2190.zip/10.2190%252FDUGG-P24E-52WK-6CDG.pdf"]
  trich: "Abstract: 'the accurate appraisal and expression of emotion in oneself and in others, the effective regulation of emotion in self and others, and the use of feelings to motivate, plan, and achieve in one's life'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n20
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.97.pdf"]
  trich: "Joseph & Newman 2010: 'EI can be broken down into four subdimensions ... (Mayer & Salovey, 1997)'; Mayer et al. 2003: 'four branches ... (Mayer & Salovey, 1997)', MSCEIT dựa trên mô hình đó."
  ghi_chu: "1997 − 1990 = bảy năm; 'phiên bản chuẩn của EQ năng lực' là cách mô tả của trang, hợp với việc các tài liệu đều trích Mayer & Salovey 1997."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n22
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.97.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf"]
  trich: "Mayer et al. 2003: 'The MSCEIT and its predecessors are based on the idea that EI involves problem solving with and about emotions'; Joseph & Newman 2010: ability EI 'scored by marking questions as correct or incorrect'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n23
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.97.pdf"]
  trich: "MSCEIT: 'four branches ...: (a) perceiving emotion accurately, (b) using emotion to facilitate thought, (c) understanding emotion, and (d) managing emotion'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n24
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1002%252Fjlac.19345140116.zip/10.1002%252Fjob.318.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf"]
  trich: "Locke 2005: 'Following Salovey and Mayer, Daniel Goleman (1995) popularized the concept of EI. According to Goleman, EI involves: self-motivation and persistence; skill at introspection; delay of gratification; self-control of impulses ... empathy; and social skills'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n26
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf"]
  trich: "Joseph & Newman 2010: mixed EI là 'inclusive, compound conceptualizations ... a grab bag of other concepts that are only loosely connected'; 'lack of scientific rigor often associated with mixed-based models'."
  ghi_chu: "'Hấp dẫn với công chúng' là nhận xét của trang; 'khó kiểm chứng' khớp bình luận 'lack of scientific rigor'."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n27
  luot_2: khong-chac
  nguon: ["https://content.time.com/time/subscriber/article/0,33009,983503,00.html"]
  trich: "Bản bài bìa Time của Gibbs (2/10/1995) đọc được không có tên Goleman; đầu đề có 'THE EQ FACTOR'."
  ghi_chu: "Bài chỉ đọc được một đoạn đầu (bị cắt), nên không xác nhận được câu 'Time ghi Goleman không hề dùng chữ EQ trong sách'."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n28
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.97.pdf"]
  trich: "Mayer et al. 2003: MSCEIT V2.0 'ability scale', tám nhiệm vụ (Perceiving, Facilitating, Understanding, Managing), chấm theo tiêu chí số đông hay chuyên gia; không phải tự đánh giá."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n29
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.97.pdf"]
  trich: "Mayer et al. 2003: 'Twenty-one emotions experts endorsed many of the same answers, as did 2,112 members of the standardization sample'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n30
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.97.pdf"]
  trich: "'general consensus' của mẫu chuẩn hóa và 'expert consensus' (21 chuyên gia ISRE): 'MHS scores the test on the basis of the standardization sample and expert criteria'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n31
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.97.pdf"]
  trich: "Abstract: 'Twenty-one emotions experts endorsed many of the same answers, as did 2,112 members of the standardization sample, and exhibited superior agreement, particularly when research provides clearer answers to test questions (e.g., emotional perception in faces).'"
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n32
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.97.pdf"]
  trich: "'The MSCEIT full-test split-half reliability is r(1985) = .93 for general and .91 for expert consensus scoring'; abstract: 'reasonable reliability'."
  ghi_chu: "Số đo cao hơn 'chấp nhận được' nhưng không trái câu."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n33
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.97.pdf"]
  trich: "'There was a progressively better fit of models from the one- to the four-factor model, but all fit fairly well'; RMSEA .12 (một nhân tố) đến .05 (bốn nhân tố)."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n34
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.97.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf"]
  trich: "Mayer et al. 2003: độ tin cậy 'reasonable', cấu trúc bốn nhân tố khớp; Joseph & Newman 2010: nhưng test năng lực dự báo hiệu suất chỉ ρ = .18."
  ghi_chu: "Câu đánh giá: bài 2003 là bằng chứng về độ tin cậy và cấu trúc, không phải về tính hợp lệ; chấp nhận ở mức 'một bằng chứng quan trọng'."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n36
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf"]
  trich: "Joseph & Newman 2010: 'Emotional Intelligence: An Integrative Meta-Analysis and Cascading Model' (Psychol Bull); 'They specify a progressive (cascading) pattern ... emotion perception must causally precede emotion understanding, which in turn precedes conscious emotion regulation and job performance'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n37
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf"]
  trich: "Như n36; 'The cascading model of EI is empirically confirmed via meta-analytic data'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n38
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf"]
  trich: "Joseph & Newman 2010: perception → understanding → regulation → job performance; 'much of the relationship between emotion perception and emotion regulation is mediated by emotion understanding'; trong mô hình chỉ regulation có đường thẳng tới hiệu suất."
  ghi_chu: "Mô hình giả định gián tiếp; dữ liệu cũng cho thấy một đường trực tiếp nhỏ perception → regulation (β = .10)."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n39
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf"]
  trich: "Table 2: EQ test năng lực, việc nhiều lao động cảm xúc: k = 4, N = 220, r = .22 (ρ = .24)."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n40
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf"]
  trich: "Table 2: việc ít lao động cảm xúc: k = 3, N = 223, r = .00 (ρ = .01); Table 5c (kiểm soát Big Five và năng lực nhận thức): β = −.14 cho EQ test năng lực ở việc ít lao động cảm xúc, ΔR² = .017."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n41
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf"]
  trich: "Table 2: mixed EI ρ = .59 (nhiều) / .43 (ít lao động cảm xúc); EQ năng lực tự báo cáo ρ = .28 / .20; EQ test năng lực ρ = .24 / .01. Abstract: 'EI positively predicts performance for high emotional labor jobs and negatively predicts performance for low emotional labor jobs'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n42
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf"]
  trich: "Joseph & Newman 2010: 'examples of low emotional labor jobs include ... cigarette factory worker, Air Force mechanic, and research and development scientist; ... high emotional labor jobs are retail salesperson, real estate agent, call center employee'."
  ghi_chu: ""
