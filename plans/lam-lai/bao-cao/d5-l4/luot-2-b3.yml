  trich: "Joseph & Newman 2010: chỉ có phân tích điều tiết theo lao động cảm xúc (nhiều: k = 4, N = 220; ít: k = 3, N = 223); O'Boyle 2011 không kiểm điều tiết này (Q cho ba dòng EI với hiệu suất = 1,44, ns)."
  cau_dung: "Joseph và Newman (2010) thấy EQ năng lực dự báo hiệu suất ở việc nhiều lao động cảm xúc (r = .22; 4 nghiên cứu, N = 220) nhưng không ở việc ít lao động cảm xúc (r = .00; 3 nghiên cứu, N = 223); mẫu nhỏ, chưa có tái lập độc lập."
  ghi_chu: "'Các nghiên cứu cùng thấy' nói quá: chỉ một phân tích tổng hợp, mỗi nhóm 3–4 nghiên cứu, chưa tái lập độc lập."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n71
