  luot_2: khong-chac
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf"]
  trich: "Joseph & Newman 2010 nhắc 'Petrides & Furnham, 2001' khi định nghĩa mixed EI là 'a combination of intellect and various measures of personality and affect'."
  ghi_chu: "Không mở được Petrides & Furnham 2001, nên không xác nhận được rằng họ đề xuất tên 'trait EI' và xem nó là khía cạnh của tính cách."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n77
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/18793038/"]
  trich: "Mayer, Salovey & Caruso 2008 (abstract): 'a schism has developed in which some researchers focus on EI as a distinct group of mental abilities, and other researchers instead study an eclectic mix of positive traits such as happiness, self-esteem, and optimism ... EI—conceptualized as an ability—is an important variable'."
  ghi_chu: "Chỉ đọc tóm tắt (PubMed)."
