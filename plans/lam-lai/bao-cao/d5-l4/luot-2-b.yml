  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/9457784/"]
  trich: "Ví von tóm các điều trên (xem n8, n9, n20)."
  ghi_chu: "Ẩn dụ, không thêm khẳng định mới."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n11
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22582737/"]
  trich: "Webb et al. 2012 dùng taxonomy từ mô hình quá trình: attentional deployment, cognitive change, response modulation (cùng situation selection/modification trong mô hình Gross)."
  ghi_chu: "Nhãn hình (chọn tình huống, làm đổi tình huống) khớp tên chiến lược trong mô hình; chỉ đọc tóm tắt Webb."
