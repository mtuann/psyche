- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n1
  luot_2: dung
  nguon: ["https://doi.org/10.1126/science.164.3875.86", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf", "https://doi.org/10.1177/1529100619832930", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/"]
  trich: "Ekman et al. 1969: \"Observers in both literate and preliterate cultures chose the predicted emotion for photographs of the face\"; mẫu New Guinea là người Fore. Barrett et al. 2019: \"It is not possible to confidently infer happiness from just a smile, anger from a scowl, or sadness from a frown\"."
  ghi_chu: "Mô tả khớp với bài gốc: 1969 có mẫu Fore; sáu loại cảm xúc; Barrett 2019 phê bình quan niệm nét mặt là biểu hiện chuẩn."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n2
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf"]
  trich: "Table 1: US vui 97%, sợ 88%, giận 69%, ghê tởm 82%, ngạc nhiên 91%, buồn 73%; Brazil và Japan tương tự; nhãn thường gặp nhất trùng nhãn dự kiến ở 30/30 (Mỹ, Brazil) và 29/30 (Nhật) ảnh."
  ghi_chu: "Đọc toàn văn Science 1969 (bản trong kho Internet Archive)."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n3
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fh0030377.pdf"]
  trich: "Table 1: ở Nhật, nét mặt sợ được gọi 'sợ' 71%, 'ngạc nhiên' 26%; ở Fore, nét mặt ngạc nhiên bị gọi 'sợ' 45%. Ekman & Friesen 1971: người Fore không phân biệt được sợ với ngạc nhiên."
  ghi_chu: "Câu hợp với dữ liệu; mô tả hình ('mắt trợn tròn miệng há') là mô tả của trang, không có trong bài gốc."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n4
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fh0030377.pdf"]
  trich: "Ekman et al. 1969 (nhận bài 22/10/1968): 'The New Guinea sample was the Fore ... who until 12 years ago were an isolated Neolithic material culture'. Ekman & Friesen 1971 (nhận 29/1/1970) làm thực địa ở Đông Nam cao nguyên New Guinea."
  ghi_chu: "Thời điểm thực địa 1967–69 (bài nộp 1968) khớp 'cuối thập niên 1960'."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n5
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf"]
  trich: "Abstract/Intro 1969: các tác giả đặt kết quả đối lập với 'the theory that facial displays of emotion are socially learned and therefore culturally variable'; cho rằng nếu nhận dạng giống nhau xuyên văn hóa thì đó là yếu tố chung (pan-cultural) gắn với tiến hóa (Darwin)."
  ghi_chu: "Câu nêu logic suy luận của nghiên cứu, không phải số liệu; 'phần cứng sinh học' là cách diễn đạt của trang."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n6
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf"]
  trich: "1969: 'our findings support Darwin's (4) suggestion that facial expressions of emotion are similar among humans, regardless of culture, because of their evolutionary origin'; tài liệu 4 = Darwin 1872, The Expression of the Emotions in Man and Animals."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n7
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fh0030377.pdf"]
  trich: "1969 phản bác 'the theory (1) that facial displays of emotion are socially learned and therefore culturally variable' (Klineberg 1940; La Barre 1947). 1971: Birdwhistell (1963) và LaBarre (1947) 'argued against the possibility of any universals'."
  ghi_chu: "'Nhiều học giả' hơi khái quát nhưng khớp với cách bài gốc mô tả lập trường đối lập."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n8
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf"]
  trich: "1969: 'The observers' task was to select a word from a list of six affects for each picture' (cùng bộ ảnh cho các nhóm)."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n9
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fh0030377.pdf"]
  trich: "1971: 'Members of the Fore ... of the South East Highlands of New Guinea ... Until 12 years ago, this was an isolated, Neolithic, material culture'; 1969 nhận 22/10/1968, 12 năm trước tính ra khoảng 1956–58."
  ghi_chu: "Khoảng giữa đến cuối thập niên 1950; 'cuối thập niên 1950' là cách nói gần đúng."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n10
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fh0030377.pdf"]
  trich: "1969: 'We report in detail only on the most Westernized Fore' (tóm tắt nhóm ít Tây hóa hơn). 1971: chỉ nhận người 'had seen no movies, neither spoke nor understood English or Pidgin, had not lived in any of the Western settlement or government towns'."
  ghi_chu: "Lưu ý: 1969 cũng có nghiên cứu nhóm Fore ít Tây hóa nhưng chỉ tóm tắt; 'mới chọn riêng' ở 1971 vẫn đúng ở mức báo cáo chi tiết."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n11
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf"]
  trich: "1969: 30 ảnh người da trắng (Caucasian) làm slide hay ảnh in; 5 mẫu: Mỹ, Brazil, Nhật, New Guinea, Borneo."
  ghi_chu: "Với mẫu tiền biết chữ, 'a few photographs, mostly happy pictures, were eliminated' (23–24 trên 30 ảnh): cùng bộ ảnh nhưng rút gọn."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n12
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf"]
  trich: "1969: 'In the United States, Brazil, and Japan, slides were projected ... to groups of freshmen college students'; các cột Mỹ, Brazil, Nhật là mẫu biết chữ."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n13
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf"]
  trich: "1969: mẫu New Guinea gồm hai nhóm con: 'one subsample ... using Pidgin translations of the affect terms, and the other ... the affect terms of their own Fore language'; mẫu Borneo là người Sadong (Bidayuh)."
  ghi_chu: ""
