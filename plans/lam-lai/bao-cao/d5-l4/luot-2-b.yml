  nguon: ["https://pubmed.ncbi.nlm.nih.gov/10981843/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "'suppression led to poorer memory for the details of the film'; Study 2: 'Only suppression led to poorer slide memory'; Butler: 'suggests increases in cognitive load'."
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
