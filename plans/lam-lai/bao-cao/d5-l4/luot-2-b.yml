  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22582737/"]
  trich: "Như n11: situation modification."
  ghi_chu: "Chỉ đọc tóm tắt."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n13
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22582737/"]
  trich: "Webb 2012: 'Attentional deployment had no effect on emotional outcomes (d+ = 0.00)'; 7 loại attentional deployment."
  ghi_chu: "Chỉ đọc tóm tắt; chú ý rằng attentional deployment (can thiệp sớm) gộp lại d+ = 0,00, nên 'càng sớm càng hiệu quả' không phải quy tắc thực nghiệm chung."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n14
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22582737/"]
  trich: "Webb 2012: cognitive change 'small-to-medium effect (d+ = 0.36)'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n15
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22582737/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "Butler 2003/Gross: bốn mắt xích đầu là antecedent-focused; response modulation là response-focused."
  ghi_chu: "'Càng sớm càng đổi được quỹ đạo' là lập luận lý thuyết của mô hình; Webb 2012 cho attentional deployment d+ = 0,00 nên không phải quy luật thực nghiệm. Giữ dung vì chú thích hình viết như dự đoán của mô hình."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n16
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/9457784/"]
  trich: "Gross 1998: 'To test this distinction, 120 participants were shown a disgusting film while their experiential, behavioral, and physiological responses were recorded.' (Stanford)."
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
