  trich: "Table 1, cột Fore: nét mặt ngạc nhiên '45 F' (gọi 'sợ' 45%), nét mặt buồn '56 A' (gọi 'giận' 56%)."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n18
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf"]
  trich: "Table 1: vui = 97 (Mỹ), 97 (Brazil), 87 (Nhật), 99 (Pidgin), 82 (Fore), 92 (Borneo); ở Nhật ngạc nhiên cũng 87."
  ghi_chu: "Cao nhất hoặc ngang cao nhất ở cả sáu nhóm; khoảng 82–99%."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n19
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf"]
  trich: "Table 1: Fore ghê tởm 44% (30% gọi giận), sợ 54% (25% gọi giận), giận 50%; Pidgin ghê tởm 29% (23% giận), sợ 46% (31% giận)."
  ghi_chu: "Sợ lẫn với giận khớp ở nhóm Fore; sợ lẫn với ngạc nhiên thấy ở Nhật (26%) và Borneo (33%), còn ở Fore chiều ngược lại (ngạc nhiên bị gọi sợ). Không đổi nhãn."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n20
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf"]
  trich: "Table 1, ba mẫu biết chữ: thấp nhất 63% (giận, Nhật), cao nhất 97% (vui, Mỹ và Brazil)."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n21
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf"]
  trich: "Abstract: 'the pan-cultural element in facial displays of emotion is the association between facial muscular movements and discrete primary emotions, although cultures may still differ in what evokes an emotion, in rules for controlling the display of emotion, and in behavioral consequences'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n22
  luot_2: dung
