  id: n72
  luot_2: khong-chac
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/12916575/"]
  trich: "Tóm tắt Gross & John 2003 xác nhận 'suppression is associated with worse interpersonal functioning' và cảm xúc tích cực ít hơn, tiêu cực nhiều hơn, tương quan."
  ghi_chu: "Chi tiết 'các tác giả gợi ý vì họ thấy mình không thật, ngại chia sẻ, bạn bè nhận ra' không xác nhận được (chưa mở toàn văn)."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n17
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.2190.zip/10.2190%252FDUGG-P24E-52WK-6CDG.pdf", "https://doi.org/10.2190/DUGG-P24E-52WK-6CDG"]
  trich: "Salovey & Mayer 1990: 'Is \"emotional intelligence\" a contradiction in terms? One tradition in Western thought has viewed emotions as disorganized interruptions of mental activity, so potentially disruptive that they must be controlled.'"
  ghi_chu: "Bài báo = Salovey & Mayer 1990, Imagination, Cognition and Personality 9(3):185–211."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n112
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf"]
  trich: "Joseph & Newman 2010: ba cặp construct–method: 'performance-based ability EI, self-report ability EI, and self-report mixed EI'; Joseph et al. 2015: 'ability EI and mixed EI' là hai khái niệm khác nhau, mixed EI dự báo hiệu suất r = .29."
  ghi_chu: "Câu loại ve-site (không qua lượt 2; review kiểm trên trang); ghi để đối chiếu: ý 'EQ chỉ ba khái niệm' khớp Joseph & Newman 2010."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n10
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1002%252Fjlac.19345140116.zip/10.1002%252Fjob.318.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf"]
  trich: "Locke 2005: 'the concept of emotional intelligence (EI) is invalid ...'; Joseph & Newman 2010: 'critics remain dubious on the definition and measurement of EI' (Landy 2005; Locke 2005; Murphy 2006)."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n16
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.2190.zip/10.2190%252FDUGG-P24E-52WK-6CDG.pdf"]
  trich: "Salovey & Mayer 1990: 'E. L. Thorndike originally distinguished social intelligence from other forms of intelligence' (Thorndike, Intelligence and Its Uses, Harper's Magazine 1920)."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n21
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf"]
  trich: "Joseph & Newman 2010: 'According to the ability-based model, EI can be broken down into four subdimensions: emotion perception, emotion understanding, emotion facilitation, and emotion regulation (Mayer & Salovey, 1997)'."
  ghi_chu: "Ví dụ 'niềm vui giúp lên kế hoạch bữa tiệc' là minh họa của trang; cấu trúc bốn nhánh đúng (Mayer & Salovey 1997)."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n25
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1002%252Fjlac.19345140116.zip/10.1002%252Fjob.318.pdf"]
  trich: "Locke 2005: 'According to Goleman, EI involves: self-motivation and persistence; skill at introspection; delay of gratification; self-control of impulses, moods and emotions; empathy; and social skills (the ability to make friends).'"
  ghi_chu: "Locke còn thêm 'skill at introspection' (câu của trang liệt kê một phần)."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n59
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf"]
  trich: "Joseph & Newman 2010: self-report mixed EI với Emotional Stability ρ = .53, Extraversion .46, Agreeableness .43, Conscientiousness .38; Joseph et al. 2015: 'the content of mixed EI measures strongly overlaps with a set of well-known psychological constructs (... Conscientiousness, Emotional Stability, Extraversion ...; multiple R = .79)'."
  ghi_chu: "Có hai phân tích tổng hợp cùng chiều; nhãn 'vững chắc' đạt thước đo cho chính khẳng định 'EQ tự báo cáo (mixed) trùng lắp lớn với Big Five'."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n35
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf"]
  trich: "Joseph & Newman 2010: MSCEIT/MEIS 'scored by marking questions as correct or incorrect based on expert or consensus scores'; MacCann, Roberts, Matthews & Zeidner 2004 (Consensus scoring and empirical option weighting) là nghiên cứu về chính vấn đề này."
  ghi_chu: "Câu hỏi tu từ về cách tính điểm đồng thuận; có cơ sở trong phê bình có thật, không phải khẳng định đo được."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n46
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf"]
  trich: "Joseph & Newman 2010: ΔR² = .142 cho mixed EI sau khi kiểm soát Big Five và năng lực nhận thức (Joseph et al. 2015: 'R2 = .142 = 14%'); kết luận: 'the lack of conceptual clarity in mixed EI models leads us to caution against their application in organizations'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n86
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf"]
  trich: "Joseph & Newman 2010: mô hình thác: nhận biết cảm xúc → thấu hiểu → điều tiết có ý thức → hiệu suất; 'The cascading model of EI is empirically confirmed via meta-analytic data'; 'we have provided only a snapshot of the dynamic process'."
  ghi_chu: "Câu tự ghi là gợi ý từ mô hình tổng hợp tương quan; đúng."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n83
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf"]
  trich: "Joseph & Newman 2010: 'the attenuation-corrected correlation between self-report ability EI and performance-based ability EI is only .12'."
  ghi_chu: "Đây là hệ số đã hiệu chỉnh suy giảm (ρ = .12, 14 mẫu, N = 2.426)."
