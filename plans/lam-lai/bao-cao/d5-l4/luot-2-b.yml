  id: n17
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/9457784/"]
  trich: "'(a) think about the film in such a way that they would feel nothing (reappraisal ...), (b) behave in such a way that someone watching them would not know they were feeling anything (suppression ...), or (c) watch the film (a control condition)'."
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n18
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/9457784/"]
  trich: "'Compared with the control condition, both reappraisal and suppression were effective in reducing emotion-expressive behavior.'"
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
