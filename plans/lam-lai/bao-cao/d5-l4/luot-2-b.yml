  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/"]
  trich: "Barrett 2019: 'It is not possible to confidently infer happiness from just a smile ...'; có hạn chế về tin cậy và đặc hiệu."
