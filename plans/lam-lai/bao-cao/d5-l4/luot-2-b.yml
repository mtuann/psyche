- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n1
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/9457784/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "Gross 1998 (tóm tắt): 'both reappraisal and suppression were effective in reducing emotion-expressive behavior. However, reappraisal decreased disgust experience, whereas suppression increased sympathetic activation'; Butler 2003: 'suppressing emotion expressions in response to ... a disgusting ... film (Gross, 1998a ...) did not alter the experiences of those negative emotions'."
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n2
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/10981843/", "https://pubmed.ncbi.nlm.nih.gov/12916575/"]
  trich: "Richards & Gross 2000: kìm nén dẫn tới trí nhớ kém hơn; Gross & John 2003: kìm nén đi cùng 'worse interpersonal functioning'."
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
