  trich: "Butler 2003: 'the process of consciously inhibiting emotional expressions while emotionally aroused has been referred to as expressive suppression'; 'response-focused emotion regulation because it selectively down-regulates the behavioral component of an emotional response after the emotional response is already underway'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n5
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf", "https://pubmed.ncbi.nlm.nih.gov/9457784/"]
  trich: "Butler 2003: 'cognitive reappraisal, which entails altering how a situation is construed so as to change its emotional impact (Gross, 1998b)'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n6
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/9457784/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "Gross 1998: reappraisal và suppression 'may have different adaptive consequences' dù cả hai giảm biểu hiện bên ngoài."
  ghi_chu: "'Khác nhau rất xa' hơi mạnh; ý chính (khác nhau về cái giá dù bên ngoài giống nhau) đúng."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n7
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22582737/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "Webb et al. 2012: chiến lược 'derived from the process model of emotion regulation' gồm attentional deployment, cognitive change, response modulation; Butler 2003: mô hình phân biệt các dạng điều tiết 'on the basis of when they have their primary impact on the emotion-generative process'."
  ghi_chu: "Chỉ đọc tóm tắt Webb; mô tả năm họ chiến lược (chọn/sửa tình huống, chú ý, đánh giá, phản ứng) là mô hình của Gross, khớp với taxonomy Webb."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n8
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/9457784/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "Gross 1998: reappraisal là 'antecedent-focused'; reappraisal giảm trải nghiệm ghê tởm."
  ghi_chu: ""
