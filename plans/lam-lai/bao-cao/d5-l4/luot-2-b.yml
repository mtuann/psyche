  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22582737/", "https://pubmed.ncbi.nlm.nih.gov/12916575/"]
  trich: "Webb 2012: suppressing expression d+ = 0,32; Gross & John 2003: thói quen kìm nén đi cùng hậu quả (tương quan)."
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n68
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/9457784/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "Gross 1998: 'both reappraisal and suppression were effective in reducing emotion-expressive behavior. However, reappraisal decreased disgust experience, whereas suppression increased sympathetic activation.'"
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n69
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22582737/", "https://pubmed.ncbi.nlm.nih.gov/9457784/"]
  trich: "Webb 2012: cognitive change d+ = 0,36 > response modulation d+ = 0,16; Gross 1998 antecedent-focused vs response-focused."
  ghi_chu: "'Thường hiệu quả hơn' khớp Webb; lưu ý attentional deployment (sớm) d+ = 0,00."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
