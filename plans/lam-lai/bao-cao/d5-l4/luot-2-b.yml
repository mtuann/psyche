  id: n9
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/9457784/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "Butler 2003: suppression 'selectively down-regulates the behavioral component ... after the emotional response is already underway'; 'suppressing negative emotion expressions does not decrease negative emotion experience'."
