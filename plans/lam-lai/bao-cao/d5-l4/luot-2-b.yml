  id: n38
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/"]
  trich: "Barrett 2019: 'Since 2008, 10 verifiably separate experiments observing emotional inferences in small-scale societies have been published ... Only one study (Tracy & Robins, 2008) reported that participants selected an emotion word ... more reliably than ... chance ... weak to moderate levels of reliability' ở Crivelli và cộng sự."
  ghi_chu: "Theo cách Barrett và cộng sự tóm tắt (một tổng quan có chủ ý phê bình); các tác giả khác có thể đọc bằng chứng này khác."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n39
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.128.2.203.pdf"]
  trich: "In-group advantage: 80,2% (146/182) kết quả cho chính xác hơn với người cùng nhóm; trung bình +9,3% (r = .55); nhưng thu hẹp khi tiếp xúc nhiều hơn."
  ghi_chu: "'Khá vững' nằm dưới trần (có phân tích tổng hợp, còn hạn chế về thiết kế và giải thích); không vượt thước đo."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n40
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.128.2.203.pdf"]
  trich: "Sign test: 146/182 (80,2%) kết quả có lợi thế nhóm; 'the in-group advantage was found consistently among groups that share the same native language'."
  ghi_chu: "'Ổn định' hợp ở mức dấu của hiệu ứng; độ lớn thay đổi theo mức tiếp xúc."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n41
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22509011/"]
  trich: "Jack et al. 2012: biểu diễn tinh thần về nét mặt khác nhau giữa người phương Tây và Đông Á."
  ghi_chu: "Câu tự ghi là hướng giải thích chưa kiểm chứng riêng; hợp với phạm vi tóm tắt."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n42
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.128.2.203.pdf"]
  trich: "Barrett 2019: 'Critiques of Ekman's basic emotion view ... are numerous'; Elfenbein & Ambady 2002 cũng nêu mô hình tương tác (vừa phổ quát vừa đặc thù văn hóa)."
  ghi_chu: "Nhãn 'đang tranh cãi' phù hợp: có bằng chứng chất lượng cao ở cả hai phía."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n43
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fh0030377.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf"]
  trich: "1971: phổ quát có thể do 'evolution, innate neural programs, or learning experiences common to human development'; 1969: ủng hộ gợi ý của Darwin về nguồn gốc tiến hóa."
  ghi_chu: "Mô tả quan điểm; không phải khẳng định về sự thật."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n44
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC5390700/"]
  trich: "Barrett 2019: nét mặt 'are not fingerprints or diagnostic displays'; Barrett 2017 (Theory of Constructed Emotion): não dựng phạm trù cảm xúc dựa trên nội cảm giác và khái niệm."
  ghi_chu: "Mô tả quan điểm của Barrett."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n45
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.128.2.203.pdf"]
  trich: "Barrett 2019 tự nhận phần lớn bằng chứng ủng hộ 'common view' từ thiết kế chọn-từ-danh-sách; Elfenbein & Ambady 2002 trình bày cả phổ quát lẫn đặc thù văn hóa."
  ghi_chu: "Nhận định tổng quát, không có thước đo định lượng; đúng như mô tả của hai tổng quan."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n46
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fh0030377.pdf"]
  trich: "1969: Tomkins 'postulated innate subcortical programs linking certain evokers to distinguishable, universal facial displays for each of the primary affects'; 'display rules' học được ở từng văn hóa."
  ghi_chu: "Định nghĩa thuộc lý thuyết cảm xúc cơ bản của Ekman; chưa mở bài Ekman 1992 'An argument for basic emotions', dựa vào bài 1969 và 1971."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n47
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC5390700/"]
  trich: "Barrett 2017: 'a brain-based, computational account called the theory of constructed emotion' (nội cảm giác, dự đoán, phạm trù)."
  ghi_chu: "Câu về nội dung sách How Emotions Are Made 2017; kiểm bằng bài học thuật cùng thuyết (SCAN 2017)."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n48
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/"]
  trich: "Barrett 2019: 'there is no relationship between an emotion category ... and a single, specific set of physical changes in ANS ... blood pressure can go up, go down, or stay the same'; fear gồm 'freezing or fleeing or even attacking'."
  ghi_chu: "Ví dụ 'toát mồ hôi im lặng/la hét' là minh họa của trang."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n49
  luot_2: dung
  nguon: ["https://doi.org/10.1177/1529100619832930", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/"]
  trich: "Barrett, Adolphs, Marsella, Martinez, Pollak (2019), Psychol Sci Public Interest 20(1):1–68."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n50
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/"]
  trich: "Barrett 2019: 'The research findings do not imply that people move their faces randomly'; meta-phân tích Duran: 'In all emotion categories tested, other than fear, participants moved their facial muscles into the expected configuration more consistently than ... chance. Consistency levels were weak'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n51
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/"]
  trich: "Barrett 2019: 'It is not possible to confidently infer happiness from just a smile, anger from a scowl, or sadness from a frown'."
  ghi_chu: "Nhãn 'đang tranh cãi' phù hợp (còn phe Keltner/Cordaro phản bác); là nhãn thấp hơn trần."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n52
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/"]
  trich: "Barrett 2019: 'scowling not in anger, but in confusion or concentration'; nét mặt không đặc hiệu một cảm xúc."
  ghi_chu: "'Đau đầu' là ví dụ thêm của trang."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n53
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/"]
  trich: "Barrett 2019: 'Technology companies are investing tremendous resources to figure out how to objectively read emotions ... their technology detects facial movements, not emotional expressions.'"
  ghi_chu: "Nhãn 'đang tranh cãi' là nhãn thấp hơn trần."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n54
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/"]
  trich: "Barrett 2019 (abstract): giả định này 'influences legal judgments, policy decisions, national security protocols, and educational practices ... commercial applications'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n55
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/"]
  trich: "Barrett 2019: Microsoft Emotion API: 'These emotions are understood to be cross-culturally and universally communicated with particular facial expressions'; kết luận 'not possible to confidently infer happiness from just a smile'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n56
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/"]
  trich: "Barrett 2019, khuyến nghị cho người dùng: công nghệ 'erroneously taking the common view as the one that is scientifically best supported'."
  ghi_chu: "Câu khuyên ở mức 'đáng cân nhắc kỹ', khớp với mức khuyến nghị."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n57
  luot_2: dung
  nguon: ["https://repositorium.uminho.pt/bitstreams/6126df7b-bf23-4db6-9fab-2870a6be90e0/download", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf"]
  trich: "Matsumoto et al. 2008: 'More than 5,000 respondents in 32 countries completed the Display Rule Assessment Inventory ... universal effects, including greater expression toward in-groups versus out-groups'; Ekman 1969: display rules."
  ghi_chu: "Nhãn 'khá vững' phù hợp (khảo sát tự báo cáo ở sinh viên, nhiều nước)."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n58
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf"]
  trich: "1969: 'Display rules were defined as procedures learned early in life for the management of affect displays ... These rules prescribe what to do about the display of each affect in different social settings; they vary with the social role ... and should vary across cultures.'"
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n59
  luot_2: dung
  nguon: ["https://repositorium.uminho.pt/bitstreams/6126df7b-bf23-4db6-9fab-2870a6be90e0/download"]
  trich: "'5,361 individuals from 32 countries'; 'greater expression toward in-groups versus out-groups, and an overall regulation effect. Individualistic and collectivistic cultures differed on overall expressivity endorsement and in norms concerning specific emotions in in-group and out-group situations'."
  ghi_chu: "Mẫu là sinh viên đại học trả lời bảng hỏi (DRAI)."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n60
  luot_2: qua-manh
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.128.2.203.pdf", "https://repositorium.uminho.pt/bitstreams/6126df7b-bf23-4db6-9fab-2870a6be90e0/download"]
  trich: "Elfenbein & Ambady 2002 chỉ nói quy tắc biểu hiện/giải mã giải thích không đầy đủ lợi thế trong nhóm; Matsumoto 2008 là khảo sát chuẩn mực tự báo cáo."
  cau_dung: "Biết rằng chuẩn mực biểu hiện khác nhau giữa các văn hóa có thể giúp ta bớt vội suy diễn 'họ lạnh lùng' hay 'họ không quan tâm' từ nét mặt ít biểu cảm; điều này hợp lý từ các nghiên cứu về quy tắc biểu hiện, nhưng chưa có thử nghiệm huấn luyện kiểm chứng."
  ghi_chu: "Không thấy nghiên cứu nào cho thấy hiểu quy tắc biểu hiện làm giảm suy diễn sai về người ít biểu cảm; 'giúp ta tránh' nói mạnh hơn bằng chứng đọc được."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n61
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC5390700/"]
  trich: "Barrett 2017: 'Scientists begin with emotion concepts that are most recognizably English ... the emotion categories ... are constructed' (phạm trù cảm xúc do não dựng từ khái niệm đã học)."
  ghi_chu: "Mô tả quan điểm Barrett; 'khái niệm học được định hình cảm xúc' là luận điểm lý thuyết."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n62
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/20696854/", "https://pubmed.ncbi.nlm.nih.gov/34264705/"]
  trich: "Kashdan et al. 2010 (106 người uống rượu dưới tuổi): 'people with intense negative emotions consumed less alcohol if they were better at describing emotions'; Seah & Coifman 2022 (17 nghiên cứu): phân biệt cảm xúc tiêu cực tinh hơn đi cùng ít hành vi mất điều tiết hơn (r = −.15)."
  ghi_chu: "Chỉ đọc tóm tắt; tương quan, không chứng minh nhân quả."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n63
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/34264705/"]
  trich: "Seah & Coifman 2022: tương quan nhỏ (r = −.15), kết quả không chứng minh gọi tên cảm xúc cải thiện điều tiết."
  ghi_chu: "Câu tự hạ mức khuyến nghị, khớp bằng chứng."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n64
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/34264705/", "https://pubmed.ncbi.nlm.nih.gov/20696854/"]
  trich: "r = −.15 (17 nghiên cứu, dị biệt về phương pháp); chưa có thử nghiệm nhân quả đọc được."
  ghi_chu: "Nhãn thấp hơn trần, chấp nhận được."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n65
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf"]
  trich: "1969: mẫu Mỹ, Brazil, Nhật, New Guinea (Fore), Borneo (Sadong)."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n66
  luot_2: sai
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.128.2.203.pdf"]
  trich: "Elfenbein & Ambady 2002, Table 1: 'Biehl et al. (1997) ... U.S., Japan ... Vietnam, n = 34, cross-cultural accuracy 80.4%, in-group advantage 2.0%' (JACFEE, nhận diện nét mặt cảm xúc)."
  cau_dung: "Tính đến 11/2026, chúng tôi chỉ thấy rất ít nghiên cứu nhận diện nét mặt cảm xúc có mẫu người Việt: một ví dụ là Biehl và cộng sự (1997, bộ ảnh JACFEE; mẫu Việt Nam 34 người, đúng khoảng 80% theo bảng của Elfenbein & Ambady 2002); chưa thấy nghiên cứu nào dùng các thiết kế mới (như Jack 2012) trên người Việt."
  ghi_chu: "Ngày kiểm: 2026-11-10. Đã có ít nhất một nghiên cứu có mẫu người Việt (Biehl và cộng sự 1997; mẫu 34 người theo bảng của Elfenbein & Ambady 2002). Cũng tìm Europe PMC và Crossref cùng ngày: thêm một nghiên cứu ERP trên trẻ Việt (Dev Sci 2022) không phải kiểm tra nhận diện nét mặt."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n67
  luot_2: qua-manh
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/"]
  trich: "Barrett 2019: 'The majority of participants were sampled from larger-scale or developed countries, including Argentina, Brazil, Canada, ... Ethiopia, ... Indonesia, ... Zambia ...' (87 thí nghiệm, trên 22.000 người, trên 20 nền văn hóa)."
  cau_dung: "Theo Barrett và cộng sự (2019), phần lớn người tham gia trong 87 thí nghiệm được phân tích tổng hợp năm 2002 (hơn 22.000 người, hơn 20 nền văn hóa) đến từ các nước quy mô lớn hay đã phát triển; chỉ một số ít mẫu là cộng đồng nhỏ, tiền biết chữ."
  ghi_chu: "Nửa đầu đúng (đa số từ nước lớn/phát triển). Nửa sau ('còn lại là một số cộng đồng nhỏ, biệt lập') không có trong Barrett: danh sách gồm cả Ethiopia, Zambia, Indonesia... chứ không chỉ cộng đồng nhỏ biệt lập; các mẫu tiền biết chữ của Ekman chỉ là số ít."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n68
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22509011/"]
  trich: "Jack et al. 2012: Westerners 'distinct set of facial movements', Easterners 'do not'; 'Easterners represent emotional intensity with distinctive dynamic eye activity'."
  ghi_chu: "Chỉ đọc tóm tắt."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n69
  luot_2: qua-manh
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.128.2.203.pdf", "https://pubmed.ncbi.nlm.nih.gov/22509011/"]
  trich: "Elfenbein & Ambady 2002 Table 1: mẫu Việt Nam (Biehl 1997, n = 34) nhận diện đúng 80,4%."
  cau_dung: "Người Việt có thể gần người Đông Á về văn hóa nên cách đọc nét mặt có thể chịu ảnh hưởng tương tự, nhưng chưa có bằng chứng trực tiếp về kiểu 'hình ảnh trong đầu' hay cách dùng vùng mắt như Jack 2012 trên người Việt; chỉ có một mẫu nhỏ người Việt nhận diện đúng khoảng 80% ảnh chuẩn (Biehl 1997)."
  ghi_chu: "Đã có bằng chứng trực tiếp (nhận diện ảnh chuẩn) trên một mẫu người Việt, dù nhỏ và là thiết kế khác Jack 2012; câu 'chưa có bằng chứng trực tiếp' nói quá rộng. Phần dự đoán 'có thể tương tự người Đông Á' là suy đoán đúng chỗ."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n70
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/"]
  trich: "1969: danh sách gồm mọi loại của Tomkins trừ 'interest and shame' (Tomkins 8 loại); Barrett 2019: 'Critiques of Ekman's basic emotion view ... are numerous'."
  ghi_chu: ""
