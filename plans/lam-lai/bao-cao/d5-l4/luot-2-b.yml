  trich: "'using suppression is associated with worse interpersonal functioning'."
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n32
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/12916575/"]
  trich: "Gross & John 2003: nghiên cứu về khác biệt cá nhân trong thói quen điều tiết (đo bằng bảng hỏi); 'is associated with' (tương quan)."
  ghi_chu: "Thiết kế tương quan, đúng như câu nói."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n33
  luot_2: khong-chac
  trich: "Tóm tắt Gross & John 2003 không nêu cơ chế 'không thật', ngại chia sẻ, bạn bè nhận ra nỗ lực kìm nén."
  ghi_chu: "Chưa mở được toàn văn Gross & John 2003 (APA chặn; bản Stanford/CiteSeerX không còn) nên không xác nhận được phần 'các tác giả gợi ý'."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n34
  luot_2: dung
