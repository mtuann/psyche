  trich: "Table 1: hàng 'Disgust-contempt (D)'; chữ: 'There were no Neo-Melanesian Pidgin equivalents for disgust-contempt or surprise'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n23
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1126%252Fscience.1251135.zip/10.1126%252Fscience.164.3875.86.pdf"]
  trich: "1969: 'This list of affects includes all of Tomkins' primary affect categories except for interest and shame'; danh sách Tomkins: interest, joy, surprise, fear, anger, distress, disgust-contempt, shame (8)."
  ghi_chu: "Cách gọi 'sáu cảm xúc cơ bản của Ekman' là quy ước về sau; bài 1969 không dùng cụm đó."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n24
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/"]
  trich: "Barrett et al. 2019: 'Ekman's theoretical approach has been highly influential in research on emotion for much of the past 50 years ... Critiques of Ekman's basic emotion view ... are numerous'."
  ghi_chu: "Câu mang tính đánh giá; có cơ sở ở nhận xét của Barrett 2019, không đo được 'một trong những… nhất'."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n25
  luot_2: dung
