  trich: "1971: 'Those selected had seen no movies, neither spoke nor understood English or Pidgin, had not lived in any of the Western settlement or government towns, and had never worked for a Caucasian'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n26
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fh0030377.pdf"]
  trich: "1971: kể truyện, cho xem 3 ảnh (hai ảnh sai) rồi chọn ảnh hợp truyện; 'Adult subjects were given two incorrect pictures with each correct picture; children were given only one'."
  ghi_chu: "Trẻ em chỉ có 2 ảnh; câu của trang chỉ nói người lớn nên đúng."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n27
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fh0030377.pdf"]
  trich: "1971: 'Sadness: His (her) child (mother) has died, and he (she) feels very sad.'"
  ghi_chu: ""
