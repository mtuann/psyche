  trich: "'reappraisal decreased disgust experience'."
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n20
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/9457784/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "Tóm tắt Gross 1998 ('reappraisal decreased disgust experience, whereas suppression increased sympathetic activation'); Butler 2003: 'suppressing emotion expressions in response to either a disgusting or a sad film (Gross, 1998a; Gross & Levenson, 1997) ... did not alter the experiences of those negative emotions'."
  ghi_chu: "Tóm tắt không nói thẳng 'không giảm'; kết luận đó đọc từ Butler 2003 (bài bậc 1 tóm lại)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n21
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/9457784/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "'suppression increased sympathetic activation' (so với đối chứng); Butler 2003: 'the more typical finding is that suppression is accompanied by increased sympathetic and cardiovascular responding'."
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n22
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/10981843/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "Richards & Gross 2000 (tóm tắt): Study 1 phim, Study 2 slide, Study 3 khác biệt cá nhân; Butler 2003: 'suppression reduces memory for social information (e.g., individuals' names and occupations) presented at the time of the regulatory effort'."
  ghi_chu: "Tên và nghề được Butler xác nhận; 'nguyên nhân bị thương' không xác nhận được qua nguồn đã mở. Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n23
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/10981843/"]
  trich: "'Study 1 ... suppression led to poorer memory for the details of the film. Study 2 manipulated expressive suppression and reappraisal during slide viewing. Only suppression led to poorer slide memory.'"
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n24
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/10981843/"]
  trich: "'Study 3 ... suppression was associated with poorer self-reported and objective memory but ... reappraisal was not.'"
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n25
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "Butler 2003: 'suppression reduces memory for social information ... which suggests increases in cognitive load'; 'cognitive and physical work required to monitor and suppress ongoing emotion-expressive behavior'."
  ghi_chu: "Cách giải thích (gánh nặng nhận thức), do Richards & Gross đề xuất theo Butler."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n26
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/12916575/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4703776/"]
  trich: "Gross & John 2003 (tóm tắt): 'Five studies ... Study 1 presents new measures of the habitual use of reappraisal and suppression'; Gómez-Ortiz et al. 2015 (PMC): 'The ERQ comprises 10 Likert-type items distributed on two scales'."
  ghi_chu: "Số 10 câu đọc ở bài thứ cấp (PMC4703776); số 5 nghiên cứu từ tóm tắt."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n27
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/12916575/"]
  trich: "'Study 3 shows that reappraisers experience and express greater positive emotion and lesser negative emotion'."
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n28
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/12916575/"]
  trich: "'Study 4 indicates that using reappraisal is associated with better interpersonal functioning'."
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n29
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/12916575/"]
  trich: "'Study 5 shows that using reappraisal is related positively to well-being'."
  ghi_chu: "Tóm tắt nói 'well-being'; việc cụ thể là 'hài lòng với cuộc sống' không đọc được từ tóm tắt. Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n30
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/12916575/"]
  trich: "'suppressors experience and express lesser positive emotion, yet experience greater negative emotion'."
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n31
  luot_2: dung
