  id: n28
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fh0030377.pdf"]
  trich: "1971: 'A binomial test ... assuming chance performance to be one in three showed that the correct face was chosen at a significant level for all of the discriminations (rows) except that of fear from surprise.'"
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n29
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0033-2909.128.2.203", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.128.2.203.pdf"]
  trich: "Abstract: 'A meta-analysis examined emotion recognition within and across cultures.'"
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n30
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.128.2.203.pdf"]
  trich: "'only 3.1% of the samples (5 out of 162 reporting sufficient information) showed cross-cultural accuracy that was no better than chance for any individual emotion'; abstract: 'Emotions were universally recognized at better-than-chance levels.'"
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n31
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.128.2.203.pdf"]
  trich: "Abstract: 'Accuracy was higher when emotions were both expressed and recognized by members of the same national, ethnic, or regional group, suggesting an in-group advantage'; trung bình nhóm cùng văn hóa chính xác hơn 9,3% (r = .55, 168 mẫu)."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n32
  luot_2: dung
  nguon: ["https://doi.org/10.1073/pnas.1200155109", "https://pubmed.ncbi.nlm.nih.gov/22509011/"]
  trich: "Abstract: 'we accessed the mind's eye of 30 Western and Eastern culture individuals and reconstructed their mental representations of the six basic facial expressions of emotion' (Glasgow; Jack, Garrod, Yu, Caldara, Schyns)."
  ghi_chu: "Chỉ đọc được tóm tắt (toàn văn PNAS không mở trong PMC)."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n33
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22509011/"]
  trich: "Abstract: 'whereas Westerners represent each of the six basic emotions with a distinct set of facial movements common to the group, Easterners do not.'"
  ghi_chu: "Chỉ đọc tóm tắt."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n34
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22509011/"]
  trich: "Abstract: 'Easterners represent emotional intensity with distinctive dynamic eye activity.'"
  ghi_chu: "Chỉ đọc tóm tắt."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n35
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22509011/"]
  trich: "Abstract: 'Here, we refute this assumed universality ... Cross-cultural comparisons ... challenge universality on two separate counts.'"
  ghi_chu: "Chỉ đọc tóm tắt."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n36
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.128.2.203.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fh0030377.pdf"]
  trich: "Elfenbein & Ambady 2002: chỉ 5/162 mẫu có một cảm xúc không hơn may rủi; Barrett 2019: phân tích tổng hợp 2002 'perceivers inferred emotions ... well above chance levels', 83/87 nghiên cứu dùng chọn-từ-danh-sách."
  ghi_chu: "Khung 'vững chắc' có phân tích tổng hợp (Psych Bull) cùng chiều; câu đã giới hạn ở 'chọn nhãn từ danh sách' và 'ảnh dàn dựng', đúng với phạm vi bằng chứng. Giới hạn: sau 2008 các cộng đồng nhỏ, biệt lập cho kết quả yếu hơn (xem n38), mẫu 2002 chủ yếu từ nước lớn/phát triển; ranh giới hơi sát thước đo nhưng chưa vượt."
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n37
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fh0030377.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.128.2.203.pdf"]
  trich: "1971 làm lại bằng nhiệm vụ truyện–ba ảnh ở người Fore ít tiếp xúc; Elfenbein & Ambady 2002 gộp 162 mẫu, cho kết quả trên mức may rủi."
  ghi_chu: ""
