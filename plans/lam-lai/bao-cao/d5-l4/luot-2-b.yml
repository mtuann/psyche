  trich: "Joseph, Jin, Newman & O'Boyle 2015: 'Why Does Self-Reported Emotional Intelligence Predict Job Performance? A Meta-Analytic Investigation of Mixed EI'; ρ = .29 và về 0 (−.02) sau khi kiểm soát các biến cùng nhóm."
