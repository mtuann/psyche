  luot_2: sai
  nguon: ["https://depts.washington.edu/techdocs/papers/deciExtrinsicRewardsAndIntrinsicMotivation99.pdf"]
  trich: "DKR 1999 abstract: engagement-, completion-, performance-contingent 'd = −0,40, −0,36, −0,28'; unexpected 'd = 0,01'; 'Positive feedback enhanced ... free-choice behavior (d = 0,33)'."
  cau_dung: "Theo phân tích tổng hợp DKR (1999), thưởng cụ thể, hứa trước, gắn với việc tham gia hoặc hoàn thành nhiệm vụ thú vị xói mòn mạnh nhất (d ≈ −0,28 đến −0,40); thưởng bất ngờ gần như không có hiệu ứng (d ≈ 0,01); lời khen mang tính thông tin tăng hứng thú (d ≈ +0,33)."
  ghi_chu: "Phần 'tham gia hoặc hoàn thành xói mòn mạnh nhất' và 'bất ngờ gần như không có' đúng; nhưng khoảng d ≈ −0,28 đến −0,40 đứng cuối câu, ngay sau 'lời khen ... tăng hứng thú', nên đọc ra như d của lời khen; đúng ra d của lời khen là +0,33."
