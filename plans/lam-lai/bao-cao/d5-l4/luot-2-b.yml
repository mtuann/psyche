  id: n71
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22582737/"]
  trich: "cognitive change d+ = 0,36; response modulation 0,16; suppress expression 0,32; suppress experience −0,04; suppress thoughts −0,12; 'substantial influence on effectiveness'."
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
