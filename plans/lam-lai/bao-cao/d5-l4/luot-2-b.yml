  trich: "Tình huống giả định của bài."
  ghi_chu: "Ví dụ giả định (gia-dinh), không phải nhận định; không trái với nhận định nào của trang."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n4
  luot_2: dung
