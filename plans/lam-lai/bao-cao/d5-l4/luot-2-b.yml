  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n41
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/20015584/"]
  trich: "Aldao, Nolen-Hoeksema & Schweizer 2010: 241 hệ số từ 114 nghiên cứu; 'a large effect size for rumination, medium to large for avoidance, problem solving, and suppression, and small to medium for reappraisal and acceptance'."
  ghi_chu: "Tóm tắt không nêu chiều; chiều (nhai lại, né tránh, kìm nén đi cùng triệu chứng nặng hơn; tái đánh giá và chấp nhận nhẹ hơn) hợp với lời tác giả 'surprising given the prominence of reappraisal and acceptance in treatment'. Lưu ý giải quyết vấn đề (problem solving) cũng ở mức vừa đến lớn nhưng không được liệt kê trong câu."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n42
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/20015584/"]
  trich: "Aldao et al.: 'dispositional emotion regulation and psychopathology' (bảng hỏi thói quen, tương quan)."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n43
  luot_2: qua-manh
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf", "https://pubmed.ncbi.nlm.nih.gov/22582737/"]
  trich: "Butler 2003 tóm lại 'several studies have found that suppressing negative emotion expressions does not decrease negative emotion experience' (Gross 1998; Gross & Levenson 1997; Harris 2001); Webb 2012: các d+ đang bàn là kết hợp nhiều kết quả."
  cau_dung: "Khá vững: kìm nén giảm biểu hiện bên ngoài, nhưng trong nhiều thí nghiệm không giảm trải nghiệm cảm xúc tiêu cực bên trong (Gross 1998; Gross & Levenson 1997; Harris 2001)."
  ghi_chu: "Chưa có phân tích tổng hợp nào đọc được tách riêng tác động của kìm nén biểu hiện lên trải nghiệm: d+ = 0,32 của Webb là hiệu quả chung (chủ yếu giảm biểu hiện), còn d+ = −0,04 là chiến lược khác (cố nén chính trải nghiệm). Bằng chứng đọc được: nhiều thí nghiệm cùng chiều, phù hợp 'khá vững', chưa tới 'vững chắc' theo thước đo mục 4."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n44
  luot_2: qua-manh
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22582737/", "https://pubmed.ncbi.nlm.nih.gov/9457784/"]
  trich: "Webb 2012: 'suppressing the expression of emotion proved effective (d(+) = 0.32) ... suppressing the experience of emotion ... did not (d(+) = -0.04)'; Gross 1998: 'reappraisal decreased disgust experience, whereas suppression increased sympathetic activation'."
  cau_dung: "Kết quả cốt lõi của Gross (1998): cả hai chiến lược đều giảm biểu hiện bên ngoài, chỉ tái đánh giá làm giảm trải nghiệm kinh tởm, còn kìm nén thì làm tăng hoạt hóa giao cảm. Phân tích tổng hợp Webb và cộng sự (2012) thấy kìm nén biểu hiện có hiệu quả chung d+ = 0,32 và thay đổi nhận thức d+ = 0,36; cố nén chính trải nghiệm cảm xúc (d+ = −0,04) hay suy nghĩ (−0,12) thì không có hiệu quả."
  ghi_chu: "Các con số Webb đúng, nhưng 'củng cố' kết quả của Gross là suy diễn: d+ = −0,04 là hiệu quả của chiến lược 'cố nén chính cảm xúc đang trải nghiệm', không phải tác động của việc nén biểu hiện lên trải nghiệm."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n45
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "Butler 2003: 'suppression does seem to dampen positive experience. Amusement was decreased both when participants suppressed their expressive behavior while watching an amusing film (Gross & Levenson, 1997)'; Gross & John 2003: suppressors 'experience ... lesser positive emotion'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n46
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf", "https://pubmed.ncbi.nlm.nih.gov/10981843/"]
  trich: "Butler 2003: 'the more typical finding is that suppression is accompanied by increased sympathetic and cardiovascular responding ... the magnitude and boundary conditions of these effects are by no means clear'; kìm nén giảm trí nhớ thông tin xã hội."
  ghi_chu: "Nhãn 'khá vững' phù hợp (còn nhiều chỗ chưa rõ về độ lớn, điều kiện)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n47
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/9457784/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "'suppression increased sympathetic activation' (Gross 1998)."
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n48
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/10981843/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "Richards & Gross 2000: Study 1–2 (phòng thí nghiệm) và Study 3 (thói quen): kìm nén đi cùng trí nhớ kém hơn."
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n49
  luot_2: sai
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/28080085/", "https://pubmed.ncbi.nlm.nih.gov/12916575/"]
  trich: "Chervonsky & Hunt 2017 (Emotion): phân tích tổng hợp 43 bài (105 hệ số): 'greater suppression of emotion was significantly associated with poorer social wellbeing, including more negative first impressions, lower social support, lower social satisfaction and quality, and poorer romantic relationship quality'."
  cau_dung: "Người hay kìm nén có các mối quan hệ xã hội kém hơn (Gross và John, 2003; phân tích tổng hợp Chervonsky & Hunt 2017: 43 bài, 105 hệ số, kìm nén đi cùng hỗ trợ xã hội, chất lượng quan hệ thấp hơn); bằng chứng về cái giá sinh lý và trí nhớ chủ yếu là các thí nghiệm của nhóm Gross, chưa thấy phân tích tổng hợp riêng."
  ghi_chu: "Phần 'chưa có phân tích tổng hợp riêng cho từng cái giá' sai với cái giá xã hội. Chưa tìm thấy phân tích tổng hợp riêng cho cái giá sinh lý và trí nhớ (chưa tìm kỹ)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n50
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22582737/", "https://pubmed.ncbi.nlm.nih.gov/17352561/"]
  trich: "Webb 2012: hiệu quả thay đổi theo moderator (cảm xúc cần điều tiết, mục đích, thiết kế); Butler, Lee & Gross 2007: hậu quả xã hội xấu của kìm nén 'may be moderated by cultural values'."
  ghi_chu: "Nhãn 'khá vững' phù hợp."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n51
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22582737/"]
  trich: "'suppressing the expression of emotion proved effective (d(+) = 0.32)'."
  ghi_chu: "Phần ví dụ đám tang, phòng họp là bình luận chuẩn tắc của trang, không có trong nguồn. Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n52
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22582737/"]
  trich: "Webb: moderator gồm 'to-be-regulated emotion, ... intended purpose of the ER strategy, ... study design'."
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n53
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22582737/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "Butler 2003: 'response-focused ... after the emotional response is already underway'; Webb 2012: attentional deployment d+ = 0,00 (không phải chiến lược sớm nào cũng tốt)."
  ghi_chu: "Câu hedged ('càng có thể'), là lập luận của mô hình."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n54
  luot_2: khong-chac
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "Butler 2003 gán lập luận 'cognitive load' cho Richards & Gross (1999, 2000): 'suppression reduces memory ... which suggests increases in cognitive load (Richards & Gross, 1999, 2000)'."
  ghi_chu: "Chưa mở được toàn văn Gross & John 2003 nên không xác nhận được việc gán cách giải thích này cho Gross & John thay vì Richards & Gross; nội dung giải thích đúng."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n55
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "Butler 2003: 'Theories of interpersonal communication posit that face-to-face interaction involves ... exchange; ... emotion expression, ... communicative channels including ... facial expression'."
  ghi_chu: ""
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n56
  luot_2: khong-chac
  trich: "Tóm tắt Gross & John 2003 không nêu cơ chế 'không thật', ngại chia sẻ, bạn bè nhận ra nỗ lực kìm nén."
  ghi_chu: "Không mở được toàn văn Gross & John 2003."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n57
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22582737/", "https://pubmed.ncbi.nlm.nih.gov/9457784/"]
  trich: "Webb: cognitive change d+ = 0,36 (response modulation 0,16); Gross 1998: reappraisal giảm trải nghiệm ghê tởm."
  ghi_chu: "Nhãn 'khá vững' phù hợp cho việc thử tái đánh giá; câu 'càng sớm càng thay đổi nhiều khâu' là lý thuyết."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n58
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/9457784/"]
  trich: "Câu hỏi gợi ý tự đặt, tự ghi không phải khẳng định về bằng chứng."
  ghi_chu: "Không cần nguồn."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n59
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/9457784/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf", "https://pubmed.ncbi.nlm.nih.gov/10981843/"]
  trich: "Gross 1998: suppression tăng hoạt hóa giao cảm; Butler 2003: kìm nén giảm trí nhớ thông tin xã hội; kìm nén không giảm trải nghiệm tiêu cực."
  ghi_chu: "Phần 'vai gồng, hơi thở nông' là gợi ý tự quan sát, không phải kết quả nghiên cứu; nhãn khá vững cho các thí nghiệm."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n60
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22582737/", "https://pubmed.ncbi.nlm.nih.gov/12916575/"]
  trich: "Webb: 'suppressing the expression of emotion proved effective (d(+) = 0.32)'; Gross & John 2003: kìm nén đi cùng quan hệ xã hội kém hơn, tương quan."
  ghi_chu: "Ví dụ 'chăm người bệnh, giữ không khí trang nghiêm' là minh họa chuẩn tắc của trang."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n61
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/10981843/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "Richards & Gross 2000: kìm nén làm trí nhớ kém đi trong phòng thí nghiệm (phim, slide); Butler 2003: mất trí nhớ tên, nghề được trình bày lúc kìm nén."
  ghi_chu: "Câu đã tự ghi chưa có nghiên cứu về cuộc họp thật; đề xuất ghi chép là lời khuyên rẻ."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n62
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/9457784/", "https://pubmed.ncbi.nlm.nih.gov/10981843/", "https://pubmed.ncbi.nlm.nih.gov/12916575/"]
  trich: "Affiliation trong tóm tắt PubMed: Gross 1998 và Richards & Gross 2000 ở Department of Psychology, Stanford University; Gross & John 2003: Stanford (Gross; PubMed không liệt kê thêm cơ quan của John)."
  ghi_chu: "Chỉ kiểm nơi làm việc của tác giả theo PubMed; 'Berkeley' và nơi lấy mẫu của Gross & John 2003 không xác nhận được từ nguồn đã mở (không đổi nhãn: ba nhóm làm ở Hoa Kỳ). Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n63
  luot_2: dung
  nguon: ["https://doi.org/10.3390/ebj7040051", "https://doi.org/10.1002/jts.70022"]
  trich: "Ngày kiểm: 2026-11-10. Bỏng (256 người, Bệnh viện Bỏng Quốc gia Việt Nam, cắt ngang 2024–2025): 'Cognitive reappraisal showed positive, whereas expressive suppression showed negative associations with HRQoL'; bỏng (146 người, J Trauma Stress 2026): 'Emotion regulation strategies, such as cognitive reappraisal and expressive suppression, did not moderate the association between' phản ứng cảm xúc và triệu chứng."
  ghi_chu: "Đã tìm Europe PMC cùng ngày (emotion regulation, reappraisal, suppression với Vietnam/Vietnamese): không thấy thí nghiệm nào so sánh trực tiếp hai chiến lược trên người Việt."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n64
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/17352561/"]
  trich: "Butler, Lee & Gross 2007: 'These deleterious effects were reduced when individuals with more Asian values suppressed'; mẫu 'Americans'."
  ghi_chu: "Chỉ đọc tóm tắt; mẫu là người Mỹ (giá trị Đông Á/Tây Âu), không nêu mẫu người Việt."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n65
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/9457784/", "https://pubmed.ncbi.nlm.nih.gov/12916575/"]
  trich: "Gross 1998: suppression tăng hoạt hóa giao cảm; Gross & John 2003: suppressors 'experience and express lesser positive emotion, yet experience greater negative emotion'."
  ghi_chu: "Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở)."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n66
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf"]
  trich: "Butler 2003: 'cognitive reappraisal, which entails altering how a situation is construed so as to change its emotional impact'."
  ghi_chu: "Câu nói bài không so sánh diễn giải sát sự thật với tô hồng, hợp với các nghiên cứu được trích."
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
