- trang: kham-pha/tri-nho/duong-cong-quen
  id: n1
  cau: Học ngắt quãng giúp nhớ lâu hơn học dồn trong một đêm, và tự kiểm tra giúp nhớ lâu hơn đọc lại (mô tả của trang).
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n2
  cau: Ngay sau khi học xong, An (học dồn) có thể làm tốt hơn một chút vì kiến thức còn "nóng"; một tuần sau, nhiều khả năng Bình (học rải) nhớ tốt hơn.
  loai: loi-khuyen
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n3
  cau: Hiệu ứng thời điểm của các buổi học đã được đo đạc trong hàng trăm thí nghiệm.
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n5
  cau: Học dồn (massed practice) là nhồi mọi thứ vào một buổi dài; học ngắt quãng (spaced/distributed practice) là chia thành nhiều buổi cách nhau bởi những khoảng nghỉ.
  loai: dinh-nghia
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n6
  cau: Học liền một mạch dễ cảm thấy hiệu quả, vì kiến thức còn tươi và ta làm bài tập trơn tru ngay lúc đó; cảm giác trơn tru lúc học không dự báo được trí nhớ một tuần sau.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n7
  cau: 'Từ thế kỷ 19, Ebbinghaus (1885) đặt vấn đề ấy một cách khoa học: ông tự làm người tham gia duy nhất, học thuộc các danh sách âm tiết vô nghĩa, rồi đo xem mình quên nhanh đến đâu bằng phương pháp "tiết kiệm" (học lại nhanh hơn lần đầu bao nhiêu phần trăm).'
  loai: lich-su
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n8
  cau: Ebbinghaus cũng nhận thấy việc rải các buổi học ra nhiều ngày giúp ông tốn ít công sức học lại hơn.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n9
  cau: Phải hơn một thế kỷ sau, các nhà nghiên cứu mới trả lời được câu hỏi của ông bằng hàng trăm thí nghiệm.
  loai: lich-su
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n10
  cau: Cepeda và cộng sự (2006) là một phân tích tổng hợp, gom các nghiên cứu so sánh học ngắt quãng với học dồn trong các nhiệm vụ nhớ bằng lời, rồi phân tích gộp.
  loai: dinh-nghia
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n11
  cau: Tổng cộng 839 phép so sánh, từ 317 thí nghiệm, trong 184 bài báo.
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n12
  cau: Học ngắt quãng thắng học dồn một cách nhất quán, hiệu ứng được tìm thấy trong nhiều bối cảnh, từ danh sách từ vựng đến đoạn văn.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n13
  cau: Khoảng cách tối ưu giữa các buổi học không cố định mà tăng theo thời gian cần nhớ.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n14
  cau: Muốn nhớ đến tuần sau, khoảng cách chừng một đến vài ngày là đủ; muốn nhớ đến cả năm, khoảng cách phải dài hơn nhiều.
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n15
  cau: Khoảng cách quá ngắn thì gần như học dồn; khoảng cách dài quá mức tối ưu thì kết quả giảm đi, nhưng thường giảm chậm hơn.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n16
  cau: 'Cepeda và cộng sự (2008) làm một thí nghiệm trực tuyến với hơn một nghìn người: học 32 sự thật lạ nhưng có thật (ví dụ "ai là người phát minh ra golf trên tuyết"), ôn lại sau nhiều khoảng cách khác nhau, rồi kiểm tra sau nhiều khoảng thời gian khác nhau.'
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n17
  cau: Khi vẽ hiệu quả ghi nhớ theo khoảng cách giữa hai buổi học, có một khoảng cách tốt nhất cho mỗi thời điểm kiểm tra, và khoảng cách tốt nhất dịch dần ra xa khi thời gian cần nhớ dài ra (một "gờ", ridgeline).
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n18
  cau: "Quy tắc nôm na: thi tuần sau thì ôn cách khoảng một đến vài ngày; thi cuối kỳ thì rải ra vài tuần; đây là quy tắc gần đúng, không phải công thức chính xác."
  loai: loi-khuyen
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n19
  cau: "Roediger và Karpicke (2006): 180 sinh viên học một đoạn văn khoa học ngắn trong 4 phiên."
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n20
  cau: Một nhóm đọc đi đọc lại cả 4 phiên (SSSS); nhóm kia đọc 1 phiên rồi tự kiểm tra, viết ra mọi điều nhớ được, trong 3 phiên còn lại (STTT).
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n21
  cau: Các bài tự kiểm tra không có phản hồi đúng/sai.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n22
  cau: Sau đó, một nửa làm bài kiểm tra cuối sau 5 phút, nửa còn lại sau 1 tuần.
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n23
  cau: "Kết quả bảng: sau 5 phút, nhóm đọc lại 83%, nhóm tự kiểm tra 71%."
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n24
  cau: "Sau 1 tuần: nhóm đọc lại 40%, nhóm tự kiểm tra 61%."
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n25
  cau: Nhóm đọc lại đã đọc đoạn văn trung bình 14 lần, nhóm tự kiểm tra chỉ đọc 3,4 lần.
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n26
  cau: Ở bài kiểm tra sau 5 phút, đọc lại thắng; cái "thắng lợi" ngắn hạn này có thể khiến nhiều người tin rằng đọc lại là cách học tốt.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n27
  cau: Hiện tượng "cố nhớ lại giúp nhớ lâu hơn" được gọi là hiệu ứng kiểm tra (testing effect).
  loai: dinh-nghia
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n28
  cau: Rowland (2014) gộp các nghiên cứu so sánh tự kiểm tra với đọc lại, cho độ lớn hiệu ứng trung bình g = 0,50, mức trung bình theo cách đọc độ lớn hiệu ứng của site.
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n29
  cau: Adesope và cộng sự (2017) gộp 118 bài báo, 272 hiệu ứng, 15.427 người tham gia, cho g = 0,61 khi so với mọi cách học không kiểm tra, và g = 0,51 khi so riêng với đọc lại, ở mức trung bình đến lớn.
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n30
  cau: Dunlosky và cộng sự (2013) đánh giá 10 kỹ thuật học phổ biến, xếp ôn tập ngắt quãng và tự kiểm tra vào nhóm "hiệu quả cao", đọc lại và tô đậm vào nhóm "hiệu quả thấp".
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n31
  cau: "Vững chắc: học ngắt quãng giúp nhớ lâu hơn học dồn."
  loai: nhan
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n32
  cau: Học ngắt quãng vượt trội học dồn một cách nhất quán trong nhiều loại tài liệu, dù phần lớn dữ liệu đến từ người trẻ tuổi.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n33
  cau: Hiệu ứng ngắt quãng đã được tìm thấy trong hàng trăm thí nghiệm.
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n34
  cau: "Vững chắc: tự kiểm tra giúp nhớ lâu hơn đọc lại."
  loai: nhan
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n35
  cau: Thí nghiệm của Roediger và Karpicke (2006), hai phân tích tổng hợp (Rowland, 2014; Adesope và cộng sự, 2017) cho thấy việc cố nhớ lại củng cố trí nhớ dài hạn tốt hơn đọc lại, kể cả khi người học đọc ít hơn nhiều và không nhận được phản hồi.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n36
  cau: "Khá vững: khoảng cách ôn tối ưu tăng theo thời gian cần nhớ."
  loai: nhan
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n37
  cau: Cepeda và cộng sự (2008) đo được "đường gờ" khoảng cách tối ưu dịch ra xa khi thời gian cần nhớ dài ra; kết quả này vững trong một nghiên cứu có kiểm soát (làm qua mạng) với tài liệu dạng sự kiện kiến thức chung; việc áp dụng con số cụ thể vào lớp học thực tế còn cần thêm nghiên cứu.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n38
  cau: "Đang tranh cãi: vì sao học ngắt quãng lại hiệu quả (cơ chế)."
  loai: nhan
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n39
  cau: Có nhiều lý thuyết cạnh tranh về cơ chế (mã hóa đa dạng ngữ cảnh, lần ôn gắng sức hơn vì đã quên một phần, củng cố giữa các buổi) và chưa có đồng thuận về cơ chế chính.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n40
  cau: 'Mã hóa đa dạng ngữ cảnh: mỗi buổi học gắn với ngữ cảnh khác nhau, trí nhớ có nhiều "móc" để tìm lại.'
  loai: dinh-nghia
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n41
  cau: Lần ôn lại sau khi đã quên một phần đòi hỏi nỗ lực truy xuất, và nỗ lực ấy được cho là củng cố dấu vết trí nhớ mạnh hơn; Rowland (2014) thấy phân tích của mình ủng hộ vai trò của xử lý gắng sức.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n42
  cau: Giữa các buổi học, não tiếp tục củng cố những gì đã học, đặc biệt trong lúc ngủ; học dồn tước đi những khoảng nghỉ này; đây là một giả thuyết chưa được kiểm tra riêng trong các nghiên cứu trên.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n43
  cau: "Tự kiểm tra có thể thắng đọc lại còn vì giúp ta nhận ra điều mình chưa thuộc: nhóm đọc lại tin rằng mình sẽ nhớ tốt hơn nhóm tự kiểm tra, nhưng sau 1 tuần lại nhớ kém hơn."
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n44
  cau: "Vững chắc (chip): chia buổi học thành nhiều phiên ngắn, cách nhau."
  loai: nhan
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n45
  cau: "Thay vì một buổi 4 tiếng đêm trước thi, học 1 tiếng mỗi tối trong 4 tối: tổng thời gian như nhau, trí nhớ một tuần sau nhiều khả năng tốt hơn; đây là ứng dụng của phát hiện trong phân tích tổng hợp Cepeda và cộng sự (2006)."
  loai: loi-khuyen
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n46
  cau: "Vững chắc (chip): gấp sách lại và tự kiểm tra."
  loai: nhan
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n47
  cau: Kể cả khi nhớ không ra, nỗ lực nhớ lại thất bại vẫn có ích, vì nó làm lần gặp lại sau đó hiệu quả hơn (Kornell, Hays và Bjork, 2009).
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n48
  cau: "Khá vững (chip): đặt khoảng cách ôn theo ngày cần nhớ."
  loai: nhan
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n49
  cau: "Theo Cepeda và cộng sự (2008): thi tuần sau thì ôn lại sau chừng một đến hai ngày; thi cuối kỳ sau vài tháng thì rải các lần ôn ra vài tuần; cần nhớ càng lâu, khoảng cách giữa các lần ôn càng dài; đừng ôn dồn mọi thứ vào tuần cuối trước kỳ thi lớn."
  loai: loi-khuyen
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n50
  cau: "Khá vững (chip): ngủ đủ giấc giữa các buổi học."
  loai: nhan
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n51
  cau: Học dồn thâu đêm vừa không có khoảng nghỉ giữa các buổi, vừa lấy bớt thời gian ngủ, mà giấc ngủ là lúc nhiều quá trình củng cố trí nhớ diễn ra; một lịch học ngắt quãng "tự nhiên" đã bao gồm các đêm ngủ ở giữa; đó có thể là một phần lý do nó hiệu quả, nhưng các nghiên cứu về học ngắt quãng chưa tách riêng vai trò của giấc ngủ.
  loai: loi-khuyen
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n52
  cau: Thí nghiệm của Roediger và Karpicke làm với sinh viên một trường đại học ở Mỹ; trong phân tích tổng hợp của Cepeda và cộng sự (2006), 85% dữ liệu đến từ người trẻ tuổi.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n53
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra các hiệu ứng này trên người Việt.
  loai: thoi-su
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n54
  cau: Dunlosky và cộng sự (2013) nhận xét rằng ôn tập ngắt quãng và tự kiểm tra có lợi cho người học ở nhiều lứa tuổi và năng lực khác nhau.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n55
  cau: Học dồn có thể cho kết quả tốt ở bài kiểm tra ngay sau đó, nhưng trí nhớ một tuần sau thường kém hơn học rải.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n56
  cau: Đọc lại tạo cảm giác quen thuộc, dễ nhầm với "đã thuộc"; trong thí nghiệm của Roediger và Karpicke, nhóm đọc lại tin rằng mình sẽ nhớ tốt hơn, nhưng sau 1 tuần lại nhớ kém hơn.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n57
  cau: "Chính hành động cố nhớ lại đã củng cố trí nhớ: kiểm tra là một cách học, không chỉ một cách chấm điểm."
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n58
  cau: Quên nhanh lúc đầu là hình dạng chung của trí nhớ; học ngắt quãng không ngăn được việc quên, nó chỉ làm việc quên chậm hơn so với học dồn.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n60
  cau: "Quiz 1: trong thí nghiệm của Roediger và Karpicke (2006), nhóm đọc lại thắng ở bài kiểm tra sau 5 phút (83% so với 71%) nhưng thua đậm sau 1 tuần (40% so với 61%)."
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n62
  cau: "Quiz 3: các bài tự kiểm tra không có phản hồi đúng/sai, và bài kiểm tra cuối được làm sau 5 phút hoặc 1 tuần; học ít hơn mà nhớ lâu hơn."
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n63
  cau: "Quiz 4: với khoảng cần nhớ dài (vài tháng), nên rải các lần ôn ra với khoảng cách dài hơn; khoảng cách tối ưu tăng theo thời gian cần nhớ, là quy tắc gần đúng, không phải công thức chính xác cho từng người."
  loai: loi-khuyen
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n64
  cau: 'Quiz 5: cơ chế của hiệu ứng ngắt quãng được gắn nhãn "Đang tranh cãi" vì có nhiều lý thuyết cạnh tranh (ngữ cảnh đa dạng, nỗ lực truy xuất, củng cố giữa các buổi) mà chưa có đồng thuận về cơ chế chính, trong khi hiện tượng thì vững chắc (hàng trăm thí nghiệm).'
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n1
  cau: Nhiều người thấy việc giữ một dãy số trong đầu khó hơn khi đồng thời nhẩm hát một bài có lời.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n2
  cau: Theo mô hình trí nhớ làm việc, giữ dãy số bằng lời và hát nhẩm lời bài hát cùng dùng một ngăn xử lý âm thanh nên hai việc tranh nhau ngăn đó.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n3
  cau: Giữ dãy số trong khi hình dung đường đi (việc hình ảnh–không gian) thường ít chen lấn hơn so với hát nhẩm lời, vì hai việc dùng hai ngăn khác nhau.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n4
  cau: Trí nhớ làm việc (working memory) là nơi não vừa giữ thông tin trong vài giây vừa thao tác với nó, khác với cách nhìn trí nhớ ngắn hạn như một kho chứa thụ động.
  loai: dinh-nghia
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n5
  cau: Năm 1974 Alan Baddeley và Graham Hitch đề xuất mô hình trí nhớ làm việc nhiều ngăn dưới sự điều phối của một thành phần điều hành trung tâm.
  loai: lich-su
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n6
  cau: Baddeley và Hitch dùng thí nghiệm nhiệm vụ kép (làm hai việc cùng lúc) để thử xem trí nhớ ngắn hạn có phải một ngăn duy nhất.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n7
  cau: Nếu trí nhớ ngắn hạn là một ngăn duy nhất thì việc nào chiếm chỗ cũng làm việc khác kém đi; nếu mô hình kho chung đúng, hiệu suất phải sụp đổ khi tải gần bằng độ dài dãy số.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n8
  cau: Khi phải giữ tới 8 chữ số trong lúc suy luận bằng lời, người tham gia chậm hơn khoảng một nửa nhưng tỉ lệ sai gần như không đổi (khoảng 5%).
  loai: so-lieu
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n9
  cau: Vòng lặp âm vị gồm một kho âm thanh nơi vết âm thanh phai dần nếu không được làm mới và một quá trình nhẩm lại ("giọng nói trong đầu") làm mới vết đó.
  loai: dinh-nghia
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n10
  cau: Dung lượng của vòng lặp âm vị ước chừng bằng số từ người đó đọc được trong khoảng 2 giây.
  loai: so-lieu
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n11
  cau: Bảng phác họa không gian–thị giác giữ hình ảnh và vị trí trong không gian.
  loai: dinh-nghia
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n12
  cau: "Cơ chế điều hành trung ương là thành phần có dung lượng chú ý hạn chế: tập trung chú ý, chia và chuyển chú ý giữa các việc, và kết nối với trí nhớ dài hạn."
  loai: dinh-nghia
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n13
  cau: Conrad cho 387 người xem các dãy 6 chữ cái trình bày bằng mắt rồi nhớ lại ngay.
  loai: so-lieu
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n14
  cau: "Conrad ghi lại loại lỗi nhầm lẫn khi nhớ lại: lỗi có quan hệ có hệ thống với chữ cái gốc."
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n15
  cau: Các lỗi nhầm lẫn tập trung vào những chữ cái nghe giống nhau (như B, P, T, V).
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n16
  cau: Chữ cái được chiếu bằng mắt, nhưng lỗi vẫn tập trung vào chữ nghe giống nhau; theo Conrad, điều này cho thấy đa số người tham gia nhẩm tên chữ cái thay vì giữ hình dạng.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n17
  cau: Mẫu lỗi khi nhớ lại trùng khớp với mẫu nhầm lẫn khi nghe các chữ cái trong tiếng ồn trắng (tương quan hạng +0,64).
  loai: so-lieu
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n18
  cau: Thí nghiệm của Conrad (1964) là một trong những bằng chứng nền tảng cho vòng lặp âm vị.
  loai: lich-su
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n19
  cau: Với các dãy từ, sự giống nhau về âm thanh làm trí nhớ ngắn hạn kém đi rất nhiều, còn sự giống nhau về ý nghĩa chỉ ảnh hưởng chút ít.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n20
  cau: "Với trí nhớ dài hạn thì ngược lại: ý nghĩa mới là thứ gây nhầm lẫn."
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n21
  cau: Baddeley, Thomson và Buchanan (1975) kiểm tra dự đoán rằng độ dài trí nhớ tính theo thời gian đọc các từ chứ không theo số từ.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n22
  cau: "Trí nhớ tỉ lệ nghịch với độ dài từ: nhớ được nhiều từ ngắn hơn từ dài, trên nhiều loại tài liệu."
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n23
  cau: Khi số âm tiết và số âm vị giữ nguyên nhưng thời gian phát âm khác nhau, từ đọc nhanh hơn vẫn nhớ tốt hơn.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n24
  cau: Số từ nhớ được dự đoán được từ số từ người đó đọc được trong khoảng 2 giây.
  loai: so-lieu
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n25
  cau: Khi bắt người tham gia lặp đi lặp lại một âm không liên quan trong lúc học (ức chế phát âm), hiệu ứng độ dài từ biến mất với tài liệu nhìn thấy nhưng vẫn còn với tài liệu nghe.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n26
  cau: Hiệu ứng độ dài từ là một trong những bằng chứng chính cho vòng lặp âm vị, dù cơ chế của nó còn được giải thích theo nhiều cách.
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n27
  cau: Hai bệnh nhân mất trí nhớ nặng vẫn nhớ tốt một câu chuyện ngắn ngay sau khi nghe, dài hơn nhiều so với sức chứa của vòng lặp âm vị; điều này đòi hỏi một nơi "buộc" thông tin lại.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n28
  cau: "Baddeley (2000) là bài lý thuyết: rà soát các hiện tượng mô hình ba thành phần chưa giải thích được rồi đề xuất thành phần thứ tư."
  loai: lich-su
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n29
  cau: Bộ đệm tập là kho dung lượng hạn chế, lưu thông tin dưới dạng đa giác quan, buộc thông tin từ các ngăn con và từ trí nhớ dài hạn thành một biểu diễn thống nhất.
  loai: dinh-nghia
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n30
  cau: Việc lấy thông tin ra khỏi bộ đệm được cho là diễn ra qua ý thức; ban đầu Baddeley giả định truy cập bộ đệm phụ thuộc cơ chế điều hành, về sau nhóm ông thấy cơ chế điều hành không bắt buộc.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n31
  cau: 'Hình "Mô hình trí nhớ làm việc (Baddeley)": cơ chế điều hành trung ương ("ông chủ" phân bổ chú ý) điều phối vòng lặp âm vị (âm thanh, lời nói), bảng phác họa (không gian–thị giác: hình ảnh, vị trí) và bộ đệm tập (buộc thành biểu diễn thống nhất).'
  loai: dinh-nghia
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n32
  cau: "Chú thích của hình: các ngăn trao đổi hai chiều với cơ chế điều hành trung ương."
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n34
  cau: 'Khung "Vững chắc": hai việc cùng "kênh" gây nhiễu cho nhau nhiều hơn hai việc khác kênh.'
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n35
  cau: 'Khung "Vững chắc": trí nhớ ngắn hạn cho lời nói phụ thuộc mạnh vào âm thanh của từ (giống âm thì nhớ kém, từ dài thì nhớ ít).'
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n36
  cau: 'Khung "Khá vững": bộ đệm tập (episodic buffer).'
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n37
  cau: 'Khung "Đang tranh cãi": giới hạn của bàn nháp là bao nhiêu, và bản chất của nó là gì.'
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n38
  cau: Cowan (2001) hiệu chỉnh con số 7 ± 2 của Miller xuống khoảng 4 "cục" thông tin khi loại bỏ các mẹo gom nhóm.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n39
  cau: Một số nhà nghiên cứu cho rằng giới hạn thực chất nằm ở tài nguyên chú ý chứ không phải số ngăn chứa.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n40
  cau: Mô hình xử lý nhúng của Cowan coi trí nhớ làm việc là phần trí nhớ dài hạn đang được kích hoạt cộng với tâm điểm chú ý, không cần các "ngăn" riêng.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n41
  cau: Bệnh nhân PV có vòng lặp âm vị bị tổn thương (trí nhớ dài hạn còn nguyên) học cặp từ tiếng mẹ đẻ bình thường nhưng gần như không học được từ mới của ngoại ngữ.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n42
  cau: "Một giả thuyết có sức nặng: chức năng quan trọng của vòng lặp âm vị là giúp học ngôn ngữ."
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n43
  cau: Ở trẻ em, khả năng lặp lại một từ vô nghĩa vừa nghe có liên quan chặt với vốn từ vựng và dự báo vốn từ một năm sau chứ không phải ngược lại.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n44
  cau: "Một cách giải thích (còn tranh luận) cho việc có nhiều ngăn là góc nhìn tài nguyên: hai việc cùng kênh tranh nhau cùng nguồn tài nguyên, hai việc khác kênh dùng nguồn khác."
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n45
  cau: Dù con số chính xác còn tranh cãi (7 ± 2 hay 4 ± 1), các bên đều thừa nhận giới hạn của trí nhớ làm việc rất nhỏ so với lượng thông tin ta gặp mỗi ngày.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n46
  cau: Nhẩm lại là cách dùng đúng vòng lặp âm vị; vừa giữ số vừa nghe ai đó nói hoặc nghe bài hát có lời gây xung đột.
  loai: loi-khuyen
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n47
  cau: "Tiêu đề lời khuyên 1 (nhẩm số, đừng vừa nghe lời nói): Khá vững."
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n48
  cau: Bàn nháp chỉ giữ được vài "cục" thông tin (khoảng 4); từ đó suy ra nên đưa việc quan trọng ra khỏi đầu bằng ghi chú, nhắc nhở.
  loai: loi-khuyen
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n49
  cau: "Tiêu đề lời khuyên 2 (viết ra thay vì giữ trong đầu): Khá vững."
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n50
  cau: Vừa nghe giảng vừa đọc tin nhắn (cùng kênh ngôn ngữ) gây nhiễu nhau; nghe nhạc không lời thường ít gây hại hơn với việc hình ảnh, nhưng với việc đòi hỏi ngôn ngữ nhạc không lời cũng có thể gây nhiễu nhẹ.
  loai: loi-khuyen
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n51
  cau: "Tiêu đề lời khuyên 3 (đừng bắt hai việc cùng kênh chạy song song): Khá vững."
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n52
  cau: Gom nhóm biến nhiều ký tự thành ít "cục", giúp nhớ được nhiều ký tự hơn; ví dụ dãy 0912345678 (10 ký tự) gom thành 0912–345–678 là 3 cục.
  loai: loi-khuyen
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n53
  cau: "Tiêu đề lời khuyên 4 (gom nhóm): Khá vững."
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n55
  cau: 'Vì sao "7 ± 2" không hẳn đúng với mọi người: đó là ước lượng ban đầu của Miller, thực chất là giới hạn gộp khi chưa chặn gom nhóm.'
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n56
  cau: Nhớ ngược đòi hỏi vừa giữ vừa đảo thứ tự (xử lý), nên gần với nghĩa "làm việc" của trí nhớ làm việc hơn nhớ xuôi.
  loai: dinh-nghia
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n57
  cau: Mô hình của Baddeley và Hitch được xây dựng và kiểm tra chủ yếu ở Anh, Mỹ và châu Âu.
  loai: lich-su
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n58
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra trực tiếp mô hình này trên người Việt.
  loai: thoi-su
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n59
  cau: Độ dài trí nhớ chữ số khác nhau giữa các ngôn ngữ, một phần vì thời gian đọc các chữ số (người song ngữ xứ Wales nhớ được nhiều chữ số tiếng Anh hơn chữ số tiếng Wales, vốn dài hơn), dù thời gian phát âm không giải thích được hết.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n60
  cau: Vì vậy, theo suy luận từ các kết quả trên, không nên lấy chuẩn của người nói tiếng Anh áp thẳng cho người nói ngôn ngữ khác, kể cả tiếng Việt, và ngược lại; công cụ đo trên site chỉ nên dùng để tự khám phá, không so máy móc với chuẩn nước ngoài.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n61
  cau: Mô hình một ngăn (như mô hình đa kho của Atkinson và Shiffrin, 1968) không giải thích được vì sao hai việc khác kênh ít gây nhiễu nhau hơn hai việc cùng kênh; nhiều bằng chứng ủng hộ các ngăn chuyên biệt, dù cách giải thích còn bàn cãi.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n62
  cau: Giới hạn của trí nhớ làm việc là đặc điểm chung của mọi người, không phải dấu hiệu của trí nhớ kém; gom nhóm giúp nhớ được nhiều ký tự hơn (Miller, 1956); ghi chú giúp khỏi phải giữ trong đầu.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n63
  cau: Hai việc cùng kênh gây nhiễu nhau rõ rệt trong các thí nghiệm nhiệm vụ kép, dù người tham gia đã cố gắng hết sức.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n64
  cau: Mô hình Miller (1956) 7 ± 2 là ước lượng ban đầu, đã tính cả các mẹo gom nhóm; ước lượng hiện đại thận trọng hơn là khoảng 4 "cục"; giới hạn còn tùy loại thông tin, cách đo, và từng người.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n66
  cau: 'Quiz 1: vừa giữ dãy số vừa hát nhẩm lời khó vì cả hai việc dùng chung vòng lặp âm vị; xung đột theo "kênh", không theo mức cố gắng chung chung.'
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n67
  cau: "Quiz 2: Conrad (1964): lỗi nhớ lại là nhầm giữa những chữ cái nghe giống nhau (như B, P, T, V) dù chữ cái hiện bằng mắt, cho thấy đa số người nhớ dưới dạng âm thanh; trùng khớp mẫu nhầm lẫn khi nghe trong tiếng ồn."
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n68
  cau: "Quiz 3: hiệu ứng độ dài từ: số từ nhớ được tính theo thời gian đọc, dự đoán từ số từ đọc được trong khoảng 2 giây; ức chế phát âm làm hiệu ứng biến mất với tài liệu nhìn thấy."
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n69
  cau: "Quiz 4: bộ đệm tập được Baddeley đề xuất năm 2000 để giải thích việc bệnh nhân mất trí nhớ vẫn nhớ được cả câu chuyện dài hơn nhiều so với sức chứa của vòng lặp âm vị, và để buộc thông tin đa giác quan cùng trí nhớ dài hạn thành một khối; bộ đệm bổ sung chứ không thay thế mô hình ba thành phần."
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n70
  cau: 'Quiz 5: giới hạn của trí nhớ làm việc gắn nhãn "Đang tranh cãi" vì con số còn bàn cãi (7 ± 2 của Miller so với khoảng 4 của Cowan) và có mô hình khác (Cowan) cho rằng, thay vì các "ngăn" riêng, trí nhớ làm việc là phần trí nhớ dài hạn đang kích hoạt cộng tâm điểm chú ý; mô hình đa thành phần vẫn có ảnh hưởng, chỗ tranh luận là "bao nhiêu" và "vì sao".'
  loai: phat-hien
