- trang: them/gioi-thieu
  id: n1
  cau: Trong tâm lý học, psyche là tâm trí nói chung, phân biệt với cơ thể; chữ này từng mang nghĩa linh hồn.
  loai: dinh-nghia
- trang: them/gioi-thieu
  id: n2
  cau: Giấy phép CC BY-SA 4.0 cho phép chép, chia sẻ và chỉnh sửa, kể cả vì mục đích thương mại, miễn là ghi nguồn và chia sẻ bản chỉnh sửa theo cùng giấy phép.
  loai: dinh-nghia
- trang: them/gioi-thieu
  id: n3
  cau: Site được đăng trên GitHub Pages; theo tài liệu của GitHub (xem ngày 17/11/2026), địa chỉ IP của người truy cập trang GitHub Pages được ghi lại và lưu vì lý do an ninh.
  loai: thoi-su
- trang: them/gioi-thieu
  id: n4
  cau: "Hiệu ứng kiểm tra: tự kiểm tra giúp nhớ lâu hơn đọc lại."
  loai: phat-hien
- trang: them/du-lieu-cua-toi
  id: n1
  cau: Dữ liệu trong localStorage mất nếu bạn xóa dữ liệu duyệt web, và không tự đồng bộ sang thiết bị khác; trình duyệt có thể chặn lưu (chế độ riêng tư, người dùng tắt lưu dữ liệu trang web).
  loai: dinh-nghia
- trang: them/nhat-ky
  id: n1
  cau: Con số của một lần làm trên điện thoại hay máy tính không phải là thước đo trí tuệ, trí nhớ hay sức khỏe.
  loai: phat-hien
- trang: them/nghien-cuu-moi
  id: b1
  cau: "Boyce và cộng sự (2024), Collabra: Psychology 10(1), 125685, 20 tác giả (danh sách như trên trang)."
  loai: so-lieu
- trang: them/nghien-cuu-moi
  id: b2
  cau: Nhóm tác giả làm lại 17 thí nghiệm mà lần tái lập đầu đã thất bại; ở 5 trong 17 trường hợp (29%), lần làm lại tái lập được phần lớn hay toàn bộ kết quả gốc, nhưng với độ lớn hiệu ứng nhỏ hơn; 12 trường hợp còn lại vẫn thất bại.
  loai: tai-lap
- trang: them/nghien-cuu-moi
  id: b3
  cau: "Tác giả phỏng đoán các lần thành công là nhờ mẫu lớn hơn hay đổi cách làm (như thêm câu hỏi kiểm tra sự chú ý), và khuyên: nếu lần tái lập thất bại không có điểm yếu rõ ràng, có lẽ nên dừng sau một lần."
  loai: phat-hien
- trang: them/nghien-cuu-moi
  id: b4
  cau: 17 trường hợp là một mẫu nhỏ, nên tỉ lệ 29% còn rất không chắc chắn.
  loai: phat-hien
- trang: them/nghien-cuu-moi
  id: d1
  cau: Dawson và de Meza (2026), Psychological Review, đăng trực tuyến tháng 7/2026.
  loai: so-lieu
- trang: them/nghien-cuu-moi
  id: d2
  cau: Bài là một bài lý thuyết, đề xuất một mô hình giải thích, không phải một thí nghiệm hay phân tích dữ liệu mới.
  loai: phat-hien
- trang: them/nghien-cuu-moi
  id: d3
  cau: "Câu hỏi của bài: tự tin thái quá thúc ta hành động, còn ác cảm mất mát kìm ta lại; nếu tự tin thái quá có lợi, vì sao lại có thêm một thiên kiến kéo theo chiều ngược lại?"
  loai: phat-hien
- trang: them/nghien-cuu-moi
  id: d4
  cau: Ác cảm mất mát (loss aversion) là xu hướng cố tránh những gì ta thấy là mất mát, nhiều một cách không cân xứng.
  loai: dinh-nghia
- trang: them/nghien-cuu-moi
  id: d5
  cau: "Theo mô hình, tự tin thái quá cài sẵn là tín hiệu đáng tin về năng lực thật: quyết định sai vì quá tin vào mình gây thiệt hại ít hơn cho người giỏi, còn lợi ích của việc được coi là giỏi tăng theo năng lực."
  loai: phat-hien
- trang: them/nghien-cuu-moi
  id: d6
  cau: Ác cảm mất mát bù bớt cái giá của những quyết định quá tự tin; vì thường được giấu kín, nó không làm mất vai trò tín hiệu của sự tự tin; tác giả cho rằng lời khuyên của Kahneman nên bỏ cả hai thiên kiến là thiếu cơ sở.
  loai: phat-hien
- trang: them/nghien-cuu-moi
  id: d7
  cau: Tóm tắt của bài nói bằng chứng hiện có ủng hộ cách hiểu này, nhưng mô hình vẫn cần được kiểm định bằng dữ liệu.
  loai: phat-hien
- trang: them/nghien-cuu-moi
  id: d8
  cau: (bỏ) Theo cách gắn nhãn của site, mô hình đang ở mức Đang tranh cãi.
  loai: nhan
- trang: them/nghien-cuu-moi
  id: z1
  cau: Zhang, Fang và Wang (2025), International Journal of Clinical and Health Psychology 25(1), 100559.
  loai: so-lieu
- trang: them/nghien-cuu-moi
  id: z2
  cau: "Phân tích tổng hợp 35 thử nghiệm ngẫu nhiên có đối chứng với 5.734 người tham gia cho thấy tập kết hợp (aerobic và kháng lực) cải thiện nhận thức tổng thể với g = 0,32 (khoảng tin cậy 95%: 0,17–0,46)."
  loai: so-lieu
- trang: them/nghien-cuu-moi
  id: z3
  cau: Lợi ích rõ hơn ở người từ 65 tuổi trở lên (g = 0,33) và cũng thấy ở người có bệnh (g = 0,28); các chương trình dài 13–26 tuần có hiệu quả có ý nghĩa thống kê (g = 0,21).
  loai: so-lieu
- trang: them/nghien-cuu-moi
  id: z4
  cau: Tác giả khuyên ưu tiên phần tập sức mạnh, mỗi buổi 30–60 phút.
  loai: phat-hien
- trang: them/nghien-cuu-moi
  id: z5
  cau: Theo các mốc Cohen (1988) đề xuất, 0,2 là "nhỏ" và 0,5 là "trung bình".
  loai: dinh-nghia
- trang: them/nghien-cuu-moi
  id: z6
  cau: Hiệu quả của tập kết hợp ở mức nhỏ.
  loai: phat-hien
- trang: them/nghien-cuu-moi
  id: g1
  cau: Ng, Noh và Spencer (2025), eLife 13, RP101992.
  loai: so-lieu
- trang: them/nghien-cuu-moi
  id: g2
  cau: Phân tích tổng hợp 23 nghiên cứu, 297 độ lớn hiệu ứng; sự ăn khớp chính xác và mạnh giữa sóng chậm và thoi ngủ nhanh ở thùy trán dự báo việc củng cố trí nhớ.
  loai: so-lieu
- trang: them/nghien-cuu-moi
  id: g3
  cau: Mối liên hệ này thay đổi theo loại trí nhớ, theo tuổi, và theo đặc điểm của thoi ngủ (tần số, vị trí trên vỏ não).
  loai: phat-hien
- trang: them/nghien-cuu-moi
  id: g4
  cau: Sóng chậm là sóng não chậm của giấc ngủ sâu; thoi ngủ nhanh là những đợt sóng nhanh, ngắn.
  loai: dinh-nghia
- trang: them/nghien-cuu-moi
  id: g5
  cau: Phân tích gộp các hệ số tương quan giữa nhịp não và mức nhớ, nên cho biết nhịp nào đi cùng nhớ tốt hơn, chưa tự nó chứng minh quan hệ nhân quả.
  loai: phat-hien
- trang: them/nghien-cuu-moi
  id: f1
  cau: "Ferguson, Kaye, Branley-Bell và Markey (2025), Professional Psychology: Research and Practice 56(1), 73–83."
  loai: so-lieu
- trang: them/nghien-cuu-moi
  id: f2
  cau: "Nhóm tác giả gộp kết quả của 46 nghiên cứu về việc người trẻ dùng mạng xã hội và sức khỏe tâm thần; kết luận của tác giả: các nghiên cứu hiện có không đủ để khẳng định mạng xã hội gây hại cho lo âu, trầm cảm ở người trẻ."
  loai: phat-hien
- trang: them/nghien-cuu-moi
  id: f3
  cau: Tác giả cũng chỉ ra những điểm yếu phương pháp còn phổ biến trong mảng nghiên cứu này, như thiếu đăng ký trước.
  loai: phat-hien
- trang: them/nghien-cuu-moi
  id: f4
  cau: '"Chưa đủ bằng chứng về tác hại" không có nghĩa là đã chứng minh mạng xã hội vô hại.'
  loai: phat-hien
