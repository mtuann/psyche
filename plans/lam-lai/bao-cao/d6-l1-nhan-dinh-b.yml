      link: https://doi.org/10.1073/pnas.2208661120
    - ten: "Arslan (2024), PNAS 121, e2314207121: bình luận về KKM 2023 (toàn văn, PMC11572980)"
      link: https://doi.org/10.1073/pnas.2314207121
  ket_qua_luot_1: dung
