      link: https://www.uni-trier.de/fileadmin/fb1/prof/PSY/PGA/bilder/Baumann_Flow_Chapter_9_final.pdf
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Csikszentmihalyi nhận thấy một số người dễ "tự tạo" flow hơn hẳn người khác: họ tò mò, thích đặt mục tiêu nội tại, kiên trì trước khó khăn, và ít phụ thuộc vào phần thưởng bên ngoài. Điểm quan trọng: ông mô tả đây là một *kỹ năng có thể rèn*, không phải năng khiếu bẩm sinh — bạn có thể học cách tìm ". Chữ mới: "Csikszentmihalyi đề xuất khái niệm nhân cách tự trị: xu hướng chủ động tìm thử thách và trải nghiệm flow. Nakamura và Csikszentmihalyi (2002) mô tả các nét cốt lõi là tò mò và hứng thú với đời sống, kiên trì, và ít vị kỷ, gọi chúng là "siêu kỹ năng" (metaskills). Khái niệm này giàu ý nhưng chưa có c". Lý do: Chữ cũ khẳng định ông "mô tả là kỹ năng có thể rèn" và "bạn có thể học cách tìm ra thử thách": nguồn đọc được chỉ nói "metaskills" và không có bằng chứng về rèn luyện. Phủ định theo nguồn đã đọc; không có tìm kiếm riêng về can thiệp rèn nhân cách tự trị.'
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n84
  cau: "Câu hỏi 4: cân bằng thử thách–kỹ năng một mình chưa đủ; cân bằng thấp chỉ thờ ơ; mục tiêu rõ, phản hồi tức thì là điều kiện khác được đề xuất."
  loai: phat-hien
  nguon:
    - ten: "Fong, Zaleski & Leach (2015), J Posit Psychol 10, 425–446: chỉ tóm tắt (OpenAlex)"
      link: https://doi.org/10.1080/17439760.2014.967799
    - ten: "Løvoll & Vittersø (2014), Soc Indic Res 115(1), 117–136: chỉ tóm tắt (trang Springer)"
      link: https://doi.org/10.1007/s11205-012-0211-9
    - ten: "Swann, Piggott, Schweickle & Vella (2018), J Appl Sport Psychol 30(3), 249–271: toàn văn bản chấp nhận đăng (kho Leeds Beckett)"
      link: https://doi.org/10.1080/10413200.2018.1443525
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "+ Vì cân bằng ở mức thấp chỉ tạo ra thờ ơ; cần cả hai đều cao, cộng thêm các điều kiện khác như mục tiêu rõ và phản hồi tức thì.". Chữ mới: "+ Vì các nghiên cứu cho thấy cân bằng chỉ liên hệ vừa phải với flow; theo mô hình, cân bằng ở mức thấp chỉ tạo ra thờ ơ, và còn các điều kiện khác như mục tiêu rõ và phản hồi tức thì.". Lý do: Khớp sửa ở khung Khá vững. Chữ cũ: "> Løvoll và Vittersø (2014) chỉ ra "cân bằng" không phải lúc nào cũng tốt — cân bằng giữa việc dễ và năng lực thấp thì chán, không phải flow. Công thức đầy đủ là: cao + cân bằng + mục tiêu + phản hồi.". Chữ mới: "> Phân tích tổng hợp thấy cân bằng thử thách–kỹ năng liên hệ vừa phải với flow (Fong và cộng sự, 2015), còn Løvoll và Vittersø (2014) không thấy flow đạt đỉnh khi cân bằng. Theo mô hình, cân bằng giữa việc dễ và năng lực thấp thì chỉ thờ ơ; các điều kiện khác được đề xuất là mục tiêu rõ và phản hồi ". Lý do: Bỏ "công thức đầy đủ" (không kiểm được); khớp Løvoll 2014.'
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n75
  cau: "Ngộ nhận 2: phân tích tổng hợp thấy flow liên hệ dương, vừa phải đến khá mạnh, với well-being; là tương quan; chưa tìm thấy nghiên cứu xét giới hạn của flow liên tục hay flow trong hoạt động có hại."
  loai: phat-hien
  nguon:
    - ten: "Sweeny và cộng sự (2026), Emotion: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1037/emo0001657
  ket_qua_luot_1: da-sua
  ghi_chu: "Chữ cũ: \"Flow là một dạng trải nghiệm tối ưu, nhưng \"cháy\" liên tục không nghỉ vẫn dẫn đến kiệt sức. Hơn nữa, flow không phân biệt tốt–xấu về mặt đạo đức: người ta cũng có thể \"chảy\" trong game gây nghiện hay trong công việc ám ảnh đến mức bỏ bê gia đình.\". Chữ mới: \"Một phân tích tổng hợp (Sweeny và cộng sự, 2026) thấy flow liên hệ dương, ở mức vừa phải đến khá mạnh, với well-being, nên ý \"càng nhiều flow càng hạnh phúc\" có phần đúng ở mức tương quan; nhưng đó là tương quan, và chúng tôi chưa tìm thấy nghiên cứu nào xét giới hạn của việc ở trong flow liên tục h\". Lý do: Chữ cũ (\"cháy liên tục dẫn đến kiệt sức\", \"game gây nghiện\", \"bỏ bê gia đình\") không có nguồn; viết lại theo tổng hợp Sweeny 2026. Chữ cũ: \"- **\"Càng nhiều flow càng hạnh phúc, nên cứ 'cháy' hết mình.\"**\". Chữ mới: \"- **\"Càng nhiều flow càng hạnh phúc, nên cứ 'cháy' hết mình.\"** Đúng một phần:\". Lý do: Đổi câu mở theo nội dung mới. Chỉ đọc tóm tắt. Phần \"chưa tìm thấy nghiên cứu xét giới hạn\" là phủ định theo lần tìm hạn chế (tạm xem là thoi-su ở n sau)."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n29
  cau: "Jackson & Marsh (1996): Flow State Scale 36 câu, chín thang bốn câu, tương ứng các chiều flow của Csikszentmihalyi; kiểm định trên 394 vận động viên."
  loai: so-lieu
  nguon:
    - ten: "Jackson & Marsh (1996), J Sport Exerc Psychol 18(1), 17–35: chỉ tóm tắt (OpenAlex)"
      link: https://doi.org/10.1123/jsep.18.1.17
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "xây dựng **Flow State Scale (FSS)** — thang đo 36 câu tương ứng với 9 đặc điểm của flow — và kiểm định trên vận động viên.". Chữ mới: "xây dựng **Flow State Scale (FSS)** — thang đo 36 câu (mỗi đặc điểm bốn câu) tương ứng với 9 đặc điểm của flow — và kiểm định trên 394 vận động viên.". Lý do: Thêm cỡ mẫu theo tóm tắt. Chỉ đọc tóm tắt.'
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n57
  cau: "Fong 2015: so với các điều kiện khác, cân bằng thử thách–kỹ năng là yếu tố đóng góp mạnh cho flow cùng với mục tiêu rõ và cảm giác kiểm soát."
  loai: phat-hien
  nguon:
    - ten: "Fong, Zaleski & Leach (2015), J Posit Psychol 10, 425–446: chỉ tóm tắt (OpenAlex)"
      link: https://doi.org/10.1080/17439760.2014.967799
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Các nghiên cứu ESM trong lớp học cho thấy học sinh hứng thú nhất khi cảm nhận được cả ba: thử thách cao, kỹ năng đủ dùng, và quyền kiểm soát. Bài tập quá dễ → chán; bài quá khó mà không có gợi ý → lo âu và bỏ cuộc.". Chữ mới: "Mục tiêu rõ và phản hồi rõ là hai điều kiện được đề xuất của flow; phân tích tổng hợp thấy mục tiêu rõ và cảm giác kiểm soát cùng với cân bằng thử thách–kỹ năng đều liên hệ với flow (Fong và cộng sự, 2015), và một phân tích tổng hợp 108 nghiên cứu về flow trong học tập (Xie và cộng sự, 2026) thấy fl". Lý do: Chữ cũ dẫn "các nghiên cứu ESM trong lớp học" không có nguồn đã mở; "lo âu và bỏ cuộc" không có nguồn.'
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n69
  cau: "Việt Nam: chưa thấy nghiên cứu flow ở người Việt bằng ESM; chưa rõ nghiên cứu 2026 dùng thang nào."
  loai: thoi-su
  nguon:
    - ten: 'Tìm trên Europe PMC (10/11/2026): "Flow State Scale" AND (Vietnam OR Vietnamese) (2 kết quả, không liên quan); TITLE:"flow" AND TITLE:(Vietnam OR Vietnamese) (1 nghiên cứu phù hợp: Nguyen 2026); "flow experience" AND Vietnam* AND students/athletes (19 kết quả, đã xem đầu danh sách); chưa tìm tạp chí trong nước'
      link: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=%22flow%20experience%22%20AND%20(Vietnamese%20OR%20Vietnam)
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "**Chúng tôi chưa tìm thấy nghiên cứu nào về flow (bằng ESM hay thang đo FSS) thực hiện trên người Việt.** Điều này có nghĩa là mọi lời khuyên "áp dụng flow" cho người Việt hiện tại đều dựa trên dữ liệu từ các nước khác — chủ yếu phương Tây, cộng thêm một số nước châu Á như Nhật Bản.". Chữ mới: "Tính đến 11/2026, chúng tôi tìm thấy một nghiên cứu về flow ở người Việt: Nguyen và cộng sự (2026), khảo sát 239 sinh viên đại học học tiếng Anh trực tuyến và phỏng vấn 12 người. Mức flow nói chung cao (trung bình 3,77); ba chiều nổi bật nhất là phản hồi tức thì, cân bằng thử thách–kỹ năng và mất tự". Lý do: Câu cũ "chưa tìm thấy nghiên cứu nào về flow trên người Việt" sai: có Nguyen 2026 (tìm 10/11/2026).'
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n41
  cau: "Swann 2018: cân bằng thử thách–kỹ năng một mình không đủ để flow xảy ra; điều kiện đủ vẫn chưa biết."
  loai: phat-hien
  nguon:
    - ten: "Swann, Piggott, Schweickle & Vella (2018), J Appl Sport Psychol 30(3), 249–271: toàn văn bản chấp nhận đăng (kho Leeds Beckett)"
      link: https://doi.org/10.1080/10413200.2018.1443525
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "Bằng chứng ESM ủng hộ mô hình kênh flow. Tuy nhiên, "cân bằng" một mình chưa đủ: Løvoll và Vittersø (2014) chỉ ra rằng cân bằng ở mức thấp chỉ tạo ra thờ ơ, và một số người vẫn báo cáo trải nghiệm tích cực khi thử thách hơi vượt kỹ năng ([Løvoll và Vittersø, 2014](https://doi.org/10.1007/s11205-012-". Chữ mới: "Một phân tích tổng hợp 28 nghiên cứu (Fong và cộng sự, 2015) thấy cân bằng thử thách–kỹ năng liên hệ ở mức vừa phải với flow, và yếu hơn trong các nghiên cứu dùng ESM, ở môi trường làm việc hay giáo dục, và ở người thuộc nền văn hóa cá nhân chủ nghĩa. Ngược lại, Løvoll và Vittersø (2014), trong hai ". Lý do: Chữ cũ nói Løvoll & Vittersø chỉ ra "cân bằng ở mức thấp chỉ tạo ra thờ ơ" và "thử thách hơi vượt kỹ năng" tích cực: tóm tắt nói không có chỉ báo flow nào đạt đỉnh ở cân bằng và ủng hộ mô hình mất cân bằng. "Bằng chứng ESM ủng hộ" cũng chưa đúng: phân tích tổng hợp thấy tương quan yếu hơn ở nghiên cứu ESM. Chữ cũ: "Ý thức con người "kén" việc: quá khó thì hệ thần kinh báo động (lo âu), quá dễ thì nó buồn chán và đi lang thang. Chỉ khi thử thách và kỹ năng cùng cao và khớp nhau, toàn bộ nguồn lực chú ý mới có "việc đáng làm" và dồn hết vào đó. Đây là lời giải thích ở cấp độ *điều kiện*.". Chữ mới: "Theo mô hình, quá khó thì ta lo âu, quá dễ thì chán. Chỉ khi thử thách và kỹ năng cùng cao và khớp nhau thì flow mới được dự đoán. Đây là mô tả ở cấp độ *điều kiện*, không phải giải thích cơ chế: Swann và cộng sự (2018) nhận xét các điều kiện đủ để flow xảy ra vẫn chưa được biết.". Lý do: Chữ cũ nêu cơ chế ("hệ thần kinh báo động", "nguồn lực chú ý") không có nguồn; các tài liệu nói mô hình kênh là mô hình mô tả.'
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n31
  cau: FSS-2 do Jackson & Eklund (2002) làm ra như phiên bản sửa của FSS; được dùng rộng rãi trong thể thao.
  loai: lich-su
  nguon:
    - ten: "Swann, Piggott, Schweickle & Vella (2018), J Appl Sport Psychol 30(3), 249–271: toàn văn bản chấp nhận đăng (kho Leeds Beckett)"
      link: https://doi.org/10.1080/10413200.2018.1443525
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "FSS (và phiên bản cải tiến FSS-2 của Jackson và Eklund, 2002) trở thành công cụ chuẩn để đo flow, đặc biệt trong tâm lý học thể thao. Thang đo đã được dịch và kiểm định ở nhiều nước — ví dụ trên người trưởng thành Nhật Bản (Kawabata, Mallett và Jackson, 2008) — cho thấy cấu trúc 9 chiều giữ được ở n". Chữ mới: "Phân tích nhân tố khẳng định ủng hộ chín thang và một mô hình có thứ bậc với một nhân tố flow chung. FSS (và phiên bản cải tiến FSS-2 của Jackson và Eklund, 2002) được dùng rộng rãi để đo flow, đặc biệt trong tâm lý học thể thao, dù các nghiên cứu về flow chưa thống nhất cách đo. Đã có nghiên cứu ki". Lý do: "Công cụ chuẩn" và "cấu trúc 9 chiều giữ được ở ngoài phương Tây" không kiểm được (chỉ đọc được tên bài Kawabata); Abuhamdeh 2020: chưa có cách đo thống nhất. Kết quả CFA theo tóm tắt Jackson & Marsh 1996.'
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n52
  cau: "Lý thuyết 2: khái niệm chưa có cách đo thỏa đáng; liên hệ các nét với tần suất flow hiếm được kiểm tra."
  loai: phat-hien
  nguon:
    - ten: 'Baumann (2012), chương 9 "Autotelic personality" trong Advances in Flow Research: toàn văn bản tác giả (Đại học Trier)'
      link: https://www.uni-trier.de/fileadmin/fb1/prof/PSY/PGA/bilder/Baumann_Flow_Chapter_9_final.pdf
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Csikszentmihalyi nhận thấy một số người dễ "tự tạo" flow hơn hẳn người khác: họ tò mò, thích đặt mục tiêu nội tại, kiên trì trước khó khăn, và ít phụ thuộc vào phần thưởng bên ngoài. Điểm quan trọng: ông mô tả đây là một *kỹ năng có thể rèn*, không phải năng khiếu bẩm sinh — bạn có thể học cách tìm ". Chữ mới: "Csikszentmihalyi đề xuất khái niệm nhân cách tự trị: xu hướng chủ động tìm thử thách và trải nghiệm flow. Nakamura và Csikszentmihalyi (2002) mô tả các nét cốt lõi là tò mò và hứng thú với đời sống, kiên trì, và ít vị kỷ, gọi chúng là "siêu kỹ năng" (metaskills). Khái niệm này giàu ý nhưng chưa có c". Lý do: Chữ cũ khẳng định ông "mô tả là kỹ năng có thể rèn" và "bạn có thể học cách tìm ra thử thách": nguồn đọc được chỉ nói "metaskills" và không có bằng chứng về rèn luyện.'
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n6
  cau: "Cuốn Flow: The Psychology of Optimal Experience (1990) tổng hợp 9 đặc điểm của flow."
  loai: lich-su
  nguon:
    - ten: "Swann, Piggott, Schweickle & Vella (2018), J Appl Sport Psychol 30(3), 249–271: toàn văn bản chấp nhận đăng (kho Leeds Beckett)"
      link: https://doi.org/10.1080/10413200.2018.1443525
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "Từ những năm 1970, Csikszentmihalyi phỏng vấn hàng trăm người ở những lĩnh vực rất khác nhau — vận động viên leo núi, vũ công, kỳ thủ cờ vua, bác sĩ phẫu thuật, nhà soạn nhạc — và hỏi họ về những khoảnh khắc "mọi thứ vào guồng" nhất. Dù công việc khác nhau một trời một vực, mô tả của họ trùng khớp đ". Chữ mới: "Từ giữa những năm 1970 (Csikszentmihalyi, 1975), Csikszentmihalyi hỏi hàng trăm người leo núi, kỳ thủ cờ vua, nghệ sĩ... mô tả những khoảnh khắc tốt nhất của họ, và từ đó đưa ra khái niệm flow. Các nhà nghiên cứu về sau nhận xét mô tả khá nhất quán giữa các hoạt động (dù có phê bình, xem phần Mức độ". Lý do: Danh sách vũ công, bác sĩ phẫu thuật, nhà soạn nhạc và "trùng khớp đến ngạc nhiên" không có nguồn đã mở (Abuhamdeh 2020: "hundreds of rock climbers, chess players, artists, etc."). Sách 1990 chưa mở được; Swann 2018 trình bày chín chiều là cách hiểu phổ biến ("commonly understood in terms of nine dimensions"), dẫn Jackson & Csikszentmihalyi 1999, Nakamura & Csikszentmihalyi 2002.'
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n64
  cau: Game có độ khó tăng dần và người chơi thích đối thủ ngang cơ là trực giác tương tự mô hình kênh flow (suy luận).
  loai: loi-khuyen
  nguon:
    - ten: "Løvoll & Vittersø (2014), Soc Indic Res 115(1), 117–136: chỉ tóm tắt (trang Springer)"
      link: https://doi.org/10.1007/s11205-012-0211-9
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Lý do game được thiết kế độ khó tăng dần, hay người chơi cầu lông thích gặp đối thủ "ngang cơ", chính là trực giác về kênh flow. Khi chọn hoạt động giải trí, hãy ưu tiên những thứ có độ khó vừa tầm và phản hồi rõ ràng (điểm số, thời gian, tiến bộ đo được) thay vì những thứ chỉ gây kích thích thụ độn". Chữ mới: "Game thường có độ khó tăng dần và người chơi cầu lông thường thích gặp đối thủ "ngang cơ": đó có thể là trực giác tương tự mô hình kênh flow (suy luận, chưa có nghiên cứu nào được đọc để kiểm tra). Khi chọn hoạt động giải trí, bạn có thể thử những thứ có độ khó vừa tầm và phản hồi rõ ràng (điểm số, ". Lý do: Chữ cũ khẳng định "chính là trực giác về kênh flow" và so sánh với lướt video ngắn mà không có nguồn. Suy luận đã ghi rõ; nguồn Løvoll 2014 dùng làm giới hạn.'
