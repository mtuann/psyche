      link: https://doi.org/10.1016/B978-0-12-205050-3.50008-7
  ket_qua_luot_1: dung
- trang: kham-pha/hanh-phuc/tien-va-hanh-phuc
  id: n10
  cau: Một phần tranh cãi xuất phát từ việc lẫn lộn hai khái niệm; mâu thuẫn 2010–2021 nảy sinh ở cách đo và phân tích cùng một khía cạnh cảm xúc.
  loai: phat-hien
  nguon:
    - ten: "Kahneman & Deaton (2010), PNAS 107(38), 16489–16493: toàn văn (PDF bản tác giả, trang Princeton của Deaton); tóm tắt thêm từ PMC2944762"
      link: https://doi.org/10.1073/pnas.1011492107
    - ten: "Killingsworth, Kahneman & Mellers (2023), PNAS 120(10), e2208661120: toàn văn (PMC10013834, qua Europe PMC)"
      link: https://doi.org/10.1073/pnas.2208661120
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "Phần lớn tranh cãi về tiền và hạnh phúc, như ta sẽ thấy, xuất phát từ việc lẫn lộn hai khái niệm này.". Chữ mới: "Hai thứ này liên quan yếu: trong dữ liệu Gallup, các thang cảm xúc và thang Cantril tương quan với nhau đều dưới 0,31. Một phần tranh cãi về tiền và hạnh phúc xuất phát từ việc lẫn lộn hai khái niệm này; còn mâu thuẫn giữa kết quả năm 2010 và 2021, như ta sẽ thấy, nảy sinh ở cách đo và cách phân tíc". Lý do: Câu cũ "phần lớn tranh cãi" không có nguồn; bài hòa giải 2023 tìm nguyên nhân ở thang đo (hiệu ứng trần) và giả định đồng nhất, không phải lẫn hai khái niệm. Thêm số tương quan từ K&D 2010.'
- trang: kham-pha/hanh-phuc/tien-va-hanh-phuc
  id: n46
  cau: "Khung Đang tranh cãi: con số 75.000 USD — điểm giữa nhóm thu nhập, dữ liệu Mỹ 2008–2009; theo phân tích 2023 chỉ mô tả nhóm 15–20% ít hạnh phúc nhất; bị bình luận 2024."
  loai: nhan
  nguon:
    - ten: "Killingsworth, Kahneman & Mellers (2023), PNAS 120(10), e2208661120: toàn văn (PMC10013834, qua Europe PMC)"
      link: https://doi.org/10.1073/pnas.2208661120
    - ten: "Arslan (2024), PNAS 121, e2314207121: bình luận về KKM 2023 (toàn văn, PMC11572980)"
      link: https://doi.org/10.1073/pnas.2314207121
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "Đây không phải một hằng số tâm lý học. Nó là điểm giữa của một nhóm thu nhập trong dữ liệu khảo sát người Mỹ 2008–2009, và theo phân tích năm 2023, nó chỉ mô tả đúng nhóm 20% ít hạnh phúc nhất.". Chữ mới: "Đây không phải một hằng số tâm lý học. Nó là điểm giữa của một nhóm thu nhập trong dữ liệu khảo sát người Mỹ 2008–2009, và theo phân tích năm 2023, hiện tượng chững lại chỉ có ở nhóm 15–20% ít hạnh phúc nhất (cách xác định ngưỡng này bị bình luận năm 2024).". Lý do: Bài gốc nói 15% (phân vị) đến 20%; thêm bình luận 2024.'
- trang: kham-pha/hanh-phuc/tien-va-hanh-phuc
  id: n19
  cau: "Nghiên cứu châu Âu năm 2026 (33 nước, European Social Survey, 177.948 người): GDP đi cùng cảm xúc tốt hơn giữa các nước và theo thời gian."
  loai: phat-hien
  nguon:
    - ten: "Fors Connolly, Hjerm & Gärling (2026), Sci Rep: tóm tắt (Europe PMC, PMC13333869)"
      link: https://doi.org/10.1038/s41598-026-59695-1
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "cho rằng mối quan hệ giữa thu nhập và hạnh phúc là **log-tuyến tính và dương** ở cả ba chiều: trong nước, giữa các nước, và theo thời gian, với rất ít bằng chứng về điểm bão hòa. Cuộc tranh luận này đến nay vẫn chưa ngã ngũ.". Chữ mới: "cho rằng hạnh phúc có liên hệ dương, dạng **log-tuyến tính** với thu nhập, trong nước và giữa các nước, không thấy điểm bão hòa; theo thời gian, họ thấy tăng trưởng đi kèm hạnh phúc tăng ở Nhật và châu Âu (Mỹ là ngoại lệ chưa giải thích được). Easterlin và cộng sự (2010) đáp lại rằng các phê phán ch". Lý do: Câu cũ nói "ở cả ba chiều" gồm theo thời gian, nhưng bài Stevenson & Wolfers thấy Mỹ là ngoại lệ; thêm phản hồi của Easterlin 2010 và nghiên cứu 2026; thêm mốc cho câu "chưa ngã ngũ". Chỉ đọc tóm tắt.'
- trang: kham-pha/hanh-phuc/tien-va-hanh-phuc
  id: n13
  cau: "Easterlin 1974 (kết quả): trong nước, nhóm địa vị cao nhất hạnh phúc hơn nhóm thấp nhất ở mọi cuộc khảo sát; giữa các nước chưa chắc có liên hệ; ở Mỹ từ 1946 hạnh phúc không đi cùng thu nhập."
  loai: phat-hien
  nguon:
    - ten: "Easterlin (1974), trong David & Reder (eds.), Nations and Households in Economic Growth, tr. 89–125: toàn văn (bản MPRA 111773, in lại có phép của Elsevier)"
      link: https://doi.org/10.1016/B978-0-12-205050-3.50008-7
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "**Kết quả.** Tại một thời điểm, người có thu nhập cao hơn hạnh phúc hơn — cả khi so sánh trong nước lẫn giữa các nước. Nhưng theo thời gian, khi một nước giàu lên, hạnh phúc trung bình không tăng theo.". Chữ mới: "**Kết quả.** Trong cùng một nước, ở mọi cuộc khảo sát, nhóm có địa vị (thu nhập) cao nhất hạnh phúc hơn nhóm thấp nhất. Nhưng giữa các nước tại một thời điểm, liệu có liên hệ dương hay không là chưa chắc: chênh lệch hạnh phúc giữa nước giàu và nước nghèo không như dự đoán từ chênh lệch trong nước. V". Lý do: Chữ cũ nói người giàu hạnh phúc hơn "cả giữa các nước": Easterlin 1974 viết "whether any such positive association exists among countries at a given time is uncertain".'
- trang: kham-pha/hanh-phuc/tien-va-hanh-phuc
