- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n1
  cau: "Mô tả trang (frontmatter): bài nói về khái niệm subjective well-being của Diener, thang SWLS 5 câu hỏi và độ tin cậy của các cách đo."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n2
  cau: "Thử 1: năm câu (gần với lời gốc) và thang 1 (hoàn toàn không đồng ý) đến 7 (hoàn toàn đồng ý), tổng trên 35."
  loai: cong-cu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n3
  cau: "Thử 2 (đáp án thu gọn): điểm tự chấm và điểm bạn thân chấm tương quan ở mức trung bình (r ≈ 0,42, 44 mẫu, 8.897 người), không trùng khớp nhưng không ngẫu nhiên."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n4
  cau: "Mở bài: nghi ngờ rằng điểm hạnh phúc có thể khác nhau do tâm trạng lúc trả lời; các nhà nghiên cứu đã kiểm tra các lo ngại này từ lâu (Diener 1984: tâm trạng nhất thời ảnh hưởng câu trả lời)."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n5
  cau: Diener công bố bài tổng quan "Subjective Well-Being" năm 1984 trên Psychological Bulletin, 95(3), 542–575.
  loai: lich-su
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n6
  cau: Bài Diener 1984 rà soát rộng văn hiến về cách đo, các yếu tố ảnh hưởng và lý thuyết.
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n7
  cau: "Bài Diener 1984 mô tả hạnh phúc chủ quan có ba đặc điểm: chủ quan, gồm các chỉ báo tích cực, là đánh giá tổng thể."
  loai: dinh-nghia
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n8
  cau: "Diener (1984) nêu ba thành phần của hạnh phúc chủ quan: hài lòng với cuộc sống (đánh giá lý trí), cảm xúc tích cực, cảm xúc tiêu cực; các thành phần đo riêng, không có phép cộng điểm trong bài."
  loai: dinh-nghia
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n9
  cau: Diener (1984) coi mối liên hệ giữa hài lòng cuộc sống và cảm xúc là câu hỏi thực nghiệm, không phải chuyện định nghĩa.
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n10
  cau: "Lucas, Diener & Suh (1996): hài lòng cuộc sống, cảm xúc tích cực, cảm xúc tiêu cực phân biệt được với nhau (ma trận đa đặc điểm–đa phương pháp, ba bộ dữ liệu)."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n11
  cau: "Ví dụ: một người có thể hài lòng với cuộc đời mình mà tuần này khá căng thẳng, và ngược lại."
  loai: loi-khuyen
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n12
  cau: Diener, Emmons, Larsen & Griffin (1985) xây dựng SWLS để đo thành phần hài lòng cuộc sống (đánh giá toàn cục).
  loai: lich-su
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n13
  cau: "SWLS: 48 câu ban đầu, rút còn 5 câu sau khi loại các câu tải thấp và trùng nghĩa."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n14
  cau: "Nghiên cứu 1: 176 sinh viên Đại học Illinois; 76 người làm lại sau 2 tháng."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n15
  cau: "Nghiên cứu 2: so với các thang hạnh phúc chủ quan khác ở 176 và 163 sinh viên."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n16
  cau: "Nghiên cứu 3: 53 người cao tuổi, tuổi trung bình 75."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n17
  cau: "Cách chấm: mỗi câu thang 7 điểm (1 = hoàn toàn không đồng ý, 7 = hoàn toàn đồng ý); tổng từ 5 đến 35."
  loai: cong-cu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n18
  cau: Điểm 20 là điểm trung tính của thang.
  loai: cong-cu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n19
  cau: "Cách đọc điểm theo hướng dẫn của Diener: 30–35 rất cao, 25–29 cao, 20–24 trung bình (mức thường gặp ở các nước phát triển), 15–19 hơi dưới trung bình, 10–14 không hài lòng, 5–9 rất không hài lòng; đây không phải ngưỡng chẩn đoán."
  loai: cong-cu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n20
  cau: SWLS có nhất quán nội tại alpha = 0,87.
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n21
  cau: "SWLS đo lại sau 2 tháng: r = 0,82 (76 sinh viên)."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n22
  cau: "SWLS tương quan với các thang hạnh phúc chủ quan khác ở mức trung bình đến cao: r từ 0,47 đến 0,75 (không kể thang cảm xúc tiêu cực: −0,37 và −0,32)."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n23
  cau: 'SWLS với câu "phần trăm thời gian hạnh phúc" của Fordyce: r = 0,58 và 0,62 (hai mẫu).'
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n24
  cau: "SWLS với thang Cantril: r = 0,62 và 0,66."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n25
  cau: Với người cao tuổi, SWLS tương quan r = 0,46 với bản sửa Life Satisfaction Index của Adams (1969) và r = 0,43 với đánh giá của người phỏng vấn.
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n26
  cau: 5 câu ngắn đo điều gần với thứ các thang khác đo, và khá ổn định theo thời gian ở sinh viên.
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n27
  cau: "Sandvik, Diener & Seidlitz (1993): theo dõi 136 sinh viên trong một học kỳ, so thang tự đánh giá (một câu và nhiều câu) với các cách đo không tự đánh giá; theo tóm tắt gồm đánh giá của người nhà và bạn bè."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n28
  cau: Phân tích nhân tố các cách đo cho thấy một cấu trúc chung duy nhất; thang tự đánh giá tương quan cao với cách đo khác; đánh giá người nhà và bạn bè nhất quán đáng kể.
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n29
  cau: "Kết luận của Sandvik và cộng sự: thang tự đánh giá thông thường đo hạnh phúc chủ quan một cách có giá trị; các cách đo không tự đánh giá hữu ích để có bức tranh đầy đủ hơn."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n30
  cau: 'Một hạn chế của thang tổng thể như SWLS: hỏi về "cuộc đời nói chung", nên các báo cáo toàn cục không chứa tình huống cụ thể (Kahneman 2004: các nghiên cứu thường dựa vào báo cáo toàn cục về hạnh phúc hay hài lòng).'
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n31
  cau: Kahneman, Krueger, Schkade, Schwarz & Stone (2004) đề xuất Day Reconstruction Method (DRM).
  loai: lich-su
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n32
  cau: "DRM: 909 phụ nữ có việc làm (trong mẫu tiện lợi 1.018 người) tái cấu trúc ngày hôm qua thành các đoạn và đánh giá cảm xúc từng đoạn."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n33
  cau: Kết quả DRM gần với kết quả experience sampling (phương pháp được coi là chuẩn vàng), với gánh nặng cho người tham gia thấp hơn.
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n34
  cau: DRM gắn cảm xúc với hoạt động và bối cảnh cụ thể.
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n35
  cau: "Khung Khá vững: hạnh phúc chủ quan đo được, với độ tin cậy tốt."
  loai: nhan
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n36
  cau: "Khung Khá vững — chi tiết: SWLS hội tụ với các thang khác (r ≈ 0,47–0,75); thang tự đánh giá tương quan cao với cách đo không tự đánh giá."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n37
  cau: "Khung Khá vững: tổng quan hệ thống các bản dịch SWLS thấy độ nhất quán nội tại đạt ở hầu hết nghiên cứu (alpha 0,74–0,89), ít nghiên cứu kiểm độ ổn định theo thời gian."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n38
  cau: "Khung Đang tranh cãi: diễn giải các con số như thế nào."
  loai: nhan
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n39
  cau: "Schimmack, Schupp & Wagner (2008): mẫu đại diện ở Đức (N = 1.053); tính cách (neuroticism) dự báo cảm xúc mạnh hơn hài lòng cuộc sống; thất nghiệp và khác biệt Đông–Tây Đức dự báo hài lòng cuộc sống mạnh hơn cảm xúc."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n40
  cau: Câu trả lời có thể chịu ảnh hưởng của tâm trạng lúc trả lời (thời tiết ảnh hưởng đến phán đoán hạnh phúc và hài lòng).
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n41
  cau: "Suh và cộng sự (1998): tương quan giữa hài lòng cuộc sống và cảm xúc mạnh hơn ở các nước cá nhân chủ nghĩa; dao động giữa các nước."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n42
  cau: Cùng một điểm số có thể "có nghĩa" khác nhau ở các nền văn hóa khác nhau.
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n43
  cau: "Lý thuyết 1: theo bottom-up hạnh phúc là tổng các trải nghiệm tốt; theo top-down hạnh phúc đến từ khuynh hướng chung (tính cách, cách nhìn đời) ảnh hưởng cách ta phản ứng với sự kiện (Diener 1984 trình bày cả hai)."
  loai: lich-su
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n44
  cau: "Lý thuyết 1 (kết): hai cách đo khác nhau có thể đang bắt hai lớp của cùng một hiện tượng."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n45
  cau: "Lý thuyết 2: SWLS dựa vào việc nhìn lại cuộc đời, DRM/experience sampling dựa vào trải nghiệm trực tiếp; hai thứ liên quan nhưng không giống nhau (trong DRM hài lòng cuộc sống tương quan r = 0,38 với cảm xúc thuần hằng ngày)."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n46
  cau: "Lý thuyết 3: tâm trạng nhất thời ảnh hưởng đến câu trả lời."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n47
  cau: 'Lý thuyết 3: mong muốn "trông có vẻ ổn" gần như không liên quan SWLS (r = 0,02 với thang Marlowe–Crowne).'
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n48
  cau: "Lý thuyết 3: khi gộp nhiều cách đo độc lập, chúng cùng chỉ về một cấu trúc chung (Sandvik 1993)."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n49
  cau: "Áp dụng 1 (tiêu đề): dùng thang đo để theo dõi chính mình theo thời gian, không phải để so với người khác. Nhãn Khá vững."
  loai: nhan
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n50
  cau: "Áp dụng 1: test-retest r = 0,82 sau 2 tháng; SWLS khá ổn định ở mức nhóm."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n51
  cau: "Áp dụng 1: với SD = 6,43 và r = 0,82, sai số chuẩn của một điểm khoảng 2,7 điểm, nên chênh vài điểm giữa hai lần chấm có thể là nhiễu."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n52
  cau: 'Áp dụng 2 (tiêu đề): kết hợp "đánh giá tổng thể" với "nhật ký khoảnh khắc". Nhãn Khá vững.'
  loai: nhan
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n53
  cau: "Áp dụng 2: vì hài lòng cuộc sống và cảm xúc hằng ngày là hai chiều tách biệt nên chỉ đo một chiều là chưa đủ."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n54
  cau: "Áp dụng 2: cách làm ghi nhanh 3 cảm xúc mỗi tối và chấm SWLS thỉnh thoảng là một gợi ý, chưa được nghiên cứu kiểm tra riêng."
  loai: loi-khuyen
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n55
  cau: "Áp dụng 3 (tiêu đề): hỏi người thân như một kênh kiểm chứng bổ sung. Nhãn Khá vững."
  loai: nhan
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n56
  cau: "Áp dụng 3: đánh giá của người quen biết bạn tương quan ở mức trung bình (r ≈ 0,42) với tự đánh giá."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n57
  cau: "Áp dụng 3: khoảng cách giữa tự đánh giá và đánh giá của người thân đáng để lắng nghe; không bên nào tự động đúng hơn."
  loai: loi-khuyen
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n58
  cau: "Giới hạn chung: đừng dùng điểm số để dán nhãn người khác, đừng coi một con số là chẩn đoán sức khỏe tinh thần; các thang này được thiết kế để đo đánh giá chung về cuộc sống."
  loai: loi-khuyen
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n59
  cau: "Giới hạn chung: diễn giải điểm số trong bối cảnh văn hóa Việt Nam còn ít dữ liệu."
  loai: thoi-su
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n60
  cau: "Việt Nam: tính đến 11/2026 có một nghiên cứu kiểm tra bản tiếng Việt của SWLS (Arrindell 2022, 1.073 tình nguyện viên ở TP Hồ Chí Minh, 14–64 tuổi, trung bình 23 tuổi; mẫu tiện lợi)."
  loai: thoi-su
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n61
  cau: "Việt Nam: cấu trúc một chiều, độ tin cậy omega đạt; tương đương theo giới và học vấn, tương đương theo tuổi rất kém."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n62
  cau: "Việt Nam: chưa tìm thấy nghiên cứu về độ ổn định theo thời gian của bản tiếng Việt hay mẫu đại diện toàn quốc."
  loai: thoi-su
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n63
  cau: Các con số gốc của SWLS (alpha 0,87; test-retest 0,82; tương quan hội tụ) đều từ mẫu sinh viên và người cao tuổi ở Mỹ (Illinois).
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n64
  cau: "Việt Nam (văn hóa): tương quan giữa hài lòng cuộc sống và cảm xúc dao động giữa các nước, mạnh hơn ở các nước cá nhân chủ nghĩa (Suh 1998)."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n65
  cau: "Thang dịch sang tiếng Việt cần kiểm tra lại: tổng quan hệ thống các bản dịch SWLS nhấn mạnh cần quy trình kiểm định chuẩn hóa khi dịch."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n66
  cau: Chuẩn điểm (bao nhiêu là "cao") không nên bê nguyên từ mẫu Mỹ sang người Việt (suy luận từ khác biệt văn hóa).
  loai: loi-khuyen
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n67
  cau: "Kết luận Việt Nam: cách đo dùng được ở nhiều nơi (SWLS dịch sang hơn 30 ngôn ngữ) nhưng ý nghĩa con số phải hiệu chỉnh."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n68
  cau: "Kết luận Việt Nam: mới thấy một nghiên cứu về cấu trúc và tương đương đo lường; chưa thấy chuẩn điểm cho người Việt (tính đến 11/2026)."
  loai: thoi-su
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n69
  cau: 'Ngộ nhận 1: "hạnh phúc là cảm giác riêng tư nên không thể đo được" — sai; SWLS alpha 0,87, r = 0,82 sau 2 tháng, hội tụ trung bình với đánh giá người thân (r ≈ 0,42).'
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n70
  cau: 'Ngộ nhận 1: "chủ quan" không có nghĩa "tùy tiện".'
  loai: dinh-nghia
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n71
  cau: "Ngộ nhận 2: SWLS chỉ đo đánh giá chủ quan về cuộc sống, không đo sức khỏe, đạo đức hay thành công khách quan; không phải công cụ chẩn đoán."
  loai: dinh-nghia
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n72
  cau: "Ngộ nhận 3: hỏi một câu là chưa đủ tốt; thang nhiều câu thường ổn định theo thời gian hơn thang một câu (Diener 1984)."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n73
  cau: "Ngộ nhận 3: các thành phần (hài lòng cuộc sống, cảm xúc tích cực/tiêu cực) phân biệt được với nhau."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n75
  cau: "Câu hỏi 1: đáp án đúng là ba thành phần: hài lòng với cuộc sống, cảm xúc tích cực và cảm xúc tiêu cực; giải thích: định nghĩa kết hợp đánh giá bằng lý trí và trải nghiệm cảm xúc, hai thứ liên quan nhưng không trùng nhau."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n76
  cau: "Câu hỏi 2: SWLS có 5 câu hỏi, thang 7 điểm, tổng 5–35, 20 là điểm trung tính; bản thử đầu có 48 câu, phân tích nhân tố rút còn 5."
  loai: cong-cu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n77
  cau: "Câu hỏi 3: SWLS đo lại sau 2 tháng có r = 0,82; ổn định khá tốt ở mức nhóm nhưng điểm vẫn dao động thật."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n78
  cau: "Câu hỏi 4: Sandvik, Diener & Seidlitz (1993) thấy các cách đo cùng chỉ về một cấu trúc chung, thang tự đánh giá tương quan cao với cách đo khác."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n79
  cau: 'Câu hỏi 5: nhãn "đang tranh cãi" của phần diễn giải vì hài lòng cuộc sống và cảm xúc là hai chiều tách biệt, chịu ảnh hưởng của ngữ cảnh trả lời và khác nhau giữa các văn hóa.'
  loai: nhan
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n81
  cau: 'Câu "không có thang đo hoàn hảo": các câu hỏi về đo hạnh phúc vẫn còn vấn đề (tâm trạng, tự đánh giá).'
  loai: phat-hien
- trang: kham-pha/hanh-phuc/tien-va-hanh-phuc
  id: n44
  cau: "Khung Khá vững: hạnh phúc cảm xúc và đánh giá cuộc sống là hai thứ khác nhau, có yếu tố ảnh hưởng khác nhau."
  loai: nhan
  nguon:
    - ten: "Kahneman & Deaton (2010), PNAS 107(38), 16489–16493: toàn văn (PDF bản tác giả, trang Princeton của Deaton); tóm tắt thêm từ PMC2944762"
      link: https://doi.org/10.1073/pnas.1011492107
    - ten: "Killingsworth (2021), PNAS 118(4), e2016976118: toàn văn (PMC7848527, qua Europe PMC)"
      link: https://doi.org/10.1073/pnas.2016976118
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "Sự phân biệt này được lặp lại qua nhiều nghiên cứu với nhiều cách đo: cảm xúc hằng ngày và đánh giá tổng thể cuộc đời có các yếu tố ảnh hưởng khác nhau. Đây là phần vững chắc nhất của cả câu chuyện.". Chữ mới: "Sự phân biệt này được thấy trong nhiều nghiên cứu với nhiều cách đo: cảm xúc hằng ngày và đánh giá tổng thể cuộc đời có các yếu tố ảnh hưởng khác nhau (Kahneman và Deaton, 2010; Kahneman và cộng sự, 2004). Riêng với thu nhập, Killingsworth (2021) không thấy mức thu nhập nào mà hai thứ tách ra. Đây l". Lý do: "Phần vững chắc nhất" vượt nhãn Khá vững; thêm điểm Killingsworth 2021 không thấy tách rời theo thu nhập.'
- trang: kham-pha/hanh-phuc/tien-va-hanh-phuc
  id: n52
  cau: "Áp dụng 1 (nhãn Đang tranh cãi): đừng coi 75.000 USD là ngưỡng hạnh phúc của bạn; số này từ dữ liệu Mỹ hơn một thập kỷ trước; theo phân tích mới nhất chỉ mô tả nhóm 20% ít hạnh phúc nhất."
  loai: nhan
  nguon:
    - ten: "Kahneman & Deaton (2010), PNAS 107(38), 16489–16493: toàn văn (PDF bản tác giả, trang Princeton của Deaton); tóm tắt thêm từ PMC2944762"
      link: https://doi.org/10.1073/pnas.1011492107
