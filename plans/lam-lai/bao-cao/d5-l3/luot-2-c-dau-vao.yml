- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n1
  cau: Ophir, Nass và Wagner (2009) thấy người đa nhiệm truyền thông nặng làm kém hơn ở các bài kiểm tra kiểm soát nhận thức, nhưng nhiều kết quả sau chưa lặp lại; Uncapher và Wagner (2018) tổng quan một thập kỷ nghiên cứu (mô tả của trang).
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n2
  cau: Não người gần như không làm tốt được hai việc đòi hỏi chú ý cùng lúc; cái gọi là "đa nhiệm" thường thực chất là chuyển đổi nhiệm vụ, và mỗi lần chuyển đều tốn "phí chuyển đổi" (chậm hơn, sai nhiều hơn).
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n3
  cau: Nhóm đa nhiệm nhiều nhất lại chuyển đổi nhiệm vụ kém hơn, dù kết quả này chưa được các nghiên cứu sau lặp lại.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n5
  cau: 'Herbert Simon viết từ năm 1971 rằng trong thế giới thừa mứa thông tin, thứ khan hiếm không phải thông tin mà là chú ý: "sự giàu có về thông tin tạo ra sự nghèo nàn về chú ý".'
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n6
  cau: Các nền tảng miễn phí bán sự chú ý của bạn cho nhà quảng cáo; mỗi thông báo, video tự chạy, gợi ý là một cái móc câu được tính toán để giữ bạn ở lại; bạn đang đấu với cả một ngành công nghiệp nghìn tỷ đô được tối ưu hóa để thắng mình.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n7
  cau: "Ophir và cộng sự (2009): nhóm nghiên cứu ở Stanford cho sinh viên làm bảng hỏi để tính chỉ số đa nhiệm truyền thông, rồi chọn hai nhóm ở hai đầu (đa nhiệm nặng và nhẹ)."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n8
  cau: "Theo thông cáo của Stanford, khoảng 100 sinh viên làm ba bài kiểm tra khả năng kiểm soát nhận thức: lọc nhiễu từ môi trường, lọc nhiễu từ trí nhớ, và chuyển đổi giữa các nhiệm vụ."
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n9
  cau: 'Nhóm đa nhiệm nặng làm kém hơn ở cả ba bài, kể cả bài chuyển đổi nhiệm vụ; họ dễ bị nhiễu hơn từ môi trường và từ trí nhớ (trang: "Cụ thể, họ dễ bị nhiễu…").'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n10
  cau: 'Clifford Nass tóm gọn: họ là "con mồi dễ dàng của những thứ không liên quan" (suckers for irrelevancy); mọi thứ đều lôi kéo được sự chú ý của họ.'
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n11
  cau: "Giải thích của nhóm nghiên cứu: kết quả chuyển đổi kém nhiều khả năng do người đa nhiệm nặng khó gạt bỏ nhiễu từ bộ quy tắc của nhiệm vụ kia."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n12
  cau: Uncapher và Wagner (2018) tổng quan các nghiên cứu về mối liên hệ giữa đa nhiệm truyền thông và nhận thức, đến năm 2018.
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n13
  cau: Cán cân bằng chứng cho thấy người đa nhiệm truyền thông nặng hơn có hiệu suất thấp hơn ở một số lĩnh vực nhận thức, thường ở các bài đòi hỏi duy trì chú ý hướng đích, nhưng nhiều nghiên cứu không thấy khác biệt giữa hai nhóm.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n14
  cau: Một phân tích tổng hợp sau đó (118 phép đo) thấy liên hệ chung là nhỏ.
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n15
  cau: Hầu hết các nghiên cứu là tương quan, nên chưa rõ đa nhiệm làm nhận thức kém đi hay người vốn khó tập trung mới tìm đến đa nhiệm; các tác giả nêu cần thêm nghiên cứu để xác định chiều nhân quả.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n16
  cau: 'Ward và cộng sự (2017): chỉ riêng sự hiện diện của điện thoại làm giảm năng lực nhận thức có sẵn, kể cả khi người tham gia không dùng đến nó; giả thuyết "brain drain": sự hiện diện của điện thoại chiếm một phần nguồn lực nhận thức có hạn.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n18
  cau: Trong nghiên cứu của Ward và cộng sự, cái giá cao nhất ở những người phụ thuộc smartphone nhiều nhất.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n20
  cau: Một phân tích tổng hợp 33 nghiên cứu với 4.368 người không thấy sự hiện diện của điện thoại làm giảm khả năng nhận thức (d = −0,02), và không thấy mức phụ thuộc điện thoại làm thay đổi kết quả (Hartanto và cộng sự, 2024).
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n23
  cau: Một phân tích tổng hợp thấy liên hệ mất ý nghĩa sau khi hiệu chỉnh cho các nghiên cứu nhỏ (Wiradhany và Nieuwenstein, 2017).
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n25
  cau: Người đa nhiệm nhiều nhất thường cũng bốc đồng nhất (Sanbonmatsu và cộng sự, 2013).
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n26
  cau: Cũng có thể cả hai chiều cùng đúng (một vòng xoáy hai chiều giữa đa nhiệm và khó tập trung), nhưng chưa có bằng chứng quyết định.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n28
  cau: Với việc làm cùng lúc hai việc đòi hỏi chú ý, đa số người giảm hiệu suất; chỉ khoảng 2,5% người tham gia một nghiên cứu lái xe mô phỏng gần như không bị giảm hiệu suất (Watson và Strayer, 2010).
  loai: so-lieu
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n30
  cau: "Giả thuyết của Ophir và cộng sự: người đa nhiệm truyền thông nặng dễ bị nhiễu từ kích thích không liên quan và từ trí nhớ, và điều này nhiều khả năng làm họ chuyển nhiệm vụ kém hơn."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n31
  cau: "Vòng xoáy chú ý: các nền tảng được thiết kế để khai thác mọi kẽ hở chú ý → thói quen kiểm tra liên tục → suy yếu khả năng duy trì chú ý → dễ bị móc câu hơn; đây là câu chuyện môi trường được thiết kế để ý chí của bạn thua."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n36
  cau: Chỉ riêng việc nhận một thông báo cũng có thể làm giảm hiệu suất ở bài đòi hỏi chú ý, kể cả khi người ta không chạm vào điện thoại (Stothart và cộng sự, 2015); trong một thí nghiệm ngẫu nhiên ngoài đời (Fitz và cộng sự, 2019; 237 người), nhóm nhận thông báo gom thành ba đợt mỗi ngày cảm thấy tập trung, năng suất và kiểm soát điện thoại tốt hơn nhóm nhận như thường lệ; nhóm không nhận thông báo nào lo âu và sợ bỏ lỡ nhiều hơn.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n39
  cau: "Thí nghiệm tại gia: ba buổi học với điện thoại trên bàn, trong túi, ở phòng khác; nếu hiệu ứng trong nghiên cứu gốc có thật, buổi 3 sẽ tốt nhất và buổi 1 kém nhất; một lần tự thử chưa đủ để kết luận, nhất là khi lần làm lại có đăng ký trước và phân tích tổng hợp không thấy hiệu ứng này."
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n40
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu thực nghiệm nào đo tác động nhận thức của đa nhiệm truyền thông trên người Việt; có một khảo sát hành vi đa nhiệm trong lớp học ở 257 sinh viên một trường đại học ở Hà Nội (2026), nhưng đó không phải bài kiểm tra nhận thức.
  loai: thoi-su
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n41
  cau: Các nghiên cứu kể trong bài chủ yếu làm với sinh viên ở Mỹ, Canada và châu Âu; lần làm lại của Wiradhany và Nieuwenstein (2017) có thêm một mẫu sinh viên Indonesia.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n42
  cau: Việt Nam có tỉ lệ dùng smartphone và mạng xã hội thuộc hàng cao; Zalo, Facebook, TikTok len vào mọi kẽ hở thời gian; học sinh vừa học online vừa chat, người đi đường vừa chạy xe vừa xem điện thoại; nền kinh tế chú ý vận hành ở Việt Nam với cường độ không kém nơi nào.
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n43
  cau: 'Ngộ nhận: "Người trẻ đa nhiệm giỏi vì họ là thế hệ số." Chúng tôi không tìm thấy bằng chứng cho điều này; Ophir và cộng sự (2009) còn thấy nhóm đa nhiệm nặng (sinh viên Stanford) chuyển đổi nhiệm vụ kém hơn nhóm nhẹ, dù các nghiên cứu sau chưa lặp lại; quen dùng nhiều thiết bị không đồng nghĩa với dùng hiệu quả.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n44
  cau: 'Ngộ nhận: "Vừa nghe nhạc vừa học giúp tập trung hơn." Nhạc không lời, đều đều, âm lượng nhỏ có thể che tiếng ồn xung quanh; nhạc có lời, podcast, video luôn tranh chú ý với bài học.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n45
  cau: 'Ngộ nhận: "Tắt thông báo là đủ, để điện thoại cạnh cũng được." Bằng chứng chưa ngã ngũ: Ward và cộng sự (2017) thấy chỉ riêng sự hiện diện của điện thoại trên bàn làm giảm hiệu suất, nhưng lần làm lại có đăng ký trước và tổng hợp không thấy điều này.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n46
  cau: 'Ngộ nhận: "Đa nhiệm truyền thông = đa nhiệm nói chung." Không: nghiên cứu trong bài chỉ nói về dùng nhiều luồng truyền thông cùng lúc; vừa nấu cơm vừa nghe podcast khác với vừa học bài vừa trả lời tin nhắn.'
  loai: dinh-nghia
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n49
  cau: 'Quiz 3: thí nghiệm "brain drain" của Ward và cộng sự (2017): các tác giả báo cáo chỉ riêng việc điện thoại ở gần đã làm giảm năng lực nhận thức; lần làm lại có đăng ký trước và phân tích tổng hợp 33 nghiên cứu không thấy hiệu ứng, nên đây vẫn đang tranh cãi.'
  loai: phat-hien
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n50
  cau: 'Quiz 4: Herbert Simon (1971): thông tin dồi dào thì chú ý trở thành thứ khan hiếm: "sự giàu có về thông tin tạo ra sự nghèo nàn về chú ý".'
  loai: lich-su
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n52
  cau: 'Mục Nguồn: Böttger (2023); Fitz (2019); Hartanto (2024); Kiesel (2010); Ophir (2009); Parry & le Roux (2021); Ruiz Pardo & Minda (2022); Sanbonmatsu (2013); Simon (1971); Stothart (2015); Uncapher & Wagner (2018); Ward (2017); Watson & Strayer (2010); Wiradhany & Nieuwenstein (2017) (thông tin sách báo); Ophir: "~100 sinh viên Stanford làm bài kiểm tra".'
  loai: lich-su
