  id: "n29"
  luot_2: "dung"
  nguon: *a12
  trich: "Wood & Cowan 1995: 34 sinh viên, 'only 34.6% of the participants recalled hearing their name'; Röer & Cowan 2021: 29%; Conway 2001 thuật 'approximately 33%' cho Moray và Wood & Cowan; Wood & Cowan: người nghe tên có lỗi ở hai mục sau tên."
  ghi_chu: "Con số đúng. Lưu ý: tỉ lệ không cố định ở một phần ba: Conway 2001 trung bình khoảng 43% và Naveh-Benjamin 2014 ở người trẻ 48-58% (theo Röer & Cowan 2021)."
- trang: "kham-pha/chu-y-tri-giac/nghe-chon-loc"
  id: "n30"
  luot_2: "dung"
  nguon: *a12
  trich: "Wood & Cowan 1995: 34 sinh viên, 'only 34.6% of the participants recalled hearing their name'; Röer & Cowan 2021: 29%; Conway 2001 thuật 'approximately 33%' cho Moray và Wood & Cowan; Wood & Cowan: người nghe tên có lỗi ở hai mục sau tên."
  ghi_chu: "Con số đúng. Lưu ý: tỉ lệ không cố định ở một phần ba: Conway 2001 trung bình khoảng 43% và Naveh-Benjamin 2014 ở người trẻ 48-58% (theo Röer & Cowan 2021)."
- trang: "kham-pha/chu-y-tri-giac/nghe-chon-loc"
  id: "n31"
  luot_2: "dung"
  nguon: &a16
    - "https://doi.org/10.3758/bf03196169"
    - "https://doi.org/10.1037/xlm0000874"
  trich: "Conway 2001: những người nghe tên mình có dung lượng trí nhớ làm việc thấp; Röer & Cowan 2021: 'Low-span participants were more likely than high-span participants to notice their names' (operation span và running span)."
  ghi_chu: "Con số 65% so với 20% (Conway 2001) không đọc được trong bản mở; hướng kết quả được xác nhận bởi hai nghiên cứu. n37 'Khá vững' hợp lý (hai nghiên cứu cùng chiều, nhưng Röer & Cowan lưu ý bảng hỏi nhạy kém với khác biệt trí nhớ làm việc)."
- trang: "kham-pha/chu-y-tri-giac/nghe-chon-loc"
