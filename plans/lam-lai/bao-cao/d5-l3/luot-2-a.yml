    - "https://doi.org/10.1037/xlm0000874"
  ghi_chu: "Các tham chiếu khớp: Wood & Cowan JEP:LMC 21(1) 255–260; Conway PBR 2001; Röer & Cowan JEP:LMC 2021 (47(2) 234-242). Cherry/Moray/Treisman/Lavie/Deutsch chưa kiểm tập trang."
