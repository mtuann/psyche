  luot_2: "dung"
  nguon: *a3
  trich: "'Data from 15 societies are presented showing substantial intersocietal differences of two types in susceptibility to geometric optical illusions.' (Science 1963)"
  ghi_chu: "Số xã hội (15), năm, tạp chí đúng; Henrich 2010 mở đầu bằng Müller-Lyer; van der Kamp 2013: Atten Percept Psychophys 75(5), 1027–1038 (Crossref khớp, nhưng bài về ảo giác Judd)."
- trang: "kham-pha/chu-y-tri-giac/nhin-ma-khong-thay"
  id: "n1"
  luot_2: "dung"
  nguon: &a6
    - "https://doi.org/10.1068/p281059"
  trich: "'Out of all 192 observers across all conditions, 54% noticed the unexpected event and 46% failed to notice'; bản đấm ngực: 12 người, 'only 50% noticed'; khỉ đột hiện 9 s, 'thumped its chest'; Neisser & Becklen 1975."
  ghi_chu: "Đọc toàn văn PDF (Perception 1999). Chú ý: 46% là tỉ lệ không thấy ở mọi điều kiện (khỉ đột lẫn người cầm ô), không riêng khỉ đột."
