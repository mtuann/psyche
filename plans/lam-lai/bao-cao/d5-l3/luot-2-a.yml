- trang: "kham-pha/chu-y-tri-giac/nghe-chon-loc"
  id: "n35"
  luot_2: "qua-manh"
  nguon:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC8908911/"
    - "https://doi.org/10.1037/0278-7393.21.1.255"
  trich: "Röer & Cowan 2021: 33% (Moray), 35% (Wood & Cowan), 'somewhat lower as the 43 percent from Conway et al. (2001)' và 58 và 48% ở người trẻ trong Naveh-Benjamin et al. (2014)."
  cau_dung: "Trong các lần làm lại, khoảng một phần ba (29-35%) nhận ra tên mình ở Moray, Wood & Cowan và Röer & Cowan, nhưng các nghiên cứu khác ghi 43% (Conway) đến 48-58% (Naveh-Benjamin); nên nói 'từ khoảng một phần ba đến khoảng một nửa'."
  ghi_chu: "Câu nói chỉ 1/3 chung chung, hẹp hơn dải kết quả thật."
