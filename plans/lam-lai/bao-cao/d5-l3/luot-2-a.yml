  id: "n60"
  luot_2: "dung"
  nguon: *a14
  trich: "Cherry 1953 (tóm tắt thứ cấp): đổi sang tiếng bíp 400 Hz 'always noticed'; giọng nam sang nữ 'nearly always'; đảo ngược: 'some noticed something queer', số khác không thấy gì; trộn hai bài: sáo ngữ khiến tách luồng 'impossible'."
  ghi_chu: "Chỉ đọc tóm tắt thứ cấp; Cherry 1953 chưa mở được. n14 'phần lớn không nhận ra' khớp tóm tắt nhưng cần đối chiếu."
