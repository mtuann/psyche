  id: "n52"
  luot_2: "dung"
  nguon: *a12
  trich: "Wood & Cowan 1995: 34 sinh viên, 'only 34.6% of the participants recalled hearing their name'; Röer & Cowan 2021: 29%; Conway 2001 thuật 'approximately 33%' cho Moray và Wood & Cowan; Wood & Cowan: người nghe tên có lỗi ở hai mục sau tên."
  ghi_chu: "Con số đúng. Lưu ý: tỉ lệ không cố định ở một phần ba: Conway 2001 trung bình khoảng 43% và Naveh-Benjamin 2014 ở người trẻ 48-58% (theo Röer & Cowan 2021)."
