  id: "n51"
  luot_2: "khong-chac"
  ghi_chu: "Phần 'tín hiệu cảnh báo gắn với cá nhân dễ nghe hơn' hợp lý từ hiệu ứng tên riêng, nhưng không tìm được nguồn cho 'các hệ thống cảnh báo an toàn áp dụng nguyên tắc này'; hiệu ứng tên chỉ khoảng 30-50% người."
