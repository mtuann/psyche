  ghi_chu: "Không mở được toàn văn Segall, Campbell & Herskovits (1966) để đối chiếu xếp hạng từng nhóm (người Mỹ/Johannesburg dễ bị nhất, người San ít nhất, ảo giác ngang-dọc đảo chiều). Tóm tắt Science 1963 chỉ nói 15 xã hội có khác biệt lớn thuộc hai loại. Amir & Firestone (Psychological Review 2026) cho rằng bằng chứng gốc về biến thiên văn hóa 'rất không nhất quán' và bị các bài sau tường thuật sai; cần đọc bản gốc trước khi giữ các xếp hạng cụ thể."
- trang: "kham-pha/chu-y-tri-giac/ao-giac-thi-giac"
  id: "n16"
  luot_2: "khong-chac"
  ghi_chu: "Không mở được toàn văn Segall, Campbell & Herskovits (1966) để đối chiếu xếp hạng từng nhóm (người Mỹ/Johannesburg dễ bị nhất, người San ít nhất, ảo giác ngang-dọc đảo chiều). Tóm tắt Science 1963 chỉ nói 15 xã hội có khác biệt lớn thuộc hai loại. Amir & Firestone (Psychological Review 2026) cho rằng bằng chứng gốc về biến thiên văn hóa 'rất không nhất quán' và bị các bài sau tường thuật sai; cần đọc bản gốc trước khi giữ các xếp hạng cụ thể."
- trang: "kham-pha/chu-y-tri-giac/ao-giac-thi-giac"
  id: "n17"
  luot_2: "qua-manh"
  nguon:
    - "https://doi.org/10.1037/rev0000549"
    - "https://doi.org/10.1126/science.139.3556.769"
  trich: "Amir & Firestone 2026: 'the evidence for cultural variation and its correlation with key cultural variables is in fact highly inconsistent' ; ảo giác còn thấy ở động vật, người mù bẩm sinh, qua xúc giác."
  cau_dung: "Một số nghiên cứu kinh điển cho rằng mức bị ảo giác Müller-Lyer khác nhau giữa các xã hội, nhưng phân tích lại gần đây (Amir & Firestone, 2026) cho rằng bằng chứng về ảnh hưởng của môi trường sống là không nhất quán; chưa nên nói chắc là 'dấu ấn của môi trường sống'."
  ghi_chu: "Bài phản biện còn mới (Psychological Review 2026), chưa có tái lập; nên viết là giả thuyết đang bị thách thức."
- trang: "kham-pha/chu-y-tri-giac/ao-giac-thi-giac"
  id: "n18"
  luot_2: "dung"
  nguon:
    - "https://doi.org/10.1126/science.139.3556.769"
    - "https://doi.org/10.1037/rev0000549"
  ghi_chu: "Mô tả đúng nội dung giả thuyết 'carpentered world'; lưu ý giả thuyết đang bị Amir & Firestone (2026) cho là 'gần như chắc chắn sai'."
- trang: "kham-pha/chu-y-tri-giac/ao-giac-thi-giac"
  id: "n19"
  luot_2: "dung"
  nguon: *a3
  trich: "'Data from 15 societies are presented showing substantial intersocietal differences of two types in susceptibility to geometric optical illusions.' (Science 1963)"
  ghi_chu: "Số xã hội (15), năm, tạp chí đúng; Henrich 2010 mở đầu bằng Müller-Lyer; van der Kamp 2013: Atten Percept Psychophys 75(5), 1027–1038 (Crossref khớp, nhưng bài về ảo giác Judd)."
- trang: "kham-pha/chu-y-tri-giac/ao-giac-thi-giac"
  id: "n20"
  luot_2: "dung"
  nguon:
    - "https://doi.org/10.1037/rev0000549"
    - "https://doi.org/10.1073/pnas.0409314102"
  trich: "Ảo giác thấy ở nhiều giác quan, cả động vật và người mù bẩm sinh (Amir & Firestone 2026); Howe & Purves 2005: 'best known and most controversial of the classical geometrical illusions'."
  ghi_chu: "Không tìm được phân tích tổng hợp riêng; nhưng sự tồn tại và đo được của ảo giác không bị tranh cãi. Thước đo mục 4 áp cho nhãn này hơi lỏng."
- trang: "kham-pha/chu-y-tri-giac/ao-giac-thi-giac"
  id: "n21"
  luot_2: "qua-manh"
  nguon:
    - "https://doi.org/10.1037/rev0000549"
    - "https://doi.org/10.1126/science.139.3556.769"
  trich: "Amir & Firestone 2026: bằng chứng về biến thiên văn hóa 'highly inconsistent, beset by questionable research practices, and misreported'; họ kết luận giả thuyết 'cultural byproduct' 'almost certainly false'."
  cau_dung: "Đang tranh cãi: các nghiên cứu kinh điển (Segall và cộng sự) báo cáo khác biệt giữa các nền văn hóa, nhưng phân tích lại năm 2026 cho rằng bằng chứng đó không nhất quán và còn nghi vấn phương pháp."
  ghi_chu: "Nhãn 'Khá vững' cao hơn thước đo: dữ liệu chủ yếu từ các nghiên cứu những năm 1960, chưa có tái lập lớn có đăng ký trước, và có tổng quan phản biện mạnh."
- trang: "kham-pha/chu-y-tri-giac/ao-giac-thi-giac"
  id: "n22"
  luot_2: "dung"
  nguon: *a3
  trich: "'Data from 15 societies are presented showing substantial intersocietal differences of two types in susceptibility to geometric optical illusions.' (Science 1963)"
  ghi_chu: "Số xã hội (15), năm, tạp chí đúng; Henrich 2010 mở đầu bằng Müller-Lyer; van der Kamp 2013: Atten Percept Psychophys 75(5), 1027–1038 (Crossref khớp, nhưng bài về ảo giác Judd)."
- trang: "kham-pha/chu-y-tri-giac/ao-giac-thi-giac"
  id: "n23"
  luot_2: "dung"
  nguon:
    - "https://doi.org/10.1037/rev0000549"
    - "https://doi.org/10.3758/s13414-013-0458-5"
  trich: "van der Kamp et al. 2013 (ảo giác Judd, 24 người Đông Á và 24 người phương Tây): 'the individual differences in illusory bias related to culture could not be unequivocally attributed' tới một cơ chế."
  ghi_chu: "Nội dung đúng (Amir & Firestone 2026 xác nhận tranh cãi). Lưu ý: van der Kamp 2013 nghiên cứu ảo giác Judd (biến thể Müller-Lyer) với mẫu nhỏ, không phải bản đánh giá lại dữ liệu Segall; nên dẫn thêm Amir & Firestone 2026."
- trang: "kham-pha/chu-y-tri-giac/ao-giac-thi-giac"
  id: "n24"
  luot_2: "dung"
  nguon: &a4
    - "https://doi.org/10.1073/pnas.0409314102"
  trich: "Howe & Purves 2005: Müller-Lyer là 'the most controversial of the classical geometrical illusions'; họ đề xuất giải thích bằng thống kê cảnh tự nhiên, trái với thuyết Gregory."
  ghi_chu: "Nhiều cách giải thích cạnh tranh đúng như viết."
