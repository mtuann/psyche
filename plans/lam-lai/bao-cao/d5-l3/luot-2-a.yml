  ghi_chu: "Các mô hình (Broadbent 1958, Treisman 1960/1964, Deutsch & Deutsch 1963, Lavie 1995) mô tả đúng như tài liệu chuẩn, nhưng không mở bài gốc. n53, n55, n56 (thời sự): tìm Europe PMC ngày 10/11/2026 không thấy nghiên cứu hiệu ứng bữa tiệc cocktail ở người Việt; Röer & Cowan dùng người nói tiếng Đức, các nghiên cứu còn lại tiếng Anh. n54 là kiến thức ngôn ngữ chuẩn. n49, n50 'Khá vững' chấp nhận được (Moray, Wood & Cowan, Röer & Cowan)."
