  id: "n21"
  luot_2: "dung"
  nguon: &a17
    - "https://doi.org/10.1037/a0019842"
  trich: "Kiesel et al. 2010 (tổng quan): chuẩn bị tác vụ và 'proactive interference of tasks' là nguồn chi phí chuyển đổi."
  ghi_chu: "n38 là lời khuyên suy ra từ chi phí chuyển đổi và nút cổ chai xử lý song song."
- trang: "kham-pha/chu-y-tri-giac/da-nhiem-so"
  id: "n22"
  luot_2: "dung"
  nguon:
    - "https://cyberpsychology.eu/article/view/13303"
    - "https://doi.org/10.1073/pnas.1611612115"
    - "https://doi.org/10.3758/s13414-017-1408-4"
  trich: "Parry & le Roux 2021 (118 đánh giá): hiệu ứng gộp nhỏ, z = 0,138; Uncapher & Wagner 2018: cán cân bằng chứng nghiêng về kém hơn nhưng nhiều nghiên cứu không thấy khác biệt; Wiradhany & Nieuwenstein 2017: gộp 39 hiệu ứng, yếu và không còn có ý nghĩa sau hiệu chỉnh thiên lệch nghiên cứu nhỏ."
  ghi_chu: "Nhãn 'Khá vững' sát thước đo (chỗ hở: hiệu ứng nhỏ và gần như không đổi chiều khi hiệu chỉnh); không nên cao hơn."
- trang: "kham-pha/chu-y-tri-giac/da-nhiem-so"
  id: "n24"
  luot_2: "dung"
  nguon: &a19
    - "https://doi.org/10.1073/pnas.1611612115"
    - "https://doi.org/10.1371/journal.pone.0054402"
  trich: "Uncapher & Wagner 2018: chủ yếu tương quan, cần xác định chiều nhân quả; Sanbonmatsu 2013: đa nhiệm truyền thông tương quan âm với năng lực đa nhiệm thật và tương quan dương với tự đánh giá cao, bốc đồng, ham cảm giác mới."
  ghi_chu: "Nhãn 'Đang tranh cãi' đúng."
- trang: "kham-pha/chu-y-tri-giac/da-nhiem-so"
  id: "n27"
  luot_2: "qua-manh"
  nguon:
    - "https://doi.org/10.1037/a0031208"
    - "https://doi.org/10.3758/s13414-017-1408-4"
    - "https://doi.org/10.1371/journal.pone.0054402"
  trich: "Alzahabi & Becker 2013: người đa nhiệm truyền thông nặng 'better able to switch between tasks', khi làm hai việc cùng lúc thì ngang nhóm nhẹ; Sanbonmatsu 2013: tương quan âm với năng lực đa nhiệm thật."
  cau_dung: "Không có bằng chứng nhất quán rằng đa nhiệm nhiều làm ta giỏi đa nhiệm (nhiều nghiên cứu thấy kém hơn hoặc ngang nhau, một số thấy chuyển đổi tác vụ nhanh hơn); và làm hai việc khó cùng lúc thì chịu chi phí xử lý. Nhãn đúng hơn: Đang tranh cãi cho vế đầu."
  ghi_chu: "Vế sau (não không làm được hai việc khó cùng lúc) vững; vế đầu kết quả lẫn lộn nên 'Đã bị bác bỏ' vượt thước đo (kiểm tra mạnh liên tục thất bại)."
- trang: "kham-pha/chu-y-tri-giac/da-nhiem-so"
  id: "n34"
  luot_2: "dung"
  nguon: &a20
    - "https://doi.org/10.1016/j.actpsy.2022.103717"
  trich: "Ruiz Pardo & Minda (Acta Psychologica 2022), tái lập có đăng ký trước Ward 2017 thí nghiệm 2 (điện thoại trên bàn, trong túi/cặp, phòng khác; thêm bật/tắt nguồn): 'the brain drain effect did not replicate'. Tổng quan 2022 (56 nghiên cứu): chỉ trí nhớ làm việc có hiệu ứng nhỏ gộp."
  ghi_chu: "Thiết kế mô tả đúng; Ward 2017 gốc chưa mở nhưng thiết kế ba vị trí xác nhận qua bản tái lập. 'Đang tranh cãi' hợp lý."
- trang: "kham-pha/chu-y-tri-giac/da-nhiem-so"
  id: "n35"
  luot_2: "qua-manh"
  nguon:
    - "https://scholars.duke.edu/publication/1402953"
  trich: "Fitz et al. 2019 (Computers in Human Behavior 101, 84–94): thử nghiệm ngẫu nhiên 237 người; gom 3 lần mỗi ngày tốt nhất; gom mỗi giờ ít lợi ích."
  cau_dung: "Có bằng chứng sơ bộ: một thử nghiệm ngẫu nhiên hai tuần (n = 237) cho thấy gom thông báo ba lần mỗi ngày giúp thấy tập trung và chủ động hơn; chưa đủ cho nhãn Khá vững (gom theo giờ ít lợi, tắt hẳn lại tăng lo âu)."
  ghi_chu: "Chỉ đọc qua trang Duke Scholars và tóm tắt thứ cấp; chưa mở bài gốc. Nhãn Đang tranh cãi/sơ bộ hợp hơn."
- trang: "kham-pha/chu-y-tri-giac/da-nhiem-so"
  id: "n37"
  luot_2: "qua-manh"
  nguon:
    - "https://doi.org/10.1073/pnas.1611612115"
  cau_dung: "Tự theo dõi mức đa nhiệm của mình là gợi ý hợp lý, nhưng không có bằng chứng trực tiếp (ngoài việc người đa nhiệm nặng hay đánh giá quá cao khả năng của mình, Sanbonmatsu 2013) rằng việc này cải thiện tập trung; không nên gắn nhãn Khá vững."
  ghi_chu: "Không tìm được nghiên cứu kiểm chứng lời khuyên tự theo dõi trong một tuần."
- trang: "kham-pha/chu-y-tri-giac/da-nhiem-so"
