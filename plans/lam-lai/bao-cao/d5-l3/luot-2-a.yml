  trich: "Cường độ ảo giác Müller-Lyer không đổi khi mắt giảm thị lực nhẹ (4,33% so với 3,75%; bệnh nhân đục thủy tinh thể 8,79% so với 8,20%) nhưng tăng theo tuổi."
  ghi_chu: "Ảo giác không do mắt kém; khác nhau theo tuổi nên 'ai cũng như nhau' sai. Phần 'biết rồi vẫn thấy' là tính chất kinh điển (không thể hóa được bằng kiến thức), không mở nguồn riêng."
