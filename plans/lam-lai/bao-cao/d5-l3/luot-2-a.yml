  trich: "Kiesel et al. 2010 (tổng quan): chuẩn bị tác vụ và 'proactive interference of tasks' là nguồn chi phí chuyển đổi."
  ghi_chu: "n38 là lời khuyên suy ra từ chi phí chuyển đổi và nút cổ chai xử lý song song."
