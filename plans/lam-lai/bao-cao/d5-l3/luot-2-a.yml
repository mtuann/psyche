  luot_2: "dung"
  nguon: *a16
  trich: "Conway 2001: những người nghe tên mình có dung lượng trí nhớ làm việc thấp; Röer & Cowan 2021: 'Low-span participants were more likely than high-span participants to notice their names' (operation span và running span)."
  ghi_chu: "Con số 65% so với 20% (Conway 2001) không đọc được trong bản mở; hướng kết quả được xác nhận bởi hai nghiên cứu. n37 'Khá vững' hợp lý (hai nghiên cứu cùng chiều, nhưng Röer & Cowan lưu ý bảng hỏi nhạy kém với khác biệt trí nhớ làm việc)."
