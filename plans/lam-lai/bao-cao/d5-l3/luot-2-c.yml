- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n1
  luot_2: dung
  nguon:
  - https://doi.org/10.1073/pnas.0903620106
  - https://doi.org/10.1073/pnas.1611612115
  trich: the balance of evidence suggests that heavier media multitaskers exhibit poorer performance in a number of cognitive domains ... (although many studies find no performance differences between groups).
  ghi_chu: Ophir 2009 (tóm tắt, toàn văn bản PDF lưu trữ) và Uncapher & Wagner 2018 khớp; "chưa lặp lại" khớp Wiradhany & Nieuwenstein 2017 và Parry & le Roux 2021.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n2
  luot_2: dung
  nguon:
  - https://doi.org/10.3758/PBR.17.4.479
  - https://doi.org/10.1037/a0019842
  - https://kops.uni-konstanz.de/bitstreams/5a39a685-94f4-4ab0-b450-6bc0145db6c7/download
  trich: Whereas the vast majority of participants showed significant performance decrements in dual-task conditions ... 2.5% of the sample showed absolutely no performance decrements
  ghi_chu: 'Watson & Strayer: đa số giảm hiệu suất khi làm hai việc đòi hỏi chú ý (có ngoại lệ ~2,5%). Kiesel và cộng sự 2010: phí chuyển đổi là hiện tượng chuẩn của tâm lý học nhận thức. "Gần như" đã chừa chỗ cho ngoại lệ.'
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n3
  luot_2: dung
  nguon:
  - https://doi.org/10.1073/pnas.0903620106
  - https://doi.org/10.5817/cp2021-2-7
  trich: This led to the surprising result that heavy media multitaskers performed worse on a test of task-switching ability
  ghi_chu: 'Ophir: phí chuyển đổi của nhóm nặng lớn hơn 167 ms. Parry & le Roux (toàn văn): bằng chứng không ủng hộ ý cho rằng đa nhiệm giúp chuyển đổi tốt hơn và "not associated with attenuated abilities to manage tasks", tức không lặp lại kết quả chuyển đổi kém.'
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n5
  luot_2: dung
  nguon:
  - https://atelierdesfuturs.org/wp-content/uploads/2025/07/1971-simon.pdf
  trich: a wealth of information creates a poverty of attention and a need to allocate that attention efficiently
  ghi_chu: Toàn văn bài Simon (in trong Greenberger, Johns Hopkins Press, 1971), tr. 40-41, cùng đoạn "information consumes the attention of its recipients"; ý "chú ý là thứ khan hiếm" đúng.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n6
  luot_2: qua-manh
  nguon:
  - https://doi.org/10.1016/j.chb.2019.07.016
  - https://www.axios.com/2024/12/09/ad-revenue-growth-2024
  trich: Designed to distract, these interruptions capture and monetize our time and attention. (Fitz 2019, tóm tắt)
  ghi_chu: Mô hình kinh doanh quảng cáo là có thật; quảng cáo toàn cầu khoảng 0,93-1,04 nghìn tỷ USD năm 2024 (Magna, GroupM) nhưng đó là cả ngành quảng cáo, không riêng ngành chú ý. "Mỗi thông báo/video/gợi ý là cái móc được tính toán" và "tối ưu hóa để thắng mình" là khái quát mạnh, không có nguồn đo; thông báo cũng có chức năng chính đáng.
  cau_dung: Nhiều nền tảng miễn phí kiếm tiền từ quảng cáo dựa trên thời gian và sự chú ý của người dùng, và nhiều tính năng (thông báo, tự phát video, gợi ý) được thiết kế để giữ người dùng ở lại; ngành quảng cáo toàn cầu cỡ khoảng một nghìn tỷ đô la năm 2024.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n7
  luot_2: dung
  nguon:
  - https://doi.org/10.1073/pnas.0903620106
  trich: we developed a questionnaire-based media multitasking index ... selected those individuals who were heavy media multitaskers (HMMs were one standard deviation or more above the mean) or light media multitaskers (LMMs ... one standard deviation or more below the mean)
  ghi_chu: Bảng hỏi 262 sinh viên Stanford; chọn nhóm cách trung bình từ 1 độ lệch chuẩn trở lên ở hai phía.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n8
  luot_2: dung
  nguon:
  - https://web.archive.org/web/2009/http://news.stanford.edu/news/2009/august24/multitask-research-study-082409.html
  - https://doi.org/10.1073/pnas.0903620106
  trich: after putting about 100 students through a series of three tests
  ghi_chu: 'Thông cáo Stanford 24/8/2009 nói đúng như vậy. Bài gốc: 41 (Phần I) + 30 (II) + 32 (III) = 103 sinh viên; ba bộ thí nghiệm: lọc nhiễu và AX-CPT, 2-/3-back, chuyển đổi nhiệm vụ.'
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n9
  luot_2: dung
  nguon:
  - https://doi.org/10.1073/pnas.0903620106
  - https://web.archive.org/web/2009/http://news.stanford.edu/news/2009/august24/multitask-research-study-082409.html
  trich: heavy media multitaskers are more susceptible to interference from irrelevant environmental stimuli and from irrelevant representations in memory ... performed worse on a test of task-switching ability
  ghi_chu: 'Nhóm nặng kém ở cả ba bộ (lọc môi trường, nhiễu trí nhớ, chuyển đổi). Lưu ý nhỏ: ở AX-CPT chuẩn (không có nhiễu) hai nhóm không khác; khác biệt chỉ ở bản có nhiễu.'
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n10
  luot_2: dung
  nguon:
  - https://web.archive.org/web/2009/http://news.stanford.edu/news/2009/august24/multitask-research-study-082409.html
  trich: '"They''re suckers for irrelevancy," said communication Professor Clifford Nass ... "Everything distracts them."'
  ghi_chu: Lời Nass trong thông cáo Stanford.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n11
  luot_2: dung
  nguon:
  - https://doi.org/10.1073/pnas.0903620106
  trich: these results suggest that HMMs are less capable of filtering out the irrelevant task-set representation in memory on a given trial
  ghi_chu: 'Tóm tắt: "likely due to reduced ability to filter out interference from the irrelevant task set".'
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n12
  luot_2: dung
  nguon:
  - https://doi.org/10.1073/pnas.1611612115
  trich: Here we review the growing body of research that investigates the cognitive and neural profiles of individuals who differ in the extent to which they simultaneously engage with multiple media streams
  ghi_chu: Tổng quan đăng PNAS 2018.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n13
  luot_2: dung
  nguon:
  - https://doi.org/10.1073/pnas.1611612115
  trich: the balance of evidence suggests that heavier media multitaskers exhibit poorer performance in a number of cognitive domains ... it is often on tasks that require or are influenced by fluctuations in sustained goal-directed attention
  ghi_chu: Khớp tóm tắt.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n14
  luot_2: dung
  nguon:
  - https://doi.org/10.5817/cp2021-2-7
  trich: 118 assessments were included in the meta-analysis. Overall, the pooled effect size ... is small.
  ghi_chu: Khớp.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n15
  luot_2: dung
  nguon:
  - https://doi.org/10.1073/pnas.1611612115
  trich: further research is needed ... to determine the direction of causality
  ghi_chu: Tóm tắt nêu cần xác định chiều nhân quả; các nghiên cứu được tổng quan là so sánh nhóm/tương quan. Sanbonmatsu 2013 cũng gợi ý cả hai hướng.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n16
  luot_2: dung
  nguon:
  - https://doi.org/10.1086/691462
  trich: even when people are successful at maintaining sustained attention ... the mere presence of these devices reduces available cognitive capacity.
  ghi_chu: Câu trong trang là mô tả giả thuyết và kết quả "theo các tác giả"; khớp tóm tắt.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n18
  luot_2: dung
  nguon:
  - https://doi.org/10.1086/691462
  trich: these cognitive costs are highest for those highest in smartphone dependence.
  ghi_chu: Khớp tóm tắt (thí nghiệm 2).
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n20
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/tmb0000123
  trich: 166 effect sizes drawn from 53 samples and 33 studies including 4,368 participants ... no significant effect on cognitive outcomes (d = -0.02 ...) ... not moderated by demographics, trait smartphone dependency
  ghi_chu: Khớp.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n23
  luot_2: dung
  nguon:
  - https://doi.org/10.3758/s13414-017-1408-4
  trich: weak but significant association between media multitasking and distractibility that turned nonsignificant after correction for small-study effects
  ghi_chu: Phân tích tổng hợp 39 effect size chỉ về lọc nhiễu (distractibility), không phải mọi lĩnh vực nhận thức; câu của trang đặt trong ngữ cảnh bài kiểm tra chú ý, chấp nhận được.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n25
  luot_2: dung
  nguon:
  - https://doi.org/10.1371/journal.pone.0054402
  trich: Participants with a strong approach orientation ... high levels of impulsivity and sensation seeking--reported greater multi-tasking behavior.
  ghi_chu: Khớp; mẫu sinh viên Utah, dữ liệu tương quan.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n26
  luot_2: dung
  nguon:
  - https://doi.org/10.1073/pnas.1611612115
  - https://doi.org/10.1371/journal.pone.0054402
  trich: people often engage in multi-tasking because they are less able to block out distractions and focus on a singular task (Sanbonmatsu)
  ghi_chu: Câu đã tự giới hạn ("có thể", "chưa có bằng chứng quyết định"); khớp việc Uncapher & Wagner nêu chiều nhân quả còn chưa xác định.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n28
  luot_2: dung
  nguon:
  - https://doi.org/10.3758/PBR.17.4.479
  trich: the vast majority of participants showed significant performance decrements in dual-task conditions ... 2.5% of the sample showed absolutely no performance decrements
  ghi_chu: 200 người, mô phỏng lái xe + OSPAN qua điện thoại.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n30
  luot_2: dung
  nguon:
  - https://doi.org/10.1073/pnas.0903620106
  trich: heavy media multitaskers are more susceptible to interference from irrelevant environmental stimuli and from irrelevant representations in memory. This led to the surprising result ... likely due to reduced ability to filter out interference
  ghi_chu: Khớp tóm tắt.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n31
  luot_2: qua-manh
  nguon:
  - https://doi.org/10.1073/pnas.1611612115
  - https://doi.org/10.5817/cp2021-2-7
  trich: it is also marked by convergent and divergent findings ... further research is needed ... to determine the direction of causality (Uncapher & Wagner)
  ghi_chu: Mắt xích "thói quen kiểm tra liên tục -> suy yếu khả năng duy trì chú ý" là chiều nhân quả mà các tổng quan nói chưa xác định (dữ liệu tương quan, liên hệ nhỏ). Câu viết như vòng xoáy đã biết và "môi trường được thiết kế để ý chí thua" là khẳng định mạnh.
  cau_dung: 'Một giả thuyết (chưa chứng minh): nền tảng thiết kế để thu hút chú ý, thói quen kiểm tra điện thoại liên tục có thể làm khó duy trì chú ý hơn, và khó duy trì chú ý có thể khiến người ta dễ bị cuốn vào hơn; bằng chứng hiện có chủ yếu là tương quan, chưa xác định chiều nhân quả.'
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n36
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/xhp0000100
  - https://doi.org/10.1016/j.chb.2019.07.016
  trich: cellular phone notifications alone significantly disrupted performance on an attention-demanding task, even when participants did not directly interact with a mobile device; (Fitz) participants whose notifications were batched three-times-a-day felt more attentive, productive ... and in greater control of their phones ... did not receive notifications at all ... experienced higher levels of anxiety and "fear of missing out" (FoMO)
  ghi_chu: n = 237, thí nghiệm ngẫu nhiên ngoài đời. Tóm tắt Fitz có một câu lạ ("lower productivity") nhưng so với đối chứng nhóm gom thông báo báo cáo năng suất và tập trung hơn như trang nói.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n39
  luot_2: dung
  nguon:
  - https://doi.org/10.1086/691462
  - https://doi.org/10.1016/j.actpsy.2022.103717
  - https://doi.org/10.1037/tmb0000123
  trich: 'the "brain drain" effect did not replicate: there was no difference between smartphone location conditions (Ruiz Pardo & Minda)'
  ghi_chu: 'Giả thuyết gốc: điện thoại càng gần càng kém (bàn kém nhất, phòng khác tốt nhất). Lần làm lại có đăng ký trước và tổng hợp 33 nghiên cứu không thấy hiệu ứng; câu đã hạn chế đúng.'
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n40
  luot_2: dung
  nguon:
  - https://jst.vn/index.php/etsd/article/view/1057
  - https://doi.org/10.51316/jst.191.etsd.2026.36.3.15
  trich: assess the level of multitasking behaviour in the classroom among 257 students from various academic disciplines (Hanoi University of Science and Technology)
  ghi_chu: 'Khảo sát hành vi bằng thang MMT-R, không có bài kiểm tra nhận thức. Phần phủ định ("chưa tìm thấy") hợp lý: tìm tiếng Anh/Việt qua Semantic Scholar/tìm web không thấy nghiên cứu thực nghiệm trên người Việt; mang tính chưa tìm thấy, đúng cách diễn đạt của trang.'
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n41
  luot_2: dung
  nguon:
  - https://doi.org/10.3758/s13414-017-1408-4
  - https://doi.org/10.3758/PBR.17.4.479
  - https://doi.org/10.1086/691462
  - https://doi.org/10.1016/j.actpsy.2022.103717
  trich: 'Experiment 1: 154 undergraduate students from the Faculty of Psychology, Universitas Gadjah Mada, Indonesia ... Experiment 2: University of Groningen, The Netherlands'
  ghi_chu: 'Wiradhany: một mẫu Indonesia và một mẫu Hà Lan. Ophir (Stanford), Sanbonmatsu và Watson (Utah), Ruiz Pardo & Minda (Canada) khớp; "chủ yếu" là mô tả cẩn thận. Không kiểm mẫu Fitz và Stothart.'
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n42
  luot_2: qua-manh
  nguon:
  - https://datareportal.com/reports/tag/Vietnam
  trich: (DataReportal, qua tìm web) khoảng 79,8 triệu người dùng internet, ~76 triệu tài khoản mạng xã hội đầu 2025 (khoảng 75% dân số); Zalo ~78 triệu người dùng hàng tháng
  ghi_chu: Số liệu cho thấy mức dùng mạng xã hội cao, nhưng không mở được báo cáo gốc DataReportal, không có số liệu smartphone. Các câu "vừa học online vừa chat", "vừa chạy xe vừa xem điện thoại" là quan sát không nguồn; "với cường độ không kém nơi nào" là so sánh không có căn cứ.
  cau_dung: Việt Nam có tỉ lệ dùng mạng xã hội cao (khoảng ba phần tư dân số có tài khoản mạng xã hội đầu 2025; Zalo, Facebook, TikTok phổ biến); chưa có số liệu so sánh quốc tế nào cho thấy cường độ "không kém nơi nào".
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n43
  luot_2: dung
  nguon:
  - https://doi.org/10.1073/pnas.0903620106
  - https://www.learntechlib.org/p/202079/
  trich: (Kirschner & De Bruyckere 2017) learners do not multitask, they task-switch, which harms learning; a person is not information-skilled merely because they grew up in a digital world
  ghi_chu: Ngộ nhận "thế hệ số đa nhiệm giỏi" bị Kirschner & De Bruyckere bác; phần Ophir (sinh viên Stanford) đúng; "chúng tôi không tìm thấy" là diễn đạt hợp lý. Chỉ đọc tóm tắt Kirschner qua mô tả tìm kiếm.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n44
  luot_2: qua-manh
  nguon:
  - https://eprints.bournemouth.ac.uk/29995/
  - https://eric.ed.gov/?id=EJ944201
  trich: Intelligible speech and lyrical music caused the largest distraction (Vasilev, Kirkby & Angele 2018); background music appeared to disrupt reading (Kämpfe 2011)
  ghi_chu: Lời, podcast gây nhiễu nhiều nhất là đúng; nhưng "luôn tranh chú ý" quá tuyệt đối, và ý nhạc không lời, nhỏ, đều "che tiếng ồn" chưa có nguồn nào mở được xác nhận (chỉ đọc tóm tắt qua tìm kiếm); tổng hợp Kämpfe thấy hiệu ứng thay đổi theo loại tác vụ, đọc bị hại.
  cau_dung: Nhạc có lời và lời nói (podcast, video) thường gây nhiễu nhất khi học, nhất là khi đọc hiểu; nhạc không lời, nhỏ ít gây nhiễu hơn, nhưng bằng chứng nhạc nền giúp tập trung là không rõ ràng.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n45
  luot_2: dung
  nguon:
  - https://doi.org/10.1086/691462
  - https://doi.org/10.1016/j.actpsy.2022.103717
  - https://doi.org/10.1037/tmb0000123
  - https://doi.org/10.3390/bs13090751
  trich: there is little reason at present to think that complete isolation from smartphones in a work environment would improve productivity and performance (Hartanto)
  ghi_chu: Khớp ba nguồn; Böttger 2023 (gộp cả việc dùng) thấy tác động tiêu cực chung, phù hợp với việc gọi là "chưa ngã ngũ".
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n46
  luot_2: dung
  nguon:
  - https://doi.org/10.1073/pnas.0903620106
  - https://doi.org/10.1073/pnas.1611612115
  trich: media multitasking--a person's consumption of more than one item or stream of content at the same time (Ophir 2009)
  ghi_chu: Định nghĩa đúng; ví dụ nấu ăn + podcast ở ngoài phạm vi chỉ số đa nhiệm truyền thông (nấu ăn không phải truyền thông) là cách minh họa của trang, không phải kết quả thực nghiệm.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n49
  luot_2: dung
  nguon:
  - https://doi.org/10.1086/691462
  - https://doi.org/10.1016/j.actpsy.2022.103717
  - https://doi.org/10.1037/tmb0000123
  trich: the "brain drain" effect did not replicate ... (Ruiz Pardo & Minda); no significant effect on cognitive outcomes (Hartanto)
  ghi_chu: Khớp.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n50
  luot_2: dung
  nguon:
  - https://atelierdesfuturs.org/wp-content/uploads/2025/07/1971-simon.pdf
  trich: a wealth of information creates a poverty of attention
  ghi_chu: Khớp văn bản gốc.
- trang: kham-pha/chu-y-tri-giac/da-nhiem-so
  id: n52
  luot_2: dung
  nguon:
  - https://api.crossref.org/works/10.1037/xhp0000100
  - https://web.archive.org/web/2009/http://news.stanford.edu/news/2009/august24/multitask-research-study-082409.html
