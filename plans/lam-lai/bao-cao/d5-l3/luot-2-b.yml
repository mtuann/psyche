  - https://doi.org/10.1037/bul0000365
  trich: 'Roberts & DelVecchio 2000: plateau around .74 between ages 50 and 70. Bleidorn 2022 (Psychological Bulletin, 189 mẫu, N = 178.503 cho độ ổn định thứ hạng): ''the rank-order stability of personality traits increased significantly throughout early life before reaching a plateau in young adulthood ... we found little evidence for increasing rank-order stabilities after Age 25.'''
  ghi_chu: Hướng chung (ổn định thứ hạng tăng từ thơ ấu đến đầu tuổi trưởng thành) đứng vững và hai phân tích tổng hợp cùng chiều. Nhưng 'đạt đỉnh ~.74 ở tuổi 50-70' là số của Roberts & DelVecchio 2000; phân tích tổng hợp mới hơn không thấy ổn định tăng thêm sau 25 tuổi, nên chi tiết đỉnh muộn không đạt Vững chắc.
  cau_dung: 'Ổn định thứ hạng tăng từ thơ ấu đến đầu tuổi trưởng thành rồi đi ngang (Roberts & DelVecchio 2000: .31, .54, .64 rồi bình nguyên ~.74 ở tuổi 50-70 khi khoảng đo 6,7 năm; Bleidorn 2022 thấy ít bằng chứng tăng thêm sau tuổi 25). Nhãn Vững chắc cho hướng chung; số ~.74 ở 50-70 chỉ nên ghi là ước tính của Roberts & DelVecchio.'
