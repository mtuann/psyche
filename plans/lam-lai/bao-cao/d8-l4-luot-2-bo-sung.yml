- trang: them/nghien-cuu-moi
  id: z3
  luot_2: sai
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC11987655/", "https://doi.org/10.1016/j.ijchp.2025.100559"]
  trich: "Age, year 18–65 k=4 0.24 (0.00 to 0.48) p=0.099; >65 k=31 0.33 (0.14 to 0.51) p=0.004 ... k: number of effect sizes ... Table 4 Meta-regression: Age (18–65 years, >65 years) 36 ... p value 0.69"
  cau_dung: "Ở người trên 65 tuổi, hiệu quả có ý nghĩa thống kê (g = 0,33; khoảng tin cậy 95%: 0,14–0,51), còn ở nhóm 18–65 tuổi (chỉ 4 kích thước hiệu ứng, k là số kích thước hiệu ứng chứ không phải số thử nghiệm) thì chưa đạt ý nghĩa thống kê (g = 0,24; 0,00–0,48; p = 0,099); tác giả đọc đây là lợi ích lớn hơn ở người cao tuổi, nhưng hồi quy tổng hợp theo tuổi cho p = 0,69, không có ý nghĩa thống kê. Ở nhóm có bệnh, g = 0,28; các chương trình dài 13–26 tuần có hiệu quả có ý nghĩa thống kê (g = 0,21)."
  ghi_chu: "Mọi số khác khớp toàn văn (g 0,33 và KTC 0,14–0,51; g 0,28 nhóm bệnh lâm sàng; g 0,21 cho 13–26 tuần, KTC 0,05–0,37; p = 0,69 ở Bảng 4; tác giả viết 'indicating greater cognitive benefits from exercise in older adults'). Lỗi duy nhất: bảng 3 chú thích 'k: number of effect sizes', toàn bài gồm 41 kích thước hiệu ứng từ 35 RCT, nên '4 thử nghiệm' phải là '4 kích thước hiệu ứng'. Nhóm tuổi trong bảng và thân bài là '>65' ('aged over 65'); phần tóm tắt viết '≥65'. Đọc toàn văn qua Europe PMC XML của PMC11987655 (trang pmc.ncbi.nlm.nih.gov bị chặn bằng reCAPTCHA)."
- trang: them/nghien-cuu-moi
  id: z6
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC11987655/", "https://doi.org/10.1016/j.ijchp.2025.100559"]
  trich: "The overall findings indicate moderate effects of CT on global cognition. ... Concurrent training yield moderate improvements in cognitive health ... SMD = 0.32; 95% CI: 0.17–0.46, p < 0.001"
  ghi_chu: "g = 0,32 khớp. Tác giả gọi là 'moderate' (Thảo luận và Kết luận). Bài không dẫn Cohen (1988) và không nêu mốc nào; câu 'theo mốc Cohen' là cách đọc của site, đúng với quy ước chung (0,2 nhỏ, 0,5 vừa), mốc này tôi không mở lại ở nguồn gốc."
