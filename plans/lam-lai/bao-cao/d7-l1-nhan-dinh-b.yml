- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n2
  cau: "Hộp đầu trang: nếu đang gặp nguy hiểm ngay thì xem trang Hỗ trợ (số cấp
    cứu, đường dây đã kiểm chứng); bài không dùng để tự chẩn đoán, chỉ người có
    chuyên môn mới chẩn đoán được."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n4
  cau: Với sức khỏe tâm thần, nhiều người chờ đến khi không chịu nổi mới tìm người
    giúp; WHO ghi ngay ở các nước thu nhập cao, chỉ khoảng một phần ba người bị
    trầm cảm được điều trị.
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n6
  cau: Nếu điều gì đang diễn ra với mình, kéo dài nhiều tuần, ảnh hưởng cuộc sống
    thì tìm người có chuyên môn trò chuyện là hợp lý, dù có bị rối loạn nào hay
    không; không cần "đủ nặng".
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n7
  cau: Buồn, lo, căng thẳng là phần bình thường của cuộc sống và tự chúng không
    phải dấu hiệu của rối loạn.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n8
  cau: "Dấu hiệu nên cân nhắc tìm giúp đỡ: buồn bã, trống rỗng, lo âu hay căng
    thẳng kéo dài từ hai tuần trở lên không dịu; ảnh hưởng rõ đến học, làm, ngủ,
    ăn, các mối quan hệ."
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n9
  cau: "Dấu hiệu: dùng rượu, chất kích thích ngày càng nhiều để chịu đựng cảm xúc."
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n10
  cau: "Dấu hiệu: người thân nói bạn thay đổi nhiều, và bạn cũng thấy mình không
    còn là mình."
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n11
  cau: "Có ý nghĩ tự làm hại bản thân, hay nghĩ mọi người sẽ tốt hơn nếu không có
    mình: tìm giúp đỡ ngay, gọi cấp cứu hay đến khoa cấp cứu gần nhất; số khẩn
    cấp ở trang Hỗ trợ."
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n12
  cau: Danh sách dấu hiệu giúp quyết định có nên tìm người nói chuyện, không phải
    để tự chẩn đoán.
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n15
  cau: Bác sĩ chuyên khoa tâm thần là bác sĩ y khoa học chuyên khoa tâm thần; chẩn
    đoán, điều trị bằng thuốc và phương pháp khác, chỉ định nhập viện khi cần.
  loai: dinh-nghia
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n16
  cau: Trong ba vai trò, chỉ bác sĩ được kê đơn thuốc.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n17
  cau: "Theo Luật Khám bệnh, chữa bệnh 2023 (hiệu lực 01/01/2024), nhà tâm lý lâm
    sàng là chức danh phải có giấy phép hành nghề; công việc: đánh giá tâm lý,
    trị liệu tâm lý; không kê đơn thuốc."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n18
  cau: "Tham vấn viên được đào tạo rất khác nhau; Luật Khám bệnh, chữa bệnh 2023
    không đặt chuẩn đào tạo chung và đây không phải chức danh phải có giấy phép
    hành nghề theo luật này; công việc: lắng nghe, hỗ trợ, tư vấn."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n19
  cau: Các vai trò bổ sung cho nhau; có người được bác sĩ theo dõi thuốc đồng thời
    gặp nhà tâm lý để trị liệu.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n20
  cau: "Gợi ý khi chọn nơi hỗ trợ: hỏi đào tạo, giấy phép, chứng chỉ; chi phí,
    thời lượng; cách bảo mật; không hợp thì tìm người khác là bình thường."
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n21
  cau: "Buổi gặp đầu: người có chuyên môn hỏi lý do đến, từ khi nào, ảnh hưởng ra
    sao; hỏi bối cảnh: giấc ngủ, ăn uống, công việc, học tập, quan hệ, tiền sử
    sức khỏe bản thân và gia đình, rượu, chất kích thích, thuốc đang dùng."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n22
  cau: "Họ cũng có thể hỏi về ý nghĩ tự làm hại bản thân: đó là câu hỏi thường lệ
    để giữ an toàn."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n23
  cau: Bạn được nói theo nhịp của mình, có quyền nói "chuyện này tôi chưa muốn kể"
    và đặt câu hỏi; sau đánh giá, người có chuyên môn thường giải thích nhận
    định và đề xuất hướng đi; bạn có quyền hỏi, xin ý kiến thứ hai.
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n24
  cau: Luật Khám bệnh, chữa bệnh 2023 (Điều 10) ghi quyền của người bệnh được giữ
    bí mật thông tin trong hồ sơ bệnh án và thông tin đời tư đã cung cấp, trừ
    một số trường hợp luật định; ở nhiều nước, ngoại lệ thường gặp là khi bạn
    hay người khác có nguy cơ bị hại.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n25
  cau: Buổi đầu tiên không phải bài kiểm tra có thể trượt; không có câu trả lời
    đúng hay sai; mục đích là hiểu điều bạn đang trải qua.
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n26
  cau: Đi khám khi tâm trí gặp khó khăn bình thường như khi dạ dày đau; bạn không
    cần có chẩn đoán mới được gặp người có chuyên môn, nhiều người tìm đến vì
    một giai đoạn khó khăn.
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n27
  cau: Người có chuyên môn được đào tạo để lắng nghe không phán xét.
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n28
  cau: Lo bị ghi vào hồ sơ là lo lắng chính đáng; hãy hỏi thẳng nơi đến về bảo mật
    và hồ sơ bệnh án trước khi bắt đầu.
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n30
  cau: Với trầm cảm, được điều trị sớm hơn đi kèm kết quả điều trị tốt hơn.
  loai: nhan
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n31
  cau: "Tổng quan Ghio 2014: chỉ 3 nghiên cứu đủ số liệu để gộp, các nghiên cứu
    khác nhau nhiều, nghiên cứu quan sát nên chưa tách được hẳn nguyên nhân."
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n32
  cau: Liệu pháp tâm lý và thuốc (khi cần, theo chỉ định) giúp được nhiều người bị
    các rối loạn tâm thần phổ biến; không phải ai cũng đỡ với hướng đầu tiên,
    điều chỉnh cùng người có chuyên môn là bình thường.
  loai: nhan
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n33
  cau: Theo hồ sơ quốc gia trong WHO Mental Health Atlas 2020 (số liệu mới nhất
    của WHO chúng tôi tìm được, tính đến 11/2026), Việt Nam có khoảng 4 người
    làm chuyên môn sức khỏe tâm thần trên 100.000 dân.
  loai: thoi-su
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n34
  cau: Nhóm xây dựng một chương trình chăm sóc trầm cảm ở vùng nông thôn Việt Nam
    ghi nhận khó khăn như thiếu chuyên gia sức khỏe tâm thần, và nhiều người
    chưa xem trầm cảm là vấn đề sức khỏe có thể điều trị.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n35
  cau: Luật Khám bệnh, chữa bệnh 2023 chưa đặt chuẩn đào tạo chung cho tham vấn
    viên.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n36
  cau: 'Khung "Đang tranh cãi: hệ thống chăm sóc sức khỏe tâm thần ở Việt Nam đang
    ở đâu?"'
  loai: nhan
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n37
  cau: "Cần giúp đỡ ngay (gọi cấp cứu, đến khoa cấp cứu): ý nghĩ hay hành vi tự
    làm hại; cảm thấy có thể gây hại người khác; đang say, ngộ độc hay có hành
    vi nguy hiểm."
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n38
  cau: "Sớm, trong vài ngày tới: cảm xúc tiêu cực kéo dài từ hai tuần trở lên
    không dịu; ảnh hưởng rõ đến học, làm, ngủ, ăn, quan hệ; phải dùng rượu, chất
    kích thích để chịu đựng."
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n39
  cau: Chỉ thấy "không ổn" kéo dài cũng đủ lý do tìm người có chuyên môn trò
    chuyện; không cần chờ đến khi sụp đổ.
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n41
  cau: "Câu hỏi 1: nên tìm người có chuyên môn khi cảm xúc tiêu cực kéo dài nhiều
    tuần không dịu, ảnh hưởng rõ cuộc sống, hay phải dùng rượu, chất để chịu
    đựng; ngưỡng là thời gian kéo dài và mức ảnh hưởng; đây là gợi ý, không phải
    tự chẩn đoán."
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n42
  cau: "Câu hỏi 2: chỉ bác sĩ tâm thần (trong ba vai trò) kê đơn; nhà tâm lý lâm
    sàng đánh giá, trị liệu, phải có giấy phép theo Luật 2023; tham vấn viên đào
    tạo khác nhau, không thuộc chức danh phải có giấy phép theo luật này."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n43
  cau: 'Câu hỏi 3: điều KHÔNG đúng là "phải trả lời đúng mọi câu hỏi như bài kiểm
    tra"; bạn có quyền không kể chuyện chưa sẵn sàng, hỏi về bảo mật, xin ý kiến
    thứ hai.'
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n44
  cau: 'Câu hỏi 4: không cần "đủ nặng"; không cần có chẩn đoán mới gặp người có
    chuyên môn; với trầm cảm, điều trị sớm hơn đi kèm kết quả tốt hơn.'
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n45
  cau: 'Câu hỏi 5: ý nghĩ hay hành vi tự làm hại cần giúp đỡ ngay (gọi cấp cứu,
    đến khoa cấp cứu); tìm giúp đỡ lúc ấy là đúng, không phải "làm quá"; số khẩn
    cấp ở trang Hỗ trợ.'
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n4
  cau: "Điểm khác giữa trị liệu và lời an ủi nằm ở cấu trúc: nhà trị liệu làm việc
    với một mô hình về cách vấn đề được duy trì và dùng kỹ thuật có chủ đích để
    can thiệp vào vòng lặp; lời an ủi xoa dịu nhất thời."
  loai: dinh-nghia
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n5
  cau: 'Sự lắng nghe, quan tâm của bạn thân cũng không vô ích: chúng là một phần
    của "yếu tố chung".'
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n6
  cau: Trị liệu tâm lý là dịch vụ tâm lý do người được đào tạo chuyên môn thực
    hiện, chủ yếu qua trò chuyện và tương tác, để đánh giá và giúp thay đổi phản
    ứng cảm xúc, lối nghĩ, hành vi gây khổ sở.
  loai: dinh-nghia
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n8
  cau: Theo trường phái nhận thức – hành vi, nhiều đau khổ tâm lý được duy trì bởi
    các vòng lặp suy nghĩ – cảm xúc – né tránh; trị liệu nhắm vào việc chen vào
    vòng lặp bằng kỹ thuật có chủ đích.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n9
  cau: "Phần lớn liệu pháp thuộc một số nhóm lớn: nhận thức – hành vi, tâm động
    (từ truyền thống phân tâm học), nhân văn (đặt mối quan hệ và sự chấp nhận
    làm trung tâm), cùng các liệu pháp tích hợp."
  loai: dinh-nghia
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n10
  cau: CBT là trường phái được nghiên cứu nhiều nhất.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n11
  cau: Aaron T. Beck là người phát triển liệu pháp nhận thức.
  loai: lich-su
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n12
  cau: "Rush và cộng sự (1977): 41 người bệnh trầm cảm ngoại trú chia ngẫu nhiên
    vào trị liệu nhận thức (tối đa 20 buổi trong 12 tuần) hay imipramine (tối đa
    12 tuần)."
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n13
  cau: Cả hai nhóm đều giảm triệu chứng rõ; nhóm trị liệu nhận thức cải thiện
    nhiều hơn và ít người bỏ dở hơn.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n14
  cau: "Theo dõi sau một năm (Kovacs 1981): nhóm từng trị liệu nhận thức tự đánh
    giá triệu chứng thấp hơn; các khác biệt khác không có ý nghĩa thống kê."
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n15
  cau: "Đây là mẫu nhỏ; các thử nghiệm lớn hơn về sau cho thấy bức tranh khiêm tốn
    hơn: trong ngắn hạn, CBT và thuốc hiệu quả gần ngang nhau."
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n16
  cau: Hofmann và cộng sự (2012) tìm thấy 269 phân tích tổng hợp về CBT và xem xét
    mẫu đại diện 106 phân tích, bao phủ nhiều vấn đề (lo âu, trầm cảm, rối loạn
    ăn uống, mất ngủ, đau mạn tính…).
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n17
  cau: Bằng chứng mạnh nhất ủng hộ CBT cho rối loạn lo âu, rối loạn dạng cơ thể,
    bulimia, kiểm soát cơn giận và căng thẳng nói chung.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n18
  cau: Trong 11 tổng quan có so sánh tỉ lệ đáp ứng, CBT cao hơn nhóm so sánh ở 7,
    chỉ một tổng quan thấy CBT thấp hơn.
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n19
  cau: Các tác giả kết luận nền tảng bằng chứng của CBT rất mạnh, nhưng vẫn cần
    thêm thử nghiệm ngẫu nhiên, và chưa có phân tích tổng hợp nào riêng cho các
    nhóm như dân tộc thiểu số hay người thu nhập thấp.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n20
  cau: "Theo các tác giả, Cuijpers và cộng sự (2023) là phân tích tổng hợp lớn
    nhất từng có về một loại liệu pháp tâm lý cho một rối loạn: 409 thử nghiệm
    ngẫu nhiên, 52.702 người bệnh trầm cảm, so CBT với đối chứng (chăm sóc thông
    thường, danh sách chờ), liệu pháp khác, thuốc, điều trị kết hợp."
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n21
  cau: "CBT hơn nhóm đối chứng ở mức vừa đến lớn (g = 0,79); chỉ tính nghiên cứu
    ít nguy cơ sai lệch: g = 0,60; sau hiệu chỉnh sai lệch xuất bản: g = 0,47."
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n22
  cau: "42% người được CBT đáp ứng, so với 19% ở nhóm đối chứng (NNT = 4,7: cứ
    khoảng 5 người được điều trị thì có thêm 1 người đáp ứng)."
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n23
  cau: Hiệu quả vẫn còn ở lần theo dõi 6–12 tháng sau.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n24
  cau: CBT chỉ hơn liệu pháp tâm lý khác một chút (g = 0,06, mất ý nghĩa trong
    phần lớn phân tích độ nhạy); ngang thuốc ngắn hạn nhưng hơn thuốc ở 6–12
    tháng (g = 0,34, ít thử nghiệm, không vững trong mọi phân tích độ nhạy); kết
    hợp hơn thuốc đơn độc nhưng không hơn CBT đơn độc.
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n25
  cau: "Powers và cộng sự (2008): phân tích tổng hợp 32 thử nghiệm (1.479 người)
    về liệu pháp tâm lý cho lo âu xã hội, so với danh sách chờ, giả dược tâm lý
    và giả dược thuốc."
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n26
  cau: Giả dược tâm lý là một hoạt động có gặp gỡ, trò chuyện nhưng không có thành
    phần được cho là có tác dụng của liệu pháp; giả dược thuốc là viên không có
    hoạt chất.
  loai: dinh-nghia
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n27
  cau: Trị liệu thật hơn danh sách chờ ở mức lớn (d = 0,86), hơn giả dược tâm lý
    (d = 0,34) và giả dược thuốc (d = 0,36), khoảng cách nhỏ hơn nhiều so với
    danh sách chờ; hiệu quả còn ở lần theo dõi sau (d = 0,76).
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n28
  cau: "Thông điệp hai mặt: trong các thử nghiệm này trị liệu thật hơn giả dược,
    nhưng một phần đáng kể hiệu quả có vẻ đến từ những gì giả dược cũng có (quan
    tâm, kỳ vọng, người đồng hành)."
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n29
  cau: "Trị liệu tâm lý hiệu quả hơn không điều trị: rất nhiều thử nghiệm và phân
    tích tổng hợp cho thấy giảm triệu chứng rõ hơn danh sách chờ hay chăm sóc
    thông thường; với trầm cảm g = 0,79, vẫn có ý nghĩa sau hiệu chỉnh sai
    lệch."
  loai: nhan
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n30
  cau: "CBT hiệu quả với trầm cảm và lo âu ở mức vừa, nhưng khiêm tốn hơn con số
    thô: g = 0,79 còn 0,47 sau hiệu chỉnh; 42% so với 19%, hơn một nửa cần thêm
    hay đổi hướng."
  loai: nhan
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n31
  cau: Johnsen và Friborg (2015) cho rằng hiệu quả của CBT với trầm cảm giảm dần
    theo năm công bố; phân tích làm lại năm 2017 (Cristea và cộng sự) và
    Cuijpers 2023 không thấy xu hướng này.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n32
  cau: Các liệu pháp chính quy khác nhau rất ít về hiệu quả (CBT hơn liệu pháp
    khác chỉ g = 0,06).
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n33
  cau: Phe yếu tố chung cho rằng phần lớn tác dụng đến từ những gì mọi liệu pháp
    đều có (liên minh trị liệu, đồng cảm, kỳ vọng); một phân tích tổng hợp thấy
    trị liệu thật không hơn rõ giả dược tâm lý được thiết kế tương đương về số
    buổi, thời lượng, người thực hiện (Baskin 2003).
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n34
  cau: Phe kỹ thuật đặc thù chỉ ra rằng trong nhiều thử nghiệm trị liệu thật vẫn
    hơn giả dược tâm lý (d = 0,34 với lo âu xã hội), và với một số rối loạn lo
    âu, kỹ thuật như tiếp xúc có vai trò rõ.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n35
  cau: "Bao nhiêu phần hiệu quả là nhờ kỹ thuật riêng, bao nhiêu nhờ yếu tố chung:
    đang tranh cãi."
  loai: nhan
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n36
  cau: 'Tên "phán quyết chim Dodo" bắt nguồn từ bài của Rosenzweig năm 1936, mượn
    lời con chim Dodo: "Ai cũng thắng, và ai cũng phải có giải".'
  loai: lich-su
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n37
  cau: Tranh luận yếu tố chung và kỹ thuật đặc thù vẫn chưa ngã ngũ.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n38
  cau: "Bộ ba nhận thức của Beck: niềm tin tiêu cực về bản thân, thế giới, tương
    lai, gắn với trầm cảm."
  loai: dinh-nghia
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n39
  cau: Suy nghĩ tự động là những ý nghĩ thoáng qua, thành thói quen, mà ta tin
    ngay không kiểm chứng.
  loai: dinh-nghia
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n40
  cau: "Trị liệu gồm hai mũi: tái cấu trúc nhận thức (nhận ra và kiểm tra suy nghĩ
    như giả thuyết, đối chiếu bằng chứng) và can thiệp hành vi (đối mặt dần với
    điều né tránh, quay lại hoạt động có ý nghĩa)."
  loai: dinh-nghia
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n41
  cau: "Sách nền tảng: Beck, Rush, Shaw và Emery (1979), Cognitive therapy of
    depression."
  loai: lich-su
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n42
  cau: "Mô hình bối cảnh của Wampold (một người ủng hộ yếu tố chung): ba con đường
    là mối quan hệ thật, kỳ vọng (từ lời giải thích hợp lý về vấn đề và cách
    điều trị), và các hành động có lợi cho sức khỏe mà liệu pháp khuyến khích."
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n43
  cau: "Theo tổng quan của Wampold: tương quan giữa liên minh trị liệu và kết quả
    khoảng r = 0,27; khác biệt giữa các nhà trị liệu (d ≈ 0,35) lớn hơn khác
    biệt thường gặp giữa các liệu pháp (tối đa khoảng d = 0,20)."
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n44
  cau: Điều này có thể giải thích vì sao các trường phái cho kết quả gần như nhau;
    bằng chứng về liên minh trị liệu chủ yếu là tương quan, chưa chứng minh nhân
    quả.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n45
  cau: Liệu pháp tâm động bắt nguồn từ truyền thống phân tâm học, chú trọng động
    lực và cảm xúc ít được ý thức, giúp hiểu khuôn mẫu lặp lại trong các mối
    quan hệ; nhiều dạng hiện đại là trị liệu ngắn hạn.
  loai: dinh-nghia
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n46
  cau: "Shedler (2010), trong một bài tổng quan có ảnh hưởng, dẫn tổng quan
    Cochrane của Abbass và cộng sự (2006) về trị liệu tâm động ngắn hạn (dưới 40
    giờ) cho rối loạn tâm thần phổ biến: mức cải thiện triệu chứng so với đối
    chứng 0,97, tăng lên 1,51 khi đánh giá lâu dài (hơn 9 tháng sau trị liệu)."
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n47
  cau: Shedler cho rằng hiệu quả của liệu pháp tâm động tương đương các liệu pháp
    "có bằng chứng" khác; cách ông diễn giải bị một số nhà nghiên cứu phản biện.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n48
  cau: Phân tích tổng hợp năm 2015 về trầm cảm (54 nghiên cứu) thấy trị liệu tâm
    động ngắn hạn hiệu quả hơn nhóm đối chứng và không khác các liệu pháp tâm lý
    khác.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n49
  cau: "Liệu pháp lấy thân chủ làm trung tâm do Carl Rogers phát triển từ đầu thập
    niên 1940: nhà trị liệu không chỉ đạo mà tạo điều kiện bằng thấu hiểu đồng
    cảm, chấp nhận, tôn trọng để thân chủ tự khám phá, thay đổi."
  loai: dinh-nghia
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n50
  cau: "Elliott và cộng sự (2021): phân tích tổng hợp 91 nghiên cứu (2009–2018) về
    liệu pháp nhân văn – trải nghiệm: trước–sau d = 0,86; hơn nhóm không trị
    liệu 0,88; tương đương các liệu pháp khác −0,08; CBT có lợi thế nhỏ chưa rõ
    ràng (−0,26), nhưng nghiên cứu phần lớn do nhóm CBT thực hiện; với trầm cảm,
    lo âu kết quả lẫn lộn hơn."
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n51
  cau: Trong thử nghiệm thuốc, giả dược là viên không hoạt chất mà người bệnh có
    thể không biết; trong trị liệu, khó có "trị liệu giả" mà thân chủ không nhận
    ra, và giả dược tâm lý cũng chứa yếu tố chung có thể có tác dụng thật.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n52
  cau: "Áp dụng 1: liên minh trị liệu là một trong những yếu tố dự báo kết quả
    được nghiên cứu nhiều nhất; sau vài buổi đầu, tự hỏi có được lắng nghe không
    phán xét, có cách hiểu mạch lạc và kế hoạch rõ ràng không; bằng cấp, giấy
    phép vẫn quan trọng; không hợp thì tìm người khác là bình thường. (Chip Khá
    vững.)"
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n53
  cau: "Áp dụng 2: 42% đáp ứng so với 19%; trị liệu đáng thử, nhưng không đỡ sau
    một liệu trình không phải lỗi của bạn; bàn với nhà trị liệu về đổi phương
    pháp, đổi người, hay gặp bác sĩ tâm thần đánh giá thêm. (Chip Vững chắc.)"
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n54
  cau: "Áp dụng 3: CBT tự giúp không có người hướng dẫn vẫn hiệu quả nhỏ đến vừa
    với trầm cảm (g = 0,45); một phân tích dữ liệu từng người bệnh (39 thử
    nghiệm) thấy CBT qua mạng có hướng dẫn hiệu quả hơn loại không hướng dẫn
    ngay sau điều trị, nhất là với trầm cảm vừa đến nặng; nên dùng nội dung dựa
    trên phương pháp đã kiểm chứng. (Chip Khá vững.)"
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n55
  cau: 'Áp dụng 4: nên gặp người có chuyên môn khi buồn, lo, căng thẳng kéo dài
    nhiều tuần không dịu, ảnh hưởng rõ đến học, làm, ngủ, quan hệ, hay phải dùng
    rượu bia, chất kích thích; có ý nghĩ về cái chết hay tự làm hại thì tìm giúp
    đỡ ngay; không cần "đủ nặng"; link bài Tìm giúp đỡ.'
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n56
  cau: Phần lớn con số ở trên đến từ thử nghiệm ở các nước phương Tây.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n57
  cau: Ở Việt Nam đã có một số thử nghiệm ngẫu nhiên về can thiệp tâm lý dựa trên
    CBT, dù còn ít.
  loai: thoi-su
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n58
  cau: "Murphy và cộng sự (2020): 32 xã, 8 tỉnh, 376 người lớn có triệu chứng trầm
    cảm (không gồm người nặng); chương trình tự quản lý có hỗ trợ (sổ tay kèm
    người hướng dẫn, hai tháng) giảm tỉ lệ còn triệu chứng so với nhóm chăm sóc
    thông thường chờ nhận chương trình sau: 26,4% so với 42,3% sau hai tháng."
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n59
  cau: "Imamura và cộng sự (2021): 951 điều dưỡng ở Hà Nội; chương trình CBT qua
    điện thoại thông minh giảm triệu chứng trầm cảm ở mức nhỏ sau 3 tháng, không
    còn khác biệt sau 7 tháng."
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n60
  cau: Theo WHO Mental Health Atlas 2020 (số liệu năm 2019, mới nhất chúng tôi tìm
    được tính đến 11/2026), Việt Nam có khoảng 1 bác sĩ tâm thần trên 100.000
    dân, so với khoảng 14 ở Anh.
  loai: thoi-su
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n61
  cau: Nhóm xây dựng một chương trình chăm sóc trầm cảm ở vùng nông thôn Việt Nam
    ghi nhận nhiều người chưa xem trầm cảm là vấn đề sức khỏe có thể điều trị
    bằng chuyên môn, và chưa quen với cách nhìn tâm lý mà trị liệu dựa vào (Ngo
    2014).
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n62
  cau: 'Câu cũ: "Thứ ba, kênh hỗ trợ đầu tiên của người Việt thường là gia đình —
    vừa là điểm tựa, vừa là rủi ro…"'
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n63
  cau: Các cơ chế tâm lý "nhiều khả năng là phổ quát" (câu cũ).
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n64
  cau: Một phân tích tổng hợp mà Wampold (2015) dẫn thấy liệu pháp được điều chỉnh
    theo văn hóa (dùng lời giải thích hợp với niềm tin của nhóm người bệnh) hiệu
    quả hơn bản không điều chỉnh, mức chênh nhỏ (d = 0,32).
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n65
  cau: Ở nơi thiếu chuyên gia, tự giúp có hướng dẫn, trị liệu qua mạng, hay người
    không chuyên được đào tạo và giám sát — những hình thức WHO cũng khuyến
    khích — là hướng đáng chú ý.
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n66
  cau: 'Ngộ nhận 1: "trị liệu chỉ là nói chuyện cho nhẹ lòng" chỉ đúng một phần:
    lắng nghe, kỳ vọng có thể có tác dụng; nhưng trị liệu có cấu trúc, do người
    được đào tạo, và trong nhiều thử nghiệm hiệu quả hơn hẳn không điều trị, hơn
    giả dược "chỉ lắng nghe" (d = 0,34 với lo âu xã hội), hiệu quả còn sau khi
    kết thúc.'
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n67
  cau: 'Ngộ nhận 2: "CBT tốt nhất, trường phái khác vô dụng" sai; khi so trực
    tiếp, CBT chỉ hơn 0,06; tâm động và nhân văn cũng có bằng chứng hiệu quả, dù
    ít nghiên cứu hơn.'
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n68
  cau: 'Ngộ nhận 3: đi trị liệu không có nghĩa là "có vấn đề nặng"; không cần chẩn
    đoán mới được gặp người có chuyên môn; nhiều người đi trị liệu vì khó khăn
    phổ biến (lo âu, buồn chán, căng thẳng công việc, rắc rối quan hệ); quan
    niệm này có thể khiến người ta trì hoãn.'
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n69
  cau: "Ngộ nhận 4: hết liệu trình không có nghĩa khỏi hẳn; 42% đáp ứng nghĩa là
    phần lớn còn lại cần thêm phương án; người đã đỡ cũng có thể tái phát; CBT
    dạy kỹ năng tự xử lý một phần để phòng tái phát, và có bằng chứng (từ ít thử
    nghiệm) rằng hiệu quả của nó ở 6–12 tháng tốt hơn thuốc."
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n71
  cau: "Câu hỏi 1: ý cốt lõi của liệu pháp nhận thức là suy nghĩ tự động, lệch lạc
    (cách nhìn tiêu cực về bản thân, thế giới, tương lai) góp phần duy trì cảm
    xúc, hành vi tiêu cực; trị liệu giúp nhận ra, kiểm chứng, điều chỉnh, kèm
    thay đổi hành vi."
  loai: dinh-nghia
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n72
  cau: "Câu hỏi 2: Cuijpers 2023: g = 0,79, còn 0,47 sau hiệu chỉnh; 42% so với
    19%; CBT chỉ hơn liệu pháp khác 0,06; NNT 4,7."
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n73
  cau: "Câu hỏi 3: Powers 2008 (d = 0,34 so với 0,86): một phần đáng kể hiệu quả
    có vẻ đến từ những gì giả dược cũng có; phần chênh còn lại gợi ý kỹ thuật
    riêng góp thêm, nhưng tỉ lệ vẫn đang tranh cãi."
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n74
  cau: "Câu hỏi 4: tâm động và nhân văn cũng có bằng chứng; khi so trực tiếp các
    liệu pháp chính quy khác nhau không nhiều; nên tìm người có chuyên môn, bàn
    phương pháp phù hợp, xây dựng sự tin tưởng."
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n76
  cau: 'Khung cũ "Đã bị bác bỏ: trị liệu tâm lý chỉ là hiệu ứng giả dược / nói
    chuyện an ủi".'
  loai: nhan
