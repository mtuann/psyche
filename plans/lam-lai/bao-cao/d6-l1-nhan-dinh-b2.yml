- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n33
  cau: "Khung Khá vững: 9 đặc điểm của flow được dùng để mô tả flow ở nhiều lĩnh vực, nhưng không đều giữa các đặc điểm."
  loai: nhan
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n38
  cau: "Khung Khá vững: flow xuất hiện khi thử thách và kỹ năng cùng cao và cân bằng."
  loai: nhan
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n42
  cau: "Khung Đang tranh cãi: flow có phải trải nghiệm phổ quát, giống nhau ở mọi nền văn hóa?"
  loai: nhan
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n46
  cau: "Khung Khá vững: flow đi cùng thành tích tốt hơn, nhưng chưa rõ nhân quả."
  loai: nhan
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n56
  cau: "Áp dụng 1 (nhãn Khá vững): học tập: chia nhỏ mục tiêu, tạo phản hồi tức thì."
  loai: nhan
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n60
  cau: "Áp dụng 2 (nhãn Đang tranh cãi): công việc: bảo vệ khung giờ sâu, điều chỉnh độ khó."
  loai: nhan
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n63
  cau: 'Áp dụng 3 (nhãn Đang tranh cãi): thể thao và sở thích: tìm "điểm ngọt" của độ khó.'
  loai: nhan
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n66
  cau: 'Áp dụng 4 (nhãn Đang tranh cãi): chưa có cách chắc chắn để "gọi" flow; các điều kiện đủ chưa biết; bằng chứng cho người thực hành rất hạn chế.'
  loai: nhan
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n1
  cau: Csikszentmihalyi gọi trạng thái hòa nhập hoàn toàn với việc đang làm là flow (trạng thái dòng chảy).
  loai: lich-su
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n2
  cau: Flow là một cấu hình ý thức với những đặc điểm được mô tả và đo lường trong nhiều nghiên cứu, dù cách đo chưa thống nhất.
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n3
  cau: Từ giữa những năm 1970 Csikszentmihalyi hỏi hàng trăm người leo núi, kỳ thủ cờ vua, nghệ sĩ... mô tả những khoảnh khắc tốt nhất; từ đó có khái niệm flow.
  loai: lich-su
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n4
  cau: "Csikszentmihalyi (1975): khái niệm flow xuất hiện lần đầu trong Beyond Boredom and Anxiety (1975)."
  loai: lich-su
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n5
  cau: Các nhà nghiên cứu về sau nhận xét mô tả flow khá nhất quán giữa các hoạt động, dù có phê bình.
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n7
  cau: "Đặc điểm 1: Cân bằng giữa thử thách và kỹ năng."
  loai: dinh-nghia
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n8
  cau: "Đặc điểm 2: Mục tiêu rõ ràng."
  loai: dinh-nghia
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n9
  cau: "Đặc điểm 3: Phản hồi tức thì, rõ ràng."
  loai: dinh-nghia
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n10
  cau: "Đặc điểm 4: Hòa nhập giữa hành động và nhận thức."
  loai: dinh-nghia
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n11
  cau: "Đặc điểm 5: Tập trung sâu."
  loai: dinh-nghia
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n12
  cau: "Đặc điểm 6: Cảm giác kiểm soát."
  loai: dinh-nghia
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n13
  cau: "Đặc điểm 7: Mất tự ý thức."
  loai: dinh-nghia
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n14
  cau: "Đặc điểm 8: Biến dạng cảm nhận thời gian."
  loai: dinh-nghia
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n15
  cau: "Đặc điểm 9: Trải nghiệm tự thân (autotelic)."
  loai: dinh-nghia
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n16
  cau: Ba đặc điểm đầu thường được xem là điều kiện để flow xuất hiện; sáu đặc điểm còn lại mô tả trải nghiệm flow; autotelic có khi được coi là mô tả chung của flow.
  loai: dinh-nghia
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n17
  cau: "Mô hình kênh flow (góc phần tư): thử thách vượt xa kỹ năng gây lo âu, kỹ năng vượt xa thử thách gây chán, cả hai thấp gây thờ ơ; flow được dự đoán khi cả hai cao (cao hơn mức trung bình của chính người đó)."
  loai: dinh-nghia
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n18
  cau: 'Hình flow-channel (không có số): sơ đồ ước lệ ghi nhãn "Lo âu", "Chán nản", "Thờ ơ", "Dòng chảy (flow)" trên hai trục kỹ năng và thách thức.'
  loai: cong-cu
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n19
  cau: 'Hình flow-channel: dòng chữ "Flow chỉ xuất hiện khi cả hai đều cao và cân bằng" và chú thích "chỉ xuất hiện khi...".'
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n20
  cau: "Csikszentmihalyi, Larson & Prescott (1977): 25 thiếu niên, 753 báo cáo, trong một tuần thường, theo tín hiệu ngẫu nhiên từ máy nhắn tin."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n21
  cau: Nghiên cứu 1977 là một trong những nghiên cứu đầu tiên dùng phương pháp lấy mẫu trải nghiệm (ESM).
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n22
  cau: ESM đo cảm xúc và hoạt động của con người ngay trong dòng đời sống thay vì hỏi lại sau.
  loai: dinh-nghia
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n23
  cau: ESM được dùng trong nhiều nghiên cứu về flow.
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n24
  cau: "Csikszentmihalyi & LeFevre (1989): 78 người lao động trưởng thành, một tuần, ESM; câu hỏi: chất lượng trải nghiệm chịu ảnh hưởng nhiều hơn bởi bối cảnh làm/chơi hay bởi trạng thái flow (thử thách và kỹ năng đều cao)."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n25
  cau: Hầu hết các chỉ số chất lượng trải nghiệm (trừ thư giãn và động lực) chịu ảnh hưởng của flow mạnh hơn bối cảnh làm việc/giải trí.
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n26
  cau: Phần lớn trải nghiệm flow được báo cáo khi đang làm việc, không phải lúc giải trí.
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n28
  cau: Người ta vẫn có động lực hơn khi rảnh rỗi so với khi làm việc ("nghịch lý của công việc").
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n30
  cau: Phân tích nhân tố khẳng định ủng hộ chín thang và mô hình có thứ bậc với một nhân tố flow chung.
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n32
  cau: Đã có nghiên cứu kiểm tra FSS-2 và DFS-2 ở người trưởng thành Nhật Bản (Kawabata, Mallett & Jackson 2008); kết quả không đọc được.
  loai: lich-su
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n34
  cau: "Swann và cộng sự (2012; theo Swann 2018): trong tổng quan hệ thống về flow ở thể thao ưu tú, dưới 30% vận động viên nêu mất tự ý thức và biến dạng thời gian."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n35
  cau: "Swann và cộng sự (2018): các đặc điểm chồng lấn nhau và khung chín chiều thiếu cảm giác cơ thể."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n36
  cau: "Abuhamdeh (2020): chưa có cách đo flow được thống nhất."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n37
  cau: "Jackson (1996, theo Swann 2018): phỏng vấn vận động viên ưu tú để so mô tả flow của họ với mô tả lý thuyết của Csikszentmihalyi."
  loai: lich-su
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n39
  cau: "Fong và cộng sự (2015): phân tích tổng hợp 28 nghiên cứu, liên hệ vừa phải giữa cân bằng thử thách–kỹ năng và flow; yếu hơn ở văn hóa cá nhân chủ nghĩa, bối cảnh công việc/giáo dục, ESM và flow trạng thái tự báo cáo."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n40
  cau: "Løvoll & Vittersø (2014): hai nghiên cứu (64 và 26 sinh viên, chuyến đi ngoài trời), không chỉ báo flow nào đạt đỉnh khi thử thách cân bằng kỹ năng; ủng hộ mô hình mất cân bằng."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n43
  cau: "Xie và cộng sự (2026): phân tích tổng hợp 108 nghiên cứu (42.952 người) về flow trong học tập; bối cảnh văn hóa và cách đo không làm đổi đáng kể độ lớn các liên hệ."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n44
  cau: "Buseyne và cộng sự (2026): phân tích tổng hợp 24 nghiên cứu về tính cách–flow; tận tâm r = 0,33; văn hóa điều chỉnh một số liên hệ."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n45
  cau: "Giả thuyết: mất tự ý thức có thể được trải nghiệm khác giữa văn hóa cá nhân và văn hóa tập thể; chưa được kiểm chứng."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n47
  cau: "Harris và cộng sự: phân tích tổng hợp 22 nghiên cứu (20 bài) về flow và thành tích: r = 0,31 (KTC 95%: 0,24–0,38), trong thể thao và trò chơi; các cơ chế đề xuất chưa có bằng chứng thuyết phục."
  loai: so-lieu
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n48
  cau: Flow là trải nghiệm chủ quan dễ chịu, không phải công tắc bật/tắt của thành tích.
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n49
  cau: "Lý thuyết 1: mô hình kênh flow là điều kiện xuất hiện; quá khó thì lo âu, quá dễ thì chán; điều kiện đủ vẫn chưa biết."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n50
  cau: "Lý thuyết 2: Csikszentmihalyi đề xuất nhân cách tự trị: xu hướng chủ động tìm thử thách và trải nghiệm flow."
  loai: lich-su
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n51
  cau: 'Lý thuyết 2: Nakamura & Csikszentmihalyi (2002) mô tả các nét cốt lõi là tò mò và hứng thú với đời sống, kiên trì, ít vị kỷ, gọi là "siêu kỹ năng".'
  loai: lich-su
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n54
  cau: "Lý thuyết 3: một cách giải thích về chú ý (chưa kiểm chứng); khung 9 đặc điểm mô tả chứ không giải thích; giải thích thần kinh như hạ hoạt vùng trán thoáng qua (Dietrich 2004) là nguyên nhân gần."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n55
  cau: "Áp dụng (mở đầu): flow không gọi ra được theo ý muốn; bằng chứng về cách tạo flow rất hạn chế."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n58
  cau: "Xie 2026: flow khi học liên hệ dương với nhiệm vụ học phù hợp, môi trường hỗ trợ, thành tích học tập; phần lớn nghiên cứu là tương quan."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n61
  cau: "Swann 2018: Harris, Vine & Wilson (2017) đặt mục tiêu khó dần để gây flow; Schweickle và cộng sự (2017) thấy mục tiêu khó dần có hại cho flow và gây trạng thái nỗ lực hơn."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n62
  cau: Tập trung sâu là một đặc điểm của flow; chưa tìm thấy thử nghiệm kiểm tra việc tắt thông báo làm tăng flow.
  loai: thoi-su
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n65
  cau: Hoạt động giải trí có độ khó vừa tầm và phản hồi rõ có thể thử; chưa có nghiên cứu so sánh với lướt video ngắn.
  loai: thoi-su
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n67
  cau: "Việt Nam: Nguyen và cộng sự (2026) khảo sát 239 sinh viên đại học học tiếng Anh trực tuyến và phỏng vấn 12 người; flow nói chung cao (trung bình 3,77)."
  loai: thoi-su
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n68
  cau: "Việt Nam: ba chiều nổi bật nhất là phản hồi tức thì, cân bằng thử thách–kỹ năng, mất tự ý thức; thấp nhất là tập trung cao độ; cản trở gồm khó giữ tập trung, kỳ vọng tự học, chuẩn mực văn hóa."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n70
  cau: 'Việt Nam: lời khuyên "áp dụng flow" cho người Việt hầu như dựa trên dữ liệu từ các nước khác, chủ yếu phương Tây và một số nước châu Á như Nhật.'
  loai: thoi-su
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n71
  cau: "Việt Nam: khái niệm mất tự ý thức ra đời ở văn hóa cá nhân chủ nghĩa; ở văn hóa Việt Nam có thể mang sắc thái khác (suy đoán); trong nghiên cứu Việt Nam mất tự ý thức nằm trong ba chiều nổi bật nhất."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n72
  cau: 'Việt Nam: "nghịch lý của công việc" (flow ở công sở nhiều, động lực cao khi rảnh) có thể không giống nhau ở nền kinh tế có ranh giới công việc–cuộc sống khác; suy đoán.'
  loai: loi-khuyen
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n73
  cau: "Việt Nam: bản đồ dữ liệu Việt Nam còn rất thưa (tính đến 11/2026)."
  loai: thoi-su
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n74
  cau: "Ngộ nhận 1: flow không phải lúc làm gì cũng nhẹ nhàng; theo mô hình flow đòi hỏi thử thách cao ngang kỹ năng; việc quá dễ chỉ tạo chán nản."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n76
  cau: "Ngộ nhận 2: chưa tìm thấy nghiên cứu về giới hạn của việc ở trong flow liên tục hay flow trong hoạt động có hại (tính đến 11/2026)."
  loai: thoi-su
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n77
  cau: 'Ngộ nhận 3: các nét của nhân cách tự trị được mô tả như "siêu kỹ năng"; liên hệ với tần suất flow hiếm được kiểm tra; tận tâm liên hệ vừa phải (r = 0,33); chưa nói được rèn luyện hay bẩm sinh.'
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n78
  cau: 'Ngộ nhận 1 (dạng lưu ý): flow có tính "thích" nhưng khác "thích": là cấu hình ý thức; ví dụ nằm lướt điện thoại không phải flow (quiz).'
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n81
  cau: 'Câu hỏi 1: khác biệt cốt lõi giữa flow và "thích"; flow có cấu trúc đặc điểm cụ thể (mục tiêu rõ, phản hồi, mất tự ý thức, thời gian biến dạng); không đi kèm thành tích cao lúc nào cũng.'
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n82
  cau: "Câu hỏi 2: theo mô hình kênh flow, kỹ năng cao mà thử thách thấp thì chán nản; lo âu khi thử thách vượt kỹ năng; thờ ơ khi cả hai thấp."
  loai: dinh-nghia
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n83
  cau: "Câu hỏi 3: kết quả gây ngạc nhiên nhất của Csikszentmihalyi & LeFevre (1989): phần lớn trải nghiệm flow được báo cáo khi làm việc."
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n85
  cau: 'Câu hỏi 5: "thư giãn" là một trong hai chỉ số không bị ảnh hưởng bởi flow trong nghiên cứu 1989; flow không phải thư giãn nhẹ nhàng.'
  loai: phat-hien
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n86
  cau: "Mục Nguồn: Csikszentmihalyi (1990) là sách (Harper & Row, New York); sách chưa mở được nên các nhận định về nội dung sách dựa trên Swann 2018 và Abuhamdeh 2020 kể lại."
  loai: lich-su
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n87
  cau: "Mục Nguồn: các tạp chí, tập, trang của 7 bài đã ghi khớp Crossref (Csikszentmihalyi 1977: 6(3) 281–294; 1989: 56(5) 815–822; Jackson & Marsh 1996: 18(1) 17–35; Kawabata 2008: 9, 465–485; Løvoll 2014: 115(1) 117–136; Swann 2018: 30(3) 249–271)."
  loai: lich-su
- trang: kham-pha/hanh-phuc/tien-va-hanh-phuc
  id: n43
  cau: "Khung Đang tranh cãi (tổng thể): tiền có mua được hạnh phúc cảm xúc không?"
  loai: nhan
- trang: kham-pha/hanh-phuc/tien-va-hanh-phuc
  id: n54
  cau: "Áp dụng 2 (nhãn Đang tranh cãi): ở thu nhập thấp, mối liên hệ giữa thu nhập và tinh thần dốc nhất, chưa chứng minh nhân quả."
  loai: nhan
- trang: kham-pha/hanh-phuc/tien-va-hanh-phuc
  id: n58
  cau: "Áp dụng 3 (nhãn Đang tranh cãi): khi đã đủ sống, hạnh phúc cảm xúc của đa số vẫn tăng theo thu nhập nhưng chậm dần (logarit); nhóm bất hạnh nhất không còn giúp trên khoảng 100.000 USD/năm."
  loai: nhan
- trang: kham-pha/hanh-phuc/tien-va-hanh-phuc
  id: n77
  cau: "Câu hỏi 5: chủ đề gắn nhãn Đang tranh cãi vì nghịch lý Easterlin vẫn bị phản bác và mâu thuẫn 2010–2021 mới được hòa giải trên dữ liệu người Mỹ."
  loai: nhan
