- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n68
  cau: Chính nhóm Crum coi niềm tin "stress có lợi" không phải một chiến lược đối phó (Crum và cộng sự, 2013), và thử nghiệm 2023 dùng thông tin cân bằng cả hai mặt của stress.
  loai: phat-hien
  nguon:
    - ten: "Crum, Salovey & Achor (2013), JPSP 104(4), 716–733: toàn văn (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus)"
      link: https://doi.org/10.1037/a0031201
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "Niềm tin "stress có lợi" không có nghĩa mọi áp lực đều tốt, càng không thay thế việc giải quyết nguyên nhân". Chữ mới: dẫn Crum 2013 và 2023. Lý do: khẳng định "không phải một chiến lược đối phó" chỉ kiểm được gián tiếp: bài 2013 nói mindset là biến riêng, không phải coping (n30, mục Study 1: SMM tách khỏi coping); mức này "theo bài kể lại". Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n57
  cau: "Khung nhãn mục 4: 'Đánh giá lại sau mỗi vòng' là khá vững; mỗi vài ngày hãy tự hỏi 'cách mình đang dùng có giúp gì không? tình hình đã khác chưa?'; điều này gần với thành phần 'nhạy với phản hồi' và với ý đối phó thay đổi theo đánh giá liên tục trong mô hình của Lazarus và Folkman."
  loai: nhan
  nguon:
    - ten: "Bonanno & Burton (2013), Perspect Psychol Sci 8(6), 591–612: tóm tắt (OpenAlex, Europe PMC PMID 26173226); không mở được toàn văn"
      link: https://doi.org/10.1177/1745691613504116
    - ten: "Cheng, Lau & Chan (2014), Psychol Bull 140(6), 1582–1607: tóm tắt (OpenAlex, Europe PMC PMID 25222637)"
      link: https://doi.org/10.1037/a0037913
    - ten: "Finkel, Fougea & Le Roux (2025), arXiv:2501.05185: toàn văn; bài này trích nguyên văn và ghi số trang của sách Lazarus & Folkman (1984), nên là nguồn thứ cấp 'theo X kể lại'"
      link: https://arxiv.org/abs/2501.05185
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: nhãn Vững chắc; "Đây chính là thành phần nhạy với phản hồi … và cũng là vòng reappraisal trong mô hình gốc". Chữ mới: Khá vững; "Đây gần với … và với ý rằng đối phó thay đổi theo đánh giá liên tục". Lý do: "chính là" mạnh; thuật ngữ reappraisal không kiểm được trong nguồn đã mở. "Mỗi vài ngày" là lời khuyên thực hành của trang, không có số liệu riêng. Review (Claude Opus 5.5, 10/11/2026): dung. Khá vững chấp nhận được: Cheng 2014 (tổng hợp, linh hoạt và thích ứng r = 0,23) cùng chiều; riêng "nhạy với phản hồi" là thành phần đề xuất của Bonanno & Burton, chưa có tổng hợp riêng (ghi ở ly_do). Lời khuyên nói "gần với", không nói đã chứng minh.'
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n43
  cau: 'Khung "Khá vững: mối đe dọa xuất hiện thường xuyên trong một số loại giấc mơ".'
  loai: nhan
  nguon:
    - ten: "Valli và cộng sự (2005), Conscious Cogn 14(1), 188–218: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/s1053-8100(03)00019-9
    - ten: "Zadra, Desjardins & Marcotte (2006), Conscious Cogn 15(2), 450–463: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.concog.2005.02.002
    - ten: "Revonsuo (2000), Behav Brain Sci 23(6), 877–901: toàn văn (PDF)"
      link: https://doi.org/10.1017/S0140525X00004015
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: :::kha-vung[cảm xúc tiêu cực — đặc biệt là sợ hãi — chiếm ưu thế trong giấc mơ] "Phân tích nội dung mơ trên nhiều quần thể cho thấy sợ hãi là cảm xúc phổ biến nhất trong mơ, tiếp đến là giận dữ." Chữ mới: khung về mối đe dọa, dẫn Valli 2005 và Zadra 2006. Lý do: câu cũ không có nguồn và không tìm thấy nguồn mở xác nhận; thay bằng điều kiểm được. Review (Claude Opus 5.5, 10/11/2026): dung. Khá vững đạt: Valli 2005 (tóm tắt: sang chấn nặng có nhiều và nặng hơn) và Zadra 2006 (66%, hỗn hợp) cùng chiều; hai mẫu đặc biệt.'
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n60
  cau: Tìm kiếm sự giúp đỡ có thể xem là một cách đối phó chủ động.
  loai: phat-hien
  nguon:
    - ten: "Folkman, Lazarus, Gruen & DeLongis (1986), J Pers Soc Psychol 50(3), 571–579: toàn văn (PDF trong Internet Archive, bộ wikipedia-scholarly-sources-corpus)"
      link: https://doi.org/10.1037/0022-3514.50.3.571
    - ten: "NHS (Anh), trang Stress: trang chính thức, đọc ngày 10/11/2026"
      link: https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/stress/
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "Tìm kiếm sự giúp đỡ chuyên nghiệp cũng là một chiến lược đối phó — và là một chiến lược tốt." Chữ mới: "có thể xem là một cách đối phó chủ động". Lý do: "một chiến lược tốt" là đánh giá hiệu quả không có nguồn; Penley 2002 thấy tìm hỗ trợ xã hội liên hệ âm trong dữ liệu tương quan (có thể do người căng thẳng hơn tìm nhiều hơn). Câu giữ ở mức phân loại. Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại toàn văn Folkman và cộng sự 1986 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus). "seeking social support" là một dạng đối phó (tr. 572); NHS khuyên nói chuyện với người thân hay nhân viên y tế. "Có thể xem là" đúng mức.'
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n54
  cau: Ngay khi tỉnh, có thể thử nằm yên một lúc, nhớ lại giấc mơ và ghi vài từ khóa.
  loai: loi-khuyen
  nguon:
    - ten: "Vallat và cộng sự (2017), Front Hum Neurosci 11, 132: toàn văn (PDF, Internet Archive)"
      link: https://doi.org/10.3389/fnhum.2017.00132
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "Ngay khi tỉnh, đừng vội lướt điện thoại — hãy nằm yên …". Chữ mới: "có thể thử …". Lý do: mềm; "đừng lướt điện thoại" không có nguồn. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
