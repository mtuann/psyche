- trang: them/gioi-thieu
  id: n1
  luot_2: dung
  nguon: ["https://dictionary.apa.org/psyche"]
  trich: "psyche: in psychology, the mind in its totality, as distinguished from the physical organism; historically had come to refer to the soul or the very essence of life."
  ghi_chu: "Khớp mục APA Dictionary."
- trang: them/gioi-thieu
  id: n2
  luot_2: dung
  nguon: ["https://creativecommons.org/licenses/by-sa/4.0/"]
  trich: "copy and redistribute the material in any medium or format for any purpose, even commercially; remix, transform, build upon; attribution; ShareAlike (same license)."
  ghi_chu: "Trang tóm lược (deed) của CC; bản pháp lý đầy đủ không đọc."
- trang: them/gioi-thieu
  id: n3
  luot_2: dung
  nguon: ["https://docs.github.com/en/pages/getting-started-with-github-pages/about-github-pages"]
  trich: "When a GitHub Pages site is visited, the visitor's IP address is logged and stored for security purposes, regardless of whether the visitor has signed into GitHub or not."
  ghi_chu: "Mục Data collection của tài liệu GitHub; đã mở ngày 17/11/2026."
- trang: them/gioi-thieu
  id: n4
  luot_2: dung
  nguon: ["https://doi.org/10.1111/j.1467-9280.2006.01693.x", "https://doi.org/10.3102/0034654316689306"]
  trich: "Roediger và Karpicke (2006): ở bài kiểm tra sau 2 ngày và 1 tuần, người đã tự kiểm tra nhớ hơn hẳn người đọc lại; Adesope và cộng sự (2017), phân tích tổng hợp: practice tests are more beneficial for learning than restudying."
  ghi_chu: "Chỉ đọc được tóm tắt (OpenAlex). Lưu ý ở bài kiểm tra sau 5 phút thì đọc lại còn tốt hơn; câu nói về nhớ lâu nên đúng."
- trang: them/du-lieu-cua-toi
  id: n1
  luot_2: dung
  nguon: ["https://developer.mozilla.org/en-US/docs/Web/API/Web_Storage_API/Using_the_Web_Storage_API", "https://developer.mozilla.org/en-US/docs/Web/API/Storage_API/Storage_quotas_and_eviction_criteria"]
  trich: "localStorage persists even when the browser is closed; storage is per origin (không đồng bộ giữa thiết bị); in private browsing mode some browsers give an empty localStorage with a quota of zero; stored data is usually deleted when private mode ends."
  ghi_chu: "MDN không có câu riêng về người dùng xóa dữ liệu duyệt web, nhưng đó là hành vi chuẩn của trình duyệt; phần chặn lưu và chế độ riêng tư đã xác nhận."
- trang: them/nhat-ky
  id: n1
  luot_2: khong-chac
  ghi_chu: "chỗ khó: câu là lời dặn về cách đọc kết quả công cụ của site, không phải phát hiện thực nghiệm; không có nguồn bậc 1-2 nào xác nhận hay bác bỏ riêng cho công cụ này. Hướng nhận định hợp lý (một lần đo trực tuyến không phải thước đo chuẩn hóa) nhưng tôi không mở nguồn nào đứng riêng cho câu."
- trang: them/nghien-cuu-moi
  id: b1
  luot_2: dung
  nguon: ["https://doi.org/10.1525/collabra.125685"]
  trich: "Estimating the Replicability of Psychology Experiments After an Initial Failure to Replicate, Collabra: Psychology 2024, 10(1), mã bài 125685; Crossref liệt kê 20 tác giả, tác giả đầu Boyce."
  ghi_chu: "Siêu dữ liệu từ Crossref."
- trang: them/nghien-cuu-moi
  id: b2
  luot_2: dung
  nguon: ["https://doi.org/10.1525/collabra.125685"]
  trich: "we report 17 re-replications of experiments for which an original replication had failed. In 5/17 of these rescue projects (29%), the rescue study mostly or fully replicated the original results, albeit with a smaller effect size; in the other 12, the second replication was also judged to have failed."
  ghi_chu: "Tóm tắt từ Crossref."
- trang: them/nghien-cuu-moi
  id: b3
  luot_2: dung
  nguon: ["https://doi.org/10.1525/collabra.125685"]
  trich: "We speculate that successful rescue projects were due to larger sample sizes or methodological changes such as attention checks. In the absence of obvious weaknesses in a failed replication study's sample or procedure, however, it may be most efficient to stop pursuing an effect after a single failed replication."
  ghi_chu: "Tóm tắt từ Crossref."
- trang: them/nghien-cuu-moi
  id: b4
  luot_2: dung
  nguon: ["https://doi.org/10.1525/collabra.125685"]
  trich: "5/17 (29%)."
  ghi_chu: "Suy luận thống kê đúng: với 17 trường hợp, khoảng tin cậy 95% của 5/17 rộng (khoảng 13% đến 53% theo Wilson, tự tính). Đây là nhận xét của site, không phải của tác giả; không sai."
- trang: them/nghien-cuu-moi
  id: d1
  luot_2: dung
  nguon: ["https://doi.org/10.1037/rev0000644"]
  trich: "Dawson C, de Meza D. Talking the talk, not walking the walk: The coevolution of overconfidence and loss aversion. Psychological Review; Crossref ghi đăng trực tuyến 20/7/2026."
  ghi_chu: "Siêu dữ liệu Crossref và Europe PMC."
- trang: them/nghien-cuu-moi
  id: d2
  luot_2: khong-chac
  ghi_chu: "chỗ khó: tóm tắt nói 'We propose a signaling theory' và 'Evidence supports this interpretation', nghĩa là bài đề xuất lý thuyết nhưng có viện dẫn bằng chứng; tôi không mở được toàn văn nên không loại trừ việc bài có phân tích dữ liệu hay mô phỏng riêng. Phần 'một bài lý thuyết, đề xuất mô hình' thì đúng."
- trang: them/nghien-cuu-moi
  id: d3
  luot_2: dung
  nguon: ["https://doi.org/10.1037/rev0000644"]
  trich: "Overconfidence is a call to action, while loss aversion curbs initiative... if overconfidence is adaptive, why is it at least partially canceled by loss aversion?"
  ghi_chu: "Chỉ đọc được tóm tắt; khớp."
- trang: them/nghien-cuu-moi
  id: d4
  luot_2: dung
  nguon: ["https://dictionary.apa.org/behavioral-economics", "https://doi.org/10.2307/2937956"]
  trich: "APA: loss aversion (the tendency to go to disproportionately great lengths to avoid perceived losses); Tversky và Kahneman (1991): losses and disadvantages have greater impact on preferences than gains and advantages."
  ghi_chu: ""
- trang: them/nghien-cuu-moi
  id: d5
  luot_2: dung
  nguon: ["https://doi.org/10.1037/rev0000644"]
  trich: "Since the decision error associated with high self-belief is less burdensome for the more able, and the benefit of being perceived as able increases with ability, hardwired overconfidence is a credible signal of true ability."
  ghi_chu: "Chỉ đọc được tóm tắt; khớp."
- trang: them/nghien-cuu-moi
  id: d6
  luot_2: dung
  nguon: ["https://doi.org/10.1037/rev0000644"]
  trich: "[loss aversion] partially ameliorates the decision costs of overconfidence, but as it is usually hidden, it does not eliminate its signaling role... Kahneman's advice that individuals eliminate both overconfidence and loss aversion is poorly founded."
  ghi_chu: "Chỉ đọc được tóm tắt; khớp."
- trang: them/nghien-cuu-moi
  id: d7
  luot_2: khong-chac
  ghi_chu: "chỗ khó: tóm tắt chỉ nói 'Evidence supports this interpretation'. Vế 'mô hình vẫn cần được kiểm định bằng dữ liệu' không có trong tóm tắt (là nhận xét của site, chưa xác nhận được vì không mở toàn văn); vì vậy câu gán cho tóm tắt điều tóm tắt không nói."
- trang: them/nghien-cuu-moi
  id: d8
  luot_2: khong-chac
  ghi_chu: "chỗ khó: câu đã đánh dấu (bỏ). Một mô hình lý thuyết mới, mới công bố, chưa có tổng quan hay tái lập nào: 'Đang tranh cãi' hàm ý bằng chứng mâu thuẫn mà tôi không tìm thấy; thước đo nhãn không rõ có áp dụng cho mô hình lý thuyết. Nếu giữ, nên bỏ nhãn hay nói chưa đủ bằng chứng; không đánh giá thêm."
- trang: them/nghien-cuu-moi
  id: z1
  luot_2: dung
  nguon: ["https://doi.org/10.1016/j.ijchp.2025.100559", "https://pmc.ncbi.nlm.nih.gov/articles/PMC11987655/"]
  trich: "Zhang M, Fang W, Wang J. Effects of human concurrent aerobic and resistance training on cognitive health: A systematic review with meta-analysis. Int J Clin Health Psychol 2025; 25(1): 100559."
  ghi_chu: ""
- trang: them/nghien-cuu-moi
  id: z2
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC11987655/"]
  trich: "The meta-analysis included 35 RCTs with 5,734 participants, revealing a positive effect of CT on global cognition (g = 0.32, 95% CI: 0.17-0.46, p < 0.001)."
  ghi_chu: "Khớp từng số. Tác giả gọi 'concurrent training' (CT) là tập đồng thời aerobic và kháng lực."
- trang: them/nghien-cuu-moi
  id: z3
  luot_2: qua-manh
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC11987655/"]
  trich: "Participants aged over 65 exhibited significant effects (g = 0.33, 95% CI: 0.14 to 0.51; p < 0.05), whereas those aged 18 to 65 did not (p = 0.099), indicating greater cognitive benefits from exercise in older adults."
  cau_dung: "Ở người từ 65 tuổi trở lên, tập kết hợp có hiệu quả có ý nghĩa thống kê (g = 0,33; KTC 95%: 0,14-0,51), còn ở nhóm 18-65 tuổi thì chưa đạt ý nghĩa thống kê (p = 0,099); tác giả diễn giải là lợi ích lớn hơn ở người cao tuổi, nhưng đây là so sánh có/không đạt ý nghĩa thống kê giữa các nhóm con, chưa phải phép kiểm định sự khác biệt. Ở người có bệnh g = 0,28; ở các chương trình 13-26 tuần g = 0,21 (có ý nghĩa)."
  ghi_chu: "chỗ khó: các số đều đúng; vấn đề là 'rõ hơn' dựa trên so sánh ý nghĩa thống kê giữa các nhóm con (g = 0,33 gần bằng g chung 0,32, khoảng tin cậy rộng), nên nói mạnh hơn bằng chứng. Câu trích dùng đúng lời tác giả nên nếu giữ thì nên thêm 'theo tác giả' và giới hạn này."
- trang: them/nghien-cuu-moi
  id: z4
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC11987655/"]
  trich: "Prioritizing strength training, implementing short- to medium-term interventions (4-26 weeks), and maintaining session durations of 30-60 minutes are crucial for optimizing cognitive benefits."
  ghi_chu: "Khuyến nghị của tác giả, đúng như câu viết; đây là kết luận từ phân tích nhóm con, không phải thử nghiệm so sánh trực tiếp."
- trang: them/nghien-cuu-moi
  id: z5
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC3840331/"]
  trich: "A commonly used interpretation is to refer to effect sizes as small (d = 0.2), medium (d = 0.5), and large (d = 0.8) based on benchmarks suggested by Cohen (1988)."
  ghi_chu: "Qua Lakens (2013); không mở sách gốc của Cohen. Lakens nhấn mạnh các mốc này mang tính tùy ý."
- trang: them/nghien-cuu-moi
  id: z6
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC11987655/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3840331/"]
  trich: "g = 0.32 (95% CI 0.17-0.46); mốc Cohen: 0,2 nhỏ, 0,5 trung bình."
  ghi_chu: "chỗ khó: bài gốc không tự gọi mức độ. Theo mốc Cohen, 0,32 gần mốc 'nhỏ' hơn 'trung bình' (khoảng tin cậy trải từ nhỏ tới gần trung bình), nên nói 'nhỏ' hay 'nhỏ đến trung bình' đều chấp nhận được; đây là cách diễn giải của site, không phải kết luận của tác giả."
- trang: them/nghien-cuu-moi
  id: g1
  luot_2: dung
  nguon: ["https://doi.org/10.7554/elife.101992", "https://pmc.ncbi.nlm.nih.gov/articles/PMC12507438/"]
  trich: "Ng T, Noh E, Spencer RMC. Bayesian meta-analysis reveals the mechanistic role of slow oscillation-spindle coupling in sleep-dependent memory consolidation. eLife 13: RP101992 (Crossref: ngày 8/10/2025)."
  ghi_chu: "Bản Reviewed Preprint/Version of Record của eLife."
- trang: them/nghien-cuu-moi
  id: g2
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC12507438/"]
  trich: "This meta-analysis, comprising 23 studies and 297 effect sizes... We found strong evidence supporting that precise and strong SO-fast SP coupling in the frontal lobe predicts memory consolidation."
  ghi_chu: ""
- trang: them/nghien-cuu-moi
  id: g3
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC12507438/"]
  trich: "The strength of this association is mediated by memory type, aging, and spatiotemporal features, including SP frequency and cortical topography."
  ghi_chu: ""
- trang: them/nghien-cuu-moi
  id: g4
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC12507438/"]
  trich: "cortical slow oscillations (SO; 0.16-4 Hz), thalamocortical sleep spindles (SP; 8-16 Hz) during nREM sleep."
  ghi_chu: "Định nghĩa chuẩn; 'thoi ngủ nhanh' là fast spindles (tần số cao hơn trong dải thoi ngủ)."
- trang: them/nghien-cuu-moi
  id: g5
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC12507438/"]
  trich: "We transformed the circular-linear correlation to standardized coefficients... predicts memory consolidation."
  ghi_chu: "Độ lớn hiệu ứng là hệ số tương quan (có phần tương quan vòng-tuyến tính), nên đúng là liên hệ, không tự chứng minh nhân quả; tác giả dẫn riêng bằng chứng kích thích và dược lý ở nơi khác."
- trang: them/nghien-cuu-moi
  id: f1
  luot_2: dung
  nguon: ["https://doi.org/10.1037/pro0000589"]
  trich: "Ferguson, Kaye, Branley-Bell, Markey. There is no evidence that time spent on social media is correlated with adolescent mental health problems: Findings from a meta-analysis. Professional Psychology: Research and Practice 56(1), 73-83 (số 2/2025)."
  ghi_chu: "Siêu dữ liệu Crossref."
- trang: them/nghien-cuu-moi
  id: f2
  luot_2: dung
  nguon: ["https://doi.org/10.1037/pro0000589", "https://api.semanticscholar.org/graph/v1/paper/DOI:10.1037/pro0000589?fields=title,abstract"]
  trich: "This was investigated in a meta-analysis of 46 studies of youth social media use and mental health. Results indicated that the current pool of research is unable to support claims of harmful effects for social media use on youth internalizing disorders."
  ghi_chu: "Chỉ đọc được tóm tắt (qua Semantic Scholar). Lưu ý: tiêu đề bài và phần 'Public Significance' nói mạnh hơn ('no evidence'; 'does not predict'); câu của site thận trọng hơn và đúng."
- trang: them/nghien-cuu-moi
  id: f3
  luot_2: dung
  nguon: ["https://api.semanticscholar.org/graph/v1/paper/DOI:10.1037/pro0000589?fields=title,abstract"]
  trich: "Some types of methodological weaknesses, such as evident demand characteristics and lack of preregistration, remain common in this area."
  ghi_chu: "Chỉ đọc được tóm tắt."
- trang: them/nghien-cuu-moi
  id: f4
  luot_2: dung
  nguon: ["https://api.semanticscholar.org/graph/v1/paper/DOI:10.1037/pro0000589?fields=title,abstract"]
  trich: "the current pool of research is unable to support claims of harmful effects... caution is issued when attributing mental health harm to social media use as the current evidence cannot support this."
  ghi_chu: "Câu là suy luận logic của site; đúng. Lưu ý tác giả tự diễn giải mạnh hơn về phía 'không có bằng chứng', còn bài này bàn về thời gian dùng mạng xã hội, không phải mọi kiểu dùng."
