  nguon: ["https://repositorio.iscte-iul.pt/bitstream/10071/28991/1/article_73154.pdf", "https://pubmed.ncbi.nlm.nih.gov/32196435/"]
  trich: "Data were collected in 2016... in person; each study site collected data from both university populations and community samples... The analysis plan for this project was pre-registered prior to data analyses."
  ghi_chu: "Bản tác giả (accepted version). Đăng ký trước là kế hoạch phân tích và biến dự báo, trước khi phân tích dữ liệu, không phải trước khi thu dữ liệu; câu trang viết 'kế hoạch phân tích' nên đúng."
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n78
  luot_2: dung
  nguon: ["https://repositorio.iscte-iul.pt/bitstream/10071/28991/1/article_73154.pdf", "https://pubmed.ncbi.nlm.nih.gov/32196435/"]
  trich: "Consistent with biosocial role theory, the sex difference in age of partner decreased as gender equality increased. However, little support was found for the relationship between sex differences in ideal mate preferences and gender equality... no support for the relationship between pathogen prevalence and preference for attractiveness, intelligence, and health, failing to support the evolutionary prediction of Gangestad and Buss (1993)."
  ghi_chu: "Khớp phần Thảo luận. Bài có một ngoại lệ nhỏ (chỉ số GGGI và triển vọng tài chính) mà câu trang gói trong 'ít liên quan'."
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n79
  luot_2: dung
  nguon: ["https://openstax.org/books/psychology-2e/pages/3-1-human-genetics"]
  trich: "genes not only code for particular traits, but also contribute to certain patterns of cognition and behavior... Evolutionary psychologists study a variety of psychological phenomena that may have evolved as adaptations, including fear response, food preferences, mate selection, and cooperative behaviors"
  ghi_chu: "Đã mở mục 3.1 (Human Genetics), hộp 'Two Perspectives on Genetics and Behavior'."
