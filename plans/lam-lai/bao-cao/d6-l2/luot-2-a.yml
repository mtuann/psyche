  id: "n2"
  luot_2: "dung"
  nguon:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/"
  trich: "\"adolescents tend to make decisions and judgments that are quite similar to those of adults\" except when the socioemotional system is aroused (e.g., in the presence of friends)"
  ghi_chu: "Ví dụ giả định, nhất quán với nguồn."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n3"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/18509515/"
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/"
  trich: "\"cognitive control increases gradually and linearly throughout adolescence and into the early 20s\"; reward sensitivity peaks in mid-adolescence; peers amplify"
  ghi_chu: "Mô hình 'dual systems' của Steinberg (Shulman 2016 xác nhận)."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n4"
  luot_2: "dung"
  nguon:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC3621648/"
  trich: "\"the brain rewires itself from the onset of puberty up until 24 years old, especially in the prefrontal cortex. The rewiring is accomplished by dendritic pruning and myelination.\""
  ghi_chu: "Tổng quan bậc 2 vừa phải (Arain 2013, Neuropsychiatr Dis Treat); 'từ khoảng 10 tuổi' theo mốc dậy thì."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
