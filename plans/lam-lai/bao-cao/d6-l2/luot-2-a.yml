    - "https://www.ebi.ac.uk/europepmc/webservices/rest/search?format=json&query=(%22risk%20taking%22%20OR%20%22risk-taking%22)%20AND%20(Vietnam%20OR%20Vietnamese)%20AND%20adolescen*%20AND%20(peer)%20AND%20(driving%20OR%20%22decision%20making%22)"
  trich: "Tìm Europe PMC ngày 10/11/2026: 0 kết quả cho MRI/fMRI phát triển não vị thành niên (cơ quan Hà Nội, TP.HCM hay tiêu đề Vietnam); không có thí nghiệm kiểu Gardner & Steinberg trên thiếu niên Việt"
  ghi_chu: "Phạm vi: Europe PMC; không phủ tạp chí trong nước."
  ngay: "2026-11-10"
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n46"
  luot_2: "sai"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/19327037/"
  trich: "\"Taken together, the lessons of developmental science offer strong support for the maintenance of a separate juvenile justice system in which adolescents are judged, tried, and sanctioned in developmentally appropriate ways.\""
  cau_dung: "Steinberg (2009) bàn về việc dùng khoa học phát triển trong tư pháp người chưa thành niên của Mỹ: khoa học không thể và không nên một mình quyết định chính sách, nhưng bài kết luận khoa học phát triển ủng hộ mạnh việc duy trì hệ thống tư pháp riêng, qua ba vấn đề: trách nhiệm hình sự, năng lực ra tòa, tác động của chế tài trừng phạt."
  ghi_chu: "Tóm tắt nói rõ kết luận có tính khuyến nghị chính sách; phần 'khoa học chỉ nên là một trong các cân nhắc' đúng."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n47"
  luot_2: "dung"
  nguon:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/"
  trich: "\"the model does not suggest that adolescents are universally risky or incompetent decision makers\""
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n48"
  luot_2: "dung"
  nguon:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/"
  trich: "\"cognitive control ... increase[s] gradually and linearly throughout adolescence and into the early 20s\"; \"The end of adolescence ... is not easily pegged to any single biological or social event\""
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
