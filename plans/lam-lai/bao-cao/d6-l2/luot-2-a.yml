  id: "n17"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/16793895/"
  trich: "\"maturing subcortical systems become disproportionately activated relative to later maturing top-down control systems, biasing the adolescent's action toward immediate over long-term gains\""
  ghi_chu: "37 người, cắt ngang: 'nghiên cứu nhỏ'."
