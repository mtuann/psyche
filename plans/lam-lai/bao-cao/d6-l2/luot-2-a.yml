  luot_2: "dung"
  nguon:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/"
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC3075496/"
  trich: "\"by age 15 or so, adolescents perform as well as adults\" on reasoning; peer presence raises risk taking; Chein: comparable \"when tested alone\""
