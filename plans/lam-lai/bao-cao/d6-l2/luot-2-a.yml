    - "https://pubmed.ncbi.nlm.nih.gov/19327037/"
    - "https://pubmed.ncbi.nlm.nih.gov/16793895/"
  trich: "\"the differing timetables of these changes make mid-adolescence a time of heightened vulnerability\"; Steinberg 2009: \"should be informed by the lessons of developmental science\""
