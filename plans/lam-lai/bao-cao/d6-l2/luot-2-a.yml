  luot_2: "khong-chac"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/15148381/"
  trich: "Tóm tắt Gogtay 2004 không nói về tỉa synap"
  ghi_chu: "Cần toàn văn PNAS để xác nhận 'Gogtay đoán một phần do tỉa synap'. PMC và PNAS chặn tải tự động (kiểm tra trình duyệt, 403); chưa mở được."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n6"
  luot_2: "khong-chac"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/15148381/"
  trich: "\"higher-order association cortices mature only after lower-order somatosensory and visual cortices\""
  ghi_chu: "Nửa đầu khớp tóm tắt; 'vỏ não trước trán lưng–bên mất chất xám muộn nhất, cuối tuổi vị thành niên' cần toàn văn, chưa mở được."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n7"
  luot_2: "dung"
  nguon:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC3621648/"
  trich: "\"myelination increases the speed of impulse conduction ... myelinogenesis remains active during adolescent life\""
  ghi_chu: "'Có thể còn lâu hơn': Arain nêu đến 24 tuổi."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n8"
  luot_2: "khong-chac"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/18509515/"
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/"
  trich: "\"changes around the time of puberty in the brain's socio-emotional system ... fueled mainly by a dramatic remodeling of the brain's dopaminergic system\""
  ghi_chu: "Tóm tắt Steinberg 2008 khớp ý chính; việc nêu 'hạnh nhân và nhân accumbens' nằm trong toàn văn (PMC chặn tải tự động), chưa mở được. Shulman 2016 chỉ nói 'dopamine-rich limbic regions', 'ventral striatum'."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n9"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/18509515/"
    - "https://pubmed.ncbi.nlm.nih.gov/16793895/"
  trich: "\"The differing timetables of these changes make mid-adolescence a time of heightened vulnerability\"; Galvan: \"maturing subcortical systems become disproportionately activated relative to later maturing top-down control systems\""
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n10"
  luot_2: "khong-chac"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/15148381/"
  trich: "\"Thirteen healthy children for whom anatomic brain MRI scans were obtained every 2 years, for 8-10 years ... between the age of 4-21 years\""
  ghi_chu: "Khớp 13 trẻ, mỗi 2 năm, 8–10 năm, 4–21 tuổi. 'Tổng cộng 52 lượt chụp' và 'nhóm NIMH' không có trong tóm tắt; toàn văn chưa mở được."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n11"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/15148381/"
  trich: "\"higher-order association cortices mature only after lower-order somatosensory and visual cortices, the functions of which they integrate ... phylogenetically older brain areas mature earlier than newer ones\""
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n12"
  luot_2: "khong-chac"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/15148381/"
  ghi_chu: "Chi tiết 'thùy thái dương bên chín muộn nhất; cực trán và cực chẩm mất chất xám sớm' nằm trong toàn văn Gogtay 2004 (chưa mở được), không có trong tóm tắt."
