  id: "n13"
  luot_2: "khong-chac"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/15148381/"
  trich: "13 healthy children (tóm tắt)"
  ghi_chu: "Chỉ 13 trẻ khớp. IQ trung bình ~125 và 'thiên lệch lựa chọn' cần toàn văn, chưa mở được."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n14"
  luot_2: "khong-chac"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/16793895/"
    - "https://api.crossref.org/works/10.1523/jneurosci.1062-06.2006"
  trich: "\"Thirty-seven participants (7-29 years of age) were scanned using event-related functional magnetic resonance imaging and a paradigm that parametrically manipulated reward values.\""
  ghi_chu: "37 người 7–29 tuổi khớp tóm tắt. Phân nhóm (16/13/12 và 13/12/12) và 4 người bị loại do cử động cần toàn văn; PMC/jneurosci chặn tải tự động."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n15"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/16793895/"
  trich: "\"Accumbens activity in adolescents looked like that of adults in both extent of activity and sensitivity to reward values, although the magnitude of activity was exaggerated.\""
  ghi_chu: "Tóm tắt: 'exaggerated accumbens activity ... in adolescents, compared with children and adults'."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n16"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/16793895/"
  trich: "\"the extent of orbital frontal cortex activity in adolescents looked more like that of children than adults\""
