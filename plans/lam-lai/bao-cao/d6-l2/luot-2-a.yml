  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/19327037/"
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/"
  trich: "\"should be informed by the lessons of developmental science\"; \"far from being a biologically deterministic model\""
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n34"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/18509515/"
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/"
  trich: "\"as a heuristic device, the dual systems model provides a far more accurate account ... Although it is admittedly an oversimplification\""
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n35"
  luot_2: "khong-chac"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/18509515/"
  ghi_chu: "Việc Steinberg 2008 dẫn Spear (2000) về giả thuyết thích nghi tiến hóa nằm trong toàn văn (chưa mở được: PMC chặn tải tự động); tóm tắt không có."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n36"
  luot_2: "dung"
  nguon:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/"
  trich: "\"the model recognizes that basic reasoning capacity is almost fully mature by mid-adolescence ... the dual systems model provides a far more accurate account of adolescent risk taking than prior models that have attributed adolescent recklessness to cognitive deficiencies\""
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n37"
  luot_2: "qua-manh"
  nguon:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/"
  trich: "\"under conditions that minimize arousal of the socioemotional system and allow for deliberative, calculated decision making, adolescents tend to make decisions ... similar to those of adults\""
  cau_dung: "Bằng chứng ủng hộ rằng quyết định của thiếu niên giống người lớn khi ít kích động cảm xúc; lời khuyên nói chuyện lúc 'nguội' là suy ra từ mô hình, chưa được kiểm chứng can thiệp."
  ghi_chu: "Nguồn xác nhận cơ chế (kích hoạt cảm xúc làm tăng mạo hiểm), không kiểm tra lời khuyên 'nói chuyện khi nguội, đừng giảng khi nóng' có hiệu quả; nhãn 'Khá vững' cho lời khuyên cao hơn bằng chứng."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n38"
  luot_2: "khong-chac"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/18509515/"
  ghi_chu: "Nhận định của Steinberg 2008 về chương trình giáo dục đổi hiểu biết hơn hành vi nằm trong toàn văn (chưa mở được)."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n39"
  luot_2: "dung"
  nguon:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/"
  trich: "\"when decision making occurs under conditions that excite, or activate, the socioemotional system ... adolescents are more prone than other age groups to pursue exciting, novel, and risky courses of action\""
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n40"
  luot_2: "qua-manh"
  nguon:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/"
    - "https://pubmed.ncbi.nlm.nih.gov/18509515/"
  trich: "\"Far from being a biologically deterministic model, the dual systems perspective explicitly emphasizes the context\""
  cau_dung: "Mô hình nhấn mạnh vai trò bối cảnh nên khuyến nghị thay đổi bối cảnh là hợp lý, nhưng hiệu quả của cách này chưa được kiểm chứng bằng nguồn đã đọc."
  ghi_chu: "Các nguồn mở xác nhận vai trò bối cảnh trong mô hình, không có thử nghiệm can thiệp 'thiết kế môi trường' nào đã đọc; nhãn 'Khá vững' cho khuyến nghị là cao hơn bằng chứng."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n41"
  luot_2: "khong-chac"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/18509515/"
  ghi_chu: "Câu có hai phần: khuyến nghị của Steinberg 2008 (toàn văn chưa mở được) và Simons-Morton 2005 về bạn cùng tuổi trong xe (bài gốc chưa tìm được bản mở)."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n42"
  luot_2: "khong-chac"
  ghi_chu: "Là câu về phạm vi các nguồn site đã đọc, không kiểm được từ bên ngoài; bản thân khoảng trống ('chưa kiểm tra') là khẳng định về văn liệu, nên chuyển thành ve-site hoặc ghi rõ phạm vi."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n43"
  luot_2: "khong-chac"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/15148381/"
  ghi_chu: "Phần 'chất xám giảm, một phần có thể do tỉa synap' cần toàn văn Gogtay 2004 (chưa mở được); phần còn lại là câu về phạm vi nguồn đã đọc."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n44"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/16060809/"
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC3075496/"
    - "https://pubmed.ncbi.nlm.nih.gov/15148381/"
    - "https://pubmed.ncbi.nlm.nih.gov/16793895/"
  trich: "nhóm Temple (Gardner & Steinberg; Chein), NIMH (Gogtay), Stanford/Cornell (Galvan)"
  ghi_chu: "Suy từ cơ quan tác giả; Defoe là phân tích tổng hợp quốc tế."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n45"
  luot_2: "dung"
  nguon:
