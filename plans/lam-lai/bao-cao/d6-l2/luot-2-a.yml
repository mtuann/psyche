  id: "n18"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/16060809/"
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC3075496/"
  trich: "\"306 individuals in 3 age groups--adolescents (13-16), youths (18-22), and adults (24 and older) ... randomly assigned to complete the measures either alone or with 2 same-aged peers\"; Chein 2011: \"simulated driving task\""
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n19"
  luot_2: "khong-chac"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/16060809/"
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC3075496/"
  trich: "\"adolescents (and undergraduates to a lesser extent), but not adults, took a substantially greater number of risks when observed by peers\""
  ghi_chu: "Chiều khớp (thanh thiếu niên nhiều nhất, người lớn không đổi; một mình thì tương đương, theo Chein 2011). 'Gấp đôi' và '50%' là số cụ thể, tóm tắt Gardner & Steinberg không nêu; toàn văn chưa mở được (bản mở chặn)."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n20"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/16060809/"
  trich: "\"(b) participants took more risks ... when in peer groups than alone; and (c) peer effects on risk taking and risky decision making were stronger among adolescents and youths than adults\""
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n21"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/18509515/"
  trich: "\"Risk-taking increases between childhood and adolescence as a result of changes around the time of puberty in the brain's socio-emotional system ... declines between adolescence and adulthood because of changes in the brain's cognitive control system\""
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n22"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/18509515/"
  trich: "\"The differing timetables of these changes make mid-adolescence a time of heightened vulnerability to risky and reckless behavior.\""
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n23"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/18999337/"
  trich: "\"a socioeconomically and ethnically diverse sample of 935 individuals between the ages of 10 and 30, using self-report and behavioral measures\""
  ghi_chu: "Steinberg và cộng sự 2008, Developmental Psychology."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n24"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/18999337/"
  trich: "\"sensation seeking increasing between 10 and 15 and declining or remaining stable thereafter ... impulsivity declining steadily from age 10 on\""
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n25"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/18999337/"
  trich: "\"Heightened vulnerability to risk taking in middle adolescence may be due to the combination of relatively higher inclinations to seek excitement and relatively immature capacities for self-control\""
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n26"
  luot_2: "dung"
  nguon:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/"
  trich: "\"the dual systems model provides a far more accurate account of adolescent risk taking than prior models\"; \"Although it is admittedly an oversimplification, as a heuristic device\""
  ghi_chu: "Shulman, Smith, Silva, Icenogle, Duell, Chein, Steinberg (2016)."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n27"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/25365761/"
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/"
  trich: "\"adolescents take more risks (g = .37) than adults ... adolescents and children take equal levels of risk (g = -.00)\"; Shulman: critiques that the model does not account for inconsistent findings; peak age of risk taking varies"
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n28"
  luot_2: "dung"
  nguon:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/"
    - "https://pubmed.ncbi.nlm.nih.gov/16793895/"
    - "https://pubmed.ncbi.nlm.nih.gov/25365761/"
  trich: "\"psychological and neural manifestations of reward sensitivity increase between childhood and adolescence, peak sometime during the late teen years\"; Defoe g = 0 vs children"
  ghi_chu: "Nhiều nghiên cứu cùng chiều, có ngoại lệ (kích hoạt vân lúc chờ thưởng, Defoe): 'Khá vững' không vượt thước đo."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n29"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/16060809/"
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC3075496/"
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/"
  trich: "\"adolescents are more induced by peer presence to take risks than are adults\"; Chein 2011 replicates Gardner & Steinberg"
  ghi_chu: "Nhiều thí nghiệm cùng hướng, chưa có tái lập đăng ký trước: 'Khá vững'."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n30"
  luot_2: "dung"
  nguon:
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/"
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC3075496/"
  trich: "\"Studies that have manipulated the social context have found that adolescents are more induced by peer presence to take risks than are adults\""
  ghi_chu: "Tên tác giả trích trong bản đã mở bị lược khỏi văn bản; Chein 2011 và Gardner & Steinberg 2005 xác nhận riêng."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n31"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/19327037/"
    - "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/"
  trich: "\"cannot, and should not, be dictated solely by studies of adolescent development\""
  ghi_chu: "Là câu hỏi quy phạm/pháp lý: các nguồn không thống nhất, hợp 'Đang tranh cãi'."
- trang: "kham-pha/co-so-sinh-hoc/nao-tuoi-teen"
  id: "n32"
  luot_2: "dung"
  nguon:
    - "https://pubmed.ncbi.nlm.nih.gov/19327037/"
  trich: "\"justice system policy and practice cannot, and should not, be dictated solely by studies of adolescent development, [but] the ways in which we respond to juvenile offending should be informed by the lessons of developmental science\""
