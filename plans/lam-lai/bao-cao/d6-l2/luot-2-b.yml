  cau_dung: "Chưa có bằng chứng cho 'tập vài tuần là não to ra'; với sa sút trí tuệ, thử nghiệm lớn (DAPA) và tổng quan Cochrane không thấy lợi ích nhận thức; vận động có lợi cho thể chất và sinh hoạt hằng ngày."
  trich: "DAPA: không làm chậm suy giảm; Cochrane: không có bằng chứng lợi ích nhận thức ở sa sút trí tuệ; Wilckens: hiệu quả ở can thiệp >24 tuần"
