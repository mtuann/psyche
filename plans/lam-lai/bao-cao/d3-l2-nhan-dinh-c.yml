- trang: thi-nghiem/harlow
  id: n1
  cau: Harry Harlow (1958) cho khỉ con chọn giữa "mẹ vải" mềm ấm và "mẹ sắt" bằng lưới thép; dù sữa ở mẹ nào, khỉ con dành phần lớn thời gian bám mẹ vải.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n2
  cau: Bài của Harlow (1958) là diễn văn của chủ tịch Hiệp hội Tâm lý học Hoa Kỳ (APA), đăng trên American Psychologist.
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n3
  cau: Harlow làm việc tại Đại học Wisconsin.
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n4
  cau: "Hộp hồ sơ: Harlow và Zimmermann (1959) ghi nhận khỉ mồ côi gắn bó mạnh và bền với mẹ giả."
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n5
  cau: 'Thí nghiệm "hai mẹ giả": mỗi khỉ con có một mẹ vải và một mẹ lưới thép, đặt trong hai ngăn gắn vào lồng.'
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n6
  cau: "Mẹ vải: khối gỗ bọc xốp, phủ vải bông, có bóng đèn phía sau phát nhiệt."
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n7
  cau: Mẹ lưới thép làm bằng lưới thép, cũng được sưởi ấm bằng nhiệt phát ra, chỉ khác mẹ vải ở chất lượng tiếp xúc.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n8
  cau: Mỗi mẹ có một "vú" ở ngực trên.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n9
  cau: Với 4 khỉ sơ sinh, mẹ vải cho sữa; với 4 khỉ còn lại, mẹ lưới thép cho sữa.
  loai: so-lieu
- trang: thi-nghiem/harlow
  id: n10
  cau: Thời gian trên mỗi mẹ được ghi tự động; khỉ con luôn được tự do rời khỏi tấm sưởi hay sàn để tới mẹ nào.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n11
  cau: Phòng thí nghiệm thường tách khỉ con khỏi mẹ 6–12 giờ sau sinh.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n12
  cau: Khỉ con đã có sẵn gắn bó với tấm vải lót chuồng, và có cơn giận dữ khi tấm vải bị lấy đi để vệ sinh.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n13
  cau: Dù sữa ở mẹ nào, khỉ con dành phần lớn thời gian bám vào mẹ vải.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n14
  cau: Với những khỉ bú mẹ lưới thép, thời gian trên mẹ lưới thép giảm dần theo tuổi còn thời gian trên mẹ vải tăng.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n15
  cau: Khi được cho thấy vật gây sợ như con gấu đồ chơi chuyển động, khỉ con ưa mẹ vải hơn rõ rệt, bất kể mẹ nào có sữa.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n16
  cau: Trong căn phòng lạ (6 × 6 × 6 feet), 4 trong 8 khỉ được thử, mỗi khỉ 3 phút, hai lần mỗi tuần trong 8 tuần.
  loai: so-lieu
- trang: thi-nghiem/harlow
  id: n17
  cau: Khi mẹ vải có mặt, khỉ con ôm mẹ rồi dùng mẹ làm "căn cứ" để khám phá và quay về; điểm cảm xúc tổng giảm một nửa.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n18
  cau: Khi mẹ vắng, khỉ con thường co rúm (freeze in a crouched position).
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n19
  cau: Bốn khỉ đối chứng chưa từng nuôi với mẹ giả có điểm cảm xúc khi mẹ vắng bằng nhóm thí nghiệm khi mẹ vắng.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n20
  cau: "Harlow kết luận: contact comfort là biến số có tầm quan trọng áp đảo trong hình thành phản ứng tình cảm, còn việc cho bú không đáng kể."
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n21
  cau: Harlow đề xuất chức năng chính của việc cho bú (như một biến số tình cảm) có lẽ là bảo đảm sự tiếp xúc cơ thể thường xuyên, thân mật giữa mẹ và con.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n22
  cau: Nhóm khỉ nuôi với một mẹ lưới thép hay một mẹ vải ăn lượng sữa và tăng cân như nhau.
  loai: so-lieu
- trang: thi-nghiem/harlow
  id: n23
  cau: Harlow, Dodsworth và Harlow (1965) nghiên cứu khỉ con trong cô lập xã hội hoàn toàn.
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n24
  cau: Kết quả của các nghiên cứu cô lập (sợ hãi cực độ, hành vi tự kích thích, không giao tiếp, không giao phối, con cái không chăm con) đã bỏ khỏi trang.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n25
  cau: Theo giáo trình mở, các thí nghiệm của Harlow ngày nay bị xem là phi đạo đức.
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n26
  cau: Vào những năm 1960–1970, Harlow làm các thí nghiệm nhằm gây trầm cảm ở khỉ để tìm cách chữa trầm cảm, bị chỉ trích dữ dội; một bài lịch sử gọi là "pit of despair".
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n27
  cau: '"IACUC, nguyên tắc 3R ra đời chính vì các thí nghiệm này": đã bỏ.'
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n28
  cau: Theo chuẩn mực ngày nay, nghiên cứu trên động vật phải qua hội đồng đạo đức và giảm thiểu đau đớn.
  loai: loi-khuyen
- trang: thi-nghiem/harlow
  id: n29
  cau: "Theo Harlow (1958), quan điểm phổ biến lúc đó: động cơ cơ bản là đói, khát...; tình yêu là động cơ phái sinh vì mẹ gắn với việc giảm đói và khát."
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n30
  cau: Harlow nghi ngờ quan niệm đó; ông cho rằng việc cho ăn là cơ chế không đủ để giải thích sự bền bỉ của gắn bó mẹ con.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n31
  cau: "Một giáo trình mở mô tả: Harlow (1958) kết luận gắn bó mẹ con không chỉ là dinh dưỡng; trước đó giới khoa học y học thường nghĩ trẻ gắn bó với người cho ăn."
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n32
  cau: Harlow gọi nhu cầu đó là "contact comfort".
  loai: dinh-nghia
- trang: thi-nghiem/harlow
  id: n33
  cau: "Khá vững: sự dễ chịu khi tiếp xúc quan trọng hơn việc cho bú trong gắn bó của khỉ con."
  loai: nhan
- trang: thi-nghiem/harlow
  id: n34
  cau: 'Khá vững: 4 trong 8 khỉ dùng mẹ vải làm "căn cứ" để khám phá phòng lạ; hình ảnh gần với "căn cứ an toàn" của Bowlby (theo OpenStax); Suomi và cộng sự (1976): khỉ có hành vi trầm cảm sau tách có thể trở lại hoạt động xã hội phù hợp tuổi nhờ tiếp xúc lặp lại với bạn cùng tuổi năng động.'
  loai: nhan
- trang: thi-nghiem/harlow
  id: n35
  cau: "Đang tranh cãi: suy rộng sang con người được bao xa."
  loai: nhan
- trang: thi-nghiem/harlow
  id: n36
  cau: Giáo trình mở mô tả Bowlby xây dựng thuyết gắn bó dựa trên công trình của Harlow và những người khác; gắn bó là sợi dây tình cảm giữa trẻ và mẹ; người chăm sóc là "căn cứ an toàn".
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n37
  cau: Mary Ainsworth nghiên cứu cách trẻ gắn bó khác nhau bằng "tình huống lạ" (strange situation).
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n38
  cau: Trong thí nghiệm 1958, bốn khỉ đối chứng chưa từng có mẹ giả được cho mẹ vải khi 250 ngày tuổi; sau 12–48 giờ khó chịu chúng dần tiếp xúc mẹ vải; thời gian bám mẹ vải tối đa chỉ khoảng một nửa nhóm nuôi từ đầu, Harlow lưu ý chưa biết có phải do kinh nghiệm sớm.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n39
  cau: Việc suy ra "bế ẵm trẻ sơ sinh không làm hư trẻ" là suy luận từ khỉ sang người, chưa được kiểm chứng ở trang này.
  loai: loi-khuyen
- trang: thi-nghiem/harlow
  id: n40
  cau: "Một cách đọc theo nghĩa bóng: mẹ vải mềm ấm được khỉ con chọn hơn mẹ lưới thép có sữa; không phải kết luận khoa học về các mối quan hệ của người."
  loai: loi-khuyen
- trang: thi-nghiem/harlow
  id: n41
  cau: Trong thuyết gắn bó (Bowlby, theo OpenStax), người chăm sóc là căn cứ an toàn để trẻ khám phá.
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n42
  cau: Đừng biến Harlow thành cớ để cực đoan ("bú bình là thiếu tình cảm", "mẹ đi làm là bỏ con"); dữ liệu nói về khỉ con và nhu cầu tiếp xúc.
  loai: loi-khuyen
- trang: thi-nghiem/harlow
  id: n43
  cau: Tính đến 10/2026, chúng tôi chưa tìm thấy nghiên cứu tương tự trên linh trưởng hay trên trẻ em Việt Nam.
  loai: thoi-su
- trang: thi-nghiem/harlow
  id: n44
  cau: Quan sát văn hóa về cách chăm trẻ truyền thống của Việt Nam (bế ẵm nhiều, ru ngủ, ngủ chung) và khoảng trống nghiên cứu ở các cơ sở chăm sóc trẻ mồ côi, khuyết tật.
  loai: thoi-su
- trang: thi-nghiem/harlow
  id: n45
  cau: Harlow (1958) viết rằng tình cảm của khỉ con với mẹ thật và mẹ vải "có vẻ rất giống nhau", dựa trên quan sát hai khỉ con do mẹ thật nuôi, và hy vọng kiểm tra chắc chắn vào năm sau.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n46
  cau: Harlow cho rằng sẽ còn các biến số khác quan trọng (nâng đỡ tư thế, chuyển động đung đưa, âm thanh, thị giác).
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n47
  cau: "Quiz 1: Harlow loại trừ khả năng khỉ chỉ bám bên có sữa bằng cách chia 8 khỉ con thành hai nhóm: 4 bú mẹ vải, 4 bú mẹ lưới thép; kết quả hai nhóm tương tự."
  loai: so-lieu
- trang: thi-nghiem/harlow
  id: n48
  cau: "Quiz 2: khỉ con dành phần lớn thời gian bên mẹ vải bất kể sữa ở mẹ nào; thời gian trên mẹ lưới thép giảm dần theo tuổi với những khỉ bú mẹ lưới thép."
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n49
  cau: "Quiz 3: khi bị làm sợ, khỉ con ưa mẹ vải hơn rõ rệt, kể cả khi sữa ở mẹ lưới thép."
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n50
  cau: 'Quiz 4: "contact comfort" là biến số tình cảm quan trọng áp đảo, còn việc cho bú là không đáng kể.'
  loai: dinh-nghia
- trang: thi-nghiem/harlow
  id: n51
  cau: "Quiz 5: giáo trình mở nói các thí nghiệm của Harlow ngày nay bị xem là phi đạo đức; công trình sau này (cô lập hoàn toàn, thí nghiệm gây trầm cảm) bị chỉ trích dữ dội."
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n52
  cau: 'Hình "harlow-contact" (biểu đồ cột, đã sửa): số giờ trung bình mỗi ngày trên hai mẹ giả lúc 21–25 ngày tuổi, hai nhóm 4 khỉ (sữa ở mẹ vải; sữa ở mẹ lưới thép); "dù sữa ở mẹ nào, khỉ con ở trên mẹ vải phần lớn thời gian trong ngày"; số đọc gần đúng từ Hình 5 của Harlow (1958).'
  loai: so-lieu
- trang: thi-nghiem/harlow
  id: n56
  cau: "Hình harlow-contact: nhóm có sữa ở mẹ vải, lúc 21–25 ngày tuổi, ở trên mẹ vải khoảng 19 giờ mỗi ngày."
  loai: so-lieu
- trang: thi-nghiem/harlow
  id: n57
  cau: "Hình harlow-contact: nhóm có sữa ở mẹ vải ở trên mẹ lưới thép dưới 1 giờ mỗi ngày."
  loai: so-lieu
- trang: thi-nghiem/harlow
  id: n58
  cau: "Hình harlow-contact: nhóm có sữa ở mẹ lưới thép, lúc 21–25 ngày tuổi, ở trên mẹ vải khoảng 16 giờ mỗi ngày."
  loai: so-lieu
- trang: thi-nghiem/harlow
  id: n59
  cau: "Hình harlow-contact: nhóm có sữa ở mẹ lưới thép, lúc 21–25 ngày tuổi, ở trên mẹ lưới thép khoảng 2 giờ mỗi ngày."
  loai: so-lieu
- trang: thi-nghiem/harlow
  id: n60
  cau: "Hình harlow-contact: mỗi nhóm 4 khỉ."
  loai: so-lieu
- trang: thi-nghiem/bandura
  id: n1
  cau: Bandura, Ross & Ross (1961) cho trẻ xem người lớn đánh búp bê Bobo; trẻ bắt chước gây hấn nhiều hơn hẳn nhóm xem người lớn chơi hiền lành và nhóm không xem gì.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n2
  cau: Búp bê trong thí nghiệm là búp bê bơm hơi cao khoảng 1,5 mét (Bobo).
  loai: so-lieu
- trang: thi-nghiem/bandura
  id: n3
  cau: "Hầu hết trẻ xem mẫu gây hấn thực hiện các hành vi gây hấn lạ của người mẫu: ngồi lên búp bê rồi đấm vào mũi, đập búa lên đầu, tung lên và đá, và lặp lại những câu người lớn hét."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n4
  cau: Trẻ xem mẫu hiền lành và trẻ không xem gì hầu như không làm những hành vi bắt chước ấy.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n5
  cau: "Trẻ học những hành vi ấy chỉ bằng cách nhìn: không ai thưởng hay phạt người mẫu hay trẻ."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n6
  cau: Đầu những năm 1960, nhiều nghiên cứu về học xã hội tập trung vào việc định hình hành vi bằng thưởng và phạt.
  loai: lich-su
- trang: thi-nghiem/bandura
  id: n7
  cau: Albert Bandura là nhà nghiên cứu tại Đại học Stanford và cho rằng hành vi mới còn có thể được học bằng quan sát.
  loai: lich-su
- trang: thi-nghiem/bandura
  id: n8
  cau: "Thí nghiệm Bobo là một trong những minh chứng nổi tiếng nhất cho học quan sát và gắn với câu hỏi còn tranh luận: trẻ bắt chước người lớn đánh búp bê thì có bắt chước bạo lực trên màn hình thành bạo lực thật không."
  loai: lich-su
- trang: thi-nghiem/bandura
  id: n9
  cau: 72 trẻ (36 trai, 36 gái) từ 37 đến 69 tháng tuổi, trung bình 52 tháng, ở trường mầm non của Đại học Stanford.
  loai: so-lieu
- trang: thi-nghiem/bandura
  id: n10
  cau: "Có ba nhóm, mỗi nhóm 24 trẻ: xem người lớn gây hấn, xem người lớn chơi hiền lành, và không xem gì (đối chứng)."
  loai: so-lieu
- trang: thi-nghiem/bandura
  id: n11
  cau: Người mẫu hiền lành lắp ráp đồ chơi, không động đến búp bê; người mẫu gây hấn lắp ráp khoảng một phút rồi dành thời gian còn lại gây hấn với búp bê, vừa làm vừa la những câu như "Sock him in the nose".
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n12
  cau: Trẻ được ghép theo mức gây hấn do giáo viên đánh giá từ trước rồi chia ngẫu nhiên vào các nhóm.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n13
  cau: Ở mỗi nhóm có mẫu, một nửa trẻ xem mẫu cùng giới, một nửa xem mẫu khác giới.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n14
  cau: Lúc xem, trẻ làm tranh dán ở một góc phòng, người mẫu chơi ở góc đối diện trong 10 phút.
  loai: so-lieu
- trang: thi-nghiem/bandura
  id: n15
  cau: 'Sau lần xem (hay không xem), mọi trẻ đều bị "gây bực" nhẹ: được cho chơi đồ chơi hấp dẫn rồi bị bảo đó là đồ chơi tốt nhất, để dành cho trẻ khác.'
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n16
  cau: Mục đích bước này là để mọi trẻ ở trong tình huống bị kích động gây hấn nhẹ.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n17
  cau: Mỗi trẻ ở 20 phút trong phòng có búp bê Bobo, búa gỗ, súng phóng phi tiêu và nhiều đồ chơi không gây hấn; một nữ nhà nghiên cứu ngồi làm giấy tờ ở góc phòng.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n18
  cau: Quan sát viên ghi hành vi qua kính một chiều theo từng khoảng 5 giây; một người chấm cho cả 72 trẻ, người thứ hai chấm độc lập một nửa số trẻ; hệ số tương quan giữa hai người chấm nằm trong khoảng 0,90.
  loai: so-lieu
- trang: thi-nghiem/bandura
  id: n19
  cau: Vì trẻ xem mẫu gây hấn làm những hành vi đặc trưng, người chấm khó mà không đoán được nhóm của trẻ.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n20
  cau: Trẻ xem mẫu gây hấn bắt chước hành vi và lời nói gây hấn nhiều hơn hẳn hai nhóm còn lại; khác biệt có ý nghĩa thống kê.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n21
  cau: Khoảng một phần ba trẻ xem mẫu gây hấn cũng nhắc lại các câu không gây hấn của mẫu, trong khi không trẻ nào ở hai nhóm kia làm vậy.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n22
  cau: Trong nhóm xem mẫu gây hấn, bé trai bắt chước gây hấn thể chất nhiều hơn bé gái (t = 2,50, p < 0,01), còn lời nói gây hấn thì hai giới không khác nhau.
  loai: so-lieu
- trang: thi-nghiem/bandura
  id: n23
  cau: 'Giả thuyết "trẻ bắt chước mẫu cùng giới nhiều hơn" chỉ được ủng hộ một phần: ảnh hưởng của mẫu nam rõ hơn mẫu nữ.'
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n24
  cau: Bé trai xem mẫu nam gây hấn thể chất và lời nói nhiều hơn bé gái xem mẫu nam; ở nhóm xem mẫu nữ, các chênh lệch không đạt ý nghĩa thống kê (mỗi ô chỉ có 6 trẻ).
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n25
  cau: Nhóm xem mẫu hiền lành và nhóm đối chứng nhìn chung không khác nhau; riêng trẻ xem mẫu hiền lành là nam ít gây hấn hơn nhóm đối chứng trên vài thước đo, nhưng đó là so sánh nhóm con mà các tác giả lưu ý dễ do ngẫu nhiên.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n26
  cau: "Năm 1963, nhóm Bandura thử với 96 trẻ (48 trai, 48 gái), mỗi nhóm 24 trẻ, chia bốn nhóm: xem người thật gây hấn, xem chính những người đó gây hấn trên phim, xem nhân vật hoạt hình gây hấn trên phim, và nhóm đối chứng."
  loai: so-lieu
- trang: thi-nghiem/bandura
  id: n27
  cau: Cả ba nhóm xem mẫu gây hấn nhiều hơn nhóm đối chứng (nhóm xem phim và phim hoạt hình gần gấp đôi); mức bắt chước không khác đáng kể giữa người thật và phim người thật.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n28
  cau: Nghiên cứu năm 1963 nối thí nghiệm Bobo với câu hỏi về bạo lực trên màn hình.
  loai: lich-su
- trang: thi-nghiem/bandura
  id: n29
  cau: Năm 1965, trẻ xem người mẫu gây hấn được thưởng hay bị phạt vì hành vi ấy, rồi có cơ hội tái hiện.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n30
  cau: Thưởng phạt dành cho mẫu ảnh hưởng đến việc trẻ thể hiện hành vi; thưởng ngay lúc quan sát không cần thiết để trẻ học hành vi mới.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n31
  cau: Theo tóm tắt, hiệu ứng của thưởng phạt mẫu chủ yếu đến từ sự khác nhau giữa các nhóm bé gái.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n32
  cau: Hình phạt dành cho mẫu ảnh hưởng chủ yếu đến việc trẻ thể hiện hành vi đã học, không quyết định việc học.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n33
  cau: "Khá vững: con người, kể cả trẻ nhỏ, có thể học hành vi mới chỉ bằng quan sát, không cần tự mình được thưởng hay phạt."
  loai: nhan
- trang: thi-nghiem/bandura
  id: n34
  cau: "Khá vững: bé trai bắt chước gây hấn thể chất nhiều hơn bé gái, và mẫu nam có ảnh hưởng rõ hơn mẫu nữ."
  loai: nhan
- trang: thi-nghiem/bandura
  id: n35
  cau: "Đang tranh cãi: từ kết quả có suy ra được bạo lực truyền thông gây bạo lực thật không."
  loai: nhan
- trang: thi-nghiem/bandura
  id: n36
  cau: "Anderson và cộng sự (2010): phân tích tổng hợp về trò chơi điện tử bạo lực, so sánh Nhật Bản với các nước phương Tây, kết luận đó là yếu tố nguy cơ nhân quả làm tăng hành vi, nhận thức và cảm xúc gây hấn, và ít thấy dấu hiệu thiên lệch xuất bản."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n37
  cau: "Ferguson và Kilburn (2010) phản biện: phân tích ấy gộp nhiều nghiên cứu không liên quan tới gây hấn nghiêm trọng, một mẫu nghiên cứu chưa công bố dường như thiên lệch, và dựa vào thước đo gây hấn không chuẩn hóa làm phồng hiệu ứng; ước lượng r = 0,15 vẫn chỉ là hiệu ứng yếu."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n38
  cau: Cả hai bài bàn về trò chơi điện tử, không phải về thí nghiệm Bobo; thí nghiệm Bobo cho thấy trẻ có thể học hành vi gây hấn từ quan sát, còn tác động lên bạo lực ngoài đời là câu hỏi riêng, còn tranh luận.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n39
  cau: "Bốn bước của việc học theo mẫu (Bandura mô tả, theo OpenStax): chú ý, ghi nhớ, tái hiện, động cơ; theo giáo trình, đó là các bước phải có thì việc học theo mẫu mới thành công."
  loai: dinh-nghia
- trang: thi-nghiem/bandura
  id: n40
  cau: Bandura và cộng sự cho rằng việc bắt chước có thể đi tắt việc củng cố từng bước.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n41
  cau: "Củng cố gián tiếp: thấy người khác được thưởng thì muốn làm theo, thấy bị phạt thì dè chừng, nhưng dè chừng không có nghĩa là không học."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n42
  cau: Các tác giả giả thuyết rằng gây hấn là hành vi "nam tính" hơn nên bé trai dễ bắt chước hơn, nhất là từ mẫu nam; thí nghiệm chỉ ủng hộ một phần.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n43
  cau: Thí nghiệm cho thấy trẻ có thể tái hiện hành vi của người lớn khi không ai thưởng hay bảo làm theo; nếu người lớn quát tháo, trẻ có thể học theo điều thấy.
  loai: loi-khuyen
- trang: thi-nghiem/bandura
  id: n44
  cau: Mẫu trên phim cũng làm tăng gây hấn ở trẻ trong phòng thí nghiệm (1963), nên nên để ý những "người mẫu" của con.
  loai: loi-khuyen
- trang: thi-nghiem/bandura
  id: n45
  cau: Trẻ xem người lớn chơi hiền lành không gây hấn nhiều hơn trẻ không xem gì (có thể ít hơn khi mẫu là nam); cho trẻ thấy người lớn xử lý bực bội bình tĩnh là một cách dạy khả dĩ, nhưng thí nghiệm không đo trực tiếp điều đó.
  loai: loi-khuyen
- trang: thi-nghiem/bandura
  id: n46
  cau: Vì trẻ có thể học từ mẫu trên phim, chọn nội dung và trò chuyện cùng trẻ về những gì chúng xem là hợp lý; thí nghiệm không cho biết tác động lên hành vi ngoài đời.
  loai: loi-khuyen
- trang: thi-nghiem/bandura
  id: n47
  cau: Tính đến 10/2026, chúng tôi chưa tìm thấy bản lặp lại thí nghiệm Bobo trên trẻ em Việt Nam, và cũng chưa tìm thấy dữ liệu thực nghiệm về mức độ trẻ Việt bắt chước hành vi gây hấn từ người mẫu.
  loai: thoi-su
- trang: thi-nghiem/bandura
  id: n48
  cau: Anderson và cộng sự (2010) so sánh Nhật Bản với các nước phương Tây và không báo cáo riêng mẫu Việt Nam.
  loai: thoi-su
- trang: thi-nghiem/bandura
  id: n49
  cau: Việc áp dụng kết luận của phân tích tổng hợp vào bối cảnh Việt Nam cần thận trọng và cần nghiên cứu trong nước.
  loai: loi-khuyen
- trang: thi-nghiem/bandura
  id: n50
  cau: "Thí nghiệm không chứng minh xem phim bạo lực sẽ thành người bạo lực: nó cho thấy trẻ có thể học hành vi gây hấn qua quan sát trong phòng thí nghiệm; khoảng cách tới bạo lực thật đang được tranh luận."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n51
  cau: Bài báo cho biết trẻ có thể đấm búp bê Bobo dù không xem mẫu nào, nên các tác giả chỉ tính là bắt chước những hành vi lạ; việc đấm búp bê nói chung không khác nhau giữa các nhóm.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n52
  cau: Chính bài báo nêu rằng việc thấy người lớn gây hấn có thể báo hiệu rằng gây hấn được phép, làm yếu sự kìm nén; nhưng trẻ lặp lại cả những cử chỉ lạ của mẫu, cho thấy có học theo mẫu.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n53
  cau: Bandura "chủ trương cấm trẻ xem mọi thứ bạo lực" (câu ngộ nhận cũ).
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n54
  cau: "Quiz, câu 1: 72 trẻ (36 trai, 36 gái, tuổi mẫu giáo), ba nhóm: xem mẫu gây hấn, mẫu hiền lành, đối chứng không xem gì."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n55
  cau: "Quiz, câu 2: mọi trẻ được kích động gây hấn nhẹ trước khi thử; bài báo nêu hai lý do: xem người khác gây hấn có thể làm người xem bớt muốn gây hấn, và nếu nhóm xem mẫu hiền lành vẫn ít gây hấn dù bị kích động thì gợi ý có sự kìm nén."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n56
  cau: "Quiz, câu 3: bé trai bắt chước gây hấn thể chất nhiều hơn bé gái, ảnh hưởng của mẫu nam rõ hơn mẫu nữ; giả thuyết mẫu cùng giới chỉ được ủng hộ một phần."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n57
  cau: "Quiz, câu 4: thưởng phạt dành cho mẫu ảnh hưởng chủ yếu đến việc thể hiện; thưởng ngay lúc quan sát không cần thiết để học hành vi mới; trẻ thấy mẫu bị phạt có thể vẫn tiếp thu hành vi dù không thể hiện."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n58
  cau: "Quiz, câu 5: muốn con bớt quát tháo, cha mẹ tập bình tĩnh khi bực trước mặt con; phạt chủ yếu ảnh hưởng việc thể hiện hơn việc học; đây là suy ra từ cơ chế, thí nghiệm không thử cách dạy con."
  loai: loi-khuyen
