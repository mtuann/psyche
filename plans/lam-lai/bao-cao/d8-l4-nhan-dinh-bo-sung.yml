- trang: them/nghien-cuu-moi
  id: z3
  cau: "Ở người từ 65 tuổi trở lên, hiệu quả có ý nghĩa thống kê (g = 0,33; khoảng
    tin cậy 95%: 0,14–0,51), còn ở nhóm 18–65 tuổi (chỉ 4 thử nghiệm) thì chưa
    đạt ý nghĩa thống kê; tác giả đọc đây là lợi ích lớn hơn ở người cao tuổi,
    nhưng khi chính bài kiểm định ảnh hưởng của tuổi bằng hồi quy tổng hợp
    (meta-regression), khác biệt giữa hai nhóm tuổi không có ý nghĩa thống kê (p
    = 0,69). Ở người có bệnh, g = 0,28; các chương trình dài 13–26 tuần có hiệu
    quả có ý nghĩa thống kê (g = 0,21)."
  loai: so-lieu
- trang: them/nghien-cuu-moi
  id: z6
  cau: Theo các mốc Cohen (1988), chúng tôi đọc g = 0,32 là hiệu quả nhỏ; tác giả
    thì gọi đây là hiệu quả mức vừa (moderate).
  loai: phat-hien
