- trang: thi-nghiem/keo-deo
  id: n5
  cau: "Hãy tưởng tượng: người lớn nói trẻ 4 tuổi rằng chờ mà không ăn thì được hai viên, ăn ngay thì chỉ được một viên."
  loai: phat-hien
  nguon:
    - ten: "Watts, Duncan & Quan (2018), Psychol Sci 29(7), 1159–1177: toàn văn (bản PDF ở gwern.net)"
      link: https://doi.org/10.1177/0956797618761661
  ket_qua_luot_1: dung
  ghi_chu: 'gia-dinh: tình huống minh họa theo bài chờ "chờ để được thêm một phần" của NICHD (Watts 2018, mục Method), không phải mô tả bài 1972. Không còn nói "15 năm sau" và "sự nghiệp" trong câu hỏi.'
