- trang: thi-nghiem/little-albert
  id: n60
  cau: "Quiz, câu 3: Albert còn né thỏ, chó, áo lông hải cẩu, mặt nạ ông già Noel, ở buổi đầu chưa đi kèm tiếng động; bé vẫn chơi khối gỗ bình thường; phân tích 2021 cho rằng bằng chứng yếu."
  loai: phat-hien
  nguon:
    - ten: "Watson & Rayner (1920), J Exp Psychol 3(1), 1–14: toàn văn (psychclassics.yorku.ca)"
      link: https://doi.org/10.1037/h0069608
    - ten: "Powell & Schmaltz (2021), Hist Psychol 24(2), 164–181: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1037/hop0000176
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: đáp án "Thỏ, chó, áo lông thú, mặt nạ râu tóc — những vật bé chưa từng bị dọa cùng tiếng động"; giải thích "càng giống (có lông, mềm), càng dễ gợi sợ": bỏ (xem n44). Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); khối gỗ "Played readily with them".'
- trang: thi-nghiem/harlow
  id: n27
  cau: '"IACUC, nguyên tắc 3R ra đời chính vì các thí nghiệm này": đã bỏ.'
  loai: lich-su
  nguon: []
  ket_qua_luot_1: da-bo
  ghi_chu: 'Chữ cũ: "chính chúng là lý do các quy định đạo đức trong nghiên cứu động vật (hội đồng IACUC, nguyên tắc 3R) ra đời và siết chặt về sau". Khẳng định nhân quả lịch sử không có nguồn; bỏ cả ở quiz. Câu chuẩn mực chung giữ: "Theo chuẩn mực ngày nay, nghiên cứu trên động vật phải qua hội đồng đạo đức và giảm thiểu đau đớn" (kiểm ở nhận định chuẩn mực; chưa có nguồn: gia-dinh/đạo đức).'
