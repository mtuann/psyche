- trang: bang-chung/phan-tich-tong-hop
  id: pt1
  cau: Một thí nghiệm đơn lẻ, dù nổi tiếng, khó trả lời trọn vẹn câu hỏi "hiệu ứng người ngoài cuộc có thật không"; gộp nhiều nghiên cứu lại là cách thường dùng để có một ước lượng chính xác hơn.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt2
  cau: Năm 2011, Fischer và cộng sự gộp các nghiên cứu về hiệu ứng người ngoài cuộc mà họ tìm được, từ thập niên 1960 đến năm 2010.
  loai: phat-hien
- trang: bang-chung/phan-tich-tong-hop
  id: pt3
  cau: Phân tích của Fischer và cộng sự gồm 105 hiệu ứng độc lập từ 53 bài báo, với hơn 7.700 người tham gia.
  loai: so-lieu
- trang: bang-chung/phan-tich-tong-hop
  id: pt4
  cau: Độ lớn gộp của hiệu ứng người ngoài cuộc là g = −0,35 (mô hình hiệu ứng cố định).
  loai: so-lieu
- trang: bang-chung/phan-tich-tong-hop
  id: pt5
  cau: Kỹ thuật đằng sau con số đó có tên là phân tích tổng hợp.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt6
  cau: Cochrane Handbook nhấn mạnh rằng phân tích tổng hợp có thể gây hiểu lầm nghiêm trọng nếu thiếu chú ý đến thiết kế nghiên cứu, thiên lệch trong từng nghiên cứu, khác biệt giữa các nghiên cứu và thiên lệch khi báo cáo.
  loai: phat-hien
- trang: bang-chung/phan-tich-tong-hop
  id: pt8
  cau: Phân tích tổng hợp là kỹ thuật thống kê gộp kết quả của hai hay nhiều nghiên cứu riêng lẻ thành một ước lượng chung.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt9
  cau: Cách phổ biến là gộp kết quả đã tóm tắt của từng nghiên cứu (độ lớn hiệu ứng và sai số của nó), không phải dữ liệu thô của từng người; cũng có loại phân tích dùng dữ liệu thô của từng người tham gia.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt10
  cau: "Ước lượng chung là một trung bình có trọng số: ước lượng của nghiên cứu lớn, chính xác hơn được tính nặng hơn ước lượng của nghiên cứu nhỏ."
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt11
  cau: Cách đếm xem bao nhiêu nghiên cứu "nói có" (đếm phiếu theo ý nghĩa thống kê) bị Cochrane Handbook coi là có hạn chế nghiêm trọng và không chấp nhận được.
  loai: phat-hien
- trang: bang-chung/phan-tich-tong-hop
  id: pt12
  cau: Phân tích tổng hợp quy kết quả của mỗi nghiên cứu về cùng một thước đo, gọi là độ lớn hiệu ứng, rồi tính trung bình có trọng số.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt13
  cau: Kết quả là một ước lượng chung kèm khoảng tin cậy, cho biết ước lượng ấy chính xác đến mức nào.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt14
  cau: Kết quả của phân tích tổng hợp thường được vẽ thành forest plot (biểu đồ rừng), hiển thị ước lượng hiệu ứng và khoảng tin cậy của từng nghiên cứu và của ước lượng gộp.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt15
  cau: Trên forest plot, mỗi dòng ngang là một nghiên cứu; điểm (khối vuông) là hiệu ứng nghiên cứu đó ước lượng; đường ngang hai bên là khoảng tin cậy.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt16
  cau: Khoảng tin cậy là dải hiệu ứng tương thích với kết quả của nghiên cứu.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt17
  cau: Với các thước đo dạng chênh lệch (như g), giá trị 0 nghĩa là không có chênh lệch giữa hai nhóm; trên forest plot, vạch thẳng đứng ở số 0 là vạch "không có hiệu ứng".
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt18
  cau: 'Nếu khoảng tin cậy của một nghiên cứu cắt qua vạch 0, "không có hiệu ứng" vẫn nằm trong các giá trị tương thích với kết quả đó: riêng nghiên cứu ấy chưa đủ để khẳng định có hiệu ứng, và cũng chưa đủ để khẳng định không có.'
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt19
  cau: Hình thoi (kim cương) ở dòng cuối của forest plot là ước lượng gộp.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt20
  cau: "Độ rộng của hình thoi cho biết ước lượng gộp chính xác đến đâu: càng hẹp, ước lượng càng chính xác."
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt22
  cau: g là chênh lệch trung bình giữa hai nhóm chia cho độ lệch chuẩn gộp, có hiệu chỉnh cho mẫu nhỏ; trong phân tích của Fischer, g là nhóm có người khác chứng kiến trừ nhóm không có.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt23
  cau: Dấu âm của g nghĩa là có người khác chứng kiến thì người ta giúp ít hơn, đúng hướng lý thuyết dự đoán; dấu chỉ cho biết chiều.
  loai: phat-hien
- trang: bang-chung/phan-tich-tong-hop
  id: pt24
  cau: Theo quy ước của Cohen (1988), d khoảng 0,2 gọi là nhỏ, khoảng 0,5 là trung bình.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt25
  cau: Fischer và cộng sự gọi g = −0,35 là hiệu ứng nhỏ đến vừa.
  loai: phat-hien
- trang: bang-chung/phan-tich-tong-hop
  id: pt26
  cau: Các mốc nhỏ, trung bình, lớn của Cohen mang tính quy ước, không nên áp dụng cứng nhắc.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt27
  cau: 'g không phải là xác suất: g = −0,35 không có nghĩa là "35% người sẽ bỏ đi".'
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt29
  cau: Trong phân tích của Fischer, hiệu ứng người ngoài cuộc yếu đi khi tình huống được cảm nhận là nguy hiểm, khi có kẻ gây hại có mặt, và khi cái giá của việc can thiệp là rủi ro thể chất.
  loai: phat-hien
- trang: bang-chung/phan-tich-tong-hop
  id: pt30
  cau: Trong một số tình huống nguy hiểm, có thêm người chứng kiến thậm chí đi kèm với giúp đỡ nhiều hơn.
  loai: phat-hien
- trang: bang-chung/phan-tich-tong-hop
  id: pt31
  cau: Phân tích tổng hợp không chỉ cho một con số chung, mà còn cho thấy khi nào hiệu ứng mạnh, khi nào yếu, nhờ kiểm định các yếu tố điều chỉnh.
  loai: phat-hien
- trang: bang-chung/phan-tich-tong-hop
  id: pt32
  cau: Các yếu tố điều chỉnh trong phân tích của Fischer là biến được mã hóa lại từ các nghiên cứu cũ, nên việc so sánh giữa chúng là so sánh giữa các nghiên cứu, không phải thí nghiệm mới cho riêng từng yếu tố.
  loai: phat-hien
- trang: bang-chung/phan-tich-tong-hop
  id: pt33
  cau: Các hiệu ứng trong phân tích của Fischer đến từ nhiều thập niên nghiên cứu và nhiều loại tình huống, từ làm rơi bút đến một vụ trộm có kẻ gây hại có mặt.
  loai: phat-hien
- trang: bang-chung/phan-tich-tong-hop
  id: pt34
  cau: Sự dao động giữa các nghiên cứu gọi là tính không đồng nhất (heterogeneity).
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt35
  cau: Một phần dao động giữa các nghiên cứu là do may rủi lấy mẫu; nếu dao động lớn hơn mức may rủi có thể giải thích, đó là dấu hiệu các nghiên cứu không cùng ước lượng một hiệu ứng, có thể do khác biệt về người tham gia, tình huống hay phương pháp.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt36
  cau: Trong phân tích của Fischer, kiểm định cho thấy dao động giữa các hiệu ứng vượt mức may rủi, nên các tác giả đi tìm các yếu tố điều chỉnh như mức nguy hiểm.
  loai: phat-hien
- trang: bang-chung/phan-tich-tong-hop
  id: pt37
  cau: Tính không đồng nhất không phải lỗi mà có thể là manh mối, nhưng việc tìm nguyên nhân của nó là so sánh giữa các nghiên cứu nên cần thận trọng khi đọc.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt38
  cau: Các nghiên cứu có kết quả "có ý nghĩa thống kê" dễ được công bố và dễ được tìm thấy hơn các nghiên cứu "không có ý nghĩa thống kê".
  loai: phat-hien
- trang: bang-chung/phan-tich-tong-hop
  id: pt39
  cau: Funnel plot (biểu đồ phễu) là biểu đồ phân tán ước lượng hiệu ứng của từng nghiên cứu theo thước đo kích thước hay độ chính xác của nghiên cứu đó.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt40
  cau: Trên funnel plot, mỗi chấm là một nghiên cứu, trục ngang là hiệu ứng đo được, trục dọc là độ chính xác (nghiên cứu càng lớn, chấm càng cao).
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt41
  cau: "Nghiên cứu nhỏ cho ước lượng dao động rộng hơn nghiên cứu lớn, nên bình thường các chấm xếp thành hình phễu đối xứng: nghiên cứu lớn chụm lại gần đáp án ở đỉnh, nghiên cứu nhỏ tỏa rộng ở đáy."
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt42
  cau: Nếu một góc đáy phễu trống, ví dụ do thiếu các nghiên cứu nhỏ không có ý nghĩa thống kê, thì có thể các nghiên cứu đó đã được làm nhưng chưa được công bố; khi đó ước lượng gộp có xu hướng phóng đại hiệu ứng.
  loai: phat-hien
- trang: bang-chung/phan-tich-tong-hop
  id: pt43
  cau: "Phễu lệch chỉ là một dấu hiệu: nó cũng có thể do các lý do khác ngoài thiên lệch xuất bản (Cochrane gọi chung là hiệu ứng nghiên cứu nhỏ)."
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt44
  cau: Trong phân tích của Fischer, đồ thị phễu tương đối đối xứng, và thử trim-and-fill không đổi ước lượng.
  loai: phat-hien
- trang: bang-chung/phan-tich-tong-hop
  id: pt46
  cau: Gộp càng nhiều dữ liệu, ước lượng càng chính xác.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt47
  cau: Khi chỉ có vài nghiên cứu nhỏ, mức dao động giữa các nghiên cứu được ước lượng rất kém và khoảng tin cậy có thể sai.
  loai: phat-hien
- trang: bang-chung/phan-tich-tong-hop
  id: pt48
  cau: Nếu khoảng tin cậy gộp cắt qua vạch 0, ước lượng gộp chưa loại trừ được "không có hiệu ứng".
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt49
  cau: Cochrane khuyến nghị chỉ gộp khi người tham gia, can thiệp, so sánh và kết quả đo đủ giống nhau để cho một con số có nghĩa.
  loai: loi-khuyen
- trang: bang-chung/phan-tich-tong-hop
  id: pt50
  cau: Phễu lệch chưa chứng minh có thiên lệch xuất bản.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt51
  cau: Cochrane khuyến nghị định trước (trong đề cương) việc điều tra mối liên hệ giữa đặc điểm nghiên cứu và độ lớn hiệu ứng, tức các phân tích nhóm con.
  loai: loi-khuyen
- trang: bang-chung/phan-tich-tong-hop
  id: pt52
  cau: "Phân tích tổng hợp chỉ tốt bằng các nghiên cứu nó gộp vào và cách chọn chúng: kết quả có thể gây hiểu lầm nếu thiếu chú ý đến câu hỏi, tiêu chí chọn nghiên cứu, thiên lệch trong từng nghiên cứu và các bước khác trước khi gộp."
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt53
  cau: Phân tích tổng hợp gộp kết quả theo trọng số, và kết luận chỉ đáng tin bằng chất lượng các nghiên cứu được gộp.
  loai: nhan
- trang: bang-chung/phan-tich-tong-hop
  id: pt54
  cau: "Fischer và cộng sự (2011): hiệu ứng người ngoài cuộc có độ lớn gộp g = −0,35 và yếu đi khi nguy hiểm rõ ràng."
  loai: nhan
- trang: bang-chung/phan-tich-tong-hop
  id: pt57
  cau: Nghiên cứu nhỏ cho ước lượng dao động rộng hơn nghiên cứu lớn, nên một con số "khủng" từ nghiên cứu nhỏ cần dè dặt.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt58
  cau: Ba nghiên cứu giả định cho ba con số khác nhau, nhưng các khoảng tin cậy chồng lên nhau nhiều, nên hình chưa cho thấy dao động vượt mức may rủi.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt59
  cau: Khi khoảng tin cậy rộng và bao gồm cả "không có hiệu ứng", nhầm "chưa có bằng chứng về hiệu ứng" với "có bằng chứng là không có hiệu ứng" là một lỗi thường gặp.
  loai: phat-hien
- trang: bang-chung/phan-tich-tong-hop
  id: pt60
  cau: Một tin tức chỉ đưa tin nghiên cứu B sẽ ưu ái một nghiên cứu hơn các nghiên cứu còn lại mà không có lý do chính đáng.
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt61
  cau: 'Quiz 1: khi đường ngang (khoảng tin cậy) của một nghiên cứu cắt qua vạch 0, "không có hiệu ứng" vẫn nằm trong các giá trị tương thích với kết quả đó, nên riêng nó chưa đủ để khẳng định có hiệu ứng; nhưng cũng không chứng minh được hiệu ứng bằng 0.'
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt62
  cau: "Quiz 2: với phương pháp phương sai nghịch đảo, trọng số của mỗi nghiên cứu tỉ lệ nghịch với phương sai của ước lượng, nên nghiên cứu có sai số chuẩn nhỏ (thường là nghiên cứu lớn) được tính nặng hơn."
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt63
  cau: "Quiz 3: phễu khuyết một góc đáy có thể do thiếu các nghiên cứu nhỏ chưa được công bố, nhưng cũng có thể do các lý do khác; không chứng minh chắc chắn thiên lệch xuất bản."
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt64
  cau: "Thử suy ngẫm 2: funnel plot khuyết một góc có thể gợi ý các nghiên cứu nhỏ, không có kết quả nổi bật, chưa được công bố."
  loai: dinh-nghia
- trang: bang-chung/phan-tich-tong-hop
  id: pt65
  cau: "Thử suy ngẫm 3: phân tích của Fischer cho thấy hiệu ứng người ngoài cuộc yếu đi trong tình huống nguy hiểm."
  loai: phat-hien
- trang: bang-chung/thong-ke-mo-ta
  id: tk1
  cau: Tiêu đề "Năm 2024 thu nhập bình quân của người Việt tăng mạnh, đạt 5,4 triệu đồng" là của một bài đăng trên Vietstock ngày 19/5/2025.
  loai: lich-su
- trang: bang-chung/thong-ke-mo-ta
  id: tk2
  cau: Cục Thống kê công bố thông cáo báo chí về kết quả Khảo sát mức sống dân cư năm 2024 ngày 16/5/2025.
  loai: lich-su
- trang: bang-chung/thong-ke-mo-ta
  id: tk3
  cau: Theo Cục Thống kê, thu nhập bình quân đầu người mỗi tháng theo giá hiện hành năm 2024 đạt 5,4 triệu đồng, tăng 9,1% so với năm 2023.
  loai: so-lieu
- trang: bang-chung/thong-ke-mo-ta
  id: tk4
  cau: Nhóm 20% dân số có thu nhập cao nhất có thu nhập bình quân 11,8 triệu đồng/người/tháng; nhóm 20% dân số có thu nhập thấp nhất 1,6 triệu đồng/người/tháng; chênh nhau 7,4 lần.
  loai: so-lieu
- trang: bang-chung/thong-ke-mo-ta
  id: tk5
  cau: Tính từ số liệu trên, nhóm 20% dân số có thu nhập cao nhất chiếm khoảng 44% tổng thu nhập (11,8 × 20% ÷ 5,4), nhóm 20% thấp nhất khoảng 6% (1,6 × 20% ÷ 5,4).
  loai: so-lieu
- trang: bang-chung/thong-ke-mo-ta
  id: tk6
  cau: Tính đến 10/2026, thông cáo của Cục Thống kê và bài của Vietstock mà chúng tôi đọc đều không nêu trung vị thu nhập.
  loai: thoi-su
- trang: bang-chung/thong-ke-mo-ta
  id: tk7
  cau: Thống kê mô tả (descriptive statistics) là việc tổ chức và tóm tắt dữ liệu, bằng biểu đồ hoặc bằng các con số.
  loai: dinh-nghia
- trang: bang-chung/thong-ke-mo-ta
  id: tk8
  cau: Ba con số tóm tắt "trung tâm" của một dãy số là trung bình, trung vị và yếu vị; trung bình và trung vị được dùng rộng rãi nhất.
  loai: dinh-nghia
- trang: bang-chung/thong-ke-mo-ta
  id: tk9
  cau: Trung bình cộng là tổng tất cả các giá trị chia cho số lượng giá trị.
  loai: dinh-nghia
- trang: bang-chung/thong-ke-mo-ta
  id: tk10
  cau: Trong đời thường, người ta thường dùng từ "trung bình" (average) để chỉ trung bình cộng.
  loai: dinh-nghia
- trang: bang-chung/thong-ke-mo-ta
  id: tk11
  cau: Trung bình dùng mọi giá trị trong dãy số và nhạy với giá trị cực đoan; trung vị không bị giá trị cực đoan kéo đi.
  loai: dinh-nghia
- trang: bang-chung/thong-ke-mo-ta
  id: tk12
  cau: 'Ví dụ giáo trình: thị trấn 50 người, một người kiếm 5.000.000 USD mỗi năm và 49 người còn lại mỗi người kiếm 30.000 USD; trung bình là 129.400 USD, trung vị là 30.000 USD, và trung vị mô tả "trung tâm" tốt hơn.'
  loai: so-lieu
- trang: bang-chung/thong-ke-mo-ta
  id: tk13
  cau: "Trung vị là giá trị đứng ở chính giữa khi dãy số đã xếp theo thứ tự từ bé đến lớn: một nửa số giá trị nằm dưới nó, một nửa nằm trên nó; nếu dãy có số lượng chẵn, trung vị là trung bình của hai giá trị giữa."
  loai: dinh-nghia
- trang: bang-chung/thong-ke-mo-ta
  id: tk14
  cau: Nếu người kiếm nhiều nhất kiếm thêm nữa, trung vị vẫn không đổi.
  loai: dinh-nghia
- trang: bang-chung/thong-ke-mo-ta
  id: tk15
  cau: Yếu vị là giá trị xuất hiện nhiều lần nhất trong dãy số; một dãy số có thể có nhiều yếu vị nếu các giá trị đó cùng xuất hiện nhiều nhất.
  loai: dinh-nghia
- trang: bang-chung/thong-ke-mo-ta
  id: tk16
  cau: Yếu vị tính được cả cho dữ liệu phân loại; ví dụ trong dãy "đỏ, đỏ, đỏ, xanh lá, xanh lá, vàng", yếu vị là "đỏ".
  loai: dinh-nghia
- trang: bang-chung/thong-ke-mo-ta
  id: tk17
  cau: "Dãy 6, 7, 7, 8, 8, 9, 9, 10, 11, 60: trung bình là 13,5; trung vị là 8,5; yếu vị là 7, 8 và 9; số 60 một mình kéo trung bình cao hơn thu nhập của 9 trên 10 người; một nửa dãy dưới 8,5, một nửa trên."
  loai: so-lieu
- trang: bang-chung/thong-ke-mo-ta
  id: tk19
  cau: Phân phối đối xứng là phân phối mà hình bên trái và bên phải một đường thẳng đứng là ảnh phản chiếu của nhau; khi đó trung bình và trung vị xấp xỉ bằng nhau.
  loai: dinh-nghia
- trang: bang-chung/thong-ke-mo-ta
  id: tk20
  cau: Lệch phải là đuôi dài về phía giá trị lớn, lệch trái là đuôi dài về phía giá trị nhỏ; khi lệch phải trung bình thường lớn hơn trung vị, khi lệch trái trung bình thường nhỏ hơn trung vị.
  loai: dinh-nghia
- trang: bang-chung/thong-ke-mo-ta
  id: tk21
  cau: Đuôi lệch về phía nào, trung bình bị kéo về phía đó nhiều hơn trung vị; vì vậy khoảng cách giữa trung bình và trung vị gợi ý dữ liệu có lệch hay không.
  loai: dinh-nghia
- trang: bang-chung/thong-ke-mo-ta
  id: tk22
  cau: Trong phân phối lệch phải, ba con số thường xếp theo thứ tự yếu vị < trung vị < trung bình; đây là quy tắc thường đúng chứ không phải luật, và có thể sai, nhất là với dữ liệu rời rạc hay phân phối nhiều đỉnh.
  loai: phat-hien
- trang: bang-chung/thong-ke-mo-ta
  id: tk23
  cau: "Với dữ liệu đối xứng, không có giá trị quá khác biệt, thường dùng trung bình: nó dùng mọi giá trị, và ở phân phối đối xứng trung bình và trung vị gần như bằng nhau."
  loai: loi-khuyen
- trang: bang-chung/thong-ke-mo-ta
  id: tk24
  cau: Với dữ liệu lệch hoặc có giá trị cực đoan, thường dùng trung vị vì nó không bị vài giá trị rất lớn hay rất nhỏ kéo đi.
  loai: loi-khuyen
- trang: bang-chung/thong-ke-mo-ta
  id: tk25
  cau: Với dữ liệu phân loại, cần biết "cái nào phổ biến nhất" thì dùng yếu vị; trung bình của "màu sắc" là vô nghĩa.
  loai: loi-khuyen
- trang: bang-chung/thong-ke-mo-ta
  id: tk26
  cau: Muốn mô tả đầy đủ hơn thì nêu cả trung bình lẫn trung vị, vì khoảng cách giữa hai con số gợi ý dữ liệu có lệch hay không.
  loai: loi-khuyen
- trang: bang-chung/thong-ke-mo-ta
  id: tk27
  cau: Khi bài báo chỉ ghi "trung bình" mà không nói rõ, thường đó là trung bình cộng, con số nhạy với giá trị cực đoan.
  loai: loi-khuyen
- trang: bang-chung/thong-ke-mo-ta
  id: tk28
  cau: Nếu có vài giá trị rất lớn, trung bình bị kéo lên so với trung vị.
  loai: dinh-nghia
- trang: bang-chung/thong-ke-mo-ta
  id: tk29
  cau: Nếu bài báo chỉ có trung bình, ta chưa biết dữ liệu lệch đến đâu, vì khoảng cách giữa trung bình và trung vị gợi ý mức lệch.
  loai: loi-khuyen
- trang: bang-chung/thong-ke-mo-ta
  id: tk30
  cau: Thu nhập bình quân đầu người một tháng chia tổng thu nhập của hộ cho tổng dân số (kể cả trẻ em); thu nhập bình quân tháng của người lao động là một chỉ tiêu khác của cơ quan thống kê.
  loai: dinh-nghia
- trang: bang-chung/thong-ke-mo-ta
  id: tk31
  cau: Khi bài báo chỉ nêu trung bình, nên tìm xem có nêu trung vị hay phân phối (như các nhóm 20%) không; nếu không, ta chưa thể biết con số trung bình đại diện cho "người điển hình" đến đâu.
  loai: loi-khuyen
- trang: bang-chung/thong-ke-mo-ta
  id: tk32
  cau: Trung bình, trung vị và yếu vị mô tả các khía cạnh khác nhau của một dãy số; trung bình nhạy với giá trị cực đoan, trung vị thì không.
  loai: nhan
- trang: bang-chung/thong-ke-mo-ta
  id: tk33
  cau: Khi dữ liệu lệch phải, trung bình thường lớn hơn trung vị, và yếu vị thường nhỏ nhất.
  loai: nhan
- trang: bang-chung/thong-ke-mo-ta
  id: tk34
  cau: Giáo trình OpenStax nêu rõ quy tắc về trung bình và trung vị có ngoại lệ, và von Hippel (2005) cho thấy nó sai "với tần suất đáng ngạc nhiên", nhất là ở dữ liệu rời rạc.
  loai: phat-hien
- trang: bang-chung/thong-ke-mo-ta
  id: tk35
  cau: "Dãy 5, 6, 6, 7, 7, 8, 8, 9, 10, 80: trung bình 14,6; trung vị 7,5; yếu vị 6, 7 và 8; 9 trên 10 người kiếm từ 10 triệu trở xuống; người kiếm 80 triệu kéo trung bình lên gần gấp đôi trung vị."
  loai: so-lieu
- trang: bang-chung/thong-ke-mo-ta
  id: tk36
  cau: "Con số đúng về mặt tính toán vẫn có thể gây hiểu lầm nếu chọn sai con số để đưa tin: trung vị hợp hơn trung bình khi có giá trị cực đoan."
  loai: loi-khuyen
- trang: bang-chung/thong-ke-mo-ta
  id: tk37
  cau: 'Quiz 1: với dữ liệu lệch phải, trung bình thường lớn hơn trung vị vì đuôi dài kéo trung bình đi nhiều hơn; chữ "thường" quan trọng vì quy tắc có ngoại lệ.'
  loai: dinh-nghia
- trang: bang-chung/thong-ke-mo-ta
  id: tk38
  cau: "Quiz 2: yếu vị là giá trị xuất hiện nhiều nhất và tính được cả cho dữ liệu phân loại; trung bình cần cộng các giá trị, trung vị cần xếp dãy số theo thứ tự từ bé đến lớn, nên cả hai không hợp với màu sắc."
  loai: dinh-nghia
- trang: bang-chung/thong-ke-mo-ta
  id: tk39
  cau: "Quiz 3: trong nhóm 10 người, khi thu nhập của người kiếm nhiều nhất tăng gấp mười lần, trung bình tăng mạnh còn trung vị không đổi, vì trung vị chỉ phụ thuộc các giá trị ở giữa dãy đã xếp thứ tự, còn trung bình dùng mọi giá trị."
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl1
  cau: Báo cáo World Happiness Report 2024 được công bố ngày 20/3/2024, Ngày Quốc tế Hạnh phúc của Liên Hợp Quốc, và được báo đưa tin ngày 21/3/2024.
  loai: lich-su
- trang: bang-chung/do-luong
  id: dl2
  cau: Trong World Happiness Report 2024, Việt Nam xếp thứ 54 trên 143 quốc gia và vùng lãnh thổ, tăng 11 bậc so với năm 2023 (từ hạng 65).
  loai: so-lieu
- trang: bang-chung/do-luong
  id: dl3
  cau: Phần Lan đứng đầu bảng xếp hạng World Happiness Report 2024.
  loai: so-lieu
- trang: bang-chung/do-luong
  id: dl4
  cau: Bảng xếp hạng World Happiness Report dựa trên dữ liệu của Gallup World Poll.
  loai: phat-hien
- trang: bang-chung/do-luong
  id: dl5
  cau: "Gallup World Poll yêu cầu mỗi người đánh giá cuộc sống hiện tại của mình bằng hình ảnh một cái thang: bậc 10 là cuộc sống tốt nhất có thể đối với họ, bậc 0 là tồi tệ nhất."
  loai: phat-hien
- trang: bang-chung/do-luong
  id: dl6
  cau: Thứ hạng của mỗi nước dựa trên điểm trung bình của câu trả lời thang này trong ba năm (2021–2023).
  loai: phat-hien
- trang: bang-chung/do-luong
  id: dl7
  cau: Điểm của mỗi nước dựa trên câu trả lời cho một câu hỏi duy nhất (thang Cantril).
  loai: phat-hien
- trang: bang-chung/do-luong
  id: dl8
  cau: "Nhà nghiên cứu phải định nghĩa thao tác (operational definition) cho các khái niệm như hạnh phúc, lo âu, trí thông minh: mô tả chính xác điều mình đo và đo bằng cách nào, ví dụ qua điểm của một bài kiểm tra hay câu trả lời của một bảng hỏi."
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl9
  cau: "Mọi thang đo cần trả lời hai câu hỏi: độ tin cậy và độ giá trị."
  loai: phat-hien
- trang: bang-chung/do-luong
  id: dl10
  cau: Độ tin cậy (reliability) là khả năng cho cùng một kết quả một cách nhất quán; nếu đo đi đo lại mà kết quả lúc nào cũng khác nhau thì phép đo không đáng tin.
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl11
  cau: Test-retest là cho cùng một nhóm người làm bài test hai lần, cách nhau một khoảng thời gian; hệ số tương quan hai lần đo cho biết thang đo ổn định theo thời gian.
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl12
  cau: Nhất quán nội tại (internal consistency) là mức độ các câu hỏi cùng đo một thứ tương quan với nhau; nếu các câu hỏi của một thang đo gần như không liên hệ với nhau thì khó coi chúng cùng đo một thứ.
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl13
  cau: Ngoài test-retest và nhất quán nội tại còn có độ nhất quán giữa những người chấm (inter-rater reliability).
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl14
  cau: Độ giá trị (validity) là mức độ một công cụ đo chính xác điều nó được cho là đo.
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl15
  cau: "Tiêu chuẩn AERA, APA, NCME (2014): giá trị là mức độ bằng chứng và lý thuyết ủng hộ cách diễn giải điểm số cho một mục đích đã định; điều được đánh giá là cách diễn giải điểm số, không phải bản thân bài test."
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl16
  cau: "Ví dụ trong giáo trình OpenStax: một cân bếp không được hiệu chỉnh đúng có thể luôn báo thiếu hoặc thừa, nhưng cùng một lượng ngũ cốc luôn cho cùng một số; cân ấy rất tin cậy nhưng kết quả sai, tức không có giá trị."
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl17
  cau: "Một phép đo có giá trị thì nhất thiết tin cậy; ngược lại không đúng: một cái cân mỗi lần báo một số khác nhau không thể có giá trị."
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl18
  cau: "Độ tin cậy là điều kiện cần nhưng không đủ của độ giá trị: thang đo phải nhất quán thì mới có thể đo đúng, nhưng nhất quán chưa chắc đã đo đúng."
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl19
  cau: "Theo cách phân loại truyền thống mà ủy ban của APA nêu trong thập niên 1950, có bốn kiểu giá trị: dự đoán, đồng thời, nội dung và cấu trúc."
  loai: lich-su
- trang: bang-chung/do-luong
  id: dl20
  cau: Thuật ngữ giá trị cấu trúc (construct validity) xuất hiện trong báo cáo của Ủy ban Trắc nghiệm Tâm lý của APA (1950–1954), và Cronbach và Meehl (1955) trình bày cách hiểu của họ về nó.
  loai: lich-su
- trang: bang-chung/do-luong
  id: dl21
  cau: Tiêu chuẩn 2014 nói về các loại bằng chứng cho giá trị (như nội dung bài test, cấu trúc nội tại, quan hệ với các biến khác), chứ không nói về các kiểu giá trị riêng biệt.
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl22
  cau: Hệ số alpha do Lee Cronbach phát triển năm 1951, trong bài "Coefficient alpha and the internal structure of tests" trên tạp chí Psychometrika.
  loai: lich-su
- trang: bang-chung/do-luong
  id: dl23
  cau: Alpha là một con số từ 0 đến 1 tóm tắt độ nhất quán nội tại của một thang đo.
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl24
  cau: Các câu hỏi tương quan với nhau thì alpha tăng; alpha thấp có thể do ít câu hỏi, các câu ít liên hệ với nhau hoặc khái niệm nhiều mặt; alpha cũng phụ thuộc số câu hỏi, thang đo quá ngắn thì alpha giảm.
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl25
  cau: Giá trị alpha từ khoảng 0,70 đến 0,95 là khoảng được nhiều báo cáo coi là chấp nhận được.
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl26
  cau: Giá trị alpha dưới khoảng 0,70 thường bị coi là thấp; từ khoảng 0,70 trở lên được coi là mong muốn.
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl27
  cau: Alpha trên khoảng 0,90 đến 0,95 có thể do các câu hỏi lặp lại nhau một cách thừa thãi; mức tối đa 0,90 từng được khuyến nghị.
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl28
  cau: Khảo sát các bài báo giáo dục khoa học, Taber (2018) thấy cách gọi bằng lời cho từng mức alpha khác nhau rất nhiều giữa các nghiên cứu.
  loai: phat-hien
- trang: bang-chung/do-luong
  id: dl29
  cau: "Tiêu chuẩn 2014: cần độ tin cậy cao hơn với những cách dùng điểm số có hệ quả lớn hơn cho người làm bài."
  loai: phat-hien
- trang: bang-chung/do-luong
  id: dl30
  cau: Nunnally (1978) viết rằng trong nhiều bối cảnh ứng dụng, độ tin cậy 0,80 chưa đủ cao, và khi cần ra quyết định quan trọng thì 0,95 nên là chuẩn mong muốn (tr. 245–246, theo trích của Metsämuuronen và Niemensivu, 2025).
  loai: phat-hien
- trang: bang-chung/do-luong
  id: dl31
  cau: Thang Hài lòng với Cuộc sống (SWLS) của Diener và cộng sự (1985) có 5 câu hỏi, trả lời theo thang 1 (hoàn toàn không đồng ý) đến 7 (hoàn toàn đồng ý); một câu là "Tôi hài lòng với cuộc sống của mình" (I am satisfied with my life).
  loai: cong-cu
- trang: bang-chung/do-luong
  id: dl32
  cau: Trong nghiên cứu gốc, trên 176 sinh viên đại học ở Mỹ, SWLS đạt alpha 0,87; 76 sinh viên làm lại sau hai tháng cho hệ số test-retest 0,82.
  loai: so-lieu
- trang: bang-chung/do-luong
  id: dl33
  cau: Tính đến 10/2026, theo OpenAlex, bài gốc năm 1985 của SWLS được trích dẫn hơn 31.000 lần.
  loai: thoi-su
- trang: bang-chung/do-luong
  id: dl34
  cau: Với alpha 0,87 và test-retest 0,82 ở nhóm sinh viên đó, 5 câu hỏi khá "đồng lòng" với nhau và kết quả khá ổn định theo thời gian.
  loai: phat-hien
- trang: bang-chung/do-luong
  id: dl35
  cau: Tiêu chuẩn 2014 nêu rằng nhà phát triển bài test nên cung cấp bằng chứng về độ tin cậy cho từng cách dùng điểm số; một bài test không nhắc tới alpha hay test-retest thì ta không có cơ sở để đánh giá độ tin cậy của nó.
  loai: loi-khuyen
- trang: bang-chung/do-luong
  id: dl36
  cau: Alpha dưới khoảng 0,70 thường được coi là thấp; một quiz tự tin kết luận mà không nêu con số hay chỉ nêu giá trị dưới mức đó thì đáng dè chừng.
  loai: loi-khuyen
- trang: bang-chung/do-luong
  id: dl37
  cau: Nội dung các câu hỏi của một bài test nên khớp với khái niệm cần đo; ví dụ một quiz "đo IQ" toàn hỏi kiến thức đố vui thì nội dung không khớp.
  loai: loi-khuyen
- trang: bang-chung/do-luong
  id: dl38
  cau: Tiêu chuẩn 2014 nêu rằng thông tin về bài test nên được ghi rõ để người dùng có thể quyết định dùng bài nào, chấm điểm và diễn giải ra sao; vì vậy cần hỏi ai đứng sau thang đo và có tài liệu để người khác kiểm lại không.
  loai: loi-khuyen
- trang: bang-chung/do-luong
  id: dl39
  cau: Năm 1949, Forer cho 39 sinh viên làm một bài trắc nghiệm rồi phát cho mỗi em một bản "mô tả tính cách" ghi sẵn tên nhưng giống hệt nhau (13 nhận xét); trung bình các em chấp nhận khoảng 10 trên 13 nhận xét là đúng với mình.
  loai: phat-hien
- trang: bang-chung/do-luong
  id: dl40
  cau: Nếu mọi người nhận cùng một mô tả mà đều thấy đúng, thì việc thấy đúng không phải bằng chứng rằng bài test đo được điều gì.
  loai: phat-hien
- trang: bang-chung/do-luong
  id: dl41
  cau: "Độ tin cậy là điều kiện cần nhưng không đủ của độ giá trị: một thang đo nhất quán vẫn có thể không đo đúng thứ định đo."
  loai: nhan
- trang: bang-chung/do-luong
  id: dl42
  cau: Các mốc alpha như 0,70 chỉ là quy ước tham khảo; mức cần thiết phụ thuộc mục đích dùng điểm số.
  loai: nhan
- trang: bang-chung/do-luong
  id: dl43
  cau: "Trong bài tập giả định (quiz 4 câu về hạnh phúc, test-retest 0,85, alpha 0,45): test-retest 0,85 là khá cao (gần bằng 0,82 của SWLS) nên quiz ổn định theo thời gian; alpha 0,45 là thấp (dưới mốc khoảng 0,70 thường dùng), nguyên nhân có thể là các câu ít liên hệ với nhau hoặc ít câu hỏi."
  loai: phat-hien
- trang: bang-chung/do-luong
  id: dl44
  cau: 'Trong bài tập giả định: quiz có thể ổn định (tin cậy cao) mà vẫn không đo đúng điều nó tuyên bố, vì các câu hỏi như "Bạn có nhiều tiền không?" và "Bữa sáng hôm nay có ngon không?" đo những thứ khác với "hạnh phúc" như một trạng thái tâm lý chung; đây là vấn đề độ giá trị.'
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl45
  cau: "Quiz 1: cái cân luôn báo nặng hơn thực tế 5 kg và cho cùng một số mười lần là độ tin cậy cao nhưng độ giá trị thấp; giáo trình OpenStax dùng đúng kiểu ví dụ này."
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl46
  cau: "Quiz 2: alpha rất cao (như 0,97) không tự động là tốt hơn, vì có thể do các câu hỏi lặp lại nhau; và độ giá trị là câu hỏi khác với độ nhất quán nội tại."
  loai: dinh-nghia
- trang: bang-chung/do-luong
  id: dl47
  cau: "Quiz 3: alpha tóm tắt độ nhất quán nội tại; độ ổn định giữa hai lần đo là test-retest, còn khả năng dự đoán thuộc về độ giá trị."
  loai: dinh-nghia
- trang: bang-chung/co-mau-suc-manh
  id: c1
  cau: Ngày 17/5/2013, trang Spectrum (nay là The Transmitter) đưa tin về bài báo của Button và cộng sự trên Nature Reviews Neuroscience, nêu rằng công suất thống kê của các nghiên cứu thần kinh học chỉ vào khoảng 8% đến 31%.
  loai: lich-su
- trang: bang-chung/co-mau-suc-manh
  id: c2
  cau: Bản tin viết rằng ở công suất thấp như vậy, một kết quả "dương tính" chỉ đúng khoảng một nửa số lần hoặc ít hơn.
  loai: lich-su
- trang: bang-chung/co-mau-suc-manh
  id: c3
  cau: 'Bài báo gốc có tên "Power failure: why small sample size undermines the reliability of neuroscience", của Button, Ioannidis, Mokrysz, Nosek, Flint, Robinson và Munafò, đăng trên Nature Reviews Neuroscience 14(5), trang 365–376, năm 2013.'
  loai: lich-su
- trang: bang-chung/co-mau-suc-manh
  id: c4
  cau: Tóm tắt của bài nói rằng công suất thống kê trung bình của các nghiên cứu thần kinh học rất thấp, và hệ quả gồm việc ước lượng hiệu ứng bị phóng đại và kết quả khó tái lập.
  loai: phat-hien
- trang: bang-chung/co-mau-suc-manh
  id: c6
  cau: "Công suất thống kê là xác suất một nghiên cứu phát hiện được hiệu ứng có thật: nếu hiệu ứng tồn tại, đó là xác suất cho kết quả có ý nghĩa thống kê."
  loai: dinh-nghia
- trang: bang-chung/co-mau-suc-manh
  id: c7
  cau: Sai lầm loại II (β) là trường hợp hiệu ứng có thật mà kiểm định cho kết quả không có ý nghĩa; công suất bằng 1 trừ β.
  loai: dinh-nghia
- trang: bang-chung/co-mau-suc-manh
  id: c8
  cau: Công suất 0,8 nghĩa là 80% cơ hội phát hiện hiệu ứng có thật và 20% rủi ro bỏ sót.
  loai: dinh-nghia
- trang: bang-chung/co-mau-suc-manh
  id: c9
  cau: Cỡ mẫu càng lớn thì công suất càng cao.
  loai: phat-hien
- trang: bang-chung/co-mau-suc-manh
  id: c10
  cau: "Công suất không nói hiệu ứng có tồn tại hay không; nó có điều kiện: nếu hiệu ứng thật có độ lớn đã giả định, nghiên cứu có bao nhiêu cơ hội phát hiện nó."
  loai: dinh-nghia
- trang: bang-chung/co-mau-suc-manh
  id: c11
  cau: Năm 1988, Jacob Cohen xuất bản cuốn Statistical Power Analysis for the Behavioral Sciences (ấn bản 2, Lawrence Erlbaum Associates), trong đó ông nêu quy ước công suất 0,8.
  loai: lich-su
- trang: bang-chung/co-mau-suc-manh
  id: c12
  cau: 'Cohen đề nghị: khi nhà nghiên cứu không có cơ sở nào khác để đặt mức công suất mong muốn, hãy dùng 0,8, tức β = 0,2; ông gọi giá trị này là "tùy ý nhưng hợp lý".'
  loai: phat-hien
- trang: bang-chung/co-mau-suc-manh
  id: c13
  cau: "Lý do chính của Cohen: mức α = 0,05 đã là quy ước ngầm, và β = 0,20 được chọn với ý rằng sai lầm loại I nghiêm trọng gấp khoảng bốn lần sai lầm loại II (0,20 chia 0,05)."
  loai: phat-hien
- trang: bang-chung/co-mau-suc-manh
  id: c14
  cau: Cohen hy vọng quy ước 0,8 sẽ bị bỏ qua mỗi khi nhà nghiên cứu có cơ sở riêng để chọn mức khác.
  loai: phat-hien
- trang: bang-chung/co-mau-suc-manh
  id: c15
  cau: Lakens (2022) viết rằng khuyến nghị mặc định 80% công suất thiếu một lý lẽ vững; điều nên rút ra từ Cohen là cần biện minh tỉ lệ sai lầm theo mức nghiêm trọng của từng loại sai lầm.
  loai: phat-hien
- trang: bang-chung/co-mau-suc-manh
  id: c16
  cau: Công suất cao hơn đòi hỏi mẫu lớn hơn; Lakens cho rằng nếu cân nhắc chi phí so với lợi ích, công suất 90% hay 95% có thể phổ biến hơn với các bài báo chỉ báo cáo một nghiên cứu.
  loai: phat-hien
- trang: bang-chung/co-mau-suc-manh
  id: c17
  cau: Cohen (1992) lập bảng cỡ mẫu cần để đạt công suất 0,8 cho hiệu ứng nhỏ, trung bình và lớn theo quy ước của ông.
  loai: lich-su
- trang: bang-chung/co-mau-suc-manh
  id: c18
  cau: "So hai nhóm độc lập bằng phép kiểm định t hai phía, mức ý nghĩa 0,05, công suất 0,8: d = 0,2 cần khoảng 394 người mỗi nhóm, d = 0,5 cần 64, d = 0,8 cần 26."
  loai: so-lieu
- trang: bang-chung/co-mau-suc-manh
  id: c19
  cau: Với 15 người mỗi nhóm (cùng phép kiểm định), công suất là khoảng 8% cho d = 0,2, 26% cho d = 0,5 và 56% cho d = 0,8.
  loai: so-lieu
- trang: bang-chung/co-mau-suc-manh
  id: c20
  cau: Hiệu ứng nhỏ cần mẫu rất lớn.
  loai: phat-hien
- trang: bang-chung/co-mau-suc-manh
  id: c21
  cau: Tổng hợp hơn 25.000 nghiên cứu của tâm lý học xã hội cho thấy hiệu ứng điển hình có r khoảng 0,21.
  loai: so-lieu
- trang: bang-chung/co-mau-suc-manh
  id: c22
  cau: r = 0,21 tương đương d khoảng 0,43, giữa mức nhỏ và mức trung bình; với d = 0,43 cần khoảng 86 người mỗi nhóm để đạt công suất 0,8, nên nghiên cứu chỉ vài chục người mỗi nhóm thường không đủ công suất cho hiệu ứng cỡ đó.
  loai: so-lieu
- trang: bang-chung/co-mau-suc-manh
  id: c23
  cau: Lakens khuyên không nên dùng các mốc nhỏ, trung bình, lớn của Cohen để tính cỡ mẫu cho nghiên cứu thật, và ghi rằng chính Cohen về sau tỏ ý tiếc đã đề xuất chúng.
  loai: phat-hien
- trang: bang-chung/co-mau-suc-manh
  id: c24
  cau: Button và cộng sự dùng dữ liệu từ 49 bài phân tích tổng hợp trong khoa học thần kinh, gồm 730 nghiên cứu riêng lẻ, và ước tính công suất của nghiên cứu có cỡ trung vị trong mỗi bài tổng hợp.
  loai: phat-hien
- trang: bang-chung/co-mau-suc-manh
  id: c25
  cau: Công suất trung vị của các nghiên cứu thần kinh học là khoảng 21% theo Button và cộng sự, thấp hơn nhiều so với 0,8 (chỉ bằng khoảng một phần tư).
  loai: so-lieu
- trang: bang-chung/co-mau-suc-manh
  id: c26
  cau: Tóm tắt của Button và cộng sự ước tính công suất trung vị của các nghiên cứu thần kinh học nằm giữa khoảng 8% và 31%.
  loai: so-lieu
- trang: bang-chung/co-mau-suc-manh
  id: c27
  cau: Nghiên cứu cấu trúc não bằng hình ảnh so sánh nhóm bệnh với nhóm đối chứng có công suất trung vị 8%.
  loai: so-lieu
- trang: bang-chung/co-mau-suc-manh
  id: c28
  cau: Hai bài tổng hợp về nghiên cứu trên động vật cho công suất trung vị 18% và 31%.
  loai: so-lieu
- trang: bang-chung/co-mau-suc-manh
  id: c29
  cau: "Nhóm tác giả cũng nêu khía cạnh đạo đức: nghiên cứu không đáng tin cậy là nghiên cứu kém hiệu quả và lãng phí."
  loai: phat-hien
- trang: bang-chung/co-mau-suc-manh
  id: c30
  cau: Một phân tích của 26.841 phép kiểm định t trong 3.801 bài báo tâm lý học và khoa học thần kinh nhận thức cho thấy công suất trung vị để phát hiện hiệu ứng nhỏ, trung bình và lớn lần lượt là 0,12, 0,44 và 0,73.
  loai: so-lieu
- trang: bang-chung/co-mau-suc-manh
  id: c31
  cau: "Nord và cộng sự (2017) tính lại trên cả 730 nghiên cứu và thấy công suất trung vị 23%, gần với 21% của Button, nhưng công suất không đồng đều giữa các nhóm nghiên cứu: thấp nhất ở nghiên cứu gen ứng viên (trung vị 11%)."
  loai: so-lieu
- trang: bang-chung/co-mau-suc-manh
  id: c32
  cau: Nord và cộng sự kết luận công suất thấp "không phải vấn đề phổ biến ở mọi nơi" (far from a universal problem), dù nhiều nghiên cứu vẫn thiếu công suất, có cái rất nghiêm trọng.
  loai: phat-hien
- trang: bang-chung/co-mau-suc-manh
  id: c33
  cau: Khi công suất thấp, chỉ những hiệu ứng quan sát được lớn mới vượt ngưỡng ý nghĩa, nên hiệu ứng ước lượng từ các kết quả có ý nghĩa thường lớn hơn hiệu ứng thật.
  loai: phat-hien
- trang: bang-chung/co-mau-suc-manh
  id: c34
  cau: Công suất thấp không chỉ làm giảm khả năng phát hiện hiệu ứng thật mà còn làm giảm khả năng một kết quả có ý nghĩa thống kê phản ánh hiệu ứng thật.
  loai: phat-hien
- trang: bang-chung/co-mau-suc-manh
  id: c35
  cau: Công suất thấp được nêu là một lý do khiến kết quả khó tái lập, nên nó là một mảnh ghép của câu chuyện khủng hoảng tái lập.
  loai: phat-hien
- trang: bang-chung/co-mau-suc-manh
  id: c36
  cau: Mẫu rất nhỏ nhưng kết luận rất lớn là dấu hiệu đáng ngờ vì công suất có thể thấp và hiệu ứng có thể đã bị phóng đại.
  loai: loi-khuyen
- trang: bang-chung/co-mau-suc-manh
  id: c37
  cau: Nghiên cứu không biện minh cỡ mẫu trước khi thu thập dữ liệu thì người đọc khó biết nghiên cứu có đủ sức phát hiện hiệu ứng đáng quan tâm không.
  loai: loi-khuyen
- trang: bang-chung/co-mau-suc-manh
  id: c38
  cau: Hiệu ứng báo cáo lớn một cách bất thường từ một nghiên cứu đơn lẻ có thể là hiệu ứng bị phóng đại (winner's curse).
  loai: loi-khuyen
- trang: bang-chung/co-mau-suc-manh
  id: c39
  cau: Phát hiện chưa từng được tái lập, nhất là từ nghiên cứu nhỏ, cần được kiểm chứng lại trước khi tin.
  loai: loi-khuyen
- trang: bang-chung/co-mau-suc-manh
  id: c40
  cau: Một nghiên cứu đáng tin hơn thường giải thích vì sao chọn cỡ mẫu ấy ngay từ trước khi thu thập dữ liệu.
  loai: loi-khuyen
- trang: bang-chung/co-mau-suc-manh
  id: c42
  cau: Một kết quả có ý nghĩa thống kê (p < 0,05) từ nghiên cứu công suất thấp có thể ít phản ánh hiệu ứng thật hơn người đọc tưởng.
  loai: loi-khuyen
- trang: bang-chung/co-mau-suc-manh
  id: c43
  cau: 'Giá trị p chỉ vừa đủ dưới 0,05: với công suất thấp, p "sát nút" càng dễ chỉ là may rủi.'
  loai: loi-khuyen
- trang: bang-chung/co-mau-suc-manh
  id: c44
  cau: Công suất thấp làm nghiên cứu dễ bỏ sót hiệu ứng thật, và làm các kết quả có ý nghĩa thống kê thiên về phóng đại hiệu ứng.
  loai: nhan
- trang: bang-chung/co-mau-suc-manh
  id: c45
  cau: Công suất của nhiều nghiên cứu thần kinh học và tâm lý học thấp hơn nhiều so với mức 0,8, nhưng thấp đến đâu còn tùy cách ước tính.
  loai: nhan
- trang: bang-chung/co-mau-suc-manh
  id: c47
  cau: "Nên tin nghiên cứu B hơn nghiên cứu A: mẫu lớn hơn nhiều nên hiệu ứng ước lượng ít có khả năng bị thổi phồng; nhưng tin hơn không có nghĩa là chắc chắn, và cả hai vẫn cần được tái lập."
  loai: loi-khuyen
- trang: bang-chung/co-mau-suc-manh
  id: c48
  cau: Nghiên cứu A (15 người mỗi nhóm) có công suất khoảng 56% ngay cả khi hiệu ứng thật là lớn (d = 0,8), và khoảng 26% nếu là trung bình (d = 0,5).
  loai: so-lieu
- trang: bang-chung/co-mau-suc-manh
  id: c49
  cau: "Câu hỏi 1: công suất 0,8 nghĩa là nếu hiệu ứng có thật ở độ lớn đã giả định, nghiên cứu có khoảng 80% cơ hội cho kết quả có ý nghĩa; nó bằng 1 trừ xác suất sai lầm loại II; nó không nói hiệu ứng có tồn tại hay không."
  loai: dinh-nghia
- trang: bang-chung/co-mau-suc-manh
  id: c50
  cau: "Câu hỏi 2: ngưỡng ý nghĩa lọc giữ lại các kết quả quan sát lớn hơn hiệu ứng thật khi công suất thấp (winner's curse)."
  loai: phat-hien
- trang: bang-chung/co-mau-suc-manh
  id: c51
  cau: "Câu hỏi 3: d = 0,2 cần khoảng 394 người mỗi nhóm, d = 0,5 cần khoảng 64, d = 0,8 cần khoảng 26."
  loai: so-lieu
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d1
  cau: "Tháng 12 năm 2023, tạp chí Nature đưa tin: số lượt rút bài báo nghiên cứu năm 2023 đã vượt 10.000, phá các kỷ lục hằng năm."
  loai: lich-su
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d2
  cau: 'Phần lớn các lượt rút bài năm 2023 đến từ các tạp chí của Hindawi, công ty con của nhà xuất bản Wiley ở Luân Đôn: hơn 8.000 bài bị rút, với lý do gồm "thao túng có hệ thống quy trình xuất bản và phản biện".'
  loai: so-lieu
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d3
  cau: Đa số các bài Hindawi bị rút nằm trong các số đặc biệt (special issues), loại số thường do biên tập viên khách phụ trách và bị kẻ gian lợi dụng để đăng nhanh bài kém chất lượng hay bài giả.
  loai: phat-hien
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d4
  cau: Tỉ lệ bài bị rút trong tổng số bài đăng, theo phân tích của Nature, năm 2022 vượt 0,2%.
  loai: so-lieu
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d5
  cau: Bài của Nature đăng ở Nature 624, trang 479–481, tác giả Richard Van Noorden.
  loai: lich-su
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d6
  cau: Những bài Hindawi bị rút được đăng qua quy trình phản biện của tạp chí, và quy trình đó, theo lý do nhà xuất bản nêu, đã bị xâm phạm; vì thế "đã đăng" hay "đã qua phản biện" không đồng nghĩa với "đúng".
  loai: phat-hien
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d7
  cau: Thay vì tin vào con dấu, người đọc cần biết tự mình đánh giá một bài báo, và bước đầu là hiểu nó được cấu tạo ra sao.
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d8
  cau: Bài báo khoa học thực nghiệm thường chia thành bốn phần Introduction, Methods, Results, Discussion; cấu trúc này gọi là IMRAD (viết là IMRaD).
  loai: dinh-nghia
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d9
  cau: Introduction nêu bối cảnh và tầm quan trọng của vấn đề, và mục tiêu hay giả thuyết cụ thể của nghiên cứu.
  loai: dinh-nghia
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d10
  cau: "Methods mô tả cách làm: ai tham gia, đo lường bằng gì, phân tích ra sao, đủ chi tiết để người khác có thể làm lại."
  loai: dinh-nghia
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d11
  cau: Results trình bày đã thấy gì, theo thứ tự hợp lý, kết quả chính trước; phần bàn luận về ý nghĩa nằm ở mục sau.
  loai: dinh-nghia
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d12
  cau: Discussion tóm tắt kết quả chính, giải thích kết quả có nghĩa là gì, nêu giới hạn của nghiên cứu và đặt nó vào bối cảnh bằng chứng đã có.
  loai: dinh-nghia
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d13
  cau: Bài thường có thêm Abstract (tóm tắt) ở đầu và References (tài liệu tham khảo) ở cuối.
  loai: dinh-nghia
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d14
  cau: "Cấu trúc IMRaD tạo điều kiện cho việc đọc theo từng mô-đun: người đọc lướt từng phần để tìm thông tin cụ thể; muốn biết mẫu bao nhiêu người thì mở Methods, muốn xem số liệu thì mở Results."
  loai: phat-hien
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d15
  cau: "Khảo sát bốn tạp chí nội khoa hàng đầu (BMJ, JAMA, The Lancet, NEJM) từ 1935 đến 1985: IMRaD bắt đầu được dùng từ thập niên 1940, đạt 80% bài nghiên cứu gốc vào thập niên 1970 và là kiểu duy nhất trong thập niên 1980."
  loai: so-lieu
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d16
  cau: Hướng dẫn của ICMJE gọi IMRaD không phải một khuôn xuất bản tùy tiện mà phản ánh quá trình khám phá khoa học.
  loai: phat-hien
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d17
  cau: Theo hướng dẫn của ICMJE, abstract nên nêu bối cảnh, mục đích, các bước tiến hành cơ bản (chọn người tham gia, bối cảnh, đo lường, phương pháp phân tích), kết quả chính (nêu độ lớn hiệu ứng cụ thể nếu có thể), kết luận chính, ghi các giới hạn quan trọng và không diễn giải vượt quá kết quả.
  loai: phat-hien
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d18
  cau: Nếu abstract chỉ toàn lời khẳng định mà không cho biết người ta đã làm gì với bao nhiêu người, bạn càng cần đọc kỹ phần Methods trước khi tin.
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d19
  cau: 'Không có một thứ tự đọc bài báo đúng duy nhất: có người xem kỹ hình và bảng (kể cả chú thích) trước phần chữ chính, có người đọc Results song song với hình và bảng; "không có cách nào đúng hay sai: hãy thử cả hai xem cách nào hợp với bạn".'
  loai: phat-hien
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d20
  cau: "Đọc Abstract trước tiên để có bản đồ toàn bài: câu hỏi là gì, làm bằng cách nào, thấy gì."
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d21
  cau: Với mỗi hình, hiểu trục x và y, cách dùng màu và cách phân tích thống kê, và vì sao tác giả chọn cách vẽ đó.
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d22
  cau: Methods cho biết nghiên cứu làm gì và làm thế nào; lý tưởng nhất, đọc Methods là đủ để làm lại dự án, và nên quay lại Methods nhiều lần để hiểu rõ dữ liệu có được thế nào.
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d23
  cau: Đọc phần chữ của Results và đối chiếu với hình và bảng.
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d24
  cau: Discussion là nơi tác giả diễn giải kết quả và đặt nó vào bối cảnh các phát hiện đã có; Introduction nêu câu hỏi nghiên cứu và vì sao nó quan trọng.
  loai: dinh-nghia
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d25
  cau: "Nguyên tắc nên giữ: đừng để diễn giải của tác giả đi trước bằng chứng; ngay cả các phần được coi là khách quan cũng do tác giả viết nên chịu ảnh hưởng từ cách diễn giải của họ, và người đọc nên phản biện lại diễn giải ấy để thử độ vững của kết luận."
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d26
  cau: Methods cho biết kết luận được tạo ra bằng cách nào.
  loai: dinh-nghia
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d27
  cau: Một nghiên cứu nên mô tả tiêu chí tuyển chọn người tham gia (kể cả nhóm đối chứng), nguồn dân số và mức đại diện của mẫu so với nhóm người mà nghiên cứu muốn nói tới; vì vậy khi đọc Methods hãy hỏi ai tham gia, bao nhiêu người, được tuyển chọn thế nào và có đại diện không.
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d28
  cau: Methods cần nêu phương pháp, thiết bị và quy trình đo đủ chi tiết để người khác làm lại kết quả; vì vậy hãy hỏi người ta đo cái gì, bằng công cụ nào.
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d29
  cau: ICMJE khuyên tránh chỉ dựa vào kiểm định giả thuyết như giá trị p vì nó không truyền đạt đủ thông tin về độ lớn hiệu ứng và độ chính xác của ước lượng; vì vậy hãy hỏi hiệu ứng lớn cỡ nào chứ không chỉ "có ý nghĩa thống kê hay không".
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d30
  cau: Theo ICMJE, Methods nên đủ chi tiết để người khác có dữ liệu có thể làm lại kết quả; nếu Methods quá sơ sài để trả lời những câu hỏi ở trên thì bài khó được đánh giá và đáng được coi là dấu hiệu cảnh báo.
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d31
  cau: "Khi hỏi về Abstract: câu hỏi nghiên cứu là gì, kết luận chính là gì, có nêu cách làm và độ lớn hiệu ứng không."
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d32
  cau: 'Khi xem hình hoặc bảng: hỏi trục là gì, cách phân tích thống kê là gì, hiệu ứng lớn hay chỉ "có ý nghĩa thống kê".'
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d33
  cau: "Khi đọc Methods: hỏi ai tham gia, tuyển chọn thế nào, đo bằng gì, có nhóm đối chứng không."
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d34
  cau: "Khi đọc Results: hỏi lời mô tả có khớp hình không, và mọi kết quả đã nêu ở Methods có được báo cáo không."
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d35
  cau: "Khi đọc Discussion: hỏi tác giả có nêu giới hạn của nghiên cứu không, có xét cách giải thích khác cho kết quả không."
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d36
  cau: "Khi đọc References: hỏi các trích dẫn dẫn về nghiên cứu gốc hay chỉ là bài viết lại."
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d38
  cau: Peer review (phản biện đồng nghiệp) là việc các chuyên gia thường không thuộc ban biên tập đánh giá một bản thảo gửi tới tạp chí.
  loai: dinh-nghia
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d39
  cau: Theo ICMJE, phản biện giúp bản thảo được xem xét công bằng trong cộng đồng khoa học, giúp biên tập viên quyết định bài nào hợp với tạp chí, và thường giúp tác giả và biên tập viên cải thiện chất lượng báo cáo.
  loai: phat-hien
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d40
  cau: Số lượng và loại người phản biện, và việc phản biện mở hay ẩn danh, khác nhau giữa các tạp chí; tạp chí không bắt buộc làm theo khuyến nghị của người phản biện, dù thuận hay chê.
  loai: phat-hien
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d41
  cau: Phản biện hầu như luôn là công việc tình nguyện của các nhà nghiên cứu.
  loai: phat-hien
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d42
  cau: Trong một thử nghiệm với 607 người phản biện của tạp chí BMJ, mỗi bản thảo thử được cài chín lỗi phương pháp lớn; ở bản đầu tiên, người phản biện phát hiện trung bình 2,58 trong chín lỗi.
  loai: so-lieu
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d43
  cau: "Schroter và cộng sự kết luận: biên tập viên không nên cho rằng người phản biện sẽ phát hiện phần lớn lỗi lớn."
  loai: phat-hien
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d44
  cau: Gian lận và các thực hành nghiên cứu đáng ngờ vẫn lọt vào kho văn bản khoa học dù có phản biện.
  loai: phat-hien
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d45
  cau: Phản biện không thay được việc kiểm chứng độc lập bằng cách làm lại nghiên cứu.
  loai: phat-hien
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d46
  cau: Hơn 8.000 bài của các tạp chí Hindawi bị rút, với lý do gồm "quy trình phản biện đã bị xâm phạm" và "thao túng có hệ thống quy trình xuất bản và phản biện".
  loai: phat-hien
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d47
  cau: 'Nên xem "đã qua phản biện" như một bước đánh giá có ích nhưng không hoàn hảo: ICMJE ghi rằng giá trị thực của phản biện vẫn còn được bàn cãi, và một tổng quan của Cochrane kết luận hiện còn ít bằng chứng thực nghiệm ủng hộ việc dùng phản biện biên tập.'
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d48
  cau: Phản biện đồng nghiệp không phát hiện được mọi lỗi và không bảo đảm một bài báo đúng.
  loai: nhan
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d49
  cau: IMRaD là cấu trúc chuẩn của bài báo nghiên cứu gốc, và Methods là nơi để tìm cách nghiên cứu được làm.
  loai: nhan
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d51
  cau: Khoảng 15 người mỗi nhóm là mẫu nhỏ.
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d52
  cau: 'Với tình huống thử nghiệm, ba điều cần kiểm tra trong Methods: cách chia nhóm (có ngẫu nhiên không) và đại diện của mẫu; bài kiểm tra IQ cụ thể là bài nào và đo bằng thang nào; nhóm "ngồi yên" có là nhóm đối chứng tốt không và có đo IQ trước khi nghe nhạc không.'
  loai: loi-khuyen
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d53
  cau: "Câu hỏi 1: tìm cách tuyển người tham gia và công cụ đo ở Methods; Introduction nêu bối cảnh và mục tiêu, Discussion giải thích ý nghĩa của kết quả."
  loai: dinh-nghia
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d54
  cau: "Câu hỏi 2: phản biện giúp bản thảo được xem xét và thường giúp cải thiện cách báo cáo, nhưng người phản biện không phát hiện được mọi lỗi và quy trình có thể bị thao túng."
  loai: phat-hien
- trang: bang-chung/doc-bai-bao-khoa-hoc
  id: d55
  cau: "Câu hỏi 3: các phần được coi là khách quan cũng do tác giả viết nên có thể mang diễn giải của họ; người đọc nên tự kiểm tra độ vững của kết luận."
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e2
  cau: Tuyên bố Helsinki yêu cầu kế hoạch nghiên cứu được nộp cho hội đồng đạo đức nghiên cứu để xem xét và phê duyệt trước khi nghiên cứu bắt đầu; Bộ luật đạo đức của APA yêu cầu xin phê duyệt trước khi tiến hành nghiên cứu khi cơ sở đòi phê duyệt.
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e3
  cau: "Báo cáo Belmont mở đầu: nghiên cứu khoa học đã đem lại lợi ích xã hội đáng kể nhưng cũng đặt ra những câu hỏi đạo đức rắc rối; sự chú ý của công chúng được kéo tới nhờ các báo cáo về việc lạm dụng người tham gia trong thí nghiệm y sinh, đặc biệt trong Thế chiến II."
  loai: lich-su
- trang: bang-chung/dao-duc-nghien-cuu
  id: e4
  cau: "Belmont nhắc tới nghiên cứu giang mai ở Tuskegee: các nam giới da đen nghèo ở nông thôn được dùng để nghiên cứu diễn tiến tự nhiên của bệnh, và họ bị từ chối phương pháp điều trị hiệu quả đã có."
  loai: lich-su
- trang: bang-chung/dao-duc-nghien-cuu
  id: e5
  cau: Belmont viết rằng cần xem xét việc chọn người tham gia có phải vì họ dễ tiếp cận, ở thế yếu hay dễ bị tác động, thay vì vì lý do liên quan trực tiếp đến vấn đề nghiên cứu.
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e6
  cau: "Theo Belmont, các bộ quy tắc đạo đức có từ trước thường không đủ cho tình huống phức tạp: có lúc chúng mâu thuẫn nhau và thường khó diễn giải hay áp dụng; nên cần những nguyên tắc rộng hơn làm nền cho các quy tắc cụ thể."
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e7
  cau: Tuyên bố Helsinki yêu cầu hội đồng đạo đức nghiên cứu hoạt động minh bạch và có sự độc lập và quyền hạn để chống lại ảnh hưởng không chính đáng từ nhà nghiên cứu, bên tài trợ hay người khác.
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e8
  cau: Ngày 12/7/1974, Đạo luật Nghiên cứu Quốc gia (National Research Act) được ký, lập ra Ủy ban Quốc gia về Bảo vệ Đối tượng Con người trong Nghiên cứu Y sinh và Hành vi; một nhiệm vụ của Ủy ban là xác định các nguyên tắc đạo đức cơ bản làm nền cho nghiên cứu với người.
  loai: lich-su
- trang: bang-chung/dao-duc-nghien-cuu
  id: e9
  cau: Báo cáo Belmont tóm tắt các nguyên tắc, rút ra từ cuộc thảo luận bốn ngày tại Trung tâm Hội nghị Belmont của Smithsonian vào tháng 2/1976 và các phiên họp hằng tháng trong gần bốn năm; được đăng trên Federal Register ngày 18/4/1979 để lấy ý kiến công chúng.
  loai: lich-su
- trang: bang-chung/dao-duc-nghien-cuu
  id: e10
  cau: "Nguyên tắc tôn trọng con người gồm hai điều: cá nhân được đối xử như chủ thể tự quyết, và người có khả năng tự quyết hạn chế (do chưa trưởng thành, bệnh tật, khuyết tật tâm thần hay hoàn cảnh hạn chế tự do) được bảo vệ."
  loai: dinh-nghia
- trang: bang-chung/dao-duc-nghien-cuu
  id: e11
  cau: "Belmont hiểu beneficence là một nghĩa vụ, với hai quy tắc bổ trợ nhau: không gây hại, và tối đa hóa lợi ích có thể có đồng thời tối thiểu hóa tác hại có thể có."
  loai: dinh-nghia
- trang: bang-chung/dao-duc-nghien-cuu
  id: e12
  cau: 'Nguyên tắc công bằng đặt câu hỏi: ai nên nhận lợi ích của nghiên cứu và ai nên gánh các gánh nặng của nó; đó là câu hỏi về "sự công bằng trong phân phối".'
  loai: dinh-nghia
- trang: bang-chung/dao-duc-nghien-cuu
  id: e13
  cau: "Belmont nêu ba yêu cầu áp dụng các nguyên tắc: đồng thuận thông tin (từ tôn trọng con người), đánh giá rủi ro và lợi ích (từ beneficence), lựa chọn người tham gia (từ công bằng)."
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e14
  cau: 'Belmont nêu ba nguyên tắc như khung phân tích chứ không phải bộ quy tắc: chúng "không phải lúc nào cũng áp dụng được để giải quyết dứt điểm" các vấn đề đạo đức cụ thể.'
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e15
  cau: Với tù nhân, tôn trọng con người đòi hỏi không tước cơ hội tình nguyện tham gia của họ, nhưng trong hoàn cảnh nhà tù họ có thể bị ép buộc tinh vi hay chịu ảnh hưởng không chính đáng, nên cũng đòi hỏi phải bảo vệ họ; Belmont gọi đó là một thế lưỡng nan.
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e16
  cau: "Theo Belmont, có sự đồng thuận rộng rãi rằng quá trình đồng thuận gồm ba yếu tố: thông tin, hiểu được thông tin và tự nguyện."
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e17
  cau: "Thông tin: các bộ quy tắc nghiên cứu thường liệt kê những điều phải cho biết, gồm quy trình, mục đích, rủi ro và lợi ích dự kiến, thủ tục thay thế (khi có điều trị), và lời mời đặt câu hỏi và rút lui bất cứ lúc nào."
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e18
  cau: "Hiểu được thông tin: cách và bối cảnh truyền đạt quan trọng không kém chính thông tin; trình bày lộn xộn và vội, cho quá ít thời gian, hay hạn chế cơ hội đặt câu hỏi làm giảm khả năng lựa chọn có hiểu biết; phải thích ứng cách trình bày với khả năng người nhận; nhà nghiên cứu có trách nhiệm xác nhận người tham gia đã hiểu."
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e19
  cau: "Tự nguyện: đồng ý chỉ là đồng thuận hợp lệ khi được đưa ra một cách tự nguyện, không bị ép buộc hay chịu ảnh hưởng không chính đáng; ảnh hưởng không chính đáng xảy ra khi có lời đề nghị thưởng quá mức, không chính đáng hay không phù hợp để đổi lấy sự tuân thủ, và những khích lệ bình thường vẫn có thể thành ảnh hưởng không chính đáng khi người tham gia đặc biệt dễ tổn thương."
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e20
  cau: "Đồng thuận không chỉ là chữ ký: ký vào một tờ giấy mà không hiểu, hoặc hiểu nhưng không dám từ chối, đều chưa đáp ứng các yếu tố hiểu được thông tin và tự nguyện."
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e21
  cau: "Bộ luật đạo đức của APA liệt kê những điều nhà tâm lý học phải thông báo cho người tham gia: mục đích, thời lượng và quy trình; quyền từ chối và rút lui; hậu quả của việc từ chối hay rút lui; các yếu tố có thể ảnh hưởng tới việc sẵn lòng tham gia như rủi ro, khó chịu; lợi ích dự kiến; giới hạn bảo mật; khích lệ; và người để liên hệ; kèm cơ hội đặt câu hỏi."
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e22
  cau: Khi tham gia nghiên cứu là yêu cầu của môn học hay cơ hội cộng điểm, Bộ luật APA yêu cầu người tham gia được lựa chọn các hoạt động thay thế tương đương; và yêu cầu nhà tâm lý học bảo vệ người tham gia là sinh viên, bệnh nhân hay cấp dưới khỏi hậu quả bất lợi khi từ chối hay rút lui.
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e23
  cau: Quy định liên bang Mỹ về bảo vệ người tham gia nghiên cứu (45 CFR 46) áp dụng cho nghiên cứu với người do một cơ quan liên bang thực hiện, tài trợ hay quản lý (khi cơ quan đó đã áp dụng chính sách); yêu cầu thông tin bằng ngôn ngữ người tham gia hiểu được, cơ hội đủ để thảo luận và cân nhắc, giảm thiểu khả năng ép buộc hay ảnh hưởng không chính đáng, nêu rõ tham gia là tự nguyện, và người tham gia có thể ngừng bất cứ lúc nào mà không bị phạt.
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e24
  cau: IRB (Institutional Review Board) là hội đồng xem xét các kế hoạch nghiên cứu với người; theo quy định liên bang Mỹ, mỗi IRB có ít nhất năm thành viên với nền tảng khác nhau, trong đó có ít nhất một người có mối quan tâm chính ở lĩnh vực khoa học, ít nhất một người ở lĩnh vực ngoài khoa học, và ít nhất một người không thuộc cơ sở.
  loai: dinh-nghia
- trang: bang-chung/dao-duc-nghien-cuu
  id: e25
  cau: Tuyên bố Helsinki gọi hội đồng này là hội đồng đạo đức nghiên cứu (research ethics committee).
  loai: dinh-nghia
- trang: bang-chung/dao-duc-nghien-cuu
  id: e26
  cau: Theo quy định liên bang Mỹ, IRB xem xét xem rủi ro có được giảm thiểu, rủi ro có hợp lý so với lợi ích dự kiến, việc chọn người tham gia có công bằng, và đồng thuận thông tin có được xin hay không.
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e27
  cau: IRB có thẩm quyền phê duyệt, yêu cầu sửa đổi để được phê duyệt, hoặc không phê duyệt các hoạt động nghiên cứu thuộc phạm vi quy định.
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e28
  cau: Với nghiên cứu cần xem xét tại cuộc họp đầy đủ của IRB, quy định liên bang yêu cầu xem xét liên tục theo khoảng thời gian phù hợp với mức rủi ro, ít nhất mỗi năm một lần, trừ một số trường hợp ngoại lệ.
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e29
  cau: Tuyên bố Helsinki nói hội đồng đạo đức nghiên cứu phải có quyền giám sát, đề nghị thay đổi, rút phê duyệt và đình chỉ nghiên cứu đang diễn ra.
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e30
  cau: Các tiêu chí duyệt của IRB (giảm thiểu rủi ro, rủi ro hợp lý so với lợi ích, chọn người tham gia công bằng, đồng thuận thông tin) tương ứng ba ứng dụng của Belmont.
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e33
  cau: "Belmont nói việc không tiết lộ đầy đủ chỉ chính đáng khi: thật sự cần thiết cho mục tiêu nghiên cứu; không có rủi ro ẩn nào hơn mức tối thiểu; có kế hoạch giải thích sau khi thích hợp và phổ biến kết quả cho người tham gia."
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e34
  cau: Đặt thí nghiệm Milgram cạnh các điều kiện của Belmont về không tiết lộ đầy đủ, ta thấy câu hỏi về beneficence (rủi ro tâm lý) và về đồng thuận thông tin (liệu họ có đồng ý nếu biết trước?); đây là cách đọc của site, không phải kết luận của Belmont.
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e37
  cau: Bộ luật APA cho phép nghiên cứu dùng mưu mẹo chỉ khi nhà nghiên cứu xác định giá trị khoa học, giáo dục hay ứng dụng của nghiên cứu biện minh cho nó và không có cách nào không dùng mưu mẹo mà hiệu quả; không được dùng mưu mẹo về điều dự kiến gây đau thể xác hay đau khổ tinh thần nặng; và phải giải thích mưu mẹo cho người tham gia sớm nhất có thể, tốt nhất là khi họ kết thúc phần tham gia, muộn nhất là khi kết thúc thu thập dữ liệu.
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e38
  cau: Tiêu chuẩn 8.08 của Bộ luật APA yêu cầu cho người tham gia cơ hội kịp thời để nhận thông tin về bản chất, kết quả và kết luận của nghiên cứu, và sửa hiểu lầm nếu có; nếu thủ tục gây hại cho người tham gia thì phải tìm cách giảm hại.
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e39
  cau: "Dấu hiệu làm đúng: người tham gia được giải thích trước về quy trình, rủi ro, lợi ích và quyền rút lui; dấu hiệu cảnh báo: người tham gia không biết mình đang trong nghiên cứu hay không biết điều gì sẽ xảy ra."
  loai: loi-khuyen
- trang: bang-chung/dao-duc-nghien-cuu
  id: e40
  cau: "Dấu hiệu làm đúng: có hội đồng (IRB) duyệt kế hoạch trước khi thực hiện; dấu hiệu cảnh báo: chỉ một mình nhà nghiên cứu quyết định mọi thứ, không ai kiểm tra."
  loai: loi-khuyen
- trang: bang-chung/dao-duc-nghien-cuu
  id: e41
  cau: "Dấu hiệu làm đúng: việc tuyển người gắn với câu hỏi nghiên cứu, không chỉ vì họ dễ tiếp cận hay ở thế yếu; dấu hiệu cảnh báo: chọn người vì họ dễ tiếp cận, khó từ chối (học sinh, nhân viên cấp dưới, bệnh nhân)."
  loai: loi-khuyen
- trang: bang-chung/dao-duc-nghien-cuu
  id: e42
  cau: "Dấu hiệu làm đúng: phần thưởng hợp lý, và nếu tham gia là yêu cầu của môn học thì có lựa chọn thay thế tương đương; dấu hiệu cảnh báo: phần thưởng quá mức, hoặc gắn với điểm số, công việc mà không có lựa chọn thay thế."
  loai: loi-khuyen
- trang: bang-chung/dao-duc-nghien-cuu
  id: e43
  cau: "Dấu hiệu làm đúng: rủi ro được đánh giá trước và giảm đến mức tối thiểu có thể; dấu hiệu cảnh báo: không thấy ai đánh giá rủi ro, hoặc rủi ro rõ ràng mà vẫn tiến hành."
  loai: loi-khuyen
- trang: bang-chung/dao-duc-nghien-cuu
  id: e44
  cau: "Dấu hiệu làm đúng: có bước giải thích sau nghiên cứu (debriefing) khi dùng mưu mẹo; dấu hiệu cảnh báo: người tham gia ra về mà không bao giờ được biết sự thật về những gì họ trải qua."
  loai: loi-khuyen
- trang: bang-chung/dao-duc-nghien-cuu
  id: e45
  cau: 'Dấu hiệu cảnh báo không tự động có nghĩa nghiên cứu "xấu": Belmont ghi nhận có trường hợp nói trước đầy đủ sẽ làm hỏng giá trị khoa học của nghiên cứu.'
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e46
  cau: "Điểm mấu chốt: mưu mẹo chỉ chấp nhận được khi thật sự cần thiết cho nghiên cứu, không che giấu rủi ro đáng kể, được phê duyệt trước (khi cơ sở yêu cầu phê duyệt), và người tham gia được giải thích sau."
  loai: loi-khuyen
- trang: bang-chung/dao-duc-nghien-cuu
  id: e48
  cau: Đồng thuận có thông tin, đánh giá rủi ro và lợi ích, chọn người tham gia công bằng và xét duyệt độc lập trước khi nghiên cứu là các chuẩn đạo đức được các văn bản chính thức nêu.
  loai: nhan
- trang: bang-chung/dao-duc-nghien-cuu
  id: e49
  cau: Nghiên cứu dùng mưu mẹo chỉ được chấp nhận khi đáp ứng điều kiện chặt chẽ, và người tham gia phải được giải thích sau.
  loai: nhan
- trang: bang-chung/dao-duc-nghien-cuu
  id: e50
  cau: "Tình huống 1 (điểm quá trình): cần xem lại tính tự nguyện; ảnh hưởng không chính đáng thường đến từ người có quyền lực và chế tài; APA 8.04 yêu cầu bảo vệ sinh viên khỏi hậu quả khi từ chối và, nếu tham gia là yêu cầu hay điểm cộng của môn học, cho lựa chọn thay thế tương đương; nếu đã có lựa chọn như vậy thì không còn vi phạm tiêu chuẩn này."
  loai: loi-khuyen
- trang: bang-chung/dao-duc-nghien-cuu
  id: e51
  cau: "Tình huống 2 (bệnh viện tâm thần, thuốc ngủ thương mại): Belmont nêu việc chọn người tham gia chỉ vì họ dễ tiếp cận, ở thế yếu hay dễ bị tác động thay vì lý do liên quan trực tiếp đến vấn đề nghiên cứu, và nói nghiên cứu không nên đặt gánh nặng lên những nhóm ít có khả năng hưởng lợi từ kết quả; cách sửa là tuyển người phù hợp với nhóm sẽ hưởng lợi, hoặc nêu lý do khoa học trực tiếp liên quan đến nhóm đó."
  loai: loi-khuyen
- trang: bang-chung/dao-duc-nghien-cuu
  id: e52
  cau: "Tình huống 3 (tờ đồng thuận 8 trang trong 2 phút): Belmont nói trình bày vội, ít thời gian và hạn chế câu hỏi làm giảm khả năng lựa chọn có hiểu biết, và nhà nghiên cứu phải xác nhận người tham gia đã hiểu; cách sửa là giải thích bằng lời dễ hiểu, cho thời gian đọc và hỏi, kiểm tra xem người tham gia có nắm ý chính không."
  loai: loi-khuyen
- trang: bang-chung/dao-duc-nghien-cuu
  id: e53
  cau: "Tình huống 4 (không giải thích sau nghiên cứu): APA 8.08 yêu cầu cho người tham gia cơ hội kịp thời nhận thông tin và sửa hiểu lầm, và giảm hại nếu thủ tục gây hại; việc đã được IRB duyệt không thay cho bước này; cách sửa là giải thích đầy đủ sau thí nghiệm và cho cơ hội hỏi trước khi người tham gia ra về."
  loai: loi-khuyen
- trang: bang-chung/dao-duc-nghien-cuu
  id: e54
  cau: "Câu hỏi 1: Belmont nêu ba nguyên tắc cơ bản: tôn trọng con người, beneficence và công bằng, tương ứng với đồng thuận thông tin, đánh giá rủi ro và lợi ích, chọn người tham gia."
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e55
  cau: "Câu hỏi 2: Belmont phân tích đồng thuận thành ba yếu tố: thông tin, hiểu được thông tin và tự nguyện."
  loai: phat-hien
- trang: bang-chung/dao-duc-nghien-cuu
  id: e56
  cau: "Câu hỏi 3: Belmont nêu ba điều kiện cho việc không tiết lộ đầy đủ: thật sự cần thiết cho mục tiêu nghiên cứu, không rủi ro ẩn nào hơn mức tối thiểu, và có kế hoạch giải thích sau khi thích hợp."
  loai: phat-hien
