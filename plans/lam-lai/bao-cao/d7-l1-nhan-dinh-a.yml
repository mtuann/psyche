- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n1
  cau: "Mô tả: nỗi buồn thông thường khác rối loạn trầm cảm ở mức độ, độ lan rộng
    và thời gian kéo dài, theo mô tả của ICD-11 và DSM-5-TR."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n2
  cau: Chỉ người có chuyên môn mới chẩn đoán được trầm cảm; bài không dùng để tự
    chẩn đoán (lời dẫn đầu trang, kèm link trang Hỗ trợ).
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n5
  cau: Theo ICD-11, mức độ, độ lan rộng và thời gian kéo dài của triệu chứng, chứ
    không phải việc có hay không có một lý do, phân biệt một giai đoạn trầm cảm
    với nỗi buồn thông thường; trầm cảm vẫn có thể bắt đầu sau một biến cố như
    mất việc hay ly hôn.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n6
  cau: Câu "không còn thấy gì đáng sống" là lý do để tìm sự giúp đỡ sớm (kèm link
    Hỗ trợ).
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n7
  cau: Buồn là phản ứng bình thường trước mất mát, thất bại, thất vọng; ICD-11 ghi
    một mức độ buồn bã là phản ứng bình thường trước biến cố nặng nề (ly hôn,
    mất việc) và rất thường gặp.
  loai: dinh-nghia
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n8
  cau: Theo WHO, trong một giai đoạn trầm cảm, người ta có tâm trạng trầm buồn
    (buồn, dễ cáu, trống rỗng) hoặc mất hứng thú, niềm vui với các hoạt động,
    gần như cả ngày, gần như mỗi ngày, trong ít nhất hai tuần, kèm các triệu
    chứng khác.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n9
  cau: "Trầm cảm có thể ảnh hưởng đến mọi mặt của cuộc sống: học tập, công việc,
    gia đình, bạn bè."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n10
  cau: ICD-11 lưu ý ở một số người, cảm xúc trầm cảm biểu hiện chủ yếu là cáu bẳn
    hay cảm giác trống rỗng hơn là buồn.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n11
  cau: Tính đến 11/2026, WHO ước tính năm 2023 khoảng 5,2% người trưởng thành trên
    thế giới bị trầm cảm, và phụ nữ bị nhiều hơn nam giới khoảng 1,5 lần.
  loai: thoi-su
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n12
  cau: Người có chuyên môn dựa vào ICD-11 của WHO và DSM-5-TR, bản hiệu đính năm
    2022 của Hiệp hội Tâm thần học Hoa Kỳ.
  loai: lich-su
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n13
  cau: ICD-11 và DSM-5-TR mô tả giai đoạn trầm cảm khá giống nhau.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n14
  cau: Mô tả trong bài chỉ để hiểu chung, không phải bảng để tự chấm điểm.
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n15
  cau: "Cần có ít nhất một trong hai dấu hiệu cốt lõi: tâm trạng trầm buồn, hoặc
    mất hẳn hứng thú, niềm vui với các hoạt động vốn thích."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n16
  cau: "Chuyên gia xem xét thêm các triệu chứng: khó tập trung hay khó quyết định;
    cảm giác vô giá trị hay tội lỗi quá mức; tuyệt vọng về tương lai; ý nghĩ lặp
    lại về cái chết; giấc ngủ, thèm ăn hay cân nặng thay đổi rõ; mệt mỏi, thiếu
    năng lượng; bồn chồn hay chậm chạp đến mức người khác nhận thấy."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n17
  cau: Các triệu chứng kéo dài ít nhất hai tuần, gần như mỗi ngày, và gây suy giảm
    rõ trong học tập, công việc, gia đình hay các mối quan hệ; nếu vẫn làm được
    việc thì chỉ nhờ cố gắng nhiều hơn hẳn.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n18
  cau: "Chuyên gia phải loại trừ: bệnh cơ thể (ví dụ rối loạn nội tiết, bệnh thần
    kinh), tác dụng của thuốc, rượu hay chất kích thích, phản ứng tang chế bình
    thường, và rối loạn lưỡng cực (khi từng có giai đoạn hưng cảm)."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n19
  cau: "Chẩn đoán do người có chuyên môn thực hiện: trò chuyện kỹ, hỏi tiền sử,
    khám cơ thể và khi cần làm xét nghiệm để loại trừ bệnh khác."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n20
  cau: Hai người cùng "buồn" có thể ở hai tình trạng rất khác nhau, và người không
    có đủ các dấu hiệu vẫn có thể cần được giúp đỡ.
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n21
  cau: WHO kể tên kích hoạt hành vi, CBT, liệu pháp liên cá nhân (IPT) và liệu
    pháp giải quyết vấn đề là liệu pháp tâm lý hiệu quả với trầm cảm, và xem
    liệu pháp tâm lý là hướng điều trị đầu tiên.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n22
  cau: Liệu pháp có thể làm trực tiếp, trực tuyến, hay qua tài liệu tự giúp có
    người hướng dẫn.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n23
  cau: Theo WHO, thuốc chống trầm cảm có thể dùng kết hợp với liệu pháp tâm lý khi
    trầm cảm ở mức vừa và nặng, và không cần cho trầm cảm nhẹ.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n24
  cau: Hướng dẫn NICE (Anh, 2022) khuyên không dùng thuốc chống trầm cảm thường
    quy làm lựa chọn đầu tiên cho trầm cảm nhẹ hơn, trừ khi người bệnh đã được
    giải thích đủ và muốn vậy.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n25
  cau: Bắt đầu, đổi hay ngừng thuốc là việc của bác sĩ cùng người bệnh, vì thuốc
    có tác dụng phụ và có thể gây triệu chứng khi ngừng.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n26
  cau: NICE xếp chương trình vận động theo nhóm, do người được đào tạo hướng dẫn,
    vào các lựa chọn cho trầm cảm nhẹ hơn.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n27
  cau: Với trầm cảm nặng hơn, lựa chọn đứng đầu trong bảng của NICE là kết hợp CBT
    cá nhân với thuốc chống trầm cảm.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n28
  cau: Hướng điều trị được chọn sau khi người có chuyên môn đánh giá trực tiếp và
    bàn với người bệnh; không có "một liều cho mọi người".
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n29
  cau: Trầm cảm là một rối loạn có thật, được mô tả với tiêu chí rõ ràng trong các
    hệ thống chẩn đoán quốc tế (ICD-11, DSM-5-TR); không chỉ là "buồn nhiều hơn
    bình thường".
  loai: nhan
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n30
  cau: Các phân tích tổng hợp lớn cho thấy CBT (409 thử nghiệm) và các thuốc chống
    trầm cảm (522 thử nghiệm) đều hiệu quả hơn nhóm đối chứng hay giả dược.
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n31
  cau: Kết hợp liệu pháp tâm lý với thuốc tốt hơn chỉ dùng thuốc; nó có tốt hơn
    chỉ dùng liệu pháp tâm lý hay không thì các phân tích tổng hợp chưa thống
    nhất.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n32
  cau: Liệu pháp tâm lý và thuốc chống trầm cảm giúp giảm triệu chứng ở nhiều
    người, nhưng không phải ở tất cả; mức hiệu quả trung bình ở mức vừa, nhỏ đi
    khi chỉ tính các nghiên cứu ít sai lệch, và khác nhau nhiều giữa các người.
  loai: nhan
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n33
  cau: Ý "trầm cảm do thiếu serotonin" từng rất phổ biến; một tổng quan năm 2022
    không tìm thấy bằng chứng nhất quán cho ý này.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n34
  cau: Nhiều nhà nghiên cứu phản bác tổng quan ấy, cho rằng hệ serotonin vẫn có
    liên quan đến trầm cảm.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n35
  cau: Theo WHO, trầm cảm hình thành từ sự tương tác phức tạp giữa các yếu tố xã
    hội, tâm lý và sinh học.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n36
  cau: Nghiên cứu sinh đôi ước tính gen giải thích khoảng 37% khác biệt về nguy cơ
    trầm cảm nặng.
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n37
  cau: "Vai trò cụ thể của serotonin trong trầm cảm: đang tranh cãi."
  loai: nhan
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n38
  cau: 'Ngộ nhận "Trầm cảm là yếu đuối, cố lên là hết" là sai: trầm cảm có thể xảy
    ra với bất kỳ ai, hình thành từ nhiều yếu tố, có cách điều trị hiệu quả; ý
    chí đơn thuần không phải là cách điều trị.'
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n39
  cau: Thuốc chống trầm cảm không gây thèm muốn hay cảm giác "phê" như chất gây
    nghiện, nhưng cơ thể có thể quen thuốc nên khi ngừng, nhất là ngừng đột
    ngột, một số người bị triệu chứng ngừng thuốc.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n40
  cau: NICE ghi rằng phần lớn người dùng ngừng thuốc được, thường bằng cách giảm
    liều dần; mọi thay đổi về thuốc cần bàn với người kê đơn.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n41
  cau: ICD-11 ghi có người trầm cảm vẫn duy trì được công việc, nhưng chỉ nhờ cố
    gắng nhiều hơn hẳn; vẻ ngoài không cho biết tình trạng bên trong.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n42
  cau: Nên cân nhắc tìm người có chuyên môn khi nỗi buồn hay trống rỗng kéo dài từ
    hai tuần trở lên mà không dịu, ảnh hưởng rõ đến học tập, công việc, giấc
    ngủ, ăn uống, các mối quan hệ, hoặc khi thấy "không ổn" kéo dài; không cần
    "đủ nặng".
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n43
  cau: "Có ý nghĩ về cái chết hay tự làm hại bản thân thì tìm giúp đỡ ngay: gọi
    cấp cứu hay đến khoa cấp cứu gần nhất, và nói với một người bạn tin tưởng."
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n45
  cau: Trầm cảm và lo âu thường đi cùng nhau (lời dẫn tới bài Lo âu).
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n47
  cau: Ngưỡng "từ năm triệu chứng trở lên trong chín triệu chứng, trong hai tuần"
    của DSM-5-TR và câu hỏi về ngưỡng ấy.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n48
  cau: "Câu hỏi 1: theo ICD-11, giai đoạn trầm cảm khác nỗi buồn ở mức độ, độ lan
    rộng, thời gian kéo dài (ít nhất hai tuần, gần như mỗi ngày, suy giảm rõ);
    trầm cảm vẫn có thể bắt đầu sau một biến cố."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n49
  cau: "Câu hỏi 2: mô tả chẩn đoán không dùng để tự chẩn đoán vì chẩn đoán cần trò
    chuyện, hỏi tiền sử, loại trừ nguyên nhân khác (bệnh cơ thể, thuốc, chất,
    lưỡng cực, tang chế) và đánh giá suy giảm."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n50
  cau: "Câu hỏi 3: liệu pháp tâm lý (CBT, IPT, kích hoạt hành vi) và thuốc chống
    trầm cảm đều có bằng chứng; hướng điều trị do người có chuyên môn cùng người
    bệnh chọn; WHO xem liệu pháp tâm lý là hướng đầu tiên, thuốc có thể kết hợp
    khi vừa và nặng."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n51
  cau: 'Câu hỏi 4: câu "Cố lên, do em yếu đuối thôi" ít giúp được vì trầm cảm
    không phải dấu hiệu yếu đuối; điều người thân có thể làm là lắng nghe không
    phán xét, kiên nhẫn, khuyến khích và giúp tìm người có chuyên môn.'
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n53
  cau: Mục Nguồn cũ ghi DSM-5-TR "5/9 triệu chứng trong hai tuần" và NICE NG222
    "SSRI/SNRI là thuốc đầu tay cho trầm cảm trung bình–nặng"; dòng "Trang Hỗ
    trợ của Psyche Zero" nằm trong mục Nguồn.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n1
  cau: "Mô tả: lo lắng bình thường khác rối loạn lo âu thế nào theo ICD-11 và
    DSM-5-TR (lo âu lan tỏa, hoảng sợ, lo âu xã hội); vòng luẩn quẩn tránh né;
    các hướng điều trị ở mức giới thiệu chung."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n2
  cau: Chỉ người có chuyên môn mới chẩn đoán được rối loạn lo âu; bài không dùng
    để tự chẩn đoán (lời dẫn đầu trang, link Hỗ trợ).
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n5
  cau: Lo lắng tương xứng với tình huống và tự hết khác với lo lắng quá mức, khó
    kiểm soát, kéo dài, lan sang nhiều mặt cuộc sống; đó là kiểu lo lắng các hệ
    thống chẩn đoán dùng để mô tả rối loạn lo âu khi nó gây khổ sở hay suy giảm
    rõ.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n6
  cau: "Ẩn dụ: lo lắng là hệ thống báo động bình thường; rối loạn lo âu như chiếc
    báo động reo cả lúc không có cháy."
  loai: dinh-nghia
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n7
  cau: Chỉ người có chuyên môn mới đánh giá được ai đó có rối loạn lo âu hay không
    (trong hộp thu gọn).
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n8
  cau: ICD-11 ghi rằng ở mức vừa phải, lo âu và lo lắng giúp tập trung giải quyết
    vấn đề và tỉnh táo hơn; lo lắng bình thường thường tự điều chỉnh được, không
    cản trở cuộc sống.
  loai: dinh-nghia
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n9
  cau: Rối loạn khi nỗi sợ hay lo lắng mạnh, quá mức, kéo dài, khó kiểm soát, gây
    khổ sở hay cản trở việc học, việc làm, gia đình và các mối quan hệ.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n10
  cau: Tính đến 11/2026, WHO ước tính năm 2023 có khoảng 470 triệu người trên thế
    giới bị rối loạn lo âu, nhiều hơn mọi nhóm rối loạn tâm thần khác, và chỉ
    khoảng 1 trong 4 người cần điều trị được điều trị.
  loai: thoi-su
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n11
  cau: Có nhiều rối loạn lo âu khác nhau, tùy nỗi sợ tập trung vào đâu; ba dạng
    thường được nhắc là lo âu lan tỏa, hoảng sợ, lo âu xã hội.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n12
  cau: 'Rối loạn lo âu lan tỏa: lo lắng quá mức về nhiều chuyện của đời sống hằng
    ngày hoặc bất an không gắn với chuyện cụ thể; kèm căng cơ, bồn chồn, "căng
    như dây đàn", khó tập trung, dễ cáu, khó ngủ, tim đập nhanh, đổ mồ hôi, buồn
    nôn; theo ICD-11 kéo dài ít nhất vài tháng, phần lớn các ngày.'
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n13
  cau: "Rối loạn hoảng sợ: cơn hoảng sợ lặp lại, ít nhất một số cơn đến bất ngờ;
    cơn là đợt sợ dữ dội ập đến nhanh, kèm tim đập nhanh, khó thở, đau ngực,
    chóng mặt, sợ mất kiểm soát hay sắp chết; sau đó lo lắng kéo dài về cơn trở
    lại hay ý nghĩa của nó (ví dụ sợ đau tim), hoặc thay đổi cách sống để tránh
    cơn (ví dụ chỉ ra khỏi nhà khi có người đi cùng)."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n14
  cau: "Rối loạn lo âu xã hội (còn gọi ám ảnh sợ xã hội): nỗi sợ rõ rệt, quá mức
    trong tình huống xã hội như trò chuyện, ăn uống khi bị nhìn, thuyết trình,
    vì sợ bị đánh giá tiêu cực, chê cười hay từ chối; né tránh hay chịu đựng
    trong lo sợ; kéo dài (ICD-11: ví dụ ít nhất vài tháng; APA theo DSM-5-TR: ít
    nhất sáu tháng)."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n15
  cau: Mô tả ba dạng là mô tả chung, không phải bảng để tự chấm điểm.
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n16
  cau: "Chuyên gia phải loại trừ: bệnh cơ thể (ví dụ cường giáp), tác dụng của cà
    phê, thuốc, rượu hay chất kích thích (kể cả khi ngừng dùng), hay một rối
    loạn khác giải thích tốt hơn."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n17
  cau: Một cơn hoảng sợ đơn lẻ, hay sự hồi hộp khi phải nói trước đám đông, rất
    thường gặp và tự nó chưa phải là rối loạn.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n18
  cau: Rối loạn lo âu hay đi cùng trầm cảm.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n19
  cau: Các mô hình nhận thức – hành vi nhấn mạnh tránh né là một cơ chế duy trì lo
    âu.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n20
  cau: 'Vòng tránh né: tránh cho nhẹ nhõm, sự nhẹ nhõm "thưởng" hành vi tránh, và
    mỗi lần tránh là mất cơ hội học rằng thứ đó không nguy hiểm; càng sợ càng
    tránh càng sợ hơn.'
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n21
  cau: 'Với rối loạn lo âu, "tránh hẳn thứ gây sợ" có thể giữ nỗi sợ lại lâu dài;
    liệu pháp tiếp xúc làm ngược lại: đối mặt có kế hoạch, có kiểm soát để học
    lại rằng báo động reo nhầm.'
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n22
  cau: Các nhà nghiên cứu lưu ý không phải mọi hành vi tránh đều có hại; tùy mục
    đích, có lúc tránh né là một cách đối phó hợp lý.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n23
  cau: WHO ghi các liệu pháp tâm lý dựa trên nguyên tắc CBT, gồm liệu pháp tiếp
    xúc, có nhiều bằng chứng nhất cho nhiều rối loạn lo âu.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n24
  cau: NICE khuyên CBT cho rối loạn hoảng sợ, CBT cá nhân cho lo âu xã hội, và CBT
    hay thư giãn ứng dụng cho lo âu lan tỏa; với lo âu lan tỏa, NICE giới thiệu
    các bước nhẹ hơn trước như tự giúp có hướng dẫn.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n25
  cau: Theo WHO, thuốc chống trầm cảm như nhóm SSRI có thể hữu ích cho người lớn
    bị rối loạn lo âu.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n26
  cau: NICE xếp thuốc là một lựa chọn bên cạnh liệu pháp tâm lý cho lo âu lan tỏa,
    và là lựa chọn cho người không muốn hay không dùng được CBT với lo âu xã
    hội; chỉ bác sĩ kê đơn và theo dõi thuốc.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n27
  cau: WHO ghi thuốc an thần nhóm benzodiazepine nhìn chung không được khuyên dùng
    cho rối loạn lo âu, vì nguy cơ lệ thuộc cao và hiệu quả lâu dài hạn chế;
    NICE chỉ chấp nhận dùng ngắn hạn trong khủng hoảng với lo âu lan tỏa, và
    khuyên không dùng cho rối loạn hoảng sợ.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n28
  cau: Tiếp xúc trong trị liệu được lên kế hoạch cùng người có chuyên môn, thường
    đi từng bước, phù hợp với từng người; khác với việc bị người khác ép vào
    tình huống đáng sợ.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n29
  cau: Các rối loạn lo âu là những rối loạn có thật, được mô tả với tiêu chí rõ
    ràng (loại nỗi sợ, thời gian, mức khổ sở hay suy giảm, tình trạng loại trừ)
    trong ICD-11 và DSM-5-TR.
  loai: nhan
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n30
  cau: Một phân tích tổng hợp 41 thử nghiệm có nhóm giả dược (2.843 người) thấy
    CBT hiệu quả hơn giả dược ở mức vừa; hiệu quả lớn với lo âu lan tỏa, nhỏ đến
    vừa với lo âu xã hội và rối loạn hoảng sợ; liệu pháp chủ yếu dùng tiếp xúc
    có hiệu quả lớn hơn một chút nhưng chưa có ý nghĩa thống kê.
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n31
  cau: Một phần đáng kể người bệnh chưa đỡ hay bị tái phát nỗi sợ sau trị liệu
    tiếp xúc.
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n32
  cau: "CBT, nhất là các kỹ thuật tiếp xúc, giảm triệu chứng của nhiều rối loạn lo
    âu: khá vững."
  loai: nhan
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n33
  cau: Theo WHO, rối loạn lo âu là kết quả của sự tương tác phức tạp giữa yếu tố
    xã hội, tâm lý và sinh học; người từng bị bạo hành, mất mát nặng hay trải
    nghiệm bất lợi dễ bị hơn.
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n34
  cau: Phân tích tổng hợp các nghiên cứu sinh đôi ước tính gen giải thích khoảng
    43% khác biệt về nguy cơ rối loạn hoảng sợ và 32% với lo âu lan tỏa; phần
    còn lại phần lớn đến từ trải nghiệm riêng của mỗi người.
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n35
  cau: Rối loạn lo âu hình thành từ nhiều yếu tố cùng tác động (gen, trải nghiệm,
    hoàn cảnh); ở mỗi người cụ thể, chưa thể tách rõ yếu tố nào góp bao nhiêu.
  loai: nhan
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n36
  cau: 'Ngộ nhận "Tránh hẳn thứ gây sợ là cách tốt nhất": thường là không; với rối
    loạn lo âu, tránh né có thể giữ nỗi sợ lâu dài; đối mặt có kế hoạch, cùng
    người có chuyên môn, là cốt lõi của liệu pháp tiếp xúc.'
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n37
  cau: 'Ngộ nhận "chỉ cần bình tĩnh, hít thở sâu": kỹ năng thư giãn có thể giúp
    giảm triệu chứng, nhưng rối loạn lo âu là tình trạng kéo dài, khó kiểm soát;
    điều trị có bằng chứng là các liệu pháp có cấu trúc như CBT, và khi cần là
    thuốc do bác sĩ kê.'
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n38
  cau: 'Ngộ nhận "tự uống thuốc an thần là được": benzodiazepine có nguy cơ lệ
    thuộc cao và WHO nhìn chung không khuyên dùng cho rối loạn lo âu; dùng thuốc
    nào, bao lâu là việc của bác sĩ.'
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n39
  cau: Nên cân nhắc tìm người có chuyên môn khi lo lắng kéo dài, khó kiểm soát,
    khiến né tránh ngày càng nhiều thứ, hay cơ thể như luôn báo động (khó ngủ,
    căng cơ, mệt); không cần "đủ nặng".
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n40
  cau: "Cơn hoảng sợ có thể giống cơn đau tim; đau ngực, khó thở dữ dội hay nghĩ
    mình gặp nguy hiểm về sức khỏe thì gọi cấp cứu: chỉ nhân viên y tế mới phân
    biệt được."
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n41
  cau: Có ý nghĩ tự làm hại bản thân thì tìm giúp đỡ ngay; số khẩn cấp và đường
    dây hỗ trợ ở trang Hỗ trợ.
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n43
  cau: "Câu hỏi 1: rối loạn lo âu là nỗi sợ, lo lắng quá mức, khó kiểm soát, kéo
    dài, gây khổ sở hay suy giảm rõ; lo lắng bình thường tương xứng và tự hết;
    chỉ người có chuyên môn đánh giá được."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n44
  cau: "Câu hỏi 2: tránh né có thể giữ lo âu lâu dài vì nhẹ nhõm tức thì thưởng
    hành vi tránh và lấy mất cơ hội học rằng thứ đó không nguy hiểm."
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n45
  cau: "Câu hỏi 3: theo ICD-11, rối loạn hoảng sợ có các cơn lặp lại, một số cơn
    bất ngờ, kèm lo lắng kéo dài về cơn tiếp theo hay thay đổi cách sống để
    tránh cơn, gây suy giảm rõ; cơn hoảng sợ đơn lẻ khá thường gặp và chưa phải
    rối loạn."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n46
  cau: "Câu hỏi 4: liệu pháp dựa trên CBT, gồm tiếp xúc, có nhiều bằng chứng nhất;
    SSRI có thể hữu ích, do bác sĩ kê; benzodiazepine nhìn chung không được
    khuyên dùng; WHO và NICE đặt CBT ở vị trí trung tâm."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n47
  cau: "Câu hỏi 5: với người bạn ngày càng ít ra khỏi nhà vì sợ lên cơn, điều hữu
    ích là lắng nghe không phán xét, không ép, khuyến khích tìm người có chuyên
    môn, vì tránh né ngày càng rộng có thể làm nỗi sợ bám lâu hơn."
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n48
  cau: Mục Nguồn cũ ghi chú thích DSM-5-TR (lo âu lan tỏa ≥6 tháng, 3/6 triệu
    chứng; hoảng sợ ≥1 tháng; lo âu xã hội ≥6 tháng), NICE CG113, và dòng tham
    chiếu trang Hỗ trợ.
  loai: lam-sang
