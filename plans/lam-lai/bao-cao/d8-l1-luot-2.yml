- trang: trai-nghiem/index
  id: n1
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC5990556", "https://pmc.ncbi.nlm.nih.gov/articles/PMC2978794"]
  trich: "Hedge và cộng sự: độ tin cậy test-retest của nhiều bài nhận thức (kể cả Stroop) dưới 0,8; Woods: dãy chữ số lặp lại sau 5–11 ngày lệch trung bình khoảng 0,9 chữ số."
  ghi_chu: "Câu mang tính thận trọng, phù hợp bằng chứng về độ tin cậy."
- trang: trai-nghiem/stroop
  id: n1
  luot_2: dung
  nguon: ["https://uwaterloo.ca/memory-attention-cognition-lab/sites/default/files/uploads/files/strooprev_0.pdf", "https://psychclassics.yorku.ca/Stroop/"]
  trich: "Stroop (1935) và MacLeod (1991): đọc chữ nhanh hơn gọi tên màu; đọc là phản ứng chiếm ưu thế."
- trang: trai-nghiem/stroop
  id: n2
  luot_2: dung
  nguon: ["https://uwaterloo.ca/memory-attention-cognition-lab/sites/default/files/uploads/files/strooprev_0.pdf"]
  trich: "MacLeod (1991): lượt mâu thuẫn chậm hơn và nhiều lỗi hơn lượt không mâu thuẫn; hai cách giải thích cũ (tốc độ, tự động) được đánh giá là chưa đủ."
- trang: trai-nghiem/stroop
  id: n3
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Stroop/"]
  trich: "\"took an average of 2.3 seconds longer\"; 70 sinh viên; 5,6%; \"This difference is not reliable.\""
- trang: trai-nghiem/stroop
  id: n4
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Stroop/"]
  trich: "100 sinh viên; \"mean time for 100 responses is increased from 63.3 seconds to 110.3 seconds\"; tăng 74%."
  ghi_chu: "Mỗi thẻ 200 phản ứng, nhưng số trung bình tính theo 100 phản ứng; câu viết \"mỗi thẻ 100 mục\" khớp phần số liệu được báo cáo."
- trang: trai-nghiem/stroop
  id: n5
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Stroop/", "https://uwaterloo.ca/memory-attention-cognition-lab/sites/default/files/uploads/files/strooprev_0.pdf"]
  trich: "MacLeod: bất đối xứng: chữ ảnh hưởng mạnh việc gọi tên màu, màu gần như không ảnh hưởng việc đọc chữ."
- trang: trai-nghiem/stroop
  id: n6
  luot_2: dung
  nguon: ["https://uwaterloo.ca/memory-attention-cognition-lab/sites/default/files/uploads/files/strooprev_0.pdf"]
  trich: "\"covering over 50 years and some 400 studies ... a set of 18 reliable empirical findings\"."
- trang: trai-nghiem/stroop
  id: n7
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6709679"]
  trich: "Bảng 1: chênh lệch BLUE green − XXXX green: bấm phím 76 và 73 ms, nói to 155 và 168 ms (thí nghiệm 1 và 2)."
- trang: trai-nghiem/stroop
  id: n8
  luot_2: dung
  nguon: ["https://uwaterloo.ca/memory-attention-cognition-lab/sites/default/files/uploads/files/strooprev_0.pdf", "https://gwern.net/doc/statistics/bias/2020-olssoncollentine.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC5990556"]
  trich: "MacLeod: khoảng 400 nghiên cứu; Many Labs 3: hiệu ứng Stroop ở 21 mẫu, r = 0,41, dị biệt gần bằng 0 (Olsson-Collentine và cộng sự)."
  ghi_chu: "chỗ khó: thước đo Vững chắc cần phân tích tổng hợp hay hai tái lập lớn có đăng ký trước. Tôi không tìm thấy phân tích tổng hợp riêng cho hiệu ứng Stroop cơ bản; căn cứ là tổng quan tường thuật của MacLeod (khoảng 400 nghiên cứu) cộng một tái lập lớn có đăng ký trước (Many Labs 3, 21 mẫu). Giữ Vững chắc vì hiệu ứng cơ bản bền ở mọi bối cảnh đã thử, nhưng người giao nên xem lại; cụm \"một trong những phát hiện được tái lập nhiều nhất\" không có nguồn đếm trực tiếp, nên bỏ hoặc làm mềm."
- trang: trai-nghiem/stroop
  id: n9
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC5990556"]
  trich: "Stroop RT cost ICC 0,60 và 0,66 (hai lần cách 3 tuần); \"None of the behavioral measures ... exceeded reliabilities of .8, typically considered excellent or of a clinically required standard\"; tên bài \"reliability paradox\"."
- trang: trai-nghiem/stroop
  id: n10
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC5990556"]
  trich: "Hedge và cộng sự: tác vụ cho hiệu ứng nhóm vững thì phương sai giữa người thấp, nên độ tin cậy cho khác biệt cá nhân thấp."
- trang: trai-nghiem/stroop
  id: n11
  luot_2: dung
  nguon: ["https://uwaterloo.ca/memory-attention-cognition-lab/sites/default/files/uploads/files/strooprev_0.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6709679"]
  trich: "MacLeod: tốc độ xử lý và tự động hoá đều được đánh giá là chưa đủ; lý thuyết xử lý song song được cho là hứa hẹn hơn; Augustinova: cần mô hình nhiều giai đoạn."
  ghi_chu: "Câu đã nói thận trọng (\"không loại trừ nhau, tranh luận tiếp tục\")."
- trang: trai-nghiem/stroop
  id: n12
  luot_2: dung
  nguon: ["https://uwaterloo.ca/memory-attention-cognition-lab/sites/default/files/uploads/files/strooprev_0.pdf"]
  trich: "MacLeod (1991): đọc là quá trình tự động, can thiệp vào việc gọi tên màu; kìm lại tốn thời gian."
  ghi_chu: "Nói chung đúng; lưu ý MacLeod cho rằng \"tự động\" một mình chưa đủ giải thích Stroop, nhưng câu không khẳng định điều ấy."
- trang: trai-nghiem/stroop
  id: n13
  luot_2: dung
  nguon: ["https://doi.org/10.1177/1529100616661983"]
  trich: "Simons và cộng sự (2016): các bài luyện \"brain-training\" cải thiện chính bài luyện, bằng chứng chuyển sang nhiệm vụ xa hay nhận thức hằng ngày còn rất ít."
- trang: trai-nghiem/stroop
  id: n14
  luot_2: dung
  nguon: ["https://en.wiktionary.org/wiki/xanh"]
  trich: "Wiktionary: \"xanh\" = \"grue\" (green or blue); xanh lá cây và xanh dương là các từ phân biệt."
  ghi_chu: "Chỉ có nguồn bậc 3 cho định nghĩa từ vựng; điều này hiển nhiên với người Việt, đủ cho một câu định nghĩa."
- trang: trai-nghiem/stroop
  id: n15
  luot_2: qua-manh
  nguon: ["https://doi.org/10.2466/pms.1999.89.1.173", "https://doi.org/10.2466/pms.1990.71.1.249"]
  trich: "Có các nghiên cứu Stroop tiếng Việt đã công bố: Perceptual and Motor Skills 1999 (30 người Mỹ gốc Việt so 30 người nói tiếng Anh); 1990 (Quốc ngữ, Chữ Nôm, chữ Hán); 2019 (học sinh lớp 1, Hà Nội)."
  cau_dung: "Tính đến 11/2026, chúng tôi chưa tìm thấy bộ số liệu chuẩn (theo tuổi, học vấn) được công bố cho bài Stroop tiếng Việt ở người lớn; chỉ có một số nghiên cứu Stroop tiếng Việt cỡ nhỏ (1990, 1999 với 30 người Mỹ gốc Việt, 2019 với học sinh lớp 1)."
  ghi_chu: "Câu \"chưa tìm thấy số liệu chuẩn\" có thể đúng với số liệu chuẩn theo tuổi/học vấn cho người lớn, nhưng đã có nghiên cứu Stroop tiếng Việt cỡ nhỏ; không mở được nội dung bài 2019. Câu cần nêu rõ phạm vi \"số liệu chuẩn theo tuổi\" để không bị hiểu là chưa có nghiên cứu nào."
- trang: trai-nghiem/stroop
  id: n16
  luot_2: dung
  nguon: ["https://uwaterloo.ca/memory-attention-cognition-lab/sites/default/files/uploads/files/strooprev_0.pdf"]
  trich: "MacLeod (1991) điểm lại nghiên cứu Stroop với tiếng Anh, Tây Ban Nha, chữ Hán, Kanji, người song ngữ."
- trang: trai-nghiem/stroop
  id: n17
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC7512138"]
  trich: "\"in many studies the ultimate outcome measure is a difference between two or more conditions, and hence any constant error is canceled out\"; ví dụ Stroop."
  ghi_chu: "Sai số thay đổi giữa các lượt (jitter) thì không triệt tiêu; câu chỉ nói về độ trễ gần như đều nên đúng."
- trang: trai-nghiem/stroop
  id: n18
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6873370"]
  trich: "Counting Stroop (Bush và cộng sự, 1998): báo số từ trên màn hình bằng phím; lượt nhiễu dùng từ chỉ số mâu thuẫn với đáp án."
- trang: trai-nghiem/stroop
  id: n20
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6709679"]
  trich: "Augustinova và cộng sự (2019): một bộ phận (miệng) cho đáp án vocal; với phím bấm có nhiều bộ phận khác nhau; nói to cho hiệu ứng lớn hơn."
  ghi_chu: "Câu viết \"một cách giải thích\", đúng; so thẳng với 74% của Stroop (1935) không nên vì khác thiết kế (nền so sánh khác, nói to)."
- trang: trai-nghiem/stroop
  id: n19
  luot_2: dung
  nguon: ["https://doi.org/10.1098/rsos.190831"]
  trich: "\"RTs entail some degrees of freedom ... due to their skewed distribution\"."
  ghi_chu: "Nguồn bậc 2 nói phân bố RT lệch; ưu điểm của trung vị là kiến thức thống kê chuẩn."
- trang: trai-nghiem/do-dai-tri-nho
  id: n1
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC2978794", "https://oppimistiede.fi/wp-content/uploads/2025/06/02-Cowan-2010-The-magical-mystery-four-How-is-working-memory-capacity-limited.pdf"]
  trich: "Woods: digit span đo trí nhớ ngắn hạn bằng lời/trí nhớ làm việc; Cowan (2010): giới hạn vài chục mục, đo trí nhớ làm việc."
- trang: trai-nghiem/do-dai-tri-nho
  id: n2
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC2978794"]
  trich: "Woods: dãy ngược dự đoán các bài thần kinh-tâm lý tốt hơn dãy xuôi; ngược tương quan âm với tuổi, xuôi thì không."
  ghi_chu: "\"Thường được coi là gần trí nhớ làm việc hơn\" là cách nhìn phổ biến, vẫn có tranh luận; câu đã dùng \"thường được coi\"."
- trang: trai-nghiem/do-dai-tri-nho
  id: n3
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC2978794"]
  trich: "Thí nghiệm 2: 763 người 18–65 tuổi ở Rotorua; xuôi 6,35 (TE-ML) và 6,52 (MS); ngược thấp hơn xuôi 1,74 chữ số ở TE-ML; đọc to qua tai nghe."
- trang: trai-nghiem/do-dai-tri-nho
  id: n4
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC2978794"]
  trich: "\"similar to ... WMS-III control data ... FS (6.4 vs. 6.6 digits) and BS (4.6 vs. 4.9 digits)\"."
- trang: trai-nghiem/do-dai-tri-nho
  id: n5
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC2978794"]
  trich: "Thí nghiệm 1: 30 người (31 trừ 1), 18–46 tuổi; xuôi MS 7,41; ngược TE-ML 5,80 và MS 6,00."
- trang: trai-nghiem/do-dai-tri-nho
  id: n6
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC2978794"]
  trich: "Ngược tương quan âm nhỏ với tuổi (r = −0,13 đến −0,14), xuôi không; cả hai tương quan dương với số năm học (r = 0,11–0,20)."
  ghi_chu: "Mức tương quan nhỏ; \"giảm dần theo tuổi\" đúng chiều nhưng yếu."
- trang: trai-nghiem/do-dai-tri-nho
  id: n7
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC2978794"]
  trich: "Chữ số ghi âm đọc qua tai nghe, người tham gia nhắc lại bằng lời; chỉ người đọc, viết được tiếng Anh."
- trang: trai-nghiem/do-dai-tri-nho
  id: n8
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC2978794"]
  trich: "Với dãy ngược, độ dài dao động 0–3 chữ số giữa các ngày, chênh tuyệt đối trung bình 0,93 chữ số."
- trang: trai-nghiem/do-dai-tri-nho
  id: n9
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Miller/", "https://oppimistiede.fi/wp-content/uploads/2025/06/02-Cowan-2010-The-magical-mystery-four-How-is-working-memory-capacity-limited.pdf"]
  trich: "Cowan (2010): Miller (1956) nêu khoảng bảy mục; Cowan ước lượng 3–5 mục (3–4 chunk)."
  ghi_chu: "Hai tên và hai con số là kiến thức lịch sử chuẩn; đã đối chiếu qua bản Miller trên psychclassics và Cowan (2010), không đọc lại Cowan (2001)."
- trang: trai-nghiem/do-dai-tri-nho
  id: n10
  luot_2: qua-manh
  nguon: ["https://oppimistiede.fi/wp-content/uploads/2025/06/02-Cowan-2010-The-magical-mystery-four-How-is-working-memory-capacity-limited.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC2978794"]
  trich: "Cowan (2010): người ta nhớ được khoảng bảy nhờ tập lặp thầm và tạo chunk, những cơ chế \"người ta có thể áp dụng\"; không nói là tự động."
  cau_dung: "Ta vẫn nhớ được 6–7 chữ số nhờ nhóm chúng lại thành cụm (như \"0912 345 678\" là ba cụm) và nhẩm lặp thầm."
  ghi_chu: "\"Tự động nhóm\" không có nguồn; nhóm là chiến lược có thể có ý thức."
- trang: trai-nghiem/do-dai-tri-nho
  id: n11
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC2978794", "https://oppimistiede.fi/wp-content/uploads/2025/06/02-Cowan-2010-The-magical-mystery-four-How-is-working-memory-capacity-limited.pdf"]
  trich: "Woods (763 người, so bộ chuẩn WMS-III) và Cowan (2010): giới hạn nhỏ."
  ghi_chu: "chỗ khó: thước đo Vững chắc cần phân tích tổng hợp hay tái lập lớn. Căn cứ ở đây là số đo mô tả trên mẫu lớn và bộ chuẩn Wechsler, hơn là một phân tích tổng hợp; vì câu là nhận định mô tả (không phải hiệu ứng nhân quả) tôi giữ dung, nhưng người giao nên xem lại."
- trang: trai-nghiem/do-dai-tri-nho
  id: n12
  luot_2: khong-chac
  nguon: ["https://oppimistiede.fi/wp-content/uploads/2025/06/02-Cowan-2010-The-magical-mystery-four-How-is-working-memory-capacity-limited.pdf"]
  trich: "Cowan (2010): giới hạn trung tâm 3–5 chunk ở người trẻ, lý do còn chưa rõ, và có người cho rằng \"just depends\"."
  ghi_chu: "chỗ khó: nhãn Khá vững hợp với bằng chứng (Cowan 2001/2010, nhiều nghiên cứu nhưng không có phân tích tổng hợp, còn tranh luận). Nhưng chi tiết \"một tổng quan của 16 nhà nghiên cứu coi 3–4 cụm là chuẩn mực có điều kiện\" tôi không tìm ra bài nào để đối chiếu; cần lượt 1 đưa trích dẫn cụ thể."
- trang: trai-nghiem/do-dai-tri-nho
  id: n13
  luot_2: dung
  nguon: ["https://doi.org/10.3758/s13421-017-0770-8"]
  trich: "Mattys và cộng sự (2017): có liên hệ có hệ thống giữa tốc độ phát âm và độ dài dãy qua nhiều ngôn ngữ (Naveh-Benjamin & Ayres, 1986; Elliott, 1992)."
  ghi_chu: "Mối liên hệ chiều đúng nhưng không giải thích hết (hiệu ứng độ dài từ có bài không tái lập: Lovatt, Avons & Masterson, 2000); câu nên nói \"thường\"."
- trang: trai-nghiem/do-dai-tri-nho
  id: n14
  luot_2: qua-manh
  nguon: ["https://doi.org/10.3758/s13421-017-0770-8"]
  trich: "Ellis & Hennelly (1980): người Wales song ngữ có dãy tiếng Anh dài hơn tiếng Wales; Murray & Jones (2002): do nối âm giữa các từ, không phải thời gian đọc từng chữ số."
  cau_dung: "Ở người song ngữ xứ Wales, tên chữ số tiếng Wales dài hơn và độ dài trí nhớ chữ số bằng tiếng Wales ngắn hơn; Ellis và Hennelly (1980) cho là do độ dài từ chứ không do trí thông minh, nhưng nghiên cứu sau (Murray và Jones, 2002) cho rằng khác biệt nối âm giữa các từ cũng đóng vai trò."
  ghi_chu: "Phần \"do độ dài từ\" là cách giải thích của tác giả 1980; nghiên cứu sau cho rằng nguyên nhân phức tạp hơn."
- trang: trai-nghiem/do-dai-tri-nho
  id: n15
  luot_2: dung
  nguon: ["https://doi.org/10.3758/s13421-017-0770-8"]
  trich: "Stigler, Lee và Stevenson (1986) theo Mattys: trẻ Trung Quốc nhớ nhiều hơn trẻ Mỹ và Nhật ít nhất hai chữ số."
  ghi_chu: "Chỉ đọc qua nguồn bậc 2 (Mattys và cộng sự); bài gốc không mở được. Khác biệt nhỏ ở dãy ngược; câu nói về xuôi nên đúng."
- trang: trai-nghiem/do-dai-tri-nho
  id: n16
  luot_2: dung
  nguon: ["https://en.wiktionary.org/wiki/xanh"]
  trich: "Chữ số tiếng Việt viết rời từng âm tiết: một, hai, ba, bốn, năm, sáu, bảy, tám, chín."
  ghi_chu: "Nguồn bậc 3 và kiến thức ngôn ngữ chuẩn; không cần nguồn chuyên đề."
- trang: trai-nghiem/do-dai-tri-nho
  id: n17
  luot_2: dung
  nguon: ["https://doi.org/10.3758/s13421-017-0770-8"]
  trich: "Câu tự nêu là suy luận và có căn cứ từ liên hệ tốc độ phát âm-độ dài dãy."
  ghi_chu: "Chưa có dữ liệu tiếng Việt; câu đã gắn nhãn \"mới là suy luận\"."
- trang: trai-nghiem/do-dai-tri-nho
  id: n18
  luot_2: sai
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC12752475"]
  trich: "Nguyen và cộng sự (2025): 385 người từ 40 tuổi ở TP.HCM; Digit Span (Wechsler 2008) \"Variables of interest are the longest correct number of sequential digits\"."
  cau_dung: "Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào so sánh điều này ở người Việt; bộ chuẩn tiếng Việt cho bài nhắc lại chữ số mà chúng tôi tìm thấy (người từ 40 tuổi, 385 người, Nguyen và cộng sự, 2025) tính theo độ dài dãy đúng dài nhất, nhưng không so sánh với tiếng Anh."
  ghi_chu: "chỗ khó: nghiên cứu này dùng độ dài dãy đúng dài nhất, không dùng số lượt đúng; câu hiện tại viết ngược. Phần \"chưa tìm thấy nghiên cứu so sánh ở người Việt\" tìm trên OpenAlex không thấy gì."
- trang: trai-nghiem/do-dai-tri-nho
  id: n19
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC2978794", "https://oppimistiede.fi/wp-content/uploads/2025/06/02-Cowan-2010-The-magical-mystery-four-How-is-working-memory-capacity-limited.pdf"]
  trich: "Cowan (2010): chunk và nhẩm lặp tăng khả năng nhớ; Woods: đo trí nhớ ngắn hạn có hạn."
  ghi_chu: "Lời khuyên suy ra từ giới hạn trí nhớ ngắn hạn, đúng chiều bằng chứng; câu đã ghi rõ là suy ra."
- trang: trai-nghiem/do-dai-tri-nho
  id: n20
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC2978794", "https://pmc.ncbi.nlm.nih.gov/articles/PMC5990556"]
  trich: "Woods: digit span nằm trong các bộ Wechsler; Hedge: độ tin cậy test-retest của nhiều bài nhận thức chưa đạt mức dùng đánh giá cá nhân."
- trang: trai-nghiem/ao-giac-thi-giac
  id: n1
  luot_2: dung
  nguon: ["https://osf.io/y7mtf/download"]
  trich: "Amir & Firestone (2026, Psychological Review): đoạn có cánh hướng vào trông dài hơn khi cùng độ dài; Müller-Lyer mô tả năm 1889."
- trang: trai-nghiem/ao-giac-thi-giac
  id: n2
  luot_2: dung
  nguon: ["https://osf.io/y7mtf/download"]
  trich: "Gregory: cánh như góc 3 chiều; thuyết trung bình (centroid) và thuyết \"confusion\" là cách khác; các cách giải thích còn được bàn."
- trang: trai-nghiem/ao-giac-thi-giac
  id: n3
  luot_2: dung
  nguon: ["https://osf.io/y7mtf/download", "https://www2.psych.ubc.ca/~henrich/pdfs/WeirdPeople.pdf"]
  trich: "Segall, Campbell và Herskovits (1963, 1966) trên 16 nhóm, khoảng 2.000 người, báo cáo khác biệt về độ mạnh."
- trang: trai-nghiem/ao-giac-thi-giac
  id: n4
  luot_2: dung
  nguon: ["https://www2.psych.ubc.ca/~henrich/pdfs/WeirdPeople.pdf"]
  trich: "\"undergraduates required that line a be about a fifth longer ... the San foragers of the Kalahari were unaffected ... PSE ... cannot be distinguished from zero\"."
- trang: trai-nghiem/ao-giac-thi-giac
  id: n5
  luot_2: dung
  nguon: ["https://doi.org/10.1016/j.neuropsychologia.2008.10.031", "https://osf.io/y7mtf/download"]
  trich: "Bruno & Franz (2009): rà soát định lượng 18 nghiên cứu; tác động lên tri giác lớn hơn lên cầm nắm; \"almost all grasping effects are larger than zero\"; Amir & Firestone: hiện ở nhiều loài, nhiều giác quan."
  ghi_chu: "chỗ khó: thước đo Vững chắc cần phân tích tổng hợp; rà soát định lượng 18 nghiên cứu chỉ về phần cầm nắm. Phần \"ảo giác mạnh, tái lập rộng\" dựa trên hơn một thế kỷ nghiên cứu và tổng quan 2026 (hiện ở nhiều loài); độ lớn thì khác nhau giữa các nhóm người (khung kế bên). Giữ dung vì hiệu ứng tri giác này không bị thách thức; người giao nên xem lại."
- trang: trai-nghiem/ao-giac-thi-giac
  id: n6
  luot_2: dung
  nguon: ["https://osf.io/y7mtf/download", "https://doi.org/10.1037/rev0000549"]
  trich: "\"we argue that it is almost certainly false\"; \"the evidence for cultural variation ... is in fact highly inconsistent, beset by questionable research practices\"; số tạp chí tập 133, số 5, 2026 (online 2025)."
  ghi_chu: "Câu đã nêu là \"một phân tích lại cho rằng\", đúng; nhãn Đang tranh cãi hợp lý."
- trang: trai-nghiem/ao-giac-thi-giac
  id: n7
  luot_2: dung
  nguon: ["https://doi.org/10.1016/j.neuropsychologia.2008.10.031"]
  trich: "Bruno & Franz (2009) nhắc \"the angle of the illusion fins\" là yếu tố chi phối độ lớn hiệu ứng."
  ghi_chu: "Phần \"độ dài cánh\" là kiến thức chuẩn trong tài liệu ảo giác này, nhưng tóm tắt đã mở chỉ nêu rõ góc."
- trang: trai-nghiem/mu-thay-doi
  id: n1
  luot_2: dung
  nguon: ["https://www.cs.ubc.ca/~rensink/flicker/index.html", "https://homepage.villanova.edu/diego.fernandezduque/Teaching/CognitivePsychology/Lectures_and_Labs/s3Attention/sReading/Rensink_etal_97.pdf"]
  trich: "Rensink: màn trống \"swamps the local motion signals\"; chú ý phải tìm \"object by object\"; thay đổi lớn vẫn khó thấy nhiều giây."
- trang: trai-nghiem/mu-thay-doi
  id: n2
  luot_2: dung
  nguon: ["https://homepage.villanova.edu/diego.fernandezduque/Teaching/CognitivePsychology/Lectures_and_Labs/s3Attention/sReading/Rensink_etal_97.pdf"]
  trich: "\"17.1 alternations (10.9 s)\" cho vùng ít quan tâm; \"7.3 alternations (4.7 s)\" cho vùng được quan tâm."
- trang: trai-nghiem/mu-thay-doi
  id: n3
  luot_2: dung
  nguon: ["https://homepage.villanova.edu/diego.fernandezduque/Teaching/CognitivePsychology/Lectures_and_Labs/s3Attention/sReading/Rensink_etal_97.pdf"]
  trich: "\"for some images, observers required more than 80 alternations (50 s)\"."
- trang: trai-nghiem/mu-thay-doi
  id: n4
  luot_2: dung
  nguon: ["https://www2.psych.ubc.ca/~rensink/publications/download/RR-MGY.pdf"]
  trich: "\"Each image is typically on for about half a second, while the blanks are on for a quarter second or so ... 10 or 20 seconds (20 or 40 alternations) ... does not depend greatly upon the exact durations\"."
- trang: trai-nghiem/mu-thay-doi
  id: n5
  luot_2: dung
  nguon: ["https://homepage.villanova.edu/diego.fernandezduque/Teaching/CognitivePsychology/Lectures_and_Labs/s3Attention/sReading/Rensink_etal_97.pdf"]
  trich: "\"Each image was displayed for 240 ms and each blank for 80 ms. Note that each image was presented twice before being switched.\""
- trang: trai-nghiem/mu-thay-doi
  id: n6
  luot_2: dung
  nguon: ["https://homepage.villanova.edu/diego.fernandezduque/Teaching/CognitivePsychology/Lectures_and_Labs/s3Attention/sReading/Rensink_etal_97.pdf"]
  trich: "Bỏ màn trống: \"Identification required only 1.4 alternations (0.9 s)\"."
  ghi_chu: "\"Chứng tỏ\" hơi mạnh nhưng là suy luận thực nghiệm hợp lý từ thí nghiệm có đối chứng."
- trang: trai-nghiem/mu-thay-doi
  id: n7
  luot_2: qua-manh
  nguon: ["https://www.tqmp.org/RegularArticles/vol22-2/p056/p056.pdf", "https://www.cs.ubc.ca/~rensink/publications/download/NeuroBiol-RR.pdf"]
  trich: "Tái lập một phần 2026: N = 69, trực tuyến; vùng ít quan tâm 11,22 s, vùng được quan tâm 5,79 s; bài chỉ sáu trang, nhóm sinh viên, chia nhóm theo danh sách luân phiên."
  cau_dung: "Khá vững: kỹ thuật nhấp nháy gây ra mù thay đổi; được quan sát trong nhiều nghiên cứu (tổng quan Rensink, 2002), thí nghiệm 1997 có một lần tái lập độc lập, trực tuyến, năm 2026 với 69 người (thời gian phát hiện 11,2 giây ở vùng ít quan tâm và 5,8 giây ở vùng được quan tâm); chưa có phân tích tổng hợp hay tái lập lớn có đăng ký trước."
  ghi_chu: "chỗ khó: thước đo Vững chắc cần phân tích tổng hợp hay hai tái lập lớn có đăng ký trước; ở đây chỉ có tổng quan tường thuật (Rensink 2002) cộng một tái lập nhỏ, không đăng ký trước ghi nhận. Số liệu tái lập ghi đúng."
- trang: trai-nghiem/mu-thay-doi
  id: n8
  luot_2: dung
  nguon: ["https://homepage.villanova.edu/diego.fernandezduque/Teaching/CognitivePsychology/Lectures_and_Labs/s3Attention/sReading/Rensink_etal_97.pdf", "https://www.tqmp.org/RegularArticles/vol22-2/p056/p056.pdf"]
  trich: "Rensink và cộng sự (1997): \"observers never form a complete, detailed representation of their surroundings\" và \"attention is required to perceive change\"."
  ghi_chu: "Phần \"về sau còn tranh luận\" là mô tả chung, đúng; nhãn Đang tranh cãi chấp nhận được."
- trang: trai-nghiem/ebbinghaus
  id: n1
  luot_2: dung
  nguon: ["https://doi.org/10.1068/p5273", "https://doi.org/10.1177/03010066231175014"]
  trich: "Roberts và cộng sự (2005): vòng trung tâm bị đánh giá thấp hay cao tuỳ kích thước và khoảng cách của vòng bao."
  ghi_chu: "Cơ chế \"tương phản kích thước\" là cách giải thích chuẩn nhưng với vòng bao gần thì xu hướng ngược; câu chủ yếu mô tả hiện tượng cổ điển."
- trang: trai-nghiem/ebbinghaus
  id: n2
  luot_2: dung
  nguon: ["https://doi.org/10.1037//1093-4510.4.3.228", "https://michaelbach.de/ot/cog-Ebbinghaus/index.html"]
  trich: "Burton (2001): \"Ebbinghaus probably introduced this illusion in the 1890s, although not in any explicit publication, and Titchener neither had nor asserted any authorship ... does not appear before 1957\"."
- trang: trai-nghiem/ebbinghaus
  id: n3
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0096-1523.33.3.738"]
  trich: "Himba \"experienced less strongly\" ảo giác so với người Anh; hình thoi làm ảo giác yếu \"to the same extent in both cultures\"; ưu tiên chi tiết cục bộ."
- trang: trai-nghiem/ebbinghaus
  id: n4
  luot_2: sai
  nguon: ["https://doi.org/10.3389/fpsyg.2015.01679"]
  trich: "Todorović & Jovanović (2015): độ lớn ảo giác từ 0 đến \"(exceptionally) 10% of the target size\"; \"In 33% of the factor combinations there was no illusion effect\"."
  cau_dung: "Với các cấu hình thường dùng, ảo giác Ebbinghaus thường chỉ vài phần trăm kích thước vòng trung tâm, tối đa khoảng 10% trong một khảo sát có hệ thống; một số cấu hình hầu như không có ảo giác."
  ghi_chu: "Con số 10–20% cao hơn bằng chứng; hiệu ứng phụ thuộc rất nhiều vào cấu hình."
- trang: trai-nghiem/ebbinghaus
  id: n5
  luot_2: dung
  nguon: ["https://osf.io/y7mtf/download", "https://doi.org/10.1037/0096-1523.33.3.738"]
  trich: "Amir & Firestone: Segall và cộng sự tập trung vào Müller-Lyer; de Fockert (2007): kết quả văn hoá cho Ebbinghaus với người Himba."
  ghi_chu: "Có các nghiên cứu văn hoá khác về Ebbinghaus (ví dụ về độ nhạy ngữ cảnh), nên \"đến từ nghiên cứu khác, của de Fockert\" nên hiểu là ví dụ chính, không phải duy nhất."
- trang: trai-nghiem/ebbinghaus
  id: n6
  luot_2: qua-manh
  nguon: ["https://doi.org/10.1016/j.cortex.2016.03.020", "https://doi.org/10.3389/fpsyg.2015.01679"]
  trich: "Kopiske và cộng sự (2016): bốn phòng thí nghiệm, N = 144, \"grasping is affected by the Ebbinghaus illusion\"; Todorović & Jovanović: 33% cấu hình không có ảo giác."
  cau_dung: "Khá vững: vòng trung tâm bị vòng lớn bao quanh thường trông nhỏ hơn với các cấu hình kinh điển (độ lớn phụ thuộc cấu hình); được đo trong nhiều nghiên cứu, và một lần tái lập ở bốn phòng thí nghiệm với 144 người xác nhận ảo giác ảnh hưởng tới cả động tác cầm nắm."
  ghi_chu: "chỗ khó: không có phân tích tổng hợp; một tái lập 4 phòng thí nghiệm (không đọc được ghi nhận đăng ký trước); hiệu ứng phụ thuộc cấu hình. Số 144 người và 4 phòng thí nghiệm ghi đúng."
- trang: trai-nghiem/ebbinghaus
  id: n7
  luot_2: dung
  nguon: ["https://osf.io/y7mtf/download"]
  trich: "Amir & Firestone: \"many of these considerations apply to other visual illusions as well, including ... the Ebbinghaus\"."
- trang: trai-nghiem/ebbinghaus
  id: n8
  luot_2: dung
  nguon: ["https://doi.org/10.1068/p5273"]
  trich: "\"relative size of the inducers and target, and the distance between the inducers and the target\"; ảnh hưởng của kích thước hay lẫn với độ khép kín của vành."
- trang: trai-nghiem/ebbinghaus
  id: n9
  luot_2: qua-manh
  nguon: ["https://doi.org/10.1177/03010066251395949", "https://doi.org/10.1037/0096-1523.33.3.738"]
  trich: "Nghiên cứu 2026 (145 người): \"Our findings did not support this proposal\"; ở cấp cá nhân người thiên về chi tiết cục bộ lại bị lừa nhiều hơn."
  cau_dung: "Một giả thuyết cho rằng người chú ý chi tiết cục bộ ít bị lừa hơn, phù hợp với phát hiện ở người Himba; nhưng ở cấp cá nhân bằng chứng không nhất quán (một nghiên cứu năm 2026 không ủng hộ)."
  ghi_chu: "chỗ khó: bằng chứng ở cấp cá nhân mâu thuẫn; chỉ có bằng chứng cấp nhóm (Himba) ủng hộ."
- trang: trai-nghiem/ebbinghaus
  id: n10
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0096-1523.33.3.738"]
  trich: "Tìm OpenAlex/Europe PMC với từ khoá Vietnamese, Vietnam, Ebbinghaus, ảo giác: không thấy nghiên cứu Ebbinghaus ở người Việt (tìm 16/11/2026)."
  ghi_chu: "Câu \"chưa tìm thấy\" kèm mốc thời gian và đã gọi dự đoán là suy luận."
- trang: trai-nghiem/ebbinghaus
  id: n11
  luot_2: qua-manh
  nguon: ["https://doi.org/10.3389/fpsyg.2015.01679", "https://doi.org/10.1037/0096-1523.33.3.738"]
  trich: "33% cấu hình không có ảo giác; Himba bị ít hơn người Anh."
  cau_dung: "Ảo giác không phải lỗi của mắt; đó là cách não diễn giải ngữ cảnh, và hầu hết người có thị giác bình thường bị lừa ở mức độ khác nhau."
  ghi_chu: "\"Hệ thị giác bình thường nào cũng bị lừa\" quá mạnh; mức bị lừa khác nhau giữa người và nhóm."
- trang: trai-nghiem/ebbinghaus
  id: n12
  luot_2: qua-manh
  nguon: ["https://en.wikipedia.org/wiki/Delboeuf_illusion", "https://doi.org/10.1177/03010066231175014"]
  trich: "Wikipedia: Delboeuf dùng cả đồng hoá và tương phản (vòng gần làm to ra, vòng xa làm nhỏ đi); bản ghi thư mục: Revue scientifique 1893, không thấy năm 1892."
  cau_dung: "Delboeuf và Ebbinghaus đều là ảo giác về kích thước vòng tròn nhưng là hai hình khác nhau (vòng đồng tâm và vòng ở giữa các vòng khác); cả hai có thể làm vòng trung tâm trông to hơn hay nhỏ hơn tuỳ kích thước và khoảng cách vòng bao quanh."
  ghi_chu: "Hai ảo giác đều có cả đồng hoá và tương phản tuỳ khoảng cách, nên chia \"Ebbinghaus tương phản, Delboeuf đồng hoá\" quá đơn giản. Năm mô tả: 1865/1892/1893 mâu thuẫn giữa các nguồn bậc 3; nên bỏ năm."
- trang: trai-nghiem/ebbinghaus
  id: n13
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0096-1523.33.3.738"]
  trich: "Himba \"experienced less strongly\" so với người Anh."
  ghi_chu: "Câu tự nói cách giải thích còn tranh cãi, đúng."
