# Lượt 2, sửa nhỏ đợt 8, phần bổ sung (2 câu viết lại sau lượt 2). Model: Opus.
- trang: trai-nghiem/linda
  id: n11
  luot_2: dung
  nguon:
    - "https://pure.mpg.de/rest/items/item_2102879/component/file_2102878/content"
    - "https://open.lnu.se/index.php/metapsychology/article/view/2474/2516"
    - "https://doi.org/10.15626/MP.2020.2474"
  trich: "Hertwig & Gigerenzer (1999), bản lưu ở kho của Viện Max Planck: \"probability theory is imposed as a norm for a single event (whether Linda is a bank teller). This would be considered misguided by those statisticians who hold that probability theory is about repeated events (for details see Gigerenzer, 1994)\"; \"several researchers (e.g. Adler, 1984, 1991; Dulany and Hilton, 1991; Politzer and Noveck, 1991) argued that participants interpret the hypothesis `Linda is a bank teller' to mean `Linda is a bank teller and is not active in the feminist movement'\"; \"None of the predictions that Agnoli and Krantz (1989) attributed to this hypothesis have been corroborated\"; \"With few exceptions, the evidence reported so far indicates that at least some participants preserve the relevance maxim by drawing the T&not-F implicature: Estimates range from 20% to 50% of participants.\" Chandrashekar et al. (2021), Meta-Psychology: \"One view opposing conjunction effect as a bias was by Hertwig and colleagues that argued that conjunction effect is not at all a fallacy, demonstrating that the effect arises out of semantic ambiguity, in that participants' understanding of natural language words such as 'probability' and 'and' diverged from that of experimenters (e.g., Hertwig & Gigerenzer, 1999)\"; \"We conducted a pre-registered well-powered very close replication (N = 1032) ... We found no support for semantic ambiguity.\""
  ghi_chu: "Đọc chữ thật của cả hai bài (PDF Hertwig & Gigerenzer 1999 ở pure.mpg.de; PDF Chandrashekar và cộng sự 2021 ở trang tạp chí Meta-Psychology, mở). Mọi ý quy cho tác giả đều khớp: Hertwig và cộng sự (theo Chandrashekar) cho rằng người tham gia hiểu \"probability\" và \"and\" khác người làm thí nghiệm, tức khác nghĩa toán học (Hertwig & Gigerenzer 1999 dùng chính chữ mathematical/nonmathematical); bản làm lại có đăng ký trước, N = 1032, không thấy hỗ trợ cho giả thuyết mơ hồ (với Linda, BF01 khoảng 13; với James, hiệu ứng hội không lặp lại nên kết luận về \"and\" không rõ, nhưng câu chỉ nói không thấy bằng chứng, đúng). Adler; Dulany và Hilton; Politzer và Noveck: đúng như Hertwig & Gigerenzer dẫn (cách hiểu T&not-F). \"Kết quả không đồng nhất\" là diễn ý hợp lý của đoạn: dự đoán của Agnoli và Krantz không được xác nhận, trong khi Macdonald và Gilhooly, Politzer và Noveck, Dulany và Hilton thấy giảm; \"with few exceptions ... at least some participants\" (20–50%) khớp \"nhìn chung ít nhất một phần\". Ý Gigerenzer về xác suất một trường hợp và tần suất: Hertwig & Gigerenzer 1999 nêu đúng lập luận ấy (dẫn Gigerenzer 1994); tôi không mở Gigerenzer 1991/1994. Nhãn Đang tranh cãi hợp: hai phía còn bất đồng (Mellers, Hertwig, Kahneman 2001 là hợp tác đối nghịch, theo Chandrashekar)."
- trang: kham-pha/tri-nho/tri-nho-lam-viec
