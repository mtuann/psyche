  luot_2: dung
  nguon:
    - "https://www.cns.nyu.edu/malab/static/files/publications/2018%20Oberauer%20et%20al..pdf"
    - "https://doi.org/10.1037/bul0000153"
    - "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12956956/fullTextXML"
    - "https://doi.org/10.3758/s13421-025-01762-5"
  trich: "Oberauer et al. (2018), bản ở trang phòng thí nghiệm của một đồng tác giả (NYU): \"Benchmark 7: Syllable-Based Word Length Effect in Serial and Free Recall (B) ... This word-length effect is robust when word length is manipulated through the number of syllables ... This effect is observed in serial recall (Baddeley, Thomson, & Buchanan, 1975; Mackworth, 1963) ... The syllable-based word-length effect is a key finding for theories of verbal WM and has been observed consistently in various languages. Given its restriction to the verbal domain, the rating proposed by the Benchmarks Team is a B.\" Guitard, Neath & Surprenant (2025), PMC12956956: \"Experiment 2 found that when the short and long words were more fully equated, including being equated for orthographic and phonological neighborhood size, the word-length effect disappeared.\"; \"This result with serial recognition parallels earlier findings with serial recall that the word-length effect disappears when the short and long words are equated on more dimensions and especially for orthographic and phonological neighborhood size and frequency (e.g., Guitard et al., 2018; Jalbert et al., 2011a, b).\""
  ghi_chu: "Đọc chữ thật của cả hai bài. Oberauer và cộng sự: ổn định khi độ dài đổi bằng số âm tiết, quan sát nhất quán ở nhiều ngôn ngữ, mức B vì giới hạn ở miền lời nói: khớp. Ba mức A, B, C của bài là mức ưu tiên giải thích (\"three levels of priority\"); mức A được giải thích bằng tính nhất quán qua nhiều miền và nhiều cách làm, nên \"phạm vi hẹp hơn mức A\" là diễn ý chấp nhận được, dù chữ của bài là mức ưu tiên chứ không phải phạm vi. Guitard và cộng sự 2025: bài nhận diện thứ tự (serial recognition), cân bằng cả số láng giềng chính tả và âm thì hiệu ứng mất, giống các nghiên cứu trước ở nhớ lại theo thứ tự mà họ dẫn: khớp. Nhãn Khá vững cho câu \"thường nhớ được ít hơn\" kèm nói rõ cách giải thích còn tranh cãi: hợp."
