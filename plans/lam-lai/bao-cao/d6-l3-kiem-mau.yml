- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n51
  cau: 'Ngộ nhận "Trẻ nhà nghèo nghe ít hơn trẻ nhà giàu đúng 30 triệu từ": con số đến từ một nghiên cứu năm 1995 và đang bị tranh cãi.'
  loai: lich-su
  nguon:
    - ten: "Sperry, Sperry & Miller (2019), Child Dev 90(4), 1303–1318: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1111/cdev.13072
    - ten: "Golinkoff và cộng sự (2019), Child Dev 90(3), 985–992: toàn văn (PubMed Central, qua NCBI E-utilities)"
      link: https://doi.org/10.1111/cdev.13128
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "một nghiên cứu năm 1995 với mẫu nhỏ và đang bị tranh cãi mạnh". Chữ mới bỏ "mẫu nhỏ" (không kiểm được) và "mạnh". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n16
  cau: Theo Piaget, lỗi A-not-B là bằng chứng trẻ còn gắn đồ vật với hành động của chính mình và chưa nắm trọn tính bền vững của vật thể.
  loai: lich-su
  nguon:
    - ten: "Bjork & Cummings (1984), Mem Cognit 12(1), 1–19: toàn văn (PDF của phòng thí nghiệm Bjork, UCLA)"
      link: https://bjorklab.psych.ucla.edu/wp-content/uploads/sites/13/2016/07/EBjork_Cummings_1984.pdf
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Piaget xem đây là bằng chứng tính bền vững của vật thể chưa hoàn chỉnh: trẻ hiểu đồ vật vẫn tồn tại khi khuất mắt, nhưng còn lẫn lộn giữa hành động của mình với vị trí của đồ vật (Piaget, 1954)". Chữ mới theo tóm tắt Bjork & Cummings (Piaget 1954 theo họ kể lại). Lý do: chữ cũ nói trẻ "hiểu đồ vật vẫn tồn tại", tóm tắt nói trẻ chưa nắm tính bền vững. Bài gốc Piaget 1954 chưa mở. Review (Claude Opus 5.5, 10/11/2026): Mở lại toàn văn Bjork & Cummings 1984 (PDF phòng thí nghiệm Bjork): câu trích nằm ở tóm tắt; trang ghi "Piaget, 1954, theo Bjork và Cummings, 1984, kể lại", đúng bậc nguồn. OpenStax Lifespan Development 3.4 cũng viết Piaget diễn giải lỗi A-not-B là hiểu biết về tính bền vững chưa trọn.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n6
  cau: Trong 47 nghiên cứu mà Holt và cộng sự tổng hợp, chỉ khoảng một phần tư (12) cố đánh giá chênh lệch quyền lực, nên số liệu giữa các nghiên cứu khó so sánh.
  loai: so-lieu
  nguon:
    - ten: "Holt và cộng sự (2015), Pediatrics 135(2), e496–e509: toàn văn (PMC4702491)"
      link: https://doi.org/10.1542/peds.2014-1864
  ket_qua_luot_1: dung
  ghi_chu: '"Khó so sánh" là suy ra của trang từ chuyện các nghiên cứu đo khác nhau; Holt cũng nêu vấn đề tương tự ở phần Discussion.'
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n17
  cau: Marcia mô tả người ở foreclosure có sự cứng nhắc trong tính cách và sẽ cảm thấy bị đe dọa nếu giá trị của cha mẹ không còn dùng được.
  loai: phat-hien
  nguon:
    - ten: "Marcia (1966), J Pers Soc Psychol 3(5), 551–558: toàn văn (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus)"
      link: https://doi.org/10.1037/h0023281
  ket_qua_luot_1: da-sua
  ghi_chu: 'Câu thay cho lời cảnh báo gán cho Erikson (bám víu vào bản sắc cực đoan). Chữ cũ về Erikson không có nguồn đã mở. Review (Claude Opus 5.5, 10/11/2026): Đọc lại toàn văn Marcia 1966 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus, tệp 10.1037%252Fh0023281.pdf trong zip 10.1037%252Fa0017364.zip): "A certain rigidity characterizes his personality; one feels that if he were faced with a situation in which parental values were nonfunctional, he would feel extremely threatened." Khớp.'
- trang: kham-pha/phat-trien/gan-bo
  id: n65
  cau: "Câu 2: kiểu an toàn là kiểu phổ biến nhất trong tình huống lạ; tổng hợp 1988: A nhiều ở Tây Âu, C nhiều ở Nhật Bản và Israel; khác biệt trong cùng một nước gần 1,5 lần giữa các nước."
  loai: phat-hien
  nguon:
    - ten: OpenStax, Psychology 2e, mục 9.3 (Stages of Development; phần gắn bó), đọc ngày 10/11/2026
      link: https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development
    - ten: "van IJzendoorn & Kroonenberg (1988), Child Dev 59(1), 147–156: tóm tắt (OpenAlex)"
      link: https://doi.org/10.2307/1130396
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: câu "Phân bố chuẩn mà Ainsworth đề xuất" với đáp án 70/20/10 và 65/21/14. Lý do: các số không có nguồn đã mở (xem nhận định về 70/20/10). Lời giải thích không dựa vào vị trí lựa chọn. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
