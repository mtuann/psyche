  id: n53
  luot_2: khong-chac
  ghi_chu: "Số 42% so với 19% chưa xác nhận ở nguồn bậc 1–2 (xem n22). Phần lời khuyên (không đỡ không phải lỗi của bạn, bàn đổi phương pháp hay gặp bác sĩ đánh giá thêm) hợp WHO và Kraus 2019. Chip Vững chắc cho 'trị liệu đáng thử' hợp thước đo. Không mở được toàn văn Cuijpers 2023 (chỉ tóm tắt); tóm tắt không có 42%/19%, NNT, g = 0,60, g = 0,47. Chỉ nguồn bậc 3 nhắc các số này và chúng không khớp nhau: Mad in America ghi 42% so với 19% và 0,47 'sau khi tính sai lệch xuất bản và nghiên cứu nguy cơ sai lệch cao' (không phải chỉ hiệu chỉnh xuất bản), và NNT 3,6 (có lẽ cho thuyên giảm); Mental Elf ghi chỉ 9 so sánh ít nguy cơ sai lệch, không ghi số. Cần review mở toàn văn (bảng 1–2) để chốt."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
