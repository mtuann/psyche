  trich: "Powers: psychological placebo (d = 0.34) | Cuijpers 2019: not all meta-analyses support the common factors model"
  ghi_chu: "Câu kể lập luận của một phe nên đúng. Vế 'tiếp xúc có vai trò rõ' không có nguồn riêng mở được; nên giữ chữ 'phe … chỉ ra'."
