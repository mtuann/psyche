  id: n33
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0022-006X.71.6.973"]
  trich: "comparisons between active treatments and structurally inequivalent placebos produced larger effects than comparisons between active treatments and structurally equivalent placebos: moreover, the latter comparison produced negligible effects, indicating that active treatments were not demonstrably superior to well-designed placebos."
  ghi_chu: "Chỉ đọc tóm tắt; 'người thực hiện' tương ứng 'training of therapist'."
