  trich: "included 23 randomized controlled trials of 1,431 patients (Abbass, Hancock, Henderson, & Kisely, 2006) ... common mental disorders who received short-term (<40 hours) psychodynamic therapy with controls ... overall effect size of 0.97 for general symptom improvement. The effect size increased to 1.51 when the patients were assessed at long-term follow-up (>9 months posttreatment)."
  ghi_chu: "Toàn văn Shedler (bản PDF của APA). Bản thân tổng quan Cochrane 2006 dặn dè dặt: ít nghiên cứu mỗi nhóm, dị biệt lớn, kết quả không luôn giữ ở phân tích độ nhạy; trang nên giữ lời 'Shedler dẫn'."
