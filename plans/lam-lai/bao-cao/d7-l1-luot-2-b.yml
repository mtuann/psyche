  luot_2: dung
  nguon: ["https://doi.org/10.1146/annurev-clinpsy-050718-095424", "https://doi.org/10.1002/wps.20238", "https://doi.org/10.1037/0022-006X.71.6.973", "https://dare.uva.nl/id/7886da1f-5790-4005-8ecb-747aca121038"]
  trich: "Cuijpers 2019: Currently, no common or specific factor meets these criteria ... Therefore, it is still unknown whether therapies work through common or specific factors, or both."
  ghi_chu: "Nhãn Đang tranh cãi hợp thước đo: các tổng hợp chất lượng tốt cho kết luận ngược nhau (Baskin 2003 so với Powers 2008), Annual Review 2019 kết luận chưa biết."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n36
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0033-2909.122.3.203"]
  trich: "In 1936, Rosenzweig proposed that common factors were responsible for the efficacy of psychotherapy and used the conclusion of the Dodo bird ... 'At last the Dodo said, \"Everybody has won, and all must have prizes\"' (p. 412). ... Since Luborsky et al.'s seminal review, the equivalence of outcome in psychotherapy has been called the Dodo bird effect."
  ghi_chu: "Chữ 'phán quyết' (verdict) phổ biến từ Luborsky và cộng sự 1975; Rosenzweig 1936 là nơi lời con Dodo được dùng lần đầu. 'Bắt nguồn từ' chấp nhận được."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n37
  luot_2: dung
  nguon: ["https://doi.org/10.1146/annurev-clinpsy-050718-095424"]
  trich: "it is still unknown whether therapies work through common or specific factors, or both."
