  id: n44
  luot_2: dung
  nguon: ["https://doi.org/10.1016/j.jad.2013.10.002", "https://www.who.int/news-room/fact-sheets/detail/depression"]
  trich: "Pooled data indicates the overall positive effect of shorter duration of untreated illness ... (RR 1.70) ... (RR 1.65)"
  ghi_chu: "'Đi kèm' đúng mức (tương quan, 3 nghiên cứu); không nên đổi thành 'giúp' hay 'làm cho'."
