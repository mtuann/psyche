- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n4
  luot_2: dung
  nguon: ["https://doi.org/10.1007/s10608-012-9476-1", "https://dictionary.apa.org/psychotherapy"]
  trich: "Hofmann 2012: mental disorders and psychological distress are maintained by cognitive factors ... maladaptive cognitions contribute to the maintenance of emotional distress and behavioral problems | APA: psychotherapy ... to evaluate, diagnose, and treat dysfunctional emotional reactions, ways of thinking, and behavior patterns"
  ghi_chu: "Định nghĩa đối chiếu; vế 'lời an ủi xoa dịu nhất thời' là diễn giải, không cần số."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n5
  luot_2: qua-manh
  nguon: ["https://doi.org/10.1002/wps.20238", "https://www.who.int/news-room/fact-sheets/detail/depression"]
  trich: "Wampold 2015 (tóm tắt): common factors, including alliance, empathy, expectations, cultural adaptation, and therapist differences | WHO: stay connected (giữ liên lạc với gia đình, bạn bè) là một phần của tự chăm sóc"
  cau_dung: "Sự lắng nghe, quan tâm của bạn thân cũng không vô ích: giữ liên lạc với người thân là một phần của tự chăm sóc, và sự đồng cảm cũng là một trong các 'yếu tố chung' của trị liệu; nhưng trò chuyện với bạn không thay được trị liệu."
  ghi_chu: "'Yếu tố chung' trong tài liệu là những gì các liệu pháp tâm lý cùng có (liên minh, đồng cảm, kỳ vọng trong một khung điều trị). Nói sự quan tâm của bạn bè 'là một phần của' yếu tố chung là mở rộng khái niệm quá nguồn."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n6
  luot_2: dung
  nguon: ["https://dictionary.apa.org/psychotherapy"]
  trich: "psychological help delivered mainly through talking and interaction, to evaluate, diagnose, and treat emotional distress, unhelpful thinking, and problematic behavior (diễn ý của mục từ)"
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n8
  luot_2: dung
  nguon: ["https://doi.org/10.1007/s10608-012-9476-1"]
  trich: "CBT ... share the basic premise that mental disorders and psychological distress are maintained by cognitive factors ... modern CBT refers to a family of interventions that combine a variety of cognitive, behavioral, and emotion-focused techniques"
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n9
  luot_2: dung
  nguon: ["https://dictionary.apa.org/psychotherapy", "https://dictionary.apa.org/psychodynamic-psychotherapy", "https://dictionary.apa.org/client-centered-therapy"]
  trich: "APA (psychotherapy): the main approaches are psychodynamic, cognitive or behavioral, humanistic, and integrative | APA (psychodynamic): falling within or deriving from the psychoanalytic tradition"
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n10
  luot_2: dung
  nguon: ["https://doi.org/10.1002/wps.21069", "https://doi.org/10.1007/s10608-012-9476-1"]
  trich: "CBT is by far the most examined type of psychological treatment for depression | Hofmann: CBT is arguably the most widely studied form of psychotherapy."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n11
  luot_2: dung
  nguon: ["https://dictionary.apa.org/cognitive-therapy", "https://doi.org/10.1007/s10608-012-9476-1"]
  trich: "APA: also called Beck therapy, developed by Aaron T. Beck | Hofmann: as pioneered by Beck (1970) and Ellis (1962)"
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n12
  luot_2: dung
  nguon: ["https://link.springer.com/article/10.1007/BF01173502"]
  trich: "Forty-one unipolar depressed outpatients were randomly assigned ... the treatment protocol specified a maximum of 20 interviews over a period of 12 weeks. The pharmacotherapy patients received up to 250 mg/day of imipramine for a maximum of 12 weeks."
  ghi_chu: "Đọc tóm tắt trên Springer. Bài theo dõi Kovacs 1981 ghi 44 người: khác cách đếm, trang dùng 41 của bài gốc là đúng."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n13
  luot_2: dung
  nguon: ["https://link.springer.com/article/10.1007/BF01173502", "https://doi.org/10.1001/archpsyc.1981.01780260035003"]
  trich: "Cognitive therapy resulted in significantly greater improvement than did pharmacotherapy ... The dropout rate was significantly higher with pharmacotherapy | Kovacs: both interventions were associated with significant reductions in levels of depression"
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n14
  luot_2: dung
  nguon: ["https://doi.org/10.1001/archpsyc.1981.01780260035003"]
  trich: "Self-rated depressive symptomatology was significantly lower for those who, one year earlier, had completed cognitive therapy ... none of the between-group differences were significant."
  ghi_chu: "Chỉ đọc tóm tắt; theo dõi 35 người hoàn thành."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n15
  luot_2: dung
  nguon: ["https://doi.org/10.1002/wps.21069"]
  trich: "The effects of CBT did not differ significantly from those of pharmacotherapies at the short term"
  ghi_chu: "Cuijpers 2023: chỉ đọc được tóm tắt (PubMed Central không cho toàn văn máy đọc; Wiley, kho VU và TUM chặn)."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n16
  luot_2: dung
  nguon: ["https://doi.org/10.1007/s10608-012-9476-1"]
  trich: "We identified 269 meta-analytic studies and reviewed of those a representative sample of 106 meta-analyses examining CBT for ... depression and dysthymia, ... anxiety disorders, somatoform disorders, eating disorders, insomnia, ... chronic pain and fatigue"
  ghi_chu: "Toàn văn PMC3584580."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n17
  luot_2: dung
  nguon: ["https://doi.org/10.1007/s10608-012-9476-1"]
  trich: "The strongest support exists for CBT of anxiety disorders, somatoform disorders, bulimia, anger control problems, and general stress."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n18
  luot_2: dung
  nguon: ["https://doi.org/10.1007/s10608-012-9476-1"]
  trich: "Eleven studies compared response rates ... CBT showed higher response rates than the comparison conditions in 7 of these reviews and only one review reported that CBT had lower response rates"
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n19
  luot_2: dung
  nguon: ["https://doi.org/10.1007/s10608-012-9476-1"]
  trich: "In general, the evidence-base of CBT is very strong. However, additional research is needed to examine the efficacy of CBT for randomized-controlled studies. Moreover, except for children and elderly populations, no meta-analytic studies of CBT have been reported on specific subgroups, such as ethnic minorities and low income samples."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n20
  luot_2: dung
  nguon: ["https://doi.org/10.1002/wps.21069"]
  trich: "We included 409 trials (518 comparisons) with 52,702 patients, thus conducting the largest meta-analysis ever of a specific type of psychotherapy for a mental disorder. ... control conditions such as care as usual and waitlist ... other psychotherapies, pharmacotherapies and combined treatment"
  ghi_chu: "Cuijpers 2023: chỉ đọc được tóm tắt (PubMed Central không cho toàn văn máy đọc; Wiley, kho VU và TUM chặn)."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n21
  luot_2: khong-chac
  trich: "Tóm tắt: CBT had moderate to large effects compared to control conditions ... (g=0.79; 95% CI: 0.70-0.89), which remained similar in sensitivity analyses"
  ghi_chu: "g = 0,79 đúng. g = 0,60 (ít nguy cơ sai lệch) và g = 0,47 (sau hiệu chỉnh sai lệch xuất bản) không xác nhận được. Không mở được toàn văn Cuijpers 2023 (chỉ tóm tắt); tóm tắt không có 42%/19%, NNT, g = 0,60, g = 0,47. Chỉ nguồn bậc 3 nhắc các số này và chúng không khớp nhau: Mad in America ghi 42% so với 19% và 0,47 'sau khi tính sai lệch xuất bản và nghiên cứu nguy cơ sai lệch cao' (không phải chỉ hiệu chỉnh xuất bản), và NNT 3,6 (có lẽ cho thuyên giảm); Mental Elf ghi chỉ 9 so sánh ít nguy cơ sai lệch, không ghi số. Cần review mở toàn văn (bảng 1–2) để chốt."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n22
  luot_2: khong-chac
  ghi_chu: "42% so với 19% và NNT 4,7 không có trong tóm tắt. Phép tính thô từ 42% và 19% cho NNT khoảng 4,3, không phải 4,7 (Cuijpers có thể tính NNT theo cách khác). Không mở được toàn văn Cuijpers 2023 (chỉ tóm tắt); tóm tắt không có 42%/19%, NNT, g = 0,60, g = 0,47. Chỉ nguồn bậc 3 nhắc các số này và chúng không khớp nhau: Mad in America ghi 42% so với 19% và 0,47 'sau khi tính sai lệch xuất bản và nghiên cứu nguy cơ sai lệch cao' (không phải chỉ hiệu chỉnh xuất bản), và NNT 3,6 (có lẽ cho thuyên giảm); Mental Elf ghi chỉ 9 so sánh ít nguy cơ sai lệch, không ghi số. Cần review mở toàn văn (bảng 1–2) để chốt."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n23
  luot_2: dung
  nguon: ["https://doi.org/10.1002/wps.21069"]
  trich: "... which remained similar in sensitivity analyses and were still significant at 6-12 month follow-up."
  ghi_chu: "Cuijpers 2023: chỉ đọc được tóm tắt (PubMed Central không cho toàn văn máy đọc; Wiley, kho VU và TUM chặn)."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n24
  luot_2: dung
  nguon: ["https://doi.org/10.1002/wps.21069"]
  trich: "CBT was significantly more effective than other psychotherapies, but the difference was small (g=0.06 ...) and became non-significant in most sensitivity analyses. The effects of CBT did not differ significantly from those of pharmacotherapies at the short term, but were significantly larger at 6-12 month follow-up (g=0.34 ...), although the number of trials was small, and the difference was not significant in all sensitivity analyses. Combined treatment was more effective than pharmacotherapies alone ... but it was not more effective than CBT alone"
  ghi_chu: "Cuijpers 2023: chỉ đọc được tóm tắt (PubMed Central không cho toàn văn máy đọc; Wiley, kho VU và TUM chặn)."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n25
  luot_2: dung
  nguon: ["https://dare.uva.nl/id/7886da1f-5790-4005-8ecb-747aca121038"]
  trich: "produced 32 randomized controlled trials (N = 1,479) ... compared to waitlist ... psychological placebo ... pill-placebo"
  ghi_chu: "Powers, Sigmarsson, Emmelkamp 2008, International Journal of Cognitive Therapy 1(2): 94–113; tóm tắt ở kho UvA. Lưu ý: kết quả tìm kiếm có trộn với Acarturk 2009 (29 nghiên cứu, 1.628 người), là bài khác."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n26
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0022-006X.71.6.973"]
  trich: "Structural aspects of the placebo included number and duration of sessions, training of therapist, format of therapy, and restriction of topics. ... Placebo treatments in psychotherapy cannot adequately control for all common factors"
  ghi_chu: "Định nghĩa khớp cách dùng trong Baskin 2003 và Powers 2008."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n27
  luot_2: dung
  nguon: ["https://dare.uva.nl/id/7886da1f-5790-4005-8ecb-747aca121038"]
  trich: "clear overall advantage of treatment compared to waitlist (d = 0.86), psychological placebo (d = 0.34), and pill-placebo (d = 0.36). Treatment gains were maintained at follow-up (d = 0.76)."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n28
  luot_2: dung
  nguon: ["https://dare.uva.nl/id/7886da1f-5790-4005-8ecb-747aca121038", "https://doi.org/10.1037/0022-006X.71.6.973"]
  trich: "Powers: d = 0.86 so với danh sách chờ, d = 0.34 so với giả dược tâm lý | Baskin: Placebo treatments in psychotherapy cannot adequately control for all common factors"
  ghi_chu: "'Có vẻ' giữ đúng mức suy luận."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n29
  luot_2: dung
  nguon: ["https://doi.org/10.1002/wps.21069", "https://doi.org/10.1037/bul0000465"]
  trich: "CBT had moderate to large effects compared to control conditions such as care as usual and waitlist (g=0.79 ...), which remained similar in sensitivity analyses | Harrer 2025: psychological interventions have large average effects on depression (g = 0.73) ..."
  ghi_chu: "Nhãn Vững chắc hợp thước đo (nhiều phân tích tổng hợp lớn cùng chiều, có cả nước thu nhập thấp-trung bình). Vế 'sau hiệu chỉnh sai lệch' chỉ xác nhận được ở mức 'remained similar in sensitivity analyses' (tóm tắt). Cuijpers 2023: chỉ đọc được tóm tắt (PubMed Central không cho toàn văn máy đọc; Wiley, kho VU và TUM chặn)."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n30
  luot_2: khong-chac
  trich: "Tóm tắt Cuijpers: g=0.79 ... remained similar in sensitivity analyses | Hofmann: The strongest support exists for CBT of anxiety disorders"
  ghi_chu: "Vế lo âu có Hofmann 2012. Số 0,47 và 42%/19% chưa xác nhận ở nguồn bậc 1–2, và theo một nguồn bậc 3, 0,47 là sau khi tính cả sai lệch xuất bản lẫn nghiên cứu nguy cơ sai lệch cao. Nhãn (theo trang có lẽ Khá vững) hợp nếu các số được xác nhận. Không mở được toàn văn Cuijpers 2023 (chỉ tóm tắt); tóm tắt không có 42%/19%, NNT, g = 0,60, g = 0,47. Chỉ nguồn bậc 3 nhắc các số này và chúng không khớp nhau: Mad in America ghi 42% so với 19% và 0,47 'sau khi tính sai lệch xuất bản và nghiên cứu nguy cơ sai lệch cao' (không phải chỉ hiệu chỉnh xuất bản), và NNT 3,6 (có lẽ cho thuyên giảm); Mental Elf ghi chỉ 9 so sánh ít nguy cơ sai lệch, không ghi số. Cần review mở toàn văn (bảng 1–2) để chốt."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n31
  luot_2: dung
  nguon: ["https://doi.org/10.1037/bul0000015", "https://doi.org/10.1037/bul0000062", "https://doi.org/10.1002/wps.21069"]
  trich: "J&F: the effects of CBT have declined linearly and steadily since its introduction | Cristea: The linear 'fall' reported by Johnsen and Friborg (2015) is most likely a spurious finding. | Cuijpers: There was no reduction of the effect size of CBT according to the publication year"
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n32
  luot_2: dung
  nguon: ["https://doi.org/10.1002/wps.21069", "https://doi.org/10.1037/0033-2909.122.3.203"]
  trich: "CBT was significantly more effective than other psychotherapies, but the difference was small (g=0.06) | Wampold 1997: the upper bound of the true effect was about .20"
