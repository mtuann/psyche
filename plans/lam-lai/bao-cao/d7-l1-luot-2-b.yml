  id: n62
  luot_2: khong-chac
  ghi_chu: "Không tìm được nguồn bậc 1–2 nói gia đình là kênh hỗ trợ đầu tiên của người Việt và 'vừa là điểm tựa vừa là rủi ro'. Ngo 2014 chỉ có thành phần hỗ trợ gia đình và bối cảnh văn hóa tập thể. Câu cũ: bỏ hay tìm nghiên cứu về tìm kiếm giúp đỡ ở Việt Nam."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n63
  luot_2: qua-manh
  nguon: ["https://doi.org/10.1037/bul0000465", "https://doi.org/10.1037/a0023626"]
  trich: "Harrer 2025: We found no indication that psychotherapy is less effective in low- and middle-income countries ... or non-Western cultures | Benish 2011: culturally adapted psychotherapy is more effective than unadapted, bona fide psychotherapy by d = 0.32"
  cau_dung: "Chưa thấy trị liệu tâm lý kém hiệu quả hơn ở các nước thu nhập thấp-trung bình hay nền văn hóa ngoài phương Tây, nhưng liệu pháp được điều chỉnh theo văn hóa có phần hiệu quả hơn; chưa đủ bằng chứng để nói các cơ chế tâm lý là phổ quát."
  ghi_chu: "Không nguồn nào kiểm trực tiếp tính phổ quát của cơ chế; bằng chứng chỉ nói về hiệu quả."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n64
  luot_2: dung
  nguon: ["https://doi.org/10.1037/a0023626"]
  trich: "culturally adapted psychotherapy is more effective than unadapted, bona fide psychotherapy by d = 0.32 ... Adaptation of the illness myth was the sole moderator"
  ghi_chu: "Đọc bài gốc mà Wampold dẫn (Benish, Quintana, Wampold 2011). Mẫu là người thuộc dân tộc thiểu số, chủng tộc thiểu số (chủ yếu ở Bắc Mỹ); nên nói rõ."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n65
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content"]
  trich: "they can be effectively delivered by trained and supervised non-specialized workers and through guided self-help (e.g. with use of e-mental health programmes or self-help books)"
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n66
  luot_2: dung
  nguon: ["https://dare.uva.nl/id/7886da1f-5790-4005-8ecb-747aca121038"]
  trich: "waitlist (d = 0.86), psychological placebo (d = 0.34) ... Treatment gains were maintained at follow-up (d = 0.76)"
  ghi_chu: "Gọi giả dược tâm lý là 'chỉ lắng nghe' là giản lược; Baskin 2003 cho thấy với giả dược tương đương về cấu trúc thì khác biệt không đáng kể, nên giữ 'trong nhiều thử nghiệm'."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
