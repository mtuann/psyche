  trich: "Viet Nam: Psychiatrists 951, 0.99 per 100 000 | United Kingdom: 9 295, 13.76 per 100 000"
  ghi_chu: "Số đúng. Mốc 'số liệu năm 2019' chưa xác nhận: biểu đồ của hồ sơ quốc gia ghi 2020; chỉ kết quả tìm kiếm (không phải trang WHO) nói Atlas 2020 dựa trên số liệu 2019. Nên bỏ 'số liệu năm 2019' hay ghi 'Atlas 2020'."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n61
  luot_2: dung
  nguon: ["https://doi.org/10.1891/0889-8391.28.3.156"]
  trich: "a lack of recognition of depression as a health-related entity amenable to professional treatment, relatively low levels of psychological mindedness useful for understanding of psychological interventions"
