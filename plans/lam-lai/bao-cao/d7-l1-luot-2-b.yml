  luot_2: dung
  nguon: ["https://doi.org/10.1186/s13033-020-00342-1", "https://doi.org/10.1038/s41598-021-90320-5"]
  trich: "Murphy 2020: intervention that is based on CBT principles ... cluster randomized trial included 376 adults | Imamura 2021: Program B (a fixed-order, internet cognitive behavioral therapy, iCBT) ... 951 participants were randomly allocated"
  ghi_chu: "'Còn ít' là nhận định thận trọng, thời sự, cần mốc và hạn."
