  id: n58
  luot_2: dung
  nguon: ["https://doi.org/10.1186/s13033-020-00342-1"]
  trich: "The cluster randomized trial included 376 adults in 32 communes in eight provinces. ... Patients with severe symptoms were excluded ... a two-month course of SSM, consisting of a workbook and supportive coaching ... delayed group received enhanced treatment as usual ... At 2 months, 26.4% of the intervention group and 42.3% of the delayed group had SRQ-20 scores > 7."
  ghi_chu: "Toàn văn PMC7014690. Nhóm chứng là chăm sóc thông thường 'tăng cường'."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n59
  luot_2: dung
  nguon: ["https://doi.org/10.1038/s41598-021-90320-5"]
  trich: "recruited from nurses in a large general hospital in Hanoi ... 951 participants ... Program B showed a statistically significant effect on improving depressive symptoms at 3-month (p = 0.048), but not at 7-month (p = 0.92); Cohen's d was − 0.18"
  ghi_chu: "Thử nghiệm ba nhánh: chỉ chương trình B (theo thứ tự cố định) có hiệu quả; chương trình A không. Nên nói rõ."
