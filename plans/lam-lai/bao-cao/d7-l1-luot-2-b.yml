  nguon: ["https://strathprints.strath.ac.uk/74362"]
  trich: "91 studies published between 2009 and 2018 ... HEPs were associated with large pre-post client change (d = .86) ... large gains relative to clients who received no therapy (.88) ... equivalent to other therapies (-.08) ... equivocal advantage for CBT (-.26) ... Findings were more mixed for depression and anxiety."
  ghi_chu: "Tóm tắt ở kho Strathclyde; tóm tắt nêu phần lớn so sánh do nhà nghiên cứu CBT thực hiện, thường dùng bản HEP không chính quy."
