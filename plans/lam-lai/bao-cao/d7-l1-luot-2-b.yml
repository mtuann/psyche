  nguon: ["https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11303923/", "https://doi.org/10.1002/wps.20238"]
  trich: "Flückiger et al. 2024 (đồng tác giả Wampold): an extension of Contextual Model (Wampold & Imel, 2015) ... three pathways ...: The CARE pathway (caring, attentive, real, empathic), the Expectation pathway, and the Specific pathway."
  ghi_chu: "Không mở được toàn văn Wampold 2015 (PMC chặn bằng captcha, Wiley 403; chỉ có tóm tắt). Ba con đường xác nhận qua bài 2024 của chính nhóm Wampold; cách gọi đường thứ ba là 'hành động có lợi cho sức khỏe' khớp mô tả thường gặp của mô hình bối cảnh nhưng chưa đọc được chữ gốc 2015."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n43
  luot_2: khong-chac
  nguon: ["https://doi.org/10.1037/a0022186", "https://doi.org/10.1037/pst0000172", "https://doi.org/10.1037/0033-2909.122.3.203"]
  trich: "Horvath 2011: r = .275 (k = 190) | Flückiger 2018: r = .278 | Wampold 1997: the upper bound of the true effect was about .20"
  ghi_chu: "r ≈ 0,27 và 'tối đa khoảng d = 0,20' xác nhận qua nguồn gốc mà Wampold dẫn. d ≈ 0,35 cho khác biệt giữa nhà trị liệu không xác nhận được: không mở được toàn văn Wampold 2015, và theo trí nhớ (chưa kiểm) bảng của bài có thể ghi một số khác (khoảng 0,55). Cần review đọc bảng 1 của Wampold 2015."
