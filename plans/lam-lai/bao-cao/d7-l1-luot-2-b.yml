  nguon: ["https://pbgdpl.cantho.gov.vn/attachment/2200", "https://trungtamytekhanhson.khanhhoa.gov.vn/wp-content/uploads/2024/01/Thông-tư-32-2023-TT-BYT.pdf", "https://luatvietnam.vn/y-te/thong-tu-26-2025-tt-byt-quy-dinh-ke-don-thuoc-hoa-duoc-sinh-pham-tai-co-so-kham-chua-benh-404246-d1.html"]
  trich: "Luật Điều 26.1.h Tâm lý lâm sàng; TT 32/2023 Điều 11.11 (đánh giá, can thiệp tâm lý); TT 26/2025 Điều 2 (bác sỹ, y sỹ kê đơn)"
  ghi_chu: "Như n16, n17, n18."
