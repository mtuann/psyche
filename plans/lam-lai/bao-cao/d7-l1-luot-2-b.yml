  trich: "Tóm tắt Cuijpers: ... significantly larger at 6-12 month follow-up (g=0.34), although the number of trials was small"
  ghi_chu: "Vế 6–12 tháng tốt hơn thuốc (ít thử nghiệm) đúng. 42% chưa xác nhận ở nguồn bậc 1–2 (xem n22). Vế tái phát và 'CBT dạy kỹ năng để phòng tái phát' không mở được nguồn (NICE chặn 403). Không mở được toàn văn Cuijpers 2023 (chỉ tóm tắt); tóm tắt không có 42%/19%, NNT, g = 0,60, g = 0,47. Chỉ nguồn bậc 3 nhắc các số này và chúng không khớp nhau: Mad in America ghi 42% so với 19% và 0,47 'sau khi tính sai lệch xuất bản và nghiên cứu nguy cơ sai lệch cao' (không phải chỉ hiệu chỉnh xuất bản), và NNT 3,6 (có lẽ cho thuyên giảm); Mental Elf ghi chỉ 9 so sánh ít nguy cơ sai lệch, không ghi số. Cần review mở toàn văn (bảng 1–2) để chốt."
