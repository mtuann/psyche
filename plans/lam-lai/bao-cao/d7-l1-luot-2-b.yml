  trich: "Baskin: active treatments were not demonstrably superior to well-designed placebos | Powers: psychological placebo (d = 0.34) | Cuijpers 2019: still unknown whether therapies work through common or specific factors"
  cau_dung: "Vững chắc: trị liệu tâm lý hiệu quả hơn hẳn không điều trị. Đang tranh cãi: bao nhiêu phần hiệu quả nhờ kỹ thuật riêng, bao nhiêu nhờ những gì giả dược tâm lý cũng có."
  ghi_chu: "Nhãn 'Đã bị bác bỏ' không đạt thước đo: các kiểm tra đủ mạnh không liên tục thất bại; với giả dược tương đương cấu trúc, trị liệu thật không hơn rõ (Baskin 2003). Chính trang xếp câu này vào Đang tranh cãi (n35). Khung cũ phải bỏ hay đổi nhãn."
