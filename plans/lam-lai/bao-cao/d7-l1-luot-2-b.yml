  luot_2: dung
  nguon: ["https://doi.org/10.1002/wps.21069", "https://doi.org/10.1001/jamapsychiatry.2020.4364"]
  trich: "CBT was also effective as unguided self-help intervention (g=0.45; 95% CI: 0.31-0.60) | Karyotaki 2021: 39 studies comprising 9751 participants ... guided iCBT was associated with more effectiveness in individuals with moderate and severe depression ... no evidence of a difference at 6 or 12 months"
  ghi_chu: "Karyotaki toàn văn PMC8027916. Chip Khá vững hợp: khác biệt có/không hướng dẫn chỉ thấy ngay sau điều trị."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n55
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression", "https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content"]
  trich: "They last most of the day, nearly every day, for at least two weeks. ... Seek care if you have symptoms of depression. ... If you think you are in immediate danger of harming yourself, contact any available emergency services"
  ghi_chu: "gần chẩn đoán: danh sách dấu hiệu; nên kèm câu 'chỉ người có chuyên môn mới chẩn đoán được' như ở bài Tìm giúp đỡ."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n56
  luot_2: dung
  nguon: ["https://doi.org/10.1037/bul0000465"]
  trich: "Most available evidence (83.4%-86.1%) comes from high-income and Western countries, but their dominance is declining."
