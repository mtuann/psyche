- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n2
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression", "https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content"]
  trich: "If you think you are in immediate danger of harming yourself, contact any available emergency services or a crisis line. | mhGAP: Conducting an assessment for MNS conditions involves ... establish a differential diagnosis, and identify the MNS condition (do người cung cấp dịch vụ y tế thực hiện)."
  ghi_chu: "Câu đúng chuẩn mục 5 (đầu trang dẫn tới Hỗ trợ, nhắc không tự chẩn đoán). Số điện thoại ở trang Hỗ trợ không thuộc phần này."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n4
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression"]
  trich: "In high-income countries, only about one third of people with depression receive mental health treatment"
  ghi_chu: "Fact sheet cập nhật 11/09/2026. Vế 'nhiều người chờ đến khi không chịu nổi' là diễn giải chung, không có số."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n6
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression", "https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content"]
  trich: "Seek care if you have symptoms of depression. | mhGAP có lối quản lý riêng cho 'Acute emotional distress' không phải rối loạn."
  ghi_chu: "Lời khuyên tìm trò chuyện, không phải chẩn đoán."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n7
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression"]
  trich: "It is different from regular mood changes and feelings about everyday life."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n8
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression", "https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content"]
  trich: "They last most of the day, nearly every day, for at least two weeks. | mhGAP Master Chart: Persistent sadness or depressed mood, anxiety ... Low energy, fatigue, sleep problems"
  ghi_chu: "gần chẩn đoán: ngưỡng 'từ hai tuần trở lên' trùng tiêu chí thời gian của giai đoạn trầm cảm (WHO); câu chỉ dùng làm ngưỡng 'cân nhắc tìm giúp đỡ' nên đúng, nhưng phải luôn đi kèm lời nhắc chỉ chuyên gia mới chẩn đoán (n12) và không được biến thành bảng tự chấm. Với lo âu, hai tuần không phải tiêu chí chẩn đoán (ICD-11 cho rối loạn lo âu lan tỏa đòi nhiều tháng), nên không nên trình bày như tiêu chí."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n9
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression", "https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content"]
  trich: "avoid or cut down on alcohol and don't use illicit drugs, which can make depression worse | mhGAP: Explore tobacco, alcohol and substance use."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n10
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content"]
  trich: "Master Chart, common presentation: Marked behavioural changes; neglecting usual responsibilities related to work, school, domestic or social activities"
  ghi_chu: "mhGAP xếp 'thay đổi hành vi rõ' vào biểu hiện thường gặp (chủ yếu của loạn thần); dùng làm dấu hiệu nên tìm giúp đỡ là hợp lý."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n11
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression", "https://www.nhs.uk/nhs-services/mental-health-services/where-to-get-urgent-help-for-mental-health/"]
  trich: "If you think you are in immediate danger of harming yourself, contact any available emergency services or a crisis line. | NHS: call 999 or go to A&E if ... you do not feel you can keep yourself or someone else safe"
  ghi_chu: "Đúng hướng dẫn đưa tin an toàn: không mô tả cách thức, có đường tới trợ giúp."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n12
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content"]
  trich: "First, the presenting complaint is explored, then a history is obtained ... establish a differential diagnosis, and identify the MNS condition."
  ghi_chu: "Chẩn đoán cần đánh giá đủ bước của người có chuyên môn; câu này là lời rào đúng chuẩn mục 5."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n15
  luot_2: dung
  nguon: ["https://dictionary.apa.org/psychiatrist", "https://pbgdpl.cantho.gov.vn/attachment/2200"]
  trich: "APA: a physician who specializes in the diagnosis, treatment, prevention, and study of mental ... disorders; residency: learning diagnosis and the use of psychiatric medications and other treatment modes. | Luật 15/2023 Điều 62.2.b: Căn cứ vào tình trạng bệnh của người bệnh, áp dụng điều trị ngoại trú, điều trị ban ngày hoặc điều trị nội trú."
  ghi_chu: "APA không nói về chỉ định nhập viện; vế ấy dựa vào Điều 62 Luật Khám bệnh, chữa bệnh (người hành nghề quyết định điều trị nội trú). Luật số 15/2023/QH15, bản đăng trên Cổng PBGDPL TP Cần Thơ (file .doc của văn bản ký ngày 09/01/2023)."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n16
  luot_2: dung
  nguon: ["https://luatvietnam.vn/y-te/thong-tu-26-2025-tt-byt-quy-dinh-ke-don-thuoc-hoa-duoc-sinh-pham-tai-co-so-kham-chua-benh-404246-d1.html", "https://pbgdpl.cantho.gov.vn/attachment/2200"]
  trich: "Thông tư 26/2025/TT-BYT, Điều 2: Người hành nghề khám bệnh, chữa bệnh có chứng chỉ hành nghề hoặc giấy phép hành nghề khám bệnh, chữa bệnh với chức danh là bác sỹ, y sỹ có thẩm quyền kê đơn thuốc."
  ghi_chu: "Trong ba vai trò (bác sĩ tâm thần, nhà tâm lý lâm sàng, tham vấn viên) chỉ bác sĩ kê đơn: đúng. Ngoài ba vai trò, y sỹ cũng được kê đơn. Văn bản đọc qua luatvietnam.vn (chưa mở được bản trên vbpl/chinhphu); TT 26/2025 hiệu lực 01/07/2025."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n17
  luot_2: dung
  nguon: ["https://pbgdpl.cantho.gov.vn/attachment/2200", "https://trungtamytekhanhson.khanhhoa.gov.vn/wp-content/uploads/2024/01/Thông-tư-32-2023-TT-BYT.pdf"]
  trich: "Luật 15/2023 Điều 26.1: Chức danh chuyên môn phải có giấy phép hành nghề bao gồm: ... h) Tâm lý lâm sàng; Điều 121.1: Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2024 | TT 32/2023 Điều 11 khoản 11: phạm vi hành nghề tâm lý lâm sàng ... bao gồm đánh giá các rối loạn tâm thần, chỉ định, xây dựng và triển khai các can thiệp tâm lý"
  ghi_chu: "Phạm vi công việc (đánh giá, can thiệp tâm lý) do Thông tư 32/2023/TT-BYT quy định (Luật Điều 26.3 giao Bộ trưởng), không ghi trong chính Luật; nên viết 'Theo Luật ... và Thông tư 32/2023/TT-BYT'. Không kê đơn: theo TT 26/2025 Điều 2 chỉ bác sỹ, y sỹ kê đơn. Lưu ý: kiểm tra đánh giá năng lực cho chức danh tâm lý lâm sàng áp dụng từ 01/01/2029 (Điều 121), cấp phép trước đó vẫn bắt buộc. Luật số 15/2023/QH15, bản đăng trên Cổng PBGDPL TP Cần Thơ (file .doc của văn bản ký ngày 09/01/2023)."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n18
  luot_2: dung
  nguon: ["https://pbgdpl.cantho.gov.vn/attachment/2200"]
  trich: "Điều 26.1 liệt kê: Bác sỹ; Y sỹ; Điều dưỡng; Hộ sinh; Kỹ thuật y; Dinh dưỡng lâm sàng; Cấp cứu viên ngoại viện; Tâm lý lâm sàng; Lương y; Người có bài thuốc gia truyền ... (không có tham vấn viên)."
  ghi_chu: "Toàn văn Luật không có chữ 'tham vấn'. Vế 'được đào tạo rất khác nhau' và 'lắng nghe, hỗ trợ, tư vấn' không có nguồn bậc 1–2 riêng; là hệ quả hợp lý của việc không có chuẩn chung, nên giữ lời lẽ thận trọng."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n19
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression", "https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content"]
  trich: "Psychological treatments are the first treatments for depression. They can be combined with antidepressant medicines in moderate and severe depression. | mhGAP: specialists have an essential and substantial role ... consultation or referral"
  ghi_chu: "Kết hợp thuốc và trị liệu là hướng dẫn của WHO; câu không khuyên cá nhân dùng thuốc."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n20
  luot_2: dung
  nguon: ["https://pbgdpl.cantho.gov.vn/attachment/2200", "https://doi.org/10.1037/pst0000172", "https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content"]
  trich: "Luật Điều 26: tâm lý lâm sàng phải có giấy phép hành nghề | Flückiger 2018: The overall alliance-outcome association for face-to-face psychotherapy was r = .278 | mhGAP: Explain that information discussed during the visit will be kept confidential"
  ghi_chu: "Lời khuyên hỏi giấy phép có căn cứ luật; 'không hợp thì tìm người khác' dựa trên liên minh trị liệu đi kèm kết quả (tương quan)."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n21
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content"]
  trich: "Presenting Complaint ... Ask when, why, and how it started ... Past MNS History ... Explore tobacco, alcohol and substance use. General Health History Ask about physical health problems and medications ... Family History of MNS Conditions ... Psychosocial History ... how the person is functioning at home, work and in relationships"
  ghi_chu: "Giấc ngủ, ăn uống không ghi riêng trong đoạn bệnh sử nhưng có trong biểu hiện thường gặp (sleep problems) và khám trạng thái tâm thần."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n22
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content", "https://doi.org/10.1017/S0033291714001299"]
  trich: "Evaluate for thoughts, plans and acts of self-harm during the initial assessment ... Asking about self-harm does NOT provoke acts of self-harm. | Dazzi 2014: None found a statistically significant increase in suicidal ideation among participants asked about suicidal thoughts."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n23
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content", "https://pbgdpl.cantho.gov.vn/attachment/2200"]
  trich: "mhGAP: Allow the person to speak without interruption ... Allow the person to ask questions about the information provided. | Luật Điều 9.1: Được thông tin, giải thích về tình trạng sức khỏe; phương pháp ... Điều 11.1: Lựa chọn phương pháp khám bệnh, chữa bệnh sau khi được cung cấp thông tin, giải thích, tư vấn đầy đủ"
  ghi_chu: "'Xin ý kiến thứ hai' không ghi thành chữ trong Luật nhưng không bị cấm và phù hợp quyền lựa chọn; giữ ở dạng lời khuyên."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n24
  luot_2: dung
  nguon: ["https://pbgdpl.cantho.gov.vn/attachment/2200", "https://www.apa.org/ethics/code/ethics-code-2017.pdf"]
  trich: "Điều 10.2: Được giữ bí mật thông tin trong hồ sơ bệnh án và thông tin khác về đời tư mà người bệnh đã cung cấp ..., trừ trường hợp người bệnh đồng ý chia sẻ thông tin theo quy định của pháp luật hoặc trường hợp quy định tại khoản 3 và khoản 4 Điều 69 | APA Ethics Code 4.05(b): ... where permitted by law for a valid purpose such as to ... (3) protect the client/patient, psychologist, or others from harm"
  ghi_chu: "Điều 10 đúng số điều. Vế 'ở nhiều nước' chỉ có một nguồn nước ngoài (APA, Mỹ) đã mở; đủ cho 'thường gặp' nhưng không nên nói thêm. Luật số 15/2023/QH15, bản đăng trên Cổng PBGDPL TP Cần Thơ (file .doc của văn bản ký ngày 09/01/2023)."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n25
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content"]
  trich: "Be friendly, respectful and non-judgemental at all times ... It is important at this stage to gather as much information as possible about the person's symptoms and their situation."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n26
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression", "https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content"]
  trich: "Seek care if you have symptoms of depression. | mhGAP có hướng xử trí cho 'Acute emotional distress' (không phải rối loạn)"
  ghi_chu: "So sánh với đau dạ dày là ẩn dụ, không phải nhận định cần nguồn."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n27
  luot_2: dung
  nguon: ["https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content"]
  trich: "COMMUNICATION TIP #4 Be friendly, respectful and non-judgemental at all times ... ensure care is provided in a non-judgmental, non-stigmatizing, and supportive manner."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n28
  luot_2: dung
  nguon: ["https://pbgdpl.cantho.gov.vn/attachment/2200", "https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content"]
  trich: "Luật Điều 69.2: Hồ sơ bệnh án phải được lưu giữ và giữ bí mật theo quy định của pháp luật; khoản 3, 4 liệt kê người được tiếp cận | mhGAP: Explain that information discussed during the visit will be kept confidential"
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n30
  luot_2: dung
  nguon: ["https://doi.org/10.1016/j.jad.2013.10.002", "https://doi.org/10.1038/s41398-019-0460-3"]
  trich: "Ghio 2014: Pooled data indicates the overall positive effect of shorter duration of untreated illness both in a patient's response to treatment (RR 1.70) and remission (RR 1.65). | Kraus 2019: duration of untreated depression correlates with worse outcomes."
  ghi_chu: "Câu viết 'đi kèm' (tương quan) là đúng mức. Nhãn: chỉ một phân tích tổng hợp gộp 3 nghiên cứu quan sát, dị biệt lớn, cộng một tổng quan tường thuật; theo thước đo mục 4 tối đa là Khá vững. Nếu khung đang ghi Vững chắc thì là quá mạnh, cần hạ. Chỉ đọc tóm tắt."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n31
  luot_2: dung
  nguon: ["https://doi.org/10.1016/j.jad.2013.10.002"]
  trich: "Ten studies were identified ... Only three studies reported comparable data and were consequently used for the meta-analysis. ... LIMITATIONS: The heterogeneity of the selected studies was cause for limitations"
  ghi_chu: "Chỉ đọc tóm tắt. Vế 'nghiên cứu quan sát' tóm tắt không ghi chữ, nhưng thời gian chưa điều trị không thể chia ngẫu nhiên nên các nghiên cứu này tất yếu là quan sát."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n32
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression", "https://doi.org/10.1038/s41398-019-0460-3"]
  trich: "Psychological treatments are the first treatments for depression. They can be combined with antidepressant medicines in moderate and severe depression. | Kraus 2019: we outline a sequential treatment optimization paradigm for selecting first-, second-, and third-line treatments"
  ghi_chu: "Nhãn Vững chắc (nếu có) hợp cho vế 'giúp được nhiều người' (nhiều phân tích tổng hợp, WHO). Câu không khuyên cá nhân dùng hay ngừng thuốc."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n33
  luot_2: dung
  nguon: ["https://cdn.who.int/media/docs/default-source/mental-health/mental-health-atlas-2020-country-profiles/vnm.pdf?sfvrsn=3c00af7f_4&download=true"]
  trich: "Hồ sơ Viet Nam, Atlas 2020: tổng nhân lực sức khỏe tâm thần 4 015, 4.16 trên 100 000 dân; biểu đồ 'Mental health workers per 100 000 population, 2014 and 2020': 3.91, 4.16"
  ghi_chu: "Biểu đồ của hồ sơ ghi mốc 2020. Atlas 2020 vẫn là bản mới nhất WHO đăng hồ sơ quốc gia mà tôi tìm được (11/2026)."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n34
  luot_2: dung
  nguon: ["https://doi.org/10.1891/0889-8391.28.3.156"]
  trich: "Key challenges included cultural factors (e.g., a lack of recognition of depression as a health-related entity amenable to professional treatment ...) and health system (e.g., lack of mental health specialists, overburdened health providers ...)"
  ghi_chu: "Toàn văn PMC4283138; chương trình ở 'rural Vietnam'."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n35
  luot_2: dung
  nguon: ["https://pbgdpl.cantho.gov.vn/attachment/2200"]
  trich: "Điều 26.1 không có tham vấn viên; toàn văn Luật không có chữ 'tham vấn'."
  ghi_chu: "Luật số 15/2023/QH15, bản đăng trên Cổng PBGDPL TP Cần Thơ (file .doc của văn bản ký ngày 09/01/2023)."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n36
  luot_2: sai
  nguon: ["https://cdn.who.int/media/docs/default-source/mental-health/mental-health-atlas-2020-country-profiles/vnm.pdf?sfvrsn=3c00af7f_4&download=true", "https://doi.org/10.1891/0889-8391.28.3.156"]
  trich: "Atlas 2020: 4.16 người làm chuyên môn sức khỏe tâm thần trên 100 000 dân; 0.99 bác sĩ tâm thần, 0.11 nhà tâm lý | Ngo 2014: Vietnam faces a severe shortage of mental health specialists"
  cau_dung: "Bỏ nhãn 'Đang tranh cãi' cho khung này. Nếu giữ khung nhãn, ý chính phải là một khẳng định, ví dụ: 'Khá vững: Việt Nam còn thiếu nhân lực sức khỏe tâm thần (khoảng 4 người trên 100.000 dân theo Atlas 2020 của WHO) và dịch vụ trị liệu tâm lý còn ít.'"
  ghi_chu: "Nhãn không khớp thước đo mục 4. 'Đang tranh cãi' đòi bằng chứng chất lượng cao mâu thuẫn nhau. Các nguồn về hệ thống ở Việt Nam (Atlas WHO, Ngo 2014) cùng chiều về tình trạng thiếu nhân lực, và ý chính lại là một câu hỏi. Đây là mô tả hiện trạng (thời sự, cần mốc), không phải điểm khoa học tranh cãi."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n37
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression", "https://www.nhs.uk/nhs-services/mental-health-services/where-to-get-urgent-help-for-mental-health/", "https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content"]
  trich: "WHO: If you think you are in immediate danger of harming yourself, contact any available emergency services | NHS: call 999 or go to A&E ... someone's life is at risk – for example, they have seriously injured themselves or taken an overdose ... you do not feel you can keep yourself or someone else safe"
  ghi_chu: "NHS tách 'ý nghĩ tự tử' (gọi 111, bác sĩ gia đình khẩn) khỏi 'nguy hiểm tính mạng' (999). Ở Việt Nam không có tầng 111, nên đưa 'ý nghĩ tự làm hại' vào mức giúp đỡ ngay là thận trọng và hợp lý. 'Đang say' mơ hồ: nên hiểu là say kèm nguy hiểm."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n38
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression"]
  trich: "They last most of the day, nearly every day, for at least two weeks. ... avoid or cut down on alcohol and don't use illicit drugs, which can make depression worse"
  ghi_chu: "gần chẩn đoán: bảng phân mức (ngay, vài ngày tới…) với ngưỡng hai tuần gần với tiêu chí chẩn đoán; đúng nội dung nhưng phải giữ là gợi ý tìm giúp đỡ, kèm lời nhắc chỉ chuyên gia chẩn đoán. Mốc 'trong vài ngày tới' là lời khuyên của trang, không có nguồn ghi đúng mốc ấy."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n39
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression", "https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content"]
  trich: "Seek care if you have symptoms of depression. | mhGAP: Acute emotional distress (xử trí cả khi không có rối loạn)"
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n41
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/depression"]
  trich: "They last most of the day, nearly every day, for at least two weeks."
  ghi_chu: "gần chẩn đoán: câu hỏi kiểm tra dùng ngưỡng thời gian và mức ảnh hưởng (giống cấu trúc tiêu chí chẩn đoán); câu đã ghi rõ 'đây là gợi ý, không phải tự chẩn đoán' nên đạt."
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n42
