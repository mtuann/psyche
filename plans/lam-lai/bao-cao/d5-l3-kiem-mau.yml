- trang: kham-pha/tinh-cach/mbti
  id: n4
  cau: MBTI là bảng hỏi tự báo cáo gồm 4 cặp đối lập (hướng ngoại–hướng nội, giác quan–trực giác, lý trí–cảm xúc, nguyên tắc–linh hoạt), cho 16 "loại" bốn chữ cái như INTJ hay ESFP.
  loai: dinh-nghia
  nguon:
    - ten: "Pittenger (2005), Consult Psychol J 57(3), 210–221: toàn văn (Internet Archive)"
      link: https://doi.org/10.1037/1065-9293.57.3.210
    - ten: "McCrae & Costa (1989), J Pers 57(1), 17–40: toàn văn (Internet Archive; chữ quét có lỗi OCR)"
      link: https://doi.org/10.1111/j.1467-6494.1989.tb00759.x
  ket_qua_luot_1: dung
  ghi_chu: "Tên bốn cặp theo mô tả của McCrae & Costa 1989 và Pittenger 2005. Review (Claude Sonnet 5.5, 10/11/2026): dung. Bốn cặp E–I, S–N, T–F, J–P và công thức bốn chữ cái khớp McCrae & Costa 1989 và Pittenger 2005 (PDF tr. 3)."
- trang: kham-pha/tinh-cach/mbti
  id: n30
  cau: "Nhiễu đo gần điểm cắt: thay đổi nhãn tập trung ở người có điểm gần giữa; người điểm cực đoan ổn định hơn."
  loai: phat-hien
  nguon:
    - ten: "Pittenger (1993), Rev Educ Res 63(4), 467–488: toàn văn (Internet Archive, zip 10.3102)"
      link: https://doi.org/10.3102/00346543063004467
    - ten: "Pittenger (2005), Consult Psychol J 57(3), 210–221: toàn văn (Internet Archive)"
      link: https://doi.org/10.1037/1065-9293.57.3.210
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "gieo đồng xu có trọng số... số đông ở giữa nhảy loại liên tục". Nay chỉ nói điều nguồn nói. Review (Claude Sonnet 5.5, 10/11/2026): dung. Pittenger 2005 (PDF tr. 5): "the greatest proportion of changes occurred when the initial preference score was close to the middle of the scale (1 to 15 points on either side of the midpoint)". Khớp; "người điểm cực đoan ổn định hơn" là hệ quả của chính câu ấy.'
- trang: kham-pha/tinh-cach/mbti
  id: n5
  cau: Điểm số của con người trên mỗi chiều là liên tục, nhưng MBTI chuyển chúng thành nhị phân.
  loai: phat-hien
  nguon:
    - ten: "McCrae & Costa (1989), J Pers 57(1), 17–40: toàn văn (Internet Archive; chữ quét có lỗi OCR)"
      link: https://doi.org/10.1111/j.1467-6494.1989.tb00759.x
    - ten: "Pittenger (1993), Rev Educ Res 63(4), 467–488: toàn văn (Internet Archive, zip 10.3102)"
      link: https://doi.org/10.3102/00346543063004467
  ket_qua_luot_1: dung
  ghi_chu: 'Review (Claude Sonnet 5.5, 10/11/2026): dung. McCrae & Costa 1989 tóm tắt (đọc lại): "no support for the view that the MBTI measures truly dichotomous preferences or qualitatively distinct types; instead ... four relatively independent dimensions".'
