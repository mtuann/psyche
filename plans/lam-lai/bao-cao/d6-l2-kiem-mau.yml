- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n64
  cau: Chúng tôi chưa có khảo sát về mức độ phổ biến của quan niệm "não trái/não phải" ở Việt Nam; hiểu đúng nghiên cứu gốc giúp phân biệt khoa học thật với lời quảng cáo.
  loai: thoi-su
  nguon:
    - ten: "Dekker và cộng sự (2012), Front Psychol 3, 429: toàn văn (PDF truy cập mở)"
      link: https://doi.org/10.3389/fpsyg.2012.00429
    - ten: 'Tìm trên Europe PMC (10/11/2026): "split-brain Vietnam", "callosotomy Vietnam", "corpus callosotomy Vietnamese patients epilepsy" (kết quả đáng kể: Nguyen và cộng sự 2020; Nguyen và cộng sự, Neurosurg Focus 2018, chương trình phẫu thuật động kinh ở Việt Nam) và "Vietnamese … hemispheric language lateralization": không có nghiên cứu chức năng hai bán cầu kiểu não chẻ hay đo ưu thế ngôn ngữ trên người Việt. Chưa tìm Google Scholar hay tạp chí trong nước'
      link: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=callosotomy%20Vietnam&format=json
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "huyền thoại … rất phổ biến ở Việt Nam — từ các bài trắc nghiệm vui trên mạng xã hội đến những khóa học kích hoạt não phải cho trẻ được quảng cáo rầm rộ … Sperry và Gazzaniga chưa bao giờ nói có người não trái và người não phải". Chữ mới: không khẳng định mức độ phổ biến ở Việt Nam; dẫn khảo sát ở Anh và Hà Lan; nói nghiên cứu não chẻ nói về chức năng bán cầu, không về kiểu người. Lý do: không mở được nguồn nào kiểm mức độ phổ biến ở Việt Nam (bài báo VTC News 2016 tìm thấy qua tìm kiếm nhưng không mở được, 523); "chưa bao giờ nói" là phủ định tuyệt đối không kiểm được. Review (Claude Opus 5.5, 10/11/2026): dung. Trang không còn khẳng định mức độ phổ biến ở Việt Nam; dẫn Dekker 2012 cho Anh và Hà Lan (đã kiểm ở n43).'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n72
  cau: "Đọc thêm: link tới gen-va-tinh-cach, vi-sao-ta-quen và doi-pho-stress."
  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: 'Đã kiểm: gen-va-tinh-cach và vi-sao-ta-quen có trang; /kham-pha/cang-thang-giac-ngu/doi-pho-stress/ chưa có trang trong src/content/docs (chưa chuyển); link sẽ hỏng đến khi có trang. Ghi cho người giao. Review (Claude Sonnet 5.5, 10/11/2026): dung. Loại ve-site đúng (liên kết nội bộ). Trang có ba link: gen-va-tinh-cach, vi-sao-ta-quen (có trang) và doi-pho-stress (có trong trang.yml, chưa chuyển nên thành chữ "sắp có", tự thành link khi trang lên). Mô tả ngắn khớp nội dung trang đích (trang.yml).'
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n15
  cau: Trước nghiên cứu Minnesota mới có ba nghiên cứu sinh đôi nuôi tách nhau, quy mô khiêm tốn.
  loai: lich-su
  nguon:
    - ten: "Bouchard, Lykken, McGue, Segal & Tellegen (1990), Science 250(4978), 223–228: toàn văn (PDF ở gwern.net/doc/iq/1990-bouchard.pdf)"
      link: https://doi.org/10.1126/science.2218526
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "phải đến cuối thế kỷ 20, ý tưởng ấy mới có dữ liệu xứng tầm — nhờ một nghiên cứu ở Minnesota". Chữ mới: "mới có ba nghiên cứu nuôi tách nhau, quy mô khiêm tốn; nghiên cứu Minnesota là lần có dữ liệu lớn hơn hẳn". Lý do: bám nguồn; "xứng tầm" là đánh giá. Review (Claude Opus 5.5, 10/11/2026): dung. Câu trích Bouchard 1990 ("only three previous studies of modest scope") do lượt 1 và lượt 2 cùng đọc; review không mở lại toàn văn (bản sao trên gwern.net bị chặn ở review vì là bản của bài có tường phí). Trang khớp câu trích.'
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n34
  cau: Eastwick và cộng sự (2014) là tổng quan kèm phân tích tổng hợp 97 nghiên cứu về việc vẻ ngoài và triển vọng kiếm tiền dự báo đánh giá lãng mạn.
  loai: so-lieu
  nguon:
    - ten: "Eastwick và cộng sự (2014), Psychol Bull 140(3), 623–665: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1037/a0032432
  ket_qua_luot_1: dung
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n24
  cau: Berridge, Venier và Robinson (1989) tiêm 6-OHDA vào vùng chất đen của chuột; chuột trở nên biếng ăn (aphagia), không tự ăn nữa.
  loai: phat-hien
  nguon:
    - ten: "Berridge, Venier & Robinson (1989), Behav Neurosci 103(1), 36–45: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1037/0735-7044.103.1.36
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "phá hủy hệ dopamine bằng 6-OHDA... biếng ăn hoàn toàn: không tự đi tìm hay ăn". Chữ mới: tổn thương qua tiêm vào chất đen; "không tự ăn". Lý do: "hoàn toàn" và "tìm thức ăn" không có trong tóm tắt. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp tóm tắt Berridge 1989 (OpenAlex): "rats made aphagic by intranigral 6-OHDA injections".'
