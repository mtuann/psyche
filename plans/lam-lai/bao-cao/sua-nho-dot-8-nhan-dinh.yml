- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n9
  cau: "Vòng tròn Ebbinghaus: một vòng tròn ở giữa các vòng tròn to trông nhỏ hơn vòng tròn y hệt ở giữa các vòng tròn nhỏ."
  loai: dinh-nghia
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n50
  cau: Hình mang tên Hermann Ebbinghaus, người có lẽ đưa ra nó từ những năm 1890; trong tiếng Anh hình còn được gọi là "vòng tròn Titchener", nhưng Edward B. Titchener không tạo ra hình này và cũng không nhận là của mình (Burton, 2001).
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n43
  cau: "Liên hệ giữa EQ năng lực và hiệu suất không nhất quán (dương ở công việc nhiều lao động cảm xúc, âm ở công việc ít lao động cảm xúc), trong khi EQ tự báo cáo/mixed cho tương quan cao: theo Joseph và cộng sự (2015) kể lại, hệ số hiệu chỉnh trong bài này là ρ = .47, khiến EQ mixed trông như một trong những yếu tố dự báo hiệu suất tốt nhất."
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n70
  cau: "Đang tranh cãi: EQ là yếu tố dự báo thành công trong đời tốt nhất, quan trọng hơn IQ (chưa có nghiên cứu đo thẳng; ở hiệu suất công việc, hiệu ứng nhỏ hơn nhiều so với lời quảng bá)."
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n72
  cau: "Chúng tôi không tìm thấy phân tích tổng hợp nào ủng hộ thông điệp ấy: Joseph và Newman (2010) thấy liên hệ giữa EQ năng lực và hiệu suất không nhất quán (dương ở công việc đòi hỏi nhiều lao động cảm xúc, âm ở công việc ít đòi hỏi); EQ mixed tương quan cao hơn, nhưng Joseph và cộng sự (2015) thấy phần dự báo ấy gần bằng 0 khi kiểm soát các khái niệm mà thang đo này trùng lắp (năng lực nhận thức, một số đặc điểm tính cách, sự tự tin, tự đánh giá hiệu suất và EQ năng lực)."
  loai: so-lieu
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n38
  cau: "Đang tranh cãi: vì sao ta mắc bẫy — heuristic hay cách diễn đạt?"
  loai: nhan
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n73
  cau: Một giả thuyết khác, của một số tác giả như Adler, Dulany và Hilton, Politzer và Noveck (theo Hertwig và Gigerenzer, 1999), là người nghe ngầm hiểu "(a) Linda là nhân viên ngân hàng" thành "nhân viên ngân hàng và không phải nhà hoạt động nữ quyền", và với cách hiểu đó thì chọn (b) không còn là lỗi logic; theo Hertwig và Gigerenzer, các dự đoán rút từ giả thuyết này chưa được xác nhận.
  loai: lich-su
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n74
  cau: 'Mục Lý thuyết: theo các nhà phê bình như Gigerenzer và Hertwig, người tham gia hiểu câu hỏi theo thói quen giao tiếp, có thể hiểu "xác suất" và "và" khác nghĩa toán học (Tentori 2004 cũng nêu); một số tác giả khác cho rằng người tham gia hiểu (a) và (b) là hai nhóm loại trừ nhau; Tversky và Kahneman (1983) đã thử cách hiểu này, và theo Hertwig và Gigerenzer (1999), các dự đoán của giả thuyết ấy chưa được xác nhận.'
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n35
  cau: 'Khung "Vững chắc": dãy chữ hay từ giống nhau về âm thì nhớ kém hơn (Conrad 1964; Baddeley 1966a); Oberauer và cộng sự (2018) xếp hiệu ứng vào nhóm phát hiện cơ bản, quan sát được dù trình bày bằng mắt hay bằng tai, và cho rằng điều này gợi ý âm thanh là dạng mã được ưu tiên của trí nhớ làm việc cho lời nói; vòng lặp âm vị là cách giải thích phổ biến nhất.'
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n71
  cau: 'Khung "Khá vững": dãy từ nhiều âm tiết thường nhớ được ít hơn dãy từ ngắn; Oberauer và cộng sự (2018) xếp hiệu ứng độ dài từ (Baddeley và cộng sự 1975) vào nhóm phát hiện ổn định, quan sát được ở nhiều ngôn ngữ khi độ dài thay đổi bằng số âm tiết; cách giải thích còn tranh cãi: từ dài và ngắn thường khác nhau cả ở số từ láng giềng có chính tả và âm gần giống, và khi cân bằng thêm các yếu tố này, hiệu ứng mất đi ở bài nhận diện thứ tự (Guitard, Neath và Surprenant 2025), như các nghiên cứu trước ở bài nhớ lại theo thứ tự mà họ dẫn; chưa chắc độ dài tự nó là nguyên nhân.'
  loai: nhan
- trang: bang-chung/dao-duc-nghien-cuu
  id: e4
  cau: "Belmont nhắc tới nghiên cứu giang mai ở Tuskegee: các nam giới da đen thiệt thòi ở nông thôn được dùng để nghiên cứu diễn tiến tự nhiên của bệnh, và họ bị từ chối phương pháp điều trị hiệu quả đã có."
  loai: lich-su
