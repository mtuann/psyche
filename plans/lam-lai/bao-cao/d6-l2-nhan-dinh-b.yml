- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n1
  cau: Từ chọn lọc giới tính của Darwin đến nghiên cứu chọn bạn đời ở 37 nền văn hóa của Buss (1989), nhiều "lời giải thích" của tâm lý học tiến hóa bị gọi là chuyện kể vừa vặn (mô tả).
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n3
  cau: Một số nhà tâm lý học nói não ta được "lập trình" từ thời tổ tiên săn bắn hái lượm, nơi ngoại hình có thể báo hiệu khả năng sinh sản.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n4
  cau: Tâm lý học tiến hóa dùng chọn lọc tự nhiên và chọn lọc giới tính để giải thích đặc điểm tâm lý và hành vi của con người.
  loai: dinh-nghia
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n5
  cau: Ngành này có những nghiên cứu xuyên văn hóa ấn tượng và cũng hứng những phê bình sắc bén.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n6
  cau: "Năm 1859, Darwin xuất bản Nguồn gốc các loài và đề xuất chọn lọc tự nhiên: cá thể thích nghi tốt hơn với môi trường thì sống sót và sinh sản nhiều hơn, truyền đặc điểm cho đời sau."
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n7
  cau: Một số đặc điểm dường như không giúp sống sót, như đuôi công rực rỡ.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n8
  cau: "Darwin đề xuất chọn lọc giới tính trong Nguồn gốc con người (1871): một số đặc điểm tiến hóa vì giúp thu hút bạn tình hoặc đánh bại đối thủ cùng giới."
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n9
  cau: 'Hơn một thế kỷ sau, các nhà tâm lý học, trong đó có Buss, áp dụng logic này cho tâm trí: sở thích chọn bạn đời có thể phản ánh áp lực chọn lọc tổ tiên từng chịu; một số người cho rằng một số hành vi là "phần mềm cũ chạy trên phần cứng mới" (cách nói ví von).'
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n10
  cau: 'Buss khảo sát 10.047 người ở 37 mẫu: phụ nữ chuộng "triển vọng tài chính" hơn nam ở 36/37 mẫu (có ý nghĩa); nam chuộng ngoại hình hơn ở cả 37/37 mẫu theo đúng chiều (34 mẫu có ý nghĩa).'
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n11
  cau: "Lý giải: vì người nữ đầu tư sinh học nhiều hơn (mang thai, nuôi con), họ kén hơn về nguồn lực nuôi con; người nam cần dấu hiệu khả năng sinh sản (trẻ, khỏe, ngoại hình)."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n12
  cau: "Gould và Lewontin (1979) cảnh báo không phải đặc điểm nào cũng là thích nghi: nhiều thứ chỉ là sản phẩm phụ của cấu trúc (spandrel)."
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n13
  cau: Tên "chuyện kể vừa vặn" (just-so stories) lấy theo tập truyện Just So Stories của Rudyard Kipling.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n14
  cau: "Các nhà phê bình mô tả thói quen: thấy một hành vi, nghĩ ra một câu chuyện tiến hóa nghe hợp lý, rồi coi như đã giải thích xong."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n15
  cau: Điều người ta nói mình muốn ở bạn đời hầu như không dự báo được họ thực sự có cảm tình với ai khi gặp người thật (Eastwick và Finkel, 2008, hẹn hò tốc độ).
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n16
  cau: Buss khảo sát 31 phẩm chất của bạn đời lý tưởng (18 chấm điểm, 13 xếp hạng).
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n17
  cau: Mẫu gồm 10.047 người, 37 mẫu từ 33 nước thuộc 6 châu lục và 5 đảo.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n18
  cau: Trung bình khoảng 272 người mỗi mẫu.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n19
  cau: "Năm dự báo tiến hóa được kiểm chứng: nữ chuộng năng lực kiếm tiền và tham vọng; nam chuộng trẻ và ngoại hình; trinh tiết."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n20
  cau: Nhóm còn thu thập tuổi kết hôn thực tế ở 27 nước để kiểm chứng chéo.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n21
  cau: Nữ đánh giá "triển vọng tài chính tốt" cao hơn nam ở 36/37 mẫu có ý nghĩa thống kê; ngoại lệ duy nhất là mẫu Tây Ban Nha (cùng chiều nhưng chưa có ý nghĩa).
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n22
  cau: Nam đánh giá "ngoại hình" cao hơn nữ ở cả 37/37 mẫu theo đúng chiều, 34 mẫu có ý nghĩa thống kê.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n23
  cau: Nam muốn bạn đời trẻ hơn, nữ muốn bạn đời lớn tuổi hơn, ở cả 37 mẫu; khớp với tuổi kết hôn thực tế (chú rể 28,2; cô dâu 25,3).
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n24
  cau: '"Tham vọng, siêng năng": nữ cao hơn nam theo đúng chiều ở 34/37 mẫu (29 mẫu có ý nghĩa); ba mẫu (Colombia, Tây Ban Nha, Zulu) có chiều ngược lại, chỉ mẫu Zulu có ý nghĩa.'
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n25
  cau: "Trinh tiết là tiêu chí biến thiên văn hóa nhất, và chỉ 23/37 mẫu có khác biệt giới có ý nghĩa: các mẫu Trung Quốc, Ấn Độ, Indonesia, Iran, Đài Loan đánh giá rất cao; Thụy Điển, Na Uy, Phần Lan, Hà Lan, Tây Đức, Pháp coi là không liên quan hay không quan trọng."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n26
  cau: "Walter và cộng sự (2020) tái lập quy mô lớn: 14.399 người ở 45 quốc gia."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n27
  cau: "Nghiên cứu đồng thời kiểm chứng hai khung đối đầu: tâm lý học tiến hóa và lý thuyết vai trò xã hội (khác biệt giới bắt nguồn từ vai trò xã hội của hai giới)."
  loai: dinh-nghia
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n28
  cau: "Theo tóm tắt, khác biệt giới trong sở thích nêu ra vẫn vững: nam chuộng bạn tình trẻ, đẹp hơn; nữ chuộng bạn tình lớn tuổi, có triển vọng tài chính hơn."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n29
  cau: Ở nước càng bình đẳng giới, cả hai giới đều có bạn đời gần tuổi mình hơn.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n30
  cau: Ngoài tuổi bạn đời, cả mức lây nhiễm mầm bệnh lẫn bình đẳng giới đều không dự báo vững các khác biệt giữa các nước.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n31
  cau: "Việt Nam có mặt trong nghiên cứu Walter (2020): bốn tác giả thuộc Đại học Quốc gia Hà Nội."
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n32
  cau: Việt Nam không có trong nghiên cứu gốc của Buss (1989).
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n33
  cau: Eastwick & Finkel (2008) hỏi người tham gia về bạn đời lý tưởng trước một sự kiện hẹn hò tốc độ, rồi so với sự quan tâm thật với những người họ gặp.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n34
  cau: Eastwick và cộng sự (2014) là tổng quan kèm phân tích tổng hợp 97 nghiên cứu về việc vẻ ngoài và triển vọng kiếm tiền dự báo đánh giá lãng mạn.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n35
  cau: "Khi nêu tiêu chuẩn, người tham gia cho thấy khác biệt giới quen thuộc: nam coi trọng ngoại hình hơn, nữ coi trọng triển vọng kiếm tiền hơn."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n36
  cau: Với những người họ thực sự gặp, mối liên hệ giữa sự quan tâm và ngoại hình hay triển vọng kiếm tiền của người kia không khác nhau giữa hai giới.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n37
  cau: Tiêu chuẩn nêu ra từ trước sự kiện không dự báo được điều gây ra sự quan tâm thật.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n38
  cau: "Phân tích tổng hợp 2014: ngoại hình dự báo đánh giá lãng mạn ở mức vừa đến mạnh (r ≈ 0,40) và triển vọng kiếm tiền ở mức nhỏ (r ≈ 0,10) cho cả hai giới."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n39
  cau: Chênh lệch giữa hai giới ở các tương quan ấy chỉ khoảng r = 0,03 và không có ý nghĩa thống kê.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n40
  cau: "Bài học: điều ta nói mình muốn ở bạn đời không nhất thiết là điều làm ta rung động khi gặp người thật; Eastwick và Finkel giải thích theo hướng người ta có thể thiếu nhận biết nội quan về điều ảnh hưởng đến mình."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n41
  cau: Gould và Lewontin (1979) không phải thí nghiệm mà là bài phê bình lý thuyết, nổi tiếng trong sinh học tiến hóa.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n42
  cau: "Spandrel: khoảng tường tam giác cong giữa vòm và trần nhà thờ San Marco ở Venice, sản phẩm phụ tất yếu của cấu trúc vòm; nhiều đặc điểm sinh học có thể là sản phẩm phụ của đặc điểm khác."
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n43
  cau: Pangloss là nhân vật trong tiểu thuyết Candide của Voltaire, được Gould và Lewontin dùng để châm biếm thói gán cho mọi đặc điểm một câu chuyện thích nghi.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n44
  cau: 'Luận điểm cốt lõi: công dụng hiện tại không đồng nhất với lý do xuất hiện, và việc chỉ dựa vào "tính hợp lý" để chấp nhận một câu chuyện suy đoán bị tác giả phê phán.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n45
  cau: "Vững chắc: hành vi con người chịu ảnh hưởng của lịch sử tiến hóa."
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n46
  cau: "Khá vững: khác biệt giới trong sở thích bạn đời được nêu ra là có thật và xuyên văn hóa."
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n47
  cau: 'Đang tranh cãi: từng "câu chuyện thích nghi" cụ thể có đúng không, và khác biệt giới do tiến hóa hay do xã hội.'
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n48
  cau: "Đã bị bác bỏ: mọi đặc điểm tâm lý đều là thích nghi."
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n49
  cau: Cố định ngẫu nhiên các alen (trôi dạt gen) và tương quan phát triển có thể tạo ra đặc điểm không thích nghi (Gould và Lewontin, 1979).
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n50
  cau: Phe vai trò xã hội (Eagly và Wood, 1999) thấy khác biệt giới là hệ quả của vai trò xã hội; khi bình đẳng giới tăng thì khoảng cách tuổi bạn đời thu hẹp (Walter 2020), điều phe này coi là phù hợp.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n51
  cau: 'Chọn lọc tự nhiên (Darwin, 1859): cá thể có đặc điểm giúp sống sót và sinh sản tốt hơn truyền đặc điểm cho thế hệ sau nhiều hơn; qua nhiều thế hệ quần thể "vừa" dần với môi trường, như bàn tay vừa với găng.'
  loai: dinh-nghia
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n52
  cau: "Chọn lọc giới tính (Darwin, 1871): đặc điểm giúp thắng trong cuộc đua sinh sản, hoặc quyến rũ bạn tình hoặc đánh bại đối thủ cùng giới, có thể lan rộng dù bất lợi cho sinh tồn; đây là nền tảng lý thuyết cho dự báo của Buss."
  loai: dinh-nghia
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n53
  cau: "Lý thuyết đầu tư của cha mẹ (Trivers, 1972): giới đầu tư sinh học nhiều hơn kén chọn bạn tình hơn; từ đó Buss suy ra nữ kén nguồn lực, nam kén dấu hiệu sinh sản, và dữ liệu 37 mẫu khớp dự báo."
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n54
  cau: "Cách làm khoa học đúng: từ lý thuyết suy ra dự báo trước, kiểm chứng độc lập, tìm giải thích khác để loại trừ; Buss (1989) nêu năm dự báo từ lý thuyết trước rồi kiểm chứng ở nhiều mẫu, nhưng sự khớp không đều."
  loai: loi-khuyen
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n55
  cau: WEIRD là Western, Educated, Industrialized, Rich, Democratic; phần lớn nghiên cứu tâm lý dùng mẫu phương Tây rồi khái quát cho "con người" (Henrich, Heine và Norenzayan, 2010).
  loai: dinh-nghia
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n56
  cau: Buss (1989) đa dạng hơn mặt bằng chung nhưng mỗi mẫu trung bình chỉ ~272 người, cách lấy mẫu khác nhau giữa các nước và tác giả ghi mẫu không đại diện (nông thôn, ít học, thu nhập thấp ít có mặt).
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n57
  cau: 'Tận dụng (exaptation, Gould): đặc điểm tiến hóa cho mục đích A có thể sau đó được tận dụng cho mục đích B; công dụng hiện tại có thể không liên quan đến "mục đích gốc".'
  loai: dinh-nghia
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n58
  cau: 'Vững chắc (Áp dụng 1): "Tự nhiên" không có nghĩa là "đúng".'
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n59
  cau: 'Giải thích nguồn gốc tiến hóa của một hành vi (ghen tuông, ngoại tình, bạo lực) không biện minh cho nó về mặt đạo đức: từ "nó từng giúp tổ tiên sinh tồn" không suy ra được "nó là đúng".'
  loai: loi-khuyen
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n60
  cau: 'Khá vững (Áp dụng 2): đừng nhầm "tiêu chuẩn miệng" với con người thật.'
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n61
  cau: 'Vững chắc (Áp dụng 3): đọc tin "khoa học chứng minh đàn ông/đàn bà là thế" bằng con mắt phê bình (hỏi mẫu là ai, đo lời nói hay hành vi, có giải thích khác không).'
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n62
  cau: "Khá vững (Áp dụng 4): tiến hóa cho khuynh hướng, không cho định mệnh."
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n63
  cau: Việt Nam không có trong 37 mẫu của Buss (1989); danh sách mẫu gồm Trung Quốc, Đài Loan, Nhật Bản, Ấn Độ, Indonesia, Iran, Israel...; các con số 36/37, 37/37 không đến từ người Việt.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n64
  cau: "Việt Nam xuất hiện trong nghiên cứu tái lập Walter (2020): bốn tác giả thuộc Đại học Quốc gia Hà Nội; chưa mở được toàn văn nên không nói được dữ liệu Việt Nam được phân tích đến mức nào."
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n65
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu công bố nào kiểm chứng riêng các giả thuyết chọn bạn đời của Buss trên người Việt (có nghiên cứu khác về cảm nhận vẻ hấp dẫn khuôn mặt người Việt, 2023, nhưng không phải kiểm chứng này).
  loai: thoi-su
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n66
  cau: Chuẩn mực "môn đăng hộ đối", kỳ vọng con trai lập nghiệp trước khi cưới, con gái chịu áp lực lấy chồng sớm có thể gợi ý văn hóa và kinh tế định hình "sở thích" chọn bạn đời, phù hợp với lập luận phe vai trò xã hội — nhưng chỉ là suy đoán, chưa có dữ liệu.
  loai: loi-khuyen
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n67
  cau: '"Tiến hóa nghĩa là mọi đặc điểm đều có mục đích thích nghi" là sai: nhiều đặc điểm là sản phẩm phụ, kết quả ngẫu nhiên, hay bị ràng buộc bởi cấu trúc cơ thể.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n68
  cau: '"Gen đã định thì không thay đổi được" sai: khuynh hướng tiến hóa là xác suất, không phải định mệnh; văn hóa, luật pháp, giáo dục tạo ra khác biệt.'
  loai: loi-khuyen
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n69
  cau: '"Khoa học chứng minh đàn ông/đàn bà tự nhiên phải thế này" là sai: dữ liệu của chính Buss cho thấy biến thiên văn hóa lớn (trinh tiết).'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n70
  cau: '"Tâm lý học tiến hóa đã bị bác bỏ hoàn toàn" là sai: khung tiến hóa vẫn là khung để đặt câu hỏi, cái bị phê bình là thói kể chuyện thiếu kiểm chứng; các đợt kiểm chứng gần đây cho thấy một số kết quả của Buss vẫn đứng vững ở mức sở thích nêu ra.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n71
  cau: "Quiz 1: spandrel theo Gould và Lewontin là sản phẩm phụ tất yếu của cấu trúc, không phải thích nghi, dù sau này có thể được tận dụng."
  loai: dinh-nghia
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n72
  cau: "Quiz 2: các mẫu Trung Quốc đánh giá rất cao trinh tiết, Thụy Điển coi là không liên quan hay không quan trọng; chỉ 23/37 mẫu có khác biệt giới có ý nghĩa; nam chuộng ngoại hình (có ý nghĩa 34/37), nữ chuộng triển vọng tài chính (36/37)."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n73
  cau: "Quiz 3: Eastwick và Finkel (2008): tiêu chuẩn nêu ra từ trước không dự báo được điều thật sự gây quan tâm với những người vừa gặp, và với người thật khác biệt giới không còn thấy; không có nghĩa Buss sai."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/tam-ly-tien-hoa
  id: n74
  cau: 'Quiz 4: "nghe hợp lý" không phải bằng chứng: công dụng hiện tại không đồng nhất với nguồn gốc, và cần loại trừ giải thích khác; lời giải thích tiến hóa tốt phải dự báo trước và chịu kiểm chứng độc lập.'
  loai: loi-khuyen
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n47
  cau: "Dumitru và cộng sự (2025, Science): giải trình tự RNA nhân đơn thấy tế bào tiền thân đang tăng sinh ở hồi hải mã người trưởng thành; tranh luận về mức độ và ý nghĩa chưa kết thúc."
  loai: so-lieu
  nguon:
    - ten: "Dumitru và cộng sự (2025), Science: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1126/science.adu9575
  ket_qua_luot_1: dung
  ghi_chu: 'Mới thêm. "Tranh luận chưa kết thúc" theo tóm tắt báo chí (một báo cáo tin tức nói vẫn còn tranh luận), không theo bài gốc: chỗ chưa chắc.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n64
  cau: "Đọc thêm: link tới thuong-va-dong-luc và cam-xuc-co-ban."
  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: "Đã kiểm: các trang /kham-pha/cam-xuc-dong-luc/... chưa có trong src/content/docs (chưa chuyển); link chưa chạy cho đến khi có trang. Ghi cho người giao."
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n47
  cau: "Một hướng thử, không phải khuyến nghị đã kiểm chứng: đổi môi trường (tắt thông báo, để điện thoại xa tầm tay)."
  loai: loi-khuyen
  nguon:
    - ten: "Fiorillo, Tobler & Schultz (2003), Science 299, 1898–1902: tóm tắt (Europe PMC); toàn văn không mở được"
      link: https://doi.org/10.1126/science.1077349
  ket_qua_luot_1: da-lam-mem
  ghi_chu: "Không có nguồn kiểm chứng hiệu quả; trang ghi rõ không phải khuyến nghị đã kiểm chứng, nhãn tranh-cai. Chỗ khó: thiếu nguồn thực nghiệm về tắt thông báo (chưa tìm)."
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n11
  cau: Họ được chia ngẫu nhiên (mù đơn) thành hai nhóm trong một năm.
  loai: phat-hien
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: dung
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n58
  cau: '"Vùng não sáng lên khi quét não nghĩa là người ta sướng" là suy luận ngược (reverse inference), vốn không chặt chẽ: một vùng "sáng" có thể phản ánh nhiều quá trình.'
  loai: dinh-nghia
  nguon:
    - ten: "Poldrack (2006), Trends Cogn Sci 10(2), 59–63: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.tics.2005.12.004
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "lỗi suy luận ngược: ... chứ không riêng gì khoái cảm". Chữ mới nói "không chặt chẽ" theo Poldrack 2006.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n30
  cau: "Aghjayan và cộng sự (2022): phân tích tổng hợp 36 thử nghiệm ngẫu nhiên (2.750 người, tuổi trung bình ~71) về trí nhớ sự kiện."
  loai: so-lieu
  nguon:
    - ten: "Aghjayan và cộng sự (2022), Commun Med 2, 15: toàn văn (PMC9053291, truy cập mở)"
      link: https://doi.org/10.1038/s43856-022-00079-7
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: tiêu đề "cập nhật bằng phân tích mới nhất". Chữ mới bỏ "mới nhất" (có Ciria 2023 sau đó). Id mục cũ giữ bằng { #aghjayan-va-cong-su-2022-cap-nhat-bang-phan-tich-moi-nhat-ve-tri-nho-su-kien }.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n7
  cau: Ở người lớn tuổi không sa sút trí tuệ, hồi hải mã teo khoảng 1–2% thể tích mỗi năm, và sự teo này làm tăng nguy cơ suy giảm nhận thức.
  loai: so-lieu
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "từ khoảng tuổi trung niên, hồi hải mã bắt đầu teo dần... trí nhớ giảm và nguy cơ sa sút trí tuệ tăng". Chữ mới theo Erickson: "người lớn tuổi không sa sút trí tuệ"; "suy giảm nhận thức". Lý do: "tuổi trung niên" và "sa sút trí tuệ" không có trong câu của nguồn.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n28
  cau: Chuột vẫn có phản ứng "thích" bình thường; các tác giả kết luận hệ dopamine không cần để tạo ra khoái cảm cũng không cần cho việc học các mối liên hệ khoái cảm mới, và đề xuất dopamine có thể quan trọng hơn cho "wanting".
  loai: phat-hien
  nguon:
    - ten: "Berridge & Robinson (1998), Brain Res Rev 28(3), 309–369: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0165-0173(98)00019-8
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "Dopamine cần cho wanting... Hệ dopamine cần cho việc "muốn"". Chữ mới: "có thể quan trọng hơn" theo "may be".'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n65
  cau: '"BDNF trong máu tăng sau khi tập, tức là BDNF trong hồi hải mã tăng và đó là lý do não khỏe hơn" là bước suy luận chưa được chứng minh; máu có nhiều nguồn BDNF; trong Erickson, nhóm đi bộ không có thay đổi BDNF huyết thanh lớn hơn; thay đổi BDNF không liên quan đến cải thiện trí nhớ.'
  loai: phat-hien
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
    - ten: "Fujimura và cộng sự (2002), Thromb Haemost 87(4), 728–734: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1055/s-0037-1613072
    - ten: "Rasmussen và cộng sự (2009), Exp Physiol 94(10), 1062–1069: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1113/expphysiol.2009.048512
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "BDNF máu ~99% từ tiểu cầu... BDNF huyết tương không tăng tương ứng". Chữ mới như n41, n51.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n62
  cau: Các con số 2% hay g = 0,18 đến từ các nghiên cứu mà chúng tôi không biết có mẫu Việt Nam; thử nghiệm Erickson là ở Mỹ.
  loai: phat-hien
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
    - ten: "Aghjayan và cộng sự (2022), Commun Med 2, 15: toàn văn (PMC9053291, truy cập mở)"
      link: https://doi.org/10.1038/s43856-022-00079-7
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "đều đến từ các nước phương Tây, chủ yếu trên người lớn tuổi da trắng, ít vận động". Chữ mới bỏ "da trắng" và "các nước phương Tây" (nguồn không nêu); Erickson thực hiện ở Đại học Illinois.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n48
  cau: 'Khá vững (Áp dụng 2): phân biệt "muốn" và "thích" trong chính mình.'
  loai: nhan
  nguon:
    - ten: "Berridge & Robinson (1998), Brain Res Rev 28(3), 309–369: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0165-0173(98)00019-8
    - ten: "Peciña & Berridge (2005), J Neurosci 25(50), 11777–11786: tóm tắt (Europe PMC); toàn văn bị chặn"
      link: https://doi.org/10.1523/JNEUROSCI.2329-05.2005
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: nhãn "vững chắc"; "hãy nhận diện: đó là wanting đang lái xe... Câu hỏi đơn giản này đưa hệ "muốn" tự động ra ánh sáng của ý thức". Chữ mới: nhãn khá vững; "có thể thử hình dung (ví von)"; bỏ câu "đưa hệ muốn ra ánh sáng của ý thức".'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n3
  cau: Chuột bị phá hủy phần lớn dopamine ở nhân accumbens và thể vân vẫn có phản ứng "thích" vị ngọt gần như không đổi.
  loai: phat-hien
  nguon:
    - ten: "Berridge & Robinson (1998), Brain Res Rev 28(3), 309–369: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0165-0173(98)00019-8
    - ten: "Berridge, Venier & Robinson (1989), Behav Neurosci 103(1), 36–45: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1037/0735-7044.103.1.36
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "bị phá hủy gần như toàn bộ dopamine trong não vẫn tỏ ra thích vị ngọt như bình thường". Chữ mới nói đúng vùng và mức (đến 99% ở accumbens, thể vân). Lý do: tóm tắt Berridge & Robinson 1998.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n4
  cau: Phần trước của hồi hải mã nhóm đi bộ to ra khoảng 2%, nhóm chỉ tập giãn cơ teo khoảng 1,4% — nằm trong mức teo 1–2% mỗi năm ở người lớn tuổi.
  loai: so-lieu
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "vùng não liên quan đến trí nhớ... to ra ~2%... teo ~1,4% — đúng bằng lượng teo não tự nhiên của 1–2 năm tuổi già". Chữ mới: "phần trước hồi hải mã", "nằm trong mức teo 1–2%/năm". Lý do: 1,4% xấp xỉ teo một năm (1–2%/năm), không phải "1–2 năm"; 2% mới tương đương 1–2 năm.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n40
  cau: Theo tổng quan của Schultz (2016), thuốc gây nghiện tạo ra, chiếm đoạt và khuếch đại tín hiệu dopamine.
  loai: phat-hien
  nguon:
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
  ket_qua_luot_1: dung
  ghi_chu: Mới thêm cho khung n39.
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n45
  cau: "Ghép lại, theo các khung này (và còn tranh luận): dopamine liên quan đến việc muốn theo đuổi và có thể đến việc học xem thứ gì đáng theo đuổi; ở chuột, opioid khuếch đại cái thích."
  loai: phat-hien
  nguon:
    - ten: "Berridge & Robinson (1998), Brain Res Rev 28(3), 309–369: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0165-0173(98)00019-8
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
    - ten: "Peciña & Berridge (2005), J Neurosci 25(50), 11777–11786: tóm tắt (Europe PMC); toàn văn bị chặn"
      link: https://doi.org/10.1523/JNEUROSCI.2329-05.2005
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "dopamine giúp bạn học cái gì đáng theo đuổi và muốn theo đuổi nó; opioid cho bạn thích nó khi đã có trong tay... người ta lẫn lộn ba việc này thành một". Chữ mới thận trọng, ghi "còn tranh luận".'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n54
  cau: '"Dopamine là hormone hạnh phúc" là ngộ nhận: dopamine chủ yếu được nghiên cứu như chất dẫn truyền thần kinh; vai trò nổi bật là báo sai số dự đoán và liên quan đến động lực; các thí nghiệm ở chuột cho thấy khoái cảm vị giác không phụ thuộc vào dopamine.'
  loai: phat-hien
  nguon:
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
    - ten: "Berridge & Robinson (1998), Brain Res Rev 28(3), 309–369: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0165-0173(98)00019-8
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "công việc cốt lõi... không phải tạo ra khoái cảm. Khoái cảm thuộc về hệ opioid." Chữ mới giảm xuống mức nguồn.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n19
  cau: Trong nhóm đi bộ, thể tích hồi hải mã tăng nhiều hơn thì trí nhớ cải thiện nhiều hơn (r ≈ 0,23–0,29).
  loai: so-lieu
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "mức cải thiện gắn với mức tăng thể tích". Chữ mới thêm hệ số r.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n50
  cau: Walsh và Tschakovsky (2018) bàn về các nguồn và cơ chế giải phóng BDNF khi tập.
  loai: dinh-nghia
  nguon:
    - ten: "Walsh & Tschakovsky (2018), Appl Physiol Nutr Metab 43(11), 1095–1104: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1139/apnm-2018-0192
  ket_qua_luot_1: dung
  ghi_chu: Mới thêm.
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n17
  cau: Sau khi học xong, neuron bùng phát với tín hiệu báo trước, còn phần thưởng đã được dự đoán thì không làm neuron bùng phát.
  loai: phat-hien
  nguon:
    - ten: "Schultz, Dayan & Montague (1997), Science 275(5306), 1593–1599: toàn văn (PDF bản của P. Dayan tại gatsby.ucl.ac.uk); là bài tổng hợp ghi chép neuron và mô hình"
      link: https://doi.org/10.1126/science.275.5306.1593
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "đáp ứng "chuyển" sang tín hiệu báo trước... neuron gần như im lặng". Chữ mới sát chú thích hình.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n28
  cau: Rèn luyện thể lực có lợi ích vững chắc nhưng chọn lọc; lớn nhất ở các quá trình điều hành-kiểm soát.
  loai: phat-hien
  nguon:
    - ten: "Colcombe & Kramer (2003), Psychol Sci 14(2), 125–130: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1111/1467-9280.t01-1-01430
  ket_qua_luot_1: dung
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n64
  cau: '"Tập càng nặng, não càng khỏe": chưa có bằng chứng; Erickson dùng đi bộ cường độ vừa, Wilckens thấy tác dụng ở can thiệp dưới 150 phút mỗi tuần.'
  loai: phat-hien
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
    - ten: "Wilckens và cộng sự (2021), Hippocampus 31(3), 335–347: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1002/hipo.23292
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Sai... Bằng chứng mạnh nhất đến từ đi bộ vừa phải... tập quá sức còn tăng nguy cơ chấn thương, triệt tiêu lợi ích". Chữ mới: "chưa có bằng chứng", bỏ nguy cơ chấn thương (không có nguồn).'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n74
  cau: Hình erickson-hippocampus có các số +2,12%, +1,97%, −1,40%, −1,43% và dòng "+2% ≈ đảo ngược 1–2 năm teo não do tuổi tác".
  loai: so-lieu
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: dung
  ghi_chu: 'Hình đúng các số (đối chiếu từng số trong src/hinh/erickson-hippocampus.html). Câu "đảo ngược 1–2 năm" là cách tính của tác giả: trong hình không có "theo các tác giả"; ghi cho người giao (không sửa hình).'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n44
  cau: Theo Peciña và Berridge, hệ opioid tại một điểm nóng rất nhỏ trong nhân accumbens của chuột khuếch đại cái "thích" với vị ngọt ("lớp sơn khoái cảm" là ẩn dụ của trang).
  loai: phat-hien
  nguon:
    - ten: "Peciña & Berridge (2005), J Neurosci 25(50), 11777–11786: tóm tắt (Europe PMC); toàn văn bị chặn"
      link: https://doi.org/10.1523/JNEUROSCI.2329-05.2005
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Khoái cảm thật sự — liking — được tạo ra bởi hệ opioid tại những "điểm nóng"... Dopamine không cầm cọ vẽ này." Chữ mới bỏ câu cuối và nói là kết quả ở chuột.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n2
  cau: Tình huống ông A đi bộ 40 phút mỗi sáng, ông B ít vận động, bác sĩ nhận xét trí nhớ, là ví dụ giả định.
  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: gia-dinh. Ví dụ giả định, không khẳng định điều gì về bằng chứng; kiểm trên trang.
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n34
  cau: "Firth và cộng sự (2018): 14 thử nghiệm (737 người) không thấy tác dụng có ý nghĩa của tập aerobic lên tổng thể tích hồi hải mã; thấy tác dụng ở hồi hải mã trái, do tập luyện ngăn mất thể tích."
  loai: so-lieu
  nguon:
    - ten: "Firth và cộng sự (2018), NeuroImage 166, 230–238: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.neuroimage.2017.11.007
  ket_qua_luot_1: dung
  ghi_chu: Mới thêm vào trang.
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n10
  cau: Ngộ nhận "dopamine = chất gây sướng" thường được gắn với dòng nghiên cứu bắt đầu từ thí nghiệm năm 1954 của Olds và Milner.
  loai: lich-su
  nguon:
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
    - ten: "Olds & Milner (1954), J Comp Physiol Psychol 47(6), 419–427: không mở được (APA bị chặn); chỉ có nhan đề qua danh mục của Schultz 2016"
      link: https://doi.org/10.1037/h0058775
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "bắt nguồn từ một thí nghiệm nổi tiếng năm 1954, rồi được thổi phồng trong nhiều thập kỷ". Chữ mới: "thường được gắn với dòng nghiên cứu bắt đầu từ". Lý do: "bắt nguồn" và "thổi phồng" không có nguồn.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n68
  cau: "Quiz 1: thử nghiệm Erickson sau một năm: nhóm đi bộ tăng ~2% thể tích hồi hải mã, nhóm giãn cơ teo ~1,4%; trong nhóm đi bộ, thể tích tăng nhiều hơn thì trí nhớ không gian cải thiện nhiều hơn."
  loai: phat-hien
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: đáp án đúng "...nhóm đi bộ cũng cải thiện trí nhớ không gian" và giải thích "chênh lệch ~3,4%... không phải do hiệu ứng được chú ý chung chung". Chữ mới theo n18, n19; giải thích bỏ "3,4%" và "quy cho chính hoạt động aerobic". Lời giải thích không dựa vào vị trí lựa chọn.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n20
  cau: Nhóm đi bộ không có thay đổi BDNF huyết thanh lớn hơn nhóm giãn cơ (khác biệt không có ý nghĩa).
  loai: so-lieu
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "mức tăng thể tích đi kèm với lượng BDNF trong máu cao hơn". Chữ mới nêu cả không có khác biệt giữa nhóm. Lý do: câu cũ dễ hiểu nhầm là nhóm đi bộ có BDNF cao hơn.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n51
  cau: Vì vậy ta chưa thể nói chắc BDNF máu phản ánh BDNF trong hồi hải mã, hay là cơ chế của lợi ích.
  loai: phat-hien
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
    - ten: "Rasmussen và cộng sự (2009), Exp Physiol 94(10), 1062–1069: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1113/expphysiol.2009.048512
    - ten: "Walsh & Tschakovsky (2018), Appl Physiol Nutr Metab 43(11), 1095–1104: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1139/apnm-2018-0192
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "BDNF máu tăng sau khi tập chưa chứng minh được BDNF trong não cũng tăng... BDNF là phân tử lớn, khó vượt qua hàng rào máu–não". Chữ mới bỏ "phân tử lớn, khó vượt hàng rào" (không có nguồn mở được). Chỗ chưa chắc.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n33
  cau: Tổng quan của chính Schultz (2016) kết luận rằng hầu hết neuron dopamine ở não giữa của người, khỉ và động vật gặm nhấm đều báo hiệu sai số dự đoán phần thưởng.
  loai: phat-hien
  nguon:
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: dấu trích dẫn Việt hóa "hầu hết neuron...". Chữ mới bỏ dấu trích (là bản dịch).'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n61
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu công bố nào kiểm chứng riêng về mối liên hệ tập luyện–não bộ (thể tích hồi hải mã, nhận thức) trên người Việt.
  loai: thoi-su
  nguon:
    - ten: 'Tìm trên Europe PMC (10/11/2026): (Vietnam* OR Vietnamese) AND ("aerobic exercise" OR exercise OR "physical activity") AND (cognition OR hippocampal OR "brain volume" OR BDNF) AND (older OR elderly) (215 và 531 kết quả, năm kết quả đầu mỗi truy vấn là tổng quan hay nghiên cứu nhiều nước, không có nghiên cứu riêng trên người Việt về tập luyện và hồi hải mã/nhận thức); OpenAlex bị giới hạn lượt'
      link: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=(Vietnam*%20OR%20Vietnamese)%20AND%20%22aerobic%20exercise%22&format=json
  ket_qua_luot_1: da-sua
  ghi_chu: "Europe PMC ngày 10/11/2026 (OpenAlex bị giới hạn lượt): 215 và 531 kết quả, xem năm kết quả đầu của mỗi truy vấn, chủ yếu tổng quan; không thấy nghiên cứu riêng. Chữ cũ: không mốc. Chưa tìm Google Scholar hay tạp chí trong nước. Chỗ chưa chắc: không đọc hết kết quả."
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n27
  cau: "Berridge và Robinson (1998) là bài tổng quan kèm nghiên cứu mới: chuột mất đến 99% dopamine ở nhân accumbens và thể vân, rồi đo phản ứng miệng-mặt với vị ngọt, vị đắng, học lại giá trị vị và thuốc tăng khoái cảm."
  loai: phat-hien
  nguon:
    - ten: "Berridge & Robinson (1998), Brain Res Rev 28(3), 309–369: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0165-0173(98)00019-8
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Một bài tổng quan lớn, gom bằng chứng từ thần kinh học, điện sinh lý và hành vi". Chữ mới thêm nghiên cứu mới. Lý do: tóm tắt nói rõ có "a new study".'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n60
  cau: "Quiz 2: phần thưởng được dự đoán nhưng không đến thì hoạt động neuron dopamine giảm xuống dưới mức nền (sai số dự đoán âm)."
  loai: phat-hien
  nguon:
    - ten: "Schultz, Dayan & Montague (1997), Science 275(5306), 1593–1599: toàn văn (PDF bản của P. Dayan tại gatsby.ucl.ac.uk); là bài tổng hợp ghi chép neuron và mô hình"
      link: https://doi.org/10.1126/science.275.5306.1593
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
  ket_qua_luot_1: dung
  ghi_chu: 'Quiz: đáp án đúng "giảm xuống dưới mức nền (sai số dự đoán âm)": nguồn dùng "depressed activity"; chấp nhận "dưới mức nền" ở mức quiz, giữ nguyên chữ vì khớp nghĩa "ức chế" ở n18.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n22
  cau: "Có một đáp ứng mới: hoạt động tăng dần cho đến thời điểm phần thưởng có thể đến, tăng theo mức không chắc chắn, lớn nhất ở xác suất 50%."
  loai: phat-hien
  nguon:
    - ten: "Fiorillo, Tobler & Schultz (2003), Science 299, 1898–1902: tóm tắt (Europe PMC); toàn văn không mở được"
      link: https://doi.org/10.1126/science.1077349
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "tăng dần, duy trì ... mạnh nhất khi xác suất là 50%". Chữ mới: "tăng theo mức không chắc chắn, lớn nhất ở 50%". Lý do: "duy trì" và "mạnh nhất" không phải lời của tóm tắt; cực đại là của độ không chắc chắn.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n21
  cau: Trong nhóm đi bộ, BDNF tăng nhiều hơn đi kèm thể tích hồi hải mã tăng nhiều hơn (r ≈ 0,36–0,37).
  loai: so-lieu
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-sua
  ghi_chu: Như n20.
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n12
  cau: Nhóm aerobic đi bộ ba buổi mỗi tuần, tăng dần từ 10 phút lên 40 phút ở tuần 7, ở cường độ vừa (mục tiêu 50–60% rồi 60–75% nhịp tim dự trữ).
  loai: so-lieu
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "đi bộ nhanh 40 phút/ngày, 3 ngày/tuần". Chữ mới: tăng dần, mức nhịp tim. Lý do: "nhanh" và "ngày" (40 phút mỗi buổi, 3 buổi) không đúng nguồn.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n37
  cau: "Ciria và cộng sự (2023): tổng quan ô dù về 24 phân tích tổng hợp thử nghiệm ngẫu nhiên; phần lớn báo cáo tác dụng dương, nhưng công suất thấp, chọn lọc nghiên cứu, thiên lệch xuất bản."
  loai: so-lieu
  nguon:
    - ten: "Ciria và cộng sự (2023), Nat Hum Behav 7, 928–941: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1038/s41562-023-01554-4
  ket_qua_luot_1: dung
  ghi_chu: Mới thêm vào trang.
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n52
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra sai số dự đoán phần thưởng hay phân biệt wanting/liking trên người Việt.
  loai: thoi-su
  nguon:
    - ten: 'Tìm trên Europe PMC (10/11/2026): (Vietnam* OR Vietnamese) AND dopamine AND ("reward prediction" OR "wanting" OR "incentive salience") (107 kết quả, năm kết quả đầu là tổng quan hay nghiên cứu không phải kiểm tra riêng trên người Việt); OpenAlex bị giới hạn lượt'
      link: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=(Vietnam*%20OR%20Vietnamese)%20AND%20dopamine&format=json
  ket_qua_luot_1: da-sua
  ghi_chu: 'Europe PMC ngày 10/11/2026 (OpenAlex bị giới hạn lượt): 107 kết quả (dopamine AND Vietnam*...), chỉ xem năm kết quả đầu, không thấy kiểm tra riêng. Chữ cũ: không mốc, thêm "và cũng khó có, vì đây là cấp độ neuron đơn lẻ" (đã bỏ: ở người có ghi hình não và có thể có nghiên cứu hành vi). Chưa tìm Google Scholar hay tạp chí trong nước. Chỗ chưa chắc: không đọc hết các kết quả.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n65
  cau: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn.
  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: "Đã kiểm trên trang: có ::tom-tat."
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n35
  cau: 'Khá vững: phân biệt "muốn" (dopamine) và "thích" (opioid).'
  loai: nhan
  nguon:
    - ten: "Berridge, Venier & Robinson (1989), Behav Neurosci 103(1), 36–45: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1037/0735-7044.103.1.36
    - ten: "Berridge & Robinson (1998), Brain Res Rev 28(3), 309–369: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0165-0173(98)00019-8
    - ten: "Peciña & Berridge (2005), J Neurosci 25(50), 11777–11786: tóm tắt (Europe PMC); toàn văn bị chặn"
      link: https://doi.org/10.1523/JNEUROSCI.2329-05.2005
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: nhãn "vững chắc", "chứng minh nhất quán", "gấp nhiều lần", "khung chuẩn trong nghiên cứu nghiện hiện nay". Chữ mới: "khá vững", nói rõ giới hạn; bỏ "khung chuẩn trong nghiên cứu nghiện" (không kiểm được). Lý do: thước đo mục 4 cho vững chắc cần tổng hợp hoặc hai tái lập lớn.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n15
  cau: Nhóm đi bộ tăng thể tích hồi hải mã khoảng 2% (trái +2,12%, phải +1,97%), chủ yếu ở phần trước.
  loai: so-lieu
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: không có "chủ yếu ở phần trước". Chữ mới thêm theo Fig. 2/tóm tắt ("anterior hippocampus"). Hình erickson-hippocampus có đúng các số này (kiểm, không sửa hình).'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n20
  cau: Fiorillo và cộng sự (2003) ghi neuron dopamine với các tín hiệu báo trước những xác suất phần thưởng khác nhau.
  loai: phat-hien
  nguon:
    - ten: "Fiorillo, Tobler & Schultz (2003), Science 299, 1898–1902: tóm tắt (Europe PMC); toàn văn không mở được"
      link: https://doi.org/10.1126/science.1077349
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Vẫn ghi neuron dopamine trên khỉ". Chữ mới bỏ "trên khỉ" vì tóm tắt không nêu loài (chỗ khó).'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n8
  cau: Dopamine chủ yếu được nghiên cứu như một chất dẫn truyền thần kinh trong não, dù truyền thông gọi là "hormone hạnh phúc".
  loai: dinh-nghia
  nguon:
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
    - ten: "Berridge & Robinson (1998), Brain Res Rev 28(3), 309–369: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0165-0173(98)00019-8
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Dopamine là một chất dẫn truyền thần kinh — không phải hormone theo đúng nghĩa sinh học". Chữ mới: "chủ yếu được nghiên cứu như". Lý do: tránh khẳng định tuyệt đối về hormone; chưa mở APA Dictionary.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n38
  cau: "Phân tích tổng hợp của Ciria: d = 0,22 (khoảng tin cậy 95%: 0,16–0,28); d = 0,13 khi tính đến nhóm đối chứng chủ động và khác biệt ban đầu; d = 0,05 (−0,09 đến 0,14) sau hiệu chỉnh thiên lệch xuất bản; các tác giả khuyên thận trọng."
  loai: so-lieu
  nguon:
    - ten: "Ciria và cộng sự (2023), Nat Hum Behav 7, 928–941: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1038/s41562-023-01554-4
  ket_qua_luot_1: dung
  ghi_chu: Mới thêm vào trang.
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n66
  cau: '"Tập thể dục chữa được Alzheimer": chúng tôi không thấy bằng chứng; các nghiên cứu ở đây là trên người lớn tuổi không có sa sút trí tuệ; nên gặp bác sĩ nếu lo về trí nhớ.'
  loai: loi-khuyen
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Sai và nguy hiểm nếu khiến gia đình trì hoãn điều trị y tế. Bằng chứng hiện tại chỉ ủng hộ phòng ngừa và làm chậm... chưa có thử nghiệm nào cho thấy... đảo ngược". Chữ mới: không thấy bằng chứng; bỏ "phòng ngừa và làm chậm" (không có nguồn); lời dẫn tới Hỗ trợ.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n13
  cau: Điều này được diễn giải là đã tìm thấy một cơ sở thần kinh của phần thưởng; về sau các nghiên cứu khác (như Corbett và Wise, 1980) gắn tự kích thích não với các đường dẫn dopamine.
  loai: lich-su
  nguon:
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "diễn giải là não có một "trung tâm phần thưởng"... công chúng ghép nối: dopamine = chất gây sướng". Chữ mới theo Schultz 2016 và dẫn Corbett & Wise qua nhan đề. Lý do: "công chúng ghép nối" không kiểm được.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n30
  cau: Chỉ ở một điểm nóng khoảng 1 mm³ ở vùng trước-lưng của vỏ giữa, DAMGO làm tăng phản ứng "thích" với vị ngọt; ở mọi vùng của vỏ giữa, DAMGO đều làm chuột ăn nhiều hơn.
  loai: so-lieu
  nguon:
    - ten: "Peciña & Berridge (2005), J Neurosci 25(50), 11777–11786: tóm tắt (Europe PMC); toàn văn bị chặn"
      link: https://doi.org/10.1523/JNEUROSCI.2329-05.2005
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "phản ứng "thích" tăng gấp khoảng bốn lần bình thường. Ở các điểm xung quanh... không tăng "thích"". Chữ mới bỏ "gấp bốn lần" (tóm tắt không nêu; toàn văn không mở được) và nói đủ phạm vi.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n23
  cau: Các tác giả gợi ý tín hiệu này có thể liên quan đến học dựa trên chú ý và hành vi chấp nhận rủi ro.
  loai: phat-hien
  nguon:
    - ten: "Fiorillo, Tobler & Schultz (2003), Science 299, 1898–1902: tóm tắt (Europe PMC); toàn văn không mở được"
      link: https://doi.org/10.1126/science.1077349
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Dopamine... bị thu hút bởi chính sự không chắc chắn". Chữ mới theo gợi ý của tác giả.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n31
  cau: Theo các tác giả, mạch opioid kích thích ăn phân bố rộng, còn mạch "thích" khu trú hơn nhiều; nghiên cứu này không đo dopamine.
  loai: phat-hien
  nguon:
    - ten: "Peciña & Berridge (2005), J Neurosci 25(50), 11777–11786: tóm tắt (Europe PMC); toàn văn bị chặn"
      link: https://doi.org/10.1523/JNEUROSCI.2329-05.2005
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Khoái cảm thật sự được tạo ra bởi hệ opioid — dopamine đứng ngoài câu chuyện này." Chữ mới theo tóm tắt. Lý do: nghiên cứu không đo dopamine nên không nói được "đứng ngoài".'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n63
  cau: 'Quiz 5: Peciña và Berridge (2005): phản ứng "thích" tăng ở một điểm nóng khoảng 1 mm³, trong khi ở mọi vùng của vỏ giữa chuột ăn nhiều hơn; nghiên cứu không đo dopamine.'
  loai: phat-hien
  nguon:
    - ten: "Peciña & Berridge (2005), J Neurosci 25(50), 11777–11786: tóm tắt (Europe PMC); toàn văn bị chặn"
      link: https://doi.org/10.1523/JNEUROSCI.2329-05.2005
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "tăng gấp khoảng bốn lần... Khoái cảm là việc của opioid, không phải dopamine". Chữ mới như n30, n31. Câu hỏi đổi hẳn để hết "gấp bốn lần". Lời giải thích không dựa vào vị trí lựa chọn.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n70
  cau: "Quiz 3: BDNF trong máu tăng chưa đủ kết luận BDNF là cơ chế (máu có nhiều nguồn; Erickson không thấy khác biệt giữa hai nhóm; BDNF không liên quan trí nhớ)."
  loai: phat-hien
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
    - ten: "Rasmussen và cộng sự (2009), Exp Physiol 94(10), 1062–1069: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1113/expphysiol.2009.048512
  ket_qua_luot_1: da-sua
  ghi_chu: Chữ cũ như ngộ nhận BDNF (99% từ tiểu cầu...). Chữ mới như n65. Lời giải thích không dựa vào vị trí lựa chọn.
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n36
  cau: "Balbim và cộng sự (2024): 8 nghiên cứu (554 người lớn tuổi khỏe mạnh, không suy giảm nhận thức) thấy tác dụng lên thể tích hồi hải mã không có ý nghĩa (SMD = 0,10; khoảng tin cậy 95%: −0,01 đến 0,21)."
  loai: so-lieu
  nguon:
    - ten: "Balbim và cộng sự (2024), GeroScience: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1007/s11357-023-00971-7
  ket_qua_luot_1: dung
  ghi_chu: Mới thêm vào trang. Tóm tắt không nêu ngưỡng tuổi, chỉ "cognitively unimpaired, healthy older individuals"; trang ghi đúng như vậy.
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n53
  cau: Cụm từ "hormone hạnh phúc" xuất hiện trong các nội dung sức khỏe tiếng Việt, nơi dopamine được liệt kê cùng serotonin, endorphin, oxytocin (ví dụ bài Vinmec viết dopamine "giúp cảm thấy dễ chịu"), một cách mô tả không phân biệt "muốn" với "thích".
  loai: thoi-su
  nguon:
    - ten: Vinmec, "Hormones hạnh phúc là gì và làm thế nào để tăng cường?" (mở 10/11/2026)
      link: https://vinmec.com/vi/tin-tuc/thong-tin-suc-khoe/song-khoe/hormones-hanh-phuc-la-gi-va-lam-nao-de-tang-cuong/
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "rất phổ biến... như một "bộ tứ" — mà không phân biệt chất dẫn truyền thần kinh với hormone... Trào lưu "detox dopamine" cũng đã lan sang các cộng đồng năng suất tiếng Việt". Chữ mới: một ví dụ có link, mốc 11/2026; bỏ câu về trào lưu detox (không tìm được nguồn tiếng Việt; tìm 10/11/2026 chủ yếu ra trang tiếng Anh) và bỏ "không phân biệt chất dẫn truyền với hormone" (Long Châu có phân biệt).'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n16
  cau: Nhóm giãn cơ tiếp tục teo (−1,40% và −1,43%), phù hợp với mức teo 1–2% mỗi năm.
  loai: so-lieu
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "đúng như quy luật tự nhiên". Chữ mới: "phù hợp với mức teo 1–2% mỗi năm đã biết" (Erickson: "We find results consistent with this pattern").'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n60
  cau: Thử nghiệm Erickson loại trừ người có bệnh tim mạch hay đái tháo đường, yêu cầu bác sĩ riêng đồng ý và kiểm tra thể lực trước khi vào nghiên cứu.
  loai: phat-hien
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "loại trừ người có bệnh lý nặng". Chữ mới nêu cụ thể theo nguồn.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n6
  cau: Hồi hải mã (hippocampus) là một cấu trúc nhỏ hình con ngựa biển nằm sâu trong não, đóng vai trò trung tâm trong việc hình thành trí nhớ mới.
  loai: dinh-nghia
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
    - ten: "Pereira và cộng sự (2007), PNAS 104, 5638–5643: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1073/pnas.0611721104
  ket_qua_luot_1: da-lam-mem
  ghi_chu: Chữ cũ như trên; giữ ý, nguồn chỉ xác nhận vai trò với trí nhớ; "hình con ngựa biển" là mô tả giải phẫu thông thường (tên "hippocampus"); chưa mở giáo trình giải phẫu.
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n53
  cau: 'Giả thuyết: một phần "não khỏe hơn nhờ tập" đi qua giấc ngủ, tâm trạng, huyết áp; chúng tôi chưa dẫn nghiên cứu kiểm chứng điều đó.'
  loai: loi-khuyen
  nguon:
    - ten: "Kredlow và cộng sự (2015), J Behav Med 38, 427–449: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1007/s10865-015-9617-6
    - ten: "Rebar và cộng sự (2015), Health Psychol Rev 9(3), 366–378: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1080/17437199.2015.1022901
    - ten: "Cornelissen & Smart (2013), J Am Heart Assoc 2(1), e004473: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1161/jaha.112.004473
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "mỗi thứ này đều đã được chứng minh là ảnh hưởng đến nhận thức. Rất có thể một phần... đi qua các con đường này". Chữ mới: giả thuyết, chưa có nghiên cứu kiểm chứng; bỏ "đã được chứng minh ảnh hưởng nhận thức" (không có nguồn).'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n9
  cau: Các neuron sản xuất dopamine tập trung ở vùng não giữa (VTA và chất đen), gửi tín hiệu đến nhân accumbens và thể vân.
  loai: dinh-nghia
  nguon:
    - ten: "Berridge & Robinson (1998), Brain Res Rev 28(3), 309–369: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0165-0173(98)00019-8
    - ten: "Kalia & Lang (2015), Lancet 386, 896–912: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0140-6736(14)61393-3
  ket_qua_luot_1: da-lam-mem
  ghi_chu: Chữ cũ có "vùng xử lý động lực". Chữ mới bỏ cụm này; "VTA" suy từ "mesolimbic", chưa thấy tên VTA trong tóm tắt (chỗ khó).
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n32
  cau: Hiệu quả có ý nghĩa ở nhóm tuổi trung bình 55–68 (nhóm 69–85 thì không) và ở các chương trình có tổng "liều" trên 3.900 phút.
  loai: so-lieu
  nguon:
    - ten: "Aghjayan và cộng sự (2022), Commun Med 2, 15: toàn văn (PMC9053291, truy cập mở)"
      link: https://doi.org/10.1038/s43856-022-00079-7
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Hiệu quả rõ nhất ở nhóm 55–68 tuổi (nhóm 69–85 không còn rõ), và với các chương trình kéo dài". Chữ mới theo "significant effect ... but not". Lý do: nguồn không nói "rõ nhất".'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n23
  cau: "Smith và cộng sự (2010): phân tích tổng hợp 29 thử nghiệm ngẫu nhiên có đối chứng, 2.049 người trưởng thành, đối chứng không tập aerobic."
  loai: so-lieu
  nguon:
    - ten: "Smith và cộng sự (2010), Psychosom Med 72(3), 239–252: toàn văn (bản tác giả, PMC2897704)"
      link: https://doi.org/10.1097/PSY.0b013e3181d14633
  ket_qua_luot_1: da-sua
  ghi_chu: Chữ cũ không có "đối chứng không tập aerobic". Chữ mới thêm theo tiêu chí chọn của tóm tắt.
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n27
  cau: "Colcombe và Kramer (2003): phân tích tổng hợp 18 nghiên cứu can thiệp (1966–2001) về thể lực và nhận thức ở người lớn tuổi khỏe mạnh nhưng ít vận động."
  loai: so-lieu
  nguon:
    - ten: "Colcombe & Kramer (2003), Psychol Sci 14(2), 125–130: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1111/1467-9280.t01-1-01430
  ket_qua_luot_1: dung
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n7
  cau: Chúng tôi không tìm thấy cơ chế hay nghiên cứu nào ủng hộ "detox dopamine" theo nghĩa đen (xả dopamine ra khỏi não).
  loai: phat-hien
  nguon:
    - ten: 'Bowles, N. (2019), The New York Times, đăng lại trên Irish Times: "How to feel nothing now in order to feel more later" (mở đọc; trích lời Sepah)'
      link: https://www.irishtimes.com/life-and-style/health-family/how-to-feel-nothing-now-in-order-to-feel-more-later-1.4095491
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "không có cơ sở khoa học nào cả". Chữ mới nói về việc không tìm thấy. Lý do: không thể chứng minh phủ định; chỉ tìm thấy lời của người phổ biến (n47) và kết quả tìm kiếm (News-Medical, Digital Zen, chỉ blog, không dùng làm nguồn).'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n12
  cau: Chuột nhấn cần nhiều hơn để nhận thêm kích thích ở một số vùng, đến mức quên ăn uống một lúc.
  loai: phat-hien
  nguon:
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "tự kích thích "thường xuyên và đều đặn trong thời gian dài" — sẵn sàng học hành vi mới chỉ để được kích thích". Chữ mới theo Schultz 2016. Lý do: câu trích cũ không thấy ở nguồn mở được.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n56
  cau: "Đang tranh cãi (Áp dụng 1): liều trong thử nghiệm Erickson, đi bộ 40 phút, 3 buổi/tuần."
  loai: nhan
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
    - ten: "Firth và cộng sự (2018), NeuroImage 166, 230–238: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.neuroimage.2017.11.007
    - ten: "Balbim và cộng sự (2024), GeroScience: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1007/s11357-023-00971-7
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: tiêu đề "Liều đã được kiểm chứng" nhãn khá vững; "đi bộ nhanh... hơi thở gấp, nói chuyện được nhưng không hát được"; "bắt đầu từ 15–20 phút". Chữ mới: phác đồ đúng như nghiên cứu (10 phút, +5/tuần, nhịp tim dự trữ). Lý do: các chi tiết cũ không có trong nguồn. Id mục cũ giữ bằng { #…-kha-vung }.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n26
  cau: Các tác giả kết luận cải thiện ở mức khiêm tốn và cần thêm các thử nghiệm ngẫu nhiên chặt chẽ hơn.
  loai: phat-hien
  nguon:
    - ten: "Smith và cộng sự (2010), Psychosom Med 72(3), 239–252: toàn văn (bản tác giả, PMC2897704)"
      link: https://doi.org/10.1097/PSY.0b013e3181d14633
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Kết luận của các tác giả rất thẳng thắn: có cải thiện, nhưng đừng thổi phồng". Chữ mới theo kết luận trong tóm tắt (không có "đừng thổi phồng").'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n61
  cau: "Quiz 3: thí nghiệm 6-OHDA (1989): chuột bị tổn thương dopamine không còn tự ăn nhưng phản ứng miệng-mặt với vị ngọt gần như không đổi; các tác giả dùng làm lập luận tách wanting khỏi liking."
  loai: phat-hien
  nguon:
    - ten: "Berridge, Venier & Robinson (1989), Behav Neurosci 103(1), 36–45: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1037/0735-7044.103.1.36
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "chứng minh... hoàn toàn bình thường... Đây là bằng chứng tách rời". Chữ mới theo n25, n26. Lời giải thích không dựa vào vị trí lựa chọn.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n71
  cau: "Quiz 4: cơ chế mạch máu có manh mối ở người rõ hơn; BDNF ở người và neurogenesis còn tranh luận, dù thấy ở chuột."
  loai: phat-hien
  nguon:
    - ten: "Pereira và cộng sự (2007), PNAS 104, 5638–5643: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1073/pnas.0611721104
    - ten: "Sorrells và cộng sự (2018), Nature 555, 377–381: tóm tắt (Europe PMC); toàn văn PMC6179355"
      link: https://doi.org/10.1038/nature25975
    - ten: "Boldrini và cộng sự (2018), Cell Stem Cell 22, 589–599: tóm tắt (Europe PMC); toàn văn PMC5957089 (bản tác giả)"
      link: https://doi.org/10.1016/j.stem.2018.03.015
    - ten: "Rasmussen và cộng sự (2009), Exp Physiol 94(10), 1062–1069: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1113/expphysiol.2009.048512
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "cơ chế mạch máu và các đường gián tiếp... có bằng chứng ở người vững hơn; BDNF... tranh cãi nhiều nhất". Chữ mới: "manh mối rõ hơn", bỏ "đường gián tiếp". Lời giải thích không dựa vào vị trí lựa chọn.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n34
  cau: Hàng trăm nghiên cứu ghi hình não ở người cho thấy tín hiệu sai số dự đoán ở các cấu trúc thưởng, trong đó thể vân là vùng chính theo một phân tích tổng hợp (Garrison và cộng sự, 2013).
  loai: so-lieu
  nguon:
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
    - ten: "Garrison, Erdeniz & Done (2013), Neurosci Biobehav Rev 37(7), 1297–1310: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.neubiorev.2013.03.023
  ket_qua_luot_1: dung
  ghi_chu: Mới thêm cho khung n32.
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n37
  cau: Bệnh Parkinson liên quan đến mất neuron dopamine ở chất đen.
  loai: dinh-nghia
  nguon:
    - ten: "Kalia & Lang (2015), Lancet 386, 896–912: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0140-6736(14)61393-3
  ket_qua_luot_1: dung
  ghi_chu: "Dopamine là chất mà não cần cho vận động: suy ra từ Parkinson (đặc trưng vận động), ghi rõ."
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n8
  cau: Nhiều người coi sự teo này là "quy luật tất yếu" của tuổi già.
  loai: lich-su
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "Lâu nay người ta coi đó là "quy luật tất yếu"". Chữ mới: "Nhiều người coi". Chỗ khó: câu về quan niệm chung, nguồn chỉ nói tác giả phản bác "inevitable".'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n1
  cau: "Mô tả: đi bộ 40 phút, ba buổi mỗi tuần có thực sự làm hồi hải mã to ra, bằng chứng từ thử nghiệm Erickson (2011), các phân tích tổng hợp về hồi hải mã và nhận thức (kết quả trái chiều), và các cơ chế như BDNF."
  loai: phat-hien
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
    - ten: "Firth và cộng sự (2018), NeuroImage 166, 230–238: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.neuroimage.2017.11.007
    - ten: "Ciria và cộng sự (2023), Nat Hum Behav 7, 928–941: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1038/s41562-023-01554-4
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Đi bộ 40 phút mỗi ngày... các phân tích tổng hợp về nhận thức". Chữ mới: "40 phút, ba buổi mỗi tuần" (đúng phác đồ) và thêm các tổng hợp về hồi hải mã, kết quả trái chiều.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n38
  cau: Cameron Sepah (2019) nói với The New York Times rằng cái tên "dopamine fasting" "không nên được hiểu theo nghĩa đen" và dopamine "chỉ là một cơ chế giải thích vì sao nghiện có thể được củng cố, và làm nên một cái tên bắt tai".
  loai: lich-su
  nguon:
    - ten: 'Bowles, N. (2019), The New York Times, đăng lại trên Irish Times: "How to feel nothing now in order to feel more later" (mở đọc; trích lời Sepah)'
      link: https://www.irishtimes.com/life-and-style/health-family/how-to-feel-nothing-now-in-order-to-feel-more-later-1.4095491
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "chính người phổ biến thuật ngữ — nhà tâm lý học Cameron Sepah (2019)... thực chất đó chỉ là một kỹ thuật kiểm soát kích thích của CBT". Chữ mới: trích đúng lời; bỏ "nhà tâm lý học" (nguồn gọi là "Dr", giáo sư UCSF Medical School) và phần CBT (chỉ có trên Medium, bị chặn). Cũng đổi trong ngộ nhận, quiz và danh mục nguồn.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n13
  cau: Nhóm đối chứng tập giãn cơ và các bài tăng cường nhẹ.
  loai: phat-hien
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "giãn cơ, giữ thăng bằng nhẹ nhàng". Chữ mới: "tăng cường nhẹ" ("toning"). Lý do: nguồn không nhắc "thăng bằng".'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n41
  cau: 'Khung sai số dự đoán: dopamine là tín hiệu "dạy học" của não (thực tế − dự đoán), cho các vùng khác biết có cần cập nhật kỳ vọng hay không.'
  loai: dinh-nghia
  nguon:
    - ten: "Schultz, Dayan & Montague (1997), Science 275(5306), 1593–1599: toàn văn (PDF bản của P. Dayan tại gatsby.ucl.ac.uk); là bài tổng hợp ghi chép neuron và mô hình"
      link: https://doi.org/10.1126/science.275.5306.1593
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
  ket_qua_luot_1: da-lam-mem
  ghi_chu: Thêm "theo khung này".
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n10
  cau: "Thử nghiệm Erickson: 120 người lớn tuổi (55–80 tuổi), ít vận động, không có sa sút trí tuệ."
  loai: so-lieu
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "ít vận động, chưa sa sút trí tuệ" (không đổi ý) thêm "không có sa sút trí tuệ" theo mini-mental ≥51. 120 là số có đủ dữ liệu MRI (82,7% số ghi danh).'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n72
  cau: "Đọc thêm: link tới gen-va-tinh-cach, vi-sao-ta-quen và doi-pho-stress."
  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: "Đã kiểm: gen-va-tinh-cach và vi-sao-ta-quen có trang; /kham-pha/cang-thang-giac-ngu/doi-pho-stress/ chưa có trang trong src/content/docs (chưa chuyển); link sẽ hỏng đến khi có trang. Ghi cho người giao."
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n39
  cau: 'Đang tranh cãi: dopamine có phải "thủ phạm" gây nghiện mạng xã hội và game gacha không.'
  loai: nhan
  nguon:
    - ten: "Fiorillo, Tobler & Schultz (2003), Science 299, 1898–1902: tóm tắt (Europe PMC); toàn văn không mở được"
      link: https://doi.org/10.1126/science.1077349
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "lịch trình củng cố biến đổi vốn đã được chứng minh là tạo hành vi bền bỉ nhất từ thời Skinner... nghiện là đa yếu tố (thói quen, kiểm soát ức chế...)". Chữ mới bỏ hai ý này (không có nguồn đã mở), thêm lời dẫn tới Hỗ trợ.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n2
  cau: Các câu trích "Buồn thì làm gì đó cho tăng dopamine đi", "Detox dopamine 7 ngày để reset não" là lời khuyên phổ biến (ví dụ minh họa).
  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: gia-dinh. Câu trích minh họa, không khẳng định điều gì về bằng chứng.
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n49
  cau: Một nghiên cứu ở 18 nam sinh viên thấy BDNF huyết thanh, huyết tương và trong tiểu cầu đều tăng ngay sau khi tập gắng sức (Cho và cộng sự, 2012).
  loai: so-lieu
  nguon:
    - ten: "Cho và cộng sự (2012), Neurosci Lett 519(1), 78–83: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.neulet.2012.05.025
  ket_qua_luot_1: dung
  ghi_chu: Mới thêm.
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n45
  cau: "Sorrells và cộng sự (2018): số tế bào tiền thân và tế bào thần kinh non giảm mạnh trong năm đầu đời, chỉ còn vài tế bào ở 7 và 13 tuổi; không phát hiện tế bào non ở người trưởng thành (18–77 tuổi)."
  loai: so-lieu
  nguon:
    - ten: "Sorrells và cộng sự (2018), Nature 555, 377–381: tóm tắt (Europe PMC); toàn văn PMC6179355"
      link: https://doi.org/10.1038/nature25975
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "gần như biến mất sau tuổi 13". Chữ mới theo tóm tắt (vài tế bào lúc 13 tuổi; không phát hiện ở 18–77).'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n24
  cau: Tập aerobic cải thiện chú ý và tốc độ xử lý (g = 0,158), chức năng điều hành (g = 0,123) và trí nhớ (g = 0,128), đều có ý nghĩa thống kê, ở mức khiêm tốn (g ≈ 0,2 là hiệu quả nhỏ theo quy ước).
  loai: so-lieu
  nguon:
    - ten: "Smith và cộng sự (2010), Psychosom Med 72(3), 239–252: toàn văn (bản tác giả, PMC2897704)"
      link: https://doi.org/10.1097/PSY.0b013e3181d14633
  ket_qua_luot_1: dung
  ghi_chu: '"g ≈ 0,2 là nhỏ theo quy ước" là quy ước Cohen (kiến thức chung).'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n63
  cau: Thể trạng, chế độ ăn, khí hậu nóng ẩm và không khí đô thị có thể làm thay đổi cân bằng lợi ích–rủi ro; đi bộ ngoài đường nhiều khói bụi hay nắng gắt có thể khác với nơi không khí sạch hơn (suy đoán, chưa có nghiên cứu được dẫn).
  loai: loi-khuyen
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-bo
  ghi_chu: 'Suy luận đã ghi rõ là suy đoán. Chữ cũ: "ô nhiễm không khí bản thân nó đã được chứng minh là hại não" (không kiểm được; báo cáo Lancet 2020/2024 mở được không có tóm tắt), "văn hóa vận động của người cao tuổi Việt Nam đã vô tình đi trước khoa học một bước", "đi bộ trong công viên sáng sớm có lẽ là phiên bản tối ưu". Đã bỏ cả ba (da-bo một phần). Nguồn nêu Erickson chỉ để nói đây là bối cảnh nghiên cứu, không hỗ trợ suy đoán. Chỗ khó.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n4
  cau: Phần thưởng được báo trước chắc chắn không làm neuron dopamine bùng phát.
  loai: phat-hien
  nguon:
    - ten: "Schultz, Dayan & Montague (1997), Science 275(5306), 1593–1599: toàn văn (PDF bản của P. Dayan tại gatsby.ucl.ac.uk); là bài tổng hợp ghi chép neuron và mô hình"
      link: https://doi.org/10.1126/science.275.5306.1593
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "không khiến neuron dopamine phản ứng gì". Chữ mới: "không làm neuron bùng phát". Lý do: nguồn nói "fails to be activated", không nói không phản ứng gì.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n17
  cau: Theo các tác giả, tăng 2% tương đương đảo ngược 1–2 năm teo do tuổi.
  loai: phat-hien
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "tương đương đảo ngược 1–2 năm teo não". Chữ mới thêm "theo các tác giả" (cách tính của họ). Hình erickson-hippocampus có câu này: không sửa hình, ghi cho người giao.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n46
  cau: "Tranh cãi (Áp dụng 1): một cách nghĩ về thông báo điện thoại và gacha (lịch thưởng biến đổi)."
  loai: nhan
  nguon:
    - ten: "Fiorillo, Tobler & Schultz (2003), Science 299, 1898–1902: tóm tắt (Europe PMC); toàn văn không mở được"
      link: https://doi.org/10.1126/science.1077349
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: nhãn khá vững; "thí nghiệm của Fiorillo cho thấy sự không chắc chắn duy trì hoạt động dopamine cho đến phút quyết định. Hiểu điều này giúp bạn tập trung vào... thiết kế môi trường". Chữ mới: "nghiên cứu ở động vật", "bước suy đoán", lời khuyên đổi môi trường thành "hướng thử, không phải khuyến nghị đã kiểm chứng". Lý do: khẳng định quá sức nguồn.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n57
  cau: Nếu muốn thử, bắt đầu nhẹ và tăng dần như trong nghiên cứu là cách làm của chính nghiên cứu.
  loai: loi-khuyen
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "không cần chạy marathon, không cần phòng gym đắt tiền... nguyên tắc quan trọng nhất là đều đặn". Chữ mới bỏ hai câu không có nguồn. Lời khuyên vận động đời thường có nhãn bằng chứng (tranh-cai).'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n18
  cau: Phần thưởng được dự đoán nhưng không đến thì hoạt động neuron bị ức chế đúng lúc phần thưởng lẽ ra đến.
  loai: phat-hien
  nguon:
    - ten: "Schultz, Dayan & Montague (1997), Science 275(5306), 1593–1599: toàn văn (PDF bản của P. Dayan tại gatsby.ucl.ac.uk); là bài tổng hợp ghi chép neuron và mô hình"
      link: https://doi.org/10.1126/science.275.5306.1593
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "giảm xuống dưới mức nền". Chữ mới: "bị ức chế". Lý do: nguồn dùng "depressed", không nói "dưới mức nền".'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n36
  cau: 'Đã bị bác bỏ: "detox dopamine" theo nghĩa đen.'
  loai: nhan
  nguon:
    - ten: 'Bowles, N. (2019), The New York Times, đăng lại trên Irish Times: "How to feel nothing now in order to feel more later" (mở đọc; trích lời Sepah)'
      link: https://www.irishtimes.com/life-and-style/health-family/how-to-feel-nothing-now-in-order-to-feel-more-later-1.4095491
    - ten: "Kalia & Lang (2015), Lancet 386, 896–912: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0140-6736(14)61393-3
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "dopamine không phải độc tố tích tụ... không thể "đào thải"... (thiếu dopamine trầm trọng là bệnh Parkinson, không phải "tập trung cao độ")... nhà tâm lý học Cameron Sepah... chỉ là kỹ thuật kiểm soát kích thích của CBT". Chữ mới: "chúng tôi không tìm thấy nghiên cứu nào cho thấy xả được dopamine"; Parkinson liên quan mất neuron ở chất đen; trích lời Sepah qua NYT; bỏ "nhà tâm lý học" và "CBT". Lý do: các chi tiết đó không kiểm được (Medium bị chặn).'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n22
  cau: Thay đổi BDNF không liên quan đến cải thiện trí nhớ.
  loai: so-lieu
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: dung
  ghi_chu: Mới thêm, dùng trong Ngộ nhận và quiz.
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n49
  cau: 'Đã bị bác bỏ (Áp dụng 3): "Detox dopamine": giữ cái hữu ích, bỏ cái sai.'
  loai: nhan
  nguon:
    - ten: 'Bowles, N. (2019), The New York Times, đăng lại trên Irish Times: "How to feel nothing now in order to feel more later" (mở đọc; trích lời Sepah)'
      link: https://www.irishtimes.com/life-and-style/health-family/how-to-feel-nothing-now-in-order-to-feel-more-later-1.4095491
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Đó là kỹ thuật kiểm soát kích thích của liệu pháp hành vi-nhận thức: giảm tiếp xúc với tín hiệu gây cám dỗ thì cám dỗ giảm. Đừng trả tiền cho các gói "reset não 7 ngày", đừng tin những bảng xếp hạng... — chúng không đo được gì cả." Chữ mới: "có thể giúp một số người", "chưa dẫn bằng chứng", "không tìm thấy nghiên cứu nào ủng hộ" gói reset và bảng xếp hạng.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n55
  cau: '"Càng nhiều dopamine càng hạnh phúc" là ngộ nhận: phần thưởng được dự đoán đầy đủ không làm neuron dopamine bùng phát; chuột tổn thương hệ dopamine vẫn có phản ứng thích vị ngọt gần như không đổi.'
  loai: phat-hien
  nguon:
    - ten: "Schultz, Dayan & Montague (1997), Science 275(5306), 1593–1599: toàn văn (PDF bản của P. Dayan tại gatsby.ucl.ac.uk); là bài tổng hợp ghi chép neuron và mô hình"
      link: https://doi.org/10.1126/science.275.5306.1593
    - ten: "Berridge, Venier & Robinson (1989), Behav Neurosci 103(1), 36–45: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1037/0735-7044.103.1.36
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "không kích hoạt... chút nào"; "bị phá hủy dopamine vẫn "thích" vị ngọt bình thường". Chữ mới như n4, n25.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n42
  cau: 'Khung incentive salience: dopamine gán sức hút cho các dấu hiệu báo phần thưởng; wanting là muốn, không nhất thiết thích; ví dụ biểu tượng ứng dụng, tiếng "ting" là minh họa của trang.'
  loai: dinh-nghia
  nguon:
    - ten: "Berridge & Robinson (1998), Brain Res Rev 28(3), 309–369: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0165-0173(98)00019-8
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "Dopamine gán... nam châm tâm lý... nhìn thấy biểu tượng ứng dụng... bỗng dưng thấy thôi thúc" như khẳng định. Chữ mới ghi rõ minh họa.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n14
  cau: MRI được chụp trước, sau 6 tháng và sau 1 năm; trí nhớ không gian kiểm tra ở cả ba mốc.
  loai: phat-hien
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "trước, giữa và sau; trí nhớ không gian được kiểm tra song song". Chữ mới: nêu rõ mốc 6 tháng và 1 năm.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n39
  cau: "Đang tranh cãi: vận động aerobic đều đặn giúp người lớn tuổi giữ được thể tích hồi hải mã."
  loai: nhan
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
    - ten: "Firth và cộng sự (2018), NeuroImage 166, 230–238: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.neuroimage.2017.11.007
    - ten: "Wilckens và cộng sự (2021), Hippocampus 31(3), 335–347: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1002/hipo.23292
    - ten: "Balbim và cộng sự (2024), GeroScience: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1007/s11357-023-00971-7
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: nhãn "vững chắc", "bằng chứng can thiệp trên con người". Chữ mới: "đang tranh cãi". Lý do: ba phân tích tổng hợp không đồng ý; thước đo mục 4 đòi cùng chiều. Nhãn mới thêm, phải qua lượt 2.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n69
  cau: "Quiz 2: Smith/Aghjayan cho cải thiện nhỏ; Ciria thấy d = 0,05 sau hiệu chỉnh thiên lệch xuất bản."
  loai: so-lieu
  nguon:
    - ten: "Smith và cộng sự (2010), Psychosom Med 72(3), 239–252: toàn văn (bản tác giả, PMC2897704)"
      link: https://doi.org/10.1097/PSY.0b013e3181d14633
    - ten: "Aghjayan và cộng sự (2022), Commun Med 2, 15: toàn văn (PMC9053291, truy cập mở)"
      link: https://doi.org/10.1038/s43856-022-00079-7
    - ten: "Ciria và cộng sự (2023), Nat Hum Behav 7, 928–941: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1038/s41562-023-01554-4
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Có cải thiện thật nhưng khiêm tốn... đáng để tập vì lợi ích cộng dồn theo năm tháng và còn tốt cho tim mạch, giấc ngủ" (giải thích). Chữ mới thêm Ciria và bỏ "lợi ích cộng dồn theo năm tháng". Lời giải thích không dựa vào vị trí lựa chọn.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n58
  cau: "Đang tranh cãi (Áp dụng 3): vận động cùng giấc ngủ và nếp sinh hoạt."
  loai: nhan
  nguon:
    - ten: "Kredlow và cộng sự (2015), J Behav Med 38, 427–449: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1007/s10865-015-9617-6
    - ten: "Rebar và cộng sự (2015), Health Psychol Rev 9(3), 366–378: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1080/17437199.2015.1022901
    - ten: "Cornelissen & Smart (2013), J Am Heart Assoc 2(1), e004473: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1161/jaha.112.004473
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: tiêu đề "Đừng đặt cược vào một "viên thuốc": kết hợp vận động + ngủ + giao tiếp", nhãn khá vững; "đi bộ cùng bạn... có cơ sở khoa học"; "Không có bằng chứng rằng chỉ cần tập mà thức khuya... não vẫn khỏe". Chữ mới: gợi ý chưa kiểm chứng; bỏ các câu không có nguồn.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n19
  cau: 'Sai số dự đoán = thực tế − dự đoán: neuron không báo "có sướng không" mà báo "có bất ngờ không — và theo hướng nào".'
  loai: dinh-nghia
  nguon:
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
  ket_qua_luot_1: dung
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n55
  cau: 'Khá vững (Áp dụng 2): kiên trì tính bằng tháng, đừng săn "thần dược 2 tuần".'
  loai: nhan
  nguon:
    - ten: "Aghjayan và cộng sự (2022), Commun Med 2, 15: toàn văn (PMC9053291, truy cập mở)"
      link: https://doi.org/10.1038/s43856-022-00079-7
    - ten: "Wilckens và cộng sự (2021), Hippocampus 31(3), 335–347: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1002/hipo.23292
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: nhãn "vững chắc"; "Ai quảng cáo "7 ngày tập là trí nhớ tăng vùn vụt" thì đang bán hàng". Chữ mới: "khá vững"; "chúng tôi không thấy bằng chứng". Lý do: vững chắc cần tổng hợp không mâu thuẫn; lời quy kết về người quảng cáo không kiểm được.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n25
  cau: Tác động lên trí nhớ làm việc kém nhất quán.
  loai: so-lieu
  nguon:
    - ten: "Smith và cộng sự (2010), Psychosom Med 72(3), 239–252: toàn văn (bản tác giả, PMC2897704)"
      link: https://doi.org/10.1097/PSY.0b013e3181d14633
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "thì không nhất quán". Chữ mới: "kém nhất quán" (nguồn: "less consistent").'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n21
  cau: Đáp ứng ngắn của neuron thay đổi đều đặn theo xác suất phần thưởng, phù hợp với mã hóa chênh lệch giữa phần thưởng thực và dự đoán.
  loai: phat-hien
  nguon:
    - ten: "Fiorillo, Tobler & Schultz (2003), Science 299, 1898–1902: tóm tắt (Europe PMC); toàn văn không mở được"
      link: https://doi.org/10.1126/science.1077349
  ket_qua_luot_1: dung
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n29
  cau: Nhóm chức năng điều hành-kiểm soát thường được gắn với vỏ não trước trán.
  loai: dinh-nghia
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
    - ten: "Colcombe & Kramer (2003), Psychol Sci 14(2), 125–130: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1111/1467-9280.t01-1-01430
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "do vỏ não trước trán — vùng não teo nhanh nhất theo tuổi — đảm nhiệm". Chữ mới: "thường được gắn với", bỏ "teo nhanh nhất theo tuổi" (không kiểm được). Chưa mở giáo trình thần kinh học.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n18
  cau: Về trí nhớ không gian, cả hai nhóm đều cải thiện độ chính xác sau một năm.
  loai: phat-hien
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Nhóm đi bộ cũng cải thiện trí nhớ không gian". Chữ mới: cả hai nhóm đều cải thiện (có thể do luyện tập lặp lại). Lý do: nguồn.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n59
  cau: "Quiz 1: neuron dopamine của khỉ phản ứng mạnh nhất với phần thưởng bất ngờ, chưa được dự đoán."
  loai: phat-hien
  nguon:
    - ten: "Schultz, Dayan & Montague (1997), Science 275(5306), 1593–1599: toàn văn (PDF bản của P. Dayan tại gatsby.ucl.ac.uk); là bài tổng hợp ghi chép neuron và mô hình"
      link: https://doi.org/10.1126/science.275.5306.1593
  ket_qua_luot_1: dung
  ghi_chu: Lời giải thích không dựa vào vị trí lựa chọn.
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n9
  cau: Các nghiên cứu trên động vật gặm nhấm cho thấy vận động làm tăng sự tăng sinh và sống sót của tế bào ở hồi hải mã.
  loai: phat-hien
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
    - ten: "Pereira và cộng sự (2007), PNAS 104, 5638–5643: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1073/pnas.0611721104
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Thập niên 2000... nghi ngờ quy luật này. Quan sát trên động vật cho thấy chuột chạy bánh xe mỗi ngày sinh ra nhiều tế bào thần kinh mới ở hồi hải mã hơn chuột nằm yên". Chữ mới theo Erickson. Lý do: "thập niên 2000" và "bánh xe" không có trong nguồn.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n67
  cau: '"Người trẻ tập luyện thì thông minh lên ngay": chúng tôi không dẫn bằng chứng; các thử nghiệm ở trang này là trên người lớn tuổi (Erickson 55–80 tuổi, Aghjayan ~71 tuổi, Smith từ 18 tuổi).'
  loai: phat-hien
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
    - ten: "Aghjayan và cộng sự (2022), Commun Med 2, 15: toàn văn (PMC9053291, truy cập mở)"
      link: https://doi.org/10.1038/s43856-022-00079-7
    - ten: "Smith và cộng sự (2010), Psychosom Med 72(3), 239–252: toàn văn (bản tác giả, PMC2897704)"
      link: https://doi.org/10.1097/PSY.0b013e3181d14633
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Hầu hết bằng chứng mạnh đều trên người lớn tuổi — nhóm mà não đang teo đi nên "còn chỗ để cải thiện"... não đã ở đỉnh phong độ". Chữ mới bỏ lời giải thích không có nguồn. Smith gồm người từ 18 tuổi: "hầu hết" đổi thành liệt kê.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n50
  cau: "Tranh cãi (Áp dụng 4): dùng sự bất ngờ một cách có chủ ý."
  loai: nhan
  nguon:
    - ten: "Fiorillo, Tobler & Schultz (2003), Science 299, 1898–1902: tóm tắt (Europe PMC); toàn văn không mở được"
      link: https://doi.org/10.1126/science.1077349
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "bằng chứng ở người còn rất hạn chế". Chữ mới: "chưa dẫn được bằng chứng ở người". Lý do: không có nguồn đã kiểm cho "rất hạn chế".'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n73
  cau: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn.
  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: "Đã kiểm trên trang: có ::tom-tat."
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n32
  cau: "Vững chắc: neuron dopamine mã hóa sai số dự đoán phần thưởng."
  loai: nhan
  nguon:
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
    - ten: "Garrison, Erdeniz & Done (2013), Neurosci Biobehav Rev 37(7), 1297–1310: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.neubiorev.2013.03.023
    - ten: "Schultz, Dayan & Montague (1997), Science 275(5306), 1593–1599: toàn văn (PDF bản của P. Dayan tại gatsby.ucl.ac.uk); là bài tổng hợp ghi chép neuron và mô hình"
      link: https://doi.org/10.1126/science.275.5306.1593
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "đã được tái lập rộng rãi... Phát hiện của Schultz và cộng sự (1997)". Chữ mới: "Mẫu hình... đã được thấy lại", thêm Garrison 2013 và nói ghi hình não không đo riêng dopamine. Lý do: kể rõ giới hạn.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n6
  cau: Theo các thí nghiệm ở chuột của Berridge và cộng sự, cái "thích" được khuếch đại ở những điểm nóng nhỏ bởi hệ opioid; theo khung của họ, dopamine liên quan đến cái "muốn"; ở chuột hai thứ này có thể tách rời.
  loai: phat-hien
  nguon:
    - ten: "Peciña & Berridge (2005), J Neurosci 25(50), 11777–11786: tóm tắt (Europe PMC); toàn văn bị chặn"
      link: https://doi.org/10.1523/JNEUROSCI.2329-05.2005
    - ten: "Berridge & Robinson (1998), Brain Res Rev 28(3), 309–369: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0165-0173(98)00019-8
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "do một hệ khác đảm nhiệm: hệ opioid. Dopamine điều khiển cái "muốn"... có thể tách rời nhau hoàn toàn". Chữ mới nêu là kết quả ở chuột của nhóm Berridge và bỏ "hoàn toàn".'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n41
  cau: "Đang tranh cãi: cơ chế BDNF ở người, và chuyện não người lớn có sinh tế bào thần kinh mới không."
  loai: nhan
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
    - ten: "Rasmussen và cộng sự (2009), Exp Physiol 94(10), 1062–1069: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1113/expphysiol.2009.048512
    - ten: "Fujimura và cộng sự (2002), Thromb Haemost 87(4), 728–734: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1055/s-0037-1613072
    - ten: "Sorrells và cộng sự (2018), Nature 555, 377–381: tóm tắt (Europe PMC); toàn văn PMC6179355"
      link: https://doi.org/10.1038/nature25975
    - ten: "Boldrini và cộng sự (2018), Cell Stem Cell 22, 589–599: tóm tắt (Europe PMC); toàn văn PMC5957089 (bản tác giả)"
      link: https://doi.org/10.1016/j.stem.2018.03.015
    - ten: "Dumitru và cộng sự (2025), Science: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1126/science.adu9575
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "~99% đến từ tiểu cầu... không có bằng chứng não "tiết" BDNF ra máu khi tập... gần như không còn sau tuổi 13". Chữ mới theo nguồn: Fujimura (tiểu cầu chứa BDNF), Rasmussen 2009 (não 70–80%), Sorrells ("không phát hiện" ở người trưởng thành), Boldrini (14–79 tuổi), Dumitru 2025. Lý do: Rasmussen 2009 trái hẳn câu cũ "không có bằng chứng não tiết BDNF".'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n15
  cau: "Schultz, Dayan và Montague (1997) là bài tổng hợp: ghi hoạt động từng neuron dopamine ở vùng não giữa của khỉ tỉnh táo trong nhiệm vụ học điều kiện (kích thích thị giác báo trước phần thưởng là nước trái cây), cùng mô hình học tăng cường TD."
  loai: phat-hien
  nguon:
    - ten: "Schultz, Dayan & Montague (1997), Science 275(5306), 1593–1599: toàn văn (PDF bản của P. Dayan tại gatsby.ucl.ac.uk); là bài tổng hợp ghi chép neuron và mô hình"
      link: https://doi.org/10.1126/science.275.5306.1593
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Wolfram Schultz và cộng sự ghi hoạt động... một tín hiệu (ánh đèn)". Chữ mới: bài tổng hợp, "kích thích thị giác". Lý do: bài 1997 là tổng hợp ghi chép (và mô hình TD), chú thích Hình 1 chỉ nói "conditioned visual stimulus"; "ánh đèn" không có.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n46
  cau: "Boldrini và cộng sự (2018): hàng nghìn tế bào thần kinh non ở hồi răng của người 14–79 tuổi."
  loai: so-lieu
  nguon:
    - ten: "Boldrini và cộng sự (2018), Cell Stem Cell 22, 589–599: tóm tắt (Europe PMC); toàn văn PMC5957089 (bản tác giả)"
      link: https://doi.org/10.1016/j.stem.2018.03.015
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "khẳng định vẫn còn đến tận tuổi già" và "bằng cùng một kỹ thuật nhuộm mô". Chữ mới theo tóm tắt; bỏ "cùng một kỹ thuật" (cả hai dùng mô sau chết, nhưng không xác nhận "cùng kỹ thuật").'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n48
  cau: Ở động vật gặm nhấm, chạy bộ làm tăng BDNF trong hồi hải mã (Neeper và cộng sự, 1995).
  loai: phat-hien
  nguon:
    - ten: "Neeper và cộng sự (1995), Nature 373, 109: không mở được tóm tắt; chỉ dẫn theo nhan đề"
      link: https://doi.org/10.1038/373109a0
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "một cách rõ ràng, và BDNF thúc đẩy sự sống sót của tế bào thần kinh mới". Chữ mới bỏ nửa sau. Chỗ khó: bài Neeper không mở được; xác nhận qua Erickson kể lại (tham chiếu 7, 8).'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n5
  cau: 'Dopamine không đơn giản là "chất gây sướng": một vai trò được ghi nhận rõ của nó là báo cho não biết điều vừa xảy ra tốt hơn hay tệ hơn dự đoán (sai số dự đoán phần thưởng).'
  loai: phat-hien
  nguon:
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "Dopamine không phải "chất gây sướng". Công việc chính của nó là báo...". Chữ mới: "không đơn giản là", "một vai trò được ghi nhận rõ". Lý do: "công việc chính" mạnh hơn nguồn.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n56
  cau: '"Nghiện điện thoại vì dopamine tăng quá cao" là đơn giản hóa; dopamine có thể là một mắt xích, không phải toàn bộ lời giải thích.'
  loai: loi-khuyen
  nguon:
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Dopamine là một mắt xích trong vòng lặp nghiện (cùng với thói quen, kiểm soát ức chế, thiết kế sản phẩm)". Chữ mới: "có thể là", bỏ danh sách yếu tố không có nguồn. Chỗ khó: nguồn chỉ nói về thuốc gây nghiện.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n5
  cau: Các phân tích tổng hợp về thể tích hồi hải mã cho kết quả trái chiều, hiệu quả lên nhận thức khiêm tốn và bị đặt câu hỏi, và còn tranh luận về cơ chế.
  loai: phat-hien
  nguon:
    - ten: "Firth và cộng sự (2018), NeuroImage 166, 230–238: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.neuroimage.2017.11.007
    - ten: "Wilckens và cộng sự (2021), Hippocampus 31(3), 335–347: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1002/hipo.23292
    - ten: "Balbim và cộng sự (2024), GeroScience: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1007/s11357-023-00971-7
    - ten: "Ciria và cộng sự (2023), Nat Hum Behav 7, 928–941: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1038/s41562-023-01554-4
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Hiệu quả lên trí nhớ thực tế khá khiêm tốn, và các nhà khoa học vẫn đang tranh cãi gay gắt về cơ chế". Chữ mới thêm kết quả trái chiều của tổng hợp (mới thêm vào trang). Lý do: thiếu bằng chứng tổng hợp.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n54
  cau: Vận động có lợi ích nhỏ đến vừa cho giấc ngủ (Kredlow 2015); giảm triệu chứng trầm cảm (SMD −0,50) và lo âu (−0,38) ở người không có chẩn đoán (Rebar 2015); hạ huyết áp tâm thu 3,5 mmHg sau tập sức bền (Cornelissen 2013).
  loai: so-lieu
  nguon:
    - ten: "Kredlow và cộng sự (2015), J Behav Med 38, 427–449: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1007/s10865-015-9617-6
    - ten: "Rebar và cộng sự (2015), Health Psychol Rev 9(3), 366–378: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1080/17437199.2015.1022901
    - ten: "Cornelissen & Smart (2013), J Am Heart Assoc 2(1), e004473: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1161/jaha.112.004473
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "ngủ sâu hơn, bớt lo âu/trầm cảm, huyết áp và đường huyết ổn định hơn". Chữ mới theo nguồn; bỏ "ngủ sâu hơn" và "đường huyết" (không có nguồn). Không viết như lời khuyên điều trị; có lời dẫn Hỗ trợ.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n44
  cau: "Rasmussen và cộng sự (2009): ở tám người chèo thuyền 4 giờ, não đóng góp 70–80% BDNF tuần hoàn lúc nghỉ và lúc tập; giải phóng từ não tăng 2–3 lần khi tập."
  loai: so-lieu
  nguon:
    - ten: "Rasmussen và cộng sự (2009), Exp Physiol 94(10), 1062–1069: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1113/expphysiol.2009.048512
  ket_qua_luot_1: dung
  ghi_chu: Mới thêm; thay câu cũ "chưa có bằng chứng não xuất khẩu BDNF ra máu khi tập".
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n24
  cau: Berridge, Venier và Robinson (1989) tiêm 6-OHDA vào vùng chất đen của chuột; chuột trở nên biếng ăn (aphagia), không tự ăn nữa.
  loai: phat-hien
  nguon:
    - ten: "Berridge, Venier & Robinson (1989), Behav Neurosci 103(1), 36–45: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1037/0735-7044.103.1.36
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "phá hủy hệ dopamine bằng 6-OHDA... biếng ăn hoàn toàn: không tự đi tìm hay ăn". Chữ mới: tổn thương qua tiêm vào chất đen; "không tự ăn". Lý do: "hoàn toàn" và "tìm thức ăn" không có trong tóm tắt.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n29
  cau: Peciña và Berridge (2005) vi tiêm DAMGO (chất kích hoạt thụ thể μ-opioid) vào từng điểm nhỏ trong vỏ giữa của nhân accumbens ở chuột, đo phản ứng "thích" với vị ngọt và lượng ăn.
  loai: phat-hien
  nguon:
    - ten: "Peciña & Berridge (2005), J Neurosci 25(50), 11777–11786: tóm tắt (Europe PMC); toàn văn bị chặn"
      link: https://doi.org/10.1523/JNEUROSCI.2329-05.2005
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "vào từng điểm nhỏ trong nhân accumbens". Chữ mới thêm "vỏ giữa" và lượng ăn. DAMGO là chất kích hoạt thụ thể μ-opioid: kiến thức dược học chung.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n31
  cau: "Tập aerobic cải thiện trí nhớ sự kiện ở mức g = 0,28; ở các nghiên cứu chất lượng cao còn g = 0,18 (khoảng tin cậy 95%: 0,03–0,32)."
  loai: so-lieu
  nguon:
    - ten: "Aghjayan và cộng sự (2022), Commun Med 2, 15: toàn văn (PMC9053291, truy cập mở)"
      link: https://doi.org/10.1038/s43856-022-00079-7
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "còn g = 0,18 — nhỏ nhưng có thật". Chữ mới thêm khoảng tin cậy và bỏ "nhưng có thật".'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n51
  cau: Các thí nghiệm gốc về dopamine ở trang này chủ yếu thực hiện trên khỉ và chuột.
  loai: phat-hien
  nguon:
    - ten: "Schultz, Dayan & Montague (1997), Science 275(5306), 1593–1599: toàn văn (PDF bản của P. Dayan tại gatsby.ucl.ac.uk); là bài tổng hợp ghi chép neuron và mô hình"
      link: https://doi.org/10.1126/science.275.5306.1593
    - ten: "Berridge & Robinson (1998), Brain Res Rev 28(3), 309–369: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0165-0173(98)00019-8
    - ten: "Peciña & Berridge (2005), J Neurosci 25(50), 11777–11786: tóm tắt (Europe PMC); toàn văn bị chặn"
      link: https://doi.org/10.1523/JNEUROSCI.2329-05.2005
    - ten: "Fiorillo, Tobler & Schultz (2003), Science 299, 1898–1902: tóm tắt (Europe PMC); toàn văn không mở được"
      link: https://doi.org/10.1126/science.1077349
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "đều thực hiện trên khỉ và chuột trong phòng thí nghiệm phương Tây". Chữ mới: "chủ yếu"; bỏ "phương Tây" (không kiểm được nơi làm từng thí nghiệm). Ở người có ghi neuron đơn lẻ và hình ảnh não (Schultz 2016).'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n3
  cau: Một thử nghiệm ngẫu nhiên có đối chứng (2011) cho 120 người lớn tuổi ít vận động đi bộ, tăng dần đến 40 phút mỗi buổi, 3 buổi/tuần, trong một năm, chụp MRI trước, giữa và sau.
  loai: phat-hien
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "cho 120 người lớn tuổi đi bộ đúng "liều" như ông A trong một năm, rồi chụp MRI trước và sau". Chữ mới thêm "ít vận động", "tăng dần", "giữa". Lý do: Erickson mục Methods.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n35
  cau: "Wilckens và cộng sự (2021): 23 can thiệp từ 22 nghiên cứu thấy tác dụng dương có ý nghĩa lên tổng thể tích hồi hải mã, rõ ở người từ 65 tuổi, can thiệp trên 24 tuần và dưới 150 phút mỗi tuần."
  loai: so-lieu
  nguon:
    - ten: "Wilckens và cộng sự (2021), Hippocampus 31(3), 335–347: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1002/hipo.23292
  ket_qua_luot_1: dung
  ghi_chu: Mới thêm vào trang.
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n43
  cau: Tiểu cầu chứa BDNF và giải phóng nó khi bị kích hoạt.
  loai: phat-hien
  nguon:
    - ten: "Fujimura và cộng sự (2002), Thromb Haemost 87(4), 728–734: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1055/s-0037-1613072
  ket_qua_luot_1: dung
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n59
  cau: "Khá vững (Áp dụng 4): có bệnh tim mạch, khớp hay huyết áp thì hỏi ý kiến bác sĩ trước."
  loai: nhan
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Các thử nghiệm loại trừ người có bệnh lý nặng... liều 40 phút đi bộ nhanh chưa được kiểm chứng an toàn... đi bộ chậm ngắn vẫn tốt hơn nằm yên". Chữ mới theo tiêu chí loại trừ của Erickson; bỏ "đi bộ chậm ngắn vẫn tốt hơn nằm yên" (không có nguồn). Chỗ khó: chưa dẫn hướng dẫn WHO về vận động.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n1
  cau: Dopamine thường được xếp vào nhóm "hormone hạnh phúc" cùng serotonin, endorphin, oxytocin trong các lời khuyên sức khỏe.
  loai: thoi-su
  nguon:
    - ten: Vinmec, "Hormones hạnh phúc là gì và làm thế nào để tăng cường?" (mở 10/11/2026)
      link: https://vinmec.com/vi/tin-tuc/thong-tin-suc-khoe/song-khoe/hormones-hanh-phuc-la-gi-va-lam-nao-de-tang-cuong/
  ket_qua_luot_1: dung
  ghi_chu: Ví dụ một trang; "thường" chỉ kiểm bằng một ví dụ. Mốc 11/2026.
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n33
  cau: Kiểm tra bất đối xứng (Egger) của Aghjayan gợi ý có thể có thiên lệch xuất bản.
  loai: so-lieu
  nguon:
    - ten: "Aghjayan và cộng sự (2022), Commun Med 2, 15: toàn văn (PMC9053291, truy cập mở)"
      link: https://doi.org/10.1038/s43856-022-00079-7
  ket_qua_luot_1: dung
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n11
  cau: Olds và Milner đặt điện cực vào vùng vách (septal area) và các vùng não khác của chuột; mỗi lần nhấn cần gạt, não nhận một dòng điện nhỏ.
  loai: phat-hien
  nguon:
    - ten: "Olds & Milner (1954), J Comp Physiol Psychol 47(6), 419–427: không mở được (APA bị chặn); chỉ có nhan đề qua danh mục của Schultz 2016"
      link: https://doi.org/10.1037/h0058775
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "rồi đặt chuột vào hộp Skinner có cần gạt". Chữ mới bỏ "hộp Skinner" (không có trong nguồn đã mở). Bài gốc không mở được; theo Schultz 2016 kể lại (đã ghi trên trang). Vùng vách theo nhan đề bài gốc.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n40
  cau: "Đang tranh cãi: tập aerobic cải thiện nhận thức đến mức nào."
  loai: nhan
  nguon:
    - ten: "Smith và cộng sự (2010), Psychosom Med 72(3), 239–252: toàn văn (bản tác giả, PMC2897704)"
      link: https://doi.org/10.1097/PSY.0b013e3181d14633
    - ten: "Aghjayan và cộng sự (2022), Commun Med 2, 15: toàn văn (PMC9053291, truy cập mở)"
      link: https://doi.org/10.1038/s43856-022-00079-7
    - ten: "Ciria và cộng sự (2023), Nat Hum Behav 7, 928–941: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1038/s41562-023-01554-4
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: nhãn "khá vững", "nhỏ nhưng nhất quán". Chữ mới: "đang tranh cãi", nêu Ciria 2023. Lý do: thiên lệch xuất bản làm hiệu quả gần 0.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n43
  cau: "Ba khung trả lời ba câu hỏi khác nhau nhưng không hoàn toàn khớp: Berridge và Robinson (1998) kết luận dopamine không cần cho học liên hệ khoái cảm, còn Schultz mô tả dopamine như tín hiệu dạy học."
  loai: phat-hien
  nguon:
    - ten: "Berridge & Robinson (1998), Brain Res Rev 28(3), 309–369: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0165-0173(98)00019-8
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Ba khung lý thuyết dưới đây không mâu thuẫn nhau". Chữ mới nêu chỗ không khớp. Lý do: Berridge & Robinson 1998 nói thẳng "no" cho vai trò trong hedonic reward learning. Chỗ khó.'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n52
  cau: "Pereira và cộng sự (2007): ở chuột, tập luyện làm tăng thể tích máu ở hồi răng, tương quan với sinh tế bào thần kinh mới; ở người, tập luyện tác động chủ yếu lên thể tích máu ở hồi răng, tương quan với chức năng tim phổi và nhận thức."
  loai: so-lieu
  nguon:
    - ten: "Pereira và cộng sự (2007), PNAS 104, 5638–5643: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1073/pnas.0611721104
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Ở người, các nghiên cứu MRI cũng ghi nhận tăng chất xám ở vùng trán và thái dương sau rèn luyện aerobic... bằng chứng ở người lại vững hơn". Chữ mới theo Pereira và nêu Erickson (tập luyện làm tăng thể tích máu và tưới máu hồi hải mã, trích dẫn tham chiếu 15, 16). Nhãn "khá vững" cũ cho mạch máu đã bỏ: "có manh mối".'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n26
  cau: "Các tác giả lập luận: nếu dopamine tạo ra khoái cảm thì tổn thương dopamine phải làm đổi phản ứng này; điều đó đã không xảy ra."
  loai: phat-hien
  nguon:
    - ten: "Berridge, Venier & Robinson (1989), Behav Neurosci 103(1), 36–45: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1037/0735-7044.103.1.36
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Nếu dopamine tạo ra sung sướng, phá hủy dopamine phải xóa luôn cảm giác thích — nó đã không làm vậy." Chữ mới thêm "các tác giả lập luận".'
- trang: kham-pha/co-so-sinh-hoc/the-duc-nao
  id: n42
  cau: "Đã bị bác bỏ: tập vài tuần là não to ra; tập thể dục chữa được sa sút trí tuệ."
  loai: nhan
  nguon:
    - ten: "Erickson và cộng sự (2011), PNAS 108(7), 3017–3022: toàn văn (PDF bản lưu của pnas.org ở Wayback Machine, đọc 10/11/2026)"
      link: https://doi.org/10.1073/pnas.1015950108
    - ten: "Aghjayan và cộng sự (2022), Commun Med 2, 15: toàn văn (PMC9053291, truy cập mở)"
      link: https://doi.org/10.1038/s43856-022-00079-7
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "không có chuyện thần dược 2 tuần. Và chưa có bằng chứng nào... chỉ nói về duy trì và làm chậm suy giảm ở người chưa bệnh". Chữ mới: "chúng tôi không thấy bằng chứng", lời dẫn tới Hỗ trợ; bỏ "làm chậm" (không có nguồn). Chỗ khó.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n14
  cau: Theo những gì chúng tôi đọc được, thí nghiệm gốc của Olds và Milner không đo dopamine; liên kết với dopamine là diễn giải của các nghiên cứu về sau.
  loai: lich-su
  nguon:
    - ten: "Schultz (2016), Dialogues Clin Neurosci 18(1), 23–32: toàn văn (PMC, truy cập mở)"
      link: https://doi.org/10.31887/DCNS.2016.18.1/wschultz
    - ten: "Olds & Milner (1954), J Comp Physiol Psychol 47(6), 419–427: không mở được (APA bị chặn); chỉ có nhan đề qua danh mục của Schultz 2016"
      link: https://doi.org/10.1037/h0058775
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "Olds và Milner không hề đo dopamine — liên kết này là diễn giải chồng chất". Chữ mới thêm "theo những gì chúng tôi đọc được" vì không mở được bài gốc (chỗ khó).'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n25
  cau: Khi cho vị ngọt vào miệng, phản ứng miệng-mặt (taste reactivity) của chuột gần như không đổi.
  loai: phat-hien
  nguon:
    - ten: "Berridge, Venier & Robinson (1989), Behav Neurosci 103(1), 36–45: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1037/0735-7044.103.1.36
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "biểu cảm mặt thư giãn, thè lưỡi, liếm môi... hoàn toàn bình thường". Chữ mới: "gần như không đổi", bỏ danh sách biểu hiện. Lý do: tóm tắt chỉ nói "essentially unchanged".'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n16
  cau: Phần thưởng bất ngờ làm neuron dopamine bùng phát mạnh.
  loai: phat-hien
  nguon:
    - ten: "Schultz, Dayan & Montague (1997), Science 275(5306), 1593–1599: toàn văn (PDF bản của P. Dayan tại gatsby.ucl.ac.uk); là bài tổng hợp ghi chép neuron và mô hình"
      link: https://doi.org/10.1126/science.275.5306.1593
  ket_qua_luot_1: dung
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n57
  cau: '"Detox dopamine vài ngày sẽ reset não" là ngộ nhận: chúng tôi không tìm thấy cơ chế nào cho việc xả dopamine; chính người phổ biến thuật ngữ nói cái tên không nên hiểu theo nghĩa đen.'
  loai: phat-hien
  nguon:
    - ten: 'Bowles, N. (2019), The New York Times, đăng lại trên Irish Times: "How to feel nothing now in order to feel more later" (mở đọc; trích lời Sepah)'
      link: https://www.irishtimes.com/life-and-style/health-family/how-to-feel-nothing-now-in-order-to-feel-more-later-1.4095491
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "chính người tạo ra thuật ngữ cũng nói nó chỉ là ẩn dụ cho một kỹ thuật hành vi cũ". Chữ mới như n38.'
- trang: kham-pha/co-so-sinh-hoc/dopamine
  id: n62
  cau: 'Quiz 4: "detox dopamine" theo nghĩa đen bị coi là sai vì không có cơ chế hay nghiên cứu nào cho thấy xả được dopamine; Sepah nói cái tên không nên hiểu theo nghĩa đen; Parkinson liên quan đến mất neuron dopamine; cắt giảm hành vi cưỡng chế có thể có ích với một số người nhưng không phải vì "reset dopamine".'
  loai: phat-hien
  nguon:
    - ten: 'Bowles, N. (2019), The New York Times, đăng lại trên Irish Times: "How to feel nothing now in order to feel more later" (mở đọc; trích lời Sepah)'
      link: https://www.irishtimes.com/life-and-style/health-family/how-to-feel-nothing-now-in-order-to-feel-more-later-1.4095491
    - ten: "Kalia & Lang (2015), Lancet 386, 896–912: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0140-6736(14)61393-3
  ket_qua_luot_1: da-sua
  ghi_chu: Chữ cũ có "kỹ thuật kiểm soát kích thích của CBT" và "thiếu nó trầm trọng là bệnh Parkinson, không phải tập trung cao độ". Chữ mới như n36, n49.
