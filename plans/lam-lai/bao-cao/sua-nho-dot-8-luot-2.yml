# Lượt 2, sửa nhỏ đợt 8 (cả lô, 11 nhận định). Model: Claude Opus 5.5. Ngày 17/11/2026.
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n9
  luot_2: dung
  nguon: ["https://dictionary.apa.org/ebbinghaus-illusion", "https://doi.org/10.1037/1093-4510.4.3.228"]
  trich: "APA Dictionary: a size contrast illusion in which a concentric ring of large circles makes a medium-sized central circle look small; the same circle surrounded by smaller circles looks large. Burton (2001), tóm tắt: 'the illusion depicting a circle ringed by smaller circles, which appears larger than an equivalent circle surrounded by larger circles'."
  ghi_chu: "Hai nguồn mô tả đúng như câu. Burton 2001 chỉ đọc được tóm tắt (qua OpenAlex; APA PsycNet đóng)."
- trang: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
  id: n50
  luot_2: dung
  nguon: ["https://doi.org/10.1037/1093-4510.4.3.228", "https://api.openalex.org/works/doi:10.1037/1093-4510.4.3.228", "https://dictionary.apa.org/ebbinghaus-illusion"]
  trich: "Burton (2001), tóm tắt: 'One such false fact is that Titchener introduced the illusion... A review of contemporary sources indicates that Ebbinghaus probably introduced this illusion in the 1890s, although not in any explicit publication, and Titchener neither had nor asserted any authorship of this figure... The modern custom of attributing the surrounded-circles illusion to Titchener, although widespread in the 1960s and 1970s, does not appear before 1957.'"
  ghi_chu: "Chỉ đọc được tóm tắt của Burton (bài đóng, không có bản mở; có bài đính chính Burton 2002, doi 10.1037/1093-4510.5.1.37, cũng đóng, không rõ đính chính điều gì). Tóm tắt nói đủ các ý của câu: 'có lẽ' Ebbinghaus đưa ra từ những năm 1890, Titchener không tạo ra và không nhận. Tên 'Titchener circles' trong tiếng Anh: APA Dictionary xác nhận."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n43
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1037/a0017286", "https://api.openalex.org/works/doi:10.1037/a0037681", "https://stars.library.ucf.edu/facultybib2010/6608"]
  trich: "Joseph & Newman (2010), tóm tắt: 'relationships between ability-based EI and job performance are shown to be inconsistent (i.e., EI positively predicts performance for high emotional labor jobs and negatively predicts performance for low emotional labor jobs)'. Joseph et al. (2015), tóm tắt: 'Recent empirical reviews have claimed a surprisingly strong relationship between job performance and self-reported emotional intelligence (also commonly called trait EI or mixed EI), suggesting self-reported/mixed EI is one of the best known predictors of job performance (e.g., ρ = .47; Joseph & Newman, 2010b).'"
  ghi_chu: "Chỉ đọc được tóm tắt của hai bài (APA đóng; UCF STARS chỉ có bản ghi, không có toàn văn). Câu viết đúng là 'theo Joseph và cộng sự (2015) kể lại', khớp tóm tắt. Không mở được danh mục tham khảo của Joseph 2015 để thấy tận mắt '2010b' là bài cascading model; theo thứ tự chữ cái của APA, năm 2010 Joseph & Newman có bài 'Discriminant validity…' (a) và 'Emotional intelligence: An integrative meta-analysis…' (b), nên 2010b là bài này. Nếu muốn chắc tuyệt đối, cần đọc bảng của Joseph & Newman 2010."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n70
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1037/a0017286", "https://api.openalex.org/works/doi:10.1037/a0037681"]
  trich: "Joseph & Newman 2010: ability EI–performance 'inconsistent'; mixed EI 'expected to explain variance in job performance beyond cognitive ability and personality'. Joseph et al. 2015: 'updated estimate … ρ = .29' và 'the mixed EI-job performance relationship becomes nil (β = -.02) after controlling for the set of covariates'."
  ghi_chu: "Theo thước đo mục 4, 'Đang tranh cãi' khi bằng chứng chất lượng cao mâu thuẫn nhau hay hiệu ứng nhỏ hơn nhiều so với tuyên bố ban đầu: hai phân tích tổng hợp trên cho thấy cả hai điều (ρ = .47 rồi .29; phần dự báo riêng về 0 khi kiểm soát; EQ năng lực không nhất quán). Nhãn không cao hơn thước đo. Ý 'chưa có nghiên cứu đo thẳng' thành công trong đời: không tìm được nghiên cứu ngược lại, không kiểm được hết; câu viết thận trọng."
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n72
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1037/a0017286", "https://api.openalex.org/works/doi:10.1037/a0037681"]
  trich: "Joseph et al. 2015: 'the content of mixed EI measures strongly overlaps with a set of well-known psychological constructs (i.e., ability EI, self-efficacy, and self-rated performance, in addition to Conscientiousness, Emotional Stability, Extraversion, and general mental ability; multiple R = .79) … the mixed EI-job performance relationship becomes nil (β = -.02) after controlling for the set of covariates'."
  ghi_chu: "Chỉ đọc tóm tắt; tóm tắt có đủ các ý. 'Sự tự tin' là cách dịch thoáng của self-efficacy (niềm tin vào năng lực bản thân); có thể viết rõ hơn nhưng không sai. 'EQ mixed tương quan cao hơn' khớp: mixed EI được gọi là 'one of the best known predictors', còn EQ năng lực không nhất quán."
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n38
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1111/1467-9280.00350", "https://library.mpib-berlin.mpg.de/ft/rh/RH_Conjunction_1999.pdf", "https://api.openalex.org/works/doi:10.1207/s15516709cog2803_8"]
  trich: "Mellers, Hertwig & Kahneman (2001), tóm tắt: 'Frequency formats by themselves did not eliminate conjunction effects with any of the phrases, but when filler items were removed, conjunction effects disappeared with Hertwig's phrases. Kahneman and Hertwig offer different interpretations of the findings.'"
  ghi_chu: "Nhãn nói về cách giải thích (heuristic hay cách hiểu chữ), không về hiệu ứng: đúng tinh thần mục 4. Cuộc hợp tác đối nghịch có trọng tài vẫn kết thúc với hai cách diễn giải khác nhau; Hertwig & Gigerenzer 1999 và Tentori và cộng sự 2004 đi hai hướng: bằng chứng tốt mâu thuẫn nhau, đạt 'Đang tranh cãi'."
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n73
  luot_2: sai
  nguon: ["https://library.mpib-berlin.mpg.de/ft/rh/RH_Conjunction_1999.pdf", "https://doi.org/10.1002/(SICI)1099-0771(199912)12:4<275::AID-BDM323>3.0.CO;2-M"]
  trich: "Hertwig & Gigerenzer 1999, mục \"What other ways of preserving the relevance maxim\": 'several researchers (e.g. Adler, 1984, 1991; Dulany and Hilton, 1991; Politzer and Noveck, 1991) argued that participants interpret the hypothesis \"Linda is a bank teller\" to mean \"Linda is a bank teller and is not active in the feminist movement\" (T&not-F implicature)… None of the predictions that Agnoli and Krantz (1989) attributed to this hypothesis have been corroborated. [Macdonald and Gilhooly … found that the proportion of conjunction violations decreased …] With few exceptions, the evidence reported so far indicates that at least some participants preserve the relevance maxim by drawing the T&not-F implicature.'"
  cau_dung: "Một giả thuyết khác, của một số tác giả như Adler, Dulany và Hilton, Politzer và Noveck (theo Hertwig và Gigerenzer, 1999), là người nghe ngầm hiểu \"(a) Linda là nhân viên ngân hàng\" thành \"nhân viên ngân hàng và không phải nhà hoạt động nữ quyền\", và với cách hiểu đó thì chọn (b) không còn là lỗi logic. Theo Hertwig và Gigerenzer, kết quả các thử nghiệm không đồng nhất (các dự đoán mà Agnoli và Krantz, 1989, rút từ giả thuyết này không được xác nhận), nhưng nhìn chung bằng chứng cho thấy ít nhất một phần người tham gia có hiểu theo cách này."
  ghi_chu: "Phần đầu đúng. Phần cuối đảo nghĩa: câu 'không được xác nhận' của Hertwig & Gigerenzer chỉ nói về các dự đoán mà Agnoli & Krantz (1989) gán cho giả thuyết; ngay sau đó họ kể Tversky & Kahneman 1983, Macdonald & Gilhooly, Politzer & Noveck, Dulany & Hilton đều thấy tỉ lệ vi phạm giảm khi chặn cách hiểu này, và kết luận ít nhất một phần người tham gia hiểu theo cách đó. Bản tác giả ở thư viện MPIB (PDF mã hóa phông, đã giải mã để đọc; không trích con số phần trăm vì chữ số giải mã không chắc)."
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n74
  luot_2: sai
  nguon: ["https://library.mpib-berlin.mpg.de/ft/rh/RH_Conjunction_1999.pdf", "https://api.openalex.org/works/doi:10.1111/1467-9280.00350", "https://api.openalex.org/works/doi:10.1207/s15516709cog2803_8"]
  trich: "Hertwig & Gigerenzer 1999, cùng mục: 'Tversky and Kahneman (1983, p. 299) replaced \"Linda is a bank teller\" by \"Linda is a bank teller whether or not she is active in the feminist movement\". This formulation led to a marked decrease in the proportion of conjunction violations… With few exceptions, the evidence reported so far indicates that at least some participants preserve the relevance maxim by drawing the T&not-F implicature.' Tentori et al. 2004, tóm tắt: 'Whether an error is thereby committed depends on reasoners' interpretation of the expressions \"probability\" and \"and.\"' Mellers et al. 2001: Hertwig cho rằng một số người hiểu 'and' như phép hợp."
  cau_dung: "Mục Lý thuyết: theo các nhà phê bình như Gigerenzer và Hertwig, người tham gia hiểu câu hỏi theo thói quen giao tiếp, có thể hiểu \"xác suất\" và \"và\" khác nghĩa toán học (Tentori 2004 cũng nêu); một số tác giả khác cho rằng người tham gia hiểu (a) và (b) là hai nhóm loại trừ nhau; Tversky và Kahneman (1983) đã thử chặn cách hiểu này và tỉ lệ mắc lỗi giảm rõ; theo Hertwig và Gigerenzer (1999), bằng chứng cho thấy ít nhất một phần người tham gia hiểu theo cách đó, dù không phải mọi dự đoán của giả thuyết đều được xác nhận."
  ghi_chu: "Cùng lỗi với n73: 'các dự đoán của giả thuyết ấy chưa được xác nhận' là đọc sai Hertwig & Gigerenzer (câu ấy chỉ về dự đoán do Agnoli & Krantz 1989 gán; kết luận chung của họ ngược lại). Các ý còn lại đúng: ý về 'và' có ở Mellers và cộng sự 2001 (tóm tắt) và Tentori 2004 (tóm tắt)."
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n35
  luot_2: dung
  nguon: ["https://unsworks.unsw.edu.au/bitstreams/0ed47cd2-5eff-4a07-a449-586c99763aac/download", "https://doi.org/10.1037/bul0000153"]
  trich: "Oberauer et al. 2018 (bản chấp nhận, UNSWorks), Benchmark 8.1.1 Phonological similarity (A): 'Increasing the phonological similarity between memoranda leads to worse serial recall performance (Conrad & Hull, 1964…). The phonological similarity effect is observed regardless of whether memoranda are presented visually or auditorily (Peterson & Johnson, 1971). This suggests that phonology is a preferred form of representation for verbal WM… It is a cornerstone of the phonological loop theory… we regard the effect of phonological similarity on order memory as a category A benchmark.' Mức A: 'No theory must contradict it because it is a fundamental fact of WM.'"
  ghi_chu: "Nhãn Vững chắc đạt thước đo: tổng quan đồng thuận ở Psychological Bulletin xếp mức A (tổng quát qua nhiều mô hình thí nghiệm). Lưu ý: Oberauer nói hiệu ứng bất lợi là ở trí nhớ thứ tự; với từ vần, trí nhớ về từ (không theo thứ tự) có khi lợi, và ở bài complex span thường thấy lợi. Khung nói 'nhớ kém hơn' chung, đọc theo nghĩa nhớ dãy theo thứ tự thì đúng. 'Vòng lặp âm vị là cách giải thích phổ biến nhất': bài gọi là 'cornerstone of the phonological loop theory', không xếp hạng các cách giải thích, nhưng câu không mạnh hơn mức ấy."
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n71
  luot_2: dung
  nguon: ["https://unsworks.unsw.edu.au/bitstreams/0ed47cd2-5eff-4a07-a449-586c99763aac/download", "https://link.springer.com/content/pdf/10.3758/s13421-025-01762-5.pdf"]
  trich: "Oberauer et al. 2018, Benchmark 7 (B): 'This word-length effect is robust when word length is manipulated through the number of syllables… (Baddeley, Thomson, & Buchanan, 1975…) … has been observed consistently in various languages. Given its restriction to the verbal domain, the rating … is a B.' Guitard, Neath & Surprenant 2025: 'Experiment 2 found that when the short and long words were more fully equated, including being equated for orthographic and phonological neighborhood size, the word-length effect disappeared'; về Jalbert 2011a và Guitard 2018 (nhớ lại theo thứ tự): 'there was no effect of word length' / 'Once again, no word-length effects were observed.'"
  ghi_chu: "Đúng. 'Nhóm phát hiện ổn định': Oberauer định nghĩa mức B là phát hiện áp dụng cho phạm vi hẹp hơn mức A (ở đây vì chỉ ở lời nói), không phải 'ổn định'; nhưng bài có gọi hiệu ứng là 'robust', nên câu không sai. Nếu sửa trang thì nên ghi 'mức B (hẹp hơn vì chỉ ở lời nói)'. Nhãn Khá vững hợp thước đo: hiệu ứng lặp lại nhiều, nhưng nguyên nhân bị nghi trùng biến."
- trang: bang-chung/dao-duc-nghien-cuu
  id: e4
  luot_2: dung
  nguon: ["https://www.govinfo.gov/content/pkg/FR-1979-04-18/pdf/FR-1979-04-18.pdf"]
  trich: "Belmont Report (Federal Register 44, 18/4/1979, tr. 23192 trở đi): 'In this country, in the 1940's, the Tuskegee syphilis study used disadvantaged, rural black men to study the untreated course of a disease that is by no means confined to that population. These subjects were deprived of demonstrably effective treatment in order not to interrupt the project, long after such treatment became generally available.'"
  ghi_chu: "Trang HHS chặn bot (403); đọc bản Federal Register trên govinfo.gov. 'Diễn tiến tự nhiên' = 'untreated course'."
