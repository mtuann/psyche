- trang: thi-nghiem/keo-deo
  id: n1
  cau: Walter Mischel cho trẻ mẫu giáo chọn giữa một phần thưởng ngay và một phần thưởng ưa thích hơn nếu chờ.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n2
  cau: Trong mẫu gốc, những trẻ chờ được lâu hơn sau này có điểm SAT cao hơn.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n3
  cau: Lần làm lại năm 2018 dùng 918 trẻ.
  loai: so-lieu
- trang: thi-nghiem/keo-deo
  id: n4
  cau: Lần làm lại cho thấy mối liên hệ giảm mạnh khi tính đến hoàn cảnh gia đình.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n5
  cau: "Hãy tưởng tượng: người lớn nói trẻ 4 tuổi rằng chờ mà không ăn thì được hai viên, ăn ngay thì chỉ được một viên."
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n6
  cau: 'Câu hỏi: "khả năng chờ đợi của đứa trẻ 4 tuổi có dự đoán được điểm số của nó hơn mười năm sau không?"'
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n7
  cau: "Nghiên cứu gốc tìm thấy tương quan đáng kể: trẻ chờ lâu hơn sau này có điểm SAT cao hơn và được cha mẹ đánh giá là ứng phó tốt hơn."
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n8
  cau: Lần làm lại 2018 cho thấy tương quan chỉ bằng khoảng một nửa bản gốc, và khi tính đến hoàn cảnh gia đình thì giảm thêm khoảng hai phần ba.
  loai: so-lieu
- trang: thi-nghiem/keo-deo
  id: n9
  cau: 'Thí nghiệm "kẹo dẻo" nổi tiếng với câu chuyện thường được kể lại: đứa trẻ nào cưỡng lại được viên kẹo hôm nay sẽ thành công ngày mai.'
  loai: lich-su
- trang: thi-nghiem/keo-deo
  id: n10
  cau: Trong các thí nghiệm gốc, thời gian chờ phụ thuộc mạnh vào cách trẻ hướng sự chú ý, chứ không chỉ vào "ý chí".
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n11
  cau: Mối liên hệ giữa thời gian chờ và kết quả sau này là tương quan, không phải nhân quả.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n12
  cau: Một phần lớn mối tương quan ấy có thể đến từ hoàn cảnh gia đình.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n13
  cau: Nghiên cứu Mischel, Ebbesen và Zeiss (1972) gồm 3 thí nghiệm với 92 trẻ trong số trẻ phân tích.
  loai: so-lieu
- trang: thi-nghiem/keo-deo
  id: n14
  cau: Các trẻ có độ tuổi từ 3 tuổi 5 tháng đến 5 tuổi 6 tháng, ở trường mầm non Bing của Đại học Stanford.
  loai: so-lieu
- trang: thi-nghiem/keo-deo
  id: n15
  cau: Mỗi trẻ chọn một trong hai phần thưởng (kẹo dẻo và bánh quy que); chờ người lớn tự quay lại (tối đa 15 phút) thì được phần mình chọn.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n16
  cau: Nếu bấm chuông gọi người lớn về sớm thì chỉ được phần thưởng còn lại, kém ưa thích hơn.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n17
  cau: "Các nhà nghiên cứu thay đổi điều kiện: trẻ chờ khi cả hai phần thưởng ở trước mặt hay có đồ chơi; được gợi ý nghĩ chuyện vui, chuyện buồn hay nghĩ về phần thưởng; phần thưởng bị che hay không."
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n18
  cau: Khi cả hai phần thưởng ở trước mặt và không có gì để làm, trẻ chờ trung bình dưới nửa phút.
  loai: so-lieu
- trang: thi-nghiem/keo-deo
  id: n19
  cau: Khi đó không trẻ nào chờ đủ 15 phút.
  loai: so-lieu
- trang: thi-nghiem/keo-deo
  id: n20
  cau: Khi có đồ chơi hoặc được gợi ý nghĩ chuyện vui, trẻ chờ trung bình 8,59 và 12,12 phút.
  loai: so-lieu
- trang: thi-nghiem/keo-deo
  id: n21
  cau: Khi có đồ chơi hoặc nghĩ chuyện vui, một nửa số trẻ chờ đủ 15 phút.
  loai: so-lieu
- trang: thi-nghiem/keo-deo
  id: n22
  cau: Nghĩ về chính phần thưởng hay nghĩ chuyện buồn cho thời gian chờ tương tự khi không có gợi ý nào (khác biệt không có ý nghĩa thống kê).
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n23
  cau: Khi phần thưởng bị che, trẻ được gợi ý nghĩ về phần thưởng chờ trung bình chỉ 0,78 phút.
  loai: so-lieu
- trang: thi-nghiem/keo-deo
  id: n24
  cau: Nghĩ về chính phần thưởng (kể cả khi phần thưởng đã bị che đi) làm giảm thời gian chờ.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n25
  cau: Thời gian chờ thay đổi lớn tùy cách trẻ hướng sự chú ý, chứ không chỉ do một phẩm chất cố định.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n26
  cau: Mischel, Shoda và Peake (1988) theo dõi 95 trẻ hơn mười năm sau.
  loai: so-lieu
- trang: thi-nghiem/keo-deo
  id: n27
  cau: Trẻ chờ lâu hơn hồi 4–5 tuổi sau này được cha mẹ đánh giá là học tập và giao tiếp xã hội tốt hơn, chịu được thất bại và căng thẳng, tập trung và lập kế hoạch tốt hơn.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n28
  cau: Trong nghiên cứu 1990, ở điều kiện "chẩn đoán", thời gian chờ có tương quan với điểm SAT (r = 0,57 với SAT toán và 0,42 với SAT ngôn ngữ).
  loai: so-lieu
- trang: thi-nghiem/keo-deo
  id: n29
  cau: Tổng quan 1989 trên Science tóm tắt rằng trẻ 4 tuổi chờ lâu hơn trong một số tình huống về sau học tốt hơn và ứng phó với thất vọng và căng thẳng tốt hơn.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n30
  cau: Các nghiên cứu theo dõi làm trên trẻ từ cộng đồng Đại học Stanford, mẫu nhỏ (35–89 trẻ mỗi phân tích) và đặc thù.
  loai: so-lieu
- trang: thi-nghiem/keo-deo
  id: n31
  cau: Các nghiên cứu theo dõi cho thấy tương quan, không chứng minh viên kẹo gây ra thành công.
  loai: loi-khuyen
- trang: thi-nghiem/keo-deo
  id: n32
  cau: Watts và cộng sự dùng dữ liệu của nghiên cứu NICHD (Study of Early Child Care and Youth Development), đa dạng hơn về kinh tế–xã hội.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n33
  cau: Trẻ làm bài chờ lúc 54 tháng tuổi và có dữ liệu ở tuổi 15.
  loai: so-lieu
- trang: thi-nghiem/keo-deo
  id: n34
  cau: "Bài chờ là phiên bản chỉnh sửa: trẻ chờ tối đa 7 phút để được thêm một phần thưởng."
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n35
  cau: Phân tích chính tập trung vào 552 trẻ có mẹ chưa tốt nghiệp đại học, gấp khoảng mười lần mẫu của Shoda và cộng sự (1990).
  loai: so-lieu
- trang: thi-nghiem/keo-deo
  id: n36
  cau: Với tương quan đơn giản, mối liên hệ giữa thời gian chờ và thành tích ở tuổi 15 chỉ bằng khoảng một nửa độ lớn ban đầu.
  loai: so-lieu
- trang: thi-nghiem/keo-deo
  id: n37
  cau: Với thành tích học tập ở tuổi 15, hệ số chuẩn hóa còn 0,08 (có ý nghĩa thống kê) khi kiểm soát các yếu tố trước 54 tháng, và 0,05 (không có ý nghĩa thống kê) khi thêm yếu tố đo cùng lúc.
  loai: so-lieu
- trang: thi-nghiem/keo-deo
  id: n38
  cau: Với các chỉ số hành vi ở tuổi 15, mối liên hệ nhỏ và hiếm khi có ý nghĩa thống kê.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n39
  cau: "Kidd, Palmeri và Aslin (2013): thí nghiệm với 28 trẻ (tuổi trung bình 4 tuổi 6 tháng)."
  loai: so-lieu
- trang: thi-nghiem/keo-deo
  id: n40
  cau: Trẻ ở môi trường người lớn không đáng tin chờ ít hơn đáng kể so với trẻ ở môi trường đáng tin.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n41
  cau: "Khá vững: cách trẻ hướng sự chú ý trong lúc chờ làm thay đổi khả năng chờ đợi."
  loai: nhan
- trang: thi-nghiem/keo-deo
  id: n42
  cau: "Khá vững: thời gian chờ đợi tương quan với một số kết quả tuổi teen trong mẫu gốc (và, ở mức nhỏ hơn, trong lần làm lại)."
  loai: nhan
- trang: thi-nghiem/keo-deo
  id: n43
  cau: 'Đã bị bác bỏ: thời gian chờ kẹo dẻo lúc nhỏ "định đoạt" tương lai.'
  loai: nhan
- trang: thi-nghiem/keo-deo
  id: n67
  cau: "Benjamin và cộng sự (2020), phân tích có đăng ký trước trên 113 người của các nghiên cứu trường Bing khi đã gần 50 tuổi: thời gian chờ lúc mẫu giáo không dự đoán được 11 chỉ số tài chính và học vấn (tương quan trung bình 0,02)."
  loai: tai-lap
- trang: thi-nghiem/keo-deo
  id: n68
  cau: "Sperber và cộng sự (2024), phân tích có đăng ký trước trên 702 người của mẫu NICHD ở tuổi 26: kết quả bài thử kẹo dẻo không dự đoán ổn định thành tích, sức khỏe hay hành vi."
  loai: tai-lap
- trang: thi-nghiem/keo-deo
  id: n44
  cau: Metcalfe và Mischel (1999) đề xuất hệ "lạnh" nhận thức, trung tính về cảm xúc, là nơi đặt sự tự điều chỉnh; hệ "nóng" cảm xúc, bốc đồng, dễ làm hỏng nỗ lực tự kiềm chế.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n45
  cau: Theo mô hình hệ nóng–lạnh, cân bằng giữa hai hệ phụ thuộc vào stress, giai đoạn phát triển và cách tự điều chỉnh của mỗi người.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n46
  cau: Kidd và cộng sự đề xuất rằng thời gian chờ phản ánh cả niềm tin hợp lý về việc chờ có được đền đáp hay không, ngoài tự kiểm soát.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n47
  cau: Watts và cộng sự cho rằng mối liên hệ có thể do các yếu tố khác như hoàn cảnh kinh tế–xã hội và môi trường nuôi dạy; riêng dữ liệu quan sát này không chứng minh điều đó.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n48
  cau: 'Không nên dùng bài kẹo dẻo làm "bài test" cho con: mối liên hệ yếu và phần lớn gắn với hoàn cảnh gia đình.'
  loai: loi-khuyen
- trang: thi-nghiem/keo-deo
  id: n49
  cau: Trong thí nghiệm 1972, trẻ mẫu giáo chờ lâu hơn nhiều khi có đồ chơi hay nghĩ chuyện vui thay vì nhìn hay nghĩ về phần thưởng; điều này gợi ý có thể dời sự chú ý của trẻ khỏi thứ đang thèm, nhưng đó là kết quả trong phòng thí nghiệm.
  loai: loi-khuyen
- trang: thi-nghiem/keo-deo
  id: n50
  cau: Trong thí nghiệm của Kidd và cộng sự (28 trẻ), trẻ ở môi trường người lớn không giữ lời chờ ít hơn đáng kể; giữ lời hứa là cách để trẻ có lý do tin rằng chờ đợi được đền đáp.
  loai: loi-khuyen
- trang: thi-nghiem/keo-deo
  id: n51
  cau: Với chính mình, có thể thử để đồ ăn vặt xa tầm mắt; đây là suy luận từ kết quả ở trẻ em, chưa được kiểm chứng ở người lớn.
  loai: loi-khuyen
- trang: thi-nghiem/keo-deo
  id: n52
  cau: Tính đến 10/2026, chúng tôi chưa tìm thấy nghiên cứu kẹo dẻo trên trẻ em Việt Nam.
  loai: thoi-su
- trang: thi-nghiem/keo-deo
  id: n53
  cau: Các nghiên cứu ở trang này đều ở Mỹ, nên không nên mặc nhiên coi kết quả đúng cho trẻ ở nơi khác.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n54
  cau: Câu "Câu chuyện kẹo dẻo rất được ưa chuộng trên các diễn đàn nuôi dạy con ở Việt Nam ... khoảng cách điều kiện giữa các gia đình còn lớn..." đã bỏ khỏi trang.
  loai: loi-khuyen
- trang: thi-nghiem/keo-deo
  id: n55
  cau: '"Trẻ không chờ được kẹo thì tương lai mờ mịt": không có bằng chứng; mối liên hệ chỉ là tương quan, bằng khoảng một nửa bản gốc ở lần làm lại và giảm thêm khoảng hai phần ba khi tính đến hoàn cảnh gia đình.'
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n56
  cau: Thời gian chờ phản ánh nhiều thứ cùng lúc (cách hướng chú ý, niềm tin vào người lớn, hoàn cảnh gia đình); các nghiên cứu ở đây chưa tách được phần "ý chí bẩm sinh".
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n57
  cau: Lần làm lại 2018 cho thấy một phần lớn mối liên hệ giữa thời gian chờ và kết quả sau này biến mất khi tính đến nền tảng gia đình và môi trường.
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n58
  cau: "Quiz 1: trong các thí nghiệm 1972, trẻ chờ lâu hơn khi chú ý được dời khỏi phần thưởng (đồ chơi hoặc nghĩ chuyện vui); nghĩ về chính phần thưởng thì chờ ngắn."
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n59
  cau: "Quiz 2: thời gian chờ ở tuổi mẫu giáo tương quan với điểm SAT và đánh giá ứng phó ở tuổi teen, trong một mẫu nhỏ, đặc thù (trường Bing, Stanford)."
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n60
  cau: "Quiz 3: lần làm lại 2018 thấy tương quan chỉ còn khoảng một nửa bản gốc và giảm thêm khoảng hai phần ba khi tính đến nền tảng gia đình, năng lực nhận thức sớm và môi trường gia đình."
  loai: so-lieu
- trang: thi-nghiem/keo-deo
  id: n61
  cau: "Quiz 4: trẻ ở môi trường người lớn không giữ lời chờ ít hơn đáng kể."
  loai: phat-hien
- trang: thi-nghiem/keo-deo
  id: n62
  cau: "Quiz 5: không dùng bài test làm thước đo; giữ lời hứa với trẻ; thử dời sự chú ý của trẻ khỏi thứ đang thèm."
  loai: loi-khuyen
- trang: thi-nghiem/pavlov
  id: n1
  cau: Ivan Pavlov phát hiện phản xạ "có điều kiện" khi đo nước bọt của chó, từ "tiết dịch tâm lý".
  loai: lich-su
- trang: thi-nghiem/pavlov
  id: n2
  cau: "Hộp hồ sơ: Pavlov và cộng sự; tổng kết bằng tiếng Anh năm 1927, G. V. Anrep dịch."
  loai: lich-su
- trang: thi-nghiem/pavlov
  id: n3
  cau: Công việc do hơn một trăm cộng sự thực hiện suốt khoảng 25 năm (đến 1927).
  loai: lich-su
- trang: thi-nghiem/pavlov
  id: n4
  cau: Các chó được mổ nhỏ để chuyển lỗ mở của ống tuyến nước bọt ra da (má hoặc dưới cằm), và nước bọt được đo bằng giọt.
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n5
  cau: Một kích thích trung tính (thường là máy đếm nhịp) vang lên trước khi thức ăn đến; sau nhiều lần ghép đôi, kích thích ấy tự nó gây tiết nước bọt.
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n6
  cau: Quan niệm phản xạ cổ điển, bắt nguồn từ Descartes, coi một kích thích gắn tất yếu với một đáp ứng.
  loai: lich-su
- trang: thi-nghiem/pavlov
  id: n7
  cau: 'Pavlov mô tả thêm một loại phản xạ hình thành qua kinh nghiệm: âm thanh trung tính sau khi đi đôi với thức ăn trở thành "tín hiệu" (signal) báo thức ăn.'
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n8
  cau: Đây là phản xạ, không phải hành vi cố ý; điều kiện hóa cổ điển liên quan đến những phản ứng tự động của cơ thể.
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n9
  cau: Pavlov (1849–1936) là nhà sinh lý học người Nga, ban đầu nghiên cứu tiêu hóa ở chó.
  loai: lich-su
- trang: thi-nghiem/pavlov
  id: n10
  cau: Chó bắt đầu chảy nước miếng khi chỉ nhìn thấy thức ăn, cái bát quen thuộc, hay nghe tiếng chân người cho ăn.
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n11
  cau: Pavlov gọi hiện tượng đó là "tiết dịch tâm lý" (psychic secretions).
  loai: lich-su
- trang: thi-nghiem/pavlov
  id: n12
  cau: Pavlov tái tạo hiện tượng trong phòng thí nghiệm, dùng thịt bột làm kích thích không điều kiện.
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n13
  cau: "Các thành phần được đặt tên: kích thích có điều kiện, kích thích không điều kiện, đáp ứng không điều kiện, đáp ứng có điều kiện."
  loai: dinh-nghia
- trang: thi-nghiem/pavlov
  id: n14
  cau: "Tắt dần: nếu kích thích có điều kiện lặp lại mãi mà không còn thức ăn, đáp ứng dần biến mất."
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n15
  cau: "Phục hồi tự nhiên: sau một thời gian nghỉ, đáp ứng đã tắt có thể trở lại."
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n16
  cau: "Khái quát hóa và phân biệt: chó phản ứng với âm thanh gần giống, rồi học chỉ đáp ứng với đúng âm đã được ghép đôi."
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n17
  cau: Bản tổng kết bằng tiếng Anh là Conditioned Reflexes, do G. V. Anrep dịch, Oxford University Press xuất bản năm 1927.
  loai: lich-su
- trang: thi-nghiem/pavlov
  id: n18
  cau: "Chú thích đạo đức: chó phải qua mổ nhỏ chuyển ống tuyến nước bọt ra da; theo chuẩn mực ngày nay, mọi thủ tục trên động vật đều phải qua hội đồng đạo đức và giảm thiểu đau đớn."
  loai: loi-khuyen
- trang: thi-nghiem/pavlov
  id: n19
  cau: Watson và Rayner thử trên một bé trai 11 tháng tuổi, gọi là "Albert bé nhỏ".
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n20
  cau: Ban đầu Albert không sợ chuột bạch.
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n21
  cau: Khi bé chạm vào chuột, các nhà nghiên cứu gõ búa vào thanh thép ngay sau gáy bé; bé giật mình và khóc.
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n22
  cau: Sau vài lần ghép đôi, thấy chuột bạch bé tỏ ra sợ, có lúc khóc và bò tránh, dù không còn tiếng động.
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n23
  cau: Nỗi sợ khái quát hóa sang thỏ, chó và áo lông thú.
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n24
  cau: "Nỗi sợ không được gỡ bỏ: Albert rời bệnh viện ngày kết thúc các thử nghiệm."
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n25
  cau: Bài báo gốc không có đoạn nào ghi về sự đồng thuận.
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n26
  cau: "Danh tính bé còn tranh cãi: Beck và cộng sự (2009) cho là Douglas Merritte, Powell và cộng sự (2014) cho là Albert Barger."
  loai: lich-su
- trang: thi-nghiem/pavlov
  id: n56
  cau: Watson và Rayner (1920) dùng điều kiện hóa cổ điển để tạo nỗi sợ chuột bạch ở một em bé, "Albert bé nhỏ"; chi tiết ở trang Little Albert.
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n27
  cau: "Vững chắc: học liên hệ giữa các kích thích là có thật."
  loai: nhan
- trang: thi-nghiem/pavlov
  id: n28
  cau: "Vững chắc: tắt dần, phục hồi tự nhiên, khái quát hóa và phân biệt (Pavlov mô tả năm 1927; nghiên cứu nhiều ở động vật và người; nỗi sợ có điều kiện dễ tắt dần nhưng dễ quay lại)."
  loai: nhan
- trang: thi-nghiem/pavlov
  id: n57
  cau: "Tổng quan Vervliet và cộng sự (2013) trên Annual Review of Clinical Psychology tóm kết quả ở động vật và người: nỗi sợ có điều kiện dễ tắt dần nhưng cũng dễ quay lại."
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n58
  cau: Phân tích tổng hợp của Duits và cộng sự (2015) gồm 44 nghiên cứu điều kiện hóa nỗi sợ, so sánh người có và không có rối loạn lo âu ở giai đoạn học, giai đoạn tắt dần và khả năng phân biệt kích thích báo nguy với kích thích an toàn.
  loai: so-lieu
- trang: thi-nghiem/pavlov
  id: n29
  cau: Người dịch W. Horsley Gantt (1928) ghi chú rằng thuật ngữ của Pavlov là "conditional" (условный, có điều kiện), không phải "conditioned"; ông vẫn dùng "conditioned" vì chữ ấy đã quen trong tiếng Anh, còn bản tiếng Pháp và tiếng Đức giữ chữ gốc. Tiếng Việt "phản xạ có điều kiện" gần nghĩa gốc.
  loai: lich-su
- trang: thi-nghiem/pavlov
  id: n30
  cau: "Đang tranh cãi: điều kiện hóa chỉ là ghép đôi, hay là học dự báo; học diễn ra theo cơ chế nào vẫn còn được bàn."
  loai: nhan
- trang: thi-nghiem/pavlov
  id: n31
  cau: Rescorla và Wagner (1972) đề xuất mô hình trong đó học phụ thuộc vào việc kích thích trung tính dự báo được kích thích không điều kiện đến mức nào.
  loai: lich-su
- trang: thi-nghiem/pavlov
  id: n32
  cau: 'Bằng chứng hay được dẫn cho học dự báo là hiệu ứng "chặn" (blocking) của Kamin (1969): đã học rằng một tín hiệu báo trước điều sắp đến thì một tín hiệu mới đi kèm khó được học thêm.'
  loai: lich-su
- trang: thi-nghiem/pavlov
  id: n59
  cau: Tổng quan của Miller, Barnet và Grahame (1995) cho thấy mô hình Rescorla–Wagner có cả những dự đoán đúng lẫn những dự đoán sai.
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n60
  cau: Maes và cộng sự (2016) báo cáo 15 thí nghiệm trên chuột nhắt và chuột cống không thu được hiệu ứng chặn dù dùng thủ tục giống các nghiên cứu đã đăng.
  loai: tai-lap
- trang: thi-nghiem/pavlov
  id: n33
  cau: "Bác bỏ: Pavlov chỉ dùng chuông, hay ngược lại, chưa từng dùng chuông."
  loai: nhan
- trang: thi-nghiem/pavlov
  id: n34
  cau: Trong bảy bài giảng đầu của sách 1927, kích thích xuất hiện nhiều nhất là máy đếm nhịp; còn có còi hoặc chuông điện, âm thoa, còi Galton, đèn nháy, vật quay và kích thích chạm lên da.
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n35
  cau: Thomas (1997) dẫn việc Pavlov dùng chuông trong báo cáo trên Science năm 1906, phim của phòng thí nghiệm 1925–26 và nghiên cứu di truyền kiểu Lamarck năm 1923.
  loai: lich-su
- trang: thi-nghiem/pavlov
  id: n36
  cau: Bản tiếng Anh 1927 kể về một con chó được luyện với cả tiếng máy đếm nhịp lẫn "tiếng rè của chuông điện" (bài giảng III).
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n37
  cau: Jarius và Wildemann (2015) rà các bài của Pavlov trong bản dịch tiếng Anh của W. Horsley Gantt, thấy nhiều chỗ nhắc tới chuông, và kết luận rằng hình ảnh "chó và chuông" có cơ sở thật.
  loai: lich-su
- trang: thi-nghiem/pavlov
  id: n38
  cau: Giáo trình mở trình bày điều kiện hóa cổ điển và thao tác như hai dạng học liên kết khác nhau.
  loai: dinh-nghia
- trang: thi-nghiem/pavlov
  id: n39
  cau: Theo Schultz, Dayan và Montague (1997), các neuron dopamine ở linh trưởng có hoạt động dường như báo hiệu thay đổi hay sai số trong dự đoán phần thưởng; học được điều khiển bởi thay đổi trong kỳ vọng.
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n40
  cau: Liệu pháp phơi nhiễm đưa người học tiếp xúc với thứ gây sợ để họ dần quen; giải mẫn cảm có hệ thống (Wolpe, 1958) dùng thang bậc từ ít đến nhiều gây lo âu kết hợp thư giãn; giáo trình mở trình bày cả hai như kỹ thuật dựa trên điều kiện hóa cổ điển.
  loai: lam-sang
- trang: thi-nghiem/pavlov
  id: n41
  cau: Phân tích tổng hợp 214 nghiên cứu thấy điều kiện hóa đánh giá (ghép vật trung tính với kích thích dễ chịu hay khó chịu) có hiệu ứng trung bình d = 0,52.
  loai: so-lieu
- trang: thi-nghiem/pavlov
  id: n42
  cau: Điều kiện hóa vị giác có thể xảy ra sau một lần ghép đôi dù cách quãng nhiều giờ; có thể là một thích nghi tiến hóa.
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n43
  cau: Giáo trình mở nêu ví dụ tiếng động quen thuộc trở thành tín hiệu báo thức ăn cho mèo; ý tưởng tương tự dùng khi huấn luyện bằng tiếng clicker.
  loai: loi-khuyen
- trang: thi-nghiem/pavlov
  id: n44
  cau: Tính đến 10/2026, chúng tôi chưa tìm thấy nghiên cứu nào trên người Việt về điều kiện hóa cổ điển trong phòng thí nghiệm.
  loai: thoi-su
- trang: thi-nghiem/pavlov
  id: n45
  cau: Các liệu pháp dựa trên tắt dần được thực hành ở Việt Nam nhưng không có số liệu tổng kết đáng tin cậy.
  loai: thoi-su
- trang: thi-nghiem/pavlov
  id: n46
  cau: Pavlov đoạt Nobel Sinh lý/Y khoa năm 1904 "in recognition of his work on the physiology of digestion".
  loai: lich-su
- trang: thi-nghiem/pavlov
  id: n47
  cau: "Quiz 1: Pavlov đoạt Nobel 1904 vì nghiên cứu sinh lý tiêu hóa ở chó; ông đo nước bọt đến từng giọt vì đó là cách nghiên cứu các tuyến tiêu hóa."
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n48
  cau: "Quiz 2: máy đếm nhịp xuất hiện nhiều hơn hẳn chuông điện trong các bài giảng 1927, nhưng Pavlov cũng dùng chuông (Thomas 1997)."
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n49
  cau: "Quiz 3: thịt bột là kích thích không điều kiện."
  loai: dinh-nghia
- trang: thi-nghiem/pavlov
  id: n50
  cau: "Quiz 4: vấn đề đạo đức lớn nhất của Watson và Rayner là nỗi sợ không được gỡ bỏ (bé rời bệnh viện) và bài báo không ghi sự đồng thuận; danh tính còn tranh cãi."
  loai: phat-hien
- trang: thi-nghiem/pavlov
  id: n51
  cau: "Quiz 5: điều kiện hóa cổ điển liên quan đến liên hệ giữa hai kích thích; thao tác liên quan đến liên hệ hành vi–hậu quả."
  loai: dinh-nghia
- trang: thi-nghiem/skinner
  id: n1
  cau: B. F. Skinner cho chuột ấn cần gạt trong buồng thí nghiệm và phát hiện lịch trình thưởng ảnh hưởng đến hành vi (Ferster & Skinner 1957).
  loai: phat-hien
- trang: thi-nghiem/skinner
  id: n2
  cau: 'Khi bạn ngừng thưởng, hành vi được củng cố ngắt quãng (nhất là tỉ lệ biến đổi) bền hơn khi thưởng mỗi lần: Skinner (1953) viết rằng sức bền khi tắt dần do củng cố ngắt quãng "có thể lớn hơn nhiều" so với cùng số lần thưởng cho các đáp ứng liên tiếp.'
  loai: phat-hien
- trang: thi-nghiem/skinner
  id: n3
  cau: Skinner (1953) nhận xét máy đánh bạc trả thưởng theo lịch trình tỉ lệ biến đổi.
  loai: phat-hien
- trang: thi-nghiem/skinner
  id: n4
  cau: Nghiên cứu gần đây trên chuột không ủng hộ ý của Skinner rằng riêng lịch trình tỉ lệ biến đổi gây cờ bạc bệnh lý (theo OpenStax, dẫn Laskowski và cộng sự 2019).
  loai: tai-lap
- trang: thi-nghiem/skinner
  id: n5
  cau: Khác với chó của Pavlov học "âm thanh báo hiệu thức ăn", con vật của Skinner học "làm gì thì được gì".
  loai: dinh-nghia
- trang: thi-nghiem/skinner
  id: n6
  cau: Một hành vi tự phát, một khi được thưởng, sẽ xuất hiện thường xuyên hơn (hành vi thao tác).
  loai: dinh-nghia
- trang: thi-nghiem/skinner
  id: n7
  cau: Lịch trình thưởng tạo ra những nhịp độ hành vi khác nhau và ảnh hưởng đến sức bền của hành vi khi thưởng ngừng.
  loai: phat-hien
- trang: thi-nghiem/skinner
  id: n8
  cau: Skinner bắt đầu chương trình nghiên cứu từ luận án tiến sĩ ở Harvard (1931); phần lớn các thí nghiệm trong sách 1938 làm khi là nghiên cứu viên ở Harvard.
  loai: lich-su
- trang: thi-nghiem/skinner
  id: n9
  cau: Thiết bị là buồng thí nghiệm, về sau được gọi là "buồng điều kiện hóa thao tác", quen gọi là "hộp Skinner".
  loai: lich-su
- trang: thi-nghiem/skinner
  id: n10
  cau: Chuột đói ấn một cần gạt để nhận viên thức ăn; chim bồ câu mổ một đĩa phím.
  loai: phat-hien
- trang: thi-nghiem/skinner
  id: n11
  cau: Hành vi được ghi dưới dạng đường cong tích lũy theo thời gian; độ dốc cho biết tốc độ đáp ứng.
  loai: phat-hien
- trang: thi-nghiem/skinner
  id: n12
  cau: Chuột đói học ấn cần để lấy thức ăn.
  loai: phat-hien
- trang: thi-nghiem/skinner
  id: n13
  cau: Hành vi không chỉ phụ thuộc "có thưởng hay không" mà vào cách thưởng được sắp xếp (lịch trình).
  loai: phat-hien
- trang: thi-nghiem/skinner
  id: n14
  cau: Skinner công bố The Behavior of Organisms (1938, Appleton-Century) khi là phó giáo sư ở Đại học Minnesota, tổng kết nghiên cứu đã làm từ Harvard.
  loai: lich-su
- trang: thi-nghiem/skinner
  id: n15
  cau: Phần lớn công việc của Ferster và Skinner làm từ 1/9/1949 đến 30/6/1955, theo hợp đồng giữa Văn phòng Nghiên cứu Hải quân Mỹ và Đại học Harvard.
  loai: lich-su
- trang: thi-nghiem/skinner
  id: n16
  cau: Ferster và Skinner mô tả hệ thống nhiều lịch trình thưởng trong sách Schedules of Reinforcement (Appleton-Century-Crofts, 1957).
  loai: lich-su
- trang: thi-nghiem/skinner
  id: n17
  cau: Con vật trong sách 1957 chủ yếu là bồ câu, ngoài ra có chuột.
  loai: phat-hien
- trang: thi-nghiem/skinner
  id: n18
  cau: "Bốn lịch trình cơ bản: tỉ lệ cố định, tỉ lệ biến đổi, khoảng cố định, khoảng biến đổi."
  loai: dinh-nghia
- trang: thi-nghiem/skinner
  id: n19
  cau: "Tỉ lệ cố định (FR): thưởng sau mỗi N đáp ứng; tốc độ cao, có quãng nghỉ ngắn sau mỗi lần thưởng."
  loai: dinh-nghia
- trang: thi-nghiem/skinner
  id: n20
  cau: "Tỉ lệ biến đổi (VR): thưởng sau số đáp ứng trung bình N thay đổi ngẫu nhiên; tốc độ cao, đều, khó tắt dần nhất trong các lịch trình."
  loai: dinh-nghia
- trang: thi-nghiem/skinner
  id: n21
  cau: 'Khoảng cố định (FI): thưởng cho đáp ứng đầu tiên sau mỗi N giây; đường cong "vỏ sò": nghỉ sau thưởng rồi tăng tốc khi gần đến giờ.'
  loai: dinh-nghia
- trang: thi-nghiem/skinner
  id: n22
  cau: "Khoảng biến đổi (VI): tốc độ vừa phải, đều."
  loai: dinh-nghia
- trang: thi-nghiem/skinner
  id: n23
  cau: "Hình (đã sửa): bốn đường cong tích lũy — FR cao nhưng vỡ nhịp sau thưởng; VR cao, đều, khó tắt dần nhất (chú thích: mẫu hình mà Skinner 1953 gắn với máy đánh bạc); FI hình vỏ sò; VI vừa phải, rất đều; sơ đồ ước lệ, không theo tỉ lệ số liệu."
  loai: dinh-nghia
- trang: thi-nghiem/skinner
  id: n24
  cau: Skinner (1953) nêu rằng củng cố ngắt quãng có thể tạo hành vi bền hơn củng cố liên tục với cùng số lần thưởng; một bồ câu có thể phát ra khoảng 10.000 đáp ứng trước khi tắt dần hầu như hoàn toàn dưới một số lịch trình ngắt quãng.
  loai: phat-hien
- trang: thi-nghiem/skinner
  id: n25
  cau: Thưởng liên tục là cách nhanh nhất để dạy hành vi mới; sau khi hành vi được dạy thì thường chuyển sang củng cố ngắt quãng.
  loai: loi-khuyen
- trang: thi-nghiem/skinner
  id: n26
  cau: "Skinner (1948): bồ câu đói (giảm còn 75% cân nặng) được ăn theo đồng hồ (ví dụ 15 giây một lần) bất kể hành vi."
  loai: phat-hien
- trang: thi-nghiem/skinner
  id: n27
  cau: Ở 6 trong 8 con, một động tác lặp lại rõ rệt xuất hiện.
  loai: so-lieu
- trang: thi-nghiem/skinner
  id: n28
  cau: "Các động tác gồm: xoay ngược chiều kim đồng hồ, thọc đầu vào một góc lồng, hất đầu, đung đưa đầu và thân, mổ về phía sàn mà không chạm."
  loai: phat-hien
- trang: thi-nghiem/skinner
  id: n29
  cau: 'Skinner giải thích: con chim tình cờ đang làm động tác đó đúng lúc thức ăn xuất hiện nên có xu hướng lặp lại; ông gọi đó là hành vi "mê tín".'
  loai: phat-hien
- trang: thi-nghiem/skinner
  id: n30
  cau: Skinner so sánh với những nghi lễ cầu may của con người.
  loai: phat-hien
- trang: thi-nghiem/skinner
  id: n31
  cau: Staddon và Simmelhag (1971) làm lại thí nghiệm "mê tín" và thấy ngoài hành vi được củng cố tình cờ còn có những hoạt động xuất hiện ngay sau thức ăn, nên cách giải thích chỉ bằng củng cố tình cờ bị đặt câu hỏi.
  loai: tai-lap
- trang: thi-nghiem/skinner
  id: n32
  cau: Trong thí nghiệm 1948, bồ câu bị giảm còn 75% cân nặng; theo chuẩn mực ngày nay, nghiên cứu trên động vật phải qua hội đồng đạo đức và giảm thiểu đau đớn.
  loai: loi-khuyen
- trang: thi-nghiem/skinner
  id: n33
  cau: "Vững chắc: hậu quả làm thay đổi xác suất hành vi; ở động vật thí nghiệm, các lịch trình củng cố tạo ra mẫu hình ổn định."
  loai: nhan
- trang: thi-nghiem/skinner
  id: n59
  cau: Ở người, một phân tích tổng hợp 47 so sánh về "quản lý dự phòng" (contingency management), cách điều trị rối loạn dùng chất bằng phần thưởng có điều kiện, thấy hiệu quả trung bình d = 0,42 (Prendergast và cộng sự, 2006).
  loai: lam-sang
- trang: thi-nghiem/skinner
  id: n34
  cau: "Khá vững: củng cố ngắt quãng có thể bền hơn củng cố liên tục."
  loai: nhan
- trang: thi-nghiem/skinner
  id: n35
  cau: "Đang tranh cãi: con người có phải cỗ máy củng cố (quyết định luận và nhận thức)."
  loai: nhan
- trang: thi-nghiem/skinner
  id: n36
  cau: "Chomsky (1959): các tuyên bố của Skinner về hành vi ngôn ngữ chưa có cơ sở; củng cố là một yếu tố quan trọng nhưng còn khả năng khái quát và đặt giả thuyết của trẻ chưa hiểu hết."
  loai: phat-hien
- trang: thi-nghiem/skinner
  id: n37
  cau: "Đang tranh cãi: củng cố thao tác giải thích được mọi hành vi con người, kể cả ngôn ngữ."
  loai: nhan
- trang: thi-nghiem/skinner
  id: n38
  cau: Edward Thorndike (1911) nêu luật hiệu ứng; Skinner lấy luật này làm nền tảng cho điều kiện hóa thao tác.
  loai: lich-su
- trang: thi-nghiem/skinner
  id: n39
  cau: Ferster và Skinner mô tả hành vi dưới sự kiểm soát của kích thích phân biệt (tình huống) và lịch trình củng cố (hậu quả); đây là cách nhìn của nhóm Skinner.
  loai: lich-su
- trang: thi-nghiem/skinner
  id: n40
  cau: "Củng cố (dương tính: thêm điều dễ chịu; âm tính: bớt điều khó chịu) làm tăng hành vi; trừng phạt làm giảm hành vi; củng cố âm tính không phải là phạt."
  loai: dinh-nghia
- trang: thi-nghiem/skinner
  id: n41
  cau: "Bandura và các nhà tâm lý học nhận thức đề xuất thuyết học tập xã hội: con người còn học bằng quan sát người khác."
  loai: lich-su
- trang: thi-nghiem/skinner
  id: n42
  cau: Giáo trình mở lấy việc kiểm tra mạng xã hội làm ví dụ của lịch trình khoảng biến đổi và đánh bạc làm ví dụ của tỉ lệ biến đổi.
  loai: dinh-nghia
- trang: thi-nghiem/skinner
  id: n43
  cau: Giáo trình mở nêu rằng trừng phạt (đặc biệt là thân thể) có thể dạy trẻ sợ; chuyên gia ngày nay khuyên ưu tiên củng cố hơn trừng phạt; Skinner cũng cho rằng nên cân nhắc cái giá của trừng phạt.
  loai: loi-khuyen
- trang: thi-nghiem/skinner
  id: n44
  cau: Giáo trình mở lấy trả công theo số sản phẩm làm ví dụ của tỉ lệ cố định; chương trình tích điểm đổi quà có cấu trúc gần giống (phép so sánh của site).
  loai: loi-khuyen
- trang: thi-nghiem/skinner
  id: n45
  cau: Việc phần thưởng vật chất có làm mòn động lực nội tại hay không là tranh luận riêng; trang không đi sâu.
  loai: loi-khuyen
- trang: thi-nghiem/skinner
  id: n46
  cau: Tính đến 10/2026, chúng tôi chưa tìm thấy nghiên cứu nào trên người Việt về lịch trình củng cố trong phòng thí nghiệm.
  loai: thoi-su
- trang: thi-nghiem/skinner
  id: n47
  cau: Có một báo cáo năm 1967 tên "Operant conditioning in a Vietnamese mental hospital" (Cotter, American Journal of Psychiatry); chưa đọc nội dung nên không nêu kết quả.
  loai: thoi-su
- trang: thi-nghiem/skinner
  id: n48
  cau: 'Ngộ nhận "Củng cố âm tính là phạt": ví dụ tiếng "bíp" của dây an toàn dừng khi thắt dây là củng cố âm tính.'
  loai: dinh-nghia
- trang: thi-nghiem/skinner
  id: n49
  cau: Skinner áp dụng cách phân tích từ phòng thí nghiệm cho hành vi con người; Chomsky và tâm lý học nhận thức chỉ ra giới hạn, đặc biệt với ngôn ngữ.
  loai: phat-hien
- trang: thi-nghiem/skinner
  id: n50
  cau: "Quiz 1: chuột ấn cần nhận thức ăn rồi ấn nhiều hơn là củng cố dương tính (thêm một điều dễ chịu làm tăng hành vi)."
  loai: dinh-nghia
- trang: thi-nghiem/skinner
  id: n51
  cau: "Quiz 2: VR cho tốc độ cao, đều, khó tắt dần nhất; FI cho tốc độ vừa phải và dễ tắt dần nhất; củng cố liên tục giúp học nhanh."
  loai: phat-hien
- trang: thi-nghiem/skinner
  id: n52
  cau: 'Quiz 3: thí nghiệm 1948 cho thấy một động tác tình cờ trùng đúng lúc thức ăn xuất hiện có thể được lặp lại, thành "nghi lễ".'
  loai: phat-hien
- trang: thi-nghiem/skinner
  id: n53
  cau: "Quiz 4: củng cố âm tính loại bỏ điều khó chịu để làm tăng hành vi; trừng phạt làm giảm hành vi."
  loai: dinh-nghia
- trang: thi-nghiem/skinner
  id: n54
  cau: "Quiz 5: Chomsky (1959) cho rằng tuyên bố của Skinner về ngôn ngữ chưa có cơ sở; bài phê bình nhắm vào Verbal Behavior, không nhắm vào dữ liệu lịch trình."
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n1
  cau: Harry Harlow (1958) cho khỉ con chọn giữa "mẹ vải" mềm ấm và "mẹ sắt" bằng lưới thép; dù sữa ở mẹ nào, khỉ con dành phần lớn thời gian bám mẹ vải.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n2
  cau: Bài của Harlow (1958) là diễn văn của chủ tịch Hiệp hội Tâm lý học Hoa Kỳ (APA), đăng trên American Psychologist.
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n3
  cau: Harlow làm việc tại Đại học Wisconsin.
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n4
  cau: "Hộp hồ sơ: Harlow và Zimmermann (1959) ghi nhận khỉ mồ côi gắn bó mạnh và bền với mẹ giả."
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n5
  cau: 'Thí nghiệm "hai mẹ giả": mỗi khỉ con có một mẹ vải và một mẹ lưới thép, đặt trong hai ngăn gắn vào lồng.'
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n6
  cau: "Mẹ vải: khối gỗ bọc xốp, phủ vải bông, có bóng đèn phía sau phát nhiệt."
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n7
  cau: Mẹ lưới thép làm bằng lưới thép, cũng được sưởi ấm bằng nhiệt phát ra, chỉ khác mẹ vải ở chất lượng tiếp xúc.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n8
  cau: Mỗi mẹ có một "vú" ở ngực trên.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n9
  cau: Với 4 khỉ sơ sinh, mẹ vải cho sữa; với 4 khỉ còn lại, mẹ lưới thép cho sữa.
  loai: so-lieu
- trang: thi-nghiem/harlow
  id: n10
  cau: Thời gian trên mỗi mẹ được ghi tự động; khỉ con luôn được tự do rời khỏi tấm sưởi hay sàn để tới mẹ nào.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n11
  cau: Phòng thí nghiệm thường tách khỉ con khỏi mẹ 6–12 giờ sau sinh.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n12
  cau: Khỉ con đã có sẵn gắn bó với tấm vải lót chuồng, và có cơn giận dữ khi tấm vải bị lấy đi để vệ sinh.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n13
  cau: Dù sữa ở mẹ nào, khỉ con dành phần lớn thời gian bám vào mẹ vải.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n14
  cau: Với những khỉ bú mẹ lưới thép, thời gian trên mẹ lưới thép giảm dần theo tuổi còn thời gian trên mẹ vải tăng.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n15
  cau: Khi được cho thấy vật gây sợ như con gấu đồ chơi chuyển động, khỉ con ưa mẹ vải hơn rõ rệt, bất kể mẹ nào có sữa.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n16
  cau: Trong căn phòng lạ (6 × 6 × 6 feet), 4 trong 8 khỉ được thử, mỗi khỉ 3 phút, hai lần mỗi tuần trong 8 tuần.
  loai: so-lieu
- trang: thi-nghiem/harlow
  id: n17
  cau: Khi mẹ vải có mặt, khỉ con ôm mẹ rồi dùng mẹ làm "căn cứ" để khám phá và quay về; điểm cảm xúc tổng giảm một nửa.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n18
  cau: Khi mẹ vắng, khỉ con thường co rúm (freeze in a crouched position).
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n19
  cau: Bốn khỉ đối chứng chưa từng nuôi với mẹ giả có điểm cảm xúc khi mẹ vắng bằng nhóm thí nghiệm khi mẹ vắng.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n20
  cau: "Harlow kết luận: contact comfort là biến số có tầm quan trọng áp đảo trong hình thành phản ứng tình cảm, còn việc cho bú không đáng kể."
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n21
  cau: Harlow đề xuất chức năng chính của việc cho bú (như một biến số tình cảm) có lẽ là bảo đảm sự tiếp xúc cơ thể thường xuyên, thân mật giữa mẹ và con.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n22
  cau: Nhóm khỉ nuôi với một mẹ lưới thép hay một mẹ vải ăn lượng sữa và tăng cân như nhau.
  loai: so-lieu
- trang: thi-nghiem/harlow
  id: n23
  cau: Harlow, Dodsworth và Harlow (1965) nghiên cứu khỉ con trong cô lập xã hội hoàn toàn.
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n24
  cau: Kết quả của các nghiên cứu cô lập (sợ hãi cực độ, hành vi tự kích thích, không giao tiếp, không giao phối, con cái không chăm con) đã bỏ khỏi trang.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n25
  cau: Theo giáo trình mở, các thí nghiệm của Harlow ngày nay bị xem là phi đạo đức.
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n26
  cau: Vào những năm 1960–1970, Harlow làm các thí nghiệm nhằm gây trầm cảm ở khỉ để tìm cách chữa trầm cảm, bị chỉ trích dữ dội; một bài lịch sử gọi là "pit of despair".
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n27
  cau: '"IACUC, nguyên tắc 3R ra đời chính vì các thí nghiệm này": đã bỏ.'
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n28
  cau: Theo chuẩn mực ngày nay, nghiên cứu trên động vật phải qua hội đồng đạo đức và giảm thiểu đau đớn.
  loai: loi-khuyen
- trang: thi-nghiem/harlow
  id: n29
  cau: "Theo Harlow (1958), quan điểm phổ biến lúc đó: động cơ cơ bản là đói, khát...; tình yêu là động cơ phái sinh vì mẹ gắn với việc giảm đói và khát."
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n30
  cau: Harlow nghi ngờ quan niệm đó; ông cho rằng việc cho ăn là cơ chế không đủ để giải thích sự bền bỉ của gắn bó mẹ con.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n31
  cau: "Một giáo trình mở mô tả: Harlow (1958) kết luận gắn bó mẹ con không chỉ là dinh dưỡng; trước đó giới khoa học y học thường nghĩ trẻ gắn bó với người cho ăn."
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n32
  cau: Harlow gọi nhu cầu đó là "contact comfort".
  loai: dinh-nghia
- trang: thi-nghiem/harlow
  id: n33
  cau: "Khá vững: sự dễ chịu khi tiếp xúc quan trọng hơn việc cho bú trong gắn bó của khỉ con."
  loai: nhan
- trang: thi-nghiem/harlow
  id: n34
  cau: 'Khá vững: 4 trong 8 khỉ dùng mẹ vải làm "căn cứ" để khám phá phòng lạ; hình ảnh gần với "căn cứ an toàn" của Bowlby (theo OpenStax); Suomi và cộng sự (1976): khỉ có hành vi trầm cảm sau tách có thể trở lại hoạt động xã hội phù hợp tuổi nhờ tiếp xúc lặp lại với bạn cùng tuổi năng động.'
  loai: nhan
- trang: thi-nghiem/harlow
  id: n35
  cau: "Đang tranh cãi: suy rộng sang con người được bao xa."
  loai: nhan
- trang: thi-nghiem/harlow
  id: n36
  cau: Giáo trình mở mô tả Bowlby xây dựng thuyết gắn bó dựa trên công trình của Harlow và những người khác; gắn bó là sợi dây tình cảm giữa trẻ và mẹ; người chăm sóc là "căn cứ an toàn".
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n37
  cau: Mary Ainsworth nghiên cứu cách trẻ gắn bó khác nhau bằng "tình huống lạ" (strange situation).
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n38
  cau: Trong thí nghiệm 1958, bốn khỉ đối chứng chưa từng có mẹ giả được cho mẹ vải khi 250 ngày tuổi; sau 12–48 giờ khó chịu chúng dần tiếp xúc mẹ vải; thời gian bám mẹ vải tối đa chỉ khoảng một nửa nhóm nuôi từ đầu, Harlow lưu ý chưa biết có phải do kinh nghiệm sớm.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n39
  cau: Việc suy ra "bế ẵm trẻ sơ sinh không làm hư trẻ" là suy luận từ khỉ sang người, chưa được kiểm chứng ở trang này.
  loai: loi-khuyen
- trang: thi-nghiem/harlow
  id: n40
  cau: "Một cách đọc theo nghĩa bóng: mẹ vải mềm ấm được khỉ con chọn hơn mẹ lưới thép có sữa; không phải kết luận khoa học về các mối quan hệ của người."
  loai: loi-khuyen
- trang: thi-nghiem/harlow
  id: n41
  cau: Trong thuyết gắn bó (Bowlby, theo OpenStax), người chăm sóc là căn cứ an toàn để trẻ khám phá.
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n42
  cau: Đừng biến Harlow thành cớ để cực đoan ("bú bình là thiếu tình cảm", "mẹ đi làm là bỏ con"); dữ liệu nói về khỉ con và nhu cầu tiếp xúc.
  loai: loi-khuyen
- trang: thi-nghiem/harlow
  id: n43
  cau: Tính đến 10/2026, chúng tôi chưa tìm thấy nghiên cứu tương tự trên linh trưởng hay trên trẻ em Việt Nam.
  loai: thoi-su
- trang: thi-nghiem/harlow
  id: n44
  cau: Quan sát văn hóa về cách chăm trẻ truyền thống của Việt Nam (bế ẵm nhiều, ru ngủ, ngủ chung) và khoảng trống nghiên cứu ở các cơ sở chăm sóc trẻ mồ côi, khuyết tật.
  loai: thoi-su
- trang: thi-nghiem/harlow
  id: n45
  cau: Harlow (1958) viết rằng tình cảm của khỉ con với mẹ thật và mẹ vải "có vẻ rất giống nhau", dựa trên quan sát hai khỉ con do mẹ thật nuôi, và hy vọng kiểm tra chắc chắn vào năm sau.
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n46
  cau: Harlow cho rằng sẽ còn các biến số khác quan trọng (nâng đỡ tư thế, chuyển động đung đưa, âm thanh, thị giác).
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n47
  cau: "Quiz 1: Harlow loại trừ khả năng khỉ chỉ bám bên có sữa bằng cách chia 8 khỉ con thành hai nhóm: 4 bú mẹ vải, 4 bú mẹ lưới thép; kết quả hai nhóm tương tự."
  loai: so-lieu
- trang: thi-nghiem/harlow
  id: n48
  cau: "Quiz 2: khỉ con dành phần lớn thời gian bên mẹ vải bất kể sữa ở mẹ nào; thời gian trên mẹ lưới thép giảm dần theo tuổi với những khỉ bú mẹ lưới thép."
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n49
  cau: "Quiz 3: khi bị làm sợ, khỉ con ưa mẹ vải hơn rõ rệt, kể cả khi sữa ở mẹ lưới thép."
  loai: phat-hien
- trang: thi-nghiem/harlow
  id: n50
  cau: 'Quiz 4: "contact comfort" là biến số tình cảm quan trọng áp đảo, còn việc cho bú là không đáng kể.'
  loai: dinh-nghia
- trang: thi-nghiem/harlow
  id: n51
  cau: "Quiz 5: giáo trình mở nói các thí nghiệm của Harlow ngày nay bị xem là phi đạo đức; công trình sau này (cô lập hoàn toàn, thí nghiệm gây trầm cảm) bị chỉ trích dữ dội."
  loai: lich-su
- trang: thi-nghiem/harlow
  id: n52
  cau: 'Hình "harlow-contact" (biểu đồ cột, đã sửa): số giờ trung bình mỗi ngày trên hai mẹ giả lúc 21–25 ngày tuổi, hai nhóm 4 khỉ (sữa ở mẹ vải; sữa ở mẹ lưới thép); "dù sữa ở mẹ nào, khỉ con ở trên mẹ vải phần lớn thời gian trong ngày"; số đọc gần đúng từ Hình 5 của Harlow (1958).'
  loai: so-lieu
- trang: thi-nghiem/harlow
  id: n56
  cau: "Hình harlow-contact: nhóm có sữa ở mẹ vải, lúc 21–25 ngày tuổi, ở trên mẹ vải khoảng 19 giờ mỗi ngày."
  loai: so-lieu
- trang: thi-nghiem/harlow
  id: n57
  cau: "Hình harlow-contact: nhóm có sữa ở mẹ vải ở trên mẹ lưới thép dưới 1 giờ mỗi ngày."
  loai: so-lieu
- trang: thi-nghiem/harlow
  id: n58
  cau: "Hình harlow-contact: nhóm có sữa ở mẹ lưới thép, lúc 21–25 ngày tuổi, ở trên mẹ vải khoảng 16 giờ mỗi ngày."
  loai: so-lieu
- trang: thi-nghiem/harlow
  id: n59
  cau: "Hình harlow-contact: nhóm có sữa ở mẹ lưới thép, lúc 21–25 ngày tuổi, ở trên mẹ lưới thép khoảng 2 giờ mỗi ngày."
  loai: so-lieu
- trang: thi-nghiem/harlow
  id: n60
  cau: "Hình harlow-contact: mỗi nhóm 4 khỉ."
  loai: so-lieu
- trang: thi-nghiem/bandura
  id: n1
  cau: Bandura, Ross & Ross (1961) cho trẻ xem người lớn đánh búp bê Bobo; trẻ bắt chước gây hấn nhiều hơn hẳn nhóm xem người lớn chơi hiền lành và nhóm không xem gì.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n2
  cau: Búp bê trong thí nghiệm là búp bê bơm hơi cao khoảng 1,5 mét (Bobo).
  loai: so-lieu
- trang: thi-nghiem/bandura
  id: n3
  cau: "Hầu hết trẻ xem mẫu gây hấn thực hiện các hành vi gây hấn lạ của người mẫu: ngồi lên búp bê rồi đấm vào mũi, đập búa lên đầu, tung lên và đá, và lặp lại những câu người lớn hét."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n4
  cau: Trẻ xem mẫu hiền lành và trẻ không xem gì hầu như không làm những hành vi bắt chước ấy.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n5
  cau: "Trẻ học những hành vi ấy chỉ bằng cách nhìn: không ai thưởng hay phạt người mẫu hay trẻ."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n6
  cau: Đầu những năm 1960, nhiều nghiên cứu về học xã hội tập trung vào việc định hình hành vi bằng thưởng và phạt.
  loai: lich-su
- trang: thi-nghiem/bandura
  id: n7
  cau: Albert Bandura là nhà nghiên cứu tại Đại học Stanford và cho rằng hành vi mới còn có thể được học bằng quan sát.
  loai: lich-su
- trang: thi-nghiem/bandura
  id: n8
  cau: "Thí nghiệm Bobo là một trong những minh chứng nổi tiếng nhất cho học quan sát và gắn với câu hỏi còn tranh luận: trẻ bắt chước người lớn đánh búp bê thì có bắt chước bạo lực trên màn hình thành bạo lực thật không."
  loai: lich-su
- trang: thi-nghiem/bandura
  id: n9
  cau: 72 trẻ (36 trai, 36 gái) từ 37 đến 69 tháng tuổi, trung bình 52 tháng, ở trường mầm non của Đại học Stanford.
  loai: so-lieu
- trang: thi-nghiem/bandura
  id: n10
  cau: "Có ba nhóm, mỗi nhóm 24 trẻ: xem người lớn gây hấn, xem người lớn chơi hiền lành, và không xem gì (đối chứng)."
  loai: so-lieu
- trang: thi-nghiem/bandura
  id: n11
  cau: Người mẫu hiền lành lắp ráp đồ chơi, không động đến búp bê; người mẫu gây hấn lắp ráp khoảng một phút rồi dành thời gian còn lại gây hấn với búp bê, vừa làm vừa la những câu như "Sock him in the nose".
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n12
  cau: Trẻ được ghép theo mức gây hấn do giáo viên đánh giá từ trước rồi chia ngẫu nhiên vào các nhóm.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n13
  cau: Ở mỗi nhóm có mẫu, một nửa trẻ xem mẫu cùng giới, một nửa xem mẫu khác giới.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n14
  cau: Lúc xem, trẻ làm tranh dán ở một góc phòng, người mẫu chơi ở góc đối diện trong 10 phút.
  loai: so-lieu
- trang: thi-nghiem/bandura
  id: n15
  cau: 'Sau lần xem (hay không xem), mọi trẻ đều bị "gây bực" nhẹ: được cho chơi đồ chơi hấp dẫn rồi bị bảo đó là đồ chơi tốt nhất, để dành cho trẻ khác.'
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n16
  cau: Mục đích bước này là để mọi trẻ ở trong tình huống bị kích động gây hấn nhẹ.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n17
  cau: Mỗi trẻ ở 20 phút trong phòng có búp bê Bobo, búa gỗ, súng phóng phi tiêu và nhiều đồ chơi không gây hấn; một nữ nhà nghiên cứu ngồi làm giấy tờ ở góc phòng.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n18
  cau: Quan sát viên ghi hành vi qua kính một chiều theo từng khoảng 5 giây; một người chấm cho cả 72 trẻ, người thứ hai chấm độc lập một nửa số trẻ; hệ số tương quan giữa hai người chấm nằm trong khoảng 0,90.
  loai: so-lieu
- trang: thi-nghiem/bandura
  id: n19
  cau: Vì trẻ xem mẫu gây hấn làm những hành vi đặc trưng, người chấm khó mà không đoán được nhóm của trẻ.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n20
  cau: Trẻ xem mẫu gây hấn bắt chước hành vi và lời nói gây hấn nhiều hơn hẳn hai nhóm còn lại; khác biệt có ý nghĩa thống kê.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n21
  cau: Khoảng một phần ba trẻ xem mẫu gây hấn cũng nhắc lại các câu không gây hấn của mẫu, trong khi không trẻ nào ở hai nhóm kia làm vậy.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n22
  cau: Trong nhóm xem mẫu gây hấn, bé trai bắt chước gây hấn thể chất nhiều hơn bé gái (t = 2,50, p < 0,01), còn lời nói gây hấn thì hai giới không khác nhau.
  loai: so-lieu
- trang: thi-nghiem/bandura
  id: n23
  cau: 'Giả thuyết "trẻ bắt chước mẫu cùng giới nhiều hơn" chỉ được ủng hộ một phần: ảnh hưởng của mẫu nam rõ hơn mẫu nữ.'
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n24
  cau: Bé trai xem mẫu nam gây hấn thể chất và lời nói nhiều hơn bé gái xem mẫu nam; ở nhóm xem mẫu nữ, các chênh lệch không đạt ý nghĩa thống kê (mỗi ô chỉ có 6 trẻ).
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n25
  cau: Nhóm xem mẫu hiền lành và nhóm đối chứng nhìn chung không khác nhau; riêng trẻ xem mẫu hiền lành là nam ít gây hấn hơn nhóm đối chứng trên vài thước đo, nhưng đó là so sánh nhóm con mà các tác giả lưu ý dễ do ngẫu nhiên.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n26
  cau: "Năm 1963, nhóm Bandura thử với 96 trẻ (48 trai, 48 gái), mỗi nhóm 24 trẻ, chia bốn nhóm: xem người thật gây hấn, xem chính những người đó gây hấn trên phim, xem nhân vật hoạt hình gây hấn trên phim, và nhóm đối chứng."
  loai: so-lieu
- trang: thi-nghiem/bandura
  id: n27
  cau: Cả ba nhóm xem mẫu gây hấn nhiều hơn nhóm đối chứng (nhóm xem phim và phim hoạt hình gần gấp đôi); mức bắt chước không khác đáng kể giữa người thật và phim người thật.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n28
  cau: Nghiên cứu năm 1963 nối thí nghiệm Bobo với câu hỏi về bạo lực trên màn hình.
  loai: lich-su
- trang: thi-nghiem/bandura
  id: n29
  cau: Năm 1965, trẻ xem người mẫu gây hấn được thưởng hay bị phạt vì hành vi ấy, rồi có cơ hội tái hiện.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n30
  cau: Thưởng phạt dành cho mẫu ảnh hưởng đến việc trẻ thể hiện hành vi; thưởng ngay lúc quan sát không cần thiết để trẻ học hành vi mới.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n31
  cau: Theo tóm tắt, hiệu ứng của thưởng phạt mẫu chủ yếu đến từ sự khác nhau giữa các nhóm bé gái.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n32
  cau: Hình phạt dành cho mẫu ảnh hưởng chủ yếu đến việc trẻ thể hiện hành vi đã học, không quyết định việc học.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n33
  cau: "Khá vững: con người, kể cả trẻ nhỏ, có thể học hành vi mới chỉ bằng quan sát, không cần tự mình được thưởng hay phạt."
  loai: nhan
- trang: thi-nghiem/bandura
  id: n34
  cau: "Khá vững: bé trai bắt chước gây hấn thể chất nhiều hơn bé gái, và mẫu nam có ảnh hưởng rõ hơn mẫu nữ."
  loai: nhan
- trang: thi-nghiem/bandura
  id: n35
  cau: "Đang tranh cãi: từ kết quả có suy ra được bạo lực truyền thông gây bạo lực thật không."
  loai: nhan
- trang: thi-nghiem/bandura
  id: n36
  cau: "Anderson và cộng sự (2010): phân tích tổng hợp về trò chơi điện tử bạo lực, so sánh Nhật Bản với các nước phương Tây, kết luận đó là yếu tố nguy cơ nhân quả làm tăng hành vi, nhận thức và cảm xúc gây hấn, và ít thấy dấu hiệu thiên lệch xuất bản."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n37
  cau: "Ferguson và Kilburn (2010) phản biện: phân tích ấy gộp nhiều nghiên cứu không liên quan tới gây hấn nghiêm trọng, một mẫu nghiên cứu chưa công bố dường như thiên lệch, và dựa vào thước đo gây hấn không chuẩn hóa làm phồng hiệu ứng; ước lượng r = 0,15 vẫn chỉ là hiệu ứng yếu."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n38
  cau: Cả hai bài bàn về trò chơi điện tử, không phải về thí nghiệm Bobo; thí nghiệm Bobo cho thấy trẻ có thể học hành vi gây hấn từ quan sát, còn tác động lên bạo lực ngoài đời là câu hỏi riêng, còn tranh luận.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n39
  cau: "Bốn bước của việc học theo mẫu (Bandura mô tả, theo OpenStax): chú ý, ghi nhớ, tái hiện, động cơ; theo giáo trình, đó là các bước phải có thì việc học theo mẫu mới thành công."
  loai: dinh-nghia
- trang: thi-nghiem/bandura
  id: n40
  cau: Bandura và cộng sự cho rằng việc bắt chước có thể đi tắt việc củng cố từng bước.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n41
  cau: "Củng cố gián tiếp: thấy người khác được thưởng thì muốn làm theo, thấy bị phạt thì dè chừng, nhưng dè chừng không có nghĩa là không học."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n42
  cau: Các tác giả giả thuyết rằng gây hấn là hành vi "nam tính" hơn nên bé trai dễ bắt chước hơn, nhất là từ mẫu nam; thí nghiệm chỉ ủng hộ một phần.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n43
  cau: Thí nghiệm cho thấy trẻ có thể tái hiện hành vi của người lớn khi không ai thưởng hay bảo làm theo; nếu người lớn quát tháo, trẻ có thể học theo điều thấy.
  loai: loi-khuyen
- trang: thi-nghiem/bandura
  id: n44
  cau: Mẫu trên phim cũng làm tăng gây hấn ở trẻ trong phòng thí nghiệm (1963), nên nên để ý những "người mẫu" của con.
  loai: loi-khuyen
- trang: thi-nghiem/bandura
  id: n45
  cau: Trẻ xem người lớn chơi hiền lành không gây hấn nhiều hơn trẻ không xem gì (có thể ít hơn khi mẫu là nam); cho trẻ thấy người lớn xử lý bực bội bình tĩnh là một cách dạy khả dĩ, nhưng thí nghiệm không đo trực tiếp điều đó.
  loai: loi-khuyen
- trang: thi-nghiem/bandura
  id: n46
  cau: Vì trẻ có thể học từ mẫu trên phim, chọn nội dung và trò chuyện cùng trẻ về những gì chúng xem là hợp lý; thí nghiệm không cho biết tác động lên hành vi ngoài đời.
  loai: loi-khuyen
- trang: thi-nghiem/bandura
  id: n47
  cau: Tính đến 10/2026, chúng tôi chưa tìm thấy bản lặp lại thí nghiệm Bobo trên trẻ em Việt Nam, và cũng chưa tìm thấy dữ liệu thực nghiệm về mức độ trẻ Việt bắt chước hành vi gây hấn từ người mẫu.
  loai: thoi-su
- trang: thi-nghiem/bandura
  id: n48
  cau: Anderson và cộng sự (2010) so sánh Nhật Bản với các nước phương Tây và không báo cáo riêng mẫu Việt Nam.
  loai: thoi-su
- trang: thi-nghiem/bandura
  id: n49
  cau: Việc áp dụng kết luận của phân tích tổng hợp vào bối cảnh Việt Nam cần thận trọng và cần nghiên cứu trong nước.
  loai: loi-khuyen
- trang: thi-nghiem/bandura
  id: n50
  cau: "Thí nghiệm không chứng minh xem phim bạo lực sẽ thành người bạo lực: nó cho thấy trẻ có thể học hành vi gây hấn qua quan sát trong phòng thí nghiệm; khoảng cách tới bạo lực thật đang được tranh luận."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n51
  cau: Bài báo cho biết trẻ có thể đấm búp bê Bobo dù không xem mẫu nào, nên các tác giả chỉ tính là bắt chước những hành vi lạ; việc đấm búp bê nói chung không khác nhau giữa các nhóm.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n52
  cau: Chính bài báo nêu rằng việc thấy người lớn gây hấn có thể báo hiệu rằng gây hấn được phép, làm yếu sự kìm nén; nhưng trẻ lặp lại cả những cử chỉ lạ của mẫu, cho thấy có học theo mẫu.
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n53
  cau: Bandura "chủ trương cấm trẻ xem mọi thứ bạo lực" (câu ngộ nhận cũ).
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n54
  cau: "Quiz, câu 1: 72 trẻ (36 trai, 36 gái, tuổi mẫu giáo), ba nhóm: xem mẫu gây hấn, mẫu hiền lành, đối chứng không xem gì."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n55
  cau: "Quiz, câu 2: mọi trẻ được kích động gây hấn nhẹ trước khi thử; bài báo nêu hai lý do: xem người khác gây hấn có thể làm người xem bớt muốn gây hấn, và nếu nhóm xem mẫu hiền lành vẫn ít gây hấn dù bị kích động thì gợi ý có sự kìm nén."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n56
  cau: "Quiz, câu 3: bé trai bắt chước gây hấn thể chất nhiều hơn bé gái, ảnh hưởng của mẫu nam rõ hơn mẫu nữ; giả thuyết mẫu cùng giới chỉ được ủng hộ một phần."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n57
  cau: "Quiz, câu 4: thưởng phạt dành cho mẫu ảnh hưởng chủ yếu đến việc thể hiện; thưởng ngay lúc quan sát không cần thiết để học hành vi mới; trẻ thấy mẫu bị phạt có thể vẫn tiếp thu hành vi dù không thể hiện."
  loai: phat-hien
- trang: thi-nghiem/bandura
  id: n58
  cau: "Quiz, câu 5: muốn con bớt quát tháo, cha mẹ tập bình tĩnh khi bực trước mặt con; phạt chủ yếu ảnh hưởng việc thể hiện hơn việc học; đây là suy ra từ cơ chế, thí nghiệm không thử cách dạy con."
  loai: loi-khuyen
- trang: thi-nghiem/little-albert
  id: n1
  cau: Watson và Rayner (1920) báo cáo đã điều kiện hóa nỗi sợ chuột trắng ở một bé trai 11 tháng tuổi bằng cách ghép chuột với tiếng động lớn, và không gỡ nỗi sợ ấy trước khi bé rời bệnh viện.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n2
  cau: Một phân tích đoạn phim năm 2021 cho rằng bằng chứng điều kiện hóa yếu hơn giáo trình vẫn kể.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n3
  cau: Bé trai 11 tháng tuổi, khỏe mạnh, tính tình bình thản, chẳng sợ gì; cứ mỗi lần đưa tay chạm vào con chuột thì thanh thép bị đập mạnh ngay sau lưng; bé giật mình, ngã người về phía trước.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n4
  cau: "Đáp án nhanh: sau 2 lần ghép đôi Albert có phản ứng né chuột nhẹ; một tuần sau, thêm 5 lần ghép đôi (tổng cộng 7), bé khóc và bò đi xa ngay khi thấy chuột, không cần tiếng động."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n5
  cau: Phản ứng né lan sang thỏ, chó, áo lông hải cẩu và mặt nạ ông già Noel.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n6
  cau: Họ không có dịp gỡ nỗi sợ ấy vì Albert rời bệnh viện.
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n7
  cau: Phân tích đoạn phim năm 2021 cho rằng quy trình điều kiện hóa phần lớn không hiệu quả; dấu hiệu khó chịu yếu của bé có thể giải thích bằng nhạy cảm hóa và sự trưởng thành.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n8
  cau: Thí nghiệm của Watson và Rayner là một nỗ lực thực nghiệm sớm nhằm kiểm tra giả thuyết rằng cảm xúc sợ hãi có thể được điều kiện hóa ở người; giả thuyết đã được họ và Morgan nêu từ 1917 mà thiếu bằng chứng thực nghiệm đủ.
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n9
  cau: "Mô hình điều kiện hóa cổ điển: chuột trắng (kích thích trung tính) ghép với tiếng động lớn (không điều kiện) gây giật mình; sau các lần ghép đôi, chuột một mình gây phản ứng sợ (kích thích có điều kiện)."
  loai: dinh-nghia
- trang: thi-nghiem/little-albert
  id: n10
  cau: Bài báo là một trong những nghiên cứu được trích dẫn nhiều nhất trong tâm lý học, thường được trình bày như bằng chứng cho vai trò của điều kiện hóa cổ điển trong sự hình thành nỗi sợ.
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n11
  cau: Bé rời bệnh viện mà nỗi sợ chưa được gỡ; chính các tác giả viết rằng họ do dự vì việc gây sợ thực nghiệm "mang một trách nhiệm nhất định".
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n12
  cau: '"Albert B." là con của một vú nuôi tại Harriet Lane Home for Invalid Children, được nuôi gần như từ lúc mới sinh trong môi trường bệnh viện.'
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n13
  cau: Bài báo mô tả bé khỏe mạnh từ lúc sinh, phát triển tốt, tính tình điềm tĩnh, ít biểu lộ cảm xúc; sự ổn định là một lý do chọn bé, và các tác giả cho rằng có thể gây tương đối ít hại.
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n14
  cau: Ở khoảng 9 tháng tuổi, Albert được cho xem lần lượt, đột ngột và lần đầu chuột trắng, thỏ, chó, khỉ, mặt nạ có và không có tóc, bông gòn, giấy báo đang cháy; bé không lần nào tỏ ra sợ, phản ứng thường gặp là sờ, nghịch.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n15
  cau: "Lúc 8 tháng 26 ngày, bé được thử với tiếng búa đập thanh thép treo sau lưng: giật mình mạnh, thở ngừng, môi run, và khóc ở lần đập thứ ba."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n16
  cau: Trước khi điều kiện hóa, lúc 11 tháng 3 ngày, các thử nghiệm cảm xúc thông thường vẫn không thấy dấu hiệu sợ.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n17
  cau: "Buổi 1 (11 tháng 3 ngày): 2 lần ghép đôi chuột và tiếng động; lần đầu bé giật mình và ngã về phía trước, không khóc; lần hai giật mình và bắt đầu rên rỉ."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n18
  cau: "Buổi 2 (11 tháng 10 ngày, một tuần sau): chuột đưa ra không kèm tiếng động thì bé rụt tay lại khi chuột chạm tay."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n19
  cau: Ở buổi 2, thêm 5 lần ghép đôi (tổng cộng 7); khi chuột đưa ra một mình bé khóc ngay, quay người, ngã sang bên và bò đi nhanh đến mức phải chạy theo mới bắt kịp.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n20
  cau: "Buổi 3 (11 tháng 15 ngày, năm ngày sau): bé vẫn né chuột và chơi khối gỗ bình thường; thỏ gây phản ứng rõ rệt; chó nhẹ hơn thỏ nhưng bé khóc khi chó lại gần đầu; áo lông hải cẩu làm bé khóc và cố bò đi; bông gòn nhẹ hơn; tóc của Watson và mặt nạ ông già Noel bị né, tóc hai người quan sát khác thì bé chơi."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n21
  cau: Những vật ở buổi 3 (thỏ, chó, áo lông, tóc, mặt nạ) chưa từng đi kèm tiếng động.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n22
  cau: 'Buổi 4 (11 tháng 20 ngày): phản ứng với chuột yếu hơn nên các tác giả ghép đôi chuột với tiếng động để "làm mới"; lần đầu thỏ và chó cũng được ghép trực tiếp với tiếng động; sau đó bé được chuyển sang phòng giảng lớn, sáng hơn, có bốn người, và phản ứng với chuột và thỏ yếu hơn.'
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n23
  cau: "Sự cố ngoài kịch bản ở buổi 4: con chó vốn im lặng bỗng sủa ba lần sát mặt bé làm bé òa khóc, và làm cả người lớn có mặt giật mình."
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n24
  cau: "Buổi 5 (1 tuổi 21 ngày, 31 ngày sau; suốt thời gian ấy bé ở nhà trẻ bệnh viện và không có thử nghiệm cảm xúc): phản ứng yếu đi phần nào nhưng bé vẫn né mặt nạ, áo lông, thỏ, chó; với chuột thì rụt tay, nhăn mặt, che mắt khi chuột bò lên ngực."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n25
  cau: Chính ngày kiểm tra cuối cùng Albert rời bệnh viện, không có giải điều kiện hóa nào.
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n26
  cau: "Câu hỏi thứ tư của bài: nếu phản ứng sợ không tự mất đi sau một thời gian hợp lý, có thể nghĩ ra phương pháp phòng thí nghiệm nào để gỡ bỏ."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n27
  cau: Watson và Rayner viết rằng các phản ứng này có thể tồn tại lâu dài nếu không có cách gỡ, và tự nhận quan điểm ấy "có lẽ chưa có cơ sở vững".
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n28
  cau: Mary Cover Jones làm việc với sự cố vấn của Watson, gặp Peter, 2 tuổi 10 tháng, sợ chuột trắng, nỗi sợ lan sang thỏ, áo lông, lông vũ, bông gòn, khoảng ba năm sau Albert.
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n29
  cau: 'Jones gỡ nỗi sợ thỏ bằng nhiều cách: Peter chơi cùng ba trẻ không sợ thỏ; sau khi Peter nằm viện hai tháng và sợ trở lại, bà thêm "điều kiện hóa trực tiếp" (cho ăn món ưa thích trong khi thỏ trong lồng được đưa lại gần từng chút).'
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n30
  cau: Cuối cùng Peter vuốt, bế thỏ; nỗi sợ bông gòn, áo lông, lông vũ không còn; Jones nhấn mạnh nghiên cứu còn dang dở.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n31
  cau: Mary Cover Jones báo cáo một ca; chữ cũ cho rằng đó là "tiền thân của liệu pháp phơi nhiễm" và "minh chứng khoa học có thể tạo ra kiến thức mà không cần gây tổn thương vĩnh viễn".
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n32
  cau: 'Khoảng ba năm sau Albert, Jones làm điều Watson và Rayner không thử: gỡ nỗi sợ ở một đứa trẻ, nối tiếp ca Albert ("continue where Watson had left off").'
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n33
  cau: "Vững chắc: nỗi sợ có thể được điều kiện hóa ở người."
  loai: nhan
- trang: thi-nghiem/little-albert
  id: n34
  cau: "Duits và cộng sự (2015): phân tích tổng hợp 44 nghiên cứu (963 bệnh nhân rối loạn lo âu, 1.222 người đối chứng); các quá trình tắt dần của nỗi sợ được cho là nền tảng của hiệu quả điều trị phơi nhiễm."
  loai: so-lieu
- trang: thi-nghiem/little-albert
  id: n35
  cau: "Khung ghi chú: Watson và Rayner không gỡ nỗi sợ ở Albert: bé rời bệnh viện trước khi họ thử."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n36
  cau: "Đang tranh cãi: Albert có thật sự học sợ, và nỗi sợ có lan sang các vật khác không."
  loai: nhan
- trang: thi-nghiem/little-albert
  id: n37
  cau: 'Powell và Schmaltz (2021): chúng ta dễ thấy "điều kiện hóa" trong đoạn phim vì kỳ vọng.'
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n38
  cau: "Beck, Levinson và Irons (2009): một nhân viên của Harriet Lane Home là mẹ của Albert; qua liên lạc với con cháu bà, họ cho rằng Albert là Douglas Merritte (1919–1925), qua đời sớm vì não úng thủy."
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n39
  cau: Fridlund và cộng sự (2012) cho rằng Douglas có tổn thương thần kinh mà Watson có thể đã biết và che giấu.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n40
  cau: Powell, Digdon, Harris và Smithson (2014) cho rằng ứng viên phù hợp hơn là Albert Barger và bình luận về cáo buộc gian lận của Watson.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n41
  cau: Tính đến 10/2026, trong các nguồn chúng tôi tra được, chưa thấy công trình nào làm tranh luận về danh tính Albert ngã ngũ.
  loai: thoi-su
- trang: thi-nghiem/little-albert
  id: n42
  cau: Khung tranh cãi cho Danh tính Albert.
  loai: nhan
- trang: thi-nghiem/little-albert
  id: n43
  cau: "Điều kiện hóa cổ điển (Pavlov → Watson): nỗi sợ là phản ứng có thể được học bằng cách ghép kích thích trung tính với kích thích gây sợ; Watson và Rayner trình bày Albert như ví dụ, bằng chứng từ Albert bị phản biện."
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n44
  cau: Watson và Rayner ghi nhận bé né thỏ, chó, áo lông và mặt nạ dù ban đầu chưa đi kèm tiếng động, và gọi đó là chuyển (transfer) của phản ứng; Powell và Schmaltz cho rằng bằng chứng từ đoạn phim yếu.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n45
  cau: 'Jones gọi một cách của bà là "điều kiện hóa trực tiếp": cho trẻ ăn món ưa thích mỗi khi con vật được đưa ra, để nỗi sợ giảm dần.'
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n46
  cau: "Thuyết hai yếu tố của Mowrer (1951): nỗi sợ được học qua điều kiện hóa cổ điển (yếu tố thứ nhất), rồi hành vi né tránh được củng cố vì nó làm giảm nỗi sợ (yếu tố thứ hai); tổng quan của Krypotos và cộng sự (2015) kể lại thuyết này và nêu nhiều kết quả thí nghiệm mà nó không giải thích được."
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n47
  cau: Jones lưu ý nỗi sợ của Peter có lẽ không phải nỗi sợ điều kiện hóa trực tiếp, và nguồn gốc của nó không rõ.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n48
  cau: Nếu một nỗi sợ ở trẻ kéo dài hoặc làm ảnh hưởng sinh hoạt, xem trang Hỗ trợ; trang không chẩn đoán hay hướng dẫn điều trị.
  loai: loi-khuyen
- trang: thi-nghiem/little-albert
  id: n49
  cau: "Liệu pháp phơi nhiễm: các quá trình tắt dần của nỗi sợ điều kiện hóa được cho là nền tảng của liệu pháp phơi nhiễm; đó là liệu pháp do chuyên gia thực hiện, trang không hướng dẫn tự làm."
  loai: lam-sang
- trang: thi-nghiem/little-albert
  id: n50
  cau: Cơ chế quảng cáo ghép sản phẩm với âm nhạc vui, gương mặt nổi tiếng (như ghép đôi kiểu Watson).
  loai: loi-khuyen
- trang: thi-nghiem/little-albert
  id: n51
  cau: Tính đến 10/2026, chúng tôi chưa tìm thấy nghiên cứu điều kiện hóa nỗi sợ trên trẻ sơ sinh người Việt.
  loai: thoi-su
- trang: thi-nghiem/little-albert
  id: n52
  cau: 'Chữ cũ về đạo đức và suy luận cho Việt Nam: "theo chuẩn đạo đức hiện nay, nghiên cứu như vậy sẽ không bao giờ được hội đồng đạo đức nào phê duyệt"; "cơ chế điều kiện hóa sợ hãi là phổ quát, nên bài học dọa ma, dọa bác sĩ, ông kẹ ... đều áp dụng được".'
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n53
  cau: "Theo báo cáo, Albert không vốn đã sợ động vật: ở các buổi trước điều kiện hóa (khoảng 9 tháng và 11 tháng 3 ngày) bé không tỏ ra sợ các con vật được đưa ra; phản ứng thường gặp là sờ, nghịch."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n54
  cau: Albert rời bệnh viện đúng ngày kiểm tra cuối cùng; không giải điều kiện hóa nào được thực hiện; Watson và Rayner đặt ra câu hỏi gỡ nỗi sợ trong bài.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n55
  cau: Giả thuyết Douglas Merritte (Beck 2009) bị phản bác bởi giả thuyết Albert Barger (Powell 2014); tính đến 10/2026, chưa thấy ngã ngũ.
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n56
  cau: "Thí nghiệm không thể cho thấy mọi nỗi sợ đều do học: một trẻ, không đối chứng; phân tích đoạn phim 2021 nghi ngờ điều kiện hóa rõ rệt; Jones lưu ý nỗi sợ của Peter có lẽ không điều kiện hóa trực tiếp."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n57
  cau: 'Nỗi sợ theo Albert suốt đời: chưa có bằng chứng chắc chắn trong các nguồn đã mở; Watson và Rayner cho là có thể tồn tại lâu dài nhưng tự nhận quan điểm "có lẽ chưa có cơ sở vững"; Powell và cộng sự (2014) trình bày bằng chứng về việc Albert Barger có lớn lên với nỗi sợ động vật có lông hay không, chưa đọc phần này.'
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n58
  cau: "Quiz, câu 1: trước điều kiện hóa, Albert không tỏ ra sợ các con vật; chỉ tiếng búa đập mới gây giật mình và khóc."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n59
  cau: "Quiz, câu 2: Watson và Rayner tạo tiếng động bằng búa đập vào thanh thép treo sau đầu Albert khi bé chạm vào chuột; tiếng chó sủa chỉ là sự cố ngoài kịch bản ở buổi sau."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n60
  cau: "Quiz, câu 3: Albert còn né thỏ, chó, áo lông hải cẩu, mặt nạ ông già Noel, ở buổi đầu chưa đi kèm tiếng động; bé vẫn chơi khối gỗ bình thường; phân tích 2021 cho rằng bằng chứng yếu."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n61
  cau: "Quiz, câu 4: Albert rời bệnh viện đúng ngày kiểm tra cuối cùng nên Watson và Rayner không có dịp gỡ nỗi sợ; khoảng ba năm sau Jones báo cáo gỡ nỗi sợ thỏ ở Peter (một ca, còn dang dở)."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n62
  cau: "Quiz, câu 5: tính đến 10/2026 danh tính còn đang tranh cãi: Beck và cộng sự 2009 (Merritte), Powell và cộng sự 2014 (Barger)."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n1
  cau: Schachter và Singer (1962) tiêm adrenaline cho người tham gia rồi cho họ ngồi cùng một diễn viên vui vẻ hoặc giận dữ.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n2
  cau: "Lý thuyết hai nhân tố: trạng thái cảm xúc là hàm của kích thích sinh lý và một nhận thức phù hợp với kích thích ấy."
  loai: dinh-nghia
- trang: thi-nghiem/schachter-singer
  id: n3
  cau: 'Thí nghiệm được dựng dưới vỏ bọc "tác dụng của vitamin lên thị lực": người tham gia được tiêm "vitamin Suproxin".'
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n4
  cau: Người tham gia chờ 20 phút để thuốc ngấm.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n5
  cau: Epinephrine gây tim đập nhanh (palpitation), run tay (tremor) và đôi khi cảm giác nóng bừng mặt.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n6
  cau: Diễn viên vui vẻ gấp máy bay giấy, chơi "bóng rổ" bằng giấy vo viên vào sọt rác, xoay vòng hula hoop.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n7
  cau: 'Trong thí nghiệm thật, những người không được giải thích đúng về mũi tiêm có xu hướng "bắt" cảm xúc của người ngồi cùng: vui theo người vui, giận theo người giận.'
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n8
  cau: Những người được báo trước "thuốc sẽ làm tim đập nhanh" ít bị cuốn theo cảm xúc của diễn viên hơn hẳn.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n9
  cau: "Hai tác giả đề xuất: cảm xúc gồm kích thích sinh lý và cái nhãn nhận thức mà não gắn lên nó."
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n10
  cau: Các nghiên cứu sau chỉ ủng hộ một phần đề xuất hai nhân tố.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n11
  cau: 'Schachter và Singer đặt câu hỏi: nếu cơ thể đã "báo động" mà người ta chưa biết vì sao, họ sẽ làm gì, và họ dựa vào hoàn cảnh để gọi tên cảm xúc.'
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n12
  cau: Hai tác giả hình dung tim đập nhanh giữa buổi tiệc vui là "phấn khích" và trong con hẻm tối là "sợ hãi".
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n13
  cau: 184 nam sinh viên đồng ý được tiêm.
  loai: so-lieu
- trang: thi-nghiem/schachter-singer
  id: n14
  cau: Người tham gia đều là nam sinh viên các lớp nhập môn tâm lý học ở Đại học Minnesota.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n15
  cau: Người tham gia được tiêm epinephrine hoặc giả dược (nước muối).
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n16
  cau: "Nhóm tiêm adrenaline được chia ba: được báo đúng, không được báo gì, bị báo sai."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n17
  cau: Nhóm được báo đúng được nói rằng thuốc sẽ làm tim đập nhanh, run tay, mặt nóng.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n18
  cau: Nhóm bị báo sai được nói thuốc gây tê chân, ngứa và hơi đau đầu.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n19
  cau: Nhóm bị báo sai chỉ có ở điều kiện vui vẻ, không có ở điều kiện giận dữ.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n20
  cau: Trong điều kiện vui vẻ, diễn viên gấp máy bay giấy, chơi bóng rổ giấy, làm ná chun, xoay hula hoop.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n21
  cau: Trong điều kiện giận dữ, hai người làm một bảng hỏi ngày càng riêng tư và xúc phạm; diễn viên ngày càng bực, xé bảng hỏi rồi bỏ ra ngoài.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n22
  cau: Cảm xúc được đo bằng quan sát qua gương một chiều và bảng tự báo cáo.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n23
  cau: Ở điều kiện vui vẻ, nhóm không được báo trước và nhóm bị báo sai tự báo cáo vui hơn nhóm được báo đúng (điểm 1,78 và 1,90, so với 0,98).
  loai: so-lieu
- trang: thi-nghiem/schachter-singer
  id: n24
  cau: Ở điều kiện vui vẻ, nhóm không được báo trước và nhóm bị báo sai có xu hướng hành động hưng phấn hơn nhóm được báo đúng; chênh lệch về chỉ số hành động chỉ có ý nghĩa thống kê với nhóm bị báo sai.
  loai: so-lieu
- trang: thi-nghiem/schachter-singer
  id: n25
  cau: Ở điều kiện giận dữ, chỉ số hành vi giận của nhóm không được báo trước cao hơn hẳn nhóm được báo đúng (+2,28 so với −0,18).
  loai: so-lieu
- trang: thi-nghiem/schachter-singer
  id: n26
  cau: Tự báo cáo giận cùng chiều nhưng chưa đạt mức ý nghĩa (1,91 so với 1,39; p = ,08).
  loai: so-lieu
- trang: thi-nghiem/schachter-singer
  id: n27
  cau: Các tác giả cho biết người tham gia ngại bộc lộ giận trước người thí nghiệm, vì sợ mất điểm thi.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n28
  cau: Nhóm giả dược nằm giữa các nhóm epinephrine; chênh lệch với nhóm epinephrine không có ý nghĩa thống kê ở điều kiện vui vẻ.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n29
  cau: Các tác giả gọi kết quả của nhóm giả dược là "đáng lo" cho lý thuyết, nên phải dùng phân tích phụ.
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n30
  cau: Phân tích phụ loại những người tự gán triệu chứng cho mũi tiêm; các tác giả gọi kết luận của mình là dè dặt (tentative).
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n31
  cau: "Ba mệnh đề: (a) kích thích không có lời giải thích sẽ được dán nhãn theo nhận thức sẵn có; (b) kích thích đã có lời giải thích phù hợp thì không cần dán nhãn thêm; (c) cùng bối cảnh nhận thức, phản ứng cảm xúc chỉ xuất hiện khi có kích thích sinh lý."
  loai: dinh-nghia
- trang: thi-nghiem/schachter-singer
  id: n32
  cau: "Năm 1979, cùng một số của Journal of Personality and Social Psychology đăng hai bài thử lại ý tưởng của Schachter và Singer: bài của Marshall và Zimbardo về hệ quả cảm xúc của kích thích sinh lý không được giải thích thỏa đáng, và bài của Maslach; Schachter và Singer viết bài phản hồi trong cùng số. Trang không kể thiết kế và số liệu."
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n33
  cau: Theo các tổng kết thứ cấp, hành vi của diễn viên vui vẻ ít ảnh hưởng đến người tham gia trong nghiên cứu của Marshall và Zimbardo, không như kết quả gốc.
  loai: tai-lap
- trang: thi-nghiem/schachter-singer
  id: n34
  cau: 'Tên bài của Maslach (1979) nói kết quả: kích thích không được giải thích bị "nghiêng" về cảm xúc tiêu cực (trong khung Đang tranh cãi: trong khi lý thuyết gốc cho rằng nhãn cảm xúc đến từ hoàn cảnh).'
  loai: tai-lap
- trang: thi-nghiem/schachter-singer
  id: n35
  cau: Maslach (1979) dùng ám thị thôi miên thay cho mũi tiêm và cho kết quả theo hướng tương tự.
  loai: tai-lap
- trang: thi-nghiem/schachter-singer
  id: n36
  cau: Reisenzein (1983) là tổng quan sau hai thập kỷ, xem xét bằng chứng cho ba suy luận chính của lý thuyết Schachter.
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n37
  cau: "Chỉ một trong ba suy luận được dữ liệu ủng hộ đầy đủ: kích thích từ nguồn ngoài, bị quy nhầm cho tình huống cảm xúc, làm mạnh thêm phản ứng cảm xúc."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n38
  cau: Suy luận rằng giảm kích thích làm giảm cảm xúc ít được ủng hộ; suy luận rằng quy kích thích cho nguồn trung tính làm giảm cảm xúc thì chưa rõ vì còn cách diễn giải khác.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n39
  cau: Không có bằng chứng thuyết phục cho rằng kích thích là điều kiện cần của cảm xúc, hay rằng dán nhãn kích thích không rõ nguyên nhân có thể tạo ra cảm xúc.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n40
  cau: 'Reisenzein cho rằng vai trò của kích thích bị nói quá; điều còn lại nhiều nhất là phiên bản "pha loãng": kích thích có thể khuếch đại cường độ cảm xúc, một phần qua cách quy kết nguồn kích thích.'
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n41
  cau: "Dutton và Aron (1974): những người đàn ông đi ngang qua được một nữ phỏng vấn viên hấp dẫn gặp trên cầu treo gây sợ hãi hoặc cầu không gây sợ hãi, điền bảng hỏi có tranh TAT."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n42
  cau: Nội dung tình dục trong chuyện của người ở cầu treo và xu hướng tìm cách liên lạc lại với phỏng vấn viên đều cao hơn có ý nghĩa thống kê; với phỏng vấn viên nam thì hai cầu không khác nhau.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n43
  cau: Hai tác giả diễn giải đó là cơn kích thích từ nỗi sợ bị quy nhầm thành sự hấp dẫn; nghiên cứu hiện trường này được dẫn nhiều.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n44
  cau: "Khá vững: kích thích từ nguồn khác, bị quy nhầm cho một tình huống cảm xúc, có thể làm mạnh thêm cảm xúc."
  loai: nhan
- trang: thi-nghiem/schachter-singer
  id: n45
  cau: "Đang tranh cãi: phiên bản mạnh của lý thuyết hai nhân tố."
  loai: nhan
- trang: thi-nghiem/schachter-singer
  id: n76
  cau: Một phân tích tổng hợp về kích thích và sự hấp dẫn (Foster và cộng sự, 1998) thấy kích thích làm tăng sự hấp dẫn ngay cả khi nguồn kích thích khá rõ ràng; phần tổng quan đi kèm trong cùng bài gợi ý tác động mạnh hơn khi nguồn kích thích mơ hồ.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n46
  cau: Cotton (1981) kết luận lý thuyết của Schachter chưa được nghiên cứu ủng hộ tốt, nhưng bằng chứng chưa chắc đã bác bỏ nó.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n47
  cau: Khung "Đã bị bác bỏ" cũ ("cứ tim đập nhanh là não sẽ tự bịa ra bất kỳ cảm xúc nào") đã bỏ khỏi trang.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n48
  cau: "James (1890): thay đổi của cơ thể đi liền sau việc nhận ra sự kiện, và cảm giác về những thay đổi ấy chính là cảm xúc."
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n49
  cau: Schachter và Singer giữ lại phần cơ thể của James–Lange nhưng thêm rằng cần có thêm nhận thức phù hợp.
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n50
  cau: Cannon (1929) phê bình James–Lange, chẳng hạn rằng động vật bị cắt hệ giao cảm vẫn có hành vi cảm xúc; Schachter và Singer thừa nhận phê bình này cũng áp dụng cho mệnh đề thứ ba.
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n51
  cau: 'Bullet "Thẩm định nhận thức hiện đại: cảm xúc là kết quả của quá trình đánh giá tình huống" đã bỏ khỏi trang.'
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n52
  cau: Việc đổi nguồn mà ta quy cho cơn kích thích có làm giảm cảm xúc hay không thì Reisenzein (1983) đánh giá là chưa rõ.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n53
  cau: Nghiên cứu cầu treo là một nghiên cứu hiện trường với nam giới và một phỏng vấn viên, nên không đủ để nói điều gì về chuyện hẹn hò nói chung.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n54
  cau: Bullet "Tranh luận lúc đang nóng máy" (vừa tập thể dục xong, cơn giận có thể đến từ dư âm sinh lý) đã bỏ khỏi trang.
  loai: loi-khuyen
- trang: thi-nghiem/schachter-singer
  id: n55
  cau: Tính đến 10/2026, chưa tìm thấy nghiên cứu nào kiểm tra lý thuyết hai nhân tố trên người Việt.
  loai: thoi-su
- trang: thi-nghiem/schachter-singer
  id: n56
  cau: Thí nghiệm gốc làm trên nam sinh viên ở Đại học Minnesota (Mỹ).
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n57
  cau: Câu "thí nghiệm gốc ... một thiết kế ngày nay không thể qua hội đồng đạo đức ở bất kỳ đâu" và đoạn "câu hỏi thú vị nhưng chưa có đáp án" về ngôn ngữ, chuẩn mực văn hóa đã bỏ.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n58
  cau: "Ngộ nhận: lý thuyết hai nhân tố coi kích thích sinh lý là một thành phần của cảm xúc mạnh, dù Reisenzein (1983) không thấy bằng chứng thuyết phục rằng nó là điều kiện cần."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n59
  cau: "Ngộ nhận: tim đập nhanh khi gặp ai đó không nhất thiết nghĩa là yêu; theo phân tích tổng hợp của Foster và cộng sự (1998), kích thích từ một nguồn khác cũng có thể làm ta thấy người kia hấp dẫn hơn, nên cảm giác tim đập nhanh tự nó chưa nói được ta cảm thấy gì về người ấy."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n60
  cau: "Ngộ nhận: có thể điều khiển cảm xúc người khác bằng cách tạo kích thích; điều được tổng quan xem là có đủ bằng chứng chỉ là kích thích làm mạnh thêm cảm xúc sẵn có."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n61
  cau: "Ngộ nhận: lý thuyết bị phê bình thì vứt đi; phần mà Reisenzein xem là có đủ bằng chứng vẫn còn."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n62
  cau: "Quiz 1: nhóm bắt cảm xúc của diễn viên mạnh nhất là nhóm tiêm adrenaline mà không được giải thích đúng (không được báo gì hoặc bị báo sai); nhóm được báo đúng ít bị cuốn theo nhất, nhóm giả dược nằm giữa."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n63
  cau: "Quiz 2: nhóm được báo đúng ít chịu ảnh hưởng vì đã có lời giải thích thỏa đáng cho cơn kích thích; đó là mệnh đề (b)."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n64
  cau: "Quiz 3: Marshall và Zimbardo (1979) khi làm lại điều kiện vui vẻ: theo các tổng kết thứ cấp, hành vi của diễn viên vui vẻ ít ảnh hưởng đến người tham gia, không như kết quả gốc."
  loai: tai-lap
- trang: thi-nghiem/schachter-singer
  id: n65
  cau: 'Quiz 4: Reisenzein (1983) kết luận chỉ còn phiên bản "pha loãng": kích thích bị quy nhầm nguồn làm mạnh thêm cảm xúc; không có bằng chứng thuyết phục rằng kích thích là điều kiện cần của cảm xúc.'
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n66
  cau: "Quiz 5: nghiên cứu cầu treo minh họa việc cơn kích thích từ nỗi sợ có thể bị quy nhầm thành sự hấp dẫn."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n70
  cau: "Hộp hồ sơ: tác giả và năm là Stanley Schachter và Jerome Singer, 1962; tổng quan Reisenzein, 1983."
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n71
  cau: "Hộp hồ sơ: người tham gia là nam sinh viên các lớp nhập môn tâm lý học ở Đại học Minnesota; 184 người đồng ý tiêm, 11 người bị loại vì quá nghi ngờ thí nghiệm."
  loai: so-lieu
- trang: thi-nghiem/schachter-singer
  id: n72
  cau: "Hộp hồ sơ: thiết kế gồm tiêm epinephrine (được báo đúng, không được báo, bị báo sai) hay giả dược; 20 phút ngồi cùng diễn viên vui vẻ hoặc giận dữ."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n73
  cau: "Hộp hồ sơ: người tiêm epinephrine mà không được báo trước bị cuốn theo cảm xúc của diễn viên nhiều hơn người được báo đúng; nhóm giả dược nằm giữa, chênh lệch với nhóm epinephrine không có ý nghĩa thống kê ở điều kiện vui vẻ."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n74
  cau: "Hộp hồ sơ: Reisenzein (1983) kết luận chỉ một trong ba suy luận của lý thuyết được dữ liệu ủng hộ đầy đủ."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n1
  cau: Năm 1967, Seligman và Maier cho thấy chó từng chịu sốc điện không thể kiểm soát phần lớn thụ động chịu đựng trong hộp shuttle box dù chỉ cần nhảy qua vách ngăn thấp là thoát.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n2
  cau: Cuối thập niên 1960, chó được buộc trong võng (hammock) và chịu sốc điện.
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n3
  cau: Hai con chó chịu cú sốc cùng cường độ và cùng thời lượng trung bình; con thứ nhất tắt được sốc bằng cách ấn đầu vào tấm bảng ở bên đầu, con thứ hai ấn thế nào sốc cũng không dừng.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n4
  cau: Hôm sau, cả hai được đưa vào một hộp shuttle có vách ngăn ở giữa; chỉ cần nhảy qua vách là thoát sốc.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n5
  cau: Phần lớn chó nhóm yoked (6 trên 8 con) thụ động chịu sốc ở ít nhất 9 trong 10 lượt, dù chỉ cần một cái nhảy là thoát.
  loai: so-lieu
- trang: thi-nghiem/seligman
  id: n6
  cau: Chó từng tắt được sốc hôm trước, và cả những con chó chưa từng bị sốc, thoát sốc bình thường.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n7
  cau: "Câu hỏi cho chính chúng ta: khi con người liên tục rơi vào tình huống mà nỗ lực chẳng đổi được gì, điều gì xảy ra với ý chí của họ?"
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n8
  cau: Thí nghiệm cho thấy, trong thiết kế của họ, thủ phạm không phải cú sốc điện mà là sự không kiểm soát được cú sốc.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n9
  cau: Hai nhóm chó chịu sốc cùng cường độ và cùng thời lượng; nếu chính cơn đau làm chó "tê liệt", hai nhóm phải cư xử giống nhau.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n10
  cau: Seligman và Maier giải thích năm 1967 rằng sinh vật học được kết quả độc lập với phản ứng của mình, và bài học đó lan sang tình huống mới; họ gọi đó là "bất lực học được".
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n11
  cau: Năm 2016, chính Maier và Seligman viết rằng giải thích gốc "hiểu ngược" (got it backwards).
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n12
  cau: "Hiện tượng bắt nguồn từ phòng thí nghiệm của Richard Solomon ở Đại học Pennsylvania, nơi nghiên cứu điều kiện hóa sợ hãi kiểu Pavlov: chó bị giữ trong võng, chịu sốc, hôm sau tập thoát sốc trong hộp shuttle."
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n13
  cau: Chó nhiều khi không thoát sốc trong hộp shuttle mà thụ động chờ hết sốc.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n14
  cau: "Overmier và Seligman: sốc không thoát được làm hỏng một cách đáng tin cậy việc học thoát/tránh sốc sau đó trong tình huống mới."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n15
  cau: Chó vẫn bị suy giảm khi bị tê liệt bằng curare lúc chịu sốc, và khi tăng cường độ sốc lúc tập thoát.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n16
  cau: Suy giảm tan sau 48 giờ.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n17
  cau: Overmier và Seligman gợi ý mức kiểm soát có thể là yếu tố quyết định hiệu ứng.
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n18
  cau: Maier và Seligman (2016) viết rằng Overmier và Seligman là người đầu tiên gợi ý từ "bất lực" cho hiện tượng.
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n19
  cau: Thí nghiệm I của Seligman và Maier dùng 24 chó, mỗi nhóm 8 con.
  loai: so-lieu
- trang: thi-nghiem/seligman
  id: n20
  cau: Nhóm thoát được ấn một trong hai tấm bảng bằng đầu để tắt sốc; 64 cú sốc 6 mA không báo hiệu.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n21
  cau: Nhóm yoked nhận cú sốc có thời lượng bằng trung bình của cú tương ứng ở nhóm thoát được, nhưng ấn bảng vô tác dụng.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n22
  cau: Nhóm đối chứng bình thường không qua giai đoạn trong võng, chỉ tập 10 lượt trong hộp shuttle.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n23
  cau: Sau 24 giờ, cả ba nhóm cùng làm 10 lượt tập thoát sốc trong hộp shuttle.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n24
  cau: Thời gian thoát trung bình là 27,00 giây (nhóm thoát được), 25,93 giây (đối chứng) và 48,22 giây (yoked).
  loai: so-lieu
- trang: thi-nghiem/seligman
  id: n25
  cau: 6 trên 8 chó yoked không thoát ở ít nhất 9 trong 10 lượt, so với 0 con của nhóm thoát được và 1 trên 8 con của nhóm đối chứng.
  loai: so-lieu
- trang: thi-nghiem/seligman
  id: n26
  cau: Nhóm thoát được và nhóm đối chứng không khác nhau; chỉ nhóm yoked bị suy giảm rõ.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n27
  cau: "Thí nghiệm II (27 chó, mỗi nhóm 9 con): chó đã từng thoát được sốc trong hộp shuttle trước đó không bị suy giảm sau khi chịu sốc không kiểm soát trong võng, trong khi chó chưa có kinh nghiệm thì bị suy giảm."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n28
  cau: Năm trong sáu chó yoked bị suy giảm vẫn thất bại trong mọi lượt khi thử lại sau 7 ngày.
  loai: so-lieu
- trang: thi-nghiem/seligman
  id: n29
  cau: "Hình: ba nhóm trải qua giai đoạn sốc khác nhau rồi, sau 24 giờ, cùng làm 10 lượt thoát sốc trong hộp shuttle."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n30
  cau: 'Hình (đã sửa): nhóm đối chứng "Không vào võng / không bị sốc trước".'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n31
  cau: 'Hình (đã sửa): ô kết quả "Thoát sốc bình thường" (nhóm thoát được, nhóm đối chứng) và "Phần lớn thụ động (6/8)" (nhóm yoked); dòng dưới "Chỉ nhóm yoked bị suy giảm rõ: 6 trên 8 con không thoát ở ít nhất 9 trong 10 lượt"; chú thích tương ứng.'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n74
  cau: 'Hình (đã sửa): nhóm yoked "Sốc cùng thời lượng trung bình / ấn bảng vô tác dụng"; dòng dưới và chú thích: nhóm yoked chịu sốc cùng thời lượng trung bình với nhóm thoát được, chỉ khác ở khả năng kiểm soát.'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n75
  cau: 'Hình (đã sửa): nhóm thoát được "Ấn tấm bảng bằng đầu là tắt sốc (kiểm soát được)"; mỗi nhóm 8 con; giai đoạn 2 "học nhảy qua vách ngăn để thoát hay tránh sốc".'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n32
  cau: Hiroto và Seligman làm bốn thí nghiệm cùng lúc trên sinh viên đại học, trong đó có một thí nghiệm dùng tiếng ồn khó chịu (tắt được, không tắt được, không nghe) rồi cho giải anagram.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n33
  cau: Nhóm từng chịu tiếng ồn không thể tắt thất bại nhiều hơn ở việc giải anagram, dù nhiệm vụ không liên quan đến tiếng ồn.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n34
  cau: Hiroto và Seligman gợi ý một kỳ vọng rằng phản ứng của mình không liên quan đến kết quả, và hiệu ứng có thể là một "đặc điểm gây ra được".
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n35
  cau: Maier và Seligman (2016) là một bài tổng quan 50 năm trên Psychological Review.
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n36
  cau: Nghiên cứu thần kinh học được tổng hợp chủ yếu trên chuột, dùng các can thiệp như tổn thương và vi tiêm thuốc chặn hoạt động của vùng não.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n37
  cau: 'Hai tác giả thừa nhận lý thuyết gốc "hiểu ngược": thụ động trước sốc kéo dài không phải là thứ học được mà là phản ứng mặc định, có sẵn, qua hoạt động serotonin của nhân dorsal raphe ức chế hành vi thoát.'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n38
  cau: "Cái thực sự phải học là sự kiểm soát: vùng vỏ não trước trán trong phát hiện kiểm soát và tự động ức chế nhân dorsal raphe."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n39
  cau: "Khá vững: sốc không kiểm soát được làm suy giảm việc học cách thoát sau này — ở động vật."
  loai: nhan
- trang: thi-nghiem/seligman
  id: n40
  cau: 'Khá vững: bản "đảo ngược" 2016 có nền tảng thần kinh học trên động vật.'
  loai: nhan
- trang: thi-nghiem/seligman
  id: n41
  cau: Từ thập niên 1970, Seligman đề xuất dùng hiện tượng này làm mô hình phòng thí nghiệm cho trầm cảm.
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n42
  cau: Maier và Seligman (2016) kể rằng hiện tượng tái hiện tám trong chín triệu chứng của trầm cảm theo tiêu chí DSM-III và DSM-IV.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n43
  cau: Chính Maier và Seligman chỉ "phỏng đoán" (speculate) rằng phát hiện thần kinh có thể có ý nghĩa cho điều trị trầm cảm.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n44
  cau: "Đang tranh cãi: 'bất lực học được' giải thích được bao nhiêu về trầm cảm ở người? (mô hình gợi ý, không phải công cụ chẩn đoán hay điều trị; dẫn trang Hỗ trợ)."
  loai: nhan
- trang: thi-nghiem/seligman
  id: n76
  cau: Năm 1978, một tổng quan phê bình cho rằng sáu thí nghiệm trên người của nhóm Seligman ủng hộ rất ít cho thuyết bất lực học được về trầm cảm (Costello, 1978).
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n77
  cau: Chính Seligman cùng cộng sự viết lại thuyết cho người, thêm vai trò của cách mỗi người giải thích nguyên nhân (Abramson, Seligman và Teasdale, 1978).
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n78
  cau: Một phân tích tổng hợp 104 nghiên cứu thấy cách giải thích nguyên nhân ấy có liên hệ đáng tin cậy với điểm trầm cảm (Sweeney và cộng sự, 1986); đó là mối liên hệ, tự nó không cho biết chiều nhân quả.
  loai: so-lieu
- trang: thi-nghiem/seligman
  id: n45
  cau: 'Lý thuyết 1967: ngoài "làm A thì được B", sinh vật còn học mối quan hệ thứ ba: kết quả độc lập với mọi phản ứng.'
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n46
  cau: "Abramson, Seligman và Teasdale (1978): ở người, còn tùy cách giải thích sự bất lực; người cho nguyên nhân là lâu dài thì bất lực kéo dài, người cho nguyên nhân lan rộng thì bất lực lan sang nhiều tình huống."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n47
  cau: "Kinh nghiệm thoát được sốc trong hộp shuttle trước đó có tác dụng bảo vệ trong thí nghiệm: chó không bị suy giảm sau khi chịu sốc không kiểm soát được."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n48
  cau: Hiroto và Seligman (1975) thấy ở người rằng trải nghiệm không kiểm soát được trong thí nghiệm ngắn làm giảm thành tích ở nhiệm vụ sau.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n49
  cau: Các bullet cũ của mục Áp dụng (chia mục tiêu thành bước nhỏ, tách phần kiểm soát được, dạy con và quản lý) đã bỏ khỏi trang.
  loai: loi-khuyen
- trang: thi-nghiem/seligman
  id: n50
  cau: Đừng dùng khái niệm này để dán nhãn ai; trang không đưa chẩn đoán hay hướng dẫn điều trị; ai buồn hay kiệt sức kéo dài thì xem trang Hỗ trợ.
  loai: loi-khuyen
- trang: thi-nghiem/seligman
  id: n51
  cau: Tính đến 10/2026, chưa tìm thấy thí nghiệm bất lực học được nào trên người Việt.
  loai: thoi-su
- trang: thi-nghiem/seligman
  id: n52
  cau: Thí nghiệm gốc làm trên chó ở Mỹ; bản trên người (Hiroto và Seligman, 1975) làm trên sinh viên đại học.
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n53
  cau: Đoạn về văn hóa Việt Nam ("coi trọng ý chí ... ngừng cố gắng bị quy là lười") đã bỏ.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n54
  cau: 'Ngộ nhận "chó không nhảy vì ngu, nhát, lười": nhóm chưa từng bị sốc và nhóm từng tắt được sốc thoát sốc bình thường.'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n55
  cau: 'Ngộ nhận "cú sốc điện làm chó tê liệt": thiết kế ba nhóm loại trừ, vì nhóm tắt được sốc chịu cùng lượng sốc như nhóm yoked mà hôm sau vẫn thoát bình thường.'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n56
  cau: 'Ngộ nhận "bất lực học được chính là trầm cảm": đó là mô hình động vật gợi hướng nghiên cứu, không ai được dùng nó để chẩn đoán ai.'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n57
  cau: 'Ngộ nhận "lý thuyết 1967 vẫn giữ nguyên": chính Maier và Seligman 2016 viết rằng lý thuyết gốc "hiểu ngược".'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n58
  cau: 'Ngộ nhận "bất lực học được nghĩa là thiếu ý chí": trong thí nghiệm nhóm yoked chịu cùng lượng sốc với nhóm thoát được, khác biệt là khả năng kiểm soát.'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n59
  cau: "Quiz 1: ba nhóm là nhóm ấn bảng tắt được sốc, nhóm yoked (cùng thời lượng sốc, ấn bảng vô tác dụng), nhóm không qua giai đoạn sốc."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n60
  cau: "Quiz 2: nhóm từng tắt được sốc và nhóm chưa từng bị sốc thoát sốc bình thường; phần lớn nhóm yoked thụ động chịu sốc."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n61
  cau: "Quiz 3: nhóm tắt được sốc chịu cùng lượng sốc như nhóm yoked mà vẫn thoát bình thường, nên không phải bản thân cú sốc là nguyên nhân."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n62
  cau: 'Quiz 4: Maier và Seligman (2016) kết luận lý thuyết gốc "hiểu ngược": thụ động là phản ứng mặc định có sẵn (nhân dorsal raphe), còn cái phải học là sự kiểm soát (vùng trán trong).'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n63
  cau: 'Quiz 5: thí nghiệm Seligman là mô hình động vật gợi hướng nghiên cứu, không phải công cụ chẩn đoán hay điều trị; chính Maier và Seligman (2016) chỉ "phỏng đoán" về ý nghĩa với điều trị trầm cảm.'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n68
  cau: "Hộp hồ sơ: tác giả và năm là Seligman và Maier, 1967; Overmier và Seligman, 1967; bản cập nhật Maier và Seligman, 2016."
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n69
  cau: "Hộp hồ sơ: đối tượng là 24 chó lai ở Đại học Pennsylvania trong thí nghiệm I (mỗi nhóm 8 con)."
  loai: so-lieu
- trang: thi-nghiem/seligman
  id: n70
  cau: "Hộp hồ sơ: thiết kế ba nhóm (tắt được sốc bằng cách ấn bảng bằng đầu, yoked, không qua giai đoạn sốc), 24 giờ sau 10 lượt thoát sốc trong hộp shuttle."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n71
  cau: "Hộp hồ sơ: 6 trên 8 chó yoked không thoát được ở ít nhất 9 trong 10 lượt; nhóm thoát được và nhóm đối chứng thoát như nhau."
  loai: so-lieu
- trang: thi-nghiem/seligman
  id: n72
  cau: 'Hộp hồ sơ: chính hai tác giả viết năm 2016 rằng lý thuyết gốc "hiểu ngược": thụ động là phản ứng mặc định, thứ phải học là sự kiểm soát.'
  loai: phat-hien
