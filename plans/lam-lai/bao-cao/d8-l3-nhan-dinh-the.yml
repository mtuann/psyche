- trang: du-lieu/ngo-nhan/luoi-xa-hoi
  id: g2
  cau: "Yếu tố ảnh hưởng mạnh: việc đóng góp có được đánh giá không, kỳ vọng về đồng đội, ý nghĩa công việc, văn hóa."
