- trang: du-lieu/ngo-nhan/mozart
  id: nhan
  cau: "Nghe nhạc Mozart làm trẻ thông minh hơn: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/mozart
  id: g1
  cau: Nghiên cứu gốc năm 1993 làm trên sinh viên đại học, đo một nhiệm vụ không gian ngay sau khi nghe nhạc.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/mozart
  id: g2
  cau: Các phân tích tổng hợp 1999 và 2010 thấy hiệu ứng rất nhỏ hoặc gần như không có, kèm dấu hiệu thiên lệch xuất bản.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/mozart
  id: g3
  cau: Tổng quan năm 2006 kết luận "hiệu ứng Mozart" không có đủ bằng chứng để làm cơ sở cho việc dạy học.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/muoi-nghin-gio
  id: nhan
  cau: "Cứ luyện 10.000 giờ là thành chuyên gia ở lĩnh vực nào cũng được: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/muoi-nghin-gio
  id: g1
  cau: "Macnamara 2014: luyện tập có chủ đích giải thích 26% (trò chơi), 21% (âm nhạc), 18% (thể thao), 4% (học tập), dưới 1% (nghề)."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/muoi-nghin-gio
  id: g2
  cau: Luyện tập quan trọng nhưng không quan trọng như từng được nói.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nao-10
  id: nhan
  cau: Khẳng định "con người chỉ dùng 10% bộ não" đã bị bác bỏ.
  loai: nhan
- trang: du-lieu/ngo-nhan/nao-10
  id: g1
  cau: Ghi hoạt động não và kích thích điện khi phẫu thuật chưa tìm thấy vùng não nào không có chức năng; tổn thương ở hầu như vùng nào cũng để lại khiếm khuyết.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nao-10
  id: g2
  cau: 'Khảo sát năm 2012: 48% giáo viên Anh và 46% giáo viên Hà Lan được hỏi đồng ý "ta chỉ dùng 10% bộ não".'
  loai: so-lieu
- trang: du-lieu/ngo-nhan/nao-10
  id: g3
  cau: (Đã bỏ) Não chỉ chiếm khoảng 2% khối lượng cơ thể nhưng dùng khoảng 20% năng lượng lúc nghỉ.
  loai: so-lieu
- trang: du-lieu/ngo-nhan/nao-che-hai-y-thuc
  id: nhan
  cau: 'Cắt thể chai tạo ra hai "con người" độc lập: đang tranh cãi.'
  loai: nhan
- trang: du-lieu/ngo-nhan/nao-che-hai-y-thuc
  id: g1
  cau: Khi thể chai bị cắt, hai bán cầu không còn trao đổi trực tiếp; tay trái lấy đúng đồ vật mà miệng nói là không thấy.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nao-che-hai-y-thuc
  id: g2
  cau: "Sperry: mỗi bán cầu dường như có vùng nhận thức riêng; Gazzaniga (2005): chưa có trường hợp cho phép khẳng định mỗi bán cầu có ý thức đầy đủ về bản thân."
  loai: lich-su
- trang: du-lieu/ngo-nhan/nao-nam-nu
  id: nhan
  cau: 'Não nam và nữ khác nhau căn bản như hai "loại" riêng: đã bị bác bỏ.'
  loai: nhan
- trang: du-lieu/ngo-nhan/nao-nam-nu
  id: g1
  cau: "Hơn 1.400 bộ não (2015): khác biệt trung bình có, nhưng phân bố chồng lấn rất nhiều; não có đặc điểm nhất quán ở một đầu rất hiếm."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nao-nam-nu
  id: g2
  cau: Phần lớn não là "khảm" của đặc điểm phổ biến hơn ở nữ, ở nam và ở cả hai.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nao-trai-phai
  id: nhan
  cau: Phân loại người thành "thiên não trái" và "thiên não phải" đã bị bác bỏ.
  loai: nhan
- trang: du-lieu/ngo-nhan/nao-trai-phai
  id: g1
  cau: Ngôn ngữ thường thiên về bán cầu trái; đó là chuyên biệt hóa chức năng.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nao-trai-phai
  id: g2
  cau: 'Phân tích ảnh chụp não lúc nghỉ của 1.011 người 7–29 tuổi: lệch bán cầu là đặc điểm cục bộ, không có kiểu "não trái hơn" hay "não phải hơn" trên toàn bộ não.'
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nghi-tich-cuc-stress
  id: nhan
  cau: "Chỉ cần nghĩ tích cực về stress thì stress tự thành có lợi: đang tranh cãi."
  loai: nhan
- trang: du-lieu/ngo-nhan/nghi-tich-cuc-stress
  id: g1
  cau: Niềm tin về stress đổi được qua can thiệp ngắn.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nghi-tich-cuc-stress
  id: g2
  cau: "Crum 2013, 2023: kết quả tích cực nhưng chủ yếu tự báo cáo; các nhóm khác chưa nhất quán, nhất là chỉ số sinh lý."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/ngu-it-da-quen
  id: nhan
  cau: "Ngủ 4–5 tiếng mỗi đêm là đủ, miễn là đã quen: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/ngu-it-da-quen
  id: g1
  cau: "Van Dongen 2003: nằm giường 4 hay 6 tiếng mỗi đêm trong 14 ngày gây suy giảm nhận thức tích lũy, tương đương tới 2 đêm thức trắng."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/ngu-it-da-quen
  id: g2
  cau: Buồn ngủ tự báo cáo chỉ tăng thêm ít sau phản ứng ban đầu; người tham gia phần lớn không nhận ra mình suy giảm.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nguoi-ngoai-cuoc
  id: nhan
  cau: '"Càng đông người chứng kiến, nạn nhân càng khó được giúp": đang tranh cãi.'
  loai: nhan
- trang: du-lieu/ngo-nhan/nguoi-ngoai-cuoc
  id: g1
  cau: "Phân tích tổng hợp 2011: có người khác hiện diện thì mỗi người ít giúp hơn, nhất là khi tình huống mập mờ."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nguoi-ngoai-cuoc
  id: g2
  cau: "Camera 219 vụ xung đột ở Anh, Hà Lan, Nam Phi: khoảng 9/10 vụ có người can thiệp; càng đông càng dễ có người giúp."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/nha-tu-stanford
  id: nhan
  cau: "Thí nghiệm nhà tù Stanford chứng minh hoàn cảnh biến người tốt thành kẻ ác: đang tranh cãi."
  loai: nhan
- trang: du-lieu/ngo-nhan/nha-tu-stanford
  id: g1
  cau: "Le Texier 2019 (hồ sơ lưu trữ, phỏng vấn 15 người): cai ngục được hướng dẫn cụ thể, dữ liệu thiên lệch và không đủ, người tham gia hiếm khi nhập vai hoàn toàn."
  loai: lich-su
- trang: du-lieu/ngo-nhan/nha-tu-stanford
  id: g2
  cau: Zimbardo và Haney (2020) phản hồi, bảo vệ sức mạnh của môi trường phi nhân tính.
  loai: lich-su
- trang: du-lieu/ngo-nhan/nhan-chung
  id: nhan
  cau: "Tận mắt chứng kiến thì khó nhận nhầm người: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/nhan-chung
  id: g1
  cau: Tính đến 11/2026, Innocence Project cho biết hơn 60% thân chủ của họ bị kết án oan dựa trên nhận dạng nhầm của nhân chứng.
  loai: thoi-su
- trang: du-lieu/ngo-nhan/nhan-chung
  id: g2
  cau: Trí nhớ được dựng lại, có thể bị thông tin sau sự kiện làm sai lệch; cảm giác chắc chắn có thể đi kèm ký ức sai.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nhin-mat-biet-cam-xuc
  id: nhan
  cau: "Nhìn nét mặt là biết chính xác người ta cảm thấy gì: đang tranh cãi."
  loai: nhan
- trang: du-lieu/ngo-nhan/nhin-mat-biet-cam-xuc
  id: g1
  cau: Trong phòng thí nghiệm với đáp án cho sẵn, người ta đoán nét mặt đúng trên mức may rủi; tỉ lệ đó bị thổi phồng bởi cách trắc nghiệm ép chọn.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/nhin-mat-biet-cam-xuc
  id: g2
  cau: Ngoài đời, cùng một nét mặt có thể ứng với nhiều cảm xúc tùy ngữ cảnh.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/noi-doi-mat
  id: nhan
  cau: "Nhìn ánh mắt để biết ai nói dối: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/noi-doi-mat
  id: g1
  cau: "Phân tích tổng hợp 206 tài liệu, 24.483 người phán đoán: đúng trung bình 54%."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/noi-doi-mat
  id: g2
  cau: Trong 158 dấu hiệu, nhiều hành vi không liên hệ hoặc liên hệ yếu với nói dối; giao tiếp bằng mắt (d = 0,01) và tránh nhìn (d = 0,03) gần như không liên hệ.
  loai: so-lieu
- trang: du-lieu/ngo-nhan/p-gia-thuyet-dung
  id: nhan
  cau: '"p < 0,05 nghĩa là giả thuyết đúng tới 95%": sai (đã bị bác bỏ).'
  loai: nhan
- trang: du-lieu/ngo-nhan/p-gia-thuyet-dung
  id: g1
  cau: p-value cho biết dữ liệu không tương thích đến đâu với một mô hình định sẵn; không phải xác suất giả thuyết đúng; không đo độ lớn hay tầm quan trọng.
  loai: dinh-nghia
- trang: du-lieu/ngo-nhan/p-gia-thuyet-dung
  id: g2
  cau: Năm 2016, ASA ra tuyên bố chính thức về cách dùng và hiểu p-value.
  loai: lich-su
- trang: du-lieu/ngo-nhan/phong-cach-hoc
  id: nhan
  cau: "Dạy khớp với phong cách học giúp học tốt hơn: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/phong-cach-hoc
  id: g1
  cau: Người ta có sở thích học khác nhau; giả thuyết "dạy khớp thì học tốt hơn" cần một kiểu thí nghiệm cụ thể (thiết kế bắt chéo) để kiểm tra.
  loai: dinh-nghia
- trang: du-lieu/ngo-nhan/phong-cach-hoc
  id: g2
  cau: Bài tổng quan năm 2008 gần như không tìm thấy bằng chứng ủng hộ.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/phong-cach-hoc
  id: g3
  cau: 'Tổng hợp 17 phân tích tổng hợp (2025): ở các nghiên cứu kiểm tra đúng việc "dạy khớp", hiệu ứng gần bằng 0 (d = 0,04).'
  loai: so-lieu
- trang: du-lieu/ngo-nhan/phong-cach-hoc
  id: g4
  cau: Khoảng 9/10 giáo viên được khảo sát ở nhiều nước vẫn tin vào nó.
  loai: so-lieu
- trang: du-lieu/ngo-nhan/qua-day-thi-muon
  id: nhan
  cau: "Học ngoại ngữ sau tuổi dậy thì là quá muộn, không học nổi: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/qua-day-thi-muon
  id: g1
  cau: "Hartshorne 2018 (669.498 người): khả năng học ngữ pháp giữ gần nguyên đến 17,4 tuổi rồi giảm dần đều."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/qua-day-thi-muon
  id: g2
  cau: Khả năng giảm dần, không mất ngay sau dậy thì; người bắt đầu muộn khó đạt ngữ pháp như bản ngữ hơn.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/ruou-ngu
  id: nhan
  cau: "Uống chút rượu trước khi ngủ giúp ngủ ngon suốt đêm: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/ruou-ngu
  id: g1
  cau: "Ở mọi liều: thiếp đi nhanh hơn, nửa đầu đêm liền hơn, nửa sau gián đoạn nhiều hơn."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/ruou-ngu
  id: g2
  cau: Giấc REM đầu tiên đến muộn hơn ở mọi liều; liều vừa và cao làm giảm tổng REM.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/ruou-ngu
  id: g3
  cau: (Đã bỏ) Ngủ sau khi uống rượu là giấc ngủ nông và đứt quãng, không phải ngủ sâu.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/sinh-vien-my-dai-dien
  id: nhan
  cau: "Nghiên cứu trên sinh viên Mỹ thì đúng với mọi người trên thế giới: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/sinh-vien-my-dai-dien
  id: g1
  cau: "Arnett 2008 (theo Henrich 2010): tạp chí hàng đầu 2003–2007, 96% người tham gia từ nước phương Tây công nghiệp hóa (khoảng 12% dân số), 68% từ Mỹ."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/sinh-vien-my-dai-dien
  id: g2
  cau: "Henrich 2010: người WEIRD thường là ngoại lệ, thuộc nhóm ít đại diện nhất để khái quát về loài người."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/stress-hai
  id: nhan
  cau: "Căng thẳng lúc nào cũng có hại, càng tránh càng tốt: đang tranh cãi."
  loai: nhan
- trang: du-lieu/ngo-nhan/stress-hai
  id: g1
  cau: Phản ứng căng thẳng là phản ứng báo động bình thường; theo mô hình của Selye, điều đáng lo là căng thẳng kéo dài.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/stress-hai
  id: g2
  cau: 'Crum 2013 (nghiên cứu 2): nhóm xem video "stress có lợi" báo cáo ít triệu chứng tâm lý hơn và tự đánh giá hiệu suất cao hơn; đều là tự báo cáo.'
  loai: phat-hien
- trang: du-lieu/ngo-nhan/than-kinh-moi
  id: nhan
  cau: "Não người trưởng thành không sinh thêm tế bào thần kinh mới: đang tranh cãi."
  loai: nhan
- trang: du-lieu/ngo-nhan/than-kinh-moi
  id: g1
  cau: "Spalding 2013 (carbon-14 từ thử hạt nhân): khoảng 700 tế bào thần kinh mới mỗi ngày ở mỗi hồi hải mã người trưởng thành, giảm nhẹ theo tuổi."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/than-kinh-moi
  id: g2
  cau: Sorrells 2018 không thấy tế bào thần kinh non ở người trưởng thành; Boldrini 2018 thấy ở người 14–79 tuổi.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/thang-do-dung-ten
  id: nhan
  cau: "Thang đo nào cũng đo đúng thứ tên của nó gọi: sai (đã bị bác bỏ)."
  loai: nhan
- trang: du-lieu/ngo-nhan/thang-do-dung-ten
  id: g1
  cau: "Độ giá trị: điểm phản ánh đúng khái niệm cần đo; Cronbach & Meehl (1955) trình bày cách hiểu giá trị cấu trúc."
  loai: dinh-nghia
- trang: du-lieu/ngo-nhan/thap-maslow
  id: nhan
  cau: "Hình kim tự tháp nhu cầu do Maslow vẽ ra: sai (đã bị bác bỏ)."
  loai: nhan
- trang: du-lieu/ngo-nhan/thap-maslow
  id: g1
  cau: Maslow mô tả thứ bậc nhu cầu nhưng chưa bao giờ vẽ kim tự tháp.
  loai: lich-su
- trang: du-lieu/ngo-nhan/thap-maslow
  id: g2
  cau: Bài 2019 lần lại cách hình kim tự tháp ra đời và thành biểu tượng nổi tiếng nhất của ngành quản trị.
  loai: lich-su
- trang: du-lieu/ngo-nhan/thap-maslow
  id: g3
  cau: Lý thuyết của Maslow ít được nghiên cứu thực nghiệm ủng hộ.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/thoi-mien
  id: nhan
  cau: "Thôi miên giúp nhớ lại chính xác: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/thoi-mien
  id: g1
  cau: "Tổng quan 2025: thôi miên không tăng nhớ chính xác ở bất kỳ nghiên cứu nào, có khi cản trở."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/thoi-mien
  id: g2
  cau: Thôi miên làm tăng việc nhớ ra chuyện chưa từng xảy ra; ký ức ấy tồn tại lâu và người ta khá tự tin vào nó.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/thoi-mien
  id: g3
  cau: "(Đã bỏ) Thí nghiệm 96 sinh viên: nhóm bị thôi miên không đoán ngày tháng đúng hơn nhưng ít chịu sửa đáp án."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/thuc-khuya-on-thi
  id: nhan
  cau: "Thức trắng đêm thay vì ngủ sau khi học không ảnh hưởng gì đến việc nhớ bài: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/thuc-khuya-on-thi
  id: g1
  cau: "Gais 2006 (trong-nhóm, 14 học sinh): ngủ đêm sau khi học nhớ nhiều từ hơn so với thức trắng, kiểm tra sau 48 giờ, dù đã ngủ bù."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/thuc-khuya-on-thi
  id: g2
  cau: Nghiên cứu không so việc dùng đêm thức để học thêm với đi ngủ.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/thuong-nao-cung-chet
  id: nhan
  cau: "Bất kỳ phần thưởng nào cũng giết chết đam mê: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/thuong-nao-cung-chet
  id: g1
  cau: "Deci 1971: nhóm được trả tiền về sau tự nguyện chơi ít hơn (p < 0,10); nhóm được khen không giảm."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/thuong-nao-cung-chet
  id: g2
  cau: "Deci 1999 (128 nghiên cứu): thưởng vật chất trông đợi làm giảm hứng thú tự nguyện; phản hồi tích cực làm tăng (d = 0,33)."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/thuong-ngoai
  id: nhan
  cau: '"Muốn ai chăm hơn thì cứ thưởng nhiều hơn": đang tranh cãi.'
  loai: nhan
- trang: du-lieu/ngo-nhan/thuong-ngoai
  id: g1
  cau: "Deci 1999 (128 nghiên cứu): thưởng vật chất, thưởng được trông đợi làm giảm hứng thú tự nguyện."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/thuong-ngoai
  id: g2
  cau: "Phần lớn nghiên cứu làm trong phòng thí nghiệm; Cerasoli 2014: thưởng và hứng thú nội tại có thể cùng dự báo hiệu quả công việc."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/tinh-cach-dong-khuon
  id: nhan
  cau: "Tính cách đóng khuôn sau 30, không đổi được nữa: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/tinh-cach-dong-khuon
  id: g1
  cau: "Roberts & DelVecchio 2000 (152 nghiên cứu dọc): ổn định thứ hạng tăng theo tuổi (.31 thơ ấu → .64 tuổi 30 → ~.74 tuổi 50–70)."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/tinh-cach-dong-khuon
  id: g2
  cau: "Roberts 2006 (92 mẫu): tận tâm và ổn định cảm xúc tăng, nhất là ở tuổi 20–40."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/trai-dau
  id: nhan
  cau: '"Trái dấu thì hút nhau" (khác mình nhiều thì dễ hấp dẫn hơn): đã bị bác bỏ.'
  loai: nhan
- trang: du-lieu/ngo-nhan/trai-dau
  id: g1
  cau: "Phân tích tổng hợp 313 nghiên cứu: giống nhau thực tế và cảm nhận đều đi cùng sức hút mạnh; ở các mối quan hệ đã có, chỉ giống nhau cảm nhận còn liên quan."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/trai-dau
  id: g2
  cau: Bằng chứng nghiêng về "giống nhau thì hút nhau", không ủng hộ "khác nhau thì hút nhau".
  loai: phat-hien
- trang: du-lieu/ngo-nhan/tram-cam-buon
  id: nhan
  cau: 'Trầm cảm chỉ là buồn nhiều, "vui lên" là hết: sai (đã bị bác bỏ).'
  loai: nhan
- trang: du-lieu/ngo-nhan/tram-cam-buon
  id: g1
  cau: Theo WHO, giai đoạn trầm cảm khác thay đổi tâm trạng thường ngày, kéo dài gần như cả ngày, gần như mỗi ngày, ít nhất hai tuần, kèm triệu chứng khác (khó tập trung, tội lỗi hay vô dụng, rối loạn giấc ngủ, mệt mỏi…).
  loai: lam-sang
- trang: du-lieu/ngo-nhan/tram-cam-buon
  id: g2
  cau: Trầm cảm có cách điều trị hiệu quả; kỳ thị là một rào cản của việc được chăm sóc.
  loai: lam-sang
- trang: du-lieu/ngo-nhan/trang-tron
  id: nhan
  cau: "Trăng tròn làm người ta hành xử kỳ lạ hơn (tai nạn, cấp cứu, gây gổ): đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/trang-tron
  id: g1
  cau: Phân tích tổng hợp 1985 (37 nghiên cứu) không thấy mối liên hệ đáng tin giữa pha mặt trăng và rối loạn hành vi.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/trang-tron
  id: g2
  cau: "Một khoa cấp cứu ở Mỹ, 4 năm, 150.999 lượt khám: ngày trăng tròn không khác về lượt khám, xe cấp cứu, nhập viện."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/trang-tron
  id: g3
  cau: "1.444 ca chấn thương nặng trong một năm: không khác biệt ngày trăng tròn, kể cả ca do bạo lực."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/tre-so-sinh-khong-hieu
  id: nhan
  cau: "Trẻ sơ sinh chẳng hiểu gì về ngôn ngữ xung quanh: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/tre-so-sinh-khong-hieu
  id: g1
  cau: Trẻ nhỏ phân biệt được cả âm không có trong tiếng mẹ đẻ; khả năng này hẹp dần trong khoảng 6–12 tháng.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/tre-so-sinh-khong-hieu
  id: g2
  cau: "Kuhl 2003: 12 buổi (5 giờ) với người thật, trẻ 9 tháng học được cặp phụ âm Quan Thoại; video, băng thì không."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/tre-song-ngu-cham-noi
  id: nhan
  cau: "Trẻ học hai ngôn ngữ cùng lúc sẽ chậm nói: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/tre-song-ngu-cham-noi
  id: g1
  cau: Trẻ song ngữ từ nhỏ đạt mốc ngôn ngữ cùng tuổi trẻ đơn ngữ; từ đầu tiên khoảng 12 tháng.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/tre-song-ngu-cham-noi
  id: g2
  cau: "Hoff 2012 (22–30 tháng): so từng ngôn ngữ, trẻ đơn ngữ hơn về từ vựng và ngữ pháp; tổng vốn từ tương đương."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/tri-nho-may-quay
  id: nhan
  cau: "Trí nhớ hoạt động như máy quay phim: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/tri-nho-may-quay
  id: g1
  cau: Ký ức được dựng lại và có thể bị thông tin sau sự kiện làm sai lệch; hiện tượng được nghiên cứu nhiều thập kỷ với nhiều kiểu thí nghiệm.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/tri-nho-may-quay
  id: g2
  cau: "Khảo sát đại diện ở Mỹ (công bố 2011): 63% đồng ý trí nhớ hoạt động như máy quay phim."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/trung-binh-dien-hinh
  id: nhan
  cau: '"Thu nhập trung bình là thu nhập của người điển hình": sai (đã bị bác bỏ).'
  loai: nhan
- trang: du-lieu/ngo-nhan/trung-binh-dien-hinh
  id: g1
  cau: "Phân phối lệch: trung bình thường bị đuôi kéo đi nhiều hơn trung vị (quy tắc thường đúng, không phải luật)."
  loai: dinh-nghia
- trang: du-lieu/ngo-nhan/trung-binh-dien-hinh
  id: g2
  cau: Trung vị là giá trị đứng chính giữa, cho biết người đứng giữa kiếm bao nhiêu.
  loai: dinh-nghia
- trang: du-lieu/ngo-nhan/tu-kiem-tra
  id: nhan
  cau: "Tự kiểm tra giúp nhớ lâu hơn đọc lại: vững chắc."
  loai: nhan
- trang: du-lieu/ngo-nhan/tu-kiem-tra
  id: g1
  cau: "Roediger & Karpicke 2006: sau 5 phút, đọc lại nhớ tốt hơn; sau 2 ngày và một tuần, tự kiểm tra nhớ tốt hơn rõ rệt."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/tu-kiem-tra
  id: g2
  cau: Dunlosky 2013 xếp tự kiểm tra hiệu quả cao, đọc lại và tô đậm hiệu quả thấp.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/tu-the-quyen-luc
  id: nhan
  cau: '"Tư thế quyền lực" làm tăng testosterone và dám mạo hiểm hơn: đã bị bác bỏ.'
  loai: nhan
- trang: du-lieu/ngo-nhan/tu-the-quyen-luc
  id: g1
  cau: "Ranehill và cộng sự (2015), mẫu lớn nam và nữ: không thấy tác dụng lên hormone và mức chấp nhận rủi ro."
  loai: tai-lap
- trang: du-lieu/ngo-nhan/tu-the-quyen-luc
  id: g2
  cau: Năm 2016, Dana Carney viết bà không còn tin hiệu ứng tư thế quyền lực là thật.
  loai: lich-su
- trang: du-lieu/ngo-nhan/tu-the-quyen-luc
  id: g3
  cau: Carney thừa nhận phần đo cảm giác quyền lực tự báo cáo trong bài gốc đã được chọn theo kết quả.
  loai: lich-su
- trang: du-lieu/ngo-nhan/vaccine-tu-ky
  id: nhan
  cau: "Tiêm vắc-xin cho trẻ gây tự kỷ: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/vaccine-tu-ky
  id: g1
  cau: "Taylor 2014: 5 nghiên cứu đoàn hệ (1.256.407 trẻ), 5 nghiên cứu bệnh-chứng (9.920 trẻ); OR 0,99 cho tiêm chủng và tự kỷ; không liên hệ với MMR."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/xa-gian
  id: nhan
  cau: "Trút giận (đấm gối, la hét) giúp bớt giận: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/xa-gian
  id: g1
  cau: "Thí nghiệm 2002: nhóm đấm bao cát và nghĩ về người làm mình giận giận hơn và hung hăng nhất, so với nhóm không đấm bao cát."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/xa-gian
  id: g2
  cau: "Phân tích tổng hợp 2024, 154 nghiên cứu: hoạt động làm dịu (thở sâu, chánh niệm, thiền) giảm giận; hoạt động tăng kích động (đấm bao cát, chạy bộ) nhìn chung không tác dụng."
  loai: so-lieu
