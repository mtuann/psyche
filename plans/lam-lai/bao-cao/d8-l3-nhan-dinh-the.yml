  id: nhan
  cau: "Đã đăng trên báo khoa học thì kết luận là đúng: sai (đã bị bác bỏ)."
  loai: nhan
- trang: du-lieu/ngo-nhan/dang-bao-la-dung
  id: g1
  cau: "Nature (Van Noorden 2023): hơn 10.000 bài bị rút năm 2023, kỷ lục; hơn 8.000 bài của Hindawi, lý do gồm thao túng có hệ thống quy trình xuất bản và phản biện."
  loai: so-lieu
