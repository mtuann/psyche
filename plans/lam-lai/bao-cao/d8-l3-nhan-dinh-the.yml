- trang: du-lieu/ngo-nhan/bay-con-so
  id: g3
  cau: Con số chính xác còn tranh cãi; giới hạn tùy loại thông tin, cách đo và từng người.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/benh-tam-than-bao-luc
  id: nhan
  cau: "Phần lớn người có bệnh tâm thần là nguy hiểm, có xu hướng bạo lực: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/benh-tam-than-bao-luc
  id: g1
  cau: Phần lớn người sống với bệnh tâm thần không có hành vi bạo lực.
