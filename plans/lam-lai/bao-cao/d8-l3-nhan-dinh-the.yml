- trang: du-lieu/ngo-nhan/iq-co-dinh
  id: g2
  cau: "Ritchie 2018: 142 hiệu ứng từ 42 bộ dữ liệu, hơn 600.000 người; mỗi năm học thêm khoảng 1–5 điểm IQ."
