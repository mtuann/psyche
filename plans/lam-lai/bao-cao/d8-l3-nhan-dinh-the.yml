- trang: du-lieu/ngo-nhan/game-bao-luc
  id: g2
  cau: Ferguson & Kilburn (2010) cho rằng các hiệu ứng như vậy bị ước lượng quá cao, quá yếu để có ý nghĩa thực tế.
