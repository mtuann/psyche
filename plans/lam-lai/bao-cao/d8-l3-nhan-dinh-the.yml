  id: g1
  cau: "Phân tích tổng hợp 1995, thí nghiệm mù đôi có giả dược: đường không ảnh hưởng hành vi hay nhận thức của trẻ; không loại trừ tác dụng nhỏ hay ở một nhóm trẻ."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/duong-tang-dong
  id: g2
