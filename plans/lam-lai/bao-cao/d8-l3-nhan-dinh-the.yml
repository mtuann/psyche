  cau: Theo số liệu ECA ở Mỹ, tỉ lệ bạo lực quy cho riêng bệnh tâm thần nặng trong 1 năm chỉ khoảng 4%.
  loai: so-lieu
- trang: du-lieu/ngo-nhan/benh-tam-than-bao-luc
  id: g3
  cau: "NESARC (34.653 người, hai đợt): bệnh tâm thần nặng tự nó không dự báo bạo lực về sau; bạo lực đi cùng lạm dụng chất, tiền sử bạo lực, yếu tố hoàn cảnh."
  loai: lam-sang
- trang: du-lieu/ngo-nhan/benh-tam-than-bao-luc
  id: g4
  cau: Người có bệnh tâm thần nặng là nạn nhân của bạo lực thường hơn là người gây bạo lực.
  loai: lam-sang
- trang: du-lieu/ngo-nhan/cam-xuc-bam-sinh
  id: nhan
  cau: "Cảm xúc của mọi người đều giống nhau, bẩm sinh nguyên khối: đang tranh cãi."
  loai: nhan
- trang: du-lieu/ngo-nhan/cam-xuc-bam-sinh
  id: g1
  cau: Chọn nhãn từ danh sách cho sẵn, người nhiều nền văn hóa nhận diện ảnh nét mặt dàn dựng đúng trên mức may rủi.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/cam-xuc-bam-sinh
  id: g2
  cau: 'Barrett 2019: nét mặt không đủ ổn định, đặc trưng để làm "dấu vân tay" phổ quát; tranh luận chưa ngã ngũ.'
  loai: phat-hien
- trang: du-lieu/ngo-nhan/can-kiet-y-chi
