  id: g3
  cau: Big Five có bằng chứng dự báo hiệu quả công việc, còn MBTI chưa có bằng chứng tương đương; chưa có so sánh trực tiếp hai khung.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/mim-cuoi
  id: nhan
  cau: "Cứ mỉm cười là thấy vui hơn: đang tranh cãi."
  loai: nhan
- trang: du-lieu/ngo-nhan/mim-cuoi
  id: g1
  cau: "Báo cáo tái lập có đăng ký trước 2016: 17 lần làm lại thí nghiệm ngậm bút, chênh lệch 0,03 (gốc 0,82)."
