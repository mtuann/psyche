  cau: "Judge 2002 (73 mẫu): hướng ngoại .31, tận tâm .28, cởi mở .24, nhạy cảm lo âu −.24; hướng ngoại nhất quán nhất ở cả xuất hiện lẫn hiệu quả lãnh đạo."
