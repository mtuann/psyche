- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n1
  cau: 'Mô tả của trang: nghiên cứu của Ekman (1969) với người Fore ở Papua New Guinea, danh sách 6 cảm xúc cơ bản, và phê bình của Lisa Feldman Barrett về việc nét mặt có phải "chữ viết chung" của cảm xúc.'
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n2
  cau: Với bộ ảnh nét mặt chuẩn trong nghiên cứu của Ekman, phần lớn người xem ở Mỹ, Brazil và Nhật chọn đúng nhãn dự kiến.
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n3
  cau: Khuôn mặt "mắt trợn tròn miệng há hốc" có thể bị gọi là sợ hay ngạc nhiên (chỗ nhập nhằng sẽ gặp ở dưới).
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n4
  cau: Cuối thập niên 1960, Paul Ekman mang câu hỏi về nét mặt đến người Fore ở vùng núi Papua New Guinea.
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n5
  cau: Nếu người ở mọi nền văn hóa đều đọc nét mặt giống nhau, cảm xúc có thể là "phần cứng" sinh học chung; nếu không, cảm xúc có thể là thứ học từ văn hóa.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n6
  cau: Charles Darwin đã viết về nét mặt thể hiện cảm xúc phổ quát từ năm 1872.
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n7
  cau: Đến thập niên 1960, nhiều học giả cho rằng mỗi nền văn hóa có "ngôn ngữ" nét mặt riêng.
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n8
  cau: "Ekman kiểm tra trực tiếp: cho người ở các nền văn hóa khác nhau xem cùng một bộ ảnh nét mặt và yêu cầu chọn từ chỉ cảm xúc."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n9
  cau: Người Fore là cộng đồng ở vùng cao nguyên Papua New Guinea còn biệt lập cho tới cuối thập niên 1950.
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n10
  cau: Người Fore trong nghiên cứu năm 1969 đã tiếp xúc khá nhiều với người phương Tây; ở nghiên cứu năm 1971, Ekman mới chọn riêng những người gần như chưa tiếp xúc.
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n11
  cau: Người tham gia ở 5 mẫu xem cùng một bộ ảnh nét mặt của người phương Tây, rồi chọn từ cảm xúc phù hợp.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n12
  cau: Ba mẫu "biết chữ" là Mỹ, Brazil và Nhật Bản.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n13
  cau: 'Hai mẫu "tiền biết chữ" là người Fore ở New Guinea (trả lời bằng hai ngôn ngữ: Pidgin và tiếng Fore) và người ở Borneo.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n14
  cau: Với vui, sợ, giận và ghê tởm, người Fore chọn đúng nhãn ở tỉ lệ trên mức may rủi (khoảng 17% với 6 lựa chọn), nhưng thấp hơn người Mỹ.
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n15
  cau: "Bảng của trang: Fore gọi đúng vui 82%, sợ 54%, giận 50%, ghê tởm 44%; Mỹ gọi đúng vui 97%, sợ 88%, giận 69%, ghê tởm 82%."
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n16
  cau: "Nhóm trả lời bằng Pidgin: vui 99%, sợ 46%, giận 56%, ghê tởm 29%."
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n17
  cau: Ở nhóm trả lời bằng tiếng Fore, nhãn được chọn nhiều nhất cho nét mặt ngạc nhiên là "sợ" (45%) và cho nét mặt buồn là "giận" (56%).
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n18
  cau: Nét mặt vui được nhận diện tốt nhất (hoặc ngang tốt nhất) ở cả sáu nhóm, với 82–99%.
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n19
  cau: "Ở người Fore, các cảm xúc tiêu cực thấp hơn rõ rệt và hay bị gọi nhầm sang cảm xúc khác: ghê tởm lẫn với giận, sợ lẫn với giận hoặc ngạc nhiên."
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n20
  cau: Ở các mẫu biết chữ, tỉ lệ đúng cao hơn hẳn (63–97% tùy cảm xúc).
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n21
  cau: 'Các tác giả kết luận có một "yếu tố xuyên văn hóa" trong nét mặt: sự liên kết giữa chuyển động cơ mặt và các cảm xúc cơ bản; mỗi văn hóa vẫn khác nhau ở điều gây ra cảm xúc và quy tắc thể hiện.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n22
  cau: Trong bảng gốc năm 1969, "ghê tởm" được gộp chung với "khinh miệt" thành một mục.
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n23
  cau: Bộ ảnh chia theo sáu loại vui, buồn, giận, sợ, ghê tởm, ngạc nhiên, lấy từ danh sách tám cảm xúc sơ cấp của Tomkins (bỏ hứng thú và xấu hổ); về sau thường được gọi là "sáu cảm xúc cơ bản" của Ekman.
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n24
  cau: Danh sách sáu cảm xúc cơ bản là một trong những ý tưởng nổi tiếng và gây tranh cãi nhất của tâm lý học.
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n25
  cau: Nghiên cứu 1971 chọn những người Fore chưa từng xem phim, không nói tiếng Anh hay Pidgin, chưa từng sống ở thị trấn của người phương Tây.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n26
  cau: "Cách hỏi năm 1971 khác: kể một câu chuyện rồi yêu cầu chọn khuôn mặt phù hợp trong ba bức ảnh (người lớn)."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n27
  cau: 'Ví dụ câu chuyện năm 1971: "con của anh ta vừa chết" (cho nét mặt buồn).'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n28
  cau: Ở nghiên cứu 1971 người Fore chọn đúng ở trên mức may rủi trong mọi phép phân biệt, trừ sợ so với ngạc nhiên.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n29
  cau: Elfenbein và Ambady (2002) là phân tích tổng hợp về nhận diện cảm xúc trong và giữa các nền văn hóa.
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n30
  cau: "Phân tích tổng hợp 2002: cảm xúc được nhận diện đúng ở trên mức may rủi giữa các nền văn hóa trong những nghiên cứu được gộp (chỉ 5 trong 162 mẫu có một cảm xúc không hơn may rủi)."
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n31
  cau: Người ta nhận diện cảm xúc của người cùng nền văn hóa với mình chính xác hơn người khác nền văn hóa, gọi là "lợi thế trong nhóm".
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n32
  cau: Nhóm nghiên cứu ở Glasgow dùng đồ họa máy tính tái tạo "hình ảnh trong đầu" của người phương Tây và người Đông Á về sáu nét mặt cơ bản (Jack và cộng sự, 2012).
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n33
  cau: Người phương Tây có một bộ chuyển động mặt riêng biệt cho từng cảm xúc, còn người Đông Á thì không.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n34
  cau: Người Đông Á dựa nhiều vào vùng mắt để thể hiện cường độ cảm xúc.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n35
  cau: "Kết luận của Jack và cộng sự: tính phổ quát của nét mặt cảm xúc bị thách thức."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n36
  cau: "Vững chắc: khi chọn nhãn cảm xúc từ một danh sách cho sẵn, người xem ở nhiều nền văn hóa nhận diện ảnh nét mặt dàn dựng đúng ở trên mức may rủi."
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n37
  cau: Phát hiện gốc năm 1969 đã được làm lại bằng phương pháp khác (Ekman và Friesen, 1971) và được ủng hộ bởi phân tích tổng hợp toàn lĩnh vực (Elfenbein và Ambady, 2002).
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n38
  cau: Ở các cộng đồng nhỏ, biệt lập, những nghiên cứu từ sau năm 2008 cho kết quả yếu hơn nhiều.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n39
  cau: "Người cùng nền văn hóa đọc nét mặt của nhau tốt hơn: khá vững."
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n40
  cau: '"Lợi thế trong nhóm" xuất hiện ổn định trong phân tích tổng hợp 2002: ta giỏi đọc mặt người cùng văn hóa hơn.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n41
  cau: 'Một hướng giải thích liên quan, chưa được kiểm chứng riêng: người Đông Á và người phương Tây có thể "thấy" khác nhau trên cùng một khuôn mặt.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n42
  cau: 'Câu hỏi cảm xúc có phải "chương trình" sinh học phổ quát vẫn chưa ngã ngũ: tranh cãi.'
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n43
  cau: Phe Ekman cho rằng sáu cảm xúc cơ bản là sản phẩm tiến hóa, có nét mặt đặc trưng chung cho loài người.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n44
  cau: Phe kiến tạo (Barrett) cho rằng cảm xúc được não "dựng lên" từ cảm giác cơ thể, kinh nghiệm và văn hóa; nét mặt chỉ là một manh mối, không phải "dấu vân tay" của cảm xúc.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n45
  cau: Cả hai phe đều có bằng chứng, và chưa phe nào thuyết phục được phe kia.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n46
  cau: 'Lý thuyết cảm xúc cơ bản của Ekman: mỗi cảm xúc cơ bản là một "chương trình" riêng của hệ thần kinh, hình thành qua tiến hóa, có mẫu nét mặt đặc trưng và phổ quát; văn hóa can thiệp ở "quy tắc biểu hiện".'
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n47
  cau: Trong How Emotions Are Made (2017), Barrett lập luận não dự đoán và dựng lên cảm xúc trong từng khoảnh khắc từ cảm giác cơ thể, kinh nghiệm quá khứ và khái niệm cảm xúc học qua ngôn ngữ, văn hóa.
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n48
  cau: 'Theo cách nhìn kiến tạo, không có "dấu vân tay" sinh học nào cho từng cảm xúc: cùng một trạng thái sợ, người này toát mồ hôi im lặng, người kia la hét.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n49
  cau: Năm 2019, một nhóm năm nhà khoa học (trong đó có Barrett) cùng rà soát một khối lượng lớn nghiên cứu.
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n50
  cau: 'Tổng quan 2019: người ta có cười khi vui, cau mày khi buồn nhiều hơn mức may rủi, nhưng không đủ ổn định và đặc trưng giữa các bối cảnh, cá nhân và nền văn hóa để coi bất kỳ mẫu nét mặt nào là "biểu hiện chuẩn" của một cảm xúc.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n51
  cau: 'Đừng "đọc" cảm xúc chỉ từ khuôn mặt: đang tranh cãi.'
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n52
  cau: Một cái chau mày có thể là giận, tập trung, hoặc đau đầu; nét mặt là một manh mối, không phải bằng chứng.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n53
  cau: 'Cảnh giác với công nghệ "đọc cảm xúc" qua camera: đang tranh cãi.'
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n54
  cau: Nhiều công ty quảng cáo phần mềm nhận biết cảm xúc từ khuôn mặt; niềm tin rằng nét mặt cho biết cảm xúc còn ảnh hưởng tới quyết định pháp lý, an ninh và giáo dục.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n55
  cau: Barrett và cộng sự (2019) kết luận không thể tự tin suy ra cảm xúc từ một cái cười hay cau mày; một sản phẩm thương mại quảng cáo rằng các cảm xúc ấy được truyền đạt bằng nét mặt riêng biệt, phổ quát.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n56
  cau: Dùng công nghệ này để ra quyết định quan trọng về con người là điều đáng cân nhắc kỹ.
  loai: loi-khuyen
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n57
  cau: 'Chú ý "quy tắc biểu hiện" khi giao tiếp đa văn hóa: khá vững.'
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n58
  cau: Chính Ekman thừa nhận văn hóa quy định cảm xúc nào được phép thể hiện, với ai, lúc nào.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n59
  cau: Khảo sát ở 32 nước thấy ở đâu người ta cũng biểu lộ nhiều hơn với người trong nhóm so với người ngoài nhóm, còn mức biểu lộ chung và chuẩn mực cho từng cảm xúc khác nhau giữa văn hóa đề cao cá nhân và văn hóa đề cao tập thể.
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n60
  cau: Hiểu quy tắc biểu hiện giúp ta tránh suy diễn "họ lạnh lùng" hay "họ không quan tâm" chỉ vì nét mặt ít biểu cảm.
  loai: loi-khuyen
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n61
  cau: 'Đừng gộp tất cả cảm xúc khó chịu thành "buồn": Barrett cho rằng khái niệm cảm xúc ta học được sẽ định hình cảm xúc ta trải nghiệm.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n62
  cau: Nghiên cứu về "độ chi tiết cảm xúc" thấy người phân biệt cảm xúc tinh hơn ít dùng cách tự điều chỉnh có hại khi rất căng thẳng.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n63
  cau: Đó chưa phải lời khuyên chắc chắn rằng gọi tên cảm xúc thì điều tiết tốt hơn; thử gọi tên cảm xúc cụ thể hơn là việc dễ làm và có thể hữu ích.
  loai: loi-khuyen
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n64
  cau: 'Nhãn của lời khuyên số 4 ("Mở rộng vốn từ cảm xúc"): đang tranh cãi.'
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n65
  cau: Nghiên cứu gốc của Ekman (1969) không có mẫu người Việt Nam.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n66
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra việc nhận diện nét mặt cảm xúc trên người Việt.
  loai: thoi-su
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n67
  cau: Theo Barrett và cộng sự (2019), phần lớn người tham gia các nghiên cứu được gộp năm 2002 đến từ các nước công nghiệp hóa; còn lại là một số cộng đồng nhỏ, biệt lập.
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n68
  cau: 'Jack và cộng sự (2012): người Đông Á có "hình ảnh trong đầu" về nét mặt cảm xúc khác người phương Tây và dựa nhiều vào vùng mắt.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n69
  cau: Người Việt có thể gần người Đông Á về văn hóa nên cách đọc nét mặt có thể chịu ảnh hưởng tương tự, nhưng chưa có bằng chứng trực tiếp trên người Việt.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n70
  cau: 'Ngộ nhận "có đúng 6 cảm xúc cơ bản": sáu là con số từ danh sách của Ekman, lấy từ danh sách tám cảm xúc sơ cấp của Tomkins (bỏ hứng thú và xấu hổ); các lý thuyết khác đề xuất danh sách khác; ranh giới "cơ bản" là một phần của tranh cãi.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n71
  cau: 'Ngộ nhận "nhìn mặt là biết người ta đang cảm thấy gì": nét mặt cho ta một xác suất, không phải đáp án chắc chắn.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n72
  cau: 'Ngộ nhận "người ở đâu cũng thể hiện cảm xúc giống nhau": quy tắc biểu hiện của từng văn hóa rất khác nhau và ảnh hưởng đến những gì ta nhìn thấy.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n74
  cau: "Quiz 1: Ekman và Friesen (1971) chọn người Fore chưa từng xem phim, không nói tiếng Anh hay Pidgin, chưa từng sống ở thị trấn của người phương Tây."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n75
  cau: "Quiz 1, giải thích: mẫu Fore 1969 đã tiếp xúc nhiều với người phương Tây; với người gần như chưa tiếp xúc, kết quả 1971 vẫn trên mức may rủi (trừ sợ với ngạc nhiên)."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n76
  cau: "Quiz 2: trong nghiên cứu 1969, vui được người Fore nhận diện đúng cao nhất (82%)."
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n77
  cau: "Quiz 2, giải thích: nét mặt vui đạt 82–99% ở mọi mẫu; các cảm xúc tiêu cực thấp hơn nhiều và hay bị lẫn lộn."
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n78
  cau: "Quiz 3: có thể vì trong đời sống người Fore, chuyện đáng sợ hầu như luôn đến bất ngờ nên sợ và ngạc nhiên ít được tách bạch."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n79
  cau: "Quiz 3, giải thích: đây là cách giải thích Ekman và Friesen đề xuất; người Fore phân biệt được ngạc nhiên với sợ, chỉ không phân biệt được sợ với ngạc nhiên."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n80
  cau: Quiz 3, các đáp án nhiễu ("tiếng Fore không có từ", "chưa bao giờ cảm thấy sợ hay ngạc nhiên") là phương án sai giả định.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n81
  cau: 'Quiz 4: luận điểm trung tâm của Barrett trong How Emotions Are Made (2017): não dự đoán và "dựng lên" cảm xúc từ cảm giác cơ thể, kinh nghiệm và khái niệm văn hóa, cảm xúc không phải nút bấm có sẵn.'
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n82
  cau: 'Quiz 4, giải thích: cùng một nhịp tim nhanh có thể thành "hồi hộp", "sợ" hay "phấn khích" tùy bối cảnh.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n83
  cau: 'Quiz 5: "lợi thế trong nhóm" là người ta nhận diện cảm xúc trên khuôn mặt người cùng nền văn hóa chính xác hơn so với người khác nền văn hóa.'
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n84
  cau: "Quiz 5, giải thích: theo các tác giả, lợi thế này có thể liên quan đến việc người biểu lộ và người nhận chung quy tắc biểu hiện và giải mã; đây là gợi ý rằng văn hóa can thiệp vào việc đọc cảm xúc."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
  id: n85
  cau: "Nguồn của trang: thông tin thư mục (tác giả, năm, tạp chí, tập, trang, DOI) của Ekman, Sorenson & Friesen 1969; Ekman & Friesen 1971; Elfenbein & Ambady 2002; Jack và cộng sự 2012; Barrett và cộng sự 2019."
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n1
  cau: Deci (1971) đã làm thí nghiệm Soma puzzle (mô tả của trang).
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n2
  cau: Năm 1999, một phân tích tổng hợp gộp 128 nghiên cứu về tác động của thưởng ngoài lên hứng thú nội tại (mô tả của trang).
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n3
  cau: Một loạt thí nghiệm từ thập niên 1970 (Deci 1971; Lepper và cộng sự 1973) cho thấy phần thưởng bên ngoài có thể làm giảm hứng thú với việc ta từng yêu thích, nên câu trả lời có thể khác với điều ta tưởng.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n4
  cau: "Hiện tượng này gọi là hiệu ứng xói mòn (undermining effect): phần thưởng bên ngoài, trong một số điều kiện, làm giảm hứng thú bên trong với việc ta từng yêu thích; không xảy ra với mọi loại thưởng."
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n5
  cau: Động lực nội tại (intrinsic motivation) là làm vì bản thân việc đó đã thú vị.
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n6
  cau: Động lực ngoại tại (extrinsic motivation) là làm vì phần thưởng hay sức ép bên ngoài (ví dụ điểm số, lương).
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n7
  cau: Năm 1971, Edward Deci hỏi liệu động lực ngoại tại có thể làm xói mòn động lực nội tại, và ông đo hành vi của người tham gia trong phòng thí nghiệm.
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n8
  cau: Deci làm hai thí nghiệm trong phòng lab (mỗi thí nghiệm 24 sinh viên) và một thí nghiệm thực địa (8 sinh viên).
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n9
  cau: "Thí nghiệm lab dùng câu đố Soma: bộ 7 mảnh nhựa có thể ghép thành vô số hình khối khác nhau, một trò chơi trí tuệ mà sinh viên thấy khá cuốn."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n10
  cau: Mỗi người tham gia trải qua 3 giai đoạn; giai đoạn 1 mọi người ghép hình như nhau, không ai được trả.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n11
  cau: Ở giai đoạn 2, nhóm thưởng được trả tiền cho mỗi cấu hình xếp đúng; nhóm đối chứng không được gì.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n12
  cau: Ở giai đoạn 3, tiền thưởng bị rút lại với lý do "hết kinh phí".
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n13
  cau: Giữa mỗi buổi, người nghiên cứu rời phòng 8 phút, để lại câu đố Soma và vài cuốn tạp chí; không ai yêu cầu làm gì.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n14
  cau: Thước đo chính của Deci là thời gian mỗi người tự nguyện chơi ghép hình trong lúc được tự do chọn, được coi là thước đo hứng thú nội tại.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n15
  cau: Ở giai đoạn 3, nhóm từng được trả tiền dành ít thời gian tự nguyện cho câu đố hơn lúc đầu, trong khi nhóm đối chứng không giảm.
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n16
  cau: Với chỉ 12 người mỗi nhóm, khác biệt này mới ở mức ý nghĩa thống kê lỏng (p < 0,10), nên Deci coi đây là bằng chứng ủng hộ bước đầu.
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n17
  cau: Các nghiên cứu về sau mới cho thấy hiệu ứng xói mòn rõ hơn (phân tích tổng hợp 1999).
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n18
  cau: Ở thí nghiệm dùng lời khen và phản hồi tích cực thay vì tiền, nhóm được khen không giảm thời gian tự nguyện trong khi nhóm đối chứng giảm; so với nhóm đối chứng, hứng thú có xu hướng tăng.
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n19
  cau: Lý thuyết đánh giá nhận thức do Deci và Ryan (1985) phát triển về sau từ các kết quả như vậy.
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n20
  cau: Theo lý thuyết đánh giá nhận thức, mỗi phần thưởng có mặt kiểm soát và mặt thông tin; tiền thưởng hứa trước nghiêng về mặt kiểm soát, lời khen chân thành nghiêng về mặt thông tin.
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n21
  cau: Lepper, Greene và Nisbett (1973) cho trẻ mẫu giáo, vốn đã có hứng thú vẽ, vẽ bằng bút dạ màu.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n22
  cau: Một nhóm được hứa trước một tấm giấy khen "Người chơi giỏi" nếu đồng ý vẽ (phần thưởng không phụ thuộc vẽ đẹp hay xấu); nhóm khác không hứa nhưng được thưởng bất ngờ; nhóm thứ ba không thưởng.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n23
  cau: Một đến hai tuần sau, khi không còn thưởng, nhóm từng được hứa thưởng vẽ ít hơn rõ rệt hai nhóm còn lại (8,6% thời gian tự do so với 16,7% và 18,1%).
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n24
  cau: Nhóm được thưởng bất ngờ không giảm hứng thú vẽ.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n25
  cau: 'Giả thuyết quá biện minh (overjustification) của Lepper và cộng sự: khi có phần thưởng hứa trước, trẻ tự suy luận "mình vẽ vì được thưởng"; khi thưởng biến mất, lý do vẽ cũng biến mất.'
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n26
  cau: Cameron và Pierce (1994) kết luận rằng nhìn chung thưởng không làm giảm hứng thú nội tại.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n27
  cau: Sau đó Eisenberger và Cameron (1996), theo cách Deci và cộng sự kể lại, cho rằng hiệu ứng xói mòn phần lớn là huyền thoại.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n28
  cau: Cuộc tranh cãi diễn ra suốt thập niên 1990, sau khi phân tích tổng hợp của Cameron và Pierce (1994) ra đời.
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n29
  cau: Deci, Koestner và Ryan (1999) rà soát lại 128 thí nghiệm, phân loại thưởng theo từng dạng cụ thể.
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n30
  cau: "Thưởng cụ thể, hứa trước, gắn với việc tham gia nhiệm vụ: d = −0,40 (hành vi tự chọn)."
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n31
  cau: "Thưởng cụ thể, hứa trước, gắn với việc hoàn thành nhiệm vụ: d = −0,36."
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n32
  cau: "Thưởng cụ thể, hứa trước, gắn với làm tốt hay đạt chuẩn: d = −0,28."
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n33
  cau: "Thưởng cụ thể bất ngờ (không hứa trước): hiệu ứng gần 0 (không đáng kể)."
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n34
  cau: "Lời khen / phản hồi tích cực bằng lời: d = +0,33 (tăng hứng thú)."
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n35
  cau: Các hiệu ứng trong bảng đo bằng thời gian tự nguyện sau khi hết thưởng; d âm nghĩa là xói mòn.
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n36
  cau: Thưởng cụ thể, hứa trước, gắn với việc thực hiện nhiệm vụ thú vị làm xói mòn hứng thú nội tại ổn định; thưởng bất ngờ và lời khen mang tính thông tin thì không, lời khen còn có lợi.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n37
  cau: Thưởng cụ thể có xu hướng gây hại nhiều hơn ở trẻ em so với sinh viên đại học; lời khen có xu hướng tăng hứng thú tự chọn rõ hơn ở sinh viên so với trẻ em.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n38
  cau: "Khá vững: thưởng cụ thể, hứa trước, gắn với nhiệm vụ thú vị làm giảm hứng thú tự nguyện về sau."
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n39
  cau: Hiệu ứng thưởng cụ thể hứa trước xuất hiện ổn định trong phân tích tổng hợp 128 nghiên cứu của Deci, Koestner và Ryan (1999), với độ lớn nhỏ đến trung bình (d ≈ −0,28 đến −0,40 tùy loại thưởng).
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n40
  cau: "Giới hạn: phần lớn nghiên cứu là thí nghiệm trong phòng thí nghiệm hay điều kiện giống phòng thí nghiệm, đo hứng thú bằng thời gian tự chọn, trên trẻ em và sinh viên."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n41
  cau: Mức độ của hiệu ứng trong đời sống thực còn được bàn cãi.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n42
  cau: "Khá vững: không phải mọi loại thưởng đều hại (thưởng bất ngờ không xói mòn; lời khen thông tin còn tăng hứng thú)."
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n43
  cau: Thưởng bất ngờ (không hứa trước) không xói mòn hứng thú, và lời khen/phản hồi tích cực mang tính thông tin còn tăng hứng thú (d ≈ +0,33).
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n44
  cau: Hiệu ứng xói mòn chỉ có ý nghĩa khi nhiệm vụ vốn đã thú vị; với việc nhàm chán, tác hại của thưởng cụ thể không thấy.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n45
  cau: "Đang tranh cãi: hiệu ứng trong đời thực lớn đến đâu?"
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n46
  cau: Eisenberger và Cameron (1996) phản biện rằng tác hại của phần thưởng chỉ xuất hiện trong những điều kiện rất hẹp và dễ tránh, chẳng hạn khi phần thưởng không phụ thuộc vào việc làm tốt hay không.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n47
  cau: Phân tích tổng hợp của Cerasoli, Nicklin và Ford (2014) cho thấy thưởng và hứng thú nội tại có thể cùng dự báo hiệu quả công việc.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n48
  cau: Vì vậy mức độ nghiêm trọng của hiệu ứng ngoài phòng thí nghiệm vẫn là chủ đề tranh luận.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n49
  cau: "Lý thuyết đánh giá nhận thức (Deci và Ryan): khi phần thưởng khiến ta cảm thấy hành vi bị điều khiển từ bên ngoài, cảm giác tự chủ giảm và hứng thú xói mòn; khi nó cho thông tin về năng lực, hứng thú được nuôi dưỡng."
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n50
  cau: Tiền thưởng hứa trước nghiêng về mặt kiểm soát; lời khen cụ thể nghiêng về mặt thông tin.
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n51
  cau: "Giả thuyết quá biện minh dựa trên lý thuyết tự nhận thức: con người suy ra động cơ của chính mình từ hành vi."
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n52
  cau: Thưởng bất ngờ không gây ra suy luận "mình vẽ vì tiền", vì lúc làm việc trẻ không biết sẽ có thưởng.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n53
  cau: "Lý thuyết tự quyết (Ryan và Deci, 2000): con người có ba nhu cầu tâm lý cơ bản (tự chủ, năng lực, gắn kết); hứng thú nội tại nảy nở khi các nhu cầu được đáp ứng."
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n54
  cau: Phần thưởng kiểm soát "đánh" vào nhu cầu tự chủ, còn phản hồi thông tin "nuôi" nhu cầu năng lực.
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n55
  cau: Phân tích tổng hợp 40 năm của Cerasoli, Nicklin và Ford (2014) trên 183 mẫu với hơn 212.000 người.
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n56
  cau: Hứng thú nội tại dự báo chất lượng công việc tốt hơn, còn thưởng dự báo số lượng tốt hơn; hai thứ có thể cùng tồn tại và cùng có ích.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n57
  cau: 'Khá vững: đừng biến sở thích của trẻ thành "công việc có lương".'
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n58
  cau: Hứa thưởng đều đặn cho sở thích có sẵn của trẻ có nguy cơ biến sở thích thành nghĩa vụ; khi thưởng dừng lại, hứng thú có thể thấp hơn cả lúc ban đầu.
  loai: loi-khuyen
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n59
  cau: "Khá vững: khen cụ thể, mang tính thông tin, thay vì thưởng vật chất hứa trước."
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n60
  cau: Phản hồi về quá trình và sự kiên trì củng cố cảm giác năng lực mà không tạo cảm giác bị kiểm soát.
  loai: loi-khuyen
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n61
  cau: "Khá vững: nếu muốn thưởng, hãy để nó bất ngờ."
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n62
  cau: Thưởng bất ngờ sau khi việc đã xong không xói mòn hứng thú, vì người nhận không kịp quy hành vi của mình cho phần thưởng.
  loai: loi-khuyen
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n63
  cau: "Khá vững: với việc nhàm chán, thưởng ít rủi ro hơn."
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n64
  cau: Hiệu ứng xói mòn chỉ "có cái để xói" khi việc vốn đã thú vị; với việc nhàm chán mà ai cũng ngại, các nghiên cứu không thấy thưởng làm giảm hứng thú, vì vốn không có nhiều hứng thú nội tại để mất.
  loai: loi-khuyen
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n65
  cau: "Đang tranh cãi: tách thưởng khỏi đam mê, gắn thưởng vào công việc."
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n66
  cau: Dùng thưởng cho việc cần hoàn thành (doanh số, deadline) và bảo vệ hoạt động vì đam mê khỏi logic thưởng – phạt; ranh giới này hợp lý theo lý thuyết, nhưng hiệu quả trong tổ chức thực tế vẫn còn được nghiên cứu thêm.
  loai: loi-khuyen
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n67
  cau: Các thí nghiệm gốc của Deci (1971) và Lepper và cộng sự (1973) đều làm trên sinh viên đại học và trẻ mẫu giáo ở Mỹ.
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n68
  cau: 128 nghiên cứu trong phân tích tổng hợp 1999 đều là thí nghiệm công bố bằng tiếng Anh trong các cơ sở dữ liệu PsycINFO và ERIC (1971 đến 8/1997), nên nhiều khả năng cũng chủ yếu đến từ phương Tây.
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n69
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra trực tiếp hiệu ứng xói mòn trên người Việt Nam.
  loai: thoi-su
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n70
  cau: Chưa có bằng chứng trực tiếp nào cho thấy hiệu ứng diễn ra giống hay khác ở Việt Nam; mọi áp dụng trong bài dựa trên bằng chứng phương Tây, nên chỉ là gợi ý để thử nghiệm trong gia đình, lớp học của mình.
  loai: thoi-su
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n71
  cau: '"Thưởng luôn tốt — càng thưởng càng hăng": sai một nửa; thưởng có thể tăng số lượng công việc, nhưng với việc vốn đã thú vị, thưởng hứa trước có thể làm giảm hứng thú lâu dài.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n72
  cau: '"Thưởng luôn xấu — đừng bao giờ thưởng": cũng sai; thưởng bất ngờ, lời khen mang tính thông tin và thưởng cho việc nhàm chán đều không thấy làm giảm hứng thú; riêng lời khen còn có xu hướng tăng hứng thú.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n73
  cau: '"Khen cũng hại như thưởng tiền": ngược lại, lời khen/phản hồi tích cực có xu hướng tăng hứng thú (d ≈ +0,33); vấn đề là thưởng như thế nào.'
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n74
  cau: Hiệu ứng xói mòn nói về hứng thú sau khi thưởng không còn; trong lúc đang được thưởng, người ta vẫn làm việc chăm chỉ, thậm chí chăm hơn.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n78
  cau: "Quiz 1: trong thí nghiệm của Deci (1971), hứng thú nội tại được đo bằng thời gian họ tự nguyện chơi ghép hình khi người nghiên cứu rời phòng và trên bàn có cả tạp chí."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n79
  cau: "Quiz 1, lời giải thích: thước đo hành vi tự chọn không dựa vào lời nói hay thành tích lúc đang được thưởng, nên được dùng như một thước đo hứng thú nội tại."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n80
  cau: "Quiz 2: theo phân tích tổng hợp DKR (1999), thưởng cụ thể, hứa trước, gắn với việc tham gia hoặc hoàn thành một nhiệm vụ thú vị xói mòn mạnh nhất; thưởng bất ngờ gần như không có hiệu ứng; lời khen mang tính thông tin tăng hứng thú (d ≈ −0,28 đến −0,40)."
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n81
  cau: 'Quiz 3: nhóm trẻ được thưởng bất ngờ trong nghiên cứu của Lepper và cộng sự (1973) không bị giảm hứng thú vẽ vì lúc vẽ trẻ không biết sẽ có thưởng, nên không suy luận "mình vẽ vì được thưởng"; chỉ khi thưởng hứa trước, trẻ mới quy hành vi cho phần thưởng.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n82
  cau: 'Quiz 4: thưởng cho việc nhàm chán ít rủi ro hơn vì hiệu ứng xói mòn chỉ "có cái để xói" khi đã có hứng thú nội tại từ trước; với việc nhàm chán, các nghiên cứu không thấy thưởng làm giảm hứng thú.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
  id: n83
  cau: "Quiz 5: Eisenberger và Cameron (1996) phản biện rằng tác hại của phần thưởng chỉ xuất hiện trong những điều kiện hẹp, dễ tránh."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n1
  cau: 'Mô tả (description) của trang: thí nghiệm của James Gross (1998) cho thấy kìm nén biểu hiện cảm xúc làm "mặt lạnh" nhưng không làm "lòng nguội": trải nghiệm cảm xúc tiêu cực không giảm, cơ thể còn bị kích hoạt mạnh hơn.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n2
  cau: "Mô tả: các nghiên cứu sau cho thấy trí nhớ và quan hệ xã hội cũng có thể phải trả giá khi kìm nén."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n3
  cau: "Tự trải nghiệm: tình huống bị sếp phê bình trong buổi họp, Cách A (giữ vẻ mặt bình thản) và Cách B (tự nhủ cách hiểu khác) là tình huống giả định để minh họa, không phải số liệu."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n4
  cau: Kìm nén biểu cảm (expressive suppression) là che giấu đầu ra bên ngoài của cảm xúc đã bùng lên bên trong.
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n5
  cau: Tái đánh giá nhận thức (cognitive reappraisal) là diễn giải lại tình huống để cảm xúc ngay từ đầu đã bớt dữ dội.
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n6
  cau: Trong tình huống ở đầu bài, nghiên cứu cho thấy hai cách khác nhau rất xa về "cái giá" phải trả, dù từ bên ngoài cả hai đều có thể trông bình tĩnh.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n7
  cau: "James Gross gọi khung nhìn này là mô hình quá trình điều tiết cảm xúc: cảm xúc hình thành qua chuỗi tình huống, chú ý, đánh giá, phản ứng; có thể can thiệp ở từng mắt xích (chọn hay sửa tình huống, chuyển hướng chú ý, diễn giải lại, kìm nén phản ứng)."
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n8
  cau: Can thiệp sớm (antecedent-focused), điển hình là tái đánh giá, diễn ra trước khi phản ứng cảm xúc hình thành đầy đủ; hiệu quả lan tới cả trải nghiệm bên trong.
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n9
  cau: "Can thiệp muộn (response-focused), điển hình là kìm nén: phản ứng đã bùng lên, chỉ còn cách ghìm lại những gì lộ ra ngoài (nét mặt, giọng nói, cử chỉ); với cảm xúc tiêu cực, trải nghiệm bên trong không giảm đi."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n10
  cau: Tái đánh giá thay đổi "bộ phim" đang chiếu trong đầu; kìm nén chỉ giữ gương mặt không phản chiếu bộ phim đó (ví von tóm các điều trên).
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n11
  cau: 'Hình gross-model, số 1: "Chọn tình huống" (đặt trước ô Tình huống).'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n12
  cau: 'Hình gross-model, số 2: "Làm đổi tình huống" (đặt trước ô Tình huống).'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n13
  cau: 'Hình gross-model, số 3: "Chuyển hướng chú ý" (đặt trước ô Chú ý).'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n14
  cau: 'Hình gross-model, số 4: "Tái đánh giá nhận thức" (đặt trước ô Đánh giá).'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n15
  cau: 'Hình gross-model, số 5: "Kiềm chế biểu hiện" (đặt trước ô Phản ứng); chú thích hình nói bốn mắt xích đầu là can thiệp sớm, can thiệp càng sớm càng đổi được cả quỹ đạo cảm xúc.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n16
  cau: James Gross (Đại học Stanford) mời 120 người tham gia xem một đoạn phim gây kinh tởm trong khi máy móc ghi lại trải nghiệm chủ quan, biểu hiện hành vi và các chỉ số sinh lý.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n17
  cau: 'Ba nhóm nhận ba chỉ dẫn: tái đánh giá ("nghĩ về đoạn phim sao cho không cảm thấy gì"), kìm nén ("cư xử sao cho người nhìn vào không biết bạn đang cảm thấy gì"), đối chứng (chỉ xem phim).'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n18
  cau: So với nhóm đối chứng, cả hai nhóm điều tiết đều giảm được biểu hiện cảm xúc ra bên ngoài.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n19
  cau: Nhóm tái đánh giá giảm được cả trải nghiệm kinh tởm chủ quan.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n20
  cau: Nhóm kìm nén không giảm được trải nghiệm kinh tởm.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n21
  cau: Nhóm kìm nén còn tăng hoạt động của hệ thần kinh giao cảm (cơ thể bị kích hoạt mạnh hơn); mặt lạnh nhưng cơ thể căng hơn cả khi không kìm nén.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n22
  cau: "Richards và Gross: ở nghiên cứu 1, người tham gia xem một đoạn phim với chỉ dẫn kìm nén; ở nghiên cứu 2, xem các slide hình ảnh tiêu cực kèm thông tin đi kèm (tên, nghề, nguyên nhân bị thương của người trong ảnh) với chỉ dẫn kìm nén hoặc tái đánh giá; sau đó kiểm tra trí nhớ; nghiên cứu 3 hỏi về thói quen kìm nén và tái đánh giá thường ngày."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n23
  cau: Kìm nén làm trí nhớ kém đi, cả với chi tiết của đoạn phim (nghiên cứu 1) lẫn với slide (nghiên cứu 2); tái đánh giá không làm trí nhớ kém đi (nghiên cứu 2).
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n24
  cau: Ở nghiên cứu thứ ba, người có thói quen kìm nén báo cáo trí nhớ của mình kém hơn và cũng làm kém hơn ở bài kiểm tra trí nhớ khách quan; tái đánh giá không có mối liên hệ ấy.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n25
  cau: "Cách giải thích: kìm nén đòi hỏi phải liên tục tự quản lý các phản ứng cảm xúc đang trỗi dậy, việc này có thể chiếm nguồn lực nhận thức vốn dành cho việc ghi nhận thông tin xung quanh."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n26
  cau: Gross và John xây dựng thang đo ERQ (10 câu hỏi) để đo thói quen dùng tái đánh giá và kìm nén trong đời sống, qua 5 nghiên cứu.
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n27
  cau: Người có thói quen tái đánh giá trải nghiệm và thể hiện nhiều cảm xúc tích cực hơn, ít cảm xúc tiêu cực hơn.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n28
  cau: Người có thói quen tái đánh giá có các mối quan hệ tốt hơn.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n29
  cau: Người có thói quen tái đánh giá hài lòng với cuộc sống hơn.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n30
  cau: Người hay kìm nén trải nghiệm và thể hiện ít cảm xúc tích cực hơn, nhưng trải nghiệm nhiều cảm xúc tiêu cực hơn (dù không để lộ ra nhiều hơn).
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n31
  cau: Người hay kìm nén có các mối quan hệ xã hội kém hơn.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n32
  cau: Đây là các nghiên cứu tương quan, không chứng minh nhân quả.
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n33
  cau: 'Các tác giả gợi ý một phần lý do: người hay kìm nén thấy mình "không thật" (inauthentic), ngại chia sẻ cảm xúc và tránh các mối quan hệ gần gũi, còn bạn bè của họ có thể nhận ra những nỗ lực kìm nén ấy.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n34
  cau: Webb và cộng sự gom 306 phép so sánh thực nghiệm về các chiến lược điều tiết cảm xúc vào một phân tích tổng hợp.
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n35
  cau: "Nhóm thay đổi nhận thức (cognitive change, gồm tái đánh giá) có hiệu quả từ nhỏ đến vừa: d+ = 0,36."
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n36
  cau: "Nhóm điều tiết phản ứng (response modulation, gồm kìm nén) có hiệu quả nhỏ: d+ = 0,16."
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n37
  cau: Kìm nén biểu hiện ra ngoài có hiệu quả (d+ = 0,32).
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n38
  cau: Kìm nén trải nghiệm cảm xúc (d+ = −0,04) hay kìm nén suy nghĩ về sự việc (d+ = −0,12) thì không có hiệu quả.
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n39
  cau: Trong nhóm tái đánh giá, diễn giải lại kích thích gây cảm xúc (d+ = 0,36) và lấy góc nhìn khác (d+ = 0,45) cho hiệu quả tốt hơn diễn giải lại phản ứng cảm xúc của chính mình (d+ = 0,23).
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n40
  cau: 'Phân tích tìm thấy nhiều yếu tố điều tiết hiệu quả: loại cảm xúc cần điều tiết, mục đích sử dụng chiến lược, thiết kế nghiên cứu; "cách nào tốt hơn" còn tùy vào việc đang điều tiết cái gì để làm gì.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n41
  cau: "Aldao và cộng sự: phân tích tổng hợp các nghiên cứu tương quan về tâm bệnh thấy né tránh, nhai lại và kìm nén thường đi cùng triệu chứng tâm lý nặng hơn (nhai lại rõ nhất); tái đánh giá và chấp nhận đi cùng triệu chứng nhẹ hơn, ở mức nhỏ đến vừa."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n42
  cau: Đây là nghiên cứu tương quan nên không chứng minh được nhân quả; bức tranh nhất quán với các thí nghiệm của Gross.
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n43
  cau: "Vững chắc: kìm nén giảm biểu hiện bên ngoài, nhưng không giảm trải nghiệm cảm xúc tiêu cực bên trong."
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n44
  cau: 'Kết quả cốt lõi của Gross (1998): cả hai chiến lược đều che được "mặt", chỉ tái đánh giá làm dịu được "lòng"; được củng cố bởi phân tích tổng hợp của Webb và cộng sự (2012): kìm nén biểu hiện có hiệu quả (d+ = 0,32), còn kìm nén trải nghiệm cảm xúc thì không (d+ = −0,04).'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n45
  cau: Riêng với cảm xúc tích cực, kìm nén lại làm giảm cả trải nghiệm.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n46
  cau: "Khá vững: kìm nén đi kèm cái giá sinh lý và nhận thức."
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n47
  cau: Kìm nén làm tăng hoạt động hệ thần kinh giao cảm (Gross, 1998).
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n48
  cau: Kìm nén làm trí nhớ về thông tin đi kèm kém đi trong phòng thí nghiệm và ở người có thói quen kìm nén (Richards và Gross, 2000).
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n49
  cau: Người hay kìm nén có các mối quan hệ xã hội kém hơn (Gross và John, 2003); phần lớn bằng chứng là các thí nghiệm đơn lẻ của cùng một nhóm và các nghiên cứu tương quan, chưa có phân tích tổng hợp riêng cho từng cái giá.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n50
  cau: "Khá vững: không chiến lược nào luôn tốt hay luôn xấu; hiệu quả phụ thuộc bối cảnh (khung nhãn; trước là \"Đang tranh cãi: 'tái đánh giá luôn tốt, kìm nén luôn xấu' có phải quy tắc chung?\")."
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n51
  cau: Kìm nén biểu hiện có hiệu quả trong các thí nghiệm (d+ = 0,32), và trong nhiều tình huống xã hội (đám tang, phòng họp, khi chăm người bệnh) người ta có lý do chính đáng để tạm giữ vẻ ngoài.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n52
  cau: Hiệu quả của các chiến lược thay đổi theo loại cảm xúc, mục đích sử dụng và thiết kế nghiên cứu, nên không có chiến lược nào hay hay dở cho mọi lúc mọi nơi.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n53
  cau: 'Logic thời điểm của mô hình quá trình: can thiệp càng sớm, càng có thể thay đổi cả quỹ đạo của cảm xúc (chú ý, đánh giá, phản ứng); can thiệp muộn thì cảm xúc đã hình thành đầy đủ, chỉ còn "khóa van đầu ra", với cảm xúc tiêu cực trải nghiệm bên trong không giảm.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n54
  cau: Theo Gross và John (2003), kìm nén đòi hỏi phải liên tục quản lý các phản ứng cảm xúc đang trỗi dậy và việc này có thể chiếm nguồn lực nhận thức; đây là cách giải thích cho việc kìm nén làm trí nhớ về thông tin đi kèm kém đi (Richards và Gross, 2000), còn tái đánh giá thì không.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n55
  cau: "Cảm xúc là tín hiệu xã hội: biểu cảm giúp người khác đọc được trạng thái của ta và điều chỉnh tương tác."
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n56
  cau: Gross và John (2003) gợi ý rằng khi kìm nén người ta thấy mình "không thật", ngại chia sẻ cảm xúc và tránh sự gần gũi, trong khi bạn bè có thể nhận ra nỗ lực kìm nén ấy; đây là một cách giải thích cho việc người hay kìm nén có các mối quan hệ kém gần gũi hơn.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n57
  cau: 'Áp dụng 1 (:nhan[kha-vung]): đừng đợi đến lúc "máu đã dồn lên mặt"; theo mô hình quá trình, can thiệp càng sớm càng có thể thay đổi nhiều khâu của cảm xúc, nên hãy thử diễn giải lại ngay từ đầu.'
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n58
  cau: 'Áp dụng 1 (câu hỏi): "Còn cách hiểu nào khác về chuyện này không? Nếu là một người ngoài cuộc bình tĩnh, họ sẽ thấy gì?" là cách gợi ý tự đặt câu hỏi, không phải khẳng định về bằng chứng.'
  loai: loi-khuyen
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n59
  cau: "Áp dụng 2 (:nhan[kha-vung]): trong các thí nghiệm, kìm nén không làm trải nghiệm cảm xúc tiêu cực giảm đi, mà đi kèm hoạt động giao cảm tăng và trí nhớ về thông tin đi kèm kém đi; hãy tự kiểm tra cơ thể (vai gồng, hơi thở nông) sau khi gồng giữ vẻ ngoài."
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n60
  cau: "Áp dụng 3 (:nhan[kha-vung]): kìm nén có lúc là lựa chọn đúng đắn (chăm người bệnh, giữ không khí trang nghiêm); phân tích tổng hợp cho thấy kìm nén biểu hiện có hiệu quả trong các thí nghiệm; ở người hay kìm nén, quan hệ xã hội và nhiều chỉ số well-being kém hơn (nghiên cứu tương quan)."
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n61
  cau: "Áp dụng 4 (:nhan[kha-vung]): trong thí nghiệm, kìm nén làm trí nhớ về thông tin đi kèm kém đi; chưa có nghiên cứu trực tiếp về cuộc họp thật, nhưng ghi chép lại hay xin biên bản bằng văn bản là việc không tốn gì."
  loai: nhan
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n62
  cau: Ba nghiên cứu then chốt của nhóm Gross đều làm ở Hoa Kỳ (Stanford, Berkeley).
  loai: lich-su
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n63
  cau: "Tính đến 11/2026, chúng tôi chưa tìm thấy thí nghiệm nào so sánh trực tiếp tái đánh giá với kìm nén trên người Việt; chỉ thấy hai nghiên cứu cắt ngang trên người bị bỏng ở Bệnh viện Bỏng Quốc gia (256 người: tái đánh giá đi cùng chất lượng sống liên quan sức khỏe cao hơn, kìm nén đi cùng thấp hơn; 146 người: hai chiến lược không làm thay đổi mối liên hệ giữa mức phản ứng cảm xúc và triệu chứng)."
  loai: thoi-su
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n64
  cau: Butler, Lee và Gross (2007) thấy hậu quả xã hội tiêu cực của kìm nén yếu đi ở những người mang giá trị Á Đông nhiều hơn; nghiên cứu ấy không có mẫu người Việt.
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n65
  cau: 'Ngộ nhận 1: trong thí nghiệm của Gross (1998) kìm nén đi kèm tăng hoạt động hệ thần kinh giao cảm; ở người hay kìm nén, nghiên cứu tương quan thấy ít cảm xúc tích cực và nhiều cảm xúc tiêu cực hơn (Gross và John, 2003). Bình tĩnh thật sự và "giữ mặt lạnh" là hai việc khác nhau.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n66
  cau: 'Ngộ nhận 2: tái đánh giá là diễn giải lại ý nghĩa của tình huống để đổi tác động cảm xúc của nó, ví dụ nhìn nhận áp lực của sếp thay vì mặc định "sếp ghét mình"; các nghiên cứu ở đây không so sánh cách diễn giải sát sự thật với cách tô hồng, nên bài không khẳng định cách nào hiệu quả hơn.'
  loai: dinh-nghia
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n67
  cau: "Ngộ nhận 3: kìm nén biểu hiện có hiệu quả trong các thí nghiệm (Webb và cộng sự, 2012), và trong nhiều tình huống xã hội là lựa chọn có lý do; điều đáng lưu ý là việc dùng nó thường xuyên, thành thói quen (Gross và John, 2003)."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n68
  cau: 'Quiz 1: trong thí nghiệm của Gross (1998), cả hai nhóm đều giảm được biểu hiện bên ngoài, nhưng chỉ nhóm tái đánh giá giảm được trải nghiệm kinh tởm; nhóm kìm nén còn tăng hoạt động hệ thần kinh giao cảm. Lời giải thích: kìm nén che được "mặt" nhưng không làm dịu được "lòng", và hoạt động giao cảm còn tăng.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n69
  cau: "Quiz 2: theo mô hình quá trình, tái đánh giá (can thiệp sớm) thường hiệu quả hơn kìm nén (can thiệp muộn) vì can thiệp trước khi phản ứng cảm xúc hình thành đầy đủ có thể thay đổi cả quỹ đạo cảm xúc; can thiệp muộn thì cảm xúc đã bùng lên, chỉ còn cách ghìm đầu ra hành vi. Lời giải thích: theo mô hình, càng sớm càng có thể thay đổi cả quỹ đạo."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n70
  cau: "Quiz 3: Richards và Gross (2000) phát hiện kìm nén làm trí nhớ về thông tin gặp trong lúc kìm nén (chi tiết của phim, của slide) kém đi; tái đánh giá thì không. Lời giải thích: kìm nén đòi hỏi phải liên tục quản lý phản ứng cảm xúc, việc này có thể chiếm nguồn lực nhận thức dành cho ghi nhận thông tin xung quanh."
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n71
  cau: "Quiz 4: phân tích tổng hợp của Webb, Miles và Sheeran (2012): thay đổi nhận thức (d+ = 0,36) hiệu quả hơn điều tiết phản ứng (d+ = 0,16); kìm nén biểu hiện có hiệu quả (d+ = 0,32), nhưng kìm nén trải nghiệm cảm xúc hay suy nghĩ thì không. Lời giải thích: ngay trong cùng một nhóm chiến lược, các biến thể nhỏ cũng cho hiệu quả khác nhau rõ rệt."
  loai: so-lieu
- trang: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc
  id: n72
  cau: 'Quiz 5: người có thói quen kìm nén có các mối quan hệ xã hội kém hơn (Gross và John, 2003); các tác giả gợi ý vì họ thấy mình "không thật", ngại chia sẻ cảm xúc và tránh sự gần gũi, còn bạn bè có thể nhận ra nỗ lực kìm nén; họ cũng trải nghiệm ít cảm xúc tích cực và nhiều cảm xúc tiêu cực hơn. Lời giải thích: đây là kết quả tương quan, chưa chứng minh được nhân quả.'
  loai: phat-hien
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n17
  cau: Bài báo mở đầu bằng câu hỏi "trí tuệ cảm xúc" có phải một mâu thuẫn trong thuật ngữ, vì một truyền thống tư tưởng vẫn coi cảm xúc là thứ cản trở lý trí.
  loai: lich-su
  nguon:
    - ten: "Salovey & Mayer (1990), Imagin Cogn Pers 9(3), 185–211: toàn văn (PDF trong Internet Archive, bộ wikipedia-scholarly-sources-corpus)"
      link: https://doi.org/10.2190/DUGG-P24E-52WK-6CDG
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "cảm xúc vốn bị xem là thứ đối lập với lý trí". Chữ mới thu hẹp thành "một truyền thống tư tưởng", đúng như bài viết.'
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n112
  cau: 'Mô tả trang: từ "EQ" đang chỉ ba khái niệm khác nhau, và khoa học nói gì về khả năng dự báo thành công của nó.'
  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: 'Đã kiểm trên trang: mục Điều gì đang xảy ra nêu ba nghĩa; khung nhãn nói về dự báo hiệu suất. Mô tả vẫn nói "Salovey & Mayer (1990)", "Goleman (1995)", MSCEIT: khớp thân bài.'
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n10
  cau: Nhiều nhà nghiên cứu phê bình khái niệm trí tuệ cảm xúc, và cuộc tranh luận vẫn chưa ngã ngũ.
  loai: phat-hien
  nguon:
    - ten: "Locke (2005), J Organ Behav 26(4), 425–431: toàn văn (PDF trong Internet Archive)"
      link: https://doi.org/10.1002/job.318
    - ten: "Matthews, Zeidner & Roberts (2002), Emotional Intelligence: Science and Myth, MIT Press: lời giới thiệu sách (OpenAlex); sách không đọc toàn văn"
      link: https://doi.org/10.7551/mitpress/2704.001.0001
    - ten: "Joseph & Newman (2010), J Appl Psychol 95(1), 54–78: toàn văn (PDF trong Internet Archive, bộ wikipedia-scholarly-sources-corpus; Bảng 3, 4, 5c, mục Discussion)"
      link: https://doi.org/10.1037/a0017286
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "giới khoa học bắt đầu cãi nhau dữ dội, và cuộc cãi vã kéo dài đến tận hôm nay". Lý do: nguồn nói phê bình và tranh luận, không có số đo "dữ dội".'
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n16
  cau: Khái niệm "trí tuệ xã hội" có từ đầu thế kỷ 20.
  loai: lich-su
  nguon:
    - ten: "Joseph & Newman (2010), J Appl Psychol 95(1), 54–78: toàn văn (PDF trong Internet Archive, bộ wikipedia-scholarly-sources-corpus; Bảng 3, 4, 5c, mục Discussion)"
      link: https://doi.org/10.1037/a0017286
    - ten: "Salovey & Mayer (1990), Imagin Cogn Pers 9(3), 185–211: toàn văn (PDF trong Internet Archive, bộ wikipedia-scholarly-sources-corpus)"
      link: https://doi.org/10.2190/DUGG-P24E-52WK-6CDG
  ket_qua_luot_1: dung
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n21
  cau: "Bốn nhánh là: nhận biết cảm xúc (khuôn mặt, tranh ảnh), dùng cảm xúc hỗ trợ tư duy (ví dụ niềm vui có thể giúp lên kế hoạch cho một bữa tiệc), thấu hiểu cảm xúc (cảm xúc biến đổi ra sao), quản lý cảm xúc."
  loai: lich-su
  nguon:
    - ten: "Mayer, Salovey, Caruso & Sitarenios (2003), Emotion 3(1), 97–105: toàn văn (PDF trong Internet Archive, bộ wikipedia-scholarly-sources-corpus)"
      link: https://doi.org/10.1037/1528-3542.3.1.97
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "đọc cảm xúc qua khuôn mặt, giọng nói, tranh ảnh" và "tâm trạng vui giúp nảy ra nhiều ý tưởng". Chữ mới theo nhiệm vụ MSCEIT (faces, pictures; joy và kế hoạch bữa tiệc). Lý do: "giọng nói" và "nảy ra nhiều ý tưởng" không có trong nguồn đã mở. Ví dụ bực bội thành giận dữ là minh họa (gia-dinh).'
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n25
  cau: Theo mô tả của Locke (2005), Goleman gộp vào EI cả tự thúc đẩy và kiên trì, trì hoãn thỏa mãn, kiềm chế xung động, đồng cảm và kỹ năng xã hội.
  loai: lich-su
  nguon:
    - ten: "Locke (2005), J Organ Behav 26(4), 425–431: toàn văn (PDF trong Internet Archive)"
      link: https://doi.org/10.1002/job.318
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "năm thành phần: tự nhận thức, tự điều tiết, động lực, đồng cảm và kỹ năng xã hội … có cả tính cách (như lạc quan, tự tin)". Lý do: danh sách năm thành phần (thuộc các phiên bản sau của Goleman) và "lạc quan, tự tin" không có trong nguồn đã mở; danh sách của Locke lấy từ sách 1995.'
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n59
  cau: "Vững chắc: EQ tự báo cáo trùng lắp lớn với tính cách Big Five."
  loai: nhan
  nguon:
    - ten: "Joseph & Newman (2010), J Appl Psychol 95(1), 54–78: toàn văn (PDF trong Internet Archive, bộ wikipedia-scholarly-sources-corpus; Bảng 3, 4, 5c, mục Discussion)"
      link: https://doi.org/10.1037/a0017286
    - ten: "Joseph, Jin, Newman & O'Boyle (2015), J Appl Psychol 100(2), 298–342: toàn văn (PDF trong Internet Archive; Bảng 2, 6)"
      link: https://doi.org/10.1037/a0037681
    - ten: "O'Boyle, Humphrey, Pollack, Hawver & Story (2011), J Organ Behav 32(5), 788–818: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1002/job.714
  ket_qua_luot_1: dung
  ghi_chu: Đạt thước đo Vững chắc (tổng hợp, cùng chiều, không có kết quả ngược).
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n35
  cau: 'Câu hỏi gai góc: nếu "đúng" nghĩa là "đa số chọn", ta đo năng lực hay đo sự giống đám đông?'
  loai: phat-hien
  nguon:
    - ten: "Mayer, Salovey, Caruso & Sitarenios (2003), Emotion 3(1), 97–105: toàn văn (PDF trong Internet Archive, bộ wikipedia-scholarly-sources-corpus)"
      link: https://doi.org/10.1037/1528-3542.3.1.97
  ket_qua_luot_1: dung
  ghi_chu: Câu hỏi tu từ; các tác giả tự nêu vấn đề đồng thuận đám đông và chuyên gia, nên không phải điều trang tự đặt ra.
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n46
  cau: EQ mixed có đóng góp thêm ΔR² = .14 sau khi kiểm soát IQ và Big Five, nhưng các tác giả cho rằng chưa rõ vì sao và khuyên hết sức thận trọng khi dùng nó, vì khái niệm mixed thiếu chặt chẽ.
  loai: so-lieu
  nguon:
    - ten: "Joseph & Newman (2010), J Appl Psychol 95(1), 54–78: toàn văn (PDF trong Internet Archive, bộ wikipedia-scholarly-sources-corpus; Bảng 3, 4, 5c, mục Discussion)"
      link: https://doi.org/10.1037/a0017286
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "các tác giả cảnh báo không nên tin con số này" và dẫn thêm "số liệu lao động cảm xúc tổng hợp trong Côté (2014)". Lý do: tác giả nói chưa rõ vì sao và khuyên thận trọng khi áp dụng, không nói không tin con số; số lao động cảm xúc lấy thẳng từ bài Joseph và Newman, bỏ dẫn Côté ở câu này (Côté vẫn dùng ở khung Tranh cãi).'
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n86
  cau: "Mô hình thác gợi ý một thứ tự ưu tiên: khâu quyết định là điều tiết cảm xúc; đây là gợi ý từ mô hình tổng hợp tương quan, chưa phải kết quả của thử nghiệm huấn luyện."
  loai: loi-khuyen
  nguon:
    - ten: "Joseph & Newman (2010), J Appl Psychol 95(1), 54–78: toàn văn (PDF trong Internet Archive, bộ wikipedia-scholarly-sources-corpus; Bảng 3, 4, 5c, mục Discussion)"
      link: https://doi.org/10.1037/a0017286
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Đây là kỹ năng có thể luyện (kỹ thuật hít thở, đặt tên cảm xúc, trì hoãn phản ứng)". Lý do: không có nguồn đã mở cho khả năng luyện hay các kỹ thuật; chữ mới nói rõ giới hạn và dẫn bài Nén cảm xúc có tốt? Thêm "mục tiêu cụ thể rõ ràng hơn "nâng EQ lên 10 điểm"" là nhận xét của trang.'
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n83
  cau: Điểm tự báo cáo về "năng lực" chỉ tương quan yếu (r = .12) với điểm đo bằng bài test năng lực.
  loai: so-lieu
  nguon:
    - ten: "Joseph & Newman (2010), J Appl Psychol 95(1), 54–78: toàn văn (PDF trong Internet Archive, bộ wikipedia-scholarly-sources-corpus; Bảng 3, 4, 5c, mục Discussion)"
      link: https://doi.org/10.1037/a0017286
  ket_qua_luot_1: da-sua
  ghi_chu: Câu mới thêm vào trang (chữ cũ không có số).
- trang: kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc
  id: n47
  cau: Joseph và Newman, cùng Jin và O'Boyle (2015), quay lại câu hỏi vì sao EQ mixed lại dự báo hiệu suất tốt đến thế.
  loai: lich-su
  nguon:
    - ten: "Joseph, Jin, Newman & O'Boyle (2015), J Appl Psychol 100(2), 298–342: toàn văn (PDF trong Internet Archive; Bảng 2, 6)"
      link: https://doi.org/10.1037/a0037681
  ket_qua_luot_1: da-sua
  ghi_chu: "Chữ cũ: \"Vẫn nhóm tác giả trên quay lại\". Lý do: bài 2015 có thêm Jin và O'Boyle."
