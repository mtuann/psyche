  trich: "rapid autonomous processes (Type 1) are assumed to yield default responses unless intervened on by distinctive higher order reasoning processes (Type 2)"
  ghi_chu: "Evans và Stanovich (2013) bảo vệ khung hai loại xử lý, nhưng ghi nhận nó bị phê bình; chữ 'ký duyệt' là lối nói của Kahneman (2011), không kiểm được."
