  nguon: ["https://doi.org/10.1037/1040-3590.18.2.192", "https://ipip.ori.org/MiniIPIPKey.htm"]
  trich: "a 20-item short form of the 50-item International Personality Item Pool-Five-Factor Model measure ... four items per Big Five trait"
  ghi_chu: "IPIP lưu ý nhãn 'Mini-IPIP' và 'Five-Factor Model' không chính xác hẳn (bản gốc là Big Five lexical markers); không ảnh hưởng câu."
- trang: trai-nghiem/big-five-mini
  id: n2
  luot_2: dung
  nguon: ["https://ipip.ori.org/MiniIPIPKey.htm"]
  trich: "Key lists: E (+2, -2), A (+2, -2), C (+2, -2), N (+2, -2), Intellect (+1, -3); reverse-keyed items in each factor"
  ghi_chu: "Khớp: câu nghịch E 2, A 2, C 2, N 2, Intellect 3 (theo thứ tự trên trang). Nội dung từng câu không đối chiếu từng chữ với bản dịch tiếng Việt."
- trang: trai-nghiem/big-five-mini
  id: n3
  luot_2: dung
  nguon: ["https://ipip.ori.org/"]
  trich: "The items and scales are in the public domain, which means that one can copy, edit, translate, or use them for any purpose without asking permission and without paying a fee."
- trang: trai-nghiem/big-five-mini
  id: n4
  luot_2: dung
  nguon: ["https://ipip.ori.org/newScoringInstructions.htm", "https://ipip.ori.org/New_IPIP-50-item-scale.htm"]
  trich: "Describe yourself as you generally are now, not as you wish to be in the future ... in relation to other people you know of the same sex as you are, and roughly your same age ... 1. Very Inaccurate, 2. Moderately Inaccurate, 3. Neither Accurate Nor Inaccurate, 4. Moderately Accurate, 5. Very Accurate"
  ghi_chu: "Lời dẫn trên trang IPIP cho bản 50 câu; Mini-IPIP dùng cùng thang."
- trang: trai-nghiem/big-five-mini
  id: n5
  luot_2: dung
  nguon: ["https://ipip.ori.org/newScoringInstructions.htm"]
  trich: "For + keyed items, 'Very Inaccurate' = 1 ... 'Very Accurate' = 5. For - keyed items ... 5 ... 1. ... just sum all the values to obtain a total scale score."
  ghi_chu: "4 câu x 1-5 = 4-20."
- trang: trai-nghiem/big-five-mini
  id: n6
  luot_2: dung
  nguon: ["https://ipip.ori.org/InterpretingIndividualIPIPScaleScores.htm"]
  trich: "we caution against interpreting IPIP scale scores in terms of categories or sorting respondents into groups based on their scores"
  ghi_chu: "IPIP vẫn mô tả cách tính 'trung bình, thấp, cao' theo nửa độ lệch chuẩn trong mẫu cùng giới và tuổi; câu của site (không gắn nhãn) phù hợp với lời cảnh báo."
- trang: trai-nghiem/big-five-mini
  id: n7
  luot_2: dung
  nguon: ["https://ipip.ori.org/New_IPIP-50-item-scale.htm"]
  trich: "The theory behind distributing items from different scales throughout an inventory and alternating between +keyed and -keyed items is that this encourages respondents to pay close attention ... they might tend to give the exact same response ... to all of the items."
- trang: trai-nghiem/big-five-mini
  id: n8
  luot_2: khong-chac
  nguon: ["https://ipip.ori.org/New_IPIP-50-item-scale.htm"]
  ghi_chu: "Trang IPIP nói xen câu thuận/nghịch khuyến khích người trả lời đọc kỹ; không nói 'phát hiện xu hướng đồng ý'. Ý này (cân bằng câu thuận nghịch) đúng trong đo lường tâm lý nhưng chưa mở được nguồn bậc 1-2."
- trang: trai-nghiem/big-five-mini
  id: n9
  luot_2: dung
  nguon: ["https://doi.org/10.1037/1040-3590.18.2.192"]
  trich: "consistent and acceptable internal consistencies across five studies (= at or well above .60) ... test-retest correlations that were quite similar to the parent measure across intervals of a few weeks (Study 4) and several months (Study 5) ... comparable pattern of convergent, discriminant, and criterion-related validity"
- trang: trai-nghiem/big-five-mini
  id: n10
  luot_2: dung
  nguon: ["https://ipip.ori.org/MiniIPIPKey.htm"]
  trich: "Extraversion (Alpha = .77); Agreeableness (.70); Conscientiousness (.69); Neuroticism (.68); Intellect or Imagination (.65); the authors chose to score the Emotional Stability scale in reverse and to use the label Neuroticism"
- trang: trai-nghiem/big-five-mini
  id: n11
  luot_2: dung
  nguon: ["https://doi.org/10.1037/1040-3590.18.2.192", "https://ipip.ori.org/MiniIPIPKey.htm"]
  trich: "The Mini-IPIP is a psychometrically acceptable and practically useful short measure of the Big Five factors"
  ghi_chu: "chỗ khó: nhãn 'Khá vững' hợp thước đo; 'kém chính xác hơn bản dài' khớp với alpha 0,65-0,77 thấp hơn bản dài, và IPIP nêu thêm hạn chế gọi tên chiều. Không thấy phân tích tổng hợp."
- trang: trai-nghiem/big-five-mini
  id: n12
  luot_2: dung
  nguon: ["https://doi.org/10.1037/1040-3590.18.2.192"]
  trich: "short measure of the Big Five factors of personality"
  ghi_chu: "Chỉ xác nhận Mini-IPIP là thước đo Big Five; 'không phải công cụ chẩn đoán' là lời cảnh báo của site, hợp với cách IPIP bàn điểm số (mô tả vị trí trên liên tục, không phân loại)."
- trang: trai-nghiem/big-five-mini
  id: n13
  luot_2: dung
  nguon: ["https://doi.org/10.21827/ijpp.9.41003", "https://doi.org/10.1111/jopy.12813"]
  trich: "The Big Five, Big Six, and ML7 models were not well replicated. (Vietnamese psycho-lexical, 710 participants) / The results demonstrate a five-factor structure that fits the Big Five model (rural Thailand and Vietnam, N = 3811)"
  ghi_chu: "Hai nghiên cứu cho kết quả khác nhau: 'ít và chưa thống nhất' đúng."
- trang: trai-nghiem/big-five-mini
  id: n14
  luot_2: dung
  nguon: ["https://api.openalex.org/works?search=Mini-IPIP+Vietnamese"]
  trich: "(không có kết quả phù hợp)"
  ghi_chu: "Tìm OpenAlex 17/11/2026: 'Mini-IPIP Vietnamese', 'Mini-IPIP Vietnam', 'Mini-IPIP validation Vietnamese students': không có nghiên cứu kiểm chứng. Hạn chế: chỉ tìm tiếng Anh."
- trang: trai-nghiem/big-five-mini
  id: n15
  luot_2: khong-chac
  nguon: []
  ghi_chu: "'Nhiều bài test tiếng Việt trên mạng chưa chuẩn hóa' là mô tả thị trường, không có nguồn bậc 1-2. Phần 'bản này chưa chuẩn hóa' đúng (xem n14). Nên viết lại: bản này chưa qua chuẩn hóa ở người Việt."
- trang: trai-nghiem/big-five-mini
  id: n16
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0033-2909.132.1.1", "https://doi.org/10.1037/1040-3590.18.2.192"]
  trich: "people increase in ... conscientiousness, and emotional stability, especially in young adulthood ... (92 samples); test-retest correlations ... across intervals of a few weeks and several months"
  ghi_chu: "Mức trung bình đổi theo tuổi (tổng hợp Roberts 2006); dao động giữa các lần đo: độ tin cậy test-retest chưa hoàn hảo."
- trang: trai-nghiem/big-five-mini
  id: n17
  luot_2: dung
  nguon: ["https://ipip.ori.org/newScoringInstructions.htm", "https://ipip.ori.org/InterpretingIndividualIPIPScaleScores.htm"]
  trich: "just sum all the values to obtain a total scale score ... interpret scores ... within a sample of persons, usually of the same sex and a particular age range"
- trang: trai-nghiem/neo-gia
  id: n1
  luot_2: dung
  nguon: ["https://doi.org/10.1126/science.185.4157.1124"]
  trich: "(iii) adjustment from an anchor, which is usually employed in numerical prediction when a relevant value is available."
  ghi_chu: "Bản kỹ thuật 1973 nói 'insufficient adjustment'."
- trang: trai-nghiem/neo-gia
  id: n2
  luot_2: dung
  nguon: ["https://archive.org/details/DTIC_AD0767426", "https://doi.org/10.1126/science.185.4157.1124"]
  trich: "a starting value between 0 and 100 was determined by spinning a wheel of fortune in the subjects' presence ... These arbitrary values had a marked effect on the estimates."
  ghi_chu: "Dùng bản kỹ thuật DTIC 1973 có cùng đoạn với bài Science 1974."
- trang: trai-nghiem/neo-gia
  id: n3
  luot_2: dung
  nguon: ["https://archive.org/details/DTIC_AD0767426"]
  trich: "the median estimates of the percentage of African countries in the U.N. were 25% and 45%, respectively, for groups which received 10% and 65% as starting points. Payoff for accuracy did not reduce the anchoring effect."
  ghi_chu: "Hai bước (cao hơn hay thấp hơn rồi ước lượng) khớp mô tả."
- trang: trai-nghiem/neo-gia
  id: n4
  luot_2: khong-chac
  nguon: ["https://doi.org/10.1177/0146167205282152"]
  ghi_chu: "Tóm tắt Englich 2006 xác nhận Nghiên cứu 3 (tung xúc xắc) nhưng không có 7,81/5,28 tháng, người tham gia 'luật sư trẻ' hay xúc xắc làm cho ra 3 hoặc 9. Không mở được toàn văn."
- trang: trai-nghiem/neo-gia
  id: n5
  luot_2: khong-chac
  nguon: ["https://doi.org/10.1177/0146167205282152"]
  ghi_chu: "Tóm tắt xác nhận nghiên cứu 2 (biết mức đề nghị ngẫu nhiên) và 'Expertise and experience did not reduce this effect'; 'hơn 13 năm kinh nghiệm', thẩm phán và công tố viên chưa xác nhận."
- trang: trai-nghiem/neo-gia
  id: n6
  luot_2: dung
  nguon: ["https://doi.org/10.1027/1864-9335/a000178", "https://research.tilburguniversity.edu/files/3053309/SP_Ijzerman_investigating_SP_2014.pdf"]
  trich: "Anchoring - Babies Born ... Proportion >0 (p<.05) 1.00 ... [four anchoring effects, 100% of samples significant]; 36 independent samples totaling 6,344 participants"
  ghi_chu: "chỗ khó: Many Labs 1 là tái lập lớn có đăng ký trước, bốn mỏ neo đều có hiệu ứng ở mọi mẫu và nằm trong nhóm lớn nhất, nhưng thước đo mục 4 đòi một phân tích tổng hợp hoặc hai tái lập lớn. Many Labs 2 và các tổng quan chưa mở; người giao nên xác nhận."
- trang: trai-nghiem/neo-gia
  id: n7
  luot_2: dung
  nguon: ["https://doi.org/10.1177/0146167205282152"]
  trich: "influenced by irrelevant sentencing demands even if they are blatantly determined at random ... Expertise and experience did not reduce this effect."
  ghi_chu: "Nhãn 'Khá vững' hợp (vài nghiên cứu về chuyên gia, mẫu nhỏ)."
- trang: trai-nghiem/neo-gia
  id: n8
  luot_2: dung
  nguon: ["https://doi.org/10.1177/0146167205282152", "https://archive.org/details/DTIC_AD0767426"]
  trich: "The accessibility of incriminating arguments was higher if participants were confronted with a high rather than a low anchor (Study 4)."
  ghi_chu: "chỗ khó: Tóm tắt nói 'accessibility ... higher', không nói 'nhận ra nhanh hơn'. Điều chỉnh không đủ (Tversky-Kahneman) đã xác nhận ở bản 1973. Bài của Mussweiler và Strack chưa mở."
- trang: trai-nghiem/neo-gia
  id: n9
  luot_2: khong-chac
  nguon: ["https://doi.org/10.1177/0146167205282152", "https://archive.org/details/DTIC_AD0767426"]
  ghi_chu: "chỗ khó: Lõi đúng (neo ngẫu nhiên vẫn có tác dụng: vòng quay của Tversky-Kahneman, xúc xắc của Englich). Vế 'Englich so mức ngẫu nhiên với cùng mức do công tố đưa ra và không thấy khác nhau' không có trong tóm tắt; chưa đọc được. Cũng cần xem 'Đã bị bác bỏ' có hợp nhãn không (một khẳng định giả định hơn là kết luận đã công bố)."
- trang: trai-nghiem/neo-gia
  id: n10
  luot_2: dung
  nguon: ["https://doi.org/10.1126/science.185.4157.1124", "https://doi.org/10.1177/0146167205282152"]
  trich: "adjustment from an anchor ... selective increase in the accessibility of arguments that are consistent with the random sentencing demand"
  ghi_chu: "Mussweiler và Strack (1999) chưa mở nên năm đó chưa xác nhận."
- trang: trai-nghiem/neo-gia
  id: n11
  luot_2: dung
  nguon: ["https://www.nso.gov.vn/tin-tuc-thong-ke/2026/01/thong-cao-bao-chi-tinh-hinh-kinh-te-xa-hoi-quy-iv-va-nam-2025/"]
  trich: "Dân số trung bình năm 2025 ước tính là 102,3 triệu người, tăng 1.001,6 nghìn người"
  ghi_chu: "Thông cáo báo chí tình hình KTXH quý IV và năm 2025, Cục Thống kê (nso.gov.vn), kiểm 17/11/2026. Trang cũng có thông cáo quý II/2026 (về lao động); số dân năm 2025 vẫn là số dân cả năm mới nhất thấy được."
- trang: trai-nghiem/neo-gia
  id: n12
  luot_2: dung
  nguon: ["https://www.nso.gov.vn/tin-tuc-thong-ke/2026/01/thong-cao-bao-chi-tinh-hinh-kinh-te-xa-hoi-quy-iv-va-nam-2025/"]
  trich: "dân số thành thị là 39,4 triệu người, chiếm 38,6%"
- trang: trai-nghiem/neo-gia
  id: n13
  luot_2: dung
  nguon: ["https://api.openalex.org/works?search=anchoring+effect+Vietnamese+participants"]
  trich: "(không có kết quả phù hợp)"
  ghi_chu: "Tìm OpenAlex 17/11/2026 ('anchoring effect Vietnamese participants', 'anchoring effect Vietnam experiment'): không có nghiên cứu phù hợp. Hạn chế: chỉ tìm tiếng Anh."
- trang: trai-nghiem/neo-gia
  id: n14
  luot_2: dung
  nguon: ["https://doi.org/10.1177/0146167205282152"]
  trich: "Expertise and experience did not reduce this effect."
  ghi_chu: "Câu 'biết mức đề nghị do xúc xắc quyết định mà vẫn bị kéo' khớp Nghiên cứu 3."
- trang: trai-nghiem/neo-gia
  id: n15
  luot_2: dung
  nguon: ["https://doi.org/10.1177/0146167205282152"]
  trich: "selective increase in the accessibility of arguments that are consistent with the random sentencing demand"
  ghi_chu: "Là diễn giải theo mô hình tiếp cận chọn lọc, đã ghi 'theo mô hình'."
- trang: trai-nghiem/neo-gia
  id: n16
  luot_2: dung
  nguon: ["https://archive.org/details/DTIC_AD0767426"]
  trich: "wheel of fortune ... 10% and 65% ... medians 25% and 45%"
  ghi_chu: "Bản gốc dùng câu hỏi về tỉ lệ nước châu Phi ở Liên Hợp Quốc; công cụ là mô phỏng."
- trang: trai-nghiem/tri-nho-tu
  id: n1
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Baddeley, Thomson và Buchanan (1975) không mở được (nhà xuất bản đóng, không có bản ở Internet Archive hay CiteSeerX). 'Khoảng 2 giây' chưa xác nhận."
- trang: trai-nghiem/tri-nho-tu
  id: n2
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Dự đoán 'ít chênh' chưa có nguồn; chữ số thường quen thuộc hơn từ nên khoảng nhớ thường lớn hơn. Nên nói 'hãy làm cả hai để tự so' và bỏ dự đoán."
- trang: trai-nghiem/tri-nho-tu
  id: n3
  luot_2: dung
  nguon: ["https://doi.org/10.1037/h0043158", "https://doi.org/10.1017/S0140525X01003922"]
  trich: "Miller (1956) summarized evidence that people can remember about seven chunks ... the smaller capacity limit [three to five chunks] is real."
  ghi_chu: "Cowan 2001 nói 3-5 'chunk', trung tâm quanh 4."
- trang: trai-nghiem/tri-nho-tu
  id: n4
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Không mở được bài gốc 1975 nên các số liệu và thí nghiệm ngăn nhẩm lặp chưa xác nhận."
- trang: trai-nghiem/tri-nho-tu
  id: n5
  luot_2: qua-manh
  nguon: ["https://doi.org/10.3758/s13421-025-01762-5", "https://doi.org/10.1037/bul0000153"]
  trich: "when short and long words were more fully equated, including being equated for orthographic and phonological neighborhood size, the word-length effect disappeared"
  ghi_chu: "chỗ khó: Hiệu ứng độ dài từ có nhiều tranh cãi về yếu tố gây nhiễu (từ dài khác từ ngắn ở độ quen, láng giềng); chưa thấy phân tích tổng hợp hay tái lập lớn có đăng ký trước đạt thước đo 'Vững chắc'. Tóm tắt Oberauer 2018 không nói riêng về hiệu ứng này."
  cau_dung: "Khá vững: dãy từ dài thường nhớ được ít hơn dãy từ ngắn trong các tác vụ trí nhớ ngắn hạn, nhưng một phần do các yếu tố đi kèm độ dài (độ quen, láng giềng); cơ chế còn tranh luận."
- trang: trai-nghiem/tri-nho-tu
  id: n6
  luot_2: khong-chac
  nguon: ["https://doi.org/10.3758/s13421-025-01762-5"]
  ghi_chu: "Tóm tắt Neath/Nairne (2025) xác nhận có cách giải thích khác (yếu tố từ vựng và trí nhớ dài hạn); 'nhiễu giữa các mục' của Oberauer 2018 chưa mở; Miller 1956 về gom nhóm khớp ('chunks')."
- trang: trai-nghiem/tri-nho-tu
  id: n7
  luot_2: dung
  nguon: ["https://api.openalex.org/works?search=word+length+effect+Vietnamese"]
  trich: "(không có kết quả phù hợp)"
  ghi_chu: "Tìm OpenAlex 17/11/2026 ('word length effect Vietnamese', 'digit span Vietnamese phonological loop', 'memory span Vietnamese children syllable'): không có số liệu chuẩn người Việt (chỉ có nghiên cứu lặp từ vô nghĩa ở trẻ em, không phải khoảng nhớ). Hạn chế: chỉ tìm tiếng Anh."
- trang: trai-nghiem/tri-nho-tu
  id: n8
  luot_2: dung
  nguon: ["https://doi.org/10.3758/s13421-025-01762-5"]
  trich: "memory ... is better for words with fewer syllables than words with more syllables"
  ghi_chu: "Câu đã nói 'có thể'; hiệu ứng có nhưng một phần do yếu tố đi kèm."
- trang: trai-nghiem/tri-nho-tu
  id: n9
  luot_2: dung
  nguon: ["https://doi.org/10.1037/h0043158", "https://doi.org/10.3758/s13421-025-01762-5"]
  trich: "people can remember about seven chunks"
  ghi_chu: "'Số mục nhớ thay đổi theo loại mục' khớp (đơn vị là chunk, từ dài kém hơn); xem n5 về nhiễu."
- trang: trai-nghiem/tri-nho-tu
  id: n10
  luot_2: dung
  nguon: ["https://doi.org/10.1037/a0028228"]
  trich: "Twenty-three studies with 30 group comparisons ... no convincing evidence of the generalization of working memory training to other skills"
  ghi_chu: "Bài xuất bản trực tuyến 2012, in năm 2013 (Developmental Psychology 49). 'Cải thiện ngắn hạn đúng kỹ năng đã luyện' khớp 'short-term, specific training effects'."
- trang: trai-nghiem/tri-nho-tu
  id: n11
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Không có nguồn bậc 1-2 đã mở nói riêng cho một lần đo trên mạng; ý tổng quát (chiến lược nhóm từ) có ở Cowan 2001 nhưng không đủ."
- trang: trai-nghiem/tri-nho-tu
  id: n12
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Phụ thuộc Baddeley 1975 (chưa mở). Phần 'từ một âm tiết kiểm soát độ dài từ' là lựa chọn thiết kế của công cụ, có lý nhưng chưa có nguồn."
