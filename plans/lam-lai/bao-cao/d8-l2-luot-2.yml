  luot_2: dung
  nguon: ["https://archive.org/details/DTIC_ADA131801"]
  trich: "a group of 142 undergraduates at UBC ... Overall, 85% ... The respondents in the studies described in this section were statistically naive undergraduates at UBC."
- trang: trai-nghiem/linda
  id: n7
  luot_2: dung
  nguon: ["https://archive.org/details/DTIC_ADA131801"]
  trich: "Table 1: Linda, violations of the conjunction rule in direct tests: naive, informed, sophisticated groups (about 85-90%); sophisticated = PhD students in the decision science program of the Stanford Business School"
  ghi_chu: "Bản quét OCR có chữ số bị nhòe ở hàng Linda (đọc ra 89%, 90%, 85%); khoảng 85–90% khớp trí nhớ về bảng đã đăng. Nên đối chiếu bảng 1 của bản đăng Psychological Review."
- trang: trai-nghiem/linda
  id: n8
  luot_2: dung
  nguon: ["https://archive.org/details/DTIC_ADA131801"]
  trich: "The percentage of violations of the conjunction rule in this task was 'only' 56% (N=60)"
- trang: trai-nghiem/linda
  id: n9
  luot_2: dung
  nguon: ["https://doi.org/10.1126/science.185.4157.1124"]
  trich: "This article described three heuristics ...: (i) representativeness ... (ii) availability ... (iii) adjustment from an anchor"
  ghi_chu: "Phần định nghĩa 'đánh giá theo độ giống một khuôn mẫu' là cách nói quen thuộc cho representativeness; đúng."
- trang: trai-nghiem/linda
  id: n10
  luot_2: dung
  nguon: ["https://archive.org/details/DTIC_ADA131801", "https://doi.org/10.1016/s0364-0213(04)00004-7"]
  trich: "Systematic violations of the conjunction rule are observed in judgments of lay people and of experts in both between-subjects and within-subjects comparisons."
  ghi_chu: "Nhãn 'Khá vững' hợp thước đo: nhiều nghiên cứu cùng chiều nhưng chưa mở được phân tích tổng hợp hay tái lập lớn có đăng ký trước."
