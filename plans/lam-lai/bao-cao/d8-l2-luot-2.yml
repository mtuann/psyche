- trang: trai-nghiem/tri-nho-sai
  id: n1
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0278-7393.21.4.803"]
  trich: "nonpresented associates ... later recognized with high confidence"
  ghi_chu: "Chỉ đọc tóm tắt (bản đầy đủ không mở được). Câu nói đây là cách giải thích phổ biến (kích hoạt + nhầm nguồn); tóm tắt xác nhận hiện tượng, không bàn cơ chế."
- trang: trai-nghiem/tri-nho-sai
  id: n2
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0278-7393.21.4.803"]
  trich: "lists of 12 words (e.g., bed, rest, awake); each list was composed of associates of 1 nonpresented word (e.g., sleep) ... modeled after J. Deese's 1959 study ... immediate free recall"
  ghi_chu: "Đọc tóm tắt."
- trang: trai-nghiem/tri-nho-sai
  id: n3
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0278-7393.21.4.803"]
  trich: "nonpresented associates were recalled 40 % of the time ... In Experiment 2, a false recall rate of 55 %"
  ghi_chu: "Tóm tắt không nêu 'danh sách 15 từ'; phần đó chưa xác nhận trực tiếp."
- trang: trai-nghiem/tri-nho-sai
  id: n4
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Tóm tắt chỉ nói thí nghiệm 1: nhận diện với độ tin cậy cao; thí nghiệm 2: dương tính giả 'comparable to the hit rate'. Không mở được toàn văn (APA đóng, CiteSeerX hỏng, không có bản ở Internet Archive) nên 84% và 86% chưa xác nhận."
- trang: trai-nghiem/tri-nho-sai
  id: n5
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Phán đoán remember/know ở thí nghiệm 2 không có trong tóm tắt; chưa mở được toàn văn."
- trang: trai-nghiem/tri-nho-sai
  id: n6
  luot_2: khong-chac
  nguon: ["https://doi.org/10.1037/0278-7393.21.4.803"]
  ghi_chu: "chỗ khó: Hiện tượng đúng và lặp lại rất nhiều, nhưng chưa mở được phân tích tổng hợp hay tái lập lớn có đăng ký trước về DRM để đối chiếu thước đo 'Vững chắc' (mục 4). Người giao cần kiểm hoặc hạ xuống 'Khá vững'."
- trang: trai-nghiem/tri-nho-sai
  id: n7
  luot_2: dung
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=PMCID:PMC8473788&format=json&resultType=core"]
  trich: "These results support views that propose false memory is produced by activation spreading from study items to critical lures during encoding, which leads critical lures to be confused with episodically-experienced events."
  ghi_chu: "chỗ khó: Tóm tắt PMC8473788 (2021) cho thấy cơ chế (kích hoạt lan truyền kèm nhầm nguồn) vẫn đang được kiểm tra thực nghiệm; vế 'theo Gallo' và 'khó tách' chưa mở được nguồn của Gallo."
- trang: trai-nghiem/tri-nho-sai
  id: n8
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Số người (36, 30) không có trong tóm tắt; chưa mở được toàn văn."
- trang: trai-nghiem/tri-nho-sai
  id: n9
  luot_2: khong-chac
  nguon: ["https://doi.org/10.1037/0278-7393.21.4.803"]
  ghi_chu: "Tóm tắt không nói về phán đoán remember/know và thứ tự bài nhận diện; chưa mở được toàn văn."
- trang: trai-nghiem/tri-nho-sai
  id: n10
  luot_2: khong-chac
  nguon: ["https://doi.org/10.1037/0278-7393.21.4.803"]
  trich: "40 % ... 55 %"
  ghi_chu: "Chỉ 40% và 55% xác nhận từ tóm tắt; 36 sinh viên, 6 danh sách, 84%/86% chưa xác nhận. Cần sửa câu nếu không kiểm được."
- trang: trai-nghiem/tri-nho-sai
  id: n11
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Nhịp 1,5 giây mỗi từ ở thí nghiệm 1 chưa xác nhận (không mở được toàn văn). Thông số 1,2 giây hiện + 0,3 giây nghỉ là của công cụ, không đối chiếu được."
- trang: trai-nghiem/wason-246
  id: n1
  luot_2: dung
  nguon: ["https://doi.org/10.1080/17470216008416717", "https://archive.org/details/FailureToEliminateHypothesisInAConceptualTask"]
  trich: "Six out of 29 subjects reached the correct conclusion without previous incorrect ones, 13 reached one incorrect conclusion, nine reached two or more incorrect conclusions, and one reached no conclusion."
  ghi_chu: "29 - 6 = 23 người không đúng ngay (22 nêu sai + 1 không kết luận). 'Không tìm ra quy tắc ngay lần đầu' khớp."
- trang: trai-nghiem/wason-246
  id: n2
  luot_2: dung
  nguon: ["https://archive.org/details/FailureToEliminateHypothesisInAConceptualTask", "https://doi.org/10.1037/0033-295X.94.2.211"]
  trich: "In nearly all cases incorrect rules were sufficient ones, e.g. 'increasing intervals of two.'"
  ghi_chu: "Ví dụ 8–10–12, 20–22–24 là minh họa của site, phù hợp với phân tích của Wason và Klayman-Ha."
- trang: trai-nghiem/wason-246
  id: n3
  luot_2: dung
  nguon: ["https://doi.org/10.1037/1089-2680.2.2.175"]
  trich: "It refers usually to unwitting selectivity in the acquisition and use of evidence."
  ghi_chu: "Nickerson cũng nói ranh giới cố ý và không chủ ý khó vạch trong thực tế; 'thường không cố tình' khớp."
- trang: trai-nghiem/wason-246
  id: n4
  luot_2: dung
  nguon: ["https://archive.org/details/FailureToEliminateHypothesisInAConceptualTask"]
  trich: "Subjects were told that the three numbers 2, 4, 6, conformed to a simple relational rule ... When you feel highly confident that you have discovered it, and not before, you are to write it down ... If it was incorrect, the subject was told so and instructed to carry on as before."
  ghi_chu: "Quy tắc thật: 'three numbers in increasing order of magnitude'. Ghi lý do cho mỗi dãy: khớp mô tả."
- trang: trai-nghiem/wason-246
  id: n5
  luot_2: dung
  nguon: ["https://doi.org/10.1080/17470216008416717", "https://archive.org/details/FailureToEliminateHypothesisInAConceptualTask"]
  trich: "Table I ... Immediate Correct 6 ... Incorrect 22 (first announcement); one 'none'"
  ghi_chu: "13 sai một lần, 9 sai từ hai lần: khớp tóm tắt của Wason."
- trang: trai-nghiem/wason-246
  id: n6
  luot_2: dung
  nguon: ["https://archive.org/details/FailureToEliminateHypothesisInAConceptualTask"]
  trich: "The mean ratio was 0.21 (n = 6) for those who made the immediate correct announcement and 0.04 (n = 22) for those who made a first incorrect announcement."
  ghi_chu: "Đây là tỉ số trung bình dãy không tuân theo quy tắc thật trên tổng số dãy trước lần nêu đầu; '4%' là trung bình của nhóm 22 người (13 + 9). Wason ghi 'nearly all incorrect rules were sufficient' và rằng chỉ một ví dụ dương tính không tương thích mới bác được quy tắc đủ."
- trang: trai-nghiem/wason-246
  id: n7
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0033-295X.94.2.211"]
  trich: "many phenomena labeled 'confirmation bias' are better understood in terms of a general positive test strategy ... can be a very good heuristic for determining the truth or falsity of a hypothesis under realistic conditions. It can, however, lead to systematic errors or inefficiencies."
- trang: trai-nghiem/wason-246
  id: n8
  luot_2: dung
  nguon: ["https://doi.org/10.1037/1089-2680.2.2.175", "https://doi.org/10.1037/0033-295X.94.2.211"]
  trich: "Confirmation bias ... connotes the seeking or interpreting of evidence in ways that are partial to existing beliefs, expectations, or a hypothesis in hand."
  ghi_chu: "Nhãn 'Khá vững' hợp thước đo (nhiều nghiên cứu cùng chiều, nhưng chủ yếu tổng quan tường thuật, chưa mở được phân tích tổng hợp riêng)."
- trang: trai-nghiem/wason-246
  id: n9
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0033-295X.94.2.211", "https://doi.org/10.1037/1089-2680.2.2.175"]
  trich: "the positive test strategy can be a very good heuristic ... (Klayman & Ha) vs. Nickerson: possible explanations are considered, and the question of its utility or disutility is discussed."
  ghi_chu: "Hai nguồn bậc 2 cùng ghi tranh luận về tính hữu ích: nhãn 'Đang tranh cãi' hợp lý."
- trang: trai-nghiem/wason-246
  id: n10
  luot_2: dung
  nguon: ["https://doi.org/10.1037/1089-2680.2.2.175"]
  trich: "Confirmation bias ... connotes the seeking or interpreting of evidence in ways that are partial to existing beliefs, expectations, or a hypothesis in hand."
- trang: trai-nghiem/wason-246
  id: n11
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0033-295X.94.2.211"]
  trich: "positive test strategy ... can be a very good heuristic ... under realistic conditions. It can, however, lead to systematic errors"
  ghi_chu: "Ví dụ 'thử thuốc trên người bệnh' là minh họa của site, không thấy nguyên văn trong bài (Klayman-Ha dùng ví dụ về bệnh truyền nhiễm và về tuyển dụng); gắn nhãn gia-dinh khi duyệt."
- trang: trai-nghiem/wason-246
  id: n12
  luot_2: dung
  nguon: ["https://doi.org/10.1037/1089-2680.2.2.175"]
  trich: "We can be selective with respect to the evidence we seek, and we can tilt the scales when we weigh what we find, but we cannot completely ignore counterindicative evidence of which we are aware."
  ghi_chu: "Nickerson nối với 'Pollyanna principle': người ta ưu ái mệnh đề mình muốn đúng."
- trang: trai-nghiem/wason-246
  id: n13
  luot_2: dung
  nguon: ["https://archive.org/details/FailureToEliminateHypothesisInAConceptualTask"]
  trich: "The subjects, 29 psychology undergraduates (17 men and 12 women) ... Medical Research Council Industrial Psychology Research Group, University College, London"
- trang: trai-nghiem/wason-246
  id: n14
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Tìm OpenAlex bị giới hạn tốc độ giữa chừng nên chưa hoàn tất; chưa thấy nghiên cứu nào nhưng không đủ để xác nhận. Nên tìm lại trước khi khóa."
- trang: trai-nghiem/wason-246
  id: n15
  luot_2: dung
  nguon: ["https://archive.org/details/FailureToEliminateHypothesisInAConceptualTask", "https://doi.org/10.1037/1089-2680.2.2.175"]
  trich: "intelligent young adults (Wason); Nickerson: 'the history of science gives us many exceptions to the rule'; Evans (1989) ... behavioral changes were sometimes induced, more often performance was not improved."
- trang: trai-nghiem/wason-246
  id: n16
  luot_2: dung
  nguon: ["https://archive.org/details/FailureToEliminateHypothesisInAConceptualTask", "https://doi.org/10.1037/0033-295X.94.2.211"]
  trich: "A sufficient rule can only be eliminated by a positive instance which is incompatible with it."
  ghi_chu: "Câu 'mười dãy số chẵn tăng đều' là minh họa; ý chính (nhiều dãy khẳng định không loại được quy tắc rộng hơn) đúng."
- trang: trai-nghiem/wason-246
  id: n17
  luot_2: dung
  nguon: ["https://archive.org/details/FailureToEliminateHypothesisInAConceptualTask"]
  trich: "The mean ratio was 0.21 (n = 6) ... and 0.04 (n = 22)"
  ghi_chu: "Xem n6; 29 người, 6 đúng ngay khớp Table I."
- trang: trai-nghiem/wason-246
  id: n18
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0033-295X.94.2.211"]
  trich: "positive test strategy ... can be a very good heuristic ... under realistic conditions. It can, however, lead to systematic errors or inefficiencies."
- trang: trai-nghiem/linda
  id: n1
  luot_2: dung
  nguon: ["https://archive.org/details/DTIC_ADA131801"]
  trich: "Overall, 85% of respondents indicated that T&F is more probable than T, in a flagrant violation of the conjunction rule."
  ghi_chu: "Bản tóm tắt kỹ thuật tháng 6/1983 (Stanford, ONR) của bài Psychological Review 1983; mẫu 142 sinh viên UBC."
- trang: trai-nghiem/linda
  id: n2
  luot_2: dung
  nguon: ["https://archive.org/details/DTIC_ADA131801"]
  trich: "Linda is 31 years old, single, outspoken and very bright. She majored in philosophy. As a student, she was deeply concerned with issues of discrimination and social justice, and also participated in anti-nuclear demonstrations."
  ghi_chu: "Bản dịch tiếng Việt không đối chiếu được ở đây; nội dung hai phát biểu T và T&F khớp."
- trang: trai-nghiem/linda
  id: n3
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0033-295X.90.4.293"]
  trich: "The probability of a conjunction, P(A&B), cannot exceed the probabilities of its constituents, P(A) and P(B), because the extension of the conjunction is included in the extension of its constituents."
- trang: trai-nghiem/linda
  id: n4
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0033-295X.90.4.293", "https://archive.org/details/DTIC_ADA131801"]
  trich: "The pattern ... subjects apparently ranked the outcomes by the degree to which Bill (or Linda) matched the respective stereotypes."
  ghi_chu: "Tương quan thứ hạng xác suất với độ đại diện 0,06-0,08 ở bản kỹ thuật."
- trang: trai-nghiem/linda
  id: n5
  luot_2: dung
  nguon: ["https://doi.org/10.1126/science.185.4157.1124"]
  trich: "These heuristics are highly economical and usually effective, but they lead to systematic and predictable errors."
  ghi_chu: "'Ví dụ nổi tiếng nhất' là nhận xét chủ quan, không kiểm được; phần định nghĩa đúng."
