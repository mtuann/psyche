  id: n11
  luot_2: dung
  nguon: ["https://doi.org/10.1016/s0364-0213(04)00004-7", "https://archive.org/details/DTIC_ADA131801"]
  trich: "Whether an error is thereby committed depends on reasoners' interpretation of the expressions 'probability' and 'and.'"
  ghi_chu: "chỗ khó: Hai nguồn xác nhận cách hiểu từ ngữ ảnh hưởng (Tentori, Bonini, Osherson 2004; chính Tversky-Kahneman cũng thử cách hiểu 'T = không phải nữ quyền'). Chưa mở được bài của Gigerenzer nên vế quy cho Gigerenzer và 'tần suất' chưa đối chiếu trực tiếp."
- trang: trai-nghiem/linda
