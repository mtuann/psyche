  luot_2: khong-chac
  nguon: []
  ghi_chu: "Nguồn là sách Kahneman (2011), agent không đọc được; chưa mở được bài bậc 1-2 (Kahneman và Frederick 2002) để xác nhận câu này."
- trang: trai-nghiem/linda
