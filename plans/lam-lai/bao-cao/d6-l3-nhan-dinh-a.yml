- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n1
  cau: Bốn giai đoạn nhận thức của Piaget, hai thí nghiệm kinh điển về bảo toàn và lỗi A-not-B, và những hiệu chỉnh quan trọng của nghiên cứu hiện đại (mô tả của trang).
  loai: lich-su
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n2
  cau: Trẻ 5 tuổi (tiền thao tác) thường chưa nhận ra hai cốc có lượng nước bằng nhau; có em chỉ vào chiếc cốc cao. Trẻ 8 tuổi (thao tác cụ thể) thường nói hai cốc bằng nhau vì chỉ rót sang.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n3
  cau: Piaget cho rằng ở hai giai đoạn ấy trẻ tư duy theo hai cách khác nhau.
  loai: lich-su
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n4
  cau: Jean Piaget quan sát trẻ em và đề xuất rằng trẻ không phải "người lớn thu nhỏ" biết ít hơn mà tư duy khác về chất.
  loai: lich-su
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n5
  cau: "Trẻ xây dựng hiểu biết qua hai quá trình: đồng hóa (nhét trải nghiệm mới vào khuôn sẵn có) và điều ứng (sửa lại khuôn khi nó không còn đúng)."
  loai: dinh-nghia
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n6
  cau: Piaget mô tả bốn giai đoạn nối tiếp nhau; độ tuổi chỉ là gần đúng.
  loai: lich-su
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n7
  cau: "Giai đoạn vận động cảm giác: 0–2 tuổi; học qua giác quan và vận động; hình thành tính bền vững của vật thể."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n8
  cau: "Giai đoạn tiền thao tác: 2–7 tuổi; dùng ngôn ngữ và biểu tượng; chơi giả vờ; chưa hiểu bảo toàn; còn khó nhìn từ góc nhìn của người khác."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n9
  cau: "Giai đoạn thao tác cụ thể: 7–11 tuổi; suy luận logic với sự vật cụ thể; hiểu bảo toàn và tính đảo ngược."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n10
  cau: "Giai đoạn thao tác hình thức: khoảng 11 tuổi trở đi; suy nghĩ về ý tưởng trừu tượng và tình huống giả định."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n11
  cau: "Thí nghiệm bảo toàn: trẻ xem nước được rót từ cốc thấp, rộng sang cốc cao, hẹp ngay trước mặt rồi được hỏi về lượng nước."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n12
  cau: Trẻ tiền thao tác chưa hiểu bảo toàn (có em cho rằng cốc cao chứa nhiều nước hơn); từ khoảng 7 tuổi trẻ hiểu lượng nước không đổi và giải thích được bằng tính đảo ngược.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n13
  cau: "Bảo toàn: hiểu rằng lượng của một chất không đổi dù hình dạng bên ngoài thay đổi."
  loai: dinh-nghia
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n14
  cau: "Thí nghiệm lỗi A-not-B: giấu đồ chơi ở vị trí A vài lần cho trẻ tìm thấy, rồi giấu ở vị trí B ngay trước mắt trẻ."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n15
  cau: Trẻ 8–12 tháng tuổi, dù vừa nhìn thấy đồ được giấu ở B, vẫn thò tay tìm ở A.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n16
  cau: Theo Piaget, lỗi A-not-B là bằng chứng trẻ còn gắn đồ vật với hành động của chính mình và chưa nắm trọn tính bền vững của vật thể.
  loai: lich-su
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n17
  cau: Khoảng trễ cần để gây lỗi A-not-B tăng từ 2–5 giây ở trẻ 7,5–9 tháng lên trên 10 giây ở trẻ 12 tháng.
  loai: so-lieu
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n18
  cau: Các tác giả cho rằng sự trưởng thành của vỏ não trước trán có thể nằm sau tiến bộ ở nhiệm vụ AB (dựa trên so sánh với khỉ rhesus); khả năng giữ mục tiêu trong đầu và cưỡng lại thói quen cũ tăng dần.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n19
  cau: "Hình dòng thời gian: các mốc tuổi 0, 2, 7, 11 của bốn giai đoạn."
  loai: so-lieu
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n20
  cau: "Hình: 3,5 tháng hiểu vật thể tồn tại khi khuất (Baillargeon, 1987)."
  loai: so-lieu
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n21
  cau: "Hình: 5 tháng phân biệt 1+1=2 và 1+1=1 (Wynn, 1992)."
  loai: so-lieu
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n22
  cau: "Hình: ~4–5 tuổi bảo toàn khi đề bài có ngữ cảnh (McGarrigle & Donaldson, 1974)."
  loai: so-lieu
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n23
  cau: "Chú thích hình: bốn giai đoạn theo độ tuổi gần đúng, cùng ba phát hiện hiện đại cho thấy năng lực nhận thức xuất hiện sớm hơn mốc Piaget khi bài kiểm tra phù hợp hơn."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n24
  cau: Baillargeon cho trẻ 3,5 và 4,5 tháng xem một tấm màn quay tới lui như cầu kéo cho đến khi chán (habituation).
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n25
  cau: "Sau đó một chiếc hộp được đặt sau tấm màn: tình huống hợp lý là màn quay đến chạm hộp thì dừng, tình huống phi lý là màn quay xuyên qua chỗ hộp như thể hộp biến mất."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n26
  cau: Trẻ 4,5 tháng, và trẻ 3,5 tháng thuộc nhóm nhanh chán, nhìn tình huống phi lý lâu hơn tình huống hợp lý.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n27
  cau: Các thí nghiệm đối chứng không đặt hộp loại trừ cách giải thích khác (trẻ chỉ thích góc quay 180 độ).
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n28
  cau: Baillargeon kết luận trẻ nhỏ hiểu hộp vẫn tồn tại sau khi bị che và tấm màn không thể quay xuyên qua chỗ chiếc hộp.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n29
  cau: Piaget cho rằng trẻ chỉ bắt đầu chia sẻ niềm tin vật tồn tại liên tục từ khoảng 9 tháng.
  loai: lich-su
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n30
  cau: "Điểm phương pháp: Piaget bắt trẻ thò tay tìm đồ vật, Baillargeon chỉ đo thời gian nhìn; tìm bằng tay đòi hỏi phối hợp các hành động riêng rẽ và có thể cả trí nhớ."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n31
  cau: Wynn cho trẻ 5 tháng tuổi xem một vật trên sân khấu, che màn, rồi đặt thêm một vật giống hệt sau màn; khi mở màn có lúc là hai vật (1+1=2), có lúc một vật (1+1=1); tương tự với phép trừ 2−1.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n32
  cau: Trẻ nhìn kết quả phi lý lâu hơn kết quả hợp lý, ở cả phép cộng và phép trừ (khác biệt có ý nghĩa thống kê).
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n33
  cau: Wynn kết luận trẻ 5 tháng tuổi đã tính được kết quả phép toán đơn giản trên số lượng nhỏ.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n34
  cau: Một nghiên cứu lặp lại thủ tục của Wynn trên 68 trẻ 5 tháng tuổi không thấy bằng chứng nhất quán rằng trẻ cộng trừ được.
  loai: tai-lap
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n35
  cau: "Khung Khá vững: trẻ xây dựng hiểu biết qua tương tác với thế giới, với cách lý giải riêng ở từng độ tuổi."
  loai: nhan
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n36
  cau: "Khung Khá vững: thứ tự xuất hiện của các năng lực nhận thức tương đối ổn định."
  loai: nhan
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n37
  cau: "Khung Đang tranh cãi: độ tuổi cứng nhắc gắn với từng giai đoạn."
  loai: nhan
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n38
  cau: 'McGarrigle & Donaldson (1974): trẻ 4–5 tuổi trả lời đúng bài toán bảo toàn số lượng khi một chú gấu "nghịch ngợm" làm xáo trộn hàng nút.'
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n39
  cau: Lỗi A-not-B có thể phản ánh vấn đề về trí nhớ hơn là thiếu khái niệm vật thể.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n40
  cau: "Khung Đã bị bác bỏ: trẻ sơ sinh hoàn toàn không có khái niệm vật thể tồn tại khi khuất mắt."
  loai: nhan
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n41
  cau: 'Piaget: trẻ tự xây dựng kiến thức qua đồng hóa và điều ứng, không "tải" kiến thức có sẵn.'
  loai: lich-su
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n42
  cau: "Hạn chế của Piaget: bài tìm đồ của ông đòi hỏi nhiều kỹ năng cùng lúc (phối hợp hành động, trí nhớ), nên có thể đánh giá thấp năng lực sớm của trẻ."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n43
  cau: 'Vygotsky nhấn mạnh vai trò của tương tác xã hội: trẻ có thể làm được nhiều hơn khi có người hiểu biết hơn hỗ trợ, trong "vùng phát triển gần".'
  loai: dinh-nghia
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n44
  cau: 'Elizabeth Spelke và cộng sự: nhận thức dựa một phần trên vài "hệ lõi" biểu diễn vật thể, hành động, số lượng và không gian, có gốc rễ sâu từ rất sớm.'
  loai: lich-su
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n45
  cau: Khả năng giữ mục tiêu trong đầu và cưỡng lại thói quen cũ còn đang phát triển ở trẻ nhỏ; nhiều lỗi của trẻ như A-not-B có thể là lỗi của bộ nhớ và sự kiềm chế.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n46
  cau: "Mục 1: dạy bằng trải nghiệm cụ thể trước khi trừu tượng hóa (Khá vững)."
  loai: nhan
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n47
  cau: "Dạy toán bằng vật thật cho kết quả nhỉnh hơn chỉ dùng ký hiệu: tổng hợp 55 nghiên cứu thấy hiệu ứng nhỏ đến vừa, tùy cách dạy."
  loai: so-lieu
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n48
  cau: 'Mục 2: một câu trả lời "sai" chưa chắc là không hiểu; hỏi lại thay vì sửa ngay (Khá vững).'
  loai: nhan
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n49
  cau: 'Mục 3: chơi giả vờ có phải là "phòng thí nghiệm" tư duy (Đang tranh cãi).'
  loai: nhan
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n50
  cau: "Tổng quan: bằng chứng hiện có không ủng hộ khẳng định mạnh về vai trò độc nhất của chơi giả vờ với sự phát triển."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n51
  cau: Chơi giả vờ gắn với giai đoạn tiền thao tác (dùng biểu tượng).
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n52
  cau: "Lời dẫn: các lời khuyên rút ra từ nguyên lý chung và vài tổng hợp nhỏ, không phải công thức cho từng trẻ; nếu lo về một em bé cụ thể hãy hỏi bác sĩ nhi khoa hay chuyên viên."
  loai: loi-khuyen
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n53
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu thực nghiệm nào kiểm tra các giai đoạn của Piaget trên trẻ em Việt Nam.
  loai: thoi-su
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n54
  cau: Các nghiên cứu liên văn hóa cho thấy thứ tự các năng lực nhận thức ổn định ở nhiều nền văn hóa, tốc độ chịu ảnh hưởng của giáo dục.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n55
  cau: 'Ngộ nhận "Trẻ con là người lớn thu nhỏ": theo Piaget, trẻ lý giải thế giới bằng cách riêng của từng giai đoạn.'
  loai: lich-su
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n56
  cau: 'Ngộ nhận "Càng dạy sớm kiến thức trừu tượng càng tốt": trẻ thao tác cụ thể mới suy nghĩ logic được về sự việc cụ thể; lớp dạy toán bằng vật thật nhỉnh hơn lớp chỉ dùng ký hiệu.'
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n57
  cau: 'Ngộ nhận "Trẻ dưới 7 tuổi không hiểu gì về số lượng": Wynn thấy trẻ 5 tháng nhìn lâu hơn khi kết quả sai, một lần lặp lại không thấy; không nên xem việc trẻ 5 tháng "làm toán" là đã chốt.'
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n58
  cau: 'Ngộ nhận "Mốc tuổi của Piaget là lịch trình bắt buộc": giáo trình ghi các độ tuổi của Piaget là gần đúng.'
  loai: lich-su
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n59
  cau: "Câu 1 (trắc nghiệm): trẻ tiền thao tác chưa hiểu bảo toàn vì chưa thực hiện được các thao tác tư duy như đảo ngược; đó là cách nghĩ của giai đoạn, không phải trẻ cố tình trả lời sai."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n60
  cau: "Câu 2: Baillargeon đo thời gian nhìn thay vì bắt trẻ thò tay tìm; Piaget bắt trẻ phối hợp tay mắt để tìm đồ; khi chỉ cần nhìn, trẻ 3,5–4,5 tháng nhìn lâu hơn ở tình huống phi lý."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n61
  cau: "Câu 3: lỗi A-not-B có thể phản ánh hạn chế của trí nhớ làm việc và khả năng kiềm chế thói quen cũ; để tìm đúng ở B trẻ phải giữ vị trí mới trong đầu và cưỡng lại thói quen thò tay về A."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n62
  cau: "Câu 4: phát hiện nhìn lâu hơn khi 1+1=1 của trẻ 5 tháng (Wynn) mâu thuẫn nhất với mốc của Piaget; theo giáo trình hiểu bảo toàn số lượng thuộc giai đoạn thao tác cụ thể."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-the-nao
  id: n63
  cau: "Câu 5: mốc tuổi gắn nhãn Đang tranh cãi vì trẻ thể hiện năng lực sớm hơn khi bài kiểm tra phù hợp hơn; thứ tự năng lực tương đối ổn định, con số tuổi phụ thuộc cách đo."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n1
  cau: "Trang mô tả: vì sao trẻ sơ sinh phân biệt được âm của nhiều ngôn ngữ rồi hẹp dần theo tiếng mẹ đẻ, và lộ trình từ bập bẹ đến từ đầu tiên."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n2
  cau: Người lớn học ngoại ngữ chật vật với những âm lạ, như người Nhật phân biệt /r/ và /l/ trong tiếng Anh.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n3
  cau: Em bé 6 tháng trong gia đình chỉ nói tiếng Anh, chưa từng nghe một thứ tiếng khác, nhiều khả năng phân biệt được các cặp âm lạ; gần 12 tháng khả năng ấy giảm rõ rệt (nếu chỉ nghe tiếng mẹ đẻ).
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n4
  cau: Trong năm đầu, trẻ dần giỏi phân biệt âm tiếng mẹ đẻ và mất dần khả năng phân biệt âm không có trong tiếng mẹ đẻ, từ khoảng 6 đến 12 tháng.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n5
  cau: Trong nửa đầu năm đầu đời trẻ phân biệt được nhiều cặp âm của các ngôn ngữ trên thế giới.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n6
  cau: "Lộ trình phát âm: từ khóc và gừ gừ, đến bập bẹ có âm tiết rõ ràng, từ đầu tiên vào khoảng sinh nhật đầu tiên, ghép từ vào khoảng 18 tháng."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n7
  cau: Trẻ thường hiểu một số từ trước khi nói được.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n8
  cau: 'Hình lo-trinh-hoc-noi: các mốc 0, 6, 12, 18, 24 tháng; "2–4 tháng: cooing".'
  loai: so-lieu
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n9
  cau: 'Hình: "6–8 tháng: bập bẹ chuẩn" và "6–12 tháng: hẹp dần theo tiếng mẹ đẻ"; "~12 tháng: từ đầu tiên".'
  loai: so-lieu
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n10
  cau: 'Hình: "~18 tháng: bùng nổ từ vựng"; chú thích "thứ tự các mốc rất ổn định".'
  loai: so-lieu
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n11
  cau: Werker và Tees (1984) cho trẻ học tiếng Anh nghe các cặp phụ âm không có trong tiếng Anh, ở nhiều độ tuổi trong năm đầu.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n12
  cau: Khả năng phân biệt phụ âm không có trong tiếng mẹ đẻ giảm từ 6–8 tháng sang 10–12 tháng tuổi; trẻ vẫn phân biệt tốt phụ âm tiếng Anh.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n13
  cau: Kuhl và cộng sự (2006) kiểm tra trẻ 6–8 và 10–12 tháng ở Mỹ (32 trẻ) và Nhật (32 trẻ) với cặp /r/–/l/ có trong tiếng Anh nhưng không có trong tiếng Nhật.
  loai: so-lieu
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n14
  cau: Ở 6–8 tháng trẻ Mỹ và Nhật phân biệt /r/–/l/ ngang nhau, khoảng 65% đúng.
  loai: so-lieu
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n15
  cau: Đến 10–12 tháng trẻ Mỹ giỏi lên (63,7% lên 73,8% đúng); trẻ Nhật có xu hướng kém đi (64,7% xuống 59,9%), mức giảm riêng của nhóm Nhật không có ý nghĩa thống kê và vẫn trên mức ngẫu nhiên.
  loai: so-lieu
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n16
  cau: 'Nhóm tác giả giải thích bằng "cam kết thần kinh" với đặc tính âm thanh của tiếng mẹ đẻ: kinh nghiệm tăng cường khả năng nghe âm quen và làm giảm khả năng nghe âm lạ.'
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n17
  cau: "Thí nghiệm 1: 32 trẻ Mỹ khoảng 9 tháng bắt đầu, 21 trẻ hoàn thành (10 nhóm Quan Thoại, 11 nhóm đối chứng); 12 buổi trong 4 tuần, mỗi buổi 25 phút (10 phút đọc sách, 15 phút chơi đồ chơi) với người bản ngữ."
  loai: so-lieu
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n18
  cau: Nhóm đối chứng đến đủ 12 buổi nhưng chỉ nghe tiếng Anh.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n19
  cau: "Thí nghiệm 2: 32 trẻ khác (28 hoàn thành), xem DVD có hình và tiếng (AV) hay chỉ nghe tiếng (A), cùng người nói và tài liệu."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n20
  cau: Sau 12 buổi trực tiếp (5 giờ), trẻ Mỹ phân biệt cặp phụ âm Quan Thoại ngang với trẻ cùng tuổi ở Đài Loan (so với số liệu đã công bố trước).
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n21
  cau: Nhóm xem TV hoặc nghe băng không cho thấy việc học nào; kết quả không khác nhóm đối chứng.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n22
  cau: Nhóm DVD nghe cùng thời gian nhưng nhiều âm tiết hơn nhóm gặp người thật; chỉ khác ở chỗ có người thật tương tác hay không.
  loai: so-lieu
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n23
  cau: 'Hiện tượng hẹp dần: bảy trong chín tương phản phụ âm đã công bố cho thấy suy giảm giữa 6–8 và 10–12 tháng; hai thì không (tiếng "click" châu Phi; /d/–/th/ ở trẻ Pháp).'
  loai: tai-lap
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n24
  cau: Một phân tích tổng hợp về nguyên âm thấy hiệu ứng khi phân biệt nguyên âm bản ngữ và không bản ngữ đổi theo hai chiều ngược nhau theo tuổi trong năm đầu.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n25
  cau: "Hẹp dần cũng thấy với thanh điệu: trẻ Trung Quốc 6 và 9 tháng phân biệt thanh tốt như nhau, trẻ Anh kém đi giữa 6 và 9 tháng."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n26
  cau: "Khung Vững chắc: hẹp dần theo tiếng mẹ đẻ trong khoảng 6–12 tháng tuổi."
  loai: nhan
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n27
  cau: "Khung Khá vững: tương tác trực tiếp với người thật giúp trẻ học âm mới hiệu quả hơn nghe thụ động."
  loai: nhan
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n28
  cau: "Tổng hợp video deficit (59 báo cáo, 122 hiệu ứng, trẻ 0–6 tuổi): trẻ nhìn chung học kém hơn từ video, khoảng nửa độ lệch chuẩn, có thể bị ước lượng quá cao; deficit giảm theo tuổi."
  loai: so-lieu
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n29
  cau: 'Khung Đã bị bác bỏ: cho trẻ xem video dạy ngoại ngữ là đủ để trẻ "thấm" âm.'
  loai: nhan
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n30
  cau: Hart và Risley (1995) ước tính đến 4 tuổi, trẻ nhóm hưởng trợ cấp nghe ít hơn trẻ nhóm gia đình trí thức khoảng 30 triệu từ hướng tới trẻ.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n31
  cau: Con số 30 triệu từ khơi ra nhiều nghiên cứu lặp lại và cả tranh luận.
  loai: lich-su
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n32
  cau: "Sperry, Sperry và Miller (2019): năm cộng đồng ở Mỹ, quan sát tại nhà 42 trẻ 18–48 tháng, không ủng hộ khẳng định của Hart và Risley, thấy khác biệt lớn trong từng nhóm thu nhập; cách định nghĩa loại trừ nhiều người chăm sóc và lời nghe lỏm làm đánh giá thấp lượng từ trẻ thu nhập thấp nghe."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n33
  cau: Golinkoff và cộng sự (2019) phản biện rằng điều quan trọng là chất lượng lời nói hướng trực tiếp vào trẻ, không phải lời nghe lỏm.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n34
  cau: 'Khung Đang tranh cãi: "khoảng cách 30 triệu từ".'
  loai: nhan
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n35
  cau: "Học thống kê: trẻ 6–8 tháng tách từ qua xác suất chuyển tiếp giữa các âm tiết; Kuhl và cộng sự đề xuất kinh nghiệm với tiếng mẹ đẻ dẫn đến cam kết thần kinh."
  loai: lich-su
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n36
  cau: Chomsky đề xuất trẻ sinh ra đã có năng lực học ngôn ngữ; các mốc đầu giống nhau ở nhiều nền văn hóa.
  loai: lich-su
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n37
  cau: Kuhl và cộng sự (2003) gợi ý tương tác xã hội đóng vai trò quan trọng trong học ngôn ngữ ở trẻ nhỏ, có thể giống vai trò của tương tác xã hội trong việc chim học hót.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n38
  cau: "Tomasello và Farrar (1986), 24 trẻ: trong lúc mẹ và trẻ cùng chú ý vào một vật, cả hai nói nhiều hơn."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n39
  cau: Các khung lý thuyết không loại trừ nhau.
  loai: lich-su
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n40
  cau: "Mục 1: nói chuyện trực tiếp, đáp lại bập bẹ (Khá vững)."
  loai: nhan
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n41
  cau: "Tổng hợp 36 nghiên cứu: đáp ứng nhạy bén của cha mẹ gắn với ngôn ngữ của trẻ, r = 0,27; chưa nói được nhân quả."
  loai: so-lieu
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n42
  cau: "Mục 2: đừng lo khi trẻ hiểu nhiều hơn nói (Khá vững)."
  loai: nhan
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n43
  cau: "Fenson và cộng sự (1994): 1.803 trẻ 8–30 tháng, biến thiên rất rộng về thời điểm và tốc độ phát triển từ vựng, cử chỉ và ngữ pháp."
  loai: so-lieu
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n44
  cau: 'Mục 3: cẩn trọng với "video dạy nói" cho trẻ dưới 1 tuổi (Khá vững).'
  loai: nhan
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n45
  cau: Lời dẫn tới người có chuyên môn (bác sĩ nhi khoa, chuyên viên ngôn ngữ trị liệu) và link Hỗ trợ khi lo về phát triển ngôn ngữ của một em bé cụ thể.
  loai: loi-khuyen
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n46
  cau: Các mốc tuổi trong bài là gần đúng; trẻ khác nhau đi với tốc độ khác nhau.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n47
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào về hiện tượng hẹp dần thính giác hay lộ trình học nói trên trẻ em Việt Nam.
  loai: thoi-su
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n48
  cau: Tiếng Việt là ngôn ngữ thanh điệu với 6 thanh.
  loai: dinh-nghia
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n49
  cau: Nghiên cứu về trẻ sơ sinh vốn tập trung vào phụ âm và nguyên âm hơn là thanh điệu.
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n50
  cau: 'Ngộ nhận "Trẻ 6 tháng nghe gì cũng như nhau, cứ bật loa ngoại ngữ là con tự thấm": trong thí nghiệm của Kuhl 2003 trẻ 9 tháng học được âm mới từ người thật nhưng không từ DVD hay băng tiếng.'
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n51
  cau: 'Ngộ nhận "Trẻ nhà nghèo nghe ít hơn trẻ nhà giàu đúng 30 triệu từ": con số đến từ một nghiên cứu năm 1995 và đang bị tranh cãi.'
  loai: lich-su
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n52
  cau: 'Ngộ nhận "Bập bẹ chỉ là tiếng ồn vô nghĩa": bập bẹ là một mốc trong phát triển tiếng nói, thường đến trước từ đầu tiên; giáo trình ghi âm điệu của trẻ theo tiếng mẹ đẻ.'
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n53
  cau: 'Ngộ nhận "Trẻ học nói bằng cách bắt chước như vẹt": Skinner nghĩ trẻ học qua củng cố, Chomsky phê bình và đề xuất năng lực bẩm sinh; khung hiện nay không dừng ở bắt chước.'
  loai: lich-su
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n55
  cau: "Câu 1: hẹp dần theo ngôn ngữ mẹ đẻ là trẻ ngày càng giỏi phân biệt âm tiếng mẹ đẻ và mất dần khả năng phân biệt âm không có trong tiếng mẹ đẻ."
  loai: dinh-nghia
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n56
  cau: "Câu 2: ở trẻ học tiếng Anh nghe phụ âm không có trong tiếng Anh, khả năng phân biệt giảm rõ rệt từ 6–8 sang 10–12 tháng; giảm trong khoảng 6–12 tháng nếu âm không có trong môi trường của trẻ."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n57
  cau: "Câu 3: nhóm xem TV không học được vì thiếu tương tác xã hội trực tiếp (yếu tố đề xuất); cùng nội dung, cùng thời gian nghe, chỉ khác có người thật đọc sách và chơi cùng hay không."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n58
  cau: "Câu 4: trẻ có thể hiểu một số từ từ khoảng 6 tháng, khi chưa nói được từ nào; nghe hiểu thường đi trước nói; đếm từ nói được có thể đánh giá thấp những gì trẻ biết."
  loai: phat-hien
- trang: kham-pha/phat-trien/tre-hoc-noi
  id: n59
  cau: "Câu 5: con số 30 triệu từ gắn nhãn Đang tranh cãi vì Sperry và cộng sự (2019) không ủng hộ khẳng định của Hart và Risley, và học giới tranh luận về cách đo và ý nghĩa."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n1
  cau: "Trang mô tả: điều quan trọng không phải là bé có khóc khi xa mẹ hay không mà là bé làm gì khi mẹ quay lại; cùng các kiểu gắn bó được mô tả từ đó."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n2
  cau: "Tình huống tự trải nghiệm: bé 14 tháng, phòng chơi lạ, người lạ vào, mẹ ra khỏi phòng rồi quay lại."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n3
  cau: "Bé (a): òa khóc khi mẹ đi, khi mẹ về vừa bám chặt vừa đẩy ra, giận dỗi, mãi không nín: kiểu kháng cự/mập mờ."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n4
  cau: "Bé (b): không tỏ vẻ gì khi mẹ đi, khi mẹ về vẫn mải chơi, quay mặt đi: kiểu tránh né; các nhà nghiên cứu cho rằng đó nhiều khả năng là phản ứng phòng thủ."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n5
  cau: "Bé (c): hơi mếu khi mẹ đi, khi về bò lại gần, được ôm thì nín và quay lại chơi: kiểu an toàn, dùng người chăm sóc làm bệ đỡ để khám phá."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n6
  cau: Các nhà nghiên cứu không dựa vào việc bé có khóc khi mẹ ra khỏi phòng hay không để xếp kiểu gắn bó; điểm quan trọng nằm ở lúc mẹ quay lại.
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n7
  cau: Ba mô tả minh họa không dùng để xếp loại hay chẩn đoán một em bé cụ thể.
  loai: loi-khuyen
- trang: kham-pha/phat-trien/gan-bo
  id: n8
  cau: "Kiểu thứ tư (vô tổ chức): bé có hành vi mâu thuẫn, khó hiểu khi mẹ quay lại."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n9
  cau: Một em bé sơ sinh phụ thuộc rất nhiều vào người chăm sóc để được nuôi và được bảo vệ.
  loai: dinh-nghia
- trang: kham-pha/phat-trien/gan-bo
  id: n10
  cau: Chương trình sinh tồn của bé thiên về giữ người chăm sóc ở gần, bằng các hành vi như khóc, cười, bám, bò theo.
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n11
  cau: Bowlby gọi hệ thống này là hệ thống hành vi gắn bó, có mục tiêu duy trì sự gần gũi với hình mẫu gắn bó.
  loai: lich-su
- trang: kham-pha/phat-trien/gan-bo
  id: n12
  cau: Gắn bó không chỉ là chuyện được cho ăn (thí nghiệm khỉ con của Harlow gợi ý điều tương tự; kết quả ở khỉ, suy sang người có giới hạn).
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n13
  cau: Người chăm sóc cho bé cảm giác an toàn khi bé khám phá ("bệ đỡ an toàn", secure base).
  loai: dinh-nghia
- trang: kham-pha/phat-trien/gan-bo
  id: n14
  cau: Người chăm sóc là "nơi trú ẩn an toàn" (safe haven) khi bé hoảng sợ.
  loai: dinh-nghia
- trang: kham-pha/phat-trien/gan-bo
  id: n15
  cau: "Bowlby (1958): gắn bó của bé với mẹ do các hành vi đặc trưng của loài (khóc, cười, bám, bú, đi theo), không phải vai trò cung cấp thức ăn của mẹ."
  loai: lich-su
- trang: kham-pha/phat-trien/gan-bo
  id: n16
  cau: "Bowlby (1969): kết hợp các khái niệm tiến hóa, sinh học, phát triển và nhận thức thành lý thuyết gắn bó; có khái niệm mô hình làm việc nội tại để hiểu tính liên tục của hành vi gắn bó."
  loai: lich-su
- trang: kham-pha/phat-trien/gan-bo
  id: n17
  cau: Ainsworth thiết kế "tình huống lạ" để quan sát gắn bó trong phòng thí nghiệm; quy trình gồm 8 phân đoạn, mỗi phân đoạn tối đa khoảng 3 phút (tổng khoảng 20 phút).
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n18
  cau: "Bé khoảng 1 tuổi: mẫu 1970 gồm 56 bé da trắng, gia đình trung lưu, 49–51 tuần tuổi; giáo trình nêu độ tuổi tình huống lạ là 12–18 tháng."
  loai: so-lieu
- trang: kham-pha/phat-trien/gan-bo
  id: n19
  cau: "Quy trình: bé và mẹ vào phòng chơi lạ, một người lạ bước vào, mẹ ra ngoài hai lần (lần thứ hai bé ở một mình), rồi mẹ quay lại."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n20
  cau: "Hành vi của bé được ghi lại và mã hóa (1970: người quan sát ghi bằng máy ghi âm); tránh né và kháng cự nổi lên rõ nhất ở các lần đoàn tụ."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n21
  cau: "Ainsworth và cộng sự mô tả ba kiểu: an toàn (B), tránh né (A), kháng cự (C)."
  loai: lich-su
- trang: kham-pha/phat-trien/gan-bo
  id: n22
  cau: "Kiểu B (an toàn): bé có thể buồn khi mẹ đi; khi mẹ về tìm đến, được vỗ về thì nín và quay lại chơi tiếp; kiểu phổ biến nhất."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n23
  cau: "Kiểu A (tránh né): ít buồn khi mẹ đi; khi về né tránh hoặc phớt lờ mẹ, mải đồ chơi; Ainsworth và Bell cho rằng nhiều khả năng đó là phản ứng phòng thủ; theo Ainsworth các bé này thường có người chăm sóc thiếu nhạy cảm."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n24
  cau: "Kiểu C (kháng cự): rất buồn khi mẹ đi; khi về vừa bám vừa đẩy ra, giận dỗi, rất khó vỗ về."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n25
  cau: Kiểu an toàn là kiểu phổ biến nhất; bài 1970 mô tả 56 bé và không nêu tỉ lệ ba kiểu.
  loai: so-lieu
- trang: kham-pha/phat-trien/gan-bo
  id: n26
  cau: Main và Solomon (1986, 1990) mô tả kiểu thứ tư, vô tổ chức/mất phương hướng (nhóm D).
  loai: lich-su
- trang: kham-pha/phat-trien/gan-bo
  id: n27
  cau: Trong tình huống lạ, bé kiểu D có hành vi khó hiểu, mâu thuẫn và rời rạc.
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n28
  cau: Kiểu D khoảng 15% ở gia đình trung lưu bình thường, có thể gấp hai đến ba lần ở các bối cảnh khác và nhóm lâm sàng (ví dụ bị bạo hành); hành vi đáng sợ của người chăm sóc có thể đóng vai trò nhưng không phải nguyên nhân duy nhất.
  loai: so-lieu
- trang: kham-pha/phat-trien/gan-bo
  id: n29
  cau: "Fearon và cộng sự (2010): 69 mẫu, 5.947 trẻ; gắn bó không an toàn liên hệ với vấn đề hành vi hướng ngoại, d = 0,31."
  loai: so-lieu
- trang: kham-pha/phat-trien/gan-bo
  id: n30
  cau: Nhóm vô tổ chức d = 0,34; tránh né d = 0,12; kháng cự d = 0,11 (khoảng tin cậy gồm 0).
  loai: so-lieu
- trang: kham-pha/phat-trien/gan-bo
  id: n31
  cau: "Groh và cộng sự (2012): 42 mẫu, 4.614 trẻ; gắn bó không an toàn liên hệ với triệu chứng hướng nội, d = 0,15; riêng nhóm tránh né d = 0,17."
  loai: so-lieu
- trang: kham-pha/phat-trien/gan-bo
  id: n32
  cau: Hiệu ứng nhỏ đến vừa nghĩa là phần lớn khác biệt về hành vi và cảm xúc sau này không được giải thích bởi kiểu gắn bó sớm.
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n33
  cau: "van IJzendoorn và Kroonenberg (1988): gần 2.000 lượt phân loại ở 8 nước; khác biệt trong cùng một nước gần 1,5 lần khác biệt giữa các nước."
  loai: so-lieu
- trang: kham-pha/phat-trien/gan-bo
  id: n34
  cau: Kiểu tránh né (A) tương đối nhiều hơn ở Tây Âu, kiểu kháng cự (C) nhiều hơn ở Israel và Nhật Bản.
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n35
  cau: "Rothbaum và cộng sự (2000): ba giả thuyết cốt lõi (nhạy cảm → an toàn; an toàn → năng lực xã hội; bệ đỡ an toàn) được đo bằng các thước đo thiên về tự chủ, cá nhân hóa, khám phá; so sánh Mỹ và Nhật thấy sự nhạy cảm, năng lực xã hội và bệ đỡ an toàn được hiểu rất khác ở Nhật; kêu gọi cách tiếp cận bản địa."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n36
  cau: "Giáo trình: gắn bó thay đổi theo văn hóa, một yếu tố Ainsworth không tính đến."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n37
  cau: "Các kiểu gắn bó trong tình huống lạ có thể được mã hóa tin cậy: tổng hợp gần 80 nghiên cứu (hơn 6.000 cặp mẹ–bé) cho độ tin cậy và giá trị phân biệt của kiểu D."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n38
  cau: "Khung Vững chắc: các kiểu gắn bó trong tình huống lạ có thể được mã hóa tin cậy; kiểu an toàn là phổ biến nhất."
  loai: nhan
- trang: kham-pha/phat-trien/gan-bo
  id: n39
  cau: "Khung Khá vững: gắn bó thời thơ ấu dự báo ở mức nhỏ đến vừa các kết quả cảm xúc–xã hội sau này."
  loai: nhan
- trang: kham-pha/phat-trien/gan-bo
  id: n40
  cau: "Khung Đang tranh cãi: thuyết gắn bó là phổ quát hay chỉ là một lý thuyết phương Tây?"
  loai: nhan
- trang: kham-pha/phat-trien/gan-bo
  id: n41
  cau: 'Khung Đã bị bác bỏ: "bé bám mẹ, khóc khi xa mẹ là hư; bé không khóc mới là ngoan, độc lập".'
  loai: nhan
- trang: kham-pha/phat-trien/gan-bo
  id: n42
  cau: "Ainsworth và Bell (1970): khi mẹ vắng, bé khóc và tìm kiếm tăng; khi mẹ trở lại, tìm gần và tiếp xúc tăng."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n43
  cau: "Một số bé kháng cự: vừa muốn gần mẹ vừa đẩy ra (hành vi kháng cự tiếp xúc cùng hành vi duy trì tiếp xúc); một số tránh né mẹ ở lần đoàn tụ."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n44
  cau: "Bowlby: gắn bó lành mạnh cần người chăm sóc đáp ứng nhu cầu của bé và những tương tác vui vẻ hai chiều; khái niệm mô hình làm việc nội tại giúp hiểu tính liên tục của hành vi gắn bó."
  loai: lich-su
- trang: kham-pha/phat-trien/gan-bo
  id: n45
  cau: "Bé an toàn có người chăm sóc nhạy cảm, đáp ứng; bé tránh né nhiều khả năng có người chăm sóc thiếu nhạy cảm; tổng hợp 66 nghiên cứu: r = 0,24 ở 21 nghiên cứu dùng tình huống lạ; sự nhạy cảm quan trọng nhưng không phải điều kiện duy nhất."
  loai: so-lieu
- trang: kham-pha/phat-trien/gan-bo
  id: n46
  cau: Khí chất liên hệ yếu với gắn bó không an toàn nói chung (d = 0,14, 109 mẫu, N = 11.440), nhưng liên hệ vừa với kiểu kháng cự (d = 0,30); không có ý nghĩa với tránh né (0,10) và vô tổ chức (0,11).
  loai: so-lieu
- trang: kham-pha/phat-trien/gan-bo
  id: n47
  cau: Có ý kiến cho rằng kiểu gắn bó phản ánh khí chất bẩm sinh hơn là cách chăm sóc.
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n48
  cau: "Mục 1: đáp ứng tín hiệu của bé (Khá vững)."
  loai: nhan
- trang: kham-pha/phat-trien/gan-bo
  id: n49
  cau: 'Mục 2: bỏ mặc bé khóc để "luyện tự lập" (Đang tranh cãi).'
  loai: nhan
- trang: kham-pha/phat-trien/gan-bo
  id: n50
  cau: "Thử nghiệm ngẫu nhiên Gradisar và cộng sự (2016): 43 bé 6–16 tháng; cả graduated extinction và bedtime fading cho lợi ích về giấc ngủ, không thấy phản ứng căng thẳng bất lợi hay ảnh hưởng lâu dài lên gắn bó (đo bằng tình huống lạ sau 12 tháng) hay cảm xúc, hành vi."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n51
  cau: "Price và cộng sự (2012): theo dõi 5 năm, 225 gia đình (69%), không có khác biệt giữa nhóm can thiệp hành vi giấc ngủ và nhóm chăm sóc thông thường ở mọi kết cục (cảm xúc, hành vi, quan hệ cha mẹ–con, sức khỏe tâm thần của mẹ…)."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n52
  cau: "Mục 3: người chăm sóc không nhất thiết là mẹ ruột (Khá vững)."
  loai: nhan
- trang: kham-pha/phat-trien/gan-bo
  id: n53
  cau: "Fox và cộng sự (1991): 11 nghiên cứu về mức tương hợp kiểu gắn bó của cùng một bé với mẹ và bố; an toàn với một người liên hệ với an toàn với người kia; các tác giả nêu thắc mắc về ý nghĩa của phân loại tình huống lạ (có thể phản ánh cả khí chất)."
  loai: so-lieu
- trang: kham-pha/phat-trien/gan-bo
  id: n54
  cau: "Mục 4: bé bám mẹ là bình thường (Khá vững)."
  loai: nhan
- trang: kham-pha/phat-trien/gan-bo
  id: n55
  cau: "Lời dẫn: nếu lo lắng về mức độ bám của một em bé cụ thể, hãy hỏi bác sĩ nhi khoa hay chuyên viên tâm lý trẻ em; xem Hỗ trợ."
  loai: loi-khuyen
- trang: kham-pha/phat-trien/gan-bo
  id: n56
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào dùng "tình huống lạ" trên trẻ em Việt Nam.
  loai: thoi-su
- trang: kham-pha/phat-trien/gan-bo
  id: n57
  cau: 'Ở Việt Nam ông bà tham gia nuôi dạy cháu khá nhiều (Hoang và cộng sự, 2022: "In Vietnamese culture, grandparents are significantly involved in the upbringing of grandchildren").'
  loai: thoi-su
- trang: kham-pha/phat-trien/gan-bo
  id: n58
  cau: Chưa tìm thấy nghiên cứu nào kiểm bằng tình huống lạ xem bệ đỡ an toàn chính của trẻ Việt là ai, và tỉ lệ các kiểu gắn bó ra sao.
  loai: thoi-su
- trang: kham-pha/phat-trien/gan-bo
  id: n59
  cau: 'Ngộ nhận "Bé bám mẹ là hư, phải tập cho tự lập từ sớm": ở khoảng 1 tuổi bé tìm gần mẹ khi mẹ vắng là hành vi gắn bó thường thấy.'
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n60
  cau: 'Ngộ nhận "Bé không khóc khi xa mẹ là ngoan, độc lập": hành vi ít khóc, phớt lờ mẹ lúc đoàn tụ là hành vi của kiểu tránh né, nhiều khả năng là phản ứng phòng thủ, không dùng để xếp loại một em bé cụ thể.'
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n61
  cau: 'Ngộ nhận "Gắn bó không an toàn hồi bé thì hỏng cả đời": hiệu ứng nhỏ đến vừa; phần lớn khác biệt sau này không được giải thích bởi kiểu gắn bó sớm.'
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n62
  cau: 'Ngộ nhận "Chỉ mẹ mới tạo được gắn bó an toàn": giáo trình nói về người chăm sóc chính và nghiên cứu đã xếp kiểu gắn bó của bé với bố.'
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n64
  cau: "Câu 1: điểm mấu chốt để phân loại kiểu gắn bó trong tình huống lạ là hành vi của bé lúc đoàn tụ (tìm đến mẹ, được vỗ về, quay lại chơi); bé khóc nhiều hay ít lúc chia tay không cho biết kiểu gắn bó."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n65
  cau: "Câu 2: kiểu an toàn là kiểu phổ biến nhất trong tình huống lạ; tổng hợp 1988: A nhiều ở Tây Âu, C nhiều ở Nhật Bản và Israel; khác biệt trong cùng một nước gần 1,5 lần giữa các nước."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n66
  cau: "Câu 3: nhóm D (Main và Solomon, 1986, 1990) có hành vi khó hiểu, mâu thuẫn, rời rạc, thiếu chiến lược nhất quán; gặp nhiều hơn ở bối cảnh nguy cơ cao như bạo hành."
  loai: phat-hien
- trang: kham-pha/phat-trien/gan-bo
  id: n67
  cau: 'Câu 4: Fearon và cộng sự (2010): 69 mẫu, 5.947 trẻ, d = 0,31, nhóm vô tổ chức mức liên hệ cao nhất; đây là bằng chứng cho "nghiêng cán cân", không phải "định đoạt số phận".'
  loai: so-lieu
- trang: kham-pha/phat-trien/gan-bo
  id: n68
  cau: "Câu 5: Rothbaum và cộng sự (2000) chất vấn tính phổ quát của cách đo và diễn giải phương Tây: so sánh Mỹ và Nhật, sự nhạy cảm, năng lực xã hội và bệ đỡ an toàn được hiểu rất khác ở Nhật."
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n1
  cau: "Trang mô tả: giai đoạn bản sắc của Erikson (1968), 4 trạng thái bản sắc của Marcia (1966), dữ liệu dọc cho thấy bản sắc chín dần tới tận tuổi 20+, và mối liên hệ với sức khỏe tâm thần."
  loai: lich-su
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n2
  cau: 'Linh, 17 tuổi (tình huống minh họa): cảm giác "nhiều phiên bản mình" có thể là một phần của việc tìm ra mình là ai, nhiệm vụ Erikson gắn với tuổi teen.'
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n3
  cau: 'Erikson (1968) xuất bản Identity: Youth and Crisis; ông cho rằng đời người đi qua 8 giai đoạn, mỗi giai đoạn có một "khủng hoảng" cần giải quyết.'
  loai: lich-su
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n4
  cau: Giai đoạn thứ năm của Erikson, khoảng 12–18 tuổi, là bản sắc đối đầu với lẫn lộn vai trò; teen phải ghép các mảnh trải nghiệm thành một cảm giác bản thân thống nhất và liên tục.
  loai: lich-su
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n5
  cau: "Giáo trình: teen giải quyết tốt có cảm giác bản thân vững và giữ được niềm tin; teen chịu áp lực theo ý người khác hay không chủ động tìm kiếm có thể có cảm giác bản thân yếu, lúng túng về tương lai."
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n6
  cau: 'Erikson: psychosocial moratorium, "khoảng lùi tâm lý–xã hội": xã hội cho teen khoảng thời gian được thử, được sai, chưa quyết định trước khi gánh trách nhiệm người lớn.'
  loai: lich-su
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n7
  cau: Marcia (khi đó nghiên cứu sinh ở Đại học Bang Ohio) dựa vào khái niệm của Erikson để đề xuất cách đo bản sắc bằng phỏng vấn, năm 1966, hai năm trước sách của Erikson.
  loai: lich-su
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n8
  cau: 'Marcia dùng hai tiêu chí: khủng hoảng ("crisis", giai đoạn dấn thân chọn giữa các lựa chọn có ý nghĩa) và cam kết ("commitment", mức độ đầu tư cá nhân), áp dụng cho nghề nghiệp, tôn giáo và chính trị.'
  loai: dinh-nghia
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n9
  cau: "Bốn trạng thái: moratorium (đang khủng hoảng, cam kết mơ hồ, nỗ lực để cam kết), achievement (đã trải qua khủng hoảng và cam kết), diffusion (thiếu cam kết), foreclosure (chưa trải qua khủng hoảng nhưng cam kết)."
  loai: dinh-nghia
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n10
  cau: "Achievement có thể là biến thể của mong muốn cha mẹ: đã xem xét nhiều lựa chọn và quyết định theo cách của mình."
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n11
  cau: "Các trạng thái là trạng thái, không phải các giai đoạn bắt buộc theo thứ tự: người ta có thể tiến hay lùi giữa các trạng thái (ví dụ minh họa 15, 19, 24 tuổi)."
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n12
  cau: "Erikson (1968): lý thuyết lâm sàng, không đo đạc, không có nhóm đối chứng; Marcia (1966) đề xuất cách đo bằng phỏng vấn sau các nỗ lực đo bản sắc trước đó."
  loai: lich-su
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n13
  cau: "Marcia (1966): 86 nam sinh viên Hiram College, phỏng vấn cá nhân; xếp vào 4 trạng thái; thêm bài tập nhận thức gây căng thẳng, cách đặt mục tiêu, thang độc đoán và lòng tự trọng."
  loai: so-lieu
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n14
  cau: Achievement làm tốt nhất bài tập nhận thức dưới căng thẳng, bỏ cuộc 1 trong 108 bài (diffusion 11 trong 120); moratorium biến thiên điểm nhiều hơn các nhóm còn lại.
  loai: so-lieu
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n15
  cau: Foreclosure đặt mục tiêu cao hơn mức đạt được (điểm chênh D = 5,06 so với 3,60 ở achievement) và điểm thang độc đoán cao hơn (45,17 so với 34,28).
  loai: so-lieu
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n16
  cau: Lòng tự trọng không phân biệt được các nhóm.
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n17
  cau: Marcia mô tả người ở foreclosure có sự cứng nhắc trong tính cách và sẽ cảm thấy bị đe dọa nếu giá trị của cha mẹ không còn dùng được.
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n18
  cau: "Kroger, Martinussen và Marcia (2010): phân tích tổng hợp 124 nghiên cứu từ 1966 đến 2005 về thay đổi trạng thái bản sắc ở tuổi teen và thanh niên."
  loai: so-lieu
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n19
  cau: "Nghiên cứu dọc: trung bình 36% thay đổi tiến bộ, 15% thoái lui, 49% giữ nguyên."
  loai: so-lieu
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n20
  cau: "Nghiên cứu cắt ngang: tỉ lệ moratorium tăng đến 19 tuổi rồi giảm; achievement tăng qua cuối tuổi teen và đầu 20; foreclosure và diffusion giảm ở trung học nhưng lên xuống sau đó."
  loai: so-lieu
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n21
  cau: Đến đầu tuổi trưởng thành vẫn còn tỉ lệ lớn chưa đạt bản sắc vững chắc.
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n22
  cau: "Meeus và cộng sự (2012): 923 teen đầu–giữa tuổi vị thành niên và 390 teen giữa–cuối, 12–20 tuổi, Hà Lan, 5 đợt, phân tích latent class growth."
  loai: so-lieu
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n23
  cau: Các trạng thái Marcia là các quỹ đạo phân biệt và tương đối ổn định theo thời gian; nhóm teen lớn tuổi có nhiều người achievement hơn và ít người diffusion hơn.
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n24
  cau: 'Hai kiểu moratorium: cổ điển và "đang tìm kiếm" (cam kết mạnh và chủ động, cân nhắc lại, chưa chốt; không còn ở nhóm lớn tuổi).'
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n25
  cau: "Các quỹ đạo bản sắc khác nhau đi kèm mức thích ứng khác nhau một cách ổn định: achievement và early closure có ít triệu chứng trầm cảm và hành vi phạm pháp hơn moratorium."
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n26
  cau: "Luyckx và cộng sự (2013): khảo sát cắt ngang 5.834 người 14–30 tuổi."
  loai: so-lieu
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n27
  cau: Các quá trình cam kết tăng gần như tuyến tính theo tuổi; khám phá (rộng và sâu) đạt đỉnh ở giai đoạn mới trưởng thành.
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n28
  cau: Ở cuối tuổi 20, khám phá gắn với khám phá nhai lại và triệu chứng trầm cảm (tương quan trong khảo sát cắt ngang, không biết cái nào đến trước).
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n29
  cau: "Khung Vững chắc: 4 trạng thái bản sắc của Marcia là có thật và đo được."
  loai: nhan
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n30
  cau: "Khung Vững chắc: bản sắc chín dần đến tận tuổi 20+, không xong trước 18."
  loai: nhan
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n31
  cau: "Khung Khá vững: có cam kết đi cùng thích ứng tốt hơn; kẹt trong khám phá nhai lại đi cùng trầm cảm nhiều hơn."
  loai: nhan
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n32
  cau: "Khung Đang tranh cãi: hoãn quyết định để thử (moratorium) là tốt hay xấu, và foreclosure có tệ như ta tưởng?"
  loai: nhan
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n33
  cau: Trong nghiên cứu dọc Hà Lan, early closure có mức thích ứng thuộc nhóm tốt nhất cùng với achievement.
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n34
  cau: "Theo Kroger 2010: trung bình 15% đổi sang trạng thái kém vững hơn trong các nghiên cứu dọc; không có nguồn ủng hộ 18 tuổi là hạn chót."
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n35
  cau: 'Khung Đã bị bác bỏ: ai cũng phải tìm xong "mình là ai" trước 18 tuổi.'
  loai: nhan
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n36
  cau: 'Erikson: bản sắc là một nhiệm vụ của tuổi teen; theo Marcia, "khủng hoảng" nghĩa là giai đoạn dấn thân chọn giữa các lựa chọn, không phải bệnh lý.'
  loai: dinh-nghia
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n37
  cau: 'Marcia: moratorium khác diffusion ở "an active struggle to make commitments"; achievement khác foreclosure ở chỗ đã trải qua khủng hoảng và quyết định theo cách của mình.'
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n38
  cau: "Meeus và cộng sự (2012) tách khám phá thành khám phá sâu và xem xét lại cam kết; Luyckx (2013): khám phá sâu gắn chặt với cam kết ở tuổi teen và đầu 20, khám phá nhai lại gắn với trầm cảm ở cuối tuổi 20."
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n39
  cau: "Mục 1: xác định mình đang ở đâu rồi hành xử cho đúng (Khá vững)."
  loai: nhan
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n40
  cau: "Mục 2: với cha mẹ, chọn sẵn hay cho không gian thử (Đang tranh cãi)."
  loai: nhan
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n41
  cau: "Mục 3: phân biệt đang thử với đang quay cuồng (Khá vững)."
  loai: nhan
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n42
  cau: Lời dẫn tới người có chuyên môn và [Hỗ trợ](/psyche/ho-tro/) khi bạn hay con bạn thấy mắc kẹt và khó chịu kéo dài.
  loai: loi-khuyen
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n43
  cau: 'Mục 4: không có deadline cho việc "tìm ra mình" (Vững chắc).'
  loai: nhan
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n44
  cau: Tính đến 11/2026, chưa tìm thấy nghiên cứu công bố nào về 4 trạng thái bản sắc của Marcia trên người Việt.
  loai: thoi-su
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n45
  cau: "Một giả thuyết: ở những gia đình kỳ vọng cao vào việc con chọn ngành học, foreclosure có thể phổ biến hơn (chưa có số liệu Việt Nam)."
  loai: thoi-su
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n46
  cau: "Nguyễn và cộng sự (2020): 1.593 học sinh Việt Nam; sự ấm áp của cha mẹ gắn với trí tuệ cảm xúc cao hơn; bao bọc quá mức và độc đoán từ mẹ gắn với trí tuệ cảm xúc thấp hơn."
  loai: so-lieu
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n47
  cau: Teen có thể trình bày bản thân khác nhau ở các nơi khác nhau và việc trình diễn trước khán giả có thể thay đổi cách thử nghiệm bản sắc; chưa mở được nghiên cứu nào ở teen Việt Nam.
  loai: thoi-su
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n48
  cau: 'Ngộ nhận "Khủng hoảng bản sắc là bệnh, phải chữa": theo Marcia, khủng hoảng là giai đoạn dấn thân chọn giữa các lựa chọn, không phải chẩn đoán.'
  loai: dinh-nghia
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n49
  cau: 'Ngộ nhận "Theo ý cha mẹ thì không có bản sắc": foreclosure là một trạng thái bản sắc (có cam kết, chưa khủng hoảng); Meeus: early closure thích ứng thuộc nhóm tốt nhất; Marcia: cứng nhắc hơn.'
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n50
  cau: 'Ngộ nhận "Thử nhiều thứ chứng tỏ không quyết đoán": moratorium khác diffusion ở "an active struggle to make commitments".'
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n51
  cau: 'Ngộ nhận "Tìm ra mình là ai rồi thì xong, cả đời không đổi": các nghiên cứu dọc: 15% thoái lui, 36% tiến bộ; nguồn chỉ đến khoảng 30 tuổi.'
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n53
  cau: "Câu 1: nhiệm vụ trung tâm của tuổi teen (12–18) theo Erikson là bản sắc đối đầu với lẫn lộn vai trò; giai đoạn thứ năm."
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n54
  cau: "Câu 2: Marcia đo hai tiêu chí bằng phỏng vấn về nghề nghiệp, tôn giáo, chính trị trên 86 nam sinh viên; các trạng thái khác nhau ở một số thước đo."
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n55
  cau: "Câu 3: foreclosure khác achievement ở chỗ cả hai đã cam kết nhưng foreclosure theo sẵn người khác chưa thử; Marcia: foreclosure đặt mục tiêu cao hơn mức đạt được, độc đoán hơn; Meeus: early closure thích ứng thuộc nhóm tốt nhất."
  loai: phat-hien
- trang: kham-pha/phat-trien/ban-sac-tuoi-teen
  id: n56
  cau: "Câu 4: Kroger và cộng sự (2010), 124 nghiên cứu: trong các nghiên cứu dọc, 36% tiến bộ, 15% thoái lui, 49% giữ nguyên; đến đầu tuổi trưởng thành còn nhiều người chưa đạt bản sắc vững chắc."
  loai: so-lieu
