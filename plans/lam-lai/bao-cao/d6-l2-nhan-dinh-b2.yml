  cau: Trong nghiên cứu của Walter và cộng sự (2020), khoảng cách tuổi bạn đời thu hẹp khi bình đẳng giới tăng, phù hợp với lý thuyết vai trò xã hội; nhưng bình đẳng giới ít liên quan đến khác biệt giới trong sở thích, trái với dự báo của lý thuyết ấy, và mức lây nhiễm mầm bệnh cũng không dự báo được sở thích về ngoại hình, trái với một dự báo của phía tiến hóa.
