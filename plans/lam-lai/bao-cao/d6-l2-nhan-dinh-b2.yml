  cau: Giáo trình mở OpenStax Psychology 2e (mục 3.1) trình bày rằng gen góp phần vào các khuôn mẫu nhận thức và hành vi, và tâm lý học tiến hóa nghiên cứu những hiện tượng tâm lý có thể đã tiến hóa như thích nghi, trong đó có việc chọn bạn đời.
