  cau: "Bệnh viện Tâm thần TP.HCM: 028 3923 4675."
  loai: thoi-su
- trang: ho-tro/index
  id: n34
  cau: Bệnh viện đa khoa gần nơi bạn ở có thể có khoa tâm thần hoặc khoa tâm lý; hãy gọi hỏi trước.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n35
  cau: Sau đợt sắp xếp đơn vị hành chính năm 2025, địa chỉ trên một số trang web vẫn ghi theo địa giới cũ; hãy kiểm tra lại trước khi đến.
  loai: thoi-su
- trang: ho-tro/index
  id: n36
  cau: Buồn, lo lắng, căng thẳng là một phần bình thường của cuộc sống. Chúng không tự động là dấu hiệu của rối loạn.
  loai: lam-sang
- trang: ho-tro/index
  id: n37
  cau: Nên cân nhắc tìm chuyên gia khi cảm giác buồn bã, trống rỗng, lo âu hay căng thẳng kéo dài từ hai tuần trở lên và không dịu đi.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n38
  cau: Nên cân nhắc tìm chuyên gia khi nó ảnh hưởng rõ đến việc học, công việc, giấc ngủ, ăn uống hay các mối quan hệ.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n39
  cau: Nên cân nhắc tìm chuyên gia khi bạn dùng rượu hay chất kích thích ngày càng nhiều.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n40
  cau: Nên cân nhắc tìm chuyên gia khi người thân nói rằng bạn thay đổi nhiều.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n41
  cau: Khi có ý nghĩ tự làm hại bản thân hoặc nghĩ rằng mọi người sẽ tốt hơn nếu không có mình, hãy tìm giúp đỡ ngay, không cần chờ.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n43
  cau: Chỉ người có chuyên môn mới chẩn đoán được.
  loai: lam-sang
- trang: ho-tro/index
  id: n44
  cau: "Bác sĩ chuyên khoa tâm thần: đào tạo bác sĩ y khoa, chuyên khoa tâm thần."
  loai: dinh-nghia
- trang: ho-tro/index
  id: n45
  cau: "Nhà tâm lý lâm sàng: đào tạo chuyên ngành tâm lý lâm sàng."
  loai: dinh-nghia
- trang: ho-tro/index
  id: n46
  cau: "Tham vấn viên / chuyên viên tư vấn tâm lý: Luật Khám bệnh, chữa bệnh 2023 không đặt chuẩn đào tạo chung."
  loai: dinh-nghia
- trang: ho-tro/index
  id: n47
  cau: "Nhân viên công tác xã hội: đào tạo công tác xã hội, hoặc ngành gần như xã hội học, tâm lý học."
  loai: dinh-nghia
- trang: ho-tro/index
  id: n48
  cau: "Bác sĩ chuyên khoa tâm thần: giấy phép hành nghề bác sĩ."
  loai: thoi-su
- trang: ho-tro/index
  id: n49
  cau: Tâm lý lâm sàng là chức danh phải có giấy phép hành nghề theo Luật Khám bệnh, chữa bệnh 2023 (có hiệu lực từ 01/01/2024).
  loai: thoi-su
- trang: ho-tro/index
  id: n50
  cau: Tham vấn viên / chuyên viên tư vấn tâm lý không nằm trong các chức danh phải có giấy phép hành nghề của Luật Khám bệnh, chữa bệnh 2023.
  loai: thoi-su
- trang: ho-tro/index
  id: n51
  cau: "Nhân viên công tác xã hội: giấy chứng nhận đăng ký hành nghề công tác xã hội theo Nghị định 110/2024/NĐ-CP."
  loai: thoi-su
- trang: ho-tro/index
  id: n52
  cau: Bác sĩ chuyên khoa tâm thần được kê đơn thuốc.
  loai: thoi-su
- trang: ho-tro/index
  id: n53
  cau: Nhà tâm lý lâm sàng không kê đơn thuốc (theo quy định về kê đơn, người kê đơn là bác sĩ, y sĩ).
  loai: thoi-su
- trang: ho-tro/index
  id: n54
  cau: Tham vấn viên và nhân viên công tác xã hội không kê đơn thuốc.
  loai: thoi-su
- trang: ho-tro/index
  id: n55
  cau: Bác sĩ chuyên khoa tâm thần thường chẩn đoán, điều trị bằng thuốc và các phương pháp khác, chỉ định nhập viện khi cần.
  loai: dinh-nghia
- trang: ho-tro/index
  id: n56
  cau: Nhà tâm lý lâm sàng thường đánh giá tâm lý, trị liệu tâm lý.
  loai: dinh-nghia
- trang: ho-tro/index
  id: n57
  cau: Tham vấn viên / chuyên viên tư vấn tâm lý thường lắng nghe, hỗ trợ, tư vấn.
  loai: dinh-nghia
- trang: ho-tro/index
  id: n58
  cau: Nhân viên công tác xã hội thường kết nối dịch vụ, hỗ trợ và bảo vệ người yếu thế.
  loai: dinh-nghia
- trang: ho-tro/index
  id: n59
  cau: Theo Nghị định 96/2023/NĐ-CP, để được cấp giấy phép, nhà tâm lý lâm sàng phải có 9 tháng thực hành khám bệnh, chữa bệnh.
  loai: thoi-su
- trang: ho-tro/index
  id: n60
  cau: Hỏi về đào tạo, giấy phép hoặc chứng chỉ hành nghề.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n61
  cau: Hỏi về chi phí, thời lượng mỗi buổi và cách họ bảo mật thông tin của bạn.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n62
  cau: Thận trọng với nơi hứa "chữa khỏi" nhanh chóng, cam kết kết quả, hoặc chỉ dựa vào một bài trắc nghiệm.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n63
  cau: Nếu bạn không thấy hợp với một người, việc tìm người khác là bình thường.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n64
  cau: Lắng nghe trước, khuyên sau. Cho họ biết bạn sẵn sàng nghe.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n65
  cau: Tránh phán xét ("Có gì đâu mà buồn", "Cố lên là được").
  loai: loi-khuyen
- trang: ho-tro/index
  id: n66
  cau: Một tổng quan các nghiên cứu cho thấy việc hỏi về ý nghĩ tự sát không làm tăng ý nghĩ đó (Dazzi và cộng sự, 2014).
  loai: phat-hien
- trang: ho-tro/index
  id: n67
  cau: Hỏi thẳng nếu bạn lo họ có ý nghĩ tự làm hại.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n68
  cau: "Khuyến khích và giúp họ tìm chuyên gia: cùng tìm thông tin, đặt lịch, đi cùng."
  loai: loi-khuyen
- trang: ho-tro/index
  id: n69
  cau: Nếu có nguy hiểm ngay, gọi 115 và ở bên họ.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n70
  cau: Chăm sóc chính bạn. Hỗ trợ người khác rất tốn sức; bạn cũng xứng đáng được giúp.
  loai: loi-khuyen
- trang: nen-tang/phuong-phap
  id: n1
  cau: Tâm lý học là khoa học nghiên cứu tâm trí và hành vi.
  loai: dinh-nghia
- trang: nen-tang/phuong-phap
  id: n2
  cau: "Lĩnh vực phương pháp nói về cách tâm lý học tìm ra điều nó biết: thiết kế nghiên cứu, đo lường, thống kê và cách đọc một kết quả cho đúng mức."
  loai: dinh-nghia
- trang: nen-tang/co-so-sinh-hoc
  id: n1
  cau: Cơ sở sinh học của tâm trí và hành vi gồm não và hệ thần kinh, hormone, gen, và quá trình tiến hóa.
  loai: dinh-nghia
- trang: nen-tang/tri-giac-chu-y
  id: n1
  cau: Cảm giác là việc các giác quan tiếp nhận tín hiệu từ môi trường; tri giác là việc não sắp xếp và diễn giải các tín hiệu ấy.
  loai: dinh-nghia
- trang: nen-tang/tri-giac-chu-y
  id: n2
  cau: Chú ý là yếu tố quyết định phần nào của thông tin giác quan được ta để ý tới.
  loai: dinh-nghia
- trang: nen-tang/y-thuc-giac-ngu
  id: n1
  cau: Lĩnh vực nghiên cứu các trạng thái của ý thức, như tỉnh táo, giấc ngủ và giấc mơ, và vai trò của giấc ngủ đối với sức khỏe và trí nhớ.
  loai: dinh-nghia
- trang: nen-tang/hoc-tap
  id: n1
  cau: Học tập, theo nghĩa của tâm lý học, là sự thay đổi tương đối lâu dài trong hành vi hay hiểu biết nhờ kinh nghiệm.
  loai: dinh-nghia
- trang: nen-tang/hoc-tap
  id: n2
  cau: Lĩnh vực học tập gồm điều kiện hóa cổ điển, điều kiện hóa thao tác và học qua quan sát.
  loai: dinh-nghia
- trang: nen-tang/tri-nho
  id: n1
  cau: Trí nhớ là tập hợp các quá trình mã hóa, lưu giữ và gợi lại thông tin.
  loai: dinh-nghia
- trang: nen-tang/tri-nho
  id: n2
  cau: Lĩnh vực trí nhớ nghiên cứu các loại trí nhớ, vì sao ta quên, và vì sao ký ức có thể sai.
  loai: dinh-nghia
- trang: nen-tang/tu-duy-tri-tue
  id: n1
  cau: Lĩnh vực nghiên cứu cách con người suy nghĩ, giải quyết vấn đề, ra quyết định và dùng ngôn ngữ, cùng các khác biệt giữa người với người về trí tuệ.
  loai: dinh-nghia
- trang: nen-tang/phat-trien
  id: n1
  cau: Tâm lý học phát triển nghiên cứu những thay đổi về thể chất, nhận thức và tâm lý xã hội (cảm xúc, tính cách, quan hệ với người khác) của con người qua suốt đời, từ lúc thụ thai đến cuối đời.
  loai: dinh-nghia
- trang: nen-tang/cam-xuc-dong-luc
  id: n1
  cau: Lĩnh vực nghiên cứu cảm xúc, tức trạng thái chủ quan mà ta thường gọi là cảm nhận của mình, và động lực, tức những mong muốn hay nhu cầu hướng hành vi tới một mục tiêu.
  loai: dinh-nghia
- trang: nen-tang/tinh-cach
  id: n1
  cau: Tính cách là những khuôn mẫu tương đối ổn định trong suy nghĩ, cảm xúc và hành vi của một người.
  loai: dinh-nghia
- trang: nen-tang/tinh-cach
  id: n2
  cau: Lĩnh vực tính cách nghiên cứu cách mô tả, đo lường tính cách và tính cách thay đổi đến đâu.
  loai: dinh-nghia
- trang: nen-tang/tam-ly-xa-hoi
  id: n1
  cau: Tâm lý học xã hội nghiên cứu cách suy nghĩ, cảm xúc và hành vi của mỗi người chịu ảnh hưởng từ người khác và từ nhóm.
  loai: dinh-nghia
- trang: nen-tang/cang-thang-suc-khoe
  id: n1
  cau: Lĩnh vực nghiên cứu căng thẳng (stress), cách đối phó, và mối liên hệ giữa yếu tố tâm lý với sức khỏe thể chất.
  loai: dinh-nghia
- trang: nen-tang/hanh-phuc
  id: n1
  cau: Hạnh phúc, hiểu theo tâm lý học, là trạng thái tinh thần lâu dài gồm niềm vui, sự hài lòng và cảm giác cuộc sống có ý nghĩa (còn gọi là sự an lành chủ quan, subjective well-being).
  loai: dinh-nghia
- trang: nen-tang/hanh-phuc
  id: n2
  cau: Lĩnh vực hạnh phúc xét cách đo hạnh phúc, điều gì gắn với nó, và bằng chứng về các cách người ta thử tăng nó.
  loai: dinh-nghia
- trang: nen-tang/suc-khoe-tam-than
  id: n1
  cau: Lĩnh vực nói về các rối loạn tâm thần, như trầm cảm và lo âu, và các cách hỗ trợ, điều trị, kèm bằng chứng về từng cách.
  loai: dinh-nghia
