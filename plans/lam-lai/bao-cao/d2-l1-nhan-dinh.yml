- trang: bat-dau/index
  id: n1
  cau: Trong một khảo sát đại diện ở Mỹ (công bố năm 2011), 63% người được hỏi đồng ý rằng trí nhớ hoạt động như máy quay phim.
  loai: so-lieu
- trang: bat-dau/index
  id: n2
  cau: Câu 1 (khi tức giận, đấm gối hay hét lên giúp bạn bớt giận) trái với bằng chứng hiện có.
  loai: phat-hien
- trang: bat-dau/index
  id: n3
  cau: 'Câu 2 (trí nhớ giống cuốn băng ghi hình: ký ức có thể mờ đi nhưng không bị "sửa") trái với bằng chứng hiện có.'
  loai: phat-hien
- trang: bat-dau/index
  id: n4
  cau: Câu 3 (học rải ra nhiều buổi giúp nhớ lâu hơn học dồn trong một buổi) có bằng chứng khoa học ủng hộ.
  loai: phat-hien
- trang: bat-dau/index
  id: n5
  cau: Tâm lý học là khoa học nghiên cứu tâm trí và hành vi.
  loai: dinh-nghia
- trang: bat-dau/index
  id: n6
  cau: "Vì trực giác không đủ, tâm lý học dùng phương pháp khoa học: đặt câu hỏi rõ ràng, thu thập dữ liệu, so sánh có hệ thống, và chấp nhận khả năng mình sai."
  loai: dinh-nghia
- trang: bat-dau/index
  id: n7
  cau: Tâm lý học khoa học dựa trên nghiên cứu có dữ liệu, được người khác kiểm tra và làm lại; "tâm lý học" đại chúng dựa trên kinh nghiệm cá nhân, câu chuyện, uy tín người nói.
  loai: dinh-nghia
- trang: bat-dau/index
  id: n8
  cau: Khi bằng chứng mới xuất hiện, kết luận của tâm lý học khoa học thay đổi theo; "tâm lý học" đại chúng không có cơ chế buộc phải sửa.
  loai: dinh-nghia
- trang: bat-dau/index
  id: n9
  cau: Tâm lý học khoa học nói rõ chắc đến đâu và áp dụng cho ai; "tâm lý học" đại chúng hay nói tuyệt đối ("luôn luôn", "100%").
  loai: dinh-nghia
- trang: bat-dau/index
  id: n10
  cau: Hiệu ứng giãn cách trong ghi nhớ là một ví dụ của tâm lý học khoa học.
  loai: phat-hien
- trang: bat-dau/index
  id: n11
  cau: Mô hình tính cách Big Five là một ví dụ của tâm lý học khoa học.
  loai: phat-hien
- trang: bat-dau/index
  id: n12
  cau: Cách nói "bạn thuộc kiểu não trái" không có bằng chứng ủng hộ.
  loai: phat-hien
- trang: bat-dau/index
  id: n13
  cau: Ngay cả việc phát hiện nói dối, con người cũng chỉ đoán đúng khoảng 54% số lần, chỉ hơn tung đồng xu một chút.
  loai: so-lieu
- trang: bat-dau/index
  id: n14
  cau: Nhà tâm lý học không "nhìn là biết" bạn đang nghĩ gì.
  loai: dinh-nghia
- trang: bat-dau/index
  id: n15
  cau: "Tâm lý học không chỉ là trị liệu: ngành còn nghiên cứu trí nhớ, tri giác, ngôn ngữ, sự phát triển của trẻ, hành vi nhóm, ra quyết định."
  loai: dinh-nghia
- trang: bat-dau/index
  id: n16
  cau: Khoa học mô tả con người thường như thế nào; nó không tự đưa ra điều bạn nên sống ra sao, và các phát hiện là xu hướng trung bình, không phải định mệnh của từng người.
  loai: dinh-nghia
- trang: bat-dau/index
  id: n17
  cau: Năm 2015, nhóm Open Science Collaboration gồm hàng trăm nhà nghiên cứu đã làm lại 100 nghiên cứu tâm lý học công bố năm 2008 trên ba tạp chí lớn.
  loai: tai-lap
- trang: bat-dau/index
  id: n18
  cau: Ở các nghiên cứu gốc, 97% có kết quả có ý nghĩa thống kê; khi làm lại, chỉ còn 36%.
  loai: so-lieu
- trang: bat-dau/index
  id: n19
  cau: Độ lớn hiệu ứng trung bình khi làm lại chỉ còn khoảng một nửa so với bản gốc.
  loai: so-lieu
- trang: bat-dau/index
  id: n20
  cau: Kết quả này là một mốc của cái gọi là khủng hoảng tái lập.
  loai: lich-su
- trang: bat-dau/index
  id: n21
  cau: Một lần làm lại thất bại có thể do may rủi hoặc khác biệt về cách làm; mỗi nghiên cứu chỉ được làm lại một lần.
  loai: dinh-nghia
- trang: bat-dau/index
  id: n22
  cau: Một nghiên cứu đơn lẻ, dù đăng ở tạp chí uy tín, chưa đủ để tin chắc.
  loai: dinh-nghia
- trang: bat-dau/index
  id: n23
  cau: Những hiệu ứng nổi tiếng được kiểm tra lại bằng các dự án nhiều phòng thí nghiệm cùng lúc, đăng ký trước kế hoạch phân tích, như Many Labs 2.
  loai: tai-lap
- trang: bat-dau/index
  id: n24
  cau: Theo tổng hợp của Henrich, Heine và Norenzayan (2010), phần lớn đối tượng của nghiên cứu tâm lý học là người ở các nước phương Tây, có học vấn, công nghiệp hóa, giàu và dân chủ (WEIRD).
  loai: so-lieu
- trang: bat-dau/index
  id: n25
  cau: Nhóm WEIRD, ở một số lĩnh vực, khác thường so với phần còn lại của nhân loại.
  loai: phat-hien
- trang: bat-dau/index
  id: n26
  cau: Vì phần lớn người tham gia nghiên cứu thuộc nhóm WEIRD, cần cẩn thận khi áp dụng kết quả cho các nền văn hóa khác, kể cả Việt Nam.
  loai: dinh-nghia
- trang: bat-dau/index
  id: n27
  cau: Nhiều phát hiện của tâm lý học trái với lẽ thường, và nhiều "lẽ thường" hóa ra sai.
  loai: phat-hien
- trang: bat-dau/index
  id: n28
  cau: Một nghiên cứu hiếm khi "chứng minh" điều gì; bằng chứng mạnh đến từ nhiều nghiên cứu, tốt nhất được tổng hợp lại.
  loai: dinh-nghia
- trang: bat-dau/index
  id: n29
  cau: Không phải sách self-help nào cũng sai, và không phải nghiên cứu nào cũng đúng; điểm khác biệt nằm ở cách một khẳng định được kiểm tra, không ở chỗ nó được in ở đâu.
  loai: dinh-nghia
- trang: bat-dau/index
  id: n30
  cau: Điều phân biệt rõ nhất một khẳng định khoa học với lời khuyên self-help là nó đã được kiểm tra bằng dữ liệu, theo cách người khác có thể làm lại; ngay cả khẳng định khoa học cũng có thể sai và sẽ được sửa khi có bằng chứng mới.
  loai: dinh-nghia
- trang: bat-dau/index
  id: n31
  cau: Dự án tái lập năm 2015 cho thấy chỉ 36% nghiên cứu cho kết quả có ý nghĩa khi làm lại; cách hiểu hợp lý là một nghiên cứu đơn lẻ chưa đủ để tin chắc, cần nhiều lần kiểm tra lại.
  loai: tai-lap
- trang: bat-dau/index
  id: n32
  cau: '"WEIRD" là cách gọi nhóm người phương Tây, có học vấn, công nghiệp hóa, giàu và dân chủ, nơi phần lớn nghiên cứu được thực hiện.'
  loai: dinh-nghia
- trang: bat-dau/index
  id: n33
  cau: Phân tích tổng hợp của Bond và DePaulo (2006) cho thấy con người chỉ phân biệt đúng thật và dối khoảng 54% số lần; hỏi "bằng chứng là gì" là kỹ năng quan trọng.
  loai: so-lieu
- trang: bat-dau/index
  id: n42
  cau: Ta nhớ những lần "linh cảm đúng" và quên những lần linh cảm sai; một câu chuyện cảm động thuyết phục ta hơn một bảng số liệu; điều gì nghe hợp lý, ta dễ tin là đúng.
  loai: phat-hien
- trang: bat-dau/index
  id: n43
  cau: Phần lớn những suy đoán đó đủ dùng trong đời sống hằng ngày.
  loai: phat-hien
- trang: bat-dau/index
  id: n34
  cau: Khi được làm lại ở quy mô lớn, một phần đáng kể các phát hiện đã công bố không lặp lại được (khung "Vững chắc"); chính các nhà tâm lý học phát hiện điều này, và đó là cách một khoa học thực nghiệm tự sửa sai.
  loai: nhan
- trang: bat-dau/index
  id: n35
  cau: Khủng hoảng tái lập bị chính các nhà tâm lý học phát hiện và công bố, bằng chính các phương pháp khoa học.
  loai: lich-su
- trang: bat-dau/doc-nhan-chac-chan
  id: n8
  cau: Phân tích tổng hợp là bài gộp kết quả của nhiều nghiên cứu để rút ra một kết luận chung.
  loai: dinh-nghia
- trang: bat-dau/doc-nhan-chac-chan
  id: n9
  cau: Tái lập là làm lại một nghiên cứu để xem có ra kết quả tương tự không.
  loai: dinh-nghia
- trang: bat-dau/doc-nhan-chac-chan
  id: n10
  cau: Tái lập đăng ký trước là ghi câu hỏi và kế hoạch phân tích trước khi thấy kết quả, để tách điều được dự đoán khỏi điều chỉ giải thích sau khi đã thấy kết quả.
  loai: dinh-nghia
- trang: bat-dau/doc-nhan-chac-chan
  id: n11
  cau: "Ôn tập rải ra nhiều lần giúp nhớ lâu hơn học dồn: một phân tích tổng hợp lớn năm 2006 thấy kết quả này ở rất nhiều thí nghiệm."
  loai: so-lieu
- trang: bat-dau/doc-nhan-chac-chan
  id: n12
  cau: 'Ví dụ "Vững chắc": ôn tập rải ra nhiều lần giúp nhớ lâu hơn học dồn.'
  loai: nhan
- trang: bat-dau/doc-nhan-chac-chan
  id: n13
  cau: Kỳ vọng của giáo viên ảnh hưởng tới kết quả của học sinh; tổng quan 35 năm nghiên cứu cho thấy hiệu ứng có thật, nhưng thường nhỏ và hay phai đi hơn là tích tụ theo thời gian.
  loai: phat-hien
- trang: bat-dau/doc-nhan-chac-chan
  id: n15
  cau: 'Ví dụ "Khá vững": kỳ vọng của giáo viên ảnh hưởng tới kết quả của học sinh.'
  loai: nhan
- trang: bat-dau/doc-nhan-chac-chan
  id: n17
  cau: Thuyết "ý chí là nguồn lực có hạn, dùng nhiều sẽ cạn" (cạn kiệt ý chí).
  loai: dinh-nghia
- trang: bat-dau/doc-nhan-chac-chan
  id: n18
  cau: Hai dự án tái lập lớn, đăng ký trước, với 2.141 và 3.531 người cho hiệu ứng cạn kiệt ý chí gần bằng 0.
  loai: tai-lap
- trang: bat-dau/doc-nhan-chac-chan
  id: n19
  cau: 'Ví dụ "Đang tranh cãi": hiệu ứng cạn kiệt ý chí.'
  loai: nhan
- trang: bat-dau/doc-nhan-chac-chan
  id: n20
  cau: 'Dạy học khớp với "phong cách học" (nhìn, nghe, vận động) không giúp học tốt hơn: bài tổng quan năm 2008 gần như không thấy bằng chứng ủng hộ.'
  loai: tai-lap
- trang: bat-dau/doc-nhan-chac-chan
  id: n21
  cau: Tổng hợp 17 phân tích tổng hợp năm 2025 cho hiệu ứng gần bằng 0 (d = 0,04) ở các nghiên cứu kiểm tra đúng giả thuyết "dạy khớp phong cách học".
  loai: so-lieu
- trang: bat-dau/doc-nhan-chac-chan
  id: n22
  cau: 'Ví dụ "Đã bị bác bỏ": giả thuyết dạy khớp phong cách học.'
  loai: nhan
- trang: bat-dau/doc-nhan-chac-chan
  id: n23
  cau: Hiệu ứng nhỏ hơn nhiều so với tuyên bố ban đầu là một lý do để xếp vào "Đang tranh cãi".
  loai: nhan
- trang: bat-dau/doc-nhan-chac-chan
  id: n24
  cau: Kết quả từ sinh viên Mỹ chưa chắc đúng với người Việt.
  loai: phat-hien
- trang: bat-dau/doc-nhan-chac-chan
  id: n25
  cau: Nhiều hiệu ứng không tái lập được có thể liên quan tới nghiên cứu có sức mạnh thống kê thấp (mẫu nhỏ), thiên lệch xuất bản, hay báo cáo và phân tích có chọn lọc.
  loai: phat-hien
- trang: bat-dau/doc-nhan-chac-chan
  id: n26
  cau: '"Đã bị bác bỏ" không có nghĩa là người đề xuất ban đầu thiếu trung thực.'
  loai: dinh-nghia
- trang: bat-dau/doc-nhan-chac-chan
  id: n31
  cau: Những người ủng hộ thuyết cạn kiệt ý chí cho rằng cách thử nghiệm của các dự án tái lập chưa phù hợp.
  loai: lich-su
- trang: ho-tro/index
  id: n1
  cau: "Nếu bạn hoặc ai đó đang gặp nguy hiểm ngay lúc này: gọi Cấp cứu 115, hoặc đến khoa cấp cứu của bệnh viện gần nhất."
  loai: loi-khuyen
- trang: ho-tro/index
  id: n2
  cau: 115 là số Cấp cứu (cấp cứu y tế).
  loai: thoi-su
- trang: ho-tro/index
  id: n3
  cau: "Nếu có nguy cơ bạo lực: gọi Công an 113."
  loai: thoi-su
- trang: ho-tro/index
  id: n4
  cau: Nếu không muốn ở một mình, hãy gọi hoặc nhắn cho một người bạn tin tưởng và nhờ họ ở bên bạn.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n5
  cau: Các cuộc gọi đến 113, 114, 115 được miễn phí.
  loai: thoi-su
- trang: ho-tro/index
  id: n6
  cau: Bạn không cần phải "đủ nặng" mới được tìm sự giúp đỡ. Nếu điều gì đó đang làm bạn khổ sở, việc tìm người nói chuyện là hợp lý.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n9
  cau: 115 dành cho mọi trường hợp nguy hiểm đến tính mạng, kể cả nguy cơ tự làm hại.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n10
  cau: "115: 24/7, miễn phí."
  loai: thoi-su
- trang: ho-tro/index
  id: n11
  cau: 113 dành cho nguy cơ bạo lực, cần can thiệp khẩn cấp.
  loai: thoi-su
- trang: ho-tro/index
  id: n12
  cau: "113: 24/7."
  loai: thoi-su
- trang: ho-tro/index
  id: n13
  cau: "Tổng đài quốc gia bảo vệ trẻ em: số 111."
  loai: thoi-su
- trang: ho-tro/index
  id: n14
  cau: 111 dành cho trẻ em, và người lớn lo lắng cho một trẻ em (bị xâm hại, bạo lực, bỏ rơi…).
  loai: thoi-su
- trang: ho-tro/index
  id: n15
  cau: Tổng đài 111 do Cục Bà mẹ và Trẻ em, Bộ Y tế vận hành.
  loai: thoi-su
- trang: ho-tro/index
  id: n16
  cau: "111: 24/7, miễn phí."
  loai: thoi-su
- trang: ho-tro/index
  id: n17
  cau: "Đường dây nóng Ngày Mai: 096 306 1414."
  loai: thoi-su
- trang: ho-tro/index
  id: n18
  cau: "Ngày Mai dành cho: sơ cứu và hỗ trợ tâm lý qua điện thoại cho người trầm cảm và người thân của họ."
  loai: thoi-su
- trang: ho-tro/index
  id: n19
  cau: Ngày Mai do một nhóm tình nguyện viên vận hành.
  loai: thoi-su
- trang: ho-tro/index
  id: n20
  cau: "Ngày Mai: 13:00–20:30, Thứ Tư đến Chủ nhật."
  loai: thoi-su
- trang: ho-tro/index
  id: n21
  cau: "Ngày Mai: dịch vụ miễn phí."
  loai: thoi-su
- trang: ho-tro/index
  id: n22
  cau: "CSAGA: 024 3333 5599."
  loai: thoi-su
- trang: ho-tro/index
  id: n23
  cau: "CSAGA: tư vấn miễn phí cho người bị bạo lực gia đình, bạo lực trên cơ sở giới; cộng đồng LGBTQ+."
  loai: thoi-su
- trang: ho-tro/index
  id: n24
  cau: Trang của CSAGA không ghi giờ trực; hãy hỏi khi gọi.
  loai: thoi-su
- trang: ho-tro/index
  id: n25
  cau: Tính đến tháng 10/2026, chúng tôi chưa tìm thấy đường dây quốc gia 24/7 dành riêng cho sức khỏe tâm thần người lớn hay phòng chống tự sát ở Việt Nam.
  loai: thoi-su
- trang: ho-tro/index
  id: n26
  cau: Ngoài giờ làm việc của các đường dây trên, nếu có nguy cơ tự làm hại, hãy gọi 115 hoặc đến khoa cấp cứu.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n27
  cau: Danh bạ quốc tế Find A Helpline liệt kê thêm một số dịch vụ ở Việt Nam; thông tin trên đó do tổ chức khác tổng hợp.
  loai: thoi-su
- trang: ho-tro/index
  id: n28
  cau: Các số dưới đây là số tổng đài hay số điện thoại chung mà bệnh viện công bố trên trang web của mình.
  loai: thoi-su
- trang: ho-tro/index
  id: n29
  cau: Các số bệnh viện này không phải đường dây khủng hoảng.
  loai: thoi-su
- trang: ho-tro/index
  id: n30
  cau: "Bệnh viện Tâm thần Trung ương 1 (Hà Nội): 024 3385 3227."
  loai: thoi-su
- trang: ho-tro/index
  id: n31
  cau: "Viện Sức khỏe Tâm thần, Bệnh viện Bạch Mai (Hà Nội): 024 3576 5344."
  loai: thoi-su
- trang: ho-tro/index
  id: n32
  cau: "Bệnh viện Tâm thần Trung ương 2 (Đồng Nai): 0251 3822 965."
  loai: thoi-su
