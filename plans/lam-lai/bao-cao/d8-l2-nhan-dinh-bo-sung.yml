- trang: trai-nghiem/tri-nho-sai
  id: n6
  cau: 'Khá vững: học các từ cùng chủ đề có thể khiến ta "nhớ" một từ chưa từng
    thấy (bằng chứng tổng hợp: một tổng quan tường thuật và một lần làm lại có
    đăng ký trước).'
  loai: nhan
- trang: trai-nghiem/neo-gia
  id: n6
  cau: "Khá vững: con số neo làm dịch chuyển ước lượng; Many Labs (36 mẫu, 6.344
    người): bốn câu mỏ neo có hiệu ứng ở mọi mẫu, thuộc nhóm hiệu ứng lớn nhất;
    mới dẫn một tái lập lớn."
  loai: nhan
- trang: trai-nghiem/neo-gia
  id: n9
  cau: 'Ngộ nhận "mỏ neo chỉ có tác dụng khi con số có vẻ liên quan": không; số
    ngẫu nhiên vẫn tạo hiệu ứng, và Englich so mức đề nghị do xúc xắc quyết định
    với cùng mức do công tố đưa ra (một nghiên cứu khác, cùng hồ sơ) và không
    thấy hai loại khác nhau về tác dụng.'
  loai: phat-hien
- trang: trai-nghiem/tri-nho-tu
  id: n5
  cau: "Khá vững: dãy từ nhiều âm tiết thường nhớ được ít hơn dãy từ ngắn;
    Oberauer và cộng sự (2018) xếp hiệu ứng vào nhóm phát hiện ổn định ở nhiều
    ngôn ngữ nhưng cách giải thích còn tranh cãi; Guitard, Neath và Surprenant
    (2025): khi cân bằng thêm số từ láng giềng, hiệu ứng mất ở bài nhận diện thứ
    tự."
  loai: nhan
- trang: trai-nghiem/tri-nho-tu
  id: n6
  cau: "Lý thuyết: yếu tố từ vựng và trí nhớ dài hạn (từ dài và ngắn khác nhau về
    số từ láng giềng; Guitard, Neath và Surprenant, 2025, cho rằng các yếu tố
    này, không phải thời gian đọc, có thể tạo ra hiệu ứng); gom nhóm giúp nhớ
    nhiều hơn (Miller, 1956)."
  loai: phat-hien
- trang: trai-nghiem/tri-nho-tu
  id: n11
  cau: 'Ngộ nhận: không nên kết luận "trí nhớ kém, kém thông minh" từ công cụ này:
    một lần làm trên công cụ chưa chuẩn hóa, và gom các từ thành cụm là đã nhớ
    được nhiều hơn (Miller, 1956).'
  loai: phat-hien
- trang: trai-nghiem/linda
  id: n11
  cau: 'Đang tranh cãi: vì sao ta mắc bẫy; Gigerenzer phản biện rằng nhiều "lỗi"
    không vi phạm lý thuyết xác suất nếu phân biệt xác suất một trường hợp với
    tần suất; những người khác (Hertwig và cộng sự, theo Chandrashekar và cộng
    sự, 2021) cho rằng từ "xác suất" và chữ "và" có thể được hiểu khác (ví dụ
    hiểu (A) thành "không phải nhà hoạt động nữ quyền").'
  loai: nhan
- trang: trai-nghiem/linda
  id: n12
  cau: "Thay thế thuộc tính (Kahneman, 2011): khi câu hỏi khó, ta thường trả lời
    một câu dễ hơn mà không để ý mình đã đổi câu hỏi (cả câu hỏi 3)."
  loai: phat-hien
- trang: trai-nghiem/big-five-mini
  id: n8
  cau: Theo IPIP, xếp xen kẽ câu của các thang và xen câu thuận với câu nghịch
    khuyến khích người trả lời đọc kỹ nội dung từng câu (cả câu hỏi 1).
  loai: phat-hien
- trang: trai-nghiem/wason-246
  id: n14
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra nhiệm vụ
    2–4–6 trên người Việt.
  loai: thoi-su
