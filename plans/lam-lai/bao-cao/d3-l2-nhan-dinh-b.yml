- trang: thi-nghiem/little-albert
  id: n1
  cau: Watson và Rayner (1920) báo cáo đã điều kiện hóa nỗi sợ chuột trắng ở một bé trai 11 tháng tuổi bằng cách ghép chuột với tiếng động lớn, và không gỡ nỗi sợ ấy trước khi bé rời bệnh viện.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n2
  cau: Một phân tích đoạn phim năm 2021 cho rằng bằng chứng điều kiện hóa yếu hơn giáo trình vẫn kể.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n3
  cau: Bé trai 11 tháng tuổi, khỏe mạnh, tính tình bình thản, chẳng sợ gì; cứ mỗi lần đưa tay chạm vào con chuột thì thanh thép bị đập mạnh ngay sau lưng; bé giật mình, ngã người về phía trước.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n4
  cau: "Đáp án nhanh: sau 2 lần ghép đôi Albert có phản ứng né chuột nhẹ; một tuần sau, thêm 5 lần ghép đôi (tổng cộng 7), bé khóc và bò đi xa ngay khi thấy chuột, không cần tiếng động."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n5
  cau: Phản ứng né lan sang thỏ, chó, áo lông hải cẩu và mặt nạ ông già Noel.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n6
  cau: Họ không có dịp gỡ nỗi sợ ấy vì Albert rời bệnh viện.
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n7
  cau: Phân tích đoạn phim năm 2021 cho rằng quy trình điều kiện hóa phần lớn không hiệu quả; dấu hiệu khó chịu yếu của bé có thể giải thích bằng nhạy cảm hóa và sự trưởng thành.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n8
  cau: Thí nghiệm của Watson và Rayner là một nỗ lực thực nghiệm sớm nhằm kiểm tra giả thuyết rằng cảm xúc sợ hãi có thể được điều kiện hóa ở người; giả thuyết đã được họ và Morgan nêu từ 1917 mà thiếu bằng chứng thực nghiệm đủ.
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n9
  cau: "Mô hình điều kiện hóa cổ điển: chuột trắng (kích thích trung tính) ghép với tiếng động lớn (không điều kiện) gây giật mình; sau các lần ghép đôi, chuột một mình gây phản ứng sợ (kích thích có điều kiện)."
  loai: dinh-nghia
- trang: thi-nghiem/little-albert
  id: n10
  cau: Bài báo là một trong những nghiên cứu được trích dẫn nhiều nhất trong tâm lý học, thường được trình bày như bằng chứng cho vai trò của điều kiện hóa cổ điển trong sự hình thành nỗi sợ.
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n11
  cau: Bé rời bệnh viện mà nỗi sợ chưa được gỡ; chính các tác giả viết rằng họ do dự vì việc gây sợ thực nghiệm "mang một trách nhiệm nhất định".
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n12
  cau: '"Albert B." là con của một vú nuôi tại Harriet Lane Home for Invalid Children, được nuôi gần như từ lúc mới sinh trong môi trường bệnh viện.'
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n13
  cau: Bài báo mô tả bé khỏe mạnh từ lúc sinh, phát triển tốt, tính tình điềm tĩnh, ít biểu lộ cảm xúc; sự ổn định là một lý do chọn bé, và các tác giả cho rằng có thể gây tương đối ít hại.
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n14
  cau: Ở khoảng 9 tháng tuổi, Albert được cho xem lần lượt, đột ngột và lần đầu chuột trắng, thỏ, chó, khỉ, mặt nạ có và không có tóc, bông gòn, giấy báo đang cháy; bé không lần nào tỏ ra sợ, phản ứng thường gặp là sờ, nghịch.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n15
  cau: "Lúc 8 tháng 26 ngày, bé được thử với tiếng búa đập thanh thép treo sau lưng: giật mình mạnh, thở ngừng, môi run, và khóc ở lần đập thứ ba."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n16
  cau: Trước khi điều kiện hóa, lúc 11 tháng 3 ngày, các thử nghiệm cảm xúc thông thường vẫn không thấy dấu hiệu sợ.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n17
  cau: "Buổi 1 (11 tháng 3 ngày): 2 lần ghép đôi chuột và tiếng động; lần đầu bé giật mình và ngã về phía trước, không khóc; lần hai giật mình và bắt đầu rên rỉ."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n18
  cau: "Buổi 2 (11 tháng 10 ngày, một tuần sau): chuột đưa ra không kèm tiếng động thì bé rụt tay lại khi chuột chạm tay."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n19
  cau: Ở buổi 2, thêm 5 lần ghép đôi (tổng cộng 7); khi chuột đưa ra một mình bé khóc ngay, quay người, ngã sang bên và bò đi nhanh đến mức phải chạy theo mới bắt kịp.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n20
  cau: "Buổi 3 (11 tháng 15 ngày, năm ngày sau): bé vẫn né chuột và chơi khối gỗ bình thường; thỏ gây phản ứng rõ rệt; chó nhẹ hơn thỏ nhưng bé khóc khi chó lại gần đầu; áo lông hải cẩu làm bé khóc và cố bò đi; bông gòn nhẹ hơn; tóc của Watson và mặt nạ ông già Noel bị né, tóc hai người quan sát khác thì bé chơi."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n21
  cau: Những vật ở buổi 3 (thỏ, chó, áo lông, tóc, mặt nạ) chưa từng đi kèm tiếng động.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n22
  cau: 'Buổi 4 (11 tháng 20 ngày): phản ứng với chuột yếu hơn nên các tác giả ghép đôi chuột với tiếng động để "làm mới"; lần đầu thỏ và chó cũng được ghép trực tiếp với tiếng động; sau đó bé được chuyển sang phòng giảng lớn, sáng hơn, có bốn người, và phản ứng với chuột và thỏ yếu hơn.'
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n23
  cau: "Sự cố ngoài kịch bản ở buổi 4: con chó vốn im lặng bỗng sủa ba lần sát mặt bé làm bé òa khóc, và làm cả người lớn có mặt giật mình."
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n24
  cau: "Buổi 5 (1 tuổi 21 ngày, 31 ngày sau; suốt thời gian ấy bé ở nhà trẻ bệnh viện và không có thử nghiệm cảm xúc): phản ứng yếu đi phần nào nhưng bé vẫn né mặt nạ, áo lông, thỏ, chó; với chuột thì rụt tay, nhăn mặt, che mắt khi chuột bò lên ngực."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n25
  cau: Chính ngày kiểm tra cuối cùng Albert rời bệnh viện, không có giải điều kiện hóa nào.
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n26
  cau: "Câu hỏi thứ tư của bài: nếu phản ứng sợ không tự mất đi sau một thời gian hợp lý, có thể nghĩ ra phương pháp phòng thí nghiệm nào để gỡ bỏ."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n27
  cau: Watson và Rayner viết rằng các phản ứng này có thể tồn tại lâu dài nếu không có cách gỡ, và tự nhận quan điểm ấy "có lẽ chưa có cơ sở vững".
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n28
  cau: Mary Cover Jones làm việc với sự cố vấn của Watson, gặp Peter, 2 tuổi 10 tháng, sợ chuột trắng, nỗi sợ lan sang thỏ, áo lông, lông vũ, bông gòn, khoảng ba năm sau Albert.
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n29
  cau: 'Jones gỡ nỗi sợ thỏ bằng nhiều cách: Peter chơi cùng ba trẻ không sợ thỏ; sau khi Peter nằm viện hai tháng và sợ trở lại, bà thêm "điều kiện hóa trực tiếp" (cho ăn món ưa thích trong khi thỏ trong lồng được đưa lại gần từng chút).'
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n30
  cau: Cuối cùng Peter vuốt, bế thỏ; nỗi sợ bông gòn, áo lông, lông vũ không còn; Jones nhấn mạnh nghiên cứu còn dang dở.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n31
  cau: Mary Cover Jones báo cáo một ca; chữ cũ cho rằng đó là "tiền thân của liệu pháp phơi nhiễm" và "minh chứng khoa học có thể tạo ra kiến thức mà không cần gây tổn thương vĩnh viễn".
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n32
  cau: 'Khoảng ba năm sau Albert, Jones làm điều Watson và Rayner không thử: gỡ nỗi sợ ở một đứa trẻ, nối tiếp ca Albert ("continue where Watson had left off").'
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n33
  cau: "Vững chắc: nỗi sợ có thể được điều kiện hóa ở người."
  loai: nhan
- trang: thi-nghiem/little-albert
  id: n34
  cau: "Duits và cộng sự (2015): phân tích tổng hợp 44 nghiên cứu (963 bệnh nhân rối loạn lo âu, 1.222 người đối chứng); các quá trình tắt dần của nỗi sợ được cho là nền tảng của hiệu quả điều trị phơi nhiễm."
  loai: so-lieu
- trang: thi-nghiem/little-albert
  id: n35
  cau: "Khung ghi chú: Watson và Rayner không gỡ nỗi sợ ở Albert: bé rời bệnh viện trước khi họ thử."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n36
  cau: "Đang tranh cãi: Albert có thật sự học sợ, và nỗi sợ có lan sang các vật khác không."
  loai: nhan
- trang: thi-nghiem/little-albert
  id: n37
  cau: 'Powell và Schmaltz (2021): chúng ta dễ thấy "điều kiện hóa" trong đoạn phim vì kỳ vọng.'
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n38
  cau: "Beck, Levinson và Irons (2009): một nhân viên của Harriet Lane Home là mẹ của Albert; qua liên lạc với con cháu bà, họ cho rằng Albert là Douglas Merritte (1919–1925), qua đời sớm vì não úng thủy."
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n39
  cau: Fridlund và cộng sự (2012) cho rằng Douglas có tổn thương thần kinh mà Watson có thể đã biết và che giấu.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n40
  cau: Powell, Digdon, Harris và Smithson (2014) cho rằng ứng viên phù hợp hơn là Albert Barger và bình luận về cáo buộc gian lận của Watson.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n41
  cau: Tính đến 10/2026, trong các nguồn chúng tôi tra được, chưa thấy công trình nào làm tranh luận về danh tính Albert ngã ngũ.
  loai: thoi-su
- trang: thi-nghiem/little-albert
  id: n42
  cau: Khung tranh cãi cho Danh tính Albert.
  loai: nhan
- trang: thi-nghiem/little-albert
  id: n43
  cau: "Điều kiện hóa cổ điển (Pavlov → Watson): nỗi sợ là phản ứng có thể được học bằng cách ghép kích thích trung tính với kích thích gây sợ; Watson và Rayner trình bày Albert như ví dụ, bằng chứng từ Albert bị phản biện."
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n44
  cau: Watson và Rayner ghi nhận bé né thỏ, chó, áo lông và mặt nạ dù ban đầu chưa đi kèm tiếng động, và gọi đó là chuyển (transfer) của phản ứng; Powell và Schmaltz cho rằng bằng chứng từ đoạn phim yếu.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n45
  cau: 'Jones gọi một cách của bà là "điều kiện hóa trực tiếp": cho trẻ ăn món ưa thích mỗi khi con vật được đưa ra, để nỗi sợ giảm dần.'
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n46
  cau: "Thuyết hai yếu tố của Mowrer (1951): nỗi sợ được học qua điều kiện hóa cổ điển (yếu tố thứ nhất), rồi hành vi né tránh được củng cố vì nó làm giảm nỗi sợ (yếu tố thứ hai); tổng quan của Krypotos và cộng sự (2015) kể lại thuyết này và nêu nhiều kết quả thí nghiệm mà nó không giải thích được."
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n47
  cau: Jones lưu ý nỗi sợ của Peter có lẽ không phải nỗi sợ điều kiện hóa trực tiếp, và nguồn gốc của nó không rõ.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n48
  cau: Nếu một nỗi sợ ở trẻ kéo dài hoặc làm ảnh hưởng sinh hoạt, xem trang Hỗ trợ; trang không chẩn đoán hay hướng dẫn điều trị.
  loai: loi-khuyen
- trang: thi-nghiem/little-albert
  id: n49
  cau: "Liệu pháp phơi nhiễm: các quá trình tắt dần của nỗi sợ điều kiện hóa được cho là nền tảng của liệu pháp phơi nhiễm; đó là liệu pháp do chuyên gia thực hiện, trang không hướng dẫn tự làm."
  loai: lam-sang
- trang: thi-nghiem/little-albert
  id: n50
  cau: Cơ chế quảng cáo ghép sản phẩm với âm nhạc vui, gương mặt nổi tiếng (như ghép đôi kiểu Watson).
  loai: loi-khuyen
- trang: thi-nghiem/little-albert
  id: n51
  cau: Tính đến 10/2026, chúng tôi chưa tìm thấy nghiên cứu điều kiện hóa nỗi sợ trên trẻ sơ sinh người Việt.
  loai: thoi-su
- trang: thi-nghiem/little-albert
  id: n52
  cau: 'Chữ cũ về đạo đức và suy luận cho Việt Nam: "theo chuẩn đạo đức hiện nay, nghiên cứu như vậy sẽ không bao giờ được hội đồng đạo đức nào phê duyệt"; "cơ chế điều kiện hóa sợ hãi là phổ quát, nên bài học dọa ma, dọa bác sĩ, ông kẹ ... đều áp dụng được".'
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n53
  cau: "Theo báo cáo, Albert không vốn đã sợ động vật: ở các buổi trước điều kiện hóa (khoảng 9 tháng và 11 tháng 3 ngày) bé không tỏ ra sợ các con vật được đưa ra; phản ứng thường gặp là sờ, nghịch."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n54
  cau: Albert rời bệnh viện đúng ngày kiểm tra cuối cùng; không giải điều kiện hóa nào được thực hiện; Watson và Rayner đặt ra câu hỏi gỡ nỗi sợ trong bài.
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n55
  cau: Giả thuyết Douglas Merritte (Beck 2009) bị phản bác bởi giả thuyết Albert Barger (Powell 2014); tính đến 10/2026, chưa thấy ngã ngũ.
  loai: lich-su
- trang: thi-nghiem/little-albert
  id: n56
  cau: "Thí nghiệm không thể cho thấy mọi nỗi sợ đều do học: một trẻ, không đối chứng; phân tích đoạn phim 2021 nghi ngờ điều kiện hóa rõ rệt; Jones lưu ý nỗi sợ của Peter có lẽ không điều kiện hóa trực tiếp."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n57
  cau: 'Nỗi sợ theo Albert suốt đời: chưa có bằng chứng chắc chắn trong các nguồn đã mở; Watson và Rayner cho là có thể tồn tại lâu dài nhưng tự nhận quan điểm "có lẽ chưa có cơ sở vững"; Powell và cộng sự (2014) trình bày bằng chứng về việc Albert Barger có lớn lên với nỗi sợ động vật có lông hay không, chưa đọc phần này.'
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n58
  cau: "Quiz, câu 1: trước điều kiện hóa, Albert không tỏ ra sợ các con vật; chỉ tiếng búa đập mới gây giật mình và khóc."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n59
  cau: "Quiz, câu 2: Watson và Rayner tạo tiếng động bằng búa đập vào thanh thép treo sau đầu Albert khi bé chạm vào chuột; tiếng chó sủa chỉ là sự cố ngoài kịch bản ở buổi sau."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n60
  cau: "Quiz, câu 3: Albert còn né thỏ, chó, áo lông hải cẩu, mặt nạ ông già Noel, ở buổi đầu chưa đi kèm tiếng động; bé vẫn chơi khối gỗ bình thường; phân tích 2021 cho rằng bằng chứng yếu."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n61
  cau: "Quiz, câu 4: Albert rời bệnh viện đúng ngày kiểm tra cuối cùng nên Watson và Rayner không có dịp gỡ nỗi sợ; khoảng ba năm sau Jones báo cáo gỡ nỗi sợ thỏ ở Peter (một ca, còn dang dở)."
  loai: phat-hien
- trang: thi-nghiem/little-albert
  id: n62
  cau: "Quiz, câu 5: tính đến 10/2026 danh tính còn đang tranh cãi: Beck và cộng sự 2009 (Merritte), Powell và cộng sự 2014 (Barger)."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n1
  cau: Schachter và Singer (1962) tiêm adrenaline cho người tham gia rồi cho họ ngồi cùng một diễn viên vui vẻ hoặc giận dữ.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n2
  cau: "Lý thuyết hai nhân tố: trạng thái cảm xúc là hàm của kích thích sinh lý và một nhận thức phù hợp với kích thích ấy."
  loai: dinh-nghia
- trang: thi-nghiem/schachter-singer
  id: n3
  cau: 'Thí nghiệm được dựng dưới vỏ bọc "tác dụng của vitamin lên thị lực": người tham gia được tiêm "vitamin Suproxin".'
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n4
  cau: Người tham gia chờ 20 phút để thuốc ngấm.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n5
  cau: Epinephrine gây tim đập nhanh (palpitation), run tay (tremor) và đôi khi cảm giác nóng bừng mặt.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n6
  cau: Diễn viên vui vẻ gấp máy bay giấy, chơi "bóng rổ" bằng giấy vo viên vào sọt rác, xoay vòng hula hoop.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n7
  cau: 'Trong thí nghiệm thật, những người không được giải thích đúng về mũi tiêm có xu hướng "bắt" cảm xúc của người ngồi cùng: vui theo người vui, giận theo người giận.'
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n8
  cau: Những người được báo trước "thuốc sẽ làm tim đập nhanh" ít bị cuốn theo cảm xúc của diễn viên hơn hẳn.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n9
  cau: "Hai tác giả đề xuất: cảm xúc gồm kích thích sinh lý và cái nhãn nhận thức mà não gắn lên nó."
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n10
  cau: Các nghiên cứu sau chỉ ủng hộ một phần đề xuất hai nhân tố.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n11
  cau: 'Schachter và Singer đặt câu hỏi: nếu cơ thể đã "báo động" mà người ta chưa biết vì sao, họ sẽ làm gì, và họ dựa vào hoàn cảnh để gọi tên cảm xúc.'
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n12
  cau: Hai tác giả hình dung tim đập nhanh giữa buổi tiệc vui là "phấn khích" và trong con hẻm tối là "sợ hãi".
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n13
  cau: 184 nam sinh viên đồng ý được tiêm.
  loai: so-lieu
- trang: thi-nghiem/schachter-singer
  id: n14
  cau: Người tham gia đều là nam sinh viên các lớp nhập môn tâm lý học ở Đại học Minnesota.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n15
  cau: Người tham gia được tiêm epinephrine hoặc giả dược (nước muối).
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n16
  cau: "Nhóm tiêm adrenaline được chia ba: được báo đúng, không được báo gì, bị báo sai."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n17
  cau: Nhóm được báo đúng được nói rằng thuốc sẽ làm tim đập nhanh, run tay, mặt nóng.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n18
  cau: Nhóm bị báo sai được nói thuốc gây tê chân, ngứa và hơi đau đầu.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n19
  cau: Nhóm bị báo sai chỉ có ở điều kiện vui vẻ, không có ở điều kiện giận dữ.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n20
  cau: Trong điều kiện vui vẻ, diễn viên gấp máy bay giấy, chơi bóng rổ giấy, làm ná chun, xoay hula hoop.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n21
  cau: Trong điều kiện giận dữ, hai người làm một bảng hỏi ngày càng riêng tư và xúc phạm; diễn viên ngày càng bực, xé bảng hỏi rồi bỏ ra ngoài.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n22
  cau: Cảm xúc được đo bằng quan sát qua gương một chiều và bảng tự báo cáo.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n23
  cau: Ở điều kiện vui vẻ, nhóm không được báo trước và nhóm bị báo sai tự báo cáo vui hơn nhóm được báo đúng (điểm 1,78 và 1,90, so với 0,98).
  loai: so-lieu
- trang: thi-nghiem/schachter-singer
  id: n24
  cau: Ở điều kiện vui vẻ, nhóm không được báo trước và nhóm bị báo sai có xu hướng hành động hưng phấn hơn nhóm được báo đúng; chênh lệch về chỉ số hành động chỉ có ý nghĩa thống kê với nhóm bị báo sai.
  loai: so-lieu
- trang: thi-nghiem/schachter-singer
  id: n25
  cau: Ở điều kiện giận dữ, chỉ số hành vi giận của nhóm không được báo trước cao hơn hẳn nhóm được báo đúng (+2,28 so với −0,18).
  loai: so-lieu
- trang: thi-nghiem/schachter-singer
  id: n26
  cau: Tự báo cáo giận cùng chiều nhưng chưa đạt mức ý nghĩa (1,91 so với 1,39; p = ,08).
  loai: so-lieu
- trang: thi-nghiem/schachter-singer
  id: n27
  cau: Các tác giả cho biết người tham gia ngại bộc lộ giận trước người thí nghiệm, vì sợ mất điểm thi.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n28
  cau: Nhóm giả dược nằm giữa các nhóm epinephrine; chênh lệch với nhóm epinephrine không có ý nghĩa thống kê ở điều kiện vui vẻ.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n29
  cau: Các tác giả gọi kết quả của nhóm giả dược là "đáng lo" cho lý thuyết, nên phải dùng phân tích phụ.
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n30
  cau: Phân tích phụ loại những người tự gán triệu chứng cho mũi tiêm; các tác giả gọi kết luận của mình là dè dặt (tentative).
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n31
  cau: "Ba mệnh đề: (a) kích thích không có lời giải thích sẽ được dán nhãn theo nhận thức sẵn có; (b) kích thích đã có lời giải thích phù hợp thì không cần dán nhãn thêm; (c) cùng bối cảnh nhận thức, phản ứng cảm xúc chỉ xuất hiện khi có kích thích sinh lý."
  loai: dinh-nghia
- trang: thi-nghiem/schachter-singer
  id: n32
  cau: "Năm 1979, cùng một số của Journal of Personality and Social Psychology đăng hai bài thử lại ý tưởng của Schachter và Singer: bài của Marshall và Zimbardo về hệ quả cảm xúc của kích thích sinh lý không được giải thích thỏa đáng, và bài của Maslach; Schachter và Singer viết bài phản hồi trong cùng số. Trang không kể thiết kế và số liệu."
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n33
  cau: Theo các tổng kết thứ cấp, hành vi của diễn viên vui vẻ ít ảnh hưởng đến người tham gia trong nghiên cứu của Marshall và Zimbardo, không như kết quả gốc.
  loai: tai-lap
- trang: thi-nghiem/schachter-singer
  id: n34
  cau: 'Tên bài của Maslach (1979) nói kết quả: kích thích không được giải thích bị "nghiêng" về cảm xúc tiêu cực (trong khung Đang tranh cãi: trong khi lý thuyết gốc cho rằng nhãn cảm xúc đến từ hoàn cảnh).'
  loai: tai-lap
- trang: thi-nghiem/schachter-singer
  id: n35
  cau: Maslach (1979) dùng ám thị thôi miên thay cho mũi tiêm và cho kết quả theo hướng tương tự.
  loai: tai-lap
- trang: thi-nghiem/schachter-singer
  id: n36
  cau: Reisenzein (1983) là tổng quan sau hai thập kỷ, xem xét bằng chứng cho ba suy luận chính của lý thuyết Schachter.
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n37
  cau: "Chỉ một trong ba suy luận được dữ liệu ủng hộ đầy đủ: kích thích từ nguồn ngoài, bị quy nhầm cho tình huống cảm xúc, làm mạnh thêm phản ứng cảm xúc."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n38
  cau: Suy luận rằng giảm kích thích làm giảm cảm xúc ít được ủng hộ; suy luận rằng quy kích thích cho nguồn trung tính làm giảm cảm xúc thì chưa rõ vì còn cách diễn giải khác.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n39
  cau: Không có bằng chứng thuyết phục cho rằng kích thích là điều kiện cần của cảm xúc, hay rằng dán nhãn kích thích không rõ nguyên nhân có thể tạo ra cảm xúc.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n40
  cau: 'Reisenzein cho rằng vai trò của kích thích bị nói quá; điều còn lại nhiều nhất là phiên bản "pha loãng": kích thích có thể khuếch đại cường độ cảm xúc, một phần qua cách quy kết nguồn kích thích.'
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n41
  cau: "Dutton và Aron (1974): những người đàn ông đi ngang qua được một nữ phỏng vấn viên hấp dẫn gặp trên cầu treo gây sợ hãi hoặc cầu không gây sợ hãi, điền bảng hỏi có tranh TAT."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n42
  cau: Nội dung tình dục trong chuyện của người ở cầu treo và xu hướng tìm cách liên lạc lại với phỏng vấn viên đều cao hơn có ý nghĩa thống kê; với phỏng vấn viên nam thì hai cầu không khác nhau.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n43
  cau: Hai tác giả diễn giải đó là cơn kích thích từ nỗi sợ bị quy nhầm thành sự hấp dẫn; nghiên cứu hiện trường này được dẫn nhiều.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n44
  cau: "Khá vững: kích thích từ nguồn khác, bị quy nhầm cho một tình huống cảm xúc, có thể làm mạnh thêm cảm xúc."
  loai: nhan
- trang: thi-nghiem/schachter-singer
  id: n45
  cau: "Đang tranh cãi: phiên bản mạnh của lý thuyết hai nhân tố."
  loai: nhan
- trang: thi-nghiem/schachter-singer
  id: n76
  cau: Một phân tích tổng hợp về kích thích và sự hấp dẫn (Foster và cộng sự, 1998) thấy kích thích làm tăng sự hấp dẫn ngay cả khi nguồn kích thích khá rõ ràng; phần tổng quan đi kèm trong cùng bài gợi ý tác động mạnh hơn khi nguồn kích thích mơ hồ.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n46
  cau: Cotton (1981) kết luận lý thuyết của Schachter chưa được nghiên cứu ủng hộ tốt, nhưng bằng chứng chưa chắc đã bác bỏ nó.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n47
  cau: Khung "Đã bị bác bỏ" cũ ("cứ tim đập nhanh là não sẽ tự bịa ra bất kỳ cảm xúc nào") đã bỏ khỏi trang.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n48
  cau: "James (1890): thay đổi của cơ thể đi liền sau việc nhận ra sự kiện, và cảm giác về những thay đổi ấy chính là cảm xúc."
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n49
  cau: Schachter và Singer giữ lại phần cơ thể của James–Lange nhưng thêm rằng cần có thêm nhận thức phù hợp.
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n50
  cau: Cannon (1929) phê bình James–Lange, chẳng hạn rằng động vật bị cắt hệ giao cảm vẫn có hành vi cảm xúc; Schachter và Singer thừa nhận phê bình này cũng áp dụng cho mệnh đề thứ ba.
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n51
  cau: 'Bullet "Thẩm định nhận thức hiện đại: cảm xúc là kết quả của quá trình đánh giá tình huống" đã bỏ khỏi trang.'
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n52
  cau: Việc đổi nguồn mà ta quy cho cơn kích thích có làm giảm cảm xúc hay không thì Reisenzein (1983) đánh giá là chưa rõ.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n53
  cau: Nghiên cứu cầu treo là một nghiên cứu hiện trường với nam giới và một phỏng vấn viên, nên không đủ để nói điều gì về chuyện hẹn hò nói chung.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n54
  cau: Bullet "Tranh luận lúc đang nóng máy" (vừa tập thể dục xong, cơn giận có thể đến từ dư âm sinh lý) đã bỏ khỏi trang.
  loai: loi-khuyen
- trang: thi-nghiem/schachter-singer
  id: n55
  cau: Tính đến 10/2026, chưa tìm thấy nghiên cứu nào kiểm tra lý thuyết hai nhân tố trên người Việt.
  loai: thoi-su
- trang: thi-nghiem/schachter-singer
  id: n56
  cau: Thí nghiệm gốc làm trên nam sinh viên ở Đại học Minnesota (Mỹ).
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n57
  cau: Câu "thí nghiệm gốc ... một thiết kế ngày nay không thể qua hội đồng đạo đức ở bất kỳ đâu" và đoạn "câu hỏi thú vị nhưng chưa có đáp án" về ngôn ngữ, chuẩn mực văn hóa đã bỏ.
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n58
  cau: "Ngộ nhận: lý thuyết hai nhân tố coi kích thích sinh lý là một thành phần của cảm xúc mạnh, dù Reisenzein (1983) không thấy bằng chứng thuyết phục rằng nó là điều kiện cần."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n59
  cau: "Ngộ nhận: tim đập nhanh khi gặp ai đó không nhất thiết nghĩa là yêu; theo phân tích tổng hợp của Foster và cộng sự (1998), kích thích từ một nguồn khác cũng có thể làm ta thấy người kia hấp dẫn hơn, nên cảm giác tim đập nhanh tự nó chưa nói được ta cảm thấy gì về người ấy."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n60
  cau: "Ngộ nhận: có thể điều khiển cảm xúc người khác bằng cách tạo kích thích; điều được tổng quan xem là có đủ bằng chứng chỉ là kích thích làm mạnh thêm cảm xúc sẵn có."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n61
  cau: "Ngộ nhận: lý thuyết bị phê bình thì vứt đi; phần mà Reisenzein xem là có đủ bằng chứng vẫn còn."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n62
  cau: "Quiz 1: nhóm bắt cảm xúc của diễn viên mạnh nhất là nhóm tiêm adrenaline mà không được giải thích đúng (không được báo gì hoặc bị báo sai); nhóm được báo đúng ít bị cuốn theo nhất, nhóm giả dược nằm giữa."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n63
  cau: "Quiz 2: nhóm được báo đúng ít chịu ảnh hưởng vì đã có lời giải thích thỏa đáng cho cơn kích thích; đó là mệnh đề (b)."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n64
  cau: "Quiz 3: Marshall và Zimbardo (1979) khi làm lại điều kiện vui vẻ: theo các tổng kết thứ cấp, hành vi của diễn viên vui vẻ ít ảnh hưởng đến người tham gia, không như kết quả gốc."
  loai: tai-lap
- trang: thi-nghiem/schachter-singer
  id: n65
  cau: 'Quiz 4: Reisenzein (1983) kết luận chỉ còn phiên bản "pha loãng": kích thích bị quy nhầm nguồn làm mạnh thêm cảm xúc; không có bằng chứng thuyết phục rằng kích thích là điều kiện cần của cảm xúc.'
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n66
  cau: "Quiz 5: nghiên cứu cầu treo minh họa việc cơn kích thích từ nỗi sợ có thể bị quy nhầm thành sự hấp dẫn."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n70
  cau: "Hộp hồ sơ: tác giả và năm là Stanley Schachter và Jerome Singer, 1962; tổng quan Reisenzein, 1983."
  loai: lich-su
- trang: thi-nghiem/schachter-singer
  id: n71
  cau: "Hộp hồ sơ: người tham gia là nam sinh viên các lớp nhập môn tâm lý học ở Đại học Minnesota; 184 người đồng ý tiêm, 11 người bị loại vì quá nghi ngờ thí nghiệm."
  loai: so-lieu
- trang: thi-nghiem/schachter-singer
  id: n72
  cau: "Hộp hồ sơ: thiết kế gồm tiêm epinephrine (được báo đúng, không được báo, bị báo sai) hay giả dược; 20 phút ngồi cùng diễn viên vui vẻ hoặc giận dữ."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n73
  cau: "Hộp hồ sơ: người tiêm epinephrine mà không được báo trước bị cuốn theo cảm xúc của diễn viên nhiều hơn người được báo đúng; nhóm giả dược nằm giữa, chênh lệch với nhóm epinephrine không có ý nghĩa thống kê ở điều kiện vui vẻ."
  loai: phat-hien
- trang: thi-nghiem/schachter-singer
  id: n74
  cau: "Hộp hồ sơ: Reisenzein (1983) kết luận chỉ một trong ba suy luận của lý thuyết được dữ liệu ủng hộ đầy đủ."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n1
  cau: Năm 1967, Seligman và Maier cho thấy chó từng chịu sốc điện không thể kiểm soát phần lớn thụ động chịu đựng trong hộp shuttle box dù chỉ cần nhảy qua vách ngăn thấp là thoát.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n2
  cau: Cuối thập niên 1960, chó được buộc trong võng (hammock) và chịu sốc điện.
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n3
  cau: Hai con chó chịu cú sốc cùng cường độ và cùng thời lượng trung bình; con thứ nhất tắt được sốc bằng cách ấn đầu vào tấm bảng ở bên đầu, con thứ hai ấn thế nào sốc cũng không dừng.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n4
  cau: Hôm sau, cả hai được đưa vào một hộp shuttle có vách ngăn ở giữa; chỉ cần nhảy qua vách là thoát sốc.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n5
  cau: Phần lớn chó nhóm yoked (6 trên 8 con) thụ động chịu sốc ở ít nhất 9 trong 10 lượt, dù chỉ cần một cái nhảy là thoát.
  loai: so-lieu
- trang: thi-nghiem/seligman
  id: n6
  cau: Chó từng tắt được sốc hôm trước, và cả những con chó chưa từng bị sốc, thoát sốc bình thường.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n7
  cau: "Câu hỏi cho chính chúng ta: khi con người liên tục rơi vào tình huống mà nỗ lực chẳng đổi được gì, điều gì xảy ra với ý chí của họ?"
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n8
  cau: Thí nghiệm cho thấy, trong thiết kế của họ, thủ phạm không phải cú sốc điện mà là sự không kiểm soát được cú sốc.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n9
  cau: Hai nhóm chó chịu sốc cùng cường độ và cùng thời lượng; nếu chính cơn đau làm chó "tê liệt", hai nhóm phải cư xử giống nhau.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n10
  cau: Seligman và Maier giải thích năm 1967 rằng sinh vật học được kết quả độc lập với phản ứng của mình, và bài học đó lan sang tình huống mới; họ gọi đó là "bất lực học được".
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n11
  cau: Năm 2016, chính Maier và Seligman viết rằng giải thích gốc "hiểu ngược" (got it backwards).
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n12
  cau: "Hiện tượng bắt nguồn từ phòng thí nghiệm của Richard Solomon ở Đại học Pennsylvania, nơi nghiên cứu điều kiện hóa sợ hãi kiểu Pavlov: chó bị giữ trong võng, chịu sốc, hôm sau tập thoát sốc trong hộp shuttle."
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n13
  cau: Chó nhiều khi không thoát sốc trong hộp shuttle mà thụ động chờ hết sốc.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n14
  cau: "Overmier và Seligman: sốc không thoát được làm hỏng một cách đáng tin cậy việc học thoát/tránh sốc sau đó trong tình huống mới."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n15
  cau: Chó vẫn bị suy giảm khi bị tê liệt bằng curare lúc chịu sốc, và khi tăng cường độ sốc lúc tập thoát.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n16
  cau: Suy giảm tan sau 48 giờ.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n17
  cau: Overmier và Seligman gợi ý mức kiểm soát có thể là yếu tố quyết định hiệu ứng.
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n18
  cau: Maier và Seligman (2016) viết rằng Overmier và Seligman là người đầu tiên gợi ý từ "bất lực" cho hiện tượng.
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n19
  cau: Thí nghiệm I của Seligman và Maier dùng 24 chó, mỗi nhóm 8 con.
  loai: so-lieu
- trang: thi-nghiem/seligman
  id: n20
  cau: Nhóm thoát được ấn một trong hai tấm bảng bằng đầu để tắt sốc; 64 cú sốc 6 mA không báo hiệu.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n21
  cau: Nhóm yoked nhận cú sốc có thời lượng bằng trung bình của cú tương ứng ở nhóm thoát được, nhưng ấn bảng vô tác dụng.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n22
  cau: Nhóm đối chứng bình thường không qua giai đoạn trong võng, chỉ tập 10 lượt trong hộp shuttle.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n23
  cau: Sau 24 giờ, cả ba nhóm cùng làm 10 lượt tập thoát sốc trong hộp shuttle.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n24
  cau: Thời gian thoát trung bình là 27,00 giây (nhóm thoát được), 25,93 giây (đối chứng) và 48,22 giây (yoked).
  loai: so-lieu
- trang: thi-nghiem/seligman
  id: n25
  cau: 6 trên 8 chó yoked không thoát ở ít nhất 9 trong 10 lượt, so với 0 con của nhóm thoát được và 1 trên 8 con của nhóm đối chứng.
  loai: so-lieu
- trang: thi-nghiem/seligman
  id: n26
  cau: Nhóm thoát được và nhóm đối chứng không khác nhau; chỉ nhóm yoked bị suy giảm rõ.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n27
  cau: "Thí nghiệm II (27 chó, mỗi nhóm 9 con): chó đã từng thoát được sốc trong hộp shuttle trước đó không bị suy giảm sau khi chịu sốc không kiểm soát trong võng, trong khi chó chưa có kinh nghiệm thì bị suy giảm."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n28
  cau: Năm trong sáu chó yoked bị suy giảm vẫn thất bại trong mọi lượt khi thử lại sau 7 ngày.
  loai: so-lieu
- trang: thi-nghiem/seligman
  id: n29
  cau: "Hình: ba nhóm trải qua giai đoạn sốc khác nhau rồi, sau 24 giờ, cùng làm 10 lượt thoát sốc trong hộp shuttle."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n30
  cau: 'Hình (đã sửa): nhóm đối chứng "Không vào võng / không bị sốc trước".'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n31
  cau: 'Hình (đã sửa): ô kết quả "Thoát sốc bình thường" (nhóm thoát được, nhóm đối chứng) và "Phần lớn thụ động (6/8)" (nhóm yoked); dòng dưới "Chỉ nhóm yoked bị suy giảm rõ: 6 trên 8 con không thoát ở ít nhất 9 trong 10 lượt"; chú thích tương ứng.'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n74
  cau: 'Hình (đã sửa): nhóm yoked "Sốc cùng thời lượng trung bình / ấn bảng vô tác dụng"; dòng dưới và chú thích: nhóm yoked chịu sốc cùng thời lượng trung bình với nhóm thoát được, chỉ khác ở khả năng kiểm soát.'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n75
  cau: 'Hình (đã sửa): nhóm thoát được "Ấn tấm bảng bằng đầu là tắt sốc (kiểm soát được)"; mỗi nhóm 8 con; giai đoạn 2 "học nhảy qua vách ngăn để thoát hay tránh sốc".'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n32
  cau: Hiroto và Seligman làm bốn thí nghiệm cùng lúc trên sinh viên đại học, trong đó có một thí nghiệm dùng tiếng ồn khó chịu (tắt được, không tắt được, không nghe) rồi cho giải anagram.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n33
  cau: Nhóm từng chịu tiếng ồn không thể tắt thất bại nhiều hơn ở việc giải anagram, dù nhiệm vụ không liên quan đến tiếng ồn.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n34
  cau: Hiroto và Seligman gợi ý một kỳ vọng rằng phản ứng của mình không liên quan đến kết quả, và hiệu ứng có thể là một "đặc điểm gây ra được".
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n35
  cau: Maier và Seligman (2016) là một bài tổng quan 50 năm trên Psychological Review.
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n36
  cau: Nghiên cứu thần kinh học được tổng hợp chủ yếu trên chuột, dùng các can thiệp như tổn thương và vi tiêm thuốc chặn hoạt động của vùng não.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n37
  cau: 'Hai tác giả thừa nhận lý thuyết gốc "hiểu ngược": thụ động trước sốc kéo dài không phải là thứ học được mà là phản ứng mặc định, có sẵn, qua hoạt động serotonin của nhân dorsal raphe ức chế hành vi thoát.'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n38
  cau: "Cái thực sự phải học là sự kiểm soát: vùng vỏ não trước trán trong phát hiện kiểm soát và tự động ức chế nhân dorsal raphe."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n39
  cau: "Khá vững: sốc không kiểm soát được làm suy giảm việc học cách thoát sau này — ở động vật."
  loai: nhan
- trang: thi-nghiem/seligman
  id: n40
  cau: 'Khá vững: bản "đảo ngược" 2016 có nền tảng thần kinh học trên động vật.'
  loai: nhan
- trang: thi-nghiem/seligman
  id: n41
  cau: Từ thập niên 1970, Seligman đề xuất dùng hiện tượng này làm mô hình phòng thí nghiệm cho trầm cảm.
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n42
  cau: Maier và Seligman (2016) kể rằng hiện tượng tái hiện tám trong chín triệu chứng của trầm cảm theo tiêu chí DSM-III và DSM-IV.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n43
  cau: Chính Maier và Seligman chỉ "phỏng đoán" (speculate) rằng phát hiện thần kinh có thể có ý nghĩa cho điều trị trầm cảm.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n44
  cau: "Đang tranh cãi: 'bất lực học được' giải thích được bao nhiêu về trầm cảm ở người? (mô hình gợi ý, không phải công cụ chẩn đoán hay điều trị; dẫn trang Hỗ trợ)."
  loai: nhan
- trang: thi-nghiem/seligman
  id: n76
  cau: Năm 1978, một tổng quan phê bình cho rằng sáu thí nghiệm trên người của nhóm Seligman ủng hộ rất ít cho thuyết bất lực học được về trầm cảm (Costello, 1978).
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n77
  cau: Chính Seligman cùng cộng sự viết lại thuyết cho người, thêm vai trò của cách mỗi người giải thích nguyên nhân (Abramson, Seligman và Teasdale, 1978).
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n78
  cau: Một phân tích tổng hợp 104 nghiên cứu thấy cách giải thích nguyên nhân ấy có liên hệ đáng tin cậy với điểm trầm cảm (Sweeney và cộng sự, 1986); đó là mối liên hệ, tự nó không cho biết chiều nhân quả.
  loai: so-lieu
- trang: thi-nghiem/seligman
  id: n45
  cau: 'Lý thuyết 1967: ngoài "làm A thì được B", sinh vật còn học mối quan hệ thứ ba: kết quả độc lập với mọi phản ứng.'
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n46
  cau: "Abramson, Seligman và Teasdale (1978): ở người, còn tùy cách giải thích sự bất lực; người cho nguyên nhân là lâu dài thì bất lực kéo dài, người cho nguyên nhân lan rộng thì bất lực lan sang nhiều tình huống."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n47
  cau: "Kinh nghiệm thoát được sốc trong hộp shuttle trước đó có tác dụng bảo vệ trong thí nghiệm: chó không bị suy giảm sau khi chịu sốc không kiểm soát được."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n48
  cau: Hiroto và Seligman (1975) thấy ở người rằng trải nghiệm không kiểm soát được trong thí nghiệm ngắn làm giảm thành tích ở nhiệm vụ sau.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n49
  cau: Các bullet cũ của mục Áp dụng (chia mục tiêu thành bước nhỏ, tách phần kiểm soát được, dạy con và quản lý) đã bỏ khỏi trang.
  loai: loi-khuyen
- trang: thi-nghiem/seligman
  id: n50
  cau: Đừng dùng khái niệm này để dán nhãn ai; trang không đưa chẩn đoán hay hướng dẫn điều trị; ai buồn hay kiệt sức kéo dài thì xem trang Hỗ trợ.
  loai: loi-khuyen
- trang: thi-nghiem/seligman
  id: n51
  cau: Tính đến 10/2026, chưa tìm thấy thí nghiệm bất lực học được nào trên người Việt.
  loai: thoi-su
- trang: thi-nghiem/seligman
  id: n52
  cau: Thí nghiệm gốc làm trên chó ở Mỹ; bản trên người (Hiroto và Seligman, 1975) làm trên sinh viên đại học.
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n53
  cau: Đoạn về văn hóa Việt Nam ("coi trọng ý chí ... ngừng cố gắng bị quy là lười") đã bỏ.
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n54
  cau: 'Ngộ nhận "chó không nhảy vì ngu, nhát, lười": nhóm chưa từng bị sốc và nhóm từng tắt được sốc thoát sốc bình thường.'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n55
  cau: 'Ngộ nhận "cú sốc điện làm chó tê liệt": thiết kế ba nhóm loại trừ, vì nhóm tắt được sốc chịu cùng lượng sốc như nhóm yoked mà hôm sau vẫn thoát bình thường.'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n56
  cau: 'Ngộ nhận "bất lực học được chính là trầm cảm": đó là mô hình động vật gợi hướng nghiên cứu, không ai được dùng nó để chẩn đoán ai.'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n57
  cau: 'Ngộ nhận "lý thuyết 1967 vẫn giữ nguyên": chính Maier và Seligman 2016 viết rằng lý thuyết gốc "hiểu ngược".'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n58
  cau: 'Ngộ nhận "bất lực học được nghĩa là thiếu ý chí": trong thí nghiệm nhóm yoked chịu cùng lượng sốc với nhóm thoát được, khác biệt là khả năng kiểm soát.'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n59
  cau: "Quiz 1: ba nhóm là nhóm ấn bảng tắt được sốc, nhóm yoked (cùng thời lượng sốc, ấn bảng vô tác dụng), nhóm không qua giai đoạn sốc."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n60
  cau: "Quiz 2: nhóm từng tắt được sốc và nhóm chưa từng bị sốc thoát sốc bình thường; phần lớn nhóm yoked thụ động chịu sốc."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n61
  cau: "Quiz 3: nhóm tắt được sốc chịu cùng lượng sốc như nhóm yoked mà vẫn thoát bình thường, nên không phải bản thân cú sốc là nguyên nhân."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n62
  cau: 'Quiz 4: Maier và Seligman (2016) kết luận lý thuyết gốc "hiểu ngược": thụ động là phản ứng mặc định có sẵn (nhân dorsal raphe), còn cái phải học là sự kiểm soát (vùng trán trong).'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n63
  cau: 'Quiz 5: thí nghiệm Seligman là mô hình động vật gợi hướng nghiên cứu, không phải công cụ chẩn đoán hay điều trị; chính Maier và Seligman (2016) chỉ "phỏng đoán" về ý nghĩa với điều trị trầm cảm.'
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n68
  cau: "Hộp hồ sơ: tác giả và năm là Seligman và Maier, 1967; Overmier và Seligman, 1967; bản cập nhật Maier và Seligman, 2016."
  loai: lich-su
- trang: thi-nghiem/seligman
  id: n69
  cau: "Hộp hồ sơ: đối tượng là 24 chó lai ở Đại học Pennsylvania trong thí nghiệm I (mỗi nhóm 8 con)."
  loai: so-lieu
- trang: thi-nghiem/seligman
  id: n70
  cau: "Hộp hồ sơ: thiết kế ba nhóm (tắt được sốc bằng cách ấn bảng bằng đầu, yoked, không qua giai đoạn sốc), 24 giờ sau 10 lượt thoát sốc trong hộp shuttle."
  loai: phat-hien
- trang: thi-nghiem/seligman
  id: n71
  cau: "Hộp hồ sơ: 6 trên 8 chó yoked không thoát được ở ít nhất 9 trong 10 lượt; nhóm thoát được và nhóm đối chứng thoát như nhau."
  loai: so-lieu
- trang: thi-nghiem/seligman
  id: n72
  cau: 'Hộp hồ sơ: chính hai tác giả viết năm 2016 rằng lý thuyết gốc "hiểu ngược": thụ động là phản ứng mặc định, thứ phải học là sự kiểm soát.'
  loai: phat-hien
