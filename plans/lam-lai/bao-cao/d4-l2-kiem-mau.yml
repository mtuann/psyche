- trang: bang-chung/dao-duc-nghien-cuu
  id: e24
  cau: IRB (Institutional Review Board) là hội đồng xem xét các kế hoạch nghiên cứu với người; theo quy định liên bang Mỹ, mỗi IRB có ít nhất năm thành viên với nền tảng khác nhau, trong đó có ít nhất một người có mối quan tâm chính ở lĩnh vực khoa học, ít nhất một người ở lĩnh vực ngoài khoa học, và ít nhất một người không thuộc cơ sở.
  loai: dinh-nghia
  nguon:
    - ten: "45 CFR phần 46 (Common Rule), các điều 46.101, 46.107, 46.109, 46.111, 46.116: bản eCFR, mỗi điều đọc riêng"
      link: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-A/part-46
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "hội đồng độc lập gồm các nhà khoa học và người ngoài ngành". Chữ mới theo 46.107. Lý do: "độc lập" không phải chữ của quy định (quy định đòi ít nhất một thành viên không thuộc cơ sở; tính độc lập nói ở Helsinki cho hội đồng đạo đức nghiên cứu, e7). Review (Claude Opus 5.5, 30/10/2026): Đúng: chữ trên trang khớp trích và vị trí đã ghi của nguồn.'
- trang: bang-chung/thong-ke-mo-ta
  id: tk20
  cau: Lệch phải là đuôi dài về phía giá trị lớn, lệch trái là đuôi dài về phía giá trị nhỏ; khi lệch phải trung bình thường lớn hơn trung vị, khi lệch trái trung bình thường nhỏ hơn trung vị.
  loai: dinh-nghia
  nguon:
    - ten: "OpenStax, Introductory Statistics 2e, mục 2.6 (Skewness and the mean, median, and mode): toàn văn trực tuyến"
      link: https://openstax.org/books/introductory-statistics-2e/pages/2-6-skewness-and-the-mean-median-and-mode
  ket_qua_luot_1: da-sua
  ghi_chu: "Chữ cũ: \"Lệch phải: thu nhập, giá nhà, số lượt xem video, tài sản\"; \"Lệch trái: tuổi thọ ở nước phát triển ..., điểm thi khi đề quá dễ\"; \"Với thu nhập — luôn lệch phải — trung bình hầu như luôn cao hơn trung vị, và trung vị mới là con số gần với 'người điển hình' hơn\". Lý do: các ví dụ và \"luôn\", \"hầu như luôn\" không có nguồn đã mở; giáo trình chỉ nói \"thường\" (often). Review (Claude Sonnet 5.5, 30/10/2026): dung. Có \"thường\", khớp \"often\"; không còn ví dụ hay \"luôn\"."
- trang: bang-chung/dao-duc-nghien-cuu
  id: e52
  cau: "Tình huống 3 (tờ đồng thuận 8 trang trong 2 phút): Belmont nói trình bày vội, ít thời gian và hạn chế câu hỏi làm giảm khả năng lựa chọn có hiểu biết, và nhà nghiên cứu phải xác nhận người tham gia đã hiểu; cách sửa là giải thích bằng lời dễ hiểu, cho thời gian đọc và hỏi, kiểm tra xem người tham gia có nắm ý chính không."
  loai: loi-khuyen
  nguon:
    - ten: "National Commission (1979), The Belmont Report, đăng trên Federal Register 44(76), 23192–23197, ngày 18/4/1979: toàn văn trong bản scan của Federal Register (govinfo.gov, PDF 152 trang, tr. 23192–23197); trang hhs.gov chặn truy cập tự động (403) nên không dùng được; số trang theo Federal Register"
      link: https://www.govinfo.gov/content/pkg/FR-1979-04-18/pdf/FR-1979-04-18.pdf
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'gia-dinh. Chữ cũ: "Vi phạm tôn trọng con người (yếu tố "hiểu được thông tin"). Ký vội một văn bản khó hiểu không phải là đồng thuận thật sự." Lý do: "vi phạm" và "không phải là đồng thuận thật sự" mạnh hơn Belmont (nói là có thể ảnh hưởng). Review (Claude Opus 5.5, 30/10/2026): Đúng: chữ trên trang khớp trích và vị trí đã ghi của nguồn.'
- trang: bang-chung/co-mau-suc-manh
  id: c45
  cau: Công suất của nhiều nghiên cứu thần kinh học và tâm lý học thấp hơn nhiều so với mức 0,8, nhưng thấp đến đâu còn tùy cách ước tính.
  loai: nhan
  nguon:
    - ten: "Button và cộng sự (2013), Nat Rev Neurosci 14(5), 365–376: tóm tắt (Europe PMC) và trang xem trước của nature.com; toàn văn bị khóa, chưa đọc được. Con số 49 bài tổng hợp, 730 nghiên cứu, 21%, 8% và 18–31% lấy qua Nord và cộng sự (2017) và Research Digest của BPS"
      link: https://doi.org/10.1038/nrn3475
    - ten: "Szucs & Ioannidis (2017), PLOS Biol 15(3), e2000797: toàn văn (PMC5333800), đọc 100.000 ký tự đầu"
      link: https://doi.org/10.1371/journal.pbio.2000797
    - ten: "Szucs & Ioannidis (2021), Correction, PLOS Biol 19(3), e3001151: trang đính chính (journals.plos.org), đọc ở review D4-L2"
      link: https://doi.org/10.1371/journal.pbio.3001151
    - ten: "Nord, Valton, Wood & Roiser (2017), J Neurosci 37(34), 8051–8061, phân tích lại Button: toàn văn (PMC5566862), đọc 100.000 ký tự đầu (Tóm tắt, Phương pháp, Kết quả, Bàn luận)"
      link: https://doi.org/10.1523/JNEUROSCI.3592-16.2017
  ket_qua_luot_1: dung
  ghi_chu: "Review (Claude Opus 5.5, 30/10/2026): Nhãn Khá vững hợp mục 4 (nhiều phân tích cùng chiều, con số tùy giả định, Nord thấy không đồng đều); trich, vi_tri và co_so sửa theo c26 và c30 (số đính chính 0,46), không đổi nhãn hay chữ của khung."
- trang: bang-chung/phan-tich-tong-hop
  id: pt38
  cau: Các nghiên cứu có kết quả "có ý nghĩa thống kê" dễ được công bố và dễ được tìm thấy hơn các nghiên cứu "không có ý nghĩa thống kê".
  loai: phat-hien
  nguon:
    - ten: "Cochrane Handbook, chương 13 (Assessing risk of bias due to missing evidence in a synthesis): toàn văn trực tuyến"
      link: https://training.cochrane.org/handbook/current/chapter-13
  ket_qua_luot_1: da-sua
  ghi_chu: "Chữ cũ: \"Nhớ 'ngăn kéo hồ sơ' chứ — các nghiên cứu cho kết quả 'không có gì' thường không được đăng?\" Lý do: \"thường không được đăng\" mạnh hơn nguồn (\"more likely ... to be available\"). Review (Claude Opus 5.5, 30/10/2026): Đúng: chữ trên trang khớp trích và vị trí đã ghi của nguồn."
