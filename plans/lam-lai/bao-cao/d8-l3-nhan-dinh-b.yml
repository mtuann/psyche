- trang: du-lieu/ngo-nhan/tinh-cach-dong-khuon
  id: nhan
  cau: "Tính cách đóng khuôn sau 30, không đổi được nữa: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/tinh-cach-dong-khuon
  id: g1
  cau: "Roberts & DelVecchio 2000 (152 nghiên cứu dọc): ổn định thứ hạng tăng theo
    tuổi (.31 thơ ấu → .64 tuổi 30 → ~.74 tuổi 50–70)."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/tinh-cach-dong-khuon
  id: g2
  cau: "Roberts 2006 (92 mẫu): tận tâm và ổn định cảm xúc tăng, nhất là ở tuổi
    20–40."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/tre-so-sinh-khong-hieu
  id: nhan
  cau: "Trẻ sơ sinh chẳng hiểu gì về ngôn ngữ xung quanh: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/tre-so-sinh-khong-hieu
  id: g1
  cau: Trẻ nhỏ phân biệt được cả âm không có trong tiếng mẹ đẻ; khả năng này hẹp
    dần trong khoảng 6–12 tháng.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/tre-so-sinh-khong-hieu
  id: g2
  cau: "Kuhl 2003: 12 buổi (5 giờ) với người thật, trẻ 9 tháng học được cặp phụ âm
    Quan Thoại; video, băng thì không."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/tri-nho-may-quay
  id: nhan
  cau: "Trí nhớ hoạt động như máy quay phim: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/tri-nho-may-quay
  id: g1
  cau: Ký ức được dựng lại và có thể bị thông tin sau sự kiện làm sai lệch; hiện
    tượng được nghiên cứu nhiều thập kỷ với nhiều kiểu thí nghiệm.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/tri-nho-may-quay
  id: g2
  cau: "Khảo sát đại diện ở Mỹ (công bố 2011): 63% đồng ý trí nhớ hoạt động như
    máy quay phim."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/tu-kiem-tra
  id: nhan
  cau: "Tự kiểm tra giúp nhớ lâu hơn đọc lại: vững chắc."
  loai: nhan
- trang: du-lieu/ngo-nhan/tu-kiem-tra
  id: g1
  cau: "Roediger & Karpicke 2006: sau 5 phút, đọc lại nhớ tốt hơn; sau 2 ngày và
    một tuần, tự kiểm tra nhớ tốt hơn rõ rệt."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/tu-kiem-tra
  id: g2
  cau: Dunlosky 2013 xếp tự kiểm tra hiệu quả cao, đọc lại và tô đậm hiệu quả thấp.
  loai: phat-hien
- trang: du-lieu/ngo-nhan/vaccine-tu-ky
  id: nhan
  cau: "Tiêm vắc-xin cho trẻ gây tự kỷ: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/vaccine-tu-ky
  id: g1
  cau: "Taylor 2014: 5 nghiên cứu đoàn hệ (1.256.407 trẻ), 5 nghiên cứu bệnh-chứng
    (9.920 trẻ); OR 0,99 cho tiêm chủng và tự kỷ; không liên hệ với MMR."
  loai: so-lieu
- trang: du-lieu/ngo-nhan/xa-gian
  id: nhan
  cau: "Trút giận (đấm gối, la hét) giúp bớt giận: đã bị bác bỏ."
  loai: nhan
- trang: du-lieu/ngo-nhan/xa-gian
  id: g1
  cau: "Thí nghiệm 2002: nhóm đấm bao cát và nghĩ về người làm mình giận giận hơn
    và hung hăng nhất, so với nhóm không đấm bao cát."
  loai: phat-hien
- trang: du-lieu/ngo-nhan/xa-gian
  id: g2
  cau: "Phân tích tổng hợp 2024, 154 nghiên cứu: hoạt động làm dịu (thở sâu, chánh
    niệm, thiền) giảm giận; hoạt động tăng kích động (đấm bao cát, chạy bộ) nhìn
    chung không tác dụng."
  loai: so-lieu
