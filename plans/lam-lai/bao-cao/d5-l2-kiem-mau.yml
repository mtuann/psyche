- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n35
  cau: Các nhà nghiên cứu còn tranh luận xem đây là một khiếm khuyết cần sửa hay một lối tắt tư duy chỉ thỉnh thoảng phản tác dụng.
  loai: phat-hien
  nguon:
    - ten: "Nickerson (1998), Rev Gen Psychol 2(2), 175–220: toàn văn (PDF trong Internet Archive, bộ wikipedia-scholarly-sources-corpus)"
      link: https://doi.org/10.1037/1089-2680.2.2.175
    - ten: "Klayman & Ha (1987), Psychol Rev 94(2), 211–228: tóm tắt (OpenAlex); các nhận xét về bài này trong Nickerson 1998 đã mở"
      link: https://doi.org/10.1037/0033-295X.94.2.211
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ bắt đầu "Nói cách khác,": bỏ cụm nối vì chữ trước đã đổi. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp trích.'
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t44
  cau: Theo Kunda, các nghiên cứu thường tạo mục tiêu chính xác bằng cách tăng cái giá của việc phán đoán sai.
  loai: phat-hien
  nguon:
    - ten: "Kunda (1990), Psychol Bull 108(3), 480–498: toàn văn (Internet Archive, bộ wikipedia-scholarly-sources-corpus)"
      link: https://doi.org/10.1037/0033-2909.108.3.480
  ket_qua_luot_1: dung
- trang: kham-pha/tu-duy/tin-dieu-vo-ly
  id: t57
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu công bố nào kiểm tra lập luận có động cơ về chính trị hay số học có động cơ trên người Việt.
  loai: thoi-su
  nguon:
    - ten: 'Tìm trên OpenAlex (10/11/2026): "motivated reasoning Vietnam", "motivated reasoning Vietnamese participants", "politically motivated reasoning Vietnam", "motivated numeracy Vietnam", "identity-protective cognition Vietnam", "biased assimilation attitude polarization Vietnamese": không có nghiên cứu kiểm tra chính trị hay số học có động cơ trên người Việt'
      link: https://api.openalex.org/works?search=motivated%20reasoning%20Vietnam
  ket_qua_luot_1: dung
  ghi_chu: 'Tìm trên OpenAlex ngày 10/11/2026: "motivated reasoning Vietnam", "motivated reasoning Vietnamese participants", "politically motivated reasoning Vietnam", "motivated numeracy Vietnam", "identity-protective cognition Vietnam", "biased assimilation attitude polarization Vietnamese": không có nghiên cứu kiểm tra chính trị hay số học có động cơ trên người Việt. Có một mục đăng ký thử nghiệm (Kiesel, AEA RCT Registry rct.10541, "Biased Beliefs, Motivated Reasoning, and Consumer Valuation of Vegetable Labels in Vietnam", 2022) về nhãn rau của người tiêu dùng: không phải chính trị hay số học, và không thấy bài có kết quả. Chữ cũ: "Chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra lập luận có động cơ hay số học có động cơ trên người Việt." (không mốc, không hạn; phạm vi rộng hơn nên mục đăng ký trên có thể là ngoại lệ; đã thu hẹp sang chính trị và số học). Chưa tìm Google Scholar hay tạp chí trong nước.'
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n22
  cau: Bài tổng quan gom các phát hiện về thiên kiến xác nhận (tìm kiếm và diễn giải bằng chứng, ghi nhớ có chọn lọc, các ví dụ ngoài phòng thí nghiệm) thành một khung chung.
  loai: phat-hien
  nguon:
    - ten: "Nickerson (1998), Rev Gen Psychol 2(2), 175–220: toàn văn (PDF trong Internet Archive, bộ wikipedia-scholarly-sources-corpus)"
      link: https://doi.org/10.1037/1089-2680.2.2.175
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "kiểm tra giả thuyết, diễn giải bằng chứng, ghi nhớ, ra quyết định" và "bác sĩ diễn giải kết quả xét nghiệm... lướt tin tức mỗi ngày". Chữ mới theo tóm tắt; "ra quyết định" và "lướt tin tức" không phải mục của bài 1998. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp trích.'
- trang: kham-pha/tu-duy/linh-cam-va-xac-suat
  id: n70
  cau: 'Câu hỏi 3: theo thay thế thuộc tính của Kahneman, ta đổi câu hỏi khó ("xác suất nào lớn hơn?") thành câu dễ ("mô tả nào giống Linda hơn?") mà không hay biết.'
  loai: phat-hien
  nguon:
    - ten: "Kahneman (2011), Thinking, Fast and Slow, FSG: toàn văn (bản quét trong Internet Archive)"
      link: https://archive.org/details/thinking-fast-and-slow-by-daniel-kahneman
  ket_qua_luot_1: dung
  ghi_chu: Quiz câu 3 (đáp án đúng); "Heuristic đại diện chính là sự thay thế này" khớp Kahneman (representativeness thay probability).
