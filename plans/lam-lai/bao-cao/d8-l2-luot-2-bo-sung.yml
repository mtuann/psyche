# Lượt 2, lô D8-L2, phần bổ sung (10 nhận định lượt 1 viết lại sau lượt 2 đầu).
# Model: Claude Opus 5.5. Ngày kiểm: 17/11/2026. Độc lập với lượt 1 (không mở kiem-dinh/, trang, báo cáo khác).
# OpenAlex hết lượt miễn phí của máy (HTTP 429) trong suốt phiên; Google Scholar chặn truy cập tự động (302).

- trang: trai-nghiem/tri-nho-sai
  id: n6
  luot_2: sai
  nguon:
    - "https://link.springer.com/content/pdf/10.3758/s13423-017-1348-y.pdf"
    - "https://doi.org/10.1098/rsos.220595"
    - "https://doi.org/10.1037/xge0001527"
    - "https://doi.org/10.1037/pag0000966"
    - "https://doi.org/10.3389/fpsyg.2021.718818"
  trich: "Zwaan et al. (2018, PBR 25:1968): 'a series of nine preregistered experiments' (thí nghiệm 5 là False memories, Roediger & McDermott 1995); 'the first wave yielded highly significant effects for all nine experiments, with in each case Bayes factors in excess of 10,000 ... each effect was replicated during the second wave.' Registered report (N = 488, Royal Society Open Science 2023): người tham gia vẫn nhớ sai các từ mồi tới hạn. Phân tích tổng hợp có đăng ký trước (2024, JEP: General; k = 49 nhớ lại, k = 75 nhận diện) kèm một lần làm lại có đăng ký trước (n = 278) đều dựa trên hiệu ứng DRM nền."
  ghi_chu: "Bằng chứng vượt mức 'Khá vững' theo mục 4 của chuẩn. Ít nhất ba nghiên cứu có đăng ký trước cho hiệu ứng DRM nền đều cùng chiều: Zwaan 2018 (hai đợt, khoảng 160 người mỗi thí nghiệm, trên MTurk), registered report về giấc ngủ (N = 488) và lần làm lại năm 2024 (n = 278). Có một tổng quan hệ thống (Frontiers in Psychology 2021) và nhiều phân tích tổng hợp gộp hàng trăm cỡ hiệu ứng DRM: theo tuổi (Psychology and Aging 2026, 150 bài, 414 cỡ hiệu ứng, cả người trẻ lẫn người già), theo cảm xúc, theo giấc ngủ (Newbury & Monaghan 2019), theo mã hóa khác biệt (Huff, Bodner & Fawcett). Các bài này dùng DRM để xét yếu tố điều tiết, không ước lượng riêng hiệu ứng nền, nhưng mọi bài đều có hiệu ứng nền. Hiệu ứng đúng ở trẻ em, người già, mẫu online và mẫu phòng thí nghiệm. Không tìm thấy thất bại tái lập lớn nào. Như vậy đạt điều kiện 'Vững chắc' (hai lần tái lập lớn có đăng ký trước, cùng chiều; một tổng quan hệ thống; nhiều quần thể). Phần ngoặc 'một tổng quan tường thuật và một lần làm lại có đăng ký trước' tả đúng hai nguồn trang dẫn, nhưng bằng chứng hiện có nhiều hơn thế. Chỉ đọc toàn văn Zwaan 2018; các bài khác đọc tóm tắt qua Europe PMC."
  cau_dung: 'Vững chắc: học các từ cùng chủ đề có thể khiến ta "nhớ" một từ chưa từng thấy (nhiều lần làm lại có đăng ký trước cùng chiều, như Zwaan và cộng sự, 2018; một tổng quan hệ thống và nhiều phân tích tổng hợp dùng mô hình này ở trẻ em, người trẻ, người già).'

- trang: trai-nghiem/neo-gia
  id: n6
  luot_2: sai
  nguon:
    - "https://researchonline.lse.ac.uk/id/eprint/65158/"
    - "https://doi.org/10.1037/lhb0000438"
    - "https://doi.org/10.31234/osf.io/teq7k_v2"
    - "https://doi.org/10.31234/osf.io/wf2tn"
  trich: "Klein et al. (2014), Many Labs 1: '36 independent samples totaling 6,344 participants'. Bảng 2, cả bốn câu mỏ neo (Babies Born d = 2.42, Mt. Everest 2.23, Chicago 1.79, Distance to NYC 1.17, có trọng số): tỉ lệ mẫu p < .05 đúng chiều = 1.00. 'heterogeneity of effect sizes was largely observed among the very large effects - anchoring, allowed-forbidden...'. Bystranowski et al. (2021), phân tích tổng hợp ở quyết định pháp lý: 29 nghiên cứu, N = 8.549, d = .58 (có nhóm đối chứng) và .91."
  ghi_chu: "Phần số liệu đúng: 36 mẫu, 6.344 người, bốn câu mỏ neo có hiệu ứng ở mọi mẫu (tỉ lệ 1.00), thuộc nhóm hiệu ứng lớn nhất (bốn câu mỏ neo chiếm bốn trong năm hiệu ứng lớn nhất). Many Labs 1 có kế hoạch đăng ký trước (osf.io/aBEsQ). Còn nhãn thì thấp hơn mức bằng chứng cho phép theo mục 4. Mỏ neo chuẩn (so với con số rồi ước lượng) đã có phân tích tổng hợp đã bình duyệt (Bystranowski và cộng sự 2021, Law and Human Behavior). Có thêm hai phân tích tổng hợp lớn ở dạng bản thảo: Röseler và cộng sự, k = 393, N = 17.708, g = 0,69; '50 Years of Anchoring Effects', 2.601 cỡ hiệu ứng, g = 0,83, vẫn lớn sau khi hiệu chỉnh thiên lệch xuất bản. Cộng thêm Many Labs 1 ở 36 mẫu nhiều nước, nên đạt điều kiện 'Vững chắc'. Lưu ý thêm vào hồ sơ: độ lớn dao động nhiều (I² khoảng 93%; Many Labs 1 thấy dị biệt lớn); các bản thảo phân tích tổng hợp thấy hiệu ứng yếu hơn hay bằng không với mỏ neo ngẫu nhiên, mỏ neo khác chiều đo, hay mỏ neo dưới ngưỡng ý thức (hai lần làm lại có đăng ký trước của mỏ neo dưới ngưỡng thất bại, JESP 2021). Các giới hạn này thuộc các biến thể, không thuộc hiệu ứng chuẩn mà câu nói tới. Đọc toàn văn Many Labs 1 (bản lưu ở LSE); hai bản thảo và Bystranowski chỉ đọc tóm tắt."
  cau_dung: "Vững chắc: con số neo làm dịch chuyển ước lượng; Many Labs (36 mẫu, 6.344 người): bốn câu mỏ neo có hiệu ứng ở mọi mẫu, thuộc nhóm hiệu ứng lớn nhất; các phân tích tổng hợp (ví dụ trong quyết định pháp lý, Bystranowski và cộng sự, 2021) cũng thấy hiệu ứng rõ, dù độ lớn khác nhau nhiều giữa các nghiên cứu."

- trang: trai-nghiem/neo-gia
  id: n9
  luot_2: dung
  nguon:
    - "https://web.archive.org/web/20250802160412/https://homepages.se.edu/cvonbergen/files/2013/01/Playing-Dice-With-Criminal-Sentences_The-Influence-of-Irrelevant-Anchors-on-Experts-Judicial-Decision-Making.pdf"
    - "https://pubmed.ncbi.nlm.nih.gov/16382081/"
    - "https://www.hf.uni-koeln.de/data/dppsenglich/File/PDFSStudien/LawPol28.pdf"
  trich: "Englich, Mussweiler & Strack (2006), Study 3: 'We again compared the present findings with those of the other study with identical materials but relevant anchors (Englich, 2006) ... sentencing decisions in both anchor conditions differed for anchors determined at random (M = 5.28 vs. M = 7.81) and suggested by the prosecutor (M = 4.10 vs. M = 6.98) ... F < 1 for the interaction. No matter whether the anchor was determined by throwing dice or suggested by the prosecutor did judges assimilate their sentencing decisions to it to a similar degree.' Bàn luận chung: 'irrelevant sentencing anchors produce effects that are comparable in magnitude to those of relevant sentencing anchors.'"
  ghi_chu: "Đọc toàn văn bài PSPB 2006 (32:188–200) qua bản lưu Wayback của bản PDF trên trang một giảng viên; bản này khớp tập và trang. Việc so sánh dựa trên một nghiên cứu khác dùng cùng hồ sơ (Englich, 2006, chưa công bố lúc ấy); Study 2 cũng có phép so sánh như vậy (F < 1 cho tương tác). Ghi thêm vào hồ sơ: bản thảo phân tích tổng hợp '50 Years of Anchoring Effects' (PsyArXiv, osf.io/teq7k) thấy mỏ neo từ số ngẫu nhiên nhìn chung có hiệu ứng nhỏ hơn hay bằng không. Câu của trang nói đúng về Englich và không khái quát rằng mọi số ngẫu nhiên đều có tác dụng như số liên quan, nên vẫn `dung`."

- trang: trai-nghiem/tri-nho-tu
  id: n5
  luot_2: dung
  nguon:
    - "https://www.cns.nyu.edu/malab/static/files/publications/2018%20Oberauer%20et%20al..pdf"
    - "https://europepmc.org/article/PMC/PMC12956956"
  trich: "Oberauer et al. (2018, Psychological Bulletin 144:885), Benchmark 7: 'This word-length effect is robust when word length is manipulated through the number of syllables ... has been observed consistently in various languages. Given its restriction to the verbal domain, the rating proposed by the Benchmarks Team is a B.' Guitard, Neath & Surprenant (Memory & Cognition, online 2025): 'Experiment 2 found that when the short and long words were more fully equated, including being equated for orthographic and phonological neighborhood size, the word-length effect disappeared.'"
  ghi_chu: "Nhãn 'Khá vững' hợp thước đo. Hiệu ứng theo số âm tiết ổn định và có ở nhiều ngôn ngữ (Oberauer, một tổng quan đồng thuận, không phải phân tích tổng hợp). Chưa tìm thấy phân tích tổng hợp hay tái lập lớn có đăng ký trước cho riêng hiệu ứng này. Các nghiên cứu cân bằng kỹ hơn (Jalbert 2011; Guitard 2025) cho thấy hiệu ứng có thể do yếu tố đi kèm. Nên sửa nhẹ câu chữ: Oberauer không viết rằng 'cách giải thích còn tranh cãi'; ý ấy có căn cứ ở Guitard và cộng sự (2025, phần tổng quan về mô hình chuẩn và các kết quả không lặp lại). Nên tách thành hai câu để khỏi hiểu là Oberauer nói. Bài Guitard đăng trực tuyến năm 2025, in trong số năm 2026."

- trang: trai-nghiem/tri-nho-tu
  id: n6
  luot_2: dung
  nguon:
    - "https://europepmc.org/article/PMC/PMC12956956"
    - "http://psychclassics.yorku.ca/Miller/"
  trich: "Guitard, Neath & Surprenant: 'The results are as predicted by the lexical/long-term memory factors account. On this view, the word-length effect seen in Experiment 1 was due to confounding variables'; 'short words tend to have more orthographic and phonological neighbors than long words'; 'The results provide more evidence against the standard account' (giải thích bằng thời gian phát âm và nhẩm lại). Miller (1956): 'By organizing the stimulus input ... successively into a sequence of chunks, we manage to break (or at least stretch) this informational bottleneck.'"
  ghi_chu: "'Thời gian đọc' trong câu hiểu là thời gian phát âm hay nhẩm lại (articulation, rehearsal), tức mô hình chuẩn mà Guitard phản bác. Chữ 'có thể' giữ đúng mức thận trọng của bài: kết quả chỉ ở bài nhận diện thứ tự (serial recognition), và tác giả tự nêu là còn những chiều chưa cân bằng."

- trang: trai-nghiem/tri-nho-tu
  id: n11
  luot_2: dung
  nguon:
    - "http://psychclassics.yorku.ca/Miller/"
  trich: "Miller (1956): 'The point is that recoding is an extremely powerful weapon for increasing the amount of information that we can deal with'; 'the number of chunks of information is constant for immediate memory.'"
  ghi_chu: "Phần dẫn Miller đúng: gom thành cụm (mã hóa lại) giúp giữ được nhiều thông tin hơn. Phần 'công cụ chưa chuẩn hóa, một lần làm' là câu về chính công cụ của site, hợp lý; không cần nguồn ngoài."

- trang: trai-nghiem/linda
  id: n11
  luot_2: sai
  nguon:
    - "https://www.csc2.ncsu.edu/faculty/mpsingh/local/Social/f24/wrap/readings/Gigerenzer-on-Kahneman+Tversky-1991.pdf"
    - "https://open.lnu.se/index.php/metapsychology/article/view/2474"
    - "https://pages.ucsd.edu/~scoulson/203/gigerenzer1.pdf"
  trich: "Gigerenzer (1991, European Review of Social Psychology 2:83), tóm tắt: 'Most so-called \"errors\" in probabilistic reasoning are in fact not violations of probability theory. Examples ... conjunction fallacy ... have ignored conceptual distinctions—for example, single case versus relative frequency.' Chandrashekar et al. (2021, Meta-Psychology): 'Hertwig and colleagues ... argued that conjunction effect is not at all a fallacy ... the effect arises out of semantic ambiguity, in that participants' understanding of natural language words such as \"probability\" and \"and\" diverged from that of experimenters (e.g., Hertwig & Gigerenzer, 1999).' Hertwig & Gigerenzer (1999, JBDM 12:275, tr. 296): 'several researchers (e.g. Adler, 1984, 1991; Dulany and Hilton, 1991; Politzer and Noveck, 1991) argued that participants interpret the hypothesis \"Linda is a bank teller\" to mean \"Linda is a bank teller and is not active in the feminist movement\"'."
  ghi_chu: "Phần Gigerenzer đúng (đã đọc chính bài 1991). Phần Hertwig về 'xác suất' và 'và' đúng theo Chandrashekar 2021 và theo chính bài Hertwig & Gigerenzer 1999. Chỗ sai là ví dụ trong ngoặc. Cách hiểu 'nhân viên ngân hàng' thành 'nhân viên ngân hàng và không hoạt động nữ quyền' (hàm ý hội thoại) không phải lập luận về nghĩa của 'xác suất' hay 'và'. Nó cũng không phải của Hertwig: Hertwig & Gigerenzer 1999 ghi là của Adler, Dulany & Hilton, Politzer & Noveck, và viết rằng các dự đoán theo giả thuyết ấy (Agnoli & Krantz 1989) 'None ... have been corroborated'. Ngoài ra, viết 'hiểu (A) thành \"không phải nhà hoạt động nữ quyền\"' là thiếu vế 'nhân viên ngân hàng và'. Nhãn 'Đang tranh cãi' cho câu hỏi vì sao ta mắc bẫy thì hợp. Ghi thêm: lần làm lại có đăng ký trước của Chandrashekar 2021 (N = 1.032) 'found no support for semantic ambiguity'. Không mở được bài Gigerenzer 1996 và Kahneman & Tversky 1996, không cần cho câu này."
  cau_dung: 'Đang tranh cãi: vì sao ta mắc bẫy; Gigerenzer phản biện rằng nhiều "lỗi" không vi phạm lý thuyết xác suất nếu phân biệt xác suất một trường hợp với tần suất; Hertwig và cộng sự (theo Chandrashekar và cộng sự, 2021) cho rằng người trả lời có thể hiểu từ "xác suất" và chữ "và" khác nghĩa toán học; một số tác giả khác (theo Hertwig và Gigerenzer, 1999) cho rằng người ta hiểu (A) thành "nhân viên ngân hàng và không hoạt động nữ quyền".'

- trang: trai-nghiem/linda
  id: n12
  luot_2: dung
  nguon:
    - "https://cdn2.psychologytoday.com/assets/model_of_heuristic_judgment.pdf"
    - "https://www.nobelprize.org/uploads/2018/06/kahnemann-lecture.pdf"
  trich: "Kahneman & Frederick (2005, 'A Model of Heuristic Judgment', bản cập nhật của chương 2002): 'When confronted with a difficult question, people may answer an easier one instead and are often unaware of the substitution.' Bài giảng Nobel của Kahneman (2002): 'people who are confronted with a difficult question sometimes answer an easier one instead ... the judge is normally unaware of the substitution.'"
  ghi_chu: "Nội dung đúng với định nghĩa của chính tác giả. Không mở được sách Thinking, Fast and Slow (2011) để đối chiếu chữ. Khái niệm do Kahneman & Frederick (2002) đặt tên; nếu trang chỉ dẫn Kahneman (2011) thì nên thêm Kahneman & Frederick (2002) làm nguồn gốc. Bài gốc viết 'may' hay 'sometimes'; chữ 'thường' của trang hơi mạnh hơn nhưng vẫn chấp nhận được (cùng câu ấy viết 'often unaware'). Phần 'cả câu hỏi 3' là chuyện của site."

- trang: trai-nghiem/big-five-mini
  id: n8
  luot_2: dung
  nguon:
    - "https://ipip.ori.org/New_IPIP-50-item-scale.htm"
  trich: "IPIP, 'Administering IPIP Measures, with a 50-item Sample Questionnaire': 'The theory behind distributing items from different scales throughout an inventory and alternating between +keyed and -keyed items is that this encourages respondents to pay close attention to the content of items and therefore increases the probability of valid responding.'"
  ghi_chu: "Đúng như câu viết. Cùng trang nói rõ đây là gợi ý, không bắt buộc ('These are suggestions, not requirements'; 'is not an absolute necessity')."

- trang: trai-nghiem/wason-246
  id: n14
  luot_2: dung
  nguon:
    - "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=Wason%20AND%20Vietnam&format=json"
    - "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=%22rule%20discovery%22%20AND%20(Vietnam%20OR%20Vietnamese)&format=json"
    - "https://api.crossref.org/works?query.bibliographic=Wason+2-4-6+task+Vietnamese&rows=8"
    - "https://api.crossref.org/works?query.bibliographic=nhi%E1%BB%87m+v%E1%BB%A5+2-4-6+Wason&rows=8"
  trich: "Không có kết quả liên quan. Europe PMC: 'Wason AND Vietnam' 21 kết quả, '\"rule discovery\" AND (Vietnam OR Vietnamese)' 5 kết quả, '\"confirmation bias\" AND Vietnamese AND (hypothesis testing)' 28 kết quả; không bài nào dùng nhiệm vụ 2–4–6. Crossref ('Wason 2-4-6 task Vietnamese', 'rule discovery task 2-4-6 Vietnam', 'confirmation bias hypothesis testing Vietnamese students Wason', 'nhiệm vụ 2-4-6 Wason', 'thiên kiến xác nhận Wason'): không bài nào dùng nhiệm vụ 2–4–6 trên người Việt."
  ghi_chu: "Tìm ngày 17/11/2026. Europe PMC và Crossref tìm được bằng tiếng Anh và tiếng Việt. Web (tiếng Anh và tiếng Việt) chỉ ra các nghiên cứu ở Ý, Nhật và một khảo sát bằng bảng hỏi về thiên kiến nhận thức ở sinh viên Việt Nam (Tạp chí Xã hội học và Tâm lý học, 2025), không phải nhiệm vụ 2–4–6. OpenAlex không dùng được: hết ngân sách miễn phí của địa chỉ IP, trả HTTP 429. Google Scholar chặn truy vấn tự động (trả 302). Vì vậy chưa tìm được ở hai nơi này; nên tìm lại ở OpenAlex hay Google Scholar trước khi khóa. Kết quả hiện có khớp với câu 'chưa tìm thấy'. Câu có mốc thời gian, nên cần `het_han`."
