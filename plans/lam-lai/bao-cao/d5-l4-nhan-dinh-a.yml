- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n1
  cau: "Mô tả (description): sự phù hợp qua thí nghiệm Asch (1951, 1956; chi tiết ở trang riêng) và phân tích tổng hợp Bond & Smith (1996) về khác biệt văn hóa."
  loai: lich-su
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n2
  cau: '"Hầu hết chúng ta đã từng ở trong tình huống này, và không ít lần chọn phương án thứ hai" (tình huống ăn cùng nhóm bảy người).'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n3
  cau: Khi làm một mình, người ta sai chưa tới 1% số lần (khoảng 0,7% theo trang nhà Asch).
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n4
  cau: Khi cả nhóm cố tình trả lời sai, khoảng 37% số câu trả lời của người tham gia thật cũng sai theo.
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n5
  cau: Khoảng ba phần tư số người tham gia làm theo số đông ít nhất một lần.
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n6
  cau: "Sự phù hợp (conformity): ta thay đổi hành vi của mình cho khớp với nhóm, kể cả khi mình không đồng ý với nhóm."
  loai: dinh-nghia
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n7
  cau: "Có hai động cơ khác nhau: làm theo vì tin nhóm biết điều mình không biết (ảnh hưởng thông tin), và làm theo vì không muốn lạc lõng (ảnh hưởng chuẩn mực)."
  loai: dinh-nghia
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n8
  cau: Thí nghiệm Asch dùng bài toán mà đáp án rất rõ, để xem nhóm có làm lệch được phán đoán ấy không.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n9
  cau: Trong thí nghiệm kinh điển của Asch, người tham gia so sánh độ dài đường thẳng trước một nhóm "chim mồi" đồng loạt nói sai.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n11
  cau: Bond và Smith (1996) gộp 133 nghiên cứu dùng kiểu bài đo phán đoán đường thẳng theo Asch (cả bản Asch lẫn bản Crutchfield), ở 17 quốc gia.
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n12
  cau: Ở Mỹ, mức phù hợp trong bài đo này thấp dần kể từ những năm 1950.
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n13
  cau: Các nước "cộng đồng" có mức phù hợp cao hơn các nước "cá nhân"; mối liên hệ thấy ở cả ba cách đo văn hóa.
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n14
  cau: Ngoài văn hóa, quy mô nhóm cũng có liên hệ với mức phù hợp (Bond và Smith).
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n15
  cau: "Khung Vững chắc: một nhóm nhất trí có thể làm lệch phán đoán công khai, kể cả với bài toán rõ ràng."
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n16
  cau: Khi một người cùng phòng nói đúng, áp lực của nhóm sụt mạnh (Asch).
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n17
  cau: "Khung Khá vững: văn hóa tập thể hùa theo nhiều hơn văn hóa cá nhân; tương quan cấp quốc gia, không phải thí nghiệm ngẫu nhiên."
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n18
  cau: Bond và Smith nêu lại phê bình rằng cách chia "cộng đồng / cá nhân" có thể che khuất những khác biệt quan trọng giữa các nền văn hóa, dù họ cho rằng nó vẫn nắm được một khác biệt quan trọng về mức phù hợp.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n19
  cau: "Ảnh hưởng chuẩn mực: làm theo để được chấp nhận, tránh bị chê cười hay lạc lõng."
  loai: dinh-nghia
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n20
  cau: Một số người tham gia của Asch kể rằng họ biết nhóm sai nhưng không muốn trông khác người nên vẫn nói theo.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n21
  cau: "Ảnh hưởng thông tin: làm theo vì tin rằng nhóm biết điều mình không biết."
  loai: dinh-nghia
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n22
  cau: Trong thí nghiệm Asch, nhiều người hay làm theo nghi ngờ mắt mình và kết luận "chắc mình sai, họ đúng".
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n23
  cau: Mức làm theo cao hơn khi bài toán mơ hồ hơn (các nghiên cứu ở Mỹ), điều mà ảnh hưởng thông tin có thể giải thích.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n24
  cau: Theo Deutsch và Gerard (1955), hai kiểu ảnh hưởng thường xuất hiện cùng nhau.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n25
  cau: 'Ví dụ giả định: trong phòng họp, bạn có thể vừa sợ bị coi là "khó chịu" (chuẩn mực), vừa nghĩ "hay là mình chưa hiểu hết vấn đề" (thông tin).'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n26
  cau: "Gợi ý cho người điều hành họp: đừng nêu ý kiến trước rồi hỏi mọi người; để mọi người viết ý kiến riêng trước khi thảo luận (rút từ một biến thể của Asch, chưa kiểm trực tiếp trong cuộc họp)."
  loai: loi-khuyen
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n27
  cau: Hàng nghìn đánh giá có sẵn là một dạng "ý kiến của số đông" bạn thấy trước khi tự đánh giá (phép loại suy với Asch, không phải kết quả của thí nghiệm); đọc thêm vài đánh giá thấp điểm cho góc nhìn khác.
  loai: loi-khuyen
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n28
  cau: Trong biến thể của Asch, chỉ cần một người cùng phòng nói đúng là người tham gia hùa theo ít hơn nhiều.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n29
  cau: Thí nghiệm Asch dùng nam sinh viên đại học, trong phòng thí nghiệm, với bài toán so sánh đường thẳng.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n30
  cau: Khi bài toán mơ hồ hơn, mức làm theo cao hơn (Bond và Smith, các nghiên cứu ở Mỹ).
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n31
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào lặp lại thí nghiệm Asch với người Việt.
  loai: thoi-su
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n32
  cau: Việt Nam không nằm trong số các nước của phân tích Bond và Smith.
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n33
  cau: Nếu Việt Nam thuộc nhóm văn hóa "cộng đồng", theo mối liên hệ ấy có thể dự đoán mức phù hợp cao hơn mức trung bình của Mỹ; đó là suy luận từ tương quan cấp quốc gia, không phải bằng chứng về người Việt.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n34
  cau: Văn hóa của một nước không đồng nhất, nên con số thật cho người Việt vẫn là một dấu hỏi.
  loai: loi-khuyen
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n35
  cau: 'Ngộ nhận "Tôi là người độc lập…": khoảng 3/4 số người trong thí nghiệm Asch đã làm theo số đông ít nhất một lần.'
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n36
  cau: 'Ngộ nhận "Số đông luôn đúng": trong thí nghiệm, số đông cố tình nói sai, còn đáp án đúng thì hiển nhiên.'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n37
  cau: 'Ngộ nhận "Người ta làm theo số đông vì họ thật sự đổi ý": theo phỏng vấn của Asch, rất ít người thật sự nhìn thấy như nhóm; nhiều người vẫn thấy khác nhóm nhưng tự kết luận mắt mình sai; một số biết nhóm sai mà vẫn nói theo.'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n38
  cau: 'Nhãn của ngộ nhận trên: Đang tranh cãi (người hùa theo có thật sự "nhìn" khác đi không).'
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n41
  cau: "Quiz 1: nhóm đối chứng sai dưới 1% nên khoảng 37% lượt trả lời sai trong nhóm thí nghiệm là do áp lực số đông, không phải do bài khó."
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n42
  cau: "Quiz 2: yếu tố làm giảm sự phù hợp mạnh nhất là có một người trong nhóm phá vỡ sự nhất trí bằng câu trả lời đúng; giảm số diễn viên từ bảy xuống ba không phải yếu tố ấy; sự nhất trí quan trọng hơn quy mô."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n43
  cau: "Quiz 3: Bond và Smith thấy mức phù hợp ở Mỹ giảm kể từ những năm 1950; đây là phát hiện thú vị: hiệu ứng Asch không phải hằng số bất biến mà thay đổi theo thời đại."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n44
  cau: 'Quiz 4: mối liên hệ "văn hóa cộng đồng → phù hợp cao hơn" chỉ được gắn nhãn Khá vững vì là tương quan cấp quốc gia, không chứng minh văn hóa gây ra phù hợp; thấy ở cả ba cách đo, nhưng B&S nêu lại phê bình cách chia cộng đồng/cá nhân.'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
  id: n45
  cau: 'Quiz 5: viết ý kiến của mình ra trước khi nghe nhóm giúp có một "bản ghi" của riêng bạn; gợi ý rút từ biến thể trả lời bằng văn bản của Asch (mẫu nhỏ), chưa kiểm trực tiếp trong cuộc họp.'
  loai: loi-khuyen
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n1
  cau: 'Mô tả (description): thí nghiệm 1 đô-la / 20 đô-la của Festinger và Carlsmith (1959), lý thuyết bất hòa nhận thức, và những cách ta tự "chữa cháy" cho quyết định của mình.'
  loai: lich-su
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n2
  cau: "Theo lý thuyết bất hòa nhận thức, khi hành động mâu thuẫn với điều ta nghĩ, ta có thể đổi cách nghĩ thay vì đổi hành động (Tự trải nghiệm: mua đồ đắt tiền, xếp hàng mua trà sữa)."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n3
  cau: Năm 1959, hai nhà nghiên cứu cho sinh viên làm một việc chán ngắt rồi trả tiền để họ nói dối người khác rằng "việc đó thú vị lắm".
  loai: lich-su
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n4
  cau: Nhóm được trả 1 đô-la về sau đánh giá công việc thú vị hơn nhóm được trả 20 đô-la, chênh lệch có ý nghĩa thống kê.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n5
  cau: "Festinger (1957) đề xuất lý thuyết bất hòa nhận thức: ta có nhu cầu giữ cho niềm tin, thái độ và hành vi nhất quán; khi chúng mâu thuẫn ta thấy khó chịu và tìm cách chỉnh lại."
  loai: dinh-nghia
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n6
  cau: Khi hành vi đã xảy ra, ta không đổi được nó; ta còn có thể đổi cách nghĩ ("thật ra việc đó cũng thú vị mà").
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n7
  cau: "Thí nghiệm: 71 sinh viên nam lớp nhập môn tâm lý học ở Stanford; 11 người bị loại, còn 60 người (20 người mỗi nhóm)."
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n8
  cau: "Công việc kéo dài khoảng một giờ: nửa giờ xếp 12 chiếc suốt chỉ lên khay, đổ ra rồi xếp lại; nửa giờ sau xoay từng chốt vuông trên tấm bảng, mỗi lần một phần tư vòng."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n9
  cau: Nhóm đối chứng (không phải nói dối ai) chấm công việc −0,45 trên thang từ −5 (cực chán) đến +5 (cực thích), tức hơi nghiêng về phía chán.
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n10
  cau: Người nghiên cứu "nhờ" sinh viên nói với người tham gia tiếp theo (thật ra người của nhóm nghiên cứu) rằng công việc rất thú vị; một nhóm được trả 20 đô-la, nhóm kia 1 đô-la.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n11
  cau: Theo lý thuyết, 20 đô-la là lý do đủ lớn để biện minh cho lời nói dối, còn 1 đô-la thì chưa.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n12
  cau: "Điểm đánh giá: nhóm 20 đô-la −0,05 (gần mức trung lập); nhóm 1 đô-la +1,35 (nghiêng về phía thú vị); đối chứng −0,45."
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n13
  cau: "Hình festinger-diverging: ba cột 1 đô-la +1,35, 20 đô-la −0,05, đối chứng −0,45, thang −5 đến +5."
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n14
  cau: "Lý giải của Festinger: nhóm 20 đô-la có lý do chính đáng nên không có gì lạc điệu; nhóm 1 đô-la thì không đủ biện minh, nên chỉnh lại niềm tin; thái độ thật của họ nhích về phía điều đã nói."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n15
  cau: "Khung Đang tranh cãi: phần thưởng nhỏ có làm thái độ đổi nhiều hơn phần thưởng lớn? (mẫu nhỏ, một bối cảnh; đợt tái lập 39 phòng thí nghiệm, 19 nước, 4.898 người không thấy dự đoán cốt lõi của mô hình tuân thủ bị ép buộc)."
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n16
  cau: "Đợt tái lập 2024: 39 phòng thí nghiệm ở 19 nước, N = 4.898; viết bài trái quan điểm khi tự chọn không làm thái độ đổi nhiều hơn khi bị chỉ định; đợt này không dùng tiền thưởng; đặt dấu hỏi cho mô hình tuân thủ bị ép buộc."
  loai: tai-lap
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n17
  cau: "Khung Khá vững: con người có xu hướng giảm mâu thuẫn giữa niềm tin và hành vi (nhiều mô hình; người viết bài trái quan điểm thuận hơn người viết bài trung tính; chưa có tổng hợp chung; mẫu nhỏ, hạn chế phương pháp; mô hình tuân thủ bị ép buộc không tái lập ở phần quan trọng nhất)."
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n18
  cau: "Lý thuyết bất hòa đã được áp dụng cho nhiều tình huống: niềm tin bị phản bác, biện minh cho nỗ lực, đạo đức giả, ra quyết định."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n19
  cau: "Sau đợt tái lập 2024: người viết bài trái quan điểm có thái độ thuận hơn người viết bài trung tính, dù quyền chọn không tạo khác biệt."
  loai: tai-lap
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n20
  cau: Nhiều nghiên cứu kinh điển về bất hòa có mẫu nhỏ và hạn chế về phương pháp (bài phản hồi của nhóm Vaidis).
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n21
  cau: "Bem (1967): lý thuyết tự tri giác giải thích lại các hiện tượng bất hòa mà không cần giả định một động lực khó chịu về nhất quán."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n22
  cau: Hai lý thuyết có thể giải thích cùng một kết quả, và tranh luận về cơ chế đã kéo dài nhiều thập kỷ; trong đợt tái lập 2024 nhóm trái quan điểm báo cáo khó chịu và xung đột nhiều hơn nhóm trung bình, điều khó hòa với tự tri giác thuần túy, nhưng chưa loại được cách giải thích "tự thuyết phục".
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n23
  cau: 'Khung Đang tranh cãi: bất hòa có thật sự là "cảm giác khó chịu" không?'
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n24
  cau: Ta có thể thoát bất hòa bằng cách đổi hành vi, đổi niềm tin, thêm niềm tin mới, hoặc coi nhẹ mâu thuẫn; đổi niềm tin là điều nhóm 1 đô-la đã làm theo cách giải thích của Festinger và Carlsmith.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n25
  cau: Cả bốn lối đều có thể làm ta dễ chịu hơn, nhưng chỉ lối đầu tiên thay đổi điều ta đã làm; đó có thể là một lý do ta khó đổi ý sau khi đã chọn (diễn giải theo lý thuyết).
  loai: loi-khuyen
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n26
  cau: 'Khi mua sắm: nếu bạn ra sức "bênh" món đồ vừa mua, hãy tự hỏi mình khen vì nó tốt hay vì mình đã trả tiền (gợi ý suy ra từ lý thuyết, chưa kiểm trực tiếp).'
  loai: loi-khuyen
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n27
  cau: 'Trong tranh luận: người càng bị dồn càng cố thủ có thể đang giảm cảm giác "mình đã sai"; một gợi ý suy ra từ lý thuyết (chưa kiểm trực tiếp): cho họ lối thoát giữ thể diện.'
  loai: loi-khuyen
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n28
  cau: "Với chính mình: nhận ra cơ chế này không giúp ta hết bị bất hòa; nó giúp phân biệt lý do thật với lý do ta bịa ra để tự an ủi."
  loai: loi-khuyen
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n29
  cau: Theo lý thuyết, bất hòa chỉ xuất hiện khi hành vi mâu thuẫn với điều quan trọng với hình ảnh bản thân; mô hình tuân thủ bị ép buộc dựa vào cảm giác được tự chọn; nhưng đợt tái lập 2024 không thấy quyền chọn tạo khác biệt.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n30
  cau: Thí nghiệm gốc dùng sinh viên Stanford năm 1959.
  loai: lich-su
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n31
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào lặp lại đúng mô hình này (tuân thủ bị ép buộc) với người Việt.
  loai: thoi-su
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n32
  cau: 'Ví dụ giả định: người đã theo một "thầy" chữa bệnh có thể khó thừa nhận phương pháp đó không hiệu quả vì thừa nhận là nhìn nhận một lựa chọn tốn kém là sai lầm; nếu văn hóa coi trọng "giữ thể diện", lối thoát số 3 và 4 có thể dễ được chọn hơn (suy luận từ lý thuyết).'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n33
  cau: 'Ngộ nhận "Thưởng càng nhiều thì càng đổi thái độ": thí nghiệm gốc thấy nhóm 20 đô-la không đổi thái độ, nhóm 1 đô-la có; theo lý thuyết, phần thưởng lớn là lý do để không cần đổi thái độ.'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n34
  cau: 'Ngộ nhận "Tôi luôn nhìn nhận quyết định của mình khách quan": nhiều nghiên cứu cho thấy thái độ có thể dịch về phía điều ta đã làm, nên ta không phải lúc nào cũng khách quan.'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n35
  cau: 'Nhãn của ngộ nhận trên: Đã bị bác bỏ ("luôn khách quan" là khẳng định tuyệt đối đã bị bác).'
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n36
  cau: 'Ngộ nhận "Người cố chấp là người thiếu thông minh": ở thiên kiến "bênh phía mình", người có năng lực nhận thức cao không ít thiên kiến hơn (Stanovich và West, 2008); theo lý thuyết bất hòa điều bị đe dọa là hình ảnh bản thân.'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n39
  cau: "Quiz 1: nhóm 1 đô-la chấm +1,35, cao hơn nhóm 20 đô-la (−0,05; p < 0,03) và đối chứng (−0,45)."
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n40
  cau: "Quiz 2: theo giải thích của Festinger và Carlsmith, 20 đô-la là lý do đủ lớn để biện minh cho lời nói dối nên không có mâu thuẫn nào cần giải quyết."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n41
  cau: "Quiz 3: theo lý thuyết, bất hòa mạnh hơn khi hành vi tự chọn và vấn đề quan trọng với hình ảnh bản thân; đợt tái lập 2024 không thấy quyền chọn tạo khác biệt."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n42
  cau: 'Quiz 4: xe đã mua không trả lại được nên theo lý thuyết ta có thể "làm đẹp" cho lựa chọn để giảm khó chịu; lời khen lúc này chưa chắc khách quan.'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
  id: n43
  cau: "Quiz 5: Bem (1967) cho rằng không cần cảm giác khó chịu: ta quan sát hành vi của mình rồi suy ra thái độ; hai lý thuyết giải thích cùng kết quả bằng hai cơ chế; cơ chế được gắn nhãn Đang tranh cãi."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n1
  cau: "Mô tả (description): mô hình ELM của Petty và Cacioppo (1986) cho thấy quảng cáo tác động qua hai đường — trung tâm (lập luận) và ngoại vi (người nổi tiếng, cảm xúc, số lượng lập luận) — tùy việc ta có suy nghĩ kỹ hay không."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n2
  cau: Con đường ta đi không do quảng cáo quyết định một mình mà phụ thuộc vào việc ta có muốn (động lực) và có thể (khả năng) suy nghĩ kỹ hay không.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n3
  cau: "ELM: khả năng xử lý sâu một thông điệp phụ thuộc vào động lực (vấn đề có liên quan đến ta không) và khả năng (thời gian, kiến thức, sự tập trung); từ đó có hai đường thuyết phục."
  loai: dinh-nghia
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n4
  cau: "Đường trung tâm: khi động lực và khả năng đều cao, ta xem xét cẩn thận lập luận; lập luận mạnh hay yếu có ảnh hưởng rõ rệt đến việc thuyết phục."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n5
  cau: "Đường ngoại vi: khi động lực hoặc khả năng thấp, ta dựa vào dấu hiệu ngoại vi: người nói nổi tiếng hay đáng tin, cảm xúc dễ chịu, số lượng lập luận, nhạc nền dễ chịu."
  loai: dinh-nghia
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n6
  cau: "Postulate 7: thái độ hình thành qua đường trung tâm bền hơn, khó lung lay hơn trước phản biện, dự đoán hành vi tốt hơn."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n7
  cau: "Hình elm-routes: sơ đồ ước lệ (động lực và khả năng cao → đường trung tâm → thái độ bền vững, khó lung lay; thấp → đường ngoại vi → thái độ mong manh, dễ đổi)."
  loai: dinh-nghia
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n8
  cau: ELM được Petty và Cacioppo đề xuất lần đầu trong cuốn Attitudes and Persuasion (1981), rồi trình bày đầy đủ trong bài tổng quan Advances in Experimental Social Psychology tập 19, tr. 123–205 (1986), và trong sách Communication and Persuasion (Springer, 1986).
  loai: lich-su
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n9
  cau: "Điểm cốt lõi của bài 1986: cùng một biến số (ví dụ uy tín nguồn tin) có thể tác động qua đường trung tâm hoặc ngoại vi tùy mức xử lý."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n10
  cau: "Petty, Cacioppo và Goldman (1981): sinh viên nghe bài phát biểu ủng hộ kỳ thi tổng hợp cuối khóa; liên quan cá nhân (áp dụng từ năm sau tại chính trường họ, hoặc sau 10 năm khi họ đã ra trường); 8 lập luận mạnh hoặc 8 yếu; nguồn là báo cáo của ủy ban do giáo sư Princeton chủ trì hoặc của một lớp trung học địa phương."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n11
  cau: "Kết quả 1981: ở nhóm liên quan cao, lập luận mạnh thuyết phục hơn yếu và nguồn tin không tạo khác biệt có ý nghĩa; ở nhóm liên quan thấp, uy tín nguồn tin có tác dụng còn lập luận mạnh hay yếu không tạo khác biệt có ý nghĩa."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n12
  cau: 'Petty, Cacioppo và Schumann (1983): quảng cáo tạp chí cho dao cạo dùng một lần hư cấu ("Edge"); lập luận mạnh/yếu × người chứng thực (vận động viên nổi tiếng/người dân thường) × mức quan tâm (cao/thấp).'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n13
  cau: "Kết quả 1983: người quan tâm cao chỉ bị thuyết phục bởi lập luận mạnh, bất kể ai chứng thực; người quan tâm thấp: người nổi tiếng làm thái độ tốt lên rõ rệt, còn lập luận mạnh hay yếu vẫn có ảnh hưởng nhưng nhỏ hơn nhiều."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n14
  cau: "Petty và Cacioppo (1984): khi quan tâm thấp, số lượng lập luận ảnh hưởng đến sự thuyết phục bất kể chất lượng; khi quan tâm cao, chỉ chất lượng có tác dụng."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n15
  cau: Theo cách giải thích của Petty và Cacioppo, ở nhóm quan tâm thấp, "số lượng" lập luận hoạt động như một dấu hiệu đơn giản dẫn đến chấp nhận.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n16
  cau: "Trong thí nghiệm 1984, nhóm quan tâm thấp: trung bình thái độ với 9 lập luận yếu là 7,71, với 3 lập luận mạnh là 4,95 (so sánh không được kiểm định riêng)."
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n17
  cau: 'Lập luận "12 lợi ích vượt trội" trong quảng cáo: hãy đếm xem có bao nhiêu lợi ích thực sự khác nhau.'
  loai: loi-khuyen
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n18
  cau: "Khung Khá vững: hai đường thuyết phục và vai trò của mức độ liên quan cá nhân (tổng hợp k = 134 nhất quán với dự đoán; phần dấu hiệu ngoại vi dựa vào từng thí nghiệm; Johnson & Eagly 1989: kết quả phụ thuộc loại liên quan; mẫu sinh viên Mỹ)."
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n19
  cau: "Dự đoán cốt lõi: chất lượng lập luận có ảnh hưởng mạnh hơn khi người nhận xử lý kỹ, nhìn chung nhất quán trong một phân tích tổng hợp (k = 134; Carpenter, 2015)."
  loai: tai-lap
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n20
  cau: 'Johnson và Eagly (1989): kết quả của "liên quan" phụ thuộc loại liên quan (giá trị, kết quả cá nhân, ấn tượng với người khác).'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n21
  cau: Các thí nghiệm gốc của ELM làm trên sinh viên Mỹ những năm 1980.
  loai: lich-su
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n22
  cau: 'Khung Khá vững: thái độ qua đường trung tâm bền hơn và dự đoán hành vi tốt hơn (Petty và Wegener 1999 nêu như một giả thuyết); "bền hơn" không có nghĩa là vĩnh viễn.'
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n23
  cau: "Khung Đang tranh cãi: hai đường có thực sự tách biệt? ELM mô tả hai đầu một đường liên tục; sự đánh đổi không nằm ở việc quá trình có xảy ra hay không mà ở mức tác động lên thái độ, nên hai quá trình có thể cùng chạy; Chaiken (1980) mô tả hai kiểu xử lý tương tự."
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n24
  cau: 'Nguyên tắc đa vai trò: cùng một biến số có thể là lập luận, dấu hiệu ngoại vi, hoặc làm tăng hay giảm mức xử lý; không biến số nào "mãi mãi là ngoại vi".'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n25
  cau: "Xử lý khách quan và thiên lệch: khi suy nghĩ kỹ ta có thể xử lý khách quan hoặc thiên lệch; người đã ghét một thương hiệu có thể soi quảng cáo kỹ hơn để tìm điểm chê (ví dụ giả định)."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n26
  cau: 'Mô hình heuristic-systematic (Chaiken, 1980): xử lý có hệ thống (gần đường trung tâm) và xử lý theo lối tắt (gần đường ngoại vi, dựa vào quy tắc đơn giản như "tôi đồng ý với người tôi quý").'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n27
  cau: 'Áp dụng 1: với món đắt tiền hay ảnh hưởng lâu dài hãy đi đường trung tâm; với món rẻ, mua nhanh theo cảm tính không phải là "dại" vì không phải thông điệp nào cũng đáng xử lý sâu; lời khuyên suy ra từ ELM, chưa kiểm trực tiếp. (nhãn Khá vững)'
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n28
  cau: "Áp dụng 2: theo ELM, thông điệp nhắm vào đường ngoại vi dựa vào dấu hiệu như người nổi tiếng, nhạc dễ chịu, số lượng lập luận; gợi ý (suy ra từ ELM): tăng động lực và khả năng xử lý — dừng lại, tìm nguồn gốc, hỏi lập luận và bằng chứng là gì."
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n29
  cau: "Áp dụng 3: khi bạn muốn thuyết phục: sếp đang cân nhắc kỹ thì đầu tư vào số liệu và lập luận chắc; khách lướt qua trong 3 giây thì thông điệp dễ nhớ, nguồn đáng tin; đi đường ngoại vi không phải giấy phép để lừa dối."
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n30
  cau: "Áp dụng 4: lời khuyên cảnh giác với danh sách dài (xem n16)."
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n31
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm chứng ELM trực tiếp (thao túng chất lượng lập luận và mức liên quan) trên người Việt.
  loai: thoi-su
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n32
  cau: "Ví dụ giả định: món rẻ → người mua có thể chọn theo người nổi tiếng chứng thực; quyết định lớn (mua nhà, chọn trường cho con) → hỏi kỹ, so sánh nhiều nguồn; suy luận từ ELM, chưa phải kết quả nghiên cứu trên người Việt."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n33
  cau: "Ngộ nhận: ELM không phán xét đạo đức; đường ngoại vi là lối tắt hợp lý khi thiếu thời gian, kiến thức hoặc vấn đề không đáng suy nghĩ nhiều; không ai có thể đi đường trung tâm cho mọi quyết định."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n34
  cau: 'Ngộ nhận "Quảng cáo chỉ dùng đường ngoại vi": một quảng cáo có thể đưa thông số chi tiết (đường trung tâm) hoặc dùng người nổi tiếng (ngoại vi); thí nghiệm 1983 thấy cả chất lượng lập luận lẫn người chứng thực có tác động, tùy mức quan tâm.'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n35
  cau: 'Ngộ nhận "Bị thuyết phục qua đường ngoại vi thì quyết định vô giá trị": theo ELM, thái độ qua đường ngoại vi kém bền, kém dự đoán hành vi và dễ đổi hơn, nhưng đó là mức độ chứ không phải vô giá trị.'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n36
  cau: 'Ngộ nhận "Cùng quảng cáo thì mọi người đi chung một đường": đường nào phụ thuộc vào động lực và khả năng của từng người xem; quảng cáo đầy số liệu vẫn có thể chỉ tác động qua dấu hiệu ngoại vi nếu người xem thiếu động lực hay khả năng xử lý (sự phân tâm là một yếu tố ELM nêu).'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n38
  cau: "Quiz 1: yếu tố quyết định sinh viên bị thuyết phục bởi chất lượng lập luận hay uy tín nguồn là mức độ liên quan cá nhân (cao: lập luận; thấp: uy tín nguồn)."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n39
  cau: "Quiz 2: với nhóm ít quan tâm, người chứng thực nổi tiếng làm thay đổi thái độ mà ở nhóm quan tâm cao thì không; chất lượng lập luận có tác dụng ở cả hai nhóm nhưng mạnh hơn nhiều ở nhóm cao."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n40
  cau: "Quiz 3: thái độ qua đường trung tâm bền hơn theo thời gian, khó bị lung lay hơn bởi lập luận phản biện, và dự đoán hành vi tốt hơn (theo ELM)."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n41
  cau: "Quiz 4: khi người nghe ít suy nghĩ kỹ, liệt kê nhiều lập luận càng thuyết phục, bất kể mạnh hay yếu."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
  id: n42
  cau: "Quiz 5: nguyên tắc đa vai trò: cùng một yếu tố có thể là dấu hiệu ngoại vi khi ta lười suy nghĩ, nhưng thành lập luận được cân nhắc khi ta suy nghĩ kỹ."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n1
  cau: "Mô tả (description): 5 mức biểu hiện định kiến của Allport (1954), giả thuyết tiếp xúc và phân tích tổng hợp 515 nghiên cứu của Pettigrew và Tropp (2006), tranh luận chưa ngã ngũ về thiên kiến ngầm và IAT."
  loai: lich-su
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n2
  cau: "Bertrand và Mullainathan (2004): gửi gần 5.000 hồ sơ giả tới tin tuyển dụng ở Boston và Chicago, tên gợi người da trắng hoặc người Mỹ gốc Phi được gán ngẫu nhiên; hồ sơ tên da trắng nhận nhiều hơn 50% lời mời phỏng vấn."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n3
  cau: Thí nghiệm thực địa làm từ tháng 7/2001 đến 1/2002 (Boston) và 5/2002 (Chicago); bài công bố năm 2004.
  loai: lich-su
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n4
  cau: Nghiên cứu cho thấy sự khác biệt trong đối xử, chứ không cho biết nhà tuyển dụng có ý thức về điều đó hay không.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n5
  cau: "Ba khái niệm: khuôn mẫu (niềm tin về nhóm), định kiến (thái độ và cảm xúc dành cho một người vì họ thuộc nhóm), phân biệt đối xử (hành vi đối xử bất công vì tư cách nhóm)."
  loai: dinh-nghia
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n6
  cau: "Theo thang tóm tắt thường gặp của Allport (1954), định kiến biểu hiện ở 5 mức: nói xấu, tránh né, phân biệt đối xử, tấn công thân thể, diệt chủng; nói xấu tự nó có thể không gây hại nhưng tạo đất cho mức nặng hơn."
  loai: lich-su
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n7
  cau: "Giả thuyết tiếp xúc của Allport: tiếp xúc giữa các nhóm giảm định kiến khi có bốn điều kiện: địa vị ngang nhau, mục tiêu chung, hợp tác giữa các nhóm, được thể chế, luật pháp hoặc phong tục ủng hộ."
  loai: lich-su
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n8
  cau: "Pettigrew và Tropp (2006): 713 mẫu độc lập từ 515 nghiên cứu về tiếp xúc liên nhóm, phân tích tổng hợp."
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n9
  cau: Tiếp xúc liên nhóm nhìn chung làm giảm định kiến; hiệu ứng có ý nghĩa, không do thiên lệch chọn người tham gia hay thiên lệch xuất bản; hiệu ứng lan ra cả nhóm ngoài.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n10
  cau: Khi bốn điều kiện của Allport được đáp ứng, hiệu ứng lớn hơn; nhưng các điều kiện không bắt buộc.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n11
  cau: "Khung Vững chắc: tiếp xúc liên nhóm thường làm giảm định kiến; hiệu ứng không do thiên lệch xuất bản; nghiên cứu chặt chẽ cho hiệu ứng lớn hơn; 27 thí nghiệm ngẫu nhiên sau đó cho cùng kết luận nhưng yếu hơn với định kiến chủng tộc, sắc tộc."
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n12
  cau: "Paluck và cộng sự (2019): 27 thí nghiệm ngẫu nhiên có đo kết quả sau một thời gian; thấy tiếp xúc nhìn chung giảm định kiến nhưng yếu hơn đáng kể với định kiến chủng tộc, sắc tộc; thiếu nghiên cứu về định kiến của người trưởng thành."
  loai: tai-lap
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n13
  cau: "Khung Khá vững: bốn điều kiện của Allport làm tiếp xúc hiệu quả hơn; bằng chứng chủ yếu đến từ so sánh giữa các nghiên cứu; chưa có thí nghiệm ngẫu nhiên nào thao túng có hệ thống bốn điều kiện."
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n14
  cau: "Paluck 2019: bốn điều kiện đặc biệt của Allport ít được ủng hộ thực nghiệm; chưa thí nghiệm ngẫu nhiên nào thao túng chúng có hệ thống."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n15
  cau: "Greenwald, McGhee và Schwartz (1998): IAT đo thời gian phản ứng khi ghép cặp các khái niệm (ví dụ da trắng–tốt, da đen–xấu so với ghép ngược lại); chênh lệch tốc độ được diễn giải là độ mạnh của liên tưởng."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n16
  cau: IAT được dùng rất rộng rãi (một trang web trình diễn thu hơn 600.000 lượt làm bài, 1998–2000) và gây nhiều tranh cãi.
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n17
  cau: "Oswald và cộng sự (2013): phân tích tổng hợp: tương quan trung bình giữa IAT và hành vi khoảng r = 0,14; với vi hành vi khoảng r = 0,07 (giải thích chưa tới 1%); IAT không dự đoán tốt hơn các biện pháp hỏi trực tiếp đơn giản; ít cho biết ai sẽ phân biệt đối xử với ai."
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n18
  cau: Greenwald và cộng sự (2009) từng đưa ra con số lạc quan hơn (r trung bình 0,236 cho Black–White), chủ yếu do dùng tiêu chí chọn nghiên cứu khác nhau.
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n19
  cau: "Greenwald, Banaji và Nosek (2015): hiệu ứng thống kê nhỏ vẫn có thể có hậu quả xã hội lớn vì ảnh hưởng nhiều người cùng lúc hoặc lặp lại với cùng một người."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n20
  cau: 'Khung Đang tranh cãi: IAT đo được gì và có nên dùng nó để "chẩn đoán" con người? Phê bình: thiếu ổn định qua vài tuần, phần lớn phương sai mang tính tình huống, dự đoán hành vi yếu; bênh vực: hiệu ứng nhỏ có thể lớn ở cấp xã hội.'
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n21
  cau: "Nosek và cộng sự (2002): người da đen làm bài thể hiện ưa thích nhẹ người da trắng hơn da đen trên IAT (d = 0,16), dù tự báo cáo ưu ái nhóm mình rõ rệt; ở bài dùng khuôn mặt, xu hướng đảo chiều."
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n22
  cau: Điểm IAT có thể phản ánh các đánh giá văn hóa mà người làm bài không tán thành (cách diễn giải của chính nhóm tác giả), chứ không hẳn là thái độ của cá nhân.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n23
  cau: 'Điểm đồng thuận giữa hai phe: không nên dùng điểm IAT của một cá nhân để kết luận người đó "có định kiến"; nhóm bênh vực IAT cảnh báo dùng thước đo này để chẩn đoán cá nhân có nguy cơ phân loại sai cao; IAT không phải công cụ chẩn đoán cá nhân.'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n24
  cau: "Phân loại xã hội: trong các thí nghiệm nhóm tối thiểu của Tajfel (1971), chỉ cần xếp người tham gia vào hai nhóm trên cơ sở rất tầm thường (được cho biết theo sở thích tranh Klee hay Kandinsky, thực tế xếp ngẫu nhiên), họ đã có xu hướng ưu ái nhóm mình."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n25
  cau: "Học tập xã hội: theo OpenStax, trẻ em học thái độ định kiến từ cha mẹ, thầy cô, bạn bè và truyền thông; định kiến duy trì nhờ học tập xã hội và sự tuân theo chuẩn mực xã hội."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n26
  cau: Các nhóm cảm thấy bị đe dọa hoặc cạnh tranh có thể nhìn nhóm ngoài tiêu cực hơn (một phân tích tổng hợp, 95 mẫu, 5 loại đe dọa liên hệ dương với thái độ tiêu cực với nhóm ngoài); mục tiêu chung buộc các nhóm hợp tác là một điều kiện của tiếp xúc giảm định kiến, như trong Robbers Cave.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n27
  cau: "Pettigrew (1998): bốn cơ chế trung gian của tiếp xúc: hiểu biết hơn về nhóm ngoài, thay đổi hành vi, gắn kết cảm xúc (tình bạn), đánh giá lại nhóm mình."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n28
  cau: Pettigrew (1998) coi tình bạn liên nhóm là con đường tiếp xúc đặc biệt mạnh vì kích hoạt cả bốn cơ chế; cảm xúc tích cực với một người có thể lan ra cả nhóm của họ.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n29
  cau: Tiếp xúc trong điều kiện không thuận lợi có thể làm tăng định kiến và căng thẳng giữa các nhóm (Amir, 1976, dẫn trong P&T 2006); một nghiên cứu ở Alabama thấy định kiến tăng khi cả bốn điều kiện đều bị vi phạm.
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n30
  cau: Điểm IAT của bạn không phải "bản chẩn đoán" con người bạn; đừng dùng nó để tự kết tội mình hay đánh giá người khác.
  loai: loi-khuyen
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n31
  cau: 'Một phân tích tổng hợp (Forscher và cộng sự, 2019): các quy trình làm đổi điểm đo ngầm thường chỉ đổi hành vi rất ít, và thay đổi ở điểm đo ngầm không giải thích thay đổi ở hành vi; điều đó gợi ý hiệu quả của các khóa "xóa thiên kiến vô thức" dựa trên IAT chưa có bằng chứng rõ ràng.'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n32
  cau: "Theo Pettigrew (1998), sự ủng hộ của cơ quan có thẩm quyền thiết lập chuẩn mực chấp nhận và làm tiếp xúc được đón nhận hơn; gợi ý suy ra: quy trình tuyển dụng công bằng và người có ảnh hưởng công khai lên án định kiến có thể giúp tiếp xúc liên nhóm dễ thành công (chưa kiểm trực tiếp)."
  loai: loi-khuyen
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n33
  cau: Phân tích tổng hợp của Pettigrew và Tropp bao gồm 38 quốc gia.
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n34
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm chứng giả thuyết tiếp xúc trực tiếp trên người Việt, và cũng chưa tìm thấy dữ liệu IAT trên mẫu Việt Nam.
  loai: thoi-su
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n35
  cau: 'Điều đó không có nghĩa Việt Nam "không có định kiến": bài này chỉ không có bằng chứng thực nghiệm về người Việt để dẫn; cần nghiên cứu có thiết kế (đo trước–sau, có nhóm đối chứng); Paluck và cộng sự (2019) chỉ ra khoảng trống lớn ở các nghiên cứu về định kiến của người trưởng thành.'
  loai: loi-khuyen
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n36
  cau: 'Ngộ nhận: "Có điểm IAT cao nghĩa là bạn phân biệt chủng tộc": điểm IAT của một cá nhân không đủ để kết luận; nhóm tác giả của Nosek và cộng sự (2002) nêu khả năng nó phản ánh các đánh giá văn hóa.'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n37
  cau: 'Ngộ nhận "Cứ tiếp xúc là hết định kiến": tiếp xúc trong điều kiện không thuận lợi có thể làm tăng định kiến (xem n29).'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n38
  cau: 'Ngộ nhận "Định kiến chỉ là chuyện của kẻ xấu tính": định kiến nảy sinh từ phân loại nhóm, chuẩn mực xã hội và cạnh tranh; người tử tế vẫn có thể mang định kiến.'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n39
  cau: 'Ngộ nhận "Giảm được định kiến trong đầu là tự khắc hết phân biệt đối xử": thái độ và hành vi không trùng khít; ở cấp cá nhân điểm IAT liên hệ yếu với hành vi, nhưng ở cấp tập thể (quốc gia, bang, hạt) mức thiên kiến ngầm trung bình liên hệ mạnh với mức chênh lệch và phân biệt đối xử.'
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n41
  cau: "Quiz 1: thứ tự thang 5 mức của Allport: nói xấu, tránh né, phân biệt đối xử, tấn công thân thể, diệt chủng."
  loai: lich-su
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n42
  cau: "Quiz 2: bốn điều kiện: địa vị ngang nhau, mục tiêu chung, hợp tác giữa các nhóm, được thể chế/luật pháp/phong tục ủng hộ; thiếu các điều kiện này tiếp xúc vẫn có thể có tác dụng, nhưng hiệu quả nhìn chung thấp hơn; trong điều kiện không thuận lợi có thể làm tăng định kiến."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n43
  cau: "Quiz 3: 713 mẫu độc lập từ 515 nghiên cứu, tiếp xúc giảm định kiến; hiệu ứng mạnh hơn khi bốn điều kiện được đáp ứng nhưng không bắt buộc; sau đó kiểm lại trên 27 thí nghiệm ngẫu nhiên (hiệu ứng yếu hơn với định kiến chủng tộc)."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n44
  cau: "Quiz 4: IAT đo tốc độ phản ứng khi ghép cặp các khái niệm, được diễn giải là độ mạnh của liên tưởng tự động."
  loai: phat-hien
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n45
  cau: "Quiz 5: IAT chỉ dự đoán hành vi ở mức yếu (khoảng r = 0,14; vi hành vi r = 0,07) và không tốt hơn các biện pháp hỏi trực tiếp; phe bênh vực cho rằng hiệu ứng nhỏ ở cấp cá nhân có thể tạo hậu quả lớn ở cấp xã hội."
  loai: so-lieu
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n49
  cau: "Áp dụng 1: tạo tiếp xúc có chất lượng (bình đẳng, hợp tác vì mục tiêu chung), không chỉ ở gần nhau."
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n50
  cau: "Áp dụng 2: kết bạn liên nhóm (Pettigrew 1998)."
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n51
  cau: 'Áp dụng 3: thận trọng với các bài "test thiên kiến ngầm" (nhãn Đang tranh cãi).'
  loai: nhan
- trang: kham-pha/tam-ly-xa-hoi/dinh-kien
  id: n52
  cau: "Áp dụng 4: can thiệp vào chuẩn mực và thể chế."
  loai: nhan
