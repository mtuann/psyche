  cau_dung: "YRBS 2021: 22% học sinh cấp 3 đã nghiêm túc nghĩ đến tự tử trong 12 tháng qua (nữ 30%, nam 14%; nữ năm 2011: 19%); 10% đã cố tự tử ít nhất một lần trong 12 tháng qua."
