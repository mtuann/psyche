  id: n34
  luot_2: dung
  nguon: ["https://www.nature.com/articles/d41586-024-00902-2"]
  trich: "'Hundreds of researchers ... have searched for the kind of large effects suggested by Haidt. Our efforts have produced a mix of no, small and mixed associations. Most data are correlative. When associations over time are found, they suggest not that social-media use predicts or causes depression, but that young people who already have mental-health problems use such platforms more often'"
  ghi_chu: "Nature 29/3/2024 (book review), đã đọc trực tiếp, không phải tóm tắt thứ cấp."
