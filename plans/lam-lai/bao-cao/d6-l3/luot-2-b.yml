  trich: "Teague và cộng sự 2026: '153 studies (115 cohorts, 1072 effect sizes) ... preregistered with PROSPERO ... r = 0.09 ... to r = 0.21 ... r = -0.14 ... to r = -0.07'"
  ghi_chu: "Các con số và đăng ký trước PROSPERO khớp tóm tắt (JAMA Pediatrics, 2026). Tóm tắt kết luận 'consistently associated with risks'; chữ 'các tác giả nêu liên hệ khiêm tốn' không có trong tóm tắt, toàn văn sau tường phí."
