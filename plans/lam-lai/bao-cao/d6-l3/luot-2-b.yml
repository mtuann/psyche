- trang: kham-pha/phat-trien/tuoi-gia
  id: n1
  luot_2: khong-chac
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC3607395/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6367038/"]
  trich: "SLS (Schaie & Willis 2010): \"reliably replicable average age decrements ... do not occur prior to age 60\""
  ghi_chu: "Phần 'chưa suy giảm đáng tin cậy trước 60' đúng với SLS. Phần 'vốn từ còn tăng đến thập niên 60' là kết quả của Salthouse 2019 (mẫu khác SLS: 5.098 người); nguồn SLS đã mở không nói điều ấy."
- trang: kham-pha/phat-trien/tuoi-gia
  id: n2
  luot_2: dung
  nguon: ["https://www.nhs.uk/conditions/dementia/symptoms/", "https://www.who.int/news-room/fact-sheets/detail/dementia"]
  trich: "NHS: \"regularly forgetting recent events, names and faces; asking questions repetitively\"; WHO: dementia 'affects memory, thinking and the ability to perform daily activities'"
  ghi_chu: "Tình huống là ví dụ giả định; phần khẳng định (dấu hiệu NHS nêu, nên gặp bác sĩ) khớp NHS."
- trang: kham-pha/phat-trien/tuoi-gia
  id: n3
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/dementia", "https://www.nhs.uk/conditions/dementia/symptoms/"]
  trich: "WHO: \"it is not an inevitable part of ageing\"; NHS: \"Dementia is not a natural part of ageing\""
- trang: kham-pha/phat-trien/tuoi-gia
  id: n4
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC3607395/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3134559/"]
  trich: "SLS bắt đầu 1956, sau 47 năm vẫn chạy (Schaie & Willis 2010: 'an effort now extending over 47 years')"
  ghi_chu: "Đến 2010 đã hơn 50 năm từ 1956; khớp 'hơn nửa thế kỷ'."
- trang: kham-pha/phat-trien/tuoi-gia
  id: n5
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/8759042", "https://europepmc.org/article/MED/14518807"]
  trich: "Salthouse 1996 (tóm tắt): giả thuyết tốc độ xử lý chậm lại giải thích khác biệt tuổi ở nhận thức lưu động"
  ghi_chu: "Phần 'tốc độ xử lý chậm lại' khớp tóm tắt Salthouse 1996. 'Khó làm hai việc cùng lúc' không có trong tóm tắt 1996 (chỉ có cơ chế 'limited time' và 'simultaneity'); toàn văn 1996 không mở được. Làm hai việc cùng lúc: Verhaeghen và cộng sự 2003 (phân tích tổng hợp) thấy chi phí lớn hơn ở người lớn tuổi."
- trang: kham-pha/phat-trien/tuoi-gia
  id: n6
  luot_2: dung
  nguon: ["https://www.who.int/news-room/fact-sheets/detail/dementia", "https://www.nhs.uk/conditions/dementia/symptoms/"]
  trich: "WHO: 'a condition that affects memory, thinking and the ability to perform daily activities'; NHS: 'Dementia is not a disease itself. It's a collection of symptoms'"
  ghi_chu: "WHO/NHS gọi là hội chứng/nhóm triệu chứng do nhiều bệnh; 'nhóm bệnh' là cách nói gần đúng."
- trang: kham-pha/phat-trien/tuoi-gia
  id: n7
  luot_2: khong-chac
  nguon: ["https://www.nhs.uk/conditions/dementia/symptoms/"]
  trich: "NHS: 'important to talk to a GP sooner rather than later if you're worried'"
  ghi_chu: "Không nguồn bậc 1-2 nào đã mở nói về 'hai cái hại ngược nhau' (chủ quan/hoảng loạn); chỉ phần 'nên gặp bác sĩ sớm' có nguồn."
