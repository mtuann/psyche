  trich: "Odgers: 'the book's repeated suggestion that digital technologies are rewiring our children's brains ... is not supported by science'; Surgeon General 2023: 'we do not yet have enough evidence to determine if social media is sufficiently safe'"
  ghi_chu: "Nhãn 'Đang tranh cãi' hợp lý."
