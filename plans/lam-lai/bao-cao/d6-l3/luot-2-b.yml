  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC11513876/", "https://europepmc.org/article/MED/21291444", "https://link.springer.com/article/10.1007/s11292-010-9109-1", "https://europepmc.org/article/MED/33715780"]
  trich: "KiVa RCT: hiệu quả; PMC11513876: 'there is little specific data showing that the effects of KiVa are mediated by improvements in bystander behavior'; Ttofi 2011: 'Work with peers was associated with an increase in victimization'; Gaffney 2021: 'informal peer involvement' gắn với hiệu quả lớn hơn"
  ghi_chu: "Bằng chứng về vai trò người chứng kiến mâu thuẫn (Ttofi 2011 thấy làm việc với bạn cùng lứa đi cùng tăng nạn nhân; Gaffney 2021 thấy sự tham gia không chính thức của bạn bè hiệu quả hơn; chưa chứng minh KiVa tác động qua người chứng kiến). Nhãn 'Khá vững' cao hơn thước đo; 'chìa khóa bị bỏ quên' mạnh hơn bằng chứng."
  cau_dung: "Nhãn 'Đang tranh cãi': vai trò của người chứng kiến/bạn cùng lứa trong chương trình chống bắt nạt; KiVa hiệu quả nhưng chưa rõ qua cơ chế người chứng kiến."
