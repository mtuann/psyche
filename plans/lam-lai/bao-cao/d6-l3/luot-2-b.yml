  cau_dung: "Hình Gf-Gc: Gc tăng đến khoảng thập niên 60 rồi ổn định hay giảm nhẹ, giảm muộn hơn và ít hơn Gf; ở tuổi 70-80 vẫn cao hơn người trẻ."
