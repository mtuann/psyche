  "trich": "Results from 1,593 students ... The warmth of parents during childhood was associated with higher EI, while overprotectiveness and authoritarianism from mothers were associated with lower EI among adolescents."
  "ghi_chu": "Nguyen và cộng sự 2020, \"Perceived Parenting Styles and Emotional Intelligence Among Adolescents in Vietnam\" (DOI 10.1177/1066480719896558). Cắt ngang; câu dùng \"gắn với\"."
- "trang": "kham-pha/phat-trien/ban-sac-tuoi-teen"
  "id": "n47"
  "luot_2": "khong-chac"
  "ghi_chu": "Ý đầu (teen trình bày bản thân khác nhau theo bối cảnh/khán giả và việc đó đổi cách thử bản sắc) là khẳng định bằng chứng không dẫn nguồn nào, chưa mở được nguồn. Phần \"chưa mở được nghiên cứu ở teen Việt\" là tự thuật."
- "trang": "kham-pha/phat-trien/ban-sac-tuoi-teen"
