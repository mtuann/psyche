  "luot_2": "dung"
  "nguon":
  - "https://web.archive.org/web/2016/http://ilabs.washington.edu/kuhl/pdf/Kuhl_etal_2006.pdf"
  "trich": "a decrease in nonnative consonant perception occurs between 6–8 and 10–12 months of age (Werker & Tees, 1984)"
  "ghi_chu": "Phần \"vẫn phân biệt tốt phụ âm tiếng Anh\" không được Kuhl 2006 nêu riêng cho Werker & Tees nhưng khớp kết quả chung (khả năng bản ngữ tăng); xác nhận gián tiếp."
