  - "https://api.crossref.org/works?query.bibliographic=Piaget+conservation+Vietnamese+children"
  "ghi_chu": "Kiểm lại 2026-11-10: Europe PMC (\"Marcia\" và \"identity status\" và Vietnam/Vietnamese: 3 kết quả, không liên quan) và Crossref (\"identity status Marcia Vietnamese adolescents\": chỉ có nghiên cứu bản sắc dân tộc của thanh niên Mỹ gốc Việt). Chưa thấy nghiên cứu về 4 trạng thái Marcia ở người Việt ở Việt Nam. Giới hạn: chưa tìm tạp chí trong nước. het_han: 2027-11."
- "trang": "kham-pha/phat-trien/ban-sac-tuoi-teen"
  "id": "n45"
  "luot_2": "khong-chac"
  "ghi_chu": "Giả thuyết của site, chính câu tự ghi \"chưa có số liệu Việt Nam\"; không có nguồn để kiểm: không qua lượt 2."
