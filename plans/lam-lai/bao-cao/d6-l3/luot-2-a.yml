  "id": "n28"
  "luot_2": "khong-chac"
  "ghi_chu": "Bài gốc Baillargeon 1987 (Developmental Psychology 23, 655) đóng sau APA PsycNET; không có bản mở, tóm tắt trên Crossref/OpenAlex/PubMed/Semantic Scholar trống; chỉ xác nhận được tiêu đề \"Object permanence in 3½- and 4½-month-old infants\". Chi tiết thí nghiệm màn quay (habituation, hộp, nhóm nhanh chán, đối chứng, kết luận) chưa được xác nhận bằng nguồn bậc 1–2 đọc được. OpenStax chỉ nói chung rằng nhiều nghiên cứu (Baillargeon 2004) thấy trẻ đạt mốc sớm hơn Piaget."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n29"
  "luot_2": "khong-chac"
  "ghi_chu": "Mốc \"khoảng 9 tháng\" theo Piaget (1954): không mở được sách gốc; OpenStax chỉ nêu 5–8 tháng theo nghiên cứu hiện đại, không nêu mốc 9 tháng của Piaget."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n30"
  "luot_2": "khong-chac"
  "ghi_chu": "Piaget dùng nhiệm vụ thò tay tìm (OpenStax: trẻ \"reach for the hidden toy\") và Diamond 1985 xác nhận lỗi AB liên quan khả năng nhớ/làm theo ý định; nhưng phần \"Baillargeon chỉ đo thời gian nhìn\" thuộc bài gốc Baillargeon 1987 không mở được."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n31"
  "luot_2": "dung"
  "nguon":
  - "https://europepmc.org/article/MED/1508269"
  - "https://europepmc.org/article/MED/11194253"
  "trich": "Experiments 1 and 2 (N = 44) were replications of Wynn's first two experiments in which infants were shown addition (1 + 1 = 1 or 2) and subtraction (2 - 1 = 1 or 2) (Wakeley 2000)"
  "ghi_chu": "Tóm tắt Wynn 1992 và mô tả thủ tục của Wynn trong tóm tắt Wakeley 2000; chi tiết \"đặt thêm một vật sau màn\" thuộc thủ tục chuẩn, không đọc được toàn văn Wynn."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n32"
  "luot_2": "khong-chac"
  "ghi_chu": "Chiều kết quả (trẻ nhìn phi lý lâu hơn) và ý nghĩa thống kê của Wynn 1992 không có trong tóm tắt đọc được; toàn văn Nature đóng. Wakeley 2000 chỉ cho biết \"unlike Wynn, we found no systematic evidence\"."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n33"
  "luot_2": "dung"
  "nguon":
  - "https://europepmc.org/article/MED/1508269"
  - "https://europepmc.org/article/MED/11194253"
  "trich": "Here I show that 5-month-old infants can calculate the results of simple arithmetical operations on small numbers of items (Wynn 1992); Wakeley: ... using Wynn's procedure ... addition (1 + 1 = 1 or 2) and subtraction (2 - 1 = 1 or 2)"
  "ghi_chu": "Wynn 1992 (Nature) đọc tóm tắt; thủ tục 1+1=1 hay 2, 2−1=1 hay 2 xác nhận qua tóm tắt Wakeley 2000."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n34"
  "luot_2": "dung"
  "nguon":
  - "https://europepmc.org/article/MED/11194253"
  "trich": "Three experiments (N = 68), using Wynn's procedure, tested 5-month-old infants ... Unlike Wynn, we found no systematic evidence of either imprecise or precise adding and subtracting in young infants."
  "ghi_chu": "Wakeley, Rivera & Langer 2000, Child Development. Thí nghiệm 1–2 lặp lại trực tiếp, thí nghiệm 3 là biến thể phép trừ 3−1; tổng 68 trẻ."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n35"
  "luot_2": "dung"
  "nguon":
  - "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories"
  - "https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development"
  "trich": "Piaget ... stages approximately associated with age ranges; ... the order in which children learn language structures is consistent across children and cultures (OpenStax 9.3)"
  "ghi_chu": "Nhãn Khá vững không cao hơn thước đo: nhiều nghiên cứu cùng chiều nhưng có phê bình về tính liên tục của phát triển (OpenStax 9.2: Courage & Howe 2002; Siegler 2005). Nguồn đọc được là giáo trình, chưa phải tổng quan hệ thống; mức Khá vững hợp lý."
