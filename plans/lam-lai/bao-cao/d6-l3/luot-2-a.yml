  "luot_2": "khong-chac"
  "nguon":
  - "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=3394234"
  "ghi_chu": "Trích dẫn nguyên văn \"an active struggle to make commitments\" (Marcia) không tìm thấy trong nguồn đã mở (Meeus 2012 chỉ nói \"active exploration and has made no commitment, or at best an unclear one\"); sự phân biệt moratorium–diffusion (khám phá so với chưa cam kết) thì khớp."
- "trang": "kham-pha/phat-trien/ban-sac-tuoi-teen"
