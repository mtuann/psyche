  - "https://europepmc.org/article/MED/16472309"
  "trich": "Werker and her colleagues demonstrated that a decrease in nonnative consonant perception occurs between 6–8 and 10–12 months of age (Werker & Tees, 1984)"
  "ghi_chu": "Bài Werker & Tees 1984 (Infant Behavior and Development) không mở được toàn văn (Elsevier đóng, tóm tắt trống); xác nhận gián tiếp qua Kuhl 2006. Chi tiết \"nhiều độ tuổi\" khớp \"6–8 and 10–12 months\"."
- "trang": "kham-pha/phat-trien/tre-hoc-noi"
