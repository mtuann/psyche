  - "https://europepmc.org/article/MED/22089632"
  - "https://api.crossref.org/works/10.1111/sode.12027"
  "trich": "identity ... consideration of alternative commitments, in-depth exploration (Meeus 2012); exploration in breadth and depth strongly related to commitment in adolescence and emerging adulthood; ruminative exploration and depressive symptoms in the late 20s (Luyckx 2013)"
- "trang": "kham-pha/phat-trien/ban-sac-tuoi-teen"
  "id": "n39"
  "luot_2": "qua-manh"
  "nguon":
  - "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=3394234"
  "trich": "Meeus 2012: statuses differ in depressive symptoms and delinquency (observational associations)"
  "ghi_chu": "Căn cứ chỉ là liên hệ giữa trạng thái bản sắc và thích ứng (quan sát); chưa có bằng chứng can thiệp rằng \"xác định mình đang ở đâu rồi hành xử cho đúng\" giúp ích. Khung Khá vững cho lời khuyên là cao hơn bằng chứng."
  "cau_dung": "Có thể dùng bốn trạng thái để gọi tên trải nghiệm; liên hệ giữa trạng thái và thích ứng có nhưng là quan sát, chưa có nghiên cứu cho thấy tự xếp loại rồi hành xử theo đó cải thiện kết quả (nhãn nên là Đang tranh cãi hay nói rõ là chưa đủ bằng chứng)."
- "trang": "kham-pha/phat-trien/ban-sac-tuoi-teen"
  "id": "n40"
  "luot_2": "dung"
  "nguon":
  - "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=3394234"
  "trich": "early closures ... lowest scores ... moratoriums ... higher depression; searching moratoriums lower depression than moratoriums"
  "ghi_chu": "Đang tranh cãi hợp lý: bằng chứng không chỉ một hướng cho \"chọn sẵn\" hay \"cho không gian thử\"."
