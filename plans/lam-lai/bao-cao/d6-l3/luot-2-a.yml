  "id": "n1"
  "luot_2": "khong-chac"
  "ghi_chu": "Câu mô tả trang (ve-site): không qua lượt 2 (câu về chính trang, ví dụ giả định hay lời dẫn)"
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n2"
  "luot_2": "dung"
  "nguon":
  - "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories"
  "trich": "children in the concrete operational stage ... master the concept of conservation; preoperational ... have not developed an understanding of conservation"
  "ghi_chu": "OpenStax xếp hiểu bảo toàn vào 7–11 tuổi, tiền thao tác (2–7) chưa hiểu bảo toàn. Câu dùng \"thường\", đúng mức; chi tiết \"chỉ vào cốc cao\" là ví dụ minh họa, khớp mô tả."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n3"
  "luot_2": "dung"
  "nguon":
  - "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories"
  "trich": "children do not think and reason like adults ... Piaget said that children develop schemata ... through two processes: assimilation and accommodation ... a theory ... in four stages approximately associated with age ranges"
  "ghi_chu": "OpenStax Psychology 2e, mục 9.2 (Piaget, Erikson)."
