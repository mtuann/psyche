  "luot_2": "khong-chac"
  "ghi_chu": "Mốc \"2–4 tháng cooing\": OpenStax nói trẻ \"coo almost immediately\", NIDCD gom 0–3 tháng \"Coos and makes pleasure sounds\"; khoảng 2–4 tháng không được nguồn đã mở xác nhận chính xác."
- "trang": "kham-pha/phat-trien/tre-hoc-noi"
  "id": "n9"
  "luot_2": "khong-chac"
  "ghi_chu": "\"6–8 tháng bập bẹ chuẩn\": NIDCD ghi bập bẹ giống tiếng nói ở 4–6 tháng và chuỗi âm dài–ngắn ở 7–12 tháng; không khớp chính xác. \"6–12 tháng hẹp dần\" và \"~12 tháng từ đầu tiên\" thì khớp (Kuhl 2003; OpenStax)."
- "trang": "kham-pha/phat-trien/tre-hoc-noi"
  "id": "n10"
  "luot_2": "qua-manh"
  "nguon":
  - "https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development"
  - "https://europepmc.org/article/MED/7845413"
  "trich": "Recent research may indicate that while some children experience these spurts, it is far from universal (OpenStax 9.3, Ganger & Brent 2004); Fenson 1994: Extensive variability exists in the rate of lexical, gestural, and grammatical development"
  "ghi_chu": "Chú thích hình nói \"thứ tự các mốc rất ổn định\" và vẽ \"bùng nổ từ vựng ~18 tháng\" như điểm cố định. Fenson (1.803 trẻ) cho thấy thời điểm và tốc độ biến thiên rất rộng; OpenStax lưu ý bùng nổ từ vựng không phổ quát."
  "cau_dung": "Thứ tự các mốc đầu (cooing, bập bẹ, từ đầu, ghép từ) tương đối ổn định, nhưng thời điểm biến thiên rất rộng giữa trẻ; \"bùng nổ từ vựng\" ở khoảng 18 tháng chỉ có ở một số trẻ."
- "trang": "kham-pha/phat-trien/tre-hoc-noi"
