  "luot_2": "khong-chac"
  "ghi_chu": "Cần tổng quan hệ thống hay tái lập lớn về hiểu biết vật thể khuất ở trẻ sơ sinh để đỡ nhãn \"Đã bị bác bỏ\"; nguồn đã mở (OpenStax, Diamond 1985, Wynn/Wakeley) chỉ cho thấy nhiều nghiên cứu thấy trẻ đạt mốc sớm hơn và bài Wynn còn tranh cãi; không đủ để xác nhận mức \"bác bỏ\" cho câu \"hoàn toàn không có khái niệm vật thể\"."
