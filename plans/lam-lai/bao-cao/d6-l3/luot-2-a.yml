  "id": "n17"
  "luot_2": "khong-chac"
  "ghi_chu": "Mô tả của Marcia về foreclosure (cứng nhắc, cảm thấy bị đe dọa nếu giá trị cha mẹ không dùng được) thuộc bài đầy đủ không mở được; tóm tắt chỉ nói nhóm này tuân theo ý cha mẹ và độc đoán hơn."
- "trang": "kham-pha/phat-trien/ban-sac-tuoi-teen"
  "id": "n18"
  "luot_2": "dung"
  "nguon":
  - "https://europepmc.org/article/MED/20004962"
  "trich": "Some 124 studies ... between 1966 and 2005 ... the mean proportion of adolescents making progressive identity status changes was .36, compared with .15 who made regressive changes and .49 who remained stable. Cross-sectional studies showed the mean proportion of moratoriums rising steadily to age 19 years and declining thereafter, while the mean proportion of the identity achieved rose over late adolescence and young adulthood; foreclosure and diffusion statuses declined over the high school years, but fluctuated ... large mean proportions of samples were not identity achieved by young adulthood"
  "ghi_chu": "Kroger, Martinussen & Marcia 2010 (tóm tắt qua Europe PMC; toàn văn Elsevier đóng)."
