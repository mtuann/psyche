  - "https://api.crossref.org/works/10.1126/science.161.3838.257"
  - "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories"
  "trich": "Erik H. Erikson. Identity: Youth and Crisis. Norton, New York, 1968. 336 pp. (Science, 19 July 1968); According to psychosocial theory, we experience eight stages of development over our lifespan ... At each stage there is a conflict, or task"
  "ghi_chu": "Năm 1968 xác nhận bằng bài điểm sách đăng Science 161; tám giai đoạn mỗi giai đoạn một xung đột xác nhận OpenStax 9.2."
- "trang": "kham-pha/phat-trien/ban-sac-tuoi-teen"
  "id": "n4"
  "luot_2": "dung"
  "nguon":
  - "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories"
  "trich": "In adolescence (ages 12–18), children face the task of identity versus role confusion ... developing a sense of self (stage 5)"
- "trang": "kham-pha/phat-trien/ban-sac-tuoi-teen"
  "id": "n5"
  "luot_2": "dung"
  "nguon":
  - "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories"
  "trich": "Adolescents who are successful at this stage have a strong sense of identity and are able to remain true to their beliefs and values ... apathetic adolescents ... or those who are pressured to conform to their parents' ideas ... will have a weak sense of self and experience role confusion"
- "trang": "kham-pha/phat-trien/ban-sac-tuoi-teen"
  "id": "n6"
  "luot_2": "khong-chac"
  "ghi_chu": "\"Psychosocial moratorium\" của Erikson (1968): không mở được sách Identity: Youth and Crisis; OpenStax, Marcia 1966 (tóm tắt) và Meeus 2012 không nêu khái niệm này."
- "trang": "kham-pha/phat-trien/ban-sac-tuoi-teen"
  "id": "n7"
  "luot_2": "khong-chac"
  "ghi_chu": "Marcia 1966 (J Personality and Social Psychology 3, 551) xác nhận là bài đề xuất cách đo bằng phỏng vấn (86 nam sinh viên, tóm tắt), và Meeus 2012 xác nhận \"Marcia (1966) distinguished four identity statuses\"; nhưng chi tiết Marcia là nghiên cứu sinh ở Ohio State không đọc được trong nguồn đã mở."
- "trang": "kham-pha/phat-trien/ban-sac-tuoi-teen"
  "id": "n8"
  "luot_2": "dung"
  "nguon":
  - "https://api.openalex.org/works/doi:10.1037/h0023281"
  - "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=3394234"
  "trich": "Criteria for inclusion in 1 of 4 identity statuses were the presence of crisis and commitment in the areas of occupation and ideology (Marcia 1966); Meeus: statuses based on the amount of exploration and commitment"
  "ghi_chu": "Tóm tắt Marcia nói \"occupation and ideology\"; việc tách ý thức hệ thành tôn giáo và chính trị là cách chia thường dùng của Marcia, tóm tắt không liệt kê."
- "trang": "kham-pha/phat-trien/ban-sac-tuoi-teen"
  "id": "n9"
  "luot_2": "dung"
  "nguon":
  - "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=3394234"
  "trich": "Diffusion (D) ... has not yet made commitments ... Foreclosure (F) ... a commitment without exploration. In moratorium (M) ... active exploration and has made no commitment, or at best an unclear one. Identity achievement (A) ... finished a period of active exploration and has made a related commitment"
- "trang": "kham-pha/phat-trien/ban-sac-tuoi-teen"
  "id": "n10"
  "luot_2": "khong-chac"
  "ghi_chu": "Câu khó hiểu (\"achievement có thể là biến thể của mong muốn cha mẹ\"); chưa tìm thấy nguồn đã mở nói điều này (Marcia 1966 bản đầy đủ không mở được)."
- "trang": "kham-pha/phat-trien/ban-sac-tuoi-teen"
  "id": "n11"
  "luot_2": "dung"
  "nguon":
  - "https://europepmc.org/article/MED/20004962"
  "trich": "mean proportion of adolescents making progressive identity status changes was .36, compared with .15 who made regressive changes and .49 who remained stable"
  "ghi_chu": "Kroger, Martinussen & Marcia 2010, Journal of Adolescence: trạng thái đổi cả hai chiều, không theo trình tự bắt buộc."
- "trang": "kham-pha/phat-trien/ban-sac-tuoi-teen"
  "id": "n12"
  "luot_2": "dung"
  "nguon":
  - "https://api.openalex.org/works/doi:10.1037/h0023281"
  - "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories"
  "trich": "Previous studies have attempted to determine the extent of ego-identity achievement by means of an adjustment measure and the semantic differential technique ... Statuses were determined ... by means of individual interviews"
  "ghi_chu": "Phần Marcia đề xuất cách đo bằng phỏng vấn sau các nỗ lực trước: khớp. \"Erikson lâm sàng, không đo đạc, không nhóm đối chứng\" không có nguồn trực tiếp đã mở nhưng không mâu thuẫn (OpenStax: Erikson sửa từ Freud)."
- "trang": "kham-pha/phat-trien/ban-sac-tuoi-teen"
  "id": "n13"
  "luot_2": "khong-chac"
  "nguon":
  - "https://api.openalex.org/works/doi:10.1037/h0023281"
  "ghi_chu": "Tóm tắt Marcia 1966 xác nhận 86 nam sinh viên đại học, phỏng vấn cá nhân, nhiệm vụ nhận thức dưới căng thẳng, đặt mục tiêu, độc đoán, lòng tự trọng. Tên trường (Hiram College) không có trong tóm tắt; toàn văn không mở được."
