  "trich": "In adolescence, children face the task of identity versus role confusion (Erikson); Meeus: moratorium \"state of active exploration\""
  "ghi_chu": "\"Khủng hoảng\" theo Marcia là giai đoạn khám phá và dấn thân (Meeus 2012 mô tả \"active exploration\"), không phải bệnh lý; định nghĩa nguyên văn của Marcia 1966 không mở được."
- "trang": "kham-pha/phat-trien/ban-sac-tuoi-teen"
