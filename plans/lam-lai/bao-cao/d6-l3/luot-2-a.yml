  "trich": "Erikson: adolescents try on many different selves; Meeus: moratorium = active exploration"
  "ghi_chu": "Hợp với định nghĩa của Marcia (khám phá giữa các lựa chọn); diễn đạt nguyên văn của Marcia 1966 không mở được."
