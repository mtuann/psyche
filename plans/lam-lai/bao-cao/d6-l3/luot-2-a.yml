  "id": "n7"
  "luot_2": "dung"
  "nguon":
  - "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories"
  "trich": "sensorimotor stage ... birth to about 2 years old ... through their senses and motor behavior ... object permanence"
  "ghi_chu": "Mốc 0–2 tuổi theo OpenStax; OpenStax nêu tính bền vững vật thể ở 5–8 tháng theo nghiên cứu hiện đại."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n8"
  "luot_2": "dung"
  "nguon":
  - "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories"
  "trich": "preoperational stage, which is from approximately 2 to 7 years old ... symbols ... pretend play ... have not developed an understanding of conservation ... egocentrism"
  "ghi_chu": "Bảng 9.2 của OpenStax ghi 2–6 nhưng văn bản ghi 2–7; câu dùng 2–7 (con số thường gặp)."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n9"
  "luot_2": "dung"
  "nguon":
  - "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories"
  "trich": "concrete operational stage ... from about 7 to 11 years old ... master the concept of conservation ... principle of reversibility"
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n10"
  "luot_2": "dung"
  "nguon":
  - "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories"
  "trich": "formal operational stage, which is from about age 11 to adulthood ... abstract ideas and hypothetical situations"
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n11"
  "luot_2": "dung"
  "nguon":
  - "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories"
  "trich": "if you pour water from a tall, thin glass to a short, fat glass, you still have the same amount of water"
  "ghi_chu": "OpenStax mô tả rót từ cao–hẹp sang thấp–rộng (ngược chiều câu), nhưng thủ tục cùng loại: trẻ nhìn nước được rót sang bình khác hình rồi được hỏi về lượng; chiều rót không đổi ý nghĩa nhiệm vụ."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n12"
  "luot_2": "dung"
  "nguon":
  - "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories"
  "trich": "children in the concrete operational stage ... master the concept of conservation ... also understand the principle of reversibility"
  "ghi_chu": "Chi tiết \"có em cho cốc cao nhiều hơn\" khớp ví dụ pizza của OpenStax (trẻ tiền thao tác nghĩ mình có nhiều hơn)."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n13"
  "luot_2": "dung"
  "nguon":
  - "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories"
  "trich": "conservation, which is the idea that even if you change the appearance of something, it is still equal in size as long as nothing has been removed or added"
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n14"
  "luot_2": "dung"
  "nguon":
  - "https://europepmc.org/article/MED/4042750"
  "trich": "25 infants were tested ... on the AB Object Permanence Task devised by Piaget ... delay between hiding and retrieval necessary to produce the AB error"
  "ghi_chu": "Chỉ đọc được tóm tắt Diamond 1985: xác nhận nhiệm vụ AB của Piaget và lỗi AB; các bước A rồi B là thủ tục chuẩn, tóm tắt không liệt kê từng bước."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n15"
  "luot_2": "dung"
  "nguon":
  - "https://europepmc.org/article/MED/4042750"
  "trich": "All children displayed the AB error repeatedly over the months of testing ... from under 2 sec at 7 1/2 months to over 10 sec by 12 months"
  "ghi_chu": "Tóm tắt Diamond 1985: lỗi AB ở mọi trẻ trong khoảng 7,5–12 tháng; khớp \"8–12 tháng\"."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n16"
  "luot_2": "khong-chac"
  "ghi_chu": "Cách Piaget (1954) giải thích lỗi AB (gắn đồ vật với hành động của chính mình): không mở được sách gốc của Piaget; OpenStax và tóm tắt Diamond 1985 không nêu cách giải thích này (Diamond đưa cách giải thích về trí nhớ)."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n17"
  "luot_2": "dung"
  "nguon":
  - "https://europepmc.org/article/MED/4042750"
  "trich": "delay ... necessary to produce the AB error increased continuously ... at an average rate of 2 sec/month, from under 2 sec at 7 1/2 months to over 10 sec by 12 months"
  "ghi_chu": "Đọc tóm tắt (Diamond 1985, 25 trẻ). Nhỏ: tóm tắt ghi \"dưới 2 giây\" ở 7,5 tháng, câu ghi 2–5 giây ở 7,5–9 tháng (khoảng 5 giây ở 9 tháng suy từ 2 giây/tháng); nên sửa thành \"dưới 2 đến khoảng 5 giây\"."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n18"
  "luot_2": "khong-chac"
  "ghi_chu": "Phần \"so sánh với khỉ rhesus, vỏ não trước trán\" không có trong tóm tắt Diamond 1985 (tóm tắt chỉ nói AB là chỉ báo khả năng làm theo ý định dựa trên thông tin lưu trữ bất chấp thói quen); không mở được toàn văn."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n19"
  "luot_2": "dung"
  "nguon":
  - "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories"
  "trich": "0–2 Sensorimotor; 2–6 (text: 2 to 7) Preoperational; 7–11 Concrete operational; 12– (text: about 11 to adulthood) Formal operational"
  "ghi_chu": "Hình dùng mốc 0, 2, 7, 11 như văn bản OpenStax."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n20"
  "luot_2": "khong-chac"
  "ghi_chu": "Bài gốc Baillargeon 1987 (Developmental Psychology 23, 655) đóng sau APA PsycNET; không có bản mở, tóm tắt trên Crossref/OpenAlex/PubMed/Semantic Scholar trống; chỉ xác nhận được tiêu đề \"Object permanence in 3½- and 4½-month-old infants\". Chi tiết thí nghiệm màn quay (habituation, hộp, nhóm nhanh chán, đối chứng, kết luận) chưa được xác nhận bằng nguồn bậc 1–2 đọc được. OpenStax chỉ nói chung rằng nhiều nghiên cứu (Baillargeon 2004) thấy trẻ đạt mốc sớm hơn Piaget."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n21"
  "luot_2": "dung"
  "nguon":
  - "https://europepmc.org/article/MED/1508269"
  - "https://europepmc.org/article/MED/11194253"
  "trich": "Here I show that 5-month-old infants can calculate the results of simple arithmetical operations on small numbers of items (Wynn 1992); Wakeley: ... using Wynn's procedure ... addition (1 + 1 = 1 or 2) and subtraction (2 - 1 = 1 or 2)"
  "ghi_chu": "Wynn 1992 (Nature) đọc tóm tắt; thủ tục 1+1=1 hay 2, 2−1=1 hay 2 xác nhận qua tóm tắt Wakeley 2000."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n22"
  "luot_2": "khong-chac"
  "ghi_chu": "McGarrigle & Donaldson 1974 (Cognition 3, 341; DOI 10.1016/0010-0277(74)90003-1): Crossref/OpenAlex/PubMed không có tóm tắt, không mở được toàn văn; tuổi 4–5 và ngữ cảnh \"gấu nghịch ngợm\" chưa xác nhận."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n23"
  "luot_2": "qua-manh"
  "nguon":
  - "https://europepmc.org/article/MED/11194253"
  - "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories"
  "trich": "Unlike Wynn, we found no systematic evidence of either imprecise or precise adding and subtracting in young infants (Wakeley 2000)"
  "ghi_chu": "Chú thích gom ba phát hiện thành bằng chứng chắc cho \"năng lực xuất hiện sớm hơn Piaget\". Phát hiện của Wynn đã có một lần lặp lại không thấy hiệu ứng (Wakeley, 68 trẻ); OpenStax chỉ nói chung \"nhiều nghiên cứu cho rằng\" trẻ đạt mốc sớm hơn."
  "cau_dung": "Bốn giai đoạn theo độ tuổi gần đúng, cùng các phát hiện hiện đại (có cái còn tranh cãi, như phép cộng–trừ của trẻ 5 tháng) gợi ý trẻ thể hiện năng lực sớm hơn mốc Piaget khi bài kiểm tra phù hợp hơn."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
  "id": "n24"
  "luot_2": "khong-chac"
  "ghi_chu": "Bài gốc Baillargeon 1987 (Developmental Psychology 23, 655) đóng sau APA PsycNET; không có bản mở, tóm tắt trên Crossref/OpenAlex/PubMed/Semantic Scholar trống; chỉ xác nhận được tiêu đề \"Object permanence in 3½- and 4½-month-old infants\". Chi tiết thí nghiệm màn quay (habituation, hộp, nhóm nhanh chán, đối chứng, kết luận) chưa được xác nhận bằng nguồn bậc 1–2 đọc được. OpenStax chỉ nói chung rằng nhiều nghiên cứu (Baillargeon 2004) thấy trẻ đạt mốc sớm hơn Piaget."
- "trang": "kham-pha/phat-trien/tre-hoc-the-nao"
