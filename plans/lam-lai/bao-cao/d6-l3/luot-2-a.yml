  "ghi_chu": "Bell & Ainsworth 1972, Child Development 43, 1171–1190 (tóm tắt đọc qua OpenAlex). Kết quả ngược với ý \"bé khóc đáp lại là hư\"; vì là nghiên cứu quan sát nhỏ, nhãn \"bác bỏ\" dựa cả vào tổng hợp độ nhạy cảm (De Wolff 1997)."
