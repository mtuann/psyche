- trang: bang-chung/do-lon-hieu-ung
  id: h1
  cau: Với một mẫu rất lớn (ví dụ 50.000 người), một chênh lệch nhỏ đến mức không ai nhận ra trong đời sống vẫn có thể có ý nghĩa thống kê.
  loai: phat-hien
- trang: bang-chung/do-lon-hieu-ung
  id: h2
  cau: '"Có ý nghĩa thống kê" cho biết kết quả khó có thể chỉ do may rủi nếu thật ra không có hiệu ứng nào.'
  loai: dinh-nghia
- trang: bang-chung/do-lon-hieu-ung
  id: h3
  cau: '"Có ý nghĩa thống kê" không cho biết hiệu ứng lớn hay nhỏ, quan trọng hay không.'
  loai: dinh-nghia
- trang: bang-chung/do-lon-hieu-ung
  id: h4
  cau: Mẫu càng lớn, những hiệu ứng càng nhỏ càng dễ có ý nghĩa thống kê.
  loai: phat-hien
- trang: bang-chung/do-lon-hieu-ung
  id: h5
  cau: Độ lớn hiệu ứng (effect size) đo chênh lệch hay mối quan hệ lớn đến đâu, theo một thang chuẩn hóa không phụ thuộc vào cỡ mẫu.
  loai: dinh-nghia
- trang: bang-chung/do-lon-hieu-ung
  id: h6
  cau: d của Cohen đo chênh lệch giữa hai nhóm bằng số độ lệch chuẩn; d = 0,5 nghĩa là trung bình nhóm này cao hơn nhóm kia nửa độ lệch chuẩn; g của Hedges gần giống d.
  loai: dinh-nghia
- trang: bang-chung/do-lon-hieu-ung
  id: h7
  cau: r là hệ số tương quan giữa hai biến.
  loai: dinh-nghia
- trang: bang-chung/do-lon-hieu-ung
  id: h8
  cau: Cohen (1988) đề xuất gọi d = 0,2 là nhỏ, 0,5 là trung bình và 0,8 là lớn.
  loai: lich-su
- trang: bang-chung/do-lon-hieu-ung
  id: h9
  cau: "Hình: hai phân bố chuẩn (độ lệch chuẩn 1) cách nhau d = 0,2; 0,5; 0,8 chồng nhau 92%, 80%, 69%."
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: h10
  cau: "Hình: xác suất một người chọn ngẫu nhiên từ nhóm B có điểm cao hơn một người chọn ngẫu nhiên từ nhóm A là 56%, 64%, 71% số cặp ứng với d = 0,2; 0,5; 0,8."
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: h11
  cau: Nếu điểm số của hai nhóm theo phân bố chuẩn với cùng độ lệch chuẩn, thì ngay cả với d = 0,8, hai nhóm vẫn chồng lên nhau khoảng 69%; nếu chọn ngẫu nhiên một người ở mỗi nhóm, người ở nhóm can thiệp chỉ cao hơn trong khoảng 71% số cặp.
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: h12
  cau: Ngay cả khi một can thiệp có hiệu ứng lớn, vẫn có không ít người ở nhóm đối chứng làm tốt hơn người ở nhóm can thiệp.
  loai: phat-hien
- trang: bang-chung/do-lon-hieu-ung
  id: h13
  cau: Theo Lakens (2013) kể lại, Cohen coi các mốc 0,2 / 0,5 / 0,8 chỉ nên dùng khi kết quả quá mới để so với các nghiên cứu liên quan.
  loai: lich-su
- trang: bang-chung/do-lon-hieu-ung
  id: h14
  cau: Các tổng hợp sau này cho thấy hiệu ứng điển hình trong tâm lý học khá khiêm tốn.
  loai: phat-hien
- trang: bang-chung/do-lon-hieu-ung
  id: h15
  cau: Gộp 322 phân tích tổng hợp trong tâm lý học xã hội, độ lớn trung bình là r = 0,21.
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: h16
  cau: Gộp 708 hệ số tương quan từ các phân tích tổng hợp về khác biệt cá nhân, các tác giả đề xuất đọc r = 0,10 / 0,20 / 0,30 là nhỏ / điển hình / lớn.
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: h17
  cau: Dưới 3% số hệ số tương quan đạt 0,50 trở lên.
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: h18
  cau: Funder và Ozer (2019) lập luận rằng một hiệu ứng nhỏ cho một sự kiện đơn lẻ vẫn có thể quan trọng khi tích lũy qua nhiều lần hoặc nhiều người.
  loai: phat-hien
- trang: bang-chung/do-lon-hieu-ung
  id: h19
  cau: "Funder và Ozer (2019): một hiệu ứng r ≥ 0,40 trong tâm lý học nhiều khả năng là ước lượng quá cao, hiếm khi giữ được trong mẫu lớn hay khi làm lại."
  loai: phat-hien
- trang: bang-chung/do-lon-hieu-ung
  id: h20
  cau: "Bảng: tự kiểm tra so với đọc lại (Rowland, 2014), g = 0,50."
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: h21
  cau: "Bảng: dạy khớp với \"phong cách học\" (Hattie và O'Leary, 2025), d = 0,04."
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: h22
  cau: 'Bảng: "cạn kiệt ý chí", dự án tái lập 36 phòng thí nghiệm (Vohs và cộng sự, 2021), d = 0,06.'
  loai: tai-lap
- trang: bang-chung/do-lon-hieu-ung
  id: h23
  cau: Nhãn Vững chắc cho hiệu ứng tự kiểm tra so với đọc lại (hàng đầu của bảng).
  loai: nhan
- trang: bang-chung/do-lon-hieu-ung
  id: h24
  cau: Nhãn Đã bị bác bỏ cho giả thuyết dạy khớp với "phong cách học" (hàng hai của bảng).
  loai: nhan
- trang: bang-chung/do-lon-hieu-ung
  id: h25
  cau: Nhãn Đang tranh cãi cho "cạn kiệt ý chí" (hàng ba của bảng).
  loai: nhan
- trang: bang-chung/do-lon-hieu-ung
  id: h26
  cau: Khi dự án Many Labs 2 làm lại 28 phát hiện ở nhiều quốc gia, độ lớn hiệu ứng trung vị giảm từ d = 0,60 ở nghiên cứu gốc xuống d = 0,15.
  loai: tai-lap
- trang: bang-chung/do-lon-hieu-ung
  id: h27
  cau: "Một lý do thường được nêu cho việc hiệu ứng co lại là thiên lệch xuất bản: kết quả mạnh dễ được đăng hơn kết quả không có hiệu ứng, nên các nghiên cứu đã đăng có thể phóng đại hiệu ứng."
  loai: phat-hien
- trang: bang-chung/do-lon-hieu-ung
  id: h28
  cau: Khi đọc một nghiên cứu đơn lẻ với hiệu ứng rất lớn, hãy thận trọng.
  loai: loi-khuyen
- trang: bang-chung/do-lon-hieu-ung
  id: h29
  cau: Nên tìm con số chênh lệch thật (ví dụ điểm trung bình tăng bao nhiêu, trên thang bao nhiêu điểm), độ lớn hiệu ứng (d, g, r), cỡ mẫu, và xem kết quả đã được làm lại chưa; mẫu rất lớn thì hiệu ứng nhỏ vẫn có ý nghĩa, mẫu rất nhỏ mà hiệu ứng rất lớn thì đáng ngờ.
  loai: loi-khuyen
- trang: bang-chung/do-lon-hieu-ung
  id: h30
  cau: 'Nhãn Vững chắc: "có ý nghĩa thống kê" không đồng nghĩa với "lớn" hay "quan trọng".'
  loai: nhan
- trang: bang-chung/do-lon-hieu-ung
  id: h31
  cau: "Việc hiệu ứng nhỏ đi khi làm lại cũng được thấy ở hai dự án tái lập lớn: Open Science Collaboration (2015) và Many Labs 2 (2018)."
  loai: tai-lap
- trang: bang-chung/do-lon-hieu-ung
  id: h32
  cau: "Bài tập: với d = 0,2, hai nhóm chồng lên nhau khoảng 92%, và nếu so ngẫu nhiên một người học với một người không học, người học chỉ hài lòng hơn trong khoảng 56% số trường hợp, so với 50% nếu khóa học không có tác dụng gì."
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: h33
  cau: "Nên hỏi thêm: kết quả đã được làm lại chưa; nhóm đối chứng nhận gì."
  loai: loi-khuyen
- trang: bang-chung/do-lon-hieu-ung
  id: q1
  cau: '"Có ý nghĩa thống kê" không nói gì về độ lớn hay tầm quan trọng, và không đảm bảo tái lập.'
  loai: phat-hien
- trang: bang-chung/do-lon-hieu-ung
  id: q2
  cau: Với d = 0,8, hai nhóm chồng lên nhau khoảng 69%; ngay cả hiệu ứng "lớn" theo quy ước của Cohen vẫn để lại phần chồng lấn rất lớn; phát hiện ở cấp độ nhóm không cho biết chắc chắn về từng người.
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: q3
  cau: Trung bình trong tâm lý học xã hội khoảng r = 0,21, và Gignac và Szodorai đề xuất đọc 0,20 là "điển hình".
  loai: so-lieu
- trang: bang-chung/do-lon-hieu-ung
  id: q4
  cau: Nghiên cứu nhỏ vẫn có giá trị như một gợi ý, nhưng kinh nghiệm từ các dự án tái lập cho thấy hiệu ứng ban đầu thường bị phóng đại; một nghiên cứu 30 người báo cáo d = 1,5 cho một mẹo đơn giản nên được đón nhận thận trọng, chờ thêm bằng chứng.
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m1
  cau: Bài báo năm 2010 "The weirdest people in the world?" do Joseph Henrich, Steven Heine và Ara Norenzayan, Đại học British Columbia, viết.
  loai: lich-su
- trang: bang-chung/mau-va-chon-mau
  id: m2
  cau: '"96% người được nghiên cứu trong tâm lý học đến từ các nước chỉ chiếm 12% dân số thế giới" (con số được ba nhà khoa học Đại học British Columbia nêu trong bài báo năm 2010).'
  loai: so-lieu
- trang: bang-chung/mau-va-chon-mau
  id: m3
  cau: 'Khẳng định cũ: con số ấy "gây chấn động" và "được báo chí quốc tế đưa tin rộng rãi vào giữa năm 2010".'
  loai: lich-su
- trang: bang-chung/mau-va-chon-mau
  id: m4
  cau: "Theo phân tích của Arnett (2008) về các tạp chí hàng đầu của sáu chuyên ngành phụ trong tâm lý học, giai đoạn 2003–2007: 68% người tham gia đến từ Mỹ, và 96% đến từ các nước phương Tây công nghiệp hóa (Bắc Mỹ, châu Âu, Úc, Israel)."
  loai: so-lieu
- trang: bang-chung/mau-va-chon-mau
  id: m5
  cau: Có 73% tác giả chính của các bài báo ấy đang công tác tại các trường đại học ở Mỹ.
  loai: so-lieu
- trang: bang-chung/mau-va-chon-mau
  id: m6
  cau: Các nước phương Tây công nghiệp hóa ấy chỉ chiếm khoảng 12% dân số thế giới.
  loai: so-lieu
- trang: bang-chung/mau-va-chon-mau
  id: m7
  cau: "WEIRD viết tắt của Western, Educated, Industrialized, Rich, Democratic: người phương Tây có học, công nghiệp hóa, giàu có, dân chủ."
  loai: dinh-nghia
- trang: bang-chung/mau-va-chon-mau
  id: m8
  cau: Henrich và cộng sự lập luận rằng mẫu người được nghiên cứu không chỉ hẹp mà còn là một trong những nhóm kém đại diện nhất cho loài người.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m9
  cau: Ở nhiều lĩnh vực mà Henrich và cộng sự xem xét, như nhận thức hình ảnh, cảm nhận công bằng, lý luận đạo đức và hợp tác, người thuộc xã hội WEIRD thường là ngoại lệ so với phần còn lại của loài người.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m10
  cau: "Điểm chính của bài báo không phải là các nghiên cứu ấy làm sai, mà là phạm vi của kết luận: hỏi ai thì câu trả lời chắc chắn đúng cho những người như thế."
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m11
  cau: Mở rộng kết quả từ một nhóm hẹp ra cho cả nhân loại là bước nhảy chưa có cơ sở chắc từ trước.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m12
  cau: Tổng thể (population) là nhóm người mà ta muốn kết luận về họ; mẫu (sample) là nhóm người ta thực sự đo đạc, hỏi han.
  loai: dinh-nghia
- trang: bang-chung/mau-va-chon-mau
  id: m13
  cau: Hỏi thật nhiều người cùng một kiểu vẫn có thể cho kết quả lệch.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m14
  cau: Mẫu tốt phải giống tổng thể ở những đặc điểm quan trọng.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m15
  cau: "Chọn mẫu ngẫu nhiên: mỗi người trong tổng thể có cơ hội được chọn như nhau, như rút thăm."
  loai: dinh-nghia
- trang: bang-chung/mau-va-chon-mau
  id: m16
  cau: "Chọn mẫu thuận tiện: lấy những người dễ tiếp cận nhất (sinh viên lớp mình, người qua đường, bạn bè trên mạng)."
  loai: dinh-nghia
- trang: bang-chung/mau-va-chon-mau
  id: m17
  cau: Mẫu ngẫu nhiên có xu hướng giống tổng thể; sai số do chọn mẫu nhỏ dần khi mẫu lớn hơn.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m18
  cau: Chọn mẫu thuận tiện dễ làm, vì dùng kết quả hay người có sẵn.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m19
  cau: Chọn mẫu ngẫu nhiên phải rút thăm từ danh sách của cả tổng thể.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m20
  cau: Kết quả của chọn mẫu thuận tiện có thể rất tốt ở vài trường hợp, nhưng lệch nặng ở trường hợp khác.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m21
  cau: "Ví dụ về chọn mẫu ngẫu nhiên: bỏ tên cả lớp vào mũ rồi rút ra vài người."
  loai: dinh-nghia
- trang: bang-chung/mau-va-chon-mau
  id: m22
  cau: Phần lớn nghiên cứu tâm lý học trước nay dùng sinh viên đại học làm người tham gia.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m23
  cau: Sinh viên thường trẻ hơn, học vấn cao hơn và ít đa dạng hơn dân số chung.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m24
  cau: Mẫu toàn sinh viên không phải "con người nói chung".
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m25
  cau: Thiên lệch chọn mẫu (sampling bias) xảy ra khi cách thu thập mẫu khiến một số thành viên của tổng thể ít có khả năng được chọn hơn những người khác, và có thể dẫn tới kết luận sai về tổng thể.
  loai: dinh-nghia
- trang: bang-chung/mau-va-chon-mau
  id: m26
  cau: 'Mẫu tự nguyện: thăm dò "bạn có thích sản phẩm mới không" trên fanpage của chính công ty. Chỉ những người chọn trả lời mới có mặt trong mẫu, và người theo dõi fanpage vốn có thể đã thích thương hiệu.'
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m27
  cau: "Mẫu bỏ sót nhóm đã rời đi: khảo sát mức độ hài lòng của học viên đang học tại một trung tâm; người đã bỏ học giữa chừng không còn trong danh sách nên không có cơ hội vào mẫu."
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m28
  cau: 'Mẫu dễ tiếp cận: hỏi người qua đường ở quận 1 rồi kết luận về "người dân TP.HCM".'
  loai: dinh-nghia
- trang: bang-chung/mau-va-chon-mau
  id: m29
  cau: "Hệ quả chung là khái quát hóa quá đà: lấy kết quả từ mẫu hẹp để nói về tổng thể rộng."
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m30
  cau: Henrich và cộng sự nhận xét rằng các nhà khoa học hành vi thường đưa ra kết luận rộng về tâm lý con người dựa trên mẫu chỉ từ các xã hội WEIRD.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m31
  cau: Năm 1936, tạp chí Literary Digest của Mỹ làm một cuộc thăm dò dư luận về cuộc bầu cử tổng thống, và dự đoán ứng viên Alf Landon sẽ thắng.
  loai: lich-su
- trang: bang-chung/mau-va-chon-mau
  id: m32
  cau: Roosevelt thắng với khoảng 61% phiếu phổ thông.
  loai: so-lieu
- trang: bang-chung/mau-va-chon-mau
  id: m33
  cau: 'Đoạn cũ: Roosevelt thắng là "một trong những chiến thắng cách biệt nhất lịch sử Mỹ".'
  loai: so-lieu
- trang: bang-chung/mau-va-chon-mau
  id: m34
  cau: Danh sách gửi phiếu của Literary Digest được lập từ danh bạ điện thoại và danh sách đăng ký ô tô.
  loai: lich-su
- trang: bang-chung/mau-va-chon-mau
  id: m35
  cau: Chỉ khoảng 24% người nhận phiếu trả lời.
  loai: so-lieu
- trang: bang-chung/mau-va-chon-mau
  id: m36
  cau: 'Đoạn cũ: "năm 1936, chỉ những gia đình khá giả mới có điện thoại và ô tô, và nhóm này nghiêng về đảng Cộng hòa của Landon".'
  loai: lich-su
- trang: bang-chung/mau-va-chon-mau
  id: m37
  cau: Squire (1988), dùng dữ liệu một khảo sát của Gallup năm 1937, kết luận rằng cả cách chọn mẫu lẫn việc ai trả lời đều lệch, và hai điều đó cộng lại tạo ra ước tính sai nặng nề.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m38
  cau: "Bài học: một mẫu lệch cho kết quả không chính xác, và chỉ thu thêm câu trả lời theo cùng một cách thì không sửa được thiên lệch ấy."
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m39
  cau: "Khi đọc bất kỳ con số khảo sát nào, tự hỏi 3 câu: ai được hỏi, họ được chọn thế nào, kết luận nói về ai."
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m40
  cau: Ai được hỏi? Độ tuổi, nghề nghiệp, khu vực, và cả việc họ được tuyển vào nghiên cứu bằng cách nào.
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m41
  cau: Họ được chọn thế nào? Ngẫu nhiên như rút thăm, hay tự đăng ký, hay tình cờ gặp ngoài đường?
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m42
  cau: Kết luận nói về ai? Nếu kết luận nói về một nhóm rộng hơn hẳn nhóm được hỏi, hãy cảnh giác.
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m43
  cau: Khảo sát 1.000 sinh viên tại một trường rồi kết luận về "giới trẻ" là mẫu hẹp, khái quát hóa quá đà.
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m44
  cau: Khảo sát online với 50.000 độc giả của một trang tin là tự chọn tham gia, dễ lệch theo chân dung độc giả của trang đó.
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m45
  cau: Thăm dò ngẫu nhiên 1.200 người dân trên cả nước là cách làm tốt, nhưng vẫn cần xem tiếp cách đặt câu hỏi.
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m46
  cau: Chỉ viết "một nghiên cứu cho thấy", không nói ai được hỏi thì không đánh giá được mẫu; đừng tin vội.
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m47
  cau: Kết quả của mẫu thuận tiện có thể rất tốt trong một số trường hợp; nếu có lý do để tin câu trả lời không phụ thuộc vào đặc điểm của mẫu, mẫu thuận tiện vẫn hữu ích.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m48
  cau: Henrich và cộng sự cho thấy khó biết trước câu trả lời có phụ thuộc vào đặc điểm của mẫu hay không.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m49
  cau: Ngay cả ở nhận thức thị giác, mức bị đánh lừa bởi ảo ảnh Müller-Lyer cũng khác nhau rõ giữa các xã hội, và sinh viên Mỹ nằm ở đầu cực.
  loai: so-lieu
- trang: bang-chung/mau-va-chon-mau
  id: m50
  cau: Mẫu lệch, không giống tổng thể, cho kết luận sai về tổng thể.
  loai: nhan
- trang: bang-chung/mau-va-chon-mau
  id: m51
  cau: Cuộc thăm dò Literary Digest 1936 là ví dụ lịch sử của nguyên tắc ấy.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m52
  cau: Kết quả từ mẫu WEIRD không thể mặc nhiên coi là đúng cho cả loài người.
  loai: nhan
- trang: bang-chung/mau-va-chon-mau
  id: m53
  cau: Henrich và cộng sự tổng hợp nhiều so sánh giữa các nhóm xã hội và thấy người WEIRD thường là ngoại lệ ở nhiều lĩnh vực.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m54
  cau: Bài của Henrich và cộng sự là một tổng quan, không phải phân tích tổng hợp, và mức khác biệt thay đổi theo từng hiệu ứng.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m55
  cau: Ở dự án Many Labs 2, các so sánh thăm dò giữa nhóm WEIRD và ít WEIRD giải thích rất ít khác biệt.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m56
  cau: "Không đại diện cho học viên nói chung: người đang học khác với người đã bỏ học giữa chừng, và nhóm bất mãn nhất có thể đã rời đi từ lâu; đây là dạng mẫu bỏ sót nhóm đã rời đi."
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m57
  cau: 'Không đại diện cho "giới trẻ Việt Nam": sinh viên thường học vấn cao hơn dân số chung, nên khác với người đã đi làm hay người không học đại học; mẫu chỉ nói được về sinh viên trường X.'
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: m58
  cau: "Không đại diện cho người tiêu dùng nói chung: chỉ những người chọn bình chọn mới có mặt trong mẫu, và người theo dõi trang của hãng có thể vốn đã thích thương hiệu; đây là mẫu tự chọn, thuận tiện, có khả năng lệch về phía tích cực."
  loai: loi-khuyen
- trang: bang-chung/mau-va-chon-mau
  id: q1
  cau: Một khảo sát thu được rất nhiều câu trả lời nhưng người trả lời được chọn theo cùng một cách lệch có thể sai nặng, vì mẫu lớn không tự sửa được thiên lệch chọn mẫu; cuộc thăm dò Literary Digest năm 1936 dự đoán sai người thắng cử, với danh sách gửi phiếu lệch và tỉ lệ trả lời khoảng 24%.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: q2
  cau: Bài báo của Henrich, Heine và Norenzayan không nói các nghiên cứu ấy làm sai; nó nói không có cơ sở chắc từ trước để coi một hiện tượng là phổ quát chỉ vì đã thấy ở một nhóm hẹp.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: q3
  cau: Mẫu tự chọn, chỉ gồm những người chọn trả lời, thuộc nhóm kết quả thường không đáng tin; một hãng chỉ đăng phiếu thăm dò trên trang của chính hãng sẽ có mẫu như vậy.
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m59
  cau: Bài báo WEIRD gợi ý rằng người phương Tây có thể là "ngoại lệ" chứ không phải "chuẩn mực".
  loai: phat-hien
- trang: bang-chung/mau-va-chon-mau
  id: m60
  cau: Các nhà nghiên cứu tâm lý học vẫn dùng sinh viên đại học làm mẫu, dù mẫu đó hẹp.
  loai: phat-hien
