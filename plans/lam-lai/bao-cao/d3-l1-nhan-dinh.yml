- trang: thi-nghiem/index
  id: p1
  cau: Mười lăm thí nghiệm này nổi tiếng trong tâm lý học.
  loai: lich-su
- trang: thi-nghiem/index
  id: p2
  cau: "Các thí nghiệm kinh điển sống hai cuộc đời: một trong sách giáo khoa và một trong phòng thí nghiệm, nơi các nhà nghiên cứu làm lại, soi xét và đôi khi lật ngược cách hiểu ban đầu."
  loai: lich-su
- trang: thi-nghiem/index
  id: p3
  cau: Một kết quả chưa từng được làm lại thì chưa thể coi là chắc; khi làm lại, nhiều kết quả yếu đi hoặc không còn, nên kết quả sống sót qua nhiều lần làm lại đáng tin hơn.
  loai: tai-lap
- trang: thi-nghiem/index
  id: p4
  cau: "Mẫu của các thí nghiệm kinh điển đều đặc thù: ví dụ 40 người đàn ông ở Yale (Milgram), trẻ ở một nhà trẻ của Stanford (Bandura), sinh viên Mỹ (Zimbardo)."
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n1
  cau: "Milgram (1963) đo người bình thường đi xa đến đâu khi một nhà khoa học yêu cầu giật điện người khác: 26 trên 40 người (65%) đi đến nấc 450V."
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n2
  cau: Người tham gia tin rằng mình dự một nghiên cứu về trí nhớ, có trả công, tại một trường đại học.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n3
  cau: Người tham gia bốc thăm và luôn trúng vai "thầy giáo" (vì bốc thăm gian lận); "học trò" là người cộng tác của Milgram.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n4
  cau: Mỗi khi học trò trả lời sai, thầy giáo bấm nút phạt bằng điện, mỗi lần tăng thêm một nấc.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n5
  cau: Học trò là một người đàn ông lịch sự (đa số người quan sát thấy anh ta hiền lành, dễ mến), ngồi phòng bên.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n6
  cau: Ở nấc 300V, học trò đập vào tường và không trả lời nữa; người thí nghiệm nói "Thí nghiệm yêu cầu anh tiếp tục".
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n7
  cau: Người thí nghiệm mặc áo choàng xám của kỹ thuật viên (không phải áo choàng trắng).
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n8
  cau: Người thí nghiệm là một giáo viên sinh học 31 tuổi.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n9
  cau: Khi được mô tả thí nghiệm, 14 sinh viên năm cuối ngành tâm lý ở Yale ước tính từ 0 đến 3 trên 100 người đi đến nấc cuối (trung bình 1,2).
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n10
  cau: Đồng nghiệp của Milgram cũng nghĩ hầu như không ai đi quá nấc "Rất mạnh" (Very Strong Shock).
  loai: lich-su
- trang: thi-nghiem/milgram
  id: n11
  cau: Cả sinh viên lẫn đồng nghiệp đều dự đoán sai rất xa so với kết quả.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n12
  cau: Máy giật điện (giả) có 30 nấc từ 15V đến 450V, tăng 15V mỗi nấc.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n13
  cau: 'Các nấc chia nhóm bằng nhãn từ "Shock nhẹ" đến "Nguy hiểm: giật mạnh"; hai nấc cuối chỉ đánh dấu XXX (nên nấc 450V không ghi "Nguy hiểm: giật mạnh").'
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n14
  cau: Người tham gia đổ mồ hôi, run, nói lắp, và có người cười gượng đến mức lên cơn co giật vì căng thẳng; tay vẫn bấm nút.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n15
  cau: "Vâng lời ở đây không hẳn là sự thản nhiên lạnh lùng: nhiều người căng thẳng rõ rệt; cách giải thích điều đó còn tranh cãi."
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n16
  cau: Milgram tuyển 40 người đàn ông tuổi 20–50, đủ nghề nghiệp, qua quảng cáo trên báo và thư mời gửi trực tiếp.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n17
  cau: Người tham gia được trả 4,5 đô la (và được nói rằng tiền ấy là của họ dù chuyện gì xảy ra).
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n18
  cau: Học trò do một kế toán viên 47 tuổi được huấn luyện cho vai đóng (không phải "diễn viên tên Wallace").
  loai: lich-su
- trang: thi-nghiem/milgram
  id: n19
  cau: Học trò trả lời sai theo kịch bản; không có phản hồi hay dấu hiệu phản đối nào cho đến nấc 300V; sau cú giật 315V tiếng đập tường lặp lại rồi anh ta im hẳn.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n20
  cau: Ở các biến thể về sau của Milgram (như Thí nghiệm 5), học trò bắt đầu kêu phản đối từ nấc 150V.
  loai: lich-su
- trang: thi-nghiem/milgram
  id: n21
  cau: 'Thí nghiệm 1963 có 4 câu thúc ép, dùng theo đúng thứ tự: "Xin hãy tiếp tục"; "Thí nghiệm yêu cầu anh tiếp tục"; "Điều tuyệt đối cần thiết là anh phải tiếp tục"; "Anh không còn lựa chọn nào khác, anh phải tiếp tục".'
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n22
  cau: 'Hai câu thúc ép đặc biệt: "Dù cú giật có thể đau, nó không gây tổn thương mô vĩnh viễn, xin anh tiếp tục" và "Dù học trò có muốn hay không, anh vẫn phải tiếp tục cho đến khi cậu ấy học thuộc hết các cặp từ".'
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n23
  cau: 26 trên 40 người (65%) đi đến 450V; 14 người dừng lại trong khoảng 300–375V.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n24
  cau: Tất cả 40 người đều đi đến 300V, nấc mà học trò đập vào tường và ngừng trả lời.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n25
  cau: Burger (2009) làm lại một phần Thí nghiệm 5 của Milgram, 45 năm sau, và dừng ở nấc 150V.
  loai: tai-lap
- trang: thi-nghiem/milgram
  id: n26
  cau: Trong Thí nghiệm 5, 79% những người đã vượt qua 150V (26 trên 33) đi tiếp đến 450V.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n27
  cau: Burger có 70 người trưởng thành, chia hai điều kiện; điều kiện cơ sở có 40 người.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n28
  cau: Ở điều kiện cơ sở, 70% (28/40) tiếp tục sau 150V, so với 82,5% ở Thí nghiệm 5 của Milgram; chênh lệch không có ý nghĩa thống kê.
  loai: tai-lap
- trang: thi-nghiem/milgram
  id: n29
  cau: Điều kiện thứ hai của Burger, trong đó người tham gia thấy một người khác từ chối, không làm khác đi so với điều kiện cơ sở.
  loai: tai-lap
- trang: thi-nghiem/milgram
  id: n30
  cau: Nam và nữ vâng lời như nhau trong lần làm lại của Burger.
  loai: tai-lap
- trang: thi-nghiem/milgram
  id: n31
  cau: 'Hiệu ứng "mù quáng" ngày nay: với chuẩn đạo đức hiện nay, thí nghiệm Milgram không còn được làm lại nguyên bản.'
  loai: lich-su
- trang: thi-nghiem/milgram
  id: n32
  cau: "Doliński và Grzyb (2017) ở Ba Lan: 80 người (40 nam, 40 nữ, tuổi 18–69), 10 nút, cường độ giảm nhẹ vì lý do đạo đức; 90% bấm đến nút cao nhất."
  loai: tai-lap
- trang: thi-nghiem/milgram
  id: n33
  cau: Doliński và Grzyb kết luận mức vâng lời cao tương tự các nghiên cứu gốc của Milgram; thiết kế khác bản gốc nên không so sánh trực tiếp được từng con số.
  loai: tai-lap
- trang: thi-nghiem/milgram
  id: n34
  cau: Ở Doliński và Grzyb, mẫu nhỏ nên chênh lệch theo giới tính của người tham gia và của học trò chưa kết luận được.
  loai: tai-lap
- trang: thi-nghiem/milgram
  id: n35
  cau: "Khá vững: áp lực quyền lực tạo ra mức vâng lời cao trong phòng thí nghiệm."
  loai: nhan
- trang: thi-nghiem/milgram
  id: n36
  cau: "Mức vâng lời thay đổi rất nhiều theo biến thể: trong 21 biến thể có đo việc đi đến 450V, tỉ lệ chung là 43,6% (740 người)."
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n37
  cau: Milgram làm 23 biến thể.
  loai: lich-su
- trang: thi-nghiem/milgram
  id: n38
  cau: 'Khá vững: nấc 150V là "điểm không quay đầu".'
  loai: nhan
- trang: thi-nghiem/milgram
  id: n39
  cau: "Đang tranh cãi: người ta vâng lời vì mù quáng hay vì tin vào mục đích."
  loai: nhan
- trang: thi-nghiem/milgram
  id: n40
  cau: Perry và cộng sự (2019) thấy trong 18 trên 23 biến thể, những người tin hoàn toàn rằng mình đang gây đau chỉ giật ở mức trung bình thấp hơn những người không tin hoàn toàn.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n41
  cau: Haslam, Reicher và cộng sự cho rằng người ta vâng lời vì đồng nhất với sứ mệnh khoa học ("engaged followership").
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n42
  cau: Cuộc tranh luận này chưa ngã ngũ.
  loai: nhan
- trang: thi-nghiem/milgram
  id: n43
  cau: "Trạng thái ủy nhiệm (Milgram): người ta trao trách nhiệm cho người có quyền lực và vì thế vâng lời."
  loai: dinh-nghia
- trang: thi-nghiem/milgram
  id: n44
  cau: Theo Reicher và cộng sự, những kẻ thi hành bạo quyền trong lịch sử thường chủ động đồng nhất với lãnh đạo và mục tiêu của họ.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n45
  cau: "Cam kết từng bước: mỗi nấc chỉ tăng 15V; giả thuyết là một bước nhỏ dễ chấp nhận hơn một bước nhảy vọt."
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n46
  cau: Khi chuyển ra văn phòng xập xệ ở Bridgeport, tỉ lệ vâng lời là 47,5%, so với 62,5% ở điều kiện tương ứng tại Yale.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n47
  cau: "Tính chính danh của bối cảnh: thí nghiệm được làm ở phòng thí nghiệm tương tác sang trọng của Yale, chi tiết quan trọng với tính chính danh của thí nghiệm."
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n48
  cau: "Vẻ chính danh: trong thí nghiệm, khi chuyển khỏi Yale sang một văn phòng ở Bridgeport, tỉ lệ vâng lời đến nấc cuối thấp hơn (47,5% so với 62,5%), dù vẫn gần một nửa. Những cuộc gọi xưng danh công an hay ngân hàng cũng mượn vẻ chính danh; đó là phép so sánh của trang, thí nghiệm Milgram không nghiên cứu lừa đảo."
  loai: loi-khuyen
- trang: thi-nghiem/milgram
  id: n49
  cau: Trong một biến thể của Milgram, khi hai người đóng vai "thầy giáo" khác từ chối tiếp tục, chỉ 4 trên 40 người tham gia thật vâng lời đến nấc cuối.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n50
  cau: Biết trước bốn câu thúc ép giúp ta nhận ra chúng khi gặp ngoài đời.
  loai: loi-khuyen
- trang: thi-nghiem/milgram
  id: n51
  cau: 'Câu "anh không còn lựa chọn nào khác" là lời thúc ép, không phải sự thật: 14 trong 40 người vẫn từ chối tiếp tục dù bị thúc ép.'
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n52
  cau: Milgram làm thí nghiệm ở Mỹ, Burger cũng ở Mỹ, Doliński và Grzyb ở Ba Lan.
  loai: lich-su
- trang: thi-nghiem/milgram
  id: n53
  cau: Tính đến 10/2026, chúng tôi chưa tìm thấy thí nghiệm kiểu Milgram trên người Việt.
  loai: thoi-su
- trang: thi-nghiem/milgram
  id: n54
  cau: "Không có dữ liệu thì không đoán mò: đây là khoảng trống đáng có một nghiên cứu Việt Nam."
  loai: loi-khuyen
- trang: thi-nghiem/milgram
  id: n55
  cau: Nhiều người tham gia căng thẳng rõ rệt và trong phỏng vấn sau đó họ nhấn mạnh mình không phải kiểu người thích làm đau người khác.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n56
  cau: Vâng lời trong thí nghiệm không cho phép kết luận về tính cách ngoài đời.
  loai: loi-khuyen
- trang: thi-nghiem/milgram
  id: n57
  cau: "Học trò không bị giật điện thật: máy giật điện là giả và học trò là người cộng tác của Milgram."
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n58
  cau: Trong biến thể của Milgram chỉ có phụ nữ, 26 trên 40 người cũng đi đến nấc cuối, giống nhóm nam.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n59
  cau: Thí nghiệm cho thấy sức mạnh của tình huống — và theo cách hiểu mới, sức mạnh của niềm tin vào một mục đích; hai bài học rất khác nhau.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n60
  cau: "Câu hỏi 1: 26 trên 40 người đi đến nấc tối đa; tất cả 40 người đi đến 300V, nấc mà học trò đập vào tường và ngừng trả lời."
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n61
  cau: "Câu hỏi 2: Burger chỉ làm đến 150V vì 79% người đã vượt qua 150V trong Thí nghiệm 5 đều đi tiếp đến 450V; dừng ở đó đỡ gây căng thẳng cho người tham gia."
  loai: tai-lap
- trang: thi-nghiem/milgram
  id: n62
  cau: "Câu hỏi 3: tỉ lệ tiếp tục 70% so với 82,5% chênh lệch không có ý nghĩa thống kê; Burger không thấy khác biệt giữa nam và nữ."
  loai: tai-lap
- trang: thi-nghiem/milgram
  id: n63
  cau: "Câu hỏi 4: Haslam và Reicher cho rằng người ta vâng lời vì đồng nhất với sứ mệnh khoa học (engaged followership); cách hiểu này thay đổi bài học."
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n64
  cau: "Câu hỏi 5: khi Milgram chuyển thí nghiệm khỏi Đại học Yale sang một văn phòng ở Bridgeport, tỉ lệ vâng lời đến nấc cuối thấp hơn: 47,5%, so với 62,5% ở điều kiện tương ứng tại Yale; lời giải thích: vẻ chính danh có tác dụng, nhưng gần một nửa vẫn đi đến nấc cuối."
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n65
  cau: 'Hình "milgram-obedience": cột 65% (26/40, đi đến 450V) và 35% (14/40, dừng ở 300–375V); chữ "Cả 40 người đều đi đến 300V, nấc mà học trò đập vào tường và ngừng trả lời"; chú thích và aria-label cùng số.'
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n69
  cau: 'Vì sao chỉ "khá vững": con số tổng hợp lấy từ các biến thể của chính Milgram, mỗi biến thể vài chục người; vì lý do đạo đức, hai lần làm lại hiện đại đều dừng sớm hơn nhiều so với bản gốc; và tư liệu lưu trữ cho thấy những người không tin hẳn vào màn kịch lại giật ở mức cao hơn (Perry và cộng sự, 2019), nên mức vâng lời thật có thể thấp hơn.'
  loai: nhan
- trang: thi-nghiem/asch
  id: n1
  cau: Asch (1951, 1956) cho người tham gia so sánh độ dài đường thẳng trước một nhóm "chim mồi" nói sai có chủ đích đồng loạt.
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n2
  cau: Trong các lượt gài bẫy, khoảng 37% (36,8%) câu trả lời hùa theo nhóm.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n3
  cau: Ba phần tư số người tham gia hùa theo ít nhất một lần.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n4
  cau: "Hãy tưởng tượng: nhóm 7 người, hai tấm bìa (một đường mẫu, ba đường so sánh đánh số 1, 2, 3), người tham gia thật trả lời gần cuối, hai lượt đầu ai cũng đúng, đến lượt thứ ba nhóm đồng loạt nói sai."
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n5
  cau: Ở Asch, nhóm có 7–9 người, trong đó chỉ một người là người tham gia thật.
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n6
  cau: Người tham gia thật là người trả lời gần cuối (ghế kế cuối).
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n7
  cau: "Cái giá của việc nói khác đi trở nên đắt đỏ: sợ bị chê cười, sợ mình nhìn nhầm, sợ trở thành kẻ lập dị."
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n8
  cau: Asch làm thí nghiệm vào đầu thập niên 1950, khi các nghiên cứu trước đó cho thấy ý kiến đổi rất dễ chỉ vì sức nặng của số đông hay uy tín; ông nghi ngờ rằng ý kiến "nhạt như nước" đến thế.
  loai: lich-su
- trang: thi-nghiem/asch
  id: n9
  cau: Đa số câu trả lời (63%) không hùa theo.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n10
  cau: "Khi làm một mình (nhóm đối chứng), người ta gần như không sai: 0,7% câu trả lời sai."
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n11
  cau: Thí nghiệm có tổng cộng 123 người tham gia thật, đều là nam sinh viên đại học, ở ba trường.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n12
  cau: Mỗi người làm 18 lượt so sánh độ dài đường thẳng; 12 lượt là "gài bẫy" (nhóm đồng loạt nói sai), 6 lượt trung tính.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n13
  cau: Ở các lượt gài bẫy, các chim mồi đồng loạt đưa ra cùng một đáp án sai rõ ràng (chênh từ 3/4 đến 1 3/4 inch).
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n14
  cau: "Bài toán dễ: người so sánh đường thẳng một mình gần như không sai (đối chứng 95% người không sai lần nào)."
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n15
  cau: "Hộp hồ sơ, dòng Kết quả chính: 36,8% câu trả lời hùa theo nhóm sai (đối chứng 0,7%), khoảng ba phần tư số người hùa theo ít nhất một lần."
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n16
  cau: Khoảng 25% số người không bao giờ hùa theo.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n17
  cau: Nhóm 3 người đã tạo ra gần như toàn bộ áp lực; thêm người nữa không tăng đáng kể (Asch, 1955).
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n18
  cau: Chỉ cần một người cùng phòng nói đúng, tỉ lệ sai còn khoảng một phần tư so với khi cả nhóm nhất trí.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n19
  cau: 'Bond và Smith (1996) lưu ý kết luận "3 người là đủ" của Asch về sau bị thách thức: quy mô nhóm vẫn có liên hệ với mức hùa theo.'
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n20
  cau: Bond và Smith (1996) gộp 133 nghiên cứu dùng bài toán so sánh đường thẳng kiểu Asch, thực hiện ở 17 quốc gia.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n21
  cau: Ở Mỹ, mức hùa theo giảm dần kể từ những nghiên cứu của Asch ở thập niên 1950.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n22
  cau: Một số tác giả gắn mức hùa theo cao ở thập niên 1950 và xu hướng giảm sau đó với bối cảnh chính trị – xã hội từng thời kỳ.
  loai: lich-su
- trang: thi-nghiem/asch
  id: n23
  cau: Các nước văn hóa tập thể hùa theo nhiều hơn các nước văn hóa cá nhân; mối liên hệ có ý nghĩa ở cả ba cách đo văn hóa (Hofstede, Schwartz, Trompenaars).
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n24
  cau: Franzen và Mader (2023) làm lại thí nghiệm Asch với 210 người, mỗi nhóm có 5 chim mồi, thấy tỉ lệ sai 33%, khớp với kết quả gốc.
  loai: tai-lap
- trang: thi-nghiem/asch
  id: n25
  cau: Khi người tham gia được thưởng tiền cho câu trả lời đúng, tỉ lệ sai giảm còn 25%, nhưng ảnh hưởng của nhóm vẫn còn.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n26
  cau: "Vững chắc: một nhóm nhất trí làm lệch phán đoán công khai, kể cả với bài toán rõ ràng."
  loai: nhan
- trang: thi-nghiem/asch
  id: n27
  cau: "Khá vững: văn hóa tập thể hùa theo nhiều hơn văn hóa cá nhân."
  loai: nhan
- trang: thi-nghiem/asch
  id: n28
  cau: Phân tích của Bond và Smith dựa trên so sánh giữa các quốc gia, tức dữ liệu tương quan cấp quốc gia, không phải thí nghiệm ngẫu nhiên; không cho phép kết luận "văn hóa gây ra" sự khác biệt.
  loai: nhan
- trang: thi-nghiem/asch
  id: n29
  cau: 'Đang tranh cãi: người hùa theo có thật sự "nhìn" khác đi không.'
  loai: nhan
- trang: thi-nghiem/asch
  id: n30
  cau: "Asch (1956) thấy người hùa theo có những phản ứng rất khác nhau: số rất ít không nhận ra mình bị nhóm ảnh hưởng; một tỉ lệ đáng kể hùa theo khi lòng tin vào mắt mình bị lung lay; số khác không còn quan tâm đúng sai, chỉ muốn khỏi tỏ ra khác biệt."
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n31
  cau: Asch thừa nhận không thể xác lập mức độ méo mó tri giác thật sự; ông cho rằng méo mó nhiều khả năng xảy ra ở khâu phán đoán.
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n32
  cau: "Ảnh hưởng chuẩn mực: hùa theo để được chấp nhận, tránh bị chê cười hay tẩy chay."
  loai: dinh-nghia
- trang: thi-nghiem/asch
  id: n33
  cau: Trong thí nghiệm Asch, kiểu "chỉ muốn khỏi tỏ ra khác biệt" có thật, nhưng nhiều người làm theo lại tự kết luận mắt mình sai.
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n34
  cau: "Ảnh hưởng thông tin: khi bài toán khó hoặc mơ hồ, ta coi phản ứng của người khác là manh mối về đáp án đúng."
  loai: dinh-nghia
- trang: thi-nghiem/asch
  id: n35
  cau: Bài toán của Asch rất dễ, vậy mà nhiều người làm theo vẫn tự kết luận mắt mình sai.
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n36
  cau: Khi vấn đề mơ hồ hơn, ta càng có lý do dựa vào người khác — ví dụ xem đánh giá nhà hàng trước khi chọn quán.
  loai: dinh-nghia
- trang: thi-nghiem/asch
  id: n37
  cau: Nhiều người được phỏng vấn sau thí nghiệm kể rằng họ sợ nhóm không tán thành hay cho mình là lập dị.
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n38
  cau: Nếu sếp nêu ý kiến trước rồi hỏi "mọi người thấy sao?", tình huống ấy gợi lại thí nghiệm Asch (phép loại suy, chưa kiểm trực tiếp).
  loai: loi-khuyen
- trang: thi-nghiem/asch
  id: n39
  cau: Trong một biến thể của Asch, khi người tham gia trả lời bằng văn bản thay vì nói công khai, số lỗi giảm còn khoảng một phần ba (14 người).
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n40
  cau: Thí nghiệm 4 của Asch không thử tính ẩn danh hay thứ tự phát biểu; mẫu chỉ 14 người.
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n41
  cau: Lượt thích và bình luận có sẵn trên mạng xã hội là một dạng "ý kiến của số đông" nhìn thấy trước khi tự đánh giá; đây là phép loại suy, không phải kết quả của thí nghiệm Asch.
  loai: loi-khuyen
- trang: thi-nghiem/asch
  id: n42
  cau: Theo Asch (1955), khi có một người cùng phòng nói đúng, người tham gia sai chỉ khoảng một phần tư so với khi cả nhóm nhất trí.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n43
  cau: Theo Bond và Smith, các nước văn hóa tập thể hùa theo cao hơn.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n44
  cau: Nếu người Việt coi trọng hòa hợp nhóm, ta có thể dự đoán mức hùa theo cao hơn mặt bằng phương Tây; đó chỉ là dự đoán từ mô hình.
  loai: loi-khuyen
- trang: thi-nghiem/asch
  id: n45
  cau: Việt Nam không nằm trong số các nước của phân tích Bond và Smith.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n46
  cau: Tính đến 10/2026, chúng tôi chưa tìm thấy nghiên cứu dùng bài toán Asch trên người Việt.
  loai: thoi-su
- trang: thi-nghiem/asch
  id: n47
  cau: Văn hóa của một nước không đồng nhất, nên con số thật cho người Việt vẫn là một dấu hỏi.
  loai: loi-khuyen
- trang: thi-nghiem/asch
  id: n48
  cau: '"37% nghĩa là 37% số người luôn hùa theo": sai; 37% là tỉ lệ câu trả lời hùa theo trong các lượt gài bẫy.'
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n49
  cau: Trong 123 người, 29 người (khoảng một phần tư) không sai lần nào; số lỗi trung bình là 4,4 trên 12 lượt gài bẫy.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n50
  cau: Asch nhận xét rằng phần lớn các phán đoán là độc lập, bằng chứng là sức nặng của điều mắt thấy lớn hơn sức ép của đa số.
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n51
  cau: "Lần làm lại 2023 (210 người) đo trí thông minh, lòng tự trọng, nhu cầu được tán thành và năm đặc điểm tính cách lớn: ngoài tính cởi mở, không đặc điểm nào liên hệ thuyết phục với việc hùa theo."
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n52
  cau: "Câu hỏi 1: 37% là tỉ lệ câu trả lời trong các lượt gài bẫy, không phải tỉ lệ người; khoảng một phần tư số người không hùa theo lần nào và số lỗi trung bình là 4,4 trên 12 lượt."
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n53
  cau: "Câu hỏi 2: yếu tố làm giảm mạnh nhất áp lực hùa theo là có một người trong nhóm phá vỡ sự nhất trí bằng cách trả lời đúng; nhóm 3 người nhất trí đã tạo gần hết áp lực."
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n54
  cau: "Câu hỏi 3: Bond và Smith (1996) thấy mức hùa theo ở Mỹ giảm dần theo thời gian và các nước văn hóa tập thể hùa theo nhiều hơn các nước văn hóa cá nhân; 133 nghiên cứu ở 17 quốc gia."
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n55
  cau: "Câu hỏi 4: người hùa theo có thể xuất phát từ những cơ chế khác nhau (tin nhóm đúng và mình sai, hay chỉ muốn khỏi tỏ ra khác biệt); thí nghiệm gốc không tách bạch được."
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n56
  cau: "Câu hỏi 5: trong một biến thể của Asch, trả lời bằng văn bản làm số lỗi giảm còn khoảng một phần ba (mẫu nhỏ); ghi ý kiến trước khi nghe nhau là một cách hợp lý."
  loai: loi-khuyen
- trang: thi-nghiem/asch
  id: n60
  cau: "Một số nghiên cứu sau này lại nghiêng về phía tri giác: khi người tham gia hùa theo nhóm trong một bài xoay hình trong đầu, hoạt động của một mạng vùng não ở thùy chẩm và thùy đỉnh thay đổi (Berns và cộng sự, 2005); hai thí nghiệm dùng mô hình tách các bước của quyết định thấy ý kiến của nhóm làm đổi cách tiếp nhận thông tin từ mắt, chứ không chỉ đổi ngưỡng trả lời (Germar và cộng sự, 2014); đó là nghiên cứu riêng lẻ, với bài toán khác bài của Asch, nên câu hỏi còn mở."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n1
  cau: "Darley và Latané (1968): càng đông người chứng kiến, mỗi cá nhân càng ít khả năng giúp đỡ (mô tả của trang)."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n2
  cau: "Hiệu ứng người ngoài cuộc (bystander effect): càng đông người chứng kiến một tình huống khẩn cấp, mỗi cá nhân càng ít khả năng can thiệp."
  loai: dinh-nghia
- trang: thi-nghiem/darley-latane
  id: n3
  cau: "Phân tán trách nhiệm: trách nhiệm được chia cho những người có mặt; ở một mình, trách nhiệm hoàn toàn thuộc về bạn."
  loai: dinh-nghia
- trang: thi-nghiem/darley-latane
  id: n4
  cau: 'Vô tri tập thể (pluralistic ignorance): ai cũng nhìn người khác để đoán tình hình; thấy mọi người ngồi yên, mỗi người kết luận "chắc không nghiêm trọng".'
  loai: dinh-nghia
- trang: thi-nghiem/darley-latane
  id: n5
  cau: "Sợ bị đánh giá: người ta lo đứng dậy báo động rồi hóa ra chuyện nhỏ, làm mình thành trò cười; trong thí nghiệm co giật, người tham gia lo phản ứng quá mức."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n6
  cau: "Người không can thiệp thường không vô cảm: họ run tay, đổ mồ hôi, và còn đang phân vân giữa hai cái giá phải trả."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n7
  cau: Mỗi người ngồi một phòng riêng, thảo luận nhóm qua loa (hệ thống nội bộ) về các vấn đề của sinh viên.
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n8
  cau: Giữa buổi, một "người tham gia" (thật ra là băng ghi âm) lên cơn co giật kiểu động kinh, van xin giúp đỡ.
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n9
  cau: "Biến số chính là số người mà người tham gia thật tin là có trong nhóm: chỉ họ và nạn nhân, thêm 1 người khác, hay thêm 4 người khác."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n10
  cau: 85% người tưởng mình ở một mình biết hoàn cảnh nạn nhân đã báo cho người thí nghiệm trước khi nạn nhân bị ngắt tiếng; chỉ 31% khi tưởng có 4 người khác.
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n11
  cau: "Nhóm đông can thiệp chậm hơn hẳn: thời gian trung bình 52 giây (2 người), 93 giây (3 người), 166 giây (6 người)."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n12
  cau: Sau cùng 6 phút, mọi người trong nhóm 2 người đều báo, nhưng chỉ 62% trong nhóm 6 người từng báo.
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n13
  cau: Cùng một tiếng kêu cứu, cùng một con người, chỉ khác niềm tin về số người xung quanh.
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n14
  cau: "Hộp hồ sơ, dòng Thiết kế và Người tham gia: sinh viên đại học; người tham gia thật tin rằng chỉ mình mình nghe thấy, hay còn 1 hoặc 4 người khác cùng nghe."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n15
  cau: "Thí nghiệm khói (Latané và Darley, 1968): người tham gia (nam sinh viên Đại học Columbia) ngồi điền phiếu trong một phòng chờ; khói phụt vào phòng qua một lỗ thông gió trên tường."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n16
  cau: "Ở một mình: 75% (18 trong 24 người) đi báo khói trong vòng 6 phút kể từ lúc nhận ra khói."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n17
  cau: "Ngồi cùng hai người lạ thật (cũng là người tham gia): chỉ 3 trong 8 nhóm (38%) có người báo khói."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n18
  cau: "Ngồi cùng hai diễn viên được dặn nhìn khói rồi nhún vai, tiếp tục điền phiếu: 10% (1 trong 10 người)."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n19
  cau: 9 người còn lại ngồi trong căn phòng đầy dần khói, ho, dụi mắt, mở cửa sổ, nhưng không đi báo.
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n20
  cau: "Theo tính toán của hai tác giả, nếu ba người không ảnh hưởng gì đến nhau thì hơn 98% số nhóm phải có ít nhất một người báo. Tính theo từng người: 3 trong 24 người báo khói."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n21
  cau: 'Ô thu gọn: khi ngồi cùng hai người lạ cũng "không biết gì" như mình (không phải diễn viên), chỉ 3 trong 8 nhóm (38%) có người báo khói.'
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n22
  cau: "Câu hỏi đoán ở phần Tự trải nghiệm: khi ở một mình, 75% số người đứng dậy đi báo khói trong vòng 6 phút kể từ lúc nhận ra khói."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n23
  cau: "Để giải thích hiệu ứng, Latané và Darley (1970) đề xuất mô hình 5 bước (theo Fischer và cộng sự, 2011, kể lại): nhận thấy sự việc, hiểu đó là khẩn cấp, nhận trách nhiệm, tin mình biết cách giúp, quyết định giúp."
  loai: lich-su
- trang: thi-nghiem/darley-latane
  id: n24
  cau: "Ở mỗi bước đầu, người chứng kiến có thể rời khỏi quá trình và không giúp. Sự có mặt của người khác cản được ở nhiều bước: trong thí nghiệm khói, người ngồi cùng người khác nhận ra khói chậm hơn (trong 5 giây đầu: 63% người ngồi một mình, 26% người ngồi cùng người khác) và dễ hiểu khói là vô hại; trong thí nghiệm co giật, trách nhiệm bị chia."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n25
  cau: "Trong khung Vững chắc: còn những quá trình tâm lý nào đứng sau hiệu ứng thì, theo Fischer và cộng sự, các nghiên cứu vẫn chưa rõ ràng."
  loai: nhan
- trang: thi-nghiem/darley-latane
  id: n26
  cau: "Fischer và cộng sự (2011): phân tích tổng hợp gộp 105 hiệu ứng từ hơn 7.700 người tham gia, từ thập niên 1960 đến 2010; độ lớn tổng thể g = −0,35."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n27
  cau: Hiệu ứng yếu đi khi tình huống được nhận là nguy hiểm, có kẻ gây hại có mặt, hoặc cái giá của việc can thiệp là rủi ro thể chất.
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n28
  cau: "Mô hình kích thích–chi phí–phần thưởng: tình huống nguy hiểm được nhận ra nhanh và rõ hơn là khẩn cấp thật, nên kích thích sinh lý cao hơn và người ta giúp nhiều hơn; khớp với phát hiện của Fischer."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n29
  cau: "Vững chắc: sự hiện diện của người khác làm giảm khả năng và tốc độ giúp đỡ trong tình huống khẩn cấp mập mờ."
  loai: nhan
- trang: thi-nghiem/darley-latane
  id: n30
  cau: "Philpot và cộng sự (2020): trong 219 xung đột công cộng quay bằng camera ở Anh, Hà Lan và Nam Phi, 9 trên 10 vụ có ít nhất một người ra tay giúp; càng đông người chứng kiến thì càng dễ có ai đó giúp."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n31
  cau: "Khá vững: khi nguy hiểm rõ ràng, hiệu ứng yếu đi."
  loai: nhan
- trang: thi-nghiem/darley-latane
  id: n32
  cau: Phân tích tổng hợp của Fischer và cộng sự dựa trên mã hóa lại các nghiên cứu cũ, không phải thí nghiệm mới có đối chứng ngẫu nhiên cho từng yếu tố điều chỉnh.
  loai: nhan
- trang: thi-nghiem/darley-latane
  id: n33
  cau: 'Đang tranh cãi → Đã bị bác bỏ: câu chuyện "38 nhân chứng đứng nhìn không làm gì" trong vụ Kitty Genovese.'
  loai: nhan
- trang: thi-nghiem/darley-latane
  id: n34
  cau: Vụ án mạng năm 1964 ở New York, với con số "38 nhân chứng", là chuyện mở đầu của bài báo năm 1968 của Darley và Latané.
  loai: lich-su
- trang: thi-nghiem/darley-latane
  id: n35
  cau: Manning, Levine và Collins (2007) không thấy bằng chứng cho 38 nhân chứng, cho việc họ nhìn thấy vụ án, hay cho việc họ đứng yên không làm gì.
  loai: lich-su
- trang: thi-nghiem/darley-latane
  id: n36
  cau: "Nếu bạn cần giúp, hãy gọi đích danh một người thay vì hỏi chung: trong một nghiên cứu ở 400 phòng chat trên mạng (Markey, 2000), lời nhờ có gọi tên được trả lời nhanh hơn (trung bình khoảng 36 giây so với 52 giây), và phòng đông người không còn làm chậm câu trả lời; đó là lời nhờ nhỏ trên mạng, không phải tình huống khẩn cấp."
  loai: loi-khuyen
- trang: thi-nghiem/darley-latane
  id: n37
  cau: "Nếu bạn là người chứng kiến, nói với người bên cạnh về điều đang xảy ra: trong thí nghiệm khói, người ta đoán tình hình qua vẻ bình thản của người xung quanh; theo Fischer và cộng sự (2011), khi những người chứng kiến là người thật và trao đổi thật với nhau, có thêm người chứng kiến thậm chí làm tăng việc giúp đỡ."
  loai: loi-khuyen
- trang: thi-nghiem/darley-latane
  id: n38
  cau: Theo Fischer và cộng sự (2011) kể lại, Beaman và cộng sự (1978) thấy sinh viên đã nghe giảng về hiệu ứng người ngoài cuộc về sau can thiệp vào một tình huống khẩn cấp nhiều hơn sinh viên chưa nghe.
  loai: loi-khuyen
- trang: thi-nghiem/darley-latane
  id: n39
  cau: Tính đến 10/2026, chúng tôi chưa tìm thấy thí nghiệm kiểu Darley–Latané trên người Việt.
  loai: thoi-su
- trang: thi-nghiem/darley-latane
  id: n40
  cau: "Cách nhìn nhân từ hơn cho cảnh đám đông đứng xem ở Việt Nam là giả thuyết cần kiểm tra: có thể nhiều người muốn giúp nhưng đang chờ nhau."
  loai: loi-khuyen
- trang: thi-nghiem/darley-latane
  id: n41
  cau: Trong thí nghiệm co giật, nhiều người không can thiệp vẫn run tay, đổ mồ hôi và còn phân vân; Darley và Latané cho rằng họ chưa quyết định không giúp.
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n42
  cau: Ngoài đời, ở mức cả đám đông, đông người làm tăng khả năng có ai đó giúp (Philpot 2020).
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n43
  cau: "Trong tình huống mập mờ, ở mức cá nhân, đông người thì mỗi người ít giúp hơn: nghịch lý mà Darley và Latané phát hiện."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n44
  cau: "Câu hỏi 1: kết quả thí nghiệm khói: 75% (một mình), 38% (hai người lạ thật), 10% (hai diễn viên dửng dưng)."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n45
  cau: 'Câu hỏi 2: vô tri tập thể nghĩa là ai cũng nhìn người khác để đoán tình hình, thấy mọi người ngồi yên nên kết luận "chắc không sao"; lời giải thích: trong thí nghiệm khói, người không báo nói rằng họ đã kết luận khói không phải là lửa, và vẻ bình thản của người xung quanh dẫn họ tới cách hiểu ấy.'
  loai: dinh-nghia
- trang: thi-nghiem/darley-latane
  id: n46
  cau: "Câu hỏi 3: mô hình 5 bước (nhận thấy, hiểu là khẩn cấp, nhận trách nhiệm, tin mình biết cách giúp, quyết định giúp); lời giải thích: vấp ở bất kỳ bước nào là không có hành động; sự có mặt của người khác có thể cản ở nhiều bước."
  loai: lich-su
- trang: thi-nghiem/darley-latane
  id: n47
  cau: "Câu hỏi 4: Fischer và cộng sự (2011) thấy hiệu ứng vẫn còn (g = −0,35) nhưng yếu đi khi nguy hiểm rõ ràng, chẳng hạn khi có kẻ gây hại có mặt."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n48
  cau: "Câu hỏi 5: trong nghiên cứu ở phòng chat của Markey (2000), lời nhờ có gọi đích danh một người được trả lời nhanh hơn hỏi chung cả phòng; phòng đông người không còn làm chậm câu trả lời, còn hỏi chung thì phòng càng đông câu trả lời càng đến chậm."
  loai: loi-khuyen
- trang: thi-nghiem/darley-latane
  id: n49
  cau: 'Hình "bystander-smoke": tỉ lệ báo khói trong vòng 6 phút: một mình 75%; cùng 2 người lạ 38% (tính theo nhóm, 3/8 nhóm); cùng 2 diễn viên dửng dưng 10%; chú thích và aria-label cùng số.'
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n54
  cau: Phỏng vấn sau thí nghiệm khói, những người không báo đều nói họ đã gạt ý nghĩ đó là lửa; nhiều người đoán là hơi nước hay hơi máy điều hòa.
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n55
  cau: Trong nghiên cứu của Markey (2000), 400 phòng chat được chọn ngẫu nhiên; lời nhờ có gọi tên được trả lời sau trung bình khoảng 36 giây, lời nhờ chung sau khoảng 52 giây.
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n1
  cau: Simons và Chabris (1999) cho người xem đếm đường chuyền bóng; khoảng một nửa không thấy một sự kiện bất ngờ đi qua (46% trong 192 người).
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n2
  cau: Với con khỉ đột ở video thường (opaque), khi đếm tổng số đường chuyền của đội áo trắng, 58% (7 trên 12 người) không thấy.
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n3
  cau: "Người tham gia xem video 75 giây: ba người áo trắng và ba người áo đen chuyền bóng rổ."
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n4
  cau: "Nhiệm vụ: đếm tổng số đường chuyền chỉ của đội áo trắng, hoặc chỉ của đội áo đen (bản dễ); hoặc đếm riêng chuyền bổng và chuyền sệt (bản khó)."
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n5
  cau: Sau khoảng 44–48 giây, một người mặc đồ khỉ đột đi xuyên qua giữa các cầu thủ trong 5 giây.
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n6
  cau: Trong một nửa số video, nhân vật bất ngờ là một phụ nữ cầm ô; trong nửa kia là phụ nữ mặc đồ khỉ đột.
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n7
  cau: Dữ liệu dùng là của 192 người xem, hầu hết là sinh viên đại học, mỗi người chỉ làm một điều kiện (sau khi loại 36 người).
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n8
  cau: Trong một biến thể riêng với 12 người xem, con khỉ đột dừng lại vỗ ngực trong video 62 giây, sự kiện kéo dài 9 giây; 50% thấy, tương tự bản thường (42%).
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n9
  cau: Người đếm đường chuyền đội áo đen thấy khỉ đột nhiều hơn người đếm đội áo trắng (58% so với 27%); với người cầm ô thì không có khác biệt như vậy (62% so với 69%).
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n10
  cau: Ta dễ nhận ra thứ giống (chia sẻ đặc điểm cơ bản như màu sắc) với thứ ta đang chú ý.
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n11
  cau: "Nhiệm vụ càng tốn sức (đếm riêng chuyền bổng và chuyền sệt), càng ít người thấy: 64% thấy ở bản dễ so với 45% ở bản khó."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n12
  cau: Thí nghiệm gốc dùng thuật ngữ "mù không chú ý kéo dài cho sự kiện động" (sustained inattentional blindness for dynamic events).
  loai: dinh-nghia
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n13
  cau: "Mù không chú ý (inattentional blindness): khi chú ý dồn vào một việc, người ta có thể không thấy những thứ bất ngờ nhưng nổi bật ngay trước mắt."
  loai: dinh-nghia
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n14
  cau: "Mù thay đổi (change blindness): người ta không nhận ra cả những thay đổi lớn giữa hai lần nhìn một cảnh."
  loai: dinh-nghia
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n15
  cau: "Levin và Simons (1997): người xem phim ngắn không nhận ra những thay đổi lộ liễu giữa các cảnh quay, kể cả khi diễn viên duy nhất trong cảnh biến thành người khác ngay lúc đổi góc máy."
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n16
  cau: "Simons và Levin (1998): một nhà nghiên cứu bắt chuyện với người đi đường; giữa chừng bị lén thay bằng một người khác; chỉ khoảng một nửa số người đi đường nhận ra; việc nhận ra phụ thuộc vào nhóm xã hội."
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n17
  cau: "Hyman và cộng sự (2010): người vừa đi bộ vừa nói chuyện điện thoại ít nhận ra chú hề đi xe đạp một bánh dọc lối đi hơn những người đi một mình, nghe nhạc hay đi theo cặp."
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n18
  cau: Nói chuyện điện thoại khi đi bộ đã có thể gây mù không chú ý; nghiên cứu không đo việc lái xe.
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n19
  cau: "Drew và cộng sự (2013): 83% trong 24 bác sĩ X-quang không thấy hình con khỉ đột (to gấp 48 lần nốt phổi trung bình) gắn vào ảnh CT phổi."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n20
  cau: "Ekelund và cộng sự (2022): phân tích tổng hợp 14 nghiên cứu (1.153 người): 62% người mới và 56% chuyên gia bị mù không chú ý; chuyên môn chỉ giảm nhẹ và không rõ."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n21
  cau: "Nobre và cộng sự (2020): tổng hợp 59 thí nghiệm cho thấy thứ không được chú ý và không được báo vẫn có thể được xử lý ngầm."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n22
  cau: "Chabris và cộng sự (2011): trong thí nghiệm mô phỏng ngoài đời, ban ngày 56% người chạy đuổi theo một người nhận ra vụ đánh nhau dàn dựng, ban đêm 35%; tăng gánh nặng chú ý làm giảm số người thấy."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n23
  cau: 'Herslund và Jørgensen (2003): tài xế ô tô nói không thấy xe đạp trên đường ưu tiên dù xe đạp rõ ràng ("looked-but-failed-to-see").'
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n24
  cau: "Caird và cộng sự (2014): tổng hợp 28 thí nghiệm (977 người) cho thấy gõ và đọc tin nhắn khi lái xe làm xấu đi khả năng phát hiện kích thích, thời gian phản ứng, va chạm và việc giữ làn."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n25
  cau: Vì vậy đừng nhắn tin khi lái xe.
  loai: loi-khuyen
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n26
  cau: Vừa đi vừa nói chuyện điện thoại làm giảm khả năng nhận ra thứ bất ngờ; đó là lý do để ngẩng lên và chú ý ở vạch sang đường.
  loai: loi-khuyen
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n27
  cau: Trong thí nghiệm mô phỏng ngoài đời, chỉ 35% (ban đêm) đến 56% (ban ngày) người chạy ngang qua vụ đánh nhau dàn dựng để ý thấy nó.
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n28
  cau: "Chuyên môn không miễn nhiễm: 83% bác sĩ X-quang không thấy con khỉ đột; tổng hợp 14 nghiên cứu thấy chuyên môn chỉ giảm nhẹ tỉ lệ mù."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n29
  cau: Levin và cộng sự (2000) gọi việc đánh giá quá cao khả năng phát hiện thay đổi của chính mình là "mù về mù thay đổi" (change blindness blindness).
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n30
  cau: "Chú ý có giới hạn: nhiệm vụ càng tốn sức thì càng ít người thấy vật bất ngờ."
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n31
  cau: "Vững chắc: chú ý tập trung khiến ta bỏ lỡ những thứ bất ngờ, kể cả thứ rất lộ liễu."
  loai: nhan
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n32
  cau: "Khá vững: nhiệm vụ càng nặng, vật càng khác thứ ta đang chú ý, càng dễ bị bỏ lỡ."
  loai: nhan
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n33
  cau: "Khá vững: mù không chú ý cũng xảy ra ngoài đời thật, nhưng chưa rõ áp dụng đến đâu cho nhân chứng."
  loai: nhan
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n34
  cau: Tính đến 10/2026, chúng tôi chưa tìm thấy nghiên cứu mù không chú ý trên người Việt.
  loai: thoi-su
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n35
  cau: Không có dữ liệu Việt Nam; mô tả "nhìn mà không thấy" ở Đan Mạch có thể gợi ý cho giao thông đông xe máy ở Việt Nam, nhưng đó là suy luận.
  loai: loi-khuyen
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n36
  cau: Trong thí nghiệm gốc, khoảng một nửa người xem không thấy; Levin và cộng sự (2000) gọi việc đánh giá quá cao khả năng phát hiện thay đổi của chính mình là "mù về mù thay đổi".
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n37
  cau: Phần lớn bác sĩ X-quang bỏ lỡ con khỉ đột đã nhìn thẳng vào vị trí của nó.
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n38
  cau: Gõ và đọc tin nhắn khi lái xe làm xấu đi khả năng phát hiện, thời gian phản ứng, va chạm và việc giữ làn.
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n39
  cau: "Câu hỏi 1: khoảng một nửa (46% trong thí nghiệm gốc) người xem không để ý đến sự kiện bất ngờ."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n40
  cau: "Câu hỏi 2: Simons và Chabris thấy người đếm đội áo đen thấy khỉ đột nhiều hơn (58% so với 27%), nhưng không thấy ở người cầm ô."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n41
  cau: "Câu hỏi 3: trong thí nghiệm ngoài đời của Simons và Levin (1998), khoảng một nửa số người đi đường nhận ra người bắt chuyện đã bị thay."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n42
  cau: "Câu hỏi 4: người nói chuyện điện thoại ít nhận ra chú hề hơn các nhóm đi một mình, nghe nhạc, đi theo cặp."
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n43
  cau: "Câu hỏi 5: não có thể bỏ lỡ cả thứ ngay trước mắt khi đang bận việc khác; vì vậy đừng nhắn tin khi lái xe và đừng giả định rằng người ta phải thấy mình."
  loai: loi-khuyen
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n44
  cau: 'Hình/ô trong video: sáu người chia hai đội áo trắng, áo đen chuyền bóng rổ; số đường chuyền "12… 13… 14… 15" là minh họa giả định.'
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: h1
  cau: "Hộp hồ sơ: nghiên cứu gốc là Haney, Banks và Zimbardo, 1973."
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: h2
  cau: "Hộp hồ sơ: 24 nam sinh viên được chọn từ hơn 70 người đăng ký, bốc thăm vai cai tù hoặc tù nhân (21 người tham gia)."
  loai: so-lieu
- trang: thi-nghiem/zimbardo
  id: h3
  cau: "Hộp hồ sơ: nhà tù giả dựng ở tầng hầm của khoa Tâm lý, kế hoạch 2 tuần."
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: h4
  cau: "Hộp hồ sơ: dừng sau 6 ngày; cai tù quấy rối leo thang, một số tù nhân được cho ra sớm."
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n1
  cau: 'Thí nghiệm nhà tù Stanford năm 1971: tình nguyện viên là nam sinh viên, trả tiền theo ngày để tham gia một "nghiên cứu tâm lý về đời sống nhà tù".'
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n2
  cau: Quảng cáo trên báo trả 15 đô la mỗi ngày.
  loai: so-lieu
- trang: thi-nghiem/zimbardo
  id: n3
  cau: Có hơn 70 người đăng ký (75 theo báo cáo gốc).
  loai: so-lieu
- trang: thi-nghiem/zimbardo
  id: n4
  cau: 24 người được đánh giá ổn định nhất sau phỏng vấn và kiểm tra tâm lý được chọn và bốc thăm ngẫu nhiên vào vai cai tù hoặc tù nhân; cuối cùng 21 người tham gia (10 tù nhân, 11 cai tù).
  loai: so-lieu
- trang: thi-nghiem/zimbardo
  id: n5
  cau: Thí nghiệm dựng nhà tù giả ở tầng hầm tòa nhà tâm lý của Đại học Stanford.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n6
  cau: Tù nhân bị cảnh sát Palo Alto thật đến tận nhà bắt, còng tay, khám người, rồi mặc áo choàng và đánh số thay tên.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n7
  cau: Cai tù mặc đồng phục, đeo kính râm phản chiếu, cầm dùi cui.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n8
  cau: "Nhóm nghiên cứu nhấn mạnh một điều cấm với cai tù: không dùng bạo lực thân thể (còn lại, vai của cai tù khá ít chỉ dẫn trong báo cáo gốc)."
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n9
  cau: Thí nghiệm dự kiến kéo dài 2 tuần nhưng dừng sau 6 ngày.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n10
  cau: Thí nghiệm diễn ra vào tháng 8/1971.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n11
  cau: Một số cai tù chửi rủa, bắt tù nhân đếm số lúc nửa đêm và nhốt vào "cái hố", một tủ tối chật hẹp.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n12
  cau: 'Câu hỏi mở của trang: những gì xảy ra có chứng minh "tình huống biến người bình thường thành kẻ ác" hay không vẫn chưa có đáp án thống nhất; một cách hiểu là kết quả phần lớn đến từ cách thí nghiệm được dàn dựng và hướng dẫn cho người tham gia.'
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n13
  cau: Chỉ sau vài ngày, theo báo cáo gốc, cai tù hành xử hung hăng và tù nhân suy sụp, thụ động.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n14
  cau: Thí nghiệm Zimbardo là một trong những nghiên cứu nổi tiếng nhất, và cũng thuộc nhóm bị tranh cãi nhiều nhất, của tâm lý học.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n15
  cau: Gần nửa thế kỷ sau, hồ sơ lưu trữ được mở và người tham gia cũ được phỏng vấn lại.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n16
  cau: Zimbardo tự đóng vai quản giáo (Superintendent) của nhà tù giả.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n17
  cau: Sau 2 ngày, tù nhân nổi loạn; cai tù trả đũa bằng quấy rối leo thang.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n18
  cau: Cai tù nhận hướng dẫn chi tiết về cách đối xử với tù nhân trong buổi định hướng.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n19
  cau: "Một số tù nhân được cho ra sớm: báo cáo gốc ghi 5 người vì suy sụp cảm xúc nặng hoặc phát ban."
  loai: so-lieu
- trang: thi-nghiem/zimbardo
  id: n20
  cau: Theo Le Texier (2019), khoảng hai trong 10 tù nhân thật sự có triệu chứng suy sụp thần kinh; nói "một nửa suy sụp phải cho ra sớm" là cường điệu.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n21
  cau: Theo hồ sơ lưu trữ, một tù nhân (Korpi) đã tính trước việc tỏ ra suy sụp để được ra.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n22
  cau: Một tù nhân tuyệt thực.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n23
  cau: Nhà tâm lý học Christina Maslach đến thăm, sốc trước những gì chứng kiến, đối chất với Zimbardo, và ông dừng thí nghiệm vào ngày thứ 6.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n24
  cau: 'Kết luận của nhóm nghiên cứu: vai trò xã hội và bối cảnh nhà tù đã đẩy ít nhất một phần ba cai tù đến chỗ hung hăng, hạ nhục tù nhân hơn mức dự đoán, và đẩy nhiều tù nhân vào thụ động, phụ thuộc, trầm cảm; theo họ, đó là sức mạnh của "tình huống" hơn "tính cách".'
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n25
  cau: Thibault Le Texier là nhà xã hội học, lục lại kho lưu trữ của thí nghiệm và phỏng vấn 15 người từng tham gia.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n26
  cau: Cai tù hung hăng nhất, biệt danh "John Wayne" (David Eshleman), sau này thừa nhận mình đang diễn một nhân vật.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n28
  cau: Dữ liệu thí nghiệm được thu thập và trình bày có chọn lọc.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n29
  cau: Ý tưởng thí nghiệm vay mượn từ một "thí nghiệm nhà tù" do sinh viên trong lớp của Zimbardo làm thử vài tháng trước đó.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n30
  cau: "Kết luận của Le Texier: đây là một nghiên cứu có quá nhiều sai sót về phương pháp, đến mức giá trị khoa học của nó bị đặt nghi vấn."
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n31
  cau: Reicher và Haslam dựng một "nhà tù" tương tự cho chương trình truyền hình BBC, kéo dài 8 ngày với 15 nam tham gia.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n32
  cau: Nghiên cứu BBC có hội đồng đạo đức duyệt và hai nhà tâm lý học lâm sàng độc lập theo dõi suốt thời gian.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n33
  cau: Cai tù trong nghiên cứu BBC không được hướng dẫn cách hành xử; chỉ cấm bạo lực thể xác và nêu quyền cơ bản của tù nhân.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n34
  cau: Ở nghiên cứu BBC, cai tù không đồng nhất với vai trò, ngần ngại dùng quyền lực và cuối cùng bị tù nhân lấn át.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n35
  cau: Tù nhân BBC đoàn kết và lập một hệ thống bình đẳng; khi hệ thống này sụp đổ vì bất lực, một số người mới tính đến một chế độ độc đoán và gặp sự kháng cự ngày càng yếu.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n36
  cau: "Kết luận của Reicher và Haslam: bạo lực không phải hệ quả tự động của vai trò và tình huống; điều khiến sự tàn ác trở nên chấp nhận được là sự bất lực và thất bại của các nhóm."
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n37
  cau: "Nhãn Vững chắc: những sự kiện cơ bản của thí nghiệm là có thật."
  loai: nhan
- trang: thi-nghiem/zimbardo
  id: n38
  cau: Thí nghiệm có ghi chép và quay phim; không bên nào phủ nhận các sự kiện cốt lõi.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n39
  cau: Số tù nhân thật sự suy sụp được cho ra sớm còn tranh cãi.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n40
  cau: 'Nhãn Đang tranh cãi: kết luận gốc "tình huống biến người bình thường thành tàn ác".'
  loai: nhan
- trang: thi-nghiem/zimbardo
  id: n41
  cau: Zimbardo và các cộng sự, trong phản hồi năm 2020, vẫn bảo vệ sức mạnh của môi trường phi nhân tính.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n42
  cau: Le Texier, Reicher và Haslam cho rằng kết quả bị thổi phồng bởi hướng dẫn của người thí nghiệm, diễn xuất và dữ liệu chọn lọc, và khi làm lại với thiết kế khác thì bạo lực không tự động xuất hiện; Haslam, Reicher và Van Bavel (2019) cũng theo hướng này dựa trên hồ sơ lưu trữ.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n43
  cau: Phần lớn các phân tích gần đây dựa trên hồ sơ lưu trữ hoặc thiết kế lại đều hoài nghi kết luận gốc.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n44
  cau: 'Nhãn Khá vững: mẫu người tham gia không đại diện cho "người bình thường".'
  loai: nhan
- trang: thi-nghiem/zimbardo
  id: n45
  cau: Carnahan và McFarland (2007) đăng lại quảng cáo "nghiên cứu về đời sống nhà tù" và thấy người đăng ký ghi điểm cao hơn ở các thang đo hung hăng, độc đoán, Machiavelli, ái kỷ, xu hướng thống trị xã hội, và thấp hơn ở đồng cảm và vị tha, so với người đăng ký một nghiên cứu tâm lý bình thường.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n46
  cau: Chính các tác giả Carnahan và McFarland nói hệ quả của kết quả với thí nghiệm Stanford vẫn chỉ là phỏng đoán, và kết quả nghiêng về cách giải thích có cả người lẫn tình huống.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n47
  cau: 'Nhãn Đã bị bác bỏ: "Zimbardo bịa đặt toàn bộ, thí nghiệm chưa từng xảy ra".'
  loai: nhan
- trang: thi-nghiem/zimbardo
  id: n48
  cau: Phê bình khoa học nhắm vào phương pháp và cách diễn giải (dàn dựng, hướng dẫn của người thí nghiệm, trình bày chọn lọc), không phủ nhận sự kiện cốt lõi.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n49
  cau: "Sức mạnh của tình huống (Zimbardo): vai trò xã hội và bối cảnh thể chế có thể lấn át tính cách cá nhân; đây là cách diễn giải gốc."
  loai: dinh-nghia
- trang: thi-nghiem/zimbardo
  id: n50
  cau: 'Đặc tính nhu cầu (demand characteristics) và diễn xuất: người tham gia đoán được nhà nghiên cứu muốn gì (đặc biệt khi được hướng dẫn trực tiếp) và "diễn" cho tròn vai.'
  loai: dinh-nghia
- trang: thi-nghiem/zimbardo
  id: n51
  cau: 'Cai tù "John Wayne" là ví dụ: Eshleman nói mình diễn vì cho rằng làm vậy tốt hơn cho nghiên cứu (hung hăng vì nghĩ đó là điều được kỳ vọng).'
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n52
  cau: "Lãnh đạo bản sắc (Reicher và Haslam): vai trò tự nó chưa đủ gây tàn ác, trừ khi người lãnh đạo khiến người thực hiện đồng nhất với một mục tiêu cao cả của nhóm và tin hành động là cần thiết; theo Haslam, Reicher và Van Bavel (2019), hồ sơ SPE cho thấy nhóm thí nghiệm trực tiếp khuyến khích cai tù tỏ ra cứng rắn."
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n53
  cau: "Tự chọn lọc mẫu: hiệu ứng có thể một phần bắt nguồn từ việc những người hung hăng, độc đoán hơn đã tự tìm đến thí nghiệm."
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n54
  cau: Kết luận "hoàn cảnh xô đẩy" đang bị tranh cãi, nên chưa thể dùng nó để gỡ trách nhiệm cá nhân; ở Stanford ít nhất một số cai tù làm theo hướng dẫn và tự nhận đang diễn.
  loai: loi-khuyen
- trang: thi-nghiem/zimbardo
  id: n55
  cau: Theo kết luận gốc của Zimbardo (đang bị tranh cãi), đồng phục, chức danh và "luật bất thành văn" của nhóm có thể khiến người ta làm điều bình thường họ không làm; theo nhóm BBC, điều đáng để ý là nhóm đang đồng nhất với điều gì và người lãnh đạo khơi gợi điều gì.
  loai: loi-khuyen
- trang: thi-nghiem/zimbardo
  id: n56
  cau: Một câu chuyện hấp dẫn có thể sống trong sách giáo khoa hàng chục năm dù bằng chứng gốc có nhiều điểm yếu; khi gặp kết quả "gây sốc", hãy hỏi đã ai làm lại được chưa và mẫu có đại diện không.
  loai: loi-khuyen
- trang: thi-nghiem/zimbardo
  id: n57
  cau: Tính đến 10/2026, chưa tìm thấy nghiên cứu nào tương tự thí nghiệm Zimbardo trên người Việt.
  loai: thoi-su
- trang: thi-nghiem/zimbardo
  id: n58
  cau: Một thí nghiệm giam người, gây căng thẳng tâm lý như của Zimbardo ngày nay khó có thể được phê duyệt theo chuẩn mực đạo đức nghiên cứu hiện hành.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n59
  cau: Le Texier (2019) chỉ ra rằng phần lớn tác giả sách giáo khoa tâm lý học bỏ qua các phê bình về thí nghiệm Zimbardo và kể lại một phiên bản chưa qua kiểm chứng.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n60
  cau: 'Điều chắc chắn hơn kết luận "ai cũng có thể thành kẻ ác": trong một nhà tù giả được dàn dựng, một số người đã hành xử tàn nhẫn thật.'
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n61
  cau: Ngay trong báo cáo gốc, ít nhất một phần ba cai tù hung hăng hơn mức dự đoán; số còn lại gồm người "cứng nhưng công bằng" và một vài người thụ động.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n62
  cau: Thí nghiệm gần như không thể làm lại nguyên văn ngày nay vì lý do đạo đức; vì vậy tranh luận dựa vào hồ sơ lưu trữ và thiết kế thay thế như BBC Prison Study.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n63
  cau: "Phê bình Le Texier không có nghĩa Zimbardo nói dối toàn bộ: phê bình nhắm vào tính khoa học của thiết kế và cách diễn giải."
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: q1a
  cau: Thí nghiệm dự kiến 2 tuần, dừng sau 6 ngày vì cai tù hành xử tàn nhẫn và tù nhân suy sụp tinh thần.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: q1b
  cau: Thí nghiệm dự kiến 14 ngày nhưng dừng vào ngày thứ 6, sau khi Christina Maslach đến thăm và đối chất với Zimbardo.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: q2a
  cau: Le Texier chỉ ra cai tù đã nhận hướng dẫn chi tiết về cách đối xử với tù nhân, và cai tù hung hăng nhất ("John Wayne") thừa nhận mình đang diễn.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: q2b
  cau: Le Texier không phủ nhận các sự kiện đã xảy ra; ông chỉ ra sai sót về phương pháp (hướng dẫn cho cai tù, diễn xuất, dữ liệu thu thập chọn lọc) khiến giá trị khoa học bị đặt nghi vấn.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: q3a
  cau: "BBC Prison Study cho kết quả ngược: cai tù không đồng nhất với vai trò, ngần ngại dùng quyền lực; bạo lực không phải hệ quả tự động của vai trò và tình huống."
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: q3b
  cau: Điều khiến sự tàn ác trở nên "chấp nhận được" là sự bất lực của tập thể và vai trò của người lãnh đạo, không phải chiếc áo cai tù.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: q4b
  cau: Các sự kiện cơ bản là vững chắc; điều chưa ngã ngũ là ý nghĩa của chúng; phần lớn các phân tích gần đây hoài nghi kết luận gốc.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: q5a
  cau: 'Bài học ứng dụng đúng đắn: đừng dùng "sức mạnh tình huống" để biện minh cho hành vi sai trái; khi gặp kết quả khoa học gây sốc, hãy hỏi đã ai làm lại được chưa và mẫu có đại diện không.'
  loai: loi-khuyen
- trang: thi-nghiem/zimbardo
  id: q5b
  cau: Câu chuyện hấp dẫn nhưng mong manh đã sống trong sách giáo khoa gần nửa thế kỷ.
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: h1
  cau: "Hộp hồ sơ: nghiên cứu gốc là Rosenthal và Jacobson, 1968."
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: h2
  cau: 'Hộp hồ sơ: học sinh 18 lớp của một trường tiểu học; khoảng 20% mỗi lớp được chọn ngẫu nhiên làm "kẻ nở muộn".'
  loai: so-lieu
- trang: thi-nghiem/pygmalion
  id: h3
  cau: 'Hộp hồ sơ: giáo viên được báo danh sách "kẻ nở muộn"; 8 tháng sau cả lớp làm lại bài kiểm tra IQ.'
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: h4
  cau: 'Hộp hồ sơ: nhóm "nở muộn" tăng gần 4 điểm IQ tổng và khoảng 7 điểm IQ lập luận nhiều hơn nhóm đối chứng.'
  loai: so-lieu
- trang: thi-nghiem/pygmalion
  id: d1
  cau: Rosenthal và Jacobson (1968) báo với giáo viên tiểu học rằng khoảng 20% học sinh, thực ra được chọn ngẫu nhiên, là "kẻ nở muộn", rồi đo lại điểm IQ của các em sau 8 tháng.
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: n1
  cau: 'Theo báo cáo gốc, sau 8 tháng nhóm "nở muộn" tăng điểm IQ nhiều hơn nhóm đối chứng: gần 4 điểm IQ tổng và khoảng 7 điểm IQ lập luận.'
  loai: so-lieu
- trang: thi-nghiem/pygmalion
  id: n2
  cau: Các em được chọn ngẫu nhiên, nên khác biệt không do các em thông minh hơn từ đầu.
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: n3
  cau: Các tác giả giải thích rằng khác biệt là do kỳ vọng của giáo viên.
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: n4
  cau: Nghiên cứu gốc bị phê bình nặng về dữ liệu.
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: e1
  cau: Pygmalion là nhà điêu khắc trong truyện thần thoại do Ovid kể (Metamorphoses, quyển 10), đem lòng yêu bức tượng do chính mình tạc nên, và tượng hóa thành người thật.
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: e2
  cau: Thầy cô trong nghiên cứu không biết danh sách là ngẫu nhiên, và không ai bảo họ phải ưu ái nhóm "nở muộn".
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: e3
  cau: "Theo cách giải thích của Rosenthal, kỳ vọng có thể len lỏi qua những hành vi nhỏ: ấm áp hơn, phản hồi rõ hơn, giao bài nhiều và khó hơn, cho nhiều cơ hội hơn; đây là cơ chế được đề xuất, mức tác động thực tế còn tranh cãi."
  loai: dinh-nghia
- trang: thi-nghiem/pygmalion
  id: r1
  cau: 'Rosenthal và Fode (1963): sinh viên trong một lớp tâm lý học được giao mỗi người năm con chuột huấn luyện chạy mê cung chữ T; một nửa được bảo chuột thuộc dòng "thông minh mê cung", nửa còn lại dòng "đần mê cung".'
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: r2
  cau: 'Thực ra không có dòng "thông minh" hay "đần": các nhóm chuột bạch được gắn nhãn ngẫu nhiên (chỉ giới hạn để tuổi trung bình các nhóm gần nhau).'
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: r3
  cau: 'Chuột của nhóm sinh viên tin mình nuôi chuột "thông minh" chọn đúng nhánh mê cung nhiều hơn rõ rệt (gộp năm ngày: p một phía = 0,01).'
  loai: so-lieu
- trang: thi-nghiem/pygmalion
  id: r4
  cau: Các sinh viên này đánh giá chuột của mình sáng dạ hơn, sạch hơn, thuần hơn, dễ chịu hơn.
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: r5
  cau: Các sinh viên này tự mô tả mình thoải mái, thân thiện, khích lệ hơn, và cầm chuột nhiều hơn, nhẹ nhàng hơn (riêng điểm cầm nắm mới đạt p = 0,09, hai phía, chưa có ý nghĩa thống kê).
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: r6
  cau: Các tác giả cho rằng kỳ vọng của người huấn luyện, dù bịa đặt, đã thay đổi cách họ đối xử với chuột, và điều đó có thể đã ảnh hưởng đến kết quả.
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: r7
  cau: Rosenthal thử ý tưởng này trên chuột bạch trước khi vào lớp học.
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: j1
  cau: Rosenthal bắt tay với Lenore Jacobson để làm, tại trường tiểu học của bà, thí nghiệm nổi tiếng nhất về kỳ vọng của giáo viên.
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: j2
  cau: Tháng 5/1964, toàn bộ học sinh của trường làm một bài kiểm tra, được giới thiệu với giáo viên là "Bài kiểm tra Harvard về khả năng tiếp thu" (Harvard Test of Inflected Acquisition); đầu năm học mới giáo viên của 18 lớp (từ lớp 1 đến lớp 6) nhận danh sách "kẻ nở muộn".
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: j3
  cau: Mỗi giáo viên nhận danh sách khoảng 20% học sinh trong lớp được "dự đoán sẽ bứt phá trí tuệ trong năm học"; danh sách chọn hoàn toàn ngẫu nhiên.
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: j4
  cau: Bài kiểm tra thực chất là một bài IQ thông thường (Tests of General Ability, có phần từ vựng và phần lập luận).
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: j5
  cau: Trong sách, trường được gọi là "trường Oak".
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: j6
  cau: Tám tháng sau, học sinh làm lại bài kiểm tra.
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: j7
  cau: 'Nhóm "nở muộn" tăng điểm nhiều hơn nhóm đối chứng: gần 4 điểm IQ tổng và khoảng 7 điểm IQ lập luận.'
  loai: so-lieu
- trang: thi-nghiem/pygmalion
  id: j8
  cau: Hiệu ứng xuất hiện chủ yếu ở các em nhỏ tuổi hơn (lớp 1 và lớp 2).
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: j9
  cau: Theo tóm tắt của Raudenbush, cuối năm giáo viên đánh giá nhóm "nở muộn" tò mò hơn về trí tuệ, vui vẻ hơn và thích nghi tốt hơn nhóm đối chứng.
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: b1
  cau: Raudenbush gom 18 thí nghiệm về kỳ vọng giáo viên (kể cả nghiên cứu gốc) làm một phân tích tổng hợp.
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: b2
  cau: 19 cỡ hiệu ứng từ 18 nghiên cứu độc lập được đưa về cùng một thước đo.
  loai: so-lieu
- trang: thi-nghiem/pygmalion
  id: b3
  cau: Hiệu ứng trung bình là 0,11, nhỏ, và có đạt ý nghĩa thống kê hay không còn tùy cách kiểm định.
  loai: so-lieu
- trang: thi-nghiem/pygmalion
  id: b4
  cau: "Hiệu ứng mạnh nhất khi kỳ vọng được gieo lúc giáo viên chưa quen học sinh: 4 thí nghiệm không có tiếp xúc trước cho 0,32, 3 thí nghiệm có một tuần tiếp xúc trước cho 0,26; sau hơn hai tuần (8 thí nghiệm) hiệu ứng gần như biến mất (−0,04)."
  loai: so-lieu
- trang: thi-nghiem/pygmalion
  id: b5
  cau: Thí nghiệm gốc gây chấn động nhưng cũng gây tranh cãi dữ dội.
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: nv
  cau: "Nhãn Vững chắc: kỳ vọng của người khác có thể tự ứng nghiệm."
  loai: nhan
- trang: thi-nghiem/pygmalion
  id: nv2
  cau: Tổng quan 345 nghiên cứu của Rosenthal và Rubin (1978), được Raudenbush dẫn lại, cho thấy kỳ vọng của người quan sát hay người huấn luyện có thể ảnh hưởng đến kết quả ở nhiều bối cảnh, trong đó có lớp học; thí nghiệm chuột bạch Rosenthal và Fode (1963) là một ví dụ.
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: nv3
  cau: Tổng quan 35 năm của Jussim và Harber (2005) kết luận lời tiên tri tự ứng nghiệm trong lớp học có xảy ra, nhưng thường nhỏ.
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: nk
  cau: "Nhãn Khá vững: kỳ vọng của giáo viên ảnh hưởng kết quả học sinh, nhưng hiệu ứng nhỏ và có điều kiện."
  loai: nhan
- trang: thi-nghiem/pygmalion
  id: nk2
  cau: Phân tích tổng hợp của Raudenbush cho cỡ hiệu ứng trung bình 0,11 lên điểm IQ; hiệu ứng chỉ rõ rệt khi kỳ vọng được tạo lúc giáo viên chưa có ấn tượng riêng về học sinh; Jussim và Harber (2005) cũng thấy tác động thường nhỏ.
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: nt
  cau: 'Nhãn Đang tranh cãi: con số gốc có đáng tin, và kỳ vọng "đúng" hay "tự ứng nghiệm".'
  loai: nhan
- trang: thi-nghiem/pygmalion
  id: nt2
  cau: 'Thorndike (1968): điểm "IQ" lập luận trung bình của học sinh lớp 1 chỉ là 58 (một lớp có trung bình 31), nên các kết luận của sách không được dữ liệu đỡ vững.'
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: nt3
  cau: Phân tích lại dữ liệu gốc, Snow (1995) thấy khoảng 35% điểm của học sinh lớp 1–2 nằm ngoài khoảng chuẩn của bài kiểm tra và hiệu ứng biến mất khi bỏ năm em có điểm cực đoan.
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: nt4
  cau: "Jussim và Harber (2005) cho rằng nhiều chỉ trích về độ tin cậy của bài kiểm tra còn yếu hơn chính nghiên cứu gốc: độ tin cậy thấp làm khó, chứ không dễ, tìm ra khác biệt giữa các nhóm."
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: nt5
  cau: Jussim và Harber (2005) cho rằng kỳ vọng của giáo viên thường dự đoán đúng kết quả học sinh, nhưng có thể nhiều hơn là vì chúng chính xác chứ không phải vì tự ứng nghiệm.
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: l1
  cau: "Lời tiên tri tự ứng nghiệm: kỳ vọng ban đầu (dù sai) khiến người ta hành xử theo cách làm cho nó thành đúng."
  loai: dinh-nghia
- trang: thi-nghiem/pygmalion
  id: l2
  cau: "Bốn kênh của Rosenthal: (1) sự ấm áp, (2) đầu vào (dạy nhiều hơn, giao bài khó hơn), (3) cơ hội thể hiện, (4) phản hồi rõ ràng, tích cực hơn; theo Jussim và Harber, giáo viên thường đối xử với học sinh được kỳ vọng cao theo những cách này, nhưng việc các hành vi ấy làm thay đổi thành tích là cơ chế được giả định."
  loai: dinh-nghia
- trang: thi-nghiem/pygmalion
  id: l3
  cau: 'Kỳ vọng chính xác (Jussim): giáo viên giỏi đọc đúng học sinh nên "tiên đoán" đúng mà không cần tác động; thực tế cả hai cơ chế cùng tồn tại, một phần chính xác, một phần tự ứng nghiệm.'
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: l4
  cau: "Hiệu ứng ngược: kỳ vọng thấp cũng có thể tự ứng nghiệm theo hướng xấu; hiệu ứng mạnh có thể xảy ra có chọn lọc ở học sinh thuộc nhóm bị kỳ thị, còn việc nó gây hại nhiều hơn lợi hay không thì chưa rõ."
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: a1
  cau: Các tổng quan mô tả giáo viên thường ấm áp hơn, phản hồi rõ hơn, giao bài nhiều và khó hơn, cho nhiều cơ hội hơn với học sinh mình kỳ vọng cao; vì tác động của kỳ vọng nhỏ nhưng có thể có thật, nên tránh dán nhãn cố định cho một đứa trẻ.
  loai: loi-khuyen
- trang: thi-nghiem/pygmalion
  id: a2
  cau: Quy luật "gieo kỳ vọng lúc mới quen" của Raudenbush được kiểm trên học sinh, không phải nhân viên; áp vào chỗ làm với người mới mới chỉ là suy luận hợp lý, chưa phải bằng chứng.
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: a3
  cau: Kỳ vọng của người khác có thể đóng một phần vào kết quả của bạn, thường là phần nhỏ, chứ không quyết định năng lực của bạn.
  loai: loi-khuyen
- trang: thi-nghiem/pygmalion
  id: v1
  cau: Tính đến 10/2026, chưa tìm thấy thí nghiệm nào về kỳ vọng giáo viên trên học sinh Việt Nam.
  loai: thoi-su
- trang: thi-nghiem/pygmalion
  id: v2
  cau: Jussim và Harber (2005) nêu một nghiên cứu (Smith và cộng sự, 1998) thấy hiệu ứng tự ứng nghiệm ở các lớp xếp theo năng lực không mạnh hơn ở lớp hỗn hợp.
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: g1
  cau: "Kỳ vọng không phải phép thuật: theo cách giải thích của Rosenthal nó chỉ tác động qua hành vi của người lớn, và các tổng quan thấy tác động này thường nhỏ."
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: g2
  cau: Điểm tăng trong nghiên cứu gốc là điểm trên một bài kiểm tra cụ thể, và chính bài kiểm tra ấy bị phê bình; phân tích tổng hợp thấy hiệu ứng trung bình lên điểm IQ chỉ nhỏ (0,11), và Jussim và Harber cho rằng việc kỳ vọng làm thay đổi trí tuệ vẫn chưa rõ.
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: g3
  cau: Thầy cô không biết danh sách là ngẫu nhiên và không ai bảo họ thiên vị; nếu kỳ vọng có tác động thì đó là tác động mà thầy cô không hề cố ý.
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: g4
  cau: Kỳ vọng thấp cũng có thể tự ứng nghiệm; hiệu ứng mạnh có thể xảy ra có chọn lọc ở học sinh thuộc nhóm bị kỳ thị, còn việc nó gây hại nhiều hơn lợi hay không thì chưa rõ.
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: q1a
  cau: Danh sách học sinh "sắp bứt phá" được chọn hoàn toàn ngẫu nhiên khoảng 20% học sinh mỗi lớp, rồi được báo với giáo viên là các em được dự đoán sẽ tiến bộ vượt bậc.
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: q1b
  cau: Nếu có khác biệt về sau thì nó không thể đến từ năng lực ban đầu của học sinh, vì danh sách là ngẫu nhiên; việc khác biệt ấy có đáng tin hay không còn phụ thuộc chất lượng số đo.
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: q2a
  cau: Sau 8 tháng, nhóm "nở muộn" hơn nhóm đối chứng gần 4 điểm IQ tổng và khoảng 7 điểm IQ lập luận.
  loai: so-lieu
- trang: thi-nghiem/pygmalion
  id: q2b
  cau: Con số đủ lớn để gây chấn động năm 1968, nhưng cũng chính con số này về sau bị soi kỹ vì bài kiểm tra đầu vào có vấn đề.
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: q3a
  cau: Theo phân tích tổng hợp của Raudenbush, hiệu ứng mạnh nhất khi kỳ vọng được tạo lúc giáo viên chưa quen học sinh (chưa hoặc mới tiếp xúc khoảng một tuần); hiệu ứng trung bình chung chỉ khoảng 0,11.
  loai: so-lieu
- trang: thi-nghiem/pygmalion
  id: q3b
  cau: Giáo viên đã có ấn tượng riêng thì thông tin bịa đặt gần như vô tác dụng; kỳ vọng chỉ "gieo" được trên mảnh đất trống.
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: q4a
  cau: 'Phê bình nổi tiếng nhất nhắm vào nghiên cứu gốc: bài kiểm tra đầu vào có vấn đề (điểm ban đầu thấp phi lý, như "IQ" lập luận trung bình 58 ở lớp 1), nên các kết luận của sách không được dữ liệu đỡ vững (Thorndike, 1968).'
  loai: phat-hien
- trang: thi-nghiem/pygmalion
  id: q4b
  cau: "Bài học phải khiêm tốn: hiệu ứng có thể xảy ra nhưng thường nhỏ, còn con số gốc thì đáng ngờ."
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: q5a
  cau: Theo tổng kết 35 năm của Jussim và Harber (2005), kỳ vọng thường dự đoán đúng kết quả, nhưng có thể nhiều hơn là vì chúng chính xác (giáo viên đọc đúng năng lực) chứ không chỉ vì tự ứng nghiệm; hiệu ứng tự ứng nghiệm thường nhỏ.
  loai: lich-su
- trang: thi-nghiem/pygmalion
  id: q5b
  cau: Kỳ vọng có tác động thật, nhưng khiêm tốn, và một phần "tiên đoán đúng" đơn giản là vì thầy cô nhìn người chuẩn.
  loai: lich-su
- trang: thi-nghiem/robbers-cave
  id: h1
  cau: "Hộp hồ sơ: nghiên cứu gốc là Sherif và cộng sự, 1954 (xuất bản 1961)."
  loai: lich-su
- trang: thi-nghiem/robbers-cave
  id: h2
  cau: "Hộp hồ sơ: 22 bé trai khoảng 11 tuổi ở Oklahoma City, xếp thành hai nhóm 11 em tương đương nhau."
  loai: so-lieu
- trang: thi-nghiem/robbers-cave
  id: h3
  cau: "Hộp hồ sơ: ba giai đoạn ở trại hè: hình thành nhóm, cạnh tranh có thắng có thua, rồi mục tiêu chung."
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: h4
  cau: "Hộp hồ sơ: thù địch bùng lên ở giai đoạn cạnh tranh, rồi dịu đi sau các nhiệm vụ chung."
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: t1
  cau: Chỉ sau vài ngày cạnh tranh, hai nhóm gọi nhau bằng những biệt danh miệt thị, phá hoại đồ đạc của nhau, đốt cờ đối phương và ẩu đả.
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: t2
  cau: Hai nhóm được xếp tương đương nhau ngay từ đầu, không phải chia hoàn toàn ngẫu nhiên.
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: t3
  cau: Trại hè kéo dài ba tuần với 22 bé trai; tuần đầu hai nhóm ở riêng; sau đó có giải đấu bóng chày, kéo co, truy tìm kho báu, đội thắng nhận cúp, huy chương và dao, đội thua không nhận gì.
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: e1
  cau: Thù địch giữa các nhóm không nhất thiết cần đến khác biệt văn hóa, tôn giáo hay lịch sử thù hằn; ở trại hè này, để hai nhóm trẻ tương đương nhau thành "phe ta" và "phe địch" trong cạnh tranh có thắng có thua đã đủ để định kiến mọc lên rất nhanh.
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: e2
  cau: Một hoàn cảnh được sắp đặt khéo cũng có thể làm thù địch dịu đi đáng kể.
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: s1
  cau: Trại hè diễn ra mùa hè 1954 ở một trại Hướng đạo rộng 200 mẫu nằm trong Công viên Bang Robbers Cave, Oklahoma, trong ba tuần.
  loai: lich-su
- trang: thi-nghiem/robbers-cave
  id: s2
  cau: Các em là 22 bé trai khoảng 11 tuổi (tuổi trung bình 11 tuổi 1 tháng), học sinh lớp 5 học tốt từ các gia đình Tin Lành trung lưu ở Oklahoma City, không quen biết nhau từ trước.
  loai: so-lieu
- trang: thi-nghiem/robbers-cave
  id: s3
  cau: Hai nhóm 11 em được xếp càng tương đương nhau càng tốt về chiều cao, cân nặng, năng khiếu thể thao, độ nổi tiếng, kỹ năng trại, bơi lội và kinh nghiệm cắm trại; nhóm nào theo nhà quan sát nào được quyết định bằng tung đồng xu.
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: s4
  cau: Không em nào biết mình tham gia một thí nghiệm tâm lý học; các nhà nghiên cứu đóng vai nhân viên trại (quan sát viên làm chú hướng dẫn cấp cao), âm thầm quan sát và ghi chép.
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: s5
  cau: "Giai đoạn 1 kéo dài khoảng một tuần (7–8 ngày): hai nhóm ở tách biệt, không biết đến sự tồn tại của nhau, cùng hoạt động gắn kết như dựng lán, đi bộ, bơi lội."
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: s6
  cau: Mỗi nhóm đặt tên (Rattlers và Eagles) vào những ngày cuối giai đoạn 1, có cờ, và có thủ lĩnh dần nổi lên.
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: s7
  cau: "Giai đoạn 2: hai nhóm biết đến sự có mặt của nhau và một giải đấu được tổ chức: bóng chày, kéo co, truy tìm kho báu, với cúp, huy chương và dao chỉ dành cho đội thắng."
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: s8
  cau: "Giai đoạn 3: xe tải chở thức ăn không nổ máy (do nhóm nghiên cứu sắp đặt) và các em cùng kéo xe bằng chính sợi dây kéo co."
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: s9
  cau: "Giai đoạn 3: nguồn nước của trại đột nhiên bị cắt (do chính nhóm nghiên cứu can thiệp) và cả hai nhóm cùng đi tìm chỗ hỏng."
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: s10
  cau: "Giai đoạn 3: hai nhóm góp tiền chung để thuê một bộ phim."
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: s11
  cau: "Ở giai đoạn 2, thù địch bùng nổ: chửi bới, phá hoại đồ đạc, đốt cờ của nhau, đột kích lán trại, ẩu đả."
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: s12
  cau: Mỗi nhóm đánh giá nhóm kia kém hơn hẳn nhóm mình, với những tính xấu như lén lút, tự cao, đáng ghét (sneaky, smart alecks, stinkers).
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: s13
  cau: Khi được hỏi muốn kết bạn với ai (cuối giai đoạn 2), tỉ lệ chọn bạn ngoài nhóm của Rattlers là 6,4% và của Eagles là 7,5%.
  loai: so-lieu
- trang: thi-nghiem/robbers-cave
  id: s14
  cau: Cuối giai đoạn 3, tỉ lệ chọn bạn ngoài nhóm tăng lên 36,4% (Rattlers) và 23,2% (Eagles).
  loai: so-lieu
- trang: thi-nghiem/robbers-cave
  id: s15
  cau: Cuối trại, hai nhóm cùng đi một chuyến xe về nhà, ghế ngồi không theo ranh giới nhóm; ranh giới giữa hai nhóm mờ đi nhiều nhưng phần lớn lựa chọn bạn vẫn dành cho bạn cùng nhóm.
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: s16
  cau: Những sự cố ở giai đoạn 3 (xe không nổ máy, mất nước) đều do chính nhóm nghiên cứu sắp đặt.
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: s17
  cau: Phụ huynh được báo đây là một trại thí nghiệm của Đại học Oklahoma nghiên cứu sự tương tác trong và giữa các đội, rồi cho phép con tham gia; các em nhỏ không được báo mình là đối tượng nghiên cứu.
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: s18
  cau: "Ngày nay, một thiết kế như vậy rất khó được hội đồng đạo đức phê duyệt: trẻ em bị đánh lừa về việc mình đang tham gia nghiên cứu và bị cố tình đẩy vào căng thẳng."
  loai: lich-su
- trang: thi-nghiem/robbers-cave
  id: a0
  cau: Lớp học jigsaw được Aronson và các sinh viên phát triển năm 1971 ở Austin, Texas, để làm dịu thù địch chủng tộc giữa học sinh bằng hợp tác thay vì cạnh tranh.
  loai: lich-su
- trang: thi-nghiem/robbers-cave
  id: a1
  cau: Sau khi các trường ở Austin xóa bỏ phân biệt chủng tộc, các lớp học trộn lẫn học sinh da trắng, da đen và gốc Latin nhanh chóng rơi vào nghi kỵ và thù địch; theo Aronson, môi trường lớp học cạnh tranh đã làm nó trầm trọng thêm.
  loai: lich-su
- trang: thi-nghiem/robbers-cave
  id: a2
  cau: 'Aronson thiết kế lại giờ học: học sinh chia thành các nhóm đa dạng, mỗi em nắm một "mảnh ghép" kiến thức; muốn hiểu toàn bộ bài, cả nhóm phải lắng nghe và học hỏi lẫn nhau.'
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: a3
  cau: Theo Aronson và cộng sự (1978) và trang giới thiệu của chính Aronson, so với lớp học truyền thống, học sinh jigsaw giảm xung đột chủng tộc, thích đi học hơn, nghỉ học ít hơn và đạt điểm kiểm tra tốt hơn.
  loai: lich-su
- trang: thi-nghiem/robbers-cave
  id: a4
  cau: Tổng quan hệ thống 69 nghiên cứu thấy hiệu ứng của jigsaw lên học tập, động lực và quan hệ xã hội thiếu nhất quán và rất khác nhau giữa các nghiên cứu (Cochon Drouet và cộng sự, 2023).
  loai: lich-su
- trang: thi-nghiem/robbers-cave
  id: a5
  cau: Năm thí nghiệm ngẫu nhiên trên học sinh lớp 6 ở Pháp không thấy jigsaw cải thiện học tập (hiệu ứng gộp 0,00; Stanczak và cộng sự, 2022).
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: a6
  cau: Một nguyên lý từ trại hè 1954 đã trở thành kỹ thuật sư phạm được dùng rộng rãi, nhưng bằng chứng về hiệu quả của nó còn lẫn lộn.
  loai: lich-su
- trang: thi-nghiem/robbers-cave
  id: nk1
  cau: "Nhãn Khá vững: cạnh tranh về nguồn lực có hạn làm tăng thù địch giữa các nhóm."
  loai: nhan
- trang: thi-nghiem/robbers-cave
  id: nk1a
  cau: "Phân tích tổng hợp 95 mẫu của Riek, Mania và Gaertner (2006): mối đe dọa thực tế (tranh nguồn lực) đi cùng thái độ tiêu cực với nhóm kia."
  loai: tai-lap
- trang: thi-nghiem/robbers-cave
  id: nk1b
  cau: Một lần làm lại với đội hướng đạo gồm các em đã quen biết nhau chỉ ủng hộ một phần các giả thuyết của Sherif (Tyerman và Spencer, 1983).
  loai: tai-lap
- trang: thi-nghiem/robbers-cave
  id: nk1c
  cau: Lần thử năm 1953 của nhóm Sherif phải dừng giữa chừng vì khi xung đột lên cao, nguồn cơn bị quy cho ban điều hành trại.
  loai: lich-su
- trang: thi-nghiem/robbers-cave
  id: nk2
  cau: "Nhãn Khá vững: mục tiêu chung cấp bách làm giảm thù địch."
  loai: nhan
- trang: thi-nghiem/robbers-cave
  id: nk2a
  cau: Phân tích tổng hợp 515 nghiên cứu của Pettigrew và Tropp (2006) cho thấy tiếp xúc giữa các nhóm thường làm giảm định kiến, nhiều hơn trong các điều kiện tối ưu (gồm mục tiêu chung), dù các điều kiện ấy không bắt buộc.
  loai: tai-lap
- trang: thi-nghiem/robbers-cave
  id: nk2b
  cau: Ở Robbers Cave, chuỗi nhiệm vụ chung kéo hai nhóm từ thù địch về gần hơn rõ rệt, dù bạn cùng nhóm vẫn được chọn nhiều hơn.
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: nk2c
  cau: Trong thí nghiệm gốc, "mục tiêu chung" luôn đi kèm với tăng tiếp xúc và sự dàn dựng của nhà nghiên cứu, nên khó tách riêng tác dụng của từng yếu tố.
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: nt
  cau: 'Nhãn Đang tranh cãi: thù địch ấy "tự nhiên" đến mức nào.'
  loai: nhan
- trang: thi-nghiem/robbers-cave
  id: nt2
  cau: Từ xe hỏng, mất nước đến giải đấu, mọi thứ đều do nhà nghiên cứu sắp đặt, mà người quan sát cũng chính là người dựng kịch; vì vậy khó nói thù địch được "phát hiện" hay phần nào đã được "sản xuất" bởi hoàn cảnh sắp đặt.
  loai: lich-su
- trang: thi-nghiem/robbers-cave
  id: l1
  cau: "Lý thuyết xung đột thực tế: xung đột giữa các nhóm nảy sinh khi họ cạnh tranh những nguồn lực có hạn, và dịu đi khi cùng cần nhau để đạt mục tiêu chung; định kiến là sản phẩm của hoàn cảnh chứ không phải tính xấu bẩm sinh."
  loai: dinh-nghia
- trang: thi-nghiem/robbers-cave
  id: l2
  cau: "Mục tiêu chung cấp bách (superordinate goals): mục tiêu hấp dẫn, quan trọng với cả hai nhóm nhưng không nhóm nào đạt được một mình."
  loai: dinh-nghia
- trang: thi-nghiem/robbers-cave
  id: l3
  cau: "Nhiều thí nghiệm với nhóm nhân tạo cho thấy riêng việc phân người ta thành nhóm đã đủ gây thiên vị người cùng nhóm (Mullen, Brown và Smith, 1992); Robbers Cave cho thấy một bước tiếp theo: thêm cạnh tranh, thiên vị đã nở thành thù địch."
  loai: tai-lap
- trang: thi-nghiem/robbers-cave
  id: l4
  cau: Ở Robbers Cave, các buổi gặp nhau "cho vui" (cùng ăn, cùng xem phim) lúc hai nhóm đang thù địch không làm giảm thù địch, có buổi còn thành ném đồ ăn vào nhau; nhìn rộng hơn, phân tích tổng hợp thấy tiếp xúc nói chung vẫn thường làm giảm định kiến.
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: ap1
  cau: "Gợi ý rút ra từ Robbers Cave (chưa được kiểm chứng ở công sở hay nhóm bạn): tạo một việc chung mà không bên nào làm nổi một mình thay vì chỉ tổ chức buổi gặp thân mật; ở trại hè, nhiệm vụ chung làm dịu thù địch còn các buổi gặp xã giao thì không."
  loai: loi-khuyen
- trang: thi-nghiem/robbers-cave
  id: ap2
  cau: Hệ thống thưởng kiểu "đội này thắng thì đội kia thua" giống giải đấu ở Robbers Cave; việc nó có sinh ra bè phái ở công sở hay không thì thí nghiệm này không kiểm tra.
  loai: loi-khuyen
- trang: thi-nghiem/robbers-cave
  id: ap3
  cau: Các "cuộc chiến phe phái" online có thể được hiểu qua công thức của Sherif (chia phe cộng cạnh tranh sự chú ý), nhưng đó là một cách nhìn, chưa phải kết quả nghiên cứu.
  loai: loi-khuyen
- trang: thi-nghiem/robbers-cave
  id: v1
  cau: Thí nghiệm được thực hiện trên 22 bé trai Mỹ năm 1954 — một mẫu rất đặc thù.
  loai: so-lieu
- trang: thi-nghiem/robbers-cave
  id: v2
  cau: Tính đến 10/2026, chưa tìm thấy nghiên cứu tương tự thí nghiệm Robbers Cave trên trẻ em Việt Nam.
  loai: thoi-su
- trang: thi-nghiem/robbers-cave
  id: v3
  cau: "Đoạn suy đoán về văn hóa Việt Nam: văn hóa Việt Nam đề cao tinh thần tập thể và hòa khí, có thể làm giai đoạn hòa giải thuận lợi hơn nhưng cũng có thể khiến cạnh tranh bị dồn nén rồi bùng phát."
  loai: loi-khuyen
- trang: thi-nghiem/robbers-cave
  id: g1
  cau: Các em được chọn kỹ — ổn định ở trường và ở nhà, loại hết những em bị coi là "có vấn đề" — và được xếp thành hai nhóm tương đương nhau; thù địch xuất hiện khi hai nhóm bị đặt vào cạnh tranh.
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: g2
  cau: Ở Robbers Cave, tiếp xúc khi còn đang cạnh tranh không làm dịu mà có lúc đổ thêm dầu vào lửa; điều làm dịu thù địch ở đó là việc chung cần cả hai nhóm; nhìn rộng hơn, tiếp xúc giữa các nhóm thường vẫn làm giảm định kiến.
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: g3
  cau: "Thông điệp mạnh nhất của Robbers Cave là thù địch có thể dịu đi: hoàn cảnh dựng lên được thì hoàn cảnh cũng làm dịu được."
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: g4
  cau: Phụ huynh cho phép con đi trại, nhưng các em không biết mình là đối tượng nghiên cứu; ngày nay một thiết kế như vậy rất khó được hội đồng đạo đức phê duyệt.
  loai: lich-su
- trang: thi-nghiem/robbers-cave
  id: q1a
  cau: "Thí nghiệm gồm ba giai đoạn theo thứ tự: hình thành nhóm (tách biệt khoảng một tuần), cạnh tranh (giải đấu có thưởng), mục tiêu chung cấp bách (hợp tác); thứ tự do nhóm nghiên cứu sắp đặt."
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: q2a
  cau: Điều châm ngòi thù địch là một giải đấu với cúp và phần thưởng chỉ dành cho đội thắng, tức cạnh tranh có thắng có thua, không cần khác biệt có sẵn; nhóm nghiên cứu không xúi các em ghét nhau nhưng chủ động sắp đặt cuộc cạnh tranh, kể cả điều khiển kết quả môn cuối.
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: q3a
  cau: "Mục tiêu chung cấp bách gồm các tình huống hấp dẫn mà không nhóm nào giải quyết được một mình: cùng kéo chiếc xe tải không nổ máy, cùng tìm chỗ hỏng nguồn nước, góp tiền chung thuê phim."
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: q3b
  cau: Điểm mấu chốt của mục tiêu chung cấp bách là buộc phải cần nhau; gặp gỡ xã giao không đủ.
  loai: lich-su
- trang: thi-nghiem/robbers-cave
  id: q4a
  cau: "Sau giai đoạn hòa giải, tỉ lệ chọn bạn ngoài nhóm tăng mạnh: Rattlers từ 6,4% lên 36,4%, Eagles từ 7,5% lên 23,2%."
  loai: so-lieu
- trang: thi-nghiem/robbers-cave
  id: q4b
  cau: Con số cho thấy thù địch dịu đi đáng kể sau các nhiệm vụ chung, nhưng bạn cùng nhóm vẫn được chọn nhiều hơn.
  loai: so-lieu
- trang: thi-nghiem/robbers-cave
  id: q5a
  cau: Các em không biết mình là đối tượng nghiên cứu (nhà nghiên cứu đóng giả nhân viên trại) và bị cố tình đẩy vào căng thẳng và thù địch; phụ huynh chỉ được báo về một trại thí nghiệm nghiên cứu sự tương tác nhóm.
  loai: phat-hien
- trang: thi-nghiem/robbers-cave
  id: q5b
  cau: "Theo chuẩn mực hiện nay, thiết kế này rất khó được phê duyệt: đánh lừa trẻ em về việc chúng tham gia nghiên cứu cộng cố tình gây căng thẳng cho chúng."
  loai: lich-su
