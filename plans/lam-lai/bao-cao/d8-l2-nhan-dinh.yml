- trang: trai-nghiem/tri-nho-sai
  id: n1
  cau: Các từ cùng chủ đề (giường, gối, mơ…) kích hoạt cả từ gắn với chủ đề ("ngủ"); lúc kiểm tra, người ta không phân biệt được "đã thấy" với "đã nghĩ đến" (cách giải thích phổ biến).
  loai: phat-hien
- trang: trai-nghiem/tri-nho-sai
  id: n2
  cau: Roediger và McDermott (1995) dựa trên nghiên cứu của Deese (1959), cho sinh viên nghe các danh sách 12 từ cùng gợi về một từ mồi không xuất hiện (bed, rest, awake… → sleep), rồi nhớ lại ngay sau mỗi danh sách.
  loai: phat-hien
- trang: trai-nghiem/tri-nho-sai
  id: n3
  cau: Khi nhớ lại tự do, người tham gia "nhớ" ra từ mồi ở 40% số danh sách (thí nghiệm 1); với danh sách 15 từ, 55% (thí nghiệm 2).
  loai: so-lieu
- trang: trai-nghiem/tri-nho-sai
  id: n4
  cau: "Ở bài nhận diện sau đó, tỉ lệ nhận nhầm từ mồi gần bằng tỉ lệ nhận đúng từ đã học (thí nghiệm 1: 84% so với 86%)."
  loai: so-lieu
- trang: trai-nghiem/tri-nho-sai
  id: n5
  cau: Ở thí nghiệm 2, phần lớn những lần nhận nhầm từ mồi được đánh giá là "nhớ rõ" (remember) chứ không chỉ "thấy quen" (know).
  loai: phat-hien
- trang: trai-nghiem/tri-nho-sai
  id: n6
  cau: 'Vững chắc: học các từ cùng chủ đề có thể khiến ta "nhớ" một từ chưa từng thấy.'
  loai: nhan
- trang: trai-nghiem/tri-nho-sai
  id: n7
  cau: "Đang tranh cãi: cơ chế chính xác (kích hoạt theo liên tưởng, ý chính/thuyết vết mờ, giám sát nguồn); theo Gallo, các cách giải thích khó tách, không loại trừ nhau, mỗi cách có bằng chứng riêng."
  loai: nhan
- trang: trai-nghiem/tri-nho-sai
  id: n8
  cau: Nghiên cứu gốc dùng nhiều danh sách trên hàng chục người (36 người ở thí nghiệm 1, 30 người ở thí nghiệm 2).
  loai: so-lieu
- trang: trai-nghiem/tri-nho-sai
  id: n9
  cau: Thí nghiệm 2 của bản gốc còn hỏi người tham gia có "nhớ" khoảnh khắc thấy từ hay chỉ "biết" nó quen; trong thí nghiệm 1 bài nhận diện đến sau các lần nhớ lại.
  loai: phat-hien
- trang: trai-nghiem/tri-nho-sai
  id: n10
  cau: "Công cụ, mục So với nghiên cứu gốc: 36 sinh viên nghe 6 danh sách 12 từ; nhớ ra từ mồi ở 40% số danh sách; thí nghiệm 2 (15 từ) 55%; bài nhận diện thí nghiệm 1: 84% so với 86%."
  loai: cong-cu
- trang: trai-nghiem/tri-nho-sai
  id: n11
  cau: "Nhịp trình bày khoảng 1,5 giây mỗi từ như nhịp đọc của thí nghiệm 1 (công cụ: 1,2 giây hiện, 0,3 giây nghỉ)."
  loai: cong-cu
- trang: trai-nghiem/wason-246
  id: n1
  cau: "Mô tả trang: thấy vì sao 23 trong 29 người không tìm ra quy tắc ngay lần đầu (6 người nêu đúng ngay)."
  loai: so-lieu
- trang: trai-nghiem/wason-246
  id: n2
  cau: Nhiều người đoán một quy tắc hẹp hơn quy tắc thật (ví dụ "mỗi số hơn số trước 2 đơn vị"), thử 8–10–12, 20–22–24, đều "đúng", và thường nêu quy tắc sai sau vài lần thử; các dãy ấy phù hợp với cả phỏng đoán sai lẫn quy tắc thật.
  loai: phat-hien
- trang: trai-nghiem/wason-246
  id: n3
  cau: "Thiên kiến xác nhận thường không phải cố tình tự lừa dối: Nickerson (1998) mô tả nó là sự chọn lọc không chủ ý trong việc thu thập và dùng bằng chứng."
  loai: dinh-nghia
- trang: trai-nghiem/wason-246
  id: n4
  cau: Wason cho mỗi người xem dãy 2–4–6, nói nó tuân theo một quy tắc; người tham gia viết từng dãy kèm lý do, được báo dãy có tuân theo không, chỉ nêu quy tắc khi rất tự tin, nêu sai thì được báo rồi thử tiếp; quy tắc thật là ba số tăng dần bất kỳ.
  loai: phat-hien
- trang: trai-nghiem/wason-246
  id: n5
  cau: Trong 29 người, 6 người tìm ra quy tắc mà không nêu sai lần nào; 13 nêu sai một lần; 9 nêu sai từ hai lần; 1 không đưa ra kết luận.
  loai: so-lieu
- trang: trai-nghiem/wason-246
  id: n6
  cau: Gần như mọi quy tắc sai đều hẹp hơn quy tắc thật; ở người nêu sai ngay lần đầu, chỉ 4% số dãy thử trước đó không tuân theo quy tắc thật, so với 21% ở 6 người nêu đúng ngay; dãy có thể bác bỏ phỏng đoán hẹp (như 2–3–4 với "cộng 2") hiếm khi được thử.
  loai: so-lieu
- trang: trai-nghiem/wason-246
  id: n7
  cau: "Klayman và Ha (1987): nhiều hiện tượng gọi là thiên kiến xác nhận là chiến lược kiểm tra tích cực; trong điều kiện thực tế nó có thể là cách làm rất tốt, dù vẫn có thể gây lỗi hệ thống hay kém hiệu quả, như ở 2–4–6."
  loai: phat-hien
- trang: trai-nghiem/wason-246
  id: n8
  cau: "Khá vững: ta có xu hướng ưu tiên tìm và chọn thông tin phù hợp với giả thuyết sẵn có."
  loai: nhan
- trang: trai-nghiem/wason-246
  id: n9
  cau: 'Đang tranh cãi: gọi hành vi này là "thiên kiến có hại" hay "lối tắt hợp lý thỉnh thoảng phản tác dụng".'
  loai: nhan
- trang: trai-nghiem/wason-246
  id: n10
  cau: "Nickerson (1998): thiên kiến xác nhận là xu hướng tìm thông tin mà ta cho là ủng hộ giả thuyết hay niềm tin sẵn có, và diễn giải thông tin theo hướng có lợi cho chúng."
  loai: dinh-nghia
- trang: trai-nghiem/wason-246
  id: n11
  cau: Ví dụ thử thuốc trên người bệnh chứ không trên người khỏe; theo Klayman và Ha, thói quen thử trường hợp "dương tính" thường là cách làm tốt, có thể gây lỗi khi giả thuyết hẹp hơn sự thật.
  loai: phat-hien
- trang: trai-nghiem/wason-246
  id: n12
  cau: Theo Nickerson, ta dễ tin điều mình mong là đúng; có thể chọn lọc bằng chứng và "nghiêng cán cân" khi cân nhắc, dù không thể phớt lờ hoàn toàn bằng chứng trái chiều.
  loai: phat-hien
- trang: trai-nghiem/wason-246
  id: n13
  cau: Nghiên cứu gốc của Wason làm ở Anh với 29 sinh viên ngành tâm lý, công bố năm 1960.
  loai: lich-su
- trang: trai-nghiem/wason-246
  id: n14
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra nhiệm vụ 2–4–6 trên người Việt.
  loai: thoi-su
- trang: trai-nghiem/wason-246
  id: n15
  cau: "Ngộ nhận: người tham gia của Wason là sinh viên được mô tả là thông minh; Nickerson ghi nhận thiên kiến này cả ở người làm khoa học; theo Nickerson (dẫn Evans, 1989), hướng dẫn tìm bằng chứng bác bỏ đôi khi làm đổi hành vi nhưng thường không cải thiện thành tích."
  loai: phat-hien
- trang: trai-nghiem/wason-246
  id: n16
  cau: 'Ngộ nhận: mười dãy số chẵn tăng đều đều "đúng" cũng không loại trừ được quy tắc thật; số lượng bằng chứng khẳng định không bù được cho sự vắng mặt của một phép thử bác bỏ (câu hỏi 1, 3, 5 cùng ý).'
  loai: phat-hien
- trang: trai-nghiem/wason-246
  id: n17
  cau: "Công cụ: 29 người, 6 nêu đúng ngay; tỉ lệ dãy không tuân theo trước lần nêu đầu 21% (6 người nêu đúng ngay) và 4% (người nêu sai lần đầu)."
  loai: cong-cu
- trang: trai-nghiem/wason-246
  id: n18
  cau: "Câu hỏi 4: theo Klayman và Ha, đó là chiến lược kiểm tra tích cực, có thể là cách làm tốt trong điều kiện thực tế, dù đôi khi gây lỗi hệ thống."
  loai: phat-hien
- trang: trai-nghiem/linda
  id: n1
  cau: "Mô tả trang: 85% người chọn đáp án mà về mặt logic không thể đúng hơn."
  loai: so-lieu
- trang: trai-nghiem/linda
  id: n2
  cau: Đoạn mô tả Linda và hai phát biểu (A) nhân viên ngân hàng, (B) nhân viên ngân hàng và là nhà hoạt động nữ quyền (bản dịch như trang nhà).
  loai: dinh-nghia
- trang: trai-nghiem/linda
  id: n3
  cau: Mọi người thỏa (B) đều thỏa (A), nên xác suất của (B) không thể lớn hơn của (A); thêm một chi tiết chỉ có thể giữ nguyên hay làm giảm xác suất.
  loai: dinh-nghia
- trang: trai-nghiem/linda
  id: n4
  cau: Theo cách giải thích của Tversky và Kahneman, ta không thật sự so hai xác suất mà so độ "giống Linda"; (B) nghe giống hơn.
  loai: phat-hien
- trang: trai-nghiem/linda
  id: n5
  cau: Heuristic là các nguyên tắc đơn giản hóa, thường hữu ích, nhưng đôi khi dẫn đến lỗi có hệ thống; bài toán Linda là ví dụ nổi tiếng nhất của hai ông.
  loai: dinh-nghia
- trang: trai-nghiem/linda
  id: n6
  cau: "142 sinh viên đại học chưa học thống kê chọn giữa hai phát biểu: 85% cho (B) có khả năng hơn."
  loai: so-lieu
- trang: trai-nghiem/linda
  id: n7
  cau: "Phiên bản xếp hạng tám phát biểu: tỉ lệ mắc lỗi 85–90% ở cả ba nhóm, từ sinh viên chưa học thống kê đến nghiên cứu sinh ngành khoa học quyết định."
  loai: so-lieu
- trang: trai-nghiem/linda
  id: n8
  cau: "Phiên bản đặt cược: 56% (60 người)."
  loai: so-lieu
- trang: trai-nghiem/linda
  id: n9
  cau: "Tversky và Kahneman (1974) mô tả ba heuristic: đại diện (đánh giá theo độ giống một khuôn mẫu), sẵn có, neo."
  loai: dinh-nghia
- trang: trai-nghiem/linda
  id: n10
  cau: "Khá vững: lỗi conjunction fallacy trong bài toán Linda."
  loai: nhan
- trang: trai-nghiem/linda
  id: n11
  cau: 'Đang tranh cãi: vì sao ta mắc bẫy; Gigerenzer phản biện rằng nhiều "lỗi" không vi phạm lý thuyết xác suất nếu phân biệt xác suất một trường hợp với tần suất, và từ ngữ có thể được hiểu khác (ví dụ hiểu (A) thành "không phải nhà hoạt động nữ quyền").'
  loai: nhan
- trang: trai-nghiem/linda
  id: n12
  cau: "Thay thế thuộc tính (Kahneman, 2011): khi câu hỏi khó, ta thường trả lời một câu dễ hơn mà không để ý mình đã đổi câu hỏi (cả câu hỏi 3)."
  loai: phat-hien
- trang: trai-nghiem/linda
  id: n13
  cau: 'Hai hệ thống (Kahneman, 2011): Hệ thống 1 nhanh, tự động; Hệ thống 2 chậm, có kiểm soát, thường "ký duyệt" câu trả lời trực giác.'
  loai: phat-hien
- trang: trai-nghiem/linda
  id: n14
  cau: Nghiên cứu gốc dùng sinh viên đại học và nghiên cứu sinh ở Mỹ và Canada, công bố năm 1983.
  loai: lich-su
- trang: trai-nghiem/linda
  id: n15
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra bài toán Linda hay lỗi conjunction fallacy trên người Việt.
  loai: thoi-su
- trang: trai-nghiem/linda
  id: n16
  cau: "Suy luận của site: nếu một phần hiệu ứng do cách hiểu câu hỏi, thói quen giao tiếp khác nhau giữa các nền văn hóa có thể ảnh hưởng tới hiệu ứng; chưa có dữ liệu."
  loai: phat-hien
- trang: trai-nghiem/linda
  id: n17
  cau: "Ngộ nhận: ở phiên bản xếp hạng, nhóm nghiên cứu sinh khoa học quyết định vẫn mắc lỗi ở tỉ lệ cao (85%)."
  loai: so-lieu
- trang: trai-nghiem/linda
  id: n18
  cau: "Câu hỏi 2: 85% ở phiên bản chọn một trong hai (sinh viên chưa học thống kê), 85–90% ở phiên bản xếp hạng; khi chỉ phải so hai phát biểu, phần lớn người đã học nhiều thống kê làm đúng."
  loai: so-lieu
- trang: trai-nghiem/linda
  id: n19
  cau: "Câu hỏi 4: đặt cược 56%, thấp hơn 85% (nhóm khác); Tversky và Kahneman phỏng đoán khung cược khiến người ta chú ý điều kiện thắng; đây là so sánh giữa hai nhóm, chưa phải thử nghiệm có kiểm soát."
  loai: phat-hien
- trang: trai-nghiem/linda
  id: n20
  cau: "Công cụ: 142 sinh viên, 85% chọn (B), 15% chọn (A) (biểu đồ)."
  loai: cong-cu
- trang: trai-nghiem/big-five-mini
  id: n1
  cau: "Thang Mini-IPIP của Donnellan và cộng sự (2006): 20 câu, 4 câu mỗi chiều (hướng ngoại, dễ chịu, tận tâm, bất ổn cảm xúc, trí tuệ/trí tưởng tượng); bản rút gọn của một bảng hỏi IPIP 50 câu."
  loai: cong-cu
- trang: trai-nghiem/big-five-mini
  id: n2
  cau: "Câu và khóa chấm (thuận, nghịch) của 20 câu theo trang Mini-IPIP Scoring Key; câu nghịch: E 2, A 2, C 2, N 2, Intellect 3."
  loai: cong-cu
- trang: trai-nghiem/big-five-mini
  id: n3
  cau: "Câu IPIP thuộc phạm vi công cộng: ai cũng được chép, dịch, dùng mà không cần xin phép."
  loai: phat-hien
- trang: trai-nghiem/big-five-mini
  id: n4
  cau: Thang 5 bậc (Very Inaccurate … Very Accurate) và lời dẫn ("mô tả bạn như bạn thường là hiện nay … so với người cùng giới, cùng lứa tuổi").
  loai: cong-cu
- trang: trai-nghiem/big-five-mini
  id: n5
  cau: "Cách chấm: câu thuận 1–5, câu nghịch 5–1, điểm chiều là tổng các câu (4–20)."
  loai: cong-cu
- trang: trai-nghiem/big-five-mini
  id: n6
  cau: "Không gắn nhãn cao/thấp: IPIP khuyên không xếp người vào loại; chuẩn so sánh tính trên mẫu cùng giới, cùng lứa tuổi."
  loai: cong-cu
- trang: trai-nghiem/big-five-mini
  id: n7
  cau: IPIP khuyên xếp xen kẽ câu của các thang, vì khi câu cùng thang đứng liền nhau người trả lời dễ chọn cùng một mức cho tất cả.
  loai: phat-hien
- trang: trai-nghiem/big-five-mini
  id: n8
  cau: Trộn câu thuận và câu nghịch giúp phát hiện thói quen "đồng ý với mọi câu" (xu hướng đồng ý, acquiescence) (cả câu hỏi 1).
  loai: phat-hien
- trang: trai-nghiem/big-five-mini
  id: n9
  cau: "Qua năm nghiên cứu: độ nhất quán nội tại chấp nhận được (từ khoảng 0,60 trở lên), độ ổn định đo lại sau vài tuần, vài tháng gần như bản 50 câu, quan hệ với các thước đo Big Five khác tương tự."
  loai: so-lieu
- trang: trai-nghiem/big-five-mini
  id: n10
  cau: "Hệ số alpha của năm thang Mini-IPIP: 0,65–0,77; tác giả chấm chiều cảm xúc theo hướng bất ổn (Neuroticism) thay vì ổn định cảm xúc như thang gốc."
  loai: so-lieu
- trang: trai-nghiem/big-five-mini
  id: n11
  cau: "Khá vững: thang ngắn như Mini-IPIP vẫn đo được 5 chiều, nhưng điểm từng chiều kém chính xác hơn bản dài; bằng chứng chủ yếu từ mẫu nói tiếng Anh."
  loai: nhan
- trang: trai-nghiem/big-five-mini
  id: n12
  cau: Big Five là công cụ mô tả tính cách bình thường, không phải công cụ chẩn đoán (lời cảnh báo, link trang nhà).
  loai: dinh-nghia
- trang: trai-nghiem/big-five-mini
  id: n13
  cau: Bằng chứng về cấu trúc Big Five ở người Việt còn ít và chưa thống nhất (link mục Ở Việt Nam của trang nhà).
  loai: phat-hien
- trang: trai-nghiem/big-five-mini
  id: n14
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu kiểm chứng Mini-IPIP trên người Việt.
  loai: thoi-su
- trang: trai-nghiem/big-five-mini
  id: n15
  cau: Nhiều bài test Big Five tiếng Việt trên mạng, kể cả bản này, chưa qua chuẩn hóa (dịch ngược, kiểm chứng nhân tố, chuẩn so sánh).
  loai: phat-hien
- trang: trai-nghiem/big-five-mini
  id: n16
  cau: "Ngộ nhận: mức trung bình các chiều dịch chuyển theo tuổi và điểm một người dao động giữa các lần đo (link Tính cách có thay đổi theo tuổi?)."
  loai: phat-hien
- trang: trai-nghiem/big-five-mini
  id: n17
  cau: "Câu hỏi 2: công cụ chỉ cho vị trí trên dải 4–20; muốn nói cao hay thấp cần so với mẫu cùng giới, cùng lứa tuổi; IPIP khuyên không xếp loại."
  loai: cong-cu
- trang: trai-nghiem/neo-gia
  id: n1
  cau: Khi ước lượng, ta bám vào một con số có sẵn rồi điều chỉnh, thường điều chỉnh không đủ; con số ban đầu là mỏ neo.
  loai: dinh-nghia
- trang: trai-nghiem/neo-gia
  id: n2
  cau: Trong nghiên cứu gốc, con số neo đến từ một vòng quay may rủi quay ngay trước mặt người tham gia, nhưng ước lượng vẫn bị kéo đi.
  loai: phat-hien
- trang: trai-nghiem/neo-gia
  id: n3
  cau: "Tversky và Kahneman (1974): hai bước (lớn hơn hay nhỏ hơn số vừa quay; con số cụ thể); nhóm nhận 10 cho trung vị 25, nhóm nhận 65 cho 45; thưởng cho độ chính xác không làm giảm hiệu ứng."
  loai: so-lieu
- trang: trai-nghiem/neo-gia
  id: n4
  cau: "Englich và cộng sự (2006), nghiên cứu 3: luật sư trẻ vừa bắt đầu làm thẩm phán ở Đức, hồ sơ vụ án giả định soạn sát thực tế, tự tung xúc xắc bị làm cho luôn ra tổng 3 hoặc 9 (tháng án treo); mức án trung bình 7,81 và 5,28 tháng."
  loai: so-lieu
- trang: trai-nghiem/neo-gia
  id: n5
  cau: "Nghiên cứu 2: thẩm phán và công tố viên có trung bình hơn 13 năm kinh nghiệm, mức đề nghị được báo là chọn ngẫu nhiên, hiệu ứng vẫn xuất hiện; các tác giả kết luận chuyên môn và kinh nghiệm không làm giảm hiệu ứng."
  loai: phat-hien
- trang: trai-nghiem/neo-gia
  id: n6
  cau: "Vững chắc: con số neo làm dịch chuyển ước lượng; Many Labs (36 mẫu, 6.344 người): bốn câu mỏ neo có hiệu ứng ở mọi mẫu, thuộc nhóm hiệu ứng lớn nhất."
  loai: nhan
- trang: trai-nghiem/neo-gia
  id: n7
  cau: "Khá vững: hiệu ứng có cả khi neo hoàn toàn ngẫu nhiên và người quyết định là chuyên gia; bằng chứng về chuyên gia từ một số ít nghiên cứu vài chục người."
  loai: nhan
- trang: trai-nghiem/neo-gia
  id: n8
  cau: "Đang tranh cãi: cơ chế (điều chỉnh không đủ của Tversky và Kahneman; khả năng tiếp cận chọn lọc của Mussweiler và Strack); ở nghiên cứu 4 của Englich, sau mức đề nghị cao, lý lẽ buộc tội được nhận ra nhanh hơn; hai cách không loại trừ nhau."
  loai: nhan
- trang: trai-nghiem/neo-gia
  id: n9
  cau: 'Đã bị bác bỏ: "mỏ neo chỉ có tác dụng khi con số có vẻ liên quan"; số ngẫu nhiên vẫn tạo hiệu ứng; Englich so mức đề nghị ngẫu nhiên với cùng mức do công tố đưa ra và không thấy hiệu ứng khác nhau.'
  loai: nhan
- trang: trai-nghiem/neo-gia
  id: n10
  cau: "Lý thuyết: điều chỉnh không đủ (Tversky và Kahneman, 1974); tiếp cận chọn lọc (Mussweiler và Strack, 1999; Englich, 2006)."
  loai: phat-hien
- trang: trai-nghiem/neo-gia
  id: n11
  cau: "Tính đến 11/2026, số chính thức mới nhất: dân số trung bình năm 2025 ước tính 102,3 triệu người (Cục Thống kê, thông cáo 1/2026)."
  loai: thoi-su
- trang: trai-nghiem/neo-gia
  id: n12
  cau: Dân số thành thị năm 2025 chiếm 38,6% (cùng nguồn).
  loai: thoi-su
- trang: trai-nghiem/neo-gia
  id: n13
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu về hiệu ứng mỏ neo trên mẫu người Việt.
  loai: thoi-su
- trang: trai-nghiem/neo-gia
  id: n14
  cau: "Ngộ nhận: người làm nghề luật biết mức đề nghị do xúc xắc quyết định mà vẫn bị kéo; chuyên môn và kinh nghiệm xét xử không làm giảm hiệu ứng."
  loai: phat-hien
- trang: trai-nghiem/neo-gia
  id: n15
  cau: "Câu hỏi 2 và 5: câu so sánh làm người trả lời phải xét con số neo; theo mô hình tiếp cận chọn lọc, hiểu biết phù hợp với neo dễ nhớ ra hơn và kéo ước lượng."
  loai: phat-hien
- trang: trai-nghiem/neo-gia
  id: n16
  cau: "Công cụ: Tversky và Kahneman (1974), vòng quay 0–100 dừng ở 10 hay 65, trung vị 25 và 45."
  loai: cong-cu
- trang: trai-nghiem/tri-nho-tu
  id: n1
  cau: Theo mô hình của Baddeley, trí nhớ lời nói giữ thông tin bằng nhẩm lặp thầm; dung lượng ước chừng bằng lượng lời đọc được trong khoảng 2 giây; từ dài hơn thì nhớ được ít hơn.
  loai: phat-hien
- trang: trai-nghiem/tri-nho-tu
  id: n2
  cau: Từ trong công cụ đều một âm tiết như tên chữ số tiếng Việt, nên độ dài trí nhớ từ và chữ số có thể không chênh nhiều; hãy làm cả hai để tự so.
  loai: phat-hien
- trang: trai-nghiem/tri-nho-tu
  id: n3
  cau: 'Miller (1956) "7 ± 2" và Cowan (2001) khoảng 4 "cục": tóm một câu, link trang nhà tri-nho-lam-viec.'
  loai: phat-hien
- trang: trai-nghiem/tri-nho-tu
  id: n4
  cau: "Baddeley, Thomson và Buchanan (1975): độ dài trí nhớ tỉ lệ nghịch với độ dài từ; khi số âm tiết và âm vị giữ nguyên, từ đọc nhanh hơn được nhớ tốt hơn; số từ nhớ được dự đoán từ số từ đọc được trong khoảng 2 giây; ngăn nhẩm lặp làm hiệu ứng biến mất với trình bày bằng mắt."
  loai: phat-hien
- trang: trai-nghiem/tri-nho-tu
  id: n5
  cau: "Vững chắc: dãy từ dài thì nhớ được ít hơn dãy từ ngắn; Oberauer và cộng sự (2018) xếp vào nhóm phát hiện ổn định, ở nhiều ngôn ngữ khi độ dài thay đổi bằng số âm tiết; cách giải thích còn bàn."
  loai: nhan
- trang: trai-nghiem/tri-nho-tu
  id: n6
  cau: "Lý thuyết: nhiễu giữa các mục là một cách giải thích khác cho hiệu ứng độ dài từ (Oberauer và cộng sự, 2018); gom nhóm giúp nhớ nhiều hơn (Miller, 1956)."
  loai: phat-hien
- trang: trai-nghiem/tri-nho-tu
  id: n7
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy số liệu chuẩn nào cho độ dài trí nhớ từ ở người Việt.
  loai: thoi-su
- trang: trai-nghiem/tri-nho-tu
  id: n8
  cau: Theo hiệu ứng độ dài từ, nếu dùng từ nhiều âm tiết, độ dài trí nhớ của bạn có thể thấp hơn.
  loai: phat-hien
- trang: trai-nghiem/tri-nho-tu
  id: n9
  cau: "Ngộ nhận: số mục nhớ được thay đổi theo loại mục; với từ dài nhớ được ít hơn."
  loai: phat-hien
- trang: trai-nghiem/tri-nho-tu
  id: n10
  cau: "Ngộ nhận: phân tích tổng hợp 23 nghiên cứu (Melby-Lervåg và Hulme, 2013): luyện trí nhớ làm việc cải thiện ngắn hạn đúng kỹ năng đã luyện, không có bằng chứng thuyết phục là lan sang kỹ năng khác (cả câu hỏi 5)."
  loai: phat-hien
- trang: trai-nghiem/tri-nho-tu
  id: n11
  cau: "Ngộ nhận: một lần đo trên mạng chịu ảnh hưởng của mệt mỏi, mất tập trung, chiến lược nhóm từ, thiết bị; không phải thước đo trí tuệ."
  loai: phat-hien
- trang: trai-nghiem/tri-nho-tu
  id: n12
  cau: "Câu hỏi 1, 2: hiệu ứng độ dài từ, dự đoán từ số từ đọc được trong khoảng 2 giây; câu hỏi 3: chỉ dùng từ một âm tiết để kiểm soát độ dài từ."
  loai: phat-hien
