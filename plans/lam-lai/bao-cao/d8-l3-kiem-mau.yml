- trang: du-lieu/ngo-nhan/nao-trai-phai
  id: nhan
  cau: Phân loại người thành "thiên não trái" và "thiên não phải" đã bị bác bỏ.
  loai: nhan
  nguon:
    - ten: Nielsen và cộng sự (2013). An evaluation of the left-brain vs. right-brain hypothesis with resting state functional connectivity magnetic resonance imaging
      link: https://doi.org/10.1371/journal.pone.0071275
  ket_qua_luot_1: dung
  luot_2: khong-chac
  ghi_chu: 'Sau lượt 2 (Opus 5.5, 17/11/2026): Lượt 2 khong-chac (tóm tắt đọc được bị cắt). Tôi đọc đủ tóm tắt Nielsen 2013 trên Europe PMC: "our data are not consistent with a whole-brain phenotype of greater left-brained or greater right-brained network strength"; nhãn khớp khung bac-bo của trang nhà nao-che-doi (đã khóa, cũng dẫn tổng quan Corballis 2014). Giữ Đã bị bác bỏ.'
- trang: du-lieu/ngo-nhan/nghi-tich-cuc-stress
  id: g2
  cau: "Crum 2013, 2023: kết quả tích cực nhưng chủ yếu tự báo cáo; các nhóm khác chưa nhất quán, nhất là chỉ số sinh lý."
  loai: phat-hien
  nguon:
    - ten: "Crum và cộng sự (2013). Rethinking stress: The role of mindsets in determining the stress response"
      link: https://doi.org/10.1037/a0031201
    - ten: 'Crum và cộng sự (2023). Evaluation of the "rethink stress" mindset intervention: A metacognitive approach to changing mindsets'
      link: https://doi.org/10.1037/xge0001396
  ket_qua_luot_1: da-sua
  luot_2: khong-chac
  ghi_chu: 'Cũ "hiệu ứng còn nhỏ ... việc tái lập đúng giao thức gốc vẫn là câu hỏi mở": viết theo trang nhà. Sau lượt 2 (Opus 5.5, 17/11/2026): Lượt 2 xác nhận phần Crum (tự báo cáo), chưa thấy nguồn mở cho "các nhóm khác chưa nhất quán". Câu theo trang nhà đã khóa (khung tranh-cai: phân tích tổng hợp 2019 không thấy khác biệt sinh lý; hồ sơ trang nhà đã qua hai lượt). Giữ.'
