- trang: bang-chung/p-value
  id: p1
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf"]
  trich: "While the p-value can be a useful statistical measure, it is commonly misused and misinterpreted... the scientific community could benefit from a formal statement"
  ghi_chu: "Bản ASA (Wasserstein & Lazar 2016), mục Introduction; thông cáo ngày 7/3/2016."
- trang: bang-chung/p-value
  id: p2
  luot_2: dung
  nguon: ["https://api.crossref.org/works/10.1080/00031305.2016.1154108", "http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108"]
  trich: "The ASA Statement on p-Values: Context, Process, and Purpose; Ronald L. Wasserstein, Nicole A. Lazar; vol. 70, issue 2, pages 129-133"
  ghi_chu: "Crossref: The American Statistician 70(2):129–133. Phần tuyên bố ghi 'Edited by Ronald L. Wasserstein ... On behalf of the ASA Board of Directors'; bài bao quanh do Wasserstein & Lazar đứng tên, nên 'soạn thảo' chấp nhận được."
- trang: bang-chung/p-value
  id: p3
  luot_2: dung
  nguon: ["https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf"]
  trich: "this is the first time that the community of statisticians, as represented by the ASA Board of Directors, has issued a statement to address these issues"
  ghi_chu: "Lời Jessica Utts trong thông cáo của ASA."
- trang: bang-chung/p-value
  id: p4
  luot_2: dung
  nguon: ["https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf", "http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108"]
  trich: "The statement's six principles, many of which address misconceptions and misuse of the p-value, are the following"
- trang: bang-chung/p-value
  id: p5
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108"]
  trich: "a p-value is the probability ... that a statistical summary of the data ... would be equal to or more extreme than its observed value"
  ghi_chu: "Tự tính: C(10,9)=10, C(10,10)=1, 2^10=1024; 11/1024 = 1,074%, làm tròn 1,1% (p một phía, 'bằng hoặc cực đoan hơn' như định nghĩa ASA)."
- trang: bang-chung/p-value
  id: p6
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4877414/fullTextXML"]
  trich: "Informally, a p-value is the probability under a specified statistical model that a statistical summary of the data ... would be equal to or more extreme than its observed value"
  ghi_chu: "Cách nói giản dị cho người đọc phổ thông; ASA nói 'dưới một mô hình thống kê định trước' (gồm giả thuyết không và các giả định khác)."
- trang: bang-chung/p-value
  id: p7
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf"]
  trich: "1. P-values can indicate how incompatible the data are with a specified statistical model."
  ghi_chu: "Nguyên tắc 1."
- trang: bang-chung/p-value
  id: p8
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4877414/fullTextXML"]
  trich: "2. P-values do not measure the probability that the studied hypothesis is true, or the probability that the data were produced by random chance alone."
  ghi_chu: "Nguyên tắc 2; Greenland và cs. 2016 xếp đây là hiểu lầm số 1."
- trang: bang-chung/p-value
  id: p9
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108"]
  trich: "It is a statement about data in relation to a specified hypothetical explanation, and is not a statement about the explanation itself."
  ghi_chu: "Chi tiết nhỏ: 1,1% là xác suất được 9 lần ngửa trở lên; riêng đúng 9 lần là 10/1024 ≈ 0,98%. Có thể viết 'kết quả 9 lần ngửa trở lên' cho khớp p5."
- trang: bang-chung/p-value
  id: p10
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4877414/fullTextXML"]
  trich: "The p-value is neither. It is a statement about data in relation to a specified hypothetical explanation"
- trang: bang-chung/p-value
  id: p11
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108"]
  trich: "6. By itself, a p-value does not provide a good measure of evidence regarding a model or hypothesis."
  ghi_chu: "Nguyên tắc 6, kèm nguyên tắc 2."
- trang: bang-chung/p-value
  id: p12
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4877414/fullTextXML"]
  trich: "P-values do not measure the probability that the studied hypothesis is true, or the probability that the data were produced by random chance alone."
  ghi_chu: "Cả hai cách hiểu sai được nêu đúng là sai theo nguyên tắc 2 (và hiểu lầm 1, 2 của Greenland). Chi tiết: chính xác là chênh lệch 'lớn như thế hoặc lớn hơn' hiếm ở mức 3%, với điều kiện mọi giả định của mô hình đúng."
- trang: bang-chung/p-value
  id: p13
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4877414/fullTextXML"]
  trich: "methods that emphasize estimation over testing, such as confidence, credibility, or prediction intervals ... may more directly address the size of an effect"
  ghi_chu: "Greenland: 'estimation of the size of effects and the uncertainty surrounding our estimates will be far more important'."
- trang: bang-chung/p-value
  id: p14
  luot_2: dung
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4877414/fullTextXML"]
  trich: "The effect sizes whose test produced P > 0.05 will typically define a range of sizes ... This range corresponds to a 1 − 0.05 = 0.95 or 95 % confidence interval"
  ghi_chu: "Khoảng không chứa 0 tương ứng với p < 0,05 cho giả thuyết hiệu ứng bằng 0, dưới cùng mô hình."
- trang: bang-chung/p-value
  id: p15
  luot_2: dung
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4877414/fullTextXML"]
  trich: "The effect size whose test produced P = 1 is the size most compatible with the data ... and provides a point estimate"
  ghi_chu: "Điểm giữa là ước lượng điểm khi khoảng đối xứng (trường hợp thường gặp, như ví dụ); khoảng bất đối xứng thì không hẳn."
- trang: bang-chung/p-value
  id: p16
  luot_2: dung
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4877414/fullTextXML"]
  trich: "would be considered more compatible with the data ... than sizes outside the range—again, if the statistical model were correct"
- trang: bang-chung/p-value
  id: p17
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4877414/fullTextXML"]
  trich: "Smaller p-values do not necessarily imply the presence of larger or more important effects ... Any effect, no matter how tiny, can produce a small p-value if the sample size or measurement precision is high enough"
  ghi_chu: "Nguyên tắc 5; Greenland: CI cho thấy 'the full range of effect sizes compatible with the data'."
- trang: bang-chung/p-value
  id: p18
  luot_2: dung
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4877414/fullTextXML", "https://psychclassics.yorku.ca/Fisher/Methods/chap3.htm"]
  trich: "the arbitrary classification of results into 'significant' and 'non-significant'"
  ghi_chu: "Fisher 1925 gọi mức này là một điểm 'convenient'; Greenland gọi tiêu chí 95% là 'arbitrary'."
- trang: bang-chung/p-value
  id: p19
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Fisher/Methods/chap3.htm"]
  trich: "The value for which P = .05, or 1 in 20, is 1.96 or nearly 2; it is convenient to take this point as a limit in judging whether a deviation is to be considered significant or not."
  ghi_chu: "Fisher, Statistical Methods for Research Workers (1925), chương 3, tr. 47 (bản psychclassics)."
- trang: bang-chung/p-value
  id: p20
  luot_2: dung
  nguon: ["https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf"]
  trich: "Over time it appears the p-value has become a gatekeeper for whether work is publishable, at least in some fields"
  ghi_chu: "Jessica Utts, ASA president, thông cáo 7/3/2016."
- trang: bang-chung/p-value
  id: p21
  luot_2: dung
  nguon: ["https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf"]
  trich: "This apparent editorial bias leads to the 'file-drawer effect,' in which research with statistically significant outcomes are much more likely to get published ... It also leads to practices called by such names as 'p-hacking' and 'data dredging'"
- trang: bang-chung/p-value
  id: p22
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf"]
  trich: "3. Scientific conclusions and business or policy decisions should not be based only on whether a p-value passes a specific threshold."
  ghi_chu: "Nguyên tắc 3."
- trang: bang-chung/p-value
  id: p23
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108"]
  trich: "A conclusion does not immediately become 'true' on one side of the divide and 'false' on the other."
  ghi_chu: "Nguyên tắc 3; con số 0,049/0,051 là ví dụ minh họa của trang."
- trang: bang-chung/p-value
  id: p24
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632"]
  trich: "Conducting multiple analyses of the data and reporting only those with certain p-values (typically those passing a significance threshold) renders the reported p-values essentially uninterpretable. Cherry-picking ... 'p-hacking'"
  ghi_chu: "Nguyên tắc 4; Simmons và cs. 2011 ('researcher degrees of freedom')."
- trang: bang-chung/p-value
  id: p25
  luot_2: dung
  nguon: ["https://www.cmu.edu/dietrich/sds/docs/loewenstein/MeasPrevalQuestTruthTelling.pdf", "http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632"]
  trich: "2. Deciding whether to collect more data after looking to see whether the results were significant"
  ghi_chu: "John và cs. 2012, Bảng 1, mục 2; Simmons 2011 mô phỏng tình huống B (thêm 10 quan sát mỗi ô)."
- trang: bang-chung/p-value
  id: p26
  luot_2: dung
  nguon: ["https://www.cmu.edu/dietrich/sds/docs/loewenstein/MeasPrevalQuestTruthTelling.pdf", "http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632"]
  trich: "1. In a paper, failing to report all of a study's dependent measures"
  ghi_chu: "John và cs. 2012, mục 1; Simmons 2011 tình huống A. Con số 10 biến là ví dụ của trang."
- trang: bang-chung/p-value
  id: p27
  luot_2: dung
  nguon: ["https://www.cmu.edu/dietrich/sds/docs/loewenstein/MeasPrevalQuestTruthTelling.pdf"]
  trich: "7. Deciding whether to exclude data after looking at the impact of doing so on the results"
  ghi_chu: "John và cs. 2012, mục 7."
- trang: bang-chung/p-value
  id: p28
  luot_2: dung
  nguon: ["https://www.cmu.edu/dietrich/sds/docs/loewenstein/MeasPrevalQuestTruthTelling.pdf", "http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632"]
  trich: "6. In a paper, selectively reporting studies that 'worked'"
  ghi_chu: "John và cs. 2012, mục 6 (và mục 3: không báo cáo mọi điều kiện); Simmons tình huống D."
- trang: bang-chung/p-value
  id: p29
  luot_2: dung
  nguon: ["https://www.cmu.edu/dietrich/sds/docs/loewenstein/MeasPrevalQuestTruthTelling.pdf", "http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632"]
  trich: "Questionable research practices (QRPs) ... can spuriously increase the likelihood of finding evidence in support of a hypothesis ... greatly increase the likelihood of finding support for a false hypothesis"
  ghi_chu: "Simmons 2011: kết hợp bốn bậc tự do cho tỉ lệ dương tính giả 60,7% ở p < .05."
- trang: bang-chung/p-value
  id: p30
  luot_2: dung
  nguon: ["https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download"]
  trich: "original findings that result from selective reporting, p-hacking, or other behaviors that leverage random chance to amplify effect sizes ... should be less likely to replicate than others"
  ghi_chu: "Nosek và cs. 2022 nêu như một kỳ vọng có cơ sở (kèm trích dẫn), không phải con số đo trực tiếp; câu viết 'ít có khả năng' là đúng mức."
- trang: bang-chung/p-value
  id: p31
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf"]
  trich: "4. Proper inference requires full reporting and transparency"
- trang: bang-chung/p-value
  id: p32
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108"]
  trich: "Any effect, no matter how tiny, can produce a small p-value if the sample size or measurement precision is high enough"
  ghi_chu: "Nguyên tắc 5."
- trang: bang-chung/p-value
  id: p33
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4877414/fullTextXML"]
  trich: "Practices that reduce data analysis or scientific inference to mechanical 'bright-line' rules (such as 'p < 0.05') ... can lead to erroneous beliefs and poor decision making."
- trang: bang-chung/p-value
  id: p34
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download"]
  trich: "Researchers should disclose the number of hypotheses explored during the study, all data collection decisions, all statistical analyses conducted, and all p-values computed."
  ghi_chu: "Simmons 2011 yêu cầu 3: 'Authors must list all variables collected in a study'; Nosek 2022: phòng p-hacking bằng 'preregistration and transparency'."
- trang: bang-chung/p-value
  id: p35
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4877414/fullTextXML"]
  trich: "P-values do not measure the probability that the studied hypothesis is true"
- trang: bang-chung/p-value
  id: p36
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4877414/fullTextXML"]
  trich: "Statistical significance is not equivalent to scientific, human, or economic significance."
- trang: bang-chung/p-value
  id: p37
  luot_2: dung
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4877414/fullTextXML", "http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108"]
  trich: "confidence intervals ... allow one to shift focus away from the null hypothesis, toward the full range of effect sizes compatible with the data"
- trang: bang-chung/p-value
  id: p38
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108"]
  trich: "Whenever a researcher chooses what to present based on statistical results, valid interpretation of those results is severely compromised if the reader is not informed of the choice and its basis."
- trang: bang-chung/p-value
  id: p39
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4877414/fullTextXML"]
  trich: "2. P-values do not measure the probability that the studied hypothesis is true ... 5. A p-value, or statistical significance, does not measure the size of an effect or the importance of a result."
  ghi_chu: "Nhãn cho nguyên tắc phương pháp: đây là điều suy ra từ định nghĩa, được tuyên bố chính thức của ASA nêu là 'widely agreed upon principles ... according to widespread consensus in the statistical community' và Greenland 2016 nhắc lại. Đồng thuận cao nhất có thể; nhãn Vững chắc là đúng mức."
- trang: bang-chung/p-value
  id: p40
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4877414/fullTextXML"]
  trich: "The P value is the probability that the test hypothesis is true ... No! ... Statistical significance indicates a scientifically or substantively important relation has been detected. No!"
  ghi_chu: "Greenland và cs. 2016, hiểu lầm 1 và hiểu lầm về ý nghĩa thực tiễn."
- trang: bang-chung/p-value
  id: p41
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download"]
  trich: "Cherry-picking promising findings ... leads to a spurious excess of statistically significant results in the published literature"
  ghi_chu: "Nhãn: phần 'tăng kết quả có ý nghĩa sai' có mô phỏng (Simmons 2011) và tuyên bố ASA, đồng thuận cao. Phần 'khó tái lập hơn' dựa trên lập luận và bằng chứng tương quan (Nosek 2022: 'should be less likely to replicate'); nếu khung là Vững chắc thì nên hiểu là vững cho cơ chế, không cho mức đóng góp (đúng như p43 nói)."
- trang: bang-chung/p-value
  id: p42
  luot_2: dung
  nguon: ["https://www.cmu.edu/dietrich/sds/docs/loewenstein/MeasPrevalQuestTruthTelling.pdf", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download"]
  trich: "Self-admission rate (%) ... 1. failing to report all of a study's dependent measures 63.4 ... 2. Deciding whether to collect more data ... 55.9 ... 6. selectively reporting studies that 'worked' 45.8 ... 7. Deciding whether to exclude data ... 38.2"
  ghi_chu: "John và cs. 2012: 2.155 người trả lời (tỉ lệ phản hồi 36%), nhóm đối chứng. Nosek 2022: 'Most available survey data suggest that psychologists ... acknowledge engaging in questionable research practices'. Lưu ý: có phê bình rằng cách hỏi làm tỉ lệ cao hơn thật; 'khá phổ biến' là cách nói vừa phải."
- trang: bang-chung/p-value
  id: p43
  luot_2: qua-manh
  nguon: ["http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632", "https://www.cmu.edu/dietrich/sds/docs/loewenstein/MeasPrevalQuestTruthTelling.pdf", "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "We used computer simulations of experimental data to estimate how researcher degrees of freedom influence the probability of a false-positive result."
  cau_dung: "Mô phỏng cho thấy các cách làm này làm tăng dương tính giả, và khảo sát cho thấy chúng khá phổ biến; mức đóng góp của chúng vào tỉ lệ không tái lập quan sát được ở các dự án tái lập lớn chưa được đo trực tiếp."
  ghi_chu: "Mô phỏng (Simmons 2011) cho thấy tăng dương tính giả; khảo sát (John 2012) chỉ đo mức phổ biến, không cho thấy dương tính giả tăng. Câu gán cho khảo sát điều nó không đo. Vế sau (chưa đo trực tiếp mức đóng góp) đúng: OSC chỉ gọi các thiên lệch là 'plausible explanations'."
- trang: bang-chung/p-value
  id: p44
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108"]
  trich: "a p-value is the probability under a specified statistical model that a statistical summary of the data ... would be equal to or more extreme than its observed value"
- trang: bang-chung/p-value
  id: p45
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "a single study almost never provides definitive resolution for or against an effect and its explanation"
  ghi_chu: "Lời giải thích cho câu hỏi; hợp với kết luận của OSC 2015."
- trang: bang-chung/p-value
  id: p46
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108"]
  trich: "5. A p-value, or statistical significance, does not measure the size of an effect ... Any effect, no matter how tiny, can produce a small p-value if the sample size ... is high enough"
- trang: bang-chung/p-value
  id: q1
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108"]
  trich: "5. A p-value, or statistical significance, does not measure the size of an effect or the importance of a result ... 2. P-values do not measure the probability that the studied hypothesis is true"
  ghi_chu: "Số thứ tự nguyên tắc 2 và 5 khớp tuyên bố."
- trang: bang-chung/p-value
  id: q2
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108"]
  trich: "3. Scientific conclusions ... should not be based only on whether a p-value passes a specific threshold."
  ghi_chu: "Số thứ tự nguyên tắc 3 khớp."
- trang: bang-chung/p-value
  id: q3
  luot_2: dung
  nguon: ["https://www.cmu.edu/dietrich/sds/docs/loewenstein/MeasPrevalQuestTruthTelling.pdf", "http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download"]
  trich: "6. In a paper, selectively reporting studies that 'worked' ... P-values and related analyses should not be reported selectively."
  ghi_chu: "John 2012 khảo sát việc báo cáo chọn lọc nghiên cứu 'thành công' và không báo cáo mọi biến; ASA nguyên tắc 4 và Nosek 2022 nêu đăng ký trước, minh bạch."
- trang: bang-chung/khung-hoang-tai-lap
  id: k1
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "In total, 100 replications were completed by 270 contributing authors ... defining the sampling frame as 2008 articles of three important psychology journals: Psychological Science, JPSP, and JEP:LMC"
  ghi_chu: "Bản đã bình duyệt (bản tác giả) của OSC 2015."
- trang: bang-chung/khung-hoang-tai-lap
  id: k2
  luot_2: dung
  nguon: ["https://api.crossref.org/works/10.1126/science.aac4716"]
  trich: "Science, 349(6251), published-print 2015-08-28"
- trang: bang-chung/khung-hoang-tai-lap
  id: k3
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "We conducted replications of 100 experimental and correlational studies published in three psychology journals using high-powered designs and original materials when available ... Here, we conducted single-replication attempts of many effects"
- trang: bang-chung/khung-hoang-tai-lap
  id: k4
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "Ninety-seven of 100 (97%) effects from original studies were positive results (four had P values falling a bit short of the .05 criterion ... but all of these were interpreted as positive effects)"
  ghi_chu: "Tóm tắt: 'Ninety-seven percent of original studies had significant results'. Bốn bài có p hơi trên .05 nhưng được tác giả gốc diễn giải là dương tính."
- trang: bang-chung/khung-hoang-tai-lap
  id: k5
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "test whether the replication shows a statistically significant effect (P < 0.05) with the same direction as the original study ... there were just 35 [36.1%; 95% CI = (26.6%, 46.2%)]"
  ghi_chu: "36% là 35 trên 97 hiệu ứng gốc có ý nghĩa."
- trang: bang-chung/khung-hoang-tai-lap
  id: k6
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "Replication effects were half the magnitude of original effects ... (M = 0.403 ...) ... (M = 0.197 ...)"
  ghi_chu: "r trung bình 0,403 so với 0,197."
- trang: bang-chung/khung-hoang-tai-lap
  id: k7
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "Replication effects were half the magnitude ... Thirty-six percent of replications had significant results; 47% of original effect sizes were in the 95% confidence interval of the replication effect size; 39% of effects were subjectively rated to have replicated"
- trang: bang-chung/khung-hoang-tai-lap
  id: k8
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "Any temptation to interpret these results as a defeat for psychology, or science more generally, must contend with the fact that this project demonstrates science behaving as it should ... Accumulating evidence is the scientific community's method of self-correction"
- trang: bang-chung/khung-hoang-tai-lap
  id: k9
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download"]
  trich: "Direct replication is the attempt to recreate the conditions believed sufficient for obtaining a previously observed finding ... with new data"
  ghi_chu: "Câu tả đúng tái lập trực tiếp (loại OSC làm). Nosek 2022 định nghĩa rộng hơn: 'testing the reliability of a prior finding with different data'; nếu muốn chính xác có thể viết 'tái lập trực tiếp'."
- trang: bang-chung/khung-hoang-tai-lap
  id: k10
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "a single study almost never provides definitive resolution for or against an effect and its explanation"
- trang: bang-chung/khung-hoang-tai-lap
  id: k11
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf", "http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632"]
  trich: "A direct replication may not obtain the original result for a variety of reasons: Known or unknown differences ... may moderate the size of an observed effect, the original result could have been a false positive, or the replication could produce a false negative."
  ghi_chu: "Simmons 2011: 'failures to replicate previous findings are never conclusive'."
- trang: bang-chung/khung-hoang-tai-lap
  id: k12
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "Thirty-six percent of replications had significant results; 47% of original effect sizes were in the 95% confidence interval of the replication effect size; 39% of effects were subjectively rated to have replicated the original result"
- trang: bang-chung/khung-hoang-tai-lap
  id: k13
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "A large portion of replications produced weaker evidence for the original findings ... 82 showed a stronger effect size in the original study (82.8%)"
  ghi_chu: "Kết hợp gốc và làm lại vẫn còn 68% có ý nghĩa (nếu giả định không thiên lệch), nên 'thay vì biến mất hoàn toàn' hợp với dữ liệu tổng; một số hiệu ứng thì gần như về 0 (ML2: 9/28 ngược chiều)."
- trang: bang-chung/khung-hoang-tai-lap
  id: k14
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download"]
  trich: "Low-power research designs combined with publication bias favoring positive results together produce a literature with upwardly biased effect sizes ... there are indications of cultural practices in scientific communication"
  ghi_chu: "Nosek 2022: 'publication bias ... or questionable research practices that inflate reported effect sizes'; 'a complex system of policies, norms, and incentives'. OSC nói 'publication, selection, and reporting biases' (p-hacking nằm trong selection/reporting). Vế 'không phải lỗi của một nhà nghiên cứu cụ thể' là cách diễn giải của trang, hợp với khung 'văn hóa, động cơ' của hai nguồn (Nosek có nhắc cả yếu tố cá nhân)."
- trang: bang-chung/khung-hoang-tai-lap
  id: k15
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "In a discipline with low-powered research designs and an emphasis on positive results for publication, effect sizes will be systematically overestimated in the published literature."
- trang: bang-chung/khung-hoang-tai-lap
  id: k16
  luot_2: dung
  nguon: ["https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download"]
  trich: "In a literature with relatively small sample sizes and a publication bias favoring positive results, large observed effects can be a sign of overestimated or false positives rather than of large true effects"
  ghi_chu: "Ví dụ minh họa: xác suất được 8 lần ngửa trở lên với đồng xu công bằng là 56/1024 ≈ 5,5%, đúng là chuyện may rủi không hiếm."
- trang: bang-chung/khung-hoang-tai-lap
  id: k17
  luot_2: dung
  nguon: ["https://raw.githubusercontent.com/CenterForOpenScience/rpp/master/data_allformats/RPPdataConverted.csv", "http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632"]
  trich: "T.N.O.for.tables (cỡ mẫu gốc): trung vị 55 trên 99 nghiên cứu; 51/99 nghiên cứu có N ≤ 60"
  ghi_chu: "Tự tính từ dữ liệu chính thức của OSC 2015 (kho GitHub của Center for Open Science). Simmons 2011 lấy 20 quan sát mỗi ô (40 người, hai điều kiện) làm thiết kế cơ sở và yêu cầu 'at least 20 observations per cell'. Câu 'nhiều nghiên cứu dùng vài chục người' đúng với mẫu này."
- trang: bang-chung/khung-hoang-tai-lap
  id: k18
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632", "http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108"]
  trich: "Should more data be collected? Should some observations be excluded? Which conditions should be combined and which ones compared? Which control variables should be considered?"
- trang: bang-chung/khung-hoang-tai-lap
  id: k19
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632"]
  trich: "Conducting multiple analyses of the data and reporting only those with certain p-values ... renders the reported p-values essentially uninterpretable."
  ghi_chu: "Phép so sánh (vẽ hồng tâm sau khi bắn) là minh họa của trang."
- trang: bang-chung/khung-hoang-tai-lap
  id: k20
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download"]
  trich: "the incentives for individual scientists prioritize novelty over replication ... Positive, novel, tidy results are more likely to get published than negative, replication, or messy results"
- trang: bang-chung/khung-hoang-tai-lap
  id: k21
  luot_2: dung
  nguon: ["https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf"]
  trich: "the 'file-drawer effect,' in which research with statistically significant outcomes are much more likely to get published, while other work that might well be just as important scientifically is never seen in print"
- trang: bang-chung/khung-hoang-tai-lap
  id: k22
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250705011407/https://journals.sagepub.com/doi/pdf/10.1177/25152459211007467", "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "we found 96% positive results in standard reports but only 44% positive results in RRs"
  ghi_chu: "Scheel 2021 và OSC 2015 ('upwardly biased effect sizes')."
- trang: bang-chung/khung-hoang-tai-lap
  id: k23
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download", "http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632"]
  trich: "Low-power research designs combined with publication bias favoring positive results together produce a literature with upwardly biased effect sizes"
- trang: bang-chung/khung-hoang-tai-lap
  id: k24
  luot_2: dung
  nguon: ["https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download", "http://web.archive.org/web/20250705011407/https://journals.sagepub.com/doi/pdf/10.1177/25152459211007467"]
  trich: "preregistration of study designs and analysis plans ... Preregistration ensures that all studies are, in principle, discoverable"
  ghi_chu: "Scheel 2021 dùng khái niệm tương tự cho phần đăng ký của Registered Reports."
- trang: bang-chung/khung-hoang-tai-lap
  id: k25
  luot_2: dung
  nguon: ["https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download"]
  trich: "Preregistration of analysis plans helps to calibrate confidence on the reliability of unplanned analyses"
- trang: bang-chung/khung-hoang-tai-lap
  id: k26
  luot_2: dung
  nguon: ["https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download", "http://web.archive.org/web/20250705011407/https://journals.sagepub.com/doi/pdf/10.1177/25152459211007467"]
  trich: "Registered Reports is a publishing model in which authors receive in-principle acceptance of their proposed studies based on the importance of the question and the quality of the methodology before the outcomes are known"
- trang: bang-chung/khung-hoang-tai-lap
  id: k27
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250705011407/https://journals.sagepub.com/doi/pdf/10.1177/25152459211007467", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download"]
  trich: "Analyzing the first hypothesis of each article, we found 96% positive results in standard reports but only 44% positive results in RRs."
  ghi_chu: "Scheel 2021 (giả thuyết đầu của mỗi bài; 71 RR, 152 bài thường). Tác giả nói giảm thiên lệch xuất bản là 'a plausible factor', không chứng minh nhân quả; vế đầu (bài vẫn được đăng) là đúng theo thiết kế của RR."
- trang: bang-chung/khung-hoang-tai-lap
  id: k28
  luot_2: dung
  nguon: ["https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download"]
  trich: "As of yet, there is no investigation of whether findings from Registered Reports are more replicable on average than other findings."
- trang: bang-chung/khung-hoang-tai-lap
  id: k29
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf", "https://www.nature.com/articles/s41562-018-0399-z"]
  trich: "Known or unknown differences between the replication and original study may moderate the size of an observed effect ... both false positives and inflated effect sizes of true positives contribute to imperfect reproducibility"
  ghi_chu: "Camerer 2018 chỉ đọc được tóm tắt."
- trang: bang-chung/khung-hoang-tai-lap
  id: k30
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "how many of the effects have we established are true? Zero. And, how many of the effects have we established are false? Zero."
- trang: bang-chung/khung-hoang-tai-lap
  id: k31
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "this project demonstrates science behaving as it should ... Accumulating evidence is the scientific community's method of self-correction"
- trang: bang-chung/khung-hoang-tai-lap
  id: k32
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "a single study almost never provides definitive resolution for or against an effect and its explanation"
- trang: bang-chung/khung-hoang-tai-lap
  id: k33
  luot_2: dung
  nguon: ["https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download", "http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632"]
  trich: "Studies with larger samples, better measures, and more tightly controlled designs reduce error and produce more credible evidence"
  ghi_chu: "Simmons: quy tắc dừng thu dữ liệu đặt trước, có thể bằng tính sức mạnh thống kê."
- trang: bang-chung/khung-hoang-tai-lap
  id: k34
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "Surprising effects were less reproducible, as were effects for which it was more challenging to conduct the replication."
- trang: bang-chung/khung-hoang-tai-lap
  id: k35
  luot_2: dung
  nguon: ["https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download", "http://web.archive.org/web/20250705011407/https://journals.sagepub.com/doi/pdf/10.1177/25152459211007467"]
  trich: "guarding against p-hacking, hypothesizing after the results are known (or HARKing), and selective reporting by employing preregistration and transparency"
- trang: bang-chung/khung-hoang-tai-lap
  id: k36
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "Humans desire certainty, and science infrequently provides it ... a single study almost never provides definitive resolution"
  ghi_chu: "Lời khuyên đọc tin; không có nguồn đo trực tiếp về từ ngữ báo chí, nhưng hợp với kết luận của OSC."
- trang: bang-chung/khung-hoang-tai-lap
  id: k37
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "Reproducibility is not well understood because the incentives for individual scientists prioritize novelty over replication"
- trang: bang-chung/khung-hoang-tai-lap
  id: k38
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf", "https://www.nature.com/articles/s41562-018-0399-z", "http://eprints.lse.ac.uk/91159/1/Kappes_Many-labs-2.pdf", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download"]
  trich: "Replication effects were half the magnitude of original effects ... the effect size of the replications is on average about 50% of the original effect size ... The median comparable Cohen's d effect sizes for original findings was 0.60 and for replications was 0.15"
  ghi_chu: "Thước đo mục 4: ba tái lập lớn có đăng ký trước cùng chiều, ML2 trên 36 nước; Nosek 2022 gộp 307 lần làm lại: hiệu ứng bằng 68% bản gốc. Đạt mức Vững chắc cho khẳng định 'thường lớn hơn khi làm lại'."
- trang: bang-chung/khung-hoang-tai-lap
  id: k39
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf", "https://www.nature.com/articles/s41562-018-0399-z", "http://eprints.lse.ac.uk/91159/1/Kappes_Many-labs-2.pdf"]
  trich: "Replication effects were half the magnitude ... about 50% of the original effect size ... median ... 0.60 and for replications was 0.15"
  ghi_chu: "OSC: 'replication pre-registration and pre-analysis plans'; Camerer: 'pre-registered prior to the replications'; ML2: 'preregistered replications'. Camerer 2018 là khoa học xã hội (Nature, Science 2010–2015), không chỉ tâm lý; chỉ đọc tóm tắt."
- trang: bang-chung/khung-hoang-tai-lap
  id: k40
  luot_2: dung
  nguon: ["http://eprints.lse.ac.uk/91159/1/Kappes_Many-labs-2.pdf"]
  trich: "125 samples and 15,305 total participants from 36 countries and territories ... very little heterogeneity was attributable to ... WEIRD versus less WEIRD culture comparisons"
  ghi_chu: "Hiệu ứng làm lại nhỏ hơn xuất hiện trong dữ liệu gộp từ 36 nước, và ít khác giữa các mẫu."
- trang: bang-chung/khung-hoang-tai-lap
  id: k41
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download"]
  trich: "This suggests publication, selection, and reporting biases as plausible explanations for the difference between original and replication effects."
  ghi_chu: "Nhãn cho nguyên tắc phương pháp: đồng thuận trong tổng quan (Nosek 2022, Annual Review) và trong chính OSC, cơ chế có mô phỏng (Simmons 2011); nhưng bằng chứng về vai trò thực tế là tương quan. Câu 'có khả năng góp phần' đúng mức; nhãn hợp lý là Khá vững (Vững chắc nếu chỉ nói về cơ chế)."
- trang: bang-chung/khung-hoang-tai-lap
  id: k42
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download"]
  trich: "This suggests publication, selection, and reporting biases as plausible explanations ... We cannot measure the overestimation of replicability or effect sizes in psychology in general"
- trang: bang-chung/khung-hoang-tai-lap
  id: k43
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download"]
  trich: "a single study almost never provides definitive resolution ... In a literature with relatively small sample sizes and a publication bias favoring positive results, large observed effects can be a sign of overestimated or false positives"
  ghi_chu: "Lời giải cho tình huống giả định."
- trang: bang-chung/khung-hoang-tai-lap
  id: k44
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "Low-power research designs combined with publication bias favoring positive results together produce a literature with upwardly biased effect sizes"
- trang: bang-chung/khung-hoang-tai-lap
  id: k45
  luot_2: dung
  nguon: ["http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download"]
  trich: "Authors must decide the rule for terminating data collection before data collection begins and report this rule in the article ... guarding against p-hacking ... by employing preregistration and transparency"
- trang: bang-chung/khung-hoang-tai-lap
  id: k46
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "Surprising effects were less reproducible"
  ghi_chu: "Kết quả tương quan, 'for some indicators'; câu viết 'càng có thể' là đúng mức. Con số 15 điểm IQ là tình huống giả định của trang."
- trang: bang-chung/khung-hoang-tai-lap
  id: k47
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "The original studies examined here offered tentative evidence"
- trang: bang-chung/khung-hoang-tai-lap
  id: q1
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf"]
  trich: "Ninety-seven of 100 (97%) effects from original studies were positive results ... Replication effects were half the magnitude ... how many of the effects have we established are false? Zero."
- trang: bang-chung/khung-hoang-tai-lap
  id: q2
  luot_2: dung
  nguon: ["https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf", "http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632"]
  trich: "the original result could have been a false positive, or the replication could produce a false negative ... failures to replicate previous findings are never conclusive"
- trang: bang-chung/khung-hoang-tai-lap
  id: q3
  luot_2: dung
  nguon: ["https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download", "http://web.archive.org/web/20250705011407/https://journals.sagepub.com/doi/pdf/10.1177/25152459211007467"]
  trich: "authors receive in-principle acceptance of their proposed studies based on the importance of the question and the quality of the methodology before the outcomes are known"
  ghi_chu: "Scheel: 'the journal commits to publishing the final article ... regardless of whether the hypotheses are supported'."
