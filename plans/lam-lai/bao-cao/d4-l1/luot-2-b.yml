  luot_2: dung
  nguon:
  - https://www2.psych.ubc.ca/~henrich/pdfs/WeirdPeople.pdf
  trich: countries with only 12% of the world's population
  ghi_chu: Con số 12% do Henrich nêu, không có phép tính riêng; khớp.
