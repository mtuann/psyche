  luot_2: dung
  nguon:
  - https://www2.psych.ubc.ca/~henrich/pdfs/WeirdPeople.pdf
  trich: Even within the West, however, the typical sampling method for experimental studies is far from representative
  ghi_chu: 'Henrich: sinh viên không đại diện kể cả trong phương Tây; trẻ hơn, học vấn cao hơn là kiến thức phổ biến, khớp.'
