  id: h29
  luot_2: dung
  nguon:
  - https://doi.org/10.1177/2515245919847202
  - https://doi.org/10.1126/science.aac4716
  - https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full
  trich: replication success was better predicted by the strength of original evidence
  ghi_chu: Hợp với Funder & Ozer, OSC, Lakens.
