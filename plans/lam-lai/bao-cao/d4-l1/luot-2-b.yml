  luot_2: dung
  nguon:
  - https://www2.psych.ubc.ca/~henrich/pdfs/WeirdPeople.pdf
  - https://doi.org/10.1037/0003-066X.63.7.602
  trich: 68% of subjects came from the United States, and a full 96% of subjects were from Western industrialized countries ... (Arnett 2008)
  ghi_chu: 'Arnett: sáu tạp chí hàng đầu của APA; Henrich kể lại: ''six sub-disciplines'', 2003-2007. Chỉ đọc tóm tắt Arnett; số từ Henrich.'
