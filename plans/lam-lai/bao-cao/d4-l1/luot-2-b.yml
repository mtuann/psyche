  id: h27
  luot_2: dung
  nguon:
  - https://doi.org/10.1126/science.aac4716
  trich: Replication effects were half the magnitude of original effects
  ghi_chu: Thiên lệch xuất bản là giải thích thường nêu (cùng với phân tích linh hoạt); câu viết 'một lý do thường được nêu' thận trọng. Bài OSC không chứng minh nguyên nhân.
