- trang: bang-chung/do-lon-hieu-ung
  id: h1
  luot_2: dung
  nguon:
  - https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full
  trich: 'Lakens 2013: effect size ''most important outcome''; d=0,1 giảm tự sát vẫn có hệ quả lớn'
  ghi_chu: 'Nguyên lý thống kê chuẩn: sai số chuẩn giảm theo căn bậc hai của n, nên n=50.000 phát hiện được chênh lệch rất nhỏ. Lakens: hiệu ứng nhỏ vẫn có thể quan trọng.'
- trang: bang-chung/do-lon-hieu-ung
  id: h2
  luot_2: dung
  nguon:
  - https://openstax.org/books/introductory-statistics-2e/pages/1-2-data-sampling-and-variation-in-data-and-sampling
  trich: 'Intro Stats: kiểm định giả thuyết đo bằng chứng chống lại giả thuyết không'
  ghi_chu: 'Cách diễn đạt phổ thông chấp nhận được của p; chặt hơn: xác suất của dữ liệu cực đoan như vậy nếu giả thuyết không đúng.'
- trang: bang-chung/do-lon-hieu-ung
  id: h3
  luot_2: dung
  nguon:
  - https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full
  trich: 'Lakens: effect size dùng để truyền đạt ý nghĩa thực tiễn, khác với p'
  ghi_chu: 'Đúng: p không đo độ lớn.'
- trang: bang-chung/do-lon-hieu-ung
  id: h4
  luot_2: dung
  nguon:
  - https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full
  trich: effect sizes ... used to determine the sample size for follow-up studies
  ghi_chu: 'Quan hệ công suất kiểm định: n càng lớn, hiệu ứng càng nhỏ vẫn đạt p<0,05.'
- trang: bang-chung/do-lon-hieu-ung
  id: h5
  luot_2: dung
  nguon:
  - https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full
  trich: Cohen's d ... standardized mean difference ... compare effects across studies, even when the dependent variables are measured in different ways
  ghi_chu: Ước lượng chuẩn hóa, không phụ thuộc hệ thống vào n (độ chính xác thì có).
- trang: bang-chung/do-lon-hieu-ung
  id: h6
  luot_2: dung
  nguon:
  - https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full
  trich: d = 0.5 means the difference equals half a standard deviation; Hedges' g is the correction for Cohen's d
  ghi_chu: g là d có hiệu chỉnh thiên lệch mẫu nhỏ.
- trang: bang-chung/do-lon-hieu-ung
  id: h7
  luot_2: dung
  nguon:
  - https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full
  trich: r family of effect sizes
  ghi_chu: Định nghĩa chuẩn (Pearson r). Lakens chỉ nêu r là họ effect size; định nghĩa là kiến thức giáo trình.
- trang: bang-chung/do-lon-hieu-ung
  id: h8
  luot_2: dung
  nguon:
  - https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full
  trich: small (d = 0.2), medium (d = 0.5), and large (d = 0.8) based on benchmarks suggested by Cohen (1988)
  ghi_chu: Cohen 1992 (A power primer, https://doi.org/10.1037/0033-2909.112.1.155) nêu 'operationally defined small, medium, and large effects'.
- trang: bang-chung/do-lon-hieu-ung
  id: h9
  luot_2: dung
  nguon:
  - https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full
  trich: OVL = 2Φ(−d/2)
  ghi_chu: 'Tự tính: OVL = 2Φ(−d/2): d=0,2 -> 0,920; d=0,5 -> 0,803; d=0,8 -> 0,689. Xác suất vượt trội Φ(d/√2): 0,556; 0,638; 0,714. Làm tròn 92%, 80%, 69%: khớp.'
- trang: bang-chung/do-lon-hieu-ung
  id: h10
  luot_2: dung
  nguon:
  - https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full
  trich: common language effect size ... probability that a randomly sampled person from one group will have a higher observed measurement
  ghi_chu: 'Tự tính: OVL = 2Φ(−d/2): d=0,2 -> 0,920; d=0,5 -> 0,803; d=0,8 -> 0,689. Xác suất vượt trội Φ(d/√2): 0,556; 0,638; 0,714. Làm tròn 56%, 64%, 71%: khớp.'
- trang: bang-chung/do-lon-hieu-ung
  id: h11
  luot_2: dung
  nguon:
  - https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full
  trich: common language effect size
  ghi_chu: 'Tự tính: OVL = 2Φ(−d/2): d=0,2 -> 0,920; d=0,5 -> 0,803; d=0,8 -> 0,689. Xác suất vượt trội Φ(d/√2): 0,556; 0,638; 0,714. 68,9% ≈ 69%, 71,4% ≈ 71%: khớp (giả định chuẩn, cùng độ lệch chuẩn).'
- trang: bang-chung/do-lon-hieu-ung
  id: h12
  luot_2: dung
  nguon:
  - https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full
  trich: common language effect size
  ghi_chu: 'Với d=0,8, 71,4% cặp nhóm can thiệp cao hơn, nên khoảng 28,6% cặp nhóm đối chứng cao hơn: đúng.'
- trang: bang-chung/do-lon-hieu-ung
  id: h13
  luot_2: dung
  nguon:
  - https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full
  trich: The only reason to use these benchmarks is because findings are extremely novel, and cannot be compared to related findings in the literature (Cohen, 1988)
  ghi_chu: Lakens kể lại Cohen 1988; câu viết 'theo Lakens kể lại' đúng.
- trang: bang-chung/do-lon-hieu-ung
  id: h14
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/1089-2680.7.4.331
  - https://doi.org/10.1177/2515245919847202
  trich: social psychological effects typically yield a value of r equal to .21
  ghi_chu: Gom Richard 2003, Gignac 2016, Funder & Ozer 2019 cùng chiều.
- trang: bang-chung/do-lon-hieu-ung
  id: h15
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/1089-2680.7.4.331
  trich: References to 322 meta-analyses of social psychological phenomena ... typically yield a value of r equal to .21
  ghi_chu: Đọc tóm tắt (toàn văn chưa mở); đủ cho con số.
- trang: bang-chung/do-lon-hieu-ung
  id: h16
  luot_2: dung
  nguon:
  - https://forrt.org/curated_resources/effect-size-guidelines-for-individual-di/
  - https://doi.org/10.1016/j.paid.2016.06.069
  trich: Based on 708 meta-analytically derived correlations ... 0.10, 0.20, and 0.30 as relatively small, typical, and relatively large
  ghi_chu: Chỉ đọc được tóm tắt qua trang tổng hợp (FORRT) và bài trích dẫn; toàn văn Elsevier không mở được. Phân vị 0,11/0,19/0,29.
- trang: bang-chung/do-lon-hieu-ung
  id: h17
  luot_2: dung
  nguon:
  - https://forrt.org/curated_resources/effect-size-guidelines-for-individual-di/
  trich: fewer than 3% of the correlations reached 0.50
  ghi_chu: Qua bản tóm tắt FORRT, không phải toàn văn.
- trang: bang-chung/do-lon-hieu-ung
  id: h18
  luot_2: dung
  nguon:
  - https://doi.org/10.1177/2515245919847202
  trich: r of .05 ... very small for the explanation of single events but potentially consequential in the not-very-long run
  ghi_chu: Tóm tắt của bài.
- trang: bang-chung/do-lon-hieu-ung
  id: h19
  luot_2: dung
  nguon:
  - https://doi.org/10.1177/2515245919847202
  trich: A very large effect size (r = .40 or greater) in the context of psychological research is likely to be a gross overestimate that will rarely be found in a large sample or in a replication
  ghi_chu: Khớp.
- trang: bang-chung/do-lon-hieu-ung
  id: h20
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/a0037559
  trich: the mean weighted effect size from the random-effects model, g = 0.50 (CI [0.42, 0.58])
  ghi_chu: Đọc toàn văn Results và Discussion (bản PDF qua courseware EPFL). Nên ghi là testing vs restudy.
- trang: bang-chung/do-lon-hieu-ung
  id: h21
  luot_2: dung
  nguon:
  - https://doi.org/10.1007/s10648-025-10002-w
  trich: studies testing the matching hypothesis (effect size d = .04)
  ghi_chu: Tóm tắt Crossref; tác giả Hattie và O'Leary, 17 phân tích tổng hợp.
- trang: bang-chung/do-lon-hieu-ung
  id: h22
  luot_2: dung
  nguon:
  - https://doi.org/10.1177/0956797621989733
  trich: k = 36; N = 3,531 ... Confirmatory tests found a nonsignificant result (d = 0.06)
  ghi_chu: Khớp.
- trang: bang-chung/do-lon-hieu-ung
  id: h23
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/a0037559
  - https://doi.org/10.3102/0034654316689306
  trich: practice tests are more beneficial for learning than restudying and all other comparison conditions
  ghi_chu: Hai phân tích tổng hợp (Rowland 2014; Adesope 2017) cùng chiều, g≈0,50, nhiều loại người học. Đạt thước Vững chắc.
- trang: bang-chung/do-lon-hieu-ung
  id: h24
  luot_2: dung
  nguon:
  - https://doi.org/10.1111/j.1539-6053.2009.01038.x
  - https://doi.org/10.1007/s10648-025-10002-w
  trich: overwhelming evidence discrediting the matching hypothesis; d = .04
  ghi_chu: Pashler 2008 (không có bằng chứng đủ) và tổng hợp 2025 d=0,04. Phù hợp thước 'Đã bị bác bỏ' (kiểm tra mạnh liên tục thất bại).
- trang: bang-chung/do-lon-hieu-ung
  id: h25
  luot_2: dung
  nguon:
  - https://doi.org/10.1177/1745691616652873
  - https://doi.org/10.1177/0956797621989733
  trich: 'Registered Replication Report: size of ego-depletion effect was small with 95% CI encompassing zero; Vohs 2021 d = 0.06'
  ghi_chu: 'Biên giới giữa ''Đang tranh cãi'' và ''Đã bị bác bỏ'': hai tái lập lớn có đăng ký trước (Hagger 2016, Vohs 2021) đều không thấy hiệu ứng, nhưng còn phân tích thăm dò và tổng hợp cũ có hiệu ứng trung bình. Nhãn trên trang chấp nhận được; chủ repo cân nhắc.'
- trang: bang-chung/do-lon-hieu-ung
  id: h26
  luot_2: dung
  nguon:
  - https://doi.org/10.1177/2515245918810225
  trich: The median comparable Cohen's ds were 0.60 for the original findings and 0.15 for the replications
  ghi_chu: 28 phát hiện, 125 mẫu, 36 nước/vùng. Khớp.
