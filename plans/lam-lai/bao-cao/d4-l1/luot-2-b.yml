  ghi_chu: Dữ liệu Segall 1966, 16 xã hội; sinh viên Mỹ cần đoạn a dài hơn khoảng một phần năm; San gần như không bị lừa. Khớp.
- trang: bang-chung/mau-va-chon-mau
  id: m50
  luot_2: qua-manh
  cau_dung: Mẫu lệch, không giống tổng thể ở những đặc điểm liên quan tới điều đang đo, có thể cho kết luận sai về tổng thể.
  nguon:
  - https://openstax.org/books/introductory-statistics-2e/pages/1-2-data-sampling-and-variation-in-data-and-sampling
  - https://doi.org/10.1017/S014555320001035X
  trich: Conclusions drawn from a biased sample can be incorrect
  ghi_chu: 'Giáo trình nói ''có thể sai''. Mẫu lệch không luôn dẫn đến kết luận sai (xem chính trang, mẫu thuận tiện); câu nhãn nên nói ''có thể''. Mức đồng thuận về nguyên tắc: cao (Vững chắc là hợp lý).'
