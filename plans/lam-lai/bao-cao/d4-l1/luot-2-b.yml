- trang: bang-chung/mau-va-chon-mau
  id: q1
  luot_2: qua-manh
  cau_dung: Khảo sát thu nhiều câu trả lời nhưng chọn lệch có thể sai nặng, vì mẫu lớn không sửa thiên lệch; thăm dò Literary Digest 1936 dự đoán sai người thắng, với tỉ lệ trả lời khoảng 24% và người ủng hộ Landon trả lời nhiều hơn; các nghiên cứu sau còn tranh luận danh sách gửi phiếu góp bao nhiêu vào sai lệch.
  nguon:
  - https://doi.org/10.1017/S014555320001035X
  - https://openstax.org/books/introductory-statistics-2e/pages/1-2-data-sampling-and-variation-in-data-and-sampling
  trich: 'Of the 10 million cards sent out, nearly 2.4 million were returned ... The reason for the magazine''s mistaken prognosis was that those who participated in the poll turned out heavily in favor of the Republican challenger (Lusinchi: danh sách không phải trở ngại)'
  ghi_chu: 'Nguồn bất đồng về nguyên nhân: Squire cho cả danh sách lẫn không trả lời, Lusinchi 2012 cho rằng danh sách không đủ gây sai. ''Danh sách lệch'' nói chắc quá.'
