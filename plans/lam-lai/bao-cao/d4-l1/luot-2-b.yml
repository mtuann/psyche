  id: m2
  luot_2: dung
  nguon:
  - https://www2.psych.ubc.ca/~henrich/pdfs/WeirdPeople.pdf
  trich: This means that 96% of psychological samples come from countries with only 12% of the world's population
  ghi_chu: Toàn văn bản UBC của Henrich. Con số 96% là của Arnett 2008 mà Henrich dẫn.
- trang: bang-chung/mau-va-chon-mau
  id: m3
  luot_2: khong-chac
  ghi_chu: Toàn văn bài và OpenAlex không có gì về phản ứng của báo chí. Không tìm thấy nguồn bậc 1-2 xác nhận 'gây chấn động' hay 'báo chí quốc tế đưa tin rộng rãi giữa năm 2010'. Nên bỏ hoặc thay bằng điều đo được (số lần trích dẫn) hoặc dẫn nguồn lịch sử.
- trang: bang-chung/mau-va-chon-mau
