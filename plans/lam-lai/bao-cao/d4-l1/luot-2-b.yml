  trich: Joseph Henrich, Steven J. Heine, Ara Norenzayan; Department of Psychology, University of British Columbia
  ghi_chu: 'Henrich: Psychology và Economics, UBC. Bài đăng Behavioral and Brain Sciences 33(2-3), 2010.'
