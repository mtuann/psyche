  id: m22
  luot_2: qua-manh
  cau_dung: Trong các tạp chí hàng đầu (ví dụ Journal of Personality and Social Psychology), phần lớn mẫu là sinh viên tâm lý học (67% mẫu Mỹ, 80% mẫu ngoài Mỹ, theo Arnett 2008); các chuyên ngành khác (lâm sàng, phát triển) dùng nhiều loại mẫu hơn.
  nguon:
  - https://www2.psych.ubc.ca/~henrich/pdfs/WeirdPeople.pdf
  - https://doi.org/10.1037/0003-066X.63.7.602
  trich: 67% of the American samples (and 80% of the samples from other countries) were composed solely of undergraduates in psychology courses (Arnett 2008)
  ghi_chu: Số liệu này ở tạp chí JPSP, không phải toàn bộ tâm lý học; 'phần lớn nghiên cứu tâm lý học' nói rộng hơn bằng chứng.
