  ghi_chu: 'Tự tính: OVL = 2Φ(−d/2): d=0,2 -> 0,920; d=0,5 -> 0,803; d=0,8 -> 0,689. Xác suất vượt trội Φ(d/√2): 0,556; 0,638; 0,714. Khớp 92% và 56%.'
