  id: h28
  luot_2: dung
  nguon:
  - https://doi.org/10.1177/2515245919847202
  - https://doi.org/10.1177/2515245918810225
  trich: likely to be a gross overestimate that will rarely be found in a large sample or in a replication
  ghi_chu: Lời khuyên hợp với bằng chứng.
