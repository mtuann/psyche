  ghi_chu: Khớp (60,8% phiếu phổ thông).
- trang: bang-chung/mau-va-chon-mau
  id: m33
  luot_2: dung
  nguon:
  - https://www.archives.gov/electoral-college/1936
  - https://doi.org/10.1017/S014555320001035X
  trich: 'Winner: 523 ... Main Opponent: 8 (of 531)'
  ghi_chu: Phiếu đại cử tri 523 trên 531; Landon chỉ thắng Maine và Vermont. 'Một trong những chiến thắng cách biệt nhất' hợp lý.
- trang: bang-chung/mau-va-chon-mau
  id: m34
  luot_2: qua-manh
  cau_dung: Danh sách gửi phiếu của Literary Digest (khoảng 10 triệu phiếu) lập từ nhiều nguồn, trong đó phần lớn là danh bạ điện thoại và danh sách đăng ký ô tô.
  nguon:
  - https://doi.org/10.1017/S014555320001035X
  trich: the bulk of its list was based on telephone directories and registers of automobile owners; ... rosters of clubs and associations, voter registration rolls, occupational records, classified mail-order and city directories
  ghi_chu: Danh sách còn gồm hội, đăng ký cử tri, nghề nghiệp, danh bạ khác; 'phần lớn' là điện thoại và ô tô.
- trang: bang-chung/mau-va-chon-mau
  id: m35
  luot_2: dung
  nguon:
  - https://doi.org/10.1017/S014555320001035X
  trich: Of the 10 million cards sent out, nearly 2.4 million were returned, for a response rate of roughly 24 percent
  ghi_chu: Khớp.
- trang: bang-chung/mau-va-chon-mau
  id: m36
  luot_2: qua-manh
  cau_dung: Cách giải thích quen thuộc là người có điện thoại và ô tô khá giả hơn nên nghiêng về Landon; nhưng dữ liệu Gallup 1937 (Squire 1988) cho thấy ngay nhóm này vẫn ủng hộ Roosevelt (khoảng 61%), nên danh sách chỉ giải thích một phần; việc người ủng hộ Landon trả lời nhiều hơn cũng góp phần.
  nguon:
  - https://doi.org/10.1017/S014555320001035X
  trich: 'owners of only an automobile or a telephone were less supportive of Roosevelt than those who did not have either, but they were still strongly for him ... 61 percent of telephone and car owners favored Roosevelt (Squire 1988: 129-130, theo Lusinchi)'
  ghi_chu: Câu 'chỉ gia đình khá giả mới có ... nghiêng về Landon' là 'cách giải thích quy ước', bị Squire, Cahalan và Lusinchi nghi ngờ; chủ sở hữu vẫn ủng hộ Roosevelt. Squire ước tính lệch danh sách 11 điểm, lệch không trả lời 7 điểm.
- trang: bang-chung/mau-va-chon-mau
  id: m37
  luot_2: dung
  nguon:
  - https://doi.org/10.1017/S014555320001035X
  - https://doi.org/10.1086/269085
  trich: nonresponse bias contributed greatly ...; 'But, more importantly, the initial sample was flawed'; sample bias 11 points and nonresponse 7 points
  ghi_chu: Squire dùng khảo sát Gallup (AIPO) tháng 5/1937; kết luận qua Lusinchi trích. Lưu ý Lusinchi 2012 phản biện. Chưa mở toàn văn Squire.
