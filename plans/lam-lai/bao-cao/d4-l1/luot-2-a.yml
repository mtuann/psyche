  id: t1
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22591295/", "https://www.nih.gov/news-events/news-releases/nih-study-finds-coffee-drinkers-have-lower-risk-death"]
  trich: "Freedman 2012 đăng NEJM 17/5/2012; thông cáo NIH 16/5/2012; báo AP, Tufts, ScienceDaily có tiêu đề kiểu 'Coffee drinkers live longer'."
  ghi_chu: "Tiêu đề thực sự xuất hiện (Tufts: 'Coffee Drinkers Live Longer'); chỉ đọc kết quả tìm kiếm và thông cáo NIH qua tìm kiếm."
- trang: bang-chung/tuong-quan-nhan-qua
  id: t2
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22591295/"]
  trich: "229,119 men and 173,141 women ... aged 50 to 71; 5,148,760 person-years, 1995 to 2008."
  ghi_chu: "402.260 người, khoảng 12,8-13 năm theo dõi trung bình: khớp 'hơn 400.000' và 'khoảng 13 năm'."
- trang: bang-chung/tuong-quan-nhan-qua
  id: t3
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22591295/"]
  trich: "Hazard ratios 2-3 cups/day: men 0.90 (0.86-0.93), women 0.87 (0.83-0.92)."
  ghi_chu: "HR 0,90 và 0,87 tương ứng nguy cơ thấp hơn 10% và 13%; hiệu chỉnh gồm hút thuốc."
- trang: bang-chung/tuong-quan-nhan-qua
  id: t4
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22591295/", "https://www.nih.gov/news-events/news-releases/nih-study-finds-coffee-drinkers-have-lower-risk-death"]
  trich: "Age-adjusted models showed higher death risk among coffee drinkers."
  ghi_chu: "Khớp. Bản tóm tắt qua công cụ đọc web; chữ thật của abstract PubMed."
- trang: bang-chung/tuong-quan-nhan-qua
  id: t5
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22591295/", "https://www.nih.gov/news-events/news-releases/nih-study-finds-coffee-drinkers-have-lower-risk-death"]
  trich: "Coffee drinkers were more likely to smoke."
  ghi_chu: "Khớp; thông cáo NIH (qua tìm kiếm) còn nói uống rượu, ăn thịt đỏ nhiều hơn."
- trang: bang-chung/tuong-quan-nhan-qua
  id: t6
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22591295/"]
  trich: "After adjusting for smoking and other confounders, coffee consumption was inversely associated with mortality."
  ghi_chu: "Khớp; ghi chú: đảo chiều do hiệu chỉnh hút thuốc và các yếu tố khác, chủ yếu hút thuốc."
- trang: bang-chung/tuong-quan-nhan-qua
  id: t7
  luot_2: dung
  nguon: ["https://pubmed.ncbi.nlm.nih.gov/22591295/"]
  trich: "\"Whether this was a causal or associational finding cannot be determined from our data.\""
  ghi_chu: "Khớp: tác giả nói không xác định được nhân quả."
