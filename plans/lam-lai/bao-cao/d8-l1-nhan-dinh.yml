- trang: trai-nghiem/index
  id: n1
  cau: Các công cụ này để trải nghiệm một hiện tượng, không để đánh giá trí tuệ, trí nhớ hay sức khỏe; một lần làm trên điện thoại hay máy tính có rất nhiều yếu tố ngẫu nhiên.
  loai: phat-hien
- trang: trai-nghiem/stroop
  id: n1
  cau: Với người đọc thạo, việc đọc một chữ gần như tự động; gọi tên màu sắc ít luyện tập hơn và chậm hơn.
  loai: phat-hien
- trang: trai-nghiem/stroop
  id: n2
  cau: Khi chữ và màu mực mâu thuẫn, câu trả lời tự động chen vào; kìm nó lại tốn thời gian và đôi khi thất bại, nên lượt không khớp chậm hơn và dễ sai hơn.
  loai: phat-hien
- trang: trai-nghiem/stroop
  id: n3
  cau: "Stroop (1935), Thí nghiệm 1: 70 sinh viên; đọc chữ chỉ màu in mực màu khác chỉ chậm hơn khoảng 2,3 giây so với chữ in mực đen, khoảng 5,6%, và Stroop coi chênh lệch này là không đáng tin cậy."
  loai: so-lieu
- trang: trai-nghiem/stroop
  id: n4
  cau: "Stroop (1935), Thí nghiệm 2: 100 sinh viên, mỗi thẻ 100 mục; gọi tên màu ô vuông mất trung bình 63,3 giây, màu mực của chữ chỉ màu khác 110,3 giây, chậm hơn khoảng 74%."
  loai: so-lieu
- trang: trai-nghiem/stroop
  id: n5
  cau: Chữ cản trở việc gọi tên màu rất mạnh, nhưng màu gần như không cản trở việc đọc chữ.
  loai: phat-hien
- trang: trai-nghiem/stroop
  id: n6
  cau: Năm 1991, MacLeod tổng quan khoảng 400 nghiên cứu về hiệu ứng Stroop và rút ra 18 phát hiện lặp đi lặp lại mà mọi lý thuyết phải giải thích được.
  loai: so-lieu
- trang: trai-nghiem/stroop
  id: n7
  cau: "Trả lời bằng phím bấm cho hiệu ứng nhỏ hơn trả lời bằng lời: trong hai thí nghiệm năm 2019, mức cản trở (lượt không khớp so với lượt trung tính XXXX) khi bấm phím là 76 ms và 73 ms, khi nói to là 155 ms và 168 ms, khoảng gấp đôi."
  loai: so-lieu
- trang: trai-nghiem/stroop
  id: n8
  cau: "Vững chắc: gọi tên màu mực chậm hơn khi chữ chỉ một màu khác; là một trong những phát hiện được tái lập nhiều nhất, với hàng trăm nghiên cứu và nhiều biến thể; độ lớn phụ thuộc vào cách trả lời, số màu, tỉ lệ lượt, người tham gia."
  loai: nhan
- trang: trai-nghiem/stroop
  id: n9
  cau: 'Điểm Stroop của một người không ổn định lắm: trong một nghiên cứu, độ tin cậy giữa hai lần đo cách nhau 3 tuần khoảng 0,6–0,7, dưới mức 0,8 thường được coi là cần khi đánh giá từng người; các tác giả gọi đây là "nghịch lý độ tin cậy".'
  loai: so-lieu
- trang: trai-nghiem/stroop
  id: n10
  cau: 'Đang tranh cãi: dùng hiệu ứng Stroop để đo "khả năng tự kiểm soát" của từng người; nhiệm vụ cho hiệu ứng nhóm càng chắc chắn thì thường càng kém trong việc phân biệt người này với người kia.'
  loai: nhan
- trang: trai-nghiem/stroop
  id: n11
  cau: "Các cách giải thích: tốc độ xử lý (đọc nhanh hơn gọi tên màu), tính tự động (đọc đã thành tự động), và mô hình mạng nơ-ron coi đọc và gọi tên màu là hai con đường cạnh tranh, chú ý tăng sức cho con đường đúng; các cách không loại trừ nhau, tranh luận về chi tiết vẫn tiếp tục."
  loai: dinh-nghia
- trang: trai-nghiem/stroop
  id: n12
  cau: Kỹ năng đã thành thạo chạy tự động và có thể chen vào khi ta cần làm điều khác; kìm một phản ứng tự động tốn thời gian và công sức, ngay cả trong nhiệm vụ đơn giản.
  loai: phat-hien
- trang: trai-nghiem/stroop
  id: n13
  cau: Có rất ít bằng chứng rằng luyện tập các bài nhận thức như Stroop giúp làm tốt hơn những việc khác xa bài đã luyện, hay giúp ích cho việc dùng trí óc hằng ngày.
  loai: loi-khuyen
- trang: trai-nghiem/stroop
  id: n14
  cau: Trong tiếng Việt, "xanh" có thể là xanh lá hay xanh dương.
  loai: dinh-nghia
- trang: trai-nghiem/stroop
  id: n15
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy số liệu chuẩn có công bố cho phiên bản tiếng Việt của bài Stroop.
  loai: thoi-su
- trang: trai-nghiem/stroop
  id: n16
  cau: Hiệu ứng Stroop đã được nghiên cứu ở nhiều ngôn ngữ và hệ chữ viết.
  loai: phat-hien
- trang: trai-nghiem/stroop
  id: n17
  cau: Màn hình, bàn phím và màn cảm ứng đều có độ trễ, khác nhau giữa các thiết bị và trình duyệt; nếu độ trễ gần như như nhau ở mọi lượt, phép trừ giữa hai điều kiện ít bị ảnh hưởng hơn từng con số riêng lẻ.
  loai: phat-hien
- trang: trai-nghiem/stroop
  id: n18
  cau: Phiên bản đếm dựa trên ý tưởng "Stroop đếm", tạo cùng loại xung đột giữa phản ứng tự động (đọc chữ số) và nhiệm vụ (đếm) mà không dùng màu.
  loai: cong-cu
- trang: trai-nghiem/stroop
  id: n20
  cau: "Câu hỏi 4, lời giải thích: một cách giải thích vì sao trả lời bằng lời cho hiệu ứng lớn hơn là câu trả lời sai và đúng cạnh tranh trên cùng một kênh lời nói; đây là một lý do không nên so thẳng kết quả bấm phím với con số 74% của Stroop (1935)."
  loai: phat-hien
- trang: trai-nghiem/stroop
  id: n19
  cau: Trung vị phản ánh lượt điển hình tốt hơn trung bình vì thời gian phản ứng có đuôi dài về phía chậm.
  loai: dinh-nghia
- trang: trai-nghiem/do-dai-tri-nho
  id: n1
  cau: "Khi giữ một dãy số trong đầu đủ lâu để gõ lại, bạn dùng trí nhớ ngắn hạn, hay gần hơn là trí nhớ làm việc: nơi giữ và thao tác thông tin trong vài giây; nó có dung lượng rất hạn chế."
  loai: dinh-nghia
- trang: trai-nghiem/do-dai-tri-nho
  id: n2
  cau: Phần ngược khó hơn vì không chỉ giữ mà còn phải đảo thứ tự, vừa lưu vừa xử lý; độ dài trí nhớ ngược thường được coi là gần với trí nhớ làm việc hơn.
  loai: phat-hien
- trang: trai-nghiem/do-dai-tri-nho
  id: n3
  cau: "Woods và cộng sự (2011): phiên bản trên máy tính, chữ số được đọc to; 763 người trưởng thành 18–65 tuổi trong cộng đồng đạt trung bình khoảng 6,4–6,5 chữ số xuôi và 4,6–4,9 chữ số ngược, tùy cách tính điểm."
  loai: so-lieu
- trang: trai-nghiem/do-dai-tri-nho
  id: n4
  cau: Con số này gần với bộ chuẩn của thang trí nhớ Wechsler (xuôi 6,6; ngược 4,9) được dùng để so sánh trong cùng nghiên cứu.
  loai: so-lieu
- trang: trai-nghiem/do-dai-tri-nho
  id: n5
  cau: Một nhóm nhỏ hơn, trẻ hơn (30 người, 18–46 tuổi) đạt khoảng 7,4 xuôi và 5,8–6,0 ngược.
  loai: so-lieu
- trang: trai-nghiem/do-dai-tri-nho
  id: n6
  cau: Độ dài ngược giảm dần theo tuổi, và cả hai tăng theo trình độ học vấn.
  loai: phat-hien
- trang: trai-nghiem/do-dai-tri-nho
  id: n7
  cau: Ở các nghiên cứu đó, chữ số được đọc to và người tham gia nghe, rồi nói lại; các nghiên cứu làm bằng tiếng Anh.
  loai: phat-hien
- trang: trai-nghiem/do-dai-tri-nho
  id: n8
  cau: Một lần làm có nhiều yếu tố ngẫu nhiên; dao động ±1 chữ số là bình thường.
  loai: so-lieu
- trang: trai-nghiem/do-dai-tri-nho
  id: n9
  cau: Con số "7 ± 2" của Miller (1956) và ước lượng khoảng 4 "cụm" của Cowan (2001) được kể ở bài Trí nhớ làm việc, cùng tranh luận về giới hạn ấy.
  loai: lich-su
- trang: trai-nghiem/do-dai-tri-nho
  id: n10
  cau: Ta vẫn nhớ được 6–7 chữ số vì tự động nhóm chúng ("0912 345 678" là ba cụm) và có thể nhẩm lặp thầm.
  loai: phat-hien
- trang: trai-nghiem/do-dai-tri-nho
  id: n11
  cau: "Vững chắc: dung lượng trí nhớ ngắn hạn rất hạn chế, và người trưởng thành thường nhớ khoảng 6–7 chữ số xuôi, 4–5 chữ số ngược; đo trên nhiều mẫu lớn, kể cả bộ chuẩn Wechsler; con số phụ thuộc cách trình bày, cách tính điểm, tuổi, học vấn, ngôn ngữ."
  loai: nhan
- trang: trai-nghiem/do-dai-tri-nho
  id: n12
  cau: 'Khá vững: giới hạn "thật" khoảng 4 cụm thông tin; được ủng hộ bởi nhiều loại bằng chứng Cowan tổng hợp; một tổng quan của 16 nhà nghiên cứu coi khoảng 3–4 cụm là chuẩn mực "có điều kiện", vì phụ thuộc vào cách hiểu thế nào là một cụm.'
  loai: nhan
- trang: trai-nghiem/do-dai-tri-nho
  id: n13
  cau: Tên chữ số càng ngắn khi đọc, người ta càng nhớ được nhiều chữ số.
  loai: phat-hien
- trang: trai-nghiem/do-dai-tri-nho
  id: n14
  cau: Ở người song ngữ xứ Wales, tên chữ số tiếng Wales dài hơn khi đọc so với tiếng Anh, và độ dài trí nhớ chữ số bằng tiếng Wales ngắn hơn rõ rệt; khác biệt do độ dài từ, không phải trí thông minh.
  loai: phat-hien
- trang: trai-nghiem/do-dai-tri-nho
  id: n15
  cau: Trẻ em nói tiếng Trung, vốn có tên chữ số được đọc rất nhanh, nhớ được nhiều chữ số xuôi hơn trẻ em nói tiếng Anh (Stigler và cộng sự, 1986).
  loai: phat-hien
- trang: trai-nghiem/do-dai-tri-nho
  id: n16
  cau: Tên chữ số tiếng Việt đều chỉ có một âm tiết (một, hai, ba…).
  loai: dinh-nghia
- trang: trai-nghiem/do-dai-tri-nho
  id: n17
  cau: Từ các nghiên cứu trên, có thể dự đoán người Việt nhớ được nhiều chữ số hơn khi làm bằng tiếng Việt so với bộ chuẩn tiếng Anh; đây mới là suy luận.
  loai: phat-hien
- trang: trai-nghiem/do-dai-tri-nho
  id: n18
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào so sánh điều này ở người Việt; bộ chuẩn tiếng Việt đầu tiên cho bài nhắc lại chữ số mà chúng tôi tìm thấy (người từ 40 tuổi, Nguyen và cộng sự, 2025) tính điểm theo số lượt đúng chứ không theo độ dài dãy.
  loai: thoi-su
- trang: trai-nghiem/do-dai-tri-nho
  id: n19
  cau: Nhóm thông tin lại khi phải nhớ tạm; đừng trông cậy vào trí nhớ ngắn hạn cho việc quan trọng; hướng dẫn quá nhiều bước thì người nghe dễ quên, viết ra hay chia nhỏ giúp ích. Các gợi ý này suy ra từ giới hạn của trí nhớ ngắn hạn.
  loai: loi-khuyen
- trang: trai-nghiem/do-dai-tri-nho
  id: n20
  cau: Độ dài trí nhớ chữ số là một phần của một số bài đánh giá chuyên môn, nhưng một lần làm trên mạng không thể dùng để đánh giá trí tuệ hay phát hiện vấn đề sức khỏe.
  loai: phat-hien
- trang: trai-nghiem/ao-giac-thi-giac
  id: n1
  cau: Đoạn có cánh hướng ra thường trông dài hơn đoạn có cánh hướng vào, dù độ dài thật bằng nhau.
  loai: phat-hien
- trang: trai-nghiem/ao-giac-thi-giac
  id: n2
  cau: 'Một cách giải thích: não "đọc" các cánh như góc tường ba chiều (đoạn cánh hướng ra giống góc trong của căn phòng, trông như ở xa hơn; đoạn cánh hướng vào giống góc ngoài của ngôi nhà, trông như ở gần hơn) rồi tự bù trừ khoảng cách; cách khác cho rằng đây là đặc tính xử lý của hệ thị giác, không cần diễn giải ba chiều; các cách giải thích còn tranh luận.'
  loai: dinh-nghia
- trang: trai-nghiem/ao-giac-thi-giac
  id: n3
  cau: Nghiên cứu xuyên văn hóa của Segall, Campbell và Herskovits báo cáo mức bị ảo giác khác nhau giữa các xã hội; chuyện kể đầy đủ ở bài Ảo giác thị giác.
  loai: phat-hien
- trang: trai-nghiem/ao-giac-thi-giac
  id: n4
  cau: "Theo Henrich và cộng sự (2010) kể lại: sinh viên đại học Mỹ cần đoạn cánh hướng vào dài hơn đoạn cánh hướng ra khoảng một phần năm mới thấy bằng nhau; người San ở Kalahari gần như không bị ảo giác."
  loai: so-lieu
- trang: trai-nghiem/ao-giac-thi-giac
  id: n5
  cau: "Vững chắc: ảo giác Müller-Lyer là hiệu ứng tri giác mạnh, tái lập rộng rãi; được mô tả từ năm 1889 và đo trong nhiều nghiên cứu suốt hơn một thế kỷ; một tổng quan định lượng 18 nghiên cứu thấy hiệu ứng lên phán đoán bằng mắt lớn hơn lên động tác cầm nắm, và hiệu ứng lên cầm nắm cũng gần như luôn lớn hơn 0."
  loai: nhan
- trang: trai-nghiem/ao-giac-thi-giac
  id: n6
  cau: 'Đang tranh cãi: vì sao có ảo giác (góc ba chiều, xử lý thần kinh, học từ môi trường), và khác biệt văn hóa lớn đến đâu; một phân tích lại năm 2026 cho rằng bằng chứng về khác biệt văn hóa không nhất quán và giả thuyết "thế giới thợ mộc" gần như chắc chắn sai.'
  loai: nhan
- trang: trai-nghiem/ao-giac-thi-giac
  id: n7
  cau: Góc và độ dài cánh ảnh hưởng đến độ mạnh của ảo giác.
  loai: phat-hien
- trang: trai-nghiem/mu-thay-doi
  id: n1
  cau: Bình thường, một thay đổi tạo ra tín hiệu chuyển động tại chỗ của nó và hệ thị giác hướng chú ý tới đó; màn xám xen giữa tạo tín hiệu chuyển động khắp màn hình, nhấn chìm tín hiệu thật; chú ý phải soát từng vùng, nên thay đổi lớn, lặp đi lặp lại vẫn có thể không thấy suốt nhiều giây.
  loai: phat-hien
- trang: trai-nghiem/mu-thay-doi
  id: n2
  cau: "Rensink, O'Regan và Clark (1997): ảnh đời thực xen kẽ bản chỉnh sửa, giữa hai lần hiện có màn trống ngắn; thay đổi ở vùng được quan tâm phát hiện sau trung bình 4,7 giây, vùng ít được quan tâm 10,9 giây."
  loai: so-lieu
- trang: trai-nghiem/mu-thay-doi
  id: n3
  cau: Có ảnh người xem cần hơn 80 lần đổi hình (khoảng 50 giây) mới nhận ra, dù thay đổi hiển nhiên khi đã thấy.
  loai: so-lieu
- trang: trai-nghiem/mu-thay-doi
  id: n4
  cau: Trong bản tóm tắt của chính tác giả (Rensink, 2005), mỗi ảnh hiện khoảng 0,5 giây, màn trống khoảng 0,25 giây; người xem đôi khi cần 10 hay 20 giây (20 hay 40 lần đổi hình) mới nhận ra thay đổi; hiệu ứng không phụ thuộc nhiều vào con số chính xác.
  loai: phat-hien
- trang: trai-nghiem/mu-thay-doi
  id: n5
  cau: Trong thí nghiệm gốc năm 1997, mỗi ảnh hiện 240 ms, màn trống 80 ms, và mỗi ảnh hiện hai lần trước khi đổi.
  loai: so-lieu
- trang: trai-nghiem/mu-thay-doi
  id: n6
  cau: Khi bỏ màn trống đi, người xem nhận ra thay đổi gần như ngay (trung bình 1,4 lần đổi hình, 0,9 giây), chứng tỏ chính màn trống là thứ gây ra hiện tượng.
  loai: so-lieu
- trang: trai-nghiem/mu-thay-doi
  id: n7
  cau: "Vững chắc: kỹ thuật nhấp nháy gây ra mù thay đổi; đã được quan sát trong nhiều nghiên cứu (tổng quan Rensink, 2002); thí nghiệm 1997 có một lần tái lập độc lập, trực tuyến, năm 2026 với 69 người, thời gian phát hiện 11,2 giây (vùng ít quan tâm) và 5,8 giây (vùng được quan tâm)."
  loai: nhan
- trang: trai-nghiem/mu-thay-doi
  id: n8
  cau: "Đang tranh cãi: chú ý có phải là tất cả; Rensink và cộng sự (1997) cho rằng phải có chú ý mới thấy được thay đổi và người xem không bao giờ giữ một hình ảnh đầy đủ, chi tiết của cảnh; về sau giới nghiên cứu còn tranh luận điều gì có thể và không thể suy ra từ mù thay đổi."
  loai: nhan
- trang: trai-nghiem/ebbinghaus
  id: n1
  cau: Vòng tròn trung tâm bị các vòng lớn bao quanh trông nhỏ hơn vòng trung tâm bị các vòng nhỏ bao quanh, dù hai vòng bằng nhau; não đánh giá mỗi vật so với môi trường xung quanh (tương phản kích thước).
  loai: phat-hien
- trang: trai-nghiem/ebbinghaus
  id: n2
  cau: Ảo giác mang tên Hermann Ebbinghaus; theo một khảo cứu lịch sử, có lẽ Ebbinghaus đưa ra hình này từ những năm 1890, dù không có bài công bố rõ ràng nào; trong tiếng Anh hình còn gọi là "vòng tròn Titchener", nhưng Titchener không tạo ra và không nhận hình là của mình, cách gọi ấy chỉ xuất hiện từ khoảng năm 1957.
  loai: lich-su
- trang: trai-nghiem/ebbinghaus
  id: n3
  cau: "de Fockert và cộng sự (2007): người Himba (cộng đồng sống tách biệt ở Namibia, không có từ riêng cho các hình hình học) ít bị ảo giác Ebbinghaus hơn người Anh, nên đánh giá kích thước chính xác hơn; khi vòng bao quanh khác hẳn vòng trung tâm (hình thoi), ảo giác yếu đi ở cả hai nhóm như nhau; các tác giả cho rằng người Himba ưu tiên phân tích chi tiết cục bộ."
  loai: phat-hien
- trang: trai-nghiem/ebbinghaus
  id: n4
  cau: Với các cấu hình kinh điển, vòng tròn trung tâm có thể trông to hơn hoặc nhỏ hơn khoảng 10–20% so với kích thước thật, tùy cách vẽ.
  loai: so-lieu
- trang: trai-nghiem/ebbinghaus
  id: n5
  cau: Nghiên cứu xuyên văn hóa của Segall, Campbell và Herskovits (1963, 1966) được biết tới chủ yếu qua kết quả về ảo giác Müller-Lyer; phát hiện về văn hóa ở ảo giác Ebbinghaus đến từ nghiên cứu khác, của de Fockert và cộng sự (2007).
  loai: lich-su
- trang: trai-nghiem/ebbinghaus
  id: n6
  cau: "Vững chắc: vòng trung tâm bị vòng lớn bao quanh trông nhỏ hơn; được đo trong nhiều nghiên cứu với cấu hình kinh điển, và một lần tái lập ở bốn phòng thí nghiệm với 144 người xác nhận ảo giác ảnh hưởng tới cả động tác cầm nắm."
  loai: nhan
- trang: trai-nghiem/ebbinghaus
  id: n7
  cau: 'Đang tranh cãi: vì sao có ảo giác (tương phản kích thước, xử lý theo ngữ cảnh, khoảng cách vòng bao quanh) và khác biệt văn hóa lớn đến đâu; một bài phân tích năm 2026 cho rằng nhiều lý lẽ chống giải thích "do văn hóa" của Müller-Lyer cũng áp dụng cho Ebbinghaus.'
  loai: nhan
- trang: trai-nghiem/ebbinghaus
  id: n8
  cau: "Kích thước và khoảng cách của vòng bao quanh: theo Roberts, Harris và Yates (2005), hai yếu tố chính là kích thước của vòng bao quanh so với vòng trung tâm và khoảng cách giữa chúng; cân bằng giữa hai yếu tố quyết định vòng trung tâm trông nhỏ đi hay to ra; ảnh hưởng của kích thước còn hay bị lẫn với độ khép kín của vành bao quanh."
  loai: phat-hien
- trang: trai-nghiem/ebbinghaus
  id: n9
  cau: 'Xử lý toàn cục so với cục bộ: xu hướng nhìn cả cụm khiến vòng bao quanh "kéo" cảm nhận về vòng trung tâm; người chú ý chi tiết cục bộ ít bị lừa hơn, phù hợp với phát hiện ở người Himba.'
  loai: phat-hien
- trang: trai-nghiem/ebbinghaus
  id: n10
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào đo ảo giác Ebbinghaus trên người Việt; từ các nghiên cứu xuyên văn hóa (người Himba) có thể dự đoán mức bị lừa khác nhau giữa đô thị và nông thôn, nhưng đây mới là suy luận.
  loai: thoi-su
- trang: trai-nghiem/ebbinghaus
  id: n11
  cau: Ảo giác không phải lỗi của mắt; đó là cách não diễn giải ngữ cảnh, và hệ thị giác bình thường nào cũng bị lừa.
  loai: phat-hien
- trang: trai-nghiem/ebbinghaus
  id: n12
  cau: "Delboeuf và Ebbinghaus đều là ảo giác về kích thước vòng tròn nhưng là hai hình khác nhau: Ebbinghaus là ảo giác tương phản kích thước, Delboeuf (mô tả năm 1892) là ảo giác đồng hóa kích thước."
  loai: dinh-nghia
- trang: trai-nghiem/ebbinghaus
  id: n13
  cau: "Mức bị ảo giác không như nhau ở mọi người: de Fockert và cộng sự (2007) thấy người Himba bị ảo giác ít hơn người Anh, dù cách giải thích khác biệt còn bị tranh cãi."
  loai: phat-hien
