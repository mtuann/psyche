- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n1
  cau: "Mô tả: khi thể chai bị cắt, hai bán cầu không còn trao đổi thông tin trực tiếp và mỗi bên xử lý riêng phần mình."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n2
  cau: Hai chữ được chiếu chớp nhoáng khoảng 1/10 giây khi bệnh nhân nhìn một điểm giữa màn hình, nên mắt không kịp di chuyển.
  loai: cong-cu
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n3
  cau: Trong ví dụ KEY/RING, miệng bệnh nhân nói "ring", còn tay trái lấy ra chiếc chìa khóa, thứ mà miệng khẳng định không thấy.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n4
  cau: "W.J.: tay trái chọn đúng hình ở mức cao hơn ngẫu nhiên (khoảng 30% trên mức ngẫu nhiên với hình đơn giản), chứ không phải lúc nào cũng đúng."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n5
  cau: Mọi thứ ở nửa trái tầm nhìn được xử lý bởi bán cầu phải, và nửa phải tầm nhìn đi vào bán cầu trái; ở người bình thường cũng vậy.
  loai: dinh-nghia
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n6
  cau: Tay phải do bán cầu trái điều khiển, tay trái do bán cầu phải điều khiển.
  loai: dinh-nghia
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n7
  cau: Ngôn ngữ nằm ở bán cầu trái ở đa số mọi người; bán cầu phải ở hầu hết mọi người gần như không nói được.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n8
  cau: Thể chai là một "cây cầu" gồm khoảng 200 triệu sợi thần kinh nối hai bán cầu.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n9
  cau: Ở người bình thường thông tin qua lại rất nhanh giữa hai bán cầu qua thể chai nên ta không nhận ra sự chia chéo; nếu cắt cầu thì mỗi bán cầu chỉ biết những gì phía mình nhận được.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n10
  cau: Sperry ở Caltech cắt thể chai của mèo và khỉ để xem mỗi bán cầu hoạt động ra sao; con vật học bằng một mắt (một bán cầu) không chuyển được sang bán cầu kia.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n11
  cau: Sperry tổng kết ở Science 1961 rằng não bị chẻ "trong nhiều khía cạnh hành xử như hai bộ não riêng biệt".
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n12
  cau: Ca mổ cắt các cầu nối giữa hai bán cầu do bác sĩ phẫu thuật thần kinh Joseph Bogen và Philip Vogel thực hiện ở Los Angeles (đầu thập niên 1960).
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n13
  cau: Ca mổ cắt thể chai cùng mép nối phía trước và mép nối hải mã của W.J.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n14
  cau: W.J. là cựu chiến binh bị thương trận năm 1944, bị động kinh cơn lớn suốt mười lăm năm sau đó, thuốc không kiểm soát được.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n15
  cau: Theo Gazzaniga, bệnh nhân đầu tiên của Vogel và Bogen là một cựu lính nhảy dù bị cơn động kinh nặng, đe dọa tính mạng.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n16
  cau: "Mục đích của ca mổ là y khoa: ngăn cơn động kinh lan từ bán cầu này sang bán cầu kia; thể chai là đường lan."
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n17
  cau: Ca mổ thành công trong việc giảm động kinh của W.J.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n18
  cau: Ca mổ mở ra cơ hội kiểm tra riêng từng bán cầu ở một người mà hai bán cầu không còn trao đổi trực tiếp.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n19
  cau: Gazzaniga khi đó là nghiên cứu sinh ở Caltech trong nhóm của Sperry; Gazzaniga, Bogen và Sperry xây dựng các bài kiểm tra theo kỹ thuật đã dùng ở động vật cho bệnh nhân người.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n20
  cau: Một bài báo công bố năm 1962 trên PNAS mô tả "những ảnh hưởng chức năng của việc cắt các cầu nối não ở người".
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n21
  cau: Bệnh nhân W.J. nhìn một điểm; hình chiếu chớp nhoáng vào một nửa thị trường nên thông tin chỉ đến một bán cầu.
  loai: cong-cu
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n22
  cau: Nhà nghiên cứu có thể hỏi bằng miệng (bán cầu trái trả lời) hoặc yêu cầu dùng một tay để chỉ, vẽ hay chọn đồ vật.
  loai: cong-cu
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n23
  cau: Kết quả lặp lại ở nhiều bệnh nhân.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n24
  cau: "Ảnh chiếu vào nửa phải thị trường (bán cầu trái): bệnh nhân nói được mình thấy gì."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n25
  cau: "Ảnh chiếu vào nửa trái thị trường (bán cầu phải): bệnh nhân khẳng định không thấy gì, nhưng tay trái vẫn có thể chọn đúng vật hay hình, ở W.J. đúng ở mức cao hơn ngẫu nhiên chứ không phải lúc nào cũng đúng."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n26
  cau: Bán cầu phải biết nhưng không nói được; bán cầu trái nói nhưng không biết những gì bán cầu kia đã thấy.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n27
  cau: Gazzaniga và Sperry (1967) có bài "Ngôn ngữ sau khi cắt cầu nối não" trên tạp chí Brain; chữ KEY/RING là ví dụ minh họa cho kiểu bài kiểm tra của nhóm.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n28
  cau: "Mỗi bán cầu dường như có vùng nhận thức riêng, gần như tách biệt: tri giác, quá trình học và trí nhớ riêng mà bán cầu kia không tiếp cận được."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n29
  cau: Sperry nhận một nửa giải Nobel Sinh lý học/Y học năm 1981 "cho các khám phá về chuyên biệt hóa chức năng của các bán cầu đại não"; nửa còn lại chia cho David Hubel và Torsten Wiesel vì công trình về xử lý thông tin thị giác.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n30
  cau: Theo Gazzaniga kể lại, một bệnh nhân được cho xem đồng thời móng vuốt gà ở bán cầu trái và cảnh tuyết ở bán cầu phải; tay phải chọn con gà, tay trái chọn xẻng xúc tuyết, đều đúng.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n31
  cau: Khi hỏi tại sao tay trái chỉ xẻng, bán cầu trái (miệng) đáp ngay rằng cái xẻng để dọn chuồng gà.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n32
  cau: Bán cầu trái bịa ra một lời giải thích hợp lý cho hành động mà nó không biết lý do thật.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n33
  cau: 'Gazzaniga và LeDoux (1978) đưa ra khái niệm "người phiên dịch" của não trái: hệ thống tạo ra "câu chuyện" vượt quá thông tin thực sự có, theo họ nằm dưới nhu cầu tìm lời giải thích của con người.'
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n34
  cau: 'Hình thi-nghiem-key-ring: chữ KEY ở nửa trái, RING ở nửa phải thị trường; bán cầu phải thấy KEY (tay trái chọn chìa khóa), bán cầu trái thấy RING (miệng nói "ring"); thể chai bị cắt nên hai bán cầu không trao đổi được thông tin.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n35
  cau: "Khá vững: khi cầu nối bị cắt, hai bán cầu không còn trao đổi thông tin trực tiếp."
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n36
  cau: Khi thể chai bị cắt, thông tin cảm giác, vận động, nhận thức không còn truyền trực tiếp giữa hai bán cầu; bán cầu trái phụ trách ngôn ngữ nói, bán cầu phải "biết" nhưng thường không diễn đạt bằng lời.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n37
  cau: "Hai bán cầu không độc lập hoàn toàn: có các đường chia sẻ nguồn lực xử lý dưới thể chai."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n38
  cau: "Khá vững: bán cầu trái chuyên về ngôn ngữ, bán cầu phải mạnh về không gian."
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n39
  cau: "J.W.: sau mổ, bán cầu phải hiểu ngôn ngữ nói và viết nhưng không nói được; 14 năm sau gọi được khoảng 25% hình ở nửa trái thị trường; một năm sau khoảng 60%."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n40
  cau: Gazzaniga và cộng sự (1996) mô tả bệnh nhân JW, người sau nhiều năm phát triển khả năng nói ở bán cầu phải.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n41
  cau: 'Đang tranh cãi: liệu có "hai ý thức" trong một đầu người?'
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n42
  cau: "Gazzaniga (2005): trong hàng chục trường hợp được ghi nhận qua nhiều năm, chưa trường hợp nào cho phép khẳng định mỗi bán cầu có ý thức đầy đủ về bản thân."
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n43
  cau: 'Đã bị bác bỏ: "người não trái" và "người não phải".'
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n44
  cau: Một phân tích ảnh chụp não của 1.011 người từ 7 đến 29 tuổi không thấy dấu hiệu của kiểu "não trái hơn" hay "não phải hơn" trên toàn bộ não.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n45
  cau: Bài tổng quan của Corballis (2014) kết luận rằng cặp "não trái/não phải" trong nghệ thuật, kinh doanh, giáo dục nhờ sức mạnh của huyền thoại hơn là bằng chứng khoa học.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n46
  cau: Theo Sperry, bán cầu trái mạnh về ngôn ngữ, toán và xử lý tuần tự; bán cầu phải mạnh về việc không gian và hình ảnh, như nhận diện khuôn mặt.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n47
  cau: Thể chai là đường dây để hai "chuyên gia" phối hợp.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n48
  cau: Gazzaniga cho rằng nhu cầu tìm lời giải thích của "người phiên dịch" là của con người nói chung; nhiều lời giải thích về hành vi của mình có thể là "chuyện kể lại" hơn là lý do thật.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n49
  cau: Nếu mỗi bán cầu có tri giác và trí nhớ riêng mà bán cầu kia không tiếp cận được, thì cái tôi thống nhất có thể là sản phẩm của sự liên lạc giữa hai bán cầu; sự thống nhất ấy có thể lộ ra là một thành tựu của não bộ. Đây là cách diễn giải.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n50
  cau: 'Bác bỏ: đừng tin các bài "test bạn thuận não nào" (nhãn ở mục Áp dụng 1).'
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n51
  cau: Chưa có bằng chứng để xếp người thành "tuýp não trái" (logic) hay "tuýp não phải" (sáng tạo); tư duy sáng tạo kích hoạt một mạng lưới rộng, không nghiêng hẳn về bán cầu nào.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n52
  cau: Ở Anh và Hà Lan, hơn 80% giáo viên được khảo sát tin rằng khác biệt về "bán cầu trội" (não trái, não phải) giải thích khác biệt giữa người học.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n53
  cau: Các khóa "kích hoạt não phải" cho trẻ em, nếu hứa hẹn mở khóa thiên tài sáng tạo bằng vài bài tập, thì lời hứa ấy không có bằng chứng ủng hộ trong các nguồn đã đọc.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n54
  cau: 'Khá vững: nhận ra "người phiên dịch" trong chính mình (mục Áp dụng 2).'
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n55
  cau: Nisbett và Wilson (1977) tổng quan nhiều thí nghiệm ở người bình thường và đề xuất rằng khi giải thích về quá trình tư duy của mình, người ta thường dựa vào những lý thuyết ngầm về nguyên nhân hơn là quan sát trực tiếp.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n56
  cau: Một chút hoài nghi lành mạnh với lời giải thích của chính mình ("liệu mình có thực sự biết tại sao không?") là bài học thực tế từ phòng thí nghiệm não chẻ.
  loai: loi-khuyen
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n57
  cau: Một số bệnh nhân não chẻ dần phát triển khả năng nói ở bán cầu phải; tác giả cho rằng đó là hệ quả của tính dẻo thần kinh lâu dài; đây là một ca đặc biệt, không thể suy rộng ra phục hồi sau đột quỵ hay chấn thương não.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n58
  cau: Tất cả phát hiện đến từ một nhóm rất nhỏ bệnh nhân đặc biệt (đã cắt cầu nối não để chữa động kinh); không thể suy thẳng rằng não người bình thường hoạt động như hai hệ độc lập.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n59
  cau: Các thí nghiệm não chẻ kinh điển được thực hiện ở Mỹ (chủ yếu ở Caltech và Los Angeles).
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n60
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu kiểu não chẻ (kiểm tra riêng từng bán cầu) trên người Việt.
  loai: thoi-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n61
  cau: Có một báo cáo lâm sàng về phẫu thuật cắt thể chai chữa động kinh kháng thuốc ở 16 trẻ em miền Bắc Việt Nam, đánh giá kết quả điều trị.
  loai: lam-sang
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n62
  cau: Phẫu thuật cắt thể chai là thủ thuật hiếm, dùng khi động kinh nặng không kiểm soát được bằng thuốc; số bệnh nhân tham gia các nghiên cứu kiểu này rất ít.
  loai: lam-sang
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n63
  cau: Chuyên biệt hóa ngôn ngữ ở bán cầu trái được ghi nhận ở các mẫu đã nghiên cứu (ví dụ 1.011 người trong phân tích của Nielsen và cộng sự, 2013); tính đến 11/2026 chưa thấy dữ liệu riêng cho người Việt; đó là suy luận, chưa phải bằng chứng trực tiếp.
  loai: thoi-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n64
  cau: Chúng tôi chưa có khảo sát về mức độ phổ biến của quan niệm "não trái/não phải" ở Việt Nam; hiểu đúng nghiên cứu gốc giúp phân biệt khoa học thật với lời quảng cáo.
  loai: thoi-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n65
  cau: 'Ngộ nhận: "Người não trái thì logic, người não phải thì sáng tạo." Không có bằng chứng; nghiên cứu não chẻ nói về phân công chức năng, không phân loại con người.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n66
  cau: 'Ngộ nhận: "Ta chỉ dùng 10% não bộ" là một huyền thoại thần kinh phổ biến, không phải kết luận khoa học.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n67
  cau: "Ngộ nhận: ở 326 người khỏe mạnh, ưu thế ngôn ngữ bên phải gặp ở 4% người thuận tay phải hẳn, 15% người thuận cả hai tay và 27% người thuận tay trái hẳn; nên đa số người thuận tay trái vẫn có ưu thế ngôn ngữ ở bán cầu trái."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n68
  cau: 'Ngộ nhận: cắt thể chai không làm thành "hai nhân cách"; trong đời thường bệnh nhân sinh hoạt gần như bình thường, "chia đôi" chỉ lộ ra trong các bài kiểm tra đặc biệt.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n70
  cau: 'Câu hỏi 1: khi hỏi "bạn vừa thấy gì?", bệnh nhân trả lời "ring", vì chỉ bán cầu trái (nơi có ngôn ngữ) được hỏi, và nó chỉ thấy chữ RING; bán cầu phải thấy KEY nhưng không nói được.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n71
  cau: "Câu hỏi 2: nhà nghiên cứu chiếu hình khoảng 1/10 giây để mắt không kịp liếc sang, đảm bảo thông tin chỉ đến một bán cầu."
  loai: cong-cu
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n72
  cau: 'Câu hỏi 3: khi tay trái (bán cầu phải) chọn đúng chìa khóa, điều đó chứng tỏ bán cầu phải nhận biết được vật thể nhưng không diễn đạt bằng lời; "biết" và "nói được" do hai bán cầu khác nhau đảm nhận khi cầu nối bị cắt.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n73
  cau: "Câu hỏi 4: Sperry nhận giải Nobel năm 1981 cùng David Hubel và Torsten Wiesel; nửa còn lại thuộc về Hubel và Wiesel cho nghiên cứu về xử lý thông tin thị giác."
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n74
  cau: 'Câu hỏi 5: thí nghiệm móng vuốt gà/cảnh tuyết cho thấy "người phiên dịch" ở não trái dựng chuyện để lấp chỗ trống thông tin; phân loại tính cách theo não trái/phải không có bằng chứng; bệnh nhân não chẻ sinh hoạt đời thường gần như bình thường.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-che-doi
  id: n75
  cau: "Danh sách Nguồn của trang: các mục (Corballis 2014; Dekker 2012; Gazzaniga 1962, 1967, 1978, 1996, 2005; Knecht 2000; Nguyen 2020; Nielsen 2013; Nisbett & Wilson 1977; Sperry 1961, 1968, 1981) đúng tác giả, năm, nhan đề, tạp chí, tập, trang, DOI."
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n1
  cau: "Mô tả: nghiên cứu sinh đôi nuôi tách nhau của Bouchard và cộng sự; trung bình khoảng một nửa khác biệt giữa người với người trong các quần thể đã nghiên cứu gắn với khác biệt về gen; tính di truyền không có nghĩa số phận đã định."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n2
  cau: Năm 1979, hai người đàn ông 39 tuổi, Jim Lewis và Jim Springer, gặp nhau lần đầu; họ là sinh đôi cùng trứng bị tách nhau từ khi mới vài tuần tuổi.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n3
  cau: Cả hai từng nuôi một con chó tên Toy.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n4
  cau: Cả hai cắn móng tay và hay bị đau đầu căng thẳng.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n5
  cau: Cả hai hút thuốc Salem và lái cùng một kiểu xe Chevrolet màu xanh.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n6
  cau: Cả hai từng nghỉ mát nhiều lần ở cùng một dải bãi biển ở Florida.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n7
  cau: "Các chi tiết đã bỏ khỏi trang: cả hai cưới vợ tên Linda, ly hôn rồi tái hôn với người tên Betty; cả hai đặt tên con trai đầu lòng là James Alan; cả hai làm công việc liên quan đến thực thi pháp luật; uống bia Miller Lite."
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n8
  cau: Cặp Jim là hai trong số 348 cặp sinh đôi được nghiên cứu ở Đại học Minnesota (theo Time, "the first of 348 pairs"); nhóm Bouchard đưa cặp Jim cùng hơn 100 cặp nuôi tách nhau vào phòng thí nghiệm, mỗi cặp qua khoảng 50 giờ kiểm tra tâm lý và y khoa.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n9
  cau: "Câu chuyện cặp Jim là giai thoại: ấn tượng nhưng không phải bằng chứng khoa học; bằng chứng nằm ở kết quả tổng hợp của hàng chục cặp."
  loai: dinh-nghia
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n10
  cau: "Câu hỏi bản chất hay nuôi dưỡng là một câu hỏi lâu đời của tâm lý học: con người khác nhau chủ yếu vì gen khác nhau hay vì môi trường sống khác nhau."
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n11
  cau: Sinh đôi cùng trứng chia sẻ gần như 100% gen; sinh đôi khác trứng chia sẻ khoảng 50% gen (trung bình), như anh chị em thường.
  loai: dinh-nghia
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n12
  cau: Nếu một đặc điểm chủ yếu do gen thì cặp cùng trứng giống nhau hơn cặp khác trứng, kể cả khi lớn lên ở hai gia đình khác nhau (logic của thiết kế).
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n13
  cau: "Tính di truyền (heritability) là con số thống kê: trong một quần thể cụ thể, bao nhiêu phần trăm khác biệt giữa người với người gắn với khác biệt về gen."
  loai: dinh-nghia
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n14
  cau: Galton đề xuất năm 1875 dùng sinh đôi như một phương pháp mới để phân biệt tác động của nature và nurture; cặp từ ấy có ngay trong nhan đề bài của ông.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n15
  cau: Trước nghiên cứu Minnesota mới có ba nghiên cứu sinh đôi nuôi tách nhau, quy mô khiêm tốn.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n16
  cau: Từ năm 1979, nhóm của Thomas Bouchard Jr. ở Đại học Minnesota thực hiện Minnesota Study of Twins Reared Apart (MISTRA), nghiên cứu sinh đôi cùng trứng và khác trứng bị tách nhau sớm và lớn lên ở hai nơi.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n17
  cau: Nhóm đã đưa hơn 100 cặp sinh đôi và bộ ba nuôi tách nhau vào một tuần kiểm tra chuyên sâu về tâm lý và sinh lý.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n18
  cau: "Thiết kế: nếu môi trường nuôi dưỡng quyết định, hai đứa trẻ cùng gen nhưng lớn lên ở hai gia đình khác nhau phải khác nhau; kết quả thì ngược lại."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n19
  cau: Khoảng 70% phương sai IQ gắn với biến thiên di truyền, con số tương tự các nghiên cứu nhỏ hơn trước đó.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n20
  cau: Trên các thang đo tính cách, khí chất, sở thích nghề nghiệp và lúc rảnh, thái độ xã hội, sinh đôi cùng trứng nuôi tách nhau giống nhau tương đương sinh đôi cùng trứng nuôi cùng nhau.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n21
  cau: 'Các tác giả thận trọng: gen có thể tác động gián tiếp, bằng cách định hình "môi trường hiệu quả" của đứa trẻ.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n22
  cau: Polderman và cộng sự (2015) gộp 2.748 công bố, 17.804 tính trạng, khoảng 14,5 triệu cặp sinh đôi (các cặp có thể trùng lặp giữa các công bố), theo các tác giả gần như toàn bộ nghiên cứu sinh đôi đã công bố về tính trạng phức tạp.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n23
  cau: Trên mọi tính trạng, tính di truyền được báo cáo là 49%.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n24
  cau: "Với 69% tính trạng, dữ liệu phù hợp với mô hình đơn giản: sự giống nhau giữa hai đứa trẻ trong cặp sinh đôi chủ yếu do biến thiên gen cộng gộp."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n25
  cau: Dữ liệu không ủng hộ ảnh hưởng lớn của môi trường chung hay của biến thiên gen không cộng gộp.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n26
  cau: "Haworth và cộng sự (2010): tính di truyền của khả năng nhận thức chung tăng từ 41% lúc 9 tuổi lên 55% lúc 12 tuổi và 66% lúc 17 tuổi."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n27
  cau: Mẫu của Haworth và cộng sự là 11.000 cặp sinh đôi ở bốn quốc gia.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n28
  cau: Càng lớn, ta càng tự chọn, tự điều chỉnh và tự tạo ra môi trường sống của mình — việc ấy chịu ảnh hưởng một phần từ khuynh hướng di truyền (lời giải thích tác giả đề xuất).
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n29
  cau: "Plomin và Daniels (1987): phần môi trường không chung (những trải nghiệm mỗi đứa trẻ trong cùng nhà nhận khác nhau) mới là phần môi trường tạo ra khác biệt giữa anh chị em."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n30
  cau: "Hình tinh-di-truyen-theo-tuoi: cột 9 tuổi là 41%."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n31
  cau: "Hình tinh-di-truyen-theo-tuoi: cột 12 tuổi là 55%."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n32
  cau: "Hình tinh-di-truyen-theo-tuoi: cột 17 tuổi là 66%."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n33
  cau: 'Hình tinh-di-truyen-theo-tuoi: cột "trưởng thành" là khoảng 70% (IQ người trưởng thành, Bouchard và cộng sự 1990).'
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n34
  cau: 'Hình tinh-di-truyen-theo-tuoi, chú thích: tính di truyền của khả năng nhận thức chung tăng dần theo tuổi (Haworth, 11.000 cặp); "tính di truyền" ở đây là thống kê trên quần thể, không phải tỉ lệ "do gen định đoạt" ở một cá nhân.'
  loai: dinh-nghia
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n35
  cau: "Khá vững: sinh đôi cùng trứng nuôi tách nhau vẫn giống nhau đáng ngạc nhiên."
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n36
  cau: Bốn nghiên cứu nuôi tách nhau cho tương quan IQ 0,64–0,74 ở phép đo chính; năm nghiên cứu ở người trưởng thành ở châu Âu và Mỹ cho 0,68–0,78.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n37
  cau: Mẫu MISTRA có 56 bộ sinh đôi cùng trứng nuôi tách nhau (30 bộ khác trứng); các mẫu chủ yếu là người da trắng ở các nước phương Tây.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n38
  cau: "Khá vững: tính di truyền của trí tuệ và tính cách ở mức vài chục phần trăm."
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n39
  cau: "Phân tích tổng hợp của Vukasović và Bratko (2015): 62 kích thước hiệu ứng độc lập, hơn 100.000 người, trung bình 0,40 cho tính cách (0,47 ở nghiên cứu sinh đôi, 0,22 ở nghiên cứu gia đình và con nuôi)."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n40
  cau: "Đang tranh cãi: con số chính xác là bao nhiêu, và phương pháp sinh đôi có thổi phồng nó không."
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n41
  cau: 'Bouchard và cộng sự (1990) nêu lời phê bình của "environmentalist critics" và tự kiểm các khả năng: gia đình nhận nuôi được xếp vào môi trường giống nhau, môi trường trước sinh chung, tiếp xúc giữa hai anh em sau khi gặp lại; họ cho rằng các khả năng ấy không giải thích được phần lớn độ giống nhau.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n42
  cau: Ở một mẫu 7 tuổi ở Mỹ, Turkheimer và cộng sự (2003) thấy ở gia đình nghèo gen gần như không giải thích gì cho khác biệt IQ, còn ở gia đình khá giả thì ngược lại.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n43
  cau: 'Đã bị bác bỏ: "heritability 60% nghĩa là 60% con người bạn do gen định đoạt".'
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n44
  cau: Nói "tính di truyền của IQ là 60%" không có nghĩa "60% trí thông minh của bạn là do gen"; nó cũng không có nghĩa đặc điểm đó bất biến hay không thể thay đổi.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n45
  cau: "Gen cộng gộp: với 69% tính trạng, sự giống nhau của sinh đôi phù hợp với mô hình biến thiên gen cộng gộp, ảnh hưởng của gen cộng dồn với nhau, không phải do tương tác phức tạp giữa các gen."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n46
  cau: "Tương quan gen–môi trường: gen thường tác động gián tiếp, qua việc định hướng con người tự chọn môi trường của mình (Bouchard gợi ý; Haworth giải thích đà tăng theo tuổi bằng cơ chế này)."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n47
  cau: "Môi trường không chung: cùng một mái nhà nhưng mỗi đứa trẻ sống trong một môi trường khác; phần môi trường không chung mới là thứ tạo ra khác biệt giữa anh chị em."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n48
  cau: "Áp dụng 1: anh chị em cùng nhà vẫn khác nhau là chuyện bình thường, phần lớn do gen và môi trường riêng của từng đứa; bằng chứng về tính di truyền không làm giảm giá trị của nuôi dạy và giáo dục (Bouchard và cộng sự)."
  loai: loi-khuyen
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n49
  cau: "Khá vững (chip ở Áp dụng 1): hiểu đúng về di truyền để nuôi dạy con tỉnh táo hơn."
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n50
  cau: "Áp dụng 2: tính di truyền của tính cách khoảng 40% (47% trong các nghiên cứu sinh đôi) không cho phép kết luận gì về một đứa trẻ cụ thể; dùng số liệu quần thể để đoán số phận một cá nhân là lạm dụng."
  loai: loi-khuyen
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n51
  cau: "Áp dụng 3: tính di truyền không hàm ý bất biến; ví dụ chiều cao có tính di truyền cao nhưng chiều cao trung bình vẫn tăng theo thời gian."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n52
  cau: "Áp dụng 3: can thiệp giáo dục, chính sách hay thay đổi lối sống vẫn có ý nghĩa bất kể con số tính di truyền; tính di truyền mô tả thực trạng quần thể tại một thời điểm."
  loai: loi-khuyen
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n53
  cau: "Giới hạn: dữ liệu chủ yếu từ các xã hội phương Tây; mẫu nuôi tách nhau và con nuôi chủ yếu là người da trắng và ít gia đình nghèo nhất."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n54
  cau: Tính di truyền là con số của một quần thể trong một môi trường cụ thể; ở xã hội khác, với bất bình đẳng hay hệ giáo dục khác, con số có thể khác.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n55
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu sinh đôi nào về trí tuệ hay tính cách trên người Việt.
  loai: thoi-su
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n56
  cau: Các nghiên cứu nền tảng trong bài — MISTRA ở Mỹ; các nghiên cứu nuôi tách nhau ở Mỹ, Anh và Đan Mạch — chủ yếu thực hiện trên mẫu phương Tây.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n57
  cau: Không thể tự động áp các con số trong bài (khoảng 40% cho tính cách, khoảng 41–70% cho trí tuệ tùy tuổi) cho người Việt; đó là các khoảng tham khảo từ văn liệu, chưa phải bằng chứng trực tiếp.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n58
  cau: Câu hỏi "con nhà tông" được bàn ở mọi gia đình Việt; nghiên cứu sinh đôi cho khung suy nghĩ tỉnh táo; để có con số cho người Việt cần nghiên cứu trên người Việt, và tính đến 11/2026 chúng tôi chưa tìm thấy.
  loai: thoi-su
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n59
  cau: "Ngộ nhận: heritability 60% không có nghĩa 60% con người tôi do gen quyết định; đó là thống kê về khác biệt giữa mọi người trong một quần thể."
  loai: dinh-nghia
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n60
  cau: "Ngộ nhận: sinh đôi cùng trứng không giống hệt nhau; ngay cả cặp cùng trứng nuôi tách nhau chỉ có tương quan IQ khoảng 0,64–0,74, không phải 1."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n61
  cau: 'Ngộ nhận: "Gen quyết định thì giáo dục vô nghĩa" là sai; chính các tác giả MISTRA phản đối kết luận này.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n62
  cau: "Ngộ nhận: môi trường chung của gia đình giải thích rất ít khác biệt ở tuổi trưởng thành; mỗi đứa trẻ trong cùng nhà lớn lên trong môi trường riêng."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n63
  cau: "Ngộ nhận: cặp Jim là giai thoại minh họa, không phải bằng chứng; bằng chứng nằm ở dữ liệu tổng hợp của hơn 100 cặp, nói gen quan trọng chứ không phải là tất cả."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n65
  cau: "Câu hỏi 1: tính di truyền 60% nghĩa là khoảng 60% khác biệt giữa người với người trong quần thể nghiên cứu gắn với khác biệt về gen; đó là con số của quần thể, không phải công thức bên trong một cá nhân; đổi môi trường con số có thể đổi."
  loai: dinh-nghia
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n66
  cau: "Câu hỏi 2: phát hiện then chốt của MISTRA là sinh đôi cùng trứng nuôi tách nhau giống nhau tương đương sinh đôi cùng trứng nuôi cùng nhau; bằng chứng mạnh nhờ hơn 100 cặp, mỗi cặp khoảng 50 giờ kiểm tra, chứ không phải câu chuyện cặp Jim."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n67
  cau: "Câu hỏi 3: theo Polderman và cộng sự (2015), tính di truyền trên mọi tính trạng là khoảng 49%; con số đến từ 2.748 công bố, khoảng 14,5 triệu cặp sinh đôi; các tác giả mô tả đây là phân tích toàn diện nhất về nguyên nhân khác biệt cá nhân ở người tính đến 2015."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n68
  cau: "Câu hỏi 4: Haworth và cộng sự (2010) thấy tính di truyền của khả năng nhận thức tăng dần theo tuổi, 41% lúc 9, 55% lúc 12, 66% lúc 17; lời giải thích đề xuất là con người càng lớn càng tự chọn và tạo môi trường sống chịu ảnh hưởng một phần từ khuynh hướng di truyền."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n69
  cau: "Câu hỏi 5: môi trường chung của gia đình giải thích rất ít khác biệt giữa anh chị em ở tuổi trưởng thành vì mỗi đứa trẻ trải nghiệm một môi trường riêng; đây là luận điểm của Plomin và Daniels (1987), và không có nghĩa môi trường vô nghĩa."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
  id: n70
  cau: Danh sách Nguồn của trang (Bouchard 1990; Galton 1875; Haworth 2010; Leo 1987; Lewis 2014; Neisser 1996; Plomin & Daniels 1987; Polderman 2015; Segal 2012; Turkheimer 2003; Vukasović & Bratko 2015) đúng tác giả, năm, nhan đề, tạp chí, tập, trang, DOI.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n1
  cau: 'Mô tả: vỏ não trước trán trưởng thành muộn, hệ phần thưởng nhạy bén ở giữa tuổi teen; mô hình "mất cân bằng phát triển" đề xuất lời giải thích cho việc teen có thể hiểu nguy hiểm mà vẫn liều; khoa học nói gì về trách nhiệm của người chưa thành niên.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n2
  cau: "Tự trải nghiệm: bạn 16 tuổi giải được bài toán khó, tranh luận sắc sảo, nhưng tối thứ Bảy nhận lời thách đố lạng lách khi có đám bạn hò reo, dù biết nguy hiểm."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n3
  cau: Theo mô hình "hai hệ thống" của Steinberg, hệ phần thưởng nhạy cảm cao vào khoảng giữa tuổi teen, còn hệ kiểm soát ở vỏ não trước trán tiếp tục trưởng thành đến tận đầu hay giữa tuổi đôi mươi; sự có mặt của bạn bè đạp thêm vào "chân ga".
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n4
  cau: "Từ khoảng 10 tuổi đến đầu tuổi đôi mươi, não bộ trải qua nhiều thay đổi cấu trúc, trong đó có hai quá trình được nói tới nhiều: tỉa synap và myelin hóa."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n5
  cau: Việc chất xám vỏ não giảm dần trên MRI có thể một phần do tỉa synap (Gogtay và cộng sự đoán); đây là một phần của phát triển bình thường.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n6
  cau: "Chất xám giảm theo thứ tự: vùng cảm giác–vận động và thị giác bậc thấp trước, vùng liên kết bậc cao sau; trong thùy trán, vỏ não trước trán lưng–bên mất chất xám muộn nhất, vào cuối tuổi vị thành niên."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n7
  cau: "Myelin hóa: các sợi thần kinh được bọc myelin giúp tín hiệu truyền nhanh và ổn định hơn; quá trình này kéo dài sang thập niên thứ hai của đời và có thể còn lâu hơn."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n8
  cau: Theo mô hình của Steinberg (2008), hệ cảm xúc–xã hội — gồm hạnh nhân và nhân accumbens — trở nên nhạy với phần thưởng quanh tuổi dậy thì, liên quan tái cấu trúc hệ dopamine.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n9
  cau: "Kết quả là một sự lệch pha về thời gian: độ nhạy với phần thưởng tăng cao ở giữa tuổi teen khi khả năng tự kiểm soát còn đang tiếp tục trưởng thành."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n10
  cau: 'Gogtay và cộng sự (2004): nhóm NIMH chụp MRI 13 trẻ khỏe mạnh, mỗi 2 năm trong 8–10 năm (từ 4 đến 21 tuổi), tổng cộng 52 lượt chụp, dựng thành "phim" time-lapse về chất xám vỏ não.'
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n11
  cau: Các vùng liên kết bậc cao chín muộn hơn các vùng cảm giác–vận động và thị giác bậc thấp mà chúng tích hợp; các vùng cổ xưa hơn chín trước các vùng mới hơn.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n12
  cau: Trên toàn vỏ não, thùy thái dương bên là vùng chín muộn nhất; cực trán và cực chẩm mất chất xám sớm.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n13
  cau: "Giới hạn của Gogtay và cộng sự: chỉ 13 trẻ, IQ trung bình khoảng 125, mẫu không đại diện (thiên lệch lựa chọn do nghiên cứu của NIMH); chất xám trên MRI là thước đo gián tiếp."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n14
  cau: Galvan và cộng sự (2006) quét fMRI 41 người — 16 trẻ em 7–11 tuổi, 13 vị thành niên 13–17 tuổi, 12 người lớn 23–29 tuổi — làm nhiệm vụ có phần thưởng với các mức giá trị khác nhau; 37 người (13, 12, 12) có dữ liệu để phân tích sau khi loại 4 người cử động quá mức.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n15
  cau: Ở vị thành niên, nhân accumbens hoạt động mạnh hơn cả trẻ em lẫn người lớn; hoạt động giống người lớn về mức lan rộng và độ nhạy với giá trị phần thưởng, nhưng biên độ bị phóng đại.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n16
  cau: Mức lan rộng của hoạt động ở vỏ não ổ mắt ở vị thành niên giống trẻ em hơn là người lớn.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n17
  cau: Các tác giả cho rằng hệ thống dưới vỏ đang chín bị kích hoạt quá mức so với hệ thống kiểm soát từ trên xuống chín muộn hơn, khiến vị thành niên nghiêng về lợi ích trước mắt; đây là một nghiên cứu nhỏ, cắt ngang.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n18
  cau: "Gardner và Steinberg (2005): 306 người trong ba nhóm tuổi 13–16, 18–22, từ 24 trở lên; mỗi người làm một nhiệm vụ lái xe trên máy tính một mình hoặc có hai bạn cùng tuổi, chia ngẫu nhiên."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n19
  cau: Khi chơi một mình, mức liều lĩnh của cả ba nhóm tuổi tương đương nhau; khi có bạn bè, nhóm 13–16 liều gấp đôi, nhóm 18–22 liều hơn khoảng 50%, người lớn không thay đổi.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n20
  cau: Bài gốc kết luận sự có mặt của bạn bè làm tăng liều lĩnh, hiệu ứng mạnh hơn ở tuổi teen và thanh niên so với người lớn.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n21
  cau: "Steinberg (2008): hành vi mạo hiểm tăng từ tuổi thơ lên tuổi teen vì hệ cảm xúc–xã hội thay đổi quanh tuổi dậy thì; rồi giảm về tuổi trưởng thành vì hệ kiểm soát nhận thức cải thiện khả năng tự điều chỉnh, chưa hoàn tất cho đến giữa tuổi đôi mươi."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n22
  cau: "Điểm mấu chốt của mô hình: sự lệch nhịp giữa hai hệ thống khiến giữa tuổi teen dễ tổn thương nhất trước hành vi mạo hiểm."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n23
  cau: Steinberg và cộng sự (2008) khảo sát 935 người từ 10 đến 30 tuổi (đa dạng về kinh tế–xã hội và sắc tộc) bằng cả tự báo cáo lẫn đo hành vi.
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n24
  cau: "Tìm kiếm cảm giác mạnh (sensation seeking) đi theo đường cong: tăng từ 10 đến 15 tuổi rồi giảm hoặc giữ nguyên; tính bốc đồng giảm đều đặn từ 10 tuổi trở đi."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n25
  cau: Sự kết hợp "ham cảm giác mạnh cao + tự kiểm soát chưa xong" ở giữa tuổi teen được các tác giả coi là có thể giải thích sự mạo hiểm.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n26
  cau: Bài tổng quan của chính nhóm Steinberg (Shulman và cộng sự, 2016) rà soát bằng chứng từ 2008, kết luận nhìn chung bằng chứng ủng hộ mô hình hai hệ thống và "tái khẳng định" nó, dù thừa nhận là bản đơn giản hóa.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n27
  cau: "Các tác giả khác phê bình mô hình: chưa đủ tinh vi, và giữa tuổi teen chưa chắc là đỉnh của mạo hiểm; phân tích tổng hợp của Defoe và cộng sự (2015) thấy teen mạo hiểm hơn người lớn (g = 0,37) nhưng ngang trẻ em ở nhiều nhiệm vụ trong phòng thí nghiệm (g = 0)."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n28
  cau: "Khá vững: vỏ não trước trán trưởng thành muộn; độ nhạy phần thưởng cao ở giữa tuổi teen."
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n29
  cau: "Khá vững: bạn bè khuếch đại hành vi mạo hiểm ở tuổi teen."
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n30
  cau: "Shulman và cộng sự (2016): các thí nghiệm thao tác bối cảnh xã hội thấy vị thành niên bị thúc đẩy bởi sự có mặt của bạn bè để mạo hiểm hơn người lớn (dẫn Chein 2011; Gardner & Steinberg 2005; Smith 2014)."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n31
  cau: 'Đang tranh cãi: "não chưa hoàn thiện" có làm giảm trách nhiệm của người chưa thành niên?'
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n32
  cau: 'Steinberg (2009): chính sách tư pháp "không thể và không nên" bị quyết định chỉ bởi nghiên cứu phát triển, nhưng cách đối xử với người chưa thành niên vi phạm pháp luật nên được tham khảo từ khoa học phát triển.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n33
  cau: Nói "não chưa hoàn thiện nên miễn trách nhiệm" là suy diễn quá đà; nói "não bộ không liên quan gì" cũng bỏ qua bằng chứng.
  loai: loi-khuyen
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n34
  cau: "Mô hình hai hệ thống: hệ cảm xúc–xã hội thay đổi sớm quanh tuổi dậy thì, hệ kiểm soát tiếp tục cải thiện đến tận tuổi đôi mươi, nên giữa tuổi teen dễ tổn thương nhất trước mạo hiểm; đây là mô hình giải thích, không phải kết quả đo trực tiếp."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n35
  cau: Steinberg (2008), dẫn Spear (2000), nêu giả thuyết rằng đặc điểm điển hình của tuổi teen như tìm kiếm cái mới và mạo hiểm có thể đã mang tính thích nghi tiến hóa, giúp thanh thiếu niên rời nhóm gốc và vượt qua bước chuyển từ phụ thuộc sang độc lập; ở người có thể biểu hiện qua rượu, ma túy và hành vi có vấn đề.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n36
  cau: "Các nguồn không ủng hộ việc xem não teen như phiên bản lỗi của não người lớn: teen hiểu biết, lý luận logic, đánh giá rủi ro chính xác không kém người lớn (Steinberg 2008), và mô hình hai hệ thống giải thích mạo hiểm của teen đúng hơn các mô hình quy cho thiếu năng lực nhận thức (Shulman 2016)."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n37
  cau: 'Khá vững (chip ở Áp dụng 1): nói chuyện khi "nguội", đừng giảng đạo lý khi đang "nóng".'
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n38
  cau: Steinberg (2008) ghi rằng các chương trình giáo dục về nguy cơ ở tuổi teen thường thay đổi hiểu biết nhiều hơn thay đổi hành vi.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n39
  cau: Theo mô hình, rủi ro tăng lên khi hệ cảm xúc–xã hội được kích hoạt mạnh (ví dụ có bạn bè, cảm xúc dâng cao); khi không được kích hoạt mạnh, hệ kiểm soát đủ mạnh để điều tiết, kể cả ở đầu tuổi teen.
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n40
  cau: 'Khá vững (chip ở Áp dụng 2): thiết kế môi trường thay vì trông chờ "tự kiềm chế".'
  loai: nhan
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n41
  cau: "Steinberg (2008): nỗ lực giảm mạo hiểm ở tuổi teen nên tập trung thay đổi bối cảnh nơi hành vi mạo hiểm xảy ra hơn là chủ yếu thay đổi điều teen biết và cách teen nghĩ; có bạn cùng tuổi trong xe làm tăng nguy cơ tai nạn nghiêm trọng khi người lái là thiếu niên (Simons-Morton và cộng sự, 2005)."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n42
  cau: "Áp dụng 3: các nguồn đã đọc chỉ kiểm tra tác động của bạn bè lên hành vi mạo hiểm, chưa kiểm tra hiệu quả của các chương trình dùng ảnh hưởng của bạn bè theo hướng tích cực; vì vậy không đưa ra khuyến nghị."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n43
  cau: 'Áp dụng 4: các nguồn đã đọc không kiểm tra việc học một kỹ năng ở tuổi teen có hiệu quả hơn các tuổi khác hay không, nên không đưa ra lời khuyên về "thời điểm vàng"; điều có nguồn: chất xám vỏ não giảm dần trong tuổi teen, một phần có thể do tỉa synap.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n44
  cau: Các nghiên cứu nêu trong bài chủ yếu thực hiện ở Mỹ.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n45
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu chụp não (MRI/fMRI) về phát triển não vị thành niên trên người Việt, cũng như thí nghiệm kiểu Gardner và Steinberg trên thiếu niên Việt.
  loai: thoi-su
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n46
  cau: Steinberg (2009) bàn về việc dùng khoa học phát triển trong hệ thống tư pháp người chưa thành niên của Mỹ; khoa học chỉ nên là một trong các cân nhắc; bài không đưa ra khuyến nghị pháp lý cụ thể.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n47
  cau: 'Ngộ nhận: não tuổi teen không bị "hỏng" hay "thiếu" — theo mô hình hai hệ thống đó là lịch trình phát triển bình thường, lệch nhịp giữa hai hệ thống, không phải khiếm khuyết.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n48
  cau: 'Ngộ nhận: các nguồn đã đọc mô tả khả năng tự kiểm soát cải thiện dần qua tuổi teen đến đầu hay giữa tuổi đôi mươi, không phải một mốc "qua một đêm"; chúng tôi không tìm thấy một mốc cứng ở tuổi 25.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n49
  cau: "Ngộ nhận: teen không hẳn liều vì không hiểu nguy hiểm; teen hiểu biết, lý luận và đánh giá rủi ro chính xác không kém người lớn nhưng vẫn mạo hiểm nhiều hơn; khi chơi một mình các nhóm tuổi liều ngang nhau, khi có bạn bè teen liều hơn."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n50
  cau: "Ngộ nhận: chất xám giảm trên MRI trong tuổi teen là một phần của phát triển bình thường; nguyên nhân chưa rõ, Gogtay và cộng sự đoán một phần do tỉa synap cùng thay đổi tế bào thần kinh đệm, mạch máu, co nhỏ tế bào; myelin hóa diễn ra song song."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n51
  cau: 'Ngộ nhận: mạo hiểm và tìm cái mới ở tuổi teen theo mô hình gắn với tìm kiếm phần thưởng và ảnh hưởng của bạn bè, không phải thái độ chống đối; chưa có nguồn đã mở đo trực tiếp "chống đối người lớn".'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n53
  cau: 'Câu hỏi 1: theo mô hình "mất cân bằng phát triển" của Steinberg (2008), giữa tuổi teen dễ mạo hiểm nhất vì hệ phần thưởng nhạy cảm đúng lúc hệ kiểm soát ở vỏ não trước trán còn chưa hoàn thiện; điểm mấu chốt là sự lệch nhịp giữa hai hệ thống; teen hiểu nguy hiểm.'
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n54
  cau: "Câu hỏi 2: tỉa synap là quá trình loại bỏ các kết nối thần kinh ít được dùng để tinh chỉnh mạng lưới não, được cho là góp phần vào việc chất xám giảm trong tuổi teen, song song với myelin hóa; không phải sự hư hại."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n55
  cau: "Câu hỏi 3: thí nghiệm lái xe của Gardner và Steinberg (2005) — khi chơi một mình các nhóm tuổi liều ngang nhau; khi có bạn bè xem, nhóm 13–16 liều gấp đôi, nhóm 18–22 hơn khoảng 50%, người lớn không thay đổi (theo Steinberg 2008)."
  loai: so-lieu
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n56
  cau: "Câu hỏi 4: Galvan và cộng sự (2006): nhân accumbens ở teen hoạt động mạnh hơn cả trẻ em lẫn người lớn, còn vỏ não ổ mắt giống trẻ em hơn người lớn; một bằng chứng não ủng hộ mô hình lệch nhịp (từ một nghiên cứu nhỏ)."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n57
  cau: "Câu hỏi 5: các nguồn đã đọc mô tả khả năng tự kiểm soát cải thiện dần đến đầu hay giữa tuổi đôi mươi, không có mốc cứng ở 25; khoa học phát triển nên được tham khảo (chứ không quyết định một mình) khi bàn về chính sách với người chưa thành niên (Steinberg 2009)."
  loai: phat-hien
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n58
  cau: Danh sách Nguồn của trang (Defoe 2015; Galvan 2006; Gardner & Steinberg 2005; Gogtay 2004; Shulman 2016; Steinberg 2008, 2009; Steinberg và cộng sự 2008) đúng tác giả, năm, nhan đề, tạp chí, tập, trang, DOI.
  loai: lich-su
- trang: kham-pha/co-so-sinh-hoc/nao-tuoi-teen
  id: n59
  cau: 'Tên "Margo Gardner" (trước: "M Gardner") và "Galvan và đồng nghiệp" (trước: "Adriana Galvan").'
  loai: lich-su
