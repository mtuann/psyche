- trang: bat-dau/doc-nhan-chac-chan
  id: n20
  cau: 'Dạy học khớp với "phong cách học" (nhìn, nghe, vận động) không giúp học tốt hơn: bài tổng quan năm 2008 gần như không thấy bằng chứng ủng hộ.'
  loai: phat-hien
  nguon:
    - ten: "Pashler và cộng sự (2008), Psychol Sci Public Interest 9(3), 105–119: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1111/j.1539-6053.2009.01038.x
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: ví dụ chỉ nêu khẳng định, không có nguồn ở trang. Chữ mới thêm nguồn Pashler và cộng sự (2008): "gần như không thấy bằng chứng" cho kiểu tương tác cần có. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Pashler 2008: "virtually no evidence for the interaction pattern"; chữ trang "gần như không thấy bằng chứng ủng hộ" đúng. Loại nên là phat-hien (tổng quan, không phải tái lập), không đổi chữ.'
- trang: bat-dau/index
  id: n10
  cau: Hiệu ứng giãn cách trong ghi nhớ là một ví dụ của tâm lý học khoa học.
  loai: phat-hien
  nguon:
    - ten: "Cepeda và cộng sự (2006), Psychol Bull 132(3), 354–380: toàn văn"
      link: https://doi.org/10.1037/0033-2909.132.3.354
  ket_qua_luot_1: dung
  ghi_chu: Ví dụ ở dòng cuối bảng; nghiên cứu có trang nhà duong-cong-quen.
- trang: bat-dau/index
  id: n9
  cau: Tâm lý học khoa học nói rõ chắc đến đâu và áp dụng cho ai; "tâm lý học" đại chúng hay nói tuyệt đối ("luôn luôn", "100%").
  loai: dinh-nghia
  nguon:
    - ten: "Henrich, Heine & Norenzayan (2010), Behav Brain Sci 33, 61–83: toàn văn (bản tác giả, UBC)"
      link: https://www2.psych.ubc.ca/~henrich/pdfs/WeirdPeople.pdf
    - ten: "Open Science Collaboration (2015), Science 349(6251), aac4716: bản thảo của tác giả trên OSF (toàn văn), cộng tóm tắt ở Europe PMC"
      link: https://osf.io/447b3/
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'chỗ khó: vế đại chúng chỉ là mô tả, không có số liệu. Chữ cũ: "Thường tuyệt đối". Chữ mới: "Hay nói tuyệt đối". Vế khoa học là chuẩn của site (Henrich đòi nói rõ áp dụng cho ai). Người gom quyết giữ hay bỏ hàng này. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Ô "Hay nói tuyệt đối" là mô tả, có ví dụ trong ngoặc; vế khoa học bám Henrich 2010. Không có con số; chấp nhận ở mức mô tả.'
- trang: nen-tang/y-thuc-giac-ngu
  id: n2
  cau: Đây là một trong 14 lĩnh vực của Psyche; mỗi bài dưới đây đã được kiểm chứng lại từ đầu, theo cách ghi ở trang Cách Psyche kiểm chứng, rồi khóa; bài chưa kiểm chứng xong chưa hiện ở đây, chỉ được đếm ở cuối danh sách.
  loai: ve-site
  nguon: []
  ket_qua_luot_1: da-sua
  ghi_chu: 'src/data/linh-vuc.yml có 14 lĩnh vực; ::danh-sach-bai (src/plugins/thanh-phan.mjs) chỉ liệt kê bài có trong bản build (đã khóa) và ghi "Còn N bài sắp có"; link tới bat-dau/cach-kiem-chung có trong trang.yml. Mô tả (frontmatter) cùng khuôn: "Các bài của lĩnh vực X trên Psyche: mỗi bài một câu hỏi, kèm bằng chứng và mức độ chắc chắn." Chữ cũ "chưa hiện ở đây" thêm "chỉ được đếm ở cuối danh sách" cho khớp thành phần. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Đối chiếu 30/10/2026: src/data/linh-vuc.yml có 14 bản ghi; danhSachBai (src/plugins/thanh-phan.mjs) chỉ liệt kê bài có trong bản build (bản thật: trang đã khóa, src/ban-build.mjs) và in dòng "Còn/Có N bài sắp có" ở cuối; link /psyche/bat-dau/cach-kiem-chung/ có trong build. HTML bản xem (dist/nen-tang/tri-nho/) khớp.'
- trang: nen-tang/tu-duy-tri-tue
  id: n1
  cau: Lĩnh vực nghiên cứu cách con người suy nghĩ, giải quyết vấn đề, ra quyết định và dùng ngôn ngữ, cùng các khác biệt giữa người với người về trí tuệ.
  loai: dinh-nghia
  nguon:
    - ten: OpenStax Psychology 2e, mục 7.1 What Is Cognition?
      link: https://openstax.org/books/psychology-2e/pages/7-1-what-is-cognition
    - ten: OpenStax Psychology 2e, mục 7.2 Language
      link: https://openstax.org/books/psychology-2e/pages/7-2-language
    - ten: OpenStax Psychology 2e, mục 7.3 Problem Solving
      link: https://openstax.org/books/psychology-2e/pages/7-3-problem-solving
    - ten: OpenStax Psychology 2e, mục 7.4 What Are Intelligence and Creativity?
      link: https://openstax.org/books/psychology-2e/pages/7-4-what-are-intelligence-and-creativity
  ket_qua_luot_1: dung
  ghi_chu: Phạm vi theo chương 7 OpenStax (nhận thức, ngôn ngữ, giải quyết vấn đề, trí tuệ).
