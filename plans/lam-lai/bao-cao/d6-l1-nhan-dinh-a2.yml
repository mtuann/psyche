- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n48
  cau: 'Khung "Khá vững: niềm tin về stress có thể thay đổi qua can thiệp ngắn".'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n50
  cau: 'Khung "Đang tranh cãi: đổi niềm tin có giúp khỏe hơn và làm việc tốt hơn?".'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n52
  cau: 'Khung "Khá vững: stress mạn tính, kéo dài liên quan đến nguy cơ sức khỏe cao hơn".'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n61
  cau: 'Mục Áp dụng 1: "xem cảm giác hồi hộp là tín hiệu chuẩn bị" :nhan[tranh-cai].'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n67
  cau: 'Mục Áp dụng 3: "Đừng dùng tư duy tích cực để phủ nhận vấn đề thật" :nhan[kha-vung].'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: q3
  cau: 'Câu hỏi 3: khẳng định "đổi niềm tin về stress giúp khỏe hơn" mang nhãn "Đang tranh cãi" vì kết quả chưa nhất quán (nhất là chỉ số sinh lý), nhiều kết quả tự báo cáo, hiệu ứng nhỏ, và tính đến 11/2026 chưa thấy tái lập lớn có đăng ký trước.'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n1
  cau: "Mô tả: hội chứng thích ứng chung của Selye (1936) và nghiên cứu stress mindset của Crum và cộng sự (2013)."
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n2
  cau: "Mô tả: liệu niềm tin về stress có thay đổi cách ta phản ứng với nó không."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n3
  cau: "Đáp án thu gọn: tim đập nhanh của An là phản ứng báo động bình thường; điều nghiên cứu liên hệ với nguy cơ sức khỏe là căng thẳng kéo dài mà không có lúc phục hồi."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n4
  cau: 'Đáp án thu gọn: một số thử nghiệm cho thấy niềm tin "stress có thể giúp ích" thay đổi cách người ta cảm nhận và phản ứng với stress, nhưng bằng chứng về phản ứng của cơ thể chưa nhất quán; nó không phải phép màu chữa bệnh.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n6
  cau: Năm 1936, Hans Selye ở Đại học McGill (Canada) nhận thấy dù gây hại cho chuột bằng cách nào, cơ thể chúng đều đáp lại bằng cùng một bộ triệu chứng.
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n7
  cau: Các tác nhân gây hại gồm nhiễm lạnh, phẫu thuật, vận động quá sức, hay tiêm đủ loại thuốc.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n8
  cau: "Bộ triệu chứng chung: tuyến thượng thận phì đại, tuyến ức và hạch bạch huyết teo lại, loét hay xói mòn dạ dày."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n9
  cau: "Phản ứng của cơ thể không đặc hiệu: không phụ thuộc loại tác nhân mà là phản ứng chung."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n10
  cau: Selye định nghĩa stress là "phản ứng của cơ thể trước mọi đòi hỏi, dù đòi hỏi ấy gây ra hay dẫn đến điều dễ chịu hay khó chịu" (Selye, 1976, theo OpenStax).
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n11
  cau: Cả những sự kiện vui như đám cưới hay kỳ nghỉ cũng đòi hỏi cơ thể thích nghi.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n12
  cau: "Hội chứng thích ứng chung gồm ba giai đoạn: báo động, kháng cự, kiệt sức."
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n13
  cau: 'Báo động: tim đập nhanh, adrenaline tăng, tương tự phản ứng "chiến hay chạy" mà Walter Cannon đã mô tả trước đó.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n14
  cau: "Kháng cự: nếu tác nhân còn đó, cơ thể cố thích nghi; kiệt sức: nếu kéo dài quá lâu, nguồn lực cạn dần, chức năng suy giảm, bệnh tật dễ xuất hiện."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n16
  cau: Selye nghiên cứu trên chuột với các tác nhân gây hại nặng.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n17
  cau: 'Hình "gas-curve": sơ đồ ba giai đoạn báo động, kháng cự, kiệt sức; "sơ đồ minh họa ước lệ, không theo tỉ lệ số liệu".'
  loai: cong-cu
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n18
  cau: 'Bài "Rethinking stress: The role of mindsets in determining the stress response", Journal of Personality and Social Psychology, 104(4), 716–733 (Crum, Salovey & Achor, 2013), gồm ba nghiên cứu.'
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n21
  cau: Trong một tuần, mỗi người ở hai nhóm đầu xem ba video ngắn khoảng 3 phút (gửi qua email) về tác động của stress lên sức khỏe, hiệu suất và khả năng học hỏi.
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n22
  cau: Vài ngày sau video cuối, họ làm lại các bài đo.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n23
  cau: 'Niềm tin về stress thay đổi được: nhóm xem video "có lợi" chuyển sang tin stress có ích hơn, nhóm xem video "có hại" chuyển theo hướng ngược lại.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n24
  cau: Nhóm "có lợi" báo cáo ít triệu chứng tâm lý hơn (thang MASQ), trong khi hai nhóm còn lại không thay đổi đáng kể.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n25
  cau: Nhóm "có lợi" tự đánh giá hiệu suất làm việc cao hơn (thang WPS), với xu hướng tương tự ở cả kỹ năng "cứng" và "mềm"; hai nhóm còn lại không thay đổi.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n26
  cau: Độ lớn hiệu ứng của can thiệp từ nhỏ đến vừa (η² = 0,02 với triệu chứng và 0,04 với hiệu suất tự đánh giá).
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n27
  cau: Mọi kết quả ở nghiên cứu 2 đều là tự báo cáo; chính các tác giả thừa nhận đây là điểm yếu.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n28
  cau: Người tham gia là nhân viên tự nguyện đăng ký chương trình quản lý stress.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n29
  cau: Hiệu quả của nghiên cứu 2 chỉ được đo khoảng hai tuần sau can thiệp.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n31
  cau: "Nghiên cứu 3: 63 sinh viên (trong số 109 sinh viên của một lớp tâm lý học) chuẩn bị bài thuyết trình trước lớp, biết rằng có thể bị chọn ngẫu nhiên để nói, bị quay video và chấm điểm."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n32
  cau: Cortisol trong nước bọt được đo vào một ngày học bình thường và vào ngày căng thẳng.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n33
  cau: Người có niềm tin "stress có lợi" (niềm tin được đo từ trước, không phải do can thiệp) muốn nhận phản hồi về bài nói của mình hơn, tức họ chọn tiếp cận thay vì né tránh.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n34
  cau: 'Về cortisol, kết quả chỉ ở mức "gần có ý nghĩa thống kê": niềm tin có lợi đi kèm phản ứng cortisol vừa phải, không quá cao cũng không quá thấp.'
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n35
  cau: "Keller và cộng sự (2012): quan sát trên 28.753 người Mỹ trưởng thành (khảo sát sức khỏe quốc gia 1998, theo dõi tử vong đến 2006)."
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n36
  cau: Người vừa báo cáo nhiều stress vừa tin rằng stress ảnh hưởng nhiều đến sức khỏe có nguy cơ tử vong sớm cao hơn 43% (HR = 1,43; KTC 95% 1,2–1,7).
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n37
  cau: Đây là nghiên cứu tương quan; các tác giả lưu ý nhân quả ngược có thể giải thích một phần (người sức khỏe kém dễ cho rằng stress ảnh hưởng đến mình).
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n38
  cau: 'Crum 2023: ba thử nghiệm đối chứng ngẫu nhiên về can thiệp "siêu nhận thức": cung cấp thông tin cân bằng hai mặt của stress và hướng dẫn tự chọn góc nhìn thích ứng.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n39
  cau: 'Thử nghiệm 1 (nhân viên công ty tài chính lớn): nhóm can thiệp tăng niềm tin "stress có lợi" nhiều hơn nhóm chờ, 4 tuần sau báo cáo cải thiện triệu chứng sức khỏe thể chất và hiệu suất (kỹ năng liên cá nhân), đều tự báo cáo.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n40
  cau: Thử nghiệm 2 (mô-đun đa phương tiện trực tuyến) lặp lại hiệu ứng lên niềm tin và triệu chứng; thử nghiệm 3 so với can thiệp truyền thống thấy niềm tin tăng nhiều hơn và vẫn giữ sau khi gặp thông tin trái chiều.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n42
  cau: 'Yeager và cộng sự (2022): chương trình "synergistic mindsets" ở học sinh Mỹ, sáu thử nghiệm ngẫu nhiên mù đôi, thấy cải thiện nhận thức về stress, phản ứng tim mạch, cortisol hằng ngày, sức khỏe tinh thần, thành tích học tập, triệu chứng lo âu trong đợt phong tỏa COVID-19 năm 2020; lợi ích phụ thuộc vào việc nhắm cả hai niềm tin.'
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n43
  cau: "Langrafe Junior và cộng sự (2025): thử nghiệm ngẫu nhiên nhỏ ở 63 giáo viên Brazil, chuỗi video 8 ngày (Mind and Body Lab, Stanford): niềm tin đổi và cortisol giảm ngay sau can thiệp, nhưng không còn khác sau 30 ngày."
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n45
  cau: 'Bosshard & Gomez (2024): phân tích tổng hợp 44 hiệu ứng thấy các can thiệp cải thiện nhẹ thành tích khi làm nhiệm vụ (d = 0,23), còn riêng can thiệp niềm tin "stress có lợi" (6 hiệu ứng) d = 0,18, chưa có ý nghĩa thống kê (p = 0,22).'
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n46
  cau: Từ 2013 nhiều nhóm khác đã thử các can thiệp tương tự (Yeager 2022; Langrafe Junior 2025; Nguyen 2023; Wu 2026).
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n47
  cau: 'Mục Nguồn: Bosshard & Gomez (2024), Sci Rep 14, 7923, tên bài "…task performance outcomes: A meta-analysis of randomized controlled trials".'
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n49
  cau: "Ở các thử nghiệm có đo lại, sự dịch chuyển còn thấy sau vài tuần: 4 tuần (Crum 2023), 30 ngày (Brazil 2025), 6 tháng (Việt Nam 2023, với một số chỉ số giảm bớt)."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n51
  cau: Tính đến 11/2026, chưa tìm thấy tái lập lớn, đăng ký trước, độc lập của thử nghiệm video 2013.
  loai: thoi-su
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n54
  cau: Stress tự cảm nhận cao đi kèm nguy cơ bệnh tim mạch vành cao hơn ở mức vừa phải (RR 1,27; Richardson và cộng sự, 2012).
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n55
  cau: Ước lượng từ các nghiên cứu đã công bố cao hơn từ các nghiên cứu chưa công bố (1,43 so với 1,16), gợi ý thiên lệch xuất bản.
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n56
  cau: '"Tải trọng thích ứng" (allostatic load) của McEwen và Stellar (1993): cái giá của sự phơi nhiễm mạn tính với phản ứng thần kinh/nội tiết tăng cao do thách thức lặp lại.'
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n58
  cau: Theo mô hình, ngắn thì cơ thể thích nghi được, kéo dài thì nguồn lực cạn dần (Selye).
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n59
  cau: 'Thuyết đánh giá (Lazarus): stress phụ thuộc vào cách ta đánh giá sự việc chứ không chỉ vào bản thân sự việc; cùng một kỳ thi, người thấy "thử thách" và người thấy "mối đe dọa" có thể phản ứng khác nhau.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n62
  cau: Các phân tích tổng hợp thấy can thiệp "đánh giá lại" stress giúp giảm nhẹ phản ứng stress tự cảm nhận và cải thiện nhẹ thành tích khi làm nhiệm vụ (phần lớn trong thí nghiệm), hiệu ứng nhỏ, khác nhau nhiều giữa các nghiên cứu, chưa thấy lợi ích rõ ở chỉ số sinh lý.
  loai: loi-khuyen
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n65
  cau: Giáo trình OpenStax Psychology 2e nêu vận động đều đặn, ngủ đủ và kết nối xã hội là những cách hỗ trợ đối phó với stress.
  loai: loi-khuyen
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n66
  cau: Đừng chỉ hỏi "làm sao hết stress", hãy hỏi "mình đã cho cơ thể nghỉ ngơi đủ chưa".
  loai: loi-khuyen
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n68
  cau: Chính nhóm Crum coi niềm tin "stress có lợi" không phải một chiến lược đối phó (Crum và cộng sự, 2013), và thử nghiệm 2023 dùng thông tin cân bằng cả hai mặt của stress.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n69
  cau: Khối lượng công việc quá tải, môi trường độc hại, hay các vấn đề sức khỏe tâm thần cần hỗ trợ chuyên môn; nếu đã thử nhiều cách mà tình trạng không cải thiện thì cần giúp đỡ chuyên nghiệp (xem trang Hỗ trợ).
  loai: loi-khuyen
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n71
  cau: 'Tính đến 11/2026, tìm thấy một nghiên cứu về niềm tin stress trên người Việt: bán thực nghiệm trên 409 sinh viên y năm nhất ở TP. Hồ Chí Minh, chương trình 10 tuần "Transforming Stress Program" (dựa trên liệu pháp hành vi biện chứng và chánh niệm); nhóm can thiệp tăng điểm niềm tin "stress có lợi", nhóm đối chứng không đổi.'
  loai: thoi-su
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n72
  cau: Đây không phải can thiệp video kiểu Crum; các nhóm được chia theo lớp chứ không ngẫu nhiên ở cấp cá nhân; chương trình gồm nhiều thành phần nên không tách riêng được tác dụng của việc đổi niềm tin.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n74
  cau: Các nghiên cứu then chốt của Crum ở Mỹ, trên sinh viên và nhân viên một tổ chức tài chính quốc tế; Brazil (63 giáo viên, 2025) và Trung Quốc (155 học sinh trung học cơ sở, 2026) cũng thấy niềm tin "stress có lợi" tăng sau can thiệp.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n75
  cau: Bối cảnh ở Việt Nam có thể khác các bối cảnh trên, nên chưa thể suy ra kết quả sẽ giống nhau.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n76
  cau: 'Ngộ nhận "stress nào cũng có hại": stress ngắn hạn là phản ứng thích nghi bình thường; điều đáng lo hơn là stress kéo dài mà không được phục hồi.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n77
  cau: 'Ngộ nhận "cứ nghĩ tích cực là hết bệnh": niềm tin về stress có thể ảnh hưởng đến cách ta phản ứng với stress; các thử nghiệm của Crum chủ yếu đo triệu chứng tự báo cáo và hiệu suất tự đánh giá; vài thử nghiệm khác có đo chỉ số sinh lý nhưng kết quả chưa nhất quán.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n78
  cau: 'Ngộ nhận "Selye nói stress là phản ứng trước chuyện xấu": Selye định nghĩa stress là phản ứng của cơ thể trước mọi đòi hỏi, kể cả chuyện vui; ông sau này còn phân biệt "eustress" với "distress".'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: q1
  cau: 'Câu hỏi 1: phát hiện khởi đầu của Selye (1936): dù gây hại bằng cách nào, chuột đều đáp lại bằng cùng một bộ triệu chứng; "bộ ba" tuyến thượng thận phì đại, tuyến ức–hạch teo, loét dạ dày.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: q2
  cau: 'Câu hỏi 2: nghiên cứu 2 của Crum (2013): nhóm "có lợi" báo cáo ít triệu chứng tâm lý hơn và tự đánh giá hiệu suất cao hơn; nghiên cứu 2 không đo cortisol; các thước đo đều tự báo cáo; bài không báo cáo rằng lượng stress giảm.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: q4
  cau: "Câu hỏi 4: theo mô hình GAS, stress trở nên nguy hiểm khi kéo dài đến giai đoạn kiệt sức, cơ thể không còn nguồn lực thích nghi; tim đập nhanh là giai đoạn báo động."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: q5
  cau: "Câu hỏi 5: Keller và cộng sự (2012): người vừa nhiều stress vừa tin stress hại sức khỏe có nguy cơ tử vong sớm cao hơn 43%; nghiên cứu tương quan, không chứng minh nhân quả; nghiên cứu quan sát không loại trừ được yếu tố nhiễu."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n81
  cau: "Mục Nguồn: Crum 2013, Keller 2012, Selye 1936, Crum 2023, Yeager 2022, Langrafe 2025, Liu 2019, Bosshard 2024, Nguyen 2023, Kivimäki 2012, Richardson 2012, Wendsche 2016, Szabo 2012, McEwen & Stellar 1993, Lazarus & Folkman 1984, OpenStax Psychology 2e (14.1, 14.2, 14.4) có tên, tạp chí, tập, trang, DOI đúng."
  loai: lich-su
