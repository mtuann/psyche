  "trich": "'the self-fulfilling prophecy (Merton, 1948)—erroneous teacher expectations may lead students to perform at levels consistent with those expectations'"
- "trang": "thi-nghiem/pygmalion"
  "id": "l2"
  "luot_2": "dung"
  "nguon": *id002
  "trich": "'warmer and more supportive ... clearer and more positive feedback, teach them more and more difficult material, and give them more opportunities to demonstrate mastery'"
  "ghi_chu": "Bốn kênh khớp (climate, feedback, input, output). Bài nêu đây là mô tả hành vi giáo viên, còn việc chúng làm đổi thành tích là giả định."
- "trang": "thi-nghiem/pygmalion"
  "id": "l3"
  "luot_2": "dung"
  "nguon": *id002
  "trich": "'teacher expectations may predict student outcomes more because these expectations are accurate than because they are self-fulfilling'; 'self-fulfilling ... typically small'"
- "trang": "thi-nghiem/pygmalion"
  "id": "l4"
  "luot_2": "dung"
  "nguon": *id002
  "trich": "'(b) powerful self-fulfilling prophecies may selectively occur among students from stigmatized social groups; (c) whether SFP ... in general do more harm than good, remains unclear'; Madon et al.: .26 (low achievers) vs .08"
- "trang": "thi-nghiem/pygmalion"
  "id": "a1"
  "luot_2": "dung"
  "nguon": *id002
  "trich": "'Teachers are typically emotionally warmer ... high expectancy students' (phần mô tả hành vi); hiệu ứng thường nhỏ"
  "ghi_chu": "Lời khuyên (tránh dán nhãn) là suy luận hợp lý, không phải kết quả nghiên cứu; câu đã nói rõ 'nhỏ nhưng có thể có thật'."
