  "id": "a2"
  "luot_2": "dung"
  "nguon":
  - "https://doi.org/10.1037/0022-0663.76.1.85"
  - "https://gwern.net/doc/statistics/bias/1984-raudenbush.pdf"
  - "https://doi.org/10.1207/s15327957pspr0902_3"
  - "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf"
  "trich": "Raudenbush 1984: 18 thí nghiệm trên học sinh; Jussim & Harber: 'new military recruits' (McNatt 2000) là ngoại lệ khác"
  "ghi_chu": "Đúng: thang tuần tiếp xúc chỉ kiểm trên học sinh trong các thí nghiệm Pygmalion. Jussim & Harber còn nêu nghiên cứu McNatt (2000) trên tân binh, tức có bằng chứng khác ngoài lớp học, nhưng không phải quy luật 'gieo lúc mới quen' của Raudenbush."
- "trang": "thi-nghiem/pygmalion"
  "id": "a3"
  "luot_2": "dung"
  "nguon": *id002
  "trich": "'In the classroom, however, even these relatively more powerful effects ... only averaged to an r of about .2'; overall r = .15"
  "ghi_chu": "Lời khuyên cho người đọc; số liệu nền (r khoảng 0,1-0,2) đỡ cho 'thường là phần nhỏ'."
- "trang": "thi-nghiem/pygmalion"
  "id": "v1"
  "luot_2": "khong-chac"
  "trich": "Tìm web 30/10/2026 (tiếng Việt và Anh): không thấy thí nghiệm kỳ vọng giáo viên trên học sinh Việt Nam; chỉ bài phổ thông và nghiên cứu nước ngoài"
  "ghi_chu": "Khẳng định 'chưa tìm thấy' là kết quả tìm kiếm hạn chế của lượt này (không vào được cơ sở dữ liệu tạp chí Việt Nam); đúng theo nghĩa 'chưa tìm thấy', nhưng nguồn bậc 1-2 không có để xác nhận được, nên chấp nhận ở mức hạn chế."
- "trang": "thi-nghiem/pygmalion"
  "id": "v2"
  "luot_2": "dung"
  "nguon": *id002
  "trich": "'The one study to empirically investigate this hypothesis, however, failed to support it (Smith et al., 1998). Self-fulfilling prophecies among students grouped by ability between classes were no more powerful than those among students in heterogeneous classes'"
