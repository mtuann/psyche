  "ghi_chu": "Bài mô tả là 18 thí nghiệm kiểm kỳ vọng giáo viên lên IQ học sinh; việc gồm cả nghiên cứu gốc suy từ 'Pygmalion experiments' trong tóm tắt và Hình 1."
- "trang": "thi-nghiem/pygmalion"
  "id": "b2"
  "luot_2": "dung"
  "nguon": *id001
  "trich": "'Because Pellegrini and Hicks (1972) employed aware testers for half ... treated as separate studies in this section. Thus Table 5 shows 19 cases in all.'"
  "ghi_chu": "Phân tích chính dùng 18 nghiên cứu (đơn vị 18) và 33 so sánh trong khối lớp; con số 19 chỉ ở Bảng 5 (một nghiên cứu tách đôi) nên 'đưa về cùng thước đo' đúng nhưng 19 không phải con số của phân tích chính."
