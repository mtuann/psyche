  "trich": "Perseus, Ovid Met. 10: Pygmalion tạc tượng ngà trắng như tuyết, đem lòng yêu (bản dịch Kline/Melville trên Perseus)"
  "ghi_chu": "Đọc đoạn đầu của Perseus Metamorphoses 10 (tượng ngà, Pygmalion yêu); chi tiết 'tượng hóa thành người' là nội dung quen thuộc của đoạn sau cùng quyển, chưa đọc lại từng dòng."
