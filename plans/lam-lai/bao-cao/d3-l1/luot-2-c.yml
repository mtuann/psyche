  "trich": "Twelve of the thirteen students enrolled in a senior division course in experimental psychology served as Es... 'maze-bright' vs 'maze-dull'; each E five rats; T maze"
  "ghi_chu": "Chi tiết: nhiệm vụ là học phân biệt sáng-tối trong mê cung chữ T (65 chuột chia 13 nhóm, 12 sinh viên dùng 60 chuột). Sinh viên được báo ngay là có chuột 'thông minh' hay 'đần'."
- "trang": "thi-nghiem/pygmalion"
  "id": "r2"
  "luot_2": "dung"
  "nguon": *id003
  "trich": "'Actually, the groups had been labeled bright or dull randomly, with the restriction that differences in mean age per group per matched pair be at a minimum.'"
