  "trich": "'Self-fulfilling prophecies in the classroom do occur, but these effects are typically small' (Jussim & Harber 2005); Rosenthal & Rubin 1978 review of 345 studies 'further substantiates the expectancy effect in a wide variety of settings' (Raudenbush)"
  "ghi_chu": "Dung nếu chỉ đọc là 'có thể xảy ra' (tồn tại hiệu ứng, thường nhỏ): có tổng quan 35 năm và phân tích tổng hợp, nhiều bối cảnh. Không dùng được cho tuyên bố về tác động lên IQ (xem nt)."
