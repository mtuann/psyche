  "id": "r3"
  "luot_2": "dung"
  "nguon": *id003
  "trich": "'Performance of the Ss run by Es believing Ss to be bright was significantly better on days 1, 4, and 5 but not on days 2 and 3. ... when the data from all five days were combined, t was again significant, this time with a one-tailed p of .01.'"
- "trang": "thi-nghiem/pygmalion"
  "id": "r4"
  "luot_2": "dung"
  "nguon": *id003
  "trich": "'the Es believing their Ss to be brighter... see their Ss, on the whole, as brighter, cleaner, tamer, and more pleasant' (Es: 21 trong 23 thang đo nghiêng về nhóm 'thông minh')"
- "trang": "thi-nghiem/pygmalion"
  "id": "r5"
  "luot_2": "dung"
  "nguon": *id003
  "trich": "'these Es saw themselves as handling their rats more, and more gently ... significant at the .09 level, two-tailed test'; Cluster 1-3: relaxed, friendly, encouraging, enthusiastic..."
  "ghi_chu": "Bài viết 'tended to' chứ không nêu mọi thang đều có ý nghĩa; p = .09 hai phía cho điểm cầm nắm khớp."
- "trang": "thi-nghiem/pygmalion"
  "id": "r6"
  "luot_2": "dung"
  "nguon": *id003
  "trich": "'it appears that these obtained differences in handling patterns may play a role in the mediation of experimenter bias to animal Ss'"
