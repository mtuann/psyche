  "ghi_chu": "Sherif xác nhận lần 1953 bị dừng giữa giai đoạn quan hệ giữa nhóm do khó khăn và sai sót trong điều hành. Việc các em quy nguồn cơn cho ban điều hành chỉ có ở sách báo của Perry (2018), qua bài báo phổ thông mà tôi chỉ đọc; nguồn bậc 1-2 không xác nhận chi tiết này."
