  "ghi_chu": "Số 4 và 7 điểm là điểm tăng chênh lệch giữa hai nhóm (gain), nghiên cứu gốc báo; bản thân Rosenthal & Jacobson không đọc trực tiếp, qua Raudenbush và Jussim & Harber."
