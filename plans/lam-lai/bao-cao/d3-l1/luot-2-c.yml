  - "https://doi.org/10.1207/s15327957pspr0902_3"
  - "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf"
  "cau_dung": "Trong các thí nghiệm gieo thông tin bịa đặt về IQ, hiệu ứng chỉ rõ khi giáo viên chưa quen học sinh (khoảng hai tuần đầu), và biến mất sau đó; nhưng kỳ vọng hình thành tự nhiên vẫn có tác động tự ứng nghiệm nhỏ, và có thể mạnh hơn ở học sinh bị kỳ thị."
  "trich": "Jussim & Harber: SFP 'typically small' (r 0-.2) nhưng vẫn xảy ra ở lớp học tự nhiên; Raudenbush: thí nghiệm gieo thông tin giả không tác động sau hơn 2 tuần; McNatt (2000) tân binh"
  "ghi_chu": "'Chỉ gieo được trên mảnh đất trống' nói rộng ra mọi kỳ vọng. Bằng chứng chỉ nói về thí nghiệm gieo thông tin bịa lên IQ; kỳ vọng tự nhiên vẫn có tác động nhỏ, mạnh hơn ở nhóm bị kỳ thị."
