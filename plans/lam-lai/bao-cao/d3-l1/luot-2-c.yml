  "ghi_chu": "Thorndike kết luận cho dữ liệu lớp 1-2 (nơi hiệu ứng nằm): 'phát hiện cho hai lớp này phải không chê vào đâu được', và bài lập luận lớp 1 là vô giá trị; 'các kết luận của sách' là cách nói gọn."
