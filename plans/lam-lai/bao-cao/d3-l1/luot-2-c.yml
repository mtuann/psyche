  "trich": "Thorndike: 'a list of names of pupils (actually selected by a table of random numbers) who were alleged to be the ones likely to show a spurt'"
  "ghi_chu": "Thiết kế: giáo viên được báo bài kiểm tra dự đoán 'bứt phá', không được bảo thiên vị. Nguồn: Thorndike 1968 và Jussim & Harber."
