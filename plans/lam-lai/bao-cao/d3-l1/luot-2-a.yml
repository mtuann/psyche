  - https://doi.org/10.1068/p281059
  trich: Four videotapes, each 75 s in duration... two teams of three players, one team wearing white shirts and the other black.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n4
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  trich: keep either a silent mental count of the total number of passes (Easy) or separate counts of bounce and aerial passes (Hard); attend white or black team.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n5
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  trich: After 44-48 s of this action... In either case, the unexpected event lasted 5 s.
  ghi_chu: Thí nghiệm chính dùng 'gorilla' hoặc 'umbrella woman'.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n6
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  trich: In the Umbrella-Woman condition... in the Gorilla condition, a shorter woman wearing a gorilla costume.
  ghi_chu: Điều kiện chia đều 16 ô nên mỗi sự kiện khoảng một nửa số video.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n7
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  trich: 228 observers, almost all undergraduate students... Data from thirty-six observers were discarded... remaining 192... twelve per condition.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n8
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  trich: Twelve new observers watched this video (62 s; began after 35 s, lasted 9 s) ... only 50% noticed the event... roughly the same as the normal Opaque/Gorilla event (42%).
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n9
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  trich: attended the Black team noticed the Gorilla much more often than White (Black 58%, White 27%); Umbrella Woman (Black 62%, White 69%).
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n10
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  trich: observers are more likely to notice an unexpected event that shares basic visual features, in this case color, with the events they are attending to.
  ghi_chu: Tác giả ghi 'logically possible' cách giải thích khác (khác biệt với thứ bị bỏ qua); câu của trang diễn đạt đúng ý chính.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n11
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  trich: More observers noticed the unexpected event in the Easy (64%) than in the Hard (45%) condition.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n12
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  trich: 'Gorillas in Our Midst: Sustained Inattentional Blindness for Dynamic Events (tiêu đề bài gốc).'
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n13
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  - https://www.ncbi.nlm.nih.gov/pmc/articles/3485775
  trich: 'Inattentional blindness: the failure to see visible and otherwise salient events when one is paying attention to something else (Chabris 2011).'
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n14
  luot_2: dung
  nguon:
  - https://doi.org/10.1080/135062800394865
  - https://doi.org/10.1068/p281059
  trich: subjects fail to detect large between-view changes to natural and artificial scenes (change blindness).
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n15
  luot_2: khong-chac
  nguon:
  - https://doi.org/10.3758/bf03214339
  ghi_chu: 'Không mở được toàn văn bài gốc (đóng, không có bản tác giả); chỉ đọc tóm tắt. Levin & Simons 1997 (Psychonomic Bull Rev): không có tóm tắt trong Crossref/OpenAlex/PubMed; chi tiết ''diễn viên duy nhất biến thành người khác'' không xác nhận được. Simons & Chabris 1999 chỉ dẫn bài này nói chung (''changes to attended objects are often not noticed'').'
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n16
  luot_2: khong-chac
  nguon:
  - https://doi.org/10.1068/p281059
  ghi_chu: 'Simons & Chabris 1999 xác nhận: người chỉ đường ''often did not notice'' bị thay bằng người khác khi cửa che; nhưng ''khoảng một nửa'' và ''phụ thuộc nhóm xã hội'' chỉ có trong bài gốc 1998, không mở được.'
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n17
  luot_2: dung
  nguon:
  - https://doi.org/10.1002/acp.1638
  - https://www.ncbi.nlm.nih.gov/pmc/articles/3485775
  trich: cell phone users were less likely to notice an unusual activity along their walking route (a unicycling clown) than MP3 listeners, walkers alone and pairs (Hyman 2010).
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n18
  luot_2: dung
  nguon:
  - https://doi.org/10.1002/acp.1638
  trich: Cell phone usage may cause inattentional blindness even during a simple activity... (đi bộ; không đo lái xe).
  ghi_chu: 'Khẳng định về phạm vi nghiên cứu: đúng, nghiên cứu là về đi bộ.'
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n19
  luot_2: dung
  nguon:
  - https://www.ncbi.nlm.nih.gov/pmc/articles/3964612
  trich: We asked 24 radiologists to perform a lung nodule detection task. A gorilla, 48 times larger than the average nodule... 83% of radiologists did not see the gorilla.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n20
  luot_2: dung
  nguon:
  - https://doi.org/10.1177/03010066211072466
  trich: meta-analyzed the extant studies (K = 14; N = 1153)... 62% of novices experienced inattentional blindness compared to 56% of experts... only a slight reduction.
  ghi_chu: Tác giả ghi số nghiên cứu ít, mẫu nhỏ; khoảng tin cậy OR [0,78; 2,28] bao gồm 1.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n21
  luot_2: dung
  nguon:
  - https://pubmed.ncbi.nlm.nih.gov/33086130
  trich: we employed meta-analysis to combine 59 behavioral experiments... visual stimuli can be processed when unattended and unnoticed.
  ghi_chu: Tác giả ghi vấn đề vẫn 'còn tranh luận' và phụ thuộc cách đo nhận biết.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n22
  luot_2: dung
  nguon:
  - https://www.ncbi.nlm.nih.gov/pmc/articles/3485775
  trich: At night only 35% of subjects noticed the fight; during the day 56% noticed... increasing the load significantly decreased noticing.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n23
  luot_2: dung
  nguon:
  - https://pubmed.ncbi.nlm.nih.gov/12971922
  trich: Often the involved car drivers have maintained that they did not see the bicycle until immediately before the collision even though the bicycle must have been clearly visible... 'looked-but-failed-to-see'.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n24
  luot_2: dung
  nguon:
  - https://pubmed.ncbi.nlm.nih.gov/24983189
  trich: 28 studies... 977 participants... Typing and reading text messages while driving adversely affected eye movements, stimulus detection, reaction time, collisions, lane positioning, speed and headway.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n25
  luot_2: dung
  nguon:
  - https://pubmed.ncbi.nlm.nih.gov/24983189
  trich: texting compromises the safety of the driver, passengers and other road users.
  ghi_chu: Lời khuyên hợp lý từ bằng chứng.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n26
  luot_2: dung
  nguon:
  - https://doi.org/10.1002/acp.1638
  trich: cell phone users were less likely to notice an unusual activity along their walking route.
  ghi_chu: Lời khuyên là suy luận từ kết quả; nghiên cứu không kiểm việc sang đường.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n27
  luot_2: dung
  nguon:
  - https://www.ncbi.nlm.nih.gov/pmc/articles/3485775
  trich: At night only 35% of subjects noticed the fight; during the day 56% noticed.
  ghi_chu: Mẫu nhỏ (20 và 16 người).
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n28
  luot_2: dung
  nguon:
  - https://www.ncbi.nlm.nih.gov/pmc/articles/3964612
  - https://doi.org/10.1177/03010066211072466
  trich: '83% of 24 radiologists did not see the gorilla; meta-analysis: experts 56% vs novices 62% IB.'
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n29
  luot_2: dung
  nguon:
  - https://doi.org/10.1080/135062800394865
  trich: 'Most claimed that they would have noticed even relatively small changes that real observers rarely detected... overestimating the degree to which changes would be detected (tên bài: ''Change Blindness Blindness'').'
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n30
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  trich: The level of inattentional blindness depends on the difficulty of the primary task.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n31
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  - https://doi.org/10.1177/03010066211072466
  - https://www.ncbi.nlm.nih.gov/pmc/articles/3485775
  trich: 'Approximately half of observers fail to notice (46%); meta-analysis of 14 studies: 62% of novices; real-world simulation 35-56%.'
  ghi_chu: Hiện tượng lặp lại ở nhiều thiết kế và nhóm; không thấy thất bại tái lập lớn; có tổng hợp.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n32
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  - https://www.ncbi.nlm.nih.gov/pmc/articles/3485775
  trich: Easy 64% vs Hard 45% noticing; Gorilla noticed more when attending Black team (color similarity); increasing load decreased noticing (Chabris 2011).
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n33
  luot_2: dung
  nguon:
  - https://www.ncbi.nlm.nih.gov/pmc/articles/3485775
  - https://pubmed.ncbi.nlm.nih.gov/12971922
  trich: 'Real-world simulation: 35-56% noticed; Danish ''looked-but-failed-to-see'' accidents.'
  ghi_chu: 'Khá vững hợp lý: chỉ vài nghiên cứu ngoài đời, mẫu nhỏ; chưa rõ cho nhân chứng.'
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n34
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  trich: Tìm OpenAlex 'inattentional blindness Vietnamese' (30/10/2026) không ra nghiên cứu mù không chú ý trên người Việt.
  ghi_chu: Câu 'chưa tìm thấy' có mốc 10/2026.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n35
  luot_2: dung
  nguon:
  - https://pubmed.ncbi.nlm.nih.gov/12971922
  trich: Danish studies of traffic accidents at priority intersections... looked-but-failed-to-see.
  ghi_chu: Suy luận cho Việt Nam được tự ghi là suy luận.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n36
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  - https://doi.org/10.1080/135062800394865
  trich: 46% failed to notice (Simons & Chabris); 'change blindness blindness' (Levin 2000).
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n37
  luot_2: dung
  nguon:
  - https://www.ncbi.nlm.nih.gov/pmc/articles/3964612
  trich: Eye-tracking revealed that the majority of those who missed the gorilla looked directly at the location of the gorilla.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n38
  luot_2: dung
  nguon:
  - https://pubmed.ncbi.nlm.nih.gov/24983189
  trich: Typing and reading text messages while driving adversely affected stimulus detection, reaction time, collisions, lane positioning.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n39
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  trich: 46% failed to notice the unexpected event.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n40
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  trich: 'Gorilla: Black 58%, White 27%; Umbrella Woman: Black 62%, White 69%.'
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n41
  luot_2: khong-chac
  nguon:
  - https://doi.org/10.1068/p281059
  ghi_chu: 'Như n16: Simons & Levin 1998 không mở được; ''khoảng một nửa'' không xác nhận.'
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n42
  luot_2: dung
  nguon:
  - https://doi.org/10.1002/acp.1638
  trich: cell phone users were less likely to notice (unicycling clown) than MP3 listeners, no electronics, pairs.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n43
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  - https://doi.org/10.1002/acp.1638
  - https://pubmed.ncbi.nlm.nih.gov/24983189
  trich: Inattentional blindness in dynamic scenes; texting impairs detection (Caird 2014).
  ghi_chu: Lời khuyên suy từ bằng chứng.
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n44
  luot_2: dung
  nguon:
  - https://doi.org/10.1068/p281059
  trich: (Hình minh họa giả định, đã tự ghi 'minh họa giả định'; sáu người, hai đội, chuyền bóng rổ khớp bài gốc.)
  ghi_chu: Không phải số liệu thực nghiệm.
