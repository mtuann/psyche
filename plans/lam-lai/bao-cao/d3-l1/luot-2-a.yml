  id: n13
  luot_2: dung
  nguon:
  - https://archive.org/details/solomon-asch_confirmaty
  trich: the difference ranging from three quarters of an inch to an inch and three quarters... the majority unanimous and arbitrary with respect to a clear and simple fact.
