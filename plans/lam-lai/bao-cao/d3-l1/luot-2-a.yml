  id: n17
  luot_2: dung
  nguon:
  - https://archive.org/details/solomon-asch_confirmaty
  trich: Under the pressure of a majority of three, the subjects' errors jumped to 31.8 per cent. But further increases in the size of the majority apparently did not increase the weight of the pressure substantially.
  ghi_chu: Đúng cho dữ liệu Asch; xem n19 cho các phân tích sau.
- trang: thi-nghiem/asch
  id: n18
  luot_2: dung
  nguon:
  - https://archive.org/details/solomon-asch_confirmaty
  trich: 'Its pressure on the dissenting individual was reduced to one fourth: subjects answered incorrectly only one fourth as often as under the pressure of a unanimous majority.'
- trang: thi-nghiem/asch
  id: n19
  luot_2: khong-chac
  nguon:
  - https://doi.org/10.1037/0033-2909.119.1.111
  ghi_chu: Tóm tắt Bond & Smith 1996 không nói gì về quy mô nhóm; bài tổng quan riêng của Bond 2005 (meta-analysis 125 nghiên cứu kiểu Asch) nói quan hệ quy mô nhóm - hùa theo thay đổi theo kiểu phản hồi công khai/riêng, nhưng chưa đọc toàn văn để xác nhận câu gán cho Bond & Smith 1996.
- trang: thi-nghiem/asch
  id: n20
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/0033-2909.119.1.111
  trich: The literature search produced 133 studies drawn from 17 countries.
- trang: thi-nghiem/asch
  id: n21
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/0033-2909.119.1.111
  trich: An analysis of U.S. studies found that conformity has declined since the 1950s.
- trang: thi-nghiem/asch
  id: n22
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/0033-2909.119.1.111
  trich: several commentators have suggested that the relatively high levels of conformity found in experiments conducted in the early 1950s (notably Asch) was in part a product of the McCarthy era.
- trang: thi-nghiem/asch
  id: n23
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/0033-2909.119.1.111
  trich: Results from 3 surveys were used to assess a country's individualism-collectivism, and for each survey the measures were found to be significantly related to conformity. Collectivist countries tended to show higher levels of conformity.
  ghi_chu: Tên ba khảo sát (Hofstede, Schwartz, Trompenaars) không có trong tóm tắt; phần cốt lõi khớp.
- trang: thi-nghiem/asch
  id: n24
  luot_2: dung
  nguon:
  - https://doi.org/10.1371/journal.pone.0294325
  trich: We find an error rate of 33%... Overall, 210 subjects participated... 202 valid cases... in line with Asch's original 36.8% (t(16)=0.59, p=0.57).
  ghi_chu: 210 người tuyển, 202 hợp lệ trong phân tích; 5 chim mồi + người thật; 10 lượt (6 gài bẫy); sinh viên Bern.
- trang: thi-nghiem/asch
  id: n25
  luot_2: dung
  nguon:
  - https://doi.org/10.1371/journal.pone.0294325
  trich: In the incentivized condition the error rate decreases to 25%... monetary incentives do not eliminate the effect of group pressure.
- trang: thi-nghiem/asch
  id: n26
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/0033-2909.119.1.111
  - https://doi.org/10.1371/journal.pone.0294325
  - https://doi.org/10.1037/amp0000469
  trich: Meta-analysis of 133 line-judgment studies (Bond & Smith); close replication with 5 confederates at 33% (Franzen & Mader 2023); Takano & Sogon (Nhật), Bosnia.
  ghi_chu: 'Khớp thước đo Vững chắc cho nhận định hẹp này: có phân tích tổng hợp, cùng chiều, nhiều nước. Lưu ý mức hùa theo giảm theo thời gian ở Mỹ và biến thiên giữa nghiên cứu; không có tái lập lớn đăng ký trước mà tôi biết, nhưng cũng không có thất bại tái lập lớn.'
- trang: thi-nghiem/asch
  id: n27
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/0033-2909.119.1.111
  trich: Collectivist countries tended to show higher levels of conformity than individualist countries (3 surveys).
  ghi_chu: 'Khá vững là hợp lý: tương quan cấp quốc gia, 133 nghiên cứu, mẫu phần lớn sinh viên; không thể gọi Vững chắc.'
- trang: thi-nghiem/asch
  id: n28
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/0033-2909.119.1.111
  trich: Culture level analysis across countries using three surveys; the authors state conformity is 'to some extent a product of cultural conditions'.
  ghi_chu: 'Đúng: dữ liệu là so sánh giữa quốc gia (tương quan), không có phân bổ ngẫu nhiên.'
- trang: thi-nghiem/asch
  id: n29
  luot_2: dung
  nguon:
  - https://pubmed.ncbi.nlm.nih.gov/15978553
  - https://doi.org/10.1177/0146167213508985
  trich: Conformity was associated with functional changes in an occipital-parietal network (Berns 2005); social influence alters the uptake of sensory evidence (Germar 2014); Asch could not settle it.
  ghi_chu: 'Hợp lý là Đang tranh cãi: bằng chứng hành vi/thần kinh mâu thuẫn về cơ chế; chưa có tổng hợp chốt.'
