  luot_2: dung
  nguon:
  - https://doi.org/10.1126/science.aac4716
  trich: Thirty-six percent of replications had statistically significant results; replication success was better predicted by the strength of original evidence.
  ghi_chu: Kết luận 'sống sót qua nhiều lần làm lại đáng tin hơn' là suy luận hợp lý khớp OSC; không phải số liệu.
- trang: thi-nghiem/index
  id: p4
  luot_2: khong-chac
  ghi_chu: Không mở được toàn văn bài gốc (đóng, không có bản tác giả); chỉ đọc tóm tắt. Cỡ mẫu Milgram 1963 (40 nam, Yale), Bandura 1961 (trẻ Stanford), Zimbardo 1973 (sinh viên Mỹ) chỉ có tóm tắt/mở bài; tóm tắt không nêu các chi tiết này. Hồ sơ của từng trang nhà nên kiểm.
