  - https://archive.org/details/solomon-asch_confirmaty
  ghi_chu: Ba kiểu phản ứng (méo tri giác, méo phán đoán, méo hành động) là từ Asch 1956 (Psychological Monographs), không mở được toàn văn. Asch 1955 chỉ xác nhận 'mọi người hùa theo đều đánh giá thấp tần suất mình hùa theo' và vài lý do (tin mình sai; không muốn làm hỏng kết quả; sợ khác biệt).
