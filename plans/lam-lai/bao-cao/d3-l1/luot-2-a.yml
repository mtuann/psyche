  nguon:
  - https://archive.org/details/solomon-asch_confirmaty
  ghi_chu: 36,8% và 'khoảng ba phần tư hùa ít nhất một lần' đúng (Asch 1955); riêng '0,7% đối chứng' chưa đọc được trực tiếp (1955 chỉ nói dưới 1%).
