  luot_2: dung
  nguon:
  - https://archive.org/details/solomon-asch_confirmaty
  trich: 123 subjects... seven to nine young men... compare the lengths of lines; the instructed majority gives incorrect answers in unanimity.
  ghi_chu: Năm 1951/1956 là các công bố khác của Asch; mô tả thiết kế khớp Asch 1955 (cùng loạt).
