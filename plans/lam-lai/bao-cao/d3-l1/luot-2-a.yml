  id: n9
  luot_2: dung
  nguon:
  - https://archive.org/details/solomon-asch_confirmaty
  trich: 36.8 per cent of the selections (nghĩa là khoảng 63% không hùa theo).
  ghi_chu: 63% là phép trừ từ 36,8%.
