  luot_2: dung
  nguon:
  - https://archive.org/details/solomon-asch_confirmaty
  - https://doi.org/10.1371/journal.pone.0294325
  trich: One person near the end of the group (Asch 1955); an additional uninstructed subject... after the next to last of the confederates (Franzen & Mader, mô tả bài gốc).
- trang: thi-nghiem/asch
  id: n7
  luot_2: dung
  nguon:
  - https://archive.org/details/solomon-asch_confirmaty
  - https://openstax.org/books/psychology-2e/pages/12-4-conformity-compliance-and-obedience
  trich: construed their difference from the majority as a sign of some general deficiency in themselves, which at all costs they must hide; participants complied to fit in and avoid ridicule (OpenStax).
  ghi_chu: Đây là diễn giải của trang; 'sợ bị chê cười' rõ ở OpenStax, 'sợ nhìn nhầm' ('I am wrong, they are right') và 'lập dị' (thiếu sót mà phải che giấu) ở Asch 1955.
- trang: thi-nghiem/asch
  id: n8
  luot_2: dung
  nguon:
  - https://archive.org/details/solomon-asch_confirmaty
  trich: the very ease of success in these experiments arouses suspicion... one must question whether opinions are generally as watery as these studies indicate.
