  luot_2: dung
  nguon:
  - https://archive.org/details/solomon-asch_confirmaty
  trich: The experiment opens uneventfully... on the first round every person chooses the same matching line... On the third trial there is an unexpected disturbance. One person near the end of the group disagrees.
  ghi_chu: Phần 'hãy tưởng tượng' khớp mô tả của Asch; 7 người nằm trong khoảng 7-9.
- trang: thi-nghiem/asch
