  id: n14
  luot_2: khong-chac
  nguon:
  - https://archive.org/details/solomon-asch_confirmaty
  ghi_chu: Chỉ có 'dưới 1% sai' ở Asch 1955; con số '95% không sai lần nào' ở nhóm đối chứng (Asch 1956) chưa đọc được trực tiếp.
