  luot_2: dung
  nguon:
  - https://archive.org/details/solomon-asch_confirmaty
  trich: There are 18 trials in each series, and on 12 of these the majority responds erroneously.
  ghi_chu: 6 lượt còn lại là lượt đa số trả lời đúng (trung tính), khớp 'occasionally reports correctly'.
