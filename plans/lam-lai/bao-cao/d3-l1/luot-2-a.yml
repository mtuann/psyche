  id: n10
  luot_2: khong-chac
  nguon:
  - https://archive.org/details/solomon-asch_confirmaty
  ghi_chu: Asch 1955 (Sci Am) chỉ nói 'dưới 1%' ở điều kiện bình thường; con số chính xác 0,7% (nhóm đối chứng, Asch 1956) chưa đọc được trực tiếp. Hướng đúng (rất ít sai) khớp.
