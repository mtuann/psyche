  luot_2: dung
  nguon:
  - https://archive.org/details/solomon-asch_confirmaty
  trich: Seventy-five per cent of experimental subjects agree with the majority in varying degrees.
  ghi_chu: Chú thích ảnh Scientific American 1955.
