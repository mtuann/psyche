  trich: "I shall term this the agentic state, by which I mean the condition a person is in when he sees himself as an agent for carrying out another person's wishes."
  ghi_chu: "Milgram 1974, chương \"The Agentic Shift\"; cùng sách: \"he therefore no longer regards himself as responsible for his actions\"."
