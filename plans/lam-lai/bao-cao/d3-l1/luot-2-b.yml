  id: n5
  luot_2: dung
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf"]
  trich: "The victim was played by a 47-year-old accountant, trained for the role; he was of Irish-American stock, whom most observers found mild-mannered and likable."
  ghi_chu: "tr. 373; học trò bị trói ghế ở \"an adjacent room\"."
- trang: thi-nghiem/milgram
  id: n6
  luot_2: khong-chac
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf"]
  trich: "When the 300-volt shock is administered, the learner pounds on the wall ... The experimenter instructs the subject to treat the absence of a response as a wrong answer"
  ghi_chu: "Phần đầu đúng (tr. 374). Bài không nói người thí nghiệm dùng đúng câu \"Thí nghiệm yêu cầu anh tiếp tục\" (Prod 2) ở 300V: ở đó ông bảo coi im lặng là trả lời sai; các câu thúc ép dùng khi người tham gia ngần ngại, bắt đầu từ Prod 1 \"Xin hãy tiếp tục\". Nên viết: \"người thí nghiệm bảo coi im lặng là sai và, nếu người tham gia ngần ngại, thúc ép họ tiếp tục\"."
- trang: thi-nghiem/milgram
  id: n7
  luot_2: dung
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf"]
  trich: "He was dressed in a gray technician's coat."
  ghi_chu: "tr. 373."
- trang: thi-nghiem/milgram
  id: n8
  luot_2: dung
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf"]
  trich: "The role of experimenter was played by a 31-year-old high school teacher of biology."
  ghi_chu: "tr. 373: giáo viên sinh học trung học."
- trang: thi-nghiem/milgram
  id: n9
  luot_2: dung
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf"]
  trich: "Fourteen Yale seniors, all psychology majors ... (The estimates ranged from 0 to 3%; ...) The class mean was 1.2%."
  ghi_chu: "tr. 375."
- trang: thi-nghiem/milgram
  id: n10
  luot_2: dung
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf"]
  trich: "the most general feeling was that few if any subjects would go beyond the designation Very Strong Shock."
  ghi_chu: "tr. 375."
- trang: thi-nghiem/milgram
  id: n11
  luot_2: dung
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf"]
  trich: "The obtained distribution of scores deviates radically from the prediction."
  ghi_chu: "tr. 375; tr. 376–377 nói cả người quan sát qua gương một chiều cũng đánh giá thấp mức vâng lời."
- trang: thi-nghiem/milgram
  id: n12
  luot_2: dung
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf"]
  trich: "30 lever switches ... ranges from 15 to 450 volts. There is a 15-volt increment from one switch to the next"
  ghi_chu: "tr. 373."
- trang: thi-nghiem/milgram
  id: n13
  luot_2: dung
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf"]
  trich: "Slight Shock, Moderate Shock, Strong Shock, Very Strong Shock, Intense Shock, Extreme Intensity Shock, Danger: Severe Shock. (Two switches after this last designation are simply marked XXX.)"
  ghi_chu: "tr. 373; tr. 376: \"The maximum shock is labeled 450 volts, and is two steps beyond the designation: Danger: Severe Shock.\""
- trang: thi-nghiem/milgram
  id: n14
  luot_2: dung
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf"]
  trich: "Subjects were observed to sweat, tremble, stutter, bite their lips ... Full-blown, uncontrollable seizures were observed for 3 subjects."
  ghi_chu: "tr. 375. \"Seizures\" ở đây là cơn cười không kiềm được (một ca co giật dữ dội đến mức phải dừng buổi thử). Người vâng lời \"often did so under extreme stress\" (tr. 376)."
- trang: thi-nghiem/milgram
  id: n15
  luot_2: dung
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf", "https://api.openalex.org/works/doi:10.1111/bjso.12074"]
  trich: "Although obedient subjects continued to administer shocks, they often did so under extreme stress."
  ghi_chu: "Milgram 1963 tr. 376; tranh cãi về cách giải thích: Haslam, Reicher và cộng sự 2014 (tóm tắt) cho rằng mô hình trạng thái ủy nhiệm của Milgram không khớp tư liệu."
- trang: thi-nghiem/milgram
  id: n16
  luot_2: dung
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf"]
  trich: "The subjects were 40 males between the ages of 20 and 50 ... obtained by a newspaper advertisement and direct mail solicitation. A wide range of occupations"
  ghi_chu: "tr. 372."
- trang: thi-nghiem/milgram
  id: n17
  luot_2: dung
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf"]
  trich: "They were paid $4.50 ... the money was theirs no matter what happened after they arrived."
  ghi_chu: "tr. 372."
- trang: thi-nghiem/milgram
  id: n18
  luot_2: dung
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf", "https://archive.org/details/ObedienceToAuthority_368"]
  trich: "The victim was played by a 47-year-old accountant, trained for the role"
  ghi_chu: "Milgram 1963 tr. 373. Ghi chú: trong buổi thử học trò được giới thiệu với tên \"Mr. Wallace\" (Milgram 1974, bản ghi các buổi thử); người đóng là James McDonough, kế toán viên. Câu trong ngoặc đúng nếu hiểu là \"không phải diễn viên chuyên nghiệp\"."
- trang: thi-nghiem/milgram
  id: n19
  luot_2: dung
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf"]
  trich: "no vocal response or other sign of protest is heard from the learner until Shock Level 300 ... The learner's pounding is repeated after the 315-volt shock is administered; afterwards he is not heard from"
  ghi_chu: "tr. 374; câu trả lời định trước, khoảng ba sai một đúng."
- trang: thi-nghiem/milgram
  id: n20
  luot_2: dung
  nguon: ["https://ethics.moe.edu.tw/files/resource/teach/%E6%95%99%E5%AD%B8%E8%A7%80%E6%91%A9/104-01/B008/%E7%89%B9%E8%89%B2%E8%AA%B2%E7%A8%8B%E4%BA%8C/(d)Replicating%20Milgram.pdf", "https://archive.org/details/ObedienceToAuthority_368"]
  trich: "Following the administration of the 150-volt punishment, the participant heard the learner's cries of protest through the wall."
  ghi_chu: "Burger 2009 tr. 2. Milgram 1974: ở các điều kiện có phản hồi bằng giọng, học trò rên từ 75V, kêu đau ở 120V, và lần đầu đòi ra ở 150V (\"Experimenter, get me out of here! ... I refuse to go on!\"). Đúng nếu \"kêu phản đối\" hiểu là đòi dừng."
- trang: thi-nghiem/milgram
  id: n21
  luot_2: dung
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf"]
  trich: "Prod 1: Please continue, or Please go on. Prod 2: The experiment requires that you continue. Prod 3: It is absolutely essential that you continue. Prod 4: You have no other choice, you must go on. The prods were always made in sequence"
  ghi_chu: "tr. 374."
- trang: thi-nghiem/milgram
  id: n22
  luot_2: dung
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf"]
  trich: "Although the shocks may be painful, there is no permanent tissue damage, so please go on. ... Whether the learner likes it or not, you must go on until he has learned all the word pairs correctly."
  ghi_chu: "tr. 374 (\"Special prods\")."
- trang: thi-nghiem/milgram
  id: n23
  luot_2: dung
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf"]
  trich: "Of the 40 subjects, 5 refused to obey ... beyond the 300-volt level. Four more subjects administered one further shock ... Two broke off at the 330-volt level, and 1 each at 345, 360, and 375 volts. Thus a total of 14 subjects defied"
  ghi_chu: "tr. 375 và Bảng 2."
- trang: thi-nghiem/milgram
  id: n24
  luot_2: dung
  nguon: ["https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf"]
  trich: "each of the 40 subjects went beyond the expected breakoff point. No subject stopped prior to administering Shock Level 20. (At this level—300 volts—the victim kicks on the wall and no longer provides answers"
  ghi_chu: "tr. 375."
- trang: thi-nghiem/milgram
  id: n25
  luot_2: dung
  nguon: ["https://ethics.moe.edu.tw/files/resource/teach/%E6%95%99%E5%AD%B8%E8%A7%80%E6%91%A9/104-01/B008/%E7%89%B9%E8%89%B2%E8%AA%B2%E7%A8%8B%E4%BA%8C/(d)Replicating%20Milgram.pdf", "https://doi.org/10.1037/a0010932"]
  trich: "Seventy adults participated in a replication of Milgram's Experiment 5 up to the point at which they first heard the learner's verbal protest (150 volts). ... only slightly lower than those Milgram found 45 years earlier."
  ghi_chu: "Burger 2009, toàn văn, tóm tắt."
- trang: thi-nghiem/milgram
  id: n26
  luot_2: dung
  nguon: ["https://ethics.moe.edu.tw/files/resource/teach/%E6%95%99%E5%AD%B8%E8%A7%80%E6%91%A9/104-01/B008/%E7%89%B9%E8%89%B2%E8%AA%B2%E7%A8%8B%E4%BA%8C/(d)Replicating%20Milgram.pdf"]
  trich: "79% of the people who continued past 150 volts (26 of 33) went all the way to the end of the shock generator's range."
  ghi_chu: "Burger 2009 tr. 2, tính trên số liệu Thí nghiệm 5 của Milgram."
- trang: thi-nghiem/milgram
  id: n27
  luot_2: dung
  nguon: ["https://ethics.moe.edu.tw/files/resource/teach/%E6%95%99%E5%AD%B8%E8%A7%80%E6%91%A9/104-01/B008/%E7%89%B9%E8%89%B2%E8%AA%B2%E7%A8%8B%E4%BA%8C/(d)Replicating%20Milgram.pdf"]
  trich: "a final sample of 29 men and 41 women ... Participants were randomly assigned to one of two conditions"
  ghi_chu: "Burger 2009 tr. 4–5; phép so điều kiện cơ sở với Milgram có N = 80 (40 + 40), điều kiện có mẫu từ chối 30 người."
- trang: thi-nghiem/milgram
  id: n28
  luot_2: dung
  nguon: ["https://ethics.moe.edu.tw/files/resource/teach/%E6%95%99%E5%AD%B8%E8%A7%80%E6%91%A9/104-01/B008/%E7%89%B9%E8%89%B2%E8%AA%B2%E7%A8%8B%E4%BA%8C/(d)Replicating%20Milgram.pdf"]
  trich: "70% of the base condition participants continued ... slightly lower than the percentage who continued beyond this point in Milgram's comparable condition (82.5%), although the difference fell short of statistical significance, χ2(1, N = 80) = 1.10, p = .29."
  ghi_chu: "Burger 2009 tr. 7."
- trang: thi-nghiem/milgram
  id: n29
  luot_2: dung
  nguon: ["https://ethics.moe.edu.tw/files/resource/teach/%E6%95%99%E5%AD%B8%E8%A7%80%E6%91%A9/104-01/B008/%E7%89%B9%E8%89%B2%E8%AA%B2%E7%A8%8B%E4%BA%8C/(d)Replicating%20Milgram.pdf"]
  trich: "the percentage of participants in the modeled refusal condition who continued past the 150-volt point (63.3%) also was not significantly different from the percentage who did so in the base condition"
  ghi_chu: "Burger 2009 tr. 7."
- trang: thi-nghiem/milgram
  id: n30
  luot_2: dung
  nguon: ["https://ethics.moe.edu.tw/files/resource/teach/%E6%95%99%E5%AD%B8%E8%A7%80%E6%91%A9/104-01/B008/%E7%89%B9%E8%89%B2%E8%AA%B2%E7%A8%8B%E4%BA%8C/(d)Replicating%20Milgram.pdf"]
  trich: "Men and women did not differ in their rates of obedience"
  ghi_chu: "Burger 2009, tóm tắt và tr. 7–8 (khác biệt không có ý nghĩa ở cả hai điều kiện)."
- trang: thi-nghiem/milgram
  id: n31
  luot_2: dung
  nguon: ["https://ethics.moe.edu.tw/files/resource/teach/%E6%95%99%E5%AD%B8%E8%A7%80%E6%91%A9/104-01/B008/%E7%89%B9%E8%89%B2%E8%AA%B2%E7%A8%8B%E4%BA%8C/(d)Replicating%20Milgram.pdf", "https://api.openalex.org/works/doi:10.1177/1948550617693060"]
  trich: "While ethical considerations prevent a full replication of the experiments from being prepared"
  ghi_chu: "Doliński và cộng sự 2017 (tóm tắt); Burger 2009 cũng dừng ở 150V vì lý do đạo đức. Phần mở đầu \"Hiệu ứng 'mù quáng' ngày nay\" chỉ là tiêu đề."
- trang: thi-nghiem/milgram
  id: n32
  luot_2: sai
  nguon: ["https://api.openalex.org/works/doi:10.1177/1948550617693060", "https://www.spsp.org/news-center/press-releases/milgram-poland-obey"]
  trich: "The researchers recruited 80 participants (40 men and 40 women), with an age range from 18 to 69 ... Participants had up to 10 buttons to press ... 90% of the people were willing to go to the highest level"
  cau_dung: "Doliński và cộng sự (2017) ở Ba Lan: 80 người (40 nam, 40 nữ, tuổi 18–69), 10 nút, cường độ giảm nhẹ vì lý do đạo đức; 90% bấm đến nút cao nhất."
  ghi_chu: "Số liệu đúng (thông cáo của SPSP, hội xuất bản tạp chí; tóm tắt xác nhận mức vâng lời \"similarly high\"; chưa đọc được toàn văn, bài đóng). Sai ở tên tác giả: bài có bảy tác giả (Doliński, Grzyb, Folwarczny, Grzybała, Krzyszycha, Martynowska, Trojanowski), nên phải là \"Doliński và cộng sự (2017)\". Cùng lỗi ở n33, n34, n52."
- trang: thi-nghiem/milgram
  id: n33
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1177/1948550617693060"]
  trich: "The results achieved show a level of participants' obedience toward instructions similarly high to that of the original Milgram studies."
  ghi_chu: "Tóm tắt (toàn văn đóng). Vế \"không so sánh trực tiếp được từng con số\" là suy luận hợp lý từ thiết kế 10 nút kiểu Burger. Tên tác giả: xem n32."
- trang: thi-nghiem/milgram
  id: n34
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1177/1948550617693060", "https://www.spsp.org/news-center/press-releases/milgram-poland-obey"]
  trich: "the small sample size does not allow us to draw strong conclusions"
  ghi_chu: "Thông cáo SPSP trích lời tác giả; tóm tắt: kết quả về giới \"do not allow us to unequivocally accept or reject the hypotheses\". Tên tác giả: xem n32."
- trang: thi-nghiem/milgram
  id: n35
  luot_2: dung
  nguon: ["https://journals.plos.org/plosone/article/file?id=10.1371/journal.pone.0093927&type=printable", "https://ethics.moe.edu.tw/files/resource/teach/%E6%95%99%E5%AD%B8%E8%A7%80%E6%91%A9/104-01/B008/%E7%89%B9%E8%89%B2%E8%AA%B2%E7%A8%8B%E4%BA%8C/(d)Replicating%20Milgram.pdf", "https://api.openalex.org/works/doi:10.1177/1948550617693060"]
  trich: "We assembled data from the 21 conditions (N = 740) in which obedience involved progression to maximum voltage (overall rate 43.6%)"
  ghi_chu: "Nhãn Khá vững hợp thước đo: nhiều nghiên cứu cùng chiều (các biến thể của Milgram, Burger 2009, Doliński và cộng sự 2017) nhưng chưa có tái lập lớn đăng ký trước, mẫu nhỏ, mức vâng lời khác nhau nhiều theo biến thể. Không cao hơn thước đo."
- trang: thi-nghiem/milgram
  id: n36
  luot_2: dung
  nguon: ["https://journals.plos.org/plosone/article/file?id=10.1371/journal.pone.0093927&type=printable"]
  trich: "We assembled data from the 21 conditions (N = 740) in which obedience involved progression to maximum voltage (overall rate 43.6%)"
  ghi_chu: "Haslam, Loughnan và Perry 2014, tóm tắt và tr. 3 (323/740)."
- trang: thi-nghiem/milgram
  id: n37
  luot_2: dung
  nguon: ["https://journals.plos.org/plosone/article/file?id=10.1371/journal.pone.0093927&type=printable"]
  trich: "Milgram's famous experiment contained 23 small-sample conditions"
  ghi_chu: "Haslam, Loughnan và Perry 2014; điều kiện 21 (dự đoán của chuyên gia) không tính vì không phải thí nghiệm."
- trang: thi-nghiem/milgram
  id: n38
  luot_2: dung
  nguon: ["https://ethics.moe.edu.tw/files/resource/teach/%E6%95%99%E5%AD%B8%E8%A7%80%E6%91%A9/104-01/B008/%E7%89%B9%E8%89%B2%E8%AA%B2%E7%A8%8B%E4%BA%8C/(d)Replicating%20Milgram.pdf", "https://api.openalex.org/works/doi:10.1111/j.1745-6924.2008.00080.x"]
  trich: "In all studies, disobedience was most likely at 150 v, the point at which the shocked \"learner\" first requested to be released."
  ghi_chu: "Packer 2008 (phân tích tổng hợp 8 thí nghiệm của Milgram, tóm tắt); Burger 2009: \"the 150-volt switch is something of a point of no return\". Khá vững hợp thước đo: cùng chiều nhưng chỉ dựa trên dữ liệu của chính Milgram."
- trang: thi-nghiem/milgram
  id: n39
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1177/1745691612448482", "https://api.openalex.org/works/doi:10.1111/bjso.12074", "https://api.openalex.org/works/doi:10.1177/0190272519861952"]
  trich: "This analysis is inconsistent with Milgram's own agentic state model."
  ghi_chu: "Đang tranh cãi hợp thước đo: các cách giải thích (trạng thái ủy nhiệm, đồng nhất xã hội, hoài nghi màn kịch) dựa trên tư liệu khác nhau và chưa ngã ngũ."
- trang: thi-nghiem/milgram
  id: n40
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1177/0190272519861952"]
  trich: "in 18 of 23 variations of the experiment, the mean levels of shock for those who fully believed that they were inflicting pain were lower than for subjects who did not fully believe"
  ghi_chu: "Perry, Brannigan, Wanner và Stam (Social Psychology Quarterly, bản trực tuyến 2019, số in 2020), tóm tắt."
- trang: thi-nghiem/milgram
  id: n41
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1111/bjso.12074", "https://api.openalex.org/works/doi:10.1177/1745691612448482"]
  trich: "Such evidence accords with an engaged followership model in which (1) willingness to perform unpleasant tasks is contingent upon identification with collective goals"
  ghi_chu: "Haslam, Reicher, Millard và McDonald 2014 (tóm tắt); Reicher, Haslam và Smith 2012: \"identification with either the experimenter and the scientific community that he represents\"."
- trang: thi-nghiem/milgram
  id: n42
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1177/1745691612448482", "https://api.openalex.org/works/doi:10.1111/bjso.12074", "https://api.openalex.org/works/doi:10.1177/0190272519861952"]
  trich: "This reinterpretation also encourages us to see Milgram's studies not as demonstrations of conformity or obedience"
  ghi_chu: "Có nhiều cách giải thích đối lập, dữ liệu lưu trữ chưa phân xử được: nhãn chưa ngã ngũ hợp thước đo."
- trang: thi-nghiem/milgram
