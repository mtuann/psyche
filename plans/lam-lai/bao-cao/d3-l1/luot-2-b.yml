  trich: "48 percent of the Bridgeport subjects delivered the maximum shock versus 65 percent in the corresponding condition at Yale"
  cau_dung: "Khi chuyển ra văn phòng xập xệ ở Bridgeport, tỉ lệ vâng lời là 47,5%, so với 65% ở điều kiện tương ứng tại Yale (Milgram, 1974)."
  ghi_chu: "Milgram 1974 (chương Thí nghiệm 10, bảng: Bridgeport 47,5%) so với 65% ở điều kiện tương ứng tại Yale. Haslam, Loughnan và Perry 2014 cũng ghi Bridgeport \"like condition 5\" (26/40 = 65%); con số 62,5% (điều kiện 2) chỉ là cách sách giáo khoa hay so (\"usually contrasted with the 62.5% rate\"). Milgram nói mức giảm không có ý nghĩa thống kê."
