  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf"]
  trich: "the archives of the SPE in the Stanford University Library (donated by Zimbardo in 2011) ... semistructured phone interviews were conducted between May 2017 and December 2017 with 15 participants"
  ghi_chu: "Le Texier 2019, mục Method (46 năm sau)."
- trang: thi-nghiem/zimbardo
  id: n16
  luot_2: dung
  nguon: ["https://www.ojp.gov/pdffiles1/Photocopy/10301NCJRS.pdf"]
  trich: "the \"Superintendent\" of the prison (the author)"
  ghi_chu: "mục Role Instructions."
- trang: thi-nghiem/zimbardo
  id: n17
  luot_2: sai
  nguon: ["http://web.archive.org/web/20150403202719/http://www.prisonexp.org/pdf/blass.pdf", "https://www.gwern.net/doc/psychology/2019-letexier.pdf"]
  trich: "the situation was radically changed on the second day, when several prisoners led all the others in a rebellion"
  cau_dung: "Ngay ngày thứ hai, tù nhân nổi loạn; cai tù trả đũa bằng quấy rối leo thang."
  ghi_chu: "Zimbardo, Maslach và Haney 1999; Le Texier 2019: \"After the rebellion on the second day\". Cuộc nổi loạn ở ngày thứ hai, không phải sau 2 ngày. Vế cai tù trả đũa đúng."
- trang: thi-nghiem/zimbardo
  id: n18
  luot_2: qua-manh
  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf", "https://www.ojp.gov/pdffiles1/Photocopy/10301NCJRS.pdf", "https://api.openalex.org/works/doi:10.1037/amp0000593"]
  trich: "the fact that the guards received precise instructions regarding the treatment of the prisoners"
  cau_dung: "Theo Le Texier (2019), dựa trên hồ sơ lưu trữ, trong buổi định hướng cai tù đã nhận hướng dẫn cụ thể về cách đối xử với tù nhân, trái với báo cáo gốc nói họ chỉ được hướng dẫn tối thiểu."
  ghi_chu: "Đây là kết luận của Le Texier 2019 (và Haslam, Reicher, Van Bavel 2019) từ hồ sơ lưu trữ; báo cáo gốc viết cai tù \"were intentionally given only minimal guidelines\", và Zimbardo (2018, Le Texier dẫn) vẫn nói không có \"formal or detailed instructions\"; Zimbardo và Haney 2020 bác các phê bình. Viết như sự thật không ghi nguồn là mạnh hơn bằng chứng; nên ghi rõ là theo hồ sơ lưu trữ và Le Texier."
- trang: thi-nghiem/zimbardo
  id: n19
  luot_2: dung
  nguon: ["https://www.ojp.gov/pdffiles1/Photocopy/10301NCJRS.pdf"]
  trich: "five prisoners who had to be released because of extreme emotional depression, crying, rage and acute anxiety ... The fifth subject was released after being treated for a psychosomatic rash"
  ghi_chu: "mục Results, Overview."
- trang: thi-nghiem/zimbardo
  id: n20
  luot_2: sai
  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf"]
  trich: "Out of the 11 prisoners, it looks like only two really exhibited symptoms of a nervous breakdown."
  cau_dung: "Theo Le Texier (2019), chỉ khoảng hai trong 11 tù nhân thật sự có triệu chứng suy sụp thần kinh; nói \"một nửa suy sụp phải cho ra sớm\" là cường điệu."
  ghi_chu: "Le Texier 2019 tr. 10 viết \"hai trong 11 tù nhân\" (ông tính cả tù nhân thay thế), không phải 10. Vế \"cường điệu\" đúng: \"it is exaggerated to assert about the prisoners that 'half of them became so psychologically disturbed they had to be released prematurely'\"."
- trang: thi-nghiem/zimbardo
  id: n21
  luot_2: dung
  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf"]
  trich: "Several archival evidences confirm, on the contrary, that the student who was Prisoner 8612-1 planned to act mad to be released"
  ghi_chu: "Le Texier 2019 tr. 10 (băng ghi âm ngày dừng thí nghiệm). Le Texier không nêu tên; tên Douglas Korpi của tù nhân 8612 chỉ có ở nguồn bậc 3 (bài báo của Ben Blum 2018). \"Tính trước\": anh ta lên kế hoạch sau khi xin ra bị từ chối."
- trang: thi-nghiem/zimbardo
  id: n22
  luot_2: dung
  nguon: ["https://www.ojp.gov/pdffiles1/Photocopy/10301NCJRS.pdf"]
  trich: "a solitary fellow prisoner who coped with his situation by refusing to eat"
  ghi_chu: "mục The Pathological Prisoner Syndrome."
- trang: thi-nghiem/zimbardo
  id: n23
  luot_2: dung
  nguon: ["http://web.archive.org/web/20150403202719/http://www.prisonexp.org/pdf/blass.pdf"]
  trich: "he owned up to his responsibility as creator of this prison and made the decision to call the experiment to a halt. By then it was well past midnight, so he decided to end it the next morning"
  ghi_chu: "Phần do Christina Maslach viết trong Zimbardo, Maslach và Haney 1999. Dừng sau 6 ngày: báo cáo gốc."
- trang: thi-nghiem/zimbardo
  id: n24
  luot_2: dung
  nguon: ["https://www.ojp.gov/pdffiles1/Photocopy/10301NCJRS.pdf"]
  trich: "At least a third of the guards were judged to have become far more aggressive and dehumanizing toward the prisoners than would ordinarily be predicted ... Only a very few of the observed reactions ... could be attributed to personality trait differences"
  ghi_chu: "Tóm tắt của báo cáo gốc."
- trang: thi-nghiem/zimbardo
  id: n25
  luot_2: khong-chac
  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf", "https://laviedesidees.fr/_Le-Texier-Thibault_"]
  trich: "Data collected from a thorough investigation of the SPE archives and interviews with 15 of the participants"
  ghi_chu: "Phần lưu trữ và 15 người phỏng vấn đúng (Le Texier 2019). Chưa xác nhận \"nhà xã hội học\": La Vie des Idées giới thiệu ông là \"docteur en économie\"; bài 2019 ghi Université de Nice Sophia Antipolis (GREDEG). Gợi ý: \"nhà nghiên cứu Pháp\"."
- trang: thi-nghiem/zimbardo
  id: n26
  luot_2: dung
  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf"]
  trich: "the toughest guard, nicknamed \"John Wayne\" by the prisoners ... (D. Eshleman, Personal communication ...) ... [T]hroughout the entire experiment I was an actor, and I was hamming it up."
  ghi_chu: "Le Texier 2019 tr. 8 (lời Guard 4 lúc giải thích cuối thí nghiệm, và phỏng vấn 2017)."
- trang: thi-nghiem/zimbardo
  id: n28
  luot_2: dung
  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf"]
  trich: "Of the 150 hr of the experiment ... less than 15% have been recorded ... our video sample was seriously biased at the outset"
  ghi_chu: "Le Texier 2019 tr. 12 (trích báo cáo của Haney); báo cáo gốc cũng nhận \"possible errors due to selective sampling\"."
- trang: thi-nghiem/zimbardo
  id: n29
  luot_2: dung
  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf"]
  trich: "the SPE grew out of a student experiment that took place in a Stanford University dormitory in May 1971 under the direction of one of Zimbardo's undergraduate students"
  ghi_chu: "Le Texier 2019 tr. 3–4 (thí nghiệm Toyon Hall, 3 tháng trước)."
- trang: thi-nghiem/zimbardo
  id: n30
  luot_2: dung
  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf"]
  trich: "expose the SPE for what it was: an incredibly flawed study that should have died an early death"
  ghi_chu: "Le Texier 2019, kết luận và tóm tắt (\"further question the study's scientific merit\")."
- trang: thi-nghiem/zimbardo
  id: n31
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1348/014466605X48998", "http://web.archive.org/web/20081004225000/http://www.bbcprisonstudy.org:80/bbc-prison-study.php?p=21"]
  trich: "After this exhaustive process, we ended up with 15 decent men."
  ghi_chu: "8 ngày: tóm tắt Reicher và Haslam 2006 (\"over a period of 8 days\"); 15 người: trang chính thức của BBC Prison Study (Reicher và Haslam, bản lưu 2008). Trang ấy ghi \"9 days that the study lasted\"; bài báo ghi 8 ngày."
- trang: thi-nghiem/zimbardo
  id: n32
  luot_2: dung
  nguon: ["http://web.archive.org/web/20081004225000/http://www.bbcprisonstudy.org:80/bbc-prison-study.php?p=26", "http://web.archive.org/web/20081004225000/http://www.bbcprisonstudy.org:80/bbc-prison-study.php?p=27", "https://bps.org.uk/psychologist/tyranny-revisited-groups-psychological-well-being-and-health-societies"]
  trich: "there were two independent clinical psychologists who were present or on call 24 hours a day ... the study was constantly monitored by members of a five-person independent ethics panel"
  ghi_chu: "Trang chính thức của BBC Prison Study: hội đồng đạo đức của trường duyệt ngày 17/9/2001; Reicher và Haslam 2006 trên The Psychologist: \"overseen by clinical psychologists and an independent ethics committee chaired by an MP\"."
- trang: thi-nghiem/zimbardo
  id: n33
  luot_2: khong-chac
  nguon: ["http://web.archive.org/web/20081004225000/http://www.bbcprisonstudy.org:80/bbc-prison-study.php?p=24", "https://bps.org.uk/psychologist/tyranny-revisited-groups-psychological-well-being-and-health-societies"]
  trich: "We told them that their task was to make the prison work, but that it was up to them to decide how best that might be done. Within certain limits, set largely for ethical reasons"
  ghi_chu: "Vế không hướng dẫn cách hành xử thì xác nhận được (The Psychologist: \"we did not act as prison superintendents who instructed the guards how to act\"). Chưa đọc được toàn văn BJSP 2006 nên chưa xác nhận các giới hạn cụ thể (cấm bạo lực thể xác, quyền cơ bản của tù nhân); chỉ nguồn bậc 3 nói cấm bạo lực."
- trang: thi-nghiem/zimbardo
  id: n34
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1348/014466605X48998"]
  trich: "Unlike the prisoners, the guards failed to identify with their role. This made the guards reluctant to impose their authority and they were eventually overcome by the prisoners."
  ghi_chu: "Reicher và Haslam 2006, tóm tắt."
- trang: thi-nghiem/zimbardo
  id: n35
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1348/014466605X48998", "https://journals.plos.org/plosbiology/article/file?id=10.1371/journal.pbio.1001426&type=printable"]
  trich: "Participants then established an egalitarian social system. When this proved unsustainable, moves to impose a tyrannical regime met with weakening resistance."
  ghi_chu: "Tóm tắt; Haslam và Reicher 2012: \"Early in the study, the Prisoners' identification as a group allowed them successfully to challenge the authority of the Guards\"."
- trang: thi-nghiem/zimbardo
  id: n36
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1348/014466605X48998"]
  trich: "it is powerlessness and the failure of groups that makes tyranny psychologically acceptable"
  ghi_chu: "Reicher và Haslam 2006, tóm tắt; Haslam và Reicher 2012: \"participants did not conform automatically to their assigned role\"."
- trang: thi-nghiem/zimbardo
  id: n37
  luot_2: dung
  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf", "https://www.ojp.gov/pdffiles1/Photocopy/10301NCJRS.pdf", "https://api.openalex.org/works/doi:10.1037/amp0000593"]
  trich: "Data collected from a thorough investigation of the SPE archives and interviews with 15 of the participants in the experiment further question the study's scientific merit."
  ghi_chu: "Nội dung đúng: cả bên phê bình (Le Texier, Haslam và cộng sự) lẫn tác giả gốc đều xác nhận các sự kiện. Lưu ý cho review: thước đo mục 4 viết cho hiệu ứng (phân tích tổng hợp, tái lập); với sự kiện lịch sử, căn cứ là hồ sơ lưu trữ, phim, ghi âm và sự đồng thuận của hai phía. Cần ghi điều ấy ở co_so."
- trang: thi-nghiem/zimbardo
  id: n38
  luot_2: dung
  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf"]
  trich: "analyzing hundreds of paper documents, 6 hr of film recordings made during the experiment, and 48 hr of audio recordings"
  ghi_chu: "Le Texier 2019 tr. 3. Le Texier cũng nói chỉ dưới 15% thời gian được ghi lại."
- trang: thi-nghiem/zimbardo
  id: n39
  luot_2: dung
  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf", "http://web.archive.org/web/20150403202719/http://www.prisonexp.org/pdf/blass.pdf"]
  trich: "Whether he was pretending or not is controversial."
  ghi_chu: "Le Texier 2019 tr. 10 (Zimbardo 2018 phản bác Blum); Zimbardo, Maslach và Haney 1999 kể năm tù nhân được cho ra."
- trang: thi-nghiem/zimbardo
  id: n40
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1348/014466605X48998", "https://www.gwern.net/doc/psychology/2019-letexier.pdf", "https://research-repository.st-andrews.ac.uk/bitstream/10023/18565/1/Haslam_American_Psychologist_Cruelty_2019_AAM.pdf", "https://api.openalex.org/works/doi:10.1177/0146167206292689", "https://api.openalex.org/works/doi:10.1037/amp0000593"]
  trich: "rather than guards conforming to role of their own accord, experimenters directly encouraged them to adopt roles and act tough"
  ghi_chu: "Đang tranh cãi hợp thước đo: tư liệu lưu trữ và một thiết kế lại (BBC) mâu thuẫn với kết luận gốc, trong khi tác giả gốc vẫn bảo vệ (Zimbardo và Haney 2020)."
- trang: thi-nghiem/zimbardo
  id: n41
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1037/amp0000593"]
  trich: "the Stanford Prison Experiment endures as a classic, dramatic demonstration of the potentially destructive psychological dynamics that can be created when one group of people is given nearly total power over a group of derogated others in a powerful, dehumanizing environment"
  ghi_chu: "Zimbardo và Haney 2020, American Psychologist (tóm tắt), phản hồi Haslam và cộng sự 2019 và Le Texier 2019."
- trang: thi-nghiem/zimbardo
  id: n42
  luot_2: dung
  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf", "https://api.openalex.org/works/doi:10.1348/014466605X48998", "https://research-repository.st-andrews.ac.uk/bitstream/10023/18565/1/Haslam_American_Psychologist_Cruelty_2019_AAM.pdf"]
  trich: "we present comprehensive evidence that, rather than guards conforming to role of their own accord, experimenters directly encouraged them to adopt roles and act tough"
  ghi_chu: "Le Texier 2019 (hướng dẫn, diễn, dữ liệu chọn lọc); Reicher và Haslam 2006; Haslam, Reicher và Van Bavel 2019 (tóm tắt)."
- trang: thi-nghiem/zimbardo
  id: n43
  luot_2: dung
  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf", "https://research-repository.st-andrews.ac.uk/bitstream/10023/18565/1/Haslam_American_Psychologist_Cruelty_2019_AAM.pdf", "https://api.openalex.org/works/doi:10.1348/014466605X48998", "https://api.openalex.org/works/doi:10.1177/0146167206292689"]
  ghi_chu: "Các phân tích lưu trữ (Le Texier 2019; Haslam, Reicher, Van Bavel 2019), thiết kế lại (BBC 2006) và nghiên cứu tự chọn lọc (Carnahan và McFarland 2007) đều hoài nghi; phía bảo vệ chủ yếu là chính tác giả gốc (Zimbardo và Haney 2020). \"Phần lớn\" là đánh giá hợp lý, không có tổng quan hệ thống đếm."
- trang: thi-nghiem/zimbardo
  id: n44
  luot_2: dung
  nguon: ["https://www.ojp.gov/pdffiles1/Photocopy/10301NCJRS.pdf", "https://api.openalex.org/works/doi:10.1177/0146167206292689"]
  trich: "Volunteers for the prison study scored significantly higher on measures of the abuse-related dispositions"
  ghi_chu: "Mẫu gốc là nam sinh viên, \"largely of middle class socio-economic status and Caucasians\" (báo cáo gốc); thêm bằng chứng tự chọn lọc (Carnahan và McFarland 2007). Khá vững hợp thước đo: cùng chiều nhưng phần tự chọn lọc chỉ dựa trên một nghiên cứu chính."
- trang: thi-nghiem/zimbardo
  id: n45
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1177/0146167206292689"]
  trich: "Volunteers for the prison study scored significantly higher on measures of the abuse-related dispositions of aggressiveness, authoritarianism, Machiavellianism, narcissism, and social dominance and lower on empathy and altruism"
  ghi_chu: "Carnahan và McFarland 2007, tóm tắt."
- trang: thi-nghiem/zimbardo
  id: n46
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1177/0146167206292689"]
  trich: "Although implications for the SPE remain a matter of conjecture, an interpretation in terms of person-situation interactionism rather than a strict situationist account is indicated"
  ghi_chu: "Carnahan và McFarland 2007, tóm tắt."
- trang: thi-nghiem/zimbardo
  id: n47
  luot_2: dung
  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf", "https://www.ojp.gov/pdffiles1/Photocopy/10301NCJRS.pdf", "http://web.archive.org/web/20150403202719/http://www.prisonexp.org/pdf/blass.pdf"]
  trich: "Data collected from a thorough investigation of the SPE archives"
  ghi_chu: "Hồ sơ lưu trữ (giấy tờ, phim, ghi âm) xác nhận thí nghiệm đã diễn ra; không nguồn học thuật nào cho rằng nó bịa toàn bộ. Lưu ý cho review như n37: thước đo mục 4 không viết cho sự kiện lịch sử; nhãn hợp ý \"bằng chứng phản bác đủ mạnh\"."
- trang: thi-nghiem/zimbardo
  id: n48
  luot_2: dung
  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf", "https://research-repository.st-andrews.ac.uk/bitstream/10023/18565/1/Haslam_American_Psychologist_Cruelty_2019_AAM.pdf"]
  trich: "the presence of demand characteristics ... the biased and incomplete collection of data"
  ghi_chu: "Le Texier 2019 tóm tắt; các phê bình nhắm vào phương pháp và cách diễn giải."
- trang: thi-nghiem/zimbardo
  id: n49
  luot_2: dung
  nguon: ["https://www.ojp.gov/pdffiles1/Photocopy/10301NCJRS.pdf"]
  trich: "Only a very few of the observed reactions to this experience of imprisonment could be attributed to personality trait differences"
  ghi_chu: "Báo cáo gốc, tóm tắt; phần mở đầu đặt \"dispositional hypothesis\" đối lại sức mạnh của môi trường."
- trang: thi-nghiem/zimbardo
  id: n50
  luot_2: dung
  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf", "https://www.ojp.gov/pdffiles1/Photocopy/10301NCJRS.pdf"]
  trich: "the \"cues pointing to the experimental hypothesis, the experimenters' expectations, and possibly, the experimenters' ideological commitment\""
  ghi_chu: "Le Texier 2019 trích Banuazizi và Movahedi 1975; báo cáo gốc cũng nhận \"demand characteristics in the experiment obviously exerted some directing influence\". Khái niệm của Orne 1962."
- trang: thi-nghiem/zimbardo
  id: n51
  luot_2: dung
  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf"]
  trich: "I thought it would be better for the study if I presented what I thought to be a realistic relationship between guard and prisoner. [...] [T]hroughout the entire experiment I was an actor"
  ghi_chu: "Le Texier 2019 tr. 8."
- trang: thi-nghiem/zimbardo
  id: n52
  luot_2: dung
  nguon: ["https://research-repository.st-andrews.ac.uk/bitstream/10023/18565/1/Haslam_American_Psychologist_Cruelty_2019_AAM.pdf"]
  trich: "roles are unlikely to elicit cruelty unless leaders encourage potential perpetrators to identify with what is presented as a noble ingroup cause and to believe their actions are necessary ... experimenters directly encouraged them to adopt roles and act tough"
  ghi_chu: "Haslam, Reicher và Van Bavel 2019, tóm tắt (bản tác giả)."
- trang: thi-nghiem/zimbardo
  id: n53
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1177/0146167206292689"]
  trich: "The authors investigated whether students who selectively volunteer for a study of prison life possess dispositions associated with behaving abusively."
  ghi_chu: "Carnahan và McFarland 2007; câu dùng \"có thể\", đúng mức."
- trang: thi-nghiem/zimbardo
  id: n54
  luot_2: dung
  nguon: ["https://www.gwern.net/doc/psychology/2019-letexier.pdf", "https://www.ojp.gov/pdffiles1/Photocopy/10301NCJRS.pdf"]
  trich: "the guards were also following instructions and guidelines ... before he can no longer rightfully attribute his actions to \"playing a role\" and thereby abdicate responsibility"
  ghi_chu: "Le Texier 2019 tr. 7–8; chính báo cáo gốc cũng bàn việc viện cớ \"đóng vai\" để rũ trách nhiệm."
- trang: thi-nghiem/zimbardo
  id: n55
  luot_2: dung
  nguon: ["https://www.ojp.gov/pdffiles1/Photocopy/10301NCJRS.pdf", "https://research-repository.st-andrews.ac.uk/bitstream/10023/18565/1/Haslam_American_Psychologist_Cruelty_2019_AAM.pdf", "https://journals.plos.org/plosbiology/article/file?id=10.1371/journal.pbio.1001426&type=printable"]
  trich: "roles are unlikely to elicit cruelty unless leaders encourage potential perpetrators to identify with what is presented as a noble ingroup cause"
