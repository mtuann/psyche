  cau_dung: "Vẻ chính danh: trong thí nghiệm, khi chuyển khỏi Yale sang một văn phòng ở Bridgeport, tỉ lệ vâng lời đến nấc cuối thấp hơn (47,5% so với 65%), dù vẫn gần một nửa. Những cuộc gọi xưng danh công an hay ngân hàng cũng mượn vẻ chính danh; đó là phép so sánh của trang, thí nghiệm Milgram không nghiên cứu lừa đảo."
  ghi_chu: "Cùng lỗi với n46: Milgram so 47,5% với 65%, không phải 62,5%. Phần còn lại (phép so sánh với lừa đảo là của trang) không cần nguồn."
