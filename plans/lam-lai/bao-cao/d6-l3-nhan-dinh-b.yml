- trang: kham-pha/phat-trien/tuoi-gia
  id: n1
  cau: Nghiên cứu dọc Seattle cho thấy chưa có suy giảm trung bình đáng tin cậy trước 60 tuổi, và vốn từ vựng còn tăng đến khoảng thập niên 60 — nhưng sa sút trí tuệ là chuyện khác (mô tả của trang).
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n2
  cau: Quên một từ rồi tự nhớ lại (tình huống 1) chỉ đáng lo khi xảy ra thường xuyên và ảnh hưởng sinh hoạt; quên những việc vừa xảy ra và hỏi đi hỏi lại cùng một câu (tình huống 2) là các dấu hiệu NHS nêu cho sa sút trí tuệ, nên nói chuyện với bác sĩ (lời giải thích câu hỏi mở đầu).
  loai: lam-sang
- trang: kham-pha/phat-trien/tuoi-gia
  id: n3
  cau: Sa sút trí tuệ không phải hệ quả tất yếu của tuổi già (WHO).
  loai: lam-sang
- trang: kham-pha/phat-trien/tuoi-gia
  id: n4
  cau: Bài trả lời bằng dữ liệu của một nghiên cứu dọc về trí tuệ người lớn đã kéo dài hơn nửa thế kỷ (Seattle Longitudinal Study).
  loai: so-lieu
- trang: kham-pha/phat-trien/tuoi-gia
  id: n5
  cau: Lão hóa nhận thức bình thường gồm tốc độ xử lý chậm lại và khó làm hai việc cùng lúc hơn hồi trẻ (Salthouse, 1996).
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n6
  cau: "Sa sút trí tuệ là nhóm bệnh trong đó suy giảm nhận thức đủ nặng để cản trở cuộc sống hằng ngày: quên những việc vừa xảy ra, hỏi lặp lại, khó làm những việc từng làm thành thạo."
  loai: lam-sang
- trang: kham-pha/phat-trien/tuoi-gia
  id: n7
  cau: "Nhầm lẫn hai chuyện này có thể gây hai cái hại ngược nhau: chủ quan bỏ qua dấu hiệu cần được thăm khám, hoặc hoảng loạn vì một lần quên vặt."
  loai: loi-khuyen
- trang: kham-pha/phat-trien/tuoi-gia
  id: n8
  cau: Nếu bạn lo về trí nhớ của mình hay người thân, hãy nói chuyện với bác sĩ; xem thêm Hỗ trợ.
  loai: loi-khuyen
- trang: kham-pha/phat-trien/tuoi-gia
  id: n10
  cau: Seattle Longitudinal Study do K. Warner Schaie khởi xướng năm 1956.
  loai: lich-su
- trang: kham-pha/phat-trien/tuoi-gia
  id: n11
  cau: SLS có gần 6.000 người tham gia, đo lặp lại mỗi 7 năm.
  loai: so-lieu
- trang: kham-pha/phat-trien/tuoi-gia
  id: n12
  cau: "SLS đo năm năng lực trí tuệ cơ bản: hiểu nghĩa từ, định hướng không gian, suy luận quy nạp, tính toán số học, trôi chảy từ ngữ."
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n13
  cau: Nhìn chung, trước 60 tuổi chưa thấy suy giảm trung bình đáng tin cậy ở các năng lực SLS đo, nhưng đến 74 tuổi suy giảm đáng tin cậy xuất hiện ở mọi năng lực.
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n14
  cau: Các phân tích gần đây của nhóm Seattle thấy suy giảm nhỏ nhưng có ý nghĩa thống kê ở một số (không phải mọi) thế hệ từ thập niên 50 tuổi.
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n15
  cau: Ngay ở tuổi 81, chưa đến một nửa số người có suy giảm đáng tin cậy trong 7 năm trước đó.
  loai: so-lieu
- trang: kham-pha/phat-trien/tuoi-gia
  id: n16
  cau: Trong phân tích của Salthouse (2019) trên hơn 5.000 người, vốn từ vựng còn tăng đến khoảng thập niên 60 tuổi, trong khi tốc độ xử lý giảm gần như đều từ đầu tuổi trưởng thành và trí nhớ, suy luận giảm nhanh dần.
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n17
  cau: (Đã bỏ) Tốc độ tri giác và tính toán số học là những năng lực đi xuống sớm nhất trong SLS (Schaie, 2005).
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n18
  cau: "Schaie và Willis (2010) liệt kê các yếu tố gắn với ít suy giảm hơn ở tuổi già: không bệnh tim mạch và bệnh mạn tính, môi trường thuận lợi gắn với địa vị kinh tế–xã hội cao, đời sống trí óc phức tạp và nhiều kích thích, tính cách linh hoạt ở tuổi trung niên, bạn đời có năng lực nhận thức cao, giữ được tốc độ xử lý tri giác cao; đây là liên hệ quan sát."
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n19
  cau: Raymond Cattell đã đề xuất phân biệt trí tuệ lưu động và trí tuệ kết tinh từ thập niên 1940.
  loai: lich-su
- trang: kham-pha/phat-trien/tuoi-gia
  id: n20
  cau: Bài năm 1963 là một thí nghiệm kiểm tra phân biệt ấy, trên 277 học sinh lớp 7–8.
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n21
  cau: Trí tuệ lưu động (Gf) là khả năng giải quyết vấn đề mới, suy luận trừu tượng, xử lý nhanh — ít phụ thuộc vào kiến thức đã học.
  loai: dinh-nghia
- trang: kham-pha/phat-trien/tuoi-gia
  id: n22
  cau: Cattell dự đoán Gf đạt cực đại sớm (khoảng 14–15 tuổi) rồi giảm đều từ khoảng 22 tuổi; số liệu hiện đại cũng cho thấy các năng lực tốc độ giảm gần như đều từ đầu tuổi trưởng thành (Salthouse, 2019).
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n23
  cau: Trí tuệ kết tinh (Gc) là kiến thức, vốn từ, kỹ năng tích lũy qua học tập và kinh nghiệm.
  loai: dinh-nghia
- trang: kham-pha/phat-trien/tuoi-gia
  id: n24
  cau: Gc giảm muộn hơn và ít hơn Gf theo dự đoán của Cattell; ở vốn từ vựng, một chỉ báo của Gc, số liệu cho thấy còn tăng đến khoảng thập niên 60 tuổi (Salthouse, 2019).
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n25
  cau: Phân biệt Gf/Gc giúp hiểu vì sao tuổi già không phải là "kém thông minh đi" một cách đơn giản (ví dụ cụ 75 tuổi học điện thoại và dùng vốn sống trong nghề là ví dụ giả định).
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n26
  cau: "Hình Gf-Gc: Gf đạt đỉnh sớm ở tuổi trưởng thành rồi suy giảm dần."
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n27
  cau: "Hình Gf-Gc: Gc tăng suốt tuổi trung niên và giữ vững đến tuổi già."
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n28
  cau: "Hiệu ứng tích cực theo tuổi (positivity effect): so với người trẻ, người lớn tuổi chú ý và nhớ thông tin tích cực nhiều hơn tiêu cực."
  loai: dinh-nghia
- trang: kham-pha/phat-trien/tuoi-gia
  id: n29
  cau: Trong hai nghiên cứu của Charles, Mather và Carstensen (2003), người trẻ, trung niên và lớn tuổi xem ảnh tích cực, tiêu cực, trung tính rồi làm bài nhớ lại và nhận diện.
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n30
  cau: So với ảnh tích cực và trung tính, số ảnh tiêu cực được nhớ giảm dần qua từng nhóm tuổi lớn hơn; ở nghiên cứu thứ hai, khác biệt tuổi tác lớn nhất nằm ở ảnh tiêu cực.
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n31
  cau: (Đã bỏ) Nghiên cứu thứ hai có 64 người (19–30 so với 63–86 tuổi) và loại trừ khả năng kết quả chỉ do tâm trạng lúc làm bài.
  loai: so-lieu
- trang: kham-pha/phat-trien/tuoi-gia
  id: n32
  cau: "Phân tích tổng hợp của Reed, Chan và Mikels (2014): 100 nghiên cứu với 7.129 người; hiệu ứng tích cực là đáng tin cậy."
  loai: so-lieu
- trang: kham-pha/phat-trien/tuoi-gia
  id: n33
  cau: Hiệu ứng lớn hơn trong các nghiên cứu không ràng buộc quá trình xử lý thông tin và trong các nghiên cứu so sánh các nhóm tuổi cách xa nhau hơn.
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n34
  cau: "Người trẻ có xu hướng ngược lại: thiên về thông tin tiêu cực hơn tích cực."
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n35
  cau: "Lý thuyết chọn lọc cảm xúc–xã hội (Carstensen): khi thời gian còn lại được nhận thức là hữu hạn, con người ưu tiên các mục tiêu điều chỉnh cảm xúc hơn các mục tiêu thu thập kiến thức."
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n36
  cau: Theo lý thuyết, hiệu ứng tích cực là hệ quả của sự chuyển hướng động cơ ấy, không phải dấu hiệu "lẫn".
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n37
  cau: "Cột trái bảng: tốc độ xử lý chậm dần và làm nhiều việc cùng lúc khó hơn là thay đổi thông thường theo tuổi."
  loai: lam-sang
- trang: kham-pha/phat-trien/tuoi-gia
  id: n38
  cau: Học cái mới mất nhiều thời gian hơn nhưng vẫn học được.
  loai: lam-sang
- trang: kham-pha/phat-trien/tuoi-gia
  id: n39
  cau: "Cột phải bảng: thường xuyên quên những việc vừa xảy ra, tên và gương mặt; hỏi lặp lại cùng một câu."
  loai: lam-sang
- trang: kham-pha/phat-trien/tuoi-gia
  id: n40
  cau: "Cột phải bảng: thấy khó làm những việc quen thuộc hằng ngày; khó theo dõi cuộc trò chuyện hay tìm từ; nhầm lẫn về thời gian và nơi chốn."
  loai: lam-sang
- trang: kham-pha/phat-trien/tuoi-gia
  id: n41
  cau: Điểm chung của các mô tả y tế là sa sút trí tuệ ảnh hưởng đến sinh hoạt hằng ngày, còn thay đổi thông thường thì không; chúng tôi không có nguồn cho một ranh giới cứng giữa hai cột.
  loai: lam-sang
- trang: kham-pha/phat-trien/tuoi-gia
  id: n42
  cau: Chỉ bác sĩ sau khi thăm khám mới kết luận được; thông tin trong mục này chỉ là giáo dục chung, không phải chẩn đoán.
  loai: lam-sang
- trang: kham-pha/phat-trien/tuoi-gia
  id: n43
  cau: 'Nhãn "Khá vững": vốn từ vựng còn tăng đến khoảng thập niên 60; tốc độ xử lý và suy luận với vấn đề mới suy giảm sớm hơn.'
  loai: nhan
- trang: kham-pha/phat-trien/tuoi-gia
  id: n44
  cau: 'Nhãn "Khá vững": hiệu ứng tích cực theo tuổi là có thật, nhưng phụ thuộc điều kiện (Reed và cộng sự, 2014).'
  loai: nhan
- trang: kham-pha/phat-trien/tuoi-gia
  id: n45
  cau: 'Nhãn "Đang tranh cãi": suy giảm nhận thức có bắt đầu trước 60 tuổi không? (SLS: chưa trước 60; Whitehall II: đã thấy từ 45–49).'
  loai: nhan
- trang: kham-pha/phat-trien/tuoi-gia
  id: n46
  cau: Nhóm Seattle kết luận suy giảm trung bình đáng tin cậy chưa xuất hiện trước 60; Singh-Manoux và cộng sự (2012, Whitehall II) cho rằng suy giảm nhỏ nhưng có ý nghĩa đã bắt đầu từ khoảng 45 tuổi.
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n47
  cau: 'Nhãn "Đã bị bác bỏ": "già thì lẫn" — tuổi già đồng nghĩa với sa sút trí tuệ.'
  loai: nhan
- trang: kham-pha/phat-trien/tuoi-gia
  id: n48
  cau: "NHS: giữa lão hóa thông thường và sa sút trí tuệ có vùng trung gian là suy giảm nhận thức nhẹ (MCI), triệu chứng chưa đủ nặng để chẩn đoán sa sút trí tuệ, và một số người với MCI sẽ tiến triển thành sa sút trí tuệ."
  loai: lam-sang
- trang: kham-pha/phat-trien/tuoi-gia
  id: n49
  cau: "WHO: định kiến và thiếu hiểu biết tạo rào cản đối với chẩn đoán và chăm sóc."
  loai: lam-sang
- trang: kham-pha/phat-trien/tuoi-gia
  id: n50
  cau: "Salthouse và Babcock (1991): trong hai nghiên cứu trên 460 người từ 18 đến 87 tuổi, khi kiểm soát thống kê tốc độ xử lý đơn giản thì liên hệ giữa tuổi và trí nhớ làm việc giảm nhiều nhất."
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n51
  cau: Theo Salthouse (1996), khi xử lý chậm lại, các thao tác cần thiết có thể không kịp hoàn thành và sản phẩm các bước đầu có thể mất đi trước khi các bước sau xong; lý thuyết nhằm giải thích nhận thức lưu động.
  loai: dinh-nghia
- trang: kham-pha/phat-trien/tuoi-gia
  id: n52
  cau: "Carstensen và cộng sự (1999), Carstensen (2006): nhận thức về thời gian có thể thay đổi; các mục tiêu xã hội cũng đổi ở người trẻ khi bị đặt vào hoàn cảnh hạn chế thời gian."
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n53
  cau: Khái niệm dự trữ nhận thức được đề xuất để giải thích khoảng cách giữa mức tổn thương não và biểu hiện lâm sàng (Stern, 2009).
  loai: dinh-nghia
- trang: kham-pha/phat-trien/tuoi-gia
  id: n54
  cau: WHO nêu học vấn thấp là một yếu tố nguy cơ của sa sút trí tuệ; SLS ghi nhận môi trường trí óc phức tạp gắn với ít suy giảm hơn.
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n55
  cau: (Đã bỏ) Não cũng như cơ bắp, dùng thường xuyên thì giữ được lâu hơn.
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n56
  cau: 'Nhãn "Khá vững": vận động thể chất, đời sống xã hội và hoạt động trí óc gắn với nguy cơ suy giảm nhận thức thấp hơn.'
  loai: nhan
- trang: kham-pha/phat-trien/tuoi-gia
  id: n57
  cau: "Ví dụ vừa sức cho người lớn tuổi: đi bộ, đọc sách báo, chơi cờ, trò chuyện với bạn bè, học một kỹ năng mới."
  loai: loi-khuyen
- trang: kham-pha/phat-trien/tuoi-gia
  id: n58
  cau: Gợi ý "học cái mới bằng cách móc vào cái cũ" là suy ra từ lý thuyết, chưa phải kết quả của một nghiên cứu cụ thể; các nghiên cứu huấn luyện của nhóm Seattle cho thấy người lớn tuổi vẫn cải thiện được kỹ năng nhận thức.
  loai: loi-khuyen
- trang: kham-pha/phat-trien/tuoi-gia
  id: n59
  cau: Các nhà nghiên cứu nêu khả năng tập trung vào thông tin tích cực có thể có lợi trong một số điều kiện và làm giảm hiệu suất nhận thức trong điều kiện khác (Reed và Carstensen, 2012); các ví dụ như bỏ qua cảnh báo rủi ro là suy luận của trang.
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n60
  cau: 'Nhãn "Khá vững": nên nói chuyện với bác sĩ sớm khi có các dấu hiệu ở cột phải của bảng, thay vì chờ.'
  loai: nhan
- trang: kham-pha/phat-trien/tuoi-gia
  id: n61
  cau: Một tổng hợp năm 2003 thấy khoảng 9% ca sa sút trí tuệ có nguyên nhân có thể đảo ngược và chỉ 0,6% thật sự hồi phục; các bệnh đi kèm vẫn nên được điều trị (Clarfield, 2003).
  loai: lam-sang
- trang: kham-pha/phat-trien/tuoi-gia
  id: n62
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu dọc quy mô lớn nào về lão hóa nhận thức ở Việt Nam; các khảo sát đã công bố mà chúng tôi tìm thấy là cắt ngang, cỡ mẫu nhỏ hơn, ở một số địa phương.
  loai: thoi-su
- trang: kham-pha/phat-trien/tuoi-gia
  id: n63
  cau: Một khảo sát cắt ngang năm 2023 trên 763 người từ 60 tuổi ở một phường đô thị và một xã nông thôn của Hà Nội.
  loai: so-lieu
- trang: kham-pha/phat-trien/tuoi-gia
  id: n64
  cau: Tính đến 2024, Việt Nam có 14,2 triệu người từ 60 tuổi trở lên, chiếm 14,1% dân số; dự báo đến năm 2050 là 29,2 triệu người, khoảng 25%; Việt Nam là một trong những nước già hóa nhanh nhất thế giới (UNFPA).
  loai: thoi-su
- trang: kham-pha/phat-trien/tuoi-gia
  id: n65
  cau: Mạng lưới gia đình dày có thể là yếu tố bảo vệ nhận thức (WHO nêu cô lập xã hội là yếu tố nguy cơ), và hiệu ứng tích cực có thể càng rõ trong văn hóa gia đình Việt; đó là suy đoán.
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n66
  cau: '"Cứ già là lẫn" là ngộ nhận: sa sút trí tuệ không phải hệ quả tất yếu của tuổi già; những thay đổi thông thường theo tuổi khác với sa sút trí tuệ.'
  loai: lam-sang
- trang: kham-pha/phat-trien/tuoi-gia
  id: n67
  cau: Một lần quên vặt chưa nói lên điều gì; NHS nêu các dấu hiệu sớm gồm quên thường xuyên những việc vừa xảy ra, hỏi lặp lại, khó làm việc quen thuộc, khó tìm từ, nhầm lẫn về thời gian và nơi chốn.
  loai: lam-sang
- trang: kham-pha/phat-trien/tuoi-gia
  id: n68
  cau: Tốc độ xử lý giảm theo tuổi nhưng vốn từ vựng còn tăng đến khoảng thập niên 60; nghiên cứu huấn luyện của nhóm Seattle cho thấy người lớn tuổi vẫn cải thiện được kỹ năng nhận thức ("não già không học được gì mới" là ngộ nhận).
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n69
  cau: Hiệu ứng tích cực là xu hướng xử lý thông tin (chú ý và nhớ cái tích cực hơn cái tiêu cực), không phải trạng thái cảm xúc thường trực; người cao tuổi vẫn có thể buồn và lo.
  loai: dinh-nghia
- trang: kham-pha/phat-trien/tuoi-gia
  id: n71
  cau: "Câu hỏi 1: nhóm Seattle kết luận trước 60 tuổi chưa thấy suy giảm trung bình đáng tin cậy; đến 74 tuổi suy giảm xuất hiện ở mọi năng lực (lời giải thích)."
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n72
  cau: "Câu hỏi 2: Cattell dự đoán Gf suy giảm sớm hơn Gc; vốn từ tăng đến khoảng thập niên 60 (lời giải thích)."
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n73
  cau: "Câu hỏi 3: hiệu ứng tích cực là xu hướng xử lý thông tin; trong nghiên cứu của Charles và cộng sự (2003), lợi thế nhớ ảnh tiêu cực giảm dần qua các nhóm tuổi lớn hơn (lời giải thích)."
  loai: phat-hien
- trang: kham-pha/phat-trien/tuoi-gia
  id: n74
  cau: "Câu hỏi 4: phân tích 100 nghiên cứu (7.129 người) cho thấy hiệu ứng đáng tin cậy nhưng lớn hơn khi không ràng buộc xử lý và khi so nhóm tuổi cách xa (lời giải thích)."
  loai: so-lieu
- trang: kham-pha/phat-trien/tuoi-gia
  id: n75
  cau: "Câu hỏi 5: các thay đổi thông thường theo tuổi khác sa sút trí tuệ, vốn ảnh hưởng đến sinh hoạt hằng ngày; dấu hiệu như quên thường xuyên những việc vừa xảy ra, hỏi lặp lại, khó làm việc quen thuộc là lúc nên nói chuyện với bác sĩ (lời giải thích và lựa chọn đúng)."
  loai: lam-sang
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n38
  cau: "Liên kết [Hỗ trợ](/psyche/ho-tro/) (ở mục Holt, áp dụng #3 và #4) trỏ tới trang Hỗ trợ của site."
  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: "Đã kiểm: src/content/docs/ho-tro/index.md và ho-tro/index trong src/data/trang.yml."
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n70
  cau: (Đã bỏ) Trong văn hóa chịu ảnh hưởng Nho giáo, điểm số là thể diện của cha mẹ; "con nhà người ta" khiến nhiều em cảm thấy mình là gánh nặng.
  loai: phat-hien
  nguon: []
  ket_qua_luot_1: da-bo
  ghi_chu: 'Không có nguồn đã mở. Chữ cũ: "Trong văn hóa chịu ảnh hưởng Nho giáo, điểm số không chỉ phản ánh năng lực của đứa trẻ mà còn là thể diện của cha mẹ — "con nhà người ta" trở thành thước đo khiến nhiều em cảm thấy mình là gánh nặng mỗi khi điểm kém." Chữ mới: (bỏ) Lý do: Không kiểm được.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n50
  cau: 'Nhãn "Đã bị bác bỏ": "trừng phạt thật nặng là cách tốt nhất để xóa bắt nạt".'
  loai: nhan
  nguon:
    - ten: "Ttofi & Farrington (2011), J Exp Criminol 7(1), 27–56: tóm tắt (bản ghi NCJRS của OJP Hoa Kỳ, ojp.gov); không mở được toàn văn (Springer chặn)"
      link: https://doi.org/10.1007/s11292-010-9109-1
    - ten: "APA Zero Tolerance Task Force (2008), Am Psychol 63(9), 852–862: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1037/0003-066X.63.9.852
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chỗ khó: "trừng phạt nặng" ≠ "firm discipline" ≠ "zero tolerance". Lượt 2 và review cân nhắc có nên hạ thành "chưa đủ bằng chứng". Chữ cũ: "Bằng chứng ủng hộ kỷ luật vững chắc, nhất quán và không thù địch — chứ không phải các biện pháp loại trừ kiểu "đuổi học ngay lập tức"… Đáng chú ý, phân tích của Ttofi và Farrington còn phát hiện các chương trình ép nạn nhân và kẻ bắt nạt "làm việc với nhau" theo nhóm bạn lại liên quan đến tăng tỉ lệ nạn nhân." Chữ mới: "Bằng chứng ủng hộ kỷ luật vững chắc (Ttofi và Farrington, 2011…). Còn các chính sách "không khoan nhượng"… tổng quan của APA (2008)…". Lý do: "Nhất quán và không thù địch" không có trong tóm tắt; vế "ép… làm việc với nhau" không đúng với nguồn (xem n29).'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n56
  cau: (Đã bỏ) TikTok và video ngắn chiếm vị trí áp đảo trong thời gian online của teen Việt; áp lực học tập và kỳ vọng gia đình là nguồn stress lớn được ghi nhận trong nhiều khảo sát trong nước.
  loai: phat-hien
  nguon: []
  ket_qua_luot_1: da-bo
  ghi_chu: 'Không có nguồn đã mở cho tỉ trọng TikTok; áp lực học tập chỉ có ở trang khác (Trần 2024). Chữ cũ: "TikTok và video ngắn chiếm vị trí áp đảo trong thời gian online của teen Việt… áp lực học tập và kỳ vọng gia đình là nguồn stress lớn được ghi nhận trong nhiều khảo sát trong nước." Chữ mới: "…chúng tôi không có nguồn đã mở về tỉ trọng TikTok… áp lực học tập là một yếu tố có thể liên quan (xem [Bắt nạt và áp lực thi cử]), nhưng đó là giả thuyết." Lý do: Không kiểm được; thêm liên kết trang nội bộ.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n48
  cau: Các lời dẫn an toàn khác (khung ">" ở "Điều gì đang xảy ra?", ngộ nhận "cứ thu điện thoại là hết trầm cảm") chỉ nói nên nói với người tin cậy hay người có chuyên môn và dẫn Hỗ trợ, không số điện thoại không kiểm.
  loai: loi-khuyen
  nguon:
    - ten: WHO (2025), Adolescent mental health (tờ thông tin, đề ngày 1/9/2025; đọc qua công cụ đọc web)
      link: https://www.who.int/news-room/fact-sheets/detail/adolescent-mental-health
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "hãy gọi ngay 115 (cấp cứu)… Trầm cảm là bệnh lý có thể điều trị được"; "…gọi 115 khi khẩn cấp hoặc tìm bác sĩ tâm thần/nhà tâm lý." Chữ mới: "hãy nói ngay với người bạn tin cậy, thầy cô hoặc người có chuyên môn… xem Hỗ trợ… Tìm giúp đỡ là dấu hiệu của sức mạnh." Lý do: Theo lời giao: dẫn Hỗ trợ; bỏ "bệnh lý có thể điều trị được" và số 115.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n63
  cau: Lo âu về thi cử liên quan âm đến thành tích học tập (238 nghiên cứu; liên hệ nhỏ đến vừa, rõ nhất ở cấp THCS).
  loai: phat-hien
  nguon:
    - ten: "von der Embse và cộng sự (2018), J Affect Disord 227, 483–493: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.jad.2017.11.048
  ket_qua_luot_1: da-sua
  ghi_chu: 'Câu mới thêm; thay vế "một chút căng thẳng giúp tập trung" (n65). Chữ cũ: (không có; thay cho đoạn "Ở các nền giáo dục chịu ảnh hưởng văn hóa Nho giáo, điểm số… thể diện của cả gia đình… Phần Lan chứng minh có thể vừa học giỏi vừa ít lo âu, nếu văn hóa học đường ít so sánh và cạnh tranh hơn") Chữ mới: "Lo âu về thi cử liên quan âm đến thành tích học tập (von der Embse và cộng sự, 2018, 238 nghiên cứu…); PISA 2015 cho thấy các nước có động lực thành tích cao cũng thường có nhiều học sinh lo âu…; Trần và cộng sự (2024) bàn luận rằng cha mẹ quá kiểm soát…" Lý do: Bỏ "thể diện gia đình/Nho giáo" và "Phần Lan… nếu văn hóa ít so sánh" (không kiểm được).'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n38
  cau: Các nghiên cứu ở trên dùng ước lượng thời gian dùng do teen tự báo cáo; nghiên cứu tương lai có thể đo cách dùng chứ không chỉ số giờ (ví dụ hai teen cùng lướt 3 tiếng là ví dụ giả định).
  loai: phat-hien
  nguon:
    - ten: "Orben và cộng sự (2022), Nat Commun 13, 1649: toàn văn (PMC8960761)"
      link: https://doi.org/10.1038/s41467-022-29296-3
  ket_qua_luot_1: da-sua
  ghi_chu: 'Ví dụ hai teen: gia-dinh. Chữ cũ: "…Hai teen cùng lướt 3 tiếng/ngày có thể đang làm hai việc hoàn toàn khác: … Nghiên cứu tương lai cần đo cách dùng… và cần dữ liệu thực từ công ty công nghệ thay vì tự báo cáo." Chữ mới: "…Các nghiên cứu ở trên dùng ước lượng thời gian dùng do teen tự báo cáo (Orben và cộng sự, 2022)… nghiên cứu tương lai có thể đo cách dùng…". Lý do: Bỏ "cần dữ liệu thực từ công ty" (không có nguồn mở); nêu bằng chứng về tự báo cáo.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n42
  cau: "Ngủ đủ giấc liên hệ với sức khỏe tinh thần mạnh hơn hẳn thời gian dùng màn hình (YRBS: β 0,150 so với −0,049); đây là liên hệ quan sát, chưa chứng minh rằng ngủ đủ cải thiện sức khỏe tinh thần."
  loai: so-lieu
  nguon:
    - ten: "Orben & Przybylski (2019), Nat Hum Behav 3(2), 173–182: toàn văn (bản tác giả chấp nhận, kho Oxford ORA); thêm bản tin của OII Oxford (oii.ox.ac.uk) cho tỉ lệ 2,7 và 4,3"
      link: https://doi.org/10.1038/s41562-018-0506-1
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Trong cùng bộ dữ liệu của Orben và Przybylski, ngủ đủ giấc liên hệ… mạnh hơn hẳn thời gian dùng màn hình." (tiêu đề "…là can thiệp rẻ và chắc chắn nhất", chip vững chắc) Chữ mới: "…(ở YRBS: β 0,150 so với −0,049). Đó là liên hệ quan sát, chưa chứng minh rằng ngủ đủ giấc cải thiện sức khỏe tinh thần." Tiêu đề "Bảo vệ giấc ngủ là một việc đáng làm", chip khá vững, giữ id cũ. Lý do: "Can thiệp… chắc chắn nhất" không có nguồn (chỉ liên hệ quan sát); hạ Vững chắc → Khá vững.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n37
  cau: Các cửa sổ nhạy cảm khác nhau theo tuổi và giới (Orben và cộng sự, 2022); các yếu tố khác (tính cách, môi trường gia đình) có thể liên quan nhưng chúng tôi chưa có nguồn đã mở.
  loai: phat-hien
  nguon:
    - ten: "Orben và cộng sự (2022), Nat Commun 13, 1649: toàn văn (PMC8960761)"
      link: https://doi.org/10.1038/s41467-022-29296-3
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Mô hình nhạy cảm khác biệt (differential susceptibility)… Tuổi dậy thì (não bộ đang tái cấu trúc mạnh, nhạy cảm với đánh giá xã hội), giới tính, tính cách (hay lo âu, cầu toàn) và môi trường gia đình đều có thể khuếch đại hoặc giảm nhẹ tác động." Chữ mới: "Mức độ nhạy cảm khác nhau giữa các nhóm… Orben và cộng sự (2022) thấy các cửa sổ nhạy cảm khác nhau theo tuổi và giới. Các yếu tố khác… chúng tôi chưa có nguồn đã mở…, nên chỉ nêu như một khả năng." Lý do: Bỏ tên "differential susceptibility" và các yếu tố không có nguồn.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n64
  cau: Trần và cộng sự (2024) bàn luận rằng cha mẹ quá kiểm soát có thể để lại cho trẻ ít thời gian thư giãn và ngủ; đó là phần bàn luận, không phải kết quả đo.
  loai: phat-hien
  nguon:
    - ten: "Trần và cộng sự (2024), J Rural Med 19(4), 279–290: toàn văn (PMC11442093)"
      link: https://doi.org/10.2185/jrm.2024-012
  ket_qua_luot_1: dung
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n32
  cau: "Kowalski và cộng sự (2014): liên hệ mạnh nhất với việc thực hiện bắt nạt mạng là niềm tin chuẩn mực về gây hấn và sự tách rời đạo đức; liên hệ mạnh nhất với việc bị bắt nạt mạng là căng thẳng và ý nghĩ tự tử; các liên hệ không cho biết chiều nhân quả."
  loai: phat-hien
  nguon:
    - ten: "Kowalski và cộng sự (2014), Psychol Bull 140(4), 1073–1137: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1037/a0035618
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…dự báo mạnh nhất của việc bị bắt nạt trên mạng chính là đang bị bắt nạt ngoài đời — và trong các yếu tố gắn với hành vi bắt nạt mạng, mạnh nhất là những niềm tin "gây hấn là bình thường" cùng sự tách rời đạo đức". Chữ mới: "…các liên hệ mạnh nhất với việc bị bắt nạt mạng là căng thẳng và ý nghĩ tự tử…" (vế bắt nạt mạng của người gây hấn giữ nguyên). Lý do: Tóm tắt nói liên hệ mạnh nhất của victimization là stress và ý nghĩ tự tử, không phải "đang bị bắt nạt ngoài đời"; không dùng từ "dự báo" (cắt ngang).'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n29
  cau: Hiệu ứng trung bình nhỏ không có nghĩa mọi teen đều như nhau — có các độ tuổi mà hiệu ứng rõ hơn một chút.
  loai: phat-hien
  nguon:
    - ten: "Orben và cộng sự (2022), Nat Commun 13, 1649: toàn văn (PMC8960761)"
      link: https://doi.org/10.1038/s41467-022-29296-3
  ket_qua_luot_1: dung
  ghi_chu: Trang cũ viết "có nhóm tuổi dễ tổn thương hơn"; giữ vì "windows of sensitivity", nhưng "tổn thương" là cách diễn đạt của trang.
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n28
  cau: Các tác giả suy đoán cửa sổ sớm có thể liên quan đến dậy thì (nữ dậy thì sớm hơn nam), nhưng dữ liệu không đo dậy thì nên chưa kiểm được.
  loai: phat-hien
  nguon:
    - ten: "Orben và cộng sự (2022), Nat Commun 13, 1649: toàn văn (PMC8960761)"
      link: https://doi.org/10.1038/s41467-022-29296-3
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…trùng với thời điểm dậy thì (nữ dậy thì sớm hơn nam)." Chữ mới: "Các tác giả suy đoán rằng cửa sổ sớm có thể liên quan đến dậy thì… nhưng dữ liệu không đo dậy thì nên chưa kiểm được." Lý do: Nguồn nêu là suy đoán ("speculatively").'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n49
  cau: Liên kết [Hỗ trợ](/psyche/ho-tro/) (khung đầu bài, mục 4, ngộ nhận) và liên kết tới Bắt nạt và áp lực thi cử trỏ tới trang của site.
  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: "Đã kiểm: ho-tro/index.md và kham-pha/phat-trien/tam-ly-hoc-duong.md có trong worktree; trang.yml có ho-tro/index."
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n28
  cau: Chương trình hiệu quả hơn khi triển khai chuyên sâu và khi có họp phụ huynh, phương pháp kỷ luật vững chắc, tăng cường giám sát ở sân chơi.
  loai: phat-hien
  nguon:
    - ten: "Ttofi & Farrington (2011), J Exp Criminol 7(1), 27–56: tóm tắt (bản ghi NCJRS của OJP Hoa Kỳ, ojp.gov); không mở được toàn văn (Springer chặn)"
      link: https://doi.org/10.1007/s11292-010-9109-1
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…được triển khai chuyên sâu, dài hơi." Chữ mới: "…triển khai chuyên sâu." Lý do: "Dài hơi" không có trong tóm tắt.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n55
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu dọc đủ lớn ở Việt Nam về mạng xã hội và sức khỏe tâm thần teen để trả lời câu hỏi nhân quả.
  loai: thoi-su
  nguon:
    - ten: 'Tìm trên Europe PMC (10/11/2026): "(Vietnam OR Vietnamese) AND (social media) AND (adolescents) AND (longitudinal OR cohort)": 1.728 kết quả, các kết quả đầu không phải nghiên cứu dọc về mạng xã hội và sức khỏe tâm thần teen Việt Nam; chưa đọc hết. OpenAlex hết lượt trong ngày'
      link: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=(Vietnam%20OR%20Vietnamese)%20AND%20(social%20media)%20AND%20(adolescents)%20AND%20(longitudinal%20OR%20cohort)
  ket_qua_luot_1: da-sua
  ghi_chu: 'Europe PMC 10/11/2026: các kết quả đầu không phải nghiên cứu dọc về mạng xã hội và sức khỏe tâm thần teen Việt Nam (có nghiên cứu dọc khác về cân nặng, v.v.); chưa đọc hết 1.728 kết quả, chưa tìm Google Scholar hay tạp chí trong nước: lượt 2 và review nên tìm thêm. Chữ cũ: "…chúng ta chưa có dữ liệu dọc đủ tốt để trả lời." Chữ mới: "Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu dọc đủ lớn…". Lý do: Quy tắc câu thời sự: mốc, hạn, nguồn là lần tìm.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n60
  cau: 'Ngộ nhận "cứ thu điện thoại là hết trầm cảm": liên hệ giữa mạng xã hội và sức khỏe tâm thần là nhỏ và hai chiều nên chỉ thu điện thoại khó là cả lời giải; nếu lo, tìm người có chuyên môn; xem Hỗ trợ.'
  loai: loi-khuyen
  nguon:
    - ten: "Orben, Dienlin & Przybylski (2019), PNAS 116(21), 10226–10228: toàn văn (PMC6534991)"
      link: https://doi.org/10.1073/pnas.1902058116
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Trầm cảm là bệnh lý phức tạp (gen, môi trường, sang chấn, áp lực học tập...)… điều trị trầm cảm cần chuyên môn y tế — gọi 115…". Chữ mới: "Dữ liệu cho thấy liên hệ… là nhỏ và hai chiều, nên chỉ thu điện thoại khó là cả lời giải. Nếu lo về trầm cảm của một bạn trẻ, hãy tìm người có chuyên môn; xem Hỗ trợ." Lý do: Bỏ danh sách nguyên nhân trầm cảm (không có nguồn) và số 115.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n51
  cau: 'Nhãn "Đã bị bác bỏ": "bắt nạt chỉ là chuyện trẻ con, lớn lên tự hết": từng bị bắt nạt dự báo trầm cảm về sau (OR ≈ 2,0; ≈ 1,7 sau kiểm soát; theo dõi trung bình 6,9 năm), từng bắt nạt dự báo phạm tội về sau (OR hiệu chỉnh ≈ 1,8).'
  loai: nhan
  nguon:
    - ten: "Ttofi và cộng sự (2011), J Aggress Confl Peace Res 3(2), 63–73: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1108/17596591111132873
    - ten: "Ttofi và cộng sự (2011), Crim Behav Ment Health 21(2), 80–89: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1002/cbm.808
    - ten: "Olweus (2013), Annu Rev Clin Psychol 9, 751–780: tóm tắt (Europe PMC); không mở được toàn văn"
      link: https://doi.org/10.1146/annurev-clinpsy-050212-185516
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…từng bắt nạt người khác ở trường là yếu tố dự báo phạm tội sau này (tỉ số chênh hiệu chỉnh khoảng 1,9)… (Ttofi, Farrington, Lösel và Loeber, 2011; Ttofi, Farrington và Lösel, 2012)". Chữ mới: "…tỉ số chênh hiệu chỉnh khoảng 1,8; Ttofi và cộng sự, 2011… Olweus (2013) cũng kết luận bắt nạt không chỉ là vấn đề vô hại và thoáng qua". Lý do: OR hiệu chỉnh là 1,82 (đúng 1,8, không phải 1,9); bài Ttofi 2012 (bạo lực) không mở được nên bỏ khỏi trang và danh sách nguồn.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n46
  cau: 'Nhãn "Khá vững": chú ý ở ngưỡng dậy thì (các cửa sổ nhạy cảm).'
  loai: nhan
  nguon:
    - ten: "Orben và cộng sự (2022), Nat Commun 13, 1649: toàn văn (PMC8960761)"
      link: https://doi.org/10.1038/s41467-022-29296-3
  ket_qua_luot_1: dung
  ghi_chu: "Chỗ khó: một nghiên cứu, chưa có tái lập; giữ chip khá vững như trang gốc nhưng nên xem lại."
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n5
  cau: (Đã bỏ) Điểm gãy Haidt nhấn mạnh là khoảng năm 2012, khi đa số teen Mỹ đã sở hữu smartphone.
  loai: lich-su
  nguon: []
  ket_qua_luot_1: da-bo
  ghi_chu: 'Không có nguồn đã mở (Wikipedia nói chung chung "khoảng 2010"; không có tỉ lệ sở hữu). Chữ cũ: "Điểm gãy ông nhấn mạnh là khoảng năm 2012, khi đa số teen Mỹ đã sở hữu smartphone." Chữ mới: (bỏ) Lý do: Không kiểm được.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n86
  cau: "Câu hỏi 3: Modecki (2014) — bắt nạt truyền thống phổ biến gấp đôi bắt nạt mạng và hai dạng tương quan cao; kết luận thực hành của tác giả."
  loai: so-lieu
  nguon:
    - ten: "Modecki và cộng sự (2014), J Adolesc Health 55(5), 602–611: tóm tắt (Europe PMC); không mở được toàn văn (số 35% và 15% không kiểm được)"
      link: https://doi.org/10.1016/j.jadohealth.2014.06.007
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…(khoảng 35% so với khoảng 15%), hai dạng chồng lấp rất lớn — em bị bắt nạt trên mạng nhiều khả năng cũng bị bắt nạt ngoài đời." Lời giải thích: "…vì nạn nhân thường là cùng một người." Chữ mới: "…phổ biến gấp đôi bắt nạt trên mạng, và hai dạng tương quan cao với nhau." Lời giải thích: "…việc dính líu vào nhiều dạng gây hấn cùng lúc nên là mục tiêu chính…" Lựa chọn nhiễu: "…và hai dạng không liên quan gì nhau." Lý do: 35/15 không kiểm được; lựa chọn nhiễu đổi để vẫn sai rõ ràng và không trái nhận định nào.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n53
  cau: Một nghiên cứu cắt ngang (Vũ Thị Thúy Hằng & Nguyễn Thị Vân, công bố 25/12/2024, VNU Journal of Economics and Business) dùng thang BSMAS trên 13–17 tuổi, chọn mẫu quả cầu tuyết, ghi nhận tỉ lệ "nghiện mạng xã hội" cao, nữ dễ bị hơn nam.
  loai: so-lieu
  nguon:
    - ten: "Vu & Nguyen (2024), VNU J Econ Bus 4(6): tóm tắt (Crossref)"
      link: https://doi.org/10.57110/vnu-jeb.v4i6.354
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Một nghiên cứu tại Đại học Thương mại (chấp nhận đăng cuối 2024) dùng thang BSMAS trên teen 13–18 tuổi… mẫu thuận tiện". Chữ mới: "…(Vũ Thị Thúy Hằng và Nguyễn Thị Vân, công bố 25/12/2024 trên VNU Journal of Economics and Business) dùng thang BSMAS trên 13–17 tuổi, chọn mẫu theo kiểu quả cầu tuyết…". Danh mục nguồn đã sửa. Lý do: Nơi đăng là VNU Journal of Economics and Business (không phải "Đại học Thương mại"); tuổi 13 đến dưới 18; mẫu quả cầu tuyết, không phải "thuận tiện".'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n78
  cau: '"Bắt nạt trên mạng nguy hiểm và phổ biến hơn bắt nạt trực tiếp" là ngộ nhận về độ phổ biến: bắt nạt truyền thống phổ biến gấp đôi; Olweus (2013) cho rằng một số tuyên bố về bắt nạt mạng trên truyền thông bị phóng đại nhiều.'
  loai: phat-hien
  nguon:
    - ten: "Modecki và cộng sự (2014), J Adolesc Health 55(5), 602–611: tóm tắt (Europe PMC); không mở được toàn văn (số 35% và 15% không kiểm được)"
      link: https://doi.org/10.1016/j.jadohealth.2014.06.007
    - ten: "Olweus (2013), Annu Rev Clin Psychol 9, 751–780: tóm tắt (Europe PMC); không mở được toàn văn"
      link: https://doi.org/10.1146/annurev-clinpsy-050212-185516
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Thực tế ngược lại về độ phổ biến: bắt nạt truyền thống khoảng 35%, bắt nạt trên mạng khoảng 15%… Bắt nạt mạng đáng lo vì tính ẩn danh và lan truyền nhanh, nhưng nạn nhân thường là cùng một em bị bắt nạt ngoài đời — tách hai vấn đề ra xử lý riêng là kém hiệu quả." Chữ mới: "…bắt nạt truyền thống phổ biến gấp đôi bắt nạt trên mạng… hai dạng tương quan cao… tách chúng ra xử lý riêng không hẳn hiệu quả; Olweus (2013) còn nhận xét…". Lý do: Bỏ 35/15, "ẩn danh và lan truyền nhanh", "cùng một em" (không kiểm được); thêm nhận xét của Olweus 2013.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n73
  cau: (Đã bỏ) Giáo viên chủ nhiệm là người gần học sinh nhất và là người đầu tiên có thể nhận ra dấu hiệu; việc ép nạn nhân và kẻ bắt nạt "bắt tay làm hòa" trước lớp là kiểu "làm việc theo nhóm bạn" mà Ttofi và Farrington cảnh báo.
  loai: phat-hien
  nguon: []
  ket_qua_luot_1: da-bo
  ghi_chu: 'Không có nguồn đã mở; nối với phát hiện của Ttofi là suy diễn quá xa (xem n29). Chữ cũ: Đoạn "Vai trò của giáo viên chủ nhiệm…". Chữ mới: Thay bằng đoạn "Bắt nạt ở trường": khảo sát ẩn danh, xử lý từng vụ việc riêng, nội quy rõ ràng là thành phần mô tả của OBPP (n74); chưa tìm thấy nghiên cứu đã mở so sánh cách "ép hai bên bắt tay làm hòa". Lý do: Không kiểm được.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n2
  cau: Chỉ tình huống (c) hội đủ ba dấu hiệu của định nghĩa bắt nạt (ba tình huống là ví dụ giả định); (a) là xung đột ngang hàng, (b) là sự cố đơn lẻ.
  loai: dinh-nghia
  nguon:
    - ten: "Holt và cộng sự (2015), Pediatrics 135(2), e496–e509: toàn văn (PMC4702491)"
      link: https://doi.org/10.1542/peds.2014-1864
  ket_qua_luot_1: da-sua
  ghi_chu: 'Tình huống Minh và (a), (b), (c): gia-dinh. Lời giải thích không dựa vào vị trí lựa chọn. Chữ cũ: "…ba dấu hiệu mà nhà nghiên cứu Dan Olweus dùng để định nghĩa bắt nạt". Chữ mới: "…ba dấu hiệu trong định nghĩa bắt nạt theo Olweus và theo CDC". Lý do: Nguồn đã mở nêu ba nét cốt lõi của định nghĩa CDC; định nghĩa Olweus theo sách không mở được.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n76
  cau: "Khảo sát cắt ngang công bố năm 2025 trên 1.054 học sinh 15–18 tuổi ở Cần Thơ: 37,4% có triệu chứng trầm cảm theo thang tự báo cáo (không phải chẩn đoán); áp lực học tập và bạo lực giữa người với người nằm trong các yếu tố liên quan."
  loai: so-lieu
  nguon:
    - ten: "Tran và cộng sự (2025), Camb Prisms Glob Ment Health 12, e139: tóm tắt (Europe PMC, PMC12720387)"
      link: https://doi.org/10.1017/gmh.2025.10096
  ket_qua_luot_1: dung
  ghi_chu: Câu mới thêm. Chỉ đọc tóm tắt; "triệu chứng, không phải chẩn đoán" theo thang CESD-R.
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n61
  cau: 'Kowalski và cộng sự (2014): niềm tin gây hấn là bình thường và tách rời đạo đức nằm trong các liên hệ mạnh nhất với việc thực hiện bắt nạt mạng; các cách nói "chỉ đùa thôi", "nó đáng bị thế" là ví dụ minh họa của chúng tôi.'
  loai: phat-hien
  nguon:
    - ten: "Kowalski và cộng sự (2014), Psychol Bull 140(4), 1073–1137: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1037/a0035618
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Để gây hại cho người khác mà không cắn rứt, con người có một bộ "thủ thuật" tâm lý: đổ lỗi cho nạn nhân…, gọi hành vi bằng cái tên nhẹ nhàng hơn…, hay phân tán trách nhiệm… Nhận diện được các thủ thuật này… là bước đầu để vô hiệu hóa chúng." Chữ mới: "…niềm tin rằng gây hấn là bình thường và sự tách rời đạo đức… nằm trong các liên hệ mạnh nhất… Các cách nói "chỉ đùa thôi"… là ví dụ minh họa của chúng tôi". Lý do: Danh sách ba "thủ thuật" và "bước đầu để vô hiệu hóa" không có trong nguồn đã mở; giữ phần Kowalski xác nhận.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n33
  cau: "Holt và cộng sự (2015): phân tích tổng hợp 47 nghiên cứu cắt ngang (38,3% từ Mỹ, 61,7% ngoài Mỹ), 280 cỡ hiệu ứng, về dính líu vào bắt nạt (nạn nhân, kẻ bắt nạt, vừa bắt nạt vừa bị bắt nạt) và ý nghĩ, hành vi tự tử."
  loai: so-lieu
  nguon:
    - ten: "Holt và cộng sự (2015), Pediatrics 135(2), e496–e509: toàn văn (PMC4702491)"
      link: https://doi.org/10.1542/peds.2014-1864
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…47 nghiên cứu (61,7% mẫu ngoài nước Mỹ)…" (mô tả mẫu). Chữ mới: "…47 nghiên cứu cắt ngang (38,3% từ Mỹ, 61,7% ngoài Mỹ)…". Lý do: Thêm "cắt ngang" theo tóm tắt (cần cho hạn chế nhân quả).'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n82
  cau: '"Áp lực thi cử giúp học sinh cố gắng hơn, càng áp lực càng giỏi": lo âu về thi cử liên quan âm với thành tích (von der Embse 2018), PISA 2015 thấy lo âu liên quan âm với điểm; nước có động lực cao cũng nhiều lo âu.'
  loai: phat-hien
  nguon:
    - ten: "von der Embse và cộng sự (2018), J Affect Disord 227, 483–493: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.jad.2017.11.048
    - ten: "OECD (2017), PISA 2015 Results (Volume III), bản Overview (PDF bản OECD do Viện IBE Ba Lan lưu): toàn văn phần Overview, gồm Hình III.1.2 (bảng chỉ số lo âu theo nước)"
      link: https://doi.org/10.1787/9789264273856-en
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "PISA 2015 cho thấy các nước lo âu về bài vở cao nhất không phải là các nước học kém nhất — nhưng Phần Lan chứng minh có thể đạt đỉnh cao mà không cần đỉnh lo âu. Áp lực vừa phải có thể tạo động lực; áp lực quá mức và kéo dài thì bào mòn cả sức khỏe lẫn kết quả học tập." Chữ mới: "Lo âu về thi cử nhìn chung liên quan đến thành tích thấp hơn (von der Embse…), và PISA 2015 thấy lo âu về bài vở liên quan âm với điểm… các nước có động lực cao cũng nhiều lo âu." Lý do: Bỏ "áp lực vừa phải tạo động lực" (không có nguồn), "bào mòn sức khỏe" (không kiểm).'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n48
  cau: 'Nhãn "Khá vững": bắt nạt trên mạng ít phổ biến hơn bắt nạt trực tiếp, nhưng hai dạng chồng lấp lớn.'
  loai: nhan
  nguon:
    - ten: "Modecki và cộng sự (2014), J Adolesc Health 55(5), 602–611: tóm tắt (Europe PMC); không mở được toàn văn (số 35% và 15% không kiểm được)"
      link: https://doi.org/10.1016/j.jadohealth.2014.06.007
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Tỉ lệ 35% so với 15% trong phân tích của Modecki… là con số trung bình gộp — tỉ lệ cụ thể dao động mạnh giữa các nghiên cứu tùy cách đo." Chữ mới: "…bắt nạt truyền thống phổ biến gấp đôi bắt nạt trên mạng… cách đo khác nhau làm tỉ lệ khác nhau." Lý do: Bỏ 35%/15% (không kiểm được).'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n27
  cau: "Trung bình các chương trình chống bắt nạt có hiệu quả thật: bắt nạt giảm khoảng 20–23% và nạn nhân giảm khoảng 17–20% (Ttofi và Farrington, 2011)."
  loai: so-lieu
  nguon:
    - ten: "Ttofi & Farrington (2011), J Exp Criminol 7(1), 27–56: tóm tắt (bản ghi NCJRS của OJP Hoa Kỳ, ojp.gov); không mở được toàn văn (Springer chặn)"
      link: https://doi.org/10.1007/s11292-010-9109-1
  ket_qua_luot_1: dung
  ghi_chu: Một bản tóm tắt khác của bài nêu trung bình ~20% cho bắt nạt; giữ khoảng 20–23% theo bản đã mở.
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n53
  cau: Salmivalli và cộng sự (1996) xem bắt nạt như một quá trình nhóm và xét các vai trò tham gia của học sinh trong mối liên hệ với địa vị xã hội trong nhóm.
  loai: lich-su
  nguon:
    - ten: "Salmivalli và cộng sự (1996), Aggress Behav 22(1), 1–15: chỉ đọc được tiêu đề và thông tin xuất bản (Crossref, trang research.abo.fi); không mở được tóm tắt hay toàn văn"
      link: https://doi.org/10.1002/(SICI)1098-2337(1996)22:1%3C1::AID-AB1%3E3.0.CO;2-T
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chỗ chưa mở: chỉ đọc được tiêu đề; sáu vai trò (nạn nhân, kẻ bắt nạt, người cổ vũ, người tiếp tay, người bảo vệ, người ngoài cuộc) kiểm qua kết quả tìm kiếm, không qua trang đã mở nên trang chỉ nói "những người tiếp tay, cổ vũ, đứng ngoài cuộc và bảo vệ" như gợi ý của cách nhìn này. Lượt 2 nên tìm toàn văn. Chữ cũ: "Salmivalli… chỉ ra rằng… ngoài kẻ bắt nạt và nạn nhân còn có các vai trò khác: người tiếp tay, người cổ vũ (cười, reo hò — vô tình "thưởng"), người ngoài cuộc (đứng nhìn, im lặng — sự im lặng cũng là một thông điệp), người bảo vệ. Kẻ bắt nạt thường có địa vị xã hội cao… (Salmivalli và cộng sự, 1996)." Chữ mới: "Salmivalli… xem bắt nạt như một quá trình nhóm và xét các vai trò tham gia… Cách nhìn này gợi ý rằng ngoài kẻ bắt nạt và nạn nhân còn có những người tiếp tay, cổ vũ, đứng ngoài cuộc và bảo vệ." Lý do: Bỏ "địa vị xã hội cao" và các mô tả vai trò (không mở được nguồn nói điều đó).'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n40
  cau: "ESSA có năm khía cạnh: áp lực từ việc học, khối lượng bài vở, lo lắng về điểm số, kỳ vọng vào bản thân, cảm giác chán nản; xây dựng và kiểm định trên hơn 2.000 thanh thiếu niên Trung Quốc."
  loai: cong-cu
  nguon:
    - ten: "Sun và cộng sự (2011), J Psychoeduc Assess 29(6), 534–546: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1177/0734282910394976
  ket_qua_luot_1: dung
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n63
  cau: "Câu hỏi 2: YRBS 2021 không hỏi về mạng xã hội nên không chứng minh mạng xã hội gây trầm cảm; muốn kết luận nhân quả cần thiết kế khác."
  loai: phat-hien
  nguon:
    - ten: "CDC MMWR Suppl 73(4) (2024), YRBS 2023: các trang su7304a1 (tổng quan) và su7304a3 (mạng xã hội; đọc qua công cụ đọc web)"
      link: https://www.cdc.gov/mmwr/volumes/73/su/su7304a3.htm
    - ten: "CDC (2023), YRBS Data Summary & Trends Report 2011–2021: toàn văn (PDF, cdc.gov)"
      link: https://www.cdc.gov/yrbs/dstr/pdf/YRBS_Data-Summary-Trends_Report2023_508.pdf
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Vì YRBS không hỏi gì về việc dùng mạng xã hội — nó chỉ cho thấy khủng hoảng sức khỏe tâm thần có thật…" Chữ mới: "Vì đợt YRBS 2021 không hỏi gì về việc dùng mạng xã hội — nó chỉ cho thấy mức buồn bã tự báo cáo tăng…" Lý do: Xem n15, n2; câu hỏi đổi "năm 2021".'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n62
  cau: "Gaffney và cộng sự (2021): các thành phần như cách tiếp cận toàn trường, chính sách chống bắt nạt, nội quy lớp học và thông tin cho phụ huynh gắn với hiệu quả lớn hơn; đây là liên hệ giữa thành phần và hiệu quả, không phải thí nghiệm riêng."
  loai: phat-hien
  nguon:
    - ten: "Gaffney, Ttofi & Farrington (2021), J Sch Psychol 85, 37–56: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.jsp.2020.12.002
  ket_qua_luot_1: dung
  ghi_chu: Bullet "Chương trình toàn trường" thay thế bullet "Mô hình Olweus" (n24).
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n66
  cau: Nếu căng thẳng về thi cử kéo dài và ảnh hưởng đến giấc ngủ, ăn uống, việc đến trường, hay em nói những điều cho thấy mất hy vọng, hãy nói với người lớn tin cậy và tìm người có chuyên môn; xem Hỗ trợ.
  loai: loi-khuyen
  nguon:
    - ten: "von der Embse và cộng sự (2018), J Affect Disord 227, 483–493: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.jad.2017.11.048
  ket_qua_luot_1: da-sua
  ghi_chu: 'Lời dẫn an toàn theo lời giao, không phải chẩn đoán; không liệt kê dấu hiệu lâm sàng. Chữ cũ: "…khi lo âu đi kèm mất ngủ kéo dài, đau đầu/đau bụng trước mỗi kỳ thi, né tránh đến trường, hay suy nghĩ "thi trượt thì đời mình coi như bỏ" — đó là dấu hiệu cần hỗ trợ, không phải "cố thêm chút nữa"." Chữ mới: "…kéo dài và ảnh hưởng đến giấc ngủ, ăn uống, việc đến trường, hay em nói những điều cho thấy mất hy vọng, đó là lúc cần nói với người lớn tin cậy và tìm người có chuyên môn; xem Hỗ trợ." Lý do: Bỏ danh sách triệu chứng giống dấu hiệu lâm sàng; chỉ dẫn tới người có chuyên môn.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n43
  cau: Quy tắc cụ thể (sạc điện thoại ngoài phòng ngủ, không lướt trước giờ ngủ 30–60 phút) là thông lệ thực hành, chưa phải kết quả của nghiên cứu đã kiểm.
  loai: loi-khuyen
  nguon:
    - ten: "Orben & Przybylski (2019), Nat Hum Behav 3(2), 173–182: toàn văn (bản tác giả chấp nhận, kho Oxford ORA); thêm bản tin của OII Oxford (oii.ox.ac.uk) cho tỉ lệ 2,7 và 4,3"
      link: https://doi.org/10.1038/s41562-018-0506-1
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Các con số 30–60 phút không có nguồn đã mở. Chữ cũ: "Quy tắc đơn giản, dễ thực hiện: điện thoại sạc ngoài phòng ngủ, không lướt trước giờ ngủ 30–60 phút." Chữ mới: "Quy tắc cụ thể… là thông lệ thực hành, chưa phải kết quả của nghiên cứu mà chúng tôi đã kiểm." Lý do: Nêu rõ không có nguồn.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n47
  cau: 'Nhãn "Khá vững": chương trình chống bắt nạt ở trường học có hiệu quả ở mức vừa phải.'
  loai: nhan
  nguon:
    - ten: "Ttofi & Farrington (2011), J Exp Criminol 7(1), 27–56: tóm tắt (bản ghi NCJRS của OJP Hoa Kỳ, ojp.gov); không mở được toàn văn (Springer chặn)"
      link: https://doi.org/10.1007/s11292-010-9109-1
    - ten: "Gaffney, Ttofi & Farrington (2019), Aggress Violent Behav 45, 111–133: tóm tắt (Semantic Scholar API)"
      link: https://doi.org/10.1016/j.avb.2018.07.001
    - ten: "Gaffney, Ttofi & Farrington (2021), J Sch Psychol 85, 37–56: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.jsp.2020.12.002
    - ten: "Kärnä và cộng sự (2011), Child Dev 82(1), 311–330: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1111/j.1467-8624.2010.01557.x
    - ten: "Olweus & Limber (2010), Am J Orthopsychiatry 80(1), 124–134: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1111/j.1939-0025.2010.01015.x
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Hai phân tích tổng hợp cách nhau một thập niên đều kết luận các chương trình làm giảm hành vi bắt nạt khoảng 15–20%. Hiệu quả… phụ thuộc vào việc có họp phụ huynh, kỷ luật vững chắc, giám sát sân chơi và triển khai đủ chuyên sâu hay không." Chữ mới: "…khoảng 20% và nạn nhân khoảng 15–20%… thành phần nào quan trọng thì các phân tích chưa hoàn toàn thống nhất (Ttofi và Farrington, 2011; Gaffney và cộng sự, 2021), và các đánh giá OBPP ở Mỹ không đồng nhất". Lý do: Số liệu đúng hơn (bắt nạt ~20%, nạn nhân 15–20%) và nêu sự không thống nhất về thành phần.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n30
  cau: 'Nhãn "Vững chắc": sức khỏe tâm thần tự báo cáo của teen Mỹ xấu đi rõ rệt trong thập kỷ 2010.'
  loai: nhan
  nguon:
    - ten: "CDC (2023), YRBS Data Summary & Trends Report 2011–2021: toàn văn (PDF, cdc.gov)"
      link: https://www.cdc.gov/yrbs/dstr/pdf/YRBS_Data-Summary-Trends_Report2023_508.pdf
    - ten: "CDC (2024), YRBS Data Summary & Trends Report 2013–2023: toàn văn (PDF, cdc.gov; đọc cả biểu đồ)"
      link: https://www.cdc.gov/yrbs/dstr/pdf/YRBS-2023-Data-Summary-Trend-Report.pdf
    - ten: "CDC (2026), Youth Health in Focus: Mental Health and Suicide Risks (trang đề ngày 18/9/2026, đọc 10/11/2026)"
      link: https://www.cdc.gov/yrbs/youth-health-in-focus/mental-health.html
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chỗ khó: thước đo nhãn dựa trên phân tích tổng hợp, ở đây không có; dùng khảo sát giám sát lặp lại. Chữ cũ: "…khủng hoảng là có thật, không phải ảo giác truyền thông." và tiêu đề "sức khỏe tâm thần của teen (Mỹ) xấu đi rõ rệt trong thập kỷ 2010". Chữ mới: "…mức tự báo cáo tăng là có thật, nhưng đó là tự báo cáo triệu chứng, không phải chẩn đoán, và nó chỉ nói về teen Mỹ." Số liệu thêm 2025: 33%. Lý do: Bỏ "khủng hoảng" và "ảo giác truyền thông" (cách nói mạnh); thêm giới hạn và số 2025.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n58
  cau: 'Nhãn "Khá vững": cha mẹ và nhà trường "cùng một phe" (thành phần phụ huynh gắn với hiệu quả lớn hơn).'
  loai: nhan
  nguon:
    - ten: "Ttofi & Farrington (2011), J Exp Criminol 7(1), 27–56: tóm tắt (bản ghi NCJRS của OJP Hoa Kỳ, ojp.gov); không mở được toàn văn (Springer chặn)"
      link: https://doi.org/10.1007/s11292-010-9109-1
    - ten: "Gaffney, Ttofi & Farrington (2021), J Sch Psychol 85, 37–56: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.jsp.2020.12.002
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: Tiêu đề mục 3 (":nhan[kha-vung]") giữ nguyên chip. Chữ mới: Giữ chip; nội dung mục viết lại theo n57 và n59. Lý do: Nhãn nay có co_so và lý do.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n15
  cau: YRBS 2021 và các đợt trước không hỏi về mạng xã hội; đợt 2023 mới thêm câu hỏi về tần suất dùng.
  loai: cong-cu
  nguon:
    - ten: "CDC MMWR Suppl 73(4) (2024), YRBS 2023: các trang su7304a1 (tổng quan) và su7304a3 (mạng xã hội; đọc qua công cụ đọc web)"
      link: https://www.cdc.gov/mmwr/volumes/73/su/su7304a3.htm
  ket_qua_luot_1: da-sua
  ghi_chu: '"Các đợt trước không hỏi" suy ra từ "new questions" của 2023; chưa đọc bảng câu hỏi các đợt trước. Chỗ chưa chắc nhỏ. Chữ cũ: "Lưu ý quan trọng: YRBS không hỏi gì về mạng xã hội" và "YRBS không đo việc dùng mạng xã hội". Chữ mới: "YRBS 2021 và các đợt trước không hỏi gì về nó; riêng đợt 2023 mới thêm câu hỏi về tần suất dùng". Lý do: Sai với 2023: CDC đã thêm câu hỏi về mạng xã hội.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n58
  cau: 'Ngộ nhận "hiệu ứng nhỏ nghĩa là vô hại": "nhỏ ở mức trung bình" không có nghĩa bằng không; các phân tích tổng hợp thấy liên hệ nhỏ nhưng nhất quán; chúng tôi chưa có nguồn nói với một số nhóm hiệu ứng "không hề nhỏ".'
  loai: phat-hien
  nguon:
    - ten: "Teague và cộng sự (2026), JAMA Pediatrics 180(5): trang bài (jamanetwork.com, đọc qua công cụ đọc web); số người tham gia trong bài tự mâu thuẫn nên không dùng"
      link: https://jamanetwork.com/journals/jamapediatrics/fullarticle/2845518
    - ten: "Orben và cộng sự (2022), Nat Commun 13, 1649: toàn văn (PMC8960761)"
      link: https://doi.org/10.1038/s41467-022-29296-3
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Ở quy mô hàng chục triệu teen, hiệu ứng nhỏ vẫn tạo ra số ca đáng kể ở mức cộng đồng; và "trung bình nhỏ" che giấu nhóm dễ tổn thương (tuổi dậy thì, đã có sẵn lo âu/trầm cảm) — với các em, hiệu ứng không hề nhỏ." Chữ mới: "…các phân tích tổng hợp thấy liên hệ nhỏ nhưng nhất quán, và Orben và cộng sự (2022) thấy các độ tuổi mà hiệu ứng rõ hơn một chút. Chúng tôi chưa có nguồn nói rằng với một số nhóm, hiệu ứng "không hề nhỏ"." Lý do: Bỏ tính toán "hàng chục triệu", "lo âu/trầm cảm có sẵn" (không có nguồn đã mở).'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n17
  cau: OECD ghi nhận các nước mà học sinh có động lực thành tích cao cũng thường là nước nhiều học sinh lo âu về bài thi; tần suất kiểm tra không liên quan đến mức lo âu.
  loai: phat-hien
  nguon:
    - ten: "OECD (2017), PISA 2015 Results (Volume III), bản Overview (PDF bản OECD do Viện IBE Ba Lan lưu): toàn văn phần Overview, gồm Hình III.1.2 (bảng chỉ số lo âu theo nước)"
      link: https://doi.org/10.1787/9789264273856-en
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Nói cách khác: học giỏi và lo âu không loại trừ nhau — ở nhiều nơi, chúng đi cùng nhau." Chữ mới: "OECD ghi nhận rằng các nước mà học sinh có động lực thành tích cao cũng thường là nước nhiều học sinh lo âu về bài thi, trong khi tần suất kiểm tra không liên quan đến mức lo âu". Lý do: Nguồn nói về động lực thành tích, không phải "học giỏi".'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n18
  cau: "Orben & Przybylski (2019): phân tích đường cong đặc tả trên ba bộ dữ liệu (Monitoring the Future, YRBS, Millennium Cohort Study), 355.358 vị thành niên (chủ yếu 12–18 tuổi), khảo sát 2007–2016."
  loai: so-lieu
  nguon:
    - ten: "Orben & Przybylski (2019), Nat Hum Behav 3(2), 173–182: toàn văn (bản tác giả chấp nhận, kho Oxford ORA); thêm bản tin của OII Oxford (oii.ox.ac.uk) cho tỉ lệ 2,7 và 4,3"
      link: https://doi.org/10.1038/s41562-018-0506-1
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…tổng cộng 355.358 vị thành niên, dữ liệu 2007–2016. … chạy mọi đặc tả phân tích hợp lý và báo cáo toàn bộ". Chữ mới: "…355.358 vị thành niên (chủ yếu 12–18 tuổi), khảo sát trong các năm 2007–2016… chạy nhiều đặc tả phân tích hợp lý và báo cáo kết quả". Lý do: "Mọi" và "toàn bộ" mạnh hơn nguồn (nguồn nói SCA áp dụng cho các đặc tả hợp lý).'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n19
  cau: Việt Nam không có số liệu cho chỉ số lo âu liên quan đến bài vở trong báo cáo PISA 2015 (Tập III).
  loai: so-lieu
  nguon:
    - ten: "OECD (2017), PISA 2015 Results (Volume III), bản Overview (PDF bản OECD do Viện IBE Ba Lan lưu): toàn văn phần Overview, gồm Hình III.1.2 (bảng chỉ số lo âu theo nước)"
      link: https://doi.org/10.1787/9789264273856-en
  ket_qua_luot_1: dung
  ghi_chu: Đây là nội dung của báo cáo 2017, không phải khẳng định thời sự về tình trạng hiện nay.
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n1
  cau: "Mô tả: tranh luận Haidt (2024) và Orben & Przybylski (2019), hiệu ứng lên sức khỏe tâm thần teen, tương quan có phải nhân quả, dữ liệu CDC YRBS, và số liệu quốc gia của Việt Nam."
  loai: phat-hien
  nguon:
    - ten: "Orben & Przybylski (2019), Nat Hum Behav 3(2), 173–182: toàn văn (bản tác giả chấp nhận, kho Oxford ORA); thêm bản tin của OII Oxford (oii.ox.ac.uk) cho tỉ lệ 2,7 và 4,3"
      link: https://doi.org/10.1038/s41562-018-0506-1
    - ten: "CDC (2024), YRBS Data Summary & Trends Report 2013–2023: toàn văn (PDF, cdc.gov; đọc cả biểu đồ)"
      link: https://www.cdc.gov/yrbs/dstr/pdf/YRBS-2023-Data-Summary-Trend-Report.pdf
    - ten: "NAMHS (2024), Lancet: Prevalence of adolescent mental disorders in Kenya, Indonesia, and Viet Nam: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0140-6736(23)02641-7
  ket_qua_luot_1: da-sua
  ghi_chu: 'Mô tả khớp nội dung trang sau khi sửa. Chữ cũ: "…và dữ liệu CDC YRBS nói gì." Chữ mới: "…dữ liệu CDC YRBS nói gì, và số liệu quốc gia của Việt Nam." Lý do: Trang nay có số liệu NAMHS (Việt Nam).'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n19
  cau: "Liên hệ giữa dùng công nghệ số và sức khỏe tinh thần là âm nhưng rất nhỏ: giải thích tối đa 0,4% phương sai; tác giả kết luận hiệu ứng quá nhỏ để biện minh cho thay đổi chính sách."
  loai: phat-hien
  nguon:
    - ten: "Orben & Przybylski (2019), Nat Hum Behav 3(2), 173–182: toàn văn (bản tác giả chấp nhận, kho Oxford ORA); thêm bản tin của OII Oxford (oii.ox.ac.uk) cho tỉ lệ 2,7 và 4,3"
      link: https://doi.org/10.1038/s41562-018-0506-1
  ket_qua_luot_1: dung
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n35
  cau: "van Geel và cộng sự (2014): bị bạn bè ức hiếp liên quan đến ý nghĩ tự tử (OR 2,23) và hành vi tự tử (OR 2,55); bắt nạt mạng liên quan đến ý nghĩ tự tử mạnh hơn bắt nạt truyền thống."
  loai: so-lieu
  nguon:
    - ten: "van Geel, Vedder & Tanilon (2014), JAMA Pediatr 168(5), 435–442: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1001/jamapediatrics.2013.4143
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…ý nghĩ tự tử cao gấp khoảng 2,2 lần và hành vi tự tử gấp khoảng 2,5 lần — và liên hệ giữa bắt nạt mạng với ý nghĩ tự tử (OR = 3,1) còn mạnh hơn có ý nghĩa thống kê so với bắt nạt truyền thống (OR = 2,2)." Chữ mới: "…OR 2,23… OR 2,55… bắt nạt mạng liên quan đến ý nghĩ tự tử mạnh hơn bắt nạt truyền thống". Lý do: OR 3,1 và 2,2 cho hai dạng không có trong tóm tắt; "cao gấp 2,2 lần" diễn giải sai OR thành nguy cơ.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n22
  cau: OBPP là chương trình toàn trường, thiết kế để giảm bắt nạt và cải thiện quan hệ bạn bè ở học sinh tiểu học, THCS.
  loai: dinh-nghia
  nguon:
    - ten: "Olweus & Limber (2010), Am J Orthopsychiatry 80(1), 124–134: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1111/j.1939-0025.2010.01015.x
  ket_qua_luot_1: dung
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n10
  cau: Theo UNESCO, học sinh thường xuyên bị bắt nạt có nguy cơ cảm thấy bị xa lánh cao gần gấp ba lần và vắng mặt ở trường cao hơn gấp đôi so với các bạn khác.
  loai: so-lieu
  nguon:
    - ten: Bản tin của Liên Hợp Quốc (01/2019) về báo cáo UNESCO "Behind the numbers" (news.un.org); không mở được bản gốc của UNESCO (unesdoc chặn bot)
      link: https://news.un.org/en/story/2019/01/1031052
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "…nguy cơ cảm thấy mình là "người ngoài" ở trường cao gần gấp ba lần và vắng mặt ở trường cao hơn gấp đôi so với các bạn không bị bắt nạt (UNESCO, 2019)." Chữ mới: "…cảm thấy bị xa lánh cao gần gấp ba lần và vắng mặt ở trường cao hơn gấp đôi so với các bạn khác." Lý do: Theo chữ của bản tin ("shunned"); so với "các bạn khác", không phải "các bạn không bị bắt nạt".'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n11
  cau: "YRBS 2023: buồn bã dai dẳng 40% (nữ 53%, nam 28%), 30% năm 2013 (nữ 39% năm 2013); LGBTQ+ 65% (2023)."
  loai: so-lieu
  nguon:
    - ten: "CDC (2024), YRBS Data Summary & Trends Report 2013–2023: toàn văn (PDF, cdc.gov; đọc cả biểu đồ)"
      link: https://www.cdc.gov/yrbs/dstr/pdf/YRBS-2023-Data-Summary-Trend-Report.pdf
  ket_qua_luot_1: dung
  ghi_chu: 'Trang cũ "40% (nữ 53%) so với 30% của năm 2013": khớp.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n41
  cau: Điểm stress học tập trung bình của 341 em tăng từ 46,4 (2018) lên 53,5 (2021).
  loai: so-lieu
  nguon:
    - ten: "Trần và cộng sự (2024), J Rural Med 19(4), 279–290: toàn văn (PMC11442093)"
      link: https://doi.org/10.2185/jrm.2024-012
  ket_qua_luot_1: dung
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n54
  cau: Chương trình KiVa của Phần Lan nhấn mạnh vai trò của người chứng kiến.
  loai: dinh-nghia
  nguon:
    - ten: "Marano và cộng sự (2026), Front Child Adolesc Psychiatry 5, 1895435: toàn văn (PMC13408263); tổng quan thứ cấp, dùng để mô tả KiVa"
      link: https://doi.org/10.3389/frcha.2026.1895435
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…các chương trình hiệu quả như KiVa của Phần Lan nhắm vào người chứng kiến: dạy cả lớp cách không cổ vũ và dám bảo vệ bạn." Chữ mới: "…chương trình KiVa của Phần Lan nhấn mạnh vai trò của người chứng kiến (theo một tổng quan năm 2026)." Lý do: Bỏ mô tả nội dung huấn luyện (không kiểm được).'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n44
  cau: 'Nhãn "Khá vững": giấc ngủ đủ liên hệ với sức khỏe tinh thần mạnh hơn thời gian dùng màn hình.'
  loai: nhan
  nguon:
    - ten: "Orben & Przybylski (2019), Nat Hum Behav 3(2), 173–182: toàn văn (bản tác giả chấp nhận, kho Oxford ORA); thêm bản tin của OII Oxford (oii.ox.ac.uk) cho tỉ lệ 2,7 và 4,3"
      link: https://doi.org/10.1038/s41562-018-0506-1
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: ":nhan[vung-chac]" cho "Bảo vệ giấc ngủ là can thiệp rẻ và chắc chắn nhất". Chữ mới: ":nhan[kha-vung]" cho "Bảo vệ giấc ngủ là một việc đáng làm". Lý do: Chỉ có liên hệ quan sát từ một bài; không đạt "Vững chắc".'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n81
  cau: '"Cho con học thêm càng nhiều càng tốt" không có bằng chứng ủng hộ trong nghiên cứu ở Huế, nơi đi học thêm gắn với stress học tập cao hơn.'
  loai: phat-hien
  nguon:
    - ten: "Trần và cộng sự (2024), J Rural Med 19(4), 279–290: toàn văn (PMC11442093)"
      link: https://doi.org/10.2185/jrm.2024-012
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…"càng nhiều càng tốt" là một niềm tin chưa có bằng chứng — và cái giá có thể là giấc ngủ, sức khỏe tinh thần của con." Chữ mới: "…"càng nhiều càng tốt" không có bằng chứng ủng hộ trong nghiên cứu này." Lý do: Bỏ vế "cái giá là giấc ngủ, sức khỏe tinh thần" (nghiên cứu Huế không thấy liên hệ của giấc ngủ/lối sống với stress).'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n83
  cau: 'Các liên kết "Đọc thêm" (Tuổi teen: mình là ai?; Não tuổi teen khác gì não người lớn?; Khi nào nên tìm sự giúp đỡ chuyên môn?) trỏ tới trang của site.'
  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: "Chỗ cần chú ý: trong worktree chỉ có phat-trien/ban-sac-tuoi-teen.md; kham-pha/co-so-sinh-hoc/nao-tuoi-teen và kham-pha/suc-khoe-tam-than/tim-giup-do chưa có (lô khác). Link không đổi so với trước; kiểm khi gom nhánh."
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n52
  cau: "Dam và cộng sự (2023): khảo sát trực tuyến 1.891 người tham gia ở Hà Nội, Tuyên Quang, Cần Thơ (9–10/2021; tuổi trung bình 17); 98,4% dùng mạng xã hội; FOMO càng cao thì PHQ-9 càng cao; FOMO và dùng Internet có vấn đề đi kèm tự hại/tự tử."
  loai: so-lieu
  nguon:
    - ten: "Dam và cộng sự (2023), PLOS ONE 18(6), e0286766: toàn văn (PMC10246797)"
      link: https://doi.org/10.1371/journal.pone.0286766
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…khảo sát trực tuyến 1.891 vị thành niên ở Hà Nội, Tuyên Quang và Cần Thơ…: FOMO và việc dùng Internet có vấn đề cùng đi kèm nguy cơ tự hại/tự tử cao hơn." Chữ mới: "…khảo sát trực tuyến 1.891 người tham gia… (tháng 9–10/2021; tuổi trung bình 17)… đi kèm với tự hại/tự tử." Lý do: "Vị thành niên" → "người tham gia" (tuổi trung bình 17, SD 2,8); bỏ "nguy cơ cao hơn" (nguồn nói "yếu tố dương").'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n36
  cau: Các nghiên cứu được tổng hợp là cắt ngang nên không cho biết chiều nhân quả; phần lớn học sinh bị bắt nạt không đi đến bước đường cùng; bắt nạt không phải "chuyện trẻ con".
  loai: phat-hien
  nguon:
    - ten: "Holt và cộng sự (2015), Pediatrics 135(2), e496–e509: toàn văn (PMC4702491)"
      link: https://doi.org/10.1542/peds.2014-1864
    - ten: "Ttofi và cộng sự (2011), J Aggress Confl Peace Res 3(2), 63–73: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1108/17596591111132873
  ket_qua_luot_1: da-lam-mem
  ghi_chu: '"Phần lớn học sinh… không đi đến bước đường cùng" là suy ra từ cỡ hiệu ứng (OR không phải xác suất tuyệt đối), nguồn không nêu tỉ lệ trực tiếp. Chữ cũ: "Đây là mối liên hệ tương quan, không phải "bị bắt nạt thì sẽ..."." Chữ mới: "Đây là mối liên hệ… Các nghiên cứu được tổng hợp là cắt ngang nên không cho biết chiều nhân quả…" Lý do: Thêm lý do theo nguồn.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n4
  cau: Theo định nghĩa trong sách của Olweus (1993), một học sinh bị bắt nạt khi em bị phơi nhiễm, lặp đi lặp lại và kéo dài, trước những hành động tiêu cực của một hoặc nhiều học sinh khác, trong quan hệ chênh lệch sức mạnh.
  loai: dinh-nghia
  nguon:
    - ten: "Holt và cộng sự (2015), Pediatrics 135(2), e496–e509: toàn văn (PMC4702491)"
      link: https://doi.org/10.1542/peds.2014-1864
    - ten: "Olweus (2013), Annu Rev Clin Psychol 9, 751–780: tóm tắt (Europe PMC); không mở được toàn văn"
      link: https://doi.org/10.1146/annurev-clinpsy-050212-185516
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chỗ chưa mở: lời nguyên văn của Olweus (1993, sách) chỉ kiểm qua mô tả thứ cấp (kết quả tìm kiếm, không phải trang đã mở); Holt (2015) xác nhận ba nét cốt lõi của định nghĩa CDC. Lượt 2 nên tìm toàn văn. Chữ cũ: "…do nhà tâm lý học người Na Uy Dan Olweus — người tiên phong nghiên cứu lĩnh vực này từ những năm 1970 — đề xuất: một học sinh bị bắt nạt khi em bị phơi nhiễm… (Olweus, 1993)". Chữ mới: "…bắt nguồn từ công trình của nhà tâm lý học Dan Olweus. Theo định nghĩa trong sách của ông (Olweus, 1993; chúng tôi không mở được sách gốc)… Định nghĩa thống nhất của CDC cũng gồm ba nét cốt lõi (Holt và cộng sự, 2015)". Lý do: Bỏ quốc tịch và "từ những năm 1970" (không kiểm được); nêu rõ chưa mở sách.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n20
  cau: Olweus kể lại cách mối quan tâm và nghiên cứu của ông về bắt nạt bắt đầu, và cho rằng bị bắt nạt không chỉ là chuyện vô hại, thoáng qua (Olweus, 2013).
  loai: lich-su
  nguon:
    - ten: "Olweus (2013), Annu Rev Clin Psychol 9, 751–780: tóm tắt (Europe PMC); không mở được toàn văn"
      link: https://doi.org/10.1146/annurev-clinpsy-050212-185516
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chỉ đọc tóm tắt. Chữ cũ: "Dan Olweus bắt đầu nghiên cứu tình trạng học sinh ức hiếp nhau ở Thụy Điển/Na Uy từ đầu thập niên 1970… Cuốn sách đầu tiên của ông, Aggression in the Schools (1978), là công trình khoa học có hệ thống đầu tiên về chủ đề này; đến Bullying at School (1993), ông hệ thống hóa định nghĩa ba tiêu chí…" Chữ mới: "Dan Olweus là nhà nghiên cứu đã gắn tên mình với việc nghiên cứu bắt nạt học đường và với [OBPP]; năm 2013 ông kể lại cách mối quan tâm và nghiên cứu của mình về bắt nạt bắt đầu, và cho rằng việc bị bắt nạt không chỉ là chuyện "vô hại, thoáng qua"." Lý do: Không kiểm được thời điểm, nơi, lý do ban đầu, "đầu tiên"; chỉ giữ điều tóm tắt 2013 nói.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n39
  cau: Dữ liệu cắt ngang không cho biết chiều nhân quả; dữ liệu dọc cho thấy cả hai chiều tồn tại (dùng nhiều → hài lòng giảm nhẹ; hài lòng giảm → dùng nhiều); các phân tích tổng hợp thấy liên hệ nhỏ hoặc không đáng kể và bằng chứng thực nghiệm còn lẫn lộn (Orben và cộng sự, 2022); muốn kết luận nhân quả cần can thiệp.
  loai: phat-hien
  nguon:
    - ten: "Orben và cộng sự (2022), Nat Commun 13, 1649: toàn văn (PMC8960761)"
      link: https://doi.org/10.1038/s41467-022-29296-3
    - ten: "Orben, Dienlin & Przybylski (2019), PNAS 116(21), 10226–10228: toàn văn (PMC6534991)"
      link: https://doi.org/10.1073/pnas.1902058116
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Hầu hết dữ liệu là cắt ngang… buồn cũng dẫn đến dùng nhiều hơn (trốn tránh, tìm đồng cảm)… loại nghiên cứu này còn rất ít." Chữ mới: "Dữ liệu cắt ngang… Dữ liệu dọc… cho thấy cả hai chiều đều tồn tại… Theo Orben và cộng sự (2022), các phân tích tổng hợp thấy liên hệ nhỏ hoặc không đáng kể và bằng chứng thực nghiệm còn lẫn lộn". Lý do: Bỏ "trốn tránh, tìm đồng cảm" (cơ chế, không kiểm được) và "còn rất ít" (nguồn nói "mixed").'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n21
  cau: (Đã bỏ) Olweus bắt đầu nghiên cứu từ đầu thập niên 1970 sau một số vụ học sinh tự tử; sách 1978 là công trình khoa học có hệ thống đầu tiên về chủ đề; OBPP là chương trình can thiệp toàn trường đầu tiên trên thế giới.
  loai: lich-su
  nguon: []
  ket_qua_luot_1: da-bo
  ghi_chu: 'Không có nguồn đã mở nói ba điều này (sách không mở được). Chữ cũ: "…từ đầu thập niên 1970, sau một số vụ học sinh tự tử được cho là liên quan đến việc bị bắt nạt… là công trình khoa học có hệ thống đầu tiên… chương trình can thiệp toàn trường đầu tiên trên thế giới." Chữ mới: (bỏ) Lý do: Không kiểm được; liên quan đến chủ đề tự tử nên càng không để câu chưa kiểm.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n21
  cau: Trong bộ YRBS, bị bắt nạt có liên hệ tiêu cực với sức khỏe tinh thần gấp 4,3 lần và hút cần sa gấp 2,7 lần so với mức liên hệ của công nghệ số; ngủ đủ và ăn sáng có liên hệ tích cực hơn hẳn.
  loai: so-lieu
  nguon:
    - ten: "Orben & Przybylski (2019), Nat Hum Behav 3(2), 173–182: toàn văn (bản tác giả chấp nhận, kho Oxford ORA); thêm bản tin của OII Oxford (oii.ox.ac.uk) cho tỉ lệ 2,7 và 4,3"
      link: https://doi.org/10.1038/s41562-018-0506-1
  ket_qua_luot_1: da-sua
  ghi_chu: 'Tỉ lệ 4,3 = 0,212/0,049; 2,7 = 0,132/0,049 (tính lại). Hệ số của giấc ngủ và ăn sáng dương. Chữ cũ: "bị bắt nạt có liên hệ tiêu cực gấp 4,3 lần, hút cần sa gấp 2,7 lần" (không nêu so với cái gì, bộ dữ liệu nào). Chữ mới: "…(trong bộ YRBS) bị bắt nạt có liên hệ tiêu cực với sức khỏe tinh thần gấp 4,3 lần và hút cần sa gấp 2,7 lần so với mức liên hệ của công nghệ số". Lý do: Nêu rõ mẫu số và bộ dữ liệu.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n31
  cau: Gaffney, Ttofi và Farrington (2021) thấy cách tiếp cận toàn trường, chính sách chống bắt nạt, nội quy lớp học, thông tin cho phụ huynh, sự tham gia không chính thức của bạn bè và làm việc với nạn nhân gắn với hiệu quả lớn hơn; số lượng thành phần không liên quan đến hiệu quả.
  loai: phat-hien
  nguon:
    - ten: "Gaffney, Ttofi & Farrington (2021), J Sch Psychol 85, 37–56: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.jsp.2020.12.002
  ket_qua_luot_1: dung
  ghi_chu: Câu mới thêm (Gaffney 2021 là nguồn bắt buộc của lời giao).
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n36
  cau: 'Nhãn "Đã bị bác bỏ": "mạng xã hội hoàn toàn vô hại với teen".'
  loai: nhan
  nguon:
    - ten: "Teague và cộng sự (2026), JAMA Pediatrics 180(5): trang bài (jamanetwork.com, đọc qua công cụ đọc web); số người tham gia trong bài tự mâu thuẫn nên không dùng"
      link: https://jamanetwork.com/journals/jamapediatrics/fullarticle/2845518
    - ten: "Orben và cộng sự (2022), Nat Commun 13, 1649: toàn văn (PMC8960761)"
      link: https://doi.org/10.1038/s41467-022-29296-3
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…cửa sổ nhạy cảm quanh tuổi dậy thì (nữ 11–13, nam 14–15) có bằng chứng dọc; nội dung độc hại (bắt nạt mạng, nội dung cổ vũ tự hại, so sánh ngoại hình) là rủi ro thật với nhóm dễ tổn thương." Chữ mới: "…phân tích tổng hợp 2026 thấy mạng xã hội liên hệ nhất quán với trầm cảm và ý nghĩ tự hại ở mức nhỏ (r = 0,09–0,21), và Orben và cộng sự (2022) thấy một nghiên cứu dọc có các độ tuổi…". Lý do: Bỏ "nội dung độc hại… rủi ro thật" (không có nguồn đã mở); thay bằng nguồn đọc được.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n26
  cau: "Orben và cộng sự (2022): 84.011 người Anh 10–80 tuổi (cắt ngang) và 17.409 người 10–21 tuổi theo dõi dọc, tìm độ tuổi mà dùng mạng xã hội nhiều dự báo hài lòng giảm một năm sau."
  loai: so-lieu
  nguon:
    - ten: "Orben và cộng sự (2022), Nat Commun 13, 1649: toàn văn (PMC8960761)"
      link: https://doi.org/10.1038/s41467-022-29296-3
  ket_qua_luot_1: dung
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n42
  cau: "Các yếu tố đo ở đợt đầu gắn với stress cao hơn ở đợt sau: là nữ, điểm thấp hơn, đi học thêm, nhiều anh chị em hơn, cha có học vấn cao hơn; các yếu tố lối sống không liên quan."
  loai: phat-hien
  nguon:
    - ten: "Trần và cộng sự (2024), J Rural Med 19(4), 279–290: toàn văn (PMC11442093)"
      link: https://doi.org/10.2185/jrm.2024-012
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Các yếu tố gắn với stress cao hơn gồm: là nữ, điểm số thấp hơn, đi học thêm, đông anh chị em, và cha có trình độ học vấn cao hơn." Chữ mới: Danh sách như cũ, thêm "đo ở đợt đầu… ở đợt sau" và "các yếu tố lối sống không liên quan". Lý do: Nêu rõ thiết kế (yếu tố đầu kỳ liên quan stress cuối kỳ) và kết quả âm tính.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n17
  cau: Dữ liệu 2021 thu thập mùa thu 2021, giữa đại dịch; các chỉ số như buồn bã dai dẳng đã tăng từ 30% (2013) lên 37% (2019) trước 2021.
  loai: so-lieu
  nguon:
    - ten: "CDC MMWR Suppl 73(4) (2024), YRBS 2023: các trang su7304a1 (tổng quan) và su7304a3 (mạng xã hội; đọc qua công cụ đọc web)"
      link: https://www.cdc.gov/mmwr/volumes/73/su/su7304a3.htm
    - ten: "CDC (2024), YRBS Data Summary & Trends Report 2013–2023: toàn văn (PDF, cdc.gov; đọc cả biểu đồ)"
      link: https://www.cdc.gov/yrbs/dstr/pdf/YRBS-2023-Data-Summary-Trend-Report.pdf
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…nhưng CDC nhấn mạnh nhiều chỉ số đã xấu đi từ trước COVID." Chữ mới: "…báo cáo của CDC nêu nhiều chỉ số xấu đi từ 2013 đến 2023, và ở nhiều chỉ số (như buồn bã dai dẳng) số liệu đã tăng từ trước 2021 (30% năm 2013, 37% năm 2019)." Lý do: CDC không "nhấn mạnh" trước COVID; câu mới dựa trên số liệu bảng.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n6
  cau: Trong 47 nghiên cứu mà Holt và cộng sự tổng hợp, chỉ khoảng một phần tư (12) cố đánh giá chênh lệch quyền lực, nên số liệu giữa các nghiên cứu khó so sánh.
  loai: so-lieu
  nguon:
    - ten: "Holt và cộng sự (2015), Pediatrics 135(2), e496–e509: toàn văn (PMC4702491)"
      link: https://doi.org/10.1542/peds.2014-1864
  ket_qua_luot_1: dung
  ghi_chu: '"Khó so sánh" là suy ra của trang từ chuyện các nghiên cứu đo khác nhau; Holt cũng nêu vấn đề tương tự ở phần Discussion.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n24
  cau: 'Hiệu ứng nhỏ, hai chiều và "tầm thường": dùng mạng xã hội nhiều dự báo hài lòng cuộc sống giảm nhẹ (β −0,04 đến −0,09 ở các mục có ý nghĩa; hệ số trung vị −0,05), hài lòng giảm dự báo dùng nhiều hơn (−0,02); ở nữ rõ hơn ở nam.'
  loai: phat-hien
  nguon:
    - ten: "Orben, Dienlin & Przybylski (2019), PNAS 116(21), 10226–10228: toàn văn (PMC6534991)"
      link: https://doi.org/10.1073/pnas.1902058116
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…(β từ -0,04 đến -0,09), nhưng chiều ngược lại cũng đúng… Hiệu ứng ở nữ hơi rõ hơn nam, nhưng vẫn nhỏ". Chữ mới: "…(β từ -0,04 đến -0,09 ở các mục hài lòng có ý nghĩa; hệ số trung vị -0,05)… (hệ số trung vị -0,02). Hiệu ứng ở nữ hơi rõ hơn nam (nữ có tác động ở hầu hết các mục hài lòng, nam chỉ ở hai)". Lý do: Thêm hệ số trung vị và mô tả sự khác biệt giới theo nguồn.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n6
  cau: "Theo mô tả của sách, Haidt nêu bốn tổn hại nền tảng: tước đoạt xã hội, thiếu ngủ, phân mảnh chú ý và nghiện; đây là các giả thuyết cơ chế của Haidt."
  loai: lich-su
  nguon:
    - ten: 'Wikipedia, "The Anxious Generation" (bậc 3: chỉ để xác nhận bốn tổn hại, mốc 2010–2015 và các phản biện; không dùng làm nguồn duy nhất)'
      link: https://en.wikipedia.org/wiki/The_Anxious_Generation
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chỗ chưa chắc: chỉ xác nhận qua nguồn bậc 3; sách không mở được. Lượt 2 nên tìm nguồn bậc 1–2. Chữ cũ: "Haidt liệt kê bốn tổn hại nền tảng… (1) tước đoạt xã hội — tương tác trực tiếp bị thay bằng kết nối nông trên mạng; (2) thiếu ngủ — dùng điện thoại khuya; (3) phân mảnh chú ý — thông báo liên tục; (4) nghiện — thuật toán tối ưu cho thời gian dùng." (và ở mục Lý thuyết: ánh sáng xanh, rèn não chuyển đổi tác vụ…) Chữ mới: "Theo mô tả của sách (chúng tôi không mở được sách gốc), Haidt nêu bốn tổn hại nền tảng: … Đây là các giả thuyết cơ chế của Haidt; chúng tôi chưa kiểm các cơ chế cụ thể bằng nguồn riêng." Lý do: Bỏ các mô tả chi tiết cơ chế (không có nguồn đã mở).'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n65
  cau: 'Nhãn "Khá vững": lo âu về thi cử đi cùng thành tích thấp hơn, ở mức liên hệ nhỏ đến vừa; chúng tôi không có nguồn cho việc căng thẳng vừa phải có lợi cho thi cử.'
  loai: nhan
  nguon:
    - ten: "von der Embse và cộng sự (2018), J Affect Disord 227, 483–493: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.jad.2017.11.048
    - ten: "OECD (2017), PISA 2015 Results (Volume III), bản Overview (PDF bản OECD do Viện IBE Ba Lan lưu): toàn văn phần Overview, gồm Hình III.1.2 (bảng chỉ số lo âu theo nước)"
      link: https://doi.org/10.1787/9789264273856-en
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: Tiêu đề mục 4 "Quản lý áp lực thi cử: phân biệt "lo âu vừa phải" với "lo âu độc hại"" và "Một chút căng thẳng trước kỳ thi là bình thường và thậm chí giúp tập trung." Chữ mới: Tiêu đề "Áp lực thi cử: khi nào cần để ý" (giữ id cũ); "Chúng tôi không có nguồn cho việc một mức căng thẳng "vừa phải" có lợi cho thi cử." Lý do: Không có nguồn đã mở cho Yerkes–Dodson trong bối cảnh thi cử; von der Embse thấy liên hệ âm.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n37
  cau: Nếu bị bắt nạt kéo dài và quá sức chịu đựng, hãy nói với người lớn tin cậy hoặc tìm người có chuyên môn; xin giúp đỡ là dấu hiệu của sức mạnh. Nếu nghĩ đến việc tự làm hại mình, hãy nói ngay với người có chuyên môn; xem Hỗ trợ.
  loai: loi-khuyen
  nguon:
    - ten: "Ttofi và cộng sự (2011), J Aggress Confl Peace Res 3(2), 63–73: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1108/17596591111132873
  ket_qua_luot_1: da-sua
  ghi_chu: 'Lời dẫn an toàn theo yêu cầu của lời giao (chỉ nói nên tìm người có chuyên môn và dẫn Hỗ trợ), không phải nhận định khoa học; không có nguồn nghiên cứu riêng. Nội dung không có chi tiết về cách tự hại. Chữ cũ: "…hãy nói ra với một người lớn mà bạn tin tưởng — cha mẹ, thầy cô — hoặc tìm đến dịch vụ hỗ trợ tâm lý… Nếu bạn hoặc người thân đang nghĩ đến việc tự làm hại mình, hãy gọi 115." Chữ mới: "…hoặc tìm người có chuyên môn… Nếu bạn hoặc người thân đang nghĩ đến việc tự làm hại mình, hãy nói ngay với người có chuyên môn; xem [Hỗ trợ](/psyche/ho-tro/) để biết nơi liên hệ." Lý do: Theo lời giao: dẫn Hỗ trợ thay vì chỉ một số điện thoại không kiểm ở trang này.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n3
  cau: 'Haidt xuất bản năm 2024 cuốn The Anxious Generation, luận điểm: sự trỗi dậy của smartphone và mạng xã hội cùng sự suy giảm tự lập và chơi tự do đã "đại tu sửa" tuổi thơ và gây ra khủng hoảng sức khỏe tâm thần ở trẻ em và teen.'
  loai: lich-su
  nguon:
    - ten: "Trang chính thức của sách (anxiousgeneration.com): trang book và resources/four-norms (đọc qua công cụ đọc web); sách không mở được"
      link: https://www.anxiousgeneration.com/resources/four-norms
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chỉ đọc trang web chính thức của sách, không đọc sách. Chữ cũ: "Jonathan Haidt, nhà tâm lý học xã hội tại Đại học New York, xuất bản năm 2024… từ khoảng 2010–2015, tuổi thơ của trẻ em phương Tây đã bị "đại tu sửa"… từ tuổi thơ chơi tự do ngoài đời thực sang tuổi thơ gắn với điện thoại." Chữ mới: "Nhà tâm lý học Jonathan Haidt xuất bản năm 2024… sự trỗi dậy của smartphone và mạng xã hội, cùng với sự suy giảm tự lập và chơi tự do, đã "đại tu sửa" tuổi thơ… Ông nói về giai đoạn biến đổi 2010–2015." Lý do: Bỏ "nhà tâm lý học xã hội tại ĐH New York" và "trẻ em phương Tây" (không có trong nguồn đã mở); theo chữ của trang sách.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n13
  cau: "Tính đến 11/2026, số liệu mới nhất của CDC là năm 2025: buồn bã dai dẳng 33% (nữ 43%, nam 24%), thấp hơn 2023."
  loai: thoi-su
  nguon:
    - ten: "CDC (2026), Youth Health in Focus: Mental Health and Suicide Risks (trang đề ngày 18/9/2026, đọc 10/11/2026)"
      link: https://www.cdc.gov/yrbs/youth-health-in-focus/mental-health.html
  ket_qua_luot_1: dung
  ghi_chu: 'Trích: "2025: 33% total, 24% male, 43% female" (trang Youth Health in Focus, đề 18/9/2026; cập nhật 14/8/2026). YRBS đợt sau là 2027 (hai năm một lần), nên đặt hạn 2027-11. Câu mới thêm.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n68
  cau: 'Nhãn "Vững chắc": nhận diện đúng bằng ba câu hỏi (chủ ý gây hại, lặp lại, chênh lệch quyền lực).'
  loai: nhan
  nguon:
    - ten: "Holt và cộng sự (2015), Pediatrics 135(2), e496–e509: toàn văn (PMC4702491)"
      link: https://doi.org/10.1542/peds.2014-1864
    - ten: "Olweus (2013), Annu Rev Clin Psychol 9, 751–780: tóm tắt (Europe PMC); không mở được toàn văn"
      link: https://doi.org/10.1146/annurev-clinpsy-050212-185516
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Nếu cả ba đều "có", đó là bắt nạt — và cần can thiệp nghiêm túc, không phải "khuyên hai bên làm hòa" cho xong." Chữ mới: "…cần được nhà trường, gia đình xử lý nghiêm túc. Ba câu hỏi này là cách áp dụng định nghĩa nêu ở trên, không phải công cụ chẩn đoán." Lý do: Bỏ "không phải khuyên hai bên làm hòa" (không có nguồn).'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n71
  cau: (Đã bỏ) Kỳ thi tốt nghiệp THPT gắn với tuyển sinh đại học ở Việt Nam mang tính định đoạt cao; Hàn Quốc có kỳ thi suneung cả nước điều chỉnh giờ bay; Singapore đứng đầu PISA 2015 về lo âu bài vở.
  loai: phat-hien
  nguon: []
  ket_qua_luot_1: da-bo
  ghi_chu: 'Không có nguồn đã mở; vế Singapore sai (xem n15). Chữ cũ: Đoạn "Kỳ thi "một cửa"…" (kỳ thi một buổi sáng quyết định lối rẽ; suneung; Singapore đứng đầu PISA về lo âu; "Điểm chung của các nền giáo dục Đông Á… động lực cao đi cùng lo âu rất cao"). Chữ mới: (thay bằng đoạn "So sánh quốc tế": Việt Nam không có số liệu PISA 2015 cho chỉ số này; động lực cao và lo âu đi cùng nhau ở cấp nước theo OECD). Lý do: Không kiểm được; vế Singapore sai.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n10
  cau: "YRBS 2021: 22% từng nghiêm túc nghĩ đến tự tử (nữ 30%, nam 14%; nữ năm 2011: 19%); 10% đã từng cố tự tử."
  loai: so-lieu
  nguon:
    - ten: "CDC (2023), YRBS Data Summary & Trends Report 2011–2021: toàn văn (PDF, cdc.gov)"
      link: https://www.cdc.gov/yrbs/dstr/pdf/YRBS_Data-Summary-Trends_Report2023_508.pdf
  ket_qua_luot_1: dung
  ghi_chu: 'Câu hỏi: "trong 12 tháng qua", tự báo cáo.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n89
  cau: 'NAMHS (đại diện quốc gia, 10–17 tuổi, dữ liệu 2021): 1,2% vị thành niên Việt Nam báo cáo bị bắt nạt trong ba tháng qua và 0,8% bắt nạt người khác; bị bắt nạt gắn với rối loạn tâm thần đánh giá bằng phỏng vấn chẩn đoán (aOR 4,71; KTC 1,82–12,21); các con số thấp xa mức "gần một phần ba" của UNESCO, có thể do định nghĩa và cách đo khác nhau.'
  loai: so-lieu
  nguon:
    - ten: "Findings từ NAMHS (2025), Child Adolesc Psychiatry Ment Health: tóm tắt (Europe PMC, PMC12312254)"
      link: https://doi.org/10.1186/s13034-025-00922-4
  ket_qua_luot_1: dung
  ghi_chu: Câu mới thêm sau khi tìm số liệu quốc gia (Europe PMC 10/11/2026). Vế "có thể do định nghĩa và cách đo" là suy luận của trang, đã ghi "có thể"; khoảng thời gian 3 tháng so với "tháng trước" của UNESCO là khác biệt thật.
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n46
  cau: 'Nhãn "Vững chắc": bị bắt nạt gắn liền với trầm cảm về sau và với ý nghĩ tự tử.'
  loai: nhan
  nguon:
    - ten: "Ttofi và cộng sự (2011), J Aggress Confl Peace Res 3(2), 63–73: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1108/17596591111132873
    - ten: "Holt và cộng sự (2015), Pediatrics 135(2), e496–e509: toàn văn (PMC4702491)"
      link: https://doi.org/10.1542/peds.2014-1864
    - ten: "van Geel, Vedder & Tanilon (2014), JAMA Pediatr 168(5), 435–442: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1001/jamapediatrics.2013.4143
    - ten: Bản tin của Liên Hợp Quốc (01/2019) về báo cáo UNESCO "Behind the numbers" (news.un.org); không mở được bản gốc của UNESCO (unesdoc chặn bot)
      link: https://news.un.org/en/story/2019/01/1031052
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: Tiêu đề khung: "bị bắt nạt gắn liền với lo âu, trầm cảm và kết quả học tập kém hơn" và "đã được tái hiện nhất quán qua hàng trăm nghiên cứu". Chữ mới: "bị bắt nạt gắn liền với trầm cảm về sau và với ý nghĩ tự tử" kèm OR và nguồn. Lý do: Không mở được nguồn cho "lo âu" và "kết quả học tập kém hơn", và "hàng trăm nghiên cứu" không kiểm được.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n16
  cau: Nhật Bản, Hồng Kông, Ma Cao và Đài Bắc Trung Hoa có chỉ số lo âu bài vở cao hơn mức trung bình OECD (0,01).
  loai: so-lieu
  nguon:
    - ten: "OECD (2017), PISA 2015 Results (Volume III), bản Overview (PDF bản OECD do Viện IBE Ba Lan lưu): toàn văn phần Overview, gồm Hình III.1.2 (bảng chỉ số lo âu theo nước)"
      link: https://doi.org/10.1787/9789264273856-en
  ket_qua_luot_1: dung
  ghi_chu: Trang cũ nêu Nhật Bản, Hồng Kông, Ma Cao; thêm Đài Bắc Trung Hoa. Chỉ so giá trị chỉ số; ý nghĩa thống kê của từng nước không kiểm (bảng tô đậm trong PDF).
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n39
  cau: "Trần và cộng sự (2024): nghiên cứu dọc ba năm (2018–2021) trên học sinh của 4 trường trung học ở thành phố Huế; 611 em được mời, 341 em có đủ dữ liệu ở cả hai đợt; các em học lớp 6 lúc đầu và lớp 9 lúc cuối; dùng thang ESSA."
  loai: so-lieu
  nguon:
    - ten: "Trần và cộng sự (2024), J Rural Med 19(4), 279–290: toàn văn (PMC11442093)"
      link: https://doi.org/10.2185/jrm.2024-012
    - ten: "Sun và cộng sự (2011), J Psychoeduc Assess 29(6), 534–546: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1177/0734282910394976
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…trên 611 học sinh của 4 trường trung học… Có 341 em hoàn thành cả hai đợt khảo sát." và "ESSA… xây dựng và kiểm định trên học sinh Trung Quốc rồi kiểm định lại trên học sinh TP. Hồ Chí Minh". Chữ mới: "611 em được mời, 341 em có đủ dữ liệu ở cả hai đợt (lúc đầu học lớp 6, cuối là lớp 9)… ESSA, xây dựng và kiểm định trên học sinh Trung Quốc; Sun và cộng sự, 2011". Lý do: 611 là số được mời (517 và 479 tham gia hai đợt; 341 phân tích); bỏ "kiểm định lại trên học sinh TP. Hồ Chí Minh" (bài Tran nêu một kiểm định ESSA ở Việt Nam không rõ địa điểm; chưa mở).'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n18
  cau: Phần Lan, Hà Lan và Thụy Sĩ cho thấy kết quả học tập tốt có thể đi cùng học sinh hài lòng với cuộc sống.
  loai: phat-hien
  nguon:
    - ten: "OECD (2017), PISA 2015 Results (Volume III), bản Overview (PDF bản OECD do Viện IBE Ba Lan lưu): toàn văn phần Overview, gồm Hình III.1.2 (bảng chỉ số lo âu theo nước)"
      link: https://doi.org/10.1787/9789264273856-en
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Phần Lan chứng minh có thể vừa học giỏi vừa ít lo âu, nếu văn hóa học đường ít so sánh và cạnh tranh hơn." Chữ mới: "Phần Lan, Hà Lan và Thụy Sĩ cho thấy kết quả học tập tốt có thể đi cùng học sinh hài lòng với cuộc sống (OECD, 2017)." Lý do: Nguồn nói về hài lòng cuộc sống, không nói "văn hóa ít so sánh".'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n41
  cau: 'Nhãn "Khá vững": số giờ dùng công nghệ liên hệ yếu với sức khỏe tinh thần, nên chỉ đếm giờ có thể bỏ sót nhiều điều.'
  loai: nhan
  nguon:
    - ten: "Orben & Przybylski (2019), Nat Hum Behav 3(2), 173–182: toàn văn (bản tác giả chấp nhận, kho Oxford ORA); thêm bản tin của OII Oxford (oii.ox.ac.uk) cho tỉ lệ 2,7 và 4,3"
      link: https://doi.org/10.1038/s41562-018-0506-1
    - ten: "Teague và cộng sự (2026), JAMA Pediatrics 180(5): trang bài (jamanetwork.com, đọc qua công cụ đọc web); số người tham gia trong bài tự mâu thuẫn nên không dùng"
      link: https://jamanetwork.com/journals/jamapediatrics/fullarticle/2845518
  ket_qua_luot_1: dung
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n2
  cau: Ở Mỹ, tỉ lệ teen báo cáo buồn bã dai dẳng đã tăng rõ trong thập kỷ 2010 (số liệu khảo sát đại diện quốc gia); câu hỏi là mạng xã hội có phải thủ phạm không (câu trả lời của mục "Tự trải nghiệm", An là ví dụ giả định).
  loai: phat-hien
  nguon:
    - ten: "CDC (2024), YRBS Data Summary & Trends Report 2013–2023: toàn văn (PDF, cdc.gov; đọc cả biểu đồ)"
      link: https://www.cdc.gov/yrbs/dstr/pdf/YRBS-2023-Data-Summary-Trend-Report.pdf
  ket_qua_luot_1: da-sua
  ghi_chu: 'Tình huống An và mẹ An: gia-dinh. Chữ cũ: "…sức khỏe tâm thần của teen xấu đi là có thật (dữ liệu không thể chối cãi)… một trong những tranh luận khoa học ồn ào nhất thập kỷ". Chữ mới: "…ở Mỹ, tỉ lệ teen báo cáo buồn bã dai dẳng đã tăng rõ trong thập kỷ 2010 (số liệu khảo sát đại diện quốc gia)… một tranh luận khoa học đang diễn ra". Lý do: Bỏ "không thể chối cãi", "ồn ào nhất thập kỷ"; chỉ nói về teen Mỹ và tự báo cáo.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n49
  cau: 'Nhãn "Đang tranh cãi": bắt nạt "gây ra" tự tử ở mức độ nào.'
  loai: nhan
  nguon:
    - ten: "Holt và cộng sự (2015), Pediatrics 135(2), e496–e509: toàn văn (PMC4702491)"
      link: https://doi.org/10.1542/peds.2014-1864
    - ten: "van Geel, Vedder & Tanilon (2014), JAMA Pediatr 168(5), 435–442: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1001/jamapediatrics.2013.4143
    - ten: "Ttofi và cộng sự (2011), J Aggress Confl Peace Res 3(2), 63–73: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1108/17596591111132873
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Các phân tích tổng hợp đều là nghiên cứu cắt ngang… cũng chưa tách hết vai trò của các yếu tố trung gian như trầm cảm có sẵn. Giới nghiên cứu đồng thuận rằng bắt nạt là một yếu tố nguy cơ nghiêm trọng…" Chữ mới: "Phân tích của Holt và cộng sự (2015) chỉ gồm các nghiên cứu cắt ngang… tác giả của tổng hợp về trầm cảm cũng nói các suy luận nhân quả chỉ là tạm thời… Bắt nạt là một yếu tố nguy cơ đáng nghiêm túc". Lý do: "Đều là cắt ngang" và "đồng thuận" không kiểm được cho cả các tổng hợp; "trầm cảm có sẵn" không có trong nguồn.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n50
  cau: "Việt Nam có khảo sát quốc gia riêng (NAMHS 2021): 5.996 hộ gia đình, 10–17 tuổi, phỏng vấn chẩn đoán; tỉ lệ có một trong sáu rối loạn tâm thần trong 12 tháng là 3,3% ở Việt Nam (12,1% Kenya; 5,5% Indonesia); ý nghĩ tự tử 12 tháng khoảng 1,4% (KTC 1,0–1,9%), cố tự tử khoảng 0,2% (0,1–0,3%)."
  loai: so-lieu
  nguon:
    - ten: "NAMHS (2024), Lancet: Prevalence of adolescent mental disorders in Kenya, Indonesia, and Viet Nam: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0140-6736(23)02641-7
  ket_qua_luot_1: da-sua
  ghi_chu: 'Câu mới thêm. Số "5.996 hộ" theo tóm tắt (Viet Nam). Ý nghĩ tự tử 1,4% là con số chung ghi cho Indonesia và Việt Nam trong tóm tắt (KTC khác nhau); số cố tự tử 0,2% cũng vậy. Chữ cũ: "Chưa có khảo sát quy mô quốc gia kiểu YRBS cho teen Việt Nam". Chữ mới: "Việt Nam có các khảo sát quốc gia riêng, đo khác nên không so trực tiếp được: NAMHS (2021…)". Lý do: Sai: có khảo sát quốc gia (NAMHS 2021; cũng GSHS Việt Nam 2019 theo một nghiên cứu về bạo lực học đường, chưa dùng trên trang).'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n23
  cau: "OBPP hoạt động ở ba cấp: toàn trường (khảo sát ẩn danh, ban chống bắt nạt, tập huấn nhân viên, tăng giám sát ở điểm nóng), lớp học (họp lớp định kỳ, nội quy rõ ràng), cá nhân (làm việc với em bắt nạt, nạn nhân và phụ huynh)."
  loai: dinh-nghia
  nguon:
    - ten: "Harsono & Febriyana (2026), J Korean Acad Child Adolesc Psychiatry 37(1), 51–62: toàn văn (PMC12782987); tổng quan thứ cấp mô tả OBPP"
      link: https://doi.org/10.5765/jkacap.250040
  ket_qua_luot_1: da-sua
  ghi_chu: 'Nguồn là tổng quan thứ cấp 2026, không phải sách của Olweus. Chữ cũ: "toàn trường (thành lập ban điều phối, khảo sát ẩn danh học sinh, xây dựng nội quy chung chống bắt nạt, tăng cường giám sát ở "điểm nóng"…, họp phụ huynh), lớp học (đặt nội quy lớp, tổ chức thảo luận định kỳ), và cá nhân (can thiệp với từng em bắt nạt, nạn nhân và phụ huynh các em)". Chữ mới: "toàn trường (khảo sát ẩn danh, ban chống bắt nạt, tập huấn nhân viên, tăng giám sát ở các "điểm nóng"), lớp học (họp lớp định kỳ, nội quy rõ ràng) và cá nhân…"; thêm "theo một bài tổng quan năm 2026". Lý do: Khớp chữ của tổng quan; bỏ "họp phụ huynh" ở cấp toàn trường và "nội quy chung" (nguồn xếp phụ huynh ở cấp cá nhân).'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n14
  cau: PISA 2015 đo chỉ số lo âu liên quan đến bài vở ở học sinh 15 tuổi; trung bình OECD, 55% (55,5% trong bảng) học sinh nói dù đã chuẩn bị kỹ vẫn rất lo âu khi làm bài; ở mọi nước tham gia, nữ lo âu hơn nam.
  loai: so-lieu
  nguon:
    - ten: "OECD (2017), PISA 2015 Results (Volume III), bản Overview (PDF bản OECD do Viện IBE Ba Lan lưu): toàn văn phần Overview, gồm Hình III.1.2 (bảng chỉ số lo âu theo nước)"
      link: https://doi.org/10.1787/9789264273856-en
  ket_qua_luot_1: dung
  ghi_chu: Câu hỏi PISA dịch "Even if I am well prepared for a test I feel very anxious"; trang viết "dù đã chuẩn bị kỹ, em vẫn rất căng thẳng"; đổi "căng thẳng" thành "lo âu" cho khớp "anxious".
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n13
  cau: (Đã bỏ) Bắt nạt thường đạt đỉnh ở cấp trung học cơ sở (khoảng 11–14 tuổi), đúng độ tuổi nhu cầu được bạn bè chấp nhận lên cao nhất.
  loai: phat-hien
  nguon: []
  ket_qua_luot_1: da-bo
  ghi_chu: 'Không có nguồn đã mở. Chữ cũ: "Bắt nạt thường đạt đỉnh ở cấp trung học cơ sở (khoảng 11–14 tuổi) — đúng độ tuổi mà nhu cầu được bạn bè chấp nhận lên cao nhất." Chữ mới: (bỏ) Lý do: Không kiểm được.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n57
  cau: Ttofi và Farrington (2011) thấy họp phụ huynh đi cùng hiệu quả lớn hơn, và Gaffney và cộng sự (2021) thấy thông tin cho phụ huynh gắn với hiệu quả lớn hơn.
  loai: phat-hien
  nguon:
    - ten: "Ttofi & Farrington (2011), J Exp Criminol 7(1), 27–56: tóm tắt (bản ghi NCJRS của OJP Hoa Kỳ, ojp.gov); không mở được toàn văn (Springer chặn)"
      link: https://doi.org/10.1007/s11292-010-9109-1
    - ten: "Gaffney, Ttofi & Farrington (2021), J Sch Psychol 85, 37–56: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.jsp.2020.12.002
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Phân tích của Ttofi và Farrington chỉ ra họp phụ huynh là một trong những thành phần hiệu quả nhất." Chữ mới: "Ttofi và Farrington (2011) thấy họp phụ huynh đi cùng hiệu quả lớn hơn, và Gaffney… thông tin cho phụ huynh gắn với hiệu quả lớn hơn." Lý do: Tóm tắt không xếp "một trong hiệu quả nhất".'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n61
  cau: 'Các liên kết "Đọc thêm" (Não tuổi teen khác gì não người lớn?; Buồn thường và trầm cảm khác nhau thế nào?; Tuổi teen: mình là ai?) trỏ tới trang của site.'
  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: "Chỗ cần chú ý: trong worktree chỉ có phat-trien/ban-sac-tuoi-teen.md; co-so-sinh-hoc/nao-tuoi-teen và suc-khoe-tam-than/tram-cam chưa có (lô khác). Link không đổi; kiểm khi gom nhánh. Đã kiểm: trang.yml dua_tren (ban-sac-tuoi-teen, nao-tuoi-teen) khớp các link."
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n9
  cau: Báo cáo UNESCO (2019) tổng hợp dữ liệu từ 144 quốc gia và vùng lãnh thổ; gần một phần ba học sinh từng bị bắt nạt ít nhất một lần ở trường trong tháng trước đó; bắt nạt qua mạng và điện thoại đang tăng.
  loai: so-lieu
  nguon:
    - ten: Bản tin của Liên Hợp Quốc (01/2019) về báo cáo UNESCO "Behind the numbers" (news.un.org); không mở được bản gốc của UNESCO (unesdoc chặn bot)
      link: https://news.un.org/en/story/2019/01/1031052
  ket_qua_luot_1: da-sua
  ghi_chu: 'Bản tin không nêu "32%" hay tỉ lệ bắt nạt mạng; không mở được bản gốc UNESCO. Chữ cũ: "…gần một phần ba học sinh trên thế giới từng bị bắt nạt ít nhất một lần trong tháng trước đó, và khoảng một phần mười là nạn nhân của bắt nạt trên mạng (UNESCO, 2019)." Chữ mới: "…gần một phần ba học sinh từng bị bắt nạt ít nhất một lần ở trường trong tháng trước đó, và bắt nạt qua mạng và điện thoại đang tăng (theo bản tin của Liên Hợp Quốc về báo cáo)." Lý do: "Một phần mười" cho bắt nạt mạng không kiểm được; nguồn nói "đang tăng". Thêm "ở trường".'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n72
  cau: (Đã bỏ) Báo chí trong nước thường xuyên đưa tin về bạo lực học đường; clip tung lên mạng làm nạn nhân bị tổn thương hai lần; điều này khớp với phát hiện của Modecki.
  loai: phat-hien
  nguon: []
  ket_qua_luot_1: da-bo
  ghi_chu: 'Không có nguồn đã mở (tần suất đưa tin báo chí, thiệt hại hai lần). Chữ cũ: Đoạn "Bạo lực học đường trên báo chí Việt Nam…". Chữ mới: (bỏ) Lý do: Không kiểm được.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n15
  cau: Singapore nằm trong nhóm có chỉ số lo âu bài vở cao nhất (0,57, sau Brazil và Costa Rica cùng 0,60), Phần Lan thấp (−0,41; Hà Lan −0,54 và Thụy Sĩ −0,44 còn thấp hơn).
  loai: so-lieu
  nguon:
    - ten: "OECD (2017), PISA 2015 Results (Volume III), bản Overview (PDF bản OECD do Viện IBE Ba Lan lưu): toàn văn phần Overview, gồm Hình III.1.2 (bảng chỉ số lo âu theo nước)"
      link: https://doi.org/10.1787/9789264273856-en
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chỉ số theo bảng; "nhóm cao nhất" = ba nước cao nhất. Thứ hạng PISA của Singapore không có trong phần đã mở nên trang không nêu. Chữ cũ: "Singapore — một trong những nền giáo dục đứng đầu thế giới — có chỉ số lo âu này cao nhất trong các nước tham gia (OECD, 2017), trong khi Phần Lan (cũng thuộc top đầu) lại thấp nhất." Chữ mới: "Singapore nằm trong nhóm có chỉ số lo âu cao nhất (0,57, sau Brazil và Costa Rica, cùng 0,60), trong khi Phần Lan thấp (−0,41; Hà Lan −0,54 và Thụy Sĩ −0,44 còn thấp hơn)". Lý do: Sai: Singapore thứ ba, Phần Lan không thấp nhất; thứ hạng giáo dục không kiểm được.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n69
  cau: "Nghiên cứu dọc ở Huế (Trần và cộng sự, 2024): học sinh đi học thêm có mức stress học tập cao hơn, và điểm stress trung bình của nhóm tăng từ 2018 đến 2021, giai đoạn có đại dịch và các em lên lớp cuối cấp."
  loai: phat-hien
  nguon:
    - ten: "Trần và cộng sự (2024), J Rural Med 19(4), 279–290: toàn văn (PMC11442093)"
      link: https://doi.org/10.2185/jrm.2024-012
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Ở Việt Nam, một ngày của nhiều học sinh là: học chính khóa ở trường, rồi học thêm buổi tối, rồi làm bài tập đến khuya… Điều này không có nghĩa học thêm luôn xấu, nhưng đặt câu hỏi cho mỗi gia đình…" Chữ mới: "Học thêm và stress học tập… tăng từ 2018 đến 2021, một giai đoạn có đại dịch COVID-19 và các em lên lớp cuối cấp. Điều này không có nghĩa học thêm luôn xấu, nhưng đặt câu hỏi…" Lý do: Bỏ mô tả "một ngày của nhiều học sinh" (không có nguồn), thêm bối cảnh COVID.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n55
  cau: Thử nghiệm ngẫu nhiên ở 78 trường, 8.237 học sinh lớp 4–6, sau 9 tháng KiVa có tác động tốt lên 7 trong 11 biến, gồm bắt nạt và bị bắt nạt do học sinh tự báo cáo.
  loai: phat-hien
  nguon:
    - ten: "Kärnä và cộng sự (2011), Child Dev 82(1), 311–330: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1111/j.1467-8624.2010.01557.x
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…đánh giá quy mô lớn ở Phần Lan (78 trường, hơn 8.000 học sinh) cho thấy nó giảm được cả tỉ lệ bắt nạt lẫn nạn nhân (Kärnä và cộng sự, 2011)." Chữ mới: "…một thử nghiệm ngẫu nhiên ở 78 trường với hơn 8.000 học sinh lớp 4–6 thấy sau 9 tháng chương trình có tác động tốt lên nhiều chỉ số, kể cả bắt nạt và bị bắt nạt do học sinh tự báo cáo". Lý do: Nêu thiết kế ngẫu nhiên, lớp 4–6, 9 tháng, 7/11 biến.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n88
  cau: Tiêu đề và mô tả trang, mục "Đọc thêm", lời dẫn Hỗ trợ khớp với nội dung trang sau khi sửa; trang là bài mở rộng, dựa trên tre-hoc-the-nao (src/data/trang.yml), kiem_lai_truoc 2028-05.
  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: "Đã kiểm trong src/data/trang.yml (dua_tren: tre-hoc-the-nao, kiem_lai_truoc: 2028-05). Đề xuất: giữ hạn 2028-05; nếu cần hạn ngắn hơn thì 2027-11 vì có số liệu thời sự về Việt Nam (n75) và nghiên cứu mới về chương trình chống bắt nạt."
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n65
  cau: "Câu hỏi 4: dữ liệu dọc cho thấy hài lòng giảm cũng dự báo dùng mạng xã hội nhiều hơn; tương quan không cho biết chiều nhân quả; có thể cả hai chiều cùng đúng."
  loai: phat-hien
  nguon:
    - ten: "Orben và cộng sự (2022), Nat Commun 13, 1649: toàn văn (PMC8960761)"
      link: https://doi.org/10.1038/s41467-022-29296-3
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Dữ liệu dọc cho thấy teen đang buồn có xu hướng dùng mạng xã hội NHIỀU hơn" và lựa chọn đúng "…teen buồn tìm đến mạng xã hội để trốn tránh hoặc tìm đồng cảm…". Chữ mới: "Dữ liệu dọc cho thấy hài lòng với cuộc sống giảm dự báo dùng mạng xã hội nhiều hơn…" và lựa chọn đúng bỏ "để trốn tránh hoặc tìm đồng cảm". Lý do: Bỏ động cơ (không có nguồn); chữ "buồn" thay bằng biến đo.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n66
  cau: Trang là bài mở rộng, dựa trên ban-sac-tuoi-teen và nao-tuoi-teen, kiem_lai_truoc 2028-05 (src/data/trang.yml); nên đặt hạn ngắn hơn vì tranh luận đang diễn ra nhanh.
  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: "Đã kiểm trong src/data/trang.yml. Đề xuất: hạ kiem_lai_truoc xuống 2027-05 (YRBS 2027 dự kiến, phân tích tổng hợp mới ra liên tục; chưa mở được Nature/hhs.gov). Người giao quyết."
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n25
  cau: "(Đã bỏ) Przybylski: 99,75% mức hài lòng của một teen trong một năm không liên quan đến việc họ dùng mạng xã hội nhiều hay ít."
  loai: so-lieu
  nguon: []
  ket_qua_luot_1: da-bo
  ghi_chu: 'Con số từ lời phát biểu, không có trong bài đã mở (PNAS). Chữ cũ: "Nói như Przybylski: 99,75% mức hài lòng… không liên quan…". Chữ mới: (bỏ) Lý do: Không kiểm được.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n74
  cau: Khảo sát ẩn danh định kỳ, xử lý từng vụ việc riêng với từng bên và nội quy rõ ràng nằm trong các thành phần được mô tả của OBPP.
  loai: dinh-nghia
  nguon:
    - ten: "Harsono & Febriyana (2026), J Korean Acad Child Adolesc Psychiatry 37(1), 51–62: toàn văn (PMC12782987); tổng quan thứ cấp mô tả OBPP"
      link: https://doi.org/10.5765/jkacap.250040
  ket_qua_luot_1: da-sua
  ghi_chu: '"Chưa tìm thấy nghiên cứu đã mở so sánh cách ép bắt tay làm hòa" là kết quả tìm của chúng tôi (không phải khẳng định thời sự về Việt Nam): xem n75. Chữ cũ: "Cách làm có bằng chứng hơn: trường tổ chức khảo sát ẩn danh định kỳ (như Bảng hỏi Bắt nạt/Nạn nhân của Olweus)… xử lý từng vụ việc riêng với từng bên; và đặt nội quy rõ ràng, thực thi nhất quán." Chữ mới: "…khảo sát ẩn danh định kỳ là một phần của chương trình như OBPP; xử lý từng vụ việc riêng với từng bên và đặt nội quy rõ ràng cũng nằm trong các thành phần được mô tả của chương trình này." Lý do: "Có bằng chứng hơn" và "Bảng hỏi Olweus" không kiểm được; viết đúng mức mô tả của tổng quan.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n64
  cau: "Câu hỏi 3: Orben và cộng sự (2022) — cửa sổ nhạy cảm nữ 11–13, nam 14–15; hiệu ứng vẫn nhỏ; chiều ngược lại cũng tồn tại."
  loai: phat-hien
  nguon:
    - ten: "Orben và cộng sự (2022), Nat Commun 13, 1649: toàn văn (PMC8960761)"
      link: https://doi.org/10.1038/s41467-022-29296-3
  ket_qua_luot_1: dung
  ghi_chu: Câu hỏi dùng "quanh tuổi dậy thì" như mô tả địa phương của khoảng tuổi; phần "quanh tuổi dậy thì" đã được làm rõ ở n28.
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n16
  cau: "YRBS 2023 (MMWR 2024): buồn bã dai dẳng 42,6% ở nhóm dùng mạng xã hội nhiều lần mỗi ngày so với 31,9% ở nhóm dùng ít hơn; đây là liên hệ cắt ngang."
  loai: so-lieu
  nguon:
    - ten: "CDC MMWR Suppl 73(4) (2024), YRBS 2023: các trang su7304a1 (tổng quan) và su7304a3 (mạng xã hội; đọc qua công cụ đọc web)"
      link: https://www.cdc.gov/mmwr/volumes/73/su/su7304a3.htm
  ket_qua_luot_1: dung
  ghi_chu: Câu mới thêm; số theo công cụ đọc web, "frequent" = nhiều lần mỗi ngày trở lên.
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n8
  cau: "Câu hỏi YRBS: trong 12 tháng qua, có bao giờ buồn bã hoặc tuyệt vọng gần như mỗi ngày trong ít nhất hai tuần liên tiếp đến mức bỏ bê các hoạt động thường ngày không?"
  loai: cong-cu
  nguon:
    - ten: "CDC (2024), YRBS Data Summary & Trends Report 2013–2023: toàn văn (PDF, cdc.gov; đọc cả biểu đồ)"
      link: https://www.cdc.gov/yrbs/dstr/pdf/YRBS-2023-Data-Summary-Trend-Report.pdf
    - ten: "CDC MMWR Suppl 73(4) (2024), YRBS 2023: các trang su7304a1 (tổng quan) và su7304a3 (mạng xã hội; đọc qua công cụ đọc web)"
      link: https://www.cdc.gov/mmwr/volumes/73/su/su7304a3.htm
  ket_qua_luot_1: dung
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n52
  cau: "Từng bị bắt nạt dự báo trầm cảm sau trung bình 6,9 năm theo dõi, tỉ số chênh 1,99 (1,74 sau khi kiểm soát tới 20 yếu tố nguy cơ tuổi thơ); từng bắt nạt dự báo phạm tội: OR 2,50, hiệu chỉnh 1,82 (theo dõi tới 11 năm)."
  loai: so-lieu
  nguon:
    - ten: "Ttofi và cộng sự (2011), J Aggress Confl Peace Res 3(2), 63–73: tóm tắt (OpenAlex)"
      link: https://doi.org/10.1108/17596591111132873
    - ten: "Ttofi và cộng sự (2011), Crim Behav Ment Health 21(2), 80–89: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1002/cbm.808
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…dự báo trầm cảm sau trung bình gần 7 năm (tỉ số chênh khoảng 2,0; vẫn khoảng 1,7…)". Chữ mới: Giữ "khoảng 2,0 / 1,7", thêm 6,9 năm; đổi phạm tội 1,9 → 1,8. Lý do: Số liệu đúng theo tóm tắt.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n84
  cau: "Câu hỏi 1: ba tiêu chí của bắt nạt là hành vi gây hại có chủ ý, lặp đi lặp lại, trong quan hệ chênh lệch quyền lực; lời giải thích: ba tiêu chí phân biệt bắt nạt với xung đột ngang hàng hay sự cố đơn lẻ."
  loai: dinh-nghia
  nguon:
    - ten: "Holt và cộng sự (2015), Pediatrics 135(2), e496–e509: toàn văn (PMC4702491)"
      link: https://doi.org/10.1542/peds.2014-1864
  ket_qua_luot_1: dung
  ghi_chu: Lời giải thích không dựa vào vị trí lựa chọn.
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n45
  cau: 'Nhãn "Vững chắc": bắt nạt được định nghĩa bằng ba tiêu chí — cố ý gây hại, lặp lại theo thời gian, chênh lệch quyền lực.'
  loai: nhan
  nguon:
    - ten: "Holt và cộng sự (2015), Pediatrics 135(2), e496–e509: toàn văn (PMC4702491)"
      link: https://doi.org/10.1542/peds.2014-1864
    - ten: "Olweus (2013), Annu Rev Clin Psychol 9, 751–780: tóm tắt (Europe PMC); không mở được toàn văn"
      link: https://doi.org/10.1146/annurev-clinpsy-050212-185516
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Định nghĩa của Olweus đã được giới nghiên cứu dùng thống nhất suốt hơn 40 năm và được UNESCO, CDC Mỹ cùng nhiều tổ chức khác chấp nhận." Chữ mới: "Ba tiêu chí này là nền của định nghĩa theo Olweus và của định nghĩa thống nhất của CDC… Nhãn nói về định nghĩa, không về tỉ lệ: nhiều nghiên cứu không đo đủ ba tiêu chí". Lý do: "Thống nhất suốt hơn 40 năm" bị Holt (2015) làm yếu (nhiều nghiên cứu không đo đủ ba tiêu chí); "UNESCO… chấp nhận" không kiểm được.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n44
  cau: Theo các tác giả, đây là nghiên cứu dọc đầu tiên về stress học tập và các yếu tố liên quan ở học sinh trung học cơ sở Việt Nam.
  loai: lich-su
  nguon:
    - ten: "Trần và cộng sự (2024), J Rural Med 19(4), 279–290: toàn văn (PMC11442093)"
      link: https://doi.org/10.2185/jrm.2024-012
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Đây là một trong số ít nghiên cứu dọc về stress học tập trên học sinh Việt Nam được công bố quốc tế." Chữ mới: "Theo các tác giả, đây là nghiên cứu dọc đầu tiên… ở học sinh trung học cơ sở Việt Nam." Lý do: Theo chữ của tác giả, "to the best of our knowledge".'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n23
  cau: "Orben, Dienlin & Przybylski (2019): dữ liệu dọc Understanding Society (Anh, 2009–2016), hơn 12.000 teen 10–15 tuổi (12.672), phân tích tách giữa người và trong cùng người."
  loai: so-lieu
  nguon:
    - ten: "Orben, Dienlin & Przybylski (2019), PNAS 116(21), 10226–10228: toàn văn (PMC6534991)"
      link: https://doi.org/10.1073/pnas.1902058116
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…theo dõi khoảng 12.000 teen qua nhiều năm". Chữ mới: "…(Anh, 2009–2016) — hơn 12.000 teen 10–15 tuổi tham gia (số người trong mỗi phân tích ít hơn nhiều)…". Lý do: 12.672 tham gia nhưng mỗi phân tích có n = 539–5.492.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n12
  cau: "YRBS 2023: khoảng 9% đã từng cố tự tử."
  loai: so-lieu
  nguon:
    - ten: "CDC (2024), YRBS Data Summary & Trends Report 2013–2023: toàn văn (PDF, cdc.gov; đọc cả biểu đồ)"
      link: https://www.cdc.gov/yrbs/dstr/pdf/YRBS-2023-Data-Summary-Trend-Report.pdf
    - ten: "CDC MMWR Suppl 73(4) (2024), YRBS 2023: các trang su7304a1 (tổng quan) và su7304a3 (mạng xã hội; đọc qua công cụ đọc web)"
      link: https://www.cdc.gov/mmwr/volumes/73/su/su7304a3.htm
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "…10% đã từng cố tự tử (2021), 9% (2023)." Chữ mới: "…10% đã từng cố tự tử (2021), khoảng 9% (2023)." Lý do: Báo cáo xu hướng làm tròn 9, MMWR nêu 9,5%; viết "khoảng".'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n51
  cau: NAMHS đo bằng phỏng vấn chẩn đoán còn YRBS bằng một câu hỏi tự báo cáo, nên không thể kết luận teen Việt "khỏe hơn" hay "ít buồn hơn" teen Mỹ; không thấy dữ liệu mạng xã hội trong tóm tắt NAMHS.
  loai: phat-hien
  nguon:
    - ten: "NAMHS (2024), Lancet: Prevalence of adolescent mental disorders in Kenya, Indonesia, and Viet Nam: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0140-6736(23)02641-7
    - ten: "CDC (2024), YRBS Data Summary & Trends Report 2013–2023: toàn văn (PDF, cdc.gov; đọc cả biểu đồ)"
      link: https://www.cdc.gov/yrbs/dstr/pdf/YRBS-2023-Data-Summary-Trend-Report.pdf
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Suy luận về không so sánh được đã ghi rõ trên trang. Chữ cũ: (không có) Chữ mới: "Số này thấp so với tỉ lệ buồn bã tự báo cáo ở Mỹ, nhưng đó là hai cách đo khác nhau… nên không thể kết luận teen Việt "khỏe hơn" hay "ít buồn hơn"." Lý do: Câu mới thêm để không để lại ấn tượng sai khi đặt số Mỹ và số Việt cạnh nhau.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n7
  cau: "Bốn chuẩn mực của Haidt: hoãn smartphone đến cấp 3, không mạng xã hội trước 16 tuổi, trường học không điện thoại từ đầu đến cuối buổi, và cho trẻ nhiều tự lập, chơi tự do và trách nhiệm hơn ở đời thực."
  loai: lich-su
  nguon:
    - ten: "Trang chính thức của sách (anxiousgeneration.com): trang book và resources/four-norms (đọc qua công cụ đọc web); sách không mở được"
      link: https://www.anxiousgeneration.com/resources/four-norms
  ket_qua_luot_1: dung
  ghi_chu: '"Cấp 3" dịch cho "high school" (Mỹ: lớp 9–12).'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n7
  cau: Bắt nạt có thể diễn ra trực tiếp (thể chất, lời nói, quan hệ như tẩy chay) hay trên mạng; Modecki (2014) đo cả hai dạng và thấy chúng tương quan cao.
  loai: dinh-nghia
  nguon:
    - ten: "Holt và cộng sự (2015), Pediatrics 135(2), e496–e509: toàn văn (PMC4702491)"
      link: https://doi.org/10.1542/peds.2014-1864
    - ten: "Modecki và cộng sự (2014), J Adolesc Health 55(5), 602–611: tóm tắt (Europe PMC); không mở được toàn văn (số 35% và 15% không kiểm được)"
      link: https://doi.org/10.1016/j.jadohealth.2014.06.007
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "Bắt nạt có nhiều hình thức: thể chất (đánh, xô đẩy, phá đồ), lời nói (chế nhạo, đe dọa, đặt biệt danh), quan hệ (tẩy chay, tung tin đồn, cô lập khỏi nhóm), và trên mạng (cyberbullying — quấy rối qua điện thoại, mạng xã hội)." Chữ mới: "Bắt nạt có thể diễn ra trực tiếp (thể chất, lời nói, quan hệ như tẩy chay) hay trên mạng… Modecki… đo cả hai dạng và thấy chúng tương quan cao với nhau." Lý do: Danh sách ví dụ chi tiết không có trong nguồn đã mở; giữ phân loại chung.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n8
  cau: "(Đã bỏ) Bắt nạt trên mạng có vài nét riêng: kẻ bắt nạt có thể ẩn danh, nạn nhân bị tấn công cả khi về nhà, nội dung xấu hổ lan đến hàng trăm người trong vài giờ."
  loai: phat-hien
  nguon: []
  ket_qua_luot_1: da-bo
  ghi_chu: 'Không có nguồn đã mở; Olweus (2013) còn nói nhiều tuyên bố về bắt nạt mạng trên truyền thông bị phóng đại. Chữ cũ: "Bắt nạt trên mạng có vài nét riêng: kẻ bắt nạt có thể ẩn danh, nạn nhân bị tấn công cả khi đã về nhà, và một nội dung xấu hổ có thể lan đến hàng trăm người chỉ trong vài giờ." Chữ mới: (bỏ) Lý do: Không kiểm được.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n59
  cau: 'Ngộ nhận "cấm tiệt mạng xã hội là giải pháp": chưa đủ bằng chứng thực nghiệm; Tổng Y sĩ Mỹ (2023) nói mạng xã hội có thể có cả lợi và hại.'
  loai: phat-hien
  nguon:
    - ten: "Orben và cộng sự (2022), Nat Commun 13, 1649: toàn văn (PMC8960761)"
      link: https://doi.org/10.1038/s41467-022-29296-3
    - ten: "U.S. Surgeon General (2023), Advisory on social media and youth mental health: hhs.gov chặn bot (403); chỉ đọc đoạn trích qua kết quả tìm kiếm, không mở trang"
      link: https://www.hhs.gov/surgeongeneral/reports-and-publications/youth-mental-health/social-media/index.html
  ket_qua_luot_1: da-sua
  ghi_chu: 'Vế Surgeon General: chưa mở nguồn trực tiếp (xem n35). Chữ cũ: "Mạng xã hội cũng là nơi nhiều teen tìm thấy cộng đồng và sự hỗ trợ (bạn bè, nhóm sở thích, teen thuộc nhóm thiểu số khó chia sẻ ngoài đời). Cấm đoán cực đoan có thể lấy đi cả mặt tích cực mà không giải quyết được gốc rễ." Chữ mới: "Chưa có đủ bằng chứng thực nghiệm để nói cấm tiệt mạng xã hội cải thiện sức khỏe tâm thần… Chúng tôi không có nguồn đã mở về mặt tích cực cụ thể…, nên không khẳng định." Lý do: Bỏ mặt tích cực cụ thể (không có nguồn đã mở).'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n4
  cau: Haidt nói về giai đoạn biến đổi 2010–2015.
  loai: lich-su
  nguon:
    - ten: 'Wikipedia, "The Anxious Generation" (bậc 3: chỉ để xác nhận bốn tổn hại, mốc 2010–2015 và các phản biện; không dùng làm nguồn duy nhất)'
      link: https://en.wikipedia.org/wiki/The_Anxious_Generation
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chỗ chưa chắc: nguồn bậc 3 (Wikipedia), sách không mở được; lượt 2 nên tìm nguồn bậc 1–2 (sách, bài của Haidt). Chữ cũ: "…từ khoảng 2010–2015…". Chữ mới: "…ông nói về giai đoạn biến đổi 2010–2015". Lý do: Làm mềm: bắt nguồn từ một trích dẫn qua nguồn bậc 3, không phải sách.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n80
  cau: Xung đột ngang sức giữa bạn bè khác với bắt nạt, vốn có chênh lệch quyền lực và lặp lại theo định nghĩa; nhầm lẫn hai thứ có thể khiến vụ bắt nạt bị bỏ qua.
  loai: dinh-nghia
  nguon:
    - ten: "Holt và cộng sự (2015), Pediatrics 135(2), e496–e509: toàn văn (PMC4702491)"
      link: https://doi.org/10.1542/peds.2014-1864
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Xung đột ngang hàng thì đúng là bình thường và là cơ hội học kỹ năng xã hội… Nhầm lẫn hai thứ này là lý do nhiều vụ bắt nạt bị bỏ qua cho đến khi quá muộn." Chữ mới: "Xung đột ngang sức giữa bạn bè khác với bắt nạt… Nhầm lẫn hai thứ này có thể khiến vụ bắt nạt bị bỏ qua." Lý do: Bỏ "bình thường và là cơ hội học kỹ năng xã hội" và "cho đến khi quá muộn" (không có nguồn).'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n45
  cau: "Mục 3: Orben và cộng sự (2022) thấy các cửa sổ (nữ 11–13, nam 14–15, 19 tuổi) trong đó dùng nhiều dự báo hài lòng giảm nhẹ một năm sau; chỉ một nghiên cứu dọc ở Anh, các tác giả chỉ suy đoán về dậy thì; trò chuyện với con thay vì chỉ cấm là gợi ý thực hành hợp lý (không phải kết quả nghiên cứu)."
  loai: loi-khuyen
  nguon:
    - ten: "Orben và cộng sự (2022), Nat Commun 13, 1649: toàn văn (PMC8960761)"
      link: https://doi.org/10.1038/s41467-022-29296-3
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Cửa sổ nhạy cảm… là lúc não bộ nhạy cảm nhất với đánh giá xã hội. Đây là giai đoạn nên trò chuyện nhiều hơn về so sánh trên mạng, áp lực ngoại hình và bắt nạt mạng — thay vì chỉ ra lệnh cấm." Chữ mới: "…đây là một nghiên cứu dọc ở Anh, và các tác giả chỉ suy đoán về dậy thì. Một gợi ý thực hành hợp lý (không phải kết quả của nghiên cứu): … trò chuyện với con về những điều con gặp trên mạng có thể hữu ích hơn chỉ ra lệnh cấm." Lý do: Bỏ "não bộ nhạy cảm nhất với đánh giá xã hội" (không có nguồn đã mở).'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n9
  cau: "YRBS 2021: 42% học sinh cấp 3 báo cáo buồn bã dai dẳng; nữ 57%, nam 29%; năm 2011 nữ 36%."
  loai: so-lieu
  nguon:
    - ten: "CDC (2023), YRBS Data Summary & Trends Report 2011–2021: toàn văn (PDF, cdc.gov)"
      link: https://www.cdc.gov/yrbs/dstr/pdf/YRBS_Data-Summary-Trends_Report2023_508.pdf
  ket_qua_luot_1: dung
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n32
  cau: "Teague và cộng sự (2026, JAMA Pediatrics): phân tích tổng hợp 153 nghiên cứu dọc (115 nhóm, 1.072 cỡ hiệu ứng, đăng ký trước PROSPERO); mạng xã hội liên hệ với trầm cảm, vấn đề hành vi, ý nghĩ tự hại và dùng chất (r = 0,09–0,21), thành tích học tập và tự nhận thức kém hơn (r = −0,07 đến −0,14); các tác giả nêu liên hệ khiêm tốn."
  loai: so-lieu
  nguon:
    - ten: "Teague và cộng sự (2026), JAMA Pediatrics 180(5): trang bài (jamanetwork.com, đọc qua công cụ đọc web); số người tham gia trong bài tự mâu thuẫn nên không dùng"
      link: https://jamanetwork.com/journals/jamapediatrics/fullarticle/2845518
  ket_qua_luot_1: dung
  ghi_chu: 'Câu mới thêm; không ghi cỡ mẫu người vì trang bài tự mâu thuẫn ("18 933 participants" và "18 933 articles"). Đọc qua công cụ đọc web, chưa toàn văn: lượt 2 nên mở lại.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n3
  cau: "Bắt nạt không nằm ở mức độ nặng nhẹ của một hành động đơn lẻ mà ở mẫu hình của nó: lặp đi lặp lại, có chênh lệch quyền lực."
  loai: dinh-nghia
  nguon:
    - ten: "Holt và cộng sự (2015), Pediatrics 135(2), e496–e509: toàn văn (PMC4702491)"
      link: https://doi.org/10.1542/peds.2014-1864
  ket_qua_luot_1: dung
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n54
  cau: 'Các nghiên cứu Việt Nam về mạng xã hội ở trên là cắt ngang, mẫu không đại diện, đo bằng bảng hỏi trực tuyến: chỉ cho thấy "đi cùng nhau".'
  loai: phat-hien
  nguon:
    - ten: "Dam và cộng sự (2023), PLOS ONE 18(6), e0286766: toàn văn (PMC10246797)"
      link: https://doi.org/10.1371/journal.pone.0286766
    - ten: "Vu & Nguyen (2024), VNU J Econ Bus 4(6): tóm tắt (Crossref)"
      link: https://doi.org/10.57110/vnu-jeb.v4i6.354
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…tất cả đều là nghiên cứu cắt ngang, mẫu thuận tiện…" Chữ mới: "…các nghiên cứu này là cắt ngang, mẫu không đại diện, và đo bằng bảng hỏi trực tuyến…" Lý do: Phân biệt với khảo sát quốc gia NAMHS; mẫu thuận tiện → không đại diện.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n33
  cau: 'Nhãn "Đang tranh cãi": mạng xã hội có phải nguyên nhân chính của khủng hoảng không; Haidt (2024) cho rằng có; các nhà nghiên cứu như Odgers phản biện; Tổng Y sĩ Mỹ (2023) khuyến cáo thận trọng.'
  loai: nhan
  nguon:
    - ten: "Orben & Przybylski (2019), Nat Hum Behav 3(2), 173–182: toàn văn (bản tác giả chấp nhận, kho Oxford ORA); thêm bản tin của OII Oxford (oii.ox.ac.uk) cho tỉ lệ 2,7 và 4,3"
      link: https://doi.org/10.1038/s41562-018-0506-1
    - ten: "Orben và cộng sự (2022), Nat Commun 13, 1649: toàn văn (PMC8960761)"
      link: https://doi.org/10.1038/s41467-022-29296-3
    - ten: "Teague và cộng sự (2026), JAMA Pediatrics 180(5): trang bài (jamanetwork.com, đọc qua công cụ đọc web); số người tham gia trong bài tự mâu thuẫn nên không dùng"
      link: https://jamanetwork.com/journals/jamapediatrics/fullarticle/2845518
    - ten: 'Wikipedia, "The Anxious Generation" (bậc 3: chỉ để xác nhận bốn tổn hại, mốc 2010–2015 và các phản biện; không dùng làm nguồn duy nhất)'
      link: https://en.wikipedia.org/wiki/The_Anxious_Generation
    - ten: "U.S. Surgeon General (2023), Advisory on social media and youth mental health: hhs.gov chặn bot (403); chỉ đọc đoạn trích qua kết quả tìm kiếm, không mở trang"
      link: https://www.hhs.gov/surgeongeneral/reports-and-publications/youth-mental-health/social-media/index.html
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chỗ chưa chắc: vế Odgers và Surgeon General chỉ qua nguồn thứ cấp. Chữ cũ: "Haidt (2024) nói có, dựa trên trùng khớp thời điểm (~2012), cơ chế hợp lý (ngủ, so sánh, bắt nạt) và dữ liệu nhiều nước. Giới nghiên cứu chuyên sâu phản biện: … nhiều giải thích khác chưa loại trừ được (đại dịch, áp lực học tập, bất bình đẳng, lo âu khí hậu, thay đổi cách hỏi khảo sát)." Chữ mới: "Haidt (2024) cho rằng có. Các nhà nghiên cứu như Odgers (Nature, 2024) phản biện, theo các tóm tắt thứ cấp… Một phân tích tổng hợp 2026 thấy liên hệ nhỏ nhưng nhất quán, và nhóm Orben thấy hiệu ứng trung bình nhỏ và hai chiều." Lý do: Bỏ "dựa trên…" và danh sách giải thích khác (không kiểm được).'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n60
  cau: Nếu bị bắt nạt kéo dài làm em lo lắng nhiều hay thay đổi rõ về ăn, ngủ, đi học, hãy tìm người có chuyên môn; xem Hỗ trợ.
  loai: loi-khuyen
  nguon:
    - ten: "Holt và cộng sự (2015), Pediatrics 135(2), e496–e509: toàn văn (PMC4702491)"
      link: https://doi.org/10.1542/peds.2014-1864
  ket_qua_luot_1: da-sua
  ghi_chu: 'Lời dẫn an toàn theo lời giao, không phải chẩn đoán. Chữ cũ: (không có) Chữ mới: "Nếu bị bắt nạt kéo dài làm em lo lắng nhiều hay thay đổi rõ về ăn, ngủ, đi học, hãy tìm người có chuyên môn; xem [Hỗ trợ]". Lý do: Theo lời giao cho chủ đề bắt nạt kéo dài.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n34
  cau: "Odgers (Nature, 2024), theo tóm tắt thứ cấp: phần lớn bằng chứng thực nghiệm không thấy hiệu ứng lớn hay nhất quán, và quan hệ ngược chiều có thể giải thích tương quan."
  loai: phat-hien
  nguon:
    - ten: 'Wikipedia, "The Anxious Generation" (bậc 3: chỉ để xác nhận bốn tổn hại, mốc 2010–2015 và các phản biện; không dùng làm nguồn duy nhất)'
      link: https://en.wikipedia.org/wiki/The_Anxious_Generation
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chỗ chưa chắc: Nature (doi 10.1038/d41586-024-00902-2) chuyển hướng đăng nhập, chưa mở; nguồn bậc 3. Lượt 2 nên tìm bản mở. Chữ cũ: "Giới nghiên cứu chuyên sâu phản biện: bằng chứng nhân quả còn yếu, hiệu ứng đo được nhỏ…" Chữ mới: "Các nhà nghiên cứu như Odgers (Nature, 2024) phản biện, theo các tóm tắt thứ cấp mà chúng tôi đọc được (chưa mở bản gốc): …" Lý do: Gán cho một người phản biện cụ thể với nguồn nói rõ thứ cấp; bỏ "giới nghiên cứu chuyên sâu" (không kiểm được).'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n31
  cau: 'Nhãn "Khá vững": ở cấp độ cá nhân, thời gian dùng công nghệ chỉ liên hệ yếu với sức khỏe tinh thần.'
  loai: nhan
  nguon:
    - ten: "Orben & Przybylski (2019), Nat Hum Behav 3(2), 173–182: toàn văn (bản tác giả chấp nhận, kho Oxford ORA); thêm bản tin của OII Oxford (oii.ox.ac.uk) cho tỉ lệ 2,7 và 4,3"
      link: https://doi.org/10.1038/s41562-018-0506-1
    - ten: "Orben, Dienlin & Przybylski (2019), PNAS 116(21), 10226–10228: toàn văn (PMC6534991)"
      link: https://doi.org/10.1073/pnas.1902058116
    - ten: "Orben và cộng sự (2022), Nat Commun 13, 1649: toàn văn (PMC8960761)"
      link: https://doi.org/10.1038/s41467-022-29296-3
    - ten: "Teague và cộng sự (2026), JAMA Pediatrics 180(5): trang bài (jamanetwork.com, đọc qua công cụ đọc web); số người tham gia trong bài tự mâu thuẫn nên không dùng"
      link: https://jamanetwork.com/journals/jamapediatrics/fullarticle/2845518
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Nghiên cứu lớn nhất… cho tối đa 0,4% phương sai; các nghiên cứu dọc cho hệ số β khoảng -0,04 đến -0,13… Lưu ý: … dữ liệu chủ yếu từ trước kỷ nguyên video ngắn." Chữ mới: "…Một phân tích tổng hợp 2026 trên 153 nghiên cứu dọc… thấy mạng xã hội liên hệ nhất quán nhưng khiêm tốn… (r = 0,09–0,21)… phần lớn dữ liệu từ trước kỷ nguyên video ngắn." Lý do: Thêm phân tích tổng hợp 2026 (nguồn bắt buộc của lời giao: các phân tích tổng hợp mới).'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n14
  cau: Số liệu YRBS là tự báo cáo, không phải chẩn đoán; câu hỏi là chỉ báo của triệu chứng trầm cảm.
  loai: dinh-nghia
  nguon:
    - ten: "CDC (2024), YRBS Data Summary & Trends Report 2013–2023: toàn văn (PDF, cdc.gov; đọc cả biểu đồ)"
      link: https://www.cdc.gov/yrbs/dstr/pdf/YRBS-2023-Data-Summary-Trend-Report.pdf
  ket_qua_luot_1: dung
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n56
  cau: 'Nhãn "Khá vững": người chứng kiến là "chìa khóa" bị bỏ quên (KiVa; sự tham gia không chính thức của bạn bè gắn với hiệu quả lớn hơn).'
  loai: nhan
  nguon:
    - ten: "Kärnä và cộng sự (2011), Child Dev 82(1), 311–330: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1111/j.1467-8624.2010.01557.x
    - ten: "Gaffney, Ttofi & Farrington (2021), J Sch Psychol 85, 37–56: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.jsp.2020.12.002
    - ten: "Marano và cộng sự (2026), Front Child Adolesc Psychiatry 5, 1895435: toàn văn (PMC13408263); tổng quan thứ cấp, dùng để mô tả KiVa"
      link: https://doi.org/10.3389/frcha.2026.1895435
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: Tiêu đề mục 2 (":nhan[kha-vung]") và "Đa số vụ bắt nạt diễn ra trước mặt người khác. Bạn không cần lao vào can ngăn một cách nguy hiểm: chỉ cần không cười theo, không chia sẻ clip bắt nạt, và sau đó đến bên nạn nhân… cũng đã phá vỡ "phần thưởng xã hội" nuôi dưỡng kẻ bắt nạt. Các chương trình như KiVa thành công chính nhờ huấn luyện cả lớp làm điều này". Chữ mới: "Chương trình KiVa… nhấn mạnh vai trò của người chứng kiến, và một thử nghiệm ngẫu nhiên… Những việc như không cười theo… là gợi ý thực hành hợp lý theo hướng này; chúng tôi không có nghiên cứu nào đo riêng từng hành vi ấy." Lý do: Bỏ "đa số vụ bắt nạt diễn ra trước mặt người khác" và "phần thưởng xã hội" (không kiểm được); KiVa nhắm cả lớp nhưng không có nguồn nói "thành công chính nhờ" điều đó.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n67
  cau: Cha mẹ có thể cân nhắc xem thêm giờ học có thực sự giúp con hay không; nghiên cứu ở Huế thấy đi học thêm gắn với stress cao hơn (liên hệ quan sát).
  loai: loi-khuyen
  nguon:
    - ten: "Trần và cộng sự (2024), J Rural Med 19(4), 279–290: toàn văn (PMC11442093)"
      link: https://doi.org/10.2185/jrm.2024-012
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "…cha mẹ nên cân nhắc: thêm giờ học có thực sự giúp con, hay chỉ đổi điểm số lấy sức khỏe tinh thần?" Chữ mới: "…cha mẹ có thể cân nhắc xem thêm giờ học có thực sự giúp con hay không, nhưng đó là liên hệ quan sát." Lý do: Bỏ vế "đổi điểm số lấy sức khỏe tinh thần" (khẳng định nhân quả không có nguồn).'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n29
  cau: Chương trình có thành phần "làm việc với bạn cùng lứa" liên quan đến tăng tỉ lệ nạn nhân (Ttofi và Farrington, 2011); phát hiện này cần đọc thận trọng vì Gaffney và cộng sự (2021) thấy sự tham gia không chính thức của bạn bè gắn với hiệu quả lớn hơn.
  loai: phat-hien
  nguon:
    - ten: "Ttofi & Farrington (2011), J Exp Criminol 7(1), 27–56: tóm tắt (bản ghi NCJRS của OJP Hoa Kỳ, ojp.gov); không mở được toàn văn (Springer chặn)"
      link: https://doi.org/10.1007/s11292-010-9109-1
    - ten: "Gaffney, Ttofi & Farrington (2021), J Sch Psychol 85, 37–56: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.jsp.2020.12.002
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chỗ khó: tóm tắt không nói "work with peers" gồm hoạt động nào; hai phân tích mã hóa thành phần khác nhau, nên không coi là mâu thuẫn trực tiếp. Chữ cũ: "…các chương trình cho học sinh "làm việc với nhau theo nhóm bạn" (work with peers — ví dụ bắt nạn nhân và kẻ bắt nạt ngồi lại "hòa giải" với nhau) lại liên quan đến việc tăng tỉ lệ nạn nhân. Bài học: can thiệp sai cách có thể hại nhiều hơn lợi." Chữ mới: "…các chương trình có thành phần "làm việc với bạn cùng lứa" (work with peers) lại liên quan đến việc tăng tỉ lệ nạn nhân… cần đọc thận trọng: tóm tắt không nêu rõ các hoạt động cụ thể" + kết quả của Gaffney 2021. Lý do: Ví dụ "bắt hòa giải" và "bài học" không có trong tóm tắt; thêm kết quả không đồng nhất của phân tích sau.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n47
  cau: "Mục 4: nếu một bạn trẻ buồn bã kéo dài, mất hứng thú, nói về cái chết hoặc tự làm hại mình, đó là lúc cần người có chuyên môn; chỉ chuyên gia mới chẩn đoán được; WHO ghi nhận nhiều vấn đề sức khỏe tâm thần tuổi vị thành niên chưa được nhận ra và chưa được điều trị, và kỳ thị là một rào cản; xem Hỗ trợ."
  loai: lam-sang
  nguon:
    - ten: WHO (2025), Adolescent mental health (tờ thông tin, đề ngày 1/9/2025; đọc qua công cụ đọc web)
      link: https://www.who.int/news-room/fact-sheets/detail/adolescent-mental-health
  ket_qua_luot_1: da-sua
  ghi_chu: 'Lời dẫn an toàn theo lời giao (không chẩn đoán, không liệt kê dấu hiệu để tự đối chiếu, không chi tiết về cách tự hại). Đã bỏ chip vững chắc: không có nguồn đã mở nói "nên đi khám khi…" như một khẳng định nghiên cứu; giữ id cũ. Chữ cũ: ":nhan[vung-chac]" "Buồn bã kéo dài trên hai tuần, mất hứng thú với mọi thứ, nói về cái chết hoặc tự làm hại mình — đó là lúc cần bác sĩ tâm thần/nhà tâm lý… Tại Việt Nam, gọi 115 khi khẩn cấp. Trầm cảm tuổi teen là bệnh lý có thể điều trị được." Chữ mới: "Nếu một bạn trẻ buồn bã kéo dài, mất hứng thú, nói về cái chết hoặc tự làm hại mình, đó là lúc cần người có chuyên môn… Chỉ chuyên gia mới chẩn đoán được… Xem [Hỗ trợ]." Tiêu đề "Khi lo về trầm cảm hoặc tự hại: tìm người có chuyên môn", bỏ chip, giữ id cũ. Lý do: Bỏ "hai tuần" (dạng tiêu chí chẩn đoán), "bệnh lý có thể điều trị được" (WHO fact sheet không nói điều đó), số 115 (dẫn Hỗ trợ theo lời giao).'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n11
  cau: "Modecki và cộng sự (2014): phân tích tổng hợp 80 nghiên cứu; bắt nạt truyền thống phổ biến gấp đôi bắt nạt trên mạng; hai dạng tương quan cao."
  loai: so-lieu
  nguon:
    - ten: "Modecki và cộng sự (2014), J Adolesc Health 55(5), 602–611: tóm tắt (Europe PMC); không mở được toàn văn (số 35% và 15% không kiểm được)"
      link: https://doi.org/10.1016/j.jadohealth.2014.06.007
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chỉ đọc tóm tắt. Chữ cũ: "…khoảng 35% dính líu đến bắt nạt truyền thống… khoảng 15% dính líu đến bắt nạt trên mạng… hơn 300.000 thanh thiếu niên… em nào bị bắt nạt trên mạng thì nhiều khả năng cũng bị bắt nạt ngoài đời, và ngược lại". Chữ mới: "…bắt nạt truyền thống phổ biến gấp đôi bắt nạt trên mạng và hai dạng này tương quan cao". Lý do: 35%, 15%, 300.000 và "với vai trò nạn nhân hoặc kẻ bắt nạt" không có trong tóm tắt, không mở được toàn văn (các nguồn thứ cấp cũng mâu thuẫn về việc 35% là nạn nhân hay tổng).'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n22
  cau: "Hạn chế: dữ liệu 2007–2016, trước kỷ nguyên TikTok và video ngắn, nên có thể khác với việc dùng mạng xã hội hiện nay (hạn chế do chúng tôi nêu)."
  loai: phat-hien
  nguon:
    - ten: "Orben & Przybylski (2019), Nat Hum Behav 3(2), 173–182: toàn văn (bản tác giả chấp nhận, kho Oxford ORA); thêm bản tin của OII Oxford (oii.ox.ac.uk) cho tỉ lệ 2,7 và 4,3"
      link: https://doi.org/10.1038/s41562-018-0506-1
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "…phe phê bình cho rằng "mạng xã hội 2024" khác hẳn "màn hình 2012"." Chữ mới: "…nên có thể khác với việc dùng mạng xã hội hiện nay (đây là hạn chế do chúng tôi nêu, không phải kết quả của nghiên cứu)." Lý do: Không có nguồn đã mở nói phe phê bình đã nói vậy; giữ như suy luận của trang, ghi rõ.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n62
  cau: "Câu hỏi 1: Orben & Przybylski (2019) trên 355.358 teen — công nghệ số giải thích tối đa 0,4% khác biệt về sức khỏe tinh thần — tương đương ăn khoai tây; bị bắt nạt và hút cần sa có liên hệ tiêu cực mạnh hơn nhiều lần."
  loai: phat-hien
  nguon:
    - ten: "Orben & Przybylski (2019), Nat Hum Behav 3(2), 173–182: toàn văn (bản tác giả chấp nhận, kho Oxford ORA); thêm bản tin của OII Oxford (oii.ox.ac.uk) cho tỉ lệ 2,7 và 4,3"
      link: https://doi.org/10.1038/s41562-018-0506-1
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Lời giải thích không dựa vào vị trí lựa chọn. Chữ cũ: "…tương đương ăn khoai tây; bị bắt nạt và hút cần sa có liên hệ tiêu cực mạnh hơn nhiều lần." và lời giải thích "…giấc ngủ, bắt nạt, bữa sáng — liên hệ mạnh hơn hẳn." Chữ mới: "…trong cùng bộ dữ liệu, giấc ngủ, bắt nạt, bữa sáng liên hệ mạnh hơn hẳn."; lựa chọn đúng "…tương đương ăn khoai tây…" giữ (xem n20, nhỏ gần bằng). Lý do: "Tương đương" khoai tây hơi mạnh (−0,042 so với −0,049): giữ vì là cách nói tắt trong câu hỏi, nhưng lời giải thích nêu "trong cùng bộ dữ liệu".'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n34
  cau: Mọi vai trò dính líu vào bắt nạt đều liên quan đến nguy cơ cao hơn của ý nghĩ và hành vi tự tử, tỉ số chênh từ 2,12 đến 4,02.
  loai: so-lieu
  nguon:
    - ten: "Holt và cộng sự (2015), Pediatrics 135(2), e496–e509: toàn văn (PMC4702491)"
      link: https://doi.org/10.1542/peds.2014-1864
  ket_qua_luot_1: da-sua
  ghi_chu: 'Có dị biệt đáng kể giữa các nghiên cứu (tóm tắt). Chữ cũ: "…trong đó nhóm vừa bắt nạt vừa bị bắt nạt (bully-victim) có nguy cơ cao nhất." Chữ mới: (bỏ vế "bully-victim có nguy cơ cao nhất") Lý do: Tóm tắt không nói nhóm nào cao nhất.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n27
  cau: "Các cửa sổ nhạy cảm: nữ 11–13 tuổi, nam 14–15 tuổi, và 19 tuổi ở cả hai giới; hệ số nhỏ (β −0,07 đến −0,13); chiều ngược lại (hài lòng thấp → dùng nhiều) cũng tồn tại, không gắn với tuổi hay giới."
  loai: phat-hien
  nguon:
    - ten: "Orben và cộng sự (2022), Nat Commun 13, 1649: toàn văn (PMC8960761)"
      link: https://doi.org/10.1038/s41467-022-29296-3
  ket_qua_luot_1: dung
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n26
  cau: Ttofi và Farrington rà soát tài liệu (kể cả báo cáo chưa công bố, ngôn ngữ ngoài tiếng Anh) và chọn 89 báo cáo mô tả 53 chương trình, trong đó 44 chương trình có đủ dữ liệu tính cỡ hiệu ứng.
  loai: so-lieu
  nguon:
    - ten: "Ttofi & Farrington (2011), J Exp Criminol 7(1), 27–56: tóm tắt (bản ghi NCJRS của OJP Hoa Kỳ, ojp.gov); không mở được toàn văn (Springer chặn)"
      link: https://doi.org/10.1007/s11292-010-9109-1
  ket_qua_luot_1: da-sua
  ghi_chu: 'Trich theo kết quả công cụ đọc web của bản ghi OJP (tóm tắt của bài). Chữ cũ: "…rà soát toàn bộ tài liệu đến giữa năm 2009 (35 tạp chí đọc tay toàn bộ, 18 cơ sở dữ liệu điện tử…)… phân tích tổng hợp lớn nhất về chủ đề này tính đến thời điểm đó." Chữ mới: "…rà soát tài liệu nhiều nguồn, kể cả báo cáo chưa công bố và ngôn ngữ ngoài tiếng Anh…" Lý do: Số tạp chí, cơ sở dữ liệu, mốc 2009 và "lớn nhất" không có trong phần đã đọc.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n5
  cau: Ba tiêu chí (cố ý gây hại, lặp lại theo thời gian, chênh lệch quyền lực) là bộ lọc phân biệt bắt nạt với một vụ xung đột tay đôi hay một sự cố đơn lẻ.
  loai: dinh-nghia
  nguon:
    - ten: "Holt và cộng sự (2015), Pediatrics 135(2), e496–e509: toàn văn (PMC4702491)"
      link: https://doi.org/10.1542/peds.2014-1864
  ket_qua_luot_1: da-sua
  ghi_chu: 'Cụm "cố ý gây hại" là cách diễn đạt của Olweus; CDC dùng "aggressive acts". Chữ cũ: "…phân biệt bắt nạt với những thứ trông giống nó: đùa giỡn thô bạo giữa bạn bè ngang sức (rough-and-tumble play), hay một vụ xung đột tay đôi." Chữ mới: "…phân biệt bắt nạt với những thứ trông giống nó: một vụ xung đột tay đôi hay một sự cố đơn lẻ." Lý do: Bỏ "rough-and-tumble play" (không có nguồn đã mở).'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n30
  cau: "Phân tích cập nhật (Gaffney, Ttofi và Farrington, 2019): 100 đánh giá; các chương trình giảm hành vi bắt nạt khoảng 19–20% và nạn nhân khoảng 15–16%; khác biệt lớn giữa các nghiên cứu."
  loai: so-lieu
  nguon:
    - ten: "Gaffney, Ttofi & Farrington (2019), Aggress Violent Behav 45, 111–133: tóm tắt (Semantic Scholar API)"
      link: https://doi.org/10.1016/j.avb.2018.07.001
  ket_qua_luot_1: da-sua
  ghi_chu: 'Trich từ bản tóm tắt qua API Semantic Scholar (có lỗi gõ "ad" trong nguồn). Chữ cũ: "…với gần gấp đôi số đánh giá (100 chương trình)…". Chữ mới: "Một phân tích cập nhật của cùng nhóm, với 100 đánh giá, thấy… khác biệt lớn giữa các nghiên cứu". Lý do: Nguồn nói 100 "evaluations", không phải 100 chương trình; số chương trình của bài 2011 là 53 (44 có số liệu).'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n40
  cau: 'Mục 1 (đừng chỉ đếm giờ): số giờ dùng công nghệ liên hệ yếu với sức khỏe tinh thần ở cấp độ dân số; chưa có nghiên cứu đã mở cho thấy "cách dùng" quan trọng hơn "số giờ"; hỏi con đang xem gì là thông lệ hợp lý.'
  loai: loi-khuyen
  nguon:
    - ten: "Orben & Przybylski (2019), Nat Hum Behav 3(2), 173–182: toàn văn (bản tác giả chấp nhận, kho Oxford ORA); thêm bản tin của OII Oxford (oii.ox.ac.uk) cho tỉ lệ 2,7 và 4,3"
      link: https://doi.org/10.1038/s41562-018-0506-1
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: ":nhan[kha-vung] "Số giờ màn hình liên hệ yếu với sức khỏe tinh thần; cách dùng mới quan trọng. Dấu hiệu đáng lo… so sánh bản thân liên tục, bị bắt nạt/bình luận độc hại, xem nội dung cổ vũ tự hại hoặc rối loạn ăn uống, và dùng điện thoại để trốn tránh mọi cảm xúc khó chịu." Chữ mới: "Theo Orben và Przybylski (2019), số giờ… liên hệ yếu… Chúng tôi chưa có nghiên cứu đã mở cho thấy "cách dùng" quan trọng hơn "số giờ"; hỏi con đang xem gì… là thông lệ hợp lý, không phải kết quả của một nghiên cứu cụ thể." Lý do: Bỏ "cách dùng mới quan trọng" và danh sách "dấu hiệu đáng lo" (không có nguồn; gần với dấu hiệu lâm sàng).'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n35
  cau: "Tổng Y sĩ Mỹ (2023) ra khuyến cáo thận trọng: mạng xã hội có thể có cả lợi và hại, và cần thêm dữ liệu từ chính các công ty công nghệ."
  loai: phat-hien
  nguon:
    - ten: "U.S. Surgeon General (2023), Advisory on social media and youth mental health: hhs.gov chặn bot (403); chỉ đọc đoạn trích qua kết quả tìm kiếm, không mở trang"
      link: https://www.hhs.gov/surgeongeneral/reports-and-publications/youth-mental-health/social-media/index.html
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chỗ chưa chắc: không mở được trang HHS (403); lượt 2 và review nên mở. Đã viết "theo trang của HHS, chúng tôi chỉ đọc được đoạn trích". Chữ cũ: "…ra khuyến cáo thận trọng: mạng xã hội có cả lợi và hại, cần thêm dữ liệu từ chính các công ty công nghệ." Chữ mới: "…mạng xã hội có thể có cả lợi và hại, và cần thêm dữ liệu từ chính các công ty công nghệ (theo trang của HHS, chúng tôi chỉ đọc được đoạn trích)." Lý do: Làm mềm vì nguồn chưa mở trực tiếp.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n85
  cau: 'Câu hỏi 2: Ttofi và Farrington (2011) — trung bình giảm khoảng 20% bắt nạt và 17–20% nạn nhân; hiệu quả hơn khi họp phụ huynh, kỷ luật vững chắc, tăng giám sát; thành phần "làm việc với bạn cùng lứa" liên quan tăng nạn nhân (cần đọc thận trọng).'
  loai: phat-hien
  nguon:
    - ten: "Ttofi & Farrington (2011), J Exp Criminol 7(1), 27–56: tóm tắt (bản ghi NCJRS của OJP Hoa Kỳ, ojp.gov); không mở được toàn văn (Springer chặn)"
      link: https://doi.org/10.1007/s11292-010-9109-1
    - ten: "Gaffney, Ttofi & Farrington (2021), J Sch Psychol 85, 37–56: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.jsp.2020.12.002
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…hiệu quả nhất khi có họp phụ huynh… — còn ép "làm việc theo nhóm bạn" lại liên quan đến tăng nạn nhân." và lời giải thích "…can thiệp sai cách (hòa giải ép buộc khi chênh lệch quyền lực còn nguyên) có thể hại nhiều hơn lợi." Chữ mới: "…hiệu quả hơn khi có họp phụ huynh… còn thành phần "làm việc với bạn cùng lứa" lại liên quan đến tăng nạn nhân (một phát hiện cần đọc thận trọng)." và lời giải thích mới nêu Gaffney 2021. Lý do: "Hiệu quả nhất", "ép làm việc nhóm", "hòa giải ép buộc" không có trong nguồn.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n87
  cau: "Câu hỏi 4: Trần và cộng sự (2024) — đi học thêm, là nữ, điểm số thấp hơn gắn với stress học tập cao hơn; điểm trung bình tăng từ 46,4 lên 53,5."
  loai: so-lieu
  nguon:
    - ten: "Trần và cộng sự (2024), J Rural Med 19(4), 279–290: toàn văn (PMC11442093)"
      link: https://doi.org/10.2185/jrm.2024-012
  ket_qua_luot_1: dung
  ghi_chu: Giữ nguyên câu hỏi và lời giải thích; "đi cùng" được hiểu là liên hệ.
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n79
  cau: '(Đã bỏ) Ngộ nhận "Kẻ bắt nạt là đứa hư hỏng, thiếu tự tin…": nhiều kẻ bắt nạt có địa vị xã hội cao, kỹ năng xã hội không kém, bắt nạt vì có lợi (được chú ý, được nể sợ).'
  loai: phat-hien
  nguon: []
  ket_qua_luot_1: da-bo
  ghi_chu: 'Không mở được nguồn cho địa vị xã hội và động cơ; Salmivalli 1996 chỉ đọc được tiêu đề. Chữ cũ: Cả gạch đầu dòng ngộ nhận "Kẻ bắt nạt là đứa hư hỏng, thiếu tự tin, gia đình có vấn đề." Chữ mới: (bỏ) Lý do: Không kiểm được.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n12
  cau: Các tác giả Modecki cho rằng việc dính líu vào nhiều dạng gây hấn (polyaggression) nên là mục tiêu chính của can thiệp và chính sách; cách đo khác nhau làm tỉ lệ khác nhau.
  loai: phat-hien
  nguon:
    - ten: "Modecki và cộng sự (2014), J Adolesc Health 55(5), 602–611: tóm tắt (Europe PMC); không mở được toàn văn (số 35% và 15% không kiểm được)"
      link: https://doi.org/10.1016/j.jadohealth.2014.06.007
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "…nguồn lực phòng ngừa nên nhắm vào hành vi bắt nạt nói chung, thay vì tách riêng "chống bắt nạt mạng" như một vấn đề hoàn toàn khác". Chữ mới: "…việc dính líu vào nhiều dạng gây hấn cùng lúc nên là mục tiêu chính của can thiệp và chính sách, thay vì tách riêng…". Lý do: Theo chữ "polyaggression involvement" của tóm tắt; thêm điểm cách đo ảnh hưởng tỉ lệ.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n57
  cau: "Ngộ nhận: tương quan–nhân quả; dữ liệu dọc cho thấy hài lòng giảm dự báo dùng nhiều hơn sau đó; cả hai chiều có thể cùng đúng."
  loai: phat-hien
  nguon:
    - ten: "Orben, Dienlin & Przybylski (2019), PNAS 116(21), 10226–10228: toàn văn (PMC6534991)"
      link: https://doi.org/10.1073/pnas.1902058116
    - ten: "Orben và cộng sự (2022), Nat Commun 13, 1649: toàn văn (PMC8960761)"
      link: https://doi.org/10.1038/s41467-022-29296-3
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Dữ liệu dọc cho thấy chiều ngược lại cũng đúng: teen đang buồn có xu hướng chui vào mạng xã hội nhiều hơn." Chữ mới: "Dữ liệu dọc của Orben và cộng sự cho thấy chiều ngược lại cũng đúng: hài lòng với cuộc sống giảm dự báo dùng mạng xã hội nhiều hơn sau đó." Lý do: "Chui vào mạng xã hội" (động cơ) không có trong nguồn; hài lòng là biến đo.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n24
  cau: '(Đã bỏ) OBPP dựa trên bốn nguyên tắc: người lớn ấm áp, quan tâm và tham gia; đặt giới hạn vững chắc; kỷ luật không thù địch nhất quán; người lớn là gương mẫu có thẩm quyền; "không dựa trên trừng phạt nặng mà trên sự kết hợp ấm áp và giới hạn".'
  loai: dinh-nghia
  nguon: []
  ket_qua_luot_1: da-bo
  ghi_chu: 'Không mở được sách Olweus (1993); tổng quan 2026 và Olweus & Limber (2010) tóm tắt không nêu bốn nguyên tắc. Chữ cũ: "Nền tảng của chương trình là bốn nguyên tắc: môi trường có sự ấm áp, quan tâm và tham gia của người lớn; đặt giới hạn vững chắc…" và gạch đầu dòng "Mô hình của Olweus: ấm áp + giới hạn vững chắc". Chữ mới: (bỏ cả hai chỗ; thay bằng bullet "Chương trình toàn trường" theo Gaffney 2021) Lý do: Không kiểm được.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n1
  cau: Ba tiêu chí của định nghĩa bắt nạt học đường (theo Olweus và CDC); chương trình can thiệp nào hiệu quả theo các phân tích tổng hợp; bắt nạt trên mạng và trực tiếp liên quan thế nào; áp lực thi cử qua PISA 2015 và một nghiên cứu dọc ở Huế (mô tả của trang).
  loai: phat-hien
  nguon:
    - ten: "Holt và cộng sự (2015), Pediatrics 135(2), e496–e509: toàn văn (PMC4702491)"
      link: https://doi.org/10.1542/peds.2014-1864
    - ten: "Trần và cộng sự (2024), J Rural Med 19(4), 279–290: toàn văn (PMC11442093)"
      link: https://doi.org/10.2185/jrm.2024-012
    - ten: "OECD (2017), PISA 2015 Results (Volume III), bản Overview (PDF bản OECD do Viện IBE Ba Lan lưu): toàn văn phần Overview, gồm Hình III.1.2 (bảng chỉ số lo âu theo nước)"
      link: https://doi.org/10.1787/9789264273856-en
  ket_qua_luot_1: da-sua
  ghi_chu: 'Mô tả khớp nội dung trang sau khi sửa. Chữ cũ: "…bắt nạt trên mạng khác gì bắt nạt trực tiếp, và vì sao học sinh châu Á — trong đó có Việt Nam — lo âu về bài vở đến vậy." Chữ mới: "…bắt nạt trên mạng và trực tiếp liên quan thế nào, và áp lực thi cử qua số liệu PISA 2015 và một nghiên cứu dọc ở Huế." Lý do: Việt Nam không có số liệu PISA 2015 cho chỉ số lo âu (OECD 2017), nên không thể nói học sinh Việt lo âu "đến vậy" theo PISA; "định nghĩa của Olweus" đổi thành "theo Olweus và CDC".'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n43
  cau: Đợt khảo sát cuối diễn ra năm 2021 giữa đại dịch COVID-19 và các em đã lên lớp cuối cấp, nên mức tăng stress không chỉ do một nguyên nhân; việc đi học thêm gắn với stress cao hơn là liên hệ quan sát.
  loai: phat-hien
  nguon:
    - ten: "Trần và cộng sự (2024), J Rural Med 19(4), 279–290: toàn văn (PMC11442093)"
      link: https://doi.org/10.2185/jrm.2024-012
  ket_qua_luot_1: dung
  ghi_chu: Câu mới thêm; "không chứng minh học thêm gây stress" là suy luận về thiết kế quan sát, được nguồn nói gián tiếp (tác giả viết "associated").
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n25
  cau: Các nghiên cứu ở Na Uy cho bằng chứng thuyết phục về hiệu quả của OBPP; các đánh giá ở Mỹ không đồng nhất nhưng cho thấy tác động tích cực lên việc học sinh tự báo cáo dính líu vào bắt nạt và hành vi chống đối xã hội.
  loai: phat-hien
  nguon:
    - ten: "Olweus & Limber (2010), Am J Orthopsychiatry 80(1), 124–134: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1111/j.1939-0025.2010.01015.x
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Đánh giá triển khai OBPP ở Mỹ cho thấy chương trình làm giảm đáng kể tỉ lệ bắt nạt và nạn nhân khi được thực hiện đúng (Olweus và Limber, 2010)." Chữ mới: "Olweus và Limber (2010) thấy các nghiên cứu ở Na Uy cho bằng chứng thuyết phục về hiệu quả; các đánh giá ở Mỹ không đồng nhất, nhưng cho thấy chương trình có tác động tích cực lên việc học sinh tự báo cáo dính líu vào bắt nạt và hành vi chống đối xã hội." Lý do: Tóm tắt nói "không đồng nhất", không nói "giảm đáng kể" hay "khi được thực hiện đúng".'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n77
  cau: Nghiên cứu công bố năm 2025 trên 714 thanh thiếu niên Việt Nam thấy stress và lo âu làm trung gian hoàn toàn cho mối liên hệ giữa bắt nạt (bị bắt nạt và bắt nạt người khác) với trầm cảm; cả hai nghiên cứu dựa trên bảng hỏi tự báo cáo, tóm tắt không nêu thiết kế dọc.
  loai: so-lieu
  nguon:
    - ten: "Ho và cộng sự (2025), J Child Adolesc Trauma 18(4), 871–879: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1007/s40653-025-00734-w
  ket_qua_luot_1: dung
  ghi_chu: 'Câu mới thêm. Chỗ chưa chắc: tóm tắt không nói thiết kế (cắt ngang hay dọc) nên trang chỉ nói "đi cùng nhau"; lượt 2 nên mở toàn văn.'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n75
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào đã mở so sánh cách "ép hai bên bắt tay làm hòa" với các cách xử lý khác ở Việt Nam.
  loai: thoi-su
  nguon:
    - ten: "Tran và cộng sự (2025), Camb Prisms Glob Ment Health 12, e139: tóm tắt (Europe PMC, PMC12720387)"
      link: https://doi.org/10.1017/gmh.2025.10096
    - ten: "Ho và cộng sự (2025), J Child Adolesc Trauma 18(4), 871–879: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1007/s40653-025-00734-w
  ket_qua_luot_1: da-sua
  ghi_chu: 'Lần tìm: Europe PMC 10/11/2026, truy vấn "(Vietnam OR Vietnamese) AND bullying AND (adolescents OR students)" (701 kết quả; các kết quả đầu là khảo sát cắt ngang, không phải so sánh cách xử lý). Tìm chưa kỹ (không dùng Google Scholar, không tìm tạp chí trong nước); lượt 2 và review nên tìm thêm. Chữ cũ: (không có) Chữ mới: Câu thời sự mới, có mốc và hạn, thay cho phê phán cách làm của giáo viên chủ nhiệm (n73). Lý do: Quy tắc câu "chưa tìm thấy": mốc, hạn, nguồn là lần tìm.'
- trang: kham-pha/phat-trien/mang-xa-hoi-teen
  id: n20
  cau: 'Trong cùng bộ dữ liệu, ăn khoai tây cho liên hệ nhỏ gần bằng công nghệ số (YRBS: β −0,042 so với −0,049) và đeo kính còn "tệ hơn" ở một bộ dữ liệu.'
  loai: so-lieu
  nguon:
    - ten: "Orben & Przybylski (2019), Nat Hum Behav 3(2), 173–182: toàn văn (bản tác giả chấp nhận, kho Oxford ORA); thêm bản tin của OII Oxford (oii.ox.ac.uk) cho tỉ lệ 2,7 và 4,3"
      link: https://doi.org/10.1038/s41562-018-0506-1
  ket_qua_luot_1: da-sua
  ghi_chu: 'Hệ số của kính: so ở bộ dữ liệu MCS (−0,061, so với hệ số công nghệ của bộ đó; chưa đối chiếu số của MCS), nên chỉ ghi "ở một bộ dữ liệu". Bản tin OII nói glasses "worse association". Chữ cũ: "…tương đương với... ăn khoai tây; đeo kính cận còn "có hại" hơn." và "ăn khoai tây thường xuyên cho liên hệ tương đương, đeo kính cận còn tệ hơn". Chữ mới: "…ăn khoai tây cho liên hệ nhỏ tương tự và đeo kính còn "tệ hơn"." và "(ở YRBS, β −0,042 so với −0,049 của công nghệ số), đeo kính còn "tệ hơn" ở một bộ dữ liệu". Lý do: "Tương đương" thành "gần bằng" kèm số; "kính cận" thành "kính" (nguồn: wearing glasses).'
- trang: kham-pha/phat-trien/tam-ly-hoc-duong
  id: n59
  cau: "Các gợi ý cụ thể cho cha mẹ (lắng nghe con, ghi lại diễn biến, trao đổi với giáo viên chủ nhiệm; với bắt nạt mạng: lưu bằng chứng, chặn, báo cáo nền tảng, nói với người lớn tin cậy) là thông lệ thực hành, chưa phải kết quả của nghiên cứu đã kiểm."
  loai: loi-khuyen
  nguon:
    - ten: "Gaffney, Ttofi & Farrington (2021), J Sch Psychol 85, 37–56: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.jsp.2020.12.002
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Các bước cụ thể không có nguồn đã mở; đã ghi rõ trên trang. Chữ cũ: "…cha mẹ cần tin lời con trước, ghi lại diễn biến… và làm việc với giáo viên chủ nhiệm thay vì xông vào "xử" phụ huynh nhà kia — điều này thường khiến con bị trả đũa nặng hơn. Với bắt nạt trên mạng: lưu bằng chứng… chặn… báo cáo…". Chữ mới: "Các gợi ý cụ thể dưới đây là thông lệ thực hành, chưa phải kết quả của nghiên cứu mà chúng tôi đã kiểm: … cha mẹ có thể lắng nghe con trước, ghi lại diễn biến… trao đổi với giáo viên chủ nhiệm." Lý do: Bỏ "thường khiến con bị trả đũa nặng hơn" (không kiểm được); "cần" → "có thể".'
