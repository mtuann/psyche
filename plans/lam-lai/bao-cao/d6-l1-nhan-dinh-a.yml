- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n1
  cau: "Mô tả: giấc ngủ, nhất là giấc ngủ sóng chậm, có thể giúp củng cố trí nhớ."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n2
  cau: "Đáp án thu gọn: người ngủ sau khi học nhớ lại nhiều hơn khi thức trắng, kể cả khi người thức trắng đã được ngủ bù trước lúc kiểm tra; nên nhiều khả năng An nhớ phần đã học tốt hơn."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n3
  cau: Trong thí nghiệm của Gais, người thức trắng không dùng đêm để học thêm (xem TV, chơi trò chơi), nên phần "Bình học thêm mấy tiếng" chưa được kiểm tra trực tiếp.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n4
  cau: Theo mô hình được nhiều nhà nghiên cứu ủng hộ, khi ngủ sâu não tái kích hoạt ("phát lại") những gì đã học trong ngày.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n5
  cau: Giấc ngủ gồm các giai đoạn luân phiên; giấc ngủ sóng chậm (SWS, ngủ sâu, sóng não chậm và đều) tập trung ở nửa đầu đêm, giấc ngủ mắt chuyển động nhanh (REM) ở nửa sau đêm.
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n6
  cau: (Đã bỏ) "REM — lúc ta mơ nhiều nhất".
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n7
  cau: Bài tổng quan "The memory function of sleep" đăng trên Nature Reviews Neuroscience, tập 11, số 2, trang 114–126 (Diekelmann và Born, 2010).
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n8
  cau: Bài tổng quan tổng hợp bằng chứng trên người và động vật gặm nhấm.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n9
  cau: "Bài đề xuất khung hai giai đoạn nối tiếp: củng cố hệ thống trong SWS rồi củng cố synap trong REM."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n10
  cau: Trong SWS, sóng chậm, thoi ngủ và gợn sóng phối hợp việc tái kích hoạt và tái phân phối các ký ức phụ thuộc hồi hải mã sang vỏ não.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n11
  cau: Quá trình đó diễn ra khi hoạt động acetylcholine ở mức thấp nhất.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n12
  cau: Chính bài tổng quan lưu ý việc tái phân phối ký ức này chưa được chứng minh trực tiếp.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n13
  cau: Trong REM, với acetylcholine và sóng theta cao, hoạt động của các gen liên quan đến tính dẻo tăng cục bộ, và điều này có thể tạo điều kiện củng cố synap ở vỏ não.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n14
  cau: Hồi hải mã là kho lưu trữ tạm, vỏ não là kho lưu trữ dài hạn (mô hình hai kho); hồi hải mã học nhanh, vỏ não học chậm.
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n15
  cau: "Gais và cộng sự: người tham gia là học sinh trung học Mỹ, nói tiếng Anh và chưa biết tiếng Đức."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n16
  cau: Mỗi danh sách gồm 24 cặp từ tiếng Anh–tiếng Đức, học tối đa 10 phút.
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n17
  cau: "Thí nghiệm 1: 12 học sinh, thiết kế trong-nhóm, ai cũng làm đủ bốn điều kiện."
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n18
  cau: "Thí nghiệm 1: học lúc 8 giờ tối rồi ngủ trong khoảng 3 giờ sau đó, hoặc học lúc 8 giờ sáng rồi thức khoảng 15 giờ mới ngủ; kiểm tra lại sau 24 hoặc 36 giờ."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n19
  cau: "Thí nghiệm 2: 14 học sinh nam, thiết kế trong-nhóm, thứ tự đảo ngẫu nhiên."
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n20
  cau: Ở lại thức trắng đêm dưới sự giám sát (xem TV, chơi trò chơi); không được đọc sách để tránh gây nhiễu cho trí nhớ.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n21
  cau: Sáng hôm sau người thức trắng về nhà ngủ bù (trung bình khoảng 5,6 giờ ban ngày và 7,6 giờ đêm kế tiếp).
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n22
  cau: Cả hai điều kiện được kiểm tra 48 giờ sau khi học, nên người thức trắng đã được ngủ bù trước lúc kiểm tra, loại trừ khả năng nhớ kém chỉ vì mệt.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n23
  cau: "Kết quả thí nghiệm 1: tỉ lệ quên cao hơn rõ rệt khi học buổi sáng (ngủ muộn) so với buổi tối (ngủ sớm); khoảng giữ 24 hay 36 giờ không tạo khác biệt đáng kể."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n24
  cau: "Thí nghiệm 2: người tham gia nhớ rõ ràng nhiều từ hơn khi đã ngủ so với khi thức trắng (trung bình mất khoảng 0,2 từ so với khoảng 1,8 từ)."
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n25
  cau: "Tác hại của việc thức trắng vẫn còn sau khi ngủ bù: các tác giả kết luận mệt mỏi lúc kiểm tra không giải thích được khác biệt; điều này gợi ý ảnh hưởng nằm ở củng cố trong đêm đầu, chứ không chỉ ở lúc truy xuất."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n26
  cau: Cỡ mẫu nhỏ (12 và 14 người) và danh sách từ ngắn là giới hạn của thí nghiệm.
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n27
  cau: Trí nhớ từ vựng là trí nhớ tường thuật (declarative), được xem là phụ thuộc hồi hải mã; trước đó, phần lớn nghiên cứu gần đây về giấc ngủ và trí nhớ ở người tập trung vào trí nhớ quy trình, được xem là không phụ thuộc hồi hải mã.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n28
  cau: Gais, Lucas & Born (2006), Learning & Memory, 13(3), 259–262.
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n29
  cau: "Rasch và cộng sự: tình nguyện viên học vị trí 15 cặp thẻ trên lưới hai chiều vào buổi tối, trong khi ngửi mùi hoa hồng; trong hai giai đoạn SWS đầu của đêm, mùi được phảng phất lại."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n30
  cau: Đêm đối chứng chỉ phảng phất không khí không mùi (thiết kế bắt chéo, mù đôi, cùng người làm cả hai đêm).
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n31
  cau: "Thí nghiệm chính 18 người: nhớ lại khoảng 97% vị trí sau đêm có mùi, so với khoảng 86% sau đêm không mùi."
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n32
  cau: "Các thí nghiệm kiểm soát (17–18 người mỗi thí nghiệm): nhắc mùi trong REM, lúc thức, hoặc khi mùi không xuất hiện lúc học đều không có tác dụng với trí nhớ vị trí."
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n33
  cau: Một thí nghiệm fMRI cho thấy hồi hải mã tăng hoạt động khi mùi được nhắc lại trong SWS.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n34
  cau: Các tác giả coi đây là bằng chứng thực nghiệm cho vai trò nhân quả của tái kích hoạt ký ức trong SWS; mỗi thí nghiệm chỉ 17–18 người.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n35
  cau: Rasch, Büchel, Gais & Born (2007), Science, 315(5817), 1426–1429.
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n36
  cau: 'Khung "Khá vững: giấc ngủ sóng chậm củng cố trí nhớ tường thuật".'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n37
  cau: Phân tích tổng hợp 823 hiệu ứng từ 271 mẫu độc lập thấy lợi ích của giấc ngủ ở mức vừa (g = 0,44), giảm còn g = 0,28 sau khi hiệu chỉnh thiên lệch báo cáo chọn lọc.
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n38
  cau: "Phân tích tổng hợp 91 thí nghiệm nhắc lại ký ức có chủ đích: nhắc trong SWS có tác dụng nhỏ (g = 0,27), nhắc trong REM hay lúc thức thì không."
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n39
  cau: 'Khung "Đang tranh cãi: vai trò chính xác của giấc ngủ REM".'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n40
  cau: Ức chế REM bằng thuốc không làm giảm, thậm chí cải thiện trí nhớ kỹ năng (Rasch và cộng sự, 2009); bài tổng quan lưu ý thuốc có thể tác động trực tiếp lên tính dẻo synap và bù cho việc mất REM.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n41
  cau: Bài tổng quan 2010 tóm tắt bằng chứng về vai trò của REM với trí nhớ cảm xúc.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n42
  cau: 'Khung "Bác bỏ: thức trắng đêm thay cho giấc ngủ giúp nhớ lại phần đã học tốt hơn".'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n43
  cau: Phân tích tổng hợp của Berres và Erdfelder (2021) thấy người ngủ nhớ lại nhiều hơn người thức cùng khoảng thời gian.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n44
  cau: "Củng cố hệ thống: trong SWS, hồi hải mã phát lại ký ức (gợn sóng ripple), thoi ngủ giúp vỏ não sẵn sàng tiếp nhận, sóng chậm phối hợp các hoạt động ấy."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n45
  cau: Theo mô hình hai kho, việc chuyển kho diễn ra dần qua nhiều lần tái kích hoạt, lúc ngủ khi não không ghi nhận thông tin mới, nên tránh nhiễu và ghi đè lên kiến thức cũ.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n46
  cau: "Củng cố synap trong REM: môi trường hóa học của REM (acetylcholine cao, sóng theta) có thể tạo điều kiện gia cố các kết nối ở vỏ não; đây là phần còn nhiều tranh luận."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n47
  cau: "Giả thuyết cân bằng synap: sóng chậm làm giảm đồng loạt cường độ các kết nối synap, các kết nối yếu bị loại bỏ, nhờ đó tín hiệu nổi bật hơn nhiễu."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n48
  cau: Bài tổng quan xem giả thuyết cân bằng synap và củng cố hệ thống chủ động là hai giả thuyết không loại trừ nhau, nhiều khả năng phối hợp với nhau.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n49
  cau: "Cả ba ý tưởng cùng hướng nhìn: giấc ngủ không chỉ là thời gian chết của trí nhớ, mà có thể là ca làm việc thứ hai của nó."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n50
  cau: 'Mục Áp dụng 1: "Xếp lịch học sao cho sau đó là một giấc ngủ đêm" :nhan[kha-vung].'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n51
  cau: Gais thấy ngủ trong vài giờ sau khi học giúp nhớ từ vựng tốt hơn học buổi sáng rồi thức cả ngày, trong một thí nghiệm nhỏ (12 học sinh); có thể học xong buổi tối rồi đi ngủ đúng giờ.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n52
  cau: 'Mục Áp dụng 2: "Đừng thức trắng đêm trước ngày thi" :nhan[kha-vung].'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n53
  cau: Nghiên cứu của Gais và phân tích tổng hợp cho thấy người thức trắng nhớ lại phần đã học kém hơn người đã ngủ, kể cả sau khi ngủ bù.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n54
  cau: Chưa có nghiên cứu nào ở đây so sánh trực tiếp việc dùng đêm thức để học thêm với ngủ đủ.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n55
  cau: Nếu thường xuyên khó ngủ hay mất ngủ kéo dài, hãy trao đổi với người có chuyên môn; hướng dẫn của NHS khuyên đi khám khi mất ngủ kéo dài nhiều tháng hay ảnh hưởng đến sinh hoạt hằng ngày.
  loai: loi-khuyen
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n57
  cau: 'Mục Áp dụng 3: "Muốn nhớ lâu, hãy để ký ức qua đêm nhiều lần" :nhan[kha-vung].'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n58
  cau: Mô hình hai kho cho rằng ký ức chuyển dần qua nhiều lần tái kích hoạt, nên ôn tập rải ra nhiều ngày (mỗi lần học xong đều được ngủ) là một lịch học hợp lý.
  loai: loi-khuyen
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n60
  cau: Các thí nghiệm then chốt (Gais 2006; Rasch 2007) do các nhóm nghiên cứu ở Đức thực hiện (Lübeck); Gais trên học sinh trung học Mỹ, Rasch trên tình nguyện viên (bài báo không nêu quốc tịch).
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n61
  cau: Tính đến 11/2026, chưa tìm thấy thí nghiệm nào kiểm tra việc ngủ sau khi học có giúp nhớ trên học sinh, sinh viên Việt Nam.
  loai: thoi-su
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n62
  cau: Một khảo sát cắt ngang trên 639 học sinh trung học ở Hà Nội và Hưng Yên ghi nhận mối liên quan nhỏ giữa triệu chứng mất ngủ và thành tích học tập tự báo cáo (Le và cộng sự, 2026), không đo củng cố trí nhớ.
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n63
  cau: "Suy luận (đã ghi rõ chưa kiểm tra): cơ chế củng cố trí nhớ trong giấc ngủ là đặc điểm chung của não người nên kết luận chính có thể đúng với nhiều nền văn hóa; lịch học, giờ ngủ có thể làm đổi mức độ ảnh hưởng."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n64
  cau: 'Ngộ nhận "thức trắng ôn thi học nhiều hơn thì nhớ nhiều hơn": người thức trắng sau khi học (không học thêm) nhớ lại ít hơn khi được ngủ; việc dùng đêm thức để học thêm chưa được thí nghiệm ấy kiểm tra.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n65
  cau: 'Ngộ nhận "ngủ là lúc não nghỉ hoàn toàn": trong SWS hồi hải mã phát lại ký ức; trong REM, theo bài tổng quan 2010, hoạt động của các gen liên quan đến tính dẻo của synap tăng cục bộ.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n66
  cau: "Tính đến 11/2026, bằng chứng về việc học điều mới trong lúc ngủ vẫn chưa kết luận được: tổng quan 2023 (51 bài) thấy dạng học đơn giản (quen dần, điều kiện hóa) có thể xảy ra lúc ngủ, còn với việc học phức tạp như ngôn ngữ mới thì bằng chứng hành vi về chuyển kiến thức sang lúc tỉnh còn chưa kết luận được (Ataei và cộng sự, 2023)."
  loai: thoi-su
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n67
  cau: Một thí nghiệm năm 2019 chỉ thấy các liên kết từ mới đơn giản có thể hình thành khi từ được phát đúng đỉnh sóng chậm (Züst và cộng sự, 2019); chưa có gì cho thấy nghe băng bài giảng cả đêm thay được việc học.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n68
  cau: Thí nghiệm "nhắc mùi" 2007 chỉ cho thấy có thể củng cố cái đã học lúc thức, và chỉ khi mùi hương đã gắn với lúc học, trong đúng giai đoạn SWS.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: q1
  cau: "Câu hỏi 1: theo Diekelmann và Born, trong SWS ký ức được tái kích hoạt ở hồi hải mã và tái phân phối dần về vỏ não; việc gia cố synap trong môi trường acetylcholine cao, theo bài tổng quan, có thể là việc của REM."
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: q2
  cau: "Câu hỏi 2: Gais cho người thức trắng ngủ bù trước khi kiểm tra để loại trừ khả năng họ nhớ kém chỉ vì mệt lúc làm bài; kiểm tra sau 48 giờ, cả hai điều kiện đã ngủ bù; các tác giả kết luận mệt mỏi không giải thích được khác biệt."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: q3
  cau: "Câu hỏi 3: thí nghiệm nhắc mùi cho thấy tái kích hoạt ký ức trong SWS là nguyên nhân giúp củng cố trí nhớ vị trí đã học; mùi chỉ có tác dụng khi đã xuất hiện lúc học và được nhắc trong SWS; mỗi thí nghiệm 17–18 người."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: q4
  cau: 'Câu hỏi 4: vì sao vai trò của REM được gắn "Đang tranh cãi": bằng chứng chưa nhất quán (ức chế REM không làm giảm trí nhớ kỹ năng); bài tổng quan viết REM có thể thuận lợi cho củng cố synap, còn là giả thuyết.'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: q5
  cau: "Câu hỏi 5: với kỳ thi sau 3 ngày, lịch hợp lý là học rải 3 ngày, mỗi tối đi ngủ đúng giờ; học rải tận dụng hiệu ứng ngắt quãng, ngủ đủ sau mỗi buổi học cho giấc ngủ cơ hội củng cố, còn thức trắng thay cho giấc ngủ thì chưa thấy bằng chứng có lợi cho việc nhớ phần đã học."
  loai: loi-khuyen
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n70
  cau: "Mục Nguồn: 9 tài liệu (Diekelmann & Born 2010; Gais, Lucas & Born 2006; Rasch và cộng sự 2007; Ataei 2023; Berres & Erdfelder 2021; Hu 2020; Rasch 2009; Le 2026; Züst 2019) có tên, tạp chí, tập, trang, DOI đúng."
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n1
  cau: "Mô tả: Lazarus và Folkman (1984) đề xuất rằng hiệu quả của cách đối phó phụ thuộc vào tình huống; đối phó tập trung vào vấn đề được cho là hợp với việc thay đổi được, đối phó cảm xúc hợp với việc không thay đổi được."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n2
  cau: Bằng chứng cho sự khớp giữa cách đối phó và tình huống còn lẫn lộn, và tính linh hoạt được xem là hướng hứa hẹn hơn (mô tả).
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n4
  cau: Câu hỏi 'Ai đang đối phó đúng?' đặt bẫy, vì giả định có một đáp án đúng cho mọi tình huống.
  loai: loi-khuyen
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n5
  cau: Lan dùng cách đối phó tập trung vào cảm xúc cho một vấn đề thay đổi được (kỳ thi, càng ôn càng cải thiện được); Minh dùng cách tập trung vào vấn đề cho một việc không thay đổi được (bệnh không thể chữa khỏi).
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n6
  cau: Theo giả thuyết khớp nhau, Lan và Minh dùng cách đối phó lệch với tình huống, và lệch pha như vậy có thể làm họ kiệt sức hơn.
  loai: loi-khuyen
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n7
  cau: Trong đời thực ranh giới giữa việc thay đổi được và không thay đổi được thường mờ; chăm sóc giảm nhẹ cho cha vẫn là điều Minh có thể làm.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n8
  cau: "Đáp án của giả thuyết khớp nhau: điều quan trọng là sự khớp nhau giữa cách đối phó và bản chất tình huống; đây là giả thuyết có bằng chứng lẫn lộn."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n9
  cau: Một điểm xuất phát của lý thuyết đánh giá nhận thức về stress là nhận xét rằng cùng một sự việc, mỗi người phản ứng một khác.
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n10
  cau: Lazarus và Folkman cho rằng một phần câu trả lời nằm ở đánh giá (appraisal), cách mỗi người diễn giải tình huống, chứ không chỉ ở bản thân sự việc.
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n11
  cau: "Mô hình gồm hai bước đánh giá đan xen nhau: đánh giá ban đầu (primary) và đánh giá thứ cấp (secondary)."
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n12
  cau: "Đánh giá ban đầu: 'chuyện này có ảnh hưởng gì đến mình không?'; kỳ thi có thể bị đánh giá là mối đe dọa, điều có lợi, hoặc chuyện chẳng đáng bận tâm."
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n13
  cau: "Đánh giá thứ cấp: 'mình có thể làm được gì? việc này có thay đổi được không?'; cân nhắc thay đổi tình huống, chấp nhận nó, tìm thêm thông tin hay kìm lại chưa hành động."
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n14
  cau: Đối phó (coping) là những nỗ lực nhận thức và hành vi liên tục thay đổi nhằm quản lý các đòi hỏi được đánh giá là vượt quá nguồn lực của bản thân.
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n15
  cau: "Hai họ chiến lược đối phó: tập trung vào vấn đề (problem-focused) và tập trung vào cảm xúc (emotion-focused)."
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n16
  cau: Đối phó tập trung vào vấn đề tấn công trực tiếp vào nguồn stress (ví dụ lập kế hoạch ôn thi, thương lượng lại deadline, tìm thông tin).
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n17
  cau: Đối phó tập trung vào cảm xúc điều chỉnh phản ứng cảm xúc (ví dụ tìm sự hỗ trợ, nhìn nhận lại theo hướng tích cực, giữ khoảng cách, tạm thời phân tâm).
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n18
  cau: Theo mô hình, đối phó thay đổi theo những đánh giá liên tục về mối quan hệ người–môi trường đang biến đổi.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n19
  cau: Vì vậy sau khi đối phó ta có thể đánh giá lại ('cách này có hiệu quả không?') rồi điều chỉnh tiếp.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n20
  cau: Đối phó được xem chủ yếu là một quá trình động, chứ không chỉ là một 'tính cách' cố định.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n21
  cau: "Lazarus và Folkman (1984) viết cuốn Stress, Appraisal, and Coping (New York: Springer Publishing Company)."
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n22
  cau: "Họ đề xuất mô hình giao dịch: stress không nằm ở môi trường, cũng không nằm ở con người, mà nằm ở mối quan hệ giữa người và môi trường, mối quan hệ mà người ấy đánh giá là vượt quá nguồn lực của mình và đe dọa sức khỏe tinh thần."
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n23
  cau: "Ba ý cốt lõi vẫn còn được dùng đến hôm nay: (1) đánh giá của cá nhân là khâu trung gian then chốt của phản ứng stress; (2) đối phó chủ yếu là quá trình thay đổi theo tình huống, không chỉ là đặc điểm tính cách ổn định; (3) không nên đánh giá một chiến lược đối phó mà không xét bối cảnh dùng nó."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n24
  cau: "Trước đây đối phó thường được xem là phản ứng đối với cảm xúc; Folkman và Lazarus (1988) đề xuất cách nhìn rộng hơn: cảm xúc và đối phó ảnh hưởng lẫn nhau trong một mối quan hệ động, hai chiều."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n25
  cau: Vì vậy đừng hình dung đối phó như công thức tuyến tính 'stress → chọn cách → xong'.
  loai: loi-khuyen
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n26
  cau: Nghiên cứu Folkman và cộng sự (1986) trên 150 người trưởng thành trong cộng đồng (75 cặp vợ chồng); mỗi người kể về sự việc căng thẳng nhất của tuần vừa qua trong năm lần phỏng vấn cách nhau một tháng.
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n27
  cau: Các quá trình đánh giá và đối phó (gộp qua năm tình huống) cùng các đặc điểm tính cách giải thích được một phần đáng kể các triệu chứng tâm lý, nhưng không giải thích được đáng kể tình trạng sức khỏe thể chất.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n28
  cau: Đánh giá và đối phó biến động từ tình huống này sang tình huống khác nhiều hơn là ổn định.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n29
  cau: Các tác giả nhấn mạnh rằng không nên coi một dạng đối phó là tốt hay xấu mà không xét bối cảnh dùng nó; hiệu quả của một chiến lược có thể tùy thuộc vào tình huống, một ý tưởng sau này được kiểm chứng trực tiếp ở các nghiên cứu về sự khớp nhau.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n31
  cau: Forsythe và Compas kiểm chứng giả thuyết khớp nhau trên 84 sinh viên đại học (tuổi trung bình 19).
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n32
  cau: Mỗi người kể về sự kiện lớn gây khổ sở nhất trong 6 tháng qua (thường là bệnh hay qua đời của người thân, hoặc chuyển đi học đại học) và chuyện phiền toái hằng ngày gây khổ nhất trong 2 tuần qua (thường là chuyện ở trường như làm bài kém).
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n33
  cau: Với sự kiện lớn, triệu chứng tâm lý cao khi có lệch pha giữa cách đối phó và mức kiểm soát được cảm nhận (ví dụ cố thay đổi trực tiếp một sự kiện được cho là ngoài tầm kiểm soát) và thấp khi hai thứ khớp nhau; với chuyện phiền toái hằng ngày, không thấy hiệu ứng nào.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n34
  cau: Giả thuyết cho rằng đối phó tập trung vào vấn đề phát huy tác dụng với việc thay đổi được, còn đối phó cảm xúc thích hợp hơn với việc không thay đổi được, vì khi đó trạng thái bên trong của ta là thứ duy nhất còn có thể thay đổi.
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n35
  cau: Conway và Terry (1992, 101 sinh viên và người dân trong cộng đồng) thấy đối phó tập trung vào vấn đề đi cùng đánh giá hiệu quả đối phó tốt hơn chỉ ở những tình huống được đánh giá là kiểm soát được, nhưng không thấy đối phó cảm xúc thích ứng hơn ở tình huống không kiểm soát được.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n36
  cau: "Zakowski, Hall, Klein và Baum (2001, 72 người trưởng thành trong cộng đồng) ủng hộ giả thuyết khớp nhau một phần: có tương tác giữa mức kiểm soát được cảm nhận và đối phó cảm xúc trong việc dự báo mức stress."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n37
  cau: Kendall và Terry theo dõi 90 người bị chấn thương sọ não cùng người thân trong một nghiên cứu dọc, và không tìm thấy sự ủng hộ cho giả thuyết khớp nhau, cả ngắn hạn lẫn dài hạn.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n38
  cau: Đối phó tập trung vào vấn đề có liên quan tích cực đến hoạt động theo vai trò (role functioning), nhưng việc kiên trì dùng nó trước những khó khăn do chấn thương gây ra có thể đi cùng suy sụp cảm xúc về lâu dài.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n39
  cau: Mức kiểm soát được cảm nhận thay đổi nhiều giữa các tình huống (Folkman 1986 thấy các đánh giá kiểu này biến động nhiều hơn ổn định), nên ranh giới đổi được/không đổi được có thể mờ.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n40
  cau: Một số chiến lược thường xếp vào nhóm tập trung vào cảm xúc, như trốn tránh hay mong ước viển vông, nhìn chung đi cùng sức khỏe kém hơn chứ không phải cách đối phó lành mạnh (phân tích tổng hợp của Penley, Tomaka và Wiebe, 2002).
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n41
  cau: Bonanno và Burton cho rằng các nhà nghiên cứu hay ngầm giả định một chiến lược nào đó lúc nào cũng có lợi hoặc lúc nào cũng có hại, và gọi giả định này là ngộ nhận hiệu quả đồng nhất (fallacy of uniform efficacy).
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n42
  cau: "Họ đề xuất khái niệm linh hoạt điều tiết (regulatory flexibility) qua ba thành phần: nhạy cảm với bối cảnh, vốn chiến lược đa dạng, nhạy với phản hồi."
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n43
  cau: Theo khung nhìn này, người điều tiết tốt không phải người luôn đối mặt hay luôn buông bỏ, mà là người biết khi nào đối mặt, khi nào buông, và khi nào đổi chiến lược.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n44
  cau: Một phân tích tổng hợp 329 nghiên cứu (Cheng, Lau và Chan, 2014) thấy tính linh hoạt khi đối phó có liên hệ dương, ở mức nhỏ đến vừa (r = 0,23), với sự thích ứng tâm lý; mức liên hệ khác nhau nhiều giữa các nghiên cứu và tùy cách định nghĩa linh hoạt.
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n45
  cau: "Khung: Khá vững: không có chiến lược đối phó nào tốt cho mọi tình huống."
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n46
  cau: "Khung: Khá vững: cách ta đánh giá tình huống định hình phản ứng stress."
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n47
  cau: "Khung: Đang tranh cãi: giả thuyết 'khớp nhau' đúng đến mức nào? (Forsythe và Compas 1987 ủng hộ ở sự kiện lớn, Conway và Terry 1992 và Zakowski 2001 ủng hộ một phần, Kendall và Terry 2008 không ủng hộ.)"
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n48
  cau: Một số nhà nghiên cứu hiện nay chuyển từ câu hỏi 'chiến lược nào khớp?' sang 'ai linh hoạt trong việc chuyển chiến lược?' (Bonanno và Burton, 2013; Cheng và cộng sự, 2014).
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n49
  cau: "Mô hình giao dịch: stress là một mối quan hệ, không phải một sự vật; hai người cùng gặp một khối lượng công việc có thể đánh giá khác nhau và có thể phản ứng khác nhau."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n50
  cau: Câu 'Mọi can thiệp hiệu quả đều phải đi qua cửa đánh giá này.' (đã bỏ khỏi trang).
  loai: loi-khuyen
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n51
  cau: "Giả thuyết khớp nhau (Lazarus và Folkman, 1984; được kiểm chứng ở Forsythe và Compas, 1987; Conway và Terry, 1992): hiệu quả = chiến lược × bối cảnh; khi tình huống kiểm soát được, nỗ lực thay đổi tình huống có đất phát huy; khi không kiểm soát được, giả thuyết cho rằng điều chỉnh phản ứng bên trong sẽ thích ứng hơn; các kiểm chứng ủng hộ chỉ một phần."
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n52
  cau: "Linh hoạt điều tiết (Bonanno và Burton, 2013): không chỉ chọn đúng chiến lược cho tình huống mà còn theo dõi và đổi chiến lược khi tình huống thay đổi; ba thành phần được đề xuất để giải thích vì sao cùng một chiến lược có thể cho kết quả khác nhau ở những người khác nhau."
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n54
  cau: "Khung nhãn mục 1: 'Hỏi trước tiên: việc này có thay đổi được không?' là khá vững; câu trả lời, dù chỉ là ước lượng, có thể là la bàn cho các bước tiếp theo."
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n55
  cau: "Khung nhãn mục 2: 'Thay đổi được → hành động cụ thể, chia nhỏ' là khá vững; với việc thay đổi được, đối phó tập trung vào vấn đề thường là lựa chọn hợp lý trước tiên (lập kế hoạch, chia việc lớn thành việc nhỏ, tìm thông tin)."
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n56
  cau: "Khung nhãn mục 3: 'Không thay đổi được → điều chỉnh phản ứng bên trong, nhưng đừng trốn tránh' là đang tranh cãi; một số nghiên cứu gợi ý điều chỉnh phản ứng bên trong, chẳng hạn chấp nhận thực tế, có thể thích ứng hơn việc cố sửa tình huống; thường đi cùng sức khỏe kém hơn là các dạng trốn tránh hay mong ước viển vông."
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n57
  cau: "Khung nhãn mục 4: 'Đánh giá lại sau mỗi vòng' là khá vững; mỗi vài ngày hãy tự hỏi 'cách mình đang dùng có giúp gì không? tình hình đã khác chưa?'; điều này gần với thành phần 'nhạy với phản hồi' và với ý đối phó thay đổi theo đánh giá liên tục trong mô hình của Lazarus và Folkman."
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n58
  cau: "Khung nhãn mục 5: 'Xây vốn nhiều cách, đừng chỉ một chiêu' là khá vững; người chỉ biết một cách đối phó có thể lúng túng khi gặp tình huống không hợp; hãy mở rộng kỹ năng giải quyết vấn đề và kỹ năng xoa dịu cảm xúc."
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n59
  cau: "Khung nhãn mục 6: 'Khi khó xoay xở với stress, hãy tìm sự giúp đỡ chuyên nghiệp' là vững chắc theo đồng thuận của hướng dẫn chính thức: nếu thấy khó xoay xở với stress, hoặc những cách tự làm không giúp được, hãy tìm chuyên gia tâm lý hoặc bác sĩ."
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n60
  cau: Tìm kiếm sự giúp đỡ có thể xem là một cách đối phó chủ động.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n63
  cau: Các nghiên cứu nền tảng về đối phó stress thực hiện chủ yếu ở phương Tây, trên các mẫu phương Tây (Mỹ, Úc, châu Âu).
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n64
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra trực tiếp giả thuyết khớp nhau hay linh hoạt đối phó trên người Việt.
  loai: thoi-su
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n65
  cau: Một tổng quan về đối phó tập thể (Kuo, 2013) thấy các hành vi đối phó tập thể phổ biến ở nhiều nhóm văn hóa, nhất là người châu Á, và gắn với giá trị tập thể.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n66
  cau: Phân tích tổng hợp của Cheng và cộng sự (2014) thấy liên hệ giữa linh hoạt đối phó và thích ứng mạnh hơn ở các mẫu từ nước ít cá nhân chủ nghĩa hơn.
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n67
  cau: Nếu Việt Nam được xem là xã hội thiên về tập thể, vốn đối phó của người Việt có thể mang tính tập thể nhiều hơn (tìm đến gia đình, họ hàng) thay vì mô hình cá nhân tự xử lý phổ biến trong nghiên cứu phương Tây; cần nghiên cứu thực nghiệm trên người Việt.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n68
  cau: "Ngộ nhận 1: 'Đối phó tập trung vào cảm xúc là yếu đuối, là trốn tránh.' Không hẳn: Forsythe và Compas (1987) thấy đối phó cảm xúc đi cùng triệu chứng thấp hơn ở sự kiện lớn được cảm nhận là ít kiểm soát được, dù Kendall và Terry (2008) và Conway và Terry (1992) không xác nhận; nhưng trốn tránh và mong ước viển vông nhìn chung đi cùng sức khỏe kém hơn (Penley và cộng sự, 2002)."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n69
  cau: "Ngộ nhận 2: 'Cứ hành động là tốt, đừng ngồi yên.' Chỉ hợp lý khi hành động đó có thể thay đổi tình huống; Forsythe và Compas (1987) thấy triệu chứng cao hơn khi dùng nhiều đối phó vấn đề với sự kiện được cảm nhận là ít kiểm soát được, và Kendall và Terry (2008) thấy kiên trì dùng nó trước khó khăn do chấn thương có thể đi cùng suy sụp cảm xúc về lâu dài."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n70
  cau: "Ngộ nhận 3: 'Stress là do hoàn cảnh gây ra, nên chỉ cần đổi hoàn cảnh là hết.' Theo mô hình giao dịch, stress là mối quan hệ giữa người và môi trường mà người ấy đánh giá là vượt quá nguồn lực; nên đổi hoàn cảnh có thể giúp, nhưng cách đánh giá của mỗi người cũng đóng vai trò, và hai người có thể phản ứng khác nhau trước cùng một tình huống."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: q1
  cau: "Câu hỏi 1: Theo Lazarus và Folkman (1984), đối phó (coping) là những nỗ lực nhận thức và hành vi liên tục thay đổi nhằm quản lý các đòi hỏi được đánh giá là vượt quá nguồn lực của bản thân. Lời giải thích: từ khóa là 'liên tục thay đổi' và 'được đánh giá': đối phó là một quá trình động, không phải một tính cách cố định, và nó bắt đầu từ cách ta đánh giá tình huống."
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: q2
  cau: "Câu hỏi 2: Đánh giá ban đầu: 'chuyện này có ảnh hưởng gì đến mình không?'; đánh giá thứ cấp: 'mình có thể làm được gì, việc này có thay đổi được không?'. Giải thích: hai bước đan xen; đánh giá xem tình huống có thay đổi được không là thông tin giả thuyết khớp nhau dùng để chọn chiến lược."
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: q3
  cau: "Câu hỏi 3: Giả thuyết khớp nhau nói rằng hiệu quả của chiến lược đối phó phụ thuộc vào sự khớp nhau với tình huống: đối phó vấn đề hợp với việc thay đổi được, đối phó cảm xúc hợp với việc không thay đổi được; lệch pha thì được dự đoán là triệu chứng nặng hơn. Giải thích: theo giả thuyết này Lan và Minh không sai ở cách mà ở lệch pha; đây là giả thuyết có bằng chứng lẫn lộn, không phải định luật."
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: q4
  cau: "Câu hỏi 4: Kendall và Terry (2008) trên người bị chấn thương sọ não không tìm thấy sự ủng hộ cho giả thuyết khớp nhau; việc kiên trì dùng đối phó tập trung vào vấn đề trước những khó khăn do chấn thương gây ra có thể đi cùng suy sụp cảm xúc về lâu dài. Giải thích: công thức 'đổi được → giải quyết' là một gợi ý, không phải định luật: kiểm chứng trực tiếp cho kết quả lẫn lộn, và mức kiểm soát cảm nhận thay đổi giữa các tình huống."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: q5
  cau: "Câu hỏi 5: Ngộ nhận hiệu quả đồng nhất là giả định rằng một chiến lược điều tiết lúc nào cũng có lợi (hoặc lúc nào cũng có hại); linh hoạt điều tiết gồm nhạy cảm với bối cảnh, vốn chiến lược đa dạng, và nhạy với phản hồi. Giải thích: thay vì chỉ hỏi chiến lược nào tốt nhất, Bonanno và Burton đề xuất nhìn vào khác biệt giữa người với người về tính linh hoạt."
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n2
  cau: "Giai đoạn REM: sóng não rất giống lúc thức, cơ bắp tạm thời bị khóa (liệt, trừ cơ hô hấp và tuần hoàn); đây là giai đoạn có giấc mơ sống động."
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n3
  cau: "Mơ cũng xảy ra ở các giai đoạn ngủ khác ngoài REM: người được đánh thức từ giấc ngủ không REM giai đoạn 2 vẫn nhớ được giấc mơ."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n4
  cau: 'Câu hỏi "giấc mơ có ý nghĩa gì" gồm hai câu nhỏ: nội dung giấc mơ đến từ đâu, và chức năng của việc mơ là gì (hay chỉ là tác dụng phụ).'
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n5
  cau: 'Theo Freud, giấc mơ nào cũng có nghĩa: nó là sự thỏa mãn ước muốn được ngụy trang; "trong hơn 120 năm" câu hỏi này chia giới khoa học thành nhiều phe.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n6
  cau: 'Hobson & McCarley (1977): giấc mơ do thân não kích hoạt (một phần ngẫu nhiên), vỏ não "tổng hợp" nội dung từ tín hiệu ấy và ký ức đã lưu.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n7
  cau: Revonsuo đề xuất giả thuyết rằng giấc mơ là buổi diễn tập sinh tồn, đặc biệt đối phó với nguy hiểm.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n9
  cau: Freud (1900), The Interpretation of Dreams (Giải mã giấc mơ), là công trình lý thuyết dựa trên việc Freud phân tích giấc mơ của chính mình và của bệnh nhân; giấc mơ là sự thỏa mãn ước muốn.
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n10
  cau: "Mỗi giấc mơ có hai lớp: manifest content (nội dung hiện) và latent content (nội dung ẩn: ước muốn hay xung đột bị kìm nén)."
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n11
  cau: "Dream-work biến lớp ẩn thành lớp hiện, gồm hai cơ chế chính: condensation (nhiều ý nghĩa dồn vào một hình ảnh) và displacement (trọng tâm cảm xúc bị dời sang chi tiết khác, nên giấc mơ hiện ra rất khác ý nghĩ ẩn)."
  loai: dinh-nghia
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n12
  cau: Freud viết rằng giải mơ là "via regia" (con đường hoàng gia) dẫn đến hiểu biết về vô thức.
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n13
  cau: Phương pháp giải mơ của Freud khó kiểm chứng và khó tái lập; cùng một giấc mơ, hai nhà phân tâm có thể giải ra hai nghĩa khác nhau mà không có cách phân xử độc lập; nhiều nhà tâm lý học thực nghiệm đặt lại vấn đề với lý thuyết của ông.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n14
  cau: Một số ý tưởng của Freud (nội dung giấc mơ liên quan đến cảm xúc và trải nghiệm lúc thức) vẫn được nghiên cứu lại bằng phương pháp mới (ví dụ Revonsuo, 2000).
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n15
  cau: Hobson & McCarley (1977) là một bài lý thuyết tổng hợp phát hiện sinh lý thần kinh đương thời, không có thí nghiệm với mẫu người.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n16
  cau: Cơ chế thần kinh ở thân não (đặc biệt là pons) kích hoạt não trước tự động và theo chu kỳ trong giấc ngủ có mơ, với đợt hoạt động mạnh, rời rạc ở các mạch cảm giác–vận động của thân não; tỉ lệ các chất dẫn truyền thay đổi, có thể liên quan đến việc quên giấc mơ.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n17
  cau: Theo cách đọc phổ biến, lý thuyết hàm ý giấc mơ không cần một ý nghĩa tâm lý sâu xa nào để tồn tại.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n18
  cau: Solms tổng hợp các ca bệnh nhân tổn thương não khu trú (sách 1997, tóm tắt trong bài tổng quan 2000), đối chiếu vị trí tổn thương với việc còn mơ hay không; chưa mở được toàn văn sách.
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n19
  cau: Tổn thương một số vùng não trước (chất trắng vùng trán trong, chỗ nối thái dương–đỉnh) có thể làm mất việc báo cáo giấc mơ; theo Solms (2000), tổn thương dọc một đường dẫn ở não trước làm mất giấc mơ mà không đổi đáng kể tần số, thời gian, mật độ REM.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n20
  cau: 'Ngược lại với "mơ = hoạt động thân não": giấc mơ cũng có thể xuất hiện trong giấc ngủ không REM, và theo Solms cơ chế của mơ nằm nhiều ở não trước; cách đọc này còn gây tranh luận (Hobson và cộng sự, 2000).'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n21
  cau: "Revonsuo (2000): lý thuyết mô phỏng đe dọa: giấc mơ mô phỏng các tình huống đe dọa để luyện nhận diện và tránh nguy hiểm."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n22
  cau: Valli, Revonsuo và cộng sự (2005) so nhật ký giấc mơ của trẻ em Kurd bị sang chấn (nặng và nhẹ) với trẻ em Phần Lan không sang chấn, dùng Dream Threat Scale chấm các sự kiện đe dọa.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n23
  cau: Trẻ em bị sang chấn nặng báo cáo nhiều giấc mơ hơn và giấc mơ có nhiều sự kiện đe dọa hơn, và các mối đe dọa nặng hơn; tác giả viết kết quả ủng hộ hầu hết các dự đoán.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n24
  cau: "Zadra và cộng sự (2006): 212 giấc mơ lặp đi lặp lại; 66% chứa ít nhất một mối đe dọa; 6 trong 8 giả thuyết có ủng hộ; kết luận bằng chứng hỗn hợp."
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n25
  cau: 'Điểm yếu: các nghiên cứu ở đây chủ yếu phân tích nội dung giấc mơ; chúng tôi chưa thấy thí nghiệm cho thấy "diễn tập" trong mơ giúp phản ứng tốt hơn ngoài đời thật; bài tổng quan của những người ủng hộ (Valli & Revonsuo, 2009) cho rằng điểm mạnh nhiều hơn điểm yếu.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n26
  cau: "Marzano và cộng sự (2011): 65 sinh viên đại học (35 nam, 30 nữ), điện não đồ trong phòng thí nghiệm, bị đánh thức buổi sáng từ REM hoặc giai đoạn 2."
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n27
  cau: Sau khi tỉnh khỏi REM, sóng theta (5–7 Hz) ở vùng trán cao hơn đi kèm việc nhớ được mơ; với giấc ngủ nông (giai đoạn 2), sóng alpha (8–12 Hz) ở vùng thái dương phải thấp hơn đi kèm việc nhớ được mơ.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n28
  cau: Các tác giả coi đây là bằng chứng đầu tiên về dấu hiệu điện não rõ ràng của việc nhớ mơ, gợi ý nhớ–quên giấc mơ dùng chung cơ chế với trí nhớ lúc thức.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n29
  cau: "Eichenlaub và cộng sự (2014): PET đo lưu lượng máu não của 41 tình nguyện viên nam khỏe mạnh lúc thức và lúc ngủ; 21 người nhớ mơ nhiều (khoảng 5,2 lần/tuần), 20 người nhớ mơ ít (khoảng 0,5 lần/tuần)."
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n30
  cau: Nhóm nhớ mơ nhiều có lưu lượng máu cao hơn ở chỗ nối thái dương–đỉnh trong REM, giấc ngủ sâu và lúc thức, và ở vỏ não trước trán giữa trong REM và lúc thức.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n31
  cau: Trang cũ dẫn Eichenlaub 2014 "Brain reactivity …" (Cerebral Cortex) cho nghiên cứu PET; bản đúng của nghiên cứu PET là Neuropsychopharmacology 39(7), 1594–1602.
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n32
  cau: Nghiên cứu khác của cùng nhóm (36 người, 18 nhớ mơ nhiều và 18 nhớ mơ ít) thấy phản ứng não với âm thanh (tên riêng) khác nhau giữa hai nhóm lúc thức và lúc ngủ (Cerebral Cortex 2014).
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n33
  cau: "Vallat và cộng sự (2017): người nhớ mơ nhiều có nhiều lần thức giấc dài hơn; đề xuất cần một lần thức tối thiểu khoảng 2 phút để mã hóa giấc mơ vào trí nhớ dài hạn."
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n34
  cau: "LaBerge và cộng sự (1981): 5 người có khả năng mơ tỉnh phát tín hiệu rằng họ biết đang mơ trong lúc điện não đồ xác nhận REM rõ ràng."
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n35
  cau: "Trong REM cơ bắp bị liệt nhưng cơ mắt thì không, nên tín hiệu bằng mắt được máy ghi lại; OpenStax: REM đi kèm liệt cơ trừ cơ hô hấp và tuần hoàn."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n36
  cau: "Voss và cộng sự (2014): 27 tình nguyện viên trẻ khỏe mạnh (18–26 tuổi), chưa có kinh nghiệm mơ tỉnh, ngủ nhiều đêm trong phòng thí nghiệm."
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n37
  cau: Sau khoảng 2 phút REM không bị gián đoạn, tACS ở vùng trán–thái dương trong 30 giây ở các tần số 2, 6, 12, 25, 40, 70, 100 Hz hoặc dòng giả; sau đó đánh thức và hỏi về giấc mơ.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n38
  cau: Theo thang tự đánh giá, mơ tỉnh nổi bật nhất ở 25 Hz (58%) và 40 Hz (77%) (gamma thấp); các tần số khác không hiệu quả; các tác giả đề xuất sóng gamma ở vùng trán có thể có vai trò gây ra sự tự nhận thức trong mơ; nghiên cứu nhỏ (27 người).
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n39
  cau: Tình trạng mơ tỉnh trong nghiên cứu được xác định qua thang tự báo cáo LuCiD của người tham gia; đây là một nghiên cứu nhỏ trong phòng thí nghiệm, không nên tự dùng thiết bị kích thích điện tại nhà.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n40
  cau: "Saunders và cộng sự (2016): phân tích tổng hợp 50 năm nghiên cứu về mơ tỉnh: khoảng 55% (KTC 95% 49–62%, 34 nghiên cứu) từng mơ tỉnh ít nhất một lần; khoảng 23% (20–25%, 25 nghiên cứu) mơ tỉnh thường xuyên (ít nhất một lần mỗi tháng)."
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n41
  cau: 'Khung "Khá vững: giấc mơ không đồng nhất với giấc ngủ REM".'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n42
  cau: 'Khung "Khá vững: mơ tỉnh là hiện tượng có thật, đã được ghi nhận khách quan".'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n43
  cau: 'Khung "Khá vững: mối đe dọa xuất hiện thường xuyên trong một số loại giấc mơ".'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n44
  cau: 'Khung "Khá vững: nhớ được giấc mơ liên quan đến việc tỉnh giấc đủ lâu".'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n45
  cau: 'Khung "Đang tranh cãi: giấc mơ có chức năng tiến hóa hay chỉ là tác dụng phụ?".'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n46
  cau: 'Khung "Bác bỏ: mỗi biểu tượng trong mơ có một nghĩa cố định, tra sách là ra".'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n47
  cau: Tính đến 11/2026, không tìm thấy nghiên cứu bình duyệt nào kiểm chứng kiểu giải mộng "mơ thấy X thì chắc chắn là điềm Y" (chưa tìm hệ thống trong tạp chí chuyên ngành).
  loai: thoi-su
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n48
  cau: Freud có điểm mạnh là xem giấc mơ nghiêm túc như sản phẩm có ý nghĩa của tâm trí; điểm yếu lớn là phương pháp khó kiểm chứng, khó tái lập.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n49
  cau: "Activation-synthesis gặp hai thách thức: Solms (2000) cho rằng mơ phụ thuộc cơ chế ở não trước (Hobson và cộng sự 2000 phản biện), và Revonsuo (2000) cho rằng nội dung mơ có tổ chức, chọn lọc."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n50
  cau: Lý thuyết mô phỏng đe dọa được một số bằng chứng nội dung mơ ủng hộ nhưng Zadra thấy bằng chứng hỗn hợp; chưa thấy thí nghiệm chức năng; đây vẫn là giả thuyết đang được kiểm tra.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n51
  cau: "Vì sao ta quên giấc mơ: Hobson & McCarley cho rằng thay đổi tỉ lệ chất dẫn truyền có thể góp phần; Marzano thấy sóng theta vùng trán khi tỉnh từ REM đi kèm nhớ mơ; Vallat đề xuất cần thức tối thiểu khoảng 2 phút để mã hóa."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n52
  cau: "Mơ tỉnh: theo Voss, ý thức bậc cao cùng tồn tại với ý thức giấc mơ REM thông thường, hoạt động gamma ở vùng trán–thái dương liên quan đến tự nhận thức trong mơ; kích thích 25 và 40 Hz tăng mơ tỉnh theo thang tự đánh giá; nghiên cứu nhỏ (27 người)."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n53
  cau: 'Mục Áp dụng 1: "Muốn nhớ mơ, hãy ghi lại trong vòng vài phút sau khi tỉnh" :nhan[kha-vung].'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n54
  cau: Ngay khi tỉnh, có thể thử nằm yên một lúc, nhớ lại giấc mơ và ghi vài từ khóa.
  loai: loi-khuyen
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n55
  cau: 'Mục Áp dụng 2: "Đừng tra sách giải mộng để đoán điềm" :nhan[bac-bo].'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n56
  cau: Nội dung giấc mơ chịu tác động mạnh và nhất quán của một số loại trải nghiệm lúc thức (Revonsuo, 2000).
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n57
  cau: 'Mục Áp dụng 3: "Ác mộng lặp đi lặp lại: mơ tỉnh là hướng đang được nghiên cứu, chưa phải cách điều trị" :nhan[tranh-cai].'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n59
  cau: 'Mục Áp dụng 4: "Một giấc mơ đáng sợ không phải là điềm báo" :nhan[tranh-cai].'
  loai: nhan
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n60
  cau: Giấc mơ có mối đe dọa khá thường gặp (66% trong 212 giấc mơ lặp lại ở nghiên cứu của Zadra và cộng sự).
  loai: so-lieu
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n61
  cau: Nếu ác mộng làm bạn lo lắng kéo dài, hãy trao đổi với người có chuyên môn.
  loai: loi-khuyen
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n62
  cau: Trong văn hóa dân gian Việt Nam có truyền thống giải mộng; những câu như "mơ thấy rắn là có lộc", "mơ rụng răng là nhà có tang" được nhiều người kể lại (ví dụ minh họa).
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n63
  cau: Chúng tôi không tìm thấy nghiên cứu bình duyệt nào cho thấy mơ thấy một con vật cụ thể thì dự báo được sự kiện cụ thể ngoài đời.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n64
  cau: Tính đến 11/2026, chưa tìm thấy nghiên cứu công bố nào về nội dung giấc mơ, tần suất nhớ mơ, hay mơ tỉnh trên người Việt.
  loai: thoi-su
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n65
  cau: Các thí nghiệm trong bài thực hiện ở Mỹ, Đức, Ý, Pháp, Phần Lan và các mẫu khác; chúng tôi không dẫn được nghiên cứu nào trên người Việt cho các con số trong bài; 55% từng mơ tỉnh là ước lượng tổng hợp nhiều nước.
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n66
  cau: "Suy luận (đã ghi rõ chưa kiểm tra): nội dung mơ có thể chịu ảnh hưởng văn hóa, nên có thể có chủ đề đặc thù chưa được đo."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n67
  cau: 'Ngộ nhận "giấc mơ chỉ xảy ra trong REM": người được đánh thức từ giấc ngủ nông (giai đoạn 2) cũng có thể nhớ được giấc mơ.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n68
  cau: 'Ngộ nhận "mơ thấy X là điềm Y": chúng tôi không tìm thấy nghiên cứu bình duyệt nào chứng minh một "từ điển" chung cho tất cả mọi người.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n69
  cau: 'Ngộ nhận "mơ tỉnh là muốn làm gì trong mơ cũng được": mơ tỉnh là biết mình đang mơ trong lúc mơ (LaBerge 1981); chúng tôi chưa dẫn được nghiên cứu nào về mức kiểm soát nội dung mơ.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n70
  cau: 'Ngộ nhận "quên giấc mơ là do trí nhớ kém": người nhớ mơ nhiều và ít khác nhau ở hoạt động não và số lần thức giấc dài (Eichenlaub 2014; Vallat 2017); các nghiên cứu này không so sánh trí nhớ nói chung hay trí thông minh.'
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n71
  cau: 'Ngộ nhận "tự kích thích điện não tại nhà để mơ tỉnh": không nên làm; thí nghiệm của Voss thực hiện trong phòng thí nghiệm, theo dõi điện não liên tục; chúng tôi không thấy bằng chứng việc tự dùng thiết bị ở nhà là an toàn và hiệu quả.'
  loai: loi-khuyen
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: q1
  cau: "Câu hỏi 1: giả thuyết kích hoạt–tổng hợp: thân não (đặc biệt là pons) tạo ra tín hiệu kích hoạt não trước; vỏ não tổng hợp thành giấc mơ."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: q2
  cau: "Câu hỏi 2: Solms (1997, 2000): tổn thương một số vùng não trước có thể làm mất việc báo cáo giấc mơ mà không đổi đáng kể REM; quan điểm còn tranh luận."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: q3
  cau: "Câu hỏi 3: vì sao quên giấc mơ: nhớ liên quan đến lần thức giấc đủ dài (Vallat đề xuất tối thiểu khoảng 2 phút) và hoạt động điện não khi tỉnh; cơ chế chi tiết là giả thuyết."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: q4
  cau: "Câu hỏi 4: LaBerge và cộng sự (1981) ghi nhận khách quan mơ tỉnh: dặn trước 5 người có khả năng mơ tỉnh thực hiện một tín hiệu đã hẹn khi nhận ra mình đang mơ; tín hiệu được ghi lại trong lúc điện não đồ xác nhận REM rõ ràng."
  loai: phat-hien
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n73
  cau: "Mục Nguồn: Eichenlaub 2014 (hai bài), Freud 1900, Hobson & McCarley 1977, LaBerge 1981, Marzano 2011, Revonsuo 2000, Saunders 2016, Solms 1997 và 2000, Hobson 2000, Valli 2005 và 2009, Vallat 2017, Voss 2014, Zadra 2006 có tên, tạp chí, tập, trang, DOI đúng."
  loai: lich-su
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n41
  cau: Đây là bằng chứng củng cố hơn, nhưng cùng nhóm nghiên cứu thực hiện, và là phiên bản can thiệp đã được cải tiến, không phải bản sao y hệt giao thức 2013.
  loai: phat-hien
  nguon:
    - ten: "Crum và cộng sự (2023), JEP: General 152(9), 2603–2622: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1037/xge0001396
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "Đây là bằng chứng củng cố, nhưng …". Chữ mới: "bằng chứng củng cố hơn … cùng nhóm nghiên cứu thực hiện". Lý do: nêu thêm giới hạn độc lập (tác giả Crum, Salovey, Achor… đều thuộc nhóm).'
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n63
  cau: 'Mục Áp dụng 2: "Cho cơ thể những lúc phục hồi sau giai đoạn căng thẳng" :nhan[kha-vung].'
  loai: nhan
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: Nhãn giữ nguyên. Nội dung sửa ở n64.
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n15
  cau: Mô hình gợi ý rằng điều đáng lo là stress kéo dài không lối thoát, chứ không phải một đợt căng thẳng ngắn (như trước giờ thi).
  loai: phat-hien
  nguon:
    - ten: OpenStax Psychology 2e, 14.1 (đọc 10/11/2026)
      link: https://openstax.org/books/psychology-2e/pages/14-1-what-is-stress
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "giải thích vì sao stress ngắn hạn … thường vô hại, thậm chí hữu ích, còn stress kéo dài không lối thoát mới là vấn đề". Chữ mới: "gợi ý …". Lý do: mô hình GAS dựa trên chuột và tác nhân nặng; không "giải thích" cho người.'
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n19
  cau: "Nghiên cứu 1: thang đo 8 câu Stress Mindset Measure đo niềm tin stress có lợi hay có hại, ở ba khía cạnh: sức khỏe, hiệu suất, học hỏi–phát triển; kiểm tra trên nhân viên một tổ chức tài chính quốc tế lớn."
  loai: cong-cu
  nguon:
    - ten: "Crum, Salovey & Achor (2013), JPSP 104(4), 716–733: toàn văn (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus)"
      link: https://doi.org/10.1037/a0031201
  ket_qua_luot_1: dung
  ghi_chu: Ba khía cạnh của câu hỏi (sức khỏe, hiệu suất, học hỏi) theo mô tả video ở Study 2; không kiểm riêng từng câu của thang.
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n30
  cau: Ngay trong nghiên cứu 1, khi kiểm soát các biến khác, niềm tin về stress không giải thích thêm được sự khác biệt về hiệu suất làm việc.
  loai: phat-hien
  nguon:
    - ten: "Crum, Salovey & Achor (2013), JPSP 104(4), 716–733: toàn văn (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus)"
      link: https://doi.org/10.1037/a0031201
  ket_qua_luot_1: dung
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n73
  cau: Chưa tìm thấy nghiên cứu nào ở Việt Nam thử lại can thiệp video của Crum và cộng sự.
  loai: thoi-su
  nguon:
    - ten: 'Tìm trên Europe PMC (10/11/2026): "stress mindset" AND (Vietnam OR Vietnamese): 6 kết quả; một nghiên cứu về niềm tin stress ở người Việt (Nguyen 2023)'
      link: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=%22stress%20mindset%22%20AND%20(Vietnam%20OR%20Vietnamese)
  ket_qua_luot_1: dung
  ghi_chu: "Cùng lần tìm ở n71: kết quả liên quan Việt Nam gồm Nguyen 2023 (không phải video) và Wu 2026 (Trung Quốc, không phải Việt Nam). Không tìm tạp chí trong nước."
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n53
  cau: Căng thẳng nghề nghiệp kéo dài đi kèm nguy cơ bệnh tim mạch vành cao hơn (HR 1,23; Kivimäki và cộng sự, 2012).
  loai: so-lieu
  nguon:
    - ten: "Kivimäki và cộng sự (2012), Lancet 380, 1491–1497: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/S0140-6736(12)60994-5
  ket_qua_luot_1: dung
  ghi_chu: Tóm tắt (Europe PMC); là dữ liệu cá nhân 13 nhóm theo dõi châu Âu, 197.473 người.
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n20
  cau: 'Nghiên cứu 2: nhân viên được chia ngẫu nhiên thành ba nhóm: video "có lợi" (N = 163), "có hại" (N = 164), đối chứng không xem gì (N = 61).'
  loai: so-lieu
  nguon:
    - ten: "Crum, Salovey & Achor (2013), JPSP 104(4), 716–733: toàn văn (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus)"
      link: https://doi.org/10.1037/a0031201
  ket_qua_luot_1: dung
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n64
  cau: "Phân tích tổng hợp (Wendsche & Lohmann-Haislah, 2016): tách khỏi công việc ngoài giờ đi kèm ít kiệt sức hơn và ngủ tốt hơn (tương quan, tự báo cáo)."
  loai: so-lieu
  nguon:
    - ten: "Wendsche & Lohmann-Haislah (2016), Front Psychol 7, 2072: tóm tắt (Europe PMC)"
      link: https://doi.org/10.3389/fpsyg.2016.02072
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "Bài học chắc chắn nhất từ mô hình của Selye … Giấc ngủ đầy đủ, vận động đều đặn và duy trì kết nối xã hội là những cách phục hồi được nhiều nghiên cứu ủng hộ." Chữ mới: dẫn Wendsche 2016 (tương quan) và OpenStax. Lý do: câu cũ không có nguồn trực tiếp. Năm: Crossref ghi bài đăng 1/2017, tập 7 (2016).'
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n60
  cau: Theo giả thuyết của Crum và cộng sự (2013), niềm tin stress có lợi hay có hại định hướng ta tiếp cận hay né tránh tình huống căng thẳng, từ đó có thể thay đổi hành vi lẫn phản ứng sinh lý; bằng chứng cho vế sinh lý còn chưa nhất quán.
  loai: phat-hien
  nguon:
    - ten: "Crum, Salovey & Achor (2013), JPSP 104(4), 716–733: toàn văn (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus)"
      link: https://doi.org/10.1037/a0031201
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "định hướng ta tiếp cận hay né tránh …, từ đó thay đổi cả hành vi lẫn phản ứng sinh lý." Chữ mới: "theo giả thuyết …, có thể thay đổi … (bằng chứng cho vế sinh lý còn chưa nhất quán)". Lý do: n34, n44.'
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n44
  cau: 'Liu và cộng sự (2019): phân tích tổng hợp 14 bài, 36 mẫu độc lập: can thiệp "đánh giá lại" stress làm giảm phản ứng stress chủ quan (độ chênh chuẩn hóa 0,43; KTC 95% 0,07–0,79) nhưng không khác biệt ở chỉ số sinh lý (−0,08; −0,35 đến 0,18), kết quả khác nhau nhiều giữa các nghiên cứu.'
  loai: so-lieu
  nguon:
    - ten: "Liu và cộng sự (2019), PLoS ONE 14(2), e0212854: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1371/journal.pone.0212854
  ket_qua_luot_1: dung
  ghi_chu: '"Khác nhau nhiều" theo "heterogeneous effects suggesting large variability in findings".'
- trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
  id: n57
  cau: Các nghiên cứu về căng thẳng nghề nghiệp và stress tự cảm nhận chỉ nói về bệnh tim mạch vành; chúng đo mức căng thẳng, không đo riêng việc có được phục hồi hay không.
  loai: phat-hien
  nguon:
    - ten: "Richardson và cộng sự (2012), Am J Cardiol 110(12), 1711–1716: tóm tắt (Europe PMC)"
      link: https://doi.org/10.1016/j.amjcard.2012.08.004
  ket_qua_luot_1: dung
  ghi_chu: Khẳng định giới hạn của hai nguồn dẫn; không khẳng định gì về toàn bộ văn liệu.
