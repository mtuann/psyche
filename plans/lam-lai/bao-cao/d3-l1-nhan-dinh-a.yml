- trang: thi-nghiem/index
  id: p1
  cau: Mười lăm thí nghiệm này nổi tiếng trong tâm lý học.
  loai: lich-su
- trang: thi-nghiem/index
  id: p2
  cau: "Các thí nghiệm kinh điển sống hai cuộc đời: một trong sách giáo khoa và một trong phòng thí nghiệm, nơi các nhà nghiên cứu làm lại, soi xét và đôi khi lật ngược cách hiểu ban đầu."
  loai: lich-su
- trang: thi-nghiem/index
  id: p3
  cau: Một kết quả chưa từng được làm lại thì chưa thể coi là chắc; khi làm lại, nhiều kết quả yếu đi hoặc không còn, nên kết quả sống sót qua nhiều lần làm lại đáng tin hơn.
  loai: tai-lap
- trang: thi-nghiem/index
  id: p4
  cau: "Mẫu của các thí nghiệm kinh điển đều đặc thù: ví dụ 40 người đàn ông ở Yale (Milgram), trẻ ở một nhà trẻ của Stanford (Bandura), sinh viên Mỹ (Zimbardo)."
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n1
  cau: Asch (1951, 1956) cho người tham gia so sánh độ dài đường thẳng trước một nhóm "chim mồi" nói sai có chủ đích đồng loạt.
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n2
  cau: Trong các lượt gài bẫy, khoảng 37% (36,8%) câu trả lời hùa theo nhóm.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n3
  cau: Ba phần tư số người tham gia hùa theo ít nhất một lần.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n4
  cau: "Hãy tưởng tượng: nhóm 7 người, hai tấm bìa (một đường mẫu, ba đường so sánh đánh số 1, 2, 3), người tham gia thật trả lời gần cuối, hai lượt đầu ai cũng đúng, đến lượt thứ ba nhóm đồng loạt nói sai."
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n5
  cau: Ở Asch, nhóm có 7–9 người, trong đó chỉ một người là người tham gia thật.
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n6
  cau: Người tham gia thật là người trả lời gần cuối (ghế kế cuối).
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n7
  cau: "Cái giá của việc nói khác đi trở nên đắt đỏ: sợ bị chê cười, sợ mình nhìn nhầm, sợ trở thành kẻ lập dị."
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n8
  cau: Asch làm thí nghiệm vào đầu thập niên 1950, khi các nghiên cứu trước đó cho thấy ý kiến đổi rất dễ chỉ vì sức nặng của số đông hay uy tín; ông nghi ngờ rằng ý kiến "nhạt như nước" đến thế.
  loai: lich-su
- trang: thi-nghiem/asch
  id: n9
  cau: Đa số câu trả lời (63%) không hùa theo.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n10
  cau: "Khi làm một mình (nhóm đối chứng), người ta gần như không sai: 0,7% câu trả lời sai."
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n11
  cau: Thí nghiệm có tổng cộng 123 người tham gia thật, đều là nam sinh viên đại học, ở ba trường.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n12
  cau: Mỗi người làm 18 lượt so sánh độ dài đường thẳng; 12 lượt là "gài bẫy" (nhóm đồng loạt nói sai), 6 lượt trung tính.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n13
  cau: Ở các lượt gài bẫy, các chim mồi đồng loạt đưa ra cùng một đáp án sai rõ ràng (chênh từ 3/4 đến 1 3/4 inch).
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n14
  cau: "Bài toán dễ: người so sánh đường thẳng một mình gần như không sai (đối chứng 95% người không sai lần nào)."
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n15
  cau: "Hộp hồ sơ, dòng Kết quả chính: 36,8% câu trả lời hùa theo nhóm sai (đối chứng 0,7%), khoảng ba phần tư số người hùa theo ít nhất một lần."
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n16
  cau: Khoảng 25% số người không bao giờ hùa theo.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n17
  cau: Nhóm 3 người đã tạo ra gần như toàn bộ áp lực; thêm người nữa không tăng đáng kể (Asch, 1955).
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n18
  cau: Chỉ cần một người cùng phòng nói đúng, tỉ lệ sai còn khoảng một phần tư so với khi cả nhóm nhất trí.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n19
  cau: 'Bond và Smith (1996) lưu ý kết luận "3 người là đủ" của Asch về sau bị thách thức: quy mô nhóm vẫn có liên hệ với mức hùa theo.'
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n20
  cau: Bond và Smith (1996) gộp 133 nghiên cứu dùng bài toán so sánh đường thẳng kiểu Asch, thực hiện ở 17 quốc gia.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n21
  cau: Ở Mỹ, mức hùa theo giảm dần kể từ những nghiên cứu của Asch ở thập niên 1950.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n22
  cau: Một số tác giả gắn mức hùa theo cao ở thập niên 1950 và xu hướng giảm sau đó với bối cảnh chính trị – xã hội từng thời kỳ.
  loai: lich-su
- trang: thi-nghiem/asch
  id: n23
  cau: Các nước văn hóa tập thể hùa theo nhiều hơn các nước văn hóa cá nhân; mối liên hệ có ý nghĩa ở cả ba cách đo văn hóa (Hofstede, Schwartz, Trompenaars).
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n24
  cau: Franzen và Mader (2023) làm lại thí nghiệm Asch với 210 người, mỗi nhóm có 5 chim mồi, thấy tỉ lệ sai 33%, khớp với kết quả gốc.
  loai: tai-lap
- trang: thi-nghiem/asch
  id: n25
  cau: Khi người tham gia được thưởng tiền cho câu trả lời đúng, tỉ lệ sai giảm còn 25%, nhưng ảnh hưởng của nhóm vẫn còn.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n26
  cau: "Vững chắc: một nhóm nhất trí làm lệch phán đoán công khai, kể cả với bài toán rõ ràng."
  loai: nhan
- trang: thi-nghiem/asch
  id: n27
  cau: "Khá vững: văn hóa tập thể hùa theo nhiều hơn văn hóa cá nhân."
  loai: nhan
- trang: thi-nghiem/asch
  id: n28
  cau: Phân tích của Bond và Smith dựa trên so sánh giữa các quốc gia, tức dữ liệu tương quan cấp quốc gia, không phải thí nghiệm ngẫu nhiên; không cho phép kết luận "văn hóa gây ra" sự khác biệt.
  loai: nhan
- trang: thi-nghiem/asch
  id: n29
  cau: 'Đang tranh cãi: người hùa theo có thật sự "nhìn" khác đi không.'
  loai: nhan
- trang: thi-nghiem/asch
  id: n30
  cau: "Asch (1956) thấy người hùa theo có những phản ứng rất khác nhau: số rất ít không nhận ra mình bị nhóm ảnh hưởng; một tỉ lệ đáng kể hùa theo khi lòng tin vào mắt mình bị lung lay; số khác không còn quan tâm đúng sai, chỉ muốn khỏi tỏ ra khác biệt."
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n31
  cau: Asch thừa nhận không thể xác lập mức độ méo mó tri giác thật sự; ông cho rằng méo mó nhiều khả năng xảy ra ở khâu phán đoán.
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n32
  cau: "Ảnh hưởng chuẩn mực: hùa theo để được chấp nhận, tránh bị chê cười hay tẩy chay."
  loai: dinh-nghia
- trang: thi-nghiem/asch
  id: n33
  cau: Trong thí nghiệm Asch, kiểu "chỉ muốn khỏi tỏ ra khác biệt" có thật, nhưng nhiều người làm theo lại tự kết luận mắt mình sai.
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n34
  cau: "Ảnh hưởng thông tin: khi bài toán khó hoặc mơ hồ, ta coi phản ứng của người khác là manh mối về đáp án đúng."
  loai: dinh-nghia
- trang: thi-nghiem/asch
  id: n35
  cau: Bài toán của Asch rất dễ, vậy mà nhiều người làm theo vẫn tự kết luận mắt mình sai.
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n36
  cau: Khi vấn đề mơ hồ hơn, ta càng có lý do dựa vào người khác — ví dụ xem đánh giá nhà hàng trước khi chọn quán.
  loai: dinh-nghia
- trang: thi-nghiem/asch
  id: n37
  cau: Nhiều người được phỏng vấn sau thí nghiệm kể rằng họ sợ nhóm không tán thành hay cho mình là lập dị.
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n38
  cau: Nếu sếp nêu ý kiến trước rồi hỏi "mọi người thấy sao?", tình huống ấy gợi lại thí nghiệm Asch (phép loại suy, chưa kiểm trực tiếp).
  loai: loi-khuyen
- trang: thi-nghiem/asch
  id: n39
  cau: Trong một biến thể của Asch, khi người tham gia trả lời bằng văn bản thay vì nói công khai, số lỗi giảm còn khoảng một phần ba (14 người).
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n40
  cau: Thí nghiệm 4 của Asch không thử tính ẩn danh hay thứ tự phát biểu; mẫu chỉ 14 người.
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n41
  cau: Lượt thích và bình luận có sẵn trên mạng xã hội là một dạng "ý kiến của số đông" nhìn thấy trước khi tự đánh giá; đây là phép loại suy, không phải kết quả của thí nghiệm Asch.
  loai: loi-khuyen
- trang: thi-nghiem/asch
  id: n42
  cau: Theo Asch (1955), khi có một người cùng phòng nói đúng, người tham gia sai chỉ khoảng một phần tư so với khi cả nhóm nhất trí.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n43
  cau: Theo Bond và Smith, các nước văn hóa tập thể hùa theo cao hơn.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n44
  cau: Nếu người Việt coi trọng hòa hợp nhóm, ta có thể dự đoán mức hùa theo cao hơn mặt bằng phương Tây; đó chỉ là dự đoán từ mô hình.
  loai: loi-khuyen
- trang: thi-nghiem/asch
  id: n45
  cau: Việt Nam không nằm trong số các nước của phân tích Bond và Smith.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n46
  cau: Tính đến 10/2026, chúng tôi chưa tìm thấy nghiên cứu dùng bài toán Asch trên người Việt.
  loai: thoi-su
- trang: thi-nghiem/asch
  id: n47
  cau: Văn hóa của một nước không đồng nhất, nên con số thật cho người Việt vẫn là một dấu hỏi.
  loai: loi-khuyen
- trang: thi-nghiem/asch
  id: n48
  cau: '"37% nghĩa là 37% số người luôn hùa theo": sai; 37% là tỉ lệ câu trả lời hùa theo trong các lượt gài bẫy.'
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n49
  cau: Trong 123 người, 29 người (khoảng một phần tư) không sai lần nào; số lỗi trung bình là 4,4 trên 12 lượt gài bẫy.
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n50
  cau: Asch nhận xét rằng phần lớn các phán đoán là độc lập, bằng chứng là sức nặng của điều mắt thấy lớn hơn sức ép của đa số.
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n51
  cau: "Lần làm lại 2023 (210 người) đo trí thông minh, lòng tự trọng, nhu cầu được tán thành và năm đặc điểm tính cách lớn: ngoài tính cởi mở, không đặc điểm nào liên hệ thuyết phục với việc hùa theo."
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n52
  cau: "Câu hỏi 1: 37% là tỉ lệ câu trả lời trong các lượt gài bẫy, không phải tỉ lệ người; khoảng một phần tư số người không hùa theo lần nào và số lỗi trung bình là 4,4 trên 12 lượt."
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n53
  cau: "Câu hỏi 2: yếu tố làm giảm mạnh nhất áp lực hùa theo là có một người trong nhóm phá vỡ sự nhất trí bằng cách trả lời đúng; nhóm 3 người nhất trí đã tạo gần hết áp lực."
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n54
  cau: "Câu hỏi 3: Bond và Smith (1996) thấy mức hùa theo ở Mỹ giảm dần theo thời gian và các nước văn hóa tập thể hùa theo nhiều hơn các nước văn hóa cá nhân; 133 nghiên cứu ở 17 quốc gia."
  loai: so-lieu
- trang: thi-nghiem/asch
  id: n55
  cau: "Câu hỏi 4: người hùa theo có thể xuất phát từ những cơ chế khác nhau (tin nhóm đúng và mình sai, hay chỉ muốn khỏi tỏ ra khác biệt); thí nghiệm gốc không tách bạch được."
  loai: phat-hien
- trang: thi-nghiem/asch
  id: n56
  cau: "Câu hỏi 5: trong một biến thể của Asch, trả lời bằng văn bản làm số lỗi giảm còn khoảng một phần ba (mẫu nhỏ); ghi ý kiến trước khi nghe nhau là một cách hợp lý."
  loai: loi-khuyen
- trang: thi-nghiem/asch
  id: n60
  cau: "Một số nghiên cứu sau này lại nghiêng về phía tri giác: khi người tham gia hùa theo nhóm trong một bài xoay hình trong đầu, hoạt động của một mạng vùng não ở thùy chẩm và thùy đỉnh thay đổi (Berns và cộng sự, 2005); hai thí nghiệm dùng mô hình tách các bước của quyết định thấy ý kiến của nhóm làm đổi cách tiếp nhận thông tin từ mắt, chứ không chỉ đổi ngưỡng trả lời (Germar và cộng sự, 2014); đó là nghiên cứu riêng lẻ, với bài toán khác bài của Asch, nên câu hỏi còn mở."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n1
  cau: "Darley và Latané (1968): càng đông người chứng kiến, mỗi cá nhân càng ít khả năng giúp đỡ (mô tả của trang)."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n2
  cau: "Hiệu ứng người ngoài cuộc (bystander effect): càng đông người chứng kiến một tình huống khẩn cấp, mỗi cá nhân càng ít khả năng can thiệp."
  loai: dinh-nghia
- trang: thi-nghiem/darley-latane
  id: n3
  cau: "Phân tán trách nhiệm: trách nhiệm được chia cho những người có mặt; ở một mình, trách nhiệm hoàn toàn thuộc về bạn."
  loai: dinh-nghia
- trang: thi-nghiem/darley-latane
  id: n4
  cau: 'Vô tri tập thể (pluralistic ignorance): ai cũng nhìn người khác để đoán tình hình; thấy mọi người ngồi yên, mỗi người kết luận "chắc không nghiêm trọng".'
  loai: dinh-nghia
- trang: thi-nghiem/darley-latane
  id: n5
  cau: "Sợ bị đánh giá: người ta lo đứng dậy báo động rồi hóa ra chuyện nhỏ, làm mình thành trò cười; trong thí nghiệm co giật, người tham gia lo phản ứng quá mức."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n6
  cau: "Người không can thiệp thường không vô cảm: họ run tay, đổ mồ hôi, và còn đang phân vân giữa hai cái giá phải trả."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n7
  cau: Mỗi người ngồi một phòng riêng, thảo luận nhóm qua loa (hệ thống nội bộ) về các vấn đề của sinh viên.
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n8
  cau: Giữa buổi, một "người tham gia" (thật ra là băng ghi âm) lên cơn co giật kiểu động kinh, van xin giúp đỡ.
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n9
  cau: "Biến số chính là số người mà người tham gia thật tin là có trong nhóm: chỉ họ và nạn nhân, thêm 1 người khác, hay thêm 4 người khác."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n10
  cau: 85% người tưởng mình ở một mình biết hoàn cảnh nạn nhân đã báo cho người thí nghiệm trước khi nạn nhân bị ngắt tiếng; chỉ 31% khi tưởng có 4 người khác.
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n11
  cau: "Nhóm đông can thiệp chậm hơn hẳn: thời gian trung bình 52 giây (2 người), 93 giây (3 người), 166 giây (6 người)."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n12
  cau: Sau cùng 6 phút, mọi người trong nhóm 2 người đều báo, nhưng chỉ 62% trong nhóm 6 người từng báo.
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n13
  cau: Cùng một tiếng kêu cứu, cùng một con người, chỉ khác niềm tin về số người xung quanh.
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n14
  cau: "Hộp hồ sơ, dòng Thiết kế và Người tham gia: sinh viên đại học; người tham gia thật tin rằng chỉ mình mình nghe thấy, hay còn 1 hoặc 4 người khác cùng nghe."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n15
  cau: "Thí nghiệm khói (Latané và Darley, 1968): người tham gia (nam sinh viên Đại học Columbia) ngồi điền phiếu trong một phòng chờ; khói phụt vào phòng qua một lỗ thông gió trên tường."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n16
  cau: "Ở một mình: 75% (18 trong 24 người) đi báo khói trong vòng 6 phút kể từ lúc nhận ra khói."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n17
  cau: "Ngồi cùng hai người lạ thật (cũng là người tham gia): chỉ 3 trong 8 nhóm (38%) có người báo khói."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n18
  cau: "Ngồi cùng hai diễn viên được dặn nhìn khói rồi nhún vai, tiếp tục điền phiếu: 10% (1 trong 10 người)."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n19
  cau: 9 người còn lại ngồi trong căn phòng đầy dần khói, ho, dụi mắt, mở cửa sổ, nhưng không đi báo.
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n20
  cau: "Theo tính toán của hai tác giả, nếu ba người không ảnh hưởng gì đến nhau thì hơn 98% số nhóm phải có ít nhất một người báo. Tính theo từng người: 3 trong 24 người báo khói."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n21
  cau: 'Ô thu gọn: khi ngồi cùng hai người lạ cũng "không biết gì" như mình (không phải diễn viên), chỉ 3 trong 8 nhóm (38%) có người báo khói.'
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n22
  cau: "Câu hỏi đoán ở phần Tự trải nghiệm: khi ở một mình, 75% số người đứng dậy đi báo khói trong vòng 6 phút kể từ lúc nhận ra khói."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n23
  cau: "Để giải thích hiệu ứng, Latané và Darley (1970) đề xuất mô hình 5 bước (theo Fischer và cộng sự, 2011, kể lại): nhận thấy sự việc, hiểu đó là khẩn cấp, nhận trách nhiệm, tin mình biết cách giúp, quyết định giúp."
  loai: lich-su
- trang: thi-nghiem/darley-latane
  id: n24
  cau: "Ở mỗi bước đầu, người chứng kiến có thể rời khỏi quá trình và không giúp. Sự có mặt của người khác cản được ở nhiều bước: trong thí nghiệm khói, người ngồi cùng người khác nhận ra khói chậm hơn (trong 5 giây đầu: 63% người ngồi một mình, 26% người ngồi cùng người khác) và dễ hiểu khói là vô hại; trong thí nghiệm co giật, trách nhiệm bị chia."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n25
  cau: "Trong khung Vững chắc: còn những quá trình tâm lý nào đứng sau hiệu ứng thì, theo Fischer và cộng sự, các nghiên cứu vẫn chưa rõ ràng."
  loai: nhan
- trang: thi-nghiem/darley-latane
  id: n26
  cau: "Fischer và cộng sự (2011): phân tích tổng hợp gộp 105 hiệu ứng từ hơn 7.700 người tham gia, từ thập niên 1960 đến 2010; độ lớn tổng thể g = −0,35."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n27
  cau: Hiệu ứng yếu đi khi tình huống được nhận là nguy hiểm, có kẻ gây hại có mặt, hoặc cái giá của việc can thiệp là rủi ro thể chất.
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n28
  cau: "Mô hình kích thích–chi phí–phần thưởng: tình huống nguy hiểm được nhận ra nhanh và rõ hơn là khẩn cấp thật, nên kích thích sinh lý cao hơn và người ta giúp nhiều hơn; khớp với phát hiện của Fischer."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n29
  cau: "Vững chắc: sự hiện diện của người khác làm giảm khả năng và tốc độ giúp đỡ trong tình huống khẩn cấp mập mờ."
  loai: nhan
- trang: thi-nghiem/darley-latane
  id: n30
  cau: "Philpot và cộng sự (2020): trong 219 xung đột công cộng quay bằng camera ở Anh, Hà Lan và Nam Phi, 9 trên 10 vụ có ít nhất một người ra tay giúp; càng đông người chứng kiến thì càng dễ có ai đó giúp."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n31
  cau: "Khá vững: khi nguy hiểm rõ ràng, hiệu ứng yếu đi."
  loai: nhan
- trang: thi-nghiem/darley-latane
  id: n32
  cau: Phân tích tổng hợp của Fischer và cộng sự dựa trên mã hóa lại các nghiên cứu cũ, không phải thí nghiệm mới có đối chứng ngẫu nhiên cho từng yếu tố điều chỉnh.
  loai: nhan
- trang: thi-nghiem/darley-latane
  id: n33
  cau: 'Đang tranh cãi → Đã bị bác bỏ: câu chuyện "38 nhân chứng đứng nhìn không làm gì" trong vụ Kitty Genovese.'
  loai: nhan
- trang: thi-nghiem/darley-latane
  id: n34
  cau: Vụ án mạng năm 1964 ở New York, với con số "38 nhân chứng", là chuyện mở đầu của bài báo năm 1968 của Darley và Latané.
  loai: lich-su
- trang: thi-nghiem/darley-latane
  id: n35
  cau: Manning, Levine và Collins (2007) không thấy bằng chứng cho 38 nhân chứng, cho việc họ nhìn thấy vụ án, hay cho việc họ đứng yên không làm gì.
  loai: lich-su
- trang: thi-nghiem/darley-latane
  id: n36
  cau: "Nếu bạn cần giúp, hãy gọi đích danh một người thay vì hỏi chung: trong một nghiên cứu ở 400 phòng chat trên mạng (Markey, 2000), lời nhờ có gọi tên được trả lời nhanh hơn (trung bình khoảng 36 giây so với 52 giây), và phòng đông người không còn làm chậm câu trả lời; đó là lời nhờ nhỏ trên mạng, không phải tình huống khẩn cấp."
  loai: loi-khuyen
- trang: thi-nghiem/darley-latane
  id: n37
  cau: "Nếu bạn là người chứng kiến, nói với người bên cạnh về điều đang xảy ra: trong thí nghiệm khói, người ta đoán tình hình qua vẻ bình thản của người xung quanh; theo Fischer và cộng sự (2011), khi những người chứng kiến là người thật và trao đổi thật với nhau, có thêm người chứng kiến thậm chí làm tăng việc giúp đỡ."
  loai: loi-khuyen
- trang: thi-nghiem/darley-latane
  id: n38
  cau: Theo Fischer và cộng sự (2011) kể lại, Beaman và cộng sự (1978) thấy sinh viên đã nghe giảng về hiệu ứng người ngoài cuộc về sau can thiệp vào một tình huống khẩn cấp nhiều hơn sinh viên chưa nghe.
  loai: loi-khuyen
- trang: thi-nghiem/darley-latane
  id: n39
  cau: Tính đến 10/2026, chúng tôi chưa tìm thấy thí nghiệm kiểu Darley–Latané trên người Việt.
  loai: thoi-su
- trang: thi-nghiem/darley-latane
  id: n40
  cau: "Cách nhìn nhân từ hơn cho cảnh đám đông đứng xem ở Việt Nam là giả thuyết cần kiểm tra: có thể nhiều người muốn giúp nhưng đang chờ nhau."
  loai: loi-khuyen
- trang: thi-nghiem/darley-latane
  id: n41
  cau: Trong thí nghiệm co giật, nhiều người không can thiệp vẫn run tay, đổ mồ hôi và còn phân vân; Darley và Latané cho rằng họ chưa quyết định không giúp.
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n42
  cau: Ngoài đời, ở mức cả đám đông, đông người làm tăng khả năng có ai đó giúp (Philpot 2020).
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n43
  cau: "Trong tình huống mập mờ, ở mức cá nhân, đông người thì mỗi người ít giúp hơn: nghịch lý mà Darley và Latané phát hiện."
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n44
  cau: "Câu hỏi 1: kết quả thí nghiệm khói: 75% (một mình), 38% (hai người lạ thật), 10% (hai diễn viên dửng dưng)."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n45
  cau: 'Câu hỏi 2: vô tri tập thể nghĩa là ai cũng nhìn người khác để đoán tình hình, thấy mọi người ngồi yên nên kết luận "chắc không sao"; lời giải thích: trong thí nghiệm khói, người không báo nói rằng họ đã kết luận khói không phải là lửa, và vẻ bình thản của người xung quanh dẫn họ tới cách hiểu ấy.'
  loai: dinh-nghia
- trang: thi-nghiem/darley-latane
  id: n46
  cau: "Câu hỏi 3: mô hình 5 bước (nhận thấy, hiểu là khẩn cấp, nhận trách nhiệm, tin mình biết cách giúp, quyết định giúp); lời giải thích: vấp ở bất kỳ bước nào là không có hành động; sự có mặt của người khác có thể cản ở nhiều bước."
  loai: lich-su
- trang: thi-nghiem/darley-latane
  id: n47
  cau: "Câu hỏi 4: Fischer và cộng sự (2011) thấy hiệu ứng vẫn còn (g = −0,35) nhưng yếu đi khi nguy hiểm rõ ràng, chẳng hạn khi có kẻ gây hại có mặt."
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n48
  cau: "Câu hỏi 5: trong nghiên cứu ở phòng chat của Markey (2000), lời nhờ có gọi đích danh một người được trả lời nhanh hơn hỏi chung cả phòng; phòng đông người không còn làm chậm câu trả lời, còn hỏi chung thì phòng càng đông câu trả lời càng đến chậm."
  loai: loi-khuyen
- trang: thi-nghiem/darley-latane
  id: n49
  cau: 'Hình "bystander-smoke": tỉ lệ báo khói trong vòng 6 phút: một mình 75%; cùng 2 người lạ 38% (tính theo nhóm, 3/8 nhóm); cùng 2 diễn viên dửng dưng 10%; chú thích và aria-label cùng số.'
  loai: so-lieu
- trang: thi-nghiem/darley-latane
  id: n54
  cau: Phỏng vấn sau thí nghiệm khói, những người không báo đều nói họ đã gạt ý nghĩ đó là lửa; nhiều người đoán là hơi nước hay hơi máy điều hòa.
  loai: phat-hien
- trang: thi-nghiem/darley-latane
  id: n55
  cau: Trong nghiên cứu của Markey (2000), 400 phòng chat được chọn ngẫu nhiên; lời nhờ có gọi tên được trả lời sau trung bình khoảng 36 giây, lời nhờ chung sau khoảng 52 giây.
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n1
  cau: Simons và Chabris (1999) cho người xem đếm đường chuyền bóng; khoảng một nửa không thấy một sự kiện bất ngờ đi qua (46% trong 192 người).
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n2
  cau: Với con khỉ đột ở video thường (opaque), khi đếm tổng số đường chuyền của đội áo trắng, 58% (7 trên 12 người) không thấy.
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n3
  cau: "Người tham gia xem video 75 giây: ba người áo trắng và ba người áo đen chuyền bóng rổ."
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n4
  cau: "Nhiệm vụ: đếm tổng số đường chuyền chỉ của đội áo trắng, hoặc chỉ của đội áo đen (bản dễ); hoặc đếm riêng chuyền bổng và chuyền sệt (bản khó)."
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n5
  cau: Sau khoảng 44–48 giây, một người mặc đồ khỉ đột đi xuyên qua giữa các cầu thủ trong 5 giây.
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n6
  cau: Trong một nửa số video, nhân vật bất ngờ là một phụ nữ cầm ô; trong nửa kia là phụ nữ mặc đồ khỉ đột.
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n7
  cau: Dữ liệu dùng là của 192 người xem, hầu hết là sinh viên đại học, mỗi người chỉ làm một điều kiện (sau khi loại 36 người).
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n8
  cau: Trong một biến thể riêng với 12 người xem, con khỉ đột dừng lại vỗ ngực trong video 62 giây, sự kiện kéo dài 9 giây; 50% thấy, tương tự bản thường (42%).
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n9
  cau: Người đếm đường chuyền đội áo đen thấy khỉ đột nhiều hơn người đếm đội áo trắng (58% so với 27%); với người cầm ô thì không có khác biệt như vậy (62% so với 69%).
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n10
  cau: Ta dễ nhận ra thứ giống (chia sẻ đặc điểm cơ bản như màu sắc) với thứ ta đang chú ý.
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n11
  cau: "Nhiệm vụ càng tốn sức (đếm riêng chuyền bổng và chuyền sệt), càng ít người thấy: 64% thấy ở bản dễ so với 45% ở bản khó."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n12
  cau: Thí nghiệm gốc dùng thuật ngữ "mù không chú ý kéo dài cho sự kiện động" (sustained inattentional blindness for dynamic events).
  loai: dinh-nghia
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n13
  cau: "Mù không chú ý (inattentional blindness): khi chú ý dồn vào một việc, người ta có thể không thấy những thứ bất ngờ nhưng nổi bật ngay trước mắt."
  loai: dinh-nghia
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n14
  cau: "Mù thay đổi (change blindness): người ta không nhận ra cả những thay đổi lớn giữa hai lần nhìn một cảnh."
  loai: dinh-nghia
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n15
  cau: "Levin và Simons (1997): người xem phim ngắn không nhận ra những thay đổi lộ liễu giữa các cảnh quay, kể cả khi diễn viên duy nhất trong cảnh biến thành người khác ngay lúc đổi góc máy."
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n16
  cau: "Simons và Levin (1998): một nhà nghiên cứu bắt chuyện với người đi đường; giữa chừng bị lén thay bằng một người khác; chỉ khoảng một nửa số người đi đường nhận ra; việc nhận ra phụ thuộc vào nhóm xã hội."
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n17
  cau: "Hyman và cộng sự (2010): người vừa đi bộ vừa nói chuyện điện thoại ít nhận ra chú hề đi xe đạp một bánh dọc lối đi hơn những người đi một mình, nghe nhạc hay đi theo cặp."
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n18
  cau: Nói chuyện điện thoại khi đi bộ đã có thể gây mù không chú ý; nghiên cứu không đo việc lái xe.
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n19
  cau: "Drew và cộng sự (2013): 83% trong 24 bác sĩ X-quang không thấy hình con khỉ đột (to gấp 48 lần nốt phổi trung bình) gắn vào ảnh CT phổi."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n20
  cau: "Ekelund và cộng sự (2022): phân tích tổng hợp 14 nghiên cứu (1.153 người): 62% người mới và 56% chuyên gia bị mù không chú ý; chuyên môn chỉ giảm nhẹ và không rõ."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n21
  cau: "Nobre và cộng sự (2020): tổng hợp 59 thí nghiệm cho thấy thứ không được chú ý và không được báo vẫn có thể được xử lý ngầm."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n22
  cau: "Chabris và cộng sự (2011): trong thí nghiệm mô phỏng ngoài đời, ban ngày 56% người chạy đuổi theo một người nhận ra vụ đánh nhau dàn dựng, ban đêm 35%; tăng gánh nặng chú ý làm giảm số người thấy."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n23
  cau: 'Herslund và Jørgensen (2003): tài xế ô tô nói không thấy xe đạp trên đường ưu tiên dù xe đạp rõ ràng ("looked-but-failed-to-see").'
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n24
  cau: "Caird và cộng sự (2014): tổng hợp 28 thí nghiệm (977 người) cho thấy gõ và đọc tin nhắn khi lái xe làm xấu đi khả năng phát hiện kích thích, thời gian phản ứng, va chạm và việc giữ làn."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n25
  cau: Vì vậy đừng nhắn tin khi lái xe.
  loai: loi-khuyen
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n26
  cau: Vừa đi vừa nói chuyện điện thoại làm giảm khả năng nhận ra thứ bất ngờ; đó là lý do để ngẩng lên và chú ý ở vạch sang đường.
  loai: loi-khuyen
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n27
  cau: Trong thí nghiệm mô phỏng ngoài đời, chỉ 35% (ban đêm) đến 56% (ban ngày) người chạy ngang qua vụ đánh nhau dàn dựng để ý thấy nó.
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n28
  cau: "Chuyên môn không miễn nhiễm: 83% bác sĩ X-quang không thấy con khỉ đột; tổng hợp 14 nghiên cứu thấy chuyên môn chỉ giảm nhẹ tỉ lệ mù."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n29
  cau: Levin và cộng sự (2000) gọi việc đánh giá quá cao khả năng phát hiện thay đổi của chính mình là "mù về mù thay đổi" (change blindness blindness).
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n30
  cau: "Chú ý có giới hạn: nhiệm vụ càng tốn sức thì càng ít người thấy vật bất ngờ."
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n31
  cau: "Vững chắc: chú ý tập trung khiến ta bỏ lỡ những thứ bất ngờ, kể cả thứ rất lộ liễu."
  loai: nhan
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n32
  cau: "Khá vững: nhiệm vụ càng nặng, vật càng khác thứ ta đang chú ý, càng dễ bị bỏ lỡ."
  loai: nhan
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n33
  cau: "Khá vững: mù không chú ý cũng xảy ra ngoài đời thật, nhưng chưa rõ áp dụng đến đâu cho nhân chứng."
  loai: nhan
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n34
  cau: Tính đến 10/2026, chúng tôi chưa tìm thấy nghiên cứu mù không chú ý trên người Việt.
  loai: thoi-su
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n35
  cau: Không có dữ liệu Việt Nam; mô tả "nhìn mà không thấy" ở Đan Mạch có thể gợi ý cho giao thông đông xe máy ở Việt Nam, nhưng đó là suy luận.
  loai: loi-khuyen
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n36
  cau: Trong thí nghiệm gốc, khoảng một nửa người xem không thấy; Levin và cộng sự (2000) gọi việc đánh giá quá cao khả năng phát hiện thay đổi của chính mình là "mù về mù thay đổi".
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n37
  cau: Phần lớn bác sĩ X-quang bỏ lỡ con khỉ đột đã nhìn thẳng vào vị trí của nó.
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n38
  cau: Gõ và đọc tin nhắn khi lái xe làm xấu đi khả năng phát hiện, thời gian phản ứng, va chạm và việc giữ làn.
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n39
  cau: "Câu hỏi 1: khoảng một nửa (46% trong thí nghiệm gốc) người xem không để ý đến sự kiện bất ngờ."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n40
  cau: "Câu hỏi 2: Simons và Chabris thấy người đếm đội áo đen thấy khỉ đột nhiều hơn (58% so với 27%), nhưng không thấy ở người cầm ô."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n41
  cau: "Câu hỏi 3: trong thí nghiệm ngoài đời của Simons và Levin (1998), khoảng một nửa số người đi đường nhận ra người bắt chuyện đã bị thay."
  loai: so-lieu
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n42
  cau: "Câu hỏi 4: người nói chuyện điện thoại ít nhận ra chú hề hơn các nhóm đi một mình, nghe nhạc, đi theo cặp."
  loai: phat-hien
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n43
  cau: "Câu hỏi 5: não có thể bỏ lỡ cả thứ ngay trước mắt khi đang bận việc khác; vì vậy đừng nhắn tin khi lái xe và đừng giả định rằng người ta phải thấy mình."
  loai: loi-khuyen
- trang: thi-nghiem/khi-dot-vo-hinh
  id: n44
  cau: 'Hình/ô trong video: sáu người chia hai đội áo trắng, áo đen chuyền bóng rổ; số đường chuyền "12… 13… 14… 15" là minh họa giả định.'
  loai: phat-hien
