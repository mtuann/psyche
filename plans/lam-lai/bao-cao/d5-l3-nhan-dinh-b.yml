- trang: kham-pha/tinh-cach/big-five
  id: n1
  cau: Big Five là khung được dùng rất phổ biến trong nghiên cứu tính cách.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n2
  cau: Điểm số tính cách phân bố liên tục, không thành hai cụm rời; Big Five coi tính cách là các chiều liên tục.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n3
  cau: Tính cách là những khuôn mẫu suy nghĩ, cảm xúc và hành vi tương đối ổn định.
  loai: dinh-nghia
- trang: kham-pha/tinh-cach/big-five
  id: n4
  cau: Một cách đo thường dùng là bảng hỏi tự báo cáo rồi phân tích nhân tố để xem các câu trả lời đi chung với nhau.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n5
  cau: Từ hàng nghìn từ miêu tả, các cụm co lại còn năm, lặp lại qua nhiều thập kỷ, nhiều ngôn ngữ và nhiều cách đo; một số nghiên cứu tìm ra sáu hay không tái lập đúng năm.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n6
  cau: "Allport và Odbert (1936), hai nhà tâm lý học người Mỹ, xuất phát từ giả thuyết từ vựng: những khác biệt tính cách quan trọng sẽ được mã hóa thành từ trong ngôn ngữ."
  loai: lich-su
- trang: kham-pha/tinh-cach/big-five
  id: n7
  cau: Allport và Odbert lục từ điển tiếng Anh và trích ra khoảng 18.000 từ miêu tả con người.
  loai: so-lieu
- trang: kham-pha/tinh-cach/big-five
  id: n8
  cau: Trong danh sách đó, khoảng 4.500 từ miêu tả những đặc điểm ổn định, quan sát được.
  loai: so-lieu
- trang: kham-pha/tinh-cach/big-five
  id: n9
  cau: Tupes và Christal (hai nhà nghiên cứu của Không quân Mỹ) lấy 35 đặc điểm tiêu biểu, nhờ người khác đánh giá, ở tổng cộng 8 mẫu.
  loai: so-lieu
- trang: kham-pha/tinh-cach/big-five
  id: n10
  cau: Người được đánh giá đi từ quân nhân trong khóa huấn luyện đến sinh viên đại học và học viên cao học; người đánh giá từ người mới quen đến nhà tâm lý lâm sàng nhiều kinh nghiệm; thời gian quen biết từ 3 ngày đến hơn một năm.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n11
  cau: "Ở cả 8 mẫu, phân tích nhân tố cho ra 5 nhân tố khá mạnh và lặp lại: Surgency, Agreeableness, Dependability, Emotional Stability, Culture."
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n12
  cau: Báo cáo gốc là tài liệu kỹ thuật quân sự năm 1961, công bố lại trên tạp chí khoa học năm 1992.
  loai: lich-su
- trang: kham-pha/tinh-cach/big-five
  id: n13
  cau: Costa và McCrae xây dựng bảng hỏi; phiên bản đầu đo 3 chiều (lo âu, hướng ngoại, cởi mở), mỗi chiều gồm nhiều khía cạnh.
  loai: lich-su
- trang: kham-pha/tinh-cach/big-five
  id: n14
  cau: Bản NEO PI (1985) bổ sung dễ chịu và tận tâm; NEO-PI-R (1992) là công cụ đo cả năm chiều; mô hình gọi là Five-Factor Model (FFM).
  loai: lich-su
- trang: kham-pha/tinh-cach/big-five
  id: n15
  cau: "Năm chiều OCEAN: Openness (tò mò, thích cái mới, giàu tưởng tượng), Conscientiousness (ngăn nắp, kỷ luật, đáng tin), Extraversion (sôi nổi, thích giao tiếp, nhiều năng lượng), Agreeableness (tin tưởng, hợp tác, ấm áp), Neuroticism (dễ lo âu, buồn bã, nhạy cảm với stress)."
  loai: dinh-nghia
- trang: kham-pha/tinh-cach/big-five
  id: n16
  cau: 'John, Naumann và Soto (2008), chương "Paradigm shift to the integrative Big Five trait taxonomy: History, measurement, and conceptual issues", trong Handbook of Personality (ấn bản 3, Guilford, tr. 114–158), hệ thống hóa lịch sử, cách đo và vấn đề khái niệm của Big Five.'
  loai: lich-su
- trang: kham-pha/tinh-cach/big-five
  id: n17
  cau: McCrae và Costa (1997) so sánh cấu trúc nhân tố của 6 bản dịch NEO-PI-R (Đức, Bồ Đào Nha, Hebrew, Trung, Hàn, Nhật) với cấu trúc gốc của người Mỹ, trên tổng cộng 7.134 người.
  loai: so-lieu
- trang: kham-pha/tinh-cach/big-five
  id: n18
  cau: Cấu trúc 5 nhân tố được tái lập ở tất cả các mẫu, dù 6 ngôn ngữ thuộc 5 ngữ hệ khác nhau; các tác giả kết luận dữ liệu "rất ủng hộ" việc cấu trúc tính cách là phổ quát.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n19
  cau: Một khảo sát diện rộng ở 23 nước thu nhập thấp và trung bình thấy các câu hỏi Big Five thường không đo đúng các chiều dự định khi hỏi trực tiếp tại hộ gia đình.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n20
  cau: "Khá vững: 5 chiều lặp lại qua nhiều ngôn ngữ và cách đo, nhưng chưa phải ở mọi nơi."
  loai: nhan
- trang: kham-pha/tinh-cach/big-five
  id: n21
  cau: "Khá vững: Big Five dự báo được kết quả công việc, nhưng ở mức nhỏ đến vừa."
  loai: nhan
- trang: kham-pha/tinh-cach/big-five
  id: n22
  cau: Tận tâm dự báo hiệu suất công việc ở cả 5 nhóm nghề và cả 3 loại tiêu chí, ρ khoảng .20–.23.
  loai: so-lieu
- trang: kham-pha/tinh-cach/big-five
  id: n23
  cau: Hướng ngoại dự báo ở hai nghề cần giao tiếp (quản lý, ρ = .18; bán hàng, ρ = .15).
  loai: so-lieu
- trang: kham-pha/tinh-cach/big-five
  id: n24
  cau: "Mô hình HEXACO có 6 chiều, thêm chiều trung thực–khiêm tốn (Honesty-Humility: chân thành, công bằng, khiêm tốn)."
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n25
  cau: Trong các nghiên cứu Ashton và Lee dẫn, HEXACO dự báo hành vi sai trái ở nơi làm việc tốt hơn Big Five (hệ số tương quan bội .63 so với .47) và dự báo khả năng quấy rối tình dục (.54 khi thêm Honesty-Humility so với .34).
  loai: so-lieu
- trang: kham-pha/tinh-cach/big-five
  id: n26
  cau: "Đang tranh cãi: có đúng là 5 chiều, không hơn không kém? Phe HEXACO lập luận chiều thứ sáu đo điều Big Five bỏ sót."
  loai: nhan
- trang: kham-pha/tinh-cach/big-five
  id: n27
  cau: "Giả thuyết từ vựng: nếu một khác biệt tính cách thực sự quan trọng, con người sẽ đặt tên cho nó; vì vậy cấu trúc từ vựng phản ánh cấu trúc tính cách."
  loai: dinh-nghia
- trang: kham-pha/tinh-cach/big-five
  id: n28
  cau: Lý thuyết năm nhân tố của McCrae và Costa cho rằng sự trưởng thành của tính cách phần lớn do yếu tố di truyền quyết định.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n29
  cau: "Nghĩ theo điểm số, đừng nghĩ theo loại: Vững chắc."
  loai: nhan
- trang: kham-pha/tinh-cach/big-five
  id: n30
  cau: Người có điểm ở gần ranh giới dễ nhận "loại" khác khi làm lại bài test, dù điểm liên tục của họ chênh nhau rất ít.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n31
  cau: 'Đọc điểm số Big Five như mức trung bình, không như nhãn: điểm tận tâm thấp không có nghĩa là "lười"; điểm số không cho biết giá trị nghề nghiệp của một người. Khá vững.'
  loai: nhan
- trang: kham-pha/tinh-cach/big-five
  id: n32
  cau: Điểm Big Five đo xu hướng trung bình, không phải số phận từng hành động; một người hướng ngoại vẫn có lúc muốn ở một mình.
  loai: loi-khuyen
- trang: kham-pha/tinh-cach/big-five
  id: n33
  cau: Big Five là công cụ mô tả các chiều của tính cách bình thường, không phải công cụ chẩn đoán bệnh lý.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n34
  cau: "Hiểu giới hạn của bảng hỏi (điểm đo xu hướng trung bình; mô tả tính cách bình thường, không chẩn đoán): Vững chắc."
  loai: nhan
- trang: kham-pha/tinh-cach/big-five
  id: n35
  cau: Tính đến 11/2026, chúng tôi tìm thấy hai nghiên cứu có mẫu người Việt kiểm tra cấu trúc nhân tố của tính cách, với kết quả khác nhau; chưa tìm thấy nghiên cứu chuẩn hóa NEO-PI-R trên mẫu người Việt đại diện.
  loai: thoi-su
- trang: kham-pha/tinh-cach/big-five
  id: n36
  cau: Một khảo sát ở nông thôn Thái Lan và Việt Nam (3.811 người, hai đợt) thấy cấu trúc 5 nhân tố phù hợp với mô hình Big Five.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n37
  cau: Một nghiên cứu từ vựng tiếng Việt (710 người; 668 từ miêu tả tính cách) thấy mô hình Big Five và Big Six "không được tái lập tốt", cấu trúc 8 nhân tố dễ diễn giải nhất.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n38
  cau: Nghiên cứu của McCrae và Costa (1997) có bản dịch tiếng Trung, Hàn, Nhật nhưng không có tiếng Việt.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n39
  cau: Bản dịch một bài test chưa qua quy trình chuẩn hóa (dịch ngược, kiểm chứng cấu trúc nhân tố) thì chưa rõ có đo đúng điều bản gốc đo; điểm số chỉ nên xem là tham khảo, không dùng cho quyết định quan trọng như tuyển dụng.
  loai: loi-khuyen
- trang: kham-pha/tinh-cach/big-five
  id: n40
  cau: Một nghiên cứu được Pittenger (1993) dẫn lại thấy khoảng một nửa số người được xếp lại ở ít nhất một trong bốn thang khi làm lại MBTI sau 5 tuần.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n41
  cau: Barrick và Mount (1991) thấy hướng ngoại dự báo hiệu suất ở quản lý và bán hàng, còn ở các nhóm nghề khác hệ số nhỏ hơn; giá trị của mỗi chiều phụ thuộc hoàn cảnh.
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n44
  cau: "Câu hỏi quiz 1: giả thuyết từ vựng nói rằng những khác biệt tính cách quan trọng sẽ được mã hóa thành từ trong ngôn ngữ."
  loai: dinh-nghia
- trang: kham-pha/tinh-cach/big-five
  id: n45
  cau: "Câu hỏi quiz 2: Tupes và Christal phân tích đánh giá trên 35 đặc điểm ở 8 mẫu và tìm ra 5 nhân tố lặp lại (gồm giải thích về 8 mẫu, người chấm)."
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n46
  cau: "Câu hỏi quiz 3: Big Five là 5 chiều liên tục vì điểm số phân bố liên tục, phần đông nằm quanh giữa; chia thành loại làm mất thông tin; người ở gần ranh giới dễ đổi loại khi làm lại."
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n47
  cau: "Câu hỏi quiz 4: cấu trúc 5 nhân tố được tái lập ở 6 bản dịch trên 7.134 người, bằng chứng mạnh cho tính phổ quát, dù không có nghĩa mọi chi tiết giống nhau."
  loai: so-lieu
- trang: kham-pha/tinh-cach/big-five
  id: n48
  cau: 'Câu hỏi quiz 5: tận tâm dự báo nhất quán ở cả 5 nhóm nghề; hướng ngoại dự báo ở quản lý, bán hàng, không nhất quán ở các nhóm nghề còn lại; không chiều nào "tốt tuyệt đối".'
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n49
  cau: 'Phần "Ngộ nhận": "Tính cách là cố định, không đổi được" là sai: mức trung bình các chiều dịch chuyển theo tuổi và thay đổi vẫn tiếp diễn ở tuổi trưởng thành.'
  loai: phat-hien
- trang: kham-pha/tinh-cach/big-five
  id: n50
  cau: 'Phần "Ngộ nhận": "Hướng nội là kém, lo âu là xấu"; "Biết 5 chiều là biết hết về một người"; Big Five mô tả xu hướng trên năm chiều, điểm số không cho biết động cơ, giá trị hay câu chuyện đời.'
  loai: loi-khuyen
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n1
  cau: "Mô tả trang: ổn định thứ hạng tăng dần theo tuổi theo phân tích tổng hợp Roberts & DelVecchio (2000), nhưng mức trung bình các chiều vẫn dịch chuyển, nhất là ở tuổi 20–40."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n2
  cau: "Thứ hạng của một người so với bạn bè ngày càng ổn định theo tuổi; mức trung bình của cả nhóm dịch chuyển: nhìn chung càng lớn càng kỷ luật hơn, điềm tĩnh hơn, dễ chịu hơn."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n3
  cau: Ổn định thứ hạng (rank-order stability) là vị trí tương đối của bạn so với người khác có giữ nguyên không; thay đổi mức trung bình (mean-level change) là điểm trung bình của cả nhóm có dịch chuyển không.
  loai: dinh-nghia
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n4
  cau: Roberts và DelVecchio dùng phân tích tổng hợp gộp 152 nghiên cứu dọc với tổng cộng 3.217 hệ số tương quan test-retest.
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n5
  cau: Khi giữ khoảng cách giữa hai lần đo ở 6,7 năm, tương quan test-retest là .31 ở thời thơ ấu, .54 ở tuổi đại học, .64 ở tuổi 30 và bình nguyên khoảng .74 ở tuổi 50–70.
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n6
  cau: Khoảng cách giữa hai lần đo càng dài thì tương quan càng thấp; các chiều khí chất ở trẻ nhỏ kém ổn định hơn các chiều tính cách ở người lớn.
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n7
  cau: Roberts, Walton và Viechtbauer (2006) gộp 92 mẫu nghiên cứu dọc để xem mức trung bình thay đổi thế nào.
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n8
  cau: "Tính thống trị xã hội (một khía cạnh của hướng ngoại: sự tự tin, quyết đoán trong giao tiếp), tận tâm và ổn định cảm xúc tăng, mạnh nhất ở tuổi 20–40."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n9
  cau: "Tính sôi nổi xã hội (khía cạnh còn lại của hướng ngoại: thích giao du, cảm xúc tích cực, nhiều năng lượng) và tính cởi mở tăng ở tuổi vị thành niên rồi giảm ở tuổi già."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n10
  cau: Tính dễ chịu chỉ thay đổi đáng kể ở tuổi già.
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n11
  cau: Trong 6 nhóm đặc điểm được xét, có 4 nhóm thay đổi đáng kể ở tuổi trung niên và tuổi già.
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n12
  cau: Nghiên cứu càng kéo dài thì thay đổi đo được càng lớn, và nghiên cứu theo dõi nhóm trẻ tuổi hơn thấy thay đổi lớn hơn.
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n13
  cau: "Roberts và Mroczek (2008): theo tuổi, con người nhìn chung tự tin hơn, ấm áp hơn, tự chủ hơn, ổn định cảm xúc hơn; các thay đổi này diễn ra nhiều nhất ở tuổi 20–40."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n14
  cau: "Thay đổi mức trung bình vẫn xảy ra ở tuổi trung niên và tuổi già: theo các tác giả, tính cách có thể thay đổi ở mọi lứa tuổi."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n15
  cau: William James cho rằng tính cách "đông cứng như thạch cao" (set like plaster) từ tuổi 30 (James, 1890); nghiên cứu hiện đại không khớp với quan niệm này.
  loai: lich-su
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n16
  cau: Ở mọi giai đoạn, mỗi người có kiểu phát triển riêng, dường như gắn với những trải nghiệm cụ thể của giai đoạn đời ấy.
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n17
  cau: Bleidorn và cộng sự (2013) dùng mẫu internet 884.328 người trẻ trưởng thành ở 62 quốc gia.
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n18
  cau: Từ đầu đến giữa tuổi trưởng thành, ở nhiều nền văn hóa người ta trở nên dễ chịu hơn, tận tâm hơn và bớt lo âu hơn.
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n19
  cau: Ở những nền văn hóa đảm nhận trách nhiệm của vai trò người lớn sớm hơn, sự trưởng thành tính cách đến sớm hơn, phù hợp với lý thuyết đầu tư xã hội; đây là so sánh giữa các nền văn hóa, chưa chứng minh nguyên nhân.
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n20
  cau: "Vững chắc: ổn định thứ hạng tăng theo tuổi, đạt đỉnh khoảng .74 ở tuổi 50–70."
  loai: nhan
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n21
  cau: 'Khá vững: mức trung bình dịch chuyển theo hướng "trưởng thành".'
  loai: nhan
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n22
  cau: "Đang tranh cãi: vì sao tính cách thay đổi, do sinh học bên trong hay do vai trò xã hội? Lý thuyết năm nhân tố cho rằng sự trưởng thành phần lớn do di truyền; lý thuyết đầu tư xã hội cho rằng phần lớn do các bước chuyển sang vai trò người lớn."
  loai: nhan
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n23
  cau: "Theo Bleidorn (2013): lý thuyết năm nhân tố cho rằng sự trưởng thành tính cách phần lớn do di truyền quyết định; lý thuyết đầu tư xã hội cho rằng nó phần lớn là kết quả của các bước chuyển sang vai trò người lớn."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n24
  cau: 'Đừng "đóng đinh" bản thân hay người khác: thứ hạng khá ổn định nhưng mức độ vẫn có thể dịch chuyển, nhất là ở tuổi 20–40; ở tuổi trẻ thứ hạng còn "dẻo" (tương quan khoảng .3–.5).'
  loai: loi-khuyen
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n25
  cau: "Khá vững (chip mục Áp dụng 1): không đóng đinh bản thân hay người khác."
  loai: nhan
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n26
  cau: "Đang tranh cãi (chip mục Áp dụng 2): thay đổi tính cách gắn với trải nghiệm sống nhưng nguyên nhân chưa rõ; ở những nền văn hóa nơi vai trò người lớn đến sớm hơn, sự trưởng thành đến sớm hơn."
  loai: nhan
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n27
  cau: Một phân tích tổng hợp 207 nghiên cứu về can thiệp (chủ yếu điều trị lâm sàng) thấy điểm một số chiều tính cách đổi rõ rệt trong khoảng 24 tuần (ví dụ d = 0,37), nhiều nhất ở ổn định cảm xúc.
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n28
  cau: Thay đổi tích lũy theo thời gian (nghiên cứu càng dài thì thay đổi đo được càng lớn) và vẫn xảy ra ở tuổi trung niên và già; không cho biết một cá nhân cụ thể sẽ đổi bao nhiêu.
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n29
  cau: "Khá vững (chip mục Áp dụng 3): thay đổi tích lũy chậm và vẫn xảy ra ở người lớn tuổi."
  loai: nhan
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n30
  cau: Tính đến 11/2026, chúng tôi tìm thấy một nghiên cứu hai đợt có mẫu gồm cả người Việt (3.811 người ở nông thôn Thái Lan và Việt Nam); chưa tìm thấy nghiên cứu dọc dài hạn về thay đổi tính cách theo tuổi trên mẫu người Việt đại diện.
  loai: thoi-su
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n31
  cau: "Khảo sát 3.811 người ở nông thôn Thái Lan và Việt Nam: mức trung bình đổi nhỏ giữa hai đợt (Cohen's d từ 0,06 đến 0,21), tương quan test-retest trung bình giữa hai đợt là 0,21; thay đổi cá nhân liên quan đến các cú sốc và phần lớn không phụ thuộc tuổi, giới, học vấn."
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n32
  cau: Nghiên cứu 62 quốc gia cho thấy hướng "trưởng thành" từ đầu đến giữa tuổi trưởng thành ở nhiều nền văn hóa, còn thời điểm trưởng thành khác nhau giữa các nền văn hóa; áp vào Việt Nam chỉ là giả thuyết.
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n33
  cau: "Ngộ nhận: tính cách đông cứng sau 30 là sai; 4/6 nhóm đặc điểm thay đổi đáng kể ở tuổi trung niên và già (Roberts, Walton & Viechtbauer 2006)."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n34
  cau: "Ngộ nhận: nếu tính cách thay đổi thì đo tính cách vô nghĩa; không suy ra được: thứ hạng tương đối ổn định (tuổi đại học .54, tuổi 30 .64 khi đo cách 6,7 năm) trong khi mức trung bình dịch chuyển."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n35
  cau: 'Ngộ nhận: "càng già càng khó tính là quy luật" không có trong các nguồn của bài: ổn định cảm xúc và tận tâm tăng ở tuổi 20–40, dễ chịu chỉ đổi đáng kể ở tuổi già.'
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n36
  cau: "Quiz: ổn định thứ hạng nghĩa là vị trí tương đối được giữ nguyên theo thời gian; điểm số có thể tăng mà thứ hạng giữ nguyên."
  loai: dinh-nghia
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n37
  cau: "Quiz: ở tuổi 30 và tuổi 50–70 hệ số test-retest là .64 và khoảng .74 (khoảng đo cố định 6,7 năm); đường cong .31 → .54 → .64 → ~.74."
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n38
  cau: "Quiz: khoảng đo càng dài thì hệ số ổn định càng thấp; .74 không phải 1.0."
  loai: so-lieu
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n39
  cau: "Quiz: Roberts 2006: tính thống trị xã hội, tận tâm và ổn định cảm xúc tăng mạnh ở tuổi 20–40; sôi nổi xã hội và cởi mở tăng ở vị thành niên rồi giảm ở tuổi già; dễ chịu chỉ đổi ở tuổi già."
  loai: phat-hien
- trang: kham-pha/tinh-cach/tinh-cach-thay-doi
  id: n40
  cau: "Quiz: Bleidorn 2013 phát hiện sự trưởng thành tính cách (dễ chịu, tận tâm, bớt lo âu) ở nhiều nền văn hóa, đến sớm hơn ở nơi vai trò người lớn đến sớm hơn."
  loai: phat-hien
- trang: kham-pha/tinh-cach/mbti
  id: n22
  cau: 'Bác bỏ: con người thuộc về một trong 16 "loại tính cách" rời rạc.'
  loai: nhan
- trang: kham-pha/tinh-cach/mbti
  id: n23
  cau: "Khá vững: nhát cắt nhị phân tại điểm giữa góp phần gây thiếu ổn định của nhãn loại."
  loai: nhan
- trang: kham-pha/tinh-cach/mbti
  id: n24
  cau: "Khá vững: Big Five có bằng chứng dự báo hiệu quả công việc, còn MBTI chưa có bằng chứng tương đương."
  loai: nhan
- trang: kham-pha/tinh-cach/mbti
  id: n25
  cau: "Đang tranh cãi: có nên dùng MBTI trong doanh nghiệp và tuyển dụng; phe bênh vực dựa vào độ tin cậy thang liên tục, phe phê bình nói nhãn bốn chữ cái thiếu ổn định và thiếu bằng chứng."
  loai: nhan
- trang: kham-pha/tinh-cach/mbti
  id: n31
  cau: "Đừng xem bốn chữ cái là căn cứ để tuyển dụng hay chọn nghề: các tổng quan đã mở không thấy đủ bằng chứng; Khá vững."
  loai: nhan
- trang: kham-pha/tinh-cach/mbti
  id: n32
  cau: Điểm liên tục của từng thang có độ tin cậy chấp nhận được; nhãn chữ cái không cho biết mức độ. Khá vững.
  loai: nhan
- trang: kham-pha/tinh-cach/mbti
  id: n33
  cau: Bốn chỉ số MBTI tương quan với bốn chiều Big Five; Big Five giữ thang liên tục và có bằng chứng dự báo hiệu quả công việc; Khá vững.
  loai: nhan
- trang: kham-pha/tinh-cach/mbti
  id: n41
  cau: "Quiz 2: theo NRC 1991, McCarley và Carskadon (1983) thấy 47% người giữ nguyên loại sau 5 tuần; Pittenger dẫn cùng nghiên cứu là khoảng 50% bị xếp lại ở ít nhất một thang."
  loai: so-lieu
- trang: kham-pha/tinh-cach/mbti
  id: n27
  cau: Boyle (1995) kết luận việc dùng MBTI thường quy không được khuyến nghị.
  loai: phat-hien
- trang: kham-pha/tinh-cach/mbti
  id: n42
  cau: "Quiz 3: McCrae và Costa (1989) không thấy ủng hộ cho các loại rời rạc; bốn chỉ số MBTI tương quan với các khía cạnh của bốn chiều Big Five."
  loai: phat-hien
- trang: kham-pha/tinh-cach/mbti
  id: n43
  cau: 'Quiz 4: tận tâm dự báo nhất quán ở cả 5 nhóm nghề và 3 loại tiêu chí, khoảng .20–.23; phương án nhiễu "hướng ngoại ~.50" và "ổn định cảm xúc ~.40" sai.'
  loai: so-lieu
- trang: kham-pha/tinh-cach/mbti
  id: n34
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra độ tin cậy hay giá trị của MBTI trên người Việt.
  loai: thoi-su
- trang: kham-pha/tinh-cach/mbti
  id: n14
  cau: McCrae và Costa (1989) so sánh MBTI với Big Five trên 468 người trưởng thành (267 nam, 201 nữ, 19–93 tuổi), dùng cả tự đánh giá và đánh giá của người quen.
  loai: so-lieu
- trang: kham-pha/tinh-cach/mbti
  id: n44
  cau: "Quiz 5: nên nhìn điểm số liên tục thay vì nhãn và không dùng nhãn loại làm căn cứ tuyển chọn; các tổng quan đã mở không thấy đủ bằng chứng để dùng nhãn loại trong tuyển chọn hay tư vấn nghề nghiệp."
  loai: loi-khuyen
- trang: kham-pha/tinh-cach/mbti
  id: n36
  cau: "Ngộ nhận: làm lại MBTI ra loại khác chưa chắc là tính cách đã đổi; một khả năng là bạn gần điểm cắt vì thay đổi nhãn tập trung ở người điểm gần giữa; điểm liên tục có độ tin cậy chấp nhận được."
  loai: phat-hien
