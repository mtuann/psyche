- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n14
  cau: "Mô tả trong bài chỉ để hiểu chung, không phải bảng để tự chấm điểm: chỉ
    người có chuyên môn mới chẩn đoán được (kèm link Hỗ trợ, ngay trước danh
    sách triệu chứng)."
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n32
  cau: Liệu pháp tâm lý và thuốc chống trầm cảm giúp giảm triệu chứng ở nhiều
    người, nhưng không phải ở tất cả; so với nhóm đối chứng, mức hiệu quả trung
    bình từ nhỏ đến vừa, nhỏ hơn nữa khi chỉ tính các nghiên cứu ít sai lệch hay
    khi hiệu chỉnh sai lệch xuất bản, và khác nhau nhiều giữa các người.
  loai: nhan
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n15
  cau: "Mô tả ba dạng là mô tả chung, không phải bảng để tự chấm điểm: chỉ người
    có chuyên môn mới chẩn đoán được (kèm link Hỗ trợ, ngay trước danh sách)."
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n32
  cau: "CBT, kể cả các kỹ thuật tiếp xúc, giảm triệu chứng của nhiều rối loạn lo
    âu: khá vững."
  loai: nhan
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n34
  cau: Phân tích tổng hợp các nghiên cứu sinh đôi ước tính gen giải thích khoảng
    43% khác biệt về nguy cơ rối loạn hoảng sợ và 32% với lo âu lan tỏa; với rối
    loạn hoảng sợ, phần còn lại chủ yếu thuộc về môi trường riêng của mỗi người;
    với lo âu lan tỏa ở nữ, môi trường chung của gia đình có thể cũng góp phần.
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n12
  cau: "Danh sách dấu hiệu giúp quyết định có nên tìm người nói chuyện, không phải
    để tự chẩn đoán: chỉ người có chuyên môn mới chẩn đoán được."
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n17
  cau: Theo Luật Khám bệnh, chữa bệnh 2023 (hiệu lực 01/01/2024), nhà tâm lý lâm
    sàng là chức danh phải có giấy phép hành nghề; theo phạm vi hành nghề ở
    Thông tư 32/2023/TT-BYT, công việc là đánh giá, xây dựng và thực hiện các
    can thiệp tâm lý tại cơ sở khám bệnh, chữa bệnh; không kê đơn thuốc (theo
    Thông tư 26/2025/TT-BYT, người kê đơn là bác sĩ, y sĩ).
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n38
  cau: "Sớm, đừng chờ thêm: cảm xúc tiêu cực kéo dài từ hai tuần trở lên không
    dịu; ảnh hưởng rõ đến học, làm, ngủ, ăn, quan hệ; phải dùng rượu, chất kích
    thích để chịu đựng."
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tim-giup-do
  id: n47
  cau: "Các mốc trên là gợi ý để tìm người nói chuyện, không phải để tự chẩn đoán:
    chỉ người có chuyên môn mới chẩn đoán được."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n5
  cau: 'Sự lắng nghe, quan tâm của bạn thân không vô ích: WHO xem việc giữ liên
    lạc, trò chuyện với người mình tin là một phần của tự chăm sóc, và sự đồng
    cảm là một trong các "yếu tố chung" của trị liệu; nhưng trò chuyện với bạn
    không thay được trị liệu khi cần.'
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n22
  cau: "42% người được CBT đáp ứng (giảm ít nhất một nửa triệu chứng; tỉ lệ phần
    lớn ước tính từ điểm trung bình của từng thử nghiệm), so với 19% ở nhóm đối
    chứng (NNT = 4,7: cứ khoảng 5 người được điều trị thì có thêm 1 người đáp
    ứng)."
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n46
  cau: "Shedler (2010) dẫn tổng quan Cochrane của Abbass và cộng sự (2006) về trị
    liệu tâm động ngắn hạn (dưới 40 giờ): cải thiện so với đối chứng 0,97, tăng
    lên 1,51 khi đánh giá hơn 9 tháng sau trị liệu; chính các tác giả tổng quan
    dặn đọc dè dặt vì mỗi loại rối loạn có ít nghiên cứu, dị biệt lớn, kết quả
    không luôn giữ trong phân tích độ nhạy."
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n55
  cau: 'Áp dụng 4: nên gặp người có chuyên môn khi buồn, lo, căng thẳng kéo dài
    nhiều tuần không dịu, ảnh hưởng rõ đến học, làm, ngủ, quan hệ, hay phải dùng
    rượu bia, chất kích thích; có ý nghĩ về cái chết hay tự làm hại thì tìm giúp
    đỡ ngay; không cần "đủ nặng"; đây là gợi ý, không phải để tự chẩn đoán, chỉ
    người có chuyên môn mới chẩn đoán được (link Hỗ trợ).'
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n59
  cau: "Imamura và cộng sự (2021): 951 điều dưỡng ở Hà Nội, so hai chương trình
    qua điện thoại thông minh với nhóm đối chứng; chỉ chương trình CBT theo thứ
    tự cố định giảm triệu chứng trầm cảm, ở mức nhỏ sau 3 tháng, không còn khác
    biệt sau 7 tháng; chương trình còn lại không có hiệu quả."
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n64
  cau: Một phân tích tổng hợp mà Wampold (2015) dẫn thấy liệu pháp được điều chỉnh
    theo văn hóa hiệu quả hơn bản không điều chỉnh, mức chênh nhỏ (d = 0,32);
    các nghiên cứu ấy chủ yếu làm với người thuộc nhóm thiểu số ở Bắc Mỹ.
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n69
  cau: "Hết liệu trình không có nghĩa khỏi hẳn: 42% đáp ứng nghĩa là phần lớn còn
    lại cần thêm phương án; người đã đỡ cũng có thể tái phát; NICE khuyên các
    liệu trình phòng tái phát (như CBT nhóm) tập trung rèn kỹ năng để giữ ổn
    định; có bằng chứng (từ ít thử nghiệm) rằng hiệu quả của CBT ở 6–12 tháng
    tốt hơn thuốc."
  loai: phat-hien
