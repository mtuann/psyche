- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n33
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525", "https://doi.org/10.1123/jsep.18.1.17"]
  trich: "Swann: \"certain dimensions have received low empirical support compared to others... less than 30% of athletes... reported loss of self-consciousness and transformation of time\""
  ghi_chu: "Nhãn Khá vững không cao hơn thước đo; chín chiều dùng trong nhiều lĩnh vực nhưng hỗ trợ không đều."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n38
  luot_2: qua-manh
  nguon: ["https://doi.org/10.1080/17439760.2014.967799", "https://doi.org/10.1080/10413200.2018.1443525", "https://doi.org/10.1007/s11205-012-0211-9"]
  trich: "Fong: liên hệ vừa; Swann: \"alone it is insufficient\"; Løvoll & Vittersø: \"Neither of our flow indicators peaked in the balance condition\""
  cau_dung: "Cân bằng thử thách-kỹ năng liên hệ vừa phải với flow (Fong 2015: 28 nghiên cứu), được coi là một điều kiện đề xuất nhưng không đủ để flow xảy ra; vài nghiên cứu không thấy flow đạt đỉnh ở điểm cân bằng."
  ghi_chu: "\"Flow xuất hiện khi... cân bằng\" đọc như điều kiện đủ; bằng chứng chỉ cho liên hệ vừa phải, không đủ, và có nghiên cứu không thấy đỉnh ở điểm cân bằng. Nhãn Khá vững chỉ hợp với \"có liên hệ\"."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n42
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525", "https://doi.org/10.1080/17439760.2014.967799", "https://doi.org/10.1111/bjep.70075"]
  trich: "Swann: flow \"purported to apply universally\"; Fong: tương quan yếu hơn ở văn hóa cá nhân chủ nghĩa; Xie 2026: văn hóa không điều chỉnh đáng kể"
  ghi_chu: "Bằng chứng mâu thuẫn nên Đang tranh cãi hợp lý (thấp hơn Khá vững)."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n46
  luot_2: dung
  nguon: ["https://doi.org/10.1080/1750984x.2021.1929402"]
  trich: "\"pooled effect size (r = 0.31, 95% CI [0.24; 0.38]) ... unable to determine the causal direction\""
  ghi_chu: "Chỉ đọc tóm tắt. Nhãn không cao hơn thước đo."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n56
  luot_2: dung
  nguon: ["https://doi.org/10.1080/17439760.2014.967799", "https://doi.org/10.1111/bjep.70075"]
  trich: "Fong: mục tiêu rõ là yếu tố đóng góp vững; Xie 2026: learning flow liên hệ dương với nhiệm vụ học tối ưu"
  ghi_chu: "Chỉ đọc tóm tắt. Bằng chứng chủ yếu tương quan; nhãn Khá vững không cao hơn thước đo."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n60
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525"]
  trich: "Swann: ít nghiên cứu can thiệp flow trong thể thao; điều kiện đủ chưa biết"
  ghi_chu: "Nhãn Đang tranh cãi thấp hơn thước đo Khá vững; thận trọng, hợp lý."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n63
  luot_2: dung
  nguon: ["https://doi.org/10.1007/s11205-012-0211-9", "https://doi.org/10.1080/17439760.2014.967799"]
  trich: "Løvoll & Vittersø: không có đỉnh ở điểm cân bằng; Fong: cân bằng liên hệ vừa với flow"
  ghi_chu: "Bằng chứng mâu thuẫn nên nhãn Đang tranh cãi hợp lý."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n66
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525", "https://eprints.leedsbeckett.ac.uk/id/eprint/4768/1/AReviewofScientificProgressinFlowAM-PIGGOTT.pdf"]
  trich: "\"the sufficient conditions of flow remain unknown\"; \"there is generally little research... experimentally inducing flow\"; \"flow remains a rare, elusive phenomenon\""
  ghi_chu: "Đọc toàn văn Swann 2018. Khớp."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n1
  luot_2: dung
  nguon: ["https://doi.org/10.3389/fpsyg.2020.00158"]
  trich: "\"The 'flow' experience (Csikszentmihalyi, 1975)... asked hundreds of rock climbers, chess players, artists... Csikszentmihalyi developed the concept of 'flow'\""
  ghi_chu: "Đọc toàn văn Abuhamdeh 2020 (PMC)."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n2
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525", "https://doi.org/10.3389/fpsyg.2020.00158"]
  trich: "Swann: chín chiều, thang FSS; Abuhamdeh: flow được vận hành theo 24 cách trong 42 nghiên cứu"
  ghi_chu: "Khớp."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n3
  luot_2: dung
  nguon: ["https://doi.org/10.3389/fpsyg.2020.00158"]
  trich: "\"he asked hundreds of rock climbers, chess players, artists, etc. to describe what their best moments felt like. Based on this research, Csikszentmihalyi developed the concept of flow\""
  ghi_chu: "\"Giữa những năm 1970\" suy từ mốc 1975 của bài."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n4
  luot_2: dung
  nguon: ["https://doi.org/10.3389/fpsyg.2020.00158"]
  trich: "\"Csikszentmihalyi (1975) introduced the concept of flow... in his groundbreaking book Beyond Boredom and Anxiety\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n5
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525"]
  trich: "\"remarkable consistency has been found in the described flow experiences of individuals across diverse settings\" (Jackson & Eklund) cùng các phê bình của chính Swann"
  ghi_chu: "Đúng cả hai vế."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n7
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525"]
  trich: "\"(i) challenge-skill balance\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n8
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525"]
  trich: "\"(ii) clear goals\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n9
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525"]
  trich: "\"(iii) unambiguous feedback that allows the person to know whether they are progressing\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n10
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525"]
  trich: "\"(iv) action-awareness merging (whereby deep involvement leads to automaticity and spontaneity)\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n11
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525"]
  trich: "\"(v) concentration on the task at hand with no extraneous or distracting thoughts\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n12
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525"]
  trich: "\"(vi) sense of control over the performance or outcome\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n13
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525"]
  trich: "\"(vii) loss of self-consciousness\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n14
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525"]
  trich: "\"(viii) transformation of time\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n15
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525"]
  trich: "\"(ix) autotelic experience (i.e., flow is described as rewarding and enjoyable)\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n16
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525"]
  trich: "Ba điều kiện (i)-(iii); sáu chiều còn lại mô tả; chú thích: autotelic \"usually outside of sport and exercise\" không tách riêng"
  ghi_chu: "Khớp."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n17
  luot_2: dung
  nguon: ["https://doi.org/10.3389/fpsyg.2020.00158"]
  trich: "\"quadrant model... anxiety, apathy, boredom/relaxation\"; flow = challenge and skill both \"above the person's average\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n18
  luot_2: dung
  nguon: ["https://doi.org/10.3389/fpsyg.2020.00158"]
  trich: "Hình 2 của Abuhamdeh: quadrant model của flow (z-score trong cá nhân)"
  ghi_chu: "Không mở hình trên site (không được phép); chỉ xét nội dung mô tả: nhãn bốn góc đúng với mô hình."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n19
  luot_2: qua-manh
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525", "https://doi.org/10.3389/fpsyg.2020.00158"]
  trich: "Swann: \"together they are not sufficient for flow to occur\"; Abuhamdeh: suy flow chỉ từ cân bằng thử thách-kỹ năng \"is not warranted\""
  cau_dung: "Theo mô hình kênh flow, flow được dự đoán khi cả thử thách và kỹ năng cao và cân bằng; đây là điều kiện đề xuất, không đủ để flow xảy ra."
  ghi_chu: "\"Flow chỉ xuất hiện khi cả hai đều cao và cân bằng\" nói như điều kiện cần và đủ; thực ra đó là điều kiện đề xuất, không đủ. Chỉ xét câu chữ nêu trong danh sách, không xem hình."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n20
  luot_2: dung
  nguon: ["https://doi.org/10.1007/bf02138940"]
  trich: "\"Twenty-five adolescents reported their daily activities... for a total of 753 times during a normal week, in response to random beeps transmitted by an electronic paging device\""
  ghi_chu: "Đúng. Chỉ tóm tắt (Springer)."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n21
  luot_2: dung
  nguon: ["https://doi.org/10.1007/bf02138940", "https://doi.org/10.3389/fpsyg.2020.00158"]
  trich: "\"The experiential sampling method described in this paper provides a tool\"; Abuhamdeh dẫn Csikszentmihalyi et al. 1977 là ESM"
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n22
  luot_2: dung
  nguon: ["https://doi.org/10.1126/science.1103572"]
  trich: "ESM: \"Participants... are prompted to record where they are, what they are doing, and how they feel several times throughout the day\""
  ghi_chu: "Mô tả ESM theo Kahneman 2004."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n23
  luot_2: dung
  nguon: ["https://doi.org/10.1080/17439760.2014.967799", "https://doi.org/10.3389/fpsyg.2020.00158"]
  trich: "Fong: moderator \"using experience sampling method\"; Abuhamdeh: hai nghiên cứu dùng ESM với mô hình bốn góc"
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n24
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0022-3514.56.5.815"]
  trich: "\"Followed 78 adult workers for 1 week with the experience sampling method... whether the quality of experience was more influenced by... work or leisure or... in flow\""
  ghi_chu: "Chỉ tóm tắt."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n25
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0022-3514.56.5.815"]
  trich: "\"all the variables measuring the quality of experience, except for relaxation and motivation, are more affected by flow than by whether the respondent is working or in leisure\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n26
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0022-3514.56.5.815"]
  trich: "\"the great majority of flow experiences are reported when working, not when in leisure\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n28
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0022-3514.56.5.815"]
  trich: "\"respondents are more motivated in leisure than in work\""
  ghi_chu: "Đúng; \"nghịch lý của công việc\" là tên gọi của site."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n30
  luot_2: dung
  nguon: ["https://doi.org/10.1123/jsep.18.1.17", "https://doi.org/10.1123/jsep.24.2.133"]
  trich: "\"Confirmatory factor analyses supported the nine scales... support for a hierarchical model in which one global (higher order) flow factor explained correlations\""
  ghi_chu: "Đúng cho FSS (1996) và FSS-2 (2002)."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n32
  luot_2: dung
  nguon: ["https://doi.org/10.1016/j.psychsport.2007.05.005"]
  trich: "Kawabata, Mallett & Jackson (2008), Psychol Sport Exerc 9(4): 465-485: \"Examination of factorial validity and reliability for Japanese adults\""
  ghi_chu: "Chỉ xác nhận có bài (Crossref, tiêu đề); không đọc được kết quả như câu đã ghi."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n34
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525", "https://eprints.leedsbeckett.ac.uk/id/eprint/4768/1/AReviewofScientificProgressinFlowAM-PIGGOTT.pdf"]
  trich: "\"Swann et al. (2012) reported that less than 30% of athletes in the included qualitative studies reported the dimensions loss of self-consciousness and transformation of time\""
  ghi_chu: "Đọc toàn văn Swann 2018 (kể lại Swann 2012)."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n35
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525", "https://eprints.leedsbeckett.ac.uk/id/eprint/4768/1/AReviewofScientificProgressinFlowAM-PIGGOTT.pdf"]
  trich: "\"the nine-dimensions framework: (i) is missing core aspects of the flow experience, and (ii) includes overlaps\"; \"bodily sensations\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n36
  luot_2: dung
  nguon: ["https://doi.org/10.3389/fpsyg.2020.00158"]
  trich: "\"progress... has been impeded by a lack of consistency in how flow is operationalized... 24 distinct ways\" (42 nghiên cứu)"
  ghi_chu: "Đúng (nói về cách vận hành, không phải cách đo thống nhất theo nghĩa hẹp)."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n37
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525", "https://eprints.leedsbeckett.ac.uk/id/eprint/4768/1/AReviewofScientificProgressinFlowAM-PIGGOTT.pdf"]
  trich: "\"a classic study (Jackson, 1996) employed interviews with elite athletes... how do athletes' experiences of flow compare with the theoretical descriptions of flow put forward by Csikszentmihalyi (1990)?\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n39
  luot_2: dung
  nguon: ["https://doi.org/10.1080/17439760.2014.967799"]
  trich: "\"meta-analysis on 28 studies... moderate... weaker correlations when individuals were from an individualistic culture, in work or education contexts, using experience sampling method, and self-reporting state flow vs. trait\""
  ghi_chu: "Đúng; chỉ tóm tắt."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n40
  luot_2: dung
  nguon: ["https://doi.org/10.1007/s11205-012-0211-9"]
  trich: "\"64 first year sport- and outdoor students... 26 second year outdoor students... Neither of our flow indicators peaked in the balance condition... support was given for an imbalance model\""
  ghi_chu: "Đúng; bài chính thức in 2014 (SIR 115(1)), online 2012. Chỉ tóm tắt."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n43
  luot_2: dung
  nguon: ["https://doi.org/10.1111/bjep.70075"]
  trich: "\"108 independent studies comprising a total sample of 42,952 participants... neither cultural context nor measurement approaches significantly influenced the observed effect sizes\""
  ghi_chu: "Đúng (BJEP 2026)."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n44
  luot_2: dung
  nguon: ["https://doi.org/10.1111/jopy.70004"]
  trich: "\"24 eligible studies... Conscientiousness and flow (r = 0.33)... stronger correlations in Eastern cultures for Extraversion, Openness, and Agreeableness\""
  ghi_chu: "Tác giả đầu Buseyne; in J Personality 94(2) tháng 4/2026 (online 2025). Chỉ tóm tắt."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n45
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525", "https://doi.org/10.1080/17439760.2014.967799", "https://doi.org/10.1111/bjep.70075"]
  trich: "Swann: Csikszentmihalyi coi flow phổ quát; Fong/Xie: kiểm tra điều chỉnh theo văn hóa chung, không riêng mất tự ý thức"
  ghi_chu: "Câu tự nhận là giả thuyết chưa kiểm chứng; không thấy nghiên cứu nhắm vào điều này."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n47
  luot_2: dung
  nguon: ["https://doi.org/10.1080/1750984x.2021.1929402"]
  trich: "\"22 studies... pooled effect size (r = 0.31, 95% CI [0.24; 0.38]) ... sport and gaming tasks... unable to determine the causal direction ... or the mechanisms\""
  ghi_chu: "Đúng (22 nghiên cứu từ 20 bài); chỉ tóm tắt."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n48
  luot_2: dung
  nguon: ["https://doi.org/10.1080/1750984x.2021.1929402", "https://doi.org/10.3389/fpsyg.2020.00158"]
  trich: "Harris: r = 0,31, chưa rõ chiều nhân quả; Abuhamdeh: flow là trạng thái \"highly enjoyable\""
  ghi_chu: "Phù hợp bằng chứng: tương quan vừa, không đơn giản."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n49
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525", "https://eprints.leedsbeckett.ac.uk/id/eprint/4768/1/AReviewofScientificProgressinFlowAM-PIGGOTT.pdf"]
  trich: "\"flow models generally postulate how combinations of high and low challenge and skill can lead to... boredom, anxiety, and flow\"; \"the sufficient conditions of flow remain unknown\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n50
  luot_2: dung
  nguon: ["https://doi.org/10.1111/jopy.12938"]
  trich: "\"those with an autotelic personality-a combination of traits that make people prone to flow\""
  ghi_chu: "Khái niệm do Csikszentmihalyi đề xuất; xác nhận qua mô tả trong bài 2025; không mở được nguồn gốc."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n51
  luot_2: khong-chac
  ghi_chu: "Nakamura & Csikszentmihalyi (2002, Handbook of Positive Psychology) chỉ mở được phần tóm tắt/mục lục trên Springer; không đọc được đoạn nêu các nét (tò mò, kiên trì, ít vị kỷ) hay cụm \"siêu kỹ năng\"."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n54
