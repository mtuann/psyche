  trich: "Phân tích tổng hợp 24 nghiên cứu về Big Five và flow (tận tâm r = 0,33); thí nghiệm đăng ký trước 2025 về nhân cách tự trị (J Personality)"
  cau_dung: "Mối liên hệ giữa nét tính cách và flow đã được kiểm tra (24 nghiên cứu Big Five; tận tâm r = 0,33) và có thí nghiệm về nhân cách tự trị; chưa rõ các nét đó rèn luyện được hay bẩm sinh."
  ghi_chu: "\"Hiếm được kiểm tra\" không đúng: đã có phân tích tổng hợp về nét tính cách-flow và thí nghiệm về nhân cách tự trị. Phần r = 0,33 và chưa rõ rèn luyện hay bẩm sinh thì đúng."
