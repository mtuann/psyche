  id: n1
  luot_2: dung
  nguon: ["https://doi.org/10.1207/s15327752jpa4901_13", "https://doi.org/10.1037/0033-2909.95.3.542"]
  trich: "SWLS: \"a scale to measure global life satisfaction\"; Diener 1984: SWB reviewed in \"measurement, causal factors, and theory\""
  ghi_chu: "Đọc toàn văn Diener 1984 (Internet Archive) và SWLS 1985. Mô tả khớp nội dung hai bài."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n2
  luot_2: dung
  nguon: ["https://doi.org/10.1207/s15327752jpa4901_13"]
  trich: "Instructions: \"1 = strongly disagree ... 7 = strongly agree\"; 5 items"
  ghi_chu: "Toàn văn bài 1985 (Table 1) có đúng 5 câu, thang 1-7; tổng tối đa 35."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n3
  luot_2: dung
  nguon: ["https://doi.org/10.1007/s11205-009-9440-y"]
  trich: "\"44 independent samples and 81 correlations for a total of 8,897 participants was r = 0.42\""
  ghi_chu: "Tổng hợp tự đánh giá với người thông tin (informant) nói chung, không riêng bạn thân; câu chỉ nói ngắn gọn nên chấp nhận. Chỉ đọc tóm tắt (trang Springer)."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n4
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0033-2909.95.3.542"]
  trich: "\"there is evidence that momentary mood influences subjects' responses to SWB questions (Schwarz & Clore, 1983)\""
  ghi_chu: "Diener 1984 cũng nói thêm: điểm thang nhiều câu không bị méo đáng kể và độ tin cậy theo thời gian đáng kể. Câu đủ cân bằng."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n5
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0033-2909.95.3.542"]
  trich: "Psychological Bulletin, 1984, Vol. 95, No. 3, 542-575"
  ghi_chu: "Đọc trang đầu bài gốc."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n6
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0033-2909.95.3.542"]
  trich: "\"reviewed in three areas: measurement, causal factors, and theory\""
  ghi_chu: "Khớp tóm tắt bài gốc."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n7
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0033-2909.95.3.542"]
  trich: "\"The area of subjective well-being has three hallmarks. First, it is subjective... Second, ... includes positive measures... Third, ... a global assessment\""
  ghi_chu: "Ba đặc điểm được nêu đúng như câu viết."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n8
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0033-2909.95.3.542"]
  trich: "\"Andrews and Withey (1976) have found three general components of subjective well-being: life satisfaction judgments, positive affect, and negative affect\""
  ghi_chu: "Diener 1984 dẫn ba thành phần này từ Andrews & Withey và nói chúng đo riêng (\"measure the separate components\"); không có phép cộng điểm. Câu đúng."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n9
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0033-2909.95.3.542"]
  trich: "\"How these two components relate to one another is an empirical question, not one of definition.\""
  ghi_chu: "Bài nói về hài lòng cuộc sống và cảm xúc tích cực; đúng tinh thần câu."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n10
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0022-3514.71.3.616"]
  trich: "\"life satisfaction is discriminable from positive and negative affect... on 3 sets of data\""
  ghi_chu: "Chỉ đọc tóm tắt (OpenAlex); đủ cho điều câu nêu."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n11
  luot_2: dung
  nguon: ["https://doi.org/10.1126/science.1103572", "https://doi.org/10.1037/0022-3514.71.3.616"]
  trich: "Life satisfaction vs net affect \"moderately correlated (r = 0.38)\""
  ghi_chu: "Ví dụ minh họa hợp lý với tương quan vừa phải, không hoàn toàn đồng nhất (r 0,38 chứ không phải 1)."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n12
  luot_2: dung
  nguon: ["https://doi.org/10.1207/s15327752jpa4901_13"]
  trich: "\"the development and validation of a scale to measure global life satisfaction\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n13
  luot_2: dung
  nguon: ["https://doi.org/10.1207/s15327752jpa4901_13"]
  trich: "\"a list of 48 self-report items... items from the satisfaction factor that had loadings less than .60 [dropped], and 10 items were left. Because of the high semantic similarity of several of those items, five were dropped\""
  ghi_chu: "Đọc toàn văn. Các câu cảm xúc bị loại trước, rồi loại câu tải thấp, rồi loại câu trùng nghĩa."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n14
  luot_2: dung
  nguon: ["https://doi.org/10.1207/s15327752jpa4901_13"]
  trich: "\"176 undergraduates at the University of Illinois... Two months later, 76 of these students were readministered\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n15
  luot_2: dung
  nguon: ["https://doi.org/10.1207/s15327752jpa4901_13"]
  trich: "\"Sample 1 consisted of the 176 students used in Study 1. Sample 2 ... 163 undergraduates\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n16
  luot_2: dung
  nguon: ["https://doi.org/10.1207/s15327752jpa4901_13"]
  trich: "\"Fifty-three elderly persons... The average age was 75\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n17
  luot_2: dung
  nguon: ["https://doi.org/10.1207/s15327752jpa4901_13"]
  trich: "\"possible range of scores... from 5 (low satisfaction) to 35 (high satisfaction)\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n18
  luot_2: dung
  nguon: ["https://doi.org/10.1207/s15327752jpa4901_13"]
  trich: "Mức 4 = \"neither agree nor disagree\"; 5 câu x 4 = 20 (khoảng 5-35)"
  ghi_chu: "Bài 1985 không dùng chữ \"điểm trung tính\"; 20 là trung điểm suy ra đúng từ thang (Pavot & Diener 1993 gọi 20 là điểm trung tính nhưng không mở được toàn văn bài đó). Câu đúng về số học."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n19
  luot_2: dung
  nguon: ["https://labs.psychology.illinois.edu/~ediener/Documents/Understanding%20SWLS%20Scores.pdf"]
  trich: "\"30 - 35 Very high score... 25-29 High score... 20-24 Average score ... The average of life satisfaction in economically developed nations is in this range... 15-19 Slightly below average... 10-14 Dissatisfied... 5-9 Extremely Dissatisfied\""
  ghi_chu: "Mở tài liệu Diener \"Understanding Scores on the SWLS\". Tài liệu không dán nhãn chẩn đoán; câu \"không phải ngưỡng chẩn đoán\" là diễn giải đúng của site."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n20
  luot_2: dung
  nguon: ["https://doi.org/10.1207/s15327752jpa4901_13"]
  trich: "\"coefficient alpha was .87\""
  ghi_chu: "Đúng (n = 176)."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n21
  luot_2: dung
  nguon: ["https://doi.org/10.1207/s15327752jpa4901_13"]
  trich: "\"The two-month test-retest correlation coefficient was .82\""
  ghi_chu: "Đúng (76 sinh viên)."
