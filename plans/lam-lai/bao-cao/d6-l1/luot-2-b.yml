  id: n53
  luot_2: dung
  nguon: ["https://doi.org/10.3389/fpsyg.2023.1143654", "https://doi.org/10.3389/fpsyg.2020.00158"]
  trich: "Tổng quan 2023: \"the literature on work-related flow interventions is still sparse\"; không thấy thử nghiệm rèn nhân cách tự trị (autotelic)"
  ghi_chu: "Kiểm lại hôm nay (10/11/2026) trên Europe PMC: không thấy nghiên cứu rèn \"nhân cách tự trị\"; câu viết là \"chưa đọc được\" nên đúng. Có nghiên cứu khác (ví dụ chánh niệm tăng flow ở vận động viên) nhưng không nhắm vào nhân cách tự trị."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n84
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525", "https://doi.org/10.1080/17439760.2014.967799", "https://doi.org/10.3389/fpsyg.2020.00158"]
  trich: "Swann: \"alone it is insufficient for these states to occur\"; Abuhamdeh: mô hình bốn góc \"anxiety, apathy, boredom/relaxation\"; Fong: cân bằng thử thách-kỹ năng cùng mục tiêu rõ và cảm giác kiểm soát là các yếu tố đóng góp"
  ghi_chu: "Đọc toàn văn Swann 2018 (bản Leeds Beckett). Cân bằng thấp-thấp là thờ ơ (apathy) theo mô hình bốn góc. Phản hồi tức thì được Csikszentmihalyi đề xuất làm điều kiện (Swann: \"clear goals, unambiguous feedback\")."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n75
  luot_2: qua-manh
  nguon: ["https://doi.org/10.1037/emo0001657", "https://doi.org/10.3389/fpsyg.2020.00158", "https://doi.org/10.1016/j.abrep.2025.100606"]
  trich: "Sweeny 2026: \"a moderately strong, positive relationship between flow and well-being\"; Abuhamdeh 2020: tranh luận flow là liên tục hay rời rạc; có nghiên cứu về flow trong chơi game rối loạn (Behav Addict 2025)"
  cau_dung: "Phân tích tổng hợp (Sweeny 2026, Emotion) thấy flow liên hệ dương, mức vừa đến khá mạnh, với well-being; đây là tương quan. Đã có nghiên cứu về việc flow là liên tục hay rời rạc (Abuhamdeh 2020) và về flow ở hoạt động có hại như game rối loạn hay cờ bạc, nhưng bằng chứng còn ít."
  ghi_chu: "Phần phân tích tổng hợp đúng và đã ghi là tương quan. Phần \"chưa tìm thấy nghiên cứu xét giới hạn của flow liên tục hay flow trong hoạt động có hại\" không đúng: có bài khái niệm về flow liên tục/rời rạc và có nghiên cứu về flow ở game rối loạn và cờ bạc. Chỉ đọc tóm tắt."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n29
  luot_2: dung
  nguon: ["https://doi.org/10.1123/jsep.18.1.17"]
  trich: "\"The nine FSS scales of the 36-item instrument ... each scale is measured by four items... administration of the scale to 394 athletes\""
  ghi_chu: "Đúng; chỉ tóm tắt (OpenAlex)."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n57
  luot_2: dung
  nguon: ["https://doi.org/10.1080/17439760.2014.967799"]
  trich: "\"meta-analysis on 28 studies... Compared to other theorized antecedents, challenge-skill balance was a robust contributor to flow along with clear goals and sense of control\""
  ghi_chu: "Bài đăng năm 2015 (J Positive Psychology, online 2014). Chỉ đọc tóm tắt; \"mạnh\" ở nghĩa mối liên hệ vừa (moderate), tương quan."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n69
  luot_2: dung
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=%28Vietnam*%20AND%20%28%22flow%20state%22%20OR%20%22flow%20experience%22%20OR%20%22dispositional%20flow%22%20OR%20%22Flow%20State%20Scale%22%29%29&pageSize=20&format=json&sort=P_PDATE_D%20desc", "https://doi.org/10.1016/j.actpsy.2026.106580"]
  trich: "Tìm Europe PMC 10/11/2026: Việt Nam + flow; bài Nguyen và cộng sự 2026 (Acta Psychologica): khảo sát 239 sinh viên + phỏng vấn 12 người, \"eight specific Flow dimensions\""
  ghi_chu: "Kiểm lại 10/11/2026: không thấy nghiên cứu flow ESM ở người Việt. Tóm tắt bài 2026 không nêu tên thang (chỉ nói tám chiều flow); câu \"chưa rõ\" đúng. Chưa mở toàn văn."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n41
  luot_2: dung
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525", "https://eprints.leedsbeckett.ac.uk/id/eprint/4768/1/AReviewofScientificProgressinFlowAM-PIGGOTT.pdf"]
  trich: "\"While these necessary conditions are proposed, together they are not sufficient for flow to occur... the sufficient conditions of flow remain unknown\""
  ghi_chu: "Đọc toàn văn Swann và cộng sự 2018 (J Appl Sport Psychol, bản Leeds Beckett). Chính bài viết: \"alone [challenge-skill balance] is insufficient\"."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n31
  luot_2: dung
  nguon: ["https://doi.org/10.1123/jsep.24.2.133"]
  trich: "\"Item modifications were made to the original versions of these scales\""
  ghi_chu: "FSS-2 và DFS-2 là bản sửa của FSS (2002, Jackson & Eklund, JSEP 24). \"Dùng rộng rãi\": Swann 2018 gọi FSS là phương tiện đo flow chính trong thể thao. Chỉ tóm tắt cho Jackson & Eklund."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n52
  luot_2: qua-manh
  nguon: ["https://doi.org/10.1080/10413200.2018.1443525", "https://doi.org/10.3389/fpsyg.2020.00158", "https://doi.org/10.1111/jopy.70004"]
  trich: "Swann 2018: vấn đề về khái niệm chín chiều và FSS-2; Abuhamdeh 2020: 42 nghiên cứu dùng 24 cách vận hành flow; phân tích tổng hợp 2025: 24 nghiên cứu về Big Five và flow (conscientiousness r = 0,33)"
  cau_dung: "Cách đo flow chưa thống nhất (42 nghiên cứu dùng 24 cách vận hành) và bị phê phán ở chỗ chín chiều, nhưng đã có thang dùng rộng rãi (FSS-2, DFS-2); mối liên hệ giữa nét tính cách và flow đã được kiểm tra (24 nghiên cứu về Big Five)."
  ghi_chu: "\"Chưa có cách đo thỏa đáng\" mạnh hơn bằng chứng (cách đo chưa thống nhất và bị phê phán, nhưng FSS-2/DFS-2 có độ tin cậy 0,78-0,92); \"liên hệ các nét với flow hiếm được kiểm tra\" không đúng với Big Five (đã có phân tích tổng hợp). Chỉ tóm tắt cho hai bài sau."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n6
  luot_2: dung
  nguon: ["https://doi.org/10.1123/jsep.18.1.17", "https://doi.org/10.1080/10413200.2018.1443525"]
  trich: "Jackson & Marsh: \"The nine FSS scales ... represent the dimensions of flow discussed by Csikszentmihalyi (1990, 1993)\"; Swann: \"the common conceptualization of flow outlines nine dimensions\""
  ghi_chu: "Không mở được toàn văn cuốn sách; xác nhận gián tiếp qua hai bài, nhất quán với kiến thức chuẩn (chín yếu tố ở chương 3 sách 1990)."
- trang: kham-pha/hanh-phuc/dong-chay-flow
  id: n64
  luot_2: dung
  nguon: ["https://doi.org/10.1080/17439760.2014.967799", "https://doi.org/10.3389/fpsyg.2020.00158"]
  trich: "Fong: cân bằng thử thách-kỹ năng là yếu tố đóng góp vững; Abuhamdeh: mô hình bốn góc"
  ghi_chu: "Câu tự đánh dấu là suy luận. Phần \"người chơi thích đối thủ ngang cơ\" chưa đọc được bài gốc (Abuhamdeh và cộng sự 2015 không có tóm tắt); chấp nhận ở mức suy luận."
