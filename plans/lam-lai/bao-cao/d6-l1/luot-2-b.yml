  id: n26
  luot_2: dung
  nguon: ["https://doi.org/10.1207/s15327752jpa4901_13"]
  trich: "alpha .87; test-retest .82; hội tụ r .47-.75"
  ghi_chu: "Tóm lược hợp lý của kết quả Study 1-2; ổn định ở mức nhóm, mẫu sinh viên."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n27
  luot_2: dung
  nguon: ["https://doi.org/10.1111/j.1467-6494.1993.tb00283.x"]
  trich: "\"136 college students studied over the course of a semester... self- and non-self-report SWB measures... family versus friend informant reports\""
  ghi_chu: "Chỉ đọc tóm tắt (OpenAlex/Wiley); câu đã ghi \"theo tóm tắt\"."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n28
  luot_2: dung
  nguon: ["https://doi.org/10.1111/j.1467-6494.1993.tb00283.x"]
  trich: "\"a single unitary construct underlying the measures... correlated highly with alternative measures... considerable cross-situational consistency and temporal stability\""
  ghi_chu: "Chỉ tóm tắt. Khớp."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n29
  luot_2: dung
  nguon: ["https://doi.org/10.1111/j.1467-6494.1993.tb00283.x"]
  trich: "\"conventional self-report instruments validly measure the SWB construct, and ... alternative, non-self-report measures are useful\""
  ghi_chu: "Chỉ tóm tắt. Khớp."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n30
  luot_2: dung
  nguon: ["https://doi.org/10.1126/science.1103572"]
  trich: "\"these studies usually rely on global reports of happiness or satisfaction with life in general\""
  ghi_chu: "Đọc toàn văn Kahneman 2004. Ý \"không chứa tình huống cụ thể\" là diễn giải: bài nói các nghiên cứu hiếm đo trải nghiệm theo tình huống cụ thể."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n31
  luot_2: dung
  nguon: ["https://doi.org/10.1126/science.1103572"]
  trich: "\"The Day Reconstruction Method (DRM) assesses how people spend their time and how they experience the various activities and settings\""
  ghi_chu: "Tác giả: Kahneman, Krueger, Schkade, Schwarz, Stone, Science 2004."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n32
  luot_2: dung
  nguon: ["https://doi.org/10.1126/science.1103572"]
  trich: "\"convenience sample of 1018 employed women, focusing on the subset of 909 who had worked on the reference day\"; \"short diary of the previous day... episodes... how they felt, using 12 affect descriptors\""
  ghi_chu: "Đúng. 909 là số người có đi làm vào ngày tham chiếu."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n33
  luot_2: dung
  nguon: ["https://doi.org/10.1126/science.1103572"]
  trich: "\"close correspondences between the DRM reports of 909 employed women and established results from experience sampling\"; \"Experience sampling is the gold standard\"; \"imposes less respondent burden\""
  ghi_chu: "Chữ \"chuẩn vàng\" là của chính tác giả (nhưng DRM vẫn tốn 45-75 phút)."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n34
  luot_2: dung
  nguon: ["https://doi.org/10.1126/science.1103572"]
  trich: "Table 1: \"affect ratings of situations, grouped by activity... or by interaction partner\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n35
  luot_2: dung
  nguon: ["https://doi.org/10.1186/s40359-025-03498-y", "https://doi.org/10.1207/s15327752jpa4901_13"]
  trich: "alpha 0,74-0,89 ở hầu hết bản dịch; alpha .87, test-retest .82"
  ghi_chu: "Nhãn Khá vững không cao hơn thước đo mục 4: nhiều nghiên cứu cùng chiều, mẫu chủ yếu phương Tây, chưa có tái lập lớn."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n36
  luot_2: dung
  nguon: ["https://doi.org/10.1207/s15327752jpa4901_13", "https://doi.org/10.1111/j.1467-6494.1993.tb00283.x"]
  trich: "SWLS với các thang khác .47-.75; Sandvik: thang tự đánh giá tương quan cao với cách đo không tự đánh giá"
  ghi_chu: "Khớp."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n37
  luot_2: dung
  nguon: ["https://doi.org/10.1186/s40359-025-03498-y"]
  trich: "\"All studies, except one (Quechua), demonstrated adequate internal consistency (α = 0.74 to 0.89)... Few studies explored other forms of reliability (e.g., test-retest)\""
  ghi_chu: "Đọc tóm tắt Europe PMC (PMC12532450). Câu viết \"hầu hết\" đúng."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n38
  luot_2: dung
  nguon: ["https://doi.org/10.1037/a0032124", "https://doi.org/10.1037/0022-3514.74.2.482", "https://doi.org/10.3390/ijerph19063460"]
  trich: "Thời tiết không ảnh hưởng tin cậy tới hài lòng (n > 1 triệu); nền tảng đánh giá khác nhau giữa văn hóa; bất tương đương theo tuổi ở Việt Nam"
  ghi_chu: "Nhãn Đang tranh cãi thấp hơn Khá vững nên không vượt thước đo; có căn cứ (kết quả mâu thuẫn về ảnh hưởng tâm trạng; so sánh điểm giữa nhóm bất tương đương)."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n39
  luot_2: dung
  nguon: ["https://doi.org/10.1007/s11205-007-9230-3"]
  trich: "\"nationally representative sample in Germany (N = 1053). Neuroticism was a stronger predictor of AWB than CWB. Unemployment and regional differences between the East and West of Germany were stronger predictors of CWB than AWB.\""
  ghi_chu: "Chỉ đọc tóm tắt (Springer)."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n40
  luot_2: qua-manh
  nguon: ["https://doi.org/10.1037/0033-2909.95.3.542", "https://doi.org/10.1037/a0032124"]
  trich: "Schwarz & Clore (qua Diener 1984): thời tiết ảnh hưởng phán đoán; Lucas & Lawless 2013 (> 1 triệu người Mỹ): \"weather does not reliably affect judgments of life satisfaction\""
  cau_dung: "Câu trả lời có thể chịu ảnh hưởng của tâm trạng lúc trả lời (Schwarz & Clore 1983 thấy ảnh hưởng của thời tiết ở mẫu nhỏ, nhưng một mẫu hơn 1 triệu người Mỹ năm 2013 không thấy thời tiết ảnh hưởng đáng tin cậy đến hài lòng cuộc sống)."
  ghi_chu: "Phần \"tâm trạng có thể ảnh hưởng\" có bằng chứng; ví dụ thời tiết viết như chuyện chắc chắn thì quá mạnh vì mẫu rất lớn sau này không tái lập được."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n41
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0022-3514.74.2.482"]
  trich: "\"emotions and life satisfaction correlated significantly more strongly in more individualistic nations (r = .52 in Study 1; r = .48 in Study 2)\""
  ghi_chu: "Đây là tương quan giữa các nước (61 nước, N = 62.446). Chỉ tóm tắt."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n42
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0022-3514.74.2.482", "https://doi.org/10.3390/ijerph19063460"]
  trich: "Suh: nền tảng phán đoán khác giữa văn hóa (cảm xúc vs chuẩn mực); Arrindell: bất tương đương theo tuổi"
  ghi_chu: "Suy luận hợp lý, nằm trong những gì hai bài cho thấy."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n43
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0033-2909.95.3.542"]
  trich: "\"some philosophers maintained that happiness is simply the sum of many small pleasures (bottom-up theory)... the top-down approach assumes that there is a global propensity to experience things in a positive way\""
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n44
  luot_2: dung
  nguon: ["https://doi.org/10.1007/s11205-007-9230-3", "https://doi.org/10.1037/0022-3514.71.3.616"]
  trich: "AWB và CWB là hai thành phần phân biệt (Schimmack 2008; Lucas 1996)"
  ghi_chu: "Câu mang tính giả thuyết (\"có thể\"); phù hợp."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n45
  luot_2: dung
  nguon: ["https://doi.org/10.1126/science.1103572"]
  trich: "\"Life satisfaction is moderately correlated (r = 0.38) with daily 'net affect' (the difference between positive and negative affect)\""
  ghi_chu: "Đúng."
