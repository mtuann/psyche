  id: n48
  luot_2: dung
  nguon: ["https://doi.org/10.1111/j.1467-6494.1993.tb00283.x"]
  trich: "\"principal axis factor analysis of self- and non-self-report SWB measures revealed a single unitary construct\""
  ghi_chu: "Chỉ tóm tắt."
