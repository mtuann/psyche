  luot_2: dung
  nguon: ["https://doi.org/10.1207/s15327752jpa4901_13"]
  trich: "\"Scores on the SWLS correlated .02 with the Marlowe-Crowne measure\""
  ghi_chu: "Đúng (mẫu 2, n = 163)."
