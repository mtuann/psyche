  id: n24
  luot_2: dung
  nguon: ["https://doi.org/10.1207/s15327752jpa4901_13"]
  trich: "Table 2: Cantril .62 và .66"
  ghi_chu: "Đúng."
- trang: kham-pha/hanh-phuc/do-hanh-phuc
  id: n25
  luot_2: dung
  nguon: ["https://doi.org/10.1207/s15327752jpa4901_13"]
  trich: "\"The LSI and the SWLS correlated .46... [SWLS with rater composite] .43\""
  ghi_chu: "Đúng; bài nói LSI là bản sửa của Adams (1969)."
