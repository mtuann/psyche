  id: n46
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0033-2909.95.3.542"]
  trich: "\"there is evidence that momentary mood influences subjects' responses to SWB questions\""
  ghi_chu: "Diener 1984 báo cáo ảnh hưởng này (nhưng không làm méo đáng kể thang nhiều câu). Xem n40 về ví dụ thời tiết."
