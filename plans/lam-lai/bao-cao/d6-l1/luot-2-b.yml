  trich: "Table 2: Gurin .47 (Sample 2), Campbell .75, DPQ .68, Cantril .62/.66, PAS .50/.51, Bradburn-NAS -.37/-.32 (AIM .09)"
  ghi_chu: "Đọc Table 2 trên ảnh trang. Khoảng 0,47-0,75 đúng; AIM (cường độ cảm xúc) .09 không phải thang hạnh phúc chủ quan và bài cũng loại ra."
