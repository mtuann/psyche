  id: n59
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/16720254", "https://europepmc.org/article/MED/11515147"]
  ghi_chu: "Nhãn \"đang tranh cãi\" khó khớp thước đo: không có bằng chứng mâu thuẫn chất lượng cao về chuyện mơ dự báo; không có nguồn mở nào kiểm tra chuyện \"điềm báo\"."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n60
