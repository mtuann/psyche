  id: n61
  luot_2: dung
  nguon: ["https://www.nhs.uk/conditions/insomnia/"]
  trich: "NHS (mất ngủ): gặp bác sĩ khi vấn đề kéo dài và ảnh hưởng sinh hoạt."
  ghi_chu: "Lời khuyên chung; không mở được trang NHS riêng về ác mộng."
