- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n1
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/35404637", "https://europepmc.org/article/MED/20046194", "https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  trich: "Berres & Erdfelder 2021: \"People recall more information after sleep than after an equally long period of wakefulness\"; Diekelmann & Born 2010: SWS and REM \"support system consolidation and synaptic consolidation\"."
  ghi_chu: "Câu mô tả nói \"có thể giúp\", đúng mức."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n2
  luot_2: dung
  nguon: ["https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  trich: "\"Subjects remembered clearly more of the learned vocabulary when they had slept ... than when they had stayed awake (F1,13 = 7.1, P < 0.05)\"; sleep-deprived subjects slept 5.6 h by day and 7.6 h the next night before the 48 h test."
  ghi_chu: "Chỉ 14 người; kết luận \"nhiều khả năng\" là đúng mức."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n3
  luot_2: dung
  nguon: ["https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  trich: "\"During sleep deprivation, subjects were engaged in activities such as watching TV and playing games. Reading was not allowed.\""
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n4
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/20046194"]
  trich: "\"During SWS, slow oscillations, spindles and ripples ... coordinate the re-activation and redistribution of hippocampus-dependent memories to neocortical sites.\""
  ghi_chu: "Chỉ đọc tóm tắt bài tổng quan (toàn văn có tường phí, không mở)."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n5
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Chỉ xác nhận phần định nghĩa: OpenStax Psychology 2e 4.3 nói giai đoạn 3 NREM là \"deep sleep or slow-wave sleep\" với sóng delta, REM có sóng giống lúc thức. Chưa mở được nguồn bậc 1-2 nói SWS tập trung nửa đầu đêm và REM nửa sau."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n6
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/21543596", "https://openstax.org/books/psychology-2e/pages/4-3-stages-of-sleep"]
  trich: "Marzano 2011: dream recall after awakening from both REM and stage 2 NREM."
  ghi_chu: "Câu đã bỏ khỏi trang, không còn khẳng định gì; việc bỏ là đúng vì mơ cũng xảy ra ngoài REM."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n7
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/20046194"]
  trich: "Nature Reviews Neuroscience 2010, vol. 11, no. 2, pp. 114-126, doi 10.1038/nrn2762 (Europe PMC record)."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n8
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/20046194"]
  ghi_chu: "Tóm tắt không nói bài gồm cả người lẫn động vật gặm nhấm; không mở được toàn văn."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n9
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/20046194"]
  trich: "\"SWS and REM sleep support system consolidation and synaptic consolidation, respectively\"; REM \"might favour the subsequent synaptic consolidation of memories in the cortex\"."
  ghi_chu: "Từ \"subsequent\" ủng hộ thứ tự nối tiếp; chỉ đọc tóm tắt."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n10
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/20046194"]
  trich: "\"slow oscillations, spindles and ripples ... coordinate the re-activation and redistribution of hippocampus-dependent memories to neocortical sites\""
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n11
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/20046194"]
  trich: "\"at minimum cholinergic activity\" (trong SWS)."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n12
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/20046194"]
  ghi_chu: "Tóm tắt không nói việc tái phân phối \"chưa được chứng minh trực tiếp\"; không mở được toàn văn để xác nhận lời lưu ý này."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n13
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/20046194"]
  trich: "\"during REM sleep, local increases in plasticity-related immediate-early gene activity - at high cholinergic and theta activity - might favour the subsequent synaptic consolidation of memories in the cortex\""
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n14
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/20046194", "https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  trich: "Gais 2006 dẫn McClelland 1995 (hệ học bù trừ hồi hải mã - vỏ não); Diekelmann & Born: tái phân phối ký ức phụ thuộc hồi hải mã sang vỏ não."
  ghi_chu: "Mô tả mô hình hai kho đúng theo văn liệu; \"hồi hải mã học nhanh, vỏ não học chậm\" là phần chuẩn của mô hình, không có ở tóm tắt."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n15
  luot_2: dung
  nguon: ["https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  trich: "\"Twelve American high school students ... Subjects were native English speakers with no prior knowledge of German.\""
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n16
  luot_2: dung
  nguon: ["https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  trich: "\"four 24-pair English-German vocabulary lists ... time limit of 10 min to learn the whole list.\""
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n17
  luot_2: dung
  nguon: ["https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  trich: "\"Twelve American high school students (age 17.4 ± 0.2 yr, 6 male) participated in all four conditions in a within-subject design.\""
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n18
  luot_2: dung
  nguon: ["https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  trich: "Bảng 1: học buổi tối, khoảng cách tới giấc ngủ 3 h; học buổi sáng, 15 h; khoảng giữ 24 h hoặc 36 h."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n19
  luot_2: dung
  nguon: ["https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  trich: "\"Fourteen male high school students (age 18.1 ± 0.2 yr) were tested twice in randomized, counterbalanced order.\""
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n20
  luot_2: dung
  nguon: ["https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  trich: "\"Reading was not allowed in order to prevent possible interference in the declarative memory system.\""
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n21
  luot_2: dung
  nguon: ["https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  trich: "\"slept on average for 5.6 ± 0.6 h during daytime and for another 7.6 ± 0.6 h during the following night.\""
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n22
  luot_2: dung
  nguon: ["https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  trich: "\"Recall testing took place in both conditions 48 h after initial learning\"; \"fatigue accumulating during wake intervals could be ruled out as a confound\" (tóm tắt)."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n23
  luot_2: dung
  nguon: ["https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  trich: "\"a much higher rate of forgetting in morning-learning conditions than in evening-learning conditions (F1,11 = 9.8, P < 0.01)\"; 24 h vs 36 h: F1,11 = 0.2, P = 0.65."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n24
  luot_2: dung
  nguon: ["https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  trich: "Bảng 1B: thay đổi sau 48 h là -0,2 ± 0,6 (ngủ) và -1,8 ± 0,6 từ (thức trắng)."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n25
  luot_2: dung
  nguon: ["https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  trich: "\"Sleep deprivation has a detrimental effect on memory, which was significant after a night of recovery sleep. Thus, fatigue ... could be ruled out as a confound.\""
  ghi_chu: "Phần \"chứ không chỉ ở lúc truy xuất\" là cách diễn giải của trang, phù hợp lập luận của các tác giả về \"consolidation\"."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n26
  luot_2: dung
  nguon: ["https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  trich: "Thí nghiệm 1: 12 người; thí nghiệm 2: 14 người; \"only a small number of items had to be encoded\"."
  ghi_chu: "Tác giả nêu số từ ít là một điểm cần lưu ý; \"giới hạn\" về cỡ mẫu là nhận xét của trang, hợp lý."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n27
  luot_2: dung
  nguon: ["https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  trich: "\"In humans, these studies concentrated mainly on procedural types of memory, which are considered to be hippocampus-independent. Here, we show that sleep also has a persisting effect on hippocampus-dependent declarative memory.\""
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n28
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/16741280"]
  trich: "Learn Mem 2006, 13(3):259-262, doi 10.1101/lm.132106."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n29
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/17347444"]
  ghi_chu: "Tóm tắt xác nhận: mùi có lúc học được nhắc lại trong SWS, thí nghiệm fMRI. Chưa mở được toàn văn nên không xác nhận được 15 cặp thẻ, lưới hai chiều, mùi hoa hồng, \"hai giai đoạn SWS đầu\"."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n30
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/17347444"]
  ghi_chu: "Không mở được toàn văn (Science có tường phí): không xác nhận được thiết kế bắt chéo, mù đôi, đêm đối chứng không mùi."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n31
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/17347444"]
  ghi_chu: "Không mở được toàn văn: không xác nhận được cỡ mẫu 18 và tỉ lệ 97% so với 86%."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n32
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/17347444"]
  ghi_chu: "Tóm tắt xác nhận: mùi \"ineffective during REM sleep or wakefulness or when the odor had been omitted during prior learning\" (và không có tác dụng ở trí nhớ quy trình). Cỡ mẫu 17-18 người mỗi thí nghiệm không xác nhận được vì chưa mở toàn văn."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n33
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/17347444"]
  trich: "\"functional magnetic resonance imaging revealed significant hippocampal activation in response to odor re-exposure during SWS.\""
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n34
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/17347444"]
  ghi_chu: "Tóm tắt xác nhận: \"showed that reactivation indeed causes memory consolidation during sleep\". Cỡ mẫu 17-18 người mỗi thí nghiệm chưa xác nhận được (không mở được toàn văn)."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n35
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/17347444"]
  trich: "Science 2007, 315(5817):1426-1429, doi 10.1126/science.1138581 (Europe PMC record)."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n36
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/35404637", "https://europepmc.org/article/MED/32027149", "https://europepmc.org/article/MED/20046194"]
  trich: "Berres: g = 0,44 (0,28 sau hiệu chỉnh); Hu: nhắc ký ức trong SWS g = 0,27."
  ghi_chu: "Khung \"khá vững\" hợp thước đo: nhiều bằng chứng cùng chiều, hiệu ứng giảm khi hiệu chỉnh thiên lệch, chưa có tái lập lớn đăng ký trước."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n37
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/35404637"]
  trich: "\"823 effect sizes from 271 independent samples ... moderate overall sleep benefit in episodic memory (g = 0.44) ... reduced but still significant (g = 0.28)\""
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n38
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/32027149"]
  trich: "\"91 experiments ... slow-wave sleep: Hedges' g = 0.27, 95% CI [0.20, 0.35]. In contrast, TMR was not effective during REM sleep nor during wakefulness.\""
  ghi_chu: "Bài còn thấy hiệu ứng ở giai đoạn 2 NREM (g = 0,32); câu của trang không sai."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n39
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/18836440", "https://europepmc.org/article/MED/20046194", "https://europepmc.org/article/MED/32027149"]
  trich: "Rasch 2009: ức chế REM bằng thuốc không làm hại trí nhớ kỹ năng; Hu 2020: nhắc ký ức trong REM không có tác dụng."
  ghi_chu: "Bằng chứng không nhất quán nên \"đang tranh cãi\" hợp thước đo."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n40
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/18836440"]
  ghi_chu: "Nửa đầu đúng: \"REM sleep suppression ... did not impair consolidation of skills or word-pairs ... but rather enhanced gains in finger tapping accuracy\" (ở nam khỏe mạnh). Nửa sau (bài tổng quan lưu ý thuốc có thể tác động trực tiếp lên tính dẻo synap) không xác nhận được vì không mở được toàn văn Diekelmann & Born."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n41
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/20046194"]
  ghi_chu: "Tóm tắt Diekelmann & Born không nói gì về trí nhớ cảm xúc; không mở được toàn văn."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n42
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/35404637", "https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  trich: "Berres: người ngủ nhớ nhiều hơn người thức cùng khoảng thời gian; Gais: thức trắng kém hơn kể cả sau ngủ bù."
  ghi_chu: "Khung \"bác bỏ\" cho ý \"thức trắng thay ngủ giúp nhớ tốt hơn\" hợp lý: hiệu ứng ngủ có ở 271 mẫu, ngược chiều ý đó."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n43
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/35404637"]
  trich: "\"People recall more information after sleep than after an equally long period of wakefulness.\""
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n44
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/20046194"]
  trich: "\"slow oscillations, spindles and ripples\" phối hợp tái kích hoạt và tái phân phối."
  ghi_chu: "Chi tiết \"thoi ngủ giúp vỏ não sẵn sàng tiếp nhận\" là cách diễn đạt của trang, không có ở tóm tắt; ý chung đúng."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n45
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/20046194", "https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf"]
  ghi_chu: "Gais có nhắc giả thuyết ít nhiễu khi ngủ, nhưng ý \"mô hình hai kho: chuyển dần qua nhiều lần tái kích hoạt, tránh ghi đè\" không xác nhận được khi chưa mở toàn văn bài tổng quan."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n46
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/20046194"]
  trich: "REM: gen tính dẻo tăng cục bộ, acetylcholine và theta cao, \"might favour\" củng cố synap ở vỏ não."
  ghi_chu: "Phần \"còn nhiều tranh luận\" khớp với ngôn ngữ giả thuyết (\"might\") và bằng chứng của Rasch 2009."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n47
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/24411729"]
  trich: "\"During sleep, spontaneous activity renormalizes net synaptic strength ... decreases signal-to-noise ratios [during waking]\"; \"Activity-dependent down-selection of synapses\"."
  ghi_chu: "Mô tả giả thuyết SHY đúng; chi tiết \"sóng chậm\" là diễn giải chuẩn của Tononi & Cirelli."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n48
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/20046194", "https://europepmc.org/article/MED/24411729"]
  ghi_chu: "Chưa mở được toàn văn Diekelmann & Born nên không xác nhận được bài xem hai giả thuyết là không loại trừ nhau."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n49
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/20046194"]
  trich: "Tổng hợp: giấc ngủ \"optimizes the consolidation of newly acquired information in memory\"."
  ghi_chu: "Câu hình ảnh tổng kết của trang, không phải số liệu."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n50
  luot_2: dung
