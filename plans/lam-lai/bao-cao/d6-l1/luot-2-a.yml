  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/18836440", "https://europepmc.org/article/MED/20046194"]
  trich: "Rasch 2009: ức chế REM không làm hại trí nhớ kỹ năng; Diekelmann & Born: REM \"might favour\" củng cố synap."
