  trich: "Gais: ngủ ngay sau học tốt hơn; Cepeda 2006: hiệu ứng học rải trong 317 thí nghiệm; Berres: lợi ích lớn hơn khi học nhiều lần."
  ghi_chu: "Lời khuyên hợp lý, nói \"chưa thấy bằng chứng có lợi\" cho thức trắng."
- trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
  id: n70
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Không được xem trang để đối chiếu từng mục nguồn. Đã kiểm riêng: Diekelmann & Born (11, 114-126), Gais (13, 259-262), Rasch 2007 (315, 1426-1429), Berres (147, 1309-1353), Hu (146, 218-244; doi 10.1037/bul0000223), Rasch 2009 (Nat Neurosci 12, 396-397), Ataei (Sleep Med Rev 72, 101852), Züst (Curr Biol 29, 541-553; doi 10.1016/j.cub.2018.12.038), Le (Front Psychol 17, 1848504) đều có thật và khớp tên bài."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n1
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/18625542", "https://cdn.vanderbilt.edu/t2-my/my-prd/wp-content/uploads/sites/2804/2018/05/Forsythe-Compas-1987.pdf", "https://arxiv.org/abs/2501.05185"]
  trich: "Kendall & Terry: \"If an event is relatively uncontrollable, then emotion-focused ... coping may be more effective than problem-focused coping. In contrast, a controllable event may be best managed through problem-focused coping.\""
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n2
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/18625542", "https://doi.org/10.1080/00049539208260155", "https://doi.org/10.1207/s15324796abm2303_3", "https://doi.org/10.1177/1745691613504116", "https://doi.org/10.1037/a0037913"]
  trich: "Kết quả kiểm chứng khớp nhau lẫn lộn (Forsythe, Zakowski ủng hộ một phần; Conway, Kendall không); Bonanno & Burton, Cheng ủng hộ hướng linh hoạt."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n4
  luot_2: dung
  nguon: ["https://doi.org/10.1177/1745691613504116"]
  trich: "\"researchers have tended to assume that particular regulatory strategies are consistently beneficial or maladaptive. We label this assumption the fallacy of uniform efficacy.\""
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n5
  luot_2: khong-chac
  nguon: ["https://cdn.vanderbilt.edu/t2-my/my-prd/wp-content/uploads/sites/2804/2018/05/Forsythe-Compas-1987.pdf"]
  ghi_chu: "Mô tả tình huống minh họa tự dựng của trang, không có nguồn để kiểm; mô tả \"lệch pha\" đúng với định nghĩa giả thuyết (Forsythe & Compas)."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n6
  luot_2: dung
  nguon: ["https://cdn.vanderbilt.edu/t2-my/my-prd/wp-content/uploads/sites/2804/2018/05/Forsythe-Compas-1987.pdf", "https://europepmc.org/article/MED/18625542"]
  trich: "Forsythe & Compas: triệu chứng cao khi lệch pha giữa đánh giá và đối phó (ví dụ cố thay đổi trực tiếp một sự kiện được cho là không kiểm soát được)."
  ghi_chu: "Câu có \"có thể\" và \"theo giả thuyết\": đúng mức."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n7
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0022-3514.50.3.571", "https://europepmc.org/article/MED/18625542"]
  trich: "Folkman 1986: đánh giá thứ cấp \"highly variable\" giữa các tình huống; Kendall & Terry: kiểm soát cảm nhận khác nhau theo tình huống."
  ghi_chu: "Phần chăm sóc giảm nhẹ là nhận xét thực hành của trang."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n8
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/18625542", "https://doi.org/10.1207/s15324796abm2303_3", "https://doi.org/10.1080/00049539208260155", "https://cdn.vanderbilt.edu/t2-my/my-prd/wp-content/uploads/sites/2804/2018/05/Forsythe-Compas-1987.pdf"]
  trich: "Bằng chứng kiểm chứng giả thuyết khớp nhau không nhất quán."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n9
  luot_2: dung
  nguon: ["https://arxiv.org/abs/2501.05185"]
  trich: "Lazarus & Folkman (1984): các định nghĩa stress cũ \"fail to explain the discrepancies in response between persons to the same stimulus (p.19)\"."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n10
  luot_2: dung
  nguon: ["https://arxiv.org/abs/2501.05185"]
  trich: "Cognitive appraisal: \"the process by which a person determines whether a relationship is stressful or not (p.19)\"."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n11
  luot_2: dung
  nguon: ["https://arxiv.org/abs/2501.05185"]
  trich: "\"primary appraisal and secondary appraisal (p.31), which cannot be considered as separate (p.43)\""
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n12
  luot_2: dung
  nguon: ["https://arxiv.org/abs/2501.05185"]
  trich: "Primary appraisal: \"whether a particular stimulus is beneficial, irrelevant or stressful (p.32)\"."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n13
  luot_2: khong-chac
  nguon: ["https://arxiv.org/abs/2501.05185"]
  ghi_chu: "Bản mở xác nhận secondary appraisal là đánh giá các chiến lược đối phó sẵn có (p.35); danh sách bốn lựa chọn (thay đổi, chấp nhận, tìm thông tin, kìm lại) chưa xác nhận được vì không mở sách gốc."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n14
  luot_2: dung
  nguon: ["https://arxiv.org/abs/2501.05185"]
  trich: "\"constantly changing cognitive and behavioral efforts to manage specific external and/or internal demands that are appraised as taxing or exceeding the resources of the person\" (p.141)."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n15
  luot_2: dung
  nguon: ["https://arxiv.org/abs/2501.05185"]
  trich: "\"emotion-focused coping efforts are meant to regulate emotions, whereas problem-focused coping efforts are meant to resolve the situation itself (p.150)\"."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n16
  luot_2: dung
  nguon: ["https://arxiv.org/abs/2501.05185"]
  trich: "Problem-focused: nhằm giải quyết chính tình huống (p.150)."
  ghi_chu: "Các ví dụ cụ thể là của trang, hợp với định nghĩa."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n17
  luot_2: dung
  nguon: ["https://arxiv.org/abs/2501.05185", "https://doi.org/10.1037/0022-3514.50.5.992", "https://europepmc.org/article/MED/12462958"]
  trich: "Emotion-focused: điều chỉnh cảm xúc (p.150)."
  ghi_chu: "Lưu ý: tìm hỗ trợ xã hội thường được xếp lẫn (Folkman 1986 và Penley 2002 xét nó là một dạng riêng); ví dụ \"tìm sự hỗ trợ\" đúng khi là hỗ trợ cảm xúc."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n18
  luot_2: dung
  nguon: ["https://arxiv.org/abs/2501.05185"]
  trich: "Dynamics of coping: \"a function of the continuous appraisals of the evolving person-environment relationship\" (p.142)."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n19
  luot_2: dung
  nguon: ["https://arxiv.org/abs/2501.05185"]
  trich: "Đối phó là quá trình theo đánh giá liên tục (p.142); đánh giá lại là một phần của mô hình."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n20
  luot_2: dung
  nguon: ["https://arxiv.org/abs/2501.05185", "https://doi.org/10.1037/0022-3514.50.5.992"]
  trich: "\"constantly changing\"; Folkman 1986: \"the forms of coping that were used varied depending on what was at stake and the options for coping\"."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n21
  luot_2: dung
  nguon: ["https://doi.org/10.1017/s0141347300015019"]
  trich: "Stress, Appraisal and Coping, New York: Springer, 1984 (Crossref)."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n22
  luot_2: qua-manh
  nguon: ["https://arxiv.org/abs/2501.05185"]
  ghi_chu: "Định nghĩa gốc: \"endangering his or her well-being\" (p.19), tức an sinh, không phải \"sức khỏe tinh thần\"."
  cau_dung: "Stress là một mối quan hệ riêng giữa người và môi trường, mối quan hệ mà người ấy đánh giá là vượt quá nguồn lực của mình và đe dọa an sinh (well-being) của mình; không nằm riêng ở môi trường hay ở con người."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n23
  luot_2: dung
  nguon: ["https://arxiv.org/abs/2501.05185", "https://doi.org/10.1177/1745691613504116", "https://doi.org/10.1037/a0037913"]
  trich: "Ba ý: đánh giá là khâu trung gian (p.19, 31); đối phó là quá trình (p.141-142); bối cảnh quan trọng (Bonanno & Burton 2013; Cheng 2014)."
  ghi_chu: "Nhận xét tổng kết của trang; \"vẫn còn được dùng\" hợp lý."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n24
  luot_2: dung
  nguon: ["https://doi.org/10.1037/0022-3514.54.3.466"]
  trich: "\"theory and research have traditionally emphasized the effects of emotion on coping. The present research addresses this imbalance by evaluating the extent to which coping mediated emotions\""
  ghi_chu: "Phần \"hai chiều\" suy ra từ cả hai hướng ảnh hưởng; chỉ đọc tóm tắt."
- trang: kham-pha/cang-thang-giac-ngu/doi-pho-stress
  id: n25
