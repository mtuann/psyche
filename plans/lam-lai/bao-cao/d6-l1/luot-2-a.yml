  id: n2
  luot_2: dung
  nguon: ["https://openstax.org/books/psychology-2e/pages/4-3-stages-of-sleep"]
  trich: "\"The brain waves associated with this stage of sleep are very similar to those observed when a person is awake ... this is the period of sleep in which dreaming occurs ... paralysis of muscle systems in the body with the exception of those that make circulation and respiration possible.\""
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n3
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/21543596", "https://europepmc.org/article/MED/11515144"]
  trich: "Marzano: nhớ mơ sau khi thức từ giấc ngủ NREM giai đoạn 2; Solms: mơ có thể được khơi lên trong giấc ngủ không REM."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n4
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/11515147", "https://europepmc.org/article/MED/11515144"]
  trich: "Revonsuo: chức năng của mơ; Solms: nguồn gốc/cơ chế của mơ."
  ghi_chu: "Câu định nghĩa cách chia câu hỏi, phù hợp văn liệu."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n5
  luot_2: dung
  nguon: ["https://www.gutenberg.org/ebooks/66048"]
  trich: "\"the content of the dream is thus the fulfilment of a wish\"; \"That the dream actually has a secret meaning, which turns out to be the fulfilment of a wish\" (Brill 1913)."
  ghi_chu: "Con số \"120 năm\" là sách xuất bản 1900 (nay 126 năm); chia phe được Hobson & McCarley 1977 ghi nhận."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n6
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1176.zip/10.1176%252Fajp.134.12.1335.pdf"]
  trich: "\"the activated forebrain synthesizes the dream by fitting experiential data to information endogenously and automatically generated by ... neurons in the pontine brainstem\"; \"partially random and partially specific\"."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n7
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/11515147"]
  trich: "\"I put forward the hypothesis that the biological function of dreaming is to simulate threatening events, and to rehearse threat perception and threat avoidance.\""
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n9
  luot_2: dung
  nguon: ["https://www.gutenberg.org/ebooks/66048"]
  trich: "Brill dịch: Freud chọn \"between my own dreams and those of my patients\"; \"the dream is the fulfilment of a wish\"."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n10
  luot_2: dung
  nguon: ["https://www.gutenberg.org/ebooks/66048"]
  trich: "\"Let us contrast the manifest and the latent dream content\"; \"discover a latent dream content which far surpasses the manifest\"."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n11
  luot_2: dung
  nguon: ["https://www.gutenberg.org/ebooks/66048"]
  trich: "Chương VI \"The Dream-Work\": mục \"The Condensation Work\"; dịch chuyển (displacement) trong chương này."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n12
  luot_2: dung
  nguon: ["https://www.gutenberg.org/ebooks/66048"]
  trich: "\"the interpretation of dreams is the via regia to a knowledge of the unconscious activities of the mind\""
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n13
  luot_2: khong-chac
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1176.zip/10.1176%252Fajp.134.12.1335.pdf"]
  ghi_chu: "Hobson & McCarley bác tính cần thiết của kiểm duyệt/ngụy trang, nhưng chưa mở được nguồn bậc 1-2 xác nhận cụ thể \"khó tái lập\" hoặc \"hai nhà phân tâm giải ra hai nghĩa\"."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n14
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/11515147"]
  trich: "\"dream content is consistently and powerfully modulated by certain types of waking experiences\" (Revonsuo 2000)."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n15
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1176.zip/10.1176%252Fajp.134.12.1335.pdf"]
  trich: "Bài trình bày tổng hợp các thí nghiệm trên mèo (ghi từng nơron) và dữ liệu tâm sinh lý; không có thí nghiệm mới trên mẫu người."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n16
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1176.zip/10.1176%252Fajp.134.12.1335.pdf"]
  trich: "\"pontine brainstem\"; \"periodicity and automaticity of forebrain activation\"; \"shifts in transmitter ratios, possibly accounting for dream amnesia\"."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n17
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1176.zip/10.1176%252Fajp.134.12.1335.pdf"]
  trich: "Bài viết \"does not deny meaning to dreams\" nhưng cho rằng nguồn gốc nằm ở quá trình sinh lý, \"not in disguised wishes\"."
  ghi_chu: "Câu của trang ghi \"theo cách đọc phổ biến\", không gán cho các tác giả; đúng như vậy."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n18
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/11515144"]
  trich: "Solms 2000: \"Recent neuropsychological, radiological, and pharmacological findings\"; mơ bị xóa bởi tổn thương khu trú ở não trước."
  ghi_chu: "Sách 1997 không mở được; chỉ đối chiếu bài 2000."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n19
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/11515144", "https://europepmc.org/article/MED/24549103"]
  trich: "Solms: \"dreaming is obliterated by focal lesions along a specific (probably dopaminergic) forebrain pathway, and these lesions do not have any appreciable effects on REM frequency, duration, and density\"; Eichenlaub: tổn thương TPJ hoặc chất trắng MPFC gây mất báo cáo mơ."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n20
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/11515144", "https://europepmc.org/article/MED/11515143"]
  trich: "Solms: mơ \"can also be activated by a variety of nonREM triggers\"; Hobson 2000 trong cùng số BBS bàn lại tranh luận REM-NREM."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n21
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/11515147"]
  trich: "Revonsuo 2000: giả thuyết mô phỏng đe dọa."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n22
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/15766897"]
  trich: "\"analysing the content of dream reports from severely traumatized and less traumatized Kurdish children and ordinary, non-traumatized Finnish children\"; Dream Threat Scale (Valli 2009)."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n23
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/15766897"]
  trich: "\"The severely traumatized children reported a significantly greater number of dreams and their dreams included a higher number of threatening dream events. The dream threats ... were also more severe.\" \"Our results give support for most of the predictions drawn from TST.\""
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n24
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/16720254"]
  trich: "\"212 recurrent dreams ... Six of the eight hypotheses tested were supported ... 66% ... contained one or more threats ... mixed support\""
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n25
  luot_2: dung
  nguon: ["https://doi.org/10.2307/27784372", "https://europepmc.org/article/MED/16720254"]
  trich: "Valli & Revonsuo 2009: \"the TST's strengths seem to outweigh its weaknesses\"; Zadra: hỗn hợp."
  ghi_chu: "Chỗ \"chưa thấy thí nghiệm\" là nhận xét của trang, khớp với việc các nghiên cứu đã đọc chỉ phân tích nội dung mơ."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n26
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/21543596"]
  ghi_chu: "Tóm tắt xác nhận thiết kế đánh thức buổi sáng từ REM và NREM giai đoạn 2; chưa mở được toàn văn nên không xác nhận được 65 sinh viên (35 nam, 30 nữ)."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n27
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/21543596"]
  trich: "\"after morning awakening from REM sleep, a higher frontal 5-7 Hz (theta) activity was associated with successful dream recall ... after awakening from stage 2 NREM sleep ... a lower 8-12 Hz (alpha) oscillatory activity of the right temporal area\"."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n28
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/21543596"]
  trich: "\"These findings provide the first evidence of univocal cortical electroencephalographic correlates of dream recall, suggesting that the neurophysiological mechanisms underlying the encoding and recall of episodic memories may remain the same across different states of consciousness.\""
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n29
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/24549103"]
  ghi_chu: "Tóm tắt xác nhận: người nhớ mơ nhiều 5,2 ± 1,4 lần/tuần, người nhớ ít 0,5 ± 0,3; PET H2(15)O; lúc thức và lúc ngủ. Chưa mở được toàn văn (có tường phí) nên không xác nhận được 41 người, 21/20, toàn nam."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n30
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/24549103"]
  trich: "\"High recallers ... showed higher rCBF in the TPJ during REM sleep, N3, and wakefulness, and in the MPFC during REM sleep and wakefulness.\""
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n31
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/24549103", "https://europepmc.org/article/MED/23283685"]
  trich: "PET: Neuropsychopharmacology 2014, 39(7):1594-1602, doi 10.1038/npp.2014.6; \"Brain reactivity ...\": Cerebral Cortex 2014, 24(5):1206-1215."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n32
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/23283685"]
  trich: "\"subjects with high (HR, N = 18) and low (LR, N = 18) DRF ... Brain responses to first names dramatically differed between the 2 groups during both sleep and wakefulness.\""
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n33
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/28377708"]
  trich: "\"HR showed more arousing stimuli and more long awakenings ... the minimum necessary duration of an awakening during sleep for a successful encoding of dreams into long-term memory is approximately 2 min.\""
  ghi_chu: "Bài Vallat 2017 là Front Hum Neurosci 11:132."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n34
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/24171230"]
  trich: "\"lucid dreaming ... has been verified for 5 selected subjects who signaled that they knew they were dreaming while continuing to dream during unequivocal REM sleep.\""
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n35
  luot_2: dung
  nguon: ["https://openstax.org/books/psychology-2e/pages/4-3-stages-of-sleep", "https://europepmc.org/article/MED/24171230"]
  trich: "OpenStax: REM = chuyển động mắt nhanh và liệt cơ trừ tuần hoàn/hô hấp; LaBerge: tín hiệu là hành động trong mơ có \"observable concomitants\"."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n36
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/24816141"]
  ghi_chu: "Tóm tắt Voss xác nhận kích thích gamma thấp trong REM (25, 40 Hz) gây nhận thức bản thân trong mơ; chưa mở được toàn văn nên không xác nhận được 27 người, tuổi 18-26, chưa từng mơ tỉnh."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n37
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/24816141"]
  ghi_chu: "Không mở được toàn văn: không xác nhận được quy trình 2 phút REM, tACS 30 giây ở bảy tần số hoặc giả."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n38
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/24816141"]
  ghi_chu: "Tóm tắt xác nhận chỉ 25 và 40 Hz hiệu quả; các con số 58% và 77% (và cỡ mẫu 27) chưa xác nhận được vì không mở toàn văn."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n39
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/24816141"]
  ghi_chu: "Không mở được toàn văn nên không xác nhận được thang LuCiD; lời cảnh báo không tự kích thích điện tại nhà là hợp lý nhưng không có nguồn mở để dẫn."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n40
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/27337287"]
  trich: "\"34 studies yielded a mean estimate of 55%, 95% C.I. [49%, 62%] ... 25 studies yielded a mean estimate of 23%, 95% C.I. [20%, 25%]\""
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n41
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/11515144", "https://europepmc.org/article/MED/21543596", "https://openstax.org/books/psychology-2e/pages/4-3-stages-of-sleep"]
  trich: "Solms: \"dreaming and REM sleep are dissociable states\"; Marzano: nhớ mơ sau NREM giai đoạn 2."
  ghi_chu: "Khá vững hợp thước đo."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n42
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/24171230", "https://europepmc.org/article/MED/27337287", "https://europepmc.org/article/MED/24816141"]
  trich: "LaBerge 1981 (5 người, tín hiệu trong REM); Saunders 2016 (nhiều nghiên cứu về tỉ lệ)."
  ghi_chu: "Khá vững hợp thước đo (chủ yếu mẫu nhỏ trong phòng thí nghiệm)."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n43
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/16720254", "https://europepmc.org/article/MED/15766897", "https://europepmc.org/article/MED/11515147"]
  trich: "Zadra: 66% giấc mơ lặp lại có mối đe dọa; Valli 2005; Revonsuo 2000."
  ghi_chu: "Khá vững hợp thước đo."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n44
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/28377708", "https://europepmc.org/article/MED/21543596", "https://europepmc.org/article/MED/23283685"]
  trich: "Vallat: thức giấc đủ lâu (~2 phút); Marzano: điện não; Eichenlaub."
  ghi_chu: "Khá vững hợp thước đo."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n45
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/16720254", "https://doi.org/10.2307/27784372", "https://europepmc.org/article/MED/11515147"]
  trich: "Zadra: \"mixed support\"; Valli & Revonsuo: \"strengths outweigh weaknesses\"."
  ghi_chu: "Đang tranh cãi hợp thước đo."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n46
  luot_2: qua-manh
  nguon: ["https://www.gutenberg.org/ebooks/66048", "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=ABSTRACT%3A%22dream*%22%20AND%20ABSTRACT%3A%22Vietnam*%22&format=json"]
  ghi_chu: "Thước đo mục 4: \"Đã bị bác bỏ\" cần các kiểm tra đủ mạnh liên tục thất bại, mà chính trang (n47) nói chưa tìm thấy nghiên cứu kiểm chứng; chỉ là thiếu bằng chứng ủng hộ và có lập luận ngược (nội dung mơ phụ thuộc trải nghiệm cá nhân, Revonsuo)."
  cau_dung: "Chưa có bằng chứng ủng hộ ý \"mỗi biểu tượng có một nghĩa cố định\" và chưa có kiểm chứng trực tiếp; nên diễn đạt là \"chưa có bằng chứng\" thay cho \"đã bị bác bỏ\"."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n47
  luot_2: dung
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=ABSTRACT%3A%22dream*%22%20AND%20ABSTRACT%3A%22Vietnam*%22&format=json"]
  trich: "Tìm Europe PMC ngày 10/11/2026: không có nghiên cứu kiểm chứng giải mộng theo biểu tượng; kết quả là PTSD cựu binh Việt Nam hay chuyện khác."
  ghi_chu: "Tìm kiếm có giới hạn."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n48
  luot_2: khong-chac
  nguon: ["https://www.gutenberg.org/ebooks/66048", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1176.zip/10.1176%252Fajp.134.12.1335.pdf"]
  ghi_chu: "Phần điểm mạnh (xem mơ nghiêm túc) đúng theo Freud; phần \"khó kiểm chứng, khó tái lập\" chưa có nguồn bậc 1-2 mở được."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n49
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/11515144", "https://europepmc.org/article/MED/11515147"]
  trich: "Solms: mơ do cơ chế não trước; Revonsuo: nội dung mơ có tổ chức và chọn lọc (\"organized and selective\"); Hobson 2000 phản biện trong cùng số BBS."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n50
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/16720254", "https://doi.org/10.2307/27784372"]
  trich: "Zadra: bằng chứng hỗn hợp; Valli & Revonsuo 2009: ủng hộ mạnh hơn yếu."
  ghi_chu: "Chỗ \"chưa thấy thí nghiệm chức năng\" là nhận xét của trang, hợp với các bài đã đọc."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n51
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1176.zip/10.1176%252Fajp.134.12.1335.pdf", "https://europepmc.org/article/MED/21543596", "https://europepmc.org/article/MED/28377708"]
  trich: "Hobson & McCarley: tỉ lệ chất dẫn truyền và \"state-dependent amnesia\"; Marzano: theta trán; Vallat: ~2 phút."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n52
  luot_2: khong-chac
  nguon: ["https://europepmc.org/article/MED/24816141"]
  ghi_chu: "Chưa mở được toàn văn nên không xác nhận được chi tiết (27 người, thang tự đánh giá). Tóm tắt chỉ xác nhận gamma ở khoảng 25 và 40 Hz liên quan nhận thức trong mơ."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n53
  luot_2: qua-manh
  nguon: ["https://europepmc.org/article/MED/28377708", "https://europepmc.org/article/MED/21543596"]
  ghi_chu: "Các bài chỉ cho thấy nhớ mơ liên quan đến lần thức giấc đủ lâu và hoạt động điện não; chưa có nghiên cứu nào đã mở kiểm tra riêng việc ghi lại ngay sau khi tỉnh giúp nhớ hơn, nên nhãn \"khá vững\" cho lời khuyên này cao hơn thước đo."
  cau_dung: "Nhớ mơ liên quan đến tỉnh giấc đủ lâu (khoảng 2 phút theo Vallat 2017) và hoạt động điện não (Marzano 2011); ghi lại ngay sau khi tỉnh là lời khuyên hợp lý nhưng chưa được thí nghiệm kiểm tra trực tiếp."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n54
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/28377708"]
  trich: "Cơ sở gián tiếp: thức giấc dài giúp mã hóa mơ vào trí nhớ."
  ghi_chu: "Lời khuyên thực hành không có rủi ro; không có thí nghiệm trực tiếp."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n55
  luot_2: qua-manh
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=ABSTRACT%3A%22dream*%22%20AND%20ABSTRACT%3A%22Vietnam*%22&format=json", "https://europepmc.org/article/MED/11515147"]
  ghi_chu: "Cùng lý do n46: nhãn \"bác bỏ\" cần các kiểm tra liên tục thất bại, ở đây chưa có kiểm tra nào; lời khuyên không tra sách để đoán điềm là hợp lý nhưng nhãn nên là \"chưa có bằng chứng\"."
  cau_dung: "Không có bằng chứng cho việc đoán điềm bằng sách giải mộng; chưa có kiểm chứng trực tiếp."
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n56
  luot_2: dung
  nguon: ["https://europepmc.org/article/MED/11515147"]
  trich: "\"dream content is consistently and powerfully modulated by certain types of waking experiences.\""
- trang: kham-pha/cang-thang-giac-ngu/giac-mo
  id: n57
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Chưa mở được nguồn bậc 1-2 (tổng quan hệ thống, hướng dẫn AASM) về liệu pháp mơ tỉnh cho ác mộng lặp lại nên không xác nhận được nhãn \"đang tranh cãi\" hay câu \"chưa phải cách điều trị\"."
