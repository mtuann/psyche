- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n1
  cau: Đường cong quên của Ebbinghaus, lần tái lập năm 2015, và hai cách nhớ lâu hơn có bằng chứng vững chắc.
  loai: lich-su
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n2
  cau: Năm 1879, nhà nghiên cứu người Đức Hermann Ebbinghaus tự học thuộc các danh sách âm tiết vô nghĩa rồi đo xem mình quên nhanh đến đâu.
  loai: lich-su
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n3
  cau: "Ebbinghaus quên nhanh lúc đầu rồi chậm dần: phần lớn sụt giảm xảy ra trong vài giờ đầu, sau đó đường cong thoải dần."
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n4
  cau: '"Tiết kiệm" của Ebbinghaus không phải tỉ lệ phần trăm kiến thức còn nhớ, như một số tài liệu vẫn viết.'
  loai: dinh-nghia
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n5
  cau: "Quên không hẳn là lỗi của trí nhớ: một bài tổng quan cho rằng quên còn có những chức năng có ích, chẳng hạn giúp cập nhật kiến thức và điều tiết cảm xúc."
  loai: dinh-nghia
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n6
  cau: "Quên có hình dạng khá đều đặn: dốc ở đầu, thoải về sau."
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n7
  cau: Ebbinghaus được xem là người đầu tiên làm một loạt thí nghiệm chặt chẽ về hình dạng của việc quên.
  loai: lich-su
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n8
  cau: Ebbinghaus là người tham gia duy nhất.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n9
  cau: Ông dùng âm tiết vô nghĩa để tránh việc ý nghĩa của từ giúp ông nhớ.
  loai: lich-su
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n10
  cau: Trong phần lớn các lần thử, ông học 8 danh sách, mỗi danh sách 13 âm tiết, đến khi đọc thuộc lòng không sai hai lần liên tiếp.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n11
  cau: Sau một khoảng thời gian, ông học lại các danh sách đó và đo thời gian.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n12
  cau: Nếu lần đầu mất 1.000 giây mà lần sau chỉ mất 600 giây, ông đã tiết kiệm được 40%; tiết kiệm càng nhiều nghĩa là dấu vết trí nhớ còn lại càng nhiều, kể cả khi ông không thể tự nhớ ra một âm tiết nào.
  loai: dinh-nghia
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n13
  cau: Tiết kiệm không phải tỉ lệ phần trăm âm tiết còn nhớ.
  loai: dinh-nghia
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n14
  cau: "Kết quả của Ebbinghaus: phần tiết kiệm là 58,2% sau 20 phút; 44,2% sau 1 giờ; 33,7% sau 1 ngày; và 21,1% sau 31 ngày."
  loai: so-lieu
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n15
  cau: Murre và Dros (hai nhà nghiên cứu ở Hà Lan) làm lại thí nghiệm theo cách gần giống nhất có thể.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n16
  cau: Một người, chính đồng tác giả Dros, tự học 70 danh sách âm tiết vô nghĩa trong khoảng 70 giờ.
  loai: so-lieu
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n17
  cau: Việc ấy diễn ra từ tháng 12/2011 đến tháng 2/2012.
  loai: lich-su
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n18
  cau: Đường cong của Dros rất giống của Ebbinghaus; khác biệt lớn nhất là ở mốc 31 ngày.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n19
  cau: "Hình: đường Ebbinghaus có 7 điểm (58,2 / 44,2 / 35,8 / 33,7 / 27,8 / 25,4 / 21,1 phần trăm) ở các mốc 20 phút, 1 giờ, 9 giờ, 1, 2, 6 và 31 ngày."
  loai: so-lieu
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n20
  cau: "Hình: đường Dros có 7 điểm (47,2 / 37,3 / 27,6 / 31,7 / 23,0 / 16,8 / 4,1 phần trăm) ở cùng các mốc."
  loai: so-lieu
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n21
  cau: 'Chú thích hình: mỗi đường là một người (chính tác giả tự làm người tham gia); "tiết kiệm" là phần thời gian học lại được rút ngắn so với lần học đầu; nguồn Bảng 3 của Murre và Dros.'
  loai: dinh-nghia
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n22
  cau: Ở Ebbinghaus, đường cong gần như không giảm ở mốc 1 ngày so với mốc 9 giờ; ở Dros, nó còn đi lên.
  loai: so-lieu
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n23
  cau: Murre và Dros kết luận đường cong nhiều khả năng có một "bước nhảy" lên ở mốc 24 giờ.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n24
  cau: Nhiều người nghĩ đến vai trò của giấc ngủ cho bước nhảy ấy.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n25
  cau: Khi đưa bước nhảy vào mô hình, độ khớp chỉ cải thiện ở mức "xu hướng".
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n26
  cau: Vai trò của giấc ngủ trong loại thí nghiệm này chưa được kiểm chứng.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n27
  cau: "Vững chắc: quên nhanh lúc đầu, chậm dần về sau."
  loai: nhan
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n28
  cau: Hình dạng chung của đường cong quên đã được tìm thấy lại nhiều lần trong hơn một thế kỷ, và lần tái lập năm 2015 cho kết quả rất gần với bản gốc.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n29
  cau: Cả hai nghiên cứu chỉ có một người, dùng âm tiết vô nghĩa.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n30
  cau: Con số cụ thể của đường cong quên phụ thuộc vào tài liệu, người học và cách đo.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n31
  cau: 'Đang tranh cãi: "bước nhảy" ở mốc 24 giờ và vai trò của giấc ngủ.'
  loai: nhan
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n32
  cau: Murre và Dros cho rằng nhiều khả năng có một bước nhảy ở mốc 1 ngày, nhưng mức cải thiện khi đưa nó vào mô hình chỉ ở mức xu hướng.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n33
  cau: Mô hình khớp với dữ liệu của chính Dros không cho thấy bước nhảy.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n34
  cau: Vai trò của giấc ngủ là một giả thuyết hợp lý, nhưng không được kiểm tra trực tiếp trong nghiên cứu này.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n35
  cau: "Giáo trình thường nêu ba hướng giải thích cho việc quên: phai mờ, nhiễu, không truy xuất được."
  loai: dinh-nghia
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n36
  cau: "Phai mờ: dấu vết trí nhớ yếu dần theo thời gian nếu không được dùng đến."
  loai: dinh-nghia
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n37
  cau: 'Nhiễu: những gì học trước hoặc sau "chen" vào nhau.'
  loai: dinh-nghia
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n38
  cau: 'Không truy xuất được: thông tin vẫn còn đó nhưng ta không lấy ra được; cảm giác một từ "ở ngay đầu lưỡi" là ví dụ quen thuộc.'
  loai: dinh-nghia
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n39
  cau: 'Phương pháp "tiết kiệm" của Ebbinghaus cho thấy dấu vết có thể còn lại sau khi đã quên: học lại vẫn nhanh hơn học lần đầu.'
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n40
  cau: Quên là điều không tránh được, nhưng có hai cách làm chậm nó lại, được một tổng quan về 10 kỹ thuật học xếp vào nhóm "hiệu quả cao".
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n41
  cau: "Vững chắc (chip): rải việc ôn tập ra nhiều lần."
  loai: nhan
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n42
  cau: Với cùng số lần học, ôn nhiều lần cách quãng giúp nhớ lâu hơn ôn dồn một lần.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n43
  cau: Phân tích tổng hợp năm 2006 gộp 839 phép so sánh từ 317 thí nghiệm.
  loai: so-lieu
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n44
  cau: Trong một nghiên cứu trực tuyến với hơn 1.350 người, khoảng cách tốt nhất giữa hai lần học vào khoảng 20–40% thời gian cần nhớ nếu bài kiểm tra ở sau 1 tuần, và giảm xuống khoảng 5–10% nếu cần nhớ đến 1 năm.
  loai: so-lieu
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n45
  cau: Muốn nhớ càng lâu, khoảng cách giữa các lần ôn càng nên dài.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n46
  cau: "Vững chắc (chip): tự kiểm tra thay vì đọc lại."
  loai: nhan
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n47
  cau: Cố nhớ lại một điều, kể cả khi nhớ không ra, giúp củng cố trí nhớ hơn là đọc lại nó.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n48
  cau: "Trong một thí nghiệm kinh điển với 120 sinh viên (Roediger và Karpicke, 2006), sau 5 phút: đọc lại hai lần 81%, đọc một lần rồi tự kiểm tra một lần 75%."
  loai: so-lieu
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n49
  cau: "Sau 2 ngày: đọc lại 54%, tự kiểm tra 68%."
  loai: so-lieu
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n50
  cau: "Sau 1 tuần: đọc lại 42%, tự kiểm tra 56%."
  loai: so-lieu
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n51
  cau: Ngay sau khi học, đọc lại cho kết quả tốt hơn; lợi ích của tự kiểm tra chỉ hiện ra về sau.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n52
  cau: Trong thí nghiệm thứ hai của cùng bài báo, nhóm đọc lại còn tin rằng mình sẽ nhớ tốt hơn sau 1 tuần, dù kết quả thực tế ngược lại; đó có thể là một lý do nhiều người chuộng đọc lại.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n53
  cau: Phân tích tổng hợp năm 2014 gộp 159 hiệu ứng cho thấy tự kiểm tra tốt hơn đọc lại với độ lớn trung bình g = 0,50.
  loai: so-lieu
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n55
  cau: Bài tổng quan năm 2013 đánh giá 10 kỹ thuật học phổ biến, xếp ôn tập ngắt quãng và tự kiểm tra vào nhóm "hiệu quả cao"; đọc lại và tô đậm vào nhóm "hiệu quả thấp".
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n56
  cau: Phân tích tổng hợp của Cepeda và cộng sự (2006) chỉ gồm các nhiệm vụ nhớ bằng lời; các thí nghiệm kể trên đo việc nhớ, không đo việc hiểu.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n57
  cau: Ebbinghaus làm thí nghiệm ở Đức, Murre và Dros ở Hà Lan, và Roediger và Karpicke ở một trường đại học Mỹ.
  loai: lich-su
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n58
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu tương tự trên người Việt.
  loai: thoi-su
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n59
  cau: Many Labs 2 làm lại 28 hiệu ứng tâm lý học ở 36 quốc gia và vùng lãnh thổ; mức độ khác biệt giữa các kết quả phụ thuộc vào bản thân hiệu ứng nhiều hơn là vào nơi thực hiện.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n60
  cau: Dự án Many Labs 2 không kiểm tra đường cong quên, nên đây chỉ là gợi ý, chưa phải bằng chứng trực tiếp.
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n61
  cau: 'Ngộ nhận: "Đọc lại nhiều lần là cách ôn bài tốt nhất": đọc lại tạo cảm giác quen thuộc, nhưng tự kiểm tra hiệu quả hơn về lâu dài.'
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n62
  cau: 'Ngộ nhận: "Hay quên là dấu hiệu trí nhớ kém": ai cũng quên theo một hình dạng giống nhau (nhanh lúc đầu, chậm dần), và quên những chi tiết không dùng đến là bình thường.'
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n64
  cau: 'Ngộ nhận: "Ebbinghaus cho thấy sau một ngày ta quên 70% những gì đã học"; con số của Ebbinghaus đo thời gian tiết kiệm khi học lại âm tiết vô nghĩa, không phải tỉ lệ kiến thức còn nhớ.'
  loai: dinh-nghia
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n66
  cau: 'Quiz 1: Ebbinghaus đo trí nhớ bằng phương pháp "tiết kiệm", không đếm số âm tiết còn nhớ; con số của ông không phải "phần trăm còn nhớ".'
  loai: dinh-nghia
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n67
  cau: "Quiz 2: đường cong quên giảm nhanh lúc đầu rồi chậm dần; đây là phần vững chắc nhất của nghiên cứu, được tìm thấy lại cả trong lần tái lập năm 2015."
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n68
  cau: 'Quiz 3: trong thí nghiệm của Roediger và Karpicke (2006), nhóm đọc lại nhớ tốt hơn ở bài kiểm tra sau 5 phút; cảm giác "đã nhớ" ngay sau khi học có thể đánh lừa ta về hiệu quả lâu dài; sau 2 ngày và 1 tuần nhóm tự kiểm tra nhớ tốt hơn rõ rệt.'
  loai: phat-hien
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n69
  cau: "Quiz 4: với khoảng cần nhớ 1 tuần, khoảng cách ôn tốt nhất vào khoảng 20–40% của 7 ngày, tức chừng 1,5–3 ngày, và nên ôn lần hai sau khoảng 1–3 ngày; đây là con số gần đúng, không phải công thức chính xác."
  loai: so-lieu
- trang: kham-pha/tri-nho/vi-sao-ta-quen
  id: n70
  cau: 'Quiz 5: bước nhảy được gắn nhãn "Đang tranh cãi" vì thêm bước nhảy vào mô hình chỉ cải thiện độ khớp ở mức xu hướng, và mô hình khớp với dữ liệu của chính Dros không cho thấy bước nhảy.'
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n1
  cau: Thí nghiệm Loftus và Palmer (1974) cho thấy chỉ một động từ trong câu hỏi cũng làm thay đổi điều nhân chứng ước lượng và có thể cả điều họ nhớ.
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n2
  cau: Nếu bạn bắt đầu "thấy" lại bát canh trong đầu, đó có thể là ký ức thật, hoặc là một mảnh vừa được câu hỏi ghép thêm; rất khó phân biệt hai trường hợp từ bên trong.
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n3
  cau: 'Điều thí nghiệm dưới đây đo được: người nghe câu hỏi có từ dẫn dắt "nhớ" ra chi tiết không có trong sự kiện.'
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n4
  cau: "Nhiều người hình dung trí nhớ như một cuốn băng: sự kiện được ghi lại nguyên vẹn, ký ức có thể mờ đi nhưng không bị sửa."
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n5
  cau: Trong một khảo sát đại diện ở Mỹ, 63% người được hỏi đồng ý rằng trí nhớ hoạt động như máy quay phim.
  loai: so-lieu
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n6
  cau: Khảo sát ấy làm năm 2009 và công bố năm 2011.
  loai: lich-su
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n7
  cau: "Khi nhớ lại, ta thường dựng lại sự kiện từ các mảnh: một phần từ những gì thật sự đã thấy, một phần từ thông tin đến sau sự kiện, kể cả điều người khác kể và chính câu hỏi khiến ta phải nhớ."
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n8
  cau: Việc dựng lại này có thể bị dẫn dắt.
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n9
  cau: Thí nghiệm 1 có 45 sinh viên.
  loai: so-lieu
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n10
  cau: Họ xem 7 đoạn phim ngắn (5–30 giây) về tai nạn giao thông.
  loai: so-lieu
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n11
  cau: Họ trả lời câu hỏi về tốc độ của hai xe khi "va" nhau, trong đó động từ thay đổi giữa các nhóm.
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n12
  cau: Mỗi nhóm 9 người nhận một động từ khác nhau.
  loai: so-lieu
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n13
  cau: "Tốc độ ước lượng trung bình (dặm/giờ): smashed 40,8; collided 39,3; bumped 38,1; hit 34,0; contacted 31,8."
  loai: so-lieu
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n14
  cau: 'Bản dịch tiếng Việt: smashed là "đâm sầm", collided "va chạm", bumped "đụng", hit "tông", contacted "chạm".'
  loai: dinh-nghia
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n15
  cau: Cùng một đoạn phim, chỉ đổi một từ, ước lượng chênh nhau khoảng 9 dặm/giờ (khoảng 14 km/giờ).
  loai: so-lieu
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n16
  cau: Bốn trong bảy đoạn phim là va chạm dàn dựng ở 20, 30 và 40 dặm/giờ.
  loai: so-lieu
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n17
  cau: Với các vụ va chạm dàn dựng ấy, ước lượng trung bình chỉ dao động từ 36,1 đến 39,7 dặm/giờ.
  loai: so-lieu
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n18
  cau: Tốc độ thật của các xe ảnh hưởng rất ít đến ước lượng, còn cách đặt câu hỏi ảnh hưởng nhiều.
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n19
  cau: Có thể người tham gia chỉ "chiều theo" từ ngữ của câu hỏi, còn ký ức thì không đổi.
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n20
  cau: Thí nghiệm 2 có 150 sinh viên xem một đoạn phim về một vụ tai nạn.
  loai: so-lieu
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n21
  cau: 50 người được hỏi với từ "smashed" (đâm sầm), 50 người với "hit" (tông), 50 người không được hỏi về tốc độ.
  loai: so-lieu
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n22
  cau: 'Một tuần sau, tất cả được hỏi: "Bạn có thấy kính vỡ không?"'
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n23
  cau: Trong phim không có kính vỡ.
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n24
  cau: 'Số người trả lời "Có": nhóm đâm sầm 16/50 (32%), nhóm tông 7/50 (14%), nhóm không hỏi tốc độ 6/50 (12%).'
  loai: so-lieu
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n25
  cau: Những người được hỏi bằng từ "đâm sầm" "nhớ" ra một chi tiết không hề tồn tại với tỉ lệ hơn gấp đôi so với hai nhóm còn lại.
  loai: so-lieu
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n26
  cau: Hiện tượng thông tin sai lệch (misinformation effect) đã được nghiên cứu trong nhiều thập kỷ với nhiều kiểu thí nghiệm khác nhau.
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n27
  cau: Bài tổng quan của Elizabeth Loftus năm 2005 tổng kết 30 năm nghiên cứu về chủ đề này.
  loai: lich-su
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n28
  cau: "Vững chắc: trí nhớ được dựng lại và có thể bị thông tin sau sự kiện làm sai lệch."
  loai: nhan
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n29
  cau: "Khá vững: kết quả cụ thể của thí nghiệm Loftus và Palmer."
  loai: nhan
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n30
  cau: Kết quả gốc rõ ràng và phù hợp với rất nhiều nghiên cứu sau đó.
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n31
  cau: "Mẫu nhỏ: 9 người mỗi động từ ở thí nghiệm 1."
  loai: so-lieu
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n32
  cau: Tính đến 11/2026, theo những gì chúng tôi tìm được, thí nghiệm cụ thể này chưa được làm lại trong một dự án tái lập quy mô lớn, đăng ký trước.
  loai: thoi-su
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n33
  cau: Bản thân các tác giả cũng nêu hai cách giải thích.
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n34
  cau: 'Thiên lệch khi trả lời: người tham gia không chắc xe chạy 30 hay 40 dặm/giờ, và từ "đâm sầm" đẩy câu trả lời lên cao hơn, còn ký ức thì không đổi.'
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n35
  cau: 'Ký ức thật sự thay đổi: từ "đâm sầm" khiến người ta lưu lại một phiên bản "nghiêm trọng hơn" của vụ tai nạn, rồi một tuần sau phiên bản ấy "gợi ra" cả mảnh kính vỡ.'
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n36
  cau: Thí nghiệm 2 được thiết kế để cho thêm manh mối giữa hai khả năng ấy, và kết quả phù hợp với khả năng thứ hai.
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n37
  cau: Câu hỏi ký ức gốc bị ghi đè hay chỉ khó truy cập hơn vẫn được nghiên cứu trong nhiều năm sau đó.
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n38
  cau: Khi hỏi người khác về một sự việc, đặc biệt là trẻ em, nên dùng câu hỏi mở thay vì câu hỏi gài sẵn câu trả lời; đây là suy luận từ nghiên cứu thông tin sai lệch.
  loai: loi-khuyen
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n39
  cau: "Cảm giác chắc chắn không đảm bảo ký ức đúng: ký ức sai có thể sống động và đi kèm cảm giác rất tự tin; khi hai người nhớ khác nhau về cùng một chuyện, có thể không ai nói dối."
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n40
  cau: Nếu một sự kiện quan trọng, ghi chép lại sớm, trước khi trao đổi với người khác, giúp giữ phiên bản ít bị pha trộn hơn; đây là suy luận, chưa phải một phát hiện được kiểm tra riêng.
  loai: loi-khuyen
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n41
  cau: Thí nghiệm dùng đoạn phim ngắn cho sinh viên xem, không phải một vụ tai nạn thật xảy ra trước mắt nhân chứng; vì thế mức độ sai lệch ngoài đời có thể khác.
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n42
  cau: Thí nghiệm gốc được làm với sinh viên Mỹ, bằng tiếng Anh.
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n43
  cau: Các bản dịch trong bảng chỉ để minh họa, không phải câu hỏi gốc.
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n44
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào lặp lại thí nghiệm này với người Việt.
  loai: thoi-su
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n45
  cau: 'Đã bị bác bỏ: "Trí nhớ hoạt động như máy quay phim."'
  loai: nhan
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n46
  cau: Độ sống động và cảm giác chắc chắn có thể đi kèm cả ký ức sai.
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n49
  cau: "Quiz 1: điều thay đổi giữa các nhóm trong thí nghiệm 1 là một động từ trong câu hỏi về tốc độ; mọi người xem cùng các đoạn phim."
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n50
  cau: "Quiz 2: thí nghiệm 2 hỏi về kính vỡ để kiểm tra xem ký ức về vụ tai nạn có thật sự thay đổi hay không, chứ không chỉ cách trả lời về tốc độ; phim không có kính vỡ."
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n51
  cau: 'Quiz 3: nhóm "không hỏi tốc độ" là nhóm đối chứng, cho biết tỉ lệ nhớ nhầm kính vỡ khi không có từ dẫn dắt (12%); nhờ đó thấy "đâm sầm" làm tăng tỉ lệ nhớ nhầm còn "tông" thì gần như không.'
  loai: phat-hien
- trang: kham-pha/tri-nho/bang-ghi-hinh
  id: n52
  cau: "Quiz 4: câu hỏi gợi ý có thể làm thay đổi điều người ta nhớ, nên cần cẩn thận khi hỏi và khi đánh giá lời khai; nghiên cứu cho thấy trí nhớ có thể bị dẫn dắt chứ không cho thấy nó luôn sai."
  loai: loi-khuyen
- trang: kham-pha/tri-nho/phong-cach-hoc
  id: n19
  cau: "Đã bị bác bỏ: dạy khớp với phong cách học giúp học tốt hơn."
  loai: nhan
- trang: kham-pha/tri-nho/phong-cach-hoc
  id: n23
  cau: "Vững chắc: người ta có sở thích học khác nhau."
  loai: nhan
- trang: kham-pha/tri-nho/phong-cach-hoc
  id: n34
  cau: 'Đã bị bác bỏ (chip): "Dạy đúng phong cách học giúp học tốt hơn."'
  loai: nhan
- trang: kham-pha/tri-nho/phong-cach-hoc
  id: n35
  cau: 'Đã bị bác bỏ (chip): "Có người thiên não trái, có người thiên não phải."'
  loai: nhan
- trang: kham-pha/tri-nho/phong-cach-hoc
  id: n37
  cau: 'Quiz 2: kết quả ủng hộ giả thuyết khớp phải là kết quả bắt chéo: học sinh "nhìn" học tốt hơn với cách dạy bằng hình, và học sinh "nghe" học tốt hơn với cách dạy bằng lời; nếu cả hai nhóm đều học tốt hơn với hình, đó là ưu điểm của hình, không phải của việc "khớp".'
  loai: phat-hien
- trang: kham-pha/tri-nho/phong-cach-hoc
  id: n4
  cau: "Một cách chia rất quen thuộc là ba nhóm: nhìn, nghe và vận động (cách chia VARK thêm nhóm đọc–viết)."
  loai: dinh-nghia
- trang: kham-pha/tri-nho/phong-cach-hoc
  id: n17
  cau: "Một tổng quan năm 2020 gộp 37 nghiên cứu với hơn 15.000 nhà giáo dục ở 18 quốc gia: trung bình 89% tin vào ý tưởng này."
  loai: so-lieu
- trang: kham-pha/tri-nho/phong-cach-hoc
  id: n15
  cau: Một tổng hợp năm 2025 dựa trên 17 phân tích tổng hợp thấy rằng ở các nghiên cứu thật sự kiểm tra việc dạy khớp phong cách, hiệu ứng gần bằng 0 (d = 0,04).
  loai: so-lieu
- trang: kham-pha/tri-nho/phong-cach-hoc
  id: n11
  cau: Họ cho rằng chưa có cơ sở để đưa việc đánh giá phong cách học vào giáo dục.
  loai: phat-hien
- trang: kham-pha/tri-nho/phong-cach-hoc
  id: n27
  cau: Ta dễ nhớ những lần cách học ưa thích có vẻ hiệu quả và bỏ qua bằng chứng ngược; cảm giác học trôi chảy có thể không phản ánh hiệu quả về lâu dài.
  loai: phat-hien
- trang: kham-pha/tri-nho/phong-cach-hoc
  id: n5
  cau: "Người ta có sở thích học khác nhau: có người thích đọc, có người thích nghe giảng; Pashler và cộng sự (2008) thấy nhiều bằng chứng rằng người ta nói ra các sở thích như vậy khi được hỏi."
  loai: phat-hien
- trang: kham-pha/tri-nho/phong-cach-hoc
  id: n38
  cau: "Quiz 3: mức độ phổ biến của một niềm tin không phải là bằng chứng; kinh nghiệm cá nhân khó tách được tác dụng của việc khớp phong cách khỏi các yếu tố khác; đó là việc của thí nghiệm có đối chứng."
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n1
  cau: Học ngắt quãng giúp nhớ lâu hơn học dồn trong một đêm, và tự kiểm tra giúp nhớ lâu hơn đọc lại (mô tả của trang).
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n2
  cau: Ngay sau khi học xong, An (học dồn) có thể làm tốt hơn một chút vì kiến thức còn "nóng"; một tuần sau, nhiều khả năng Bình (học rải) nhớ tốt hơn.
  loai: loi-khuyen
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n3
  cau: Hiệu ứng thời điểm của các buổi học đã được đo đạc trong hàng trăm thí nghiệm.
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n5
  cau: Học dồn (massed practice) là nhồi mọi thứ vào một buổi dài; học ngắt quãng (spaced/distributed practice) là chia thành nhiều buổi cách nhau bởi những khoảng nghỉ.
  loai: dinh-nghia
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n6
  cau: Học liền một mạch dễ cảm thấy hiệu quả, vì kiến thức còn tươi và ta làm bài tập trơn tru ngay lúc đó; cảm giác trơn tru lúc học không dự báo được trí nhớ một tuần sau.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n7
  cau: 'Từ thế kỷ 19, Ebbinghaus (1885) đặt vấn đề ấy một cách khoa học: ông tự làm người tham gia duy nhất, học thuộc các danh sách âm tiết vô nghĩa, rồi đo xem mình quên nhanh đến đâu bằng phương pháp "tiết kiệm" (học lại nhanh hơn lần đầu bao nhiêu phần trăm).'
  loai: lich-su
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n8
  cau: Ebbinghaus cũng nhận thấy việc rải các buổi học ra nhiều ngày giúp ông tốn ít công sức học lại hơn.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n9
  cau: Phải hơn một thế kỷ sau, các nhà nghiên cứu mới trả lời được câu hỏi của ông bằng hàng trăm thí nghiệm.
  loai: lich-su
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n10
  cau: Cepeda và cộng sự (2006) là một phân tích tổng hợp, gom các nghiên cứu so sánh học ngắt quãng với học dồn trong các nhiệm vụ nhớ bằng lời, rồi phân tích gộp.
  loai: dinh-nghia
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n11
  cau: Tổng cộng 839 phép so sánh, từ 317 thí nghiệm, trong 184 bài báo.
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n12
  cau: Học ngắt quãng thắng học dồn một cách nhất quán, hiệu ứng được tìm thấy trong nhiều bối cảnh, từ danh sách từ vựng đến đoạn văn.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n13
  cau: Khoảng cách tối ưu giữa các buổi học không cố định mà tăng theo thời gian cần nhớ.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n14
  cau: Muốn nhớ đến tuần sau, khoảng cách chừng một đến vài ngày là đủ; muốn nhớ đến cả năm, khoảng cách phải dài hơn nhiều.
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n15
  cau: Khoảng cách quá ngắn thì gần như học dồn; khoảng cách dài quá mức tối ưu thì kết quả giảm đi, nhưng thường giảm chậm hơn.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n16
  cau: 'Cepeda và cộng sự (2008) làm một thí nghiệm trực tuyến với hơn một nghìn người: học 32 sự thật lạ nhưng có thật (ví dụ "ai là người phát minh ra golf trên tuyết"), ôn lại sau nhiều khoảng cách khác nhau, rồi kiểm tra sau nhiều khoảng thời gian khác nhau.'
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n17
  cau: Khi vẽ hiệu quả ghi nhớ theo khoảng cách giữa hai buổi học, có một khoảng cách tốt nhất cho mỗi thời điểm kiểm tra, và khoảng cách tốt nhất dịch dần ra xa khi thời gian cần nhớ dài ra (một "gờ", ridgeline).
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n18
  cau: "Quy tắc nôm na: thi tuần sau thì ôn cách khoảng một đến vài ngày; thi cuối kỳ thì rải ra vài tuần; đây là quy tắc gần đúng, không phải công thức chính xác."
  loai: loi-khuyen
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n19
  cau: "Roediger và Karpicke (2006): 180 sinh viên học một đoạn văn khoa học ngắn trong 4 phiên."
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n20
  cau: Một nhóm đọc đi đọc lại cả 4 phiên (SSSS); nhóm kia đọc 1 phiên rồi tự kiểm tra, viết ra mọi điều nhớ được, trong 3 phiên còn lại (STTT).
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n21
  cau: Các bài tự kiểm tra không có phản hồi đúng/sai.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n22
  cau: Sau đó, một nửa làm bài kiểm tra cuối sau 5 phút, nửa còn lại sau 1 tuần.
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n23
  cau: "Kết quả bảng: sau 5 phút, nhóm đọc lại 83%, nhóm tự kiểm tra 71%."
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n24
  cau: "Sau 1 tuần: nhóm đọc lại 40%, nhóm tự kiểm tra 61%."
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n25
  cau: Nhóm đọc lại đã đọc đoạn văn trung bình 14 lần, nhóm tự kiểm tra chỉ đọc 3,4 lần.
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n26
  cau: Ở bài kiểm tra sau 5 phút, đọc lại thắng; cái "thắng lợi" ngắn hạn này có thể khiến nhiều người tin rằng đọc lại là cách học tốt.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n27
  cau: Hiện tượng "cố nhớ lại giúp nhớ lâu hơn" được gọi là hiệu ứng kiểm tra (testing effect).
  loai: dinh-nghia
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n28
  cau: Rowland (2014) gộp các nghiên cứu so sánh tự kiểm tra với đọc lại, cho độ lớn hiệu ứng trung bình g = 0,50, mức trung bình theo cách đọc độ lớn hiệu ứng của site.
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n29
  cau: Adesope và cộng sự (2017) gộp 118 bài báo, 272 hiệu ứng, 15.427 người tham gia, cho g = 0,61 khi so với mọi cách học không kiểm tra, và g = 0,51 khi so riêng với đọc lại, ở mức trung bình đến lớn.
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n30
  cau: Dunlosky và cộng sự (2013) đánh giá 10 kỹ thuật học phổ biến, xếp ôn tập ngắt quãng và tự kiểm tra vào nhóm "hiệu quả cao", đọc lại và tô đậm vào nhóm "hiệu quả thấp".
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n31
  cau: "Vững chắc: học ngắt quãng giúp nhớ lâu hơn học dồn."
  loai: nhan
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n32
  cau: Học ngắt quãng vượt trội học dồn một cách nhất quán trong nhiều loại tài liệu, dù phần lớn dữ liệu đến từ người trẻ tuổi.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n33
  cau: Hiệu ứng ngắt quãng đã được tìm thấy trong hàng trăm thí nghiệm.
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n34
  cau: "Vững chắc: tự kiểm tra giúp nhớ lâu hơn đọc lại."
  loai: nhan
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n35
  cau: Thí nghiệm của Roediger và Karpicke (2006), hai phân tích tổng hợp (Rowland, 2014; Adesope và cộng sự, 2017) cho thấy việc cố nhớ lại củng cố trí nhớ dài hạn tốt hơn đọc lại, kể cả khi người học đọc ít hơn nhiều và không nhận được phản hồi.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n36
  cau: "Khá vững: khoảng cách ôn tối ưu tăng theo thời gian cần nhớ."
  loai: nhan
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n37
  cau: Cepeda và cộng sự (2008) đo được "đường gờ" khoảng cách tối ưu dịch ra xa khi thời gian cần nhớ dài ra; kết quả này vững trong một nghiên cứu có kiểm soát (làm qua mạng) với tài liệu dạng sự kiện kiến thức chung; việc áp dụng con số cụ thể vào lớp học thực tế còn cần thêm nghiên cứu.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n38
  cau: "Đang tranh cãi: vì sao học ngắt quãng lại hiệu quả (cơ chế)."
  loai: nhan
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n39
  cau: Có nhiều lý thuyết cạnh tranh về cơ chế (mã hóa đa dạng ngữ cảnh, lần ôn gắng sức hơn vì đã quên một phần, củng cố giữa các buổi) và chưa có đồng thuận về cơ chế chính.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n40
  cau: 'Mã hóa đa dạng ngữ cảnh: mỗi buổi học gắn với ngữ cảnh khác nhau, trí nhớ có nhiều "móc" để tìm lại.'
  loai: dinh-nghia
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n41
  cau: Lần ôn lại sau khi đã quên một phần đòi hỏi nỗ lực truy xuất, và nỗ lực ấy được cho là củng cố dấu vết trí nhớ mạnh hơn; Rowland (2014) thấy phân tích của mình ủng hộ vai trò của xử lý gắng sức.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n42
  cau: Giữa các buổi học, não tiếp tục củng cố những gì đã học, đặc biệt trong lúc ngủ; học dồn tước đi những khoảng nghỉ này; đây là một giả thuyết chưa được kiểm tra riêng trong các nghiên cứu trên.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n43
  cau: "Tự kiểm tra có thể thắng đọc lại còn vì giúp ta nhận ra điều mình chưa thuộc: nhóm đọc lại tin rằng mình sẽ nhớ tốt hơn nhóm tự kiểm tra, nhưng sau 1 tuần lại nhớ kém hơn."
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n44
  cau: "Vững chắc (chip): chia buổi học thành nhiều phiên ngắn, cách nhau."
  loai: nhan
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n45
  cau: "Thay vì một buổi 4 tiếng đêm trước thi, học 1 tiếng mỗi tối trong 4 tối: tổng thời gian như nhau, trí nhớ một tuần sau nhiều khả năng tốt hơn; đây là ứng dụng của phát hiện trong phân tích tổng hợp Cepeda và cộng sự (2006)."
  loai: loi-khuyen
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n46
  cau: "Vững chắc (chip): gấp sách lại và tự kiểm tra."
  loai: nhan
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n47
  cau: Kể cả khi nhớ không ra, nỗ lực nhớ lại thất bại vẫn có ích, vì nó làm lần gặp lại sau đó hiệu quả hơn (Kornell, Hays và Bjork, 2009).
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n48
  cau: "Khá vững (chip): đặt khoảng cách ôn theo ngày cần nhớ."
  loai: nhan
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n49
  cau: "Theo Cepeda và cộng sự (2008): thi tuần sau thì ôn lại sau chừng một đến hai ngày; thi cuối kỳ sau vài tháng thì rải các lần ôn ra vài tuần; cần nhớ càng lâu, khoảng cách giữa các lần ôn càng dài; đừng ôn dồn mọi thứ vào tuần cuối trước kỳ thi lớn."
  loai: loi-khuyen
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n50
  cau: "Khá vững (chip): ngủ đủ giấc giữa các buổi học."
  loai: nhan
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n51
  cau: Học dồn thâu đêm vừa không có khoảng nghỉ giữa các buổi, vừa lấy bớt thời gian ngủ, mà giấc ngủ là lúc nhiều quá trình củng cố trí nhớ diễn ra; một lịch học ngắt quãng "tự nhiên" đã bao gồm các đêm ngủ ở giữa; đó có thể là một phần lý do nó hiệu quả, nhưng các nghiên cứu về học ngắt quãng chưa tách riêng vai trò của giấc ngủ.
  loai: loi-khuyen
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n52
  cau: Thí nghiệm của Roediger và Karpicke làm với sinh viên một trường đại học ở Mỹ; trong phân tích tổng hợp của Cepeda và cộng sự (2006), 85% dữ liệu đến từ người trẻ tuổi.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n53
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra các hiệu ứng này trên người Việt.
  loai: thoi-su
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n54
  cau: Dunlosky và cộng sự (2013) nhận xét rằng ôn tập ngắt quãng và tự kiểm tra có lợi cho người học ở nhiều lứa tuổi và năng lực khác nhau.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n55
  cau: Học dồn có thể cho kết quả tốt ở bài kiểm tra ngay sau đó, nhưng trí nhớ một tuần sau thường kém hơn học rải.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n56
  cau: Đọc lại tạo cảm giác quen thuộc, dễ nhầm với "đã thuộc"; trong thí nghiệm của Roediger và Karpicke, nhóm đọc lại tin rằng mình sẽ nhớ tốt hơn, nhưng sau 1 tuần lại nhớ kém hơn.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n57
  cau: "Chính hành động cố nhớ lại đã củng cố trí nhớ: kiểm tra là một cách học, không chỉ một cách chấm điểm."
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n58
  cau: Quên nhanh lúc đầu là hình dạng chung của trí nhớ; học ngắt quãng không ngăn được việc quên, nó chỉ làm việc quên chậm hơn so với học dồn.
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n60
  cau: "Quiz 1: trong thí nghiệm của Roediger và Karpicke (2006), nhóm đọc lại thắng ở bài kiểm tra sau 5 phút (83% so với 71%) nhưng thua đậm sau 1 tuần (40% so với 61%)."
  loai: so-lieu
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n62
  cau: "Quiz 3: các bài tự kiểm tra không có phản hồi đúng/sai, và bài kiểm tra cuối được làm sau 5 phút hoặc 1 tuần; học ít hơn mà nhớ lâu hơn."
  loai: phat-hien
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n63
  cau: "Quiz 4: với khoảng cần nhớ dài (vài tháng), nên rải các lần ôn ra với khoảng cách dài hơn; khoảng cách tối ưu tăng theo thời gian cần nhớ, là quy tắc gần đúng, không phải công thức chính xác cho từng người."
  loai: loi-khuyen
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n64
  cau: 'Quiz 5: cơ chế của hiệu ứng ngắt quãng được gắn nhãn "Đang tranh cãi" vì có nhiều lý thuyết cạnh tranh (ngữ cảnh đa dạng, nỗ lực truy xuất, củng cố giữa các buổi) mà chưa có đồng thuận về cơ chế chính, trong khi hiện tượng thì vững chắc (hàng trăm thí nghiệm).'
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n1
  cau: Nhiều người thấy việc giữ một dãy số trong đầu khó hơn khi đồng thời nhẩm hát một bài có lời.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n2
  cau: Theo mô hình trí nhớ làm việc, giữ dãy số bằng lời và hát nhẩm lời bài hát cùng dùng một ngăn xử lý âm thanh nên hai việc tranh nhau ngăn đó.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n3
  cau: Giữ dãy số trong khi hình dung đường đi (việc hình ảnh–không gian) thường ít chen lấn hơn so với hát nhẩm lời, vì hai việc dùng hai ngăn khác nhau.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n4
  cau: Trí nhớ làm việc (working memory) là nơi não vừa giữ thông tin trong vài giây vừa thao tác với nó, khác với cách nhìn trí nhớ ngắn hạn như một kho chứa thụ động.
  loai: dinh-nghia
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n5
  cau: Năm 1974 Alan Baddeley và Graham Hitch đề xuất mô hình trí nhớ làm việc nhiều ngăn dưới sự điều phối của một thành phần điều hành trung tâm.
  loai: lich-su
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n6
  cau: Baddeley và Hitch dùng thí nghiệm nhiệm vụ kép (làm hai việc cùng lúc) để thử xem trí nhớ ngắn hạn có phải một ngăn duy nhất.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n7
  cau: Nếu trí nhớ ngắn hạn là một ngăn duy nhất thì việc nào chiếm chỗ cũng làm việc khác kém đi; nếu mô hình kho chung đúng, hiệu suất phải sụp đổ khi tải gần bằng độ dài dãy số.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n8
  cau: Khi phải giữ tới 8 chữ số trong lúc suy luận bằng lời, người tham gia chậm hơn khoảng một nửa nhưng tỉ lệ sai gần như không đổi (khoảng 5%).
  loai: so-lieu
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n9
  cau: Vòng lặp âm vị gồm một kho âm thanh nơi vết âm thanh phai dần nếu không được làm mới và một quá trình nhẩm lại ("giọng nói trong đầu") làm mới vết đó.
  loai: dinh-nghia
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n10
  cau: Dung lượng của vòng lặp âm vị ước chừng bằng số từ người đó đọc được trong khoảng 2 giây.
  loai: so-lieu
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n11
  cau: Bảng phác họa không gian–thị giác giữ hình ảnh và vị trí trong không gian.
  loai: dinh-nghia
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n12
  cau: "Cơ chế điều hành trung ương là thành phần có dung lượng chú ý hạn chế: tập trung chú ý, chia và chuyển chú ý giữa các việc, và kết nối với trí nhớ dài hạn."
  loai: dinh-nghia
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n13
  cau: Conrad cho 387 người xem các dãy 6 chữ cái trình bày bằng mắt rồi nhớ lại ngay.
  loai: so-lieu
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n14
  cau: "Conrad ghi lại loại lỗi nhầm lẫn khi nhớ lại: lỗi có quan hệ có hệ thống với chữ cái gốc."
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n15
  cau: Các lỗi nhầm lẫn tập trung vào những chữ cái nghe giống nhau (như B, P, T, V).
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n16
  cau: Chữ cái được chiếu bằng mắt, nhưng lỗi vẫn tập trung vào chữ nghe giống nhau; theo Conrad, điều này cho thấy đa số người tham gia nhẩm tên chữ cái thay vì giữ hình dạng.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n17
  cau: Mẫu lỗi khi nhớ lại trùng khớp với mẫu nhầm lẫn khi nghe các chữ cái trong tiếng ồn trắng (tương quan hạng +0,64).
  loai: so-lieu
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n18
  cau: Thí nghiệm của Conrad (1964) là một trong những bằng chứng nền tảng cho vòng lặp âm vị.
  loai: lich-su
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n19
  cau: Với các dãy từ, sự giống nhau về âm thanh làm trí nhớ ngắn hạn kém đi rất nhiều, còn sự giống nhau về ý nghĩa chỉ ảnh hưởng chút ít.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n20
  cau: "Với trí nhớ dài hạn thì ngược lại: ý nghĩa mới là thứ gây nhầm lẫn."
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n21
  cau: Baddeley, Thomson và Buchanan (1975) kiểm tra dự đoán rằng độ dài trí nhớ tính theo thời gian đọc các từ chứ không theo số từ.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n22
  cau: "Trí nhớ tỉ lệ nghịch với độ dài từ: nhớ được nhiều từ ngắn hơn từ dài, trên nhiều loại tài liệu."
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n23
  cau: Khi số âm tiết và số âm vị giữ nguyên nhưng thời gian phát âm khác nhau, từ đọc nhanh hơn vẫn nhớ tốt hơn.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n24
  cau: Số từ nhớ được dự đoán được từ số từ người đó đọc được trong khoảng 2 giây.
  loai: so-lieu
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n25
  cau: Khi bắt người tham gia lặp đi lặp lại một âm không liên quan trong lúc học (ức chế phát âm), hiệu ứng độ dài từ biến mất với tài liệu nhìn thấy nhưng vẫn còn với tài liệu nghe.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n26
  cau: Hiệu ứng độ dài từ là một trong những bằng chứng chính cho vòng lặp âm vị, dù cơ chế của nó còn được giải thích theo nhiều cách.
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n27
  cau: Hai bệnh nhân mất trí nhớ nặng vẫn nhớ tốt một câu chuyện ngắn ngay sau khi nghe, dài hơn nhiều so với sức chứa của vòng lặp âm vị; điều này đòi hỏi một nơi "buộc" thông tin lại.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n28
  cau: "Baddeley (2000) là bài lý thuyết: rà soát các hiện tượng mô hình ba thành phần chưa giải thích được rồi đề xuất thành phần thứ tư."
  loai: lich-su
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n29
  cau: Bộ đệm tập là kho dung lượng hạn chế, lưu thông tin dưới dạng đa giác quan, buộc thông tin từ các ngăn con và từ trí nhớ dài hạn thành một biểu diễn thống nhất.
  loai: dinh-nghia
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n30
  cau: Việc lấy thông tin ra khỏi bộ đệm được cho là diễn ra qua ý thức; ban đầu Baddeley giả định truy cập bộ đệm phụ thuộc cơ chế điều hành, về sau nhóm ông thấy cơ chế điều hành không bắt buộc.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n31
  cau: 'Hình "Mô hình trí nhớ làm việc (Baddeley)": cơ chế điều hành trung ương ("ông chủ" phân bổ chú ý) điều phối vòng lặp âm vị (âm thanh, lời nói), bảng phác họa (không gian–thị giác: hình ảnh, vị trí) và bộ đệm tập (buộc thành biểu diễn thống nhất).'
  loai: dinh-nghia
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n32
  cau: "Chú thích của hình: các ngăn trao đổi hai chiều với cơ chế điều hành trung ương."
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n34
  cau: 'Khung "Vững chắc": hai việc cùng "kênh" gây nhiễu cho nhau nhiều hơn hai việc khác kênh.'
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n35
  cau: 'Khung "Vững chắc": trí nhớ ngắn hạn cho lời nói phụ thuộc mạnh vào âm thanh của từ (giống âm thì nhớ kém, từ dài thì nhớ ít).'
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n36
  cau: 'Khung "Khá vững": bộ đệm tập (episodic buffer).'
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n37
  cau: 'Khung "Đang tranh cãi": giới hạn của bàn nháp là bao nhiêu, và bản chất của nó là gì.'
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n38
  cau: Cowan (2001) hiệu chỉnh con số 7 ± 2 của Miller xuống khoảng 4 "cục" thông tin khi loại bỏ các mẹo gom nhóm.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n39
  cau: Một số nhà nghiên cứu cho rằng giới hạn thực chất nằm ở tài nguyên chú ý chứ không phải số ngăn chứa.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n40
  cau: Mô hình xử lý nhúng của Cowan coi trí nhớ làm việc là phần trí nhớ dài hạn đang được kích hoạt cộng với tâm điểm chú ý, không cần các "ngăn" riêng.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n41
  cau: Bệnh nhân PV có vòng lặp âm vị bị tổn thương (trí nhớ dài hạn còn nguyên) học cặp từ tiếng mẹ đẻ bình thường nhưng gần như không học được từ mới của ngoại ngữ.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n42
  cau: "Một giả thuyết có sức nặng: chức năng quan trọng của vòng lặp âm vị là giúp học ngôn ngữ."
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n43
  cau: Ở trẻ em, khả năng lặp lại một từ vô nghĩa vừa nghe có liên quan chặt với vốn từ vựng và dự báo vốn từ một năm sau chứ không phải ngược lại.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n44
  cau: "Một cách giải thích (còn tranh luận) cho việc có nhiều ngăn là góc nhìn tài nguyên: hai việc cùng kênh tranh nhau cùng nguồn tài nguyên, hai việc khác kênh dùng nguồn khác."
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n45
  cau: Dù con số chính xác còn tranh cãi (7 ± 2 hay 4 ± 1), các bên đều thừa nhận giới hạn của trí nhớ làm việc rất nhỏ so với lượng thông tin ta gặp mỗi ngày.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n46
  cau: Nhẩm lại là cách dùng đúng vòng lặp âm vị; vừa giữ số vừa nghe ai đó nói hoặc nghe bài hát có lời gây xung đột.
  loai: loi-khuyen
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n47
  cau: "Tiêu đề lời khuyên 1 (nhẩm số, đừng vừa nghe lời nói): Khá vững."
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n48
  cau: Bàn nháp chỉ giữ được vài "cục" thông tin (khoảng 4); từ đó suy ra nên đưa việc quan trọng ra khỏi đầu bằng ghi chú, nhắc nhở.
  loai: loi-khuyen
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n49
  cau: "Tiêu đề lời khuyên 2 (viết ra thay vì giữ trong đầu): Khá vững."
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n50
  cau: Vừa nghe giảng vừa đọc tin nhắn (cùng kênh ngôn ngữ) gây nhiễu nhau; nghe nhạc không lời thường ít gây hại hơn với việc hình ảnh, nhưng với việc đòi hỏi ngôn ngữ nhạc không lời cũng có thể gây nhiễu nhẹ.
  loai: loi-khuyen
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n51
  cau: "Tiêu đề lời khuyên 3 (đừng bắt hai việc cùng kênh chạy song song): Khá vững."
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n52
  cau: Gom nhóm biến nhiều ký tự thành ít "cục", giúp nhớ được nhiều ký tự hơn; ví dụ dãy 0912345678 (10 ký tự) gom thành 0912–345–678 là 3 cục.
  loai: loi-khuyen
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n53
  cau: "Tiêu đề lời khuyên 4 (gom nhóm): Khá vững."
  loai: nhan
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n55
  cau: 'Vì sao "7 ± 2" không hẳn đúng với mọi người: đó là ước lượng ban đầu của Miller, thực chất là giới hạn gộp khi chưa chặn gom nhóm.'
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n56
  cau: Nhớ ngược đòi hỏi vừa giữ vừa đảo thứ tự (xử lý), nên gần với nghĩa "làm việc" của trí nhớ làm việc hơn nhớ xuôi.
  loai: dinh-nghia
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n57
  cau: Mô hình của Baddeley và Hitch được xây dựng và kiểm tra chủ yếu ở Anh, Mỹ và châu Âu.
  loai: lich-su
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n58
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra trực tiếp mô hình này trên người Việt.
  loai: thoi-su
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n59
  cau: Độ dài trí nhớ chữ số khác nhau giữa các ngôn ngữ, một phần vì thời gian đọc các chữ số (người song ngữ xứ Wales nhớ được nhiều chữ số tiếng Anh hơn chữ số tiếng Wales, vốn dài hơn), dù thời gian phát âm không giải thích được hết.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n60
  cau: Vì vậy, theo suy luận từ các kết quả trên, không nên lấy chuẩn của người nói tiếng Anh áp thẳng cho người nói ngôn ngữ khác, kể cả tiếng Việt, và ngược lại; công cụ đo trên site chỉ nên dùng để tự khám phá, không so máy móc với chuẩn nước ngoài.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n61
  cau: Mô hình một ngăn (như mô hình đa kho của Atkinson và Shiffrin, 1968) không giải thích được vì sao hai việc khác kênh ít gây nhiễu nhau hơn hai việc cùng kênh; nhiều bằng chứng ủng hộ các ngăn chuyên biệt, dù cách giải thích còn bàn cãi.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n62
  cau: Giới hạn của trí nhớ làm việc là đặc điểm chung của mọi người, không phải dấu hiệu của trí nhớ kém; gom nhóm giúp nhớ được nhiều ký tự hơn (Miller, 1956); ghi chú giúp khỏi phải giữ trong đầu.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n63
  cau: Hai việc cùng kênh gây nhiễu nhau rõ rệt trong các thí nghiệm nhiệm vụ kép, dù người tham gia đã cố gắng hết sức.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n64
  cau: Mô hình Miller (1956) 7 ± 2 là ước lượng ban đầu, đã tính cả các mẹo gom nhóm; ước lượng hiện đại thận trọng hơn là khoảng 4 "cục"; giới hạn còn tùy loại thông tin, cách đo, và từng người.
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n66
  cau: 'Quiz 1: vừa giữ dãy số vừa hát nhẩm lời khó vì cả hai việc dùng chung vòng lặp âm vị; xung đột theo "kênh", không theo mức cố gắng chung chung.'
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n67
  cau: "Quiz 2: Conrad (1964): lỗi nhớ lại là nhầm giữa những chữ cái nghe giống nhau (như B, P, T, V) dù chữ cái hiện bằng mắt, cho thấy đa số người nhớ dưới dạng âm thanh; trùng khớp mẫu nhầm lẫn khi nghe trong tiếng ồn."
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n68
  cau: "Quiz 3: hiệu ứng độ dài từ: số từ nhớ được tính theo thời gian đọc, dự đoán từ số từ đọc được trong khoảng 2 giây; ức chế phát âm làm hiệu ứng biến mất với tài liệu nhìn thấy."
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n69
  cau: "Quiz 4: bộ đệm tập được Baddeley đề xuất năm 2000 để giải thích việc bệnh nhân mất trí nhớ vẫn nhớ được cả câu chuyện dài hơn nhiều so với sức chứa của vòng lặp âm vị, và để buộc thông tin đa giác quan cùng trí nhớ dài hạn thành một khối; bộ đệm bổ sung chứ không thay thế mô hình ba thành phần."
  loai: phat-hien
- trang: kham-pha/tri-nho/tri-nho-lam-viec
  id: n70
  cau: 'Quiz 5: giới hạn của trí nhớ làm việc gắn nhãn "Đang tranh cãi" vì con số còn bàn cãi (7 ± 2 của Miller so với khoảng 4 của Cowan) và có mô hình khác (Cowan) cho rằng, thay vì các "ngăn" riêng, trí nhớ làm việc là phần trí nhớ dài hạn đang kích hoạt cộng tâm điểm chú ý; mô hình đa thành phần vẫn có ảnh hưởng, chỗ tranh luận là "bao nhiêu" và "vì sao".'
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n1
  cau: IQ đo một khía cạnh của trí thông minh (khả năng nhận thức trừu tượng như lý luận, trí nhớ, tốc độ xử lý); sự tháo vát, khả năng thuyết phục, óc sáng tạo, sự kiên trì nằm ngoài những gì bài test IQ đo.
  loai: dinh-nghia
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n2
  cau: Năm 1904, Charles Spearman thấy khi so điểm các môn học (cổ ngữ, tiếng Pháp, tiếng Anh, toán) với khả năng phân biệt âm thanh, ánh sáng, trọng lượng và năng khiếu âm nhạc của học sinh, các cặp phép đo tương quan dương với nhau.
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n3
  cau: Về sau, hiện tượng các bài kiểm tra nhận thức tương quan dương với nhau được gọi là positive manifold (đa tạp dương).
  loai: dinh-nghia
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n4
  cau: Spearman đề xuất rằng đằng sau mọi hoạt động trí tuệ có một chức năng chung (về sau gọi là g) cộng với các yếu tố riêng của từng hoạt động (về sau gọi là s); cách giải thích này về sau gọi là thuyết hai nhân tố.
  loai: lich-su
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n5
  cau: Điểm toán của An cao một phần vì g của An cao, một phần vì năng khiếu toán riêng (s) của An tốt.
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n6
  cau: IQ hiện đại là điểm số chuẩn hóa từ các bài kiểm tra, trung bình 100, độ lệch chuẩn 15.
  loai: dinh-nghia
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n7
  cau: Khoảng 68% dân số nằm trong 85–115; IQ 130 thuộc nhóm cao nhất khoảng 2%.
  loai: so-lieu
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n8
  cau: 'IQ là thang thứ bậc, không phải thang tỉ lệ: IQ 130 không có nghĩa "thông minh gấp 1,3 lần" người IQ 100.'
  loai: dinh-nghia
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n9
  cau: "Thang Wechsler dành cho người lớn (WAIS) cho bốn chỉ số: hiểu ngôn ngữ, lý luận tri giác, trí nhớ làm việc, tốc độ xử lý."
  loai: dinh-nghia
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n10
  cau: Ma trận Raven (dạng bài điền hình còn thiếu vào dãy hình) hầu như không dùng ngôn ngữ, được thiết kế để ít phụ thuộc văn hóa và học vấn (culturally reduced), thường dùng làm phép đo khả năng suy luận trừu tượng "ít chữ", dù điểm Raven vẫn thay đổi mạnh theo thế hệ.
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n11
  cau: Spearman thu thập điểm số của học sinh ở nhiều môn học và nhiều phép đo khác (phân biệt âm thanh, ánh sáng, trọng lượng; năng khiếu âm nhạc; đánh giá "óc thực tế"), rồi tính hệ số tương quan giữa các cặp phép đo.
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n12
  cau: Tương quan dương xuất hiện giữa các cặp phép đo, từ đó Spearman đề xuất mọi hoạt động trí tuệ có chung một chức năng nền cộng các yếu tố riêng; bài báo này thường được coi là điểm khởi đầu của nghiên cứu về g.
  loai: lich-su
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n13
  cau: Strenze (2007) gom các nghiên cứu dọc (đo IQ trước, theo dõi kết quả nhiều năm sau) và phân tích tổng hợp mối liên hệ giữa IQ với học vấn, địa vị nghề nghiệp và thu nhập.
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n14
  cau: IQ tương quan với trình độ học vấn r = .56, với địa vị nghề nghiệp r = .43, với thu nhập r = .20.
  loai: so-lieu
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n15
  cau: r = .56 nghĩa là IQ "giải thích" khoảng 31% khác biệt về học vấn (.56² ≈ .31), còn 2/3 do các yếu tố khác; r = .20 với thu nhập nghĩa là IQ giải thích khoảng 4% khác biệt thu nhập.
  loai: so-lieu
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n16
  cau: Hiệu suất công việc theo đánh giá của cấp trên r = .53; sáng tạo r = .17; hạnh phúc r = .05.
  loai: so-lieu
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n17
  cau: IQ liên hệ khá mạnh với học vấn và hiệu suất công việc, liên hệ yếu với sáng tạo và gần như không liên hệ với hạnh phúc.
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n18
  cau: Tucker-Drob và Briley (2014) phân tích tổng hợp 15 mẫu nghiên cứu dọc độc lập (sinh đôi nuôi chung và nuôi riêng, con nuôi), từ sơ sinh đến tuổi già, về độ ổn định theo thời gian của ảnh hưởng gen và môi trường lên khả năng nhận thức.
  loai: so-lieu
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n19
  cau: Ảnh hưởng của gen lên khả năng nhận thức rất kém ổn định ở trẻ nhỏ rồi ổn định dần, giữ ở mức cao từ tuổi thiếu niên đến cuối đời; việc thứ bậc nhận thức ngày càng ổn định trong thời thơ ấu gần như hoàn toàn nhờ gen.
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n20
  cau: Tỉ lệ di truyền của khả năng nhận thức tăng theo tuổi, từ khoảng 41% ở tuổi 9 lên 66% ở tuổi 17 (mẫu 11.000 cặp sinh đôi ở bốn nước).
  loai: so-lieu
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n21
  cau: "Giải thích thường gặp: khi còn nhỏ môi trường gia đình áp lên mọi đứa trẻ gần như nhau; càng lớn mỗi người càng tự chọn môi trường hợp khuynh hướng của mình, làm khác biệt gen bộc lộ rõ hơn."
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n22
  cau: Một nghiên cứu sinh đôi ở Mỹ trên trẻ 7 tuổi thấy ở những gia đình rất khó khăn ảnh hưởng của gen lên IQ gần như bằng không; một cách hiểu là môi trường thiếu thốn chặn mất con đường phát huy.
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n23
  cau: "Kết quả của Turkheimer không lặp lại ở mọi nơi: một mẫu lớn ở Anh (8.716 cặp sinh đôi) gần như không thấy tương tác gen–môi trường."
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n24
  cau: "Pietschnig và Voracek (2015) là phân tích tổng hợp chính thức đầu tiên về hiệu ứng Flynn: 271 mẫu độc lập, gần 4 triệu người, 31 quốc gia, 1909–2013."
  loai: so-lieu
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n25
  cau: "Điểm IQ các thế hệ sau cao hơn thế hệ trước: tăng mạnh nhất ở suy luận trừu tượng (khoảng 0,41 điểm mỗi năm, khoảng 4 điểm mỗi thập kỷ), yếu nhất ở kiến thức kết tinh (khoảng 0,21 điểm mỗi năm)."
  loai: so-lieu
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n26
  cau: Vì vốn gen của quần thể khó thay đổi đáng kể trong vài thập kỷ, đà tăng IQ được cho là chủ yếu đến từ môi trường; các tác giả cho rằng các yếu tố gắn với "tốc độ lịch sử sống" dường như là nguyên nhân chính của quỹ đạo chung.
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n27
  cau: 'Khung "Vững chắc": các bài kiểm tra nhận thức khác nhau tương quan dương với nhau (positive manifold).'
  loai: nhan
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n28
  cau: 97 mẫu dữ liệu từ 31 nước ngoài phương Tây cho thấy yếu tố chung (g) xuất hiện.
  loai: so-lieu
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n29
  cau: 'Khung "Khá vững": IQ dự báo kết quả học tập và công việc ở mức vừa phải (r ≈ .4–.6 với học vấn và hiệu suất công việc).'
  loai: nhan
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n30
  cau: Mỗi năm đi học thêm làm điểm IQ tăng khoảng 1–5 điểm.
  loai: so-lieu
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n31
  cau: 'Khung "Đang tranh cãi": khác biệt IQ giữa người với người do gen quyết định bao nhiêu phần.'
  loai: nhan
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n32
  cau: 'Khung "Đã bị bác bỏ": "IQ cao đảm bảo thành công và hạnh phúc trong đời".'
  loai: nhan
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n33
  cau: Một báo cáo của nhóm chuyên gia APA nhận xét rằng bài test IQ dự báo dưới một nửa phương sai của kết quả công việc và các đặc điểm khác (kỹ năng giao tiếp, tính cách) có thể quan trọng ngang hoặc hơn.
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n34
  cau: "Một quan điểm phổ biến ngày nay là mô hình phân tầng: đỉnh là g, bên dưới là các nhóm năng lực (nổi tiếng nhất là phân biệt của Cattell: trí tuệ lỏng và trí tuệ kết tinh)."
  loai: lich-su
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n35
  cau: Theo một nghiên cứu lớn (gần 50 nghìn người làm bài trực tuyến cùng dữ liệu chuẩn hóa của các bài test), các năng lực kiểu "lỏng" đạt đỉnh sớm ở tuổi trưởng thành, các năng lực kiểu "kết tinh" như từ vựng đạt đỉnh muộn hơn ở tuổi trung niên, nhưng thời điểm đạt đỉnh khác nhau khá nhiều giữa từng năng lực.
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n36
  cau: '"Tính di truyền của IQ là 70%" không có nghĩa 70% trí tuệ của bạn do gen quyết định: nó nói về 70% khác biệt giữa mọi người trong quần thể được nghiên cứu gắn với khác biệt gen; đổi quần thể thì con số đổi; heritability cao không có nghĩa môi trường vô dụng.'
  loai: dinh-nghia
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n37
  cau: Khi môi trường thay đổi, điểm trung bình của cả thế hệ vẫn có thể tăng đáng kể (hiệu ứng Flynn).
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n38
  cau: Howard Gardner (1983) đề xuất con người có nhiều loại trí tuệ độc lập (ngôn ngữ, logic–toán, âm nhạc, vận động, giao tiếp...).
  loai: lich-su
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n39
  cau: 'Thuyết đa trí tuệ bị phê bình: một số "trí tuệ" bị cho là thiên về tài năng đặc biệt hơn là trí tuệ; một tổng quan cho rằng các lý thuyết này thiếu bằng chứng thực nghiệm đủ để làm cơ sở cho thực hành giáo dục; thử trực tiếp trên 200 người lớn, các bài thuộc tám "trí tuệ" vẫn dùng chung một yếu tố g lớn, nhất là các bài về năng lực nhận thức thuần túy.'
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n40
  cau: Các bài test IQ cho nhiều điểm thành phần, nên có thể dùng để mô tả điểm mạnh và yếu nhận thức (một người có thể làm bài ngôn ngữ tốt hơn bài không gian và ngược lại); dùng điểm số để dán nhãn "thông minh/dốt" là lạm dụng vì test chỉ đo một lát cắt.
  loai: loi-khuyen
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n41
  cau: "Tiêu đề lời khuyên 1 (dùng IQ để hiểu điểm mạnh–yếu, không để dán nhãn): Vững chắc."
  loai: nhan
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n42
  cau: Hiệu ứng Flynn cho thấy điểm số của cả thế hệ có thể dịch chuyển khi môi trường thay đổi; mỗi năm đi học thêm làm điểm IQ tăng khoảng 1–5 điểm; bằng chứng về việc môi trường thiếu thốn "chặn" tiềm năng di truyền chưa nhất quán.
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n43
  cau: "Tiêu đề lời khuyên 2 (điểm IQ không phải án chung thân): Khá vững."
  loai: nhan
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n44
  cau: "Điểm IQ chỉ có nghĩa khi so với nhóm chuẩn hóa của chính bài test: điểm 100 là trung bình của nhóm ấy; bài test không công bố cách chuẩn hóa thì con số không thể so với chuẩn IQ 100."
  loai: loi-khuyen
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n45
  cau: 'Tiêu đề lời khuyên 3 (cảnh giác với "test IQ online"): Vững chắc.'
  loai: nhan
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n46
  cau: IQ liên hệ với hiệu suất công việc (r = .53 theo đánh giá của cấp trên) nhưng chỉ giải thích dưới một nửa phương sai của kết quả công việc, và các đặc điểm khác như kỹ năng giao tiếp, tính cách có thể quan trọng ngang hoặc hơn.
  loai: loi-khuyen
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n47
  cau: "Tiêu đề lời khuyên 4 (IQ chỉ là một phần của câu chuyện): Khá vững."
  loai: nhan
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n48
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu công bố nào về khả năng dự báo của IQ (với học tập, nghề nghiệp, thu nhập) trên người Việt.
  loai: thoi-su
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n49
  cau: Mọi con số r = .56/.43/.20 trên trang đều đến từ các nghiên cứu ở nước ngoài.
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n50
  cau: Điểm IQ được tính theo nhóm chuẩn hóa của từng bài test (điểm 100 là trung bình của nhóm chuẩn hóa), và nhiều bài test phổ biến được chuẩn hóa ở các nước phương Tây; mang bài test chưa chuẩn hóa sang văn hóa khác rồi kết luận về "trí thông minh" của cả một dân tộc là sai lầm phương pháp.
  loai: loi-khuyen
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n51
  cau: 'Ngay cả bài "ít văn hóa" như ma trận Raven cũng không miễn nhiễm với môi trường: điểm Raven vẫn thay đổi mạnh theo thế hệ.'
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n52
  cau: Chưa có dữ liệu Việt Nam thì không kết luận gì về người Việt; chỉ có thể nói positive manifold nhiều khả năng cũng có ở người Việt, vì đã được thấy trong 97 mẫu từ 31 nước ngoài phương Tây.
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n53
  cau: IQ 130 nghĩa là bạn làm tốt hơn khoảng 98% nhóm chuẩn hóa.
  loai: so-lieu
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n54
  cau: "Tính di truyền 80% ở người trưởng thành không có nghĩa môi trường chỉ đóng góp 20% vào trí tuệ của một cá nhân: heritability nói về nguồn gốc của khác biệt giữa mọi người trong quần thể, và tính trong một môi trường cụ thể."
  loai: dinh-nghia
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n55
  cau: Thứ bậc nhận thức tương đối khá ổn định và càng ổn định khi lớn tuổi; điểm tuyệt đối của cả thế hệ có thể tăng (hiệu ứng Flynn); mỗi năm đi học thêm làm điểm tăng khoảng 1–5 điểm.
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n56
  cau: IQ là một yếu tố dự báo khá mạnh kết quả học tập và công việc, nhưng không vượt trội hẳn so với điểm học bạ hay hoàn cảnh gia đình; EQ và IQ đo hai thứ khác nhau và không thay thế nhau.
  loai: phat-hien
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n58
  cau: "Quiz 1–5: positive manifold là xu hướng điểm các bài kiểm tra nhận thức khác nhau tương quan dương; Strenze: IQ tương quan mạnh nhất với học vấn (.56), rồi nghề nghiệp (.43), thu nhập .20; r = .20 nghĩa là giải thích khoảng 4%; hiệu ứng Flynn là bằng chứng cho môi trường (Pietschnig và Voracek: gần 4 triệu người, 31 nước); heritability là thống kê về quần thể trong một môi trường, tăng theo tuổi."
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n1
  cau: Ulric Neisser (1997) từng đứng đầu nhóm chuyên gia của Hiệp hội Tâm lý Hoa Kỳ về vấn đề trí thông minh.
  loai: lich-su
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n2
  cau: Nếu chấm trẻ em Mỹ năm 1932 theo chuẩn của năm 1997, điểm trung bình của chúng chỉ khoảng 80.
  loai: so-lieu
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n3
  cau: Gần như không em nào năm 1932 đạt mức "rất xuất sắc", còn gần một phần tư sẽ bị xếp loại "kém" (IQ dưới 70).
  loai: so-lieu
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n4
  cau: "Suốt thế kỷ 20, điểm IQ trung bình ở hàng chục quốc gia tăng đều đặn khoảng 3 điểm mỗi thập kỷ: mỗi thế hệ làm cùng một bài đạt điểm cao hơn thế hệ trước."
  loai: so-lieu
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n5
  cau: "Hiệu ứng Flynn là hiện tượng có tên: điểm kiểm tra IQ trung bình tăng qua các thế hệ."
  loai: dinh-nghia
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n6
  cau: Năm 1984, James R. Flynn, nhà nghiên cứu ở Đại học Otago (New Zealand), so sánh điểm của người Mỹ trên cùng các bài kiểm tra IQ qua các lần chuẩn hóa khác nhau và phát hiện điểm tăng theo thời gian.
  loai: lich-su
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n7
  cau: Cùng một loại bài kiểm tra, người làm bài vào thập niên 1970 đạt điểm cao hơn hẳn so với chuẩn của thập niên 1930.
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n8
  cau: Điều này đi ngược giả thuyết trước đó rằng IQ của dân số đang giảm vì những người điểm thấp sinh nhiều con hơn.
  loai: lich-su
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n9
  cau: Flynn thu thập thêm dữ liệu từ nhiều quốc gia, công bố hai bài báo nền tảng (1984, 1987), và hiện tượng về sau được gọi là hiệu ứng Flynn.
  loai: lich-su
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n10
  cau: Flynn (1984) so sánh điểm của người Mỹ trên cùng các bài kiểm tra IQ (Stanford-Binet, Wechsler) qua các lần chuẩn hóa khác nhau, từ 1932 đến 1978.
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n11
  cau: Điểm IQ trung bình tăng tổng cộng 13,8 điểm trong 46 năm.
  loai: so-lieu
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n12
  cau: Mức tăng của Flynn (1984) tương đương khoảng 3 điểm mỗi thập kỷ (13,8 điểm chia 4,6 thập kỷ ≈ 3,0).
  loai: so-lieu
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n13
  cau: Người Mỹ năm 1978 chấm theo chuẩn năm 1932 sẽ có IQ trung bình gần 114 thay vì 100.
  loai: so-lieu
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n14
  cau: Flynn (1987) mở rộng ra 14 quốc gia, so sánh điểm qua thời gian trên nhiều loại bài kiểm tra khác nhau.
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n15
  cau: Ở cả 14 nước điểm đều tăng, từ 5 đến 25 điểm chỉ trong một thế hệ.
  loai: so-lieu
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n16
  cau: Mức tăng thuộc loại lớn nhất xuất hiện ở các bài suy luận trừu tượng như ma trận Raven, bài kiểm tra bằng hình ảnh được thiết kế để ít phụ thuộc văn hóa.
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n17
  cau: Thanh niên Hà Lan 18 tuổi tăng hơn 20 điểm trong 30 năm (1952–1982) trên bài kiểm tra dạng Raven, khoảng 7 điểm mỗi thập kỷ.
  loai: so-lieu
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n18
  cau: Mức tăng ở Hà Lan (khoảng 7 điểm mỗi thập kỷ) gấp đôi mức khoảng 3 điểm mỗi thập kỷ ở Mỹ.
  loai: so-lieu
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n19
  cau: Chi tiết này gây bất ngờ vì Raven vốn được thiết kế để ít phụ thuộc văn hóa.
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n20
  cau: "Pietschnig và Voracek (2015) là phân tích tổng hợp chính thức đầu tiên về hiệu ứng Flynn: 271 mẫu độc lập, gần 4 triệu người, 31 quốc gia, giai đoạn 1909–2013."
  loai: so-lieu
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n21
  cau: Mức tăng trung bình toàn cầu là 2,8 điểm mỗi thập kỷ; trí thông minh lưu động tăng 0,41 điểm mỗi năm, gấp đôi trí thông minh kết tinh (0,21 điểm mỗi năm).
  loai: so-lieu
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n22
  cau: Mức tăng mạnh hơn ở người trưởng thành so với trẻ em, và đã giảm dần trong những thập niên gần đây.
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n23
  cau: Sundet và cộng sự (2004) dùng điểm ba bài kiểm tra (ngôn ngữ, toán, dạng Raven) của nam thanh niên Na Uy trong diện nghĩa vụ quân sự từ giữa thập niên 1950 đến năm 2002; bài ngôn ngữ và bài dạng Raven giữ nguyên từ 1954, bài toán đổi từ trả lời tự do sang trắc nghiệm giữa thập niên 1990.
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n24
  cau: Điểm tăng mạnh từ giữa thập niên 1950 đến cuối thập niên 1960, sau đó chậm dần và dừng hẳn từ giữa thập niên 1990; từ đầu thập niên 1970 gần như toàn bộ mức tăng còn lại đến từ bài dạng Raven, rồi bài này cũng ngừng tăng vào cuối thập niên 1990.
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n25
  cau: Bratsberg và Rogeberg (2018) phân tích dữ liệu đăng ký hành chính và điểm kiểm tra nhận thức trong nghĩa vụ quân sự của nam giới Na Uy, ba thập niên lứa sinh (1962–1991), so sánh cả giữa các anh em trai trong một gia đình.
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n26
  cau: Điểm tăng ở các lứa sinh đến khoảng giữa thập niên 1970, sau đó giảm đều ở các lứa sinh tiếp theo, và mức giảm xuất hiện ngay cả giữa các anh em trai cùng một nhà.
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n27
  cau: Kết quả loại trừ các giải thích dựa trên khác biệt giữa các gia đình, như sinh sản kém ưu thế hay nhập cư; theo các tác giả, cả hiệu ứng Flynn lẫn sự đảo chiều đều do môi trường gây ra.
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n28
  cau: Ở Đan Mạch, điểm của hơn 500.000 nam thanh niên (kiểm tra 1959–2004) đạt đỉnh vào cuối thập niên 1990 rồi giảm vừa phải.
  loai: so-lieu
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n29
  cau: 'Khung "Vững chắc": điểm kiểm tra IQ tăng khoảng 3 điểm mỗi thập kỷ suốt thế kỷ 20.'
  loai: nhan
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n30
  cau: "Trahan và cộng sự (2014): 2,31 điểm mỗi thập kỷ trên 285 nghiên cứu; 2,93 với các bản Stanford-Binet và Wechsler từ năm 1972."
  loai: so-lieu
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n31
  cau: 'Khung "Khá vững": tăng mạnh nhất ở các bài suy luận trừu tượng (Raven, trí thông minh lưu động).'
  loai: nhan
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n32
  cau: 'Khung "Đang tranh cãi": nguyên nhân của hiệu ứng Flynn là gì (bốn họ giải thích: giáo dục, dinh dưỡng–sức khỏe, môi trường nhận thức, quen với bài kiểm tra).'
  loai: nhan
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n33
  cau: 'Khung "Đang tranh cãi": hiệu ứng Flynn có đang đảo chiều không.'
  loai: nhan
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n34
  cau: "Dickens và Flynn (2001) giải thích nghịch lý IQ có tính di truyền cao nhưng điểm trung bình của quần thể tăng nhanh bằng mô hình bội số xã hội: lợi thế ban đầu nhỏ làm đứa trẻ tự chọn và được đặt vào môi trường nhận thức phong phú hơn, môi trường đó khuếch đại lợi thế, nên thay đổi môi trường nhỏ có thể được nhân lên ở cấp quần thể."
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n35
  cau: "Giáo dục: trẻ em ngày nay đi học lâu hơn; một phân tích tổng hợp ước tính mỗi năm đi học thêm tăng 1–5 điểm IQ."
  loai: so-lieu
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n36
  cau: "Điểm yếu của giải thích giáo dục: các bài gần với kiến thức học ở trường nhất (từ vựng, số học, kiến thức chung) lại tăng điểm ít nhất."
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n37
  cau: Dinh dưỡng, y tế tốt hơn, ít bệnh tật và ít phơi nhiễm chì là những yếu tố đã được đề xuất; ở Na Uy, mức tăng chiều cao tương quan chặt với mức tăng điểm cho đến khi chiều cao ngừng tăng cuối thập niên 1980.
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n38
  cau: Pietschnig và Voracek (2015) cho rằng các yếu tố gắn với "tốc độ lịch sử sống" (gia đình ít con hơn, dinh dưỡng và y tế tốt hơn) dường như là nguyên nhân chính của quỹ đạo chung của hiệu ứng.
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n39
  cau: Dickens và Flynn (2001) lập luận rằng công nghiệp hóa, công nghệ và nghề nghiệp ngày càng đòi hỏi nhiều hơn ở nhận thức, và con người tự chọn hay được đặt vào môi trường đòi hỏi hơn, đúng kiểu tư duy mà bài Raven đo; cách hiểu này nhấn mạnh thói quen tư duy thay đổi chứ không phải não bộ "tốt hơn".
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n40
  cau: Quen thuộc với bài kiểm tra có thể làm một phần điểm tăng, nhưng người làm lại cùng một bài chỉ tăng khoảng 5–6 điểm và các giải thích dựa vào học đường dự đoán mức tăng lớn nhất ở bài gần chương trình học, trái với dữ liệu, nên giải thích này không đủ.
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n41
  cau: "Vì điểm trung bình tăng khoảng 3 điểm mỗi thập kỷ, bài kiểm tra dùng chuẩn cũ làm điểm số bị thổi phồng: IQ 100 theo chuẩn năm 1980 có thể chỉ tương đương khoảng 91 theo chuẩn năm 2010; vì vậy các bài kiểm tra uy tín phải chuẩn hóa lại định kỳ."
  loai: loi-khuyen
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n42
  cau: "Tiêu đề lời khuyên 1 (điểm IQ chỉ có ý nghĩa khi so với chuẩn cùng thời): Vững chắc."
  loai: nhan
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n43
  cau: Mức tăng lớn nhất là ở các bài suy luận trừu tượng như Raven, còn các bài gần kiến thức học ở trường tăng ít nhất (Neisser, 1997); Flynn (1987) đề nghị gọi điều bài IQ đo là "khả năng giải quyết vấn đề trừu tượng", vì chưa biết nó phản ánh trí thông minh đời thực đến đâu.
  loai: loi-khuyen
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n44
  cau: 'Tiêu đề lời khuyên 2 (đừng đồng nhất điểm kiểm tra với "trí thông minh"): Khá vững.'
  loai: nhan
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n45
  cau: Các tít báo về "đảo chiều Flynn" thường dựa trên dữ liệu của vài nước Bắc Âu, trên nam thanh niên trong diện nghĩa vụ, với mức giảm chỉ vài điểm, nhỏ hơn nhiều so với mức tăng hàng chục điểm của thế kỷ 20; theo Bratsberg và Rogeberg (2018), nguyên nhân là môi trường, từ đó suy ra đây không phải sự suy thoái di truyền không thể đảo ngược.
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n46
  cau: 'Tiêu đề lời khuyên 3 (đọc tin "giới trẻ ngày càng kém thông minh" tỉnh táo): Khá vững.'
  loai: nhan
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n47
  cau: Ở một vùng nông thôn Kenya điểm của trẻ em tăng rõ chỉ trong 14 năm (1984–1998), mạnh nhất ở ma trận Raven.
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n48
  cau: "Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào đo lường hiệu ứng Flynn trên người Việt: không thấy dữ liệu công bố về xu hướng điểm kiểm tra nhận thức qua các thế hệ."
  loai: thoi-su
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n49
  cau: Nếu giáo dục và dinh dưỡng cải thiện, mô hình của các nghiên cứu ở nơi khác gợi ý điểm có thể tăng; đó mới chỉ là dự đoán.
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n50
  cau: "Điểm IQ tăng không có nghĩa gene của loài người tốt lên: vốn gen của cả quần thể khó thay đổi đáng kể trong vài thập niên, còn hiệu ứng Flynn diễn ra đúng trong khoảng thời gian ấy; các bằng chứng, đặc biệt thiết kế so sánh anh em của Bratsberg và Rogeberg, chỉ về môi trường."
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n51
  cau: 'Giả thuyết "chỉ do quen với bài kiểm tra" chưa được chứng minh là giải thích duy nhất: mức tăng lớn (hơn 20 điểm ở Hà Lan trên bài dạng Raven), việc làm lại cùng một bài chỉ tăng khoảng 5–6 điểm, và mức tăng chiều cao tương quan với mức tăng điểm ở Na Uy gợi ý rằng không chỉ là kỹ năng làm bài.'
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n52
  cau: "Làm bài Raven giỏi hơn không có nghĩa giỏi mọi thứ khác: tăng điểm tập trung ở tư duy trừu tượng dạng bài kiểm tra; phân tích tổng hợp của Pietschnig và Voracek (2015) thấy mức tăng dường như không nằm ở yếu tố trí thông minh chung (g)."
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n53
  cau: 'Chưa có cơ sở nói hiệu ứng Flynn đã kết thúc hay đảo chiều trên toàn thế giới: dữ liệu chững lại hay giảm đến từ một số nước phát triển (chủ yếu Bắc Âu); ở một số nơi khác điểm vẫn tăng; Pietschnig và Voracek (2015) ghi nhận mức tăng giảm dần ở cấp toàn cầu, tức "chậm lại", chưa phải "đảo chiều".'
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n55
  cau: "Quiz 1: hiệu ứng Flynn là điểm kiểm tra IQ trung bình tăng khoảng 3 điểm mỗi thập kỷ suốt thế kỷ 20 ở hàng chục quốc gia; đây là thay đổi giữa các thế hệ, không phải trong đời một cá nhân."
  loai: so-lieu
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n56
  cau: "Quiz 2: theo Pietschnig và Voracek (2015) mức tăng mạnh nhất ở bài suy luận trừu tượng (trí thông minh lưu động, 0,41 điểm mỗi năm, gấp đôi kết tinh)."
  loai: so-lieu
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n57
  cau: "Quiz 3: hiệu ứng Flynn không mâu thuẫn với tính di truyền cao vì tính di truyền đo khác biệt giữa các cá nhân trong cùng một thế hệ, còn hiệu ứng Flynn là thay đổi trung bình của quần thể giữa các thế hệ; mô hình bội số xã hội cho thấy thay đổi nhỏ của môi trường có thể được khuếch đại."
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n58
  cau: "Quiz 4: Bratsberg và Rogeberg (2018) thấy mức giảm điểm xuất hiện ngay cả giữa các anh em trai cùng nhà, loại trừ các giải thích dựa trên khác biệt giữa các gia đình (sinh sản kém ưu thế, nhập cư), cho thấy nguyên nhân là môi trường; so sánh trong gia đình là thiết kế chính."
  loai: phat-hien
- trang: kham-pha/tri-tue/hieu-ung-flynn
  id: n59
  cau: 'Quiz 5: điểm kiểm tra tăng không đồng nghĩa con người thông minh hơn theo mọi nghĩa vì mức tăng lớn nhất ở suy luận trừu tượng dạng bài kiểm tra (Raven), bài gần kiến thức học ở trường tăng ít nhất; Flynn đề nghị gọi điều bài IQ đo là "khả năng giải quyết vấn đề trừu tượng".'
  loai: phat-hien
