- trang: ho-tro/index
  id: n1
  cau: "Nếu bạn hoặc ai đó đang gặp nguy hiểm ngay lúc này: gọi Cấp cứu 115, hoặc đến khoa cấp cứu của bệnh viện gần nhất."
  loai: loi-khuyen
- trang: ho-tro/index
  id: n2
  cau: 115 là số Cấp cứu (cấp cứu y tế).
  loai: thoi-su
- trang: ho-tro/index
  id: n3
  cau: "Nếu có nguy cơ bạo lực: gọi Công an 113."
  loai: thoi-su
- trang: ho-tro/index
  id: n4
  cau: Nếu không muốn ở một mình, hãy gọi hoặc nhắn cho một người bạn tin tưởng và nhờ họ ở bên bạn.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n5
  cau: Các cuộc gọi đến 113, 114, 115 được miễn phí.
  loai: thoi-su
- trang: ho-tro/index
  id: n6
  cau: Bạn không cần phải "đủ nặng" mới được tìm sự giúp đỡ. Nếu điều gì đó đang làm bạn khổ sở, việc tìm người nói chuyện là hợp lý.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n9
  cau: 115 dành cho mọi trường hợp nguy hiểm đến tính mạng, kể cả nguy cơ tự làm hại.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n10
  cau: "115: 24/7, miễn phí."
  loai: thoi-su
- trang: ho-tro/index
  id: n11
  cau: 113 dành cho nguy cơ bạo lực, cần can thiệp khẩn cấp.
  loai: thoi-su
- trang: ho-tro/index
  id: n12
  cau: "113: 24/7."
  loai: thoi-su
- trang: ho-tro/index
  id: n13
  cau: "Tổng đài quốc gia bảo vệ trẻ em: số 111."
  loai: thoi-su
- trang: ho-tro/index
  id: n14
  cau: 111 dành cho trẻ em, và người lớn lo lắng cho một trẻ em (bị xâm hại, bạo lực, bỏ rơi…).
  loai: thoi-su
- trang: ho-tro/index
  id: n15
  cau: Tổng đài 111 do Cục Bà mẹ và Trẻ em, Bộ Y tế vận hành.
  loai: thoi-su
- trang: ho-tro/index
  id: n16
  cau: "111: 24/7, miễn phí."
  loai: thoi-su
- trang: ho-tro/index
  id: n17
  cau: "Đường dây nóng Ngày Mai: 096 306 1414."
  loai: thoi-su
- trang: ho-tro/index
  id: n18
  cau: "Ngày Mai dành cho: sơ cứu và hỗ trợ tâm lý qua điện thoại cho người trầm cảm và người thân của họ."
  loai: thoi-su
- trang: ho-tro/index
  id: n19
  cau: Ngày Mai do một nhóm tình nguyện viên vận hành.
  loai: thoi-su
- trang: ho-tro/index
  id: n20
  cau: "Ngày Mai: 13:00–20:30, Thứ Tư đến Chủ nhật."
  loai: thoi-su
- trang: ho-tro/index
  id: n21
  cau: "Ngày Mai: dịch vụ miễn phí."
  loai: thoi-su
- trang: ho-tro/index
  id: n22
  cau: "CSAGA: 024 3333 5599."
  loai: thoi-su
- trang: ho-tro/index
  id: n23
  cau: "CSAGA: tư vấn miễn phí cho người bị bạo lực gia đình, bạo lực trên cơ sở giới; cộng đồng LGBTQ+."
  loai: thoi-su
- trang: ho-tro/index
  id: n24
  cau: Trang của CSAGA không ghi giờ trực; hãy hỏi khi gọi.
  loai: thoi-su
- trang: ho-tro/index
  id: n25
  cau: Tính đến tháng 10/2026, chúng tôi chưa tìm thấy đường dây quốc gia 24/7 dành riêng cho sức khỏe tâm thần người lớn hay phòng chống tự sát ở Việt Nam.
  loai: thoi-su
- trang: ho-tro/index
  id: n26
  cau: Ngoài giờ làm việc của các đường dây trên, nếu có nguy cơ tự làm hại, hãy gọi 115 hoặc đến khoa cấp cứu.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n27
  cau: Danh bạ quốc tế Find A Helpline liệt kê thêm một số dịch vụ ở Việt Nam; thông tin trên đó do tổ chức khác tổng hợp.
  loai: thoi-su
- trang: ho-tro/index
  id: n28
  cau: Các số dưới đây là số tổng đài hay số điện thoại chung mà bệnh viện công bố trên trang web của mình.
  loai: thoi-su
- trang: ho-tro/index
  id: n29
  cau: Các số bệnh viện này không phải đường dây khủng hoảng.
  loai: thoi-su
- trang: ho-tro/index
  id: n30
  cau: "Bệnh viện Tâm thần Trung ương 1 (Hà Nội): 024 3385 3227."
  loai: thoi-su
- trang: ho-tro/index
  id: n31
  cau: "Viện Sức khỏe Tâm thần, Bệnh viện Bạch Mai (Hà Nội): 024 3576 5344."
  loai: thoi-su
- trang: ho-tro/index
  id: n32
  cau: "Bệnh viện Tâm thần Trung ương 2 (Đồng Nai): 0251 3822 965."
  loai: thoi-su
- trang: ho-tro/index
  id: n33
  cau: "Bệnh viện Tâm thần TP.HCM: 028 3923 4675."
  loai: thoi-su
- trang: ho-tro/index
  id: n34
  cau: Bệnh viện đa khoa gần nơi bạn ở có thể có khoa tâm thần hoặc khoa tâm lý; hãy gọi hỏi trước.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n35
  cau: Sau đợt sắp xếp đơn vị hành chính năm 2025, địa chỉ trên một số trang web vẫn ghi theo địa giới cũ; hãy kiểm tra lại trước khi đến.
  loai: thoi-su
- trang: ho-tro/index
  id: n36
  cau: Buồn, lo lắng, căng thẳng là một phần bình thường của cuộc sống. Chúng không tự động là dấu hiệu của rối loạn.
  loai: lam-sang
- trang: ho-tro/index
  id: n37
  cau: Nên cân nhắc tìm chuyên gia khi cảm giác buồn bã, trống rỗng, lo âu hay căng thẳng kéo dài từ hai tuần trở lên và không dịu đi.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n38
  cau: Nên cân nhắc tìm chuyên gia khi nó ảnh hưởng rõ đến việc học, công việc, giấc ngủ, ăn uống hay các mối quan hệ.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n39
  cau: Nên cân nhắc tìm chuyên gia khi bạn dùng rượu hay chất kích thích ngày càng nhiều.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n40
  cau: Nên cân nhắc tìm chuyên gia khi người thân nói rằng bạn thay đổi nhiều.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n41
  cau: Khi có ý nghĩ tự làm hại bản thân hoặc nghĩ rằng mọi người sẽ tốt hơn nếu không có mình, hãy tìm giúp đỡ ngay, không cần chờ.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n43
  cau: Chỉ người có chuyên môn mới chẩn đoán được.
  loai: lam-sang
- trang: ho-tro/index
  id: n44
  cau: "Bác sĩ chuyên khoa tâm thần: đào tạo bác sĩ y khoa, chuyên khoa tâm thần."
  loai: dinh-nghia
- trang: ho-tro/index
  id: n45
  cau: "Nhà tâm lý lâm sàng: đào tạo chuyên ngành tâm lý lâm sàng."
  loai: dinh-nghia
- trang: ho-tro/index
  id: n46
  cau: "Tham vấn viên / chuyên viên tư vấn tâm lý: Luật Khám bệnh, chữa bệnh 2023 không đặt chuẩn đào tạo chung."
  loai: dinh-nghia
- trang: ho-tro/index
  id: n47
  cau: "Nhân viên công tác xã hội: đào tạo công tác xã hội, hoặc ngành gần như xã hội học, tâm lý học."
  loai: dinh-nghia
- trang: ho-tro/index
  id: n48
  cau: "Bác sĩ chuyên khoa tâm thần: giấy phép hành nghề bác sĩ."
  loai: thoi-su
- trang: ho-tro/index
  id: n49
  cau: Tâm lý lâm sàng là chức danh phải có giấy phép hành nghề theo Luật Khám bệnh, chữa bệnh 2023 (có hiệu lực từ 01/01/2024).
  loai: thoi-su
- trang: ho-tro/index
  id: n50
  cau: Tham vấn viên / chuyên viên tư vấn tâm lý không nằm trong các chức danh phải có giấy phép hành nghề của Luật Khám bệnh, chữa bệnh 2023.
  loai: thoi-su
- trang: ho-tro/index
  id: n51
  cau: "Nhân viên công tác xã hội: giấy chứng nhận đăng ký hành nghề công tác xã hội theo Nghị định 110/2024/NĐ-CP."
  loai: thoi-su
- trang: ho-tro/index
  id: n52
  cau: Bác sĩ chuyên khoa tâm thần được kê đơn thuốc.
  loai: thoi-su
- trang: ho-tro/index
  id: n53
  cau: Nhà tâm lý lâm sàng không kê đơn thuốc (theo quy định về kê đơn, người kê đơn là bác sĩ, y sĩ).
  loai: thoi-su
- trang: ho-tro/index
  id: n54
  cau: Tham vấn viên và nhân viên công tác xã hội không kê đơn thuốc.
  loai: thoi-su
- trang: ho-tro/index
  id: n55
  cau: Bác sĩ chuyên khoa tâm thần thường chẩn đoán, điều trị bằng thuốc và các phương pháp khác, chỉ định nhập viện khi cần.
  loai: dinh-nghia
- trang: ho-tro/index
  id: n56
  cau: Nhà tâm lý lâm sàng thường đánh giá tâm lý, trị liệu tâm lý.
  loai: dinh-nghia
- trang: ho-tro/index
  id: n57
  cau: Tham vấn viên / chuyên viên tư vấn tâm lý thường lắng nghe, hỗ trợ, tư vấn.
  loai: dinh-nghia
- trang: ho-tro/index
  id: n58
  cau: Nhân viên công tác xã hội thường kết nối dịch vụ, hỗ trợ và bảo vệ người yếu thế.
  loai: dinh-nghia
- trang: ho-tro/index
  id: n59
  cau: Theo Nghị định 96/2023/NĐ-CP, để được cấp giấy phép, nhà tâm lý lâm sàng phải có 9 tháng thực hành khám bệnh, chữa bệnh.
  loai: thoi-su
- trang: ho-tro/index
  id: n60
  cau: Hỏi về đào tạo, giấy phép hoặc chứng chỉ hành nghề.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n61
  cau: Hỏi về chi phí, thời lượng mỗi buổi và cách họ bảo mật thông tin của bạn.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n62
  cau: Thận trọng với nơi hứa "chữa khỏi" nhanh chóng, cam kết kết quả, hoặc chỉ dựa vào một bài trắc nghiệm.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n63
  cau: Nếu bạn không thấy hợp với một người, việc tìm người khác là bình thường.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n64
  cau: Lắng nghe trước, khuyên sau. Cho họ biết bạn sẵn sàng nghe.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n65
  cau: Tránh phán xét ("Có gì đâu mà buồn", "Cố lên là được").
  loai: loi-khuyen
- trang: ho-tro/index
  id: n66
  cau: Một tổng quan các nghiên cứu cho thấy việc hỏi về ý nghĩ tự sát không làm tăng ý nghĩ đó (Dazzi và cộng sự, 2014).
  loai: phat-hien
- trang: ho-tro/index
  id: n67
  cau: Hỏi thẳng nếu bạn lo họ có ý nghĩ tự làm hại.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n68
  cau: "Khuyến khích và giúp họ tìm chuyên gia: cùng tìm thông tin, đặt lịch, đi cùng."
  loai: loi-khuyen
- trang: ho-tro/index
  id: n69
  cau: Nếu có nguy hiểm ngay, gọi 115 và ở bên họ.
  loai: loi-khuyen
- trang: ho-tro/index
  id: n70
  cau: Chăm sóc chính bạn. Hỗ trợ người khác rất tốn sức; bạn cũng xứng đáng được giúp.
  loai: loi-khuyen
