- trang: kham-pha/tri-nho/duong-cong-quen
  id: n1
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/0033-2909.132.3.354
  - https://doi.org/10.1111/j.1467-9280.2006.01693.x
  trich: 'Cepeda 2006: spaced > massed; R&K 2006: STTT 61% vs SSSS 40% sau 1 tuần.'
  ghi_chu: Gộp ý của hai bài đã mở.
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n2
  luot_2: qua-manh
  nguon:
  - https://doi.org/10.1037/0033-2909.132.3.354
  - https://doi.org/10.1111/j.1467-9280.2008.02209.x
  trich: 'Cepeda 2006: "there is no hint that massed presentation was preferable to spaced, whether retention interval was very short (less than 1 min) or very long"; Cepeda 2008: nén học vào khoảng quá
    ngắn cho "misleadingly high levels of immediate mastery".'
  ghi_chu: 'Phần "một tuần sau Bình nhớ tốt hơn" đúng. Phần "ngay sau khi học An có thể làm tốt hơn" không có trong dữ liệu tổng hợp: Cepeda 2006 thấy học rải hơn học dồn cả ở khoảng giữ dưới 1 phút (+9%);
    chỉ vài trong 271 phép so sánh không thấy lợi (12/271). Lợi thế tức thời của học dồn chỉ thấy ở khoảng giữ vài giây (Peterson).'
  cau_dung: Một tuần sau, nhiều khả năng Bình (học rải) nhớ tốt hơn An (học dồn); ngay sau khi học, hai bạn có thể ngang nhau, và học dồn chỉ tạo cảm giác thành thạo cao hơn thực tế (Cepeda 2006, 2008).
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n3
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/0033-2909.132.3.354
  trich: 839 assessments of distributed practice in 317 experiments located in 184 articles.
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n5
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/0033-2909.132.3.354
  trich: Cepeda 2006 định nghĩa massed (lag dưới 1 s) và spaced/distributed.
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n6
  luot_2: dung
  nguon:
  - https://doi.org/10.1111/j.1467-9280.2006.01693.x
  - https://doi.org/10.1111/j.1467-9280.2008.02209.x
  trich: 'R&K: nhóm SSSS tự tin nhất (4,8) nhưng nhớ kém nhất sau 1 tuần (40%); Cepeda 2008: "misleadingly high levels of immediate mastery".'
  ghi_chu: '"Không dự báo được" hơi mạnh nhưng được R&K đo trực tiếp (dự đoán ngược với kết quả).'
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n7
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Ebbinghaus/memory8.htm
  trich: Ebbinghaus tự làm đối tượng duy nhất; âm tiết vô nghĩa; phương pháp tiết kiệm.
  ghi_chu: Đọc chương VIII và các chương khác trên psychclassics; đặc điểm tự làm đối tượng và âm tiết vô nghĩa quen thuộc, chương VIII nói "for my own personality".
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n8
  luot_2: dung
  nguon:
  - https://psychclassics.yorku.ca/Ebbinghaus/memory8.htm
  trich: '"38 repetitions, distributed in a certain way over the three preceding days, had just as favorable an effect as 68 repetitions made on the day just previous."'
- trang: kham-pha/tri-nho/duong-cong-quen
  id: n9
  luot_2: qua-manh
  nguon:
  - https://doi.org/10.1037/0033-2909.132.3.354
  - https://psychclassics.yorku.ca/Ebbinghaus/memory8.htm
  trich: 'Cepeda 2006: nghiên cứu bắt đầu cuối thế kỷ 19 (Ebbinghaus 1885, Jost 1897, Thorndike 1912); Ebbinghaus tự thấy lợi ích rải học (chương VIII).'
  ghi_chu: 'Câu nói "phải hơn một thế kỷ sau mới trả lời được" mâu thuẫn với n8 và với lịch sử: Ebbinghaus đã thấy lợi ích của rải học, nghiên cứu liên tục từ Jost 1897. Điều hơn một thế kỷ chưa trả lời
    được là khoảng cách tối ưu (Cepeda 2008: vẫn chưa nói chắc được).'
  cau_dung: Ebbinghaus (1885) đã thấy lợi ích của rải học; qua hơn một thế kỷ nghiên cứu, hàng trăm thí nghiệm (317 trong Cepeda 2006) xác nhận hiệu ứng, và các nghiên cứu như Cepeda 2008 mới bắt đầu đo
    khoảng cách tối ưu.
