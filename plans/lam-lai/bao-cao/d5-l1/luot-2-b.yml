  ghi_chu: Tóm tắt thứ cấp (không mở được) của Baddeley, Lewis, Vallar 1984 cho rằng ức chế xóa hiệu ứng độ dài từ cả với trình bày nghe nếu ức chế ở cả lúc học và nhớ lại; câu "vẫn còn với tài liệu nghe"
    có thể sai hay thiếu điều kiện. Cần mở BTB 1975 và BLV 1984. Chỗ cần Opus xem.
