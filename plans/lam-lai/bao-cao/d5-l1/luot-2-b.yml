  id: n35
  luot_2: qua-manh
  nguon:
  - https://doi.org/10.1017/S0140525X01003922
  trich: 'Cowan: hiệu ứng độ dài từ còn khi tập lớn, bị xóa bởi ức chế và bị giải thích bằng LTM; Cowan 2001 nêu nhiều điều kiện cần.'
  ghi_chu: Giống âm làm nhớ kém rất vững; "từ dài thì nhớ ít" thì cơ chế và tính tổng quát còn tranh cãi (n26 trên cùng trang), chưa tìm tái lập lớn hay phân tích tổng hợp.
  cau_dung: 'Khá vững: ngắn hạn cho lời nói phụ thuộc mạnh vào âm thanh (giống âm thì nhớ kém); hiệu ứng độ dài từ thấy được nhưng còn tranh cãi về cơ chế.'
