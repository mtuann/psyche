  luot_2: qua-manh
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1016/j.jsp.2018.10.007&resultType=core"]
  trich: "numerous empirical studies and reviews have challenged long-standing assumptions about the utility of these methods ... new and continued concerns with the use of these methods"
  cau_dung: "Tiêu đề lời khuyên 1 (đừng dùng IQ để dán nhãn; diễn giải điểm thành phần cần thận trọng): Khá vững."
  ghi_chu: "Vế 'không dán nhãn' có cơ sở; vế 'dùng IQ để hiểu điểm mạnh–yếu' là phân tích hồ sơ, đang bị tranh cãi, nên toàn tiêu đề không đạt Vững chắc."
