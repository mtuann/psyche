  trich: "This first formal meta-analysis on the topic ... 271 independent samples, totaling almost 4 million participants, from 31 countries"
  cau_dung: "Pietschnig và Voracek (2015) là một phân tích tổng hợp lớn về hiệu ứng Flynn (các tác giả gọi là phân tích tổng hợp chính thức đầu tiên): 271 mẫu độc lập, gần 4 triệu người, 31 quốc gia, giai đoạn 1909–2013."
  ghi_chu: "Như tri-tue-la-gi n24: số đúng, nhưng Trahan và cộng sự (2014) đã đăng phân tích tổng hợp về hiệu ứng Flynn trước đó; 'đầu tiên' là lời tự nhận của tác giả."
