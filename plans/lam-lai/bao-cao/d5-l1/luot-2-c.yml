- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n1
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf", "https://web.archive.org/web/20161104214157/http://www.americanscientist.org/issues/feature/rising-scores-on-intelligence-tests/99999"]
  trich: "It is widely agreed that standardized tests do not sample all forms of intelligence. Obvious examples include creativity, wisdom, practical sense, and social sensitivity ... Successful school learning depends on many personal characteristics other than intelligence, such as persistence"
  ghi_chu: "Neisser 1996 nêu sáng tạo, óc thực tế, nhạy cảm xã hội nằm ngoài bài test và kiên trì là đặc điểm khác trí tuệ; 'tháo vát', 'thuyết phục' không có nguyên văn nhưng cùng tinh thần (practical sense, social sensitivity)."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n2
  luot_2: dung
  nguon: ["http://psychclassics.yorku.ca/Spearman/chap5.htm"]
  trich: "Discrimination correlates with Talent in the four branches of study, Classics, French, English, and Mathematics, by an average of 0.51 ... Musical Talent ... is not only correlated with all the other functions"
  ghi_chu: "Phân biệt ánh sáng, trọng lượng ở các loạt thí nghiệm đầu; âm thanh (pitch), môn học và năng khiếu âm nhạc ở loạt IV; mọi tương quan báo cáo đều dương."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n3
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf"]
  trich: "all such correlations are typically positive and form what is called a \"positive manifold.\""
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n4
  luot_2: dung
  nguon: ["http://psychclassics.yorku.ca/Spearman/chap5.htm", "https://web.archive.org/web/20161104214157/http://www.americanscientist.org/issues/feature/rising-scores-on-intelligence-tests/99999"]
  trich: "all branches of intellectual activity have in common one fundamental function (or group of functions), whereas the remaining or specific elements of the activity seem in every case to be wholly different"
  ghi_chu: "Ký hiệu g, s và tên 'thuyết hai nhân tố' có sau 1904 (Neisser 1997: 'Spearman christened it g')."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n5
  luot_2: dung
  nguon: ["http://psychclassics.yorku.ca/Spearman/chap5.htm"]
  trich: "the central factor varies from less than 1/5 to over fifteen times the size of the accompanying specific one"
  ghi_chu: "Ví dụ minh họa đúng với mô hình chung + riêng của Spearman; không phải phát hiện thực nghiệm."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n6
  luot_2: dung
  nguon: ["https://web.archive.org/web/20161104214157/http://www.americanscientist.org/issues/feature/rising-scores-on-intelligence-tests/99999"]
  trich: "By convention, the mean of each age group in the standardization sample defines an IQ score of 100; by further convention, the standard deviation of the sample defines 15 IQ points."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n7
  luot_2: dung
  nguon: ["https://web.archive.org/web/20161104214157/http://www.americanscientist.org/issues/feature/rising-scores-on-intelligence-tests/99999"]
  trich: "about two-thirds of the population in any given age group will have IQs between 85 and 115 ... individuals with IQ scores over 130 ... about 2.25 percent of the population"
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n8
  luot_2: dung
  nguon: ["https://web.archive.org/web/20161104214157/http://www.americanscientist.org/issues/feature/rising-scores-on-intelligence-tests/99999"]
  trich: "IQ defined in this way reflects relative standing in an age group, not absolute achievement."
  ghi_chu: "Phần 'không phải thang tỉ lệ' chắc chắn đúng; IQ là thang thứ bậc hay khoảng thì giới đo lường còn bàn, nên có thể viết 'IQ cho biết thứ hạng tương đối, không phải thang tỉ lệ'."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n9
  luot_2: sai
  nguon: ["https://www.pearsonassessments.com/content/dam/school/global/clinical/us/assets/wais-5/wais-5-overview-brochure.pdf"]
  trich: "measures intellect and five cognitive domains — verbal comprehension, visual spatial, fluid reasoning, working memory, and processing speed"
  cau_dung: "Thang Wechsler dành cho người lớn bản thứ tư (WAIS-IV, 2008) cho bốn chỉ số: hiểu ngôn ngữ, lý luận tri giác, trí nhớ làm việc, tốc độ xử lý; bản thứ năm (WAIS-5, 2024) có năm chỉ số chính: hiểu ngôn ngữ, thị giác–không gian, lý luận lỏng, trí nhớ làm việc, tốc độ xử lý."
  ghi_chu: "Bốn chỉ số là của WAIS-IV (2008). WAIS-5 (Pearson, chuẩn hóa 2023–2024) có năm chỉ số chính: lý luận tri giác tách thành thị giác–không gian và lý luận lỏng."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n10
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.101.2.171.pdf", "https://web.archive.org/web/20161104214157/http://www.americanscientist.org/issues/feature/rising-scores-on-intelligence-tests/99999"]
  trich: "Some of the largest gains occur on culturally reduced tests and tests of fluid intelligence ... a (usually untimed) test of visual reasoning called Raven's Progressive Matrices"
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n11
  luot_2: dung
  nguon: ["http://psychclassics.yorku.ca/Spearman/chap5.htm"]
  trich: "this community being discovered between such diverse functions as in-school Cleverness, out-of-school Common Sense, Sensory Discrimination, and Musical Talent"
  ghi_chu: "'Óc thực tế' tương ứng Common Sense."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n12
  luot_2: dung
  nguon: ["http://psychclassics.yorku.ca/Spearman/chap5.htm", "https://web.archive.org/web/20161104214157/http://www.americanscientist.org/issues/feature/rising-scores-on-intelligence-tests/99999"]
  trich: "Early in this century, the British psychologist Charles Spearman made the first formal factor analyses of such correlation matrices. He concluded that a single common factor accounted for the positive correlations"
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n13
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1016%252Fj.indcrop.2012.02.030.zip/10.1016%252Fj.intell.2006.09.004.pdf"]
  trich: "The present paper conducted a meta-analysis of the longitudinal studies that have investigated intelligence as a predictor of success (as measured by education, occupation, and income)."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n14
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1016%252Fj.indcrop.2012.02.030.zip/10.1016%252Fj.intell.2006.09.004.pdf"]
  trich: "corrected ... correlations (ρ) are .56, .43, and .20, respectively"
  ghi_chu: "Là tương quan đã hiệu chỉnh sai số đo."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n15
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1016%252Fj.indcrop.2012.02.030.zip/10.1016%252Fj.intell.2006.09.004.pdf"]
  trich: "Intelligence (all studies) 59 84,828 .46 .48 .56"
  ghi_chu: "Phép tính .56² ≈ .31 và .20² = .04 đúng."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n16
  luot_2: dung
  nguon: ["https://gwern.net/doc/iq/2015-strenze.pdf", "https://api.openalex.org/works/doi:10.1037/apl0000994"]
  trich: "Job performance (supervisory rating) .53 425 32,124 Hunter and Hunter (1984) ... Creativity .17 447 Kim (2005) ... Happiness .05 19 2,546 DeNeve & Cooper (1998)"
  ghi_chu: "Số đúng như bảng 25.1 của Strenze 2015. Lưu ý: .53 là ước lượng của Hunter & Hunter 1984; Sackett và cộng sự (2022, J Appl Psychol) cho thấy hiệu chỉnh giới hạn khoảng đo trước đây bị làm quá, độ hiệu lực giảm khoảng .10–.20. Nên ghi nguồn gốc con số."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n17
  luot_2: dung
  nguon: ["https://gwern.net/doc/iq/2015-strenze.pdf"]
  trich: "Positive correlations with supervisory ratings of job performance (0.53) ... the correlation with happiness is only 0.05"
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n18
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4069230/"]
  trich: "We identified 150 combinations of time points and measures from 15 independent longitudinal samples ... monozygotic twin pairs raised apart ... adoptive sibling pairs"
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n19
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4069230/"]
  trich: "Cross-time correlations for genetic and shared environmental components were low during early childhood, increased sharply over child development, and remained relatively high from adolescence through late adulthood ... Increasing phenotypic stability over child development was almost entirely mediated by genetic factors."
  ghi_chu: "Bài nói cùng mẫu hình cho cả môi trường chung, câu chỉ nói gen nhưng không sai."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n20
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC2889158/"]
  trich: "increases significantly and linearly from 41% in childhood (9 years) to 55% in adolescence (12 years) and to 66% in young adulthood (17 years) in a sample of 11 000 pairs of twins from four countries"
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n21
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC2889158/"]
  trich: "as children grow up, they increasingly select, modify and even create their own experiences in part based on their genetic propensities"
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n22
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1046%252Fj.0001-2815.2002.00008.x.zip/10.1046%252Fj.0956-7976.2003.psci_1475.x.pdf"]
  trich: "a sample of 7-year-old twins from the National Collaborative Perinatal Project ... in impoverished families, 60% of the variance in IQ is accounted for by the shared environment, and the contribution of genes is close to zero"
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n23
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1371/journal.pone.0030320"]
  trich: "Using 8716 twin pairs from the Twins Early Development Study (TEDS) ... minimal evidence of GxE interaction across the eight ages"
  ghi_chu: "Đọc tóm tắt (OpenAlex) của Hanscombe và cộng sự 2012, PLoS One."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n24
  luot_2: qua-manh
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1177%252F1461444812470428.zip/10.1177%252F1745691615577701.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4152423/"]
  trich: "This first formal meta-analysis on the topic revealed worldwide IQ gains ... based on 271 independent samples, totaling almost 4 million participants, from 31 countries"
  cau_dung: "Pietschnig và Voracek (2015) là một phân tích tổng hợp lớn về hiệu ứng Flynn (các tác giả gọi là phân tích tổng hợp chính thức đầu tiên): 271 mẫu độc lập, gần 4 triệu người, 31 quốc gia, 1909–2013."
  ghi_chu: "Các con số đúng, nhưng 'đầu tiên' là lời tự mô tả của tác giả: Trahan và cộng sự (2014, Psychological Bulletin, 'The Flynn effect: a meta-analysis', 285 nghiên cứu) đã đăng trước đó."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n25
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1177%252F1461444812470428.zip/10.1177%252F1745691615577701.pdf"]
  trich: "estimated 0.41, 0.30, 0.28, and 0.21 IQ points annually for fluid, spatial, full-scale, and crystallized IQ test performance, respectively"
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n26
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1177%252F1461444812470428.zip/10.1177%252F1745691615577701.pdf", "https://web.archive.org/web/20161104214157/http://www.americanscientist.org/issues/feature/rising-scores-on-intelligence-tests/99999"]
  trich: "Factors associated with life history speed seem mainly responsible for the Flynn effect's general trajectory ... These gains are far too rapid to result from genetic changes."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n27
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf", "https://api.openalex.org/works/doi:10.1037/bul0000184"]
  trich: "all such correlations are typically positive and form what is called a \"positive manifold.\" ... g appears in many cultures and is likely a universal phenomenon in humans"
  ghi_chu: "Hiện tượng được ghi nhận nhất quán ở phương Tây và 97 mẫu ngoài phương Tây; đạt thước đo Vững chắc."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n28
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1037/bul0000184"]
  trich: "Across 97 samples from 31 countries totaling 52,340 individuals, we found that a single factor emerged unambiguously from 71 samples (73.2%) and that 23 of the remaining 26 samples (88.5%) produced a single second-order factor"
  ghi_chu: "Đọc tóm tắt (OpenAlex)."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n29
  luot_2: qua-manh
  nguon: ["https://gwern.net/doc/iq/2015-strenze.pdf", "https://api.openalex.org/works/doi:10.1037/apl0000994", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf"]
  trich: "Job performance (supervisory rating) .53 ... [Sackett 2022:] mean validity estimates reduced by .10-.20 points ... selection predictor-criterion relationships are considerably lower than previously thought"
  cau_dung: "Khung \"Khá vững\": IQ dự báo kết quả học tập và công việc ở mức vừa phải (r ≈ .5 với số năm học; với hiệu suất công việc khoảng .3–.5 tùy cách hiệu chỉnh)."
  ghi_chu: "Nhãn Khá vững hợp, nhưng khoảng r ≈ .4–.6 cho hiệu suất công việc dựa vào ước lượng cũ (Hunter & Hunter 1984, .53); phân tích lại của Sackett và cộng sự (2022) hạ độ hiệu lực của các phép tuyển chọn khoảng .10–.20. Với học vấn .56 (Strenze 2007) thì đúng."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n30
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6088505/"]
  trich: "we found consistent evidence for beneficial effects of education on cognitive abilities of approximately 1 to 5 IQ points for an additional year of education"
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n31
  luot_2: qua-manh
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC2889158/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1046%252Fj.0001-2815.2002.00008.x.zip/10.1046%252Fj.0956-7976.2003.psci_1475.x.pdf"]
  trich: "A figure called the \"heritability\" (h2) of the trait represents the proportion of that variation that is associated with genetic differences among the individuals ... Heritability does not imply immutability."
  cau_dung: "Khung \"Đang tranh cãi\": khác biệt IQ giữa người với người gắn với khác biệt gen đến mức nào (ước lượng thay đổi theo tuổi, quần thể và phương pháp)."
  ghi_chu: "Nhãn Đang tranh cãi chấp nhận được (ước lượng khác nhau theo tuổi, quần thể, phương pháp), nhưng chữ 'do gen quyết định' là cách nói nhân quả–định mệnh mà chính trang (n36, n54) bác; với chủ đề nhạy nên viết như tỉ lệ phương sai."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n32
  luot_2: dung
  nguon: ["https://gwern.net/doc/iq/2015-strenze.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1016%252Fj.indcrop.2012.02.030.zip/10.1016%252Fj.intell.2006.09.004.pdf"]
  trich: "Income .20 ... Happiness .05"
  ghi_chu: "Tương quan nhỏ với thu nhập và gần không với hạnh phúc trong các phân tích tổng hợp bác bỏ chữ 'đảm bảo'."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n33
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf"]
  trich: "such tests predict considerably less than half the variance of job-related measures. Other individual characteristics--interpersonal skills, aspects of personality, etc.--are probably of equal or greater importance"
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n34
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf"]
  trich: "a hierarchical arrangement with a general intelligence factor at the apex and various more specialized abilities arrayed below it"
  ghi_chu: "'Nổi tiếng nhất' là nhận xét, chấp nhận được."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n35
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4441622/"]
  trich: "convergent evidence from 48,537 Web participants and a comprehensive analysis of normative data from standardized IQ and memory tests ... considerable heterogeneity in when cognitive abilities peak"
  ghi_chu: "Từ vựng đạt đỉnh khoảng tuổi 50 trở lên trong dữ liệu của bài."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n36
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf"]
  trich: "it is not about the genes or environment of any particular person. We are concerned only with the observed variation of the trait across individuals in a given population ... A high heritability does not mean that the environment has no impact"
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n37
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf"]
  trich: "If the environment relevant to a given trait improves in a way that affects all members of the population equally, the mean value of the trait will rise without any change in its heritability ... Something of the sort may also be taking place for IQ scores--the so-called \"Flynn effect\""
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n38
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1016%252Fj.indcrop.2012.02.030.zip/10.1016%252Fj.intell.2006.02.004.pdf"]
  trich: "Howard Gardner introduced Multiple Intelligences (MI) theory in his 1983 book, Frames of Mind, proposing that there are several independent ability areas"
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n39
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1207.zip/10.1207%252Fs15326985ep4104_1.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1016%252Fj.indcrop.2012.02.030.zip/10.1016%252Fj.intell.2006.02.004.pdf"]
  trich: "theories lack adequate empirical support and should not be the basis for educational practice ... [Visser:] Factor analysis revealed a large g factor having substantial loadings for tests assessing purely cognitive abilities ... but lower loadings for tests of other abilities, especially Bodily-Kinesthetic"
  ghi_chu: "Visser: tải g thấp ở các bài vận động, âm nhạc, nội tâm; câu đã có 'nhất là các bài về năng lực nhận thức thuần túy' nên chấp nhận được."
- trang: kham-pha/tri-tue/tri-tue-la-gi
  id: n40
  luot_2: qua-manh
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1016/j.jsp.2018.10.007&resultType=core", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf"]
  trich: "A controversial aspect of this debate relates to the utility of cognitive profile analysis ... numerous empirical studies and reviews have challenged long-standing assumptions about the utility of these methods"
  cau_dung: "Các bài test IQ cho nhiều điểm thành phần, nhưng chênh lệch giữa các điểm này thường kém tin cậy hơn điểm chung, nên chỉ chuyên gia mới diễn giải điểm mạnh–yếu, và thận trọng; dùng điểm số để dán nhãn \"thông minh/dốt\" là lạm dụng vì test chỉ đo một lát cắt."
  ghi_chu: "Phần 'dán nhãn là lạm dụng' đúng; nhưng dùng điểm thành phần để mô tả điểm mạnh–yếu (phân tích hồ sơ nhận thức) bị nhiều nghiên cứu nghi ngờ về độ tin cậy và giá trị thêm so với điểm chung (McGill, Dombrowski & Canivez 2018)."
- trang: kham-pha/tri-tue/tri-tue-la-gi
