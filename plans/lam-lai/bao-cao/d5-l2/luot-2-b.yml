  luot_2: qua-manh
  nguon:
  - https://doi.org/10.1177/1745691612460685
  - https://doi.org/10.1111/j.1745-6924.2009.01164.x
  - https://www.nobelprize.org/uploads/2018/06/kahnemann-lecture.pdf
  trich: 'Kahneman 2003 gọi System 1/2 là ''anthropomorphic terms''; Evans & Stanovich 2013: nên dùng Type 1/Type 2 thay vì ''hai hệ''; Keren & Schul 2009: ''two-system models currently provide little scientific advance'''
  cau_dung: 'Không nên dùng nhãn Đã bị bác bỏ. Cách đúng: Hệ 1/Hệ 2 là ẩn dụ chứ không phải hai bộ phận của não (chính Kahneman nói vậy); quan niệm ''hai hệ riêng biệt'' bị phê bình mạnh (Keren & Schul 2009) và các tác giả quá trình kép chuyển sang nói ''Type 1/Type 2'' (Evans & Stanovich 2013).'
  ghi_chu: 'Thước đo mục 4: Đã bị bác bỏ cần các kiểm tra đủ mạnh liên tục thất bại hay bằng chứng gốc mất giá trị (rút bài, gian lận). Không có phép kiểm nào ở đây; chính Kahneman coi hai hệ là ẩn dụ, nên khẳng định ''hai bộ phận riêng biệt trong não'' không phải của chính lý thuyết (gần với ''ngộ nhận về cách đọc''), và phê bình khoa học (Keren & Schul) nói về giá trị giải thích, không phải một bác bỏ thực nghiệm.'
