  trich: 'Le, Jin, Nguyen & Vuong, ''Think more before you cheat: The influences of attitudes toward cheating and cognitive reflection on cheating behavior'' dùng CRT với 493 sinh viên ở Đức, Việt Nam, Trung Quốc, Đài Loan, Nhật (bộ dữ liệu Data 2022, doi 10.3390/data7100137)'
  cau_dung: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm chứng chính CRT hay sự phân biệt Hệ 1/Hệ 2 trên người Việt; CRT có được dùng như một thước đo trong nghiên cứu gian lận trên sinh viên năm nước, trong đó có Việt Nam (Le và cộng sự).
  ghi_chu: 'Thời sự, kiểm 10/11/2026: có ít nhất một nghiên cứu đo CRT ở sinh viên Việt Nam (như một mẫu trong nghiên cứu năm nước, về gian lận), tuy không phải nghiên cứu kiểm tra chính CRT. Không thấy nghiên cứu nào kiểm chính CRT hay hai hệ ở riêng người Việt (tìm tiếng Anh, OpenAlex và web). Câu hiện viết ''chưa tìm thấy nghiên cứu nào kiểm tra CRT'' dễ bị hiểu là chưa từng dùng CRT ở Việt Nam. Chưa mở toàn văn để biết số mẫu Việt Nam.'
