  - https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-295X.90.4.293.pdf
  trich: 'Chandrashekar 2021: Linda replicated (N = 1032, preregistered) but ''Findings for James profile were a likely failed replication''; conjunction effects ''may be context-sensitive'''
  cau_dung: 'Khá vững: lỗi conjunction fallacy ở bài toán Linda lặp lại ở nhiều nghiên cứu và một tái lập có đăng ký trước (Chandrashekar và cộng sự, 2021), nhưng chưa có phân tích tổng hợp riêng, mức lỗi phụ thuộc cách hỏi, và một mô tả tương tự (James) không tái lập.'
  ghi_chu: 'Thước đo mục 4: Vững chắc cần phân tích tổng hợp/tổng quan hệ thống hay hai tái lập lớn có đăng ký trước, cùng chiều, không thất bại lớn chưa giải thích. Với Linda chỉ thấy một tái lập lớn có đăng ký trước (Hồng Kông), kèm một thất bại ở mô tả James chưa giải thích hết; phân tích tổng hợp của Yechiam & Zeif nói về thưởng tiền, không phải về sự tồn tại của lỗi. Không tìm thấy phân tích tổng hợp riêng về bài toán Linda.'
