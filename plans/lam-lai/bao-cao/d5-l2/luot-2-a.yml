  - https://doi.org/10.1037/1089-2680.2.2.175
  trich: One could view the results that Wason (1960) originally obtained ... as a manifestation of the positive-test strategy (Klayman & Ha, 1987)
  ghi_chu: Đọc toàn văn Nickerson và Klayman & Ha.
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n30
  luot_2: dung
  nguon:
