  ghi_chu: Hợp với Nickerson (tìm kiếm + diễn giải) và Taber & Lodge (hai khâu).
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n28
  luot_2: qua-manh
  nguon:
  - https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4797953/
  - https://sites.uci.edu/peterdittolab/files/2018/06/Ditto-et-al.-2018-At-Least-Bias-is-Bipartisan-A-Meta-Analytic-Comparison-of-Partisan-Bias-in-Liberals-Conservatives.pdf
  trich: 'Hart 2009: moderate preference for congenial over uncongenial information (d = 0.36); studies from United States and Canada, Germany, Australia, or Italy'
  ghi_chu: Hart và cộng sự (2009) là phân tích tổng hợp tốt, d=0,36, nhưng chỉ gồm mẫu Mỹ, Canada, Đức, Úc, Ý và hiệu ứng thay đổi mạnh theo biến điều tiết; chưa có tái lập lớn có đăng ký trước hay bằng
    chứng đa văn hóa. Theo thước đo mục 4, 'Vững chắc' đòi 'đúng ở nhiều quần thể'; mẫu chủ yếu phương Tây là điều kiện của 'Khá vững'.
  cau_dung: Có phân tích tổng hợp (Hart 2009, d = 0,36) cho thấy ưu tiên thông tin hợp niềm tin sẵn có, nhưng mẫu chủ yếu phương Tây và hiệu ứng thay đổi theo hoàn cảnh; nhãn phù hợp hơn là Khá vững.
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n29
  luot_2: dung
  nguon:
