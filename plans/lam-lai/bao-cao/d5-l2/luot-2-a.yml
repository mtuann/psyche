  - https://doi.org/10.1037/1089-2680.2.2.175
  trich: positive test strategy can be a very good heuristic ... It can, however, lead to systematic errors or inefficiencies
  ghi_chu: 'Nhãn ''Đang tranh cãi'' hợp: Klayman & Ha và Nickerson đều bàn về lợi/hại.'
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n33
  luot_2: dung
  nguon:
  - https://pages.ucsd.edu/~mckenzie/KlaymanHaPsychReview1987.pdf
  trich: many phenomena labeled 'confirmation bias' are better understood in terms of a general positive test strategy ... a tendency to test cases that are expected (or known) to have the property of interest
    rather than those expected (or known) to lack that property
  ghi_chu: Đọc toàn văn.
