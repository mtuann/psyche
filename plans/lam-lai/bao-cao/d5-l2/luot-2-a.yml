  - https://doi.org/10.1037/1089-2680.2.2.175
  trich: '[Klayman & Ha vs. the ''deleterious confirmation bias'' view; Nickerson section on utility vs disutility of the bias]'
  ghi_chu: Cả hai bài đều bàn tranh luận này.
