  id: n47
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/1089-2680.2.2.175
  trich: '[Nickerson: memory biases / selective recall]'
  ghi_chu: Lời khuyên hợp lý, dựa trên lập luận về trí nhớ chọn lọc; hiệu quả của việc ghi dự đoán trước chưa có nghiên cứu riêng, nhưng câu không nêu hiệu quả đo được.
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n48
  luot_2: qua-manh
  nguon:
  - https://doi.org/10.1002/ejsp.58
  trich: Devil's advocate appeared to foster thinking that was primarily aimed at cognitive bolstering of the initial viewpoint rather than stimulate divergent thought ... the authentic minority was superior
    to all three forms of 'devil's advocate'
  ghi_chu: Nemeth, Brown & Westall (2001) thấy vai phản biện đóng vai (devil's advocate) có thể chỉ củng cố ý ban đầu, kém hơn bất đồng thật. Bằng chứng mâu thuẫn nên chip 'Khá vững' quá cao; tóm tắt đọc
    qua OpenAlex.
