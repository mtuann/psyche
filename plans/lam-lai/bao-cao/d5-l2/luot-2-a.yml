  id: n46
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/0022-3514.47.6.1231
  - https://doi.org/10.1111/jasp.12968
  trich: Whereas considering the opposite had a corrective effect on biased assimilation and perceived attitude polarization (Greitemeyer 2023, Ns = 262, 250)
  ghi_chu: 'Nhãn Khá vững hợp: vài nghiên cứu cùng chiều, chưa có tái lập lớn đăng ký trước, kết quả các cách sửa khác lẫn lộn. Chỉ đọc tóm tắt.'
