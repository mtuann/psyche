  id: n39
  luot_2: dung
  nguon:
  - https://doi.org/10.1037/1089-2680.2.2.175
  trich: We can be selective with respect to the evidence we seek, and we can tilt the scales when we weigh what we find, but we cannot completely ignore counterindicative evidence of which we are aware.
    Kunda (1990) has made this argument persuasively.
  ghi_chu: Đọc toàn văn.
