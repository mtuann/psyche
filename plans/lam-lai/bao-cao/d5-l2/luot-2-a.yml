  ghi_chu: Đọc toàn văn.
- trang: kham-pha/tu-duy/thien-kien-xac-nhan
  id: n37
  luot_2: dung
  nguon:
  - https://pages.ucsd.edu/~mckenzie/KlaymanHaPsychReview1987.pdf
  - https://doi.org/10.1080/17470216008416717
  trich: positive tests cannot falsify when the hypothesized set is a subset of the true set (Wason's rule 'any ascending triple' vs 'even numbers')
  ghi_chu: 'Khớp phần lập luận của Klayman & Ha. Chữ ''chỉ'' hơi mạnh: Klayman & Ha còn nêu các trường hợp kém hiệu quả khác, nhưng trong ngữ cảnh chiến lược kiểm tra dương tính thì đúng.'
