  id: n38
  luot_2: dung
  nguon:
  - https://pages.ucsd.edu/~mckenzie/KlaymanHaPsychReview1987.pdf
  trich: the positive test strategy can be a very good heuristic ... under realistic conditions
  ghi_chu: Ví dụ thuốc là minh họa của site; điều khẳng định theo Klayman & Ha đúng.
