  luot_2: dung
  nguon: ["https://files.worldhappiness.report/WHR24_Data_Figure_2.1.xls", "https://files.worldhappiness.report/WHR23_Data_Figure_2.1.xls", "https://files.worldhappiness.report/WHR24.pdf"]
  trich: "Tệp dữ liệu chính thức: WHR24 Vietnam hạng 54/143 (6,043); WHR23 Vietnam hạng 65 (5,763). 65-54 = 11."
  ghi_chu: "Một bài báo tiếng Anh ghi nhầm \"từ hạng 75\"; số trong tệp WHR chính thức khớp câu."
- trang: bang-chung/do-luong
  id: dl3
  luot_2: dung
  nguon: ["https://files.worldhappiness.report/WHR24_Data_Figure_2.1.xls", "https://files.worldhappiness.report/WHR24.pdf"]
  trich: "Hàng đầu của WHR24_Data_Figure_2.1: Finland, ladder score 7,7407; thứ hai Denmark 7,5827."
- trang: bang-chung/do-luong
  id: dl4
  luot_2: dung
  nguon: ["https://files.worldhappiness.report/WHR24.pdf"]
  trich: "\"The Gallup World Poll, which remains the principal source of data in this report\"."
- trang: bang-chung/do-luong
  id: dl5
  luot_2: dung
  nguon: ["https://files.worldhappiness.report/WHR24.pdf"]
  trich: "\"asks respondents to evaluate their current life as a whole using the image of a ladder, with the best possible life for them as a 10 and worst possible as a 0.\""
- trang: bang-chung/do-luong
  id: dl6
  luot_2: dung
  nguon: ["https://files.worldhappiness.report/WHR24.pdf"]
  trich: "\"We base our usual happiness rankings on a three-year average of these life evaluations\"; dữ liệu 2021-2023."
- trang: bang-chung/do-luong
  id: dl7
  luot_2: dung
  nguon: ["https://files.worldhappiness.report/WHR24.pdf"]
  trich: "\"scores are based on ... their answers to the single-item Cantril ladder life-evaluation question.\""
- trang: bang-chung/do-luong
  id: dl8
  luot_2: dung
  nguon: ["https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings"]
  trich: "\"An operational definition is a precise description of our variables\"; đo qua điểm bài kiểm tra hay câu trả lời khảo sát."
  ghi_chu: "Ví dụ trong câu (hạnh phúc, lo âu, trí thông minh) là ví dụ của trang; OpenStax dùng ví dụ học đại số. Định nghĩa đúng."
- trang: bang-chung/do-luong
  id: dl9
  luot_2: dung
  nguon: ["https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings", "https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf"]
  trich: "OpenStax đặt độ tin cậy và độ giá trị làm hai khái niệm trung tâm của việc đánh giá thang đo."
  ghi_chu: "Standards 2014 xếp ba nền tảng (validity, reliability/precision, fairness); cách nói \"hai câu hỏi\" là rút gọn dạy học, không sai."
- trang: bang-chung/do-luong
  id: dl10
  luot_2: dung
  nguon: ["https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings"]
  trich: "\"Reliability refers to the ability to consistently produce a given result.\""
- trang: bang-chung/do-luong
  id: dl11
  luot_2: dung
  nguon: ["https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings"]
  trich: "Test-retest: \"the degree to which the outcomes of a particular measure remain consistent over multiple administrations\"."
- trang: bang-chung/do-luong
  id: dl12
  luot_2: dung
  nguon: ["https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings"]
  trich: "Internal consistency: \"the degree to which different items on a survey that measure the same thing correlate\"."
- trang: bang-chung/do-luong
  id: dl13
  luot_2: dung
  nguon: ["https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings", "https://openstax.org/books/psychology-2e/pages/2-2-approaches-to-research"]
  trich: "Inter-rater reliability: \"the degree to which two or more different observers agree on what has been observed\"."
- trang: bang-chung/do-luong
  id: dl14
  luot_2: dung
  nguon: ["https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings"]
  trich: "\"Validity refers to the extent to which a given instrument or tool accurately measures what it is supposed to measure.\""
- trang: bang-chung/do-luong
  id: dl15
  luot_2: dung
  nguon: ["https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf"]
  trich: "\"Validity refers to the degree to which evidence and theory support the interpretations of test scores for proposed uses of tests ... It is the interpretations of test scores for proposed uses that are evaluated, not the test itself.\" (tr. 11, Ch.1)"
- trang: bang-chung/do-luong
  id: dl16
  luot_2: dung
  nguon: ["https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings"]
  trich: "Cân bếp lệch có thể \"consistently under- or overestimate\" lượng ngũ cốc; \"highly reliable in producing consistent results\" nhưng kết quả sai."
- trang: bang-chung/do-luong
  id: dl17
  luot_2: dung
  nguon: ["https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings"]
  trich: "\"While any valid measure is by necessity reliable, the reverse is not necessarily true.\""
  ghi_chu: "Đúng theo giáo trình và cách dạy quy ước; trong tâm trắc học nâng cao có sắc thái (độ tin cậy đo lường theo nhóm), nhưng câu ở mức nhập môn đúng."
- trang: bang-chung/do-luong
  id: dl18
  luot_2: dung
  nguon: ["https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings", "https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf"]
  trich: "OpenStax: valid ⇒ reliable, ngược lại không đúng; Standards 2014 Ch.2: reliability/precision phải phù hợp cho từng cách dùng điểm."
- trang: bang-chung/do-luong
  id: dl19
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Cronbach/construct.htm"]
  trich: "\"The categories into which the Recommendations divide validity studies are: predictive validity, concurrent validity, content validity, and construct validity.\"; Ủy ban APA 1950-54."
- trang: bang-chung/do-luong
  id: dl20
  luot_2: dung
  nguon: ["https://psychclassics.yorku.ca/Cronbach/construct.htm"]
  trich: "\"the APA Committee on Psychological Tests ... (1950-54)\"; \"The chief innovation in the Committee's report was the term construct validity.\"; bài Cronbach và Meehl 1955 (Psychological Bulletin)."
- trang: bang-chung/do-luong
  id: dl21
  luot_2: dung
  nguon: ["https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf"]
  trich: "\"these sources of evidence ... do not represent distinct types of validity. Validity is a unitary concept ... this edition refers to types of validity evidence, rather than distinct types of validity.\""
- trang: bang-chung/do-luong
  id: dl22
  luot_2: dung
  nguon: ["https://doi.org/10.1007/BF02310555"]
  trich: "OpenAlex: \"Coefficient Alpha and the Internal Structure of Tests\", năm 1951, DOI 10.1007/BF02310555 (tiền tố của Psychometrika); Tavakol & Dennick: \"Alpha was developed by Lee Cronbach in 1951.\""
  ghi_chu: "Tên tạp chí suy từ DOI/ hiểu biết chung và trích dẫn quen thuộc; bài gốc không mở toàn văn."
- trang: bang-chung/do-luong
  id: dl23
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4205511/"]
  trich: "Alpha \"is expressed as a number between 0 and 1\"."
  ghi_chu: "Về lý thuyết alpha có thể âm khi dữ liệu bất thường; ngôn ngữ nhập môn chấp nhận được."
- trang: bang-chung/do-luong
  id: dl24
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4205511/"]
  trich: "\"A low value of alpha could be due to a low number of questions, poor inter-relatedness between items or heterogeneous constructs\"; thang ngắn thì alpha thấp."
- trang: bang-chung/do-luong
  id: dl25
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4205511/"]
  trich: "\"There are different reports about the acceptable values of alpha, ranging from 0.70 to 0.95.\""
- trang: bang-chung/do-luong
  id: dl26
  luot_2: dung
  nguon: ["https://rd.springer.com/content/pdf/10.1007/s11165-016-9602-2.pdf"]
  trich: "Taber (2018): ngưỡng thường gặp \"0.70 or above\" (>=0,70 năm bài, >0,70 ba bài trong mẫu khảo sát); tác giả gọi là \"somewhat arbitrary\"."
- trang: bang-chung/do-luong
  id: dl27
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4205511/"]
  trich: "\"A maximum alpha value of 0.90 has been recommended\"; alpha quá cao có thể do \"some items are redundant\"."
- trang: bang-chung/do-luong
  id: dl28
  luot_2: dung
  nguon: ["https://rd.springer.com/content/pdf/10.1007/s11165-016-9602-2.pdf"]
  trich: "Taber: tác giả nào đưa nhãn bằng lời \"adopt a diverse and seemingly arbitrary terminology\"; 69 bài ở 4 tạp chí giáo dục khoa học năm 2015."
- trang: bang-chung/do-luong
  id: dl29
  luot_2: dung
  nguon: ["https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf"]
  trich: "Standard 2.0, nhận xét: \"A higher degree of reliability/precision is required for score uses that have more significant consequences for test takers.\""
- trang: bang-chung/do-luong
  id: dl30
  luot_2: dung
  nguon: ["https://www.utupub.fi/bitstreams/de31e96c-061a-449e-a67f-057baba2972a/download"]
  trich: "Metsämuuronen & Niemensivu (2025, bản thảo): \"in many applied settings a reliability of .80 is not nearly high enough\" (Nunnally 1978, tr. 245); \"a reliability of .95 should be considered the desirable standard\" (tr. 246)."
  ghi_chu: "Đọc qua trích dẫn của bài 2025, không đọc sách Nunnally; câu đã ghi rõ \"theo trích của\"."
- trang: bang-chung/do-luong
  id: dl31
  luot_2: dung
  nguon: ["https://labs.psychology.illinois.edu/~ediener/Documents/Diener-Emmons-Larsen-Griffin_1985.pdf"]
  trich: "OCR bản gốc: 5 câu, thang 1-7 (\"1 = strongly disagree ... 7 = strongly agree\"), điểm 5 đến 35; câu \"I am satisfied with my life\" là một trong năm câu (OCR bản quét không đọc rõ dòng này; câu này là câu quen thuộc của thang)."
  ghi_chu: "Bản PDF là ảnh quét, đọc bằng OCR."
- trang: bang-chung/do-luong
  id: dl32
  luot_2: dung
  nguon: ["https://labs.psychology.illinois.edu/~ediener/Documents/Diener-Emmons-Larsen-Griffin_1985.pdf"]
  trich: "\"Subjects were 176 undergraduates at the University of Illinois\"; \"Two months later, 76 of these students were ...\"; \"The two-month test-retest correlation coefficient was .82, and coefficient alpha was .87.\""
- trang: bang-chung/do-luong
  id: dl33
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1207/s15327752jpa4901_13"]
  trich: "OpenAlex ngày 30/10/2026: \"The Satisfaction With Life Scale\" (1985), cited_by_count = 31.756."
  ghi_chu: "Số trích dẫn thay đổi theo thời gian và theo cơ sở dữ liệu; OpenAlex thường thấp hơn Google Scholar."
- trang: bang-chung/do-luong
  id: dl34
  luot_2: dung
  nguon: ["https://labs.psychology.illinois.edu/~ediener/Documents/Diener-Emmons-Larsen-Griffin_1985.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4205511/"]
  trich: "alpha .87 nằm trong khoảng 0,70-0,95; test-retest .82 sau hai tháng."
  ghi_chu: "Diễn giải hợp lý; chỉ nói về nhóm sinh viên đó."
- trang: bang-chung/do-luong
  id: dl35
  luot_2: dung
  nguon: ["https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf"]
  trich: "Standard 2.0: \"Appropriate evidence of reliability/precision should be provided for the interpretation for each intended score use.\""
  ghi_chu: "Phần sau câu (\"không có cơ sở để đánh giá\") là suy luận hợp lý từ chuẩn."
- trang: bang-chung/do-luong
  id: dl36
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4205511/", "https://rd.springer.com/content/pdf/10.1007/s11165-016-9602-2.pdf"]
  trich: "Ngưỡng quy ước khoảng 0,70 (Taber; Tavakol & Dennick)."
  ghi_chu: "Lời khuyên thực hành, đúng, kèm quy ước."
- trang: bang-chung/do-luong
  id: dl37
  luot_2: dung
  nguon: ["https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf"]
  trich: "Standards 2014 Ch.1: bằng chứng về nội dung bài test so với khái niệm cần đo là một nguồn bằng chứng cho giá trị."
- trang: bang-chung/do-luong
  id: dl38
  luot_2: dung
  nguon: ["https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf"]
  trich: "Ch.7 (documentation): tài liệu nhằm \"to provide test users with the information needed to help them assess the nature and quality of the test, the resulting scores, and the interpretations\"."
- trang: bang-chung/do-luong
  id: dl39
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fh0034974.zip/10.1037%252Fh0059240.pdf"]
  trich: "\"At the next meeting the 39 students were given DIB's\"; bản mô tả 13 nhận xét có tên từng em; \"The number of specific items accepted as true varied among the group from 8 to 13 except for one ... Mean acceptance was 10.2 items.\""
- trang: bang-chung/do-luong
  id: dl40
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fh0034974.zip/10.1037%252Fh0059240.pdf"]
  trich: "Forer: mọi sinh viên nhận cùng một bản mô tả nhưng đều chấp nhận phần lớn nhận xét; tác giả kết luận chấp nhận cá nhân không đủ để chứng minh giá trị của công cụ."
  ghi_chu: "Đúng với kết luận của Forer (\"fallacy of personal validation\"); câu này không khẳng định bài test nào vô giá trị."
- trang: bang-chung/do-luong
  id: dl41
  luot_2: dung
  nguon: ["https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings", "https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf"]
  trich: "OpenStax: \"While any valid measure is by necessity reliable, the reverse is not necessarily true.\"; Standards 2014 Ch.2."
  ghi_chu: "Nhãn cho nguyên tắc phương pháp xét theo đồng thuận giáo trình và Standards 2014: đạt mức vững cho khẳng định này."
- trang: bang-chung/do-luong
  id: dl42
  luot_2: dung
  nguon: ["https://rd.springer.com/content/pdf/10.1007/s11165-016-9602-2.pdf", "https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf"]
  trich: "Taber: 0,70 \"somewhat arbitrary\"; Standards 2.0: mức cần thiết tùy hệ quả của cách dùng điểm."
  ghi_chu: "Nhãn theo đồng thuận tổng quan phương pháp."
- trang: bang-chung/do-luong
  id: dl43
  luot_2: dung
  nguon: ["https://labs.psychology.illinois.edu/~ediener/Documents/Diener-Emmons-Larsen-Griffin_1985.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4205511/"]
  trich: "SWLS test-retest .82; alpha dưới 0,70 là thấp; test-retest .85 gần .82."
  ghi_chu: "Bài tập giả định, phép đọc số đúng."
- trang: bang-chung/do-luong
  id: dl44
  luot_2: dung
  nguon: ["https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings", "https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf"]
  trich: "Độ tin cậy cao không bảo đảm độ giá trị; nội dung câu hỏi không khớp khái niệm là vấn đề giá trị (Standards: bằng chứng về nội dung)."
- trang: bang-chung/do-luong
  id: dl45
  luot_2: dung
  nguon: ["https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings"]
  trich: "Cân lệch luôn báo sai cùng một cách: tin cậy cao, giá trị thấp; ví dụ \"kitchen scale\" của OpenStax."
- trang: bang-chung/do-luong
  id: dl46
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4205511/", "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings"]
  trich: "Alpha rất cao có thể do câu hỏi lặp (\"some items are redundant\"); giá trị khác với nhất quán nội tại."
- trang: bang-chung/do-luong
  id: dl47
  luot_2: dung
  nguon: ["https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings", "https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf"]
  trich: "Alpha là nhất quán nội tại; ổn định giữa hai lần đo là test-retest; dự đoán là bằng chứng về quan hệ với biến khác (giá trị)."
