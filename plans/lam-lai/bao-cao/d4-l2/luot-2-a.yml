- trang: bang-chung/thong-ke-mo-ta
  id: tk1
  luot_2: dung
  nguon: ["https://vietstock.vn/2025/05/nam-2024-thu-nhap-binh-quan-cua-nguoi-viet-tang-manh-dat-54-trieu-dong-761-1309745.htm"]
  trich: "Tiêu đề trang Vietstock đúng như câu; ngày đăng 19/05/2025 10:30 (meta datePublished 2025-05-19T10:30:00+07:00)."
- trang: bang-chung/thong-ke-mo-ta
  id: tk2
  luot_2: dung
  nguon: ["https://www.nso.gov.vn/du-lieu-va-so-lieu-thong-ke/2025/05/thong-cao-bao-chi-ket-qua-khao-sat-muc-song-dan-cu-nam-2024/", "https://www.nso.gov.vn/wp-content/uploads/2025/05/thong-cao-bao-chi-ksmsdc2024.pdf"]
  trich: "Thông cáo báo chí về kết quả Khảo sát mức sống dân cư năm 2024, Cục Thống kê, \"Hà Nội, ngày 16 tháng 5 năm 2025\"; trang NSO ghi \"Ngày đăng: 16/05/2025\"."
- trang: bang-chung/thong-ke-mo-ta
  id: tk3
  luot_2: dung
  nguon: ["https://www.nso.gov.vn/du-lieu-va-so-lieu-thong-ke/2025/05/thong-cao-bao-chi-ket-qua-khao-sat-muc-song-dan-cu-nam-2024/", "https://www.nso.gov.vn/wp-content/uploads/2025/05/thong-cao-bao-chi-ksmsdc2024.pdf"]
  trich: "\"Thu nhập bình quân 1 người 1 tháng năm 2024 theo giá hiện hành đạt 5,4 triệu đồng, tăng 9,1% so với năm 2023\"."
  ghi_chu: "Một bài Vietstock tháng 1/2025 dẫn số sơ bộ tăng 8,8%; số trong thông cáo 16/5/2025 là 9,1%."
- trang: bang-chung/thong-ke-mo-ta
  id: tk4
  luot_2: dung
  nguon: ["https://www.nso.gov.vn/du-lieu-va-so-lieu-thong-ke/2025/05/thong-cao-bao-chi-ket-qua-khao-sat-muc-song-dan-cu-nam-2024/", "https://www.nso.gov.vn/wp-content/uploads/2025/05/thong-cao-bao-chi-ksmsdc2024.pdf"]
  trich: "\"nhóm 5 ... đạt 11,8 triệu đồng cao gấp 7,4 lần ... nhóm 1 ... 1,6 triệu đồng/người/tháng\"."
  ghi_chu: "11,8/1,6 = 7,375, làm tròn 7,4: khớp."
- trang: bang-chung/thong-ke-mo-ta
  id: tk5
  luot_2: dung
  nguon: ["https://www.nso.gov.vn/du-lieu-va-so-lieu-thong-ke/2025/05/thong-cao-bao-chi-ket-qua-khao-sat-muc-song-dan-cu-nam-2024/"]
  trich: "Tính lại: 11,8 x 0,2 / 5,4 = 0,437 (khoảng 44%); 1,6 x 0,2 / 5,4 = 0,059 (khoảng 6%)."
  ghi_chu: "Phép tính đúng; là ước tính từ số làm tròn, câu đã ghi \"khoảng\" và \"tính từ số liệu trên\"."
- trang: bang-chung/thong-ke-mo-ta
  id: tk6
  luot_2: dung
  nguon: ["https://www.nso.gov.vn/du-lieu-va-so-lieu-thong-ke/2025/05/thong-cao-bao-chi-ket-qua-khao-sat-muc-song-dan-cu-nam-2024/", "https://www.nso.gov.vn/wp-content/uploads/2025/05/thong-cao-bao-chi-ksmsdc2024.pdf", "https://vietstock.vn/2025/05/nam-2024-thu-nhap-binh-quan-cua-nguoi-viet-tang-manh-dat-54-trieu-dong-761-1309745.htm"]
  trich: "Đọc lại ngày 30/10/2026: trang thông cáo, bản PDF và bài Vietstock đều không có cụm \"trung vị\" hay \"median\"."
  ghi_chu: "Chỉ kiểm hai văn bản này; bảng số liệu xlsx kèm thông cáo không mở."
- trang: bang-chung/thong-ke-mo-ta
  id: tk7
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/1-1-definitions-of-statistics-probability-and-key-terms"]
  trich: "\"Organizing and summarizing data is called descriptive statistics.\"; tóm tắt bằng biểu đồ hay bằng số."
- trang: bang-chung/thong-ke-mo-ta
  id: tk8
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data"]
  trich: "\"The two most widely used measures of the center of the data are the mean (average) and the median.\"; mode cũng được định nghĩa là \"the most frequent value\"."
- trang: bang-chung/thong-ke-mo-ta
  id: tk9
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data"]
  trich: "Mean: cộng mọi giá trị rồi chia cho số lượng (\"add the 50 weights together and divide by 50\")."
- trang: bang-chung/thong-ke-mo-ta
  id: tk10
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data"]
  trich: "\"The words mean and average are often used interchangeably.\""
- trang: bang-chung/thong-ke-mo-ta
  id: tk11
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data"]
  trich: "Median \"is not affected by the precise numerical values of the outliers\"; mean bị giá trị cực đoan kéo."
- trang: bang-chung/thong-ke-mo-ta
  id: tk12
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data"]
  trich: "Thị trấn 50 người: một người 5.000.000 USD, 49 người 30.000 USD; mean 129.400, median 30.000; \"The median is a better measure of the center than the mean.\""
  ghi_chu: "Tự tính: (5.000.000 + 49 x 30.000)/50 = 129.400."
- trang: bang-chung/thong-ke-mo-ta
  id: tk13
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data"]
  trich: "Median chia dữ liệu đã xếp thứ tự thành hai nửa bằng nhau; n chẵn thì lấy trung bình hai giá trị giữa."
- trang: bang-chung/thong-ke-mo-ta
  id: tk14
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data"]
  trich: "Median phụ thuộc vị trí trong dãy đã xếp, không phụ thuộc giá trị chính xác của giá trị cực đoan; nếu người cao nhất kiếm thêm, vị trí không đổi nên trung vị không đổi."
  ghi_chu: "Hệ quả suy trực tiếp từ định nghĩa."
- trang: bang-chung/thong-ke-mo-ta
  id: tk15
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data"]
  trich: "\"There can be more than one mode in a data set as long as those values have the same frequency.\""
- trang: bang-chung/thong-ke-mo-ta
  id: tk16
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data"]
  trich: "\"The mode can be calculated for qualitative data as well as for quantitative data.\"; ví dụ màu sắc, mode là màu đỏ."
  ghi_chu: "Ví dụ đỏ/xanh lá/vàng của câu là ví dụ riêng, kết quả đúng."
- trang: bang-chung/thong-ke-mo-ta
  id: tk17
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data"]
  trich: "Tự tính: tổng 135/10 = 13,5; trung vị (8+9)/2 = 8,5; 7, 8, 9 đều xuất hiện 2 lần; 13,5 lớn hơn 9 giá trị còn lại (lớn nhất 11); 5 giá trị dưới 8,5 và 5 giá trị trên."
  ghi_chu: "Ví dụ do trang tự dựng, tính lại đúng."
- trang: bang-chung/thong-ke-mo-ta
  id: tk19
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-6-skewness-and-the-mean-median-and-mode"]
  trich: "\"In a perfectly symmetrical distribution, the mean and the median are the same.\" Phân phối đối xứng thì hai số xấp xỉ bằng nhau."
- trang: bang-chung/thong-ke-mo-ta
  id: tk20
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-6-skewness-and-the-mean-median-and-mode"]
  trich: "Lệch trái \"pulled out to the left\", lệch phải \"skewed to the right\"; lệch trái thì mean thường nhỏ hơn median (\"often\"), lệch phải thì mean thường lớn hơn."
- trang: bang-chung/thong-ke-mo-ta
  id: tk21
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-6-skewness-and-the-mean-median-and-mode", "https://jse.amstat.org/v13n2/vonhippel.html"]
  trich: "Mean bị đuôi dài kéo về phía đuôi nhiều hơn median; khoảng cách giữa hai số là gợi ý, không phải bằng chứng chắc (von Hippel 2005)."
  ghi_chu: "Câu dùng \"gợi ý\", phù hợp."
- trang: bang-chung/thong-ke-mo-ta
  id: tk22
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-6-skewness-and-the-mean-median-and-mode", "https://jse.amstat.org/v13n2/vonhippel.html"]
  trich: "OpenStax: lệch phải thì \"the mean is the largest, while the mode is the smallest\"; \"It is not, however, true for every data set. The most common exceptions occur in sets of discrete data.\" von Hippel: quy tắc \"fails with surprising frequency\", cả ở phân phối nhiều đỉnh."
- trang: bang-chung/thong-ke-mo-ta
  id: tk23
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data", "https://openstax.org/books/introductory-statistics-2e/pages/2-6-skewness-and-the-mean-median-and-mode"]
  trich: "Phân phối đối xứng: mean và median xấp xỉ nhau, mean dùng mọi giá trị."
  ghi_chu: "Lời khuyên thực hành theo giáo trình, nhất quán với nguồn."
- trang: bang-chung/thong-ke-mo-ta
  id: tk24
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data"]
  trich: "Median \"more resistant\" với giá trị cực đoan nên hợp hơn với dữ liệu lệch hay có outlier (\"The median is a better measure of the center than the mean\" ở ví dụ thị trấn)."
  ghi_chu: "Lời khuyên \"thường\", không tuyệt đối: đúng."
- trang: bang-chung/thong-ke-mo-ta
  id: tk25
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data"]
  trich: "Mode tính được cho dữ liệu định tính; mean cần cộng giá trị nên không áp dụng cho màu sắc."
- trang: bang-chung/thong-ke-mo-ta
  id: tk26
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-6-skewness-and-the-mean-median-and-mode", "https://jse.amstat.org/v13n2/vonhippel.html"]
  trich: "Nêu cả mean và median; khoảng cách gợi ý độ lệch (có ngoại lệ ở dữ liệu rời rạc, đa đỉnh)."
  ghi_chu: "Câu đã dùng \"gợi ý\"."
- trang: bang-chung/thong-ke-mo-ta
  id: tk27
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data"]
  trich: "\"mean and average are often used interchangeably\"; trung bình cộng nhạy giá trị cực đoan."
  ghi_chu: "Câu dùng \"thường\", đúng; báo chí không phải lúc nào cũng vậy."
- trang: bang-chung/thong-ke-mo-ta
  id: tk28
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data"]
  trich: "Mean bị giá trị cực đoan lớn kéo lên; ví dụ thị trấn: 129.400 so với 30.000."
- trang: bang-chung/thong-ke-mo-ta
  id: tk29
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-6-skewness-and-the-mean-median-and-mode", "https://jse.amstat.org/v13n2/vonhippel.html"]
  trich: "Chỉ có mean thì không biết mức lệch; khoảng cách mean-median là gợi ý."
- trang: bang-chung/thong-ke-mo-ta
  id: tk30
  luot_2: dung
  nguon: ["https://www.nso.gov.vn/?p=51719", "https://www.nso.gov.vn/du-lieu-va-so-lieu-thong-ke/2025/05/thong-cao-bao-chi-ket-qua-khao-sat-muc-song-dan-cu-nam-2024/"]
  trich: "\"Thu nhập bình quân đầu người 01 tháng được tính bằng cách chia tổng thu nhập trong năm của hộ dân cư cho tổng dân số và chia cho 12 tháng.\""
  ghi_chu: "Mẫu số là tổng dân số nên gồm cả trẻ em. Chỉ tiêu \"thu nhập bình quân tháng của người lao động\" là chỉ tiêu riêng của thống kê lao động (số 7,7 triệu đồng năm 2024 thấy trong kết quả tìm kiếm, không mở bài gốc)."
- trang: bang-chung/thong-ke-mo-ta
  id: tk31
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data", "https://www.nso.gov.vn/du-lieu-va-so-lieu-thong-ke/2025/05/thong-cao-bao-chi-ket-qua-khao-sat-muc-song-dan-cu-nam-2024/"]
  trich: "Có median hay phân phối theo nhóm 20% thì biết thêm; thông cáo có nhóm 20% nhưng không có trung vị."
  ghi_chu: "Lời khuyên thực hành, đúng."
- trang: bang-chung/thong-ke-mo-ta
  id: tk32
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data", "https://openstax.org/books/introductory-statistics-2e/pages/2-6-skewness-and-the-mean-median-and-mode"]
  trich: "Giáo trình: mean, median, mode là ba thước đo trung tâm; mean nhạy outlier, median \"resistant\"."
  ghi_chu: "Nhãn cho nguyên tắc phương pháp: đồng thuận giáo trình (OpenStax, mở); khớp mức \"Vững chắc\" theo cách xét nguyên tắc phương pháp ở lời giao."
- trang: bang-chung/thong-ke-mo-ta
  id: tk33
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-6-skewness-and-the-mean-median-and-mode", "https://jse.amstat.org/v13n2/vonhippel.html"]
  trich: "OpenStax lệch phải: mean lớn nhất, mode nhỏ nhất, kèm cảnh báo ngoại lệ ở dữ liệu rời rạc; von Hippel: quy tắc sai thường xuyên hơn người ta nghĩ."
  ghi_chu: "Câu dùng \"thường\" nên giữ được; nhãn không nên cao hơn \"Khá vững\" nếu muốn tách quy tắc lệch khỏi nguyên tắc nhạy outlier. Lượt 2 chỉ đánh giá nội dung câu: đúng."
- trang: bang-chung/thong-ke-mo-ta
  id: tk34
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-6-skewness-and-the-mean-median-and-mode", "https://jse.amstat.org/v13n2/vonhippel.html"]
  trich: "OpenStax: \"It is not, however, true for every data set. The most common exceptions occur in sets of discrete data.\" von Hippel (JSE 13(2), 2005): \"This rule fails with surprising frequency... Most commonly, though, the rule fails in discrete distributions\"."
- trang: bang-chung/thong-ke-mo-ta
  id: tk35
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data"]
  trich: "Tự tính: tổng 146/10 = 14,6; trung vị (7+8)/2 = 7,5; 6, 7, 8 đều xuất hiện 2 lần; 9/10 giá trị là 10 trở xuống; 14,6/7,5 = 1,95."
  ghi_chu: "Ví dụ do trang tự dựng, tính lại đúng."
- trang: bang-chung/thong-ke-mo-ta
  id: tk36
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data", "https://www.nso.gov.vn/du-lieu-va-so-lieu-thong-ke/2025/05/thong-cao-bao-chi-ket-qua-khao-sat-muc-song-dan-cu-nam-2024/"]
  trich: "Ví dụ thị trấn: mean đúng về tính toán nhưng median mô tả trung tâm tốt hơn."
- trang: bang-chung/thong-ke-mo-ta
  id: tk37
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-6-skewness-and-the-mean-median-and-mode"]
  trich: "Lệch phải: mean thường lớn hơn median (\"often\"); ngoại lệ có ở dữ liệu rời rạc."
- trang: bang-chung/thong-ke-mo-ta
  id: tk38
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data"]
  trich: "Mode dùng được cho dữ liệu định tính; mean cần cộng, median cần xếp thứ tự."
- trang: bang-chung/thong-ke-mo-ta
  id: tk39
  luot_2: dung
  nguon: ["https://openstax.org/books/introductory-statistics-2e/pages/2-5-measures-of-the-center-of-the-data"]
  trich: "Median chỉ phụ thuộc giá trị ở giữa dãy đã xếp; mean dùng mọi giá trị. Với 10 người, người cao nhất là vị trí thứ 10 nên tăng thu nhập của họ không đổi median."
- trang: bang-chung/do-luong
  id: dl1
  luot_2: dung
  nguon: ["https://files.worldhappiness.report/WHR24.pdf", "https://wellbeing.hmc.ox.ac.uk/events/world-happiness-report-2024-global-launch", "https://en.baochinhphu.vn/viet-nam-jumps-11-steps-in-world-happiness-report-2024-111240321110305123.htm"]
  trich: "Trang sự kiện của Oxford Wellbeing Research Centre: ra mắt \"20 March\" 2024 tại Gallup, Washington; Báo Chính phủ (tiếng Anh) đăng 21/03/2024 12:40 (GMT+7)."
  ghi_chu: "Ngày 20/3 là Ngày Quốc tế Hạnh phúc của Liên Hợp Quốc (thông tin chung); trang Oxford không tự nói liên hệ này. Metadata PDF tạo ngày 18/3/2024, không mâu thuẫn."
- trang: bang-chung/do-luong
