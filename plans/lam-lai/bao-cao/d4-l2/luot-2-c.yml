  id: e50
  luot_2: qua-manh
  nguon: ["https://www.apa.org/ethics/code/ethics-code-2017.pdf", "https://cometc.unibuc.ro/wp-content/uploads/2024/10/The-Belmont-Report.pdf"]
  trich: "APA 8.04(a),(b); Belmont: \"persons in positions of authority ... especially where possible sanctions are involved\"."
  cau_dung: "Tình huống 1 (điểm quá trình): cần xem lại tính tự nguyện; ảnh hưởng không chính đáng thường đến từ người có quyền lực và chế tài; APA 8.04(a) yêu cầu bảo vệ sinh viên khỏi hậu quả khi từ chối hay rút lui; 8.04(b) yêu cầu, nếu tham gia là yêu cầu hay điểm cộng của môn học, cho lựa chọn thay thế tương đương; nếu đã có lựa chọn như vậy thì tiêu chuẩn 8.04(b) được đáp ứng, nhưng vẫn phải bảo đảm không ai bị bất lợi vì từ chối."
  ghi_chu: "Câu cuối nói có lựa chọn thay thế tương đương thì \"không còn vi phạm tiêu chuẩn này\": 8.04(b) thì được đáp ứng, nhưng 8.04(a) (bảo vệ khỏi hậu quả khi từ chối hay rút lui) vẫn còn hiệu lực, và Belmont vẫn đòi tự nguyện không bị ảnh hưởng không chính đáng."
- trang: bang-chung/dao-duc-nghien-cuu
