  id: d55
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC7392212/"]
  trich: "Rule 4: \"There is no correct or incorrect approach: Try both to see what works best for you.\"; \"understand each x- and y-axes, color scheme, statistical approach ... and why the particular plotting approach was used\"; Rule 5: \"even 'objective' sections are written by and, therefore, influenced by the authors interpretations\"; Rule 6: \"the reader pushes back against the author's interpretation to test the strength of their conclusions\"."
- trang: bang-chung/dao-duc-nghien-cuu
  id: e2
  luot_2: dung
  nguon: ["https://www.wma.net/policies-post/wma-declaration-of-helsinki/", "https://www.apa.org/ethics/code/ethics-code-2017.pdf"]
  trich: "Helsinki 2024, đoạn 23: \"submitted for consideration, comment, guidance, and approval to the concerned research ethics committee\" trước khi nghiên cứu bắt đầu; ủy ban \"transparent in its functioning\", \"independence and authority to resist undue influence from the researcher, the sponsor, or others\", \"right to monitor, recommend changes to, withdraw approval for, and suspend ongoing research\"; APA 8.01: \"obtain approval prior to conducting the research\" khi cần phê duyệt."
  ghi_chu: "Đoạn Helsinki lấy qua công cụ đọc web (wma.net); khớp nội dung đoạn 23 bản 2024."
- trang: bang-chung/dao-duc-nghien-cuu
