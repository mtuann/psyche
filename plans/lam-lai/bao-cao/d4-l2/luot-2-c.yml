  trich: "ICMJE (cập nhật 1/2026) IV.A: \"Introduction, Methods, Results, and Discussion ... 'IMRAD'\"; Methods \"sufficiently detailed such that others with access to the data would be able to reproduce the results\"; Results nêu kết quả chính trước; Discussion \"put your findings in the context of the totality of the relevant evidence\"."
