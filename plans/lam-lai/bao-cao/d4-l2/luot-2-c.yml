  id: d19
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC7392212/"]
  trich: "Rule 4: \"There is no correct or incorrect approach: Try both to see what works best for you.\"; \"understand each x- and y-axes, color scheme, statistical approach ... and why the particular plotting approach was used\"; Rule 5: \"even 'objective' sections are written by and, therefore, influenced by the authors interpretations\"; Rule 6: \"the reader pushes back against the author's interpretation to test the strength of their conclusions\"."
