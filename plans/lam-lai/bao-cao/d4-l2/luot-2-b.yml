  nguon: ["https://online.ucpress.edu/collabra/article/8/1/33267/120491/Sample-Size-Justification", "https://api.openalex.org/works/doi:10.4324/9780203771587"]
  trich: "Cohen, J. (1988). Statistical power analysis for the behavioral sciences (2nd ed.). L. Erlbaum Associates."
  ghi_chu: "Danh mục tham khảo của Lakens 2022; Lakens trích Cohen 1988 nêu quy ước 0,8. OpenAlex ghi bản in lại của Routledge 2013."
- trang: bang-chung/co-mau-suc-manh
  id: c12
  luot_2: dung
  nguon: ["https://online.ucpress.edu/collabra/article/8/1/33267/120491/Sample-Size-Justification"]
  trich: "It is proposed here as a convention that, when the investigator has no other basis for setting the desired power value, the value .80 be used. This means that β is set at .20. This arbitrary but reasonable value is offered for several reasons"
  ghi_chu: "Lakens 2022 trích nguyên văn Cohen 1988; chưa mở được bản in Cohen 1988 (sách, không có bản mở)."
- trang: bang-chung/co-mau-suc-manh
  id: c13
  luot_2: dung
  nguon: ["https://online.ucpress.edu/collabra/article/8/1/33267/120491/Sample-Size-Justification", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.112.1.155.pdf"]
  trich: "The chief among them takes into consideration the implicit convention for α of .05. The β of .20 is chosen with the idea that the general relative seriousness of these two kinds of errors is of the order of .20/.05, i.e., that Type I errors are of the order of four times as serious as Type II errors."
  ghi_chu: "Lakens 2022 trích Cohen 1988; Cohen 1992: 'a β:α ratio of 4:1'."
- trang: bang-chung/co-mau-suc-manh
  id: c14
  luot_2: dung
  nguon: ["https://online.ucpress.edu/collabra/article/8/1/33267/120491/Sample-Size-Justification"]
  trich: "This .80 desired power convention is offered with the hope that it will be ignored whenever an investigator can find a basis in his substantive concerns in his specific research investigation to choose a value ad hoc."
  ghi_chu: "Lakens 2022 trích Cohen 1988."
- trang: bang-chung/co-mau-suc-manh
  id: c15
  luot_2: dung
  nguon: ["https://online.ucpress.edu/collabra/article/8/1/33267/120491/Sample-Size-Justification"]
  trich: "the default recommendation to aim for 80% power lacks a solid justification. ... What we should take away from Cohen is not that we should aim for 80% power, but that we should justify our error rates based on the relative seriousness of each error."
  ghi_chu: "Lakens 2022, mục Compromise Power Analysis và Power analysis."
- trang: bang-chung/co-mau-suc-manh
  id: c16
  luot_2: dung
  nguon: ["https://online.ucpress.edu/collabra/article/8/1/33267/120491/Sample-Size-Justification"]
  trich: "Researchers should carefully weigh the costs of increasing the sample size against the benefits of lower error rates, which would probably make studies designed to achieve a power of 90% or 95% more common for articles reporting a single study."
