  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1038%252Fnrm2640.zip/10.1038%252Fnrn3475.pdf"]
  trich: "we show that the average statistical power of studies in the neurosciences is very low. The consequences of this include overestimates of effect size and low reproducibility of results."
  ghi_chu: "Tóm tắt của bài."
- trang: bang-chung/co-mau-suc-manh
  id: c6
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.112.1.155.pdf"]
  trich: "The statistical power of a significance test is the long-term probability, given the population ES, α, and N of rejecting H0."
  ghi_chu: "Cohen 1992 tr. 156."
- trang: bang-chung/co-mau-suc-manh
  id: c7
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.112.1.155.pdf"]
  trich: "When the ES is not equal to zero, H0 is false, so failure to reject it also incurs an error. This is a Type II error ... its probability of occurring is β. Power is thus 1 − β"
  ghi_chu: "Cohen 1992 tr. 156."
- trang: bang-chung/co-mau-suc-manh
  id: c8
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.112.1.155.pdf"]
  trich: "In this treatment, the only specification for power is .80 (so β = .20)"
