  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.112.1.155.pdf"]
  trich: "Power is thus 1 − β, the probability of rejecting a false H0."
  ghi_chu: "Tự tính: công suất kiểm định t hai mẫu độc lập, hai phía, α = 0,05, bằng phân phối t phi trung tâm chính xác (tích phân số theo phân phối khi bình phương, script Python tự viết, không dùng gói); kết quả trùng giá trị quen biết của G*Power. Với n = 15 mỗi nhóm (df = 28): d = 0,2 cho 0,083; d = 0,5 cho 0,262; d = 0,8 cho 0,562. Khớp 8%, 26%, 56%."
