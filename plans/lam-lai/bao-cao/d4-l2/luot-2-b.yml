  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1038%252Fnrm2640.zip/10.1038%252Fnrn3475.pdf"]
  trich: "Our results indicated that the median statistical power of these studies was 8% across 461 individual studies contributing to 41 separate meta-analyses"
  ghi_chu: "Nghiên cứu cấu trúc và thể tích não bằng MRI so nhóm bệnh với người khỏe."
