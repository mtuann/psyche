  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1038%252Fnrm2640.zip/10.1038%252Fnrn3475.pdf", "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5566862/fullTextXML"]
  trich: "comprising data from 49 meta-analyses and 730 individual primary studies ... contrary to their protocol (which reported power only for the median-sized study in each meta-analysis: N = 49), we report power for each of the 730 individual studies"
  ghi_chu: "Button: tính công suất mỗi nghiên cứu để phát hiện hiệu ứng gộp của bài tổng hợp chứa nó, Bảng 1 và Hình 3 báo công suất trung vị của từng bài tổng hợp; Nord 2017 mô tả là công suất của nghiên cứu có cỡ trung vị trong mỗi bài. Hai cách nói tương đương vì công suất tăng theo cỡ mẫu."
- trang: bang-chung/co-mau-suc-manh
  id: c25
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1038%252Fnrm2640.zip/10.1038%252Fnrn3475.pdf"]
  trich: "Our results indicate that the median statistical power in neuroscience is 21%."
  ghi_chu: "Tự tính: 21/80 = 0,26, khoảng một phần tư."
- trang: bang-chung/co-mau-suc-manh
  id: c26
  luot_2: sai
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1038%252Fnrm2640.zip/10.1038%252Fnrn3475.pdf"]
  trich: "Abstract: 'Here, we show that the average statistical power of studies in the neurosciences is very low.' Implications: 'the average statistical power of studies in the field of neuroscience is probably no more than between ~8% and ~31%'"
  cau_dung: "Trong phần bàn luận (không phải tóm tắt), Button và cộng sự viết rằng công suất trung bình của các nghiên cứu thần kinh học có lẽ không quá khoảng 8% đến 31%."
  ghi_chu: "Tóm tắt của Button không có khoảng 8–31%. Khoảng này ở mục Implications, và nói là công suất trung bình 'có lẽ không quá' khoảng 8–31%, gộp từ ba nhóm (8% hình ảnh não, 21% chung, 18% và 31% nghiên cứu trên động vật)."
- trang: bang-chung/co-mau-suc-manh
