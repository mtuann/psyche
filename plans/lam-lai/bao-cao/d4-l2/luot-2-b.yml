  trich: "Power failure: why small sample size undermines the reliability of neuroscience. Katherine S. Button, John P. A. Ioannidis, Claire Mokrysz, Brian A. Nosek, Jonathan Flint, Emma S. J. Robinson and Marcus R. Munafò ... VOLUME 14 | MAY 2013 | 365"
  ghi_chu: "Toàn văn ở Internet Archive; trang cuối 376 (chân trang '376 | MAY 2013 | VOLUME 14')."
