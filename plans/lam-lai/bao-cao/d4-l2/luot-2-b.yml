  trich: "Median power to detect small, medium, and large effects was 0.12, 0.44, and 0.73 ... low power is far from a universal problem"
  ghi_chu: "Nội dung đúng: Button (21%), Szucs & Ioannidis (0,12/0,46/0,78 theo bản đính chính) đều dưới 0,8; Nord cho thấy con số đổi theo cách ước tính và nhóm nghiên cứu. Danh sách không ghi nhãn; nếu là Khá vững hay Vững chắc cho vế 'thấp hơn nhiều so với 0,8' thì đều có cơ sở (nhiều đánh giá cùng chiều)."
