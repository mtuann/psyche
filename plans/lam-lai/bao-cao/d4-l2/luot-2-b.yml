  trich: "This article compiles results from a century of social psychological research, more than 25,000 studies of 8 million people. ... social psychological effects typically yield a value of r equal to .21"
  ghi_chu: "Richard, Bond & Stokes-Zoota 2003, Review of General Psychology 7(4); tóm tắt qua OpenAlex (322 phân tích tổng hợp)."
