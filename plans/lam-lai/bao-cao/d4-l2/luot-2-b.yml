  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.112.1.155.pdf"]
  trich: "Table 2 ... Mean dif: Sm 393, Med 64, Lg 26 (α = .05)"
  ghi_chu: "Tự tính: công suất kiểm định t hai mẫu độc lập, hai phía, α = 0,05, bằng phân phối t phi trung tâm chính xác (tích phân số theo phân phối khi bình phương, script Python tự viết, không dùng gói); kết quả trùng giá trị quen biết của G*Power. Kết quả: d = 0,2 cần 394 người mỗi nhóm (393 cho công suất 0,7996), d = 0,5 cần 64, d = 0,8 cần 26. Bảng 2 của Cohen 1992 ghi 393 cho hiệu ứng nhỏ; 'khoảng 394' vẫn đúng."
