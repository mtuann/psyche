  id: pt58
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "If confidence intervals for the results of individual studies ... have poor overlap, this generally indicates the presence of statistical heterogeneity."
  ghi_chu: "Câu mô tả hình giả định; không xem được hình, chỉ xét lập luận: khoảng tin cậy chồng nhiều thì không gợi ý dao động vượt mức may rủi (Cochrane 10.10.2). Với ba nghiên cứu, mức dao động cũng ước lượng kém, nên 'chưa cho thấy' là cách nói đúng mức."
