  ghi_chu: "Hợp lập luận PPV của Button. Tự kiểm thêm (xấp xỉ chuẩn): với p ≈ 0,04, tỉ số hợp lý H1/H0 chỉ khoảng 2,7 ở công suất 20%, tức bằng chứng yếu. Là lời khuyên đọc cẩn thận, không quá mạnh."
