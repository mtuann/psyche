  nguon: ["https://online.ucpress.edu/collabra/article/8/1/33267/120491/Sample-Size-Justification"]
  trich: "Cohen’s benchmarks for small, medium, and large effects should not be used in an a-priori power analysis (Cook et al., 2014; Correll et al., 2020), and Cohen regretted having proposed these benchmarks (Funder & Ozer, 2019)."
