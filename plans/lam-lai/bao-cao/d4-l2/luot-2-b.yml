  id: c30
  luot_2: sai
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5333800/fullTextXML", "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC7935231/fullTextXML"]
  trich: "Bản đính chính 2021: 'The third sentence of the abstract should read: “Median power to detect small, medium, and large effects was 0.12, 0.46, and 0.78”'"
  cau_dung: "Một phân tích 26.841 kiểm định t trong 3.801 bài báo tâm lý học và khoa học thần kinh nhận thức cho thấy công suất trung vị để phát hiện hiệu ứng nhỏ, trung bình và lớn lần lượt là 0,12, 0,46 và 0,78 (số theo bản đính chính năm 2021)."
  ghi_chu: "Szucs & Ioannidis 2017 (PLoS Biology) ghi 0,12; 0,44; 0,73, nhưng bản đính chính 5/3/2021 sửa thành 0,12; 0,46; 0,78 (lỗi công thức (df+2)/2). 26.841 bản ghi kiểm định t trong 3.801 bài là đúng."
- trang: bang-chung/co-mau-suc-manh
  id: c31
  luot_2: dung
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5566862/fullTextXML"]
  trich: "we calculated the median power across all 730 individual studies which was equal to 23%, close to the 21% reported by Button et al. ... genetic association studies lower (11% median power) than any other subfield"
  ghi_chu: "Nord và cộng sự 2017, J Neurosci; bảng: Genetic 11%."
- trang: bang-chung/co-mau-suc-manh
  id: c32
  luot_2: dung
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5566862/fullTextXML"]
  trich: "low power is far from a universal problem. ... on average, studies are indeed underpowered-some very seriously so-but many studies show acceptable or even exemplary statistical power."
  ghi_chu: "Tóm tắt và Significance Statement."
- trang: bang-chung/co-mau-suc-manh
  id: c33
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1038%252Fnrm2640.zip/10.1038%252Fnrn3475.pdf"]
  trich: "Effect inflation is worst for small, low-powered studies, which can only detect effects that happen to be large. If, for example, the true effect is medium-sized, only those small studies that, by chance, overestimate the magnitude of the effect will pass the threshold for discovery."
  ghi_chu: "Button 2013, mục winner's curse."
- trang: bang-chung/co-mau-suc-manh
  id: c34
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1038%252Fnrm2640.zip/10.1038%252Fnrn3475.pdf"]
  trich: "A study with low statistical power has a reduced chance of detecting a true effect, but it is less well appreciated that low power also reduces the likelihood that a statistically significant result reflects a true effect."
  ghi_chu: "Tóm tắt."
- trang: bang-chung/co-mau-suc-manh
  id: c35
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1038%252Fnrm2640.zip/10.1038%252Fnrn3475.pdf", "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5333800/fullTextXML"]
  trich: "The consequences of this include overestimates of effect size and low reproducibility of results."
  ghi_chu: "Button tóm tắt; Szucs & Ioannidis: 'the recently reported low replication success in psychology is realistic'."
