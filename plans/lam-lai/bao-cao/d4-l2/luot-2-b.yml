- trang: bang-chung/phan-tich-tong-hop
  id: pt1
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "Potential advantages of meta-analyses include an improvement in precision, the ability to answer questions not posed by individual studies, and the opportunity to settle controversies arising from conflicting claims."
  ghi_chu: "Cochrane 10, Key Points. Câu chung về lý do gộp; Fischer 2011 cũng gộp vì nghiên cứu lẻ khác nhau về tình huống."
- trang: bang-chung/phan-tich-tong-hop
  id: pt2
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf", "https://doi.org/10.1037/a0023304"]
  trich: "The present work (a) integrates the bystander literature from the 1960s to 2010"
  ghi_chu: "Tóm tắt Fischer và cộng sự 2011 (Psychological Bulletin 137(4)), toàn văn ở Internet Archive."
- trang: bang-chung/phan-tich-tong-hop
  id: pt3
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf"]
  trich: "We obtained a total of 153 effect size estimates with a final sample of N = 105 fully independent effect size estimates from N = 53 articles on the basis of more than 7,700 participants"
  ghi_chu: "Mục Final Sample of Studies, tr. 523."
- trang: bang-chung/phan-tich-tong-hop
  id: pt4
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf"]
  trich: "The weighted mean effect size ... was -0.35 for the fixed effects model (95% CI [-0.40, -0.29] ...) and -0.33 for the random effects model"
  ghi_chu: "Mục Mean Effect Sizes. Mô hình hiệu ứng ngẫu nhiên cho −0,33."
- trang: bang-chung/phan-tich-tong-hop
  id: pt5
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf", "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "Meta-analysis is the statistical combination of results from two or more separate studies."
  ghi_chu: "Fischer gọi công trình là meta-analysis (tiêu đề: A Meta-Analytic Review)."
- trang: bang-chung/phan-tich-tong-hop
  id: pt6
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "they also have the potential to mislead seriously, particularly if specific study designs, within-study biases, variation across studies, and reporting biases are not carefully considered."
  ghi_chu: "Cochrane 10, Key Points."
- trang: bang-chung/phan-tich-tong-hop
  id: pt8
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "Meta-analysis is the statistical combination of results from two or more separate studies."
  ghi_chu: "Cochrane 10, Key Points."
- trang: bang-chung/phan-tich-tong-hop
  id: pt9
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "Meta-analysis is typically a two-stage process. In the first stage, a summary statistic is calculated for each study ... The basic data required for the analysis are therefore an estimate of the intervention effect and its standard error from each study."
  ghi_chu: "Mục 10.2.1 và 10.3; dữ liệu từng người (individual participant data) có chương riêng (Chương 26), mục 10.11.3 nhắc tới."
- trang: bang-chung/phan-tich-tong-hop
  id: pt10
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "the weight given to each study is chosen to be the inverse of the variance of the effect estimate ... Thus, larger studies, which have smaller standard errors, are given more weight than smaller studies"
  ghi_chu: "Mục 10.2.1 (trung bình có trọng số) và 10.3."
- trang: bang-chung/phan-tich-tong-hop
  id: pt11
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-12"]
  trich: "Synthesis methods that involve vote counting based on statistical significance have serious limitations and are unacceptable."
  ghi_chu: "Câu này ở Chương 12 (Key Points và mục 12.2.2.1), không phải Chương 10; câu trên trang không nêu chương nên vẫn đúng."
- trang: bang-chung/phan-tich-tong-hop
  id: pt12
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "In the first stage, a summary statistic is calculated for each study, to describe the observed intervention effect in the same way for every study. ... a summary (combined) intervention effect estimate is calculated as a weighted average"
  ghi_chu: "Mục 10.2.1."
- trang: bang-chung/phan-tich-tong-hop
  id: pt13
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "The standard error of the summary intervention effect can be used to derive a confidence interval, which communicates the precision (or uncertainty) of the summary estimate"
  ghi_chu: "Mục 10.2.1."
- trang: bang-chung/phan-tich-tong-hop
  id: pt14
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "Meta-analyses are usually illustrated using a forest plot. ... A forest plot displays effect estimates and confidence intervals for both individual studies and meta-analyses"
  ghi_chu: "Mục 10.2.1."
- trang: bang-chung/phan-tich-tong-hop
  id: pt15
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10", "https://pmc.ncbi.nlm.nih.gov/articles/PMC1120528/"]
  trich: "Each study is represented by a block at the point estimate of intervention effect with a horizontal line extending either side of the block. ... the horizontal line depicts the confidence interval"
  ghi_chu: "Cochrane 10.2.1; Lewis & Clarke 2001 (BMJ) mô tả khối vuông. Diện tích khối là trọng số (câu không nói, không sai)."
- trang: bang-chung/phan-tich-tong-hop
  id: pt16
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "The confidence interval depicts the range of intervention effects compatible with the study’s result."
  ghi_chu: "Mục 10.2.1."
- trang: bang-chung/phan-tich-tong-hop
  id: pt17
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-06", "https://pmc.ncbi.nlm.nih.gov/articles/PMC1120528/"]
  trich: "For difference measures, a value of 0 represents no difference between the groups."
  ghi_chu: "Cochrane 6 (mục 6.1, đo chênh lệch); Lewis & Clarke 2001: 'line of no effect'."
- trang: bang-chung/phan-tich-tong-hop
  id: pt18
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10", "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-15"]
  trich: "The confidence interval depicts the range of intervention effects compatible with the study’s result. ... A common mistake is to confuse ‘no evidence of an effect’ with ‘evidence of no effect’."
  ghi_chu: "Cochrane 10.2.1 và 15.6.4; Cochrane 15: khoảng tin cậy 95% loại giá trị không khi và chỉ khi p < 0,05."
- trang: bang-chung/phan-tich-tong-hop
  id: pt19
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10", "https://pmc.ncbi.nlm.nih.gov/articles/PMC1120528/"]
  trich: "the summary result, presented as a diamond at the bottom."
  ghi_chu: "Cochrane 10.2.1; Lewis & Clarke 2001."
- trang: bang-chung/phan-tich-tong-hop
  id: pt20
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC1120528/", "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "The centre of the diamond represents the pooled point estimate, and its horizontal tips represent the confidence interval."
  ghi_chu: "Lewis & Clarke 2001; Cochrane 10.2.1: khoảng tin cậy thể hiện độ chính xác của ước lượng gộp."
- trang: bang-chung/phan-tich-tong-hop
  id: pt22
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf", "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-06"]
  trich: "we computed the index g by subtracting the mean for the control group (no bystander present) from the mean for the experimental group (bystander present group) and divided the difference by the pooled within-group standard deviation."
  ghi_chu: "Fischer tr. 523; Cochrane 6.5.1.2 gọi chỉ số này là Hedges' (adjusted) g, tức đã hiệu chỉnh cho mẫu nhỏ."
- trang: bang-chung/phan-tich-tong-hop
  id: pt23
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf"]
  trich: "Hence, a negative sign indicated an inhibitory effect of bystanders on helping behavior."
  ghi_chu: "Fischer tr. 523."
- trang: bang-chung/phan-tich-tong-hop
  id: pt24
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.112.1.155.pdf", "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-15"]
  trich: "d = .20, .50, and .80"
  ghi_chu: "Cohen 1992, Bảng 1 (bản tái hiện quy ước của Cohen 1988); Cochrane 15.5.3.1 dẫn Cohen 1988: 0,2 nhỏ, 0,5 vừa, 0,8 lớn."
- trang: bang-chung/phan-tich-tong-hop
  id: pt25
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf"]
  trich: "which amounts to a small to moderate effect (Cohen, 1988)"
  ghi_chu: "Mục Mean Effect Sizes."
- trang: bang-chung/phan-tich-tong-hop
  id: pt26
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.112.1.155.pdf", "https://online.ucpress.edu/collabra/article/8/1/33267/120491/Sample-Size-Justification"]
  trich: "Although the definitions were made subjectively ... Cohen’s benchmarks for small, medium, and large effects should not be used in an a-priori power analysis"
  ghi_chu: "Cohen 1992 tr. 156 (đặt quy ước chủ quan); Lakens 2022 mục The Distribution of Effect Sizes."
- trang: bang-chung/phan-tich-tong-hop
  id: pt27
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-15"]
  trich: "The SMD expresses the intervention effect in standard units rather than the original units of measurement."
  ghi_chu: "Cochrane 15.5.3.1: g là chênh lệch tính bằng đơn vị độ lệch chuẩn, không phải tỉ lệ người."
- trang: bang-chung/phan-tich-tong-hop
  id: pt29
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf"]
  trich: "The bystander effect was attenuated when situations were perceived as dangerous (compared with non-dangerous), perpetrators were present (compared with non-present), and the costs of intervention were physical (compared with non-physical)."
  ghi_chu: "Tóm tắt Fischer 2011."
- trang: bang-chung/phan-tich-tong-hop
  id: pt30
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf"]
  trich: "presents new theoretical and empirical perspectives on the novel finding of non-negative bystander effects in certain dangerous emergencies ... potentially dangerous villain acts (g = 0.29 ...)"
  ghi_chu: "Tóm tắt và mục Moderator Analyses: hành vi phạm tội g = +0,29, có kẻ gây hại g = +0,24 (dấu dương: có người chứng kiến thì giúp nhiều hơn)."
- trang: bang-chung/phan-tich-tong-hop
  id: pt31
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf", "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "Meta-analysis is a powerful tool to identify potential moderators, which are defined as variables that systematically affect the magnitude of the mean effect size"
  ghi_chu: "Fischer, mục Coding and Analysis of Potential Moderators."
- trang: bang-chung/phan-tich-tong-hop
  id: pt32
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf", "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "Magdalena Wicher and Martina Kainbacher independently coded all moderators. ... Subgroup analyses are observational by nature and are not based on randomized comparisons."
  ghi_chu: "Fischer tr. 523 (mã hóa từ các nghiên cứu); Cochrane 10.11.2 và 10.11.6."
- trang: bang-chung/phan-tich-tong-hop
  id: pt33
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf"]
  trich: "non-emergency situations reflected non-dangerous mishaps, such as spilt pens or a flat tire; villain acts reflected situations where a perpetrator committed some form of crime"
  ghi_chu: "Fischer tr. 523; bộ nghiên cứu gồm Schwartz & Gottlieb 1976 (vụ trộm có bạo lực, có đánh dấu là bài được gộp). Nghiên cứu gộp từ 1960 đến 2010."
- trang: bang-chung/phan-tich-tong-hop
  id: pt34
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "Variation across studies (heterogeneity) must be considered"
  ghi_chu: "Cochrane 10, Key Points."
- trang: bang-chung/phan-tich-tong-hop
  id: pt35
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "A low P value (or a large Chi2 statistic relative to its degree of freedom) provides evidence of heterogeneity of intervention effects (variation in effect estimates beyond chance)."
  ghi_chu: "Mục 10.10.2; mục 10.10.1 nêu nguồn là khác biệt lâm sàng (người tham gia, can thiệp) và phương pháp."
- trang: bang-chung/phan-tich-tong-hop
  id: pt36
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf"]
  trich: "Further analyses within the fixed effects model revealed that the sample of effect sizes was heterogeneous, QT(104) = 266.29, p < .001. Therefore, further moderator analyses were required."
  ghi_chu: "Mục Mean Effect Sizes."
- trang: bang-chung/phan-tich-tong-hop
  id: pt37
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "It is important to identify heterogeneity in case there is sufficient information to explain it and offer new insights. ... subgroup analyses and meta-regressions are entirely observational in their nature."
  ghi_chu: "Mục 10.10.2 và 10.11.6."
- trang: bang-chung/phan-tich-tong-hop
  id: pt38
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13"]
  trich: "‘statistically significant’ results that suggest an intervention works are more likely than ‘statistically non-significant’ results to be available, available rapidly, available in high impact journals and cited by others, and hence more easily identifiable for systematic reviews."
  ghi_chu: "Cochrane 13.1."
- trang: bang-chung/phan-tich-tong-hop
  id: pt39
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13"]
  trich: "A funnel plot is a simple scatter plot of intervention effect estimates from individual studies against a measure of each study’s size or precision."
  ghi_chu: "Mục 13.3.4.2."
- trang: bang-chung/phan-tich-tong-hop
  id: pt40
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13"]
  trich: "it is most common to plot the effect estimates on the horizontal scale, and thus the measure of study size on the vertical axis."
  ghi_chu: "Mục 13.3.4.2; Cochrane khuyên trục dọc là sai số chuẩn (vẽ ngược, nên nghiên cứu lớn ở trên), khớp câu."
- trang: bang-chung/phan-tich-tong-hop
  id: pt41
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13"]
  trich: "Effect estimates from small studies will therefore typically scatter more widely at the bottom of the graph, with the spread narrowing among larger studies. Ideally, the plot should approximately resemble a symmetrical (inverted) funnel."
  ghi_chu: "Mục 13.3.4.2. 'Đáp án' ở đỉnh hiểu là hiệu ứng thật khi không có thiên lệch (Hình 13.3.b, panel A)."
- trang: bang-chung/phan-tich-tong-hop
  id: pt42
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13"]
  trich: "smaller studies without statistically significant effects ... remain unpublished, this will lead to an asymmetrical appearance of the funnel plot with a gap at the bottom corner ... the summary estimate ... will tend to over-estimate the intervention effect"
  ghi_chu: "Mục 13.3.4.2."
- trang: bang-chung/phan-tich-tong-hop
  id: pt43
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13"]
  trich: "the funnel plot should be seen as a generic means of displaying small-study effects ... Small-study effects may be due to reasons other than non-reporting bias"
  ghi_chu: "Mục 13.3.4.3."
- trang: bang-chung/phan-tich-tong-hop
  id: pt44
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf"]
  trich: "The funnel plot was relatively symmetrical and thus no studies had to be imputed by the Trim and Fill analysis. ... the estimated effect size for the bystander effect did not change (g = -0.35, 95% CI [-0.41, -0.29])."
  ghi_chu: "Mục Controlling Publication Bias."
- trang: bang-chung/phan-tich-tong-hop
  id: pt46
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "Potential advantages of meta-analyses include an improvement in precision"
  ghi_chu: "Đúng theo nghĩa độ chính xác thống kê (khoảng tin cậy hẹp hơn); không có nghĩa là hết thiên lệch (Cochrane 10.1, 13.3). Các câu pt52, pt53 đã nói giới hạn này."
- trang: bang-chung/phan-tich-tong-hop
  id: pt47
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "When there is little information, either because there are few studies or if the studies are small with few events, a random-effects analysis will provide poor estimates of the amount of heterogeneity ... This approach can yield overly narrow confidence intervals for the summary effect, particularly when there are few studies"
  ghi_chu: "Mục 10.10.4.2 và 10.10.4.4."
- trang: bang-chung/phan-tich-tong-hop
  id: pt48
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-15", "https://pmc.ncbi.nlm.nih.gov/articles/PMC1120528/"]
  trich: "The 95% confidence interval for an effect will exclude the null value ... if and only if the test of significance yields a P value of less than 0.05."
  ghi_chu: "Cochrane 15.3; Lewis & Clarke 2001: 'Significance is achieved ... if the diamond is clear of the line of no effect.'"
- trang: bang-chung/phan-tich-tong-hop
  id: pt49
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "Undertake (or display) a meta-analysis only if participants, interventions, comparisons and outcomes are judged to be sufficiently similar to ensure an answer that is clinically meaningful."
  ghi_chu: "MECIR C62 (mức bắt buộc), mục 10.10."
- trang: bang-chung/phan-tich-tong-hop
  id: pt50
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13"]
  trich: "funnel plot asymmetry should not be considered to be diagnostic for the presence of non-reporting bias."
  ghi_chu: "Mục 13.3.4.5."
- trang: bang-chung/phan-tich-tong-hop
  id: pt51
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "Authors should, whenever possible, pre-specify characteristics in the protocol that later will be subject to subgroup analyses or meta-regression."
  ghi_chu: "Mục 10.11.5.2."
- trang: bang-chung/phan-tich-tong-hop
  id: pt52
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10"]
  trich: "results of meta-analyses can be very misleading if suitable attention has not been given to formulating the review question; specifying eligibility criteria; identifying and selecting studies; collecting appropriate data; considering risk of bias"
  ghi_chu: "Mục 10.1."
- trang: bang-chung/phan-tich-tong-hop
  id: pt53
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10", "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13"]
  trich: "Most meta-analysis methods are variations on a weighted average ... they also have the potential to mislead seriously, particularly if specific study designs, within-study biases ... are not carefully considered."
  ghi_chu: "Nội dung đúng. Đây là nguyên tắc phương pháp, xét theo đồng thuận: Cochrane Handbook (hướng dẫn phương pháp chuẩn) nói rõ cả hai vế, nên mức Vững chắc là hợp. Danh sách không ghi nhãn nào được gán, nên chỉ xét nội dung; lượt 1 kiểm nhãn trong hồ sơ."
- trang: bang-chung/phan-tich-tong-hop
  id: pt54
  luot_2: dung
  nguon: ["https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf"]
  trich: "In a fixed effects model ... revealed an overall effect size of g = -0.35. The bystander effect was attenuated when situations were perceived as dangerous"
  ghi_chu: "Nội dung khớp tóm tắt Fischer 2011. Danh sách không ghi nhãn. Theo mục 4: hiệu ứng chính (g âm) có một phân tích tổng hợp tốt, đủ cho Vững chắc; vế 'yếu đi khi nguy hiểm' dựa trên so sánh giữa các nghiên cứu (biến điều chỉnh mã hóa lại, không định trước) trong một phân tích tổng hợp, hợp với Khá vững hơn là Vững chắc. Nếu khung gộp hai vế mà gán Vững chắc thì nên xem lại."
- trang: bang-chung/phan-tich-tong-hop
  id: pt57
  luot_2: dung
  nguon: ["https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13"]
