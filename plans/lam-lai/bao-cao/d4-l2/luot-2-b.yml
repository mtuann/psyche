  id: c22
  luot_2: dung
  nguon: ["https://api.openalex.org/works/doi:10.1037/1089-2680.7.4.331"]
  trich: "social psychological effects typically yield a value of r equal to .21"
  ghi_chu: "Tự tính: d = 2r/√(1 − r²) = 0,42/√(1 − 0,0441) = 0,430. Cỡ mẫu cho d = 0,43, công suất 0,8, t hai mẫu hai phía α = 0,05: 86 mỗi nhóm (cùng phép tính như c18). 0,43 nằm giữa 0,2 và 0,5."
