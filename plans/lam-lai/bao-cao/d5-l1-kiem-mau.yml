- trang: kham-pha/tri-nho/duong-cong-quen
  id: n1
  cau: Học ngắt quãng giúp nhớ lâu hơn học dồn trong một đêm, và tự kiểm tra giúp nhớ lâu hơn đọc lại (mô tả của trang).
  loai: phat-hien
  nguon:
    - ten: "Cepeda và cộng sự (2008), Psychol Sci 19(11), 1095–1102: toàn văn (PDF trong Internet Archive, bộ wikipedia-scholarly-sources-corpus)"
      link: https://doi.org/10.1111/j.1467-9280.2008.02209.x
    - ten: "Rowland (2014), Psychol Bull 140(6), 1432–1463: tóm tắt (Europe PMC); các câu khác theo G1-L01"
      link: https://doi.org/10.1037/a0037559
  ket_qua_luot_1: da-sua
  ghi_chu: 'Mô tả (description). Chữ cũ: "Học ngắt quãng và tự kiểm tra giúp nhớ lâu hơn học dồn trong một đêm"; chữ mới tách hai so sánh (tự kiểm tra so với đọc lại, không so với học dồn). Lý do: tự kiểm tra được so với đọc lại (Rowland 2014; Roediger & Karpicke 2006), không so với học dồn. Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
