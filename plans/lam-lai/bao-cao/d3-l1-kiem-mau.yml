- trang: thi-nghiem/khi-dot-vo-hinh
  id: n46
  cau: Hộp "Tóm tắt nhanh" ở đầu trang dựng tự động từ ý chính của các khung nhãn của trang.
  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: "Đã kiểm trong src/plugins/thanh-phan.mjs (tomTat) và psyche-markdown.mjs. Review (Claude Sonnet 5.5, 30/10/2026): dung. Kiểm src/plugins/psyche-markdown.mjs (chỉ thị tom-tat gọi tomTat) và thanh-phan.mjs dòng 56 (tomTat dựng từ khung nhãn của trang)."
- trang: thi-nghiem/pygmalion
  id: nt
  cau: 'Nhãn Đang tranh cãi: con số gốc có đáng tin, và kỳ vọng "đúng" hay "tự ứng nghiệm".'
  loai: nhan
  nguon:
    - ten: "Thorndike (1968), Am Educ Res J 5(4), 708–711: toàn văn bài điểm sách (bản quét trên gwern.net)"
      link: https://doi.org/10.3102/00028312005004708
    - ten: "Snow (1995), Curr Dir Psychol Sci 4(6), 169–171, Pygmalion and intelligence?: toàn văn (bản trên gwern.net)"
      link: https://doi.org/10.1111/1467-8721.ep10772605
    - ten: "Jussim & Harber (2005), Pers Soc Psychol Rev 9(2), 131–155: toàn văn (bản trên gwern.net)"
      link: https://doi.org/10.1207/s15327957pspr0902_3
  ket_qua_luot_1: dung
  ghi_chu: "Review (Claude Sonnet 5.5, 30/10/2026): dung. Đang tranh cãi hợp lý: Thorndike 1968 và Snow 1995 (hiệu ứng biến mất khi bỏ điểm cực đoan) đối lập với R&J và Jussim & Harber (một số chỉ trích yếu hơn nghiên cứu gốc); hiệu ứng trung bình nhỏ hơn nhiều so với tuyên bố ban đầu. Đúng mục 4."
- trang: thi-nghiem/pygmalion
  id: e2
  cau: Thầy cô trong nghiên cứu không biết danh sách là ngẫu nhiên, và không ai bảo họ phải ưu ái nhóm "nở muộn".
  loai: phat-hien
  nguon:
    - ten: "Raudenbush (1984), J Educ Psychol 76(1), 85–97: toàn văn (bản quét trên gwern.net)"
      link: https://doi.org/10.1037/0022-0663.76.1.85
    - ten: "Jussim & Harber (2005), Pers Soc Psychol Rev 9(2), 131–155: toàn văn (bản trên gwern.net)"
      link: https://doi.org/10.1207/s15327957pspr0902_3
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "thầy cô trong nghiên cứu không hề cố ý thiên vị". Chữ mới: "không biết danh sách là ngẫu nhiên, và không ai bảo họ phải ưu ái". Lý do: "không hề cố ý thiên vị" là kết luận về động cơ; nguồn chỉ nói giáo viên bị cho biết danh sách giả. Review (Claude Sonnet 5.5, 30/10/2026): dung. Raudenbush tr. 85: giáo viên được báo tên "bloomers", thực tế là 20% chọn ngẫu nhiên; không có chỉ dẫn ưu ái. Trang chỉ nói điều nguồn nói.'
- trang: thi-nghiem/milgram
  id: n17
  cau: Người tham gia được trả 4,5 đô la (và được nói rằng tiền ấy là của họ dù chuyện gì xảy ra).
  loai: so-lieu
  nguon:
    - ten: "Milgram (1963), J Abnorm Soc Psychol 67(4), 371–378: toàn văn (PDF ở psy.miami.edu)"
      link: https://doi.org/10.1037/h0040525
  ket_qua_luot_1: dung
- trang: thi-nghiem/robbers-cave
  id: s12
  cau: Mỗi nhóm đánh giá nhóm kia kém hơn hẳn nhóm mình, với những tính xấu như lén lút, tự cao, đáng ghét (sneaky, smart alecks, stinkers).
  loai: phat-hien
  nguon:
    - ten: "Sherif, Harvey, White, Hood & Sherif (1954/1961), Intergroup conflict and cooperation: The Robbers Cave experiment: toàn văn báo cáo 1954 (bản in 1961, số trang [p. xx] theo bản 1961) trên Classics in the History of Psychology; bản 1988 của Wesleyan University Press không mở được"
      link: https://psychclassics.yorku.ca/Sherif/
  ket_qua_luot_1: da-sua
  ghi_chu: 'Chữ cũ: "cả hai nhóm gán cho nhau đúng cùng một bộ tính xấu (\"bọn nó chơi bẩn\")". Chữ mới: câu trên. Lý do: bảng đánh giá dùng sáu tính từ (brave, tough, friendly, sneaky, smart alecs, stinkers); "chơi bẩn" là trích dẫn không có trong nguồn. Review (Claude Sonnet 5.5, 30/10/2026): dung. Chương 6: sáu tính từ (brave, tough, friendly, sneaky, smart alecs, stinkers). Trang khớp.'
