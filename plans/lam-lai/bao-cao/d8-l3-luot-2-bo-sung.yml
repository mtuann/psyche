# Lượt 2, lô D8-L3, phần bổ sung. Model: Claude Opus 5.5. Ngày 17/11/2026.
# Ghi chú: file danh sách không có mục `id: nhan` của thẻ nao-10; chỉ có nao-10 g4 (đã kiểm dưới đây).
- trang: du-lieu/ngo-nhan/eq-hon-iq
  id: g4
  luot_2: dung
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:%2210.1037/a0017286%22&resultType=core&format=json"]
  trich: "relationships between ability-based EI and job performance are shown to be inconsistent (i.e., EI positively predicts performance for high emotional labor jobs and negatively predicts performance for low emotional labor jobs)"
  ghi_chu: "Tóm tắt của Joseph & Newman 2010 (J Appl Psychol, doi 10.1037/a0017286) qua Europe PMC; chỉ đọc tóm tắt, tóm tắt nói đúng điều câu viết."
- trang: du-lieu/ngo-nhan/gach-chan-hieu-qua
  id: nhan
  luot_2: dung
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:%2210.1177/1529100612453266%22&resultType=core&format=json", "https://link.springer.com/article/10.1007/s10648-021-09654-1"]
  trich: "Dunlosky 2013: 'Five techniques received a low utility assessment: summarization, highlighting, ... Most students report rereading and highlighting, yet these techniques do not consistently boost students' performance'. Ponce 2022: 'learner-generated highlighting improved memory but not comprehension, with average effect sizes of 0.36 and 0.20 ... improved learning for college students but not for school students'."
  ghi_chu: "Hai nguồn bậc 2 chất lượng cao không cùng chiều: tổng quan Dunlosky và cộng sự 2013 (PSPI) xếp gạch chân 'ít hữu ích'; phân tích tổng hợp Ponce, Mayer & Méndez 2022 thấy tự gạch chân giúp nhớ (0,36) nhưng không giúp hiểu và không giúp học sinh phổ thông. Hợp điều kiện 'Đang tranh cãi' của thước đo mục 4 (bằng chứng chất lượng cao mâu thuẫn; hiệu ứng có điều kiện). Chỉ đọc tóm tắt cả hai."
- trang: du-lieu/ngo-nhan/gach-chan-hieu-qua
  id: g2
  luot_2: qua-manh
  nguon: ["https://link.springer.com/article/10.1007/s10648-021-09654-1"]
  trich: "We found 36 published articles ... which generated 85 effect sizes. The results showed that learner-generated highlighting improved memory but not comprehension, with average effect sizes of 0.36 and 0.20, respectively ... Learner-generated highlighting improved learning for college students but not for school students, with average effect sizes of 0.39 and 0.24, respectively"
  cau_dung: "Ponce, Mayer & Méndez 2022 (36 bài, 85 hiệu ứng): tự gạch chân giúp nhớ (0,36) nhưng không giúp hiểu (0,20, không đạt ý nghĩa); giúp sinh viên đại học (0,39) nhưng không giúp học sinh phổ thông (0,24)."
  ghi_chu: "Số đúng, nhưng tác giả viết 'not comprehension', 'not for school students': hai hiệu ứng 0,20 và 0,24 không được coi là có tác dụng. Câu 'giúp hiểu ít hơn', 'giúp sinh viên hơn học sinh' ngụ ý vẫn có giúp. Chỉ đọc tóm tắt (trang Springer)."
- trang: du-lieu/ngo-nhan/hoc-khi-ngu
  id: g1
  luot_2: dung
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4231834/"]
  trich: "previous reports of sleep-encoding lack convincing proof that participants were sleeping continuously during verbal stimulation (for reviews see Simon and Emmons, 1955; Hoskovec, 1966; Aarons, 1976; Eich, 1990). It is possible that encoding was mediated by brief phases of wakefulness in these studies. Studies that properly monitored the absence of wakefulness did not find evidence of sleep-encoding."
  ghi_chu: "Toàn văn Ruch, Koenig, Mathis, Roth & Henke 2014 (Front Psychol) qua Europe PMC, phần Mở đầu. Câu dẫn Simon & Emmons 1955 là một trong bốn tổng quan; đúng ý."
- trang: du-lieu/ngo-nhan/mbti
  id: g3
  luot_2: dung
  nguon: ["https://api.crossref.org/works/10.1111/j.1744-6570.1991.tb00688.x", "https://nap.nationalacademies.org/read/1580/chapter/8"]
  trich: "Barrick & Mount 1991: 'Conscientiousness, showed consistent relations with all job performance criteria for all occupational groups'. NRC 1991, chương 5: 'Third, no evidence has been presented on relationships to performance in those occupations.'"
  ghi_chu: "Barrick & Mount: tóm tắt qua Crossref. NRC 1991 (In the Mind's Eye, chương 5 'Developing Careers', tr. 98–99): đọc toàn văn trên NAP; câu nói về liên hệ giữa loại MBTI và hiệu quả trong các nghề."
- trang: du-lieu/ngo-nhan/mozart
  id: g1
  luot_2: dung
  nguon: ["https://api.ies.ed.gov/eric/?search=title:%22Mozart%20Effect%22%20AND%20author:Rauscher&format=json", "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:%2210.1016/0304-3940(94)11221-4%22&resultType=core&format=json", "https://pmc.ncbi.nlm.nih.gov/articles/PMC9988829/"]
  trich: "Rauscher & Hinton 2006 (tóm tắt ở ERIC EJ746455): '\"The Mozart effect\" originally referred to the phenomenon of a brief enhancement of spatial-temporal abilities in college students after listening to a Mozart piano sonata (K. 448).' Rauscher và cộng sự 1995: 'listening to a Mozart piano sonata produced significant short-term enhancement of spatial-temporal reasoning in college students'."
  ghi_chu: "Bài gốc Rauscher, Shaw & Ky 1993 (Nature) bị chặn; xác nhận bằng tóm tắt của chính các tác giả (1995, 2006) và Oberleiter & Pietschnig 2023 (KV448, bài không gian). 'Ngay sau khi nghe' khớp 'short-term'/'brief'."
- trang: du-lieu/ngo-nhan/mozart
  id: g2
  luot_2: khong-chac
  nguon: []
  ghi_chu: "Toàn văn Rauscher & Hinton 2006 (Educational Psychologist 41(4), doi 10.1207/s15326985ep4104_3) không mở được: Taylor & Francis chặn, bản PDF ở trang trường không được phép tải trong phiên này. Tóm tắt (ERIC EJ746455) chỉ nói thuật ngữ bị lẫn với nghiên cứu học nhạc, gây nhầm lẫn 'in the minds of the general public'; không có câu gọi ý tăng trí thông minh nói chung là ngộ nhận. Đoạn trích ở kết quả tìm kiếm cho thấy bài có câu 'much of the controversy ... is due to the misconception that Mozart's music can enhance general intelligence', nhưng chưa đọc chữ thật."
- trang: du-lieu/ngo-nhan/nao-10
  id: g4
  luot_2: qua-manh
  nguon: ["https://pmc.ncbi.nlm.nih.gov/articles/PMC3475349/"]
  trich: "A study examining neuroscience knowledge in the general population of Brazil revealed that many misconceptions existed among the general public ... (Herculano-Houzel, 2002). The statement \"we only use 10% of our brain\", defined by the Organisation for Economic Co-operation, and Development (2002) as a neuromyth, was the most prevalent misconception among the public."
  cau_dung: "Theo Dekker 2012, OECD (2002) xếp \"ta chỉ dùng 10% bộ não\" là huyền thoại thần kinh, và trong một khảo sát công chúng ở Brazil (Herculano-Houzel 2002) đây là ngộ nhận phổ biến nhất."
  ghi_chu: "Toàn văn Dekker và cộng sự 2012 qua Europe PMC. Câu 'phổ biến nhất trong công chúng' dựa vào một khảo sát ở Brazil mà Dekker kể lại, không phải kết luận chung; trong mẫu giáo viên của Dekker, ngộ nhận 10% (48% ở Anh, 46% ở Hà Lan) không nằm trong ba ngộ nhận phổ biến nhất."
- trang: du-lieu/ngo-nhan/nguoi-ngoai-cuoc
  id: g1
  luot_2: dung
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:%2210.1037/a0023304%22&resultType=core&format=json"]
  trich: "the presence of other people in a critical situation reduces the likelihood that an individual will help ... overall effect size of g = -0.35. The bystander effect was attenuated when situations were perceived as dangerous (compared with non-dangerous)"
  ghi_chu: "Tóm tắt Fischer và cộng sự 2011 (Psychol Bull, doi 10.1037/a0023304)."
- trang: du-lieu/ngo-nhan/nhin-mat-biet-cam-xuc
  id: g1
  luot_2: dung
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:%2210.1177/1529100619832930%22&resultType=core&format=json"]
  trich: "The available scientific evidence suggests that people do sometimes smile when happy, frown when sad, scowl when angry, and so on, as proposed by the common view, more than what would be expected by chance."
  ghi_chu: "Tóm tắt Barrett và cộng sự 2019 (PSPI, PMC6640856)."
- trang: du-lieu/ngo-nhan/nhin-mat-biet-cam-xuc
  id: g2
  luot_2: dung
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:%2210.1177/1529100619832930%22&resultType=core&format=json"]
  trich: "how people communicate anger, disgust, fear, happiness, sadness, and surprise varies substantially across cultures, situations, and even across people within a single situation. Furthermore, similar configurations of facial movements variably express instances of more than one emotion category. In fact, a given configuration of facial movements, such as a scowl, often communicates something other than an emotional state."
  ghi_chu: "Tóm tắt Barrett và cộng sự 2019."
- trang: du-lieu/ngo-nhan/thoi-mien
  id: g4
  luot_2: dung
  nguon: ["https://link.springer.com/article/10.1007/BF01499329"]
  trich: "a meta-analytic review of 24 research studies. Recall accuracy for nonleading questions after a 1- to 2-day delay favored the hypnotized subjects (d =.46); however, less accurate recall was evidenced for hypnotized subjects following a delay of less tan 24 hours (d =−.29) or a one-week delay (d =−.24). The recall of hypnotized subjects also displayed more intrusion of uncued errors and higher levels of pseudomemory. Hypnotized subjects also expressed higher levels of confidence"
  ghi_chu: "Tóm tắt Steblay & Bothwell 1994 (Law Hum Behav) trên trang Springer; mọi con số khớp."
- trang: du-lieu/ngo-nhan/thuc-khuya-on-thi
  id: g1
  luot_2: dung
  nguon: ["https://api.crossref.org/works/10.1101/lm.132106"]
  trich: "In two experiments, we examined high school students' ability to remember vocabulary. We show that declarative memory is enhanced when sleep follows within a few hours of learning ... Sleep deprivation has a detrimental effect on memory, which was significant after a night of recovery sleep."
  ghi_chu: "Tóm tắt Gais, Lucas & Born 2006 (Learn Mem 13(3)) qua Crossref."
- trang: du-lieu/ngo-nhan/tre-song-ngu-cham-noi
  id: g1
  luot_2: dung
  nguon: ["https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:%2210.1017/s0305000901004718%22&resultType=core&format=json"]
  trich: "Three children acquiring Langues des Signes Québécoise and French, and three children acquiring French and English ... were videotaped regularly over one year ... both groups achieved their early linguistic milestones in each of their languages at the same time (and similarly to monolinguals)"
  ghi_chu: "Tóm tắt Petitto và cộng sự 2001 (J Child Lang); 3 + 3 = 6 trẻ."
