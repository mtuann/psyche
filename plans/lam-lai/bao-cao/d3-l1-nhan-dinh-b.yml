- trang: thi-nghiem/milgram
  id: n1
  cau: "Milgram (1963) đo người bình thường đi xa đến đâu khi một nhà khoa học yêu cầu giật điện người khác: 26 trên 40 người (65%) đi đến nấc 450V."
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n2
  cau: Người tham gia tin rằng mình dự một nghiên cứu về trí nhớ, có trả công, tại một trường đại học.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n3
  cau: Người tham gia bốc thăm và luôn trúng vai "thầy giáo" (vì bốc thăm gian lận); "học trò" là người cộng tác của Milgram.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n4
  cau: Mỗi khi học trò trả lời sai, thầy giáo bấm nút phạt bằng điện, mỗi lần tăng thêm một nấc.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n5
  cau: Học trò là một người đàn ông lịch sự (đa số người quan sát thấy anh ta hiền lành, dễ mến), ngồi phòng bên.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n6
  cau: Ở nấc 300V, học trò đập vào tường và không trả lời nữa; người thí nghiệm nói "Thí nghiệm yêu cầu anh tiếp tục".
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n7
  cau: Người thí nghiệm mặc áo choàng xám của kỹ thuật viên (không phải áo choàng trắng).
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n8
  cau: Người thí nghiệm là một giáo viên sinh học 31 tuổi.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n9
  cau: Khi được mô tả thí nghiệm, 14 sinh viên năm cuối ngành tâm lý ở Yale ước tính từ 0 đến 3 trên 100 người đi đến nấc cuối (trung bình 1,2).
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n10
  cau: Đồng nghiệp của Milgram cũng nghĩ hầu như không ai đi quá nấc "Rất mạnh" (Very Strong Shock).
  loai: lich-su
- trang: thi-nghiem/milgram
  id: n11
  cau: Cả sinh viên lẫn đồng nghiệp đều dự đoán sai rất xa so với kết quả.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n12
  cau: Máy giật điện (giả) có 30 nấc từ 15V đến 450V, tăng 15V mỗi nấc.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n13
  cau: 'Các nấc chia nhóm bằng nhãn từ "Shock nhẹ" đến "Nguy hiểm: giật mạnh"; hai nấc cuối chỉ đánh dấu XXX (nên nấc 450V không ghi "Nguy hiểm: giật mạnh").'
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n14
  cau: Người tham gia đổ mồ hôi, run, nói lắp, và có người cười gượng đến mức lên cơn co giật vì căng thẳng; tay vẫn bấm nút.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n15
  cau: "Vâng lời ở đây không hẳn là sự thản nhiên lạnh lùng: nhiều người căng thẳng rõ rệt; cách giải thích điều đó còn tranh cãi."
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n16
  cau: Milgram tuyển 40 người đàn ông tuổi 20–50, đủ nghề nghiệp, qua quảng cáo trên báo và thư mời gửi trực tiếp.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n17
  cau: Người tham gia được trả 4,5 đô la (và được nói rằng tiền ấy là của họ dù chuyện gì xảy ra).
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n18
  cau: Học trò do một kế toán viên 47 tuổi được huấn luyện cho vai đóng (không phải "diễn viên tên Wallace").
  loai: lich-su
- trang: thi-nghiem/milgram
  id: n19
  cau: Học trò trả lời sai theo kịch bản; không có phản hồi hay dấu hiệu phản đối nào cho đến nấc 300V; sau cú giật 315V tiếng đập tường lặp lại rồi anh ta im hẳn.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n20
  cau: Ở các biến thể về sau của Milgram (như Thí nghiệm 5), học trò bắt đầu kêu phản đối từ nấc 150V.
  loai: lich-su
- trang: thi-nghiem/milgram
  id: n21
  cau: 'Thí nghiệm 1963 có 4 câu thúc ép, dùng theo đúng thứ tự: "Xin hãy tiếp tục"; "Thí nghiệm yêu cầu anh tiếp tục"; "Điều tuyệt đối cần thiết là anh phải tiếp tục"; "Anh không còn lựa chọn nào khác, anh phải tiếp tục".'
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n22
  cau: 'Hai câu thúc ép đặc biệt: "Dù cú giật có thể đau, nó không gây tổn thương mô vĩnh viễn, xin anh tiếp tục" và "Dù học trò có muốn hay không, anh vẫn phải tiếp tục cho đến khi cậu ấy học thuộc hết các cặp từ".'
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n23
  cau: 26 trên 40 người (65%) đi đến 450V; 14 người dừng lại trong khoảng 300–375V.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n24
  cau: Tất cả 40 người đều đi đến 300V, nấc mà học trò đập vào tường và ngừng trả lời.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n25
  cau: Burger (2009) làm lại một phần Thí nghiệm 5 của Milgram, 45 năm sau, và dừng ở nấc 150V.
  loai: tai-lap
- trang: thi-nghiem/milgram
  id: n26
  cau: Trong Thí nghiệm 5, 79% những người đã vượt qua 150V (26 trên 33) đi tiếp đến 450V.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n27
  cau: Burger có 70 người trưởng thành, chia hai điều kiện; điều kiện cơ sở có 40 người.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n28
  cau: Ở điều kiện cơ sở, 70% (28/40) tiếp tục sau 150V, so với 82,5% ở Thí nghiệm 5 của Milgram; chênh lệch không có ý nghĩa thống kê.
  loai: tai-lap
- trang: thi-nghiem/milgram
  id: n29
  cau: Điều kiện thứ hai của Burger, trong đó người tham gia thấy một người khác từ chối, không làm khác đi so với điều kiện cơ sở.
  loai: tai-lap
- trang: thi-nghiem/milgram
  id: n30
  cau: Nam và nữ vâng lời như nhau trong lần làm lại của Burger.
  loai: tai-lap
- trang: thi-nghiem/milgram
  id: n31
  cau: 'Hiệu ứng "mù quáng" ngày nay: với chuẩn đạo đức hiện nay, thí nghiệm Milgram không còn được làm lại nguyên bản.'
  loai: lich-su
- trang: thi-nghiem/milgram
  id: n32
  cau: "Doliński và Grzyb (2017) ở Ba Lan: 80 người (40 nam, 40 nữ, tuổi 18–69), 10 nút, cường độ giảm nhẹ vì lý do đạo đức; 90% bấm đến nút cao nhất."
  loai: tai-lap
- trang: thi-nghiem/milgram
  id: n33
  cau: Doliński và Grzyb kết luận mức vâng lời cao tương tự các nghiên cứu gốc của Milgram; thiết kế khác bản gốc nên không so sánh trực tiếp được từng con số.
  loai: tai-lap
- trang: thi-nghiem/milgram
  id: n34
  cau: Ở Doliński và Grzyb, mẫu nhỏ nên chênh lệch theo giới tính của người tham gia và của học trò chưa kết luận được.
  loai: tai-lap
- trang: thi-nghiem/milgram
  id: n35
  cau: "Khá vững: áp lực quyền lực tạo ra mức vâng lời cao trong phòng thí nghiệm."
  loai: nhan
- trang: thi-nghiem/milgram
  id: n36
  cau: "Mức vâng lời thay đổi rất nhiều theo biến thể: trong 21 biến thể có đo việc đi đến 450V, tỉ lệ chung là 43,6% (740 người)."
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n37
  cau: Milgram làm 23 biến thể.
  loai: lich-su
- trang: thi-nghiem/milgram
  id: n38
  cau: 'Khá vững: nấc 150V là "điểm không quay đầu".'
  loai: nhan
- trang: thi-nghiem/milgram
  id: n39
  cau: "Đang tranh cãi: người ta vâng lời vì mù quáng hay vì tin vào mục đích."
  loai: nhan
- trang: thi-nghiem/milgram
  id: n40
  cau: Perry và cộng sự (2019) thấy trong 18 trên 23 biến thể, những người tin hoàn toàn rằng mình đang gây đau chỉ giật ở mức trung bình thấp hơn những người không tin hoàn toàn.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n41
  cau: Haslam, Reicher và cộng sự cho rằng người ta vâng lời vì đồng nhất với sứ mệnh khoa học ("engaged followership").
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n42
  cau: Cuộc tranh luận này chưa ngã ngũ.
  loai: nhan
- trang: thi-nghiem/milgram
  id: n43
  cau: "Trạng thái ủy nhiệm (Milgram): người ta trao trách nhiệm cho người có quyền lực và vì thế vâng lời."
  loai: dinh-nghia
- trang: thi-nghiem/milgram
  id: n44
  cau: Theo Reicher và cộng sự, những kẻ thi hành bạo quyền trong lịch sử thường chủ động đồng nhất với lãnh đạo và mục tiêu của họ.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n45
  cau: "Cam kết từng bước: mỗi nấc chỉ tăng 15V; giả thuyết là một bước nhỏ dễ chấp nhận hơn một bước nhảy vọt."
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n46
  cau: Khi chuyển ra văn phòng xập xệ ở Bridgeport, tỉ lệ vâng lời là 47,5%, so với 62,5% ở điều kiện tương ứng tại Yale.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n47
  cau: "Tính chính danh của bối cảnh: thí nghiệm được làm ở phòng thí nghiệm tương tác sang trọng của Yale, chi tiết quan trọng với tính chính danh của thí nghiệm."
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n48
  cau: "Vẻ chính danh: trong thí nghiệm, khi chuyển khỏi Yale sang một văn phòng ở Bridgeport, tỉ lệ vâng lời đến nấc cuối thấp hơn (47,5% so với 62,5%), dù vẫn gần một nửa. Những cuộc gọi xưng danh công an hay ngân hàng cũng mượn vẻ chính danh; đó là phép so sánh của trang, thí nghiệm Milgram không nghiên cứu lừa đảo."
  loai: loi-khuyen
- trang: thi-nghiem/milgram
  id: n49
  cau: Trong một biến thể của Milgram, khi hai người đóng vai "thầy giáo" khác từ chối tiếp tục, chỉ 4 trên 40 người tham gia thật vâng lời đến nấc cuối.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n50
  cau: Biết trước bốn câu thúc ép giúp ta nhận ra chúng khi gặp ngoài đời.
  loai: loi-khuyen
- trang: thi-nghiem/milgram
  id: n51
  cau: 'Câu "anh không còn lựa chọn nào khác" là lời thúc ép, không phải sự thật: 14 trong 40 người vẫn từ chối tiếp tục dù bị thúc ép.'
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n52
  cau: Milgram làm thí nghiệm ở Mỹ, Burger cũng ở Mỹ, Doliński và Grzyb ở Ba Lan.
  loai: lich-su
- trang: thi-nghiem/milgram
  id: n53
  cau: Tính đến 10/2026, chúng tôi chưa tìm thấy thí nghiệm kiểu Milgram trên người Việt.
  loai: thoi-su
- trang: thi-nghiem/milgram
  id: n54
  cau: "Không có dữ liệu thì không đoán mò: đây là khoảng trống đáng có một nghiên cứu Việt Nam."
  loai: loi-khuyen
- trang: thi-nghiem/milgram
  id: n55
  cau: Nhiều người tham gia căng thẳng rõ rệt và trong phỏng vấn sau đó họ nhấn mạnh mình không phải kiểu người thích làm đau người khác.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n56
  cau: Vâng lời trong thí nghiệm không cho phép kết luận về tính cách ngoài đời.
  loai: loi-khuyen
- trang: thi-nghiem/milgram
  id: n57
  cau: "Học trò không bị giật điện thật: máy giật điện là giả và học trò là người cộng tác của Milgram."
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n58
  cau: Trong biến thể của Milgram chỉ có phụ nữ, 26 trên 40 người cũng đi đến nấc cuối, giống nhóm nam.
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n59
  cau: Thí nghiệm cho thấy sức mạnh của tình huống — và theo cách hiểu mới, sức mạnh của niềm tin vào một mục đích; hai bài học rất khác nhau.
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n60
  cau: "Câu hỏi 1: 26 trên 40 người đi đến nấc tối đa; tất cả 40 người đi đến 300V, nấc mà học trò đập vào tường và ngừng trả lời."
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n61
  cau: "Câu hỏi 2: Burger chỉ làm đến 150V vì 79% người đã vượt qua 150V trong Thí nghiệm 5 đều đi tiếp đến 450V; dừng ở đó đỡ gây căng thẳng cho người tham gia."
  loai: tai-lap
- trang: thi-nghiem/milgram
  id: n62
  cau: "Câu hỏi 3: tỉ lệ tiếp tục 70% so với 82,5% chênh lệch không có ý nghĩa thống kê; Burger không thấy khác biệt giữa nam và nữ."
  loai: tai-lap
- trang: thi-nghiem/milgram
  id: n63
  cau: "Câu hỏi 4: Haslam và Reicher cho rằng người ta vâng lời vì đồng nhất với sứ mệnh khoa học (engaged followership); cách hiểu này thay đổi bài học."
  loai: phat-hien
- trang: thi-nghiem/milgram
  id: n64
  cau: "Câu hỏi 5: khi Milgram chuyển thí nghiệm khỏi Đại học Yale sang một văn phòng ở Bridgeport, tỉ lệ vâng lời đến nấc cuối thấp hơn: 47,5%, so với 62,5% ở điều kiện tương ứng tại Yale; lời giải thích: vẻ chính danh có tác dụng, nhưng gần một nửa vẫn đi đến nấc cuối."
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n65
  cau: 'Hình "milgram-obedience": cột 65% (26/40, đi đến 450V) và 35% (14/40, dừng ở 300–375V); chữ "Cả 40 người đều đi đến 300V, nấc mà học trò đập vào tường và ngừng trả lời"; chú thích và aria-label cùng số.'
  loai: so-lieu
- trang: thi-nghiem/milgram
  id: n69
  cau: 'Vì sao chỉ "khá vững": con số tổng hợp lấy từ các biến thể của chính Milgram, mỗi biến thể vài chục người; vì lý do đạo đức, hai lần làm lại hiện đại đều dừng sớm hơn nhiều so với bản gốc; và tư liệu lưu trữ cho thấy những người không tin hẳn vào màn kịch lại giật ở mức cao hơn (Perry và cộng sự, 2019), nên mức vâng lời thật có thể thấp hơn.'
  loai: nhan
- trang: thi-nghiem/zimbardo
  id: h1
  cau: "Hộp hồ sơ: nghiên cứu gốc là Haney, Banks và Zimbardo, 1973."
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: h2
  cau: "Hộp hồ sơ: 24 nam sinh viên được chọn từ hơn 70 người đăng ký, bốc thăm vai cai tù hoặc tù nhân (21 người tham gia)."
  loai: so-lieu
- trang: thi-nghiem/zimbardo
  id: h3
  cau: "Hộp hồ sơ: nhà tù giả dựng ở tầng hầm của khoa Tâm lý, kế hoạch 2 tuần."
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: h4
  cau: "Hộp hồ sơ: dừng sau 6 ngày; cai tù quấy rối leo thang, một số tù nhân được cho ra sớm."
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n1
  cau: 'Thí nghiệm nhà tù Stanford năm 1971: tình nguyện viên là nam sinh viên, trả tiền theo ngày để tham gia một "nghiên cứu tâm lý về đời sống nhà tù".'
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n2
  cau: Quảng cáo trên báo trả 15 đô la mỗi ngày.
  loai: so-lieu
- trang: thi-nghiem/zimbardo
  id: n3
  cau: Có hơn 70 người đăng ký (75 theo báo cáo gốc).
  loai: so-lieu
- trang: thi-nghiem/zimbardo
  id: n4
  cau: 24 người được đánh giá ổn định nhất sau phỏng vấn và kiểm tra tâm lý được chọn và bốc thăm ngẫu nhiên vào vai cai tù hoặc tù nhân; cuối cùng 21 người tham gia (10 tù nhân, 11 cai tù).
  loai: so-lieu
- trang: thi-nghiem/zimbardo
  id: n5
  cau: Thí nghiệm dựng nhà tù giả ở tầng hầm tòa nhà tâm lý của Đại học Stanford.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n6
  cau: Tù nhân bị cảnh sát Palo Alto thật đến tận nhà bắt, còng tay, khám người, rồi mặc áo choàng và đánh số thay tên.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n7
  cau: Cai tù mặc đồng phục, đeo kính râm phản chiếu, cầm dùi cui.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n8
  cau: "Nhóm nghiên cứu nhấn mạnh một điều cấm với cai tù: không dùng bạo lực thân thể (còn lại, vai của cai tù khá ít chỉ dẫn trong báo cáo gốc)."
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n9
  cau: Thí nghiệm dự kiến kéo dài 2 tuần nhưng dừng sau 6 ngày.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n10
  cau: Thí nghiệm diễn ra vào tháng 8/1971.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n11
  cau: Một số cai tù chửi rủa, bắt tù nhân đếm số lúc nửa đêm và nhốt vào "cái hố", một tủ tối chật hẹp.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n12
  cau: 'Câu hỏi mở của trang: những gì xảy ra có chứng minh "tình huống biến người bình thường thành kẻ ác" hay không vẫn chưa có đáp án thống nhất; một cách hiểu là kết quả phần lớn đến từ cách thí nghiệm được dàn dựng và hướng dẫn cho người tham gia.'
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n13
  cau: Chỉ sau vài ngày, theo báo cáo gốc, cai tù hành xử hung hăng và tù nhân suy sụp, thụ động.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n14
  cau: Thí nghiệm Zimbardo là một trong những nghiên cứu nổi tiếng nhất, và cũng thuộc nhóm bị tranh cãi nhiều nhất, của tâm lý học.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n15
  cau: Gần nửa thế kỷ sau, hồ sơ lưu trữ được mở và người tham gia cũ được phỏng vấn lại.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n16
  cau: Zimbardo tự đóng vai quản giáo (Superintendent) của nhà tù giả.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n17
  cau: Sau 2 ngày, tù nhân nổi loạn; cai tù trả đũa bằng quấy rối leo thang.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n18
  cau: Cai tù nhận hướng dẫn chi tiết về cách đối xử với tù nhân trong buổi định hướng.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n19
  cau: "Một số tù nhân được cho ra sớm: báo cáo gốc ghi 5 người vì suy sụp cảm xúc nặng hoặc phát ban."
  loai: so-lieu
- trang: thi-nghiem/zimbardo
  id: n20
  cau: Theo Le Texier (2019), khoảng hai trong 10 tù nhân thật sự có triệu chứng suy sụp thần kinh; nói "một nửa suy sụp phải cho ra sớm" là cường điệu.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n21
  cau: Theo hồ sơ lưu trữ, một tù nhân (Korpi) đã tính trước việc tỏ ra suy sụp để được ra.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n22
  cau: Một tù nhân tuyệt thực.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n23
  cau: Nhà tâm lý học Christina Maslach đến thăm, sốc trước những gì chứng kiến, đối chất với Zimbardo, và ông dừng thí nghiệm vào ngày thứ 6.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n24
  cau: 'Kết luận của nhóm nghiên cứu: vai trò xã hội và bối cảnh nhà tù đã đẩy ít nhất một phần ba cai tù đến chỗ hung hăng, hạ nhục tù nhân hơn mức dự đoán, và đẩy nhiều tù nhân vào thụ động, phụ thuộc, trầm cảm; theo họ, đó là sức mạnh của "tình huống" hơn "tính cách".'
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n25
  cau: Thibault Le Texier là nhà xã hội học, lục lại kho lưu trữ của thí nghiệm và phỏng vấn 15 người từng tham gia.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n26
  cau: Cai tù hung hăng nhất, biệt danh "John Wayne" (David Eshleman), sau này thừa nhận mình đang diễn một nhân vật.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n28
  cau: Dữ liệu thí nghiệm được thu thập và trình bày có chọn lọc.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n29
  cau: Ý tưởng thí nghiệm vay mượn từ một "thí nghiệm nhà tù" do sinh viên trong lớp của Zimbardo làm thử vài tháng trước đó.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n30
  cau: "Kết luận của Le Texier: đây là một nghiên cứu có quá nhiều sai sót về phương pháp, đến mức giá trị khoa học của nó bị đặt nghi vấn."
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n31
  cau: Reicher và Haslam dựng một "nhà tù" tương tự cho chương trình truyền hình BBC, kéo dài 8 ngày với 15 nam tham gia.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n32
  cau: Nghiên cứu BBC có hội đồng đạo đức duyệt và hai nhà tâm lý học lâm sàng độc lập theo dõi suốt thời gian.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n33
  cau: Cai tù trong nghiên cứu BBC không được hướng dẫn cách hành xử; chỉ cấm bạo lực thể xác và nêu quyền cơ bản của tù nhân.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n34
  cau: Ở nghiên cứu BBC, cai tù không đồng nhất với vai trò, ngần ngại dùng quyền lực và cuối cùng bị tù nhân lấn át.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n35
  cau: Tù nhân BBC đoàn kết và lập một hệ thống bình đẳng; khi hệ thống này sụp đổ vì bất lực, một số người mới tính đến một chế độ độc đoán và gặp sự kháng cự ngày càng yếu.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n36
  cau: "Kết luận của Reicher và Haslam: bạo lực không phải hệ quả tự động của vai trò và tình huống; điều khiến sự tàn ác trở nên chấp nhận được là sự bất lực và thất bại của các nhóm."
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n37
  cau: "Nhãn Vững chắc: những sự kiện cơ bản của thí nghiệm là có thật."
  loai: nhan
- trang: thi-nghiem/zimbardo
  id: n38
  cau: Thí nghiệm có ghi chép và quay phim; không bên nào phủ nhận các sự kiện cốt lõi.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n39
  cau: Số tù nhân thật sự suy sụp được cho ra sớm còn tranh cãi.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n40
  cau: 'Nhãn Đang tranh cãi: kết luận gốc "tình huống biến người bình thường thành tàn ác".'
  loai: nhan
- trang: thi-nghiem/zimbardo
  id: n41
  cau: Zimbardo và các cộng sự, trong phản hồi năm 2020, vẫn bảo vệ sức mạnh của môi trường phi nhân tính.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n42
  cau: Le Texier, Reicher và Haslam cho rằng kết quả bị thổi phồng bởi hướng dẫn của người thí nghiệm, diễn xuất và dữ liệu chọn lọc, và khi làm lại với thiết kế khác thì bạo lực không tự động xuất hiện; Haslam, Reicher và Van Bavel (2019) cũng theo hướng này dựa trên hồ sơ lưu trữ.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n43
  cau: Phần lớn các phân tích gần đây dựa trên hồ sơ lưu trữ hoặc thiết kế lại đều hoài nghi kết luận gốc.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n44
  cau: 'Nhãn Khá vững: mẫu người tham gia không đại diện cho "người bình thường".'
  loai: nhan
- trang: thi-nghiem/zimbardo
  id: n45
  cau: Carnahan và McFarland (2007) đăng lại quảng cáo "nghiên cứu về đời sống nhà tù" và thấy người đăng ký ghi điểm cao hơn ở các thang đo hung hăng, độc đoán, Machiavelli, ái kỷ, xu hướng thống trị xã hội, và thấp hơn ở đồng cảm và vị tha, so với người đăng ký một nghiên cứu tâm lý bình thường.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n46
  cau: Chính các tác giả Carnahan và McFarland nói hệ quả của kết quả với thí nghiệm Stanford vẫn chỉ là phỏng đoán, và kết quả nghiêng về cách giải thích có cả người lẫn tình huống.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n47
  cau: 'Nhãn Đã bị bác bỏ: "Zimbardo bịa đặt toàn bộ, thí nghiệm chưa từng xảy ra".'
  loai: nhan
- trang: thi-nghiem/zimbardo
  id: n48
  cau: Phê bình khoa học nhắm vào phương pháp và cách diễn giải (dàn dựng, hướng dẫn của người thí nghiệm, trình bày chọn lọc), không phủ nhận sự kiện cốt lõi.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n49
  cau: "Sức mạnh của tình huống (Zimbardo): vai trò xã hội và bối cảnh thể chế có thể lấn át tính cách cá nhân; đây là cách diễn giải gốc."
  loai: dinh-nghia
- trang: thi-nghiem/zimbardo
  id: n50
  cau: 'Đặc tính nhu cầu (demand characteristics) và diễn xuất: người tham gia đoán được nhà nghiên cứu muốn gì (đặc biệt khi được hướng dẫn trực tiếp) và "diễn" cho tròn vai.'
  loai: dinh-nghia
- trang: thi-nghiem/zimbardo
  id: n51
  cau: 'Cai tù "John Wayne" là ví dụ: Eshleman nói mình diễn vì cho rằng làm vậy tốt hơn cho nghiên cứu (hung hăng vì nghĩ đó là điều được kỳ vọng).'
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n52
  cau: "Lãnh đạo bản sắc (Reicher và Haslam): vai trò tự nó chưa đủ gây tàn ác, trừ khi người lãnh đạo khiến người thực hiện đồng nhất với một mục tiêu cao cả của nhóm và tin hành động là cần thiết; theo Haslam, Reicher và Van Bavel (2019), hồ sơ SPE cho thấy nhóm thí nghiệm trực tiếp khuyến khích cai tù tỏ ra cứng rắn."
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n53
  cau: "Tự chọn lọc mẫu: hiệu ứng có thể một phần bắt nguồn từ việc những người hung hăng, độc đoán hơn đã tự tìm đến thí nghiệm."
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n54
  cau: Kết luận "hoàn cảnh xô đẩy" đang bị tranh cãi, nên chưa thể dùng nó để gỡ trách nhiệm cá nhân; ở Stanford ít nhất một số cai tù làm theo hướng dẫn và tự nhận đang diễn.
  loai: loi-khuyen
- trang: thi-nghiem/zimbardo
  id: n55
  cau: Theo kết luận gốc của Zimbardo (đang bị tranh cãi), đồng phục, chức danh và "luật bất thành văn" của nhóm có thể khiến người ta làm điều bình thường họ không làm; theo nhóm BBC, điều đáng để ý là nhóm đang đồng nhất với điều gì và người lãnh đạo khơi gợi điều gì.
  loai: loi-khuyen
- trang: thi-nghiem/zimbardo
  id: n56
  cau: Một câu chuyện hấp dẫn có thể sống trong sách giáo khoa hàng chục năm dù bằng chứng gốc có nhiều điểm yếu; khi gặp kết quả "gây sốc", hãy hỏi đã ai làm lại được chưa và mẫu có đại diện không.
  loai: loi-khuyen
- trang: thi-nghiem/zimbardo
  id: n57
  cau: Tính đến 10/2026, chưa tìm thấy nghiên cứu nào tương tự thí nghiệm Zimbardo trên người Việt.
  loai: thoi-su
- trang: thi-nghiem/zimbardo
  id: n58
  cau: Một thí nghiệm giam người, gây căng thẳng tâm lý như của Zimbardo ngày nay khó có thể được phê duyệt theo chuẩn mực đạo đức nghiên cứu hiện hành.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n59
  cau: Le Texier (2019) chỉ ra rằng phần lớn tác giả sách giáo khoa tâm lý học bỏ qua các phê bình về thí nghiệm Zimbardo và kể lại một phiên bản chưa qua kiểm chứng.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n60
  cau: 'Điều chắc chắn hơn kết luận "ai cũng có thể thành kẻ ác": trong một nhà tù giả được dàn dựng, một số người đã hành xử tàn nhẫn thật.'
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n61
  cau: Ngay trong báo cáo gốc, ít nhất một phần ba cai tù hung hăng hơn mức dự đoán; số còn lại gồm người "cứng nhưng công bằng" và một vài người thụ động.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: n62
  cau: Thí nghiệm gần như không thể làm lại nguyên văn ngày nay vì lý do đạo đức; vì vậy tranh luận dựa vào hồ sơ lưu trữ và thiết kế thay thế như BBC Prison Study.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: n63
  cau: "Phê bình Le Texier không có nghĩa Zimbardo nói dối toàn bộ: phê bình nhắm vào tính khoa học của thiết kế và cách diễn giải."
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: q1a
  cau: Thí nghiệm dự kiến 2 tuần, dừng sau 6 ngày vì cai tù hành xử tàn nhẫn và tù nhân suy sụp tinh thần.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: q1b
  cau: Thí nghiệm dự kiến 14 ngày nhưng dừng vào ngày thứ 6, sau khi Christina Maslach đến thăm và đối chất với Zimbardo.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: q2a
  cau: Le Texier chỉ ra cai tù đã nhận hướng dẫn chi tiết về cách đối xử với tù nhân, và cai tù hung hăng nhất ("John Wayne") thừa nhận mình đang diễn.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: q2b
  cau: Le Texier không phủ nhận các sự kiện đã xảy ra; ông chỉ ra sai sót về phương pháp (hướng dẫn cho cai tù, diễn xuất, dữ liệu thu thập chọn lọc) khiến giá trị khoa học bị đặt nghi vấn.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: q3a
  cau: "BBC Prison Study cho kết quả ngược: cai tù không đồng nhất với vai trò, ngần ngại dùng quyền lực; bạo lực không phải hệ quả tự động của vai trò và tình huống."
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: q3b
  cau: Điều khiến sự tàn ác trở nên "chấp nhận được" là sự bất lực của tập thể và vai trò của người lãnh đạo, không phải chiếc áo cai tù.
  loai: phat-hien
- trang: thi-nghiem/zimbardo
  id: q4b
  cau: Các sự kiện cơ bản là vững chắc; điều chưa ngã ngũ là ý nghĩa của chúng; phần lớn các phân tích gần đây hoài nghi kết luận gốc.
  loai: lich-su
- trang: thi-nghiem/zimbardo
  id: q5a
  cau: 'Bài học ứng dụng đúng đắn: đừng dùng "sức mạnh tình huống" để biện minh cho hành vi sai trái; khi gặp kết quả khoa học gây sốc, hãy hỏi đã ai làm lại được chưa và mẫu có đại diện không.'
  loai: loi-khuyen
- trang: thi-nghiem/zimbardo
  id: q5b
  cau: Câu chuyện hấp dẫn nhưng mong manh đã sống trong sách giáo khoa gần nửa thế kỷ.
  loai: lich-su
