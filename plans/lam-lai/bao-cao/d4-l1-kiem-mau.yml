  loai: phat-hien
  nguon:
    - ten: "OpenStax, Psychology 2e, mục 2.2 Approaches to Research: toàn văn trang"
      link: https://openstax.org/books/psychology-2e/pages/2-2-approaches-to-research
  ket_qua_luot_1: dung
