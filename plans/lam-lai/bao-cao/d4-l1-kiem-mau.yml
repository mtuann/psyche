  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: "AGENTS.md, mục Khóa và CI: bản thật chỉ gồm trang đã khóa (src/ban-build.mjs); chuan-kiem-dinh.md mục 3 (kiểm định lõi mọi nhận định). Review (Claude Sonnet 5.5, 30/10/2026): dung. Đúng với cách site làm: src/ban-build.mjs chỉ đưa trang có trong kiem-dinh/khoa.json vào bản thật (AGENTS.md, mục Khóa); lượt 1 kiểm mọi nhận định của bài (chuan-kiem-dinh.md mục 3). Bài tầng mở rộng chỉ kiểm lượt 2 theo mẫu, nhưng mọi bài trong mục này hiện là tầng loi (trang.yml)."
