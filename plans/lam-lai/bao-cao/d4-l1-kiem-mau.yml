- trang: bang-chung/khung-hoang-tai-lap
  id: s1
  cau: Liên kết "Hiệu ứng lớn hay nhỏ?" trỏ tới trang bang-chung/do-lon-hieu-ung.
  loai: ve-site
  nguon: []
  ket_qua_luot_1: dung
  ghi_chu: 'Đã kiểm: src/data/trang.yml có id bang-chung/do-lon-hieu-ung; trang có trong src/content/docs/bang-chung/. Review (Claude Opus 5.5, 30/10/2026): Đã kiểm: khung-hoang-tai-lap.md, mục Vì sao con số lại chênh lệch, link /psyche/bang-chung/do-lon-hieu-ung/ với chữ "Hiệu ứng lớn hay nhỏ?" đúng title của trang ấy; trang.yml có bản ghi bang-chung/do-lon-hieu-ung.'
- trang: bang-chung/khung-hoang-tai-lap
  id: k22
  cau: 'Bức tranh công bố bị lệch về một phía: thấy nhiều kết quả "thành công" hơn thực tế, và độ lớn hiệu ứng bị thổi phồng.'
  loai: phat-hien
  nguon:
    - ten: "Nosek và cộng sự (2022), Annu Rev Psychol 73, 719–748: toàn văn (Tilburg University Research Portal); số trang theo bản in"
      link: https://doi.org/10.1146/annurev-psych-020821-114157
  ket_qua_luot_1: da-lam-mem
  ghi_chu: 'Chữ cũ: "chỉ thấy thành công, không thấy thất bại". Chữ mới sát nguồn (hiệu ứng bị thổi phồng, dương tính giả tăng). Review (Claude Opus 5.5, 30/10/2026): Khớp Nosek 2022.'
- trang: bang-chung/p-value
  id: p21
  cau: Theo Utts, thiên lệch biên tập này dẫn tới "ngăn kéo hồ sơ" (nghiên cứu có kết quả có ý nghĩa thống kê dễ được đăng hơn nhiều) và tới p-hacking.
  loai: phat-hien
  nguon:
    - ten: 'American Statistical Association (7/3/2016), thông cáo "ASA releases statement on statistical significance and p-values": toàn văn thông cáo (sáu nguyên tắc, lời Wasserstein và Utts)'
      link: https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf
  ket_qua_luot_1: da-sua
  ghi_chu: "Chữ cũ: \"Hệ quả là cả một hệ thống khoa học bắt đầu 'săn' con số 0,05 — và đó là cửa ngõ của p-hacking.\" Lý do: ý này là lời của Utts (\"apparent editorial bias leads to ...\"), không phải khẳng định lịch sử về \"cả hệ thống\"; đổi thành lời dẫn của Utts. Review (Claude Opus 5.5, 30/10/2026): Khớp lời Utts."
- trang: bang-chung/index
  id: i4
