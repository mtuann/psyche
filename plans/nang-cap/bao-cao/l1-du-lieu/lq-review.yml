    nguon: bang-chung/do-lon-hieu-ung
    trang: kham-pha/phat-trien/tam-ly-hoc-duong
    ket_qua: sai
    ly_do: ly_do nói trang là "bài đọc độ lớn hiệu ứng gộp về giáo dục"; thật ra là bắt nạt và stress học đường, không có phân tích tổng hợp hay độ lớn hiệu ứng.
    thay: kham-pha/tri-nho/phong-cach-hoc (đã khóa; do-lon-hieu-ung đọc d = 0,04 của Hattie và O'Leary về phong cách học)
  - id: bang-chung/khung-hoang-tai-lap
    nguon: thi-nghiem/seligman
    trang: bang-chung/khung-hoang-tai-lap
    ket_qua: yeu
    ly_do: bản 2016 là đảo cơ chế thần kinh, không phải tái lập thất bại; trang khủng hoảng tái lập không nhắc Seligman. Chỉ chung từ khóa "xem lại".
    thay: bỏ
  - id: kham-pha/tam-ly-xa-hoi/thuyet-phuc
    nguon: thi-nghiem/milgram
    trang: kham-pha/tam-ly-xa-hoi/thuyet-phuc
    ket_qua: yeu
    ly_do: trang thuyết phục nói ELM và quảng cáo, không có chữ nào về quyền uy hay vâng lời; người đọc Milgram bấm sang sẽ lạc.
    thay: bỏ (đã còn zimbardo và dao-duc-nghien-cuu)
  - id: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
    nguon: kham-pha/tam-ly-xa-hoi/phu-hop-so-dong
    trang: kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc
    ket_qua: yeu
    ly_do: trang bất hòa nói niềm tin đổi theo hành vi cá nhân (1 đô-la / 20 đô-la), không nói nhóm hay đám đông; "nhóm mình" trong ly_do không có trong trang.
    thay: bỏ, hay kham-pha/tam-ly-xa-hoi/dinh-kien (cùng mảng nhóm; kiểm xem phu-hop-so-dong chưa link nhiều)
  - id: kham-pha/tri-tue/tri-tue-la-gi
    nguon: kham-pha/phat-trien/tre-hoc-the-nao
    trang: kham-pha/tri-tue/tri-tue-la-gi
    ket_qua: yeu
    ly_do: trang IQ không nhắc Piaget hay giai đoạn nhận thức; nối chỉ qua từ "trí tuệ".
    thay: kham-pha/phat-trien/tre-hoc-noi (cùng phát triển trẻ nhỏ) hay bỏ
  - id: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
    nguon: kham-pha/suc-khoe-tam-than/tram-cam
    trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
    ket_qua: yeu
    ly_do: bài ngủ nói củng cố trí nhớ, hầu như không nói tâm trạng hay trầm cảm; "giấc ngủ và tâm trạng liên quan" không có trong trang. Rủi ro hiểu nhầm (mất ngủ là dấu hiệu) ở bài sức khỏe tâm thần.
    thay: kham-pha/suc-khoe-tam-than/tim-giup-do (theo luật brief)
  - id: kham-pha/tu-duy/tu-duy-nhanh-cham
    nguon: kham-pha/chu-y-tri-giac/ao-giac-thi-giac
    trang: kham-pha/tu-duy/tu-duy-nhanh-cham
    ket_qua: yeu
    ly_do: không trang nào nhắc Hệ 1 hay ảo giác; ly_do là cầu nối do người đề xuất tự dựng, bài ảo giác không dùng khái niệm này.
    thay: bỏ (còn khi-dot-vo-hinh, mau-va-chon-mau)
  - id: kham-pha/tu-duy/tin-dieu-vo-ly
