    trang: kham-pha/tu-duy/tin-dieu-vo-ly
    ket_qua: yeu
    ly_do: Barnum nằm ở chính bài MBTI; trang tin điều vô lý nói lập luận có động cơ (Kunda), không nhắc Barnum nên ly_do gán sai cho trang đích.
    thay: bỏ
  - id: bang-chung/mau-va-chon-mau
    nguon: kham-pha/co-so-sinh-hoc/nao-che-doi
    trang: bang-chung/mau-va-chon-mau
    ket_qua: yeu
    ly_do: bài não chẻ đôi không nêu cỡ mẫu nhỏ làm chỗ yếu; trang chọn mẫu nói WEIRD và thiên lệch, không có ca bệnh nhân. Khái niệm bài không thật sự dùng.
    thay: bỏ
  - id: thi-nghiem/pygmalion
    nguon: kham-pha/tri-tue/tri-tue-la-gi
    trang: thi-nghiem/pygmalion
    ket_qua: yeu
    ly_do: bài IQ không nhắc kỳ vọng giáo viên hay Pygmalion; chỉ chung chữ "IQ" (Pygmalion chỉ dùng bài IQ làm thước đo).
    thay: kham-pha/tri-tue/hieu-ung-flynn (nếu đã khóa và bài nguồn chưa link) hay bỏ
  - id: bang-chung/khung-hoang-tai-lap
    nguon: kham-pha/tri-nho/bang-ghi-hinh
    trang: bang-chung/khung-hoang-tai-lap
    ket_qua: yeu
    ly_do: bài Loftus và Palmer chỉ nói mẫu nhỏ, chưa có kết quả tái lập (bài ghi chưa tìm thấy theo mốc 11/2026); ly_do "bài nói về kết quả tái lập" sai. Trang đích không nhắc Loftus.
    thay: bang-chung/co-mau-suc-manh (khớp mẫu nhỏ, kiểm đã khóa) hay bỏ
  - id: kham-pha/tam-ly-xa-hoi/dinh-kien
    nguon: kham-pha/phat-trien/tam-ly-hoc-duong
    trang: kham-pha/tam-ly-xa-hoi/dinh-kien
    ket_qua: yeu
    ly_do: bài bắt nạt không nói loại trừ người khác nhóm hay định kiến; ly_do không có trong trang.
    thay: bỏ
  - id: thi-nghiem/pygmalion
    nguon: kham-pha/tu-duy/thien-kien-xac-nhan
    trang: thi-nghiem/pygmalion
    ket_qua: yeu
    ly_do: bài thiên kiến xác nhận chỉ về nhiệm vụ Wason, không nhắc kỳ vọng tự ứng nghiệm; nối gián tiếp. Cặp thi-nghiem-doi-chung cùng bài cũng nối lỏng nhưng chấp nhận được.
    thay: bỏ
