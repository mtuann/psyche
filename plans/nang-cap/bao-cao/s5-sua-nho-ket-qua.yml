- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n30
  luot_2: khong-chac
  nguon:
    - https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1002/wps.21069&resultType=core&format=json
    - https://pubmed.ncbi.nlm.nih.gov/36640411/
  ghi_chu: "Tóm tắt Cuijpers 2023 (đọc qua Europe PMC) xác nhận g = 0,79 so với nhóm đối chứng, «moderate to large». Không xác nhận được g = 0,47 sau hiệu chỉnh sai lệch xuất bản: toàn văn (PMC, Wiley, kho VU) chặn truy cập tự động; tóm tắt còn nói hiệu quả «remained similar in sensitivity analyses», nên cần review đọc bảng toàn văn trước khi giữ cụm «khiêm tốn hơn con số thô». Cuijpers 2023 chỉ về trầm cảm: phần «và lo âu» trong ý chính cần nguồn riêng trong co_so. Câu «không phải ai cũng đáp ứng» hợp lý, không gần lời khuyên thuốc."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n53
  luot_2: dung
  nguon:
    - https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1002/wps.21069&resultType=core&format=json
    - https://www.nice.org.uk/guidance/ng222/chapter/Recommendations
  ghi_chu: "Tóm tắt: 409 thử nghiệm, «moderate to large effects compared to control conditions» (g = 0,79). NICE NG222 mục 1.9.1 (khi chưa đáp ứng thì «discuss with them» các nguyên nhân), 1.9.3 («other treatments can be tried»), 1.9.6 (chuyển liệu pháp tâm lý khác…). Câu chỉ nói người có chuyên môn bàn phương án, không khuyên thuốc cụ thể: đạt mục 5."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n69
  luot_2: dung
  nguon:
    - https://www.nice.org.uk/guidance/ng222/chapter/Recommendations
    - https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1002/wps.21069&resultType=core&format=json
  ghi_chu: "NICE 1.8.6: CBT nhóm hay MBCT phòng tái phát «with an explicit focus on the development of relapse prevention skills and what is needed to stay well» (khuyến nghị 1.8.5 nhắm người đã thuyên giảm có nguy cơ tái phát cao; câu viết chung hơn một chút nhưng không sai). Tóm tắt Cuijpers 2023: CBT hơn thuốc ở 6–12 tháng (g = 0,34) «although the number of trials was small, and the difference was not significant in all sensitivity analyses», khớp phần rào đón. Trang kèm câu không tự ý ngừng hay đổi thuốc ngay sau: tốt cho mục 5."
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n72
  luot_2: khong-chac
  nguon:
    - https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1002/wps.21069&resultType=core&format=json
  ghi_chu: "g = 0,79 và g = 0,06 (CBT so liệu pháp khác) khớp tóm tắt. g = 0,47 sau hiệu chỉnh sai lệch xuất bản không có trong tóm tắt và không mở được toàn văn (PMC, Wiley, kho VU chặn bot; các bài bình luận mở như Mental Elf, Carlat không nêu số này). Review cần đối chiếu bảng kết quả trong toàn văn."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n42
  luot_2: dung
  nguon:
    - https://www.nhs.uk/mental-health/conditions/depression-in-adults/symptoms/
    - https://www.nhs.uk/mental-health/conditions/depression-in-adults/overview/
  ghi_chu: "NHS: «See a GP if you experience symptoms of depression for most of the day, every day, for more than 2 weeks» và «It's important to seek help from a GP if you think you may be depressed… it's best not to delay», khớp mốc hai tuần và cụm «hay sớm hơn». Phần ảnh hưởng đến học tập, công việc… và «không cần đủ nặng» là lời khuyên thận trọng hơn, không trái nguồn. Không phải chẩn đoán; không nói về thuốc."
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n49
  luot_2: dung
  nguon:
    - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
  ghi_chu: "ICD-11 CDDR (WHO 2024), giai đoạn trầm cảm (tr. 231): «not better accounted for by bereavement», «not a manifestation of another medical condition… not due to the effects of a substance or medication», cần «significant impairment»; rối loạn trầm cảm đơn/tái diễn đòi không có tiền sử giai đoạn hưng cảm, hỗn hợp, hưng cảm nhẹ (loại trừ lưỡng cực). Phần «trò chuyện, hỏi tiền sử» là mô tả quy trình đánh giá chung, hợp lý. Câu chống tự chẩn đoán, đạt mục 5."
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n45
  luot_2: dung
  nguon:
    - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
  ghi_chu: "ICD-11 CDDR 6B01 (tr. 271–272): «Recurrent panic attacks», «followed by persistent concern or worry (e.g. for several weeks) about their recurrence…», «significant impairment»; «Panic attacks are common in the general population… a diagnosis is not warranted in such cases» và «the presence of panic attacks is not in itself sufficient». Câu lược bớt tiêu chí cơn bất ngờ và hành vi né tránh, chấp nhận được ở mức giới thiệu; không như chẩn đoán."
