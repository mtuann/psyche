# Lô sửa nhỏ sau S5 (20/11/2026): danh sách cho lượt 2 độc lập (chỉ trang, id, câu, loại)
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n30
  cau: "CBT hiệu quả với trầm cảm và lo âu ở mức vừa, nhưng khiêm tốn hơn con số thô: g = 0,79 còn 0,47 sau hiệu chỉnh; không phải ai được CBT cũng đáp ứng, nên một phần người bệnh cần thêm hay đổi hướng điều trị."
  loai: nhan
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n53
  cau: "Áp dụng 2: theo phân tích 409 thử nghiệm, CBT hiệu quả hơn nhóm đối chứng ở mức vừa đến lớn; trị liệu giúp được nhiều người, nhưng không phải ai cũng đỡ sau một liệu trình, và chưa đỡ không phải lỗi của người bệnh; hướng dẫn NICE ghi rằng khi trầm cảm chưa đáp ứng, người có chuyên môn bàn với người bệnh các phương án tiếp theo."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n69
  cau: "Hết liệu trình không có nghĩa khỏi hẳn: không phải ai được trị liệu cũng đáp ứng, nhiều người cần thêm phương án; người đã đỡ cũng có thể tái phát; NICE khuyên các liệu trình phòng tái phát (như CBT nhóm) tập trung rèn kỹ năng để giữ ổn định; với trầm cảm, có bằng chứng (từ ít thử nghiệm, không vững trong mọi phân tích độ nhạy) rằng hiệu quả của CBT ở 6–12 tháng sau điều trị tốt hơn thuốc."
  loai: phat-hien
- trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
  id: n72
  cau: "Câu hỏi 2: Cuijpers 2023: g = 0,79, còn 0,47 sau hiệu chỉnh; CBT chỉ hơn liệu pháp khác 0,06."
  loai: so-lieu
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n42
  cau: Nên cân nhắc tìm người có chuyên môn khi nỗi buồn hay trống rỗng kéo dài từ hai tuần trở lên mà không dịu (hay sớm hơn, nếu nghĩ mình có thể đang bị trầm cảm), ảnh hưởng rõ đến học tập, công việc, giấc ngủ, ăn uống, các mối quan hệ, hoặc khi thấy «không ổn» kéo dài; không cần «đủ nặng».
  loai: loi-khuyen
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n49
  cau: "Câu hỏi 2: các mô tả về trầm cảm trong bài không dùng để tự chẩn đoán vì chẩn đoán cần trò chuyện, hỏi tiền sử, loại trừ nguyên nhân khác (bệnh cơ thể, thuốc, chất, lưỡng cực, tang chế) và đánh giá suy giảm."
  loai: lam-sang
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n45
  cau: "Câu hỏi 3: theo ICD-11, ở rối loạn hoảng sợ các cơn lặp lại và nỗi lo rằng cơn sẽ trở lại khiến người ấy lo sợ kéo dài, và cản trở rõ cuộc sống; cơn hoảng sợ đơn lẻ thì thường gặp và tự nó chưa phải là rối loạn."
  loai: lam-sang
