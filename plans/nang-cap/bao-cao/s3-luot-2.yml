# Lượt 2 nhẹ về hình, lô S3 (Claude Sonnet 5.5), commit d57fdee
- hinh: lo-trinh-hoc-noi
  ket_qua: can-sua
  cau_hoi:
    1: "Dung: trục tháng, các thanh/chấm đều là mốc tuổi (tháng). Vị trí khớp chữ trang (2, 6–8, 6–12, 12 tháng)."
    2: "Không có cột số liệu; thanh là khoảng tháng, bắt đầu từ trục 0 nên không áp dụng. Dung."
    3: "Chưa đủ: '~2' và '~12 tháng' (trang viết ~/khoảng) vẽ chấm đặc như mốc chắc; luật 10 đòi chấm rỗng. Thanh 16–24 đặc."
    4: "Không áp dụng (không có k, n hay khoảng tin cậy)."
    5: "Gần khớp. Thanh 16–24 tháng 'ghép từ, vốn từ tăng nhanh' khác chữ trang (~18 tháng ghép từ; 16–24 chỉ có ở hồ sơ, từ OpenStax). Nhãn 'hẹp dần' 6–12 tháng khớp."
    6: "Không gợi nhân quả. Thanh chồng theo thời gian, thứ tự đúng niên đại."
    7: "Chú thích nói mốc là gần đúng, khác nhau giữa trẻ: đủ. Không mạnh hơn chữ trừ chi tiết 16–24."
  de_xuat:
    dau_xap_xi: "Ở 360 px dấu '~' trông như '-2 tháng': dễ đọc nhầm số âm, nên bỏ '~' và viết 'khoảng 2 tháng', 'khoảng 12 tháng' (nhãn ngắn, vẫn vừa khung). Đồng thời vẽ hai chấm này rỗng (viền, nền trống), theo luật 10."
    thanh_6_12: "Nét đứt hồng cho 6–12 tháng hợp lý: đây là khoảng suy giảm dần chứ không phải mốc; nét đứt đã phân biệt bằng hình dạng, không chỉ màu. Giữ."
    thanh_16_24: "Đổi nhãn thành 'khoảng 18 tháng: bắt đầu ghép từ' (chấm rỗng) cho khớp trang, hoặc thêm ý 16–24 tháng vào chữ trang và hồ sơ."
- hinh: piaget-timeline
  ket_qua: dung
  cau_hoi:
    1: "Trục tuổi (năm) cho bốn giai đoạn; ba phát hiện đặt bằng chấm, không cùng đại lượng với cột giai đoạn nhưng đây là dòng thời gian, không có so sánh số. Chấp nhận."
    2: "Không có cột số. Dung."
    3: "Mốc tuổi Piaget 'gần đúng' (chú thích nói); hộp vẽ liền, hơi ngược luật 10 nhưng chú thích đã ghi. Chấp nhận được."
    4: "Không áp dụng; không có số liệu mẫu trong hình."
    5: "Khớp trang: 2/7/11 tuổi; 4–6 tuổi (McGarrigle); 5 tháng (Wynn); 4,5 và 3,5 tháng nhanh chán (Baillargeon)."
    6: "Thứ tự dòng mới (4–6 tuổi, 5 tháng, 4,5 tháng) là xếp theo độ dài đường dẫn, không theo tuổi: không gợi xu hướng hay nhân quả, vì mỗi dòng nối bằng đường tới chấm riêng. Chỉ hơi lạ khi 5 tháng đứng trước 4,5 tháng; chấp nhận được."
    7: "Chú thích ghi Wynn chưa lặp lại nhất quán và cách diễn giải còn bàn cãi; nhãn Wynn có 'một lần lặp lại không thấy'. Đủ."
  de_xuat: "Tùy chọn: dòng ghi chú ngắn 'chấm các phát hiện sớm không theo tỉ lệ trục' (vị trí chấm trong khoảng 0–2 tuổi không theo tỉ lệ tháng)."
- hinh: festinger-diverging
  ket_qua: can-sua
  cau_hoi:
    1: "Dung: một đại lượng, điểm trung bình thang −5…+5, một thí nghiệm, ba nhóm."
    2: "Thanh từ 0 (đường 0 giữa), có thang phân kỳ. Độ dài khớp số (1,35 x 31,2 = 42,1). Dung."
    3: "Không có số xấp xỉ. Dung."
    4: "Thiếu: hình và chú thích không ghi n = 20 mỗi nhóm và 'không có khoảng tin cậy' (luật 10)."
    5: "Số khớp bảng trang. Nhãn 'Đối chứng' thiếu '(không nói dối)' như trang; p < 0,02 so với nhóm đối chứng chỉ có ở hồ sơ, chữ trang chỉ nêu p < 0,03."
    6: "Xếp 1 đô-la, 20 đô-la, đối chứng (khác thứ tự bảng trang, giảm dần theo giá trị). Cùng thí nghiệm nên chấp nhận, nhưng nên xếp theo thiết kế như bảng: đối chứng, 20, 1."
    7: "Giới hạn chưa có trong hình: mẫu nhỏ 20/nhóm, cơ chế còn tranh luận (tự tri giác của Bem, tái lập 2024)."
  de_xuat:
    - "Đổi nhãn: 'Đối chứng (không nói dối)'."
    - "Chú thích thêm: 'n = 20 mỗi nhóm; không có khoảng tin cậy; cơ chế còn tranh luận' (hay link tới mục tranh luận)."
    - "Xếp thứ tự theo thiết kế (đối chứng, 20, 1) hoặc theo bảng trang."
    - "Thêm p < 0,02 vào chữ trang/hồ sơ nếu giữ trong chú thích."
