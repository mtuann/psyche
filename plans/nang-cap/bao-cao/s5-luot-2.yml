# Danh sách cho lượt 2 của S5 (kế hoạch nâng cấp, 20/11/2026): mọi nhận định bị chạm hay mới ở ba trang Sức khỏe tâm thần,
# cộng ba nhận định cùng đoạn (chữ không đổi). Lượt 2 (Opus, độc lập) kiểm từng câu với nguồn; cũng xem câu có còn gần chẩn đoán
# hay gần lời khuyên dùng, ngừng thuốc không (chuan-kiem-dinh.md mục 5). Kết quả ghi theo khuôn của node tools/khoa.mjs nhap
# ({ trang, id, luot_2: dung|sai|qua-manh|khong-chac, nguon: [link], cau_dung?, ghi_chu? }).
# Nhận định đã bỏ khỏi trang (không cần lượt 2, chỉ để biết): tram-cam n15, n16 (da-bo).
# Trang: npm run build:xem rồi xem dist/kham-pha/suc-khoe-tam-than/<trang>/index.html, hay đọc src/content/docs/.
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n14
  cau: "Chẩn đoán không phải việc tự đối chiếu mình với một danh sách: chỉ người có chuyên môn mới chẩn đoán được (kèm link Hỗ trợ, ở đầu mục «Chuyên gia phân biệt bằng cách nào?»)."
  loai: loi-khuyen
  nguon:
    - apa-dep
    - apa-anx
  trich: A diagnosis is made by a qualified health professional.
  vi_tri: APA What are anxiety disorders, Treatment
  vi_sao: đã sửa chữ (S5)
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n17
  cau: "Người có chuyên môn xem xét cả bức tranh: các thay đổi kéo dài bao lâu, có mặt gần như mỗi ngày hay không, và ảnh hưởng đến học tập, công việc, gia đình hay các mối quan hệ tới mức nào."
  loai: lam-sang
  nguon:
    - icd11-cddr
  trich: The concurrent presence of at least five of the following characteristic symptoms occurring for most of the day, nearly every day, during a period lasting at least 2 weeks is required for diagnosis. At least one symptom from the affective cluster must be present. … The mood disturbance results in significant impairment in personal, family, social, educational, occupational or other important areas of functioning. If functioning is maintained, it is only through significant additional effort.
  vi_tri: CDDR tr. 212–213
  vi_sao: đã sửa chữ (S5)
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n18
  cau: Người có chuyên môn cũng phải loại trừ các khả năng khác, như một bệnh cơ thể (ví dụ rối loạn nội tiết, bệnh thần kinh), tác dụng của thuốc, rượu hay chất kích thích, phản ứng tang chế bình thường, hay rối loạn lưỡng cực (khi người ấy từng có giai đoạn hưng cảm).
  loai: lam-sang
  nguon:
    - icd11-cddr
    - apa-dep
  trich: The symptoms are not better accounted for by bereavement. The symptoms are not a manifestation of another medical condition (e.g. a brain tumour), and are not due to the effects of a substance or medication … There is no history of manic, mixed or hypomanic episodes, which would indicate the presence of a bipolar disorder. [ICD-11]; screen for underlying medical conditions that may mimic depression — such as hormonal imbalances, vitamin deficiencies, neurological problems and drug or alcohol use [APA]
  vi_tri: CDDR tr. 213, 244; APA, How Is Depression Treated?
  vi_sao: đã sửa chữ (S5)
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n19
  cau: "Chẩn đoán do người có chuyên môn thực hiện: trò chuyện kỹ, hỏi tiền sử, khám cơ thể và khi cần làm xét nghiệm để loại trừ bệnh khác."
  loai: lam-sang
  nguon:
    - apa-dep
  trich: To diagnose depression, a healthcare professional will conduct a thorough diagnostic evaluation that includes a comprehensive interview to discuss your symptoms in addition to your personal, medical and family histories. Moreover, a physical examination should be performed … Laboratory and imaging tests may also be included in the evaluation as part of the medical screening.
  vi_tri: APA, How Is Depression Treated?
  vi_sao: cùng đoạn với câu đã sửa; chữ không đổi, lượt 2 cũ còn trong hồ sơ
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n20
  cau: Hai người cùng «buồn» có thể ở hai tình trạng rất khác nhau, và một người không có đủ các dấu hiệu mà các hệ thống chẩn đoán mô tả vẫn có thể cần được giúp đỡ.
  loai: loi-khuyen
  nguon:
    - nhs-tt
    - icd11-cddr
  trich: You do not need to have a diagnosed mental health condition. [NHS, về việc dùng dịch vụ trị liệu tâm lý]
  vi_tri: NHS talking therapies, How to get talking therapies
  vi_sao: đã sửa chữ (S5)
- trang: kham-pha/suc-khoe-tam-than/tram-cam
  id: n54
  cau: "Không cần tự xác định mình đã «đủ» hay chưa: khi tâm trạng nặng nề kéo dài và bắt đầu ảnh hưởng đến cuộc sống thì nên gặp người có chuyên môn; có ý nghĩ về cái chết hay tự làm hại bản thân thì tìm giúp đỡ ngay (kèm link bài Khi nào nên tìm sự giúp đỡ chuyên môn? và trang Hỗ trợ)."
  loai: loi-khuyen
  nguon:
    - who-dep-2026
    - nhs-tt
  trich: Seek care if you have symptoms of depression. … If you think you are in immediate danger of harming yourself, contact any available emergency services or a crisis line. [WHO]; You do not need to have a diagnosed mental health condition. [NHS]
  vi_tri: WHO, Self-care; NHS talking therapies, How to get talking therapies
  vi_sao: mới (S5)
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n12
  cau: "Rối loạn lo âu lan tỏa: lo lắng quá mức về nhiều chuyện khác nhau của đời sống hằng ngày (công việc, tiền bạc, sức khỏe, gia đình…), hoặc cảm giác bất an không gắn với chuyện gì cụ thể."
  loai: lam-sang
  nguon:
    - icd11-cddr
    - apa-anx
  trich: 'Marked symptoms of anxiety are required for diagnosis, manifested in either: general apprehensiveness that is not restricted to any particular environmental circumstance (i.e. "free-floating anxiety"); or excessive worry (apprehensive expectation) about negative events occurring in several different aspects of everyday life (e.g. work, finances, health, family). … muscle tension or motor restlessness; sympathetic autonomic overactivity as evidenced by frequent gastrointestinal symptoms such as nausea and/or abdominal distress, heart palpitations, sweating …; subjective experience of nervousness, restlessness or being "on edge"; difficulty concentrating; irritability; sleep disturbances … The symptoms are not transient and persist for at least several months, for more days than not.'
  vi_tri: CDDR tr. 266
  vi_sao: đã sửa chữ (S5)
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n13
  cau: "Rối loạn hoảng sợ: nỗi sợ xoay quanh chính các cơn hoảng sợ lặp lại, những đợt sợ hãi dữ dội ập đến nhanh, và nỗi lo rằng cơn sẽ trở lại."
  loai: lam-sang
  nguon:
    - icd11-cddr
    - apa-anx
  trich: Recurrent panic attacks, which are discrete episodes of intense fear or apprehension characterized by the rapid and concurrent onset of several characteristic symptoms … palpitations or increased heart rate … sensations of shortness of breath … chest pain … feelings of dizziness … fear of losing control or going mad; fear of imminent death. At least some of the panic attacks are unexpected … seem to arise "out of the blue". Panic attacks are followed by persistent concern or worry (e.g. for several weeks) about their recurrence or their perceived negative significance (e.g. that the physiological symptoms may be those of a myocardial infarction), or by behaviours intended to avoid their recurrence (e.g. only leaving the home with a trusted companion).
  vi_tri: CDDR tr. 271
  vi_sao: đã sửa chữ (S5)
- trang: kham-pha/suc-khoe-tam-than/lo-au
  id: n14
  cau: "Rối loạn lo âu xã hội (còn gọi ám ảnh sợ xã hội): nỗi sợ rõ rệt và quá mức trong các tình huống xã hội, vì sợ mình bị người khác đánh giá tiêu cực, chê cười hay từ chối."
  loai: lam-sang
  nguon:
    - icd11-cddr
    - apa-anx
  trich: Marked and excessive fear or anxiety that occurs consistently in one or more social situations such as social interactions (e.g. having a conversation), doing something while feeling observed (e.g. eating or drinking in the presence of others) or performing in front of others (e.g. giving a speech) … The individual is concerned that they will act in a way, or show anxiety symptoms, that will be negatively evaluated by others (i.e. be humiliating, be embarrassing, lead to rejection or be offensive). Relevant social situations are consistently avoided or endured with intense fear or anxiety. The symptoms are not transient – that is, they persist for an extended period of time (e.g. at least several months). [ICD-11]; The fear or anxiety causes problems with daily functioning and lasts at least six months. [APA, Social Anxiety Disorder]
  vi_tri: CDDR tr. 284; APA
  vi_sao: đã sửa chữ (S5)
