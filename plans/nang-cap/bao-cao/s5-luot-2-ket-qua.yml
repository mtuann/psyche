# NC0, lô S5: lượt 2 độc lập cho ba trang Sức khỏe tâm thần
# Người làm: Claude Opus 5.5 (agent lượt 2), ngày 20/11/2026.
# Chỉ đọc trường trang, id, cau, loai của s5-luot-2.yml; không đọc nguồn, trích dẫn, vị trí hay lý do của lượt 1, không đọc hồ sơ kiem-dinh/, không đọc s5.md, không xem diff.
# Nguồn tự mở:
#   CDDR ICD-11 (WHO 2024), bản PDF trên IRIS, đọc chữ thật (trích bằng Ghostscript txtwrite): giai đoạn trầm cảm tr. 212–216, 6A70 tr. 244, 6B00 tr. 266–267, 6B01 tr. 271–272, 6B04 tr. 284–285, phần mở đầu (clinical judgement).
#   NICE NG222, trang Recommendations (đọc qua curl).
#   Cuijpers và cộng sự 2023: chỉ đọc được tóm tắt (NCBI E-utilities, PMC9840507); toàn văn bị chặn ở mọi nơi đã thử (PMC, Europe PMC, Wiley, kho VU).
#   Karyotaki và cộng sự 2021: tóm tắt qua Europe PMC (PMC8027916).
#   APA, What is depression?; NHS, Depression in adults.

ket_qua:
  - trang: kham-pha/suc-khoe-tam-than/tram-cam
    id: n14
    luot_2: dung
    nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
      - https://www.psychiatry.org/patients-families/depression/what-is-depression
    ghi_chu: "«CDDR, phần mở đầu: The CDDR are written to allow for the exercise of clinical judgement, and it is the diagnosing health professional who is responsible for developing a diagnostic formulation. APA: a healthcare professional will conduct a thorough diagnostic evaluation. An toàn: câu đúng tinh thần chuẩn mục 5, có link Hỗ trợ ngay đó.»"

  - trang: kham-pha/suc-khoe-tam-than/tram-cam
    id: n17
    luot_2: dung
    nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
    ghi_chu: "«CDDR, giai đoạn trầm cảm (tr. 212–213): most of the day, nearly every day, during a period lasting at least 2 weeks; significant impairment in personal, family, social, educational, occupational… functioning. Câu không nêu ngưỡng đếm triệu chứng: tốt.»"

  - trang: kham-pha/suc-khoe-tam-than/tram-cam
    id: n18
    luot_2: dung
    nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
      - https://www.psychiatry.org/patients-families/depression/what-is-depression
    ghi_chu: "«CDDR tr. 213–214: not better accounted for by bereavement; not a manifestation of another medical condition (e.g. a brain tumour), not due to a substance or medication…, including withdrawal; 6A70 (tr. 244): no history of manic, mixed or hypomanic episodes, which would indicate… bipolar disorder. Ví dụ rối loạn nội tiết, bệnh thần kinh khớp APA (hormonal imbalances, neurological problems, drug or alcohol use). Phần tang chế: ICD-11 nói triệu chứng trầm cảm trong tang chế bình thường thì không tính, nhưng giai đoạn trầm cảm vẫn có thể chồng lên tang chế; câu «loại trừ phản ứng tang chế bình thường» đúng.»"

  - trang: kham-pha/suc-khoe-tam-than/tram-cam
    id: n19
    luot_2: dung
    nguon:
      - https://www.psychiatry.org/patients-families/depression/what-is-depression
    ghi_chu: "«APA: comprehensive interview… personal, medical and family histories. Moreover, a physical examination should be performed to screen for underlying medical conditions… Laboratory and imaging tests may also be included.»"

  - trang: kham-pha/suc-khoe-tam-than/tram-cam
    id: n20
    luot_2: dung
    nguon:
      - https://www.nice.org.uk/guidance/ng222/chapter/Recommendations
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
    ghi_chu: "«NICE NG222: Less severe depression encompasses subthreshold and mild depression, và có các lựa chọn điều trị cho nhóm này (bảng 1), nên người chưa đủ tiêu chí vẫn có thể được giúp. CDDR: một mức buồn bã là phản ứng bình thường, phân biệt bằng severity, range and duration, nên hai người cùng buồn có thể khác nhau.»"

  - trang: kham-pha/suc-khoe-tam-than/tram-cam
    id: n54
    luot_2: dung
    nguon:
      - https://www.nhs.uk/mental-health/conditions/depression-in-adults/overview/
      - https://www.nice.org.uk/guidance/ng222/chapter/Recommendations
    ghi_chu: "«NHS: It's important to seek help… if you think you may be depressed… it's best not to delay. Lời khuyên tìm giúp đỡ ngay khi có ý nghĩ tự hại là chuẩn chung của các hướng dẫn. An toàn: câu tránh được việc tự chấm ngưỡng («không cần tự xác định mình đã đủ hay chưa»): tốt.»"

  - trang: kham-pha/suc-khoe-tam-than/lo-au
    id: n12
    luot_2: dung
    nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
    ghi_chu: "«CDDR 6B00: general apprehensiveness that is not restricted to any particular environmental circumstance (free-floating anxiety); or excessive worry… about negative events occurring in several different aspects of everyday life (e.g. work, finances, health, family). Khớp sát. Câu là mô tả, không có danh sách triệu chứng đi kèm hay ngưỡng thời gian: tốt.»"

  - trang: kham-pha/suc-khoe-tam-than/lo-au
    id: n13
    luot_2: dung
    nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
    ghi_chu: "«CDDR 6B01: Recurrent panic attacks, which are discrete episodes of intense fear or apprehension characterized by the rapid and concurrent onset…; followed by persistent concern or worry… about their recurrence. Câu lược bỏ điều kiện có ít nhất một số cơn bất ngờ và vế hành vi tránh né thay cho nỗi lo; với mô tả chung để hiểu thì chấp nhận được.»"

  - trang: kham-pha/suc-khoe-tam-than/lo-au
    id: n14
    luot_2: dung
    nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
    ghi_chu: "«CDDR 6B04: Marked and excessive fear or anxiety that occurs consistently in one or more social situations; concerned that they will act in a way, or show anxiety symptoms, that will be negatively evaluated by others (i.e. be humiliating, be embarrassing, lead to rejection…). Chê cười tương ứng humiliating/embarrassing. Tên «ám ảnh sợ xã hội» (social phobia) là tên cũ, dùng được.»"

  - trang: kham-pha/suc-khoe-tam-than/lo-au
    id: n15
    luot_2: dung
    nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
    ghi_chu: "«Như tram-cam n14 (CDDR: chẩn đoán dựa vào clinical judgement của người chẩn đoán có chuyên môn; CDDR cũng tránh ngưỡng thời gian, số triệu chứng quá chính xác). An toàn: lời nhắc đặt ngay trước danh sách, có link Hỗ trợ: đạt chuẩn mục 5.»"

  - trang: kham-pha/suc-khoe-tam-than/lo-au
    id: n45
    luot_2: dung
    nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
    ghi_chu: "«CDDR 6B01, Boundary with normality: Panic attacks are common in the general population…; Panic disorder is differentiated from normal fear reactions by frequent recurrence of panic attacks, persistent worry or concern about the panic attacks…, or alterations in behaviour (e.g. avoidance) and associated significant impairment; Note: the presence of panic attacks is not in itself sufficient. Lệch nhỏ: với 6B01, ICD-11 chỉ đòi suy giảm chức năng (significant impairment), không có vế «khổ sở» như 6B00, 6B04; «gây khổ sở hay cản trở» rộng hơn ICD một chút. Không đổi kết luận; nếu muốn sát thì viết «gây cản trở rõ cuộc sống».»"

  - trang: kham-pha/suc-khoe-tam-than/lo-au
    id: n49
    luot_2: dung
    nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
    ghi_chu: "«CDDR 6B00, 6B01, 6B04 đều có điều kiện về thời gian kéo dài (6B00: at least several months; 6B04: e.g. at least several months; 6B01: persistent concern e.g. for several weeks) và về khổ sở hay suy giảm chức năng. Câu không nêu ngưỡng số: tốt.»"

  - trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
    id: n24
    luot_2: dung
    nguon:
      - https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=9840507&rettype=xml
      - https://pubmed.ncbi.nlm.nih.gov/36640411/
    ghi_chu: "«Tóm tắt Cuijpers 2023: CBT… more effective than other psychotherapies, but the difference was small (g=0.06; 95% CI: 0‐0.12) and became non‐significant in most sensitivity analyses; did not differ significantly from those of pharmacotherapies at the short term, but were significantly larger at 6‐12 month follow‐up (g=0.34; 95% CI: 0.09‐0.58), although the number of trials was small, and the difference was not significant in all sensitivity analyses; Combined treatment was more effective than pharmacotherapies alone… but it was not more effective than CBT alone at either time point. Khớp từng vế. An toàn: n77 đặt ngay sau đoạn này, giảm nguy cơ đọc thành gợi ý bỏ thuốc.»"

  - trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
    id: n53
    luot_2: khong-chac
    nguon:
      - https://www.nice.org.uk/guidance/ng222/chapter/Recommendations
      - https://www.madinamerica.com/2023/01/therapy-beats-drugs-depression-long-term-outcomes/
      - https://www.nationalelfservice.net/treatment/cbt/cognitive-behavioural-therapy-depression/
    ghi_chu: "«Phần NICE đúng: 1.9.3 Reassure the person that although treatment has not worked, other treatments can be tried; 1.9.4 khi liệu pháp tâm lý đơn độc chưa đáp ứng: discuss further treatment options… Options include: switching to an alternative psychological treatment, adding an SSRI…, switching to an SSRI alone. Con số 42% so với 19% không có trong tóm tắt Cuijpers 2023; toàn văn bị chặn ở PMC, Europe PMC, Wiley, kho VU. Chỉ đối chiếu được qua tường thuật bậc 3 (Mad in America: about 42% of people responded to CBT, compared with 19% in control conditions; Mental Elf: less than half… classified as responders), cùng chiều với trang nhưng không đủ làm nguồn duy nhất (chuẩn mục 2). Review cần mở toàn văn (mục Results, tỉ lệ đáp ứng). An toàn: câu «chưa đỡ không phải lỗi của người bệnh» và việc dẫn NICE ở dạng «người có chuyên môn bàn với người bệnh» không thành lời khuyên điều trị cá nhân; NICE còn nêu phương án thêm hay chuyển sang SSRI, trang chỉ nói «kết hợp các hướng điều trị», chấp nhận được.»"

  - trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
    id: n54
    luot_2: dung
    nguon:
      - https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=9840507&rettype=xml
      - https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1001/jamapsychiatry.2020.4364&format=json&resultType=core
    ghi_chu: "«Cuijpers 2023: CBT was also effective as unguided self‐help intervention (g=0.45; 95% CI: 0.31‐0.60). Karyotaki 2021: Of 42 eligible RCTs, 39 studies… contributed IPD; Guided iCBT was associated with more effectiveness than unguided iCBT (… posttreatment PHQ-9…), but we found no evidence of a difference at 6 or 12 months; benefits were more substantial in individuals with moderate to severe depression. Khớp. Câu cuối (chương trình dựa trên phương pháp đã kiểm chứng) là giới hạn hợp lý. An toàn: không gợi ý thay điều trị bằng tự giúp; ổn.»"

  - trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
    id: n69
    luot_2: khong-chac
    nguon:
      - https://www.nice.org.uk/guidance/ng222/chapter/Recommendations
      - https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=9840507&rettype=xml
    ghi_chu: "«Các vế khác đúng: NICE 1.8.2 (nguy cơ tái phát), 1.8.6 For people starting group CBT or MBCT for relapse prevention, offer a course of therapy with an explicit focus on the development of relapse prevention skills and what is needed to stay well; tóm tắt Cuijpers (g=0,34 ở 6–12 tháng, ít thử nghiệm, không vững trong mọi phân tích độ nhạy). Chỉ ghi khong-chac vì vế 42% đáp ứng chưa kiểm được ở nguồn bậc 1–2 (xem n53); kiểm được thì đổi thành dung. Ghi thêm: theo Cuijpers, mốc là 6–12 tháng follow-up (tính từ lúc thử nghiệm), trang viết «6–12 tháng sau điều trị», lệch nhỏ. NICE khuyên CBT nhóm phòng tái phát cho người có nguy cơ tái phát cao hơn, không phải cho mọi người. An toàn: n78 theo ngay sau.»"

  - trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
    id: n77
    luot_2: dung
    nguon:
      - https://www.nice.org.uk/guidance/ng222/chapter/Recommendations
    ghi_chu: "«NICE 1.4.12: Advise people taking antidepressant medication to talk with the person who prescribed their medication… if they want to stop taking it…; 1.4.13 stopping abruptly… may have withdrawal symptoms. An toàn: đây là lời nhắc theo hướng an toàn (bàn với bác sĩ), không khuyên dùng hay ngừng thuốc: đạt chuẩn mục 5.»"

  - trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
    id: n78
    luot_2: dung
    nguon:
      - https://www.nice.org.uk/guidance/ng222/chapter/Recommendations
    ghi_chu: "«Như n77 (NICE 1.4.12–1.4.13). Lặp lại n77 trong cùng trang, nhưng đặt ngay sau câu CBT tốt hơn thuốc ở 6–12 tháng nên có lý do giữ.»"

ngoai_danh_sach:
  - trang: kham-pha/suc-khoe-tam-than/lo-au
    cho: "«Ngộ nhận liên quan», ngộ nhận 3 («Lo quá thì tự uống thuốc an thần…»), và gạch đầu dòng benzodiazepine ở «Các hướng điều trị có bằng chứng»"
    ghi_chu: "«Gần lời khuyên về thuốc theo chiều ngược: người đang được kê benzodiazepine có thể đọc «Không nên… nguy cơ lệ thuộc cao» thành gợi ý tự ngừng. Ngừng benzodiazepine đột ngột sau thời gian dùng có thể gây triệu chứng cai nặng, nên đề xuất thêm một câu như ở trang trầm cảm: «Người đang được kê thuốc này đừng tự ngừng đột ngột; mọi thay đổi hãy bàn với bác sĩ kê đơn.» Cần một nguồn bậc 2 cho câu ấy (ví dụ NICE CG113 hay tờ thông tin của NHS về benzodiazepine) khi sửa.»"
  - trang: kham-pha/suc-khoe-tam-than/tram-cam
    cho: "«Điều gì đang xảy ra» (gần như cả ngày, gần như mỗi ngày, trong ít nhất hai tuần) và đáp án đúng của câu hỏi 1 trong «Thử suy ngẫm»"
    ghi_chu: "«Ngưỡng thời gian hai tuần lặp ở ba chỗ (thân bài, câu hỏi 1, «Khi nào nên tìm sự giúp đỡ»). Không có ngưỡng đếm triệu chứng nên chưa thành bảng tự chấm, và câu nào cũng kèm «chỉ người có chuyên môn mới đánh giá được». Chỗ cần để ý: «kéo dài từ hai tuần trở lên mà không dịu» ở mục tìm giúp đỡ có thể bị hiểu là chưa tới hai tuần thì chưa cần đi khám; câu kế tiếp («không cần phải đủ nặng») đã gỡ phần lớn. Có thể thêm «hay sớm hơn nếu thấy quá sức» cho chắc.»"
  - trang: kham-pha/suc-khoe-tam-than/tram-cam
    cho: "«Các hướng điều trị có bằng chứng», gạch đầu dòng Thuốc chống trầm cảm và Kết hợp"
    ghi_chu: "«Viết ở dạng «WHO/NICE ghi rằng…», có câu mở «không phải lời khuyên điều trị cho ai cụ thể» và câu kết «hướng điều trị được chọn sau khi người có chuyên môn đánh giá». Ổn. Câu «thuốc… không cần cho trầm cảm nhẹ» là lời WHO; người đang dùng thuốc vì trầm cảm nhẹ có thể đọc thành gợi ý ngừng, nhưng ngay sau đó có «Việc bắt đầu, đổi hay ngừng thuốc là việc của bác sĩ cùng người bệnh»: đủ.»"
  - trang: kham-pha/suc-khoe-tam-than/tri-lieu-tam-ly
    cho: "đoạn Kết quả của Cuijpers và cộng sự (2023), con số NNT"
    ghi_chu: "«Không phải vấn đề an toàn. Trang ghi NNT = 4,7 cạnh 42% so với 19%; nếu tính thẳng từ hai tỉ lệ thì NNT ≈ 1/(0,42 − 0,19) ≈ 4,3. Tường thuật bậc 3 (Mad in America) ghi NNT 3,6 cho thuyên giảm. Review nên đối chiếu NNT với toàn văn khi mở để kiểm n53.»"
  - trang: kham-pha/suc-khoe-tam-than/lo-au
    cho: "«Vòng luẩn quẩn tránh né» và ngộ nhận 1 («Tránh hẳn thứ gây sợ…»)"
    ghi_chu: "«Không phải chẩn đoán hay lời khuyên thuốc. Đã có câu «đối mặt có kế hoạch, cùng người có chuyên môn» và «khác với bị ép vào tình huống đáng sợ», nên không thành lời khuyên tự tiếp xúc. Ổn.»"
