<figure class="pz-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" role="img" aria-label="Sơ đồ kênh flow: dòng chảy ở vùng thử thách và kỹ năng cùng cao và cân bằng; lo âu, chán nản, thờ ơ ở các vùng còn lại"><line x1="90" y1="390" x2="640" y2="390" stroke="currentColor" stroke-opacity="0.6"/><line x1="90" y1="390" x2="90" y2="70" stroke="currentColor" stroke-opacity="0.6"/><text x="636" y="414" font-size="11" text-anchor="end" fill="currentColor">kỹ năng</text><text x="30" y="230" font-size="11" text-anchor="middle" fill="currentColor" transform="rotate(-90 30 230)">thách thức</text><polygon points="210,330 590,120 590,180 210,390" class="pz-fig-a" fill="currentColor" fill-opacity="0.18"/><polygon points="350,262 590,120 590,180 350,322" class="pz-fig-a" fill="currentColor" fill-opacity="0.45"/><text x="478" y="214" font-size="13" text-anchor="middle" fill="currentColor" font-weight="700">Dòng chảy</text><text x="478" y="232" font-size="11" text-anchor="middle" fill="currentColor">(flow)</text><text x="232" y="128" font-size="12.5" text-anchor="middle" fill="currentColor" font-weight="600">Lo âu</text><text x="545" y="342" font-size="12.5" text-anchor="middle" fill="currentColor" font-weight="600">Chán nản</text><text x="150" y="366" font-size="12.5" text-anchor="middle" fill="currentColor" font-weight="600">Thờ ơ</text><text x="340" y="448" font-size="11" text-anchor="middle" fill="currentColor">Flow chỉ xuất hiện khi cả hai đều cao và cân bằng.</text></svg><figcaption>Sơ đồ minh họa ước lệ, không theo tỉ lệ số liệu. Mô hình kênh flow: thử thách vượt xa kỹ năng gây lo âu; kỹ năng vượt xa thử thách gây chán nản; cả hai đều thấp gây thờ ơ. Dòng chảy chỉ xuất hiện khi cả hai đều cao và cân bằng.</figcaption></figure>
