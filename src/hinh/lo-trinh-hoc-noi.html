 r="4" class="pz-fig-a" fill="currentColor" stroke="none"/><text x="345" y="276" font-size="12" text-anchor="middle" fill="currentColor">16–24 tháng: ghép từ, vốn từ tăng nhanh</text></svg><figcaption>Lộ trình điển hình từ nghe đến nói trong hai năm đầu đời. Trẻ thường đi qua các mốc theo thứ tự này, nhưng các mốc tuổi chỉ là gần đúng và thời điểm khác nhau rất nhiều giữa các trẻ.</figcaption></figure>
