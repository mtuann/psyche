50" x2="360" y2="170" stroke="currentColor" stroke-width="1.6"/><polygon points="360,178 355,170 365,170" fill="currentColor"/><text x="384" y="168" font-size="10.5" text-anchor="start" fill="currentColor">24 giờ sau</text><rect x="110" y="192" width="500" height="56" rx="9" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="360" y="214" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">Giai đoạn 2 — hộp shuttle: 10 lượt</text><text x="360" y="232" font-size="11" text-anchor="middle" fill="currentColor">học nhảy qua vách ngăn để thoát hay tránh sốc</text><line x1="140" y1="248" x2="140" y2="270" stroke="currentColor" stroke-width="1.6"/><polygon points="140,278 135,270 145,270" fill="currentColor"/><line x1="360" y1="248" x2="360" y2="270" stroke="currentColor" stroke-width="1.6"/><polygon points="360,278 355,270 365,270" fill="currentColor"/><line x1="580" y1="248" x2="580" y2="270" stroke="currentColor" stroke-width="1.6"/><polygon points="580,278 575,270 585,270" fill="currentColor"/><rect x="35" y="284" width="210" height="66" rx="9" class="pz-fig-a" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="140" y="322" font-size="13" text-anchor="middle" fill="currentColor" font-weight="700">Thoát sốc bình thường</text><rect x="255" y="284" width="210" height="66" rx="9" class="pz-fig-b" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="360" y="322" font-size="13" text-anchor="middle" fill="currentColor" font-weight="700">Phần lớn thụ động (6/8)</text><rect x="475" y="284" width="210" height="66" rx="9" class="pz-fig-a" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="580" y="322" font-size="13" text-anchor="middle" fill="currentColor" font-weight="700">Thoát sốc bình thường</text><text x="360" y="392" font-size="11" text-anchor="middle" fill="currentColor">Chỉ nhóm yoked bị suy giảm rõ: 6 trên 8 con không thoát ở ít nhất 9 trong 10 lượt.</text><text x="360" y="414" font-size="11" text-anchor="middle" fill="currentColor">Nhóm yoked chịu sốc cùng thời lượng trung bình với nhóm thoát được, chỉ khác ở khả năng kiểm soát.</text><text x="360" y="452" font-size="10.5" text-anchor="middle" fill="currentColor">Sơ đồ minh họa ước lệ, không theo tỉ lệ số liệu.</text></svg><figcaption>Sơ đồ minh họa ước lệ, không theo tỉ lệ số liệu. Nhóm thoát được và nhóm yoked chịu sốc cùng thời lượng trung bình, chỉ khác khả năng kiểm soát; nhóm đối chứng không qua giai đoạn sốc. Sang hộp shuttle, nhóm thoát được và nhóm đối chứng thoát sốc bình thường, còn phần lớn nhóm yoked (6 trên 8 con) thụ động chịu sốc ở ít nhất 9 trong 10 lượt (Seligman và Maier, 1967).</figcaption></figure>
