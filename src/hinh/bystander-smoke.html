iddle" fill="currentColor">Cùng 2 người lạ</text><text x="337" y="340" font-size="12" text-anchor="middle" fill="currentColor">(tính theo nhóm)</text><rect x="464" y="274.4" width="110" height="25.6" class="pz-fig-a" fill="currentColor" stroke="none"/><text x="519" y="264.4" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">10%</text><text x="519" y="322" font-size="12" text-anchor="middle" fill="currentColor">Cùng 2 diễn viên</text><text x="519" y="340" font-size="12" text-anchor="middle" fill="currentColor">dửng dưng</text></svg><figcaption>Tỉ lệ người đứng dậy báo khói trong vòng 6 phút: ở một mình 75%; ngồi cùng hai người lạ thật 38% (tính theo nhóm — 3/8 nhóm có người báo khói); ngồi cùng hai diễn viên dửng dưng cắm cúi viết chỉ còn 10%. Nguồn: Latané và Darley (1968), thí nghiệm khói trong phòng.</figcaption></figure>
