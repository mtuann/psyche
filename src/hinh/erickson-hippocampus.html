="408" font-size="11" text-anchor="middle" fill="currentColor">(−1,40%, −1,43%)</text><text x="230" y="438" font-size="11" text-anchor="middle" fill="currentColor">+2% ≈ đảo ngược 1–2 năm teo não do tuổi tác</text></svg><figcaption>Thay đổi thể tích hồi hải mã sau một năm (Erickson và cộng sự, 2011): nhóm đi bộ aerobic tăng khoảng 2% (trái +2,12%, phải +1,97%) — tương đương đảo ngược 1–2 năm teo não do tuổi tác; nhóm chỉ tập giãn cơ tiếp tục teo (−1,40% và −1,43%), đúng như quy luật tự nhiên.</figcaption></figure>
