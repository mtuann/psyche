<figure class="pz-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 452" role="img" aria-label="Ma trận 2x2 Marcia: bốn trạng thái bản sắc theo mức khám phá và cam kết"><text x="405" y="30" font-size="13" text-anchor="middle" fill="currentColor" font-weight="700">Hai chiều bản sắc của Marcia: khám phá × cam kết</text><text x="287.5" y="100" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">Khám phá thấp</text><text x="522.5" y="100" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">Khám phá cao</text><text x="158" y="184" font-size="12" text-anchor="end" fill="currentColor" font-weight="600">Cam kết cao</text><text x="158" y="316" font-size="12" text-anchor="end" fill="currentColor" font-weight="600">Cam kết thấp</text><rect x="170" y="118" width="235" height="132" rx="9" fill="none" stroke="currentColor" stroke-width="1.7"/><text x="287.5" y="174" font-size="13.5" text-anchor="middle" fill="currentColor" font-weight="700">Foreclosure</text><text x="287.5" y="200" font-size="11.5" text-anchor="middle" fill="currentColor">“chọn sẵn theo người khác”</text><rect x="405" y="118" width="235" height="132" rx="9" class="pz-fig-a" fill="none" stroke="currentColor" stroke-width="1.7"/><text x="522.5" y="174" font-size="13.5" text-anchor="middle" fill="currentColor" font-weight="700">Achievement</text><text x="522.5" y="200" font-size="11.5" text-anchor="middle" fill="currentColor">“đã chọn sau khi thử”</text><rect x="170" y="250" width="235" height="132" rx="9" fill="none" stroke="currentColor" stroke-width="1.7"/><text x="287.5" y="306" font-size="13.5" text-anchor="middle" fill="currentColor" font-weight="700">Diffusion</text><text x="287.5" y="332" font-size="11.5" text-anchor="middle" fill="currentColor">“chưa tìm, chưa chọn”</text><rect x="405" y="250" width="235" height="132" rx="9" class="pz-fig-b" fill="none" stroke="currentColor" stroke-width="1.7"/><text x="522.5" y="306" font-size="13.5" text-anchor="middle" fill="currentColor" font-weight="700">Moratorium</text><text x="522.5" y="332" font-size="11.5" text-anchor="middle" fill="currentColor">“đang thử”</text></svg><figcaption>Sơ đồ minh họa ước lệ, không theo tỉ lệ số liệu. Bốn trạng thái bản sắc theo Marcia: cam kết cao mà chưa từng khám phá là Foreclosure (“chọn sẵn theo người khác”); khám phá rồi mới cam kết là Achievement (“đã chọn sau khi thử”); đang khám phá mà chưa cam kết là Moratorium (“đang thử”); không khám phá cũng không cam kết là Diffusion (“chưa tìm, chưa chọn”). Marcia (1966) ghi người ở diffusion có thể đã hoặc chưa từng trải qua giai đoạn khám phá; điểm nhận diện là thiếu cam kết.</figcaption></figure>
