2" x2="501" y2="112" class="pz-fig-b" stroke="currentColor" stroke-width="2.6"/></svg><figcaption>Sơ đồ minh họa ước lệ, không theo tỉ lệ số liệu (trục tuổi không ghi số cụ thể). Trí tuệ lưu động (Gf) — giải quyết vấn đề mới, xử lý nhanh — đạt đỉnh sớm rồi suy giảm dần; trí tuệ kết tinh (Gc) — kiến thức và vốn sống tích lũy — giảm muộn hơn và ít hơn, theo dự đoán của Cattell (1963). Ở vốn từ vựng, một chỉ báo của Gc, số liệu cho thấy tăng đến khoảng thập niên 60 rồi chững lại hay giảm, nhưng ở tuổi 70–80 vẫn cao hơn ở tuổi 20–40 (Salthouse, 2019); nhóm Seattle thấy trí tuệ kết tinh giảm dốc hơn từ cuối tuổi 70 (Schaie và Willis, 2010).</figcaption></figure>
