6"/></svg><figcaption>Sơ đồ minh họa ước lệ, không theo tỉ lệ số liệu (trục tuổi không ghi số cụ thể). Trí tuệ lưu động (Gf) — giải quyết vấn đề mới, xử lý nhanh — đạt đỉnh ở tuổi trưởng thành trẻ rồi suy giảm dần; trí tuệ kết tinh (Gc) — kiến thức và vốn sống tích lũy — tăng suốt tuổi trung niên và giữ vững đến tuổi già.</figcaption></figure>
