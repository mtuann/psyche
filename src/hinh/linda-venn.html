<figure class="pz-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-label="Hai vòng tròn lồng nhau: tập (b) nhân viên ngân hàng và là nhà hoạt động nữ quyền nằm gọn trong tập (a) nhân viên ngân hàng"><text x="320" y="32" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">Bài toán Linda: hai đáp án dưới dạng tập hợp</text><circle cx="320" cy="185" r="150" class="pz-fig-a" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="320" cy="185" r="100" class="pz-fig-b" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="2.5"/><text x="320" y="67" font-size="13" text-anchor="middle" fill="currentColor">(a) nhân viên ngân hàng</text><text x="320" y="177" font-size="12" text-anchor="middle" fill="currentColor">(b) nhân viên ngân hàng</text><text x="320" y="197" font-size="12" text-anchor="middle" fill="currentColor">và là nhà hoạt động nữ quyền</text><text x="320" y="362" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.75">Tập con không bao giờ đông hơn tập hợp chứa nó</text><text x="320" y="394" font-size="17" text-anchor="middle" fill="currentColor" font-weight="bold">P(A và B) ≤ P(A)</text></svg><figcaption>Hai đáp án bài toán Linda dưới dạng tập hợp: (b) "nhân viên ngân hàng và là nhà hoạt động nữ quyền" nằm gọn trong (a) "nhân viên ngân hàng", nên P(A và B) ≤ P(A) luôn đúng — dù 85% người tham gia nghiên cứu gốc vẫn chọn (b). Nguồn: Tversky và Kahneman (1983).</figcaption></figure>
