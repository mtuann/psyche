# Sinh một lần bằng tools/du_lieu/tach.py từ ../psyche-zero/ (commit 1ca5a80), việc D1.2.
# Chưa kiểm định, chưa khóa. Từ nay sửa tay; trường và kiểu: src/du-lieu.mjs.
# 60 thẻ của docs/assets/data/myths.json (site cũ ghi kiểm tra lần cuối 2026-10-13). cap: cấp trong bài thử
# Bạn nghĩ gì về tâm trí? (bài thử lấy thẻ có cấp nhỏ hơn hay bằng mức đã chọn).

- id: nao-10
  cap: 1
  khang_dinh: Con người chỉ dùng 10% bộ não.
  nhan: bac-bo
  giai_thich: Các kỹ thuật chụp não như PET và fMRI cho thấy hầu như mọi vùng não đều hoạt động trong một ngày bình thường, và tổn thương ở gần như bất kỳ vùng nào cũng gây hậu quả. Não chỉ chiếm khoảng 2% khối lượng cơ thể nhưng dùng khoảng 20% năng lượng lúc nghỉ; một cơ quan "tốn kém" như vậy khó có 90% bỏ không. Dù vậy, khảo sát năm 2012 cho thấy gần một nửa giáo viên được hỏi ở Anh và Hà Lan vẫn tin điều này.
  nguon: [beyerstein-10, dekker2012]
- id: nao-trai-phai
  cap: 1
  khang_dinh: Có người "thiên não trái" (logic) và người "thiên não phải" (sáng tạo).
  nhan: bac-bo
  giai_thich: Một số chức năng có thiên lệch về một bán cầu, chẳng hạn ngôn ngữ thường thiên về bên trái. Nhưng đó là đặc điểm của từng chức năng, không phải "kiểu người". Khi phân tích kết nối não lúc nghỉ của 1.011 người từ 7 đến 29 tuổi, các nhà nghiên cứu không thấy ai có toàn bộ mạng lưới bên trái hay bên phải mạnh hơn hẳn.
  nguon: [nielsen2013]
- id: phong-cach-hoc
  cap: 1
  khang_dinh: Dạy đúng "phong cách học" của mỗi người (nhìn, nghe hay vận động) giúp họ học tốt hơn.
  nhan: bac-bo
  giai_thich: Người ta có sở thích học khác nhau, nhưng giả thuyết "dạy khớp với phong cách thì học tốt hơn" cần một kiểu thí nghiệm cụ thể để kiểm tra. Bài tổng quan năm 2008 gần như không tìm thấy bằng chứng ủng hộ. Tổng hợp 17 phân tích tổng hợp năm 2025 cho thấy ở các nghiên cứu thật sự kiểm tra việc "dạy khớp", hiệu ứng gần bằng 0 (d = 0,04). Dù vậy, khoảng 9/10 giáo viên được khảo sát ở nhiều nước vẫn tin vào nó.
  nguon: [pashler2008, hattie2025, newton2020]
  trang: kham-pha/tri-nho/phong-cach-hoc
- id: mozart
  cap: 1
  khang_dinh: Cho trẻ nghe nhạc Mozart làm trẻ thông minh hơn.
  nhan: bac-bo
  giai_thich: Nghiên cứu gốc năm 1993 làm trên sinh viên đại học, không phải trẻ em, và chỉ đo một nhiệm vụ không gian trong thời gian ngắn ngay sau khi nghe nhạc. Các phân tích tổng hợp sau đó (1999, 2010) thấy hiệu ứng rất nhỏ hoặc gần như không có, kèm dấu hiệu thiên lệch xuất bản. Không có bằng chứng nghe Mozart làm tăng trí thông minh lâu dài.
  nguon: [chabris1999, pietschnig2010]
- id: xa-gian
  cap: 1
  khang_dinh: Trút giận ra ngoài (đấm gối, la hét) giúp bớt giận.
  nhan: bac-bo
  giai_thich: Trong một thí nghiệm năm 2002, người đấm bao cát trong lúc nghĩ về người làm mình giận lại giận và hung hăng hơn so với người ngồi yên. Phân tích tổng hợp năm 2024 gộp 154 nghiên cứu cho thấy các hoạt động làm dịu cơ thể (thở chậm, thư giãn cơ, chánh niệm) giảm giận rõ rệt, còn các hoạt động làm tăng kích động như trút giận gần như không có tác dụng.
  nguon: [bushman2002, kjaervik2024]
- id: noi-doi-mat
  cap: 1
  khang_dinh: Người nói dối hay tránh ánh mắt, nên nhìn mắt là biết ai nói dối.
  nhan: bac-bo
  giai_thich: Phân tích tổng hợp gần 25.000 người phán đoán cho thấy con người chỉ phân biệt đúng nói thật hay nói dối khoảng 54% số lần, chỉ hơn đoán may (50%) một chút. Phần lớn các dấu hiệu hành vi mà ta hay tin, kể cả tránh nhìn, liên hệ rất yếu với việc nói dối.
  nguon: [bond2006, depaulo2003]
- id: trai-dau
  cap: 2
  khang_dinh: 'Trái dấu thì hút nhau: người khác mình nhiều dễ hấp dẫn mình hơn.'
  nhan: bac-bo
  giai_thich: Phân tích tổng hợp 313 nghiên cứu cho thấy sự giống nhau, cả thực tế lẫn cảm nhận, liên quan khá mạnh đến sức hút giữa hai người. Chưa có bằng chứng nhất quán rằng tính cách trái ngược làm người ta hấp dẫn nhau hơn.
  nguon: [montoya2008]
- id: tri-nho-may-quay
  cap: 1
  khang_dinh: 'Trí nhớ hoạt động như máy quay phim: ghi lại chính xác những gì đã xảy ra.'
  nhan: bac-bo
  giai_thich: Mỗi lần nhớ lại, ta dựng lại ký ức từ các mảnh, và ký ức có thể bị thay đổi bởi câu hỏi gợi ý hay thông tin nghe được sau đó. Đây là một trong những phát hiện được tái lập nhiều nhất của tâm lý học trí nhớ. Một khảo sát đại diện ở Mỹ công bố năm 2011 cho thấy 63% người được hỏi vẫn tin trí nhớ giống máy quay.
  nguon: [simons2011, loftus2005]
  trang: kham-pha/tri-nho/bang-ghi-hinh
- id: mbti
  cap: 2
  khang_dinh: MBTI là công cụ khoa học đáng tin để xếp mỗi người vào một trong 16 "loại" tính cách.
  nhan: bac-bo
  giai_thich: 'Các đặc điểm tính cách phân bố liên tục, phần đông mọi người ở gần giữa. Chia đôi thành "loại" làm mất thông tin và khiến kết quả kém ổn định: nhiều người nhận loại khác khi làm lại sau vài tuần. Giới nghiên cứu dùng mô hình Big Five, đo theo các chiều liên tục và có bằng chứng dự báo tốt hơn.'
  nguon: [pittenger1993, pittenger2005]
- id: thap-maslow
  cap: 2
  khang_dinh: Hình kim tự tháp nhu cầu nổi tiếng là do Abraham Maslow vẽ ra.
  nhan: bac-bo
  giai_thich: 'Maslow mô tả một thứ bậc nhu cầu (năm 1943 và 1954) nhưng không vẽ kim tự tháp. Hình kim tự tháp do giới tư vấn quản trị tạo ra về sau, và nó khiến thứ bậc trông cứng nhắc hơn ý ông: Maslow cho rằng các nhu cầu chồng lấn nhau, không cần thỏa mãn trọn vẹn bậc dưới mới đến bậc trên.'
  nguon: [bridgman2019]
- id: gian-cach
  cap: 1
  khang_dinh: Chia nhỏ việc ôn tập ra nhiều lần cách quãng giúp nhớ lâu hơn học dồn một lần.
  nhan: vung-chac
  giai_thich: Đây là "hiệu ứng giãn cách", một trong những phát hiện vững nhất của tâm lý học. Phân tích tổng hợp năm 2006 gộp hơn 300 thí nghiệm cho thấy ôn cách quãng cho kết quả nhớ lâu tốt hơn học dồn với cùng tổng thời gian. Khoảng cách tốt nhất dài hơn khi bạn cần nhớ lâu hơn.
  nguon: [cepeda2006, dunlosky2013]
  trang: kham-pha/tri-nho/vi-sao-ta-quen
- id: tu-kiem-tra
  cap: 1
  khang_dinh: Tự kiểm tra (cố nhớ lại) giúp nhớ lâu hơn đọc lại.
  nhan: vung-chac
  giai_thich: '"Hiệu ứng kiểm tra" đã được lặp lại rất nhiều lần, ở cả phòng thí nghiệm lẫn lớp học. Trong một thí nghiệm năm 2006, người tự kiểm tra nhớ kém hơn một chút sau 5 phút nhưng nhớ tốt hơn rõ rệt sau một tuần so với người đọc lại. Bài tổng quan năm 2013 xếp tự kiểm tra vào nhóm kỹ thuật học hiệu quả cao, còn đọc lại và tô đậm vào nhóm hiệu quả thấp.'
  nguon: [roediger2006, dunlosky2013]
  trang: kham-pha/tri-nho/vi-sao-ta-quen
- id: da-nhiem
  cap: 1
  khang_dinh: Phần lớn mọi người có thể làm nhiều việc cùng lúc mà không kém hiệu quả.
  nhan: bac-bo
  giai_thich: Mỗi lần chuyển qua lại giữa các việc đều tốn thời gian và làm tăng lỗi, nhất là với việc phức tạp. Trong một thí nghiệm lái xe mô phỏng kết hợp nhiệm vụ trí nhớ với 200 người, chỉ khoảng 2,5% không bị giảm hiệu suất. Cảm giác "mình làm nhiều việc cùng lúc rất giỏi" thường không khớp với kết quả đo được.
  nguon: [rubinstein2001, watson2010]
- id: can-kiet-y-chi
  cap: 2
  khang_dinh: 'Ý chí là nguồn lực có hạn: dùng nhiều thì cạn, khiến ta kém tự chủ ở việc tiếp theo.'
  nhan: tranh-cai
  giai_thich: Hàng trăm nghiên cứu nhỏ từng ủng hộ ý này. Nhưng hai dự án tái lập lớn, đăng ký trước, với 2.141 người ở 23 phòng thí nghiệm (2016) và 3.531 người ở 36 phòng thí nghiệm (2021, do chính một nhà nghiên cứu ủng hộ lý thuyết dẫn đầu) đều thấy hiệu ứng gần bằng 0. Người ủng hộ cho rằng cách gây "cạn kiệt" trong các thử nghiệm này quá yếu. Hiện nay, nếu có hiệu ứng thì nó rất nhỏ.
  nguon: [hagger2016, vohs2021]
- id: tu-the-quyen-luc
  cap: 2
  khang_dinh: Đứng "tư thế quyền lực" 2 phút làm tăng hormone testosterone và khiến bạn dám mạo hiểm hơn.
  nhan: bac-bo
  giai_thich: Một nghiên cứu tái lập với 200 người không thấy thay đổi testosterone, cortisol hay hành vi chấp nhận rủi ro. Năm 2016, tác giả chính của nghiên cứu gốc tuyên bố bà không còn tin hiệu ứng này là thật. Có thể có một hiệu ứng nhỏ lên cảm giác tự tin tự báo cáo, nhưng phần này vẫn đang tranh cãi.
  nguon: [ranehill2015, carney2016]
- id: benh-tam-than-bao-luc
  cap: 2
  khang_dinh: Phần lớn người có bệnh tâm thần là nguy hiểm và có xu hướng bạo lực.
  nhan: bac-bo
  giai_thich: Phần lớn người sống với bệnh tâm thần không có hành vi bạo lực. Ước tính từ dữ liệu dịch tễ ở Mỹ cho thấy chỉ khoảng 4% bạo lực trong cộng đồng có thể quy cho bệnh tâm thần nặng. Nguy cơ tăng chủ yếu khi có thêm các yếu tố khác như sử dụng chất gây nghiện hay hoàn cảnh bất lợi, và người có bệnh tâm thần thường là nạn nhân của bạo lực nhiều hơn. Định kiến này khiến nhiều người ngại tìm giúp đỡ.
  nguon: [varshney2016, elbogen2009]
- id: trang-tron
  cap: 2
  khang_dinh: 'Đêm trăng tròn khiến người ta hành xử kỳ lạ hơn: nhiều tai nạn, cấp cứu, gây gổ hơn.'
  nhan: bac-bo
  giai_thich: Phân tích tổng hợp năm 1985 không tìm thấy mối liên hệ đáng tin giữa pha mặt trăng và các hành vi này, và các kết quả dương tính lẻ tẻ không lặp lại được. Niềm tin vẫn tồn tại vì ta dễ nhớ những đêm trăng tròn hỗn loạn mà quên những đêm trăng tròn bình thường.
  nguon: [rotton1985]
- id: duong-tang-dong
  cap: 2
  khang_dinh: Ăn đồ ngọt làm trẻ em tăng động.
  nhan: bac-bo
  giai_thich: Phân tích tổng hợp năm 1995 gộp các thí nghiệm mù đôi có giả dược (cả trẻ, cha mẹ lẫn người quan sát đều không biết trẻ được ăn đường hay chất tạo ngọt) không thấy đường ảnh hưởng đến hành vi hay nhận thức của trẻ; không loại trừ được một hiệu ứng rất nhỏ ở một số trẻ. Kỳ vọng của người lớn, cùng bối cảnh như tiệc sinh nhật, có thể khiến họ "thấy" trẻ hiếu động hơn.
  nguon: [wolraich1995]
- id: nguoi-ngoai-cuoc
  cap: 3
  khang_dinh: Càng đông người chứng kiến một vụ việc, nạn nhân càng khó được ai giúp.
  nhan: tranh-cai
  giai_thich: Trong phòng thí nghiệm, mỗi cá nhân đúng là ít ra tay hơn khi có người khác (phân tích tổng hợp năm 2011 xác nhận). Nhưng phân tích camera giám sát 219 vụ xung đột thật ở Anh, Hà Lan và Nam Phi (2020) cho thấy ít nhất một người can thiệp trong khoảng 9/10 vụ, và càng đông người thì càng có nhiều khả năng ai đó giúp. Hiệu ứng có thật ở cấp độ từng người, nhưng câu nói phổ biến ở trên thì gây hiểu lầm.
  nguon: [fischer2011, philpot2020]
- id: mim-cuoi
  cap: 3
  khang_dinh: Cứ mỉm cười là bạn sẽ thấy vui hơn.
  nhan: tranh-cai
  giai_thich: Thí nghiệm "ngậm bút" kinh điển không tái lập được khi làm lại ở 17 phòng thí nghiệm với gần 1.900 người. Dự án Many Smiles (3.878 người, 19 quốc gia, 2022) thấy chủ động mỉm cười làm tăng cảm giác vui một chút, nhưng cách ngậm bút thì không cho kết quả rõ ràng. Nếu có hiệu ứng thì nó nhỏ, và mỉm cười không phải cách chữa buồn bã hay trầm cảm.
  nguon: [wagenmakers2016, coles2022]
- id: thoi-mien
  cap: 1
  khang_dinh: Thôi miên giúp nhớ lại chính xác chuyện đã qua.
  nhan: bac-bo
  giai_thich: Tổng quan năm 2025 về các nghiên cứu của Steven Jay Lynn kết luận thôi miên không giúp nhớ chính xác hơn trong bất kỳ nghiên cứu nào, thậm chí có khi còn làm tệ đi; ngược lại, nó làm tăng việc nhớ ra những chuyện chưa từng xảy ra và khiến người ta tự tin hơn vào ký ức sai. Trong một thí nghiệm với 96 sinh viên, nhóm bị thôi miên không đoán đúng ngày tháng các sự kiện hơn nhóm đối chứng, nhưng lại ít chịu sửa đáp án khi được báo có thể sai.
  nguon: [krackow2025, thoi-mien-osu]
- id: hoc-khi-ngu
  cap: 2
  khang_dinh: Bật băng nghe khi ngủ là cách học thêm giờ hiệu quả.
  nhan: bac-bo
  giai_thich: Bài tổng quan kinh điển năm 1955 xem lại các nghiên cứu “học khi ngủ” và kết luận hiệu ứng (nếu có) xảy ra ở trạng thái nửa tỉnh nửa mê chứ không phải giấc ngủ thật. Khi các nhà nghiên cứu dùng điện não đồ để chắc chắn người tham gia đang ngủ sâu, họ không ghi nhận việc học được kiến thức mới. Ngày nay, khoa học chỉ dùng âm thanh khi ngủ để củng cố ký ức đã học lúc tỉnh, chứ không nhồi được kiến thức mới.
  nguon: [simon1955, hoc-khi-ngu-smithsonian]
- id: bay-con-so
  cap: 1
  khang_dinh: Trí nhớ ngắn hạn của mọi người chứa được 7 món đồ.
  nhan: bac-bo
  giai_thich: Con số 7±2 của Miller (1956) là về “cụm” thông tin — ta có thể gom nhiều món thành một cụm để nhớ. Khi ngăn người tham gia dùng mẹo gom cụm hay nhẩm lại, Nelson Cowan tổng hợp lại toàn bộ bằng chứng năm 2001 và kết luận dung lượng thật gần với 4 cụm hơn. Nói cách khác, 7 là mức tối đa khi đã dùng mẹo, còn giới hạn thô thì gần với 4.
  nguon: [cowan2001, bay-con-so-pubmed]
  trang: trai-nghiem/do-dai-tri-nho
- id: nhan-chung
  cap: 1
  khang_dinh: Tận mắt chứng kiến thì khó mà nhận nhầm người.
  nhan: bac-bo
  giai_thich: 'Nhận dạng nhầm là nguyên nhân hàng đầu gây án oan ở Mỹ: nó xuất hiện trong khoảng 7 trên 10 vụ án được minh oan bằng ADN theo Innocence Project. Trí nhớ không ghi hình nguyên vẹn mà dựng lại mỗi lần nhớ, nên nhân chứng có thể rất thành thật, rất chắc chắn mà vẫn chỉ nhầm người.'
  nguon: [nhan-chung-ip, nhan-chung-innocence]
  trang: kham-pha/tri-nho/bang-ghi-hinh
- id: khi-dot-vo-hinh
  cap: 1
  khang_dinh: Mắt đã nhìn rõ thì không thể bỏ sót thứ ngay trước mặt.
  nhan: bac-bo
  giai_thich: Trong thí nghiệm “con khỉ đột vô hình” năm 1999, người xem được nhờ đếm số lần chuyền bóng và khoảng một nửa không hề thấy một người mặc đồ khỉ đột đi ngang giữa màn hình. Hiện tượng “mù không chú ý” này cho thấy ta chỉ nhận thức được những gì mình đang chú ý đến — mắt “thấy” nhưng não không “ghi nhận”.
  nguon: [simons1999]
- id: mau-sac
  cap: 2
  khang_dinh: Sơn phòng màu xanh giúp tập trung, màu đỏ làm người ta hăng hơn.
  nhan: bac-bo
  giai_thich: Bài tổng quan năm 2014 của Elliot và Maier kết luận nghiên cứu về màu sắc và tâm lý vẫn còn ở giai đoạn sơ khai, cần làm rõ điều kiện biên và khả năng áp dụng thực tế trước khi đưa ra khuyến nghị chắc chắn. Chẳng hạn, hiệu ứng “màu đỏ gợi tình” từng nổi tiếng đã không qua được các lần tái lập đăng ký trước. Màu sắc có thể mang ý nghĩa trong bối cảnh cụ thể, nhưng không có màu nào “lập trình” được hành vi.
  nguon: [elliot2014, lehmann2017, wagge2019]
- id: nha-tu-stanford
  cap: 3
  khang_dinh: Thí nghiệm nhà tù Stanford chứng minh hoàn cảnh biến người tốt thành kẻ ác.
  nhan: tranh-cai
  giai_thich: Điều tra lại hồ sơ lưu trữ và phỏng vấn 15 người tham gia (Le Texier, 2019) cho thấy các “cai ngục” đã được hướng dẫn cách đối xử với “tù nhân”, dữ liệu thu thập thiếu khách quan, và người tham gia hiếm khi thật sự “nhập vai”. Nhóm của Zimbardo đã phản bác, cho rằng phê bình này bỏ qua bối cảnh — nên đây vẫn là cuộc tranh luận mở, không phải kết luận đã ngã ngũ.
  nguon: [letexier2019, hplt2019]
- id: luoi-xa-hoi
  cap: 2
  khang_dinh: Làm việc nhóm lúc nào cũng cho kết quả tốt hơn làm một mình.
  nhan: bac-bo
  giai_thich: 'Phân tích tổng hợp 78 nghiên cứu năm 1993 xác nhận hiện tượng “lười xã hội”: mỗi cá nhân thường bỏ ít nỗ lực hơn khi làm chung so với khi làm riêng, nhất là khi đóng góp của từng người khó được đánh giá. Nhóm chỉ vượt trội khi có phân công rõ ràng, trách nhiệm cá nhân và công việc có ý nghĩa — còn “càng đông càng tốt” thì không đúng.'
  nguon: [karau1993]
- id: khen-thong-minh
  cap: 1
  khang_dinh: Khen trẻ “thông minh” giúp trẻ tự tin và học giỏi hơn.
  nhan: bac-bo
  giai_thich: Trong loạt 6 thí nghiệm năm 1998, trẻ được khen “con thông minh quá” có xu hướng chọn bài dễ để giữ hình ảnh, bỏ cuộc sớm khi gặp khó và nói dối về điểm số nhiều hơn nhóm được khen nỗ lực. Khen vào quá trình (“con đã thử nhiều cách”) nuôi tư duy cầu tiến; khen vào “bản chất” thông minh thì cho kết quả ngược lại.
  nguon: [mueller1998]
- id: game-bao-luc
  cap: 2
  khang_dinh: Chơi game bạo lực khiến trẻ em hung hăng ngoài đời.
  nhan: tranh-cai
  giai_thich: 'Phân tích tổng hợp 24 nghiên cứu theo dõi theo thời gian với hơn 17.000 trẻ em (2018) thấy chơi game bạo lực liên quan đến hành vi hung hăng sau đó, nhưng mức độ rất nhỏ (β ≈ 0,08–0,11). Một nhóm nhà nghiên cứu khác cho rằng mối liên hệ này bị thổi phồng và không có ý nghĩa thực tế. Bằng chứng hiện tại: có tín hiệu nhỏ, chưa đủ để kết luận game “gây” bạo lực.'
  nguon: [prescott2018]
- id: eq-hon-iq
  cap: 2
  khang_dinh: EQ quyết định thành công trong sự nghiệp nhiều hơn IQ.
  nhan: bac-bo
  giai_thich: Phân tích tổng hợp năm 2011 thấy trí tuệ cảm xúc liên hệ với hiệu suất công việc ở mức vừa phải (r ≈ 0,24–0,30), nhưng không có bằng chứng nó dự báo thành công nghề nghiệp tốt hơn IQ. EQ là một năng lực có thật và hữu ích, nhưng khẩu hiệu “EQ quan trọng hơn IQ” thì không đứng vững.
  nguon: [oboyle2011]
- id: than-kinh-moi
  cap: 2
  khang_dinh: Não người trưởng thành không sinh thêm tế bào thần kinh mới.
  nhan: bac-bo
  giai_thich: Dùng phương pháp “xác định tuổi” tế bào bằng carbon-14 từ các vụ thử hạt nhân, nhóm nghiên cứu ở Viện Karolinska (2013) chứng minh hồi hải mã của người trưởng thành vẫn sinh tế bào thần kinh mới mỗi ngày, dù tốc độ giảm dần theo tuổi. Phát hiện này mới chắc chắn ở hồi hải mã — vùng liên quan đến trí nhớ — chứ chưa phải toàn bộ não.
  nguon: [spalding2013]
- id: nao-nam-nu
  cap: 1
  khang_dinh: Não đàn ông và não phụ nữ khác nhau căn bản, như hai “loại” riêng.
  nhan: bac-bo
  giai_thich: Phân tích hơn 1.400 bộ não (2015) cho thấy sự khác biệt trung bình giữa hai giới có tồn tại, nhưng phân bố chồng lấn rất nhiều và hầu như không có bộ não nào “thuần nam” hay “thuần nữ” ở mọi đặc điểm. Hầu hết não người là “khảm” — gồm các đặc điểm phổ biến hơn ở nam, ở nữ và ở cả hai. Khác biệt trung bình không có nghĩa là hai loại riêng biệt.
  nguon: [joel2015, hpj2015]
- id: vaccine-tu-ky
  cap: 1
  khang_dinh: Tiêm vắc-xin cho trẻ gây tự kỷ.
  nhan: bac-bo
  giai_thich: 'Phân tích tổng hợp năm 2014 gộp 5 nghiên cứu đoàn hệ với hơn 1,25 triệu trẻ và 5 nghiên cứu bệnh-chứng, không tìm thấy liên hệ giữa tiêm chủng (kể cả vắc-xin sởi-quai bị-rubella) và tự kỷ: tỉ số odds gộp là 0,99, tức gần như bằng nhau giữa nhóm tiêm và không tiêm. Đây là một trong những ngộ nhận bị bác bỏ kỹ nhất trong y học.'
  nguon: [taylor2014]
- id: muoi-nghin-gio
  cap: 1
  khang_dinh: Cứ luyện tập 10.000 giờ là thành chuyên gia trong lĩnh vực nào cũng được.
  nhan: bac-bo
  giai_thich: Phân tích tổng hợp 88 nghiên cứu năm 2014 thấy luyện tập có chủ đích giải thích được 26% khác biệt thành tích trong game, 21% trong âm nhạc, 18% trong thể thao — nhưng chỉ 4% trong học tập và dưới 1% trong các ngành nghề. Luyện tập đúng cách rất quan trọng, nhưng “10.000 giờ” không phải công thức đảm bảo cho mọi lĩnh vực.
  nguon: [macnamara2014]
- id: thuong-ngoai
  cap: 2
  khang_dinh: Muốn ai đó chăm hơn thì cứ thưởng nhiều hơn.
  nhan: bac-bo
  giai_thich: 'Phân tích tổng hợp năm 1999 cho thấy phần thưởng vật chất được trông đợi trước có thể làm giảm động lực nội tại — hiện tượng “lấn át”: việc vốn thích làm trở nên kém hấp dẫn khi bị gắn với thưởng. Thưởng vẫn hiệu quả trong nhiều trường hợp, nhưng “càng thưởng càng chăm” không phải quy luật chung.'
  nguon: [deci1999]
- id: stress-hai
  cap: 1
  khang_dinh: Căng thẳng lúc nào cũng có hại, càng tránh được càng tốt.
  nhan: bac-bo
  giai_thich: Thí nghiệm năm 2013 cho thấy người được xem video về mặt tích cực của căng thẳng, sau một tuần, tự báo cáo hiệu suất làm việc tốt hơn và ít triệu chứng sức khỏe tiêu cực hơn nhóm được xem video về mặt hại — cùng một mức căng thẳng, cách nhìn khác nhau cho kết quả khác nhau. Dĩ nhiên, căng thẳng kéo dài quá sức vẫn có hại; điểm mấu chốt là căng thẳng không phải lúc nào cũng là kẻ thù.
  nguon: [crum2013]
- id: ruou-ngu
  cap: 2
  khang_dinh: Uống chút rượu trước khi ngủ giúp ngủ ngon và sâu.
  nhan: bac-bo
  giai_thich: 'Rượu đúng là giúp thiếp đi nhanh hơn, nhưng tổng quan nghiên cứu năm 2013 cho thấy nó phá vỡ cấu trúc giấc ngủ: đè nén giấc ngủ REM, khiến nửa sau của đêm chập chờn và hay tỉnh giấc. Ngủ sau khi uống rượu là giấc ngủ “nông và đứt quãng”, không phải ngủ sâu.'
  nguon: [ebrahim2013]
- id: tram-cam-buon
  cap: 1
  khang_dinh: Trầm cảm chỉ là buồn nhiều, “vui lên” là hết.
  nhan: bac-bo
  giai_thich: 'Theo Tổ chức Y tế Thế giới, trầm cảm là buồn bã kéo dài kèm mất hứng thú với mọi việc và không làm nổi sinh hoạt thường ngày trong ít nhất hai tuần, cùng hàng loạt triệu chứng khác: mất năng lượng, rối loạn ăn ngủ, khó tập trung, cảm giác vô dụng hay tội lỗi. Đây là một bệnh lý có cách điều trị hiệu quả — và chính định kiến “cố vui lên là hết” khiến nhiều người ngại tìm giúp đỡ.'
  nguon: [who2017]
- id: iq-co-dinh
  cap: 1
  khang_dinh: IQ của mỗi người là cố định, sinh ra sao thì cả đời vậy.
  nhan: bac-bo
  giai_thich: Phân tích tổng hợp 42 bộ dữ liệu với hơn 600.000 người năm 2018 cho thấy mỗi năm đi học thêm giúp tăng khoảng 1–5 điểm IQ, và hiệu ứng này kéo dài suốt đời. Gen có ảnh hưởng lớn đến trí tuệ, nhưng “cố định bất biến” thì không đúng.
  nguon: [ritchie2018]
- id: nao-che-hai-y-thuc
  cap: 2
  khang_dinh: Phẫu thuật cắt thể chai tạo ra hai “con người” độc lập trong một cơ thể.
  nhan: tranh-cai
  giai_thich: 'Ở bệnh nhân não chẻ, hai bán cầu xử lý thông tin độc lập: tay trái “biết” điều miệng không nói được. Nhưng liệu đó có phải hai ý thức riêng biệt không thì các nhà nghiên cứu vẫn tranh cãi — nhiều người cho rằng ý thức vẫn thống nhất ở mức độ nào đó, chỉ là đường truyền thông tin bị cắt.'
  nguon: [gazzaniga1967]
  trang: kham-pha/co-so-sinh-hoc/nao-che-doi
- id: tinh-cach-dong-khuon
  cap: 2
  khang_dinh: Tính cách đóng khuôn sau tuổi 30, không đổi được nữa.
  nhan: bac-bo
  giai_thich: 'Phân tích tổng hợp 152 nghiên cứu cho thấy thứ hạng tính cách giữa các cá nhân ổn định dần theo tuổi, nhưng mức trung bình vẫn dịch chuyển suốt tuổi trưởng thành: người ta có xu hướng tận tâm, dễ chịu và ổn định cảm xúc hơn theo năm tháng. “Đóng khuôn như thạch cao” chỉ đúng một nửa.'
  nguon: [roberts2000]
  trang: kham-pha/tinh-cach/tinh-cach-thay-doi
- id: thuong-nao-cung-chet
  cap: 2
  khang_dinh: Bất kỳ phần thưởng nào cũng giết chết đam mê.
  nhan: bac-bo
  giai_thich: 'Thí nghiệm của Deci (1971) cho thấy thưởng tiền làm giảm hứng thú nội tại, nhưng lời khen lại làm TĂNG hứng thú. Phân tích tổng hợp sau này xác nhận: nguy cơ “lấn át” chủ yếu đến từ thưởng vật chất gắn với kiểm soát; thưởng bất ngờ hay thưởng bằng lời thường vô hại.'
  nguon: [deci1971]
  trang: kham-pha/cam-xuc-dong-luc/thuong-va-dong-luc
- id: nghi-tich-cuc-stress
  cap: 2
  khang_dinh: Chỉ cần nghĩ tích cực về stress thì stress sẽ tự thành có lợi.
  nhan: tranh-cai
  giai_thich: Can thiệp “tư duy về stress” (Crum và cộng sự, 2013) cho thấy nhóm được hướng dẫn nhìn stress tích cực tự báo cáo làm việc tốt hơn sau một tuần. Nhưng hiệu ứng còn nhỏ, đo bằng tự báo cáo, và việc tái lập đúng giao thức gốc vẫn là câu hỏi mở — chưa đủ để nói “nghĩ tích cực là đủ”.
  nguon: [crum2013]
  trang: kham-pha/cang-thang-giac-ngu/stress-co-hai
- id: thuc-khuya-on-thi
  cap: 1
  khang_dinh: Thức khuya ôn thi giúp nhớ bài lâu hơn.
  nhan: bac-bo
  giai_thich: Trong thí nghiệm của Gais và cộng sự (2006), nhóm học buổi tối rồi đi ngủ nhớ tốt hơn hẳn nhóm thức trắng đêm khi kiểm tra sau 48 giờ — dù cả hai đã được ngủ bù. Giấc ngủ sau khi học giúp củng cố trí nhớ; thức khuya chính là bỏ đi cơ hội đó.
  nguon: [gais2006]
  trang: kham-pha/cang-thang-giac-ngu/ngu-va-tri-nho
- id: giau-hanh-phuc-thang
  cap: 2
  khang_dinh: Càng giàu thì hạnh phúc càng tăng theo đường thẳng.
  nhan: bac-bo
  giai_thich: Kahneman và Deaton (2010) thấy hạnh phúc cảm xúc chững lại quanh ngưỡng khoảng 75.000 USD/năm, trong khi đánh giá cuộc sống vẫn tăng chậm theo thu nhập. Nghiên cứu sau này (Killingsworth, 2021) thấy hạnh phúc vẫn tăng tiếp nhưng không đều — tóm lại không phải đường thẳng vô hạn.
  nguon: [kahneman2010]
  trang: kham-pha/hanh-phuc/tien-va-hanh-phuc
- id: tre-so-sinh-khong-hieu
  cap: 1
  khang_dinh: Trẻ sơ sinh chẳng hiểu gì về ngôn ngữ xung quanh.
  nhan: bac-bo
  giai_thich: Trẻ vài tháng tuổi đã phân biệt được âm thanh của mọi ngôn ngữ trên thế giới và âm thầm học thống kê từ giọng nói xung quanh — trước cả khi bập bẹ. Thí nghiệm của Kuhl và cộng sự (2003) cho thấy chỉ cần người thật trò chuyện vài giờ, trẻ 9 tháng đã “mở tai” với âm ngoại ngữ.
  nguon: [kuhl2003]
  trang: kham-pha/phat-trien/tre-hoc-noi
- id: cam-xuc-bam-sinh
  cap: 2
  khang_dinh: Cảm xúc của mọi người trên thế giới đều giống nhau, bẩm sinh nguyên khối.
  nhan: tranh-cai
  giai_thich: Người các nền văn hóa nhận diện nét mặt đúng trên mức may rủi, nhưng tổng quan năm 2019 kết luận các biểu hiện cảm xúc không đủ ổn định và đặc trưng để coi là “dấu vân tay” phổ quát — cách ta cảm nhận và gọi tên cảm xúc còn phụ thuộc ngữ cảnh và khái niệm ta có.
  nguon: [barrett2019]
  trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
- id: p-gia-thuyet-dung
  cap: 2
  khang_dinh: p < 0,05 nghĩa là giả thuyết nghiên cứu đúng tới 95%.
  nhan: bac-bo
  giai_thich: p-value chỉ cho biết dữ liệu “lạ” đến mức nào NẾU giả thuyết vô hiệu đúng — nó không phải xác suất giả thuyết đúng, cũng không đo độ lớn hay tầm quan trọng của hiệu ứng. Hiểu sai này phổ biến đến mức Hiệp hội Thống kê Hoa Kỳ phải ra tuyên bố chính thức năm 2016.
  nguon: [wasserstein2016]
  trang: bang-chung/p-value
- id: sinh-vien-my-dai-dien
  cap: 2
  khang_dinh: Nghiên cứu trên sinh viên Mỹ thì đúng với mọi người trên thế giới.
  nhan: bac-bo
  giai_thich: Ước tính khoảng 96% mẫu nghiên cứu tâm lý đến từ các nước phương Tây công nghiệp hóa — chỉ khoảng 12% dân số thế giới — và 68% từ Mỹ. Ở nhiều lĩnh vực, kết quả trên mẫu WEIRD này là ngoại lệ chứ không phải chuẩn mực của loài người (Henrich và cộng sự, 2010).
  nguon: [henrich2010]
  trang: bang-chung/mau-va-chon-mau
- id: trung-binh-dien-hinh
  cap: 1
  khang_dinh: Thu nhập trung bình chính là thu nhập của người điển hình.
  nhan: bac-bo
  giai_thich: Khi phân phối lệch — như thu nhập, nơi vài người rất giàu kéo đuôi phân phối dài ra — trung bình cộng bị kéo lên xa khỏi đa số. Lúc đó trung vị (giá trị đứng giữa) mới mô tả “người điển hình” tốt hơn.
  nguon: [statology-mean-median]
  trang: bang-chung/thong-ke-mo-ta
- id: thang-do-dung-ten
  cap: 2
  khang_dinh: Thang đo nào cũng đo đúng thứ mà tên của nó gọi.
  nhan: bac-bo
  giai_thich: Một thang đo phải chứng minh “độ giá trị” — điểm số thực sự phản ánh khái niệm cần đo, chứ không phải thứ gì khác na ná (Cronbach & Meehl, 1955). Tên gọi hay, câu hỏi nghe hợp lý không đảm bảo điều đó; phải kiểm tra bằng dữ liệu.
  nguon: [cronbach1955]
  trang: bang-chung/do-luong
- id: dang-bao-la-dung
  cap: 2
  khang_dinh: Đã đăng trên báo khoa học thì kết luận là đúng.
  nhan: bac-bo
  giai_thich: Năm 2023 có hơn 10.000 bài báo bị rút lại — mức kỷ lục, trong đó hơn 8.000 bài từ các tạp chí Hindawi do quy trình phản biện bị thao túng. Bình duyệt là bộ lọc quan trọng nhưng không hoàn hảo; đọc báo khoa học vẫn cần con mắt kiểm chứng.
  nguon: [vannoorden2023]
  trang: bang-chung/doc-bai-bao-khoa-hoc
- id: tre-song-ngu-cham-noi
  cap: 1
  khang_dinh: Trẻ học hai ngôn ngữ cùng lúc sẽ chậm nói.
  nhan: bac-bo
  giai_thich: Trẻ song ngữ đạt các mốc ngôn ngữ — bập bẹ, từ đầu tiên, ghép từ — ở cùng độ tuổi với trẻ đơn ngữ, miễn là tính cả hai ngôn ngữ. Cảm giác “chậm” thường đến từ việc chỉ đếm số từ của một ngôn ngữ.
  nguon: [ilabs-bilingual]
  trang: kham-pha/phat-trien/tre-hoc-noi
- id: qua-day-thi-muon
  cap: 2
  khang_dinh: Học ngoại ngữ sau tuổi dậy thì là quá muộn, không học nổi nữa.
  nhan: bac-bo
  giai_thich: Tuổi bắt đầu càng sớm thì càng dễ đạt mức như người bản xứ ở ngữ pháp (Johnson & Newport, 1989) — nhưng đó là chuyện “giỏi đến mức nào”, không phải “học được hay không”. Người lớn vẫn học và dùng tốt ngoại ngữ; không có cánh cửa nào đóng sập sau dậy thì.
  nguon: [johnson1989]
- id: nhin-mat-biet-cam-xuc
  cap: 2
  khang_dinh: Nhìn nét mặt là biết chính xác người ta đang cảm thấy gì.
  nhan: tranh-cai
  giai_thich: Trong phòng thí nghiệm với vài đáp án cho sẵn, người ta đoán đúng nét mặt trên mức may rủi. Nhưng tỉ lệ đó bị thổi phồng bởi cách trắc nghiệm ép chọn; ngoài đời thực, cùng một nét mặt có thể ứng với nhiều cảm xúc khác nhau tùy ngữ cảnh — nên “đọc mặt” không đáng tin như ta tưởng.
  nguon: [barrett2019]
  trang: kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
- id: ngu-it-da-quen
  cap: 1
  khang_dinh: Ngủ 4–5 tiếng mỗi đêm là đủ, miễn là đã quen.
  nhan: bac-bo
  giai_thich: Thí nghiệm 14 ngày cho thấy nhóm ngủ 4–6 tiếng/đêm suy giảm nhận thức tích lũy dần, tương đương thức trắng 1–2 đêm — trong khi cảm giác buồn ngủ tự báo cáo gần như không tăng thêm. “Quen” chỉ là cảm giác; não thì không quen được.
  nguon: [vandongen2003]
- id: gach-chan-hieu-qua
  cap: 1
  khang_dinh: Gạch chân, tô đậm sách giáo khoa là cách ôn bài hiệu quả.
  nhan: bac-bo
  giai_thich: Tổng quan năm 2013 xếp gạch chân/highlight vào nhóm kỹ thuật hiệu quả thấp. Muốn nhớ lâu, hãy tự kiểm tra (cố nhớ lại không nhìn sách) và ôn cách quãng thay vì tô màu trang giấy.
  nguon: [dunlosky2013]
- id: huong-noi-lanh-dao
  cap: 2
  khang_dinh: Người hướng nội không thể làm lãnh đạo giỏi.
  nhan: bac-bo
  giai_thich: Phân tích tổng hợp (Judge và cộng sự, 2002) thấy hướng ngoại dự báo tốt ai sẽ NỔI LÊN làm lãnh đạo, nhưng dự báo kém hơn nhiều về ai lãnh đạo HIỆU QUẢ. Hướng nội hay hướng ngoại chỉ là một mảnh ghép; tận tâm và ổn định cảm xúc cũng quan trọng không kém.
  nguon: [judge2002]
  trang: kham-pha/tinh-cach/big-five
- id: gen-quyet-dinh-het
  cap: 1
  khang_dinh: Gen quyết định hết mọi thứ, cố gắng cũng vô ích.
  nhan: bac-bo
  giai_thich: Con số “tính di truyền 40–60%” là thống kê trên cả quần thể, không phải tỉ lệ “do gen định đoạt” trong một con người cụ thể. Cùng một bộ gen, môi trường và nỗ lực khác nhau vẫn cho kết quả khác nhau — gen đặt khoảng khả năng, không viết sẵn kết cục.
  nguon: [polderman2015]
  trang: kham-pha/co-so-sinh-hoc/gen-va-tinh-cach
