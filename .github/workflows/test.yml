name: Kiểm thử

# Nhánh việc (moi/**: việc của kế hoạch và lô; mo/**: mở khóa; them/**: thêm nội dung sau khi làm lại), pull request,
# hay bấm chạy tay: build bản xem (có cả trang chưa khóa, kèm dải "Chưa kiểm định" từ D1.6), kiểm thử, kiểm thử trình
# duyệt, Lighthouse, các phần chạy song song. Không đăng gì. Nhánh main do deploy.yml kiểm thử trên bản thật trước khi
# đăng. Chép từ ../opus/.github/workflows/test.yml; thêm: bỏ qua lần push chỉ đổi kế hoạch, báo cáo, sổ tay.
on:
  push:
    branches: ['moi/**', 'mo/**', 'them/**']
    paths-ignore: ['plans/**', 'README.md', 'AGENTS.md', 'CLAUDE.md', 'LICENSE*']
  pull_request:
    paths-ignore: ['plans/**', 'README.md', 'AGENTS.md', 'CLAUDE.md', 'LICENSE*']
  workflow_dispatch:

permissions:
  contents: read

# Một nhánh, một lần chạy: push mới (hay pull request của cùng nhánh) hủy lần đang chạy
concurrency:
  group: kiem-thu-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  kiem-thu:
    name: Kiểm thử (bản xem, ${{ matrix.phan }})
    runs-on: ubuntu-latest
    # sáu phần chạy song song (.github/actions/kiem-thu): npm test, kiểm thử trình duyệt trên từng trình duyệt, Lighthouse,
    # ảnh chụp cho review. Một phần hỏng thì các phần khác vẫn chạy tới cuối, để thấy hết lỗi trong một lần
    strategy:
      fail-fast: false
      matrix:
        phan: [npm-test, chromium, webkit, firefox, lighthouse, anh-chup]
    # chặn đường treo (mặc định của GitHub là 6 giờ); phần lâu nhất thường khoảng 4 phút
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # kiểm thử phạm vi lô (tests/pham-vi.test.mjs) và trang mẫu (tools/trang-mau.mjs) so nhánh với main: cần đủ lịch sử
          fetch-depth: 0
      - uses: ./.github/actions/kiem-thu
        with:
          ban: xem
          phan: ${{ matrix.phan }}
      # ảnh chụp các trang nhánh đã đổi và trang mẫu, 360 và 1280 px, để review xem (tools/chup-anh.mjs); không commit vào
      # repo. Tải về: gh run download <số lần chạy> -n anh-chup
      # phần riêng (khoảng 2 phút), song song với kiểm thử; ảnh chỉ để xem: bước này hỏng thì không làm hỏng lần chạy
      - name: Chụp ảnh trang cho review
        if: ${{ !cancelled() && matrix.phan == 'anh-chup' }}
        continue-on-error: true
        run: node tools/chup-anh.mjs anh-chup
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.phan == 'anh-chup' }}
        continue-on-error: true
        with:
          name: anh-chup
          path: anh-chup
          # giữ ngắn cho khỏi đầy dung lượng lưu tệp của repo; chạy lại lần chạy thì ghi đè
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
