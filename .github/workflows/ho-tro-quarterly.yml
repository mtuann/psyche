# Chép từ site cũ (mtuann/psyche-zero, .github/workflows/ho-tro-quarterly.yml), sửa đường dẫn trang và việc cần làm cho
# repo mới (D2-L1). Mỗi quý mở một issue nhắc kiểm tra bằng tay thông tin liên hệ của trang Hỗ trợ. Đợt 9 (máy canh) thêm
# job nghien-cuu-moi: nhắc tìm tin cho trang Nghiên cứu mới (dòng cập nhật, chỉ thêm) và xử lý các issue của máy canh
# (may-canh.yml), như nhịp hằng quý của plans/ben-vung/README.md mục 5. Tên file giữ như site cũ.
name: Nhắc việc mỗi quý (Hỗ trợ, Nghiên cứu mới)

on:
  schedule:
    - cron: "0 2 1 1,4,7,10 *" # ngày 1 của tháng 1, 4, 7, 10
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-24.04
    steps:
      - name: Mở issue nhắc việc
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh issue create --repo "$REPO" --title "Kiểm tra thủ công thông tin liên hệ trang Hỗ trợ ($(date +%m/%Y))" --body "$(cat <<'BODY'
          Kiểm tra lại bằng tay từng mục trên src/content/docs/ho-tro/index.md (hồ sơ: kiem-dinh/ho-tro/index.yml):

          - [ ] 113, 114, 115 vẫn đúng và miễn phí; có thay đổi gì về số khẩn cấp quốc gia (112, số hợp nhất)?
          - [ ] Tổng đài 111: còn 24/7, miễn phí; cơ quan vận hành
          - [ ] Đường dây nóng Ngày Mai: số, ngày và giờ hoạt động (trang chính thức)
          - [ ] CSAGA: số và giờ hoạt động
          - [ ] Số tổng đài các bệnh viện (đối chiếu trang chính thức)
          - [ ] Văn bản pháp luật về tâm lý lâm sàng, kê đơn và công tác xã hội: có sửa đổi?
          - [ ] Mở khóa trang (node tools/khoa.mjs mo ho-tro/index --ly-do "kiểm tra mỗi quý"), sửa chỗ đổi, cập nhật "Kiểm tra lần cuối", hạn kiểm lại và het_han của hồ sơ, rồi khóa lại

          Chỉ đưa lên những gì kiểm chứng được từ nguồn chính thức.
          BODY
          )"

  nghien-cuu-moi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Mở issue nhắc việc
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # ngày của tin mới nhất: tiêu đề "## dd/mm/yyyy: …" đầu tiên của trang (tin mới thêm lên đầu)
          moi=$(grep -m1 -oE '^## [0-9]{1,2}/[0-9]{1,2}/[0-9]{4}' src/content/docs/them/nghien-cuu-moi.md | cut -c4- || true)
          {
            echo "Tin mới nhất trên trang Nghiên cứu mới (src/content/docs/them/nghien-cuu-moi.md): ngày ${moi:-không tìm thấy}."
            echo
            cat <<'BODY'
          Việc hằng quý (plans/ben-vung/README.md mục 5; plans/ben-vung/them-noi-dung.md mục 1, 6):

          - [ ] Tìm nghiên cứu mới đã qua bình duyệt từ quý trước, liên quan trực tiếp tới bài đã có trên Psyche (ưu tiên phân tích tổng hợp, tái lập lớn, nghiên cứu ở Việt Nam)
          - [ ] Mỗi tin một mục có ngày, thêm lên đầu trang; nói rõ nghiên cứu là gì, mẫu, kết quả, giới hạn, liên quan bài nào; không viết lại tin cũ (sai thì đính chính bằng tin mới). Nhánh them/nghien-cuu-moi-<yyyy-mm>: mở khóa trang (node tools/khoa.mjs mo them/nghien-cuu-moi --ly-do "tin mới"), thêm mục, kiểm định V3 cho mục mới, khóa lại
          - [ ] Tin đã đủ bằng chứng cho một bài lõi: viết bổ sung bang-chung-moi (them-noi-dung.md mục 5)
          - [ ] Xử lý các issue còn mở của máy canh (nhãn rut-bai, thoi-su, kiem-lai, link-hong; may-canh.yml)

          Không có tin đủ chuẩn thì đóng issue này, ghi lý do.
          BODY
          } > issue.md
          gh issue create --repo "$REPO" --title "Nghiên cứu mới và việc của máy canh ($(date +%m/%Y))" --body-file issue.md
