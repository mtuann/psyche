    cau: 'Thước đo "Đang tranh cãi": bằng chứng chất lượng cao mâu thuẫn; hoặc một tái lập lớn đăng ký trước thất bại; hoặc hiệu ứng nhỏ hơn nhiều so với tuyên bố ban đầu.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đối chiếu với chuan-kiem-dinh.md mục 4, hàng "Đang tranh cãi": khớp ba điều kiện. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Khớp mục 4.'
    review: dung
  - id: n7
    cau: 'Thước đo "Đã bị bác bỏ": các kiểm tra đủ mạnh liên tục thất bại; hoặc bằng chứng gốc không còn giá trị (bài bị rút, gian lận, lỗi phân tích).'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Đối chiếu với chuan-kiem-dinh.md mục 4, hàng "Đã bị bác bỏ": khớp. Sửa khung có tiêu đề "Đã bị bác bỏ hoặc không tái lập được": bỏ tiêu đề tùy biến, ý chính là hai điều kiện của thước đo. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Khớp mục 4; khung :::bac-bo không còn tiêu đề tùy biến.'
    review: dung
  - id: n8
    cau: Phân tích tổng hợp là bài dùng thống kê gộp kết quả của nhiều nghiên cứu để rút ra một ước lượng chung.
    loai: dinh-nghia
    nguon:
      - cochrane-ch10
    trich: Meta-analysis is the statistical combination of results from two or more separate studies.
    ket_qua: da-sua
    vi_tri: Cochrane Handbook, chương 10, mục 10.2
    ghi_chu: 'Chữ cũ (viết mới, chưa có trong trang cũ): "Phân tích tổng hợp và tổng quan hệ thống là những bài gộp và đánh giá kết quả của nhiều nghiên cứu." Chữ mới chỉ giải thích phân tích tổng hợp vì chưa mở được nguồn bậc 2 định nghĩa tổng quan hệ thống (APA Dictionary không đọc được). Ví dụ gộp: Bond và DePaulo (2006), Cepeda và cộng sự (2006). Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): sai. Chữ trên trang đúng ý, nhưng nguồn của hồ sơ (bond2006, trích "We analyze the accuracy… synthesizing research results from 206 documents") chỉ là một ví dụ phân tích tổng hợp, không định nghĩa; cả hai lượt đều dẫn bài này. Loại dinh-nghia cần nguồn định nghĩa (mục 1). Đã mở Cochrane Handbook ch. 10 (cochrane.org, 30/10/2026): "Meta-analysis is the statistical combination of results from two or more separate studies." Chữ "gộp kết quả" thiếu ý "bằng thống kê", là chỗ phân biệt với tổng quan thường. Người gom (Claude Opus 5.5) sửa theo review: *Phân tích tổng hợp* là bài dùng thống kê gộp kết quả của nhiều nghiên cứu để rút ra một ước lượng chung. (nguồn: Cochrane Handbook, ch. 10, thay bond2006)'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.132.3.354" ]
    luot_2_ghi_chu: Ví dụ của định nghĩa phân tích tổng hợp.
    review: sai
  - id: n9
    cau: Tái lập là làm lại một nghiên cứu để xem có ra kết quả tương tự không.
    loai: dinh-nghia
    nguon:
      - osc2015
    trich: Direct replication is the attempt to recreate the conditions believed sufficient for obtaining a previously observed finding and is the means of establishing reproducibility of a finding with new data.
    ket_qua: dung
    vi_tri: OSC phần mở đầu (bản thảo tác giả, OSF)
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1126/science.aac4716" ]
    luot_2_ghi_chu: Định nghĩa tái lập khớp cách dùng.
  - id: n10
    cau: Tái lập đăng ký trước là ghi câu hỏi và kế hoạch phân tích trước khi thấy kết quả, để tách điều được dự đoán khỏi điều chỉ giải thích sau khi đã thấy kết quả.
    loai: dinh-nghia
    nguon:
      - nosek2018
    trich: An effective solution is to define the research questions and analysis plan before observing the research outcomes-a process called preregistration. Preregistration distinguishes analyses and outcomes that result from predictions from those that result from postdictions.
    ket_qua: da-sua
    vi_tri: Tóm tắt
    ghi_chu: 'Chữ nháp (chưa đăng): "công bố kế hoạch trước khi thu dữ liệu, nên không thể chọn kết quả đẹp sau đó". Nosek (2018) nói "trước khi thấy kết quả" (kể cả với dữ liệu có sẵn) và không nói "không thể chọn"; viết lại cho đúng. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Nosek và cộng sự (2018) tóm tắt: "define the research questions and analysis plan before observing the research outcomes… distinguishes… predictions from… postdictions"; chữ trang bám sát. Lượt 2 dẫn DOI của Hagger 2016 (không phải nguồn định nghĩa) nên chỉ dựa được vào lượt 1.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1177/1745691616652873" ]
    luot_2_ghi_chu: Định nghĩa đăng ký trước chuẩn; chấp nhận.
    review: dung
  - id: n11
    cau: 'Ôn tập rải ra nhiều lần giúp nhớ lâu hơn học dồn: một phân tích tổng hợp lớn năm 2006 thấy kết quả này ở rất nhiều thí nghiệm.'
    loai: so-lieu
    nguon:
      - cepeda2006
    trich: This review found 839 assessments of distributed practice in 317 experiments located in 184 articles.
    ket_qua: da-sua
    vi_tri: Tóm tắt
    ghi_chu: 'Người gom (Claude Opus 5.5, 30/10/2026): bỏ hai con số 839 và 317 (nghiên cứu có trang nhà duong-cong-quen; nơi khác không thêm số), giữ link về nhà. Lượt 1: đọc toàn văn, "839 assessments … in 317 experiments". Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Trang bỏ con số (Cepeda có trang nhà duong-cong-quen), còn "rất nhiều thí nghiệm"; đúng với 317 thí nghiệm trong tóm tắt.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.132.3.354" ]
    luot_2_ghi_chu: "Khớp: phân tích tổng hợp 2006, rất nhiều thí nghiệm."
    review: dung
  - id: n12
    cau: 'Ví dụ "Vững chắc": ôn tập rải ra nhiều lần giúp nhớ lâu hơn học dồn.'
    loai: nhan
    nguon:
      - cepeda2006
    trich: The fact that massed presentations are normally inferior even when retention interval is very short
    ket_qua: dung
    vi_tri: Mục Discussion
    nhan: vung-chac
    co_so:
      - cepeda2006
    ly_do: 'Có một phân tích tổng hợp chất lượng tốt (Psychological Bulletin; 839 lần đánh giá, 317 thí nghiệm, 184 bài), cùng chiều: giãn cách hơn dồn. Chưa mở được tái lập lớn nào thất bại. Giới hạn: bài chỉ gồm bài tập nhớ ngôn từ.'
    ghi_chu: 'chỗ khó: thước đo đòi "đúng ở nhiều nhóm người"; Cepeda gộp 184 bài nhiều tuổi nhưng không phân tích theo nền văn hóa; chưa đọc phân tích tổng hợp thứ hai (ví dụ Cepeda 2008 hay Carpenter 2012). Ví dụ minh họa; nhãn chính thức do trang nhà gắn. Người gom/lượt 2 cân nhắc. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Nhãn Vững chắc cho hiệu ứng giãn cách: có phân tích tổng hợp lớn (Cepeda 2006), cùng chiều, không có thất bại tái lập lớn đã biết, nhiều tuổi và chất liệu. Đạt mục 4. Giới hạn (chỉ nhớ ngôn từ) đúng là của Cepeda, không đổi nhãn. Ví dụ minh họa; trang nhà gắn nhãn chính thức.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.132.3.354" ]
    luot_2_ghi_chu: "Nhãn Vững chắc: có phân tích tổng hợp lớn, hướng nhất quán, nhiều quần thể; đạt mục 4 (chưa thấy thất bại tái lập lớn). Chỉ đọc tóm tắt."
    review: dung
  - id: n13
    cau: Kỳ vọng của giáo viên ảnh hưởng tới kết quả của học sinh; tổng quan 35 năm nghiên cứu cho thấy hiệu ứng có thật, nhưng thường nhỏ, không tích tụ nhiều theo thời gian, và có thể phai đi.
    loai: phat-hien
    nguon:
      - jussim2005
    trich: "This article shows that 35 years of empirical research on teacher expectations justifies the following conclusions: (a) Self-fulfilling prophecies in the classroom do occur, but these effects are typically small, they do not accumulate greatly across perceivers or over time, and they may be more likely to dissipate than accumulate"
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Người gom (Claude Opus 5.5, 30/10/2026): đổi ví dụ của khung Khá vững. Ví dụ cũ (Loftus và Palmer, 1974) không mở được bài gốc và câu "chưa có tái lập lớn" chỉ có nguồn bậc 3 (blog Zwaan, 9/2025), trong khi có dấu hiệu một bản tái lập đang làm. Ví dụ mới khớp khung Khá vững của trang nhà (thi-nghiem/pygmalion ở site cũ: "kỳ vọng của giáo viên ảnh hưởng kết quả học sinh, nhưng hiệu ứng nhỏ và có điều kiện"). Chỉ một câu, không con số của nghiên cứu Rosenthal và Jacobson; link về trang nhà. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): sai. Đọc tóm tắt Jussim và Harber (2005) qua Crossref (30/10/2026): "these effects are typically small, they do not accumulate greatly… and they may be more likely to dissipate than accumulate". Trang viết "thường nhỏ và hay phai đi hơn là tích tụ": "hay phai đi" thành khẳng định chắc, bài gốc chỉ nói "may be more likely". Phần còn lại đúng. Người gom (Claude Opus 5.5) sửa theo review: Tổng quan 35 năm nghiên cứu cho thấy hiệu ứng này có thật, nhưng thường nhỏ, không tích tụ nhiều theo thời gian, và có thể phai đi.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3" ]
    luot_2_ghi_chu: "Jussim & Harber 2005: '35 years of empirical research' khớp từng ý."
    review: sai
  - id: n15
    cau: 'Ví dụ "Khá vững": kỳ vọng của giáo viên ảnh hưởng tới kết quả của học sinh.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - jussim2005
    nguon:
      - jussim2005
    trich: these effects are typically small, they do not accumulate greatly across perceivers or over time, and they may be more likely to dissipate than accumulate; … (d) teacher expectations may predict student outcomes more because these expectations are accurate than because they are self-fulfilling
    vi_tri: Tóm tắt
    ly_do: "Nhiều nghiên cứu cùng chiều trong 35 năm (hiệu ứng có thật), nhưng hiệu ứng nhỏ, không tích tụ, và một phần liên hệ có thể do kỳ vọng chính xác chứ không phải tự ứng nghiệm: kết quả khác nhau theo điều kiện, nên Khá vững theo mục 4 (chưa đủ để Vững chắc, không phải Đang tranh cãi vì bằng chứng không mâu thuẫn về sự tồn tại của hiệu ứng)."
    ket_qua: da-sua
    ghi_chu: "Người gom (Claude Opus 5.5, 30/10/2026): thay n16 cũ (nhãn của ví dụ Loftus và Palmer). Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Khá vững theo mục 4: nhiều nghiên cứu cùng chiều, hiệu ứng nhỏ, khác nhau theo điều kiện (Jussim và Harber 2005: mạnh hơn ở nhóm bị kỳ thị; một phần do kỳ vọng chính xác). Không phải Đang tranh cãi vì sự tồn tại của hiệu ứng không bị mâu thuẫn. Khớp khung Khá vững của trang nhà thi-nghiem/pygmalion ở site cũ."
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3" ]
    luot_2_ghi_chu: "Nhãn Khá vững hợp: nhiều nghiên cứu cùng chiều, hiệu ứng nhỏ, chưa có tái lập lớn."
    review: dung
  - id: n17
