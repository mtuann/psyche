    ghi_chu: 'Thêm vào trang (trang cũ chưa có con số này; có trong thẻ ngộ nhận phong-cach-hoc). Nghiên cứu có trang nhà kham-pha/tri-nho/phong-cach-hoc: người gom xem có nên rút con số này về trang nhà (nơi khác chỉ một câu, không thêm số mới). Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Crossref (30/10/2026): "Drawing on 17 meta-analyses… studies testing the matching hypothesis (effect size d = .04)". Hattie 2025 không có hồ sơ nghiên cứu trong nghien-cuu.yml nên con số không trái luật trang nhà; người gom có thể rút về trang nhà phong-cach-hoc khi bài ấy lên.'
