    luot_2_nguon: [ "https://doi.org/10.1007/s10648-025-10002-w" ]
    luot_2_ghi_chu: "Hattie & O'Leary 2025 (Educ Psychol Rev). Chú ý: đây là tổng quan dựa trên 17 phân tích tổng hợp, không phải một phân tích tổng hợp mới; câu 'tổng hợp 17 phân tích tổng hợp' vẫn đúng."
