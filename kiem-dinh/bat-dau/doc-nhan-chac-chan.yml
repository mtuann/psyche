  - id: n2
    cau: Nhãn không nói một ý tưởng hay hay dở, thú vị hay nhàm chán; nó chỉ trả lời bằng chứng hiện có ủng hộ kết luận này mạnh đến đâu.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'chuan-kiem-dinh.md mục 4 ("Bốn nhãn của site... mức độ chắc chắn"); plans/lam-lai/README.md (câu hỏi của site). Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. chuan-kiem-dinh.md mục 4 (nhãn nói độ chắc của bằng chứng).'
    review: dung
  - id: n3
    cau: 'Nhãn nói về một khẳng định cụ thể, không về cả chủ đề: một bài có thể có khung "Vững chắc" cho hiệu ứng chính và khung "Đang tranh cãi" cho cách giải thích.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: "chuan-kiem-dinh.md mục 4, gạch đầu dòng thứ nhất (đã chép gần nguyên văn, thêm vào trang theo D2-L1). Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. chuan-kiem-dinh.md mục 4, gạch đầu thứ nhất."
    review: dung
  - id: n4
    cau: 'Thước đo "Vững chắc": ít nhất một phân tích tổng hợp hay tổng quan hệ thống chất lượng tốt, hoặc từ hai lần tái lập lớn có đăng ký trước, cùng chiều; không có thất bại tái lập lớn chưa được giải thích; đúng ở nhiều nhóm người.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đối chiếu từng điều kiện với chuan-kiem-dinh.md mục 4, hàng "Vững chắc": khớp. Thêm vào trang theo D2-L1. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Bảng trên trang so từng điều kiện với chuan-kiem-dinh.md mục 4: khớp.'
    review: dung
  - id: n5
    cau: 'Thước đo "Khá vững": nhiều nghiên cứu cùng chiều nhưng còn giới hạn (chưa có tái lập lớn, mẫu chủ yếu là người phương Tây, kết quả giữa các nghiên cứu khác nhau nhiều, nghi có thiên lệch xuất bản).'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đối chiếu với chuan-kiem-dinh.md mục 4, hàng "Khá vững": khớp, kể cả bốn giới hạn. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Khớp mục 4; phần giải thích "tạp chí ưu tiên kết quả có hiệu ứng" là chú giải, không thêm điều kiện.'
    review: dung
