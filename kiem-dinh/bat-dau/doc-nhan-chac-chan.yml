  - id: n18
    cau: Hai dự án tái lập lớn, đăng ký trước, với 2.141 và 3.531 người cho hiệu ứng cạn kiệt ý chí gần bằng 0.
    loai: tai-lap
    nguon:
      - hagger2016
      - vohs2021
    trich: Multiple laboratories (k = 23, total N = 2,141) ... the size of the ego-depletion effect was small with 95% confidence intervals (CIs) that encompassed zero (d = 0.04, 95% CI [-0.07, 0.15]. | a preregistered multilaboratory project (k = 36; N = 3,531) ... Confirmatory tests found a nonsignificant result (d = 0.06).
    ket_qua: da-lam-mem
    vi_tri: Tóm tắt của cả hai bài
    ghi_chu: 'Chữ cũ: "Hai dự án tái lập với 2.141 và 3.531 người cho hiệu ứng gần bằng 0, nhưng những người ủng hộ cho rằng cách thử nghiệm chưa phù hợp." Chữ mới bỏ vế sau (không mở được nguồn nào nói điều ấy: bài phản hồi Baumeister và Vohs 2016 chỉ thấy tiêu đề, không có tóm tắt) và thêm "lớn, đăng ký trước" (cả hai bài nói rõ). Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Crossref (30/10/2026): Vohs 2021 "k = 36; N = 3,531… Confirmatory tests found a nonsignificant result (d = 0.06)"; Hagger 2016 N = 2.141, d = 0,04 (hai lượt). "Gần bằng 0" đúng cho phân tích xác nhận. Không có trang nhà trong nghien-cuu.yml nên con số được phép.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1177/1745691616652873", "https://doi.org/10.1177/0956797621989733" ]
    luot_2_ghi_chu: Cả hai đăng ký trước, khớp N. Gần 0 đúng cho phân tích xác nhận (d=0,04 và 0,06); phân tích thăm dò toàn mẫu của bài 2021 cho d=0,08 có ý nghĩa thống kê, trang có thể nhắc.
    review: dung
  - id: n19
    cau: 'Ví dụ "Đang tranh cãi": hiệu ứng cạn kiệt ý chí.'
    loai: nhan
    nguon:
      - hagger2016
      - vohs2021
    trich: the size of the ego-depletion effect was small with 95% confidence intervals (CIs) that encompassed zero | preregistered analyses did not find evidence for a depletion effect
    ket_qua: dung
    vi_tri: Tóm tắt của cả hai bài
    nhan: tranh-cai
    co_so:
      - hagger2016
      - vohs2021
    ly_do: 'Hai tái lập lớn đăng ký trước (23 phòng thí nghiệm, 2.141 người; 36 phòng thí nghiệm, 3.531 người) không thấy hiệu ứng; theo thước đo mục 4 đó là "một tái lập lớn đăng ký trước thất bại", và hiệu ứng nhỏ hơn nhiều so với tuyên bố ban đầu (phân tích tổng hợp trước đó từng thấy cỡ trung bình). Chưa xếp "Đã bị bác bỏ": trong tái lập năm 2021, phân tích thăm dò trên toàn mẫu cho hiệu ứng rất nhỏ (d = 0,08) có ý nghĩa thống kê, và phân tích Bayes cho hai giả thuyết gần như ngang nhau (Vohs và cộng sự, 2021, tóm tắt; theo review D2-L1).'
    ghi_chu: 'chỗ khó: hai tái lập cùng chiều có thể đáng xếp "Đã bị bác bỏ" theo "các kiểm tra đủ mạnh liên tục thất bại". Site cũ và thẻ ngộ nhận (ngo-nhan.yml) dùng "Đang tranh cãi", giữ nhất quán; người gom/lượt 2 quyết. Vế "tranh luận còn tiếp" chưa có nguồn đã mở (xem n18). Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Đang tranh cãi đạt mục 4 (tái lập lớn đăng ký trước thất bại; hiệu ứng nhỏ hơn nhiều so với ban đầu). Hai tái lập thất bại đã sát mức "Đã bị bác bỏ" (mục 4: kiểm tra đủ mạnh liên tục thất bại), nhưng tóm tắt Vohs 2021 có lý do để chưa bác bỏ: phân tích thăm dò toàn mẫu d = 0,08 có ý nghĩa, Bayes "about equally likely", hiệu ứng lớn hơn ở người mệt. Đề nghị sửa ly_do: thay vế "các nguồn cho rằng tranh luận về phương pháp còn tiếp" (chưa có nguồn) bằng ý này của Vohs 2021; nhất quán với ngo-nhan.yml.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1177/1745691616652873", "https://doi.org/10.1177/0956797621989733" ]
    luot_2_ghi_chu: "Nhãn Đang tranh cãi hợp: tái lập lớn đăng ký trước thất bại, còn phe ủng hộ phản biện (mục 4)."
    review: dung
