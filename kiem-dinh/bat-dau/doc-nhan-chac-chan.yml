nhan_dinh:
  - id: n1
    cau: Mỗi kết luận quan trọng trên Psyche được gắn một trong bốn nhãn.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'AGENTS.md, Quy tắc nội dung: "Mọi kết luận quan trọng có một trong bốn nhãn". Chữ cũ "Psyche Zero" đổi thành "Psyche". Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. AGENTS.md, Quy tắc nội dung.'
