    ghi_chu: 'Nhất quán với thẻ ngộ nhận phong-cach-hoc (nhan bac-bo). Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Đã bị bác bỏ đạt điều kiện thứ nhất của mục 4 (Pashler 2008; Hattie 2025: "overwhelming evidence discrediting the matching hypothesis", d = 0,04). Có một phân tích tổng hợp 2024 (Clinton-Lisell và Litzinger, lượt 2 dẫn) thấy g = 0,31 nhưng tác giả vẫn kết luận lợi ích quá nhỏ và hiếm; không đủ để hạ xuống Đang tranh cãi ở trang ví dụ. Trang nhà kham-pha/tri-nho/phong-cach-hoc nên nhắc bài 2024 khi lên.'
