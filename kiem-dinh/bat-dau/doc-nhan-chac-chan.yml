nhan_dinh:
  - id: n1
    cau: Mỗi kết luận quan trọng trên Psyche được gắn một trong bốn nhãn.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'AGENTS.md, Quy tắc nội dung: "Mọi kết luận quan trọng có một trong bốn nhãn". Chữ cũ "Psyche Zero" đổi thành "Psyche".'
    review: null
  - id: n2
    cau: Nhãn không nói một ý tưởng hay hay dở, thú vị hay nhàm chán; nó chỉ trả lời bằng chứng hiện có ủng hộ kết luận này mạnh đến đâu.
    loai: ve-site
    ket_qua: dung
    ghi_chu: chuan-kiem-dinh.md mục 4 ("Bốn nhãn của site... mức độ chắc chắn"); plans/lam-lai/README.md (câu hỏi của site).
    review: null
  - id: n3
    cau: 'Nhãn nói về một khẳng định cụ thể, không về cả chủ đề: một bài có thể có khung "Vững chắc" cho hiệu ứng chính và khung "Đang tranh cãi" cho cách giải thích.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: chuan-kiem-dinh.md mục 4, gạch đầu dòng thứ nhất (đã chép gần nguyên văn, thêm vào trang theo D2-L1).
    review: null
  - id: n4
    cau: 'Thước đo "Vững chắc": ít nhất một phân tích tổng hợp hay tổng quan hệ thống chất lượng tốt, hoặc từ hai lần tái lập lớn có đăng ký trước, cùng chiều; không có thất bại tái lập lớn chưa được giải thích; đúng ở nhiều nhóm người.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đối chiếu từng điều kiện với chuan-kiem-dinh.md mục 4, hàng "Vững chắc": khớp. Thêm vào trang theo D2-L1.'
    review: null
  - id: n5
    cau: 'Thước đo "Khá vững": nhiều nghiên cứu cùng chiều nhưng còn giới hạn (chưa có tái lập lớn, mẫu chủ yếu là người phương Tây, kết quả giữa các nghiên cứu khác nhau nhiều, nghi có thiên lệch xuất bản).'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đối chiếu với chuan-kiem-dinh.md mục 4, hàng "Khá vững": khớp, kể cả bốn giới hạn.'
    review: null
  - id: n6
    cau: 'Thước đo "Đang tranh cãi": bằng chứng chất lượng cao mâu thuẫn; hoặc một tái lập lớn đăng ký trước thất bại; hoặc hiệu ứng nhỏ hơn nhiều so với tuyên bố ban đầu.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đối chiếu với chuan-kiem-dinh.md mục 4, hàng "Đang tranh cãi": khớp ba điều kiện.'
    review: null
  - id: n7
    cau: 'Thước đo "Đã bị bác bỏ": các kiểm tra đủ mạnh liên tục thất bại; hoặc bằng chứng gốc không còn giá trị (bài bị rút, gian lận, lỗi phân tích).'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Đối chiếu với chuan-kiem-dinh.md mục 4, hàng "Đã bị bác bỏ": khớp. Sửa khung có tiêu đề "Đã bị bác bỏ hoặc không tái lập được": bỏ tiêu đề tùy biến, ý chính là hai điều kiện của thước đo.'
    review: null
  - id: n8
    cau: Phân tích tổng hợp là bài gộp kết quả của nhiều nghiên cứu để rút ra một kết luận chung.
    loai: dinh-nghia
    nguon:
      - bond2006
    trich: We analyze the accuracy of deception judgments, synthesizing research results from 206 documents and 24,483 judges.
    ket_qua: da-sua
    vi_tri: Tóm tắt (Bond và DePaulo là một phân tích tổng hợp)
    ghi_chu: 'Chữ cũ (viết mới, chưa có trong trang cũ): "Phân tích tổng hợp và tổng quan hệ thống là những bài gộp và đánh giá kết quả của nhiều nghiên cứu." Chữ mới chỉ giải thích phân tích tổng hợp vì chưa mở được nguồn bậc 2 định nghĩa tổng quan hệ thống (APA Dictionary không đọc được). Ví dụ gộp: Bond và DePaulo (2006), Cepeda và cộng sự (2006).'
  - id: n9
    cau: Tái lập là làm lại một nghiên cứu để xem có ra kết quả tương tự không.
    loai: dinh-nghia
    nguon:
      - osc2015
    trich: Direct replication is the attempt to recreate the conditions believed sufficient for obtaining a previously observed finding and is the means of establishing reproducibility of a finding with new data.
    ket_qua: dung
    vi_tri: OSC phần mở đầu (bản thảo tác giả, OSF)
  - id: n10
    cau: Tái lập đăng ký trước là ghi câu hỏi và kế hoạch phân tích trước khi thấy kết quả, để tách điều được dự đoán khỏi điều chỉ giải thích sau khi đã thấy kết quả.
    loai: dinh-nghia
    nguon:
      - nosek2018
    trich: An effective solution is to define the research questions and analysis plan before observing the research outcomes-a process called preregistration. Preregistration distinguishes analyses and outcomes that result from predictions from those that result from postdictions.
    ket_qua: da-sua
    vi_tri: Tóm tắt
    ghi_chu: 'Chữ nháp (chưa đăng): "công bố kế hoạch trước khi thu dữ liệu, nên không thể chọn kết quả đẹp sau đó". Nosek (2018) nói "trước khi thấy kết quả" (kể cả với dữ liệu có sẵn) và không nói "không thể chọn"; viết lại cho đúng.'
  - id: n11
    cau: 'Ôn tập rải ra nhiều lần giúp nhớ lâu hơn học dồn: một phân tích tổng hợp năm 2006 gộp 839 lần đánh giá từ 317 thí nghiệm.'
    loai: so-lieu
    nguon:
      - cepeda2006
    trich: This review found 839 assessments of distributed practice in 317 experiments located in 184 articles.
    ket_qua: da-sua
    vi_tri: Tóm tắt
    ghi_chu: 'Chữ cũ: "839 phép so sánh từ 317 thí nghiệm". Chữ mới: "839 lần đánh giá" (bài gốc: "assessments"). Đọc toàn văn. Nghiên cứu có trang nhà duong-cong-quen: đã thêm link về nhà. Hai con số này sẽ chỉ còn ở trang nhà khi lô sau gỡ trùng; ở đây giữ vì đã có trên trang cũ.'
  - id: n12
    cau: 'Ví dụ "Vững chắc": ôn tập rải ra nhiều lần giúp nhớ lâu hơn học dồn.'
    loai: nhan
    nguon:
      - cepeda2006
    trich: The fact that massed presentations are normally inferior even when retention interval is very short
    ket_qua: dung
    vi_tri: Mục Discussion
    nhan: vung-chac
    co_so:
      - cepeda2006
    ly_do: 'Có một phân tích tổng hợp chất lượng tốt (Psychological Bulletin; 839 lần đánh giá, 317 thí nghiệm, 184 bài), cùng chiều: giãn cách hơn dồn. Chưa mở được tái lập lớn nào thất bại. Giới hạn: bài chỉ gồm bài tập nhớ ngôn từ.'
    ghi_chu: 'chỗ khó: thước đo đòi "đúng ở nhiều nhóm người"; Cepeda gộp 184 bài nhiều tuổi nhưng không phân tích theo nền văn hóa; chưa đọc phân tích tổng hợp thứ hai (ví dụ Cepeda 2008 hay Carpenter 2012). Ví dụ minh họa; nhãn chính thức do trang nhà gắn. Người gom/lượt 2 cân nhắc.'
  - id: n13
    cau: Cách đặt câu hỏi ("đâm sầm" hay "đụng") làm thay đổi ước lượng tốc độ của nhân chứng.
    loai: phat-hien
    nguon:
      - zwaan2025
    trich: Those who were asked how fast the cars were going when they smashed into each other gave higher speed estimates than those asked how fast they were going when they merely hit.
    ket_qua: null
    vi_tri: Blog của Zwaan (kể lại Loftus và Palmer, 1974), đoạn mở đầu
    ghi_chu: 'chưa chắc: không mở được bài gốc Loftus và Palmer (1974, J Verbal Learning Verbal Behav 13, 585–589; ScienceDirect chặn bot); không tìm được bản mở ở nơi hợp lệ. Mới có nguồn bậc 3 kể lại (blog của một nhà phương pháp học). Chữ cũ: "đâm sầm" hay "va chạm"; chữ mới "đụng" (bài gốc có nhiều động từ: smashed, collided, bumped, hit, contacted; blog nói smashed và hit). Người gom quyết: lấy bài gốc, hay đổi ví dụ cho khung Khá vững.'
  - id: n14
    cau: Kết quả gốc của thí nghiệm đâm sầm/đụng phù hợp với hơn 30 năm nghiên cứu về trí nhớ sai.
    loai: phat-hien
    nguon:
      - loftus2005
    trich: The misinformation effect refers to the impairment in memory for the past that arises after exposure to misleading information. The phenomenon has been investigated for at least 30 years
    ket_qua: da-sua
    vi_tri: Tóm tắt
    ghi_chu: 'Chữ cũ: "phù hợp với rất nhiều nghiên cứu về trí nhớ sai". Chữ mới: "hơn 30 năm nghiên cứu" theo tóm tắt Loftus (2005). Chưa đọc toàn văn (PMC không lấy được).'
  - id: n15
    cau: Tính đến 10/2026, chúng tôi chưa thấy bản tái lập lớn nào của chính thí nghiệm đâm sầm/đụng được công bố.
    loai: thoi-su
    nguon:
      - zwaan2025
    trich: Strangely, though, the study has never been directly replicated at scale using modern methods.
    ket_qua: null
    vi_tri: Blog Zwaan, 8/9/2025, mục trước "A Large-Scale Replication"
    het_han: '2027-04-30'
    ghi_chu: 'chưa chắc: chỉ có một nguồn bậc 3 (blog cùng ngày 8/9/2025, tác giả đang đề xuất tái lập nên có lợi ích). Tìm thêm một lượt (10/2026) thấy một bản thảo eScholarship tái lập hai thí nghiệm 1.204 người và một bài đăng 4/10/2026 nói kế hoạch tái lập nhiều phòng thí nghiệm chưa có kết quả; chưa mở hai bài này nên không dùng. Chữ cũ: "chưa được làm lại ở quy mô lớn" (không mốc). Nếu có bản tái lập khác thì ví dụ phải đổi.'
  - id: n16
    cau: 'Ví dụ "Khá vững": ảnh hưởng của cách đặt câu hỏi lên ước lượng tốc độ của nhân chứng.'
    loai: nhan
    nguon:
      - loftus2005
      - zwaan2025
    trich: The phenomenon has been investigated for at least 30 years | the study has never been directly replicated at scale using modern methods.
    ket_qua: null
    vi_tri: Tóm tắt Loftus; blog Zwaan
    nhan: kha-vung
    co_so:
      - loftus2005
      - zwaan2025
    ly_do: Nhiều nghiên cứu cùng chiều (30 năm về hiệu ứng thông tin sai lệch), nhưng chưa có tái lập lớn của chính thí nghiệm và mẫu gốc nhỏ, nên Khá vững theo mục 4. Phụ thuộc n13 và n15.
    ghi_chu: 'chưa chắc: phụ thuộc n13, n15 (chưa mở bài gốc, nguồn bậc 3). Nếu không giải quyết được thì đổi ví dụ.'
  - id: n17
    cau: Thuyết "ý chí là nguồn lực có hạn, dùng nhiều sẽ cạn" (cạn kiệt ý chí).
    loai: dinh-nghia
    nguon:
      - hagger2016
    trich: Self-control is conceptualized as a limited resource that becomes depleted after a period of exertion resulting in self-control failure.
    ket_qua: dung
    vi_tri: Tóm tắt
  - id: n18
    cau: Hai dự án tái lập lớn, đăng ký trước, với 2.141 và 3.531 người cho hiệu ứng cạn kiệt ý chí gần bằng 0.
    loai: tai-lap
    nguon:
      - hagger2016
      - vohs2021
    trich: Multiple laboratories (k = 23, total N = 2,141) ... the size of the ego-depletion effect was small with 95% confidence intervals (CIs) that encompassed zero (d = 0.04, 95% CI [-0.07, 0.15]. | a preregistered multilaboratory project (k = 36; N = 3,531) ... Confirmatory tests found a nonsignificant result (d = 0.06).
    ket_qua: da-lam-mem
    vi_tri: Tóm tắt của cả hai bài
    ghi_chu: 'Chữ cũ: "Hai dự án tái lập với 2.141 và 3.531 người cho hiệu ứng gần bằng 0, nhưng những người ủng hộ cho rằng cách thử nghiệm chưa phù hợp." Chữ mới bỏ vế sau (không mở được nguồn nào nói điều ấy: bài phản hồi Baumeister và Vohs 2016 chỉ thấy tiêu đề, không có tóm tắt) và thêm "lớn, đăng ký trước" (cả hai bài nói rõ).'
  - id: n19
    cau: 'Ví dụ "Đang tranh cãi": hiệu ứng cạn kiệt ý chí.'
    loai: nhan
    nguon:
      - hagger2016
      - vohs2021
    trich: the size of the ego-depletion effect was small with 95% confidence intervals (CIs) that encompassed zero | preregistered analyses did not find evidence for a depletion effect
    ket_qua: dung
    vi_tri: Tóm tắt của cả hai bài
    nhan: tranh-cai
    co_so:
      - hagger2016
      - vohs2021
    ly_do: Hai tái lập lớn đăng ký trước (23 phòng thí nghiệm, 2.141 người; 36 phòng thí nghiệm, 3.531 người) không thấy hiệu ứng; theo thước đo mục 4 đó là "một tái lập lớn đăng ký trước thất bại", và hiệu ứng nhỏ hơn nhiều so với tuyên bố ban đầu (phân tích tổng hợp trước đó từng thấy cỡ trung bình). Chưa xếp "Đã bị bác bỏ" vì chưa có bằng chứng gốc rút bài hay gian lận, và các nguồn cho rằng tranh luận về phương pháp còn tiếp.
    ghi_chu: 'chỗ khó: hai tái lập cùng chiều có thể đáng xếp "Đã bị bác bỏ" theo "các kiểm tra đủ mạnh liên tục thất bại". Site cũ và thẻ ngộ nhận (ngo-nhan.yml) dùng "Đang tranh cãi", giữ nhất quán; người gom/lượt 2 quyết. Vế "tranh luận còn tiếp" chưa có nguồn đã mở (xem n18).'
  - id: n20
    cau: 'Dạy học khớp với "phong cách học" (nhìn, nghe, vận động) không giúp học tốt hơn: bài tổng quan năm 2008 gần như không thấy bằng chứng ủng hộ.'
    loai: tai-lap
    nguon:
      - pashler2008
    trich: we found virtually no evidence for the interaction pattern mentioned above, which was judged to be a precondition for validating the educational applications of learning styles.
    ket_qua: da-sua
    vi_tri: Tóm tắt
    ghi_chu: 'Chữ cũ: ví dụ chỉ nêu khẳng định, không có nguồn ở trang. Chữ mới thêm nguồn Pashler và cộng sự (2008): "gần như không thấy bằng chứng" cho kiểu tương tác cần có.'
  - id: n21
    cau: Tổng hợp 17 phân tích tổng hợp năm 2025 cho hiệu ứng gần bằng 0 (d = 0,04) ở các nghiên cứu kiểm tra đúng giả thuyết "dạy khớp phong cách học".
    loai: so-lieu
    nguon:
      - hattie2025
    trich: Drawing on 17 meta-analyses, we distinguish between studies testing the matching hypothesis (effect size d = .04) and correlational studies (average correlation r = .24)
    ket_qua: da-sua
    vi_tri: Tóm tắt (Crossref)
    ghi_chu: 'Thêm vào trang (trang cũ chưa có con số này; có trong thẻ ngộ nhận phong-cach-hoc). Nghiên cứu có trang nhà kham-pha/tri-nho/phong-cach-hoc: người gom xem có nên rút con số này về trang nhà (nơi khác chỉ một câu, không thêm số mới).'
