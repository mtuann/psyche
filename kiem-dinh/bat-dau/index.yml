nhan_dinh:
  - id: n1
    cau: Trong một khảo sát đại diện ở Mỹ (công bố năm 2011), 63% người được hỏi đồng ý rằng trí nhớ hoạt động như máy quay phim.
    loai: so-lieu
    nguon:
      - simons2011
    trich: 'We conducted a large representative telephone survey of the U.S. population to assess common beliefs about the properties of memory. Substantial numbers of respondents agreed with propositions that conflict with expert consensus: ... memory works like a video camera (63%)'
    ket_qua: dung
    vi_tri: Tóm tắt (chỉ đọc tóm tắt; con số 63% nằm ở tóm tắt)
    ghi_chu: 'Nghiên cứu có trang nhà (nghien-cuu.yml: simons2011, trang_nha kham-pha/chu-y-tri-giac/nhin-ma-khong-thay); ở đây chỉ một câu và link về nhà (đã thêm link). Trang nhà chưa có trên site: link hiện "sắp có".'
  - id: n2
    cau: Câu 1 (khi tức giận, đấm gối hay hét lên giúp bạn bớt giận) trái với bằng chứng hiện có.
    loai: phat-hien
    nguon:
      - bushman2002
      - kjaervik2024
    trich: Rumination increased rather than decreased anger and aggression. Doing nothing at all was more effective than venting anger. These results directly contradict catharsis theory. | arousal-increasing activities were ineffective overall (g = -0.02, [-0.13, 0.09]) ... These findings do not support the ideas that venting anger or going for a run are effective anger management activities.
    ket_qua: dung
    vi_tri: 'Bushman: tóm tắt đầu bài; Kjærvik và Bushman: tóm tắt (154 nghiên cứu, 184 mẫu, 10.189 người)'
    ghi_chu: Thêm hai link nguồn vào đáp án (trang cũ không dẫn). Nguồn kiểm đấm bao cát; "hét lên" thuộc "venting anger" nói chung ở tóm tắt Kjærvik và Bushman. Cùng nguồn với thẻ ngộ nhận xa-gian.
  - id: n3
    cau: 'Câu 2 (trí nhớ giống cuốn băng ghi hình: ký ức có thể mờ đi nhưng không bị "sửa") trái với bằng chứng hiện có.'
    loai: phat-hien
    nguon:
      - loftus2005
      - simons2011
    trich: 'The misinformation effect refers to the impairment in memory for the past that arises after exposure to misleading information. The phenomenon has been investigated for at least 30 years | Substantial numbers of respondents agreed with propositions that conflict with expert consensus: ... memory works like a video camera (63%)'
    ket_qua: dung
    vi_tri: Tóm tắt của cả hai bài
    ghi_chu: Thêm link nguồn vào đáp án. Simons và Chabris xếp "máy quay phim" vào các niềm tin trái với đồng thuận của chuyên gia.
  - id: n4
    cau: Câu 3 (học rải ra nhiều buổi giúp nhớ lâu hơn học dồn trong một buổi) có bằng chứng khoa học ủng hộ.
    loai: phat-hien
    nguon:
      - cepeda2006
    trich: The fact that massed presentations are normally inferior even when retention interval is very short, as noted above, certainly seems consistent with this account.
    ket_qua: dung
    vi_tri: 'Mục Discussion, đoạn về thuyết xử lý thiếu (deficient processing); tóm tắt: 839 lần đánh giá, 317 thí nghiệm, 184 bài'
    ghi_chu: Cepeda chỉ gộp bài tập nhớ ngôn từ (verbal recall); câu của trang là chung. Đã đọc toàn văn. Có trang nhà duong-cong-quen. Thêm link nguồn vào đáp án.
  - id: n5
    cau: Tâm lý học là khoa học nghiên cứu tâm trí và hành vi.
    loai: dinh-nghia
    nguon:
      - os1-1
    trich: Psychology refers to the scientific study of the mind and behavior.
    ket_qua: dung
    vi_tri: Đoạn đầu mục 1.1
    ghi_chu: APA Dictionary (dictionary.apa.org) là ứng dụng một trang, công cụ đọc web không lấy được nội dung mục từ; dùng OpenStax. Không đổi chữ.
  - id: n6
    cau: 'Vì trực giác không đủ, tâm lý học dùng phương pháp khoa học: đặt câu hỏi rõ ràng, thu thập dữ liệu, so sánh có hệ thống, và chấp nhận khả năng mình sai.'
    loai: dinh-nghia
    nguon:
      - os1-1
      - os2-1
    trich: Psychologists use the scientific method to acquire knowledge. | Without it, we would be forced to rely solely on intuition, other people’s authority, and blind luck.
    ket_qua: da-lam-mem
    vi_tri: 1.1 đoạn đầu; 2.1 đoạn mở đầu
    ghi_chu: 'Chữ cũ: "Nó ra đời chính vì trực giác không đủ: muốn biết..." Chữ mới: "Vì trực giác không đủ, tâm lý học dùng phương pháp khoa học: muốn biết..." Lý do: "ra đời chính vì" là nhận định lịch sử không có nguồn; OpenStax chỉ nói phương pháp khoa học đối lập với trực giác, uy tín người nói và may rủi. Vế "chấp nhận khả năng mình sai" là diễn đạt lại việc giả thuyết được kiểm chứng và làm lại.'
  - id: n7
    cau: Tâm lý học khoa học dựa trên nghiên cứu có dữ liệu, được người khác kiểm tra và làm lại; "tâm lý học" đại chúng dựa trên kinh nghiệm cá nhân, câu chuyện, uy tín người nói.
    loai: dinh-nghia
    nguon:
      - os2-1
      - os1-1
    trich: In contrast to other methods that people use to understand the behavior of others, such as intuition and personal experience, the hallmark of scientific research is that there is evidence to support a claim. | Those results are then published or presented at research conferences so that others can replicate or build on the results.
    ket_qua: dung
    vi_tri: 2.1 đoạn về nghiên cứu khoa học; 1.1 đoạn đầu
    ghi_chu: Dòng đầu của bảng. Vế đại chúng là mô tả cách người ta thường dựa vào, khớp với "intuition, other people’s authority".
  - id: n8
    cau: Khi bằng chứng mới xuất hiện, kết luận của tâm lý học khoa học thay đổi theo; "tâm lý học" đại chúng không có cơ chế buộc phải sửa.
    loai: dinh-nghia
    nguon:
      - os1-1
      - nosek2022
    trich: A theory is the best understanding we have of that part of the natural world. | ... replication contributes to self-correction.
    ket_qua: da-lam-mem
    vi_tri: OpenStax 1.1; tóm tắt Nosek và cộng sự (2022)
    ghi_chu: 'Chữ cũ: ô đại chúng "Thường giữ nguyên". Chữ mới: "Không có cơ chế buộc phải sửa". Lý do: "thường" là nhận định về tần suất không có số liệu; chỉ còn điều đúng theo định nghĩa (khoa học có cơ chế làm lại và sửa, ngoài khoa học thì không buộc).'
  - id: n9
    cau: Tâm lý học khoa học nói rõ chắc đến đâu và áp dụng cho ai; "tâm lý học" đại chúng hay nói tuyệt đối ("luôn luôn", "100%").
    loai: dinh-nghia
    nguon:
      - henrich2010
      - osc2015
    trich: we need to be less cavalier in addressing questions of human nature on the basis of data drawn from this particularly thin, and rather unusual, slice of humanity.
    ket_qua: da-lam-mem
    vi_tri: Henrich và cộng sự, tóm tắt
    ghi_chu: 'chỗ khó: vế đại chúng chỉ là mô tả, không có số liệu. Chữ cũ: "Thường tuyệt đối". Chữ mới: "Hay nói tuyệt đối". Vế khoa học là chuẩn của site (Henrich đòi nói rõ áp dụng cho ai). Người gom quyết giữ hay bỏ hàng này.'
  - id: n10
    cau: Hiệu ứng giãn cách trong ghi nhớ là một ví dụ của tâm lý học khoa học.
    loai: phat-hien
    nguon:
      - cepeda2006
    trich: The term spacing effect refers to enhanced learning during spaced as compared with massed study episodes for a given item.
    ket_qua: dung
    vi_tri: Phần mở đầu
    ghi_chu: Ví dụ ở dòng cuối bảng; nghiên cứu có trang nhà duong-cong-quen.
  - id: n11
    cau: Mô hình tính cách Big Five là một ví dụ của tâm lý học khoa học.
    loai: phat-hien
    nguon:
      - os11-7
    trich: Another personality theory, called the Five Factor Model, effectively hits a middle ground, with its five factors referred to as the Big Five personality factors. It is the most popular theory in personality psychology today and the most accurate approximation of the basic personality dimensions (Funder, 2001).
    ket_qua: dung
    vi_tri: Mục 11.7
    ghi_chu: OpenStax dẫn Funder (2001) cho nhận xét "chính xác nhất"; trang chỉ dùng Big Five làm ví dụ khoa học.
  - id: n12
    cau: Cách nói "bạn thuộc kiểu não trái" không có bằng chứng ủng hộ.
    loai: phat-hien
    nguon:
      - nielsen2013
    trich: our data are not consistent with a whole-brain phenotype of greater "left-brained" or greater "right-brained" network strength across individuals.
    ket_qua: dung
    vi_tri: Tóm tắt (1.011 người, 7 đến 29 tuổi)
    ghi_chu: Cùng nguồn với thẻ ngộ nhận nao-trai-phai. Chỉ đọc tóm tắt.
  - id: n13
    cau: Ngay cả việc phát hiện nói dối, con người cũng chỉ đoán đúng khoảng 54% số lần, chỉ hơn tung đồng xu một chút.
    loai: so-lieu
    nguon:
      - bond2006
    trich: people achieve an average of 54% correct lie-truth judgments, correctly classifying 47% of lies as deceptive and 61% of truths as nondeceptive.
    ket_qua: dung
    vi_tri: Tóm tắt (206 tài liệu, 24.483 người phán đoán)
    ghi_chu: Con người trong bài là người phán đoán không được huấn luyện ("no special aids or training"). Cùng nguồn với thẻ ngộ nhận noi-doi-mat.
  - id: n14
    cau: Nhà tâm lý học không "nhìn là biết" bạn đang nghĩ gì.
    loai: dinh-nghia
    nguon:
      - os1-1
    trich: Scientists test that which is perceivable and measurable.
    ket_qua: dung
    vi_tri: Đoạn đầu mục 1.1
    ghi_chu: Diễn đạt lại việc tâm lý học là khoa học kiểm chứng được, không phải đọc suy nghĩ; Bond và DePaulo (n13) bổ sung cho việc phát hiện nói dối.
  - id: n15
    cau: 'Tâm lý học không chỉ là trị liệu: ngành còn nghiên cứu trí nhớ, tri giác, ngôn ngữ, sự phát triển của trẻ, hành vi nhóm, ra quyết định.'
    loai: dinh-nghia
    nguon:
      - os8-1
      - os5-1
      - os7-2
      - os9-1
      - os12-1
      - os7-3
    trich: Memory is the set of processes used to encode, store, and retrieve information over different periods of time | Perception refers to the way sensory information is organized, interpreted, and consciously experienced. | Language is a communication system | studying how humans change and grow from conception through childhood, adolescence, adulthood, and death | Social psychology examines how people affect one another | Explain some common roadblocks to effective problem solving and decision making
    ket_qua: dung
    vi_tri: 'Mỗi chương OpenStax: 8.1, 5.1, 7.2, 9.1, 12.1, 7.3'
    ghi_chu: Mỗi chủ đề là một chương của giáo trình; "trị liệu" là chương 16.
  - id: n16
    cau: Khoa học mô tả con người thường như thế nào; nó không tự đưa ra điều bạn nên sống ra sao, và các phát hiện là xu hướng trung bình, không phải định mệnh của từng người.
    loai: dinh-nghia
    nguon:
      - os1-1
    trich: Scientists test that which is perceivable and measurable. For example, the hypothesis that a bird sings because it is happy is not a hypothesis that can be tested
    ket_qua: dung
    vi_tri: Đoạn đầu mục 1.1
    ghi_chu: 'chỗ khó: OpenStax 1.1 nói khoa học chỉ kiểm điều đo được; vế "xu hướng trung bình, không phải định mệnh" là diễn giải không có câu trích trực tiếp. Chữ không đổi; người gom/lượt 2 xem lại.'
  - id: n17
    cau: Năm 2015, nhóm Open Science Collaboration gồm hàng trăm nhà nghiên cứu đã làm lại 100 nghiên cứu tâm lý học công bố năm 2008 trên ba tạp chí lớn.
    loai: tai-lap
    nguon:
      - osc2015
    trich: 'We pursued a quasi-random sample by defining the sampling frame as 2008 articles of three important psychology journals: Psychological Science (PSCI), Journal of Personality and Social Psychology (JPSP), and Journal of Experimental Psychology: Learning, Memory, and Cognition (JEP:LMC). | In total, 100 replications were completed by 270 contributing authors.'
    ket_qua: da-sua
    vi_tri: Mục Methods, "Sampling frame"; đoạn kết quả mẫu
    ghi_chu: 'Chữ cũ: "trên ba tạp chí hàng đầu". Chữ mới: "trên ba tạp chí lớn". Lý do: bài gốc gọi là "three important psychology journals". "Hàng trăm nhà nghiên cứu": 270 tác giả đóng góp. Nghiên cứu này chưa có hồ sơ nghien-cuu.yml.'
  - id: n18
    cau: Ở các nghiên cứu gốc, 97% có kết quả có ý nghĩa thống kê; khi làm lại, chỉ còn 36%.
    loai: so-lieu
    nguon:
      - osc2015
    trich: Ninety-seven percent of original studies had statistically significant results. Thirty-six percent of replications had statistically significant results
    ket_qua: dung
    vi_tri: Tóm tắt
  - id: n19
    cau: Độ lớn hiệu ứng trung bình khi làm lại chỉ còn khoảng một nửa so với bản gốc.
    loai: so-lieu
    nguon:
      - osc2015
    trich: Replication effects were half the magnitude of original effects, representing a substantial decline.
    ket_qua: dung
    vi_tri: Tóm tắt
  - id: n20
    cau: Kết quả này là một mốc của cái gọi là khủng hoảng tái lập.
    loai: lich-su
    nguon:
      - nosek2022
    trich: For psychology, the 2010s might be characterized as a decade of active confrontation. Systematic and multi-site replication projects assessed current understandings and observed surprising failures to replicate many published findings.
    ket_qua: da-lam-mem
    vi_tri: Tóm tắt
    ghi_chu: 'Chữ cũ: "Kết quả này mở ra cái gọi là khủng hoảng tái lập." Chữ mới: "là một mốc của". Lý do: "mở ra" nói quá; Nosek và cộng sự mô tả cả một thập niên 2010 với nhiều dự án tái lập, không riêng dự án này.'
  - id: n21
    cau: Một lần làm lại thất bại có thể do may rủi hoặc khác biệt về cách làm; mỗi nghiên cứu chỉ được làm lại một lần.
    loai: dinh-nghia
    nguon:
      - osc2015
