    moi: 'Khung Vững chắc: "khi được làm lại ở quy mô lớn, một phần đáng kể các phát hiện đã công bố không lặp lại được"; "Điều này bị chính các nhà tâm lý học phát hiện và công bố, bằng chính các phương pháp khoa học: đó là cách một khoa học thực nghiệm tự sửa sai."'
    ly_do: n34.
ghi_chu: 'Trang khung (chữ viết tay), kiểm như lõi. Mọi số liệu kiểm ở tóm tắt hay toàn văn bài gốc; OSC đọc bản thảo tác giả trên OSF (toàn văn). Dải "nghiên cứu then chốt" của OSC chưa có hồ sơ nghien-cuu.yml: người gom quyết có thêm hồ sơ không (hiện trang kể 3 con số, trang nhà chưa có).'
