    cau: Mỗi trang có một hồ sơ kiểm định (từng khẳng định, nguồn, câu trích, kết quả hai lượt, chỗ đã sửa và lý do); khi hồ sơ đủ, trang được khóa bằng dấu vân tay, và bản đăng lên site chỉ gồm trang đã khóa.
