    ghi_chu: 'plans/ben-vung/chuan-kiem-dinh.md mục 8, bốn trường hợp (lỗi được báo; nguồn thay đổi; tái lập mốc: bổ sung có anh_huong_nhan, hay từ 3 bổ sung; thay đổi cơ học). Chữ cũ: "khi bằng chứng mới làm đổi nhãn".'
