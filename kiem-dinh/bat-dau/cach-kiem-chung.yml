doi_chu:
  - cu: 'Mô tả: "...sau khi từng khẳng định được đối chiếu với nguồn qua hai lượt..."'
    moi: '"...sau khi các khẳng định được đối chiếu với nguồn (bài nền tảng qua hai lượt độc lập)..."'
    ly_do: Chỉ bài nền tảng đủ hai lượt (chuẩn mục 3).
  - cu: '"người làm", "một người khác", "người review", "một người nữa"'
    moi: '"bên làm lượt đầu", "một lượt độc lập khác", "một lượt review", "chủ site"'
    ly_do: Lượt 1, 2 và review do agent làm, chủ repo kiểm mẫu (chuẩn mục 3); chữ "người" sai.
  - cu: (không có)
    moi: Thêm "Trang chỉ có danh sách sinh từ dữ liệu đã khóa, hay chỉ có câu về chính site, được kiểm theo mức nhẹ hơn."
    ly_do: Chuẩn mục 3, hàng Khung.
  - cu: '"thêm thành bổ sung có ngày ở cuối bài"'
    moi: '"... vào đúng mục của bài"'
    ly_do: them-noi-dung.md mục 5.
  - cu: '"khi bằng chứng mới làm đổi nhãn"'
    moi: '"khi bằng chứng mới có thể làm đổi nhãn hay kết luận"'
    ly_do: Chuẩn mục 8 (tái lập mốc).
ghi_chu: 'Trang khung mới, toàn câu về chính site; không có nguồn ngoài. Đã đối chiếu từng câu với chuan-kiem-dinh.md và them-noi-dung.md. Người gom quyết: trang công khai mô tả lượt 1, 2 và review là "bên/lượt" (trung tính) vì thực tế do agent AI làm, chủ repo kiểm mẫu; có nên ghi rõ "AI" ở đây không (minh bạch với người đọc) là quyết định của chủ repo.'
