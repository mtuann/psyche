    ghi_chu: plans/ben-vung/chuan-kiem-dinh.md mục 3, bước 3 (review) và bước 4 (chủ repo kiểm mẫu, khoảng 5 nhận định mỗi lô). Chữ cũ "người review", "một người nữa".
