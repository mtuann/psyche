    loai: ve-site
    ket_qua: dung
    ghi_chu: "Người gom (Claude Opus 5.5, 30/10/2026): thêm để nói rõ ai làm các lượt (người đọc cần biết); khớp plans/lam-lai/loi-giao/README.md (model cho từng lượt) và các báo cáo lô."
