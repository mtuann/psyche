nhan_dinh:
  - id: n1
    cau: 'Mỗi trang của Psyche trả lời một câu hỏi: bằng chứng nói gì, và chắc chắn đến đâu; một trang chỉ lên site sau khi đi qua các bước kiểm chứng.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'AGENTS.md (đầu sổ tay) và plans/lam-lai/README.md (luật 1: chỉ trang đã khóa lên site thật). Trang công cụ, Hỗ trợ không có dạng "một câu hỏi": câu nói chung cho nội dung chính.'
    review: null
