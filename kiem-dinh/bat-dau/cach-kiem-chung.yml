    cau: Mọi câu có thể đúng hoặc sai (trong bài, bảng, khung nhãn, câu hỏi và lời giải thích, chữ trong hình, thông số của công cụ) đều được tách ra để kiểm.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'plans/ben-vung/chuan-kiem-dinh.md mục 1, đoạn đầu: khớp từng loại chỗ.'
    review: null
  - id: n3
    cau: 'Mỗi câu có loại riêng: phát hiện của nghiên cứu, con số, sự kiện lịch sử, định nghĩa, nhãn mức độ chắc chắn, lời khuyên, thông tin có thể đổi theo thời gian.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'plans/ben-vung/chuan-kiem-dinh.md mục 1, bảng loại: các loại phat-hien, so-lieu, lich-su, dinh-nghia, nhan, loi-khuyen, thoi-su có đủ; trang liệt kê bảy trong mười một loại (còn tai-lap, lam-sang, cong-cu, ve-site), không sai vì không nói "chỉ".'
    review: null
  - id: n4
    cau: Lời khuyên cũng là khẳng định về bằng chứng, nên cũng phải có nguồn như mọi câu khác.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'plans/ben-vung/chuan-kiem-dinh.md mục 1, "Khác opus: không có loại lời khuyên được miễn nguồn".'
    review: null
  - id: n5
    cau: 'Nguồn xếp ba bậc: nguồn gốc (bài báo của nghiên cứu được kể, báo cáo tái lập, tài liệu lưu trữ); tổng hợp và chuẩn (phân tích tổng hợp, tổng quan hệ thống, dự án tái lập lớn, hướng dẫn lâm sàng, sổ tay chẩn đoán, từ điển APA, giáo trình mở có bình duyệt); phổ thông (Wikipedia, báo, sách đại chúng) chỉ để tìm nguồn tốt hơn, không bao giờ là nguồn duy nhất.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'plans/ben-vung/chuan-kiem-dinh.md mục 2: ba bậc khớp. "Bậc 3 không dùng làm nguồn duy nhất cho nhận định nào" khớp "không bao giờ".'
    review: null
  - id: n6
    cau: Câu nói một nghiên cứu đã làm gì và thấy gì thì dựa vào bài gốc; câu nói về tình trạng bằng chứng hiện nay thì dựa vào các tổng hợp.
    loai: ve-site
    ket_qua: dung
