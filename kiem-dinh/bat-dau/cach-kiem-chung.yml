    ket_qua: da-sua
    ghi_chu: 'plans/ben-vung/chuan-kiem-dinh.md mục 3 (bảng mức theo tầng: lõi, mở rộng, khung; "kiem_lai_truoc 12–18 tháng") và mục 5 (chữ ký chuyên gia). Chữ thêm "trang chỉ có danh sách..." theo hàng "Khung".'
