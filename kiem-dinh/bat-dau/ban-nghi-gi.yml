nhan_dinh:
  - id: s1
    cau: 'Mô tả trang: 20 khẳng định quen thuộc về tâm trí; mỗi thẻ có giải thích và nguồn.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm trên src/content/docs/bat-dau/ban-nghi-gi.md (::cong-cu{ten="ngo-nhan" limit="20"}) và src/scripts/cong-cu/ngo-nhan.js (boThe cắt 20 thẻ; màn đáp án hiện giải thích và nguồn). Bản thật có ít hơn 20 thẻ khi chưa đủ 20 thẻ được khóa: trò chơi lấy mọi thẻ có.'
    review: dung
  - id: s2
    cau: Mỗi lượt 20 khẳng định; chọn Đúng, Sai hoặc Còn tranh cãi rồi xem bằng chứng.
    loai: ve-site
    ket_qua: dung
    ghi_chu: LUA_CHON và màn đáp án của src/scripts/cong-cu/ngo-nhan.js; luồng kiểm ở tests/trinh-duyet/kiem-cong-cu.mjs.
    review: dung
  - id: n1
    cau: Nhiều ngộ nhận ở đây được chính giáo viên và sinh viên tâm lý học tin.
    loai: phat-hien
    nguon:
      - dekker2012
      - newton2020
      - novakgeiger2023
    trich: 'Dekker 2012, Bảng 1: giáo viên Anh/Hà Lan tin "We only use 10% of our brain" 48%/46%, phong cách học 93%/96%; Newton & Salvi 2020: trung bình 89% nhà giáo dục tin phong cách học; Novak-Geiger 2023: "psychology students share the same most prevalent misconceptions" (116 sinh viên tâm lý ở Áo)'
    ket_qua: dung
    ghi_chu: Câu trang cũ "Nhiều câu ở đây được chính giáo viên và sinh viên tâm lý học tin." giữ nguyên; các thẻ phong cách học, 10% bộ não, não trái/phải đều có trong bộ thẻ.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.3389/fpsyg.2012.00429", "https://doi.org/10.3389/fpsyg.2017.01314", "https://doi.org/10.7717/peerj.13811" ]
    luot_2_ghi_chu: "Giáo viên: Dekker 2012, Macdonald 2017. Sinh viên tâm lý học: nghiên cứu ở sinh viên tâm lý Tây Ban Nha (PeerJ 2022) thấy vẫn còn tin một số ngộ nhận, nhiều câu ở mức 'không biết'."
  - id: s3
    cau: Không có điểm đỗ hay trượt; mục đích là thấy trực giác về tâm trí đáng kiểm tra lại.
    loai: ve-site
    ket_qua: dung
    ghi_chu: Câu về mục đích của trò chơi; màn tổng kết (ngo-nhan.js) chỉ báo số thẻ khớp, không đỗ/trượt.
    review: dung
  - id: s4
    cau: Link tới trang Ngộ nhận để đọc tất cả thẻ cùng lúc, kèm nhãn và nguồn.
