    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap2.htm" ]
    luot_2_ghi_chu: Câu nêu rõ là một cách nhìn, chưa phải kết quả nghiên cứu; không có nghiên cứu về 'chiến tranh phe phái' online được trích.
