    review: dung
  - id: q2a
    cau: Điều châm ngòi thù địch là một giải đấu với cúp và phần thưởng chỉ dành cho đội thắng, tức cạnh tranh có thắng có thua, không cần khác biệt có sẵn; nhóm nghiên cứu không xúi các em ghét nhau nhưng chủ động sắp đặt cuộc cạnh tranh, kể cả điều khiển kết quả môn cuối.
    loai: phat-hien
    nguon:
      - sherif1988
    trich: could be manipulated by the experimenters in a way to insure the transition of two intact group structures to Stage 3
    vi_tri: Chương 5 [p. 98, 100]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (giải thích): "Không cần xúi giục, cũng không cần khác biệt có sẵn: chia phe cộng cạnh tranh thắng-thua là đủ để định kiến mọc lên." Chữ mới: thêm câu về việc nhóm nghiên cứu chủ động sắp đặt. Lý do: "không cần xúi giục" dễ hiểu là nhóm nghiên cứu không can thiệp. Review (Claude Sonnet 5.5, 30/10/2026): dung. Chương 5 [p. 98, 100]: giải đấu cúp/thưởng; môn cuối do nhà nghiên cứu điều khiển. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap5.htm" ]
    review: dung
  - id: q3a
    cau: 'Mục tiêu chung cấp bách gồm các tình huống hấp dẫn mà không nhóm nào giải quyết được một mình: cùng kéo chiếc xe tải không nổ máy, cùng tìm chỗ hỏng nguồn nước, góp tiền chung thuê phim.'
    loai: phat-hien
    nguon:
      - sherif1988
    trich: the resources and energies of any single group will be inadequate for the attainment of the goal
    vi_tri: Chương 2 [p. 28]; chương 7
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cùng đẩy xe tải chết máy". Chữ mới: "cùng kéo chiếc xe tải không nổ máy". Lý do: như s8. Review (Claude Sonnet 5.5, 30/10/2026): dung. Chương 2, 7: xe tải không nổ máy (kéo bằng dây), mất nước, góp tiền thuê phim. Khớp s8.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap7.htm" ]
    review: dung
  - id: q3b
    cau: Điểm mấu chốt của mục tiêu chung cấp bách là buộc phải cần nhau; gặp gỡ xã giao không đủ.
    loai: lich-su
    nguon:
      - sherif1988
    trich: During the movie there was practically no exchange between groups.
    vi_tri: Chương 7 [p. 156–158]
    ket_qua: dung
    ghi_chu: Giải thích câu hỏi 3; "cùng đổ mồ hôi mới đủ" là hình ảnh.
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap7.htm" ]
  - id: q4a
    cau: 'Sau giai đoạn hòa giải, tỉ lệ chọn bạn ngoài nhóm tăng mạnh: Rattlers từ 6,4% lên 36,4%, Eagles từ 7,5% lên 23,2%.'
    loai: so-lieu
    nguon:
      - sherif1988
    trich: only 6.4 per cent of the Rattlers' choices were for Eagles; but by the end of Stage 3, 36.4 per cent ... from 7.5 per cent at the end of Stage 2 to 23.2 per cent
    vi_tri: Chương 7 [p. 187–188]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap7.htm" ]
  - id: q4b
    cau: Con số cho thấy thù địch dịu đi đáng kể sau các nhiệm vụ chung, nhưng bạn cùng nhóm vẫn được chọn nhiều hơn.
    loai: so-lieu
    nguon:
      - sherif1988
    trich: In-group choices 63 63.6 41 76.8
    vi_tri: Chương 7, Bảng 2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thù địch tan nhanh không kém lúc nó hình thành — hoàn cảnh dựng lên được thì hoàn cảnh cũng hóa giải được". Chữ mới: câu trên. Lý do: như e2. Review (Claude Sonnet 5.5, 30/10/2026): dung. Bảng 2 chương 7: chọn bạn ngoài nhóm tăng; bạn cùng nhóm 63,6% và 76,8%. Trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap7.htm" ]
    review: dung
  - id: q5a
    cau: Các em không biết mình là đối tượng nghiên cứu (nhà nghiên cứu đóng giả nhân viên trại) và bị cố tình đẩy vào căng thẳng và thù địch; phụ huynh chỉ được báo về một trại thí nghiệm nghiên cứu sự tương tác nhóm.
    loai: phat-hien
    nguon:
      - sherif1988
    trich: The announced purpose of the camp was the study of interaction in group activities within teams and between teams.
    vi_tri: Chương 3 [p. 61–63]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "... không có sự đồng ý, lại còn bị cố tình đẩy vào căng thẳng và thù địch." Chữ mới: bỏ "không có sự đồng ý", thêm vế phụ huynh. Lý do: s17. Review (Claude Sonnet 5.5, 30/10/2026): dung. Như s17: phụ huynh được báo trại thí nghiệm tương tác nhóm; các em không biết. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap3.htm", "https://psychclassics.yorku.ca/Sherif/chap5.htm" ]
    review: dung
  - id: q5b
    cau: 'Theo chuẩn mực hiện nay, thiết kế này rất khó được phê duyệt: đánh lừa trẻ em về việc chúng tham gia nghiên cứu cộng cố tình gây căng thẳng cho chúng.'
    loai: lich-su
    nguon:
      - sherif1988
    trich: without being aware that they are being observed
    vi_tri: Chương 3 [p. 56]
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "không thể được phê duyệt: lừa dối cộng không đồng ý cộng gây hại tâm lý cho trẻ em". Chữ mới: câu trên. Lý do: như s18; chỗ khó: chuẩn mực đạo đức chưa có nguồn mở được. Review (Claude Sonnet 5.5, 30/10/2026): dung. Như s18: nhận định chuẩn mực, trang dùng "rất khó".'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap3.htm" ]
    luot_2_ghi_chu: Xem s18.
    review: dung
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: (không có)
    moi: 'Hộp hồ sơ nghiên cứu (:::ho-so-nghien-cuu): Tác giả, năm; Người tham gia; Thiết kế; Kết quả chính'
    ly_do: Bố cục C (kế hoạch).
  - cu: để xem thù địch giữa các nhóm nảy sinh và tan biến ra sao
    moi: để xem thù địch giữa các nhóm nảy sinh và dịu đi ra sao
    ly_do: e2.
  - cu: bạn 12 tuổi; dù hai đội được chia hoàn toàn ngẫu nhiên
    moi: bạn 11 tuổi; dù hai đội được xếp sao cho tương đương nhau ngay từ đầu
    ly_do: t2, t3.
  - cu: thù địch giữa các nhóm không cần đến khác biệt ... sẽ tự mọc lên như cỏ dại; có thể làm tan thù địch nhanh không kém
    moi: không nhất thiết cần đến khác biệt ... Ở trại hè này, ... đã mọc lên rất nhanh; có thể làm thù địch dịu đi đáng kể
    ly_do: e1, e2.
  - cu: 22 bé trai 11–12 tuổi ... ghép cặp tương đồng về IQ, hạnh kiểm và năng khiếu thể thao, rồi chia ngẫu nhiên thành hai nhóm 11 em; tại Công viên Bang Robbers Cave
    moi: 22 bé trai khoảng 11 tuổi ... xếp thành hai nhóm 11 em càng tương đương nhau càng tốt về chiều cao, cân nặng, ... tung đồng xu; tại một trại Hướng đạo nằm trong Công viên Bang Robbers Cave
    ly_do: s1–s3.
  - cu: đặt tên ..., vẽ cờ, bầu thủ lĩnh; hai nhóm "tình cờ" biết đến nhau
    moi: đặt tên ..., chọn vào những ngày cuối giai đoạn), có cờ, và thủ lĩnh dần nổi lên; hai nhóm biết đến sự có mặt của nhau
    ly_do: s6, s7.
  - cu: xe tải chở đồ tiếp tế chết máy giữa đường cần tất cả cùng đẩy
    moi: xe tải chở thức ăn không nổ máy (do nhóm nghiên cứu sắp đặt), các em cùng kéo xe bằng chính sợi dây kéo co
    ly_do: s8, q3a.
  - cu: cả hai nhóm gán cho nhau đúng cùng một bộ tính xấu ("bọn nó chơi bẩn")
    moi: cả hai nhóm đánh giá nhóm kia kém hơn hẳn nhóm mình, với những tính xấu như lén lút, tự cao, đáng ghét (sneaky, smart alecks, stinkers)
    ly_do: s12.
  - cu: ranh giới "phe ta phe địch" gần như biến mất
    moi: ranh giới "phe ta phe địch" mờ đi nhiều (dù phần lớn lựa chọn bạn vẫn dành cho bạn cùng nhóm)
    ly_do: s15.
  - cu: 'không hề được hỏi ý kiến ... Theo chuẩn mực đạo đức ngày nay, đây là vi phạm rõ ràng: lừa dối ..., không có sự đồng ý ...'
    moi: không hề được báo rằng mình là đối tượng nghiên cứu. Phụ huynh được báo ... rồi cho phép con tham gia; ... Ngày nay, một thiết kế như vậy rất khó được hội đồng đạo đức phê duyệt
    ly_do: s17, s18.
  - cu: Đầu thập niên 1970, ... rơi vào cạnh tranh và định kiến — đúng như Sherif đã mô tả
    moi: Năm 1971, ... rơi vào nghi kỵ và thù địch; theo Aronson, môi trường lớp học cạnh tranh đã làm nó trầm trọng thêm — gần với điều Sherif mô tả
    ly_do: a0, a1.
  - cu: giảm định kiến và rập khuôn, quý mến bạn khác nhóm hơn, tự tin hơn, thích đi học hơn, nghỉ học ít hơn và đạt điểm cao hơn trong các bài kiểm tra chuẩn hóa. Một nguyên lý ... được dùng rộng rãi đến tận hôm nay
    moi: Theo Aronson và cộng sự (1978) và trang giới thiệu của chính Aronson, ... giảm xung đột chủng tộc, thích đi học hơn, nghỉ học ít hơn và đạt điểm kiểm tra tốt hơn. Nhưng các thử nghiệm về sau cho kết quả không nhất quán ... bằng chứng về hiệu quả của nó còn lẫn lộn
    ly_do: a3–a6.
  - cu: :::vung-chac[cạnh tranh về nguồn lực có hạn sinh ra thù địch giữa các nhóm] ... chia nhóm tùy tiện ... được nhiều nghiên cứu về quan hệ giữa các nhóm ủng hộ
    moi: :::kha-vung[cạnh tranh về nguồn lực có hạn làm tăng thù địch giữa các nhóm] ... phân tích tổng hợp 95 mẫu của Riek, Mania và Gaertner (2006) ... Vì vậy nhãn dừng ở "khá vững"
    ly_do: nk1 (đổi nhãn).
  - cu: về gần như hòa thuận, và kỹ thuật lớp học jigsaw cho thấy nguyên lý này dùng được ngoài đời thực
    moi: về gần hơn rõ rệt (dù bạn cùng nhóm vẫn được chọn nhiều hơn). Phân tích tổng hợp 515 nghiên cứu của Pettigrew và Tropp (2006) ... jigsaw ... kết quả không nhất quán
    ly_do: nk2.
  - cu: trước phiên bản thành công năm 1954, nhóm Sherif đã thử hai lần và cả hai đều "trật kịch bản" ... Các nhà phê bình cho rằng thù địch ... "sản xuất" nhiều hơn là "phát hiện"
    moi: theo chính báo cáo của nhóm Sherif, lần thử năm 1953 phải dừng giữa chừng ... Vì vậy khó nói thù địch được "phát hiện" hay phần nào đã được "sản xuất" bởi hoàn cảnh sắp đặt
    ly_do: nk1c, nt2.
  - cu: 'chỉ riêng việc gọi một nhóm là "phe ta" đã đủ khiến người ta ưu ái người cùng phe. Robbers Cave cho thấy bước tiếp theo: thêm cạnh tranh, thiên vị sẽ nở thành thù địch.'
    moi: 'nhiều thí nghiệm với nhóm nhân tạo cho thấy riêng việc phân người ta thành nhóm đã đủ gây thiên vị người cùng nhóm (Mullen, Brown và Smith, 1992). Robbers Cave cho thấy một bước tiếp theo: thêm cạnh tranh, thiên vị đã nở thành thù địch.'
    ly_do: l3.
  - cu: 'Tiếp xúc đơn thuần chưa đủ: ... chỉ "gặp nhau cho vui" không làm giảm thù địch, thậm chí có thể làm tệ hơn.'
    moi: 'Tiếp xúc đơn thuần chưa đủ khi đang thù địch: ở Robbers Cave, các buổi gặp nhau "cho vui" ... không làm giảm thù địch, có buổi còn thành ném đồ ăn vào nhau. ... (Phân tích tổng hợp của Pettigrew và Tropp ...)'
    ly_do: l4.
  - cu: 'hãy tạo một việc chung cấp bách ...: một deadline chung, một đối thủ chung, một dự án chung. Lao động chung xóa ranh giới nhanh hơn lời nói.'
    moi: 'Gợi ý rút ra từ Robbers Cave (chưa được kiểm chứng ở công sở hay nhóm bạn): ... tạo một việc chung mà không bên nào làm nổi một mình, như một dự án chung. ...'
    ly_do: ap1.
  - cu: hệ thống xếp hạng, thưởng ... chính là phiên bản văn phòng của giải đấu ... nó đẻ ra bè phái. Muốn hợp tác, hãy thiết kế mục tiêu chung cho cả đội.
    moi: hệ thống thưởng kiểu "đội này thắng thì đội kia thua" giống giải đấu ở Robbers Cave. Việc nó có sinh ra bè phái ở công sở hay không thì thí nghiệm này không kiểm tra; đây mới là suy luận.
    ly_do: ap2.
  - cu: vận hành đúng công thức của Sherif ... Nhận ra công thức giúp ta bớt bị cuốn vào.
    moi: có thể được hiểu qua công thức của Sherif ..., nhưng đó là một cách nhìn, chưa phải kết quả nghiên cứu.
    ly_do: ap3.
  - cu: 'đầu thập niên 1950; Điều có thể nói một cách thận trọng: văn hóa Việt Nam đề cao tinh thần tập thể và hòa khí, ...'
    moi: 'năm 1954; Tính đến 10/2026, chúng tôi chưa tìm thấy ...; Không có dữ liệu thì không đoán mò: chúng tôi không có cơ sở để nói ...'
    ly_do: v1–v3.
  - cu: Các em được chọn ngẫu nhiên và ghép cặp tương đồng — không em nào "hiếu chiến bẩm sinh". Thù địch là sản phẩm của hoàn cảnh cạnh tranh, không phải bản chất.
    moi: Các em được chọn kỹ — ổn định ở trường và ở nhà, loại hết những em bị coi là "có vấn đề" — và được xếp thành hai nhóm tương đương nhau. Thù địch xuất hiện khi hai nhóm bị đặt vào cạnh tranh, không phải vì có em nào "hiếu chiến bẩm sinh".
    ly_do: g1.
  - cu: Sai, và nguy hiểm. Tiếp xúc khi còn đang cạnh tranh có thể đổ thêm dầu vào lửa. ...
    moi: Không hẳn. Ở Robbers Cave, tiếp xúc khi còn đang cạnh tranh không làm dịu mà có lúc đổ thêm dầu vào lửa. ... (Nhìn rộng hơn, tiếp xúc giữa các nhóm thường vẫn làm giảm định kiến, nhất là khi có những điều kiện tốt.)
    ly_do: g2.
  - cu: thù địch có thể đảo ngược — hoàn cảnh dựng lên được thì hoàn cảnh cũng hóa giải được
    moi: thù địch có thể dịu đi — hoàn cảnh dựng lên được thì hoàn cảnh cũng làm dịu được
    ly_do: g3.
  - cu: Không. Các em không hề biết mình là đối tượng nghiên cứu ... sẽ không qua được bất kỳ hội đồng đạo đức nào.
    moi: Phụ huynh cho phép con đi trại, nhưng các em không hề biết mình là đối tượng nghiên cứu ... rất khó được hội đồng đạo đức phê duyệt.
    ly_do: g4.
  - cu: '(quiz) Thứ tự này quan trọng ...; Không cần xúi giục, cũng không cần khác biệt có sẵn ...; cùng đẩy xe tải chết máy; thù địch tan nhanh không kém lúc nó hình thành; không có sự đồng ý; không thể được phê duyệt: lừa dối cộng không đồng ý cộng gây hại tâm lý'
    moi: '(quiz) ... (Thứ tự là do nhóm nghiên cứu sắp đặt.); ... nhưng chủ động sắp đặt cuộc cạnh tranh ...; cùng kéo chiếc xe tải không nổ máy; thù địch dịu đi đáng kể ... nhưng bạn cùng nhóm vẫn được chọn nhiều hơn; ... phụ huynh chỉ được báo về một trại thí nghiệm ...; rất khó được phê duyệt: đánh lừa trẻ em ... cộng cố tình gây căng thẳng'
    ly_do: q1a–q5b.
  - cu: 'Nguồn: (chỉ có Sherif 1988, Aronson 1978)'
    moi: 'Thêm vào Nguồn: Aronson (jigsaw.org), Cochon Drouet 2023, Stanczak 2022, Pettigrew & Tropp 2006, Riek 2006, Mullen 1992, Tyerman & Spencer 1983'
    ly_do: Nguồn của các câu đã sửa.
  - cu: đều là học sinh lớp 5 học tốt
    moi: đều là học sinh lớp 5 có học lực trung bình trở lên
    ly_do: 'Review s2: nguồn "average or above".'
  - cu: Các em được xếp thành hai nhóm 11 em
    moi: '... (Cuối giai đoạn 1, hai em của nhóm Eagles bị cho về nhà vì nhớ nhà, nên từ giai đoạn 2 nhóm này chỉ còn 9 em.)'
    ly_do: Review s3 (chú, lượt 2).
  - cu: hai nhóm ở tách biệt, không biết đến sự tồn tại của nhau
    moi: hai nhóm ở tách biệt, không tiếp xúc với nhau (đến những ngày cuối giai đoạn mới biết trại còn có nhóm khác)
    ly_do: Review s5.
  - cu: các em quy nguồn cơn cho ban điều hành trại thay vì cho nhóm kia; lần Robbers Cave được lên kế hoạch để tránh điều đó
    moi: nguồn cơn của xung đột bị quy cho ban điều hành trại; Sherif viết rằng kinh nghiệm ấy rất có ích khi lên kế hoạch cho lần Robbers Cave
    ly_do: 'Review nk1c: bám chương 5 [p. 96].'
  - cu: Theo Aronson và cộng sự (1978) và trang giới thiệu của chính Aronson
    moi: Theo lời tự thuật của chính Aronson trên trang giới thiệu jigsaw (chúng tôi chưa đọc trực tiếp sách Aronson và cộng sự, 1978)
    ly_do: Review a3.
  - cu: lớp học jigsaw là phiên bản đời thực của bài học mục tiêu chung hóa giải thù địch; Một nguyên lý từ trại hè năm 1954 đã trở thành kỹ thuật sư phạm; Kỹ thuật jigsaw là một nỗ lực đưa nguyên lý này vào trường học; linh hồn của lớp học jigsaw
    moi: jigsaw là nỗ lực đưa vào lớp học điều gần với bài học mục tiêu chung (Aronson tự nghĩ ra năm 1971, không nói lấy từ Sherif); kỹ thuật có tinh thần gần với bài học trại hè 1954; gần với tinh thần của lớp học jigsaw
    ly_do: 'Review a6: bỏ quan hệ nguồn gốc không có nguồn.'
ghi_chu: 'Sherif et al.: đọc toàn văn báo cáo 1954 (bản in 1961, Classics in the History of Psychology), không phải bản 1988 của Wesleyan; số trang [p. xx] theo bản 1961. Aronson et al. (1978) sách không mở được: dùng jigsaw.org (lời kể của Aronson). Perry (2018) The Lost Boys chưa mở được. Pettigrew & Tropp, Riek, Mullen, Tyerman, Cochon Drouet chỉ đọc tóm tắt; Stanczak toàn văn.'
