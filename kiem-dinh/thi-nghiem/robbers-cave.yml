    cau: Theo lời tự thuật của chính Aronson trên jigsaw.org (chưa đọc trực tiếp sách Aronson và cộng sự, 1978), so với lớp học truyền thống, học sinh jigsaw giảm xung đột chủng tộc, thích đi học hơn, nghỉ học ít hơn và đạt điểm kiểm tra tốt hơn.
    loai: lich-su
    nguon:
      - jigsaworg
    trich: The jigsaw classroom has a four-decade track record of successfully reducing racial conflict and increasing positive educational outcomes such as improved test performance, reduced absenteeism, and greater liking for school.
    vi_tri: jigsaw.org (trang chủ)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "So với lớp học truyền thống, học sinh trong lớp jigsaw giảm định kiến và rập khuôn, quý mến bạn khác nhóm hơn, tự tin hơn, thích đi học hơn, nghỉ học ít hơn và đạt điểm cao hơn trong các bài kiểm tra chuẩn hóa. Một nguyên lý ... (Aronson ... 1978)." Chữ mới: câu trên, kèm bằng chứng về sau. Lý do: không mở được sách 1978 nên chỉ dẫn lời tóm tắt của chính Aronson; bỏ "định kiến và rập khuôn, tự tin hơn, bài kiểm tra chuẩn hóa" (không có trong trang nguồn đọc được). chưa chắc: người giao nên có sách 1978 hay Blaney và cộng sự (1977) để đối chiếu con số. Review (Claude Sonnet 5.5, 30/10/2026): sai. Trang quy câu cho "Aronson và cộng sự (1978) và trang giới thiệu", nhưng sách 1978 chưa được đọc; trang jigsaw.org chỉ là tự thuật ("four-decade track record ... reducing racial conflict ... improved test performance, reduced absenteeism, greater liking for school"). Đã sửa trang và cau: quy cho lời tự thuật của Aronson trên jigsaw.org, nói rõ chưa đọc sách 1978.'
    luot_2: dung
    luot_2_nguon: [ "https://www.jigsaw.org/" ]
    luot_2_ghi_chu: Câu đúng như lời tác giả (nguồn tự thuật, không dẫn nghiên cứu cụ thể); bài Aronson và cộng sự (1978) chưa đọc trực tiếp.
    review: sai
