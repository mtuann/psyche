  - id: t2
    cau: Hai nhóm được xếp tương đương nhau ngay từ đầu, không phải chia hoàn toàn ngẫu nhiên.
    loai: phat-hien
    nguon:
      - sherif1988
    trich: After the two groups had been matched as closely as possible in terms of these characteristics, a coin was flipped to determine which group of subjects went to what participant observer.
    vi_tri: Chương 3 [p. 65]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "dù hai đội được chia hoàn toàn ngẫu nhiên". Chữ mới: "dù hai đội được xếp sao cho tương đương nhau ngay từ đầu". Lý do: nguồn nói hai nhóm được ghép tương đương rồi tung đồng xu chỉ để chọn nhóm nào theo quan sát viên nào. Review (Claude Sonnet 5.5, 30/10/2026): dung. Chương 3 [p. 65] (đọc lại 30/10/2026): ghép tương đương rồi tung đồng xu quyết nhóm nào theo quan sát viên nào. Trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap3.htm" ]
    review: dung
  - id: t3
    cau: Trại hè kéo dài ba tuần với 22 bé trai; tuần đầu hai nhóm ở riêng; sau đó có giải đấu bóng chày, kéo co, truy tìm kho báu, đội thắng nhận cúp, huy chương và dao, đội thua không nhận gì.
    loai: phat-hien
    nguon:
      - sherif1988
    trich: the group making the highest cumulative score in the series of contests would win the trophy, and the individual members of the winning group would receive the prizes (a knife and medal)
    vi_tri: Chương 3 [p. 65–66]; chương 5 [p. 98]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (Tự trải nghiệm): "bạn 12 tuổi". Chữ mới: "11 tuổi". Lý do: tuổi trung bình 11 tuổi 1 tháng, một em 12 tuổi. Phần còn lại là tình huống giả định ("gia-dinh") nhưng khớp nguồn: 22 em, ba tuần, giải đấu. Review (Claude Sonnet 5.5, 30/10/2026): dung. Chương 3 và 5: giải thưởng cúp, huy chương, dao cho đội thắng; trang khớp. Ba tuần: lượt 2 xác nhận qua chương 4.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap3.htm", "https://psychclassics.yorku.ca/Sherif/chap4.htm", "https://psychclassics.yorku.ca/Sherif/chap5.htm" ]
    luot_2_ghi_chu: Tuần đầu ở riêng (7-8 ngày); dao, huy chương, cúp chỉ cho đội thắng; đội thua không nhận gì khớp. 'Ba tuần' lấy theo ghi chép chương 4 (3 tuần).
    review: dung
  - id: e1
    cau: Thù địch giữa các nhóm không nhất thiết cần đến khác biệt văn hóa, tôn giáo hay lịch sử thù hằn; ở trại hè này, để hai nhóm trẻ tương đương nhau thành "phe ta" và "phe địch" trong cạnh tranh có thắng có thua đã đủ để định kiến mọc lên rất nhanh.
    loai: phat-hien
    nguon:
      - sherif1988
    trich: All were from established Protestant families. | The status structures ... cannot be accounted for on the basis of differentiation ... from different sociocultural backgrounds
    vi_tri: Chương 3 [p. 63–65]; chương 5
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thù địch giữa các nhóm không cần đến khác biệt văn hóa, tôn giáo hay lịch sử thù hằn. Chỉ cần chia người ta thành \"phe ta\" và \"phe địch\", rồi đặt hai phe vào cuộc cạnh tranh mà kẻ thắng người thua — định kiến và thù ghét sẽ tự mọc lên như cỏ dại." Chữ mới: câu trên. Lý do: kết luận chỉ cho thí nghiệm này (22 em cùng nền, cùng tôn giáo); "tự mọc lên như cỏ dại" khái quát quá mức. Review (Claude Sonnet 5.5, 30/10/2026): dung. Chương 3: các em cùng nền Tin Lành trung lưu; kết luận của Sherif ở trại hè này. Trang đặt trong phạm vi "ở trại hè này" và "không nhất thiết". Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap2.htm", "https://psychclassics.yorku.ca/Sherif/chap5.htm", "https://psychclassics.yorku.ca/Sherif/chap8.htm" ]
    luot_2_ghi_chu: Câu đặt trong phạm vi 'ở trại hè này' và đúng theo kết luận của Sherif; lưu ý nhóm đồng nhất và nhóm nghiên cứu dàn dựng các tình huống, nên 'đủ' chỉ là kết luận của chính tác giả (xem nt).
    review: dung
  - id: e2
    cau: Một hoàn cảnh được sắp đặt khéo cũng có thể làm thù địch dịu đi đáng kể.
    loai: phat-hien
    nguon:
      - sherif1988
    trich: a substantial and significant increase is found for both groups
    vi_tri: Chương 7 [p. 187]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "có thể làm tan thù địch nhanh không kém". Chữ mới: "có thể làm thù địch dịu đi đáng kể". Lý do: nguồn cho thấy chọn bạn ngoài nhóm tăng đáng kể nhưng bạn cùng nhóm vẫn được chọn nhiều hơn (63,6% và 76,8%); "tan" và "nhanh không kém" không có trong nguồn. Review (Claude Sonnet 5.5, 30/10/2026): dung. Chương 7 [p. 187]: tỉ lệ chọn bạn ngoài nhóm tăng đáng kể, bạn cùng nhóm vẫn nhiều hơn (63,6% và 76,8%). Trang nói "dịu đi đáng kể", không "tan".'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap7.htm" ]
    review: dung
  - id: s1
    cau: Trại hè diễn ra mùa hè 1954 ở một trại Hướng đạo rộng 200 mẫu nằm trong Công viên Bang Robbers Cave, Oklahoma, trong ba tuần.
    loai: lich-su
    nguon:
      - sherif1988
    trich: This is a 200 acre Boy Scouts of America camp which is completely surrounded by Robbers Cave State Park | One group was brought to the site on June 19, 1954
    vi_tri: Chương 3 [p. 65–66]; chương 4 [p. 75]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "tại Công viên Bang Robbers Cave, Oklahoma". Chữ mới: "tại một trại Hướng đạo nằm trong Công viên Bang Robbers Cave". Lý do: nguồn nói trại Hướng đạo bao quanh bởi công viên. Review (Claude Sonnet 5.5, 30/10/2026): dung. Chương 3–4: trại Hướng đạo 200 mẫu bao quanh bởi công viên bang Robbers Cave; nhóm đầu đến 19/6/1954. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap3.htm", "https://psychclassics.yorku.ca/Sherif/chap4.htm" ]
    review: dung
  - id: s2
    cau: Các em là 22 bé trai khoảng 11 tuổi (tuổi trung bình 11 tuổi 1 tháng), học sinh lớp 5 có học lực trung bình trở lên, từ các gia đình Tin Lành trung lưu ở Oklahoma City, không quen biết nhau từ trước.
    loai: so-lieu
    nguon:
      - sherif1988
    trich: The average (median and mean) age of subjects was 11 years and 1 month. | All were fifth graders about eleven years old | According to school records, all the subjects were doing average or above school work | All were from established Protestant families.
    vi_tri: Chương 3 [p. 63–64]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "22 bé trai 11–12 tuổi". Chữ mới: "khoảng 11 tuổi (tuổi trung bình 11 tuổi 1 tháng) ... học sinh lớp 5 học tốt từ các gia đình Tin Lành trung lưu ở Oklahoma City, không quen biết nhau". Lý do: nguồn nói tất cả khoảng 11 tuổi, chỉ một em 12 tuổi. Không quen biết: nguồn loại những em quen nhau. Review (Claude Sonnet 5.5, 30/10/2026): sai. Trang viết "học sinh lớp 5 học tốt"; chương 3 (đọc lại 30/10/2026) chỉ nói "doing average or above school work" (lượt 2 đã chỉ). Đã sửa thành "có học lực trung bình trở lên" ở trang và cau.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap3.htm" ]
    luot_2_ghi_chu: "'Học giỏi' hơi mạnh: bài viết 'average or above'; IQ trung vị 112."
    review: sai
  - id: s3
    cau: Hai nhóm 11 em được xếp càng tương đương nhau càng tốt về chiều cao, cân nặng, năng khiếu thể thao, độ nổi tiếng, kỹ năng trại, bơi lội và kinh nghiệm cắm trại; nhóm nào theo nhà quan sát nào được quyết định bằng tung đồng xu. Cuối giai đoạn 1, hai em của nhóm Eagles bị cho về nhà vì nhớ nhà, nên từ giai đoạn 2 nhóm này chỉ còn 9 em.
    loai: phat-hien
    nguon:
      - sherif1988
    trich: matched as closely as possible ... a coin was flipped to determine which group of subjects went to what participant observer. | 2 boys from the Eagle group had been sent home because of homesickness at the end of Stage 1 (see Chapter 4), leaving only 9 boys in that group
    vi_tri: Chương 3 [p. 65]; chương 5 [p. 100]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Các em được tuyển sao cho nền tảng càng giống nhau càng tốt và được ghép cặp tương đồng về IQ, hạnh kiểm và năng khiếu thể thao, rồi chia ngẫu nhiên thành hai nhóm 11 em." Chữ mới: câu trên. Lý do: danh sách tiêu chí ghép cặp trong nguồn không có IQ và "hạnh kiểm" (hai tiêu chí này thuộc khâu chọn em vào trại, không phải ghép nhóm); chia nhóm là ghép tương đương, đồng xu chỉ quyết nhóm nào theo quan sát viên nào. Nhóm Eagles ban đầu 11 em (chương 4 [p. 76]). Review (Claude Sonnet 5.5, 30/10/2026): sai. Trang nói hai nhóm 11 em mà không nói Eagles còn 9 em từ giai đoạn 2 (chương 5: "2 boys from the Eagle group had been sent home because of homesickness at the end of Stage 1 ... leaving only 9 boys in that group"). Đã thêm chú vào trang và cau.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap3.htm" ]
    review: sai
  - id: s4
    cau: Không em nào biết mình tham gia một thí nghiệm tâm lý học; các nhà nghiên cứu đóng vai nhân viên trại (quan sát viên làm chú hướng dẫn cấp cao), âm thầm quan sát và ghi chép.
    loai: phat-hien
    nguon:
      - sherif1988
    trich: subjects interact with one another in activities that appear life-like to them in a natural setting - without being aware that they are being observed | The participant observers appeared to the boys at camp as senior counselors.
    vi_tri: Chương 3 [p. 56, 63]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap3.htm" ]
  - id: s5
    cau: 'Giai đoạn 1 kéo dài khoảng một tuần (7–8 ngày): hai nhóm ở tách biệt, không tiếp xúc với nhau (đến những ngày cuối giai đoạn mới biết trại còn có nhóm khác), cùng hoạt động gắn kết như dựng lán, đi bộ, bơi lội.'
    loai: phat-hien
    nguon:
      - sherif1988
    trich: For the Rattlers, who arrived first, Stage 1 lasted 8 days, and for the Eagles 7 days. | Until the last days of that stage, at no time did the groups have contact with one another.
    vi_tri: Chương 4 [p. 75–76]
    ket_qua: da-sua
    ghi_chu: 'Hoạt động cụ thể (dựng lán, đi bộ, bơi): nguồn nói chung về hoạt động chung theo mục tiêu; cabin, hiking, swimming có trong chương 3–4 (cơ sở vật chất của khu vực). Review (Claude Sonnet 5.5, 30/10/2026): sai (nhẹ). Trang viết "không biết đến sự tồn tại của nhau"; chương 4 [p. 75, 94]: không tiếp xúc cho đến những ngày cuối, và Eagles được báo có nhóm khác ba ngày trước khi hết giai đoạn 1 (lượt 2 cũng chỉ ra). Đã sửa trang và cau.'
    luot_2: dung
