    cau: 'Lý thuyết xung đột thực tế: xung đột giữa các nhóm nảy sinh khi họ cạnh tranh những nguồn lực có hạn, và dịu đi khi cùng cần nhau để đạt mục tiêu chung; định kiến là sản phẩm của hoàn cảnh chứ không phải tính xấu bẩm sinh.'
    loai: dinh-nghia
    nguon:
      - sherif1988
