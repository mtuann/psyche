    trich: our 1953 attempt in which, at an important point during this friction phase, the source of friction was attributed to the camp administration. The 1953 study had to be terminated at this point for this reason.
    vi_tri: Chương 5 [p. 96]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (khung Đang tranh cãi): "trước phiên bản thành công năm 1954, nhóm Sherif đã thử hai lần và cả hai đều trật kịch bản: một lần hai nhóm liên minh với nhau để chống lại một kẻ thù chung, một lần các em quay sang chống đối chính các nhà nghiên cứu". Chữ mới: câu trên. Lý do: báo cáo gốc chỉ nêu lần 1953 (dừng vì quy nguồn cơn cho ban điều hành); lần 1949 không thất bại: Sherif viết dùng "kẻ thù chung" hiệu quả ở thí nghiệm 1949 vì tiện lợi lúc đó (chương 7 [p. 152]). Chi tiết hơn (Middle Grove, New York; hai nhóm hợp sức chống nhân viên) chỉ có từ Perry (2018) và bài điểm sách (bậc 3), chưa mở được: chưa chắc: người giao có thể thêm nếu mở được sách của Perry. Review (Claude Sonnet 5.5, 30/10/2026): sai (nhẹ). Lượt 2: khong-chac vì chi tiết "các em quy nguồn cơn" chỉ có ở Perry 2018. Review đọc chương 5 [p. 96]: "at an important point during this friction phase, the source of friction was attributed to the camp administration. The 1953 study had to be terminated at this point" (bậc 1, không nói ai quy). Trang cũ viết "các em quy ... thay vì cho nhóm kia; lần Robbers Cave được lên kế hoạch để tránh điều đó". Đã sửa trang theo nguồn: "nguồn cơn của xung đột bị quy cho ban điều hành trại; Sherif viết kinh nghiệm ấy rất có ích khi lên kế hoạch" (chương 5: "invaluable experience from our 1953 attempt").'
    luot_2: khong-chac
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap1.htm", "https://neatorama.com/2018/04/18/A-Real-life-Lord-of-the-Flies-the-Troubling-Legacy-of-the-Robbers-Cave-Experiment" ]
    luot_2_ghi_chu: Sherif xác nhận lần 1953 bị dừng giữa giai đoạn quan hệ giữa nhóm do khó khăn và sai sót trong điều hành. Việc các em quy nguồn cơn cho ban điều hành chỉ có ở sách báo của Perry (2018), qua bài báo phổ thông mà tôi chỉ đọc; nguồn bậc 1-2 không xác nhận chi tiết này.
