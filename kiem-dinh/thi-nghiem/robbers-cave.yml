    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: khung :::vung-chac[cạnh tranh về nguồn lực có hạn sinh ra thù địch giữa các nhóm]. Chữ mới: :::kha-vung[cạnh tranh về nguồn lực có hạn làm tăng thù địch giữa các nhóm]. Lý do: bằng chứng không đạt thước đo Vững chắc (không có tái lập lớn; chủ yếu tương quan; mẫu Mỹ). Đổi nhãn: người giao xem lại (có thể ảnh hưởng đến các trang khác dẫn nhãn này). Review (Claude Sonnet 5.5, 30/10/2026): dung. So mục 4: phân tích tổng hợp 95 mẫu (Riek 2006, tương quan) và 137 phép thử (Mullen 1992) cùng chiều; thí nghiệm trực tiếp chỉ có trại Sherif (22 em Mỹ), tái lập Tyerman & Spencer ủng hộ một phần. Khá vững đúng; hạ từ Vững chắc của lượt 1 là hợp lý (chủ yếu tương quan, chưa tái lập lớn có đăng ký trước).'
