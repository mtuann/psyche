    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap2.htm" ]
    luot_2_ghi_chu: Định nghĩa của Sherif; 'định kiến không phải tính xấu bẩm sinh' là diễn giải của trang, khớp luận điểm của tác giả (không dựa vào đặc điểm cá nhân).
  - id: l2
    cau: 'Mục tiêu chung cấp bách (superordinate goals): mục tiêu hấp dẫn, quan trọng với cả hai nhóm nhưng không nhóm nào đạt được một mình.'
    loai: dinh-nghia
    nguon:
      - sherif1988
    trich: goals of sufficient strength to the groups in question be superordinate, in the sense that the resources and energies of any single group will be inadequate for the attainment of the goal
    vi_tri: Chương 2 [p. 28]
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap2.htm" ]
  - id: l3
    cau: 'Nhiều thí nghiệm với nhóm nhân tạo cho thấy riêng việc phân người ta thành nhóm đã đủ gây thiên vị người cùng nhóm (Mullen, Brown và Smith, 1992); Robbers Cave cho thấy một bước tiếp theo: thêm cạnh tranh, thiên vị đã nở thành thù địch.'
    loai: tai-lap
    nguon:
      - mullen1992
      - sherif1988
    trich: a meta-analytic integration of the results of 137 tests of the ingroup bias hypothesis. Overall, the ingroup bias effect was highly significant and of moderate magnitude.
    vi_tri: Mullen và cộng sự, Abstract
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chỉ riêng việc gọi một nhóm là \"phe ta\" đã đủ khiến người ta ưu ái người cùng phe. Robbers Cave cho thấy bước tiếp theo: thêm cạnh tranh, thiên vị sẽ nở thành thù địch." Chữ mới: câu trên. Lý do: thêm nguồn (phân tích tổng hợp thiên vị nhóm mình) và đổi "sẽ" thành "đã". Chỉ đọc tóm tắt. Review (Claude Sonnet 5.5, 30/10/2026): dung. Mullen 1992 (tóm tắt): 137 phép thử, thiên vị nhóm mình "highly significant and of moderate magnitude". "Một bước tiếp theo" là diễn giải của trang, ghi như vậy; chấp nhận.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1002/ejsp.2420220202", "https://psychclassics.yorku.ca/Sherif/chap5.htm" ]
    luot_2_ghi_chu: Meta-analysis xác nhận thiên vị nhóm ở cả nhóm nhân tạo; 'một bước tiếp theo' là diễn giải của trang. Cạnh tranh làm thiên vị nở thành thù địch là điều Sherif tuyên bố.
    review: dung
  - id: l4
    cau: Ở Robbers Cave, các buổi gặp nhau "cho vui" (cùng ăn, cùng xem phim) lúc hai nhóm đang thù địch không làm giảm thù địch, có buổi còn thành ném đồ ăn vào nhau; nhìn rộng hơn, phân tích tổng hợp thấy tiếp xúc nói chung vẫn thường làm giảm định kiến.
    loai: phat-hien
    nguon:
      - sherif1988
      - pettigrew2006
    trich: Both sides were throwing papers and left-overs at each other. | During the movie there was practically no exchange between groups.
    vi_tri: Chương 7 [p. 156–158]; Pettigrew & Tropp Abstract
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ở giai đoạn đầu của quá trình hòa giải, chỉ \"gặp nhau cho vui\" không làm giảm thù địch, thậm chí có thể làm tệ hơn. Chỉ khi hai nhóm cùng đổ mồ hôi vì một việc chung thì định kiến mới tan." Chữ mới: câu trên. Lý do: gắn đúng bối cảnh Robbers Cave (hai nhóm đang đối đầu) và thêm đối trọng của Pettigrew & Tropp. Review (Claude Sonnet 5.5, 30/10/2026): dung. Chương 7 [p. 156–158]: hai bên ném giấy, thức ăn thừa; xem phim hầu như không có trao đổi. Pettigrew & Tropp làm đối trọng. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap7.htm", "https://doi.org/10.1037/0022-3514.90.5.751" ]
    review: dung
  - id: ap1
    cau: 'Gợi ý rút ra từ Robbers Cave (chưa được kiểm chứng ở công sở hay nhóm bạn): tạo một việc chung mà không bên nào làm nổi một mình thay vì chỉ tổ chức buổi gặp thân mật; ở trại hè, nhiệm vụ chung làm dịu thù địch còn các buổi gặp xã giao thì không.'
    loai: loi-khuyen
    nguon:
      - sherif1988
      - pettigrew2006
    trich: Both sides were throwing papers and left-overs at each other. | a substantial and significant increase is found for both groups
    vi_tri: Chương 7
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đừng chỉ tổ chức buổi gặp gỡ thân mật — hãy tạo một việc chung cấp bách ...: một deadline chung, một đối thủ chung, một dự án chung. Lao động chung xóa ranh giới nhanh hơn lời nói." Chữ mới: câu trên. Lý do: bỏ "đối thủ chung" (Sherif nói rõ không chọn cách "kẻ thù chung", chương 2, 7: mở rộng vùng xung đột); bỏ "xóa nhanh hơn lời nói" (không có nguồn). Review (Claude Sonnet 5.5, 30/10/2026): dung. Gợi ý gắn rõ "chưa được kiểm chứng ở công sở". Chấp nhận.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap7.htm" ]
    luot_2_ghi_chu: Đúng gợi ý, được gắn nhãn chưa kiểm chứng ở công sở.
    review: dung
  - id: ap2
    cau: Hệ thống thưởng kiểu "đội này thắng thì đội kia thua" giống giải đấu ở Robbers Cave; việc nó có sinh ra bè phái ở công sở hay không thì thí nghiệm này không kiểm tra.
    loai: loi-khuyen
    nguon:
      - sherif1988
    trich: the group making the highest cumulative score in the series of contests would win the trophy
    vi_tri: Chương 5 [p. 98]
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chính là phiên bản văn phòng của giải đấu ở Robbers Cave — nó đẻ ra bè phái. Muốn hợp tác, hãy thiết kế mục tiêu chung cho cả đội." Chữ mới: câu trên. Lý do: bỏ khẳng định "đẻ ra bè phái" và lời khuyên không có nguồn về công sở. chỗ khó: nếu người giao muốn giữ lời khuyên, cần nguồn nghiên cứu về cạnh tranh nội bộ trong tổ chức. Review (Claude Sonnet 5.5, 30/10/2026): dung. Trang nói thí nghiệm không kiểm tra công sở; "giống giải đấu" chỉ so cấu trúc thưởng. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Sherif/chap5.htm" ]
    luot_2_ghi_chu: Câu nói thí nghiệm không kiểm tra công sở; đúng.
    review: dung
