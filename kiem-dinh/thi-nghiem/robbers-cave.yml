    ly_do: 'Phân tích tổng hợp 95 mẫu (Riek, Mania & Gaertner 2006): đe dọa thực tế đi cùng thái độ tiêu cực với nhóm kia; phân tích tổng hợp 137 phép thử (Mullen và cộng sự 1992): thiên vị nhóm mình ở mức vừa. Thí nghiệm trực tiếp chỉ có các trại của Sherif (22 bé trai Mỹ; lần 1953 phải dừng), một lần làm lại ở đội hướng đạo (Tyerman & Spencer 1983) chỉ ủng hộ một phần; bằng chứng chủ yếu là tương quan, chưa có tái lập đăng ký trước. Hợp mức Khá vững.'
    trich: The meta-analysis, involving 95 samples, revealed that 5 different threat types had a positive relationship with negative outgroup attitudes.
