    ghi_chu: 'Chữ cũ: "rơi vào cạnh tranh và định kiến — đúng như Sherif đã mô tả". Chữ mới: "rơi vào nghi kỵ và thù địch; theo Aronson, môi trường lớp học cạnh tranh đã làm nó trầm trọng thêm — gần với điều Sherif mô tả". Lý do: bám lời kể của Aronson; chưa mở sách 1978. Review (Claude Sonnet 5.5, 30/10/2026): dung. jigsaw.org/history: "white youngsters, African-American youngsters, and Hispanic youngsters"; "Within a few weeks, long-standing suspicion, fear, and distrust". Lượt 2 chưa thấy chi tiết chủng tộc; review xác nhận có trong nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.jigsaw.org/" ]
