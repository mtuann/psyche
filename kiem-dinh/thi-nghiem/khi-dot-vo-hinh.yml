  - id: n33
    cau: 'Khá vững: mù không chú ý cũng xảy ra ngoài đời thật, nhưng chưa rõ áp dụng đến đâu cho nhân chứng.'
    loai: nhan
    nguon:
      - chabris2011
    trich: These results provide evidence that inattentional blindness can occur during real-world situations
    vi_tri: Tóm tắt
    nhan: kha-vung
    co_so:
      - chabris2011
      - hyman2010
    ly_do: Một thí nghiệm mô phỏng ngoài đời (Chabris 2011) và một thí nghiệm ngoài đường (Hyman 2010) cùng chiều với phòng thí nghiệm, nhưng đều là một nghiên cứu mỗi loại; chưa có nghiên cứu về trí nhớ nhân chứng thật. Không tìm thấy nguồn bình duyệt nào cho "cuộc tranh luận" mà khung cũ nói tới, nên không đạt điều kiện Đang tranh cãi (bằng chứng chất lượng cao mâu thuẫn); cũng chưa đạt Vững chắc (chưa có tổng hợp hay tái lập lớn cho bối cảnh nhân chứng).
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: khung Đang tranh cãi ("Một số nhà nghiên cứu cảnh báo… nhân chứng ngoài đời thường có động cơ chú ý cao hơn… Mức độ khái quát hóa vẫn đang được tranh luận"): không có nguồn nào cho người cảnh báo hay cuộc tranh luận. Chữ mới và nhãn Khá vững dựa vào Chabris 2011. chỗ khó: đổi nhãn là quyết định của người giao/review; có thể giữ Đang tranh cãi nếu tìm được nguồn cho cuộc tranh luận (ví dụ về trí nhớ nhân chứng). Chỗ khó (Claude Opus 5.5): chốt Khá vững: nhiều nghiên cứu cùng chiều (Chabris 2011, mô phỏng ngoài đời: ban đêm 35%, ban ngày 56% nhận ra vụ đánh nhau, tải chú ý cao làm giảm việc nhận ra; Hyman 2010 ngoài đường) nhưng mỗi bối cảnh ít nghiên cứu, chưa có nghiên cứu nhân chứng thật; vế "chưa rõ áp dụng đến đâu cho nhân chứng" chính là giới hạn ấy. Hyman 2010 chỉ đọc tóm tắt, nên co_so giữ hyman2010 như nguồn phụ. Review (Claude Sonnet 5.5, 30/10/2026): dung. Khá vững hợp lý: Chabris 2011 (mô phỏng ngoài đời) và Hyman 2010 cùng chiều với phòng thí nghiệm nhưng mỗi loại một nghiên cứu, mẫu nhỏ (tóm tắt ghi 35%/56%). Không đạt Vững chắc, không có nguồn cho "tranh luận" nên không phải Đang tranh cãi.'
    luot_2: dung
    luot_2_nguon: [ "https://www.ncbi.nlm.nih.gov/pmc/articles/3485775", "https://pubmed.ncbi.nlm.nih.gov/12971922" ]
    luot_2_ghi_chu: "Khá vững hợp lý: chỉ vài nghiên cứu ngoài đời, mẫu nhỏ; chưa rõ cho nhân chứng."
    review: dung
