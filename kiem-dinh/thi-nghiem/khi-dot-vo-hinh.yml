    trich: Out of all 192 observers across all conditions, 54% noticed the unexpected event and 46% failed to notice the unexpected event
    vi_tri: Mục Results
    nhan: vung-chac
    co_so:
      - simons1999
      - ekelund2022
      - drew2013
      - hyman2010
      - chabris2011
      - nobre2020
    ly_do: 'Đạt Vững chắc theo mục 4: phân tích tổng hợp Ekelund 2022 (14 nghiên cứu, 1.153 người) gộp tỉ lệ mù không chú ý: 62% ở người mới, 56% ở chuyên gia; tổng quan hệ thống và phân tích tổng hợp Nobre 2020 gộp 59 thí nghiệm hành vi có hiện tượng này. Cùng chiều ở nhiều quần thể và bối cảnh: thí nghiệm gốc (46% trong 192 người), người đi đường (Hyman 2010), mô phỏng ngoài đời (Chabris 2011), bác sĩ X quang (Drew 2013, 83%). Không có thất bại tái lập lớn nào trong các nguồn đã mở. Nhãn nói hiện tượng có thật và phổ biến, không nói một tỉ lệ cụ thể (tỉ lệ đổi nhiều theo nhiệm vụ).'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "lặp lại trong hàng chục thí nghiệm… Đây là một trong những phát hiện chắc chắn nhất của tâm lý học tri giác"; chữ mới dùng số nghiên cứu cụ thể; bỏ câu so sánh "chắc chắn nhất" (không nguồn). chỗ khó: Ekelund 2022 là tổng hợp về vai trò chuyên môn (không đo trực tiếp "hiệu ứng khỉ đột"); chưa mở tái lập lớn đăng ký trước; Hyman và Drew chỉ đọc tóm tắt. Người giao/lượt 2 cân nhắc Khá vững. Chỗ khó (Claude Opus 5.5): giữ Vững chắc. Ekelund 2022 hỏi về chuyên môn, nhưng để trả lời nó gộp tỉ lệ mù không chú ý của 14 nghiên cứu, nên là bằng chứng tổng hợp cho chính hiện tượng; Nobre 2020 (59 thí nghiệm) bổ sung. Cả hai chỉ đọc tóm tắt. Review (Claude Sonnet 5.5, 30/10/2026): dung. So thước đo mục 4: Ekelund 2022 (tổng hợp 14 nghiên cứu, 1.153 người) và Nobre 2020 (59 thí nghiệm) là tổng hợp; hiện tượng lặp lại ở nhiều thiết kế và nhóm (Simons 1999, Hyman 2010, Chabris 2011, Drew 2013); không thấy thất bại tái lập lớn. Hai tổng hợp trả lời câu hỏi về chuyên môn và xử lý ngầm nên chỉ là bằng chứng tổng hợp gián tiếp; chấp nhận Vững chắc, chưa chắc ở chỗ này. Chữ trên trang khớp ly_do.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059", "https://doi.org/10.1177/03010066211072466", "https://www.ncbi.nlm.nih.gov/pmc/articles/3485775" ]
