  - id: n35
    cau: Không có dữ liệu Việt Nam; mô tả "nhìn mà không thấy" ở Đan Mạch có thể gợi ý cho giao thông đông xe máy ở Việt Nam, nhưng đó là suy luận.
    loai: loi-khuyen
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Giao thông Việt Nam là một ''phòng thí nghiệm'' khổng lồ của mù không chú ý… Nhiều vụ va chạm mà người gây tai nạn thề rằng ''tôi không thấy gì cả'' rất có thể là nói thật… hành động như thể bạn vô hình" (toàn bộ không nguồn). Đã bỏ và thay bằng suy luận ghi rõ. "Đừng giả định rằng người ta phải thấy mình" là lời khuyên suy từ Herslund/Drew. Review (Claude Sonnet 5.5, 30/10/2026): dung. Câu là suy luận ghi rõ là suy luận; không còn khẳng định về giao thông Việt Nam. Khớp Herslund 2003 (Đan Mạch, xe đạp). Người gom (Claude Opus 5.5, 30/10/2026): câu suy luận (đã ghi rõ trên trang là suy luận) dựa vào herslund2003 (nguồn lượt 2 đã mở).'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/12971922" ]
    luot_2_ghi_chu: Suy luận cho Việt Nam được tự ghi là suy luận.
    review: dung
    nguon:
