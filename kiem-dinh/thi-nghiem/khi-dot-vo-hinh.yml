    ly_do: Hai yếu tố điều chỉnh (độ khó, độ giống về màu) thấy trong cùng một thí nghiệm lớn (192 người); độ giống chỉ thấy ở khỉ đột không ở người cầm ô; chưa có tổng hợp hay tái lập riêng; Khá vững theo mục 4.
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Các yếu tố điều chỉnh (độ khó nhiệm vụ, độ giống nhau, kỳ vọng) xuất hiện nhất quán qua nhiều nghiên cứu"; "kỳ vọng" và "nhất quán qua nhiều nghiên cứu" không có nguồn; chữ mới nói rõ phạm vi. Review (Claude Sonnet 5.5, 30/10/2026): dung. Khá vững hợp lý: chỉ một thí nghiệm lớn (Simons & Chabris 1999), độ giống chỉ thấy ở khỉ đột không ở người cầm ô, chưa có tổng hợp riêng. Đúng mục 4.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059", "https://www.ncbi.nlm.nih.gov/pmc/articles/3485775" ]
