nhan_dinh:
  - id: n1
    cau: Simons và Chabris (1999) cho người xem đếm đường chuyền bóng; khoảng một nửa không thấy một sự kiện bất ngờ đi qua (46% trong 192 người).
    loai: so-lieu
    nguon:
      - simons1999
    trich: Out of all 192 observers across all conditions, 54% noticed the unexpected event and 46% failed to notice the unexpected event
    vi_tri: Mục Results
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (ô thu gọn, Kết quả, câu hỏi 1): "Khoảng một nửa số người đếm đường chuyền đội áo trắng không hề thấy con khỉ đột" / "cứ hai người thì một người không hề thấy con khỉ đột". Số gốc: 46% trong 192 người ở mọi điều kiện (khỉ đột hoặc người cầm ô); ở điều kiện đội áo trắng, đếm tổng, video thường, khỉ đột: 42% thấy (58% không thấy; bảng 1). Chữ mới nêu cả hai số. Hộp hồ sơ, mô tả (description), ô thu gọn, câu hỏi 1 cùng nhận định này. Review (Claude Sonnet 5.5, 30/10/2026): dung. Đối chiếu toàn văn Simons & Chabris 1999 (PDF, mục Results): 46% trong 192 người không thấy; bảng 1, ô đội áo trắng/đếm tổng/video thường/khỉ đột: 42% thấy nên 58% không thấy. Trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
    review: dung
  - id: n2
    cau: Với con khỉ đột ở video thường (opaque), khi đếm tổng số đường chuyền của đội áo trắng, 58% (7 trên 12 người) không thấy.
    loai: so-lieu
    nguon:
      - simons1999
    trich: only 50% noticed the event. This is roughly the same as the percentage that noticed the normal Opaque/Gorilla-walking event (42%) under the same task conditions.
    vi_tri: Mục Discussion; bảng 1
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: không có (câu mới, thay thế "Khoảng một nửa số người đếm đội áo trắng"). 42% thấy → 58% không thấy; mỗi điều kiện 12 người nên 5 thấy, 7 không thấy. Review (Claude Sonnet 5.5, 30/10/2026): dung. Bảng 1 của bài gốc: ô Opaque/Gorilla/Easy/White = 42%; mỗi ô 12 người (192 người chia đều 16 điều kiện) nên 5 thấy, 7 không thấy. Khớp trang.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
    review: dung
  - id: n3
    cau: 'Người tham gia xem video 75 giây: ba người áo trắng và ba người áo đen chuyền bóng rổ.'
    loai: phat-hien
    nguon:
      - simons1999
    trich: Four videotapes, each 75 s in duration, were created. Each tape showed two teams of three players, one team wearing white shirts and the other wearing black shirts
    vi_tri: Mục Method, Materials
    ket_qua: dung
    ghi_chu: 'Hai đội, mỗi đội một quả bóng (trang nói "hai quả bóng"): "The members of each team passed a standard orange basketball".'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
  - id: n4
    cau: 'Nhiệm vụ: đếm tổng số đường chuyền chỉ của đội áo trắng, hoặc chỉ của đội áo đen (bản dễ); hoặc đếm riêng chuyền bổng và chuyền sệt (bản khó).'
    loai: phat-hien
    nguon:
      - simons1999
    trich: they should pay attention to either the team in white (the White condition) or the team in black (the Black condition)
    vi_tri: Mục Method, Procedures
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
  - id: n5
    cau: Sau khoảng 44–48 giây, một người mặc đồ khỉ đột đi xuyên qua giữa các cầu thủ trong 5 giây.
    loai: phat-hien
    nguon:
      - simons1999
    trich: In either case, the unexpected event lasted 5 s, and the players continued their actions during and after the event.
    vi_tri: Mục Method, Materials
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "xuất hiện khoảng 5 giây, ngay giữa màn hình"; chữ mới: "đi xuyên qua giữa các cầu thủ trong 5 giây, sau 44–48 giây". Bài nói "walked through the action", không nói "giữa màn hình". Review (Claude Sonnet 5.5, 30/10/2026): dung. Mục Materials: video 75 giây, sự kiện bắt đầu sau 44–48 giây, kéo dài 5 giây. Đối chiếu toàn văn.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
    luot_2_ghi_chu: Thí nghiệm chính dùng 'gorilla' hoặc 'umbrella woman'.
    review: dung
  - id: n6
    cau: Trong một nửa số video, nhân vật bất ngờ là một phụ nữ cầm ô; trong nửa kia là phụ nữ mặc đồ khỉ đột.
    loai: phat-hien
    nguon:
      - simons1999
    trich: in the Umbrella-Woman condition, a tall woman holding an open umbrella walked from off camera on one side of the action to the other
    vi_tri: Mục Method, Materials
    ket_qua: dung
    ghi_chu: 'Bốn video: hai kiểu hiển thị (trong suốt, thường) × hai nhân vật bất ngờ.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
    luot_2_ghi_chu: Điều kiện chia đều 16 ô nên mỗi sự kiện khoảng một nửa số video.
  - id: n7
    cau: Dữ liệu dùng là của 192 người xem, hầu hết là sinh viên đại học, mỗi người chỉ làm một điều kiện (sau khi loại 36 người).
    loai: so-lieu
    nguon:
      - simons1999
    trich: 228 observers, almost all undergraduate students, participated in the experiment.
    vi_tri: Mục Method (228 người); Results (loại 36, còn 192)
    ket_qua: dung
    ghi_chu: Hộp hồ sơ, dòng Người tham gia. Mỗi điều kiện 12 người (16 điều kiện).
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
  - id: n8
    cau: Trong một biến thể riêng với 12 người xem, con khỉ đột dừng lại vỗ ngực trong video 62 giây, sự kiện kéo dài 9 giây; 50% thấy, tương tự bản thường (42%).
    loai: so-lieu
    nguon:
      - simons1999
    trich: this action began after 35 s and lasted 9 s in a stimulus tape 62 s long
    vi_tri: Mục Discussion
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
  - id: n9
    cau: Người đếm đường chuyền đội áo đen thấy khỉ đột nhiều hơn người đếm đội áo trắng (58% so với 27%); với người cầm ô thì không có khác biệt như vậy (62% so với 69%).
    loai: so-lieu
    nguon:
      - simons1999
    trich: when observers attended to the actions of the Black team, they noticed the Gorilla much more often than when they attended to the actions of the White team (Black 58%, White 27%
    vi_tri: Mục Results
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: chỉ "nhóm đếm đội áo đen thấy nhiều hơn"; chữ mới thêm số và nói rõ hiệu ứng chỉ ở khỉ đột. Giải thích "gần màu lông khỉ đột" là của tác giả: "it appears that observers are more likely to notice an unexpected event that shares basic visual features—in this case, color—with the events they are attending to." Review (Claude Sonnet 5.5, 30/10/2026): dung. Results: khỉ đột Black 58%, White 27%; người cầm ô trung bình bốn ô bảng 1 là 62% (đen) và 69% (trắng) nên không có chiều tương tự. Trang chỉ nêu "không có khác biệt như vậy", khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
    review: dung
  - id: n10
    cau: Ta dễ nhận ra thứ giống (chia sẻ đặc điểm cơ bản như màu sắc) với thứ ta đang chú ý.
    loai: phat-hien
    nguon:
      - simons1999
    trich: it appears that observers are more likely to notice an unexpected event that shares basic visual features
    vi_tri: Mục Results
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (Lý thuyết): "Kỳ vọng định hình tri giác: não ưu tiên thứ phù hợp với nhiệm vụ hiện tại. Đếm áo trắng thì não lọc mọi thứ không phải áo trắng — kể cả khỉ đột"; chữ mới bám nhận định của tác giả (màu giống thì dễ thấy). "Lọc mọi thứ" là suy diễn, đã bỏ. Review (Claude Sonnet 5.5, 30/10/2026): dung. Tác giả viết "it appears that observers are more likely to notice an unexpected event that shares basic visual features"; trang dùng "dễ nhận ra", không khẳng định cơ chế "lọc". Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
    luot_2_ghi_chu: Tác giả ghi 'logically possible' cách giải thích khác (khác biệt với thứ bị bỏ qua); câu của trang diễn đạt đúng ý chính.
    review: dung
  - id: n11
    cau: 'Nhiệm vụ càng tốn sức (đếm riêng chuyền bổng và chuyền sệt), càng ít người thấy: 64% thấy ở bản dễ so với 45% ở bản khó.'
    loai: so-lieu
    nguon:
      - simons1999
    trich: More observers noticed the unexpected event in the Easy (64%) than in the Hard (45%) condition
    vi_tri: Mục Results
    ket_qua: dung
    ghi_chu: 'Cũng: khác biệt ở điều kiện trong suốt (56% so với 27%), không có ở điều kiện thường (71% so với 62%).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
  - id: n12
    cau: Thí nghiệm gốc dùng thuật ngữ "mù không chú ý kéo dài cho sự kiện động" (sustained inattentional blindness for dynamic events).
    loai: dinh-nghia
    nguon:
      - simons1999
    trich: 'Gorillas in our midst: sustained inattentional blindness'
    vi_tri: Nhan đề bài
    ket_qua: dung
    ghi_chu: 'Dùng cho định nghĩa mù không chú ý ở Điều gì đang xảy ra; định nghĩa đầy đủ dùng tóm tắt Chabris 2011: "the failure to see visible and otherwise salient events when one is paying attention to something else".'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
  - id: n13
    cau: 'Mù không chú ý (inattentional blindness): khi chú ý dồn vào một việc, người ta có thể không thấy những thứ bất ngờ nhưng nổi bật ngay trước mắt.'
    loai: dinh-nghia
    nguon:
      - chabris2011
    trich: the failure to see visible and otherwise salient events when one is paying attention to something else
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "não có thể bỏ qua hoàn toàn những thứ bất ngờ"; chữ mới: "người ta có thể không thấy". Định nghĩa theo tóm tắt Chabris 2011 (APA Dictionary không tải được). Đã bỏ: "Trải nghiệm nhìn của ta là ảo giác êm ái… não chỉ xử lý kỹ vùng đang chú ý, phần còn lại là đoán mò từ trí nhớ và kỳ vọng… với não, nó gần như không tồn tại" (giải thích thần kinh không nguồn; Nobre 2020 còn cho thấy thứ không chú ý vẫn có thể được xử lý ngầm). Review (Claude Sonnet 5.5, 30/10/2026): sai. Hồ sơ đã sửa nhưng trang "Điều gì đang xảy ra?" vẫn giữ chữ cũ "não có thể bỏ qua hoàn toàn những thứ bất ngờ", mạnh hơn định nghĩa Chabris 2011 và mâu thuẫn Nobre 2020 (thứ không chú ý vẫn có thể được xử lý ngầm). Đã sửa trang theo cau: "khi chú ý dồn vào một việc, ta có thể không thấy những thứ bất ngờ nhưng nổi bật — kể cả những thứ rất lộ liễu — ngay trước mắt".'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059", "https://www.ncbi.nlm.nih.gov/pmc/articles/3485775" ]
    review: sai
  - id: n14
    cau: 'Mù thay đổi (change blindness): người ta không nhận ra cả những thay đổi lớn giữa hai lần nhìn một cảnh.'
    loai: dinh-nghia
    nguon:
      - simons1998
      - levin1997
    trich: Adult observers failed to notice changes in both cases, even when the sole actor in a scene transformed into another person across an instantaneous change in camera angle
    vi_tri: Tóm tắt Levin & Simons 1997
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ta không nhận ra cả những thay đổi lớn, miễn là chúng xảy ra đúng lúc ta chớp mắt, lia mắt, hoặc bị che khuất trong chốc lát"; chữ mới: "giữa hai lần nhìn một cảnh… khi đổi góc máy hay bị che khuất". "Chớp mắt, lia mắt": Levin & Simons 1997 nhắc "eye movements" là bối cảnh các nghiên cứu trước; giữ ở mức chung. Review (Claude Sonnet 5.5, 30/10/2026): dung. Tóm tắt Levin & Simons 1997 (PDF Springer đọc 30/10/2026): người xem không nhận ra thay đổi, kể cả khi diễn viên duy nhất biến thành người khác qua một cú cắt góc máy. "Bị che khuất" là cách nói chung của trang, không thêm số.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/135062800394865", "https://doi.org/10.1068/p281059" ]
    review: dung
  - id: n15
    cau: 'Levin và Simons (1997): người xem phim ngắn không nhận ra những thay đổi lộ liễu giữa các cảnh quay, kể cả khi diễn viên duy nhất trong cảnh biến thành người khác ngay lúc đổi góc máy.'
    loai: phat-hien
    nguon:
      - levin1997
    trich: the sole actor in a scene transformed into another person across an instantaneous change in camera angle
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "diễn viên đổi áo, đạo cụ biến mất" và "não chỉ giữ lại cốt truyện, không phải từng chi tiết" (không có trong tóm tắt; chưa mở toàn văn); chữ mới theo tóm tắt (Illinois Experts). Chỉ đọc tóm tắt. Review (Claude Sonnet 5.5, 30/10/2026): dung. Lượt 2 chưa xác nhận được vì không mở toàn văn. Review đã tải PDF Levin & Simons 1997 (Psychon Bull Rev 4(4), link.springer.com/content/pdf/10.3758/BF03214339.pdf): tóm tắt có đúng câu "even when the sole actor in a scene transformed into another person across an instantaneous change in camera angle". Trang khớp.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.3758/bf03214339" ]
    luot_2_ghi_chu: "Không mở được toàn văn bài gốc (đóng, không có bản tác giả); chỉ đọc tóm tắt. Levin & Simons 1997 (Psychonomic Bull Rev): không có tóm tắt trong Crossref/OpenAlex/PubMed; chi tiết 'diễn viên duy nhất biến thành người khác' không xác nhận được. Simons & Chabris 1999 chỉ dẫn bài này nói chung ('changes to attended objects are often not noticed')."
    review: dung
  - id: n16
    cau: 'Simons và Levin (1998): một nhà nghiên cứu bắt chuyện với người đi đường; giữa chừng bị lén thay bằng một người khác; chỉ khoảng một nửa số người đi đường nhận ra; việc nhận ra phụ thuộc vào nhóm xã hội.'
    loai: phat-hien
    nguon:
      - simons1998
    trich: Only half of the pedestrians detected the change.
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "một người lạ chặn người đi đường hỏi đường… hai người khiêng cánh cửa… khác quần áo, khác giọng nói, cao khác 5 cm. Chỉ 7 trên 15 người nhận ra". Tóm tắt chỉ nói "only half" và "social group membership"; "hỏi đường", "cánh cửa", "5 cm", "7 trên 15" không có trong tóm tắt (chưa mở toàn văn): bỏ khỏi trang và câu hỏi 3. Chữ mới theo tóm tắt (tất cả đã đổi, cả quiz). Chỉ đọc tóm tắt. Review (Claude Sonnet 5.5, 30/10/2026): dung. Lượt 2 chưa xác nhận được. Review đã tải PDF Simons & Levin 1998 (Psychon Bull Rev 5(4), link.springer.com/content/pdf/10.3758/BF03208840.pdf): tóm tắt nói "Only half of the pedestrians detected the change" và "successful detection depended on social group membership; pedestrians from the same social group as the experimenters detected the change but those from a different social group did not". Trang khớp từng ý; các chi tiết cũ (cánh cửa, 7/15) đã bỏ.'
