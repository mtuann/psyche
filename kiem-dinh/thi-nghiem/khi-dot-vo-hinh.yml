nhan_dinh:
- id: n1
  cau: Simons và Chabris (1999) cho người xem đếm đường chuyền bóng; khoảng một nửa không thấy một sự kiện bất ngờ đi qua (46% trong 192 người).
  loai: so-lieu
  nguon:
  - simons1999
  trich: Out of all 192 observers across all conditions, 54% noticed the unexpected event and 46% failed to notice the unexpected event
  vi_tri: Mục Results
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ (ô thu gọn, Kết quả, câu hỏi 1): "Khoảng một nửa số người đếm đường chuyền đội áo trắng không hề thấy con khỉ đột" / "cứ hai người thì một người không hề thấy con khỉ đột". Số gốc: 46% trong 192 người ở mọi điều kiện (khỉ đột hoặc người cầm ô); ở điều kiện đội áo trắng, đếm tổng, video thường, khỉ đột: 42% thấy (58% không thấy; bảng 1). Chữ mới nêu cả hai số. Hộp hồ sơ, mô tả (description), ô thu gọn, câu hỏi 1 cùng nhận định này.'
- id: n2
  cau: Với con khỉ đột ở video thường (opaque), khi đếm tổng số đường chuyền của đội áo trắng, 58% (7 trên 12 người) không thấy.
  loai: so-lieu
  nguon:
  - simons1999
  trich: only 50% noticed the event. This is roughly the same as the percentage that noticed the normal Opaque/Gorilla-walking event (42%) under the same task conditions.
  vi_tri: Mục Discussion; bảng 1
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: không có (câu mới, thay thế "Khoảng một nửa số người đếm đội áo trắng"). 42% thấy → 58% không thấy; mỗi điều kiện 12 người nên 5 thấy, 7 không thấy.'
- id: n3
  cau: 'Người tham gia xem video 75 giây: ba người áo trắng và ba người áo đen chuyền bóng rổ.'
  loai: phat-hien
  nguon:
  - simons1999
  trich: Four videotapes, each 75 s in duration, were created. Each tape showed two teams of three players, one team wearing white shirts and the other wearing black shirts
  vi_tri: Mục Method, Materials
  ket_qua: dung
  ghi_chu: 'Hai đội, mỗi đội một quả bóng (trang nói "hai quả bóng"): "The members of each team passed a standard orange basketball".'
- id: n4
  cau: 'Nhiệm vụ: đếm tổng số đường chuyền chỉ của đội áo trắng, hoặc chỉ của đội áo đen (bản dễ); hoặc đếm riêng chuyền bổng và chuyền sệt (bản khó).'
  loai: phat-hien
  nguon:
  - simons1999
  trich: they should pay attention to either the team in white (the White condition) or the team in black (the Black condition)
  vi_tri: Mục Method, Procedures
  ket_qua: dung
- id: n5
  cau: Sau khoảng 44–48 giây, một người mặc đồ khỉ đột đi xuyên qua giữa các cầu thủ trong 5 giây.
  loai: phat-hien
  nguon:
  - simons1999
  trich: In either case, the unexpected event lasted 5 s, and the players continued their actions during and after the event.
  vi_tri: Mục Method, Materials
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "xuất hiện khoảng 5 giây, ngay giữa màn hình"; chữ mới: "đi xuyên qua giữa các cầu thủ trong 5 giây, sau 44–48 giây". Bài nói "walked through the action", không nói "giữa màn hình".'
- id: n6
  cau: Trong một nửa số video, nhân vật bất ngờ là một phụ nữ cầm ô; trong nửa kia là phụ nữ mặc đồ khỉ đột.
  loai: phat-hien
  nguon:
  - simons1999
  trich: in the Umbrella-Woman condition, a tall woman holding an open umbrella walked from off camera on one side of the action to the other
  vi_tri: Mục Method, Materials
  ket_qua: dung
  ghi_chu: 'Bốn video: hai kiểu hiển thị (trong suốt, thường) × hai nhân vật bất ngờ.'
- id: n7
  cau: Dữ liệu dùng là của 192 người xem, hầu hết là sinh viên đại học, mỗi người chỉ làm một điều kiện (sau khi loại 36 người).
  loai: so-lieu
  nguon:
  - simons1999
  trich: 228 observers, almost all undergraduate students, participated in the experiment.
  vi_tri: Mục Method (228 người); Results (loại 36, còn 192)
  ket_qua: dung
  ghi_chu: Hộp hồ sơ, dòng Người tham gia. Mỗi điều kiện 12 người (16 điều kiện).
- id: n8
  cau: Trong một biến thể riêng với 12 người xem, con khỉ đột dừng lại vỗ ngực trong video 62 giây, sự kiện kéo dài 9 giây; 50% thấy, tương tự bản thường (42%).
  loai: so-lieu
  nguon:
  - simons1999
  trich: this action began after 35 s and lasted 9 s in a stimulus tape 62 s long
  vi_tri: Mục Discussion
  ket_qua: dung
- id: n9
  cau: Người đếm đường chuyền đội áo đen thấy khỉ đột nhiều hơn người đếm đội áo trắng (58% so với 27%); với người cầm ô thì không có khác biệt như vậy (62% so với 69%).
  loai: so-lieu
  nguon:
  - simons1999
  trich: when observers attended to the actions of the Black team, they noticed the Gorilla much more often than when they attended to the actions of the White team (Black 58%, White 27%
  vi_tri: Mục Results
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: chỉ "nhóm đếm đội áo đen thấy nhiều hơn"; chữ mới thêm số và nói rõ hiệu ứng chỉ ở khỉ đột. Giải thích "gần màu lông khỉ đột" là của tác giả: "it appears that observers are more likely to notice an unexpected event that shares basic visual features—in this case, color—with the events they are attending to."'
- id: n10
  cau: Ta dễ nhận ra thứ giống (chia sẻ đặc điểm cơ bản như màu sắc) với thứ ta đang chú ý.
  loai: phat-hien
  nguon:
  - simons1999
  trich: it appears that observers are more likely to notice an unexpected event that shares basic visual features
  vi_tri: Mục Results
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ (Lý thuyết): "Kỳ vọng định hình tri giác: não ưu tiên thứ phù hợp với nhiệm vụ hiện tại. Đếm áo trắng thì não lọc mọi thứ không phải áo trắng — kể cả khỉ đột"; chữ mới bám nhận định của tác giả (màu giống thì dễ thấy). "Lọc mọi thứ" là suy diễn, đã bỏ.'
- id: n11
  cau: 'Nhiệm vụ càng tốn sức (đếm riêng chuyền bổng và chuyền sệt), càng ít người thấy: 64% thấy ở bản dễ so với 45% ở bản khó.'
  loai: so-lieu
  nguon:
  - simons1999
  trich: More observers noticed the unexpected event in the Easy (64%) than in the Hard (45%) condition
  vi_tri: Mục Results
  ket_qua: dung
  ghi_chu: 'Cũng: khác biệt ở điều kiện trong suốt (56% so với 27%), không có ở điều kiện thường (71% so với 62%).'
- id: n12
  cau: Thí nghiệm gốc dùng thuật ngữ "mù không chú ý kéo dài cho sự kiện động" (sustained inattentional blindness for dynamic events).
  loai: dinh-nghia
  nguon:
  - simons1999
  trich: 'Gorillas in our midst: sustained inattentional blindness'
  vi_tri: Nhan đề bài
  ket_qua: dung
  ghi_chu: 'Dùng cho định nghĩa mù không chú ý ở Điều gì đang xảy ra; định nghĩa đầy đủ dùng tóm tắt Chabris 2011: "the failure to see visible and otherwise salient events when one is paying attention to something else".'
- id: n13
  cau: 'Mù không chú ý (inattentional blindness): khi chú ý dồn vào một việc, người ta có thể không thấy những thứ bất ngờ nhưng nổi bật ngay trước mắt.'
  loai: dinh-nghia
  nguon:
  - chabris2011
  trich: the failure to see visible and otherwise salient events when one is paying attention to something else
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "não có thể bỏ qua hoàn toàn những thứ bất ngờ"; chữ mới: "người ta có thể không thấy". Định nghĩa theo tóm tắt Chabris 2011 (APA Dictionary không tải được). Đã bỏ: "Trải nghiệm nhìn của ta là ảo giác êm ái… não chỉ xử lý kỹ vùng đang chú ý, phần còn lại là đoán mò từ trí nhớ và kỳ vọng… với não, nó gần như không tồn tại" (giải thích thần kinh không nguồn; Nobre 2020 còn cho thấy thứ không chú ý vẫn có thể được xử lý ngầm).'
- id: n14
  cau: 'Mù thay đổi (change blindness): người ta không nhận ra cả những thay đổi lớn giữa hai lần nhìn một cảnh.'
  loai: dinh-nghia
  nguon:
  - simons1998
  - levin1997
  trich: Adult observers failed to notice changes in both cases, even when the sole actor in a scene transformed into another person across an instantaneous change in camera angle
  vi_tri: Tóm tắt Levin & Simons 1997
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "ta không nhận ra cả những thay đổi lớn, miễn là chúng xảy ra đúng lúc ta chớp mắt, lia mắt, hoặc bị che khuất trong chốc lát"; chữ mới: "giữa hai lần nhìn một cảnh… khi đổi góc máy hay bị che khuất". "Chớp mắt, lia mắt": Levin & Simons 1997 nhắc "eye movements" là bối cảnh các nghiên cứu trước; giữ ở mức chung.'
- id: n15
  cau: 'Levin và Simons (1997): người xem phim ngắn không nhận ra những thay đổi lộ liễu giữa các cảnh quay, kể cả khi diễn viên duy nhất trong cảnh biến thành người khác ngay lúc đổi góc máy.'
  loai: phat-hien
  nguon:
  - levin1997
  trich: the sole actor in a scene transformed into another person across an instantaneous change in camera angle
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "diễn viên đổi áo, đạo cụ biến mất" và "não chỉ giữ lại cốt truyện, không phải từng chi tiết" (không có trong tóm tắt; chưa mở toàn văn); chữ mới theo tóm tắt (Illinois Experts). Chỉ đọc tóm tắt.'
- id: n16
  cau: 'Simons và Levin (1998): một nhà nghiên cứu bắt chuyện với người đi đường; giữa chừng bị lén thay bằng một người khác; chỉ khoảng một nửa số người đi đường nhận ra; việc nhận ra phụ thuộc vào nhóm xã hội.'
  loai: phat-hien
  nguon:
  - simons1998
  trich: Only half of the pedestrians detected the change.
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "một người lạ chặn người đi đường hỏi đường… hai người khiêng cánh cửa… khác quần áo, khác giọng nói, cao khác 5 cm. Chỉ 7 trên 15 người nhận ra". Tóm tắt chỉ nói "only half" và "social group membership"; "hỏi đường", "cánh cửa", "5 cm", "7 trên 15" không có trong tóm tắt (chưa mở toàn văn): bỏ khỏi trang và câu hỏi 3. Chữ mới theo tóm tắt (tất cả đã đổi, cả quiz). Chỉ đọc tóm tắt.'
- id: n17
  cau: 'Hyman và cộng sự (2010): người vừa đi bộ vừa nói chuyện điện thoại ít nhận ra chú hề đi xe đạp một bánh dọc lối đi hơn những người đi một mình, nghe nhạc hay đi theo cặp.'
  loai: phat-hien
  nguon:
  - hyman2010
  trich: cell phone users were less likely to notice an unusual activity along their walking route (a unicycling clown)
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Trên sân trường đại học… ít thấy chú hề hơn hẳn… dù chú hề sặc sỡ và đi ngay trước mặt… huống chi khi lái xe". Tóm tắt không nói "sân trường", "hẳn", "sặc sỡ", "ngay trước mặt". Chữ mới theo tóm tắt; "gợi ý về rủi ro khi lái xe" được ghi rõ là suy luận (nghiên cứu không đo lái xe). Chỉ đọc tóm tắt (Crossref).'
- id: n18
  cau: Nói chuyện điện thoại khi đi bộ đã có thể gây mù không chú ý; nghiên cứu không đo việc lái xe.
  loai: phat-hien
  nguon:
  - hyman2010
  trich: Cell phone usage may cause inattentional blindness even during a simple activity that should require few cognitive resources.
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đã đủ gây… huống chi khi lái xe"; chữ mới dùng "có thể", bỏ "huống chi khi lái xe".'
- id: n19
  cau: 'Drew và cộng sự (2013): 83% trong 24 bác sĩ X-quang không thấy hình con khỉ đột (to gấp 48 lần nốt phổi trung bình) gắn vào ảnh CT phổi.'
  loai: so-lieu
  nguon:
  - drew2013
  trich: Eighty-three percent of the radiologists did not see the gorilla.
  vi_tri: Tóm tắt
  ket_qua: dung
  ghi_chu: 'Câu mới thêm vào trang; "phần lớn người bỏ lỡ nhìn thẳng vào vị trí con khỉ": "the majority of those who missed the gorilla looked directly at its location".'
- id: n20
  cau: 'Ekelund và cộng sự (2022): phân tích tổng hợp 14 nghiên cứu (1.153 người): 62% người mới và 56% chuyên gia bị mù không chú ý; chuyên môn chỉ giảm nhẹ và không rõ.'
  loai: so-lieu
  nguon:
  - ekelund2022
  trich: 'On average, experts showed only a slight reduction in rates of inattentional blindness: 62% of novices experienced inattentional blindness compared to 56% of experts'
  vi_tri: Tóm tắt
  ket_qua: dung
  ghi_chu: Tỉ số chênh 1,33, KTC 95% [0,78; 2,28]; tác giả nhắc số nghiên cứu ít và mẫu nhỏ làm yếu kết luận.
- id: n21
  cau: 'Nobre và cộng sự (2020): tổng hợp 59 thí nghiệm cho thấy thứ không được chú ý và không được báo vẫn có thể được xử lý ngầm.'
  loai: so-lieu
  nguon:
  - nobre2020
  trich: Results showed that visual stimuli can be processed when unattended and unnoticed.
  vi_tri: Tóm tắt
  ket_qua: dung
  ghi_chu: Câu mới; dùng ở ngộ nhận "mắt thấy thì não thấy".
- id: n22
  cau: 'Chabris và cộng sự (2011): trong thí nghiệm mô phỏng ngoài đời, ban ngày 56% người chạy đuổi theo một người nhận ra vụ đánh nhau dàn dựng, ban đêm 35%; tăng gánh nặng chú ý làm giảm số người thấy.'
  loai: so-lieu
  nguon:
  - chabris2011
  trich: At night only 35% of subjects noticed the fight; during the day 56% noticed.
  vi_tri: Tóm tắt
  ket_qua: dung
  ghi_chu: Câu mới; thay "một số nhà nghiên cứu cảnh báo… nhân chứng ngoài đời thường có động cơ chú ý cao hơn" (không nguồn).
- id: n23
  cau: 'Herslund và Jørgensen (2003): tài xế ô tô nói không thấy xe đạp trên đường ưu tiên dù xe đạp rõ ràng ("looked-but-failed-to-see").'
  loai: phat-hien
  nguon:
  - herslund2003
  trich: Often the involved car drivers have maintained that they did not see the bicycle until immediately before the collision even though the bicycle must have been clearly visible.
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "''nhìn mà không thấy'' là nguyên nhân của vô số vụ tai nạn: tài xế nhìn thẳng vào xe máy mà não không đăng ký". "Vô số" và "xe máy" không có trong nguồn; nguồn Đan Mạch nói xe đạp, đường ưu tiên, và hai nghiên cứu nhỏ (10 trường hợp suýt tai nạn tự khai).'
- id: n24
