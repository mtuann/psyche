    luot_2_nguon: [ "https://doi.org/10.1126/science.aac4716" ]
    luot_2_ghi_chu: Kết luận 'sống sót qua nhiều lần làm lại đáng tin hơn' là suy luận hợp lý khớp OSC; không phải số liệu.
