    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "mười lăm thí nghiệm nổi tiếng nhất" (mô tả) và "hầu như ai học tâm lý học cũng từng nghe tên". Chữ mới: "nổi tiếng" và "nổi tiếng của tâm lý học". Lý do: chỉ có nguồn xác nhận độ nổi tiếng của hai trong mười lăm (Zimbardo, Pygmalion); xếp hạng "nhất" và "hầu như ai cũng nghe tên" không có nguồn. chưa chắc cho mười ba thí nghiệm còn lại.'
