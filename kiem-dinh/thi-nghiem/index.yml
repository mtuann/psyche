    ghi_chu: 'Chữ cũ: "Thí nghiệm chưa từng được làm lại thì chỉ là một câu chuyện hay; thí nghiệm sống sót qua nhiều lần làm lại mới đáng tin." Chữ mới: câu trên. Lý do: cách nói cũ là ẩn dụ không có nguồn; viết lại bám số liệu của OSC (100 nghiên cứu làm lại, 97% gốc có ý nghĩa, 36% làm lại có ý nghĩa). Chỉ đọc tóm tắt.'
