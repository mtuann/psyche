      - mischel1972
    ly_do: 'Thí nghiệm có thao tác điều kiện nên kết luận nhân quả trong lab; nhưng mẫu nhỏ (4–10 trẻ mỗi nhóm), một trường mầm non, chưa mở được phân tích tổng hợp hay tái lập lớn có đăng ký trước, nên chưa đạt Vững chắc (mục 4). Opus xét lại: giữ Khá vững.'
    ket_qua: da-sua
    ghi_chu: 'chỗ khó: chữ cũ là :::vung-chac. Thước đo Vững chắc đòi phân tích tổng hợp/hai tái lập lớn; chưa có; hạ xuống Khá vững. Người giao/lượt 2 xem lại: nếu có phân tích tổng hợp về phân tán chú ý ở trẻ (chưa mở), có thể nâng. Review (Claude Sonnet 5.5, 30/10/2026): nhãn Khá vững đúng thước đo mục 4 (không phân tích tổng hợp, không tái lập lớn). Nhưng khung nói "mỗi nhóm khoảng 6–10 trẻ" sai: đọc toàn văn Mischel 1972 (uv.mx): TN I 10 trẻ mỗi nhóm (5 nhóm), TN II 10, 10 và 6 trẻ, TN III 8 trẻ nhóm thí nghiệm và 4+4 trẻ hai nhóm đối chứng. Đã sửa "6–10" thành "4–10" trên trang và trong ly_do.'
    luot_2: dung
    luot_2_nguon: [ "https://www.uv.mx/iip/files/2016/08/Articulo-19-08-16.pdf", "https://doi.org/10.1016/j.cognition.2012.08.004" ]
    luot_2_ghi_chu: "Nhãn Khá vững hợp thước đo: nhiều thí nghiệm cùng chiều (Mischel 1972 và các nghiên cứu cùng nhóm), nhưng mẫu nhỏ, thí nghiệm phòng thí nghiệm, chưa có phân tích tổng hợp hay tái lập lớn đăng ký trước; không nên nâng lên Vững chắc."
