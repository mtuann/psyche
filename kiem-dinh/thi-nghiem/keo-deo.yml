    ghi_chu: 'Chữ cũ: "trẻ vừa bị người lớn thất hứa thì chờ kẹo ít hơn hẳn trẻ được giữ lời hứa"; mới nêu N = 28, "đáng kể" và dùng đúng điều kiện (môi trường không đáng tin/đáng tin). Chi tiết "thất hứa" (bài gốc: người thí nghiệm không giữ lời) chưa đọc toàn văn. Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích của nguồn (Watts 2018 toàn văn, Mischel 1972 toàn văn, tóm tắt các bài còn lại): khớp tóm tắt Kidd 2013 (N = 28, p < 0,0005).'
