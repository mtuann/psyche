nhan_dinh:
  - id: n1
    cau: Walter Mischel cho trẻ mẫu giáo chọn giữa một phần thưởng ngay và một phần thưởng ưa thích hơn nếu chờ.
    loai: phat-hien
    nguon:
      - mischel1972
    trich: preschool children could obtain a less preferred reward immediately or continue waiting indefinitely for a more preferred but delayed reward
    vi_tri: tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Câu mô tả (description) và hộp hồ sơ. Chữ cũ: "một viên kẹo ngay hay hai viên nếu chờ 15 phút"; chữ mới như trên. Lý do: bài 1972 là chọn giữa hai phần thưởng khác nhau (kẹo dẻo và bánh quy que), không phải một so với hai viên kẹo; bản "một viên so với hai viên" là bài chờ chỉnh sửa trong Watts 2018 (7 phút). Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích của nguồn (Watts 2018 toàn văn, Mischel 1972 toàn văn, tóm tắt các bài còn lại): mô tả khớp tóm tắt Mischel 1972 (chọn giữa hai phần thưởng khác nhau).'
    luot_2: dung
    luot_2_nguon: [ "https://www.uv.mx/iip/files/2016/08/Articulo-19-08-16.pdf" ]
    review: dung
  - id: n2
    cau: Trong mẫu gốc, những trẻ chờ được lâu hơn sau này có điểm SAT cao hơn.
    loai: phat-hien
    nguon:
      - watts2018
      - shoda1990
    trich: observed large correlations between delay time and SAT scores, r(35) = .57 for math, r (35) = .42 for verbal
    vi_tri: phần Introduction (Watts), kể lại Shoda 1990
    ket_qua: dung
    ghi_chu: Bài Shoda 1990 chỉ đọc tóm tắt (nói "cognitive and academic competence"); điểm SAT cụ thể theo Watts 2018 kể lại, toàn văn.
    luot_2: dung
    luot_2_nguon: [ "https://gwern.net/doc/psychology/2018-watts.pdf" ]
    luot_2_ghi_chu: Đọc qua trích dẫn của Watts 2018; chưa mở bản gốc Shoda 1990 (chỉ có tóm tắt).
  - id: n3
    cau: Lần làm lại năm 2018 dùng 918 trẻ.
    loai: so-lieu
    nguon:
      - watts2018
    trich: Our analysis sample was limited to children who had a valid measure of delay of gratification at age 54 months, as well as nonmissing achievement and behavioral data at age 15 (n = 918).
    vi_tri: Method, Data
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://gwern.net/doc/psychology/2018-watts.pdf" ]
    luot_2_ghi_chu: 552 + 366 = 918 trẻ trong mẫu phân tích.
  - id: n4
    cau: Lần làm lại cho thấy mối liên hệ giảm mạnh khi tính đến hoàn cảnh gia đình.
    loai: phat-hien
    nguon:
      - watts2018
    trich: this bivariate correlation was only half the size of those reported in the original studies and was reduced by two thirds in the presence of controls for family background, early cognitive ability, and the home environment
    vi_tri: Abstract
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1177/0956797618761661", "https://gwern.net/doc/psychology/2018-watts.pdf" ]
  - id: n5
    cau: 'Hãy tưởng tượng: người lớn nói trẻ 4 tuổi rằng chờ mà không ăn thì được hai viên, ăn ngay thì chỉ được một viên.'
    loai: phat-hien
    nguon:
      - watts2018
    trich: If the child waited for 7 min, the interviewer would return, and the child could eat the treat and receive an additional portion as a reward for waiting.
    vi_tri: Method, bài chờ; tình huống giả định (gia-dinh)
    ket_qua: dung
    ghi_chu: 'gia-dinh: tình huống minh họa theo bài chờ "chờ để được thêm một phần" của NICHD (Watts 2018, mục Method), không phải mô tả bài 1972. Không còn nói "15 năm sau" và "sự nghiệp" trong câu hỏi.'
    luot_2: dung
    luot_2_nguon: [ "https://www.uv.mx/iip/files/2016/08/Articulo-19-08-16.pdf" ]
    luot_2_ghi_chu: "Tình huống minh họa theo thiết kế của Mischel: chọn phần thưởng ưa thích hơn nếu chờ, phần kém hơn nếu bấm chuông; con số một và hai viên là ví dụ, không phải số liệu."
  - id: n6
    cau: 'Câu hỏi: "khả năng chờ đợi của đứa trẻ 4 tuổi có dự đoán được điểm số của nó hơn mười năm sau không?"'
    loai: phat-hien
    nguon:
      - watts2018
      - mischel1988
    trich: children who were able to wait longer at age 4 or 5 became adolescents whose parents rated them as more academically and socially competent
    vi_tri: tóm tắt Mischel 1988; Watts (outcomes ở tuổi 15)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "điểm thi, sự nghiệp của nó 15 năm sau"; chữ mới: "điểm số của nó hơn mười năm sau". Lý do: Mischel 1988 theo dõi "hơn một thập kỷ" (a decade later), Watts đo ở tuổi 15 (từ 54 tháng): khoảng 10 năm; không nghiên cứu nào đo "sự nghiệp". Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích của nguồn (Watts 2018 toàn văn, Mischel 1972 toàn văn, tóm tắt các bài còn lại): câu hỏi mở đầu, khớp "decade later" và Watts (tuổi 15 từ 54 tháng).'
    luot_2: dung
    luot_2_nguon: [ "https://gwern.net/doc/psychology/2018-watts.pdf" ]
    luot_2_ghi_chu: Là câu hỏi mở đầu, đúng với câu hỏi mà các nghiên cứu theo dõi và Watts 2018 đặt ra.
    review: dung
  - id: n7
    cau: 'Nghiên cứu gốc tìm thấy tương quan đáng kể: trẻ chờ lâu hơn sau này có điểm SAT cao hơn và được cha mẹ đánh giá là ứng phó tốt hơn.'
    loai: phat-hien
    nguon:
      - mischel1988
      - watts2018
    trich: parents rated them as more academically and socially competent, verbally fluent, rational, attentive, planful, and able to deal well with frustration and stress
    vi_tri: tóm tắt Mischel 1988
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "tương quan rõ rệt"; mới: "đáng kể", và nói rõ đánh giá do cha mẹ. SAT: xem nhận định về SAT (Shoda 1990 qua Watts). Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích của nguồn (Watts 2018 toàn văn, Mischel 1972 toàn văn, tóm tắt các bài còn lại): khớp tóm tắt Mischel 1988; SAT từ Shoda 1990 qua Watts.'
    luot_2: dung
    luot_2_nguon: [ "https://gwern.net/doc/psychology/2018-watts.pdf", "https://doi.org/10.1037/0022-3514.54.4.687" ]
    review: dung
  - id: n8
    cau: Lần làm lại 2018 cho thấy tương quan chỉ bằng khoảng một nửa bản gốc, và khi tính đến hoàn cảnh gia đình thì giảm thêm khoảng hai phần ba.
    loai: so-lieu
    nguon:
      - watts2018
    trich: this bivariate correlation was only half the size of those reported in the original studies and was reduced by two thirds in the presence of controls
    vi_tri: Abstract
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "co lại còn rất nhỏ" (không có trong nguồn). Mới theo tóm tắt của Watts. Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích của nguồn (Watts 2018 toàn văn, Mischel 1972 toàn văn, tóm tắt các bài còn lại): khớp tóm tắt Watts (half, two thirds); số nói ở mẫu 552.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1177/0956797618761661" ]
    review: dung
  - id: n9
    cau: 'Thí nghiệm "kẹo dẻo" nổi tiếng với câu chuyện thường được kể lại: đứa trẻ nào cưỡng lại được viên kẹo hôm nay sẽ thành công ngày mai.'
    loai: lich-su
    nguon:
      - watts2018
    trich: Because these findings have been cited as motivation both for interventions designed to boost gratification delay specifically
    vi_tri: Introduction (cách các kết quả được dùng để thúc đẩy can thiệp)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "một trong những câu chuyện tâm lý học được kể lại nhiều nhất". Không có nguồn xếp hạng; đổi thành "nổi tiếng" (Watts gọi là "famous marshmallow study"). Câu "thành công ngày mai" là cách kể phổ biến, không phải khẳng định của site. Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích của nguồn (Watts 2018 toàn văn, Mischel 1972 toàn văn, tóm tắt các bài còn lại): câu mô tả cách kể phổ biến, đã làm mềm.'
    luot_2: dung
    luot_2_nguon: [ "https://gwern.net/doc/psychology/2018-watts.pdf" ]
    luot_2_ghi_chu: Phần mở đầu của Watts 2018 mô tả đúng mạch câu chuyện thường kể (chờ lâu liên quan thành tựu sau này).
    review: dung
  - id: n10
    cau: Trong các thí nghiệm gốc, thời gian chờ phụ thuộc mạnh vào cách trẻ hướng sự chú ý, chứ không chỉ vào "ý chí".
    loai: phat-hien
    nguon:
      - mischel1972
    trich: effective delay of gratification depended on cognitive avoidance or suppression of the reward objects during the waiting period
    vi_tri: Discussion, Experiments I-III
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "trẻ chờ được nhờ chiến thuật chứ không phải ý chí thép". Làm mềm: bài 1972 là điều kiện thí nghiệm, không phủ nhận khác biệt cá nhân bền (Mischel 1989: "Enduring individual differences in self-control were found as early as the preschool years"). Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích của nguồn (Watts 2018 toàn văn, Mischel 1972 toàn văn, tóm tắt các bài còn lại): khớp kết luận Mischel 1972 và đã làm mềm.'
    luot_2: dung
    luot_2_nguon: [ "https://www.uv.mx/iip/files/2016/08/Articulo-19-08-16.pdf" ]
    review: dung
  - id: n11
    cau: Mối liên hệ giữa thời gian chờ và kết quả sau này là tương quan, không phải nhân quả.
    loai: phat-hien
    nguon:
      - watts2018
    trich: These bivariate correlations were not adjusted for potential confounding factors that could affect both early delay ability and later outcomes.
    vi_tri: Introduction
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://gwern.net/doc/psychology/2018-watts.pdf", "https://doi.org/10.1016/j.jebo.2019.08.016", "https://doi.org/10.1111/cdev.14129" ]
    luot_2_ghi_chu: Các nghiên cứu theo dõi đều là quan sát, không gán ngẫu nhiên.
  - id: n12
    cau: Một phần lớn mối tương quan ấy có thể đến từ hoàn cảnh gia đình.
    loai: phat-hien
    nguon:
      - watts2018
    trich: associations between gratification delay and later outcomes are driven by factors unlikely to be altered by child-focused programs (e.g., socioeconomic status [SES], home parenting environment)
    vi_tri: 'Introduction (giả thuyết của tác giả); kết quả: giảm hai phần ba khi kiểm soát'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "phần lớn ... có thể đến từ"; giữ "một phần lớn ... có thể": kết quả giảm khoảng hai phần ba khi kiểm soát hoàn cảnh, nhưng đó là phân tích tương quan, không chứng minh nguyên nhân. Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích của nguồn (Watts 2018 toàn văn, Mischel 1972 toàn văn, tóm tắt các bài còn lại): có "có thể", Watts nêu đúng hướng này.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1177/0956797618761661" ]
    luot_2_ghi_chu: Câu viết dè dặt ("có thể"), đúng. Doebel và cộng sự 2020 (cùng bộ dữ liệu) diễn giải khác (hỗ trợ xã hội), vẫn là yếu tố môi trường.
    review: dung
  - id: n13
    cau: Nghiên cứu Mischel, Ebbesen và Zeiss (1972) gồm 3 thí nghiệm với 92 trẻ trong số trẻ phân tích.
    loai: so-lieu
    nguon:
      - mischel1972
    trich: The subjects were SO children (25 boys and 25 girls) from the Bmg Nursery School of Stanford University
    vi_tri: Thí nghiệm I (50 trẻ), II (32 trẻ, 6 bị loại, còn 26), III (16 trẻ)
    ket_qua: dung
    ghi_chu: Cộng 50 + 26 + 16 = 92 trẻ phân tích; chữ "SO" trong bản quét là "50". Trang cũ viết "92 trẻ 3–5 tuổi" khớp.
    luot_2: dung
    luot_2_nguon: [ "https://www.uv.mx/iip/files/2016/08/Articulo-19-08-16.pdf" ]
    luot_2_ghi_chu: 50 + 26 + 16 = 92 trẻ trong phân tích; sáu và sáu trẻ khác bị loại ở thí nghiệm I và II.
  - id: n14
    cau: Các trẻ có độ tuổi từ 3 tuổi 5 tháng đến 5 tuổi 6 tháng, ở trường mầm non Bing của Đại học Stanford.
    loai: so-lieu
    nguon:
      - mischel1972
    trich: They ranged in age from 3 years 6 months to 5 years 6 months, with a mean age of 4 years 6 months
    vi_tri: 'Thí nghiệm I; III: 3 tuổi 5 tháng đến 5 tuổi 6 tháng'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "3–5 tuổi"; mới nêu khoảng cụ thể (TN I: 3;6–5;6; TN II: 3;9–5;3; TN III: 3;5–5;6; gộp 3;5–5;6). Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích của nguồn (Watts 2018 toàn văn, Mischel 1972 toàn văn, tóm tắt các bài còn lại): khoảng tuổi chung 3;5–5;6 khớp ba thí nghiệm (đã đọc toàn văn).'
    luot_2: dung
    luot_2_nguon: [ "https://www.uv.mx/iip/files/2016/08/Articulo-19-08-16.pdf" ]
    luot_2_ghi_chu: Khoảng tuổi chung của ba thí nghiệm là 3 tuổi 5 tháng đến 5 tuổi 6 tháng.
    review: dung
  - id: n15
    cau: Mỗi trẻ chọn một trong hai phần thưởng (kẹo dẻo và bánh quy que); chờ người lớn tự quay lại (tối đa 15 phút) thì được phần mình chọn.
    loai: phat-hien
    nguon:
      - mischel1972
    trich: if you wait until I come back by myself then you can eat this one
    vi_tri: Thí nghiệm I, Delay-of-Gratification Contingency Instructions; "waiting to criterion (15 minutes)"
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "mỗi trẻ một mình trong phòng với một phần thưởng (kẹo dẻo, bánh quy...): ăn ngay được một, chờ người lớn quay lại (tối đa ~15–20 phút) được hai". Sai thiết kế: bài 1972 cho chọn giữa hai phần thưởng (marshmallow và pretzel), chờ thì được phần ưa thích, bấm chuông thì được phần kia; tối đa 15 phút (không phải 15–20). Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích của nguồn (Watts 2018 toàn văn, Mischel 1972 toàn văn, tóm tắt các bài còn lại): khớp thiết kế TN I (đọc toàn văn: chọn marshmallow hay pretzel, bấm chuông thì được phần kia).'
    luot_2: dung
    luot_2_nguon: [ "https://www.uv.mx/iip/files/2016/08/Articulo-19-08-16.pdf" ]
