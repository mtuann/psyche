  - id: n42
    cau: 'Khá vững: thời gian chờ đợi tương quan với một số kết quả tuổi teen trong mẫu gốc (và, ở mức nhỏ hơn, trong lần làm lại).'
    loai: nhan
    nguon:
      - watts2018
      - mischel1988
    trich: this bivariate correlation was only half the size of those reported in the original studies
    vi_tri: Abstract Watts; tóm tắt Mischel 1988
    nhan: kha-vung
    co_so:
      - watts2018
      - mischel1988
      - mischel1989
      - shoda1990
    ly_do: 'Có tương quan trong mẫu gốc (nhỏ, đặc thù) và một tương quan đơn giản nhỏ hơn trong một lần làm lại lớn hơn (Watts 2018); chưa có tái lập trực tiếp lớn và còn gây nhiễu: đúng mô tả "nhiều nghiên cứu cùng chiều nhưng còn giới hạn". Opus xét lại: giữ Khá vững.'
    ket_qua: da-sua
    ghi_chu: 'Giữ Khá vững; thêm câu: lần làm lại 2018 cũng thấy tương quan đơn giản (nhỏ hơn); bỏ "con em trí thức Stanford", thay "cộng đồng Đại học Stanford". Review (Claude Sonnet 5.5, 30/10/2026): nhãn Khá vững, sát ranh Đang tranh cãi. Đã đọc Watts 2018 toàn văn (gwern.net): Bảng 4, n = 552, tương quan đơn giản β = 0,24 với thành tích tuổi 15 (bằng khoảng một nửa bản gốc), còn 0,08 rồi 0,05 khi thêm biến kiểm soát; Doebel 2020 thấy ba trong năm chỉ số còn ý nghĩa. Nhãn chỉ nói về sự tồn tại của tương quan ở tuổi teen (có ở bản gốc lẫn lần làm lại lớn hơn, cùng chiều) và khung đã ghi rõ "nhỏ hơn", "không cho cách diễn giải"; kết quả không dự đoán ở tuổi trưởng thành nằm ở khung Đã bị bác bỏ. Giữ Khá vững (Đang tranh cãi chỉ hợp nếu khung nói tương quan còn vững sau kiểm soát).'
    luot_2: dung
    luot_2_nguon: [ "https://gwern.net/doc/psychology/2018-watts.pdf", "https://doi.org/10.1177/0956797619896270", "https://doi.org/10.1111/cdev.14129" ]
    luot_2_ghi_chu: 'Sát ranh giới Khá vững với Đang tranh cãi: tương quan có ở bản gốc và ở Watts (đơn biến, rồi nhỏ hơn khi kiểm soát; Doebel 2020 thấy ba trong năm chỉ số có ý nghĩa), nhưng Sperber 2024 và Benjamin 2020 không thấy ở tuổi trưởng thành. Câu giới hạn ở kết quả tuổi teen và nói "nhỏ hơn", nên giữ Khá vững; không được viết cao hơn.'
    review: dung
  - id: n43
    cau: 'Đã bị bác bỏ: thời gian chờ kẹo dẻo lúc nhỏ "định đoạt" tương lai.'
    loai: nhan
    nguon:
      - watts2018
      - benjamin2020
      - sperber2024
    trich: As predicted, a newly constructed and pre-registered measure derived from preschool delay of gratification does not predict the 11 capital formation variables (i.e., the sign-adjusted average correlation was 0.02).
    vi_tri: tóm tắt Benjamin 2020; tóm tắt Sperber 2024; Watts 2018 Abstract
    nhan: bac-bo
    co_so:
      - watts2018
      - benjamin2020
      - sperber2024
    ly_do: 'Khẳng định mạnh ("định đoạt tương lai") đã qua ba lần kiểm tra đủ lớn, độc lập với cách kể phổ biến, đều thất bại: Watts 2018 (552 trẻ, liên hệ giảm còn hệ số 0,05–0,08), Benjamin 2020 (có đăng ký trước, 113 người của mẫu Bing gốc ở tuổi gần 50, r trung bình 0,02 với 11 kết quả), Sperber 2024 (có đăng ký trước, 702 người ở tuổi 26, gần như mọi hệ số sau điều chỉnh không có ý nghĩa). Đạt "các kiểm tra đủ mạnh liên tục thất bại" của Đã bị bác bỏ (mục 4). Nhãn chỉ nói về khẳng định "định đoạt", không về tương quan nhỏ (khung Khá vững n42).'
    ket_qua: da-sua
    ghi_chu: 'chỗ khó (Opus): lượt 1 hạ Đã bị bác bỏ của site cũ xuống Đang tranh cãi vì chỉ có Watts 2018. Opus mở được tóm tắt hai phân tích có đăng ký trước (Benjamin 2020, Sperber 2024), nên khôi phục Đã bị bác bỏ, thu hẹp tên khung. Chữ lượt 1: ":::tranh-cai["viên kẹo dẻo đo ý chí và định đoạt tương lai"] … Mức độ chắc chắn dừng ở đang tranh cãi vì chúng tôi chưa dẫn được nhiều lần làm lại độc lập…". Mới: ":::bac-bo[thời gian chờ kẹo dẻo lúc nhỏ "định đoạt" tương lai]", thêm n67, n68. Phần "đo ý chí" chuyển hẳn sang mục Ngộ nhận (đã có). Review (Claude Sonnet 5.5, 30/10/2026): nhãn Đã bị bác bỏ, đúng thước đo mục 4 cho riêng ý "định đoạt": ba kiểm tra đủ mạnh cùng thất bại (Watts 2018 n = 552; Benjamin 2020 có đăng ký trước, 113 người, r = 0,02; Sperber 2024 có đăng ký trước, n = 702). Đã đọc tóm tắt hai bài sau qua OpenAlex/PubMed (trích có chữ "pre-registered"/"preregistered"). Khung nói rõ không bác tương quan nhỏ (n42). Chấp nhận.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1016/j.jebo.2019.08.016", "https://doi.org/10.1111/cdev.14129", "https://gwern.net/doc/psychology/2018-watts.pdf" ]
    luot_2_ghi_chu: 'Ý "định đoạt" (tiền định) không có bằng chứng: tương quan nửa bản gốc, giảm tiếp khi kiểm soát, và hai phân tích đăng ký trước ở tuổi trưởng thành không thấy dự đoán. Nhãn Đã bị bác bỏ đúng cho ý "định đoạt", không cho mọi tương quan.'
    review: dung
