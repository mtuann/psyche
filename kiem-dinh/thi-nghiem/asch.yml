    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Cách chống: thu thập ý kiến viết, ẩn danh, trước khi thảo luận miệng. Người điều phối khôn ngoan luôn hỏi người ít quyền nhất trước" (không nguồn); chữ mới dựa vào Thí nghiệm 4 (n = 14; 12,5% so với 36,8%) và nói thẳng nó không thử ẩn danh hay thứ tự phát biểu. Review (Claude Opus 5.5, 30/10/2026): Review mở Asch 1956 (toàn văn, bản quét có chữ) Thí nghiệm 4: 14 người, trung bình 1,50 lỗi (12,5%), "about one-third of the errors found in Experiment 1"; nhưng Asch viết tiếp "Because of the small number of cases… we cannot establish a conclusive difference statistically between the two conditions" (chỉ so với nhóm đối chứng là có ý nghĩa). Câu cũ thiếu giới hạn ấy; đã thêm "nên chính Asch nói chưa chứng minh được chênh lệch bằng thống kê" ở mục Áp dụng. Câu hỏi 5 giữ "(mẫu nhỏ)".'
