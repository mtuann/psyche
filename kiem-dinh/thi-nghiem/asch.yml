    cau: 'Vững chắc: một nhóm nhất trí làm lệch phán đoán công khai, kể cả với bài toán rõ ràng.'
    loai: nhan
    nguon:
      - bond1996
      - franzen2023
      - asch1956
    trich: An analysis of U.S. studies found that conformity has declined since the 1950s.
    vi_tri: Tóm tắt
    nhan: vung-chac
    co_so:
      - bond1996
      - franzen2023
      - asch1956
    ly_do: 'Đạt Vững chắc theo mục 4: có một phân tích tổng hợp chất lượng tốt (Bond & Smith 1996, toàn văn: 133 nghiên cứu dùng đúng bài so độ dài, 17 nước), cùng chiều ở mọi nước (khác nhau về mức), tức đúng ở nhiều quần thể; lần làm lại năm 2023 (Franzen & Mader, 210 người, lỗi 33%; có thưởng tiền vẫn 25%) khớp bản gốc. Các nguồn đã mở không nêu thất bại tái lập lớn nào chưa giải thích. Giới hạn ghi rõ trên trang: mức hùa theo giảm theo thời gian (ở các nghiên cứu Mỹ) và khác giữa các nền văn hóa. Không có tái lập đăng ký trước nào đã mở, nhưng thước đo chỉ đòi phân tích tổng hợp hoặc hai tái lập ấy.'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "lặp lại hàng trăm lần trong 70 năm. Các yếu tố điều chỉnh cũng ổn định: …nhóm khoảng 3 người là đủ"; chữ mới: 133 nghiên cứu / 17 nước và lần làm lại 2023; bỏ "hàng trăm" (không đếm được) và "3 người là đủ" (bị thách thức). chỗ khó: thước đo Vững chắc cần phân tích tổng hợp hoặc hai tái lập lớn đăng ký trước; có phân tích tổng hợp lớn, nhưng chưa mở được bài tái lập đăng ký trước nào; người giao/lượt 2 cân nhắc xuống Khá vững. Chỗ khó (Claude Opus 5.5): giữ Vững chắc: điều kiện "ít nhất một phân tích tổng hợp chất lượng tốt" đã đạt (B&S 1996, Psychol Bull), và nhãn chỉ nói hiệu ứng có thật, không nói độ lớn. Franzen & Mader 2023 chỉ đọc tóm tắt (không biết có đăng ký trước). Review (Claude Opus 5.5, 30/10/2026): Vững chắc hợp mục 4: một phân tích tổng hợp chất lượng tốt (Bond & Smith 1996 (toàn văn): 133 nghiên cứu, 17 nước), cùng chiều ở mọi nước, cộng tái lập 2023; không có thất bại tái lập lớn trong các nguồn đã mở. Nhãn chỉ nói hiệu ứng có thật, không nói độ lớn; giới hạn (giảm theo thời gian, khác giữa văn hóa) ghi trên trang.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.119.1.111", "https://doi.org/10.1371/journal.pone.0294325", "https://doi.org/10.1037/amp0000469" ]
    luot_2_ghi_chu: "Khớp thước đo Vững chắc cho nhận định hẹp này: có phân tích tổng hợp, cùng chiều, nhiều nước. Lưu ý mức hùa theo giảm theo thời gian ở Mỹ và biến thiên giữa nghiên cứu; không có tái lập lớn đăng ký trước mà tôi biết, nhưng cũng không có thất bại tái lập lớn."
    review: dung
