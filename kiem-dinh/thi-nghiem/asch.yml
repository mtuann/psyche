    ghi_chu: 'B&S cũng tóm tắt lại: Asch (1951) thấy ít hùa theo khi đa số 1–2 người, tăng mạnh ở 3 người, tăng thêm không đáng kể; kết luận này bị Latané & Wolf (1981) và Tanford & Penrod (1984) thách thức (tr. 114–115). Review (Claude Opus 5.5, 30/10/2026): Lượt 2 chỉ đọc tóm tắt; review mở Bond & Smith 1996 (toàn văn) tr. 115: kết luận "majority of three is sufficient… has been challenged by Latané and Wolf (1981) and Tanford and Penrod (1984)"; tr. 119: "Majority size represented by Tanford and Penrod''s (1984) SIM was significantly related to conformity". Đúng.'
