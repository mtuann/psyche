nhan_dinh:
  - id: n1
    cau: Asch (1951, 1956) cho người tham gia so sánh độ dài đường thẳng trước một nhóm "chim mồi" nói sai có chủ đích đồng loạt.
    loai: phat-hien
    nguon:
      - asch1956
    trich: All but one of the group had met previously with the experimenter and were instructed to respond on certain trials with wrong and unanimous judgments.
    vi_tri: Mục II.A
    ket_qua: dung
    ghi_chu: Câu mô tả (description) của trang. Bài 1951 (Guetzkow) không mở được; chỉ dựa vào bài 1956, ghi cả hai năm vì trang gọi tên cả hai.
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty" ]
    luot_2_ghi_chu: Năm 1951/1956 là các công bố khác của Asch; mô tả thiết kế khớp Asch 1955 (cùng loạt).
  - id: n2
    cau: Trong các lượt gài bẫy, khoảng 37% (36,8%) câu trả lời hùa theo nhóm.
    loai: so-lieu
    nguon:
      - asch1956
