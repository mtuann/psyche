    trich: under group pressure the minority subjects swung to acceptance of the misleading majority's wrong judgments in 36.8 per cent of the selections
    vi_tri: Asch 1955; bảng 3 của bài 1956 (N = 123, trung bình 36,8%)
    ket_qua: dung
    ghi_chu: 'Dùng cho mô tả, đáp án ô thu gọn, hộp hồ sơ. Bài 1956 (bản quét): bảng 3, dòng "All experimental (N=123)": 36.8.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty" ]
  - id: n3
    cau: Ba phần tư số người tham gia hùa theo ít nhất một lần.
    loai: so-lieu
    nguon:
      - asch1956
    trich: Only one-fourth of the subjects in the three experimental groups showed errorless performances
    vi_tri: Mục III, kết quả định lượng, tr. 9–10
    ket_qua: dung
    ghi_chu: '29 trên 123 người không sai lần nào (bảng 3): 24%, nên khoảng 76% hùa theo ít nhất một lần.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty" ]
