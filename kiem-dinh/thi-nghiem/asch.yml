    vi_tri: Asch 1955, đoạn kết quả; bảng 3 (29/123)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty" ]
  - id: n17
    cau: Nhóm 3 người đã tạo ra gần như toàn bộ áp lực; thêm người nữa không tăng đáng kể (Asch, 1955).
    loai: phat-hien
    nguon:
      - asch1955
    trich: But further increases in the size of the majority apparently did not increase the weight of the pressure substantially.
    vi_tri: Asch 1955, đoạn về quy mô đa số
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: dẫn Asch 1956 và nói chắc "nhóm 3 người đã tạo gần như toàn bộ áp lực"; bài 1956 không có biến thể quy mô nhóm. Chữ mới dẫn Asch 1955 (đa số 1 người: ít hùa theo; 2 người: 13,6%; 3 người: 31,8%; thêm người nữa không tăng đáng kể) và thêm lưu ý của Bond và Smith. Trang không nêu các con số này. Review (Claude Opus 5.5, 30/10/2026): Asch 1955 (toàn văn, bản đăng lại) (đoạn về quy mô đa số) và Bond & Smith 1996 (toàn văn) tr. 115 (Asch 1951). Trang dẫn Asch 1955, kèm lưu ý của Bond & Smith.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty" ]
    luot_2_ghi_chu: Đúng cho dữ liệu Asch; xem n19 cho các phân tích sau.
    review: dung
  - id: n18
    cau: Chỉ cần một người cùng phòng nói đúng, tỉ lệ sai còn khoảng một phần tư so với khi cả nhóm nhất trí.
    loai: so-lieu
    nguon:
      - asch1955
    trich: 'Its pressure on the dissenting individual was reduced to one fourth: that is, subjects answered incorrectly only one fourth as often as under the pressure of a unanimous majority.'
    vi_tri: Asch 1955, đoạn về người cùng phòng đồng tình
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chỉ cần một chim mồi nói đúng (phá vỡ sự nhất trí), tỉ lệ hùa theo sụt mạnh ([Asch, 1956])"; chữ mới: "chỉ cần một người cùng phòng nói đúng… còn khoảng một phần tư". Lý do: biến thể này là của Asch 1951/1955, không có trong bài 1956; "một chim mồi nói đúng" chưa chính xác: người đồng tình là người thật không biết sắp đặt hoặc người được dặn nói đúng. Dùng ở Kết quả, Mức độ chắc chắn, Áp dụng và câu hỏi. Review (Claude Opus 5.5, 30/10/2026): Asch 1955 (toàn văn, bản đăng lại): "subjects answered incorrectly only one fourth as often as under the pressure of a unanimous majority". Trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty" ]
    review: dung
