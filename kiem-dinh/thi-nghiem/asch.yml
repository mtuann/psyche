    review: dung
  - id: n60
    cau: 'Một số nghiên cứu sau này lại nghiêng về phía tri giác: khi người tham gia hùa theo nhóm trong một bài xoay hình trong đầu, hoạt động của một mạng vùng não ở thùy chẩm và thùy đỉnh thay đổi (Berns và cộng sự, 2005); hai thí nghiệm dùng mô hình tách các bước của quyết định thấy ý kiến của nhóm làm đổi cách tiếp nhận thông tin từ mắt, chứ không chỉ đổi ngưỡng trả lời (Germar và cộng sự, 2014); đó là nghiên cứu riêng lẻ, với bài toán khác bài của Asch, nên câu hỏi còn mở.'
    loai: phat-hien
    nguon:
      - berns2005
      - germar2014
    trich: Conformity was associated with functional changes in an occipital-parietal network, especially when the wrong information originated from other people. … In two experiments, we found consistent evidence for the idea that social influence alters the uptake of available sensory evidence. By contrast, participants did not adjust their decision criteria.
    vi_tri: Berns 2005, tóm tắt (Results); Germar 2014, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó (Claude Opus 5.5): Câu mới (chữ cũ: không có) trong khung Đang tranh cãi. "Thông tin từ mắt" dịch "sensory evidence" trong bài toán thị giác của Germar; "ngưỡng trả lời" dịch "decision criteria". Thêm Berns 2005 và Germar 2014 vào mục Nguồn của trang. Tóm tắt Berns còn nói "first biological evidence for the involvement of perceptual and emotional processes". Review (Claude Opus 5.5, 30/10/2026): Berns và cộng sự 2005 (tóm tắt PubMed), Germar và cộng sự 2014 (tóm tắt). Trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/15978553", "https://doi.org/10.1177/0146167213508985" ]
    luot_2_ghi_chu: Mô tả đúng; 'hai thí nghiệm' và 'bài toán khác Asch' khớp.
    review: dung
