  - id: n4
    cau: 'Hãy tưởng tượng: nhóm 7 người, hai tấm bìa (một đường mẫu, ba đường so sánh đánh số 1, 2, 3), người tham gia thật trả lời gần cuối, hai lượt đầu ai cũng đúng, đến lượt thứ ba nhóm đồng loạt nói sai.'
    loai: phat-hien
    nguon:
      - asch1956
    trich: The experiment opened with two neutral trials to which the majority responded correctly. On the third trial, the majority deviated from the correct value by 3/4 inches
    vi_tri: Mục II.B, cấu trúc nhiệm vụ
    ket_qua: da-sua
    ghi_chu: 'Tình huống giả định (gia-dinh) nhưng mô tả theo thiết kế gốc. Chữ cũ: "Ba lượt đầu, ai cũng trả lời đúng. Đến lượt thứ tư"; chữ mới: "Hai lượt đầu… lượt thứ ba". Lý do: bài 1956 có hai lượt trung tính mở đầu, lượt 3 là lượt đầu tiên nhóm nói sai. Số người trong nhóm (7–9) theo Asch; người tham gia thật ngồi ở ghế gần cuối (Hình 1). Review (Claude Opus 5.5, 30/10/2026): Asch 1956 (toàn văn, bản quét có chữ) mục II.B: hai lượt trung tính mở đầu, lượt 3 nhóm nói sai. Cảnh giả định khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty" ]
    luot_2_ghi_chu: Phần 'hãy tưởng tượng' khớp mô tả của Asch; 7 người nằm trong khoảng 7-9.
    review: dung
  - id: n5
    cau: Ở Asch, nhóm có 7–9 người, trong đó chỉ một người là người tham gia thật.
    loai: phat-hien
    nguon:
      - asch1956
      - bond1996
    trich: A group of seven to nine individuals was gathered in a classroom to take part in what appeared to be a simple experiment in visual discrimination.
    vi_tri: Mục II.A
    ket_qua: dung
    ghi_chu: 'Asch tự mô tả "nhóm 7–9 người" ở Mục II.A nhưng cũng viết "đa số gồm 7–9 người": B&S 1996 ghi nhận chỗ không nhất quán này. Trang dùng "nhóm 7–9 người".'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty" ]
  - id: n6
    cau: Người tham gia thật là người trả lời gần cuối (ghế kế cuối).
    loai: phat-hien
    nguon:
      - asch1956
    trich: the critical subject was in the next to the last seat in the second row
    vi_tri: Mục II.B, Hình 1
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty", "https://doi.org/10.1371/journal.pone.0294325" ]
  - id: n7
    cau: 'Cái giá của việc nói khác đi trở nên đắt đỏ: sợ bị chê cười, sợ mình nhìn nhầm, sợ trở thành kẻ lập dị.'
    loai: phat-hien
    nguon:
      - asch1956
    trich: Some, including the most independent, feared that the group would disapprove of them for standing out or would suspect them of exhibitionism or wilful stubbornness.
    vi_tri: Mục phỏng vấn sau thí nghiệm
    ket_qua: dung
    ghi_chu: Lời kể của người tham gia trong phỏng vấn; "sợ mình nhìn nhầm" khớp các lời kể như "I wasn't ever absolutely sure". Không phải mô tả cơ chế.
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty", "https://openstax.org/books/psychology-2e/pages/12-4-conformity-compliance-and-obedience" ]
    luot_2_ghi_chu: Đây là diễn giải của trang; 'sợ bị chê cười' rõ ở OpenStax, 'sợ nhìn nhầm' ('I am wrong, they are right') và 'lập dị' (thiếu sót mà phải che giấu) ở Asch 1955.
  - id: n8
    cau: Asch làm thí nghiệm vào đầu thập niên 1950, khi các nghiên cứu trước đó cho thấy ý kiến đổi rất dễ chỉ vì sức nặng của số đông hay uy tín; ông nghi ngờ rằng ý kiến "nhạt như nước" đến thế.
    loai: lich-su
    nguon:
      - asch1955
    trich: Now the very ease of success in these experiments arouses suspicion.
    vi_tri: Asch 1955, đoạn mở đầu
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "khi ông muốn phản bác một ý tưởng đang thịnh hành: rằng con người dễ dàng bị đám đông nuốt chửng"; chữ mới như trên. Lý do: động cơ "phản bác" không có trong nguồn; Asch (1955) nói các thắng lợi quá dễ của các nghiên cứu trước làm ông nghi ngờ, và đặt câu hỏi liệu ý kiến có "watery" đến vậy (đoạn kế tiếp). Bản 1955 là bản đăng lại ở panarchy.org (bậc 3 về nơi đăng, bài của chính Asch). Review (Claude Opus 5.5, 30/10/2026): Asch 1955 (toàn văn, bản đăng lại), đoạn mở đầu ("the very ease of success… arouses suspicion"; "watery"). Trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty" ]
    review: dung
  - id: n9
    cau: Đa số câu trả lời (63%) không hùa theo.
    loai: so-lieu
    nguon:
      - asch1956
      - asch1955
    trich: Despite this large effect, the preponderance of judgments was independent
    vi_tri: Mục III.E, tóm tắt định lượng
    ket_qua: dung
    ghi_chu: 100 − 36,8 = 63,2%.
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty" ]
    luot_2_ghi_chu: 63% là phép trừ từ 36,8%.
  - id: n10
    cau: 'Khi làm một mình (nhóm đối chứng), người ta gần như không sai: 0,7% câu trả lời sai.'
    loai: so-lieu
    nguon:
      - asch1956
    trich: in contrast with errors of less than 1 per cent under control conditions
    vi_tri: Bảng 3, nhóm đối chứng (N = 37)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "vì bài toán dễ đến mức trẻ con cũng làm đúng" (không có trong nguồn); chữ mới: "khi làm một mình, người ta gần như không sai (0,7%)". Bảng 3: nhóm đối chứng 35/37 người không sai, trung bình sai 0,7%. Review (Claude Opus 5.5, 30/10/2026): Lượt 2 không đọc được bài 1956; review mở Asch 1956 (toàn văn, bản quét có chữ) tr. 9–10 và Bảng 3: nhóm đối chứng N = 37, "Thirty-five of 37 subjects made errorless estimates", trung bình 0,7%. Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty" ]
    luot_2_ghi_chu: Asch 1955 (Sci Am) chỉ nói 'dưới 1%' ở điều kiện bình thường; con số chính xác 0,7% (nhóm đối chứng, Asch 1956) chưa đọc được trực tiếp. Hướng đúng (rất ít sai) khớp.
    review: dung
  - id: n11
    cau: Thí nghiệm có tổng cộng 123 người tham gia thật, đều là nam sinh viên đại học, ở ba trường.
    loai: so-lieu
    nguon:
      - asch1956
    trich: The subjects were all male, white college students, ranging in age from 17 to 25
    vi_tri: Mục II.A
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "123 nam sinh viên Mỹ"; chữ mới: "123 nam sinh viên đại học, ở ba trường". Lý do: bài 1956 không nêu nước, chỉ nói "ba cơ sở giáo dục" ẩn danh; "Mỹ" là suy ra. Ba nhóm: I (n = 70), II (25), III (28). Review (Claude Opus 5.5, 30/10/2026): Asch 1956 (toàn văn, bản quét có chữ) mục II.A ("three institutions", nam, da trắng, 17–25 tuổi); Bảng 3: nhóm I 70, II 25, III 28 = 123. Trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty" ]
    review: dung
  - id: n12
    cau: Mỗi người làm 18 lượt so sánh độ dài đường thẳng; 12 lượt là "gài bẫy" (nhóm đồng loạt nói sai), 6 lượt trung tính.
    loai: so-lieu
    nguon:
      - asch1956
    trich: They consisted of 12 critical and 6 neutral trials, distributed in a random order.
    vi_tri: Mục II.C (Experiment 1)
    ket_qua: dung
    ghi_chu: Câu "18 such comparisons" ở Mục II.A; 12 lượt gài bẫy ở "Critical trials".
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty" ]
    luot_2_ghi_chu: 6 lượt còn lại là lượt đa số trả lời đúng (trung tính), khớp 'occasionally reports correctly'.
  - id: n13
    cau: Ở các lượt gài bẫy, các chim mồi đồng loạt đưa ra cùng một đáp án sai rõ ràng (chênh từ 3/4 đến 1 3/4 inch).
    loai: phat-hien
    nguon:
      - asch1956
    trich: departed from the true value by amounts ranging from 3/4 to 1 3/4 inches
    vi_tri: Mục II.A
    ket_qua: dung
    ghi_chu: Trang chỉ nói "sai rõ ràng", không nêu con số.
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty" ]
  - id: n14
    cau: 'Bài toán dễ: người so sánh đường thẳng một mình gần như không sai (đối chứng 95% người không sai lần nào).'
    loai: so-lieu
    nguon:
      - asch1956
    trich: in the control group 95 per cent
    vi_tri: Mục III, bảng 3
    ket_qua: dung
    ghi_chu: 'Dùng cho câu "bài toán dễ" ở Điều gì đang xảy ra. Review (Claude Opus 5.5, 30/10/2026): Review mở Asch 1956 (toàn văn, bản quét có chữ) tr. 9: "while in the control group 95 per cent" (35/37) không sai lần nào. Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty" ]
    luot_2_ghi_chu: Chỉ có 'dưới 1% sai' ở Asch 1955; con số '95% không sai lần nào' ở nhóm đối chứng (Asch 1956) chưa đọc được trực tiếp.
    review: dung
  - id: n15
    cau: 'Hộp hồ sơ, dòng Kết quả chính: 36,8% câu trả lời hùa theo nhóm sai (đối chứng 0,7%), khoảng ba phần tư số người hùa theo ít nhất một lần.'
    loai: so-lieu
    nguon:
      - asch1956
      - asch1955
    trich: under group pressure the minority subjects swung to acceptance of the misleading majority's wrong judgments in 36.8 per cent of the selections
    vi_tri: Asch 1955; bảng 3, bài 1956
    ket_qua: dung
    ghi_chu: 'Dòng Kết quả chính của hộp hồ sơ; cùng câu với n2, n3 và n11 (đối chứng 0,7%). Review (Claude Opus 5.5, 30/10/2026): Review mở Asch 1956 (toàn văn, bản quét có chữ) Bảng 3: 36,8% (trung bình 4,41/12), đối chứng 0,7%; "Only one-fourth of the subjects in the three experimental groups showed errorless performances" nên ba phần tư sai ít nhất một lần. Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty" ]
