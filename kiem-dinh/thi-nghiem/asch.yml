  - id: n29
    cau: 'Đang tranh cãi: người hùa theo có thật sự "nhìn" khác đi không.'
    loai: nhan
    nguon:
      - asch1956
      - berns2005
      - germar2014
    trich: it would be too far-fetched to suppose, mainly because we have no means of comprehending, that there was an actual distortion in the perceived relation of lengths.
    vi_tri: Mục V (bàn luận về méo mó tri giác)
    nhan: tranh-cai
    co_so:
      - asch1956
      - berns2005
      - germar2014
    ly_do: 'Đang tranh cãi theo mục 4 (bằng chứng mâu thuẫn): Asch (1956), qua phỏng vấn, cho rằng méo mó chủ yếu ở khâu phán đoán và không xác lập được méo mó tri giác; còn Berns và cộng sự (2005, chụp cộng hưởng từ chức năng) thấy hùa theo đi kèm thay đổi ở mạng vùng não chẩm–đỉnh và kết luận có cả quá trình tri giác, Germar và cộng sự (2014, hai thí nghiệm, mô hình khuếch tán) thấy ảnh hưởng xã hội đổi cách tiếp nhận thông tin cảm giác chứ không đổi tiêu chí quyết định. Chưa có tổng hợp hay tái lập lớn nào ngã ngũ; các nghiên cứu mới dùng bài toán khác bài so độ dài.'
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó (Claude Opus 5.5): Khung cũ chỉ dựa vào lập luận của Asch (lượt 1 phần đầu ghi chỗ khó). Đã thêm hai nghiên cứu hiện đại nghiêng về phía tri giác (chỉ đọc tóm tắt) và câu "câu hỏi còn mở"; giữ nhãn Đang tranh cãi vì hai phía cùng có bằng chứng. Chữ cũ của khung giữ nguyên, thêm câu mới (n60). Chưa tìm tổng quan về câu hỏi này; lượt 2 có thể tìm. Review (Claude Opus 5.5, 30/10/2026): Đang tranh cãi hợp mục 4: Asch 1956 (toàn văn, bản quét có chữ) mục V (méo mó chủ yếu ở khâu phán đoán) đối lập với Berns và cộng sự 2005, Germar và cộng sự 2014 (tóm tắt), không có tổng hợp phân xử.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/15978553", "https://doi.org/10.1177/0146167213508985" ]
    luot_2_ghi_chu: "Hợp lý là Đang tranh cãi: bằng chứng hành vi/thần kinh mâu thuẫn về cơ chế; chưa có tổng hợp chốt."
    review: dung
  - id: n30
    cau: 'Asch (1956) thấy người hùa theo có những phản ứng rất khác nhau: số rất ít không nhận ra mình bị nhóm ảnh hưởng; một tỉ lệ đáng kể hùa theo khi lòng tin vào mắt mình bị lung lay; số khác không còn quan tâm đúng sai, chỉ muốn khỏi tỏ ra khác biệt.'
    loai: phat-hien
    nguon:
      - asch1956
    trich: A substantial proportion of subjects yielded once their confidence was shaken
    vi_tri: Mục tóm tắt, mục 14
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chính Asch đã phân loại: bóp méo tri giác (rất ít người), bóp méo phán đoán (kiểu phổ biến nhất…), bóp méo hành động (biết nhóm sai nhưng vẫn nói theo cho yên chuyện)". Bài 1956 (tóm tắt 14c–e): "a very few… unaware"; "a substantial proportion yielded once their confidence was shaken"; "others… dominated by an imperious desire not to appear different". Không có chữ "phổ biến nhất"; cũng không có "biết nhóm sai". Các tên "bóp méo tri giác/phán đoán/hành động" thuộc bài 1951 (không mở được) nên bỏ. Review (Claude Opus 5.5, 30/10/2026): Lượt 2 không đọc được bài 1956; review mở Asch 1956 (toàn văn, bản quét có chữ) tóm tắt mục 14(c)–(e): "A very few yielding subjects appeared unaware…", "A substantial proportion of subjects yielded once their confidence was shaken", "Others… dominated by an imperious desire not to appear different". Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://archive.org/details/solomon-asch_confirmaty" ]
    luot_2_ghi_chu: Ba kiểu phản ứng (méo tri giác, méo phán đoán, méo hành động) là từ Asch 1956 (Psychological Monographs), không mở được toàn văn. Asch 1955 chỉ xác nhận 'mọi người hùa theo đều đánh giá thấp tần suất mình hùa theo' và vài lý do (tin mình sai; không muốn làm hỏng kết quả; sợ khác biệt).
    review: dung
