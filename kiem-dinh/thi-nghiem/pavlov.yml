    luot_2_ghi_chu: "Hai thái cực đều sai: máy đếm nhịp dùng nhiều nhất (bài giảng I-VII), có còi/chuông điện (II, III, V); Thomas 1997 và Jarius & Wildemann 2015 bàn bằng chứng về chuông."
