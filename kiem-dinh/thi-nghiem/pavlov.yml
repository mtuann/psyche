  loai: lich-su
  nguon:
  - jarius2015
  ket_qua: null
  ghi_chu: 'chưa chắc: chỉ biết tên bài ("And Pavlov still rings a bell: summarising the evidence for the use of a bell in Pavlov''s iconic experiments on classical conditioning"), không mở được tóm tắt/toàn văn. Chỉ ghi tên như đã nói trên trang; người giao/lượt 2 xem có giữ không.'
- id: n38
  cau: Giáo trình mở trình bày điều kiện hóa cổ điển và thao tác như hai dạng học liên kết khác nhau.
  loai: dinh-nghia
  nguon:
  - openstax2e
