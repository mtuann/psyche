  vi_tri: OpenStax 6.2; 6.3 (Skinner)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Hai cơ chế này bổ sung cho nhau chứ không thay thế nhau"; "cổ điển là học dự báo; thao tác là học hành động" — viết lại thành mô tả liên hệ.'
- id: n39
  cau: Theo Schultz, Dayan và Montague (1997), các neuron dopamine ở linh trưởng có hoạt động dường như báo hiệu thay đổi hay sai số trong dự đoán phần thưởng; học được điều khiển bởi thay đổi trong kỳ vọng.
  loai: phat-hien
  nguon:
  - schultz1997
  trich: identifying dopaminergic neurons in the primate whose fluctuating output apparently signals changes or errors in the predictions of future salient and rewarding events
  vi_tri: tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "các mạch não xử lý phần thưởng mã hóa sai số dự báo — khớp đáng ngạc nhiên với mô hình toán học của Rescorla–Wagner". Tóm tắt Schultz nói "quantitative theories of adaptive optimizing control", không nêu Rescorla–Wagner: bỏ phần "khớp". Chỉ đọc tóm tắt.'
- id: n40
  cau: Liệu pháp phơi nhiễm đưa người học tiếp xúc với thứ gây sợ để họ dần quen; giải mẫn cảm có hệ thống (Wolpe, 1958) dùng thang bậc từ ít đến nhiều gây lo âu kết hợp thư giãn; giáo trình mở trình bày cả hai như kỹ thuật dựa trên điều kiện hóa cổ điển.
  loai: lam-sang
  nguon:
  - openstax2e
  trich: Joseph Wolpe (1958) refined Jones’s techniques, giving us systematic desensitization.
  vi_tri: OpenStax 6.2/16.2 (Types of Treatment)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "liệu pháp phơi nhiễm dùng chính nguyên tắc tắt dần ... để mối liên hệ sợ hãi yếu dần đi... một phản ứng đối nghịch lấn dần nỗi sợ". Mới theo OpenStax. Thêm lời nhắc gặp chuyên gia; không phải khuyên điều trị. Nguồn bậc 2 (giáo trình), chưa mở hướng dẫn lâm sàng (NICE/WHO).'
- id: n41
  cau: Phân tích tổng hợp 214 nghiên cứu thấy điều kiện hóa đánh giá (ghép vật trung tính với kích thích dễ chịu hay khó chịu) có hiệu ứng trung bình d = 0,52.
  loai: so-lieu
  nguon:
  - hofmann2010
  trich: Across a total of 214 studies included in the main sample, the mean EC effect was d = .52
  vi_tri: tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ về quảng cáo: "ghép sản phẩm với hình ảnh dễ chịu để cảm xúc tích cực lan sang thương hiệu — điều kiện hóa cổ điển phiên bản thương mại". Hofmann đo thí nghiệm, không đo quảng cáo thực tế; đã nói rõ trên trang.'
- id: n42
  cau: Điều kiện hóa vị giác có thể xảy ra sau một lần ghép đôi dù cách quãng nhiều giờ; có thể là một thích nghi tiến hóa.
