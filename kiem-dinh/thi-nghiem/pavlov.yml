    ghi_chu: 'chỗ khó (Opus): tên khung lượt 1 "chuông là kích thích chính, hay duy nhất" quá mạnh: Jarius & Wildemann 2015 dẫn bản Gantt, ở một con chó "The bell occupied first place among the sounds" (vol. I, p. 364), nên "chuông không phải kích thích chính" không bác được cho mọi thí nghiệm. Mới: "Pavlov chỉ dùng chuông, hay ngược lại, chưa từng dùng chuông". Chữ site cũ: "Pavlov lắc chuông tay trước mỗi bữa ăn của chó". Thân khung thay câu "Bài của họ chưa mở được toàn văn" bằng kết luận của Jarius & Wildemann. Review (Claude Sonnet 5.5, 30/10/2026): nhãn Đã bị bác bỏ cho hai khẳng định cực đoan ("chỉ dùng chuông", "chưa từng dùng chuông"). Đã đọc bảy bài giảng đầu (psychclassics): máy đếm nhịp 67 lần, "electric bell" 2 lần (bài giảng II, III), còi/buzzer, âm thoa, đèn, vật quay, nên "chỉ chuông" sai; Thomas 1997 (tóm tắt OpenAlex: báo cáo Science 1906, phim 1925–26, nghiên cứu kiểu Lamarck 1923 "described using a bell") và Jarius & Wildemann 2015 làm "chưa từng" sai. Chấp nhận; khung không nói gì về trọng tâm của từng bài.'
