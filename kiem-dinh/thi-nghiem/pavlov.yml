  - id: n18
    cau: 'Chú thích đạo đức: chó phải qua mổ nhỏ chuyển ống tuyến nước bọt ra da; theo chuẩn mực ngày nay, chẳng hạn chính sách của cơ quan y tế công cộng Mỹ (PHS Policy), nghiên cứu trên động vật phải được hội đồng đạo đức duyệt và tránh hay giảm thiểu đau đớn.'
    loai: loi-khuyen
    nguon:
      - pavlov1927
      - phs-policy
    trich: 'a preliminary minor operation ... PHS Policy: "Procedures with animals will avoid or minimize discomfort, distress, and pain to the animals"; nghiên cứu phải được IACUC duyệt'
    vi_tri: bài giảng II
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "phẫu thuật đặt lỗ rò ở tuyến nước bọt và thực quản — thủ thuật xâm lấn nặng nề... thời của Pavlov chưa có cơ chế đó". Bỏ "thực quản" (chưa thấy trong 7 bài giảng đầu, bài giảng sau chưa mở) và "chưa có cơ chế đó" (không kiểm được). Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích của nguồn: bỏ "thực quản"; phần chuẩn mực ngày nay là khuyến nghị chung, khớp trang. Review (Claude Sonnet 5.5, 30/10/2026): (ghi chú này thay cho "dung" ở trên) vế chuẩn mực "mọi thủ tục … đều phải qua hội đồng đạo đức và giảm thiểu đau đớn" không có nguồn trong hồ sơ. Đã đọc PHS Policy (olaw.nih.gov): IACUC phải duyệt, thủ tục phải "avoid or minimize discomfort, distress, and pain". Thu hẹp "mọi thủ tục" thành "nghiên cứu trên động vật" theo chính sách này; thêm nguon phs-policy. Chữ cũ trên trang: "mọi thủ tục trên động vật đều phải qua hội đồng đạo đức và tuân thủ nguyên tắc giảm thiểu đau đớn".'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Pavlov/lecture2.htm" ]
    luot_2_ghi_chu: Phần chuẩn mực ngày nay là khuyến nghị chung về đạo đức nghiên cứu động vật, không phải khẳng định về lịch sử.
