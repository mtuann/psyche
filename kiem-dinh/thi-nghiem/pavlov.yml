    trich: laboratory studies have shown that conditioned fears are easy to extinguish, but they recover easily
    vi_tri: tóm tắt Vervliet 2013; Pavlov 1927 bài giảng IV ("Left to themselves extinguished conditioned reflexes spontaneously recover their full strength")
    nhan: vung-chac
    co_so:
