nhan_dinh:
  - id: n1
    cau: Ivan Pavlov phát hiện phản xạ "có điều kiện" khi đo nước bọt của chó, từ "tiết dịch tâm lý".
    loai: lich-su
    nguon:
      - pavlov1927
      - openstax2e
    trich: I had to inquire into the so-called psychic secretion of some of the glands
    vi_tri: Pavlov 1927, bài giảng I; OpenStax 6.2
    ket_qua: dung
    ghi_chu: Câu mô tả (description) của trang.
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Pavlov/lecture1.htm", "https://psychclassics.yorku.ca/Pavlov/lecture2.htm" ]
  - id: n2
    cau: 'Hộp hồ sơ: Pavlov và cộng sự; tổng kết bằng tiếng Anh năm 1927, G. V. Anrep dịch.'
    loai: lich-su
    nguon:
      - pavlov1927
    trich: Translated by G. V. Anrep (1927)
    vi_tri: trang đầu của bản psychclassics
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Pavlov/" ]
  - id: n3
    cau: Công việc do hơn một trăm cộng sự thực hiện suốt khoảng 25 năm (đến 1927).
    loai: lich-su
    nguon:
      - pavlov1927
    trich: over a hundred collaborators have taken part
    vi_tri: bài giảng I
    ket_qua: dung
    ghi_chu: 'Pavlov: "gone on now for twenty-five years" và "over a hundred collaborators".'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Pavlov/lecture1.htm" ]
  - id: n4
    cau: Các chó được mổ nhỏ để chuyển lỗ mở của ống tuyến nước bọt ra da (má hoặc dưới cằm), và nước bọt được đo bằng giọt.
    loai: phat-hien
    nguon:
      - pavlov1927
    trich: a preliminary minor operation, which consists in the transplantation of the opening of the salivary duct from its natural place on the mucous membrane of the mouth to the outside skin
    vi_tri: bài giảng II
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "phẫu thuật đặt lỗ rò (fistula) ở tuyến nước bọt của chó, hứng dịch tiết vào ống đong từng giọt". Mới theo Pavlov: chuyển ống tuyến ra da; số đo bằng giọt (ghi chú [2] bài giảng II). "Ống đong" bỏ. Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích của nguồn: khớp bài giảng II, chú thích về ống tuyến và đo giọt.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Pavlov/lecture2.htm" ]
    review: dung
  - id: n5
    cau: Một kích thích trung tính (thường là máy đếm nhịp) vang lên trước khi thức ăn đến; sau nhiều lần ghép đôi, kích thích ấy tự nó gây tiết nước bọt.
    loai: phat-hien
    nguon:
      - pavlov1927
    trich: if the intake of food by the animal takes place simultaneously with the action of a neutral stimulus which has been hitherto in no way related to food, the neutral stimulus readily acquires the property of eliciting the same reaction
    vi_tri: bài giảng II
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Pavlov/lecture2.htm" ]
  - id: n6
    cau: Quan niệm phản xạ cổ điển, bắt nguồn từ Descartes, coi một kích thích gắn tất yếu với một đáp ứng.
    loai: lich-su
    nguon:
      - pavlov1927
    trich: Our starting point has been Descartes' idea of the nervous reflex
    vi_tri: bài giảng I
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trước Pavlov, người ta tưởng phản xạ là chuyện máy móc... Pavlov phát hiện có một loại phản xạ thứ hai — phản xạ học được". "Tưởng ... máy móc" không có trong nguồn dưới dạng ấy; viết theo chữ Pavlov ("a stimulus appears to be connected of necessity with a definite response"). Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích của nguồn: viết theo chữ Pavlov (Descartes, "of necessity"), khớp trang.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Pavlov/lecture1.htm" ]
    review: dung
  - id: n7
    cau: 'Pavlov mô tả thêm một loại phản xạ hình thành qua kinh nghiệm: âm thanh trung tính sau khi đi đôi với thức ăn trở thành "tín hiệu" (signal) báo thức ăn.'
    loai: phat-hien
    nguon:
      - pavlov1927
    trich: any external stimulus which is to become the signal in a conditioned reflex must overlap in point of time with the action of an unconditioned stimulus
    vi_tri: bài giảng II
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Bộ não đã học được một dự báo". Mới dùng chữ "tín hiệu" (signalization) của Pavlov. Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích của nguồn: dùng chữ "signal" của Pavlov, khớp trang.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Pavlov/lecture1.htm", "https://psychclassics.yorku.ca/Pavlov/lecture2.htm" ]
    review: dung
  - id: n8
    cau: Đây là phản xạ, không phải hành vi cố ý; điều kiện hóa cổ điển liên quan đến những phản ứng tự động của cơ thể.
    loai: phat-hien
    nguon:
      - pavlov1927
      - openstax2e
    trich: a stimulus appears to be connected of necessity with a definite response, as cause with effect
    vi_tri: 'bài giảng I; OpenStax 6.2: "Salivating to food in the mouth is reflexive"'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Điều kiện hóa cổ điển nắn chính những phản ứng tự động". Câu ví dụ "không quyết định thấy thèm khi ngửi mùi phở" là minh họa (gia-dinh). Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích của nguồn: làm mềm đúng; câu ví dụ phở là minh họa.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Pavlov/lecture1.htm", "https://psychclassics.yorku.ca/Pavlov/lecture2.htm" ]
    luot_2_ghi_chu: Pavlov gọi là phản xạ (reflex) hình thành qua kinh nghiệm, đo bằng tiết nước bọt.
    review: dung
  - id: n9
    cau: Pavlov (1849–1936) là nhà sinh lý học người Nga, ban đầu nghiên cứu tiêu hóa ở chó.
    loai: lich-su
    nguon:
      - openstax2e
      - nobel1904
    trich: Pavlov was a physiologist, not a psychologist.
    vi_tri: OpenStax 6.2; Nobel 1904 ("physiology of digestion")
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Pavlov/lecture1.htm" ]
    luot_2_ghi_chu: Pavlov (1849-1936) là nhà sinh lý học Nga; nghiên cứu tiêu hóa được nhắc ở bài giảng I. Năm sinh/mất theo giải Nobel (n46).
  - id: n10
    cau: Chó bắt đầu chảy nước miếng khi chỉ nhìn thấy thức ăn, cái bát quen thuộc, hay nghe tiếng chân người cho ăn.
    loai: phat-hien
    nguon:
      - openstax2e
    trich: the dogs began to salivate not only at the taste of food, but also at the sight of food, at the sight of an empty food bowl, and even at the sound of the laboratory assistants' footsteps
    vi_tri: OpenStax 6.2 (kể lại Pavlov 1927)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cái bát quen thuộc, hay người thường cho chúng ăn". Mới theo OpenStax: nhìn thức ăn, bát rỗng, tiếng chân của người phụ tá. Nguồn bậc 2. Review (Claude Sonnet 5.5, 30/10/2026): trang vẫn ghi chữ cũ "cái bát quen thuộc, hay người thường cho chúng ăn" trong khi câu của hồ sơ (theo OpenStax) là bát rỗng và tiếng chân người phụ tá. Đã sửa trang: "nhìn thấy thức ăn, nhìn cái bát rỗng, hay nghe tiếng chân của người phụ tá". Đã đọc OpenStax 6.2 ("the sight of an empty food bowl, and even at the sound of the laboratory assistants'' footsteps").'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Pavlov/lecture1.htm" ]
    review: sai
  - id: n11
    cau: Pavlov gọi hiện tượng đó là "tiết dịch tâm lý" (psychic secretions).
    loai: lich-su
    nguon:
      - openstax2e
      - pavlov1927
    trich: what he called the dogs' “psychic secretions” (Pavlov, 1927)
    vi_tri: OpenStax 6.2; Pavlov bài giảng I
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Pavlov/lecture1.htm" ]
  - id: n12
    cau: Pavlov tái tạo hiện tượng trong phòng thí nghiệm, dùng thịt bột làm kích thích không điều kiện.
    loai: phat-hien
    nguon:
      - openstax2e
    trich: the dogs salivated each time meat powder was presented to them. The meat powder in this situation was an unconditioned stimulus
    vi_tri: OpenStax 6.2
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Pavlov/lecture8.htm" ]
    luot_2_ghi_chu: Thịt bột (meat powder) được dùng trong nhiều thí nghiệm; không phải mọi thí nghiệm.
  - id: n13
    cau: 'Các thành phần được đặt tên: kích thích có điều kiện, kích thích không điều kiện, đáp ứng không điều kiện, đáp ứng có điều kiện.'
    loai: dinh-nghia
    nguon:
      - openstax2e
    trich: the neutral stimulus became the conditioned stimulus (CS)
    vi_tri: OpenStax 6.2
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Pavlov/lecture2.htm", "https://psychclassics.yorku.ca/Pavlov/lecture3.htm" ]
    luot_2_ghi_chu: Các thuật ngữ conditioned/unconditioned stimulus và reflex nằm ở bài giảng II-III; định nghĩa chuẩn, đúng.
  - id: n14
    cau: 'Tắt dần: nếu kích thích có điều kiện lặp lại mãi mà không còn thức ăn, đáp ứng dần biến mất.'
    loai: phat-hien
    nguon:
      - pavlov1927
      - openstax2e
    trich: extinguished conditioned reflexes spontaneously recover their full strength after a longer or shorter interval of time
    vi_tri: bài giảng IV (nói về tắt dần và phục hồi); OpenStax 6.2 mục extinction
    ket_qua: dung
    ghi_chu: Trích Pavlov dùng cho "phục hồi tự nhiên"; "tắt dần" là chính chủ đề bài giảng IV.
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Pavlov/lecture4.htm" ]
  - id: n15
    cau: 'Phục hồi tự nhiên: sau một thời gian nghỉ, đáp ứng đã tắt có thể trở lại.'
    loai: phat-hien
    nguon:
      - pavlov1927
    trich: Left to themselves extinguished conditioned reflexes spontaneously recover their full strength after a longer or shorter interval of time
    vi_tri: bài giảng IV
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đáp ứng có thể trở lại một phần". Pavlov nói các phản xạ đã hình thành vững "tự phục hồi đầy đủ"; phản xạ còn yếu có thể cần củng cố lại. Viết "có thể trở lại" (không nói mức độ). Review (Claude Sonnet 5.5, 30/10/2026): trang vẫn ghi "đáp ứng có thể trở lại một phần" (chữ cũ) trong khi câu của hồ sơ bỏ "một phần" vì Pavlov nói phản xạ vững tự phục hồi đầy đủ. Đã sửa trang: "đáp ứng đã tắt có thể trở lại". Đã đọc bài giảng (psychclassics) cùng câu trích.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Pavlov/lecture4.htm" ]
    review: sai
  - id: n16
    cau: 'Khái quát hóa và phân biệt: chó phản ứng với âm thanh gần giống, rồi học chỉ đáp ứng với đúng âm đã được ghép đôi.'
    loai: phat-hien
    nguon:
      - pavlov1927
    trich: if a tone of 1000 d.v. is established as a conditioned stimulus, many other tones spontaneously acquire similar properties
    vi_tri: bài giảng VII
    ket_qua: dung
    ghi_chu: 'Pavlov: tone 1000 d.v.; phân biệt qua "differential inhibition" (cùng bài giảng).'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Pavlov/lecture7.htm" ]
  - id: n17
    cau: Bản tổng kết bằng tiếng Anh là Conditioned Reflexes, do G. V. Anrep dịch, Oxford University Press xuất bản năm 1927.
    loai: lich-su
    nguon:
      - pavlov1927
    trich: Translated by G. V. Anrep (1927)
    vi_tri: trang đầu psychclassics; nhà xuất bản ghi ở nguon.yml (pavlov1927)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "do chính học trò và cộng sự của ông là G. V. Anrep dịch và biên tập". Bỏ "học trò và cộng sự" và "biên tập" (không kiểm được trong bản psychclassics). Nhà xuất bản OUP theo nguon.yml. Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích của nguồn: khớp trang và mục Nguồn (Anrep 1927, OUP).'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Pavlov/" ]
    luot_2_ghi_chu: "Nhà xuất bản Oxford University Press (London, Humphrey Milford) 1927: theo biên mục sách; trang psychclassics ghi bản dịch Anrep 1927."
