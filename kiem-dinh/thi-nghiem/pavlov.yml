    ghi_chu: 'Review (Claude Sonnet 5.5, 30/10/2026): đáp án đúng của câu 4 viết "sinh vật học mối liên hệ" (dễ đọc thành ngành sinh vật học). Đã sửa thành "học mối liên hệ giữa hai kích thích … học mối liên hệ giữa hành vi của mình và hậu quả". Nội dung không đổi. Giải thích không dựa vào vị trí lựa chọn.'
  - id: n52
    cau: Link "Nỗi sợ có thể dạy được? (Little Albert)", Skinner, Dopamine, Seligman ở mục Đọc thêm trỏ tới trang có trong trang.yml.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm bằng grep src/data/trang.yml: thi-nghiem/little-albert, thi-nghiem/skinner, kham-pha/co-so-sinh-hoc/dopamine, thi-nghiem/seligman đều có. Review (Claude Sonnet 5.5, 30/10/2026): Đã kiểm trang trên src/data/trang.yml: thi-nghiem/little-albert (dòng 199), thi-nghiem/skinner (190), kham-pha/co-so-sinh-hoc/dopamine (89), thi-nghiem/seligman (214) đều có; trang dùng đúng bốn link /psyche/…/.'
    review: dung
  - id: n53
    cau: 'Trang này là trang nhà của nghiên cứu Pavlov: nơi khác chỉ tóm một câu và link về; trang tóm Watson–Rayner một câu và link về trang Little Albert.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm src/data/nghien-cuu.yml: id pavlov, trang_nha thi-nghiem/pavlov; id little-albert, trang_nha thi-nghiem/little-albert. Opus đã rút đoạn Watson–Rayner còn một câu tóm (n56), không thêm số, link về /psyche/thi-nghiem/little-albert/; bỏ câu hỏi 4 về Albert; bỏ Beck 2009, Powell 2014 khỏi mục Nguồn. Review (Claude Sonnet 5.5, 30/10/2026): Đã kiểm src/data/nghien-cuu.yml: pavlov có trang_nha thi-nghiem/pavlov, little-albert có trang_nha thi-nghiem/little-albert; trang chỉ còn một câu về Watson–Rayner kèm link, không thêm số.'
    review: dung
  - id: n54
    cau: Hộp "Tóm tắt nhanh" ở đầu trang dựng tự động từ ý chính của các khung nhãn.
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Như n58 của asch.yml. Review (Claude Sonnet 5.5, 30/10/2026): Đã kiểm src/plugins/thanh-phan.mjs (hàm tomTat) và trang có ::tom-tat với bốn khung nhãn."
    review: dung
  - id: n55
    cau: Hộp hồ sơ nghiên cứu ở đầu trang chỉ tóm các điều đã có trong phần kể nghiên cứu của chính trang.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Bốn dòng của hộp khớp mục Nghiên cứu then chốt. Review (Claude Sonnet 5.5, 30/10/2026): hộp có dòng "hơn một trăm cộng sự … suốt khoảng 25 năm" mà phần kể không có (chỉ có "25 năm" ở mục Ngộ nhận). Đã thêm vào cuối đoạn "Bản tổng kết bằng tiếng Anh" câu "Trong bài giảng đầu, Pavlov kể công việc này đã kéo dài khoảng 25 năm, với hơn một trăm cộng sự tham gia"; đã đọc bài giảng I (psychclassics): "over a hundred collaborators have taken part", "gone on now for twenty-five years" (n3). Ba dòng còn lại của hộp khớp phần kể.'
    review: sai
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: (không có)
    moi: 'Hộp hồ sơ nghiên cứu (:::ho-so-nghien-cuu): tác giả và năm, đối tượng, thiết kế, kết quả chính'
    ly_do: Bố cục C (kế hoạch).
  - cu: 'Khung Đã bị bác bỏ: "Pavlov lắc chuông tay trước mỗi bữa ăn của chó"'
    moi: 'Khung Đã bị bác bỏ: "chuông là kích thích chính, hay duy nhất, trong thí nghiệm của Pavlov"'
    ly_do: Câu cũ không có nguồn và quá cụ thể ("lắc tay"); xem n bác bỏ.
  - cu: 'Mục "Watson và Rayner (1920): nỗi sợ của bé Albert": hai đoạn kể (11 tháng tuổi, búa gõ thanh thép, khái quát hóa sang thỏ, chó, áo lông; đạo đức; Beck 2009 và Powell 2014 về danh tính); câu hỏi 4 về đạo đức của thí nghiệm Albert'
    moi: Một câu tóm, link về /psyche/thi-nghiem/little-albert/; bỏ câu hỏi 4; bỏ Beck 2009, Powell 2014 khỏi mục Nguồn
    ly_do: Mỗi nghiên cứu một trang nhà (trang nhà của Watson & Rayner là little-albert); hồ sơ n19–n26, n50, n56.
  - cu: :::vung-chac[học liên hệ giữa các kích thích là có thật] … "Các liệu pháp phơi nhiễm cho ám ảnh sợ hãi dựa trên nguyên tắc liên quan."
    moi: 'Cùng khung, căn cứ: phân tích tổng hợp 44 nghiên cứu điều kiện hóa nỗi sợ (Duits 2015) và 214 nghiên cứu điều kiện hóa đánh giá (Hofmann 2010)'
    ly_do: Thêm phân tích tổng hợp về điều kiện hóa cổ điển ở người cho đúng thước đo Vững chắc (n27).
  - cu: :::kha-vung[các chi tiết thủ tục gốc của Pavlov] (kèm câu về chuông và thuật ngữ "theo Todes")
    moi: :::vung-chac[tắt dần, phục hồi tự nhiên, khái quát hóa và phân biệt], dẫn Vervliet 2013 và Duits 2015
    ly_do: Các hiện tượng đã được nghiên cứu rộng ở động vật và người (n28, n57, n58); thuật ngữ chuyển sang Ngộ nhận (n29).
  - cu: :::tranh-cai[điều kiện hóa là ghép đôi máy móc hay học dự báo?] … "trang này chưa dẫn được nghiên cứu tổng hợp nào so sánh hai cách nhìn"
    moi: :::tranh-cai[điều kiện hóa chỉ là ghép đôi, hay là học dự báo?], mô tả hiệu ứng chặn, thêm Miller 1995 và Maes 2016 (15 thí nghiệm không thu được hiệu ứng chặn)
    ly_do: Căn cứ mở được cho nhãn (n30, n32, n59, n60).
  - cu: :::bac-bo[chuông là kích thích chính, hay duy nhất, trong thí nghiệm của Pavlov] … "Bài của họ chưa mở được toàn văn nên không dẫn thêm chi tiết."
    moi: :::bac-bo[Pavlov chỉ dùng chuông, hay ngược lại, chưa từng dùng chuông] … kết luận của Jarius và Wildemann (2015)
    ly_do: Jarius & Wildemann 2015 đọc được toàn văn; "kích thích chính" không bác được cho mọi thí nghiệm (n33, n37).
  - cu: '"Theo Todes, Pavlov viết "условный рефлекс"…" (Ngộ nhận 3, mục Việt Nam, khung kha-vung)'
    moi: Dẫn chú thích của người dịch W. Horsley Gantt (1928, tr. 79); thêm Gantt 1928, Duits 2015, Maes 2016, Miller 1995, Vervliet 2013 vào mục Nguồn, bỏ Todes 2014
    ly_do: Todes không mở được; chú thích của Gantt là nguồn gốc đọc được (n29).
  - cu: 'Khối "Xem đáp án": "Chủ yếu không phải chuông"; câu hỏi 2: "chuông điện có xuất hiện nhưng không phải kích thích chủ đạo"'
    moi: '"Trong cuốn sách năm 1927, chủ yếu không phải chuông"; "chuông có được dùng nhưng chỉ là một trong nhiều kích thích"'
    ly_do: Đúng phạm vi đã đếm (bảy bài giảng 1927); n34, n48.
  - cu: '"chó bắt đầu chảy nước miếng khi mới chỉ nhìn thấy thức ăn, cái bát quen thuộc, hay người thường cho chúng ăn"'
    moi: '"… nhìn thấy thức ăn, nhìn cái bát rỗng, hay nghe tiếng chân của người phụ tá"'
    ly_do: "Review: khớp OpenStax 6.2 và câu n10."
  - cu: '"phục hồi tự nhiên — sau một thời gian nghỉ, đáp ứng có thể trở lại một phần"'
    moi: '"… đáp ứng đã tắt có thể trở lại"'
    ly_do: "Review: Pavlov nói phản xạ vững tự phục hồi đầy đủ; câu n15."
  - cu: '"…tín hiệu báo thức ăn cho mèo; ý tưởng tương tự được dùng khi huấn luyện bằng tiếng clicker."'
    moi: '"…tín hiệu báo thức ăn cho mèo."'
    ly_do: "Review: clicker không có trong OpenStax (n43)."
  - cu: 'Quiz 4, đáp án đúng: "Cổ điển: sinh vật học mối liên hệ…; thao tác: sinh vật học mối liên hệ…"'
    moi: '"Cổ điển: học mối liên hệ…; thao tác: học mối liên hệ…"'
    ly_do: "Review: câu khó hiểu (n51)."
  - cu: Mục Nghiên cứu then chốt không nói "hơn một trăm cộng sự", "25 năm"; hộp hồ sơ có
    moi: 'Thêm vào cuối đoạn Bản tổng kết: "Trong bài giảng đầu, Pavlov kể công việc này đã kéo dài khoảng 25 năm, với hơn một trăm cộng sự tham gia."'
    ly_do: "Review: hộp hồ sơ chỉ tóm điều đã có trong phần kể (n55, n3)."
  - cu: '"mọi thủ tục trên động vật đều phải qua hội đồng đạo đức và tuân thủ nguyên tắc giảm thiểu đau đớn"'
    moi: '"chẳng hạn chính sách của cơ quan y tế công cộng Mỹ (PHS Policy), nghiên cứu trên động vật phải được hội đồng đạo đức duyệt và tránh hay giảm thiểu đau đớn"'
    ly_do: "Review: thêm nguồn PHS Policy, thu hẹp phạm vi (n18)."
