      - openstax2e
    ly_do: 'Bốn hiện tượng là nền của lý thuyết học tập, được nghiên cứu ở nhiều loài; tổng quan Annual Review (Vervliet 2013) tích hợp "the most important results from animal and human work" về tắt dần và nỗi sợ quay lại; tổng quan Bouton 2004 về tắt dần (tắt dần không xóa điều đã học); phân tích tổng hợp Duits 2015 đo học, tắt dần và phân biệt CS+/CS− ở người. Không có thất bại tái lập lớn. Đạt Vững chắc theo bằng chứng tích lũy (lời giao: nguyên lý học tập cơ bản xét cả bằng chứng tích lũy).'
