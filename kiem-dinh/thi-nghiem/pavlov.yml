    trich: Forty-four studies (published between 1920 and 2013) with data on 963 anxiety disordered patients and 1,222 control subjects
    vi_tri: tóm tắt Duits 2015; tóm tắt Hofmann 2010; Pavlov 1927; OpenStax 6.2
    nhan: vung-chac
    co_so:
      - duits2015
      - hofmann2010
      - vervliet2013
      - openstax2e
      - pavlov1927
    ly_do: 'Nguyên lý học tập cơ bản: ngoài bài gốc, có bằng chứng tích lũy từ rất nhiều nghiên cứu trên nhiều loài, hai phân tích tổng hợp ở người (Duits 2015: 44 nghiên cứu điều kiện hóa nỗi sợ, 963 bệnh nhân và 1.222 người đối chứng; Hofmann 2010: 214 nghiên cứu điều kiện hóa đánh giá, d = 0,52), một tổng quan Annual Review (Vervliet 2013, gộp kết quả động vật và người), và giáo trình trình bày như kiến thức nền. Không có thất bại tái lập lớn của chính hiện tượng học liên hệ (chỗ tranh cãi là cơ chế, ở khung tranh-cai). Đạt Vững chắc (mục 4).'
    ket_qua: da-sua
    ghi_chu: 'chỗ khó (Opus): giữ Vững chắc. Lượt 1 lo rằng Hofmann 2010 chỉ là điều kiện hóa đánh giá; đã thêm phân tích tổng hợp điều kiện hóa nỗi sợ ở người (Duits 2015) và tổng quan Vervliet 2013. Trang: thay câu "Các liệu pháp phơi nhiễm cho ám ảnh sợ hãi dựa trên nguyên tắc liên quan" bằng câu về Duits 2015 (liệu pháp đã nói ở mục Áp dụng). Chữ cũ của site cũ: "đã được lặp lại hàng nghìn lần...". Review (Claude Sonnet 5.5, 30/10/2026): nhãn Vững chắc, đúng mục 4: phân tích tổng hợp (Duits 2015, 44 nghiên cứu, 963 bệnh nhân và 1.222 đối chứng; Hofmann 2010, 214 nghiên cứu, d = 0,52) cùng chiều, nhiều loài; không thất bại tái lập của chính hiện tượng (tranh cãi chỉ ở cơ chế, khung riêng). Đã đọc tóm tắt hai bài qua OpenAlex.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/a0018916", "https://doi.org/10.1002/da.22353", "https://doi.org/10.1146/annurev-clinpsy-050212-185542" ]
    luot_2_ghi_chu: "Nhãn Vững chắc hợp thước đo: phân tích tổng hợp 214 nghiên cứu điều kiện hóa đánh giá (d = .52) và 44 nghiên cứu điều kiện hóa sợ; tổng quan Vervliet 2013. Đúng ở nhiều quần thể (động vật, người)."
    review: dung
