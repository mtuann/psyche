    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "giếng tuyệt vọng", "mẹ quái vật" và "IACUC, 3R" bỏ. Review (Claude Sonnet 5.5, 30/10/2026): "cô lập hoàn toàn" có trong tiêu đề Harlow 1965 (Total social isolation in monkeys); "gây trầm cảm" không có nguồn, đổi thành "về trầm cảm" (như n26). Chữ cũ: "thí nghiệm gây trầm cảm".'
