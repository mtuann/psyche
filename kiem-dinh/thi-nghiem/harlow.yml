doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: (không có)
    moi: 'Hộp hồ sơ nghiên cứu (:::ho-so-nghien-cuu): tác giả và năm, người tham gia, thiết kế, kết quả chính'
    ly_do: Bố cục C (kế hoạch).
  - cu: 'Khung Vững chắc: "sự dễ chịu khi tiếp xúc quyết định gắn bó, không phải việc cho ăn"'
    moi: Khung Khá vững cùng ý (viết lại)
    ly_do: 'Thước đo nhãn: không có phân tích tổng hợp hay tái lập đã mở; xem nhận định nhãn.'
  - cu: 'Hình harlow-contact: một cột "mẹ vải (mềm ấm) 17–18 giờ", một cột "mẹ sắt (có sữa) dưới 1 giờ"; chú thích "…đúng bằng thời gian bú rồi quay về ngay. Nguồn: Harlow (1958); số liệu theo bài viết."'
    moi: 'Bốn cột theo hai nhóm 4 khỉ (sữa ở mẹ vải: mẹ vải ≈ 19 giờ, mẹ lưới thép dưới 1 giờ; sữa ở mẹ lưới thép: mẹ vải ≈ 16 giờ, mẹ lưới thép ≈ 2 giờ), lúc 21–25 ngày tuổi; chú thích: số đọc gần đúng từ Hình 5 của Harlow (1958)'
    ly_do: Đối chiếu Hình 5 của bài in (n52, n56–n60); "mẹ sắt" thành "mẹ lưới thép"; câu "đúng bằng thời gian bú" không có trong bài. Hình có tên trong HINH_DA_SUA.
  - cu: '"với những con bú mẹ lưới thép, thời gian trên mẹ lưới thép giảm dần theo tuổi còn thời gian trên mẹ vải tăng" (đoạn Kết quả; lời giải thích câu 2)'
    moi: '"…thời gian trên mẹ vải tăng dần theo tuổi (khoảng 7 giờ lên khoảng 16 giờ mỗi ngày trong 25 ngày đầu, đọc từ Hình 5), còn thời gian trên mẹ lưới thép chỉ khoảng 1–2 giờ mỗi ngày"'
    ly_do: "Review: Hình 5 cho thấy đường mẹ lưới thép phẳng (n14, n48)."
  - cu: '"nhu cầu khác, nguyên thủy không kém nhu cầu ăn"; "một nhu cầu nguyên thủy, không phải sản phẩm phụ của việc ăn"; đáp án câu 4 "một nhu cầu nguyên thủy, độc lập với nhu cầu ăn — và chính nó tạo nên sự gắn bó"'
    moi: '"ngoài việc cho bú, còn có một biến số quan trọng khác"; "chịu ảnh hưởng áp đảo từ cảm giác mềm mại, ấm áp, được ôm, còn việc cho bú chỉ có tầm quan trọng không đáng kể"; "theo Harlow, đó là biến số có tầm quan trọng áp đảo trong việc hình thành gắn bó của khỉ con, hơn hẳn việc cho bú"'
    ly_do: 'Review: Harlow không dùng chữ "nguyên thủy" (n32, n20, n50).'
  - cu: "\"các thí nghiệm nhằm gây trầm cảm ở khỉ … (một bài lịch sử gọi là 'pit of despair' …)\"; đáp án câu 5 \"thí nghiệm gây trầm cảm\""
    moi: "\"các thí nghiệm gây tranh cãi nhằm tìm cách chữa trầm cảm … (bài … có tiêu đề 'Harry Harlow's pit of despair: Depression in monkeys and men')\"; \"thí nghiệm về trầm cảm\""
    ly_do: "Review: chỉ theo tóm tắt van Rosmalen 2022 (n26, n51)."
  - cu: "Khung Khá vững thứ hai: \"hình ảnh gần với 'căn cứ an toàn' (secure base) mà Bowlby mô tả ở trẻ em (theo OpenStax)\""
    moi: "\"(Harlow gọi là 'base of operations'). Chúng tôi ví hình ảnh này với 'căn cứ an toàn' … đây là phép so sánh của trang\""
