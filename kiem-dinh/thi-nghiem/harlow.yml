    cau: Mẹ lưới thép làm bằng lưới thép, cũng được sưởi ấm bằng nhiệt phát ra, chỉ khác mẹ vải ở chất lượng tiếp xúc.
    loai: phat-hien
    nguon:
      - harlow1958
    trich: She is made of wire-mesh, a substance entirely adequate to provide postural support and nursing capability, and she is warmed by radiant heat.
    vi_tri: mô tả mẹ thứ hai
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "mẹ sắt: khung dây thép lạnh ngắt" — sai: mẹ lưới thép cũng được sưởi ấm (cùng bóng đèn). Chữ "sắt" giữ như biệt danh (tiêu đề trang, tên hồ sơ nghiên cứu). Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích (Harlow 1958 toàn văn psychclassics hay OpenStax 9.3): khớp mô tả mẹ lưới thép (có sưởi bằng nhiệt).'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Harlow/love.htm" ]
