  - id: n26
    cau: "Vào những năm 1960–1970, Harlow làm các thí nghiệm gây tranh cãi nhằm tìm cách chữa trầm cảm và bị chỉ trích dữ dội; một bài lịch sử về ông có tiêu đề \"Harry Harlow's pit of despair: Depression in monkeys and men\"."
    loai: lich-su
    nguon:
      - vanrosmalen2022
    trich: "Harry Harlow, famous for his research with rhesus monkeys, was heavily criticized when he undertook his controversial experiments trying to find a solution for depression in the 1960s-1970s. (tiêu đề bài: Harry Harlow's pit of despair: Depression in monkeys and men)"
    vi_tri: tóm tắt (PubMed 35040491)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "giếng tuyệt vọng — buồng cô lập sâu, tối, dùng để tạo ra trạng thái trầm cảm ở khỉ con; và mẹ quái vật — mẹ vải được gắn cơ chế gây khó chịu (phun khí, rung lắc)". Chi tiết "buồng sâu, tối", "phun khí, rung lắc" không kiểm được (chưa mở Blum 2002, Harlow & Suomi 1974); bỏ phần "mẹ quái vật". Tóm tắt van Rosmalen nêu tiêu đề "pit of despair". Review (Claude Sonnet 5.5, 30/10/2026): lượt 2 không tìm thấy cụm "pit of despair"; đã xác nhận qua OpenAlex và Europe PMC: đó là tiêu đề bài của van Rosmalen và cộng sự (2022, J Hist Behav Sci 58(2)). Nhưng tóm tắt chỉ nói "controversial experiments trying to find a solution for depression"; vế "gây trầm cảm ở khỉ" của trang không có trong tóm tắt. Chữ cũ: "các thí nghiệm nhằm gây trầm cảm ở khỉ để tìm cách chữa trầm cảm (một bài lịch sử gọi là ''pit of despair'' …)". Chữ mới: "các thí nghiệm gây tranh cãi nhằm tìm cách chữa trầm cảm, và bị chỉ trích dữ dội (bài lịch sử … có tiêu đề ''Harry Harlow''s pit of despair: Depression in monkeys and men'')". Sửa cả đáp án câu 5 (n51): "thí nghiệm gây trầm cảm" thành "thí nghiệm về trầm cảm".'
    luot_2: khong-chac
    luot_2_ghi_chu: Có bài 'Induced depression in monkeys' (1974, Behavioral Biology; Crossref) nên đúng khung thời gian 1960-1970s, nhưng không mở được nội dung và không tìm được nguồn cụm 'pit of despair'. Không xác nhận được ở bậc 1-2.
    review: sai
  - id: n27
    cau: '"IACUC, nguyên tắc 3R ra đời chính vì các thí nghiệm này": đã bỏ.'
    loai: lich-su
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ: "chính chúng là lý do các quy định đạo đức trong nghiên cứu động vật (hội đồng IACUC, nguyên tắc 3R) ra đời và siết chặt về sau". Khẳng định nhân quả lịch sử không có nguồn; bỏ cả ở quiz. Câu chuẩn mực chung giữ: "Theo chuẩn mực ngày nay, nghiên cứu trên động vật phải qua hội đồng đạo đức và giảm thiểu đau đớn" (kiểm ở nhận định chuẩn mực; chưa có nguồn: gia-dinh/đạo đức).'
    luot_2: dung
    luot_2_nguon: [ "https://grants.nih.gov/policy-and-compliance/policy-topics/animal-welfare/laws-regulations/phs-policy" ]
    luot_2_ghi_chu: Câu mô tả điều đã bỏ khỏi trang, không phải khẳng định về nghiên cứu.
  - id: n28
    cau: Theo chuẩn mực ngày nay, chẳng hạn chính sách của cơ quan y tế công cộng Mỹ (PHS Policy), nghiên cứu trên động vật phải được hội đồng đạo đức duyệt và tránh hay giảm thiểu đau đớn.
    loai: loi-khuyen
    nguon:
      - openstax2e
      - phs-policy
    trich: 'today his experiments are widely considered to be unethical and even cruel (OpenStax) ... PHS Policy: "Procedures with animals will avoid or minimize discomfort, distress, and pain to the animals, consistent with sound research design"; nghiên cứu phải được IACUC duyệt'
    vi_tri: OpenStax 9.3
    ket_qua: da-sua
    ghi_chu: 'Câu chuẩn mực chung (cũng ở pavlov, skinner). Nguồn OpenStax nói "modern ethics guidelines"; không đọc quy định cụ thể (hội đồng đạo đức/giảm thiểu đau đớn). Người giao quyết có cần nguồn quy định (vd. Directive 2010/63/EU, Guide for the Care and Use of Laboratory Animals). Review (Claude Sonnet 5.5, 30/10/2026): câu "phải qua hội đồng đạo đức và giảm thiểu đau đớn" không có nguồn trong hồ sơ (OpenStax chỉ nói thí nghiệm bị xem là phi đạo đức). Đã đọc PHS Policy (olaw.nih.gov): hội đồng IACUC phải duyệt; thủ tục phải "avoid or minimize discomfort, distress, and pain". Thu hẹp câu về chính sách này; thêm nguon phs-policy. Chữ cũ: "Theo chuẩn mực ngày nay, nghiên cứu trên động vật phải qua hội đồng đạo đức và giảm thiểu đau đớn."'
    luot_2: dung
    luot_2_nguon: [ "https://grants.nih.gov/policy-and-compliance/policy-topics/animal-welfare/laws-regulations/phs-policy" ]
    luot_2_ghi_chu: Đúng với chuẩn Hoa Kỳ (PHS Policy); câu nói chung 'ngày nay'.
    review: sai
  - id: n29
    cau: 'Theo Harlow (1958), quan điểm phổ biến lúc đó: động cơ cơ bản là đói, khát...; tình yêu là động cơ phái sinh vì mẹ gắn với việc giảm đói và khát.'
    loai: lich-su
    nguon:
