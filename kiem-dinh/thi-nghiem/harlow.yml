nhan_dinh:
- id: n1
  cau: Harry Harlow (1958) cho khỉ con chọn giữa "mẹ vải" mềm ấm và "mẹ sắt" bằng lưới thép; dù sữa ở mẹ nào, khỉ con dành phần lớn thời gian bám mẹ vải.
  loai: phat-hien
  nguon:
  - harlow1958
  trich: These data make it obvious that contact comfort is a variable of overwhelming importance in the development of affectional response, whereas lactation is a variable of negligible importance.
  vi_tri: Hình 5 và đoạn kế tiếp
  ket_qua: da-sua
  ghi_chu: 'Câu mô tả (description). Chữ cũ: "khỉ rhesus con ... bám mẹ vải 17–18 giờ mỗi ngày, chứng minh sự dễ chịu khi tiếp xúc quan trọng hơn việc cho ăn". Số 17–18 giờ nằm ở Hình 5 của bài gốc, không có trong bản psychclassics (chỉ có hình 3, 4, 21); chỉ thấy lặp lại ở nguồn phổ thông. Bỏ số; "chứng minh" đổi "gợi ý".'
- id: n2
  cau: Bài của Harlow (1958) là diễn văn của chủ tịch Hiệp hội Tâm lý học Hoa Kỳ (APA), đăng trên American Psychologist.
  loai: lich-su
  nguon:
  - harlow1958
  trich: Address of the President at the sixty-sixth Annual Convention of the
  vi_tri: trang đầu psychclassics (First published in American Psychologist, 13, 673-685)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "bài diễn văn nhậm chức chủ tịch APA" (cả ở tiêu đề mục). Bài ghi "Address of the President at the sixty-sixth Annual Convention"; "nhậm chức" không có trong nguồn; đổi thành "diễn văn của chủ tịch APA tại hội nghị thường niên lần thứ 66". Đã đổi tiêu đề mục (không có link #mục nào trong repo trỏ tới).'
- id: n3
  cau: Harlow làm việc tại Đại học Wisconsin.
  loai: lich-su
  nguon:
  - harlow1958
  trich: University of Wisconsin
  vi_tri: trang đầu
  ket_qua: dung
- id: n4
  cau: 'Hộp hồ sơ: Harlow và Zimmermann (1959) ghi nhận khỉ mồ côi gắn bó mạnh và bền với mẹ giả.'
  loai: lich-su
  nguon:
  - harlow1959
  trich: orphaned baby monkeys develop a strong and persistent attachment to inanimate surrogate mothers
  vi_tri: nhan đề
  ket_qua: dung
  ghi_chu: Chỉ đọc nhan đề (PubMed 13675765), không có tóm tắt.
- id: n5
  cau: 'Thí nghiệm "hai mẹ giả": mỗi khỉ con có một mẹ vải và một mẹ lưới thép, đặt trong hai ngăn gắn vào lồng.'
  loai: phat-hien
  nguon:
  - harlow1958
  trich: a cloth mother and a wire mother were placed in different cubicles attached to the infant's living cage
  vi_tri: tr. thí nghiệm đầu
  ket_qua: dung
- id: n6
  cau: 'Mẹ vải: khối gỗ bọc xốp, phủ vải bông, có bóng đèn phía sau phát nhiệt.'
  loai: phat-hien
  nguon:
  - harlow1958
  trich: The surrogate was made from a block of wood, covered with sponge rubber, and sheathed in tan cotton terry cloth. A light bulb behind her radiated heat.
  vi_tri: mô tả mẹ vải
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "bên trong có bóng đèn sưởi ấm". Mới theo bài: bóng đèn phía sau.'
- id: n7
  cau: Mẹ lưới thép làm bằng lưới thép, cũng được sưởi ấm bằng nhiệt phát ra, chỉ khác mẹ vải ở chất lượng tiếp xúc.
  loai: phat-hien
  nguon:
  - harlow1958
  trich: She is made of wire-mesh, a substance entirely adequate to provide postural support and nursing capability, and she is warmed by radiant heat.
  vi_tri: mô tả mẹ thứ hai
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "mẹ sắt: khung dây thép lạnh ngắt" — sai: mẹ lưới thép cũng được sưởi ấm (cùng bóng đèn). Chữ "sắt" giữ như biệt danh (tiêu đề trang, tên hồ sơ nghiên cứu).'
- id: n8
  cau: Mỗi mẹ có một "vú" ở ngực trên.
  loai: phat-hien
  nguon:
  - harlow1958
  trich: reducing the number of breasts from two to one and placing this unibreast in an upper-thoracic, sagittal position
  vi_tri: mô tả mẹ vải (mẹ lưới thép cùng "nursing capability")
  ket_qua: dung
- id: n9
  cau: Với 4 khỉ sơ sinh, mẹ vải cho sữa; với 4 khỉ còn lại, mẹ lưới thép cho sữa.
  loai: so-lieu
  nguon:
  - harlow1958
  trich: For four newborn monkeys the cloth mother lactated and the wire mother did not; and, for the other four, this condition was reversed.
  vi_tri: thí nghiệm đầu
  ket_qua: dung
- id: n10
  cau: Thời gian trên mỗi mẹ được ghi tự động; khỉ con luôn được tự do rời khỏi tấm sưởi hay sàn để tới mẹ nào.
  loai: phat-hien
  nguon:
  - harlow1958
  trich: The infants were always free to leave the heating pad or cage floor to contact either mother, and the time spent on the surrogate mothers was automatically recorded.
  vi_tri: thí nghiệm đầu
  ket_qua: dung
- id: n11
  cau: Phòng thí nghiệm thường tách khỉ con khỏi mẹ 6–12 giờ sau sinh.
  loai: phat-hien
  nguon:
  - harlow1958
  trich: We had separated more than 60 of these animals from their mothers 6 to 12 hours after birth
  vi_tri: tr. đầu "Three years' experimentation"
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "bị tách khỏi mẹ ruột ngay sau khi sinh". Mới: 6–12 giờ, nói về hơn 60 khỉ của phòng thí nghiệm (không nói riêng 8 con của thí nghiệm hai mẹ).'
- id: n12
  cau: Khỉ con đã có sẵn gắn bó với tấm vải lót chuồng, và có cơn giận dữ khi tấm vải bị lấy đi để vệ sinh.
  loai: phat-hien
  nguon:
  - harlow1958
  trich: The infants clung to these pads and engaged in violet temper tantrums when the pads were removed and replaced for sanitary reasons.
  vi_tri: tr. giữa
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ (khung Vững chắc): dẫn Harlow & Zimmermann 1959; chi tiết nằm trong Harlow 1958. "Rối loạn cảm xúc rõ rệt" đổi "cơn giận dữ" ("temper tantrums"). Harlow 1959 chưa đọc.'
- id: n13
  cau: Dù sữa ở mẹ nào, khỉ con dành phần lớn thời gian bám vào mẹ vải.
  loai: phat-hien
  nguon:
  - harlow1958
  trich: These data make it obvious that contact comfort is a variable of overwhelming importance in the development of affectional response, whereas lactation is a variable of negligible importance.
  vi_tri: sau Hình 5
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "khoảng 17–18 giờ mỗi ngày ... chỉ sang mẹ sắt đúng lúc bú rồi quay về ngay" (Hình 5 không đọc được; "đúng lúc bú rồi quay về ngay" không có trong văn bản). Chữ "phần lớn" chưa có số; bài viết ở mục khác: nhóm khỉ đặt mẹ muộn ở 250 ngày: gần 9 giờ/ngày trên mẹ vải và dưới 1,5 giờ trên mẹ lưới thép.'
- id: n14
  cau: Với những khỉ bú mẹ lưới thép, thời gian trên mẹ lưới thép giảm dần theo tuổi còn thời gian trên mẹ vải tăng.
  loai: phat-hien
  nguon:
  - harlow1958
  trich: With age and opportunity to learn, subjects with the lactating wire mother showed decreasing responsiveness to her and increasing responsiveness to the nonlactating cloth mother
  vi_tri: thí nghiệm đầu
  ket_qua: dung
- id: n15
  cau: Khi được cho thấy vật gây sợ như con gấu đồ chơi chuyển động, khỉ con ưa mẹ vải hơn rõ rệt, bất kể mẹ nào có sữa.
  loai: phat-hien
  nguon:
  - harlow1958
  trich: It is apparent that the cloth mother is highly preferred over the wire one, and this differential selectivity is enhanced by age and experience.
  vi_tri: thử nghiệm sợ hãi (Hình 13–15)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đồ chơi gây tiếng động lớn ... chạy ngay về phía mẹ vải, ôm chặt, rồi từ từ bình tĩnh lại — có con còn quay lại đối đầu với vật gây sợ". Bài nói "moving toy bear" (không có tiếng động) và "rushes ... comfort and composure" ở mẹ thật; "quay lại đối đầu" không thấy trong văn bản (chỉ có ở Hình 14?). Bỏ.'
- id: n16
  cau: Trong căn phòng lạ (6 × 6 × 6 feet), 4 trong 8 khỉ được thử, mỗi khỉ 3 phút, hai lần mỗi tuần trong 8 tuần.
  loai: so-lieu
  nguon:
  - harlow1958
  trich: we have completed tests for this relationship on four of our eight baby monkeys assigned to the dual mother-surrogate condition by introducing them for three minutes into the strange environment of a room measuring six feet by six feet by six feet
  vi_tri: open-field test
  ket_qua: da-sua
  ghi_chu: Chữ cũ không nói rõ chỉ 4/8 con. Mới nêu số liệu.
- id: n17
  cau: Khi mẹ vải có mặt, khỉ con ôm mẹ rồi dùng mẹ làm "căn cứ" để khám phá và quay về; điểm cảm xúc tổng giảm một nửa.
  loai: phat-hien
  nguon:
  - harlow1958
  trich: Total emotionality score was cut in half when the mother was present.
  vi_tri: open-field test
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "khỉ con có mẹ vải bên cạnh dám bò ra khám phá ...; khỉ con không có mẹ vải thì co rúm một chỗ, mút ngón tay, tê liệt vì sợ" mô tả như hai nhóm khỉ khác nhau; thực ra là cùng 4 khỉ khi mẹ có/không có mặt. "Mút ngón tay" bài nêu "sucking" là một chỉ số cảm xúc; "tê liệt vì sợ" đổi thành "co rúm" ("freeze in a crouched position").'
- id: n18
  cau: Khi mẹ vắng, khỉ con thường co rúm (freeze in a crouched position).
  loai: phat-hien
  nguon:
  - harlow1958
  trich: Frequently they would freeze in a crouched position
  vi_tri: open-field test
  ket_qua: dung
- id: n19
  cau: Bốn khỉ đối chứng chưa từng nuôi với mẹ giả có điểm cảm xúc khi mẹ vắng bằng nhóm thí nghiệm khi mẹ vắng.
  loai: phat-hien
  nguon:
  - harlow1958
  trich: Four control infants never raised with a mother surrogate showed the same emotionality scores when the mother was absent as the experimental infants showed in the absence of the mother
  vi_tri: open-field test
  ket_qua: dung
- id: n20
  cau: 'Harlow kết luận: contact comfort là biến số có tầm quan trọng áp đảo trong hình thành phản ứng tình cảm, còn việc cho bú không đáng kể.'
  loai: phat-hien
  nguon:
  - harlow1958
  trich: contact comfort is a variable of overwhelming importance in the development of affectional response, whereas lactation is a variable of negligible importance
  vi_tri: sau Hình 5
  ket_qua: dung
- id: n21
  cau: Harlow đề xuất chức năng chính của việc cho bú (như một biến số tình cảm) có lẽ là bảo đảm sự tiếp xúc cơ thể thường xuyên, thân mật giữa mẹ và con.
  loai: phat-hien
  nguon:
  - harlow1958
  trich: the primary function of nursing as an affectional variable is that of insuring frequent and intimate body contact of the infant with the mother
  vi_tri: sau nhóm đối chứng
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "chức năng chính của việc cho bú có lẽ chỉ là..."; thêm giới hạn "như một biến số tình cảm".'
- id: n22
  cau: Nhóm khỉ nuôi với một mẹ lưới thép hay một mẹ vải ăn lượng sữa và tăng cân như nhau.
  loai: so-lieu
  nguon:
  - harlow1958
  trich: There were no differences between these two groups in amount of milk ingested or in weight gain.
  vi_tri: nhóm đối chứng một mẹ
  ket_qua: dung
  ghi_chu: 'Chữ cũ (ngộ nhận): "nhóm nào cũng tăng cân như nhau vì đều được bú đủ"; mới chỉ rõ nhóm đối chứng một mẹ.'
- id: n23
  cau: Harlow, Dodsworth và Harlow (1965) nghiên cứu khỉ con trong cô lập xã hội hoàn toàn.
  loai: lich-su
  nguon:
  - harlow1965
  trich: Total social isolation in monkeys.
  vi_tri: nhan đề (PubMed 4955132)
  ket_qua: da-sua
  ghi_chu: Chỉ đọc nhan đề; toàn văn và tóm tắt không mở được (PMC 285801 bị reCAPTCHA, pnas.org 403).
- id: n24
  cau: Kết quả của các nghiên cứu cô lập (sợ hãi cực độ, hành vi tự kích thích, không giao tiếp, không giao phối, con cái không chăm con) đã bỏ khỏi trang.
  loai: phat-hien
  ket_qua: da-bo
  ghi_chu: 'chưa chắc: chữ cũ liệt kê các di chứng; không mở được Harlow, Dodsworth & Harlow 1965. Bỏ để kiểm định dứt điểm; người giao/lượt 2 có thể mở bằng PMC từ máy có trình duyệt và thêm lại nếu có trích nguyên văn.'
- id: n25
  cau: Theo giáo trình mở, các thí nghiệm của Harlow ngày nay bị xem là phi đạo đức.
  loai: lich-su
  nguon:
  - openstax2e
  trich: today his experiments are widely considered to be unethical and even cruel
  vi_tri: OpenStax 9.3
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "phần lớn công trình sau này của Harlow không thể được phép thực hiện ngày nay". Mới theo OpenStax.'
- id: n26
  cau: Vào những năm 1960–1970, Harlow làm các thí nghiệm nhằm gây trầm cảm ở khỉ để tìm cách chữa trầm cảm, bị chỉ trích dữ dội; một bài lịch sử gọi là "pit of despair".
  loai: lich-su
  nguon:
  - vanrosmalen2022
  trich: Harry Harlow, famous for his research with rhesus monkeys, was heavily criticized when he undertook his controversial experiments trying to find a solution for depression in the 1960s-1970s.
  vi_tri: tóm tắt (PubMed 35040491)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "giếng tuyệt vọng — buồng cô lập sâu, tối, dùng để tạo ra trạng thái trầm cảm ở khỉ con; và mẹ quái vật — mẹ vải được gắn cơ chế gây khó chịu (phun khí, rung lắc)". Chi tiết "buồng sâu, tối", "phun khí, rung lắc" không kiểm được (chưa mở Blum 2002, Harlow & Suomi 1974); bỏ phần "mẹ quái vật". Tóm tắt van Rosmalen nêu tiêu đề "pit of despair".'
- id: n27
  cau: '"IACUC, nguyên tắc 3R ra đời chính vì các thí nghiệm này": đã bỏ.'
  loai: lich-su
  ket_qua: da-bo
  ghi_chu: 'Chữ cũ: "chính chúng là lý do các quy định đạo đức trong nghiên cứu động vật (hội đồng IACUC, nguyên tắc 3R) ra đời và siết chặt về sau". Khẳng định nhân quả lịch sử không có nguồn; bỏ cả ở quiz. Câu chuẩn mực chung giữ: "Theo chuẩn mực ngày nay, nghiên cứu trên động vật phải qua hội đồng đạo đức và giảm thiểu đau đớn" (kiểm ở nhận định chuẩn mực; chưa có nguồn: gia-dinh/đạo đức).'
- id: n28
  cau: Theo chuẩn mực ngày nay, nghiên cứu trên động vật phải qua hội đồng đạo đức và giảm thiểu đau đớn.
  loai: loi-khuyen
  nguon:
  - openstax2e
  trich: today his experiments are widely considered to be unethical and even cruel
  vi_tri: OpenStax 9.3
  ket_qua: da-lam-mem
  ghi_chu: Câu chuẩn mực chung (cũng ở pavlov, skinner). Nguồn OpenStax nói "modern ethics guidelines"; không đọc quy định cụ thể (hội đồng đạo đức/giảm thiểu đau đớn). Người giao quyết có cần nguồn quy định (vd. Directive 2010/63/EU, Guide for the Care and Use of Laboratory Animals).
- id: n29
  cau: 'Theo Harlow (1958), quan điểm phổ biến lúc đó: động cơ cơ bản là đói, khát...; tình yêu là động cơ phái sinh vì mẹ gắn với việc giảm đói và khát.'
  loai: lich-su
  nguon:
  - harlow1958
  trich: The mother is associated with the reduction of the primary drives -- particularly hunger, thirst, and pain -- and through learning, affection or love is derived.
  vi_tri: mục mở đầu
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "tâm lý học Mỹ chịu ảnh hưởng nặng của chủ nghĩa hành vi: người ta tin ... tình yêu là phản xạ có điều kiện gắn với việc được cho bú. Thậm chí các bác sĩ nhi khoa khuyên cha mẹ cho con ăn đúng giờ, hạn chế bế ẵm" (không nguồn; Harlow nói "psychologists and sociologists"). Bỏ lời khuyên nhi khoa.'
- id: n30
