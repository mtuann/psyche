    trich: With age and opportunity to learn, subjects with the lactating wire mother showed decreasing responsiveness to her and increasing responsiveness to the nonlactating cloth mother
    vi_tri: thí nghiệm đầu
    ket_qua: da-sua
    ghi_chu: 'Câu hỏi cũ có số 17–18 giờ và "dưới 1 giờ" (Hình 5; xem n1); đổi thành câu hỏi định tính. Review (Claude Sonnet 5.5, 30/10/2026): như n14: Hình 5 không cho thấy thời gian trên mẹ lưới thép giảm. Chữ cũ trong lời giải thích: "với những khỉ bú mẹ lưới thép, thời gian trên mẹ lưới thép còn giảm dần theo tuổi". Chữ mới: "thời gian trên mẹ vải còn tăng dần theo tuổi, còn thời gian trên mẹ lưới thép chỉ khoảng 1–2 giờ mỗi ngày".'
    luot_2: khong-chac
    luot_2_ghi_chu: "Như n14: Harlow viết thời gian trên mẹ lưới giảm theo tuổi ở nhóm bú mẹ lưới, nhưng Hình 5 (25 ngày đầu) cho thấy phẳng hoặc hơi tăng; Hình 6 (165 ngày) không đọc được. Phần 'phần lớn thời gian bên mẹ vải' đúng."
