  - id: n1
    cau: Harry Harlow (1958) cho khỉ con chọn giữa "mẹ vải" mềm ấm và "mẹ sắt" bằng lưới thép; dù sữa ở mẹ nào, khỉ con dành phần lớn thời gian bám mẹ vải.
    loai: phat-hien
    nguon:
      - harlow1958
    trich: These data make it obvious that contact comfort is a variable of overwhelming importance in the development of affectional response, whereas lactation is a variable of negligible importance.
    vi_tri: Hình 5 và đoạn kế tiếp
    ket_qua: da-sua
    ghi_chu: 'Câu mô tả (description). Chữ cũ: "khỉ rhesus con ... bám mẹ vải 17–18 giờ mỗi ngày, chứng minh sự dễ chịu khi tiếp xúc quan trọng hơn việc cho ăn". Số 17–18 giờ nằm ở Hình 5 của bài gốc, không có trong bản psychclassics (chỉ có hình 3, 4, 21); chỉ thấy lặp lại ở nguồn phổ thông. Bỏ số; "chứng minh" đổi "gợi ý". Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích (Harlow 1958 toàn văn psychclassics hay OpenStax 9.3): mô tả bỏ số 17–18 giờ, ghi "gợi ý".'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Harlow/love.htm" ]
    review: dung
  - id: n2
    cau: Bài của Harlow (1958) là diễn văn của chủ tịch Hiệp hội Tâm lý học Hoa Kỳ (APA), đăng trên American Psychologist.
    loai: lich-su
    nguon:
      - harlow1958
    trich: Address of the President at the sixty-sixth Annual Convention of the
    vi_tri: trang đầu psychclassics (First published in American Psychologist, 13, 673-685)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "bài diễn văn nhậm chức chủ tịch APA" (cả ở tiêu đề mục). Bài ghi "Address of the President at the sixty-sixth Annual Convention"; "nhậm chức" không có trong nguồn; đổi thành "diễn văn của chủ tịch APA tại hội nghị thường niên lần thứ 66". Đã đổi tiêu đề mục (không có link #mục nào trong repo trỏ tới). Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích (Harlow 1958 toàn văn psychclassics hay OpenStax 9.3): khớp đầu đề bài (Address of the President, hội nghị lần thứ 66).'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Harlow/love.htm" ]
    review: dung
