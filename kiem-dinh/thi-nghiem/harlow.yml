    trich: monkeys showing depressive begaviors after repeated separations can be returned to age-appropriate social performance through repeated exposure to socially active age-mates
    vi_tri: tóm tắt Suomi 1976; Harlow 1958; OpenStax 9.3
    nhan: kha-vung
    co_so:
      - harlow1958
      - openstax2e
      - suomi1976
    ly_do: 'Hai nghiên cứu nhỏ trên khỉ (Harlow 1958: 4/8 khỉ trong open-field; Suomi 1976: nhóm 4 khỉ), không tái lập độc lập; phép so sánh với Bowlby chỉ là sự tương đồng về khái niệm do trang nêu (OpenStax định nghĩa căn cứ an toàn nhưng không nối với thí nghiệm của Harlow). Chỉ đạt mức thấp nhất của Khá vững; không thể nâng lên.'
    ket_qua: da-sua
    ghi_chu: 'chỗ khó: chữ cũ gộp "thiếu tiếp xúc sớm để lại di chứng lâu dài" (nguồn 1965 không mở được) và "Stephen Suomi chứng minh ... bạn đồng loại kiên nhẫn" — mới dẫn Suomi, Delizio & Harlow 1976 (AJP 133(11): 1279–1285). Mục nguon Suomi trên trang cũ là "Suomi, Harlow & McKinney (1972) ... 129(10), 127–132": sai; nguon.yml (suomi1972) cũng cần sửa — việc người giao (dữ liệu dùng chung). Review (Claude Sonnet 5.5, 30/10/2026): lượt 2 khong-chac vì (a) không đọc được Suomi 1976 (đã tra nhầm bài J Child Psychol Psychiatry): đã mở tóm tắt đúng bài Am J Psychiatry 133(11):1279–1285 (PubMed 824960): "four monkeys reared together, repeatedly separated … monkeys showing depressive behaviors after repeated separations can be returned to age-appropriate social performance through repeated exposure to socially active age-mates", khớp trang; (b) OpenStax không nối căn cứ an toàn với thí nghiệm khỉ (đã đọc 9.3), nên "gần với … (theo OpenStax)" gán sai cho OpenStax. Đã sửa trang thành "(Harlow, 1958; Harlow gọi là ''base of operations''). Chúng tôi ví hình ảnh này với ''căn cứ an toàn'' … đây là phép so sánh của trang". Harlow viết "base of operations" (đã đọc). Nhãn Khá vững là mức thấp nhất hợp lý: chỉ hai nghiên cứu nhỏ, nên mức này chưa chắc.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Phần Harlow 1958 (4 trong 8 khỉ dùng mẹ vải làm căn cứ) đúng. Phần Suomi và cộng sự (1976, J Child Psychol Psychiatry 17:101-112; PMID 819450) không đọc được (không có tóm tắt), nên không xác nhận được mệnh đề 'khỉ trầm cảm sau tách phục hồi nhờ bạn cùng tuổi'. Phần 'gần với căn cứ an toàn của Bowlby (theo OpenStax)': trang OpenStax 9.3 định nghĩa căn cứ an toàn nhưng không nối với thí nghiệm khỉ của Harlow. Câu ghép nhiều mệnh đề, nên tách."
