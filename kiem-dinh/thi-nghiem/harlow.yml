  - id: n52
    cau: 'Hình "harlow-contact" (biểu đồ cột, đã sửa): số giờ trung bình mỗi ngày trên hai mẹ giả lúc 21–25 ngày tuổi, hai nhóm 4 khỉ (sữa ở mẹ vải; sữa ở mẹ lưới thép); "dù sữa ở mẹ nào, khỉ con ở trên mẹ vải phần lớn thời gian trong ngày"; số đọc gần đúng từ Hình 5 của Harlow (1958).'
    loai: so-lieu
    nguon:
      - harlow1958b
      - harlow1958
    trich: Figure 5 shows the total time spent on the cloth and wire mothers under the two conditions of feeding. These data make it obvious that contact comfort is a variable of overwhelming importance
    vi_tri: Hình 5 (tr. 674, "Time spent on cloth and wire mother surrogates"; trục tung "MEAN HOURS PER DAY", 0–24; trục hoành 1–5 … 21–25 ngày tuổi), bản quét có hình
    ket_qua: da-sua
    ghi_chu: 'chỗ khó (Opus): mở được bản quét có hình và đọc Hình 5. Hình cũ: một cột "mẹ vải (mềm ấm) 17–18 giờ", một cột "mẹ sắt (có sữa) dưới 1 giờ", chú thích "đúng bằng thời gian bú rồi quay về ngay. Nguồn: Harlow (1958); số liệu theo bài viết." Sai: (1) hình gốc tách hai nhóm theo nơi có sữa, hình cũ gộp thành một và gán sữa cho mẹ lưới thép; (2) nhóm có sữa ở mẹ lưới thép ở trên mẹ lưới thép khoảng 1–2 giờ/ngày, không phải "dưới 1 giờ", và trên mẹ vải tăng từ khoảng 7 giờ (1–5 ngày) lên khoảng 16 giờ (16–25 ngày); (3) bài không nói "đúng bằng thời gian bú rồi quay về ngay" (không đo thời gian bú); (4) "mẹ sắt" đổi "mẹ lưới thép" (wire mother). Hình mới: bốn cột theo hai nhóm, mốc 21–25 ngày, số làm tròn ghi "≈", chú thích nói rõ là đọc gần đúng từ đồ thị. Trang giữ chữ "phần lớn thời gian" nên khớp hình. Tên hình đã thêm vào HINH_DA_SUA (tests/chuyen.test.mjs). Review (Claude Sonnet 5.5, 30/10/2026): đã đối chiếu hình src/hinh/harlow-contact.html với ảnh Hình 5 (psychclassics fig5.jpg): nhóm sữa ở mẹ vải: mẹ vải ≈ 19 giờ (đường 21–25 ngày ≈ 19), mẹ lưới thép < 1 giờ; nhóm sữa ở mẹ lưới thép: mẹ vải ≈ 16, mẹ lưới thép ≈ 2; chiều cao cột khớp thang (11 px/giờ); chữ trong hình là chữ thật, màu theo lớp pz-fig-a/b; chú thích "số đọc gần đúng".'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Harlow/love.htm", "https://psychclassics.yorku.ca/Harlow/fig5.jpg" ]
    luot_2_ghi_chu: "Hai nhóm 4 khỉ, giờ trung bình mỗi ngày: đúng. Đã mở ảnh Hình 5 (psychclassics) và đọc số."
