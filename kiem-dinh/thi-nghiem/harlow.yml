    vi_tri: mô tả mẹ vải
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "bên trong có bóng đèn sưởi ấm". Mới theo bài: bóng đèn phía sau. Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích (Harlow 1958 toàn văn psychclassics hay OpenStax 9.3): khớp mô tả mẹ vải.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Harlow/love.htm" ]
