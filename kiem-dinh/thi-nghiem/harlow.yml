  - id: n32
    cau: Harlow gọi biến số quan trọng đó (được ôm ấp, tiếp xúc cơ thể) là "contact comfort".
    loai: dinh-nghia
    nguon:
      - harlow1958
    trich: contact comfort might be a very important variable in the development of the infant's affection for the mother
    vi_tri: tr. trước thí nghiệm
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhu cầu nguyên thủy không kém nhu cầu ăn" (diễn đạt của site; Harlow: "important variable"). Mới: "biến số quan trọng". Review (Claude Sonnet 5.5, 30/10/2026): ghi_chu lượt 1 nói đã bỏ "nhu cầu nguyên thủy không kém nhu cầu ăn" nhưng trang còn ba chỗ "nguyên thủy" (đoạn Điều gì đang xảy ra, gạch đầu dòng Sự dễ chịu khi tiếp xúc, đáp án đúng câu 4). Đã đọc toàn văn Harlow 1958: ông viết "contact comfort might be a very important variable", không nói "nguyên thủy" hay "độc lập với nhu cầu ăn". Đã sửa cả ba chỗ: "ngoài việc cho bú, còn có một biến số quan trọng khác"; "Harlow cho rằng sự gắn bó của khỉ con chịu ảnh hưởng áp đảo từ cảm giác mềm mại, ấm áp, được ôm, còn việc cho bú chỉ có tầm quan trọng không đáng kể" (n20); đáp án câu 4: "theo Harlow, đó là biến số có tầm quan trọng áp đảo trong việc hình thành gắn bó của khỉ con, hơn hẳn việc cho bú" (n50).'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Harlow/love.htm" ]
    review: sai
  - id: n33
    cau: 'Khá vững: sự dễ chịu khi tiếp xúc quan trọng hơn việc cho bú trong gắn bó của khỉ con.'
    loai: nhan
    nguon:
      - harlow1958
      - openstax2e
    trich: contact comfort is a variable of overwhelming importance in the development of affectional response, whereas lactation is a variable of negligible importance
    vi_tri: sau Hình 5
    nhan: kha-vung
    co_so:
      - harlow1958
      - openstax2e
    ly_do: '8 khỉ trong một phòng thí nghiệm, kết quả cùng chiều ở cả hai điều kiện sữa; chưa có tái lập độc lập hay phân tích tổng hợp đã mở; không thể lặp lại theo chuẩn đạo đức hiện nay: đúng mô tả Khá vững (mục 4). Opus xét lại (chỗ khó): giữ Khá vững. Hiện tượng do phòng thí nghiệm Harlow báo cáo (Harlow 1958, Harlow & Zimmermann 1959), cùng chiều với nghiên cứu gắn bó về sau, nhưng không có phân tích tổng hợp hay tái lập độc lập đã mở cho chính khẳng định "tiếp xúc quan trọng hơn cho bú", mẫu nhỏ (4 + 4 khỉ), và thí nghiệm không thể làm lại theo chuẩn đạo đức nay.'
    ket_qua: da-sua
    ghi_chu: 'chỗ khó: chữ cũ :::vung-chac với "Hiệu ứng này được lặp lại trong nhiều nghiên cứu của chính phòng thí nghiệm Harlow và các nhóm khác" (không dẫn được). Thước đo Vững chắc cần phân tích tổng hợp hoặc hai tái lập; chưa có. Hạ xuống Khá vững; người giao/lượt 2 cân nhắc. Harlow & Zimmermann 1959 chưa đọc (chỉ nhan đề).'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Harlow/love.htm", "https://psychclassics.yorku.ca/Harlow/fig5.jpg" ]
    luot_2_ghi_chu: "Nhãn 'Khá vững' hợp thước đo mục 4: nhiều nghiên cứu cùng chiều nhưng không có phân tích tổng hợp hay tái lập có đăng ký trước, mẫu rất nhỏ (8 khỉ), một loài."
  - id: n34
