    cau: Phòng thí nghiệm thường tách khỉ con khỏi mẹ 6–12 giờ sau sinh.
    loai: phat-hien
    nguon:
      - harlow1958
    trich: We had separated more than 60 of these animals from their mothers 6 to 12 hours after birth
    vi_tri: tr. đầu "Three years' experimentation"
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "bị tách khỏi mẹ ruột ngay sau khi sinh". Mới: 6–12 giờ, nói về hơn 60 khỉ của phòng thí nghiệm (không nói riêng 8 con của thí nghiệm hai mẹ). Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích (Harlow 1958 toàn văn psychclassics hay OpenStax 9.3): khớp ("6 to 12 hours after birth", hơn 60 khỉ).'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Harlow/love.htm" ]
    review: dung
  - id: n12
    cau: Khỉ con đã có sẵn gắn bó với tấm vải lót chuồng, và có cơn giận dữ khi tấm vải bị lấy đi để vệ sinh.
    loai: phat-hien
    nguon:
      - harlow1958
    trich: The infants clung to these pads and engaged in violet temper tantrums when the pads were removed and replaced for sanitary reasons.
    vi_tri: tr. giữa
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (khung Vững chắc): dẫn Harlow & Zimmermann 1959; chi tiết nằm trong Harlow 1958. "Rối loạn cảm xúc rõ rệt" đổi "cơn giận dữ" ("temper tantrums"). Harlow 1959 chưa đọc. Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích (Harlow 1958 toàn văn psychclassics hay OpenStax 9.3): khớp ("violet [violent] temper tantrums" khi tấm lót bị thay).'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Harlow/love.htm" ]
    review: dung
  - id: n13
    cau: Dù sữa ở mẹ nào, khỉ con dành phần lớn thời gian bám vào mẹ vải.
    loai: phat-hien
    nguon:
      - harlow1958
    trich: These data make it obvious that contact comfort is a variable of overwhelming importance in the development of affectional response, whereas lactation is a variable of negligible importance.
    vi_tri: sau Hình 5
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "khoảng 17–18 giờ mỗi ngày ... chỉ sang mẹ sắt đúng lúc bú rồi quay về ngay" (Hình 5 không đọc được; "đúng lúc bú rồi quay về ngay" không có trong văn bản). Chữ "phần lớn" chưa có số; bài viết ở mục khác: nhóm khỉ đặt mẹ muộn ở 250 ngày: gần 9 giờ/ngày trên mẹ vải và dưới 1,5 giờ trên mẹ lưới thép. Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích (Harlow 1958 toàn văn psychclassics hay OpenStax 9.3): khớp trích "overwhelming importance … negligible".'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Harlow/love.htm" ]
    review: dung
  - id: n14
    cau: Với những khỉ bú mẹ lưới thép, thời gian trên mẹ vải tăng dần theo tuổi (khoảng 7 giờ lên khoảng 16 giờ mỗi ngày trong 25 ngày đầu), còn thời gian trên mẹ lưới thép chỉ khoảng 1–2 giờ mỗi ngày.
    loai: phat-hien
    nguon:
      - harlow1958
    trich: 'Figure 5 (FED ON WIRE MOTHER): CLOTH MOTHER ≈ 7 giờ (1–5 ngày) → ≈ 16 giờ (21–25 ngày); WIRE MOTHER ≈ 1–2 giờ ở mọi mốc. Lời văn Harlow: "With age and opportunity to learn, subjects with the lactating wire mother showed decreasing responsiveness to her and increasing responsiveness to the nonlactating cloth mother".'
    vi_tri: thí nghiệm đầu
    ket_qua: da-sua
    luot_2: khong-chac
    luot_2_ghi_chu: Harlow viết đúng như câu. Nhưng Hình 5 (giờ trung bình mỗi ngày, 25 ngày đầu, nhóm bú mẹ lưới) cho thấy thời gian trên mẹ lưới gần như phẳng, hơi tăng (khoảng 1,2 lên 1,8 giờ), chỉ thời gian trên mẹ vải tăng (khoảng 7 lên 16 giờ). Hình 6 (165 ngày) không đọc được. Khó xác nhận 'giảm dần' theo giờ tuyệt đối; có thể là giảm tương đối. Nên diễn đạt 'đáp ứng với mẹ lưới giảm tương đối, mẹ vải tăng'.
    review: sai
    ghi_chu: 'Review (Claude Sonnet 5.5, 30/10/2026): lượt 2 khong-chac, đúng. Đã mở Hình 5 và Hình 6 (psychclassics, fig5.jpg, fig6.jpg): ở nhóm bú mẹ lưới thép, đường mẹ lưới thép gần như phẳng (khoảng 1–2 giờ/ngày, hơi tăng), chỉ đường mẹ vải tăng (7 → 16 giờ); Hình 6 (165 ngày) mẹ vải khoảng 12–16 giờ, mẹ lưới dưới 1,5 giờ. Câu "thời gian trên mẹ lưới thép giảm dần" không đúng với giờ tuyệt đối (Harlow viết "responsiveness" giảm, không phải số giờ). Chữ cũ: "thời gian trên mẹ lưới thép giảm dần theo tuổi còn thời gian trên mẹ vải tăng". Chữ mới như cau. Sửa cả lời giải thích câu 2 (n48).'
  - id: n15
    cau: Khi được cho thấy vật gây sợ như con gấu đồ chơi chuyển động, khỉ con ưa mẹ vải hơn rõ rệt, bất kể mẹ nào có sữa.
    loai: phat-hien
    nguon:
      - harlow1958
    trich: It is apparent that the cloth mother is highly preferred over the wire one, and this differential selectivity is enhanced by age and experience.
    vi_tri: thử nghiệm sợ hãi (Hình 13–15)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đồ chơi gây tiếng động lớn ... chạy ngay về phía mẹ vải, ôm chặt, rồi từ từ bình tĩnh lại — có con còn quay lại đối đầu với vật gây sợ". Bài nói "moving toy bear" (không có tiếng động) và "rushes ... comfort and composure" ở mẹ thật; "quay lại đối đầu" không thấy trong văn bản (chỉ có ở Hình 14?). Bỏ. Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích (Harlow 1958 toàn văn psychclassics hay OpenStax 9.3): khớp (moving toy bear; "highly preferred").'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Harlow/love.htm" ]
    review: dung
  - id: n16
    cau: Trong căn phòng lạ (6 × 6 × 6 feet), 4 trong 8 khỉ được thử, mỗi khỉ 3 phút, hai lần mỗi tuần trong 8 tuần.
    loai: so-lieu
    nguon:
      - harlow1958
    trich: we have completed tests for this relationship on four of our eight baby monkeys assigned to the dual mother-surrogate condition by introducing them for three minutes into the strange environment of a room measuring six feet by six feet by six feet
    vi_tri: open-field test
    ket_qua: da-sua
    ghi_chu: "Chữ cũ không nói rõ chỉ 4/8 con. Mới nêu số liệu. Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích (Harlow 1958 toàn văn psychclassics hay OpenStax 9.3): khớp (4 trong 8, 3 phút, 6 × 6 × 6 feet)."
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Harlow/love.htm" ]
    review: dung
  - id: n17
    cau: Khi mẹ vải có mặt, khỉ con ôm mẹ rồi dùng mẹ làm "căn cứ" để khám phá và quay về; điểm cảm xúc tổng giảm một nửa.
    loai: phat-hien
    nguon:
      - harlow1958
    trich: Total emotionality score was cut in half when the mother was present.
    vi_tri: open-field test
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "khỉ con có mẹ vải bên cạnh dám bò ra khám phá ...; khỉ con không có mẹ vải thì co rúm một chỗ, mút ngón tay, tê liệt vì sợ" mô tả như hai nhóm khỉ khác nhau; thực ra là cùng 4 khỉ khi mẹ có/không có mặt. "Mút ngón tay" bài nêu "sucking" là một chỉ số cảm xúc; "tê liệt vì sợ" đổi thành "co rúm" ("freeze in a crouched position"). Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích (Harlow 1958 toàn văn psychclassics hay OpenStax 9.3): khớp ("base of operations", "cut in half"); trang ghi đúng cùng 4 khỉ khi mẹ có hay vắng.'
    luot_2: dung
