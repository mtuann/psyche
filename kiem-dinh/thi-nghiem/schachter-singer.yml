nhan_dinh:
  - id: n1
    cau: Schachter và Singer (1962) tiêm adrenaline cho người tham gia rồi cho họ ngồi cùng một diễn viên vui vẻ hoặc giận dữ.
    loai: phat-hien
    nguon: &id001
      - schachter1962
    trich: a stooge trained to act euphorically ... a stooge trained to act in an angry fashion
    vi_tri: tr. 383–384 (Producing an Emotion Inducing Situation)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.uniba.it/it/docenti/curci-antonietta/attivita-didattica/metodologia-della-ricerca-psicologia/articolo-metodologia-della-ricerca-schachter-singer-1962/@@download/file/Schachter%20&%20Singer.pdf", "https://doi.org/10.1037/h0046234" ]
    luot_2_ghi_chu: Có cả nhóm giả dược tiêm nước muối; 'tiêm adrenaline' đúng cho các nhóm epinephrine. Đọc toàn văn (bản quét ở uniba.it).
  - id: n2
    cau: 'Lý thuyết hai nhân tố: trạng thái cảm xúc là hàm của kích thích sinh lý và một nhận thức phù hợp với kích thích ấy.'
    loai: dinh-nghia
    nguon: *id001
    trich: an emotional state may be considered a function of a state of physiological arousal and of a cognition appropriate to this state of arousal
    vi_tri: tr. 380
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.uniba.it/it/docenti/curci-antonietta/attivita-didattica/metodologia-della-ricerca-psicologia/articolo-metodologia-della-ricerca-schachter-singer-1962/@@download/file/Schachter%20&%20Singer.pdf" ]
    review: dung
    ghi_chu: "Review (Claude Opus 5.5, 30/10/2026): mục Các lý thuyết giải thích có hai bullet \"Hai nhân tố (Schachter & Singer)\" lặp nhau (sót khi lượt 1 sửa); đã bỏ bullet cũ (\"nhãn 'vui' cho ra phấn khích, nhãn 'nguy hiểm' cho ra sợ hãi\", nói như sự thật), giữ bullet \"Theo hai tác giả, cùng một trạng thái kích thích có thể thành 'vui' hay 'giận' tùy hoàn cảnh\", khớp n2 và tr. 380."
  - id: n3
    cau: 'Thí nghiệm được dựng dưới vỏ bọc "tác dụng của vitamin lên thị lực": người tham gia được tiêm "vitamin Suproxin".'
    loai: phat-hien
    nguon: *id001
    trich: the experiment was cast in the framework of a study of the effects of vitamin supplements on vision
    vi_tri: tr. 382 (Procedure)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.uniba.it/it/docenti/curci-antonietta/attivita-didattica/metodologia-della-ricerca-psicologia/articolo-metodologia-della-ricerca-schachter-singer-1962/@@download/file/Schachter%20&%20Singer.pdf" ]
  - id: n4
    cau: Người tham gia chờ 20 phút để thuốc ngấm.
    loai: phat-hien
    nguon: *id001
    trich: What I ask you to do now is just wait for 20 minutes.
    vi_tri: tr. 384
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.uniba.it/it/docenti/curci-antonietta/attivita-didattica/metodologia-della-ricerca-psicologia/articolo-metodologia-della-ricerca-schachter-singer-1962/@@download/file/Schachter%20&%20Singer.pdf" ]
  - id: n5
    cau: Epinephrine gây tim đập nhanh (palpitation), run tay (tremor) và đôi khi cảm giác nóng bừng mặt.
    loai: phat-hien
    nguon: *id001
    trich: the major subjective symptoms are palpitation, tremor, and sometimes a feeling of flushing and accelerated breathing
    vi_tri: tr. 382
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.uniba.it/it/docenti/curci-antonietta/attivita-didattica/metodologia-della-ricerca-psicologia/articolo-metodologia-della-ricerca-schachter-singer-1962/@@download/file/Schachter%20&%20Singer.pdf" ]
  - id: n6
    cau: Diễn viên vui vẻ gấp máy bay giấy, chơi "bóng rổ" bằng giấy vo viên vào sọt rác, xoay vòng hula hoop.
    loai: phat-hien
    nguon: *id001
    trich: He crumples up other sheets of paper, shoots a few baskets ... "I think I'll make a plane." ... "Hey, look at this—this is great."
    vi_tri: tr. 384 (các đơn vị 2, 5, 14 của màn diễn)
    ket_qua: da-sua
    ghi_chu: 'gia-dinh ở "Tự trải nghiệm": tình huống minh họa ngôi thứ hai theo thí nghiệm gốc. Chữ cũ: "cười ha hả đầy phấn khích"; bài gốc không ghi diễn viên cười ha hả, chỉ nói "I feel like a kid again", "this is great": đổi thành "hồ hởi như trẻ con". Đã sửa. Review (Claude Opus 5.5, 30/10/2026): đối chiếu chữ trên trang với trích bài gốc Schachter & Singer 1962 trong hồ sơ và kết quả lượt 2 (đọc độc lập toàn văn); "hồ hởi như trẻ con" sát "I feel like a kid again"; tình huống ngôi thứ hai là gia-dinh, không trái nhận định nào.'
    luot_2: dung
    luot_2_nguon: [ "https://www.uniba.it/it/docenti/curci-antonietta/attivita-didattica/metodologia-della-ricerca-psicologia/articolo-metodologia-della-ricerca-schachter-singer-1962/@@download/file/Schachter%20&%20Singer.pdf" ]
    review: dung
  - id: n7
    cau: 'Trong thí nghiệm thật, những người không được giải thích đúng về mũi tiêm có xu hướng "bắt" cảm xúc của người ngồi cùng: vui theo người vui, giận theo người giận.'
    loai: phat-hien
    nguon: *id001
    trich: those subjects who had no explanation for the bodily state thus produced, gave behavioral and self-report indications that they had been readily manipulable into the disparate feeling states of euphoria and anger
    vi_tri: tr. 395 (Discussion)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "đã bắt cảm xúc ... vui theo người vui, giận theo người giận", khẳng định không rào đón. Mới: "có xu hướng". Lý do: tự báo cáo giận chỉ p = .08; hành vi vui vẻ của nhóm không được báo trước không khác nhóm được báo đúng có ý nghĩa (Table 3). Review (Claude Opus 5.5, 30/10/2026): đối chiếu chữ trên trang với trích bài gốc Schachter & Singer 1962 trong hồ sơ và kết quả lượt 2 (đọc độc lập toàn văn); "có xu hướng" hợp với p = ,08 ở tự báo cáo giận và hành động vui không có ý nghĩa ở nhóm không được báo.'
    luot_2: dung
    luot_2_nguon: [ "https://www.uniba.it/it/docenti/curci-antonietta/attivita-didattica/metodologia-della-ricerca-psicologia/articolo-metodologia-della-ricerca-schachter-singer-1962/@@download/file/Schachter%20&%20Singer.pdf" ]
    luot_2_ghi_chu: "Điều kiện giận: chỉ số hành vi Epi Ign +2,28 so với Epi Inf −0,18, p < ,05."
    review: dung
  - id: n8
    cau: Những người được báo trước "thuốc sẽ làm tim đập nhanh" ít bị cuốn theo cảm xúc của diễn viên hơn hẳn.
    loai: phat-hien
    nguon: *id001
    trich: In those conditions in which subjects were injected with epinephrine and told precisely what they would feel and why, they proved relatively immune to any effects of the manipulated cognitions.
    vi_tri: tr. 396
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "giữ được bình tĩnh"; mới: "ít bị cuốn theo hơn hẳn", đúng chữ "relatively immune". Review (Claude Opus 5.5, 30/10/2026): đối chiếu chữ trên trang với trích bài gốc Schachter & Singer 1962 trong hồ sơ và kết quả lượt 2 (đọc độc lập toàn văn); "ít bị cuốn theo hơn hẳn" là "relatively immune".'
    luot_2: dung
    luot_2_nguon: [ "https://www.uniba.it/it/docenti/curci-antonietta/attivita-didattica/metodologia-della-ricerca-psicologia/articolo-metodologia-della-ricerca-schachter-singer-1962/@@download/file/Schachter%20&%20Singer.pdf" ]
    luot_2_ghi_chu: "Vui: tự báo cáo Epi Inf 0,98 so với 1,78 (p = ,02) và 1,90 (p < ,01); giận: chỉ số hành vi −0,18 so với +2,28. 'Hơn hẳn' hợp với các so sánh có ý nghĩa; riêng chỉ số hành động vui Inf và Ign không khác có ý nghĩa."
    review: dung
  - id: n9
    cau: 'Hai tác giả đề xuất: cảm xúc gồm kích thích sinh lý và cái nhãn nhận thức mà não gắn lên nó.'
    loai: lich-su
    nguon: *id001
    trich: It is the cognition which determines whether the state of physiological arousal will be labeled as "anger," "joy," "fear," or whatever.
    vi_tri: tr. 380
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Kết luận: cảm xúc = kích thích sinh lý + cái nhãn mà não dán lên nó" (kết luận). Mới: "hai tác giả đề xuất", vì sau này chỉ được ủng hộ một phần (Reisenzein 1983). Review (Claude Opus 5.5, 30/10/2026): đối chiếu chữ trên trang với trích bài gốc Schachter & Singer 1962 trong hồ sơ và kết quả lượt 2 (đọc độc lập toàn văn); "đề xuất" đúng mức (tr. 380).'
    luot_2: dung
    luot_2_nguon: [ "https://www.uniba.it/it/docenti/curci-antonietta/attivita-didattica/metodologia-della-ricerca-psicologia/articolo-metodologia-della-ricerca-schachter-singer-1962/@@download/file/Schachter%20&%20Singer.pdf" ]
    review: dung
  - id: n10
    cau: Các nghiên cứu sau chỉ ủng hộ một phần đề xuất hai nhân tố.
    loai: phat-hien
    nguon:
      - reisenzein1983
    trich: the available data support at best a rather attenuated version of Schachter's theory
    vi_tri: Tóm tắt (OpenAlex)
    ket_qua: dung
    ghi_chu: Chỉ đọc tóm tắt Reisenzein.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.94.2.239", "https://doi.org/10.1002/ejsp.2420110403" ]
    luot_2_ghi_chu: "đọc tóm tắt qua OpenAlex (toan_van: false)"
  - id: n11
    cau: 'Schachter và Singer đặt câu hỏi: nếu cơ thể đã "báo động" mà người ta chưa biết vì sao, họ sẽ làm gì, và họ dựa vào hoàn cảnh để gọi tên cảm xúc.'
    loai: lich-su
    nguon: *id001
    trich: Given a state of physiological arousal for which an individual has no immediate explanation, he will "label" this state and describe his feelings in terms of the cognitions available to him.
    vi_tri: tr. 381 (mệnh đề 1)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chúng ta thường nghĩ cảm xúc đi từ trong ra ngoài ... đảo ngược câu hỏi ... não nhìn quanh, tìm lời giải thích gần nhất". Mới: gọi đó là câu trả lời của hai tác giả, một giả thuyết ("não" và "lời giải thích gần nhất" không có trong bài gốc). Phần mô tả thói quen nghĩ chung của người đọc không cần nguồn. Review (Claude Opus 5.5, 30/10/2026): đối chiếu chữ trên trang với trích bài gốc Schachter & Singer 1962 trong hồ sơ và kết quả lượt 2 (đọc độc lập toàn văn); câu trên trang ghi rõ đây là giả thuyết, các nghiên cứu sau chỉ ủng hộ một phần.'
    luot_2: dung
    luot_2_nguon: [ "https://www.uniba.it/it/docenti/curci-antonietta/attivita-didattica/metodologia-della-ricerca-psicologia/articolo-metodologia-della-ricerca-schachter-singer-1962/@@download/file/Schachter%20&%20Singer.pdf" ]
    review: dung
  - id: n12
    cau: Hai tác giả hình dung tim đập nhanh giữa buổi tiệc vui là "phấn khích" và trong con hẻm tối là "sợ hãi".
    loai: lich-su
    nguon: *id001
    trich: Should he be at a gay party, he might, by comparing himself to others, decide that he was extremely happy and euphoric.
    vi_tri: tr. 381; ví dụ hẻm tối ở tr. 380
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Tim đập nhanh giữa buổi tiệc vui thành phấn khích; ... con hẻm tối thành sợ hãi" như sự thật. Mới: ví dụ của hai tác giả. Trong bài, hẻm tối là ví dụ về kích thích có nguyên nhân rõ (không có kích thích bí ẩn). Review (Claude Opus 5.5, 30/10/2026): đối chiếu chữ trên trang với trích bài gốc Schachter & Singer 1962 trong hồ sơ và kết quả lượt 2 (đọc độc lập toàn văn); trang ghi "hai tác giả hình dung"; bài gốc dùng bữa tiệc cho kích thích không rõ nguyên nhân, hẻm tối cho kích thích có nguyên nhân rõ; câu không trái bài gốc.'
    luot_2: dung
    luot_2_nguon: [ "https://www.uniba.it/it/docenti/curci-antonietta/attivita-didattica/metodologia-della-ricerca-psicologia/articolo-metodologia-della-ricerca-schachter-singer-1962/@@download/file/Schachter%20&%20Singer.pdf" ]
    luot_2_ghi_chu: Bài gốc dùng chữ 'happy and euphoric' cho bữa tiệc; ví dụ hẻm tối là khi kích thích do chính tình huống (người cầm súng). Gần đúng.
    review: dung
