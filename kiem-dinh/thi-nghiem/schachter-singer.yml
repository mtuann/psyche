    ghi_chu: 'Opus: vẫn không mở được tóm tắt hay toàn văn (OpenAlex, Europe PMC không có tóm tắt; không thấy bản mở). Chỉ giữ điều nhan đề và siêu dữ liệu cho biết. Chữ cũ: "Theo các tổng kết thứ cấp, kích thích không giải thích được có xu hướng nghiêng về cảm xúc tiêu cực hơn là trung tính (Marshall và Zimbardo; Maslach)". Mới: chỉ dựa vào nhan đề của Maslach (tác giả tự tóm kết quả), bỏ Marshall & Zimbardo và "hơn là trung tính". Lượt 2: nhan đề là nguồn mỏng; nếu mở được tóm tắt thì kiểm lại. Review (Claude Opus 5.5, 30/10/2026): sai một phần: vế trong khung Đang tranh cãi ("Tên bài của Maslach (1979) cho thấy kích thích không được giải thích bị nghiêng về cảm xúc tiêu cực, trong khi lý thuyết gốc cho rằng nhãn cảm xúc đến từ hoàn cảnh") dùng một nhan đề làm căn cứ cho nhãn và thêm một phép so sánh mà không nguồn nào mở được nói. Không mở được bài Maslach, tóm tắt của nó, hay toàn văn Reisenzein 1983 (OpenAlex: closed; Internet Archive và tìm web không có bản mở; nguồn kể thiết kế chỉ là arXiv 2406.11086, bậc 3). Đã bỏ vế ấy khỏi khung; giữ ở mục 1979 câu chỉ nói điều nhan đề nói. Bỏ schachter1962 khỏi nguon (không còn vế so sánh).'
