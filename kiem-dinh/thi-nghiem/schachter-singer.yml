  - id: n32
    cau: 'Năm 1979, cùng một số của Journal of Personality and Social Psychology đăng hai bài thử lại ý tưởng của Schachter và Singer: bài của Marshall và Zimbardo về hệ quả cảm xúc của kích thích sinh lý không được giải thích thỏa đáng, và bài của Maslach; Schachter và Singer viết bài phản hồi trong cùng số. Trang không kể thiết kế và số liệu.'
    loai: lich-su
    nguon:
      - marshall1979
      - maslach1979
      - schachter1979
      - cotton1981
    trich: Affective consequences of inadequately explained physiological arousal (37(6), 970–988); Negative emotional biasing of unexplained arousal (37(6), 953–969); Comments on the Maslach and Marshall-Zimbardo experiments (37(6), 989–995)
    vi_tri: nhan đề và siêu dữ liệu ba bài
    ket_qua: da-sua
    ghi_chu: 'Opus: vẫn không mở được tóm tắt hay toàn văn (OpenAlex, Europe PMC không có tóm tắt; không thấy bản mở). Chỉ giữ điều nhan đề và siêu dữ liệu cho biết. Chữ cũ: tiêu đề mục "Marshall và Zimbardo (1979): làm lại điều kiện vui vẻ — thất bại"; "thử làm lại phần điều kiện vui vẻ: người tham gia tiêm epinephrine hoặc giả dược rồi ngồi cùng diễn viên vui vẻ" (chỉ nguồn bậc 3). Mới: tiêu đề "Marshall và Zimbardo (1979), Maslach (1979): thử lại năm 1979", đoạn như câu trên. "Thử lại ý tưởng" dựa vào nhan đề và bài phản hồi của Schachter & Singer. Đổi tiêu đề làm đổi id mục: đã grep, không có link #mục nào trỏ tới. Review (Claude Opus 5.5, 30/10/2026): trang chỉ kể điều nhan đề và siêu dữ liệu cho biết; "thử lại" có cơ sở ở nhan đề bài phản hồi của Schachter & Singer 1979 ("Comments on the Maslach and Marshall-Zimbardo experiments") và tóm tắt Cotton 1981 ("The classic Schachter and Singer (1962) study is reviewed, along with criticisms and later attempted replications"; OpenAlex). Đã thử tìm toàn văn hay tóm tắt Marshall & Zimbardo 1979, Maslach 1979, Reisenzein 1983 (OpenAlex: closed, không tóm tắt; Internet Archive; tìm web): không mở được, nên giữ mức nhan đề. Thêm cotton1981 vào nguon.'
    luot_2: dung
    luot_2_nguon: [ "https://api.crossref.org/works/10.1037/0022-3514.37.6.970", "https://api.crossref.org/works/10.1037/0022-3514.37.6.953", "https://api.crossref.org/works/10.1037/0022-3514.37.6.989" ]
    luot_2_ghi_chu: "Siêu dữ liệu Crossref: JPSP 37(6), tr. 953–969 (Maslach), 970–988 (Marshall và Zimbardo), 989–995 (Schachter và Singer, 'Comments on the Maslach and Marshall-Zimbardo experiments'). Phần 'trang không kể' là về site."
    review: dung
