    ghi_chu: 'chỗ khó (Opus): giữ Đang tranh cãi; bỏ marshall1979 khỏi căn cứ (chỉ có nhan đề, không nói kết quả). Chữ lượt 1 cuối khung: "; và theo các tổng kết thứ cấp, hai nghiên cứu năm 1979 (Marshall và Zimbardo; Maslach) không lặp lại hiệu ứng gốc." Mới: ". Tên bài của Maslach (1979) cho thấy kích thích không được giải thích bị nghiêng về cảm xúc tiêu cực, trong khi lý thuyết gốc cho rằng nhãn cảm xúc đến từ hoàn cảnh." Khung Đã bị bác bỏ cũ (n47) vẫn bỏ: không đủ căn cứ. Lượt 1 trước đó: chỗ khó: chữ cũ nói "không đứng vững", dẫn Cotton "kết quả khá hỗn hợp". Cotton thực ra nói "not well supported ... not necessarily disproven". Đổi chữ khung và giữ nhãn. Marshall/Maslach chỉ có thông tin thứ cấp. Review (Claude Opus 5.5, 30/10/2026): nhãn so thước đo mục 4: hai tổng quan (Reisenzein 1983, Cotton 1981) cho thấy phiên bản mạnh chưa được ủng hộ mà cũng chưa bị bác, và chỉ còn phiên bản yếu hơn nhiều so với tuyên bố ban đầu: hợp Đang tranh cãi. Đã bỏ khỏi khung câu "Tên bài của Maslach (1979) cho thấy … nghiêng về cảm xúc tiêu cực, trong khi lý thuyết gốc…": căn cứ chỉ là nhan đề, không đủ làm cơ sở cho nhãn; bỏ maslach1979 khỏi co_so và nguon.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.94.2.239", "https://doi.org/10.1002/ejsp.2420110403" ]
    luot_2_ghi_chu: "Reisenzein: không có bằng chứng thuyết phục cho tính cần thiết của kích thích và cho việc dán nhãn tạo ra cảm xúc; Cotton: chưa được ủng hộ tốt nhưng chưa bị bác bỏ. Hợp Đang tranh cãi; Đã bị bác bỏ sẽ quá mạnh."
