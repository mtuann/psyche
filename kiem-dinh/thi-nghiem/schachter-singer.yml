nhan_dinh:
- id: n1
  cau: Schachter và Singer (1962) tiêm adrenaline cho người tham gia rồi cho họ ngồi cùng một diễn viên vui vẻ hoặc giận dữ.
  loai: phat-hien
  nguon: &id001
  - schachter1962
  trich: a stooge trained to act euphorically ... a stooge trained to act in an angry fashion
  vi_tri: tr. 383–384 (Producing an Emotion Inducing Situation)
  ket_qua: dung
- id: n2
  cau: 'Lý thuyết hai nhân tố: trạng thái cảm xúc là hàm của kích thích sinh lý và một nhận thức phù hợp với kích thích ấy.'
  loai: dinh-nghia
  nguon: *id001
  trich: an emotional state may be considered a function of a state of physiological arousal and of a cognition appropriate to this state of arousal
  vi_tri: tr. 380
  ket_qua: dung
- id: n3
  cau: 'Thí nghiệm được dựng dưới vỏ bọc "tác dụng của vitamin lên thị lực": người tham gia được tiêm "vitamin Suproxin".'
  loai: phat-hien
  nguon: *id001
  trich: the experiment was cast in the framework of a study of the effects of vitamin supplements on vision
  vi_tri: tr. 382 (Procedure)
  ket_qua: dung
- id: n4
  cau: Người tham gia chờ 20 phút để thuốc ngấm.
  loai: phat-hien
  nguon: *id001
  trich: What I ask you to do now is just wait for 20 minutes.
  vi_tri: tr. 384
  ket_qua: dung
- id: n5
  cau: Epinephrine gây tim đập nhanh (palpitation), run tay (tremor) và đôi khi cảm giác nóng bừng mặt.
  loai: phat-hien
  nguon: *id001
  trich: the major subjective symptoms are palpitation, tremor, and sometimes a feeling of flushing and accelerated breathing
  vi_tri: tr. 382
  ket_qua: dung
- id: n6
  cau: Diễn viên vui vẻ gấp máy bay giấy, chơi "bóng rổ" bằng giấy vo viên vào sọt rác, xoay vòng hula hoop.
  loai: phat-hien
  nguon: *id001
  trich: He crumples up other sheets of paper, shoots a few baskets ... "I think I'll make a plane." ... "Hey, look at this—this is great."
  vi_tri: tr. 384 (các đơn vị 2, 5, 14 của màn diễn)
  ket_qua: da-sua
  ghi_chu: 'gia-dinh ở "Tự trải nghiệm": tình huống minh họa ngôi thứ hai theo thí nghiệm gốc. Chữ cũ: "cười ha hả đầy phấn khích"; bài gốc không ghi diễn viên cười ha hả, chỉ nói "I feel like a kid again", "this is great": đổi thành "hồ hởi như trẻ con". Đã sửa.'
- id: n7
  cau: 'Trong thí nghiệm thật, những người không được giải thích đúng về mũi tiêm có xu hướng "bắt" cảm xúc của người ngồi cùng: vui theo người vui, giận theo người giận.'
  loai: phat-hien
  nguon: *id001
  trich: those subjects who had no explanation for the bodily state thus produced, gave behavioral and self-report indications that they had been readily manipulable into the disparate feeling states of euphoria and anger
  vi_tri: tr. 395 (Discussion)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "đã bắt cảm xúc ... vui theo người vui, giận theo người giận", khẳng định không rào đón. Mới: "có xu hướng". Lý do: tự báo cáo giận chỉ p = .08; hành vi vui vẻ của nhóm không được báo trước không khác nhóm được báo đúng có ý nghĩa (Table 3).'
- id: n8
  cau: Những người được báo trước "thuốc sẽ làm tim đập nhanh" ít bị cuốn theo cảm xúc của diễn viên hơn hẳn.
  loai: phat-hien
  nguon: *id001
  trich: In those conditions in which subjects were injected with epinephrine and told precisely what they would feel and why, they proved relatively immune to any effects of the manipulated cognitions.
  vi_tri: tr. 396
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "giữ được bình tĩnh"; mới: "ít bị cuốn theo hơn hẳn", đúng chữ "relatively immune".'
- id: n9
  cau: 'Hai tác giả đề xuất: cảm xúc gồm kích thích sinh lý và cái nhãn nhận thức mà não gắn lên nó.'
  loai: lich-su
  nguon: *id001
  trich: It is the cognition which determines whether the state of physiological arousal will be labeled as "anger," "joy," "fear," or whatever.
  vi_tri: tr. 380
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Kết luận: cảm xúc = kích thích sinh lý + cái nhãn mà não dán lên nó" (kết luận). Mới: "hai tác giả đề xuất", vì sau này chỉ được ủng hộ một phần (Reisenzein 1983).'
- id: n10
  cau: Các nghiên cứu sau chỉ ủng hộ một phần đề xuất hai nhân tố.
  loai: phat-hien
  nguon:
  - reisenzein1983
  trich: the available data support at best a rather attenuated version of Schachter's theory
  vi_tri: Tóm tắt (OpenAlex)
  ket_qua: dung
  ghi_chu: Chỉ đọc tóm tắt Reisenzein.
- id: n11
  cau: 'Schachter và Singer đặt câu hỏi: nếu cơ thể đã "báo động" mà người ta chưa biết vì sao, họ sẽ làm gì, và họ dựa vào hoàn cảnh để gọi tên cảm xúc.'
  loai: lich-su
  nguon: *id001
  trich: Given a state of physiological arousal for which an individual has no immediate explanation, he will "label" this state and describe his feelings in terms of the cognitions available to him.
  vi_tri: tr. 381 (mệnh đề 1)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Chúng ta thường nghĩ cảm xúc đi từ trong ra ngoài ... đảo ngược câu hỏi ... não nhìn quanh, tìm lời giải thích gần nhất". Mới: gọi đó là câu trả lời của hai tác giả, một giả thuyết ("não" và "lời giải thích gần nhất" không có trong bài gốc). Phần mô tả thói quen nghĩ chung của người đọc không cần nguồn.'
- id: n12
  cau: Hai tác giả hình dung tim đập nhanh giữa buổi tiệc vui là "phấn khích" và trong con hẻm tối là "sợ hãi".
  loai: lich-su
  nguon: *id001
  trich: Should he be at a gay party, he might, by comparing himself to others, decide that he was extremely happy and euphoric.
  vi_tri: tr. 381; ví dụ hẻm tối ở tr. 380
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Tim đập nhanh giữa buổi tiệc vui thành phấn khích; ... con hẻm tối thành sợ hãi" như sự thật. Mới: ví dụ của hai tác giả. Trong bài, hẻm tối là ví dụ về kích thích có nguyên nhân rõ (không có kích thích bí ẩn).'
- id: n13
  cau: 184 nam sinh viên đồng ý được tiêm.
  loai: so-lieu
  nguon: *id001
  trich: If the subject agrees to the injection (and all but 1 of 185 subjects did)
  vi_tri: tr. 382
  ket_qua: dung
  ghi_chu: 'chỗ khó: 185 người được mời, 1 từ chối = 184. Nhưng Table 1 có N = 27+26+26+26+23+23+23 = 174, cộng 11 người bị loại vì quá nghi ngờ = 185: hai con số không khớp hẳn (chênh 1). Trang dùng 184 theo câu "all but 1 of 185"; người giao/lượt 2 cân nhắc.'
- id: n14
  cau: Người tham gia đều là nam sinh viên các lớp nhập môn tâm lý học ở Đại học Minnesota.
  loai: phat-hien
  nguon: *id001
  trich: The subjects were all male, college students taking classes in introductory psychology at the University of Minnesota.
  vi_tri: tr. 387 (Subjects)
  ket_qua: dung
- id: n15
  cau: Người tham gia được tiêm epinephrine hoặc giả dược (nước muối).
  loai: phat-hien
  nguon: *id001
  trich: Subjects in the placebo condition received a subcutaneous injection of ½ cubic centimeter of saline solution.
  vi_tri: tr. 382
  ket_qua: dung
- id: n16
  cau: 'Nhóm tiêm adrenaline được chia ba: được báo đúng, không được báo gì, bị báo sai.'
  loai: phat-hien
  nguon: *id001
  trich: Epinephrine Informed (Epi Inf), Epinephrine Ignorant (Epi Ign), and Epinephrine Misinformed (Epi Mis)
  vi_tri: tr. 383
  ket_qua: dung
- id: n17
  cau: Nhóm được báo đúng được nói rằng thuốc sẽ làm tim đập nhanh, run tay, mặt nóng.
  loai: phat-hien
  nguon: *id001
  trich: your hand will start to shake, your heart will start to pound, and your face may get warm and flushed
  vi_tri: tr. 383
  ket_qua: dung
- id: n18
  cau: Nhóm bị báo sai được nói thuốc gây tê chân, ngứa và hơi đau đầu.
  loai: phat-hien
  nguon: *id001
  trich: your feet will feel numb, you will have an itching sensation over parts of your body, and you may get a slight headache
  vi_tri: tr. 383
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "thuốc gây ngứa hoặc đau đầu"; mới thêm "tê chân", "hơi đau đầu".'
- id: n19
  cau: Nhóm bị báo sai chỉ có ở điều kiện vui vẻ, không có ở điều kiện giận dữ.
  loai: phat-hien
  nguon: *id001
  trich: The Epi Mis condition was not run in the Anger sequence.
  vi_tri: tr. 386
  ket_qua: da-sua
  ghi_chu: Chi tiết thêm vào trang; chữ cũ không nói.
- id: n20
  cau: Trong điều kiện vui vẻ, diễn viên gấp máy bay giấy, chơi bóng rổ giấy, làm ná chun, xoay hula hoop.
  loai: phat-hien
  nguon: *id001
  trich: He wads up paper and making a slingshot of a rubber band begins to shoot the paper.
  vi_tri: tr. 384 (đơn vị 9)
  ket_qua: dung
- id: n21
  cau: Trong điều kiện giận dữ, hai người làm một bảng hỏi ngày càng riêng tư và xúc phạm; diễn viên ngày càng bực, xé bảng hỏi rồi bỏ ra ngoài.
  loai: phat-hien
  nguon: *id001
  trich: The questionnaires, five pages long, start off innocently requesting face sheet information and then grow increasingly personal and insulting.
  vi_tri: tr. 385
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "ngày càng riêng tư"; thêm "và xúc phạm" theo trích.'
- id: n22
  cau: Cảm xúc được đo bằng quan sát qua gương một chiều và bảng tự báo cáo.
  loai: phat-hien
  nguon: *id001
  trich: Standardized observation through a one-way mirror was the technique used to assess the subject's behavior ... The second type of measure was selfreport
  vi_tri: tr. 386
  ket_qua: dung
- id: n23
  cau: Ở điều kiện vui vẻ, nhóm không được báo trước và nhóm bị báo sai tự báo cáo vui hơn nhóm được báo đúng (điểm 1,78 và 1,90, so với 0,98).
  loai: so-lieu
  nguon: *id001
  trich: Epi Inf 0.98; Epi Ign 1.78; Epi Mis 1.90; Epi Inf vs. Epi Mis p<.01; Epi Inf vs. Epi Ign p .02
  vi_tri: Table 2, tr. 390
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: không có con số. Mới thêm các điểm và p của Table 2.'
- id: n24
  cau: Ở điều kiện vui vẻ, nhóm không được báo trước và nhóm bị báo sai có xu hướng hành động hưng phấn hơn nhóm được báo đúng; chênh lệch về chỉ số hành động chỉ có ý nghĩa thống kê với nhóm bị báo sai.
  loai: so-lieu
  nguon: *id001
  trich: 'Activity index: Epi Inf 12.72; Epi Ign 18.28; Epi Mis 22.56; Epi Inf vs. Epi Mis .05; Epi Inf vs. Epi Ign ns'
  vi_tri: Table 3, tr. 390
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "cũng hành động hưng phấn hơn" không điều kiện. Mới làm mềm theo Table 3.'
- id: n25
  cau: Ở điều kiện giận dữ, chỉ số hành vi giận của nhóm không được báo trước cao hơn hẳn nhóm được báo đúng (+2,28 so với −0,18).
  loai: so-lieu
  nguon: *id001
  trich: 'Anger units: Epi Inf -0.18; Epi Ign +2.28; Epi Inf vs. Epi Ign <.05'
  vi_tri: Table 5, tr. 392
  ket_qua: da-sua
  ghi_chu: Chữ cũ không có số.
- id: n26
  cau: Tự báo cáo giận cùng chiều nhưng chưa đạt mức ý nghĩa (1,91 so với 1,39; p = ,08).
  loai: so-lieu
  nguon: *id001
  trich: Epi Inf 1.91; Epi Ign 1.39; Epi Inf vs. Epi Ign .08
  vi_tri: Table 4, tr. 392
  ket_qua: da-sua
  ghi_chu: Chữ cũ không nói.
- id: n27
  cau: Các tác giả cho biết người tham gia ngại bộc lộ giận trước người thí nghiệm, vì sợ mất điểm thi.
  loai: phat-hien
  nguon: *id001
  trich: the subjects ... simply refused to endanger these points by publicly blowing up, admitting their irritation to the experimenter's face or spoiling the questionnaire
  vi_tri: tr. 391
  ket_qua: da-sua
  ghi_chu: Chi tiết thêm. Trang viết "ngại lộ giận trước người thí nghiệm" (bỏ "vì sợ mất điểm" khỏi trang).
- id: n28
  cau: Nhóm giả dược nằm giữa các nhóm epinephrine; chênh lệch với nhóm epinephrine không có ý nghĩa thống kê ở điều kiện vui vẻ.
  loai: phat-hien
  nguon: *id001
  trich: Placebo subjects are less euphoric than either Epi Mis or Epi Ign subjects but somewhat more euphoric than Epi Inf subjects. These differences are not, however, statistically significant.
  vi_tri: tr. 390
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Nhóm giả dược chỉ chịu ảnh hưởng nhẹ" (không đúng nghĩa: placebo cao hơn Epi Inf, thấp hơn Epi Ign/Mis). Đã sửa.'
- id: n29
  cau: Các tác giả gọi kết quả của nhóm giả dược là "đáng lo" cho lý thuyết, nên phải dùng phân tích phụ.
  loai: lich-su
  nguon: *id001
  trich: This is a particularly troubling pattern for it makes it impossible to evaluate unequivocally the effects of the state of physiological arousal and indeed raises serious questions about our entire theoretical structure.
  vi_tri: tr. 393
  ket_qua: da-sua
  ghi_chu: Chi tiết thêm.
- id: n30
  cau: Phân tích phụ loại những người tự gán triệu chứng cho mũi tiêm; các tác giả gọi kết luận của mình là dè dặt (tentative).
  loai: phat-hien
  nguon: *id001
  trich: the fact that we were forced, to some extent, to rely on internal analyses in order to partial out the effects of experimental artifacts inevitably makes our conclusions somewhat tentative
  vi_tri: tr. 396
  ket_qua: da-sua
  ghi_chu: Chi tiết thêm.
- id: n31
  cau: 'Ba mệnh đề: (a) kích thích không có lời giải thích sẽ được dán nhãn theo nhận thức sẵn có; (b) kích thích đã có lời giải thích phù hợp thì không cần dán nhãn thêm; (c) cùng bối cảnh nhận thức, phản ứng cảm xúc chỉ xuất hiện khi có kích thích sinh lý.'
  loai: dinh-nghia
  nguon: *id001
  trich: 1. Given a state of physiological arousal for which an individual has no immediate explanation, he will "label" this state ... 2. ... no evaluative needs will arise ... 3. Given the same cognitive circumstances, the individual will react emotionally ... only to the extent that he experiences a state of physiological arousal.
  vi_tri: tr. 381–382
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "(c) cảm xúc chỉ xuất hiện khi có kích thích sinh lý"; mới thêm "cùng bối cảnh nhận thức, phản ứng cảm xúc". Các tác giả ghi bằng chứng cho mệnh đề 3 là "nhất quán nhưng dè dặt" (tr. 395).'
- id: n32
  cau: Marshall và Zimbardo (1979) thử làm lại phần điều kiện vui vẻ, tiêm epinephrine hoặc giả dược rồi cho ngồi cùng diễn viên vui vẻ.
  loai: tai-lap
  nguon:
  - marshall1979
  ket_qua: null
  ghi_chu: 'chưa chắc: chỉ có nhan đề và siêu dữ liệu (Crossref); chi tiết thiết kế theo tóm tắt thứ cấp của WebSearch (Wikipedia: "tried to replicate the euphoria conditions"), bậc 3.'
- id: n33
  cau: Theo các tổng kết thứ cấp, hành vi của diễn viên vui vẻ ít ảnh hưởng đến người tham gia trong nghiên cứu của Marshall và Zimbardo, không như kết quả gốc.
  loai: tai-lap
  nguon:
  - marshall1979
  ket_qua: null
  ghi_chu: 'chưa chắc: không mở được bài gốc. Chữ cũ: "diễn viên vui vẻ không tạo thêm sự vui vẻ so với diễn viên trung tính, và người tiêm epinephrine không dễ bị lây hơn giả dược" (chi tiết cụ thể, không kiểm được): đã làm mềm xuống mức tổng kết thứ cấp. Cần nguồn bậc 1 (người giao mở bản PsycNet).'
- id: n34
  cau: Theo các tổng kết thứ cấp, kích thích không giải thích được có xu hướng nghiêng về cảm xúc tiêu cực hơn là trung tính (Marshall và Zimbardo; Maslach).
  loai: tai-lap
  nguon:
  - marshall1979
