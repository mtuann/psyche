    ghi_chu: 'Opus: vẫn không mở được tóm tắt hay toàn văn (OpenAlex, Europe PMC không có tóm tắt; không thấy bản mở). Chỉ giữ điều nhan đề và siêu dữ liệu cho biết. Bỏ câu "hành vi của diễn viên vui vẻ ít ảnh hưởng đến người tham gia, trái với kết quả gốc": chỉ có nguồn bậc 3, không được làm nguồn duy nhất (chuẩn mục 2). Review (Claude Opus 5.5, 30/10/2026): đã kiểm trang thật: câu không còn (mục 1979 chỉ kể nhan đề). Bỏ đúng: nguồn duy nhất cho kết quả là bài arXiv (bậc 3), không dẫn được tổng kết bậc 2 mở được (Reisenzein 1983 không có toàn văn mở).'
