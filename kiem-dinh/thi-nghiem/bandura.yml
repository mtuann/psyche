  vi_tri: Method; Results, Nonimitative Aggression
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Búp bê Bobo được thiết kế để bị đánh. Đúng vậy — một phê bình phương pháp nghiêm túc ... Một số nhà phê bình cho rằng trẻ chỉ đang chơi đúng công dụng". Bỏ "phê bình" (không
