  - id: n33
    cau: 'Khá vững: con người, kể cả trẻ nhỏ, có thể học hành vi mới chỉ bằng quan sát, không cần tự mình được thưởng hay phạt.'
    loai: nhan
    nguon:
      - bandura1961
      - bandura1963
      - bandura1965
    trich: without any reinforcers delivered either to the models or to the observers
    vi_tri: Discussion (1961); abstract 1965
    nhan: kha-vung
    co_so:
      - bandura1961
      - bandura1963
      - bandura1965
      - openstax2e
      - taylor2005
    ly_do: 'Ba nghiên cứu của một nhóm (1961 toàn văn, 1963 và 1965 chỉ tóm tắt) cùng chiều, có nhóm đối chứng; nhưng chưa có phân tích tổng hợp hay tái lập lớn do nhóm khác làm, mẫu là trẻ mẫu giáo ở một trường Mỹ, nên đúng mô tả Khá vững (mục 4). Opus xét lại (chỗ khó, nguyên lý học tập cơ bản): giữ Khá vững. Học theo mẫu là kiến thức nền của giáo trình (OpenStax 6.4), và có phân tích tổng hợp 117 nghiên cứu về huấn luyện theo mẫu hành vi ở người lớn (Taylor 2005), nhưng huấn luyện ấy gồm cả thực hành và phản hồi, nên không kiểm riêng vế "chỉ bằng quan sát, không cần được thưởng". Vế đó chỉ dựa trên các thí nghiệm của nhóm Bandura; chưa mở được phân tích tổng hợp hay tái lập lớn độc lập cho nó.'
    ket_qua: da-lam-mem
    ghi_chu: 'chỗ khó: chữ cũ là :::vung-chac, nhắc "hàng loạt nghiên cứu sau này trên nhiều nền văn hóa", "một trong những lý thuyết có ảnh hưởng nhất". Chưa mở được phân tích tổng hợp về học qua quan sát/bắt chước, nên chưa đạt Vững chắc theo thước đo; hạ Khá vững. Người giao/lượt 2: nếu có phân tích tổng hợp thì có thể nâng. Bỏ câu "nhiều nền văn hóa", "ảnh hưởng nhất" (không nguồn). Review (Claude Opus 5.5, 30/10/2026): nhãn so thước đo mục 4: ba nghiên cứu của một nhóm cùng chiều, có đối chứng, cộng giáo trình bậc 2 (OpenStax 6.4) và phân tích tổng hợp Taylor 2005 (huấn luyện theo mẫu, có thực hành nên chỉ là căn cứ phụ); chưa có phân tích tổng hợp hay tái lập lớn độc lập cho vế "chỉ bằng quan sát": Khá vững là đúng, chưa Vững chắc. Khung nói rõ giới hạn.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Bandura/bobo.htm", "https://doi.org/10.1037/h0022070" ]
    luot_2_ghi_chu: "Nhãn 'Khá vững' không cao hơn thước: nhiều nghiên cứu cùng chiều, chưa có tái lập lớn có đăng ký trước hay phân tích tổng hợp riêng cho điểm này."
    review: dung
  - id: n34
    cau: 'Khá vững: bé trai bắt chước gây hấn thể chất nhiều hơn bé gái, và mẫu nam có ảnh hưởng rõ hơn mẫu nữ.'
    loai: nhan
