nhan_dinh:
- id: n1
  cau: Bandura, Ross & Ross (1961) cho trẻ xem người lớn đánh búp bê Bobo; trẻ bắt chước gây hấn nhiều hơn hẳn nhóm xem người lớn chơi hiền lành và nhóm không xem gì.
  loai: phat-hien
  nguon:
  - bandura1961
  trich: Subjects given an opportunity to observe aggressive models later reproduced a good deal of physical and verbal aggression (as well as nonaggressive responses) substantially identical
    with that of the model.
  vi_tri: Discussion
  ket_qua: da-sua
  ghi_chu: 'Câu mô tả (description). Chữ cũ: "nhiều hơn hẳn nhóm đối chứng, đặt nền móng cho học quan sát, và mở ra tranh luận kéo dài về bạo lực truyền thông"; mới như trên, thêm "cho thấy trẻ
    có thể học hành vi mới chỉ bằng quan sát". Lý do: nhóm xem mẫu hiền lành là nhóm so sánh thứ hai; "đặt nền móng", "mở ra tranh luận" là đánh giá lịch sử không có trong nguồn đã mở (xem n8).'
- id: n2
  cau: Búp bê trong thí nghiệm là búp bê bơm hơi cao khoảng 1,5 mét (Bobo).
  loai: so-lieu
  nguon:
  - bandura1961
  trich: a 5-foot inflated Bobo doll
  vi_tri: Method, Experimental Conditions
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "búp bê bơm hơi hình chú hề"; mới: "cao khoảng 1,5 mét". Lý do: bài không nói hình chú hề; búp bê của người mẫu cao 5 feet (phòng thử có búp bê 3 feet). gia-dinh: đoạn "Tự
    trải nghiệm" là tình huống minh họa.'
- id: n3
  cau: 'Hầu hết trẻ xem mẫu gây hấn thực hiện các hành vi gây hấn lạ của người mẫu: ngồi lên búp bê rồi đấm vào mũi, đập búa lên đầu, tung lên và đá, và lặp lại những câu người lớn hét.'
  loai: phat-hien
  nguon:
  - bandura1961
  trich: all but two of the subjects in the aggressive condition performed the models' novel aggressive responses while subjects in the other conditions only rarely exhibited such reactions
  vi_tri: Method, Response Measures
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đa số trẻ bắt chước y hệt: đấm, đá, ngồi lên búp bê, đập bằng búa ... lặp lại đúng những câu la hét"; mới: nói rõ "hầu hết" (22/24, từ "all but two") và bỏ "y hệt". Lý do:
    nguồn nói "substantially identical" cho nhóm xem mẫu gây hấn, và nhóm kia hầu như không làm.'
- id: n4
  cau: Trẻ xem mẫu hiền lành và trẻ không xem gì hầu như không làm những hành vi bắt chước ấy.
  loai: phat-hien
  nguon:
  - bandura1961
  trich: subjects who were exposed to nonaggressive models and those who had no previous exposure to any models only rarely performed such responses
  vi_tri: Discussion
  ket_qua: dung
- id: n5
  cau: 'Trẻ học những hành vi ấy chỉ bằng cách nhìn: không ai thưởng hay phạt người mẫu hay trẻ.'
  loai: phat-hien
  nguon:
  - bandura1961
  trich: without any opportunity to perform the models' behavior in the exposure setting, and without any reinforcers delivered either to the models or to the observers
  vi_tri: Discussion
  ket_qua: dung
- id: n6
  cau: Đầu những năm 1960, nhiều nghiên cứu về học xã hội tập trung vào việc định hình hành vi bằng thưởng và phạt.
  loai: lich-su
  nguon:
  - bandura1961
  trich: Much current research on social learning is focused on the shaping of new behavior through rewarding and punishing consequences.
  vi_tri: Discussion
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "tâm lý học Mỹ vẫn do chủ nghĩa hành vi thống trị: muốn dạy một hành vi, phải thưởng ... phạt"; mới: nói điều chính bài báo nói. Lý do: "thống trị" là đánh giá lịch sử chung,
    không có trong nguồn đã mở.'
- id: n7
  cau: Albert Bandura là nhà nghiên cứu tại Đại học Stanford và cho rằng hành vi mới còn có thể được học bằng quan sát.
  loai: lich-su
  nguon:
  - bandura1961
  trich: social imitation may hasten or short-cut the acquisition of new behaviors without the necessity of reinforcing successive approximations as suggested by Skinner (1953)
  vi_tri: Discussion; ghi chú 1 và 2 (Stanford)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "giáo sư trẻ tại Stanford ... một con đường học khác nhanh và phổ biến hơn nhiều"; mới: bỏ "giáo sư trẻ" (nguồn không nói chức danh) và "nhanh, phổ biến hơn nhiều" (không có
    trong nguồn; nguồn chỉ nói có thể "đi tắt").'
- id: n8
  cau: 'Thí nghiệm Bobo là một trong những minh chứng nổi tiếng nhất cho học quan sát và gắn với câu hỏi còn tranh luận: trẻ bắt chước người lớn đánh búp bê thì có bắt chước bạo lực trên màn hình
    thành bạo lực thật không.'
  loai: lich-su
  nguon:
  - anderson2010
  - ferguson2010
  trich: The issue of violent video game influences on youth violence and aggression remains intensely debated in the scholarly literature and among the general public.
  vi_tri: Abstract Ferguson & Kilburn 2010
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "đòn chứng minh nổi tiếng nhất ... gây tranh cãi dai dẳng nhất ... chưa có đáp án cuối cùng"; mới: "một trong những minh chứng nổi tiếng nhất", "còn tranh luận". Chỗ khó: bài
    1961 không bàn truyền thông; tranh luận có nguồn ở đây là về trò chơi điện tử bạo lực. "Nổi tiếng" là đánh giá chung không kiểm bằng nguồn.'
- id: n9
  cau: 72 trẻ (36 trai, 36 gái) từ 37 đến 69 tháng tuổi, trung bình 52 tháng, ở trường mầm non của Đại học Stanford.
  loai: so-lieu
  nguon:
  - bandura1961
  trich: The subjects were 36 boys and 36 girls enrolled in the Stanford University Nursery School. They ranged in age from 37 to 69 months, with a mean age of 52 months.
  vi_tri: Method, Subjects
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "từ 3 đến 5 tuổi"; mới: 37–69 tháng (3 tuổi 1 tháng đến 5 tuổi 9 tháng). Lý do: số chính xác của bài.'
- id: n10
  cau: 'Có ba nhóm, mỗi nhóm 24 trẻ: xem người lớn gây hấn, xem người lớn chơi hiền lành, và không xem gì (đối chứng).'
  loai: so-lieu
  nguon:
  - bandura1961
  trich: Subjects were divided into eight experimental groups of six subjects each and a control group consisting of 24 subjects. Half the experimental subjects were exposed to aggressive models
    and half were exposed to models that were subdued and nonaggressive
  vi_tri: Method, Experimental Design
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: không nói cỡ nhóm; mới: thêm "mỗi nhóm 24 trẻ" (8 nhóm thí nghiệm × 6 = 48, chia đôi gây hấn/hiền lành, cộng 24 trẻ đối chứng).'
- id: n11
  cau: Người mẫu hiền lành lắp ráp đồ chơi, không động đến búp bê; người mẫu gây hấn lắp ráp khoảng một phút rồi dành thời gian còn lại gây hấn với búp bê, vừa làm vừa la những câu như "Sock him
    in the nose".
  loai: phat-hien
  nguon:
  - bandura1961
  trich: the model assembled the tinker toys in a quiet subdued manner totally ignoring the Bobo doll ... "Sock him in the nose," "Hit him down...," "Throw him in the air," "Kick him," "Pow,"
  vi_tri: Method, Experimental Conditions
  ket_qua: dung
  ghi_chu: Bản dịch "đấm vào mũi nó!" là dịch ý của "Sock him in the nose".
- id: n12
  cau: Trẻ được ghép theo mức gây hấn do giáo viên đánh giá từ trước rồi chia ngẫu nhiên vào các nhóm.
  loai: phat-hien
  nguon:
  - bandura1961
  trich: on the basis of these scores, subjects were arranged in triplets and assigned at random to one of two treatment conditions or to the control group
  vi_tri: Method, Experimental Design
  ket_qua: da-sua
  ghi_chu: Câu thêm mới, để mô tả thiết kế đúng nguồn (chữ cũ không nói).
- id: n13
  cau: Ở mỗi nhóm có mẫu, một nửa trẻ xem mẫu cùng giới, một nửa xem mẫu khác giới.
  loai: phat-hien
  nguon:
  - bandura1961
  trich: Half the subjects in the aggressive and nonaggressive conditions observed same-sex models, while the remaining subjects in each group viewed models of the opposite sex.
  vi_tri: Method, Experimental Design
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Trong nhóm gây hấn, một nửa trẻ xem mẫu là nam, một nửa xem mẫu là nữ"; mới như trên. Lý do: nguồn chia theo cùng giới/khác giới của trẻ, cả hai nhóm gây hấn và hiền lành.'
- id: n14
  cau: Lúc xem, trẻ làm tranh dán ở một góc phòng, người mẫu chơi ở góc đối diện trong 10 phút.
  loai: so-lieu
  nguon:
  - bandura1961
  trich: subjects were provided with a diverting task which occupied their attention ... At the end of 10 minutes, the experimenter entered the room
  vi_tri: Method, Experimental Conditions
  ket_qua: da-sua
  ghi_chu: Câu thêm mới theo nguồn (không có ở chữ cũ).
- id: n15
  cau: 'Sau lần xem (hay không xem), mọi trẻ đều bị "gây bực" nhẹ: được cho chơi đồ chơi hấp dẫn rồi bị bảo đó là đồ chơi tốt nhất, để dành cho trẻ khác.'
  loai: phat-hien
  nguon:
  - bandura1961
  trich: the experimenter remarked that these were her very best toys, that she did not let just anyone play with them, and that she had decided to reserve these toys for the other children
  vi_tri: Method, Aggression Arousal
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Trước khi quan sát, tất cả trẻ đều bị gây ức chế ..." Lỗi thứ tự: bước này sau lần xem mẫu và trước lần thử. Chữ cũ cũng gọi là "ức chế"; nguồn gọi là aggression arousal (kích
    động gây hấn nhẹ).'
- id: n16
  cau: Mục đích bước này là để mọi trẻ ở trong tình huống bị kích động gây hấn nhẹ.
  loai: phat-hien
  nguon:
  - bandura1961
  trich: all subjects, experimental and control, were subjected to mild aggression arousal to insure that they were under some degree of instigation to aggression
  vi_tri: Method, Aggression Arousal
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đảm bảo mọi trẻ bước vào phòng thí nghiệm với cùng một mức bực bội ban đầu"; mới: bỏ "cùng một mức" (nguồn nói "some degree of instigation", không nói bằng nhau).'
- id: n17
  cau: Mỗi trẻ ở 20 phút trong phòng có búp bê Bobo, búa gỗ, súng phóng phi tiêu và nhiều đồ chơi không gây hấn; một nữ nhà nghiên cứu ngồi làm giấy tờ ở góc phòng.
  loai: phat-hien
  nguon:
  - bandura1961
  trich: The subject spent 20 minutes in this experiments room ... the experimenter remained as inconspicuous as possible by busying herself with paper work at a desk in the far corner of the
    room
  vi_tri: Method, Test for Delayed Imitation
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "ở một mình 20 phút". Lý do: nhà nghiên cứu ở trong phòng suốt buổi (nếu không, nhiều trẻ không chịu ở lại).'
- id: n18
  cau: Quan sát viên ghi hành vi qua kính một chiều theo từng khoảng 5 giây; một người chấm cho cả 72 trẻ, người thứ hai chấm độc lập một nửa số trẻ; hệ số tương quan giữa hai người chấm nằm trong
    khoảng 0,90.
  loai: so-lieu
  nguon:
  - bandura1961
  trich: The 20 minute session was divided into 5-second intervals ... the performance of half the subjects were also scored independently by second observer ... the product-moment coefficients
    being in the .90s
  vi_tri: Method, Test for Delayed Imitation; Response Measures
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "hành vi được hai quan sát viên độc lập ghi lại". Lý do: người thứ nhất chấm cả 72 trẻ, người thứ hai chỉ một nửa.'
- id: n19
  cau: Vì trẻ xem mẫu gây hấn làm những hành vi đặc trưng, người chấm khó mà không đoán được nhóm của trẻ.
  loai: phat-hien
  nguon:
  - bandura1961
  trich: subjects who were exposed to the aggressive models could be readily identified through the distinctive behavior
  vi_tri: Method, Test for Delayed Imitation
  ket_qua: da-sua
  ghi_chu: 'Câu thêm mới: giới hạn do chính bài báo nêu về chấm mù.'
- id: n20
  cau: Trẻ xem mẫu gây hấn bắt chước hành vi và lời nói gây hấn nhiều hơn hẳn hai nhóm còn lại; khác biệt có ý nghĩa thống kê.
  loai: phat-hien
  nguon:
  - bandura1961
  trich: Their scores were significantly higher than those of either the nonaggressive or control groups, which did not differ from each other
  vi_tri: Results, Complete Imitation
  ket_qua: dung
- id: n21
  cau: Khoảng một phần ba trẻ xem mẫu gây hấn cũng nhắc lại các câu không gây hấn của mẫu, trong khi không trẻ nào ở hai nhóm kia làm vậy.
  loai: phat-hien
  nguon:
  - bandura1961
  trich: Approximately one-third of the subjects in the aggressive condition also repeated the model's nonaggressive verbal responses while none of the subjects in either the nonaggressive or
    control groups made such remarks.
  vi_tri: Results, Complete Imitation
  ket_qua: da-sua
  ghi_chu: Câu thêm mới theo nguồn.
- id: n22
  cau: Trong nhóm xem mẫu gây hấn, bé trai bắt chước gây hấn thể chất nhiều hơn bé gái (t = 2,50, p < 0,01), còn lời nói gây hấn thì hai giới không khác nhau.
  loai: so-lieu
  nguon:
  - bandura1961
  trich: boys reproduced more imitative physical aggression than girls (t = 2.50 p < .01). The groups do not differ, however, in their imitation of verbal aggression.
  vi_tri: Results, Influence of Sex
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: số trung bình 38,2 (bé trai) và 12,7 (bé gái) lần gây hấn thể chất. Bỏ: các số này nằm ở Bảng 1, bản psychclassics không có bảng, và chưa tìm được bản có bảng đọc được (các
    bản thứ cấp mâu thuẫn). Thay bằng kết quả kiểm định trong chữ bài.'
- id: n23
  cau: 'Giả thuyết "trẻ bắt chước mẫu cùng giới nhiều hơn" chỉ được ủng hộ một phần: ảnh hưởng của mẫu nam rõ hơn mẫu nữ.'
  loai: phat-hien
  nguon:
  - bandura1961
  trich: The hypothesis that boys are more prone than girls to imitate aggression exhibited by a model was only partially confirmed ... This interaction effect is much more consistent and pronounced
    for the male model than for the female model.
  vi_tri: Results, Influence of Sex
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Trẻ cũng bắt chước nhiều hơn khi mẫu cùng giới: bé trai xem mẫu nam 104 so với 48,4; bé gái xem mẫu nữ 57,7 so với 36,3" ... và nhận định bé gái; bỏ các số 104, 48,4, 57,7,
    36,3 (Bảng 1 không đọc được). Lý do: nguồn nói chỉ "partially confirmed", và "tương tác giới × mẫu" rõ ở mẫu nam hơn mẫu nữ.'
- id: n24
  cau: Bé trai xem mẫu nam gây hấn thể chất và lời nói nhiều hơn bé gái xem mẫu nam; ở nhóm xem mẫu nữ, các chênh lệch không đạt ý nghĩa thống kê (mỗi ô chỉ có 6 trẻ).
  loai: phat-hien
  nguon:
  - bandura1961
  trich: Male subjects, for example, exhibited more physical (t = 2.07, p < .05) and verbal imitative aggression (t = 2.51, p < .05) ... following exposure to the aggressive male model than the
    female subjects ... the mean differences did not reach statistical significance.
  vi_tri: Results, Influence of Sex
  ket_qua: dung
- id: n25
  cau: Nhóm xem mẫu hiền lành và nhóm đối chứng nhìn chung không khác nhau; riêng trẻ xem mẫu hiền lành là nam ít gây hấn hơn nhóm đối chứng trên vài thước đo, nhưng đó là so sánh nhóm con mà
    các tác giả lưu ý dễ do ngẫu nhiên.
  loai: phat-hien
  nguon:
  - bandura1961
  trich: in relation to the control group, subjects exposed to the nonaggressive male model performed significantly less imitative physical aggression (p = .06), less imitative verbal aggression
    (p = .002) ... comparison of subgroups ... is likely to capitalize on chance differences
  vi_tri: Results, Influence of Sex
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "trẻ xem mẫu hiền lành thậm chí còn ít gây hấn hơn cả nhóm đối chứng — như thể sự hiền lành cũng lây được". Lý do: tổng thể hai nhóm không khác; chỉ nhóm con mẫu nam; p = .06
