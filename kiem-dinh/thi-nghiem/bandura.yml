    ghi_chu: 'Chữ cũ: không nói cỡ nhóm; mới: thêm "mỗi nhóm 24 trẻ" (8 nhóm thí nghiệm × 6 = 48, chia đôi gây hấn/hiền lành, cộng 24 trẻ đối chứng). Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Bandura, Ross & Ross 1961 (psychclassics.yorku.ca/Bandura/bobo.htm) qua trích trong hồ sơ và kết quả lượt 2 (đọc độc lập toàn văn).'
