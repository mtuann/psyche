    trich: boys reproduced more imitative physical aggression than girls (t = 2.50 p < .01)
    vi_tri: Results, Influence of Sex
    nhan: kha-vung
    co_so:
      - bandura1961
    ly_do: Một thí nghiệm, kết quả giới tính có ý nghĩa thống kê ở thước đo thể chất (t = 2,50) nhưng giả thuyết mẫu cùng giới chỉ ủng hộ một phần; chưa có lần lặp lại đã mở, nên đây là mức thấp nhất của Khá vững.
    ket_qua: da-bo
    ghi_chu: 'chỗ khó (Opus): bỏ khung nhãn. Kết quả giới tính đến từ một thí nghiệm (t = 2,50; ô 6 trẻ; giả thuyết mẫu cùng giới chỉ được ủng hộ một phần), chưa mở được lần lặp lại nào: không đạt "nhiều nghiên cứu cùng chiều" của Khá vững, cũng không có bằng chứng mâu thuẫn cho Đang tranh cãi. Đây là kết quả phụ của một nghiên cứu, đã kể ở mục Kết quả (n22, đoạn "Giả thuyết trẻ bắt chước mẫu cùng giới…") và giả thuyết của tác giả ở mục Lý thuyết; không cần khung. Chữ khung cũ: ":::kha-vung[bé trai bắt chước gây hấn thể chất nhiều hơn bé gái, và mẫu nam có ảnh hưởng rõ hơn mẫu nữ] Trong thí nghiệm gốc, … đó là giả thuyết của họ, thí nghiệm không tách riêng được." Lượt 1 trước đó: chỗ khó: chữ cũ "Hiệu ứng mẫu cùng giới xuất hiện nhất quán ... chênh lệch ở bé gái nhỏ hơn". Nguồn nói "chỉ ủng hộ một phần", ô nhỏ (6 trẻ), kết quả nhóm con dễ do ngẫu nhiên. Mới là một thí nghiệm, chưa mở được lần lặp lại; thước đo Khá vững đòi nhiều nghiên cứu cùng chiều, nên lượt 2 cân nhắc bỏ khung hay hạ nhãn. Bỏ "bé trai đã được xã hội cho phép gây hấn nhiều hơn": thành giả thuyết của tác giả (xem n23). Review (Claude Opus 5.5, 30/10/2026): đã kiểm trang thật: không còn khung nhãn về giới tính (trang chỉ có khung Khá vững về học quan sát và khung Đang tranh cãi về bạo lực truyền thông). Bỏ khung là đúng với nhận xét của lượt 2 (Khá vững cao hơn thước đo: một thí nghiệm, ô 6 trẻ, so sánh nhóm con). Kết quả còn lại ở mục Kết quả, hộp hồ sơ và câu hỏi 3 được viết như kết quả của một nghiên cứu, không như nhãn: t = 2,50 có ý nghĩa; "ảnh hưởng của mẫu nam rõ hơn" theo chữ bài ("much more consistent and pronounced for the male model"), kèm "mỗi ô chỉ có 6 trẻ" và "chỉ được ủng hộ một phần".'
    luot_2: qua-manh
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Bandura/bobo.htm" ]
    luot_2_ghi_chu: "câu đúng: Đang tranh cãi hay chưa đủ bằng chứng: bé trai bắt chước gây hấn thể chất nhiều hơn bé gái (t = 2,50, p < 0,01 ở bài 1961) và xu hướng mẫu nam có ảnh hưởng rõ hơn, nhưng dựa trên mẫu nhỏ, so sánh nhóm con, chưa có tái lập hay tổng hợp.; Nhãn 'Khá vững' cao hơn thước đo: bằng chứng về giới tính của mẫu chủ yếu từ vài nghiên cứu Bandura, mỗi ô 6 trẻ, so sánh nhóm con 'dễ nhờ may rủi' (chính tác giả), và không có tổng hợp hay tái lập kiểm lại. 'Bé trai bắt chước gây hấn thể chất nhiều hơn' có ý nghĩa thống kê trong bài 1961; 'mẫu nam ảnh hưởng rõ hơn' chỉ là xu hướng."
    review: dung
