nhan_dinh:
  - id: n1
    cau: Bandura, Ross & Ross (1961) cho trẻ xem người lớn đánh búp bê Bobo; trẻ bắt chước gây hấn nhiều hơn hẳn nhóm xem người lớn chơi hiền lành và nhóm không xem gì.
    loai: phat-hien
    nguon:
      - bandura1961
    trich: Subjects given an opportunity to observe aggressive models later reproduced a good deal of physical and verbal aggression (as well as nonaggressive responses) substantially identical with that of the model.
    vi_tri: Discussion
    ket_qua: da-sua
    ghi_chu: 'Câu mô tả (description). Chữ cũ: "nhiều hơn hẳn nhóm đối chứng, đặt nền móng cho học quan sát, và mở ra tranh luận kéo dài về bạo lực truyền thông"; mới như trên, thêm "cho thấy trẻ có thể học hành vi mới chỉ bằng quan sát". Lý do: nhóm xem mẫu hiền lành là nhóm so sánh thứ hai; "đặt nền móng", "mở ra tranh luận" là đánh giá lịch sử không có trong nguồn đã mở (xem n8). Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Bandura, Ross & Ross 1961 (psychclassics.yorku.ca/Bandura/bobo.htm) qua trích trong hồ sơ và kết quả lượt 2 (đọc độc lập toàn văn).'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Bandura/bobo.htm" ]
    review: dung
  - id: n2
    cau: "Tình huống minh họa (gia-dinh): búp bê bơm hơi cao khoảng 1,5 mét, như búp bê 5 feet mà người mẫu đánh; trong thí nghiệm, phòng thử của trẻ có búp bê 3 feet (khoảng 0,9 m)."
    loai: so-lieu
    nguon:
      - bandura1961
    trich: a 5-foot inflated Bobo doll ... a 3-foot Bobo doll
    vi_tri: Method, Experimental Conditions
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "búp bê bơm hơi hình chú hề"; mới: "cao khoảng 1,5 mét". Lý do: bài không nói hình chú hề; búp bê của người mẫu cao 5 feet (phòng thử có búp bê 3 feet). gia-dinh: đoạn "Tự trải nghiệm" là tình huống minh họa. Review (Claude Opus 5.5, 30/10/2026): lượt 2 cho sai với câu cũ của hồ sơ ("Búp bê trong thí nghiệm là búp bê bơm hơi cao khoảng 1,5 mét"); trên trang, 1,5 mét chỉ có ở đoạn Tự trải nghiệm, là búp bê người bạn đánh, đúng cỡ búp bê của người mẫu (5 feet, OpenStax 6.4 cũng ghi "five-foot inflatable doll"). Trang không nói cỡ búp bê ở phòng thử. Không sửa trang; viết lại câu hồ sơ cho đúng điều trang nói.'
    luot_2: sai
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Bandura/bobo.htm" ]
    luot_2_ghi_chu: "câu đúng: Người mẫu đánh búp bê Bobo bơm hơi cao 5 feet (khoảng 1,5 m); búp bê ở phòng thử của trẻ cao 3 feet (khoảng 0,9 m).; Câu thiếu chính xác: búp bê 1,5 m (5 feet) là của người mẫu; búp bê trẻ thật sự chơi ở phòng thử cao 3 feet (khoảng 0,9 m)."
    review: dung
  - id: n3
    cau: 'Hầu hết trẻ xem mẫu gây hấn thực hiện các hành vi gây hấn lạ của người mẫu: ngồi lên búp bê rồi đấm vào mũi, đập búa lên đầu, tung lên và đá, và lặp lại những câu người lớn hét.'
    loai: phat-hien
    nguon:
      - bandura1961
    trich: all but two of the subjects in the aggressive condition performed the models' novel aggressive responses while subjects in the other conditions only rarely exhibited such reactions
    vi_tri: Method, Response Measures
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đa số trẻ bắt chước y hệt: đấm, đá, ngồi lên búp bê, đập bằng búa ... lặp lại đúng những câu la hét"; mới: nói rõ "hầu hết" (22/24, từ "all but two") và bỏ "y hệt". Lý do: nguồn nói "substantially identical" cho nhóm xem mẫu gây hấn, và nhóm kia hầu như không làm. Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Bandura, Ross & Ross 1961 (psychclassics.yorku.ca/Bandura/bobo.htm) qua trích trong hồ sơ và kết quả lượt 2 (đọc độc lập toàn văn); "all but two of the subjects in the aggressive condition" (22/24): "hầu hết" đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Bandura/bobo.htm" ]
    review: dung
  - id: n4
    cau: Trẻ xem mẫu hiền lành và trẻ không xem gì hầu như không làm những hành vi bắt chước ấy.
    loai: phat-hien
    nguon:
      - bandura1961
    trich: subjects who were exposed to nonaggressive models and those who had no previous exposure to any models only rarely performed such responses
    vi_tri: Discussion
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Bandura/bobo.htm" ]
  - id: n5
    cau: 'Trẻ học những hành vi ấy chỉ bằng cách nhìn: không ai thưởng hay phạt người mẫu hay trẻ.'
    loai: phat-hien
    nguon:
      - bandura1961
    trich: without any opportunity to perform the models' behavior in the exposure setting, and without any reinforcers delivered either to the models or to the observers
    vi_tri: Discussion
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Bandura/bobo.htm" ]
  - id: n6
    cau: Đầu những năm 1960, nhiều nghiên cứu về học xã hội tập trung vào việc định hình hành vi bằng thưởng và phạt.
    loai: lich-su
    nguon:
      - bandura1961
    trich: Much current research on social learning is focused on the shaping of new behavior through rewarding and punishing consequences.
    vi_tri: Discussion
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "tâm lý học Mỹ vẫn do chủ nghĩa hành vi thống trị: muốn dạy một hành vi, phải thưởng ... phạt"; mới: nói điều chính bài báo nói. Lý do: "thống trị" là đánh giá lịch sử chung, không có trong nguồn đã mở. Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Bandura, Ross & Ross 1961 (psychclassics.yorku.ca/Bandura/bobo.htm) qua trích trong hồ sơ và kết quả lượt 2 (đọc độc lập toàn văn).'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Bandura/bobo.htm" ]
    review: dung
  - id: n7
    cau: Albert Bandura là nhà nghiên cứu tại Đại học Stanford và cho rằng hành vi mới còn có thể được học bằng quan sát.
    loai: lich-su
    nguon:
      - bandura1961
    trich: social imitation may hasten or short-cut the acquisition of new behaviors without the necessity of reinforcing successive approximations as suggested by Skinner (1953)
    vi_tri: Discussion; ghi chú 1 và 2 (Stanford)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "giáo sư trẻ tại Stanford ... một con đường học khác nhanh và phổ biến hơn nhiều"; mới: bỏ "giáo sư trẻ" (nguồn không nói chức danh) và "nhanh, phổ biến hơn nhiều" (không có trong nguồn; nguồn chỉ nói có thể "đi tắt"). Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Bandura, Ross & Ross 1961 (psychclassics.yorku.ca/Bandura/bobo.htm) qua trích trong hồ sơ và kết quả lượt 2 (đọc độc lập toàn văn); Stanford suy từ ghi chú và "Stanford University Nursery School".'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Bandura/bobo.htm", "https://doi.org/10.1037/h0048687" ]
    luot_2_ghi_chu: Việc Bandura làm ở Stanford suy từ 'Stanford University Nursery School' trong bài; chức danh không ghi trong bài.
    review: dung
  - id: n8
    cau: "Thí nghiệm Bobo là một thí nghiệm nổi tiếng minh họa học quan sát, và gắn với câu hỏi còn tranh luận: trẻ bắt chước người lớn đánh búp bê thì có bắt chước bạo lực trên màn hình thành bạo lực thật không."
    loai: lich-su
    nguon:
      - openstax2e
      - anderson2010
      - ferguson2010
    trich: Watch this video clip about the famous Bobo doll experiment (OpenStax 6.4); The issue of violent video game influences on youth violence and aggression remains intensely debated (Ferguson & Kilburn 2010)
    vi_tri: OpenStax 6.4; tóm tắt Ferguson & Kilburn 2010
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đòn chứng minh nổi tiếng nhất ... gây tranh cãi dai dẳng nhất ... chưa có đáp án cuối cùng"; mới: "một trong những minh chứng nổi tiếng nhất", "còn tranh luận". Chỗ khó: bài 1961 không bàn truyền thông; tranh luận có nguồn ở đây là về trò chơi điện tử bạo lực. "Nổi tiếng" là đánh giá chung không kiểm bằng nguồn. Review (Claude Opus 5.5, 30/10/2026): sai một phần: "một trong những minh chứng nổi tiếng nhất" là so sánh bậc nhất không nguồn nào nói; OpenStax 6.4 (mở 30/10/2026) chỉ gọi là "the famous Bobo doll experiment". Chữ cũ "là một trong những minh chứng nổi tiếng nhất cho ý tưởng này" → "là một thí nghiệm nổi tiếng minh họa ý tưởng này". Thêm openstax2e vào nguon.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Bandura/bobo.htm", "https://doi.org/10.1037/a0018251", "https://doi.org/10.1037/a0018566" ]
    luot_2_ghi_chu: Câu nhận định lịch sử/ ngữ cảnh, hợp lý.
    review: sai
  - id: n9
    cau: 72 trẻ (36 trai, 36 gái) từ 37 đến 69 tháng tuổi, trung bình 52 tháng, ở trường mầm non của Đại học Stanford.
    loai: so-lieu
    nguon:
      - bandura1961
    trich: The subjects were 36 boys and 36 girls enrolled in the Stanford University Nursery School. They ranged in age from 37 to 69 months, with a mean age of 52 months.
    vi_tri: Method, Subjects
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "từ 3 đến 5 tuổi"; mới: 37–69 tháng (3 tuổi 1 tháng đến 5 tuổi 9 tháng). Lý do: số chính xác của bài. Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Bandura, Ross & Ross 1961 (psychclassics.yorku.ca/Bandura/bobo.htm) qua trích trong hồ sơ và kết quả lượt 2 (đọc độc lập toàn văn).'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Bandura/bobo.htm" ]
    review: dung
