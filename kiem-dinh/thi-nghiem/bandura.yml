  ghi_chu: 'Chữ cũ: "trẻ biết rõ trong phòng thí nghiệm không ai cấm ... hành vi của chúng có thể chỉ là diễn cho người lớn xem (demand characteristics)". Bỏ: không có trong nguồn đã mở; thay
