    cau: Năm 1963, nhóm Bandura so sánh trẻ mẫu giáo xem người lớn gây hấn ngoài đời thật, xem chính những người đó gây hấn trên phim, và xem một người hóa trang thành mèo hoạt hình làm cùng những hành vi ấy trên màn hình, với trẻ không xem mẫu nào.
    loai: so-lieu
    nguon:
      - bandura1963
      - bandura1973
    trich: 1 group of experimental Ss observed real-life aggressive models, a 2nd observed these same models potraying aggression on film (tóm tắt 1963); A third group observed the model costumed as a cartoon cat enacting the same aggressive responses on the screen of a television console. ... The behavior of one group of children was measured without any prior exposure to the models (Bandura 1973)
    vi_tri: Tóm tắt 1963 (OpenAlex); Bandura 1973, tr. 68–74
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cho trẻ xem người lớn gây hấn qua phim và qua phim hoạt hình" (không nói nhóm đối chứng, người thật, cỡ mẫu). chưa chắc về chi tiết: chỉ đọc tóm tắt và một bản quét tóm lược qua công cụ; số 96 và "24 mỗi nhóm" từ bản quét, chưa đối chiếu với bản APA. Review (Claude Opus 5.5, 30/10/2026): lượt 2 không chắc; review quyết sai một phần: cỡ mẫu "96 trẻ (48 trai, 48 gái), mỗi nhóm 24 trẻ" chỉ có từ bản quét SlideShare đọc qua công cụ tóm lược (bậc 3, chưa đối chiếu), không xác nhận được ở nguồn nào review mở được (tóm tắt 1963 bị cắt; toàn văn APA đóng). Mở được lời kể của chính Bandura (1973, Bandura (1973), Aggression: A social learning analysis, tr. 68–74 (đoạn "Origins of aggression", bản in lại trong tài liệu khóa học ở alison.com, đọc 30/10/2026)): ba nhóm xem mẫu (người thật, phim, người hóa trang mèo hoạt hình) và nhóm đo không xem mẫu. Bỏ cỡ mẫu và số trẻ mỗi nhóm; giữ thiết kế theo tóm tắt 1963 và Bandura 1973. Lưu ý: Bandura 1973 gộp với một nhóm đối chứng thứ hai (mẫu trên phim hiền lành) từ nghiên cứu khác (Bandura 1962), nên trang chỉ nhắc nhóm không xem mẫu.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.1037/h0048687" ]
    luot_2_ghi_chu: "Chỉ đọc được tóm tắt bị cắt trên PubMed/OpenAlex: một nhóm xem mẫu thật, một nhóm xem chính mẫu đó trên phim, nhóm thứ ba xem nhân vật hoạt hình. Cỡ mẫu (96, 48 trai và 48 gái, 24 mỗi nhóm) và có nhóm đối chứng riêng chưa xác nhận được; Wikipedia ghi 3 nhóm với đối chứng lấy từ 1961 (mâu thuẫn, nguồn bậc thấp). Toàn văn không mở được."
    review: sai
  - id: n27
    cau: Theo Bandura (1973) kể lại, người gây hấn trên phim dạy trẻ những kiểu gây hấn đặc trưng hiệu quả ngang người thật; trẻ ít bắt chước nhân vật hoạt hình hơn người thật; và trẻ xem các mẫu gây hấn về sau gây hấn nhiều hơn hẳn trẻ không xem mẫu.
    loai: phat-hien
    nguon:
      - bandura1973
      - bandura1963
    trich: a person displaying aggression on film was as influential in teaching distinctive forms of aggression as one exhibiting it in real life. The children were less inclined, however, to imitate the cartoon character than the real-life model. ... children who were exposed to the aggressive models subsequently exhibited substantially more total aggression than children in the nonaggressive model condition or the control group.
    vi_tri: Bandura 1973, tr. 68–74
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "phim người thật hiệu quả gần bằng người thật, phim hoạt hình kém hơn một chút nhưng vẫn rõ rệt". Lý do: theo bản quét, về bắt chước thì người thật hơn nhóm hoạt hình có ý nghĩa, còn người thật với phim, phim với hoạt hình không khác có ý nghĩa; "kém hơn một chút" không kiểm được. chưa chắc: chỉ đọc qua bản quét tóm lược; Bảng 1 không đọc được. Review (Claude Opus 5.5, 30/10/2026): lượt 2 không chắc; review quyết sai một phần: "nhóm xem phim và phim hoạt hình gần gấp đôi" không có ở nguồn nào mở được (chỉ từ bản quét SlideShare đọc qua công cụ tóm lược). Bandura (1973), Aggression: A social learning analysis, tr. 68–74 (đoạn "Origins of aggression", bản in lại trong tài liệu khóa học ở alison.com, đọc 30/10/2026) xác nhận phần còn lại và thêm điều trang cũ không nói (trẻ ít bắt chước nhân vật hoạt hình hơn người thật). Chữ cũ "Cả ba nhóm xem mẫu gây hấn nhiều hơn nhóm đối chứng (nhóm xem phim và phim hoạt hình gần gấp đôi); mức bắt chước không khác đáng kể giữa người thật và phim người thật." → câu trên, ghi rõ "Theo Bandura (1973) kể lại" (chuẩn mục 2: không mở được bài gốc thì ghi nguồn kể lại). Bandura 1973 là sách của chính tác giả, nhà xuất bản Prentice-Hall; thêm vào mục Nguồn của trang.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Không mở được toàn văn 1963 để xác nhận 'gần gấp đôi' và 'không khác đáng kể giữa người thật và phim'; tóm tắt bị cắt. Nguồn thứ cấp (Wikipedia: ba nhóm tăng gây hấn tương tự) chỉ gợi ý."
    review: sai
