- id: n51
  cau: Bài báo cho biết trẻ có thể đấm búp bê Bobo dù không xem mẫu nào, nên các tác giả chỉ tính là bắt chước những hành vi lạ; việc đấm búp bê nói chung không khác nhau giữa các nhóm.
