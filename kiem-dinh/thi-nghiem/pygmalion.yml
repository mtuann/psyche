  - id: d1
    cau: Rosenthal và Jacobson (1968) báo với giáo viên tiểu học rằng khoảng 20% học sinh, thực ra được chọn ngẫu nhiên, là "kẻ nở muộn", rồi đo lại điểm IQ của các em sau 8 tháng.
    loai: phat-hien
    nguon:
      - rosenthal1966b
      - raudenbush1984
    trich: Within each of 18 classrooms, an average of 20% of the children were reported to classroom teachers as showing unusual potential for intellectual gains. Eight months later ...
    vi_tri: R&J 1966 abstract
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (mô tả): "nói dối giáo viên tiểu học rằng vài học sinh được chọn ngẫu nhiên là kẻ nở muộn ..., rồi theo dõi điểm số của các em suốt một năm học". Chữ mới: "báo với giáo viên ... khoảng 20% học sinh ... rồi đo lại điểm IQ của các em sau 8 tháng". Lý do: "vài học sinh" mâu thuẫn con số 20%; "suốt một năm học" không khớp: tóm tắt 1966 và Raudenbush nói 8 tháng (Thorndike nêu thêm lần đo khác sau 1 năm, nhưng trọng tâm là 8 tháng); "nói dối" là cách nói; nguồn chỉ nói giáo viên được báo danh sách. Review (Claude Sonnet 5.5, 30/10/2026): dung. Mô tả khớp tóm tắt R&J 1966 ("an average of 20% ... 18 classrooms ... Eight months later") và Raudenbush; mốc 8 tháng là lần đo tháng 5/1965 (lượt 2, Thorndike). Chữ cuối trên trang (description, hộp hồ sơ, đáp án) khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0022-0663.76.1.85", "https://gwern.net/doc/statistics/bias/1984-raudenbush.pdf", "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
    luot_2_ghi_chu: "Thorndike 1968: danh sách phát cho giáo viên tháng 9/1964, chọn bằng bảng số ngẫu nhiên; đo lại tháng 1/1965, 5/1965, 5/1966. Mốc 8 tháng là lần đo 5/1965."
    review: dung
  - id: n1
    cau: 'Theo báo cáo gốc, sau 8 tháng nhóm "nở muộn" tăng điểm IQ nhiều hơn nhóm đối chứng: gần 4 điểm IQ tổng và khoảng 7 điểm IQ lập luận.'
    loai: so-lieu
    nguon:
      - raudenbush1984
      - rosenthal1966b
    trich: those predicted to bloom had in fact gained significantly more in total IQ (nearly 4 points) and reasoning IQ (7 points) than the control group children.
    vi_tri: Raudenbush tr. 85–86 (tóm lại báo cáo gốc)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nhóm được chọn ngẫu nhiên vượt lên thật... nhiều hơn hẳn các bạn cùng lớp ... Không phải vì các em thông minh hơn từ đầu, mà vì thầy cô tin rằng các em sẽ tiến bộ." Chữ mới: "Theo báo cáo gốc, ... nhiều hơn ... " Lý do: "vượt lên thật" và "hẳn" mạnh hơn nguồn; dữ liệu gốc bị phê bình nặng (Thorndike, Snow). Chưa mở được sách gốc 1968: con số "gần 4" và "7" lấy từ cách Raudenbush tóm lại; trang đã đưa vào hộp hồ sơ. chưa chắc: nên có sách gốc (Rosenthal & Jacobson 1968) để lượt 2 xác nhận con số. Review (Claude Sonnet 5.5, 30/10/2026): dung. Trang ghi "theo báo cáo gốc" và số 4/7 điểm lấy từ Raudenbush tr. 85–86 ("nearly 4 points ... 7 points"); đúng nguồn, đã bỏ "vượt lên thật".'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0022-0663.76.1.85", "https://gwern.net/doc/statistics/bias/1984-raudenbush.pdf", "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
    luot_2_ghi_chu: Số 4 và 7 điểm là điểm tăng chênh lệch giữa hai nhóm (gain), nghiên cứu gốc báo; bản thân Rosenthal & Jacobson không đọc trực tiếp, qua Raudenbush và Jussim & Harber.
    review: dung
  - id: n2
    cau: Các em được chọn ngẫu nhiên, nên khác biệt không do các em thông minh hơn từ đầu.
    loai: phat-hien
    nguon:
      - raudenbush1984
      - rosenthal1966b
    trich: the "bloomers" were a randomly selected 20% of the student population
    vi_tri: Raudenbush tr. 85
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
    luot_2_ghi_chu: Ngẫu nhiên nên không có khác biệt năng lực hệ thống ban đầu; Snow (1995) lưu ý số đo có lỗi, nhưng không phủ nhận việc chọn ngẫu nhiên.
  - id: n3
    cau: Các tác giả giải thích rằng khác biệt là do kỳ vọng của giáo viên.
    loai: lich-su
    nguon:
      - jussim2005
    trich: The difference between the children earmarked for intellectual growth and the undesignated control children was in the mind of the teacher.
    vi_tri: Jussim & Harber, mục The original Pygmalion study (trích Rosenthal & Jacobson 1968, tr. 70)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
  - id: n4
    cau: Nghiên cứu gốc bị phê bình nặng về dữ liệu.
    loai: lich-su
    nguon:
      - thorndike1968
      - snow1995
    trich: the basic data upon which this structure has been raised are so untrustworthy that any conclusions based upon them must be suspect
    vi_tri: Thorndike, đoạn cuối; Snow 1995
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf", "https://www.gwern.net/doc/iq/1968-thorndike.pdf", "https://www.gwern.net/doc/iq/1995-snow.pdf" ]
  - id: e1
    cau: Pygmalion là nhà điêu khắc trong truyện thần thoại do Ovid kể (Metamorphoses, quyển 10), đem lòng yêu bức tượng do chính mình tạc nên, và tượng hóa thành người thật.
    loai: lich-su
    nguon:
      - ovid
    trich: niveum mira feliciter arte sculpsit ebur ... operisque sui concepit amorem
    vi_tri: Ov. Met. 10.243–297
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhà điêu khắc trong thần thoại Hy Lạp". Chữ mới: "trong truyện thần thoại do Ovid kể (Metamorphoses, quyển 10)". Lý do: nguồn bậc 1 là thơ Latin của Ovid (La Mã). Chưa đọc hết đoạn tượng hóa người: câu trích về điêu khắc và tình yêu đã mở; đoạn sau (Venus ban sự sống) nằm cùng trang, chưa chắc: người giao có thể kiểm thêm bản dịch. Review (Claude Sonnet 5.5, 30/10/2026): dung. Ov. Met. 10.243–297: tượng ngà, Pygmalion yêu tác phẩm của mình; chi tiết tượng thành người là nội dung quen thuộc của cùng đoạn (lượt 2 cũng chưa đọc từng dòng). Chấp nhận như lịch sử thần thoại bậc 1; chưa chắc nhỏ ở dòng cuối.'
    luot_2: dung
    luot_2_nguon: [ "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.02.0028:book=10:card=243" ]
    luot_2_ghi_chu: Đọc đoạn đầu của Perseus Metamorphoses 10 (tượng ngà, Pygmalion yêu); chi tiết 'tượng hóa thành người' là nội dung quen thuộc của đoạn sau cùng quyển, chưa đọc lại từng dòng.
    review: dung
  - id: e2
    cau: Thầy cô trong nghiên cứu không biết danh sách là ngẫu nhiên, và không ai bảo họ phải ưu ái nhóm "nở muộn".
    loai: phat-hien
    nguon:
      - raudenbush1984
      - jussim2005
    trich: the experimenters gave the names of these "bloomers" to the teachers. In truth, the test was a traditional IQ test and the "bloomers" were a randomly selected 20% of the student population.
    vi_tri: Raudenbush tr. 85
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thầy cô trong nghiên cứu không hề cố ý thiên vị". Chữ mới: "không biết danh sách là ngẫu nhiên, và không ai bảo họ phải ưu ái". Lý do: "không hề cố ý thiên vị" là kết luận về động cơ; nguồn chỉ nói giáo viên bị cho biết danh sách giả. Review (Claude Sonnet 5.5, 30/10/2026): dung. Raudenbush tr. 85: giáo viên được báo tên "bloomers", thực tế là 20% chọn ngẫu nhiên; không có chỉ dẫn ưu ái. Trang chỉ nói điều nguồn nói.'
    luot_2: dung
    luot_2_nguon: [ "https://www.gwern.net/doc/iq/1968-thorndike.pdf", "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
    luot_2_ghi_chu: "Thiết kế: giáo viên được báo bài kiểm tra dự đoán 'bứt phá', không được bảo thiên vị. Nguồn: Thorndike 1968 và Jussim & Harber."
    review: dung
  - id: e3
    cau: 'Theo cách giải thích của Rosenthal, kỳ vọng có thể len lỏi qua những hành vi nhỏ: ấm áp hơn, phản hồi rõ hơn, giao bài nhiều và khó hơn, cho nhiều cơ hội hơn; đây là cơ chế được đề xuất, mức tác động thực tế còn tranh cãi.'
    loai: dinh-nghia
    nguon:
      - jussim2005
    trich: Teachers are typically emotionally warmer and more supportive to their high expectancy students, provide them clearer and more positive feedback, teach them more and more difficult material, and give them more opportunities to demonstrate mastery
    vi_tri: Jussim & Harber, mục Mediation (Students' perceptions of differential teacher treatment)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Kỳ vọng len lỏi qua những hành vi rất nhỏ — giọng nói ấm hơn, kiên nhẫn chờ câu trả lời lâu hơn vài giây, giao bài khó hơn một chút, khen nhiều hơn một chút. Học sinh cảm nhận được tất cả những điều đó, và dần trở thành đúng như những gì thầy cô tin." Chữ mới: như câu trên. Lý do: "chờ lâu hơn vài giây", "học sinh cảm nhận được... dần trở thành" không có trong nguồn đã mở; Jussim & Harber chỉ mô tả giáo viên đối xử khác nhau với học sinh được kỳ vọng cao (dẫn Rosenthal 1974; Harris & Rosenthal 1985, chưa mở được). Review (Claude Sonnet 5.5, 30/10/2026): dung. Jussim & Harber (mục Mediation): giáo viên "emotionally warmer ... clearer and more positive feedback, teach them more and more difficult material, more opportunities". Trang gắn rõ là "cơ chế được đề xuất". Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
    luot_2_ghi_chu: Câu đã nêu đúng đây là cơ chế đề xuất.
    review: dung
  - id: r1
    cau: 'Rosenthal và Fode (1963): sinh viên trong một lớp tâm lý học được giao mỗi người năm con chuột huấn luyện chạy mê cung chữ T; một nửa được bảo chuột thuộc dòng "thông minh mê cung", nửa còn lại dòng "đần mê cung".'
    loai: phat-hien
    nguon:
      - rosenthal1963
    trich: Each of you will be assigned a group of five rats to work with. Some of you will be working with maze-bright rats, others will be working with maze-dull rats.
    vi_tri: Mục Method, Instructions to Es
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "được giao mỗi người vài con chuột để huấn luyện chạy mê cung". Chữ mới: "mỗi người năm con chuột ... mê cung chữ T". Lý do: bài ghi 5 chuột mỗi người và mê cung T cao. Review (Claude Sonnet 5.5, 30/10/2026): dung. Rosenthal & Fode 1963 (trích: "Each of you will be assigned a group of five rats ... maze-bright ... maze-dull"); trang khớp 5 chuột và mê cung chữ T. Dựa vào trích lượt 1 và lượt 2, review không tải lại bài gốc.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1002/bs.3830080302", "https://www.gwern.net/doc/iq/animal/1963-rosenthal.pdf" ]
    luot_2_ghi_chu: "Chi tiết: nhiệm vụ là học phân biệt sáng-tối trong mê cung chữ T (65 chuột chia 13 nhóm, 12 sinh viên dùng 60 chuột). Sinh viên được báo ngay là có chuột 'thông minh' hay 'đần'."
    review: dung
  - id: r2
    cau: 'Thực ra không có dòng "thông minh" hay "đần": các nhóm chuột bạch được gắn nhãn ngẫu nhiên (chỉ giới hạn để tuổi trung bình các nhóm gần nhau).'
    loai: phat-hien
    nguon:
      - rosenthal1963
    trich: Actually, the groups had been labeled bright or dull randomly, with the restriction that differences in mean age per group per matched pair be at a minimum.
    vi_tri: Mục Method, Experimenters
    ket_qua: da-sua
