    ghi_chu: 'Chữ cũ: "hàng chục thí nghiệm độc lập — từ chuột bạch, học sinh, đến nhân viên — đều cho thấy kỳ vọng ... có thể thay đổi hành vi của họ theo hướng làm cho kỳ vọng thành sự thật. Đây là một hiệu ứng có thật, được lặp lại." Chữ mới: như câu trên (kèm Jussim & Harber). Lý do: "nhân viên" và "hàng chục" không có nguồn đã mở; số 345 lấy từ Raudenbush (chưa mở Rosenthal & Rubin 1978); Snow (1995) phê bình cách gộp. Review (Claude Sonnet 5.5, 30/10/2026): dung. Raudenbush tr. 86: "Rosenthal and Rubin''s (1978) review of 345 studies further substantiates the expectancy effect in a wide variety of settings including classrooms but leaves clouded the specific question of expectancy''s IQ effects". Trang khớp và nói "được Raudenbush dẫn lại".'
