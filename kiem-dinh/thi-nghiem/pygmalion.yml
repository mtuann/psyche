    trich: Many of the complaints leveled against the original Rosenthal and Jacobson (1968) study, however, were more flawed than the study itself. One such charge was that the measure of IQ was unreliable
    vi_tri: Jussim & Harber, mục The storm of criticism
    ket_qua: dung
    ghi_chu: 'Thêm mới vào khung tranh-cai: nêu quan điểm phản biện.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
  - id: nt5
    cau: Jussim và Harber (2005) cho rằng kỳ vọng của giáo viên thường dự đoán đúng kết quả học sinh, nhưng có thể nhiều hơn là vì chúng chính xác chứ không phải vì tự ứng nghiệm.
    loai: lich-su
    nguon:
      - jussim2005
    trich: teacher expectations may predict student outcomes more because these expectations are accurate than because they are self-fulfilling
    vi_tri: Abstract
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "phần lớn là vì chúng chính xác". Chữ mới: "có thể nhiều hơn là vì chúng chính xác". Lý do: tóm tắt dùng "may predict ... more". Cũng sửa ở đáp án quiz số 5 và ở câu cuối khung ("Hiệu ứng tự ứng nghiệm trong lớp học có xảy ra, nhưng nhỏ hơn..."). Review (Claude Sonnet 5.5, 30/10/2026): dung. Jussim & Harber, tóm tắt: "teacher expectations may predict student outcomes more because these expectations are accurate than because they are self-fulfilling". Trang dùng "có thể nhiều hơn". Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
    review: dung
  - id: l1
    cau: 'Lời tiên tri tự ứng nghiệm: kỳ vọng ban đầu (dù sai) khiến người ta hành xử theo cách làm cho nó thành đúng.'
    loai: dinh-nghia
    nguon:
      - jussim2005
    trich: Self-fulfilling prophecies in the classroom do occur
    vi_tri: Abstract; Introduction
    ket_qua: dung
    ghi_chu: 'Định nghĩa chung; Jussim & Harber dùng khái niệm này trong toàn bài. Chưa kiểm APA Dictionary (ứng dụng một trang); chưa chắc: người giao có thể muốn thêm mục từ APA.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
  - id: l2
    cau: 'Bốn kênh của Rosenthal: (1) sự ấm áp, (2) đầu vào (dạy nhiều hơn, giao bài khó hơn), (3) cơ hội thể hiện, (4) phản hồi rõ ràng, tích cực hơn; theo Jussim và Harber, giáo viên thường đối xử với học sinh được kỳ vọng cao theo những cách này, nhưng việc các hành vi ấy làm thay đổi thành tích là cơ chế được giả định.'
    loai: dinh-nghia
    nguon:
      - jussim2005
    trich: Teachers are typically emotionally warmer and more supportive to their high expectancy students, provide them clearer and more positive feedback, teach them more and more difficult material, and give them more opportunities to demonstrate mastery
    vi_tri: Jussim & Harber, mục Mediation
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(1) sự ấm áp — giọng điệu, ánh mắt thân thiện hơn; ... (3) cơ hội thể hiện — gọi trả lời nhiều hơn, chờ đợi lâu hơn; (4) phản hồi — khen ngợi, khích lệ nhiều hơn. Không kênh nào cần đến ý thức." Chữ mới: như câu trên. Lý do: "giọng điệu, ánh mắt", "chờ đợi lâu hơn", "không kênh nào cần ý thức" không có trong nguồn mở được; tên "bốn kênh" lấy từ trang gốc, Jussim & Harber không dùng tên này (chưa mở Rosenthal 1974): chưa chắc về tên gọi. Review (Claude Sonnet 5.5, 30/10/2026): dung. Jussim & Harber (Mediation): bốn kiểu đối xử có trong nguồn; tên "bốn kênh của Rosenthal" lượt 2 xác nhận (climate, feedback, input, output). Trang ghi rõ là mô tả, còn việc chúng đổi thành tích là cơ chế giả định.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
    luot_2_ghi_chu: Bốn kênh khớp (climate, feedback, input, output). Bài nêu đây là mô tả hành vi giáo viên, còn việc chúng làm đổi thành tích là giả định.
    review: dung
  - id: l3
    cau: 'Kỳ vọng chính xác (Jussim): giáo viên giỏi đọc đúng học sinh nên "tiên đoán" đúng mà không cần tác động; thực tế cả hai cơ chế cùng tồn tại, một phần chính xác, một phần tự ứng nghiệm.'
    loai: lich-su
    nguon:
      - jussim2005
    trich: Self-fulfilling prophecies in the classroom do occur ... and (d) teacher expectations may predict student outcomes more because these expectations are accurate than because they are self-fulfilling.
    vi_tri: Abstract
    ket_qua: dung
    ghi_chu: Câu "cả hai cùng tồn tại" khớp (a) và (d) của tóm tắt.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
  - id: l4
    cau: 'Hiệu ứng ngược: kỳ vọng thấp cũng có thể tự ứng nghiệm theo hướng xấu; hiệu ứng mạnh có thể xảy ra có chọn lọc ở học sinh thuộc nhóm bị kỳ thị, còn việc nó gây hại nhiều hơn lợi hay không thì chưa rõ.'
    loai: lich-su
    nguon:
      - jussim2005
    trich: powerful self-fulfilling prophecies may selectively occur among students from stigmatized social groups; (c) whether self-fulfilling prophecies affect intelligence, and whether they in general do more harm than good, remains unclear
    vi_tri: Abstract
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "kỳ vọng thấp cũng tự ứng nghiệm theo hướng xấu (học sinh bị dán nhãn \"kém\" nhận được ít cơ hội hơn và ngày càng kém thật). Vì vậy dán nhãn trong giáo dục là con dao hai lưỡi." Chữ mới: như câu trên. Lý do: khẳng định chắc quá; nguồn nói chưa rõ hại nhiều hơn lợi và chỉ mạnh có chọn lọc. Review (Claude Sonnet 5.5, 30/10/2026): dung. Jussim & Harber, tóm tắt: hiệu ứng mạnh có thể xảy ra có chọn lọc ở nhóm bị kỳ thị; hại nhiều hơn lợi hay không "remains unclear". Trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
    review: dung
  - id: a1
    cau: Các tổng quan mô tả giáo viên thường ấm áp hơn, phản hồi rõ hơn, giao bài nhiều và khó hơn, cho nhiều cơ hội hơn với học sinh mình kỳ vọng cao; vì tác động của kỳ vọng nhỏ nhưng có thể có thật, nên tránh dán nhãn cố định cho một đứa trẻ.
    loai: loi-khuyen
    nguon:
      - jussim2005
    trich: Self-fulfilling prophecies in the classroom do occur, but these effects are typically small, they do not accumulate greatly across perceivers or over time, and they may be more likely to dissipate than accumulate
    vi_tri: Jussim & Harber, Abstract; mục Mediation
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "giữ kỳ vọng cao cho mọi đứa trẻ, nhưng thể hiện bằng hành vi cụ thể — kiên nhẫn chờ câu trả lời, giao việc vừa sức nhưng hơi thử thách, khen nỗ lực thay vì khen \"thông minh\". Và đừng bao giờ dán nhãn cố định kiểu...". Chữ mới: như câu trên. Lý do: "khen nỗ lực thay vì khen thông minh" thuộc một lĩnh vực khác (cần nguồn riêng) và "kiên nhẫn chờ" không có nguồn; lời khuyên "tránh dán nhãn cố định" suy ra từ hiệu ứng nhỏ nhưng có thật và rủi ro với nhóm bị kỳ thị (Jussim & Harber). chỗ khó: đây là lời khuyên suy luận, không có thử nghiệm can thiệp; nên cho lượt 2 xét. Review (Claude Sonnet 5.5, 30/10/2026): dung. Lời khuyên "tránh dán nhãn cố định" là suy luận ghi rõ từ "tác động nhỏ nhưng có thể có thật" (Jussim & Harber); không có thử nghiệm can thiệp, chấp nhận như lời khuyên thận trọng.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
    luot_2_ghi_chu: Lời khuyên (tránh dán nhãn) là suy luận hợp lý, không phải kết quả nghiên cứu; câu đã nói rõ 'nhỏ nhưng có thể có thật'.
    review: dung
  - id: a2
    cau: Quy luật "gieo kỳ vọng lúc mới quen" của Raudenbush được kiểm trên học sinh, không phải nhân viên; áp vào chỗ làm với người mới mới chỉ là suy luận hợp lý, chưa phải bằng chứng.
    loai: lich-su
    nguon:
      - raudenbush1984
    trich: all studies employing IQ as an outcome and normal children in Grades 1-7 as subjects were included in the sample for the synthesis (n = 18)
    vi_tri: Raudenbush, mục Method
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhân viên mới thường nhạy với kỳ vọng của sếp nhất — đúng như quy luật \"đầu năm học\" của Raudenbush. Giao việc thử thách kèm sự tin tưởng cho người mới có tác dụng lớn hơn ta tưởng." Chữ mới: như câu trên. Lý do: không có nguồn về nhân viên mới; phân tích tổng hợp chỉ gồm học sinh lớp 1–7. Review (Claude Sonnet 5.5, 30/10/2026): dung. Raudenbush chỉ gồm học sinh lớp 1–7 (Method); trang nói rõ áp vào nhân viên mới chỉ là suy luận. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0022-0663.76.1.85", "https://gwern.net/doc/statistics/bias/1984-raudenbush.pdf", "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
    luot_2_ghi_chu: "Đúng: thang tuần tiếp xúc chỉ kiểm trên học sinh trong các thí nghiệm Pygmalion. Jussim & Harber còn nêu nghiên cứu McNatt (2000) trên tân binh, tức có bằng chứng khác ngoài lớp học, nhưng không phải quy luật 'gieo lúc mới quen' của Raudenbush."
    review: dung
  - id: a3
    cau: Kỳ vọng của người khác có thể đóng một phần vào kết quả của bạn, thường là phần nhỏ, chứ không quyết định năng lực của bạn.
    loai: loi-khuyen
    nguon:
      - jussim2005
    trich: Self-fulfilling prophecies in the classroom do occur, but these effects are typically small, they do not accumulate greatly across perceivers or over time, and they may be more likely to dissipate than accumulate
    vi_tri: Abstract
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "một phần kết quả của bạn có thể đến từ kỳ vọng của người khác, không phải năng lực của bạn. Nhận ra điều đó là bước đầu để viết lại câu chuyện." Chữ mới: như câu trên. Lý do: bỏ khẳng định "nhận ra ... là bước đầu" (không nguồn) và thêm "thường là phần nhỏ". Review (Claude Sonnet 5.5, 30/10/2026): dung. Cùng nguồn Jussim & Harber ("typically small"); trang dùng "có thể", "thường là phần nhỏ". Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
    luot_2_ghi_chu: Lời khuyên cho người đọc; số liệu nền (r khoảng 0,1-0,2) đỡ cho 'thường là phần nhỏ'.
    review: dung
  - id: v1
    cau: Tính đến 10/2026, chưa tìm thấy thí nghiệm nào về kỳ vọng giáo viên trên học sinh Việt Nam.
    loai: thoi-su
    nguon:
      - crawfurd2020
    het_han: 2028-10-30
    trich: Teacher's expectations of students also vary systematically, with, for example, non-black teachers having lower expectations of black students in the USA
    vi_tri: Crawfurd & Rolleston, mục Introduction (nguồn gần nhất tìm thấy, nói về hiệu ứng giáo viên ở Việt Nam, không về kỳ vọng)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hầu hết nghiên cứu về hiệu ứng Pygmalion được làm ở phương Tây, trên học sinh Mỹ và châu Âu. Chúng tôi chưa tìm thấy thí nghiệm nào ...". Chữ mới: bỏ câu đầu (không nguồn bậc 1–2 nói trường ở Mỹ), thêm mốc "Tính đến 10/2026". Tìm ngày 30/10/2026: WebSearch "teacher expectations student achievement Vietnam study Young Lives Pygmalion effect": chỉ thấy nghiên cứu hiệu ứng giáo viên (Young Lives, Crawfurd & Rolleston 2020; Huynh 2024 về điểm số và học thêm), không có thí nghiệm kỳ vọng. Chưa tìm trong cơ sở dữ liệu tiếng Việt: chưa chắc. Review (Claude Sonnet 5.5, 30/10/2026): dung. Khẳng định thời sự có loai thoi-su, mốc "Tính đến 10/2026", het_han 2028-10-30. Review tìm thêm 30/10/2026 (tiếng Việt: hiệu ứng Pygmalion, kỳ vọng giáo viên, thực nghiệm, học sinh Việt Nam): không thấy thí nghiệm nào trên học sinh Việt Nam (chỉ nghiên cứu ở New Zealand, Iran, Pakistan). Tìm kiếm hạn chế (chưa vào cơ sở dữ liệu tạp chí trong nước); câu đã viết "chúng tôi chưa tìm thấy". Chấp nhận.'
    luot_2: khong-chac
    luot_2_ghi_chu: Khẳng định 'chưa tìm thấy' là kết quả tìm kiếm hạn chế của lượt này (không vào được cơ sở dữ liệu tạp chí Việt Nam); đúng theo nghĩa 'chưa tìm thấy', nhưng nguồn bậc 1-2 không có để xác nhận được, nên chấp nhận ở mức hạn chế.
    review: dung
  - id: v2
    cau: Jussim và Harber (2005) nêu một nghiên cứu (Smith và cộng sự, 1998) thấy hiệu ứng tự ứng nghiệm ở các lớp xếp theo năng lực không mạnh hơn ở lớp hỗn hợp.
    loai: phat-hien
    nguon:
      - jussim2005
    trich: Self-fulfilling prophecies among students grouped by ability between classes were no more powerful than those among students in heterogeneous classes—and both fell within the typically small range of 0–.2
    vi_tri: Jussim & Harber, mục Tracking
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ở Việt Nam, việc phân loại học sinh (lớp chọn, lớp thường, trường chuyên) diễn ra công khai và từ sớm — đó chính là một \"máy gieo kỳ vọng\" khổng lồ chạy suốt nhiều năm." Chữ mới: "ở nơi nào học sinh bị xếp sớm vào các nhóm năng lực khác nhau, việc xếp ấy có thể là một máy gieo kỳ vọng. Nhưng ... bằng chứng quốc tế chưa ủng hộ rõ". Lý do: khẳng định về hệ thống Việt Nam không có nguồn (và việc có "lớp chọn" còn cần kiểm theo quy định hiện hành); nguồn quốc tế nói ngược. Review (Claude Sonnet 5.5, 30/10/2026): dung. Jussim & Harber mục Tracking: lớp xếp theo năng lực không mạnh hơn lớp hỗn hợp, cả hai trong khoảng 0–0,2. Trang gắn "chỉ là suy luận" cho phần Việt Nam.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
    review: dung
  - id: g1
    cau: 'Kỳ vọng không phải phép thuật: theo cách giải thích của Rosenthal nó chỉ tác động qua hành vi của người lớn, và các tổng quan thấy tác động này thường nhỏ.'
    loai: lich-su
    nguon:
      - jussim2005
    trich: Self-fulfilling prophecies in the classroom do occur, but these effects are typically small, they do not accumulate greatly across perceivers or over time, and they may be more likely to dissipate than accumulate
    vi_tri: Abstract
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nó chỉ có tác dụng khi biến thành hành vi... Nghĩ mà không làm thì chẳng có gì xảy ra." Chữ mới: như câu trên. Lý do: "chỉ có tác dụng khi biến thành hành vi" là cơ chế giả định (xem e3), không phải kết quả đo. Review (Claude Sonnet 5.5, 30/10/2026): dung. Chữ trang ("theo cách giải thích của Rosenthal", "các tổng quan thấy thường nhỏ") khớp Jussim & Harber, tóm tắt.'
