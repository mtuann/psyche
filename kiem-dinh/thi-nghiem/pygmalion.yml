    review: dung
  - id: g2
    cau: Điểm tăng trong nghiên cứu gốc là điểm trên một bài kiểm tra cụ thể, và chính bài kiểm tra ấy bị phê bình; phân tích tổng hợp thấy hiệu ứng trung bình lên điểm IQ chỉ nhỏ (0,11), và Jussim và Harber cho rằng việc kỳ vọng làm thay đổi trí tuệ vẫn chưa rõ.
    loai: lich-su
    nguon:
      - thorndike1968
      - raudenbush1984
      - jussim2005
    trich: whether self-fulfilling prophecies affect intelligence ... remains unclear
    vi_tri: Thorndike; Raudenbush; Jussim & Harber Abstract (c)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hiệu ứng thật tồn tại, nhưng khiêm tốn hơn nhiều." Chữ mới: câu trên. Lý do: "thật tồn tại" cho điểm IQ quá mạnh (b3). Review (Claude Sonnet 5.5, 30/10/2026): dung. Trang: 0,11 (Raudenbush) và "vẫn chưa rõ" việc kỳ vọng đổi trí tuệ (Jussim & Harber, tóm tắt, điểm c). Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf", "https://www.gwern.net/doc/iq/1995-snow.pdf", "https://doi.org/10.1037/0022-0663.76.1.85", "https://gwern.net/doc/statistics/bias/1984-raudenbush.pdf" ]
    review: dung
  - id: g3
    cau: Thầy cô không biết danh sách là ngẫu nhiên và không ai bảo họ thiên vị; nếu kỳ vọng có tác động thì đó là tác động mà thầy cô không hề cố ý.
    loai: phat-hien
    nguon:
      - raudenbush1984
    trich: In truth, the test was a traditional IQ test and the "bloomers" were a randomly selected 20% of the student population.
    vi_tri: Raudenbush tr. 85
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Không ai bảo họ làm vậy, và họ cũng không biết danh sách là bịa đặt. Đó chính là điều đáng chú ý: thiên vị xảy ra ngoài ý thức." Chữ mới: "... danh sách là ngẫu nhiên. Nếu kỳ vọng có tác động, thì đó là tác động mà thầy cô không hề cố ý." Lý do: "thiên vị xảy ra ngoài ý thức" là khẳng định cơ chế không đo được. Review (Claude Sonnet 5.5, 30/10/2026): dung. Raudenbush tr. 85: giáo viên được báo "bloomers" thực ra chọn ngẫu nhiên; nhận định "không cố ý" bám vào đó. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://www.gwern.net/doc/iq/1968-thorndike.pdf", "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
    review: dung
  - id: g4
    cau: Kỳ vọng thấp cũng có thể tự ứng nghiệm; hiệu ứng mạnh có thể xảy ra có chọn lọc ở học sinh thuộc nhóm bị kỳ thị, còn việc nó gây hại nhiều hơn lợi hay không thì chưa rõ.
    loai: lich-su
    nguon:
      - jussim2005
    trich: powerful self-fulfilling prophecies may selectively occur among students from stigmatized social groups
    vi_tri: Abstract
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Kỳ vọng thấp cũng tự ứng nghiệm — học sinh bị coi là kém sẽ nhận ít cơ hội hơn và kém đi thật." Chữ mới: câu trên. Lý do: như l4. Review (Claude Sonnet 5.5, 30/10/2026): dung. Như l4: Jussim & Harber, tóm tắt.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
    review: dung
  - id: q1a
    cau: Danh sách học sinh "sắp bứt phá" được chọn hoàn toàn ngẫu nhiên khoảng 20% học sinh mỗi lớp, rồi được báo với giáo viên là các em được dự đoán sẽ tiến bộ vượt bậc.
    loai: phat-hien
    nguon:
      - rosenthal1966b
      - raudenbush1984
    trich: an average of 20% of the children were reported to classroom teachers as showing unusual potential ... (who had actually been selected at random)
    vi_tri: R&J 1966 abstract
    ket_qua: dung
    ghi_chu: Câu hỏi 1, đáp án đúng.
    luot_2: dung
    luot_2_nguon: [ "https://www.gwern.net/doc/iq/1968-thorndike.pdf", "https://doi.org/10.1037/0022-0663.76.1.85", "https://gwern.net/doc/statistics/bias/1984-raudenbush.pdf" ]
  - id: q1b
    cau: Nếu có khác biệt về sau thì nó không thể đến từ năng lực ban đầu của học sinh, vì danh sách là ngẫu nhiên; việc khác biệt ấy có đáng tin hay không còn phụ thuộc chất lượng số đo.
    loai: lich-su
    nguon:
      - raudenbush1984
      - thorndike1968
    trich: the "bloomers" were a randomly selected 20% of the student population
    vi_tri: Raudenbush tr. 85; Thorndike
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "mọi khác biệt về sau chỉ có thể đến từ kỳ vọng của giáo viên, không phải năng lực ban đầu của học sinh". Chữ mới: câu trên. Lý do: "chỉ có thể" bỏ qua sai số đo lường và dữ liệu gốc bị phê bình. Review (Claude Sonnet 5.5, 30/10/2026): dung. Lời giải thích quiz đã làm mềm ("không thể đến từ năng lực ban đầu", "phụ thuộc chất lượng số đo"). Khớp Raudenbush tr. 85 và Thorndike.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf", "https://www.gwern.net/doc/iq/1995-snow.pdf" ]
    review: dung
  - id: q2a
    cau: Sau 8 tháng, nhóm "nở muộn" hơn nhóm đối chứng gần 4 điểm IQ tổng và khoảng 7 điểm IQ lập luận.
    loai: so-lieu
    nguon:
      - raudenbush1984
    trich: those predicted to bloom had in fact gained significantly more in total IQ (nearly 4 points) and reasoning IQ (7 points) than the control group children.
    vi_tri: Raudenbush tr. 85–86
    ket_qua: dung
    ghi_chu: Câu hỏi 2, đáp án đúng; như j7. Phương án nhiễu "hơn khoảng 15 điểm" đã đổi thành "khoảng 30 điểm" vì 15 điểm đúng là mức chênh của riêng lớp 1 (Jussim & Harber).
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0022-0663.76.1.85", "https://gwern.net/doc/statistics/bias/1984-raudenbush.pdf", "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
  - id: q2b
    cau: Con số đủ lớn để gây chấn động năm 1968, nhưng cũng chính con số này về sau bị soi kỹ vì bài kiểm tra đầu vào có vấn đề.
    loai: lich-su
    nguon:
      - thorndike1968
      - snow1995
    trich: the basic data upon which this structure has been raised are so untrustworthy
    vi_tri: Thorndike tr. 711
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.gwern.net/doc/iq/1968-thorndike.pdf", "https://www.gwern.net/doc/iq/1995-snow.pdf" ]
    luot_2_ghi_chu: "Đúng: phê bình nhắm vào bài kiểm tra (đầu vào và đầu ra)."
  - id: q3a
    cau: Theo phân tích tổng hợp của Raudenbush, hiệu ứng mạnh nhất khi kỳ vọng được tạo lúc giáo viên chưa quen học sinh (chưa hoặc mới tiếp xúc khoảng một tuần); hiệu ứng trung bình chung chỉ khoảng 0,11.
    loai: so-lieu
    nguon:
      - raudenbush1984
    trich: four experiments having no prior contact yielded a mean effect size of 0.32. Three experiments having 1 week of prior contact obtained a mean effect size of 0.26. After more than 2 weeks of prior contact, the effect of expectancy seemed to disappear, as indicated by a mean effect size of −0.04 for those eight studies.
    vi_tri: Mục Results
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(đầu năm học)". Chữ mới: "(chưa hoặc mới tiếp xúc khoảng một tuần)". Lý do: như b4. Review (Claude Sonnet 5.5, 30/10/2026): dung. Khớp Raudenbush Results (chưa hoặc một tuần tiếp xúc: 0,32; 0,26). Trang nói "mạnh nhất" khi chưa quen học sinh.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0022-0663.76.1.85", "https://gwern.net/doc/statistics/bias/1984-raudenbush.pdf" ]
    review: dung
  - id: q3b
    cau: Trong các thí nghiệm gieo thông tin bịa đặt về IQ, hiệu ứng chỉ rõ khi giáo viên chưa quen học sinh (khoảng hai tuần đầu) và gần như biến mất sau đó; điều này chưa nói về kỳ vọng hình thành tự nhiên, vốn vẫn có tác động nhỏ và có thể mạnh hơn ở học sinh thuộc nhóm bị kỳ thị.
    loai: phat-hien
    nguon:
      - raudenbush1984
      - jussim2005
    trich: After more than 2 weeks of prior contact, the effect of expectancy seemed to disappear, as indicated by a mean effect size of −0.04 for those eight studies. | Self-fulfilling prophecies in the classroom do occur, but these effects are typically small
    vi_tri: Raudenbush tr. 91; Jussim & Harber, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Câu hỏi 3, giải thích; "mảnh đất trống" là hình ảnh. Review (Claude Sonnet 5.5, 30/10/2026): sai. Lời giải thích quiz viết "kỳ vọng chỉ gieo được trên mảnh đất trống" và "giáo viên đã có ấn tượng riêng thì thông tin bịa đặt gần như vô tác dụng", nói rộng ra mọi kỳ vọng (lượt 2: qua-manh). Đã sửa theo cau_dung của lượt 2: nói riêng về thí nghiệm gieo thông tin bịa đặt về IQ, thêm rằng kỳ vọng hình thành tự nhiên vẫn có tác động nhỏ (Jussim & Harber).'
    luot_2: qua-manh
    luot_2_nguon: [ "https://doi.org/10.1037/0022-0663.76.1.85", "https://gwern.net/doc/statistics/bias/1984-raudenbush.pdf", "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
    luot_2_ghi_chu: "câu đúng: Trong các thí nghiệm gieo thông tin bịa đặt về IQ, hiệu ứng chỉ rõ khi giáo viên chưa quen học sinh (khoảng hai tuần đầu), và biến mất sau đó; nhưng kỳ vọng hình thành tự nhiên vẫn có tác động tự ứng nghiệm nhỏ, và có thể mạnh hơn ở học sinh bị kỳ thị.; 'Chỉ gieo được trên mảnh đất trống' nói rộng ra mọi kỳ vọng. Bằng chứng chỉ nói về thí nghiệm gieo thông tin bịa lên IQ; kỳ vọng tự nhiên vẫn có tác động nhỏ, mạnh hơn ở nhóm bị kỳ thị."
    review: sai
  - id: q4a
    cau: 'Phê bình nổi tiếng nhất nhắm vào nghiên cứu gốc: bài kiểm tra đầu vào có vấn đề (điểm ban đầu thấp phi lý, như "IQ" lập luận trung bình 58 ở lớp 1), nên các kết luận của sách không được dữ liệu đỡ vững (Thorndike, 1968).'
    loai: phat-hien
    nguon:
      - thorndike1968
    trich: What kind of a test, or what kind of testing is it that gives a mean "IQ" of 58 for the total entering first grade
    vi_tri: Thorndike tr. 710
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nên phần tăng điểm rất có thể chỉ là hồi quy về trung bình — phê bình của Thorndike (1968)". Chữ mới: câu trên. Lý do: như nt2. Review (Claude Sonnet 5.5, 30/10/2026): dung. Thorndike tr. 709–710: IQ lập luận trung bình 58 ở lớp 1, và kết luận dữ liệu không đáng tin. Quiz khớp, không còn "hồi quy về trung bình".'
    luot_2: dung
    luot_2_nguon: [ "https://www.gwern.net/doc/iq/1968-thorndike.pdf", "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
    luot_2_ghi_chu: Thorndike nói về phát hiện ở lớp 1-2; 'các kết luận của sách' hơi rộng nhưng nằm trong phạm vi hiệu ứng tổng thể (do lớp 1-2 gây ra).
    review: dung
  - id: q4b
    cau: 'Bài học phải khiêm tốn: hiệu ứng có thể xảy ra nhưng thường nhỏ, còn con số gốc thì đáng ngờ.'
    loai: lich-su
    nguon:
      - thorndike1968
      - jussim2005
    trich: Self-fulfilling prophecies in the classroom do occur, but these effects are typically small, they do not accumulate greatly across perceivers or over time, and they may be more likely to dissipate than accumulate
    vi_tri: Thorndike; Jussim & Harber Abstract
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "hiệu ứng có thật, nhưng con số gốc thì đáng ngờ". Chữ mới: câu trên. Lý do: như g2. Review (Claude Sonnet 5.5, 30/10/2026): dung. Jussim & Harber (nhỏ) và Thorndike (số gốc đáng ngờ). Trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf", "https://www.gwern.net/doc/iq/1968-thorndike.pdf", "https://www.gwern.net/doc/iq/1995-snow.pdf" ]
    review: dung
  - id: q5a
    cau: Theo tổng kết 35 năm của Jussim và Harber (2005), kỳ vọng thường dự đoán đúng kết quả, nhưng có thể nhiều hơn là vì chúng chính xác (giáo viên đọc đúng năng lực) chứ không chỉ vì tự ứng nghiệm; hiệu ứng tự ứng nghiệm thường nhỏ.
    loai: lich-su
    nguon:
      - jussim2005
    trich: Self-fulfilling prophecies in the classroom do occur, but these effects are typically small, they do not accumulate greatly across perceivers or over time, and they may be more likely to dissipate than accumulate ... teacher expectations may predict student outcomes more because these expectations are accurate
    vi_tri: Abstract
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "phần lớn vì chúng chính xác ... thật sự thường nhỏ". Chữ mới: "có thể nhiều hơn là vì chúng chính xác ... thường nhỏ". Lý do: như nt5. Review (Claude Sonnet 5.5, 30/10/2026): dung. Như nt5: "có thể nhiều hơn là vì chúng chính xác"; "thường nhỏ" khớp tóm tắt.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
    review: dung
  - id: q5b
    cau: Kỳ vọng có tác động thật, nhưng khiêm tốn, và một phần "tiên đoán đúng" đơn giản là vì thầy cô nhìn người chuẩn.
    loai: lich-su
    nguon:
      - jussim2005
    trich: Self-fulfilling prophecies in the classroom do occur, but these effects are typically small, they do not accumulate greatly across perceivers or over time, and they may be more likely to dissipate than accumulate
    vi_tri: Abstract
    ket_qua: dung
    ghi_chu: Câu hỏi 5, giải thích; "đừng thần thánh hóa cũng đừng phủ nhận" là kết luận chung.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327957pspr0902_3", "https://www.gwern.net/doc/statistics/bias/publication/2005-jussim.pdf" ]
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: (không có)
    moi: 'Hộp hồ sơ nghiên cứu (:::ho-so-nghien-cuu): Tác giả, năm; Người tham gia; Thiết kế; Kết quả chính'
    ly_do: Bố cục C (kế hoạch).
  - cu: Đầu năm học, toàn bộ học sinh của 18 lớp (từ lớp 1 đến lớp 6) làm một bài kiểm tra IQ ... Sau đó, mỗi giáo viên nhận một danh sách
    moi: Vào tháng 5/1964, toàn bộ học sinh của trường làm một bài kiểm tra IQ ...; đầu năm học mới, mỗi giáo viên trong 18 lớp nhận một danh sách
    ly_do: j2.
  - cu: nói dối giáo viên tiểu học rằng vài học sinh được chọn ngẫu nhiên ... rồi theo dõi điểm số của các em suốt một năm học
    moi: báo với giáo viên tiểu học rằng khoảng 20% học sinh, thực ra được chọn ngẫu nhiên, ... rồi đo lại điểm IQ của các em sau 8 tháng
    ly_do: d1.
  - cu: Nhóm được chọn ngẫu nhiên vượt lên thật ... nhiều hơn hẳn ... Không phải vì các em thông minh hơn từ đầu, mà vì thầy cô tin
    moi: Theo báo cáo gốc, nhóm được chọn ngẫu nhiên tăng điểm nhiều hơn ... các tác giả giải thích rằng thầy cô tin ... nhưng nghiên cứu này bị phê bình nặng về dữ liệu
    ly_do: n1–n4.
  - cu: nhà điêu khắc trong thần thoại Hy Lạp
    moi: Pygmalion, nhà điêu khắc trong truyện thần thoại do Ovid kể (Metamorphoses, quyển 10)
    ly_do: e1.
  - cu: 'Điểm mấu chốt: thầy cô ... không hề cố ý thiên vị ... Kỳ vọng len lỏi qua những hành vi rất nhỏ ... Học sinh cảm nhận được tất cả những điều đó, và dần trở thành đúng như những gì thầy cô tin.'
    moi: 'Điểm mấu chốt: thầy cô ... không biết danh sách là ngẫu nhiên ... Theo cách giải thích của Rosenthal ... kỳ vọng có thể len lỏi qua những hành vi nhỏ ... Đây là cơ chế được đề xuất; mức tác động thực tế còn tranh cãi'
    ly_do: e2, e3.
  - cu: mỗi người vài con chuột ... giống hệt nhau ... học mê cung nhanh hơn hẳn ... "dễ mến" ... cầm nắm, đối xử với chúng nhẹ nhàng ... đã thay đổi hành vi của chính họ, và hành vi ấy thay đổi kết quả
    moi: mỗi người năm con chuột ... không có dòng "thông minh" hay "đần" nào ... chọn đúng nhánh mê cung nhiều hơn ... sạch hơn, thuần hơn, dễ chịu hơn ... (cầm nắm chưa đạt ý nghĩa thống kê, p = 0,09) ... các tác giả cho rằng ... có thể đã ảnh hưởng
    ly_do: r1–r6.
  - cu: Lenore Jacobson, hiệu trưởng một trường tiểu học ở California
    moi: Lenore Jacobson, tại trường tiểu học của bà
    ly_do: j1.
  - cu: bài kiểm tra IQ phi ngôn ngữ
    moi: bài kiểm tra IQ thông thường (Tests of General Ability, có phần từ vựng và phần lập luận)
    ly_do: j4.
  - cu: tên trường được giấu thành "trường Oak"
    moi: trường được gọi là "trường Oak"
    ly_do: j5.
  - cu: ở các lớp nhỏ (lớp 1 và lớp 2)
    moi: ở các lớp đầu cấp (lớp 1 và lớp 2)
    ly_do: j8.
  - cu: Cuối năm, giáo viên đánh giá nhóm "nở muộn" có cơ hội thành công trong tương lai cao hơn hẳn (mục duy nhất khác biệt có ý nghĩa thống kê); các đánh giá "tò mò hơn, vui vẻ hơn…" không đạt ý nghĩa thống kê trong số liệu gốc
    moi: Hiệu ứng xuất hiện chủ yếu ở các em nhỏ tuổi hơn. Theo tóm tắt của Raudenbush (1984), cuối năm giáo viên cũng đánh giá nhóm "nở muộn" tò mò hơn về trí tuệ, vui vẻ hơn và thích nghi tốt hơn
    ly_do: j9.
  - cu: Stephen Raudenbush quyết định không cãi bằng lời mà cãi bằng số
    moi: Stephen Raudenbush không cãi bằng lời mà dùng số
    ly_do: b1.
  - cu: Hiệu ứng trung bình chỉ là 0,11 — có thật, nhưng nhỏ hơn nhiều ... (đầu năm học, cỡ hiệu ứng khoảng 0,41 theo ước lượng mô hình)
    moi: 'Hiệu ứng trung bình chỉ là 0,11 — nhỏ, và có đạt ý nghĩa thống kê hay không còn tùy cách kiểm định ... (4 thí nghiệm không có tiếp xúc trước: cỡ hiệu ứng trung bình 0,32; 3 thí nghiệm có một tuần tiếp xúc trước: 0,26) ... (8 thí nghiệm: −0,04)'
    ly_do: b3, b4.
  - cu: 'Không chỉ một nghiên cứu đơn lẻ: hàng chục thí nghiệm độc lập — từ chuột bạch, học sinh, đến nhân viên ... Đây là một hiệu ứng có thật, được lặp lại.'
    moi: 'Không chỉ một nghiên cứu đơn lẻ: tổng quan 345 nghiên cứu của Rosenthal và Rubin (1978), được Raudenbush dẫn lại ... tổng quan 35 năm của Jussim và Harber (2005) cũng kết luận ... nhưng thường nhỏ'
    ly_do: nv2, nv3.
  - cu: cỡ hiệu ứng trung bình 0,11 — nhỏ. ... lúc giáo viên chưa có ấn tượng riêng về học sinh.
    moi: cỡ hiệu ứng trung bình 0,11 lên điểm IQ — nhỏ ... Jussim và Harber (2005) cũng thấy tác động thường nhỏ
    ly_do: nk2.
  - cu: điểm IQ ban đầu của nhiều lớp thấp đến mức phi lý, nên phần "tăng điểm" về sau rất có thể chỉ là hiện tượng hồi quy về trung bình
    moi: điểm "IQ" lập luận trung bình của học sinh lớp 1 chỉ là 58 (một lớp có trung bình 31), nên theo ông các kết luận của sách không được dữ liệu đỡ vững; thêm Snow (1995) và phản biện của Jussim & Harber
    ly_do: nt2–nt4.
  - cu: phần lớn là vì chúng chính xác; Hiệu ứng có thật, nhưng nhỏ hơn
    moi: có thể nhiều hơn là vì chúng chính xác; Hiệu ứng tự ứng nghiệm trong lớp học có xảy ra, nhưng nhỏ hơn
    ly_do: nt5.
  - cu: 'Bốn kênh tác động của Rosenthal: ... giọng điệu, ánh mắt ... gọi trả lời nhiều hơn, chờ đợi lâu hơn ... Không kênh nào cần đến ý thức.'
    moi: '... Theo Jussim và Harber (2005), giáo viên thường đối xử với học sinh được kỳ vọng cao theo những cách này; ... là cơ chế được giả định'
    ly_do: l2.
  - cu: 'Hiệu ứng ngược: ... tự ứng nghiệm theo hướng xấu (học sinh bị dán nhãn "kém" ...). Vì vậy dán nhãn trong giáo dục là con dao hai lưỡi.'
    moi: '... có thể tự ứng nghiệm ... Jussim và Harber (2005) nhận xét ... Dán nhãn trong giáo dục vì vậy cần thận trọng.'
    ly_do: l4, g4.
  - cu: 'Làm cha mẹ, thầy cô: giữ kỳ vọng cao ... khen nỗ lực thay vì khen "thông minh"'
    moi: các tổng quan mô tả giáo viên thường ấm áp hơn ... nên tránh dán nhãn cố định
    ly_do: a1.
  - cu: 'Làm quản lý: nhân viên mới thường nhạy với kỳ vọng của sếp nhất ...'
    moi: quy luật "gieo kỳ vọng lúc mới quen" của Raudenbush được kiểm trên học sinh, không phải nhân viên ... chưa phải bằng chứng
    ly_do: a2.
  - cu: một phần kết quả của bạn có thể đến từ kỳ vọng của người khác, không phải năng lực của bạn. Nhận ra điều đó là bước đầu để viết lại câu chuyện.
    moi: kỳ vọng của người khác có thể đóng một phần vào kết quả của bạn — thường là phần nhỏ — chứ không quyết định năng lực của bạn.
    ly_do: a3.
  - cu: Hầu hết nghiên cứu ... phương Tây ... Chúng tôi chưa tìm thấy thí nghiệm nào ...
    moi: Tính đến 10/2026, chúng tôi chưa tìm thấy ...
    ly_do: v1.
  - cu: ở Việt Nam, việc phân loại học sinh (lớp chọn, lớp thường, trường chuyên) diễn ra công khai và từ sớm — đó chính là một "máy gieo kỳ vọng" khổng lồ
    moi: ở nơi nào học sinh bị xếp sớm vào các nhóm năng lực khác nhau, việc xếp ấy có thể là một "máy gieo kỳ vọng" ... Jussim và Harber (2005) nêu một nghiên cứu (Smith và cộng sự, 1998) ...
    ly_do: v2.
  - cu: Kỳ vọng không phải phép thuật — nó chỉ có tác dụng khi biến thành hành vi ... Nghĩ mà không làm thì chẳng có gì xảy ra.
    moi: '... theo cách giải thích của Rosenthal, nó chỉ tác động qua hành vi của người lớn ..., và các tổng quan thấy tác động này thường nhỏ.'
    ly_do: g1.
  - cu: Hiệu ứng thật tồn tại, nhưng khiêm tốn hơn nhiều.
    moi: Phân tích tổng hợp thấy hiệu ứng trung bình lên điểm IQ chỉ nhỏ (0,11), và Jussim và Harber (2005) cho rằng việc kỳ vọng làm thay đổi trí tuệ vẫn chưa rõ.
    ly_do: g2.
  - cu: 'họ cũng không biết danh sách là bịa đặt. Đó chính là điều đáng chú ý: thiên vị xảy ra ngoài ý thức.'
    moi: họ cũng không biết danh sách là ngẫu nhiên. Nếu kỳ vọng có tác động, thì đó là tác động mà thầy cô không hề cố ý.
    ly_do: g3.
  - cu: Kỳ vọng thấp cũng tự ứng nghiệm — học sinh bị coi là kém sẽ nhận ít cơ hội hơn và kém đi thật.
    moi: Kỳ vọng thấp cũng có thể tự ứng nghiệm; ... chưa rõ.
    ly_do: g4.
  - cu: (đầu năm học) [đáp án quiz 3]
    moi: (chưa hoặc mới tiếp xúc khoảng một tuần)
    ly_do: q3a.
  - cu: rất có thể chỉ là hồi quy về trung bình — phê bình của Thorndike (1968) [đáp án quiz 4]
    moi: các kết luận của sách không được dữ liệu đỡ vững — phê bình của Thorndike (1968)
    ly_do: q4a.
  - cu: phần lớn vì chúng chính xác [đáp án quiz 5]
    moi: có thể nhiều hơn là vì chúng chính xác
    ly_do: q5a.
  - cu: 19 cỡ hiệu ứng từ 18 nghiên cứu độc lập được đưa về cùng một thước đo
    moi: Cỡ hiệu ứng của 18 nghiên cứu độc lập được đưa về cùng một thước đo
    ly_do: 'Review b2: 19 chỉ là số ca ở Bảng 5.'
  - cu: Khung :::vung-chac[kỳ vọng của người khác có thể tự ứng nghiệm]
    moi: Khung :::kha-vung[kỳ vọng của người khác có thể tự ứng nghiệm, nhưng thường nhỏ], thêm câu nêu lý do (nhãn dừng ở khá vững)
    ly_do: 'Review nv: chưa đạt thước đo Vững chắc (mục 4).'
  - cu: Kỳ vọng chỉ "gieo" được trên mảnh đất trống (đáp án quiz số 3)
    moi: Trong các thí nghiệm gieo thông tin bịa đặt về IQ, hiệu ứng chỉ rõ khi giáo viên chưa quen học sinh và gần như biến mất sau đó; chưa nói về kỳ vọng hình thành tự nhiên
    ly_do: 'Review q3b: lượt 2 báo quá mạnh.'
  - cu: 'Tự trải nghiệm: "Đầu năm học, ... cho cả lớp làm một bài kiểm tra ... Vài tuần sau, họ đưa cho bạn một danh sách: 5 học sinh"'
    moi: '"Cuối năm học trước, ... cho cả trường làm một bài kiểm tra ... Đầu năm học mới, họ đưa cho bạn một danh sách: khoảng một phần năm lớp (giả sử 5 trong 25 học sinh)"'
    ly_do: 'Review j2: nghiên cứu gốc làm bài kiểm tra tháng 5/1964 và đưa danh sách tháng 9 (Thorndike).'
  - cu: chọn đúng nhánh mê cung nhiều hơn, rõ nhất qua cả năm ngày gộp lại
    moi: 'chọn đúng nhánh mê cung nhiều hơn rõ rệt (gộp năm ngày: p một phía = 0,01; ngày 2 và ngày 3 chưa có ý nghĩa thống kê)'
    ly_do: 'Review r3: "rõ nhất" không có trong bài gốc; theo cau r3.'
ghi_chu: 'Sách gốc Rosenthal & Jacobson (1968) và bài Urban Review không mở được: con số 4/7 điểm IQ, 18 lớp lớp 1–6 lấy từ Raudenbush, Snow, Jussim & Harber, tóm tắt 1966. Rosenthal & Rubin (1978) chỉ biết qua Raudenbush. Rosenthal (1995, Critiquing Pygmalion) chưa đọc. Ba chỗ hồ sơ ghi "chưa chắc" hay "chỗ khó" cần người giao xem (j1 hiệu trưởng/California, j9 đánh giá của giáo viên, q1b/q4b chữ quiz chưa sửa).'
