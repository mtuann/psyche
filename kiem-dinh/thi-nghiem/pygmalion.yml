    vi_tri: Thorndike tr. 709–710
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "điểm IQ ban đầu của nhiều lớp thấp đến mức phi lý, nên phần \"tăng điểm\" về sau rất có thể chỉ là hiện tượng hồi quy về trung bình". Chữ mới: như câu trên. Lý do: Thorndike không nói "hồi quy về trung bình"; ông kết luận dữ liệu quá thiếu tin cậy, giá trị kết luận chỉ có thể là "một sự trùng hợp may mắn". Cũng sửa đáp án quiz số 4. Review (Claude Sonnet 5.5, 30/10/2026): dung. Thorndike tr. 709–710: "mean IQ of 58 for the total entering first grade"; một lớp 19 em trung bình 31. Trang khớp và không còn "hồi quy về trung bình".'
