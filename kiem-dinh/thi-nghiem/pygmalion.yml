    ly_do: 'Tổng quan 35 năm (Jussim & Harber 2005) kết luận lời tiên tri tự ứng nghiệm trong lớp học có xảy ra nhưng thường nhỏ; Raudenbush dẫn tổng quan 345 nghiên cứu của Rosenthal & Rubin (1978, tổng quan của chính tác giả gốc, chưa mở) ủng hộ hiệu ứng ở nhiều bối cảnh. Chưa đạt Vững chắc theo mục 4: phân tích tổng hợp chất lượng tốt duy nhất mở được (Raudenbush) cho d = 0,11 và nó đạt hay không đạt ý nghĩa thống kê tùy cách kiểm định; Jussim & Harber là tổng quan tường thuật; không có tái lập lớn có đăng ký trước; bằng chứng chủ yếu ở Mỹ. Cùng mức với khung nk.'
    trich: Self-fulfilling prophecies in the classroom do occur, but these effects are typically small, they do not accumulate greatly across perceivers or over time, and they may be more likely to dissipate than accumulate
    vi_tri: Jussim & Harber, Abstract
    ket_qua: da-sua
    ghi_chu: 'chỗ khó: câu trong khung dễ đọc thành "hiệu ứng mạnh". Đã sửa lời trong khung (thêm "thường nhỏ"). Jussim & Harber nói rõ chưa rõ liệu tự ứng nghiệm có tác động lên trí tuệ; Snow (1995) phản bác cách gộp 464 nghiên cứu: người giao xem có hạ xuống Khá vững. Review (Claude Sonnet 5.5, 30/10/2026): sai (nhãn). Lượt 1 giữ Vững chắc và tự ghi chỗ khó. So thước đo mục 4: Vững chắc đòi phân tích tổng hợp hay tổng quan hệ thống chất lượng tốt, hoặc hai tái lập lớn có đăng ký trước, cùng chiều, và không thất bại tái lập lớn. Ở đây phân tích tổng hợp mở được (Raudenbush) cho hiệu ứng nhỏ và "có đạt ý nghĩa thống kê hay không còn tùy cách kiểm định"; tổng quan 345 nghiên cứu là của chính Rosenthal, chỉ đọc qua Raudenbush; Snow 1995 phản bác. Dù câu chỉ nói "có thể", không đủ cho Vững chắc. Đã hạ xuống Khá vững: sửa khung trên trang (:::kha-vung, thêm câu nêu lý do), cau, nhan, ly_do.'
