    luot_2_ghi_chu: "Dung nếu chỉ đọc là 'có thể xảy ra' (tồn tại hiệu ứng, thường nhỏ): có tổng quan 35 năm và phân tích tổng hợp, nhiều bối cảnh. Không dùng được cho tuyên bố về tác động lên IQ (xem nt)."
