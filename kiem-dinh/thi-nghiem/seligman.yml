doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: (không có)
    moi: 'Hộp hồ sơ nghiên cứu (:::ho-so-nghien-cuu): tác giả và năm, đối tượng, thiết kế, kết quả chính, cập nhật 2016'
    ly_do: Bố cục C (kế hoạch).
  - cu: 'Hình seligman-design: "Nhóm đối chứng ngây thơ: Đeo đai / không bị sốc"; "Chịu sốc y hệt nhóm 1"; "Bấm bảng hai bên đầu"; "Học nhảy tốt" / "Nằm im chịu đựng"; "Chỉ nhóm yoked suy giảm nặng nề…"; chú thích "chịu cú sốc y hệt nhau… chỉ nhóm yoked nằm im chịu đựng"'
    moi: '"Nhóm đối chứng (8 con): Không vào võng / không bị sốc trước"; "Sốc cùng thời lượng trung bình"; "Ấn tấm bảng bằng đầu là tắt sốc"; "Thoát sốc bình thường" / "Phần lớn thụ động (6/8)"; "Chỉ nhóm yoked bị suy giảm rõ: 6 trên 8 con không thoát ở ít nhất 9 trong 10 lượt"; chú thích theo bài gốc'
    ly_do: Đối chiếu Seligman & Maier 1967 (n30, n31, n74, n75). Hình có tên trong HINH_DA_SUA.
  - cu: 'Khối "Xem đáp án": "Câu hỏi cho chính chúng ta: khi con người liên tục rơi vào tình huống mà nỗ lực chẳng thay đổi được gì, điều gì xảy ra với ý chí của họ?"'
    moi: (bỏ)
    ly_do: Câu hỏi mở không kiểm được, trái với ngộ nhận về "ý chí" cuối trang (n7).
  - cu: :::tranh-cai['bất lực học được' giải thích được bao nhiêu về trầm cảm ở người?] … "nhưng chính họ chỉ “phỏng đoán”…"
    moi: Cùng khung, thêm Costello 1978, Abramson 1978, Sweeney 1986 (phân tích tổng hợp 104 nghiên cứu); thêm Costello 1978 và Sweeney 1986 vào mục Nguồn
    ly_do: Căn cứ cho nhãn Đang tranh cãi (n44, n76–n78).
  - cu: 'Tự trải nghiệm: "Cuối thập niên 1960, hai con chó bị buộc trong võng…"'
    moi: '"Giữa thập niên 1960, hai con chó bị buộc trong võng…"'
    ly_do: "Review: hai tác giả tới Penn năm 1964, bài đăng 1967 (n2)."
  - cu: "Giải thích câu hỏi 2: \"Nhóm yoked mang kỳ vọng 'làm gì cũng vô ích' sang cả tình huống mới, nơi nỗ lực lẽ ra vẫn có tác dụng.\""
    moi: "\"Năm 1967, hai tác giả giải thích rằng nhóm yoked đã học được 'làm gì cũng không tắt được sốc' và mang điều đó sang tình huống mới. Năm 2016, chính họ viết rằng cách giải thích này 'hiểu ngược': thụ động là phản ứng mặc định, thứ phải học là sự kiểm soát.\""
    ly_do: "Review: lời giải thích cũ nói thuyết 1967 như sự thật, trái với chính trang (n60)."
