nhan_dinh:
- id: n1
  cau: Năm 1967, Seligman và Maier cho thấy chó từng chịu sốc điện không thể kiểm soát phần lớn thụ động chịu đựng trong hộp shuttle box dù chỉ cần nhảy qua vách ngăn thấp là thoát.
  loai: phat-hien
  nguon: &id001
  - seligman1967
  trich: Dogs which had 1st learned to panel press in a harness in order to escape shock subsequently showed normal acquisition of escape/avoidance behavior in a shuttle box. In contrast, yoked, inescapable shock in the harness produced profound interference with subsequent escape responding in the shuttle box.
  vi_tri: Tóm tắt; Table 1
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ (description): "sẽ nằm im chịu đựng". Mới: "phần lớn thụ động" (6/8 chó yoked thất bại ở ≥ 9/10 lượt; 2/8 thì không). "Vách ngăn thấp": Maier 2016 viết "short barrier"; Seligman & Maier 1967 chỉnh vách ngang vai chó: chỗ khó (từ "thấp" giữ theo 2016).'
- id: n2
  cau: Cuối thập niên 1960, chó được buộc trong võng (hammock) và chịu sốc điện.
  loai: lich-su
  nguon: *id001
  trich: a rubberized, cloth hammock located inside a shielded, white, sound-attenuating cubicle ... S was strapped into the hammock
  vi_tri: tr. 2 (Apparatus)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "bị đeo đai cố định". Mới: "buộc trong võng". gia-dinh: cảnh "Tự trải nghiệm" là minh họa theo thiết kế 1967, hai con chó.'
- id: n3
  cau: Hai con chó chịu cú sốc cùng cường độ và cùng thời lượng trung bình; con thứ nhất tắt được sốc bằng cách ấn đầu vào tấm bảng ở bên đầu, con thứ hai ấn thế nào sốc cũng không dừng.
  loai: phat-hien
  nguon: *id001
  trich: The duration of shock on any given trial was determined by the mean duration of the corresponding trial in the Escape group.
  vi_tri: tr. 3 (Procedure)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "cú sốc điện giống hệt nhau"; "chạm mõm vào tấm bảng bên đầu". Mới: "cùng cường độ và thời lượng trung bình" (yoked nhận thời lượng bằng trung bình của cú tương ứng ở nhóm thoát được); "ấn đầu" (S & M: "pressed the panels with its head"; Maier 2016 viết nose: bám 1967).'
- id: n4
  cau: Hôm sau, cả hai được đưa vào một hộp shuttle có vách ngăn ở giữa; chỉ cần nhảy qua vách là thoát sốc.
  loai: phat-hien
  nguon: *id001
  trich: Twenty-four hours later dogs in the Escape group were given 10 trials of escape/avoidance training in the shuttle box
  vi_tri: tr. 3
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "thả vào một cái hộp dài có vách ngăn thấp ở giữa". Mới thêm 24 giờ trong n về thiết kế.'
- id: n5
  cau: Phần lớn chó nhóm yoked (6 trên 8 con) thụ động chịu sốc ở ít nhất 9 trong 10 lượt, dù chỉ cần một cái nhảy là thoát.
  loai: so-lieu
  nguon: *id001
  trich: Six Ss in the "Yoked" control group failed to escape shock on 9 or more of the 10 trials in the shuttle box.
  vi_tri: tr. 3 (Results)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Con từng học được rằng ''làm gì cũng vô ích'' ... nằm bẹp xuống sàn, hầu như không buồn thử" (như thể mọi con). Mới số liệu 6/8.'
- id: n6
  cau: Chó từng tắt được sốc hôm trước, và cả những con chó chưa từng bị sốc, thoát sốc bình thường.
  loai: phat-hien
  nguon: *id001
  trich: The Escape group and the Normal control group did not differ on these indexes.
  vi_tri: tr. 3
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đều nhanh chóng học cách nhảy qua vách ngăn". Mới: "thoát sốc bình thường" (nhóm đối chứng có 1/8 con thất bại ≥ 9/10 lượt).'
- id: n7
  cau: 'Câu hỏi cho chính chúng ta: khi con người liên tục rơi vào tình huống mà nỗ lực chẳng đổi được gì, điều gì xảy ra với ý chí của họ?'
  loai: phat-hien
  nguon: []
  ket_qua: null
  ghi_chu: 'chưa chắc: câu hỏi mở, không phải khẳng định; giữ nguyên chữ cũ.'
- id: n8
  cau: Thí nghiệm cho thấy, trong thiết kế của họ, thủ phạm không phải cú sốc điện mà là sự không kiểm soát được cú sốc.
  loai: phat-hien
  nguon: *id001
  trich: Because the Escape group differed from the "Yoked" control group during their initial exposure to shock only in their control over shock termination, we suggest that differential learning about their control over shock occurred in these two groups.
  vi_tri: tr. 3–4 (Discussion)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "chứng minh". Mới: "cho thấy, trong thiết kế của họ" (chính tác giả viết "we suggest").'
- id: n9
  cau: Hai nhóm chó chịu sốc cùng cường độ và cùng thời lượng; nếu chính cơn đau làm chó "tê liệt", hai nhóm phải cư xử giống nhau.
  loai: phat-hien
  nguon: *id001
  trich: the Escape and the "Yoked" control groups were equated for the possibility of adventitious punishment for active responding by shock onset in the harness
  vi_tri: tr. 4
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đúng y hệt cường độ và thời lượng"; mới: "cùng cường độ và cùng thời lượng" (trung bình theo từng lượt).'
- id: n10
  cau: Seligman và Maier giải thích năm 1967 rằng sinh vật học được kết quả độc lập với phản ứng của mình, và bài học đó lan sang tình huống mới; họ gọi đó là "bất lực học được".
  loai: lich-su
  nguon: *id001
  trich: Ss failed to escape shock in the shuttle box following inescapable shock in the harness because they had learned that shock termination was independent of responding.
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: khẳng định như sự thật "Đó là sự bất lực học được: sinh vật học được rằng ...". Mới: giải thích năm 1967 của hai tác giả, và Maier 2016 nói "hiểu ngược".'
- id: n11
  cau: Năm 2016, chính Maier và Seligman viết rằng giải thích gốc "hiểu ngược" (got it backwards).
  loai: lich-su
  nguon: &id002
  - maier2016
  trich: the original theory got it backwards
  vi_tri: Tóm tắt
  ket_qua: dung
- id: n12
  cau: 'Hiện tượng bắt nguồn từ phòng thí nghiệm của Richard Solomon ở Đại học Pennsylvania, nơi nghiên cứu điều kiện hóa sợ hãi kiểu Pavlov: chó bị giữ trong võng, chịu sốc, hôm sau tập thoát sốc trong hộp shuttle.'
  loai: lich-su
  nguon: *id002
  trich: Richard Solomon and his students at the University of Pennsylvania wanted to know how prior Pavlovian fear conditioning would influence later instrumental learning
  vi_tri: Mở đầu
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Overmier và Seligman vốn nghiên cứu điều kiện hóa Pavlov trên chó". Mới theo Maier 2016: phòng thí nghiệm Solomon (Leaf 1964, Overmier & Leaf 1965); Seligman và Maier đến Penn 1964 làm nghiên cứu sinh.'
- id: n13
  cau: Chó nhiều khi không thoát sốc trong hộp shuttle mà thụ động chờ hết sốc.
  loai: phat-hien
  nguon: *id002
  trich: the dogs often failed to escape altogether in the shuttlebox and passively waited the shock out
  vi_tri: Mở đầu
  ket_qua: dung
- id: n14
  cau: 'Overmier và Seligman: sốc không thoát được làm hỏng một cách đáng tin cậy việc học thoát/tránh sốc sau đó trong tình huống mới.'
  loai: phat-hien
  nguon: &id003
  - overmier1967
  trich: Exposure of dogs to inescapable shocks under a variety of conditions reliably interfered with subsequent instrumental escape-avoidance responding in a new situation.
  vi_tri: Tóm tắt (OpenAlex)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "thất bại trong việc học cách thoát dù lối thoát rất dễ; sau vài lượt thử, chúng nằm im chịu đựng thụ động". "Sau vài lượt" có trong phần mở đầu của Seligman & Maier 1967 ("after a few trials, they passively accept shock"); chỉ đọc tóm tắt bài Overmier & Seligman.'
- id: n15
  cau: Chó vẫn bị suy giảm khi bị tê liệt bằng curare lúc chịu sốc, và khi tăng cường độ sốc lúc tập thoát.
  loai: phat-hien
  nguon: *id003
  trich: Ss curarized during their exposure to inescapable shocks also showed proactive interference ... Use of a higher level of shock during instrumental avoidance training did not attenuate interference
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: Chi tiết thêm vào trang.
- id: n16
  cau: Suy giảm tan sau 48 giờ.
  loai: phat-hien
  nguon: *id003
  trich: Magnitude of interference was found to dissipate rapidly in time, leaving an apparently normal S after only 48 hr.
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: Chi tiết thêm; đối lập với 7 ngày ở Seligman & Maier 1967 (chó đã bị suy giảm và thất bại lần đầu trong hộp shuttle).
- id: n17
  cau: Overmier và Seligman gợi ý mức kiểm soát có thể là yếu tố quyết định hiệu ứng.
  loai: lich-su
  nguon: *id001
  trich: Overmier and Seligman (1967) suggested that the degree of control over shock allowed to the animal in the harness may be an important determinant of this interference effect.
  vi_tri: tr. 2
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đây là lần đầu tiên hiện tượng được mô tả và đặt tên là sự bất lực học được". Maier 2016: "helplessness, as first suggested by Overmier and Seligman in 1967" (gợi ý từ, không phải đặt tên thuật ngữ "learned helplessness" trong bài 1967: chưa kiểm).'
- id: n18
  cau: Maier và Seligman (2016) viết rằng Overmier và Seligman là người đầu tiên gợi ý từ "bất lực" cho hiện tượng.
  loai: lich-su
  nguon: *id002
  trich: From the beginning we thought the phenomenon looked like helplessness, as first suggested by Overmier and Seligman in 1967.
  vi_tri: Mở đầu
  ket_qua: dung
- id: n19
  cau: Thí nghiệm I của Seligman và Maier dùng 24 chó, mỗi nhóm 8 con.
  loai: so-lieu
  nguon: *id001
  trich: This left 24 Ss, eight in each group.
  vi_tri: tr. 2 (Subjects)
  ket_qua: da-sua
  ghi_chu: Chữ cũ không nêu số.
- id: n20
  cau: Nhóm thoát được ấn một trong hai tấm bảng bằng đầu để tắt sốc; 64 cú sốc 6 mA không báo hiệu.
  loai: phat-hien
  nguon: *id001
  trich: Sixty-four unsignaled 6.0 ma. shocks were presented ... If the dog pressed either panel with its head during shock, shock terminated.
  vi_tri: tr. 2–3
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "bấm tấm bảng hai bên đầu để tắt sốc".'
- id: n21
  cau: Nhóm yoked nhận cú sốc có thời lượng bằng trung bình của cú tương ứng ở nhóm thoát được, nhưng ấn bảng vô tác dụng.
  loai: phat-hien
  nguon: *id001
  trich: The duration of shock on any given trial was determined by the mean duration of the corresponding trial in the Escape group.
  vi_tri: tr. 3
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "chịu cú sốc đúng y hệt, được cặp theo từng cú sốc của bạn cùng cặp". Sai: ở thí nghiệm này theo trung bình của nhóm (Maier 2016 xác nhận: "In this initial experiment ... the average duration"; thí nghiệm sau mới cặp từng đôi).'
- id: n22
  cau: Nhóm đối chứng bình thường không qua giai đoạn trong võng, chỉ tập 10 lượt trong hộp shuttle.
  loai: phat-hien
  nguon: *id001
  trich: The Normal control group received only 10 escape/avoidance trials in the shuttle box as described above.
  vi_tri: tr. 3
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "nhóm đối chứng ngây thơ (đeo đai nhưng không bị sốc)". Sai: nhóm này không bị đeo đai. Đã sửa trên trang. Hình seligman-design còn ghi "Đeo đai / không bị sốc": người giao xử lý (không sửa hình).'
- id: n23
  cau: Sau 24 giờ, cả ba nhóm cùng làm 10 lượt tập thoát sốc trong hộp shuttle.
  loai: phat-hien
  nguon: *id001
  trich: Twenty-four hours later ... 10 trials of escape/avoidance training in the shuttle box
  vi_tri: tr. 3
  ket_qua: dung
