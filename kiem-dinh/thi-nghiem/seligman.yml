  ghi_chu: 'Chữ cũ: "vỏ não trước trán trong hoạt động như bộ phát hiện kiểm soát" ✓ (medial prefrontal cortex; tiểu vùng prelimbic của vmPFC trong thân bài). Bỏ ẩn dụ "bộ phát hiện".'
