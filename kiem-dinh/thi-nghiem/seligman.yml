- id: n37
  cau: 'Hai tác giả thừa nhận lý thuyết gốc "hiểu ngược": thụ động trước sốc kéo dài không phải là thứ học được mà là phản ứng mặc định, có sẵn, qua hoạt động serotonin của nhân dorsal raphe ức chế hành vi thoát.'
  loai: phat-hien
  nguon: *id002
  trich: Passivity in response to shock is not learned. It is the default, unlearned response to prolonged aversive events and it is mediated by the serotonergic activity of the dorsal raphe nucleus, which in turn inhibits escape.
