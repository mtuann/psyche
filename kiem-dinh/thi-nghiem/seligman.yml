nhan_dinh:
  - id: n1
    cau: Năm 1967, Seligman và Maier cho thấy chó từng chịu sốc điện không thể kiểm soát phần lớn thụ động chịu đựng trong hộp shuttle box dù chỉ cần nhảy qua vách ngăn thấp là thoát.
    loai: phat-hien
    nguon: &id001
      - seligman1967
    trich: Dogs which had 1st learned to panel press in a harness in order to escape shock subsequently showed normal acquisition of escape/avoidance behavior in a shuttle box. In contrast, yoked, inescapable shock in the harness produced profound interference with subsequent escape responding in the shuttle box.
    vi_tri: Tóm tắt; Table 1
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ (description): "sẽ nằm im chịu đựng". Mới: "phần lớn thụ động" (6/8 chó yoked thất bại ở ≥ 9/10 lượt; 2/8 thì không). "Vách ngăn thấp": Maier 2016 viết "short barrier"; Seligman & Maier 1967 chỉnh vách ngang vai chó: chỗ khó (từ "thấp" giữ theo 2016). Review (Claude Opus 5.5, 30/10/2026): đối chiếu chữ trên trang với trích Seligman & Maier 1967 trong hồ sơ, tóm tắt bài (OpenAlex, đọc lại) và kết quả lượt 2; "phần lớn thụ động" đúng 6/8; "vách ngăn thấp" theo "a short barrier" của Maier & Seligman 2016 (bài 1967 chỉnh vách ngang vai chó), chấp nhận được.'
    luot_2: dung
    luot_2_nguon: [ "http://psych.hanover.edu/Classes/Learning/papers/seligman%20maier%201967.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4920136/" ]
    luot_2_ghi_chu: Vách cao ngang vai chó (bài gốc); Maier và Seligman 2016 gọi là 'a short barrier'.
    review: dung
  - id: n2
    cau: Giữa thập niên 1960, chó được buộc trong võng (hammock) và chịu sốc điện.
    loai: lich-su
    nguon:
      - seligman1967
      - maier2016
    trich: a rubberized, cloth hammock … S was strapped into the hammock (1967, tr. 2); We arrived at Penn as first year graduate students in 1964 (2016)
    vi_tri: Seligman & Maier 1967 tr. 2; Maier & Seligman 2016, mở đầu
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "bị đeo đai cố định". Mới: "buộc trong võng". gia-dinh: cảnh "Tự trải nghiệm" là minh họa theo thiết kế 1967, hai con chó. Review (Claude Opus 5.5, 30/10/2026): sai: "Cuối thập niên 1960" lệch thời điểm. Maier & Seligman 2016 (toàn văn PMC4920136): hai tác giả tới Penn năm 1964 làm nghiên cứu sinh; bài đăng tháng 1/1967, nên thí nghiệm làm giữa thập niên 1960 (lượt 2 cũng chỉ). Chữ cũ "Cuối thập niên 1960, hai con chó bị buộc…" → "Giữa thập niên 1960, hai con chó bị buộc…".'
    luot_2: dung
    luot_2_nguon: [ "http://psych.hanover.edu/Classes/Learning/papers/seligman%20maier%201967.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4920136/" ]
    luot_2_ghi_chu: "Bài đăng 1967, thí nghiệm làm giữa thập niên 1960 (2016: hai tác giả tới Penn năm 1964; nhóm Solomon dùng võng từ đầu thập niên 1960). 'Cuối thập niên 1960' hơi lệch; 'giữa thập niên 1960' chính xác hơn, nhưng không đổi ý."
    review: sai
  - id: n3
    cau: Hai con chó chịu cú sốc cùng cường độ và cùng thời lượng trung bình; con thứ nhất tắt được sốc bằng cách ấn đầu vào tấm bảng ở bên đầu, con thứ hai ấn thế nào sốc cũng không dừng.
    loai: phat-hien
    nguon: *id001
    trich: The duration of shock on any given trial was determined by the mean duration of the corresponding trial in the Escape group.
    vi_tri: tr. 3 (Procedure)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cú sốc điện giống hệt nhau"; "chạm mõm vào tấm bảng bên đầu". Mới: "cùng cường độ và thời lượng trung bình" (yoked nhận thời lượng bằng trung bình của cú tương ứng ở nhóm thoát được); "ấn đầu" (S & M: "pressed the panels with its head"; Maier 2016 viết nose: bám 1967). Review (Claude Opus 5.5, 30/10/2026): đối chiếu chữ trên trang với trích Seligman & Maier 1967 trong hồ sơ, tóm tắt bài (OpenAlex, đọc lại) và kết quả lượt 2; "ấn đầu" theo bài 1967 ("with its head"); "cùng thời lượng trung bình" đúng thiết kế thí nghiệm I.'
    luot_2: dung
    luot_2_nguon: [ "http://psych.hanover.edu/Classes/Learning/papers/seligman%20maier%201967.pdf" ]
    luot_2_ghi_chu: Maier và Seligman 2016 viết 'with their noses'; bài gốc 1967 viết 'with its head'.
    review: dung
  - id: n4
    cau: Hôm sau, cả hai được đưa vào một hộp shuttle có vách ngăn ở giữa; chỉ cần nhảy qua vách là thoát sốc.
    loai: phat-hien
    nguon: *id001
    trich: Twenty-four hours later dogs in the Escape group were given 10 trials of escape/avoidance training in the shuttle box
    vi_tri: tr. 3
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thả vào một cái hộp dài có vách ngăn thấp ở giữa". Mới thêm 24 giờ trong n về thiết kế. Review (Claude Opus 5.5, 30/10/2026): đối chiếu chữ trên trang với trích Seligman & Maier 1967 trong hồ sơ, tóm tắt bài (OpenAlex, đọc lại) và kết quả lượt 2.'
    luot_2: dung
    luot_2_nguon: [ "http://psych.hanover.edu/Classes/Learning/papers/seligman%20maier%201967.pdf" ]
    review: dung
  - id: n5
    cau: Phần lớn chó nhóm yoked (6 trên 8 con) thụ động chịu sốc ở ít nhất 9 trong 10 lượt, dù chỉ cần một cái nhảy là thoát.
    loai: so-lieu
    nguon: *id001
    trich: Six Ss in the "Yoked" control group failed to escape shock on 9 or more of the 10 trials in the shuttle box.
    vi_tri: tr. 3 (Results)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Con từng học được rằng ''làm gì cũng vô ích'' ... nằm bẹp xuống sàn, hầu như không buồn thử" (như thể mọi con). Mới số liệu 6/8. Review (Claude Opus 5.5, 30/10/2026): đối chiếu chữ trên trang với trích Seligman & Maier 1967 trong hồ sơ, tóm tắt bài (OpenAlex, đọc lại) và kết quả lượt 2; 6/8, ≥ 9/10 lượt khớp Results.'
    luot_2: dung
    luot_2_nguon: [ "http://psych.hanover.edu/Classes/Learning/papers/seligman%20maier%201967.pdf" ]
    review: dung
  - id: n6
    cau: Chó từng tắt được sốc hôm trước, và cả những con chó chưa từng bị sốc, thoát sốc bình thường.
    loai: phat-hien
    nguon: *id001
    trich: The Escape group and the Normal control group did not differ on these indexes.
    vi_tri: tr. 3
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đều nhanh chóng học cách nhảy qua vách ngăn". Mới: "thoát sốc bình thường" (nhóm đối chứng có 1/8 con thất bại ≥ 9/10 lượt). Review (Claude Opus 5.5, 30/10/2026): đối chiếu chữ trên trang với trích Seligman & Maier 1967 trong hồ sơ, tóm tắt bài (OpenAlex, đọc lại) và kết quả lượt 2; "bình thường" là như cả nhóm (đối chứng 1/8 con thất bại).'
    luot_2: dung
    luot_2_nguon: [ "http://psych.hanover.edu/Classes/Learning/papers/seligman%20maier%201967.pdf" ]
    luot_2_ghi_chu: Nhóm đối chứng có 1/8 con không thoát ở ít nhất 9 lượt; 'bình thường' là như cả nhóm, đúng.
    review: dung
  - id: n7
    cau: 'Câu hỏi cho chính chúng ta: khi con người liên tục rơi vào tình huống mà nỗ lực chẳng đổi được gì, điều gì xảy ra với ý chí của họ?'
    loai: phat-hien
    nguon: []
    ket_qua: da-bo
    ghi_chu: 'Opus: bỏ khỏi khối "Xem đáp án". Câu hỏi mở không kiểm được, lại gợi suy từ chó sang "ý chí" của con người, trái với ngộ nhận cuối trang ("Bất lực học được nghĩa là thiếu ý chí": không). Trang Seligman không viết gì gần với chẩn đoán. Review (Claude Opus 5.5, 30/10/2026): đã kiểm trang thật: khối "Xem đáp án" không còn câu hỏi về "ý chí". Bỏ đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4920136/" ]
    luot_2_ghi_chu: "Câu hỏi tu từ, không phải nhận định; không trái nguồn. Lưu ý chữ 'ý chí' dễ trái với n58 (không phải thiếu ý chí): nên hỏi về 'sự cố gắng'."
    review: dung
  - id: n8
    cau: Thí nghiệm cho thấy, trong thiết kế của họ, thủ phạm không phải cú sốc điện mà là sự không kiểm soát được cú sốc.
    loai: phat-hien
    nguon: *id001
    trich: Because the Escape group differed from the "Yoked" control group during their initial exposure to shock only in their control over shock termination, we suggest that differential learning about their control over shock occurred in these two groups.
    vi_tri: tr. 3–4 (Discussion)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "chứng minh". Mới: "cho thấy, trong thiết kế của họ" (chính tác giả viết "we suggest"). Review (Claude Opus 5.5, 30/10/2026): đối chiếu chữ trên trang với trích Seligman & Maier 1967 trong hồ sơ, tóm tắt bài (OpenAlex, đọc lại) và kết quả lượt 2; "cho thấy, trong thiết kế của họ" đúng mức "we suggest".'
    luot_2: dung
    luot_2_nguon: [ "http://psych.hanover.edu/Classes/Learning/papers/seligman%20maier%201967.pdf" ]
    review: dung
  - id: n9
    cau: Hai nhóm chó chịu sốc cùng cường độ và cùng thời lượng; nếu chính cơn đau làm chó "tê liệt", hai nhóm phải cư xử giống nhau.
    loai: phat-hien
    nguon: *id001
    trich: the Escape and the "Yoked" control groups were equated for the possibility of adventitious punishment for active responding by shock onset in the harness
    vi_tri: tr. 4
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đúng y hệt cường độ và thời lượng"; mới: "cùng cường độ và cùng thời lượng" (trung bình theo từng lượt). Review (Claude Opus 5.5, 30/10/2026): đối chiếu chữ trên trang với trích Seligman & Maier 1967 trong hồ sơ, tóm tắt bài (OpenAlex, đọc lại) và kết quả lượt 2.'
    luot_2: dung
    luot_2_nguon: [ "http://psych.hanover.edu/Classes/Learning/papers/seligman%20maier%201967.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4920136/" ]
    review: dung
  - id: n10
    cau: Seligman và Maier giải thích năm 1967 rằng sinh vật học được kết quả độc lập với phản ứng của mình, và bài học đó lan sang tình huống mới; họ gọi đó là "bất lực học được".
    loai: lich-su
    nguon: *id001
    trich: Ss failed to escape shock in the shuttle box following inescapable shock in the harness because they had learned that shock termination was independent of responding.
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: khẳng định như sự thật "Đó là sự bất lực học được: sinh vật học được rằng ...". Mới: giải thích năm 1967 của hai tác giả, và Maier 2016 nói "hiểu ngược". Review (Claude Opus 5.5, 30/10/2026): đối chiếu chữ trên trang với trích Seligman & Maier 1967 trong hồ sơ, tóm tắt bài (OpenAlex, đọc lại) và kết quả lượt 2; tóm tắt bài 1967 có chữ: "These results were interpreted as supporting a learned ''helplessness'' explanation", nên "họ gọi đó là bất lực học được" đúng.'
    luot_2: dung
    luot_2_nguon: [ "http://psych.hanover.edu/Classes/Learning/papers/seligman%20maier%201967.pdf" ]
    review: dung
  - id: n11
    cau: Năm 2016, chính Maier và Seligman viết rằng giải thích gốc "hiểu ngược" (got it backwards).
    loai: lich-su
    nguon: &id002
      - maier2016
    trich: the original theory got it backwards
    vi_tri: Tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4920136/" ]
  - id: n12
    cau: 'Hiện tượng bắt nguồn từ phòng thí nghiệm của Richard Solomon ở Đại học Pennsylvania, nơi nghiên cứu điều kiện hóa sợ hãi kiểu Pavlov: chó bị giữ trong võng, chịu sốc, hôm sau tập thoát sốc trong hộp shuttle.'
    loai: lich-su
    nguon: *id002
    trich: Richard Solomon and his students at the University of Pennsylvania wanted to know how prior Pavlovian fear conditioning would influence later instrumental learning
    vi_tri: Mở đầu
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Overmier và Seligman vốn nghiên cứu điều kiện hóa Pavlov trên chó". Mới theo Maier 2016: phòng thí nghiệm Solomon (Leaf 1964, Overmier & Leaf 1965); Seligman và Maier đến Penn 1964 làm nghiên cứu sinh. Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Maier & Seligman 2016 (PMC4920136, NCBI E-utilities, đọc lại 30/10/2026); "Richard Solomon and his students at the University of Pennsylvania…", Leaf 1964, Overmier & Leaf 1965.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4920136/" ]
    review: dung
  - id: n13
    cau: Chó nhiều khi không thoát sốc trong hộp shuttle mà thụ động chờ hết sốc.
    loai: phat-hien
    nguon: *id002
    trich: the dogs often failed to escape altogether in the shuttlebox and passively waited the shock out
    vi_tri: Mở đầu
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4920136/" ]
  - id: n14
    cau: 'Overmier và Seligman: sốc không thoát được làm hỏng một cách đáng tin cậy việc học thoát/tránh sốc sau đó trong tình huống mới.'
    loai: phat-hien
    nguon: &id003
      - overmier1967
    trich: Exposure of dogs to inescapable shocks under a variety of conditions reliably interfered with subsequent instrumental escape-avoidance responding in a new situation.
    vi_tri: Tóm tắt (OpenAlex)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thất bại trong việc học cách thoát dù lối thoát rất dễ; sau vài lượt thử, chúng nằm im chịu đựng thụ động". "Sau vài lượt" có trong phần mở đầu của Seligman & Maier 1967 ("after a few trials, they passively accept shock"); chỉ đọc tóm tắt bài Overmier & Seligman. Review (Claude Opus 5.5, 30/10/2026): đọc lại tóm tắt Overmier & Seligman 1967 (OpenAlex): khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/h0024166", "http://psych.hanover.edu/Classes/Learning/papers/seligman%20maier%201967.pdf" ]
    luot_2_ghi_chu: "đọc tóm tắt qua OpenAlex (toan_van: false) (Overmier và Seligman); Seligman và Maier 1967 kể lại cùng ý."
    review: dung
  - id: n15
    cau: Chó vẫn bị suy giảm khi bị tê liệt bằng curare lúc chịu sốc, và khi tăng cường độ sốc lúc tập thoát.
    loai: phat-hien
    nguon: *id003
    trich: Ss curarized during their exposure to inescapable shocks also showed proactive interference ... Use of a higher level of shock during instrumental avoidance training did not attenuate interference
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: "Chi tiết thêm vào trang. Review (Claude Opus 5.5, 30/10/2026): đọc lại tóm tắt Overmier & Seligman 1967 (OpenAlex): khớp."
    luot_2: dung
