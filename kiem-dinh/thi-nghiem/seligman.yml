  - id: n36
    cau: Nghiên cứu thần kinh học được tổng hợp chủ yếu trên chuột, dùng các can thiệp như tổn thương và vi tiêm thuốc chặn hoạt động của vùng não.
    loai: phat-hien
    nguon: *id002
    trich: In the research to be described below, rats are the subject ... prevented by either lesion ... or microinjection of pharmacological agents
    vi_tri: Mục "The Neural Circuitry of Learned Helplessness" và "Passivity/Anxiety and the Dorsal raphe nucleus"
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "trên chuột và chó (gây tổn thương chọn lọc, bất hoạt tạm thời, kích thích trực tiếp vùng não)". Chó: không phải đối tượng của phần thần kinh học; "kích thích trực tiếp" chỉ là một dẫn chứng gián tiếp (kích thích điện đường PL tới DRN ức chế DRN, trích từ các nghiên cứu khác). Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Maier & Seligman 2016 (PMC4920136, NCBI E-utilities, đọc lại 30/10/2026); "Research with animals quickly switched from dogs to rodents"; can thiệp bằng tổn thương, vi tiêm.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4920136/" ]
    luot_2_ghi_chu: Từ đoạn 'Research with animals quickly switched from dogs to rodents'.
    review: dung
  - id: n37
    cau: 'Hai tác giả thừa nhận lý thuyết gốc "hiểu ngược": thụ động trước sốc kéo dài không phải là thứ học được mà là phản ứng mặc định, có sẵn, qua hoạt động serotonin của nhân dorsal raphe ức chế hành vi thoát.'
    loai: phat-hien
    nguon: *id002
    trich: Passivity in response to shock is not learned. It is the default, unlearned response to prolonged aversive events and it is mediated by the serotonergic activity of the dorsal raphe nucleus, which in turn inhibits escape.
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thủ phạm ... do hoạt động serotonin của nhân dorsal raphe ở thân não" ✓. Thêm: "Họ cũng chỉ ra rằng tác dụng của sốc không còn khi sốc thoát được ở lần đầu" (Maier 2016: không xảy ra nếu sốc thoát được; kiểm soát được phát hiện ở vỏ não trước trán, ức chế dorsal raphe). Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Maier & Seligman 2016 (PMC4920136, NCBI E-utilities, đọc lại 30/10/2026); tóm tắt "Passivity in response to shock is not learned. It is the default, unlearned response…".'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4920136/" ]
    review: dung
  - id: n38
    cau: 'Cái thực sự phải học là sự kiểm soát: vùng vỏ não trước trán trong phát hiện kiểm soát và tự động ức chế nhân dorsal raphe.'
    loai: phat-hien
    nguon: *id002
    trich: This passivity can be overcome by learning control, with the activity of the medial prefrontal cortex, which subserves the detection of control leading to the automatic inhibition of the dorsal raphe nucleus.
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "vỏ não trước trán trong hoạt động như bộ phát hiện kiểm soát" ✓ (medial prefrontal cortex; tiểu vùng prelimbic của vmPFC trong thân bài). Bỏ ẩn dụ "bộ phát hiện". Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Maier & Seligman 2016 (PMC4920136, NCBI E-utilities, đọc lại 30/10/2026); tóm tắt "medial prefrontal cortex, which subserves the detection of control".'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4920136/" ]
    review: dung
  - id: n39
    cau: 'Khá vững: sốc không kiểm soát được làm suy giảm việc học cách thoát sau này — ở động vật.'
    loai: nhan
    nguon:
      - seligman1967
      - maier2016
    trich: The mechanism ... the well-replicated result was that two-thirds of the animals from the INESC group failed to learn to escape, whereas 90% of the animals in both the ESC and 0 groups easily learned to escape
    vi_tri: Maier 2016, mục "Operationalizing Learned Helplessness"
    nhan: kha-vung
    co_so:
      - seligman1967
      - maier2016
      - hiroto1975
    ly_do: 'Hiệu ứng có thiết kế ba nhóm, được lặp lại ở chó (Seligman & Maier 1967), chuột (Maier & Seligman 2016 gọi là "well-replicated") và trong thí nghiệm người ngắn (Hiroto & Seligman 1975, chỉ tóm tắt). Chưa có phân tích tổng hợp hay tái lập lớn có đăng ký trước mà chúng tôi mở được, và bằng chứng do chính nhóm tác giả tổng kết: chưa đạt Vững chắc. Opus xét lại (chỗ khó): giữ Khá vững. Hiệu ứng ở động vật có nhiều lặp lại (Maier & Seligman 2016: "well-replicated"), có một tổng quan hệ thống (Pryce và cộng sự 2011, Pharmacol Ther 132(3), 242–267, doi 10.1016/j.pharmthera.2011.06.006) nhưng không mở được (trang chặn bot, không có tóm tắt ở OpenAlex), chưa có phân tích tổng hợp đã mở; nguồn đã mở đều do chính hai tác giả. Lượt 2 có thể nâng nếu mở được Pryce 2011.'
    ket_qua: da-lam-mem
    ghi_chu: 'chỗ khó: chữ cũ :::vung-chac ("lặp lại nhiều lần, trên chó, chuột và các loài khác, với thiết kế ba nhóm"). Thước đo Vững chắc đòi tổng hợp hay hai tái lập lớn: chưa có; hạ xuống Khá vững. Bỏ câu "Đây đều là nghiên cứu trên động vật theo chuẩn đạo đức của thập niên 1960" (không nguồn), thay bằng điều kiểm được. Người giao/lượt 2 cân nhắc; nếu có tổng quan hệ thống độc lập thì có thể nâng. Review (Claude Opus 5.5, 30/10/2026): nhãn so thước đo mục 4: hiệu ứng được lặp lại nhiều ở chó và chuột (Maier & Seligman 2016: "the well-replicated result was that two-thirds of the animals from the INESC group failed to learn to escape"), nhưng không có phân tích tổng hợp hay tái lập lớn có đăng ký trước đã mở, nguồn đã mở do chính nhóm tác giả, chỉ trên động vật: Khá vững là đúng; chưa đủ Vững chắc. Khung trên trang nói rõ giới hạn.'
    luot_2: dung
    luot_2_nguon: [ "http://psych.hanover.edu/Classes/Learning/papers/seligman%20maier%201967.pdf", "https://doi.org/10.1037/h0024166", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4920136/" ]
    luot_2_ghi_chu: Nhiều nghiên cứu cùng chiều trên chó, chuột (2016); chưa có tái lập lớn đăng ký trước hay phân tích tổng hợp được tìm thấy; giới hạn ở động vật. Khá vững hợp thước đo.
    review: dung
  - id: n40
    cau: 'Khá vững: bản "đảo ngược" 2016 có nền tảng thần kinh học trên động vật.'
    loai: nhan
    nguon: *id002
    trich: The mechanism of learned helplessness is now very well-charted biologically and the original theory got it backward.
    vi_tri: Tóm tắt
    nhan: kha-vung
    co_so:
      - maier2016
    ly_do: 'Mạch dựng từ can thiệp (tổn thương, vi tiêm) trên chuột, nhưng là tổng hợp do chính hai tác giả của lý thuyết gốc viết, trên động vật, chưa có tổng quan độc lập: mức Khá vững. Opus xét lại: giữ Khá vững.'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "dựng từ các nghiên cứu can thiệp nhân quả trên chuột, không chỉ tương quan". Giữ; thêm "do chính hai tác giả của lý thuyết gốc viết". Chữ cũ "mạch ... vỏ não trước trán trong": giữ. Review (Claude Opus 5.5, 30/10/2026): nhãn so thước đo mục 4: mạch thần kinh dựng từ nhiều nghiên cứu can thiệp trên chuột (Maier & Seligman 2016, toàn văn), cùng chiều, nhưng tổng hợp do chính hai tác giả, chưa có tổng quan độc lập đã mở: Khá vững là mức cao nhất hợp lý. Khung nói rõ giới hạn.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4920136/" ]
    luot_2_ghi_chu: Bằng chứng thần kinh nhiều nghiên cứu cùng chiều trên chuột (tổn thương, vi tiêm, kích hoạt), phần lớn từ nhóm Maier; chưa có tổng hợp độc lập hay tái lập lớn. Khá vững là mức cao nhất hợp lý; không cao hơn thước đo.
    review: dung
  - id: n41
    cau: Từ thập niên 1970, Seligman đề xuất dùng hiện tượng này làm mô hình phòng thí nghiệm cho trầm cảm.
    loai: lich-su
    nguon: *id002
    trich: the possibility that learned helplessness was a laboratory model of clinical depression (Seligman, 1974; Simson & Weiss, 1988)
    vi_tri: Mục "Humans"
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Seligman từ năm 1975 đã đề xuất mô hình động vật". Mới: "từ thập niên 1970" (Maier 2016 dẫn Seligman 1974). Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Maier & Seligman 2016 (PMC4920136, NCBI E-utilities, đọc lại 30/10/2026); mục "Humans": "Seligman, 1974".'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4920136/" ]
    review: dung
  - id: n42
    cau: Maier và Seligman (2016) kể rằng hiện tượng tái hiện tám trong chín triệu chứng của trầm cảm theo tiêu chí DSM-III và DSM-IV.
    loai: phat-hien
    nguon: *id002
    trich: Learned helplessness in the laboratory – combining the animal and human experimental results – produced eight of the nine symptoms
    vi_tri: Mục "Humans"
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhưng bước nhảy ... gây tranh cãi suốt nhiều thập niên" (không nguồn). Mới nêu điều Maier 2016 kể và thêm "phỏng đoán". Đây là lời kể của chính tác giả. Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Maier & Seligman 2016 (PMC4920136, NCBI E-utilities, đọc lại 30/10/2026); "combining the animal and human experimental results – produced eight of the nine symptoms" (DSM-III, DSM-IV); trang viết "nhiều triệu chứng trong danh sách của DSM" và gán cho lời kể của hai tác giả: đúng mức.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4920136/" ]
    review: dung
  - id: n43
    cau: Chính Maier và Seligman chỉ "phỏng đoán" (speculate) rằng phát hiện thần kinh có thể có ý nghĩa cho điều trị trầm cảm.
    loai: phat-hien
    nguon: *id002
    trich: We speculate that default passivity and the compensating detection and expectation of control may have substantial implications for how to treat depression.
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "các thí nghiệm then chốt không thể lặp lại trên người vì lý do đạo đức" (không nguồn; bỏ). Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Maier & Seligman 2016 (PMC4920136, NCBI E-utilities, đọc lại 30/10/2026); tóm tắt "We speculate…".'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4920136/" ]
    review: dung
  - id: n44
    cau: 'Đang tranh cãi: ''bất lực học được'' giải thích được bao nhiêu về trầm cảm ở người? (mô hình gợi ý, không phải công cụ chẩn đoán hay điều trị; dẫn trang Hỗ trợ).'
    loai: nhan
    nguon:
      - maier2016
      - costello1978
      - abramson1978
      - sweeney1986
    trich: They were found to provide little or no support for the learned helplessness theory of depression.
    vi_tri: tóm tắt Costello 1978; tóm tắt Abramson 1978, Sweeney 1986; Maier 2016 tóm tắt
    nhan: tranh-cai
    co_so:
      - costello1978
      - abramson1978
      - sweeney1986
      - maier2016
    ly_do: 'Bằng chứng chất lượng mâu thuẫn: một phía có phân tích tổng hợp 104 nghiên cứu (Sweeney 1986) cho thấy kiểu quy kết của thuyết cải biên liên hệ đáng tin cậy với điểm trầm cảm (tương quan); phía kia có tổng quan phê bình (Costello 1978: các thí nghiệm trên người "little or no support"), chính các tác giả phải cải biên thuyết cho người (Abramson 1978), và năm 2016 Maier & Seligman viết cơ chế gốc "got it backward", chỉ "speculate" về điều trị. Đạt Đang tranh cãi (mục 4).'
    ket_qua: da-sua
    ghi_chu: 'chỗ khó (Opus): lượt 1 giữ nhãn nhưng căn cứ yếu (chỉ Maier 2016). Đã thêm ba nguồn mở được tóm tắt và viết lại thân khung. Chữ cũ: "…nhưng chính họ chỉ “phỏng đoán” (speculate) rằng phát hiện thần kinh có thể có ý nghĩa cho điều trị trầm cảm. Đây là mô hình gợi ý…". Mới: thêm Costello 1978, Abramson 1978, Sweeney 1986 (n76–n78). Không viết gì như chẩn đoán; giữ lời dẫn /psyche/ho-tro/. Review (Claude Opus 5.5, 30/10/2026): nhãn so thước đo mục 4: tổng quan phê bình Costello 1978 ("little or no support"), bản cải biên Abramson 1978, phân tích tổng hợp Sweeney 1986 (104 nghiên cứu, gần 15.000 người, liên hệ đáng tin cậy, tương quan), và Maier & Seligman 2016 chỉ "speculate" về điều trị: bằng chứng mâu thuẫn, hợp Đang tranh cãi. Đọc lại bốn tóm tắt (OpenAlex) và toàn văn 2016. Câu gần sức khỏe tâm thần: khung nói rõ "mô hình gợi ý, tuyệt đối không phải công cụ chẩn đoán hay điều trị", có link /psyche/ho-tro/; không có câu nào như chẩn đoán hay lời khuyên điều trị.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0021-843X.87.1.21", "https://doi.org/10.1037/0021-843X.87.1.49", "https://doi.org/10.1037/0022-3514.50.5.974", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4920136/" ]
    luot_2_ghi_chu: "Mâu thuẫn bằng chứng: Costello 1978 thấy ít hay không ủng hộ; bản sửa 1978; phân tích tổng hợp Sweeney 1986 chỉ cho liên hệ. Đang tranh cãi hợp thước đo. Lời 'không phải công cụ chẩn đoán hay điều trị' đúng với chính tác giả ('speculate')."
    review: dung
  - id: n76
    cau: Năm 1978, một tổng quan phê bình cho rằng sáu thí nghiệm trên người của nhóm Seligman ủng hộ rất ít cho thuyết bất lực học được về trầm cảm (Costello, 1978).
    loai: phat-hien
    nguon:
      - costello1978
    trich: Six laboratory experiments on learned helplessness and depression in humans reported by Seligman and his colleagues were critically reviewed. They were found to provide little or no support for the learned helplessness theory of depression.
    vi_tri: tóm tắt (OpenAlex)
    ket_qua: dung
