  loai: phat-hien
  nguon: *id001
  trich: It differed significantly from the Escape group and from the Normal control group ... The Escape group and the Normal control group did not differ on these indexes.
  vi_tri: tr. 3
  ket_qua: dung
- id: n27
  cau: 'Thí nghiệm II (27 chó, mỗi nhóm 9 con): chó đã từng thoát được sốc trong hộp shuttle trước đó không bị suy giảm sau khi chịu sốc không kiểm soát trong võng, trong khi chó chưa có kinh nghiệm thì bị suy giảm.'
  loai: phat-hien
  nguon: *id001
  trich: The No Pregroup showed significant interference with escape/avoidance responding in the shuttle box on Day 3. The Preescape and the No Inescapable groups did not show such interference.
  vi_tri: tr. 5 (Exp. II, Results)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "chó đã có kinh nghiệm thoát sốc từ trước thì không bị suy giảm sau khi chịu sốc không kiểm soát được — trải nghiệm kiểm soát đã bảo vệ chúng". Mới nêu cỡ mẫu, bối cảnh (thoát trong hộp shuttle); chó chịu sốc không thoát trong hộp shuttle trước đó vẫn bị suy giảm (nhóm đối chứng sau).'
- id: n28
