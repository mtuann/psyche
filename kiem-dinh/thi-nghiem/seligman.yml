  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "thủ phạm ... do hoạt động serotonin của nhân dorsal raphe ở thân não" ✓. Thêm: "Họ cũng chỉ ra rằng tác dụng của sốc không còn khi sốc thoát được ở lần đầu" (Maier 2016: không xảy ra nếu sốc thoát được; kiểm soát được phát hiện ở vỏ não trước trán, ức chế dorsal raphe).'
