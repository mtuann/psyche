    luot_2_nguon: [ "https://doi.org/10.1037/h0076270" ]
    luot_2_ghi_chu: "đọc tóm tắt qua OpenAlex (toan_van: false)"
    review: dung
  - id: n34
    cau: Hiroto và Seligman gợi ý một kỳ vọng rằng phản ứng của mình không liên quan đến kết quả, và hiệu ứng có thể là một "đặc điểm gây ra được".
    loai: lich-su
    nguon:
      - hiroto1975
    trich: We suggest that inescapability and insolubility both engendered expectancies that responding is independent of reinforcement. ... learned helplessness may be an induced trait.
    vi_tri: Tóm tắt
