    ghi_chu: 'Chữ cũ: "hiệu ứng lan truyền qua lĩnh vực khác ... kỳ vọng bất lực khái quát hóa". Mới bám tóm tắt. Review (Claude Opus 5.5, 30/10/2026): đọc lại tóm tắt Hiroto & Seligman 1975 (OpenAlex): khớp; "learned helplessness may be an induced trait".'
    luot_2: dung
