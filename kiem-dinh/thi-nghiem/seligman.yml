  - id: n78
    cau: Một phân tích tổng hợp 104 nghiên cứu thấy cách giải thích nguyên nhân ấy có liên hệ đáng tin cậy với điểm trầm cảm (Sweeney và cộng sự, 1986); đó là mối liên hệ, tự nó không cho biết chiều nhân quả.
    loai: so-lieu
