nhan_dinh:
- id: n1
  cau: B. F. Skinner cho chuột ấn cần gạt trong buồng thí nghiệm và phát hiện lịch trình thưởng ảnh hưởng đến hành vi (Ferster & Skinner 1957).
  loai: phat-hien
  nguon:
  - ferster1957
  - openstax2e
  trich: By the manipulation of schedules, a wide range of changes in behavior can be produced
  vi_tri: Lời nói đầu của Ferster & Skinner; OpenStax 6.3
  ket_qua: da-sua
  ghi_chu: 'Câu mô tả (description). Chữ cũ: "phát hiện lịch trình thưởng quyết định sức bền của hành vi"; mạnh hơn: nguồn nói lịch trình tạo ra nhiều thay đổi hành vi. Mới: "tạo ra những mẫu hình hành vi khác nhau"; "buồng thao tác" đổi thành "buồng thí nghiệm"; "ý chí tự do" đổi thành "quyết định luận" (xem nhận định về nhãn Đang tranh cãi).'
- id: n2
  cau: 'Khi bạn ngừng thưởng, hành vi được củng cố ngắt quãng (nhất là tỉ lệ biến đổi) bền hơn khi thưởng mỗi lần: Skinner (1953) viết rằng sức bền khi tắt dần do củng cố ngắt quãng "có thể lớn hơn nhiều" so với cùng số lần thưởng cho các đáp ứng liên tiếp.'
  loai: phat-hien
  nguon:
  - skinner1953
  trich: the resistance to extinction generated by intermittent reinforcement may be much greater than if the same number of reinforcements are given for consecutive responses
  vi_tri: Science and Human Behavior, chương V (đoạn về extinction)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ (đáp án thu gọn): "bền bỉ hơn hẳn ... một trong những phát hiện vững chắc nhất của Skinner và Ferster". Mới theo Skinner 1953: "may be much greater". Không còn gán cho Ferster & Skinner 1957 (không tìm thấy câu tương ứng trong phần đã đọc).'
- id: n3
  cau: Skinner (1953) nhận xét máy đánh bạc trả thưởng theo lịch trình tỉ lệ biến đổi.
  loai: phat-hien
  nguon:
  - skinner1953
  trich: Slot machines, roulette wheels, dice cages, horse races, and so on pay off on a schedule of variable-ratio reinforcement.
  vi_tri: Science and Human Behavior (đoạn về gambling)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Cũng là lý do máy đánh bạc gây nghiện đến vậy": khẳng định nhân quả không có nguồn; OpenStax nêu nghiên cứu gần đây trên chuột không ủng hộ ý Skinner rằng riêng lịch trình VR gây cờ bạc bệnh lý (Laskowski và cộng sự 2019: chưa mở bài gốc).'
- id: n4
  cau: Nghiên cứu gần đây trên chuột không ủng hộ ý của Skinner rằng riêng lịch trình tỉ lệ biến đổi gây cờ bạc bệnh lý (theo OpenStax, dẫn Laskowski và cộng sự 2019).
  loai: tai-lap
  nguon:
  - openstax2e
  trich: Recent research in rats has failed to support Skinner’s idea that training on variable-ratio schedules alone causes pathological gambling
  vi_tri: OpenStax 6.3, hộp "Gambling and the Brain"
  ket_qua: dung
  ghi_chu: Nguồn bậc 2 (giáo trình); bài gốc Laskowski 2019 chưa mở.
- id: n5
  cau: Khác với chó của Pavlov học "âm thanh báo hiệu thức ăn", con vật của Skinner học "làm gì thì được gì".
  loai: dinh-nghia
  nguon:
  - openstax2e
  trich: Skinner believed that behavior is motivated by the consequences we receive for the behavior
  vi_tri: OpenStax 6.3
  ket_qua: dung
- id: n6
  cau: Một hành vi tự phát, một khi được thưởng, sẽ xuất hiện thường xuyên hơn (hành vi thao tác).
  loai: dinh-nghia
  nguon:
  - openstax2e
  - skinner1938
  trich: At first, the rat might randomly hit the lever while exploring the box, and out would come a pellet of food. After eating the pellet, what do you think the hungry rat did next? It hit the lever again
  vi_tri: OpenStax 6.3
  ket_qua: dung
  ghi_chu: '"Operant" theo Skinner 1938: "An operant is an identifiable part of behavior" (chương I).'
- id: n7
  cau: Lịch trình thưởng tạo ra những nhịp độ hành vi khác nhau và ảnh hưởng đến sức bền của hành vi khi thưởng ngừng.
  loai: phat-hien
  nguon:
  - ferster1957
  - openstax2e
  trich: The four reinforcement schedules yield different response patterns.
  vi_tri: Hình 6.13 OpenStax; Ferster & Skinner lời nói đầu
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "quyết định tốc độ học, nhịp độ hành vi và sức bền". "Quyết định tốc độ học": không thấy trong nguồn. Mới: "tạo ra nhịp độ khác nhau" và "ảnh hưởng đến sức bền" (Skinner 1953; OpenStax).'
- id: n8
  cau: Skinner bắt đầu chương trình nghiên cứu từ luận án tiến sĩ ở Harvard (1931); phần lớn các thí nghiệm trong sách 1938 làm khi là nghiên cứu viên ở Harvard.
  loai: lich-su
  nguon:
  - skinner1938
  trich: a thesis for the degree of doctor of philosophy at Harvard University in 1931
  vi_tri: Acknowledgments, The Behavior of Organisms (bản quét OCR)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "(1904–1990) bắt đầu thí nghiệm khi còn là nghiên cứu sinh ở Harvard đầu thập niên 1930". Bỏ năm sinh/năm mất (chưa có nguồn đã mở). Mới theo lời cảm ơn: luận án 1931, phần lớn nghiên cứu khi là Fellow (National Research Council; Society of Fellows, Harvard).'
- id: n9
  cau: Thiết bị là buồng thí nghiệm, về sau được gọi là "buồng điều kiện hóa thao tác", quen gọi là "hộp Skinner".
  loai: lich-su
  nguon:
  - openstax2e
  trich: He placed these animals inside an operant conditioning chamber, which has come to be known as a “Skinner box”
  vi_tri: OpenStax 6.3
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "chính ông gọi nó là buồng thao tác (operant chamber); hộp Skinner là biệt danh do người khác đặt" (cả ở phần ngộ nhận). Không tìm được câu của Skinner xác nhận tên; trong Skinner 1938 dùng "experimental box" (đã đọc, không có "operant chamber"/"Skinner box"); Ferster & Skinner 1957 dùng "experimental chamber".'
- id: n10
  cau: Chuột đói ấn một cần gạt để nhận viên thức ăn; chim bồ câu mổ một đĩa phím.
  loai: phat-hien
  nguon:
  - openstax2e
  trich: A Skinner box contains a lever (for rats) or disk (for pigeons) that the animal can press or peck for a food reward via the dispenser.
  vi_tri: OpenStax 6.3
  ket_qua: dung
- id: n11
  cau: Hành vi được ghi dưới dạng đường cong tích lũy theo thời gian; độ dốc cho biết tốc độ đáp ứng.
  loai: phat-hien
  nguon:
  - skinner1938
  - ferster1957
  trich: The cumulative record permits immediate inspection and estimation of rate
  vi_tri: lời giới thiệu 1997 (Morse & Dews) trong bản in lại Ferster & Skinner; Skinner 1938 dùng "cumulative curve"
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "một thiết bị ghi tích lũy vẽ đồ thị: mỗi đáp ứng nhích bút lên một nấc, nên độ dốc chính là tốc độ". Chi tiết "nhích bút lên một nấc" không kiểm được; bỏ. Trích là của lời giới thiệu 1997 (người viết sau), không phải văn bản 1957.'
- id: n12
  cau: Chuột đói học ấn cần để lấy thức ăn.
  loai: phat-hien
  nguon:
  - openstax2e
  trich: It hit the lever again, and received another pellet of food.
  vi_tri: OpenStax 6.3
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "nhanh chóng học" (bỏ "nhanh chóng").'
- id: n13
  cau: Hành vi không chỉ phụ thuộc "có thưởng hay không" mà vào cách thưởng được sắp xếp (lịch trình).
  loai: phat-hien
  nguon:
  - ferster1957
  trich: It is now clear that far from being a mere falling-short of the ideal of inevitable reinforcement, intermittent reinforcement constitutes an important condition of action.
  vi_tri: Lời nói đầu (Foreword) của Ferster & Skinner
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "mà vào khi nào thưởng đến". Mới tổng quát hơn: "cách thưởng được sắp xếp".'
- id: n14
  cau: Skinner công bố The Behavior of Organisms (1938, Appleton-Century) khi là phó giáo sư ở Đại học Minnesota, tổng kết nghiên cứu đã làm từ Harvard.
  loai: lich-su
  nguon:
  - skinner1938
  trich: ASSISTANT PROFESSOR OF PSYCHOLOGY UNIVERSITY OF MINNESOTA
  vi_tri: trang tựa
  ket_qua: da-sua
  ghi_chu: Trang tựa ghi "Assistant Professor of Psychology, University of Minnesota"; "tổng kết nghiên cứu từ Harvard" theo lời cảm ơn.
- id: n15
  cau: Phần lớn công việc của Ferster và Skinner làm từ 1/9/1949 đến 30/6/1955, theo hợp đồng giữa Văn phòng Nghiên cứu Hải quân Mỹ và Đại học Harvard.
  loai: lich-su
  nguon:
  - ferster1957
  trich: during the period between September 1, 1949 and June 30, 1955
  vi_tri: Acknowledgments (Ferster & Skinner)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "nghiên cứu từ 1949 đến 1955"; mới theo lời cảm ơn ("Most of the work reported in this book was carried out under contract to the Office of Naval Research ... with Harvard University").'
- id: n16
  cau: Ferster và Skinner mô tả hệ thống nhiều lịch trình thưởng trong sách Schedules of Reinforcement (Appleton-Century-Crofts, 1957).
  loai: lich-su
  nguon:
  - ferster1957
  trich: The first step in our analysis of the field is therefore a purely formal statement of these possibilities
  vi_tri: Foreword/Introduction (Ferster & Skinner)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "hệ thống hóa mọi lịch trình thưởng có thể nghĩ ra ... dày 741 trang". Bỏ "mọi" (tác giả nói "other possibilities exist") và "741 trang" (số trang chỉ thấy qua mục lục thư viện, chưa mở). Nhà xuất bản: nguon.yml ghi Appleton-Century-Crofts; bản in lại của Skinner Foundation ghi "Original copyright © 1957 by Prentice-Hall" (không mâu thuẫn rõ, chưa phân giải).'
- id: n17
  cau: Con vật trong sách 1957 chủ yếu là bồ câu, ngoài ra có chuột.
  loai: phat-hien
  nguon:
  - ferster1957
  trich: In some of the experiments rats were studied, and the response then consisted of depressing a small horizontal bar
  vi_tri: Ch. 1 và lời giới thiệu 1997 (bồ câu được dùng nhiều nhất)
  ket_qua: da-sua
  ghi_chu: 'Câu mới thêm (trang cũ nói chuột); lời giới thiệu 1997: "Homing pigeons were most frequently used by Ferster & Skinner".'
- id: n18
  cau: 'Bốn lịch trình cơ bản: tỉ lệ cố định, tỉ lệ biến đổi, khoảng cố định, khoảng biến đổi.'
  loai: dinh-nghia
  nguon:
  - ferster1957
  trich: 'These two possibilities yield four basic schedules: fixed-interval, variable-interval, fixed-ratio, and variable-ratio.'
  vi_tri: Foreword
  ket_qua: dung
- id: n19
  cau: 'Tỉ lệ cố định (FR): thưởng sau mỗi N đáp ứng; tốc độ cao, có quãng nghỉ ngắn sau mỗi lần thưởng.'
  loai: dinh-nghia
  nguon:
  - openstax2e
  trich: A fixed ratio schedule is predictable and produces a high response rate, with a short pause after reinforcement
  vi_tri: OpenStax 6.3, Hình 6.13
  ket_qua: dung
  ghi_chu: 'Ferster & Skinner: "Fixed-ratio schedules generate high rates of responding; in the pigeon they often exceed 10 responses per second."'
- id: n20
  cau: 'Tỉ lệ biến đổi (VR): thưởng sau số đáp ứng trung bình N thay đổi ngẫu nhiên; tốc độ cao, đều, khó tắt dần nhất trong các lịch trình.'
  loai: dinh-nghia
  nguon:
  - openstax2e
  trich: Among the reinforcement schedules, variable ratio is the most productive and the most resistant to extinction.
  vi_tri: OpenStax 6.3
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "rất cao, đều, và bền nhất — mẫu hình của máy đánh bạc". Mới theo OpenStax; "mẫu hình của máy đánh bạc" đổi thành "Skinner (1953) gắn với máy đánh bạc".'
- id: n21
  cau: 'Khoảng cố định (FI): thưởng cho đáp ứng đầu tiên sau mỗi N giây; đường cong "vỏ sò": nghỉ sau thưởng rồi tăng tốc khi gần đến giờ.'
  loai: dinh-nghia
  nguon:
  - openstax2e
  trich: The fixed interval schedule yields a scallop-shaped response pattern, reflecting a significant pause after reinforcement
  vi_tri: OpenStax 6.3, Hình 6.13
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "nghỉ ngơi sau khi vừa được thưởng, rồi tăng tốc dồn dập khi gần đến giờ"; "dồn dập" bỏ nếu không nguồn: giữ mô tả "vỏ sò" của OpenStax.'
- id: n22
  cau: 'Khoảng biến đổi (VI): tốc độ vừa phải, đều.'
  loai: dinh-nghia
  nguon:
  - openstax2e
  trich: The variable interval schedule is unpredictable and produces a moderate, steady response rate
  vi_tri: OpenStax 6.3, Hình 6.13
  ket_qua: dung
- id: n23
  cau: 'Hình: bốn đường cong tích lũy — FR cao nhưng vỡ nhịp sau thưởng; VR rất cao, đều, bền nhất; FI hình vỏ sò; VI vừa phải, rất đều; sơ đồ ước lệ, không theo tỉ lệ số liệu.'
  loai: dinh-nghia
  nguon:
  - openstax2e
  trich: The four reinforcement schedules yield different response patterns.
  vi_tri: src/hinh/skinner-schedules.html (đã đọc); OpenStax Hình 6.13
  ket_qua: dung
  ghi_chu: 'Hình không có con số; nhãn "rất cao" (VR) khác OpenStax "high and steady" nhưng sơ đồ đã ghi "ước lệ". Không sửa hình (theo lời giao). Người giao cân nhắc đổi "rất cao... bền nhất" thành "cao, đều, khó tắt dần nhất" nếu muốn khớp chữ trang. Chữ "(VR) mẫu hình của máy đánh bạc" trong chú thích: Skinner 1953.'
- id: n24
  cau: Skinner (1953) nêu rằng củng cố ngắt quãng có thể tạo hành vi bền hơn củng cố liên tục với cùng số lần thưởng; một bồ câu có thể phát ra khoảng 10.000 đáp ứng trước khi tắt dần hầu như hoàn toàn dưới một số lịch trình ngắt quãng.
  loai: phat-hien
  nguon:
  - skinner1953
  trich: Under some schedules of intermittent reinforcement as many as 10,000 responses may appear in the behavior of a pigeon before extinction is substantially complete.
  vi_tri: Science and Human Behavior, chương V
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Chuột được thưởng lúc có lúc không tiếp tục ấn cần rất lâu sau khi thức ăn ngừng hẳn; chuột quen được thưởng mỗi lần thì bỏ cuộc nhanh" (loài và cặp so sánh không nguồn). Mới theo Skinner 1953 (bồ câu).'
- id: n25
  cau: Thưởng liên tục là cách nhanh nhất để dạy hành vi mới; sau khi hành vi được dạy thì thường chuyển sang củng cố ngắt quãng.
  loai: loi-khuyen
  nguon:
  - openstax2e
  trich: This reinforcement schedule is the quickest way to teach someone a behavior
  vi_tri: OpenStax 6.3
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "muốn dạy hành vi mới nhanh nhất thì nên thưởng liên tục lúc đầu, rồi chuyển dần sang ngắt quãng để khóa thói quen" ("khóa" bỏ).'
- id: n26
  cau: 'Skinner (1948): bồ câu đói (giảm còn 75% cân nặng) được ăn theo đồng hồ (ví dụ 15 giây một lần) bất kể hành vi.'
  loai: phat-hien
  nguon:
  - skinner1948
  trich: A pigeon is brought to a stable state of hunger by reducing it to 75 percent of its weight when well fed.
  vi_tri: Skinner 1948, tr. 168; "Fifteen sec. is a very effective interval"
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "cứ 15 giây một lần" như điều kiện chung; bài nói khoảng 15 giây là hiệu quả, có thể kéo dài tới 1–2 phút khi hành vi đã hình thành.'
- id: n27
  cau: Ở 6 trong 8 con, một động tác lặp lại rõ rệt xuất hiện.
  loai: so-lieu
  nguon:
  - skinner1948
