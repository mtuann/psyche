nhan_dinh:
  - id: n1
    cau: B. F. Skinner cho chuột ấn cần gạt trong buồng thí nghiệm và phát hiện lịch trình thưởng ảnh hưởng đến hành vi (Ferster & Skinner 1957).
    loai: phat-hien
    nguon:
      - ferster1957
      - openstax2e
    trich: By the manipulation of schedules, a wide range of changes in behavior can be produced
    vi_tri: Lời nói đầu của Ferster & Skinner; OpenStax 6.3
    ket_qua: da-sua
    ghi_chu: 'Câu mô tả (description). Chữ cũ: "phát hiện lịch trình thưởng quyết định sức bền của hành vi"; mạnh hơn: nguồn nói lịch trình tạo ra nhiều thay đổi hành vi. Mới: "tạo ra những mẫu hình hành vi khác nhau"; "buồng thao tác" đổi thành "buồng thí nghiệm"; "ý chí tự do" đổi thành "quyết định luận" (xem nhận định về nhãn Đang tranh cãi). Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích: mô tả khớp lời giới thiệu và OpenStax; "chuột" khớp sách 1938.'
    luot_2: dung
    luot_2_nguon: [ "https://www.bfskinner.org/wp-content/uploads/2015/05/Schedules_of_Reinforcement_PDF.pdf" ]
    luot_2_ghi_chu: "Ghi chú: sách ghi chủ yếu bồ câu, ngoài ra có chuột; Skinner khởi đầu với chuột (1938)."
    review: dung
  - id: n2
    cau: 'Khi bạn ngừng thưởng, hành vi được củng cố ngắt quãng (nhất là tỉ lệ biến đổi) bền hơn khi thưởng mỗi lần: Skinner (1953) viết rằng sức bền khi tắt dần do củng cố ngắt quãng "có thể lớn hơn nhiều" so với cùng số lần thưởng cho các đáp ứng liên tiếp.'
    loai: phat-hien
    nguon:
      - skinner1953
    trich: the resistance to extinction generated by intermittent reinforcement may be much greater than if the same number of reinforcements are given for consecutive responses
    vi_tri: Science and Human Behavior, chương V (đoạn về extinction)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ (đáp án thu gọn): "bền bỉ hơn hẳn ... một trong những phát hiện vững chắc nhất của Skinner và Ferster". Mới theo Skinner 1953: "may be much greater". Không còn gán cho Ferster & Skinner 1957 (không tìm thấy câu tương ứng trong phần đã đọc). Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích: khớp câu của Skinner 1953 (đã đọc toàn văn chương V); đáp án có "có thể".'
    luot_2: dung
    luot_2_nguon: [ "https://www.bfskinner.org/wp-content/uploads/2015/05/Schedules_of_Reinforcement_PDF.pdf", "https://openstax.org/books/psychology-2e/pages/6-3-operant-conditioning" ]
    luot_2_ghi_chu: 'Ý chính đúng (sức bền tắt dần cao hơn với củng cố ngắt quãng; OpenStax: tỉ lệ biến đổi mạnh nhất). Câu trích nguyên văn từ Skinner 1953 "có thể lớn hơn nhiều" chưa mở được toàn văn Science and Human Behavior (archive.org hạn chế).'
    review: dung
  - id: n3
    cau: Skinner (1953) nhận xét máy đánh bạc trả thưởng theo lịch trình tỉ lệ biến đổi.
    loai: phat-hien
    nguon:
      - skinner1953
    trich: Slot machines, roulette wheels, dice cages, horse races, and so on pay off on a schedule of variable-ratio reinforcement.
    vi_tri: Science and Human Behavior (đoạn về gambling)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Cũng là lý do máy đánh bạc gây nghiện đến vậy": khẳng định nhân quả không có nguồn; OpenStax nêu nghiên cứu gần đây trên chuột không ủng hộ ý Skinner rằng riêng lịch trình VR gây cờ bạc bệnh lý (Laskowski và cộng sự 2019: chưa mở bài gốc). Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích: đã đọc Skinner 1953: "Slot machines, roulette wheels … pay off on a schedule of variable-ratio reinforcement"; trang không còn nói máy đánh bạc "gây nghiện" mà chỉ nêu OpenStax về chuột (n4).'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/6-3-operant-conditioning" ]
    luot_2_ghi_chu: OpenStax ví dụ đánh bạc; nhận xét máy đánh bạc của Skinner 1953 là kiến thức chuẩn, chưa mở được sách.
    review: dung
  - id: n4
    cau: Nghiên cứu gần đây trên chuột không ủng hộ ý của Skinner rằng riêng lịch trình tỉ lệ biến đổi gây cờ bạc bệnh lý (theo OpenStax, dẫn Laskowski và cộng sự 2019).
    loai: tai-lap
    nguon:
      - openstax2e
    trich: Recent research in rats has failed to support Skinner’s idea that training on variable-ratio schedules alone causes pathological gambling
    vi_tri: OpenStax 6.3, hộp "Gambling and the Brain"
    ket_qua: dung
    ghi_chu: Nguồn bậc 2 (giáo trình); bài gốc Laskowski 2019 chưa mở.
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/6-3-operant-conditioning" ]
  - id: n5
    cau: Khác với chó của Pavlov học "âm thanh báo hiệu thức ăn", con vật của Skinner học "làm gì thì được gì".
    loai: dinh-nghia
    nguon:
      - openstax2e
    trich: Skinner believed that behavior is motivated by the consequences we receive for the behavior
    vi_tri: OpenStax 6.3
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/6-3-operant-conditioning", "https://psychclassics.yorku.ca/Pavlov/lecture2.htm" ]
    luot_2_ghi_chu: "Hai dạng học: cổ điển (tín hiệu) và thao tác (hậu quả); khẳng định giản lược nhưng đúng."
  - id: n6
    cau: Một hành vi tự phát, một khi được thưởng, sẽ xuất hiện thường xuyên hơn (hành vi thao tác).
    loai: dinh-nghia
    nguon:
      - openstax2e
      - skinner1938
    trich: At first, the rat might randomly hit the lever while exploring the box, and out would come a pellet of food. After eating the pellet, what do you think the hungry rat did next? It hit the lever again
    vi_tri: OpenStax 6.3
    ket_qua: dung
    ghi_chu: '"Operant" theo Skinner 1938: "An operant is an identifiable part of behavior" (chương I).'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/6-3-operant-conditioning" ]
    luot_2_ghi_chu: Định nghĩa điều kiện hóa thao tác.
  - id: n7
    cau: Lịch trình thưởng tạo ra những nhịp độ hành vi khác nhau và ảnh hưởng đến sức bền của hành vi khi thưởng ngừng.
    loai: phat-hien
    nguon:
      - ferster1957
      - openstax2e
    trich: The four reinforcement schedules yield different response patterns.
    vi_tri: Hình 6.13 OpenStax; Ferster & Skinner lời nói đầu
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "quyết định tốc độ học, nhịp độ hành vi và sức bền". "Quyết định tốc độ học": không thấy trong nguồn. Mới: "tạo ra nhịp độ khác nhau" và "ảnh hưởng đến sức bền" (Skinner 1953; OpenStax). Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích: khớp OpenStax Bảng 6.3 và Skinner 1953.'
    luot_2: dung
    luot_2_nguon: [ "https://www.bfskinner.org/wp-content/uploads/2015/05/Schedules_of_Reinforcement_PDF.pdf" ]
    luot_2_ghi_chu: "Schedules of Reinforcement (1957): mỗi lịch trình sinh nhịp hành vi riêng, và cường độ tắt dần khác nhau."
    review: dung
  - id: n8
    cau: Skinner bắt đầu chương trình nghiên cứu từ luận án tiến sĩ ở Harvard (1931); phần lớn các thí nghiệm trong sách 1938 làm khi là nghiên cứu viên ở Harvard.
    loai: lich-su
    nguon:
      - skinner1938
    trich: a thesis for the degree of doctor of philosophy at Harvard University in 1931
    vi_tri: Acknowledgments, The Behavior of Organisms (bản quét OCR)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(1904–1990) bắt đầu thí nghiệm khi còn là nghiên cứu sinh ở Harvard đầu thập niên 1930". Bỏ năm sinh/năm mất (chưa có nguồn đã mở). Mới theo lời cảm ơn: luận án 1931, phần lớn nghiên cứu khi là Fellow (National Research Council; Society of Fellows, Harvard). Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích: đã đọc lời cảm ơn sách 1938: luận án Harvard 1931, phần lớn nghiên cứu làm khi là Fellow NRC và Junior Fellow Harvard.'
    luot_2: dung
    luot_2_nguon: [ "https://www.gf.org/?p=14572" ]
    luot_2_ghi_chu: Skinner lấy tiến sĩ Harvard 1931, Junior Fellow Harvard 1933-36 (Guggenheim ghi tóm tắt lý lịch); sách 1938 tổng kết nghiên cứu đó.
    review: dung
  - id: n9
    cau: Thiết bị là buồng thí nghiệm, về sau được gọi là "buồng điều kiện hóa thao tác", quen gọi là "hộp Skinner"; trong sách 1938, chính Skinner gọi nó là "experimental box".
    loai: lich-su
    nguon:
      - openstax2e
      - skinner1938
    trich: He placed these animals inside an operant conditioning chamber, which has come to be known as a “Skinner box” ... the rat is placed in the experimental box (Skinner 1938)
    vi_tri: OpenStax 6.3
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chính ông gọi nó là buồng thao tác (operant chamber); hộp Skinner là biệt danh do người khác đặt" (cả ở phần ngộ nhận). Không tìm được câu của Skinner xác nhận tên; trong Skinner 1938 dùng "experimental box" (đã đọc, không có "operant chamber"/"Skinner box"); Ferster & Skinner 1957 dùng "experimental chamber". Review (Claude Sonnet 5.5, 30/10/2026): mục Ngộ nhận có vế "trong sách 1938, chính Skinner gọi là ''experimental box''" nhưng không nhận định nào chứa vế ấy. Đã đọc OCR sách 1938: "experimental box" 15 lần, không có "Skinner box". Đã thêm vào cau, nguon và trich của n9.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Skinner/Pigeon/", "https://www.bfskinner.org/wp-content/uploads/2015/05/Schedules_of_Reinforcement_PDF.pdf" ]
    luot_2_ghi_chu: Hộp Skinner, tên chính thức operant conditioning chamber.
    review: sai
  - id: n10
    cau: Chuột đói ấn một cần gạt để nhận viên thức ăn; chim bồ câu mổ một đĩa phím.
    loai: phat-hien
    nguon:
      - openstax2e
    trich: A Skinner box contains a lever (for rats) or disk (for pigeons) that the animal can press or peck for a food reward via the dispenser.
    vi_tri: OpenStax 6.3
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.bfskinner.org/wp-content/uploads/2015/05/Schedules_of_Reinforcement_PDF.pdf", "https://psychclassics.yorku.ca/Skinner/Pigeon/" ]
  - id: n11
    cau: Hành vi được ghi dưới dạng đường cong tích lũy theo thời gian; độ dốc cho biết tốc độ đáp ứng.
    loai: phat-hien
    nguon:
      - skinner1938
      - ferster1957
    trich: The cumulative record permits immediate inspection and estimation of rate
    vi_tri: lời giới thiệu 1997 (Morse & Dews) trong bản in lại Ferster & Skinner; Skinner 1938 dùng "cumulative curve"
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "một thiết bị ghi tích lũy vẽ đồ thị: mỗi đáp ứng nhích bút lên một nấc, nên độ dốc chính là tốc độ". Chi tiết "nhích bút lên một nấc" không kiểm được; bỏ. Trích là của lời giới thiệu 1997 (người viết sau), không phải văn bản 1957. Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích: khớp lời giới thiệu 1997 và cách mô tả đường cong tích lũy.'
    luot_2: dung
    luot_2_nguon: [ "https://www.bfskinner.org/wp-content/uploads/2015/05/Schedules_of_Reinforcement_PDF.pdf" ]
    luot_2_ghi_chu: Ferster & Skinner dùng đường cong tích lũy; độ dốc là tốc độ đáp ứng.
    review: dung
  - id: n12
    cau: Chuột đói học ấn cần để lấy thức ăn.
    loai: phat-hien
    nguon:
      - openstax2e
    trich: It hit the lever again, and received another pellet of food.
    vi_tri: OpenStax 6.3
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhanh chóng học" (bỏ "nhanh chóng"). Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích: đã bỏ "nhanh chóng".'
    luot_2: dung
    luot_2_nguon: [ "https://www.bfskinner.org/wp-content/uploads/2015/05/Schedules_of_Reinforcement_PDF.pdf" ]
    luot_2_ghi_chu: "Chuột đói ấn cần để lấy thức ăn: mô tả ở Ferster & Skinner (thí nghiệm có chuột)."
    review: dung
  - id: n13
    cau: Hành vi không chỉ phụ thuộc "có thưởng hay không" mà vào cách thưởng được sắp xếp (lịch trình).
    loai: phat-hien
    nguon:
      - ferster1957
    trich: It is now clear that far from being a mere falling-short of the ideal of inevitable reinforcement, intermittent reinforcement constitutes an important condition of action.
    vi_tri: Lời nói đầu (Foreword) của Ferster & Skinner
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "mà vào khi nào thưởng đến". Mới tổng quát hơn: "cách thưởng được sắp xếp". Review (Claude Sonnet 5.5, 30/10/2026): đã so chữ cuối trên trang với trích: khớp luận điểm sách 1957 ("intermittent reinforcement constitutes an important condition of action").'
    luot_2: dung
    luot_2_nguon: [ "https://www.bfskinner.org/wp-content/uploads/2015/05/Schedules_of_Reinforcement_PDF.pdf" ]
    luot_2_ghi_chu: Chức năng của lịch trình thưởng là luận điểm của sách 1957.
    review: dung
  - id: n14
    cau: Skinner công bố The Behavior of Organisms (1938, Appleton-Century) khi là trợ lý giáo sư (assistant professor) ở Đại học Minnesota, tổng kết nghiên cứu đã làm từ Harvard.
    loai: lich-su
    nguon:
      - skinner1938
    trich: ASSISTANT PROFESSOR OF PSYCHOLOGY UNIVERSITY OF MINNESOTA
    vi_tri: trang tựa
    ket_qua: da-sua
    ghi_chu: 'Trang tựa ghi "Assistant Professor of Psychology, University of Minnesota"; "tổng kết nghiên cứu từ Harvard" theo lời cảm ơn. Review (Claude Sonnet 5.5, 30/10/2026): lượt 2 đúng: trang tựa sách 1938 (Internet Archive, đã đọc OCR) ghi "ASSISTANT PROFESSOR OF PSYCHOLOGY, UNIVERSITY OF MINNESOTA", nên "phó giáo sư" (associate professor) sai. Chữ cũ: "khi ông là phó giáo sư ở Đại học Minnesota". Chữ mới: "khi ông là trợ lý giáo sư (assistant professor) ở Đại học Minnesota". Lời cảm ơn ghi phần lớn nghiên cứu làm khi là Fellow (NRC, Society of Fellows, Harvard): khớp.'
    luot_2: sai
