    ly_do: 'Hai quan điểm (Skinner, các nhà tâm lý học nhận thức) còn tranh luận; vấn đề chủ yếu là diễn giải, không phải dữ liệu lịch trình. Opus xét lại: giữ Đang tranh cãi. Không đổi lại Đã bị bác bỏ: khẳng định "mọi hành vi" là diễn giải lý thuyết, không có chuỗi kiểm tra trực tiếp liên tục thất bại như thước đo đòi.'
