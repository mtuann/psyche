    ly_do: 'Nguyên lý học tập cơ bản (lời giao: xét bằng chứng tích lũy): củng cố là kiến thức nền của giáo trình, được mô tả trên nhiều loài trong hàng chục năm (Ferster & Skinner 1957 và về sau); ở người có phân tích tổng hợp 47 so sánh có nhóm đối chứng về cách điều trị dựa trên phần thưởng có điều kiện, hiệu quả dương (Prendergast 2006, d = 0,42). Không có thất bại tái lập lớn của nguyên lý. Phần "mẫu hình lịch trình" được thu hẹp vào động vật thí nghiệm vì dữ liệu chủ yếu là động vật. Đạt Vững chắc (mục 4).'
    ket_qua: da-sua
    ghi_chu: 'chỗ khó (Opus): lượt 1 hạ Vững chắc của site cũ xuống Khá vững vì chưa có phân tích tổng hợp. Opus nâng lại Vững chắc với căn cứ mới (Prendergast 2006) và thu hẹp tên khung. Chữ lượt 1: ":::kha-vung[hậu quả làm thay đổi xác suất hành vi, và các lịch trình củng cố tạo ra mẫu hình ổn định] … Trang này chưa dẫn được phân tích tổng hợp hay tái lập độc lập… nên dừng ở khá vững." Mới: ":::vung-chac[hậu quả làm thay đổi xác suất hành vi; ở động vật thí nghiệm, các lịch trình củng cố tạo ra mẫu hình ổn định]", thêm câu Prendergast (n59). Lượt 2 xem: hiệu quả d giảm theo thời gian sau điều trị (tóm tắt); trang chỉ nói hiệu quả trung bình.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1360-0443.2006.01581.x", "https://www.bfskinner.org/wp-content/uploads/2015/05/Schedules_of_Reinforcement_PDF.pdf" ]
    luot_2_ghi_chu: "Nhãn Vững chắc hợp: mẫu hình lịch trình ổn định, lặp lại nhiều loài (sách 1957), và phân tích tổng hợp ở người (Prendergast 2006). Không có thất bại tái lập lớn cho nguyên lý hậu quả."
