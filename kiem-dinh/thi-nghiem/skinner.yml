  - id: n51
    cau: 'Quiz 2: VR cho tốc độ cao, đều, khó tắt dần nhất; FI cho tốc độ vừa phải, với quãng nghỉ sau mỗi lần thưởng; củng cố liên tục giúp học nhanh.'
    loai: phat-hien
    nguon:
      - openstax2e
    trich: Fixed interval ... Moderate response rate with significant pauses after reinforcement (OpenStax, Bảng 6.3); continuous reinforcement ... is the quickest way to teach someone a behavior; Among the reinforcement schedules, variable ratio is the most productive and the most resistant to extinction.
    vi_tri: OpenStax 6.3
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Củng cố liên tục giúp học nhanh nhưng tắt nhanh nhất khi thưởng biến mất" ("nhanh nhất": không nguồn; OpenStax nói FI dễ tắt dần nhất). Phương án nhiễu "khoảng cố định thưởng theo giờ giấc đều đặn" không còn đúng/sai nghi vấn. Review (Claude Sonnet 5.5, 30/10/2026): lượt 2 qua-manh vì "FI dễ tắt dần nhất". OpenStax 6.3 có câu "Fixed interval is the least productive and the easiest to extinguish" (đã đọc) nhưng không nguồn nào khác (Skinner 1953, Ferster & Skinner) xếp thứ tự tắt dần của FI so với FR, và củng cố liên tục mới thường tắt nhanh nhất; thứ tự phụ thuộc thông số. Đã bỏ "dễ tắt dần nhất" khỏi lời giải thích câu 2 ("…FI cho tốc độ vừa phải, với quãng nghỉ sau mỗi lần thưởng") và khỏi khung Khá vững ("theo giáo trình mở, tỉ lệ biến đổi khó tắt dần nhất"). Chữ cũ: "FI cho tốc độ vừa phải và dễ tắt dần nhất". Giữ VR "khó tắt dần nhất" (OpenStax và Skinner 1953: "great resistance to extinction").'
    luot_2: qua-manh
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/6-3-operant-conditioning", "https://www.bfskinner.org/wp-content/uploads/2015/05/Schedules_of_Reinforcement_PDF.pdf" ]
    luot_2_ghi_chu: 'câu đúng: VR cho tốc độ cao, đều, khó tắt dần nhất; FI cho tốc độ vừa phải với nghỉ sau thưởng, và các lịch trình cố định (FR, FI) thường tắt dần nhanh hơn lịch trình biến đổi; củng cố liên tục giúp học nhanh.; Ý "VR khó tắt dần nhất", "củng cố liên tục dạy nhanh nhất", FI "vừa phải" đúng. Nhưng "FI dễ tắt dần nhất" không được nguồn nào xác nhận: củng cố liên tục mới thường tắt nhanh nhất, và thứ tự giữa FI và FR phụ thuộc thông số.'
    review: sai
