    trich: Mowrer argued that as a result of Pavlovian fear conditioning (first factor) ... during the instrumental phase (second factor), escape responses that are emitted in the presence of the antecedent stimulus will be negatively reinforced by fear reduction ... To sum up, although influential, the two-factor theory of Mowrer proves unable to account for a series of experimental results and clinical observations.
    vi_tri: mục "Two-factor theory" và "Criticism of the two-factor theory" (toàn văn Europe PMC)
    ket_qua: da-sua
    ghi_chu: 'Opus: mở được tổng quan toàn văn. Chữ cũ: "Thuyết hai yếu tố của Mowrer (về sau): nỗi sợ được học qua điều kiện hóa cổ điển, nhưng được duy trì vì hành vi né tránh giúp ta thoát cảm giác sợ — một vòng lặp tự củng cố." Mới: thêm năm (Mowrer, 1951, theo Krypotos), diễn đạt theo tổng quan, bỏ "vòng lặp tự củng cố", thêm vế "nhiều kết quả mà nó không giải thích được" cho khỏi trình bày như điều đã chắc. Thêm Krypotos 2015 vào mục Nguồn. Không phải lời khuyên điều trị. Review (Claude Opus 5.5, 30/10/2026): đối chiếu trích Krypotos 2015 (toàn văn Europe PMC, PMC4508580) trong hồ sơ; Mowrer 1951 theo Krypotos; câu kèm "nhiều kết quả mà nó không giải thích được".'
