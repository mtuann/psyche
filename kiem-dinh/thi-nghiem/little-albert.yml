  - id: n22
    cau: 'Buổi 4 (11 tháng 20 ngày): phản ứng với chuột yếu hơn nên các tác giả ghép đôi chuột với tiếng động để "làm mới"; lần đầu thỏ và chó cũng được ghép trực tiếp với tiếng động; sau đó bé được chuyển sang phòng giảng lớn, sáng hơn, có bốn người, và phản ứng với chuột và thỏ yếu hơn.'
    loai: phat-hien
    nguon:
      - watson1920
    trich: It was thought best to freshen up the reaction by another joint stimulation. ... The situation was thus very different from that which obtained in the small dark room. ... Rabbit alone. Fear reaction slight.
    vi_tri: Mục II
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chuyển sang phòng mới, làm mới nỗi sợ bằng vài lần ghép đôi nữa; thỏ và chó ghép trực tiếp". Mới thêm thứ tự: làm mới ở phòng cũ, rồi mới sang phòng giảng. Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); buổi 11 tháng 20 ngày: "freshen up the reaction"; ở phòng giảng "Rabbit alone. Fear reaction slight".'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Watson/emotion.htm" ]
    luot_2_ghi_chu: Ở phòng giảng, lần đưa đầu chuột 'no sudden fear reaction', thỏ 'slight'; về sau trong cùng buổi phản ứng với thỏ lại 'pronounced'. Câu đúng cho các lần đầu ở phòng giảng.
    review: dung
  - id: n23
    cau: 'Sự cố ngoài kịch bản ở buổi 4: con chó vốn im lặng bỗng sủa ba lần sát mặt bé làm bé òa khóc, và làm cả người lớn có mặt giật mình.'
    loai: lich-su
    nguon:
      - watson1920
    trich: the dog, which had not barked before, barked three times loudly when only about six inches from the baby's face. Albert immediately fell over and broke into a wail that continued until the dog was removed. The sudden barking of the hitherto quiet dog produced a marked fear response in the adult observers!
    vi_tri: Mục II
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "một con chó sủa ầm ĩ làm cả Albert lẫn người lớn giật mình"; mới theo bài. Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); "barked three times loudly … marked fear response in the adult observers!".'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Watson/emotion.htm" ]
    review: dung
  - id: n24
    cau: "Buổi 5 (1 tuổi 21 ngày, 31 ngày sau; suốt thời gian ấy bé ở nhà trẻ bệnh viện và không có thử nghiệm cảm xúc): phản ứng yếu đi phần nào nhưng bé vẫn né mặt nạ, áo lông, thỏ, chó; với chuột thì bé rụt tay, ngả người ra xa, quấy, rồi lấy hai tay che mắt khi chuột bò lên ngực."
    loai: phat-hien
    nguon:
      - watson1920
    trich: Rat then touched his hand. Albert withdrew it immediately, then leaned back as far as possible but did not cry. When the rat was placed on his arm he withdrew his body and began to fret, nodding his head. The rat was then allowed to crawl against his chest. He first began to fret and then covered his eyes with both hands.
    vi_tri: Mục III, buổi 1 Year 21 Days
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(12 tháng 21 ngày, sau một tháng)". "1 Year 21 Days" tức 12 tháng 21 ngày (đúng); đổi cách viết cho khớp nguồn. Chữ cũ nói "né chuột, thỏ, chó, áo lông": mới nói rõ chuột chỉ rụt tay/nhăn mặt/che mắt khi chạm. Review (Claude Opus 5.5, 30/10/2026): sai (lượt 2 đúng): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); ở buổi 5 bài không tả bé "nhăn mặt" với chuột; "puckered up his face" là phản ứng với thỏ ở cùng buổi. Chữ cũ "với chuột thì rụt tay, nhăn mặt, che mắt bằng hai tay khi chuột bò lên ngực" → "còn với chuột thì bé rụt tay, ngả người ra xa, quấy, rồi lấy hai tay che mắt khi chuột bò lên ngực".'
    luot_2: sai
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Watson/emotion.htm" ]
    luot_2_ghi_chu: "câu đúng: Buổi 5 (1 tuổi 21 ngày, 31 ngày sau; suốt thời gian ấy bé ở nhà trẻ bệnh viện và không có thử nghiệm cảm xúc): phản ứng yếu đi phần nào nhưng bé vẫn né mặt nạ, áo lông, thỏ, chó; với chuột thì rụt tay, ngả người ra xa, quấy và lấy hai tay che mắt khi chuột bò lên ngực.; Bài gốc không tả bé 'nhăn mặt' với chuột (chỉ rụt tay, ngả ra sau, 'fret', che mắt); 'puckered up his face' là với thỏ. Phần còn lại đúng."
    review: sai
