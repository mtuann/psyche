    cau: 'Thuyết hai yếu tố của Mowrer (1951): nỗi sợ được học qua điều kiện hóa cổ điển (yếu tố thứ nhất), rồi hành vi né tránh được củng cố vì nó làm giảm nỗi sợ (yếu tố thứ hai); tổng quan của Krypotos và cộng sự (2015) kể lại thuyết này và nêu nhiều kết quả thí nghiệm mà nó không giải thích được.'
