nhan_dinh:
  - id: n1
    cau: Watson và Rayner (1920) báo cáo đã điều kiện hóa nỗi sợ chuột trắng ở một bé trai 11 tháng tuổi bằng cách ghép chuột với tiếng động lớn, và không gỡ nỗi sợ ấy trước khi bé rời bệnh viện.
    loai: phat-hien
    nguon:
      - watson1920
    trich: The present authors present their experimental findings of conditioned fear responses in a male infant beginning at 11 months of age.
    vi_tri: Abstract (OpenAlex) và toàn văn; "Albert was taken from the hospital the day the above tests were made" (mục IV)
    ket_qua: da-sua
    ghi_chu: 'Câu mô tả (description). Chữ cũ: "đã dạy ... sợ chuột trắng ... và không bao giờ gỡ bỏ nỗi sợ đó; ... một trong những vi phạm đạo đức nghiêm trọng nhất của tâm lý học". Mới: "báo cáo đã", "không gỡ ... trước khi bé rời bệnh viện" và thêm điều phân tích đoạn phim 2021. "Vi phạm nghiêm trọng nhất" là đánh giá không nguồn, bỏ; thay bằng điều chính tác giả viết (n8). Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); "báo cáo đã" đúng mức; không gỡ vì bé rời bệnh viện (mục IV).'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Watson/emotion.htm" ]
    review: dung
  - id: n2
    cau: Một phân tích đoạn phim năm 2021 cho rằng bằng chứng điều kiện hóa yếu hơn giáo trình vẫn kể.
    loai: phat-hien
    nguon:
      - powell2021
    trich: Our findings concur with the view that Watson and Rayner's conditioning procedure was largely ineffective, and that the relatively weak signs of distress that Albert does display in the film can be readily accounted for by such factors as sensitization and maturational influences.
    vi_tri: Abstract
    ket_qua: da-sua
    ghi_chu: 'Câu thêm mới vào mô tả và đáp án (chữ cũ không nói). Chỉ đọc tóm tắt. Review (Claude Opus 5.5, 30/10/2026): tóm tắt Powell & Schmaltz 2021 (trích trong hồ sơ, lượt 2 đọc lại ở PubMed): "largely ineffective"; câu trên trang đúng mức.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/33090820/" ]
    luot_2_ghi_chu: Bài đăng trực tuyến 10/2020, số in 2021 (History of Psychology 24(2)); đọc tóm tắt ở PubMed.
    review: dung
  - id: n3
    cau: Bé trai 11 tháng tuổi, khỏe mạnh, tính tình bình thản, chẳng sợ gì; cứ mỗi lần đưa tay chạm vào con chuột thì thanh thép bị đập mạnh ngay sau lưng; bé giật mình, ngã người về phía trước.
    loai: phat-hien
    nguon:
      - watson1920
    trich: He began to reach for rat with left hand. Just as his hand touched the animal the bar was struck immediately behind his head. The infant jumped violently and fell forward, burying his face in the mattress.
    vi_tri: Mục I, buổi 11 tháng 3 ngày
    ket_qua: da-sua
    ghi_chu: 'gia-dinh: đoạn "Tự trải nghiệm" là tình huống minh họa theo bài. Chữ cũ: "Bé thích nghịch một con chuột trắng ... giật mình khóc thét"; mới: "tò mò", "giật mình, ngã người về phía trước". Lý do: bài ghi lần đầu bé không khóc; "thích chuột" không có trong bài ("manipulation was the most usual reaction"). Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); gia-dinh; bài gốc ghi buổi 1 "the bar was struck immediately behind his head", lúc thử ban đầu "stationed back of the child"; "sau lưng" trong tình huống minh họa không trái nhận định nào.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Watson/emotion.htm" ]
    luot_2_ghi_chu: Bài gốc ghi 'sau đầu' (behind his head); 'cứ mỗi lần chạm' đúng cho buổi 1, các lần ghép ở buổi sau không tả là lúc chạm. Chi tiết nhỏ, không đổi ý.
    review: dung
  - id: n4
    cau: 'Đáp án nhanh: sau 2 lần ghép đôi Albert có phản ứng né chuột nhẹ; một tuần sau, thêm 5 lần ghép đôi (tổng cộng 7), bé khóc và bò đi xa ngay khi thấy chuột, không cần tiếng động.'
    loai: phat-hien
    nguon:
      - watson1920
    trich: In all seven joint stimulations were given to bring about the complete reaction.
    vi_tri: Mục I, sau buổi 11 tháng 10 ngày
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chỉ 2 lần ghép đôi, Albert đã bắt đầu sợ chuột trắng ... nỗi sợ dữ dội"; mới thêm "Theo Watson và Rayner" và "né nhẹ". Lý do: sau 2 lần ghép đôi bài chỉ ghi bé rụt tay khi chuột chạm tay ("the two joint stimulations given the previous week were not without effect"), không ghi "sợ". Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); "In all seven joint stimulations…"; "né nhẹ" đúng mức "not without effect".'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Watson/emotion.htm" ]
    review: dung
  - id: n5
    cau: Phản ứng né lan sang thỏ, chó, áo lông hải cẩu và mặt nạ ông già Noel.
    loai: phat-hien
    nguon:
      - watson1920
    trich: Rabbit alone ... He leaned as far away from the animal as possible, whimpered, then burst into tears. ... Fur coat (seal). Withdrew immediately to the left side and began to fret ... He was again pronouncedly negative [Santa Claus mask].
    vi_tri: Mục II, buổi 11 tháng 15 ngày
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "lan sang thỏ, chó, áo lông thú, thậm chí cả mặt nạ râu tóc"; mới: "áo lông hải cẩu", "mặt nạ ông già Noel" theo bài. Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); mục II.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Watson/emotion.htm" ]
    luot_2_ghi_chu: Bài gốc còn kể bông gòn (nhẹ hơn) và tóc của Watson.
    review: dung
  - id: n6
    cau: Họ không có dịp gỡ nỗi sợ ấy vì Albert rời bệnh viện.
    loai: lich-su
    nguon:
      - watson1920
    trich: Unfortunately Albert was taken from the hospital the day the above tests were made. Hence the opportunity of building up an experimental technique by means of which we could remove the conditioned emotional responses was denied us.
    vi_tri: Mục IV
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "không bao giờ gỡ nó cho bé". Mới: nêu lý do theo bài. Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); mục IV.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Watson/emotion.htm" ]
    review: dung
  - id: n7
    cau: Phân tích đoạn phim năm 2021 cho rằng quy trình điều kiện hóa phần lớn không hiệu quả; dấu hiệu khó chịu yếu của bé có thể giải thích bằng nhạy cảm hóa và sự trưởng thành.
    loai: phat-hien
    nguon:
      - powell2021
    trich: Our findings concur with the view that Watson and Rayner's conditioning procedure was largely ineffective ... sensitization and maturational influences
    vi_tri: Abstract
    ket_qua: da-sua
    ghi_chu: 'Câu thêm mới. chỗ khó: chỉ đọc tóm tắt; kết luận về điều kiện hóa ở Albert là của một nhóm (Powell, Schmaltz), chưa có nguồn khác đối chiếu. Review (Claude Opus 5.5, 30/10/2026): tóm tắt Powell & Schmaltz 2021 (trích trong hồ sơ, lượt 2 đọc lại ở PubMed): khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/33090820/" ]
    luot_2_ghi_chu: Tóm tắt ở PubMed.
    review: dung
  - id: n8
    cau: Thí nghiệm của Watson và Rayner là một nỗ lực thực nghiệm sớm nhằm kiểm tra giả thuyết rằng cảm xúc sợ hãi có thể được điều kiện hóa ở người; giả thuyết đã được họ và Morgan nêu từ 1917 mà thiếu bằng chứng thực nghiệm đủ.
    loai: lich-su
    nguon:
      - watson1920
    trich: These authors without adequate experimental evidence advanced the view that this range was increased by means of conditioned reflex factors.
    vi_tri: Mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "minh chứng trực tiếp đầu tiên cho thấy cảm xúc sợ hãi có thể được điều kiện hóa ở người". Bỏ "đầu tiên", "minh chứng" (khẳng định chưa kiểm được và bị Powell & Schmaltz 2021 phản biện). Bài viết cũng ghi "A certain responsibility attaches to such a procedure" (n11). Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); mở bài (Watson & Morgan 1917 "without adequate experimental evidence").'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Watson/emotion.htm" ]
    luot_2_ghi_chu: Watson và Morgan 1917, American Journal of Psychology (chú thích 1 của bài).
    review: dung
  - id: n9
    cau: 'Mô hình điều kiện hóa cổ điển: chuột trắng (kích thích trung tính) ghép với tiếng động lớn (không điều kiện) gây giật mình; sau các lần ghép đôi, chuột một mình gây phản ứng sợ (kích thích có điều kiện).'
    loai: dinh-nghia
    nguon:
      - watson1920
    trich: Can we condition fear of an animal, e.g., a white rat, by visually presenting it and simultaneously striking a steel bar?
    vi_tri: Mục I
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "→ tiếng động một mình đã đủ gây sợ... Sau vài lần lặp lại"; mới nói "Theo mô hình ấy", "sau các lần ghép đôi" (không "vài lần"). Cũng nêu Pavlov dùng phản xạ tiết nước bọt ở chó: nguồn là trang Pavlov, không kiểm lại ở đây (link về trang nhà Pavlov đã kiểm ở phần 1). Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); định nghĩa khớp quy trình; ghi rõ "Theo mô hình ấy".'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Watson/emotion.htm" ]
    luot_2_ghi_chu: Định nghĩa chuẩn của điều kiện hóa cổ điển; khớp quy trình trong bài gốc.
    review: dung
  - id: n10
    cau: Bài báo là một trong những nghiên cứu được trích dẫn nhiều nhất trong tâm lý học, thường được trình bày như bằng chứng cho vai trò của điều kiện hóa cổ điển trong sự hình thành nỗi sợ.
    loai: lich-su
    nguon:
      - powell2021
    trich: Watson and Rayner's (1920) attempt to condition a fear of furry animals and objects in an 11-month-old infant is one of the most widely cited studies in psychology. Known as the Little Albert study, it is typically presented as evidence for the role of classical conditioning in fear development.
    vi_tri: Abstract
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "bài báo này xuất hiện trong mọi giáo trình tâm lý học — vừa như một cột mốc khoa học, vừa như một lời cảnh báo đạo đức". Bỏ "mọi giáo trình"; thay bằng điều Powell & Schmaltz nói. Review (Claude Opus 5.5, 30/10/2026): tóm tắt Powell & Schmaltz 2021 (trích trong hồ sơ, lượt 2 đọc lại ở PubMed): "one of the most widely cited studies … typically presented as evidence".'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/33090820/" ]
    review: dung
  - id: n11
    cau: Bé rời bệnh viện mà nỗi sợ chưa được gỡ; chính các tác giả viết rằng họ do dự vì việc gây sợ thực nghiệm "mang một trách nhiệm nhất định".
    loai: lich-su
    nguon:
      - watson1920
    trich: At first there was considerable hesitation upon our part in making the attempt to set up fear reactions experimentally. A certain responsibility attaches to such a procedure.
    vi_tri: Mục I
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nỗi sợ được tạo ra không bao giờ được xóa bỏ". Mới: theo bài (không có thủ thuật giải điều kiện hóa); thêm lời tác giả. Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); mục I ("A certain responsibility attaches to such a procedure").'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Watson/emotion.htm" ]
    review: dung
  - id: n12
    cau: '"Albert B." là con của một vú nuôi tại Harriet Lane Home for Invalid Children, được nuôi gần như từ lúc mới sinh trong môi trường bệnh viện.'
    loai: lich-su
    nguon:
      - watson1920
    trich: This infant was reared almost from birth in a hospital environment; his mother was a wet nurse in the Harriet Lane Home for Invalid Children.
    vi_tri: Mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhà trẻ bệnh viện Harriet Lane (thuộc Đại học Johns Hopkins, Baltimore, Mỹ)". Bỏ "Johns Hopkins, Baltimore" (bài không nói; chưa mở nguồn khác); mô tả "Home for Invalid Children" là nhà dành cho trẻ em bệnh. Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); mở bài.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Watson/emotion.htm" ]
    review: dung
  - id: n13
    cau: Bài báo mô tả bé khỏe mạnh từ lúc sinh, phát triển tốt, tính tình điềm tĩnh, ít biểu lộ cảm xúc; sự ổn định là một lý do chọn bé, và các tác giả cho rằng có thể gây tương đối ít hại.
    loai: lich-su
    nguon:
      - watson1920
    trich: He was on the whole stolid and unemotional. His stability was one of the principal reasons for using him as a subject in this test. We felt that we could do him relatively little harm
    vi_tri: Mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Watson mô tả ... họ tự trấn an rằng thí nghiệm không gây hại đáng kể". Mới: "tương đối ít hại" (relatively little harm); "bài báo mô tả" thay "Watson mô tả" (hai tác giả ký). Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); "stolid and unemotional … relatively little harm".'
