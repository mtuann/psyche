  - id: n31
    cau: Mary Cover Jones báo cáo một ca; chữ cũ cho rằng đó là "tiền thân của liệu pháp phơi nhiễm" và "minh chứng khoa học có thể tạo ra kiến thức mà không cần gây tổn thương vĩnh viễn".
    loai: lich-su
    nguon:
      - coverjones1924
    ket_qua: da-bo
    ghi_chu: 'Bỏ hai câu đánh giá: "tiền thân của liệu pháp phơi nhiễm" (không kiểm được bằng nguồn đã mở), "minh chứng ... không cần gây tổn thương" (đánh giá, không nguồn). Review (Claude Opus 5.5, 30/10/2026): đã kiểm trang thật: mục Jones (dòng 52) và giải thích câu hỏi 4 không còn "tiền thân của liệu pháp phơi nhiễm" hay "minh chứng … không cần gây tổn thương". Lượt 2 cho qua-manh với chữ cũ và ghi rõ: nếu trang đã bỏ thì việc bỏ là đúng. Bỏ đúng; không thêm câu "tiền thân" vì nguồn lượt 2 dẫn chỉ là nhan đề.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Jones/", "https://doi.org/10.1037/e735962011-004" ]
    luot_2_ghi_chu: "câu đúng: Mary Cover Jones báo cáo một ca (Peter); cách gỡ nỗi sợ của bà thường được xem là tiền thân của liệu pháp hành vi, trong đó có liệu pháp phơi nhiễm.; 'Một ca' và 'tiền thân' có cơ sở (Jones 1924; Jones được gọi là 'mother of behavior therapy', chỉ thấy tên bài, không đọc toàn văn). Vế 'minh chứng khoa học có thể tạo ra kiến thức mà không cần gây tổn thương vĩnh viễn' là lời đánh giá, không nguồn nào nói, và bài của Jones tự nhận chưa biết về nỗi sợ gốc và tương lai của Peter. Nếu trang chỉ ghi là chữ cũ đã bỏ thì việc bỏ là đúng."
    review: dung
