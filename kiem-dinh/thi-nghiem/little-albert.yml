    trich: The instant the rat was shown the baby began to cry. Almost instantly he turned sharply to the left, fell over on left side, raised himself on all fours and began to crawl away so rapidly that he was caught with difficulty before reaching the edge of the table.
    vi_tri: Mục I
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "bé khóc to, bò tránh xa"; mới theo bài, nêu rõ 7 lần ghép đôi (không phải "2 + 5" như hai buổi tách). Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); buổi 11 tháng 10 ngày, lượt 8.'
