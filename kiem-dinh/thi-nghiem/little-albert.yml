  - id: n28
    cau: Mary Cover Jones làm việc với sự cố vấn của Watson, gặp Peter, 2 tuổi 10 tháng, sợ chuột trắng, nỗi sợ lan sang thỏ, áo lông, lông vũ, bông gòn, khoảng ba năm sau Albert.
    loai: lich-su
    nguon:
      - coverjones1924
    trich: Peter was 2 years and 10 months old when we began to study him. He was afraid of a white rat, and this fear extended to a rabbit, a fur coat, a feather, cotton wool, etc.
    vi_tri: Bài Jones, mục "The case is a sequel..."; ghi chú 1
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Bốn năm sau, một nghiên cứu sinh của Watson ... bé Peter, 3 tuổi, sợ thỏ trắng". Bỏ "nghiên cứu sinh" (bài ghi bà làm với sự cố vấn của Watson; chức vụ không có), "bốn năm" (bài ghi "about three years later" tính từ ca Albert; bài Jones đăng 1924), "3 tuổi" (2 tuổi 10 tháng), "sợ thỏ trắng" (nỗi sợ ban đầu là chuột, lan sang thỏ). Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Jones 1924 (psychclassics.yorku.ca/Jones/) qua trích trong hồ sơ và kết quả lượt 2; "2 years and 10 months", nỗi sợ chuột lan sang thỏ, áo lông, lông vũ, bông gòn.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Jones/" ]
    review: dung
  - id: n29
    cau: 'Jones gỡ nỗi sợ thỏ bằng nhiều cách: Peter chơi cùng ba trẻ không sợ thỏ; sau khi Peter nằm viện hai tháng và sợ trở lại, bà thêm "điều kiện hóa trực tiếp" (cho ăn món ưa thích trong khi thỏ trong lồng được đưa lại gần từng chút).'
    loai: phat-hien
    nguon:
      - coverjones1924
    trich: At this point (b) we began another method of treatment, that of "direct conditioning." Peter was seated in a high chair and given food which he liked. The experimenter brought the rabbit in a wire cage as close as she could without arousing a response which would interfere with the eating.
    vi_tri: Bài Jones, trang 312–313
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "dùng phương pháp giải mẫn cảm dần dần: cho Peter ăn món yêu thích (kẹo, đồ chơi) trong khi con thỏ được đưa lại gần qua nhiều buổi". Bỏ "giải mẫn cảm" (không phải từ của bài), "đồ chơi" (bài ghi "food"; đoạn khác có "candy"), thêm cách chơi cùng trẻ khác. Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Jones 1924 (psychclassics.yorku.ca/Jones/) qua trích trong hồ sơ và kết quả lượt 2.'
