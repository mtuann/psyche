  - id: n15
    cau: 'Lúc 8 tháng 26 ngày, bé được thử với tiếng búa đập thanh thép treo sau lưng: giật mình mạnh, thở ngừng, môi run, và khóc ở lần đập thứ ba.'
    loai: phat-hien
    nguon:
      - watson1920
    trich: The child started violently, his breathing was checked and the arms were raised in a characteristic manner. On the second stimulation the same thing occurred, and in addition the lips began to pucker and tremble. On the third stimulation the child broke into a sudden crying fit.
    vi_tri: Mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chỉ có tiếng động lớn ... mới khiến bé giật mình, môi run và khóc. Tiếng động chính là vũ khí gây sợ"; bỏ "vũ khí" (diễn giải), thêm chi tiết theo bài. Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); "the other stationed back of the child, struck the steel bar": "treo sau lưng" khớp; giật mình, thở ngừng, môi run, khóc ở lần thứ ba khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Watson/emotion.htm" ]
