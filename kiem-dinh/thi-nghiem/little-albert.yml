    trich: Our own view, expressed above, which is possibly not very well grounded, is that these responses in the home environment are likely to persist indefinitely, unless an accidental method for removing them is hit upon.
    vi_tri: Mục IV
    ket_qua: da-sua
    ghi_chu: 'Câu thêm mới thay "Họ không bao giờ trả lời được câu hỏi của chính mình — vì đối tượng đã đi mất" (không có trong bài ở dạng ấy). Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); "possibly not very well grounded".'
