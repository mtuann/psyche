nhan_dinh:
- id: n1
  cau: Watson và Rayner (1920) báo cáo đã điều kiện hóa nỗi sợ chuột trắng ở một bé trai 11 tháng tuổi bằng cách ghép chuột với tiếng động lớn, và không gỡ nỗi sợ ấy trước khi bé rời bệnh viện.
  loai: phat-hien
  nguon:
  - watson1920
  trich: The present authors present their experimental findings of conditioned fear responses in a male infant beginning at 11 months of age.
  vi_tri: Abstract (OpenAlex) và toàn văn; "Albert was taken from the hospital the day the above tests were made" (mục IV)
  ket_qua: da-sua
  ghi_chu: 'Câu mô tả (description). Chữ cũ: "đã dạy ... sợ chuột trắng ... và không bao giờ gỡ bỏ nỗi sợ đó; ... một trong những vi phạm đạo đức nghiêm trọng nhất của tâm lý học". Mới: "báo cáo
    đã", "không gỡ ... trước khi bé rời bệnh viện" và thêm điều phân tích đoạn phim 2021. "Vi phạm nghiêm trọng nhất" là đánh giá không nguồn, bỏ; thay bằng điều chính tác giả viết (n8).'
- id: n2
  cau: Một phân tích đoạn phim năm 2021 cho rằng bằng chứng điều kiện hóa yếu hơn giáo trình vẫn kể.
  loai: phat-hien
  nguon:
  - powell2021
  trich: Our findings concur with the view that Watson and Rayner's conditioning procedure was largely ineffective, and that the relatively weak signs of distress that Albert does display in the
    film can be readily accounted for by such factors as sensitization and maturational influences.
  vi_tri: Abstract
  ket_qua: da-sua
  ghi_chu: Câu thêm mới vào mô tả và đáp án (chữ cũ không nói). Chỉ đọc tóm tắt.
- id: n3
  cau: Bé trai 11 tháng tuổi, khỏe mạnh, tính tình bình thản, chẳng sợ gì; cứ mỗi lần đưa tay chạm vào con chuột thì thanh thép bị đập mạnh ngay sau lưng; bé giật mình, ngã người về phía trước.
  loai: phat-hien
  nguon:
  - watson1920
  trich: He began to reach for rat with left hand. Just as his hand touched the animal the bar was struck immediately behind his head. The infant jumped violently and fell forward, burying his
    face in the mattress.
  vi_tri: Mục I, buổi 11 tháng 3 ngày
  ket_qua: da-sua
  ghi_chu: 'gia-dinh: đoạn "Tự trải nghiệm" là tình huống minh họa theo bài. Chữ cũ: "Bé thích nghịch một con chuột trắng ... giật mình khóc thét"; mới: "tò mò", "giật mình, ngã người về phía
    trước". Lý do: bài ghi lần đầu bé không khóc; "thích chuột" không có trong bài ("manipulation was the most usual reaction").'
- id: n4
  cau: 'Đáp án nhanh: sau 2 lần ghép đôi Albert có phản ứng né chuột nhẹ; một tuần sau, thêm 5 lần ghép đôi (tổng cộng 7), bé khóc và bò đi xa ngay khi thấy chuột, không cần tiếng động.'
  loai: phat-hien
  nguon:
  - watson1920
  trich: In all seven joint stimulations were given to bring about the complete reaction.
  vi_tri: Mục I, sau buổi 11 tháng 10 ngày
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Chỉ 2 lần ghép đôi, Albert đã bắt đầu sợ chuột trắng ... nỗi sợ dữ dội"; mới thêm "Theo Watson và Rayner" và "né nhẹ". Lý do: sau 2 lần ghép đôi bài chỉ ghi bé rụt tay khi
    chuột chạm tay ("the two joint stimulations given the previous week were not without effect"), không ghi "sợ".'
- id: n5
  cau: Phản ứng né lan sang thỏ, chó, áo lông hải cẩu và mặt nạ ông già Noel.
  loai: phat-hien
  nguon:
  - watson1920
  trich: Rabbit alone ... He leaned as far away from the animal as possible, whimpered, then burst into tears. ... Fur coat (seal). Withdrew immediately to the left side and began to fret ...
    He was again pronouncedly negative [Santa Claus mask].
  vi_tri: Mục II, buổi 11 tháng 15 ngày
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "lan sang thỏ, chó, áo lông thú, thậm chí cả mặt nạ râu tóc"; mới: "áo lông hải cẩu", "mặt nạ ông già Noel" theo bài.'
- id: n6
  cau: Họ không có dịp gỡ nỗi sợ ấy vì Albert rời bệnh viện.
  loai: lich-su
  nguon:
  - watson1920
  trich: Unfortunately Albert was taken from the hospital the day the above tests were made. Hence the opportunity of building up an experimental technique by means of which we could remove the
    conditioned emotional responses was denied us.
  vi_tri: Mục IV
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "không bao giờ gỡ nó cho bé". Mới: nêu lý do theo bài.'
- id: n7
  cau: Phân tích đoạn phim năm 2021 cho rằng quy trình điều kiện hóa phần lớn không hiệu quả; dấu hiệu khó chịu yếu của bé có thể giải thích bằng nhạy cảm hóa và sự trưởng thành.
  loai: phat-hien
  nguon:
  - powell2021
  trich: Our findings concur with the view that Watson and Rayner's conditioning procedure was largely ineffective ... sensitization and maturational influences
  vi_tri: Abstract
  ket_qua: da-sua
  ghi_chu: 'Câu thêm mới. chỗ khó: chỉ đọc tóm tắt; kết luận về điều kiện hóa ở Albert là của một nhóm (Powell, Schmaltz), chưa có nguồn khác đối chiếu.'
- id: n8
  cau: Thí nghiệm của Watson và Rayner là một nỗ lực thực nghiệm sớm nhằm kiểm tra giả thuyết rằng cảm xúc sợ hãi có thể được điều kiện hóa ở người; giả thuyết đã được họ và Morgan nêu từ 1917
    mà thiếu bằng chứng thực nghiệm đủ.
  loai: lich-su
  nguon:
  - watson1920
  trich: These authors without adequate experimental evidence advanced the view that this range was increased by means of conditioned reflex factors.
  vi_tri: Mở bài
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "minh chứng trực tiếp đầu tiên cho thấy cảm xúc sợ hãi có thể được điều kiện hóa ở người". Bỏ "đầu tiên", "minh chứng" (khẳng định chưa kiểm được và bị Powell & Schmaltz 2021
    phản biện). Bài viết cũng ghi "A certain responsibility attaches to such a procedure" (n11).'
- id: n9
  cau: 'Mô hình điều kiện hóa cổ điển: chuột trắng (kích thích trung tính) ghép với tiếng động lớn (không điều kiện) gây giật mình; sau các lần ghép đôi, chuột một mình gây phản ứng sợ (kích thích
    có điều kiện).'
  loai: dinh-nghia
  nguon:
  - watson1920
  trich: Can we condition fear of an animal, e.g., a white rat, by visually presenting it and simultaneously striking a steel bar?
  vi_tri: Mục I
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "→ tiếng động một mình đã đủ gây sợ... Sau vài lần lặp lại"; mới nói "Theo mô hình ấy", "sau các lần ghép đôi" (không "vài lần"). Cũng nêu Pavlov dùng phản xạ tiết nước bọt
    ở chó: nguồn là trang Pavlov, không kiểm lại ở đây (link về trang nhà Pavlov đã kiểm ở phần 1).'
- id: n10
  cau: Bài báo là một trong những nghiên cứu được trích dẫn nhiều nhất trong tâm lý học, thường được trình bày như bằng chứng cho vai trò của điều kiện hóa cổ điển trong sự hình thành nỗi sợ.
  loai: lich-su
  nguon:
  - powell2021
  trich: Watson and Rayner's (1920) attempt to condition a fear of furry animals and objects in an 11-month-old infant is one of the most widely cited studies in psychology. Known as the Little
    Albert study, it is typically presented as evidence for the role of classical conditioning in fear development.
  vi_tri: Abstract
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "bài báo này xuất hiện trong mọi giáo trình tâm lý học — vừa như một cột mốc khoa học, vừa như một lời cảnh báo đạo đức". Bỏ "mọi giáo trình"; thay bằng điều Powell & Schmaltz
    nói.'
- id: n11
  cau: Bé rời bệnh viện mà nỗi sợ chưa được gỡ; chính các tác giả viết rằng họ do dự vì việc gây sợ thực nghiệm "mang một trách nhiệm nhất định".
  loai: lich-su
  nguon:
  - watson1920
  trich: At first there was considerable hesitation upon our part in making the attempt to set up fear reactions experimentally. A certain responsibility attaches to such a procedure.
  vi_tri: Mục I
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "nỗi sợ được tạo ra không bao giờ được xóa bỏ". Mới: theo bài (không có thủ thuật giải điều kiện hóa); thêm lời tác giả.'
- id: n12
  cau: '"Albert B." là con của một vú nuôi tại Harriet Lane Home for Invalid Children, được nuôi gần như từ lúc mới sinh trong môi trường bệnh viện.'
  loai: lich-su
  nguon:
  - watson1920
  trich: This infant was reared almost from birth in a hospital environment; his mother was a wet nurse in the Harriet Lane Home for Invalid Children.
  vi_tri: Mở bài
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "nhà trẻ bệnh viện Harriet Lane (thuộc Đại học Johns Hopkins, Baltimore, Mỹ)". Bỏ "Johns Hopkins, Baltimore" (bài không nói; chưa mở nguồn khác); mô tả "Home for Invalid Children"
    là nhà dành cho trẻ em bệnh.'
- id: n13
  cau: Bài báo mô tả bé khỏe mạnh từ lúc sinh, phát triển tốt, tính tình điềm tĩnh, ít biểu lộ cảm xúc; sự ổn định là một lý do chọn bé, và các tác giả cho rằng có thể gây tương đối ít hại.
  loai: lich-su
  nguon:
  - watson1920
  trich: He was on the whole stolid and unemotional. His stability was one of the principal reasons for using him as a subject in this test. We felt that we could do him relatively little harm
  vi_tri: Mở bài
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Watson mô tả ... họ tự trấn an rằng thí nghiệm không gây hại đáng kể". Mới: "tương đối ít hại" (relatively little harm); "bài báo mô tả" thay "Watson mô tả" (hai tác giả ký).'
- id: n14
  cau: Ở khoảng 9 tháng tuổi, Albert được cho xem lần lượt, đột ngột và lần đầu chuột trắng, thỏ, chó, khỉ, mặt nạ có và không có tóc, bông gòn, giấy báo đang cháy; bé không lần nào tỏ ra sợ,
    phản ứng thường gặp là sờ, nghịch.
  loai: phat-hien
  nguon:
  - watson1920
  trich: the infant was confronted suddenly and for the first time successively with a white rat, a rabbit, a dog, a monkey, with masks with and without hair, cotton wool, burning newspapers,
    etc. ... Manipulation was the most usual reaction called out. At no time did this infant ever show fear in any situation.
  vi_tri: Mở bài
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "ở khoảng 8 tháng 26 ngày ... bé thích chơi với con chuột". Lý do: bài nói các thử nghiệm này ở khoảng 9 tháng; 8 tháng 26 ngày là ngày thử tiếng động. "Thích chơi với chuột"
    không có trong bài.'
- id: n15
  cau: 'Lúc 8 tháng 26 ngày, bé được thử với tiếng búa đập thanh thép treo sau lưng: giật mình mạnh, thở ngừng, môi run, và khóc ở lần đập thứ ba.'
  loai: phat-hien
  nguon:
  - watson1920
  trich: The child started violently, his breathing was checked and the arms were raised in a characteristic manner. On the second stimulation the same thing occurred, and in addition the lips
    began to pucker and tremble. On the third stimulation the child broke into a sudden crying fit.
  vi_tri: Mở bài
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "chỉ có tiếng động lớn ... mới khiến bé giật mình, môi run và khóc. Tiếng động chính là vũ khí gây sợ"; bỏ "vũ khí" (diễn giải), thêm chi tiết theo bài.'
- id: n16
  cau: Trước khi điều kiện hóa, lúc 11 tháng 3 ngày, các thử nghiệm cảm xúc thông thường vẫn không thấy dấu hiệu sợ.
  loai: phat-hien
  nguon:
  - watson1920
  trich: Before attempting to set up a conditioned response we, as before, put him through all of the regular emotional tests. Not the slightest sign of a fear response was obtained in any situation.
  vi_tri: Mục I
  ket_qua: da-sua
  ghi_chu: Câu thêm mới theo bài (dùng ở ngộ nhận và câu hỏi).
- id: n17
  cau: 'Buổi 1 (11 tháng 3 ngày): 2 lần ghép đôi chuột và tiếng động; lần đầu bé giật mình và ngã về phía trước, không khóc; lần hai giật mình và bắt đầu rên rỉ.'
  loai: phat-hien
  nguon:
  - watson1920
  trich: The infant jumped violently and fell forward, burying his face in the mattress. He did not cry, however. ... Again the infant jumped violently, fell forward and began to whimper.
  vi_tri: Mục I
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Albert bắt đầu rùng mình, rên rỉ"; mới theo bài.'
- id: n18
  cau: 'Buổi 2 (11 tháng 10 ngày, một tuần sau): chuột đưa ra không kèm tiếng động thì bé rụt tay lại khi chuột chạm tay.'
  loai: phat-hien
  nguon:
  - watson1920
  trich: When the rat nosed the infant's left hand, the hand was immediately withdrawn.
  vi_tri: Mục I
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "bé đã sợ ở mức nhẹ"; mới theo mô tả của bài (không dùng chữ "sợ").'
- id: n19
  cau: Ở buổi 2, thêm 5 lần ghép đôi (tổng cộng 7); khi chuột đưa ra một mình bé khóc ngay, quay người, ngã sang bên và bò đi nhanh đến mức phải chạy theo mới bắt kịp.
  loai: phat-hien
  nguon:
  - watson1920
  trich: The instant the rat was shown the baby began to cry. Almost instantly he turned sharply to the left, fell over on left side, raised himself on all fours and began to crawl away so rapidly
    that he was caught with difficulty before reaching the edge of the table.
  vi_tri: Mục I
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "bé khóc to, bò tránh xa"; mới theo bài, nêu rõ 7 lần ghép đôi (không phải "2 + 5" như hai buổi tách).'
- id: n20
  cau: 'Buổi 3 (11 tháng 15 ngày, năm ngày sau): bé vẫn né chuột và chơi khối gỗ bình thường; thỏ gây phản ứng rõ rệt; chó nhẹ hơn thỏ nhưng bé khóc khi chó lại gần đầu; áo lông hải cẩu làm bé
    khóc và cố bò đi; bông gòn nhẹ hơn; tóc của Watson và mặt nạ ông già Noel bị né, tóc hai người quan sát khác thì bé chơi.'
  loai: phat-hien
  nguon:
  - watson1920
  trich: Rabbit alone ... The reaction was pronounced. ... Dog alone. The dog did not produce as violent a reaction as the rabbit. ... Albert was completely negative [Watson's hair]. Two other
    observers did the same thing. He began immediately to play with their hair.
  vi_tri: Mục II
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "một tuần sau ... Buổi 3: thỏ, chó, áo lông hải cẩu, bông gòn, tóc của chính Watson, mặt nạ ông già Noel → bé sợ hầu hết". Mới theo chi tiết bài: buổi 3 là năm ngày sau buổi
    2; bông gòn nhẹ; tóc người khác không bị né.'
- id: n21
  cau: Những vật ở buổi 3 (thỏ, chó, áo lông, tóc, mặt nạ) chưa từng đi kèm tiếng động.
  loai: phat-hien
  nguon:
  - watson1920
  trich: It will be recalled that this was the first time any effort had been made to directly condition response to the dog and rabbit.
  vi_tri: Mục II (buổi 11 tháng 20 ngày)
  ket_qua: dung
  ghi_chu: Đúng cho đến buổi 3; từ buổi 4 thỏ và chó mới được ghép trực tiếp (n22).
- id: n22
  cau: 'Buổi 4 (11 tháng 20 ngày): phản ứng với chuột yếu hơn nên các tác giả ghép đôi chuột với tiếng động để "làm mới"; lần đầu thỏ và chó cũng được ghép trực tiếp với tiếng động; sau đó bé
    được chuyển sang phòng giảng lớn, sáng hơn, có bốn người, và phản ứng với chuột và thỏ yếu hơn.'
  loai: phat-hien
  nguon:
  - watson1920
  trich: It was thought best to freshen up the reaction by another joint stimulation. ... The situation was thus very different from that which obtained in the small dark room. ... Rabbit alone.
    Fear reaction slight.
  vi_tri: Mục II
