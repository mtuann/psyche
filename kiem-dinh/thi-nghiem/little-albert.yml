  - id: n33
    cau: 'Vững chắc: nỗi sợ có thể được điều kiện hóa ở người.'
    loai: nhan
    nguon:
      - duits2015
    trich: Forty-four studies (published between 1920 and 2013) with data on 963 anxiety disordered patients and 1,222 control subjects were obtained
    vi_tri: Abstract
    nhan: vung-chac
    co_so:
      - duits2015
      - vervliet2013
    ly_do: 'Một phân tích tổng hợp cập nhật (44 nghiên cứu, 1920–2013; 963 bệnh nhân và 1.222 người đối chứng) dùng mô hình điều kiện hóa sợ hãi cổ điển ở người ở cả bệnh nhân lẫn người đối chứng. Đạt mức Vững chắc (mục 4) với giới hạn ghi ở ghi chú. Opus xét lại: giữ Vững chắc. Lo ngại của lượt 1 (Duits chỉ gián tiếp): Duits so sánh hai nhóm nhưng cả 1.222 người đối chứng đều qua quy trình điều kiện hóa nỗi sợ trong 44 nghiên cứu, và tổng quan Annual Review (Vervliet 2013) tổng hợp kết quả ở người và động vật ("conditioned fears are easy to extinguish, but they recover easily"). Bằng chứng tích lũy cho nguyên lý điều kiện hóa nỗi sợ ở người đủ cho Vững chắc.'
    ket_qua: da-sua
    ghi_chu: 'chỗ khó: chữ cũ nói "hàng thập kỷ nghiên cứu ... với người trưởng thành tình nguyện đã xác nhận ... nền tảng của nhiều liệu pháp điều trị ám ảnh sợ hãi". Phân tích tổng hợp Duits 2015 so sánh bệnh nhân với người đối chứng trong mô hình điều kiện hóa sợ hãi cổ điển, nên gián tiếp xác nhận điều kiện hóa ở người, nhưng không trực tiếp kiểm điều ấy ở người khỏe. Người giao/lượt 2: có thể thay bằng một phân tích tổng hợp điều kiện hóa sợ hãi ở người khỏe. Đoạn "nền tảng liệu pháp": Duits chỉ nói tắt dần "được cho là" nền tảng của hiệu quả phơi nhiễm. Review (Claude Opus 5.5, 30/10/2026): nhãn so thước đo mục 4: phân tích tổng hợp Duits 2015 (44 nghiên cứu, 963 bệnh nhân, 1.222 người đối chứng; tóm tắt đọc lại ở OpenAlex: "robustly increased fear responses to conditioned safety cues…") dùng mô hình điều kiện hóa sợ hãi cổ điển ở người trong mọi nghiên cứu, cộng tổng quan Annual Review Vervliet 2013 (gộp kết quả động vật và người): đạt Vững chắc cho khẳng định chung "nỗi sợ có thể được điều kiện hóa ở người". Khung nói rõ Albert không phải bằng chứng cho điều này. Câu gần sức khỏe tâm thần: "Trang này không hướng dẫn điều trị", có link /psyche/ho-tro/: không đọc như chẩn đoán hay lời khuyên điều trị.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/25703487/", "https://doi.org/10.1038/mp.2015.88" ]
    luot_2_ghi_chu: "Vững chắc đạt thước đo: phân tích tổng hợp Duits 2015 (44 nghiên cứu, người bệnh và người khỏe đều có phản ứng sợ có điều kiện) và phân tích tổng hợp fMRI Fullana 2016; mô thức được tái lập ở rất nhiều phòng thí nghiệm. Tóm tắt."
    review: dung
