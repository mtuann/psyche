    trich: It will be recalled that this was the first time any effort had been made to directly condition response to the dog and rabbit.
    vi_tri: Mục II (buổi 11 tháng 20 ngày)
    ket_qua: dung
    ghi_chu: Đúng cho đến buổi 3; từ buổi 4 thỏ và chó mới được ghép trực tiếp (n22).
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Watson/emotion.htm" ]
