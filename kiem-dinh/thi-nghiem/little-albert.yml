    trich: the infant was confronted suddenly and for the first time successively with a white rat, a rabbit, a dog, a monkey, with masks with and without hair, cotton wool, burning newspapers, etc. ... Manipulation was the most usual reaction called out. At no time did this infant ever show fear in any situation.
    vi_tri: Mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ở khoảng 8 tháng 26 ngày ... bé thích chơi với con chuột". Lý do: bài nói các thử nghiệm này ở khoảng 9 tháng; 8 tháng 26 ngày là ngày thử tiếng động. "Thích chơi với chuột" không có trong bài. Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); mở bài ("At no time did this infant ever show fear").'
    luot_2: dung
