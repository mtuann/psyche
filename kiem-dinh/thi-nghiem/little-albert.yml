  - id: n20
    cau: 'Buổi 3 (11 tháng 15 ngày, năm ngày sau): bé vẫn né chuột và chơi khối gỗ bình thường; thỏ gây phản ứng rõ rệt; chó nhẹ hơn thỏ nhưng bé khóc khi chó lại gần đầu; áo lông hải cẩu làm bé khóc và cố bò đi; bông gòn nhẹ hơn; tóc của Watson và mặt nạ ông già Noel bị né, tóc hai người quan sát khác thì bé chơi.'
    loai: phat-hien
    nguon:
      - watson1920
    trich: Rabbit alone ... The reaction was pronounced. ... Dog alone. The dog did not produce as violent a reaction as the rabbit. ... Albert was completely negative [Watson's hair]. Two other observers did the same thing. He began immediately to play with their hair.
    vi_tri: Mục II
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "một tuần sau ... Buổi 3: thỏ, chó, áo lông hải cẩu, bông gòn, tóc của chính Watson, mặt nạ ông già Noel → bé sợ hầu hết". Mới theo chi tiết bài: buổi 3 là năm ngày sau buổi 2; bông gòn nhẹ; tóc người khác không bị né. Review (Claude Opus 5.5, 30/10/2026): đối chiếu toàn văn Watson & Rayner 1920 (psychclassics.yorku.ca/Watson/emotion.htm, đọc lại 30/10/2026); buổi 11 tháng 15 ngày.'
