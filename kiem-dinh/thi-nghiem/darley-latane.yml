  - id: n36
    cau: 'Nếu bạn cần giúp, hãy gọi đích danh một người thay vì hỏi chung: trong một nghiên cứu ở 400 phòng chat trên mạng (Markey, 2000), lời nhờ có gọi tên được trả lời nhanh hơn (trung bình khoảng 36 giây so với 52 giây), và phòng đông người không còn làm chậm câu trả lời; đó là lời nhờ nhỏ trên mạng, không phải tình huống khẩn cấp.'
    loai: loi-khuyen
    nguon:
      - markey2000
    trich: assistance was received more quickly when help was asked for by specifying a participant’s name (M=36.38 s) than when no name was specified (M=51.53 s)
    vi_tri: 'tr. 186, Results; "Over a 30-day period, 400 different chat groups were randomly selected" (tr. 185, Design and procedure); tóm tắt: "the bystander effect was virtually eliminated … when help was asked for by specifying a bystander’s name"'
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó (Claude Opus 5.5): Chữ cũ: "đừng kêu cứu tôi với vào khoảng không. Hãy chỉ đích danh một người… bạn vừa gom 100% trách nhiệm đặt lên vai một người, phá vỡ phân tán trách nhiệm" (không nguồn, "100%" tu từ). Chữ mới giữ lời khuyên, dẫn Markey 2000 và nói rõ giới hạn (lời nhờ trên mạng, không khẩn cấp). Câu mở mục đổi thành "Mỗi gợi ý dưới đây kèm điều nghiên cứu đã thấy, nhưng các nghiên cứu ấy không làm trong tình huống khẩn cấp thật ngoài đời". Review (Claude Opus 5.5, 30/10/2026): Review mở Markey 2000 (toàn văn, bản tác giả) tr. 185–186: "400 different chat groups were randomly selected"; M = 36,38 s so với 51,53 s; "the bystander effect was virtually eliminated". Trang nói rõ là lời nhờ nhỏ trên mạng. Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.1016/s0747-5632(99)00056-4" ]
    luot_2_ghi_chu: "Không mở được toàn văn bài gốc (đóng, không có bản tác giả); chỉ đọc tóm tắt. Markey 2000 (Computers in Human Behavior): không mở được toàn văn hay tóm tắt (Crossref/OpenAlex không có); số 400 phòng chat, 36 giây vs 52 giây không xác nhận được."
    review: dung
  - id: n37
    cau: 'Nếu bạn là người chứng kiến, nói với người bên cạnh về điều đang xảy ra: trong thí nghiệm khói, người ta đoán tình hình qua vẻ bình thản của người xung quanh; theo Fischer và cộng sự (2011), khi những người chứng kiến là người thật và trao đổi thật với nhau, có thêm người chứng kiến thậm chí làm tăng việc giúp đỡ.'
    loai: loi-khuyen
    nguon:
      - fischer2011
      - latane1968
    trich: Under specific conditions (i.e., when the communication among bystanders is real and not manipulated by the experimenter, and when the bystanders are naive individuals instead of instructed confederates), additional bystanders even lead to more, rather than less, helping.
    vi_tri: 'Fischer 2011, tr. 534–535 (Discussion); Latané & Darley 1968, tr. 216: "An individual, seeing the inaction of others, will judge the situation as less serious than he would if he were alone."'
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó (Claude Opus 5.5): Chữ cũ: "đặt tên cho tình huống thành tiếng: Đây là trường hợp khẩn cấp, tôi đi gọi bảo vệ đây. Một câu nói to phá vỡ vô tri tập thể của cả đám đông" (không nguồn cho hiệu quả của câu nói to). Chữ mới: lời khuyên trao đổi với người bên cạnh, kèm điều Fischer thấy. Review (Claude Opus 5.5, 30/10/2026): Review mở Fischer và cộng sự 2011 (toàn văn) tr. 535: "when the communication among bystanders is real and not manipulated… and when the bystanders are naive individuals instead of instructed confederates), additional bystanders even lead to more, rather than less, helping". Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.1037/a0023304" ]
    luot_2_ghi_chu: Phần 'có thêm người chứng kiến thậm chí làm tăng việc giúp' không thấy trong tóm tắt Fischer 2011 (chỉ nói 'non-negative bystander effects' và hiệu ứng giảm khi người chứng kiến là người thật, quen biết, nam giới); toàn văn không mở được.
