    ly_do: 'Phân tích tổng hợp chất lượng tốt (Fischer 2011, toàn văn): 105 hiệu ứng, trên 7.700 người, thập niên 1960–2010; g = −0,35 (cố định), −0,33 (ngẫu nhiên, KTC 95% [−0,45; −0,22]); trim-and-fill không đổi ước lượng, đồ thị phễu cân, nên khó do thiên lệch xuất bản; có ở cả phòng thí nghiệm lẫn thực địa, ở nhiều loại tình huống. Không có thất bại tái lập lớn nào trong các nguồn đã mở. Hiệu ứng khác nhau nhiều giữa các nghiên cứu (Q(104) = 266,29) và yếu hẳn khi nguy hiểm rõ: đã giới hạn khẳng định vào "tình huống khẩn cấp mập mờ" và mức cá nhân. Philpot 2020 nói về mức cả đám đông (có ai giúp không), không mâu thuẫn. Đạt Vững chắc theo mục 4.'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hiệu ứng đã được lặp lại trong hàng chục thí nghiệm suốt 50 năm… Mô hình 5 bước… ít tranh cãi"; chữ mới dùng số liệu của Fischer và thêm lưu ý Philpot. Chỗ khó (Claude Opus 5.5): giữ Vững chắc sau khi đọc toàn văn Fischer (hiệu ứng ngẫu nhiên vẫn có ý nghĩa, không thấy thiên lệch xuất bản, cả thực địa); câu cuối khung (mô hình 5 bước) đã đổi, xem n25. Review (Claude Opus 5.5, 30/10/2026): Vững chắc hợp mục 4: một phân tích tổng hợp chất lượng tốt (Fischer và cộng sự 2011 (toàn văn): 105 hiệu ứng, hơn 7.700 người, g = −0,35, không thấy thiên lệch xuất bản), có cả thực địa; phạm vi khẳng định đã thu hẹp vào tình huống mập mờ, mức cá nhân; Philpot 2020 (mức cả đám đông) được ghi rõ là không mâu thuẫn. Mẫu chủ yếu phương Tây là giới hạn, nhưng không có thất bại tái lập lớn.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/a0023304", "https://doi.org/10.1037/amp0000469" ]
    luot_2_ghi_chu: Nhãn Vững chắc chấp nhận được vì phạm vi hẹp (tình huống mập mờ, không nguy hiểm) và có phân tích tổng hợp; lưu ý mẫu chủ yếu phương Tây và bằng chứng ngoài đời (Philpot) cho thấy ở mức tổng hợp thì đông người lại dễ có người giúp.
    review: dung
