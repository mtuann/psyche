  - id: n23
    cau: 'Để giải thích hiệu ứng, Latané và Darley (1970) đề xuất mô hình 5 bước (theo Fischer và cộng sự, 2011, kể lại): nhận thấy sự việc, hiểu đó là khẩn cấp, nhận trách nhiệm, tin mình biết cách giúp, quyết định giúp.'
    loai: lich-su
    nguon:
      - fischer2011
    trich: To account for the effect, Latané and Darley (1970) proposed a five-step psychological process model. They postulated that for intervention to occur, the bystander needs to (1) notice a critical situation, (2) construe the situation as an emergency, (3) develop a feeling of personal responsibility, (4) believe that he or she has the skills necessary to succeed, and (5) reach a conscious decision to help.
    vi_tri: Fischer 2011, tr. 518, mục Definitions and Psychological Accounts
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó (Claude Opus 5.5): Sách 1970 vẫn chưa đọc được, nên viết "theo Fischer kể lại". Chữ cũ: "Từ chuỗi thí nghiệm, hai ông rút ra…", "(4) biết cách giúp, (5) quyết định hành động"; chữ mới theo Fischer: "để giải thích hiệu ứng… đề xuất", "(4) tin mình biết cách giúp, (5) quyết định giúp". Cùng sửa ở câu hỏi 3 (n46). Review (Claude Opus 5.5, 30/10/2026): Review mở Fischer và cộng sự 2011 (toàn văn) tr. 518: "To account for the effect, Latané and Darley (1970) proposed a five-step… (1) notice… (5) reach a conscious decision to help". Trang ghi "theo Fischer kể lại". Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.1037/a0023304" ]
    luot_2_ghi_chu: "Mô hình 5 bước (Latané & Darley 1970; sách) và việc Fischer 2011 kể lại: không mở được sách hay toàn văn Fischer (epub.uni-regensburg.de chỉ có bản ghi, không có PDF)."
    review: dung
  - id: n24
    cau: 'Ở mỗi bước đầu, người chứng kiến có thể rời khỏi quá trình và không giúp. Sự có mặt của người khác cản được ở nhiều bước: trong thí nghiệm khói, người ngồi cùng người khác nhận ra khói chậm hơn (trong 5 giây đầu: 63% người ngồi một mình, 26% người ngồi cùng người khác) và dễ hiểu khói là vô hại; trong thí nghiệm co giật, trách nhiệm bị chia.'
