nhan_dinh:
  - id: n1
    cau: 'Darley và Latané (1968): càng đông người chứng kiến, mỗi cá nhân càng ít khả năng giúp đỡ (mô tả của trang).'
    loai: phat-hien
    nguon:
      - darley1968
      - fischer2011
    trich: These considerations lead to the hypothesis that the more bystanders to an emergency, the less likely, or the more slowly, any one bystander will intervene to provide aid.
    vi_tri: Darley 1968, phần mở đầu
    ket_qua: dung
    ghi_chu: Câu mô tả (description) của trang.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/h0025589", "https://doi.org/10.1037/a0023304" ]
  - id: n2
    cau: 'Hiệu ứng người ngoài cuộc (bystander effect): càng đông người chứng kiến một tình huống khẩn cấp, mỗi cá nhân càng ít khả năng can thiệp.'
    loai: dinh-nghia
    nguon:
      - fischer2011
    trich: showing that the presence of other people in a critical situation reduces the likelihood that an individual will help
    vi_tri: Tóm tắt
    ket_qua: dung
    ghi_chu: Định nghĩa theo tóm tắt Fischer 2011 (APA Dictionary không tải được).
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/a0023304" ]
  - id: n3
    cau: 'Phân tán trách nhiệm: trách nhiệm được chia cho những người có mặt; ở một mình, trách nhiệm hoàn toàn thuộc về bạn.'
    loai: dinh-nghia
    nguon:
      - darley1968
    trich: the responsibility for intervention is shared among all the onlookers and is not unique to any one
    vi_tri: Phần mở đầu
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (Điều gì đang xảy ra): "phần của mỗi người co lại đến gần bằng không"; (Lý thuyết): "trách nhiệm tỉ lệ nghịch với số người hiện diện. Ở một mình, 100% trách nhiệm là của bạn". Cả hai là con số tu từ không có trong nguồn; chữ mới theo mô tả của Darley & Latané. Review (Claude Opus 5.5, 30/10/2026): Darley & Latané 1968 (toàn văn, pdf.stafforini.com, mở lại ở review), phần mở đầu. Trang khớp, không còn con số tu từ.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/h0025589" ]
    review: dung
  - id: n4
    cau: 'Vô tri tập thể (pluralistic ignorance): ai cũng nhìn người khác để đoán tình hình; thấy mọi người ngồi yên, mỗi người kết luận "chắc không nghiêm trọng".'
    loai: dinh-nghia
    nguon:
      - fischer2011
      - latane1968
    trich: The third process is pluralistic ignorance, which results from the tendency to rely on the overt reactions of others when defining an ambiguous situation.
    vi_tri: Fischer 2011, tr. 518, mục Definitions and Psychological Accounts; Latané & Darley 1968, tr. 216 ("all members may be led (or misled) by each other to define the situation as less critical than they would if alone. Until someone acts, each person only sees other nonresponding bystanders")
    ket_qua: dung
    ghi_chu: 'Chỗ khó (Claude Opus 5.5): đã mở toàn văn Fischer 2011 và bài khói 1968. Bài 1968 mô tả cơ chế (ảnh hưởng xã hội trong tình huống mập mờ) mà không dùng tên "pluralistic ignorance"; tên ấy Fischer gán cho Latané & Darley (1970). Cùng định nghĩa ở mục Lý thuyết ("dùng phản ứng của người khác làm la bàn"). Review (Claude Opus 5.5, 30/10/2026): Lượt 2 không mở được toàn văn; review mở Fischer và cộng sự 2011 (toàn văn) tr. 518: "pluralistic ignorance, which results from the tendency to rely on the overt reactions of others when defining an ambiguous situation… no one intervenes because everyone believes that no one else perceives an emergency", và Latané & Darley 1968 (toàn văn, bài khói) tr. 216 (mỗi người chỉ thấy người khác không phản ứng). Định nghĩa trên trang khớp.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.1037/a0023304" ]
    luot_2_ghi_chu: Không mở được toàn văn bài gốc (đóng, không có bản tác giả); chỉ đọc tóm tắt. Chưa mở được định nghĩa vô tri tập thể (APA Dictionary dùng JavaScript, không đọc được bằng công cụ); khái niệm đúng theo hiểu biết chung.
    review: dung
  - id: n5
    cau: 'Sợ bị đánh giá: người ta lo đứng dậy báo động rồi hóa ra chuyện nhỏ, làm mình thành trò cười; trong thí nghiệm co giật, người tham gia lo phản ứng quá mức.'
    loai: phat-hien
    nguon:
      - darley1968
    trich: they were concerned not to make fools of them- selves by overreacting
    vi_tri: Phần Discussion
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đám đông càng đông, cái giá của việc ''làm lố'' càng cao" (không có trong nguồn đã mở); chữ mới chỉ nói điều Darley & Latané thấy. Ví dụ "máy pha cà phê" là minh họa (gia-dinh). Review (Claude Opus 5.5, 30/10/2026): Review mở Darley & Latané 1968 (toàn văn, pdf.stafforini.com, mở lại ở review) tr. 382: "they were concerned not to make fools of themselves by overreacting"; Fischer 2011 tr. 518 định nghĩa evaluation apprehension. Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.1037/h0025589" ]
    luot_2_ghi_chu: Không mở được toàn văn bài gốc (đóng, không có bản tác giả); chỉ đọc tóm tắt. Phần 'lo phản ứng quá mức' (ức chế do bị đánh giá) là thảo luận trong bài gốc, không có trong tóm tắt.
    review: dung
  - id: n6
    cau: 'Người không can thiệp thường không vô cảm: họ run tay, đổ mồ hôi, và còn đang phân vân giữa hai cái giá phải trả.'
    loai: phat-hien
    nguon:
      - darley1968
    trich: they often had trembling hands and sweating palms
    vi_tri: Phần Discussion
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đám đông không cứu không phải vì vô cảm, mà vì mỗi người đang đọc sai tín hiệu của nhau"; chữ mới theo Darley & Latané (1968): nonintervening subjects "had not decided not to respond… still in a state of indecision and conflict". Phần "đọc sai tín hiệu" thuộc thí nghiệm khói (chưa mở). Review (Claude Opus 5.5, 30/10/2026): Review mở Darley & Latané 1968 (toàn văn, pdf.stafforini.com, mở lại ở review) tr. 382: "they often had trembling hands and sweating palms"; "still in a state of indecision and conflict"; xung đột "avoidance-avoidance" (hai cái giá). Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.1037/h0025589" ]
    luot_2_ghi_chu: Không mở được toàn văn bài gốc (đóng, không có bản tác giả); chỉ đọc tóm tắt. Chi tiết run tay, đổ mồ hôi chỉ có trong toàn văn.
    review: dung
  - id: n7
    cau: Mỗi người ngồi một phòng riêng, thảo luận nhóm qua loa (hệ thống nội bộ) về các vấn đề của sinh viên.
    loai: phat-hien
