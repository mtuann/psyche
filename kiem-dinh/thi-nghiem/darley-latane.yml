  - id: n54
    cau: Phỏng vấn sau thí nghiệm khói, những người không báo đều nói họ đã gạt ý nghĩ đó là lửa; nhiều người đoán là hơi nước hay hơi máy điều hòa.
    loai: phat-hien
    nguon:
      - latane1968
    trich: they uniformly said that they had rejected the idea that it was a fire. Instead, they hit upon an astonishing variety of alternative explanations … Many thought the smoke was either steam or air-conditioning vapors
    vi_tri: tr. 219, Postexperimental interview
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó (Claude Opus 5.5): Câu mới thêm vào mục thí nghiệm khói (chữ cũ: không có), làm căn cứ cho định nghĩa vô tri tập thể và câu hỏi 2. Review (Claude Opus 5.5, 30/10/2026): Như n45: Latané & Darley 1968 (toàn văn, bài khói) tr. 219 ("Many thought the smoke was either steam or air-conditioning vapors"). Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.1037/h0026570" ]
    luot_2_ghi_chu: Không mở được toàn văn bài gốc (đóng, không có bản tác giả); chỉ đọc tóm tắt. Chi tiết phỏng vấn sau thí nghiệm khói (gạt ý nghĩ là lửa, đoán hơi nước/điều hòa) chỉ trong toàn văn.
    review: dung
