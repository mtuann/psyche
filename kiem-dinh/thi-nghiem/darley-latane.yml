    cau: Trong nghiên cứu của Markey (2000), 400 phòng chat được chọn ngẫu nhiên; lời nhờ có gọi tên được trả lời sau trung bình khoảng 36 giây, lời nhờ chung sau khoảng 52 giây.
    loai: so-lieu
    nguon:
      - markey2000
    trich: Over a 30-day period, 400 different chat groups were randomly selected … assistance was received more quickly when help was asked for by specifying a participant’s name (M=36.38 s) than when no name was specified (M=51.53 s)
    vi_tri: tr. 185–186
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó (Claude Opus 5.5): Số mới thêm (chữ cũ: không có), tách khỏi n36 để lượt 2 kiểm riêng; 36,38 và 51,53 giây làm tròn thành "khoảng 36" và "52". Review (Claude Opus 5.5, 30/10/2026): Như n36.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.1016/s0747-5632(99)00056-4" ]
    luot_2_ghi_chu: "Số liệu Markey 2000 (400 phòng chat, 36 vs 52 giây): xem n36."
    review: dung
