  - id: n27
    cau: Hiệu ứng yếu đi khi tình huống được nhận là nguy hiểm, có kẻ gây hại có mặt, hoặc cái giá của việc can thiệp là rủi ro thể chất.
    loai: so-lieu
    nguon:
      - fischer2011
    trich: The bystander effect was attenuated when situations were perceived as dangerous (compared with non-dangerous), perpetrators were present (compared with non-present), and the costs of intervention were physical (compared with non-physical).
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "yếu đi rõ rệt khi tình huống nguy hiểm rõ ràng: có kẻ tấn công xuất hiện, nạn nhân bị đe dọa thân thể, hoặc cái giá… là rủi ro thể chất". "Rõ rệt" giữ vì nguồn nói "attenuated" (giảm); câu "lửa cháy rõ ràng thì người ta xông vào" mạnh hơn nguồn, đã đổi: hiệu ứng yếu đi, ở một số tình huống nguy hiểm không còn (tóm tắt: "non-negative bystander effects in certain dangerous emergencies"). "Nạn nhân bị đe dọa thân thể" không có trong tóm tắt dưới dạng đó (nguồn dùng "dangerous", "perpetrators present", "physical costs"); lượt 2 xem. Chỗ khó (Claude Opus 5.5): đã đọc toàn văn: ba biến điều chỉnh là "emergency danger (high vs. low)", "perpetrator present versus absent", "physical versus non-physical cost of intervention" (tr. 522–523); không có biến "nạn nhân bị đe dọa thân thể". Đổi "có kẻ tấn công xuất hiện, nạn nhân bị đe dọa thân thể" thành "tình huống được nhận là nguy hiểm, có kẻ gây hại có mặt". "Rõ rệt" giữ: nguy hiểm g = −0,30, không khẩn cấp g = −0,47, kẻ xấu có thể nguy hiểm g = +0,29. Review (Claude Opus 5.5, 30/10/2026): Fischer và cộng sự 2011 (toàn văn), tóm tắt và tr. 522–523. Trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/a0023304" ]
    review: dung
