    review: dung
  - id: n51
    cau: Hộp "Tóm tắt nhanh" ở đầu trang dựng tự động từ ý chính của các khung nhãn của trang.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trong src/plugins/thanh-phan.mjs (tomTat) và psyche-markdown.mjs. Review (Claude Opus 5.5, 30/10/2026): src/plugins/thanh-phan.mjs, hàm tomTat; psyche-markdown.mjs gắn ::tom-tat.'
    review: dung
  - id: n52
    cau: Hộp hồ sơ nghiên cứu ở đầu trang chỉ dùng điều đã có trong phần kể nghiên cứu của chính trang.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Bốn dòng khớp mục Nghiên cứu then chốt (Darley và Latané 1968, co giật). Review (Claude Opus 5.5, 30/10/2026): Bốn dòng của :::ho-so-nghien-cuu khớp mục Darley và Latané (1968): sinh viên, phòng riêng, loa nội bộ, băng ghi âm, 1 hay 4 người khác, 85% và 31%.'
    review: dung
  - id: n53
    cau: Trang liên kết tới "cách đọc độ lớn hiệu ứng" (/psyche/bang-chung/do-lon-hieu-ung/).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Trang có trong src/data/trang.yml (bang-chung/do-lon-hieu-ung); chưa có file nên hiện "sắp có" khi build (đã có trang khác dùng cùng link). Review (Claude Opus 5.5, 30/10/2026): src/data/trang.yml có bang-chung/do-lon-hieu-ung; trang chưa có file nên link thành "sắp có" (src/plugins/sap-co.mjs), đúng như ghi_chu.'
