    trich: At each of these preliminary steps, the bystander to an emergency can remove himself from the decision process and thus fail to help. … Sixty-three percent of subjects in the alone condition and only 26% of subjects in the combined together conditions noticed the smoke within the first 5 seconds after its introduction
    vi_tri: 'Latané & Darley 1968, tr. 220 (Discussion) và tr. 219 (Noticing the smoke); Darley & Latané 1968: "the responsibility for intervention is shared among all the onlookers"'
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó (Claude Opus 5.5): Chữ cũ: "Vấp ở bất kỳ bước nào — và đám đông khiến ta dễ vấp ở cả 5 bước — là không có hành động nào xảy ra"; "cả 5 bước" không có nguồn (hai bài 1968 chỉ cho thấy ba bước đầu: nhận thấy, hiểu, nhận trách nhiệm). Chữ mới theo hai bài 1968. Review (Claude Opus 5.5, 30/10/2026): Review mở Latané & Darley 1968 (toàn văn, bài khói) tr. 219–220: "At each of these preliminary steps, the bystander… can remove himself from the decision process"; "Sixty-three percent… and only 26%… within the first 5 seconds"; trách nhiệm chia: Darley & Latané 1968 (toàn văn, pdf.stafforini.com, mở lại ở review). Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.1037/h0026570" ]
    luot_2_ghi_chu: Không mở được toàn văn bài gốc (đóng, không có bản tác giả); chỉ đọc tóm tắt. Số 63% vs 26% trong 5 giây đầu không xác nhận được.
