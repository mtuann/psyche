    ghi_chu: 'Chữ cũ: "ở Việt Nam, ta không thiếu những clip tai nạn giao thông với đám đông đứng quay phim… báo chí hay gọi là vô cảm… nỗi lo giúp rồi bị vạ lây là rào cản có thật… quy định bảo vệ người sơ cứu thiện chí". Không có nguồn nào (cả về clip, báo chí lẫn quy định pháp lý), nên đã bỏ và nói rõ là giả thuyết. Người giao: nếu muốn giữ phần pháp lý thì cần nguồn chính thức (văn bản pháp luật, trang cơ quan nhà nước), ghi ngày kiểm. Review (Claude Opus 5.5, 30/10/2026): Trang ghi rõ là giả thuyết và nói chưa mở nguồn pháp lý; không khẳng định gì cần nguồn. Người gom (Claude Opus 5.5, 30/10/2026): câu suy luận (đã ghi rõ trên trang là suy luận/giả thuyết) dựa vào philpot2020, nguồn lượt 2 đã mở.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/amp0000469" ]
    luot_2_ghi_chu: Không phải khẳng định thực nghiệm.
    review: dung
    nguon:
      - philpot2020
  - id: n41
    cau: Trong thí nghiệm co giật, nhiều người không can thiệp vẫn run tay, đổ mồ hôi và còn phân vân; Darley và Latané cho rằng họ chưa quyết định không giúp.
    loai: phat-hien
    nguon:
      - darley1968
    trich: It is our impression that nonintervening subjects had not decided not to respond.
    vi_tri: Phần Discussion
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Thí nghiệm cho thấy ngay cả người tốt, trong cấu trúc đám đông, cũng có thể không hành động. Đổ lỗi cho đạo đức vừa sai vừa không giúp ích gì"; chữ mới bám nguồn; "người tốt" và "vừa sai vừa không giúp ích" là đánh giá không nguồn, đã bỏ. Review (Claude Opus 5.5, 30/10/2026): Như n6: Darley & Latané 1968 (toàn văn, pdf.stafforini.com, mở lại ở review) tr. 382 ("had not decided not to respond"). Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.1037/h0025589" ]
    luot_2_ghi_chu: Không mở được toàn văn bài gốc (đóng, không có bản tác giả); chỉ đọc tóm tắt. 'Chưa quyết định không giúp' và chi tiết run tay/đổ mồ hôi chỉ trong toàn văn.
    review: dung
  - id: n42
    cau: Ngoài đời, ở mức cả đám đông, đông người làm tăng khả năng có ai đó giúp (Philpot 2020).
    loai: so-lieu
    nguon:
      - philpot2020
    trich: increased bystander presence is related to a greater likelihood that someone will intervene
    vi_tri: Tóm tắt
    ket_qua: dung
    ghi_chu: Câu thêm vào Ngộ nhận cuối ("Đông người thì nạn nhân dễ được cứu hơn").
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/amp0000469" ]
  - id: n43
    cau: 'Trong tình huống mập mờ, ở mức cá nhân, đông người thì mỗi người ít giúp hơn: nghịch lý mà Darley và Latané phát hiện.'
    loai: phat-hien
    nguon:
      - darley1968
      - fischer2011
    trich: the more bystanders to an emergency, the less likely, or the more slowly, any one bystander will intervene to provide aid
    vi_tri: Darley 1968, phần mở đầu
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trong tình huống mập mờ, điều ngược lại mới đúng"; chữ mới thêm "ở mức cá nhân" (vì mức cả đám đông thì khác). Review (Claude Opus 5.5, 30/10/2026): Darley & Latané 1968 (toàn văn, pdf.stafforini.com, mở lại ở review) (mở đầu) và Fischer và cộng sự 2011 (toàn văn). Trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/h0025589", "https://doi.org/10.1037/a0023304" ]
    review: dung
  - id: n44
    cau: 'Câu hỏi 1: kết quả thí nghiệm khói: 75% (một mình), 38% (hai người lạ thật), 10% (hai diễn viên dửng dưng).'
    loai: so-lieu
    nguon:
      - latane1968
    trich: As predicted, Ss were less likely to report the smoke when in the presence of passive others (10%) or in groups of 3 (38% of groups) than when alone (75%).
    vi_tri: Tóm tắt, tr. 215
    ket_qua: dung
    ghi_chu: 'Chỗ khó (Claude Opus 5.5): Ba số đúng; câu hỏi không nói 38% tính theo nhóm, nhưng phương án đúng ghi "khi ngồi cùng hai người lạ thật" (đúng điều kiện); lượt 2 xem có cần thêm "tính theo nhóm". Review (Claude Opus 5.5, 30/10/2026): Review mở Latané & Darley 1968 (toàn văn, bài khói), tóm tắt tr. 215: "(10%) or in groups of 3 (38% of groups) than when alone (75%)". Phương án đúng ghi đúng điều kiện. Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.1037/h0026570" ]
    luot_2_ghi_chu: Không mở được toàn văn bài gốc (đóng, không có bản tác giả); chỉ đọc tóm tắt. Cùng 75/38/10 như n16-18, không xác nhận được.
    review: dung
  - id: n45
    cau: 'Câu hỏi 2: vô tri tập thể nghĩa là ai cũng nhìn người khác để đoán tình hình, thấy mọi người ngồi yên nên kết luận "chắc không sao"; lời giải thích: trong thí nghiệm khói, người không báo nói rằng họ đã kết luận khói không phải là lửa, và vẻ bình thản của người xung quanh dẫn họ tới cách hiểu ấy.'
    loai: dinh-nghia
    nguon:
      - fischer2011
      - latane1968
    trich: Subjects who had not reported the smoke also were unsure about exactly what it was, but they uniformly said that they had rejected the idea that it was a fire.
    vi_tri: 'Latané & Darley 1968, tr. 219 (Postexperimental interview); định nghĩa: Fischer 2011, tr. 518'
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó (Claude Opus 5.5): Chữ cũ của lời giải thích: "Không ai vô cảm cả; họ chỉ đang đọc sai tín hiệu của nhau một cách có hệ thống" ("không ai" quá mạnh, không nguồn). Chữ mới theo phỏng vấn sau thí nghiệm. Hai phương án sai là gia-dinh. Review (Claude Opus 5.5, 30/10/2026): Review mở Latané & Darley 1968 (toàn văn, bài khói) tr. 219: "they uniformly said that they had rejected the idea that it was a fire". Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.1037/h0026570" ]
    luot_2_ghi_chu: Không mở được toàn văn bài gốc (đóng, không có bản tác giả); chỉ đọc tóm tắt. Lời giải thích về người không báo khói 'kết luận không phải lửa' chỉ trong toàn văn.
    review: dung
  - id: n46
    cau: 'Câu hỏi 3: mô hình 5 bước (nhận thấy, hiểu là khẩn cấp, nhận trách nhiệm, tin mình biết cách giúp, quyết định giúp); lời giải thích: vấp ở bất kỳ bước nào là không có hành động; sự có mặt của người khác có thể cản ở nhiều bước.'
    loai: lich-su
    nguon:
      - fischer2011
      - latane1968
    trich: They postulated that for intervention to occur, the bystander needs to (1) notice a critical situation, (2) construe the situation as an emergency, (3) develop a feeling of personal responsibility, (4) believe that he or she has the skills necessary to succeed, and (5) reach a conscious decision to help.
    vi_tri: Fischer 2011, tr. 518; Latané & Darley 1968, tr. 219–220
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó (Claude Opus 5.5): Chữ cũ: "biết cách giúp → quyết định hành động", lời giải thích "Đám đông khiến ta dễ vấp ở cả năm bước cùng lúc" (không nguồn); chữ mới như n23, n24. Review (Claude Opus 5.5, 30/10/2026): Như n23, n24.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.1037/a0023304" ]
    luot_2_ghi_chu: "Mô hình 5 bước: xem n23."
    review: dung
  - id: n47
    cau: 'Câu hỏi 4: Fischer và cộng sự (2011) thấy hiệu ứng vẫn còn (g = −0,35) nhưng yếu đi khi nguy hiểm rõ ràng, chẳng hạn khi có kẻ gây hại có mặt.'
    loai: so-lieu
    nguon:
      - fischer2011
    trich: overall effect size of g = -0.35
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ của lời giải thích: "Khói mập mờ thì đám đông đóng băng; lửa cháy rõ ràng thì người ta xông vào"; chữ mới như ở nhận định Fischer. Chỗ khó (Claude Opus 5.5): phương án đúng của câu hỏi 4: "— có kẻ tấn công, nạn nhân bị đe dọa thân thể" đổi thành "— chẳng hạn khi có kẻ gây hại có mặt" (như n27). Review (Claude Opus 5.5, 30/10/2026): Fischer và cộng sự 2011 (toàn văn), tóm tắt. Trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/a0023304" ]
    review: dung
  - id: n48
    cau: 'Câu hỏi 5: trong nghiên cứu ở phòng chat của Markey (2000), lời nhờ có gọi đích danh một người được trả lời nhanh hơn hỏi chung cả phòng; phòng đông người không còn làm chậm câu trả lời, còn hỏi chung thì phòng càng đông câu trả lời càng đến chậm.'
    loai: loi-khuyen
    nguon:
      - markey2000
    trich: the within-group correlation was r (200)=0.25, p<0.01 when help was requested without specifying a participant’s name and dropped to r (200)=0.03, p>0.05 when help was asked for by specifying a participant’s name
    vi_tri: tr. 186, Results
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó (Claude Opus 5.5): Chữ cũ: "Nếu bạn gặp nạn giữa đám đông, cách kêu cứu hiệu quả nhất là gì? + Chỉ đích danh một người… > Chỉ đích danh gom 100% trách nhiệm…" (không nguồn, "hiệu quả nhất" và "100%" quá mạnh). Câu hỏi mới hỏi điều Markey 2000 thấy. Phương án sai là gia-dinh. Review (Claude Opus 5.5, 30/10/2026): Như n36: Markey 2000 (toàn văn, bản tác giả) tr. 186 (r = 0,25 khi hỏi chung, 0,03 khi gọi tên). Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.1016/s0747-5632(99)00056-4" ]
    luot_2_ghi_chu: "Số liệu Markey 2000: xem n36."
    review: dung
  - id: n49
    cau: 'Hình "bystander-smoke": tỉ lệ báo khói trong vòng 6 phút: một mình 75%; cùng 2 người lạ 38% (tính theo nhóm, 3/8 nhóm); cùng 2 diễn viên dửng dưng 10%; chú thích và aria-label cùng số.'
    loai: so-lieu
    nguon:
      - latane1968
    trich: As predicted, Ss were less likely to report the smoke when in the presence of passive others (10%) or in groups of 3 (38% of groups) than when alone (75%).
    vi_tri: 'Tóm tắt, tr. 215; 3/8 nhóm: tr. 218; 6 phút: tr. 217 (Method)'
    ket_qua: dung
    ghi_chu: 'Chỗ khó (Claude Opus 5.5): Đã đối chiếu từng số của hình (cột, nhãn, chú thích, aria-label) với bài gốc: đúng cả bốn (75%, 38% theo nhóm, 3/8, 10%) và mốc 6 phút (tính từ lúc nhận ra khói). "Diễn viên dửng dưng cắm cúi viết" khớp cách diễn ("returned to the questionnaires and continued to fill them out"). Không sửa hình, không thêm vào HINH_DA_SUA. Review (Claude Opus 5.5, 30/10/2026): Đã mở src/hinh/bystander-smoke.html: cột 75%, 38% (tính theo nhóm, 3/8), 10%; chú thích "trong vòng 6 phút"; aria-label cùng số. Khớp Latané & Darley 1968 (toàn văn, bài khói). Không sửa.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.1037/h0026570" ]
    luot_2_ghi_chu: Không mở được toàn văn bài gốc (đóng, không có bản tác giả); chỉ đọc tóm tắt. Cùng 75/38/10 như n16-18; chú thích cùng số là tính chất của hình trên trang.
    review: dung
  - id: n50
    cau: 'Trang này là trang nhà của nghiên cứu Darley–Latané: nơi khác chỉ tóm một câu và link về.'
