    cau: 'Đang tranh cãi → Đã bị bác bỏ: câu chuyện "38 nhân chứng đứng nhìn không làm gì" trong vụ Kitty Genovese.'
    loai: nhan
    nguon:
      - manning2007
    trich: there is no evidence for the presence of 38 witnesses, or that witnesses observed the murder, or that witnesses remained inactive
    vi_tri: Tóm tắt
    nhan: bac-bo
    co_so:
      - manning2007
      - fischer2011
    ly_do: 'Manning, Levine & Collins (2007) dùng tư liệu lưu trữ, không thấy bằng chứng cho 38 nhân chứng, cho việc họ chứng kiến vụ án, hay cho việc họ đứng yên: bằng chứng gốc của câu chuyện (bài báo năm 1964) không còn giá trị, đúng điều kiện thứ hai của Đã bị bác bỏ. Phân tích tổng hợp Fischer 2011 (tr. 534) chấp nhận kết luận ấy ("even if there were no 38 witnesses") và tách nó khỏi hiệu ứng được đo trong phòng thí nghiệm. Nhãn nói về câu chuyện "38 nhân chứng", không về hiệu ứng.'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: khung Đang tranh cãi ("câu chuyện gốc về Kitty Genovese"… "không đơn giản như huyền thoại"); chữ mới: khung Đã bị bác bỏ. Chỗ khó (Claude Opus 5.5): chốt Đã bị bác bỏ: có một nghiên cứu lịch sử bình duyệt dựa trên lưu trữ và phân tích tổng hợp lớn nhất của lĩnh vực chấp nhận nó; không nguồn nào đã mở bênh lại câu chuyện 38 người. Chỉ đọc tóm tắt Manning; lượt 2 nên mở toàn văn. Review (Claude Opus 5.5, 30/10/2026): Đã bị bác bỏ hợp mục 4 ("bằng chứng gốc không còn giá trị") cho câu chuyện, không cho hiệu ứng: Manning, Levine & Collins 2007 (tóm tắt, dựa trên lưu trữ) và Fischer và cộng sự 2011 (toàn văn) tr. 534 chấp nhận ("even if there were no 38 witnesses").'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0003-066X.62.6.555", "https://doi.org/10.1037/amp0000469" ]
    luot_2_ghi_chu: "Nhãn Đã bị bác bỏ khớp thước đo ('bằng chứng gốc không còn giá trị'): áp cho câu chuyện 38 nhân chứng, không áp cho hiệu ứng người ngoài cuộc."
