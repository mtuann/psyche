    moi: 'Hộp hồ sơ nghiên cứu (:::ho-so-nghien-cuu): tác giả và năm, người tham gia, thiết kế, kết quả chính'
    ly_do: Bố cục C (kế hoạch).
  - cu: 'Thí nghiệm khói: "Người tham gia ngồi điền phiếu trong phòng… Ở một mình: 75% báo khói trong 6 phút… 38% (tính theo nhóm — 3/8 nhóm…)… 10% — và nhiều người trong số 90% còn lại thậm chí dụi mắt vì cay mà vẫn ngồi yên."'
    moi: Thêm người tham gia, 18/24, "kể từ lúc nhận ra khói", 1/10, cách diễn của người cộng tác; "9 người còn lại… ho, dụi mắt, mở cửa sổ, nhưng không đi báo"; thêm câu phỏng vấn sau thí nghiệm (hơi nước, hơi máy điều hòa).
    ly_do: Đối chiếu toàn văn Latané & Darley (1968), tr. 217–219 (hồ sơ n15–n19, n54).
  - cu: 'Tự trải nghiệm và ô "Xem đáp án": "khói xám bốc lên từ khe cửa thông gió"; "75%… trong vòng 6 phút"; "38% — tính theo nhóm (…tính theo từng cá nhân thì thấp hơn, vì mỗi nhóm dừng ngay khi có người đầu tiên lên tiếng)".'
    moi: '"khói trắng… lỗ thông gió trên tường"; "trong vòng 6 phút kể từ lúc nhận ra khói"; "1 trong 10 người"; "chỉ 3 trong 8 nhóm (38%)…, dù… hơn 98% số nhóm phải có ít nhất một người báo. Tính theo từng người: 3 trong 24 người."'
    ly_do: 'Bài gốc: khói trắng, lỗ thông gió; lý do "mỗi nhóm dừng" sai ý bài (hồ sơ n20–n22).'
  - cu: 'Mô hình 5 bước: "Từ chuỗi thí nghiệm, hai ông rút ra… (4) biết cách giúp, (5) quyết định hành động. Vấp ở bất kỳ bước nào — và đám đông khiến ta dễ vấp ở cả 5 bước — là không có hành động nào xảy ra."'
    moi: '"Để giải thích hiệu ứng, Latané và Darley (1970) đề xuất… (theo Fischer và cộng sự, 2011, kể lại)… (4) tin mình biết cách giúp, (5) quyết định giúp"; thêm điều hai bài 1968 cho thấy ở ba bước đầu (63% so với 26% nhận ra khói trong 5 giây đầu).'
    ly_do: Sách 1970 chưa đọc; Fischer 2011 tr. 518; Latané & Darley 1968 tr. 219–220 (hồ sơ n23, n24).
  - cu: 'Khung Vững chắc, câu cuối: "Mô hình 5 bước là khung giải thích được dùng rộng rãi."'
    moi: '"Còn những quá trình tâm lý nào đứng sau hiệu ứng thì, theo Fischer và cộng sự, các nghiên cứu vẫn chưa rõ ràng."'
    ly_do: Fischer 2011 tr. 518 (hồ sơ n25).
  - cu: 'Áp dụng vào đời sống: "Các gợi ý dưới đây suy ra từ cơ chế…"; "Nếu bạn là nạn nhân… gom 100% trách nhiệm…"; "Nếu bạn là người chứng kiến: đặt tên cho tình huống thành tiếng…"; "Chuẩn bị trước: mô hình 5 bước cho ta một danh sách…"'
    moi: 'Câu mở nói rõ các nghiên cứu không làm trong tình huống khẩn cấp thật; "Nếu bạn cần giúp: gọi đích danh…" kèm Markey (2000); "Nếu bạn là người chứng kiến: nói với người bên cạnh…" kèm Fischer (2011); "Biết về hiệu ứng" kèm Beaman và cộng sự (1978) theo Fischer kể lại. Thêm Markey (2000) vào mục Nguồn.'
    ly_do: Lời khuyên phải có nguồn (chuẩn mục 1); hồ sơ n36–n38, n55.
  - cu: 'Câu hỏi 2, 3, 5: lời giải thích "Không ai vô cảm cả…"; "Đám đông khiến ta dễ vấp ở cả năm bước cùng lúc"; câu 5 "cách kêu cứu hiệu quả nhất… gom 100% trách nhiệm".'
    moi: Câu 2 giải thích theo phỏng vấn sau thí nghiệm khói; câu 3 theo Fischer và bài khói; câu 5 hỏi điều Markey (2000) thấy ở phòng chat.
    ly_do: Hồ sơ n45, n46, n48.
  - cu: 'Fischer và câu hỏi 4: "có kẻ tấn công xuất hiện, nạn nhân bị đe dọa thân thể"'
    moi: '"tình huống được nhận là nguy hiểm, có kẻ gây hại có mặt"; câu hỏi 4: "chẳng hạn khi có kẻ gây hại có mặt"'
    ly_do: Toàn văn Fischer 2011 không có biến "nạn nhân bị đe dọa thân thể" (hồ sơ n27, n47).
