    trich: The Stanford Prison Experiment (SPE) is one of psychology's most famous studies. ... a majority of textbook authors have ignored these criticisms
    vi_tri: Abstract
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "suốt nửa thế kỷ". Chữ mới: "gần nửa thế kỷ". Lý do: 1971 đến 2019. "Mong manh" là đánh giá chung, bám ý "questionable scientific validity". Review (Claude Opus 5.5, 30/10/2026): Le Texier 2019 (toàn văn bản in, Am Psychol 74(7), và bản thảo OSF) (1971 đến 2019). Trang khớp.'
    luot_2: dung
