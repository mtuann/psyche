  ghi_chu: 'Chữ cũ: "(con số \"5\" trong sách giáo khoa bị Le Texier (2019) chất vấn: theo hồ sơ lưu trữ chỉ có 3 trường hợp vì lý do suy sụp tinh thần)". Chữ mới: báo cáo gốc ghi 5 người; Le Texier chỉ ra khoảng hai trong 10 tù nhân thật sự có triệu chứng suy sụp. Lý do: Le Texier (bản thảo tr. 23–24) xác nhận 5 người ra sớm (Korpi và bốn người khác: hai khóc, một phát ban, một không rõ lý do), không nói "3"; ông chất vấn mức độ suy sụp, không phải con số 5.'
- id: n20
  cau: Theo Le Texier (2019), khoảng hai trong 10 tù nhân thật sự có triệu chứng suy sụp thần kinh; nói "một nửa suy sụp phải cho ra sớm" là cường điệu.
  loai: phat-hien
  nguon:
  - letexier2019
  trich: Out of the 10 prisoners, it looks like only two really exhibited symptoms of a nervous breakdown.
  vi_tri: Bản thảo tr. 24
  ket_qua: da-sua
  ghi_chu: 'Chữ mới của đoạn trên. Le Texier viết "it looks like", nên trang chỉ nên nói đây là đánh giá của ông (đã viết "theo Le Texier"). Chỗ khó: Zimbardo và Haney (2020) phản bác cách đọc hồ sơ của Le Texier nói chung, nhưng tóm tắt (bản duy nhất mở được) không nêu riêng điểm này.'
