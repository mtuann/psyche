    luot_2_ghi_chu: "Nội dung đúng: cả bên phê bình (Le Texier, Haslam và cộng sự) lẫn tác giả gốc đều xác nhận các sự kiện. Lưu ý cho review: thước đo mục 4 viết cho hiệu ứng (phân tích tổng hợp, tái lập); với sự kiện lịch sử, căn cứ là hồ sơ lưu trữ, phim, ghi âm và sự đồng thuận của hai phía. Cần ghi điều ấy ở co_so."
