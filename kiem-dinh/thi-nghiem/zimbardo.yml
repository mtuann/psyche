  - cu: '> Điều khiến sự tàn ác trở nên "chấp nhận được" là sự bất lực của tập thể và vai trò của người lãnh đạo — chứ không phải chiếc áo cai tù tự nó.'
    moi: '> Theo Reicher và Haslam, điều khiến sự tàn ác trở nên "chấp nhận được" là sự bất lực và thất bại của các nhóm — chứ không phải chiếc áo cai tù tự nó.'
    ly_do: 'Review: theo tóm tắt Reicher & Haslam 2006 (hồ sơ q3b).'
ghi_chu: 'Haney 1973 (bản quét, OCR) đọc toàn văn; Le Texier là bản thảo PsyArXiv (số trang theo bản thảo); Reicher & Haslam toàn văn qua CiteSeerX; Carnahan, Zimbardo & Haney 2020, Haslam 2019 chỉ đọc tóm tắt. Zimbardo (2007) sách Lucifer Effect không đọc. Nguồn phụ: prisonexp.org (lời kể của Zimbardo).'
