  - cu: 'Một loạt vấn đề lộ ra: cai tù đã nhận **hướng dẫn chi tiết** về cách đối xử với tù nhân trong buổi định hướng;'
    moi: 'Theo Le Texier, hồ sơ lưu trữ cho thấy một loạt vấn đề: cai tù đã nhận **hướng dẫn chi tiết** về cách đối xử với tù nhân trong buổi định hướng, trái với báo cáo gốc nói họ cố ý chỉ được hướng dẫn tối thiểu;'
    ly_do: 'Review: là kết luận của Le Texier từ hồ sơ, báo cáo gốc nói khác (hồ sơ n18).'
  - cu: Độc giả Việt Nam có lẽ thường biết thí nghiệm qua sách và báo phổ thông; Le Texier (2019) chỉ ra
