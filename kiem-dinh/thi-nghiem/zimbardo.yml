  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "hay cả thí nghiệm đã bị dàn dựng ngay từ đầu?". Chữ mới: "hay phần lớn kết quả đến từ cách thí nghiệm được dàn dựng và từ hướng dẫn dành cho người tham gia?". Lý do: Le Texier và Haslam, Reicher & Van Bavel không nói cả thí nghiệm bịa; họ nói hướng dẫn cho cai tù, diễn xuất, dữ liệu chọn lọc. Khung nhãn chính ở n40.'
- id: n13
