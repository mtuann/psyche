  ghi_chu: 'Chữ mới của đoạn n19; Le Texier nói "highly probable that he wanted to look like he was having a breakdown". Trang viết "theo hồ sơ đã tính trước", khớp nhưng nên ghi là cách đọc của Le Texier: đã viết ở câu trước ("Le Texier ... cho rằng").'
