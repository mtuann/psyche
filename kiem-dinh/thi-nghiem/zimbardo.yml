  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "dù bằng chứng gốc rất mong manh". Chữ mới: "có nhiều điểm yếu". Lý do: Le Texier nói "questionable scientific validity", không "rất mong manh". Hai câu hỏi (làm lại được chưa, mẫu đại diện không) dựa trên hai điểm yếu có nguồn: thiếu tái lập độc lập (BBC Prison Study là thiết kế khác) và mẫu tự chọn (Carnahan & McFarland).'
- id: n57
  cau: Tính đến 10/2026, chưa tìm thấy nghiên cứu nào tương tự thí nghiệm Zimbardo trên người Việt.
