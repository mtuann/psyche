    luot_2_nguon: [ "https://www.gwern.net/doc/psychology/2019-letexier.pdf", "https://www.ojp.gov/pdffiles1/Photocopy/10301NCJRS.pdf", "https://api.openalex.org/works/doi:10.1037/amp0000593" ]
    luot_2_ghi_chu: 'câu đúng: Theo Le Texier (2019), dựa trên hồ sơ lưu trữ, trong buổi định hướng cai tù đã nhận hướng dẫn cụ thể về cách đối xử với tù nhân, trái với báo cáo gốc nói họ chỉ được hướng dẫn tối thiểu.; Đây là kết luận của Le Texier 2019 (và Haslam, Reicher, Van Bavel 2019) từ hồ sơ lưu trữ; báo cáo gốc viết cai tù "were intentionally given only minimal guidelines", và Zimbardo (2018, Le Texier dẫn) vẫn nói không có "formal or detailed instructions"; Zimbardo và Haney 2020 bác các phê bình. Viết như sự thật không ghi nguồn là mạnh hơn bằng chứng; nên ghi rõ là theo hồ sơ lưu trữ và Le Texier.'
    review: sai
    ghi_chu: 'Review (Claude Opus 5.5, 30/10/2026): Lượt 2 đúng (qua-manh): Le Texier 2019 (toàn văn bản in, Am Psychol 74(7), và bản thảo OSF) ("the guards were given clear instructions", "precise instructions") là kết luận của Le Texier từ hồ sơ; Haney, Banks & Zimbardo 1973 (toàn văn, bản quét prisonexp.org/OJP) viết cai tù "were intentionally given only minimal guidelines", và Zimbardo & Haney 2020 bác phê bình. Đã sửa câu ở mục Le Texier: "Theo Le Texier, hồ sơ lưu trữ cho thấy…: cai tù đã nhận hướng dẫn chi tiết…, trái với báo cáo gốc nói họ cố ý chỉ được hướng dẫn tối thiểu". Câu hỏi 2 vốn hỏi "phát hiện của Le Texier", không cần sửa.'
