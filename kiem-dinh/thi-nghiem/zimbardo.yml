  vi_tri: Haney, Abstract
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "cai tù hành xử như cai tù thật, tù nhân suy sụp như tù nhân thật" (Điều gì đang xảy ra); "Kết quả ban đầu khiến cả thế giới rùng mình". Chữ mới: "Kết quả công bố ban đầu gây chấn động"; "gần nửa thế kỷ sau". Lý do: bỏ cường điệu "cả thế giới"; "nửa thế kỷ" đổi "gần nửa thế kỷ" cho khớp 1971 đến 2018–2019.'
- id: n14
  cau: Thí nghiệm Zimbardo là một trong những nghiên cứu nổi tiếng nhất, và cũng thuộc nhóm bị tranh cãi nhiều nhất, của tâm lý học.
  loai: lich-su
  nguon:
  - letexier2019
  trich: The Stanford Prison Experiment (SPE) is one of psychology's most famous studies. It has been criticized on many grounds
  vi_tri: Abstract
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ (mô tả, Điều gì đang xảy ra): "một trong những nghiên cứu nổi tiếng nhất — và cũng bị tranh cãi nhiều nhất"; mô tả: "một trong những tranh luận lớn nhất về tính khoa học của tâm lý học". Chữ mới: "nổi tiếng nhất, và cũng thuộc nhóm bị tranh cãi nhiều nhất"; mô tả: "một trong những nghiên cứu nổi tiếng và bị tranh cãi nhiều nhất". Lý do: nguồn chỉ nói "one of psychology''s most famous" và "criticized on many grounds", không xếp hạng tranh cãi.'
- id: n15
  cau: Gần nửa thế kỷ sau, hồ sơ lưu trữ được mở và người tham gia cũ được phỏng vấn lại.
