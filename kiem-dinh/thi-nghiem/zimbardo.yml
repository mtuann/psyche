- id: n54
  cau: Kết luận "hoàn cảnh xô đẩy" đang bị tranh cãi, nên chưa thể dùng nó để gỡ trách nhiệm cá nhân; ở Stanford ít nhất một số cai tù làm theo hướng dẫn và tự nhận đang diễn.
  loai: loi-khuyen
  nguon:
  - letexier2019
  - haslam2019
  trich: throughout the entire experiment I was an actor, and I was hamming it up. [...] I was role playing.
  vi_tri: Le Texier tr. 19; Haslam 2019 abstract
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "\"Hoàn cảnh xô đẩy\" không xóa trách nhiệm cá nhân. Bài học từ phía phê bình khác hẳn: ..." Chữ mới: "Kết luận \"hoàn cảnh xô đẩy\" chính là điểm đang bị tranh cãi, nên chưa thể dùng nó để gỡ trách nhiệm cá nhân. ..." Lý do: câu cũ là khẳng định đạo đức không nguồn; viết lại thành hệ quả của điều nguồn nói. Câu "ít nhất một số cai tù đã làm theo hướng dẫn và tự nhận là đang diễn": Le Texier (hướng dẫn, Eshleman và Barnett nói mình đang diễn).'
- id: n55
  cau: Theo kết luận gốc của Zimbardo (đang bị tranh cãi), đồng phục, chức danh và "luật bất thành văn" của nhóm có thể khiến người ta làm điều bình thường họ không làm; theo nhóm BBC, điều đáng để ý là nhóm đang đồng nhất với điều gì và người lãnh đạo khơi gợi điều gì.
  loai: loi-khuyen
  nguon:
  - haney1973
  - reicher2006
  trich: This suggests that it is powerlessness and the failure of groups that makes tyranny psychologically acceptable. | uniforms ... issued identical uniforms ... promote feelings of anonymity
  vi_tri: Haney, Uniform; Reicher & Haslam, Abstract
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đồng phục, chức danh, ... có thể khiến người ta làm những việc lúc bình thường họ không làm. Cách chống đỡ hiệu quả nhất, theo nghiên cứu BBC, không phải trông chờ \"bản chất tốt\" ... mà là xây dựng chuẩn mực nhóm lành mạnh và cơ chế để người yếu thế lên tiếng." Chữ mới: như câu trên. Lý do: nghiên cứu BBC không thử "chuẩn mực nhóm lành mạnh" hay "cơ chế để người yếu thế lên tiếng" nên bỏ khuyến nghị; câu đầu gắn rõ với kết luận gốc đang tranh cãi.'
- id: n56
  cau: Một câu chuyện hấp dẫn có thể sống trong sách giáo khoa hàng chục năm dù bằng chứng gốc có nhiều điểm yếu; khi gặp kết quả "gây sốc", hãy hỏi đã ai làm lại được chưa và mẫu có đại diện không.
  loai: loi-khuyen
  nguon:
  - letexier2019
  - carnahan2007
  trich: a majority of textbook authors have ignored these criticisms in their discussions of the SPE, thereby misleading both students and the general public
