  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Chúng tôi chưa tìm thấy bất kỳ nghiên cứu tương tự nào trên người Việt". Chữ mới: thêm mốc "Tính đến 10/2026". Tìm ngày 30/10/2026: WebSearch "Stanford prison experiment replication Vietnam OR Vietnamese participants" không có kết quả nào về mẫu Việt; chỉ có BBC Prison Study. Chưa tìm trong cơ sở dữ liệu tiếng Việt (Tạp chí Tâm lý học, Vietnam Journals Online): chưa chắc: nên để lượt 2 hay review tìm thêm bằng tiếng Việt.'
- id: n58
