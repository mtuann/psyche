  moi: 'Hộp hồ sơ nghiên cứu (:::ho-so-nghien-cuu): Tác giả, năm; Người tham gia; Thiết kế; Kết quả chính'
  ly_do: Bố cục C (kế hoạch).
- cu: cho 24 sinh viên bốc thăm vai cai tù và tù nhân ... rồi trở thành một trong những tranh luận lớn nhất về tính khoa học của tâm lý học
  moi: 24 sinh viên được chọn bốc thăm vai ... (21 người tham gia) ... rồi trở thành một trong những nghiên cứu nổi tiếng và bị tranh cãi nhiều nhất của tâm lý học
  ly_do: n4, n14.
- cu: 'với luật duy nhất: không dùng bạo lực thân thể'
  moi: 'với một điều cấm được nhấn mạnh: không dùng bạo lực thân thể'
  ly_do: n8.
- cu: nhiều cai tù nhanh chóng trở nên tàn nhẫn
  moi: một số cai tù nhanh chóng trở nên tàn nhẫn
  ly_do: n11.
- cu: hay cả thí nghiệm đã bị dàn dựng ngay từ đầu?
  moi: hay phần lớn kết quả đến từ cách thí nghiệm được dàn dựng và từ hướng dẫn dành cho người tham gia?
  ly_do: n12.
- cu: Kết quả ban đầu khiến cả thế giới rùng mình ... nửa thế kỷ sau
  moi: Kết quả công bố ban đầu gây chấn động ... gần nửa thế kỷ sau
  ly_do: n13, n15.
- cu: 24 sinh viên trong tầng hầm Jordan Hall ... Hơn 70 người đăng ký; 24 người vượt qua kiểm tra tâm lý ... Tầng hầm tòa nhà tâm lý Jordan Hall
  moi: 24 sinh viên trong tầng hầm khoa Tâm lý Stanford ... Hơn 70 người đăng ký (75 theo báo cáo gốc); 24 người được đánh giá ổn định nhất ... cuối cùng 21 người tham gia (10 tù nhân, 11 cai tù). Một đoạn hành lang tầng hầm tòa nhà tâm lý của Đại học Stanford
  ly_do: n3, n4, n5.
- cu: 'con số "5" trong sách giáo khoa bị Le Texier chất vấn: theo hồ sơ lưu trữ chỉ có 3 trường hợp'
  moi: báo cáo gốc ghi 5 người vì suy sụp cảm xúc nặng; Le Texier cho rằng chỉ khoảng hai trong 10 tù nhân thật sự có triệu chứng suy sụp, một người theo hồ sơ đã tính trước việc tỏ ra suy sụp
  ly_do: n19–n21.
- cu: đã biến sinh viên bình thường thành cai tù tàn nhẫn hoặc tù nhân cam chịu
  moi: đã đẩy ít nhất một phần ba số cai tù đến chỗ hung hăng, hạ nhục tù nhân hơn mức dự đoán, và đẩy nhiều tù nhân vào thụ động, phụ thuộc, trầm cảm
  ly_do: n24.
- cu: lục lại toàn bộ kho lưu trữ
  moi: lục lại kho lưu trữ
  ly_do: n25.
- cu: Dave Eshelman
  moi: David Eshleman
  ly_do: n26.
- cu: 'Kết luận: đây giống một màn "diễn minh họa" được dàn dựng ... hơn là một thí nghiệm khoa học đúng nghĩa'
  moi: 'Kết luận của Le Texier: đây là một nghiên cứu có quá nhiều sai sót về phương pháp, đến mức giá trị khoa học của nó bị đặt nghi vấn'
  ly_do: n30, q2b.
- cu: với biện pháp đạo đức chặt chẽ hơn và không có định hướng ngầm từ nhóm nghiên cứu
  moi: với 15 nam tham gia, có hội đồng đạo đức duyệt và hai nhà tâm lý học lâm sàng theo dõi suốt thời gian, và không hướng dẫn cai tù cách hành xử (chỉ cấm bạo lực thể xác)
  ly_do: n31–n33.
- cu: chỉ khi hệ thống này sụp đổ vì bất lực, một số người mới tính đến chế độ độc tài — và vấp phải phản kháng
  moi: '... một số người mới tính đến một chế độ độc đoán — và gặp sự kháng cự ngày càng yếu'
  ly_do: n35.
- cu: là sự bất lực và sụp đổ của tập thể cùng vai trò của người lãnh đạo
  moi: là sự bất lực và thất bại của các nhóm
  ly_do: n36, q3b.
- cu: với 24 sinh viên ... một số tù nhân suy sụp và được cho ra sớm
  moi: với 21 sinh viên tham gia (24 người được chọn) ... một số tù nhân được cho ra sớm (có bao nhiêu người thật sự suy sụp thì còn tranh cãi, như trên)
  ly_do: n4, n39.
- cu: hướng dẫn ngầm ... khi làm lại tử tế ... Cán cân bằng chứng gần đây nghiêng về phía hoài nghi
  moi: hướng dẫn của người thí nghiệm ... khi làm lại với thiết kế khác ... Phần lớn các phân tích gần đây dựa trên hồ sơ lưu trữ hoặc thiết kế lại đều hoài nghi kết luận gốc (thêm Haslam, Reicher và Van Bavel, 2019)
  ly_do: n42, n43, n48, n50, q4b.
- cu: ghi điểm cao hơn hẳn ... Mới chỉ một nghiên cứu, nhưng logic khó bác bỏ ... làm suy yếu trực tiếp tuyên bố
  moi: ghi điểm cao hơn ... và thấp hơn ở đồng cảm và vị tha ... chính các tác giả nói hệ quả với thí nghiệm Stanford vẫn chỉ là phỏng đoán ... làm yếu đi tuyên bố ... theo nghĩa tuyệt đối
  ly_do: n45, n46.
- cu: 'Lãnh đạo bản sắc: ... Bạo lực xảy ra khi một thủ lĩnh biến sự tàn ác thành chuẩn mực của "chúng ta"'
  moi: vai trò tự nó chưa đủ gây ra sự tàn ác, trừ khi người lãnh đạo khiến người thực hiện đồng nhất với một mục tiêu cao cả của nhóm ... Theo Haslam, Reicher và Van Bavel (2019) ...
  ly_do: n52.
- cu: hiệu ứng có thể bắt nguồn từ việc
  moi: hiệu ứng có thể một phần bắt nguồn từ việc
  ly_do: n53.
- cu: '"Hoàn cảnh xô đẩy" không xóa trách nhiệm cá nhân ... nhiều hành vi tàn ác không phải bị tình huống cuốn đi vô thức, mà được thực hiện bởi những người hiểu rõ mình đang làm gì'
  moi: Kết luận "hoàn cảnh xô đẩy" chính là điểm đang bị tranh cãi, nên chưa thể dùng nó để gỡ trách nhiệm cá nhân ... ở nhà tù Stanford, ít nhất một số cai tù đã làm theo hướng dẫn và tự nhận là đang diễn
  ly_do: n54.
- cu: Cách chống đỡ hiệu quả nhất, theo nghiên cứu BBC ... xây dựng chuẩn mực nhóm lành mạnh và cơ chế để người yếu thế lên tiếng
  moi: theo kết luận gốc (đang tranh cãi) ... Theo hướng phân tích của nhóm BBC, điều đáng để ý không phải "bản chất tốt" của từng cá nhân, mà là nhóm đang đồng nhất với điều gì ...
  ly_do: n55.
- cu: dù bằng chứng gốc rất mong manh
  moi: dù bằng chứng gốc có nhiều điểm yếu
  ly_do: n56.
- cu: Chúng tôi chưa tìm thấy bất kỳ nghiên cứu tương tự nào trên người Việt ... không thể qua được bất kỳ hội đồng đạo đức ... Những gì độc giả Việt Nam biết ... chủ yếu qua sách giáo khoa và báo chí phổ thông
  moi: Tính đến 10/2026, chúng tôi chưa tìm thấy ... khó có thể được phê duyệt theo chuẩn mực đạo đức nghiên cứu hiện hành ... Độc giả Việt Nam có lẽ thường biết thí nghiệm qua sách và báo phổ thông; Le Texier (2019) chỉ ra rằng phần lớn tác giả sách giáo khoa ... bỏ qua các phê bình
  ly_do: n57–n59.
- cu: chỉ một bộ phận cai tù hung hăng rõ rệt; số còn lại trung lập, thậm chí có người tử tế
  moi: ít nhất một phần ba cai tù trở nên hung hăng hơn mức dự đoán; số còn lại gồm người "cứng nhưng công bằng" và một vài người thụ động
  ly_do: n61.
- cu: Không — không hội đồng đạo đức nào hiện nay cho phép giam người và gây sang chấn tâm lý như vậy.
  moi: Gần như không — theo chuẩn mực hiện nay, một thiết kế giam người và gây căng thẳng tâm lý như vậy khó được phê duyệt.
  ly_do: n62.
- cu: ông chứng minh đây giống một màn minh họa được dàn dựng (hướng dẫn ngầm, diễn xuất, dữ liệu chọn lọc) hơn là thí nghiệm khoa học đúng nghĩa
  moi: ông chỉ ra những sai sót về phương pháp (hướng dẫn dành cho cai tù, diễn xuất, dữ liệu thu thập chọn lọc) khiến giá trị khoa học của nghiên cứu bị đặt nghi vấn
  ly_do: q2b.
- cu: đã sống trong sách giáo khoa suốt nửa thế kỷ
  moi: đã sống trong sách giáo khoa gần nửa thế kỷ
  ly_do: q5b.
ghi_chu: 'Haney 1973 (bản quét, OCR) đọc toàn văn; Le Texier là bản thảo PsyArXiv (số trang theo bản thảo); Reicher & Haslam toàn văn qua CiteSeerX; Carnahan, Zimbardo & Haney 2020, Haslam 2019 chỉ đọc tóm tắt. Zimbardo (2007) sách Lucifer Effect không đọc. Nguồn phụ: prisonexp.org (lời kể của Zimbardo).'
