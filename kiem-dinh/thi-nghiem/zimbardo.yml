  vi_tri: Haslam 2019, Abstract
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "con người không tự động phục tùng vai trò; họ hành động theo bản sắc nhóm mà người lãnh đạo khơi gợi. Bạo lực xảy ra khi một thủ lĩnh biến sự tàn ác thành chuẩn mực của \"chúng ta\"". Chữ mới: như câu trên. Lý do: bám đúng tóm tắt của Haslam, Reicher & Van Bavel (2019) (lý thuyết bản sắc lãnh đạo gắn với bài 2019, không phải bài 2006); thêm nguồn vào danh sách Nguồn của trang.'
- id: n53
  cau: 'Tự chọn lọc mẫu: hiệu ứng có thể một phần bắt nguồn từ việc những người hung hăng, độc đoán hơn đã tự tìm đến thí nghiệm.'
