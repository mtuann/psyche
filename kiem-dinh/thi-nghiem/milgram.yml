  - cu: 'Người mặc áo choàng xám đứng cạnh bạn nói đều đều: "Thí nghiệm yêu cầu anh tiếp tục."'
    moi: 'Bạn quay sang người mặc áo choàng xám đứng cạnh; ông ta bảo bạn coi im lặng là trả lời sai và cứ tiếp tục. Bạn ngần ngại. Ông ta nói, giọng chắc chắn mà không thô lỗ: "Xin hãy tiếp tục." Rồi: "Thí nghiệm yêu cầu anh tiếp tục."'
    ly_do: 'Review: đúng trình tự của Milgram 1963 (coi im lặng là sai; câu thúc ép chỉ khi ngần ngại, theo thứ tự; giọng "firm, but not impolite"); hồ sơ n6.'
