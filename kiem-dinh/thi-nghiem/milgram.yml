    trich: No subject stopped prior to administering Shock Level 20. (At this level—300 volts—the victim kicks on the wall and no longer provides answers to the teacher's multiple-choice questions.)
    vi_tri: Milgram 1963, mục Result of Experiment I; Bảng 2 (5 người dừng ở 300V, 4 ở 315V, 2 ở 330V, 1 mỗi nấc 345, 360, 375V; 26 người đến 450V)
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó (Claude Opus 5.5): Người giao đã sửa hình: chữ cũ "100% đều đi đến 300V — nấc mà học trò đập tường đòi được thả" và "79% những người đã vượt qua 150V đều đi tiếp đến 450V" (dưới nhãn "Số liệu Milgram (1963)"); chữ mới "Cả 40 người đều đi đến 300V, nấc mà học trò đập vào tường và ngừng trả lời", bỏ dòng 79%. Lý do: bài 1963 không có lời "đòi được thả" (học trò đập tường, câu trả lời không còn hiện lên bảng); 79% (26/33) là của Thí nghiệm 5 (Burger 2009), không phải bài 1963 (số ấy vẫn ở khung Khá vững và câu hỏi 2, ghi đúng nguồn). Đã đối chiếu: 65%, 35%, 26/40, 14/40, 300–375V, "cả 40 người đến 300V" đúng với bài và Bảng 2. Hình nằm trong HINH_DA_SUA của tests/chuyen.test.mjs. Review (Claude Opus 5.5, 30/10/2026): Đã mở src/hinh/milgram-obedience.html: cột 65% (26/40), 35% (14/40, 300–375V), dòng "Cả 40 người đều đi đến 300V…", aria-label và chú thích cùng số; khớp Milgram 1963 (toàn văn PDF psy.miami.edu) Bảng 2. Không còn dòng 79%. Không sửa thêm.'
    luot_2: dung
    luot_2_nguon: [ "https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf" ]
    luot_2_ghi_chu: "Bảng 2, tr. 376: 14 người dừng ở 300–375V. Lượt 2 không xem hình, chỉ kiểm số."
