- id: n25
  cau: Burger (2009) làm lại một phần Thí nghiệm 5 của Milgram, 45 năm sau, và dừng ở nấc 150V.
  loai: tai-lap
  nguon:
  - burger2009
  trich: Seventy adults participated in a replication of Milgram's Experi- ment 5
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "xin phép hội đồng đạo đức để làm lại đến nấc 150V thì dừng — nấc mà học trò lần đầu kêu đau và đòi dừng"; chữ mới nói rõ là Thí nghiệm 5 và 150V là nơi học trò bắt đầu phản đối bằng lời. "Hội đồng đạo đức" không đối chiếu được trong phần đã đọc: đã bỏ chữ ấy, chỉ giữ "với chuẩn đạo đức hiện nay" (Burger: "current standards… place Milgram''s studies out of bounds").'
- id: n26
  cau: Trong Thí nghiệm 5, 79% những người đã vượt qua 150V (26 trên 33) đi tiếp đến 450V.
  loai: so-lieu
  nguon:
  - burger2009
  trich: Another way to say this is that 79% of the people who continued past 150 volts (26 of 33) went all the way to the end of the shock generator's range.
  vi_tri: Mục Results
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "trong dữ liệu của Milgram, 79%…"; chữ mới nói rõ là Thí nghiệm 5, thêm 26/33. Cùng nhận định ở khung Khá vững và câu hỏi 2. Hình src/hinh/milgram-obedience.html ghi "79% những người đã vượt qua 150V" dưới nhãn "Số liệu Milgram (1963)": 79% là của Thí nghiệm 5, không phải bài 1963.'
- id: n27
  cau: Burger có 70 người trưởng thành, chia hai điều kiện; điều kiện cơ sở có 40 người.
  loai: so-lieu
  nguon:
  - burger2009
  trich: Seventy adults participated in a replication of Milgram's Experi- ment 5
  vi_tri: Tóm tắt; Bảng 2
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Với 70 người trưởng thành, 70% tiếp tục vượt qua 150V" (gộp sai: 70% là của điều kiện cơ sở, 28/40). Bảng 2: cơ sở 12 dừng + 28 tiếp = 40; điều kiện hai (người mẫu từ chối) 11 + 19 = 30.'
- id: n28
  cau: Ở điều kiện cơ sở, 70% (28/40) tiếp tục sau 150V, so với 82,5% ở Thí nghiệm 5 của Milgram; chênh lệch không có ý nghĩa thống kê.
  loai: tai-lap
  nguon:
  - burger2009
  trich: This rate is slightly lower than the percentage who continued beyond this point in Milgram's comparable condition (82.5%)
