    ghi_chu: 'Chỗ khó (Claude Opus 5.5): Chữ cũ: "Lừa đảo giả danh: kẻ gọi điện xưng công an, bác sĩ, tổng đài ngân hàng và ra lệnh chuyển tiền gấp. Công thức giống hệt: tạo tính chính danh + tạo áp lực thời gian + từng bước nhỏ. Cách chống: xác minh qua kênh độc lập — gọi lại số chính thức, hỏi ý kiến người thứ ba." Không nguồn cho "công thức giống hệt" (Milgram không có áp lực thời gian) và cho cách chống (cần trang chính thức của Bộ Công an hay Ngân hàng Nhà nước; tìm ngày 30/10/2026 không ra trang đọc được). Chữ mới chỉ giữ điều thí nghiệm cho thấy (Bridgeport) và nói rõ phần lừa đảo là phép so sánh (gia-dinh). Muốn giữ lời khuyên chống lừa đảo thì cần nguồn chính thức, loại thoi-su, có hạn. Review (Claude Opus 5.5, 30/10/2026): Như n46: 47,5% so với 65% (Milgram 1974). Phần so sánh với lừa đảo đã ghi rõ là phép so sánh của trang (gia-dinh).'
