  ly_do: 'Nhiều nghiên cứu cùng chiều: tổng hợp 21 biến thể của Milgram (Meta-Milgram, 740 người, 43,6% đi đến nấc cuối) và hai lần làm lại hiện đại ở Mỹ và Ba Lan (Burger 2009; Doliński 2017) thấy mức vâng lời cao. Chưa đạt Vững chắc theo mục 4: tổng hợp chỉ gồm các biến thể nhỏ (20–40 người) của cùng một chương trình nghiên cứu, không phải phân tích tổng hợp các nghiên cứu độc lập; không có tái lập lớn đăng ký trước; hai lần làm lại đều dừng sớm vì đạo đức nên không đo đúng biến số gốc (đi đến 450V); và tư liệu lưu trữ (Perry 2019: 18/23 biến thể) cho thấy người không tin hẳn vào màn kịch giật mạnh hơn, nên độ lớn bị nghi phóng đại. Hướng của hiệu ứng thì nhất quán, nên Khá vững chứ không Đang tranh cãi.'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Milgram làm nhiều biến thể, và các nhà nghiên cứu khác ở nhiều nước, nhiều thập kỷ sau vẫn thu được… Đây là một trong những hiệu ứng được lặp lại nhiều nhất của tâm lý học xã hội"; chữ mới dùng 23 biến thể, hai lần làm lại, 43,6%. Đã bỏ câu so sánh "lặp lại nhiều nhất" (không nguồn) và "nhiều nước" (chỉ mở được Mỹ và Ba Lan). chỗ khó: thước đo Vững chắc đòi tái lập lớn không giảm nhẹ hay tổng hợp độc lập; ở đây chỉ có tổng hợp số liệu của chính Milgram và hai lần làm lại sửa đổi, cộng phê bình của Perry 2019. Người giao/lượt 2 cân nhắc hạ xuống Khá vững. Chỗ khó (Claude Opus 5.5): chốt hạ Vững chắc xuống Khá vững (lý do ở ly_do); sửa khung trên trang thành :::kha-vung và thêm câu "Vì sao chỉ khá vững" (n69). Hộp Tóm tắt nhanh dựng từ khung nên đổi theo. Trang khác link tới khung này: chưa kiểm (người giao xem o_dau).'
