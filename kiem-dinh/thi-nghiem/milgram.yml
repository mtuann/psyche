  ghi_chu: 'Chữ cũ: "Vâng lời ở đây không phải sự tàn ác lạnh lùng, mà là sự giằng xé rồi đầu hàng". "Giằng xé rồi đầu hàng" là diễn giải; Haslam 2014 cho rằng nhiều người còn "vui vì đã tham gia". Chữ mới chỉ khẳng định điều bài 1963 đo (căng thẳng) và nói việc giải thích còn tranh cãi.'
