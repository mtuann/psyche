    moi: '"Khi Milgram chuyển thí nghiệm khỏi Đại học Yale sang một văn phòng ở Bridgeport, tỉ lệ vâng lời đến nấc cuối thay đổi thế nào? + Thấp hơn: 47,5%, so với 62,5%…"'
