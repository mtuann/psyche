  moi: '"Vẻ chính danh: … Bridgeport 47,5% so với 62,5%… đó là phép so sánh của chúng tôi"; "Trong thí nghiệm, có đồng minh giúp người ta dám dừng lại"; "Lời thúc ép không phải sự thật: …14 trong 40 người…"'
