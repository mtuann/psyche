    cau: 'Trạng thái ủy nhiệm (Milgram): người ta trao trách nhiệm cho người có quyền lực và vì thế vâng lời.'
    loai: dinh-nghia
    nguon:
      - reicher2012
    trich: The behavior of participants within Milgram's obedience paradigm is commonly understood to arise from the propensity to cede responsibility to those in authority and hence to obey them.
    vi_tri: Tóm tắt Reicher 2012
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "khi có quyền lực hợp pháp đứng ra chịu trách nhiệm, người ta chuyển sang ''chế độ thực thi'', ngừng tự đánh giá đạo đức hành vi của mình". Cụm "chế độ thực thi" và "ngừng tự đánh giá đạo đức" không có trong nguồn đã mở (chỉ có trong sách Milgram 1974). Chữ mới dùng định nghĩa của Reicher 2012. Chưa mở Milgram 1974. Review (Claude Opus 5.5, 30/10/2026): Reicher, Haslam & Smith 2012, tóm tắt: "cede responsibility to those in authority and hence to obey them"; Milgram 1974 (Internet Archive), chương The Agentic Shift, cùng ý. Trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/details/ObedienceToAuthority_368", "https://api.openalex.org/works/doi:10.1177/1745691612448482" ]
    luot_2_ghi_chu: 'Milgram 1974, chương "The Agentic Shift"; cùng sách: "he therefore no longer regards himself as responsible for his actions".'
