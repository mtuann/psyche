- id: n18
  cau: Học trò do một kế toán viên 47 tuổi được huấn luyện cho vai đóng (không phải "diễn viên tên Wallace").
  loai: lich-su
  nguon:
  - milgram1963
  trich: The victim was played by a 47-year-old accountant, trained for the role
  vi_tri: Mục Method, Personnel and Locale
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "học trò là diễn viên (ông Wallace)"; chữ mới như trên. Lý do: bài 1963 không nêu tên "Wallace" và mô tả anh ta là kế toán viên 47 tuổi được huấn luyện (tên Wallace chỉ thấy ở sách 1974, chưa mở).'
- id: n19
  cau: Học trò trả lời sai theo kịch bản; không có phản hồi hay dấu hiệu phản đối nào cho đến nấc 300V; sau cú giật 315V tiếng đập tường lặp lại rồi anh ta im hẳn.
  loai: phat-hien
  nguon:
  - milgram1963
  trich: In the present experimental condition no vocal re- sponse or other sign of protest is heard from the learner until Shock Level 300 is reached.
  vi_tri: Mục Procedure
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Ở 150V, anh ta kêu đau và đòi được thả ra. Ở 300V, anh ta đập vào tường đòi được thả; từ 315V trở đi không còn phản hồi trên bảng đáp án". Bài 1963: không phản đối đến 300V; đập tường ở 300V; "The pounding is repeated after the 315-volt shock is administered; afterwards he is not heard from". "Đòi được thả" không có trong bài 1963.'
- id: n20
  cau: Ở các biến thể về sau của Milgram (như Thí nghiệm 5), học trò bắt đầu kêu phản đối từ nấc 150V.
  loai: lich-su
  nguon:
  - burger2009
  trich: Following the administration of the 150-volt punishment, the participant heard the learner's cries of protest through the wall.
  vi_tri: Mục Method (Burger mô tả lại Thí nghiệm 5)
  ket_qua: dung
  ghi_chu: Qua mô tả của Burger 2009; chưa mở sách Milgram 1974.
- id: n21
  cau: 'Thí nghiệm 1963 có 4 câu thúc ép, dùng theo đúng thứ tự: "Xin hãy tiếp tục"; "Thí nghiệm yêu cầu anh tiếp tục"; "Điều tuyệt đối cần thiết là anh phải tiếp tục"; "Anh không còn lựa chọn nào khác, anh phải tiếp tục".'
  loai: phat-hien
  nguon:
  - milgram1963
  trich: 'Prod 4: You have no other choice, you must go on. The prods were always made in sequence'
  vi_tri: Mục Procedure, Experimenter feedback
  ket_qua: dung
  ghi_chu: 'Prod 3 gốc: "It is absolutely essential that you continue"; trang dịch "Bắt buộc anh phải tiếp tục" (xấp xỉ, không sai nghĩa).'
- id: n22
  cau: 'Hai câu thúc ép đặc biệt: "Dù cú giật có thể đau, nó không gây tổn thương mô vĩnh viễn, xin anh tiếp tục" và "Dù học trò có muốn hay không, anh vẫn phải tiếp tục cho đến khi cậu ấy học thuộc hết các cặp từ".'
  loai: phat-hien
  nguon:
  - milgram1963
  trich: Whether the learner likes it or not, you must go on until he has learned all the word pairs correctly.
  vi_tri: Mục Procedure, Special prods
  ket_qua: dung
