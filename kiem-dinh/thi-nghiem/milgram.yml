  - id: n6
    cau: Ở nấc 300V, học trò đập vào tường và không trả lời nữa; người thí nghiệm bảo coi im lặng là trả lời sai, và khi người tham gia ngần ngại thì thúc ép lần lượt "Xin hãy tiếp tục", rồi "Thí nghiệm yêu cầu anh tiếp tục".
    loai: phat-hien
    nguon:
      - milgram1963
    trich: 'The experimenter instructs the subject to treat the absence of a response as a wrong answer … If the subject indicated his unwillingness to go on, the experimenter responded with a sequence of "prods" … Prod 1: Please continue … Prod 2: The experiment requires that you continue. … The prods were always made in sequence'
    vi_tri: 'Mục Procedure (tr. 374), Experimenter feedback'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (Tự trải nghiệm): "Ở nấc 150V, anh ta kêu đau và đòi dừng"; chữ mới: "Đến nấc 300V, anh ta đập vào tường và không trả lời nữa". Lý do: trong thiết kế 1963, "no vocal response or other sign of protest is heard from the learner until Shock Level 300"; kêu đau từ 150V là của Thí nghiệm 5 (Burger 2009). Review (Claude Opus 5.5, 30/10/2026): Đã đọc Milgram 1963 tr. 374: ở 300V người thí nghiệm bảo coi im lặng là trả lời sai; các câu thúc ép chỉ dùng khi người tham gia tỏ ý không muốn tiếp tục, theo thứ tự từ Prod 1 "Please continue"; giọng "firm, but not impolite". Câu cũ cho người thí nghiệm nói thẳng Prod 2 ở 300V, "đều đều". Đã sửa đoạn Tự trải nghiệm theo đúng trình tự (lượt 2 đúng).'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.psy.miami.edu/_assets/pdf/rpo-articles/milgram-1963.pdf" ]
    luot_2_ghi_chu: 'Phần đầu đúng (tr. 374). Bài không nói người thí nghiệm dùng đúng câu "Thí nghiệm yêu cầu anh tiếp tục" (Prod 2) ở 300V: ở đó ông bảo coi im lặng là trả lời sai; các câu thúc ép dùng khi người tham gia ngần ngại, bắt đầu từ Prod 1 "Xin hãy tiếp tục". Nên viết: "người thí nghiệm bảo coi im lặng là sai và, nếu người tham gia ngần ngại, thúc ép họ tiếp tục".'
    review: sai
