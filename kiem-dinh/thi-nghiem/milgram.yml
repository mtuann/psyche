      - burger2009
      - dolinski2017
      - perry2019
    ly_do: 'Nhiều nghiên cứu cùng chiều: tổng hợp 21 biến thể của Milgram (Meta-Milgram, 740 người, 43,6% đi đến nấc cuối) và hai lần làm lại hiện đại ở Mỹ và Ba Lan (Burger 2009; Doliński và cộng sự 2017) thấy mức vâng lời cao. Chưa đạt Vững chắc theo mục 4: tổng hợp chỉ gồm các biến thể nhỏ (20–40 người) của cùng một chương trình nghiên cứu, không phải phân tích tổng hợp các nghiên cứu độc lập; không có tái lập lớn đăng ký trước; hai lần làm lại đều dừng sớm vì đạo đức nên không đo đúng biến số gốc (đi đến 450V); và tư liệu lưu trữ (Perry 2019: 18/23 biến thể) cho thấy người không tin hẳn vào màn kịch giật mạnh hơn, nên độ lớn bị nghi phóng đại. Hướng của hiệu ứng thì nhất quán, nên Khá vững chứ không Đang tranh cãi.'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Milgram làm nhiều biến thể, và các nhà nghiên cứu khác ở nhiều nước, nhiều thập kỷ sau vẫn thu được… Đây là một trong những hiệu ứng được lặp lại nhiều nhất của tâm lý học xã hội"; chữ mới dùng 23 biến thể, hai lần làm lại, 43,6%. Đã bỏ câu so sánh "lặp lại nhiều nhất" (không nguồn) và "nhiều nước" (chỉ mở được Mỹ và Ba Lan). chỗ khó: thước đo Vững chắc đòi tái lập lớn không giảm nhẹ hay tổng hợp độc lập; ở đây chỉ có tổng hợp số liệu của chính Milgram và hai lần làm lại sửa đổi, cộng phê bình của Perry 2019. Người giao/lượt 2 cân nhắc hạ xuống Khá vững. Chỗ khó (Claude Opus 5.5): chốt hạ Vững chắc xuống Khá vững (lý do ở ly_do); sửa khung trên trang thành :::kha-vung và thêm câu "Vì sao chỉ khá vững" (n69). Hộp Tóm tắt nhanh dựng từ khung nên đổi theo. Trang khác link tới khung này: chưa kiểm (người giao xem o_dau). Review (Claude Opus 5.5, 30/10/2026): Nhãn Khá vững hợp mục 4: Meta-Milgram (21 điều kiện, 740 người, 43,6%) chỉ tổng hợp các biến thể nhỏ của một chương trình; hai lần làm lại hiện đại dừng sớm (150V, 10 nút); Perry và cộng sự 2019 (tóm tắt) cho thấy hoài nghi làm tăng mức giật, nên độ lớn bị nghi. Hướng nhất quán, nên không xuống Đang tranh cãi. Giữ việc hạ từ Vững chắc xuống Khá vững của lượt 1. ly_do sửa "Doliński 2017" thành "Doliński và cộng sự 2017".'
    luot_2: dung
    luot_2_nguon: [ "https://journals.plos.org/plosone/article/file?id=10.1371/journal.pone.0093927&type=printable", "https://ethics.moe.edu.tw/files/resource/teach/%E6%95%99%E5%AD%B8%E8%A7%80%E6%91%A9/104-01/B008/%E7%89%B9%E8%89%B2%E8%AA%B2%E7%A8%8B%E4%BA%8C/(d)Replicating%20Milgram.pdf", "https://api.openalex.org/works/doi:10.1177/1948550617693060" ]
    luot_2_ghi_chu: "Nhãn Khá vững hợp thước đo: nhiều nghiên cứu cùng chiều (các biến thể của Milgram, Burger 2009, Doliński và cộng sự 2017) nhưng chưa có tái lập lớn đăng ký trước, mẫu nhỏ, mức vâng lời khác nhau nhiều theo biến thể. Không cao hơn thước đo."
