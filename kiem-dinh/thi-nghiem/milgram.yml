  ket_qua: da-sua
  ghi_chu: 'Chỗ khó (Claude Opus 5.5): Người giao đã sửa hình: chữ cũ "100% đều đi đến 300V — nấc mà học trò đập tường đòi được thả" và "79% những người đã vượt qua 150V đều đi tiếp đến 450V" (dưới nhãn "Số liệu Milgram (1963)"); chữ mới "Cả 40 người đều đi đến 300V, nấc mà học trò đập vào tường và ngừng trả lời", bỏ dòng 79%. Lý do: bài 1963 không có lời "đòi được thả" (học trò đập tường, câu trả lời không còn hiện lên bảng); 79% (26/33) là của Thí nghiệm 5 (Burger 2009), không phải bài 1963 (số ấy vẫn ở khung Khá vững và câu hỏi 2, ghi đúng nguồn). Đã đối chiếu: 65%, 35%, 26/40, 14/40, 300–375V, "cả 40 người đến 300V" đúng với bài và Bảng 2. Hình nằm trong HINH_DA_SUA của tests/chuyen.test.mjs.'
