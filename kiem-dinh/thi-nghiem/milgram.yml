  - cu: 'Doliński và Grzyb (2017) (tiêu đề mục, câu dẫn, khung Khá vững); "Doliński và Grzyb ở Ba Lan"; mục Nguồn: "Doliński, D., & Grzyb, T. (2017). … Obedience to authority today"'
    moi: 'Doliński và cộng sự (2017) (tiêu đề giữ id cũ { #dolinski-va-grzyb-2017-lam-lai-o-ba-lan }); "nhóm của Doliński ở Ba Lan"; mục Nguồn: đủ bảy tác giả và tên bài đúng theo Crossref'
    ly_do: 'Review: bài có bảy tác giả; tên bài theo Crossref, OpenAlex (hồ sơ n32–n34, n52).'
