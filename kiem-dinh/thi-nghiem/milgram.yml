    ket_qua: da-sua
    ghi_chu: 'chỗ khó: chỉ mở được tóm tắt (Crossref) và thông cáo báo chí của SPSP (bậc 3, nhưng là thông cáo chính thức của hội xuất bản); chưa mở bài gốc nên "90%", "10 nút", "18–69" chỉ có từ thông cáo. Chữ cũ: "90% người tham gia bấm đến nút cao nhất trong 10 nút"; chữ mới thêm cỡ mẫu, thủ tục theo Burger. Người giao/lượt 2 tìm bản toàn văn. Thông tin trong nguon.yml (8(3), 282–289, không DOI) không khớp Crossref (8(8), 927–933, DOI 10.1177/1948550617693060): đã sửa ở danh sách nguồn của trang, nguon.yml (khóa) cần xem lại. Review (Claude Opus 5.5, 30/10/2026): OpenAlex và Crossref (DOI 10.1177/1948550617693060): bảy tác giả (Doliński, Grzyb, Folwarczny, Grzybała, Krzyszycha, Martynowska, Trojanowski), tên bài đúng là "Would you deliver an electric shock in 2015? Obedience in the experimental paradigm developed by Stanley Milgram in the 50 years following the original studies", 8(8), 927–933. Số liệu (80 người, 10 nút, 90%) khớp thông cáo SPSP và tóm tắt. Đã sửa "Doliński và Grzyb" thành "Doliński và cộng sự" ở tiêu đề mục (giữ id cũ), câu dẫn, khung nhãn, mục Văn hóa, và sửa cả tên bài, tác giả ở mục Nguồn của trang. src/data/nguon.yml (dolinski2017, chưa khóa) vẫn ghi sai tác giả, tên bài, số tập: ngoài phạm vi review, báo người giao.'
    luot_2: sai
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1177/1948550617693060", "https://www.spsp.org/news-center/press-releases/milgram-poland-obey" ]
    luot_2_ghi_chu: 'câu đúng: Doliński và cộng sự (2017) ở Ba Lan: 80 người (40 nam, 40 nữ, tuổi 18–69), 10 nút, cường độ giảm nhẹ vì lý do đạo đức; 90% bấm đến nút cao nhất.; Số liệu đúng (thông cáo của SPSP, hội xuất bản tạp chí; tóm tắt xác nhận mức vâng lời "similarly high"; chưa đọc được toàn văn, bài đóng). Sai ở tên tác giả: bài có bảy tác giả (Doliński, Grzyb, Folwarczny, Grzybała, Krzyszycha, Martynowska, Trojanowski), nên phải là "Doliński và cộng sự (2017)". Cùng lỗi ở n33, n34, n52.'
