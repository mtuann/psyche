  - id: n46
    cau: Khi chuyển ra văn phòng xập xệ ở Bridgeport, tỉ lệ vâng lời là 47,5%, so với 65% ở điều kiện tương ứng tại Yale; theo Milgram, mức giảm này không có ý nghĩa thống kê.
    loai: so-lieu
    nguon:
      - milgram1974
      - haslam2014meta
    trich: 48 percent of the Bridgeport subjects delivered the maximum shock versus 65 percent in the corresponding condition at Yale
    vi_tri: Milgram 1974, chương 6, Thí nghiệm 10 (Bridgeport); Meta-Milgram, Introduction
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "tỉ lệ vâng lời giảm từ 65% xuống 47,5%" (Vùng Việt Nam) và "chính Milgram thấy tỉ lệ vâng lời giảm khi chuyển… ra một văn phòng thuê ở Bridgeport". 65% là kết quả của bài 1963 (không có tiếng kêu), còn Bridgeport so với điều kiện tương ứng (62,5%). Bridgeport là "dingy office" theo Meta-Milgram; "văn phòng thuê" bỏ. Review (Claude Opus 5.5, 30/10/2026): Milgram 1974, Obedience to Authority, chương 6 Thí nghiệm 10 (toàn văn Internet Archive, ObedienceToAuthority_368): "48 percent of the Bridgeport subjects delivered the maximum shock versus 65 percent in the corresponding condition at Yale"; "although somewhat reduced, was not significantly lower than that obtained at Yale". Lượt 1 dùng 62,5% theo Meta-Milgram ("usually contrasted with the 62.5%"), nhưng chính Milgram so với 65%. Theo chữ của sách: 47,5% (19/40, sách làm tròn 48%) so với 65%, và mức giảm không có ý nghĩa thống kê. Đã sửa cả bốn chỗ (Lý thuyết, Áp dụng, Văn hóa, câu hỏi 5), thêm "không có ý nghĩa thống kê" ở mục Lý thuyết và lời giải thích câu hỏi 5, thêm Milgram 1974 vào mục Nguồn của trang và nguon của hồ sơ.'
    luot_2: sai
    luot_2_nguon: [ "https://archive.org/details/ObedienceToAuthority_368", "https://journals.plos.org/plosone/article/file?id=10.1371/journal.pone.0093927&type=printable" ]
