    moi: 47,5% so với 65% ở điều kiện tương ứng tại Yale; thêm "không có ý nghĩa thống kê" (Lý thuyết, lời giải thích câu hỏi 5) và (Milgram, 1974); mục Nguồn thêm Milgram (1974)
