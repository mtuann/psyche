    ghi_chu: 'Cũ: "Từ cũng nặng hơn chữ số … nên độ dài trí nhớ từ thường thấp hơn độ dài trí nhớ chữ số" (không tìm được nguồn trong lô; với từ một âm tiết tiếng Việt không chắc đúng). Viết lại thành suy luận từ hiệu ứng độ dài từ. chỗ khó: suy luận chưa được đo trên người Việt; "tên chữ số tiếng Việt một âm tiết" cùng câu với do-dai-tri-nho n16 (D8-L1, chưa chắc). Sau lượt 2 (Opus, 17/11/2026): bỏ dự đoán "độ dài trí nhớ từ và chữ số có thể không chênh nhiều" (không có nguồn; lượt 2 nêu chữ số thường quen hơn từ). Chỉ còn câu về chính site (TU trong tri-nho-tu.js: 40 từ một âm tiết; link trang chữ số), kiểm 17/11/2026. Review (17/11/2026): trang (Điều gì đang xảy ra?, Ở Việt Nam) và công cụ (mục So với độ dài trí nhớ chữ số) chỉ mời tự so, không còn dự đoán chênh lệch; TU đều một âm tiết; link /psyche/trai-nghiem/do-dai-tri-nho/ đúng. Khớp.'
    review: dung
