  ghi_chu: 'Câu hỏi 1 cũ hỏi "vì sao độ dài trí nhớ từ thường thấp hơn chữ số" (xem n2): viết lại. Sau lượt 2 (Opus, 17/11/2026): giữ câu hỏi 1–2 (nguyên văn ở tóm tắt); câu hỏi 3 (chỉ dùng từ một âm tiết
    để giữ độ dài như nhau) là lựa chọn thiết kế của site: lời giải thích không cần nguồn ngoài hiệu ứng độ dài từ.'
  luot_2: khong-chac
  luot_2_ghi_chu: Phụ thuộc Baddeley 1975 (chưa mở). Phần 'từ một âm tiết kiểm soát độ dài từ' là lựa chọn thiết kế của công cụ, có lý nhưng chưa có nguồn.
