    luot_2_ghi_chu: '''Số mục nhớ thay đổi theo loại mục'' khớp (đơn vị là chunk, từ dài kém hơn); xem n5 về nhiễu.'
  - id: n10
    cau: 'Ngộ nhận: phân tích tổng hợp 23 nghiên cứu (Melby-Lervåg và Hulme, 2013): luyện trí nhớ làm việc cải thiện ngắn hạn đúng kỹ năng đã luyện, không có bằng chứng thuyết phục là lan sang kỹ năng khác (cả câu hỏi 5).'
    loai: phat-hien
    nguon:
      - melby2013
    trich: Twenty-three studies with 30 group comparisons met the criteria for inclusion. … the programs produced reliable short-term improvements in working memory skills … there was no convincing evidence of the generalization of working memory training to other skills
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Cũ: "Chưa có bằng chứng … người ta thường chỉ giỏi hơn đúng nhiệm vụ đã luyện" (không nguồn). Thêm nguồn. Câu hỏi 5 mới thay câu hỏi về Cowan (thuộc trang nhà).'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1037/a0028228
    luot_2_ghi_chu: Bài xuất bản trực tuyến 2012, in năm 2013 (Developmental Psychology 49). 'Cải thiện ngắn hạn đúng kỹ năng đã luyện' khớp 'short-term, specific training effects'.
  - id: n11
    cau: 'Ngộ nhận: không nên kết luận "trí nhớ kém, kém thông minh" từ công cụ này: một lần làm trên công cụ chưa chuẩn hóa, và gom các từ thành cụm là đã nhớ được nhiều hơn (Miller, 1956).'
    loai: phat-hien
    nguon:
      - miller1956
    ket_qua: da-lam-mem
    ghi_chu: 'Cũ: "Độ dài trí nhớ chỉ là một mảnh nhỏ của nhận thức". Câu chung về đo lường, như do-dai-tri-nho (D8-L1); lượt 2 xem cần nguồn không. Sau lượt 2 (Opus, 17/11/2026): bỏ "một lần đo trên mạng chịu ảnh hưởng của mệt mỏi, mất tập trung, thiết bị" (không nguồn); giữ phần có nguồn (gom nhóm) và phần về chính site (công cụ chưa chuẩn hóa). Câu mới: cần lượt 2 bổ sung. [câu mới] Review: đạt (Claude Opus 5.5, 17/11/2026): câu trên trang chỉ còn phần có nguồn (gom nhóm, Miller 1956 theo hồ sơ trang nhà) và phần về chính công cụ. Câu hỏi 4 và khối "Vì sao con số của bạn có thể khác?" của công cụ vẫn nhắc mệt, mất tập trung: lời nhắc chung về một lần đo, như công cụ độ dài trí nhớ đã khóa (D8-L1); không coi là nhận định cần nguồn.'
    luot_2: dung
    trich: we can increase the number of bits of information that it contains simply by building larger and larger chunks
    vi_tri: Miller 1956 (hồ sơ tri-nho-lam-viec.yml n52)
    luot_2_nguon:
      - http://psychclassics.yorku.ca/Miller/
    luot_2_ghi_chu: 'Phần dẫn Miller đúng: gom thành cụm (mã hóa lại) giúp giữ được nhiều thông tin hơn. Phần ''công cụ chưa chuẩn hóa, một lần làm'' là câu về chính công cụ của site, hợp lý; không cần nguồn ngoài.'
  - id: n12
    cau: 'Câu hỏi 1, 2: hiệu ứng độ dài từ, dự đoán từ số từ đọc được trong khoảng 2 giây; câu hỏi 3: chỉ dùng từ một âm tiết để kiểm soát độ dài từ.'
    loai: phat-hien
    nguon:
      - btb1975
    trich: (3) Span could be predicted on the basis of the number of words which the subject can read in approximately 2 sec
    vi_tri: Baddeley, Thomson & Buchanan 1975, toàn văn (PDF labs.la.utexas.edu/gilden, 15 trang), tóm tắt, tr. 575
    ket_qua: da-sua
    ghi_chu: 'Câu hỏi 1 cũ hỏi "vì sao độ dài trí nhớ từ thường thấp hơn chữ số" (xem n2): viết lại. Sau lượt 2 (Opus, 17/11/2026): giữ câu hỏi 1–2 (nguyên văn ở tóm tắt); câu hỏi 3 (chỉ dùng từ một âm tiết để giữ độ dài như nhau) là lựa chọn thiết kế của site: lời giải thích không cần nguồn ngoài hiệu ứng độ dài từ. Review: đạt (Claude Opus 5.5, 17/11/2026): như n1, n4.'
    luot_2: khong-chac
    luot_2_ghi_chu: Phụ thuộc Baddeley 1975 (chưa mở). Phần 'từ một âm tiết kiểm soát độ dài từ' là lựa chọn thiết kế của công cụ, có lý nhưng chưa có nguồn.
