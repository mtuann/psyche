  - id: n4
    cau: 'Baddeley, Thomson và Buchanan (1975): độ dài trí nhớ tỉ lệ nghịch với độ dài từ; khi số âm tiết và âm vị giữ nguyên, từ đọc nhanh hơn được nhớ tốt hơn; số từ nhớ được dự đoán từ số từ đọc được trong khoảng 2 giây; ngăn nhẩm lặp làm hiệu ứng biến mất với trình bày bằng mắt.'
    loai: phat-hien
    nguon:
      - btb1975
    trich: (1) Memory span is inversely related to word length across a wide range of materials; (2) When number of syllables and number of phonemes are held constant, words of short temporal duration are better recalled than words of long duration; (3) Span could be predicted on the basis of the number of words which the subject can read in approximately 2 sec; (4) When articulation is suppressed by requiring the subject to articulate an irrelevant sound, the word length effect disappears with visual presentation, but remains when presentation is auditory.
    vi_tri: Baddeley, Thomson & Buchanan 1975, toàn văn (PDF labs.la.utexas.edu/gilden, 15 trang), tóm tắt, tr. 575
    ket_qua: da-sua
    ghi_chu: 'Cũ: "Số từ nhớ được xấp xỉ số từ đọc được" thành "dự đoán được từ" (đúng chữ "predicted"); "ngay cả khi … chỉ khác thời lượng đọc" viết lại theo ý (2). Sau lượt 2 (Opus, 17/11/2026): giữ. Review: đạt (Claude Opus 5.5, 17/11/2026): tự mở PDF, tóm tắt tr. 575: bốn kết quả (1)–(4) đúng như trich.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không mở được bài gốc 1975 nên các số liệu và thí nghiệm ngăn nhẩm lặp chưa xác nhận.
  - id: n5
    cau: 'Khá vững: dãy từ nhiều âm tiết thường nhớ được ít hơn dãy từ ngắn; Oberauer và cộng sự (2018) xếp hiệu ứng vào nhóm phát hiện ổn định ở nhiều ngôn ngữ nhưng cách giải thích còn tranh cãi; Guitard, Neath và Surprenant (2025): khi cân bằng thêm số từ láng giềng, hiệu ứng mất ở bài nhận diện thứ tự.'
    loai: nhan
    nguon:
      - oberauer2018
      - btb1975
    trich: Performance in verbal WM tasks decreases with increasing length of the items on a list. This word-length effect is robust when word length is manipulated through the number of syllables. | its interpretation remains controversial (Oberauer 2018, theo hồ sơ tri-nho-lam-viec.yml) | Experiment 2 found that when the short and long words were more fully equated, including being equated for orthographic and phonological neighborhood size, the word-length effect disappeared. (Guitard 2025, tóm tắt)
    vi_tri: Oberauer 2018 (theo hồ sơ tri-nho-lam-viec.yml n22, n26)
    nhan: kha-vung
    co_so:
      - oberauer2018
      - guitard2025
      - btb1975
    ly_do: 'Hiệu ứng lặp lại ở nhiều nghiên cứu và ngôn ngữ (Oberauer 2018), nhưng chưa có phân tích tổng hợp hay tái lập lớn có đăng ký trước được dẫn, và độ dài thường lẫn với yếu tố từ vựng: khi cân bằng các yếu tố ấy, hiệu ứng có thể mất (Guitard 2025). Theo đúng chữ của thước đo mục 4: Khá vững.'
    ket_qua: da-sua
    ghi_chu: 'Cũ: "độ dài trí nhớ từ thường thấp hơn chữ số" trong ý chính và "tái lập rộng rãi suốt nửa thế kỷ" (không nguồn). Bỏ phần chữ số (xem n2). Bỏ khung Khá vững "khoảng 4 cụm" (thuộc trang nhà, ở đó là Đang tranh cãi). Sau lượt 2 (Opus, 17/11/2026): theo câu đúng của lượt 2 (Khá vững), viết lại ý chính và thân khung. Lệch với trang nhà kham-pha/tri-nho/tri-nho-lam-viec (đã khóa), nơi khung Vững chắc "trí nhớ ngắn hạn cho lời nói phụ thuộc mạnh vào âm thanh của từ" gộp hiệu ứng độ dài từ: báo chủ repo, có thể cần mở khóa trang nhà. Câu mới: cần lượt 2 bổ sung. [câu mới] Sau lượt 2 bổ sung (người gộp quyết, áp dụng 17/11/2026): tách câu: Oberauer 2018 chỉ cho ý "ổn định, nhiều ngôn ngữ khi thay đổi số âm tiết"; ý "cách giải thích còn tranh cãi" quy cho Guitard và cộng sự 2025. Review: đạt (Claude Opus 5.5, 17/11/2026). Tự mở tóm tắt Guitard, Neath & Surprenant (Europe PMC; số in 2/2026): thí nghiệm 2 cân bằng cả số láng giềng chính tả và âm thì "the word-length effect disappeared" (bài nhận diện thứ tự). Oberauer 2018 (hồ sơ trang nhà, n26) cũng viết "its interpretation remains controversial", nên vế tranh cãi đúng với cả hai nguồn. co_so: tổng quan chuẩn mực (không phải phân tích tổng hợp hay tổng quan hệ thống), không tái lập lớn có đăng ký trước được dẫn, một nghiên cứu cân bằng kỹ làm hiệu ứng mất: đúng chữ Khá vững của mục 4. Lệch với khung Vững chắc của trang nhà đã khóa kham-pha/tri-nho/tri-nho-lam-viec (cùng hiệu ứng theo số âm tiết, căn cứ Oberauer 2018) và với độ dài trí nhớ D8-L1 (Vững chắc dựa trên Oberauer 2018): ghi vào báo cáo cho chủ repo quyết một cách dùng thống nhất; không sửa trang đã khóa.'
    luot_2: dung
    luot_2_nguon:
      - https://www.cns.nyu.edu/malab/static/files/publications/2018%20Oberauer%20et%20al..pdf
      - https://europepmc.org/article/PMC/PMC12956956
    luot_2_ghi_chu: 'Nhãn ''Khá vững'' hợp thước đo. Hiệu ứng theo số âm tiết ổn định và có ở nhiều ngôn ngữ (Oberauer, một tổng quan đồng thuận, không phải phân tích tổng hợp). Chưa tìm thấy phân tích tổng hợp hay tái lập lớn có đăng ký trước cho riêng hiệu ứng này. Các nghiên cứu cân bằng kỹ hơn (Jalbert 2011; Guitard 2025) cho thấy hiệu ứng có thể do yếu tố đi kèm. Nên sửa nhẹ câu chữ: Oberauer không viết rằng ''cách giải thích còn tranh cãi''; ý ấy có căn cứ ở Guitard và cộng sự (2025, phần tổng quan về mô hình chuẩn và các kết quả không lặp lại). Nên tách thành hai câu để khỏi hiểu là Oberauer nói. Bài Guitard đăng trực tuyến năm 2025, in trong số năm 2026.'
  - id: n6
    cau: 'Lý thuyết: yếu tố từ vựng và trí nhớ dài hạn (từ dài và ngắn khác nhau về số từ láng giềng; Guitard, Neath và Surprenant, 2025, cho rằng các yếu tố này, không phải thời gian đọc, có thể tạo ra hiệu ứng); gom nhóm giúp nhớ nhiều hơn (Miller, 1956).'
    loai: phat-hien
    nguon:
      - guitard2025
      - miller1956
    trich: most studies have confounded length with lexical and other long-term memory factors that covary with length … The results provide more evidence against the standard account of the word-length effect and instead are consistent with a growing body of work which shows that lexical and other long-term memory factors affect performance | we can increase the number of bits of information that it contains simply by building larger and larger chunks
    vi_tri: Guitard 2025, tóm tắt (OpenAlex); Miller 1956 (hồ sơ tri-nho-lam-viec.yml n52)
    ket_qua: da-sua
    ghi_chu: 'Cũ: "Suy giảm và nhiễu … những từ giống nhau dễ bị nhầm khi gõ lại", "Đây là lý do cùng một người có thể đạt cao hơn" (giữ, giả định minh họa). Sau lượt 2 (Opus, 17/11/2026): thay ý "nhiễu giữa các mục (Oberauer 2018)" (lượt 2 không xác nhận được nguồn cho cách gọi ấy) bằng cách giải thích từ vựng theo Guitard 2025. Câu mới: cần lượt 2 bổ sung. [câu mới] Review: đạt (Claude Opus 5.5, 17/11/2026): tóm tắt Guitard 2025: "most studies have confounded length with lexical and other long-term memory factors"; "có thể" giữ đúng mức thận trọng.'
    luot_2: dung
    luot_2_nguon:
      - https://europepmc.org/article/PMC/PMC12956956
      - http://psychclassics.yorku.ca/Miller/
    luot_2_ghi_chu: '''Thời gian đọc'' trong câu hiểu là thời gian phát âm hay nhẩm lại (articulation, rehearsal), tức mô hình chuẩn mà Guitard phản bác. Chữ ''có thể'' giữ đúng mức thận trọng của bài: kết quả chỉ ở bài nhận diện thứ tự (serial recognition), và tác giả tự nêu là còn những chiều chưa cân bằng.'
