    trich: 13 classic and contemporary effects across 36 independent samples totaling 6,344 participants | Anchoring - Babies Born … Proportion >0 (p<.05) 1.00 | Anchoring - Mt. Everest … 1.00 | Anchoring - Chicago … 1.00 | Anchoring - Distance to NYC … 1.00 | Tasks ordered from largest to smallest observed effect size
