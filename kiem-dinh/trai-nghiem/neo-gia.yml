    cau: 'Vững chắc: con số neo làm dịch chuyển ước lượng; Many Labs (36 mẫu, 6.344 người): bốn câu mỏ neo có hiệu ứng ở mọi mẫu, thuộc nhóm hiệu ứng lớn nhất; các phân tích tổng hợp (ví dụ trong quyết định pháp lý, Bystranowski và cộng sự, 2021) cũng thấy hiệu ứng rõ, dù độ lớn khác nhau nhiều giữa các nghiên cứu.'
    loai: nhan
    nguon:
