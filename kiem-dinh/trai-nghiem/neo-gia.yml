    nhan: tranh-cai
    co_so:
      - tversky1974
      - mussweiler1999
      - englich2006
    ly_do: Hai mô hình do hai nhóm tác giả đề xuất; bằng chứng cho mô hình tiếp cận chọn lọc chủ yếu từ chính nhóm đề xuất.
    ket_qua: da-lam-mem
    ghi_chu: 'chỗ khó: chưa tìm được tổng quan nói rõ tình trạng tranh luận; bài Mussweiler & Strack 1999 không mở được (chỉ tên bài), mô hình lấy theo Englich 2006. Cũ: "ta lục trong trí nhớ những lý do … dính lại". Sau lượt 2 (Opus, 17/11/2026): giữ "nhận ra nhanh hơn": toàn văn nói phân loại lý lẽ buộc tội nhanh hơn (tóm tắt chỉ nói "accessibility"). Review: đạt (Claude Opus 5.5, 17/11/2026): tự mở toàn văn, Nghiên cứu 4, tr. 195: "able to categorize incriminating arguments faster"; "nhận ra nhanh hơn" đúng ý.'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1177/0146167205282152
      - https://archive.org/details/DTIC_AD0767426
    luot_2_ghi_chu: 'chỗ khó: Tóm tắt nói ''accessibility ... higher'', không nói ''nhận ra nhanh hơn''. Điều chỉnh không đủ (Tversky-Kahneman) đã xác nhận ở bản 1973. Bài của Mussweiler và Strack chưa mở.'
  - id: n9
    cau: 'Ngộ nhận "mỏ neo chỉ có tác dụng khi con số có vẻ liên quan": không; số ngẫu nhiên vẫn tạo hiệu ứng, và Englich so mức đề nghị do xúc xắc quyết định với cùng mức do công tố đưa ra (một nghiên cứu khác, cùng hồ sơ) và không thấy hai loại khác nhau về tác dụng.'
    loai: phat-hien
    nguon:
      - englich2006
      - tversky1974
    trich: 'We again compared the present findings with those of the other study with identical materials but relevant anchors (Englich, 2006). Again, sentencing decisions in both anchor conditions differed for anchors determined at random (M = 5.28 vs. M = 7.81) and suggested by the prosecutor (M = 4.10 vs. M = 6.98). In a 2 (anchor: high vs. low) × 2 (source: random vs. prosecutor) ANOVA, only the main effects for anchor … and source … reached significance, F < 1 for the interaction.'
    vi_tri: Englich, Mussweiler & Strack 2006, toàn văn (PDF Internet Archive, bản in PSPB 32(2)), Nghiên cứu 3, tr. 193
    ket_qua: da-sua
    ghi_chu: 'chỗ khó: nhãn Đã bị bác bỏ cho một ngộ nhận; bằng chứng là vài nghiên cứu, không phải chuỗi kiểm tra chuyên đề. Cũ: "lý do hiệu ứng này đáng lo ngại trong đời sống (giá niêm yết, đàm phán…)" (không nguồn): bỏ. Sau lượt 2 (Opus, 17/11/2026): bỏ khung "Đã bị bác bỏ" (thước đo mục 4: nhãn ấy dành cho khẳng định mà các kiểm tra đủ mạnh liên tục thất bại hay bằng chứng gốc mất giá trị; đây là một ngộ nhận, không phải khẳng định đã được kiểm tra); nội dung chuyển thành một ý trong mục Ngộ nhận liên quan, loại phat-hien. Câu mới: cần lượt 2 bổ sung. [câu mới] Review: đạt (Claude Opus 5.5, 17/11/2026): bỏ khung Đã bị bác bỏ là đúng mục 4 (nhãn dành cho khẳng định đã kiểm tra mà thất bại). Tự mở toàn văn, tr. 193: "Again, sentencing decisions in both anchor conditions differed for anchors determined at random (M = 5.28 vs. M = 7.81) and suggested by the prosecutor (M = 4.10 vs. M = 6.98)", F < 1 cho tương tác; câu trên trang ("không thấy hai loại khác nhau về tác dụng") khớp.'
    luot_2: dung
    luot_2_nguon:
      - https://web.archive.org/web/20250802160412/https://homepages.se.edu/cvonbergen/files/2013/01/Playing-Dice-With-Criminal-Sentences_The-Influence-of-Irrelevant-Anchors-on-Experts-Judicial-Decision-Making.pdf
      - https://pubmed.ncbi.nlm.nih.gov/16382081/
      - https://www.hf.uni-koeln.de/data/dppsenglich/File/PDFSStudien/LawPol28.pdf
    luot_2_ghi_chu: 'Đọc toàn văn bài PSPB 2006 (32:188–200) qua bản lưu Wayback của bản PDF trên trang một giảng viên; bản này khớp tập và trang. Việc so sánh dựa trên một nghiên cứu khác dùng cùng hồ sơ (Englich, 2006, chưa công bố lúc ấy); Study 2 cũng có phép so sánh như vậy (F < 1 cho tương tác). Ghi thêm vào hồ sơ: bản thảo phân tích tổng hợp ''50 Years of Anchoring Effects'' (PsyArXiv, osf.io/teq7k) thấy mỏ neo từ số ngẫu nhiên nhìn chung có hiệu ứng nhỏ hơn hay bằng không. Câu của trang nói đúng về Englich và không khái quát rằng mọi số ngẫu nhiên đều có tác dụng như số liên quan, nên vẫn `dung`.'
