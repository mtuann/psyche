    nhan: vung-chac
    co_so:
      - klein2014
      - bystranowski2021
      - tversky1974
    ly_do: 'Một phân tích tổng hợp đã bình duyệt (Bystranowski 2021: 29 nghiên cứu, 93 cỡ hiệu ứng, N = 8.549) cộng tái lập lớn có kế hoạch đăng ký trước ở 36 mẫu nhiều nước (Many Labs 1), cùng chiều. Độ lớn dao động nhiều; biến thể (neo ngẫu nhiên, dưới ngưỡng) yếu hơn theo các bản thảo phân tích tổng hợp, không thuộc hiệu ứng chuẩn.'
    ket_qua: da-sua
    ghi_chu: 'chỗ khó: thước đo mục 4 đòi phân tích tổng hợp hay hai tái lập lớn có đăng ký trước; ở đây có một tái lập lớn (Many Labs 1), chưa tìm phân tích tổng hợp. Cũ: "hàng trăm nghiên cứu trên nhiều lĩnh vực — từ định giá, đàm phán, dự báo đến quyết định pháp lý" (không nguồn). Sau lượt 2 (Opus, 17/11/2026): hạ Vững chắc xuống Khá vững trên trang (thêm câu lý do). Câu mới: cần lượt 2 bổ sung; nếu lượt 2 tìm được phân tích tổng hợp đạt chuẩn thì có thể nâng lại. [câu mới] Sau lượt 2 bổ sung (người gộp quyết, áp dụng 17/11/2026): nhãn trở lại Vững chắc theo cau_dung; trang nói rõ độ lớn khác nhau nhiều giữa các nghiên cứu. Review: đạt (Claude Opus 5.5, 17/11/2026). co_so: phân tích tổng hợp đã bình duyệt Bystranowski 2021 (tóm tắt Europe PMC tự mở: 29 nghiên cứu, 93 cỡ hiệu ứng, N = 8.549, d = 0,58 và 0,91) cộng Many Labs 1 (36 mẫu): đạt Vững chắc theo mục 4. Thân khung nói rõ độ lớn khác nhau nhiều. Trang nhà linh-cam-va-xac-suat không có khung nhãn cho mỏ neo: không lệch.'
    luot_2: sai
    luot_2_nguon:
      - https://researchonline.lse.ac.uk/id/eprint/65158/
      - https://doi.org/10.1037/lhb0000438
      - https://doi.org/10.31234/osf.io/teq7k_v2
      - https://doi.org/10.31234/osf.io/wf2tn
    luot_2_ghi_chu: 'câu đúng: Vững chắc: con số neo làm dịch chuyển ước lượng; Many Labs (36 mẫu, 6.344 người): bốn câu mỏ neo có hiệu ứng ở mọi mẫu, thuộc nhóm hiệu ứng lớn nhất; các phân tích tổng hợp (ví dụ trong quyết định pháp lý, Bystranowski và cộng sự, 2021) cũng thấy hiệu ứng rõ, dù độ lớn khác nhau nhiều giữa các nghiên cứu.; Phần số liệu đúng: 36 mẫu, 6.344 người, bốn câu mỏ neo có hiệu ứng ở mọi mẫu (tỉ lệ 1.00), thuộc nhóm hiệu ứng lớn nhất (bốn câu mỏ neo chiếm bốn trong năm hiệu ứng lớn nhất). Many Labs 1 có kế hoạch đăng ký trước (osf.io/aBEsQ). Còn nhãn thì thấp hơn mức bằng chứng cho phép theo mục 4. Mỏ neo chuẩn (so với con số rồi ước lượng) đã có phân tích tổng hợp đã bình duyệt (Bystranowski và cộng sự 2021, Law and Human Behavior). Có thêm hai phân tích tổng hợp lớn ở dạng bản thảo: Röseler và cộng sự, k = 393, N = 17.708, g = 0,69; ''50 Years of Anchoring Effects'', 2.601 cỡ hiệu ứng, g = 0,83, vẫn lớn sau khi hiệu chỉnh thiên lệch xuất bản. Cộng thêm Many Labs 1 ở 36 mẫu nhiều nước, nên đạt điều kiện ''Vững chắc''. Lưu ý thêm vào hồ sơ: độ lớn dao động nhiều (I² khoảng 93%; Many Labs 1 thấy dị biệt lớn); các bản thảo phân tích tổng hợp thấy hiệu ứng yếu hơn hay bằng không với mỏ neo ngẫu nhiên, mỏ neo khác chiều đo, hay mỏ neo dưới ngưỡng ý thức (hai lần làm lại có đăng ký trước của mỏ neo dưới ngưỡng thất bại, JESP 2021). Các giới hạn này thuộc các biến thể, không thuộc hiệu ứng chuẩn mà câu nói tới. Đọc toàn văn Many Labs 1 (bản lưu ở LSE); hai bản thảo và Bystranowski chỉ đọc tóm tắt.'
