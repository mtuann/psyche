nhan_dinh:
- id: s1
  cau: 'Cách chơi: lưới 5×5 ô màu nhấp nháy, hai phiên bản xen kẽ, giữa mỗi lần đổi màn xám 250 ms; một ô đổi màu; bấm ô đã đổi; công cụ đo số chu kỳ và thời gian; nút "Tôi chịu, hiện đáp án".'
  loai: ve-site
  ket_qua: dung
  ghi_chu: Đã kiểm src/scripts/cong-cu/mu-thay-doi.js (N = 5, THOI_GIAN.xam 250, nút "Tôi chịu, hiện đáp án"), 16/11/2026; tests/trinh-duyet/kiem-cong-cu.mjs.
- id: n1
  cau: Bình thường, một thay đổi tạo ra tín hiệu chuyển động tại chỗ của nó và hệ thị giác hướng chú ý tới đó; màn xám xen giữa tạo tín hiệu chuyển động khắp màn hình, nhấn chìm tín hiệu thật; chú ý phải soát từng vùng, nên thay đổi lớn, lặp đi lặp lại vẫn có thể không thấy suốt nhiều giây.
  loai: phat-hien
  nguon:
  - rensink2005
  - rensink1997
  trich: Normally, a change produces a motion signal at its location. But when a blank field appears it produces motion signals throughout the display. If these global signals are strong enough they will overwhelm the local signals
  vi_tri: Rensink 2005, mục "Basic effect"
  ket_qua: dung
- id: n2
  cau: 'Rensink, O''Regan và Clark (1997): ảnh đời thực xen kẽ bản chỉnh sửa, giữa hai lần hiện có màn trống ngắn; thay đổi ở vùng được quan tâm phát hiện sau trung bình 4,7 giây, vùng ít được quan tâm 10,9 giây.'
  loai: so-lieu
  nguon:
  - rensink1997
  trich: changes in MIs were extremely difficult to see, requiring an average of 17.1 alternations (10.9 s) … Changes in CIs were noticed much more quickly, with an average of 7.3 alternations [4.7 seconds]
  vi_tri: Rensink 1997, Thí nghiệm 1
  ket_qua: dung
  ghi_chu: Cùng số dùng trong công cụ (NGHIEN_CUU.rensink1997 ở src/scripts/cong-cu/mu-thay-doi.js).
- id: n3
  cau: Có ảnh người xem cần hơn 80 lần đổi hình (khoảng 50 giây) mới nhận ra, dù thay đổi hiển nhiên khi đã thấy.
  loai: so-lieu
  nguon:
  - rensink1997
  trich: for some images observers required over 80 alternations (50 s) to identify a change that was obvious once noticed
  vi_tri: Rensink 1997, Thí nghiệm 1
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ (gạch đầu dòng thứ ba của mục 1997): "Có trường hợp thay đổi rất lớn vẫn mất 10–20 giây (20–40 chu kỳ) mới thấy — dù khi đã thấy, ai cũng bảo ''rõ thế mà''". Con số 10–20 giây là của bản tóm tắt Rensink 2005 (nay ở n4), "chu kỳ" nhầm với "lần đổi hình" (alternations); bài 1997 nói hơn 80 lần đổi hình (50 giây).'
- id: n4
  cau: Trong bản tóm tắt của chính tác giả (Rensink, 2005), mỗi ảnh hiện khoảng 0,5 giây, màn trống khoảng 0,25 giây; người xem đôi khi cần 10 hay 20 giây (20 hay 40 lần đổi hình) mới nhận ra thay đổi; hiệu ứng không phụ thuộc nhiều vào con số chính xác.
  loai: phat-hien
  nguon:
  - rensink2005
  trich: Each image is typically on for about half a second, while the blanks are on for a quarter second or so. (The strength of the effect does not depend greatly upon the exact durations used.) … observers sometimes requiring 10 or 20 seconds (20 or 40 alternations)
  vi_tri: Rensink 2005, mục "Basic effect" và chú thích Hình 1
  ket_qua: da-sua
  ghi_chu: Chuyển câu 10–20 giây về đúng nguồn (Rensink 2005), viết "lần đổi hình" thay cho "chu kỳ".
- id: n5
  cau: Trong thí nghiệm gốc năm 1997, mỗi ảnh hiện 240 ms, màn trống 80 ms, và mỗi ảnh hiện hai lần trước khi đổi.
  loai: so-lieu
  nguon:
  - rensink1997
  trich: Each image was displayed for 240 ms and each blank for 80 ms. Note that each image was presented twice before being switched.
  vi_tri: Rensink 1997, Phương pháp chung
  ket_qua: da-sua
  ghi_chu: Thêm "mỗi ảnh hiện hai lần trước khi đổi" (đúng thiết kế A, A, A', A').
- id: n6
  cau: Khi bỏ màn trống đi, người xem nhận ra thay đổi gần như ngay (trung bình 1,4 lần đổi hình, 0,9 giây), chứng tỏ chính màn trống là thứ gây ra hiện tượng.
  loai: so-lieu
  nguon:
  - rensink1997
  trich: identification required only 1.4 alternations (0.9 s) on average, showing that observers quickly noticed the changes
  vi_tri: Rensink 1997, Thí nghiệm 1, điều kiện không màn trống
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "thay đổi trở nên dễ thấy ngay lập tức". Chữ mới: "gần như ngay", kèm số của bài.'
- id: n7
  cau: 'Vững chắc: kỹ thuật nhấp nháy gây ra mù thay đổi; đã được quan sát trong nhiều nghiên cứu (tổng quan Rensink, 2002); thí nghiệm 1997 có một lần tái lập độc lập, trực tuyến, năm 2026 với 69 người, thời gian phát hiện 11,2 giây (vùng ít quan tâm) và 5,8 giây (vùng được quan tâm).'
  loai: nhan
  nguon:
  - rensink2002
  - ouattara2026
  trich: In the flicker condition, mean detection times for marginal interest changes (11.22 s) closely approximated the original values (10.9 s), and central interest changes (5.79 s) were also comparable to the original (4.7 s)
  vi_tri: Ouattara 2026, Thảo luận; Rensink 2002, tóm tắt ("under a variety of conditions observers are often unable to see large changes")
  nhan: vung-chac
  co_so:
  - rensink2002
  - ouattara2026
  ly_do: Tổng quan Annual Review (Rensink 2002) về nhiều phương pháp cho cùng hiện tượng; tái lập độc lập năm 2026 (N = 69, trực tuyến) cho kết quả gần bản gốc, d = 1,36 giữa có và không màn trống.
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Hiệu ứng đã được tái lập nhiều lần, kể cả trong một nghiên cứu tái lập trực tuyến năm 2026 …". Ouattara 2026 viết thí nghiệm gốc "have not been subject to systematic independent replication", nên câu "tái lập nhiều lần" cho chính thí nghiệm 1997 là sai; chữ mới tách hiện tượng (nhiều nghiên cứu) và thí nghiệm 1997 (một lần tái lập). chỗ khó: theo thước đo mục 4, vững chắc cần phân tích tổng hợp, tổng quan hệ thống hay hai tái lập lớn có đăng ký trước; ở đây là tổng quan tường thuật cộng một tái lập không rõ đăng ký trước. Lượt 2 (Opus) xét giữ vững chắc hay hạ khá vững.'
- id: n8
  cau: 'Đang tranh cãi: chú ý có phải là tất cả; Rensink và cộng sự (1997) cho rằng phải có chú ý mới thấy được thay đổi và người xem không bao giờ giữ một hình ảnh đầy đủ, chi tiết của cảnh; về sau giới nghiên cứu còn tranh luận điều gì có thể và không thể suy ra từ mù thay đổi.'
  loai: nhan
  nguon:
  - rensink1997
  - simons2005
  trich: Its counterintuitive nature has also engendered confusions about the kinds of inferences that legitimately follow from it. Here we discuss the legitimate and the erroneous inferences that have been drawn
  vi_tri: Simons & Rensink 2005, tóm tắt; Rensink 1997, tóm tắt
  nhan: tranh-cai
  co_so:
  - simons2005
  - rensink2002
  ly_do: Simons & Rensink 2005 (chính tác giả gốc) bàn các suy luận đúng và sai từ mù thay đổi, nhất là về việc não giữ bao nhiêu chi tiết; cách giải thích chưa thống nhất.
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Các tranh luận sau này bàn thêm vai trò của trí nhớ thị giác ngắn hạn và chiến lược soát khác nhau của từng người" (không có nguồn đã mở). Chữ mới viết theo tóm tắt Rensink 1997 và Simons & Rensink 2005. chưa chắc: lượt 2 xem toàn văn Simons & Rensink 2005 để chắc tranh luận chính là về độ chi tiết của biểu diễn.'
- id: s2
  cau: 'Vì sao con số khác: một ô đổi màu trên lưới 25 ô đơn giản, nghiên cứu gốc dùng ảnh đời thực nhiều loại thay đổi; màn hình, độ sáng, khoảng cách nhìn ảnh hưởng; chế độ giảm chuyển động làm mỗi phiên bản hiện lâu hơn.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm src/scripts/cong-cu/mu-thay-doi.js (giamChuyenDong: thời gian gấp đôi), 16/11/2026; nghiên cứu gốc dùng 48 ảnh đời thực, ba loại thay đổi (Rensink 1997, Phương pháp chung: khớp).'
- id: s3
  cau: 'Công cụ, cảnh báo: màn hình nhấp nháy liên tục (mỗi phiên bản hiện nửa giây, xen giữa là màn xám một phần tư giây); ai nhạy cảm với ánh sáng nhấp nháy (như động kinh nhạy sáng) thì bỏ qua công cụ.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm src/scripts/cong-cu/mu-thay-doi.js (THOI_GIAN: hiện 500 ms, xám 250 ms), 16/11/2026. Lời cảnh báo là thận trọng, không phải nhận định y khoa; review xét có cần nguồn (hướng dẫn WCAG 2.3.1: không quá ba lần chớp mỗi giây; ở đây khoảng 2,7 lần đổi màn mỗi giây tính cả màn xám).'
