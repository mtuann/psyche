  vi_tri: Kết quả; Giới thiệu
  ket_qua: da-lam-mem
  ghi_chu: 'Cũ: "hầu hết mọi người đoán … số chẵn, mỗi số hơn số trước 2" và "càng thử họ càng tin". Mới: "nhiều người đoán một quy tắc hẹp hơn", "thường nêu quy tắc sai chỉ sau vài lần thử" (như trang
    nhà thien-kien-xac-nhan đã khóa).'
  luot_2: dung
