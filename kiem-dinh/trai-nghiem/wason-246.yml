    conform to the rule or not | the concept to be attained is "three numbers in increasing order of magnitude."
  vi_tri: Phương pháp
  ket_qua: da-sua
  ghi_chu: 'Cũ: "được yêu cầu ghi lại các giả thuyết". Mới: viết dãy kèm lý do; nêu sai thì thử tiếp.'
  luot_2: dung
  luot_2_nguon:
  - https://archive.org/details/FailureToEliminateHypothesisInAConceptualTask
