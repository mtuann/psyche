- id: n6
  cau: Gần như mọi quy tắc sai đều hẹp hơn quy tắc thật; ở người nêu sai ngay lần đầu, chỉ 4% số dãy thử trước đó không tuân theo quy tắc thật, so với 21% ở 6 người nêu đúng ngay; dãy có thể bác bỏ phỏng
    đoán hẹp (như 2–3–4 với "cộng 2") hiếm khi được thử.
  loai: so-lieu
  nguon:
  - wason1960
  trich: The ratio of the number of negative instances of the correct rule to the total number of instances generated was computed for each subject, (i) up to the first rule announced … The mean ratio was
    0.21 (n = 6) for those who made the immediate correct announcement and 0.04 (n = 22) for those who made a first incorrect announcement.
  vi_tri: Kết quả
  ket_qua: da-sua
  ghi_chu: 'Cũ: "Những dãy có thể bác bỏ giả thuyết — như dãy gồm số lẻ tăng dần — hiếm khi được thử": sai, dãy số lẻ tăng đều 2 (1–3–5) vẫn khớp phỏng đoán "cộng 2", không bác bỏ được. Mới: ví dụ 2–3–4
    và số liệu tỉ lệ dãy không tuân theo (có ở trang nhà).'
  luot_2: dung
  luot_2_nguon:
  - https://archive.org/details/FailureToEliminateHypothesisInAConceptualTask
  luot_2_ghi_chu: Đây là tỉ số trung bình dãy không tuân theo quy tắc thật trên tổng số dãy trước lần nêu đầu; '4%' là trung bình của nhóm 22 người (13 + 9). Wason ghi 'nearly all incorrect rules were sufficient'
    và rằng chỉ một ví dụ dương tính không tương thích mới bác được quy tắc đủ.
