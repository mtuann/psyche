- id: n2
  cau: Nhiều người đoán một quy tắc hẹp hơn quy tắc thật (ví dụ "mỗi số hơn số trước 2 đơn vị"), thử 8–10–12, 20–22–24, đều "đúng", và thường nêu quy tắc sai sau vài lần thử; các dãy ấy phù hợp với cả phỏng
    đoán sai lẫn quy tắc thật.
  loai: phat-hien
  nguon:
  - wason1960
  trich: (In nearly all cases incorrect rules were sufficient ones, e.g. "increasing intervals of two.") | the strategy of using only sets of successive even numbers would not reveal the incorrectness of
