- id: n3
  cau: 'Thiên kiến xác nhận thường không phải cố tình tự lừa dối: Nickerson (1998) mô tả nó là sự chọn lọc không chủ ý trong việc thu thập và dùng bằng chứng.'
  loai: dinh-nghia
  nguon:
