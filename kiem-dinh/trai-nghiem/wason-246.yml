- id: n4
  cau: Wason cho mỗi người xem dãy 2–4–6, nói nó tuân theo một quy tắc; người tham gia viết từng dãy kèm lý do, được báo dãy có tuân theo không, chỉ nêu quy tắc khi rất tự tin, nêu sai thì được báo rồi
    thử tiếp; quy tắc thật là ba số tăng dần bất kỳ.
  loai: phat-hien
