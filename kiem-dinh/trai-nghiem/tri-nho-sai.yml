  cau: 'Công cụ, mục So với nghiên cứu gốc: 36 sinh viên nghe 6 danh sách 12 từ; nhớ ra từ mồi ở 40% số danh sách; thí nghiệm 2 (15 từ) 55%; bài nhận diện thí nghiệm 1: 84% so với 86%.'
  loai: cong-cu
  nguon:
