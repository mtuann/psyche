nhan_dinh:
- id: s1
  cau: 'Cách chơi: 12 từ hiện lần lượt; 18 từ kiểm tra, "Đã thấy" (phím D) hay "Chưa thấy" (phím C); 12 từ đã học, 5 từ nhiễu và một từ đặc biệt.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: Đã kiểm src/scripts/cong-cu/tri-nho-sai.js (DANH_SACH, baiKiemTra, phím D/C qua batPhimTat), 17/11/2026; tests/cong-cu.test.mjs, tests/trinh-duyet/kiem-cong-cu.mjs.
- id: s2
  cau: 'Công cụ: mỗi từ hiện 1,2 giây, nghỉ 0,3 giây; danh sách tiếng Việt do site soạn theo mẫu danh sách "sleep" của bài gốc, chưa chuẩn hóa độ mạnh liên tưởng; lời "minh họa, không phải bài kiểm tra
    trí nhớ".'
  loai: ve-site
  ket_qua: da-sua
  ghi_chu: 'Đã kiểm DANH_SACH trong tri-nho-sai.js, 17/11/2026. Danh sách cũ có "buồn ngủ" (chứa đúng từ mồi "ngủ"): đã thay bằng "chợp mắt"; kiểm thử chặn từ mồi nằm trong từ đã học.'
- id: n1
  cau: Các từ cùng chủ đề (giường, gối, mơ…) kích hoạt cả từ gắn với chủ đề ("ngủ"); lúc kiểm tra, người ta không phân biệt được "đã thấy" với "đã nghĩ đến" (cách giải thích phổ biến).
  loai: phat-hien
  nguon:
  - gallo2010
  trich: Some evidence that supports the associative activation theory is (1) the strong positive correlation between the degree of associative strength and the level of false memory across DRM lists …
    According to the source-monitoring framework, all false memories reflect a breakdown of source monitoring
  vi_tri: Gallo 2010, mục "Theories"
  ket_qua: dung
  ghi_chu: Đoạn "Điều gì đang xảy ra?" giữ chữ cũ; "cách giải thích phổ biến" khớp khung kích hoạt/giám sát mà Gallo mô tả.
- id: n2
  cau: Roediger và McDermott (1995) dựa trên nghiên cứu của Deese (1959), cho sinh viên nghe các danh sách 12 từ cùng gợi về một từ mồi không xuất hiện (bed, rest, awake… → sleep), rồi nhớ lại ngay sau
    mỗi danh sách.
  loai: phat-hien
  nguon:
  - roediger1995
  - deese1959
  trich: Two experiments (modeled after J. Deese's 1959 study) … subjects studied lists of 12 words (e.g., bed, rest, awake); each list was composed of associates of 1 nonpresented word (e.g., sleep). |
    the lists were read aloud by the experimenter | Subjects were given 2.5 min to recall each
  vi_tri: Tóm tắt; Thí nghiệm 1, Phương pháp
  ket_qua: da-sua
  ghi_chu: 'Cũ: "cho người học các danh sách" (không nói nghe đọc to, nhớ lại sau mỗi danh sách). Mới: "cho sinh viên nghe … rồi nhớ lại ngay sau mỗi danh sách".'
- id: n3
  cau: Khi nhớ lại tự do, người tham gia "nhớ" ra từ mồi ở 40% số danh sách (thí nghiệm 1); với danh sách 15 từ, 55% (thí nghiệm 2).
  loai: so-lieu
  nguon:
  - roediger1995
  trich: On immediate free recall tests, the nonpresented associates were recalled 40 % of the time | For each of 24 target words, 15 associates were selected for the list. | Subjects recalled the critical
    nonpresented word on 55% of the lists
  vi_tri: Tóm tắt; Thí nghiệm 2, Vật liệu và Kết quả
  ket_qua: dung
- id: n4
  cau: 'Ở bài nhận diện sau đó, tỉ lệ nhận nhầm từ mồi gần bằng tỉ lệ nhận đúng từ đã học (thí nghiệm 1: 84% so với 86%).'
  loai: so-lieu
  nguon:
  - roediger1995
  trich: the false-alarm rate for the critical nonstudied lures (.84) approached the hit rate (.86)
  vi_tri: Thí nghiệm 1, Kết quả, Bảng 1
  ket_qua: da-sua
  ghi_chu: 'Cũ: "có khi cao ngang". Mới nêu số của thí nghiệm 1 (đánh giá 3 hay 4).'
- id: n5
  cau: Ở thí nghiệm 2, phần lớn những lần nhận nhầm từ mồi được đánh giá là "nhớ rõ" (remember) chứ không chỉ "thấy quen" (know).
  loai: phat-hien
  nguon:
  - roediger1995
  trich: after recalling the lists subjects were much more likely to say that they remembered the items from the list, with remember judgments being made 72% of the time (i.e., .58 ÷ .81 × 100) for words
    that had never been presented … When the lists were presented but not recalled, the rate of remember judgments dropped to 53%
  vi_tri: Thí nghiệm 2, Kết quả, Bảng 2
  ket_qua: da-sua
  ghi_chu: 'Cũ: "người ta còn nhớ cả khoảnh khắc mình đã thấy từ đó" (không nói thí nghiệm nào). Mới gắn với thí nghiệm 2, phân biệt remember/know.'
- id: n6
  cau: 'Vững chắc: học các từ cùng chủ đề có thể khiến ta "nhớ" một từ chưa từng thấy.'
  loai: nhan
  nguon:
  - gallo2010
  - zwaan2018
  - roediger1995
  trich: This memory illusion is difficult for people to avoid and has been used in hundreds of studies | These DRM relatedness effects have persisted across a variety of encoding tasks, retention intervals,
    and test formats. They have also been observed in a variety of populations, including the young, the old, the neurologically impaired, and people with different languages and cultures. | the first preregistered
    replication of a large set of cognitive psychological effects … 5 False memories … Roediger and McDermott (1995)
  vi_tri: Gallo 2010, mục "Establishing the illusion"; Zwaan 2018, Bảng 1
  nhan: vung-chac
  co_so:
  - gallo2010
  - zwaan2018
  ly_do: 'Tổng quan (Gallo, 2010): hiệu ứng bền qua cách học, thời gian chờ, kiểu kiểm tra, nhóm tuổi, ngôn ngữ và văn hóa, dùng trong hàng trăm nghiên cứu; một lần làm lại có đăng ký trước (Zwaan và cộng
    sự, 2018) tái lập được.'
  ket_qua: da-sua
  ghi_chu: 'chỗ khó: thước đo mục 4 đòi phân tích tổng hợp hay hai tái lập lớn có đăng ký trước; ở đây là một tổng quan tường thuật cộng một tái lập có đăng ký trước (trên mạng). Cũ: "một trong những ảo
    giác trí nhớ mạnh nhất", "Tỉ lệ nhớ nhầm thường đạt 40–80% tùy thiết kế" (không tìm được nguồn cho khoảng 40–80%): đã bỏ, thay bằng "thay đổi nhiều theo danh sách và cách làm".'
- id: n7
  cau: 'Đang tranh cãi: cơ chế chính xác (kích hoạt theo liên tưởng, ý chính/thuyết vết mờ, giám sát nguồn); theo Gallo, các cách giải thích khó tách, không loại trừ nhau, mỗi cách có bằng chứng riêng.'
  loai: nhan
  nguon:
  - gallo2010
  trich: The associative-activation and gist theories are difficult to tease apart in practice, but these processes are not mutually exclusive, and there is evidence that uniquely supports each.
  vi_tri: Gallo 2010, mục "Theories"
  nhan: tranh-cai
  co_so:
  - gallo2010
  ly_do: Tổng quan nêu hai nhóm lý thuyết chính, mỗi nhóm có bằng chứng riêng, chưa tách được.
  ket_qua: da-sua
  ghi_chu: 'Cũ: "sự mờ nhòe của dấu vết trí nhớ … tranh luận vẫn tiếp tục". Mới gọi đúng tên các lý thuyết theo Gallo.'
- id: n8
  cau: Nghiên cứu gốc dùng nhiều danh sách trên hàng chục người (36 người ở thí nghiệm 1, 30 người ở thí nghiệm 2).
  loai: so-lieu
  nguon:
