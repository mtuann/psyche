  cau: Thí nghiệm 2 của bản gốc còn hỏi người tham gia có "nhớ" khoảnh khắc thấy từ hay chỉ "biết" nó quen; trong thí nghiệm 1 bài nhận diện đến sau các lần nhớ lại.
  loai: phat-hien
