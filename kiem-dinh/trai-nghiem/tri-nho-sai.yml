    ket_qua: da-sua
    ghi_chu: 'Cũ: "sự mờ nhòe của dấu vết trí nhớ … tranh luận vẫn tiếp tục". Mới gọi đúng tên các lý thuyết theo Gallo. Sau lượt 2 (Opus, 17/11/2026): giữ vế "theo Gallo": nguyên văn ở tr. 836 (lượt 2 không mở được Gallo). Review: đạt (Claude Opus 5.5, 17/11/2026): tự mở Gallo 2010, tr. 836: "difficult to tease apart in practice, but these processes are not mutually exclusive, and there is evidence that uniquely supports each".'
