- id: n3
  cau: Mọi người thỏa (B) đều thỏa (A), nên xác suất của (B) không thể lớn hơn của (A); thêm một chi tiết chỉ có thể giữ nguyên hay làm giảm xác suất.
  loai: dinh-nghia
  nguon:
  - tversky1983
  trich: 'the conjunction rule: The probability of a conjunction, P(A&B), cannot exceed the probabilities of its constituents, P(A) and P(B)'
