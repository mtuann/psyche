- id: n11
  cau: 'Đang tranh cãi: vì sao ta mắc bẫy; Gigerenzer phản biện rằng nhiều "lỗi" không vi phạm lý thuyết xác suất nếu phân biệt xác suất một trường hợp với tần suất; Hertwig và cộng sự (theo Chandrashekar
    và cộng sự, 2021) cho rằng người trả lời có thể hiểu từ "xác suất" và chữ "và" khác nghĩa toán học; một số tác giả khác (theo Hertwig và Gigerenzer, 1999) cho rằng người ta hiểu (A) thành "nhân viên
    ngân hàng và không hoạt động nữ quyền"; các dự đoán của giả thuyết ấy chưa được xác nhận.'
  loai: nhan
  nguon:
  - gigerenzer1991
  - chandrashekar2021
  - hertwig1999
  trich: several researchers (e.g. Adler, 1984, 1991; Dulany and Hilton, 1991; Politzer and Noveck, 1991) argued that participants interpret the hypothesis "Linda is a bank teller" to mean "Linda is a bank
    teller and is not active in the feminist movement" (Hertwig & Gigerenzer 1999, tr. 296, theo lượt 2 bổ sung) | None … have been corroborated | found no support for semantic ambiguity (Chandrashekar
    2021)
  vi_tri: (câu trích như hồ sơ đã khóa linh-cam-va-xac-suat.yml, khung tranh-cai của trang nhà)
  nhan: tranh-cai
  co_so:
  - gigerenzer1991
  - chandrashekar2021
  - hertwig1999
  ly_do: 'Như trang nhà: phản biện và một lần làm lại có đăng ký trước cho kết quả không đồng nhất (Linda có hiệu ứng, James thì không).'
  ket_qua: da-sua
  ghi_chu: 'Cũ gán cho Gigerenzer luận điểm "vi phạm nguyên tắc hội thoại"; tóm tắt Gigerenzer 1991 nói về một trường hợp so với tần suất; cách hiểu (A) là "không phải nhà hoạt động nữ quyền" là một dạng
    của cách hiểu từ ngữ (theo trang nhà). Đổi cả câu hỏi 5. Sau lượt 2 (Opus, 17/11/2026): tách vế quy cho Gigerenzer (chỉ còn ý trong tóm tắt Gigerenzer 1991: một trường hợp so với tần suất) với vế cách
    hiểu từ ngữ (quy cho Hertwig, theo Chandrashekar 2021, như trang nhà). Sửa cả mục Lý thuyết và câu hỏi 5. Câu mới: cần lượt 2 bổ sung. [câu mới] Sau lượt 2 bổ sung (người gộp quyết, áp dụng 17/11/2026):
    sửa theo cau_dung: quy cách hiểu "không hoạt động nữ quyền" cho Adler, Dulany & Hilton, Politzer & Noveck (theo Hertwig & Gigerenzer 1999), ghi chưa được xác nhận; thêm kết quả làm lại của Chandrashekar
    2021. Câu hỏi 5 chỉ nói phần Gigerenzer 1991, không cần sửa.'
  luot_2: sai
  luot_2_nguon:
  - https://www.csc2.ncsu.edu/faculty/mpsingh/local/Social/f24/wrap/readings/Gigerenzer-on-Kahneman+Tversky-1991.pdf
  - https://open.lnu.se/index.php/metapsychology/article/view/2474
  - https://pages.ucsd.edu/~scoulson/203/gigerenzer1.pdf
  luot_2_ghi_chu: 'câu đúng: Đang tranh cãi: vì sao ta mắc bẫy; Gigerenzer phản biện rằng nhiều "lỗi" không vi phạm lý thuyết xác suất nếu phân biệt xác suất một trường hợp với tần suất; Hertwig và cộng
    sự (theo Chandrashekar và cộng sự, 2021) cho rằng người trả lời có thể hiểu từ "xác suất" và chữ "và" khác nghĩa toán học; một số tác giả khác (theo Hertwig và Gigerenzer, 1999) cho rằng người ta hiểu
    (A) thành "nhân viên ngân hàng và không hoạt động nữ quyền".; Phần Gigerenzer đúng (đã đọc chính bài 1991). Phần Hertwig về ''xác suất'' và ''và'' đúng theo Chandrashekar 2021 và theo chính bài Hertwig
    & Gigerenzer 1999. Chỗ sai là ví dụ trong ngoặc. Cách hiểu ''nhân viên ngân hàng'' thành ''nhân viên ngân hàng và không hoạt động nữ quyền'' (hàm ý hội thoại) không phải lập luận về nghĩa của ''xác
    suất'' hay ''và''. Nó cũng không phải của Hertwig: Hertwig & Gigerenzer 1999 ghi là của Adler, Dulany & Hilton, Politzer & Noveck, và viết rằng các dự đoán theo giả thuyết ấy (Agnoli & Krantz 1989)
    ''None ... have been corroborated''. Ngoài ra, viết ''hiểu (A) thành "không phải nhà hoạt động nữ quyền"'' là thiếu vế ''nhân viên ngân hàng và''. Nhãn ''Đang tranh cãi'' cho câu hỏi vì sao ta mắc bẫy
    thì hợp. Ghi thêm: lần làm lại có đăng ký trước của Chandrashekar 2021 (N = 1.032) ''found no support for semantic ambiguity''. Không mở được bài Gigerenzer 1996 và Kahneman & Tversky 1996, không cần
    cho câu này.'
- id: n12
  cau: 'Thay thế thuộc tính (Kahneman, 2011): khi câu hỏi khó, ta thường trả lời một câu dễ hơn mà không để ý mình đã đổi câu hỏi (cả câu hỏi 3).'
  loai: phat-hien
  nguon:
  - kahneman2002
  - kahneman2011
  trich: when faced with a difficult question, we often answer an easier one instead, usually without noticing the substitution.
  vi_tri: Kahneman 2011 (bản quét Internet Archive; theo hồ sơ trang nhà linh-cam-va-xac-suat.yml n70)
  ket_qua: da-lam-mem
  ghi_chu: 'Cũ: "não tự động trả lời … mà ta không hề hay biết … đầy sức thuyết phục". Sau lượt 2 (Opus, 17/11/2026): giữ, vì câu là lời quy cho chính Kahneman ("Theo Kahneman (2011)"): sách của ông là
    nguồn gốc của chính quan điểm ấy, và hồ sơ trang nhà đã khóa có câu trích từ bản quét. Lô không mở được Kahneman & Frederick (2002) (mạng lỗi ngày 17/11/2026): lượt 2 bổ sung nên mở bài ấy; không mở
    được thì bỏ ý Thay thế thuộc tính và câu hỏi 3. Sau lượt 2 bổ sung (người gộp quyết, áp dụng 17/11/2026): thêm Kahneman & Frederick (2002) làm nguồn của khái niệm thay thế thuộc tính, trên trang và
    trong mục Nguồn.'
  luot_2: dung
  luot_2_nguon:
  - https://cdn2.psychologytoday.com/assets/model_of_heuristic_judgment.pdf
  - https://www.nobelprize.org/uploads/2018/06/kahnemann-lecture.pdf
  luot_2_ghi_chu: Nội dung đúng với định nghĩa của chính tác giả. Không mở được sách Thinking, Fast and Slow (2011) để đối chiếu chữ. Khái niệm do Kahneman & Frederick (2002) đặt tên; nếu trang chỉ dẫn
    Kahneman (2011) thì nên thêm Kahneman & Frederick (2002) làm nguồn gốc. Bài gốc viết 'may' hay 'sometimes'; chữ 'thường' của trang hơi mạnh hơn nhưng vẫn chấp nhận được (cùng câu ấy viết 'often unaware').
    Phần 'cả câu hỏi 3' là chuyện của site.
