  ket_qua: da-sua
  ghi_chu: 'Quy tắc xác suất. Công cụ cũ: "mỗi chi tiết … chỉ có thể làm nó khó đúng hơn" (sai khi xác suất giữ nguyên): sửa thành "giữ nguyên hay làm giảm".'
- id: n4
  cau: Theo cách giải thích của Tversky và Kahneman, ta không thật sự so hai xác suất mà so độ "giống Linda"; (B) nghe giống hơn.
