    ghi_chu: 'Là cách giải thích của tác giả; trang xếp vào "Các lý thuyết giải thích" và nói các cách không loại trừ nhau. Giải quyết sau lượt 2 (Claude Opus 5.5, 16/11/2026): lượt 2 qua-manh, đồng ý: Chen & Aimola Davies (Perception, công bố trực tuyến 12/2025; lượt 2 ghi 2026), 145 người: "a strong local-processing bias reduced susceptibility … Our findings did not support this proposal … the participants with the stronger local-processing bias were the participants with greater susceptibility". Câu mới nêu là giả thuyết và thêm nghiên cứu này; viết khác cau_dung (năm 2025 theo Crossref): review xem. review: đạt (Claude Opus 5.5, 17/11/2026). Đã mở tóm tắt (OpenAlex) và siêu dữ liệu Crossref: công bố trực tuyến 9/12/2025 (issued 2025), số in 55(4), tháng 4/2026; 145 người (87 trẻ, 58 lớn tuổi); "the young and older participants with the stronger local-processing bias were the participants with greater susceptibility to the illusion". Câu trên trang ("công bố năm 2025", "người thiên về chi tiết cục bộ lại bị lừa nhiều hơn") khớp nguồn và cụ thể hơn cau_dung ("bằng chứng không nhất quán"), không mạnh hơn: một nghiên cứu, nêu đúng là một nghiên cứu. Năm trong danh sách Nguồn theo Crossref (2025).'
    luot_2: qua-manh
    luot_2_nguon:
      - https://doi.org/10.1177/03010066251395949
      - https://doi.org/10.1037/0096-1523.33.3.738
    luot_2_ghi_chu: 'câu đúng: Một giả thuyết cho rằng người chú ý chi tiết cục bộ ít bị lừa hơn, phù hợp với phát hiện ở người Himba; nhưng ở cấp cá nhân bằng chứng không nhất quán (một nghiên cứu năm 2026 không ủng hộ).; chỗ khó: bằng chứng ở cấp cá nhân mâu thuẫn; chỉ có bằng chứng cấp nhóm (Himba) ủng hộ.'
