  - id: n12
    cau: Delboeuf và Ebbinghaus đều là ảo giác về kích thước vòng tròn nhưng là hai hình khác nhau (Delboeuf dùng vòng tròn đồng tâm, Ebbinghaus đặt vòng tròn ở giữa các vòng khác); cả hai có thể làm vòng trung tâm trông to hơn hay nhỏ hơn tùy kích thước và khoảng cách của vòng bao quanh.
    loai: dinh-nghia
    nguon:
      - roberts2005
      - mruczek2015
      - urale2023
    trich: the Delboeuf illusion (see Figure 1), another size-perception illusion that uses a circular ring that surrounds the target stimulus instead of multiple circular inducers … both inducers and annuli made the target appear smaller at farther distances compared to closer distances
    vi_tri: Urale & Schwarzkopf 2023, Giới thiệu (kể cả kết quả của Roberts 2005); Mruczek 2015, Giới thiệu
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Delboeuf … mỗi bên chỉ có một vòng bao quanh đồng tâm (vòng trong nhìn to hơn khi vòng ngoài ở gần nó). Ebbinghaus dùng nhiều vòng bao quanh." Chi tiết hình Delboeuf không có trong nguồn đã mở; chữ mới chỉ nói điều Mruczek 2015 xác nhận (tương phản và đồng hóa, năm 1892). chưa chắc: Mruczek liệt kê "size-contrast and size-assimilation illusions such as …" theo thứ tự, gán Ebbinghaus là tương phản (khớp tên "size contrast" ở nhiều nguồn), Delboeuf là đồng hóa; lượt 2 kiểm thêm. Giải quyết sau lượt 2 (Claude Opus 5.5, 16/11/2026): lượt 2 qua-manh, đồng ý: chia "Ebbinghaus tương phản, Delboeuf đồng hóa" quá đơn giản; Roberts 2005 (tóm tắt) cho thấy với Ebbinghaus cân bằng kích thước và khoảng cách quyết định vòng trung tâm trông nhỏ đi hay to ra; bỏ năm 1892 (các nguồn lệch nhau). Câu mới theo cau_dung, nguồn Roberts 2005 cho vế "to hơn hay nhỏ hơn"; vế Delboeuf dùng vòng đồng tâm dựa trên Wikipedia (lượt 2 dẫn, bậc 3) và bài Perception 2023 lượt 2 dẫn: review xem. review: đạt sau khi thêm nguồn bậc 1 (Claude Opus 5.5, 17/11/2026). Đã mở toàn văn bài Perception 2023 lượt 2 dẫn (Urale & Schwarzkopf, PMC10291393): Delboeuf "uses a circular ring that surrounds the target stimulus instead of multiple circular inducers" (một vòng bao quanh vòng trung tâm, tức đồng tâm), Ebbinghaus dùng nhiều vòng bao quanh; tóm tắt: hai ảo giác làm vòng trung tâm trông khác đi "depending on the size and proximity of circular inducers or a ring"; Giới thiệu kể Roberts 2005: vòng bao quanh và vành càng xa thì vòng trung tâm trông càng nhỏ. Thêm urale2023 vào nguon của nhận định, trang dẫn kèm Roberts 2005 và thêm vào mục Nguồn; Wikipedia không còn là chỗ dựa.'
    luot_2: qua-manh
    luot_2_nguon:
      - https://en.wikipedia.org/wiki/Delboeuf_illusion
      - https://doi.org/10.1177/03010066231175014
    luot_2_ghi_chu: 'câu đúng: Delboeuf và Ebbinghaus đều là ảo giác về kích thước vòng tròn nhưng là hai hình khác nhau (vòng đồng tâm và vòng ở giữa các vòng khác); cả hai có thể làm vòng trung tâm trông to hơn hay nhỏ hơn tuỳ kích thước và khoảng cách vòng bao quanh.; Hai ảo giác đều có cả đồng hoá và tương phản tuỳ khoảng cách, nên chia "Ebbinghaus tương phản, Delboeuf đồng hoá" quá đơn giản. Năm mô tả: 1865/1892/1893 mâu thuẫn giữa các nguồn bậc 3; nên bỏ năm.'
