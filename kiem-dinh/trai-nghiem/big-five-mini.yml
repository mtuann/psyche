ghi_chu: 'Lô D8-L2 thay thang 15 câu tự soạn của site cũ bằng Mini-IPIP (theo lời giao: thang và cách chấm phải có nguồn). Bản ghi cũ (kind "bigfive") vẫn đọc được; bản ghi mới thêm thang: "mini-ipip".
  Cần chủ repo đồng ý (báo cáo d8-l2.md).'
