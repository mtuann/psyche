nhan_dinh:
  - id: s1
    cau: 'Công cụ: 20 câu, mỗi màn một câu, năm nút của thang (phím 1–5), "Quay lại câu trước"; kết quả: điểm 4–20 mỗi chiều trên trục có vạch giữa 12, không nhãn cao/thấp; khung cảnh báo; link trang nhà Big Five.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm src/scripts/cong-cu/big-five-mini.js, 17/11/2026; tests/cong-cu.test.mjs (20 câu, 4 câu mỗi chiều, khóa nghịch E2 A2 C2 N2 O3, không hai câu cùng chiều liền nhau), tests/trinh-duyet/kiem-cong-cu.mjs. Review (17/11/2026): đọc lại big-five-mini.js và bản xem dist/: 20 câu, nút 1–5 và phím 1–5, "Quay lại câu trước", kết quả tổng 4–20 trên trục có vạch giữa 12, không nhãn cao/thấp, khung "Một lần trải nghiệm, không phải trắc nghiệm", link bài Tính cách có mấy chiều?. Khớp.'
    review: dung
  - id: s2
    cau: 'Bản tiếng Việt: 18 câu lấy từ bản dịch của Walton trên IPIP, 2 câu do site dịch; lời dẫn và nhãn thang do site dịch; chưa kiểm chứng trên người Việt.'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Đã so từng câu trong CAU (big-five-mini.js) với trang VietnameseAB5C.htm, 17/11/2026: 18 câu khớp nguyên văn; "Feel others'' emotions" không có trong bản dịch; "Am the life of the party" bản dịch ghi "Cuộc sống với tôi giống như một bữa tiệc". Review (Claude Opus 5.5, 17/11/2026): sai một vế. Tự so lại 20 câu với VietnameseAB5C.htm (tải ngày 17/11/2026): 18 câu khớp nguyên văn và đúng cặp; "Am the life of the party" đúng như ghi; nhưng bản dịch có câu a2p1p112 (warmth) ghi "Feel others'' emotion" (số ít), dịch "Cảm nhận được tình cảm của người khác", nên câu trên trang "bản dịch IPIP không có câu này" sai. Giữ bản dịch của site ("cảm xúc", sát chữ emotions hơn "tình cảm"; số câu do site dịch vẫn là 2, câu chính của nhận định vẫn đúng); sửa lý do trên trang và chú thích đầu big-five-mini.js thành "bản dịch IPIP ghi câu này là "Feel others'' emotion" và dịch "Cảm nhận được tình cảm của người khác"; chúng tôi dịch "cảm xúc" cho sát chữ emotions".'
    review: sai
  - id: n1
    cau: 'Thang Mini-IPIP của Donnellan và cộng sự (2006): 20 câu, 4 câu mỗi chiều (hướng ngoại, dễ chịu, tận tâm, bất ổn cảm xúc, trí tuệ/trí tưởng tượng); bản rút gọn của một bảng hỏi IPIP 50 câu.'
    loai: cong-cu
    nguon:
      - donnellan2006
      - ipip-mini
    trich: The Mini-IPIP, a 20-item short form of the 50-item International Personality Item Pool-Five-Factor Model measure (Goldberg, 1999) … with four items per Big Five trait | Factor I Surgency or Extraversion … Factor II Agreeableness … Factor III Conscientiousness … Factor IV Neuroticism … Factor V Intellect or Imagination
    vi_tri: Donnellan 2006, tóm tắt; IPIP Mini-IPIP Scoring Key
    ket_qua: da-sua
    ghi_chu: 'Thay 15 câu tự soạn của site cũ (không có nguồn, không kiểm chứng) bằng thang có nguồn, theo lời giao lô. IPIP lưu ý thang 50 câu gốc là bộ đánh dấu Big Five từ vựng (Goldberg, 1992), không phải thang Five-Factor Model như tác giả viết: trang ghi "một bảng hỏi IPIP 50 câu", không gọi tên.'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1037/1040-3590.18.2.192
      - https://ipip.ori.org/MiniIPIPKey.htm
    luot_2_ghi_chu: IPIP lưu ý nhãn 'Mini-IPIP' và 'Five-Factor Model' không chính xác hẳn (bản gốc là Big Five lexical markers); không ảnh hưởng câu.
  - id: n2
    cau: 'Câu và khóa chấm (thuận, nghịch) của 20 câu theo trang Mini-IPIP Scoring Key; câu nghịch: E 2, A 2, C 2, N 2, Intellect 3.'
    loai: cong-cu
    nguon:
      - ipip-mini
    trich: + keyed Am the life of the party. Talk to a lot of different people at parties. – keyed Don't talk a lot. Keep in the background. … Factor V Intellect or Imagination + keyed Have a vivid imagination. – keyed Have difficulty understanding abstract ideas. Am not interested in abstract ideas. Do not have a good imagination.
    vi_tri: 'IPIP Mini-IPIP Scoring Key; vi_tri trong mã: hằng CAU'
    ket_qua: dung
    ghi_chu: 'Review (Claude Opus 5.5, 17/11/2026): tự so CAU trong big-five-mini.js với trang Mini-IPIP Scoring Key: 20 câu và khóa khớp (E +2 −2, A +2 −2, C +2 −2, N +2 −2, Intellect +1 −3); thứ tự xen kẽ, không hai câu cùng chiều liền nhau.'
    luot_2: dung
    luot_2_nguon:
      - https://ipip.ori.org/MiniIPIPKey.htm
    luot_2_ghi_chu: 'Khớp: câu nghịch E 2, A 2, C 2, N 2, Intellect 3 (theo thứ tự trên trang). Nội dung từng câu không đối chiếu từng chữ với bản dịch tiếng Việt.'
  - id: n3
    cau: 'Câu IPIP thuộc phạm vi công cộng: ai cũng được chép, dịch, dùng mà không cần xin phép.'
    loai: phat-hien
    nguon:
      - ipip-trang-chu
    trich: The items and scales are in the public domain, which means that one can copy, edit, translate, or use them for any purpose without asking permission and without paying a fee.
    vi_tri: IPIP, trang chủ
    ket_qua: dung
    luot_2: dung
    luot_2_nguon:
      - https://ipip.ori.org/
  - id: n4
    cau: Thang 5 bậc (Very Inaccurate … Very Accurate) và lời dẫn ("mô tả bạn như bạn thường là hiện nay … so với người cùng giới, cùng lứa tuổi").
    loai: cong-cu
    nguon:
      - ipip-quan-tri
    trich: Describe yourself as you generally are now, not as you wish to be in the future. Describe yourself as you honestly see yourself, in relation to other people you know of the same sex as you are, and roughly your same age. … 1. Very Inaccurate, 2. Moderately Inaccurate, 3. Neither Accurate Nor Inaccurate, 4. Moderately Accurate, or 5. Very Accurate
    vi_tri: 'Administering IPIP Measures; vi_tri trong mã: THANG, lời dẫn trong hoi()'
    ket_qua: dung
    ghi_chu: Bản dịch tiếng Việt của site.
    luot_2: dung
    luot_2_nguon:
      - https://ipip.ori.org/newScoringInstructions.htm
      - https://ipip.ori.org/New_IPIP-50-item-scale.htm
    luot_2_ghi_chu: Lời dẫn trên trang IPIP cho bản 50 câu; Mini-IPIP dùng cùng thang.
  - id: n5
    cau: 'Cách chấm: câu thuận 1–5, câu nghịch 5–1, điểm chiều là tổng các câu (4–20).'
    loai: cong-cu
    nguon:
      - ipip-cham
    trich: For + keyed items, the response "Very Inaccurate" is assigned a value of 1 … For - keyed items, the response "Very Inaccurate" is assigned a value of 5 … just sum all the values to obtain a total scale score.
    vi_tri: 'IPIP Scale Scoring Instructions; vi_tri trong mã: diemCau, chamDiem'
    ket_qua: da-sua
    ghi_chu: 'Cũ: trung bình 3 câu, thang 1–5, câu đảo 3, 6, 9, 12, 15. Bản ghi vẫn lưu trung bình 1–5 (scores) như site cũ, thêm tổng (tong).'
    luot_2: dung
    luot_2_nguon:
      - https://ipip.ori.org/newScoringInstructions.htm
    luot_2_ghi_chu: 4 câu x 1-5 = 4-20.
  - id: n6
    cau: 'Không gắn nhãn cao/thấp: IPIP khuyên không xếp người vào loại; chuẩn so sánh tính trên mẫu cùng giới, cùng lứa tuổi.'
    loai: cong-cu
    nguon:
      - ipip-dien-giai
    trich: one might calculate the mean and standard deviation (SD) for a sample of persons, usually of the same sex and a particular age range … we caution against interpreting IPIP scale scores in terms of categories or sorting respondents into groups based on their scores.
    vi_tri: Interpreting Individual IPIP Scale Scores
    ket_qua: da-sua
    ghi_chu: 'Công cụ cũ xếp "cao" (≥ 3,7), "thấp" (≤ 2,3), "trung bình" kèm lời mô tả tính cách: ngưỡng không có nguồn; đã bỏ.'
    luot_2: dung
    luot_2_nguon:
      - https://ipip.ori.org/InterpretingIndividualIPIPScaleScores.htm
    luot_2_ghi_chu: IPIP vẫn mô tả cách tính 'trung bình, thấp, cao' theo nửa độ lệch chuẩn trong mẫu cùng giới và tuổi; câu của site (không gắn nhãn) phù hợp với lời cảnh báo.
  - id: n7
    cau: IPIP khuyên xếp xen kẽ câu của các thang, vì khi câu cùng thang đứng liền nhau người trả lời dễ chọn cùng một mức cho tất cả.
    loai: phat-hien
    nguon:
      - ipip-quan-tri
    trich: If items from the same scale are listed together, especially if they are all +keyed or -keyed items, respondents may be more likely to see that the items are measuring the same construct. If this happens … they might tend to give the exact same response (e.g., Very Accurate) to all of the items.
    vi_tri: Administering IPIP Measures
    ket_qua: dung
    luot_2: dung
    luot_2_nguon:
      - https://ipip.ori.org/New_IPIP-50-item-scale.htm
  - id: n8
    cau: Theo IPIP, xếp xen kẽ câu của các thang và xen câu thuận với câu nghịch khuyến khích người trả lời đọc kỹ nội dung từng câu (cả câu hỏi 1).
    loai: phat-hien
    nguon:
      - ipip-quan-tri
    ket_qua: da-sua
    ghi_chu: 'chỗ khó: chưa tìm được nguồn mở được cho câu này trong lô; câu cũ "các bảng hỏi chuẩn đều trộn câu thuận và câu đảo vì lý do này" đã làm mềm ("giúp phát hiện"). Lượt 2 tìm nguồn (ví dụ tổng quan về acquiescence trong bảng hỏi), không có thì bỏ câu. Sau lượt 2 (Opus, 17/11/2026): viết theo đúng lời trang IPIP; bỏ ý "phát hiện xu hướng đồng ý (acquiescence)" (không nguồn). Sửa đoạn trên trang và câu hỏi 1. Câu mới: cần lượt 2 bổ sung. [câu mới] Review: đạt (Claude Opus 5.5, 17/11/2026). Tự mở trang Administering IPIP Measures (17/11/2026): "The theory behind distributing items from different scales throughout an inventory and alternating between +keyed and -keyed items is that this encourages respondents to pay close attention to the content of items"; câu trên trang và câu hỏi 1 khớp, không còn ý acquiescence.'
    luot_2: dung
    trich: The theory behind distributing items from different scales throughout an inventory and alternating between +keyed and -keyed items is that this encourages respondents to pay close attention to the content of items and therefore increases the probability of valid responding.
    vi_tri: IPIP, Administering IPIP Measures
    luot_2_nguon: [ "https://ipip.ori.org/New_IPIP-50-item-scale.htm" ]
    luot_2_ghi_chu: Đúng như câu viết. Cùng trang nói rõ đây là gợi ý, không bắt buộc ('These are suggestions, not requirements'; 'is not an absolute necessity').
  - id: n9
    cau: 'Qua năm nghiên cứu: độ nhất quán nội tại chấp nhận được (từ khoảng 0,60 trở lên), độ ổn định đo lại sau vài tuần, vài tháng gần như bản 50 câu, quan hệ với các thước đo Big Five khác tương tự.'
    loai: so-lieu
    nguon:
      - donnellan2006
    trich: had consistent and acceptable internal consistencies across five studies (= at or well above .60) … test-retest correlations that were quite similar to the parent measure across intervals of a few weeks (Study 4) and several months (Study 5) … showed a comparable pattern of convergent, discriminant, and criterion-related validity (Studies 2-5) with other Big Five measures
    vi_tri: Tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1037/1040-3590.18.2.192
  - id: n10
    cau: 'Hệ số alpha của năm thang Mini-IPIP: 0,65–0,77; tác giả chấm chiều cảm xúc theo hướng bất ổn (Neuroticism) thay vì ổn định cảm xúc như thang gốc.'
    loai: so-lieu
    nguon:
      - ipip-mini
    trich: Extraversion (Alpha = .77) … Agreeableness (Alpha = .70) … Conscientiousness (Alpha = .69) … Neuroticism (Alpha = .68) … Intellect or Imagination (Alpha = .65) | The authors of the Mini-IPIP chose to score the Emotional Stability scale from the lexical Big Five in reverse and to use the label Neuroticism
    vi_tri: Mini-IPIP Scoring Key và chú thích b
    ket_qua: dung
    luot_2: dung
    luot_2_nguon:
      - https://ipip.ori.org/MiniIPIPKey.htm
  - id: n11
    cau: 'Khá vững: thang ngắn như Mini-IPIP vẫn đo được 5 chiều, nhưng điểm từng chiều kém chính xác hơn bản dài; bằng chứng chủ yếu từ mẫu nói tiếng Anh.'
    loai: nhan
    nguon:
      - donnellan2006
      - ipip-mini
    trich: acceptable internal consistencies … (= at or well above .60) | Alpha = .65 … .77
    nhan: kha-vung
    co_so:
      - donnellan2006
      - ipip-mini
    ly_do: Năm nghiên cứu của nhóm tác giả cho kết quả cùng chiều (bản tiếng Anh); độ nhất quán mỗi thang vừa phải; chưa có tái lập lớn đăng ký trước hay tổng hợp trong lô này.
    ket_qua: da-sua
    ghi_chu: 'Cũ: khung Khá vững về BFI-10 (Rammstedt và John, 2007). Thay bằng Mini-IPIP, thang công cụ dùng. Review: đạt (Claude Opus 5.5, 17/11/2026). Khung nói về thang Mini-IPIP (không về cấu trúc Big Five, khẳng định của trang nhà), nên không lệch nhãn với trang nhà kham-pha/tinh-cach/big-five; co_so: năm nghiên cứu của nhóm tác giả, không có tái lập độc lập hay tổng hợp được dẫn: đúng mức Khá vững. Alpha 0,65–0,77 khớp trang Mini-IPIP Scoring Key (tự mở 17/11/2026).'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1037/1040-3590.18.2.192
      - https://ipip.ori.org/MiniIPIPKey.htm
    luot_2_ghi_chu: 'chỗ khó: nhãn ''Khá vững'' hợp thước đo; ''kém chính xác hơn bản dài'' khớp với alpha 0,65-0,77 thấp hơn bản dài, và IPIP nêu thêm hạn chế gọi tên chiều. Không thấy phân tích tổng hợp.'
  - id: n12
    cau: Big Five là công cụ mô tả tính cách bình thường, không phải công cụ chẩn đoán (lời cảnh báo, link trang nhà).
    loai: dinh-nghia
    nguon: [ mccrae1989, donnellan2006 ]
    ket_qua: da-sua
    ghi_chu: 'Như trang nhà kham-pha/tinh-cach/big-five (đã khóa, dẫn McCrae và Costa, 1989). Cũ: khung "Đã bị bác bỏ: dùng bài mini để chẩn đoán hay tuyển dụng" — không phải khẳng định thực nghiệm đã bị kiểm tra, dùng nhãn bác bỏ là sai cách; thay bằng khung chú ý (caution) không nhãn. Cũng bỏ khung "Đang tranh cãi: bản 15 câu tự viết có đo đúng 5 chiều" (bản ấy đã bỏ). Khi khóa (người gộp, Claude Opus 5.5, 17/11/2026): câu tóm trang nhà đã khóa nên lượt 1 chưa ghi nguồn; gắn đúng nguồn lượt 2 đã dẫn (DOI trong luot_2_nguon), lấy bản ghi từ hồ sơ trang nhà.'
