nhan_dinh:
  - id: n1
    cau: Với người đọc thạo, việc đọc một chữ gần như tự động; gọi tên màu sắc ít luyện tập hơn và chậm hơn.
    loai: phat-hien
    nguon:
      - stroop1935
      - macleod1991
    trich: the difference in speed in reading names of colors and in naming colors may be satisfactorily accounted for by the difference in training in the two activities
    vi_tri: Stroop 1935, Tóm tắt và kết luận (mục 2–3); MacLeod 1991, tóm tắt (thuyết tốc độ và tính tự động)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon:
      - https://uwaterloo.ca/memory-attention-cognition-lab/sites/default/files/uploads/files/strooprev_0.pdf
      - https://psychclassics.yorku.ca/Stroop/
  - id: n2
    cau: Khi chữ và màu mực mâu thuẫn, câu trả lời tự động chen vào; kìm nó lại tốn thời gian và đôi khi thất bại, nên lượt không khớp chậm hơn và dễ sai hơn.
    loai: phat-hien
    nguon:
      - stroop1935
      - augustinova2019
    trich: Fifty-nine percent of the group left an average of 2.6 errors uncorrected on the NCWd test (200 reactions) and 32 percent of the group left an average of 1.2 errors uncorrected on the NC test
    vi_tri: Stroop 1935, Thí nghiệm 2; Augustinova 2019, Bảng 2 (chậm hơn ở mọi kiểu trả lời)
    ket_qua: dung
    ghi_chu: Cách giải thích "kìm phản ứng tự động" là cách diễn đạt phổ thông của thuyết tốc độ và tính tự động mà MacLeod 1991 tổng quan; trang nói rõ các cách giải thích còn tranh luận (mục Các lý thuyết).
    luot_2: dung
    luot_2_nguon:
      - https://uwaterloo.ca/memory-attention-cognition-lab/sites/default/files/uploads/files/strooprev_0.pdf
  - id: n3
    cau: 'Stroop (1935), Thí nghiệm 1: 70 sinh viên; đọc chữ chỉ màu in mực màu khác chỉ chậm hơn khoảng 2,3 giây so với chữ in mực đen, khoảng 5,6%, và Stroop coi chênh lệch này là không đáng tin cậy.'
    loai: so-lieu
    nguon:
      - stroop1935
    trich: caused an increase of only 2.3 seconds or 5.6 percent over the normal time for reading the same words printed in black. This increase is not reliable.
    vi_tri: Stroop 1935, Thí nghiệm 1 (Seventy college undergraduates) và Tóm tắt, mục 2
    ket_qua: dung
    luot_2: dung
    luot_2_nguon:
      - https://psychclassics.yorku.ca/Stroop/
  - id: n4
    cau: 'Stroop (1935), Thí nghiệm 2: 100 sinh viên, mỗi thẻ 100 mục; gọi tên màu ô vuông mất trung bình 63,3 giây, màu mực của chữ chỉ màu khác 110,3 giây, chậm hơn khoảng 74%.'
    loai: so-lieu
    nguon:
      - stroop1935
    trich: The mean time for 100 responses is increased from 63.3 seconds to 110.3 seconds or an increase of 74 percent.
    vi_tri: Stroop 1935, Thí nghiệm 2, kết quả
    ket_qua: dung
    ghi_chu: '100 người gồm 88 sinh viên đại học và 12 học viên sau đại học: "sinh viên" đúng. Cùng số dùng trong công cụ (NGHIEN_CUU.stroop1935 ở src/scripts/cong-cu/stroop.js; tests/cong-cu.test.mjs kiểm 74% khớp hai con số).'
    luot_2: dung
    luot_2_nguon:
      - https://psychclassics.yorku.ca/Stroop/
    luot_2_ghi_chu: Mỗi thẻ 200 phản ứng, nhưng số trung bình tính theo 100 phản ứng; câu viết "mỗi thẻ 100 mục" khớp phần số liệu được báo cáo.
  - id: n5
    cau: Chữ cản trở việc gọi tên màu rất mạnh, nhưng màu gần như không cản trở việc đọc chữ.
    loai: phat-hien
    nguon:
      - stroop1935
    trich: Since the presence of the color stimuli caused no reliable increase over the normal time for reading words ... and the presence of word stimuli caused a considerable increase over the normal time for naming colors
    vi_tri: Stroop 1935, Tóm tắt, mục 2
    ket_qua: dung
    luot_2: dung
    luot_2_nguon:
      - https://psychclassics.yorku.ca/Stroop/
      - https://uwaterloo.ca/memory-attention-cognition-lab/sites/default/files/uploads/files/strooprev_0.pdf
  - id: n6
    cau: Năm 1991, MacLeod tổng quan khoảng 400 nghiên cứu về hiệu ứng Stroop và rút ra 18 phát hiện lặp đi lặp lại mà mọi lý thuyết phải giải thích được.
    loai: so-lieu
    nguon:
      - macleod1991
    trich: covering over 50 years and some 400 studies ... a set of 18 reliable empirical findings is isolated that must be captured by any successful theory of the Stroop effect
    vi_tri: MacLeod 1991, tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon:
      - https://uwaterloo.ca/memory-attention-cognition-lab/sites/default/files/uploads/files/strooprev_0.pdf
  - id: n7
    cau: 'Trả lời bằng phím bấm cho hiệu ứng nhỏ hơn trả lời bằng lời: trong hai thí nghiệm năm 2019, mức cản trở (lượt không khớp so với lượt trung tính XXXX) khi bấm phím là 76 ms và 73 ms, khi nói to là 155 ms và 168 ms, khoảng gấp đôi.'
    loai: so-lieu
    nguon:
      - augustinova2019
    trich: Standard Stroop interference BLUE green – XXXX green RT diff. 76 < 155 ... 73 < 168
    vi_tri: Augustinova 2019, Bảng 2 (Thí nghiệm 1 giữa người, Thí nghiệm 2 trong người)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hiệu ứng đo bằng phím bấm là 76 ms và 73 ms". Chữ mới nói rõ thước đo là lượt không khớp so với lượt trung tính XXXX (Bảng 2: "Standard Stroop interference"), không phải không khớp trừ khớp như công cụ gọi "hiệu ứng Stroop". Công cụ (stroop.js) đổi theo: so với lượt không khớp trừ lượt trung tính của người dùng.'
    luot_2: dung
    luot_2_nguon:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC6709679
  - id: n8
    cau: 'Vững chắc: gọi tên màu mực chậm hơn khi chữ chỉ một màu khác; hiệu ứng có trong hàng trăm nghiên cứu với nhiều biến thể (MacLeod 1991), và một đợt tái lập ở nhiều phòng thí nghiệm (Many Labs 3) thấy hiệu ứng ở mọi lần thử; độ lớn phụ thuộc vào cách trả lời, số màu, tỉ lệ lượt, người tham gia.'
    loai: nhan
    nguon:
      - macleod1991
      - hedge2018
      - augustinova2019
    trich: the Stroop effect was replicated in 100% of attempts, compared to much lower rates for most effects tested
    vi_tri: Hedge 2018, Giới thiệu (kể lại Many Labs 3, Ebersole và cộng sự 2016); MacLeod 1991, tóm tắt (khoảng 400 nghiên cứu)
    nhan: vung-chac
    co_so:
      - macleod1991
      - hedge2018
      - augustinova2019
      - morikawa1990
      - doan1999
      - verhaeghen1998
    ly_do: Phân tích tổng hợp 20 nghiên cứu so người trẻ và người già, hiệu ứng cản trở rất lớn ở cả hai nhóm (d = 2,04 và 2,17; Verhaeghen & De Meersman 1998); tổng quan khoảng 400 nghiên cứu trong 50 năm (MacLeod 1991, Psychol Bull, bậc 2); tái lập nhiều phòng thí nghiệm Many Labs 3 thành công 100% (theo Hedge 2018 kể lại); hiệu ứng có ở cả trả lời bằng phím và bằng lời (Augustinova 2019). Độ lớn tùy cách trả lời (Augustinova 2019).
    ket_qua: da-lam-mem
    luot_2: dung
    luot_2_nguon:
      - https://uwaterloo.ca/memory-attention-cognition-lab/sites/default/files/uploads/files/strooprev_0.pdf
      - https://gwern.net/doc/statistics/bias/2020-olssoncollentine.pdf
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC5990556
    luot_2_ghi_chu: 'chỗ khó: thước đo Vững chắc cần phân tích tổng hợp hay hai tái lập lớn có đăng ký trước. Tôi không tìm thấy phân tích tổng hợp riêng cho hiệu ứng Stroop cơ bản; căn cứ là tổng quan tường thuật của MacLeod (khoảng 400 nghiên cứu) cộng một tái lập lớn có đăng ký trước (Many Labs 3, 21 mẫu). Giữ Vững chắc vì hiệu ứng cơ bản bền ở mọi bối cảnh đã thử, nhưng người giao nên xem lại; cụm "một trong những phát hiện được tái lập nhiều nhất" không có nguồn đếm trực tiếp, nên bỏ hoặc làm mềm.'
    ghi_chu: 'Giải quyết sau lượt 2 (Claude Opus 5.5, 16/11/2026): lượt 2 dung kèm chỗ khó. Giữ Vững chắc: tổng quan khoảng 400 nghiên cứu (MacLeod 1991) cộng một tái lập lớn có đăng ký trước nhiều phòng thí nghiệm (Many Labs 3: hiệu ứng ở mọi mẫu, theo Hedge 2018 và Olsson-Collentine 2020 lượt 2 dẫn), có ở nhiều ngôn ngữ kể cả tiếng Việt (Morikawa & Hồ Hoàng Hoa 1990; Doan & Swerdlow 1999): đạt "đúng ở nhiều quần thể", không có thất bại tái lập. Chỉ có một tái lập lớn thay vì hai, nhưng tổng quan bậc 2 bù lại. Bỏ cụm "một trong những phát hiện được tái lập nhiều nhất" (không có nguồn đếm) theo lượt 2; câu mới viết khác cau_dung: review xem. review: đạt (Claude Opus 5.5, 17/11/2026). Câu trên trang khớp cau; mọi vế có nguồn (MacLeod tóm tắt: khoảng 400 nghiên cứu; Many Labs 3 theo Hedge 2018; độ lớn tùy cách trả lời: Augustinova 2019). Câu mới chỉ bỏ cụm không có nguồn, không mạnh hơn cau_dung của lượt 2. Thước đo mục 4 nói rõ cần phân tích tổng hợp hay hai tái lập lớn: thêm vào co_so phân tích tổng hợp Verhaeghen & De Meersman 1998 (20 nghiên cứu, tóm tắt OpenAlex: d = 2,04 ở người trẻ, 2,17 ở người già), nên nhãn Vững chắc đạt đúng chữ của thước đo, không chỉ "tinh thần".'
  - id: n9
    cau: 'Điểm Stroop của một người không ổn định lắm: trong một nghiên cứu, độ tin cậy giữa hai lần đo cách nhau 3 tuần khoảng 0,6–0,7, dưới mức 0,8 thường được coi là cần khi đánh giá từng người; các tác giả gọi đây là "nghịch lý độ tin cậy".'
    loai: so-lieu
    nguon:
      - hedge2018
    trich: the Stroop RT cost (ICCs of .6 and .66 in Studies 1 and 2 respectively) ... reliabilities of .8, typically considered excellent or of a clinically required standard
    vi_tri: Hedge 2018, Kết quả và Bảng 1; hai buổi cách nhau 3 tuần (Phương pháp)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chỉ khoảng 0,6–0,7". Chữ mới bỏ "chỉ" và nêu mốc 0,8 mà tác giả dẫn: theo quy ước, .6 được xếp "tốt", nên "chỉ" làm câu mạnh hơn nguồn. "Nghịch lý độ tin cậy" là tên bài (The reliability paradox).'
    luot_2: dung
    luot_2_nguon:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC5990556
  - id: n10
    cau: 'Đang tranh cãi: dùng hiệu ứng Stroop để đo "khả năng tự kiểm soát" của từng người; nhiệm vụ cho hiệu ứng nhóm càng chắc chắn thì thường càng kém trong việc phân biệt người này với người kia.'
    loai: nhan
    nguon:
      - hedge2018
    trich: the very reason such tasks produce robust and easily replicable experimental effects - low between-participant variability - makes their use as correlational tools problematic
    vi_tri: Hedge 2018, tóm tắt
    nhan: tranh-cai
    co_so:
      - hedge2018
    ly_do: Hedge 2018 (ba nghiên cứu, bảy nhiệm vụ) cho thấy độ tin cậy cá nhân thấp tới vừa dù hiệu ứng nhóm rất vững; việc dùng các nhiệm vụ này làm thước đo khác biệt cá nhân bị đặt câu hỏi.
    ket_qua: dung
    ghi_chu: 'chỗ khó: nhãn tranh-cai cho cách dùng (đo cá nhân), không cho hiệu ứng; chỉ một nguồn chính (Hedge 2018), ICC .60–.66 theo quy ước là "tốt". Lượt 2 (Opus) xét thước đo nhãn mục 4: có bằng chứng mâu thuẫn chất lượng cao không, hay nên là khá vững cho câu "điểm một người kém ổn định".'
    luot_2: dung
    luot_2_nguon:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC5990556
  - id: n11
    cau: 'Các cách giải thích: tốc độ xử lý (đọc nhanh hơn gọi tên màu), tính tự động (đọc đã thành tự động), và mô hình mạng nơ-ron coi đọc và gọi tên màu là hai con đường cạnh tranh, chú ý tăng sức cho con đường đúng; các cách không loại trừ nhau, tranh luận về chi tiết vẫn tiếp tục.'
    loai: dinh-nghia
    nguon:
      - macleod1991
    trich: the 2 major candidate theories—relative speed of processing and automaticity of reading—are found to be wanting. It is concluded that recent theories placing the explanatory weight on parallel processing of the irrelevant and the relevant dimensions are likely to be more successful
    vi_tri: MacLeod 1991, tóm tắt
    ket_qua: dung
    ghi_chu: Trang không nói thuyết nào đúng; MacLeod thấy hai thuyết chính "chưa đủ" và nghiêng về thuyết xử lý song song (gồm mô hình mạng). Khớp "tranh luận về chi tiết vẫn tiếp tục".
    luot_2: dung
    luot_2_nguon:
      - https://uwaterloo.ca/memory-attention-cognition-lab/sites/default/files/uploads/files/strooprev_0.pdf
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC6709679
    luot_2_ghi_chu: Câu đã nói thận trọng ("không loại trừ nhau, tranh luận tiếp tục").
  - id: n12
    cau: Kỹ năng đã thành thạo chạy tự động và có thể chen vào khi ta cần làm điều khác; kìm một phản ứng tự động tốn thời gian và công sức, ngay cả trong nhiệm vụ đơn giản.
    loai: phat-hien
    nguon:
      - stroop1935
      - macleod1991
    trich: The mean time for 100 responses is increased from 63.3 seconds to 110.3 seconds
    vi_tri: Stroop 1935, Thí nghiệm 2; MacLeod 1991
    ket_qua: dung
    ghi_chu: Bài học rút ra trực tiếp từ hiệu ứng (đọc thạo chen vào gọi tên màu); ví dụ lái xe theo lộ trình quen là minh họa (gia-dinh).
    luot_2: dung
    luot_2_nguon:
      - https://uwaterloo.ca/memory-attention-cognition-lab/sites/default/files/uploads/files/strooprev_0.pdf
    luot_2_ghi_chu: Nói chung đúng; lưu ý MacLeod cho rằng "tự động" một mình chưa đủ giải thích Stroop, nhưng câu không khẳng định điều ấy.
  - id: n13
