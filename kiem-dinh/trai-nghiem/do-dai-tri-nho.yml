  luot_2_ghi_chu: 'Mối liên hệ chiều đúng nhưng không giải thích hết (hiệu ứng độ dài từ có bài không tái lập: Lovatt, Avons & Masterson, 2000); câu nên nói "thường".'
- id: n14
  cau: Ở người song ngữ xứ Wales, tên chữ số tiếng Wales dài hơn và độ dài trí nhớ chữ số bằng tiếng Wales ngắn hơn; Ellis và Hennelly (1980) cho là do độ dài từ chứ không do trí thông minh, nhưng nghiên cứu sau (Murray và Jones, 2002) cho rằng khác biệt nối âm giữa các từ cũng đóng vai trò.
  loai: phat-hien
  nguon:
  - ellis1980
  - mattys2018
  trich: in bilingual subjects, Welsh digits take longer to articulate than their English equivalents, and this difference is paralleled by the finding that digit span in Welsh is significantly smaller than that in English. These differences are attributable to bilingual word‐length differences, and it is this, rather than intellectual differences
  vi_tri: Ellis & Hennelly 1980, tóm tắt
  ket_qua: da-sua
  luot_2: qua-manh
  luot_2_nguon:
  - https://doi.org/10.3758/s13421-017-0770-8
  luot_2_ghi_chu: 'câu đúng: Ở người song ngữ xứ Wales, tên chữ số tiếng Wales dài hơn và độ dài trí nhớ chữ số bằng tiếng Wales ngắn hơn; Ellis và Hennelly (1980) cho là do độ dài từ chứ không do trí thông minh, nhưng nghiên cứu sau (Murray và Jones, 2002) cho rằng khác biệt nối âm giữa các từ cũng đóng vai trò.; Phần "do độ dài từ" là cách giải thích của tác giả 1980; nghiên cứu sau cho rằng nguyên nhân phức tạp hơn.'
  ghi_chu: 'Giải quyết sau lượt 2 (Claude Opus 5.5, 16/11/2026): lượt 2 qua-manh, đồng ý: Mattys 2018 (toàn văn) kể Murray & Jones 2002: dãy tiếng Wales ngắn hơn "not because of the time it takes to pronounce individual items but because of greater differences in between-word coarticulation". Câu mới theo cau_dung, nêu đó là cách giải thích của Ellis & Hennelly.'
