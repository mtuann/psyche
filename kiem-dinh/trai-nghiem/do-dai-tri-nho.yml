- id: n9
  cau: Con số "7 ± 2" của Miller (1956) và ước lượng khoảng 4 "cụm" của Cowan (2001) được kể ở bài Trí nhớ làm việc, cùng tranh luận về giới hạn ấy.
  loai: lich-su
  nguon:
  - miller1956
  - cowan2001
  trich: Miller (1956) summarized evidence that people can remember about seven chunks in short-term memory (STM) tasks. … A single, central capacity limit averaging about four chunks is implicated
  vi_tri: Cowan 2001, tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Hai mục "Con số kỳ diệu bảy" và "Con số kỳ diệu bốn" của trang cũ rút còn một câu link về trang nhà kham-pha/tri-nho/tri-nho-lam-viec (src/data/nghien-cuu.yml: miller1956, cowan2001), theo quy tắc mỗi nghiên cứu một trang nhà. Bỏ chi tiết "một cách nói tu từ", "dao động 3–5" (con số không có ở trang nhà).'
  luot_2: dung
  luot_2_nguon:
  - https://psychclassics.yorku.ca/Miller/
  - https://oppimistiede.fi/wp-content/uploads/2025/06/02-Cowan-2010-The-magical-mystery-four-How-is-working-memory-capacity-limited.pdf
  luot_2_ghi_chu: Hai tên và hai con số là kiến thức lịch sử chuẩn; đã đối chiếu qua bản Miller trên psychclassics và Cowan (2010), không đọc lại Cowan (2001).
- id: n10
  cau: Ta vẫn nhớ được 6–7 chữ số nhờ nhóm chúng lại thành cụm (như "0912 345 678" là ba cụm) và nhẩm lặp thầm.
  loai: phat-hien
  nguon:
  - cowan2001
  - miller1956
  trich: Under these conditions, rehearsal and long-term memory cannot be used to combine stimulus items into chunks of an unknown size
  vi_tri: Cowan 2001, tóm tắt; Miller 1956, tóm tắt ("organizing the stimulus input … into a sequence or chunks")
  ket_qua: da-sua
  ghi_chu: 'Số điện thoại là ví dụ minh họa (gia-dinh). Giải quyết sau lượt 2 (Claude Opus 5.5, 16/11/2026): lượt 2 qua-manh, đồng ý ("tự động" không có nguồn; Cowan 2010 lượt 2 dẫn: nhóm và nhẩm là cơ chế người ta áp dụng). Câu mới lấy đúng cau_dung; lời giải thích câu hỏi 2 sửa theo.'
  luot_2: qua-manh
  luot_2_nguon:
  - https://oppimistiede.fi/wp-content/uploads/2025/06/02-Cowan-2010-The-magical-mystery-four-How-is-working-memory-capacity-limited.pdf
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC2978794
  luot_2_ghi_chu: 'câu đúng: Ta vẫn nhớ được 6–7 chữ số nhờ nhóm chúng lại thành cụm (như "0912 345 678" là ba cụm) và nhẩm lặp thầm.; "Tự động nhóm" không có nguồn; nhóm là chiến lược có thể có ý thức.'
- id: n11
  cau: 'Vững chắc: dung lượng trí nhớ ngắn hạn rất hạn chế, và người trưởng thành thường nhớ khoảng 6–7 chữ số xuôi, 4–5 chữ số ngược; đo trên nhiều mẫu lớn, kể cả bộ chuẩn Wechsler; con số phụ thuộc cách trình bày, cách tính điểm, tuổi, học vấn, ngôn ngữ.'
  loai: nhan
  nguon:
  - oberauer2018
  - woods2011
  trich: young adults can reliably recall or recognize across many trials no more than three to five separate units
  vi_tri: Oberauer 2018, Benchmark 1.3; Woods 2011 (763 người, so với chuẩn WMS-III)
  nhan: vung-chac
  co_so:
  - oberauer2018
  - woods2011
  ly_do: Giới hạn dung lượng là chuẩn mực mức A trong tổng quan 16 nhà nghiên cứu (Oberauer 2018, Psychol Bull, bậc 2); số chữ số xuôi, ngược khớp giữa mẫu cộng đồng 763 người và bộ chuẩn Wechsler (Woods 2011).
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Được đo trên hàng nghìn người với nhiều bộ chuẩn khác nhau" (không có nguồn cho "hàng nghìn"). Chữ mới: "nhiều mẫu lớn, kể cả bộ chuẩn của thang Wechsler mà nghiên cứu trên dùng để so sánh". Giải quyết sau lượt 2 (Claude Opus 5.5, 16/11/2026): lượt 2 dung kèm chỗ khó. Giữ Vững chắc: câu là mô tả (giới hạn nhỏ, số chữ số điển hình), không phải hiệu ứng nhân quả; giới hạn dung lượng là chuẩn mực mức A trong tổng quan Oberauer 2018 (16 tác giả, Psychol Bull, rà bằng chứng của nhiều phòng thí nghiệm), số chữ số khớp giữa mẫu cộng đồng 763 người và bộ chuẩn Wechsler, và bộ chuẩn tiếng Việt Nguyen 2025 cũng cho xuôi dài hơn ngược. Đạt tinh thần "đúng ở nhiều quần thể, không có thất bại".'
  luot_2: dung
  luot_2_nguon:
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC2978794
  - https://oppimistiede.fi/wp-content/uploads/2025/06/02-Cowan-2010-The-magical-mystery-four-How-is-working-memory-capacity-limited.pdf
  luot_2_ghi_chu: 'chỗ khó: thước đo Vững chắc cần phân tích tổng hợp hay tái lập lớn. Căn cứ ở đây là số đo mô tả trên mẫu lớn và bộ chuẩn Wechsler, hơn là một phân tích tổng hợp; vì câu là nhận định mô tả (không phải hiệu ứng nhân quả) tôi giữ dung, nhưng người giao nên xem lại.'
- id: n12
  cau: 'Khá vững: giới hạn "thật" khoảng 4 cụm thông tin; được ủng hộ bởi nhiều loại bằng chứng Cowan tổng hợp; một tổng quan của 16 nhà nghiên cứu coi khoảng 3–4 cụm là chuẩn mực "có điều kiện", vì phụ thuộc vào cách hiểu thế nào là một cụm.'
  loai: nhan
  nguon:
  - cowan2001
  - oberauer2018
  trich: we propose as a conditional benchmark that young adults can hold in WM about three to four chunks (Cowan, 2001). This benchmark is conditional because observation of the supporting evidence depends on measurement processes that rely on substantive assumptions, most notably about the nature of chunks in WM.
  vi_tri: Oberauer 2018, Benchmark 1.3
  nhan: kha-vung
  co_so:
  - cowan2001
  - oberauer2018
  ly_do: Cowan 2001 tổng hợp nhiều loại bằng chứng (BBS, có bình luận ngang hàng); Oberauer 2018 nhận con số 3–4 cụm nhưng chỉ là chuẩn mực có điều kiện. Chưa tới "vững chắc" vì phụ thuộc định nghĩa cụm.
  ket_qua: da-sua
  ghi_chu: 'Thêm câu về Oberauer 2018 để nêu cơ sở của nhãn. chỗ khó: trang nhà (tri-nho-lam-viec, đã khóa) xếp câu rộng hơn "giới hạn là bao nhiêu và bản chất là gì" vào Đang tranh cãi; hai nhãn nói về hai khẳng định khác nhau nhưng người đọc có thể thấy lệch. Lượt 2 (Opus) xét. Giải quyết sau lượt 2 (Claude Opus 5.5, 16/11/2026): lượt 2 khong-chac vì không tìm thấy bài "16 nhà nghiên cứu". Nguồn là Oberauer, Lewandowsky, Awh, Brown, Conway, Cowan … Ward (2018), Psychol Bull 144(9), 885–958 (Crossref: 16 tác giả), toàn văn PDF tại cns.nyu.edu/malab; câu trích ở trường trich (Benchmark 1.3, "conditional benchmark … about three to four chunks"). Giữ câu và nhãn Khá vững (lượt 2 đồng ý nhãn hợp). Không cần lượt 2 lại: chỉ bổ sung trích dẫn.'
  luot_2: khong-chac
  luot_2_nguon:
  - https://oppimistiede.fi/wp-content/uploads/2025/06/02-Cowan-2010-The-magical-mystery-four-How-is-working-memory-capacity-limited.pdf
  luot_2_ghi_chu: 'chỗ khó: nhãn Khá vững hợp với bằng chứng (Cowan 2001/2010, nhiều nghiên cứu nhưng không có phân tích tổng hợp, còn tranh luận). Nhưng chi tiết "một tổng quan của 16 nhà nghiên cứu coi 3–4 cụm là chuẩn mực có điều kiện" tôi không tìm ra bài nào để đối chiếu; cần lượt 1 đưa trích dẫn cụ thể.'
