  ghi_chu: Trang nhà tri-nho-lam-viec thêm rằng thời gian phát âm không giải thích được hết (Mattys 2018); câu ở đây nói "nhiều nghiên cứu cho thấy" mối liên hệ, khớp.
  luot_2: dung
  luot_2_nguon:
