nhan_dinh:
  - id: n1
    cau: Những khẳng định trên trang rất phổ biến, kể cả trong lớp học.
    loai: phat-hien
    nguon:
      - dekker2012
      - simons2011
    trich: 'Dekker 2012: phần lớn giáo viên được hỏi tin nhiều ngộ nhận thần kinh (Bảng 1); Simons & Chabris 2011: 63% người Mỹ trong mẫu đại diện tin trí nhớ như máy quay (theo trang nhà bang-ghi-hinh, đã khóa)'
    ket_qua: dung
    ghi_chu: Câu trang cũ giữ nguyên ("trên mạng xã hội, trong sách, thậm chí trong lớp học"); "trên mạng xã hội, trong sách" là mô tả chung, chỉ phần lớp học và công chúng có số liệu.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.3389/fpsyg.2012.00429", "https://doi.org/10.3389/fpsyg.2017.01314" ]
    luot_2_ghi_chu: Câu chung; các khảo sát giáo viên và công chúng xác nhận ngộ nhận phổ biến, kể cả ở người dạy học. Không kiểm từng khẳng định của trang.
  - id: s1
    cau: Mỗi khẳng định có một nhãn mức độ chắc chắn, một đoạn giải thích ngắn và nguồn.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'trangNgoNhan() (src/plugins/thanh-phan.mjs): khung nhãn, giai_thich, danh sách nguồn từ nguon.yml; schema bắt buộc nhan, giai_thich, nguon (src/du-lieu.mjs).'
  - id: s2
    cau: Link tới trò chơi Bạn nghĩ gì về tâm trí?
    loai: ve-site
    ket_qua: dung
    ghi_chu: src/content/docs/bat-dau/ban-nghi-gi.md.
  - id: s3
    cau: Mỗi thẻ được kiểm chứng riêng và chỉ lên trang này sau khi đã kiểm chứng xong.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Câu mới thay "Dữ liệu kiểm tra lần cuối: 13/10/2026. Bộ thẻ sẽ được mở rộng dần lên khoảng 60 khẳng định." (bộ đã có 60 thẻ; ngày kiểm nay ở hồ sơ từng thẻ). Kiểm trên src/plugins/psyche-markdown.mjs (duLieuThe: bản thật chỉ thẻ đã khóa) và tests/ngo-nhan.test.mjs.'
doi_chu:
  - cu: 'Dữ liệu kiểm tra lần cuối: 13/10/2026. Bộ thẻ sẽ được mở rộng dần lên khoảng 60 khẳng định.'
    moi: Mỗi thẻ được kiểm chứng riêng và chỉ lên trang này sau khi đã kiểm chứng xong.
    ly_do: 's3: bộ đã đủ 60 thẻ; ngày kiểm ghi ở hồ sơ từng thẻ.'
  - cu: '60 khung nhãn viết sẵn trong trang cũ (vùng <!-- gen:myths -->), tiêu đề dùng nháy cong, "Đọc thêm: bài liên quan", nguồn viết tay'
    moi: 'Thẻ sinh lúc build từ src/data/ngo-nhan.yml (::ngo-nhan{nhan="…"}); chữ thẻ theo bản đã kiểm ở D8-L3; "Đọc thêm: <tên bài>" chỉ khi bài có trong bản build; nguồn theo APA từ nguon.yml'
    ly_do: 'Dữ liệu một chỗ (luật 3). Chữ từng thẻ đổi ở đâu, vì sao: ghi_chu và nhận định da-sua trong kiem-dinh/du-lieu/ngo-nhan/<id>.yml. Nhãn đổi: mau-sac, khen-thong-minh, eq-hon-iq, than-kinh-moi, thuong-ngoai, stress-hai, gach-chan-hieu-qua (Đã bị bác bỏ → Đang tranh cãi; gach-chan-hieu-qua sau lượt 2).'
