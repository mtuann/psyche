nhan_dinh:
  - id: n1
    cau: Tâm lý học phát triển nghiên cứu những thay đổi về thể chất, nhận thức và tâm lý xã hội (cảm xúc, tính cách, quan hệ với người khác) của con người qua suốt đời, từ lúc thụ thai đến cuối đời.
    loai: dinh-nghia
    nguon:
      - os9-1
    trich: studying how humans change and grow from conception through childhood, adolescence, adulthood, and death. They view development as a lifelong process that can be studied scientifically across three developmental domains—physical, cognitive, and psychosocial development. | Psychosocial development involves emotions, personality, and social relationships.
    ket_qua: da-sua
    vi_tri: Mục 9.1, đoạn thứ hai
    ghi_chu: 'Chữ cũ: "những thay đổi về thể chất, nhận thức và xã hội ... từ lúc mới sinh đến tuổi già". Chữ mới: "tâm lý xã hội (cảm xúc, tính cách, quan hệ với người khác)", "từ lúc thụ thai đến cuối đời". Lý do: nguồn nói "from conception ... and death" và gọi miền thứ ba là psychosocial. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. OpenStax 9.1: "from conception… and death", ba miền physical, cognitive, psychosocial ("emotions, personality, and social relationships").'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-1-what-is-lifespan-development" ]
    luot_2_ghi_chu: Mục 9.1 về phát triển suốt đời; 'từ lúc thụ thai đến cuối đời' là cách mô tả chuẩn.
    review: dung
  - id: n2
    cau: Đây là một trong 14 lĩnh vực của Psyche; mỗi bài dưới đây đã được kiểm chứng lại từ đầu, theo cách ghi ở trang Cách Psyche kiểm chứng, rồi khóa; bài chưa kiểm chứng xong chưa hiện ở đây, chỉ được đếm ở cuối danh sách.
