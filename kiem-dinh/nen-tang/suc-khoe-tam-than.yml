nhan_dinh:
  - id: n1
    cau: Lĩnh vực nói về các rối loạn tâm thần, như trầm cảm và lo âu, và các cách hỗ trợ, điều trị, kèm bằng chứng về từng cách.
    loai: dinh-nghia
    nguon:
      - os15
      - os16
    trich: 15.4 Anxiety Disorders ... 15.7 Depressive, Bipolar, and Related Disorders | 16.2 Types of Treatment
    ket_qua: da-sua
    vi_tri: Dàn bài chương 15 và 16 (Chapter Outline)
    ghi_chu: 'Chữ cũ: "các rối loạn tâm thần thường gặp, như trầm cảm và lo âu, và các cách hỗ trợ, điều trị có bằng chứng." Chữ mới bỏ "thường gặp" (cần số liệu tỉ lệ mắc, không có ở trang) và "có bằng chứng" (hứa hẹn quá). Nguồn chỉ cho thấy phạm vi: trầm cảm và lo âu là mục của giáo trình. Trang chỉ là mục lục, không nêu dấu hiệu hay lời khuyên điều trị. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Câu tả phạm vi lĩnh vực (OpenStax ch. 15, 16); không nêu dấu hiệu hay lời khuyên điều trị. "Kèm bằng chứng về từng cách" là cam kết của các bài, không phải khẳng định hiệu quả.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/1-1-what-is-psychology" ]
    luot_2_ghi_chu: Câu mô tả phạm vi, không kể điều trị cụ thể; chấp nhận.
    review: dung
  - id: n2
    cau: Các bài trong lĩnh vực này mang tính giáo dục, không thay thế chẩn đoán hay điều trị của người có chuyên môn; nếu bạn đang gặp khó khăn, hãy xem trang Hỗ trợ.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'AGENTS.md (Quy tắc nội dung: không viết như chẩn đoán hay lời khuyên điều trị; trang Sức khỏe tâm thần chỉ khóa sau khi chuyên gia đọc) và chuan-kiem-dinh.md mục 5 (đầu trang có lời dẫn tới Hỗ trợ). Trang Hỗ trợ có trong site (ho-tro/index). Trang lĩnh vực không phải trang bài lõi Sức khỏe tâm thần nên không cần chữ ký chuyên gia (loaiTrang). Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. AGENTS.md, chuan-kiem-dinh.md mục 5 (lời dẫn tới Hỗ trợ); link /psyche/ho-tro/ có trong build. Trang lĩnh vực tầng khung, không phải bài Sức khỏe tâm thần nên không cần chữ ký chuyên gia.'
    review: dung
  - id: n3
    cau: Đây là một trong 14 lĩnh vực của Psyche; mỗi bài dưới đây đã được kiểm chứng lại từ đầu, theo cách ghi ở trang Cách Psyche kiểm chứng, rồi khóa; bài chưa kiểm chứng xong chưa hiện ở đây, chỉ được đếm ở cuối danh sách.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'src/data/linh-vuc.yml có 14 lĩnh vực; ::danh-sach-bai (src/plugins/thanh-phan.mjs) chỉ liệt kê bài có trong bản build (đã khóa) và ghi "Còn N bài sắp có"; link tới bat-dau/cach-kiem-chung có trong trang.yml. Mô tả (frontmatter) cùng khuôn: "Các bài của lĩnh vực X trên Psyche: mỗi bài một câu hỏi, kèm bằng chứng và mức độ chắc chắn." Chữ cũ "chưa hiện ở đây" thêm "chỉ được đếm ở cuối danh sách" cho khớp thành phần. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Đối chiếu 30/10/2026: src/data/linh-vuc.yml có 14 bản ghi; danhSachBai (src/plugins/thanh-phan.mjs) chỉ liệt kê bài có trong bản build (bản thật: trang đã khóa, src/ban-build.mjs) và in dòng "Còn/Có N bài sắp có" ở cuối; link /psyche/bat-dau/cach-kiem-chung/ có trong build. HTML bản xem (dist/nen-tang/tri-nho/) khớp.'
    review: dung
