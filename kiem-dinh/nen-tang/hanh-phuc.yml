  - id: os14-5
    ten: OpenStax Psychology 2e, mục 14.5 The Pursuit of Happiness
    link: https://openstax.org/books/psychology-2e/pages/14-5-the-pursuit-of-happiness
    toan_van: true
nhan_dinh:
  - id: n1
    cau: Hạnh phúc, hiểu theo tâm lý học, là trạng thái tinh thần lâu dài gồm niềm vui, sự hài lòng và cảm giác cuộc sống có ý nghĩa (còn gọi là sự an lành chủ quan, subjective well-being).
    loai: dinh-nghia
    nguon:
      - os14-5
    trich: an enduring state of mind consisting of joy, contentment, and other positive emotions, plus the sense that one’s life has meaning and value (Lyubomirsky, 2001). The definition implies that happiness is a long-term state—what is often characterized as subjective well-being
    ket_qua: da-sua
    vi_tri: Mục 14.5, đoạn "Happiness"
    ghi_chu: 'Chữ cũ: "hạnh phúc và sự an lành chủ quan: cách đo, điều gì gắn với chúng, và những gì có bằng chứng giúp con người sống tốt hơn." Chữ mới thêm định nghĩa của OpenStax (Lyubomirsky 2001) và bỏ "những gì có bằng chứng giúp con người sống tốt hơn" (khẳng định có hiệu quả chưa có nguồn ở lĩnh vực này; thay bằng "bằng chứng về các cách người ta thử tăng nó", nói về phạm vi bài). Hạnh phúc có nhiều cách định nghĩa (OpenStax: "somewhat ambiguous"); trang chọn một.'
  - id: n2
    cau: Lĩnh vực hạnh phúc xét cách đo hạnh phúc, điều gì gắn với nó, và bằng chứng về các cách người ta thử tăng nó.
    loai: dinh-nghia
    nguon:
      - os14-5
    trich: Define and discuss happiness, including its determinants
    ket_qua: dung
    vi_tri: Mục tiêu học tập 14.5
    ghi_chu: Phạm vi các bài, không nêu kết luận.
  - id: n3
    cau: Đây là một trong 14 lĩnh vực của Psyche; mỗi bài dưới đây đã được kiểm chứng lại từ đầu, theo cách ghi ở trang Cách Psyche kiểm chứng, rồi khóa; bài chưa kiểm chứng xong chưa hiện ở đây, chỉ được đếm ở cuối danh sách.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'src/data/linh-vuc.yml có 14 lĩnh vực; ::danh-sach-bai (src/plugins/thanh-phan.mjs) chỉ liệt kê bài có trong bản build (đã khóa) và ghi "Còn N bài sắp có"; link tới bat-dau/cach-kiem-chung có trong trang.yml. Mô tả (frontmatter) cùng khuôn: "Các bài của lĩnh vực X trên Psyche: mỗi bài một câu hỏi, kèm bằng chứng và mức độ chắc chắn." Chữ cũ "chưa hiện ở đây" thêm "chỉ được đếm ở cuối danh sách" cho khớp thành phần.'
    review: null
doi_chu:
  - cu: '...chưa hiện ở đây.'
    moi: '...chưa hiện ở đây, chỉ được đếm ở cuối danh sách.'
    ly_do: Khớp thành phần ::danh-sach-bai (dòng "Còn N bài sắp có").
  - cu: 'nghiên cứu hạnh phúc và sự an lành chủ quan: cách đo, điều gì gắn với chúng, và những gì có bằng chứng giúp con người sống tốt hơn'
    moi: 'nghiên cứu hạnh phúc, hiểu là trạng thái tinh thần lâu dài gồm niềm vui, sự hài lòng và cảm giác cuộc sống có ý nghĩa (còn gọi là sự an lành chủ quan, subjective well-being): cách đo, điều gì gắn với nó, và bằng chứng về các cách người ta thử tăng nó'
    ly_do: OpenStax 14.5.
ghi_chu: APA Dictionary of Psychology (dictionary.apa.org) là ứng dụng một trang, không lấy được nội dung mục từ bằng công cụ đọc web; định nghĩa kiểm với OpenStax Psychology 2e (bậc 2, giáo trình mở), dẫn đúng mục.
