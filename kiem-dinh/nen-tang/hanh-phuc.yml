nhan_dinh:
  - id: n1
    cau: Hạnh phúc, hiểu theo tâm lý học, là trạng thái tinh thần lâu dài gồm niềm vui, sự hài lòng và cảm giác cuộc sống có ý nghĩa (gần với khái niệm sự an lành chủ quan, subjective well-being).
    loai: dinh-nghia
    nguon:
      - os14-5
    trich: an enduring state of mind consisting of joy, contentment, and other positive emotions, plus the sense that one’s life has meaning and value (Lyubomirsky, 2001). The definition implies that happiness is a long-term state—what is often characterized as subjective well-being
    ket_qua: da-sua
    vi_tri: Mục 14.5, đoạn "Happiness"
    ghi_chu: 'Chữ cũ: "hạnh phúc và sự an lành chủ quan: cách đo, điều gì gắn với chúng, và những gì có bằng chứng giúp con người sống tốt hơn." Chữ mới thêm định nghĩa của OpenStax (Lyubomirsky 2001) và bỏ "những gì có bằng chứng giúp con người sống tốt hơn" (khẳng định có hiệu quả chưa có nguồn ở lĩnh vực này; thay bằng "bằng chứng về các cách người ta thử tăng nó", nói về phạm vi bài). Hạnh phúc có nhiều cách định nghĩa (OpenStax: "somewhat ambiguous"); trang chọn một. Người gom (Claude Opus 5.5, 30/10/2026), theo gợi ý của lượt 2: "còn gọi là" thành "gần với khái niệm": trong Diener, an lành chủ quan là hài lòng cuộc sống cộng cảm xúc tích cực và tiêu cực, ý nghĩa cuộc sống tính riêng. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. OpenStax 14.5 (Lyubomirsky 2001: "enduring state of mind consisting of joy, contentment… plus the sense that one’s life has meaning"); "gần với khái niệm an lành chủ quan" đã làm mềm theo lượt 2.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/14-5-the-pursuit-of-happiness" ]
    luot_2_ghi_chu: "Khớp giáo trình. Lưu ý: 'còn gọi là subjective well-being' hơi đồng nhất; trong Diener, SWB thường là hài lòng cuộc sống cộng cảm xúc, ý nghĩa tính riêng. Nên viết mềm ('gần với')."
    review: dung
  - id: n2
    cau: Lĩnh vực hạnh phúc xét cách đo hạnh phúc, điều gì gắn với nó, và bằng chứng về các cách người ta thử tăng nó.
    loai: dinh-nghia
    nguon:
      - os14-5
    trich: Define and discuss happiness, including its determinants
    ket_qua: dung
    vi_tri: Mục tiêu học tập 14.5
    ghi_chu: Phạm vi các bài, không nêu kết luận.
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/14-5-the-pursuit-of-happiness" ]
    luot_2_ghi_chu: Khớp phạm vi mục 14.5.
  - id: n3
    cau: Đây là một trong 14 lĩnh vực của Psyche; mỗi bài dưới đây đã được kiểm chứng lại từ đầu, theo cách ghi ở trang Cách Psyche kiểm chứng, rồi khóa; bài chưa kiểm chứng xong chưa hiện ở đây, chỉ được đếm ở cuối danh sách.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'src/data/linh-vuc.yml có 14 lĩnh vực; ::danh-sach-bai (src/plugins/thanh-phan.mjs) chỉ liệt kê bài có trong bản build (đã khóa) và ghi "Còn N bài sắp có"; link tới bat-dau/cach-kiem-chung có trong trang.yml. Mô tả (frontmatter) cùng khuôn: "Các bài của lĩnh vực X trên Psyche: mỗi bài một câu hỏi, kèm bằng chứng và mức độ chắc chắn." Chữ cũ "chưa hiện ở đây" thêm "chỉ được đếm ở cuối danh sách" cho khớp thành phần. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Đối chiếu 30/10/2026: src/data/linh-vuc.yml có 14 bản ghi; danhSachBai (src/plugins/thanh-phan.mjs) chỉ liệt kê bài có trong bản build (bản thật: trang đã khóa, src/ban-build.mjs) và in dòng "Còn/Có N bài sắp có" ở cuối; link /psyche/bat-dau/cach-kiem-chung/ có trong build. HTML bản xem (dist/nen-tang/tri-nho/) khớp.'
    review: dung
