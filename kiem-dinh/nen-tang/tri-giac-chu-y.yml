    ghi_chu: OpenStax nói thông tin giác quan được chuyển lên hệ thần kinh trung ương; "não" là cách gọi gọn.
  - id: n2
    cau: Chú ý là yếu tố quyết định phần nào của thông tin giác quan được ta để ý tới.
    loai: dinh-nghia
    nguon:
