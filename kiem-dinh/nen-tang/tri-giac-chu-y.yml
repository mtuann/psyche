    trich: Attention plays a significant role in determining what is sensed versus what is perceived.
    ket_qua: da-lam-mem
    vi_tri: Mục 5.1
    ghi_chu: 'Chữ cũ: "chú ý là việc chọn lọc một phần thông tin để xử lý tiếp". Chữ mới bám OpenStax 5.1 (không có định nghĩa một câu; chỉ nói chú ý quyết định phần nào được cảm nhận và tri giác). Chưa đối chiếu APA Dictionary.'
