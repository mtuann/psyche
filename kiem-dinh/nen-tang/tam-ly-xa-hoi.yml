nhan_dinh:
  - id: n1
    cau: Tâm lý học xã hội nghiên cứu cách suy nghĩ, cảm xúc và hành vi của mỗi người chịu ảnh hưởng từ người khác và từ nhóm.
    loai: dinh-nghia
    nguon:
      - os12-1
    trich: Social psychology examines how people affect one another, and it looks at the power of the situation. | we will examine how the presence of other individuals and groups of people impacts a person's behaviors, thoughts, and feelings.
    ket_qua: da-sua
    vi_tri: Mục 12.1, đoạn mở đầu
    ghi_chu: 'Chữ cũ: "...chịu ảnh hưởng từ người khác, dù người khác có mặt thật hay chỉ trong tưởng tượng." Chữ mới bỏ vế "chỉ trong tưởng tượng": OpenStax 12.1 nói người khác và nhóm tác động, không nhắc "tưởng tượng" (vế này là định nghĩa của Allport, 1985, chưa mở được nguồn nào dẫn nguyên văn; APA Dictionary không đọc được). Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. OpenStax 12.1: "how the presence of other individuals and groups of people impacts a person''s behaviors, thoughts, and feelings"; khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/12-1-what-is-social-psychology" ]
    luot_2_ghi_chu: Khớp ý.
    review: dung
  - id: n2
    cau: Đây là một trong 14 lĩnh vực của Psyche; mỗi bài dưới đây đã được kiểm chứng lại từ đầu, theo cách ghi ở trang Cách Psyche kiểm chứng, rồi khóa; bài chưa kiểm chứng xong chưa hiện ở đây, chỉ được đếm ở cuối danh sách.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'src/data/linh-vuc.yml có 14 lĩnh vực; ::danh-sach-bai (src/plugins/thanh-phan.mjs) chỉ liệt kê bài có trong bản build (đã khóa) và ghi "Còn N bài sắp có"; link tới bat-dau/cach-kiem-chung có trong trang.yml. Mô tả (frontmatter) cùng khuôn: "Các bài của lĩnh vực X trên Psyche: mỗi bài một câu hỏi, kèm bằng chứng và mức độ chắc chắn." Chữ cũ "chưa hiện ở đây" thêm "chỉ được đếm ở cuối danh sách" cho khớp thành phần. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Đối chiếu 30/10/2026: src/data/linh-vuc.yml có 14 bản ghi; danhSachBai (src/plugins/thanh-phan.mjs) chỉ liệt kê bài có trong bản build (bản thật: trang đã khóa, src/ban-build.mjs) và in dòng "Còn/Có N bài sắp có" ở cuối; link /psyche/bat-dau/cach-kiem-chung/ có trong build. HTML bản xem (dist/nen-tang/tri-nho/) khớp.'
