    ket_qua: dung
    vi_tri: 11.7 (mô tả); chương 11 có mục 11.9 Personality Assessment (đo lường)
    ghi_chu: 'Mục "thay đổi đến đâu": OpenStax 11.1 chỉ nói tính cách được cho là ổn định, khó đổi; chưa đọc phần bằng chứng về thay đổi. Câu chỉ nêu phạm vi các bài, không nêu kết luận.'
