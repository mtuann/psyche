  - id: n26
    cau: 5 câu ngắn đo điều gần với thứ các thang khác đo, và khá ổn định theo thời gian ở sinh viên.
    loai: phat-hien
    nguon:
      - diener1985
    trich: The results indicated that the scale has favorable psychometric properties.
    vi_tri: tr. 74, Discussion
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Nói cách khác: 5 câu hỏi ngắn này đo được *cùng một thứ* mà các thang đo dài và khác nhau cùng đo — và đo khá ổn định theo thời gian.". Chữ mới: "Nói cách khác: 5 câu hỏi ngắn này đo được điều gần với thứ mà các thang đo dài và khác nhau cũng đo (tương quan ở mức trung bình đến cao, không phải bằng nhau) — và khá ổn định theo thời gian ở nhóm sinh viên.". Lý do: "Cùng một thứ" mạnh hơn tương quan 0,47–0,75. Review (Claude Sonnet 5.5, 10/11/2026): dung. Câu đã làm mềm đúng: "gần với" thay "cùng một thứ", chỉ nhóm sinh viên.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327752jpa4901_13" ]
    luot_2_ghi_chu: Tóm lược hợp lý của kết quả Study 1-2; ổn định ở mức nhóm, mẫu sinh viên.
    review: dung
  - id: n27
    cau: 'Sandvik, Diener & Seidlitz (1993): theo dõi 136 sinh viên trong một học kỳ, so thang tự đánh giá (một câu và nhiều câu) với các cách đo không tự đánh giá; theo tóm tắt gồm đánh giá của người nhà và bạn bè.'
    loai: so-lieu
    nguon:
      - sandvik1993
    trich: a sample of 136 college students studied over the course of a semester
    vi_tri: tóm tắt (Crossref)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "so sánh các thang tự đánh giá (cả dạng một câu hỏi lẫn nhiều câu hỏi) với các cách đo *không phải tự đánh giá*: đánh giá của người thân và bạn bè am hiểu, đo lường cảm xúc theo thời gian thực (experience sampling), và bài kiểm tra trí nhớ về các sự kiện tốt/xấu trong đời.". Chữ mới: "so sánh các thang tự đánh giá (cả dạng một câu hỏi lẫn nhiều câu hỏi) với các cách đo *không phải tự đánh giá*; theo tóm tắt bài, các cách này gồm đánh giá của người nhà và bạn bè (tóm tắt không liệt kê hết các cách còn lại).". Lý do: Không mở được toàn văn Sandvik 1993; tóm tắt chỉ nói "five non-self-report measures" và nêu informant (người nhà, bạn bè), nên bỏ experience sampling và kiểm tra trí nhớ. Chỉ đọc tóm tắt. Review (Claude Sonnet 5.5, 10/11/2026): dung. Chỉ giữ điều tóm tắt Sandvik 1993 nói (136 sinh viên, một học kỳ, informant là người nhà và bạn bè); chữ "theo tóm tắt" rõ.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1467-6494.1993.tb00283.x" ]
    luot_2_ghi_chu: Chỉ đọc tóm tắt (OpenAlex/Wiley); câu đã ghi "theo tóm tắt".
    review: dung
  - id: n28
    cau: Phân tích nhân tố các cách đo cho thấy một cấu trúc chung duy nhất; thang tự đánh giá tương quan cao với cách đo khác; đánh giá người nhà và bạn bè nhất quán đáng kể.
    loai: phat-hien
    nguon:
      - sandvik1993
    trich: A principal axis factor analysis of self- and non-self-report SWB measures revealed a single unitary construct underlying the measures. [...] Comparisons of family versus friend informant reports demonstrated the considerable cross-situational consistency and temporal stability of SWB.
    vi_tri: tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "**Kết quả.** Phân tích nhân tố cho thấy **một nhân tố chung duy nhất** nằm dưới tất cả các cách đo. Các thang tự đánh giá tương quan với các cách đo khác ở **mức trung bình đến mạnh**, và đánh giá của người nhà so với bạn bè cũng nhất quán với nhau.". Chữ mới: "**Kết quả.** Phân tích nhân tố các cách đo tự đánh giá và không tự đánh giá cho thấy **một cấu trúc chung duy nhất** nằm dưới chúng. Các thang tự đánh giá thông thường **tương quan cao** với các cách đo khác, và đánh giá của người nhà so với bạn bè cho thấy sự nhất quán đáng kể giữa các hoàn cảnh và". Lý do: Tóm tắt: "correlated highly", "considerable cross-situational consistency and temporal stability"; "tất cả các cách đo" không đúng (tóm tắt nói các cách đo tự đánh giá và không tự đánh giá). Chỉ đọc tóm tắt. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp tóm tắt Sandvik 1993 (một cấu trúc chung, tương quan cao, nhất quán đáng kể giữa tình huống và theo thời gian).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1467-6494.1993.tb00283.x" ]
    luot_2_ghi_chu: Chỉ tóm tắt. Khớp.
    review: dung
  - id: n29
    cau: 'Kết luận của Sandvik và cộng sự: thang tự đánh giá thông thường đo hạnh phúc chủ quan một cách có giá trị; các cách đo không tự đánh giá hữu ích để có bức tranh đầy đủ hơn.'
    loai: phat-hien
    nguon:
      - sandvik1993
    trich: It was concluded that conventional self-report instruments validly measure the SWB construct, and that alternative, non-self-report measures are useful
    vi_tri: tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Kết luận của họ: các thang tự đánh giá thông thường *đo được* khái niệm hạnh phúc chủ quan một cách có giá trị, dù không hoàn hảo; các cách đo bổ sung (người thân, đo thời gian thực, trí nhớ) giúp có bức tranh đầy đủ hơn.". Chữ mới: "Kết luận của họ: các thang tự đánh giá thông thường *đo được* khái niệm hạnh phúc chủ quan một cách có giá trị; các cách đo không tự đánh giá hữu ích để có bức tranh đầy đủ hơn.". Lý do: Chỉ giữ điều tóm tắt nói. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp câu kết luận trong tóm tắt Sandvik 1993.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1467-6494.1993.tb00283.x" ]
    luot_2_ghi_chu: Chỉ tóm tắt. Khớp.
    review: dung
  - id: n30
    cau: 'Một hạn chế của thang tổng thể như SWLS: hỏi về "cuộc đời nói chung", nên các báo cáo toàn cục không chứa tình huống cụ thể (Kahneman 2004: các nghiên cứu thường dựa vào báo cáo toàn cục về hạnh phúc hay hài lòng).'
    loai: phat-hien
    nguon:
      - kahneman2004
    trich: these studies usually rely on global reports of happiness or satisfaction with life in general
    vi_tri: tr. 1776, đoạn đầu
    ket_qua: dung
    ghi_chu: Câu "phụ thuộc nhiều vào trí nhớ" là diễn giải của trang; bài nói về báo cáo toàn cục và sai lệch hồi tưởng.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1126/science.1103572" ]
    luot_2_ghi_chu: 'Đọc toàn văn Kahneman 2004. Ý "không chứa tình huống cụ thể" là diễn giải: bài nói các nghiên cứu hiếm đo trải nghiệm theo tình huống cụ thể.'
