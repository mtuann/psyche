doi_chu:
  - cu: Hai điểm số thường **tương quan ở mức trung bình đến mạnh** — không trùng khớp, nhưng cũng không ngẫu nhiên. Đây là một trong những bằng chứng cho thấy hạnh phúc *có thể* đo được.
    moi: Trong một phân tích tổng hợp 44 mẫu (8.897 người), điểm tự chấm và điểm do người quen chấm tương quan ở mức **trung bình** (r ≈ 0,42) — không trùng khớp, nhưng cũng không ngẫu nhiên. Đây là một trong những bằng chứng cho thấy hạnh phúc *có thể* đo được.
    ly_do: Con số cụ thể theo Schneider & Schimmack (2009); chữ cũ "trung bình đến mạnh" không có nguồn.
  - cu: rà soát toàn bộ văn hiến lúc bấy giờ về cách đo, các yếu tố ảnh hưởng và lý thuyết.
    moi: 'rà soát rộng văn hiến lúc bấy giờ về ba mảng: cách đo, các yếu tố ảnh hưởng và lý thuyết.'
    ly_do: '"Toàn bộ" quá mạnh; tóm tắt bài nói ba mảng (measurement, causal factors, theory).'
  - cu: 'Đóng góp lasting nhất của bài báo là một định nghĩa làm việc, vẫn được dùng đến nay: **subjective well-being (hạnh phúc chủ quan)** gồm ba thành phần — **hài lòng với cuộc sống** (đánh giá *bằng lý trí* về cuộc đời mình), **cảm xúc tích cực**, và **cảm xúc tiêu cực** (ở mức thấp). Viết gọn: **SWB = hài lòng cuộc sống + cảm xúc tích cực − cảm xúc tiêu cực**.'
    moi: 'Bài báo mô tả **subjective well-being (hạnh phúc chủ quan)** có ba đặc điểm: mang tính chủ quan, gồm cả các chỉ báo tích cực (không chỉ là vắng điều tiêu cực), và là một đánh giá tổng thể. Diener nêu ba thành phần được các nhà nghiên cứu xem xét: **hài lòng với cuộc sống** (đánh giá *bằng lý trí* về cuộc đời mình), **cảm xúc tích cực**, và **cảm xúc tiêu cực**. Bài không đưa ra một phép cộng điểm; ba thành phần được đo riêng.'
    ly_do: Diener (1984) không nêu công thức SWB = hài lòng + tích cực − tiêu cực (phép trừ chỉ có ở thang Cân bằng cảm xúc của Bradburn); "vẫn được dùng đến nay" không có nguồn; "lasting" là chữ tiếng Anh lọt vào.
  - cu: 'Điểm tinh tế mà Diener nhấn mạnh: hai thành phần này *liên quan* nhưng *không trùng nhau*. Nghiên cứu sau này (Lucas, Diener và Suh, 1996) cho thấy các thang đo hài lòng cuộc sống, cảm xúc tích cực và cảm xúc tiêu cực tạo thành các nhân tố tách biệt được với nhau'
    moi: Diener (1984) coi việc hài lòng cuộc sống và cảm xúc liên hệ với nhau thế nào là một câu hỏi cần dữ liệu trả lời, không phải chuyện định nghĩa. Nghiên cứu sau này (Lucas, Diener và Suh, 1996), dùng ma trận đa đặc điểm–đa phương pháp trên ba bộ dữ liệu, cho thấy hài lòng cuộc sống, cảm xúc tích cực và cảm xúc tiêu cực phân biệt được với nhau
    ly_do: Diener 1984 không "nhấn mạnh" điều này mà nói là câu hỏi thực nghiệm; Lucas 1996 nói "discriminable".
  - cu: 'Để đo thành phần "hài lòng cuộc sống", nhóm của Diener xây dựng **Satisfaction With Life Scale (SWLS)** qua ba giai đoạn: 48 câu hỏi thử nghiệm trên 176 sinh viên Đại học Illinois, rút gọn bằng phân tích nhân tố còn **5 câu**; 163 sinh viên khác để kiểm tra độ hội tụ với 9 thang đo khác; và 53 người cao tuổi (tuổi trung bình 75) để kiểm tra trên nhóm tuổi khác.'
    moi: 'Để đo thành phần "hài lòng cuộc sống", nhóm của Diener xây dựng **Satisfaction With Life Scale (SWLS)**. Từ 48 câu ban đầu, phân tích nhân tố rồi loại các câu tải thấp hay trùng nghĩa, còn lại **5 câu**. Nghiên cứu 1: 176 sinh viên Đại học Illinois, trong đó 76 người làm lại sau 2 tháng. Nghiên cứu 2: so với các thang hạnh phúc chủ quan khác ở 176 và 163 sinh viên. Nghiên cứu 3: 53 người cao tuổi (tuổi trung bình 75).'
    ly_do: 'Bài gốc: 176 sinh viên là mẫu của cả Nghiên cứu 1 và 2 (không phải "ba giai đoạn" với 163 người riêng cho thang đo); chỉ 76 người làm lại; rút gọn qua loại câu tải thấp và trùng nghĩa.'
  - cu: Điểm 20 là trung tính; 31–35 "cực kỳ hài lòng", 26–30 "hài lòng", 21–25 "hơi hài lòng", 15–19 "hơi bất mãn", 10–14 "bất mãn", 5–9 "cực kỳ bất mãn".
    moi: 'Điểm 20 là điểm trung tính (Pavot và Diener, 1993). Cách đọc điểm theo hướng dẫn của Diener: 30–35 rất cao, 25–29 cao, 20–24 trung bình (mức thường gặp ở các nước phát triển), 15–19 hơi dưới trung bình, 10–14 không hài lòng, 5–9 rất không hài lòng. Đây là cách diễn giải để dễ hình dung, không phải ngưỡng chẩn đoán.'
    ly_do: Các mốc và nhãn cũ không khớp hướng dẫn của Diener (và không có trong bài 1985); lấy theo tài liệu "Understanding Scores on the SWLS" và Pavot & Diener 1993.
  - cu: '**Kết quả.** Thang cho thấy các chỉ số tâm lý đo lường tốt: **nhất quán nội tại** Cronbach''s alpha = 0,87; **ổn định theo thời gian** — đo lại sau 2 tháng, tương quan r = 0,82; **giá trị hội tụ** — tương quan với 9 thang hạnh phúc chủ quan khác ở mức trung bình đến cao (ví dụ với câu hỏi "phần trăm thời gian cảm thấy hạnh phúc" của Fordyce: r = 0,57–0,62; với thang Cantril: r = 0,62–0,66). Với nhóm người cao tuổi, SWLS tương quan r = 0,46 với Life Satisfaction Index của Adams (1969).'
    moi: '**Kết quả.** Thang cho thấy các chỉ số đo lường tốt ở nhóm sinh viên: **nhất quán nội tại** Cronbach''s alpha = 0,87; **ổn định theo thời gian** — đo lại sau 2 tháng, tương quan r = 0,82; **giá trị hội tụ** — tương quan với các thang hạnh phúc chủ quan khác ở mức trung bình đến cao (r từ 0,47 đến 0,75, không kể thang cảm xúc tiêu cực của Bradburn: r = −0,37 và −0,32; ví dụ với câu hỏi "phần trăm thời gian cảm thấy hạnh phúc" của Fordyce: r = 0,58 và 0,62; với thang Cantril: r = 0,62 và 0,66). Với nhóm người cao tuổi, SWLS tương quan r = 0,46 với bản sửa của Life Satisfaction Index (Adams, 1969) và r = 0,43 với đánh giá của người phỏng vấn.'
    ly_do: 'Bảng 2 bài gốc: Fordyce (phần trăm) 0,58 và 0,62 (không phải 0,57–0,62); khoảng chung 0,47–0,75, có tương quan âm với thang cảm xúc tiêu cực; "9 thang" gồm cả thang cảm xúc tiêu cực nên nêu rõ.'
  - cu: 'Nói cách khác: 5 câu hỏi ngắn này đo được *cùng một thứ* mà các thang đo dài và khác nhau cùng đo — và đo khá ổn định theo thời gian.'
    moi: 'Nói cách khác: 5 câu hỏi ngắn này đo được điều gần với thứ mà các thang đo dài và khác nhau cũng đo (tương quan ở mức trung bình đến cao, không phải bằng nhau) — và khá ổn định theo thời gian ở nhóm sinh viên.'
    ly_do: '"Cùng một thứ" mạnh hơn tương quan 0,47–0,75.'
  - cu: 'so sánh các thang tự đánh giá (cả dạng một câu hỏi lẫn nhiều câu hỏi) với các cách đo *không phải tự đánh giá*: đánh giá của người thân và bạn bè am hiểu, đo lường cảm xúc theo thời gian thực (experience sampling), và bài kiểm tra trí nhớ về các sự kiện tốt/xấu trong đời.'
    moi: so sánh các thang tự đánh giá (cả dạng một câu hỏi lẫn nhiều câu hỏi) với các cách đo *không phải tự đánh giá*; theo tóm tắt bài, các cách này gồm đánh giá của người nhà và bạn bè (tóm tắt không liệt kê hết các cách còn lại).
    ly_do: Không mở được toàn văn Sandvik 1993; tóm tắt chỉ nói "five non-self-report measures" và nêu informant (người nhà, bạn bè), nên bỏ experience sampling và kiểm tra trí nhớ.
  - cu: '**Kết quả.** Phân tích nhân tố cho thấy **một nhân tố chung duy nhất** nằm dưới tất cả các cách đo. Các thang tự đánh giá tương quan với các cách đo khác ở **mức trung bình đến mạnh**, và đánh giá của người nhà so với bạn bè cũng nhất quán với nhau.'
    moi: '**Kết quả.** Phân tích nhân tố các cách đo tự đánh giá và không tự đánh giá cho thấy **một cấu trúc chung duy nhất** nằm dưới chúng. Các thang tự đánh giá thông thường **tương quan cao** với các cách đo khác, và đánh giá của người nhà so với bạn bè cho thấy sự nhất quán đáng kể giữa các hoàn cảnh và theo thời gian.'
    ly_do: 'Tóm tắt: "correlated highly", "considerable cross-situational consistency and temporal stability"; "tất cả các cách đo" không đúng (tóm tắt nói các cách đo tự đánh giá và không tự đánh giá).'
  - cu: 'Kết luận của họ: các thang tự đánh giá thông thường *đo được* khái niệm hạnh phúc chủ quan một cách có giá trị, dù không hoàn hảo; các cách đo bổ sung (người thân, đo thời gian thực, trí nhớ) giúp có bức tranh đầy đủ hơn.'
    moi: 'Kết luận của họ: các thang tự đánh giá thông thường *đo được* khái niệm hạnh phúc chủ quan một cách có giá trị; các cách đo không tự đánh giá hữu ích để có bức tranh đầy đủ hơn.'
    ly_do: Chỉ giữ điều tóm tắt nói.
  - cu: 909 phụ nữ có việc làm tái cấu trúc *ngày hôm qua*
    moi: 909 phụ nữ có việc làm (trong mẫu tiện lợi 1.018 người, chọn những người đã đi làm vào ngày được hỏi) tái cấu trúc *ngày hôm qua*
    ly_do: 'Bài gốc: mẫu tiện lợi 1.018, phân tích 909 người đã làm việc vào ngày tham chiếu.'
  - cu: '(phương pháp "vàng" nhưng nặng nề: máy nhắn tin nhắc người tham gia ghi lại cảm xúc nhiều lần mỗi ngày trong nhiều tuần), mà gánh nặng cho người tham gia thấp hơn nhiều.'
    moi: '(phương pháp "vàng" nhưng nặng nề: người tham gia được nhắc ghi lại cảm xúc nhiều lần trong ngày), mà gánh nặng cho người tham gia thấp hơn.'
    ly_do: '"Máy nhắn tin", "nhiều tuần", "thấp hơn nhiều" không có trong bài Kahneman 2004 (bài nói "less respondent burden", ESM nhắc "several times throughout the day").'
  - cu: 'Thang SWLS có alpha 0,87 và test-retest 2 tháng r = 0,82; nó hội tụ với 9 thang đo khác (r ≈ 0,5–0,7) và với đánh giá của người thân, đo lường thời gian thực, trí nhớ sự kiện ở mức trung bình đến mạnh (Sandvik và cộng sự, 1993). Đây là mức bằng chứng đủ để nói: hạnh phúc chủ quan *đo được*.'
    moi: 'Thang SWLS có alpha 0,87 và test-retest 2 tháng r = 0,82 (bài gốc, sinh viên Mỹ); nó hội tụ với các thang hạnh phúc chủ quan khác (r ≈ 0,47–0,75), và các thang tự đánh giá tương quan cao với các cách đo không tự đánh giá (Sandvik và cộng sự, 1993). Phân tích tổng hợp thấy tự đánh giá và đánh giá của người quen tương quan ở mức trung bình (r ≈ 0,42; Schneider và Schimmack, 2009), và tổng quan hệ thống các bản dịch SWLS thấy độ nhất quán nội tại đạt ở hầu hết các nghiên cứu. Đây là mức bằng chứng đủ để nói: hạnh phúc chủ quan *đo được*, nhưng chủ yếu dựa vào tự báo cáo, và độ ổn định theo thời gian ít được kiểm tra ở các bản dịch.'
    ly_do: Sửa số theo Bảng 2 bài gốc; bỏ "đo lường thời gian thực, trí nhớ sự kiện" (không kiểm được); thêm hai tổng hợp (Schneider & Schimmack 2009; Milo 2025) và giới hạn.
  - cu: '*Hai*, câu trả lời chịu ảnh hưởng của ngữ cảnh: tâm trạng lúc trả lời, câu hỏi đứng trước nó.'
    moi: '*Hai*, câu trả lời có thể chịu ảnh hưởng của tâm trạng lúc trả lời (Schwarz và Clore, 1983, theo Diener, 1984: trạng thái cảm xúc nhất thời, như do thời tiết, ảnh hưởng đến phán đoán về hạnh phúc và hài lòng).'
    ly_do: Diener 1984 chỉ nêu bằng chứng về tâm trạng nhất thời; "câu hỏi đứng trước nó" không có nguồn đã mở.
  - cu: '- **Cái tôi trải nghiệm và cái tôi ghi nhớ.** Điểm số "cuộc đời nói chung" (SWLS) là sản phẩm của trí nhớ và cách ta kể chuyện về đời mình; điểm số "ngay lúc này" (experience sampling, DRM) là sản phẩm của trải nghiệm trực tiếp. Hai cái tôi này không phải lúc nào cũng đồng ý — đó là lý do các cách đo tương quan ở mức trung bình đến mạnh chứ không gần bằng 1.'
    moi: '- **Cái tôi trải nghiệm và cái tôi ghi nhớ.** Một cách giải thích: điểm số "cuộc đời nói chung" (SWLS) dựa vào việc nhìn lại và cân nhắc cuộc đời mình; điểm số "ngay lúc này" (experience sampling, DRM) dựa vào trải nghiệm trực tiếp. Hai thứ này liên quan nhưng không giống nhau: trong dữ liệu DRM, hài lòng cuộc sống chỉ tương quan vừa phải (r = 0,38) với cảm xúc thuần hằng ngày (Kahneman và cộng sự, 2004). Đây là cách diễn giải, chưa phải điều đã được kiểm chứng riêng.'
    ly_do: Câu cũ khẳng định "đó là lý do" mà không có nguồn; viết thành giả thuyết và thêm số r = 0,38 của Kahneman 2004.
  - cu: 'Tâm trạng nhất thời, thứ tự câu hỏi, mong muốn "trông có vẻ ổn" đều làm nhiễu câu trả lời. Nhưng nghiên cứu của Sandvik và cộng sự (1993) cho thấy: khi gộp nhiều cách đo độc lập lại, chúng cùng chỉ về một nhân tố chung.'
    moi: 'Tâm trạng nhất thời ảnh hưởng đến câu trả lời (Schwarz và Clore, 1983, theo Diener, 1984); còn mong muốn "trông có vẻ ổn" thì ở SWLS gần như không liên quan (r = 0,02 với thang mong muốn xã hội Marlowe–Crowne). Nghiên cứu của Sandvik và cộng sự (1993) cho thấy: khi gộp nhiều cách đo độc lập lại, chúng cùng chỉ về một cấu trúc chung.'
    ly_do: '"Thứ tự câu hỏi" không có nguồn; mong muốn xã hội: SWLS 1985 r = 0,02.'
  - cu: 'Với test-retest r = 0,82 trong 2 tháng, SWLS đủ ổn định để bạn tự chấm mỗi tháng một lần và nhìn xu hướng của *chính mình*. Điểm số tuyệt đối ít ý nghĩa hơn sự thay đổi: tăng 5 điểm sau khi đổi công việc nói lên nhiều điều hơn việc bạn được 24 còn đồng nghiệp được 27.'
    moi: 'Với test-retest r = 0,82 trong 2 tháng (ở sinh viên), SWLS khá ổn định ở mức nhóm, nên nếu muốn theo dõi bản thân thì nên nhìn xu hướng qua nhiều lần chấm của *chính mình* hơn là so với người khác. Nhưng điểm của một người vẫn dao động: với độ lệch chuẩn 6,43 và r = 0,82 của bài gốc, sai số chuẩn của một điểm khoảng 2,7 điểm (tính từ số liệu bài gốc), nên chênh vài điểm giữa hai lần chấm có thể chỉ là nhiễu đo lường. Đây là suy luận từ độ tin cậy ở mức nhóm; chưa có nghiên cứu kiểm tra riêng cách tự theo dõi này.'
    ly_do: Câu "tăng 5 điểm nói lên nhiều điều" vượt quá độ tin cậy 0,82 (sai số chuẩn khoảng 2,7 điểm); đánh dấu là suy luận.
  - cu: 'Cách làm đơn giản, phù hợp với bằng chứng: mỗi tối ghi nhanh 3 cảm xúc chính trong ngày, mỗi tháng chấm SWLS một lần. Khi hai chiều lệch nhau — ví dụ SWLS cao nhưng tối nào cũng căng thẳng — đó là thông tin đáng giá, không phải lỗi của thang đo.'
    moi: 'Một cách làm đơn giản gợi ý từ sự tách biệt này (chưa có nghiên cứu kiểm tra riêng cách làm): mỗi tối ghi nhanh 3 cảm xúc chính trong ngày, thỉnh thoảng chấm SWLS. Khi hai chiều lệch nhau — ví dụ SWLS cao nhưng tối nào cũng căng thẳng — đó có thể là thông tin đáng chú ý, không nhất thiết là lỗi của thang đo.'
    ly_do: '"Phù hợp với bằng chứng" quá mạnh cho một cách làm chưa được kiểm tra.'
  - cu: Đánh giá của người am hiểu bạn tương quan ở mức trung bình đến mạnh với tự đánh giá của bạn. Nếu bạn tự chấm mình 30/35 mà người bạn đời thấy bạn kiệt sức mỗi tối, khoảng cách đó đáng để lắng nghe — hai góc nhìn bắt hai lớp khác nhau của cùng một hiện tượng.
    moi: Đánh giá của người quen biết bạn tương quan ở mức trung bình (r ≈ 0,42 trong phân tích tổng hợp) với tự đánh giá của bạn. Nếu bạn tự chấm mình 30/35 mà người bạn đời thấy bạn kiệt sức mỗi tối, khoảng cách đó đáng để lắng nghe — hai góc nhìn có thể thấy những phần khác nhau của cùng một hiện tượng, và không bên nào tự động đúng hơn.
    ly_do: Số theo Schneider & Schimmack 2009; bỏ "bắt hai lớp" (không nguồn).
  - cu: '*diễn giải* điểm số trong bối cảnh văn hóa Việt Nam vẫn là vùng chưa có dữ liệu (xem phần sau)'
    moi: '*diễn giải* điểm số trong bối cảnh văn hóa Việt Nam vẫn còn ít dữ liệu (xem phần sau)'
    ly_do: Đã có một nghiên cứu kiểm định bản tiếng Việt (Arrindell 2022).
  - cu: '**Chúng tôi chưa tìm thấy nghiên cứu kiểm chứng thang SWLS (hay bất kỳ thang đo hạnh phúc chủ quan chuẩn nào) trên người Việt**, và không suy diễn độ tin cậy của thang đo từ mẫu Mỹ sang người Việt. Mọi con số trong bài (alpha 0,87; test-retest 0,82; các tương quan hội tụ) đều từ sinh viên Mỹ và người cao tuổi Mỹ.'
    moi: 'Tính đến 11/2026, chúng tôi tìm thấy một nghiên cứu kiểm tra bản tiếng Việt của SWLS: Arrindell và cộng sự (2022) trên 1.073 tình nguyện viên ở TP Hồ Chí Minh (14–64 tuổi, trung bình 23 tuổi; mẫu tiện lợi). Họ thấy cấu trúc một chiều như bản gốc và độ tin cậy omega đạt, thang đo tương đương giữa nam và nữ, giữa các mức học vấn; nhưng so sánh giữa các nhóm tuổi thì chưa đạt, nên cần thận trọng. **Chúng tôi chưa tìm thấy** nghiên cứu về độ ổn định theo thời gian của bản tiếng Việt hay mẫu đại diện toàn quốc, và không suy diễn độ tin cậy từ mẫu Mỹ sang người Việt. Các con số gốc trong bài (alpha 0,87; test-retest 0,82; các tương quan hội tụ) đều từ sinh viên và người cao tuổi ở Mỹ.'
    ly_do: 'Câu cũ "chưa tìm thấy nghiên cứu kiểm chứng SWLS trên người Việt" sai: có Arrindell 2022 (tìm 10/11/2026).'
  - cu: '- Một thang đo dịch sang tiếng Việt cần được kiểm tra lại: từ "satisfied" trong tiếng Anh và "hài lòng" trong tiếng Việt có thể không phủ cùng một vùng nghĩa; chuẩn điểm (bao nhiêu là "cao") cũng không thể bê nguyên từ mẫu Mỹ.'
    moi: '- Một thang đo dịch sang tiếng Việt cần được kiểm tra lại: tổng quan hệ thống các bản dịch SWLS nhấn mạnh cần quy trình kiểm định chuẩn hóa khi dịch; còn chuẩn điểm (bao nhiêu là "cao") thì, theo suy luận từ các khác biệt văn hóa nêu trên, không nên bê nguyên từ mẫu Mỹ.'
    ly_do: Bỏ khẳng định về vùng nghĩa của "satisfied/hài lòng" (không nguồn); thêm nguồn Milo 2025.
  - cu: và với người Việt, việc hiệu chỉnh đó chưa ai làm một cách bài bản, theo những gì chúng tôi tìm được.
    moi: và với người Việt, mới thấy một nghiên cứu về cấu trúc và tương đương đo lường, chưa thấy chuẩn điểm cho người Việt, theo những gì chúng tôi tìm được tính đến 11/2026.
    ly_do: Cập nhật theo Arrindell 2022; thêm mốc.
  - cu: nhưng *ý nghĩa của con số* thì phải hiệu chỉnh theo văn hóa
    moi: nhưng *ý nghĩa của con số* thì phải hiệu chỉnh theo văn hóa (SWLS đã được dịch sang hơn 30 ngôn ngữ)
    ly_do: Thêm số ngôn ngữ theo Milo 2025.
  - cu: 'Sai: các thang đo cho độ nhất quán nội tại cao (alpha 0,87), ổn định theo thời gian (r = 0,82 sau 2 tháng), và hội tụ với đánh giá của người thân cùng đo lường thời gian thực.'
    moi: 'Sai: thang SWLS cho độ nhất quán nội tại cao (alpha 0,87), ổn định theo thời gian (r = 0,82 sau 2 tháng), và hội tụ ở mức trung bình với đánh giá của người thân (r ≈ 0,42 trong phân tích tổng hợp).'
    ly_do: Bỏ "đo lường thời gian thực" (không kiểm được); thêm số.
  - cu: 'Chưa đủ tốt: thang nhiều câu hỏi đáng tin cậy hơn, và các thành phần'
    moi: 'Chưa đủ tốt: thang nhiều câu hỏi thường ổn định theo thời gian hơn thang một câu (Diener, 1984), và các thành phần'
    ly_do: Câu cũ không có nguồn; Diener 1984 nói về độ tin cậy theo thời gian.
  - cu: + Mọi cách đo cùng chỉ về một nhân tố chung, tương quan với nhau ở mức trung bình đến mạnh.
    moi: + Các cách đo cùng chỉ về một cấu trúc chung, và các thang tự đánh giá tương quan cao với các cách đo khác.
