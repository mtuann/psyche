    moi: '> r = 0,82 là mức ổn định khá tốt ở mức nhóm (76 sinh viên làm lại sau 2 tháng), nhưng điểm số vẫn có dao động thật chứ không phải hằng số.'
    ly_do: 'Khớp với sửa ở mục Áp dụng 1: độ tin cậy ở mức nhóm không đủ để kết luận về thay đổi nhỏ của một người.'
