  - id: n35
    cau: 'Khung Khá vững: hạnh phúc chủ quan đo được, với độ tin cậy tốt.'
    loai: nhan
    nguon:
      - diener1985
      - sandvik1993
      - schneider2009
      - milo2025
      - pavot1993
    nhan: kha-vung
    co_so:
      - diener1985
      - sandvik1993
      - schneider2009
      - milo2025
    ly_do: 'Nhiều nghiên cứu cùng chiều (bài gốc SWLS, Sandvik 1993, tổng quan của Pavot & Diener 1993) và hai tổng hợp: phân tích tổng hợp 44 mẫu thấy tự đánh giá và đánh giá người quen tương quan trung bình (r ≈ 0,42), tổng quan hệ thống các bản dịch SWLS thấy độ nhất quán đạt ở hầu hết nghiên cứu (alpha 0,74–0,89). Chưa lên Vững chắc vì độ ổn định theo thời gian ít được kiểm ở bản dịch, tương quan với người quen chỉ ở mức trung bình, và ý nghĩa của điểm thay đổi theo văn hóa (Suh 1998).'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Thang SWLS có alpha 0,87 và test-retest 2 tháng r = 0,82; nó hội tụ với 9 thang đo khác (r ≈ 0,5–0,7) và với đánh giá của người thân, đo lường thời gian thực, trí nhớ sự kiện ở mức trung bình đến mạnh (Sandvik và cộng sự, 1993). Đây là mức bằng chứng đủ để nói: hạnh phúc chủ quan *đo được*.". Chữ mới: "Thang SWLS có alpha 0,87 và test-retest 2 tháng r = 0,82 (bài gốc, sinh viên Mỹ); nó hội tụ với các thang hạnh phúc chủ quan khác (r ≈ 0,47–0,75), và các thang tự đánh giá tương quan cao với các cách đo không tự đánh giá (Sandvik và cộng sự, 1993). Phân tích tổng hợp thấy tự đánh giá và đánh giá của". Lý do: Sửa số theo Bảng 2 bài gốc; bỏ "đo lường thời gian thực, trí nhớ sự kiện" (không kiểm được); thêm hai tổng hợp (Schneider & Schimmack 2009; Milo 2025) và giới hạn. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khá vững hợp thước đo mục 4: có hai tổng hợp (Schneider & Schimmack 2009; Milo 2025) nhưng độ ổn định theo thời gian ít được kiểm ở bản dịch, tương quan với người quen chỉ ở mức trung bình, chủ yếu tự báo cáo và mẫu phương Tây. Chưa đủ lên Vững chắc. Giữ.'
    luot_2: dung
