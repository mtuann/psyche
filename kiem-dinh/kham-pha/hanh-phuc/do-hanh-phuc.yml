  - cu: 'Khung "Đang tranh cãi: diễn giải các con số như thế nào": "Ba điểm còn tranh luận. … Hai, câu trả lời có thể chịu ảnh hưởng của tâm trạng lúc trả lời (Schwarz và Clore, 1983 …: … thời tiết, ảnh hưởng …)".'
    moi: 'Khung "Khá vững: điểm hạnh phúc đọc được, nhưng cần diễn giải thận trọng": "Ba điểm cần thận trọng. … Hai, ảnh hưởng của tâm trạng lúc trả lời chưa nhất quán: Schwarz và Clore (1983 …) thấy …; nhưng trong một mẫu đại diện hơn 1 triệu người Mỹ, thời tiết không ảnh hưởng đáng tin cậy đến phán đoán hài lòng cuộc sống (Lucas và Lawless, 2013)."'
    ly_do: "Review n38, n40: nhãn Đang tranh cãi không khớp thước đo mục 4 (các điểm cùng chiều, ít nghiên cứu mỗi điểm: Khá vững); ví dụ thời tiết mất ổn định (Lucas & Lawless 2013)."
  - cu: 'Lý thuyết 3: "Tâm trạng nhất thời ảnh hưởng đến câu trả lời (Schwarz và Clore, 1983, theo Diener, 1984); còn mong muốn …"'
    moi: '"Tâm trạng nhất thời có thể ảnh hưởng đến câu trả lời (Schwarz và Clore, 1983, theo Diener, 1984), dù trong một mẫu hơn 1 triệu người Mỹ thời tiết không ảnh hưởng đáng tin cậy đến hài lòng cuộc sống (Lucas và Lawless, 2013); còn mong muốn …"'
    ly_do: Review n40.
  - cu: 'Câu hỏi 5: "Vì sao phần "diễn giải" các con số hạnh phúc vẫn được gắn nhãn "đang tranh cãi"?" (đáp án: hài lòng và cảm xúc là hai chiều tách biệt, chịu ảnh hưởng của ngữ cảnh trả lời và khác nhau giữa các văn hóa)'
    moi: '"Vì sao phần "diễn giải" các con số hạnh phúc chỉ được gắn nhãn "khá vững", chưa phải "vững chắc"?" (đáp án: mỗi điểm mới dựa vào một hai nghiên cứu: hai chiều tách biệt, tâm trạng lúc trả lời chưa nhất quán, khác nhau giữa các văn hóa)'
    ly_do: Đổi nhãn khung (review n38, n79).
