    ghi_chu: 'Chữ cũ: "Để đo thành phần "hài lòng cuộc sống", nhóm của Diener xây dựng **Satisfaction With Life Scale (SWLS)** qua ba giai đoạn: 48 câu hỏi thử nghiệm trên 176 sinh viên Đại học Illinois, rút gọn bằng phân tích nhân tố còn **5 câu**; 163 sinh viên khác để kiểm tra độ hội tụ với 9 thang đo khác; và 53 người". Chữ mới: "Để đo thành phần "hài lòng cuộc sống", nhóm của Diener xây dựng **Satisfaction With Life Scale (SWLS)**. Từ 48 câu ban đầu, phân tích nhân tố rồi loại các câu tải thấp hay trùng nghĩa, còn lại **5 câu**. Nghiên cứu 1: 176 sinh viên Đại học Illinois, trong đó 76 người làm lại sau 2 tháng. Nghiên cứu ". Lý do: Bài gốc: 176 sinh viên là mẫu của cả Nghiên cứu 1 và 2 (không phải "ba giai đoạn" với 163 người riêng cho thang đo); chỉ 76 người làm lại; rút gọn qua loại câu tải thấp và trùng nghĩa. Review (Claude Sonnet 5.5, 10/11/2026): dung. Số liệu thiết kế (48 → 10 → 5 câu; 176, 76, 163, 53 người; tuổi 75) khớp trích bài gốc; chữ trang không còn "ba giai đoạn".'
