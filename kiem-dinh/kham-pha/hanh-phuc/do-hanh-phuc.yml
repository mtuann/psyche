  - id: n32
    cau: 'DRM: 909 phụ nữ có việc làm (trong mẫu tiện lợi 1.018 người) tái cấu trúc ngày hôm qua thành các đoạn và đánh giá cảm xúc từng đoạn.'
    loai: so-lieu
    nguon:
      - kahneman2004
    trich: a convenience sample of 1018 employed women, focusing on the subset of 909 who had worked on the reference day
    vi_tri: tr. 1777
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "909 phụ nữ có việc làm tái cấu trúc *ngày hôm qua*". Chữ mới: "909 phụ nữ có việc làm (trong mẫu tiện lợi 1.018 người, chọn những người đã đi làm vào ngày được hỏi) tái cấu trúc *ngày hôm qua*". Lý do: Bài gốc: mẫu tiện lợi 1.018, phân tích 909 người đã làm việc vào ngày tham chiếu. Ví dụ "ăn sáng, đi làm, họp" là minh họa. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp trích Kahneman 2004 (mẫu tiện lợi 1.018, phân tích 909 người đã làm việc ngày tham chiếu).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1126/science.1103572" ]
    luot_2_ghi_chu: Đúng. 909 là số người có đi làm vào ngày tham chiếu.
    review: dung
  - id: n33
    cau: Kết quả DRM gần với kết quả experience sampling (phương pháp được coi là chuẩn vàng), với gánh nặng cho người tham gia thấp hơn.
    loai: phat-hien
    nguon:
      - kahneman2004
    trich: documenting close correspondences between the DRM reports of 909 employed women and established results from experience sampling [...] Experience sampling is the gold standard
    vi_tri: tr. 1776–1777
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(phương pháp "vàng" nhưng nặng nề: máy nhắn tin nhắc người tham gia ghi lại cảm xúc nhiều lần mỗi ngày trong nhiều tuần), mà gánh nặng cho người tham gia thấp hơn nhiều.". Chữ mới: "(phương pháp "vàng" nhưng nặng nề: người tham gia được nhắc ghi lại cảm xúc nhiều lần trong ngày), mà gánh nặng cho người tham gia thấp hơn.". Lý do: "Máy nhắn tin", "nhiều tuần", "thấp hơn nhiều" không có trong bài Kahneman 2004 (bài nói "less respondent burden", ESM nhắc "several times throughout the day"). Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp: tác giả gọi experience sampling là gold standard và DRM ít gánh nặng hơn; trang không còn "máy nhắn tin", "nhiều tuần".'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1126/science.1103572" ]
    luot_2_ghi_chu: Chữ "chuẩn vàng" là của chính tác giả (nhưng DRM vẫn tốn 45-75 phút).
    review: dung
