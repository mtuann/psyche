nhan_dinh:
  - id: n1
    cau: 'Mô tả trang (frontmatter): bài nói về khái niệm subjective well-being của Diener, thang SWLS 5 câu hỏi và độ tin cậy của các cách đo.'
    loai: phat-hien
    nguon:
      - diener1985
    trich: The Satisfaction With Life Scale (SWLS)
    vi_tri: tr. 71 (tên bài, tóm tắt)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327752jpa4901_13", "https://doi.org/10.1037/0033-2909.95.3.542" ]
    luot_2_ghi_chu: Đọc toàn văn Diener 1984 (Internet Archive) và SWLS 1985. Mô tả khớp nội dung hai bài.
  - id: n2
    cau: 'Thử 1: năm câu (gần với lời gốc) và thang 1 (hoàn toàn không đồng ý) đến 7 (hoàn toàn đồng ý), tổng trên 35.'
    loai: cong-cu
    nguon:
      - diener1985
    trich: 1. In most ways my life is close to my ideal. [...] 5. If I could live my life over, I would change almost nothing.
    vi_tri: 'Bảng 1, tr. 72; thang 7 điểm: 1 = strongly disagree … 7 = strongly agree'
    ket_qua: dung
    ghi_chu: Bản dịch giản lược, đã nói rõ trên trang; thứ tự và nghĩa năm câu khớp bài gốc. Tổng tối đa 5 × 7 = 35.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327752jpa4901_13" ]
    luot_2_ghi_chu: Toàn văn bài 1985 (Table 1) có đúng 5 câu, thang 1-7; tổng tối đa 35.
  - id: n3
    cau: 'Thử 2 (đáp án thu gọn): điểm tự chấm và điểm bạn thân chấm tương quan ở mức trung bình (r ≈ 0,42, 44 mẫu, 8.897 người), không trùng khớp nhưng không ngẫu nhiên.'
    loai: so-lieu
    nguon:
      - schneider2009
    trich: The average self-informant correlation based on 44 independent samples and 81 correlations for a total of 8,897 participants was r = 0.42
    vi_tri: tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Hai điểm số thường **tương quan ở mức trung bình đến mạnh** — không trùng khớp, nhưng cũng không ngẫu nhiên. Đây là một trong những bằng chứng cho thấy hạnh phúc *có thể* đo được.". Chữ mới: "Trong một phân tích tổng hợp 44 mẫu (8.897 người), điểm tự chấm và điểm do người quen chấm tương quan ở mức **trung bình** (r ≈ 0,42) — không trùng khớp, nhưng cũng không ngẫu nhiên. Đây là một trong những bằng chứng cho thấy hạnh phúc *có thể* đo được.". Lý do: Con số cụ thể theo Schneider & Schimmack (2009); chữ cũ "trung bình đến mạnh" không có nguồn. Review (Claude Sonnet 5.5, 10/11/2026): dung. Chữ mới khớp tóm tắt Schneider & Schimmack (44 mẫu, 81 hệ số, 8.897 người, r = 0,42); "người quen" thay "bạn thân" đúng với informant.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1007/s11205-009-9440-y" ]
    luot_2_ghi_chu: Tổng hợp tự đánh giá với người thông tin (informant) nói chung, không riêng bạn thân; câu chỉ nói ngắn gọn nên chấp nhận. Chỉ đọc tóm tắt (trang Springer).
    review: dung
  - id: n4
    cau: 'Mở bài: nghi ngờ rằng điểm hạnh phúc có thể khác nhau do tâm trạng lúc trả lời; các nhà nghiên cứu đã kiểm tra các lo ngại này từ lâu (Diener 1984: tâm trạng nhất thời ảnh hưởng câu trả lời).'
    loai: phat-hien
    nguon:
      - diener1984
    trich: there is evidence that momentary mood influences subjects' responses to SWB questions (Schwarz & Clore, 1983)
    vi_tri: tr. 546–547, mục "Measurement Issues"
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.95.3.542" ]
    luot_2_ghi_chu: "Diener 1984 cũng nói thêm: điểm thang nhiều câu không bị méo đáng kể và độ tin cậy theo thời gian đáng kể. Câu đủ cân bằng."
  - id: n5
    cau: Diener công bố bài tổng quan "Subjective Well-Being" năm 1984 trên Psychological Bulletin, 95(3), 542–575.
    loai: lich-su
    nguon:
      - diener1984
    trich: Psychological Bulletin 1984, Vol. 95, No. 3, 542-575
    vi_tri: trang đầu
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.95.3.542" ]
    luot_2_ghi_chu: Đọc trang đầu bài gốc.
  - id: n6
    cau: Bài Diener 1984 rà soát rộng văn hiến về cách đo, các yếu tố ảnh hưởng và lý thuyết.
    loai: phat-hien
    nguon:
      - diener1984
    trich: 'subjective well-being (SWB), including happiness, life satisfaction, and positive affect, is reviewed in three areas: measurement, causal factors, and theory'
    vi_tri: tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "rà soát toàn bộ văn hiến lúc bấy giờ về cách đo, các yếu tố ảnh hưởng và lý thuyết.". Chữ mới: "rà soát rộng văn hiến lúc bấy giờ về ba mảng: cách đo, các yếu tố ảnh hưởng và lý thuyết.". Lý do: "Toàn bộ" quá mạnh; tóm tắt bài nói ba mảng (measurement, causal factors, theory). Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp tóm tắt Diener 1984 (ba mảng: đo lường, nhân tố nguyên nhân, lý thuyết).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.95.3.542" ]
    luot_2_ghi_chu: Khớp tóm tắt bài gốc.
    review: dung
  - id: n7
    cau: 'Bài Diener 1984 mô tả hạnh phúc chủ quan có ba đặc điểm: chủ quan, gồm các chỉ báo tích cực, là đánh giá tổng thể.'
    loai: dinh-nghia
    nguon:
      - diener1984
    trich: The area of subjective well-being has three hallmarks. First, it is subjective. [...] Second, subjective well-being includes positive measures.
    vi_tri: tr. 543–544
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đóng góp lasting nhất của bài báo là một định nghĩa làm việc, vẫn được dùng đến nay: **subjective well-being (hạnh phúc chủ quan)** gồm ba thành phần — **hài lòng với cuộc sống** (đánh giá *bằng lý trí* về cuộc đời mình), **cảm xúc tích cực**, và **cảm xúc tiêu cực** (ở mức thấp). Viết gọn: **SWB = ". Chữ mới: "Bài báo mô tả **subjective well-being (hạnh phúc chủ quan)** có ba đặc điểm: mang tính chủ quan, gồm cả các chỉ báo tích cực (không chỉ là vắng điều tiêu cực), và là một đánh giá tổng thể. Diener nêu ba thành phần được các nhà nghiên cứu xem xét: **hài lòng với cuộc sống** (đánh giá *bằng lý trí* về". Lý do: Diener (1984) không nêu công thức SWB = hài lòng + tích cực − tiêu cực (phép trừ chỉ có ở thang Cân bằng cảm xúc của Bradburn); "vẫn được dùng đến nay" không có nguồn; "lasting" là chữ tiếng Anh lọt vào. Review (Claude Sonnet 5.5, 10/11/2026): dung. Ba đặc điểm khớp tr. 543–544; "không chỉ là vắng điều tiêu cực" đúng ý "includes positive measures".'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.95.3.542" ]
    luot_2_ghi_chu: Ba đặc điểm được nêu đúng như câu viết.
    review: dung
  - id: n8
    cau: 'Diener (1984) nêu ba thành phần của hạnh phúc chủ quan: hài lòng với cuộc sống (đánh giá lý trí), cảm xúc tích cực, cảm xúc tiêu cực; các thành phần đo riêng, không có phép cộng điểm trong bài.'
    loai: dinh-nghia
    nguon:
      - diener1984
    trich: 'three general components of subjective well-being: life satisfaction judgments, positive affect, and negative affect'
    vi_tri: tr. 549 (mục về đo các thành phần)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đóng góp lasting nhất của bài báo là một định nghĩa làm việc, vẫn được dùng đến nay: **subjective well-being (hạnh phúc chủ quan)** gồm ba thành phần — **hài lòng với cuộc sống** (đánh giá *bằng lý trí* về cuộc đời mình), **cảm xúc tích cực**, và **cảm xúc tiêu cực** (ở mức thấp). Viết gọn: **SWB = ". Chữ mới: "Bài báo mô tả **subjective well-being (hạnh phúc chủ quan)** có ba đặc điểm: mang tính chủ quan, gồm cả các chỉ báo tích cực (không chỉ là vắng điều tiêu cực), và là một đánh giá tổng thể. Diener nêu ba thành phần được các nhà nghiên cứu xem xét: **hài lòng với cuộc sống** (đánh giá *bằng lý trí* về". Lý do: Diener (1984) không nêu công thức SWB = hài lòng + tích cực − tiêu cực (phép trừ chỉ có ở thang Cân bằng cảm xúc của Bradburn); "vẫn được dùng đến nay" không có nguồn; "lasting" là chữ tiếng Anh lọt vào. Công thức SWB = hài lòng + tích cực − tiêu cực: đã bỏ (đã ghi ở nhận định ngay trên). Review (Claude Sonnet 5.5, 10/11/2026): dung. Ba thành phần khớp tr. 549; trang không còn phép cộng điểm.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.95.3.542" ]
    luot_2_ghi_chu: Diener 1984 dẫn ba thành phần này từ Andrews & Withey và nói chúng đo riêng ("measure the separate components"); không có phép cộng điểm. Câu đúng.
    review: dung
  - id: n9
    cau: Diener (1984) coi mối liên hệ giữa hài lòng cuộc sống và cảm xúc là câu hỏi thực nghiệm, không phải chuyện định nghĩa.
    loai: phat-hien
    nguon:
      - diener1984
    trich: How these two components relate to one another is an empirical question, not one of definition.
    vi_tri: tr. 543
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Điểm tinh tế mà Diener nhấn mạnh: hai thành phần này *liên quan* nhưng *không trùng nhau*. Nghiên cứu sau này (Lucas, Diener và Suh, 1996) cho thấy các thang đo hài lòng cuộc sống, cảm xúc tích cực và cảm xúc tiêu cực tạo thành các nhân tố tách biệt được với nhau". Chữ mới: "Diener (1984) coi việc hài lòng cuộc sống và cảm xúc liên hệ với nhau thế nào là một câu hỏi cần dữ liệu trả lời, không phải chuyện định nghĩa. Nghiên cứu sau này (Lucas, Diener và Suh, 1996), dùng ma trận đa đặc điểm–đa phương pháp trên ba bộ dữ liệu, cho thấy hài lòng cuộc sống, cảm xúc tích cực v". Lý do: Diener 1984 không "nhấn mạnh" điều này mà nói là câu hỏi thực nghiệm; Lucas 1996 nói "discriminable". Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp câu "an empirical question, not one of definition".'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.95.3.542" ]
    luot_2_ghi_chu: Bài nói về hài lòng cuộc sống và cảm xúc tích cực; đúng tinh thần câu.
    review: dung
  - id: n10
    cau: 'Lucas, Diener & Suh (1996): hài lòng cuộc sống, cảm xúc tích cực, cảm xúc tiêu cực phân biệt được với nhau (ma trận đa đặc điểm–đa phương pháp, ba bộ dữ liệu).'
    loai: phat-hien
    nguon:
      - lucas1996
    trich: life satisfaction is discriminable from positive and negative affect, (b) positive affect is discriminable from negative affect
    vi_tri: tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Điểm tinh tế mà Diener nhấn mạnh: hai thành phần này *liên quan* nhưng *không trùng nhau*. Nghiên cứu sau này (Lucas, Diener và Suh, 1996) cho thấy các thang đo hài lòng cuộc sống, cảm xúc tích cực và cảm xúc tiêu cực tạo thành các nhân tố tách biệt được với nhau". Chữ mới: "Diener (1984) coi việc hài lòng cuộc sống và cảm xúc liên hệ với nhau thế nào là một câu hỏi cần dữ liệu trả lời, không phải chuyện định nghĩa. Nghiên cứu sau này (Lucas, Diener và Suh, 1996), dùng ma trận đa đặc điểm–đa phương pháp trên ba bộ dữ liệu, cho thấy hài lòng cuộc sống, cảm xúc tích cực v". Lý do: Diener 1984 không "nhấn mạnh" điều này mà nói là câu hỏi thực nghiệm; Lucas 1996 nói "discriminable". Đã đổi "tạo thành các nhân tố tách biệt được" thành "phân biệt được với nhau" (từ discriminable); ba bộ dữ liệu theo tóm tắt. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp tóm tắt Lucas 1996 (discriminable; ma trận đa đặc điểm–đa phương pháp).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0022-3514.71.3.616" ]
    luot_2_ghi_chu: Chỉ đọc tóm tắt (OpenAlex); đủ cho điều câu nêu.
    review: dung
  - id: n11
    cau: 'Ví dụ: một người có thể hài lòng với cuộc đời mình mà tuần này khá căng thẳng, và ngược lại.'
    loai: loi-khuyen
    nguon:
      - lucas1996
    trich: life satisfaction is discriminable from positive and negative affect
