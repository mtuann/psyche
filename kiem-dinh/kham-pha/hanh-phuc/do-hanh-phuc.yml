    trich: Life satisfaction is moderately correlated (r = 0.38) with daily "net affect" (the difference between positive and negative affect).
    vi_tri: tr. 1778–1779
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "- **Cái tôi trải nghiệm và cái tôi ghi nhớ.** Điểm số "cuộc đời nói chung" (SWLS) là sản phẩm của trí nhớ và cách ta kể chuyện về đời mình; điểm số "ngay lúc này" (experience sampling, DRM) là sản phẩm của trải nghiệm trực tiếp. Hai cái tôi này không phải lúc nào cũng đồng ý — đó là lý do các cách đ". Chữ mới: "- **Cái tôi trải nghiệm và cái tôi ghi nhớ.** Một cách giải thích: điểm số "cuộc đời nói chung" (SWLS) dựa vào việc nhìn lại và cân nhắc cuộc đời mình; điểm số "ngay lúc này" (experience sampling, DRM) dựa vào trải nghiệm trực tiếp. Hai thứ này liên quan nhưng không giống nhau: trong dữ liệu DRM, hà". Lý do: Câu cũ khẳng định "đó là lý do" mà không có nguồn; viết thành giả thuyết và thêm số r = 0,38 của Kahneman 2004. Review (Claude Sonnet 5.5, 10/11/2026): dung. Chữ cuối khớp Kahneman 2004 (r = 0,38 với net affect hằng ngày); đã viết là cách giải thích.'
