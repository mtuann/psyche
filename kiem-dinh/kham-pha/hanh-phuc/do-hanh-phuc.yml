    ghi_chu: 'Chữ cũ: "Với test-retest r = 0,82 trong 2 tháng, SWLS đủ ổn định để bạn tự chấm mỗi tháng một lần và nhìn xu hướng của *chính mình*. Điểm số tuyệt đối ít ý nghĩa hơn sự thay đổi: tăng 5 điểm sau khi đổi công việc nói lên nhiều điều hơn việc bạn được 24 còn đồng nghiệp được 27.". Chữ mới: "Với test-retest r = 0,82 trong 2 tháng (ở sinh viên), SWLS khá ổn định ở mức nhóm, nên nếu muốn theo dõi bản thân thì nên nhìn xu hướng qua nhiều lần chấm của *chính mình* hơn là so với người khác. Nhưng điểm của một người vẫn dao động: với độ lệch chuẩn 6,43 và r = 0,82 của bài gốc, sai số chuẩn củ". Lý do: Câu "tăng 5 điểm nói lên nhiều điều" vượt quá độ tin cậy 0,82 (sai số chuẩn khoảng 2,7 điểm); đánh dấu là suy luận. Suy luận tính toán: SEM = 6,43 × √(1 − 0,82) ≈ 2,73 (đã tính lại). SD 6,43 từ mẫu sinh viên Mỹ. Review (Claude Sonnet 5.5, 10/11/2026): dung. Tính lại: 6,43 × √(1 − 0,82) = 2,73; trang ghi "khoảng 2,7", đã nói là suy luận.'
