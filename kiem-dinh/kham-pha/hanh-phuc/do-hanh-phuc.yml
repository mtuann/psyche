    ly_do: Nền (hài lòng cuộc sống và cảm xúc là hai chiều phân biệt được) đến từ nhiều nghiên cứu cùng chiều (Lucas 1996, Schimmack 2008, Kahneman 2004); cách làm cụ thể (nhật ký tối + SWLS) chưa có nghiên cứu riêng nên đã viết là gợi ý.
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Cách làm đơn giản, phù hợp với bằng chứng: mỗi tối ghi nhanh 3 cảm xúc chính trong ngày, mỗi tháng chấm SWLS một lần. Khi hai chiều lệch nhau — ví dụ SWLS cao nhưng tối nào cũng căng thẳng — đó là thông tin đáng giá, không phải lỗi của thang đo.". Chữ mới: "Một cách làm đơn giản gợi ý từ sự tách biệt này (chưa có nghiên cứu kiểm tra riêng cách làm): mỗi tối ghi nhanh 3 cảm xúc chính trong ngày, thỉnh thoảng chấm SWLS. Khi hai chiều lệch nhau — ví dụ SWLS cao nhưng tối nào cũng căng thẳng — đó có thể là thông tin đáng chú ý, không nhất thiết là lỗi của ". Lý do: "Phù hợp với bằng chứng" quá mạnh cho một cách làm chưa được kiểm tra. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khá vững hợp cho nền (hai chiều phân biệt: Lucas 1996, Schimmack 2008, Kahneman 2004); trang nói rõ cách làm cụ thể là gợi ý chưa kiểm tra.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1007/s11205-007-9230-3", "https://doi.org/10.1037/0022-3514.71.3.616", "https://doi.org/10.1126/science.1103572" ]
    luot_2_ghi_chu: Nhãn là về việc hai thành phần phân biệt; cách làm cụ thể xem n54.
