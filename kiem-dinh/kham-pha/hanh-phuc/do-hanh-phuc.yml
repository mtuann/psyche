  - id: n20
    cau: SWLS có nhất quán nội tại alpha = 0,87.
    loai: so-lieu
    nguon:
      - diener1985
    trich: coefficient alpha was .87
    vi_tri: tr. 72, Study 1 (n = 176)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "**Kết quả.** Thang cho thấy các chỉ số tâm lý đo lường tốt: **nhất quán nội tại** Cronbach''s alpha = 0,87; **ổn định theo thời gian** — đo lại sau 2 tháng, tương quan r = 0,82; **giá trị hội tụ** — tương quan với 9 thang hạnh phúc chủ quan khác ở mức trung bình đến cao (ví dụ với câu hỏi "phần trăm ". Chữ mới: "**Kết quả.** Thang cho thấy các chỉ số đo lường tốt ở nhóm sinh viên: **nhất quán nội tại** Cronbach''s alpha = 0,87; **ổn định theo thời gian** — đo lại sau 2 tháng, tương quan r = 0,82; **giá trị hội tụ** — tương quan với các thang hạnh phúc chủ quan khác ở mức trung bình đến cao (r từ 0,47 đến 0,7". Lý do: Bảng 2 bài gốc: Fordyce (phần trăm) 0,58 và 0,62 (không phải 0,57–0,62); khoảng chung 0,47–0,75, có tương quan âm với thang cảm xúc tiêu cực; "9 thang" gồm cả thang cảm xúc tiêu cực nên nêu rõ. Số đúng; đoạn kết quả được sửa ở các số khác (các nhận định số liệu liền sau). Review (Claude Sonnet 5.5, 10/11/2026): dung. Số khớp trích bài gốc (alpha 0,87; r 0,82; 76 người).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327752jpa4901_13" ]
    luot_2_ghi_chu: Đúng (n = 176).
    review: dung
