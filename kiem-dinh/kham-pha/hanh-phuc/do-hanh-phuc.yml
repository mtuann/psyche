  - id: n49
    cau: 'Áp dụng 1 (tiêu đề): dùng thang đo để theo dõi chính mình theo thời gian, không phải để so với người khác. Nhãn Khá vững.'
    loai: nhan
    nguon:
      - diener1985
      - milo2025
    nhan: kha-vung
    co_so:
      - diener1985
      - milo2025
    ly_do: 'Phần "SWLS khá ổn định ở mức nhóm" có nhiều nghiên cứu cùng chiều (bài gốc, tổng quan hệ thống các bản dịch); phần "tự theo dõi cá nhân" chưa có nghiên cứu riêng nên viết là suy luận. Khá vững theo thước đo: chưa có tái lập lớn, mẫu gốc là sinh viên Mỹ.'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Với test-retest r = 0,82 trong 2 tháng, SWLS đủ ổn định để bạn tự chấm mỗi tháng một lần và nhìn xu hướng của *chính mình*. Điểm số tuyệt đối ít ý nghĩa hơn sự thay đổi: tăng 5 điểm sau khi đổi công việc nói lên nhiều điều hơn việc bạn được 24 còn đồng nghiệp được 27.". Chữ mới: "Với test-retest r = 0,82 trong 2 tháng (ở sinh viên), SWLS khá ổn định ở mức nhóm, nên nếu muốn theo dõi bản thân thì nên nhìn xu hướng qua nhiều lần chấm của *chính mình* hơn là so với người khác. Nhưng điểm của một người vẫn dao động: với độ lệch chuẩn 6,43 và r = 0,82 của bài gốc, sai số chuẩn củ". Lý do: Câu "tăng 5 điểm nói lên nhiều điều" vượt quá độ tin cậy 0,82 (sai số chuẩn khoảng 2,7 điểm); đánh dấu là suy luận. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khá vững hợp: ổn định ở mức nhóm có nhiều nghiên cứu (bài gốc, Milo 2025); phần tự theo dõi cá nhân đã ghi là suy luận; nhãn không vượt thước đo.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327752jpa4901_13", "https://doi.org/10.1037/0022-3514.74.2.482", "https://doi.org/10.3390/ijerph19063460" ]
    luot_2_ghi_chu: Lời khuyên thận trọng; không mâu thuẫn bằng chứng.
    review: dung
