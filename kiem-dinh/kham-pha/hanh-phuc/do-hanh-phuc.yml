  - id: n18
    cau: Điểm 20 là điểm trung tính của thang.
    loai: cong-cu
    nguon:
      - pavot1993
    trich: A score of 20 represents the neutral point on the scale, the point at which the respondent is about equally satisfied and dissatisfied.
    vi_tri: tr. 105 (mục Normative data)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Điểm 20 là trung tính; 31–35 "cực kỳ hài lòng", 26–30 "hài lòng", 21–25 "hơi hài lòng", 15–19 "hơi bất mãn", 10–14 "bất mãn", 5–9 "cực kỳ bất mãn".". Chữ mới: "Điểm 20 là điểm trung tính (Pavot và Diener, 1993). Cách đọc điểm theo hướng dẫn của Diener: 30–35 rất cao, 25–29 cao, 20–24 trung bình (mức thường gặp ở các nước phát triển), 15–19 hơi dưới trung bình, 10–14 không hài lòng, 5–9 rất không hài lòng. Đây là cách diễn giải để dễ hình dung, không phải n". Lý do: Các mốc và nhãn cũ không khớp hướng dẫn của Diener (và không có trong bài 1985); lấy theo tài liệu "Understanding Scores on the SWLS" và Pavot & Diener 1993. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp Pavot & Diener 1993: 20 là điểm trung tính.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1207/s15327752jpa4901_13" ]
    luot_2_ghi_chu: Bài 1985 không dùng chữ "điểm trung tính"; 20 là trung điểm suy ra đúng từ thang (Pavot & Diener 1993 gọi 20 là điểm trung tính nhưng không mở được toàn văn bài đó). Câu đúng về số học.
    review: dung
