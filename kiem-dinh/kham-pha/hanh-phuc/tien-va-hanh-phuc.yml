  vi_tri: 'Arslan 2024, đoạn đầu; Rohrer & Wenz 2024: tên bài "Inappropriate causal assumptions underlie Killingsworth, Kahneman, and Mellers'' conclusions"; trả lời: PNAS 121, e2322160121'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Nói cách khác, ngưỡng 75.000 USD năm 2010 thực chất "bắt" được nhóm người bất hạnh nhất, rồi bị diễn giải sai thành quy luật chung cho mọi người: tiền xóa được những nỗi khổ do thiếu tiền gây ra, nhưng không xóa được những nỗi khổ có nguyên nhân khác.". Chữ mới: "Nói cách khác, ngưỡng 75.000 USD năm 2010 thực chất "bắt" được nhóm người bất hạnh nhất, rồi bị diễn giải thành quy luật chung cho mọi người. Các tác giả suy đoán rằng ngưỡng khoảng 100.000 USD có thể là mức mà những nỗi khổ còn lại (họ nêu ví dụ như đau lòng, mất người thân) không còn được thu nhập". Lý do: Câu cũ nêu nguyên nhân như điều đã biết ("tiền xóa được … không xóa được …"); KKM 2023 chỉ nêu như suy đoán ("may represent"). Thêm các bình luận 2024. Đọc toàn văn Arslan; Rohrer & Wenz chỉ đọc tóm tắt và tên bài (ghi cả hai nơi); phần "giả định nhân quả" theo tên bài của Rohrer & Wenz.'
