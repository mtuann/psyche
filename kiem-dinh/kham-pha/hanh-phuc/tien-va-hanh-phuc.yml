  ghi_chu: 'Chữ cũ: "Khi những nỗi khổ mang tính vật chất đã được giải quyết, những gì còn lại — cô đơn, bệnh tật, xung đột, cảm giác vô nghĩa — không đáp ứng với thu nhập thêm. Đây chính là lời giải của bài báo 2023 cho nhóm 20% ít hạnh phúc nhất.". Chữ mới: "Khi những nỗi khổ mang tính vật chất đã được giải quyết, những gì còn lại không đáp ứng với thu nhập thêm: bài báo 2023 đề xuất cách giải thích này cho nhóm ít hạnh phúc nhất và nêu ví dụ đau lòng, mất người thân; đây là suy đoán của các tác giả, chưa được kiểm tra.". Lý do: Danh sách "cô đơn, bệnh tật, xung đột, vô nghĩa" không có trong bài 2023; bài nêu heartbreak, bereavement, clinical depression như ví dụ có thể có, và chỉ là suy đoán.'
