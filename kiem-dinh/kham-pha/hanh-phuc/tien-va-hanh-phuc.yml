  cau: 'Năm 2024 hai bình luận trên PNAS (Rohrer & Wenz; Arslan) phê bình bài KKM; nhóm tác giả trả lời cùng năm: giả định nhân quả, và ngưỡng 100.000 USD lấy từ nghiên cứu 2010 chứ không ước lượng từ dữ liệu Killingsworth.'
