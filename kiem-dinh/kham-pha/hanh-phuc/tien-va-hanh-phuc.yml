  vi_tri: Abstract; Results; Bảng 1
  ket_qua: dung
  ghi_chu: Tóm tắt nói "least happy 20%" (phần Significance), thân bài 15–20%; trang giữ "20%". Ngưỡng 90K trong dữ liệu 2008–09 tương ứng khoảng 97K sau điều chỉnh lạm phát.
- id: n40
  cau: 'KKM 2023: ngưỡng 75.000 USD của năm 2010 "bắt" nhóm bất hạnh nhất rồi bị diễn giải thành quy luật chung.'
  loai: phat-hien
  nguon:
  - kkm2023
  trich: KD claimed that the flattening pattern applies to the happiness of the entire population when in fact it is restricted to the lowest 15 to 20% of the distribution.
  vi_tri: Errors and Their Origins
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Nói cách khác, ngưỡng 75.000 USD năm 2010 thực chất "bắt" được nhóm người bất hạnh nhất, rồi bị diễn giải sai thành quy luật chung cho mọi người: tiền xóa được những nỗi khổ do thiếu tiền gây ra, nhưng không xóa được những nỗi khổ có nguyên nhân khác.". Chữ mới: "Nói cách khác, ngưỡng 75.000 USD năm 2010 thực chất "bắt" được nhóm người bất hạnh nhất, rồi bị diễn giải thành quy luật chung cho mọi người. Các tác giả suy đoán rằng ngưỡng khoảng 100.000 USD có thể là mức mà những nỗi khổ còn lại (họ nêu ví dụ như đau lòng, mất người thân) không còn được thu nhập". Lý do: Câu cũ nêu nguyên nhân như điều đã biết ("tiền xóa được … không xóa được …"); KKM 2023 chỉ nêu như suy đoán ("may represent"). Thêm các bình luận 2024.'
- id: n41
  cau: 'KKM 2023: ngưỡng 100.000 USD có thể là mức mà những nỗi khổ còn lại (đau lòng, mất người thân) không được thu nhập thêm làm dịu; là suy đoán.'
