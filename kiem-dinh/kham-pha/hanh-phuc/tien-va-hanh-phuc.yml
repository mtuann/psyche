- id: n1
  cau: 'Mô tả trang: nghịch lý Easterlin, ngưỡng 75.000 USD của Kahneman và Deaton, lời hòa giải năm 2023 về tiền và hạnh phúc cảm xúc.'
  loai: phat-hien
