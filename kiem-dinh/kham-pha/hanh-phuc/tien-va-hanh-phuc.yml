  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "- **Nhìn dọc (theo thời gian):** khi GDP của một nước tăng lên qua nhiều thập kỷ, mức hạnh phúc trung bình của người dân lại không tăng theo.". Chữ mới: "- **Nhìn dọc (theo thời gian):** theo Easterlin, khi GDP của một nước tăng lên qua nhiều thập kỷ, mức hạnh phúc trung bình của người dân không tăng theo (kết luận này bị tranh cãi, xem dưới).". Lý do: Câu cũ nêu kết luận của Easterlin như sự thật; Stevenson & Wolfers (2008) thấy hạnh phúc tăng ở Nhật và châu Âu.'
