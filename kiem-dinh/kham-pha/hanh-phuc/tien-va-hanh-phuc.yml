  ghi_chu: 'Chữ cũ: "Đây là điểm mà cả ba nghiên cứu đều đồng ý: ở vùng thu nhập thấp, đường cong dốc nhất. Thu nhập tăng ở vùng này gắn với việc giảm lo âu tài chính và giảm nỗi đau khi gặp biến cố. Nói cách khác, "tiền không mua được hạnh phúc" là một câu nói xa xỉ — nó ít đúng nhất với người đang thiếu tiền.". Chữ mới: "Cả ba nghiên cứu đều thấy hạnh phúc tăng theo logarit thu nhập, nên mỗi đô la thêm đi cùng mức tăng lớn nhất ở vùng thu nhập thấp; ở đó, theo Kahneman và Deaton (2010), thu nhập thấp còn làm nỗi đau khi gặp ly hôn, bệnh tật hay sống một mình nặng hơn. Nhưng cả ba chỉ mô tả mối liên hệ cắt ngang (ngư". Lý do: Chữ cũ nói "cải thiện tinh thần hiệu quả nhất", "giảm lo âu tài chính" (không có nguồn) và ngụ ý nhân quả; bài chỉ có liên hệ cắt ngang. Lời khuyên đời thường, nhãn Đang tranh cãi.'
