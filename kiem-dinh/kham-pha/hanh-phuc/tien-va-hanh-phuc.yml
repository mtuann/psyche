  ket_qua: dung
- id: n2
  cau: 'Việc 1: thang Cantril 0 (tệ nhất) đến 10 (tốt nhất) đo đánh giá cuộc sống; câu hỏi cảm xúc hôm qua đo cảm xúc.'
  loai: cong-cu
  nguon:
  - kd2010
  trich: Life evaluation is measured using Cantril's Self-Anchoring Scale, which has the respondent rate his or her current life on a ladder scale in which 0 is "the worst possible life for you" and 10 is "the best possible life for you."
  vi_tri: tr. 1
  ket_qua: dung
- id: n3
  cau: 'Việc 2 (đáp án thu gọn): nghiên cứu năm 2010 trả lời khoảng 75.000 USD/năm cho cảm xúc hằng ngày của người Mỹ; con số gây tranh cãi hơn một thập kỷ.'
  loai: phat-hien
  nguon:
  - kd2010
  - kkm2023
  trich: Emotional well-being also rises with log income, but there is no further progress beyond an annual income of ~$75,000.
  vi_tri: 'K&D 2010, tóm tắt; tranh cãi: Killingsworth 2021, KKM 2023'
  ket_qua: dung
- id: n4
