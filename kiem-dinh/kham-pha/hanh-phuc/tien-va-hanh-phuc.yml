doi_chu:
- cu: '- **Nhìn dọc (theo thời gian):** khi GDP của một nước tăng lên qua nhiều thập kỷ, mức hạnh phúc trung bình của người dân lại không tăng theo.'
  moi: '- **Nhìn dọc (theo thời gian):** theo Easterlin, khi GDP của một nước tăng lên qua nhiều thập kỷ, mức hạnh phúc trung bình của người dân không tăng theo (kết luận này bị tranh cãi, xem dưới).'
  ly_do: Câu cũ nêu kết luận của Easterlin như sự thật; Stevenson & Wolfers (2008) thấy hạnh phúc tăng ở Nhật và châu Âu.
- cu: Phần lớn tranh cãi về tiền và hạnh phúc, như ta sẽ thấy, xuất phát từ việc lẫn lộn hai khái niệm này.
  moi: 'Hai thứ này liên quan yếu: trong dữ liệu Gallup, các thang cảm xúc và thang Cantril tương quan với nhau đều dưới 0,31. Một phần tranh cãi về tiền và hạnh phúc xuất phát từ việc lẫn lộn hai khái niệm này; còn mâu thuẫn giữa kết quả năm 2010 và 2021, như ta sẽ thấy, nảy sinh ở cách đo và cách phân tích cùng một khía cạnh cảm xúc.'
  ly_do: Câu cũ "phần lớn tranh cãi" không có nguồn; bài hòa giải 2023 tìm nguyên nhân ở thang đo (hiệu ứng trần) và giả định đồng nhất, không phải lẫn hai khái niệm. Thêm số tương quan từ K&D 2010.
- cu: 'Easterlin so sánh dữ liệu hạnh phúc theo ba cách:'
  moi: 'Easterlin tổng hợp 30 cuộc khảo sát hạnh phúc từ 1946 đến 1970 ở 19 nước, và so sánh theo ba cách:'
  ly_do: Thêm cỡ mẫu theo bài gốc.
- cu: '**Kết quả.** Tại một thời điểm, người có thu nhập cao hơn hạnh phúc hơn — cả khi so sánh trong nước lẫn giữa các nước. Nhưng theo thời gian, khi một nước giàu lên, hạnh phúc trung bình không tăng theo.'
  moi: '**Kết quả.** Trong cùng một nước, ở mọi cuộc khảo sát, nhóm có địa vị (thu nhập) cao nhất hạnh phúc hơn nhóm thấp nhất. Nhưng giữa các nước tại một thời điểm, liệu có liên hệ dương hay không là chưa chắc: chênh lệch hạnh phúc giữa nước giàu và nước nghèo không như dự đoán từ chênh lệch trong nước. Và ở Mỹ từ 1946, thu nhập cao hơn không đi kèm hạnh phúc cao hơn một cách có hệ thống.'
  ly_do: 'Chữ cũ nói người giàu hạnh phúc hơn "cả giữa các nước": Easterlin 1974 viết "whether any such positive association exists among countries at a given time is uncertain".'
- cu: 'cho rằng mối quan hệ giữa thu nhập và hạnh phúc là **log-tuyến tính và dương** ở cả ba chiều: trong nước, giữa các nước, và theo thời gian, với rất ít bằng chứng về điểm bão hòa. Cuộc tranh luận này đến nay vẫn chưa ngã ngũ.'
  moi: cho rằng hạnh phúc có liên hệ dương, dạng **log-tuyến tính** với thu nhập, trong nước và giữa các nước, không thấy điểm bão hòa; theo thời gian, họ thấy tăng trưởng đi kèm hạnh phúc tăng ở Nhật và châu Âu (Mỹ là ngoại lệ chưa giải thích được). Easterlin và cộng sự (2010) đáp lại rằng các phê phán cho là liên hệ dương theo thời gian là do sai sót thống kê hay lẫn quan hệ ngắn hạn với dài hạn. Một nghiên cứu châu Âu năm 2026 (33 nước) lại thấy GDP đi cùng cảm xúc tốt hơn cả giữa các nước lẫn theo thời gian. Tính đến 11/2026, cuộc tranh luận này vẫn chưa ngã ngũ.
  ly_do: Câu cũ nói "ở cả ba chiều" gồm theo thời gian, nhưng bài Stevenson & Wolfers thấy Mỹ là ngoại lệ; thêm phản hồi của Easterlin 2010 và nghiên cứu 2026; thêm mốc cho câu "chưa ngã ngũ".
- cu: phân tích **hơn 450.000 phản hồi** từ Gallup-Healthways Well-Being Index — khảo sát hằng ngày trên 1.000 người Mỹ được chọn ngẫu nhiên.
  moi: phân tích **hơn 450.000 phản hồi** từ Gallup-Healthways Well-Being Index (2008–2009) — khảo sát hằng ngày trên 1.000 người Mỹ.
  ly_do: Bài gốc không nói "chọn ngẫu nhiên" trong phần đọc được.
- cu: 'Nói chính xác hơn: không có cải thiện nào vượt qua ngưỡng *ở hoặc dưới* 90.000 USD.'
  moi: 'Nói chính xác hơn: không có cải thiện thêm nào trên một ngưỡng *ở hoặc dưới* 90.000 USD.'
  ly_do: Chữ rõ nghĩa theo KKM 2023 ("no further progress ... beyond a threshold at or below 90K").
- cu: 'Mẫu nghiên cứu: **33.391 người Mỹ có việc làm, 18–65 tuổi**, tổng cộng **1.725.994 báo cáo**.'
  moi: 'Mẫu nghiên cứu: **33.391 người Mỹ có việc làm, 18–65 tuổi** (thu nhập hộ gia đình từ 10.000 USD/năm trở lên), tổng cộng **1.725.994 báo cáo**.'
  ly_do: Thêm điều kiện chọn mẫu theo bài gốc.
- cu: Nói cách khác, với cách đo thời gian thực này, tiền vẫn "mua" được cảm xúc tốt hơn ở cả những mức thu nhập cao.
  moi: Nói cách khác, với cách đo thời gian thực này, thu nhập cao hơn vẫn đi cùng cảm xúc tốt hơn ở cả những mức thu nhập cao. Đây là mối liên hệ cắt ngang, không chứng minh nhân quả; và mối liên hệ này yếu (tương quan giữa hạnh phúc trung bình và log thu nhập chỉ khoảng 0,09 trong dữ liệu experience sampling, theo bài năm 2023).
  ly_do: '"Mua" ngụ ý nhân quả; bài KKM nêu rõ chỉ là cross-sectional associations và r = 0,09.'
- cu: Mâu thuẫn này tồn tại suốt hai năm, cho đến khi chính hai "đối thủ" ngồi lại với nhau.
  moi: Mâu thuẫn này kéo dài cho đến khi chính hai "đối thủ" ngồi lại với nhau (bài hòa giải đăng năm 2023).
  ly_do: '"Suốt hai năm" không có nguồn chính xác.'
- cu: cùng với Barbara Mellers làm trọng tài, phân tích lại
  moi: cùng với Barbara Mellers làm người điều phối, phân tích lại
  ly_do: Bài gốc gọi Mellers là facilitator.
- cu: với nhóm hạnh phúc nhất, đường cong thậm chí còn *dốc hơn* trên 100.000 USD.
  moi: ở nhóm hạnh phúc nhất (phân vị 85), đường cong thậm chí còn *dốc hơn* trên 100.000 USD.
  ly_do: 'Bài gốc: dốc hơn có ý nghĩa ở phân vị 85 (p = 0,023); phân vị 70 chỉ gần ý nghĩa.'
- cu: 'Nói cách khác, ngưỡng 75.000 USD năm 2010 thực chất "bắt" được nhóm người bất hạnh nhất, rồi bị diễn giải sai thành quy luật chung cho mọi người: tiền xóa được những nỗi khổ do thiếu tiền gây ra, nhưng không xóa được những nỗi khổ có nguyên nhân khác.'
  moi: 'Nói cách khác, ngưỡng 75.000 USD năm 2010 thực chất "bắt" được nhóm người bất hạnh nhất, rồi bị diễn giải thành quy luật chung cho mọi người. Các tác giả suy đoán rằng ngưỡng khoảng 100.000 USD có thể là mức mà những nỗi khổ còn lại (họ nêu ví dụ như đau lòng, mất người thân) không còn được thu nhập thêm làm dịu; đây là suy đoán của họ, chưa được kiểm tra.


    Hòa giải này không phải lời cuối. Năm 2024, hai bình luận trên PNAS (Rohrer và Wenz; Arslan) cho rằng bài dựa vào giả định nhân quả không có cơ sở, và rằng ngưỡng 100.000 USD không được ước lượng từ dữ liệu của Killingsworth mà lấy từ nghiên cứu năm 2010; nhóm tác giả đã trả lời lại trong cùng năm.'
  ly_do: Câu cũ nêu nguyên nhân như điều đã biết ("tiền xóa được … không xóa được …"); KKM 2023 chỉ nêu như suy đoán ("may represent"). Thêm các bình luận 2024.
- cu: Nghịch lý Easterlin vẫn bị phản bác bằng dữ liệu mới hơn; mâu thuẫn giữa Kahneman–Deaton (2010) và Killingsworth (2021) mới chỉ được hòa giải năm 2023 trên dữ liệu người Mỹ. Chưa có đồng thuận cho mọi nền văn hóa và mọi thời điểm.
  moi: Nghịch lý Easterlin vẫn bị phản bác bằng dữ liệu mới hơn; mâu thuẫn giữa Kahneman–Deaton (2010) và Killingsworth (2021) được hòa giải năm 2023 trên dữ liệu người Mỹ, và cách hòa giải ấy lại bị bình luận năm 2024. Chưa có đồng thuận cho mọi nền văn hóa và mọi thời điểm.
  ly_do: Thêm bình luận 2024 và "mới chỉ" thành "được".
- cu: 'Sự phân biệt này được lặp lại qua nhiều nghiên cứu với nhiều cách đo: cảm xúc hằng ngày và đánh giá tổng thể cuộc đời có các yếu tố ảnh hưởng khác nhau. Đây là phần vững chắc nhất của cả câu chuyện.'
  moi: 'Sự phân biệt này được thấy trong nhiều nghiên cứu với nhiều cách đo: cảm xúc hằng ngày và đánh giá tổng thể cuộc đời có các yếu tố ảnh hưởng khác nhau (Kahneman và Deaton, 2010; Kahneman và cộng sự, 2004). Riêng với thu nhập, Killingsworth (2021) không thấy mức thu nhập nào mà hai thứ tách ra. Đây là phần ít tranh cãi nhất của cả câu chuyện.'
  ly_do: '"Phần vững chắc nhất" vượt nhãn Khá vững; thêm điểm Killingsworth 2021 không thấy tách rời theo thu nhập.'
- cu: Đây không phải một hằng số tâm lý học. Nó là điểm giữa của một nhóm thu nhập trong dữ liệu khảo sát người Mỹ 2008–2009, và theo phân tích năm 2023, nó chỉ mô tả đúng nhóm 20% ít hạnh phúc nhất.
  moi: Đây không phải một hằng số tâm lý học. Nó là điểm giữa của một nhóm thu nhập trong dữ liệu khảo sát người Mỹ 2008–2009, và theo phân tích năm 2023, hiện tượng chững lại chỉ có ở nhóm 15–20% ít hạnh phúc nhất (cách xác định ngưỡng này bị bình luận năm 2024).
  ly_do: Bài gốc nói 15% (phân vị) đến 20%; thêm bình luận 2024.
- cu: 'Cả ba nghiên cứu hiện đại đều thấy hạnh phúc tăng theo *logarit* thu nhập: tăng'
  moi: 'Cả ba nghiên cứu hiện đại đều thấy hạnh phúc tăng theo *logarit* thu nhập ít nhất ở một dải thu nhập: tăng'
  ly_do: Kahneman & Deaton thấy cảm xúc chững lại ở ~75.000 USD.
- cu: Khi những nỗi khổ mang tính vật chất đã được giải quyết, những gì còn lại — cô đơn, bệnh tật, xung đột, cảm giác vô nghĩa — không đáp ứng với thu nhập thêm. Đây chính là lời giải của bài báo 2023 cho nhóm 20% ít hạnh phúc nhất.
  moi: 'Khi những nỗi khổ mang tính vật chất đã được giải quyết, những gì còn lại không đáp ứng với thu nhập thêm: bài báo 2023 đề xuất cách giải thích này cho nhóm ít hạnh phúc nhất và nêu ví dụ đau lòng, mất người thân; đây là suy đoán của các tác giả, chưa được kiểm tra.'
  ly_do: Danh sách "cô đơn, bệnh tật, xung đột, vô nghĩa" không có trong bài 2023; bài nêu heartbreak, bereavement, clinical depression như ví dụ có thể có, và chỉ là suy đoán.
- cu: '### 2. Nếu thu nhập còn thấp, tăng thu nhập là một trong những cách cải thiện tinh thần hiệu quả nhất :nhan[tranh-cai]'
  moi: '### 2. Nếu thu nhập còn thấp, mối liên hệ giữa thu nhập và tinh thần dốc nhất (chưa chứng minh nhân quả) :nhan[tranh-cai] { #2-neu-thu-nhap-con-thap-tang-thu-nhap-la-mot-trong-nhung-cach-cai-thien-tinh-than-hieu-qua-nhat-tranh-cai }'
  ly_do: Tiêu đề cũ ngụ ý nhân quả và "hiệu quả nhất" không có nguồn; giữ id cũ.
- cu: 'Đây là điểm mà cả ba nghiên cứu đều đồng ý: ở vùng thu nhập thấp, đường cong dốc nhất. Thu nhập tăng ở vùng này gắn với việc giảm lo âu tài chính và giảm nỗi đau khi gặp biến cố. Nói cách khác, "tiền không mua được hạnh phúc" là một câu nói xa xỉ — nó ít đúng nhất với người đang thiếu tiền.'
  moi: Cả ba nghiên cứu đều thấy hạnh phúc tăng theo logarit thu nhập, nên mỗi đô la thêm đi cùng mức tăng lớn nhất ở vùng thu nhập thấp; ở đó, theo Kahneman và Deaton (2010), thu nhập thấp còn làm nỗi đau khi gặp ly hôn, bệnh tật hay sống một mình nặng hơn. Nhưng cả ba chỉ mô tả mối liên hệ cắt ngang (người thu nhập cao hơn thì tốt hơn), không chứng minh tăng thu nhập làm tinh thần tốt lên. Với giới hạn đó, "tiền không mua được hạnh phúc" có vẻ là câu nói xa xỉ — theo các dữ liệu này nó ít đúng nhất với người đang thiếu tiền.
  ly_do: Chữ cũ nói "cải thiện tinh thần hiệu quả nhất", "giảm lo âu tài chính" (không có nguồn) và ngụ ý nhân quả; bài chỉ có liên hệ cắt ngang.
- cu: 'Nếu bạn đã đủ đầy về vật chất mà vẫn bất hạnh, nguyên nhân nhiều khả năng nằm ở những thứ tiền không chạm tới: các mối quan hệ, sức khỏe, cảm giác có ý nghĩa.'
  moi: Nếu bạn đã đủ đầy về vật chất mà vẫn bất hạnh, nguyên nhân có thể nằm ở những thứ thu nhập thêm không chạm tới (các tác giả bài 2023 nêu ví dụ như đau lòng, mất người thân); đây là suy đoán của họ, chưa được kiểm tra. Nếu tình trạng này kéo dài, hãy xem trang Hỗ trợ.
  ly_do: Chữ cũ "nhiều khả năng" và liệt kê quan hệ, sức khỏe, ý nghĩa không có nguồn; thêm dẫn tới Hỗ trợ.
- cu: '**Chúng tôi chưa tìm thấy nghiên cứu nào về mối quan hệ thu nhập–hạnh phúc trên người Việt**, và không suy diễn từ dữ liệu Mỹ sang Việt Nam.'
  moi: 'Tính đến 11/2026, **chúng tôi chưa tìm thấy nghiên cứu nào về mối quan hệ thu nhập–hạnh phúc trên người Việt** (lần tìm chưa hệ thống: Europe PMC, chưa tìm tạp chí trong nước), và không suy diễn từ dữ liệu Mỹ sang Việt Nam.'
  ly_do: Thêm mốc và nêu rõ phạm vi lần tìm.
- cu: chưa có bản sao nào của thiết kế này ở châu Á hay Việt Nam.
  moi: chưa thấy bản sao nào của thiết kế này ở châu Á hay Việt Nam (tính đến 11/2026; lần tìm chưa hệ thống).
  ly_do: Câu phủ định cần mốc và nói rõ phạm vi tìm.
- cu: Phía ủng hộ nghịch lý Easterlin có dữ liệu 37 nước (Easterlin và cộng sự, 2010, PNAS, mỗi nước theo dõi trung bình 22 năm);
  moi: Phía ủng hộ nghịch lý Easterlin có dữ liệu 37 nước (Easterlin và cộng sự, 2010, PNAS; theo bản thảo IZA, mỗi nước được theo dõi từ 12 đến 34 năm, trung bình 22 năm);
  ly_do: Số theo bản thảo IZA DP 5799 (bản PNAS không mở được toàn văn).
- cu: 'Sai: nghịch lý nói về *tăng trưởng GDP theo thời gian*, không phủ nhận rằng trong cùng một nước, người giàu hơn hạnh phúc hơn — kết quả này khá nhất quán.'
  moi: 'Sai: nghịch lý nói về hạnh phúc giữa các nước và *theo tăng trưởng GDP*, không phủ nhận rằng trong cùng một nước, người giàu hơn hạnh phúc hơn — kết quả này khá nhất quán (trong mọi cuộc khảo sát của Easterlin 1974).'
  ly_do: Chính xác hơn theo bài gốc.
- cu: với nhóm bất hạnh nhất, đường cong chững lại trên khoảng 100.000 USD; và không nghiên cứu nào trong số này đo khả năng của tiền trong việc chữa lành những nỗi khổ không mang tính vật chất.
  moi: với nhóm bất hạnh nhất, đường cong chững lại trên khoảng 100.000 USD; và cả ba nghiên cứu chỉ mô tả mối liên hệ cắt ngang, không chứng minh tiền gây ra hạnh phúc.
  ly_do: Câu cũ không có nguồn; bài KKM nêu rõ chỉ là cross-sectional associations.
