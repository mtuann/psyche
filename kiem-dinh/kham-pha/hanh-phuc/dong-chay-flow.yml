    trich: The pooled effect size (r = 0.31, 95% CI [0.24; 0.38]) indicated that across a range of sporting and gaming tasks there was a consistent medium-sized relationship between flow experience and task performance. A number of mechanisms were proposed to explain this relationship, but none were supported by convincing empirical evidence.
    vi_tri: 'tóm tắt (bản thảo PsyArXiv; bản in: IRSEP 2021)'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nghe thì hợp lý — "vào zone" thì phải đá hay hơn chứ? Nhưng tổng quan của Swann và cộng sự (2018) về flow trong thể thao cho thấy mối liên hệ giữa flow và thành tích thực tế **không nhất quán** như người ta tưởng: có nghiên cứu thấy liên quan, có nghiên cứu không ([Swann và cộng sự, 2018](https://do". Chữ mới: "Nghe thì hợp lý — "vào zone" thì phải đá hay hơn chứ? Một phân tích tổng hợp 22 nghiên cứu về thể thao và trò chơi (Harris và cộng sự, 2021) thấy mối liên hệ trung bình và nhất quán giữa flow và thành tích (r = 0,31; khoảng tin cậy 95%: 0,24–0,38). Nhưng đây là tương quan: các cơ chế được đề xuất ch". Lý do: Chữ cũ (khung "Đã bị bác bỏ") sai: Swann 2018 không nói liên hệ flow–thành tích không nhất quán; phân tích tổng hợp Harris 2021 thấy liên hệ nhất quán, vừa phải. Hạ từ bac-bo sang kha-vung và viết lại. Chỉ đọc tóm tắt bản thảo. Chữ cũ dẫn Swann 2018 để nói liên hệ flow–thành tích không nhất quán: Swann 2018 không nói vậy (đã tìm trong toàn văn). Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp tóm tắt Harris 2021 (r = 0,31; KTC 0,24–0,38; cơ chế chưa có bằng chứng thuyết phục).'
    luot_2: dung
