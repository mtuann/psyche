    review: sai
  - id: n75
    cau: 'Ngộ nhận 2: phân tích tổng hợp (Sweeny 2026) thấy flow liên hệ dương, vừa phải đến khá mạnh, với well-being; là tương quan; flow cũng được ghi nhận ở hoạt động có hại (rối loạn chơi game: Burleigh 2025; máy đánh bạc: Kruger 2022); tính đến 11/2026 mới thấy ít nghiên cứu như vậy.'
    loai: phat-hien
    nguon:
      - sweeny2026
      - burleigh2025
      - kruger2022
    trich: a moderately strong, positive relationship between flow and well-being; Network analysis identified the centrality of time distortion and loss of control within flow states and highlighted their connections to disordered gaming indicators; dark flow accounted for unique variance when predicting problem gambling severity
    vi_tri: tóm tắt (Sweeny 2026; Burleigh 2025; Kruger 2022)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Flow là một dạng trải nghiệm tối ưu, nhưng "cháy" liên tục không nghỉ vẫn dẫn đến kiệt sức. Hơn nữa, flow không phân biệt tốt–xấu về mặt đạo đức: người ta cũng có thể "chảy" trong game gây nghiện hay trong công việc ám ảnh đến mức bỏ bê gia đình.". Chữ mới: "Một phân tích tổng hợp (Sweeny và cộng sự, 2026) thấy flow liên hệ dương, ở mức vừa phải đến khá mạnh, với well-being, nên ý "càng nhiều flow càng hạnh phúc" có phần đúng ở mức tương quan; nhưng đó là tương quan, và chúng tôi chưa tìm thấy nghiên cứu nào xét giới hạn của việc ở trong flow liên tục h". Lý do: Chữ cũ ("cháy liên tục dẫn đến kiệt sức", "game gây nghiện", "bỏ bê gia đình") không có nguồn; viết lại theo tổng hợp Sweeny 2026. Chữ cũ: "- **"Càng nhiều flow càng hạnh phúc, nên cứ ''cháy'' hết mình."**". Chữ mới: "- **"Càng nhiều flow càng hạnh phúc, nên cứ ''cháy'' hết mình."** Đúng một phần:". Lý do: Đổi câu mở theo nội dung mới. Chỉ đọc tóm tắt. Phần "chưa tìm thấy nghiên cứu xét giới hạn" là phủ định theo lần tìm hạn chế (tạm xem là thoi-su ở n sau). Review (Claude Sonnet 5.5, 10/11/2026): sai. Lượt 2 đúng: "chưa tìm thấy nghiên cứu xét … flow trong hoạt động có hại" sai: có Burleigh và cộng sự 2025 (565 người chơi game, Addict Behav Rep 21, 100606) và Kruger và cộng sự 2022 (110 người chơi máy đánh bạc, J Gambl Stud 38, 185–203). Đã sửa trang theo hai bài (bỏ phần "flow liên tục", không có nguồn). Phần Sweeny 2026 giữ: tóm tắt thấy liên hệ dương, vừa phải đến khá mạnh.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://doi.org/10.1037/emo0001657", "https://doi.org/10.3389/fpsyg.2020.00158", "https://doi.org/10.1016/j.abrep.2025.100606" ]
    luot_2_ghi_chu: 'câu đúng: Phân tích tổng hợp (Sweeny 2026, Emotion) thấy flow liên hệ dương, mức vừa đến khá mạnh, với well-being; đây là tương quan. Đã có nghiên cứu về việc flow là liên tục hay rời rạc (Abuhamdeh 2020) và về flow ở hoạt động có hại như game rối loạn hay cờ bạc, nhưng bằng chứng còn ít.; Phần phân tích tổng hợp đúng và đã ghi là tương quan. Phần "chưa tìm thấy nghiên cứu xét giới hạn của flow liên tục hay flow trong hoạt động có hại" không đúng: có bài khái niệm về flow liên tục/rời rạc và có nghiên cứu về flow ở game rối loạn và cờ bạc. Chỉ đọc tóm tắt.'
    review: sai
