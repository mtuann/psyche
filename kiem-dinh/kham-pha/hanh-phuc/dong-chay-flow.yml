  ghi_chu: 'Chữ cũ: ":::vung-chac[9 đặc điểm của flow xuất hiện nhất quán qua nhiều lĩnh vực]". Chữ mới: ":::kha-vung[9 đặc điểm của flow được dùng để mô tả flow ở nhiều lĩnh vực, nhưng không đều giữa các đặc điểm]". Lý do: Hạ nhãn (xem khung bên dưới). Chữ cũ: ":::bac-bo[cứ vào flow là hiệu suất tăng]". Chữ mới: ":::kha-vung[flow đi cùng thành tích tốt hơn, nhưng chưa rõ nhân quả]". Lý do: Đổi tên khung theo kết quả trên. Đã kiểm: trang có bốn khung sau khi sửa: kha-vung, kha-vung, tranh-cai, kha-vung.'
