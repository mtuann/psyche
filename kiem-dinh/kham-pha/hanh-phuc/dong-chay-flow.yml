  ghi_chu: 'Đã mở src/hinh/flow-channel.html: nhãn khớp mô hình kênh/góc phần tư; hình nói rõ là ước lệ không theo tỉ lệ số liệu. Hình vẽ kênh chéo (mô hình ba kênh, Csikszentmihalyi 1975, theo Abuhamdeh Bảng 1), còn mô hình góc phần tư tính theo trung bình của từng người; không sai về nhãn.'
