  - buseyne2026
  trich: has rarely been tested
  vi_tri: Baumann 2012, mục 9.1; Buseyne 2026, tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Csikszentmihalyi mô tả nhân cách tự trị như một kỹ năng có thể rèn luyện — cách bạn đặt mục tiêu, phản ứng với khó khăn, tìm ý nghĩa trong việc tẻ nhạt — chứ không phải số phận.". Chữ mới: "Nakamura và Csikszentmihalyi (2002) mô tả các nét của nhân cách tự trị (tò mò, kiên trì, ít vị kỷ) như "siêu kỹ năng", nhưng mối liên hệ của chúng với tần suất flow hiếm được kiểm tra (Baumann, 2012), và tính cách tận tâm liên hệ vừa phải với flow (r = 0,33); nên chưa nói được flow là rèn luyện hay ". Lý do: Chữ cũ khẳng định "kỹ năng có thể rèn luyện" không có nguồn.'
