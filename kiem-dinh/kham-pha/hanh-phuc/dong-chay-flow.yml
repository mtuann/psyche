  - id: n46
    cau: 'Khung Khá vững: flow đi cùng thành tích tốt hơn, nhưng chưa rõ nhân quả.'
    loai: nhan
    nguon:
      - harris2021
      - xie2026
    nhan: kha-vung
    co_so:
      - harris2021
      - xie2026
    ly_do: Phân tích tổng hợp 22 nghiên cứu (thể thao và trò chơi) thấy liên hệ vừa phải, nhất quán (r = 0,31); phân tích tổng hợp về flow trong học tập cùng chiều; nhưng đều là tương quan và cơ chế chưa được chứng minh. Khá vững cho liên hệ; không nói nhân quả.
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nghe thì hợp lý — "vào zone" thì phải đá hay hơn chứ? Nhưng tổng quan của Swann và cộng sự (2018) về flow trong thể thao cho thấy mối liên hệ giữa flow và thành tích thực tế **không nhất quán** như người ta tưởng: có nghiên cứu thấy liên quan, có nghiên cứu không ([Swann và cộng sự, 2018](https://do". Chữ mới: "Nghe thì hợp lý — "vào zone" thì phải đá hay hơn chứ? Một phân tích tổng hợp 22 nghiên cứu về thể thao và trò chơi (Harris và cộng sự, 2021) thấy mối liên hệ trung bình và nhất quán giữa flow và thành tích (r = 0,31; khoảng tin cậy 95%: 0,24–0,38). Nhưng đây là tương quan: các cơ chế được đề xuất ch". Lý do: Chữ cũ (khung "Đã bị bác bỏ") sai: Swann 2018 không nói liên hệ flow–thành tích không nhất quán; phân tích tổng hợp Harris 2021 thấy liên hệ nhất quán, vừa phải. Hạ từ bac-bo sang kha-vung và viết lại. Chữ cũ: ":::bac-bo[cứ vào flow là hiệu suất tăng]". Chữ mới: ":::kha-vung[flow đi cùng thành tích tốt hơn, nhưng chưa rõ nhân quả]". Lý do: Đổi tên khung theo kết quả trên. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khá vững hợp: một phân tích tổng hợp (r = 0,31, nhất quán) cùng chiều với phân tích về học tập, nhưng tương quan, cơ chế chưa chứng minh; trang đã nói chưa rõ nhân quả. Giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/1750984x.2021.1929402" ]
    luot_2_ghi_chu: Chỉ đọc tóm tắt. Nhãn không cao hơn thước đo.
    review: dung
  - id: n47
    cau: 'Harris và cộng sự: phân tích tổng hợp 22 nghiên cứu (20 bài) về flow và thành tích: r = 0,31 (KTC 95%: 0,24–0,38), trong thể thao và trò chơi; các cơ chế đề xuất chưa có bằng chứng thuyết phục.'
    loai: so-lieu
    nguon:
