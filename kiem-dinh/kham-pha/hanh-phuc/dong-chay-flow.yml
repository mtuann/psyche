  - id: n14
    cau: 'Đặc điểm 8: Biến dạng cảm nhận thời gian.'
    loai: dinh-nghia
    nguon:
      - swann2018
    trich: transformation of time (i.e., time becomes either speeds up, slows down, or becomes irrelevant)
    vi_tri: tr. 6, mục Normal Science and the Flow Paradigm
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Lúc thì ba tiếng trôi như ba mươi phút, lúc thì một giây như kéo dài vô tận (vận động viên thường mô tả dạng thứ hai).". Chữ mới: "Lúc thì ba tiếng trôi như ba mươi phút, lúc thì một giây như kéo dài vô tận, hoặc thời gian trở nên không còn quan trọng.". Lý do: Câu về vận động viên không có nguồn; Swann 2018: thời gian có thể nhanh lên, chậm đi hay không còn quan trọng. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp Swann 2018 (thời gian nhanh lên, chậm đi hay không còn quan trọng).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/10413200.2018.1443525" ]
    luot_2_ghi_chu: Đúng.
    review: dung
