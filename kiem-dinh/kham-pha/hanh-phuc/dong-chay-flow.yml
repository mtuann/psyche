  ghi_chu: 'Chữ cũ: "Các lần kiểm định thang đo ở châu Á (ví dụ Nhật Bản) cho cấu trúc tương tự phương Tây, nhưng số nghiên cứu ngoài phương Tây còn ít. Đáng chú ý, đặc điểm "mất tự ý thức" có thể được trải nghiệm khác nhau giữa văn hóa đề cao cái tôi cá nhân và văn hóa đề cao hòa hợp tập thể — và đây mới chỉ là giả thu". Chữ mới: "Bằng chứng về tính phổ quát chưa thống nhất: phân tích tổng hợp về cân bằng thử thách–kỹ năng thấy tương quan yếu hơn ở nền văn hóa cá nhân chủ nghĩa (Fong và cộng sự, 2015); phân tích tổng hợp 108 nghiên cứu về flow trong học tập thấy bối cảnh văn hóa không làm đổi độ lớn các liên hệ (Xie và cộng s". Lý do: Chữ cũ nói các kiểm định ở châu Á "cho cấu trúc tương tự" mà chưa đọc được kết quả; thêm ba phân tích tổng hợp về văn hóa. Chữ cũ: "Csikszentmihalyi nhận thấy một số người dễ "tự tạo" flow hơn hẳn người khác: họ tò mò, thích đặt mục tiêu nội tại, kiên trì trước khó khăn, và ít phụ thuộc vào phần thưởng bên ngoài. Điểm quan trọng: ông mô tả đây là một *kỹ năng có thể rèn*, không phải năng khiếu bẩm sinh — bạn có thể học cách tìm ". Chữ mới: "Csikszentmihalyi đề xuất khái niệm nhân cách tự trị: xu hướng chủ động tìm thử thách và trải nghiệm flow. Nakamura và Csikszentmihalyi (2002) mô tả các nét cốt lõi là tò mò và hứng thú với đời sống, kiên trì, và ít vị kỷ, gọi chúng là "siêu kỹ năng" (metaskills). Khái niệm này giàu ý nhưng chưa có c". Lý do: Chữ cũ khẳng định ông "mô tả là kỹ năng có thể rèn" và "bạn có thể học cách tìm ra thử thách": nguồn đọc được chỉ nói "metaskills" và không có bằng chứng về rèn luyện. Chỉ đọc tóm tắt.'
