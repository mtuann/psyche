  ghi_chu: 'Chữ cũ: "Từ các cuộc phỏng vấn những năm 1970 (leo núi, khiêu vũ, cờ vua, phẫu thuật) đến các nghiên cứu ESM và các thang đo như FSS sau này, cùng một cụm đặc điểm lặp lại: mục tiêu rõ, phản hồi tức thì, tập trung sâu, mất tự ý thức, thời gian biến dạng. Đây là phần vững nhất của lý thuyết.". Chữ mới: "Từ các cuộc phỏng vấn (leo núi, cờ vua, nghệ sĩ; vận động viên ưu tú) đến thang đo FSS (phân tích nhân tố khẳng định ủng hộ chín thang ở 394 vận động viên), cùng một cụm đặc điểm được dùng để mô tả flow. Nhưng không đều: trong một tổng quan hệ thống về vận động viên ưu tú (Swann và cộng sự, 2012), d". Lý do: Đổi tên khung từ vung-chac sang kha-vung: chữ cũ khẳng định "nhất quán qua nhiều lĩnh vực" và nhắc ESM (các nghiên cứu ESM 1977, 1989 không kiểm 9 đặc điểm); các nguồn thấy ủng hộ nhưng không đều giữa các đặc điểm, có chồng lấn và chưa có tổng hợp hay tái lập. Số theo Swann 2018 kể lại; chưa mở Swann 2012.'
