    ghi_chu: 'Chữ cũ: "### Csikszentmihalyi và LeFevre (1989): flow ở công sở nhiều hơn ở nhà". Chữ mới: "### Csikszentmihalyi và LeFevre (1989): phần lớn trải nghiệm flow được báo cáo khi làm việc { #csikszentmihalyi-va-lefevre-1989-flow-o-cong-so-nhieu-hon-o-nha }". Lý do: Tiêu đề cũ ngụ ý flow xảy ra thường hơn ở công sở so với ở nhà; tóm tắt chỉ nói đa số trải nghiệm flow được báo cáo khi làm việc. Giữ id cũ. Tiêu đề mục đổi; xem n sau. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp tóm tắt Csikszentmihalyi & LeFevre (1989): "the great majority of flow experiences are reported when working, not when in leisure".'
