  ghi_chu: 'Chữ cũ: "Tuy nhiên, dù trải nghiệm lúc rảnh kém "chất" hơn, người ta vẫn thấy *có động lực hơn* trong thời gian rảnh — một nghịch lý mà Csikszentmihalyi gọi là "nghịch lý của công việc"". Chữ mới: "Tuy nhiên, người ta vẫn thấy *có động lực hơn* trong thời gian rảnh so với khi làm việc — một nghịch lý mà Csikszentmihalyi và LeFevre gọi là "nghịch lý của công việc" (tên gọi theo cách kể lại; chưa mở toàn văn)". Lý do: "Trải nghiệm lúc rảnh kém chất hơn" không có trong tóm tắt (tóm tắt nói "regardless of the quality of experience"). Tên gọi "nghịch lý của công việc" chỉ theo cách kể lại; tóm tắt không dùng cụm này.'
