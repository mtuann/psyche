    trich: Compared to other theorized antecedents, challenge–skill balance was a robust contributor to flow along with clear goals and sense of control.
    vi_tri: tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Các nghiên cứu ESM trong lớp học cho thấy học sinh hứng thú nhất khi cảm nhận được cả ba: thử thách cao, kỹ năng đủ dùng, và quyền kiểm soát. Bài tập quá dễ → chán; bài quá khó mà không có gợi ý → lo âu và bỏ cuộc.". Chữ mới: "Mục tiêu rõ và phản hồi rõ là hai điều kiện được đề xuất của flow; phân tích tổng hợp thấy mục tiêu rõ và cảm giác kiểm soát cùng với cân bằng thử thách–kỹ năng đều liên hệ với flow (Fong và cộng sự, 2015), và một phân tích tổng hợp 108 nghiên cứu về flow trong học tập (Xie và cộng sự, 2026) thấy fl". Lý do: Chữ cũ dẫn "các nghiên cứu ESM trong lớp học" không có nguồn đã mở; "lo âu và bỏ cuộc" không có nguồn. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp tóm tắt Fong 2015 (mục tiêu rõ, cảm giác kiểm soát cùng cân bằng).'
