  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: Tên khung :::vung-chac[9 đặc điểm của flow xuất hiện nhất quán qua nhiều lĩnh vực]; :::kha-vung[flow xuất hiện khi thử thách và kỹ năng đều cao và cân bằng]; :::tranh-cai[flow có phải trải nghiệm phổ quát, giống nhau ở mọi nền văn hóa?]; :::bac-bo[cứ vào flow là hiệu suất tăng]
    moi: Tên khung :::kha-vung[9 đặc điểm của flow được dùng để mô tả flow ở nhiều lĩnh vực, nhưng không đều giữa các đặc điểm]; :::kha-vung[flow xuất hiện khi thử thách và kỹ năng đều cao và cân bằng]; :::tranh-cai[flow có phải trải nghiệm phổ quát, giống nhau ở mọi nền văn hóa?]; :::kha-vung[flow đi cùng thành tích tốt hơn, nhưng chưa rõ nhân quả]
    ly_do: Tiêu đề khung đổi nên hộp tóm tắt đổi theo (xem các nhận định khung nhãn trong hồ sơ này).
  - cu: 'Hình flow-channel: "Flow chỉ xuất hiện khi cả hai đều cao và cân bằng." (chữ trong hình); chú thích: "Dòng chảy chỉ xuất hiện khi cả hai đều cao và cân bằng."'
    moi: '"Theo mô hình kênh flow, flow được dự đoán khi cả hai đều cao và cân bằng." (chữ trong hình); chú thích: "Theo mô hình, dòng chảy được dự đoán khi cả hai đều cao và cân bằng; bằng chứng cho điều này chưa thống nhất."'
    ly_do: "Review n19: cân bằng thử thách–kỹ năng không đủ để flow xảy ra (Swann 2018); thêm src/hinh/flow-channel.html vào HINH_DA_SUA của tests/chuyen.test.mjs."
  - cu: 'Khung Khá vững: "flow xuất hiện khi thử thách và kỹ năng đều cao và cân bằng"'
    moi: 'Khung Khá vững: "cân bằng thử thách–kỹ năng liên hệ vừa phải với flow, nhưng không đủ để flow xuất hiện" (hộp tóm tắt đổi theo)'
    ly_do: Review n38.
  - cu: 'Lý thuyết 2: "Nakamura và Csikszentmihalyi (2002) mô tả các nét cốt lõi … Khái niệm này giàu ý nhưng chưa có cách đo thỏa đáng, và mối liên hệ … hiếm được kiểm tra (Baumann, 2012). Một phân tích tổng hợp mới thấy tính cách tận tâm …"'
    moi: '"Theo Baumann (2012), Nakamura và Csikszentmihalyi (2002) mô tả … Cũng theo Baumann (2012), khi ấy khái niệm này giàu ý nhưng chưa có cách đo thỏa đáng, và … hiếm được kiểm tra. Từ đó đã có một phân tích tổng hợp 24 nghiên cứu về năm nét tính cách (Big Five) và flow: tận tâm … (r = 0,33; Buseyne và cộng sự, 2026)."'
    ly_do: Review n51, n52.
  - cu: 'Ngộ nhận 3: "Nakamura và Csikszentmihalyi (2002) mô tả … nhưng mối liên hệ của chúng với tần suất flow hiếm được kiểm tra (Baumann, 2012), và tính cách tận tâm … (r = 0,33); nên chưa nói được …"'
    moi: '"Theo Baumann (2012), Nakamura và Csikszentmihalyi (2002) mô tả …; khi ấy mối liên hệ … hiếm được kiểm tra. Từ đó, một phân tích tổng hợp thấy … (r = 0,33; Buseyne và cộng sự, 2026), nhưng chưa nói được flow là rèn luyện hay bẩm sinh."'
    ly_do: Review n77.
  - cu: 'Ngộ nhận 2: "… nhưng đó là tương quan, và chúng tôi chưa tìm thấy nghiên cứu nào xét giới hạn của việc ở trong flow liên tục hay flow trong các hoạt động có hại."'
    moi: '"… nhưng đó là tương quan. Flow cũng được ghi nhận trong những hoạt động có hại: nghiên cứu 565 người chơi game nhập vai … (Burleigh và cộng sự, 2025), và nghiên cứu 110 người chơi máy đánh bạc xét \"dark flow\" (Kruger và cộng sự, 2022). Tính đến 11/2026, chúng tôi mới thấy ít nghiên cứu như vậy."'
    ly_do: Review n75, n76; thêm hai nguồn vào mục Nguồn.
  - cu: 'Quiz Câu hỏi 1 (giải thích): "Bạn có thể thích nằm dài lướt điện thoại mà không hề ở trong flow."'
    moi: '"Bạn có thể thích một việc nhẹ nhàng, ít đòi hỏi (như nằm dài lướt điện thoại) mà theo mô hình không phải flow, vì thiếu thử thách và phản hồi rõ ràng; đây là suy luận từ mô hình, không phải kết quả đo."'
    ly_do: Review n78.
  - cu: 'Quiz Câu hỏi 5 (giải thích): "… "thư giãn" thậm chí là một trong hai chỉ số ít ỏi KHÔNG bị ảnh hưởng bởi flow."'
    moi: '"… "thư giãn" thậm chí là một trong hai chỉ số (cùng với động lực) KHÔNG chịu ảnh hưởng của flow mạnh hơn bối cảnh làm việc hay giải trí."'
    ly_do: Review n85.
  - cu: 'Ngộ nhận 1: "Ngược lại: flow đòi hỏi thử thách **cao**, ngang ngửa với kỹ năng của bạn."'
    moi: '"Ngược lại: theo mô hình kênh flow, flow đòi hỏi thử thách **cao**, ngang ngửa với kỹ năng của bạn."'
    ly_do: Review n74.
  - cu: 'Mục Csikszentmihalyi & LeFevre: "một nghịch lý mà Csikszentmihalyi và LeFevre gọi là \"nghịch lý của công việc\" (tên gọi theo cách kể lại; chưa mở toàn văn)"; mục Việt Nam: "(flow nhiều ở công sở nhưng động lực cao ở lúc rảnh)"'
    moi: '"một nghịch lý mà ở đây chúng tôi gọi là \"nghịch lý của công việc\" (cụm này không lấy từ tóm tắt của bài; chúng tôi chưa mở toàn văn)"; mục Việt Nam: "(đa số trải nghiệm flow được báo cáo khi làm việc, nhưng động lực cao hơn lúc rảnh)"'
    ly_do: Review n28, n72.
  - cu: 'Mục Việt Nam: "Thứ nhất, khái niệm \"mất tự ý thức\" ra đời trong bối cảnh văn hóa cá nhân chủ nghĩa, nơi \"cái tôi cần được im lặng\" là một nhu cầu được cảm nhận rõ. Ở văn hóa Việt Nam đề cao hòa hợp tập thể, trải nghiệm này có thể mang sắc thái khác — nhưng đây mới chỉ là suy đoán,"'
    moi: '"Thứ nhất, ở văn hóa Việt Nam đề cao hòa hợp tập thể, trải nghiệm \"mất tự ý thức\" có thể mang sắc thái khác so với văn hóa đề cao cái tôi cá nhân — nhưng đây mới chỉ là suy đoán,"'
    ly_do: 'Review n71: phần "ra đời trong bối cảnh văn hóa cá nhân chủ nghĩa" không có nguồn.'
