  - lovoll2014
  - swann2018
  ly_do: 'Phân tích tổng hợp 28 nghiên cứu thấy cân bằng thử thách–kỹ năng liên hệ vừa phải với flow (đạt mức tổng hợp), nhưng yếu hơn ở nghiên cứu ESM, công việc/giáo dục, văn hóa cá nhân chủ nghĩa; hai nghiên cứu của Løvoll & Vittersø không thấy đỉnh ở cân bằng; Swann 2018: cân bằng một mình không đủ. Có tổng hợp nhưng kết quả giữa các nghiên cứu khác nhau nhiều: Khá vững.'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Bằng chứng ESM ủng hộ mô hình kênh flow. Tuy nhiên, "cân bằng" một mình chưa đủ: Løvoll và Vittersø (2014) chỉ ra rằng cân bằng ở mức thấp chỉ tạo ra thờ ơ, và một số người vẫn báo cáo trải nghiệm tích cực khi thử thách hơi vượt kỹ năng ([Løvoll và Vittersø, 2014](https://doi.org/10.1007/s11205-012-". Chữ mới: "Một phân tích tổng hợp 28 nghiên cứu (Fong và cộng sự, 2015) thấy cân bằng thử thách–kỹ năng liên hệ ở mức vừa phải với flow, và yếu hơn trong các nghiên cứu dùng ESM, ở môi trường làm việc hay giáo dục, và ở người thuộc nền văn hóa cá nhân chủ nghĩa. Ngược lại, Løvoll và Vittersø (2014), trong hai ". Lý do: Chữ cũ nói Løvoll & Vittersø chỉ ra "cân bằng ở mức thấp chỉ tạo ra thờ ơ" và "thử thách hơi vượt kỹ năng" tích cực: tóm tắt nói không có chỉ báo flow nào đạt đỉnh ở cân bằng và ủng hộ mô hình mất cân bằng. "Bằng chứng ESM ủng hộ" cũng chưa đúng: phân tích tổng hợp thấy tương quan yếu hơn ở nghiên cứu ESM.'
