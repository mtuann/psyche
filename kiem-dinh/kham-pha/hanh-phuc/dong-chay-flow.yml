  ghi_chu: 'Chữ cũ: "FSS (và phiên bản cải tiến FSS-2 của Jackson và Eklund, 2002) trở thành công cụ chuẩn để đo flow, đặc biệt trong tâm lý học thể thao. Thang đo đã được dịch và kiểm định ở nhiều nước — ví dụ trên người trưởng thành Nhật Bản (Kawabata, Mallett và Jackson, 2008) — cho thấy cấu trúc 9 chiều giữ được ở n". Chữ mới: "Phân tích nhân tố khẳng định ủng hộ chín thang và một mô hình có thứ bậc với một nhân tố flow chung. FSS (và phiên bản cải tiến FSS-2 của Jackson và Eklund, 2002) được dùng rộng rãi để đo flow, đặc biệt trong tâm lý học thể thao, dù các nghiên cứu về flow chưa thống nhất cách đo. Đã có nghiên cứu ki". Lý do: "Công cụ chuẩn" và "cấu trúc 9 chiều giữ được ở ngoài phương Tây" không kiểm được (chỉ đọc được tên bài Kawabata); Abuhamdeh 2020: chưa có cách đo thống nhất. Kết quả CFA theo tóm tắt Jackson & Marsh 1996. Chỉ đọc tên bài và siêu dữ liệu; không kiểm được kết luận "giữ được cấu trúc 9 chiều".'
- id: n33
  cau: 'Khung Khá vững: 9 đặc điểm của flow được dùng để mô tả flow ở nhiều lĩnh vực, nhưng không đều giữa các đặc điểm.'
  loai: nhan
