nhan_dinh:
- id: n1
  cau: Csikszentmihalyi gọi trạng thái hòa nhập hoàn toàn với việc đang làm là flow (trạng thái dòng chảy).
  loai: lich-su
  nguon:
  - abuhamdeh2020
  trich: Based on this research, Csikszentmihalyi developed the concept of "flow."
  vi_tri: Summary and Conclusion
  ket_qua: dung
- id: n2
  cau: Flow là một cấu hình ý thức với những đặc điểm được mô tả và đo lường trong nhiều nghiên cứu, dù cách đo chưa thống nhất.
  loai: phat-hien
  nguon:
  - abuhamdeh2020
  trich: a consensual operationalization of flow has yet to be established
  vi_tri: Summary and Conclusion
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Flow là một cấu hình ý thức rất cụ thể, với những đặc điểm có thể mô tả, đo lường và tái hiện qua nghiên cứu. Bài này sẽ "mổ xẻ" nó.". Chữ mới: "Flow là một cấu hình ý thức rất cụ thể, với những đặc điểm được mô tả và đo lường trong nhiều nghiên cứu (dù cách đo chưa thống nhất). Bài này sẽ "mổ xẻ" nó.". Lý do: "Tái hiện" không có nguồn; Abuhamdeh (2020): chưa có cách đo được thống nhất.'
- id: n3
  cau: Từ giữa những năm 1970 Csikszentmihalyi hỏi hàng trăm người leo núi, kỳ thủ cờ vua, nghệ sĩ... mô tả những khoảnh khắc tốt nhất; từ đó có khái niệm flow.
  loai: lich-su
  nguon:
  - abuhamdeh2020
  trich: he asked hundreds of rock climbers, chess players, artists, etc. to describe what their best moments felt like
  vi_tri: Summary and Conclusion
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Từ những năm 1970, Csikszentmihalyi phỏng vấn hàng trăm người ở những lĩnh vực rất khác nhau — vận động viên leo núi, vũ công, kỳ thủ cờ vua, bác sĩ phẫu thuật, nhà soạn nhạc — và hỏi họ về những khoảnh khắc "mọi thứ vào guồng" nhất. Dù công việc khác nhau một trời một vực, mô tả của họ trùng khớp đ". Chữ mới: "Từ giữa những năm 1970 (Csikszentmihalyi, 1975), Csikszentmihalyi hỏi hàng trăm người leo núi, kỳ thủ cờ vua, nghệ sĩ... mô tả những khoảnh khắc tốt nhất của họ, và từ đó đưa ra khái niệm flow. Các nhà nghiên cứu về sau nhận xét mô tả khá nhất quán giữa các hoạt động (dù có phê bình, xem phần Mức độ". Lý do: Danh sách vũ công, bác sĩ phẫu thuật, nhà soạn nhạc và "trùng khớp đến ngạc nhiên" không có nguồn đã mở (Abuhamdeh 2020: "hundreds of rock climbers, chess players, artists, etc.").'
- id: n4
  cau: 'Csikszentmihalyi (1975): khái niệm flow xuất hiện lần đầu trong Beyond Boredom and Anxiety (1975).'
  loai: lich-su
  nguon:
  - abuhamdeh2020
  trich: Almost 50 years ago, Csikszentmihalyi (1975) began a program of research with the aim of understanding the common experiential characteristics of so-called "optimal experiences"
  vi_tri: Summary and Conclusion
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Từ những năm 1970, Csikszentmihalyi phỏng vấn hàng trăm người ở những lĩnh vực rất khác nhau — vận động viên leo núi, vũ công, kỳ thủ cờ vua, bác sĩ phẫu thuật, nhà soạn nhạc — và hỏi họ về những khoảnh khắc "mọi thứ vào guồng" nhất. Dù công việc khác nhau một trời một vực, mô tả của họ trùng khớp đ". Chữ mới: "Từ giữa những năm 1970 (Csikszentmihalyi, 1975), Csikszentmihalyi hỏi hàng trăm người leo núi, kỳ thủ cờ vua, nghệ sĩ... mô tả những khoảnh khắc tốt nhất của họ, và từ đó đưa ra khái niệm flow. Các nhà nghiên cứu về sau nhận xét mô tả khá nhất quán giữa các hoạt động (dù có phê bình, xem phần Mức độ". Lý do: Danh sách vũ công, bác sĩ phẫu thuật, nhà soạn nhạc và "trùng khớp đến ngạc nhiên" không có nguồn đã mở (Abuhamdeh 2020: "hundreds of rock climbers, chess players, artists, etc."). Năm 1975 theo Abuhamdeh/Swann; sách 1975 chưa mở được.'
- id: n5
  cau: Các nhà nghiên cứu về sau nhận xét mô tả flow khá nhất quán giữa các hoạt động, dù có phê bình.
  loai: phat-hien
  nguon:
  - swann2018
  trich: '"remarkable consistency has been found in the described flow experiences of individuals across diverse settings" (Jackson & Eklund, 2004, p.3)'
  vi_tri: tr. 5–6, mục Normal Science
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Từ những năm 1970, Csikszentmihalyi phỏng vấn hàng trăm người ở những lĩnh vực rất khác nhau — vận động viên leo núi, vũ công, kỳ thủ cờ vua, bác sĩ phẫu thuật, nhà soạn nhạc — và hỏi họ về những khoảnh khắc "mọi thứ vào guồng" nhất. Dù công việc khác nhau một trời một vực, mô tả của họ trùng khớp đ". Chữ mới: "Từ giữa những năm 1970 (Csikszentmihalyi, 1975), Csikszentmihalyi hỏi hàng trăm người leo núi, kỳ thủ cờ vua, nghệ sĩ... mô tả những khoảnh khắc tốt nhất của họ, và từ đó đưa ra khái niệm flow. Các nhà nghiên cứu về sau nhận xét mô tả khá nhất quán giữa các hoạt động (dù có phê bình, xem phần Mức độ". Lý do: Danh sách vũ công, bác sĩ phẫu thuật, nhà soạn nhạc và "trùng khớp đến ngạc nhiên" không có nguồn đã mở (Abuhamdeh 2020: "hundreds of rock climbers, chess players, artists, etc."). Chữ cũ "trùng khớp đến ngạc nhiên" là lời của chính các tác giả ủng hộ (Jackson & Eklund 2004), không phải kết luận khách quan; xem phê bình ở các khung nhãn.'
- id: n6
  cau: 'Cuốn Flow: The Psychology of Optimal Experience (1990) tổng hợp 9 đặc điểm của flow.'
  loai: lich-su
  nguon:
  - swann2018
  trich: how do athletes' experiences of flow compare with the theoretical descriptions of flow put forward by Csikszentmihalyi (1990)?
  vi_tri: tr. 6 (trích Jackson 1996)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Từ những năm 1970, Csikszentmihalyi phỏng vấn hàng trăm người ở những lĩnh vực rất khác nhau — vận động viên leo núi, vũ công, kỳ thủ cờ vua, bác sĩ phẫu thuật, nhà soạn nhạc — và hỏi họ về những khoảnh khắc "mọi thứ vào guồng" nhất. Dù công việc khác nhau một trời một vực, mô tả của họ trùng khớp đ". Chữ mới: "Từ giữa những năm 1970 (Csikszentmihalyi, 1975), Csikszentmihalyi hỏi hàng trăm người leo núi, kỳ thủ cờ vua, nghệ sĩ... mô tả những khoảnh khắc tốt nhất của họ, và từ đó đưa ra khái niệm flow. Các nhà nghiên cứu về sau nhận xét mô tả khá nhất quán giữa các hoạt động (dù có phê bình, xem phần Mức độ". Lý do: Danh sách vũ công, bác sĩ phẫu thuật, nhà soạn nhạc và "trùng khớp đến ngạc nhiên" không có nguồn đã mở (Abuhamdeh 2020: "hundreds of rock climbers, chess players, artists, etc."). Sách 1990 chưa mở được; Swann 2018 trình bày chín chiều là cách hiểu phổ biến ("commonly understood in terms of nine dimensions"), dẫn Jackson & Csikszentmihalyi 1999, Nakamura & Csikszentmihalyi 2002.'
- id: n7
  cau: 'Đặc điểm 1: Cân bằng giữa thử thách và kỹ năng.'
  loai: dinh-nghia
  nguon:
  - swann2018
  trich: challenge-skill balance, in which individuals perceive a balance between the challenge of the situation and their skills
  vi_tri: tr. 6, mục Normal Science and the Flow Paradigm
  ket_qua: dung
- id: n8
  cau: 'Đặc điểm 2: Mục tiêu rõ ràng.'
  loai: dinh-nghia
  nguon:
  - swann2018
  trich: clear goals for the individual to strive towards
  vi_tri: tr. 6, mục Normal Science and the Flow Paradigm
  ket_qua: dung
- id: n9
  cau: 'Đặc điểm 3: Phản hồi tức thì, rõ ràng.'
  loai: dinh-nghia
  nguon:
  - swann2018
  trich: unambiguous feedback that allows the person to know whether they are progressing towards their goals
  vi_tri: tr. 6, mục Normal Science and the Flow Paradigm
  ket_qua: dung
- id: n10
  cau: 'Đặc điểm 4: Hòa nhập giữa hành động và nhận thức.'
  loai: dinh-nghia
  nguon:
  - swann2018
  trich: action-awareness merging (whereby deep involvement leads to automaticity and spontaneity)
  vi_tri: tr. 6, mục Normal Science and the Flow Paradigm
  ket_qua: dung
- id: n11
  cau: 'Đặc điểm 5: Tập trung sâu.'
  loai: dinh-nghia
  nguon:
  - swann2018
  trich: concentration on the task at hand
  vi_tri: tr. 6, mục Normal Science and the Flow Paradigm
  ket_qua: dung
- id: n12
  cau: 'Đặc điểm 6: Cảm giác kiểm soát.'
  loai: dinh-nghia
  nguon:
  - swann2018
  trich: sense of control over the performance or outcome of the activity
  vi_tri: tr. 6, mục Normal Science and the Flow Paradigm
  ket_qua: dung
  ghi_chu: Câu "không phải kiểm soát tuyệt đối... tình huống vẫn đầy rủi ro" là diễn giải của trang (nghịch lý minh họa); bài chỉ nêu "sense of control over performance or outcome".
- id: n13
  cau: 'Đặc điểm 7: Mất tự ý thức.'
  loai: dinh-nghia
  nguon:
  - swann2018
  trich: loss of self-consciousness (i.e., decreased awareness of the self and social evaluation)
  vi_tri: tr. 6, mục Normal Science and the Flow Paradigm
  ket_qua: dung
  ghi_chu: 'Ghi chú: Swann 2012 (theo Swann 2018) thấy dưới 30% vận động viên ưu tú nêu đặc điểm này (xem khung nhãn).'
- id: n14
  cau: 'Đặc điểm 8: Biến dạng cảm nhận thời gian.'
  loai: dinh-nghia
  nguon:
  - swann2018
  trich: transformation of time (i.e., time becomes either speeds up, slows down, or becomes irrelevant)
  vi_tri: tr. 6, mục Normal Science and the Flow Paradigm
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Lúc thì ba tiếng trôi như ba mươi phút, lúc thì một giây như kéo dài vô tận (vận động viên thường mô tả dạng thứ hai).". Chữ mới: "Lúc thì ba tiếng trôi như ba mươi phút, lúc thì một giây như kéo dài vô tận, hoặc thời gian trở nên không còn quan trọng.". Lý do: Câu về vận động viên không có nguồn; Swann 2018: thời gian có thể nhanh lên, chậm đi hay không còn quan trọng.'
- id: n15
  cau: 'Đặc điểm 9: Trải nghiệm tự thân (autotelic).'
  loai: dinh-nghia
  nguon:
  - swann2018
  trich: autotelic experience (i.e., flow is described as rewarding and enjoyable)
  vi_tri: tr. 6, mục Normal Science and the Flow Paradigm
  ket_qua: dung
- id: n16
  cau: Ba đặc điểm đầu thường được xem là điều kiện để flow xuất hiện; sáu đặc điểm còn lại mô tả trải nghiệm flow; autotelic có khi được coi là mô tả chung của flow.
  loai: dinh-nghia
  nguon:
  - swann2018
  - abuhamdeh2020
  trich: Three of these dimensions are proposed to be the conditions necessary for flow to occur [...] The remaining six dimensions are suggested to describe the characteristics of the flow experience
  vi_tri: 'Swann 2018, tr. 6 và chú thích 2; Abuhamdeh 2020: antecedents "clear goals, immediate feedback, and a balance of challenge and skill"'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Một chi tiết tinh tế: tám đặc điểm đầu mô tả *trạng thái đang diễn ra*, còn đặc điểm thứ chín là *kết quả* — việc trở nên đáng làm vì chính nó là hệ quả của việc các điều kiện kia hội tụ.". Chữ mới: "Một chi tiết tinh tế: ba đặc điểm đầu (cân bằng thử thách–kỹ năng, mục tiêu rõ, phản hồi rõ) thường được xem là *điều kiện để flow xuất hiện*, còn sáu đặc điểm còn lại mô tả *trải nghiệm flow* (Nakamura và Csikszentmihalyi, 2002, theo Swann và cộng sự, 2018); trải nghiệm tự thân (autotelic) có khi đ". Lý do: Câu cũ ("tám đặc điểm đầu là trạng thái, đặc điểm thứ chín là kết quả") không khớp cách phân chia ba điều kiện / sáu đặc điểm trong tài liệu.'
- id: n17
  cau: 'Mô hình kênh flow (góc phần tư): thử thách vượt xa kỹ năng gây lo âu, kỹ năng vượt xa thử thách gây chán, cả hai thấp gây thờ ơ; flow được dự đoán khi cả hai cao (cao hơn mức trung bình của chính người đó).'
  loai: dinh-nghia
  nguon:
  - abuhamdeh2020
  - swann2018
  trich: flow is operationalized as any observation in which both perceived challenge and perceived skill are both "high" (i.e., above the person's average)
  vi_tri: 'Abuhamdeh 2020, mục Issue 1 (Hình 2); Swann 2018: "models generally postulate how combinations of high and low challenge and skill can lead to outcomes such as boredom, anxiety, and flow"'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đi kèm với 9 đặc điểm là **mô hình kênh flow**: khi thử thách vượt xa kỹ năng, ta lo âu; khi kỹ năng vượt xa thử thách, ta chán; khi cả hai đều thấp, ta thờ ơ. Flow chỉ xuất hiện ở góc phần tư mà cả hai đều **cao và cân bằng** — cân bằng ở mức "việc dễ, mình cũng dở" thì không tạo ra flow, chỉ tạo r". Chữ mới: "Các nghiên cứu về flow thường đi kèm một mô hình mô tả, gọi là **mô hình kênh flow** (hay mô hình góc phần tư): khi thử thách vượt xa kỹ năng, ta lo âu; khi kỹ năng vượt xa thử thách, ta chán; khi cả hai đều thấp, ta thờ ơ. Mô hình dự đoán flow ở nơi cả hai đều **cao** (cao hơn mức trung bình của ch". Lý do: Câu cũ nêu mô hình như điều đã xảy ra ("flow chỉ xuất hiện"); các nguồn gọi đây là mô hình, và "cao" tính theo mức trung bình của từng người; "thờ ơ dễ chịu" không có nguồn. Mô hình này là mô tả, không giải thích (Swann 2018).'
- id: n18
  cau: 'Hình flow-channel (không có số): sơ đồ ước lệ ghi nhãn "Lo âu", "Chán nản", "Thờ ơ", "Dòng chảy (flow)" trên hai trục kỹ năng và thách thức.'
