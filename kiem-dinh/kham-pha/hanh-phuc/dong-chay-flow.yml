  trich: The nine FSS scales of the 36-item instrument represent the dimensions of flow discussed by Csikszentmihalyi (1990, 1993), and each scale is measured by four items. [...] administration of the scale to 394 athletes
  vi_tri: tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "xây dựng **Flow State Scale (FSS)** — thang đo 36 câu tương ứng với 9 đặc điểm của flow — và kiểm định trên vận động viên.". Chữ mới: "xây dựng **Flow State Scale (FSS)** — thang đo 36 câu (mỗi đặc điểm bốn câu) tương ứng với 9 đặc điểm của flow — và kiểm định trên 394 vận động viên.". Lý do: Thêm cỡ mẫu theo tóm tắt. Chỉ đọc tóm tắt.'
- id: n30
  cau: Phân tích nhân tố khẳng định ủng hộ chín thang và mô hình có thứ bậc với một nhân tố flow chung.
  loai: phat-hien
  nguon:
  - jackson1996
  trich: Confirmatory factor analyses supported the nine scales. [...] there was also support for a hierarchical model in which one global (higher order) flow factor explained correlations among the nine first-order FSS factors.
  vi_tri: tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "FSS (và phiên bản cải tiến FSS-2 của Jackson và Eklund, 2002) trở thành công cụ chuẩn để đo flow, đặc biệt trong tâm lý học thể thao. Thang đo đã được dịch và kiểm định ở nhiều nước — ví dụ trên người trưởng thành Nhật Bản (Kawabata, Mallett và Jackson, 2008) — cho thấy cấu trúc 9 chiều giữ được ở n". Chữ mới: "Phân tích nhân tố khẳng định ủng hộ chín thang và một mô hình có thứ bậc với một nhân tố flow chung. FSS (và phiên bản cải tiến FSS-2 của Jackson và Eklund, 2002) được dùng rộng rãi để đo flow, đặc biệt trong tâm lý học thể thao, dù các nghiên cứu về flow chưa thống nhất cách đo. Đã có nghiên cứu ki". Lý do: "Công cụ chuẩn" và "cấu trúc 9 chiều giữ được ở ngoài phương Tây" không kiểm được (chỉ đọc được tên bài Kawabata); Abuhamdeh 2020: chưa có cách đo thống nhất. Kết quả CFA theo tóm tắt Jackson & Marsh 1996.'
- id: n31
