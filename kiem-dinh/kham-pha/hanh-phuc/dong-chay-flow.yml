  - id: n38
    cau: 'Khung Khá vững: cân bằng thử thách–kỹ năng liên hệ vừa phải với flow, nhưng không đủ để flow xuất hiện.'
    loai: nhan
    nguon:
      - fong2015
      - lovoll2014
      - swann2018
    nhan: kha-vung
    co_so:
      - fong2015
      - lovoll2014
      - swann2018
    ly_do: 'Phân tích tổng hợp 28 nghiên cứu thấy cân bằng thử thách–kỹ năng liên hệ vừa phải với flow, yếu hơn ở nghiên cứu ESM, công việc/giáo dục, văn hóa cá nhân chủ nghĩa; hai nghiên cứu của Løvoll & Vittersø không thấy đỉnh ở cân bằng; Swann 2018: cân bằng một mình không đủ. Nhiều nghiên cứu cùng chiều nhưng kết quả khác nhau nhiều: Khá vững cho liên hệ, không cho "flow xuất hiện khi cân bằng".'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Bằng chứng ESM ủng hộ mô hình kênh flow. Tuy nhiên, "cân bằng" một mình chưa đủ: Løvoll và Vittersø (2014) chỉ ra rằng cân bằng ở mức thấp chỉ tạo ra thờ ơ, và một số người vẫn báo cáo trải nghiệm tích cực khi thử thách hơi vượt kỹ năng ([Løvoll và Vittersø, 2014](https://doi.org/10.1007/s11205-012-". Chữ mới: "Một phân tích tổng hợp 28 nghiên cứu (Fong và cộng sự, 2015) thấy cân bằng thử thách–kỹ năng liên hệ ở mức vừa phải với flow, và yếu hơn trong các nghiên cứu dùng ESM, ở môi trường làm việc hay giáo dục, và ở người thuộc nền văn hóa cá nhân chủ nghĩa. Ngược lại, Løvoll và Vittersø (2014), trong hai ". Lý do: Chữ cũ nói Løvoll & Vittersø chỉ ra "cân bằng ở mức thấp chỉ tạo ra thờ ơ" và "thử thách hơi vượt kỹ năng" tích cực: tóm tắt nói không có chỉ báo flow nào đạt đỉnh ở cân bằng và ủng hộ mô hình mất cân bằng. "Bằng chứng ESM ủng hộ" cũng chưa đúng: phân tích tổng hợp thấy tương quan yếu hơn ở nghiên cứu ESM. Review (Claude Sonnet 5.5, 10/11/2026): sai. Lượt 2 đúng: tiêu đề khung nói "flow xuất hiện khi thử thách và kỹ năng đều cao và cân bằng" như điều chắc trong khi nội dung cho thấy chỉ liên hệ vừa phải (Fong 2015), có nghiên cứu không thấy đỉnh ở cân bằng (Løvoll & Vittersø 2014) và cân bằng không đủ (Swann 2018). Khá vững chỉ hợp với "có liên hệ vừa phải". Đã đổi tiêu đề khung (hộp tóm tắt đổi theo).'
    luot_2: qua-manh
    luot_2_nguon: [ "https://doi.org/10.1080/17439760.2014.967799", "https://doi.org/10.1080/10413200.2018.1443525", "https://doi.org/10.1007/s11205-012-0211-9" ]
    luot_2_ghi_chu: 'câu đúng: Cân bằng thử thách-kỹ năng liên hệ vừa phải với flow (Fong 2015: 28 nghiên cứu), được coi là một điều kiện đề xuất nhưng không đủ để flow xảy ra; vài nghiên cứu không thấy flow đạt đỉnh ở điểm cân bằng.; "Flow xuất hiện khi... cân bằng" đọc như điều kiện đủ; bằng chứng chỉ cho liên hệ vừa phải, không đủ, và có nghiên cứu không thấy đỉnh ở điểm cân bằng. Nhãn Khá vững chỉ hợp với "có liên hệ".'
    review: sai
