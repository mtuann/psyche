  ghi_chu: 'Chữ cũ: "Flow là một dạng trải nghiệm tối ưu, nhưng "cháy" liên tục không nghỉ vẫn dẫn đến kiệt sức. Hơn nữa, flow không phân biệt tốt–xấu về mặt đạo đức: người ta cũng có thể "chảy" trong game gây nghiện hay trong công việc ám ảnh đến mức bỏ bê gia đình.". Chữ mới: "Một phân tích tổng hợp (Sweeny và cộng sự, 2026) thấy flow liên hệ dương, ở mức vừa phải đến khá mạnh, với well-being, nên ý "càng nhiều flow càng hạnh phúc" có phần đúng ở mức tương quan; nhưng đó là tương quan, và chúng tôi chưa tìm thấy nghiên cứu nào xét giới hạn của việc ở trong flow liên tục h". Lý do: Chữ cũ ("cháy liên tục dẫn đến kiệt sức", "game gây nghiện", "bỏ bê gia đình") không có nguồn; viết lại theo tổng hợp Sweeny 2026. Lần tìm: chỉ đọc tóm tắt Sweeny 2026 (không nêu giới hạn); chưa có truy vấn riêng về "flow addiction"; chỉ ghi là chưa tìm thấy.'
- id: n77
  cau: 'Ngộ nhận 3: các nét của nhân cách tự trị được mô tả như "siêu kỹ năng"; liên hệ với tần suất flow hiếm được kiểm tra; tận tâm liên hệ vừa phải (r = 0,33); chưa nói được rèn luyện hay bẩm sinh.'
  loai: phat-hien
  nguon:
