  trich: a moderately strong, positive relationship between flow and well-being
  vi_tri: tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Flow là một dạng trải nghiệm tối ưu, nhưng "cháy" liên tục không nghỉ vẫn dẫn đến kiệt sức. Hơn nữa, flow không phân biệt tốt–xấu về mặt đạo đức: người ta cũng có thể "chảy" trong game gây nghiện hay trong công việc ám ảnh đến mức bỏ bê gia đình.". Chữ mới: "Một phân tích tổng hợp (Sweeny và cộng sự, 2026) thấy flow liên hệ dương, ở mức vừa phải đến khá mạnh, với well-being, nên ý "càng nhiều flow càng hạnh phúc" có phần đúng ở mức tương quan; nhưng đó là tương quan, và chúng tôi chưa tìm thấy nghiên cứu nào xét giới hạn của việc ở trong flow liên tục h". Lý do: Chữ cũ ("cháy liên tục dẫn đến kiệt sức", "game gây nghiện", "bỏ bê gia đình") không có nguồn; viết lại theo tổng hợp Sweeny 2026. Chữ cũ: "- **"Càng nhiều flow càng hạnh phúc, nên cứ ''cháy'' hết mình."**". Chữ mới: "- **"Càng nhiều flow càng hạnh phúc, nên cứ ''cháy'' hết mình."** Đúng một phần:". Lý do: Đổi câu mở theo nội dung mới. Chỉ đọc tóm tắt. Phần "chưa tìm thấy nghiên cứu xét giới hạn" là phủ định theo lần tìm hạn chế (tạm xem là thoi-su ở n sau).'
