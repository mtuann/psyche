  ly_do: Phân tích tổng hợp 22 nghiên cứu (thể thao và trò chơi) thấy liên hệ vừa phải, nhất quán (r = 0,31); phân tích tổng hợp về flow trong học tập cùng chiều; nhưng đều là tương quan và cơ chế chưa được chứng minh. Khá vững cho liên hệ; không nói nhân quả.
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Nghe thì hợp lý — "vào zone" thì phải đá hay hơn chứ? Nhưng tổng quan của Swann và cộng sự (2018) về flow trong thể thao cho thấy mối liên hệ giữa flow và thành tích thực tế **không nhất quán** như người ta tưởng: có nghiên cứu thấy liên quan, có nghiên cứu không ([Swann và cộng sự, 2018](https://do". Chữ mới: "Nghe thì hợp lý — "vào zone" thì phải đá hay hơn chứ? Một phân tích tổng hợp 22 nghiên cứu về thể thao và trò chơi (Harris và cộng sự, 2021) thấy mối liên hệ trung bình và nhất quán giữa flow và thành tích (r = 0,31; khoảng tin cậy 95%: 0,24–0,38). Nhưng đây là tương quan: các cơ chế được đề xuất ch". Lý do: Chữ cũ (khung "Đã bị bác bỏ") sai: Swann 2018 không nói liên hệ flow–thành tích không nhất quán; phân tích tổng hợp Harris 2021 thấy liên hệ nhất quán, vừa phải. Hạ từ bac-bo sang kha-vung và viết lại. Chữ cũ: ":::bac-bo[cứ vào flow là hiệu suất tăng]". Chữ mới: ":::kha-vung[flow đi cùng thành tích tốt hơn, nhưng chưa rõ nhân quả]". Lý do: Đổi tên khung theo kết quả trên.'
