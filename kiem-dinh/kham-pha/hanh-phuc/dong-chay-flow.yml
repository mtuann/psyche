  - id: n60
    cau: 'Áp dụng 2 (nhãn Đang tranh cãi): công việc: bảo vệ khung giờ sâu, điều chỉnh độ khó.'
    loai: nhan
    nguon:
      - swann2018
    nhan: tranh-cai
    co_so:
      - swann2018
    ly_do: 'Thử nghiệm gây flow bằng chỉnh độ khó cho kết quả trái ngược (Harris 2017 và Schweickle 2017, theo Swann 2018); chưa thấy thử nghiệm riêng về tắt thông báo; bằng chứng thực nghiệm mâu thuẫn: Đang tranh cãi.'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Flow cần sự tập trung không bị ngắt quãng — mỗi lần check điện thoại là một lần "rơi" khỏi dòng chảy. Hãy xếp những việc đòi hỏi tư duy sâu vào một khung giờ liền mạch, tắt thông báo. Đồng thời, nếu một nhiệm vụ quá dễ đến mức buồn ngủ, hãy tự nâng độ khó lên (đặt deadline ngắn hơn, thêm tiêu chí ch". Chữ mới: "Tập trung sâu là một đặc điểm của flow; chúng tôi chưa tìm thấy thử nghiệm kiểm tra riêng việc tắt thông báo làm tăng flow. Một cách thử là xếp những việc đòi hỏi tư duy sâu vào một khung giờ liền mạch. Việc chỉnh độ khó (nâng lên nếu quá dễ, chia nhỏ nếu quá khó) dựa vào mô hình kênh flow, nhưng bằ". Lý do: Chữ cũ ("mỗi lần check điện thoại là một lần rơi khỏi dòng chảy", "bạn đang lái mình vào kênh flow") không có nguồn; các thử nghiệm gây flow bằng chỉnh độ khó cho kết quả trái ngược. Hạ nhãn từ kha-vung xuống tranh-cai (xem tiêu đề). Chữ cũ: "### 2. Công việc: bảo vệ "khung giờ sâu", điều chỉnh độ khó :nhan[kha-vung]". Chữ mới: "### 2. Công việc: bảo vệ "khung giờ sâu", điều chỉnh độ khó :nhan[tranh-cai] { #2-cong-viec-bao-ve-khung-gio-sau-dieu-chinh-do-kho-kha-vung }". Lý do: Đổi nhãn kha-vung thành tranh-cai; giữ id cũ. Review (Claude Sonnet 5.5, 10/11/2026): dung. Đang tranh cãi hợp: thử nghiệm gây flow bằng chỉnh độ khó cho kết quả ngược nhau (Harris 2017; Schweickle 2017, theo Swann 2018). Giữ id cũ.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/10413200.2018.1443525" ]
    luot_2_ghi_chu: Nhãn Đang tranh cãi thấp hơn thước đo Khá vững; thận trọng, hợp lý.
    review: dung
  - id: n61
    cau: 'Swann 2018: Harris, Vine & Wilson (2017) đặt mục tiêu khó dần để gây flow; Schweickle và cộng sự (2017) thấy mục tiêu khó dần có hại cho flow và gây trạng thái nỗ lực hơn.'
    loai: phat-hien
    nguon:
      - swann2018
    trich: Harris, Vine and Wilson (2017) who set incrementally more difficult specific goals to induce flow through challenge-skill balance; however similar work (Schweickle et al., 2017) found contradictory evidence
    vi_tri: tr. 16
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Flow cần sự tập trung không bị ngắt quãng — mỗi lần check điện thoại là một lần "rơi" khỏi dòng chảy. Hãy xếp những việc đòi hỏi tư duy sâu vào một khung giờ liền mạch, tắt thông báo. Đồng thời, nếu một nhiệm vụ quá dễ đến mức buồn ngủ, hãy tự nâng độ khó lên (đặt deadline ngắn hơn, thêm tiêu chí ch". Chữ mới: "Tập trung sâu là một đặc điểm của flow; chúng tôi chưa tìm thấy thử nghiệm kiểm tra riêng việc tắt thông báo làm tăng flow. Một cách thử là xếp những việc đòi hỏi tư duy sâu vào một khung giờ liền mạch. Việc chỉnh độ khó (nâng lên nếu quá dễ, chia nhỏ nếu quá khó) dựa vào mô hình kênh flow, nhưng bằ". Lý do: Chữ cũ ("mỗi lần check điện thoại là một lần rơi khỏi dòng chảy", "bạn đang lái mình vào kênh flow") không có nguồn; các thử nghiệm gây flow bằng chỉnh độ khó cho kết quả trái ngược. Hạ nhãn từ kha-vung xuống tranh-cai (xem tiêu đề). Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp Swann 2018 tr. 16 (Harris, Vine & Wilson 2017 và Schweickle và cộng sự 2017 cho kết quả trái chiều).'
    luot_2: dung
