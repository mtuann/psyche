  ghi_chu: 'Chữ cũ: "Các lần kiểm định thang đo ở châu Á (ví dụ Nhật Bản) cho cấu trúc tương tự phương Tây, nhưng số nghiên cứu ngoài phương Tây còn ít. Đáng chú ý, đặc điểm "mất tự ý thức" có thể được trải nghiệm khác nhau giữa văn hóa đề cao cái tôi cá nhân và văn hóa đề cao hòa hợp tập thể — và đây mới chỉ là giả thu". Chữ mới: "Bằng chứng về tính phổ quát chưa thống nhất: phân tích tổng hợp về cân bằng thử thách–kỹ năng thấy tương quan yếu hơn ở nền văn hóa cá nhân chủ nghĩa (Fong và cộng sự, 2015); phân tích tổng hợp 108 nghiên cứu về flow trong học tập thấy bối cảnh văn hóa không làm đổi độ lớn các liên hệ (Xie và cộng s". Lý do: Chữ cũ nói các kiểm định ở châu Á "cho cấu trúc tương tự" mà chưa đọc được kết quả; thêm ba phân tích tổng hợp về văn hóa. Chỉ đọc tóm tắt.'
