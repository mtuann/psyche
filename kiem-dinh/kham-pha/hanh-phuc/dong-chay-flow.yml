    ghi_chu: 'Chữ cũ: "**Chúng tôi chưa tìm thấy nghiên cứu nào về flow (bằng ESM hay thang đo FSS) thực hiện trên người Việt.** Điều này có nghĩa là mọi lời khuyên "áp dụng flow" cho người Việt hiện tại đều dựa trên dữ liệu từ các nước khác — chủ yếu phương Tây, cộng thêm một số nước châu Á như Nhật Bản.". Chữ mới: "Tính đến 11/2026, chúng tôi tìm thấy một nghiên cứu về flow ở người Việt: Nguyen và cộng sự (2026), khảo sát 239 sinh viên đại học học tiếng Anh trực tuyến và phỏng vấn 12 người. Mức flow nói chung cao (trung bình 3,77); ba chiều nổi bật nhất là phản hồi tức thì, cân bằng thử thách–kỹ năng và mất tự". Lý do: Câu cũ "chưa tìm thấy nghiên cứu nào về flow trên người Việt" sai: có Nguyen 2026 (tìm 10/11/2026). Review (Claude Sonnet 5.5, 10/11/2026): dung. Có mốc, nguồn, het_han; "chưa rõ" thang nào vì chỉ đọc tóm tắt.'
    luot_2: dung
    luot_2_nguon: [ "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=%28Vietnam*%20AND%20%28%22flow%20state%22%20OR%20%22flow%20experience%22%20OR%20%22dispositional%20flow%22%20OR%20%22Flow%20State%20Scale%22%29%29&pageSize=20&format=json&sort=P_PDATE_D%20desc", "https://doi.org/10.1016/j.actpsy.2026.106580" ]
    luot_2_ghi_chu: 'Kiểm lại 10/11/2026: không thấy nghiên cứu flow ESM ở người Việt. Tóm tắt bài 2026 không nêu tên thang (chỉ nói tám chiều flow); câu "chưa rõ" đúng. Chưa mở toàn văn.'
    review: dung
