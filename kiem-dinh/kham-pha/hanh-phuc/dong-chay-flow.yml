    cau: 'Việt Nam: ở văn hóa đề cao hòa hợp tập thể, mất tự ý thức có thể mang sắc thái khác so với văn hóa đề cao cái tôi cá nhân (suy đoán); trong nghiên cứu Việt Nam mất tự ý thức nằm trong ba chiều nổi bật nhất.'
