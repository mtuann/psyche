    trich: While there is support for challenge-skill balance as an important factor in flow (Fong et al., 2015), alone it is insufficient for these states to occur
    vi_tri: tr. 14
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Bằng chứng ESM ủng hộ mô hình kênh flow. Tuy nhiên, "cân bằng" một mình chưa đủ: Løvoll và Vittersø (2014) chỉ ra rằng cân bằng ở mức thấp chỉ tạo ra thờ ơ, và một số người vẫn báo cáo trải nghiệm tích cực khi thử thách hơi vượt kỹ năng ([Løvoll và Vittersø, 2014](https://doi.org/10.1007/s11205-012-". Chữ mới: "Một phân tích tổng hợp 28 nghiên cứu (Fong và cộng sự, 2015) thấy cân bằng thử thách–kỹ năng liên hệ ở mức vừa phải với flow, và yếu hơn trong các nghiên cứu dùng ESM, ở môi trường làm việc hay giáo dục, và ở người thuộc nền văn hóa cá nhân chủ nghĩa. Ngược lại, Løvoll và Vittersø (2014), trong hai ". Lý do: Chữ cũ nói Løvoll & Vittersø chỉ ra "cân bằng ở mức thấp chỉ tạo ra thờ ơ" và "thử thách hơi vượt kỹ năng" tích cực: tóm tắt nói không có chỉ báo flow nào đạt đỉnh ở cân bằng và ủng hộ mô hình mất cân bằng. "Bằng chứng ESM ủng hộ" cũng chưa đúng: phân tích tổng hợp thấy tương quan yếu hơn ở nghiên cứu ESM. Chữ cũ: "Ý thức con người "kén" việc: quá khó thì hệ thần kinh báo động (lo âu), quá dễ thì nó buồn chán và đi lang thang. Chỉ khi thử thách và kỹ năng cùng cao và khớp nhau, toàn bộ nguồn lực chú ý mới có "việc đáng làm" và dồn hết vào đó. Đây là lời giải thích ở cấp độ *điều kiện*.". Chữ mới: "Theo mô hình, quá khó thì ta lo âu, quá dễ thì chán. Chỉ khi thử thách và kỹ năng cùng cao và khớp nhau thì flow mới được dự đoán. Đây là mô tả ở cấp độ *điều kiện*, không phải giải thích cơ chế: Swann và cộng sự (2018) nhận xét các điều kiện đủ để flow xảy ra vẫn chưa được biết.". Lý do: Chữ cũ nêu cơ chế ("hệ thần kinh báo động", "nguồn lực chú ý") không có nguồn; các tài liệu nói mô hình kênh là mô hình mô tả. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp Swann 2018 tr. 14 ("alone it is insufficient").'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/10413200.2018.1443525", "https://eprints.leedsbeckett.ac.uk/id/eprint/4768/1/AReviewofScientificProgressinFlowAM-PIGGOTT.pdf" ]
    luot_2_ghi_chu: 'Đọc toàn văn Swann và cộng sự 2018 (J Appl Sport Psychol, bản Leeds Beckett). Chính bài viết: "alone [challenge-skill balance] is insufficient".'
    review: dung
