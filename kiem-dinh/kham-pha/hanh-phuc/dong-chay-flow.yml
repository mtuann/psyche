- cu: Tên khung :::vung-chac[9 đặc điểm của flow xuất hiện nhất quán qua nhiều lĩnh vực]; :::kha-vung[flow xuất hiện khi thử thách và kỹ năng đều cao và cân bằng]; :::tranh-cai[flow có phải trải nghiệm phổ quát, giống nhau ở mọi nền văn hóa?]; :::bac-bo[cứ vào flow là hiệu suất tăng]
  moi: Tên khung :::kha-vung[9 đặc điểm của flow được dùng để mô tả flow ở nhiều lĩnh vực, nhưng không đều giữa các đặc điểm]; :::kha-vung[flow xuất hiện khi thử thách và kỹ năng đều cao và cân bằng]; :::tranh-cai[flow có phải trải nghiệm phổ quát, giống nhau ở mọi nền văn hóa?]; :::kha-vung[flow đi cùng thành tích tốt hơn, nhưng chưa rõ nhân quả]
