  - id: n28
    cau: Người ta vẫn có động lực hơn khi rảnh rỗi so với khi làm việc (cụm "nghịch lý của công việc" là cách gọi của site, không có trong tóm tắt của bài).
    loai: phat-hien
    nguon:
      - csik1989
    trich: respondents are more motivated in leisure than in work
    vi_tri: tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Tuy nhiên, dù trải nghiệm lúc rảnh kém "chất" hơn, người ta vẫn thấy *có động lực hơn* trong thời gian rảnh — một nghịch lý mà Csikszentmihalyi gọi là "nghịch lý của công việc"". Chữ mới: "Tuy nhiên, người ta vẫn thấy *có động lực hơn* trong thời gian rảnh so với khi làm việc — một nghịch lý mà Csikszentmihalyi và LeFevre gọi là "nghịch lý của công việc" (tên gọi theo cách kể lại; chưa mở toàn văn)". Lý do: "Trải nghiệm lúc rảnh kém chất hơn" không có trong tóm tắt (tóm tắt nói "regardless of the quality of experience"). Tên gọi "nghịch lý của công việc" chỉ theo cách kể lại; tóm tắt không dùng cụm này. Review (Claude Sonnet 5.5, 10/11/2026): sai. Tóm tắt (OpenAlex) nói "respondents are more motivated in leisure than in work" nhưng không dùng cụm "nghịch lý của công việc"; trang cũ viết "Csikszentmihalyi và LeFevre gọi là" kèm "theo cách kể lại" không rõ nguồn. Đã đổi thành cách gọi của site và nói rõ cụm không lấy từ tóm tắt (cả mục Việt Nam).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0022-3514.56.5.815" ]
    luot_2_ghi_chu: Đúng; "nghịch lý của công việc" là tên gọi của site.
    review: sai
  - id: n29
    cau: 'Jackson & Marsh (1996): Flow State Scale 36 câu, chín thang bốn câu, tương ứng các chiều flow của Csikszentmihalyi; kiểm định trên 394 vận động viên.'
    loai: so-lieu
    nguon:
