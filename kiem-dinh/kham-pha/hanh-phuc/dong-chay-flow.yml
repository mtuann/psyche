  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Ý thức con người "kén" việc: quá khó thì hệ thần kinh báo động (lo âu), quá dễ thì nó buồn chán và đi lang thang. Chỉ khi thử thách và kỹ năng cùng cao và khớp nhau, toàn bộ nguồn lực chú ý mới có "việc đáng làm" và dồn hết vào đó. Đây là lời giải thích ở cấp độ *điều kiện*.". Chữ mới: "Theo mô hình, quá khó thì ta lo âu, quá dễ thì chán. Chỉ khi thử thách và kỹ năng cùng cao và khớp nhau thì flow mới được dự đoán. Đây là mô tả ở cấp độ *điều kiện*, không phải giải thích cơ chế: Swann và cộng sự (2018) nhận xét các điều kiện đủ để flow xảy ra vẫn chưa được biết.". Lý do: Chữ cũ nêu cơ chế ("hệ thần kinh báo động", "nguồn lực chú ý") không có nguồn; các tài liệu nói mô hình kênh là mô hình mô tả.'
