    cau: 'Ngộ nhận 2: tính đến 11/2026 mới thấy ít nghiên cứu về flow trong hoạt động có hại (rối loạn chơi game: Burleigh 2025; máy đánh bạc: Kruger 2022).'
    loai: thoi-su
    nguon:
      - burleigh2025
      - kruger2022
      - tim-flow-hai
    vi_tri: Europe PMC, 10/11/2026
    het_han: '2028-11-01'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Flow là một dạng trải nghiệm tối ưu, nhưng "cháy" liên tục không nghỉ vẫn dẫn đến kiệt sức. Hơn nữa, flow không phân biệt tốt–xấu về mặt đạo đức: người ta cũng có thể "chảy" trong game gây nghiện hay trong công việc ám ảnh đến mức bỏ bê gia đình.". Chữ mới: "Một phân tích tổng hợp (Sweeny và cộng sự, 2026) thấy flow liên hệ dương, ở mức vừa phải đến khá mạnh, với well-being, nên ý "càng nhiều flow càng hạnh phúc" có phần đúng ở mức tương quan; nhưng đó là tương quan, và chúng tôi chưa tìm thấy nghiên cứu nào xét giới hạn của việc ở trong flow liên tục h". Lý do: Chữ cũ ("cháy liên tục dẫn đến kiệt sức", "game gây nghiện", "bỏ bê gia đình") không có nguồn; viết lại theo tổng hợp Sweeny 2026. Lần tìm: chỉ đọc tóm tắt Sweeny 2026 (không nêu giới hạn); chưa có truy vấn riêng về "flow addiction"; chỉ ghi là chưa tìm thấy. Review (Claude Sonnet 5.5, 10/11/2026): sai. Lượt 2 đúng: có nghiên cứu flow ở game và cờ bạc (Burleigh 2025; Kruger 2022). Đã viết lại thành "tính đến 11/2026 mới thấy ít nghiên cứu như vậy", kèm lần tìm Europe PMC 10/11/2026; het_han giữ 2028-11-01.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://doi.org/10.3389/fpsyg.2020.00158", "https://doi.org/10.1016/j.abrep.2025.100606" ]
    luot_2_ghi_chu: 'câu đúng: Đã có nghiên cứu bàn flow liên tục hay rời rạc (Abuhamdeh 2020) và về flow ở hoạt động có hại như game rối loạn hay cờ bạc, nhưng bằng chứng còn ít.; Nói "chưa tìm thấy nghiên cứu" sai: có bài khái niệm về flow liên tục/rời rạc và nghiên cứu về flow ở hoạt động có hại (game rối loạn, cờ bạc). Tóm tắt Europe PMC 10/11/2026.'
    review: sai
  - id: n77
    cau: 'Ngộ nhận 3: theo Baumann (2012), Nakamura & Csikszentmihalyi (2002) mô tả các nét của nhân cách tự trị như "siêu kỹ năng", khi ấy liên hệ với tần suất flow hiếm được kiểm tra; từ đó phân tích tổng hợp thấy tận tâm liên hệ vừa phải với flow (r = 0,33); chưa nói được rèn luyện hay bẩm sinh.'
    loai: phat-hien
    nguon:
      - baumann2012
      - buseyne2026
    trich: has rarely been tested
    vi_tri: Baumann 2012, mục 9.1; Buseyne 2026, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Csikszentmihalyi mô tả nhân cách tự trị như một kỹ năng có thể rèn luyện — cách bạn đặt mục tiêu, phản ứng với khó khăn, tìm ý nghĩa trong việc tẻ nhạt — chứ không phải số phận.". Chữ mới: "Nakamura và Csikszentmihalyi (2002) mô tả các nét của nhân cách tự trị (tò mò, kiên trì, ít vị kỷ) như "siêu kỹ năng", nhưng mối liên hệ của chúng với tần suất flow hiếm được kiểm tra (Baumann, 2012), và tính cách tận tâm liên hệ vừa phải với flow (r = 0,33); nên chưa nói được flow là rèn luyện hay ". Lý do: Chữ cũ khẳng định "kỹ năng có thể rèn luyện" không có nguồn. Review (Claude Sonnet 5.5, 10/11/2026): sai. Lượt 2 đúng: "hiếm được kiểm tra" nói ở thì hiện tại là sai vì đã có phân tích tổng hợp Big Five–flow (Buseyne 2026). Đã viết "Theo Baumann (2012) … khi ấy hiếm được kiểm tra. Từ đó, một phân tích tổng hợp thấy tận tâm liên hệ vừa phải (r = 0,33), nhưng chưa nói được flow là rèn luyện hay bẩm sinh".'
    luot_2: qua-manh
    luot_2_nguon: [ "https://doi.org/10.1111/jopy.70004", "https://doi.org/10.1111/jopy.12938" ]
