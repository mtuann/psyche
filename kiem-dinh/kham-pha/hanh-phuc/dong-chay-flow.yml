  ly_do: 'Swann 2018: điều kiện đủ của flow chưa biết, can thiệp nhỏ và chưa kết luận, bằng chứng cho người thực hành "extremely limited".'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Nghịch lý: càng cố ép mình "phải vào flow", bạn càng tự ý thức về bản thân — đúng thứ giết chết flow (đặc điểm số 7). Cách đúng là lo phần mình kiểm soát được: mục tiêu rõ, độ khó vừa, môi trường ít xao nhãng — rồi để trạng thái tự đến. Flow là khách, không phải tù nhân.". Chữ mới: "Các điều kiện đủ để flow xảy ra vẫn chưa được biết, và bằng chứng cho người huấn luyện hay người thực hành áp dụng nguyên tắc flow còn "cực kỳ hạn chế" (Swann và cộng sự, 2018). Vì vậy hãy coi các gợi ý trên là thử nghiệm của cá nhân, không phải công thức.". Lý do: Chữ cũ ("càng cố ép mình càng tự ý thức, giết chết flow") không có nguồn nào kiểm tra; thay bằng nhận xét của Swann 2018. Chữ cũ: "### 4. Đừng "săn" flow, hãy dọn đường cho nó :nhan[vung-chac]". Chữ mới: "### 4. Chưa có cách chắc chắn để "gọi" flow :nhan[tranh-cai] { #4-dung-san-flow-hay-don-duong-cho-no-vung-chac }". Lý do: Tiêu đề cũ ("đừng săn flow") và nhãn vung-chac không có nguồn; giữ id cũ.'
