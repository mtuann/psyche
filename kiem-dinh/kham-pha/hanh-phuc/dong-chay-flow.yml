  ghi_chu: 'Chữ cũ: "Flow được mô tả như trạng thái ý thức "có trật tự" (ordered consciousness): khi 100% "băng thông" chú ý dồn vào việc đang làm, không còn chỗ cho những tiếng ồn nội tâm — tự phê phán, lo âu, ruminating. Mất tự ý thức và thời gian biến dạng là hệ quả tự nhiên của việc chú ý không còn dư ra để "soi" ch". Chữ mới: "Một cách giải thích về chú ý (chưa được kiểm chứng): khi chú ý dồn hết vào việc đang làm thì không còn chỗ cho những suy nghĩ tự phê phán hay lo âu, nên mất tự ý thức và thời gian biến dạng có thể là hệ quả. Swann và cộng sự (2018) nhận xét khung 9 đặc điểm mô tả chứ không giải thích; các giải thích". Lý do: Chữ cũ nêu "100% băng thông", "hệ quả tự nhiên" như điều đã biết; không có nguồn; bỏ cụm "ordered consciousness" (không kiểm được). Câu "khi chú ý dồn hết, không còn chỗ cho tự phê phán → mất tự ý thức" là giả thuyết của trang, đã ghi chưa kiểm chứng.'
- id: n55
  cau: 'Áp dụng (mở đầu): flow không gọi ra được theo ý muốn; bằng chứng về cách tạo flow rất hạn chế.'
  loai: phat-hien
  nguon:
  - swann2018
  trich: there is an extremely limited evidence base for coaches and practitioners to confidently apply principles based on flow in applied settings
  vi_tri: tr. 13–14
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Flow không phải thứ cứ muốn là gọi ra được. Nhưng ta có thể dọn đường cho nó bằng cách sắp xếp lại các điều kiện:". Chữ mới: "Flow không phải thứ cứ muốn là gọi ra được, và bằng chứng về cách tạo ra nó còn rất hạn chế (Swann và cộng sự, 2018). Các gợi ý dưới đây dựa trên các điều kiện được đề xuất, và mỗi gợi ý có nhãn bằng chứng:". Lý do: Thêm giới hạn theo Swann 2018 ("an extremely limited evidence base").'
- id: n56
  cau: 'Áp dụng 1 (nhãn Khá vững): học tập: chia nhỏ mục tiêu, tạo phản hồi tức thì.'
  loai: nhan
  nguon:
  - fong2015
  - xie2026
  - abuhamdeh2020
  nhan: kha-vung
  co_so:
  - fong2015
  - xie2026
  ly_do: 'Mục tiêu rõ và cảm giác kiểm soát cùng cân bằng thử thách–kỹ năng liên hệ với flow trong phân tích tổng hợp; phân tích tổng hợp về flow trong học tập cùng chiều nhưng phần lớn tương quan. Chưa có thử nghiệm chuẩn về cách chia mục tiêu cụ thể: Khá vững.'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Các nghiên cứu ESM trong lớp học cho thấy học sinh hứng thú nhất khi cảm nhận được cả ba: thử thách cao, kỹ năng đủ dùng, và quyền kiểm soát. Bài tập quá dễ → chán; bài quá khó mà không có gợi ý → lo âu và bỏ cuộc.". Chữ mới: "Mục tiêu rõ và phản hồi rõ là hai điều kiện được đề xuất của flow; phân tích tổng hợp thấy mục tiêu rõ và cảm giác kiểm soát cùng với cân bằng thử thách–kỹ năng đều liên hệ với flow (Fong và cộng sự, 2015), và một phân tích tổng hợp 108 nghiên cứu về flow trong học tập (Xie và cộng sự, 2026) thấy fl". Lý do: Chữ cũ dẫn "các nghiên cứu ESM trong lớp học" không có nguồn đã mở; "lo âu và bỏ cuộc" không có nguồn.'
- id: n57
  cau: 'Fong 2015: so với các điều kiện khác, cân bằng thử thách–kỹ năng là yếu tố đóng góp mạnh cho flow cùng với mục tiêu rõ và cảm giác kiểm soát.'
  loai: phat-hien
