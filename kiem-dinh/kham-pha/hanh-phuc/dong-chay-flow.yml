  - id: n66
    cau: 'Áp dụng 4 (nhãn Đang tranh cãi): chưa có cách chắc chắn để "gọi" flow; các điều kiện đủ chưa biết; bằng chứng cho người thực hành rất hạn chế.'
    loai: nhan
    nguon:
      - swann2018
    nhan: tranh-cai
    co_so:
      - swann2018
    ly_do: 'Swann 2018: điều kiện đủ của flow chưa biết, can thiệp nhỏ và chưa kết luận, bằng chứng cho người thực hành "extremely limited".'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nghịch lý: càng cố ép mình "phải vào flow", bạn càng tự ý thức về bản thân — đúng thứ giết chết flow (đặc điểm số 7). Cách đúng là lo phần mình kiểm soát được: mục tiêu rõ, độ khó vừa, môi trường ít xao nhãng — rồi để trạng thái tự đến. Flow là khách, không phải tù nhân.". Chữ mới: "Các điều kiện đủ để flow xảy ra vẫn chưa được biết, và bằng chứng cho người huấn luyện hay người thực hành áp dụng nguyên tắc flow còn "cực kỳ hạn chế" (Swann và cộng sự, 2018). Vì vậy hãy coi các gợi ý trên là thử nghiệm của cá nhân, không phải công thức.". Lý do: Chữ cũ ("càng cố ép mình càng tự ý thức, giết chết flow") không có nguồn nào kiểm tra; thay bằng nhận xét của Swann 2018. Chữ cũ: "### 4. Đừng "săn" flow, hãy dọn đường cho nó :nhan[vung-chac]". Chữ mới: "### 4. Chưa có cách chắc chắn để "gọi" flow :nhan[tranh-cai] { #4-dung-san-flow-hay-don-duong-cho-no-vung-chac }". Lý do: Tiêu đề cũ ("đừng săn flow") và nhãn vung-chac không có nguồn; giữ id cũ. Review (Claude Sonnet 5.5, 10/11/2026): dung. Đang tranh cãi hợp thước đo cho khẳng định "chưa có cách chắc chắn": Swann 2018 đã đọc toàn văn. Giữ id cũ.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/10413200.2018.1443525", "https://eprints.leedsbeckett.ac.uk/id/eprint/4768/1/AReviewofScientificProgressinFlowAM-PIGGOTT.pdf" ]
    luot_2_ghi_chu: Đọc toàn văn Swann 2018. Khớp.
    review: dung
  - id: n67
    cau: 'Việt Nam: Nguyen và cộng sự (2026) khảo sát 239 sinh viên đại học học tiếng Anh trực tuyến và phỏng vấn 12 người; flow nói chung cao (trung bình 3,77).'
    loai: thoi-su
    nguon:
      - nguyen2026
      - tim-vn-flow
    trich: A mixed-methods design was employed, including a survey conducted with 239 EFL university students and semi-structured interviews with 12 interviewees [...] students' overall level of Flow experience was high (M = 3.77)
    vi_tri: tóm tắt
    het_han: '2028-11-01'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "**Chúng tôi chưa tìm thấy nghiên cứu nào về flow (bằng ESM hay thang đo FSS) thực hiện trên người Việt.** Điều này có nghĩa là mọi lời khuyên "áp dụng flow" cho người Việt hiện tại đều dựa trên dữ liệu từ các nước khác — chủ yếu phương Tây, cộng thêm một số nước châu Á như Nhật Bản.". Chữ mới: "Tính đến 11/2026, chúng tôi tìm thấy một nghiên cứu về flow ở người Việt: Nguyen và cộng sự (2026), khảo sát 239 sinh viên đại học học tiếng Anh trực tuyến và phỏng vấn 12 người. Mức flow nói chung cao (trung bình 3,77); ba chiều nổi bật nhất là phản hồi tức thì, cân bằng thử thách–kỹ năng và mất tự". Lý do: Câu cũ "chưa tìm thấy nghiên cứu nào về flow trên người Việt" sai: có Nguyen 2026 (tìm 10/11/2026). Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp tóm tắt Nguyen và cộng sự 2026 (239 sinh viên, 12 phỏng vấn, trung bình 3,77; ba chiều nổi bật, chiều thấp nhất, cản trở).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1016/j.actpsy.2026.106580" ]
    luot_2_ghi_chu: Chỉ tóm tắt (Acta Psychologica 2026). Kiểm lại 10/11/2026.
    review: dung
