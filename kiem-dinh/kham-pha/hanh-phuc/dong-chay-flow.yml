    luot_2_ghi_chu: Đúng.
  - id: n16
    cau: Ba đặc điểm đầu thường được xem là điều kiện để flow xuất hiện; sáu đặc điểm còn lại mô tả trải nghiệm flow; autotelic có khi được coi là mô tả chung của flow.
    loai: dinh-nghia
    nguon:
      - swann2018
      - abuhamdeh2020
    trich: Three of these dimensions are proposed to be the conditions necessary for flow to occur [...] The remaining six dimensions are suggested to describe the characteristics of the flow experience
    vi_tri: 'Swann 2018, tr. 6 và chú thích 2; Abuhamdeh 2020: antecedents "clear goals, immediate feedback, and a balance of challenge and skill"'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một chi tiết tinh tế: tám đặc điểm đầu mô tả *trạng thái đang diễn ra*, còn đặc điểm thứ chín là *kết quả* — việc trở nên đáng làm vì chính nó là hệ quả của việc các điều kiện kia hội tụ.". Chữ mới: "Một chi tiết tinh tế: ba đặc điểm đầu (cân bằng thử thách–kỹ năng, mục tiêu rõ, phản hồi rõ) thường được xem là *điều kiện để flow xuất hiện*, còn sáu đặc điểm còn lại mô tả *trải nghiệm flow* (Nakamura và Csikszentmihalyi, 2002, theo Swann và cộng sự, 2018); trải nghiệm tự thân (autotelic) có khi đ". Lý do: Câu cũ ("tám đặc điểm đầu là trạng thái, đặc điểm thứ chín là kết quả") không khớp cách phân chia ba điều kiện / sáu đặc điểm trong tài liệu. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp Swann 2018 tr. 6 và Abuhamdeh 2020: ba điều kiện, sáu đặc điểm; trang cuối ghi rõ "(Nakamura và Csikszentmihalyi, 2002, theo Swann và cộng sự, 2018)".'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/10413200.2018.1443525" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n17
    cau: 'Mô hình kênh flow (góc phần tư): thử thách vượt xa kỹ năng gây lo âu, kỹ năng vượt xa thử thách gây chán, cả hai thấp gây thờ ơ; flow được dự đoán khi cả hai cao (cao hơn mức trung bình của chính người đó).'
    loai: dinh-nghia
    nguon:
      - abuhamdeh2020
      - swann2018
    trich: flow is operationalized as any observation in which both perceived challenge and perceived skill are both "high" (i.e., above the person's average)
    vi_tri: 'Abuhamdeh 2020, mục Issue 1 (Hình 2); Swann 2018: "models generally postulate how combinations of high and low challenge and skill can lead to outcomes such as boredom, anxiety, and flow"'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đi kèm với 9 đặc điểm là **mô hình kênh flow**: khi thử thách vượt xa kỹ năng, ta lo âu; khi kỹ năng vượt xa thử thách, ta chán; khi cả hai đều thấp, ta thờ ơ. Flow chỉ xuất hiện ở góc phần tư mà cả hai đều **cao và cân bằng** — cân bằng ở mức "việc dễ, mình cũng dở" thì không tạo ra flow, chỉ tạo r". Chữ mới: "Các nghiên cứu về flow thường đi kèm một mô hình mô tả, gọi là **mô hình kênh flow** (hay mô hình góc phần tư): khi thử thách vượt xa kỹ năng, ta lo âu; khi kỹ năng vượt xa thử thách, ta chán; khi cả hai đều thấp, ta thờ ơ. Mô hình dự đoán flow ở nơi cả hai đều **cao** (cao hơn mức trung bình của ch". Lý do: Câu cũ nêu mô hình như điều đã xảy ra ("flow chỉ xuất hiện"); các nguồn gọi đây là mô hình, và "cao" tính theo mức trung bình của từng người; "thờ ơ dễ chịu" không có nguồn. Mô hình này là mô tả, không giải thích (Swann 2018). Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp Abuhamdeh 2020 Issue 1 (cao hơn mức trung bình của chính người đó) và Swann 2018 (mô hình mô tả).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.3389/fpsyg.2020.00158" ]
    luot_2_ghi_chu: Đúng.
    review: dung
  - id: n18
    cau: 'Hình flow-channel (không có số): sơ đồ ước lệ ghi nhãn "Lo âu", "Chán nản", "Thờ ơ", "Dòng chảy (flow)" trên hai trục kỹ năng và thách thức.'
    loai: cong-cu
    nguon:
      - abuhamdeh2020
    trich: anxiety, apathy, boredom/relaxation
    vi_tri: mục Issue 1 (Hình 2)
    ket_qua: dung
    ghi_chu: 'Đã mở src/hinh/flow-channel.html: nhãn khớp mô hình kênh/góc phần tư; hình nói rõ là ước lệ không theo tỉ lệ số liệu. Hình vẽ kênh chéo (mô hình ba kênh, Csikszentmihalyi 1975, theo Abuhamdeh Bảng 1), còn mô hình góc phần tư tính theo trung bình của từng người; không sai về nhãn. Review (Claude Sonnet 5.5, 10/11/2026): dung. Sau khi sửa chữ hình (n19): nhãn Lo âu, Chán nản, Thờ ơ, Dòng chảy vẫn khớp mô hình; hình ghi là sơ đồ ước lệ không theo tỉ lệ số liệu.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.3389/fpsyg.2020.00158" ]
    luot_2_ghi_chu: "Không mở hình trên site (không được phép); chỉ xét nội dung mô tả: nhãn bốn góc đúng với mô hình."
    review: dung
  - id: n19
    cau: 'Hình flow-channel: chữ trong hình "Theo mô hình kênh flow, flow được dự đoán khi cả hai đều cao và cân bằng" và chú thích "Theo mô hình, dòng chảy được dự đoán khi cả hai đều cao và cân bằng; bằng chứng cho điều này chưa thống nhất".'
    loai: phat-hien
    nguon:
      - swann2018
      - abuhamdeh2020
      - lovoll2014
    trich: While there is support for challenge-skill balance as an important factor in flow (Fong et al., 2015), alone it is insufficient for these states to occur
    vi_tri: Swann 2018, tr. 14; Abuhamdeh 2020, mục Issue 1 (mô hình)
    ket_qua: da-sua
    ghi_chu: 'chỗ khó: hình phát biểu mô hình như điều chắc chắn; bằng chứng còn lẫn lộn (Fong 2015 vừa phải; Løvoll 2014 không thấy đỉnh ở cân bằng). Hình sai/quá mạnh thì ghi lại, không sửa: đề nghị người giao thêm "theo mô hình" vào hình và chú thích. Review (Claude Sonnet 5.5, 10/11/2026): sai. Lượt 2 đúng: hình viết "Flow chỉ xuất hiện khi cả hai đều cao và cân bằng" như điều chắc, trong khi cân bằng không đủ để flow xảy ra (Swann 2018) và Løvoll & Vittersø 2014 không thấy đỉnh ở cân bằng. Đã sửa src/hinh/flow-channel.html: chữ trong hình thành "Theo mô hình kênh flow, flow được dự đoán khi cả hai đều cao và cân bằng." và chú thích thành "Theo mô hình, dòng chảy được dự đoán khi cả hai đều cao và cân bằng; bằng chứng cho điều này chưa thống nhất."; thêm flow-channel vào HINH_DA_SUA của tests/chuyen.test.mjs.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://doi.org/10.1080/10413200.2018.1443525", "https://doi.org/10.3389/fpsyg.2020.00158" ]
    luot_2_ghi_chu: 'câu đúng: Theo mô hình kênh flow, flow được dự đoán khi cả thử thách và kỹ năng cao và cân bằng; đây là điều kiện đề xuất, không đủ để flow xảy ra.; "Flow chỉ xuất hiện khi cả hai đều cao và cân bằng" nói như điều kiện cần và đủ; thực ra đó là điều kiện đề xuất, không đủ. Chỉ xét câu chữ nêu trong danh sách, không xem hình.'
    review: sai
