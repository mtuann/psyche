  - id: n33
    cau: 'Khung Khá vững: 9 đặc điểm của flow được dùng để mô tả flow ở nhiều lĩnh vực, nhưng không đều giữa các đặc điểm.'
    loai: nhan
    nguon:
      - jackson1996
      - swann2018
      - abuhamdeh2020
    nhan: kha-vung
    co_so:
      - jackson1996
      - swann2018
      - abuhamdeh2020
    ly_do: Phỏng vấn vận động viên ưu tú và phân tích nhân tố khẳng định (394 vận động viên) ủng hộ chín chiều, nhưng không đều giữa các chiều (dưới 30% vận động viên ưu tú nêu mất tự ý thức và biến dạng thời gian), có chồng lấn giữa các chiều, thiếu cảm giác cơ thể (Swann 2018), chưa có cách đo thống nhất (Abuhamdeh 2020), chưa có phân tích tổng hợp riêng về cấu trúc chín chiều hay tái lập có đăng ký trước. Khá vững theo thước đo (không đạt Vững chắc).
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Từ các cuộc phỏng vấn những năm 1970 (leo núi, khiêu vũ, cờ vua, phẫu thuật) đến các nghiên cứu ESM và các thang đo như FSS sau này, cùng một cụm đặc điểm lặp lại: mục tiêu rõ, phản hồi tức thì, tập trung sâu, mất tự ý thức, thời gian biến dạng. Đây là phần vững nhất của lý thuyết.". Chữ mới: "Từ các cuộc phỏng vấn (leo núi, cờ vua, nghệ sĩ; vận động viên ưu tú) đến thang đo FSS (phân tích nhân tố khẳng định ủng hộ chín thang ở 394 vận động viên), cùng một cụm đặc điểm được dùng để mô tả flow. Nhưng không đều: trong một tổng quan hệ thống về vận động viên ưu tú (Swann và cộng sự, 2012), d". Lý do: Đổi tên khung từ vung-chac sang kha-vung: chữ cũ khẳng định "nhất quán qua nhiều lĩnh vực" và nhắc ESM (các nghiên cứu ESM 1977, 1989 không kiểm 9 đặc điểm); các nguồn thấy ủng hộ nhưng không đều giữa các đặc điểm, có chồng lấn và chưa có tổng hợp hay tái lập. Chữ cũ: ":::vung-chac[9 đặc điểm của flow xuất hiện nhất quán qua nhiều lĩnh vực]". Chữ mới: ":::kha-vung[9 đặc điểm của flow được dùng để mô tả flow ở nhiều lĩnh vực, nhưng không đều giữa các đặc điểm]". Lý do: Hạ nhãn (xem khung bên dưới). Review (Claude Sonnet 5.5, 10/11/2026): dung. Khá vững hợp thước đo mục 4: nhiều nghiên cứu cùng chiều (phỏng vấn, CFA 394 vận động viên) nhưng không đều (dưới 30%, chồng lấn, chưa có cách đo thống nhất), chưa có tổng hợp hay tái lập. Giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/10413200.2018.1443525", "https://doi.org/10.1123/jsep.18.1.17" ]
    luot_2_ghi_chu: Nhãn Khá vững không cao hơn thước đo; chín chiều dùng trong nhiều lĩnh vực nhưng hỗ trợ không đều.
