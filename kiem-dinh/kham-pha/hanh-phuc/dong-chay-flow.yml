doi_chu:
  - cu: Flow là một cấu hình ý thức rất cụ thể, với những đặc điểm có thể mô tả, đo lường và tái hiện qua nghiên cứu. Bài này sẽ "mổ xẻ" nó.
    moi: Flow là một cấu hình ý thức rất cụ thể, với những đặc điểm được mô tả và đo lường trong nhiều nghiên cứu (dù cách đo chưa thống nhất). Bài này sẽ "mổ xẻ" nó.
    ly_do: '"Tái hiện" không có nguồn; Abuhamdeh (2020): chưa có cách đo được thống nhất.'
  - cu: 'Từ những năm 1970, Csikszentmihalyi phỏng vấn hàng trăm người ở những lĩnh vực rất khác nhau — vận động viên leo núi, vũ công, kỳ thủ cờ vua, bác sĩ phẫu thuật, nhà soạn nhạc — và hỏi họ về những khoảnh khắc "mọi thứ vào guồng" nhất. Dù công việc khác nhau một trời một vực, mô tả của họ trùng khớp đến ngạc nhiên. Trong cuốn *Flow: The Psychology of Optimal Experience* (1990), ông tổng hợp thành **9 đặc điểm**:'
    moi: 'Từ giữa những năm 1970 (Csikszentmihalyi, 1975), Csikszentmihalyi hỏi hàng trăm người leo núi, kỳ thủ cờ vua, nghệ sĩ... mô tả những khoảnh khắc tốt nhất của họ, và từ đó đưa ra khái niệm flow. Các nhà nghiên cứu về sau nhận xét mô tả khá nhất quán giữa các hoạt động (dù có phê bình, xem phần Mức độ chắc chắn). Trong cuốn *Flow: The Psychology of Optimal Experience* (1990), ông tổng hợp thành **9 đặc điểm** (theo cách trình bày của Swann và cộng sự, 2018, vì chưa mở được sách):'
    ly_do: 'Danh sách vũ công, bác sĩ phẫu thuật, nhà soạn nhạc và "trùng khớp đến ngạc nhiên" không có nguồn đã mở (Abuhamdeh 2020: "hundreds of rock climbers, chess players, artists, etc.").'
  - cu: Lúc thì ba tiếng trôi như ba mươi phút, lúc thì một giây như kéo dài vô tận (vận động viên thường mô tả dạng thứ hai).
    moi: Lúc thì ba tiếng trôi như ba mươi phút, lúc thì một giây như kéo dài vô tận, hoặc thời gian trở nên không còn quan trọng.
    ly_do: 'Câu về vận động viên không có nguồn; Swann 2018: thời gian có thể nhanh lên, chậm đi hay không còn quan trọng.'
  - cu: 'Một chi tiết tinh tế: tám đặc điểm đầu mô tả *trạng thái đang diễn ra*, còn đặc điểm thứ chín là *kết quả* — việc trở nên đáng làm vì chính nó là hệ quả của việc các điều kiện kia hội tụ.'
    moi: 'Một chi tiết tinh tế: ba đặc điểm đầu (cân bằng thử thách–kỹ năng, mục tiêu rõ, phản hồi rõ) thường được xem là *điều kiện để flow xuất hiện*, còn sáu đặc điểm còn lại mô tả *trải nghiệm flow* (Nakamura và Csikszentmihalyi, 2002, theo Swann và cộng sự, 2018); trải nghiệm tự thân (autotelic) có khi được coi là mô tả chung của flow chứ không phải một đặc điểm riêng.'
    ly_do: Câu cũ ("tám đặc điểm đầu là trạng thái, đặc điểm thứ chín là kết quả") không khớp cách phân chia ba điều kiện / sáu đặc điểm trong tài liệu.
  - cu: 'Đi kèm với 9 đặc điểm là **mô hình kênh flow**: khi thử thách vượt xa kỹ năng, ta lo âu; khi kỹ năng vượt xa thử thách, ta chán; khi cả hai đều thấp, ta thờ ơ. Flow chỉ xuất hiện ở góc phần tư mà cả hai đều **cao và cân bằng** — cân bằng ở mức "việc dễ, mình cũng dở" thì không tạo ra flow, chỉ tạo ra sự thờ ơ dễ chịu.'
    moi: 'Các nghiên cứu về flow thường đi kèm một mô hình mô tả, gọi là **mô hình kênh flow** (hay mô hình góc phần tư): khi thử thách vượt xa kỹ năng, ta lo âu; khi kỹ năng vượt xa thử thách, ta chán; khi cả hai đều thấp, ta thờ ơ. Mô hình dự đoán flow ở nơi cả hai đều **cao** (cao hơn mức trung bình của chính người đó) và cân bằng — "việc dễ, mình cũng dở" thì chỉ cho sự thờ ơ. Đây là mô hình mô tả, không giải thích vì sao.'
    ly_do: Câu cũ nêu mô hình như điều đã xảy ra ("flow chỉ xuất hiện"); các nguồn gọi đây là mô hình, và "cao" tính theo mức trung bình của từng người; "thờ ơ dễ chịu" không có nguồn.
  - cu: ESM sau này trở thành công cụ chủ lực của mọi nghiên cứu về flow
    moi: ESM sau này được dùng trong nhiều nghiên cứu về flow
    ly_do: '"Mọi nghiên cứu" quá mạnh; Abuhamdeh 2020 chỉ nói một số nghiên cứu dùng ESM.'
  - cu: '### Csikszentmihalyi và LeFevre (1989): flow ở công sở nhiều hơn ở nhà'
    moi: '### Csikszentmihalyi và LeFevre (1989): phần lớn trải nghiệm flow được báo cáo khi làm việc { #csikszentmihalyi-va-lefevre-1989-flow-o-cong-so-nhieu-hon-o-nha }'
    ly_do: Tiêu đề cũ ngụ ý flow xảy ra thường hơn ở công sở so với ở nhà; tóm tắt chỉ nói đa số trải nghiệm flow được báo cáo khi làm việc. Giữ id cũ.
  - cu: Tuy nhiên, dù trải nghiệm lúc rảnh kém "chất" hơn, người ta vẫn thấy *có động lực hơn* trong thời gian rảnh — một nghịch lý mà Csikszentmihalyi gọi là "nghịch lý của công việc"
    moi: Tuy nhiên, người ta vẫn thấy *có động lực hơn* trong thời gian rảnh so với khi làm việc — một nghịch lý mà Csikszentmihalyi và LeFevre gọi là "nghịch lý của công việc" (tên gọi theo cách kể lại; chưa mở toàn văn)
    ly_do: '"Trải nghiệm lúc rảnh kém chất hơn" không có trong tóm tắt (tóm tắt nói "regardless of the quality of experience").'
  - cu: xây dựng **Flow State Scale (FSS)** — thang đo 36 câu tương ứng với 9 đặc điểm của flow — và kiểm định trên vận động viên.
    moi: xây dựng **Flow State Scale (FSS)** — thang đo 36 câu (mỗi đặc điểm bốn câu) tương ứng với 9 đặc điểm của flow — và kiểm định trên 394 vận động viên.
    ly_do: Thêm cỡ mẫu theo tóm tắt.
  - cu: FSS (và phiên bản cải tiến FSS-2 của Jackson và Eklund, 2002) trở thành công cụ chuẩn để đo flow, đặc biệt trong tâm lý học thể thao. Thang đo đã được dịch và kiểm định ở nhiều nước — ví dụ trên người trưởng thành Nhật Bản (Kawabata, Mallett và Jackson, 2008) — cho thấy cấu trúc 9 chiều giữ được ở ngoài phương Tây
    moi: Phân tích nhân tố khẳng định ủng hộ chín thang và một mô hình có thứ bậc với một nhân tố flow chung. FSS (và phiên bản cải tiến FSS-2 của Jackson và Eklund, 2002) được dùng rộng rãi để đo flow, đặc biệt trong tâm lý học thể thao, dù các nghiên cứu về flow chưa thống nhất cách đo. Đã có nghiên cứu kiểm tra FSS-2 và DFS-2 ở người trưởng thành Nhật Bản (Kawabata, Mallett và Jackson, 2008); chúng tôi chưa đọc được kết quả của nghiên cứu ấy
    ly_do: '"Công cụ chuẩn" và "cấu trúc 9 chiều giữ được ở ngoài phương Tây" không kiểm được (chỉ đọc được tên bài Kawabata); Abuhamdeh 2020: chưa có cách đo thống nhất. Kết quả CFA theo tóm tắt Jackson & Marsh 1996.'
  - cu: 'Từ các cuộc phỏng vấn những năm 1970 (leo núi, khiêu vũ, cờ vua, phẫu thuật) đến các nghiên cứu ESM và các thang đo như FSS sau này, cùng một cụm đặc điểm lặp lại: mục tiêu rõ, phản hồi tức thì, tập trung sâu, mất tự ý thức, thời gian biến dạng. Đây là phần vững nhất của lý thuyết.'
    moi: 'Từ các cuộc phỏng vấn (leo núi, cờ vua, nghệ sĩ; vận động viên ưu tú) đến thang đo FSS (phân tích nhân tố khẳng định ủng hộ chín thang ở 394 vận động viên), cùng một cụm đặc điểm được dùng để mô tả flow. Nhưng không đều: trong một tổng quan hệ thống về vận động viên ưu tú (Swann và cộng sự, 2012), dưới 30% vận động viên nêu mất tự ý thức và biến dạng thời gian; Swann và cộng sự (2018) chỉ ra các đặc điểm chồng lấn nhau và thiếu cảm giác cơ thể; và chưa có cách đo flow được thống nhất (Abuhamdeh, 2020). Đây là phần vững nhất của lý thuyết, nhưng chưa tới mức vững chắc.'
    ly_do: 'Đổi tên khung từ vung-chac sang kha-vung: chữ cũ khẳng định "nhất quán qua nhiều lĩnh vực" và nhắc ESM (các nghiên cứu ESM 1977, 1989 không kiểm 9 đặc điểm); các nguồn thấy ủng hộ nhưng không đều giữa các đặc điểm, có chồng lấn và chưa có tổng hợp hay tái lập.'
  - cu: :::vung-chac[9 đặc điểm của flow xuất hiện nhất quán qua nhiều lĩnh vực]
    moi: :::kha-vung[9 đặc điểm của flow được dùng để mô tả flow ở nhiều lĩnh vực, nhưng không đều giữa các đặc điểm]
    ly_do: Hạ nhãn (xem khung bên dưới).
  - cu: 'Bằng chứng ESM ủng hộ mô hình kênh flow. Tuy nhiên, "cân bằng" một mình chưa đủ: Løvoll và Vittersø (2014) chỉ ra rằng cân bằng ở mức thấp chỉ tạo ra thờ ơ, và một số người vẫn báo cáo trải nghiệm tích cực khi thử thách hơi vượt kỹ năng ([Løvoll và Vittersø, 2014](https://doi.org/10.1007/s11205-012-0211-9)). Nói cách khác, công thức "thử thách = kỹ năng" là gần đúng, không phải định luật.'
    moi: Một phân tích tổng hợp 28 nghiên cứu (Fong và cộng sự, 2015) thấy cân bằng thử thách–kỹ năng liên hệ ở mức vừa phải với flow, và yếu hơn trong các nghiên cứu dùng ESM, ở môi trường làm việc hay giáo dục, và ở người thuộc nền văn hóa cá nhân chủ nghĩa. Ngược lại, Løvoll và Vittersø (2014), trong hai nghiên cứu ở sinh viên thể thao và hoạt động ngoài trời, không thấy chỉ báo flow nào đạt đỉnh khi thử thách cân bằng với kỹ năng, mà ủng hộ một mô hình *mất cân bằng* ([Løvoll và Vittersø, 2014](https://doi.org/10.1007/s11205-012-0211-9)). Nói cách khác, công thức "thử thách = kỹ năng" là gần đúng, không phải định luật; Swann và cộng sự (2018) cũng nhận xét cân bằng một mình không đủ để flow xảy ra.
    ly_do: 'Chữ cũ nói Løvoll & Vittersø chỉ ra "cân bằng ở mức thấp chỉ tạo ra thờ ơ" và "thử thách hơi vượt kỹ năng" tích cực: tóm tắt nói không có chỉ báo flow nào đạt đỉnh ở cân bằng và ủng hộ mô hình mất cân bằng. "Bằng chứng ESM ủng hộ" cũng chưa đúng: phân tích tổng hợp thấy tương quan yếu hơn ở nghiên cứu ESM.'
  - cu: Các lần kiểm định thang đo ở châu Á (ví dụ Nhật Bản) cho cấu trúc tương tự phương Tây, nhưng số nghiên cứu ngoài phương Tây còn ít. Đáng chú ý, đặc điểm "mất tự ý thức" có thể được trải nghiệm khác nhau giữa văn hóa đề cao cái tôi cá nhân và văn hóa đề cao hòa hợp tập thể — và đây mới chỉ là giả thuyết cần kiểm chứng.
    moi: 'Bằng chứng về tính phổ quát chưa thống nhất: phân tích tổng hợp về cân bằng thử thách–kỹ năng thấy tương quan yếu hơn ở nền văn hóa cá nhân chủ nghĩa (Fong và cộng sự, 2015); phân tích tổng hợp 108 nghiên cứu về flow trong học tập thấy bối cảnh văn hóa không làm đổi độ lớn các liên hệ (Xie và cộng sự, 2026); còn phân tích tổng hợp về tính cách và flow thấy văn hóa điều chỉnh một số liên hệ (Buseyne và cộng sự, 2026). Đã có nghiên cứu kiểm tra FSS-2 ở người trưởng thành Nhật (Kawabata và cộng sự, 2008). Việc đặc điểm "mất tự ý thức" được trải nghiệm khác nhau giữa văn hóa đề cao cái tôi cá nhân và văn hóa đề cao hòa hợp tập thể mới chỉ là giả thuyết cần kiểm chứng.'
    ly_do: Chữ cũ nói các kiểm định ở châu Á "cho cấu trúc tương tự" mà chưa đọc được kết quả; thêm ba phân tích tổng hợp về văn hóa.
  - cu: 'Nghe thì hợp lý — "vào zone" thì phải đá hay hơn chứ? Nhưng tổng quan của Swann và cộng sự (2018) về flow trong thể thao cho thấy mối liên hệ giữa flow và thành tích thực tế **không nhất quán** như người ta tưởng: có nghiên cứu thấy liên quan, có nghiên cứu không ([Swann và cộng sự, 2018](https://doi.org/10.1080/10413200.2018.1443525)). Flow là một trải nghiệm chủ quan dễ chịu, không phải công tắc bật/tắt của thành tích.'
    moi: 'Nghe thì hợp lý — "vào zone" thì phải đá hay hơn chứ? Một phân tích tổng hợp 22 nghiên cứu về thể thao và trò chơi (Harris và cộng sự, 2021) thấy mối liên hệ trung bình và nhất quán giữa flow và thành tích (r = 0,31; khoảng tin cậy 95%: 0,24–0,38). Nhưng đây là tương quan: các cơ chế được đề xuất chưa có bằng chứng thuyết phục, nên chưa xác định được flow làm tăng thành tích, hay thành tích tốt làm dễ vào flow. Flow là một trải nghiệm chủ quan dễ chịu, không phải công tắc bật/tắt của thành tích.'
    ly_do: 'Chữ cũ (khung "Đã bị bác bỏ") sai: Swann 2018 không nói liên hệ flow–thành tích không nhất quán; phân tích tổng hợp Harris 2021 thấy liên hệ nhất quán, vừa phải. Hạ từ bac-bo sang kha-vung và viết lại.'
  - cu: :::bac-bo[cứ vào flow là hiệu suất tăng]
    moi: :::kha-vung[flow đi cùng thành tích tốt hơn, nhưng chưa rõ nhân quả]
    ly_do: Đổi tên khung theo kết quả trên.
  - cu: 'Ý thức con người "kén" việc: quá khó thì hệ thần kinh báo động (lo âu), quá dễ thì nó buồn chán và đi lang thang. Chỉ khi thử thách và kỹ năng cùng cao và khớp nhau, toàn bộ nguồn lực chú ý mới có "việc đáng làm" và dồn hết vào đó. Đây là lời giải thích ở cấp độ *điều kiện*.'
    moi: 'Theo mô hình, quá khó thì ta lo âu, quá dễ thì chán. Chỉ khi thử thách và kỹ năng cùng cao và khớp nhau thì flow mới được dự đoán. Đây là mô tả ở cấp độ *điều kiện*, không phải giải thích cơ chế: Swann và cộng sự (2018) nhận xét các điều kiện đủ để flow xảy ra vẫn chưa được biết.'
    ly_do: Chữ cũ nêu cơ chế ("hệ thần kinh báo động", "nguồn lực chú ý") không có nguồn; các tài liệu nói mô hình kênh là mô hình mô tả.
  - cu: 'Csikszentmihalyi nhận thấy một số người dễ "tự tạo" flow hơn hẳn người khác: họ tò mò, thích đặt mục tiêu nội tại, kiên trì trước khó khăn, và ít phụ thuộc vào phần thưởng bên ngoài. Điểm quan trọng: ông mô tả đây là một *kỹ năng có thể rèn*, không phải năng khiếu bẩm sinh — bạn có thể học cách tìm ra thử thách trong cả những việc tẻ nhạt.'
    moi: 'Csikszentmihalyi đề xuất khái niệm nhân cách tự trị: xu hướng chủ động tìm thử thách và trải nghiệm flow. Nakamura và Csikszentmihalyi (2002) mô tả các nét cốt lõi là tò mò và hứng thú với đời sống, kiên trì, và ít vị kỷ, gọi chúng là "siêu kỹ năng" (metaskills). Khái niệm này giàu ý nhưng chưa có cách đo thỏa đáng, và mối liên hệ của các nét ấy với tần suất flow hiếm được kiểm tra (Baumann, 2012). Một phân tích tổng hợp mới thấy tính cách tận tâm liên hệ vừa phải với flow (r = 0,33; Buseyne và cộng sự, 2026). Chúng tôi chưa đọc được bằng chứng cho thấy nhân cách tự trị rèn luyện được.'
    ly_do: 'Chữ cũ khẳng định ông "mô tả là kỹ năng có thể rèn" và "bạn có thể học cách tìm ra thử thách": nguồn đọc được chỉ nói "metaskills" và không có bằng chứng về rèn luyện.'
  - cu: 'Flow được mô tả như trạng thái ý thức "có trật tự" (ordered consciousness): khi 100% "băng thông" chú ý dồn vào việc đang làm, không còn chỗ cho những tiếng ồn nội tâm — tự phê phán, lo âu, ruminating. Mất tự ý thức và thời gian biến dạng là hệ quả tự nhiên của việc chú ý không còn dư ra để "soi" chính mình hay đếm giờ.'
    moi: 'Một cách giải thích về chú ý (chưa được kiểm chứng): khi chú ý dồn hết vào việc đang làm thì không còn chỗ cho những suy nghĩ tự phê phán hay lo âu, nên mất tự ý thức và thời gian biến dạng có thể là hệ quả. Swann và cộng sự (2018) nhận xét khung 9 đặc điểm mô tả chứ không giải thích; các giải thích thần kinh như "giảm hoạt động vùng trán thoáng qua" (Dietrich, 2004) là giả thuyết về nguyên nhân gần.'
    ly_do: Chữ cũ nêu "100% băng thông", "hệ quả tự nhiên" như điều đã biết; không có nguồn; bỏ cụm "ordered consciousness" (không kiểm được).
  - cu: 'Flow không phải thứ cứ muốn là gọi ra được. Nhưng ta có thể dọn đường cho nó bằng cách sắp xếp lại các điều kiện:'
    moi: 'Flow không phải thứ cứ muốn là gọi ra được, và bằng chứng về cách tạo ra nó còn rất hạn chế (Swann và cộng sự, 2018). Các gợi ý dưới đây dựa trên các điều kiện được đề xuất, và mỗi gợi ý có nhãn bằng chứng:'
    ly_do: Thêm giới hạn theo Swann 2018 ("an extremely limited evidence base").
  - cu: 'Các nghiên cứu ESM trong lớp học cho thấy học sinh hứng thú nhất khi cảm nhận được cả ba: thử thách cao, kỹ năng đủ dùng, và quyền kiểm soát. Bài tập quá dễ → chán; bài quá khó mà không có gợi ý → lo âu và bỏ cuộc.'
    moi: Mục tiêu rõ và phản hồi rõ là hai điều kiện được đề xuất của flow; phân tích tổng hợp thấy mục tiêu rõ và cảm giác kiểm soát cùng với cân bằng thử thách–kỹ năng đều liên hệ với flow (Fong và cộng sự, 2015), và một phân tích tổng hợp 108 nghiên cứu về flow trong học tập (Xie và cộng sự, 2026) thấy flow liên hệ dương với nhiệm vụ học phù hợp, môi trường hỗ trợ và thành tích học tập, nhưng phần lớn là nghiên cứu tương quan. Theo mô hình, bài quá dễ thì chán, bài quá khó thì lo âu.
    ly_do: Chữ cũ dẫn "các nghiên cứu ESM trong lớp học" không có nguồn đã mở; "lo âu và bỏ cuộc" không có nguồn.
  - cu: Flow cần sự tập trung không bị ngắt quãng — mỗi lần check điện thoại là một lần "rơi" khỏi dòng chảy. Hãy xếp những việc đòi hỏi tư duy sâu vào một khung giờ liền mạch, tắt thông báo. Đồng thời, nếu một nhiệm vụ quá dễ đến mức buồn ngủ, hãy tự nâng độ khó lên (đặt deadline ngắn hơn, thêm tiêu chí chất lượng); nếu quá khó đến mức tê liệt, hãy chia nhỏ ra. Bạn đang "lái" mình vào kênh flow.
    moi: 'Tập trung sâu là một đặc điểm của flow; chúng tôi chưa tìm thấy thử nghiệm kiểm tra riêng việc tắt thông báo làm tăng flow. Một cách thử là xếp những việc đòi hỏi tư duy sâu vào một khung giờ liền mạch. Việc chỉnh độ khó (nâng lên nếu quá dễ, chia nhỏ nếu quá khó) dựa vào mô hình kênh flow, nhưng bằng chứng thực nghiệm còn mâu thuẫn: một thử nghiệm đặt mục tiêu khó dần để gây flow (Harris và cộng sự, 2017) và một thử nghiệm khác (Schweickle và cộng sự, 2017) cho kết quả ngược lại (theo Swann và cộng sự, 2018).'
    ly_do: Chữ cũ ("mỗi lần check điện thoại là một lần rơi khỏi dòng chảy", "bạn đang lái mình vào kênh flow") không có nguồn; các thử nghiệm gây flow bằng chỉnh độ khó cho kết quả trái ngược. Hạ nhãn từ kha-vung xuống tranh-cai (xem tiêu đề).
  - cu: '### 2. Công việc: bảo vệ "khung giờ sâu", điều chỉnh độ khó :nhan[kha-vung]'
    moi: '### 2. Công việc: bảo vệ "khung giờ sâu", điều chỉnh độ khó :nhan[tranh-cai] { #2-cong-viec-bao-ve-khung-gio-sau-dieu-chinh-do-kho-kha-vung }'
    ly_do: Đổi nhãn kha-vung thành tranh-cai; giữ id cũ.
  - cu: Lý do game được thiết kế độ khó tăng dần, hay người chơi cầu lông thích gặp đối thủ "ngang cơ", chính là trực giác về kênh flow. Khi chọn hoạt động giải trí, hãy ưu tiên những thứ có độ khó vừa tầm và phản hồi rõ ràng (điểm số, thời gian, tiến bộ đo được) thay vì những thứ chỉ gây kích thích thụ động như lướt video ngắn.
    moi: 'Game thường có độ khó tăng dần và người chơi cầu lông thường thích gặp đối thủ "ngang cơ": đó có thể là trực giác tương tự mô hình kênh flow (suy luận, chưa có nghiên cứu nào được đọc để kiểm tra). Khi chọn hoạt động giải trí, bạn có thể thử những thứ có độ khó vừa tầm và phản hồi rõ ràng (điểm số, thời gian, tiến bộ đo được); chúng tôi chưa thấy nghiên cứu so sánh với việc lướt video ngắn, và cân bằng thử thách–kỹ năng không phải lúc nào cũng cho flow cao nhất (Løvoll và Vittersø, 2014).'
    ly_do: Chữ cũ khẳng định "chính là trực giác về kênh flow" và so sánh với lướt video ngắn mà không có nguồn.
  - cu: '### 3. Thể thao và sở thích: tìm "điểm ngọt" của độ khó :nhan[kha-vung]'
    moi: '### 3. Thể thao và sở thích: tìm "điểm ngọt" của độ khó :nhan[tranh-cai] { #3-the-thao-va-so-thich-tim-diem-ngot-cua-do-kho-kha-vung }'
    ly_do: Đổi nhãn kha-vung thành tranh-cai; giữ id cũ.
  - cu: '### 4. Đừng "săn" flow, hãy dọn đường cho nó :nhan[vung-chac]'
    moi: '### 4. Chưa có cách chắc chắn để "gọi" flow :nhan[tranh-cai] { #4-dung-san-flow-hay-don-duong-cho-no-vung-chac }'
    ly_do: Tiêu đề cũ ("đừng săn flow") và nhãn vung-chac không có nguồn; giữ id cũ.
  - cu: 'Nghịch lý: càng cố ép mình "phải vào flow", bạn càng tự ý thức về bản thân — đúng thứ giết chết flow (đặc điểm số 7). Cách đúng là lo phần mình kiểm soát được: mục tiêu rõ, độ khó vừa, môi trường ít xao nhãng — rồi để trạng thái tự đến. Flow là khách, không phải tù nhân.'
    moi: Các điều kiện đủ để flow xảy ra vẫn chưa được biết, và bằng chứng cho người huấn luyện hay người thực hành áp dụng nguyên tắc flow còn "cực kỳ hạn chế" (Swann và cộng sự, 2018). Vì vậy hãy coi các gợi ý trên là thử nghiệm của cá nhân, không phải công thức.
    ly_do: Chữ cũ ("càng cố ép mình càng tự ý thức, giết chết flow") không có nguồn nào kiểm tra; thay bằng nhận xét của Swann 2018.
  - cu: '**Chúng tôi chưa tìm thấy nghiên cứu nào về flow (bằng ESM hay thang đo FSS) thực hiện trên người Việt.** Điều này có nghĩa là mọi lời khuyên "áp dụng flow" cho người Việt hiện tại đều dựa trên dữ liệu từ các nước khác — chủ yếu phương Tây, cộng thêm một số nước châu Á như Nhật Bản.'
    moi: 'Tính đến 11/2026, chúng tôi tìm thấy một nghiên cứu về flow ở người Việt: Nguyen và cộng sự (2026), khảo sát 239 sinh viên đại học học tiếng Anh trực tuyến và phỏng vấn 12 người. Mức flow nói chung cao (trung bình 3,77); ba chiều nổi bật nhất là phản hồi tức thì, cân bằng thử thách–kỹ năng và mất tự ý thức, thấp nhất là tập trung cao độ; sinh viên nêu cản trở như khó giữ tập trung, kỳ vọng tự học và chuẩn mực văn hóa. **Chúng tôi chưa tìm thấy** nghiên cứu về flow ở người Việt bằng ESM, và chưa rõ nghiên cứu trên dùng thang đo nào (chỉ đọc được tóm tắt). Điều này có nghĩa là các lời khuyên "áp dụng flow" cho người Việt hiện nay hầu như dựa trên dữ liệu từ các nước khác — chủ yếu phương Tây, cộng thêm một số nước châu Á như Nhật Bản.'
    ly_do: 'Câu cũ "chưa tìm thấy nghiên cứu nào về flow trên người Việt" sai: có Nguyen 2026 (tìm 10/11/2026).'
  - cu: Ở văn hóa Việt Nam đề cao hòa hợp tập thể, trải nghiệm này có thể mang sắc thái khác — nhưng đây mới chỉ là suy đoán, cần nghiên cứu thực nghiệm.
    moi: Ở văn hóa Việt Nam đề cao hòa hợp tập thể, trải nghiệm này có thể mang sắc thái khác — nhưng đây mới chỉ là suy đoán, và trong nghiên cứu Việt Nam nêu trên mất tự ý thức nằm trong ba chiều nổi bật nhất, nên dữ liệu ấy không ủng hộ suy đoán.
    ly_do: Thêm dữ liệu Nguyen 2026.
  - cu: 'Tóm lại: lý thuyết hứa hẹn, nhưng bản đồ dữ liệu Việt Nam còn trống.'
    moi: 'Tóm lại: lý thuyết hứa hẹn, nhưng bản đồ dữ liệu Việt Nam còn rất thưa (tính đến 11/2026).'
    ly_do: Có một nghiên cứu (Nguyen 2026); thêm mốc.
  - cu: 'Flow là một dạng trải nghiệm tối ưu, nhưng "cháy" liên tục không nghỉ vẫn dẫn đến kiệt sức. Hơn nữa, flow không phân biệt tốt–xấu về mặt đạo đức: người ta cũng có thể "chảy" trong game gây nghiện hay trong công việc ám ảnh đến mức bỏ bê gia đình.'
    moi: Một phân tích tổng hợp (Sweeny và cộng sự, 2026) thấy flow liên hệ dương, ở mức vừa phải đến khá mạnh, với well-being, nên ý "càng nhiều flow càng hạnh phúc" có phần đúng ở mức tương quan; nhưng đó là tương quan, và chúng tôi chưa tìm thấy nghiên cứu nào xét giới hạn của việc ở trong flow liên tục hay flow trong các hoạt động có hại.
    ly_do: Chữ cũ ("cháy liên tục dẫn đến kiệt sức", "game gây nghiện", "bỏ bê gia đình") không có nguồn; viết lại theo tổng hợp Sweeny 2026.
  - cu: '- **"Càng nhiều flow càng hạnh phúc, nên cứ ''cháy'' hết mình."**'
    moi: '- **"Càng nhiều flow càng hạnh phúc, nên cứ ''cháy'' hết mình."** Đúng một phần:'
    ly_do: Đổi câu mở theo nội dung mới.
  - cu: Csikszentmihalyi mô tả nhân cách tự trị như một kỹ năng có thể rèn luyện — cách bạn đặt mục tiêu, phản ứng với khó khăn, tìm ý nghĩa trong việc tẻ nhạt — chứ không phải số phận.
    moi: Nakamura và Csikszentmihalyi (2002) mô tả các nét của nhân cách tự trị (tò mò, kiên trì, ít vị kỷ) như "siêu kỹ năng", nhưng mối liên hệ của chúng với tần suất flow hiếm được kiểm tra (Baumann, 2012), và tính cách tận tâm liên hệ vừa phải với flow (r = 0,33); nên chưa nói được flow là rèn luyện hay bẩm sinh.
    ly_do: Chữ cũ khẳng định "kỹ năng có thể rèn luyện" không có nguồn.
  - cu: '> "Thích" là cảm xúc; flow là một cấu hình ý thức với 9 đặc điểm có thể mô tả và kiểm chứng qua nghiên cứu.'
    moi: '> "Thích" là cảm xúc; flow là một cấu hình ý thức với 9 đặc điểm được mô tả và đo trong nhiều nghiên cứu (dù cách đo chưa thống nhất).'
    ly_do: Khớp sửa ở đầu trang.
  - cu: '> Lo âu xảy ra khi thử thách vượt xa kỹ năng; chán nản khi kỹ năng vượt xa thử thách; thờ ơ khi cả hai đều thấp. Flow đòi hỏi cả hai đều cao và cân bằng.'
    moi: '> Theo mô hình kênh flow, lo âu xảy ra khi thử thách vượt xa kỹ năng; chán nản khi kỹ năng vượt xa thử thách; thờ ơ khi cả hai đều thấp. Flow được dự đoán khi cả hai đều cao và cân bằng.'
    ly_do: Nêu rõ là mô hình.
  - cu: '> Nghiên cứu theo dõi 78 người lao động suốt một tuần bằng ESM cho thấy chất lượng trải nghiệm chịu ảnh hưởng của flow mạnh hơn là của bối cảnh làm việc/giải trí — và flow thì hay xuất hiện ở công sở hơn ở nhà.'
    moi: '> Nghiên cứu theo dõi 78 người lao động suốt một tuần bằng ESM cho thấy chất lượng trải nghiệm chịu ảnh hưởng của flow mạnh hơn là của bối cảnh làm việc/giải trí — và phần lớn các trải nghiệm flow được báo cáo khi đang làm việc.'
    ly_do: Khớp tóm tắt (không nói "ở nhà").
  - cu: + Vì cân bằng ở mức thấp chỉ tạo ra thờ ơ; cần cả hai đều cao, cộng thêm các điều kiện khác như mục tiêu rõ và phản hồi tức thì.
    moi: + Vì các nghiên cứu cho thấy cân bằng chỉ liên hệ vừa phải với flow; theo mô hình, cân bằng ở mức thấp chỉ tạo ra thờ ơ, và còn các điều kiện khác như mục tiêu rõ và phản hồi tức thì.
    ly_do: Khớp sửa ở khung Khá vững.
  - cu: '> Løvoll và Vittersø (2014) chỉ ra "cân bằng" không phải lúc nào cũng tốt — cân bằng giữa việc dễ và năng lực thấp thì chán, không phải flow. Công thức đầy đủ là: cao + cân bằng + mục tiêu + phản hồi.'
    moi: '> Phân tích tổng hợp thấy cân bằng thử thách–kỹ năng liên hệ vừa phải với flow (Fong và cộng sự, 2015), còn Løvoll và Vittersø (2014) không thấy flow đạt đỉnh khi cân bằng. Theo mô hình, cân bằng giữa việc dễ và năng lực thấp thì chỉ thờ ơ; các điều kiện khác được đề xuất là mục tiêu rõ và phản hồi tức thì.'
    ly_do: Bỏ "công thức đầy đủ" (không kiểm được); khớp Løvoll 2014.
