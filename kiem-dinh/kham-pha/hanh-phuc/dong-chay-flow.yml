  - id: n72
    cau: 'Việt Nam: "nghịch lý của công việc" (đa số trải nghiệm flow được báo cáo khi làm việc, nhưng động lực cao hơn lúc rảnh) có thể không giống nhau ở nền kinh tế có ranh giới công việc–cuộc sống khác; suy đoán.'
    loai: loi-khuyen
    nguon:
      - csik1989
    trich: respondents are more motivated in leisure than in work
    vi_tri: tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Suy đoán đã ghi rõ trong trang ("có thể"); nguồn chỉ cho kết quả phương Tây. Chữ "flow nhiều ở công sở" nên hiểu là "đa số trải nghiệm flow được báo cáo khi làm việc". Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ "flow nhiều ở công sở" mạnh hơn tóm tắt (đa số trải nghiệm flow được báo cáo khi làm việc). Đã sửa thành "đa số trải nghiệm flow được báo cáo khi làm việc, nhưng động lực cao hơn lúc rảnh"; vẫn là suy đoán đã ghi rõ.'
