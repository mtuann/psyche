  - id: n49
    cau: 'Lý thuyết 1: mô hình kênh flow là điều kiện xuất hiện; quá khó thì lo âu, quá dễ thì chán; điều kiện đủ vẫn chưa biết.'
    loai: phat-hien
    nguon:
      - swann2018
    trich: the sufficient conditions of flow remain unknown
    vi_tri: tr. 13
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Ý thức con người "kén" việc: quá khó thì hệ thần kinh báo động (lo âu), quá dễ thì nó buồn chán và đi lang thang. Chỉ khi thử thách và kỹ năng cùng cao và khớp nhau, toàn bộ nguồn lực chú ý mới có "việc đáng làm" và dồn hết vào đó. Đây là lời giải thích ở cấp độ *điều kiện*.". Chữ mới: "Theo mô hình, quá khó thì ta lo âu, quá dễ thì chán. Chỉ khi thử thách và kỹ năng cùng cao và khớp nhau thì flow mới được dự đoán. Đây là mô tả ở cấp độ *điều kiện*, không phải giải thích cơ chế: Swann và cộng sự (2018) nhận xét các điều kiện đủ để flow xảy ra vẫn chưa được biết.". Lý do: Chữ cũ nêu cơ chế ("hệ thần kinh báo động", "nguồn lực chú ý") không có nguồn; các tài liệu nói mô hình kênh là mô hình mô tả. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp Swann 2018 (điều kiện đủ chưa biết); trang không còn nêu cơ chế thần kinh như điều chắc.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/10413200.2018.1443525", "https://eprints.leedsbeckett.ac.uk/id/eprint/4768/1/AReviewofScientificProgressinFlowAM-PIGGOTT.pdf" ]
    luot_2_ghi_chu: Đúng.
    review: dung
  - id: n50
    cau: 'Lý thuyết 2: Csikszentmihalyi đề xuất nhân cách tự trị: xu hướng chủ động tìm thử thách và trải nghiệm flow.'
    loai: lich-su
    nguon:
      - baumann2012
    trich: Csikszentmihalyi has introduced the concept of an autotelic personality, that is, a disposition to actively seek challenges and flow experiences.
    vi_tri: tóm tắt chương
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Csikszentmihalyi nhận thấy một số người dễ "tự tạo" flow hơn hẳn người khác: họ tò mò, thích đặt mục tiêu nội tại, kiên trì trước khó khăn, và ít phụ thuộc vào phần thưởng bên ngoài. Điểm quan trọng: ông mô tả đây là một *kỹ năng có thể rèn*, không phải năng khiếu bẩm sinh — bạn có thể học cách tìm ". Chữ mới: "Csikszentmihalyi đề xuất khái niệm nhân cách tự trị: xu hướng chủ động tìm thử thách và trải nghiệm flow. Nakamura và Csikszentmihalyi (2002) mô tả các nét cốt lõi là tò mò và hứng thú với đời sống, kiên trì, và ít vị kỷ, gọi chúng là "siêu kỹ năng" (metaskills). Khái niệm này giàu ý nhưng chưa có c". Lý do: Chữ cũ khẳng định ông "mô tả là kỹ năng có thể rèn" và "bạn có thể học cách tìm ra thử thách": nguồn đọc được chỉ nói "metaskills" và không có bằng chứng về rèn luyện. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp tóm tắt chương Baumann 2012 (nhân cách tự trị là khuynh hướng chủ động tìm thử thách và flow).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/jopy.12938" ]
    luot_2_ghi_chu: Khái niệm do Csikszentmihalyi đề xuất; xác nhận qua mô tả trong bài 2025; không mở được nguồn gốc.
    review: dung
  - id: n51
    cau: 'Lý thuyết 2: theo Baumann (2012), Nakamura & Csikszentmihalyi (2002) mô tả các nét cốt lõi là tò mò và hứng thú với đời sống, kiên trì, ít vị kỷ, gọi là "siêu kỹ năng".'
    loai: lich-su
    nguon:
      - baumann2012
    trich: Nakamura and Csikszentmihalyi (2002) describe similar core characteristics of autotelic personalities (i.e., curiosity and interest in life, persistence, and low self-centeredness) as metaskills.
    vi_tri: mục 9.1
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Csikszentmihalyi nhận thấy một số người dễ "tự tạo" flow hơn hẳn người khác: họ tò mò, thích đặt mục tiêu nội tại, kiên trì trước khó khăn, và ít phụ thuộc vào phần thưởng bên ngoài. Điểm quan trọng: ông mô tả đây là một *kỹ năng có thể rèn*, không phải năng khiếu bẩm sinh — bạn có thể học cách tìm ". Chữ mới: "Csikszentmihalyi đề xuất khái niệm nhân cách tự trị: xu hướng chủ động tìm thử thách và trải nghiệm flow. Nakamura và Csikszentmihalyi (2002) mô tả các nét cốt lõi là tò mò và hứng thú với đời sống, kiên trì, và ít vị kỷ, gọi chúng là "siêu kỹ năng" (metaskills). Khái niệm này giàu ý nhưng chưa có c". Lý do: Chữ cũ khẳng định ông "mô tả là kỹ năng có thể rèn" và "bạn có thể học cách tìm ra thử thách": nguồn đọc được chỉ nói "metaskills" và không có bằng chứng về rèn luyện. Review (Claude Sonnet 5.5, 10/11/2026): sai. Lượt 2 không chắc: không mở được Nakamura & Csikszentmihalyi 2002; câu chỉ có ở đoạn Baumann 2012 tóm lại. Đã viết "Theo Baumann (2012), Nakamura và Csikszentmihalyi (2002) mô tả …" (cả mục Lý thuyết và Ngộ nhận), đúng chuẩn nguồn bậc 2 kể lại.'
    luot_2: khong-chac
    luot_2_ghi_chu: Nakamura & Csikszentmihalyi (2002, Handbook of Positive Psychology) chỉ mở được phần tóm tắt/mục lục trên Springer; không đọc được đoạn nêu các nét (tò mò, kiên trì, ít vị kỷ) hay cụm "siêu kỹ năng".
    review: sai
  - id: n52
    cau: 'Lý thuyết 2: theo Baumann (2012), khi ấy khái niệm chưa có cách đo thỏa đáng và liên hệ các nét với tần suất flow hiếm được kiểm tra; từ đó đã có phân tích tổng hợp 24 nghiên cứu về Big Five và flow (Buseyne 2026: tận tâm r = 0,33).'
    loai: phat-hien
    nguon:
      - baumann2012
      - buseyne2026
