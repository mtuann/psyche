    ghi_chu: 'Giữ nguyên chữ; ngụ ý "theo mô hình" đã nêu ở phần trên. Review (Claude Sonnet 5.5, 10/11/2026): sai. Câu hồ sơ ghi "theo mô hình" nhưng trang viết "flow đòi hỏi thử thách cao, ngang ngửa" như điều chắc, mâu thuẫn khung n38. Đã thêm "theo mô hình kênh flow".'
