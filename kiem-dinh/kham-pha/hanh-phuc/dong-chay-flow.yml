nhan_dinh:
  - id: n1
    cau: Csikszentmihalyi gọi trạng thái hòa nhập hoàn toàn với việc đang làm là flow (trạng thái dòng chảy).
    loai: lich-su
    nguon:
      - abuhamdeh2020
    trich: Based on this research, Csikszentmihalyi developed the concept of "flow."
    vi_tri: Summary and Conclusion
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.3389/fpsyg.2020.00158" ]
    luot_2_ghi_chu: Đọc toàn văn Abuhamdeh 2020 (PMC).
  - id: n2
    cau: Flow là một cấu hình ý thức với những đặc điểm được mô tả và đo lường trong nhiều nghiên cứu, dù cách đo chưa thống nhất.
    loai: phat-hien
    nguon:
      - abuhamdeh2020
    trich: a consensual operationalization of flow has yet to be established
    vi_tri: Summary and Conclusion
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Flow là một cấu hình ý thức rất cụ thể, với những đặc điểm có thể mô tả, đo lường và tái hiện qua nghiên cứu. Bài này sẽ "mổ xẻ" nó.". Chữ mới: "Flow là một cấu hình ý thức rất cụ thể, với những đặc điểm được mô tả và đo lường trong nhiều nghiên cứu (dù cách đo chưa thống nhất). Bài này sẽ "mổ xẻ" nó.". Lý do: "Tái hiện" không có nguồn; Abuhamdeh (2020): chưa có cách đo được thống nhất. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp Abuhamdeh 2020 (chưa có cách vận hành thống nhất); câu đã làm mềm đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/10413200.2018.1443525", "https://doi.org/10.3389/fpsyg.2020.00158" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n3
    cau: Từ giữa những năm 1970 Csikszentmihalyi hỏi hàng trăm người leo núi, kỳ thủ cờ vua, nghệ sĩ... mô tả những khoảnh khắc tốt nhất; từ đó có khái niệm flow.
    loai: lich-su
    nguon:
      - abuhamdeh2020
    trich: he asked hundreds of rock climbers, chess players, artists, etc. to describe what their best moments felt like
    vi_tri: Summary and Conclusion
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Từ những năm 1970, Csikszentmihalyi phỏng vấn hàng trăm người ở những lĩnh vực rất khác nhau — vận động viên leo núi, vũ công, kỳ thủ cờ vua, bác sĩ phẫu thuật, nhà soạn nhạc — và hỏi họ về những khoảnh khắc "mọi thứ vào guồng" nhất. Dù công việc khác nhau một trời một vực, mô tả của họ trùng khớp đ". Chữ mới: "Từ giữa những năm 1970 (Csikszentmihalyi, 1975), Csikszentmihalyi hỏi hàng trăm người leo núi, kỳ thủ cờ vua, nghệ sĩ... mô tả những khoảnh khắc tốt nhất của họ, và từ đó đưa ra khái niệm flow. Các nhà nghiên cứu về sau nhận xét mô tả khá nhất quán giữa các hoạt động (dù có phê bình, xem phần Mức độ". Lý do: Danh sách vũ công, bác sĩ phẫu thuật, nhà soạn nhạc và "trùng khớp đến ngạc nhiên" không có nguồn đã mở (Abuhamdeh 2020: "hundreds of rock climbers, chess players, artists, etc."). Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp Abuhamdeh 2020 ("hundreds of rock climbers, chess players, artists, etc."); "giữa những năm 1970" suy từ mốc 1975.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.3389/fpsyg.2020.00158" ]
    luot_2_ghi_chu: '"Giữa những năm 1970" suy từ mốc 1975 của bài.'
    review: dung
  - id: n4
    cau: 'Csikszentmihalyi (1975): khái niệm flow xuất hiện lần đầu trong Beyond Boredom and Anxiety (1975).'
    loai: lich-su
    nguon:
      - abuhamdeh2020
    trich: Almost 50 years ago, Csikszentmihalyi (1975) began a program of research with the aim of understanding the common experiential characteristics of so-called "optimal experiences"
    vi_tri: Summary and Conclusion
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Từ những năm 1970, Csikszentmihalyi phỏng vấn hàng trăm người ở những lĩnh vực rất khác nhau — vận động viên leo núi, vũ công, kỳ thủ cờ vua, bác sĩ phẫu thuật, nhà soạn nhạc — và hỏi họ về những khoảnh khắc "mọi thứ vào guồng" nhất. Dù công việc khác nhau một trời một vực, mô tả của họ trùng khớp đ". Chữ mới: "Từ giữa những năm 1970 (Csikszentmihalyi, 1975), Csikszentmihalyi hỏi hàng trăm người leo núi, kỳ thủ cờ vua, nghệ sĩ... mô tả những khoảnh khắc tốt nhất của họ, và từ đó đưa ra khái niệm flow. Các nhà nghiên cứu về sau nhận xét mô tả khá nhất quán giữa các hoạt động (dù có phê bình, xem phần Mức độ". Lý do: Danh sách vũ công, bác sĩ phẫu thuật, nhà soạn nhạc và "trùng khớp đến ngạc nhiên" không có nguồn đã mở (Abuhamdeh 2020: "hundreds of rock climbers, chess players, artists, etc."). Năm 1975 theo Abuhamdeh/Swann; sách 1975 chưa mở được. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp Abuhamdeh/Swann (Csikszentmihalyi 1975, Beyond Boredom and Anxiety).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.3389/fpsyg.2020.00158" ]
    luot_2_ghi_chu: Đúng.
    review: dung
  - id: n5
    cau: Các nhà nghiên cứu về sau nhận xét mô tả flow khá nhất quán giữa các hoạt động, dù có phê bình.
    loai: phat-hien
    nguon:
      - swann2018
    trich: '"remarkable consistency has been found in the described flow experiences of individuals across diverse settings" (Jackson & Eklund, 2004, p.3)'
    vi_tri: tr. 5–6, mục Normal Science
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Từ những năm 1970, Csikszentmihalyi phỏng vấn hàng trăm người ở những lĩnh vực rất khác nhau — vận động viên leo núi, vũ công, kỳ thủ cờ vua, bác sĩ phẫu thuật, nhà soạn nhạc — và hỏi họ về những khoảnh khắc "mọi thứ vào guồng" nhất. Dù công việc khác nhau một trời một vực, mô tả của họ trùng khớp đ". Chữ mới: "Từ giữa những năm 1970 (Csikszentmihalyi, 1975), Csikszentmihalyi hỏi hàng trăm người leo núi, kỳ thủ cờ vua, nghệ sĩ... mô tả những khoảnh khắc tốt nhất của họ, và từ đó đưa ra khái niệm flow. Các nhà nghiên cứu về sau nhận xét mô tả khá nhất quán giữa các hoạt động (dù có phê bình, xem phần Mức độ". Lý do: Danh sách vũ công, bác sĩ phẫu thuật, nhà soạn nhạc và "trùng khớp đến ngạc nhiên" không có nguồn đã mở (Abuhamdeh 2020: "hundreds of rock climbers, chess players, artists, etc."). Chữ cũ "trùng khớp đến ngạc nhiên" là lời của chính các tác giả ủng hộ (Jackson & Eklund 2004), không phải kết luận khách quan; xem phê bình ở các khung nhãn. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp Swann 2018 (Jackson & Eklund 2004: "remarkable consistency ... across diverse settings"); câu đã nêu có phê bình.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/10413200.2018.1443525" ]
    luot_2_ghi_chu: Đúng cả hai vế.
    review: dung
  - id: n6
    cau: 'Cuốn Flow: The Psychology of Optimal Experience (1990) tổng hợp 9 đặc điểm của flow.'
    loai: lich-su
    nguon:
      - swann2018
    trich: how do athletes' experiences of flow compare with the theoretical descriptions of flow put forward by Csikszentmihalyi (1990)?
    vi_tri: tr. 6 (trích Jackson 1996)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Từ những năm 1970, Csikszentmihalyi phỏng vấn hàng trăm người ở những lĩnh vực rất khác nhau — vận động viên leo núi, vũ công, kỳ thủ cờ vua, bác sĩ phẫu thuật, nhà soạn nhạc — và hỏi họ về những khoảnh khắc "mọi thứ vào guồng" nhất. Dù công việc khác nhau một trời một vực, mô tả của họ trùng khớp đ". Chữ mới: "Từ giữa những năm 1970 (Csikszentmihalyi, 1975), Csikszentmihalyi hỏi hàng trăm người leo núi, kỳ thủ cờ vua, nghệ sĩ... mô tả những khoảnh khắc tốt nhất của họ, và từ đó đưa ra khái niệm flow. Các nhà nghiên cứu về sau nhận xét mô tả khá nhất quán giữa các hoạt động (dù có phê bình, xem phần Mức độ". Lý do: Danh sách vũ công, bác sĩ phẫu thuật, nhà soạn nhạc và "trùng khớp đến ngạc nhiên" không có nguồn đã mở (Abuhamdeh 2020: "hundreds of rock climbers, chess players, artists, etc."). Sách 1990 chưa mở được; Swann 2018 trình bày chín chiều là cách hiểu phổ biến ("commonly understood in terms of nine dimensions"), dẫn Jackson & Csikszentmihalyi 1999, Nakamura & Csikszentmihalyi 2002. Review (Claude Sonnet 5.5, 10/11/2026): dung. Chữ trang nói rõ chín đặc điểm theo cách trình bày của Swann 2018 vì chưa mở được sách; đúng nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1123/jsep.18.1.17", "https://doi.org/10.1080/10413200.2018.1443525" ]
    luot_2_ghi_chu: Không mở được toàn văn cuốn sách; xác nhận gián tiếp qua hai bài, nhất quán với kiến thức chuẩn (chín yếu tố ở chương 3 sách 1990).
    review: dung
