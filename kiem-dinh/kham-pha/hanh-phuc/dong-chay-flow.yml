  - id: n63
    cau: 'Áp dụng 3 (nhãn Đang tranh cãi): thể thao và sở thích: tìm "điểm ngọt" của độ khó.'
    loai: nhan
    nguon:
      - lovoll2014
      - swann2018
    nhan: tranh-cai
    co_so:
      - lovoll2014
      - swann2018
      - fong2015
    ly_do: Cân bằng thử thách–kỹ năng liên hệ vừa phải (Fong) nhưng không cho đỉnh flow ở nghiên cứu Løvoll; thử nghiệm gây flow mâu thuẫn.
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Lý do game được thiết kế độ khó tăng dần, hay người chơi cầu lông thích gặp đối thủ "ngang cơ", chính là trực giác về kênh flow. Khi chọn hoạt động giải trí, hãy ưu tiên những thứ có độ khó vừa tầm và phản hồi rõ ràng (điểm số, thời gian, tiến bộ đo được) thay vì những thứ chỉ gây kích thích thụ độn". Chữ mới: "Game thường có độ khó tăng dần và người chơi cầu lông thường thích gặp đối thủ "ngang cơ": đó có thể là trực giác tương tự mô hình kênh flow (suy luận, chưa có nghiên cứu nào được đọc để kiểm tra). Khi chọn hoạt động giải trí, bạn có thể thử những thứ có độ khó vừa tầm và phản hồi rõ ràng (điểm số, ". Lý do: Chữ cũ khẳng định "chính là trực giác về kênh flow" và so sánh với lướt video ngắn mà không có nguồn. Chữ cũ: "### 3. Thể thao và sở thích: tìm "điểm ngọt" của độ khó :nhan[kha-vung]". Chữ mới: "### 3. Thể thao và sở thích: tìm "điểm ngọt" của độ khó :nhan[tranh-cai] { #3-the-thao-va-so-thich-tim-diem-ngot-cua-do-kho-kha-vung }". Lý do: Đổi nhãn kha-vung thành tranh-cai; giữ id cũ. Review (Claude Sonnet 5.5, 10/11/2026): dung. Đang tranh cãi hợp: Fong vừa phải nhưng Løvoll không đỉnh ở cân bằng, thử nghiệm gây flow mâu thuẫn; trang nói rõ suy luận. Giữ id cũ.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1007/s11205-012-0211-9", "https://doi.org/10.1080/17439760.2014.967799" ]
    luot_2_ghi_chu: Bằng chứng mâu thuẫn nên nhãn Đang tranh cãi hợp lý.
    review: dung
