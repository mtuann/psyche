    cau: 'Tiêu đề mục: phần lớn trải nghiệm flow được báo cáo khi làm việc (id cũ giữ).'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "### Csikszentmihalyi và LeFevre (1989): flow ở công sở nhiều hơn ở nhà". Chữ mới: "### Csikszentmihalyi và LeFevre (1989): phần lớn trải nghiệm flow được báo cáo khi làm việc { #csikszentmihalyi-va-lefevre-1989-flow-o-cong-so-nhieu-hon-o-nha }". Lý do: Tiêu đề cũ ngụ ý flow xảy ra thường hơn ở công sở so với ở nhà; tóm tắt chỉ nói đa số trải nghiệm flow được báo cáo khi làm việc. Giữ id cũ. Đã kiểm id cũ trong tiêu đề ({ #csikszentmihalyi-va-lefevre-1989-flow-o-cong-so-nhieu-hon-o-nha }). Review (Claude Sonnet 5.5, 10/11/2026): dung. Id cũ giữ đúng: tính lại bằng slugCu và đối chiếu bản build cũ (.cache/site-cu) thấy id csikszentmihalyi-va-lefevre-1989-flow-o-cong-so-nhieu-hon-o-nha; tiêu đề mới khớp câu.'
