    trich: correlational analyses showed that the four MBTI indices did measure aspects of four of the five major dimensions of normal personality.
    vi_tri: 'McCrae & Costa 1989, tóm tắt và Table 3 (E–I −.74/−.69; S–N .72/.69; T–F .44/.46; J–P −.49/−.46 theo nam/nữ) [bản Internet Archive: mccrae1989 PDF tr. 1]'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "trùng lắp". Nay "tương quan", vì Table 3 là hệ số tương quan, các hệ số trung bình .7 và .4–.5. Review (Claude Sonnet 5.5, 10/11/2026): dung. McCrae & Costa 1989 (PDF tr. 14–15): tương quan MBTI EI–NEO E và SN–Openness "around .7"; TF–Agreeableness và JP–Conscientiousness "substantial" (Table 3: .44/.46 và −.49/−.46). Chữ "tương quan" (không "trùng lắp") đúng.'
    review: dung
  - id: n17
    cau: Tác giả kết luận lý thuyết của Jung hoặc sai hoặc chưa được MBTI hiện thực hóa đầy đủ, và không thể làm nền tảng vững chắc để diễn giải bài test.
    loai: phat-hien
    nguon:
      - mccrae1989
    trich: The data suggest that Jung's theory is either incorrect or inadequately operationalized by the MBTI and cannot provide a sound basis for interpreting it.
    vi_tri: McCrae & Costa 1989, tóm tắt
    ket_qua: dung
    ghi_chu: 'Review (Claude Sonnet 5.5, 10/11/2026): dung. McCrae & Costa 1989 tóm tắt: "Jung''s theory is either incorrect or inadequately operationalized by the MBTI and cannot provide a sound basis for interpreting it". Khớp.'
    review: dung
  - id: n18
    cau: 'Hội đồng Nghiên cứu Quốc gia Hoa Kỳ (1991): chưa có đủ nghiên cứu được thiết kế tốt để biện minh cho việc dùng MBTI trong chương trình tư vấn nghề nghiệp; nhiều bằng chứng dựa trên phương pháp chưa đầy đủ.'
    loai: phat-hien
    nguon:
      - nrc1991
    trich: At this time there is not sufficient, well-designed research to justify the use of the Myers-Briggs Type Indicator (MBTI) in career counseling programs. Much of the current evidence is based on inadequate methodologies.
    vi_tri: NRC 1991, phần kết luận (nap.edu/read/1580/chapter/4), mục The Myers-Briggs Type Indicator
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: hội đồng "xem xét toàn bộ bằng chứng" và "các tuyên bố về giá trị của bài test đã đi xa hơn bằng chứng". Hai ý này không có trong nguồn nên đã bỏ; chữ mới bám nguyên văn. Tác giả sách: Druckman & Bjork là chủ biên (Pittenger 2005 viết "Bjork & Druckman"): giữ theo trang nap.edu "National Research Council 1991". Review (Claude Sonnet 5.5, 10/11/2026): dung. Đã mở NRC 1991, phần kết luận (nap.edu/read/1580/chapter/4) và chương 5: "At this time there is not sufficient, well-designed research to justify the use of the MBTI in career counseling programs. Much of the current evidence is based on inadequate methodologies." Chữ mới bám nguyên văn.'
    review: dung
  - id: n19
    cau: 'Barrick và Mount (1991): tận tâm có quan hệ nhất quán với hiệu quả công việc ở cả 5 nhóm nghề và cả 3 loại tiêu chí, ρ khoảng .20–.23.'
    loai: so-lieu
    nguon:
      - barrick1991
    trich: Conscientiousness showed consistent relations with all job performance criteria for all occupational groups.
    vi_tri: 'Barrick & Mount 1991, tóm tắt; mục Results ("remarkably consistent across the five occupational groups (ρ ranges from .20 to .23)") [bản Internet Archive: barrick1991 PDF tr. 1]'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: ρ = .22–.23. Nguồn: ρ từ .20 đến .23 ở cả hai bảng theo nhóm nghề và theo tiêu chí. Review (Claude Sonnet 5.5, 10/11/2026): dung. Barrick & Mount 1991 (PDF tr. 13): "remarkably consistent across the five occupational groups (ρ ranges from .20 to .23)"; theo loại tiêu chí cũng .20–.23. Khớp.'
    review: dung
  - id: n20
    cau: Ở các chiều còn lại hệ số phần lớn không quá .10, trừ hướng ngoại ở quản lý và bán hàng (.18, .15) và hướng ngoại, cởi mở với hiệu quả đào tạo (.26, .25).
    loai: so-lieu
    nguon:
      - barrick1991
    trich: Other personality dimensions were also found to be valid predictors for some occupations and some criterion types, but the magnitude of the estimated true score correlations was small (ρ < .10).
    vi_tri: Barrick & Mount 1991, tóm tắt; mục Results
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Các chiều còn lại phần lớn dưới .10" (bỏ sót các ngoại lệ). Chữ mới nêu ngoại lệ. Review (Claude Sonnet 5.5, 10/11/2026): dung. Barrick & Mount 1991 (PDF tr. 14): hướng ngoại ở quản lý và bán hàng (.18, .15 theo lượt 2 đọc bảng), hướng ngoại .26 và cởi mở .25 với hiệu quả đào tạo, các hệ số còn lại "relatively small (i.e., ρ = .10 or less)". Khớp.'
    review: dung
  - id: n21
    cau: Các hệ số không lớn, nhưng nhất quán ở 5 nhóm nghề; chưa có bằng chứng dự báo tương đương cho các loại MBTI trong các tổng quan đã mở.
    loai: phat-hien
    nguon:
      - barrick1991
      - nrc1991
      - pittenger2005
    trich: Overall, the results illustrate the benefits of using the 5-factor model of personality to accumulate and communicate empirical findings.
    vi_tri: 'Barrick & Mount 1991, tóm tắt; NRC 1991; Pittenger 2005 (chưa thấy bằng chứng tương đương) [bản Internet Archive: barrick1991 PDF tr. 1]'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "nhất quán và đã được tái lập... không có bằng chứng dự báo nào ở tầm tương đương". Bỏ "đã được tái lập" (nguồn là một phân tích tổng hợp, không phải tái lập) và làm mềm thành "chưa thấy bằng chứng... trong các tổng quan đã mở". Review (Claude Sonnet 5.5, 10/11/2026): dung. Barrick & Mount 1991 cho Big Five; NRC 1991 và Pittenger 1993 (tr. 18: "no convincing evidence ... that knowledge of type is a reliable or valid predictor of important behavioral conditions") cho MBTI. Câu đã giới hạn "trong các tổng quan đã mở" nên không khẳng định thiếu bằng chứng tuyệt đối.'
    review: dung
  - id: n22
    cau: 'Bác bỏ: con người thuộc về một trong 16 "loại tính cách" rời rạc.'
    loai: nhan
    nhan: bac-bo
    co_so:
      - mccrae1989
      - pittenger2005
      - pittenger1993
      - haslam2012
    ly_do: 'McCrae & Costa 1989 (468 người, tự đánh giá và người quen) không thấy ủng hộ cho loại khác biệt về chất; Pittenger 2005 dẫn các nghiên cứu độc lập thấy phân bố liên tục, không hai cụm (Harvey & Murry 1994; Hicks 1984; McCrae & Costa 1989; Stricker & Ross 1962; Bess & Harvey 2002); Haslam, Holland & Kuppens 2012 (tổng quan định lượng 177 bài taxometric, 533.377 người): ở lĩnh vực tính cách bình thường "little persuasive evidence of taxa". Khớp thẻ ngộ nhận mbti (bac-bo).'
    nguon:
      - mccrae1989
      - pittenger2005
      - pittenger1993
      - haslam2012
    ket_qua: da-lam-mem
    ghi_chu: 'Chỗ khó: mục 4 muốn tái lập hay tổng hợp lớn; ở đây là một chuỗi nghiên cứu độc lập và tổng quan. Lượt 2 xem có nên là Khá vững. Chữ cũ: "Tuyên bố ... đã bị bác bỏ" giữ; bỏ "không tìm thấy bằng chứng nào" thành "không tìm thấy ủng hộ". Review (Claude Sonnet 5.5, 10/11/2026): dung. Ghi chú lượt 1 ("xem có nên là Khá vững") đã giải quyết: Europe PMC cho tóm tắt Haslam 2012, một tổng quan định lượng lớn thêm vào các kiểm tra riêng cho MBTI; nhiều kiểm tra độc lập cùng thất bại ở bằng chứng cho loại rời rạc nên Đã bị bác bỏ khớp thước đo mục 4 (cho khẳng định "16 loại rời rạc là có thật", không phải cho việc MBTI vô giá trị). Đã thêm câu Haslam vào khung trên trang; chỉ đọc tóm tắt nên chỉ dùng cho điều tóm tắt nói.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1467-6494.1989.tb00759.x", "https://www.discprofiling.co.nz/i/ComparisonReferencePapers/Cautionary_comments_regarding_the_Myers_Briggs_Typ.pdf" ]
    luot_2_ghi_chu: "Nhãn Đã bị bác bỏ khớp thước đo: nhiều kiểm tra (McCrae & Costa 1989, Harvey & Murry 1994, Bess & Harvey 2002) cùng thất bại ở bằng chứng loại rời rạc."
    review: dung
  - id: n23
    cau: 'Khá vững: nhát cắt nhị phân tại điểm giữa góp phần gây thiếu ổn định của nhãn loại.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - pittenger1993
      - nrc1991
      - pittenger2005
    ly_do: Số liệu về đổi loại (24–61% giữ nguyên; 47% sau 5 tuần; thay đổi tập trung ở điểm gần giữa) là bậc 2; cơ chế "nhiễu đo gần vạch" là cách giải thích của Pittenger, khớp số liệu nhưng chưa kiểm trực tiếp; số liệu của chính MBTI (35% đổi sau 4 tuần) nhẹ hơn.
    nguon:
      - pittenger1993
      - nrc1991
      - pittenger2005
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: Vững chắc "cơ chế đã được giải thích rõ, khớp với số liệu". Hạ xuống Khá vững vì cơ chế là suy luận, và các số liệu dao động (24–61%, 35%, 47–50%). Review (Claude Sonnet 5.5, 10/11/2026): dung. Số liệu đổi loại đã kiểm ở n7–n9 (47% sau 5 tuần; 24–61% ở 11 mẫu; thay đổi tập trung gần điểm giữa) và 35% sau 4 tuần ở n10; trang nói rõ cơ chế là cách giải thích của Pittenger, chưa kiểm trực tiếp. Khá vững hợp lý.'
    luot_2: dung
    luot_2_nguon: [ "https://www.discprofiling.co.nz/i/ComparisonReferencePapers/Cautionary_comments_regarding_the_Myers_Briggs_Typ.pdf" ]
    review: dung
  - id: n24
    cau: 'Khá vững: Big Five có bằng chứng dự báo hiệu quả công việc, còn MBTI chưa có bằng chứng tương đương.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - barrick1991
      - nrc1991
      - pittenger1993
      - pittenger2005
    ly_do: 'Một phân tích tổng hợp (Barrick & Mount 1991) cho Big Five; NRC 1991 và hai tổng quan Pittenger cho MBTI: chưa đủ bằng chứng. Chưa có so sánh trực tiếp hai khung trong cùng nghiên cứu.'
    nguon:
      - barrick1991
      - nrc1991
      - pittenger1993
      - pittenger2005
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Big Five dự báo hiệu quả công việc tốt hơn MBTI" (so sánh trực tiếp). Nay nói hai vế riêng, và nói rõ chưa so sánh trực tiếp. Thẻ ngộ nhận mbti (src/data/ngo-nhan.yml) vẫn nói "có bằng chứng dự báo tốt hơn": người giao cần xem lại (xem báo cáo). Review (Claude Sonnet 5.5, 10/11/2026): dung. Nhãn Khá vững hợp lý: Barrick & Mount 1991 (một tổng hợp) cho Big Five; NRC 1991, Pittenger 1993 và 2005 cho MBTI "chưa đủ bằng chứng"; trang nói rõ hai bên chưa so sánh trực tiếp. Không nâng lên Vững chắc vì chưa có so sánh trực tiếp. Thẻ ngộ nhận mbti (src/data/ngo-nhan.yml) vẫn viết "có bằng chứng dự báo tốt hơn": nên sửa theo (ngoài phạm vi lô).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1744-6570.1991.tb00688.x", "https://www.discprofiling.co.nz/i/ComparisonReferencePapers/Cautionary_comments_regarding_the_Myers_Briggs_Typ.pdf", "https://www.nationalacademies.org/read/1580/chapter/8" ]
    review: dung
  - id: n25
    cau: 'Khá vững: độ tin cậy chấp nhận được của điểm liên tục chưa đủ để dùng MBTI trong doanh nghiệp và tuyển dụng; các tổng quan phê bình và Boyle cho rằng bằng chứng chưa đủ cho việc dùng thường quy.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - capraro2002
      - pittenger2005
      - pittenger1993
      - nrc1991
      - boyle1995
    ly_do: 'Capraro & Capraro 2002 (độ tin cậy chấp nhận được, trung bình .82) và các tổng quan phê bình (NRC 1991; Pittenger 1993, 2005; Boyle 1995: "routine use of the MBTI is not recommended") không mâu thuẫn: nói về hai thứ khác nhau (độ tin cậy của điểm liên tục; giá trị dự báo và việc dùng nhãn loại). Pittenger 1993: "no convincing evidence ... valid predictor of important behavioral conditions". Nhiều tổng quan cùng chiều, chưa thấy nghiên cứu độc lập ủng hộ dự báo: Khá vững. Không Vững chắc vì chưa có tổng hợp trực tiếp về giá trị dự báo của MBTI trong tuyển dụng.'
    nguon:
      - capraro2002
      - pittenger2005
      - pittenger1993
      - nrc1991
      - boyle1995
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "MBTI vẫn cực kỳ phổ biến trong giới doanh nghiệp bất chấp bằng chứng khoa học yếu... cán cân bằng chứng đang nghiêng về phía phê bình" (không có nguồn đo mức phổ biến; câu cán cân là đánh giá). Nay: "được quảng bá cho nhiều ứng dụng" (Pittenger 2005) và bỏ câu cán cân. Review (Claude Sonnet 5.5, 10/11/2026): sai (nhãn). Chữ cũ: khung Đang tranh cãi "có nên dùng MBTI trong doanh nghiệp và tuyển dụng?" với "phe bênh vực (Capraro và Capraro, 2002)" và "phe phê bình". Chữ mới: khung Khá vững "độ tin cậy chấp nhận được chưa đủ để dùng MBTI trong doanh nghiệp và tuyển dụng". Lý do: Capraro 2002 chỉ đo độ tin cậy, không bênh vực việc dùng MBTI để tuyển dụng; thước đo mục 4 cho Đang tranh cãi đòi bằng chứng chất lượng cao mâu thuẫn nhau, ở đây hai nhóm nguồn nói về hai thứ khác nhau (như chính trang đã viết ở mục Capraro) và nguồn đã mở không có nghiên cứu độc lập ủng hộ việc dùng. Khung mới cũng không nhắc lại số liệu; chip mục Áp dụng 1 (n31) giữ nguyên.'
    luot_2: dung
    luot_2_nguon: [ "https://people.wku.edu/richard.miller/MBTI%20reliability%20validity.pdf", "https://www.discprofiling.co.nz/i/ComparisonReferencePapers/Cautionary_comments_regarding_the_Myers_Briggs_Typ.pdf" ]
    luot_2_ghi_chu: Nhãn Đang tranh cãi không cao hơn thước đo; thực tế giới nghiên cứu nghiêng về phía phê bình.
    review: sai
