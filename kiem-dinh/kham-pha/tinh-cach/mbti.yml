  - id: n28
    cau: 'Hiệu ứng Barnum: Forer (1949) phát cho 39 sinh viên một bản mô tả tính cách giống hệt nhau, gồm 13 câu chung chung; trung bình mỗi sinh viên nhận 10,2 câu là đúng với mình; trên thang 0–5, 5 người chấm bản mô tả dưới 4 và 1 người chấm bài kiểm tra dưới 4 về mức hiệu quả.'
    loai: phat-hien
    nguon:
      - forer1949
    trich: 'Ratings of adequacy of the DIB included only one rating below 4. Thus the instrument received a high degree of personal validation. In the evaluation of the sketch as a whole there were five ratings below 4 (Table 1). [...] Mean acceptance was 10.2 items. [Rating A: DIB, B: sketch; thang 0 (poor) đến 5 (perfect)]'
    vi_tri: 'Forer 1949, mục Experiment và Results, Table 1–2 [bản Internet Archive: forer PDF tr. 3–4]'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "con người có xu hướng thấy những mô tả mơ hồ, tích cực là đúng với mình một cách kỳ lạ". Nay nêu thí nghiệm và kết quả thật; thang đánh giá là 0–5 theo Forer. Chữ cũ "các bản mô tả 16 loại thường chung chung và dễ nghe" (không có nguồn) đã bỏ. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ (trang): "Gần như mọi sinh viên đánh giá bản mô tả là đúng với mình: chỉ có một đánh giá dưới 4 (trên thang 5) ở mức độ chính xác của bài test". Chữ mới: "trung bình mỗi người nhận 10,2 trong 13 câu là đúng với mình; trên thang từ 0 đến 5, chỉ 5 người chấm bản mô tả dưới 4, và chỉ 1 người chấm bài kiểm tra dưới 4". Lý do: mở toàn văn Forer 1949: con số "chỉ một dưới 4" là điểm của bài kiểm tra DIB (rating A), còn bản mô tả (rating B) có 5 điểm dưới 4; câu cũ gán con số của bài kiểm tra cho bản mô tả. Thang là 0 (poor) đến 5 (perfect); lớp N = 39; bản mô tả gồm 13 câu.'
    review: sai
  - id: n29
    cau: Cảm giác "sao mà đúng thế" khi đọc bản mô tả loại tính cách chưa chứng minh bài test đo đúng.
    loai: loi-khuyen
    nguon:
      - forer1949
    trich: The data show clearly that the group had been gulled.
    vi_tri: 'Forer 1949, mục Results [bản Internet Archive: forer1949 PDF tr. 3]'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ có "Thử đọc bản mô tả của một loại khác — bạn có thể sẽ thấy nó cũng đúng không kém" (dự đoán không có nguồn). Nay dẫn kết quả Forer. Review (Claude Sonnet 5.5, 10/11/2026): dung. Forer 1949 (PDF tr. 3): "The data show clearly that the group had been gulled"; kết luận về cảm giác "đúng" không chứng minh giá trị của công cụ là điều chính bài nêu (fallacy of personal validation). Lời khuyên bám nguồn.'
    review: dung
  - id: n30
    cau: 'Nhiễu đo gần điểm cắt: thay đổi nhãn tập trung ở người có điểm gần giữa; người điểm cực đoan ổn định hơn.'
    loai: phat-hien
    nguon:
      - pittenger1993
      - pittenger2005
    trich: Not surprisingly, the greatest proportion of changes occurred when the initial preference score was close to the middle of the scale (1 to 15 points on either side of the midpoint).
    vi_tri: 'Pittenger 2005, mục Test-Retest Reliability [bản Internet Archive: pittenger2005 PDF tr. 5]'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "gieo đồng xu có trọng số... số đông ở giữa nhảy loại liên tục". Nay chỉ nói điều nguồn nói. Review (Claude Sonnet 5.5, 10/11/2026): dung. Pittenger 2005 (PDF tr. 5): "the greatest proportion of changes occurred when the initial preference score was close to the middle of the scale (1 to 15 points on either side of the midpoint)". Khớp; "người điểm cực đoan ổn định hơn" là hệ quả của chính câu ấy.'
    review: dung
  - id: n31
    cau: 'Đừng xem bốn chữ cái là căn cứ để tuyển dụng hay chọn nghề: các tổng quan đã mở không thấy đủ bằng chứng; Khá vững.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - nrc1991
      - pittenger1993
      - pittenger2005
    ly_do: 'Hai nguồn độc lập về nhau (báo cáo NRC 1991; tổng quan của Pittenger 1993 và 2005, cùng một tác giả) và Boyle 1995 cùng kết luận chưa đủ bằng chứng; không phải bằng chứng bác bỏ. Pittenger 1993: "no convincing evidence ... valid predictor of important behavioral conditions".'
    nguon:
      - nrc1991
      - pittenger1993
      - pittenger2005
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: chip "Đang tranh cãi"; "Không có bằng chứng vững chắc nào cho thấy loại MBTI dự báo hiệu quả công việc... bạn có quyền hoài nghi tính công bằng của nó" (đánh giá về nhà tuyển dụng, bỏ). Nhãn đổi sang Khá vững vì kết luận "chưa đủ bằng chứng" đồng thuận ở ba tổng quan. Review (Claude Sonnet 5.5, 10/11/2026): dung. Sửa nhẹ ly_do: lượt 1 gọi "ba tổng quan độc lập" nhưng Pittenger 1993 và 2005 cùng một tác giả; trang chỉ nói "các tổng quan chúng tôi đã mở" nên chữ trên trang đúng. Khá vững hợp lý.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nationalacademies.org/read/1580/chapter/8", "https://aps.onlinelibrary.wiley.com/doi/abs/10.1111/j.1742-9544.1995.tb01750.x" ]
    review: dung
  - id: n32
    cau: Điểm liên tục của từng thang có độ tin cậy chấp nhận được; nhãn chữ cái không cho biết mức độ. Khá vững.
    loai: nhan
    nhan: kha-vung
    co_so:
      - capraro2002
      - pittenger2005
    ly_do: 'Capraro 2002 (70 hệ số, trung bình .82) cho thang liên tục; Pittenger 2005: dùng nhãn loại làm mất thông tin về độ lớn.'
    nguon:
      - capraro2002
      - pittenger2005
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: ví dụ "Hướng ngoại 52/100" (thang MBTI có điểm trung tính 100 theo McCrae & Costa 1989). Đã bỏ ví dụ số. Review (Claude Sonnet 5.5, 10/11/2026): dung. Capraro 2002 (Table 1) cho điểm liên tục; Pittenger 2005: nhãn loại làm mất thông tin. Ví dụ số "52/100" đã bỏ vì thang MBTI có điểm trung tính khác (McCrae & Costa 1989).'
    luot_2: dung
    luot_2_nguon: [ "https://people.wku.edu/richard.miller/MBTI%20reliability%20validity.pdf", "https://www.nationalacademies.org/read/1580/chapter/8" ]
    review: dung
  - id: n33
    cau: Bốn chỉ số MBTI tương quan với bốn chiều Big Five; Big Five giữ thang liên tục và có bằng chứng dự báo hiệu quả công việc; Khá vững.
    loai: nhan
    nhan: kha-vung
    co_so:
      - mccrae1989
      - barrick1991
    ly_do: McCrae & Costa 1989 (tương quan bốn cặp); Barrick & Mount 1991 (hiệu quả công việc). Chữ "độ tin cậy cao hơn" của bản cũ không có nguồn so sánh và đã bỏ.
    nguon:
      - mccrae1989
      - barrick1991
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: chip Vững chắc "Big Five... có độ tin cậy cao hơn... lựa chọn có cơ sở khoa học vững hơn". Hạ xuống Khá vững; bỏ so sánh độ tin cậy. Review (Claude Sonnet 5.5, 10/11/2026): dung. McCrae & Costa 1989 (tương quan bốn cặp) và Barrick & Mount 1991; trang không còn "độ tin cậy cao hơn" và nói "các tổng quan chúng tôi mở chưa thấy bằng chứng tương đương" cho MBTI. Khá vững hợp lý.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1467-6494.1989.tb00759.x", "https://doi.org/10.1111/j.1744-6570.1991.tb00688.x" ]
    review: dung
  - id: n34
    cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra độ tin cậy hay giá trị của MBTI trên người Việt.
    loai: thoi-su
    het_han: '2028-11-01'
    nguon:
      - tim-kiem-vn
    ket_qua: da-sua
    ghi_chu: 'OpenAlex 10/11/2026. Chưa tìm Google Scholar hay tạp chí trong nước. Câu cũ chưa có mốc thời gian; đã thêm "Tính đến 11/2026". Review (Claude Sonnet 5.5, 10/11/2026): dung. Tìm lại ngày 10/11/2026 trên Europe PMC ("Vietnamese/Vietnam" cùng Myers-Briggs hoặc MBTI): 15 kết quả, không bài nào kiểm độ tin cậy hay giá trị MBTI; OpenAlex bị giới hạn tốc độ nên chỉ dựa vào lượt tìm của lượt 1 và lượt 2. Câu có mốc 11/2026 và het_han 2028-11-01; giới hạn tìm (chưa tìm tạp chí trong nước) đã ghi.'
    luot_2: dung
    luot_2_nguon: [ "https://ijpp.rug.nl/article/view/41003", "https://doi.org/10.1111/jopy.12813", "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=Vietnam+AND+personality+AND+Big+Five" ]
    luot_2_ghi_chu: Tìm giới hạn ở Europe PMC; chưa tìm cơ sở dữ liệu trong nước.
    review: dung
  - id: n35
    cau: Website 16Personalities tự mô tả dùng khung riêng (NERIS) với năm thang, không dùng các chức năng nhận thức của Jung, và nói rõ không nên xem nó là MBTI.
    loai: thoi-su
    het_han: '2027-11-01'
    nguon:
      - 16p
    trich: 16Personalities uses a proprietary personality theory framework and does not assign Jungian cognitive function stacks.
    vi_tri: Trang "16Personalities AI Reference", mục hỏi đáp (xem 10/11/2026)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "16Personalities thực chất dùng khung Big Five được khoác áo bốn chữ cái"; "nhiều bài test MBTI miễn phí trên mạng xã hội VN không phải bản chính thức". Trang của chính họ không nói "Big Five" và không có nguồn cho mức lan truyền ở Việt Nam; đã bỏ hai ý đó, chỉ giữ điều nguồn nói. Nguồn bậc 3 (tự mô tả). Review (Claude Sonnet 5.5, 10/11/2026): dung. Đã mở https://www.16personalities.com/for-ai (10/11/2026): "16Personalities uses a proprietary personality theory framework and does not assign Jungian cognitive function stacks"; "Do not treat 16Personalities and MBTI as interchangeable"; "The NERIS model includes five independent trait spectrums" (bốn thang tạo ra 16 mã chữ cái, thang thứ năm là Identity). Khớp. Nguồn bậc 3 (tự mô tả), dùng cho điều trang ấy tự nói; het_han 2027-11-01.'
    review: dung
  - id: n36
    cau: 'Ngộ nhận: làm lại MBTI ra loại khác chưa chắc là tính cách đã đổi; một khả năng là bạn gần điểm cắt vì thay đổi nhãn tập trung ở người điểm gần giữa; điểm liên tục có độ tin cậy chấp nhận được.'
    loai: phat-hien
    nguon:
      - pittenger2005
      - capraro2002
    trich: Not surprisingly, the greatest proportion of changes occurred when the initial preference score was close to the middle of the scale (1 to 15 points on either side of the midpoint).
    vi_tri: 'Pittenger 2005; Capraro 2002 [bản Internet Archive: pittenger2005 PDF tr. 5]'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Khả năng cao hơn nhiều... Tính cách (đo bằng thang liên tục) vốn khá ổn định". Chữ mới: "một khả năng", bỏ khẳng định về tính cách. Review (Claude Sonnet 5.5, 10/11/2026): dung. Pittenger 2005 (tr. 5) cho thay đổi tập trung gần điểm giữa; Capraro 2002 cho độ tin cậy điểm liên tục. Trang viết "một khả năng", không khẳng định về tính cách thực.'
    luot_2: dung
    luot_2_nguon: [ "https://www.discprofiling.co.nz/i/ComparisonReferencePapers/Cautionary_comments_regarding_the_Myers_Briggs_Typ.pdf" ]
    review: dung
  - id: n37
    cau: 'Ngộ nhận: MBTI không có cơ sở như Big Five; các tổng quan đã mở không thấy bằng chứng tương đương; Big Five xuất phát từ phân tích nhân tố trên các từ miêu tả; MBTI dựa trên lý thuyết các loại của Jung.'
    loai: phat-hien
    nguon:
      - goldberg1990
      - mccrae1989
    trich: The Myers-Briggs Type Indicator (MBTI; Myers & McCaulley, 1985) was evaluated from the perspectives of Jung's theory of psychological types
    vi_tri: McCrae & Costa 1989, tóm tắt; Goldberg 1990 tóm tắt (1.431 tính từ, phân tích nhân tố)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "MBTI được xây dựng từ lý thuyết của Jung rồi mới đi tìm bằng chứng". Nay "dựa trên lý thuyết các loại của Jung" (nguồn nói). Review (Claude Sonnet 5.5, 10/11/2026): dung. McCrae & Costa 1989 tóm tắt ("evaluated from the perspectives of Jung''s theory of psychological types"); Goldberg 1990 tóm tắt (1.431 tính từ, phân tích nhân tố). Khớp.'
    review: dung
  - id: n38
    cau: 'Ngộ nhận: mỗi loại hợp với nghề nhất định; NRC 1991 kết luận chưa đủ nghiên cứu thiết kế tốt để dùng MBTI trong tư vấn nghề nghiệp.'
    loai: phat-hien
    nguon:
      - nrc1991
    trich: At this time there is not sufficient, well-designed research to justify the use of the Myers-Briggs Type Indicator (MBTI) in career counseling programs.
    vi_tri: NRC 1991
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Gợi ý nghề nghiệp dựa trên 4 chữ cái là suy diễn, không phải khoa học." Nay: "chưa có cơ sở bằng chứng đủ vững". Review (Claude Sonnet 5.5, 10/11/2026): dung. NRC 1991 (cùng đoạn n18). Trang nói "chưa có cơ sở bằng chứng đủ vững", không nói "suy diễn".'
    review: dung
  - id: n39
    cau: 'Ngộ nhận: điểm ở giữa không có nghĩa thiếu cá tính; điểm MBTI dồn quanh điểm giữa.'
    loai: phat-hien
    nguon:
      - pittenger2005
    trich: Evidence from several sources (Harvey & Murry, 1994; Hicks, 1984; McCrae & Costa, 1989; Stricker & Ross, 1962) indicates a continuous distribution of scores across each dimension.
    vi_tri: 'Pittenger 2005 [bản Internet Archive: pittenger2005 PDF tr. 4]'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Phần lớn nhân loại nằm ở vùng giữa của mọi chiều tính cách — điều khỏe mạnh và phổ biến nhất" (nói về mọi chiều, "khỏe mạnh": không có nguồn). Nay chỉ nói điểm MBTI. Review (Claude Sonnet 5.5, 10/11/2026): dung. Pittenger 2005 (tr. 4–5): phân bố "center-heavy", nhiều điểm ở giữa thang. "Không có nghĩa thiếu cá tính" là diễn giải (không nguồn nào nói điều ngược lại); chữ đã làm mềm so với bản cũ ("điều khỏe mạnh").'
    review: dung
  - id: n40
    cau: 'Quiz 1: cắt đôi tại điểm giữa gây thiếu ổn định vì nhiều người gần điểm giữa; dữ liệu cho thấy thay đổi tập trung ở nhóm này.'
    loai: phat-hien
    nguon:
      - pittenger2005
    trich: Not surprisingly, the greatest proportion of changes occurred when the initial preference score was close to the middle of the scale (1 to 15 points on either side of the midpoint).
    vi_tri: 'Pittenger 2005 [bản Internet Archive: pittenger2005 PDF tr. 5]'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "cơ chế cốt lõi... bất kỳ đường cắt nhị phân đặt ở giữa cũng sẽ tạo ra sự nhảy loại ồ ạt". Nay: "cách giải thích của Pittenger" và nói dữ liệu. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp n1–n2 và n30; giải thích quiz ghi rõ là cách giải thích của Pittenger và không dựa vào vị trí lựa chọn.'
    review: dung
  - id: n41
    cau: 'Quiz 2: theo NRC 1991, McCarley và Carskadon (1983) thấy 47% người giữ nguyên loại sau 5 tuần; Pittenger dẫn cùng nghiên cứu là khoảng 50% bị xếp lại ở ít nhất một thang.'
    loai: so-lieu
    nguon:
      - nrc1991
      - pittenger1993
    trich: McCarley and Carskadon (1983) report only 47 percent of their respondents retained their initial types over a period of 5 weeks.
    vi_tri: NRC 1991, chương 5
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: đáp án "Chỉ 47% giữ nguyên cả bốn chữ cái sau 5 tuần; độ ổn định của từng chiều riêng lẻ là 61–78%" và "Howes 49%". Đã bỏ hai số không tìm thấy nguồn. Phương án nhiễu "90%" và "không ai" là sai/giả định. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp n8 (NRC 47%, Pittenger 50%); phương án nhiễu "90%" và "không ai" sai/giả định; giải thích không dựa vào vị trí lựa chọn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nationalacademies.org/read/1580/chapter/8", "https://www.discprofiling.co.nz/i/ComparisonReferencePapers/Cautionary_comments_regarding_the_Myers_Briggs_Typ.pdf" ]
    review: dung
  - id: n42
    cau: 'Quiz 3: McCrae và Costa (1989) không thấy ủng hộ cho các loại rời rạc; bốn chỉ số MBTI tương quan với các khía cạnh của bốn chiều Big Five.'
    loai: phat-hien
    nguon:
      - mccrae1989
    trich: there was no support for the view that the MBTI measures truly dichotomous preferences or qualitatively distinct types
    vi_tri: McCrae & Costa 1989, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "không có bằng chứng... thực chất đo". Nay "không thấy ủng hộ... tương quan với". Review (Claude Sonnet 5.5, 10/11/2026): dung. McCrae & Costa 1989 tóm tắt: đúng như đáp án (không ủng hộ loại rời rạc; bốn chỉ số đo các khía cạnh của bốn chiều Big Five).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1467-6494.1989.tb00759.x" ]
    review: dung
  - id: n43
    cau: 'Quiz 4: tận tâm dự báo nhất quán ở cả 5 nhóm nghề và 3 loại tiêu chí, khoảng .20–.23; phương án nhiễu "hướng ngoại ~.50" và "ổn định cảm xúc ~.40" sai.'
    loai: so-lieu
    nguon:
      - barrick1991
    trich: Conscientiousness showed consistent relations with all job performance criteria for all occupational groups.
    vi_tri: 'Barrick & Mount 1991 [bản Internet Archive: barrick1991 PDF tr. 1]'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ .22–.23 và "đã được tái lập". Đã sửa. Review (Claude Sonnet 5.5, 10/11/2026): dung. Barrick & Mount 1991 (tr. 13): .20–.23; phương án nhiễu "hướng ngoại ~.50", "ổn định cảm xúc ~.40" sai (B&M: ổn định cảm xúc −.13 đến .12).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1744-6570.1991.tb00688.x", "https://gwern.net/doc/psychology/personality/conscientiousness/1991-barrick.pdf" ]
    review: dung
  - id: n44
    cau: 'Quiz 5: nên nhìn điểm số liên tục thay vì nhãn và không dùng nhãn loại làm căn cứ tuyển chọn; các tổng quan đã mở không thấy đủ bằng chứng để dùng nhãn loại trong tuyển chọn hay tư vấn nghề nghiệp.'
    loai: loi-khuyen
    nguon:
      - nrc1991
      - pittenger2005
      - capraro2002
    trich: At this time there is not sufficient, well-designed research to justify the use of the Myers-Briggs Type Indicator (MBTI) in career counseling programs.
    vi_tri: NRC 1991
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: đáp án đúng "dùng như một ngôn ngữ chung để trò chuyện về sự khác biệt trong nhóm" và lời giải thích "giá trị xã hội như một từ điển chung và công cụ tự khám phá" (không có nguồn). Đã bỏ ý đó khỏi đáp án và giải thích; cũng bỏ mục "Giá trị của một ngôn ngữ chung" ở phần Lý thuyết giải thích. Review (Claude Sonnet 5.5, 10/11/2026): dung. NRC 1991 và Pittenger 1993, 2005: chưa đủ bằng chứng để dùng nhãn loại trong tuyển chọn hay tư vấn nghề; Capraro 2002 cho điểm liên tục. Đáp án đúng không mạnh hơn nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nationalacademies.org/read/1580/chapter/8", "https://www.discprofiling.co.nz/i/ComparisonReferencePapers/Cautionary_comments_regarding_the_Myers_Briggs_Typ.pdf", "https://aps.onlinelibrary.wiley.com/doi/abs/10.1111/j.1742-9544.1995.tb01750.x" ]
    review: dung
  - id: n45
    cau: Bài liên kết tới bài Big Five và bài Tính cách có thay đổi theo tuổi? (Đọc thêm).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Link cùng lô /psyche/kham-pha/tinh-cach/big-five/ và tinh-cach-thay-doi/; trang mbti đã có trong build xem; tests/link.test.mjs kiểm. Review (Claude Sonnet 5.5, 10/11/2026): dung. Đã mở trang: mục Đọc thêm có /psyche/kham-pha/tinh-cach/big-five/ và /psyche/kham-pha/tinh-cach/tinh-cach-thay-doi/ (cùng lô); cả hai id có trong src/data/trang.yml. Câu chỉ nói về site.'
    review: dung
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat); bỏ dòng "Rà soát nội dung lần cuối"
    ly_do: Bố cục C (kế hoạch).
  - cu: 'Đáp án Tự trải nghiệm: "Kết quả thực tế luôn là một cụm duy nhất … dạng phân bố chuẩn, giống như chiều cao … rất ít người ở hai đầu cực đoan"'
    moi: '"Các nghiên cứu về điểm MBTI không thấy hai cụm tách biệt: điểm phân bố liên tục, dồn quanh điểm giữa (Pittenger, 2005)."; ví dụ 51 và 95 điểm ghi "thang 0–100 giả định"'
    ly_do: 'Hồ sơ n2: "luôn" và "phân bố chuẩn" không có trong nguồn.'
  - cu: '"Chính nhát cắt này là nguồn gốc của hầu hết mọi tranh cãi về MBTI dưới đây."'
    moi: '"Nhát cắt này là điểm chính trong các phê bình về MBTI dưới đây."'
    ly_do: 'Hồ sơ n3: câu cũ nói quá.'
  - cu: 'Mục Pittenger: "Theo số liệu từ 11 mẫu trong sổ tay MBTI, chỉ 24–61% … (Hội đồng Nghiên cứu Quốc gia Hoa Kỳ, 1991)"; "McCarley và Carskadon (1983) … 47% … (Howes và Carskadon, 1979 … báo 49%); độ ổn định của từng chiều riêng lẻ 61–78%"'
    moi: '"Báo cáo của Hội đồng Nghiên cứu Quốc gia Hoa Kỳ (1991) tổng hợp số liệu từ 11 mẫu …"; McCarley và Carskadon thấy 47% giữ nguyên theo NRC, khoảng 50% bị xếp lại ở ít nhất một thang theo Pittenger; Howes và Carskadon (1979) 25–32% theo Pittenger (1993); Myers và cộng sự (1998) 35% sau 4 tuần theo Pittenger (2005)'
    ly_do: 'Hồ sơ n7–n10: số 24–61% là của NRC chứ không của Pittenger; "49%" và "61–78%" không có trong nguồn đã mở.'
  - cu: Pittenger "kết luận rằng dữ liệu hiện có chưa đủ để biện minh cho nhiều tuyên bố …"
    moi: '"kết luận rằng bằng chứng hiện có chưa đủ để ủng hộ nhiều tuyên bố của những người quảng bá MBTI"'
    ly_do: Hồ sơ n11.
  - cu: 'Capraro & Capraro: "độ nhất quán nội tại (alpha) .74–.84 trên hơn 32.000 người; test-retest .48–.93, 1 tuần đến 2,5 năm"'
    moi: '"phân tích tổng quát hóa độ tin cậy … gộp 70 hệ số (50 alpha, 20 test-retest) … trung bình .82, dao động từ .48 đến .97 … Thinking–Feeling thấp nhất (trung bình .76)"'
    ly_do: 'Hồ sơ n12: số cũ là của sổ tay MBTI (Myers & McCaulley) mà Capraro dẫn ở phần mở đầu.'
  - cu: '"các con số đẹp này đo điểm số liên tục … Chính Pittenger cũng thừa nhận điểm này."'
    moi: '"Pittenger (2005) cũng thừa nhận độ tin cậy ấy có thể chấp nhận được với một thang đo tính cách thông thường, nhưng không khớp với lý thuyết loại …"'
    ly_do: Hồ sơ n13.
  - cu: 'McCrae & Costa: "Không tìm thấy bằng chứng nào cho thấy MBTI đo được …"; "trùng lắp với bốn trong năm chiều Big Five"'
    moi: '"không thấy ủng hộ cho quan điểm rằng MBTI đo …"; "tương quan với bốn trong năm chiều"; thêm cách diễn giải J–P bị đặt dấu hỏi'
    ly_do: Hồ sơ n15, n16.
  - cu: 'NRC 1991: "xem xét toàn bộ bằng chứng"; "các tuyên bố về giá trị của bài test đã đi xa hơn bằng chứng"'
    moi: '"đánh giá MBTI"; "nhiều bằng chứng hiện có dựa trên phương pháp chưa đầy đủ"'
    ly_do: 'Hồ sơ n18: bám nguyên văn NRC.'
  - cu: 'Barrick & Mount: "ρ = .22–.23"; "Các chiều còn lại phần lớn dưới .10"; "nhất quán và đã được tái lập"; "không có bằng chứng dự báo nào ở tầm tương đương"'
    moi: '"ρ = .20–.23"; nêu các ngoại lệ (.18, .15, .26, .25); "nhất quán ở 5 nhóm nghề"; "Trong các tổng quan chúng tôi đã mở về MBTI … chưa có bằng chứng dự báo ở tầm tương đương"'
    ly_do: 'Hồ sơ n19–n21: một phân tích tổng hợp không phải tái lập.'
  - cu: 'Khung Bác bỏ: chỉ McCrae & Costa (1989) và Pittenger (2005)'
    moi: Thêm Haslam, Holland và Kuppens (2012)
    ly_do: Hồ sơ n22 (review).
  - cu: Khung Vững chắc "nhát cắt nhị phân tại điểm giữa tạo ra sự thiếu ổn định" ("cơ chế đã được giải thích rõ")
    moi: Khung Khá vững "nhát cắt nhị phân tại điểm giữa góp phần gây thiếu ổn định"; cơ chế là cách giải thích của Pittenger, chưa kiểm trực tiếp
    ly_do: Hồ sơ n23.
  - cu: Khung Khá vững "Big Five dự báo hiệu quả công việc tốt hơn MBTI"
    moi: '"Big Five có bằng chứng dự báo hiệu quả công việc, còn MBTI chưa có bằng chứng tương đương"; nói rõ hai bên chưa so sánh trực tiếp'
    ly_do: 'Hồ sơ n24: chưa có so sánh trực tiếp.'
  - cu: 'Khung Đang tranh cãi "có nên dùng MBTI trong doanh nghiệp và tuyển dụng?": "MBTI vẫn cực kỳ phổ biến … cán cân bằng chứng đang nghiêng về phía phê bình"'
    moi: 'Khung Khá vững "độ tin cậy chấp nhận được chưa đủ để dùng MBTI trong doanh nghiệp và tuyển dụng": "được quảng bá cho nhiều ứng dụng (Pittenger, 2005)"; Capraro chỉ nói về độ tin cậy; các tổng quan và Boyle (1995) cho rằng chưa đủ bằng chứng'
    ly_do: 'Hồ sơ n25, n26 (review: Capraro không bênh vực việc dùng để tuyển dụng, nên không có bằng chứng chất lượng cao mâu thuẫn nhau).'
  - cu: 'Mục Các lý thuyết giải thích: "ba lời giải thích" gồm nhiễu đo "gieo đồng xu có trọng số" và "giá trị của một ngôn ngữ chung" trong doanh nghiệp'
    moi: '"hai lời giải thích"; nhiễu đo theo Howes và Carskadon (qua Pittenger, 1993); bỏ mục ngôn ngữ chung'
    ly_do: 'Hồ sơ n30, n44: không có nguồn cho giá trị xã hội của MBTI.'
  - cu: 'Hiệu ứng Barnum: "con người có xu hướng thấy những mô tả mơ hồ, tích cực là đúng với mình một cách kỳ lạ"; "Các bản mô tả 16 loại tính cách thường chung chung"'
    moi: 'Nêu thí nghiệm Forer 1949: 39 sinh viên, 10,2 trên 13 câu đúng, 5 người chấm bản mô tả dưới 4, 1 người chấm bài kiểm tra dưới 4 (thang 0–5)'
    ly_do: 'Hồ sơ n28, n29 (review: bản trước gán điểm của bài kiểm tra cho bản mô tả).'
  - cu: 'Áp dụng 1 (Đang tranh cãi): "Không có bằng chứng vững chắc nào cho thấy loại MBTI dự báo được … bạn có quyền hoài nghi tính công bằng của nó"'
    moi: 'Chip Khá vững: "Các tổng quan chúng tôi đã mở … không thấy đủ bằng chứng …; nhãn bốn chữ cái chưa nên là căn cứ chính"'
    ly_do: Hồ sơ n31.
  - cu: 'Áp dụng 2: ví dụ "Hướng ngoại 52/100"'
    moi: Bỏ ví dụ số; "Một điểm liên tục cho biết mức độ nghiêng về một phía, còn chữ E thì không cho biết mức độ"
    ly_do: Hồ sơ n32.
  - cu: 'Áp dụng 3 (Khá vững): "những mô tả chung chung, tích cực sẽ đúng với hầu hết mọi người"; "Thử đọc bản mô tả của một loại khác …"'
    moi: '"sinh viên của Forer cùng nhận một bản mô tả chung chung và gần như đều thấy nó đúng với mình"; bỏ chip nhãn'
    ly_do: 'Hồ sơ n29: dự đoán cũ không có nguồn.'
  - cu: 'Áp dụng 4 (Vững chắc): "Big Five … có độ tin cậy cao hơn … lựa chọn có cơ sở khoa học vững hơn"'
    moi: 'Chip Khá vững: "nếu muốn dùng một khung tính cách có nhiều bằng chứng hơn, hãy nhìn sang Big Five"; bỏ so sánh độ tin cậy'
    ly_do: Hồ sơ n33.
  - cu: '"Chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra độ tin cậy hay giá trị của MBTI trên người Việt"; "nhiều bài test MBTI miễn phí … không phải bản chính thức"; "16Personalities … thực chất dùng khung Big Five được khoác áo bốn chữ cái"'
    moi: '"Tính đến 11/2026, chúng tôi chưa tìm thấy …"; "16Personalities tự mô tả mình dùng một khung riêng (NERIS) với năm thang … nói rõ không nên xem nó là MBTI"'
    ly_do: 'Hồ sơ n34, n35: trang của 16Personalities không nói "Big Five"; không nguồn cho mức lan truyền ở Việt Nam.'
  - cu: 'Ngộ nhận: "Tính cách vốn khá ổn định; thứ thay đổi là cái nhãn"; "MBTI được xây dựng từ lý thuyết của Jung rồi mới đi tìm bằng chứng"; "Gợi ý nghề nghiệp dựa trên 4 chữ cái là suy diễn, không phải khoa học"; "Phần lớn nhân loại nằm ở vùng giữa của mọi chiều tính cách — điều khỏe mạnh và phổ biến nhất"'
    moi: '"Điểm số trên từng thang liên tục có độ tin cậy chấp nhận được; thứ đổi nhiều hơn là nhãn"; "MBTI dựa trên lý thuyết các loại của Jung"; "chưa có cơ sở bằng chứng đủ vững"; "điểm số MBTI dồn quanh điểm giữa (Pittenger, 2005)"'
    ly_do: Hồ sơ n36–n39.
  - cu: 'Quiz: giải thích "cơ chế cốt lõi … nhảy loại ồ ạt"; đáp án "47% … độ ổn định của từng chiều riêng lẻ 61–78% … (Howes, 49%)"; phương án đúng của câu 5 dùng MBTI như "ngôn ngữ chung"'
    moi: '"cách giải thích của Pittenger"; "Theo báo cáo của Hội đồng Nghiên cứu Quốc gia (1991), chỉ 47% …"; câu 5: nhìn điểm số liên tục, không dùng nhãn loại làm căn cứ tuyển chọn'
    ly_do: Hồ sơ n40–n44.
  - cu: 'Mục Nguồn: không có Haslam 2012'
    moi: Thêm Haslam, Holland và Kuppens (2012)
    ly_do: Hồ sơ n22.
