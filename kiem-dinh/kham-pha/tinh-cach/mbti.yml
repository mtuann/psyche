nhan_dinh:
  - id: n1
    cau: 'Mô tả trang: trong một nghiên cứu, khoảng một nửa số người làm lại MBTI sau 5 tuần nhận loại khác.'
    loai: phat-hien
    nguon:
      - pittenger1993
      - nrc1991
    trich: McCarley and Carskadon (1983) examined the stability of the type assignment across a 5-week interval and found that 50% of the subjects were reclassified on one or more of the four scales.
    vi_tri: 'Pittenger 1993, mục Test-retest reliability [bản Internet Archive: pittenger1993 PDF tr. 7]'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Khoảng một nửa số người làm lại MBTI sau vài tuần rơi vào loại khác" và "bài test tính cách nổi tiếng nhất thế giới". Chữ mới: "trong một nghiên cứu... sau 5 tuần" (NRC 1991: 47% giữ nguyên loại; Myers 1998 báo 35% đổi sau 4 tuần, theo Pittenger 2005) và bỏ "nổi tiếng nhất thế giới". Review (Claude Sonnet 5.5, 10/11/2026): dung. Pittenger 1993 (PDF tr. 7): McCarley & Carskadon 1983, 5 tuần, "50% of the subjects were reclassified on one or more of the four scales"; NRC 1991 (nap.edu, chương 5): "only 47 percent ... retained their initial types". Câu mô tả "khoảng một nửa ... nhận loại khác" khớp cả hai.'
    review: dung
  - id: n2
    cau: 'Các nghiên cứu về điểm MBTI không thấy hai cụm tách biệt: điểm phân bố liên tục, dồn quanh điểm giữa.'
    loai: phat-hien
    nguon:
      - pittenger2005
      - pittenger1993
      - mccrae1989
    trich: Evidence from several sources (Harvey & Murry, 1994; Hicks, 1984; McCrae & Costa, 1989; Stricker & Ross, 1962) indicates a continuous distribution of scores across each dimension.
    vi_tri: 'Pittenger 2005, mục Descriptive Statistics [bản Internet Archive: pittenger2005 PDF tr. 4]'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Kết quả thực tế luôn là một cụm duy nhất... dạng phân bố chuẩn, giống như chiều cao... rất ít người ở hai đầu". "Luôn" và "chuẩn" không có trong nguồn; Pittenger 1993: điểm "cluster around the median". Số 51 và 95 điểm trong ví dụ là gia-dinh. Review (Claude Sonnet 5.5, 10/11/2026): dung. Pittenger 2005 (PDF tr. 4): "bimodality ... is conspicuously absent. Evidence from several sources ... indicates a continuous distribution"; (tr. 5) "center-heavy distribution", "high frequency of scores at the midpoint". Câu "dồn quanh điểm giữa" khớp. Ví dụ 51 và 95 điểm trong thang 0–100 là giả định (gia-dinh), đã ghi "giả định" trên trang.'
    review: dung
  - id: n3
    cau: MBTI cắt đôi thang đo tại điểm giữa; hai người có điểm sát vạch nhận hai nhãn trái ngược.
    loai: phat-hien
    nguon:
      - pittenger2005
      - mccrae1989
    trich: converting continuous interval or ratio scaled scores to an ordinal or nominal scale removes important information
    vi_tri: 'Pittenger 2005, mục Descriptive Statistics [bản Internet Archive: pittenger2005 PDF tr. 4]'
    ket_qua: dung
    ghi_chu: 'Câu mô tả cách chấm điểm (dichotomous scoring); ví dụ số điểm là gia-dinh. Review (Claude Sonnet 5.5, 10/11/2026): dung. Pittenger 2005 (mục Descriptive Statistics): chuyển thang liên tục sang thang phân loại làm mất thông tin; MBTI chấm theo điểm trung tính (McCrae & Costa 1989). Ví dụ số điểm là giả định.'
    review: dung
  - id: n4
    cau: MBTI là bảng hỏi tự báo cáo gồm 4 cặp đối lập (hướng ngoại–hướng nội, giác quan–trực giác, lý trí–cảm xúc, nguyên tắc–linh hoạt), cho 16 "loại" bốn chữ cái như INTJ hay ESFP.
    loai: dinh-nghia
    nguon:
      - pittenger2005
      - mccrae1989
    trich: the type conditions as mutually exclusive categories, the practice of test interpretation focuses on the four-letter type formula
    vi_tri: 'Pittenger 2005 (mô tả MBTI, bốn thang E–I, S–N, T–F, J–P) [bản Internet Archive: pittenger2005 PDF tr. 3]'
    ket_qua: dung
    ghi_chu: 'Tên bốn cặp theo mô tả của McCrae & Costa 1989 và Pittenger 2005. Review (Claude Sonnet 5.5, 10/11/2026): dung. Bốn cặp E–I, S–N, T–F, J–P và công thức bốn chữ cái khớp McCrae & Costa 1989 và Pittenger 2005 (PDF tr. 3).'
    review: dung
  - id: n5
    cau: Điểm số của con người trên mỗi chiều là liên tục, nhưng MBTI chuyển chúng thành nhị phân.
    loai: phat-hien
    nguon:
      - mccrae1989
      - pittenger1993
    trich: there was no support for the view that the MBTI measures truly dichotomous preferences or qualitatively distinct types; instead, the instrument measures four relatively independent dimensions
    vi_tri: McCrae & Costa 1989, tóm tắt
    ket_qua: dung
    ghi_chu: 'Review (Claude Sonnet 5.5, 10/11/2026): dung. McCrae & Costa 1989 tóm tắt (đọc lại): "no support for the view that the MBTI measures truly dichotomous preferences or qualitatively distinct types; instead ... four relatively independent dimensions".'
    review: dung
  - id: n6
    cau: Pittenger công bố hai bài tổng quan phê bình MBTI cách nhau hơn một thập kỷ (1993, 2005).
    loai: lich-su
    nguon:
      - pittenger1993
      - pittenger2005
    trich: there is insufficient evidence to support the tenets of and claims about the utility of the test
    vi_tri: 'Pittenger 1993, tóm tắt; 2005 tóm tắt: "may not yet be able to support the claims its promoters make" [bản Internet Archive: pittenger1993 PDF tr. 2]'
    ket_qua: dung
    ghi_chu: 'Review (Claude Sonnet 5.5, 10/11/2026): dung. Hai bài tổng quan: Pittenger 1993 (Rev Educ Res 63(4), 467–488; kết luận tr. 18 "insufficient evidence to justify the specific claims") và 2005 (Consult Psychol J 57(3), 210–221); thông tin thư mục khớp đầu trang PDF.'
    review: dung
  - id: n7
    cau: 'Báo cáo của Hội đồng Nghiên cứu Quốc gia Hoa Kỳ (1991) tổng hợp 11 mẫu trong sổ tay MBTI: 24–61% người giữ nguyên loại khi làm lại, tức khoảng 39–76% xếp sang loại khác.'
    loai: so-lieu
    nguon:
      - nrc1991
    trich: test-retest reliabilities from 11 different samples. In these samples, between 24 and 61 percent of the respondents showed stability of type, with a median of 40 percent.
    vi_tri: 'NRC 1991, chương 5 (Developing Careers), '
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ gán các số này cho Pittenger ("Theo số liệu từ 11 mẫu trong sổ tay MBTI") dưới mục Pittenger; nay đặt đúng tên báo cáo NRC 1991. "39–76%" là phép trừ từ 24–61%, trang nói "tức khoảng". Review (Claude Sonnet 5.5, 10/11/2026): dung. Đã mở NRC 1991 (nap.edu/read/1580/chapter/8, tr. 96–97): "Myers and McCaulley (1985) report test-retest reliabilities from 11 different samples ... between 24 and 61 percent of the respondents showed stability of type, with a median of 40 percent". Trang nói đúng là báo cáo NRC tổng hợp số liệu của sổ tay; "39–76%" là phép trừ ghi "tức khoảng".'
    review: dung
  - id: n8
    cau: 'McCarley và Carskadon (1983): chỉ 47% người giữ nguyên loại sau 5 tuần (theo NRC 1991); Pittenger dẫn cùng nghiên cứu là khoảng 50% bị xếp lại ở ít nhất một trong bốn thang.'
    loai: so-lieu
    nguon:
      - nrc1991
      - pittenger1993
      - pittenger2005
    trich: McCarley and Carskadon (1983) report only 47 percent of their respondents retained their initial types over a period of 5 weeks.
    vi_tri: NRC 1991, chương 5; Pittenger 1993 mục Test-retest reliability; Pittenger 2005 mục Test-Retest Reliability
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "McCarley và Carskadon (1983) cho thấy sau 5 tuần chỉ 47% giữ nguyên cả bốn chữ cái (Howes và Carskadon, 1979, báo 49%); độ ổn định từng chiều 61–78%". Pittenger báo 50% đổi ở ít nhất một thang, NRC báo 47% giữ nguyên: hai số gần nhau, nay ghi cả hai với nguồn. "49%" của Howes và "61–78%" không tìm thấy trong nguồn nào đã mở nên đã bỏ. Review (Claude Sonnet 5.5, 10/11/2026): dung. NRC 1991 (cùng đoạn): "McCarley and Carskadon (1983) report only 47 percent of their respondents retained their initial types over a period of 5 weeks"; Pittenger 1993 (tr. 7) và 2005 (tr. 5) báo 50% bị xếp lại ở ít nhất một thang. Hai số gần nhau, trang ghi cả hai với nguồn.'
    review: dung
  - id: n9
    cau: Theo Howes và Carskadon (1979), khi điểm ban đầu nằm trong khoảng 15 điểm quanh điểm trung tính, 25–32% nhãn ở mỗi thang đổi ở lần làm thứ hai (theo Pittenger 1993).
    loai: so-lieu
    nguon:
      - pittenger1993
    trich: when the initial preference was within 15 points of the neutral score,
    vi_tri: 'Pittenger 1993, mục Test-retest reliability [bản Internet Archive: pittenger1993 PDF tr. 7]'
    ket_qua: dung
    ghi_chu: 'Số cụ thể: 32% EI, 25% SN, 29% TF, 30% JP (cùng đoạn). Bản gốc Howes & Carskadon chưa mở. Review (Claude Sonnet 5.5, 10/11/2026): dung. Pittenger 1993 (PDF tr. 7): Howes & Carskadon 1979, "within 15 points of the neutral score, 32% of the EI, 25% of the SN, 29% of the TF, and 30% of the JP types were altered"; Pittenger 2005 (tr. 5) cùng số. Trang viết "25–32%" và "theo Pittenger 1993".'
    review: dung
  - id: n10
    cau: Myers và cộng sự (1998) báo 35% người có loại bốn chữ cái khác sau 4 tuần (theo Pittenger 2005).
    loai: so-lieu
    nguon:
      - pittenger2005
    trich: Myers et al. (1998) reported that 35% of individuals had a different four-letter type score after a 4-week interval.
    vi_tri: 'Pittenger 2005, mục Test-Retest Reliability [bản Internet Archive: pittenger2005 PDF tr. 5]'
    ket_qua: dung
    ghi_chu: 'Thêm mới để cân bằng; nguồn gốc là sổ tay MBTI ấn bản 3, chưa mở. Review (Claude Sonnet 5.5, 10/11/2026): dung. Pittenger 2005 (PDF tr. 5): "Myers et al. (1998) reported that 35% of individuals had a different four-letter type score after a 4-week interval". Khớp; sổ tay 1998 chưa đọc, trang ghi "theo Pittenger (2005)".'
    review: dung
  - id: n11
    cau: Pittenger kết luận rằng bằng chứng hiện có chưa đủ để ủng hộ nhiều tuyên bố của những người quảng bá MBTI.
    loai: phat-hien
    nguon:
      - pittenger1993
      - pittenger2005
    trich: The author concludes that the MBTI, while offering much intuitive appeal, may not yet be able to support the claims its promoters make.
    vi_tri: 'Pittenger 2005, tóm tắt; Pittenger 1993, tóm tắt [bản Internet Archive: pittenger2005 PDF tr. 1]'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "chưa đủ để biện minh nhiều tuyên bố". Chữ mới bám lời của hai tóm tắt. Review (Claude Sonnet 5.5, 10/11/2026): dung. Tóm tắt Pittenger 2005: "may not yet be able to support the claims its promoters make"; Pittenger 1993 kết luận (tr. 18): "insufficient evidence to justify the specific claims made about the MBTI". Chữ cuối khớp.'
    review: dung
  - id: n12
    cau: 'Capraro và Capraro (2002): phân tích tổng quát hóa độ tin cậy gộp 70 hệ số (50 alpha, 20 test-retest); trung bình .82, dao động .48–.97; thang Thinking–Feeling thấp nhất (trung bình .76).'
    loai: so-lieu
    nguon:
      - capraro2002
    trich: Of the 70, 20 were test-retest and 50 were coefficient alpha estimates.
    vi_tri: 'Capraro & Capraro 2002, mục Method và Table 1 (Overall M = .815, min .48, max .97; TF M = .764) [bản Internet Archive: capraro2002 PDF tr. 8]'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "độ nhất quán nội tại alpha .74–.84 trên hơn 32.000 người; test-retest .48–.93, khoảng cách 1 tuần đến 2,5 năm". Các số này là của sổ tay MBTI (Myers & McCaulley 1985, 1989) mà Capraro dẫn ở phần mở đầu, không phải kết quả phân tích của họ. Đã thay bằng số của chính họ (Table 1). Review (Claude Sonnet 5.5, 10/11/2026): dung. Capraro & Capraro 2002 (toàn văn, Table 1, tr. 597): 70 hệ số (50 alpha, 20 test-retest), trung bình tổng .815, nhỏ nhất .48, lớn nhất .97; thang T–F trung bình .764 (thấp nhất). Trang viết ".82", ".48 đến .97", ".76": khớp.'
    review: dung
  - id: n13
    cau: 'Điểm cần đọc kỹ: độ tin cậy này đo điểm số liên tục của từng thang, không phải nhãn loại bốn chữ cái; Pittenger cũng thừa nhận độ tin cậy ấy chấp nhận được với thang đo tính cách thông thường nhưng không khớp lý thuyết "loại".'
    loai: phat-hien
    nguon:
      - pittenger2005
      - capraro2002
    trich: Although one might consider these reliabilities acceptable for conventional trait measures of personality, they are at odds with a type theory that predicts that nonpathological personality preferences should become and remain stable early in life.
    vi_tri: 'Pittenger 2005, mục Test-Retest Reliability [bản Internet Archive: pittenger2005 PDF tr. 5]'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Chính Pittenger cũng thừa nhận điểm này". Nay trích đúng điều Pittenger nói. Review (Claude Sonnet 5.5, 10/11/2026): dung. Pittenger 2005 (PDF tr. 5): "Although one might consider these reliabilities acceptable for conventional trait measures of personality, they are at odds with a type theory that predicts that nonpathological personality preferences should become and remain stable early in life." Khớp.'
    review: dung
  - id: n14
    cau: McCrae và Costa (1989) so sánh MBTI với Big Five trên 468 người trưởng thành (267 nam, 201 nữ, 19–93 tuổi), dùng cả tự đánh giá và đánh giá của người quen.
    loai: so-lieu
    nguon:
      - mccrae1989
    trich: Data were provided by 267 men and 201 women ages 19 to 93.
    vi_tri: 'McCrae & Costa 1989, tóm tắt (NEO-PI tự báo cáo và đánh giá của người quen) [bản Internet Archive: mccrae1989 PDF tr. 1]'
    ket_qua: dung
    ghi_chu: 468 = 267 + 201 (bảng có "= 468").
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1467-6494.1989.tb00759.x" ]
  - id: n15
    cau: 'Kết quả McCrae và Costa: không ủng hộ quan điểm MBTI đo sở thích nhị phân hay loại khác biệt về chất; đo bốn chiều liên tục tương đối độc lập; cách diễn giải chỉ số J–P bị đặt dấu hỏi.'
