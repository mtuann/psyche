    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Không tìm thấy bằng chứng nào cho thấy MBTI đo được..." Chữ mới: "không ủng hộ quan điểm..." (đúng "no support for the view"). Review (Claude Sonnet 5.5, 10/11/2026): dung. McCrae & Costa 1989 tóm tắt: "no support for the view ..."; "The interpretation of the Judging-Perceiving index was also called into question". Khớp.'
    review: dung
  - id: n16
    cau: 'Bốn chiều MBTI tương quan với bốn trong năm chiều Big Five: hướng ngoại và cởi mở khoảng .7; dễ chịu và tận tâm khoảng .4–.5.'
