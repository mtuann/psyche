nhan_dinh:
  - id: n1
    cau: 'Mô tả trang: ổn định thứ hạng tăng dần theo tuổi theo phân tích tổng hợp Roberts & DelVecchio (2000), nhưng mức trung bình các chiều vẫn dịch chuyển, nhất là ở tuổi 20–40.'
    loai: phat-hien
    nguon:
      - roberts2000
      - roberts2006
    trich: trait consistency increased from .31 in childhood to .54 during the college years, to .64 at age 30, and then reached a plateau around .74 between ages 50 and 70 when time interval was held constant at 6.7 years.
    vi_tri: 'Roberts & DelVecchio 2000, tóm tắt; Roberts 2006 tóm tắt [bản Internet Archive: roberts2000 PDF tr. 1]'
    ket_qua: dung
    ghi_chu: 'Review (Claude Sonnet 5.5, 10/11/2026): dung. Câu mô tả (description) gán đúng cho Roberts & DelVecchio 2000 (tóm tắt đọc lại: .31, .54, .64, ~.74 khi khoảng đo 6,7 năm) và Roberts 2006. Bleidorn 2022 (lượt 2 lưu ý) không làm câu sai vì câu có nêu tên nghiên cứu; chi tiết "bình nguyên ở 50–70" đã được nói rõ là ước tính của bài 2000 ở thân bài và khung Vững chắc (n20).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.126.1.3", "https://doi.org/10.1037/0033-2909.132.1.1" ]
    luot_2_ghi_chu: Mô tả trang đúng về hai bài gốc. Lưu ý Bleidorn 2022 (xem n20).
    review: dung
  - id: n2
    cau: 'Thứ hạng của một người so với bạn bè ngày càng ổn định theo tuổi; mức trung bình của cả nhóm dịch chuyển: nhìn chung càng lớn càng kỷ luật hơn, điềm tĩnh hơn, dễ chịu hơn.'
    loai: phat-hien
    nguon:
      - roberts2006
      - bleidorn2013
      - roberts2000
    trich: people increase in measures of social dominance (a facet of extraversion), conscientiousness, and emotional stability, especially in young adulthood (age 20 to 40).
    vi_tri: 'Roberts 2006 tóm tắt; Bleidorn 2013 tóm tắt (dễ chịu hơn, tận tâm hơn, bớt lo âu hơn ở đầu tuổi trưởng thành) [bản Internet Archive: roberts2006 PDF tr. 1]'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "người có tổ chức nhất nhóm hồi 15 tuổi thường vẫn thuộc nhóm có tổ chức nhất ở tuổi 40". Chữ mới: "có xu hướng vẫn ở gần đầu bảng... dù không chắc chắn", vì tương quan ở tuổi trẻ chỉ .31–.54. Ví dụ "có tổ chức nhất nhóm" là gia-dinh. Review (Claude Sonnet 5.5, 10/11/2026): dung. Tóm tắt Roberts 2006: tận tâm, ổn định cảm xúc tăng nhất ở tuổi 20–40; tính dễ chịu "changed only in old age"; Bleidorn 2013 tóm tắt "more agreeable"; Roberts & Mroczek 2008 "warmth". Câu đáp án nói "nhìn chung ... dễ chịu hơn" nên đứng được (không nói tuổi nào); ví dụ lớp bạn là giả định.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1467-8721.2008.00543.x", "https://doi.org/10.1037/0033-2909.132.1.1" ]
    luot_2_ghi_chu: "Dễ chịu: Roberts 2006 chỉ thấy đổi ở tuổi già, nhưng Roberts & Mroczek 2008 và Bleidorn 2013 nói 'ấm áp/dễ chịu hơn'; câu 'nhìn chung' chấp nhận được."
    review: dung
  - id: n3
    cau: Ổn định thứ hạng (rank-order stability) là vị trí tương đối của bạn so với người khác có giữ nguyên không; thay đổi mức trung bình (mean-level change) là điểm trung bình của cả nhóm có dịch chuyển không.
    loai: dinh-nghia
    nguon:
      - roberts2000
      - roberts2006
    trich: meta-analytic estimates of mean population test-retest correlation coefficients showed that trait consistency increased from .31
    vi_tri: 'Roberts 2000 (rank-order consistency); Roberts 2006 (mean-level change): xác định hai khái niệm theo tiêu đề và tóm tắt [bản Internet Archive: roberts2000 PDF tr. 1]'
    ket_qua: dung
    ghi_chu: 'Định nghĩa theo cách dùng của hai bài; ví dụ lớp 10, cuộc đua chạy là gia-dinh (không phải nghiên cứu). Lượt 2: có thể thêm APA Dictionary.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.126.1.3", "https://doi.org/10.1037/0033-2909.132.1.1" ]
  - id: n4
    cau: Roberts và DelVecchio dùng phân tích tổng hợp gộp 152 nghiên cứu dọc với tổng cộng 3.217 hệ số tương quan test-retest.
    loai: so-lieu
    nguon:
      - roberts2000
    trich: From 152 longitudinal studies, 3,217 test-retest correlation coefficients were compiled.
    vi_tri: 'Roberts & DelVecchio 2000, tóm tắt [bản Internet Archive: roberts2000 PDF tr. 1]'
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.126.1.3" ]
