      - tim-kiem-vn
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chưa tìm thấy nghiên cứu dọc nào về sự thay đổi tính cách theo tuổi trên mẫu người Việt": gần như đúng nhưng bỏ sót Bühler 2023 (OpenAlex 10/11/2026). Chưa tìm Google Scholar hay tạp chí trong nước. Review (Claude Sonnet 5.5, 10/11/2026): dung. Đọc lại tóm tắt Bühler, Sharma & Stein 2023 (N = 3.811; hai đợt; Thái Lan và Việt Nam). Tìm lại ngày 10/11/2026 trên Europe PMC ("Vietnamese/Vietnam" cùng personality và longitudinal, trait change, rank-order): chỉ thấy nghiên cứu ấy và các bộ dữ liệu panel (TVSEP) không có bài về thay đổi tính cách theo tuổi. Câu thời sự có mốc 11/2026 và het_han 2028-11-01; OpenAlex bị giới hạn tốc độ nên không tìm thêm.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/jopy.12813", "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=Vietnam+AND+personality+AND+Big+Five" ]
    luot_2_ghi_chu: Tìm giới hạn ở Europe PMC; các bộ dữ liệu dọc lớn (ví dụ Young Lives) có thể có thang tính cách nhưng không thấy bài về thay đổi theo tuổi.
    review: dung
  - id: n31
    cau: 'Khảo sát 3.811 người ở nông thôn Thái Lan và Việt Nam: mức trung bình đổi nhỏ giữa hai đợt (Cohen''s d từ 0,06 đến 0,21), tương quan test-retest trung bình giữa hai đợt là 0,21; thay đổi cá nhân liên quan đến các cú sốc và phần lớn không phụ thuộc tuổi, giới, học vấn.'
    loai: so-lieu
    nguon:
      - buhler2023
    trich: We observe changes in personality traits over time but Cohen's d coefficients only range between 0.06 and 0.21. The average rank-order stability, measured by the test-retest correlation of the Big Five between the two consecutive waves, lies at 0.21.
    vi_tri: Bühler, Sharma & Stein 2023, tóm tắt
    ket_qua: dung
    ghi_chu: Không thể so thẳng với Roberts 2000 (khoảng đo, mẫu khác); trang nói rõ.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/jopy.12813" ]
  - id: n32
    cau: Nghiên cứu 62 quốc gia cho thấy hướng "trưởng thành" từ đầu đến giữa tuổi trưởng thành ở nhiều nền văn hóa, còn thời điểm trưởng thành khác nhau giữa các nền văn hóa; áp vào Việt Nam chỉ là giả thuyết.
    loai: phat-hien
    nguon:
      - bleidorn2013
    trich: We found strong evidence for universal personality maturation from early to middle adulthood, yet there were significant cultural differences in age effects on personality traits.
    vi_tri: Bleidorn 2013, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "hướng trưởng thành là phổ quát, nhưng thời điểm phụ thuộc văn hóa". Tóm tắt dùng "universal" cho hướng; trang giữ ý với "ở nhiều nền văn hóa". Review (Claude Sonnet 5.5, 10/11/2026): dung. Tóm tắt Bleidorn 2013: "strong evidence for universal personality maturation ... yet significant cultural differences in age effects"; trang viết "ở nhiều nền văn hóa" (thận trọng hơn "phổ quát") và nói áp vào Việt Nam chỉ là giả thuyết.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1177/0956797613498396" ]
    review: dung
  - id: n33
    cau: 'Ngộ nhận: tính cách đông cứng sau 30 là sai; 4/6 nhóm đặc điểm thay đổi đáng kể ở tuổi trung niên và già (Roberts, Walton & Viechtbauer 2006).'
    loai: phat-hien
    nguon:
      - roberts2006
      - roberts2000
    trich: Of the 6 trait categories, 4 demonstrated significant change in middle and old age.
    vi_tri: 'Roberts 2006 tóm tắt; James: Roberts 2000 [bản Internet Archive: roberts2006 PDF tr. 1]'
    ket_qua: dung
    ghi_chu: Trang tóm một câu và dẫn nguồn trên.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.132.1.1", "https://psychclassics.yorku.ca/James/Principles/prin4.htm" ]
  - id: n34
    cau: 'Ngộ nhận: nếu tính cách thay đổi thì đo tính cách vô nghĩa; không suy ra được: thứ hạng tương đối ổn định (tuổi đại học .54, tuổi 30 .64 khi đo cách 6,7 năm) trong khi mức trung bình dịch chuyển.'
    loai: phat-hien
    nguon:
      - roberts2000
      - roberts2006
    trich: trait consistency increased from .31 in childhood to .54 during the college years, to .64 at age 30
    vi_tri: 'Roberts 2000 tóm tắt [bản Internet Archive: roberts2000 PDF tr. 1]'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "chính vì vừa ổn định vừa thay đổi mà tính cách vừa dự báo được tương lai, vừa cho ta hy vọng cải thiện". "Dự báo tương lai" và "hy vọng cải thiện" không có nguồn nên đã bỏ. Review (Claude Sonnet 5.5, 10/11/2026): dung. R&DV 2000 (PDF tr. 1): .54 ở tuổi đại học, .64 ở tuổi 30 khi khoảng đo 6,7 năm; trang không còn nói "dự báo được tương lai" hay "hy vọng cải thiện".'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.126.1.3", "https://doi.org/10.1037/0033-2909.132.1.1" ]
    review: dung
  - id: n35
    cau: 'Ngộ nhận: "càng già càng khó tính là quy luật" không có trong các nguồn của bài: ổn định cảm xúc và tận tâm tăng ở tuổi 20–40, dễ chịu chỉ đổi đáng kể ở tuổi già.'
    loai: phat-hien
    nguon:
      - roberts2006
    trich: people increase in measures of social dominance (a facet of extraversion), conscientiousness, and emotional stability, especially in young adulthood (age 20 to 40).
    vi_tri: 'Roberts 2006 tóm tắt [bản Internet Archive: roberts2006 PDF tr. 1]'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Không có bằng chứng cho quy luật này. Xu hướng trung bình là ngược lại: trở nên dễ chịu... hơn theo tuổi". Tóm tắt Roberts 2006 không nói hướng của dễ chịu ở tuổi già; chữ mới chỉ nói điều nguồn nói. Review (Claude Sonnet 5.5, 10/11/2026): dung. Roberts 2006 tóm tắt: tận tâm, ổn định cảm xúc tăng ở 20–40; dễ chịu "changed only in old age". Trang chỉ nói điều nguồn nói và nói "trung bình không nói lên từng cá nhân".'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.132.1.1" ]
    review: dung
  - id: n36
    cau: 'Quiz: ổn định thứ hạng nghĩa là vị trí tương đối được giữ nguyên theo thời gian; điểm số có thể tăng mà thứ hạng giữ nguyên.'
    loai: dinh-nghia
    nguon:
      - roberts2000
    trich: meta-analytic estimates of mean population test-retest correlation coefficients
    vi_tri: 'Roberts 2000, tóm tắt (khái niệm rank-order consistency) [bản Internet Archive: roberts2000 PDF tr. 1]'
    ket_qua: dung
    ghi_chu: Khái niệm; lời giải thích dùng ví dụ nhóm bạn (gia-dinh). Không dựa vào vị trí lựa chọn.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.126.1.3", "https://doi.org/10.1037/0033-2909.132.1.1" ]
  - id: n37
    cau: 'Quiz: ở tuổi 30 và tuổi 50–70 hệ số test-retest là .64 và khoảng .74 (khoảng đo cố định 6,7 năm); đường cong .31 → .54 → .64 → ~.74.'
    loai: so-lieu
    nguon:
      - roberts2000
    trich: trait consistency increased from .31 in childhood to .54 during the college years, to .64 at age 30, and then reached a plateau around .74 between ages 50 and 70 when time interval was held constant at 6.7 years.
    vi_tri: 'Roberts & DelVecchio 2000, tóm tắt [bản Internet Archive: roberts2000 PDF tr. 1]'
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.126.1.3" ]
  - id: n38
    cau: 'Quiz: theo Roberts & DelVecchio (2000), khoảng đo càng dài thì hệ số ổn định càng thấp; thời gian có thể làm giảm tương quan vì sai số đo tích lũy hoặc vì thay đổi thật; .74 không phải 1.0.'
    loai: so-lieu
    nguon:
      - roberts2000
    trich: The longitudinal time interval had a negative relation to trait consistency. [tóm tắt] | Time may degrade trait consistency because of the cumulative effects of unreliability or because of the experience of true change. [mục Previous Quantitative Reviews]
    vi_tri: Roberts & DelVecchio 2000, tóm tắt (PDF tr. 1) và mục Previous Quantitative Reviews (PDF tr. 6)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: đáp án đúng "vì thời gian dài cho phép nhiều thay đổi tích lũy hơn". Chữ mới "cho thêm cơ hội để thay đổi tích lũy" (nguồn chỉ nêu quan hệ nghịch, không nêu cơ chế). Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ (quiz): đáp án đúng "Vì thời gian dài hơn cho thêm cơ hội để thay đổi tích lũy", phương án nhiễu "Vì các nhà nghiên cứu đo sai khi để lâu". Chữ mới: câu hỏi "khoảng cách giữa hai lần đo liên quan thế nào đến hệ số ổn định" với đáp án "càng dài thì hệ số càng thấp". Lý do: toàn văn Roberts & DelVecchio 2000 (tr. 6) nói thời gian làm giảm nhất quán có thể do sai số đo tích lũy hoặc do thay đổi thật; phương án nhiễu cũ trùng một trong hai khả năng ấy, nên câu hỏi cũ có đáp án sai và nguồn chỉ nêu quan hệ nghịch (như tóm tắt).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.126.1.3" ]
    review: sai
  - id: n39
    cau: 'Quiz: Roberts 2006: tính thống trị xã hội, tận tâm và ổn định cảm xúc tăng mạnh ở tuổi 20–40; sôi nổi xã hội và cởi mở tăng ở vị thành niên rồi giảm ở tuổi già; dễ chịu chỉ đổi ở tuổi già.'
    loai: phat-hien
    nguon:
      - roberts2006
    trich: Agreeableness changed only in old age.
    vi_tri: 'Roberts 2006, tóm tắt [bản Internet Archive: roberts2006 PDF tr. 1]'
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.132.1.1" ]
  - id: n40
    cau: 'Quiz: Bleidorn 2013 phát hiện sự trưởng thành tính cách (dễ chịu, tận tâm, bớt lo âu) ở nhiều nền văn hóa, đến sớm hơn ở nơi vai trò người lớn đến sớm hơn.'
    loai: phat-hien
    nguon:
      - bleidorn2013
    trich: cultures with an earlier onset of adult-role responsibilities were marked by earlier personality maturation.
    vi_tri: Bleidorn 2013, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Sự trưởng thành tính cách là phổ quát, nhưng đến sớm hơn..." và lời giải thích "chính việc bước vào vai trò người lớn thúc đẩy tính cách trưởng thành — không chỉ đồng hồ sinh học". Đã sửa thành "phù hợp với lý thuyết đầu tư xã hội; chưa chứng minh nguyên nhân". Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ (trang): đáp án "Sự trưởng thành tính cách ... là phổ quát, nhưng đến sớm hơn ...", lệch với câu của hồ sơ ("ở nhiều nền văn hóa") và với n18, n32 (trang đã làm mềm "phổ quát" thành "ở nhiều nền văn hóa" vì có khác biệt văn hóa đáng kể và mẫu là khảo sát internet). Chữ mới: "xuất hiện ở nhiều nền văn hóa, nhưng đến sớm hơn ...". Phần còn lại khớp tóm tắt Bleidorn 2013.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1177/0956797613498396" ]
    review: sai
  - id: n41
    cau: Bài liên kết tới bài Big Five và bài Già có lẫn không? (Đọc thêm).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Link /psyche/kham-pha/tinh-cach/big-five/ cùng lô; /psyche/kham-pha/phat-trien/tuoi-gia/ hiện thành link hay "sắp có" theo bản build (tests/link.test.mjs). Review (Claude Sonnet 5.5, 10/11/2026): dung. Đã mở trang: mục Đọc thêm có link /psyche/kham-pha/tinh-cach/big-five/ (cùng lô) và /psyche/kham-pha/phat-trien/tuoi-gia/ (id có trong src/data/trang.yml; trang chưa lên nên thành "sắp có" theo plugin sap-co). Câu chỉ nói về site.'
    review: dung
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat); bỏ dòng "Rà soát nội dung lần cuối"
    ly_do: Bố cục C (kế hoạch).
  - cu: 'Đáp án Tự trải nghiệm: "người có tổ chức nhất nhóm hồi 15 tuổi thường vẫn thuộc nhóm có tổ chức nhất ở tuổi 40"'
    moi: '"có xu hướng vẫn ở gần đầu bảng ở tuổi 40, dù không chắc chắn: ở tuổi trẻ thứ hạng còn khá lỏng"'
    ly_do: 'Hồ sơ n2: tương quan tuổi trẻ chỉ .31–.54.'
  - cu: '"càng lớn, thứ hạng càng đóng lại, đạt đỉnh khoảng .74 ở tuổi trung niên."'
    moi: '"… với bình nguyên khoảng .74 ở tuổi 50–70 theo ước tính của nghiên cứu này. Cần nói thêm: một phân tích tổng hợp mới hơn (Bleidorn và cộng sự, 2022; 189 mẫu, 178.503 người) … thấy ít bằng chứng cho việc ổn định tăng thêm sau tuổi 25 …"'
    ly_do: 'Hồ sơ n20 (lượt 2: qua-manh).'
  - cu: 'Roberts 2006: "tính sôi nổi xã hội (thích tiệc tùng, náo nhiệt)"'
    moi: '"(thích giao du, cảm xúc tích cực, nhiều năng lượng)"'
    ly_do: 'Hồ sơ n9: theo định nghĩa của Roberts 2006.'
  - cu: 'Roberts 2006: bullet về nghiên cứu kéo dài, thêm "chống lại ý tưởng tính cách chỉ dao động quanh một điểm đặt cố định"'
    moi: Giữ "nghiên cứu càng kéo dài, thay đổi đo được càng lớn; thay đổi cũng lớn hơn ở các nghiên cứu theo dõi nhóm trẻ tuổi hơn"; bỏ vế chống lại điểm đặt cố định
    ly_do: 'Hồ sơ n12: ý ấy không có trong nguồn (chữ cũ gán nhầm cho Roberts & Mroczek 2008).'
  - cu: 'Roberts & Mroczek 2008: "bốn kết luận lớn", "Phần lớn thay đổi … tuổi 20–40 … lúc tính cách dẻo nhất", "nguyên tắc trưởng thành (maturity principle)", "phản bác quan niệm cũ của William James"'
    moi: '"bài tổng quan" với ba ý; "theo các tác giả, tính cách có thể thay đổi ở mọi lứa tuổi"; James (1890) dẫn theo Roberts và DelVecchio (2000); "Mỗi người đi một đường riêng"'
    ly_do: 'Hồ sơ n13–n16: tên "maturity principle" và việc phản bác James không có trong tóm tắt 2008.'
  - cu: 'Bleidorn 2013: "người trẻ", "ở khắp các nền văn hóa", "(đi làm sớm, kết hôn sớm)", "chính việc bước vào các vai trò của người lớn thúc đẩy tính cách trưởng thành"'
    moi: '"người trẻ trưởng thành", "ở nhiều nền văn hóa", bỏ ví dụ; "kết quả này phù hợp với lý thuyết đầu tư xã hội … là so sánh giữa các nền văn hóa, nên chưa chứng minh được … gây ra thay đổi"'
    ly_do: Hồ sơ n17–n19.
  - cu: 'Khung Vững chắc: "ổn định thứ hạng tăng theo tuổi, đạt đỉnh khoảng .74 ở tuổi 50–70"'
    moi: '"ổn định thứ hạng tăng từ thơ ấu đến đầu tuổi trưởng thành rồi đi ngang" (hai phân tích tổng hợp; .74 là ước tính của bài 2000)'
    ly_do: Hồ sơ n20.
  - cu: 'Khung Khá vững: "Nhiều phân tích tổng hợp ủng hộ hướng thay đổi này … hàng chục quốc gia"'
    moi: '"Phân tích tổng hợp 92 mẫu … một khảo sát internet lớn ở 62 quốc gia … Một phân tích tổng hợp mới hơn … (Bleidorn và cộng sự, 2022) … khảo sát hai đợt ở nông thôn Thái Lan và Việt Nam (Bühler và cộng sự, 2023)"'
    ly_do: 'Hồ sơ n21: chỉ một tổng hợp cho mức trung bình ở bản cũ; 62 quốc gia là khảo sát internet.'
  - cu: 'Khung Đang tranh cãi: "vì hai cơ chế này rất khó tách rời trong thực tế"'
    moi: '"Nghiên cứu 62 quốc gia của họ phù hợp với lý thuyết đầu tư xã hội, nhưng đó là một phép thử, chưa phải kết luận cuối cùng."'
    ly_do: 'Hồ sơ n22, n23: câu cũ không có nguồn.'
  - cu: 'Mục Các lý thuyết giải thích: ba nguyên tắc (Caspi, Roberts và Shiner, 2005): tích lũy ổn định, đầu tư xã hội, trưởng thành'
    moi: 'Hai lý thuyết theo Bleidorn và cộng sự (2013): lý thuyết năm nhân tố và đầu tư xã hội; "các nguồn đã kiểm chưa cho phép chọn một trong hai"; bỏ Caspi 2005 khỏi Nguồn'
    ly_do: 'Hồ sơ n23: tóm tắt Caspi 2005 không nêu ba nguyên tắc.'
  - cu: 'Áp dụng 2 "Muốn thay đổi, hãy đầu tư vào vai trò" (Khá vững): công việc đúng giờ rèn tận tâm, quan hệ lâu dài rèn dễ chịu'
    moi: '"Thay đổi tính cách gắn với trải nghiệm sống, nhưng nguyên nhân chưa rõ" (Đang tranh cãi); thêm Roberts và cộng sự (2017) về can thiệp'
    ly_do: 'Hồ sơ n26, n27: lời khuyên nhân quả không có nguồn.'
  - cu: 'Áp dụng 3 "Kiên nhẫn với tiến trình của người thân" (Vững chắc): "không bao giờ là quá muộn"'
    moi: '"Thay đổi tích lũy chậm và vẫn xảy ra ở người lớn tuổi" (Khá vững), không nói về cá nhân cụ thể'
    ly_do: Hồ sơ n28, n29.
  - cu: '"Chúng tôi chưa tìm thấy nghiên cứu dọc nào về sự thay đổi tính cách theo tuổi trên mẫu người Việt trong phạm vi các nguồn của bài này."'
    moi: '"Tính đến 11/2026, chúng tôi tìm thấy một nghiên cứu có theo dõi hai đợt trên mẫu gồm cả người Việt … (Bühler, Sharma và Stein, 2023) … chưa tìm thấy nghiên cứu dọc dài hạn … trên mẫu người Việt đại diện."'
    ly_do: Hồ sơ n30, n31.
  - cu: 'Ngộ nhận: "chính vì vừa ổn định vừa thay đổi mà tính cách vừa dự báo được tương lai, vừa cho ta hy vọng cải thiện"; "Xu hướng trung bình là ngược lại: … dễ chịu … hơn theo tuổi"'
    moi: Số liệu .54, .64 (khoảng đo 6,7 năm); "xu hướng trung bình ở tuổi 20–40 là ổn định cảm xúc và tận tâm tăng, còn tính dễ chịu chỉ đổi đáng kể ở tuổi già"
    ly_do: Hồ sơ n34, n35.
  - cu: 'Quiz 3 (khoảng đo): "Vì thời gian dài hơn cho thêm cơ hội để thay đổi tích lũy" (phương án nhiễu "đo sai khi để lâu")'
    moi: 'Câu hỏi "khoảng cách giữa hai lần đo liên quan thế nào đến hệ số ổn định": "Khoảng cách càng dài thì hệ số càng thấp"; giải thích nêu cả sai số đo tích lũy lẫn thay đổi thật'
    ly_do: 'Hồ sơ n38: nguồn nói cả hai khả năng, nên câu cũ có phương án nhiễu cũng đúng một phần.'
  - cu: 'Quiz 5: "Sự trưởng thành tính cách … là phổ quát"; giải thích "chính việc bước vào vai trò người lớn thúc đẩy … không chỉ do đồng hồ sinh học"'
    moi: '"… xuất hiện ở nhiều nền văn hóa"; giải thích "phù hợp với lý thuyết đầu tư xã hội … chưa chứng minh nguyên nhân"'
    ly_do: Hồ sơ n32, n40.
  - cu: 'Mục Nguồn: có Caspi, Roberts & Shiner 2005'
    moi: Bỏ Caspi 2005; thêm Bleidorn 2013 (đã có), Bleidorn 2022, Bühler 2023, Roberts 2017
    ly_do: Hồ sơ n23, n26, n27, n30.
