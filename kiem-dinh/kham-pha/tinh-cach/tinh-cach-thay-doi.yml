  - id: n20
    cau: 'Vững chắc: ổn định thứ hạng tăng từ thơ ấu đến đầu tuổi trưởng thành rồi đi ngang.'
    loai: nhan
    nhan: vung-chac
    co_so:
      - roberts2000
      - bleidorn2022
    ly_do: 'Hai phân tích tổng hợp lớn cùng chiều: Roberts & DelVecchio 2000 (152 nghiên cứu dọc, 3.217 hệ số): .31 → .54 → .64 → ~.74 (50–70 tuổi) với khoảng đo 6,7 năm; Bleidorn và cộng sự 2022 (189 mẫu, N = 178.503, nghiên cứu từ 2005): ổn định thứ hạng tăng đến đầu tuổi trưởng thành rồi đi ngang, "little evidence for increasing rank-order stabilities after Age 25". Hướng chung đạt Vững chắc; con số ~.74 ở tuổi 50–70 chỉ là ước tính của bài 2000, kết quả mới hơn không thấy tăng thêm sau 25 tuổi.'
    nguon:
      - roberts2000
      - bleidorn2022
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó: mục 4 chấp nhận phân tích tổng hợp lớn; Bühler 2023 (rank-order .21, hai đợt, nông thôn Thái–Việt) không mâu thuẫn trực tiếp vì khoảng đo, mẫu khác; đã nói ở mục Việt Nam. Review (Claude Sonnet 5.5, 10/11/2026): sai (qua-manh, theo lượt 2). Chữ cũ: "ổn định thứ hạng tăng theo tuổi, đạt đỉnh khoảng .74 ở tuổi 50–70" (Vững chắc, chỉ căn cứ Roberts & DelVecchio 2000, "chưa mở phân tích mới hơn"). Chữ mới: "ổn định thứ hạng tăng từ thơ ấu đến đầu tuổi trưởng thành rồi đi ngang" và nói rõ .74 là ước tính của bài 2000. Lý do: đã tự đọc tóm tắt Bleidorn 2022 (Europe PMC): "rank-order stability ... increased significantly throughout early life before reaching a plateau in young adulthood ... we found little evidence for increasing rank-order stabilities after Age 25". Giữ Vững chắc cho hướng chung (hai tổng hợp cùng chiều, không có kết quả ngược; Bühler 2023 khác khoảng đo và mẫu, không đối lập trực tiếp). Trên trang: sửa tiêu đề và nội dung khung, thêm câu về Bleidorn 2022 ở mục Roberts & DelVecchio và nguồn mới.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.126.1.3", "https://doi.org/10.1037/bul0000365" ]
    luot_2_ghi_chu: "câu đúng: Ổn định thứ hạng tăng từ thơ ấu đến đầu tuổi trưởng thành rồi đi ngang (Roberts & DelVecchio 2000: .31, .54, .64 rồi bình nguyên ~.74 ở tuổi 50-70 khi khoảng đo 6,7 năm; Bleidorn 2022 thấy ít bằng chứng tăng thêm sau tuổi 25). Nhãn Vững chắc cho hướng chung; số ~.74 ở 50-70 chỉ nên ghi là ước tính của Roberts & DelVecchio.; Hướng chung (ổn định thứ hạng tăng từ thơ ấu đến đầu tuổi trưởng thành) đứng vững và hai phân tích tổng hợp cùng chiều. Nhưng 'đạt đỉnh ~.74 ở tuổi 50-70' là số của Roberts & DelVecchio 2000; phân tích tổng hợp mới hơn không thấy ổn định tăng thêm sau 25 tuổi, nên chi tiết đỉnh muộn không đạt Vững chắc."
    review: sai
  - id: n21
    cau: 'Khá vững: mức trung bình dịch chuyển theo hướng "trưởng thành".'
    loai: nhan
    nhan: kha-vung
    co_so:
      - roberts2006
      - bleidorn2013
      - bleidorn2022
      - buhler2023
    ly_do: 'Một phân tích tổng hợp 92 mẫu (tận tâm, ổn định cảm xúc tăng, nhất là tuổi 20–40), một phân tích tổng hợp mới hơn (Bleidorn 2022: ổn định tăng cùng lúc với thay đổi mức trung bình theo hướng trưởng thành hơn) và một khảo sát internet 62 quốc gia theo hướng tương tự; nhưng chi tiết từng chiều khác nhau, và khảo sát hai đợt ở nông thôn Thái Lan–Việt Nam thấy thay đổi phần lớn không phụ thuộc tuổi.'
    nguon:
      - roberts2006
      - bleidorn2013
      - bleidorn2022
      - buhler2023
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Nhiều phân tích tổng hợp ủng hộ hướng này... tìm thấy ở hàng chục quốc gia". Chữ mới: một phân tích tổng hợp, và dữ liệu 62 quốc gia là khảo sát internet; thêm Bühler 2023 là ngoại lệ. Lượt 2 xem lại: có thêm phân tích tổng hợp (ví dụ Bleidorn 2022, Graham 2020)? Review (Claude Sonnet 5.5, 10/11/2026): dung. Thêm Bleidorn 2022 (đã trả lời câu hỏi lượt 1 "có thêm phân tích tổng hợp?"): tóm tắt nói "These increases in stability coincide with mean-level changes in the direction of greater maturity" và "Emotional stability ... increased consistently". Vẫn Khá vững vì Bühler 2023 (d .06–.21, thay đổi gắn với cú sốc, phần lớn không phụ thuộc tuổi) và chi tiết từng chiều khác nhau; có hai tổng hợp cùng chiều nên không thấp hơn Khá vững.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.132.1.1", "https://doi.org/10.1037/bul0000365" ]
    luot_2_ghi_chu: Khá vững là mức thận trọng; có thể đạt Vững chắc nhưng không cao hơn thước đo.
    review: dung
  - id: n22
    cau: 'Đang tranh cãi: vì sao tính cách thay đổi, do sinh học bên trong hay do vai trò xã hội? Lý thuyết năm nhân tố cho rằng sự trưởng thành phần lớn do di truyền; lý thuyết đầu tư xã hội cho rằng phần lớn do các bước chuyển sang vai trò người lớn.'
    loai: nhan
    nhan: tranh-cai
    co_so:
      - bleidorn2013
    ly_do: Bleidorn 2013 nêu rõ hai lý thuyết cạnh tranh và nói kết quả của họ phù hợp với đầu tư xã hội; một nghiên cứu so sánh văn hóa chưa phải phép thử quyết định.
    nguon:
      - bleidorn2013
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "vì hai cơ chế rất khó tách rời trong thực tế" (không có nguồn); đã bỏ. Review (Claude Sonnet 5.5, 10/11/2026): dung. Tóm tắt Bleidorn 2013 nêu hai lý thuyết cạnh tranh và kết quả "consistent with social-investment theory"; chỉ một nghiên cứu so sánh văn hóa, chưa phép thử quyết định (đúng như trang viết). Đang tranh cãi hợp lý.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1177/0956797613498396" ]
    luot_2_ghi_chu: Nhãn Đang tranh cãi hợp lý (bằng chứng giữa các nền văn hóa chỉ là tương quan).
    review: dung
  - id: n23
    cau: 'Theo Bleidorn (2013): lý thuyết năm nhân tố cho rằng sự trưởng thành tính cách phần lớn do di truyền quyết định; lý thuyết đầu tư xã hội cho rằng nó phần lớn là kết quả của các bước chuyển sang vai trò người lớn.'
    loai: phat-hien
