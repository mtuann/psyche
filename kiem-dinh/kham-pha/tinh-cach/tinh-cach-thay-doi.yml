    cau: Khi giữ khoảng cách giữa hai lần đo ở 6,7 năm, tương quan test-retest là .31 ở thời thơ ấu, .54 ở tuổi đại học, .64 ở tuổi 30 và bình nguyên khoảng .74 ở tuổi 50–70.
    loai: so-lieu
    nguon:
      - roberts2000
    trich: trait consistency increased from .31 in childhood to .54 during the college years, to .64 at age 30, and then reached a plateau around .74 between ages 50 and 70 when time interval was held constant at 6.7 years.
    vi_tri: 'Roberts & DelVecchio 2000, tóm tắt [bản Internet Archive: roberts2000 PDF tr. 1]'
    ket_qua: dung
    ghi_chu: 'Review (Claude Sonnet 5.5, 10/11/2026): dung. Số .31, .54, .64, ~.74 và 6,7 năm khớp tóm tắt Roberts & DelVecchio 2000 (Europe PMC) và toàn văn (PDF tr. 1). Bleidorn 2022 thấy ít bằng chứng tăng sau 25 tuổi, nên trang thêm câu nói .74 là ước tính của bài 2000 và nêu kết quả mới hơn (xem n20).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.126.1.3" ]
    luot_2_ghi_chu: Đúng với Roberts & DelVecchio 2000; số liệu mới hơn (Bleidorn 2022) cho thấy bình nguyên đến sớm hơn.
    review: dung
  - id: n6
    cau: Khoảng cách giữa hai lần đo càng dài thì tương quan càng thấp; các chiều khí chất ở trẻ nhỏ kém ổn định hơn các chiều tính cách ở người lớn.
    loai: so-lieu
    nguon:
      - roberts2000
    trich: Analysis of moderators of consistency showed that the longitudinal time interval had a negative relation to trait consistency and that temperament dimensions were less consistent than adult personality traits.
    vi_tri: 'Roberts & DelVecchio 2000, tóm tắt [bản Internet Archive: roberts2000 PDF tr. 1]'
    ket_qua: dung
