    cau: William James cho rằng tính cách "đông cứng như thạch cao" (set like plaster) từ tuổi 30 (James, 1890); nghiên cứu hiện đại không khớp với quan niệm này.
    loai: lich-su
    nguon:
      - roberts2000
    trich: William James, who claimed that personality is set like plaster by age 30 (James, 1890).
    vi_tri: 'Roberts 2000, mục Introduction [bản Internet Archive: roberts2000 PDF tr. 4]'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "phản bác quan niệm cũ của William James" gán cho Roberts & Mroczek 2008 (tóm tắt không nhắc James). Chữ mới dẫn Roberts & DelVecchio 2000 cho phát biểu của James và Roberts 2008 cho "thay đổi ở mọi lứa tuổi". Review (Claude Sonnet 5.5, 10/11/2026): dung. Mở toàn văn Roberts & DelVecchio 2000 (PDF tr. 4): "William James, who claimed that personality is set like plaster by age 30 (James, 1890)"; lượt 2 cũng đọc trích gốc ở psychclassics (Habit). Trang dẫn "theo Roberts và DelVecchio 2000" đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/James/Principles/prin4.htm" ]
    luot_2_ghi_chu: Trích đúng từ chương Habit, Principles of Psychology (1890). 'Nghiên cứu hiện đại không khớp' đúng theo Roberts 2006 (nguồn trong hồ sơ).
    review: dung
