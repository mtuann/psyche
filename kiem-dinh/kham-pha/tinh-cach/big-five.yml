    cau: Trong ba mẫu (Úc, Canada, Hà Lan) của Lee, Ashton và de Vries (2005), HEXACO dự báo hành vi sai trái ở nơi làm việc với hệ số tương quan bội .52–.63, so với .41–.47 của các thang Big Five; Ashton và Lee (2007) cũng dẫn nghiên cứu năm 2003 của chính nhóm họ, trong đó thêm Honesty-Humility làm hệ số tương quan bội với khả năng quấy rối tình dục tăng từ .34 lên .54.
    loai: so-lieu
    nguon:
      - lee2005
      - ashton2007
    trich: the six HEXACO-PI scales produced much higher multiple correlations with the dependent variable than did measures of the Big Five factors (.56 vs. .46 for the Australian sample, .63 vs. .47 for the Canadian sample A, .52 vs. .41 for the Dutch sample). [Lee 2005] | Likelihood to Sexually Harass (Pryor, 1987) yielded a multiple correlation of .34 for the International Personality Item Pool Big Five scales, a value that increased to .54 when a short form of HEXACO-PI Honesty-Humility was added (see Lee, Gizzarone, & Ashton, 2003). [Ashton & Lee 2007]
    vi_tri: Lee, Ashton & de Vries 2005, mục Results (PDF tr. 11); Ashton & Lee 2007 (PDF tr. 13)
    ket_qua: da-sua
    ghi_chu: 'Số do chính phe đề xuất HEXACO dẫn (Lee, Ashton & de Vries 2005; Lee, Gizzarone & Ashton 2003). Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: "HEXACO dự báo hành vi sai trái ở nơi làm việc tốt hơn Big Five (hệ số tương quan bội .63 so với .47) và dự báo khả năng quấy rối tình dục (.54 khi thêm Honesty-Humility so với .34)". Chữ mới: ba mẫu, .52–.63 so với .41–.47, kèm nguồn gốc. Lý do (theo lượt 2, đã tự mở lại): mở Lee, Ashton & de Vries 2005 (research.vu.nl): ba mẫu cho .56 so .46 (Úc), .63 so .47 (Canada A), .52 so .41 (Hà Lan), nên cặp .63/.47 chỉ là một mẫu. Cặp .34 so .54 về quấy rối tình dục có trong toàn văn Ashton & Lee 2007 (PDF tr. 13), là số do chính tác giả báo từ Lee, Gizzarone & Ashton 2003 (Sex Roles 49, 59–69; không mở được toàn văn): giữ, ghi rõ nguồn là Ashton & Lee 2007 dẫn lại, trên trang cũng viết "Ashton và Lee (2007) cũng dẫn".'
    luot_2: khong-chac
    luot_2_nguon: [ "https://research.vu.nl/ws/files/2111765/Lee%20Human%20Performance%2018(2)%202005%20u.pdf" ]
    luot_2_ghi_chu: Cặp .63 so .47 có thật nhưng chỉ là một trong ba mẫu của Lee, Ashton & de Vries 2005 (hai mẫu kia .56/.46 và .52/.41), nên trang nên nói 'ba mẫu, .52-.63 so với .41-.47'. Cặp quấy rối tình dục .54 so với .34 (Lee, Gizzarone & Ashton 2003, dẫn trong Ashton & Lee 2007) không mở được toàn văn nào để kiểm; bài Ashton & Lee 2007 không có bản mở. Chiều chung (HEXACO hơn Big Five) đúng.
    review: sai
