  - id: n28
    cau: Lý thuyết năm nhân tố của McCrae và Costa cho rằng sự trưởng thành của tính cách phần lớn do yếu tố di truyền quyết định.
    loai: phat-hien
    nguon:
      - bleidorn2013
    trich: Five-factor theory proposes that personality maturation is largely determined by genetic factors
    vi_tri: Bleidorn 2013, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: 5 chiều là "xu hướng cơ bản có nền tảng sinh học, định hình bởi di truyền và quá trình trưởng thành; môi trường và văn hóa chỉ ảnh hưởng cách biểu hiện, không tạo chiều mới (McCrae & Costa 1999)" và câu kết "ngôn ngữ cho thấy ở đâu, sinh học giải thích vì sao". Không mở được chương 1999; chữ mới chỉ giữ điều Bleidorn 2013 tóm tắt về lý thuyết này, bỏ câu kết suy luận. Review (Claude Sonnet 5.5, 10/11/2026): dung. Tóm tắt Bleidorn 2013 (đọc lại): "Five-factor theory proposes that personality maturation is largely determined by genetic factors"; trang viết đúng là "theo cách Bleidorn và cộng sự mô tả".'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1177/0956797613498396" ]
    review: dung
  - id: n29
    cau: 'Nghĩ theo điểm số, đừng nghĩ theo loại: Vững chắc.'
    loai: nhan
    nhan: vung-chac
    co_so:
      - mccrae1989
      - pittenger1993
      - pittenger2005
      - haslam2012
    ly_do: 'Tổng quan định lượng 177 bài taxometric (311 kết quả, 533.377 người; Haslam, Holland & Kuppens 2012): ở lĩnh vực tính cách bình thường "little persuasive evidence of taxa", phần lớn biến là chiều liên tục; McCrae & Costa 1989 không thấy loại khác biệt về chất ở MBTI; Pittenger 1993 và 2005 cùng các nguồn ông dẫn (Harvey & Murry 1994; Bess & Harvey 2002) thấy phân bố liên tục, không hai cụm. Có tổng hợp, nhiều nguồn cùng chiều, không có kết quả ngược.'
    nguon:
      - mccrae1989
      - pittenger1993
      - pittenger2005
      - haslam2012
    ket_qua: dung
    ghi_chu: 'Chỗ khó: thước đo mục 4 đòi phân tích tổng hợp; ở đây căn cứ tổng quan phê bình và nhiều phân bố điểm. Lượt 2 xem lại có nên là Khá vững. Review (Claude Sonnet 5.5, 10/11/2026): dung. Ghi chú lượt 2 (nên có một tổng hợp) đã giải quyết: Europe PMC cho tóm tắt Haslam, Holland & Kuppens 2012 (Psychol Med 42, 903–920), phân tích định lượng nghiên cứu taxometric; thêm vào co_so và vào trang. Đạt thước đo Vững chắc (tổng hợp lớn cộng nhiều nghiên cứu độc lập cùng chiều). Chỉ đọc tóm tắt Haslam nên chỉ dùng cho điều tóm tắt nói.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1467-6494.1989.tb00759.x", "https://www.discprofiling.co.nz/i/ComparisonReferencePapers/Cautionary_comments_regarding_the_Myers_Briggs_Typ.pdf" ]
    luot_2_ghi_chu: Bằng chứng đọc được chủ yếu từ MBTI; không mở được tổng hợp phân tích taxon (Haslam 2012). Nhãn Vững chắc chấp nhận được nhưng nên có một tổng hợp trong hồ sơ.
    review: dung
  - id: n30
    cau: Với MBTI, người có điểm ban đầu gần điểm trung tính dễ nhận "loại" khác khi làm lại (Howes và Carskadon, 1979, theo Pittenger, 1993).
    loai: phat-hien
    nguon:
      - pittenger1993
      - pittenger2005
    trich: when the initial preference was within 15 points of the neutral score,
    vi_tri: 'Pittenger 1993 (Howes & Carskadon 1979) [bản Internet Archive: pittenger1993 PDF tr. 7]'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chỉ cần trả lời khác đi một hai câu là có thể rơi sang loại bên kia — điểm liên tục hầu như không đổi". Chữ mới bám Howes & Carskadon 1979 qua Pittenger. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: "Người có điểm ở gần ranh giới dễ nhận loại khác khi làm lại bài test, dù điểm liên tục của họ chênh nhau rất ít". Chữ mới: "Với MBTI, người có điểm ban đầu gần điểm trung tính dễ nhận loại khác khi làm lại (Howes và Carskadon 1979, theo Pittenger 1993)". Lý do: Pittenger 1993 (PDF tr. 7) chỉ nói về MBTI (khi điểm ban đầu trong 15 điểm quanh điểm trung tính, 25–32% nhãn đổi) và không báo mức chênh điểm liên tục giữa hai lần làm; vế "chênh nhau rất ít" là suy luận. Trang này không thêm số mới (số ở trang MBTI, link về).'
    luot_2: dung
    luot_2_nguon: [ "https://www.discprofiling.co.nz/i/ComparisonReferencePapers/Cautionary_comments_regarding_the_Myers_Briggs_Typ.pdf" ]
    review: sai
  - id: n31
    cau: 'Một điểm tận tâm thấp chỉ cho biết người đó trả lời các câu hỏi ấy ở mức thấp hơn nhiều người khác (mô tả thống kê, chưa phải đánh giá về con người); điểm số cũng không cho biết giá trị nghề nghiệp của một người: tận tâm dự báo hiệu suất ở mọi nhóm nghề được xét nhưng hệ số chỉ nhỏ đến vừa. Khá vững.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - barrick1991
    ly_do: 'Phần có bằng chứng: tận tâm dự báo hiệu suất ở mọi nhóm nghề được xét nhưng hệ số chỉ nhỏ đến vừa (Barrick & Mount 1991). Phần còn lại là nguyên tắc diễn giải.'
    nguon:
      - barrick1991
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Biết mình ở đâu trên 5 chiều giúp chọn môi trường phù hợp hơn là cố sửa tính cách"; điểm tận tâm thấp "phát huy tốt ở công việc linh hoạt", hướng nội "làm tốt việc tập trung sâu"; khác biệt Big Five "giải thích nhiều va chạm nhóm". Không có nguồn nào đã mở ủng hộ (điều trái với Barrick 1991: tận tâm có ích ở mọi nghề). Đã bỏ cả ba ý. Review (Claude Sonnet 5.5, 10/11/2026): sai. Hồ sơ lượt 1 ghi da-bo nhưng trang vẫn còn hai ý trong câu: "tận tâm thấp không có nghĩa lười" và "hướng ngoại thấp không có nghĩa kém giao tiếp", không nguồn nào đã mở ủng hộ. Chữ cũ: "nó không có nghĩa người đó lười, và điểm hướng ngoại thấp không có nghĩa kém giao tiếp". Chữ mới: "đó là một mô tả thống kê, chưa phải một lời đánh giá về con người". Giữ phần có nguồn (Barrick & Mount 1991: tận tâm ρ .20–.23 ở mọi nhóm nghề, hệ số nhỏ đến vừa), nên chip Khá vững nay chỉ đỡ phần này. Ket_qua đổi từ da-bo sang da-lam-mem vì câu vẫn còn trên trang.'
    luot_2: dung
    luot_2_nguon: [ "https://www2.psych.ubc.ca/~dpaulhus/TEACH/567_2019/week.2/reading/B5.review.2008.1.pdf", "https://doi.org/10.1037/0003-066x.52.5.509" ]
    review: sai
  - id: n32
    cau: Điểm Big Five đo xu hướng trung bình, không phải số phận từng hành động; một người hướng ngoại vẫn có lúc muốn ở một mình.
    loai: loi-khuyen
    nguon:
      - mccrae1989
      - fleeson2009
    trich: Each of the five dimensions represents a broad domain
    vi_tri: 'McCrae & Costa 1989 (mỗi chiều là một miền rộng gồm nhiều đặc điểm nhỏ) [bản Internet Archive: mccrae1989 PDF tr. 7]'
    ket_qua: dung
    ghi_chu: 'Nguyên tắc diễn giải trait là xu hướng, không phải hành vi cố định; ví dụ minh họa là gia-dinh. Lượt 2: kiểm giáo trình (OpenStax) cho nguyên tắc này. Review (Claude Sonnet 5.5, 10/11/2026): dung. Thêm Fleeson & Gallagher 2009 (tóm tắt, Europe PMC): phân tích tổng hợp 15 nghiên cứu lấy mẫu trải nghiệm, hơn 20.000 báo cáo hành vi, điểm bảng hỏi dự báo mức trung bình của hành vi tương ứng với tương quan .42–.56. Ví dụ "hướng ngoại vẫn có lúc muốn ở một mình" là giả định (gia-dinh), đã ghi "Ví dụ giả định" trên trang.'
    luot_2: dung
    luot_2_nguon: [ "https://www2.psych.ubc.ca/~dpaulhus/TEACH/567_2019/week.2/reading/B5.review.2008.1.pdf" ]
    review: dung
  - id: n33
    cau: Big Five là công cụ mô tả các chiều của tính cách bình thường, không phải công cụ chẩn đoán bệnh lý.
    loai: phat-hien
    nguon:
      - mccrae1989
    trich: the four MBTI indices did measure aspects of four of the five major dimensions of normal personality
    vi_tri: 'McCrae & Costa 1989, tóm tắt [bản Internet Archive: mccrae1989 PDF tr. 1]'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ có thêm "bảng hỏi tự báo cáo dễ bị ảnh hưởng bởi cách ta muốn người khác nhìn mình": không có nguồn đã mở và McCrae & Costa 1989 (tr. 21) nói thang NEO-PI không bị thiên lệch mong muốn xã hội ở mẫu tình nguyện; đã bỏ câu ấy. Review (Claude Sonnet 5.5, 10/11/2026): dung. "Tính cách bình thường" khớp McCrae & Costa 1989 (tóm tắt: "four of the five major dimensions of normal personality") và Pittenger 2005 ("measure of normal personality"). Vế "không phải công cụ chẩn đoán bệnh lý" là nguyên tắc của site (không có công cụ tự chẩn đoán) chứ không phải kết quả thực nghiệm; giữ như tuyên bố về mục đích của công cụ.'
    luot_2: dung
    luot_2_nguon: [ "https://www2.psych.ubc.ca/~dpaulhus/TEACH/567_2019/week.2/reading/B5.review.2008.1.pdf" ]
    review: dung
  - id: n34
    cau: 'Hiểu giới hạn của bảng hỏi (điểm đo xu hướng trung bình; mô tả tính cách bình thường, không chẩn đoán): Khá vững.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - fleeson2009
      - mccrae1989
    ly_do: 'Một phân tích tổng hợp 15 nghiên cứu lấy mẫu trải nghiệm (hơn 20.000 báo cáo hành vi): điểm đặc điểm dự báo mức trung bình của hành vi tương ứng với tương quan .42–.56, nghĩa là đáng kể nhưng còn nhiều khác biệt điểm số không giải thích (Fleeson & Gallagher 2009); mô tả "tính cách bình thường" theo McCrae & Costa 1989. Chỉ một phân tích tổng hợp, chỉ đọc tóm tắt (chưa kiểm được mẫu có đa dạng văn hóa không): Khá vững, chưa Vững chắc.'
    nguon:
      - fleeson2009
      - mccrae1989
    ket_qua: da-sua
    ghi_chu: 'Lượt 1 ghi chưa chắc (chưa mở giáo trình); đã kiểm ở review. Review (Claude Sonnet 5.5, 10/11/2026): sai (nhãn). Chữ cũ: Vững chắc, căn cứ chỉ McCrae & Costa 1989 và "đồng thuận của giáo trình" (lượt 1 ghi chưa chắc). Chữ mới: Khá vững, căn cứ Fleeson & Gallagher 2009 (tóm tắt, Europe PMC) cộng McCrae & Costa 1989. Lý do: thước đo mục 4 đòi tổng hợp cho Vững chắc; OpenStax 11.7 chỉ nói mỗi người có điểm trên năm chiều liên tục, không nói giới hạn diễn giải; nguồn thực nghiệm duy nhất tìm được là một tổng hợp chỉ đọc tóm tắt. Vế "không chẩn đoán" là nguyên tắc của site. Trên trang: chip đổi Khá vững và thêm câu có số của Fleeson; ví dụ người hướng ngoại muốn ở một mình ghi là giả định.'
    luot_2: dung
    luot_2_nguon: [ "https://www2.psych.ubc.ca/~dpaulhus/TEACH/567_2019/week.2/reading/B5.review.2008.1.pdf", "https://doi.org/10.1037/0003-066x.52.5.509" ]
    review: sai
  - id: n35
    cau: Tính đến 11/2026, chúng tôi tìm thấy hai nghiên cứu có mẫu người Việt kiểm tra cấu trúc nhân tố của tính cách, với kết quả khác nhau; chưa tìm thấy nghiên cứu chuẩn hóa NEO-PI-R trên mẫu người Việt đại diện.
    loai: thoi-su
    het_han: '2028-11-01'
    nguon:
      - tim-kiem-vn
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chưa tìm thấy nghiên cứu kiểm chứng cấu trúc 5 nhân tố trên mẫu người Việt" — sai: có ít nhất hai (OpenAlex, 10/11/2026). Chưa tìm Google Scholar hay tạp chí trong nước. Review (Claude Sonnet 5.5, 10/11/2026): dung. Đọc lại tóm tắt Bühler, Sharma & Stein 2023 (Europe PMC; N = 3.811, Thái Lan và Việt Nam, cấu trúc 5 nhân tố phù hợp) và Quynh & Church 2023 (OpenAlex: 710 người sau khi loại 140, 668 từ, Big Five và Big Six "not well replicated", 8 nhân tố). Tìm lại ngày 10/11/2026 trên Europe PMC ("Vietnamese/Vietnam" cùng Big Five, five-factor, NEO-PI-R, BFI, validation, factor structure): không thấy bài chuẩn hóa NEO-PI-R hay BFI trên mẫu Việt đại diện; OpenAlex bị giới hạn tốc độ nên chỉ dựa vào lượt tìm của lượt 1 và lượt 2. Giới hạn tìm kiếm đã nêu trong câu ("tìm thấy", mốc 11/2026); het_han 2028-11-01 giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/jopy.12813", "https://ijpp.rug.nl/article/view/41003", "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=Vietnam+AND+personality+AND+Big+Five" ]
    luot_2_ghi_chu: Tìm giới hạn ở Europe PMC; chưa tìm cơ sở dữ liệu tiếng Việt. Câu viết 'chúng tôi tìm thấy' nên đứng được.
    review: dung
