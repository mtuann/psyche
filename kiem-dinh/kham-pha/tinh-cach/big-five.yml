    trich: We use a novel data set on personality traits from rural Thailand and Vietnam (N = 3811 individuals). [...] The results demonstrate a five-factor structure that fits the Big Five model.
    vi_tri: Bühler, Sharma & Stein 2023, tóm tắt
    ket_qua: dung
