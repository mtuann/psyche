    cau: 'Đang tranh cãi: có đúng là 5 chiều, không hơn không kém? Phe HEXACO lập luận chiều thứ sáu đo điều Big Five bỏ sót.'
    loai: nhan
    nhan: tranh-cai
    co_so:
      - ashton2007
      - quynh2023
    ly_do: Chỉ có nguồn của phía đề xuất HEXACO (Ashton & Lee 2007) và nghiên cứu từ vựng tiếng Việt cho kết quả không tái lập Big Five lẫn Big Six (Quynh & Church 2023). Chưa mở nguồn đại diện phe Big Five phản biện.
    nguon:
      - ashton2007
      - quynh2023
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "phe Big Five cho rằng chiều thứ sáu có thể gộp... phe HEXACO dự báo tốt hơn gian lận, tham nhũng" (không có nguồn cho phe Big Five; "gian lận, tham nhũng" không có trong Ashton & Lee). Chữ mới chỉ ghi lập luận phe HEXACO với số có nguồn và nói rõ là lập luận của người đề xuất. Chỗ khó/chưa chắc: lượt 2 tìm bài phản biện (ví dụ Costa & McCrae, hay tổng quan Ashton & Lee 2014) để cân hai phía. Review (Claude Sonnet 5.5, 10/11/2026): dung. Nhãn Đang tranh cãi chấp nhận được: có bằng chứng cạnh tranh (Ashton & Lee 2007: cấu trúc năm nhân tố không phục hồi ở bốn ngôn ngữ trong khi sáu nhân tố phục hồi ở cả bốn; Quynh & Church 2023: cả Big Five lẫn Big Six không tái lập tốt ở tiếng Việt), nhưng nguồn đã mở chủ yếu từ phía HEXACO, chưa mở bài phản biện của phe Big Five. Trang nói rõ "đây là lập luận của những người đề xuất"; số liệu .52–.63 đã sửa ở n25.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1177/1088868306294907" ]
    luot_2_ghi_chu: "Nhãn Đang tranh cãi hợp lý: phe HEXACO có bằng chứng nhưng chưa thành đồng thuận."
