nhan_dinh:
  - id: n1
    cau: Big Five là khung được dùng rất phổ biến trong nghiên cứu tính cách.
    loai: phat-hien
    nguon:
      - laajaj2019
    trich: the use of Big Five personality measures is increasingly common across social sciences
    vi_tri: Laajaj 2019, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "khung phân loại tính cách được nghiên cứu nhiều nhất trong tâm lý học hiện đại". Chữ mới: "được dùng rất phổ biến trong nghiên cứu tính cách". Lý do: không mở được nguồn nào đếm "nhiều nhất"; Laajaj nói "ngày càng phổ biến" trong khoa học xã hội. Review (Claude Sonnet 5.5, 10/11/2026): dung. Đọc lại tóm tắt Laajaj 2019 (Europe PMC): "the use of Big Five personality measures is increasingly common across social sciences"; chữ mới "được dùng rất phổ biến trong nghiên cứu tính cách" khớp, không còn xếp hạng "nhiều nhất". Cùng đoạn, câu đáp án mục Tự trải nghiệm "Chỉ 5 chiều" quá chắc so với khung Khá vững và Đang tranh cãi của chính trang (có đề xuất 6 chiều, cấu trúc không lặp lại ở một số quần thể): đã viết "Theo mô hình Big Five, đó là 5 chiều" kèm lưu ý có đề xuất 6 chiều.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1126/sciadv.aaw5226" ]
    review: dung
  - id: n2
    cau: Điểm số tính cách phân bố liên tục, không thành hai cụm rời; Big Five coi tính cách là các chiều liên tục.
    loai: phat-hien
    nguon:
      - mccrae1989
      - pittenger2005
    trich: there was no support for the view that the MBTI measures truly dichotomous preferences or qualitatively distinct types; instead, the instrument measures four relatively independent dimensions
    vi_tri: 'McCrae & Costa 1989, tóm tắt; Pittenger 2005 (mục Descriptive Statistics): "bimodality ... is conspicuously absent"'
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1467-6494.1989.tb00759.x", "https://www.discprofiling.co.nz/i/ComparisonReferencePapers/Cautionary_comments_regarding_the_Myers_Briggs_Typ.pdf", "https://www2.psych.ubc.ca/~dpaulhus/TEACH/567_2019/week.2/reading/B5.review.2008.1.pdf" ]
    luot_2_ghi_chu: "Phân bố liên tục đọc được rõ ở MBTI (Pittenger 2005: nhiều nghiên cứu cho phân bố liên tục, không lưỡng đỉnh; McCrae & Costa 1989); 'Big Five coi tính cách là chiều liên tục' là định nghĩa của mô hình."
  - id: n3
    cau: Tính cách là những khuôn mẫu suy nghĩ, cảm xúc và hành vi tương đối ổn định.
    loai: dinh-nghia
    nguon:
      - openstax2e
    trich: Personality refers to the long-standing traits and patterns that propel individuals to consistently think, feel, and behave in specific ways. [...] Our personalities are thought to be long term, stable, and not easily changed.
    vi_tri: OpenStax Psychology 2e, mục 11.1 What Is Personality? (mở 10/11/2026)
    ket_qua: dung
    ghi_chu: 'Lượt 1 ghi chưa chắc (APA Dictionary mở bằng JavaScript nên không đọc được); đã kiểm ở review. Review (Claude Sonnet 5.5, 10/11/2026): dung. Kiểm từ đầu (không dùng kết quả lượt 1): mở OpenStax Psychology 2e mục 11.1; định nghĩa "khuôn mẫu suy nghĩ, cảm xúc, hành vi tương đối ổn định" khớp "long-standing traits and patterns ... consistently think, feel, and behave". Nguồn giáo trình mở (bậc 2); APA Dictionary không đọc được vì dựng bằng JavaScript. Đã bỏ mccrae1989 khỏi nguồn của câu này vì nó không nói định nghĩa.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/11-1-what-is-personality" ]
    luot_2_ghi_chu: Định nghĩa phổ thông; chỉ đọc được OpenStax Psychology 2e mục 11.1 (APA Dictionary không tải được vì dựng bằng JavaScript).
    review: dung
  - id: n4
    cau: Một cách đo thường dùng là bảng hỏi tự báo cáo rồi phân tích nhân tố để xem các câu trả lời đi chung với nhau.
    loai: phat-hien
    nguon:
      - goldberg1990
    trich: The generality of this 5-factor model is here demonstrated across unusually comprehensive sets of trait terms.
    vi_tri: 'Goldberg 1990, tóm tắt (tự đánh giá và đánh giá của người quen, phân tích nhân tố) [bản Internet Archive: goldberg1990 PDF tr. 1]'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Cách đo phổ biến nhất là". Chữ mới: "Một cách đo thường dùng là" (không có nguồn nào xếp hạng "phổ biến nhất"). Review (Claude Sonnet 5.5, 10/11/2026): dung. Tóm tắt Goldberg 1990 (Europe PMC): phân tích nhân tố trên tự đánh giá và đánh giá của người quen; "một cách đo thường dùng" khớp, không còn "phổ biến nhất" mà không nguồn nào xếp hạng.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0003-066x.52.5.509" ]
    review: dung
  - id: n5
    cau: Từ hàng nghìn từ miêu tả, các cụm co lại còn năm, lặp lại qua nhiều thập kỷ, nhiều ngôn ngữ và nhiều cách đo; một số nghiên cứu tìm ra sáu hay không tái lập đúng năm.
    loai: phat-hien
    nguon:
      - goldberg1990
      - mccrae1997
      - ashton2007
      - laajaj2019
    trich: 1,431 trait adjectives grouped into 75 clusters were analyzed; virtually identical structures emerged in 10 replications, each based on a different factor-analytic procedure.
    vi_tri: 'Goldberg 1990, tóm tắt; McCrae & Costa 1997 tóm tắt (6 bản dịch); Ashton & Lee 2007 ("in a few languages, five-factor solutions have failed to ...") [bản Internet Archive: goldberg1990 PDF tr. 1]'
    ket_qua: da-lam-mem
    ghi_chu: 'Thêm ý "không tái lập đúng năm ở một số quần thể" (Ashton & Lee 2007; Laajaj 2019). Chữ cũ chỉ nói "dù một số nghiên cứu tìm ra sáu". Review (Claude Sonnet 5.5, 10/11/2026): dung. Đối chiếu: Goldberg 1990 tóm tắt (1.431 tính từ, 75 cụm, 10 lần lặp cho cùng cấu trúc); McCrae & Costa 1997 tóm tắt (6 bản dịch NEO-PI-R); Ashton & Lee 2007 (toàn văn, PDF tr. 4): "in a few languages, five-factor solutions have failed to recover the Big Five factor space" (tiếng Ý, Hungary, Hy Lạp); Laajaj 2019 tóm tắt. Phần "một số nghiên cứu tìm ra sáu hay không tái lập đúng năm" khớp các nguồn đó.'
    luot_2: dung
    luot_2_nguon: [ "https://www2.psych.ubc.ca/~dpaulhus/TEACH/567_2019/week.2/reading/B5.review.2008.1.pdf", "https://pubmed.ncbi.nlm.nih.gov/1635043/", "https://doi.org/10.1037/0003-066x.52.5.509", "https://doi.org/10.1177/1088868306294907", "https://ijpp.rug.nl/article/view/41003" ]
    review: dung
  - id: n6
    cau: 'Allport và Odbert (1936), hai nhà tâm lý học người Mỹ, xuất phát từ giả thuyết từ vựng: những khác biệt tính cách quan trọng sẽ được mã hóa thành từ trong ngôn ngữ.'
    loai: lich-su
    nguon:
      - allport1936
      - goldberg1990
    trich: the most important individual differences in human transactions will come to be encoded as single terms in some or all of the world's languages
    vi_tri: 'Goldberg 1990 (giả thuyết từ vựng; Galton nêu trước); Allport & Odbert 1936 (lục từ điển Webster) [bản Internet Archive: goldberg1990 PDF tr. 1]'
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www2.psych.ubc.ca/~dpaulhus/TEACH/567_2019/week.2/reading/B5.review.2008.1.pdf" ]
    luot_2_ghi_chu: Chương John, Naumann & Soto 2008 mô tả đúng giả thuyết từ vựng; quốc tịch Mỹ là kiến thức thường, không ghi trong trang đã mở.
  - id: n7
    cau: Allport và Odbert lục từ điển tiếng Anh và trích ra khoảng 18.000 từ miêu tả con người.
    loai: so-lieu
    nguon:
      - allport1936
    trich: Our list contains in all 17,953 words
    vi_tri: 'Allport & Odbert 1936 (mục Part A, Webster''s New International Dictionary 1925) [bản Internet Archive: allport1936 PDF tr. 29]'
    ket_qua: dung
    ghi_chu: 'Review (Claude Sonnet 5.5, 10/11/2026): dung. Mở toàn văn Allport & Odbert 1936 (Internet Archive, bộ wikipedia-scholarly-sources-corpus; PDF tr. 29): "Our list contains in all 17,953 words" (từ điển Webster''s New International 1925). Trang viết "khoảng 18.000": khớp. Ghi chú lượt 2 (chỉ thấy "almost 18,000" ở John 2008) đã giải quyết bằng bài gốc.'
    luot_2: dung
    luot_2_nguon: [ "https://www2.psych.ubc.ca/~dpaulhus/TEACH/567_2019/week.2/reading/B5.review.2008.1.pdf" ]
    luot_2_ghi_chu: Con số gốc 17.953 (Allport & Odbert 1936), chương John 2008 ghi 'almost 18,000'; bản chụp chuyên khảo không mở được toàn văn.
    review: dung
  - id: n8
    cau: 'Trong danh sách đó, 4.504 từ (khoảng 4.500, 25%) được xếp vào nhóm "nét tính cách thật": những xu hướng nhất quán và ổn định của một người.'
    loai: so-lieu
    nguon:
      - allport1936
    trich: They designate generalized and personalized determining tendencies—consistent and stable modes of an individual's adjustment to his environment. Obvious examples are aggressive, introverted, sociable. [...] The number of terms in this column is 4,504, or 25 per cent of the total list.
    vi_tri: 'Allport & Odbert 1936 (cột I: đặc điểm cá nhân bền) [bản Internet Archive: allport1936 PDF tr. 31]'
    ket_qua: da-sua
    ghi_chu: 'Review (Claude Sonnet 5.5, 10/11/2026): sai. Số 4.504 (25%) đúng (Allport & Odbert 1936, PDF tr. 31, cột I). Chữ cũ: "miêu tả những đặc điểm ổn định, quan sát được". Chữ mới: "những nét tính cách bền, ổn định của một người (như hung hăng, hướng nội, hòa đồng)". Lý do: "quan sát được" không có trong nguồn; cột I là những từ chỉ "real traits", "consistent and stable modes of an individual''s adjustment" (ví dụ aggressive, introverted, sociable). Cũng đổi "lọc còn" thành "xếp vào nhóm" vì tác giả xếp bốn cột, không loại các từ còn lại.'
    luot_2: dung
    luot_2_nguon: [ "https://www2.psych.ubc.ca/~dpaulhus/TEACH/567_2019/week.2/reading/B5.review.2008.1.pdf" ]
    luot_2_ghi_chu: Con số gốc 4.504 theo Allport & Odbert; chương John 2008 ghi 4,500.
    review: sai
  - id: n9
    cau: Tupes và Christal (hai nhà nghiên cứu của Không quân Mỹ) lấy 35 đặc điểm tiêu biểu, nhờ người khác đánh giá, ở tổng cộng 8 mẫu.
    loai: so-lieu
    nguon:
      - tupes1992
    trich: Intercorrelations among ratings on 35 personality traits, selected as representative of the personality domain, were obtained for eight samples.
    vi_tri: Tupes & Christal 1992, tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/1635043/" ]
  - id: n10
    cau: Người được đánh giá đi từ quân nhân trong khóa huấn luyện đến sinh viên đại học và học viên cao học; người đánh giá từ người mới quen đến nhà tâm lý lâm sàng nhiều kinh nghiệm; thời gian quen biết từ 3 ngày đến hơn một năm.
    loai: phat-hien
    nguon:
      - tupes1992
    trich: These samples differed in length of acquaintanceship from 3 days to more than a year; in kind of acquaintanceship from assessment programs in a military training course to a fraternity house situation; in type of subject from airmen with only a high-school education to male and female undergraduate students to first-year graduate students; and in type of rater from very naive persons to clinical psychologists and psychiatrists with years of experience in the evaluation of personality.
    vi_tri: Tupes & Christal 1992, tóm tắt
    ket_qua: dung
    ghi_chu: 'Trang nói "quân nhân trong khóa huấn luyện đến sinh viên đại học": tóm tắt ghi "airmen" (lính không quân) và tình huống huấn luyện quân sự; chữ "quân nhân" khớp nghĩa. Trang không có "nhà đại học" sai chỗ.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/1635043/" ]
  - id: n11
    cau: 'Ở cả 8 mẫu, phân tích nhân tố cho ra 5 nhân tố khá mạnh và lặp lại: Surgency, Agreeableness, Dependability, Emotional Stability, Culture.'
    loai: phat-hien
    nguon:
      - tupes1992
    trich: Five fairly strong and recurrent factors emerged from each analysis, labeled as (a) Surgency, (b) Agreeableness, (c) Dependability, (d) Emotional Stability, and (e) Culture.
    vi_tri: Tupes & Christal 1992, tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/1635043/" ]
  - id: n12
    cau: Báo cáo gốc là tài liệu kỹ thuật quân sự năm 1961, công bố lại trên tạp chí khoa học năm 1992.
    loai: lich-su
    nguon:
      - tupes1992
