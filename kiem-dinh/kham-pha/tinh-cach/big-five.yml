  - id: n39
    cau: Bản dịch một bài test chưa qua quy trình thích ứng (dịch xuôi và dịch ngược hay dịch kép, rồi kiểm chứng độ tin cậy và cấu trúc nhân tố trên mẫu mới) thì chưa rõ có đo đúng điều bản gốc đo; điểm số chỉ nên xem là tham khảo, và cần thận trọng khi dùng cho quyết định quan trọng như tuyển dụng.
    loai: loi-khuyen
    nguon:
      - itc2017
      - laajaj2019
    trich: Test translation is only a part of the adaptation process, but can be, on its own, a very simplistic approach to transporting a test from one language to another with no regard for educational or psychological equivalence. [ITC 2017] | Our results highlight the risk of misinterpreting Big Five survey data and provide a warning against naïve interpretations of personality traits without evidence of their validity. [Laajaj 2019]
    vi_tri: 'ITC 2017, phần giới thiệu và Confirmation Guidelines (C-1: "statistical techniques needed to establish test and item equivalence (e.g., confirmatory factor analysis...)"); Laajaj 2019 tóm tắt'
    ket_qua: da-lam-mem
    ghi_chu: 'Lượt 1 ghi chưa chắc (thiếu nguồn về thích ứng bài test); đã kiểm ở review. Review (Claude Sonnet 5.5, 10/11/2026): sai (qua-manh). Kiểm từ đầu: mở toàn văn ITC Guidelines 2017 (intestcom.org) và tóm tắt Laajaj 2019. Chữ cũ: "dịch ngược, kiểm chứng cấu trúc nhân tố ... không dùng cho quyết định quan trọng như tuyển dụng". Chữ mới: "dịch xuôi và dịch ngược hay dịch kép, rồi kiểm chứng độ tin cậy và cấu trúc nhân tố trên mẫu mới ... cần thận trọng khi dùng cho quyết định quan trọng". Lý do: ITC nói dịch đơn thuần là cách "very simplistic" khi bỏ qua tương đương, nêu dịch ngược chỉ là một trong các thiết kế (còn dịch kép và hòa giải), và có nhóm hướng dẫn xác nhận (CFA, DIF, độ tin cậy); Laajaj cảnh báo diễn giải ngây thơ khi chưa có bằng chứng giá trị. Không nguồn nào nói "không dùng"; chỉ có thể nói cần thận trọng.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1126/sciadv.aaw5226" ]
    luot_2_ghi_chu: Lời khuyên hợp lý, suy ra từ Laajaj 2019.
    review: sai
  - id: n40
    cau: Một nghiên cứu được Pittenger (1993) dẫn lại thấy khoảng một nửa số người được xếp lại ở ít nhất một trong bốn thang khi làm lại MBTI sau 5 tuần.
    loai: phat-hien
    nguon:
      - pittenger1993
    trich: McCarley and Carskadon (1983) examined the stability of the type assignment across a 5-week interval and found that 50% of the subjects were reclassified on one or more of the four scales.
    vi_tri: 'Pittenger 1993,  [bản Internet Archive: pittenger1993 PDF tr. 7]'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "có nghiên cứu cho thấy khoảng một nửa số người nhận loại khác khi làm lại MBTI sau 5 tuần (Pittenger, 1993)". Chữ mới nói rõ là nghiên cứu McCarley & Carskadon do Pittenger dẫn, và là xếp lại ở ít nhất một thang. Cùng nghiên cứu: NRC 1991 báo 47% giữ nguyên loại (xem mbti.yml). Review (Claude Sonnet 5.5, 10/11/2026): dung. Tự mở toàn văn Pittenger 1993 (Internet Archive, zip 10.3102; PDF tr. 7): "McCarley and Carskadon (1983) examined the stability of the type assignment across a 5-week interval and found that 50% of the subjects were reclassified on one or more of the four scales"; Pittenger 2005 (PDF tr. 5) nhắc lại; NRC 1991 báo 47% giữ nguyên loại. Không cần đổi sang Pittenger 2005 như lượt 2 đề xuất, vì bản 1993 đã mở được.'
    luot_2: dung
    luot_2_nguon: [ "https://www.discprofiling.co.nz/i/ComparisonReferencePapers/Cautionary_comments_regarding_the_Myers_Briggs_Typ.pdf", "https://www.nationalacademies.org/read/1580/chapter/8" ]
    luot_2_ghi_chu: Đúng về số liệu. Nguồn mở được là Pittenger 2005 và NRC 1991; văn bản Pittenger 1993 không mở được, nên dẫn 'Pittenger (2005)' hay 'McCarley & Carskadon 1983 theo NRC' chắc hơn.
    review: dung
  - id: n41
    cau: 'Barrick và Mount (1991) thấy hướng ngoại dự báo hiệu suất ở quản lý và bán hàng, còn ở các nhóm nghề khác hệ số nhỏ hơn: tác dụng của một chiều phụ thuộc hoàn cảnh; Big Five mô tả mức độ, không chấm điểm tốt hay xấu.'
    loai: phat-hien
    nguon:
      - barrick1991
    trich: Extraversion was a valid predictor for two occupations involving social interaction, managers and sales (across criterion types).
    vi_tri: 'Barrick & Mount 1991, tóm tắt [bản Internet Archive: barrick1991 PDF tr. 1]'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Tính bất ổn cảm xúc cao giúp ta nhạy với nguy hiểm; tính dễ chịu quá cao khiến ta khó từ chối và dễ bị lợi dụng" — không có nguồn; đã thay bằng kết quả Barrick & Mount. Ngoài ra hướng ngoại và cởi mở còn dự báo hiệu quả đào tạo (ρ = .26, .25) ở mọi nghề. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ (bullet ngộ nhận): "Không chiều nào tốt hay xấu tuyệt đối". Chữ mới: "Big Five mô tả mức độ, không chấm điểm tốt hay xấu. Về công việc, ... tác dụng của một chiều phụ thuộc vào hoàn cảnh". Lý do: B&M 1991 thấy tận tâm dự báo dương ở cả 5 nhóm nghề và 3 tiêu chí, nên "không chiều nào tốt tuyệt đối" không được nguồn ủng hộ (và nguồn không xét lo âu như một chiều "xấu"); điều có nguồn chỉ là hướng ngoại phụ thuộc nghề.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1744-6570.1991.tb00688.x", "https://gwern.net/doc/psychology/personality/conscientiousness/1991-barrick.pdf" ]
    review: sai
  - id: n42
    cau: 'Ví dụ trong khung "Hai người bạn": một câu hỏi mở đầu (liệt kê 5 từ miêu tả), không có khẳng định về nghiên cứu.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Câu giả định (gia-dinh). Đã kiểm trên trang: mục Tự trải nghiệm không nêu số liệu. Review (Claude Sonnet 5.5, 10/11/2026): dung. Đã mở trang: mục "Tự trải nghiệm" yêu cầu liệt kê 5 từ miêu tả hai người bạn, không nêu số liệu; "khung Hai người bạn" thực ra là mục Tự trải nghiệm (câu hỏi đáp án bên dưới là khẳng định riêng, đã kiểm ở n1, n5). Câu chỉ nói về site.'
    review: dung
  - id: n43
    cau: Bài này liên kết tới bài Tính cách có thay đổi theo tuổi?, bài MBTI, bài Gen và tính cách, và trang ngộ nhận.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Kiểm trên trang: link /psyche/kham-pha/tinh-cach/tinh-cach-thay-doi/ cùng lô; gen-va-tinh-cach và ngo-nhan hiện thành link hay chữ "sắp có" theo bản build (tests/link.test.mjs kiểm). Review (Claude Sonnet 5.5, 10/11/2026): dung. Đã đếm link trong trang: /psyche/kham-pha/tinh-cach/tinh-cach-thay-doi/, /psyche/kham-pha/tinh-cach/mbti/ (cả hai trong cùng lô), /psyche/kham-pha/co-so-sinh-hoc/gen-va-tinh-cach/ (trang chưa lên, thành "sắp có" theo plugin sap-co; id có trong src/data/trang.yml) và /psyche/ngo-nhan/ (id ngo-nhan/index có trong trang.yml). Câu cũ thiếu bài MBTI, đã thêm. Chỉ nói về site, không có khẳng định cần nguồn.'
    review: dung
  - id: n44
    cau: 'Câu hỏi quiz 1: giả thuyết từ vựng nói rằng những khác biệt tính cách quan trọng sẽ được mã hóa thành từ trong ngôn ngữ.'
    loai: dinh-nghia
    nguon:
      - goldberg1990
    trich: the most important individual differences in human transactions will come to be encoded as single terms in some or all of the world's languages
    vi_tri: 'Goldberg 1990,  [bản Internet Archive: goldberg1990 PDF tr. 1]'
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www2.psych.ubc.ca/~dpaulhus/TEACH/567_2019/week.2/reading/B5.review.2008.1.pdf" ]
  - id: n45
    cau: 'Câu hỏi quiz 2: Tupes và Christal phân tích đánh giá trên 35 đặc điểm ở 8 mẫu và tìm ra 5 nhân tố lặp lại (gồm giải thích về 8 mẫu, người chấm).'
    loai: phat-hien
    nguon:
      - tupes1992
    trich: Five fairly strong and recurrent factors emerged from each analysis
    vi_tri: Tupes & Christal 1992, tóm tắt (xem n9–n11); phương án nhiễu "NEO-PI-R" và "MBTI 16 loại" là sai/giả định.
    ket_qua: dung
    ghi_chu: Đã bỏ "với 240 câu" khỏi phương án nhiễu.
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/1635043/" ]
  - id: n46
    cau: 'Câu hỏi quiz 3: Big Five là 5 chiều liên tục vì điểm số phân bố liên tục, phần đông nằm quanh giữa; chia thành loại làm mất thông tin; người ở gần ranh giới dễ đổi loại khi làm lại.'
    loai: phat-hien
    nguon:
      - pittenger2005
      - pittenger1993
    trich: Evidence from several sources (Harvey & Murry, 1994; Hicks, 1984; McCrae & Costa, 1989; Stricker & Ross, 1962) indicates a continuous distribution of scores across each dimension.
    vi_tri: 'Pittenger 2005, ; Pittenger 1993  [bản Internet Archive: pittenger2005 PDF tr. 4]'
    ket_qua: da-lam-mem
    ghi_chu: 'Review (Claude Sonnet 5.5, 10/11/2026): sai. Lời giải thích quiz 3 viết "dù tính cách thực của họ hầu như không đổi": không nguồn nào nói điều đó (Pittenger chỉ báo tỉ lệ đổi nhãn gần điểm trung tính). Chữ mới: "dù điểm liên tục của họ chênh nhau rất ít" (cùng mức suy luận với n30, đã bỏ vế về tính cách thực).'
    luot_2: dung
    luot_2_nguon: [ "https://www.discprofiling.co.nz/i/ComparisonReferencePapers/Cautionary_comments_regarding_the_Myers_Briggs_Typ.pdf", "https://doi.org/10.1111/j.1467-6494.1989.tb00759.x" ]
    review: sai
  - id: n47
    cau: 'Câu hỏi quiz 4: cấu trúc 5 nhân tố được tái lập ở 6 bản dịch trên 7.134 người; các tác giả cho rằng dữ liệu "rất ủng hộ" tính phổ quát, dù không có nghĩa mọi chi tiết giống nhau và bằng chứng ở khảo sát diện rộng tại các nước thu nhập thấp kém đồng nhất hơn.'
    loai: so-lieu
    nguon:
      - mccrae1997
    trich: These data strongly suggest that personality trait structure is universal.
    vi_tri: McCrae & Costa 1997, tóm tắt (n17–n18)
    ket_qua: da-lam-mem
    ghi_chu: 'Review (Claude Sonnet 5.5, 10/11/2026): sai (qua-manh). Chữ cũ (giải thích): "bằng chứng mạnh cho tính phổ quát của Big Five". Chữ mới: theo lời tác giả "rất ủng hộ" kèm lưu ý Laajaj 2019. Lý do: trang tự gắn nhãn Khá vững cho cấu trúc 5 chiều (n20) vì Laajaj 2019 và các nghiên cứu từ vựng bản địa; giải thích quiz không được mạnh hơn nhãn.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0003-066x.52.5.509" ]
    review: sai
  - id: n48
    cau: 'Câu hỏi quiz 5: tận tâm dự báo nhất quán ở cả 5 nhóm nghề; hướng ngoại dự báo ở quản lý, bán hàng, không nhất quán ở các nhóm nghề còn lại; giá trị dự báo của một chiều có thể phụ thuộc hoàn cảnh.'
    loai: phat-hien
    nguon:
      - barrick1991
    trich: Extraversion was a valid predictor for two occupations involving social interaction, managers and sales (across criterion types).
    vi_tri: 'Barrick & Mount 1991, tóm tắt [bản Internet Archive: barrick1991 PDF tr. 1]'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hướng ngoại chỉ có lợi ở những nghề cần giao tiếp nhiều". Sai một phần: hướng ngoại cũng dự báo hiệu quả đào tạo ở mọi nghề (ρ = .26). Đã sửa đáp án đúng và câu hỏi. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ (giải thích quiz): "Đây là ví dụ điển hình cho nguyên tắc không có chiều nào tốt tuyệt đối". Chữ mới: "Ví dụ này cho thấy giá trị dự báo của một chiều có thể phụ thuộc vào hoàn cảnh: hướng ngoại dự báo ở nghề giao tiếp, còn tận tâm dự báo ở mọi nhóm nghề được xét". Lý do như n41 (tận tâm dự báo dương ở mọi nhóm nghề, nên không thể nói "không chiều nào tốt tuyệt đối"). Đáp án đúng và số liệu giữ nguyên (khớp B&M 1991 tóm tắt).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1744-6570.1991.tb00688.x", "https://gwern.net/doc/psychology/personality/conscientiousness/1991-barrick.pdf" ]
    review: sai
  - id: n49
    cau: 'Phần "Ngộ nhận": "Tính cách là cố định, không đổi được" là sai: mức trung bình các chiều dịch chuyển theo tuổi và thay đổi vẫn tiếp diễn ở tuổi trưởng thành.'
    loai: phat-hien
    nguon:
      - bleidorn2013
    trich: We found strong evidence for universal personality maturation from early to middle adulthood
    vi_tri: Bleidorn 2013, tóm tắt (chi tiết ở trang tinh-cach-thay-doi)
    ket_qua: dung
    ghi_chu: Tóm một câu, link về trang nhà tinh-cach-thay-doi.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.132.1.1", "https://doi.org/10.1111/j.1467-8721.2008.00543.x" ]
  - id: n50
    cau: 'Phần "Ngộ nhận": "Hướng nội là kém, lo âu là xấu"; "Biết 5 chiều là biết hết về một người"; Big Five mô tả xu hướng trên năm chiều, điểm số không cho biết động cơ, giá trị hay câu chuyện đời.'
    loai: loi-khuyen
    nguon:
      - mccrae1989
    trich: the four MBTI indices did measure aspects of four of the five major dimensions of normal personality
    vi_tri: 'McCrae & Costa 1989, tóm tắt [bản Internet Archive: mccrae1989 PDF tr. 1]'
    ket_qua: dung
    ghi_chu: 'Câu diễn giải; chỉ nói điều Big Five không đo (động cơ, giá trị): theo định nghĩa các chiều ở McCrae & Costa 1989. Lượt 2 kiểm.'
    luot_2: dung
    luot_2_nguon: [ "https://www2.psych.ubc.ca/~dpaulhus/TEACH/567_2019/week.2/reading/B5.review.2008.1.pdf" ]
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn; bỏ dòng "Rà soát nội dung lần cuối"
    ly_do: Bố cục C (kế hoạch).
  - cu: '"Mô hình này có tên Big Five, và là khung phân loại tính cách được nghiên cứu nhiều nhất trong tâm lý học hiện đại." (đáp án Tự trải nghiệm: "Chỉ 5 chiều")'
    moi: '"Theo mô hình Big Five, đó là 5 chiều … Big Five là khung được dùng rất phổ biến trong nghiên cứu tính cách (một số nhà nghiên cứu đề xuất 6 chiều: xem mục Mức độ chắc chắn)."'
    ly_do: 'Hồ sơ n1; review: "Chỉ 5 chiều" quá chắc so với khung Khá vững và Đang tranh cãi.'
  - cu: '"Cách đo phổ biến nhất là bảng hỏi tự báo cáo"'
    moi: '"Một cách đo thường dùng là bảng hỏi tự báo cáo"'
    ly_do: Hồ sơ n4.
  - cu: '"(dù một số nghiên cứu tìm ra sáu, xem khung Đang tranh cãi)"'
    moi: '"(dù một số nghiên cứu tìm ra sáu, và ở một số quần thể cấu trúc năm chiều không lặp lại tốt: xem khung Khá vững và mục Ở Việt Nam)"'
    ly_do: Hồ sơ n5.
  - cu: '"lọc còn khoảng 4.500 từ miêu tả những đặc điểm ổn định, quan sát được"'
    moi: '"xếp khoảng 4.500 từ vào nhóm miêu tả những nét tính cách bền, ổn định của một người (như hung hăng, hướng nội, hòa đồng)"'
    ly_do: 'Hồ sơ n8: "quan sát được" không có trong Allport & Odbert 1936.'
  - cu: '"Đến NEO PI (1985), họ bổ sung hai chiều còn lại … NEO-PI-R (1992) hoàn thiện thành công cụ 240 câu hỏi, mỗi chiều gồm 6 khía cạnh"'
    moi: '"Bản NEO PI (1985) bổ sung hai chiều còn lại … NEO-PI-R (1992) là công cụ đo cả năm chiều"'
    ly_do: 'Hồ sơ n13, n14: bỏ "240 câu, 6 khía cạnh" vì không mở được sổ tay.'
  - cu: '"Một trong những bài tổng quan được trích dẫn nhiều nhất về chủ đề này là chương …"'
    moi: '"Một tổng quan chuẩn về chủ đề này là chương … Tên chương cho biết nó hệ thống hóa lịch sử, cách đo và các vấn đề khái niệm của Big Five."'
    ly_do: 'Hồ sơ n16: chỉ kiểm thông tin thư mục; không nguồn nào đếm lượt trích dẫn.'
  - cu: '"… một trong những bằng chứng mạnh nhất cho tính phổ quát của Big Five." (McCrae & Costa 1997)'
    moi: '"… các tác giả kết luận dữ liệu rất ủng hộ việc cấu trúc tính cách là phổ quát. Bằng chứng ở nơi khác kém đồng nhất hơn: … 23 nước thu nhập thấp và trung bình (Laajaj và cộng sự, 2019)."'
    ly_do: Hồ sơ n18, n19.
  - cu: Khung Vững chắc "5 chiều xuất hiện ổn định qua ngôn ngữ, văn hóa và phương pháp đo" ("hàng chục ngôn ngữ", John, Naumann & Soto 2008)
    moi: Khung Khá vững "5 chiều lặp lại qua nhiều ngôn ngữ và cách đo, nhưng chưa phải ở mọi nơi"
    ly_do: 'Hồ sơ n20: chỉ có 6 bản dịch ở McCrae & Costa 1997, Laajaj 2019 và nghiên cứu từ vựng bản địa không tái lập; thước đo mục 4.'
  - cu: Khung Khá vững "Big Five dự báo được kết quả đời sống, nhưng ở mức vừa phải"
    moi: Khung Khá vững "Big Five dự báo được kết quả công việc, nhưng ở mức nhỏ đến vừa" (kèm ρ .20–.23, .18, .15)
    ly_do: Hồ sơ n21–n23.
  - cu: 'Khung Đang tranh cãi: "phe Big Five cho rằng chiều thứ sáu có thể gộp … phe HEXACO … dự báo tốt hơn … gian lận, tham nhũng"'
    moi: '"Phe HEXACO lập luận … hệ số tương quan bội .52–.63 so với .41–.47 … Ashton và Lee (2007) cũng dẫn … khả năng quấy rối tình dục … tăng từ .34 lên .54. Đây là lập luận của những người đề xuất mô hình."'
    ly_do: 'Hồ sơ n25, n26; review: số cũ (.63/.47) chỉ là một trong ba mẫu của Lee, Ashton & de Vries 2005. Không có nguồn cho phe Big Five và cho "gian lận, tham nhũng".'
  - cu: 'Mục Các lý thuyết giải thích: "5 chiều là những xu hướng cơ bản có nền tảng sinh học … (McCrae và Costa, 1999) … ngôn ngữ cho ta thấy 5 chiều ở đâu, còn sinh học … vì sao"'
    moi: '"theo cách Bleidorn và cộng sự (2013) mô tả, lý thuyết này cho rằng sự trưởng thành của tính cách phần lớn do yếu tố di truyền quyết định."'
    ly_do: Hồ sơ n28.
  - cu: 'Mục Áp dụng 1: "Cùng một người, chỉ cần trả lời khác đi một hai câu là có thể rơi sang loại bên kia — trong khi điểm số liên tục của họ hầu như không đổi."'
    moi: '"Một tổng quan định lượng các nghiên cứu taxometric … rất ít bằng chứng thuyết phục cho các loại rời rạc (Haslam, Holland và Kuppens, 2012). Với MBTI, người có điểm ban đầu gần điểm trung tính dễ nhận loại khác khi làm lại (Howes và Carskadon, 1979, theo Pittenger, 1993)."'
    ly_do: 'Hồ sơ n29, n30: Pittenger chỉ nói về MBTI và không báo mức chênh điểm liên tục.'
  - cu: 'Mục Áp dụng 2 "Dùng Big Five để hiểu mình và hiểu người khác" (Khá vững): "Biết mình ở đâu trên 5 chiều giúp bạn chọn môi trường phù hợp … tận tâm thấp không hẳn lười … va chạm nhóm"'
    moi: '"Đọc điểm số như mức trung bình, không như nhãn": tận tâm thấp chỉ là mô tả thống kê, chưa phải đánh giá con người; hệ số dự báo công việc nhỏ đến vừa (Barrick và Mount, 1991)'
    ly_do: 'Hồ sơ n31: không nguồn nào ủng hộ các ý cũ; review bỏ nốt "lười" và "kém giao tiếp".'
  - cu: 'Mục Áp dụng 3 "Hiểu giới hạn của bảng hỏi" (Vững chắc): "bảng hỏi tự báo cáo dễ bị ảnh hưởng bởi cách ta muốn người khác nhìn mình"; một người hướng ngoại vẫn có lúc muốn ở một mình'
    moi: Chip Khá vững; thêm "phân tích tổng hợp 15 nghiên cứu … tương quan .42–.56 (Fleeson và Gallagher, 2009)"; "Ví dụ giả định"; bỏ câu về mong muốn xã hội; "mô tả các chiều của tính cách bình thường (McCrae và Costa, 1989)"
    ly_do: 'Hồ sơ n32–n34: McCrae & Costa 1989 (tr. 21) nói thang NEO-PI không bị thiên lệch mong muốn xã hội ở mẫu tình nguyện; nhãn theo thước đo mục 4.'
  - cu: '"Trong phạm vi các nguồn của bài này, chúng tôi chưa tìm thấy nghiên cứu kiểm chứng cấu trúc 5 nhân tố trên mẫu người Việt."'
    moi: '"Tính đến 11/2026, chúng tôi tìm thấy hai nghiên cứu có mẫu người Việt … (Bühler, Sharma và Stein, 2023) … (Quynh và Church, 2023) … chưa tìm thấy nghiên cứu chuẩn hóa NEO-PI-R trên mẫu người Việt đại diện."'
    ly_do: 'Hồ sơ n35–n37: câu cũ sai (OpenAlex 10/11/2026 có hai nghiên cứu); câu thời sự có hạn 2028-11-01.'
  - cu: '"nhiều bài test Big Five tiếng Việt trên mạng là bản dịch tự phát, chưa qua quy trình chuẩn hóa (dịch ngược, kiểm chứng cấu trúc nhân tố). Điểm số … không dùng cho quyết định quan trọng như tuyển dụng."'
    moi: '"bản dịch một bài test chưa qua quy trình thích ứng (dịch xuôi và dịch ngược hay dịch kép, rồi kiểm chứng độ tin cậy và cấu trúc nhân tố trên mẫu mới) thì chưa rõ có đo đúng điều bản gốc đo (International Test Commission, 2017; Laajaj và cộng sự, 2019) … cần thận trọng khi dùng cho quyết định quan trọng như tuyển dụng."'
    ly_do: 'Hồ sơ n39: mức độ lan truyền của bản dịch tự phát không có nguồn; ITC và Laajaj không nói "không dùng".'
  - cu: 'Ngộ nhận MBTI: "có nghiên cứu cho thấy khoảng một nửa số người nhận loại khác khi làm lại MBTI sau 5 tuần (Pittenger, 1993)"'
    moi: '"một nghiên cứu được Pittenger (1993) dẫn lại thấy khoảng một nửa số người được xếp lại ở ít nhất một trong bốn thang khi làm lại MBTI sau 5 tuần"'
    ly_do: Hồ sơ n40.
  - cu: 'Ngộ nhận "Hướng nội là kém, lo âu là xấu": "Tính bất ổn cảm xúc cao giúp ta nhạy với nguy hiểm; tính dễ chịu quá cao … dễ bị lợi dụng. Giá trị của mỗi chiều phụ thuộc vào hoàn cảnh." (rồi "Không chiều nào tốt hay xấu tuyệt đối")'
    moi: '"Big Five mô tả mức độ, không chấm điểm tốt hay xấu. Về công việc, Barrick và Mount (1991) thấy hướng ngoại dự báo hiệu suất ở nghề quản lý và bán hàng còn ở các nhóm nghề khác hệ số nhỏ hơn: tác dụng của một chiều phụ thuộc vào hoàn cảnh."'
    ly_do: 'Hồ sơ n41: ví dụ bất ổn cảm xúc, dễ chịu không có nguồn; "không chiều nào tốt tuyệt đối" trái với kết quả tận tâm của Barrick và Mount.'
  - cu: 'Quiz: câu 2 phương án nhiễu "Xây dựng bảng hỏi NEO-PI-R với 240 câu"; câu 4 "bằng chứng mạnh cho tính phổ quát của Big Five"; câu 5 "Vì hướng ngoại chỉ có lợi ở những nghề cần giao tiếp nhiều … nguyên tắc không có chiều nào tốt tuyệt đối"'
    moi: 'Câu 2: "Xây dựng bảng hỏi NEO-PI-R"; câu 4: các tác giả cho rằng dữ liệu rất ủng hộ tính phổ quát, kèm lưu ý Laajaj; câu 5: "hướng ngoại dự báo hiệu suất ở hai nghề cần giao tiếp … chứ không nhất quán ở các nhóm nghề còn lại; … tận tâm dự báo nhất quán ở cả 5 nhóm"; câu 3: "dù điểm liên tục của họ chênh nhau rất ít"'
    ly_do: 'Hồ sơ n45–n48: hướng ngoại cũng dự báo hiệu quả đào tạo ở mọi nghề (ρ = .26); giải thích không mạnh hơn nhãn Khá vững.'
  - cu: 'Mục Nguồn: không có Bühler 2023, Laajaj 2019, McCrae & Costa 1989, Quynh & Church 2023'
    moi: Thêm các nguồn trên và Fleeson & Gallagher 2009, Haslam và cộng sự 2012, ITC 2017, Lee, Ashton & de Vries 2005
    ly_do: Các câu mới ở mục Ở Việt Nam, Áp dụng và Đang tranh cãi.
