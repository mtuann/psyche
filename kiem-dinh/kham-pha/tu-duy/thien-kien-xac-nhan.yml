    ket_qua: dung
    ghi_chu: 'Review (Claude Sonnet 5.5, 10/11/2026): dung. Nhãn Đang tranh cãi hợp thước đo: hai bài tổng quan lớn bàn cả lợi lẫn hại, chưa có kết luận chung.'
    luot_2: dung
    luot_2_nguon: [ "https://pages.ucsd.edu/~mckenzie/KlaymanHaPsychReview1987.pdf", "https://doi.org/10.1037/1089-2680.2.2.175" ]
    luot_2_ghi_chu: "Nhãn 'Đang tranh cãi' hợp: Klayman & Ha và Nickerson đều bàn về lợi/hại."
