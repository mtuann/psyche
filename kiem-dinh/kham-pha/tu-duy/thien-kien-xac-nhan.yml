    trich: the positive test strategy can be a very good heuristic for determining the truth or falsity of a hypothesis under realistic conditions. It can, however, lead to systematic errors or inefficiencies.
    vi_tri: Klayman & Ha 1987, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "rẻ, nhanh và khá hợp lý... chỉ gây ra lỗi hệ thống trong những nhiệm vụ được thiết kế để bẫy nó". "Rẻ, nhanh" không có trong tóm tắt; "chỉ" quá mạnh so với "systematic errors or inefficiencies". Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp trích.'
