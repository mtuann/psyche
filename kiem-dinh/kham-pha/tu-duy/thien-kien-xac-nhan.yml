    cau: 'Khá vững: ta có xu hướng ưu tiên tìm và chọn thông tin phù hợp với niềm tin hay giả thuyết sẵn có.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - hart2009
      - nickerson1998
      - klayman1987
      - wason1960
    ly_do: Phân tích tổng hợp Hart và cộng sự (2009) thấy mức ưu tiên vừa phải (d = 0,36), cùng chiều với hai bài tổng quan lớn (Klayman & Ha 1987; Nickerson 1998) và thí nghiệm Wason; nhưng mẫu chủ yếu ở phương Tây, hiệu ứng đổi theo hoàn cảnh, chưa có tái lập lớn đăng ký trước hay bằng chứng đa văn hóa; thước đo mục 4 đòi "đúng ở nhiều quần thể" cho Vững chắc, nên là Khá vững.
    nguon:
      - hart2009
      - nickerson1998
      - klayman1987
      - wason1960
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đã được tìm thấy lại nhiều lần trong hơn 60 năm, ở nhiều bối cảnh và nhóm người khác nhau" (không có nguồn đã mở cho "hơn 60 năm", "nhóm người khác nhau"); ý chính đổi từ "kiểm tra giả thuyết bằng bằng chứng phù hợp với nó" sang "tìm và chọn thông tin phù hợp" vì phân tích tổng hợp duy nhất đo việc chọn thông tin. Chỗ khó: Nickerson (1998) và Klayman & Ha (1987) là tổng quan kể, không hệ thống; thước đo Vững chắc nhờ phân tích tổng hợp Hart. Review cân nhắc. Review (Claude Sonnet 5.5, 10/11/2026): sai. Nhãn Vững chắc quá cao (theo lượt 2, mẫu của Hart 2009 chủ yếu phương Tây, tôi không mở được toàn văn để đếm nước). Chữ cũ: "Vững chắc: ..." -> "Khá vững: ..."; trang thêm câu giới hạn.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4797953/", "https://sites.uci.edu/peterdittolab/files/2018/06/Ditto-et-al.-2018-At-Least-Bias-is-Bipartisan-A-Meta-Analytic-Comparison-of-Partisan-Bias-in-Liberals-Conservatives.pdf" ]
    luot_2_ghi_chu: "câu đúng: Có phân tích tổng hợp (Hart 2009, d = 0,36) cho thấy ưu tiên thông tin hợp niềm tin sẵn có, nhưng mẫu chủ yếu phương Tây và hiệu ứng thay đổi theo hoàn cảnh; nhãn phù hợp hơn là Khá vững.; Hart và cộng sự (2009) là phân tích tổng hợp tốt, d=0,36, nhưng chỉ gồm mẫu Mỹ, Canada, Đức, Úc, Ý và hiệu ứng thay đổi mạnh theo biến điều tiết; chưa có tái lập lớn có đăng ký trước hay bằng chứng đa văn hóa. Theo thước đo mục 4, 'Vững chắc' đòi 'đúng ở nhiều quần thể'; mẫu chủ yếu phương Tây là điều kiện của 'Khá vững'."
    review: sai
