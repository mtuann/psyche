nhan_dinh:
  - id: n1
    cau: Nhiệm vụ 2–4–6 của Wason (1960) cho thấy ta có xu hướng tìm bằng chứng ủng hộ giả thuyết của mình thay vì tìm cách bác bỏ nó (mô tả của trang).
    loai: phat-hien
    nguon:
      - wason1960
      - nickerson1998
    trich: People typically tested hypothesized rules by producing only triplets that were consistent with them.
    vi_tri: Nickerson 1998, mô tả nhiệm vụ của Wason (1960)
    ket_qua: dung
    ghi_chu: Mô tả (description). "Cái giá của thói quen đó" là lời dẫn chung, được các câu sau của trang kiểm.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/17470216008416717" ]
    luot_2_ghi_chu: Đọc toàn văn qua Internet Archive (bản PDF của nhà xuất bản).
  - id: n2
    cau: Quy tắc thật của Wason chỉ là ba số tăng dần bất kỳ; dãy 2–3–4 đúng, dãy 1–5–100 cũng đúng.
    loai: dinh-nghia
    nguon:
      - wason1960
    trich: In the experiment the concept to be attained is "three numbers in increasing order of magnitude."
    vi_tri: Wason 1960, mở bài
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/17470216008416717" ]
    luot_2_ghi_chu: Đọc toàn văn qua Internet Archive (bản PDF của nhà xuất bản).
  - id: n3
    cau: Nhiều người đoán một quy tắc hẹp hơn quy tắc thật, chẳng hạn mỗi số hơn số trước 2 đơn vị; trong thí nghiệm của Wason gần như mọi quy tắc sai đều thuộc kiểu hẹp hơn.
    loai: phat-hien
    nguon:
      - wason1960
    trich: (In nearly all cases incorrect rules were sufficient ones, e.g. "increasing intervals of two.")
    vi_tri: Wason 1960, Results (a)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Hầu hết mọi người đoán quy tắc là "số chẵn, mỗi số hơn số trước 2 đơn vị"". Chữ mới theo chữ của Wason: quy tắc sai gần như luôn là quy tắc "đủ" (hẹp hơn quy tắc thật), ví dụ "tăng đều 2 đơn vị"; Wason không nói "số chẵn" hay "hầu hết mọi người". Review (Claude Sonnet 5.5, 10/11/2026): dung. Chữ cuối khớp Wason (Results a).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/17470216008416717" ]
    luot_2_ghi_chu: Đọc toàn văn qua Internet Archive (bản PDF của nhà xuất bản).
    review: dung
  - id: n4
    cau: Các dãy như 8–10–12, 20–22–24, 100–102–104 đều nhận "đúng" vì thỏa quy tắc thật, nên không dãy nào cho thấy phỏng đoán "số chẵn tăng đều" là sai.
    loai: phat-hien
    nguon:
      - nickerson1998
    trich: the strategy of using only sets of successive even numbers would not reveal the incorrectness of the hypothesis because every test item would get a positive response.
    vi_tri: Nickerson 1998, mục về nhiệm vụ của Wason
    ket_qua: dung
    ghi_chu: Các dãy 8–10–12, 20–22–24, 100–102–104 là ví dụ minh họa của trang; phần logic theo Nickerson.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/17470216008416717" ]
    luot_2_ghi_chu: Đọc toàn văn qua Internet Archive (bản PDF của nhà xuất bản). Các dãy 8-10-12... đều tăng dần nên được nhận 'đúng', và cũng phù hợp phỏng đoán hẹp.
  - id: n5
    cau: Họ thường nêu quy tắc sai chỉ sau vài lần thử (trung bình 3,7 dãy trước lần nêu sai đầu tiên).
    loai: so-lieu
    nguon:
      - wason1960
    trich: the mean number before making a first incorrect announcement was 3-68 (range I to 7).
    vi_tri: Wason 1960, Results (b)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "càng thử họ càng tin mình đã tìm ra quy tắc" (không có trong Wason). Chữ mới theo số liệu: nêu sai sau trung bình 3,68 dãy (khoảng 1–7; OCR in "3-68", "I to 7"). Review (Claude Sonnet 5.5, 10/11/2026): dung. 3,68 làm tròn 3,7, khớp trích.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/17470216008416717" ]
    luot_2_ghi_chu: Đọc toàn văn qua Internet Archive (bản PDF của nhà xuất bản).
    review: dung
  - id: n6
    cau: Dãy đáng thử nhất là dãy có khả năng làm phỏng đoán sụp đổ, ví dụ 2–3–4 (không còn là số chẵn cách nhau 2); nếu dãy đó vẫn "đúng" thì phỏng đoán quá hẹp.
    loai: loi-khuyen
    nguon:
      - wason1960
    trich: no confirming instance of a law is a verifying instance, but that any disconfirming instance is a falsifying instance.
    vi_tri: Wason 1960, mở bài (trích Von Wright, 1951)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "2–3–4 (số lẻ, tăng không đều)": sai, 2–3–4 tăng đều 1 và chỉ có một số lẻ. Chữ mới: "không còn là số chẵn cách nhau 2". Mở rộng: Wason lưu ý một dãy không tuân thủ quy tắc thật cũng chưa chắc loại được quy tắc đủ. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp logic Wason (quy tắc đủ chỉ bị loại bởi dãy dương tính trái phỏng đoán).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/17470216008416717", "https://doi.org/10.1037/1089-2680.2.2.175" ]
    luot_2_ghi_chu: Đọc toàn văn qua Internet Archive (bản PDF của nhà xuất bản). Lời khuyên hợp với logic của Wason; 2-3-4 thỏa quy tắc thật nhưng trái phỏng đoán 'số chẵn'.
    review: dung
  - id: n7
    cau: 'Thiên kiến xác nhận (confirmation bias): xu hướng tìm hoặc diễn giải bằng chứng theo hướng có lợi cho niềm tin, kỳ vọng hay giả thuyết sẵn có.'
    loai: dinh-nghia
    nguon:
      - nickerson1998
    trich: Confirmation bias, as the term is typically used in the psychological literature, connotes the seeking or interpreting of evidence in ways that are partial to existing beliefs, expectations, or a hypothesis in hand.
    vi_tri: Nickerson 1998, tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/1089-2680.2.2.175" ]
    luot_2_ghi_chu: Đọc toàn văn.
  - id: n8
    cau: Khi đã có giả thuyết, ta còn có xu hướng ghi nhớ chi tiết "cùng phe" và xem nhẹ hay quên bằng chứng trái chiều.
    loai: phat-hien
    nguon:
      - nickerson1998
    trich: participants were likely to recall the evidence as being more consistent with the theories than it actually was.
    vi_tri: Nickerson 1998, mục về tìm kiếm và diễn giải thông tin (dẫn Kuhn, 1989)
    ket_qua: da-lam-mem
    ghi_chu: 'Nickerson dẫn Kuhn 1989: người tham gia nhớ bằng chứng là nhất quán với lý thuyết hơn thực tế; "bỏ qua, xem nhẹ" khớp trích "failed to acknowledge discrepant evidence". "Quên mất bằng chứng trái ngược" viết thành "xem nhẹ hay quên" (làm mềm). Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp Nickerson (dẫn Kuhn 1989) cho phần nhớ; "xem nhẹ hay quên" là mức làm mềm đủ.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/1089-2680.2.2.175" ]
    luot_2_ghi_chu: Nickerson có mục Memory về nhớ có chọn lọc.
    review: dung
  - id: n9
    cau: 'Thiên kiến xác nhận thường không phải cố tình tự lừa dối mình: Nickerson mô tả nó là sự chọn lọc không chủ ý trong việc thu thập và dùng bằng chứng.'
    loai: phat-hien
    nguon:
      - nickerson1998
    trich: It refers usually to unwitting selectivity in the acquisition and use of evidence.
    vi_tri: Nickerson 1998, mở bài
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "không đòi hỏi ta phải cố tình tự lừa dối mình. Trong trò chơi 2–4–6, người tham gia không hề gian lận: họ thực sự tin rằng mình đang kiểm tra giả thuyết một cách nghiêm túc". Wason không báo cáo điều người tham gia "tin"; chữ mới dựa vào Nickerson. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp trích.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/1089-2680.2.2.175" ]
    luot_2_ghi_chu: Đọc toàn văn.
    review: dung
  - id: n10
    cau: Ở nhiệm vụ 2–4–6, có cách giải thích rằng người tham gia xác nhận không phải vì muốn, mà vì không nghĩ ra cách bác bỏ (Evans, theo Nickerson).
    loai: phat-hien
    nguon:
      - nickerson1998
    trich: Subjects confirm, not because they want to, but because they cannot think of the way to falsify.
    vi_tri: Nickerson 1998, mục giải thích (trích Evans, 1989, tr. 42)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/1089-2680.2.2.175" ]
    luot_2_ghi_chu: Đọc toàn văn.
  - id: n11
    cau: Chỉ thử những dãy "khớp" với một phỏng đoán hẹp hơn quy tắc thật thì về mặt logic không thể cho thấy phỏng đoán đó sai.
    loai: phat-hien
    nguon:
      - nickerson1998
    trich: they precluded themselves from discovering that it was incorrect if the triplets it prescribed constituted a subset of those prescribed by the actual rule.
    vi_tri: Nickerson 1998, mục về nhiệm vụ của Wason
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/17470216008416717" ]
    luot_2_ghi_chu: Suy ra từ logic Wason trình bày.
  - id: n12
    cau: Peter Wason làm thí nghiệm 2–4–6 ở University College London, năm 1960.
    loai: lich-su
    nguon:
      - wason1960
    trich: From the Medical Research Council Industrial Psychology Research Group, University College, London
    vi_tri: Wason 1960, đầu bài
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "nhà tâm lý học người Anh Peter Wason" và "ở Anh". Bài ghi cơ quan ở Luân Đôn; quốc tịch của Wason không có trong bài, nên chữ mới dùng nơi làm việc. Review (Claude Sonnet 5.5, 10/11/2026): dung. UCL, 1960 khớp trang bài.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/17470216008416717" ]
    luot_2_ghi_chu: Đọc toàn văn qua Internet Archive (bản PDF của nhà xuất bản).
    review: dung
  - id: n13
    cau: Người tham gia là 29 sinh viên đại học ngành tâm lý (17 nam, 12 nữ), được thử riêng từng người.
    loai: so-lieu
    nguon:
      - wason1960
    trich: The subjects, z.9 psychology undergraduates (17 men and 12 women), were examined individually and instructed as follows
    vi_tri: Wason 1960, Procedure
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "29 người trưởng thành". Chữ mới: 29 sinh viên đại học ngành tâm lý (OCR in "z.9" cho 29; Bảng I ghi n = 29); thêm giới tính. Review (Claude Sonnet 5.5, 10/11/2026): dung. 29, 17 nam 12 nữ khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/17470216008416717" ]
    luot_2_ghi_chu: Đọc toàn văn qua Internet Archive (bản PDF của nhà xuất bản).
    review: dung
  - id: n14
    cau: Người tham gia viết ra từng dãy ba số kèm lý do chọn; sau mỗi dãy, Wason cho biết dãy đó có tuân theo quy tắc hay không; họ chỉ nêu quy tắc khi đã rất tự tin.
    loai: phat-hien
    nguon:
      - wason1960
    trich: Your aim is to discover this rule by writing down sets of three numbers, together with reasons for your choice of them. After you have written down each set, I shall tell you whether your numbers conform to the rule or not
    vi_tri: Wason 1960, Procedure
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Họ được yêu cầu ghi lại các giả thuyết của mình trong quá trình thử". Wason yêu cầu ghi lý do chọn mỗi dãy, không phải ghi giả thuyết; "when you feel highly confident ... you are to write it down" khớp "chỉ công bố khi đã chắc". Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp trích.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/17470216008416717" ]
    luot_2_ghi_chu: Đọc toàn văn qua Internet Archive (bản PDF của nhà xuất bản).
    review: dung
  - id: n15
    cau: Nếu quy tắc nêu ra sai thì người tham gia được báo rồi thử tiếp; buổi thử dừng khi họ nêu đúng, quá 45 phút, hay muốn bỏ cuộc.
    loai: phat-hien
    nguon:
      - wason1960
    trich: The experiment continued until the correct rule was announced, or the time for the session exceeded 45 minutes, or the subject expressed a wish to give up.
    vi_tri: Wason 1960, Procedure
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "được đề xuất bao nhiêu dãy ba số tùy thích": bài ghi không giới hạn số dãy, nhưng buổi thử có dừng; chữ mới nêu điều kiện dừng. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp trích.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/17470216008416717" ]
    luot_2_ghi_chu: Đọc toàn văn qua Internet Archive (bản PDF của nhà xuất bản).
    review: dung
  - id: n16
    cau: Trong 29 người, 6 người tìm ra quy tắc đúng mà không nêu sai lần nào trước đó; 13 người nêu sai một lần; 9 người nêu sai từ hai lần trở lên; 1 người không đưa ra kết luận nào.
    loai: so-lieu
    nguon:
      - wason1960
    trich: Six out of 29 subjects reached the correct conclusion without previous incorrect ones, 13 reached one incorrect conclusion, nine reached two or more incorrect conclusions, and one reached no conclusion.
    vi_tri: Wason 1960, tóm tắt
    ket_qua: dung
    ghi_chu: 'theo G1-L02: KHỚP (tóm tắt); đối chiếu lại tóm tắt và Bảng I trong toàn văn.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/17470216008416717" ]
    luot_2_ghi_chu: Đọc toàn văn qua Internet Archive (bản PDF của nhà xuất bản).
  - id: n17
    cau: Gần như mọi quy tắc sai là quy tắc hẹp hơn quy tắc thật, ví dụ "tăng đều 2 đơn vị".
    loai: phat-hien
    nguon:
      - wason1960
    trich: (In nearly all cases incorrect rules were sufficient ones, e.g. "increasing intervals of two.")
    vi_tri: Wason 1960, Results (a)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "gần như chỉ đề xuất các dãy phù hợp với giả thuyết của mình (ví dụ toàn số chẵn tăng đều)... Những dãy có thể bác bỏ giả thuyết — như dãy gồm số lẻ tăng dần — hiếm khi được thử". Chữ mới theo số liệu của Wason (n18, n19); "số chẵn" và "số lẻ tăng dần" không có trong Wason. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp trích.'
