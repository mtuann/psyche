  - id: n33
    cau: 'Klayman và Ha (1987) lập luận rằng nhiều hiện tượng gọi là thiên kiến xác nhận thực chất là chiến lược kiểm tra tích cực: thử những trường hợp được cho là có đặc tính cần kiểm tra thay vì những trường hợp được cho là không có.'
    loai: phat-hien
    nguon:
      - klayman1987
    trich: many phenomena labeled "confirmation bias" are better understood in terms of a general positive test strategy. With this strategy, there is a tendency to test cases that are expected (or known) to have the property of interest rather than those expected (or known) to lack that property.
    vi_tri: Klayman & Ha 1987, tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pages.ucsd.edu/~mckenzie/KlaymanHaPsychReview1987.pdf" ]
