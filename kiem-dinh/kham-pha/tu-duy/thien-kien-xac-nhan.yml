    cau: 'Đang tranh cãi: đó có phải là một thiên kiến có hại hay không.'
    loai: nhan
    nhan: tranh-cai
    co_so:
      - klayman1987
      - nickerson1998
    ly_do: Klayman & Ha (1987) lập luận nhiều hiện tượng gọi là "thiên kiến xác nhận" hiểu tốt hơn như chiến lược kiểm tra tích cực, có thể rất tốt trong điều kiện thực tế dù đôi khi gây lỗi hệ thống; Nickerson (1998) nêu câu hỏi về lợi và hại của nó và xem xét cả hai phía. Bằng chứng hai phía đều có, chưa có kết luận chung về việc nó "có hại" hay "hợp lý".
    nguon:
