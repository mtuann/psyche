    ghi_chu: 'OpenAlex ngày 10/11/2026, hai truy vấn ở danh sách nguồn: không có. Chưa tìm Google Scholar hay tạp chí trong nước. Chữ cũ không có mốc thời gian ("Chúng tôi chưa tìm thấy..."); thêm "Tính đến 11/2026" và ghi rõ nơi tìm ở trang. Chữ cũ cũng nói "các lần làm lại sau đó chủ yếu dùng người tham gia ở các nước phương Tây" (không kiểm được, đã bỏ). Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: "các dạng thiên kiến xác nhận tương tự" quá rộng (có khảo sát VN30 2026, DOI 10.71374/jfar.v26.i2.75, tóm tắt OpenAlex) -> thu hẹp thành nghiên cứu thực nghiệm hay hành vi, nêu khảo sát đó. Hạn 2028-11-01 giữ.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://doi.org/10.71374/jfar.v26.i2.75" ]
    luot_2_ghi_chu: "câu đúng: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu thực nghiệm nào dùng nhiệm vụ 2-4-6 hay kiểm tra thiên kiến xác nhận bằng hành vi trên người Việt; chỉ thấy khảo sát tự báo cáo về thiên kiến xác nhận ở nhà đầu tư chứng khoán (2026) và chưa đủ để kết luận người Việt 'miễn nhiễm' hay 'dễ mắc hơn'.; Kiểm ngày 10/11/2026 qua OpenAlex: không thấy nghiên cứu 2-4-6 trên người Việt (đúng). Nhưng có khảo sát tự báo cáo (SEM) về 'thiên kiến xác nhận' ở nhà đầu tư VN30 (2026), nên 'các dạng thiên kiến xác nhận tương tự' là quá rộng. Chỉ đọc tóm tắt."
    review: sai
  - id: n50
    cau: Sự phân cực do người tham gia tự báo cáo về án tử hình rõ hơn ở người có quan điểm ban đầu cực đoan so với vừa phải (Miller và cộng sự, 1993); ở những chủ đề người Việt có niềm tin mạnh, ta có thể dự đoán hiệu ứng tương tự, nhưng đó chỉ là dự đoán.
    loai: phat-hien
    nguon:
      - miller1993
    trich: Polarization was observed for reported attitude change on capital punishment and generally stronger in Ss with extreme than moderate attitudes.
    vi_tri: Miller 1993, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "phân cực rõ hơn ở người có quan điểm ban đầu cực đoan"; thêm "do người tham gia tự báo cáo về án tử hình" và "so với vừa phải" cho đúng tóm tắt (Miller: tự báo cáo, chủ đề án tử hình, "generally stronger"). theo G1-L02: không có khớp từ Lord 1979 gốc; nguồn đúng là Miller. Câu dự đoán đã ghi rõ là suy luận. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp trích Miller 1993; phần dự đoán nói rõ là dự đoán.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0022-3514.64.4.561" ]
    luot_2_ghi_chu: Chỉ đọc tóm tắt; phần 'dự đoán' được ghi rõ là dự đoán.
    review: dung
  - id: n51
    cau: Người tham gia của Wason là sinh viên được mô tả là thông minh, và Nickerson (1998) nhấn mạnh thiên kiến này cũng được thấy ở những người làm khoa học.
    loai: phat-hien
    nguon:
      - wason1960
      - nickerson1998
    trich: This investigation examines the extent to which intelligent young adults seek (i) confirming evidence alone (enumerative induction) or (ii) confirming and discontinuing evidence (eliminative induction)
    vi_tri: Wason 1960, tóm tắt; Nickerson 1998 mục "Science"
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "được ghi nhận ở rất nhiều nhóm người khác nhau". Chữ mới theo hai nguồn đã mở. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/17470216008416717", "https://doi.org/10.1037/1089-2680.2.2.175" ]
    luot_2_ghi_chu: Đọc toàn văn cả hai.
    review: dung
  - id: n52
    cau: Mười dãy số chẵn tăng đều đều "đúng" cũng không loại trừ được quy tắc thật; số lượng bằng chứng khẳng định không bù được cho sự vắng mặt của một phép thử bác bỏ.
    loai: loi-khuyen
    nguon:
      - nickerson1998
      - wason1960
    trich: they precluded themselves from discovering that it was incorrect if the triplets it prescribed constituted a subset of those prescribed by the actual rule.
    vi_tri: Nickerson 1998, mục về nhiệm vụ của Wason
    ket_qua: dung
    ghi_chu: Suy luận logic từ trích; "mười dãy" là ví dụ của trang.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/17470216008416717" ]
    luot_2_ghi_chu: Lời khuyên khớp logic Wason.
  - id: n53
    cau: 'Đọc thêm: bài "Vì sao ta tin điều vô lý?" (lập luận có động cơ) và "Vì sao ta khó đổi ý khi đã chọn?" (bất hòa nhận thức) có trên site.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: trang.yml có kham-pha/tu-duy/tin-dieu-vo-ly và kham-pha/tam-ly-xa-hoi/bat-hoa-nhan-thuc; link nội bộ đúng. Trang sau chưa khóa nên hiện "sắp có" ở bản thật. Review (Claude Sonnet 5.5, 10/11/2026): dung. Link đúng, trang có trong trang.yml.'
    review: dung
  - id: n54
    cau: Phần "Mức độ chắc chắn" của trang gắn nhãn tranh cãi cho cách diễn giải hiện tượng (hành vi vững chắc, gọi là "thiên kiến có hại" hay "lối tắt hợp lý" thì còn bàn cãi).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên trang: có khung Vững chắc và khung Đang tranh cãi trong mục "Mức độ chắc chắn". Review (Claude Sonnet 5.5, 10/11/2026): dung. Trang có khung Đang tranh cãi ở mục Mức độ chắc chắn. Sau review khung hành vi là Khá vững: đã sửa chữ "hành vi thì vững chắc" trong giải thích quiz thành "khá vững".'
    review: dung
  - id: n55
    cau: 'Câu hỏi 1: các dãy như 8–10–12, 20–22–24 không giúp vì chúng phù hợp cả với phỏng đoán sai ("số chẵn tăng đều") lẫn quy tắc thật ("ba số tăng dần bất kỳ"), nên không loại trừ được gì; một phép thử chỉ có giá trị khi có khả năng chứng minh bạn sai.'
    loai: phat-hien
    nguon:
      - nickerson1998
      - wason1960
    trich: the strategy of using only sets of successive even numbers would not reveal the incorrectness of the hypothesis because every test item would get a positive response.
    vi_tri: Nickerson 1998, mục về nhiệm vụ của Wason
    ket_qua: dung
    ghi_chu: Quiz câu 1 (đáp án đúng và giải thích).
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/17470216008416717" ]
    luot_2_ghi_chu: Câu quiz khớp bài gốc.
  - id: n56
    cau: 'Câu hỏi 2: chỉ 6 trong 29 người tìm ra quy tắc đúng mà không nêu sai lần nào; phần lớn nêu sai ít nhất một lần (13 + 9 = 22 người).'
    loai: so-lieu
    nguon:
      - wason1960
    trich: Six out of 29 subjects reached the correct conclusion without previous incorrect ones, 13 reached one incorrect conclusion, nine reached two or more incorrect conclusions, and one reached no conclusion.
    vi_tri: Wason 1960, tóm tắt
    ket_qua: dung
    ghi_chu: Quiz câu 2. Giải thích "chỉ thử những dãy phù hợp phỏng đoán" khớp n17–n19.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/17470216008416717" ]
    luot_2_ghi_chu: 13 + 9 = 22. Đọc toàn văn qua Internet Archive (bản PDF của nhà xuất bản).
  - id: n57
    cau: 'Câu hỏi 3: theo Klayman và Ha (1987), nhiều hiện tượng gọi là "thiên kiến xác nhận" thực chất là chiến lược kiểm tra tích cực, có thể là cách làm tốt trong điều kiện thực tế nhưng đôi khi gây lỗi hệ thống.'
    loai: phat-hien
    nguon:
      - klayman1987
    trich: the positive test strategy can be a very good heuristic for determining the truth or falsity of a hypothesis under realistic conditions. It can, however, lead to systematic errors or inefficiencies.
    vi_tri: Klayman & Ha 1987, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Quiz câu 3: chữ cũ "thường hợp lý, chỉ gây lỗi trong một số nhiệm vụ"; chữ mới theo tóm tắt. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pages.ucsd.edu/~mckenzie/KlaymanHaPsychReview1987.pdf" ]
    luot_2_ghi_chu: Đọc toàn văn.
    review: dung
  - id: n58
    cau: 'Câu hỏi 4: mỗi phe đánh giá nghiên cứu ủng hộ mình là thuyết phục hơn, và cả hai đều nói thái độ của mình cực đoan hơn theo hướng ban đầu (tự báo cáo).'
    loai: phat-hien
    nguon:
      - lord1979
      - miller1993
    trich: subjects reported that their attitudes had become more extreme in the direction of their initial point of view after evaluating the research evidence
    vi_tri: Miller 1993, đoạn mở bài (tóm Lord 1979)
    ket_qua: da-sua
    ghi_chu: 'Quiz câu 4 (đáp án đúng); theo G1-L02 đã làm mềm "hai phe càng xa nhau" thành "nói mình tin chắc hơn". Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: "cả hai đều nói mình tin chắc hơn trước"; sửa cho khớp tóm tắt Lord 1979 (attitudes more extreme, reported).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0022-3514.37.11.2098", "https://doi.org/10.1037/0022-3514.64.4.561" ]
    luot_2_ghi_chu: Chỉ tóm tắt. Lord đo 'cực đoan hơn' do tự báo cáo; 'tin chắc hơn' trong ngoặc được giải thích đúng là cực đoan hơn.
    review: sai
  - id: n59
    cau: 'Câu hỏi 5: kỹ thuật "xét điều ngược lại" giúp đánh giá bằng chứng bớt thiên lệch hơn lời dặn chung chung hãy công bằng; nó không đảm bảo bạn sẽ đổi ý.'
    loai: phat-hien
    nguon:
      - lord1984
    trich: the induction of a consider-the-opposite strategy had greater corrective effect than more demand-laden alternative instructions to be as fair and unbiased as possible.
    vi_tri: Lord 1984, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Quiz câu 5. Chữ cũ: "cũng đủ làm giảm sự diễn giải thiên lệch... chỉ đảm bảo bạn đã thực sự lắng nghe phía bên kia". Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0022-3514.47.6.1231", "https://doi.org/10.1111/jasp.12968" ]
    luot_2_ghi_chu: Chỉ đọc tóm tắt; câu 'không đảm bảo đổi ý' đúng vì thiết kế đo độ thiên lệch, không đo đổi ý.
    review: dung
