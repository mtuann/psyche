    ghi_chu: 'Chữ cũ: "Hầu như ai cũng có xu hướng … (đa số nghĩ mình lái xe, dạy học, hài hước hơn mức trung bình — điều bất khả thi về mặt toán học)". Chữ mới: "Nhìn chung, người ta có xu hướng …" (bài gốc: "the average person"), bỏ "ai cũng" và "bất khả thi về mặt toán học". Xem n13 về ví dụ. Review (Claude Opus 5.5, 10/11/2026): đã tự mở toàn văn Kruger & Dunning 1999 (gwern.net/doc/psychology/1999-kruger.pdf): chữ cuối trên trang khớp.'
