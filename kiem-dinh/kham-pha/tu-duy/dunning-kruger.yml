    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: không có (đoạn mới). K&M: sai lệch bất đối xứng do hồi quy và better-than-average; trang dùng "chủ yếu là hiệu ứng thống kê", nhẹ hơn nên cần cân nhắc ở review. Review (Claude Opus 5.5, 10/11/2026): chỉ có tóm tắt; chữ trên trang không vượt tóm tắt. Tóm tắt: sai lệch bất đối xứng được dự đoán bởi hồi quy thống kê và heuristic better-than-average, hết bất đối xứng khi loại một trong hai. Với riêng người giỏi đánh giá thấp mình thì yếu tố là hồi quy, nên "chủ yếu là hiệu ứng thống kê" đúng ý.'
