    loai: nhan
    nhan: vung-chac
    co_so:
      - zell2020
    ly_do: 'Phân tích tổng hợp 124 bài, 291 mẫu, hơn 950.000 người thấy hiệu ứng ổn định (dz = 0,78, 95% CI 0,71–0,84), ít dấu hiệu thiên lệch xuất bản; hiệu ứng có ở cả người Mỹ gốc Âu và người Đông Á (nhỏ hơn). Đạt Vững chắc theo mục 4 (một phân tích tổng hợp chất lượng tốt; nhiều quần thể; không có thất bại tái lập). Chữ cũ của khung: "tự đánh giá mình cao hơn thực tế" (mạnh hơn nguồn: BTAE đo so với người khác, không đo so với thực tế); đã làm mềm thành "tự xếp mình trên mức trung bình".'
    nguon:
      - zell2020
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ của ý chính: "con người nhìn chung tự đánh giá mình cao hơn thực tế". BTAE là so sánh với người khác; bài của Zell nói riêng về "comparative self-evaluation". Chỉ đọc tóm tắt. Review (Claude Opus 5.5, 10/11/2026): giữ Vững chắc: một phân tích tổng hợp lớn (Zell 2020: 291 mẫu, hơn 950.000 người, dz = 0,78, ít thiên lệch xuất bản), có ở nhiều quần thể (nhỏ hơn ở người Đông Á). Đạt mục 4. Ý chính đã thu về "tự xếp mình trên mức trung bình" (so với người khác), đúng phạm vi của Zell.'
