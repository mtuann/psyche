    review: 'dung'
  - id: n5
    cau: Siêu nhận thức (metacognition) là "biết về cái biết của mình".
    loai: dinh-nghia
    nguon:
      - kruger1999
    trich: what cognitive psychologists variously term metacognition
    vi_tri: Mục "Competence and Metacognitive Skills"
    ket_qua: dung
    ghi_chu: Định nghĩa của site ("biết về cái biết của mình") khớp cách bài gốc nối khái niệm với năng lực nhận ra đúng sai; chưa mở từ điển APA.
  - id: n6
    cau: Kỹ năng để làm đúng một việc và kỹ năng để nhận ra mình đang làm sai thường là cùng một bộ kỹ năng.
    loai: phat-hien
    nguon:
      - kruger1999
    trich: the skills that engender competence in a particular domain are often the very same skills necessary to evaluate competence in that domain-one's own or anyone else's.
    vi_tri: Introduction (đoạn "In essence, we argue…")
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "là cùng một kỹ năng" (khung Tự trải nghiệm và đáp án quiz câu 1); chữ mới: "thường là cùng một bộ kỹ năng". Lý do: bài gốc nói "often". Theo G1-L02: KHỚP (ý chính). Review (Claude Opus 5.5, 10/11/2026): đã tự mở toàn văn Kruger & Dunning 1999 (gwern.net/doc/psychology/1999-kruger.pdf): chữ cuối trên trang khớp.'
    review: 'dung'
  - id: n7
    cau: Hai nhà tâm lý học Justin Kruger và David Dunning (Cornell) là tác giả bài gốc năm 1999.
    loai: lich-su
    nguon:
      - kruger1999
      - ig2000
    trich: Justin Kruger and David Dunning Cornell University
    vi_tri: Trang đầu bài (JPSP 1999, 77(6), 1121–1134)
    ket_qua: dung
    ghi_chu: Ig Nobel ghi Kruger sau đó ở Đại học Illinois; trang chỉ nói Cornell khi nói về nghiên cứu, khớp tiêu đề bài.
  - id: n8
    cau: 'Hiệu ứng Dunning–Kruger: người kém nhất trong một lĩnh vực đánh giá năng lực của mình cao hơn thực tế nhiều nhất, người giỏi nhất hơi đánh giá thấp mình.'
    loai: dinh-nghia
    nguon:
      - kruger1999
    trich: Although these individuals scored at the 12th percentile on average, they nevertheless believed that their general logical reasoning ability fell at the 68th percentile
    vi_tri: Nghiên cứu 2, Results
    ket_qua: dung
    ghi_chu: 'Định nghĩa theo bài gốc; Gignac & Zajenkowski (2020, Introduction) phát biểu cùng ý: "the misestimation of ability is larger at the lower end of the spectrum of objectively measured ability than at the higher end". Phần nhóm giỏi nhất hơi đánh giá thấp: xem n30.'
  - id: n9
    cau: 'Cơ chế được đề xuất: "gánh nặng kép": người thiếu năng lực vừa không làm tốt, vừa không đủ năng lực để nhận ra mình làm không tốt.'
    loai: dinh-nghia
    nguon:
      - kruger1999
    trich: Not only do these people reach erroneous conclusions and make unfortunate choices, but their incompetence robs them of the metacognitive ability to realize it.
    vi_tri: Tóm tắt (abstract)
    ket_qua: dung
  - id: n10
    cau: 'Kruger và Dunning viết: những kỹ năng giúp làm đúng thường chính là những kỹ năng cần để nhận ra đâu là đúng, của mình hay của người khác.'
    loai: phat-hien
    nguon:
      - kruger1999
    trich: the skills that engender competence in a particular domain are often the very same skills necessary to evaluate competence in that domain-one's own or anyone else's.
    vi_tri: Introduction
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Như Dunning diễn đạt: những kỹ năng bạn cần để đưa ra đáp án đúng chính là những kỹ năng bạn cần để nhận ra đâu là đáp án đúng." Chữ mới gán cho hai tác giả và thêm "thường" theo "often". Theo G1-L02: KHỚP. Review (Claude Opus 5.5, 10/11/2026): đã tự mở toàn văn Kruger & Dunning 1999 (gwern.net/doc/psychology/1999-kruger.pdf): chữ cuối trên trang khớp.'
    review: 'dung'
  - id: n11
    cau: Họ ví với anosognosia, một chứng thần kinh do tổn thương phần phải của não, khiến người bệnh liệt nửa người bên trái mà không nhận ra mình bị liệt.
    loai: phat-hien
    nguon:
      - kruger1999
    trich: anosognosia leaves people paralyzed on the left side of their body. But more than that
    vi_tri: General Discussion (đoạn đầu)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ông ví von với anosognosia, một triệu chứng thần kinh trong đó bệnh nhân mất một chức năng (thậm chí mù hay liệt) mà vẫn khăng khăng mình bình thường". Bài gốc mô tả anosognosia là liệt nửa người trái do tổn thương nửa phải của não và không nhận ra mình liệt, và nói "we proposed a psychological analogue" (hai tác giả, không riêng Dunning); bỏ "mù" vì bài không nói. Review (Claude Opus 5.5, 10/11/2026): đã tự mở toàn văn Kruger & Dunning 1999 (gwern.net/doc/psychology/1999-kruger.pdf): chữ cuối trên trang khớp. (anosognosia: "Caused by certain types of damage to the right side of the brain, anosognosia leaves people paralyzed on the left side of their body").'
    review: 'dung'
  - id: n12
    cau: Nhìn chung, người ta có xu hướng tự xếp mình trên mức trung bình (better-than-average effect), điều trái với logic của thống kê mô tả.
    loai: dinh-nghia
    nguon:
      - kruger1999
    trich: the tendency of the average person to believe he or she is above average, a result that defies the logic of descriptive statistics
