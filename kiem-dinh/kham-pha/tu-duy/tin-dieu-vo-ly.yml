    ly_do: Hồ sơ t20, t21.
  - cu: 'Kahan 2013: "Năng lực tư duy phản biện không bảo vệ ta … bào chữa … tinh vi hơn"; heading "càng cao, càng dễ suy luận theo phe"'
    moi: Mô tả đúng thiết kế (1.750 người, ba điều kiện); heading dạng câu hỏi; thêm lưu ý của Tappin 2021
    ly_do: Hồ sơ t26–t32.
  - cu: Khung Vững chắc "ta có xu hướng suy luận theo hướng bảo vệ kết luận mình muốn" (không nguồn)
