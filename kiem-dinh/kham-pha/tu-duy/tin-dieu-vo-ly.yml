    luot_2: dung
    luot_2_nguon: [ "https://www.engineering.iastate.edu/~shermanp/STAT447/Lectures/Motivated%20Numeracy%20by%20Kahan%20et%20al.pdf", "https://doi.org/10.1016/j.cognition.2021.104768", "https://doi.org/10.1017/S0007123418000327" ]
    luot_2_ghi_chu: Diễn giải khớp.
    review: dung
doi_chu:
  - cu: (không có)
