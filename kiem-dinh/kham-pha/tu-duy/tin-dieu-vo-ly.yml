  - cu: 'Mô tả: "người càng giỏi suy luận đôi khi càng bào chữa giỏi hơn"'
    moi: '"Một số nghiên cứu thấy người giỏi suy luận còn bào chữa giỏi hơn, nhưng bằng chứng này chưa chắc."'
    ly_do: Hồ sơ t2.
  - cu: 'Tự trải nghiệm: "Với hầu hết mọi người, phản ứng đầu tiên không phải là …"'
    moi: '"Phản ứng thường gặp, khớp với thiên kiến phủ nhận mà Taber và Lodge (2006) mô tả …"'
    ly_do: Hồ sơ t3.
  - cu: '"bài tổng quan nổi tiếng năm 1990"; "đánh giá, bẻ cong và ghi nhớ"'
    moi: '"bài tổng quan năm 1990"; "truy xuất, xây dựng và đánh giá niềm tin"'
    ly_do: Hồ sơ t5, t7, t10.
  - cu: 'Taber và Lodge: "hai thí nghiệm trên sinh viên … cân bằng về độ dài và cấu trúc"; "hai phe … càng xa nhau hơn"; "luôn"; "vặn vẹo, phản biện gay gắt"'
    moi: bám tóm tắt (thái độ mạnh hơn trước; tự chọn nguồn; "phản biện … chấp nhận không xét nét")
    ly_do: Hồ sơ t13–t19.
  - cu: 'Kahan 2017: "Một nửa … nửa còn lại thấy cùng một bảng số liệu"; không nêu cỡ mẫu'
