    cau: 'Nhãn Khá vững: ta có xu hướng đánh giá thông tin theo hướng có lợi cho điều mình muốn tin.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - kunda1990
      - ditto2019
      - persson2021
    ly_do: 'Cơ sở: tổng quan Kunda 1990; phân tích tổng hợp 51 thí nghiệm, hơn 18.000 người, thấy thiên lệch theo phe rõ (r = 0,245) và tương đương ở người thiên tả/thiên hữu (Ditto và cộng sự 2019); lần làm lại lớn có đăng ký trước vẫn thấy người ta đọc số theo phe (Persson 2021). Theo mục 4, Vững chắc cần ít nhất một phân tích tổng hợp, không có thất bại tái lập chưa giải thích, đúng ở nhiều quần thể: các nghiên cứu này chủ yếu hỏi về chính trị Mỹ và chưa mở được chi tiết mẫu của Ditto (chỉ tóm tắt), nên giữ Khá vững. Phần Persson 2021: không xác nhận số học có động cơ (xem t39).'
    nguon:
      - kunda1990
      - ditto2019
      - persson2021
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó: chữ cũ là :::vung-chac với "đã được củng cố bởi hàng thập kỷ nghiên cứu tiếp theo" (không nguồn). Đổi sang :::kha-vung vì nguồn mạnh nhất là phân tích tổng hợp chủ yếu về chính trị Mỹ; lượt 2 và review cân nhắc có đủ cho Vững chắc không (phân tích tổng hợp của Ditto đã có, thiếu kiểm "nhiều quần thể"). Theo G1-L02: nhãn không bị nêu lỗi. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khá vững hợp thước đo mục 4: có phân tích tổng hợp (Ditto 2019) và tái lập lớn, nhưng chủ yếu mẫu chính trị Mỹ, chưa có bằng chứng nhiều quần thể.'
    luot_2: dung
