  - id: t42
    cau: 'Nhãn Đã bị bác bỏ: cứ đưa đủ sự thật là người ta sẽ đổi ý (bác bỏ ý "chỉ cần đủ sự thật là đủ", không bác bỏ việc thông tin có tác dụng).'
    loai: nhan
    nhan: bac-bo
    co_so:
      - kahan2017
      - persson2021
      - taber2006
      - guess2020
      - tappin2021
    ly_do: 'Các kiểm tra liên tiếp cho thấy đánh giá thông tin lệch theo phe ngay cả khi có dữ liệu: người giỏi tính toán hơn không bớt phân cực (Kahan 2017), lần làm lại vẫn thấy đọc số theo phe (Persson 2021), bản sắc chính trị có tác động trực tiếp lên suy luận (Tappin 2021), người có quan điểm mạnh phản biện lập luận trái chiều (Taber 2006). Giới hạn: Guess và Coppock (2020) không thấy phản tác dụng, tức thông tin không vô ích; khung nói "không đủ" chứ không nói "vô ích". Khẳng định tuyệt đối "cứ đưa đủ sự thật là người ta sẽ đổi ý" không đứng được.'
    nguon:
      - kahan2017
      - persson2021
      - taber2006
      - guess2020
      - tappin2021
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó: bác bỏ khẳng định tuyệt đối, không bác bỏ việc thông tin có tác dụng. Chữ cũ: "Mô hình thiếu thông tin … quá đơn giản. Thông tin mới thường chỉ làm người ta nhích quan điểm một chút" (không nguồn). Chữ mới thay bằng Kahan 2017, Persson 2021, Taber 2006, Guess 2020. Theo G1-L02 mục 3: khung phải sửa lý do (Taber và Lodge không nói "mọi người" cùng đọc một bộ bằng chứng). Lượt 2 cân nhắc đổi thành Đang tranh cãi. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: chỉ có ý chính "cứ đưa đủ sự thật là người ta sẽ đổi ý" -> thêm câu mở khung: điều bị bác bỏ là ý "chỉ cần đủ sự thật là đủ", không phải "thông tin vô ích" (theo lượt 2; Guess và Coppock không thấy phản tác dụng).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1177/0963662506070159", "https://www.engineering.iastate.edu/~shermanp/STAT447/Lectures/Motivated%20Numeracy%20by%20Kahan%20et%20al.pdf", "https://doi.org/10.1016/j.cognition.2021.104768", "https://doi.org/10.1017/S0007123418000327" ]
    luot_2_ghi_chu: "Nhãn 'Đã bị bác bỏ' nói về ý 'chỉ cần đủ sự thật thì sẽ đổi ý': kiến thức chỉ tương quan yếu với thái độ, người giỏi tính toán vẫn đọc số theo phe. Nhưng thông tin có tác dụng khiêm tốn (Guess & Coppock không thấy phản tác dụng), nên đúng ở chỗ 'không đủ', không phải 'vô ích'. Chỉ đọc tóm tắt Allum, Persson."
    review: sai
