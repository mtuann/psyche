  - id: t7
    cau: 'Lập luận có động cơ và thiên kiến xác nhận giao nhau chứ không lồng nhau: lập luận có động cơ nhấn vào điều ta muốn tin và chi phối, theo Kunda, cả cách ta truy xuất, xây dựng và đánh giá niềm tin; thiên kiến xác nhận có thể xảy ra mà không cần ta muốn kết luận nào.'
    loai: dinh-nghia
    nguon:
      - kunda1990
      - taber2006
    trich: strategies for accessing, constructing, and evaluating beliefs.
    vi_tri: Kunda (1990), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "lập luận có động cơ còn đi xa hơn — đánh giá, bẻ cong và ghi nhớ bằng chứng theo hướng có lợi cho phe mình". Chữ mới bám tóm tắt của Kunda (accessing, constructing, evaluating beliefs); bỏ "bẻ cong" và "ghi nhớ" (không có trong tóm tắt). Thiên kiến xác nhận = "the seeking out of confirmatory evidence" (Taber 2006). Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: "thiên kiến xác nhận là một phần hẹp hơn" (lượt 2: hai khái niệm giao nhau chứ không lồng nhau; thiên kiến xác nhận có thể không cần động cơ, Nickerson dẫn Evans 1989). Chữ mới trên trang: "giao nhau ... không nằm gọn trong nhau".'
    luot_2: qua-manh
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.108.3.480", "https://doi.org/10.1037/1089-2680.2.2.175" ]
    luot_2_ghi_chu: "câu đúng: Theo Kunda, động cơ ảnh hưởng suy luận qua việc truy xuất, xây dựng và đánh giá niềm tin; kiểm chứng giả thuyết theo hướng xác nhận là một trong các cơ chế, còn thiên kiến xác nhận (Nickerson) cũng xảy ra khi không có động cơ, nên hai khái niệm giao nhau chứ không lồng nhau.; Phần 'chi phối cả truy xuất, xây dựng, đánh giá niềm tin' đúng theo Kunda. Nhưng 'thiên kiến xác nhận là một phần hẹp hơn' không phải kết luận của Kunda; Nickerson chỉ rõ thiên kiến xác nhận cũng xảy ra khi không có động cơ, nên hai khái niệm giao nhau, không lồng nhau."
    review: sai
