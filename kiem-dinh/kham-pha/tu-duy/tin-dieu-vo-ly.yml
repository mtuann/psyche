    ket_qua: dung
    ghi_chu: 'Tìm trên OpenAlex ngày 10/11/2026: "motivated reasoning Vietnam", "motivated reasoning Vietnamese participants", "politically motivated reasoning Vietnam", "motivated numeracy Vietnam", "identity-protective cognition Vietnam", "biased assimilation attitude polarization Vietnamese": không có nghiên cứu kiểm tra chính trị hay số học có động cơ trên người Việt. Có một mục đăng ký thử nghiệm (Kiesel, AEA RCT Registry rct.10541, "Biased Beliefs, Motivated Reasoning, and Consumer Valuation of Vegetable Labels in Vietnam", 2022) về nhãn rau của người tiêu dùng: không phải chính trị hay số học, và không thấy bài có kết quả. Chữ cũ: "Chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra lập luận có động cơ hay số học có động cơ trên người Việt." (không mốc, không hạn; phạm vi rộng hơn nên mục đăng ký trên có thể là ngoại lệ; đã thu hẹp sang chính trị và số học). Chưa tìm Google Scholar hay tạp chí trong nước.'
