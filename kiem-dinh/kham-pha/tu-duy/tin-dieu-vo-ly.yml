    cau: 'Quiz 1: điểm khác biệt cốt lõi: thẩm phán cân nhắc bằng chứng để đi đến kết luận, còn luật sư đã có sẵn kết luận cần bảo vệ rồi mới đi tìm bằng chứng phục vụ nó; lập luận có động cơ là thứ tự bị đảo ngược.'
    loai: dinh-nghia
    nguon:
      - kunda1990
    trich: The motivation to be accurate enhances use of those beliefs and strategies that are considered most appropriate, whereas the motivation to arrive at particular conclusions enhances use of those that are considered most likely to yield the desired conclusion.
    vi_tri: Tóm tắt (abstract)
    ket_qua: dung
    ghi_chu: 'Phép ẩn dụ là của site. Theo G1-L02: đáp án khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.108.3.480" ]
    luot_2_ghi_chu: Quiz diễn giải đúng ý Kunda; ẩn dụ là của site.
  - id: t66
    cau: 'Quiz 2: theo Kunda (1990), điều giới hạn khả năng "tin điều mình muốn" là khả năng dựng được một lý do biện minh nghe có vẻ hợp lý.'
    loai: phat-hien
    nguon:
      - kunda1990
    trich: their ability to do so is constrained by their ability to construct seemingly reasonable justifications for these conclusions.
    vi_tri: Tóm tắt (abstract)
    ket_qua: dung
    ghi_chu: 'Theo G1-L02: đáp án khớp.'
