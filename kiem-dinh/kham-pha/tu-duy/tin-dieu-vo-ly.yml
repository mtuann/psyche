nhan_dinh:
  - id: t1
    cau: 'Mô tả: Kunda (1990) nêu rằng ta dễ đi đến kết luận mình muốn, trong giới hạn của việc dựng được lý do nghe hợp lý; ví như luật sư bào chữa hơn thẩm phán vô tư là cách nói của trang, không phải của Kunda.'
    loai: dinh-nghia
    nguon:
      - kunda1990
    trich: There is considerable evidence that people are more likely to arrive at conclusions that they want to arrive at, but their ability to do so is constrained by their ability to construct seemingly reasonable justifications for these conclusions.
    vi_tri: Tóm tắt (abstract)
    ket_qua: da-sua
    ghi_chu: 'Mô tả (description). Phép ẩn dụ thẩm phán/luật sư là của site. Theo G1-L02: KHỚP. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: "Kunda (1990) nêu lập luận có động cơ: ta suy luận không như thẩm phán vô tư mà như luật sư bào chữa" -> mô tả trang nay nói đó là cách ví von của trang; nguồn chỉ cho phần "đi đến kết luận mình muốn, bị giới hạn bởi việc dựng lý do hợp lý". Thêm cả ở thân bài.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.108.3.480" ]
    luot_2_ghi_chu: Đọc toàn văn. Ẩn dụ 'luật sư' không có trong bài Kunda, là cách diễn đạt của site; nội dung đúng.
    review: sai
  - id: t2
    cau: 'Mô tả: một số nghiên cứu thấy người giỏi suy luận còn bào chữa giỏi hơn, nhưng bằng chứng này chưa chắc.'
    loai: phat-hien
    nguon:
      - kahan2013
      - persson2021
    trich: We did not find good evidence for motivated numeracy; there are distinct patterns in our data at odds with the core predictions of the theory
    vi_tri: Persson và cộng sự (2021), tóm tắt; Kahan 2013 (xem t30)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "và người càng giỏi suy luận đôi khi càng bào chữa giỏi hơn" (khẳng định không kèm lưu ý). Chữ mới thêm "nhưng bằng chứng này chưa chắc" theo Persson 2021 và Tappin 2021 (t32). Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp Persson 2021 và Tappin 2021, đã làm mềm.'
    luot_2: dung
    luot_2_nguon: [ "https://journal.sjdm.org/13/13313/jdm13313.pdf", "https://osf.io/yuzfj", "https://doi.org/10.1016/j.cognition.2021.104768" ]
    luot_2_ghi_chu: "Câu đã nói 'chưa chắc': đúng."
    review: dung
  - id: t3
    cau: 'Khung "Tự trải nghiệm" (đáp án): một phản ứng đã được ghi nhận, khớp "thiên kiến phủ nhận" của Taber và Lodge (2006), là phản biện lập luận trái chiều bằng một loạt câu hỏi soi mói, chứ không phải "mình sai rồi".'
    loai: phat-hien
    nguon:
      - taber2006
    trich: participants (Ps) counterargue the contrary arguments and uncritically accept supporting arguments, evidence of a disconfirmation bias.
    vi_tri: Tóm tắt (abstract)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Với hầu hết mọi người, phản ứng đầu tiên không phải là ''ồ, vậy là mình sai rồi'' — mà là một loạt câu hỏi soi mói". Bỏ "hầu hết mọi người" (không số liệu), gắn với kết quả của Taber và Lodge. Các câu hỏi mẫu (mẫu bao nhiêu, ai tài trợ) là ví dụ giả định (gia-dinh). Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: "Phản ứng thường gặp, khớp ..." -> "Một phản ứng đã được ghi nhận, khớp ...": Taber và Lodge không đo tần suất "thường gặp" trong đời sống.'
    luot_2: dung
    luot_2_nguon: [ "https://fbaum.unc.edu/teaching/articles/AJPS-2006-Taber.pdf" ]
    luot_2_ghi_chu: Đọc toàn văn.
    review: sai
  - id: t4
    cau: 'Khi suy luận, ta tìm luận cứ có lợi và đánh giá bất đối xứng: phản biện lập luận trái chiều, dễ dãi với lập luận cùng phe (ẩn dụ "luật sư bào chữa").'
    loai: phat-hien
    nguon:
      - taber2006
    trich: participants (Ps) counterargue the contrary arguments and uncritically accept supporting arguments, evidence of a disconfirmation bias.
    vi_tri: Tóm tắt (abstract)
    ket_qua: dung
    ghi_chu: 'Phần ẩn dụ và "toàn bộ năng lực suy luận được huy động" là diễn giải của site; phần đánh giá bất đối xứng khớp Taber và Lodge. Theo G1-L02: không nêu vấn đề.'
    luot_2: dung
    luot_2_nguon: [ "https://fbaum.unc.edu/teaching/articles/AJPS-2006-Taber.pdf", "https://doi.org/10.1037/0033-2909.108.3.480" ]
    luot_2_ghi_chu: Ẩn dụ luật sư là của site.
  - id: t5
    cau: Ziva Kunda gọi sự bất đối xứng này là lập luận có động cơ (motivated reasoning) trong bài tổng quan năm 1990.
