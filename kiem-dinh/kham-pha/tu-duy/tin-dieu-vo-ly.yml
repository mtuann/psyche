    luot_2_ghi_chu: Đọc toàn văn.
  - id: t67
    cau: 'Quiz 3: với bảng số liệu về lệnh cấm súng, nhóm giỏi tính toán nhất phân cực mạnh nhất; một lần làm lại năm 2021 chưa xác nhận rõ phần "càng giỏi càng lái khéo".'
    loai: phat-hien
    nguon:
      - kahan2017
      - persson2021
    trich: such polarization did not abate among subjects highest in numeracy; instead, it increased.
    vi_tri: Kahan 2017, tóm tắt; Persson 2021, tóm tắt
    ket_qua: dung
    ghi_chu: 'Theo G1-L02 mục 4: lưu ý đã thêm vào lời giải thích. Chữ "nhóm giỏi nhất phân cực mạnh nhất" bám "polarization did not abate among subjects highest in numeracy; instead, it increased".'
    luot_2: dung
    luot_2_nguon: [ "https://www.engineering.iastate.edu/~shermanp/STAT447/Lectures/Motivated%20Numeracy%20by%20Kahan%20et%20al.pdf", "https://doi.org/10.1016/j.cognition.2021.104768" ]
    luot_2_ghi_chu: Đúng.
  - id: t68
    cau: 'Quiz 4: trong Taber và Lodge (2006), thái độ của người tham gia trở nên mạnh hơn trước (phân cực thái độ), rõ nhất ở người có quan điểm ban đầu mạnh nhất và am hiểu chính trị nhất; thiên kiến phủ nhận: phản biện bằng chứng trái chiều, dễ dãi với bằng chứng cùng chiều.'
    loai: phat-hien
    nguon:
      - taber2006
    trich: especially among those with the strongest priors and highest levels of political sophistication.
    vi_tri: Tóm tắt (abstract)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hai phe càng xa nhau hơn (phân cực thái độ) …"; câu hỏi "đọc các lập luận ủng hộ và phản đối được cân bằng"; giải thích "rồi kết luận rằng mình càng có lý hơn trước". Chữ mới bám tóm tắt (thái độ mạnh hơn); bỏ "được cân bằng" (không kiểm được) và vế "càng có lý hơn". Phương án nhiễu: "trung lập hơn", "đổi sang phía có lập luận dài hơn". Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp trích Taber và Lodge.'
    luot_2: dung
    luot_2_nguon: [ "https://fbaum.unc.edu/teaching/articles/AJPS-2006-Taber.pdf" ]
    luot_2_ghi_chu: Đọc toàn văn.
    review: dung
  - id: t69
    cau: 'Quiz 5: mô hình "thiếu thông tin" không đủ để giải thích, vì người có quan điểm khác nhau đánh giá thông tin lệch theo phe, kể cả người giỏi tính toán; nếu cách đánh giá đã lệch theo phe, thêm thông tin chưa chắc làm người ta đổi ý, nhưng không có nghĩa thông tin vô ích.'
    loai: phat-hien
    nguon:
      - kahan2017
      - persson2021
      - guess2020
