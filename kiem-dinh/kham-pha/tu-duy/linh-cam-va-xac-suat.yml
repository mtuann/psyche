    cau: Nếu một phần hiệu ứng đến từ cách hiểu câu hỏi theo thói quen giao tiếp, thì thói quen giao tiếp khác nhau giữa các nền văn hóa có thể ảnh hưởng đến hiệu ứng; đây là suy luận của trang, chưa có dữ liệu.
    loai: phat-hien
    nguon:
      - tentori2004
    trich: Whether an error is thereby committed depends on reasoners' interpretation of the expressions "probability" and "and."
    vi_tri: Tentori và cộng sự 2004, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "một phần hiệu ứng có thể đến từ cách hiểu câu hỏi theo thói quen giao tiếp (luận điểm của Gigerenzer) — mà thói quen giao tiếp thì khác nhau giữa các nền văn hóa" (khẳng định về văn hóa không có nguồn). Chữ mới ghi rõ là suy luận. Review (Claude Opus 5.5, 10/11/2026): đã ghi rõ là suy luận của trang; dẫn Tentori 2004 cho ý cách hiểu từ ngữ. Đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://open.lnu.se/index.php/metapsychology/article/download/2474/2516", "https://doi.org/10.1016/s0364-0213(04)00004-7" ]
    review: 'dung'
  - id: n63
    cau: 'Ngộ nhận: mô tả càng chi tiết không làm tăng khả năng đúng; chi tiết làm tăng độ thuyết phục, không làm tăng độ có khả năng.'
    loai: dinh-nghia
    nguon:
      - kahneman2011
    trich: When you specify a possible event in greater detail you can only lower its probability.
    vi_tri: 'Kahneman 2011, chương "Linda: Less Is More"'
    ket_qua: dung
    ghi_chu: Khớp n50 (logic).
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-295X.90.4.293.pdf" ]
    luot_2_ghi_chu: Phần 'chi tiết làm tăng độ thuyết phục' khớp mục scenario của bài.
  - id: n64
    cau: 'Ngộ nhận: ở phiên bản xếp hạng, nhóm nghiên cứu sinh ngành khoa học quyết định — được đào tạo xác suất bài bản — vẫn mắc lỗi ở tỉ lệ cao (85%).'
    loai: so-lieu
    nguon:
      - tversky1983
    trich: 'Table 1: Linda, direct test V = 85 (sophisticated)'
    vi_tri: Tversky & Kahneman 1983, Bảng 1
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "vẫn mắc lỗi ở tỉ lệ cao" (không nêu phiên bản; nhóm nghiên cứu sinh đã học thống kê chỉ mắc 36% ở phiên bản so hai phát biểu). Thêm "ở phiên bản xếp hạng" và 85% (G1-L02 #5). Review (Claude Opus 5.5, 10/11/2026): đã tự mở lại toàn văn Tversky & Kahneman 1983 (Internet Archive): chữ cuối trên trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-295X.90.4.293.pdf" ]
    review: 'dung'
  - id: n65
    cau: 'Ngộ nhận: không có nghịch lý toán học ở đây; P(A và B) ≤ P(A) là hiển nhiên, điều đáng ngạc nhiên là ở nhiều phiên bản trực giác của người tham gia đi ngược với điều ấy.'
    loai: dinh-nghia
    nguon:
      - kahneman2011
      - tversky1983
    trich: The problem therefore sets up a conflict between the intuition of representativeness and the logic of probability.
    vi_tri: 'Kahneman 2011, chương "Linda: Less Is More"'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "không ai tranh cãi" và "trực giác của con người — kể cả trực giác được đào tạo — lại đi ngược". Quy tắc toán học không bị tranh cãi (các nhà phê bình bàn về cách hiểu câu hỏi, không bàn quy tắc); chữ mới làm mềm "ở nhiều phiên bản". Review (Claude Opus 5.5, 10/11/2026): đã tự mở lại toàn văn Tversky & Kahneman 1983 (Internet Archive): chữ cuối trên trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-295X.90.4.293.pdf" ]
    review: 'dung'
  - id: n66
    cau: 'Đọc thêm: bài "Não có hai chế độ nghĩ?" (Hệ 1 trực giác đằng sau linh cảm) và "Vì sao ta tin điều vô lý?" có trên site.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: trang.yml có kham-pha/tu-duy/tu-duy-nhanh-cham và kham-pha/tu-duy/tin-dieu-vo-ly; link nội bộ đúng. Trang chưa khóa nên hiện "sắp có" ở bản thật. Review (Claude Opus 5.5, 10/11/2026): đã kiểm: trang.yml có hai trang, link /psyche/... đúng.'
    review: 'dung'
  - id: n67
    cau: 'Câu hỏi 4: phần "Mức độ chắc chắn" gắn nhãn tranh cãi cho câu hỏi vì sao ta mắc bẫy, còn bản thân hiệu ứng thì được xếp khá vững.'
    loai: ve-site
    ket_qua: 'da-sua'
    ghi_chu: 'Đã kiểm trên trang: có khung Vững chắc (hiệu ứng) và khung Đang tranh cãi (vì sao). Review (Claude Opus 5.5, 10/11/2026): chữ cũ "— dù bản thân hiệu ứng thì vững chắc" không còn khớp nhãn sau khi khung n34 hạ xuống Khá vững; chữ mới "còn bản thân hiệu ứng thì được xếp khá vững". Đã kiểm trên trang: có khung Khá vững (hiệu ứng) và Đang tranh cãi (vì sao).'
    review: 'sai'
  - id: n68
    cau: 'Câu hỏi 1: (a) luôn có khả năng đúng hơn (b) vì mọi người thỏa (b) đều thỏa (a); quy tắc conjunction P(A và B) ≤ P(A), không có ngoại lệ.'
    loai: phat-hien
    nguon:
      - kahneman2011
    trich: Therefore the probability that Linda is a feminist bank teller must be lower than the probability of her being a bank teller.
    vi_tri: 'Kahneman 2011, chương "Linda: Less Is More"'
    ket_qua: dung
    ghi_chu: 'Quiz câu 1. "Không có ngoại lệ" nói về quy tắc xác suất (ngoại lệ chỉ có khi hai xác suất bằng nhau: "giữ nguyên").'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-295X.90.4.293.pdf" ]
    luot_2_ghi_chu: "'Luôn' hiểu theo nghĩa 'không thể kém hơn'; về chặt chẽ (a) ≥ (b), bằng nhau chỉ khi mọi nhân viên ngân hàng đều là nhà nữ quyền."
  - id: n69
    cau: 'Câu hỏi 2: trong nghiên cứu gốc, khoảng 85% chọn (b) ở phiên bản chọn một trong hai (sinh viên chưa học thống kê) và 85–90% ở phiên bản xếp hạng, kể cả nhóm rành xác suất (85%); khi chỉ phải chấm hai phát biểu, phần lớn người đã học nhiều thống kê làm đúng nhưng vẫn có 36% mắc lỗi.'
    loai: so-lieu
    nguon:
      - tversky1983
    trich: 'Overall, 85% of respondents indicated that T&F was more probable than T | Table 1: Linda, direct test V = 89, 90, 85 | only 36% of respondents committed the fallacy. Thus, statistical sophistication produced a majority who conformed to the conjunction rule in a transparent test'
    vi_tri: Tversky & Kahneman 1983, mục "Transparent Tests"; Bảng 1
    ket_qua: 'da-sua'
    ghi_chu: 'Quiz câu 2 (đã sửa theo G1-L02 #2; phương án nhiễu "Khoảng 30–40%" đổi thành "Khoảng 50%"). Review (Claude Opus 5.5, 10/11/2026): lời giải thích cũ "Con số 85% trong phiên bản so sánh trực tiếp — và 85–90% ở phiên bản xếp hạng tám phát biểu — là điều làm bài báo này nổi tiếng: một lỗi logic sơ đẳng mà số đông, kể cả người rành xác suất, đều mắc phải" gộp hai phiên bản: ở phép so trực tiếp, người đã học nhiều thống kê chỉ 36% mắc lỗi (Tversky & Kahneman 1983, tr. 300, đã mở toàn văn); "làm bài báo nổi tiếng" không có nguồn. Đáp án đúng thêm "(sinh viên chưa học thống kê)"; giải thích mới "Ở phiên bản xếp hạng tám phát biểu, ngay cả nhóm rành xác suất cũng mắc lỗi (85%). Khi chỉ phải chấm hai phát biểu, phần lớn người đã học nhiều thống kê làm đúng, nhưng vẫn có 36% mắc lỗi."'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-295X.90.4.293.pdf" ]
    review: 'sai'
  - id: n70
    cau: 'Câu hỏi 3: theo thay thế thuộc tính của Kahneman, ta đổi câu hỏi khó ("xác suất nào lớn hơn?") thành câu dễ ("mô tả nào giống Linda hơn?") mà không hay biết.'
    loai: phat-hien
    nguon:
      - kahneman2011
    trich: when faced with a difficult question, we often answer an easier one instead, usually without noticing the substitution.
    vi_tri: Kahneman 2011, Introduction
    ket_qua: dung
    ghi_chu: Quiz câu 3 (đáp án đúng); "Heuristic đại diện chính là sự thay thế này" khớp Kahneman (representativeness thay probability).
    luot_2: dung
    luot_2_nguon: [ "https://www.nobelprize.org/uploads/2018/06/kahnemann-lecture.pdf" ]
    luot_2_ghi_chu: Nobel lecture mô tả Linda qua attribute substitution; thuật ngữ 'thay thế thuộc tính' của Kahneman & Frederick 2002.
  - id: n71
    cau: 'Câu hỏi 4: phê bình của Gigerenzer cho rằng nhiều "lỗi" như vậy không thực sự vi phạm lý thuyết xác suất nếu phân biệt xác suất của một trường hợp đơn lẻ với tần suất tương đối, và cách người đọc hiểu câu hỏi có thể khác cách hiểu toán học.'
    loai: phat-hien
    nguon:
      - gigerenzer1991
      - tentori2004
    trich: Most so-called "errors" in probabilistic reasoning are in fact not violations of probability theory.
    vi_tri: Gigerenzer 1991, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Quiz câu 4: chữ cũ "Ông cho rằng cách đặt câu hỏi vi phạm nguyên tắc hội thoại: người nghe ngầm hiểu (a) là nhân viên ngân hàng và không phải nhà hoạt động nữ quyền" gán cho Gigerenzer (không kiểm được qua tóm tắt, xem n39). Review (Claude Opus 5.5, 10/11/2026): chữ cuối khớp tóm tắt Gigerenzer 1991 và Tentori 2004.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/14792779143000033", "https://doi.org/10.1016/s0364-0213(04)00004-7" ]
    review: 'dung'
  - id: n72
    cau: 'Câu hỏi 5: ở phiên bản đặt cược 10 đô la, tỉ lệ mắc lỗi là 56%, thấp hơn mức 85% của phiên bản chọn một trong hai (một nhóm sinh viên khác); Tversky và Kahneman phỏng đoán rằng khung đặt cược khiến người ta chú ý đến điều kiện thắng cược, nên một số người nhận ra cược vào (a) không bao giờ kém cược vào (b); mẹo tưởng tượng đặt tiền không xóa hẳn lỗi (56% vẫn mắc) và chưa được thử riêng.'
    loai: phat-hien
    nguon:
      - tversky1983
    trich: 'The percentage of violations of the conjunction rule in this task was "only" 56% (n = 60) ... We conjecture that the betting context draws attention to the conditions in which one bet pays off whereas the other does not, allowing some subjects to discover that a bet on T dominates a bet on T&F.'
    vi_tri: Tversky & Kahneman 1983, mục "Transparent Tests"
    ket_qua: da-sua
    ghi_chu: 'Quiz câu 5: chữ cũ "Vì khung đặt cược buộc não nghĩ đến điều kiện thắng–thua, làm cấu trúc lồng nhau... hiện ra rõ hơn" và "cách nhanh nhất để đánh thức Hệ thống 2" (không nguồn). Review (Claude Opus 5.5, 10/11/2026): thân câu hỏi cũ "Vì sao phiên bản "đặt cược 10 đô la" làm giảm tỉ lệ mắc lỗi (từ 85% xuống 56%)?" vẫn ngầm nói đổi khung trên cùng một nhóm (lượt 1 đã sửa ý này ở n52 nhưng chưa sửa thân câu hỏi); "cược vào (a) không thể thua (b)" chưa sát "dominates". Chữ mới: "Ở phiên bản "đặt cược 10 đô la", tỉ lệ mắc lỗi là 56%, thấp hơn mức 85% của phiên bản chọn một trong hai (ở một nhóm sinh viên khác). Tversky và Kahneman giải thích chênh lệch này thế nào?"; đáp án "Họ phỏng đoán ... cược vào (a) không bao giờ kém cược vào (b) ..."; giải thích nói rõ là phỏng đoán, hai nhóm khác nhau, mẹo chưa được thử riêng.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-295X.90.4.293.pdf" ]
    review: 'sai'
