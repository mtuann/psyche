  - cu: 'Ở Việt Nam: "Chúng tôi chưa tìm thấy...", "vào đầu thập niên 1980", "luận điểm của Gigerenzer — mà thói quen giao tiếp thì khác nhau giữa các nền văn hóa"'
    moi: '"Tính đến 11/2026, chúng tôi chưa tìm thấy..."; "bài công bố năm 1983"; "đây là suy luận của chúng tôi, chưa có dữ liệu"'
