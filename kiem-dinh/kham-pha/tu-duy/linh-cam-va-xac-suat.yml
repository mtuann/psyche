    ghi_chu: 'Chữ cũ có câu "Đây là một trong những phát hiện được lặp lại nhiều nhất của tâm lý học phán đoán" (không kiểm được; bỏ) và "Ở phiên bản xếp hạng, 85–90%..." (thêm "tám phát biểu"). Thêm Yechiam & Zeif 2023 và Chandrashekar 2021. Chỗ khó: không có phân tích tổng hợp trực tiếp về mức độ của hiệu ứng (chỉ về tác dụng của thưởng) và tái lập có đăng ký trước chỉ một lần; giữ Vững chắc cho sự tồn tại của hiệu ứng, review cân nhắc. Review (Claude Opus 5.5, 10/11/2026): đồng ý với lượt 2 (qua-manh). Đã tự mở toàn văn Chandrashekar 2021: "Findings for James profile were a likely failed replication, with no conjunction effect"; tóm tắt Yechiam & Zeif 2023 (Europe PMC) chỉ nói về tác dụng của thưởng. Chữ cũ ":::vung-chac[...]" và câu cuối "Vì vậy hiện tượng vững, còn mức độ thì thay đổi nhiều theo cách hỏi." Chữ mới ":::kha-vung[lỗi conjunction fallacy trong bài toán Linda]", câu cuối "Mức "khá vững" vì chưa có phân tích tổng hợp về chính mức độ của lỗi, mới có một lần làm lại lớn có đăng ký trước, và tỉ lệ mắc lỗi thay đổi nhiều theo cách hỏi." Quiz câu 4 (n67) sửa theo.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://open.lnu.se/index.php/metapsychology/article/download/2474/2516", "https://link.springer.com/article/10.1007/s00426-023-01837-5", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-295X.90.4.293.pdf" ]
    luot_2_ghi_chu: "câu đúng: Khá vững: lỗi conjunction fallacy ở bài toán Linda lặp lại ở nhiều nghiên cứu và một tái lập có đăng ký trước (Chandrashekar và cộng sự, 2021), nhưng chưa có phân tích tổng hợp riêng, mức lỗi phụ thuộc cách hỏi, và một mô tả tương tự (James) không tái lập.; Thước đo mục 4: Vững chắc cần phân tích tổng hợp/tổng quan hệ thống hay hai tái lập lớn có đăng ký trước, cùng chiều, không thất bại lớn chưa giải thích. Với Linda chỉ thấy một tái lập lớn có đăng ký trước (Hồng Kông), kèm một thất bại ở mô tả James chưa giải thích hết; phân tích tổng hợp của Yechiam & Zeif nói về thưởng tiền, không phải về sự tồn tại của lỗi. Không tìm thấy phân tích tổng hợp riêng về bài toán Linda."
