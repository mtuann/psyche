    cau: 'Đáp án đúng về mặt logic là (a): mọi nhân viên ngân hàng đồng thời là nhà hoạt động nữ quyền đều là nhân viên ngân hàng; tập (b) nằm trong tập (a) nên P(A và B) ≤ P(A).'
