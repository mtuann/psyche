  - id: n39
    cau: Theo Gigerenzer (1991), nhiều "lỗi" trong suy luận xác suất, trong đó có conjunction fallacy, thực ra không vi phạm lý thuyết xác suất nếu phân biệt xác suất của một trường hợp đơn lẻ với tần suất tương đối.
    loai: phat-hien
    nguon:
      - gigerenzer1991
    trich: Most so-called "errors" in probabilistic reasoning are in fact not violations of probability theory. Examples of such "errors" include overconfidence bias, conjunction fallacy, and base-rate neglect. Researchers have relied on a very narrow normative view, and have ignored conceptual distinctions—e.g. single case versus relative frequency—fundamental to probability theory.
    vi_tri: Gigerenzer 1991, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cách đặt câu hỏi vi phạm nguyên tắc hội thoại: ... ngầm hiểu là nhân viên ngân hàng và không phải nhà hoạt động nữ quyền" gán cho Gigerenzer. Tóm tắt Gigerenzer 1991 chỉ nói về trường hợp đơn/tần suất; lập luận hội thoại (Hertwig & Gigerenzer 1999) không mở được, nên trang gán rộng hơn ("Gigerenzer và các cộng sự") và dẫn Chandrashekar 2021 cho quan điểm của Hertwig. theo G1-L02: KHÔNG KIỂM ĐƯỢC (Gigerenzer chỉ có tóm tắt). Review (Claude Opus 5.5, 10/11/2026): chỉ có tóm tắt; chữ trên trang không vượt quá tóm tắt.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1080/14792779143000033" ]
    luot_2_ghi_chu: Chỉ đọc tóm tắt (qua OpenAlex/Max Planck); toàn văn không mở được.
    review: 'dung'
