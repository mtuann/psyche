    cau: Hiệu ứng cạn kiệt ý chí (ego depletion, "khi mệt thì Hệ 2 yếu đi") không tái lập được trong một lần làm lại nhiều phòng thí nghiệm có đăng ký trước (23 phòng, 2.141 người; d = 0,04, khoảng tin cậy 95% [−0,07; 0,15]).
