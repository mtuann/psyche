    cau: 'Khá vững: có những quá trình tư duy nhanh-tự động và những quá trình chậm-tốn sức.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - schneider1977
      - evans2013
      - keren2009
      - frederick2005
    ly_do: Schneider & Shiffrin (1977) đề xuất hai kiểu xử lý (tự động và có kiểm soát) và hỗ trợ bằng nhiều thí nghiệm thời gian phản ứng; Evans & Stanovich (2013) bênh vực sự phân biệt này bằng bằng chứng gần đây; CRT (Frederick 2005) phù hợp. Nhưng không có phân tích tổng hợp, và Keren & Schul (2009) kết luận các mô hình hai hệ "đem lại ít tiến bộ khoa học"; nhãn chỉ nói về sự phân biệt ở mức mô tả, không về hai "hệ".
    nguon:
      - schneider1977
      - evans2013
      - keren2009
      - frederick2005
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: khung Vững chắc ("được ghi nhận nhất quán qua nhiều thập kỷ với nhiều phương pháp khác nhau, từ thời gian phản ứng, nhiệm vụ làm hai việc cùng lúc, đến CRT"). Không có phân tích tổng hợp trong nguồn đã mở và có phê bình mạnh (Keren & Schul 2009), nên hạ Khá vững; ý chính giữ. Chỗ khó: người kiểm có thể coi mức mô tả (tự động vs có kiểm soát) là Vững chắc; review cân nhắc. Review (Claude Opus 5.5, 10/11/2026): giữ Khá vững: sự phân biệt tự động/có kiểm soát có nhiều thí nghiệm cùng chiều (Schneider & Shiffrin 1977, toàn văn) và được bênh vực (Evans & Stanovich 2013), nhưng chưa có phân tích tổng hợp và có phê bình lý thuyết (Keren & Schul 2009). Đạt mục 4 mức Khá vững.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-295X.84.1.1.pdf", "https://doi.org/10.1177/1745691612460685" ]
    luot_2_ghi_chu: Khá vững là mức thận trọng; sự phân biệt tự động/có kiểm soát được ủng hộ rộng, còn việc gom thành hai 'hệ' bị phê bình (Keren & Schul).
