    luot_2_ghi_chu: "câu đúng: Không nên dùng nhãn Đã bị bác bỏ. Cách đúng: Hệ 1/Hệ 2 là ẩn dụ chứ không phải hai bộ phận của não (chính Kahneman nói vậy); quan niệm 'hai hệ riêng biệt' bị phê bình mạnh (Keren & Schul 2009) và các tác giả quá trình kép chuyển sang nói 'Type 1/Type 2' (Evans & Stanovich 2013).; Thước đo mục 4: Đã bị bác bỏ cần các kiểm tra đủ mạnh liên tục thất bại hay bằng chứng gốc mất giá trị (rút bài, gian lận). Không có phép kiểm nào ở đây; chính Kahneman coi hai hệ là ẩn dụ, nên khẳng định 'hai bộ phận riêng biệt trong não' không phải của chính lý thuyết (gần với 'ngộ nhận về cách đọc'), và phê bình khoa học (Keren & Schul) nói về giá trị giải thích, không phải một bác bỏ thực nghiệm."
