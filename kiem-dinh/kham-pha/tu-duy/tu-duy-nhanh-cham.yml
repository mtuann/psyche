  - cu: 'Bargh: "Florida"/"bingo", "đo lén", "d = 1,04 ... d = 0,79"; "Kahneman cũng dành nhiều trang... ca ngợi"'
    moi: Mô tả theo Kahneman 2011 (NYU, 18–22 tuổi, Florida/forgetful/bald/gray/wrinkle); bỏ hai số d; "instant classic"
    ly_do: Hồ sơ n20, n21, n22.
