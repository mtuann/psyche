  - cu: 'Weingarten: "nhỏ hơn nhiều so với báo cáo ban đầu; hiệu ứng đã xuất bản lớn hơn chưa xuất bản"'
    moi: '"d khoảng 0,33–0,35, chỉ bị lệch ít do việc chỉ đăng kết quả dương; chưa tổng hợp sau 2016"'
