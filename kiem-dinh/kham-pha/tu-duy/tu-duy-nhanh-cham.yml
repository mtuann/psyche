  - id: n31
    cau: 'Phân tích tổng hợp của Weingarten và cộng sự (2016): 352 kích thước hiệu ứng từ 133 nghiên cứu cho thấy hiệu ứng priming hành vi nhìn chung nhỏ (d khoảng 0,33–0,35), chỉ bị lệch ít do việc chỉ đăng kết quả dương; phân tích nói về nhiều loại từ gợi ý.'
