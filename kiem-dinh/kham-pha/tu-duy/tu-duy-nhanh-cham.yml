    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhìn chung nhỏ hơn nhiều so với các báo cáo ban đầu; các hiệu ứng trong nghiên cứu đã xuất bản lớn hơn nghiên cứu chưa xuất bản, nhưng thiên kiến này nhỏ" (hai nửa trước không có trong tóm tắt; không mở được toàn văn nên không kiểm). Chữ mới theo tóm tắt; "chưa tổng hợp các nghiên cứu sau 2016" ghi rõ. theo G1-L02: KHỚP phần trích "small behavioral priming effect ... only minimally biased". Review (Claude Opus 5.5, 10/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn. Câu tiếp theo trên trang ("chưa tổng hợp các nghiên cứu sau 2016") là câu tự rào của site.'
