    nguon:
      - hagger2016
    trich: Multiple laboratories (k = 23, total N = 2,141) conducted replications of a standardized ego-depletion protocol ... the size of the ego-depletion effect was small with 95% confidence intervals (CIs) that encompassed zero (d = 0.04, 95% CI [-0.07, 0.15]).
