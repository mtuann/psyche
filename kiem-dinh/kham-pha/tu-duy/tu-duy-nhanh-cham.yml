  - cu: 'Lý thuyết: "Chuyên gia sau hàng nghìn giờ luyện tập phần lớn rất chuẩn"; "tiết kiệm năng lượng"; ký ức liên tưởng "nhận ra nguy hiểm"'
    moi: '"luật ít tốn sức nhất"; "trực giác có thể đáng tin trong môi trường đủ đều đặn... sau khi luyện tập lâu"; "ký ức liên tưởng là lõi của Hệ 1"'
    ly_do: Hồ sơ n36, n37, n38.
  - cu: 'Áp dụng 1–3: chip Khá vững; "Hệ 2 cần thời gian để khởi động", "đảm bảo Hệ 2 đã được mời vào bàn", "thuê ngoài bộ nhớ", "Phi công, bác sĩ phẫu thuật dùng checklist chính vì họ biết..."'
