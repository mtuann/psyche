    cau: 'Câu hỏi 4: theo mô hình Kahneman, ta mắc nhiều sai lầm dù biết tính vì Hệ 1 đưa đáp án trước còn Hệ 2 có thể lười kiểm tra lại; nhiều sai lầm không do thiếu kiến thức mà do khâu kiểm tra bị bỏ qua.'
    loai: phat-hien
    nguon:
      - kahneman2011
    trich: that person did not actively check whether the answer was correct, and her System 2 endorsed an intuitive answer that it could have rejected with a small investment of effort.
    vi_tri: Kahneman 2011, chương "The Lazy System 2"
    ket_qua: da-lam-mem
    ghi_chu: 'Quiz câu 4: chữ cũ "Hệ 1 luôn đưa đáp án trước còn Hệ 2 thường lười", "Vấn đề thường không phải là thiếu kiến thức". Review (Claude Opus 5.5, 10/11/2026): chữ cuối khớp trích Kahneman 2011 của lượt 1 (bản quét Internet Archive); lượt 2 xác nhận ý qua Nobel lecture và trích thứ cấp. Không thấy chữ vượt nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nobelprize.org/uploads/2018/06/kahnemann-lecture.pdf" ]
    review: 'dung'
  - id: n56
    cau: 'Câu hỏi 5: Hệ 1 và Hệ 2 là cách nói ẩn dụ cho hai kiểu xử lý (nhanh-tự động và chậm-tốn sức); không có hai bộ phận tương ứng; Kahneman nhấn mạnh đây là hai nhân vật hư cấu.'
    loai: phat-hien
    nguon:
      - kahneman2011
    trich: they are fictitious characters. Systems 1 and 2 are not systems in the standard sense of entities with interacting aspects or parts.
    vi_tri: Kahneman 2011, chương "The Characters of the Story"
    ket_qua: da-lam-mem
    ghi_chu: 'Quiz câu 5: chữ cũ "ngộ nhận phổ biến nhất về mô hình này" (không kiểm được "phổ biến nhất"); đổi thành "một ngộ nhận". Review (Claude Opus 5.5, 10/11/2026): chữ cuối khớp trích Kahneman 2011 của lượt 1 (bản quét Internet Archive); lượt 2 xác nhận ý qua Nobel lecture và trích thứ cấp. Không thấy chữ vượt nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://zhurnaly.com/z/Thinking,%20Fast%20and%20Slow.html", "https://www.nobelprize.org/uploads/2018/06/kahnemann-lecture.pdf" ]
    review: 'dung'
  - id: n57
    cau: 'Mục Áp dụng 3 (checklist): nghiên cứu trước–sau ở tám bệnh viện (Haynes và cộng sự, 2009) thấy tử vong giảm từ 1,5% xuống 0,8% và biến chứng từ 11,0% xuống 7,0% sau khi dùng checklist an toàn phẫu thuật.'
    loai: phat-hien
    nguon:
      - haynes2009
    trich: The rate of death was 1.5% before the checklist was introduced and declined to 0.8% afterward (P=0.003). Inpatient complications occurred in 11.0% of patients at baseline and in 7.0% after introduction of the checklist (P<0.001).
    vi_tri: Haynes 2009, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Phi công, bác sĩ phẫu thuật dùng checklist chính vì họ biết: dù giỏi đến đâu, Hệ 1 vẫn có lúc nhảy cóc... rẻ nhất để bắt Hệ 2 làm việc" (không nguồn cho lý do, cho phi công, hay "rẻ nhất"). Thay bằng hai nghiên cứu có nguồn. Review (Claude Opus 5.5, 10/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn. (Haynes 2009, lượt 2 đọc toàn văn).'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1056%252FNEJMra022137.zip/10.1056%252FNEJMsa0810119.pdf" ]
    review: 'dung'
  - id: n58
    cau: Một nghiên cứu ở 101 bệnh viện Ontario (Urbach và cộng sự, 2014) không thấy thay đổi đáng kể về tử vong và biến chứng khi áp dụng checklist (tử vong điều chỉnh 0,71% → 0,65%, OR 0,91, khoảng tin cậy 95% 0,80–1,03).
    loai: phat-hien
    nguon:
      - urbach2014
    trich: The adjusted risk of death during a hospital stay or within 30 days after surgery was 0.71% (95% confidence interval [CI], 0.66 to 0.76) before implementation of a surgical checklist and 0.65% (95% CI, 0.60 to 0.70) afterward (odds ratio, 0.91; 95% CI, 0.80 to 1.03; P=0.13).
    vi_tri: Urbach 2014, tóm tắt
    ket_qua: dung
    ghi_chu: Câu mới thêm vào trang ở lượt 1; biến chứng 3,86% → 3,82% (tóm tắt, câu sau).
    luot_2: dung
    luot_2_nguon: [ "https://www.nejm.org/doi/pdf/10.1056/NEJMsa1308261" ]
  - id: n59
    cau: 'Đang tranh cãi (chip ở mục 3): dùng checklist cho việc quan trọng lặp đi lặp lại.'
    loai: nhan
    nhan: tranh-cai
    co_so:
      - haynes2009
      - urbach2014
    ly_do: 'Hai nghiên cứu lớn trong phẫu thuật cho kết quả khác nhau: trước–sau ở tám bệnh viện thấy tử vong và biến chứng giảm rõ (Haynes 2009), còn nghiên cứu quy mô dân số ở Ontario không thấy thay đổi đáng kể (Urbach 2014). Bằng chứng mâu thuẫn; ngoài phẫu thuật chưa có nguồn đã mở.'
    nguon:
      - haynes2009
      - urbach2014
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: chip Khá vững. Chỗ khó: lời khuyên cho đời thường (hợp đồng, thuyết trình) suy từ phẫu thuật; chưa có nguồn đã mở cho bối cảnh đời thường; trang nói rõ "chỉ nên xem là một thử nghiệm đáng làm". Review (Claude Opus 5.5, 10/11/2026): giữ Đang tranh cãi: hai nghiên cứu lớn cho kết quả khác chiều (Haynes 2009, Urbach 2014); trang nói rõ lời khuyên đời thường chỉ là thử nghiệm đáng làm.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1056%252FNEJMra022137.zip/10.1056%252FNEJMsa0810119.pdf", "https://www.nejm.org/doi/pdf/10.1056/NEJMsa1308261" ]
    luot_2_ghi_chu: Nhãn 'Đang tranh cãi' là mức thận trọng và hợp thước đo (kết quả mâu thuẫn). Có tổng quan hệ thống khác về checklist phẫu thuật (không đọc ở đây) có thể xếp mạnh hơn cho riêng phẫu thuật; câu của trang rộng hơn (việc quan trọng lặp đi lặp lại).
    review: 'dung'
  - id: n60
    cau: 'Gợi ý: với quyết định khó đảo ngược, tạo một khoảng dừng (vài phút đến vài ngày); Kahneman cho rằng không thể liên tục nghi ngờ mọi suy nghĩ, cách tốt nhất là nhận ra tình huống dễ sai và cố gắng hơn khi rủi ro cao.'
    loai: loi-khuyen
    nguon:
      - kahneman2011
    trich: 'The best we can do is a compromise: learn to recognize situations in which mistakes are likely and try harder to avoid significant mistakes when the stakes are high.'
    vi_tri: Kahneman 2011, chương "The Characters of the Story"
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: chip Khá vững và "Khoảng dừng ... đảm bảo Hệ 2 đã được mời vào bàn". Bỏ chip; khoảng dừng là gợi ý của trang, chưa có nguồn đo hiệu quả; phần Kahneman có trích. Review (Claude Opus 5.5, 10/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn. Phần "vài phút đến vài ngày" ghi rõ là gợi ý của trang.'
    luot_2: dung
    luot_2_nguon: [ "https://zhurnaly.com/z/Thinking,%20Fast%20and%20Slow.html", "https://www.nobelprize.org/uploads/2018/06/kahnemann-lecture.pdf" ]
    luot_2_ghi_chu: Phần 'vài phút đến vài ngày' là gợi ý của trang, không phải của Kahneman; trang đã tách rõ.
    review: 'dung'
  - id: n61
    cau: 'Gợi ý: viết phương trình ra giấy giúp giải bài toán bóng và chày; trang chưa dẫn nghiên cứu đo hiệu quả của cách làm này.'
    loai: loi-khuyen
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ: chip Khá vững và "Viết ra giấy là cách thuê ngoài bộ nhớ cho Hệ 2... nơi Hệ 1 không còn đất diễn". Đã bỏ chip và khẳng định hiệu quả khỏi trang. Review (Claude Opus 5.5, 10/11/2026): trang chỉ còn gợi ý, nói rõ chưa dẫn nghiên cứu; da-bo đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nobelprize.org/uploads/2018/06/kahnemann-lecture.pdf" ]
    luot_2_ghi_chu: Trang đã nói chưa dẫn nghiên cứu đo hiệu quả.
    review: 'dung'
  - id: n62
    cau: 'Hoài nghi với các tuyên bố "mẹo priming": các hiệu ứng priming hành vi gốc còn đang tranh cãi, nên đừng xây thói quen quan trọng dựa trên chúng.'
    loai: loi-khuyen
    nguon:
      - doyen2012
      - weingarten2016
    trich: We conclude that unconscious behavioral priming is real, while real, involves mechanisms different from those typically assumed to cause the effect.
    vi_tri: Doyen 2012, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Từ hiệu ứng Florida, người ta đã suy ra đủ thứ mẹo lập trình tiềm thức" (khẳng định xã hội không nguồn; bỏ). Câu còn lại là lời khuyên suy từ khung Đang tranh cãi. Review (Claude Opus 5.5, 10/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://journals.plos.org/plosone/article/file?id=10.1371/journal.pone.0029081&type=printable", "https://doi.org/10.1037/bul0000030" ]
    luot_2_ghi_chu: Lời khuyên thận trọng hợp bằng chứng.
    review: 'dung'
