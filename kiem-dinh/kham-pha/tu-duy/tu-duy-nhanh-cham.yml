    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: từ gợi "Florida", "bingo"; tốc độ đo lén; "với hiệu ứng rất lớn (d = 1,04 ở thí nghiệm 2a và d = 0,79 ở thí nghiệm 2b, tính từ số liệu trong bài gốc)". Bài gốc không mở được (G1-L02 ghi 30 người mỗi thí nghiệm, t(28) = 2,86 và 2,16 nhưng không kèm trích); bỏ "bingo" (Kahneman không liệt kê) và hai số d; chữ mới theo Kahneman. Ghi cho người giao: mở bài gốc để thêm cỡ mẫu và số liệu nếu muốn. Review (Claude Opus 5.5, 10/11/2026): mô tả theo Kahneman 2011 (kể lại) có ghi rõ trên trang; bài gốc không mở được, lượt 1 đã bỏ các số không kiểm được. Đúng theo chuẩn mục 2 ("theo X kể lại").'
