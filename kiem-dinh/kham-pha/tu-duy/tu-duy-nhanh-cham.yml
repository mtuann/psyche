  - id: n33
    cau: Schneider và Shiffrin (1977) phân biệt xử lý tự động (không cần kiểm soát, không bị giới hạn năng lực, không nhất thiết cần chú ý) với xử lý có kiểm soát (cần chú ý, giới hạn năng lực, do người làm kiểm soát), qua thí nghiệm đo thời gian phản ứng và độ chính xác.
    loai: phat-hien
    nguon:
      - schneider1977
    trich: Automatic processing is activation of a learned sequence of elements in long-term memory that is initiated by appropriate inputs and then proceeds automatically—without subject control, without stressing the capacity limitations of the system, and without necessarily demanding attention. Controlled processing is a temporary activation of a sequence of elements that can be set up quickly and easily but requires attention, is capacity-limited (usually serial in nature), and is controlled by the subject.
    vi_tri: Schneider & Shiffrin 1977, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "phân biệt xử lý tự động với xử lý có kiểm soát"; thêm nội dung và phương pháp theo tóm tắt (cũng ở khung Khá vững). Review (Claude Opus 5.5, 10/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-295X.84.1.1.pdf" ]
    review: 'dung'
