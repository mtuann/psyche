nhan_dinh:
  - id: n1
    cau: 'Mô tả (description): Kahneman (2011) cho rằng ta nghĩ bằng hai hệ, Hệ 1 nhanh trực giác, Hệ 2 chậm phân tích; bài toán bóng và chày cho thấy đáp án trực giác có thể bật ra trước; không phải tuyên bố nào trong sách cũng đứng vững sau khủng hoảng tái lập.'
    loai: phat-hien
    nguon:
      - kahneman2011
      - frederick2005
    trich: 'A number came to your mind. The number, of course, is 10: 10¢. The distinctive mark of this easy puzzle is that it evokes an answer that is intuitive, appealing, and wrong.'
    vi_tri: Kahneman 2011, chương "The Lazy System 2"
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Hệ 1 luôn nhảy ra đáp án trước". Chữ mới: "đáp án trực giác có thể nhảy ra trước" (Frederick: đáp án sai chiếm ưu thế, không phải mọi người). Cụm "khủng hoảng tái lập" kiểm ở n28–n31, n42. Review (Claude Opus 5.5, 10/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nobelprize.org/uploads/2018/06/kahnemann-lecture.pdf", "https://open.lnu.se/index.php/metapsychology/article/download/2474/2516", "https://www.nature.com/polopoly_fs/7.6716.1349271308!/suppinfoFile/Kahneman%20Letter.pdf" ]
    luot_2_ghi_chu: Câu mô tả tổng hợp, mọi vế được các mục sau kiểm.
    review: 'dung'
  - id: n2
    cau: 'Bài toán: bóng và chày giá 1,10 đô la, chày đắt hơn bóng đúng 1,00 đô la; hỏi giá quả bóng.'
    loai: dinh-nghia
    nguon:
      - frederick2005
    trich: A bat and a ball cost $1.10. The bat costs $1.00 more than the ball. How much does the ball cost?
    vi_tri: Frederick 2005, tr. 26–27 (Hình 1)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.nobelprize.org/uploads/2018/06/kahnemann-lecture.pdf" ]
  - id: n3
    cau: Đáp án bật ra ngay trong đầu nhiều người là 10 xu — và đó là đáp án sai.
    loai: so-lieu
    nguon:
      - kahneman2011
      - frederick2005
    trich: More than 50% of students at Harvard, MIT, and Princeton gave the intuitive—incorrect—answer. At less selective universities, the rate of demonstrable failure to check was in excess of 80%.
    vi_tri: Kahneman 2011, chương "The Lazy System 2"
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "hầu hết mọi người" (không đúng: Frederick Bảng 1 cho MIT 48% đúng cả ba câu; Kahneman: hơn 50% sinh viên Harvard, MIT, Princeton và hơn 80% ở trường ít chọn lọc trả lời 10 xu). Chữ mới: "nhiều người". "Đáp án sai": Frederick: "10 cents ... is wrong". Review (Claude Opus 5.5, 10/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn. (Kahneman: hơn 50% sinh viên Harvard, MIT, Princeton trả lời sai). Quiz câu 1 vẫn còn "hầu hết": sửa ở n52.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nobelprize.org/uploads/2018/06/kahnemann-lecture.pdf" ]
    review: 'dung'
  - id: n4
    cau: Đáp án đúng là 5 xu (chày 1,05 đô la, bóng 0,05 đô la); nếu bóng 10 xu thì tổng là 1,20 đô la.
    loai: dinh-nghia
    nguon:
      - kahneman2011
      - frederick2005
    trich: If the ball costs 10¢, then the total cost will be $1.20 (10¢ for the ball and $1.10 for the bat), not $1.10. The correct answer is 5¢.
    vi_tri: Kahneman 2011, chương "The Lazy System 2"
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.nobelprize.org/uploads/2018/06/kahnemann-lecture.pdf" ]
  - id: n5
    cau: Bài toán bóng và chày là câu đầu tiên trong bài kiểm tra của Shane Frederick (2005), sau này gọi là CRT.
    loai: lich-su
    nguon:
      - frederick2005
    trich: (1) A bat and a ball cost $1.10 in total. The bat costs $1.00 more than the ball. How much does the ball cost? ... three-item "Cognitive Reflection Test" (CRT)
    vi_tri: Frederick 2005, Hình 1 và đoạn trước đó
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1257/089533005775196732" ]
    luot_2_ghi_chu: Chỉ đọc tóm tắt (AEA chặn toàn văn); bài bóng và chày là câu 1 theo mọi nguồn thứ cấp (Scribd bản bài, Wikipedia).
  - id: n6
    cau: Bài toán không đánh đố kiến thức toán; nó bẫy bằng một đáp án trực giác bật ra nhanh, dù lời giải dễ hiểu khi được giải thích.
    loai: phat-hien
    nguon:
      - frederick2005
    trich: The three items on the CRT are "easy" in the sense that their solution is easily understood when explained, yet reaching the correct answer often requires the suppression of an erroneous answer that springs "impulsively" to mind.
    vi_tri: Frederick 2005, tr. 27
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.nobelprize.org/uploads/2018/06/kahnemann-lecture.pdf" ]
  - id: n7
    cau: Kahneman đoạt giải Nobel năm 2002 cho công trình về phán đoán và ra quyết định mà ông làm cùng Amos Tversky.
    loai: lich-su
    nguon:
      - kahneman2011
    trich: Our collaboration on judgment and decision making was the reason for the Nobel Prize that I received in 2002, which Amos would have shared had he not died, aged fifty-nine, in 1996.
    vi_tri: Kahneman 2011, Introduction
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đoạt giải Nobel Kinh tế năm 2002 cho công trình về phán đoán và ra quyết định cùng Amos Tversky": Tversky mất năm 1996 nên không cùng nhận giải; chữ mới nói công trình làm cùng Tversky. Giải Nobel Kinh tế: không ghi lại vì sách không dùng tên giải. Review (Claude Opus 5.5, 10/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nobelprize.org/prizes/economic-sciences/2002/kahneman/facts/" ]
    luot_2_ghi_chu: Nobel 2002 cho Kahneman (chia với Vernon Smith). Tversky mất 1996 nên không thể được trao; 'cùng Tversky' là sự thật lịch sử, trang Nobel không nêu tên.
    review: 'dung'
  - id: n8
    cau: Kahneman mô tả tâm trí qua hai "nhân vật", Hệ 1 và Hệ 2.
    loai: phat-hien
    nguon:
      - kahneman2011
    trich: System 1 and System 2 are so central to the story I tell in this book that I must make it absolutely clear that they are fictitious characters.
    vi_tri: Kahneman 2011, chương "The Characters of the Story"
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "mỗi suy nghĩ của ta đều có hai nhân vật cùng tham gia" (quá mạnh so với cách Kahneman mô tả). Review (Claude Opus 5.5, 10/11/2026): chữ cuối khớp trích Kahneman 2011 của lượt 1 (bản quét Internet Archive); lượt 2 xác nhận ý qua Nobel lecture và trích thứ cấp. Không thấy chữ vượt nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nobelprize.org/uploads/2018/06/kahnemann-lecture.pdf" ]
    review: 'dung'
  - id: n9
    cau: 'Hệ 1 (tư duy nhanh): vận hành tự động và nhanh, ít hoặc không tốn sức, dựa vào trực giác; theo Kahneman nó nhận ra sự thù địch trong một giọng nói và trả lời ngay "2 + 2 = ?".'
    loai: dinh-nghia
    nguon:
      - kahneman2011
    trich: System 1 operates automatically and quickly, with little or no effort and no sense of voluntary control.
    vi_tri: 'Kahneman 2011, chương "The Characters of the Story" (danh sách việc của Hệ 1: "Detect hostility in a voice. Answer to 2 + 2 = ?")'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "không tốn sức, dựa vào trực giác, cảm xúc và thói quen. Chính nó nhận ra mặt người quen giữa đám đông" (không có trong danh sách của Kahneman; chữ mới dùng ví dụ trong sách; "cảm xúc và thói quen" bỏ). Review (Claude Opus 5.5, 10/11/2026): chữ cuối khớp trích Kahneman 2011 của lượt 1 (bản quét Internet Archive); lượt 2 xác nhận ý qua Nobel lecture và trích thứ cấp. Không thấy chữ vượt nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nobelprize.org/uploads/2018/06/kahnemann-lecture.pdf", "https://zhurnaly.com/z/Thinking,%20Fast%20and%20Slow.html" ]
    luot_2_ghi_chu: Toàn văn sách Kahneman 2011 không mở được (bản cho mượn); đối chiếu Nobel lecture 2003 (Kahneman) và trích dẫn thứ cấp. Lượt 1 nên đối chiếu số trang. Ví dụ 'nhận ra thù địch trong giọng nói', '2 + 2' là của chương 1.
    review: 'dung'
  - id: n10
    cau: 'Hệ 2 (tư duy chậm): vận hành có kiểm soát, tốn nỗ lực, dựa vào phân tích; theo Kahneman nó làm phép nhân 17 × 24; nó theo dõi và điều khiển các suy nghĩ do Hệ 1 gợi ra.'
    loai: dinh-nghia
    nguon:
      - kahneman2011
    trich: One of the main functions of System 2 is to monitor and control thoughts and actions "suggested" by System 1
    vi_tri: Kahneman 2011, chương "The Lazy System 2" và "Attention and Effort" ("You could not compute the product of 17 x 24 while making a left turn into dense traffic")
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "vận hành có ý thức... Chính nó làm phép nhân 17 × 24, viết phương trình x + (x + 1) = 1,10 ... và kiểm tra lại". Phương trình x + (x + 1) = 1,10 là ví dụ của trang, đã ghi rõ trên trang. Review (Claude Opus 5.5, 10/11/2026): chữ cuối khớp trích Kahneman 2011 của lượt 1 (bản quét Internet Archive); lượt 2 xác nhận ý qua Nobel lecture và trích thứ cấp. Không thấy chữ vượt nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nobelprize.org/uploads/2018/06/kahnemann-lecture.pdf", "https://zhurnaly.com/z/Thinking,%20Fast%20and%20Slow.html" ]
    luot_2_ghi_chu: Toàn văn sách Kahneman 2011 không mở được (bản cho mượn); đối chiếu Nobel lecture 2003 (Kahneman) và trích dẫn thứ cấp. Lượt 1 nên đối chiếu số trang. Ví dụ '17 × 24' là của chương 1.
    review: 'dung'
  - id: n11
    cau: 'Hệ 1 liên tục đưa ra ấn tượng và đáp án nhanh gọn; Hệ 2 theo dõi chúng nhưng có thể lười biếng: người trả lời "10 xu" không chủ động kiểm tra, nên Hệ 2 chấp nhận đáp án mà lẽ ra nó có thể bác bỏ chỉ với chút nỗ lực; theo Kahneman nhiều sai lầm đến từ khâu kiểm tra bị bỏ qua đó.'
    loai: phat-hien
    nguon:
      - kahneman2011
    trich: that person did not actively check whether the answer was correct, and her System 2 endorsed an intuitive answer that it could have rejected with a small investment of effort.
    vi_tri: Kahneman 2011, chương "The Lazy System 2"
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hệ 1 luôn lên tiếng trước... Hệ 2 thì thường lười biếng — nó chỉ bật dậy khi có gì sai sai... Phần lớn sai lầm trong tư duy không phải vì ta không biết tính, mà vì Hệ 2 đã gật đầu quá dễ dàng". "Luôn", "phần lớn" quá mạnh; Kahneman nói "at least for some people it is also lazy". Quiz câu 1, 4 cũng làm mềm tương ứng. Review (Claude Opus 5.5, 10/11/2026): chữ cuối khớp trích Kahneman 2011 của lượt 1 (bản quét Internet Archive); lượt 2 xác nhận ý qua Nobel lecture và trích thứ cấp. Không thấy chữ vượt nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nobelprize.org/uploads/2018/06/kahnemann-lecture.pdf" ]
    review: 'dung'
  - id: n12
    cau: 'Hệ 1/Hệ 2 là cách nói ẩn dụ: không phải hệ thống theo nghĩa thông thường, và không có một phần não nào mà mỗi hệ có thể gọi là nhà.'
    loai: phat-hien
    nguon:
      - kahneman2011
    trich: Systems 1 and 2 are not systems in the standard sense of entities with interacting aspects or parts. And there is no one part of the brain that either of the systems would call home.
    vi_tri: Kahneman 2011, chương "The Characters of the Story"
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Không có hai vùng não tương ứng với hai hệ; nhiều mạng lưới thần kinh cùng tham gia vào cả hai kiểu xử lý" (nửa sau không có trong Kahneman; bỏ). Dùng ở khung Đã bị bác bỏ, ngộ nhận 2 và quiz câu 5. Review (Claude Opus 5.5, 10/11/2026): chữ cuối khớp trích Kahneman 2011 của lượt 1 (bản quét Internet Archive); lượt 2 xác nhận ý qua Nobel lecture và trích thứ cấp. Không thấy chữ vượt nguồn. Ý này nay nằm trong khung ghi chú (:::note) ở mục Mức độ chắc chắn thay cho khung Đã bị bác bỏ (xem n43), cùng ngộ nhận 2 và quiz câu 5.'
    luot_2: dung
    luot_2_nguon: [ "https://zhurnaly.com/z/Thinking,%20Fast%20and%20Slow.html" ]
    luot_2_ghi_chu: Trích từ đoạn mở sách (BookBrowse/zhurnaly, thứ cấp).
    review: 'dung'
  - id: n13
    cau: 'Frederick đưa ba câu đố trông dễ nhưng đều gài một đáp án trực giác sai: bóng và chày; 5 máy làm 5 chi tiết trong 5 phút, 100 máy làm 100 chi tiết mất bao lâu; đám hoa súng gấp đôi mỗi ngày, phủ kín hồ sau 48 ngày thì phủ nửa hồ sau bao nhiêu ngày.'
    loai: phat-hien
    nguon:
      - frederick2005
    trich: (2) If it takes 5 machines 5 minutes to make 5 widgets, how long would it take 100 machines to make 100 widgets? (3) In a lake, there is a patch of lily pads. Every day, the patch doubles in size. If it takes 48 days for the patch to cover the entire lake, how long would it take for the patch to cover half of the lake?
    vi_tri: Frederick 2005, Hình 1 (CRT)
    ket_qua: dung
    ghi_chu: '"Chi tiết" là cách dịch của "widgets".'
