  - cu: 'Kahneman (2011): "gom hàng loạt hiệu ứng... đưa cặp khái niệm này đến độc giả đại chúng toàn thế giới"'
    moi: '"đưa... đến đông đảo độc giả. Kahneman ghi... Stanovich và West đưa ra các thuật ngữ"'
