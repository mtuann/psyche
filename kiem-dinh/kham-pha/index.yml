    cau: 'Mỗi bài ở Khám phá bắt đầu bằng một câu hỏi về con người và thường đi theo trình tự: tự thử hay tự đoán, điều đang xảy ra, nghiên cứu then chốt, mức độ chắc chắn, các cách giải thích, điều có thể áp dụng, góc nhìn văn hóa, ngộ nhận liên quan, câu hỏi suy ngẫm.'
