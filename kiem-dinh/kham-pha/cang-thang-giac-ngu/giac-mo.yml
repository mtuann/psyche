    cau: 'Mục Áp dụng 2 (không gắn nhãn): đừng tra sách giải mộng để đoán điềm; chúng tôi không tìm thấy nghiên cứu nào ủng hộ những công thức như "mơ thấy rắn là có lộc"; hỏi "giấc mơ này phản ánh cảm xúc hay lo lắng nào" hữu ích hơn, vì nội dung giấc mơ chịu tác động của một số loại trải nghiệm lúc thức (Revonsuo, 2000).'
