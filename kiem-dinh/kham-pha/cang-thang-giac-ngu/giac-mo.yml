  vi_tri: 'Results; tóm tắt: "Other stimulation frequencies were not effective"'
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "77% số lần kích thích … ở 25 Hz là 58%; còn dòng giả và tần số thấp thì không ai mơ tỉnh. Đây là gợi ý mạnh rằng sóng gamma … có vai trò gây ra". Chữ mới: theo thang tự đánh giá, "các tần số khác không hiệu quả", "các tác giả đề xuất … có thể". Lý do: "không ai mơ tỉnh" chưa kiểm; "gợi ý mạnh" quá mức với n=27.'
- id: n39
  cau: Tình trạng mơ tỉnh trong nghiên cứu được xác định qua thang tự báo cáo LuCiD của người tham gia; đây là một nghiên cứu nhỏ trong phòng thí nghiệm, không nên tự dùng thiết bị kích thích điện tại nhà.
  loai: phat-hien
  nguon:
  - voss2014
  trich: asked to rate dream consciousness based on a factor analytically derived and validated scale (LuCiD scale
  vi_tri: Online Methods
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "tuyệt đối không tự chế thiết bị kích thích điện tại nhà". Chữ mới: "không nên tự chế hay tự dùng …". Lý do: lời khuyên an toàn nhưng mềm hơn; không có nguồn nêu mức nguy hiểm.'
- id: n40
  cau: 'Saunders và cộng sự (2016): phân tích tổng hợp 50 năm nghiên cứu về mơ tỉnh: khoảng 55% (KTC 95% 49–62%, 34 nghiên cứu) từng mơ tỉnh ít nhất một lần; khoảng 23% (20–25%, 25 nghiên cứu) mơ tỉnh thường xuyên (ít nhất một lần mỗi tháng).'
