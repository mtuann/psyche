- id: n57
  cau: 'Mục Áp dụng 3: "Ác mộng lặp đi lặp lại: mơ tỉnh là hướng đang được nghiên cứu, chưa phải cách điều trị" :nhan[tranh-cai].'
  loai: nhan
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: tiêu đề "…mơ tỉnh là hướng can thiệp đang được nghiên cứu" và "Kết quả ban đầu khả quan nhưng chưa đủ để thành liệu pháp chuẩn — … tuyệt đối không tự mua thiết bị kích thích điện … hãy tìm chuyên gia giấc ngủ hoặc nhà trị liệu". Chữ mới: tiêu đề "…hướng đang được nghiên cứu, chưa phải cách điều trị", bỏ "kết quả ban đầu khả quan" (không có nguồn), thêm link Hỗ trợ và "không phải lời khuyên điều trị". Giữ id tiêu đề cũ. Chỗ khó: lượt 2 nên tìm tổng quan hệ thống về mơ tỉnh và ác mộng.'
  nhan: tranh-cai
