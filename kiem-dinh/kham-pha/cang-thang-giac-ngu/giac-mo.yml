  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Nhóm này cũng tỉnh giấc nhiều lần hơn trong đêm, và mỗi lần tỉnh đủ lâu … Kết luận của nhóm nghiên cứu: não người lúc ngủ vốn không lưu được thông tin mới — phải tỉnh dậy thì mới mã hóa được" (gán cho nghiên cứu PET). Chữ mới: gán đúng cho Vallat 2017, "đề xuất". Lý do: nhầm nguồn; con số 2 phút là đề xuất của tác giả.'
- id: n34
  cau: 'LaBerge và cộng sự (1981): 5 người có khả năng mơ tỉnh phát tín hiệu rằng họ biết đang mơ trong lúc điện não đồ xác nhận REM rõ ràng.'
