  loai: lich-su
  ket_qua: da-lam-mem
  ghi_chu: 'Chỗ khó: chưa dẫn được nghiên cứu văn hóa học nào xác nhận mức độ phổ biến; trang đã viết lại thành ví dụ minh họa. Chữ cũ: "Văn hóa Việt Nam có truyền thống giải mộng dân gian rất đậm: …" và hai ví dụ nữa ("nước trong/nước đục", "đám cưới là điềm không lành"), cùng "luận số đề". Chữ mới: hai ví dụ, bỏ phần còn lại. Lý do: không có nguồn.'
- id: n63
  cau: Chúng tôi không tìm thấy nghiên cứu bình duyệt nào cho thấy mơ thấy một con vật cụ thể thì dự báo được sự kiện cụ thể ngoài đời.
  loai: phat-hien
  nguon:
  - tim-bieu-tuong
  vi_tri: Europe PMC, 10/11/2026 (n47)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Không có nghiên cứu nào chứng minh mơ thấy con vật cụ thể thì dự báo được sự kiện cụ thể ngoài đời." Chữ mới: "Chúng tôi không tìm thấy …". Lý do: khẳng định phủ định mạnh, chuyển thành kết quả tìm.'
- id: n64
  cau: Tính đến 11/2026, chưa tìm thấy nghiên cứu công bố nào về nội dung giấc mơ, tần suất nhớ mơ, hay mơ tỉnh trên người Việt.
  loai: thoi-su
  nguon:
  - tim-vn-mo
  vi_tri: Europe PMC, 10/11/2026
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Chúng tôi chưa tìm thấy nghiên cứu công bố nào …" (không mốc). Chữ mới: mốc 11/2026, nêu nơi tìm (Europe PMC; chưa tìm tạp chí trong nước). Truy vấn: (dream* AND (recall OR content OR "lucid") AND Vietnam*) trả 1.138 kết quả nhiễu; đã xem 6 tiêu đề đầu, không có nghiên cứu về giấc mơ người Việt. Chưa đọc hết: chỗ khó.'
  het_han: '2028-11-01'
- id: n65
  cau: Các thí nghiệm trong bài thực hiện ở Mỹ, Đức, Ý, Pháp, Phần Lan và các mẫu khác; chúng tôi không dẫn được nghiên cứu nào trên người Việt cho các con số trong bài; 55% từng mơ tỉnh là ước lượng tổng hợp nhiều nước.
  loai: phat-hien
  nguon:
  - saunders-abs
  trich: a heterogeneous lucid dreaming prevalence data set of 34 studies yielded a mean estimate of 55%
  vi_tri: tóm tắt Saunders 2016
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Mọi con số trong bài (55% từng mơ tỉnh, 5,2 buổi sáng nhớ mơ mỗi tuần...) đều đến từ mẫu phương Tây." Chữ mới: nêu nước theo bài: Voss (Đức, Göttingen), Marzano (Ý, Rome), Eichenlaub (Pháp, Lyon), Valli (Phần Lan, trẻ em Kurd), Revonsuo (Phần Lan), LaBerge (Mỹ: Stanford); Saunders là tổng hợp nhiều nước. Lý do: "đều từ phương Tây" sai (trẻ em Kurd; tổng hợp nhiều nước).'
- id: n66
  cau: 'Suy luận (đã ghi rõ chưa kiểm tra): nội dung mơ có thể chịu ảnh hưởng văn hóa, nên có thể có chủ đề đặc thù chưa được đo.'
  loai: phat-hien
  nguon:
  - revonsuo-abs
  trich: dream content is consistently and powerfully modulated by certain types of waking experiences
  vi_tri: tóm tắt Revonsuo 2000
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "người Việt sống trong gia đình nhiều thế hệ, tín ngưỡng thờ cúng tổ tiên, áp lực thi cử... hoàn toàn có thể mơ những chủ đề đặc thù". Chữ mới: "chúng tôi suy luận (chưa kiểm tra) … có thể có". Lý do: bỏ các ví dụ không có nguồn; giữ suy luận vì nội dung mơ chịu ảnh hưởng trải nghiệm lúc thức (n56).'
- id: n67
  cau: 'Ngộ nhận "giấc mơ chỉ xảy ra trong REM": người được đánh thức từ giấc ngủ nông (giai đoạn 2) cũng có thể nhớ được giấc mơ.'
  loai: phat-hien
  nguon:
  - marzano-abs
  trich: recalling a dream(s) after awakening from non-rapid eye movement (NREM) and rapid eye movement (REM) sleep
  vi_tri: tóm tắt Marzano 2011
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Sai. Mơ xảy ra ở mọi giai đoạn ngủ; REM cho những giấc mơ sống động, dài và giàu cảm xúc nhất, còn giấc ngủ nông cũng có mơ nhưng thường mờ nhạt". Chữ mới: "Không đúng hẳn … cũng có thể nhớ được giấc mơ (Marzano 2011); không nêu so sánh độ sống động". Lý do: "mọi giai đoạn", "sống động, dài, giàu cảm xúc nhất" không kiểm được.'
- id: n68
  cau: 'Ngộ nhận "mơ thấy X là điềm Y": chúng tôi không tìm thấy nghiên cứu bình duyệt nào chứng minh một "từ điển" chung cho tất cả mọi người.'
  loai: phat-hien
  nguon:
  - tim-bieu-tuong
  vi_tri: Europe PMC, 10/11/2026
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Cùng một hình ảnh trong mơ, ý nghĩa cảm xúc của nó phụ thuộc vào đời sống của người mơ — không có từ điển chung". Chữ mới: "chúng tôi không tìm thấy nghiên cứu … chứng minh một từ điển chung". Lý do: n46, n47.'
- id: n69
  cau: 'Ngộ nhận "mơ tỉnh là muốn làm gì trong mơ cũng được": mơ tỉnh là biết mình đang mơ trong lúc mơ (LaBerge 1981); chúng tôi chưa dẫn được nghiên cứu nào về mức kiểm soát nội dung mơ.'
  loai: phat-hien
  nguon:
  - laberge1981
  trich: dreaming while being conscious that one is dreaming
  vi_tri: tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Biết mình đang mơ và điều khiển được giấc mơ là hai mức độ khác nhau; nhiều người chỉ đạt mức đầu. Khả năng điều khiển tăng dần theo luyện tập, nhưng hiếm khi đạt mức đạo diễn toàn năng." Chữ mới: câu hiện tại. Lý do: không có nguồn cho mức kiểm soát hay hiệu ứng luyện tập.'
- id: n70
  cau: 'Ngộ nhận "quên giấc mơ là do trí nhớ kém": người nhớ mơ nhiều và ít khác nhau ở hoạt động não và số lần thức giấc dài (Eichenlaub 2014; Vallat 2017); các nghiên cứu này không so sánh trí nhớ nói chung hay trí thông minh.'
  loai: phat-hien
  nguon:
  - vallat2017
  trich: High dream recallers (HR) show a larger brain reactivity to auditory stimuli during wakefulness and sleep as compared to low dream recallers (LR) and also more intra-sleep wakefulness
  vi_tri: tóm tắt Vallat 2017
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Không. Quên mơ là trạng thái mặc định của một bộ não khỏe mạnh, do hóa học não trong lúc ngủ không thuận cho việc ghi nhớ. Người nhớ mơ mỗi sáng không thông minh hơn — họ chỉ tỉnh giấc nhiều lần hơn". Chữ mới: câu hiện tại. Lý do: "trạng thái mặc định" và "không thông minh hơn" không có nguồn.'
- id: n71
  cau: 'Ngộ nhận "tự kích thích điện não tại nhà để mơ tỉnh": không nên làm; thí nghiệm của Voss thực hiện trong phòng thí nghiệm, theo dõi điện não liên tục; chúng tôi không thấy bằng chứng việc tự dùng thiết bị ở nhà là an toàn và hiệu quả.'
  loai: loi-khuyen
  nguon:
  - voss2014
  trich: tACS was applied following ~2 min of uninterrupted arousal-free REM sleep
  vi_tri: Online Methods (theo dõi EEG, EOG, EMG liên tục)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Cực kỳ nguy hiểm và không nên làm … thiết bị y tế, liều lượng được kiểm soát … Không có thiết bị tiêu dùng nào được chứng minh an toàn và hiệu quả." Chữ mới: "Không nên làm … chúng tôi không thấy bằng chứng …". Lý do: bỏ "cực kỳ nguy hiểm" và "không có thiết bị nào" (khẳng định phủ định không kiểm được).'
- id: n72
  cau: 'Hai mục "Đọc thêm": Ngủ có giúp nhớ bài? (giấc ngủ làm gì cho trí nhớ); Stress có luôn có hại? (stress và niềm tin về stress).'
  loai: ve-site
  ket_qua: da-sua
  ghi_chu: 'Đã kiểm trên trang: ngu-va-tri-nho.md nói về giấc ngủ và trí nhớ; stress-co-hai.md nói về stress, niềm tin về stress, và phục hồi (có nhắc giấc ngủ ở mục Áp dụng 2). Chữ cũ của mô tả: "stress và giấc ngủ", sửa cho khớp trang đích.'
- id: q1
  cau: 'Câu hỏi 1: giả thuyết kích hoạt–tổng hợp: thân não (đặc biệt là pons) tạo ra tín hiệu kích hoạt não trước; vỏ não tổng hợp thành giấc mơ.'
  loai: phat-hien
  nguon:
  - hobson1977
  trich: The most important tenet of the activation-synthesis hypothesis is that during dreaming the activated brain generates its own information by a pontine brain stem neuronal mechanism
  vi_tri: tr. 1335
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: đáp án "xung điện ngẫu nhiên … câu chuyện có vẻ hợp lý — đó là giấc mơ" và giải thích "tính kỳ quặc của mơ chính là vì nguyên liệu đầu vào vốn đã lộn xộn". Chữ mới: theo n6, n17. Lý do: "ngẫu nhiên hoàn toàn" không đúng.'
- id: q2
  cau: 'Câu hỏi 2: Solms (1997, 2000): tổn thương một số vùng não trước có thể làm mất việc báo cáo giấc mơ mà không đổi đáng kể REM; quan điểm còn tranh luận.'
  loai: phat-hien
  nguon:
  - solms2000
  trich: these lesions do not have any appreciable effects on REM frequency, duration, and density
  vi_tri: tóm tắt Solms 2000
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Phát hiện của Solms (1997) trên 361 bệnh nhân …; (+) tổn thương … trán giữa-bụng, chỗ nối thái dương–đỉnh–chẩm … mất hoàn toàn khả năng mơ …; (-) Tổn thương thân não luôn xóa sổ cả REM lẫn giấc mơ." Chữ mới: bỏ 361, vùng não nêu chung, phương án sai "Mọi tổn thương não đều xóa sổ cả REM lẫn giấc mơ". Lý do: n18–n20.'
- id: q3
  cau: 'Câu hỏi 3: vì sao quên giấc mơ: nhớ liên quan đến lần thức giấc đủ dài (Vallat đề xuất tối thiểu khoảng 2 phút) và hoạt động điện não khi tỉnh; cơ chế chi tiết là giả thuyết.'
  loai: phat-hien
  nguon:
  - vallat2017full
  trich: awakening duration (and not arousal) is the critical parameter for dream recall
  vi_tri: tóm tắt Vallat 2017
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: đáp án "norepinephrine ở mức rất thấp và vỏ não trước trán hoạt động yếu … chỉ khi tỉnh giấc đủ lâu (khoảng 2 phút), não mới bắt đầu lưu" và giải thích "đúng cửa sổ mã hóa vừa mở ra". Chữ mới: theo n33, n51. Lý do: n44.'
- id: q4
  cau: 'Câu hỏi 4: LaBerge và cộng sự (1981) ghi nhận khách quan mơ tỉnh: dặn trước 5 người có khả năng mơ tỉnh thực hiện một tín hiệu đã hẹn khi nhận ra mình đang mơ; tín hiệu được ghi lại trong lúc điện não đồ xác nhận REM rõ ràng.'
  loai: phat-hien
  nguon:
  - laberge1981
  trich: signaled that they knew they were dreaming while continuing to dream during unequivocal REM sleep
  vi_tri: tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: đáp án "đảo mắt theo chuỗi trái–phải–trái–phải"; giải thích "mọi cơ bắp đều bị liệt trừ cơ mắt … lần đầu tiên … xác minh khách quan". Chữ mới: "tín hiệu đã hẹn trước", "(trừ cơ hô hấp và tuần hoàn)". Lý do: n34, n35. Phương án nhiễu "Dùng điện cực … 40 Hz" thuộc Voss, không phải LaBerge (đúng là nhiễu).'
- id: n73
  cau: 'Mục Nguồn: Eichenlaub 2014 (hai bài), Freud 1900, Hobson & McCarley 1977, LaBerge 1981, Marzano 2011, Revonsuo 2000, Saunders 2016, Solms 1997 và 2000, Hobson 2000, Valli 2005 và 2009, Vallat 2017, Voss 2014, Zadra 2006 có tên, tạp chí, tập, trang, DOI đúng.'
  loai: lich-su
  ket_qua: da-sua
  ghi_chu: 'Đối chiếu Crossref/Europe PMC (10/11/2026) cho các DOI mới thêm; các DOI cũ khớp. Chữ cũ: mục Nguồn thiếu DOI cho nhiều bài và thiếu Solms 2000, Hobson 2000, Eichenlaub (NPP): đã thêm. Solms 2000 BBS 23(6) 843–850 và Hobson 2000 BBS 23(6) 793–842: số trang chưa đối chiếu từng chữ (lượt 2). Freud 1900 ghi "London: Hogarth Press": bản Hogarth là 1953 (Standard Edition); bản đầu: Leipzig–Wien, Deuticke (1899/1900): chỗ cần sửa mục Nguồn.'
doi_chu:
- cu: '- **Phe não bộ (Hobson & McCarley):** giấc mơ khởi đầu chỉ là "nhiễu" điện ngẫu nhiên của thân não; ý nghĩa (nếu có) là do vỏ não tự "bịa" ra sau.'
  moi: '- **Phe não bộ (Hobson & McCarley):** giấc mơ do thân não kích hoạt (một phần ngẫu nhiên), còn vỏ não "tổng hợp" nội dung từ tín hiệu ấy và ký ức đã lưu.'
  ly_do: Sửa theo nguồn đã đọc (mã sửa g1); xem ghi_chu của các nhận định tương ứng.
- cu: '- **Phe tiến hóa (Revonsuo):** giấc mơ là buổi "diễn tập" sinh tồn mà tiến hóa giữ lại — đặc biệt là diễn tập đối phó với nguy hiểm.'
  moi: '- **Phe tiến hóa (Revonsuo):** giả thuyết rằng giấc mơ là buổi "diễn tập" sinh tồn mà tiến hóa giữ lại — đặc biệt là diễn tập đối phó với nguy hiểm.'
  ly_do: Sửa theo nguồn đã đọc (mã sửa g2); xem ghi_chu của các nhận định tương ứng.
- cu: '- **Phe Freud:** giấc mơ nào cũng có nghĩa — nó là ước muốn bị kìm nén được ngụy trang.'
  moi: '- **Phe Freud:** theo Freud, giấc mơ nào cũng có nghĩa — nó là sự thỏa mãn ước muốn được ngụy trang.'
  ly_do: Sửa theo nguồn đã đọc (mã sửa g3); xem ghi_chu của các nhận định tương ứng.
- cu: 'biến lớp ẩn thành lớp hiện bằng ba thủ thuật: **condensation** (ngưng tụ — nhiều ý nghĩa dồn vào một hình ảnh), **displacement** (chuyển dời — cảm xúc thật bị dời sang đối tượng vô hại), và **symbolization** (biểu tượng hóa — ví dụ một vật dài tượng trưng cho điều khác). Vì vậy giấc mơ được ông gọi là "con đường hoàng gia dẫn đến vô thức".'
  moi: 'biến lớp ẩn thành lớp hiện, trong đó có hai cơ chế chính: **condensation** (ngưng tụ — nhiều ý nghĩa dồn vào một hình ảnh) và **displacement** (chuyển dời — trọng tâm cảm xúc bị dời sang chi tiết khác, nên giấc mơ hiện ra rất khác ý nghĩ ẩn).'
  ly_do: Sửa theo nguồn đã đọc (mã sửa f1); xem ghi_chu của các nhận định tương ứng.
- cu: 'đề xuất rằng mỗi giấc mơ có hai lớp:'
  moi: 'đề xuất rằng mỗi giấc mơ là sự thỏa mãn một ước muốn và có hai lớp:'
  ly_do: Sửa theo nguồn đã đọc (mã sửa f2); xem ghi_chu của các nhận định tương ứng.
- cu: '**Hạn chế cần nói thẳng.** Phương pháp của Freud không thể kiểm chứng hay tái lập theo chuẩn khoa học hiện đại: cùng một giấc mơ, hai nhà phân tâm có thể "giải" ra hai nghĩa khác nhau mà không cách nào phân xử. Đây là lý do tâm lý học thực nghiệm sau này quay lưng với ông — dù một số ý tưởng của ông (rằng giấc mơ liên quan đến cảm xúc và trí nhớ) vẫn được nghiên cứu lại bằng ph…'
  moi: '**Hạn chế cần nói thẳng.** Phương pháp giải mơ của Freud khó kiểm chứng và khó tái lập theo chuẩn khoa học hiện đại: cùng một giấc mơ, hai nhà phân tâm có thể "giải" ra hai nghĩa khác nhau mà không có cách phân xử độc lập. Đây là một lý do nhiều nhà tâm lý học thực nghiệm sau này đặt lại vấn đề với lý thuyết của ông — dù một số ý tưởng (rằng nội dung giấc mơ liên quan đến cảm x…'
  ly_do: Sửa theo nguồn đã đọc (mã sửa f3); xem ghi_chu của các nhận định tương ứng.
- cu: các điện cực ghi trên thân não (đặc biệt là **pons**, cầu não) của động vật thí nghiệm cho thấy trong REM, pons phát ra những chùm xung điện ngẫu nhiên, mạnh mẽ; đồng thời các chất dẫn truyền thần kinh amin (như norepinephrine, serotonin) gần như "tắt" trong REM.
  moi: ghi nhận trên động vật cho thấy cơ chế thần kinh ở thân não (đặc biệt là **pons**, cầu não) kích hoạt não trước một cách tự động và theo chu kỳ trong giấc ngủ có mơ, với những đợt hoạt động mạnh và rời rạc ở các mạch cảm giác–vận động của thân não; đồng thời tỉ lệ các chất dẫn truyền thay đổi, có thể liên quan đến việc quên giấc mơ.
  ly_do: Sửa theo nguồn đã đọc (mã sửa h1); xem ghi_chu của các nhận định tương ứng.
- cu: 'pons "kích hoạt" ngẫu nhiên các vùng não trước (activation), và vỏ não — cỗ máy chuyên tìm ý nghĩa — cố "tổng hợp" mớ tín hiệu lộn xộn ấy thành một câu chuyện có vẻ hợp lý (synthesis). Giấc mơ kỳ quặc, phi logic chính là vì nguyên liệu đầu vào vốn đã lộn xộn. Thông điệp gây sốc của bài báo: giấc mơ **không cần** một ý nghĩa tâm lý sâu xa nào để tồn tại'
  moi: thân não "kích hoạt" não trước (activation), và não trước "tổng hợp" thông tin do thân não tạo ra với thông tin đã lưu trong trí nhớ thành nội dung giấc mơ (synthesis); bài viết nói thông tin ấy "một phần ngẫu nhiên, một phần đặc hiệu". Theo cách đọc phổ biến, điều này hàm ý giấc mơ **không cần** một ý nghĩa tâm lý sâu xa nào để tồn tại
  ly_do: Sửa theo nguồn đã đọc (mã sửa h2); xem ghi_chu của các nhận định tương ứng.
- cu: Nhà thần kinh tâm lý Mark Solms rà soát **361 ca** bệnh nhân tổn thương não khu trú, đối chiếu vị trí tổn thương với việc người bệnh còn mơ hay mất hẳn khả năng mơ.
  moi: Nhà thần kinh tâm lý Mark Solms tổng hợp các ca bệnh nhân tổn thương não khu trú (sách năm 1997, tóm tắt lại trong bài tổng quan năm 2000), đối chiếu vị trí tổn thương với việc người bệnh còn mơ hay mất khả năng mơ. Chúng tôi chưa mở được toàn văn sách; phần này theo bài tóm tắt năm 2000 và theo bài của Eichenlaub và cộng sự (2014) kể lại.
  ly_do: Sửa theo nguồn đã đọc (mã sửa s1); xem ghi_chu của các nhận định tương ứng.
- cu: '(1) tổn thương ở chất trắng vùng trán giữa-bụng (ventromesial frontal) hoặc ở chỗ nối thái dương–đỉnh–chẩm (temporo-parietal-occipital junction) có thể làm **mất hoàn toàn** giấc mơ — trong khi giấc ngủ REM của họ vẫn bình thường; (2) ngược lại, tổn thương thân não làm mất REM nhưng người bệnh **vẫn mơ được**. Nghĩa là mơ và REM có thể tách rời nhau: mơ không đồng nhất với REM,…'
  moi: (1) tổn thương một số vùng não trước (chất trắng vùng trán trong, chỗ nối thái dương–đỉnh) có thể làm **mất** việc báo cáo giấc mơ, và theo Solms (2000) những tổn thương dọc một đường dẫn truyền ở não trước làm mất giấc mơ mà không đổi đáng kể tần số, thời gian và mật độ REM; (2) giấc mơ cũng có thể xuất hiện trong giấc ngủ không REM. Nghĩa là mơ và REM có thể tách rời nhau, và…
  ly_do: Sửa theo nguồn đã đọc (mã sửa s2); xem ghi_chu của các nhận định tương ứng.
- cu: Một nghiên cứu độc lập khác trên **212 giấc mơ lặp đi lặp lại** cũng thấy 66% chứa ít nhất một sự kiện đe dọa (Zadra và cộng sự, 2006).
  moi: Một nghiên cứu khác trên **212 giấc mơ lặp đi lặp lại** cũng thấy 66% chứa ít nhất một mối đe dọa, nhưng chỉ 6 trong 8 giả thuyết được kiểm tra có bằng chứng ủng hộ và các tác giả kết luận bằng chứng "hỗn hợp" (Zadra và cộng sự, 2006).
  ly_do: Sửa theo nguồn đã đọc (mã sửa r1); xem ghi_chu của các nhận định tương ứng.
- cu: 'Điểm yếu lớn nhất, được chính một bài tổng quan ủng hộ lý thuyết này thừa nhận: **chưa có bằng chứng trực tiếp** nào cho thấy việc "diễn tập" trong mơ thật sự giúp phản ứng tốt hơn ngoài đời thật, hay giúp tăng cơ hội sống sót qua các thế hệ (Valli và Revonsuo, 2009). Bằng chứng hiện tại mới chỉ dừng ở mức "nội dung mơ phù hợp với dự đoán", chưa chứng minh được chức năng.'
  moi: 'Điểm yếu cần nói rõ: các nghiên cứu nêu ở đây chủ yếu phân tích **nội dung** giấc mơ; chúng tôi chưa thấy thí nghiệm nào cho thấy việc "diễn tập" trong mơ thật sự giúp phản ứng tốt hơn ngoài đời thật. Một bài tổng quan của những người ủng hộ lý thuyết (Valli và Revonsuo, 2009) cho rằng điểm mạnh của lý thuyết nhiều hơn điểm yếu, trong khi Zadra và cộng sự (2006) chỉ thấy ủng hộ…'
  ly_do: Sửa theo nguồn đã đọc (mã sửa r2); xem ghi_chu của các nhận định tương ứng.
- cu: 'Trẻ em trong môi trường đe dọa mơ thấy nhiều nội dung đe dọa hơn hẳn, và các mối đe dọa trong mơ cũng nghiêm trọng hơn — đúng như lý thuyết dự đoán: hệ thống mô phỏng đe dọa "kích hoạt" mạnh hơn khi đời thật nhiều nguy hiểm.'
  moi: Trẻ em bị sang chấn nặng báo cáo nhiều giấc mơ hơn và giấc mơ có nhiều sự kiện đe dọa hơn, và các mối đe dọa cũng nặng hơn — phù hợp với dự đoán của lý thuyết (hệ thống mô phỏng đe dọa "kích hoạt" mạnh hơn khi đời thật nhiều nguy hiểm); tác giả viết kết quả "ủng hộ hầu hết các dự đoán".
  ly_do: Sửa theo nguồn đã đọc (mã sửa r3); xem ghi_chu của các nhận định tương ứng.
- cu: Trên mẫu sinh viên ngủ trong phòng thí nghiệm với điện não đồ, bị đánh thức vào buổi sáng từ giấc ngủ REM hoặc từ giai đoạn 2 (ngủ nông), rồi được hỏi có nhớ mơ không.
  moi: Trên mẫu 65 sinh viên đại học (35 nam, 30 nữ) ngủ trong phòng thí nghiệm với điện não đồ, bị đánh thức vào buổi sáng từ giấc ngủ REM hoặc từ giai đoạn 2 (ngủ nông), rồi được hỏi có nhớ mơ không.
  ly_do: Sửa theo nguồn đã đọc (mã sửa m1); xem ghi_chu của các nhận định tương ứng.
- cu: '**Kết quả.** Hoạt động **sóng theta** (5–7 Hz) ở vùng trán trong 5 phút trước khi tỉnh khỏi REM càng mạnh thì người đó càng dễ nhớ được giấc mơ — đúng kiểu sóng não cũng xuất hiện khi chúng ta mã hóa ký ức lúc thức. Với người tỉnh từ giấc ngủ nông (giai đoạn 2), yếu tố dự báo lại là sóng **alpha** (8–12 Hz) ở thái dương phải càng *thấp* càng nhớ tốt. Đây là bằng chứng đầu tiên …'
  moi: '**Kết quả.** Sau khi tỉnh khỏi REM, hoạt động **sóng theta** (5–7 Hz) ở vùng trán cao hơn đi kèm việc nhớ được giấc mơ — kiểu sóng cũng tăng khi mã hóa ký ức lúc thức. Với người tỉnh từ giấc ngủ nông (giai đoạn 2), sóng **alpha** (8–12 Hz) ở vùng thái dương phải càng *thấp* thì càng nhớ được mơ. Các tác giả coi đây là bằng chứng đầu tiên về những dấu hiệu điện não rõ ràng của v…'
  ly_do: Sửa theo nguồn đã đọc (mã sửa m2); xem ghi_chu của các nhận định tương ứng.
- cu: '### Eichenlaub và cộng sự (2014): người hay nhớ mơ có bộ não "nhạy" hơn'
  moi: '### Eichenlaub và cộng sự (2014): người hay nhớ mơ có hoạt động não khác'
  ly_do: Sửa theo nguồn đã đọc (mã sửa e0); xem ghi_chu của các nhận định tương ứng.
- cu: Dùng PET (chụp cắt lớp phát xạ positron) đo hoạt động não của 41 tình nguyện viên trong lúc thức và lúc ngủ, chia thành 21 người **nhớ mơ nhiều** (trung bình nhớ mơ 5,2 buổi sáng mỗi tuần) và 20 người **nhớ mơ ít** (trung bình chỉ khoảng 2 giấc mơ mỗi tháng).
  moi: Dùng PET (chụp cắt lớp phát xạ positron) đo lưu lượng máu não của 41 tình nguyện viên nam khỏe mạnh trong lúc thức và lúc ngủ ([Eichenlaub và cộng sự, 2014](https://doi.org/10.1038/npp.2014.6)), chia thành 21 người **nhớ mơ nhiều** (trung bình khoảng 5,2 lần nhớ mơ mỗi tuần) và 20 người **nhớ mơ ít** (trung bình khoảng 0,5 lần mỗi tuần).
  ly_do: Sửa theo nguồn đã đọc (mã sửa e1); xem ghi_chu của các nhận định tương ứng.
- cu: Nhóm nhớ mơ nhiều có hoạt động tự phát mạnh hơn ở **vỏ não trước trán giữa** (medial prefrontal cortex — mPFC) và **chỗ nối thái dương–đỉnh** (temporo-parietal junction — TPJ) — cả lúc thức lẫn lúc ngủ. Đây là các vùng liên quan đến định hướng sự chú ý ra môi trường bên ngoài. Nhóm này cũng tỉnh giấc nhiều lần hơn trong đêm, và mỗi lần tỉnh đủ lâu để não kịp "lưu" giấc mơ vào t…
  moi: Nhóm nhớ mơ nhiều có lưu lượng máu cao hơn ở **chỗ nối thái dương–đỉnh** (temporo-parietal junction — TPJ) trong REM, giấc ngủ sâu và lúc thức, và ở **vỏ não trước trán giữa** (medial prefrontal cortex — mPFC) trong REM và lúc thức. Một nghiên cứu khác của cùng nhóm (36 người, 18 nhớ mơ nhiều và 18 nhớ mơ ít) thấy phản ứng não với âm thanh (tên riêng) khác nhau giữa hai nhóm cả…
  ly_do: Sửa theo nguồn đã đọc (mã sửa e2); xem ghi_chu của các nhận định tương ứng.
- cu: 'cho họ ngủ trong phòng thí nghiệm và dặn trước: khi nào nhận ra mình đang mơ, hãy đảo mắt theo một chuỗi đã hẹn trước (trái–phải–trái–phải). Vì trong REM cơ bắp bị liệt nhưng cơ mắt thì không, chuỗi đảo mắt này được máy ghi lại như một "tín hiệu" từ trong giấc mơ ra ngoài đời thật.'
  moi: 'cho họ ngủ trong phòng thí nghiệm và dặn trước: khi nào nhận ra mình đang mơ, hãy thực hiện một tín hiệu đã hẹn trước bằng hành động trong mơ, có biểu hiện quan sát được từ bên ngoài (thường được mô tả là chuỗi đảo mắt; chúng tôi chưa mở toàn văn để kiểm chi tiết này). Vì trong REM cơ bắp bị liệt nhưng cơ mắt thì không (OpenStax, mục 4.3 nói REM đi kèm liệt cơ trừ cơ hô hấp và …'
  ly_do: Sửa theo nguồn đã đọc (mã sửa l1); xem ghi_chu của các nhận định tương ứng.
- cu: Cả 5 người đều phát tín hiệu thành công trong lúc điện não đồ xác nhận họ đang ở REM rõ ràng — lần đầu tiên trong lịch sử, một trải nghiệm chủ quan trong mơ được **xác minh khách quan** từ bên ngoài
  moi: Theo tóm tắt, hiện tượng mơ tỉnh được xác minh ở 5 người đã phát tín hiệu rằng họ biết mình đang mơ trong lúc điện não đồ xác nhận họ đang ở REM rõ ràng — một trải nghiệm chủ quan trong mơ được **ghi nhận khách quan** từ bên ngoài
  ly_do: Sửa theo nguồn đã đọc (mã sửa l2); xem ghi_chu của các nhận định tương ứng.
- cu: 27 tình nguyện viên trẻ khỏe mạnh, chưa từng mơ tỉnh, ngủ nhiều đêm trong phòng thí nghiệm.
  moi: 27 tình nguyện viên trẻ khỏe mạnh (18–26 tuổi), chưa có kinh nghiệm mơ tỉnh, ngủ nhiều đêm trong phòng thí nghiệm.
  ly_do: Sửa theo nguồn đã đọc (mã sửa v1); xem ghi_chu của các nhận định tương ứng.
- cu: Hai phút sau khi vào REM, nhóm nghiên cứu chiếu một dòng điện xoay chiều yếu xuyên sọ (tACS — transcranial alternating current stimulation) vào vùng trán trong 30 giây, ở các tần số từ 2 đến 100 Hz, hoặc dòng giả (không có điện) để đối chứng.
  moi: Sau khoảng 2 phút REM không bị gián đoạn, nhóm nghiên cứu chiếu một dòng điện xoay chiều yếu xuyên sọ (tACS — transcranial alternating current stimulation) vào vùng trán–thái dương trong 30 giây, ở các tần số 2, 6, 12, 25, 40, 70 hoặc 100 Hz, hoặc dòng giả (không có điện) để đối chứng.
  ly_do: Sửa theo nguồn đã đọc (mã sửa v2); xem ghi_chu của các nhận định tương ứng.
- cu: Ở tần số **40 Hz** (dải sóng gamma, gắn với ý thức lúc thức), 77% số lần kích thích khiến người mơ trở nên "tỉnh" trong mơ (tự nhận ra mình đang mơ); ở **25 Hz** là 58%; còn dòng giả và tần số thấp thì không ai mơ tỉnh. Đây là gợi ý mạnh rằng sóng gamma ở vỏ não trước trán có vai trò **gây ra** (chứ không chỉ đi kèm) trạng thái mơ tỉnh
  moi: Theo thang tự đánh giá mức tỉnh táo trong mơ, mơ tỉnh nổi bật nhất khi kích thích ở **25 Hz** (58%) và **40 Hz** (77%) (dải gamma thấp); các tần số khác không hiệu quả. Các tác giả đề xuất rằng sóng gamma ở vùng trán có thể có vai trò **gây ra** (chứ không chỉ đi kèm) sự tự nhận thức trong mơ
  ly_do: Sửa theo nguồn đã đọc (mã sửa v3); xem ghi_chu của các nhận định tương ứng.
- cu: Đây mới là một nghiên cứu nhỏ trong phòng thí nghiệm — tuyệt đối không tự chế thiết bị kích thích điện tại nhà.
  moi: Đây mới là một nghiên cứu nhỏ trong phòng thí nghiệm — không nên tự chế hay tự dùng thiết bị kích thích điện tại nhà.
  ly_do: Sửa theo nguồn đã đọc (mã sửa v4); xem ghi_chu của các nhận định tương ứng.
- cu: Khoảng **55%** số người được khảo sát cho biết đã từng mơ tỉnh ít nhất một lần trong đời, và khoảng **23%** mơ tỉnh thường xuyên (ít nhất mỗi tháng một lần). Mơ tỉnh không phải năng lực hiếm của "thiên tài" — nó là trải nghiệm khá phổ biến
  moi: 'Ước lượng trung bình khoảng **55%** (khoảng tin cậy 95%: 49–62%, từ 34 nghiên cứu) số người từng mơ tỉnh ít nhất một lần trong đời, và khoảng **23%** (20–25%, từ 25 nghiên cứu) mơ tỉnh thường xuyên (ít nhất một lần mỗi tháng). Mơ tỉnh là trải nghiệm khá phổ biến trong các mẫu đã khảo sát'
  ly_do: Sửa theo nguồn đã đọc (mã sửa sa); xem ghi_chu của các nhận định tương ứng.
- cu: :::vung-chac[giấc mơ không đồng nhất với giấc ngủ REM] Mơ xảy ra ở mọi giai đoạn ngủ (REM cho mơ sống động nhất, ngủ nông cho mơ mờ nhạt hơn), và tổn thương não có thể xóa sổ giấc mơ trong khi REM vẫn còn nguyên (Solms, 1997). "Mơ = REM" là cách nói gọn quá mức — đúng một phần, sai một phần.
  moi: :::kha-vung[giấc mơ không đồng nhất với giấc ngủ REM] Người được đánh thức từ giấc ngủ nông (giai đoạn 2) cũng nhớ được giấc mơ (Marzano và cộng sự, 2011), và Solms (2000) tổng hợp bằng chứng cho rằng mơ và REM có thể tách rời nhau, với cơ chế của mơ nằm ở não trước. Nhưng đây vẫn là quan điểm gây tranh luận (Hobson và cộng sự, 2000 nêu quan điểm khác) và chúng tôi chưa tìm thấ…
  ly_do: Sửa theo nguồn đã đọc (mã sửa fr1); xem ghi_chu của các nhận định tương ứng.
- cu: :::vung-chac[mơ tỉnh là hiện tượng có thật, đã được xác minh khách quan] Từ tín hiệu đảo mắt của LaBerge (1981) đến các ghi nhận điện não sau này, mơ tỉnh không còn là chuyện đồn thổi. Phân tích tổng hợp 50 năm nghiên cứu cho thấy khoảng 55% người từng trải qua ít nhất một lần (Saunders và cộng sự, 2016).
  moi: :::kha-vung[mơ tỉnh là hiện tượng có thật, đã được ghi nhận khách quan] LaBerge và cộng sự (1981) ghi nhận tín hiệu từ trong giấc mơ ở 5 người, trong lúc điện não đồ xác nhận REM; Voss và cộng sự (2014) thấy kích thích điện ở vùng trán tăng mơ tỉnh theo thang tự báo cáo. Phân tích tổng hợp 50 năm nghiên cứu cho thấy khoảng 55% người từng trải qua ít nhất một lần (Saunders và cộ…
  ly_do: Sửa theo nguồn đã đọc (mã sửa fr2); xem ghi_chu của các nhận định tương ứng.
- cu: ':::kha-vung[cảm xúc tiêu cực — đặc biệt là sợ hãi — chiếm ưu thế trong giấc mơ] Phân tích nội dung mơ trên nhiều quần thể cho thấy sợ hãi là cảm xúc phổ biến nhất trong mơ, tiếp đến là giận dữ. Điều này phù hợp với lý thuyết mô phỏng đe dọa, nhưng cũng có thể giải thích đơn giản hơn: não lúc ngủ "ưu tiên" xử lý những gì gây cảm xúc mạnh.'
  moi: ':::kha-vung[mối đe dọa xuất hiện thường xuyên trong một số loại giấc mơ] Trẻ em bị sang chấn nặng báo cáo giấc mơ có nhiều sự kiện đe dọa hơn (Valli và cộng sự, 2005), và 66% trong 212 giấc mơ lặp đi lặp lại chứa ít nhất một mối đe dọa (Zadra và cộng sự, 2006). Điều này phù hợp với một số dự đoán của lý thuyết mô phỏng đe dọa, nhưng cũng có thể giải thích đơn giản hơn: giấc mơ …'
  ly_do: Sửa theo nguồn đã đọc (mã sửa fr3); xem ghi_chu của các nhận định tương ứng.
- cu: :::kha-vung[ta quên mơ vì não lúc ngủ gần như không mã hóa được trí nhớ mới] Trong REM, norepinephrine (chất dẫn truyền thần kinh quan trọng cho trí nhớ) ở mức rất thấp và vỏ não trước trán hoạt động yếu; não chỉ bắt đầu "lưu" khi bạn tỉnh giấc đủ lâu (ước tính khoảng 2 phút — Vallat và cộng sự, 2017). Người tỉnh giấc nhiều lần trong đêm nhớ mơ tốt hơn hẳn (Eichenlaub và cộng s…
  moi: :::kha-vung[nhớ được giấc mơ liên quan đến việc tỉnh giấc đủ lâu] Người nhớ mơ nhiều có nhiều lần thức giấc dài hơn trong đêm, và Vallat và cộng sự (2017) đề xuất cần một lần thức tối thiểu khoảng 2 phút để mã hóa giấc mơ vào trí nhớ dài hạn. Hobson và McCarley (1977) cho rằng sự thay đổi tỉ lệ chất dẫn truyền trong REM có thể liên quan đến việc quên mơ; Marzano và cộng sự (201…
  ly_do: Sửa theo nguồn đã đọc (mã sửa fr4); xem ghi_chu của các nhận định tương ứng.
- cu: :::bac-bo[mỗi biểu tượng trong mơ có một nghĩa cố định, tra sách là ra] Không có bằng chứng khoa học nào cho kiểu giải mộng "mơ thấy X thì chắc chắn là điềm Y". Cùng một hình ảnh (con rắn, rụng răng, bị đuổi) xuất hiện trong bối cảnh cảm xúc và đời sống khác nhau thì "nghĩa" cũng khác nhau. Sách giải mộng cho cảm giác chắc chắn, nhưng đó là chắc chắn giả.
  moi: :::bac-bo[mỗi biểu tượng trong mơ có một nghĩa cố định, tra sách là ra] Tính đến 11/2026, chúng tôi không tìm thấy nghiên cứu bình duyệt nào kiểm chứng được kiểu giải mộng "mơ thấy X thì chắc chắn là điềm Y" (chưa thực hiện tìm kiếm có hệ thống trong tạp chí chuyên ngành). Sách giải mộng cho cảm giác chắc chắn, nhưng chúng tôi không thấy cơ sở để tin vào sự chắc chắn ấy.
  ly_do: Sửa theo nguồn đã đọc (mã sửa fr5); xem ghi_chu của các nhận định tương ứng.
- cu: 'Điểm mạnh của Freud là ông xem giấc mơ một cách nghiêm túc — như một sản phẩm có ý nghĩa của tâm trí, gắn với cảm xúc và trí nhớ, chứ không phải nhiễu ngẫu nhiên. Điểm yếu chí mạng là phương pháp: không thể kiểm chứng, không thể tái lập, và mọi "lời giải" đều phụ thuộc vào người giải. Tâm lý học hiện đại giữ lại tinh thần (giấc mơ phản ánh đời sống cảm xúc) nhưng bỏ đi bộ "từ đ…'
  moi: 'Điểm mạnh của Freud là ông xem giấc mơ một cách nghiêm túc — như một sản phẩm có ý nghĩa của tâm trí, chứ không phải nhiễu ngẫu nhiên. Điểm yếu lớn là phương pháp: khó kiểm chứng, khó tái lập, và "lời giải" phụ thuộc vào người giải. Nhiều nghiên cứu sau này giữ lại ý tưởng rằng nội dung giấc mơ liên quan đến trải nghiệm lúc thức (Revonsuo, 2000) mà không dùng cách giải mơ của F…'
  ly_do: Sửa theo nguồn đã đọc (mã sửa th1); xem ghi_chu của các nhận định tương ứng.
- cu: 'Giả thuyết này giải thích rất gọn vì sao mơ kỳ quặc, phi logic và khó nhớ: nguyên liệu đầu vào vốn đã lộn xộn. Nhưng nó gặp hai rắc rối lớn: (1) Solms (1997) cho thấy mơ phụ thuộc vào vỏ não trước nhiều hơn pons; (2) nội dung mơ thực ra có tổ chức và lặp lại theo chủ đề (bị đuổi, thi trượt, răng rụng) nhiều hơn mức "ngẫu nhiên hoàn toàn" cho phép. Chính Hobson sau này cũng phải…'
  moi: 'Giả thuyết này giải thích vì sao mơ có thể kỳ quặc và khó nhớ: thông tin do thân não tạo ra "một phần ngẫu nhiên" và tỉ lệ chất dẫn truyền thay đổi. Nhưng nó gặp hai thách thức: (1) Solms (2000) cho rằng mơ phụ thuộc vào cơ chế ở não trước chứ không chỉ ở thân não (Hobson và cộng sự, 2000 phản biện); (2) Revonsuo (2000) cho rằng nội dung mơ có tổ chức và chọn lọc chứ không ngẫu…'
  ly_do: Sửa theo nguồn đã đọc (mã sửa th2); xem ghi_chu của các nhận định tương ứng.
- cu: 'Lý thuyết này có sức hấp dẫn tiến hóa và được một số bằng chứng nội dung mơ ủng hộ (trẻ em vùng chiến sự mơ nhiều đe dọa hơn; 66% giấc mơ lặp lại chứa đe dọa). Nhưng nó chưa vượt qua được câu hỏi khó nhất: luyện tập trong mơ có thật sự giúp ích ngoài đời không? Cho đến khi có thí nghiệm chứng minh điều đó, đây vẫn là giả thuyết "đẹp nhưng chưa xong".'
  moi: 'Lý thuyết này có sức hấp dẫn tiến hóa và được một số bằng chứng nội dung mơ ủng hộ (trẻ em bị sang chấn nặng có nhiều sự kiện đe dọa hơn trong mơ; 66% giấc mơ lặp lại chứa đe dọa, dù Zadra và cộng sự thấy bằng chứng hỗn hợp). Nhưng chúng tôi chưa thấy thí nghiệm nào trả lời câu hỏi then chốt: luyện tập trong mơ có thật sự giúp ích ngoài đời không? Cho đến khi có thí nghiệm như …'
  ly_do: Sửa theo nguồn đã đọc (mã sửa th3); xem ghi_chu của các nhận định tương ứng.
- cu: (1) **Hóa học:** trong REM, norepinephrine và serotonin ở mức rất thấp — não ở trạng thái hóa học không thuận lợi cho việc ghi nhớ. (2) **Vùng não:** vỏ não trước trán (trung tâm lý luận và mã hóa trí nhớ) hoạt động yếu trong REM; chỉ khi bạn tỉnh dậy, nó mới "bật" trở lại và bắt đầu lưu. (3) **Thời gian:** việc chuyển từ "chế độ ngủ" sang "chế độ lưu trí nhớ" mất khoảng 2 phút…
  moi: (1) **Hóa học (giả thuyết):** Hobson và McCarley (1977) cho rằng sự thay đổi tỉ lệ chất dẫn truyền trong giấc ngủ có mơ có thể góp phần vào việc quên mơ. (2) **Điện não:** Marzano và cộng sự (2011) thấy sóng theta ở vùng trán khi tỉnh từ REM đi kèm việc nhớ mơ, giống kiểu sóng khi mã hóa ký ức lúc thức. (3) **Thời gian thức:** Vallat và cộng sự (2017) đề xuất cần một lần thức t…
  ly_do: Sửa theo nguồn đã đọc (mã sửa th4); xem ghi_chu của các nhận định tương ứng.
- cu: Trong mơ thường, vỏ não trước trán (nơi phụ trách tự nhận thức, lý luận "mình đang ở đâu, chuyện này có hợp lý không?") gần như tắt. Trong mơ tỉnh, vùng này bật lại một phần — bạn vẫn đang mơ, nhưng đồng thời biết mình đang mơ. Thí nghiệm của Voss (2014) cho thấy chỉ cần "ép" vùng trán dao động ở tần số gamma (40 Hz) là có thể đánh thức khả năng tự nhận thức này một cách nhân t…
  moi: Theo Voss và cộng sự (2014), trong mơ tỉnh các yếu tố của ý thức bậc cao cùng tồn tại với ý thức của giấc mơ REM thông thường, và hoạt động gamma ở vùng trán–thái dương liên quan đến sự tự nhận thức trong mơ. Thí nghiệm của họ thấy kích thích vùng trán ở 25 và 40 Hz làm tăng mơ tỉnh theo thang tự đánh giá; các tác giả đề xuất mối quan hệ nhân quả, nhưng đây là một nghiên cứu nh…
  ly_do: Sửa theo nguồn đã đọc (mã sửa th5); xem ghi_chu của các nhận định tương ứng.
