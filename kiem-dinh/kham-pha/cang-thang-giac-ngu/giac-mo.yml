  - id: n34
    cau: 'LaBerge và cộng sự (1981): 5 người có khả năng mơ tỉnh phát tín hiệu rằng họ biết đang mơ trong lúc điện não đồ xác nhận REM rõ ràng.'
    loai: so-lieu
    nguon:
      - laberge1981
    trich: the occurrence of lucid dreaming (dreaming while being conscious that one is dreaming) has been verified for 5 selected subjects who signaled that they knew they were dreaming while continuing to dream during unequivocal REM sleep
    vi_tri: tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đảo mắt theo chuỗi trái–phải–trái–phải … lần đầu tiên trong lịch sử … xác minh khách quan". Chữ mới: "tín hiệu đã hẹn trước", "ghi nhận khách quan". Lý do: chuỗi đảo mắt cụ thể và "lần đầu tiên trong lịch sử" không kiểm được ở tóm tắt; chỗ khó: chưa mở toàn văn. Review (Claude Opus 5.5, 10/11/2026): dung. Đọc lại tóm tắt (Europe PMC, 10/11/2026). LaBerge 1981: "verified for 5 selected subjects … signals consisted of particular dream actions having observable concomitants and were performed in accordance with pre-sleep agreement". Đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/24171230" ]
    review: dung
  - id: n35
    cau: 'Trong REM, các cơ gần như bị liệt, trừ các cơ giúp tuần hoàn và hô hấp, còn mắt vẫn chuyển động nhanh (OpenStax 4.3); nhờ vậy một tín hiệu hẹn trước có thể được máy ghi lại như tín hiệu từ trong giấc mơ ra ngoài.'
    loai: phat-hien
    nguon:
      - os43
    trich: paralysis of muscle systems in the body with the exception of those that make circulation and respiration possible
    vi_tri: OpenStax 4.3
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "cơ bắp bị liệt nhưng cơ mắt thì không". Chữ mới: dẫn OpenStax. Lý do: OpenStax nói "except circulation and respiration"; "cơ mắt không bị liệt" chưa được kiểm trong nguồn mở (xem n34). Review (Claude Opus 5.5, 10/11/2026): sai. Hồ sơ ghi đã dẫn OpenStax nhưng trang vẫn khẳng định "cơ mắt thì không [bị liệt]" và gán ý ấy cho câu OpenStax (OpenStax chỉ nói trừ cơ tuần hoàn và hô hấp). Viết lại: các cơ gần như bị liệt trừ cơ giúp tuần hoàn và hô hấp, còn mắt vẫn chuyển động nhanh, đúng như tên giai đoạn (OpenStax Psychology 2e, mục 4.3 (đọc lại 10/11/2026): "REM sleep is marked by rapid movements of the eyes"; "paralysis of muscle systems in the body with the exception of those that make circulation and respiration possible").'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/4-3-stages-of-sleep", "https://europepmc.org/article/MED/24171230" ]
