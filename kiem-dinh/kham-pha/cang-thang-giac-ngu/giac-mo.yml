  - id: n33
    cau: 'Vallat và cộng sự (2017): người nhớ mơ nhiều có nhiều lần thức giấc dài hơn; đề xuất cần một lần thức tối thiểu khoảng 2 phút để mã hóa giấc mơ vào trí nhớ dài hạn.'
    loai: so-lieu
    nguon:
      - vallat2017
    trich: the minimum necessary duration of an awakening during sleep for a successful encoding of dreams into long-term memory is approximately 2 min
    vi_tri: tóm tắt (toàn văn PDF, Internet Archive)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nhóm này cũng tỉnh giấc nhiều lần hơn trong đêm, và mỗi lần tỉnh đủ lâu … Kết luận của nhóm nghiên cứu: não người lúc ngủ vốn không lưu được thông tin mới — phải tỉnh dậy thì mới mã hóa được" (gán cho nghiên cứu PET). Chữ mới: gán đúng cho Vallat 2017, "đề xuất". Lý do: nhầm nguồn; con số 2 phút là đề xuất của tác giả. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/28377708" ]
