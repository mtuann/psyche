    het_han: '2028-11-01'
    luot_2: dung
    luot_2_nguon: [ "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=ABSTRACT%3A%22dream*%22%20AND%20ABSTRACT%3A%22Vietnam*%22&format=json" ]
    review: dung
  - id: n65
    cau: Các thí nghiệm trong bài thực hiện ở Mỹ, Đức, Ý, Pháp, Phần Lan và các mẫu khác; chúng tôi không dẫn được nghiên cứu nào trên người Việt cho các con số trong bài; 55% từng mơ tỉnh là ước lượng tổng hợp nhiều nước.
    loai: phat-hien
    nguon:
      - saunders2016
    trich: a heterogeneous lucid dreaming prevalence data set of 34 studies yielded a mean estimate of 55%
    vi_tri: tóm tắt Saunders 2016
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mọi con số trong bài (55% từng mơ tỉnh, 5,2 buổi sáng nhớ mơ mỗi tuần...) đều đến từ mẫu phương Tây." Chữ mới: nêu nước theo bài: Voss (Đức, Göttingen), Marzano (Ý, Rome), Eichenlaub (Pháp, Lyon), Valli (Phần Lan, trẻ em Kurd), Revonsuo (Phần Lan), LaBerge (Mỹ: Stanford); Saunders là tổng hợp nhiều nước. Lý do: "đều từ phương Tây" sai (trẻ em Kurd; tổng hợp nhiều nước). Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/21543596", "https://europepmc.org/article/MED/23283685", "https://europepmc.org/article/MED/24171230", "https://europepmc.org/article/MED/15766897", "https://europepmc.org/article/MED/27337287" ]
    review: dung
  - id: n66
    cau: 'Suy luận (đã ghi rõ chưa kiểm tra): nội dung mơ có thể chịu ảnh hưởng văn hóa, nên có thể có chủ đề đặc thù chưa được đo.'
    loai: phat-hien
    nguon:
      - revonsuo2000
    trich: dream content is consistently and powerfully modulated by certain types of waking experiences
    vi_tri: tóm tắt Revonsuo 2000
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "người Việt sống trong gia đình nhiều thế hệ, tín ngưỡng thờ cúng tổ tiên, áp lực thi cử... hoàn toàn có thể mơ những chủ đề đặc thù". Chữ mới: "chúng tôi suy luận (chưa kiểm tra) … có thể có". Lý do: bỏ các ví dụ không có nguồn; giữ suy luận vì nội dung mơ chịu ảnh hưởng trải nghiệm lúc thức (n56). Review (Claude Opus 5.5, 10/11/2026): dung. Câu tự ghi là suy luận chưa kiểm tra; căn cứ: Revonsuo 2000 (nội dung mơ chịu tác động của trải nghiệm lúc thức) và OpenStax 4.3 ("Dreams and their associated meanings vary across different cultures and periods of time"). Giữ.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/15766897" ]
    luot_2_ghi_chu: Câu tự khai là suy luận chưa kiểm tra; Valli 2005 (trẻ Kurd và Phần Lan) cho thấy nội dung mơ khác nhau theo hoàn cảnh nhưng không đo văn hóa.
    review: dung
  - id: n67
    cau: 'Ngộ nhận "giấc mơ chỉ xảy ra trong REM": người được đánh thức từ giấc ngủ nông (giai đoạn 2) cũng có thể nhớ được giấc mơ.'
    loai: phat-hien
    nguon:
      - marzano2011
    trich: recalling a dream(s) after awakening from non-rapid eye movement (NREM) and rapid eye movement (REM) sleep
    vi_tri: tóm tắt Marzano 2011
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Sai. Mơ xảy ra ở mọi giai đoạn ngủ; REM cho những giấc mơ sống động, dài và giàu cảm xúc nhất, còn giấc ngủ nông cũng có mơ nhưng thường mờ nhạt". Chữ mới: "Không đúng hẳn … cũng có thể nhớ được giấc mơ (Marzano 2011); không nêu so sánh độ sống động". Lý do: "mọi giai đoạn", "sống động, dài, giàu cảm xúc nhất" không kiểm được. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/21543596", "https://europepmc.org/article/MED/11515144" ]
    review: dung
  - id: n68
    cau: 'Ngộ nhận "mơ thấy X là điềm Y": chúng tôi không tìm thấy nghiên cứu bình duyệt nào chứng minh một "từ điển" chung cho tất cả mọi người.'
    loai: phat-hien
    nguon:
      - tim-bieu-tuong
    vi_tri: Europe PMC, 10/11/2026
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Cùng một hình ảnh trong mơ, ý nghĩa cảm xúc của nó phụ thuộc vào đời sống của người mơ — không có từ điển chung". Chữ mới: "chúng tôi không tìm thấy nghiên cứu … chứng minh một từ điển chung". Lý do: n46, n47. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=ABSTRACT%3A%22dream*%22%20AND%20ABSTRACT%3A%22Vietnam*%22&format=json", "https://europepmc.org/article/MED/11515147" ]
    luot_2_ghi_chu: "Revonsuo: nội dung mơ phụ thuộc trải nghiệm."
    review: dung
  - id: n69
    cau: 'Ngộ nhận "mơ tỉnh là muốn làm gì trong mơ cũng được": mơ tỉnh là biết mình đang mơ trong lúc mơ (LaBerge 1981); chúng tôi chưa dẫn được nghiên cứu nào về mức kiểm soát nội dung mơ.'
    loai: phat-hien
    nguon:
      - laberge1981
    trich: dreaming while being conscious that one is dreaming
    vi_tri: tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Biết mình đang mơ và điều khiển được giấc mơ là hai mức độ khác nhau; nhiều người chỉ đạt mức đầu. Khả năng điều khiển tăng dần theo luyện tập, nhưng hiếm khi đạt mức đạo diễn toàn năng." Chữ mới: câu hiện tại. Lý do: không có nguồn cho mức kiểm soát hay hiệu ứng luyện tập. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/24171230" ]
    review: dung
  - id: n70
    cau: 'Ngộ nhận "quên giấc mơ là do trí nhớ kém": người nhớ mơ nhiều và ít khác nhau ở hoạt động não và số lần thức giấc dài (Eichenlaub 2014; Vallat 2017); các nghiên cứu này không so sánh trí nhớ nói chung hay trí thông minh.'
    loai: phat-hien
    nguon:
      - vallat2017
    trich: High dream recallers (HR) show a larger brain reactivity to auditory stimuli during wakefulness and sleep as compared to low dream recallers (LR) and also more intra-sleep wakefulness
    vi_tri: tóm tắt Vallat 2017
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Không. Quên mơ là trạng thái mặc định của một bộ não khỏe mạnh, do hóa học não trong lúc ngủ không thuận cho việc ghi nhớ. Người nhớ mơ mỗi sáng không thông minh hơn — họ chỉ tỉnh giấc nhiều lần hơn". Chữ mới: câu hiện tại. Lý do: "trạng thái mặc định" và "không thông minh hơn" không có nguồn. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/24549103", "https://europepmc.org/article/MED/23283685", "https://europepmc.org/article/MED/28377708" ]
    luot_2_ghi_chu: Các bài không so sánh trí nhớ nói chung hay trí thông minh (theo tóm tắt).
    review: dung
  - id: n71
    cau: 'Ngộ nhận "tự kích thích điện não tại nhà để mơ tỉnh": không nên làm; thí nghiệm của Voss thực hiện trong phòng thí nghiệm, theo dõi điện não liên tục; chúng tôi không thấy bằng chứng việc tự dùng thiết bị ở nhà là an toàn và hiệu quả.'
    loai: loi-khuyen
    nguon:
      - voss2014
    trich: tACS was applied following ~2 min of uninterrupted arousal-free REM sleep
    vi_tri: Online Methods (theo dõi EEG, EOG, EMG liên tục)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Cực kỳ nguy hiểm và không nên làm … thiết bị y tế, liều lượng được kiểm soát … Không có thiết bị tiêu dùng nào được chứng minh an toàn và hiệu quả." Chữ mới: "Không nên làm … chúng tôi không thấy bằng chứng …". Lý do: bỏ "cực kỳ nguy hiểm" và "không có thiết bị nào" (khẳng định phủ định không kiểm được). Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/24816141" ]
    luot_2_ghi_chu: Khuyên không tự làm là đúng; không có nguồn nào cho thấy tự dùng thiết bị ở nhà là an toàn.
    review: dung
  - id: n72
    cau: 'Hai mục "Đọc thêm": Ngủ có giúp nhớ bài? (giấc ngủ làm gì cho trí nhớ); Stress có luôn có hại? (stress và niềm tin về stress).'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Đã kiểm trên trang: ngu-va-tri-nho.md nói về giấc ngủ và trí nhớ; stress-co-hai.md nói về stress, niềm tin về stress, và phục hồi (có nhắc giấc ngủ ở mục Áp dụng 2). Chữ cũ của mô tả: "stress và giấc ngủ", sửa cho khớp trang đích. Review (Claude Opus 5.5, 10/11/2026): dung. ngu-va-tri-nho và stress-co-hai có trong worktree, đúng tiêu đề và nội dung đã mô tả.'
    review: dung
  - id: q1
    cau: 'Câu hỏi 1: giả thuyết kích hoạt–tổng hợp: thân não (đặc biệt là pons) tạo ra tín hiệu kích hoạt não trước; vỏ não tổng hợp thành giấc mơ.'
    loai: phat-hien
    nguon:
      - hobson1977
    trich: this internally generated sensorimotor information, which is partially random and partially specific, is then compared with stored sensorimotor data in the synthesis of dream content
    vi_tri: tr. 1335
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: đáp án "xung điện ngẫu nhiên … câu chuyện có vẻ hợp lý — đó là giấc mơ" và giải thích "tính kỳ quặc của mơ chính là vì nguyên liệu đầu vào vốn đã lộn xộn". Chữ mới: theo n6, n17. Lý do: "ngẫu nhiên hoàn toàn" không đúng. Review (Claude Opus 5.5, 10/11/2026): sai. Hồ sơ ghi đáp án đã sửa theo n6, n17 nhưng câu hỏi trên trang vẫn là "phát ra các xung điện ngẫu nhiên; vỏ não cố tổng hợp mớ tín hiệu lộn xộn ấy … — đó là giấc mơ" và giải thích "tính kỳ quặc của mơ chính là vì nguyên liệu đầu vào vốn đã lộn xộn". Hobson & McCarley 1977 (tóm tắt): "partially random and partially specific". Chữ mới: đáp án "Thân não (đặc biệt là cầu não, pons) kích hoạt não trước theo chu kỳ …; não trước tổng hợp thông tin ấy (một phần ngẫu nhiên, một phần đặc hiệu) với ký ức đã lưu …"; giải thích "Theo cách đọc phổ biến, … tính kỳ quặc của mơ một phần đến từ thông tin đầu vào có phần ngẫu nhiên.".'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1176.zip/10.1176%252Fajp.134.12.1335.pdf" ]
    review: sai
  - id: q2
    cau: 'Câu hỏi 2: Solms (1997, 2000): tổn thương một số vùng não trước có thể làm mất việc báo cáo giấc mơ mà không đổi đáng kể REM; quan điểm còn tranh luận.'
    loai: phat-hien
    nguon:
      - solms2000
    trich: these lesions do not have any appreciable effects on REM frequency, duration, and density
    vi_tri: tóm tắt Solms 2000
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Phát hiện của Solms (1997) trên 361 bệnh nhân …; (+) tổn thương … trán giữa-bụng, chỗ nối thái dương–đỉnh–chẩm … mất hoàn toàn khả năng mơ …; (-) Tổn thương thân não luôn xóa sổ cả REM lẫn giấc mơ." Chữ mới: bỏ 361, vùng não nêu chung, phương án sai "Mọi tổn thương não đều xóa sổ cả REM lẫn giấc mơ". Lý do: n18–n20. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/11515144", "https://europepmc.org/article/MED/11515143" ]
    review: dung
  - id: q3
    cau: 'Câu hỏi 3: vì sao quên giấc mơ: nhớ liên quan đến lần thức giấc đủ dài (Vallat đề xuất tối thiểu khoảng 2 phút) và hoạt động điện não khi tỉnh; cơ chế chi tiết là giả thuyết.'
    loai: phat-hien
    nguon:
      - vallat2017
    trich: awakening duration (and not arousal) is the critical parameter for dream recall
    vi_tri: tóm tắt Vallat 2017
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: đáp án "norepinephrine ở mức rất thấp và vỏ não trước trán hoạt động yếu … chỉ khi tỉnh giấc đủ lâu (khoảng 2 phút), não mới bắt đầu lưu" và giải thích "đúng cửa sổ mã hóa vừa mở ra". Chữ mới: theo n33, n51. Lý do: n44. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/28377708", "https://europepmc.org/article/MED/21543596" ]
    luot_2_ghi_chu: '"Cơ chế chi tiết là giả thuyết" hợp lý.'
    review: dung
  - id: q4
    cau: 'Câu hỏi 4: LaBerge và cộng sự (1981) ghi nhận khách quan mơ tỉnh: dặn trước 5 người có khả năng mơ tỉnh thực hiện một tín hiệu đã hẹn khi nhận ra mình đang mơ; tín hiệu được ghi lại trong lúc điện não đồ xác nhận REM rõ ràng.'
    loai: phat-hien
    nguon:
      - laberge1981
    trich: signaled that they knew they were dreaming while continuing to dream during unequivocal REM sleep
    vi_tri: tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: đáp án "đảo mắt theo chuỗi trái–phải–trái–phải"; giải thích "mọi cơ bắp đều bị liệt trừ cơ mắt … lần đầu tiên … xác minh khách quan". Chữ mới: "tín hiệu đã hẹn trước", "(trừ cơ hô hấp và tuần hoàn)". Lý do: n34, n35. Phương án nhiễu "Dùng điện cực … 40 Hz" thuộc Voss, không phải LaBerge (đúng là nhiễu). Review (Claude Opus 5.5, 10/11/2026): dung. Đọc lại tóm tắt (Europe PMC, 10/11/2026). khớp tóm tắt LaBerge 1981 và OpenStax 4.3.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/24171230" ]
    review: dung
  - id: n73
    cau: 'Mục Nguồn: Eichenlaub 2014 (hai bài), Freud 1900, Hobson & McCarley 1977, LaBerge 1981, Marzano 2011, Revonsuo 2000, Saunders 2016, Solms 1997 và 2000, Hobson 2000, Valli 2005 và 2009, Vallat 2017, Voss 2014, Zadra 2006 có tên, tạp chí, tập, trang, DOI đúng.'
    loai: lich-su
    ket_qua: da-sua
    ghi_chu: 'Đối chiếu Crossref/Europe PMC (10/11/2026) cho các DOI mới thêm; các DOI cũ khớp. Chữ cũ: mục Nguồn thiếu DOI cho nhiều bài và thiếu Solms 2000, Hobson 2000, Eichenlaub (NPP): đã thêm. Solms 2000 BBS 23(6) 843–850 và Hobson 2000 BBS 23(6) 793–842: số trang chưa đối chiếu từng chữ (lượt 2). Freud 1900 ghi "London: Hogarth Press": bản Hogarth là 1953 (Standard Edition); bản đầu: Leipzig–Wien, Deuticke (1899/1900): chỗ cần sửa mục Nguồn. Review (Claude Opus 5.5, 10/11/2026): sai. Mục Nguồn có ba lỗi: (1) Freud ghi "London: Hogarth Press" (Hogarth là bản Standard Edition 1953) trong khi trang dẫn bản Brill: sửa thành "Freud, S. (1913). The Interpretation of Dreams (A. A. Brill dịch từ bản tiếng Đức lần thứ ba). New York: The Macmillan Company. (Bản gốc tiếng Đức xuất bản năm 1900.)" kèm link Gutenberg #66048 (trang nhan đề của bản ấy); (2) Voss 2014 ghi tác giả "Voss, Holzmann, Tuin, & Hobson" (sai, là bài năm 2009): sửa theo Crossref và PDF: Voss, Holzmann, Hobson, Paulus, Koppehele-Gossel, Klimke, Nitsche; 17(6); (3) Eichenlaub Cerebral Cortex thiếu số (5). Thêm Morgenthaler 2018 (AASM) và OpenStax 4.3. Các mục khác khớp Crossref (10/11/2026).'
    luot_2: khong-chac
    luot_2_ghi_chu: "Không được xem trang. Đã kiểm riêng: Eichenlaub 2014 (Neuropsychopharmacology 39, 1594-1602; Cereb Cortex 24, 1206-1215), Hobson & McCarley 1977 (Am J Psychiatry 134, 1335-1344), LaBerge 1981 (Percept Mot Skills 52, 727-732), Marzano 2011 (J Neurosci 31, 6674-6683), Revonsuo 2000 (BBS 23, 877-901), Saunders 2016 (Conscious Cogn 43, 197-215), Solms 2000 (BBS 23, 843-850), Hobson 2000 (BBS 23, 793-842), Valli 2005 (Conscious Cogn 14, 188-218), Valli 2009 (Am J Psychol 122, 17-38), Vallat 2017 (Front Hum Neurosci 11, 132), Voss 2014 (Nat Neurosci 17, 810-812), Zadra 2006 (Conscious Cogn 15, 450-463) đều có thật; Freud 1900 có bản Gutenberg."
    nguon:
      - freud1900
      - hobson1977
      - solms2000
      - hobson2000
      - revonsuo2000
      - valli2005
      - valli2009
      - zadra2006
