- id: n59
  cau: 'Mục Áp dụng 4: "Một giấc mơ đáng sợ không phải là điềm báo" :nhan[tranh-cai].'
  loai: nhan
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "### 4. Đừng sợ những giấc mơ "xấu" :nhan[kha-vung] … phần lớn người trưởng thành đều mơ những chủ đề này … não đang "chạy thử" … nó thường chỉ có nghĩa não bạn đang làm đúng việc của nó." Chữ mới: tiêu đề "Một giấc mơ đáng sợ không phải là điềm báo", nhãn Đang tranh cãi, dẫn Zadra 66%, và nêu chức năng chưa kiểm chứng. Lý do: "phần lớn người trưởng thành" và "đang làm đúng việc của nó" không có nguồn; không viết thành lời khuyên điều trị. Giữ id cũ.'
