    review: dung
  - id: n51
    cau: 'Vì sao ta quên giấc mơ: Hobson & McCarley cho rằng thay đổi tỉ lệ chất dẫn truyền có thể góp phần; Marzano thấy sóng theta vùng trán khi tỉnh từ REM đi kèm nhớ mơ; Vallat đề xuất cần thức tối thiểu khoảng 2 phút để mã hóa.'
    loai: phat-hien
    nguon:
      - hobson1977
    trich: shifts in transmitter ratios, possibly accounting for dream amnesia
    vi_tri: tóm tắt Hobson 1977; xem n27, n33
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(1) Hóa học: trong REM, norepinephrine và serotonin ở mức rất thấp … (2) Vùng não: vỏ não trước trán hoạt động yếu trong REM … (3) Thời gian: chuyển … mất khoảng 2 phút … mẹo sổ tay cạnh giường thực sự hiệu quả". Chữ mới: viết theo ba nguồn, đánh dấu giả thuyết, và "mẹo … nhiều khả năng tận dụng khoảng thức ngắn; chưa có thí nghiệm kiểm tra riêng". Lý do: các khẳng định cơ chế không có nguồn mở; mẹo sổ tay chưa được kiểm tra. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1176.zip/10.1176%252Fajp.134.12.1335.pdf", "https://europepmc.org/article/MED/21543596", "https://europepmc.org/article/MED/28377708" ]
    review: dung
  - id: n52
    cau: 'Mơ tỉnh: theo Voss, ý thức bậc cao cùng tồn tại với ý thức giấc mơ REM thông thường, hoạt động gamma ở vùng trán–thái dương liên quan đến tự nhận thức trong mơ; kích thích 25 và 40 Hz tăng mơ tỉnh theo thang tự đánh giá; nghiên cứu nhỏ (27 người).'
    loai: phat-hien
    nguon:
      - voss2014
    trich: In lucid dreams, elements of secondary consciousness coexist with normal REM sleep consciousness
    vi_tri: mở đầu bài Voss
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trong mơ thường, vỏ não trước trán … gần như tắt. Trong mơ tỉnh, vùng này bật lại một phần … chỉ cần ép vùng trán dao động gamma 40 Hz … Mức độ kiểm soát giấc mơ khác nhau ở mỗi người: … bay lượn, đổi cảnh như đạo diễn." Chữ mới: viết theo bài Voss, bỏ phần "tắt/bật lại" và mức kiểm soát (không có nguồn). Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại toàn văn Voss 2014 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus). "In lucid dreams, elements of secondary consciousness coexist with normal REM sleep consciousness"; gamma vùng trán–thái dương. Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/24816141" ]
