nhan_dinh:
- id: n1
  cau: 'Mô tả (frontmatter): trang đối chiếu Freud với kích hoạt–tổng hợp, mô phỏng đe dọa, việc quên giấc mơ và mơ tỉnh.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm trên trang: các mục Nghiên cứu then chốt và Các lý thuyết giải thích có đủ các chủ đề ấy.'
- id: n2
  cau: 'Giai đoạn REM: sóng não rất giống lúc thức, cơ bắp tạm thời bị khóa (liệt, trừ cơ hô hấp và tuần hoàn); đây là giai đoạn có giấc mơ sống động.'
  loai: dinh-nghia
  nguon:
  - os43
  trich: waves associated with this stage of sleep are very similar to those observed when a person is awake [...] It is also associated with paralysis of muscle systems in the body with the exception of those that make circulation and respiration possible
  vi_tri: OpenStax Psychology 2e, 4.3
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "não hoạt động gần như mạnh bằng lúc thức … cơ bắp bị khóa … sân khấu chính của những giấc mơ sống động nhất — nhưng không phải duy nhất: mơ cũng xảy ra ở các giai đoạn ngủ khác, chỉ thường mờ nhạt". Chữ mới: giữ vế REM; "mờ nhạt hơn" bỏ vì không kiểm được (n3). OpenStax nói sóng não giống lúc thức, không đo "mức hoạt động".'
- id: n3
  cau: 'Mơ cũng xảy ra ở các giai đoạn ngủ khác ngoài REM: người được đánh thức từ giấc ngủ không REM giai đoạn 2 vẫn nhớ được giấc mơ.'
  loai: phat-hien
  nguon:
  - marzano-abs
  trich: recalling a dream(s) after awakening from non-rapid eye movement (NREM) and rapid eye movement (REM) sleep [...] after awakening from stage 2 NREM sleep
  vi_tri: tóm tắt Marzano 2011
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "mơ cũng xảy ra ở các giai đoạn ngủ khác, chỉ thường mờ nhạt và ít "như phim" hơn". Chữ mới: bỏ "mờ nhạt, ít như phim". Lý do: bằng chứng ở đây là nhớ mơ sau khi tỉnh từ giai đoạn 2; không so sánh độ sống động.'
- id: n4
  cau: 'Câu hỏi "giấc mơ có ý nghĩa gì" gồm hai câu nhỏ: nội dung giấc mơ đến từ đâu, và chức năng của việc mơ là gì (hay chỉ là tác dụng phụ).'
  loai: dinh-nghia
  nguon:
  - revonsuo-abs
  trich: Several theories claim that dreaming is a random by-product of REM sleep physiology and that it does not serve any natural function.
  vi_tri: tóm tắt Revonsuo 2000
  ket_qua: dung
- id: n5
  cau: 'Theo Freud, giấc mơ nào cũng có nghĩa: nó là sự thỏa mãn ước muốn được ngụy trang; "trong hơn 120 năm" câu hỏi này chia giới khoa học thành nhiều phe.'
  loai: phat-hien
  nguon:
  - freud1900
  trich: THE DREAM IS THE FULFILMENT OF A WISH
  vi_tri: mục lục The Interpretation of Dreams (bản dịch Brill)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "giấc mơ nào cũng có nghĩa — nó là ước muốn bị kìm nén được ngụy trang." Chữ mới: "theo Freud … sự thỏa mãn ước muốn được ngụy trang". Lý do: chương III của Freud; "bị kìm nén" là diễn giải. 1899 viết, đề năm 1900 (lời tựa Freud); 1900→2026 là 126 năm nên "hơn 120 năm" đúng.'
- id: n6
  cau: 'Hobson & McCarley (1977): giấc mơ do thân não kích hoạt (một phần ngẫu nhiên), vỏ não "tổng hợp" nội dung từ tín hiệu ấy và ký ức đã lưu.'
  loai: phat-hien
  nguon:
  - hobson1977
  trich: this internally generated sensorimotor information, which is partially random and partially specific, is then compared with stored sensorimotor data in the synthesis of dream content
  vi_tri: Am J Psychiatry 134(12), tr. 1335
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "giấc mơ khởi đầu chỉ là "nhiễu" điện ngẫu nhiên của thân não; ý nghĩa (nếu có) là do vỏ não tự "bịa" ra sau." Chữ mới: theo bài gốc. Lý do: bài nói "một phần ngẫu nhiên, một phần đặc hiệu", không phải "nhiễu".'
- id: n7
  cau: Revonsuo đề xuất giả thuyết rằng giấc mơ là buổi diễn tập sinh tồn, đặc biệt đối phó với nguy hiểm.
  loai: phat-hien
  nguon:
  - revonsuo-abs
  trich: the biological function of dreaming is to simulate threatening events, and to rehearse threat perception and threat avoidance
  vi_tri: tóm tắt Revonsuo 2000
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "giấc mơ là buổi diễn tập sinh tồn mà tiến hóa giữ lại". Chữ mới: "giả thuyết rằng …". Lý do: tác giả trình bày là hypothesis.'
- id: n8
  cau: 'Tựa mục: "Bài này sẽ cho bạn thấy mỗi phe dựa vào bằng chứng nào, và vì sao đến nay vẫn chưa phe nào thắng tuyệt đối."'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm: mục Nghiên cứu then chốt và khung "Đang tranh cãi" nói đúng điều ấy.'
- id: n9
  cau: Freud (1900), The Interpretation of Dreams (Giải mã giấc mơ), là công trình lý thuyết dựa trên việc Freud phân tích giấc mơ của chính mình và của bệnh nhân; giấc mơ là sự thỏa mãn ước muốn.
  loai: lich-su
  nguon:
  - freud1900
  trich: When I wrote it in 1899
  vi_tri: lời tựa (bản dịch Brill)
  ket_qua: dung
  ghi_chu: 'Việc ông dùng giấc mơ riêng và của bệnh nhân: chương II của Freud (giấc mơ mẫu); chưa đếm. Năm: sách đề 1900.'
- id: n10
  cau: 'Mỗi giấc mơ có hai lớp: manifest content (nội dung hiện) và latent content (nội dung ẩn: ước muốn hay xung đột bị kìm nén).'
  loai: dinh-nghia
  nguon:
  - freud1900
  trich: Let us contrast the manifest and the latent dream content
  vi_tri: chương III, bản dịch Brill
  ket_qua: dung
  ghi_chu: '"Ước muốn hay xung đột bị kìm nén" là cách trình bày chung của giáo trình; Freud nói latent content là nội dung tìm ra khi giải mơ.'
- id: n11
  cau: 'Dream-work biến lớp ẩn thành lớp hiện, gồm hai cơ chế chính: condensation (nhiều ý nghĩa dồn vào một hình ảnh) và displacement (trọng tâm cảm xúc bị dời sang chi tiết khác, nên giấc mơ hiện ra rất khác ý nghĩ ẩn).'
  loai: dinh-nghia
  nguon:
  - freud1900
  trich: a displacement—let us say of the psychic accent—has taken place
  vi_tri: chương VI (The dream-work)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "ba thủ thuật: condensation, displacement (cảm xúc thật bị dời sang đối tượng vô hại), và symbolization (… một vật dài tượng trưng cho điều khác)". Chữ mới: hai cơ chế chính. Lý do: displacement là dời trọng tâm tâm lý (psychic accent), không phải "dời sang đối tượng vô hại"; "ba thủ thuật" chưa xác nhận được ở bản đã mở.'
- id: n12
  cau: Freud viết rằng giải mơ là "via regia" (con đường hoàng gia) dẫn đến hiểu biết về vô thức.
  loai: lich-su
  nguon:
  - freud1900
  trich: the interpretation of dreams is the via regia to a knowledge of the unconscious in the psychic life
  vi_tri: chương VII, bản dịch Brill
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Vì vậy giấc mơ được ông gọi là con đường hoàng gia dẫn đến vô thức." Chữ mới: trích đúng Freud, bỏ "Vì vậy".'
- id: n13
  cau: Phương pháp giải mơ của Freud khó kiểm chứng và khó tái lập; cùng một giấc mơ, hai nhà phân tâm có thể giải ra hai nghĩa khác nhau mà không có cách phân xử độc lập; nhiều nhà tâm lý học thực nghiệm đặt lại vấn đề với lý thuyết của ông.
  loai: phat-hien
  nguon:
  - revonsuo-abs
  trich: Several theories claim that dreaming is a random by-product of REM sleep physiology and that it does not serve any natural function. Phenomenal dream content, however, is not as disorganized as such views imply.
  vi_tri: tóm tắt Revonsuo 2000 (chỉ chứng minh nội dung mơ được nghiên cứu lại bằng phương pháp mới)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "không thể kiểm chứng hay tái lập theo chuẩn khoa học hiện đại … tâm lý học thực nghiệm sau này quay lưng với ông". Chữ mới: "khó kiểm chứng và khó tái lập … nhiều nhà tâm lý học thực nghiệm đặt lại vấn đề". Chỗ khó: chưa tìm được nguồn bậc 2 mở được nói đúng về phê bình phương pháp Freud; câu giữ ở mức nhận định chung, lượt 2 hay review cân nhắc giữ/bỏ.'
- id: n14
  cau: Một số ý tưởng của Freud (nội dung giấc mơ liên quan đến cảm xúc và trải nghiệm lúc thức) vẫn được nghiên cứu lại bằng phương pháp mới (ví dụ Revonsuo, 2000).
  loai: phat-hien
  nguon:
  - revonsuo-abs
  trich: dream content is consistently and powerfully modulated by certain types of waking experiences
  vi_tri: tóm tắt Revonsuo 2000
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "(rằng giấc mơ liên quan đến cảm xúc và trí nhớ)". Chữ mới: "nội dung giấc mơ liên quan đến cảm xúc và trải nghiệm lúc thức". Lý do: nguồn nói "trải nghiệm lúc thức", không nói "trí nhớ".'
- id: n15
  cau: Hobson & McCarley (1977) là một bài lý thuyết tổng hợp phát hiện sinh lý thần kinh đương thời, không có thí nghiệm với mẫu người.
  loai: phat-hien
  nguon:
  - hobson-abs
  trich: Recent research in the neurobiology of dreaming sleep provides new evidence for possible structural and functional substrates of formal aspects of the dream process.
  vi_tri: tóm tắt
  ket_qua: dung
  ghi_chu: '"Không có thí nghiệm với mẫu người": bài tổng hợp dữ liệu động vật và mô hình.'
- id: n16
  cau: Cơ chế thần kinh ở thân não (đặc biệt là pons) kích hoạt não trước tự động và theo chu kỳ trong giấc ngủ có mơ, với đợt hoạt động mạnh, rời rạc ở các mạch cảm giác–vận động của thân não; tỉ lệ các chất dẫn truyền thay đổi, có thể liên quan đến việc quên giấc mơ.
  loai: phat-hien
  nguon:
  - hobson-abs
  trich: periodicity and automaticity of forebrain activation [...] intense and sporadic activation of brain stem sensorimotor circuits [...] shifts in transmitter ratios, possibly accounting for dream amnesia
  vi_tri: tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "pons phát ra những chùm xung điện ngẫu nhiên, mạnh mẽ; đồng thời các chất dẫn truyền thần kinh amin (norepinephrine, serotonin) gần như "tắt" trong REM." Chữ mới: viết theo tóm tắt. Lý do: tóm tắt không nói "gần như tắt"; "ngẫu nhiên" không đúng: "một phần ngẫu nhiên, một phần đặc hiệu".'
- id: n17
  cau: Theo cách đọc phổ biến, lý thuyết hàm ý giấc mơ không cần một ý nghĩa tâm lý sâu xa nào để tồn tại.
  loai: phat-hien
  nguon:
  - hobson1977
  trich: The most important tenet of the activation-synthesis hypothesis is that during dreaming the activated brain generates its own information by a pontine brain stem neuronal mechanism
  vi_tri: tr. 1335
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Thông điệp gây sốc của bài báo: giấc mơ không cần một ý nghĩa tâm lý sâu xa nào để tồn tại". Chữ mới: "theo cách đọc phổ biến, … hàm ý". Lý do: bài không nói câu này; là diễn giải.'
- id: n18
  cau: Solms tổng hợp các ca bệnh nhân tổn thương não khu trú (sách 1997, tóm tắt trong bài tổng quan 2000), đối chiếu vị trí tổn thương với việc còn mơ hay không; chưa mở được toàn văn sách.
  loai: lich-su
  nguon:
  - solms2000
  trich: Recent neuropsychological, radiological, and pharmacological findings suggest that the cholinergic brain stem mechanisms that control the REM state can only generate the psychological phenomena of dreaming through the mediation of a second, probably dopaminergic, forebrain mechanism.
  vi_tri: tóm tắt Solms 2000 (BBS)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "rà soát **361 ca** bệnh nhân tổn thương não khu trú". Chữ mới: bỏ số 361. Lý do: không kiểm được con số ở nguồn mở (sách 1997 không đọc được); cả quiz sửa theo.'
- id: n19
  cau: Tổn thương một số vùng não trước (chất trắng vùng trán trong, chỗ nối thái dương–đỉnh) có thể làm mất việc báo cáo giấc mơ; theo Solms (2000), tổn thương dọc một đường dẫn ở não trước làm mất giấc mơ mà không đổi đáng kể tần số, thời gian, mật độ REM.
  loai: phat-hien
  nguon:
  - eich-npp-abs
  trich: lesions in the temporoparietal junction (TPJ) and/or the white matter of the medial prefrontal cortex (MPFC) lead to the global cessation of dream reports
  vi_tri: tóm tắt Eichenlaub 2014 (NPP), kể lại Solms; Solms 2000 tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "tổn thương ở chất trắng vùng trán giữa-bụng hoặc chỗ nối thái dương–đỉnh–chẩm có thể làm mất hoàn toàn giấc mơ — trong khi giấc ngủ REM vẫn bình thường". Chữ mới: viết theo hai tóm tắt đọc được; "ventromesial", "đỉnh–chẩm", "mất hoàn toàn" chưa kiểm. Solms 2000: "these lesions do not have any appreciable effects on REM frequency, duration, and density".'
- id: n20
  cau: 'Ngược lại với "mơ = hoạt động thân não": giấc mơ cũng có thể xuất hiện trong giấc ngủ không REM, và theo Solms cơ chế của mơ nằm nhiều ở não trước; cách đọc này còn gây tranh luận (Hobson và cộng sự, 2000).'
  loai: phat-hien
  nguon:
  - solms2000
  trich: Dreaming can also be induced by focal forebrain stimulation and by complex partial (forebrain) seizures during nonREM sleep, when the involvement of brainstem REM mechanisms is precluded.
  vi_tri: 'tóm tắt Solms 2000; Hobson 2000 tóm tắt: "Debate has focused on whether REM sleep dreaming is qualitatively different from nonREM"'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "(2) ngược lại, tổn thương thân não làm mất REM nhưng người bệnh vẫn mơ được … buộc cả hai phe phải sửa lý thuyết". Chữ mới: bỏ ý (2) (không kiểm được ở nguồn mở), thêm "gây tranh luận". Lý do: tóm tắt Solms 2000 nêu mơ khi kích thích não trước/ co giật khi NREM, không nêu tổn thương thân não.'
- id: n21
  cau: 'Revonsuo (2000): lý thuyết mô phỏng đe dọa: giấc mơ mô phỏng các tình huống đe dọa để luyện nhận diện và tránh nguy hiểm.'
  loai: phat-hien
  nguon:
  - revonsuo-abs
  trich: the biological function of dreaming is to simulate threatening events, and to rehearse threat perception and threat avoidance
  vi_tri: tóm tắt
  ket_qua: dung
  ghi_chu: Ví dụ "diễn tập phòng cháy chữa cháy" là phép ví von của trang.
- id: n22
  cau: Valli, Revonsuo và cộng sự (2005) so nhật ký giấc mơ của trẻ em Kurd bị sang chấn (nặng và nhẹ) với trẻ em Phần Lan không sang chấn, dùng Dream Threat Scale chấm các sự kiện đe dọa.
  loai: phat-hien
  nguon:
  - valli2005
  trich: by analysing the content of dream reports from severely traumatized and less traumatized Kurdish children and ordinary, non-traumatized Finnish children
  vi_tri: tóm tắt Valli 2005
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "trẻ em Kurd từng trải qua sang chấn chiến tranh với trẻ em Phần Lan sống trong môi trường an toàn". Chữ mới: hai nhóm Kurd (nặng và nhẹ) và Phần Lan không sang chấn. Lý do: tóm tắt nêu ba nhóm; "chiến tranh" không có trong tóm tắt.'
- id: n23
  cau: Trẻ em bị sang chấn nặng báo cáo nhiều giấc mơ hơn và giấc mơ có nhiều sự kiện đe dọa hơn, và các mối đe dọa nặng hơn; tác giả viết kết quả ủng hộ hầu hết các dự đoán.
  loai: phat-hien
  nguon:
  - valli2005
