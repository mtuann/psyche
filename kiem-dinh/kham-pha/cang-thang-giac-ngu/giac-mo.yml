    review: dung
  - id: n15
    cau: Hobson & McCarley (1977) là một bài lý thuyết tổng hợp phát hiện sinh lý thần kinh đương thời, không có thí nghiệm với mẫu người.
    loai: phat-hien
    nguon:
      - hobson1977
    trich: Recent research in the neurobiology of dreaming sleep provides new evidence for possible structural and functional substrates of formal aspects of the dream process.
    vi_tri: tóm tắt
    ket_qua: dung
    ghi_chu: '"Không có thí nghiệm với mẫu người": bài tổng hợp dữ liệu động vật và mô hình.'
