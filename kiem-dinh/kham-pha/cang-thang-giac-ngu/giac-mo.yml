  - id: n57
    cau: 'Mục Áp dụng 3 :nhan[tranh-cai]: văn bản lập trường năm 2018 của AASM xếp liệu pháp mơ tỉnh vào nhóm "có thể dùng" cho rối loạn ác mộng ở người lớn (bằng chứng hay đồng thuận chuyên gia còn chưa rõ), không vào nhóm "được khuyến nghị"; vì vậy mơ tỉnh chưa phải cách điều trị chuẩn.'
    loai: nhan
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: tiêu đề "…mơ tỉnh là hướng can thiệp đang được nghiên cứu" và "Kết quả ban đầu khả quan nhưng chưa đủ để thành liệu pháp chuẩn — … tuyệt đối không tự mua thiết bị kích thích điện … hãy tìm chuyên gia giấc ngủ hoặc nhà trị liệu". Chữ mới: tiêu đề "…hướng đang được nghiên cứu, chưa phải cách điều trị", bỏ "kết quả ban đầu khả quan" (không có nguồn), thêm link Hỗ trợ và "không phải lời khuyên điều trị". Giữ id tiêu đề cũ. Chỗ khó: lượt 2 nên tìm tổng quan hệ thống về mơ tỉnh và ác mộng. Review (Claude Opus 5.5, 10/11/2026): sai. Lượt 2 không chắc vì không có nguồn. Review tìm được văn bản lập trường AASM 2018 (Morgenthaler và cộng sự, J Clin Sleep Med 14(6), 1041–1055; tóm tắt Europe PMC): "The following therapies may be used for the treatment of nightmare disorder: … lucid dreaming therapy …"; "Positions of may be used indicate that the evidence or expert consensus is less clear, either in favor or against". Nhãn Đang tranh cãi hợp (bằng chứng chưa rõ, không cùng chiều đủ để khuyến nghị). Chữ cũ: "chúng tôi chưa dẫn được tổng quan hệ thống nào cho thấy nó hiệu quả". Chữ mới dẫn AASM; không nêu liệu pháp được khuyến nghị (tránh thành lời khuyên điều trị). Id tiêu đề sửa thành id thật của site cũ: …-dang-tranh-cai (lượt 1 ghi …-tranh-cai, thiếu "dang").'
    nhan: tranh-cai
    co_so:
      - aasm2018
    ly_do: 'AASM 2018 (văn bản lập trường dựa trên rà soát tài liệu 2009–2017): liệu pháp mơ tỉnh ở nhóm "may be used", nghĩa là bằng chứng hay đồng thuận "less clear, either in favor or against"; không ở nhóm "recommended". Bằng chứng chưa nhất quán: Đang tranh cãi (review, 10/11/2026).'
    luot_2: khong-chac
    luot_2_ghi_chu: Chưa mở được nguồn bậc 1-2 (tổng quan hệ thống, hướng dẫn AASM) về liệu pháp mơ tỉnh cho ác mộng lặp lại nên không xác nhận được nhãn "đang tranh cãi" hay câu "chưa phải cách điều trị".
    nguon:
      - aasm2018
    trich: 'The following therapies may be used for the treatment of nightmare disorder: cognitive behavioral therapy; exposure, relaxation, and rescripting therapy; hypnosis; lucid dreaming therapy; … Positions of "may be used" indicate that the evidence or expert consensus is less clear, either in favor or against the use of a treatment option.'
    vi_tri: Morgenthaler 2018, tóm tắt (Europe PMC, PMID 29852917)
    review: sai
