nhan_dinh:
  - id: n1
    cau: 'Mô tả (frontmatter): trang đối chiếu Freud với kích hoạt–tổng hợp, mô phỏng đe dọa, việc quên giấc mơ và mơ tỉnh.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên trang: các mục Nghiên cứu then chốt và Các lý thuyết giải thích có đủ các chủ đề ấy. Review (Claude Opus 5.5, 10/11/2026): dung. Mô tả khớp các mục của trang.'
    review: dung
  - id: n2
    cau: 'Giai đoạn REM: sóng não rất giống lúc thức, cơ bắp tạm thời bị khóa; đây là giai đoạn có giấc mơ sống động nhất, nhưng mơ cũng xảy ra ở các giai đoạn ngủ khác.'
    loai: dinh-nghia
    nguon:
      - os43
    trich: waves associated with this stage of sleep are very similar to those observed when a person is awake [...] It is also associated with paralysis of muscle systems in the body with the exception of those that make circulation and respiration possible
    vi_tri: OpenStax Psychology 2e, 4.3
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "não hoạt động gần như mạnh bằng lúc thức … cơ bắp bị khóa … sân khấu chính của những giấc mơ sống động nhất — nhưng không phải duy nhất: mơ cũng xảy ra ở các giai đoạn ngủ khác, chỉ thường mờ nhạt". Chữ mới: giữ vế REM; "mờ nhạt hơn" bỏ vì không kiểm được (n3). OpenStax nói sóng não giống lúc thức, không đo "mức hoạt động". Review (Claude Opus 5.5, 10/11/2026): sai. Hồ sơ ghi đã đổi sang "sóng não rất giống lúc thức" nhưng trang vẫn viết "não hoạt động gần như mạnh bằng lúc thức". OpenStax Psychology 2e, mục 4.3 (đọc lại 10/11/2026): "The brain waves associated with this stage of sleep are very similar to those observed when a person is awake". Chữ mới trên trang: "sóng não rất giống lúc thức".'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/4-3-stages-of-sleep" ]
    review: sai
  - id: n3
    cau: 'Mơ cũng xảy ra ở các giai đoạn ngủ khác ngoài REM: người được đánh thức từ giấc ngủ không REM giai đoạn 2 vẫn nhớ được giấc mơ.'
    loai: phat-hien
    nguon:
      - marzano2011
    trich: recalling a dream(s) after awakening from non-rapid eye movement (NREM) and rapid eye movement (REM) sleep [...] after awakening from stage 2 NREM sleep
    vi_tri: tóm tắt Marzano 2011
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "mơ cũng xảy ra ở các giai đoạn ngủ khác, chỉ thường mờ nhạt và ít "như phim" hơn". Chữ mới: bỏ "mờ nhạt, ít như phim". Lý do: bằng chứng ở đây là nhớ mơ sau khi tỉnh từ giai đoạn 2; không so sánh độ sống động. Review (Claude Opus 5.5, 10/11/2026): sai. Hồ sơ ghi đã bỏ "chỉ thường mờ nhạt và ít như phim hơn" nhưng trang (mục Điều gì đang xảy ra?) vẫn còn. Đã bỏ vế ấy; chữ mới: "mơ cũng xảy ra ở các giai đoạn ngủ khác." (Marzano 2011, tóm tắt).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/21543596", "https://europepmc.org/article/MED/11515144" ]
    review: sai
  - id: n4
    cau: 'Câu hỏi "giấc mơ có ý nghĩa gì" gồm hai câu nhỏ: nội dung giấc mơ đến từ đâu, và chức năng của việc mơ là gì (hay chỉ là tác dụng phụ).'
    loai: dinh-nghia
    nguon:
      - revonsuo2000
    trich: Several theories claim that dreaming is a random by-product of REM sleep physiology and that it does not serve any natural function.
    vi_tri: tóm tắt Revonsuo 2000
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/11515147", "https://europepmc.org/article/MED/11515144" ]
    luot_2_ghi_chu: Câu định nghĩa cách chia câu hỏi, phù hợp văn liệu.
  - id: n5
    cau: 'Theo Freud, giấc mơ nào cũng có nghĩa: nó là sự thỏa mãn ước muốn được ngụy trang; "trong hơn 120 năm" câu hỏi này chia giới khoa học thành nhiều phe.'
    loai: phat-hien
    nguon:
      - freud1900
    trich: THE DREAM IS THE FULFILMENT OF A WISH
    vi_tri: mục lục The Interpretation of Dreams (bản dịch Brill)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "giấc mơ nào cũng có nghĩa — nó là ước muốn bị kìm nén được ngụy trang." Chữ mới: "theo Freud … sự thỏa mãn ước muốn được ngụy trang". Lý do: chương III của Freud; "bị kìm nén" là diễn giải. 1899 viết, đề năm 1900 (lời tựa Freud); 1900→2026 là 126 năm nên "hơn 120 năm" đúng. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://www.gutenberg.org/ebooks/66048" ]
    luot_2_ghi_chu: Con số "120 năm" là sách xuất bản 1900 (nay 126 năm); chia phe được Hobson & McCarley 1977 ghi nhận.
    review: dung
  - id: n6
    cau: 'Hobson & McCarley (1977): giấc mơ do thân não kích hoạt (một phần ngẫu nhiên), vỏ não "tổng hợp" nội dung từ tín hiệu ấy và ký ức đã lưu.'
    loai: phat-hien
    nguon:
      - hobson1977
    trich: this internally generated sensorimotor information, which is partially random and partially specific, is then compared with stored sensorimotor data in the synthesis of dream content
    vi_tri: Am J Psychiatry 134(12), tr. 1335
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "giấc mơ khởi đầu chỉ là "nhiễu" điện ngẫu nhiên của thân não; ý nghĩa (nếu có) là do vỏ não tự "bịa" ra sau." Chữ mới: theo bài gốc. Lý do: bài nói "một phần ngẫu nhiên, một phần đặc hiệu", không phải "nhiễu". Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1176.zip/10.1176%252Fajp.134.12.1335.pdf" ]
    review: dung
  - id: n7
    cau: Revonsuo đề xuất giả thuyết rằng giấc mơ là buổi diễn tập sinh tồn, đặc biệt đối phó với nguy hiểm.
    loai: phat-hien
    nguon:
      - revonsuo2000
    trich: the biological function of dreaming is to simulate threatening events, and to rehearse threat perception and threat avoidance
    vi_tri: tóm tắt Revonsuo 2000
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "giấc mơ là buổi diễn tập sinh tồn mà tiến hóa giữ lại". Chữ mới: "giả thuyết rằng …". Lý do: tác giả trình bày là hypothesis. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/11515147" ]
    review: dung
  - id: n8
    cau: 'Tựa mục: "Bài này sẽ cho bạn thấy mỗi phe dựa vào bằng chứng nào, và vì sao đến nay vẫn chưa phe nào thắng tuyệt đối."'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: mục Nghiên cứu then chốt và khung "Đang tranh cãi" nói đúng điều ấy. Review (Claude Opus 5.5, 10/11/2026): dung. Khớp mục Nghiên cứu then chốt và khung Đang tranh cãi.'
    review: dung
  - id: n9
    cau: Freud (1900), The Interpretation of Dreams (Giải mã giấc mơ), là công trình lý thuyết dựa trên việc Freud phân tích giấc mơ của chính mình và của bệnh nhân; giấc mơ là sự thỏa mãn ước muốn.
    loai: lich-su
    nguon:
      - freud1900
    trich: When I wrote it in 1899
    vi_tri: lời tựa (bản dịch Brill)
    ket_qua: dung
    ghi_chu: 'Việc ông dùng giấc mơ riêng và của bệnh nhân: chương II của Freud (giấc mơ mẫu); chưa đếm. Năm: sách đề 1900.'
    luot_2: dung
    luot_2_nguon: [ "https://www.gutenberg.org/ebooks/66048" ]
  - id: n10
    cau: 'Mỗi giấc mơ có hai lớp: manifest content (nội dung hiện) và latent content (nội dung ẩn: ước muốn hay xung đột bị kìm nén).'
    loai: dinh-nghia
    nguon:
      - freud1900
    trich: Let us contrast the manifest and the latent dream content
    vi_tri: chương III, bản dịch Brill
    ket_qua: dung
    ghi_chu: '"Ước muốn hay xung đột bị kìm nén" là cách trình bày chung của giáo trình; Freud nói latent content là nội dung tìm ra khi giải mơ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.gutenberg.org/ebooks/66048" ]
  - id: n11
    cau: 'Dream-work biến lớp ẩn thành lớp hiện, gồm hai cơ chế chính: condensation (nhiều ý nghĩa dồn vào một hình ảnh) và displacement (trọng tâm cảm xúc bị dời sang chi tiết khác, nên giấc mơ hiện ra rất khác ý nghĩ ẩn).'
    loai: dinh-nghia
    nguon:
      - freud1900
    trich: a displacement—let us say of the psychic accent—has taken place
    vi_tri: chương VI (The dream-work)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ba thủ thuật: condensation, displacement (cảm xúc thật bị dời sang đối tượng vô hại), và symbolization (… một vật dài tượng trưng cho điều khác)". Chữ mới: hai cơ chế chính. Lý do: displacement là dời trọng tâm tâm lý (psychic accent), không phải "dời sang đối tượng vô hại"; "ba thủ thuật" chưa xác nhận được ở bản đã mở. Review (Claude Opus 5.5, 10/11/2026): dung. Bản Brill (Gutenberg #66048): mục "The Condensation Work" và displacement của "psychic accent". Đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://www.gutenberg.org/ebooks/66048" ]
    review: dung
  - id: n12
    cau: Freud viết rằng giải mơ là "via regia" (con đường hoàng gia) dẫn đến hiểu biết về vô thức.
    loai: lich-su
    nguon:
      - freud1900
    trich: the interpretation of dreams is the via regia to a knowledge of the unconscious in the psychic life
    vi_tri: chương VII, bản dịch Brill
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Vì vậy giấc mơ được ông gọi là con đường hoàng gia dẫn đến vô thức." Chữ mới: trích đúng Freud, bỏ "Vì vậy". Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại bản Brill (Gutenberg #66048, toàn văn): "the interpretation of dreams is the via regia to a knowledge of the unconscious in the psychic life". Đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://www.gutenberg.org/ebooks/66048" ]
    review: dung
  - id: n13
    cau: Lý thuyết của Freud dựa trên việc ông tự diễn giải từng giấc mơ, không phải trên thí nghiệm có đối chứng; OpenStax Psychology 2e (4.3) nhận xét rằng, khác với ý tưởng của Freud và Jung, ý tưởng giấc mơ phản ánh những sự kiện quan trọng trong đời người mơ (Cartwright) đã có bằng chứng thực nghiệm ủng hộ; ý nội dung giấc mơ liên quan đến trải nghiệm lúc thức vẫn được nghiên cứu lại (Revonsuo, 2000).
    loai: phat-hien
    nguon:
      - freud1900
      - os43
      - revonsuo2000
    trich: Unlike Freud and Jung, Cartwright’s ideas about dreaming have found empirical support. [OpenStax 4.3] | for examples I had to choose between my own dreams and those of my patients who were under psychoanalytic treatment [Freud, bản Brill, Introductory remarks]
    vi_tri: OpenStax Psychology 2e, mục 4.3, phần Dreams; Freud (bản Brill 1913), lời dẫn
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "không thể kiểm chứng hay tái lập theo chuẩn khoa học hiện đại … tâm lý học thực nghiệm sau này quay lưng với ông". Chữ mới: "khó kiểm chứng và khó tái lập … nhiều nhà tâm lý học thực nghiệm đặt lại vấn đề". Chỗ khó: chưa tìm được nguồn bậc 2 mở được nói đúng về phê bình phương pháp Freud; câu giữ ở mức nhận định chung, lượt 2 hay review cân nhắc giữ/bỏ. Review (Claude Opus 5.5, 10/11/2026): sai. Lượt 2 không chắc; không tìm được nguồn bậc 1–2 nói "khó tái lập", "hai nhà phân tâm giải ra hai nghĩa". Viết lại theo nguồn đọc được: Freud tự diễn giải giấc mơ của mình và của bệnh nhân (Freud, lời dẫn của bản Brill: "I had to choose between my own dreams and those of my patients"); OpenStax Psychology 2e, mục 4.3 (đọc lại 10/11/2026): "Unlike Freud and Jung, Cartwright''s ideas about dreaming have found empirical support". Chữ cũ: "Phương pháp giải mơ của Freud khó kiểm chứng và khó tái lập … hai nhà phân tâm có thể giải ra hai nghĩa khác nhau … Đây là một lý do nhiều nhà tâm lý học thực nghiệm sau này đặt lại vấn đề …".'
    luot_2: khong-chac
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1176.zip/10.1176%252Fajp.134.12.1335.pdf" ]
    luot_2_ghi_chu: Hobson & McCarley bác tính cần thiết của kiểm duyệt/ngụy trang, nhưng chưa mở được nguồn bậc 1-2 xác nhận cụ thể "khó tái lập" hoặc "hai nhà phân tâm giải ra hai nghĩa".
    review: sai
  - id: n14
