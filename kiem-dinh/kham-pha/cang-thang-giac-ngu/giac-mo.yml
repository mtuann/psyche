  - id: n46
    cau: 'Khung "Bác bỏ: mỗi biểu tượng trong mơ có một nghĩa cố định, tra sách là ra".'
    loai: nhan
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ: "Không có bằng chứng khoa học nào cho kiểu giải mộng … Cùng một hình ảnh … xuất hiện trong bối cảnh cảm xúc và đời sống khác nhau thì nghĩa cũng khác nhau … chắc chắn giả." Chữ mới: "Tính đến 11/2026 … không tìm thấy nghiên cứu bình duyệt nào …". Chỗ khó: nhãn Bác bỏ cho một phát biểu phủ định; lượt 2 kiểm lại. Câu "nghĩa cũng khác nhau" chưa có nguồn nên bỏ. Review (Claude Opus 5.5, 10/11/2026): sai. Lượt 2 đúng: nhãn Đã bị bác bỏ cần các kiểm tra đủ mạnh liên tục thất bại hay bằng chứng gốc mất giá trị; ở đây chưa có phép kiểm tra nào (lần tìm Europe PMC không hệ thống). Không nhãn nào trong bốn nhãn hợp với "chưa có bằng chứng", nên bỏ khung :::bac-bo, giữ nội dung thành đoạn thường trong mục Mức độ chắc chắn và nói rõ không gắn nhãn (xem n47). Hộp Tóm tắt nhanh mất một dòng theo.'
    nhan: bac-bo
    co_so:
      - tim-bieu-tuong
    ly_do: Không có nghiên cứu bình duyệt nào kiểm chứng kiểu giải mộng tra biểu tượng; ý này theo lần tìm ngày 10/11/2026 (chưa hệ thống); nhãn "bác bỏ" theo đồng thuận của giáo trình hơn là một bài kiểm tra cụ thể.
    luot_2: qua-manh
    luot_2_nguon: [ "https://www.gutenberg.org/ebooks/66048", "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=ABSTRACT%3A%22dream*%22%20AND%20ABSTRACT%3A%22Vietnam*%22&format=json" ]
    luot_2_ghi_chu: 'câu đúng: Chưa có bằng chứng ủng hộ ý "mỗi biểu tượng có một nghĩa cố định" và chưa có kiểm chứng trực tiếp; nên diễn đạt là "chưa có bằng chứng" thay cho "đã bị bác bỏ".; Thước đo mục 4: "Đã bị bác bỏ" cần các kiểm tra đủ mạnh liên tục thất bại, mà chính trang (n47) nói chưa tìm thấy nghiên cứu kiểm chứng; chỉ là thiếu bằng chứng ủng hộ và có lập luận ngược (nội dung mơ phụ thuộc trải nghiệm cá nhân, Revonsuo).'
    nguon:
      - tim-bieu-tuong
    review: sai
