    cau: Những câu giải mộng như "mơ thấy rắn là có lộc", "mơ rụng răng là nhà có tang" là ví dụ minh họa của trang (chưa dẫn nghiên cứu văn hóa học nào); chúng không phải kết luận khoa học.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó: chưa dẫn được nghiên cứu văn hóa học nào xác nhận mức độ phổ biến; trang đã viết lại thành ví dụ minh họa. Chữ cũ: "Văn hóa Việt Nam có truyền thống giải mộng dân gian rất đậm: …" và hai ví dụ nữa ("nước trong/nước đục", "đám cưới là điềm không lành"), cùng "luận số đề". Chữ mới: hai ví dụ, bỏ phần còn lại. Lý do: không có nguồn. Review (Claude Opus 5.5, 10/11/2026): sai. Câu "trong văn hóa dân gian Việt Nam có truyền thống giải mộng … được nhiều người kể lại" và "đây là quan niệm dân gian" không có nguồn. Viết lại thành ví dụ minh họa của trang: "Những câu giải mộng như … là ví dụ minh họa của chúng tôi (chưa dẫn nghiên cứu văn hóa học nào về nguồn gốc hay mức độ phổ biến của chúng). Cần nói rõ: những câu như vậy không phải kết luận khoa học." Đổi loại thành ve-site (câu nói về cách trang dùng ví dụ; gia-dinh).'
    luot_2: khong-chac
