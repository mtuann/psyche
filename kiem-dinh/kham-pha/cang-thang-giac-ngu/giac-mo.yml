  - id: n45
    cau: 'Khung "Đang tranh cãi: giấc mơ có chức năng tiến hóa hay chỉ là tác dụng phụ?".'
    loai: nhan
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "… Phe activation-synthesis giải thích tốt tính kỳ quặc của mơ nhưng vấp phải bằng chứng của Solms … chưa có lý thuyết nào giải thích trọn vẹn." Chữ mới: giữ ý, nêu tranh luận. Chữ cũ "chưa có bằng chứng trực tiếp rằng diễn tập cải thiện phản ứng" giữ như nhận xét của chúng tôi (n25). Review (Claude Opus 5.5, 10/11/2026): dung. Đang tranh cãi đạt: lý thuyết đối lập cùng có bằng chứng một phần, chưa có thí nghiệm chức năng.'
    nhan: tranh-cai
    co_so:
      - revonsuo2000
      - zadra2006
      - valli2009
      - solms2000
    ly_do: 'Bằng chứng nội dung mơ ủng hộ một phần (Valli 2005; Zadra: hỗn hợp), chưa có thí nghiệm chức năng; quan điểm đối lập (giấc mơ là sản phẩm phụ) vẫn có; Solms thách thức vai trò thân não: Đang tranh cãi.'
