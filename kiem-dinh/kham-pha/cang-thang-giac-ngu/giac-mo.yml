  - id: n22
    cau: Valli, Revonsuo và cộng sự (2005) so nhật ký giấc mơ của trẻ em Kurd bị sang chấn (nặng và nhẹ) với trẻ em Phần Lan không sang chấn, dùng Dream Threat Scale chấm các sự kiện đe dọa.
    loai: phat-hien
    nguon:
      - valli2005
    trich: by analysing the content of dream reports from severely traumatized and less traumatized Kurdish children and ordinary, non-traumatized Finnish children
    vi_tri: tóm tắt Valli 2005
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "trẻ em Kurd từng trải qua sang chấn chiến tranh với trẻ em Phần Lan sống trong môi trường an toàn". Chữ mới: hai nhóm Kurd (nặng và nhẹ) và Phần Lan không sang chấn. Lý do: tóm tắt nêu ba nhóm; "chiến tranh" không có trong tóm tắt. Review (Claude Opus 5.5, 10/11/2026): sai. Hồ sơ ghi đã sửa theo tóm tắt (ba nhóm, không có chữ "chiến tranh") nhưng trang vẫn viết "nhật ký giấc mơ của trẻ em Kurd từng trải qua sang chấn chiến tranh với trẻ em Phần Lan sống trong môi trường an toàn". Chữ mới: "so sánh lời kể giấc mơ của trẻ em Kurd bị sang chấn nặng, trẻ em Kurd ít bị sang chấn hơn và trẻ em Phần Lan không bị sang chấn" (tóm tắt: "dream reports from severely traumatized and less traumatized Kurdish children and ordinary, non-traumatized Finnish children").'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/15766897" ]
