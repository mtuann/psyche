  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "hoạt động tự phát mạnh hơn ở mPFC và TPJ — cả lúc thức lẫn lúc ngủ. Đây là các vùng liên quan đến định hướng sự chú ý ra môi trường bên ngoài". Chữ mới: theo kết quả cụ thể từng vùng và giai đoạn; bỏ câu "định hướng chú ý" (không có trong tóm tắt).'
- id: n31
  cau: Trang cũ dẫn Eichenlaub 2014 "Brain reactivity …" (Cerebral Cortex) cho nghiên cứu PET; bản đúng của nghiên cứu PET là Neuropsychopharmacology 39(7), 1594–1602.
  loai: lich-su
  nguon:
  - eich-npp-abs
  trich: Resting brain activity varies with dream recall frequency between subjects
  vi_tri: Crossref/Europe PMC 10.1038/npp.2014.6
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: mục Nguồn chỉ có Cerebral Cortex (10.1093/cercor/bhs388, 18+18 người, điện thế gợi), còn thân bài mô tả PET 41 người. Chữ mới: tách hai nghiên cứu, thêm DOI cả hai. Lý do: nhầm nguồn.'
