    vi_tri: tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Khoảng 55% … được khảo sát … khoảng 23% mơ tỉnh thường xuyên … Mơ tỉnh không phải năng lực hiếm của "thiên tài"". Chữ mới: thêm KTC và số nghiên cứu, bỏ "thiên tài". Lý do: nêu độ không chắc chắn; bỏ câu không có nguồn. Cả hai bộ dữ liệu "heterogeneous". Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
