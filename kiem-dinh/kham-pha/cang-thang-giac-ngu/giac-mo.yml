  - id: n48
    cau: "Freud có điểm mạnh là xem giấc mơ nghiêm túc như sản phẩm có ý nghĩa của tâm trí; điểm yếu lớn là bằng chứng: lý thuyết dựa trên việc Freud tự diễn giải giấc mơ của mình và bệnh nhân, và theo OpenStax các ý tưởng ấy không có được sự ủng hộ thực nghiệm như ý tưởng của Cartwright."
    loai: phat-hien
    nguon:
      - freud1900
      - os43
    trich: Unlike Freud and Jung, Cartwright’s ideas about dreaming have found empirical support.
    vi_tri: OpenStax Psychology 2e, mục 4.3
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "điểm yếu chí mạng … không thể kiểm chứng, không thể tái lập … Tâm lý học hiện đại giữ lại tinh thần … nhưng bỏ đi bộ từ điển biểu tượng cố định". Chữ mới: mềm, dẫn Revonsuo 2000. Cùng chỗ khó với n13. Review (Claude Opus 5.5, 10/11/2026): sai. Cùng lý do n13. Chữ cũ: "Điểm yếu lớn là phương pháp: khó kiểm chứng, khó tái lập, và lời giải phụ thuộc vào người giải." Chữ mới: "Điểm yếu lớn là bằng chứng: lý thuyết dựa trên việc Freud tự diễn giải … theo giáo trình OpenStax, các ý tưởng của ông không có được sự ủng hộ thực nghiệm như ý tưởng của Cartwright."'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.gutenberg.org/ebooks/66048", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1176.zip/10.1176%252Fajp.134.12.1335.pdf" ]
    luot_2_ghi_chu: Phần điểm mạnh (xem mơ nghiêm túc) đúng theo Freud; phần "khó kiểm chứng, khó tái lập" chưa có nguồn bậc 1-2 mở được.
    review: sai
  - id: n49
    cau: 'Activation-synthesis gặp hai thách thức: Solms (2000) cho rằng mơ phụ thuộc cơ chế ở não trước (Hobson và cộng sự 2000 phản biện), và Revonsuo (2000) cho rằng nội dung mơ có tổ chức, chọn lọc.'
    loai: phat-hien
    nguon:
      - revonsuo2000
    trich: The form and content of dreams is not random but organized and selective
    vi_tri: tóm tắt Revonsuo 2000; Solms 2000
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(1) Solms (1997) cho thấy mơ phụ thuộc vào vỏ não trước nhiều hơn pons; (2) nội dung mơ thực ra có tổ chức và lặp lại theo chủ đề (bị đuổi, thi trượt, răng rụng) … Chính Hobson sau này cũng phải mềm hóa lập trường". Chữ mới: bỏ chủ đề "bị đuổi, thi trượt, răng rụng" (không có nguồn), bỏ câu về Hobson (chưa xác nhận được). Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/11515144", "https://europepmc.org/article/MED/11515147" ]
    review: dung
