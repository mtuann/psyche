  - id: n53
    cau: 'Mục Áp dụng 1 (không gắn nhãn): muốn nhớ mơ, hãy ghi lại trong vòng vài phút sau khi tỉnh; cách này nhiều khả năng tận dụng khoảng thức ngắn mà Vallat và cộng sự (2017) cho là cần để mã hóa giấc mơ, nhưng chưa có thí nghiệm kiểm tra riêng.'
    loai: loi-khuyen
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Bạn đang tận dụng cửa sổ mã hóa … càng luyện, tỉ lệ nhớ mơ càng tăng vì não học được rằng "giấc mơ là thứ đáng lưu"". Chữ mới: "nhiều khả năng tận dụng khoảng thức ngắn … chưa tìm thấy thí nghiệm kiểm tra riêng; luyện nhiều thì nhớ nhiều hơn cũng chưa có nguồn". Lý do: câu cũ không có nguồn. Review (Claude Opus 5.5, 10/11/2026): sai. Lượt 2 đúng: chưa có thí nghiệm nào kiểm tra riêng lời khuyên "ghi lại ngay khi tỉnh", nên chip Khá vững nói mạnh hơn bằng chứng. Bỏ chip ở tiêu đề (giữ id cũ { #1-muon-nho-mo-hay-ghi-lai-trong-vong-vai-phut-sau-khi-tinh-kha-vung }); thân mục đã nói rõ chưa được kiểm tra. Đổi loại nhan thành loi-khuyen.'
    nhan: kha-vung
    co_so:
      - vallat2017
      - marzano2011
    ly_do: Chiều "nhớ mơ gắn với khoảng thức đủ dài" có hai nghiên cứu nhỏ; chưa có thí nghiệm kiểm tra riêng lời khuyên; nên Khá vững ở mức thấp, đã viết mềm.
    luot_2: qua-manh
    luot_2_nguon: [ "https://europepmc.org/article/MED/28377708", "https://europepmc.org/article/MED/21543596" ]
    luot_2_ghi_chu: 'câu đúng: Nhớ mơ liên quan đến tỉnh giấc đủ lâu (khoảng 2 phút theo Vallat 2017) và hoạt động điện não (Marzano 2011); ghi lại ngay sau khi tỉnh là lời khuyên hợp lý nhưng chưa được thí nghiệm kiểm tra trực tiếp.; Các bài chỉ cho thấy nhớ mơ liên quan đến lần thức giấc đủ lâu và hoạt động điện não; chưa có nghiên cứu nào đã mở kiểm tra riêng việc ghi lại ngay sau khi tỉnh giúp nhớ hơn, nên nhãn "khá vững" cho lời khuyên này cao hơn thước đo.'
    nguon:
      - vallat2017
      - marzano2011
