    trich: Participants were 27 healthy volunteers (15 female, 12 male, ages 18–26). To avoid possible bias20, we only tested naive subjects who were inexperienced in lucid dreaming.
    vi_tri: Online Methods, Subjects
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "27 tình nguyện viên trẻ khỏe mạnh, chưa từng mơ tỉnh". Chữ mới: "chưa có kinh nghiệm mơ tỉnh" (bài: naive, inexperienced), thêm 18–26 tuổi. Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại toàn văn Voss 2014 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus). "Participants were 27 healthy volunteers (15 female, 12 male, ages 18–26) … naive subjects who were inexperienced in lucid dreaming". Đúng.'
