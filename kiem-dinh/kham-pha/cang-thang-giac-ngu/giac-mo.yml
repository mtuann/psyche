  - id: n16
    cau: Cơ chế thần kinh ở thân não (đặc biệt là pons) kích hoạt não trước tự động và theo chu kỳ trong giấc ngủ có mơ, với đợt hoạt động mạnh, rời rạc ở các mạch cảm giác–vận động của thân não; tỉ lệ các chất dẫn truyền thay đổi, có thể liên quan đến việc quên giấc mơ.
    loai: phat-hien
    nguon:
      - hobson1977
    trich: periodicity and automaticity of forebrain activation [...] intense and sporadic activation of brain stem sensorimotor circuits [...] shifts in transmitter ratios, possibly accounting for dream amnesia
    vi_tri: tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "pons phát ra những chùm xung điện ngẫu nhiên, mạnh mẽ; đồng thời các chất dẫn truyền thần kinh amin (norepinephrine, serotonin) gần như "tắt" trong REM." Chữ mới: viết theo tóm tắt. Lý do: tóm tắt không nói "gần như tắt"; "ngẫu nhiên" không đúng: "một phần ngẫu nhiên, một phần đặc hiệu". Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1176.zip/10.1176%252Fajp.134.12.1335.pdf" ]
    review: dung
  - id: n17
    cau: Theo cách đọc phổ biến, lý thuyết hàm ý giấc mơ không cần một ý nghĩa tâm lý sâu xa nào để tồn tại.
    loai: phat-hien
    nguon:
      - hobson1977
    trich: The most important tenet of the activation-synthesis hypothesis is that during dreaming the activated brain generates its own information by a pontine brain stem neuronal mechanism
    vi_tri: tr. 1335
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Thông điệp gây sốc của bài báo: giấc mơ không cần một ý nghĩa tâm lý sâu xa nào để tồn tại". Chữ mới: "theo cách đọc phổ biến, … hàm ý". Lý do: bài không nói câu này; là diễn giải. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
