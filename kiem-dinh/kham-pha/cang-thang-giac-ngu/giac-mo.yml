  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "41 tình nguyện viên … 21 người nhớ mơ nhiều (trung bình nhớ mơ 5,2 buổi sáng mỗi tuần) và 20 người nhớ mơ ít (trung bình chỉ khoảng 2 giấc mơ mỗi tháng)". Chữ mới: thêm "nam", "lần nhớ mơ mỗi tuần", 0,5 lần/tuần. Lý do: bài ghi dream reports per week; 0,5/tuần ≈ 2/tháng; trang cũ trích sai bài (xem n31).'
