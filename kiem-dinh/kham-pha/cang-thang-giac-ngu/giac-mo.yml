  cau: Nghiên cứu khác của cùng nhóm (36 người, 18 nhớ mơ nhiều và 18 nhớ mơ ít) thấy phản ứng não với âm thanh (tên riêng) khác nhau giữa hai nhóm lúc thức và lúc ngủ (Cerebral Cortex 2014).
