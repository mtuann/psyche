    cau: Trẻ em bị sang chấn nặng báo cáo nhiều giấc mơ hơn và giấc mơ có nhiều sự kiện đe dọa hơn, và các mối đe dọa nặng hơn; tác giả viết kết quả ủng hộ hầu hết các dự đoán.
    loai: phat-hien
    nguon:
      - valli2005
    trich: The severely traumatized children reported a significantly greater number of dreams and their dreams included a higher number of threatening dream events.
    vi_tri: tóm tắt Valli 2005
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "mơ thấy nhiều nội dung đe dọa hơn hẳn … đúng như lý thuyết dự đoán". Chữ mới: viết theo tóm tắt, "ủng hộ hầu hết các dự đoán" (không "đúng như"). "Nặng hơn": tóm tắt cắt ở "The dream threats of traumatized children we[re …]"; phần "nghiêm trọng hơn" chưa thấy trọn câu: chỗ khó. Review (Claude Opus 5.5, 10/11/2026): dung. Đọc lại tóm tắt (Europe PMC, 10/11/2026). Valli 2005: "The dream threats of traumatized children were also more severe" (tóm tắt đọc trọn). Đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/15766897" ]
