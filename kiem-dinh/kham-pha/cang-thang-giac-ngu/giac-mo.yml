  - id: n38
    cau: Theo thang tự đánh giá, mơ tỉnh nổi bật nhất ở 25 Hz (58%) và 40 Hz (77%) (gamma thấp); các tần số khác không hiệu quả; các tác giả đề xuất sóng gamma ở vùng trán có thể có vai trò gây ra sự tự nhận thức trong mơ; nghiên cứu nhỏ (27 người).
    loai: so-lieu
    nguon:
      - voss2014
    trich: lucid dreams were most prominent during stimulation with 25 (58%) and 40 Hz (77%) (Supplementary Table 1)
    vi_tri: 'Results; tóm tắt: "Other stimulation frequencies were not effective"'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "77% số lần kích thích … ở 25 Hz là 58%; còn dòng giả và tần số thấp thì không ai mơ tỉnh. Đây là gợi ý mạnh rằng sóng gamma … có vai trò gây ra". Chữ mới: theo thang tự đánh giá, "các tần số khác không hiệu quả", "các tác giả đề xuất … có thể". Lý do: "không ai mơ tỉnh" chưa kiểm; "gợi ý mạnh" quá mức với n=27. Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại toàn văn Voss 2014 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus). "lucid dreams were most prominent during stimulation with 25 (58%) and 40 Hz (77%)"; tóm tắt: "Other stimulation frequencies were not effective". Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/24816141" ]
    luot_2_ghi_chu: Tóm tắt xác nhận chỉ 25 và 40 Hz hiệu quả; các con số 58% và 77% (và cỡ mẫu 27) chưa xác nhận được vì không mở toàn văn.
    review: dung
