    trich: dream content is consistently and powerfully modulated by certain types of waking experiences
    vi_tri: tóm tắt Revonsuo 2000
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "(rằng giấc mơ liên quan đến cảm xúc và trí nhớ)". Chữ mới: "nội dung giấc mơ liên quan đến cảm xúc và trải nghiệm lúc thức". Lý do: nguồn nói "trải nghiệm lúc thức", không nói "trí nhớ". Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
