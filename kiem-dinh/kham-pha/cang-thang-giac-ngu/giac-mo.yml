  vi_tri: Online Methods, Subjects
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "27 tình nguyện viên trẻ khỏe mạnh, chưa từng mơ tỉnh". Chữ mới: "chưa có kinh nghiệm mơ tỉnh" (bài: naive, inexperienced), thêm 18–26 tuổi.'
- id: n37
  cau: Sau khoảng 2 phút REM không bị gián đoạn, tACS ở vùng trán–thái dương trong 30 giây ở các tần số 2, 6, 12, 25, 40, 70, 100 Hz hoặc dòng giả; sau đó đánh thức và hỏi về giấc mơ.
  loai: phat-hien
  nguon:
  - voss2014
  trich: at a frequency of either 2, 6, 12, 25, 40, 70 or 100 Hz [...] or sham for 30 s [...] tACS was applied following ~2 min of uninterrupted arousal-free REM sleep, after which subjects were awakened and asked to rate dream consciousness
  vi_tri: Online Methods
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Hai phút sau khi vào REM … vùng trán … từ 2 đến 100 Hz". Chữ mới: "sau khoảng 2 phút REM không bị gián đoạn", "vùng trán–thái dương", liệt kê tần số. Lý do: chính xác theo bài.'
- id: n38
  cau: Theo thang tự đánh giá, mơ tỉnh nổi bật nhất ở 25 Hz (58%) và 40 Hz (77%) (gamma thấp); các tần số khác không hiệu quả; các tác giả đề xuất sóng gamma ở vùng trán có thể có vai trò gây ra sự tự nhận thức trong mơ; nghiên cứu nhỏ (27 người).
  loai: so-lieu
  nguon:
  - voss2014
