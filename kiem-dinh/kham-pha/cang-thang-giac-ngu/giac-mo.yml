  - id: n24
    cau: 'Zadra và cộng sự (2006): 212 giấc mơ lặp đi lặp lại; 66% chứa ít nhất một mối đe dọa; 6 trong 8 giả thuyết có ủng hộ; kết luận bằng chứng hỗn hợp.'
    loai: so-lieu
    nguon:
      - zadra2006
    trich: a sample of 212 recurrent dreams [...] Six of the eight hypotheses tested were supported. [...] 66% of the recurrent dream reports contained one or more threats [...] The findings thus provide mixed support for the threat simulation theory.
    vi_tri: tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một nghiên cứu độc lập khác … cũng thấy 66% chứa ít nhất một sự kiện đe dọa". Chữ mới: thêm "6/8 giả thuyết", "hỗn hợp". Lý do: nguồn kết luận hỗn hợp; "độc lập" bỏ (chưa kiểm tính độc lập). Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/16720254" ]
    review: dung
  - id: n25
    cau: 'Điểm yếu: các nghiên cứu ở đây chủ yếu phân tích nội dung giấc mơ; chúng tôi chưa thấy thí nghiệm cho thấy "diễn tập" trong mơ giúp phản ứng tốt hơn ngoài đời thật; bài tổng quan của những người ủng hộ (Valli & Revonsuo, 2009) cho rằng điểm mạnh nhiều hơn điểm yếu.'
    loai: phat-hien
    nguon:
      - valli2009
    trich: New evidence and new direct tests of the predictions of the TST yield strong support for the theory, and the TST's strengths seem to outweigh its weaknesses.
    vi_tri: tóm tắt Valli & Revonsuo 2009
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "được chính một bài tổng quan ủng hộ lý thuyết này thừa nhận: chưa có bằng chứng trực tiếp nào cho thấy việc diễn tập thật sự giúp phản ứng tốt hơn … hay giúp tăng cơ hội sống sót". Chữ mới: bỏ phần gán cho bài 2009 (tóm tắt nói ngược: "strong support"), thay bằng nhận xét của chúng tôi ("chưa thấy thí nghiệm …"). Lý do: không tìm thấy câu "thừa nhận chưa có bằng chứng trực tiếp" trong nguồn. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.2307/27784372", "https://europepmc.org/article/MED/16720254" ]
    luot_2_ghi_chu: Chỗ "chưa thấy thí nghiệm" là nhận xét của trang, khớp với việc các nghiên cứu đã đọc chỉ phân tích nội dung mơ.
    review: dung
  - id: n26
    cau: 'Marzano và cộng sự (2011): người tham gia ngủ trong phòng thí nghiệm với điện não đồ, bị đánh thức buổi sáng từ REM hoặc giai đoạn 2, rồi được hỏi có nhớ mơ không.'
    loai: so-lieu
    nguon:
      - marzano2011
    trich: after morning awakening from REM sleep … after awakening from stage 2 NREM sleep
    vi_tri: tóm tắt (Europe PMC)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "mẫu sinh viên … bị đánh thức vào buổi sáng". Chữ mới: thêm 65 sinh viên (35 nam, 30 nữ). "Từ REM hoặc giai đoạn 2": theo tóm tắt. Review (Claude Opus 5.5, 10/11/2026): sai. Lượt 2 không chắc; review không mở được toàn văn Marzano 2011 (PMC không cho tải, trang nhà xuất bản chặn máy, không có trong bộ Internet Archive). Viết lại ở mức tóm tắt: bỏ "65 sinh viên đại học (35 nam, 30 nữ)". Chữ mới: "Người tham gia ngủ trong phòng thí nghiệm với điện não đồ, bị đánh thức vào buổi sáng từ giấc ngủ REM hoặc từ giai đoạn 2". Cũng bỏ "65 sinh viên" trong khung n44.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/21543596" ]
    luot_2_ghi_chu: Tóm tắt xác nhận thiết kế đánh thức buổi sáng từ REM và NREM giai đoạn 2; chưa mở được toàn văn nên không xác nhận được 65 sinh viên (35 nam, 30 nữ).
    review: sai
  - id: n27
    cau: Sau khi tỉnh khỏi REM, sóng theta (5–7 Hz) ở vùng trán cao hơn đi kèm việc nhớ được mơ; với giấc ngủ nông (giai đoạn 2), sóng alpha (8–12 Hz) ở vùng thái dương phải thấp hơn đi kèm việc nhớ được mơ.
    loai: phat-hien
    nguon:
      - marzano2011
    trich: after morning awakening from REM sleep, a higher frontal 5-7 Hz (theta) activity was associated with successful dream recall [...] a lower 8-12 Hz (alpha) oscillatory activity of the right temporal area was associated with a successful dream recall
    vi_tri: tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hoạt động sóng theta (5–7 Hz) ở vùng trán trong 5 phút trước khi tỉnh khỏi REM càng mạnh thì người đó càng dễ nhớ". Chữ mới: bỏ "trong 5 phút trước khi tỉnh" và "dự báo"; theo tóm tắt là "được liên kết với". Lý do: 5 phút là tiêu chí chọn mẫu (không có chuyển giai đoạn 5 phút cuối), chưa kiểm là cửa sổ phân tích. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/21543596" ]
