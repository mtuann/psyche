    vi_tri: Online Methods
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hai phút sau khi vào REM … vùng trán … từ 2 đến 100 Hz". Chữ mới: "sau khoảng 2 phút REM không bị gián đoạn", "vùng trán–thái dương", liệt kê tần số. Lý do: chính xác theo bài. Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại toàn văn Voss 2014 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus). "tACS was applied following ~2 min of uninterrupted arousal-free REM sleep"; "applied fronto-temporally … 2, 6, 12, 25, 40, 70 or 100 Hz … or sham for 30 s". Đúng.'
