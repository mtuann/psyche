    cau: 'Khung "Khá vững: nhớ được giấc mơ liên quan đến việc tỉnh giấc đủ lâu".'
    loai: nhan
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: :::kha-vung[ta quên mơ vì não lúc ngủ gần như không mã hóa được trí nhớ mới] "Trong REM, norepinephrine … ở mức rất thấp và vỏ não trước trán hoạt động yếu; … ước tính khoảng 2 phút … Người tỉnh giấc nhiều lần trong đêm nhớ mơ tốt hơn hẳn". Chữ mới: tên khung và nội dung theo Vallat, Hobson 1977 (giả thuyết), Marzano. Lý do: "norepinephrine rất thấp, vỏ não trước trán yếu", "hơn hẳn" không có nguồn mở. Review (Claude Opus 5.5, 10/11/2026): dung. Khá vững đạt; trong khung đã bỏ "65 sinh viên" (xem n26), giữ "18 người mỗi nhóm" (tóm tắt Eichenlaub 2014, Cerebral Cortex: HR N = 18, LR N = 18).'
    nhan: kha-vung
    co_so:
      - vallat2017
      - eich2014cc
