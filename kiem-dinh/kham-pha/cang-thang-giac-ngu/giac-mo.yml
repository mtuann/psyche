    luot_2_nguon: [ "https://europepmc.org/article/MED/11515144" ]
    luot_2_ghi_chu: Sách 1997 không mở được; chỉ đối chiếu bài 2000.
    review: dung
  - id: n19
    cau: Tổn thương một số vùng não trước (chất trắng vùng trán trong, chỗ nối thái dương–đỉnh) có thể làm mất việc báo cáo giấc mơ; theo Solms (2000), tổn thương dọc một đường dẫn ở não trước làm mất giấc mơ mà không đổi đáng kể tần số, thời gian, mật độ REM.
    loai: phat-hien
    nguon:
      - eich2014npp
    trich: lesions in the temporoparietal junction (TPJ) and/or the white matter of the medial prefrontal cortex (MPFC) lead to the global cessation of dream reports
    vi_tri: tóm tắt Eichenlaub 2014 (NPP), kể lại Solms; Solms 2000 tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "tổn thương ở chất trắng vùng trán giữa-bụng hoặc chỗ nối thái dương–đỉnh–chẩm có thể làm mất hoàn toàn giấc mơ — trong khi giấc ngủ REM vẫn bình thường". Chữ mới: viết theo hai tóm tắt đọc được; "ventromesial", "đỉnh–chẩm", "mất hoàn toàn" chưa kiểm. Solms 2000: "these lesions do not have any appreciable effects on REM frequency, duration, and density". Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/11515144", "https://europepmc.org/article/MED/24549103" ]
    review: dung
  - id: n20
    cau: 'Ngược lại với "mơ = hoạt động thân não": giấc mơ cũng có thể xuất hiện trong giấc ngủ không REM, và theo Solms cơ chế của mơ nằm nhiều ở não trước; cách đọc này còn gây tranh luận (Hobson và cộng sự, 2000).'
    loai: phat-hien
    nguon:
      - solms2000
    trich: Dreaming can also be induced by focal forebrain stimulation and by complex partial (forebrain) seizures during nonREM sleep, when the involvement of brainstem REM mechanisms is precluded.
    vi_tri: 'tóm tắt Solms 2000; Hobson 2000 tóm tắt: "Debate has focused on whether REM sleep dreaming is qualitatively different from nonREM"'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(2) ngược lại, tổn thương thân não làm mất REM nhưng người bệnh vẫn mơ được … buộc cả hai phe phải sửa lý thuyết". Chữ mới: bỏ ý (2) (không kiểm được ở nguồn mở), thêm "gây tranh luận". Lý do: tóm tắt Solms 2000 nêu mơ khi kích thích não trước/ co giật khi NREM, không nêu tổn thương thân não. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/11515144", "https://europepmc.org/article/MED/11515143" ]
    review: dung
  - id: n21
    cau: 'Revonsuo (2000): lý thuyết mô phỏng đe dọa: giấc mơ mô phỏng các tình huống đe dọa để luyện nhận diện và tránh nguy hiểm.'
    loai: phat-hien
    nguon:
      - revonsuo2000
    trich: the biological function of dreaming is to simulate threatening events, and to rehearse threat perception and threat avoidance
    vi_tri: tóm tắt
    ket_qua: dung
    ghi_chu: Ví dụ "diễn tập phòng cháy chữa cháy" là phép ví von của trang.
