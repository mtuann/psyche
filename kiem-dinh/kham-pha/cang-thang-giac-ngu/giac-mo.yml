  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Khoảng 55% … được khảo sát … khoảng 23% mơ tỉnh thường xuyên … Mơ tỉnh không phải năng lực hiếm của "thiên tài"". Chữ mới: thêm KTC và số nghiên cứu, bỏ "thiên tài". Lý do: nêu độ không chắc chắn; bỏ câu không có nguồn. Cả hai bộ dữ liệu "heterogeneous".'
