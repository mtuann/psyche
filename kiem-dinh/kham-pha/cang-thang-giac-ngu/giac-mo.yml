  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đảo mắt theo chuỗi trái–phải–trái–phải … lần đầu tiên trong lịch sử … xác minh khách quan". Chữ mới: "tín hiệu đã hẹn trước", "ghi nhận khách quan". Lý do: chuỗi đảo mắt cụ thể và "lần đầu tiên trong lịch sử" không kiểm được ở tóm tắt; chỗ khó: chưa mở toàn văn.'
- id: n35
  cau: 'Trong REM cơ bắp bị liệt nhưng cơ mắt thì không, nên tín hiệu bằng mắt được máy ghi lại; OpenStax: REM đi kèm liệt cơ trừ cơ hô hấp và tuần hoàn.'
