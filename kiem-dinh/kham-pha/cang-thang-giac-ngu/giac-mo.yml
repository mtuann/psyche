    cau: 'Eichenlaub và cộng sự (2014): PET đo lưu lượng máu não của người khỏe mạnh lúc thức và lúc ngủ, so nhóm nhớ mơ nhiều (khoảng 5,2 lần/tuần) với nhóm nhớ mơ ít (khoảng 0,5 lần/tuần).'
