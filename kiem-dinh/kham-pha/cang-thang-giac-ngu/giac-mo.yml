  vi_tri: tóm tắt Valli 2005
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "mơ thấy nhiều nội dung đe dọa hơn hẳn … đúng như lý thuyết dự đoán". Chữ mới: viết theo tóm tắt, "ủng hộ hầu hết các dự đoán" (không "đúng như"). "Nặng hơn": tóm tắt cắt ở "The dream threats of traumatized children we[re …]"; phần "nghiêm trọng hơn" chưa thấy trọn câu: chỗ khó.'
- id: n24
  cau: 'Zadra và cộng sự (2006): 212 giấc mơ lặp đi lặp lại; 66% chứa ít nhất một mối đe dọa; 6 trong 8 giả thuyết có ủng hộ; kết luận bằng chứng hỗn hợp.'
  loai: so-lieu
  nguon:
  - zadra2006
  trich: a sample of 212 recurrent dreams [...] Six of the eight hypotheses tested were supported. [...] 66% of the recurrent dream reports contained one or more threats [...] The findings thus provide mixed support for the threat simulation theory.
  vi_tri: tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Một nghiên cứu độc lập khác … cũng thấy 66% chứa ít nhất một sự kiện đe dọa". Chữ mới: thêm "6/8 giả thuyết", "hỗn hợp". Lý do: nguồn kết luận hỗn hợp; "độc lập" bỏ (chưa kiểm tính độc lập).'
- id: n25
  cau: 'Điểm yếu: các nghiên cứu ở đây chủ yếu phân tích nội dung giấc mơ; chúng tôi chưa thấy thí nghiệm cho thấy "diễn tập" trong mơ giúp phản ứng tốt hơn ngoài đời thật; bài tổng quan của những người ủng hộ (Valli & Revonsuo, 2009) cho rằng điểm mạnh nhiều hơn điểm yếu.'
  loai: phat-hien
  nguon:
  - valli2009
  trich: New evidence and new direct tests of the predictions of the TST yield strong support for the theory, and the TST's strengths seem to outweigh its weaknesses.
  vi_tri: tóm tắt Valli & Revonsuo 2009
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "được chính một bài tổng quan ủng hộ lý thuyết này thừa nhận: chưa có bằng chứng trực tiếp nào cho thấy việc diễn tập thật sự giúp phản ứng tốt hơn … hay giúp tăng cơ hội sống sót". Chữ mới: bỏ phần gán cho bài 2009 (tóm tắt nói ngược: "strong support"), thay bằng nhận xét của chúng tôi ("chưa thấy thí nghiệm …"). Lý do: không tìm thấy câu "thừa nhận chưa có bằng chứng trực tiếp" trong nguồn.'
- id: n26
  cau: 'Marzano và cộng sự (2011): 65 sinh viên đại học (35 nam, 30 nữ), điện não đồ trong phòng thí nghiệm, bị đánh thức buổi sáng từ REM hoặc giai đoạn 2.'
  loai: so-lieu
  nguon:
  - marzano2011
  trich: an ad hoc sample of 65 university students [35 males (M) and 30 females (F)
  vi_tri: Materials and Methods, Subjects
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "mẫu sinh viên … bị đánh thức vào buổi sáng". Chữ mới: thêm 65 sinh viên (35 nam, 30 nữ). "Từ REM hoặc giai đoạn 2": theo tóm tắt.'
- id: n27
  cau: Sau khi tỉnh khỏi REM, sóng theta (5–7 Hz) ở vùng trán cao hơn đi kèm việc nhớ được mơ; với giấc ngủ nông (giai đoạn 2), sóng alpha (8–12 Hz) ở vùng thái dương phải thấp hơn đi kèm việc nhớ được mơ.
  loai: phat-hien
  nguon:
  - marzano-abs
  trich: after morning awakening from REM sleep, a higher frontal 5-7 Hz (theta) activity was associated with successful dream recall [...] a lower 8-12 Hz (alpha) oscillatory activity of the right temporal area was associated with a successful dream recall
  vi_tri: tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Hoạt động sóng theta (5–7 Hz) ở vùng trán trong 5 phút trước khi tỉnh khỏi REM càng mạnh thì người đó càng dễ nhớ". Chữ mới: bỏ "trong 5 phút trước khi tỉnh" và "dự báo"; theo tóm tắt là "được liên kết với". Lý do: 5 phút là tiêu chí chọn mẫu (không có chuyển giai đoạn 5 phút cuối), chưa kiểm là cửa sổ phân tích.'
- id: n28
  cau: Các tác giả coi đây là bằng chứng đầu tiên về dấu hiệu điện não rõ ràng của việc nhớ mơ, gợi ý nhớ–quên giấc mơ dùng chung cơ chế với trí nhớ lúc thức.
  loai: phat-hien
  nguon:
  - marzano-abs
  trich: These findings provide the first evidence of univocal cortical electroencephalographic correlates of dream recall, suggesting that the neurophysiological mechanisms underlying the encoding and recall of episodic memories may remain the same across different states of consciousness.
