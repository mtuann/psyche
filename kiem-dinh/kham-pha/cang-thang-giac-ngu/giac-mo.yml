  loai: nhan
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: :::vung-chac[giấc mơ không đồng nhất với giấc ngủ REM] "Mơ xảy ra ở mọi giai đoạn ngủ (… ngủ nông cho mơ mờ nhạt hơn), và tổn thương não có thể xóa sổ giấc mơ trong khi REM vẫn còn nguyên (Solms, 1997)". Chữ mới: :::kha-vung với giới hạn. Lý do: thiếu phân tích tổng hợp, có tranh luận.'
  nhan: kha-vung
  co_so:
  - marzano2011
  - solms2000
  - hobson2000
  ly_do: 'Người tỉnh từ giai đoạn 2 vẫn nhớ được mơ (Marzano 2011); Solms 2000 tổng hợp bằng chứng mơ tách khỏi REM, nhưng quan điểm gây tranh luận (Hobson 2000) và chưa có phân tích tổng hợp riêng: Khá vững chứ chưa Vững chắc.'
- id: n42
  cau: 'Khung "Khá vững: mơ tỉnh là hiện tượng có thật, đã được ghi nhận khách quan".'
  loai: nhan
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: :::vung-chac[… đã được xác minh khách quan] "Từ tín hiệu đảo mắt của LaBerge (1981) đến các ghi nhận điện não sau này, mơ tỉnh không còn là chuyện đồn thổi". Chữ mới: :::kha-vung, "đã được ghi nhận khách quan", thêm giới hạn. Lý do: bằng chứng xác minh chủ yếu là LaBerge n=5; "ghi nhận điện não sau này" chưa dẫn nguồn.'
  nhan: kha-vung
  co_so:
  - laberge1981
  - voss2014
  - saunders2016
  ly_do: 'Tín hiệu từ trong mơ ghi nhận ở 5 người (1981), thí nghiệm kích thích điện (27 người, tự báo cáo), phân tích tổng hợp tần suất (Saunders 2016); nhưng mẫu thí nghiệm nhỏ, chưa tìm thấy tổng quan hệ thống riêng về việc xác minh: Khá vững chứ chưa Vững chắc.'
- id: n43
  cau: 'Khung "Khá vững: mối đe dọa xuất hiện thường xuyên trong một số loại giấc mơ".'
  loai: nhan
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: :::kha-vung[cảm xúc tiêu cực — đặc biệt là sợ hãi — chiếm ưu thế trong giấc mơ] "Phân tích nội dung mơ trên nhiều quần thể cho thấy sợ hãi là cảm xúc phổ biến nhất trong mơ, tiếp đến là giận dữ." Chữ mới: khung về mối đe dọa, dẫn Valli 2005 và Zadra 2006. Lý do: câu cũ không có nguồn và không tìm thấy nguồn mở xác nhận; thay bằng điều kiểm được.'
  nhan: kha-vung
  co_so:
  - valli2005
  - zadra2006
  - revonsuo2000
  ly_do: 'Hai nghiên cứu nội dung mơ (trẻ em sang chấn; 212 giấc mơ lặp lại) thấy nhiều mối đe dọa, nhưng là hai mẫu đặc biệt, Zadra kết luận hỗn hợp, và chưa dẫn được phân tích tổng hợp: Khá vững.'
- id: n44
  cau: 'Khung "Khá vững: nhớ được giấc mơ liên quan đến việc tỉnh giấc đủ lâu".'
  loai: nhan
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: :::kha-vung[ta quên mơ vì não lúc ngủ gần như không mã hóa được trí nhớ mới] "Trong REM, norepinephrine … ở mức rất thấp và vỏ não trước trán hoạt động yếu; … ước tính khoảng 2 phút … Người tỉnh giấc nhiều lần trong đêm nhớ mơ tốt hơn hẳn". Chữ mới: tên khung và nội dung theo Vallat, Hobson 1977 (giả thuyết), Marzano. Lý do: "norepinephrine rất thấp, vỏ não trước trán yếu", "hơn hẳn" không có nguồn mở.'
  nhan: kha-vung
  co_so:
  - vallat2017
  - eich2014cc
  - marzano2011
  ly_do: 'Hai nghiên cứu của nhóm Ruby (18 người mỗi nhóm) và Marzano (65 sinh viên) cùng chiều: nhớ mơ gắn với đặc điểm thức giấc và điện não; nhưng là tương quan, mẫu nhỏ, cơ chế hóa học còn là giả thuyết: Khá vững.'
- id: n45
  cau: 'Khung "Đang tranh cãi: giấc mơ có chức năng tiến hóa hay chỉ là tác dụng phụ?".'
  loai: nhan
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "… Phe activation-synthesis giải thích tốt tính kỳ quặc của mơ nhưng vấp phải bằng chứng của Solms … chưa có lý thuyết nào giải thích trọn vẹn." Chữ mới: giữ ý, nêu tranh luận. Chữ cũ "chưa có bằng chứng trực tiếp rằng diễn tập cải thiện phản ứng" giữ như nhận xét của chúng tôi (n25).'
  nhan: tranh-cai
  co_so:
  - revonsuo2000
  - zadra2006
  - valli2009
  - solms2000
  ly_do: 'Bằng chứng nội dung mơ ủng hộ một phần (Valli 2005; Zadra: hỗn hợp), chưa có thí nghiệm chức năng; quan điểm đối lập (giấc mơ là sản phẩm phụ) vẫn có; Solms thách thức vai trò thân não: Đang tranh cãi.'
- id: n46
  cau: 'Khung "Bác bỏ: mỗi biểu tượng trong mơ có một nghĩa cố định, tra sách là ra".'
  loai: nhan
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Không có bằng chứng khoa học nào cho kiểu giải mộng … Cùng một hình ảnh … xuất hiện trong bối cảnh cảm xúc và đời sống khác nhau thì nghĩa cũng khác nhau … chắc chắn giả." Chữ mới: "Tính đến 11/2026 … không tìm thấy nghiên cứu bình duyệt nào …". Chỗ khó: nhãn Bác bỏ cho một phát biểu phủ định; lượt 2 kiểm lại. Câu "nghĩa cũng khác nhau" chưa có nguồn nên bỏ.'
  nhan: bac-bo
  co_so:
  - tim-bieu-tuong
  ly_do: Không có nghiên cứu bình duyệt nào kiểm chứng kiểu giải mộng tra biểu tượng; ý này theo lần tìm ngày 10/11/2026 (chưa hệ thống); nhãn "bác bỏ" theo đồng thuận của giáo trình hơn là một bài kiểm tra cụ thể.
- id: n47
  cau: Tính đến 11/2026, không tìm thấy nghiên cứu bình duyệt nào kiểm chứng kiểu giải mộng "mơ thấy X thì chắc chắn là điềm Y" (chưa tìm hệ thống trong tạp chí chuyên ngành).
  loai: thoi-su
  nguon:
  - tim-bieu-tuong
  vi_tri: Europe PMC, 10/11/2026
  ket_qua: da-lam-mem
  ghi_chu: 'Truy vấn Europe PMC: (dream AND (symbol* OR dictionary) AND interpretation AND (validity OR empirical OR "no evidence")): kết quả nhiễu (2.249), không có nghiên cứu kiểm chứng "từ điển biểu tượng" trong 6 kết quả đầu; chưa đọc hết.'
  het_han: '2028-11-01'
- id: n48
  cau: Freud có điểm mạnh là xem giấc mơ nghiêm túc như sản phẩm có ý nghĩa của tâm trí; điểm yếu lớn là phương pháp khó kiểm chứng, khó tái lập.
  loai: phat-hien
  nguon:
  - freud1900
  trich: THE DREAM IS THE FULFILMENT OF A WISH
  vi_tri: mục lục (Freud)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "điểm yếu chí mạng … không thể kiểm chứng, không thể tái lập … Tâm lý học hiện đại giữ lại tinh thần … nhưng bỏ đi bộ từ điển biểu tượng cố định". Chữ mới: mềm, dẫn Revonsuo 2000. Cùng chỗ khó với n13.'
- id: n49
  cau: 'Activation-synthesis gặp hai thách thức: Solms (2000) cho rằng mơ phụ thuộc cơ chế ở não trước (Hobson và cộng sự 2000 phản biện), và Revonsuo (2000) cho rằng nội dung mơ có tổ chức, chọn lọc.'
  loai: phat-hien
  nguon:
  - revonsuo-abs
  trich: The form and content of dreams is not random but organized and selective
  vi_tri: tóm tắt Revonsuo 2000; Solms 2000
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "(1) Solms (1997) cho thấy mơ phụ thuộc vào vỏ não trước nhiều hơn pons; (2) nội dung mơ thực ra có tổ chức và lặp lại theo chủ đề (bị đuổi, thi trượt, răng rụng) … Chính Hobson sau này cũng phải mềm hóa lập trường". Chữ mới: bỏ chủ đề "bị đuổi, thi trượt, răng rụng" (không có nguồn), bỏ câu về Hobson (chưa xác nhận được).'
- id: n50
  cau: Lý thuyết mô phỏng đe dọa được một số bằng chứng nội dung mơ ủng hộ nhưng Zadra thấy bằng chứng hỗn hợp; chưa thấy thí nghiệm chức năng; đây vẫn là giả thuyết đang được kiểm tra.
  loai: phat-hien
  nguon:
  - zadra2006
  trich: The findings thus provide mixed support for the threat simulation theory.
  vi_tri: tóm tắt Zadra 2006
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "đẹp nhưng chưa xong". Chữ mới: "giả thuyết đang được kiểm tra".'
- id: n51
  cau: 'Vì sao ta quên giấc mơ: Hobson & McCarley cho rằng thay đổi tỉ lệ chất dẫn truyền có thể góp phần; Marzano thấy sóng theta vùng trán khi tỉnh từ REM đi kèm nhớ mơ; Vallat đề xuất cần thức tối thiểu khoảng 2 phút để mã hóa.'
  loai: phat-hien
  nguon:
  - hobson-abs
  trich: shifts in transmitter ratios, possibly accounting for dream amnesia
  vi_tri: tóm tắt Hobson 1977; xem n27, n33
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "(1) Hóa học: trong REM, norepinephrine và serotonin ở mức rất thấp … (2) Vùng não: vỏ não trước trán hoạt động yếu trong REM … (3) Thời gian: chuyển … mất khoảng 2 phút … mẹo sổ tay cạnh giường thực sự hiệu quả". Chữ mới: viết theo ba nguồn, đánh dấu giả thuyết, và "mẹo … nhiều khả năng tận dụng khoảng thức ngắn; chưa có thí nghiệm kiểm tra riêng". Lý do: các khẳng định cơ chế không có nguồn mở; mẹo sổ tay chưa được kiểm tra.'
- id: n52
  cau: 'Mơ tỉnh: theo Voss, ý thức bậc cao cùng tồn tại với ý thức giấc mơ REM thông thường, hoạt động gamma ở vùng trán–thái dương liên quan đến tự nhận thức trong mơ; kích thích 25 và 40 Hz tăng mơ tỉnh theo thang tự đánh giá; nghiên cứu nhỏ (27 người).'
  loai: phat-hien
  nguon:
  - voss2014
  trich: In lucid dreams, elements of secondary consciousness coexist with normal REM sleep consciousness
  vi_tri: mở đầu bài Voss
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Trong mơ thường, vỏ não trước trán … gần như tắt. Trong mơ tỉnh, vùng này bật lại một phần … chỉ cần ép vùng trán dao động gamma 40 Hz … Mức độ kiểm soát giấc mơ khác nhau ở mỗi người: … bay lượn, đổi cảnh như đạo diễn." Chữ mới: viết theo bài Voss, bỏ phần "tắt/bật lại" và mức kiểm soát (không có nguồn).'
- id: n53
  cau: 'Mục Áp dụng 1: "Muốn nhớ mơ, hãy ghi lại trong vòng vài phút sau khi tỉnh" :nhan[kha-vung].'
  loai: nhan
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Bạn đang tận dụng cửa sổ mã hóa … càng luyện, tỉ lệ nhớ mơ càng tăng vì não học được rằng "giấc mơ là thứ đáng lưu"". Chữ mới: "nhiều khả năng tận dụng khoảng thức ngắn … chưa tìm thấy thí nghiệm kiểm tra riêng; luyện nhiều thì nhớ nhiều hơn cũng chưa có nguồn". Lý do: câu cũ không có nguồn.'
  nhan: kha-vung
