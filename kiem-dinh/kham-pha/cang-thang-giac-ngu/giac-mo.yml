  - id: n59
    cau: 'Mục Áp dụng 4 (không gắn nhãn): giấc mơ có mối đe dọa khá thường gặp (66% trong 212 giấc mơ lặp lại, Zadra); chức năng "chạy thử" chưa được kiểm chứng; chúng tôi không thấy bằng chứng cho thấy một giấc mơ đáng sợ là điềm báo.'
    loai: loi-khuyen
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "### 4. Đừng sợ những giấc mơ "xấu" :nhan[kha-vung] … phần lớn người trưởng thành đều mơ những chủ đề này … não đang "chạy thử" … nó thường chỉ có nghĩa não bạn đang làm đúng việc của nó." Chữ mới: tiêu đề "Một giấc mơ đáng sợ không phải là điềm báo", nhãn Đang tranh cãi, dẫn Zadra 66%, và nêu chức năng chưa kiểm chứng. Lý do: "phần lớn người trưởng thành" và "đang làm đúng việc của nó" không có nguồn; không viết thành lời khuyên điều trị. Giữ id cũ. Review (Claude Opus 5.5, 10/11/2026): sai. Lượt 2 đúng ở ý chính: nhãn Đang tranh cãi trên tiêu đề "Một giấc mơ đáng sợ không phải là điềm báo" khiến người đọc hiểu là chuyện điềm báo đang tranh cãi; không có bằng chứng mâu thuẫn nào về điềm báo. Bỏ chip (giữ id cũ { #4-dung-so-nhung-giac-mo-xau-kha-vung }); phần "não chạy thử" trong thân mục đã dẫn khung Đang tranh cãi. Đổi loại nhan thành loi-khuyen.'
    nhan: tranh-cai
    co_so:
      - zadra2006
      - valli2009
    ly_do: Phần "não chạy thử" thuộc lý thuyết mô phỏng đe dọa (Đang tranh cãi); khung gộp theo ý yếu hơn; phần "không phải điềm báo" theo n46.
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/16720254", "https://europepmc.org/article/MED/11515147" ]
    luot_2_ghi_chu: 'Nhãn "đang tranh cãi" khó khớp thước đo: không có bằng chứng mâu thuẫn chất lượng cao về chuyện mơ dự báo; không có nguồn mở nào kiểm tra chuyện "điềm báo".'
    nguon:
      - zadra2006
      - tim-bieu-tuong
