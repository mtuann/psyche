    luot_2_ghi_chu: Tóm tắt Voss xác nhận kích thích gamma thấp trong REM (25, 40 Hz) gây nhận thức bản thân trong mơ; chưa mở được toàn văn nên không xác nhận được 27 người, tuổi 18-26, chưa từng mơ tỉnh.
