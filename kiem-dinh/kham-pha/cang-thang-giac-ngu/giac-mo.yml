    luot_2_ghi_chu: Câu của trang ghi "theo cách đọc phổ biến", không gán cho các tác giả; đúng như vậy.
    review: dung
  - id: n18
    cau: Solms tổng hợp các ca bệnh nhân tổn thương não khu trú (sách 1997, tóm tắt trong bài tổng quan 2000), đối chiếu vị trí tổn thương với việc còn mơ hay không; chưa mở được toàn văn sách.
    loai: lich-su
    nguon:
      - solms2000
    trich: Recent neuropsychological, radiological, and pharmacological findings suggest that the cholinergic brain stem mechanisms that control the REM state can only generate the psychological phenomena of dreaming through the mediation of a second, probably dopaminergic, forebrain mechanism.
    vi_tri: tóm tắt Solms 2000 (BBS)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "rà soát **361 ca** bệnh nhân tổn thương não khu trú". Chữ mới: bỏ số 361. Lý do: không kiểm được con số ở nguồn mở (sách 1997 không đọc được); cả quiz sửa theo. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
