    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: :::vung-chac[giấc mơ không đồng nhất với giấc ngủ REM] "Mơ xảy ra ở mọi giai đoạn ngủ (… ngủ nông cho mơ mờ nhạt hơn), và tổn thương não có thể xóa sổ giấc mơ trong khi REM vẫn còn nguyên (Solms, 1997)". Chữ mới: :::kha-vung với giới hạn. Lý do: thiếu phân tích tổng hợp, có tranh luận. Review (Claude Opus 5.5, 10/11/2026): dung. Khá vững đạt mục 4: Marzano 2011 (nhớ mơ sau khi tỉnh từ giai đoạn 2) và Solms 2000 cùng chiều, Hobson 2000 phản biện; chưa có tổng hợp. Đạt.'
