    trich: we measured regional cerebral blood flow (rCBF) using [(15)O]H2O positron emission tomography in healthy subjects with high and low dream recall frequencies … Low recallers (0.5 ± 0.3 dream recall per week in average), High recallers (5.2 ± 1.4)
    vi_tri: tóm tắt (Europe PMC)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "41 tình nguyện viên … 21 người nhớ mơ nhiều (trung bình nhớ mơ 5,2 buổi sáng mỗi tuần) và 20 người nhớ mơ ít (trung bình chỉ khoảng 2 giấc mơ mỗi tháng)". Chữ mới: thêm "nam", "lần nhớ mơ mỗi tuần", 0,5 lần/tuần. Lý do: bài ghi dream reports per week; 0,5/tuần ≈ 2/tháng; trang cũ trích sai bài (xem n31). Review (Claude Opus 5.5, 10/11/2026): sai. Lượt 2 không chắc; review không mở được toàn văn Eichenlaub 2014 NPP (PMC không cho tải, nhà xuất bản chặn máy, không có trong bộ Internet Archive). Viết lại ở mức tóm tắt: bỏ "41 tình nguyện viên nam", "21 người", "20 người"; giữ 5,2 và 0,5 lần mỗi tuần (tóm tắt: "Low recallers (0.5 ± 0.3 dream recall per week in average), High recallers (5.2 ± 1.4)").'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/24549103" ]
    luot_2_ghi_chu: "Tóm tắt xác nhận: người nhớ mơ nhiều 5,2 ± 1,4 lần/tuần, người nhớ ít 0,5 ± 0,3; PET H2(15)O; lúc thức và lúc ngủ. Chưa mở được toàn văn (có tường phí) nên không xác nhận được 41 người, 21/20, toàn nam."
