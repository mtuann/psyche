  ly_do: Sửa theo nguồn đã đọc (mã sửa vn0); xem ghi_chu của các nhận định tương ứng.
- cu: '**Chúng tôi chưa tìm thấy nghiên cứu công bố nào về nội dung giấc mơ, tần suất nhớ mơ, hay mơ tỉnh trên người Việt.** Mọi con số trong bài (55% từng mơ tỉnh, 5,2 buổi sáng nhớ mơ mỗi tuần...) đều đến từ mẫu phương Tây. Điều này đáng lưu ý vì nội dung mơ chịu ảnh hưởng văn hóa: người Việt sống trong gia đình nhiều thế hệ, tín ngưỡng thờ cúng tổ tiên, áp lực thi cử... hoàn toàn c…'
  moi: '**Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu công bố nào về nội dung giấc mơ, tần suất nhớ mơ, hay mơ tỉnh trên người Việt** (tìm trên Europe PMC ngày 10/11/2026; chưa tìm trong tạp chí trong nước). Các thí nghiệm nêu trong bài thực hiện ở Mỹ, Đức, Ý, Pháp, Phần Lan và các mẫu khác; chúng tôi không dẫn được nghiên cứu nào trên người Việt cho các con số trong bài (55% …'
  ly_do: Sửa theo nguồn đã đọc (mã sửa vn2); xem ghi_chu của các nhận định tương ứng.
- cu: Cùng một hình ảnh trong mơ, ý nghĩa cảm xúc của nó phụ thuộc vào đời sống của người mơ — không có "từ điển" chung cho tất cả mọi người.
  moi: Chúng tôi không tìm thấy nghiên cứu bình duyệt nào chứng minh một "từ điển" chung cho tất cả mọi người.
  ly_do: Sửa theo nguồn đã đọc (mã sửa ng1); xem ghi_chu của các nhận định tương ứng.
- cu: Kiểu giải mộng tra-cứu-biểu-tượng không có bằng chứng khoa học.
  moi: Chúng tôi không tìm thấy bằng chứng khoa học cho kiểu giải mộng tra-cứu-biểu-tượng.
  ly_do: Sửa theo nguồn đã đọc (mã sửa ng0); xem ghi_chu của các nhận định tương ứng.
- cu: '**"Giấc mơ chỉ xảy ra trong lúc ngủ REM."** Sai. Mơ xảy ra ở mọi giai đoạn ngủ; REM cho những giấc mơ sống động, dài và giàu cảm xúc nhất, còn giấc ngủ nông cũng có mơ nhưng thường mờ nhạt, ít hình ảnh hơn.'
  moi: '**"Giấc mơ chỉ xảy ra trong lúc ngủ REM."** Không đúng hẳn. Người được đánh thức từ giấc ngủ nông (giai đoạn 2) cũng có thể nhớ được giấc mơ (Marzano và cộng sự, 2011); chúng tôi chưa mở được nguồn tổng hợp so sánh mức sống động của mơ ở REM và giấc ngủ nông, nên không nêu so sánh này.'
  ly_do: Sửa theo nguồn đã đọc (mã sửa ng2); xem ghi_chu của các nhận định tương ứng.
- cu: '**"Mơ tỉnh nghĩa là muốn làm gì trong mơ cũng được."** Không hẳn. "Biết mình đang mơ" và "điều khiển được giấc mơ" là hai mức độ khác nhau; nhiều người chỉ đạt mức đầu. Khả năng điều khiển tăng dần theo luyện tập, nhưng hiếm khi đạt mức "đạo diễn toàn năng".'
  moi: '**"Mơ tỉnh nghĩa là muốn làm gì trong mơ cũng được."** Định nghĩa của mơ tỉnh là biết mình đang mơ trong lúc mơ (LaBerge và cộng sự, 1981); chúng tôi chưa dẫn được nghiên cứu nào cho thấy mức kiểm soát nội dung mơ, nên không khẳng định điều này.'
  ly_do: Sửa theo nguồn đã đọc (mã sửa ng3); xem ghi_chu của các nhận định tương ứng.
- cu: '**"Quên giấc mơ là do trí nhớ kém."** Không. Quên mơ là trạng thái mặc định của một bộ não khỏe mạnh, do hóa học não trong lúc ngủ không thuận cho việc ghi nhớ. Người nhớ mơ mỗi sáng không "thông minh" hơn — họ chỉ tỉnh giấc nhiều lần hơn trong đêm.'
  moi: '**"Quên giấc mơ là do trí nhớ kém."** Chưa có bằng chứng như vậy: người nhớ mơ nhiều và ít khác nhau ở hoạt động não và số lần thức giấc dài trong đêm (Eichenlaub và cộng sự, 2014; Vallat và cộng sự, 2017), chứ các nghiên cứu này không so sánh trí nhớ nói chung hay trí thông minh.'
  ly_do: Sửa theo nguồn đã đọc (mã sửa ng4); xem ghi_chu của các nhận định tương ứng.
- cu: '**"Có thể tự kích thích điện não tại nhà để mơ tỉnh như trong nghiên cứu."** Cực kỳ nguy hiểm và không nên làm. Thí nghiệm của Voss (2014) được thực hiện trong phòng thí nghiệm, với thiết bị y tế, liều lượng được kiểm soát và theo dõi điện não liên tục. Không có thiết bị tiêu dùng nào được chứng minh an toàn và hiệu quả cho việc này.'
  moi: '**"Có thể tự kích thích điện não tại nhà để mơ tỉnh như trong nghiên cứu."** Không nên làm. Thí nghiệm của Voss (2014) được thực hiện trong phòng thí nghiệm, với thiết bị nghiên cứu, theo dõi điện não liên tục. Chúng tôi không thấy bằng chứng cho thấy việc tự dùng thiết bị ở nhà là an toàn và hiệu quả.'
  ly_do: Sửa theo nguồn đã đọc (mã sửa ng5); xem ghi_chu của các nhận định tương ứng.
- cu: — stress và giấc ngủ
  moi: — stress và niềm tin về stress
  ly_do: Sửa theo nguồn đã đọc (mã sửa dt1); xem ghi_chu của các nhận định tương ứng.
- cu: '? Phát hiện của Solms (1997) trên 361 bệnh nhân tổn thương não cho thấy điều gì?'
  moi: '? Theo Solms (1997, 2000), các ca tổn thương não cho thấy điều gì về giấc mơ và REM?'
  ly_do: Sửa theo nguồn đã đọc (mã sửa q1); xem ghi_chu của các nhận định tương ứng.
- cu: + Tổn thương một số vùng vỏ não (trán giữa-bụng, chỗ nối thái dương–đỉnh–chẩm) có thể làm mất hoàn toàn khả năng mơ trong khi giấc ngủ REM vẫn bình thường — nghĩa là mơ và REM có thể tách rời nhau.
  moi: + Tổn thương một số vùng não trước có thể làm mất việc báo cáo giấc mơ mà không đổi đáng kể REM — gợi ý mơ và REM có thể tách rời nhau (quan điểm còn tranh luận).
  ly_do: Sửa theo nguồn đã đọc (mã sửa q1b); xem ghi_chu của các nhận định tương ứng.
- cu: '> Phát hiện này là "đòn" mạnh vào cả hai quan niệm đơn giản: "mơ = REM" và "mơ = nhiễu pons". Cơ chế của giấc mơ nằm nhiều ở vỏ não trước hơn người ta từng nghĩ.'
  moi: '> Theo Solms, đây là thách thức cho cả hai quan niệm đơn giản "mơ = REM" và "mơ = hoạt động của thân não"; Hobson và cộng sự (2000) phản biện, nên đây chưa phải kết luận cuối cùng.'
  ly_do: Sửa theo nguồn đã đọc (mã sửa q1c); xem ghi_chu của các nhận định tương ứng.
- cu: '- Tổn thương thân não luôn xóa sổ cả giấc ngủ REM lẫn giấc mơ cùng lúc.'
  moi: '- Mọi tổn thương não đều xóa sổ cả giấc ngủ REM lẫn giấc mơ cùng lúc.'
  ly_do: Sửa theo nguồn đã đọc (mã sửa q1d); xem ghi_chu của các nhận định tương ứng.
- cu: + Trong REM, norepinephrine ở mức rất thấp và vỏ não trước trán hoạt động yếu nên não gần như không mã hóa được trí nhớ mới; chỉ khi tỉnh giấc đủ lâu (khoảng 2 phút), não mới bắt đầu "lưu" — giấc mơ nào không kịp lưu trong cửa sổ đó sẽ tan biến.
  moi: + Theo các nghiên cứu về nhớ mơ, việc nhớ liên quan đến lần thức giấc đủ dài (Vallat và cộng sự đề xuất tối thiểu khoảng 2 phút) và đến hoạt động điện não khi tỉnh; giấc mơ không kịp được mã hóa thì dễ bị quên — cơ chế chi tiết vẫn là giả thuyết.
  ly_do: Sửa theo nguồn đã đọc (mã sửa q3); xem ghi_chu của các nhận định tương ứng.
- cu: '> Đây cũng là lý do mẹo "ghi ngay khi tỉnh" hiệu quả: bạn đang tranh thủ đúng cửa sổ mã hóa vừa mở ra sau khi thức dậy.'
  moi: '> Mẹo "ghi ngay khi tỉnh" nhiều khả năng tận dụng khoảng thức ngắn ấy, nhưng chúng tôi chưa thấy thí nghiệm kiểm tra riêng mẹo này.'
  ly_do: Sửa theo nguồn đã đọc (mã sửa q3b); xem ghi_chu của các nhận định tương ứng.
- cu: '+ Dặn trước 5 người có khả năng mơ tỉnh: khi nào nhận ra mình đang mơ, hãy đảo mắt theo chuỗi đã hẹn (trái–phải–trái–phải); chuỗi đảo mắt được máy ghi lại trong lúc điện não đồ xác nhận họ đang ở REM rõ ràng.'
  moi: '+ Dặn trước 5 người có khả năng mơ tỉnh: khi nhận ra mình đang mơ, hãy thực hiện một tín hiệu đã hẹn trước; tín hiệu được ghi lại trong lúc điện não đồ xác nhận họ đang ở REM rõ ràng.'
  ly_do: Sửa theo nguồn đã đọc (mã sửa q4); xem ghi_chu của các nhận định tương ứng.
- cu: '> Vì trong REM mọi cơ bắp đều bị liệt trừ cơ mắt, chuỗi đảo mắt hẹn trước trở thành "tín hiệu" gửi từ trong giấc mơ ra thế giới thật — lần đầu tiên một trải nghiệm trong mơ được xác minh khách quan.'
  moi: '> Vì trong REM cơ bắp bị liệt (trừ những cơ hô hấp và tuần hoàn), tín hiệu hẹn trước trở thành "tín hiệu" gửi từ trong giấc mơ ra thế giới thật, giúp ghi nhận khách quan một trải nghiệm trong mơ.'
  ly_do: Sửa theo nguồn đã đọc (mã sửa q4b); xem ghi_chu của các nhận định tương ứng.
- cu: '? LaBerge và cộng sự (1981) đã xác minh khách quan hiện tượng mơ tỉnh bằng cách nào?'
  moi: '? LaBerge và cộng sự (1981) đã ghi nhận khách quan hiện tượng mơ tỉnh bằng cách nào?'
  ly_do: Sửa theo nguồn đã đọc (mã sửa q4c); xem ghi_chu của các nhận định tương ứng.
- cu: '- Dùng điện cực kích thích vùng trán ở tần số 40 Hz để ép người ngủ bước vào trạng thái mơ tỉnh.'
  moi: '- Dùng kích thích điện vùng trán ở tần số 40 Hz để ép người ngủ bước vào trạng thái mơ tỉnh.'
