  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Đây là bằng chứng đầu tiên cho thấy nhớ–quên giấc mơ dùng chung cơ chế điện não với trí nhớ lúc thức". Chữ mới: "Các tác giả coi … gợi ý …". Lý do: nguồn dùng "may remain the same".'
- id: n29
  cau: 'Eichenlaub và cộng sự (2014): PET đo lưu lượng máu não của 41 tình nguyện viên nam khỏe mạnh lúc thức và lúc ngủ; 21 người nhớ mơ nhiều (khoảng 5,2 lần/tuần), 20 người nhớ mơ ít (khoảng 0,5 lần/tuần).'
  loai: so-lieu
  nguon:
  - eich2014npp
