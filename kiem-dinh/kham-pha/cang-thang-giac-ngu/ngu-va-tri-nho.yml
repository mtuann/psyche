    vi_tri: tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chưa có bằng chứng vững chắc nào cho thấy ta có thể học kiến thức *mới* trong lúc ngủ." Chữ mới: mốc 11/2026 và nội dung tổng quan 2023. Lý do: thêm nguồn và mốc; bằng chứng tìm được là tổng quan 2023 (cập nhật đến thời điểm tìm: chưa tìm tổng quan mới hơn). Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn.'
