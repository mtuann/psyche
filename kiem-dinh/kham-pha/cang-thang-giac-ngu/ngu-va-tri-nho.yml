  - id: n36
    cau: 'Khung "Khá vững: giấc ngủ sóng chậm củng cố trí nhớ tường thuật".'
    loai: nhan
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: khung "Vững chắc" (:::vung-chac), nội dung "một trong những phát hiện được tái lập tốt nhất trong khoa học về giấc ngủ". Chữ mới: :::kha-vung với hai phân tích tổng hợp và lý do chưa Vững chắc. Lý do: câu "tái lập tốt nhất" không có nguồn; mô hình chuyển kho chưa chứng minh trực tiếp. Khớp nhãn các bài tri-nho đã khóa: bài Đường cong quên có nhãn riêng cho học rải (n53). Review (Claude Opus 5.5, 10/11/2026): dung. Nhãn Khá vững đạt thước đo mục 4: Berres & Erdfelder 2021 (tóm tắt, Europe PMC: 823 hiệu ứng, 271 mẫu, g = 0,44, còn 0,28 khi tính thiên lệch báo cáo chọn lọc) và Hu 2020 (91 thí nghiệm, SWS g = 0,27) cùng chiều; chưa Vững chắc vì phần riêng của SWS và cơ chế chuyển kho chưa được chứng minh trực tiếp (Diekelmann & Born 2010, toàn văn). Số trong khung khớp tóm tắt.'
    nhan: kha-vung
    co_so:
      - berres2021
      - hu2020
      - diekelmann2010
      - gais2006
      - rasch2007
    ly_do: 'Hai phân tích tổng hợp trong Psychological Bulletin cùng chiều (Berres & Erdfelder 2021: ngủ giúp nhớ lại g = 0,44, 0,28 sau hiệu chỉnh; Hu 2020: nhắc ký ức trong SWS g = 0,27). Chưa đạt Vững chắc: hiệu ứng nhỏ đến vừa, các thí nghiệm kể ở trang có mẫu nhỏ, phần "ký ức chuyển dần về vỏ não" là mô hình chưa chứng minh trực tiếp (Diekelmann & Born 2010), chưa có tái lập lớn có đăng ký trước.'
