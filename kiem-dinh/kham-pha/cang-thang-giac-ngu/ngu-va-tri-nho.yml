  - id: q2
    cau: 'Câu hỏi 2: Gais cho người thức trắng ngủ bù trước khi kiểm tra để loại trừ khả năng họ nhớ kém chỉ vì mệt lúc làm bài; kiểm tra sau 48 giờ, cả hai điều kiện đã ngủ bù; các tác giả kết luận mệt mỏi không giải thích được khác biệt.'
    loai: phat-hien
    nguon:
      - gais2006
    trich: Thus, fatigue accumulating during wake intervals could be ruled out as a confound.
    vi_tri: tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "nhóm thức trắng … Nhóm thức trắng vẫn nhớ kém hơn — chứng tỏ thiệt hại nằm ở quá trình củng cố … chứ không phải ở lúc truy xuất." và phương án "Vì thiếu người tham gia nên phải dùng lại nhóm cũ." Chữ mới: "người thức trắng", "các tác giả kết luận … gợi ý … chứ không chỉ ở lúc truy xuất", phương án sai mới "Để người tham gia không biết mình đang ở điều kiện nào.". Lý do: thiết kế trong-nhóm (n19); "chứng tỏ" quá mạnh (n25); phương án sai cũ gần với sự thật (thí nghiệm dùng lại cùng người). Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf" ]
    review: dung
  - id: q3
    cau: 'Câu hỏi 3: thí nghiệm nhắc mùi cho thấy tái kích hoạt ký ức trong SWS là nguyên nhân giúp củng cố trí nhớ vị trí đã học; mùi chỉ có tác dụng khi đã xuất hiện lúc học và được nhắc trong SWS; mỗi thí nghiệm 17–18 người.'
    loai: phat-hien
    nguon:
      - rasch2007
    trich: Odor re-exposure was ineffective during rapid eye movement sleep or wakefulness or when the odor had been omitted during prior learning.
    vi_tri: tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "chứng minh điều gì?"; "nhắc trong REM hay lúc thức đều vô ích"; "bằng chứng nhân quả". Chữ mới: "cho thấy điều gì?", "không có tác dụng", "bằng chứng thực nghiệm … (mỗi thí nghiệm chỉ có 17–18 người)", thêm "vị trí đã học". Lý do: như n32, n34. Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại toàn văn Rasch 2007 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus): điều kiện mùi và cỡ mẫu 17–18 khớp (xem n32, n34).'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/17347444" ]
    luot_2_ghi_chu: Phần nhân quả và điều kiện của mùi khớp tóm tắt; cỡ mẫu 17-18 mỗi thí nghiệm chưa xác nhận được (không mở toàn văn).
    review: dung
  - id: q4
    cau: 'Câu hỏi 4: vì sao vai trò của REM được gắn "Đang tranh cãi": bằng chứng chưa nhất quán (ức chế REM không làm giảm trí nhớ kỹ năng); bài tổng quan viết REM có thể thuận lợi cho củng cố synap, còn là giả thuyết.'
