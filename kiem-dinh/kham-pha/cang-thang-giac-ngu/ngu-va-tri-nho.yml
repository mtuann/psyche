  vi_tri: tr. 1427, chú thích Hình 1
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: (không có). Chữ mới: thêm. Lý do: đủ thiết kế.'
- id: n31
  cau: 'Thí nghiệm chính 18 người: nhớ lại khoảng 97% vị trí sau đêm có mùi, so với khoảng 86% sau đêm không mùi.'
  loai: so-lieu
  nguon:
  - rasch2007
  trich: participants remembered 97.2 4.1% of the card pairs they had learned before sleep, but they remembered only 85.8 3.8% after the vehicle night
  vi_tri: tr. 1427
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "nhớ vị trí các cặp thẻ tốt hơn hẳn". Chữ mới: kèm số 97%/86%, 18 người. Lý do: số thật của bài (97,2 ± 4,1% và 85,8 ± 3,8%; P = 0,001).'
- id: n32
  cau: 'Các thí nghiệm kiểm soát (17–18 người mỗi thí nghiệm): nhắc mùi trong REM, lúc thức, hoặc khi mùi không xuất hiện lúc học đều không có tác dụng với trí nhớ vị trí.'
  loai: so-lieu
  nguon:
  - rasch2007
  trich: Odor re-exposure was ineffective during rapid eye movement sleep or wakefulness or when the odor had been omitted during prior learning.
  vi_tri: tóm tắt; thí nghiệm II n=17, III n=17, IV n=18
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đều không có tác dụng". Chữ mới: thêm "17–18 người", "với trí nhớ vị trí". Lý do: nêu mẫu, và giới hạn ở nhiệm vụ trí nhớ vị trí.'
- id: n33
  cau: Một thí nghiệm fMRI cho thấy hồi hải mã tăng hoạt động khi mùi được nhắc lại trong SWS.
  loai: phat-hien
  nguon:
  - rasch2007
  trich: functional magnetic resonance imaging revealed significant hippocampal activation in response to odor re-exposure during SWS
  vi_tri: tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "hồi hải mã *sáng lên*". Chữ mới: "tăng hoạt động". Lý do: bỏ hình ảnh sai lệch (fMRI đo tín hiệu, không phát sáng).'
- id: n34
  cau: Các tác giả coi đây là bằng chứng thực nghiệm cho vai trò nhân quả của tái kích hoạt ký ức trong SWS; mỗi thí nghiệm chỉ 17–18 người.
  loai: phat-hien
  nguon:
