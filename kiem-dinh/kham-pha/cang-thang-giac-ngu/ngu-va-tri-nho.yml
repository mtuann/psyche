  ghi_chu: 'Chữ cũ: "Đây là bằng chứng nhân quả mạnh mẽ". Chữ mới: "Các tác giả coi đây là bằng chứng thực nghiệm cho vai trò nhân quả … Mỗi thí nghiệm chỉ có 17–18 người". Lý do: tránh "mạnh mẽ", nêu mẫu nhỏ.'
