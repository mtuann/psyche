- id: n36
  cau: 'Khung "Khá vững: giấc ngủ sóng chậm củng cố trí nhớ tường thuật".'
  loai: nhan
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: khung "Vững chắc" (:::vung-chac), nội dung "một trong những phát hiện được tái lập tốt nhất trong khoa học về giấc ngủ". Chữ mới: :::kha-vung với hai phân tích tổng hợp và lý do chưa Vững chắc. Lý do: câu "tái lập tốt nhất" không có nguồn; mô hình chuyển kho chưa chứng minh trực tiếp. Khớp nhãn các bài tri-nho đã khóa: bài Đường cong quên có nhãn riêng cho học rải (n53).'
  nhan: kha-vung
  co_so:
  - berres2021
  - hu2020
  - diekelmann2010
  - gais2006
  - rasch2007
  ly_do: 'Hai phân tích tổng hợp trong Psychological Bulletin cùng chiều (Berres & Erdfelder 2021: ngủ giúp nhớ lại g = 0,44, 0,28 sau hiệu chỉnh; Hu 2020: nhắc ký ức trong SWS g = 0,27). Chưa đạt Vững chắc: hiệu ứng nhỏ đến vừa, các thí nghiệm kể ở trang có mẫu nhỏ, phần "ký ức chuyển dần về vỏ não" là mô hình chưa chứng minh trực tiếp (Diekelmann & Born 2010), chưa có tái lập lớn có đăng ký trước.'
- id: n37
  cau: Phân tích tổng hợp 823 hiệu ứng từ 271 mẫu độc lập thấy lợi ích của giấc ngủ ở mức vừa (g = 0,44), giảm còn g = 0,28 sau khi hiệu chỉnh thiên lệch báo cáo chọn lọc.
  loai: so-lieu
  nguon:
  - berres2021
  trich: we found a moderate overall sleep benefit in episodic memory (g = 0.44) [...] When accounting for selective reporting bias, the overall effect of sleep on episodic memory is reduced but still significant (g = 0.28)
  vi_tri: tóm tắt
  ket_qua: dung
  ghi_chu: Tóm tắt (toan_van false). Số 823/271 khớp "823 effect sizes from 271 independent samples".
- id: n38
  cau: 'Phân tích tổng hợp 91 thí nghiệm nhắc lại ký ức có chủ đích: nhắc trong SWS có tác dụng nhỏ (g = 0,27), nhắc trong REM hay lúc thức thì không.'
  loai: so-lieu
  nguon:
  - hu2020
  trich: 'from 91 experiments with 212 effect sizes (N = 2,004) [...] slow-wave sleep: Hedges'' g = 0.27, 95% CI [0.20, 0.35]). In contrast, TMR was not effective during REM sleep nor during wakefulness'
  vi_tri: tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ (nếu có): "nhỏ nhưng ổn định". Chữ mới: "nhỏ (g = 0,27)". Lý do: tóm tắt không dùng chữ "ổn định" cho kết quả này. Khớp với Rasch 2007 ở chiều REM/thức.'
- id: n39
  cau: 'Khung "Đang tranh cãi: vai trò chính xác của giấc ngủ REM".'
  loai: nhan
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "cho rằng REM đảm nhận bước *củng cố synap*". Chữ mới: "REM *có thể* thuận lợi …" và thêm lưu ý thuốc có thể bù. Lý do: nguồn dùng "might favour" và nói "direct evidence of this is scarce at present".'
  nhan: tranh-cai
  co_so:
  - diekelmann2010
  - rasch2009
  ly_do: 'Bằng chứng chất lượng cao mâu thuẫn: Diekelmann & Born (2010) nói bằng chứng trực tiếp về củng cố synap trong REM còn ít; Rasch 2009 thấy ức chế REM bằng thuốc không làm hại trí nhớ kỹ năng, nhưng bài tổng quan lưu ý thuốc có thể tự bù qua tính dẻo synap.'
- id: n40
  cau: Ức chế REM bằng thuốc không làm giảm, thậm chí cải thiện trí nhớ kỹ năng (Rasch và cộng sự, 2009); bài tổng quan lưu ý thuốc có thể tác động trực tiếp lên tính dẻo synap và bù cho việc mất REM.
  loai: phat-hien
  nguon:
  - rasch2009
  trich: REM sleep suppression by administration of selective serotonin or norepinephrine re-uptake inhibitors after training did not impair consolidation of skills or word-pairs in healthy men but rather enhanced gains in finger tapping accuracy
  vi_tri: tóm tắt (Rasch 2009); Diekelmann & Born tr. 120 cho lưu ý
  ket_qua: dung
  ghi_chu: 'Phần "bài tổng quan lưu ý" khớp Diekelmann & Born: "such substances also exert direct effects on synaptic plasticity and synaptic forms of consolidation that could compensate for a loss of REM sleep".'
- id: n41
  cau: Bài tổng quan 2010 tóm tắt bằng chứng về vai trò của REM với trí nhớ cảm xúc.
  loai: phat-hien
  nguon:
  - diekelmann2010
  trich: Sleep likewise supports the consolidation of emotional information
  vi_tri: tr. 116
  ket_qua: dung
- id: n42
  cau: 'Khung "Bác bỏ: thức trắng đêm thay cho giấc ngủ giúp nhớ lại phần đã học tốt hơn".'
  loai: nhan
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: khung :::bac-bo[thức trắng đêm ôn thi giúp nhớ bài hơn], "nhóm thức trắng nhớ kém hơn hẳn … Thiếu ngủ không chỉ làm ta mệt lúc thi — nó phá hỏng quá trình củng cố trí nhớ ngay trong đêm đó." Chữ mới: tên khung thu hẹp "thức trắng đêm thay cho giấc ngủ giúp nhớ lại phần đã học tốt hơn" và nội dung nêu Berres 2021 và giới hạn. Lý do: bằng chứng không kiểm tra việc thức đêm để học thêm.'
  nhan: bac-bo
  co_so:
  - gais2006
  - berres2021
  ly_do: 'Gais 2006 (14 người) và phân tích tổng hợp Berres & Erdfelder 2021 (271 mẫu) cùng thấy người ngủ nhớ lại nhiều hơn người thức cùng khoảng thời gian; chưa có nghiên cứu nào kể ở trang so sánh việc dùng đêm thức để học thêm. Nhãn phát biểu hẹp: thức trắng thay cho ngủ, không phải "học thêm".'
- id: n43
  cau: Phân tích tổng hợp của Berres và Erdfelder (2021) thấy người ngủ nhớ lại nhiều hơn người thức cùng khoảng thời gian.
  loai: phat-hien
  nguon:
  - berres2021
  trich: People recall more information after sleep than after an equally long period of wakefulness.
  vi_tri: tóm tắt
  ket_qua: dung
- id: n44
  cau: 'Củng cố hệ thống: trong SWS, hồi hải mã phát lại ký ức (gợn sóng ripple), thoi ngủ giúp vỏ não sẵn sàng tiếp nhận, sóng chậm phối hợp các hoạt động ấy.'
  loai: phat-hien
  nguon:
  - diekelmann2010
  trich: a fine-tuned temporal relationship between the occurrence of slow oscillations, spindles and sharp wave-ripples during SWS that coordinates the bidirectional information flow between the neocortex and the hippocampus
  vi_tri: tr. 118
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "các thoi ngủ và sóng chậm "mở cổng" để vỏ não tiếp nhận". Chữ mới: "thoi ngủ giúp vỏ não sẵn sàng tiếp nhận và sóng chậm phối hợp". Lý do: bỏ ẩn dụ "mở cổng" không có trong nguồn.'
- id: n45
  cau: Theo mô hình hai kho, việc chuyển kho diễn ra dần qua nhiều lần tái kích hoạt, lúc ngủ khi não không ghi nhận thông tin mới, nên tránh nhiễu và ghi đè lên kiến thức cũ.
  loai: phat-hien
  nguon:
  - diekelmann2010
  trich: the re-activation and redistribution of memories take place off-line (during sleep) when no encoding occurs
  vi_tri: Box 2
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Qua nhiều đêm, ký ức dần trở nên độc lập với hồi hải mã — đó là lý do ký ức cũ khó mất hơn ký ức mới học." Chữ mới: viết theo Box 2 và thêm "chưa được chứng minh trực tiếp". Lý do: câu "đó là lý do ký ức cũ khó mất hơn" không có trong nguồn.'
- id: n46
  cau: 'Củng cố synap trong REM: môi trường hóa học của REM (acetylcholine cao, sóng theta) có thể tạo điều kiện gia cố các kết nối ở vỏ não; đây là phần còn nhiều tranh luận.'
  loai: phat-hien
  nguon:
  - diekelmann2010
  trich: might favour the subsequent synaptic consolidation of memories in the cortex
  vi_tri: tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "tạo điều kiện gia cố". Chữ mới: "*có thể* tạo điều kiện … còn nhiều tranh luận". Lý do: như n13.'
- id: n47
  cau: 'Giả thuyết cân bằng synap: sóng chậm làm giảm đồng loạt cường độ các kết nối synap, các kết nối yếu bị loại bỏ, nhờ đó tín hiệu nổi bật hơn nhiễu.'
  loai: phat-hien
  nguon:
  - diekelmann2010
  trich: Sleep would serve to globally downscale synaptic strength
  vi_tri: tr. 118, mục Synaptic homeostasis
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "trong SWS, não còn "tỉa bớt" các kết nối yếu, ít dùng đến". Chữ mới: "sóng chậm làm giảm đồng loạt cường độ các kết nối synap, các kết nối yếu bị loại bỏ …". Lý do: giả thuyết nói về giảm toàn bộ cường độ synap, không phải "tỉa kết nối ít dùng".'
- id: n48
  cau: Bài tổng quan xem giả thuyết cân bằng synap và củng cố hệ thống chủ động là hai giả thuyết không loại trừ nhau, nhiều khả năng phối hợp với nhau.
  loai: phat-hien
  nguon:
  - diekelmann2010
  trich: The two models are not mutually exclusive; indeed, the hypothesized processes probably act in concert to optimize the memory function of sleep.
  vi_tri: tr. 118
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Một ý tưởng bổ sung". Chữ mới: nêu rõ nguồn nói gì. Lý do: chính xác hơn.'
- id: n49
  cau: 'Cả ba ý tưởng cùng hướng nhìn: giấc ngủ không chỉ là thời gian chết của trí nhớ, mà có thể là ca làm việc thứ hai của nó.'
  loai: phat-hien
  nguon:
  - diekelmann2010
  trich: SWS and REM sleep have complementary functions to optimize memory consolidation
  vi_tri: tr. 122, Conclusions
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Cả ba đều thống nhất ở một điểm: giấc ngủ không phải thời gian chết của trí nhớ, mà là ca làm việc thứ hai của nó". Chữ mới: "cùng một hướng nhìn … không chỉ … có thể là". Lý do: "thống nhất" quá mạnh, ba ý tưởng cạnh tranh nhau một phần.'
- id: n50
  cau: 'Mục Áp dụng 1: "Xếp lịch học sao cho sau đó là một giấc ngủ đêm" :nhan[kha-vung].'
  loai: nhan
  ket_qua: dung
  nhan: kha-vung
  co_so:
  - gais2006
  - berres2021
  ly_do: Lợi ích của ngủ sau khi học thấy ở phân tích tổng hợp (g 0,28–0,44) nhưng thí nghiệm Gais chỉ 12 người, một điều kiện học sáng/tối; nên Khá vững.
- id: n51
  cau: Gais thấy ngủ trong vài giờ sau khi học giúp nhớ từ vựng tốt hơn học buổi sáng rồi thức cả ngày, trong một thí nghiệm nhỏ (12 học sinh); có thể học xong buổi tối rồi đi ngủ đúng giờ.
  loai: phat-hien
  nguon:
  - gais2006
  trich: declarative memory is enhanced when sleep follows within a few hours of learning, independent of time of day
  vi_tri: tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "ngủ *ngay trong vài giờ sau khi học* giúp nhớ từ vựng tốt hơn … hãy học xong buổi tối rồi đi ngủ đúng giờ — giấc ngủ sẽ "làm nốt phần việc còn lại"". Chữ mới: "so với học sáng rồi thức cả ngày, trong một thí nghiệm nhỏ (12 học sinh) … có thể … có thể giúp". Lý do: mềm lại, nêu cỡ mẫu.'
- id: n52
  cau: 'Mục Áp dụng 2: "Đừng thức trắng đêm trước ngày thi" :nhan[kha-vung].'
  loai: nhan
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: :nhan[vung-chac] "Đây là ứng dụng chắc chắn nhất … Một đêm ngủ đủ trước kỳ thi "lợi" hơn nhiều so với vài tiếng nhồi nhét thêm." Chữ mới: :nhan[kha-vung], nêu rõ chưa kiểm tra thức để học thêm, thêm lời dẫn tới người có chuyên môn và Hỗ trợ. Lý do: so sánh "lợi hơn nhiều" chưa được kiểm tra.'
  nhan: kha-vung
  co_so:
  - gais2006
  - berres2021
  - nhs-insomnia
  ly_do: Chiều "thức thay cho ngủ thì nhớ phần đã học kém hơn" có hai nguồn (Gais 2006, Berres 2021) nên Khá vững; nhưng không có nghiên cứu so thức để học thêm với ngủ đủ, nên không Vững chắc.
  id_cu_giu: '#2-dung-thuc-trang-dem-truoc-ngay-thi-vung-chac'
- id: n53
  cau: Nghiên cứu của Gais và phân tích tổng hợp cho thấy người thức trắng nhớ lại phần đã học kém hơn người đã ngủ, kể cả sau khi ngủ bù.
  loai: phat-hien
  nguon:
  - gais2006
  trich: Sleep deprivation has a detrimental effect on memory, which was significant after a night of recovery sleep.
  vi_tri: tóm tắt
  ket_qua: dung
  ghi_chu: Phần "phân tích tổng hợp" xem n43; "kể cả sau khi ngủ bù" chỉ có ở Gais.
- id: n54
  cau: Chưa có nghiên cứu nào ở đây so sánh trực tiếp việc dùng đêm thức để học thêm với ngủ đủ.
  loai: phat-hien
  nguon:
  - gais2006
  trich: Reading was not allowed in order to prevent possible interference in the declarative memory system
  vi_tri: tr. 260
  ket_qua: dung
