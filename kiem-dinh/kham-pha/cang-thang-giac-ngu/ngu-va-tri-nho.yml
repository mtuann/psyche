nhan_dinh:
  - id: n1
    cau: 'Mô tả: giấc ngủ, nhất là giấc ngủ sóng chậm, có thể giúp củng cố trí nhớ.'
    loai: phat-hien
    nguon:
      - diekelmann2010
    trich: Sleep has been identified as a state that optimizes the consolidation of newly acquired information in memory
    vi_tri: tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Giấc ngủ sóng chậm củng cố trí nhớ như thế nào". Chữ mới: "Giấc ngủ, nhất là giấc ngủ sóng chậm, có thể giúp củng cố trí nhớ như thế nào". Lý do: cơ chế SWS là mô hình (n12). Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/35404637", "https://europepmc.org/article/MED/20046194", "https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf" ]
    luot_2_ghi_chu: Câu mô tả nói "có thể giúp", đúng mức.
    review: dung
  - id: n2
    cau: 'Đáp án thu gọn: người ngủ sau khi học nhớ lại nhiều hơn khi thức trắng, kể cả khi người thức trắng đã được ngủ bù trước lúc kiểm tra; nên nhiều khả năng An nhớ phần đã học tốt hơn.'
    loai: phat-hien
    nguon:
      - gais2006
    trich: Subjects remembered clearly more of the learned vocabulary when they had slept during the night following learning than when they had stayed awake
    vi_tri: tr. 260, thí nghiệm 2
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "**An nhớ tốt hơn** … giấc ngủ sau khi học *chủ động* củng cố trí nhớ, còn thức trắng thì phá hỏng quá trình đó." Chữ mới: "**Nhiều khả năng An nhớ phần đã học tốt hơn** … Trong thí nghiệm bên dưới, người ngủ sau khi học nhớ lại nhiều hơn khi thức trắng …". Lý do: 14 người, danh sách ngắn; "chủ động củng cố/phá hỏng" là diễn giải. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf" ]
    luot_2_ghi_chu: Chỉ 14 người; kết luận "nhiều khả năng" là đúng mức.
    review: dung
  - id: n3
    cau: Trong thí nghiệm của Gais, người thức trắng không dùng đêm để học thêm (xem TV, chơi trò chơi), nên phần "Bình học thêm mấy tiếng" chưa được kiểm tra trực tiếp.
    loai: phat-hien
    nguon:
      - gais2006
    trich: During sleep deprivation, subjects were engaged in activities such as watching TV and playing games. Reading was not allowed
    vi_tri: tr. 260
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: (không có; đáp án coi như thức đêm để học thêm cũng thua). Chữ mới: câu thêm. Lý do: nguồn không kiểm tra việc học thêm. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf" ]
    review: dung
  - id: n4
    cau: Theo mô hình được nhiều nhà nghiên cứu ủng hộ, khi ngủ sâu não tái kích hoạt ("phát lại") những gì đã học trong ngày.
    loai: phat-hien
    nguon:
      - diekelmann2010
    trich: an active consolidation process results from selective re-activation of memories during sleep
    vi_tri: tr. 118 (mục Synaptic homeostasis versus system consolidation)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Thực ra, khi ta chìm vào giấc ngủ sâu, não bước vào một ca làm việc khác: nó **phát lại** những gì đã học trong ngày." Chữ mới: "Theo mô hình được nhiều nhà nghiên cứu ủng hộ, … **tái kích hoạt** ("phát lại") …". Lý do: là giả thuyết (n12). Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/20046194" ]
    luot_2_ghi_chu: Chỉ đọc tóm tắt bài tổng quan (toàn văn có tường phí, không mở).
    review: dung
  - id: n5
    cau: Giấc ngủ gồm các giai đoạn luân phiên; giấc ngủ sóng chậm (SWS, ngủ sâu, sóng não chậm và đều) tập trung ở nửa đầu đêm, giấc ngủ mắt chuyển động nhanh (REM) ở nửa sau đêm.
    loai: dinh-nghia
    nguon:
      - diekelmann2010
    trich: is characterized by high amounts of SWS, whereas REM sleep prevails during the second half (late sleep)
    vi_tri: tr. 115, Box 1
    ket_qua: dung
    ghi_chu: 'Bỏ "lúc ta mơ nhiều nhất" khỏi định nghĩa REM (xem n6). Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại toàn văn Diekelmann & Born 2010 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus): Box 1: "In humans, the first part of the night (early sleep) is characterized by high amounts of SWS, whereas REM sleep prevails during the second half (late sleep)". Lượt 2 không chắc chỉ vì chưa mở toàn văn.'
    luot_2: khong-chac
    luot_2_ghi_chu: 'Chỉ xác nhận phần định nghĩa: OpenStax Psychology 2e 4.3 nói giai đoạn 3 NREM là "deep sleep or slow-wave sleep" với sóng delta, REM có sóng giống lúc thức. Chưa mở được nguồn bậc 1-2 nói SWS tập trung nửa đầu đêm và REM nửa sau.'
    review: dung
  - id: n6
    cau: (Đã bỏ) "REM — lúc ta mơ nhiều nhất".
    loai: phat-hien
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ: "(rapid eye movement, REM — lúc ta mơ nhiều nhất)". Chữ mới: "(rapid eye movement, REM)". Lý do: câu thừa, giấc mơ có ở cả NREM; không cần cho luận điểm của bài (giấc mơ ở bài riêng). Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/21543596", "https://openstax.org/books/psychology-2e/pages/4-3-stages-of-sleep" ]
    luot_2_ghi_chu: Câu đã bỏ khỏi trang, không còn khẳng định gì; việc bỏ là đúng vì mơ cũng xảy ra ngoài REM.
    review: dung
  - id: n7
    cau: Bài tổng quan "The memory function of sleep" đăng trên Nature Reviews Neuroscience, tập 11, số 2, trang 114–126 (Diekelmann và Born, 2010).
    loai: lich-su
    nguon:
      - diekelmann2010
    trich: The memory function of sleep
    vi_tri: tr. 114
    ket_qua: dung
    ghi_chu: Siêu dữ liệu khớp bản PDF (tr. 114, "FEBRUARY 2010, VOLUME 11") và Crossref 10.1038/nrn2762.
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/20046194" ]
  - id: n8
    cau: Bài tổng quan tổng hợp bằng chứng trên người và động vật gặm nhấm.
    loai: phat-hien
    nguon:
      - diekelmann2010
    trich: a consistent finding in humans, cats, rats and mice
    vi_tri: tr. 118
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "tổng hợp hàng loạt bằng chứng". Chữ mới: "tổng hợp bằng chứng trên người và động vật gặm nhấm". Lý do: chính xác hơn (bài dẫn cả người, mèo, chuột). Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại toàn văn Diekelmann & Born 2010 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus): tr. 118 "a consistent finding in humans, cats, rats and mice"; bài dẫn nghiên cứu trên người và chuột (rats, mice). Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/20046194" ]
    luot_2_ghi_chu: Tóm tắt không nói bài gồm cả người lẫn động vật gặm nhấm; không mở được toàn văn.
    review: dung
  - id: n9
    cau: 'Bài đề xuất khung hai giai đoạn nối tiếp: củng cố hệ thống trong SWS rồi củng cố synap trong REM.'
    loai: phat-hien
    nguon:
      - diekelmann2010
    trich: slow-wave sleep (SWS) and rapid eye movement (REM) sleep support system consolidation and synaptic consolidation, respectively
    vi_tri: tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/20046194" ]
    luot_2_ghi_chu: Từ "subsequent" ủng hộ thứ tự nối tiếp; chỉ đọc tóm tắt.
  - id: n10
    cau: Trong SWS, sóng chậm, thoi ngủ và gợn sóng phối hợp việc tái kích hoạt và tái phân phối các ký ức phụ thuộc hồi hải mã sang vỏ não.
    loai: phat-hien
    nguon:
      - diekelmann2010
    trich: slow oscillations, spindles and ripples - at minimum cholinergic activity - coordinate the re-activation and redistribution of hippocampus-dependent memories to neocortical sites
    vi_tri: tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/20046194" ]
  - id: n11
    cau: Quá trình đó diễn ra khi hoạt động acetylcholine ở mức thấp nhất.
    loai: phat-hien
    nguon:
      - diekelmann2010
    trich: at minimum cholinergic activity
    vi_tri: tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/20046194" ]
  - id: n12
    cau: Chính bài tổng quan lưu ý việc tái phân phối ký ức này chưa được chứng minh trực tiếp.
    loai: phat-hien
    nguon:
      - diekelmann2010
    trich: although this has not been directly demonstrated yet
    vi_tri: tr. 119 (mục System consolidation)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: (không có; trang nói như chắc chắn). Chữ mới: câu thêm. Lý do: nguồn tự nói chưa chứng minh trực tiếp. Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại toàn văn Diekelmann & Born 2010 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus): "It is assumed that the reactivations during system consolidation stimulate the redistribution of hippocampal memories to neocortical storage sites, although this has not been directly demonstrated yet". Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/20046194" ]
    luot_2_ghi_chu: Tóm tắt không nói việc tái phân phối "chưa được chứng minh trực tiếp"; không mở được toàn văn để xác nhận lời lưu ý này.
    review: dung
  - id: n13
    cau: Trong REM, với acetylcholine và sóng theta cao, hoạt động của các gen liên quan đến tính dẻo tăng cục bộ, và điều này có thể tạo điều kiện củng cố synap ở vỏ não.
    loai: phat-hien
    nguon:
      - diekelmann2010
    trich: local increases in plasticity-related immediate-early gene activity
    vi_tri: tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "các gen liên quan đến tính dẻo của não được kích hoạt, tạo điều kiện **gia cố các kết nối synap**". Chữ mới: "hoạt động của các gen … tăng cục bộ, và điều này *có thể* tạo điều kiện …". Lý do: nguồn dùng "might favour"; bằng chứng trực tiếp còn ít (n39). Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/20046194" ]
    review: dung
  - id: n14
    cau: Hồi hải mã là kho lưu trữ tạm, vỏ não là kho lưu trữ dài hạn (mô hình hai kho); hồi hải mã học nhanh, vỏ não học chậm.
    loai: dinh-nghia
    nguon:
      - diekelmann2010
    trich: the other store learns at a slower rate and serves as the long-term store
    vi_tri: Box 2
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/20046194", "https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf" ]
    luot_2_ghi_chu: Mô tả mô hình hai kho đúng theo văn liệu; "hồi hải mã học nhanh, vỏ não học chậm" là phần chuẩn của mô hình, không có ở tóm tắt.
  - id: n15
    cau: 'Gais và cộng sự: người tham gia là học sinh trung học Mỹ, nói tiếng Anh và chưa biết tiếng Đức.'
    loai: phat-hien
    nguon:
      - gais2006
    trich: Twelve American high school students [...] Subjects were native English speakers with no prior knowledge of German.
    vi_tri: tr. 259
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Học sinh trung học học các cặp từ vựng (tiếng Đức–tiếng Anh)". Chữ mới: ghi rõ học sinh Mỹ, nói tiếng Anh, chưa biết tiếng Đức. Lý do: đủ và chính xác hơn. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf" ]
    review: dung
  - id: n16
    cau: Mỗi danh sách gồm 24 cặp từ tiếng Anh–tiếng Đức, học tối đa 10 phút.
    loai: so-lieu
    nguon:
      - gais2006
    trich: one of four 24-pair English-German vocabulary lists [...] with a time limit of 10 min to learn the whole list
    vi_tri: tr. 259
    ket_qua: da-sua
    ghi_chu: "Xem n15 (chữ cũ không nêu số cặp và thời gian). Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn."
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf" ]
    review: dung
  - id: n17
    cau: 'Thí nghiệm 1: 12 học sinh, thiết kế trong-nhóm, ai cũng làm đủ bốn điều kiện.'
    loai: so-lieu
    nguon:
      - gais2006
    trich: Twelve American high school students [...] participated in all four conditions in a within-subject design.
    vi_tri: tr. 259
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "mỗi học sinh học buổi tối rồi ngủ ngay trong một điều kiện, và học buổi sáng rồi thức ban ngày trong điều kiện còn lại; kiểm tra sau 24 và 36 giờ". Chữ mới: bốn điều kiện (sáng/tối, 24/36 giờ). Lý do: bài có bốn điều kiện, không phải hai. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2020/http://learnmem.cshlp.org/content/13/3/259.full.pdf" ]
