nhan_dinh:
- id: n1
  cau: 'Mô tả: giấc ngủ, nhất là giấc ngủ sóng chậm, có thể giúp củng cố trí nhớ.'
  loai: phat-hien
  nguon:
  - diekelmann2010
  trich: Sleep has been identified as a state that optimizes the consolidation of newly acquired information in memory
  vi_tri: tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Giấc ngủ sóng chậm củng cố trí nhớ như thế nào". Chữ mới: "Giấc ngủ, nhất là giấc ngủ sóng chậm, có thể giúp củng cố trí nhớ như thế nào". Lý do: cơ chế SWS là mô hình (n12).'
- id: n2
  cau: 'Đáp án thu gọn: người ngủ sau khi học nhớ lại nhiều hơn khi thức trắng, kể cả khi người thức trắng đã được ngủ bù trước lúc kiểm tra; nên nhiều khả năng An nhớ phần đã học tốt hơn.'
  loai: phat-hien
  nguon:
  - gais2006
  trich: Subjects remembered clearly more of the learned vocabulary when they had slept during the night following learning than when they had stayed awake
  vi_tri: tr. 260, thí nghiệm 2
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "**An nhớ tốt hơn** … giấc ngủ sau khi học *chủ động* củng cố trí nhớ, còn thức trắng thì phá hỏng quá trình đó." Chữ mới: "**Nhiều khả năng An nhớ phần đã học tốt hơn** … Trong thí nghiệm bên dưới, người ngủ sau khi học nhớ lại nhiều hơn khi thức trắng …". Lý do: 14 người, danh sách ngắn; "chủ động củng cố/phá hỏng" là diễn giải.'
- id: n3
  cau: Trong thí nghiệm của Gais, người thức trắng không dùng đêm để học thêm (xem TV, chơi trò chơi), nên phần "Bình học thêm mấy tiếng" chưa được kiểm tra trực tiếp.
  loai: phat-hien
  nguon:
  - gais2006
  trich: During sleep deprivation, subjects were engaged in activities such as watching TV and playing games. Reading was not allowed
  vi_tri: tr. 260
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: (không có; đáp án coi như thức đêm để học thêm cũng thua). Chữ mới: câu thêm. Lý do: nguồn không kiểm tra việc học thêm.'
- id: n4
  cau: Theo mô hình được nhiều nhà nghiên cứu ủng hộ, khi ngủ sâu não tái kích hoạt ("phát lại") những gì đã học trong ngày.
  loai: phat-hien
  nguon:
  - diekelmann2010
  trich: an active consolidation process results from selective re-activation of memories during sleep
  vi_tri: tr. 118 (mục Synaptic homeostasis versus system consolidation)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Thực ra, khi ta chìm vào giấc ngủ sâu, não bước vào một ca làm việc khác: nó **phát lại** những gì đã học trong ngày." Chữ mới: "Theo mô hình được nhiều nhà nghiên cứu ủng hộ, … **tái kích hoạt** ("phát lại") …". Lý do: là giả thuyết (n12).'
- id: n5
  cau: Giấc ngủ gồm các giai đoạn luân phiên; giấc ngủ sóng chậm (SWS, ngủ sâu, sóng não chậm và đều) tập trung ở nửa đầu đêm, giấc ngủ mắt chuyển động nhanh (REM) ở nửa sau đêm.
  loai: dinh-nghia
  nguon:
  - diekelmann2010
  trich: is characterized by high amounts of SWS, whereas REM sleep prevails during the second half (late sleep)
  vi_tri: tr. 115, Box 1
  ket_qua: dung
  ghi_chu: Bỏ "lúc ta mơ nhiều nhất" khỏi định nghĩa REM (xem n6).
- id: n6
  cau: (Đã bỏ) "REM — lúc ta mơ nhiều nhất".
  loai: phat-hien
  ket_qua: da-bo
  ghi_chu: 'Chữ cũ: "(rapid eye movement, REM — lúc ta mơ nhiều nhất)". Chữ mới: "(rapid eye movement, REM)". Lý do: câu thừa, giấc mơ có ở cả NREM; không cần cho luận điểm của bài (giấc mơ ở bài riêng).'
- id: n7
  cau: Bài tổng quan "The memory function of sleep" đăng trên Nature Reviews Neuroscience, tập 11, số 2, trang 114–126 (Diekelmann và Born, 2010).
  loai: lich-su
  nguon:
  - diekelmann2010
  trich: The memory function of sleep
  vi_tri: tr. 114
  ket_qua: dung
  ghi_chu: Siêu dữ liệu khớp bản PDF (tr. 114, "FEBRUARY 2010, VOLUME 11") và Crossref 10.1038/nrn2762.
- id: n8
  cau: Bài tổng quan tổng hợp bằng chứng trên người và động vật gặm nhấm.
  loai: phat-hien
  nguon:
  - diekelmann2010
  trich: a consistent finding in humans, cats, rats and mice
  vi_tri: tr. 118
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "tổng hợp hàng loạt bằng chứng". Chữ mới: "tổng hợp bằng chứng trên người và động vật gặm nhấm". Lý do: chính xác hơn (bài dẫn cả người, mèo, chuột).'
- id: n9
  cau: 'Bài đề xuất khung hai giai đoạn nối tiếp: củng cố hệ thống trong SWS rồi củng cố synap trong REM.'
  loai: phat-hien
  nguon:
  - diekelmann2010
  trich: slow-wave sleep (SWS) and rapid eye movement (REM) sleep support system consolidation and synaptic consolidation, respectively
  vi_tri: tóm tắt
  ket_qua: dung
- id: n10
  cau: Trong SWS, sóng chậm, thoi ngủ và gợn sóng phối hợp việc tái kích hoạt và tái phân phối các ký ức phụ thuộc hồi hải mã sang vỏ não.
  loai: phat-hien
  nguon:
  - diekelmann2010
  trich: slow oscillations, spindles and ripples - at minimum cholinergic activity - coordinate the re-activation and redistribution of hippocampus-dependent memories to neocortical sites
  vi_tri: tóm tắt
  ket_qua: dung
- id: n11
  cau: Quá trình đó diễn ra khi hoạt động acetylcholine ở mức thấp nhất.
  loai: phat-hien
  nguon:
  - diekelmann2010
  trich: at minimum cholinergic activity
  vi_tri: tóm tắt
  ket_qua: dung
- id: n12
  cau: Chính bài tổng quan lưu ý việc tái phân phối ký ức này chưa được chứng minh trực tiếp.
  loai: phat-hien
  nguon:
  - diekelmann2010
  trich: although this has not been directly demonstrated yet
  vi_tri: tr. 119 (mục System consolidation)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: (không có; trang nói như chắc chắn). Chữ mới: câu thêm. Lý do: nguồn tự nói chưa chứng minh trực tiếp.'
- id: n13
  cau: Trong REM, với acetylcholine và sóng theta cao, hoạt động của các gen liên quan đến tính dẻo tăng cục bộ, và điều này có thể tạo điều kiện củng cố synap ở vỏ não.
  loai: phat-hien
  nguon:
  - diekelmann2010
  trich: local increases in plasticity-related immediate-early gene activity
  vi_tri: tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "các gen liên quan đến tính dẻo của não được kích hoạt, tạo điều kiện **gia cố các kết nối synap**". Chữ mới: "hoạt động của các gen … tăng cục bộ, và điều này *có thể* tạo điều kiện …". Lý do: nguồn dùng "might favour"; bằng chứng trực tiếp còn ít (n39).'
- id: n14
  cau: Hồi hải mã là kho lưu trữ tạm, vỏ não là kho lưu trữ dài hạn (mô hình hai kho); hồi hải mã học nhanh, vỏ não học chậm.
  loai: dinh-nghia
  nguon:
  - diekelmann2010
  trich: the other store learns at a slower rate and serves as the long-term store
  vi_tri: Box 2
  ket_qua: dung
- id: n15
  cau: 'Gais và cộng sự: người tham gia là học sinh trung học Mỹ, nói tiếng Anh và chưa biết tiếng Đức.'
  loai: phat-hien
  nguon:
  - gais2006
  trich: Twelve American high school students [...] Subjects were native English speakers with no prior knowledge of German.
  vi_tri: tr. 259
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Học sinh trung học học các cặp từ vựng (tiếng Đức–tiếng Anh)". Chữ mới: ghi rõ học sinh Mỹ, nói tiếng Anh, chưa biết tiếng Đức. Lý do: đủ và chính xác hơn.'
- id: n16
  cau: Mỗi danh sách gồm 24 cặp từ tiếng Anh–tiếng Đức, học tối đa 10 phút.
  loai: so-lieu
  nguon:
  - gais2006
  trich: one of four 24-pair English-German vocabulary lists [...] with a time limit of 10 min to learn the whole list
  vi_tri: tr. 259
  ket_qua: da-sua
  ghi_chu: Xem n15 (chữ cũ không nêu số cặp và thời gian).
- id: n17
  cau: 'Thí nghiệm 1: 12 học sinh, thiết kế trong-nhóm, ai cũng làm đủ bốn điều kiện.'
  loai: so-lieu
  nguon:
  - gais2006
  trich: Twelve American high school students [...] participated in all four conditions in a within-subject design.
  vi_tri: tr. 259
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "mỗi học sinh học buổi tối rồi ngủ ngay trong một điều kiện, và học buổi sáng rồi thức ban ngày trong điều kiện còn lại; kiểm tra sau 24 và 36 giờ". Chữ mới: bốn điều kiện (sáng/tối, 24/36 giờ). Lý do: bài có bốn điều kiện, không phải hai.'
- id: n18
  cau: 'Thí nghiệm 1: học lúc 8 giờ tối rồi ngủ trong khoảng 3 giờ sau đó, hoặc học lúc 8 giờ sáng rồi thức khoảng 15 giờ mới ngủ; kiểm tra lại sau 24 hoặc 36 giờ.'
  loai: phat-hien
  nguon:
  - gais2006
  trich: Learning took place either at 8 a.m. or at 8 p.m. [...] Recall was tested again after 24 h or 36 h
  vi_tri: 'tr. 259; bảng 1 (cột "Time between learning and sleep": 3 h, 15 h)'
  ket_qua: da-sua
  ghi_chu: Xem n17; số giờ lấy từ Bảng 1.
- id: n19
  cau: 'Thí nghiệm 2: 14 học sinh nam, thiết kế trong-nhóm, thứ tự đảo ngẫu nhiên.'
  loai: so-lieu
  nguon:
  - gais2006
  trich: Fourteen male high school students [...] were tested twice in randomized, counterbalanced order
  vi_tri: tr. 260
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "một nhóm học buổi tối rồi đi ngủ, nhóm còn lại học cùng giờ nhưng thức trắng đêm". Chữ mới: mỗi người làm cả hai điều kiện. Lý do: thiết kế trong-nhóm, không phải hai nhóm.'
- id: n20
  cau: Ở lại thức trắng đêm dưới sự giám sát (xem TV, chơi trò chơi); không được đọc sách để tránh gây nhiễu cho trí nhớ.
  loai: phat-hien
  nguon:
  - gais2006
  trich: subjects were engaged in activities such as watching TV and playing games. Reading was not allowed in order to prevent possible interference in the declarative memory system
  vi_tri: tr. 260
  ket_qua: dung
- id: n21
  cau: Sáng hôm sau người thức trắng về nhà ngủ bù (trung bình khoảng 5,6 giờ ban ngày và 7,6 giờ đêm kế tiếp).
  loai: so-lieu
  nguon:
  - gais2006
  trich: they slept on average for 5.6 [...] h during daytime and for another 7.6 [...] h during the following night
  vi_tri: tr. 260
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: (không có số giờ ngủ bù). Chữ mới: số giờ theo bài.'
- id: n22
  cau: Cả hai điều kiện được kiểm tra 48 giờ sau khi học, nên người thức trắng đã được ngủ bù trước lúc kiểm tra, loại trừ khả năng nhớ kém chỉ vì mệt.
  loai: phat-hien
  nguon:
  - gais2006
  trich: Recall testing took place in both conditions 48 h after initial learning
  vi_tri: tr. 260
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "kiểm tra sau 48 giờ — tức nhóm thức trắng đã được ngủ bù một đêm". Chữ mới: ghi rõ ngủ bù 5,6 giờ ban ngày và 7,6 giờ đêm kế tiếp. Lý do: chính xác hơn.'
- id: n23
  cau: 'Kết quả thí nghiệm 1: tỉ lệ quên cao hơn rõ rệt khi học buổi sáng (ngủ muộn) so với buổi tối (ngủ sớm); khoảng giữ 24 hay 36 giờ không tạo khác biệt đáng kể.'
  loai: phat-hien
  nguon:
  - gais2006
  trich: a much higher rate of forgetting in morning-learning conditions than in evening-learning conditions [...] no significant difference was found for retention intervals of 24 h and 36 h
  vi_tri: tr. 260
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: (không nêu kết quả thí nghiệm 1). Chữ mới: kết quả theo bài (F(1,11)=9,8, P<0,01; F=0,2, P=0,65).'
- id: n24
  cau: 'Thí nghiệm 2: người tham gia nhớ rõ ràng nhiều từ hơn khi đã ngủ so với khi thức trắng (trung bình mất khoảng 0,2 từ so với khoảng 1,8 từ).'
  loai: so-lieu
  nguon:
  - gais2006
  trich: Subjects remembered clearly more of the learned vocabulary when they had slept during the night following learning than when they had stayed awake (F1,13 = 7.1, P < 0.05
  vi_tri: tr. 260, Bảng 1 phần B (0,2 và 1,8 từ)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Nhóm được ngủ sau khi học nhớ rõ ràng nhiều từ hơn nhóm thức trắng." Chữ mới: so sánh trong-nhóm kèm số từ mất. Lý do: không có "nhóm"; thêm số.'
- id: n25
  cau: 'Tác hại của việc thức trắng vẫn còn sau khi ngủ bù: các tác giả kết luận mệt mỏi lúc kiểm tra không giải thích được khác biệt; điều này gợi ý ảnh hưởng nằm ở củng cố trong đêm đầu, chứ không chỉ ở lúc truy xuất.'
  loai: phat-hien
  nguon:
  - gais2006
  trich: This finding excludes fatigue as a factor explaining differences in retrieval performance between sleep and sleep deprivation.
  vi_tri: tr. 260
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "chứng tỏ vấn đề không phải là mệt mỏi lúc kiểm tra, mà là quá trình củng cố trí nhớ đã bị phá hỏng ngay trong đêm đầu tiên". Chữ mới: "các tác giả kết luận … gợi ý …". Lý do: loại trừ mệt mỏi không đồng nghĩa chứng minh cơ chế.'
- id: n26
  cau: Cỡ mẫu nhỏ (12 và 14 người) và danh sách từ ngắn là giới hạn của thí nghiệm.
  loai: so-lieu
  nguon:
  - gais2006
  trich: compared with many other studies measuring forgetting, here only a small number of items had to be encoded
  vi_tri: tr. 260
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: (không có). Chữ mới: câu giới hạn. Lý do: cỡ mẫu 12 và 14 theo bài; bài tự nói ít mục.'
- id: n27
  cau: Trí nhớ từ vựng là trí nhớ tường thuật (declarative), được xem là phụ thuộc hồi hải mã; trước đó, phần lớn nghiên cứu gần đây về giấc ngủ và trí nhớ ở người tập trung vào trí nhớ quy trình, được xem là không phụ thuộc hồi hải mã.
  loai: phat-hien
  nguon:
  - gais2006
  trich: In humans, these studies concentrated mainly on procedural types of memory, which are considered to be hippocampus-independent.
  vi_tri: tr. 259, tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "phụ thuộc hồi hải mã … vốn ít liên quan đến hồi hải mã hơn". Chữ mới: "được xem là …". Lý do: bài nói "considered to be".'
- id: n28
  cau: Gais, Lucas & Born (2006), Learning & Memory, 13(3), 259–262.
  loai: lich-su
  nguon:
  - gais2006
  trich: Brief Communication 13:259-262
  vi_tri: tr. 259
  ket_qua: dung
  ghi_chu: Khớp bản PDF và Crossref 10.1101/lm.132106.
- id: n29
  cau: 'Rasch và cộng sự: tình nguyện viên học vị trí 15 cặp thẻ trên lưới hai chiều vào buổi tối, trong khi ngửi mùi hoa hồng; trong hai giai đoạn SWS đầu của đêm, mùi được phảng phất lại.'
  loai: phat-hien
  nguon:
