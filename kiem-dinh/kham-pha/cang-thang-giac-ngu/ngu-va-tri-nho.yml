    cau: "Thức trắng không chỉ khiến bạn mệt lúc làm bài: trong thí nghiệm của Gais và cộng sự (14 học sinh), người tham gia nhớ lại phần đã học kém hơn sau đêm thức trắng so với khi được ngủ, kể cả khi đã ngủ bù trước lúc kiểm tra; phân tích tổng hợp của Berres và Erdfelder (2021) cũng thấy người ngủ nhớ lại nhiều hơn người thức cùng khoảng thời gian."
