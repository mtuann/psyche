    luot_2_ghi_chu: Lời khuyên hợp lý, nói "chưa thấy bằng chứng có lợi" cho thức trắng.
    review: dung
  - id: n70
    cau: 'Mục Nguồn: 9 tài liệu (Diekelmann & Born 2010; Gais, Lucas & Born 2006; Rasch và cộng sự 2007; Ataei 2023; Berres & Erdfelder 2021; Hu 2020; Rasch 2009; Le 2026; Züst 2019) có tên, tạp chí, tập, trang, DOI đúng.'
    loai: lich-su
    ket_qua: dung
    ghi_chu: 'Đối chiếu: Diekelmann, Gais, Rasch 2007 khớp PDF; Berres, Hu, Ataei, Züst, Rasch 2009, Le khớp Europe PMC/OpenAlex (tên bài, năm, DOI). Trang tập/số của Berres 147(12) 1309–1353, Hu 146(3) 218–244, Züst 29(4) 541–553, Ataei 72:101852, Rasch 2009 12(4) 396–397 chưa đối chiếu từng chữ với Crossref; chỗ này lượt 2 có thể kiểm lại. Review (Claude Opus 5.5, 10/11/2026): dung. Đối chiếu Crossref (10/11/2026) cả 9 mục: tác giả, năm, tên bài, tạp chí, tập, số, trang, DOI khớp (Ataei: tên bài trên Crossref dùng gạch ngang "–" thay hai chấm, không đổi nghĩa).'
    luot_2: khong-chac
    luot_2_ghi_chu: "Không được xem trang để đối chiếu từng mục nguồn. Đã kiểm riêng: Diekelmann & Born (11, 114-126), Gais (13, 259-262), Rasch 2007 (315, 1426-1429), Berres (147, 1309-1353), Hu (146, 218-244; doi 10.1037/bul0000223), Rasch 2009 (Nat Neurosci 12, 396-397), Ataei (Sleep Med Rev 72, 101852), Züst (Curr Biol 29, 541-553; doi 10.1016/j.cub.2018.12.038), Le (Front Psychol 17, 1848504) đều có thật và khớp tên bài."
    review: dung
    nguon:
      - diekelmann2010
      - gais2006
      - rasch2007
      - rasch2009
      - berres2021
      - hu2020
      - ataei2023
      - zust2019
      - le2026
doi_chu:
  - cu: 'mô tả: "Giấc ngủ sóng chậm củng cố trí nhớ như thế nào — …"'
    moi: 'mô tả: "Giấc ngủ, nhất là giấc ngủ sóng chậm, có thể giúp củng cố trí nhớ như thế nào — …"'
    ly_do: 'n1: cơ chế còn là mô hình.'
  - cu: '"**An nhớ tốt hơn** … giấc ngủ sau khi học *chủ động* củng cố trí nhớ, còn thức trắng thì phá hỏng quá trình đó."'
    moi: '"**Nhiều khả năng An nhớ phần đã học tốt hơn** … người ngủ sau khi học nhớ lại nhiều hơn khi thức trắng, kể cả khi người thức trắng đã được ngủ bù …"'
    ly_do: 'n2: mạnh hơn bằng chứng.'
  - cu: (không có)
    moi: '"Thí nghiệm ấy không cho người thức dùng đêm để học thêm, nên phần ''Bình học thêm mấy tiếng'' chưa được kiểm tra trực tiếp."'
    ly_do: n3.
  - cu: '"Thực ra, khi ta chìm vào giấc ngủ sâu, não bước vào một ca làm việc khác: nó phát lại …"'
    moi: '"Theo mô hình được nhiều nhà nghiên cứu ủng hộ, khi ta chìm vào giấc ngủ sâu, … nó tái kích hoạt (''phát lại'') …"'
    ly_do: n4.
  - cu: '"REM — lúc ta mơ nhiều nhất"'
    moi: '"REM"'
    ly_do: 'n6: bỏ vế không cần nguồn.'
  - cu: '"tổng hợp hàng loạt bằng chứng"'
    moi: '"tổng hợp bằng chứng trên người và động vật gặm nhấm"'
    ly_do: n8.
  - cu: (không có)
    moi: '"Chính bài tổng quan lưu ý rằng việc tái phân phối này chưa được chứng minh trực tiếp."'
    ly_do: n12.
  - cu: '"các gen liên quan đến tính dẻo của não được kích hoạt, tạo điều kiện gia cố các kết nối synap"'
    moi: '"hoạt động của các gen liên quan đến tính dẻo của não tăng cục bộ, và điều này có thể tạo điều kiện gia cố các kết nối synap"'
    ly_do: n13.
  - cu: '"Học sinh trung học học các cặp từ vựng (tiếng Đức–tiếng Anh)."'
    moi: '"Người tham gia là học sinh trung học Mỹ, nói tiếng Anh và chưa biết tiếng Đức; họ học các danh sách 24 cặp từ vựng tiếng Anh–tiếng Đức (tối đa 10 phút mỗi danh sách)."'
    ly_do: n15, n16.
  - cu: '"mỗi học sinh học buổi tối rồi ngủ ngay trong một điều kiện, và học buổi sáng rồi thức ban ngày trong điều kiện còn lại; kiểm tra sau 24 và 36 giờ"'
    moi: '"ai cũng làm đủ bốn điều kiện: học lúc 8 giờ tối rồi ngủ trong khoảng 3 giờ sau đó, hoặc học lúc 8 giờ sáng rồi thức khoảng 15 giờ mới ngủ; kiểm tra lại sau 24 hoặc 36 giờ"'
    ly_do: n17, n18.
  - cu: '"nhóm thức trắng đã được ngủ bù một đêm trước khi kiểm tra"'
    moi: '"sáng hôm sau người thức trắng được về nhà ngủ bù (… 5,6 giờ ban ngày và 7,6 giờ đêm kế tiếp). Cả hai điều kiện được kiểm tra 48 giờ sau khi học"'
    ly_do: n19–n22.
  - cu: '"chứng tỏ vấn đề không phải là mệt mỏi lúc kiểm tra, mà là quá trình củng cố trí nhớ đã bị phá hỏng ngay trong đêm đầu tiên"'
    moi: '"các tác giả kết luận rằng mệt mỏi lúc kiểm tra không giải thích được khác biệt; điều này gợi ý rằng ảnh hưởng nằm ở quá trình củng cố … chứ không chỉ ở lúc truy xuất"'
    ly_do: n25.
  - cu: '"phụ thuộc hồi hải mã — trước đó, phần lớn bằng chứng về giấc ngủ và trí nhớ chỉ tập trung vào trí nhớ quy trình …, vốn ít liên quan đến hồi hải mã hơn"'
    moi: '"được xem là phụ thuộc hồi hải mã — trước đó, phần lớn các nghiên cứu gần đây … ở người tập trung vào trí nhớ quy trình …, được xem là không phụ thuộc hồi hải mã"'
    ly_do: n27.
  - cu: '"Đây là bằng chứng nhân quả mạnh mẽ"'
    moi: '"Các tác giả coi đây là bằng chứng thực nghiệm cho vai trò nhân quả … Mỗi thí nghiệm chỉ có 17–18 người, nên kết quả cần được đọc cùng các nghiên cứu khác"'
    ly_do: n34.
  - cu: :::vung-chac[giấc ngủ sóng chậm củng cố trí nhớ tường thuật] "… Đây là một trong những phát hiện được tái lập tốt nhất trong khoa học về giấc ngủ."
    moi: :::kha-vung[…] "Ngủ sau khi học giúp nhớ lại tốt hơn … g = 0,44 … g = 0,28 … Hu 2020 … g = 0,27 … Vì sao chỉ khá vững …"
    ly_do: 'n36: hạ Vững chắc xuống Khá vững; tóm tắt hộp tự đổi theo khung.'
  - cu: '"có tác dụng nhỏ nhưng ổn định (g = 0,27)"'
    moi: '"có tác dụng nhỏ (g = 0,27)"'
    ly_do: 'n38: bỏ "ổn định" (không có trong tóm tắt).'
  - cu: '"Bài tổng quan 2010 cho rằng REM đảm nhận bước củng cố synap tiếp theo"'
    moi: '"Bài tổng quan 2010 cho rằng REM có thể thuận lợi cho bước củng cố synap tiếp theo … bài tổng quan lưu ý các thuốc đó cũng có thể tác động trực tiếp lên tính dẻo synap và bù cho việc mất REM"'
    ly_do: n39, n40.
  - cu: khung :::bac-bo[thức trắng đêm ôn thi giúp nhớ bài hơn] "… nhóm thức trắng nhớ kém hơn hẳn … nó phá hỏng quá trình củng cố trí nhớ ngay trong đêm đó."
    moi: khung :::bac-bo[thức trắng đêm thay cho giấc ngủ giúp nhớ lại phần đã học tốt hơn] "… người tham gia nhớ lại ít từ hơn khi được ngủ … Berres và Erdfelder (2021) … Các nghiên cứu này không kiểm tra việc dùng đêm thức để học thêm"
    ly_do: 'n42, n43: thu hẹp cho đúng bằng chứng; tiêu đề đổi nên hộp tóm tắt đổi theo.'
  - cu: '"Qua nhiều đêm, ký ức dần trở nên độc lập với hồi hải mã — đó là lý do ký ức cũ khó mất hơn ký ức mới học. … hồi hải mã học nhanh nhưng dễ nhiễu, vỏ não học chậm nhưng ổn định, và giấc ngủ là cầu nối"'
    moi: '"Theo mô hình hai kho, hồi hải mã học nhanh và giữ thông tin tạm thời, vỏ não học chậm và lưu trữ dài hạn; việc chuyển kho diễn ra dần qua nhiều lần tái kích hoạt, và diễn ra lúc ngủ, khi não không ghi nhận thông tin mới … chưa được chứng minh trực tiếp."'
    ly_do: n44, n45.
  - cu: '"…(acetylcholine cao, sóng theta) tạo điều kiện gia cố các kết nối thần kinh ở vỏ não."'
    moi: '"… *có thể* tạo điều kiện gia cố các kết nối thần kinh ở vỏ não. Đây là phần còn nhiều tranh luận (xem khung ''Đang tranh cãi'')."'
    ly_do: n46.
  - cu: '"một ý tưởng bổ sung cho rằng trong SWS, não còn ''tỉa bớt'' các kết nối yếu, ít dùng đến"'
    moi: '"một ý tưởng khác cho rằng sóng chậm làm giảm đồng loạt cường độ các kết nối synap, các kết nối yếu bị loại bỏ … Bài tổng quan 2010 xem đây và củng cố hệ thống chủ động là hai giả thuyết không loại trừ nhau"'
    ly_do: n47, n48.
  - cu: '"Cả ba đều thống nhất ở một điểm: … không phải thời gian chết …, mà là ca làm việc thứ hai của nó"'
    moi: '"Cả ba đều cùng một hướng nhìn: … không chỉ là thời gian chết …, mà có thể là ca làm việc thứ hai của nó"'
    ly_do: n49.
  - cu: '"Áp dụng 1: … hãy học xong buổi tối rồi đi ngủ đúng giờ — giấc ngủ sẽ ''làm nốt phần việc còn lại''."'
    moi: '"… trong một thí nghiệm nhỏ (12 học sinh). … có thể học xong buổi tối rồi đi ngủ đúng giờ — giấc ngủ có thể giúp ''làm nốt phần việc còn lại''."'
    ly_do: n51.
  - cu: '"2. Đừng thức trắng đêm trước ngày thi :nhan[vung-chac] — … Một đêm ngủ đủ trước kỳ thi ''lợi'' hơn nhiều so với vài tiếng nhồi nhét thêm."'
    moi: '"2. … :nhan[kha-vung] { #2-dung-thuc-trang-dem-truoc-ngay-thi-vung-chac } — … Chưa có nghiên cứu nào ở đây so sánh trực tiếp việc dùng đêm thức để học thêm với việc ngủ đủ …"'
    ly_do: 'n52: hạ nhãn; giữ id cũ của tiêu đề.'
  - cu: (không có)
    moi: '"Nếu bạn thường xuyên khó ngủ hay mất ngủ kéo dài, hãy trao đổi với người có chuyên môn (hướng dẫn của NHS …); xem thêm trang Hỗ trợ."'
    ly_do: n55.
  - cu: '"việc ôn tập rải ra nhiều ngày (mỗi lần học xong đều được ngủ) hiệu quả hơn học dồn một lần rồi thi ngay."'
    moi: '"ôn tập rải ra nhiều ngày … là một lịch học hợp lý. … việc các đêm ngủ ở giữa góp phần vào lợi ích đó là giả thuyết hợp lý, chưa được tách riêng … khung này chỉ mang nhãn ''khá vững''."'
    ly_do: n58.
  - cu: '"được thực hiện trên học sinh, sinh viên ở Đức; bài tổng quan 2010 tổng hợp chủ yếu các nghiên cứu trong phòng thí nghiệm ở châu Âu và Mỹ"'
    moi: '"do các nhóm nghiên cứu ở Đức thực hiện, trên học sinh trung học Mỹ (Gais và cộng sự) và tình nguyện viên (Rasch và cộng sự, bài báo không nêu quốc tịch); bài tổng quan 2010 tổng hợp các nghiên cứu trên người và động vật gặm nhấm"'
    ly_do: 'n60: người tham gia Gais là học sinh Mỹ; bài tổng quan không giới hạn ở "phòng thí nghiệm châu Âu và Mỹ" (n8).'
  - cu: '"Chúng tôi chưa tìm thấy nghiên cứu tương tự trên học sinh, sinh viên Việt Nam."'
    moi: '"Tính đến 11/2026, chúng tôi chưa tìm thấy thí nghiệm nào kiểm tra việc ngủ sau khi học có giúp nhớ trên học sinh, sinh viên Việt Nam; chỉ thấy một khảo sát cắt ngang …"'
    ly_do: 'n61, n62: mốc thời gian, nêu khảo sát gần nhất.'
  - cu: '"nên kết luận chính nhiều khả năng đúng với mọi nền văn hóa"'
    moi: '"Chúng tôi suy luận (chưa được kiểm tra trực tiếp) rằng … kết luận chính có thể đúng với nhiều nền văn hóa"'
    ly_do: n63.
  - cu: '"nếu không có giấc ngủ để củng cố, phần lớn những gì ''nhồi'' thêm sẽ rơi rụng. Thí nghiệm năm 2006 chứng minh nhóm ngủ (học ít giờ hơn) mà nhớ nhiều hơn nhóm thức trắng."'
    moi: '"thí nghiệm năm 2006 thấy người thức trắng sau khi học (không học thêm) nhớ lại ít hơn khi họ được ngủ. Việc dùng đêm thức để học thêm chưa được thí nghiệm ấy kiểm tra."'
    ly_do: 'n64: sai về thiết kế (không có nhóm học thêm).'
  - cu: '"trong REM, não kích hoạt các gen liên quan đến tính dẻo của synap"'
    moi: '"trong REM, theo bài tổng quan 2010, hoạt động của các gen liên quan đến tính dẻo của synap tăng cục bộ"'
    ly_do: n65.
  - cu: '"ngủ rồi mơ — chuyện gì xảy ra"; "ngủ và ôn tập ngắt quãng giữ ký ức"; "củng cố trí nhớ chống lại đường cong quên"'
    moi: '"các lý thuyết về giấc mơ"; "ôn tập ngắt quãng và giấc ngủ giữa các buổi học"; "đường cong quên và vai trò của giấc ngủ"'
    ly_do: 'n69: mô tả khớp nội dung trang đích; "chống lại đường cong quên" là diễn giải mạnh.'
  - cu: 'quiz 1: phương án "Não xóa bớt ký ức để tiết kiệm năng lượng."; giải thích "gia cố kệ hàng trong môi trường acetylcholine cao là việc của REM"'
    moi: phương án "Não ngừng mọi hoạt động liên quan đến ký ức."; giải thích "… theo bài tổng quan, *có thể* là việc của REM"
    ly_do: q1.
  - cu: 'quiz 2: "nhóm thức trắng"; phương án "Vì thiếu người tham gia nên phải dùng lại nhóm cũ."; "chứng tỏ thiệt hại nằm ở quá trình củng cố … chứ không phải ở lúc truy xuất"'
    moi: '"người thức trắng"; phương án "Để người tham gia không biết mình đang ở điều kiện nào."; "các tác giả kết luận … gợi ý rằng ảnh hưởng nằm ở quá trình củng cố … chứ không chỉ ở lúc truy xuất"'
    ly_do: q2.
  - cu: 'quiz 3: "chứng minh điều gì?"; "nhắc trong REM hay lúc thức đều vô ích"'
    moi: '"cho thấy điều gì?"; "… đều không có tác dụng … (mỗi thí nghiệm chỉ có 17–18 người)"; đáp án đúng thêm "trí nhớ vị trí đã học"'
    ly_do: q3.
  - cu: 'quiz 4: "Bài tổng quan 2010 đề xuất REM đảm nhận bước củng cố synap"'
    moi: '"Bài tổng quan 2010 viết rằng REM có thể thuận lợi cho bước củng cố synap"'
    ly_do: q4.
  - cu: 'quiz 5: "Mỗi đêm ngủ là một ca củng cố trí nhớ. Học rải ra kết hợp ngủ đủ vừa tận dụng hiệu ứng ngắt quãng (xem Vì sao ta quên?), vừa tận dụng củng cố trong giấc ngủ."'
    moi: '"Học rải ra nhiều ngày tận dụng hiệu ứng ngắt quãng (xem Học dồn có nhớ lâu?), và ngủ đủ sau mỗi buổi học cho giấc ngủ cơ hội củng cố …; còn thức trắng thay cho giấc ngủ thì chưa thấy bằng chứng là có lợi …"'
    ly_do: q5.
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: '"Phân tích tổng hợp 91 thí nghiệm … có tác dụng nhỏ nhưng ổn định (g = 0,27)"'
    moi: '"… có tác dụng nhỏ (g = 0,27)"'
    ly_do: 'Review, n38: nguồn không nói "ổn định".'
  - cu: '"Nghiên cứu của Gais và cộng sự cùng phân tích tổng hợp về lợi ích của giấc ngủ cho thấy thức trắng không chỉ khiến bạn mệt mỏi lúc làm bài: người thức trắng còn nhớ lại phần đã học kém hơn người đã ngủ, kể cả sau khi ngủ bù."'
    moi: '"Thức trắng không chỉ khiến bạn mệt lúc làm bài. Trong thí nghiệm của Gais và cộng sự (14 học sinh), … kể cả khi đã ngủ bù trước lúc kiểm tra. Phân tích tổng hợp của Berres và Erdfelder (2021) cũng thấy người ngủ nhớ lại nhiều hơn người thức cùng khoảng thời gian."'
    ly_do: 'Review, n53: "kể cả sau khi ngủ bù" chỉ có ở Gais (lượt 2 qua-manh).'
