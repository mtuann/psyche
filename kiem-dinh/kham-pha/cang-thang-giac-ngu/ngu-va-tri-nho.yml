    ghi_chu: 'Chữ cũ: khung :::bac-bo[thức trắng đêm ôn thi giúp nhớ bài hơn], "nhóm thức trắng nhớ kém hơn hẳn … Thiếu ngủ không chỉ làm ta mệt lúc thi — nó phá hỏng quá trình củng cố trí nhớ ngay trong đêm đó." Chữ mới: tên khung thu hẹp "thức trắng đêm thay cho giấc ngủ giúp nhớ lại phần đã học tốt hơn" và nội dung nêu Berres 2021 và giới hạn. Lý do: bằng chứng không kiểm tra việc thức đêm để học thêm. Review (Claude Opus 5.5, 10/11/2026): dung. Nhãn Đã bị bác bỏ cho phát biểu hẹp "thức trắng thay cho giấc ngủ giúp nhớ phần đã học tốt hơn": phân tích tổng hợp 271 mẫu (Berres & Erdfelder 2021) và Gais 2006 cùng ngược chiều; không có kết quả nào ủng hộ. Khung tự nêu giới hạn (không kiểm việc học thêm). Đạt.'
