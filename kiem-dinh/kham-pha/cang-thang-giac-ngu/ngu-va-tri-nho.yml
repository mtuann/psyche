    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đều không có tác dụng". Chữ mới: thêm "17–18 người", "với trí nhớ vị trí". Lý do: nêu mẫu, và giới hạn ở nhiệm vụ trí nhớ vị trí. Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại toàn văn Rasch 2007 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus): thí nghiệm II n = 17 (không có mùi lúc học), III n = 17 (REM), IV n = 18 (lúc thức), đều không có tác dụng. Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/17347444" ]
    luot_2_ghi_chu: 'Tóm tắt xác nhận: mùi "ineffective during REM sleep or wakefulness or when the odor had been omitted during prior learning" (và không có tác dụng ở trí nhớ quy trình). Cỡ mẫu 17-18 người mỗi thí nghiệm không xác nhận được vì chưa mở toàn văn.'
