    trich: participants remembered 97.2 4.1% of the card pairs they had learned before sleep, but they remembered only 85.8 3.8% after the vehicle night
    vi_tri: tr. 1427
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhớ vị trí các cặp thẻ tốt hơn hẳn". Chữ mới: kèm số 97%/86%, 18 người. Lý do: số thật của bài (97,2 ± 4,1% và 85,8 ± 3,8%; P = 0,001). Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại toàn văn Rasch 2007 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus): "participants remembered 97.2 ± 4.1% of the card pairs ... only 85.8 ± 3.8% after the vehicle night (P = 0.001)", n = 18. Đúng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/17347444" ]
    luot_2_ghi_chu: "Không mở được toàn văn: không xác nhận được cỡ mẫu 18 và tỉ lệ 97% so với 86%."
