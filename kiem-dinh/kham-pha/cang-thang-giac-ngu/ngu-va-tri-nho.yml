    vi_tri: Box 2
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Mỗi đêm ngủ là một ca củng cố trí nhớ. Học rải ra kết hợp ngủ đủ vừa tận dụng hiệu ứng ngắt quãng (xem Vì sao ta quên?), vừa tận dụng củng cố trong giấc ngủ." Chữ mới: câu hiện tại, link tới Học dồn có nhớ lâu?. Lý do: hiệu ứng ngắt quãng ở bài Học dồn (Vững chắc, đã khóa); phần ngủ là giả thuyết hợp lý (n58); link đúng trang. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn.'
