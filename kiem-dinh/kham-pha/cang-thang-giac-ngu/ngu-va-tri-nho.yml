  - id: n69
    cau: 'Ba mục "Đọc thêm": Giấc mơ có ý nghĩa gì? (các lý thuyết về giấc mơ); Học dồn có nhớ lâu? (ôn tập ngắt quãng và giấc ngủ giữa các buổi học); Vì sao ta quên? (đường cong quên và vai trò của giấc ngủ).'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Đã kiểm trên trang: giac-mo.md bàn các lý thuyết giấc mơ; duong-cong-quen.md có mục :nhan "Ngủ đủ giấc giữa các buổi học" (dòng 114) và giả thuyết "trí nhớ cần thời gian ngấm"; vi-sao-ta-quen.md có khung :::tranh-cai "bước nhảy ở mốc 24 giờ và vai trò của giấc ngủ". Chữ cũ của mô tả ("ngủ rồi mơ — chuyện gì xảy ra"; "ngủ và ôn tập ngắt quãng giữ ký ức"; "củng cố trí nhớ chống lại đường cong quên") sửa cho khớp trang đích. Review (Claude Opus 5.5, 10/11/2026): dung. giac-mo.md tiêu đề "Giấc mơ có ý nghĩa gì?", bàn các lý thuyết; duong-cong-quen.md có mục "Ngủ đủ giấc giữa các buổi học" :nhan[kha-vung]; vi-sao-ta-quen.md có khung :::tranh-cai về bước nhảy 24 giờ và vai trò của giấc ngủ. Đúng.'
    review: dung
  - id: q1
    cau: 'Câu hỏi 1: theo Diekelmann và Born, trong SWS ký ức được tái kích hoạt ở hồi hải mã và tái phân phối dần về vỏ não; việc gia cố synap trong môi trường acetylcholine cao, theo bài tổng quan, có thể là việc của REM.'
    loai: dinh-nghia
    nguon:
      - diekelmann2010
    trich: slow oscillations, spindles and ripples - at minimum cholinergic activity - coordinate the re-activation and redistribution of hippocampus-dependent memories to neocortical sites, whereas during REM sleep
    vi_tri: tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: phương án sai "Não xóa bớt ký ức để tiết kiệm năng lượng." và giải thích "gia cố kệ hàng … là việc của REM". Chữ mới: phương án sai "Não ngừng mọi hoạt động liên quan đến ký ức." và "*có thể* là việc của REM". Lý do: phương án sai cũ gần giả thuyết cân bằng synap (n47) nên có thể bị coi là đúng; giải thích làm mềm theo n13. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn.'
