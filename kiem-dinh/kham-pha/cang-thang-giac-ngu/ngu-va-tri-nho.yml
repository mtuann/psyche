  vi_tri: tr. 1427
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Người tham gia học vị trí các cặp thẻ …". Chữ mới: "15 cặp thẻ" và "trong hai giai đoạn SWS đầu". Lý do: bổ sung số liệu thiết kế.'
- id: n30
  cau: Đêm đối chứng chỉ phảng phất không khí không mùi (thiết kế bắt chéo, mù đôi, cùng người làm cả hai đêm).
  loai: phat-hien
