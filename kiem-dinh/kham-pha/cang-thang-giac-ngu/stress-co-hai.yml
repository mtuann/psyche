  - id: q2
    cau: 'Câu hỏi 2: nghiên cứu 2 của Crum (2013): nhóm "có lợi" báo cáo ít triệu chứng tâm lý hơn và tự đánh giá hiệu suất cao hơn; nghiên cứu 2 không đo cortisol; các thước đo đều tự báo cáo; bài không báo cáo rằng lượng stress giảm.'
    loai: phat-hien
    nguon:
      - crum2013
    trich: participants in the enhancing condition reported improved psychological symptoms and better work performance
    vi_tri: Study 2, Discussion
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "> Lượng stress không hề giảm — chỉ niềm tin và phản ứng thay đổi. Và mọi kết quả đều là tự báo cáo." Chữ mới: "Nghiên cứu 2 không đo cortisol, … bài không báo cáo rằng lượng stress giảm." Lý do: câu cũ khẳng định điều bài không đo/nói; cortisol chỉ đo ở nghiên cứu 3. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
