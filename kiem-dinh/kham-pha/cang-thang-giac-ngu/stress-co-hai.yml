    cau: 'Mục Nguồn: Crum 2013, Keller 2012, Selye 1936, Crum 2023, Yeager 2022, Langrafe 2025, Liu 2019, Bosshard 2024, Nguyen 2023, Kivimäki 2012, Richardson 2012, Wendsche 2016, Szabo 2012, McEwen & Stellar 1993, Lazarus & Folkman 1984, OpenStax Psychology 2e (14.1, 14.2, 14.4) có tên, tạp chí, tập, trang, DOI đúng.'
    loai: lich-su
    ket_qua: da-sua
    ghi_chu: 'Đối chiếu Crossref (10/11/2026): tất cả khớp, trừ tên bài Bosshard (đã sửa, n47). Wendsche: Crossref ghi đăng 2017, tập 7 (2016) trên trang ghi 2016: chấp nhận theo tập. McEwen & Stellar 1993: Arch Intern Med 153(18), 2093–2101 (Europe PMC, DOI 10.1001/archinte.1993.00410180039004); trang chưa ghi DOI, nên thêm khi dọn nguồn. Lazarus & Folkman 1984 là sách, không kiểm Crossref. Review (Claude Opus 5.5, 10/11/2026): sai. Đối chiếu Crossref (10/11/2026): Selye 1936 thiếu số (3479); Yeager 2022 ghi "et al." với 9 tác giả và thiếu số (7919): ghi đủ tác giả (Europe PMC); Bosshard thiếu số (1); McEwen & Stellar chưa có DOI: thêm 10.1001/archinte.1993.00410180039004; Wendsche: Crossref ghi đăng 13/01/2017 (tập 7): đổi năm thành 2017 ở thân bài và mục Nguồn; Wu 2026 được nhắc ở thân bài nhưng thiếu trong mục Nguồn: thêm (Crossref, Europe PMC) và link ở thân bài. Các mục khác khớp.'
