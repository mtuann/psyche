nhan_dinh:
  - id: n1
    cau: 'Mô tả: hội chứng thích ứng chung của Selye (1936) và nghiên cứu stress mindset của Crum và cộng sự (2013).'
    loai: lich-su
    nguon:
      - selye1936
    trich: A syndrome produced by diverse nocuous agents
    vi_tri: Nature 138, 32 (1936)
    ket_qua: dung
    ghi_chu: 'Crossref 10.1038/138032a0: Nature 138(3479) tr. 32, 1936; Crum, Salovey & Achor: JPSP 104(4) 716–733 (2013).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/22845714", "https://sparq.stanford.edu/sites/g/files/sbiybj19021/files/media/file/crum_et_al._2013_-_rethinking_stress.pdf" ]
  - id: n2
    cau: 'Mô tả: liệu niềm tin về stress có thay đổi cách ta phản ứng với nó không.'
    loai: phat-hien
    nguon:
      - crum2013
    trich: stress mindsets can be altered by watching short, multimedia film clips
    vi_tri: tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "niềm tin về stress thay đổi phản ứng của cơ thể ra sao". Chữ mới: "liệu niềm tin về stress có thay đổi cách ta phản ứng với nó không". Lý do: bằng chứng về phản ứng cơ thể chưa nhất quán (n41–n44). Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://sparq.stanford.edu/sites/g/files/sbiybj19021/files/media/file/crum_et_al._2013_-_rethinking_stress.pdf" ]
    luot_2_ghi_chu: Câu mô tả câu hỏi của bài.
    review: dung
  - id: n3
    cau: 'Đáp án thu gọn: tim đập nhanh của An là phản ứng báo động bình thường; các nghiên cứu theo dõi dài hạn thấy mức căng thẳng cao (như căng thẳng trong công việc) đi kèm nguy cơ bệnh tim mạch cao hơn, và mô hình của Selye gợi ý điều đáng lo là căng thẳng kéo dài mà không có lúc phục hồi.'
    loai: phat-hien
    nguon:
      - os141
      - kivimaki2012
      - richardson2012
    trich: Prolonged stress ultimately results in exhaustion. [OpenStax 14.1] | the hazard ratio for job strain versus no job strain was 1·23 [Kivimäki 2012]
    vi_tri: OpenStax 14.1; tóm tắt Kivimäki 2012, Richardson 2012
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Nó chỉ thành vấn đề khi căng thẳng kéo dài mà không có lúc phục hồi". Chữ mới: "Điều nghiên cứu liên hệ với nguy cơ sức khỏe là căng thẳng kéo dài…". Lý do: các nghiên cứu là quan sát (n52); phần "không có lúc phục hồi" là diễn giải từ mô hình (xem n52). Review (Claude Opus 5.5, 10/11/2026): sai. Chữ "Điều nghiên cứu liên hệ với nguy cơ sức khỏe là căng thẳng kéo dài mà không có lúc phục hồi" gán cho nghiên cứu điều chúng không đo: Kivimäki 2012 và Richardson 2012 (tóm tắt) đo mức căng thẳng một lần lúc đầu, không đo thời gian kéo dài hay việc phục hồi (cùng lý do lượt 2 nêu ở n53). Chữ mới tách hai ý: nghiên cứu theo dõi thấy mức căng thẳng cao đi kèm nguy cơ tim mạch cao hơn; mô hình Selye gợi ý điều đáng lo là căng thẳng kéo dài không phục hồi.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/14-1-what-is-stress", "https://europepmc.org/article/MED/22981903", "https://europepmc.org/article/MED/8379800" ]
    review: sai
  - id: n4
    cau: 'Đáp án thu gọn: một số thử nghiệm cho thấy niềm tin "stress có thể giúp ích" thay đổi cách người ta cảm nhận và phản ứng với stress, nhưng bằng chứng về phản ứng của cơ thể chưa nhất quán; nó không phải phép màu chữa bệnh.'
    loai: phat-hien
    nguon:
      - liu2019
    trich: reappraisal interventions are effective in attenuating subjective responsivity to stress [...] did not outperform control groups on measures of physiological stress
    vi_tri: tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "nghiên cứu cho thấy nó thật sự làm thay đổi phản ứng của cơ thể". Chữ mới: "một số thử nghiệm cho thấy nó thay đổi cách người ta cảm nhận và phản ứng với stress, nhưng bằng chứng về phản ứng của cơ thể chưa nhất quán". Lý do: Liu 2019 không thấy khác biệt sinh lý. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://sparq.stanford.edu/sites/g/files/sbiybj19021/files/media/file/crum_et_al._2013_-_rethinking_stress.pdf", "https://europepmc.org/article/MED/37199967", "https://europepmc.org/article/MED/30811484" ]
    review: dung
  - id: n5
    cau: Link tới trang Hỗ trợ trong đáp án thu gọn ("Nếu bạn thấy mình giống Bình, xem trang Hỗ trợ").
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Đã kiểm: id ho-tro có trong src/data/trang.yml; câu chỉ dẫn, không chẩn đoán. Cần trang Hỗ trợ lên trước khi khóa. Ví dụ Bình (ba tháng làm việc đến khuya) là tình huống giả định (gia-dinh). Review (Claude Opus 5.5, 10/11/2026): dung. Link /psyche/ho-tro/ theo quy ước AGENTS.md và các trang đã khóa; ho-tro/index có trong trang.yml và khoa.json.'
    review: dung
  - id: n6
    cau: Năm 1936, Hans Selye ở Đại học McGill (Canada) nhận thấy dù gây hại cho chuột bằng cách nào, cơ thể chúng đều đáp lại bằng cùng một bộ triệu chứng.
    loai: lich-su
    nguon:
      - selye1936
    trich: Department of Biochemistry, McGill University, Montreal, Canada [...] EXPERIMENTS on rats show that if the organism is severely damaged by acute non-specific nocuous agents
    vi_tri: trang Nature 138, 32 (siêu dữ liệu tác giả; tóm tắt)
    ket_qua: dung
    ghi_chu: Toàn văn bài 1936 không mở được (chỉ xem trước); câu dựa vào tóm tắt và địa chỉ tác giả trên trang nhà xuất bản.
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/14-1-what-is-stress", "https://europepmc.org/article/MED/22845714" ]
    luot_2_ghi_chu: Năm 1936 theo Szabo; chỉ đọc tóm tắt và OpenStax, không mở thư gốc (có tường phí).
  - id: n7
    cau: Các tác nhân gây hại gồm nhiễm lạnh, phẫu thuật, vận động quá sức, hay tiêm đủ loại thuốc.
    loai: phat-hien
    nguon:
      - selye1936
    trich: exposure to cold, surgical injury, production of spinal shock (transcision of the cord), excessive muscular exercise, or intoxications with sublethal doses of diverse drugs
    vi_tri: Nature 138, 32, tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/14-1-what-is-stress" ]
    luot_2_ghi_chu: Mục "tiêm đủ loại thuốc" không có trong OpenStax; bản thư gốc của Selye có tường phí nên không mở; nhan đề "diverse nocuous agents" ủng hộ ý chung.
  - id: n8
    cau: 'Bộ triệu chứng chung: tuyến thượng thận phì đại, tuyến ức và hạch bạch huyết teo lại, loét hay xói mòn dạ dày.'
    loai: phat-hien
    nguon:
      - szabo2012
    trich: the triad of enlarged adrenal glands, lymph node and thymic atrophy, and gastric erosions/ulcers
    vi_tri: tóm tắt Szabo và cộng sự (2012) kể lại bài 1936
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "xuất huyết và loét dạ dày–ruột". Chữ mới: "loét hay xói mòn dạ dày". Lý do: Szabo 2012 mô tả "gastric erosions/ulcers" (dạ dày, không phải dạ dày–ruột); bài 1936 chỉ đọc được tóm tắt, nên ghi theo Szabo kể lại. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/22845714", "https://openstax.org/books/psychology-2e/pages/14-1-what-is-stress" ]
    review: dung
  - id: n9
    cau: 'Phản ứng của cơ thể không đặc hiệu: không phụ thuộc loại tác nhân mà là phản ứng chung.'
    loai: phat-hien
    nguon:
      - selye1936
    trich: the symptoms of which are independent of the nature of the damaging agent or the pharmacological type of the drug employed, and represent rather a response to damage as such
    vi_tri: tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/22845714", "https://doi.org/10.1038/138032a0" ]
    luot_2_ghi_chu: Chỉ đọc nhan đề, tóm tắt và tổng quan Szabo; thư gốc có tường phí.
  - id: n10
    cau: Selye định nghĩa stress là "phản ứng của cơ thể trước mọi đòi hỏi, dù đòi hỏi ấy gây ra hay dẫn đến điều dễ chịu hay khó chịu" (Selye, 1976, theo OpenStax).
    loai: dinh-nghia
    nguon:
      - os141
    trich: response of the body to any demand, whether it is caused by, or results in, pleasant or unpleasant conditions
    vi_tri: OpenStax Psychology 2e, 14.1 (trích Selye 1976, tr. 74)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "phản ứng không đặc hiệu của cơ thể trước mọi đòi hỏi đặt ra cho nó — kể cả đòi hỏi dễ chịu (như háo hức trước một chuyến đi)"; và câu "Từ stress ông mượn từ vật lý". Chữ mới: trích đúng bản OpenStax. Lý do: trích nguyên văn theo nguồn đã mở; câu mượn từ vật lý không kiểm được nên bỏ. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/14-1-what-is-stress" ]
    review: dung
  - id: n11
    cau: Cả những sự kiện vui như đám cưới hay kỳ nghỉ cũng đòi hỏi cơ thể thích nghi.
    loai: phat-hien
    nguon:
      - os142
    trich: Examples include death of a close family member, marriage, divorce, and moving [...] vacation (13 LCUs)
    vi_tri: OpenStax Psychology 2e, 14.2 (thang Holmes–Rahe)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "kể cả đòi hỏi dễ chịu (như háo hức trước một chuyến đi)". Chữ mới: "cả những sự kiện vui như đám cưới hay kỳ nghỉ cũng đòi hỏi cơ thể thích nghi". Lý do: OpenStax 14.2 đưa hôn nhân (50 LCU) và kỳ nghỉ (13 LCU) vào thang thay đổi cuộc sống, tức đòi hỏi thích nghi; "đòi hỏi cơ thể thích nghi" là diễn giải từ thang đo. Review (Claude Opus 5.5, 10/11/2026): dung. Chữ cuối trên trang khớp câu ghi ở hồ sơ và nguồn đã dẫn (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/14-1-what-is-stress" ]
    luot_2_ghi_chu: Ví dụ đám cưới, kỳ nghỉ là minh họa của trang, không có trong OpenStax.
    review: dung
  - id: n12
    cau: 'Hội chứng thích ứng chung gồm ba giai đoạn: báo động, kháng cự, kiệt sức.'
    loai: dinh-nghia
    nguon:
      - os141
    trich: 'consists of three stages: (1) alarm reaction, (2) stage of resistance, and (3) stage of exhaustion'
    vi_tri: OpenStax 14.1 (Selye 1936; 1976)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/14-1-what-is-stress" ]
  - id: n13
    cau: 'Báo động: tim đập nhanh, adrenaline tăng, tương tự phản ứng "chiến hay chạy" mà Walter Cannon đã mô tả trước đó.'
    loai: phat-hien
    nguon:
      - os141
    trich: Alarm reaction describes the body's immediate reaction upon facing a threatening situation or emergency, and it is roughly analogous to the fight-or-flight response described by Cannon.
    vi_tri: OpenStax 14.1
    ket_qua: dung
    ghi_chu: '"Tim đập nhanh, adrenaline tăng" là ví dụ minh họa của OpenStax cho phản ứng báo động.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/14-1-what-is-stress" ]
    luot_2_ghi_chu: Chi tiết adrenaline tăng không có trong đoạn đã đọc; ý chung đúng.
  - id: n14
