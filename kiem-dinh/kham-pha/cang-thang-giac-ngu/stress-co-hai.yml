- id: q2
  cau: 'Câu hỏi 2: nghiên cứu 2 của Crum (2013): nhóm "có lợi" báo cáo ít triệu chứng tâm lý hơn và tự đánh giá hiệu suất cao hơn; nghiên cứu 2 không đo cortisol; các thước đo đều tự báo cáo; bài không báo cáo rằng lượng stress giảm.'
  loai: phat-hien
  nguon:
