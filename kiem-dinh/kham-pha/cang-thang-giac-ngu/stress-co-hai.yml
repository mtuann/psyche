    cau: 'Khung "Khá vững: niềm tin về stress có thể thay đổi qua can thiệp ngắn".'
    loai: nhan
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Hai chương trình nghiên cứu (2013 và 2023) đều cho thấy … duy trì được ít nhất vài tuần. Giới hạn: người tham gia đều tự nguyện …". Chữ mới: nhiều nhóm và nước, mốc 4 tuần / 30 ngày / 6 tháng, giới hạn "chưa có tái lập lớn đăng ký trước". Lý do: cập nhật thêm thử nghiệm độc lập; "duy trì vài tuần" chỉ ở một số thử nghiệm. Review (Claude Opus 5.5, 10/11/2026): dung. Khá vững đạt: nhiều thử nghiệm có đối chứng của nhiều nhóm, nhiều nước (Crum 2013 toàn văn: SMM tăng ở nhóm có lợi; Crum 2023, Yeager 2022, Langrafe 2025, Wu 2026, Nguyen 2023 tóm tắt) cùng chiều; giới hạn đã nêu.'
    nhan: kha-vung
    co_so:
      - crum2013
      - crum2023
      - yeager2022
      - langrafe2025
      - nguyen2023
      - wu2026
      - liu2019
    ly_do: 'Nhiều thử nghiệm có đối chứng của nhiều nhóm, nhiều nước thấy niềm tin "stress có lợi" tăng sau can thiệp ngắn, nhưng chưa có phân tích tổng hợp riêng cho niềm tin, thang đo tự báo cáo, nhiều thử nghiệm nhỏ hay không ngẫu nhiên cấp cá nhân, và chưa thấy tái lập lớn có đăng ký trước: Khá vững.'
