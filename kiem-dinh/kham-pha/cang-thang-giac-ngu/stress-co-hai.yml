    cau: 'Khung "Đang tranh cãi: đổi niềm tin có giúp khỏe hơn và làm việc tốt hơn?".'
    loai: nhan
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Mới chỉ có một thử nghiệm can thiệp tại nơi làm việc (2013) và ba thử nghiệm với phiên bản cải tiến (2023) … tất cả các biến kết quả đều là tự báo cáo". Chữ mới: thêm các nhóm khác và tổng hợp, bỏ "tất cả … tự báo cáo". Lý do: Yeager 2022 và Langrafe 2025 có đo sinh lý. Review (Claude Opus 5.5, 10/11/2026): dung. Đang tranh cãi đạt: Liu 2019 (tóm tắt: chủ quan 0,429 [0,067; 0,791], sinh lý −0,084 [−0,349; 0,180], dị biệt lớn) và Bosshard 2024 (d = 0,23; SIE-only k = 6, d = 0,18, p = 0,22) khớp số trên trang; Yeager 2022 có cải thiện sinh lý nhưng là can thiệp kết hợp.'
    nhan: tranh-cai
    co_so:
      - crum2013
      - crum2023
