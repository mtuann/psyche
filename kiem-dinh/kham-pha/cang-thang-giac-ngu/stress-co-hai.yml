nhan_dinh:
- id: n1
  cau: 'Mô tả: hội chứng thích ứng chung của Selye (1936) và nghiên cứu stress mindset của Crum và cộng sự (2013).'
  loai: lich-su
  nguon:
  - selye1936
  trich: A syndrome produced by diverse nocuous agents
  vi_tri: Nature 138, 32 (1936)
  ket_qua: dung
  ghi_chu: 'Crossref 10.1038/138032a0: Nature 138(3479) tr. 32, 1936; Crum, Salovey & Achor: JPSP 104(4) 716–733 (2013).'
- id: n2
  cau: 'Mô tả: liệu niềm tin về stress có thay đổi cách ta phản ứng với nó không.'
  loai: phat-hien
  nguon:
  - crum2013
  trich: stress mindsets can be altered by watching short, multimedia film clips
  vi_tri: tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "niềm tin về stress thay đổi phản ứng của cơ thể ra sao". Chữ mới: "liệu niềm tin về stress có thay đổi cách ta phản ứng với nó không". Lý do: bằng chứng về phản ứng cơ thể chưa nhất quán (n41–n44).'
- id: n3
  cau: 'Đáp án thu gọn: tim đập nhanh của An là phản ứng báo động bình thường; điều nghiên cứu liên hệ với nguy cơ sức khỏe là căng thẳng kéo dài mà không có lúc phục hồi.'
  loai: phat-hien
  nguon:
  - os141
  trich: alarm reaction, (2) stage of resistance, and (3) stage of exhaustion
  vi_tri: OpenStax Psychology 2e, mục 14.1
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Nó chỉ thành vấn đề khi căng thẳng kéo dài mà không có lúc phục hồi". Chữ mới: "Điều nghiên cứu liên hệ với nguy cơ sức khỏe là căng thẳng kéo dài…". Lý do: các nghiên cứu là quan sát (n52); phần "không có lúc phục hồi" là diễn giải từ mô hình (xem n52).'
- id: n4
  cau: 'Đáp án thu gọn: một số thử nghiệm cho thấy niềm tin "stress có thể giúp ích" thay đổi cách người ta cảm nhận và phản ứng với stress, nhưng bằng chứng về phản ứng của cơ thể chưa nhất quán; nó không phải phép màu chữa bệnh.'
  loai: phat-hien
  nguon:
  - liu2019
  trich: reappraisal interventions are effective in attenuating subjective responsivity to stress [...] did not outperform control groups on measures of physiological stress
  vi_tri: tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "nghiên cứu cho thấy nó thật sự làm thay đổi phản ứng của cơ thể". Chữ mới: "một số thử nghiệm cho thấy nó thay đổi cách người ta cảm nhận và phản ứng với stress, nhưng bằng chứng về phản ứng của cơ thể chưa nhất quán". Lý do: Liu 2019 không thấy khác biệt sinh lý.'
- id: n5
  cau: Link tới trang Hỗ trợ trong đáp án thu gọn ("Nếu bạn thấy mình giống Bình, xem trang Hỗ trợ").
  loai: ve-site
  ket_qua: da-sua
  ghi_chu: 'Đã kiểm: id ho-tro có trong src/data/trang.yml; câu chỉ dẫn, không chẩn đoán. Cần trang Hỗ trợ lên trước khi khóa. Ví dụ Bình (ba tháng làm việc đến khuya) là tình huống giả định (gia-dinh).'
- id: n6
  cau: Năm 1936, Hans Selye ở Đại học McGill (Canada) nhận thấy dù gây hại cho chuột bằng cách nào, cơ thể chúng đều đáp lại bằng cùng một bộ triệu chứng.
  loai: lich-su
  nguon:
  - selye1936
  trich: Department of Biochemistry, McGill University, Montreal, Canada [...] EXPERIMENTS on rats show that if the organism is severely damaged by acute non-specific nocuous agents
  vi_tri: trang Nature 138, 32 (siêu dữ liệu tác giả; tóm tắt)
  ket_qua: dung
  ghi_chu: Toàn văn bài 1936 không mở được (chỉ xem trước); câu dựa vào tóm tắt và địa chỉ tác giả trên trang nhà xuất bản.
- id: n7
  cau: Các tác nhân gây hại gồm nhiễm lạnh, phẫu thuật, vận động quá sức, hay tiêm đủ loại thuốc.
  loai: phat-hien
  nguon:
  - selye1936
  trich: exposure to cold, surgical injury, production of spinal shock (transcision of the cord), excessive muscular exercise, or intoxications with sublethal doses of diverse drugs
  vi_tri: Nature 138, 32, tóm tắt
  ket_qua: dung
- id: n8
  cau: 'Bộ triệu chứng chung: tuyến thượng thận phì đại, tuyến ức và hạch bạch huyết teo lại, loét hay xói mòn dạ dày.'
  loai: phat-hien
  nguon:
  - szabo2012
  trich: the triad of enlarged adrenal glands, lymph node and thymic atrophy, and gastric erosions/ulcers
  vi_tri: tóm tắt Szabo và cộng sự (2012) kể lại bài 1936
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "xuất huyết và loét dạ dày–ruột". Chữ mới: "loét hay xói mòn dạ dày". Lý do: Szabo 2012 mô tả "gastric erosions/ulcers" (dạ dày, không phải dạ dày–ruột); bài 1936 chỉ đọc được tóm tắt, nên ghi theo Szabo kể lại.'
- id: n9
  cau: 'Phản ứng của cơ thể không đặc hiệu: không phụ thuộc loại tác nhân mà là phản ứng chung.'
  loai: phat-hien
  nguon:
  - selye1936
  trich: the symptoms of which are independent of the nature of the damaging agent or the pharmacological type of the drug employed, and represent rather a response to damage as such
  vi_tri: tóm tắt
  ket_qua: dung
- id: n10
  cau: Selye định nghĩa stress là "phản ứng của cơ thể trước mọi đòi hỏi, dù đòi hỏi ấy gây ra hay dẫn đến điều dễ chịu hay khó chịu" (Selye, 1976, theo OpenStax).
  loai: dinh-nghia
  nguon:
  - os141
  trich: response of the body to any demand, whether it is caused by, or results in, pleasant or unpleasant conditions
  vi_tri: OpenStax Psychology 2e, 14.1 (trích Selye 1976, tr. 74)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "phản ứng không đặc hiệu của cơ thể trước mọi đòi hỏi đặt ra cho nó — kể cả đòi hỏi dễ chịu (như háo hức trước một chuyến đi)"; và câu "Từ stress ông mượn từ vật lý". Chữ mới: trích đúng bản OpenStax. Lý do: trích nguyên văn theo nguồn đã mở; câu mượn từ vật lý không kiểm được nên bỏ.'
- id: n11
  cau: Cả những sự kiện vui như đám cưới hay kỳ nghỉ cũng đòi hỏi cơ thể thích nghi.
  loai: phat-hien
  nguon:
  - os142
  trich: Examples include death of a close family member, marriage, divorce, and moving [...] vacation (13 LCUs)
  vi_tri: OpenStax Psychology 2e, 14.2 (thang Holmes–Rahe)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "kể cả đòi hỏi dễ chịu (như háo hức trước một chuyến đi)". Chữ mới: "cả những sự kiện vui như đám cưới hay kỳ nghỉ cũng đòi hỏi cơ thể thích nghi". Lý do: OpenStax 14.2 đưa hôn nhân (50 LCU) và kỳ nghỉ (13 LCU) vào thang thay đổi cuộc sống, tức đòi hỏi thích nghi; "đòi hỏi cơ thể thích nghi" là diễn giải từ thang đo.'
- id: n12
  cau: 'Hội chứng thích ứng chung gồm ba giai đoạn: báo động, kháng cự, kiệt sức.'
  loai: dinh-nghia
  nguon:
  - os141
  trich: 'consists of three stages: (1) alarm reaction, (2) stage of resistance, and (3) stage of exhaustion'
  vi_tri: OpenStax 14.1 (Selye 1936; 1976)
  ket_qua: dung
- id: n13
  cau: 'Báo động: tim đập nhanh, adrenaline tăng, tương tự phản ứng "chiến hay chạy" mà Walter Cannon đã mô tả trước đó.'
  loai: phat-hien
  nguon:
  - os141
  trich: Alarm reaction describes the body's immediate reaction upon facing a threatening situation or emergency, and it is roughly analogous to the fight-or-flight response described by Cannon.
  vi_tri: OpenStax 14.1
  ket_qua: dung
  ghi_chu: '"Tim đập nhanh, adrenaline tăng" là ví dụ minh họa của OpenStax cho phản ứng báo động.'
- id: n14
  cau: 'Kháng cự: nếu tác nhân còn đó, cơ thể cố thích nghi; kiệt sức: nếu kéo dài quá lâu, nguồn lực cạn dần, chức năng suy giảm, bệnh tật dễ xuất hiện.'
  loai: phat-hien
  nguon:
  - os141
  trich: stage of exhaustion
  vi_tri: OpenStax 14.1
  ket_qua: da-lam-mem
  ghi_chu: 'Mô tả giai đoạn theo OpenStax. Chữ cũ của câu mô hình: "Mô hình này giải thích vì sao stress ngắn hạn … thường vô hại, thậm chí hữu ích". Chữ mới: "gợi ý rằng điều đáng lo là stress kéo dài…" (n15).'
- id: n15
  cau: Mô hình gợi ý rằng điều đáng lo là stress kéo dài không lối thoát, chứ không phải một đợt căng thẳng ngắn (như trước giờ thi).
  loai: phat-hien
  nguon:
  - os141
  trich: If the stress remains excessive, health may begin to erode as well
  vi_tri: OpenStax 14.1
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "giải thích vì sao stress ngắn hạn … thường vô hại, thậm chí hữu ích, còn stress kéo dài không lối thoát mới là vấn đề". Chữ mới: "gợi ý …". Lý do: mô hình GAS dựa trên chuột và tác nhân nặng; không "giải thích" cho người.'
- id: n16
  cau: Selye nghiên cứu trên chuột với các tác nhân gây hại nặng.
  loai: phat-hien
  nguon:
  - selye1936
  trich: if the organism is severely damaged by acute non-specific nocuous agents
  vi_tri: tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "các tác nhân vật lý cực đoan". Chữ mới: "các tác nhân gây hại nặng". Lý do: tác nhân gồm cả thuốc (n7).'
- id: n17
  cau: 'Hình "gas-curve": sơ đồ ba giai đoạn báo động, kháng cự, kiệt sức; "sơ đồ minh họa ước lệ, không theo tỉ lệ số liệu".'
  loai: cong-cu
  ket_qua: dung
  ghi_chu: 'Đã mở src/hinh/gas-curve.html: không có số liệu; chữ trong hình khớp n12–n14 và nói rõ là ước lệ. Hình không sai, không sửa.'
- id: n18
  cau: 'Bài "Rethinking stress: The role of mindsets in determining the stress response", Journal of Personality and Social Psychology, 104(4), 716–733 (Crum, Salovey & Achor, 2013), gồm ba nghiên cứu.'
  loai: lich-su
  nguon:
  - crum2013
  trich: This article describes 3 studies that explore the role of mindsets in the context of stress.
  vi_tri: tóm tắt
  ket_qua: dung
  ghi_chu: Siêu dữ liệu khớp Crossref 10.1037/a0031201.
- id: n19
  cau: 'Nghiên cứu 1: thang đo 8 câu Stress Mindset Measure đo niềm tin stress có lợi hay có hại, ở ba khía cạnh: sức khỏe, hiệu suất, học hỏi–phát triển; kiểm tra trên nhân viên một tổ chức tài chính quốc tế lớn.'
  loai: cong-cu
  nguon:
  - crum2013
  trich: an 8-item instrument, the Stress Mindset Measure (SMM), designed to assess the extent to which an individual believes that the effects of stress are either enhancing or debilitating
  vi_tri: 'tóm tắt; Study 1 (nhân viên tổ chức tài chính: mục Study 2 "the large international financial institution recruited in Study 1")'
  ket_qua: dung
  ghi_chu: Ba khía cạnh của câu hỏi (sức khỏe, hiệu suất, học hỏi) theo mô tả video ở Study 2; không kiểm riêng từng câu của thang.
- id: n20
  cau: 'Nghiên cứu 2: nhân viên được chia ngẫu nhiên thành ba nhóm: video "có lợi" (N = 163), "có hại" (N = 164), đối chứng không xem gì (N = 61).'
  loai: so-lieu
  nguon:
  - crum2013
  trich: participants were randomized into a "stress-is-enhancing" [...] a "stress-is-debilitating" [...] or a "control" condition
  vi_tri: Study 2, mục Method
  ket_qua: dung
- id: n21
  cau: Trong một tuần, mỗi người ở hai nhóm đầu xem ba video ngắn khoảng 3 phút (gửi qua email) về tác động của stress lên sức khỏe, hiệu suất và khả năng học hỏi.
  loai: so-lieu
  nguon:
  - crum2013
  trich: These videos were approximately 3 min in length [...] The three videos were delivered via e-mail in 2- to 3-day intervals.
  vi_tri: Study 2, mục Method
  ket_qua: dung
- id: n22
  cau: Vài ngày sau video cuối, họ làm lại các bài đo.
  loai: phat-hien
  nguon:
  - crum2013
  trich: days after the third stress mindset video, participants were invited to complete a set of follow-up measures
  vi_tri: Study 2
  ket_qua: dung
- id: n23
  cau: 'Niềm tin về stress thay đổi được: nhóm xem video "có lợi" chuyển sang tin stress có ích hơn, nhóm xem video "có hại" chuyển theo hướng ngược lại.'
  loai: phat-hien
  nguon:
  - crum2013
  trich: the SMM increased over time for those in the enhancing condition [...] it decreased over time for those in the debilitating condition, [...] and did not change for those in the control condition
  vi_tri: Study 2, Results
  ket_qua: dung
- id: n24
  cau: Nhóm "có lợi" báo cáo ít triệu chứng tâm lý hơn (thang MASQ), trong khi hai nhóm còn lại không thay đổi đáng kể.
  loai: phat-hien
  nguon:
  - crum2013
  trich: participants in the enhancing condition reported improved psychological symptoms and better work performance, whereas their counterparts in the control or debilitating conditions did not
  vi_tri: Study 2, Discussion
  ket_qua: dung
- id: n25
