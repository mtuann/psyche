    cau: 'Khung "Khá vững: mức căng thẳng cao, như căng thẳng trong công việc, đi kèm nguy cơ bệnh tim mạch vành cao hơn".'
    loai: nhan
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: ":::kha-vung[stress cực độ, kéo dài mà không được phục hồi thì có hại] … Ranh giới chính xác "bao nhiêu là quá nhiều" thì vẫn đang được làm rõ". Chữ mới: đổi tiêu đề và thêm hai phân tích tổng hợp, giới hạn. Lý do: khung cũ không có nguồn; các nghiên cứu đo mức căng thẳng chứ không đo "không phục hồi" (n3). Review (Claude Opus 5.5, 10/11/2026): sai. Theo n53: các phân tích tổng hợp đo mức căng thẳng tại một thời điểm, nên tiêu đề khung "stress mạn tính, kéo dài liên quan đến nguy cơ sức khỏe cao hơn" nói hơn dữ liệu. Nhãn Khá vững giữ (hai phân tích tổng hợp quan sát cùng chiều, có thiên lệch xuất bản). Chữ cũ tiêu đề: "stress mạn tính, kéo dài liên quan đến nguy cơ sức khỏe cao hơn"; chữ mới: "mức căng thẳng cao, như căng thẳng trong công việc, đi kèm nguy cơ bệnh tim mạch vành cao hơn"; giới hạn thêm "đo mức căng thẳng tại một thời điểm, không đo trực tiếp căng thẳng kéo dài bao lâu". Hộp Tóm tắt nhanh đổi theo.'
    nhan: kha-vung
