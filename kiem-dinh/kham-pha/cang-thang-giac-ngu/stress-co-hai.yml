- id: q4
  cau: 'Câu hỏi 4: theo mô hình GAS, stress trở nên nguy hiểm khi kéo dài đến giai đoạn kiệt sức, cơ thể không còn nguồn lực thích nghi; tim đập nhanh là giai đoạn báo động.'
