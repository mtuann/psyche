  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "> Lượng stress không hề giảm — chỉ niềm tin và phản ứng thay đổi. Và mọi kết quả đều là tự báo cáo." Chữ mới: "Nghiên cứu 2 không đo cortisol, … bài không báo cáo rằng lượng stress giảm." Lý do: câu cũ khẳng định điều bài không đo/nói; cortisol chỉ đo ở nghiên cứu 3.'
- id: q3
  cau: 'Câu hỏi 3: khẳng định "đổi niềm tin về stress giúp khỏe hơn" mang nhãn "Đang tranh cãi" vì kết quả chưa nhất quán (nhất là chỉ số sinh lý), nhiều kết quả tự báo cáo, hiệu ứng nhỏ, và tính đến 11/2026 chưa thấy tái lập lớn có đăng ký trước.'
