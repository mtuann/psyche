  ly_do: 'Penley 2002 (tổng hợp): đối phó tập trung vào vấn đề liên hệ dương với sức khỏe nói chung; Conway & Terry 1992: liên hệ với hiệu quả đối phó chỉ ở tình huống kiểm soát được; Kendall & Terry 2008: liên hệ dương với hoạt động vai trò. Có tổng hợp, nhưng hầu hết là tương quan, và vế ''chia nhỏ'' là kỹ thuật thực hành không có nguồn riêng: Khá vững, theo thước đo mục 4 (cùng chiều nhưng còn giới hạn).'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: nhãn Vững chắc; "đối phó tập trung vào vấn đề là lựa chọn hàng đầu". Chữ mới: Khá vững; "thường là lựa chọn hợp lý trước tiên". Lý do: "hàng đầu" mạnh hơn bằng chứng tương quan; Kendall 2008 thấy mặt trái dài hạn. Ví dụ ôn thi, lưu ý "bận rộn giả tạo" là minh họa/ lời khuyên thường thức của trang (gia-dinh), đã giữ.'
- id: n56
