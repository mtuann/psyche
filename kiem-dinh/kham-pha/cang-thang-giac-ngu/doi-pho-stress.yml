  ly_do: 'Đây là nửa của giả thuyết khớp nhau bị tranh cãi nhiều nhất: ủng hộ ở sự kiện lớn (Forsythe 1987) và một phần (Zakowski 2001), nhưng Conway 1992 không thấy đối phó cảm xúc thích ứng hơn khi kiểm soát thấp, và Kendall 2008 không thấy sự khớp. Penley 2002: trốn tránh, mong ước viển vông có liên hệ âm với sức khỏe. Khung gộp hai ý theo ý yếu hơn; theo thước đo mục 4: đang tranh cãi.'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: nhãn Khá vững; "Với việc không thay đổi được …, những cách sau thường thích ứng hơn việc cố sửa tình huống: chấp nhận thực tế, tìm ý nghĩa (dành thời gian chất lượng bên người thân), chia sẻ cảm xúc với người tin cậy, và chăm sóc cơ thể. Đây là đối phó cảm xúc lành mạnh — khác hẳn né tránh hay mong ước viển vông." Chữ mới: Đang tranh cãi; "một số nghiên cứu gợi ý … chẳng hạn chấp nhận thực tế"; bỏ "tìm ý nghĩa", "chia sẻ cảm xúc", "chăm sóc cơ thể" (không có nguồn đã mở; Penley 2002 thấy tìm hỗ trợ xã hội liên hệ âm). Tiêu đề mục cũng đổi: "chăm sóc cảm xúc một cách chủ động" -> "điều chỉnh phản ứng bên trong, nhưng đừng trốn tránh". Giữ ở mức giáo dục, không phải lời khuyên điều trị.'
- id: n57
  cau: 'Khung nhãn mục 4: ''Đánh giá lại sau mỗi vòng'' là khá vững; mỗi vài ngày hãy tự hỏi ''cách mình đang dùng có giúp gì không? tình hình đã khác chưa?''; điều này gần với thành phần ''nhạy với phản hồi'' và với ý đối phó thay đổi theo đánh giá liên tục trong mô hình của Lazarus và Folkman.'
