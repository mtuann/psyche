  ly_do: 'Có tổng hợp Cheng 2014 (k = 329) liên hệ dương, nhỏ đến vừa, giữa linh hoạt đối phó và thích ứng; ''nhạy với phản hồi'' là một thành phần đề xuất của Bonanno & Burton 2013 (tổng quan khái niệm), chưa có tái lập lớn hay thử nghiệm đối chứng cho lời khuyên cụ thể ''mỗi vài ngày tự hỏi''. Theo thước đo mục 4: Khá vững.'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: nhãn Vững chắc; "Đây chính là thành phần nhạy với phản hồi … và cũng là vòng reappraisal trong mô hình gốc". Chữ mới: Khá vững; "Đây gần với … và với ý rằng đối phó thay đổi theo đánh giá liên tục". Lý do: "chính là" mạnh; thuật ngữ reappraisal không kiểm được trong nguồn đã mở. "Mỗi vài ngày" là lời khuyên thực hành của trang, không có số liệu riêng.'
- id: n58
  cau: 'Khung nhãn mục 5: ''Xây vốn nhiều cách, đừng chỉ một chiêu'' là khá vững; người chỉ biết một cách đối phó có thể lúng túng khi gặp tình huống không hợp; hãy mở rộng kỹ năng giải quyết vấn đề và kỹ năng xoa dịu cảm xúc.'
