  ly_do: 'Lời khuyên đời thường dựa trên ý ''kiểm soát được hay không'' điều tiết hiệu quả đối phó: Penley 2002 (tổng hợp) thấy mức kiểm soát được điều tiết nhiều liên hệ giữa đối phó và sức khỏe; Zakowski 2001: kiểm soát cảm nhận dự báo kiểu đối phó. Kiểm tra trực tiếp sự khớp lẫn lộn (Kendall 2008). Gộp hai ý (đánh giá kiểm soát được, dùng nó để chọn cách) theo ý yếu hơn: Khá vững. Nhãn xét theo thước đo mục 4.'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: nhãn Vững chắc; "là la bàn cho mọi bước tiếp theo, đúng như giả thuyết khớp nhau gợi ý". Chữ mới: Khá vững; "có thể là la bàn cho các bước tiếp theo, … (với bằng chứng còn lẫn lộn)". Lý do: gắn với giả thuyết khớp nhau đang tranh cãi.'
