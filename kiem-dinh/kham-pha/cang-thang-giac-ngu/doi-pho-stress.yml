  trich: The system loops between states pa and sa for a while [Finkel 2025, tr. 6]; responsiveness to feedback [Bonanno & Burton 2013, tóm tắt]
  vi_tri: Finkel 2025, mục 4
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Và vòng lặp không dừng ở đó: sau khi đối phó, ta đánh giá lại (reappraisal) … rồi điều chỉnh tiếp." Chữ mới: bỏ thuật ngữ "(reappraisal)" ở đây, nói "ta có thể đánh giá lại", gắn với mô hình đánh giá liên tục. Lý do: các nguồn đã mở không có thuật ngữ reappraisal như một bước của mô hình gốc; (positive reappraisal là một dạng đối phó khác, Folkman 1986).'
- id: n20
  cau: Đối phó được xem chủ yếu là một quá trình động, chứ không chỉ là một 'tính cách' cố định.
  loai: phat-hien
  nguon:
