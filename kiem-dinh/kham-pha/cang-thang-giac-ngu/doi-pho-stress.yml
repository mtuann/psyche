  ghi_chu: 'Chữ cũ: "…giải thích vì sao cùng một chiến lược cho kết quả khác nhau ở những người khác nhau." Chữ mới: "được đề xuất để giải thích … có thể cho kết quả khác nhau". Lý do: ba thành phần là khung đề xuất để nghiên cứu, không phải giải thích đã được chứng minh. Chỉ có tóm tắt.'
