nhan_dinh:
- id: n1
  cau: 'Mô tả: Lazarus và Folkman (1984) đề xuất rằng hiệu quả của cách đối phó phụ thuộc vào tình huống; đối phó tập trung vào vấn đề được cho là hợp với việc thay đổi được, đối phó cảm xúc hợp với việc không thay đổi được.'
  loai: phat-hien
  nguon:
  - kendall2008
  - zakowski2001
  - forsythe1987
  trich: The hypothesis suggests that the nature and success of specific coping strategies will be associated with the controllability of the event. If an event is relatively uncontrollable, then emotion-focused or perception-focused coping may be more effective than problem-focused coping. In contrast, a controllable event may be best managed through problem-focused coping. [Kendall & Terry 2008, tóm tắt, nói đây là giả thuyết rút từ lý thuyết Lazarus & Folkman 1984]
  vi_tri: Kendall & Terry 2008, tóm tắt; Zakowski 2001, tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ (mô tả): "Lazarus và Folkman (1984) chỉ ra rằng không có cách đối phó stress nào tốt cho mọi tình huống — đối phó tập trung vào vấn đề hợp với việc thay đổi được, đối phó cảm xúc hợp với việc không thay đổi được. Linh hoạt mới là chìa khóa." Chữ mới: "…đề xuất rằng hiệu quả… phụ thuộc vào tình huống… Bằng chứng cho sự khớp này còn lẫn lộn, và tính linh hoạt được xem là hướng hứa hẹn hơn." Lý do: "chỉ ra" và "Linh hoạt mới là chìa khóa" mạnh hơn bằng chứng (Kendall 2008 không ủng hộ, Conway 1992 và Zakowski 2001 ủng hộ một phần).'
- id: n2
  cau: Bằng chứng cho sự khớp giữa cách đối phó và tình huống còn lẫn lộn, và tính linh hoạt được xem là hướng hứa hẹn hơn (mô tả).
  loai: phat-hien
  nguon:
  - kendall2008
  - conway1992
  - zakowski2001
  - forsythe1987
  - cheng2014
  trich: No support was found for the Goodness-of-Fit model, either in the short term or the long term. [Kendall & Terry]; provided some support for these hypotheses [Conway & Terry]; the goodness-of-fit hypothesis was partly confirmed [Zakowski et al.]; Studies adopting the perceived ability or strategy-situation fit conceptualization yielded moderate effect sizes [Cheng et al.]
  vi_tri: tóm tắt của từng bài
  ket_qua: dung
  ghi_chu: Khớp nhãn tranh-cai ở khung 'Mức độ chắc chắn'. 'Hướng hứa hẹn' = ý kiến của trang, dựa vào Cheng 2014 (k = 329, r = 0,23).
- id: n3
  cau: Hai người (Lan, Minh) là ví dụ giả định của chúng tôi.
  loai: ve-site
  review: dung
  ket_qua: dung
  ghi_chu: 'gia-dinh: Lan và Minh là ví dụ giả định, đã ghi rõ trên trang (''ví dụ giả định của chúng tôi''). Nội dung các ví dụ không trái với nhận định nào của trang. Đã kiểm trên trang.'
- id: n4
  cau: Câu hỏi 'Ai đang đối phó đúng?' đặt bẫy, vì giả định có một đáp án đúng cho mọi tình huống.
  loai: loi-khuyen
  nguon:
  - cheng2014
  - penley2002
  trich: type of health outcome ... and situational characteristics (i.e., stressor type, controllability, and duration) moderated many of the overall associations. [Penley 2002]
  vi_tri: Penley 2002, tóm tắt
  ket_qua: dung
  ghi_chu: Ý nhận xét của trang, cùng ý với khung kha-vung n29 (không có chiến lược tốt cho mọi tình huống).
- id: n5
  cau: Lan dùng cách đối phó tập trung vào cảm xúc cho một vấn đề thay đổi được (kỳ thi, càng ôn càng cải thiện được); Minh dùng cách tập trung vào vấn đề cho một việc không thay đổi được (bệnh không thể chữa khỏi).
  loai: phat-hien
  nguon:
  - folkman1986
  trich: 'Coping has two major functions: dealing with the problem that is causing the distress (problem-focused coping) and regulating emotion (emotion-focused coping).'
  vi_tri: Folkman 1986, tr. 572
  ket_qua: dung
  ghi_chu: 'gia-dinh: mô tả phân loại ví dụ giả định theo định nghĩa hai họ đối phó (n9, n10); không phải điều nghiên cứu nào đã thấy. Đã kiểm trên trang. Chữ ''bệnh nan y'' giữ ở mức giáo dục, không phải lời khuyên điều trị.'
- id: n6
  cau: Theo giả thuyết khớp nhau, Lan và Minh dùng cách đối phó lệch với tình huống, và lệch pha như vậy có thể làm họ kiệt sức hơn.
  loai: loi-khuyen
  nguon:
  - forsythe1987
  trich: symptomatology was high when there was a poor fit between appraisals and coping (e.g., trying to change a stressor that was appraised as uncontrollable)
  vi_tri: Forsythe & Compas 1987, tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Cả hai đều đang dùng sai vũ khí cho trận địa của mình — và cả hai đều sẽ kiệt sức." Chữ mới: "Theo giả thuyết khớp nhau, cả hai đang dùng cách đối phó lệch với tình huống của mình — và lệch pha như vậy có thể làm họ kiệt sức hơn." Lý do: chắc chắn ("sẽ kiệt sức") mạnh hơn bằng chứng (Forsythe & Compas chỉ thấy triệu chứng cao hơn với sự kiện lớn, không thấy ở chuyện hằng ngày; Kendall & Terry không xác nhận); "kiệt sức" không phải kết quả đo.'
- id: n7
  cau: Trong đời thực ranh giới giữa việc thay đổi được và không thay đổi được thường mờ; chăm sóc giảm nhẹ cho cha vẫn là điều Minh có thể làm.
  loai: phat-hien
  nguon:
  - folkman1986
  trich: situational appraisals of control may be more variable than stable
  vi_tri: 'Folkman 1986, tr. 572 (tóm lược các nghiên cứu trước); bảng 2: ''Could change'' có tự tương quan thấp'
  ket_qua: dung
  ghi_chu: 'gia-dinh: phần về Minh là ví dụ giả định; phần ''ranh giới thường mờ'' dựa vào việc đánh giá kiểm soát biến động giữa các tình huống (Folkman 1986). Mức vừa phải (''thường mờ'' là suy ra từ biến động, không phải kết quả đo trực tiếp).'
- id: n8
  cau: 'Đáp án của giả thuyết khớp nhau: điều quan trọng là sự khớp nhau giữa cách đối phó và bản chất tình huống; đây là giả thuyết có bằng chứng lẫn lộn.'
  loai: phat-hien
  nguon:
  - forsythe1987
  - kendall2008
  - conway1992
  - zakowski2001
  trich: Results were generally consistent with cognitive-transactional models of stress and coping. [Forsythe & Compas]; No support was found for the Goodness-of-Fit model [Kendall & Terry]
  vi_tri: tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đáp án của tâm lý học hiện đại: không có cách nào tốt cho mọi tình huống. Cái đúng là sự khớp nhau giữa cách đối phó và bản chất của tình huống." Chữ mới: "Đáp án của giả thuyết khớp nhau: … Nhưng đây là một giả thuyết có bằng chứng lẫn lộn…" Lý do: "đáp án của tâm lý học hiện đại" và "cái đúng là" khẳng định chắc điều mà nhãn của chính trang là tranh cãi.'
- id: n9
  cau: Một điểm xuất phát của lý thuyết đánh giá nhận thức về stress là nhận xét rằng cùng một sự việc, mỗi người phản ứng một khác.
  loai: lich-su
  nguon:
  - finkel2025
  - lazarus1984
  trich: These definitions fail to explain the discrepancies in response between persons to the same stimulus (p.19).
  vi_tri: Finkel và cộng sự 2025, mục 3, kể lại Lazarus & Folkman 1984, tr. 19 (theo X kể lại)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Điểm khởi đầu của mọi lý thuyết hiện đại về stress là một phát hiện đơn giản: cùng một sự việc, người thì sụp đổ, người thì vượt qua." Chữ mới: "Một điểm xuất phát của lý thuyết đánh giá nhận thức về stress là nhận xét: cùng một sự việc, mỗi người phản ứng một khác." Lý do: "mọi lý thuyết hiện đại" và "phát hiện" không kiểm được; nguồn kể lại chỉ nói định nghĩa stress cũ không giải thích được khác biệt giữa người với người. Theo Finkel 2025 kể lại, không đọc sách gốc.'
- id: n10
  cau: Lazarus và Folkman cho rằng một phần câu trả lời nằm ở đánh giá (appraisal), cách mỗi người diễn giải tình huống, chứ không chỉ ở bản thân sự việc.
  loai: lich-su
  nguon:
  - folkman1986
  - finkel2025
  trich: The theory identifies two processes, cognitive appraisal and coping, as critical mediators of stressful person-environment relationships and their immediate and long-term outcomes.
  vi_tri: Folkman 1986, tr. 572
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "câu trả lời nằm ở đánh giá … chứ không nằm ở bản thân sự việc". Chữ mới: "một phần câu trả lời … chứ không chỉ ở bản thân sự việc". Lý do: nguồn nói đánh giá và đối phó là "khâu trung gian then chốt", không nói sự việc không đóng vai trò.'
- id: n11
  cau: 'Mô hình gồm hai bước đánh giá đan xen nhau: đánh giá ban đầu (primary) và đánh giá thứ cấp (secondary).'
  loai: dinh-nghia
  nguon:
  - folkman1986
  - finkel2025
  trich: 'There are two kinds of cognitive appraisal: primary and secondary.'
  vi_tri: 'Folkman 1986, tr. 572; Finkel 2025: ''cannot be considered as separate'' (L&F 1984, tr. 43, theo X kể lại)'
  ket_qua: dung
- id: n12
  cau: 'Đánh giá ban đầu: ''chuyện này có ảnh hưởng gì đến mình không?''; kỳ thi có thể bị đánh giá là mối đe dọa, điều có lợi, hoặc chuyện chẳng đáng bận tâm.'
  loai: dinh-nghia
  nguon:
  - folkman1986
  - finkel2025
  trich: In primary appraisal, the person evaluates whether he or she has anything at stake in this encounter. [Folkman 1986]; whether a particular stimulus is beneficial, irrelevant or stressful (p.32). [Finkel 2025, kể lại L&F 1984]
  vi_tri: Folkman 1986, tr. 572; Finkel 2025, mục 3
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Chuyện này có đe dọa gì đến mình không?… Một kỳ thi có thể là mối đe dọa, là thử thách ("cơ hội chứng tỏ bản thân"), hoặc là chuyện chẳng đáng bận tâm." Chữ mới: "…có ảnh hưởng gì đến mình không?… mối đe dọa, điều có lợi, hoặc chuyện chẳng đáng bận tâm." Lý do: nguồn đã mở nói ba loại kết quả đánh giá là có lợi, không liên quan, gây stress; "thử thách" (challenge) không có trong nguồn đọc được; ví dụ kỳ thi là minh họa của trang.'
- id: n13
  cau: 'Đánh giá thứ cấp: ''mình có thể làm được gì? việc này có thay đổi được không?''; cân nhắc thay đổi tình huống, chấp nhận nó, tìm thêm thông tin hay kìm lại chưa hành động.'
  loai: dinh-nghia
  nguon:
  - folkman1986
  trich: In secondary appraisal the person evaluates what, if anything, can be done to overcome or prevent harm or to improve the prospects for benefit. Various coping options are evaluated, such as changing the situation, accepting it, seeking more information, or holding back from acting impulsively.
  vi_tri: Folkman 1986, tr. 572
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Mình có nguồn lực gì? Việc này có thay đổi được không?" Chữ mới: "Mình có thể làm được gì? Việc này có thay đổi được không?" cùng danh sách các lựa chọn. Lý do: nguồn nói đánh giá thứ cấp là đánh giá các lựa chọn đối phó, không nhắc "nguồn lực" như câu hỏi riêng.'
- id: n14
  cau: Đối phó (coping) là những nỗ lực nhận thức và hành vi liên tục thay đổi nhằm quản lý các đòi hỏi được đánh giá là vượt quá nguồn lực của bản thân.
  loai: dinh-nghia
  nguon:
  - forsythe1987
  - finkel2025
  - folkman1986
  trich: constantly changing cognitive and behavioral efforts to manage specific external and or internal demands that are appraised as taxing or exceeding the resources of the person (p. 141)
  vi_tri: Forsythe & Compas 1987, tr. 474, trích Lazarus & Folkman 1984, tr. 141; Finkel 2025 trích cùng câu (theo X kể lại). Câu 'quiz 1' và đáp án đúng của câu hỏi 1 trùng nhận định này
  ket_qua: dung
  ghi_chu: Định nghĩa nguyên văn qua hai bài đã mở (không mở được sách gốc). 'taxing or exceeding' dịch 'vượt quá'.
- id: n15
  cau: 'Hai họ chiến lược đối phó: tập trung vào vấn đề (problem-focused) và tập trung vào cảm xúc (emotion-focused).'
  loai: dinh-nghia
  nguon:
  - folkman1986
  trich: 'Coping has two major functions: dealing with the problem that is causing the distress (problem-focused coping) and regulating emotion (emotion-focused coping).'
  vi_tri: Folkman 1986, tr. 572
  ket_qua: dung
- id: n16
  cau: Đối phó tập trung vào vấn đề tấn công trực tiếp vào nguồn stress (ví dụ lập kế hoạch ôn thi, thương lượng lại deadline, tìm thông tin).
  loai: dinh-nghia
  nguon:
  - folkman1986
  trich: problem-focused forms of coping include aggressive interpersonal efforts to alter the situation, as well as cool, rational, deliberate efforts to problem solve
  vi_tri: Folkman 1986, tr. 572
  ket_qua: dung
  ghi_chu: Ví dụ ôn thi, thương lượng deadline là minh họa của trang (gia-dinh), cùng loại với 'planful problem solving'.
- id: n17
  cau: Đối phó tập trung vào cảm xúc điều chỉnh phản ứng cảm xúc (ví dụ tìm sự hỗ trợ, nhìn nhận lại theo hướng tích cực, giữ khoảng cách, tạm thời phân tâm).
  loai: dinh-nghia
  nguon:
  - folkman1986
  trich: emotion-focused forms of coping include distancing, self-controlling, seeking social support, escape-avoidance, accepting responsibility, and positive reappraisal
  vi_tri: Folkman 1986, tr. 572
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "xoa dịu phản ứng cảm xúc: tìm sự an ủi, chấp nhận, tìm ý nghĩa, tạm thời phân tâm." Chữ mới: "điều chỉnh phản ứng cảm xúc — ví dụ tìm sự hỗ trợ, nhìn nhận lại theo hướng tích cực, giữ khoảng cách, tạm thời phân tâm." Lý do: khớp danh sách các dạng của Folkman 1986 (seeking social support, positive reappraisal, distancing); "tìm ý nghĩa" gần positive reappraisal nhưng không giống hẳn; "chấp nhận" bỏ vì nguồn xếp accepting responsibility (nhận trách nhiệm), không phải chấp nhận thực tế.'
- id: n18
