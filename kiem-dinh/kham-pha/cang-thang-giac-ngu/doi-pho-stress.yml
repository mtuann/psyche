  ghi_chu: Rút ra của trang từ quan hệ hai chiều; giữ nguyên, ở mức cách hình dung, không có số liệu.
- id: n26
  cau: Nghiên cứu Folkman và cộng sự (1986) trên 150 người trưởng thành trong cộng đồng (75 cặp vợ chồng); mỗi người kể về sự việc căng thẳng nhất của tuần vừa qua trong năm lần phỏng vấn cách nhau một tháng.
  loai: so-lieu
  nguon:
  - folkman1986
  trich: a sample of 150 community-residing adults ... five different stressful situations [tóm tắt]; a final sample of 75 couples ... Subjects were interviewed in their homes once a month for 6 months ... The data reported in this article were gathered during the second through sixth interviews.
  vi_tri: Tóm tắt; Method, tr. 573
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "được theo dõi qua 5 tình huống stress khác nhau trong đời sống hằng ngày". Chữ mới: thêm 75 cặp vợ chồng, sự việc căng thẳng nhất của tuần vừa qua, năm lần phỏng vấn cách nhau một tháng. Lý do: chữ cũ không sai nhưng thiếu cách thu thập; bổ sung từ phần Method. Nhóm gồm cả chồng và vợ (vợ tuổi 35–45).'
- id: n27
  cau: Các quá trình đánh giá và đối phó (gộp qua năm tình huống) cùng các đặc điểm tính cách giải thích được một phần đáng kể các triệu chứng tâm lý, nhưng không giải thích được đáng kể tình trạng sức khỏe thể chất.
  loai: phat-hien
  nguon:
  - folkman1986
  trich: The variables did not explain a significant amount of the variance in somatic health status, but they did explain a significant amount of the variance in psychological symptoms.
  vi_tri: Tóm tắt; Results, tr. 575 (R² = .43)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "các quá trình đánh giá và đối phó giải thích được một phần đáng kể các triệu chứng tâm lý". Chữ mới thêm "cùng các đặc điểm tính cách" và vế "không giải thích được đáng kể sức khỏe thể chất". Lý do: kết quả gộp cả tính cách (mastery, trust); bỏ vế sức khỏe thể chất là bỏ sót kết quả của bài.'
- id: n28
  cau: Đánh giá và đối phó biến động từ tình huống này sang tình huống khác nhiều hơn là ổn định.
  loai: phat-hien
  nguon:
  - folkman1986
  trich: Our research suggests that on the whole these processes tend to be more variable than stable
  vi_tri: 'Folkman 1986, tr. 578; tóm tắt: ''Certain processes (e.g., secondary appraisal) were highly variable, whereas others (e.g., emotion-focused forms of coping) were moderately stable'''
  ket_qua: dung
  ghi_chu: Câu mới thêm trong đợt này (không có ở bản cũ).
- id: n29
  cau: Các tác giả nhấn mạnh rằng không nên coi một dạng đối phó là tốt hay xấu mà không xét bối cảnh dùng nó; hiệu quả của một chiến lược có thể tùy thuộc vào tình huống, một ý tưởng sau này được kiểm chứng trực tiếp ở các nghiên cứu về sự khớp nhau.
  loai: phat-hien
  nguon:
  - folkman1986
  trich: it is important not to value a particular form of coping without reference to the context in which it is used
  vi_tri: Folkman 1986, tr. 578
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Quan trọng hơn, nhóm tác giả đề xuất ý tưởng nền tảng cho cả hướng nghiên cứu sau này: hiệu quả của một chiến lược đối phó phụ thuộc vào sự đánh giá tình huống — tức là cùng một chiến lược có thể tốt trong bối cảnh này nhưng tệ trong bối cảnh khác." Chữ mới: "nhấn mạnh rằng không nên coi… mà không xét bối cảnh… hiệu quả … có thể tùy thuộc vào tình huống, một ý tưởng sau này được kiểm chứng …". Lý do: bài chỉ là lời thận trọng ở phần Discussion, không phải một đề xuất kiểm định "phụ thuộc vào sự đánh giá tình huống"; bài không kiểm tra sự khớp. Cũng sửa tiêu đề mục: "hiệu quả tùy thuộc vào đánh giá" -> "đánh giá và đối phó qua nhiều tình huống".'
- id: n30
  cau: 'Tiêu đề mục: Folkman, Lazarus, Gruen và DeLongis (1986): đánh giá và đối phó qua nhiều tình huống.'
  loai: ve-site
  review: dung
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: ''(1986): hiệu quả tùy thuộc vào đánh giá''. Đã kiểm trên trang: không có link nào tới id cũ của mục này (grep ''doi-pho-stress#'' trong src: không có). Phần nội dung của mục xem n26–n29.'
- id: n31
  cau: Forsythe và Compas kiểm chứng giả thuyết khớp nhau trên 84 sinh viên đại học (tuổi trung bình 19).
  loai: so-lieu
  nguon:
  - forsythe1987
  trich: Subjects were 84 college students (32 male and 52 female) with a mean age of 19 years enrolled in an introductory psychology course.
  vi_tri: Method, Subjects, tr. 475
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "trên 84 sinh viên" (cùng câu với n32–n33). Chữ mới thêm "đại học, tuổi trung bình 19". Số 84 đúng.'
- id: n32
  cau: Mỗi người kể về sự kiện lớn gây khổ sở nhất trong 6 tháng qua (thường là bệnh hay qua đời của người thân, hoặc chuyển đi học đại học) và chuyện phiền toái hằng ngày gây khổ nhất trong 2 tuần qua (thường là chuyện ở trường như làm bài kém).
  loai: phat-hien
  nguon:
  - forsythe1987
  trich: The most frequently selected daily events involved school hassles (e.g., 'doing poorly on an exam or paper') ... The most frequently selected major events were concerned with illness or death of a family member and moving away from home to enter college, chosen by 40% of the sample.
  vi_tri: Method, Materials, tr. 476
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "với cả sự kiện lớn (người thân qua đời) và sự kiện nhỏ (bị điểm kém)". Chữ mới nêu đúng loại sự kiện và khung thời gian. Lý do: "sự kiện nhỏ (bị điểm kém)" không chính xác: là chuyện phiền toái hằng ngày được chọn nhiều nhất (44%), và sự kiện lớn gồm bệnh/qua đời của người thân và chuyển đi học (40%).'
- id: n33
  cau: Với sự kiện lớn, triệu chứng tâm lý cao khi có lệch pha giữa cách đối phó và mức kiểm soát được cảm nhận (ví dụ cố thay đổi trực tiếp một sự kiện được cho là ngoài tầm kiểm soát) và thấp khi hai thứ khớp nhau; với chuyện phiền toái hằng ngày, không thấy hiệu ứng nào.
  loai: phat-hien
  nguon:
  - forsythe1987
  trich: In relation to major life events, symptomatology was high when there was a poor fit between appraisals and coping (e.g., trying to change a stressor that was appraised as uncontrollable) and low when there was a good fit ... No effects were found in relation to daily hassles.
  vi_tri: Tóm tắt; Results, tr. 481–482
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "với cả sự kiện lớn … và sự kiện nhỏ …: triệu chứng tâm lý cao nhất khi có sự lệch pha …". Chữ mới thêm vế "với chuyện phiền toái hằng ngày không thấy hiệu ứng". Lý do: chữ cũ nói hiệu ứng có ở cả hai loại sự kiện, sai: bài ghi "No significant main or interaction effects were found for daily events. Thus, the goodness of fit was not supported for daily events." "cao nhất" (lệch pha) đổi thành "cao" cho khớp tóm tắt.'
- id: n34
  cau: Giả thuyết cho rằng đối phó tập trung vào vấn đề phát huy tác dụng với việc thay đổi được, còn đối phó cảm xúc thích hợp hơn với việc không thay đổi được, vì khi đó trạng thái bên trong của ta là thứ duy nhất còn có thể thay đổi.
  loai: dinh-nghia
  nguon:
  - forsythe1987
  - kendall2008
  trich: If an event is relatively uncontrollable, then emotion-focused or perception-focused coping may be more effective than problem-focused coping. In contrast, a controllable event may be best managed through problem-focused coping. [Kendall & Terry, tóm tắt]
  vi_tri: Kendall & Terry 2008, tóm tắt; Forsythe & Compas 1987, tr. 482
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "đối phó tập trung vào vấn đề phát huy tác dụng với việc thay đổi được; đối phó tập trung vào cảm xúc thích hợp hơn với việc không thay đổi được — vì khi đó…" như một điều đã được chứng minh. Chữ mới: "giả thuyết cho rằng…". Lý do: là nội dung của giả thuyết, các kiểm chứng lẫn lộn. Vế "vì khi đó, trạng thái bên trong là thứ duy nhất còn có thể thay đổi" là lời giải thích của trang, không có trong nguồn; giữ như lời giải thích gắn với giả thuyết.'
- id: n35
  cau: Conway và Terry (1992, 101 sinh viên và người dân trong cộng đồng) thấy đối phó tập trung vào vấn đề đi cùng đánh giá hiệu quả đối phó tốt hơn chỉ ở những tình huống được đánh giá là kiểm soát được, nhưng không thấy đối phó cảm xúc thích ứng hơn ở tình huống không kiểm soát được.
  loai: phat-hien
  nguon:
  - conway1992
  trich: High relative levels of problem-focused coping were associated with favourable ratings of coping efficacy only in situations appraised to be controllable ... There was, however, no support for the expectation that high levels of problem-focused coping would be maladaptive in situations appraised to be uncontrollable, or for the expectation that the use of emotion-focused coping would be adaptive in such situations.
  vi_tri: Tóm tắt (OpenAlex); không mở được toàn văn
  ket_qua: da-sua
  ghi_chu: 'Câu mới, thay cho câu cũ chỉ nhắc Conway và Terry (1992) như nguồn ủng hộ ở mục Các lý thuyết giải thích (trước đó bài này không có trong danh sách Nguồn). Chữ cũ: "Giả thuyết khớp nhau (Folkman, Lazarus, Gruen và DeLongis, 1986; Conway và Terry, 1992). … khi tình huống không kiểm soát được, cố thay đổi nó chỉ tạo thêm thất vọng". Lý do: Conway và Terry không ủng hộ phần đó. Đã thêm Conway & Terry vào mục Nguồn.'
- id: n36
  cau: 'Zakowski, Hall, Klein và Baum (2001, 72 người trưởng thành trong cộng đồng) ủng hộ giả thuyết khớp nhau một phần: có tương tác giữa mức kiểm soát được cảm nhận và đối phó cảm xúc trong việc dự báo mức stress.'
  loai: phat-hien
  nguon:
  - zakowski2001
  trich: Although the main-effects hypothesis was not supported, the goodness-of-fit hypothesis was partly confirmed by a significant control by emotion-focused coping interaction predicting both self-report and behavioral measures of stress.
  vi_tri: Tóm tắt (OpenAlex); không mở được toàn văn
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "(ví dụ Zakowski, Hall, Klein và Baum, 2001 trên người trưởng thành trong cộng đồng) cũng tìm thấy sự ủng hộ cho giả thuyết này". Chữ mới: "ủng hộ một phần…" kèm n = 72 và loại tương tác. Lý do: tóm tắt nói "partly confirmed", không phải ủng hộ đầy đủ. Mẫu 72 người, 2 lần đo cách nhau khoảng 2 tháng.'
- id: n37
  cau: Kendall và Terry theo dõi 90 người bị chấn thương sọ não cùng người thân trong một nghiên cứu dọc, và không tìm thấy sự ủng hộ cho giả thuyết khớp nhau, cả ngắn hạn lẫn dài hạn.
  loai: phat-hien
  nguon:
  - kendall2008
  trich: Ninety people with traumatic brain injury, drawn from the inpatient rehabilitation unit of a major metropolitan hospital in Australia, and their relatives participated in this longitudinal study. No support was found for the Goodness-of-Fit model, either in the short term or the long term.
  vi_tri: Tóm tắt (Europe PMC); không mở được toàn văn
  ket_qua: dung
  ghi_chu: Chỉ có tóm tắt.
- id: n38
  cau: Đối phó tập trung vào vấn đề có liên quan tích cực đến hoạt động theo vai trò (role functioning), nhưng việc kiên trì dùng nó trước những khó khăn do chấn thương gây ra có thể đi cùng suy sụp cảm xúc về lâu dài.
  loai: phat-hien
  nguon:
  - kendall2008
  trich: Although the use of problem-focused coping strategies was positively associated with short-term and long-term role functioning, it was not associated with long-term emotional well-being if the situation was perceived to be controllable. The findings suggest that the persistent use of problem-focused coping in response to the difficulties created by traumatic brain injury can be associated with emotional distress in the long term.
  vi_tri: Tóm tắt (Europe PMC)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Thậm chí, việc kiên trì dùng đối phó tập trung vào vấn đề trước những khó khăn khó thay đổi còn đi cùng suy sụp cảm xúc về lâu dài." Chữ mới: bỏ "khó thay đổi" (tóm tắt nói "difficulties created by TBI"), đổi "đi cùng" thành "có thể đi cùng", thêm vế liên hệ tích cực với role functioning. Lý do: chữ cũ khẳng định chắc và bỏ sót kết quả trái chiều của bài. Cũng sửa ở câu hỏi quiz 4 và mục Ngộ nhận.'
- id: n39
  cau: Mức kiểm soát được cảm nhận thay đổi nhiều giữa các tình huống (Folkman 1986 thấy các đánh giá kiểu này biến động nhiều hơn ổn định), nên ranh giới đổi được/không đổi được có thể mờ.
  loai: phat-hien
  nguon:
  - folkman1986
  trich: situational appraisals of control may be more variable than stable
  vi_tri: Folkman 1986, tr. 572–573; tr. 577
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "ranh giới đổi được/không đổi được trong đời thực thường mờ và thay đổi theo thời gian" (không nguồn). Chữ mới có căn cứ ở Folkman 1986 và nói "có thể mờ". "Thay đổi theo thời gian" bỏ (nguồn nói biến động giữa các tình huống).'
- id: n40
  cau: Một số chiến lược thường xếp vào nhóm tập trung vào cảm xúc, như trốn tránh hay mong ước viển vông, nhìn chung đi cùng sức khỏe kém hơn chứ không phải cách đối phó lành mạnh (phân tích tổng hợp của Penley, Tomaka và Wiebe, 2002).
  loai: so-lieu
  nguon:
  - penley2002
  trich: problem-focused coping was positively correlated with overall health outcomes, whereas confrontive coping, distancing, self-control, seeking social support, accepting responsibility, avoidance, and wishful thinking were each negatively correlated with overall health outcomes.
  vi_tri: Tóm tắt (Europe PMC)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "nhiều chiến lược gán nhãn tập trung vào cảm xúc (như mong ước viển vông) thực chất gần với triệu chứng suy sụp hơn là cách đối phó lành mạnh" (không nguồn). Chữ mới có nguồn (tổng hợp) và nói "đi cùng", kèm trốn tránh. Lưu ý: tổng hợp cho thấy liên hệ (phần lớn tương quan), không chứng minh nhân quả; theo tóm tắt, cả distancing và seeking social support cũng có liên hệ âm, nên không được hiểu là mọi dạng cảm xúc đều xấu.'
- id: n41
  cau: Bonanno và Burton cho rằng các nhà nghiên cứu hay ngầm giả định một chiến lược nào đó lúc nào cũng có lợi hoặc lúc nào cũng có hại, và gọi giả định này là ngộ nhận hiệu quả đồng nhất (fallacy of uniform efficacy).
  loai: phat-hien
  nguon:
  - bonanno2013
  trich: researchers have tended to assume that particular regulatory strategies are consistently beneficial or maladaptive. We label this assumption the fallacy of uniform efficacy
  vi_tri: Tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "đề xuất thay câu hỏi chiến lược nào tốt nhất bằng ai linh hoạt nhất? Họ gọi sai lầm một chiến lược tốt cho mọi lúc là ngộ nhận hiệu quả đồng nhất". Chữ mới bám tóm tắt: "giả định" (assumption), không "sai lầm"; "đề xuất nhìn vào khác biệt giữa người với người về tính linh hoạt" thay cho câu hỏi "ai linh hoạt nhất". Chỉ có tóm tắt (không mở được toàn văn).'
- id: n42
  cau: 'Họ đề xuất khái niệm linh hoạt điều tiết (regulatory flexibility) qua ba thành phần: nhạy cảm với bối cảnh, vốn chiến lược đa dạng, nhạy với phản hồi.'
  loai: dinh-nghia
  nguon:
  - bonanno2013
  trich: 'three sequential components of flexibility for which propensities and abilities vary: sensitivity to context, availability of a diverse repertoire of regulatory strategies, and responsiveness to feedback.'
  vi_tri: Tóm tắt
  ket_qua: dung
  ghi_chu: Phần giải thích từng thành phần trong danh sách đánh số (đọc được tình huống; nhiều cách trong túi đồ nghề; theo dõi và đổi cách) là diễn giải của trang; khớp tên thành phần của tóm tắt. Quiz 5 nhắc lại cùng ba thành phần.
- id: n43
  cau: Theo khung nhìn này, người điều tiết tốt không phải người luôn đối mặt hay luôn buông bỏ, mà là người biết khi nào đối mặt, khi nào buông, và khi nào đổi chiến lược.
  loai: phat-hien
  nguon:
  - bonanno2013
  trich: particular regulatory strategies are consistently beneficial or maladaptive. We label this assumption the fallacy of uniform efficacy
  vi_tri: Tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Người vững vàng trước stress, theo khung nhìn này, không phải người luôn đối mặt hay luôn buông bỏ…". Chữ mới: "người điều tiết tốt". Lý do: tóm tắt không dùng khái niệm "vững vàng trước stress"; chỉ có tóm tắt.'
- id: n44
  cau: Một phân tích tổng hợp 329 nghiên cứu (Cheng, Lau và Chan, 2014) thấy tính linh hoạt khi đối phó có liên hệ dương, ở mức nhỏ đến vừa (r = 0,23), với sự thích ứng tâm lý; mức liên hệ khác nhau nhiều giữa các nghiên cứu và tùy cách định nghĩa linh hoạt.
  loai: so-lieu
  nguon:
  - cheng2014
  trich: a small to moderate overall mean effect size (r = .23, 95% CI [.19, .28], 80% CRI [-.02, .49], k = 329, N = 58,946). More important, the magnitude of the positive link between coping flexibility and psychological adjustment varied with the conceptualization of such flexibility.
  vi_tri: Tóm tắt
  ket_qua: dung
  ghi_chu: Câu mới thêm trong đợt này. Chỉ có tóm tắt.
- id: n45
  cau: 'Khung: Khá vững: không có chiến lược đối phó nào tốt cho mọi tình huống.'
  loai: nhan
  nguon:
  - penley2002
  - cheng2014
  - bonanno2013
  - forsythe1987
  - kendall2008
  trich: situational characteristics (i.e., stressor type, controllability, and duration) moderated many of the overall associations [Penley]; the positive link between coping flexibility and psychological adjustment varied with the conceptualization of such flexibility [Cheng]
  vi_tri: tóm tắt Penley 2002; tóm tắt Cheng 2014
  nhan: kha-vung
  co_so:
  - penley2002
  - cheng2014
  - bonanno2013
  - kendall2008
  - forsythe1987
  ly_do: 'Hai phân tích tổng hợp cùng chiều: Penley, Tomaka & Wiebe 2002 (liên hệ giữa các kiểu đối phó và sức khỏe thay đổi theo mức kiểm soát được, loại stress, thời gian) và Cheng, Lau & Chan 2014 (k = 329, r = 0,23; mức khác nhau nhiều giữa các nghiên cứu, khoảng dự đoán 80% từ −0,02 đến 0,49; cách định nghĩa ''khớp chiến lược–tình huống'' cho mức vừa; mạnh hơn ở nước ít cá nhân chủ nghĩa). Chưa đạt Vững chắc: dữ liệu chủ yếu tự báo cáo, tương quan; các kiểm tra trực tiếp sự khớp lẫn lộn (Kendall 2008 không ủng hộ; Conway 1992, Zakowski 2001 ủng hộ một phần; Forsythe 1987 chỉ ở sự kiện lớn). Theo thước đo mục 4: có tổng hợp nhưng kết quả khác nhau nhiều giữa các nghiên cứu nên Khá vững.'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: khung "Vững chắc: không có chiến lược đối phó nào tốt cho mọi tình huống. Đây là điểm đồng thuận bền vững nhất của lĩnh vực suốt bốn thập kỷ … Mọi nỗ lực xếp hạng cách tốt nhất độc lập với bối cảnh đều thất bại." Chữ mới: Khá vững, bỏ "đồng thuận bền vững nhất suốt bốn thập kỷ" và "mọi nỗ lực … đều thất bại" (không kiểm được; còn tổng hợp Penley thấy đối phó vấn đề liên hệ dương với sức khỏe nói chung), thêm hai tổng hợp và giới hạn. Lý do: khung gộp với phần khớp nhau đang tranh cãi; hạ nhãn. Sách 1984 không mở được.'
- id: n46
  cau: 'Khung: Khá vững: cách ta đánh giá tình huống định hình phản ứng stress.'
  loai: nhan
  nguon:
  - folkman1986
  - webb2012
  trich: cognitive change had a small-to-medium effect (d(+) = 0.36) [Webb 2012]
  vi_tri: tóm tắt Webb 2012
  nhan: kha-vung
  co_so:
  - webb2012
  - folkman1986
  ly_do: 'Tổng hợp Webb, Miles & Sheeran 2012 (306 so sánh thực nghiệm): thay đổi cách nhìn nhận (cognitive change) làm đổi kết quả cảm xúc ở mức nhỏ đến vừa (d+ = 0,36). Folkman 1986: đánh giá và đối phó đi cùng triệu chứng tâm lý (quan sát, mẫu 150 người). Chưa đạt Vững chắc: phần lớn bằng chứng là tương quan hoặc thí nghiệm ngắn, mức tác động nhỏ đến vừa, mẫu chủ yếu phương Tây; chưa có tổng hợp nói thẳng ''đánh giá định hình phản ứng stress'' trong đời thực.'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: khung "Vững chắc: … là phát hiện được lặp lại nhiều nhất trong nghiên cứu stress — cùng một sự việc khách quan có thể gây ra phản ứng hoàn toàn khác nhau …, và can thiệp vào cách đánh giá là cơ sở của nhiều liệu pháp tâm lý hiệu quả." Chữ mới: Khá vững; bỏ "được lặp lại nhiều nhất", "hoàn toàn khác nhau" và vế về liệu pháp (không kiểm được ở đây). Lý do: không có tổng hợp được mở cho cả khẳng định; hạ nhãn.'
- id: n47
  cau: 'Khung: Đang tranh cãi: giả thuyết ''khớp nhau'' đúng đến mức nào? (Forsythe và Compas 1987 ủng hộ ở sự kiện lớn, Conway và Terry 1992 và Zakowski 2001 ủng hộ một phần, Kendall và Terry 2008 không ủng hộ.)'
  loai: nhan
  nguon:
  - forsythe1987
  - conway1992
  - zakowski2001
  - kendall2008
  - cheng2014
  trich: the goodness-of-fit hypothesis was partly confirmed [Zakowski]; No support was found for the Goodness-of-Fit model, either in the short term or the long term. [Kendall & Terry]
  vi_tri: tóm tắt
  nhan: tranh-cai
  co_so:
  - forsythe1987
  - conway1992
  - zakowski2001
  - kendall2008
  - cheng2014
  ly_do: 'Bằng chứng mâu thuẫn: kiểm tra trực tiếp cho kết quả khác nhau (ủng hộ ở sự kiện lớn nhưng không ở chuyện hằng ngày: Forsythe & Compas; ủng hộ một phần: Conway & Terry, Zakowski; không ủng hộ ngắn và dài hạn: Kendall & Terry). Tổng hợp Cheng 2014 cho thấy ''khớp chiến lược–tình huống'' có liên hệ vừa với thích ứng, nhưng đó là liên hệ gián tiếp. Theo thước đo mục 4: đang tranh cãi.'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Forsythe và Compas (1987) tìm thấy sự ủng hộ rõ rệt, nhưng Kendall và Terry (2008) không tìm thấy gì cả… Một phần vấn đề nằm ở cách đo: phân loại nhị phân … quá thô — trong nhóm cảm xúc có cả chấp nhận lành mạnh lẫn mong ước viển vông … Các nhà nghiên cứu hiện nay có xu hướng chuyển…". Chữ mới: thêm Conway 1992 và Zakowski 2001; "ủng hộ ở sự kiện lớn (không ở chuyện hằng ngày)"; "Có ý kiến cho rằng một phần vấn đề nằm ở cách đo"; bỏ "chấp nhận lành mạnh" (không có nguồn), thay "trốn tránh hay mong ước viển vông đi cùng sức khỏe kém hơn" (Penley 2002); "Một số nhà nghiên cứu hiện nay" thay "các nhà nghiên cứu hiện nay có xu hướng". Lý do: "ủng hộ rõ rệt" và "không tìm thấy gì cả" sai/ mạnh; "xu hướng chung" không kiểm được.'
- id: n48
  cau: Một số nhà nghiên cứu hiện nay chuyển từ câu hỏi 'chiến lược nào khớp?' sang 'ai linh hoạt trong việc chuyển chiến lược?' (Bonanno và Burton, 2013; Cheng và cộng sự, 2014).
  loai: phat-hien
  nguon:
  - bonanno2013
  - cheng2014
  trich: Coping flexibility has received relatively scant research attention, although more such studies have begun to emerge recently. [Cheng 2014]
  vi_tri: Cheng 2014, tóm tắt; Bonanno 2013, tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: Chữ 'các nhà nghiên cứu hiện nay có xu hướng' -> 'một số nhà nghiên cứu hiện nay'. Chỉ có tóm tắt.
- id: n49
  cau: 'Mô hình giao dịch: stress là một mối quan hệ, không phải một sự vật; hai người cùng gặp một khối lượng công việc có thể đánh giá khác nhau và có thể phản ứng khác nhau.'
  loai: phat-hien
  nguon:
  - folkman1986
  - finkel2025
  trich: Stress is conceptualized as a relationship between the person and the environment that is appraised by the person as taxing or exceeding his or her resources
  vi_tri: Folkman 1986, tr. 572
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "…người đánh giá mình làm được, đây là cơ hội sẽ có phản ứng sinh lý và hành vi khác hẳn người đánh giá mình sẽ thất bại thảm hại. Mọi can thiệp hiệu quả đều phải đi qua cửa đánh giá này." Chữ mới: "có thể đánh giá khác nhau … có thể phản ứng khác nhau"; bỏ câu "Mọi can thiệp hiệu quả đều phải đi qua cửa đánh giá này" (da-bo, không kiểm được, phủ định mạnh); bỏ "sinh lý" (không có nguồn mở nào đo). Ví dụ làm được/thất bại là minh họa (gia-dinh).'
- id: n50
  cau: Câu 'Mọi can thiệp hiệu quả đều phải đi qua cửa đánh giá này.' (đã bỏ khỏi trang).
  loai: loi-khuyen
  ket_qua: da-bo
  ghi_chu: 'Đã bỏ khỏi mục Các lý thuyết giải thích: khẳng định phổ quát (mọi can thiệp hiệu quả), không có nguồn đã mở. Xem n49.'
- id: n51
  cau: 'Giả thuyết khớp nhau (Lazarus và Folkman, 1984; được kiểm chứng ở Forsythe và Compas, 1987; Conway và Terry, 1992): hiệu quả = chiến lược × bối cảnh; khi tình huống kiểm soát được, nỗ lực thay đổi tình huống có đất phát huy; khi không kiểm soát được, giả thuyết cho rằng điều chỉnh phản ứng bên trong sẽ thích ứng hơn; các kiểm chứng ủng hộ chỉ một phần.'
  loai: dinh-nghia
  nguon:
  - kendall2008
  - zakowski2001
  - forsythe1987
  - conway1992
  trich: The theory postulates that coping strategies used tend to match the level of appraised controllability of the stressor (matching hypothesis). It further states that the effects of problem-focused versus emotion-focused coping are moderated by the appraised controllability of the stressor (goodness-of-fit hypothesis). [Zakowski 2001]; the Goodness-of-Fit hypothesis, drawn from the Lazarus and Folkman (1984) theory [Kendall & Terry]
  vi_tri: Zakowski 2001, tóm tắt; Kendall & Terry 2008, tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Giả thuyết khớp nhau (Folkman, Lazarus, Gruen và DeLongis, 1986; Conway và Terry, 1992). Hiệu quả = chiến lược × bối cảnh. … khi tình huống không kiểm soát được, cố thay đổi nó chỉ tạo thêm thất vọng — lúc đó điều chỉnh phản ứng bên trong (đối phó cảm xúc) là thích ứng hơn." Chữ mới: gán giả thuyết cho Lazarus & Folkman 1984 (theo Zakowski 2001 và Kendall & Terry 2008) thay vì Folkman 1986 (bài này không kiểm sự khớp), nói "giả thuyết cho rằng", thêm "các kiểm chứng chỉ ủng hộ một phần". Lý do: Folkman 1986 không đề xuất hay kiểm giả thuyết khớp; "chỉ tạo thêm thất vọng" không có nguồn.'
- id: n52
  cau: 'Linh hoạt điều tiết (Bonanno và Burton, 2013): không chỉ chọn đúng chiến lược cho tình huống mà còn theo dõi và đổi chiến lược khi tình huống thay đổi; ba thành phần được đề xuất để giải thích vì sao cùng một chiến lược có thể cho kết quả khác nhau ở những người khác nhau.'
  loai: dinh-nghia
  nguon:
  - bonanno2013
  trich: People respond to stressful events in different ways, depending on the event and on the regulatory strategies they choose. ... these two factors, the person and the situation, interact over time to inform adaptation.
