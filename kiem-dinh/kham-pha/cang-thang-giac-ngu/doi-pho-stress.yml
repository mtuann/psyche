  ghi_chu: Câu mới. Chỉ có tóm tắt.
- id: n67
  cau: Nếu Việt Nam được xem là xã hội thiên về tập thể, vốn đối phó của người Việt có thể mang tính tập thể nhiều hơn (tìm đến gia đình, họ hàng) thay vì mô hình cá nhân tự xử lý phổ biến trong nghiên cứu phương Tây; cần nghiên cứu thực nghiệm trên người Việt.
  loai: phat-hien
  nguon:
  - kuo2013
  - cheng2014
  trich: collective coping behaviors are conceived as a product of the communal/relational norms and values of a cultural group across studies [Kuo 2013]
  vi_tri: Kuo 2013, tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "văn hóa Việt Nam đề cao gia đình và cộng đồng, nên vốn đối phó của người Việt có thể mang tính tập thể nhiều hơn — tìm đến gia đình, họ hàng, hoặc niềm tin tâm linh". Chữ mới: "Nếu Việt Nam được xem là xã hội thiên về tập thể…", bỏ "niềm tin tâm linh" (không có nguồn đã mở), có hai căn cứ (Kuo 2013; Cheng 2014). Đã ghi rõ là suy luận chưa kiểm chứng. Chưa tìm số liệu riêng về Việt Nam; "Việt Nam thiên về tập thể" không được kiểm ở đây nên đặt trong "nếu".'
- id: n68
  cau: 'Ngộ nhận 1: ''Đối phó tập trung vào cảm xúc là yếu đuối, là trốn tránh.'' Không hẳn: Forsythe và Compas (1987) thấy đối phó cảm xúc đi cùng triệu chứng thấp hơn ở sự kiện lớn được cảm nhận là ít kiểm soát được, dù Kendall và Terry (2008) và Conway và Terry (1992) không xác nhận; nhưng trốn tránh và mong ước viển vông nhìn chung đi cùng sức khỏe kém hơn (Penley và cộng sự, 2002).'
  loai: phat-hien
  nguon:
  - forsythe1987
  - kendall2008
  - conway1992
  - penley2002
  trich: The use of relatively more emotion-focused coping strategies to palliate one's reaction to a stressor displayed the converse pattern. These coping methods were associated with lower symptom levels when events were perceived as low in controllability [Forsythe & Compas, Discussion, tr. 482]
  vi_tri: Forsythe & Compas 1987, tr. 482; tóm tắt Kendall, Conway, Penley
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Sai. Khi tình huống không thay đổi được, xoa dịu và chấp nhận cảm xúc là cách thích ứng — ngược lại, cứ lao vào giải quyết một việc không thể giải quyết mới là con đường dẫn đến kiệt sức, như trường hợp của Minh và như nghiên cứu của Kendall và Terry (2008) cho thấy." Chữ mới như trên. Lý do: "Sai" và "là cách thích ứng" mạnh; Kendall & Terry 2008 không ủng hộ giả thuyết khớp mà chỉ thấy kiên trì dùng đối phó vấn đề có thể đi cùng suy sụp, không so sánh với cảm xúc; "chấp nhận" không có nguồn riêng.'
- id: n69
  cau: 'Ngộ nhận 2: ''Cứ hành động là tốt, đừng ngồi yên.'' Chỉ hợp lý khi hành động đó có thể thay đổi tình huống; Forsythe và Compas (1987) thấy triệu chứng cao hơn khi dùng nhiều đối phó vấn đề với sự kiện được cảm nhận là ít kiểm soát được, và Kendall và Terry (2008) thấy kiên trì dùng nó trước khó khăn do chấn thương có thể đi cùng suy sụp cảm xúc về lâu dài.'
  loai: phat-hien
  nguon:
  - forsythe1987
  - kendall2008
  trich: these same coping strategies were associated with higher levels of distress when used to deal with events over which individuals believed they had little control [Forsythe & Compas, tr. 482]
  vi_tri: Forsythe & Compas 1987, tr. 482; Kendall & Terry 2008, tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Chỉ đúng khi hành động đó có thể thay đổi tình huống. Với việc không kiểm soát được, hành động dai dẳng không những vô ích mà còn tạo thêm thất vọng và tuyệt vọng (đây chính là lý do các tác giả cảnh báo về lệch pha …)". Chữ mới như trên. Lý do: "vô ích", "thất vọng và tuyệt vọng" không đo trong nguồn; thay bằng kết quả cụ thể của hai nghiên cứu.'
- id: n70
  cau: 'Ngộ nhận 3: ''Stress là do hoàn cảnh gây ra, nên chỉ cần đổi hoàn cảnh là hết.'' Theo mô hình giao dịch, stress là mối quan hệ giữa người và môi trường mà người ấy đánh giá là vượt quá nguồn lực; nên đổi hoàn cảnh có thể giúp, nhưng cách đánh giá của mỗi người cũng đóng vai trò, và hai người có thể phản ứng khác nhau trước cùng một tình huống.'
  loai: phat-hien
  nguon:
  - folkman1986
  - finkel2025
  trich: Stress is conceptualized as a relationship between the person and the environment that is appraised by the person as taxing or exceeding his or her resources
  vi_tri: Folkman 1986, tr. 572
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…đánh giá của ta mới là cửa ngõ: cùng một khối lượng việc, người thấy thử thách và người thấy đe dọa sẽ có phản ứng stress khác nhau một trời một vực. Đổi hoàn cảnh mà không đổi cách đánh giá thì stress sẽ đi theo bạn sang hoàn cảnh mới." Chữ mới như trên. Lý do: "một trời một vực" và "stress sẽ đi theo bạn" không có nguồn (không đo trong nguồn đã mở); mô hình chỉ nói stress là quan hệ.'
- id: n71
  cau: 'Đọc thêm: ba link tới các trang Stress có luôn có hại?, Nén cảm xúc có tốt?, ''Cháy'' hết mình là gì? (mô tả ngắn từng link).'
  loai: ve-site
  review: dung
  ket_qua: dung
  ghi_chu: 'Đã kiểm: stress-co-hai có trong src/content/docs (title ''Stress có luôn có hại?''); dong-chay-flow có (title "''Cháy'' hết mình là gì?"); dieu-tiet-cam-xuc chưa có trong worktree này nhưng có id trong src/data/trang.yml (kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc, tầng loi) và trang cũ ../psyche-zero/docs/kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc.md có title ''Nén cảm xúc có tốt?'', mô tả về điều tiết cảm xúc (Gross 1998): khớp.'
- id: q1
  cau: 'Câu hỏi 1: Theo Lazarus và Folkman (1984), đối phó (coping) là những nỗ lực nhận thức và hành vi liên tục thay đổi nhằm quản lý các đòi hỏi được đánh giá là vượt quá nguồn lực của bản thân. Lời giải thích: từ khóa là ''liên tục thay đổi'' và ''được đánh giá'': đối phó là một quá trình động, không phải một tính cách cố định, và nó bắt đầu từ cách ta đánh giá tình huống.'
  loai: dinh-nghia
  nguon:
  - forsythe1987
  - finkel2025
  trich: constantly changing cognitive and behavioral efforts to manage specific external and or internal demands that are appraised as taxing or exceeding the resources of the person (p. 141)
  vi_tri: Forsythe & Compas 1987, tr. 474
  ket_qua: da-lam-mem
  ghi_chu: Đáp án đúng khớp định nghĩa (n14). Lời giải thích giữ; "không phải một tính cách cố định" đã làm mềm ở n20 trên trang nhưng ở đây là cách nói về định nghĩa (không có chữ "chủ yếu"), giữ vì định nghĩa là "constantly changing efforts". Hai phương án nhiễu sai (tính cách ổn định; phản ứng tự động của cơ thể) là phương án nhiễu (gia-dinh).
- id: q2
  cau: 'Câu hỏi 2: Đánh giá ban đầu: ''chuyện này có ảnh hưởng gì đến mình không?''; đánh giá thứ cấp: ''mình có thể làm được gì, việc này có thay đổi được không?''. Giải thích: hai bước đan xen; đánh giá xem tình huống có thay đổi được không là thông tin giả thuyết khớp nhau dùng để chọn chiến lược.'
  loai: dinh-nghia
  nguon:
  - folkman1986
  - finkel2025
  trich: In primary appraisal, the person evaluates whether he or she has anything at stake ... In secondary appraisal the person evaluates what, if anything, can be done
  vi_tri: 'Folkman 1986, tr. 572; Finkel 2025: ''cannot be considered as separate'' (L&F 1984 tr. 43, theo X kể lại)'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: đáp án "đe dọa gì đến mình không?" / "mình có nguồn lực gì, việc này có thay đổi được không?"; giải thích "Hai bước này đan xen và lặp lại liên tục. Đặc biệt, đánh giá thứ cấp về tính kiểm soát được chính là la bàn để chọn chiến lược đối phó phù hợp." Chữ mới như trên. Lý do: khớp n12–n13; "chính là la bàn" mạnh, đổi thành "là thông tin mà giả thuyết khớp nhau dùng".'
- id: q3
  cau: 'Câu hỏi 3: Giả thuyết khớp nhau nói rằng hiệu quả của chiến lược đối phó phụ thuộc vào sự khớp nhau với tình huống: đối phó vấn đề hợp với việc thay đổi được, đối phó cảm xúc hợp với việc không thay đổi được; lệch pha thì được dự đoán là triệu chứng nặng hơn. Giải thích: theo giả thuyết này Lan và Minh không sai ở cách mà ở lệch pha; đây là giả thuyết có bằng chứng lẫn lộn, không phải định luật.'
  loai: dinh-nghia
  nguon:
  - kendall2008
  - zakowski2001
  - forsythe1987
  trich: The hypothesis suggests that the nature and success of specific coping strategies will be associated with the controllability of the event.
  vi_tri: Kendall & Terry 2008, tóm tắt; Zakowski 2001, tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: đáp án "…; lệch pha thì triệu chứng nặng hơn." Giải thích: "Lan và Minh không sai ở cách, mà sai ở sự lệch pha giữa cách và tình huống của mình." Chữ mới như trên (thêm "được dự đoán", "theo giả thuyết này", "có bằng chứng lẫn lộn"). Lý do: chữ cũ nói như đã chứng minh, trái với nhãn Đang tranh cãi.'
- id: q4
  cau: 'Câu hỏi 4: Kendall và Terry (2008) trên người bị chấn thương sọ não không tìm thấy sự ủng hộ cho giả thuyết khớp nhau; việc kiên trì dùng đối phó tập trung vào vấn đề trước những khó khăn do chấn thương gây ra có thể đi cùng suy sụp cảm xúc về lâu dài. Giải thích: công thức ''đổi được → giải quyết'' là một gợi ý, không phải định luật: kiểm chứng trực tiếp cho kết quả lẫn lộn, và mức kiểm soát cảm nhận thay đổi giữa các tình huống.'
  loai: phat-hien
  nguon:
  - kendall2008
  - folkman1986
  trich: No support was found for the Goodness-of-Fit model, either in the short term or the long term ... the persistent use of problem-focused coping in response to the difficulties created by traumatic brain injury can be associated with emotional distress in the long term.
  vi_tri: Kendall & Terry 2008, tóm tắt; Folkman 1986, tr. 572
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: đáp án "…trước những khó khăn khó thay đổi còn đi cùng suy sụp cảm xúc về lâu dài." Giải thích: "…hướng dẫn hữu ích nhưng không phải định luật — ranh giới đổi được/không đổi được trong đời thực thường mờ và thay đổi theo thời gian." Chữ mới như trên. Lý do: đồng bộ với n38, n39. Phương án nhiễu "Giả thuyết khớp nhau đúng trong mọi trường hợp" và "không cần đối phó gì cả" là phương án nhiễu (gia-dinh).'
- id: q5
  cau: 'Câu hỏi 5: Ngộ nhận hiệu quả đồng nhất là giả định rằng một chiến lược điều tiết lúc nào cũng có lợi (hoặc lúc nào cũng có hại); linh hoạt điều tiết gồm nhạy cảm với bối cảnh, vốn chiến lược đa dạng, và nhạy với phản hồi. Giải thích: thay vì chỉ hỏi chiến lược nào tốt nhất, Bonanno và Burton đề xuất nhìn vào khác biệt giữa người với người về tính linh hoạt.'
  loai: dinh-nghia
  nguon:
  - bonanno2013
  trich: researchers have tended to assume that particular regulatory strategies are consistently beneficial or maladaptive. We label this assumption the fallacy of uniform efficacy ... sensitivity to context, availability of a diverse repertoire of regulatory strategies, and responsiveness to feedback.
  vi_tri: Bonanno & Burton 2013, tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: đáp án "Ngộ nhận rằng một chiến lược điều tiết là tốt (hoặc xấu) cho mọi lúc mọi nơi; … nhạy với phản hồi để dám đổi cách khi cần." Giải thích: "Câu hỏi then chốt không phải chiến lược nào tốt nhất mà là ai linh hoạt nhất?" Chữ mới như trên. Lý do: đồng bộ với n41 (giả định, không "ngộ nhận" chung). Phương án nhiễu (ngộ nhận mọi người stress như nhau, tránh né…) là phương án nhiễu (gia-dinh).'
- id: n72
  cau: 'Mục Nguồn: danh sách các nguồn có trong bài (Bonanno và Burton 2013; Cheng, Lau và Chan 2014; Conway và Terry 1992; Folkman và Lazarus 1988; Folkman và cộng sự 1986; Forsythe và Compas 1987; Kendall và Terry 2008; Kuo 2013; Lazarus và Folkman 1984; NHS; Penley, Tomaka và Wiebe 2002; Webb, Miles và Sheeran 2012; Zakowski và cộng sự 2001).'
  loai: ve-site
  review: dung
  ket_qua: dung
  ghi_chu: 'Đã kiểm: mỗi nguồn được nhắc ở thân bài có mặt trong danh sách (kiểm bằng cách đọc trang); chi tiết thư mục (tập, trang) đối chiếu Crossref/Europe PMC ngày 10/11/2026: Bonanno 8(6) 591–612 (ghi theo trang cũ, chưa đối chiếu lại), Cheng 140(6) 1582–1607, Conway 44(1) 1–7, Folkman 1988 26(3) 309–317, Kuo 48(3) 374–388, Penley 25(6) 551–603, Webb 138(4) 775–808, Kendall 67(8) 1217–1224. Trước đó thiếu Conway & Terry 1992 (được nhắc nhưng không có trong danh sách) và chưa có DOI của Forsythe & Compas và Kendall & Terry: đã thêm.'
doi_chu:
- cu: (không có)
  moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
  ly_do: Bố cục C (kế hoạch).
- cu: 'mô tả: "Lazarus và Folkman (1984) chỉ ra rằng không có cách đối phó stress nào tốt cho mọi tình huống … Linh hoạt mới là chìa khóa."'
  moi: '"…đề xuất rằng hiệu quả của cách đối phó phụ thuộc vào tình huống… Bằng chứng cho sự khớp này còn lẫn lộn, và tính linh hoạt được xem là hướng hứa hẹn hơn."'
  ly_do: Hồ sơ n1.
- cu: '"Đáp án của tâm lý học hiện đại: không có cách nào tốt cho mọi tình huống. Cái đúng là sự khớp nhau…"; "cả hai đều sẽ kiệt sức"'
  moi: '"Đáp án của giả thuyết khớp nhau: … Nhưng đây là một giả thuyết có bằng chứng lẫn lộn"; "lệch pha như vậy có thể làm họ kiệt sức hơn"'
  ly_do: Hồ sơ n6, n8.
- cu: '"Điểm khởi đầu của mọi lý thuyết hiện đại về stress là một phát hiện đơn giản…"; "cách mỗi người diễn giải … chứ không nằm ở bản thân sự việc"'
  moi: '"Một điểm xuất phát của lý thuyết đánh giá nhận thức về stress là nhận xét…"; "một phần câu trả lời … chứ không chỉ ở bản thân sự việc"'
  ly_do: Hồ sơ n9, n10.
- cu: 'Đánh giá ban đầu/thứ cấp: "đe dọa", "thử thách", "Mình có nguồn lực gì?"; đối phó cảm xúc: "tìm sự an ủi, chấp nhận, tìm ý nghĩa"'
  moi: '"ảnh hưởng gì đến mình", "mối đe dọa, điều có lợi, chẳng đáng bận tâm", "Mình có thể làm được gì?"; "tìm sự hỗ trợ, nhìn nhận lại theo hướng tích cực, giữ khoảng cách, tạm thời phân tâm"'
  ly_do: Hồ sơ n12, n13, n17.
- cu: '"Và vòng lặp không dừng ở đó … đánh giá lại (reappraisal) … Đối phó vì thế là một quá trình động, không phải một tính cách cố định."'
  moi: '"Theo mô hình này, đối phó thay đổi theo những đánh giá liên tục … ta có thể đánh giá lại … được xem chủ yếu là một quá trình động, chứ không chỉ là một tính cách cố định."'
  ly_do: Hồ sơ n19, n20.
- cu: '"hệ thống hóa hai thập kỷ nghiên cứu"; "Ba đóng góp cốt lõi còn nguyên giá trị đến hôm nay … quyết định phản ứng stress … không có chiến lược đối phó nào tốt hay xấu một cách tuyệt đối"'
  moi: '"đề xuất mô hình giao dịch"; "Ba ý cốt lõi vẫn còn được dùng đến hôm nay … khâu trung gian then chốt … không nên đánh giá một chiến lược đối phó mà không xét bối cảnh dùng nó"'
  ly_do: Hồ sơ n22, n23.
- cu: 'Folkman và Lazarus 1988: "Trong một bài tổng quan … cảm xúc … định hình cách ta đánh giá và chọn chiến lược — và mỗi nỗ lực đối phó lại làm nảy sinh cảm xúc mới"'
  moi: '"Trong một bài viết lý thuyết … cảm xúc và đối phó ảnh hưởng lẫn nhau trong một mối quan hệ động, hai chiều"'
  ly_do: Hồ sơ n24.
- cu: 'Folkman 1986: tiêu đề "hiệu quả tùy thuộc vào đánh giá"; "đề xuất ý tưởng nền tảng … hiệu quả … phụ thuộc vào sự đánh giá tình huống"'
  moi: tiêu đề "đánh giá và đối phó qua nhiều tình huống"; "nhấn mạnh rằng không nên coi một dạng đối phó là tốt hay xấu mà không xét bối cảnh dùng nó"; thêm 75 cặp vợ chồng, năm lần phỏng vấn, kết quả sức khỏe thể chất
  ly_do: Hồ sơ n26–n30. Bài này không kiểm sự khớp; id cũ của tiêu đề mục không còn (không có link tới id đó).
- cu: 'Forsythe và Compas: "với cả sự kiện lớn (người thân qua đời) và sự kiện nhỏ (bị điểm kém): triệu chứng tâm lý cao nhất khi có sự lệch pha"'
  moi: '"… sự kiện lớn gây khổ sở nhất trong 6 tháng qua … chuyện phiền toái hằng ngày … Với sự kiện lớn, triệu chứng tâm lý cao khi có sự lệch pha … Với chuyện phiền toái hằng ngày, họ không thấy hiệu ứng nào"'
  ly_do: 'Hồ sơ n31–n33 (bài mở rộng stress-co-hai dựa trên bài này: xem báo cáo).'
- cu: '"đối phó tập trung vào vấn đề phát huy tác dụng với việc thay đổi được; … Các nghiên cứu sau này (ví dụ Zakowski …) cũng tìm thấy sự ủng hộ"'
  moi: '"giả thuyết cho rằng …"; thêm Conway và Terry 1992 (ủng hộ một phần); Zakowski "ủng hộ một phần"'
  ly_do: Hồ sơ n34–n36.
- cu: 'Kendall và Terry: "trước những khó khăn khó thay đổi còn đi cùng suy sụp cảm xúc về lâu dài"; "ranh giới … thường mờ và thay đổi theo thời gian"; "nhiều chiến lược gán nhãn tập trung vào cảm xúc … thực chất gần với triệu chứng suy sụp"'
  moi: '"trước những khó khăn do chấn thương gây ra có thể đi cùng suy sụp cảm xúc về lâu dài" (kèm liên hệ tích cực với role functioning); "ranh giới … có thể mờ"; "trốn tránh hay mong ước viển vông, nhìn chung đi cùng sức khỏe kém hơn (Penley … 2002)"'
  ly_do: Hồ sơ n38–n40, q4.
- cu: 'Bonanno và Burton: "đề xuất thay câu hỏi chiến lược nào tốt nhất bằng ai linh hoạt nhất? Họ gọi sai lầm …"; "Người vững vàng trước stress …"'
  moi: '"cho rằng các nhà nghiên cứu hay ngầm giả định … gọi giả định này là ngộ nhận hiệu quả đồng nhất"; "người điều tiết tốt"; thêm tổng hợp Cheng 2014'
  ly_do: Hồ sơ n41, n43, n44, q5.
- cu: 'Khung "Vững chắc: không có chiến lược đối phó nào tốt cho mọi tình huống … điểm đồng thuận bền vững nhất … Mọi nỗ lực xếp hạng … đều thất bại."'
  moi: 'Khung "Khá vững: …" với căn cứ Penley 2002, Cheng 2014 và giới hạn'
  ly_do: Hạ nhãn, hồ sơ n45.
- cu: 'Khung "Vững chắc: cách ta đánh giá tình huống định hình phản ứng stress … phát hiện được lặp lại nhiều nhất … cơ sở của nhiều liệu pháp tâm lý hiệu quả"'
  moi: 'Khung "Khá vững: …" căn cứ Webb 2012, Folkman 1986; bỏ vế liệu pháp'
  ly_do: Hạ nhãn, hồ sơ n46.
- cu: 'Khung "Đang tranh cãi: Forsythe và Compas (1987) tìm thấy sự ủng hộ rõ rệt, nhưng Kendall và Terry (2008) không tìm thấy gì cả … chấp nhận lành mạnh lẫn mong ước viển vông … Các nhà nghiên cứu hiện nay có xu hướng chuyển"'
  moi: '"… ủng hộ ở sự kiện lớn …, Conway và Terry và Zakowski ủng hộ một phần, Kendall và Terry không ủng hộ … Có ý kiến cho rằng … Một số nhà nghiên cứu hiện nay chuyển …"'
  ly_do: Hồ sơ n47, n48.
- cu: 'Các lý thuyết giải thích: "Mô hình giao dịch … phản ứng sinh lý và hành vi khác hẳn … Mọi can thiệp hiệu quả đều phải đi qua cửa đánh giá này."; "Giả thuyết khớp nhau (Folkman, Lazarus, Gruen và DeLongis, 1986; Conway và Terry, 1992) … chỉ tạo thêm thất vọng"; "giải thích vì sao"'
  moi: bỏ câu "Mọi can thiệp …"; "Giả thuyết khớp nhau (Lazarus và Folkman, 1984; được kiểm chứng ở Forsythe và Compas, 1987; Conway và Terry, 1992) … giả thuyết cho rằng … ủng hộ chỉ một phần"; "được đề xuất để giải thích"
  ly_do: Hồ sơ n49–n52.
- cu: 'Áp dụng, nhãn các mục: 1 Vững chắc, 2 Vững chắc, 3 Khá vững, 4 Vững chắc, 5 Khá vững, 6 Vững chắc'
  moi: 1 Khá vững, 2 Khá vững, 3 Đang tranh cãi, 4 Khá vững, 5 Khá vững, 6 Vững chắc (theo đồng thuận của hướng dẫn NHS)
  ly_do: Hồ sơ n54–n59. Khung gộp hai ý theo ý yếu hơn; mục 1, 2 gắn với giả thuyết khớp nhau đang tranh cãi.
- cu: 'Mục 3: "Không thay đổi được → chăm sóc cảm xúc một cách chủ động … tìm ý nghĩa …, chia sẻ cảm xúc …, chăm sóc cơ thể. Đây là đối phó cảm xúc lành mạnh"'
  moi: '"Không thay đổi được → điều chỉnh phản ứng bên trong, nhưng đừng trốn tránh" … "một số nghiên cứu gợi ý … chẳng hạn chấp nhận thực tế"'
  ly_do: Hồ sơ n56. Tiêu đề mục đổi (id tự sinh đổi theo; không có link tới id cũ).
- cu: 'Mục 4: "Đây chính là thành phần nhạy với phản hồi … và cũng là vòng reappraisal trong mô hình gốc"; Mục 5: "sẽ lúng túng … và mạng lưới hỗ trợ xã hội"'
  moi: '"Đây gần với thành phần … và với ý rằng đối phó thay đổi theo đánh giá liên tục"; "có thể lúng túng"; bỏ mạng lưới hỗ trợ xã hội'
  ly_do: Hồ sơ n57, n58.
- cu: 'Mục 6 (tiêu đề "Khi stress vượt quá sức…"): "Nếu stress kéo dài nhiều tuần, đi kèm mất ngủ triền miên, kiệt sức … — và là một chiến lược tốt."'
  moi: '"Khi khó xoay xở với stress, hãy tìm sự giúp đỡ chuyên nghiệp": "Nếu bạn thấy khó xoay xở …, hoặc những cách tự làm không giúp được …"; thêm link Hỗ trợ; "có thể xem là một cách đối phó chủ động"'
  ly_do: Hồ sơ n59, n60; thêm link /psyche/ho-tro/ ở khung Lưu ý quan trọng (n62).
- cu: 'Ở Việt Nam: "Chúng tôi chưa tìm thấy …" (không mốc); "văn hóa Việt Nam đề cao gia đình và cộng đồng … hoặc niềm tin tâm linh"'
  moi: '"Tính đến 11/2026, chúng tôi chưa tìm thấy …"; "Nếu Việt Nam được xem là xã hội thiên về tập thể …" kèm Kuo 2013 và Cheng 2014'
  ly_do: Hồ sơ n64–n67.
- cu: 'Ngộ nhận: "Sai. Khi tình huống không thay đổi được …"; "hành động dai dẳng không những vô ích mà còn tạo thêm thất vọng và tuyệt vọng"; "một trời một vực"'
  moi: '"Không hẳn. …" với Forsythe và Compas, Kendall và Terry, Conway và Terry, Penley; mô hình giao dịch làm mềm'
  ly_do: Hồ sơ n68–n70.
- cu: 'Quiz: đáp án và giải thích của câu 2, 3, 4, 5'
  moi: Làm mềm đồng bộ với thân bài (đánh giá ban đầu/thứ cấp; "được dự đoán", "có bằng chứng lẫn lộn"; "do chấn thương gây ra có thể đi cùng"; "giả định")
  ly_do: Hồ sơ q2–q5.
- cu: 'Mục Nguồn: thiếu Conway và Terry (1992); thiếu DOI của Forsythe và Compas, Kendall và Terry'
  moi: Thêm Conway và Terry, Cheng, Kuo, NHS, Penley, Webb; thêm DOI
  ly_do: Hồ sơ n72.
