  trich: Our research suggests that on the whole these processes tend to be more variable than stable
  vi_tri: Folkman 1986, tr. 578 (Conclusion)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Đối phó vì thế là một quá trình động, không phải một "tính cách" cố định." Chữ mới: "…được xem chủ yếu là một quá trình động, chứ không chỉ là một tính cách cố định." Lý do: cũng bài này nói "people have characteristic ways of appraising and coping" (có phần ổn định), nên "không phải" mạnh hơn nguồn.'
