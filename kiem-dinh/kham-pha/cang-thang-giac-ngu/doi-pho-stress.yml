- id: n22
  cau: 'Họ đề xuất mô hình giao dịch: stress không nằm ở môi trường, cũng không nằm ở con người, mà nằm ở mối quan hệ giữa người và môi trường, mối quan hệ mà người ấy đánh giá là vượt quá nguồn lực của mình và đe dọa sức khỏe tinh thần.'
  loai: dinh-nghia
  nguon:
  - folkman1986
  - finkel2025
  trich: Stress is conceptualized as a relationship between the person and the environment that is appraised by the person as taxing or exceeding his or her resources and as endangering well-being. [Folkman 1986]; Psychological stress is a particular relationship between the person and the environment that is appraised by the person as taxing or exceeding his or her resources and endangering his or her well-being (p.19, l.26). [Finkel 2025]
  vi_tri: Folkman 1986, tr. 572; Finkel 2025, mục 3
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "hệ thống hóa hai thập kỷ nghiên cứu thành mô hình giao dịch … cụ thể là ở cách con người đánh giá mối quan hệ đó". Chữ mới: bỏ "hệ thống hóa hai thập kỷ nghiên cứu" (không kiểm được), nói "mối quan hệ mà người ấy đánh giá là vượt quá nguồn lực … và đe dọa sức khỏe tinh thần". Lý do: khớp định nghĩa nguyên văn; "hai thập kỷ" không có trong nguồn đã mở. "Mô hình giao dịch" (transactional) khớp Folkman 1986, tr. 572.'
- id: n23
  cau: 'Ba ý cốt lõi vẫn còn được dùng đến hôm nay: (1) đánh giá của cá nhân là khâu trung gian then chốt của phản ứng stress; (2) đối phó chủ yếu là quá trình thay đổi theo tình huống, không chỉ là đặc điểm tính cách ổn định; (3) không nên đánh giá một chiến lược đối phó mà không xét bối cảnh dùng nó.'
  loai: phat-hien
  nguon:
  - folkman1986
  trich: it is important not to value a particular form of coping without reference to the context in which it is used
  vi_tri: Folkman 1986, tr. 578
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Ba đóng góp cốt lõi còn nguyên giá trị đến hôm nay: (1) đánh giá … — chứ không phải sự việc khách quan — quyết định phản ứng stress; (2) … không phải một đặc điểm tính cách ổn định; (3) không có chiến lược đối phó nào tốt hay xấu một cách tuyệt đối". Chữ mới nói "vẫn còn được dùng đến hôm nay", "khâu trung gian then chốt", "chủ yếu", "không nên đánh giá … mà không xét bối cảnh". Lý do: "quyết định", "còn nguyên giá trị", "tuyệt đối" mạnh hơn bằng chứng; điểm (3) trong Folkman 1986 là lời khuyên thận trọng của chính các tác giả. Không kiểm được "ba đóng góp cốt lõi" của sách gốc.'
- id: n24
  cau: 'Trước đây đối phó thường được xem là phản ứng đối với cảm xúc; Folkman và Lazarus (1988) đề xuất cách nhìn rộng hơn: cảm xúc và đối phó ảnh hưởng lẫn nhau trong một mối quan hệ động, hai chiều.'
  loai: phat-hien
  nguon:
  - folkman1988
  trich: Historically, coping has been viewed as a response to emotion. Our purpose here is to evaluate this idea and offer a broader view ... a dynamic, mutually reciprocal relationship.
  vi_tri: Tóm tắt (PubMed PMID 3279520)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Trong một bài tổng quan, hai tác giả chỉ ra mối quan hệ hai chiều: cảm xúc không chỉ là kết quả cần đối phó, mà chính cảm xúc cũng định hình cách ta đánh giá và chọn chiến lược — và mỗi nỗ lực đối phó lại làm nảy sinh cảm xúc mới." Chữ mới: bỏ "bài tổng quan" (bài tự nói là đánh giá một ý tưởng và đề xuất cách nhìn rộng hơn) và bỏ chi tiết cơ chế (đánh giá, chọn chiến lược, cảm xúc mới) vì chỉ có tóm tắt. Chỗ này chỉ kiểm được tóm tắt.'
- id: n25
  cau: Vì vậy đừng hình dung đối phó như công thức tuyến tính 'stress → chọn cách → xong'.
  loai: loi-khuyen
