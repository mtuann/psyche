  ly_do: 'Nhãn cho chuẩn mực hợp lý xét theo đồng thuận của văn bản chính thức (chuẩn mục 4 và lời giao), không theo hiệu ứng nghiên cứu. NHS: ''Non-urgent advice: See a GP if: you''re struggling to cope with stress; things you''re trying yourself are not helping you''. Nội dung này là lời khuyên thông thường, không phải khẳng định về hiệu quả điều trị.'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Nếu stress kéo dài nhiều tuần, đi kèm mất ngủ triền miên, kiệt sức, hoặc suy nghĩ làm hại bản thân, đó là lúc cần chuyên gia tâm lý hoặc bác sĩ — không phải thêm một mẹo tự đối phó nào nữa." Chữ mới như trên, thêm link trang Hỗ trợ khi có ý nghĩ làm hại bản thân hoặc cần giúp đỡ khẩn cấp. Lý do: "nhiều tuần", "mất ngủ triền miên, kiệt sức" là ngưỡng không có trong nguồn; NHS dùng "khó xoay xở" và "cách tự làm không giúp". Đã đối chiếu trang Hỗ trợ (src/content/docs/ho-tro/index.md, tầng co-han): 115 cho tình huống nguy hiểm; chưa chạm.'
