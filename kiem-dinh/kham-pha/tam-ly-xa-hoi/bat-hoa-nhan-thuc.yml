    ghi_chu: 'Chữ cũ: "71 sinh viên nam Đại học Stanford" (G1 gợi ý thêm "60 người được phân tích"). Chữ mới thêm "(dữ liệu của 60 người được đưa vào phân tích, 20 người mỗi nhóm)". Trích 2: "There remain, for analysis, 20 Ss in each of the thee conditions" (bản trực tuyến). Review (Claude Sonnet 5.5, 10/11/2026): dung. F&C 1959: 71 sinh viên nam lớp nhập môn ở Stanford, 11 người bị loại, còn 20 người mỗi nhóm.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Festinger/" ]
    review: dung
