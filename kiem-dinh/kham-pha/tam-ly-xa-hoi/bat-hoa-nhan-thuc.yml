    ghi_chu: 'Chữ cũ: "Cách dễ hơn thường là đổi cách nghĩ". Chữ mới: "Khi ấy ta còn có thể đổi cách nghĩ". Lý do: "dễ hơn thường" không có nguồn. Review (Claude Sonnet 5.5, 10/11/2026): dung. OpenStax 12.3: đổi hành vi không còn (ví dụ Joaquin), còn đổi niềm tin.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Festinger/" ]
