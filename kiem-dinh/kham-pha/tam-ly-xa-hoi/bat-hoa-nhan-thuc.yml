    cau: 'Công việc kéo dài khoảng một giờ: nửa giờ xếp 12 chiếc suốt chỉ lên khay, đổ ra rồi xếp lại; nửa giờ sau xoay từng chốt vuông trên tấm bảng, mỗi lần một phần tư vòng.'
    loai: phat-hien
    nguon:
      - fest1959
    trich: The E then removed the tray and spools and placed in front of the S a board containing 48 square pegs. His task was to turn each peg a quarter turn clockwise
    vi_tri: Mục Procedure
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (trước G1): "xoay những chiếc suốt gỗ… hết vòng này đến vòng khác, rồi sắp xếp lại"; trang đã áp sửa G1; chữ "chốt gỗ" còn sót. Chữ mới: "chốt vuông". Lý do: bài chỉ nói "square pegs", không nói gỗ. Cũng đổi "chán ngắt/cực kỳ tẻ nhạt" thành "tẻ nhạt/đơn điệu": bài nói công việc "boring and monotonous". Review (Claude Sonnet 5.5, 10/11/2026): dung. F&C 1959 mục Procedure: 12 spools lên khay, đổ ra, xếp lại nửa giờ; 48 square pegs, mỗi lần quay một phần tư vòng, nửa giờ; chữ trên trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Festinger/" ]
    review: dung
