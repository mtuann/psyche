  - id: n7
    cau: 'Thí nghiệm: 71 sinh viên nam lớp nhập môn tâm lý học ở Stanford; 11 người bị loại, còn 60 người (20 người mỗi nhóm).'
    loai: so-lieu
    nguon:
      - fest1959
    trich: Seventy-one male students in the introductory psychology course at Stanford University were used in the experiment.
    vi_tri: Mục Procedure; Summary of Design
