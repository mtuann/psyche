    trich: In this condition, the average rating was +1.35, considerably on the positive side and significantly different from the Control condition at the .02 level
    vi_tri: Mục Results; Table 1
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ trong bảng: "(vẫn thấy chán)" cho −0,05 và "(thấy khá thú vị!)" cho +1,35. Chữ mới: "(gần mức trung lập)", "(nghiêng về phía thú vị)". Lý do: −0,05 ≈ 0 là trung lập ("slightly and not significantly higher than the Control"), không phải "chán". Số liệu −0,05, +1,35, −0,45: khớp bài và hình festinger-diverging. Review (Claude Sonnet 5.5, 10/11/2026): dung. F&C 1959 bảng 1: −0,05; +1,35; −0,45; 1 đô-la khác đối chứng ở mức .02, 20 đô-la "slightly and not significantly higher than the Control".'
    luot_2: dung
