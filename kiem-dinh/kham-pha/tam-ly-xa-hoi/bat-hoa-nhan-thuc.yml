nhan_dinh:
  - id: n1
    cau: 'Mô tả (description): thí nghiệm 1 đô-la / 20 đô-la của Festinger và Carlsmith (1959), lý thuyết bất hòa nhận thức, và những cách ta tự "chữa cháy" cho quyết định của mình.'
    loai: lich-su
    nguon:
      - fest1959
    trich: COGNITIVE CONSEQUENCES OF FORCED COMPLIANCE
    vi_tri: Tên bài
    ket_qua: dung
    ghi_chu: 'Mô tả của trang; "chữa cháy" là cách nói ví von của trang cho các lối giảm bất hòa (n18). Review (Claude Sonnet 5.5, 10/11/2026): dung. khớp tên bài Festinger & Carlsmith (1959); "chữa cháy" là cách nói ví von cho các lối giảm bất hòa.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Festinger/" ]
    review: dung
  - id: n2
    cau: 'Theo lý thuyết bất hòa nhận thức, khi hành động mâu thuẫn với điều ta nghĩ, ta có thể đổi cách nghĩ thay vì đổi hành động (Tự trải nghiệm: mua đồ đắt tiền, xếp hàng mua trà sữa).'
    loai: phat-hien
    nguon:
      - openstax-bd
    trich: To reduce cognitive dissonance, individuals can change their behavior, as in quitting smoking, or change their belief, such as discounting the evidence that smoking is harmful.
    vi_tri: OpenStax 12.3, chú thích hình 12.11
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Cả hai đều là cùng một cơ chế tâm lý: khi hành động của ta mâu thuẫn với những gì ta nghĩ, ta thường đổi… cách nghĩ, chứ không đổi hành động." Chữ mới: "Theo lý thuyết bất hòa nhận thức, cả hai tình huống đều có thể xuất phát từ cùng một cơ chế… ta có thể đổi…". Lý do: "thường" và "cùng một cơ chế" mạnh hơn nguồn. Hai ví dụ (mua xe, trà sữa) là tình huống giả định (gia-dinh). Review (Claude Sonnet 5.5, 10/11/2026): dung. OpenStax 12.3: đổi hành vi hay đổi niềm tin để giảm bất hòa; câu viết "có thể", ví dụ mua đồ và trà sữa là giả định.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Festinger/", "https://openstax.org/books/psychology-2e/pages/12-3-attitudes-and-persuasion" ]
    luot_2_ghi_chu: Ví dụ tự trải nghiệm (đồ đắt, trà sữa) là ví dụ minh họa, không phải kết quả nghiên cứu.
    review: dung
  - id: n3
    cau: Năm 1959, hai nhà nghiên cứu cho sinh viên làm một việc chán ngắt rồi trả tiền để họ nói dối người khác rằng "việc đó thú vị lắm".
    loai: lich-su
    nguon:
      - fest1959
    trich: We can pay you a dollar (twenty dollars) for doing this
    vi_tri: Mục Procedure, One and Twenty Dollar Conditions
    ket_qua: dung
    ghi_chu: 'G1: khớp. Trích lấy từ lời của người thí nghiệm trong bài. Dùng ở ô thu gọn. Review (Claude Sonnet 5.5, 10/11/2026): dung. F&C 1959 (psychclassics, mở lại): nhóm 20 đô-la và 1 đô-la được trả để nói công việc thú vị với người chờ (thật ra là người của nhóm thí nghiệm).'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Festinger/" ]
    review: dung
  - id: n4
    cau: Nhóm được trả 1 đô-la về sau đánh giá công việc thú vị hơn nhóm được trả 20 đô-la, chênh lệch có ý nghĩa thống kê.
    loai: phat-hien
    nguon:
      - fest1959
    trich: The difference between the One Dollar and Twenty Dollar conditions is significant at the .03 level (t = 2.22).
    vi_tri: Mục Results, How Enjoyable the Tasks Were
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thú vị hơn hẳn nhóm 20 đô-la". Chữ mới: "thú vị hơn nhóm… với chênh lệch có ý nghĩa thống kê". Lý do: p < 0,03 (t = 2,22), "hơn hẳn" mạnh hơn nguồn. Cùng sửa ở bảng và đáp án quiz 1. Review (Claude Sonnet 5.5, 10/11/2026): dung. F&C 1959 mục Results: "difference between the One Dollar and Twenty Dollar conditions is significant at the .03 level (t = 2.22)".'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Festinger/" ]
    review: dung
  - id: n5
    cau: 'Festinger (1957) đề xuất lý thuyết bất hòa nhận thức: ta có nhu cầu giữ cho niềm tin, thái độ và hành vi nhất quán; khi chúng mâu thuẫn ta thấy khó chịu và tìm cách chỉnh lại.'
    loai: dinh-nghia
    nguon:
      - openstax-bd
      - fest1959
    trich: Psychologist Leon Festinger (1957) defined cognitive dissonance as psychological discomfort arising from holding two or more inconsistent attitudes, behaviors, or cognitions
    vi_tri: OpenStax 12.3, mục Cognitive Dissonance?
    ket_qua: dung
    ghi_chu: '"Như một nốt nhạc lạc điệu" là ví von. Sách 1957 không mở được; đối chiếu qua OpenStax và phần mở đầu của Festinger & Carlsmith (1959). Review (Claude Sonnet 5.5, 10/11/2026): dung. OpenStax 12.3 định nghĩa Festinger (1957); "nốt nhạc lạc điệu" là ví von, đã ghi.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Festinger/", "https://openstax.org/books/psychology-2e/pages/12-3-attitudes-and-persuasion" ]
    luot_2_ghi_chu: Sách Festinger 1957 không mở; định nghĩa khớp OpenStax và phần lý thuyết của bài 1959.
    review: dung
  - id: n6
    cau: Khi hành vi đã xảy ra, ta không đổi được nó; ta còn có thể đổi cách nghĩ ("thật ra việc đó cũng thú vị mà").
    loai: phat-hien
    nguon:
