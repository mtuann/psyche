    ghi_chu: 'Chữ cũ: "chỉ lối đầu tiên làm ta đúng hơn. Ba lối còn lại là những cách tự dỗ mình rất hiệu quả — và đó chính là lý do ta khó đổi ý". Chữ mới: bỏ "đúng hơn", "rất hiệu quả", "chính là lý do"; ghi là diễn giải theo lý thuyết. Lý do: nguồn chỉ nói ta có động lực giảm bất hòa; không nói các lối đó "hiệu quả" hay là lý do khó đổi ý. Review (Claude Sonnet 5.5, 10/11/2026): dung. câu đã ghi là diễn giải theo lý thuyết, dùng "có thể".'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Festinger/" ]
    luot_2_ghi_chu: Chỉ nói 'có thể'; không có nguồn thực nghiệm về 'khó đổi ý sau khi chọn' trong bài này, nhưng câu tự ghi là diễn giải lý thuyết.
    review: dung
  - id: n26
    cau: "Khi mua sắm: theo lý thuyết, khi một lựa chọn đã xong mà không đổi được, ta có thể giảm khó chịu bằng cách đổi cách nghĩ về nó (OpenStax minh họa bằng người lính nhập ngũ không thể rời đi); áp vào chuyện mua đồ là suy luận từ lý thuyết, chưa kiểm trực tiếp, và không cho biết món đồ tốt hay dở."
    loai: loi-khuyen
    nguon:
      - openstax-bd
    trich: The last option, a change of behaviors, is not available to Joaquin. ... Joaquin can change his beliefs or attitudes.
    vi_tri: OpenStax 12.3, ví dụ Joaquin (chọn con đường khó rồi đổi niềm tin)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Câu hỏi này không làm món đồ tốt lên, nhưng giúp lần mua sau sáng suốt hơn." Chữ mới: "Gợi ý này suy ra từ lý thuyết bất hòa, chưa được kiểm trực tiếp." Lý do: "giúp mua sáng suốt hơn" chưa có bằng chứng. Review (Claude Sonnet 5.5, 10/11/2026): sai (lời khuyên không nguồn): "hãy dừng lại và tự hỏi: mình khen vì nó tốt hay vì đã trả tiền" là lời khuyên chưa có bằng chứng. Đã viết lại thành mô tả theo lý thuyết (OpenStax 12.3, ví dụ người lính nhập ngũ không rời được, tự đổi niềm tin) và ghi suy luận cho chuyện mua đồ, bỏ lời khuyên.'
    luot_2: khong-chac
    luot_2_ghi_chu: Lời khuyên dựa trên giả định 'ta bênh món đồ vừa mua'; không mở được nguồn bậc 1–2 kiểm điều đó (nguồn cổ điển là mô hình lựa chọn tự do, có tranh cãi về phương pháp). Trang đã ghi 'chưa kiểm trực tiếp'.
    review: sai
  - id: n27
    cau: 'Trong tranh luận: khi ai đó bị dồn vào chân tường mà vẫn cố thủ, theo lý thuyết có thể họ đang giảm cảm giác "mình đã sai", chứ không nhất thiết là "cứng đầu"; suy luận từ lý thuyết, chưa kiểm trực tiếp.'
    loai: loi-khuyen
    nguon:
      - openstax-bd
    trich: we are motivated to decrease it because it is psychologically, physically, and mentally uncomfortable
    vi_tri: OpenStax 12.3
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Có thể họ đang bảo vệ chính mình khỏi cảm giác ''mình đã sai''. Cách hiệu quả hơn cãi thắng: cho họ một lối thoát giữ thể diện". Chữ mới: thêm "Theo lý thuyết" và "gợi ý suy ra từ lý thuyết (chưa kiểm trực tiếp)". Lý do: "hiệu quả hơn" không có nguồn. Review (Claude Sonnet 5.5, 10/11/2026): sai (lời khuyên không nguồn): "cho họ một lối thoát giữ thể diện" chưa có nguồn kiểm hiệu quả. Đã bỏ lời khuyên và câu mẫu, giữ phần mô tả theo lý thuyết.'
    luot_2: khong-chac
    luot_2_ghi_chu: Lời khuyên 'cho lối thoát giữ thể diện' suy từ lý thuyết, không nguồn bậc 1–2 nào mở được kiểm điều này; trang đã ghi 'chưa kiểm trực tiếp'.
    review: sai
  - id: n28
    cau: 'Với chính mình: nhận ra cơ chế này không giúp ta hết bị bất hòa; nó giúp phân biệt lý do thật với lý do ta bịa ra để tự an ủi.'
    loai: loi-khuyen
    nguon:
      - openstax-bd
    trich: In this type of situation, people can change their beliefs, their attitudes, or their behaviors.
    vi_tri: OpenStax 12.3
    ket_qua: da-bo
    ghi_chu: 'Giữ nguyên chữ của trang. Câu mô tả hệ quả của việc nhận ra cơ chế; không có nghiên cứu đo điều này. Làm mềm: đã có câu "gợi ý suy ra từ lý thuyết" ở hai gợi ý kề trước; câu này là lời nhận xét chung, nên ghi chú là suy luận. Chỗ khó cho review: có thể bỏ nếu cho là thừa. Review (Claude Sonnet 5.5, 10/11/2026): sai (không nguồn): "nhận ra cơ chế giúp phân biệt lý do thật với lý do bịa" và "nó là một phần của con người" không có nguồn. Đã bỏ cả gạch đầu dòng "Với chính mình" khỏi trang.'
    luot_2: khong-chac
    luot_2_ghi_chu: Hai vế ('nhận ra cơ chế không giúp hết bất hòa'; 'giúp phân biệt lý do thật với lý do bịa') không có nguồn bậc 1–2 mở được.
    review: sai
  - id: n29
    cau: Theo lý thuyết, bất hòa chỉ xuất hiện khi hành vi mâu thuẫn với điều quan trọng với hình ảnh bản thân; mô hình tuân thủ bị ép buộc dựa vào cảm giác được tự chọn; nhưng đợt tái lập 2024 không thấy quyền chọn tạo khác biệt.
    loai: phat-hien
    nguon:
      - openstax-bd
      - vaidis2024
    trich: Later research documented that only conflicting cognitions that threaten individuals' positive self-image cause dissonance (Greenwald & Ronis, 1978).
    vi_tri: OpenStax 12.3; Vaidis 2024, Thảo luận
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (Giới hạn): "Bất hòa mạnh nhất khi hành vi là tự nguyện… và khi vấn đề quan trọng với bản thân. Với những chuyện ta không quan tâm, chẳng có bất hòa nào để mà giảm." (G1: không dẫn nguồn). Chữ mới: dẫn OpenStax về hình ảnh bản thân; nêu rõ đợt 2024 không thấy tác động của quyền chọn, nên là dự đoán lý thuyết. Lý do: điều kiện "tự nguyện" không còn được ủng hộ ở đợt tái lập lớn. Cùng sửa ở quiz 3. Review (Claude Sonnet 5.5, 10/11/2026): dung. OpenStax 12.3 (Greenwald & Ronis 1978: chỉ nhận thức mâu thuẫn đe dọa hình ảnh bản thân mới gây bất hòa); Vaidis 2024 không thấy tác động của quyền chọn, trang ghi "dự đoán của lý thuyết" là đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/12-3-attitudes-and-persuasion", "http://gala.gre.ac.uk/id/eprint/45716/7/45716_EVANS_A_multilab_replication_of_the_induced_compliance_paradigm_of_cognitive_dissonance.pdf" ]
    review: dung
  - id: n30
    cau: Thí nghiệm gốc dùng sinh viên Stanford năm 1959.
    loai: lich-su
    nguon:
      - fest1959
    trich: Seventy-one male students in the introductory psychology course at Stanford University were used in the experiment.
    vi_tri: Mục Procedure
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "sinh viên Mỹ năm 1959, với số tiền 1 và 20 đô-la mang ý nghĩa rất cụ thể trong bối cảnh đó". Chữ mới: "sinh viên Stanford". Lý do: bài ghi Stanford; "ý nghĩa rất cụ thể" của số tiền không có trong bài (n11). Review (Claude Sonnet 5.5, 10/11/2026): dung. F&C 1959: sinh viên nam lớp nhập môn ở Stanford; bài đăng 1959.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Festinger/" ]
    luot_2_ghi_chu: Bài đăng 1959 (J. Abnormal and Social Psychology).
    review: dung
  - id: n31
    cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào lặp lại đúng mô hình này (tuân thủ bị ép buộc) với người Việt.
    loai: thoi-su
    nguon:
      - tim-kiem-vn
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chúng tôi chưa tìm thấy nghiên cứu nào…". Chữ mới thêm mốc. Tìm 10/11/2026 trên Crossref: "cognitive dissonance Vietnamese students forced compliance" (xem lần tìm ở báo cáo); không thấy nghiên cứu thực nghiệm kiểu F&C với người Việt. Chưa tìm Google Scholar hay tạp chí trong nước. Review (Claude Sonnet 5.5, 10/11/2026): dung. thời sự có mốc 11/2026, hạn 2027-11-01, nguồn tim-kiem-vn; câu chỉ nói "chưa tìm thấy".'
    het_han: '2027-11-01'
    luot_2: dung
    luot_2_nguon: [ "https://api.crossref.org/works?query=cognitive%20dissonance%20induced%20compliance%20Vietnamese&rows=6" ]
    luot_2_ghi_chu: Ngày kiểm 2026-11-10; tìm kiếm hạn chế (Crossref), câu là 'chưa tìm thấy'.
    review: dung
  - id: n32
    cau: 'Ví dụ giả định: người đã theo một "thầy" chữa bệnh có thể khó thừa nhận phương pháp đó không hiệu quả vì thừa nhận là nhìn nhận một lựa chọn tốn kém là sai lầm (suy luận từ lý thuyết, chưa phải kết quả nghiên cứu trên người Việt).'
    loai: phat-hien
    nguon:
      - openstax-bd
    trich: Joaquin can change his beliefs or attitudes.
    vi_tri: OpenStax 12.3
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "cơ chế ''bênh'' quyết định của mình là điều dễ quan sát trong đời sống Việt Nam: từ việc bảo vệ quan điểm… Văn hóa coi trọng ''giữ thể diện'' có thể khiến…". Chữ mới: bỏ khẳng định "dễ quan sát trong đời sống Việt Nam" (không nguồn), đặt ví dụ là giả định và điều kiện "Nếu văn hóa coi trọng…". Đã ghi rõ là suy luận. Review (Claude Sonnet 5.5, 10/11/2026): sai (suy đoán không nguồn): "nếu văn hóa coi trọng giữ thể diện, lối thoát 3 và 4 dễ được chọn hơn" không suy ra được từ lý thuyết hay nguồn nào. Đã bỏ câu ấy khỏi trang; giữ ví dụ giả định (gia-dinh) và câu "suy luận từ lý thuyết".'
    luot_2: khong-chac
    luot_2_ghi_chu: Ví dụ giả định kèm suy đoán văn hóa ('giữ thể diện' khiến lối thoát 3 và 4 dễ được chọn hơn) không có nguồn bậc 1–2; trang đã ghi suy luận từ lý thuyết.
    review: sai
  - id: n33
    cau: 'Ngộ nhận "Thưởng càng nhiều thì càng đổi thái độ": thí nghiệm gốc thấy nhóm 20 đô-la không khác nhóm đối chứng về mặt thống kê, nhóm 1 đô-la thì khác; theo lý thuyết, phần thưởng lớn là lý do để không cần đổi thái độ.'
    loai: phat-hien
    nguon:
      - fest1959
    trich: The average rating in this condition is only -.05, slightly and not significantly higher than the Control condition. The difference between the One Dollar and Twenty Dollar conditions is significant at the .03 level ( t = 2.22).
    vi_tri: Mục Results
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Thí nghiệm này cho thấy điều ngược lại trong một số điều kiện: phần thưởng quá lớn cho người ta lý do để không cần đổi thái độ." Chữ mới: nêu kết quả thí nghiệm gốc và để vế lý do là "theo lý thuyết". Lý do: "một số điều kiện" không rõ; kết quả là của một thí nghiệm, nay gắn nhãn tranh cãi (n15). Review (Claude Sonnet 5.5, 10/11/2026): sai (quá mạnh): "nhóm 20 đô-la không đổi thái độ" mạnh hơn nguồn: F&C 1959 nói nhóm 20 đô-la (−0,05) "slightly and not significantly higher than the Control" (−0,45). Đã sửa thành "không khác nhóm đối chứng về mặt thống kê, còn nhóm 1 đô-la thì khác".'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Festinger/" ]
    review: sai
  - id: n34
    cau: 'Ngộ nhận "Tôi luôn nhìn nhận quyết định của mình khách quan": đợt tái lập 2024 thấy thái độ của người viết bài trái quan điểm dịch về phía điều họ đã viết; theo lý thuyết bất hòa đó là dấu hiệu ta không phải lúc nào cũng nhìn điều mình đã làm một cách khách quan; lý thuyết tự tri giác giải thích khác nên cơ chế còn tranh cãi.'
    loai: phat-hien
    nguon:
      - vaidis2024
      - openstax-bd
    trich: Participants became more in favor of the essay topic after writing counterattitudinal arguments.
    vi_tri: Vaidis 2024, Thảo luận
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Sau khi đã chọn, ta có xu hướng tự động ''làm đẹp'' cho lựa chọn của mình và ''bôi xấu'' phương án bị loại." Chữ mới: câu trên. Lý do: "làm đẹp lựa chọn, bôi xấu phương án loại" là mô hình lựa chọn khó khăn, không có nguồn đã mở; kết luận chung hạ về mức nguồn đã mở nói. Review (Claude Sonnet 5.5, 10/11/2026): sai (quá mạnh): "Nhiều nghiên cứu cho thấy … nên ta không phải lúc nào cũng khách quan" nhảy từ thái độ dịch theo hành vi sang "không khách quan", trong khi tự tri giác (Bem) giải thích cùng kết quả như suy luận hợp lý. Chỉ nguồn đã mở là Vaidis 2024. Đã sửa: nêu kết quả 2024, nói đó là dấu hiệu theo lý thuyết bất hòa, cơ chế còn tranh cãi.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Festinger/", "http://gala.gre.ac.uk/id/eprint/45716/7/45716_EVANS_A_multilab_replication_of_the_induced_compliance_paradigm_of_cognitive_dissonance.pdf" ]
    review: sai
  - id: n35
    cau: 'Nhãn của ngộ nhận trên: Đã bị bác bỏ ("luôn khách quan" là khẳng định tuyệt đối đã bị bác).'
    loai: nhan
    nguon:
      - vaidis2024
      - openstax-bd
    ket_qua: da-bo
    ghi_chu: 'Đây là nhãn của ngộ nhận (niềm tin sai) như ở các trang Trí nhớ. Chỗ khó: ngộ nhận nói "luôn"; bằng chứng bác bỏ là bằng chứng bất hòa vừa nêu (tranh cãi về độ mạnh), nên nhãn Đã bị bác bỏ chỉ đứng ở mức "luôn khách quan" sai, không ở mức cơ chế. Nếu thẻ trong ngo-nhan.yml ghi khác thì khớp thẻ. Review (Claude Sonnet 5.5, 10/11/2026): sai (nhãn không đạt thước đo): nhãn Đã bị bác bỏ đòi các kiểm tra đủ mạnh liên tục thất bại hay bằng chứng gốc không còn giá trị (mục 4); chỉ có Vaidis 2024 và OpenStax, và cơ chế chính lại đang tranh cãi (n23), nên nhãn này mâu thuẫn với phần còn lại của trang. Đã bỏ chip nhãn khỏi ngộ nhận này, dùng chữ "Chưa chắc" (xem n34).'
    nhan: bac-bo
    co_so:
      - vaidis2024
      - openstax-bd
    ly_do: Khẳng định tuyệt đối "luôn nhìn nhận quyết định của mình một cách khách quan" bị bác bởi bằng chứng thái độ dịch theo hành vi (Vaidis 2024; OpenStax); nhận định nhãn xét theo khẳng định của ngộ nhận chứ không theo cơ chế.
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Festinger/", "http://gala.gre.ac.uk/id/eprint/45716/7/45716_EVANS_A_multilab_replication_of_the_induced_compliance_paradigm_of_cognitive_dissonance.pdf" ]
    luot_2_ghi_chu: Nhãn Đã bị bác bỏ áp cho khẳng định tuyệt đối 'luôn khách quan'; chấp nhận được vì chỉ cần phản ví dụ, nhưng khác nghĩa với 'bác bỏ sau nhiều lần kiểm thất bại' ở thước đo mục 4.
    review: sai
  - id: n36
    cau: 'Ngộ nhận "Người cố chấp là người thiếu thông minh": ở thiên kiến "bênh phía mình", người có năng lực nhận thức cao không ít thiên kiến hơn (Stanovich và West, 2008); theo lý thuyết bất hòa điều bị đe dọa là hình ảnh bản thân.'
    loai: phat-hien
    nguon:
      - stanovich2008
      - openstax-bd
    trich: we failed to find that participants of higher cognitive ability displayed less myside bias or less one-side bias
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Cố thủ sau khi đã chọn là cơ chế tâm lý phổ biến, xảy ra với cả người thông minh. Vấn đề không nằm ở trí tuệ mà ở nhu cầu bảo vệ hình ảnh bản thân." Chữ mới: câu trên. Lý do: không nguồn cho "phổ biến" và "xảy ra với cả người thông minh" ở cố thủ sau lựa chọn; nguồn gần nhất là thiên kiến bênh phía mình (chỉ đọc tóm tắt). Review (Claude Sonnet 5.5, 10/11/2026): dung. Stanovich & West (2008), tóm tắt: không thấy người năng lực nhận thức cao ít thiên kiến "bênh phía mình"; trang nói rõ "ở một dạng gần"; "hình ảnh bản thân" theo OpenStax.'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1037/0022-3514.94.4.672" ]
    review: dung
  - id: n37
    cau: Xem thêm các ngộ nhận khác ở trang Ngộ nhận.
