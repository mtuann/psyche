    ghi_chu: 'Chữ cũ: nhãn Vững chắc: "hàng chục năm nghiên cứu với nhiều mô hình khác nhau (lựa chọn khó khăn, nỗ lực bỏ ra, niềm tin bị phản bác) phần lớn cho thấy cùng một khuynh hướng… Đây là một trong những ý tưởng được kiểm tra nhiều nhất của tâm lý học xã hội." Chữ mới: nhãn Khá vững, nêu cả kết quả ủng hộ và hạn chế. Lý do: không có phân tích tổng hợp trong nguồn đã mở (Vững chắc cần ít nhất một tổng hợp hay hai tái lập có đăng ký trước cùng chiều, mục 4); đợt tái lập lớn không thấy tác động của quyền chọn; "ba mô hình" và "được kiểm tra nhiều nhất" không có nguồn, thay bằng câu của Vaidis ("applied to a wide variety of situations…"). Review (Claude Sonnet 5.5, 10/11/2026): sai (không kiểm được): vế "chưa có phân tích tổng hợp chung cho các mô hình" là khẳng định về điều không tồn tại, chỉ dựa vào một lần tìm Crossref ngắn; có thể sai. Đã bỏ vế đó khỏi trang; nhãn Khá vững dựa vào: nhiều mô hình cùng chiều, tái lập lớn thấy thái độ thuận hơn khi viết bài trái quan điểm so với bài trung tính (nhưng hiệu ứng nhỏ, không phụ thuộc quyền chọn), và nhận xét của Sleegers và cộng sự (2024) về mẫu nhỏ, thiếu thực hành khoa học mở. Đạt "Khá vững" mục 4; không đạt "Vững chắc" vì mô hình tuân thủ bị ép buộc đã thất bại ở phần quan trọng nhất. Nhãn chốt: Khá vững.'
