  - id: n15
    cau: 'Khung Vững chắc: một nhóm nhất trí có thể làm lệch phán đoán công khai, kể cả với bài toán rõ ràng.'
    loai: nhan
    nguon:
      - bond1996
      - franzen2023
      - asch1956
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hiệu ứng Asch đã được lặp lại nhiều lần, ở nhiều nước, trong nhiều thập kỷ. Thiết kế thí nghiệm chặt chẽ (nhóm đối chứng sai dưới 1%) khiến kết quả khó bị giải thích bằng cách khác." Chữ mới: số cụ thể (133 nghiên cứu, 17 nước, lần làm lại 2023), nêu mức hùa theo giảm theo thời gian và khác nhau giữa văn hóa. Lý do: khớp khung nhãn của trang nhà thi-nghiem/asch; bỏ "nhiều thập kỷ" không đếm được. Review (Claude Sonnet 5.5, 10/11/2026): dung. Nhãn Vững chắc chốt: phân tích tổng hợp 133 nghiên cứu, 17 nước, cùng chiều, cộng một lần làm lại 2023 khớp bản gốc; không có thất bại tái lập lớn; giới hạn (giảm theo thời gian, khác theo văn hóa) đã nêu trên trang. Đạt thước đo mục 4, khớp nhãn trang nhà thi-nghiem/asch.'
    nhan: vung-chac
    co_so:
      - bond1996
      - franzen2023
      - asch1956
    ly_do: 'Khớp nhãn của trang nhà thi-nghiem/asch (đã khóa, cùng nhãn): có một phân tích tổng hợp (Bond & Smith 1996, 133 nghiên cứu, 17 nước, cùng chiều, mức khác nhau) và một lần làm lại năm 2023 (Franzen & Mader, lỗi 33%) khớp bản gốc; không có thất bại tái lập lớn nào trong nguồn đã mở. Giới hạn ghi trên trang: mức hùa theo giảm dần theo thời gian và khác giữa các nền văn hóa.'
    luot_2: dung
    luot_2_nguon: [ "https://eclass.uowm.gr/modules/document/file.php/NURED262/%CE%A0%CE%A1%CE%A9%CE%A4%CE%9F%CE%A4%CE%A5%CE%A0%CE%91%20%CE%91%CE%A1%CE%98%CE%A1%CE%91/Asch%20studies%20in%20independence%20and%20conformity%201956%20PM.pdf", "https://d-r-b-o-b.github.io/teaching/web_PSY333/Week_12/Ashe_meta.pdf" ]
    luot_2_ghi_chu: "Nhãn Vững chắc phù hợp thước đo mục 4: có phân tích tổng hợp cùng chiều ở nhiều quần thể; mức độ giảm dần theo thời gian và khác giữa văn hóa nhưng hiệu ứng còn."
    review: dung
  - id: n16
    cau: Khi một người cùng phòng nói đúng, áp lực của nhóm sụt mạnh (Asch).
    loai: phat-hien
    nguon:
      - asch1955
    trich: The presence of a supporting partner depleted the majority of much of its power.
    vi_tri: Asch 1955
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: khung "Khá vững" riêng về "nhóm khoảng 3 người là đủ tạo áp lực tối đa" và "một người phá vỡ sự nhất trí làm phù hợp giảm mạnh". Chữ mới: chỉ còn ý nhất trí là điều kiện then chốt, trong khung Vững chắc, trỏ về trang nhà. Lý do: "3 người là đủ" bị thách thức (Bond & Smith 1996, n14); khung riêng không có trên trang nhà. Review (Claude Sonnet 5.5, 10/11/2026): dung. Asch 1955 (bản Columbia, mở lại): "The presence of a supporting partner depleted the majority of much of its power"; errors còn một phần tư; trang nói "áp lực sụt mạnh" và trỏ về trang nhà.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/solomon-asch_confirmaty/solomon_original_djvu.txt" ]
    luot_2_ghi_chu: Phần này nằm trong Asch 1955/1951, không có trong chuyên khảo 1956.
    review: dung
  - id: n17
    cau: 'Khung Khá vững: văn hóa tập thể hùa theo nhiều hơn văn hóa cá nhân; tương quan cấp quốc gia, không phải thí nghiệm ngẫu nhiên.'
    loai: nhan
    nguon:
      - bond1996
    trich: Collectivist countries tended to show higher levels of conformity than individualist countries.
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: khung "Đang tranh cãi: phù hợp có thật sự cao hơn ở các nước cộng đồng?", gồm "Một số nghiên cứu sau đó không tìm thấy khác biệt khi so sánh trực tiếp vài nước" và "bị nhiều người cho là quá thô". Chữ mới: nhãn Khá vững như trang nhà thi-nghiem/asch, bỏ câu không nguồn, thay bằng phê bình mà B&S nêu lại (n18). Lý do: nhãn và số phải khớp trang nhà; không có nguồn đã mở cho "nhiều nghiên cứu không thấy khác biệt". Review (Claude Sonnet 5.5, 10/11/2026): dung. Nhãn Khá vững chốt: một phân tích tổng hợp cùng chiều nhưng chỉ có tương quan cấp quốc gia, chưa có tái lập riêng; đúng "nhiều nghiên cứu cùng chiều nhưng còn giới hạn" của mục 4.'
    nhan: kha-vung
    co_so:
      - bond1996
    ly_do: 'Khớp nhãn trang nhà thi-nghiem/asch: một phân tích tổng hợp, cùng chiều ở cả ba thang đo văn hóa, nhưng chỉ có dữ liệu tương quan cấp quốc gia (không thí nghiệm ngẫu nhiên), mẫu chủ yếu sinh viên, chưa có tái lập riêng cho mối liên hệ văn hóa.'
    luot_2: dung
    luot_2_nguon: [ "https://d-r-b-o-b.github.io/teaching/web_PSY333/Week_12/Ashe_meta.pdf" ]
    luot_2_ghi_chu: "Nhãn Khá vững phù hợp: nhất quán qua ba khảo sát nhưng tương quan cấp quốc gia."
