    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/solomon-asch_confirmaty/solomon_original_djvu.txt" ]
    review: dung
  - id: n43
    cau: "Quiz 3: Bond và Smith thấy mức phù hợp ở Mỹ giảm kể từ những năm 1950; mức phù hợp đo bằng bài này không phải hằng số bất biến, thấp dần theo thời gian trong các nghiên cứu ở Mỹ (Bond và Smith mô tả xu hướng, không giải thích nguyên nhân)."
    loai: phat-hien
    nguon:
      - bond1996
    trich: An analysis of U.S. studies found that conformity has declined since the 1950s.
    vi_tri: Tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ (câu giải thích): "hiệu ứng Asch không phải hằng số bất biến của con người, mà thay đổi theo thời đại". Chữ mới trên trang giữ ý này; B&S nói mức phù hợp giảm trong các nghiên cứu ở Mỹ, không nói nguyên nhân (n12). Giữ vì chỉ là hệ quả mô tả. Review (Claude Sonnet 5.5, 10/11/2026): sai (quá mạnh): "hiệu ứng Asch không phải hằng số bất biến của con người, mà thay đổi theo thời đại" khái quát hơn nguồn: Bond & Smith chỉ thấy mức phù hợp thấp dần theo thời gian trong các nghiên cứu ở Mỹ và không giải thích nguyên nhân. Đã sửa giải thích quiz theo đúng phạm vi.'
    luot_2: dung
    luot_2_nguon: [ "https://d-r-b-o-b.github.io/teaching/web_PSY333/Week_12/Ashe_meta.pdf" ]
    review: sai
  - id: n44
    cau: 'Quiz 4: mối liên hệ "văn hóa cộng đồng → phù hợp cao hơn" chỉ được gắn nhãn Khá vững vì là tương quan cấp quốc gia, không chứng minh văn hóa gây ra phù hợp; thấy ở cả ba cách đo, nhưng B&S nêu lại phê bình cách chia cộng đồng/cá nhân.'
    loai: phat-hien
    nguon:
      - bond1996
    trich: individualism-collectivism has been criticized for being a higher order abstraction which glosses over important distinctions
    vi_tri: Mục Theoretical Implications
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: câu hỏi "chỉ được gắn nhãn Đang tranh cãi", đáp án đúng "… và một số nghiên cứu sau không tìm thấy khác biệt", giải thích "quá thô". Chữ mới: câu hỏi và đáp án đổi theo nhãn Khá vững (n17), phương án nhiễu mới "chỉ thấy ở một cách đo văn hóa duy nhất" (sai theo n13). Lý do: nhãn khớp trang nhà. Review (Claude Sonnet 5.5, 10/11/2026): dung. nhãn Khá vững khớp n17; phương án nhiễu "chỉ thấy ở một cách đo" sai đúng theo n13.'
    luot_2: dung
    luot_2_nguon: [ "https://d-r-b-o-b.github.io/teaching/web_PSY333/Week_12/Ashe_meta.pdf" ]
    review: dung
  - id: n45
    cau: 'Quiz 5: viết ý kiến của mình ra trước khi nghe nhóm giúp có một "bản ghi" của riêng bạn; gợi ý rút từ biến thể trả lời bằng văn bản của Asch (mẫu nhỏ), chưa kiểm trực tiếp trong cuộc họp.'
    loai: loi-khuyen
    nguon:
      - asch1956
    trich: There were fourteen subjects in this variation.
    vi_tri: Thí nghiệm 4
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "tương tự vai trò của người phá vỡ sự nhất trí trong thí nghiệm Asch". Chữ mới: dẫn biến thể văn bản, nêu mẫu nhỏ, chưa kiểm trực tiếp. Lý do: Asch không nói viết trước tương đương người phá vỡ nhất trí (n26). Review (Claude Sonnet 5.5, 10/11/2026): dung. Câu quiz nêu rõ gợi ý rút từ biến thể mẫu nhỏ, chưa kiểm trực tiếp; sau sửa ở n26, giải thích quiz không nói quá.'
    luot_2: dung
    luot_2_nguon: [ "https://eclass.uowm.gr/modules/document/file.php/NURED262/%CE%A0%CE%A1%CE%A9%CE%A4%CE%9F%CE%A4%CE%A5%CE%A0%CE%91%20%CE%91%CE%A1%CE%98%CE%A1%CE%91/Asch%20studies%20in%20independence%20and%20conformity%201956%20PM.pdf" ]
    luot_2_ghi_chu: Mẫu nhỏ đúng như câu viết.
    review: dung
  - id: n46
    cau: Hộp "Tóm tắt nhanh" (::tom-tat) dựng từ ý chính của các khung nhãn của trang.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: thành phần ::tom-tat đọc các khung vung-chac, kha-vung trong trang (src/plugins/thanh-phan.mjs). Review (Claude Sonnet 5.5, 10/11/2026): dung. Chỉ nói về site: ::tom-tat dựng từ ý chính các khung nhãn (src/plugins/thanh-phan.mjs); trang có ::tom-tat.'
    review: dung
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: Phần kể lại thí nghiệm Asch (thiết kế, bảng 1% / 36,8%, 75%/25%, mục "Asch thay đổi các điều kiện")
    moi: Một câu tóm tắt và link trang thi-nghiem/asch
    ly_do: Asch có trang nhà đã khóa; Đợt 5 rút gọn phần kể lại (n9).
  - cu: Khung "Khá vững" về quy mô nhóm và sự nhất trí; khung "Đang tranh cãi" về văn hóa
    moi: Khung Vững chắc (gộp ý nhất trí) và khung Khá vững về văn hóa
    ly_do: Nhãn khớp trang nhà (n15–n17).
  - cu: '"Ảnh hưởng của văn hóa thậm chí lớn hơn cả ảnh hưởng của quy mô nhóm"'
    moi: '"Ngoài văn hóa, quy mô nhóm cũng có liên hệ với mức phù hợp"'
    ly_do: B&S không so độ lớn (n14).
  - cu: '"…thí nghiệm dưới đây được thiết kế để tách chúng ra"'
    moi: '"Thí nghiệm dưới đây chọn một bài toán mà đáp án rất rõ…"'
    ly_do: n8.
  - cu: '"nam sinh viên Mỹ… bài đo không có hậu quả thật… ngoài đời… ít làm theo hơn"'
    moi: '"nam sinh viên đại học…"; mơ hồ hơn thì làm theo nhiều hơn (B&S)'
    ly_do: n29, n30.
  - cu: '"Chúng tôi chưa tìm thấy nghiên cứu nào…"; "Việt Nam thường được xếp vào nhóm cộng đồng"'
    moi: '"Tính đến 11/2026…"; "Nếu Việt Nam thuộc nhóm…"'
    ly_do: n31, n33.
  - cu: 'Ngộ nhận 1: "…phần lớn trong số họ cũng từng nghĩ như bạn"; ngộ nhận 3: "Phần lớn người hay làm theo…"'
    moi: Bỏ vế không nguồn; "Nhiều người hay làm theo…"
    ly_do: n35, n37.
  - cu: '"Hầu hết chúng ta đã từng ở trong tình huống này…"'
    moi: '"Câu hỏi là: nếu bạn chọn phương án thứ hai, vì sao…"'
    ly_do: n2.
  - cu: '"Hơn bốn mươi năm sau, Rod Bond và Peter Smith gộp 133 nghiên cứu…"'
    moi: '"Khoảng bốn mươi năm sau, …"'
    ly_do: "Review n11: 1956 đến 1996 là đúng 40 năm."
  - cu: '"…nơi trả lời bằng văn bản làm số lỗi giảm (mẫu chỉ 14 người; …)"'
    moi: '"…làm số lỗi giảm còn khoảng một phần ba (mẫu chỉ 14 người, nên chính Asch nói chưa chứng minh được chênh lệch bằng thống kê; …)"'
    ly_do: "Review n26: Asch 1956 thí nghiệm 4."
  - cu: '"hàng nghìn đánh giá có sẵn … Đọc thêm vài đánh giá thấp điểm giúp bạn có một góc nhìn khác."'
    moi: '"các đánh giá có sẵn … Đây chỉ là phép loại suy với thí nghiệm Asch…: Asch không thử đánh giá trực tuyến."'
    ly_do: "Review n27: lời khuyên không nguồn."
  - cu: 'Giải thích quiz 3: "Đây là một phát hiện thú vị: hiệu ứng Asch không phải hằng số bất biến của con người, mà thay đổi theo thời đại."'
    moi: '"Mức phù hợp đo bằng bài này không phải hằng số bất biến: trong các nghiên cứu ở Mỹ, nó thấp dần theo thời gian. Bond và Smith mô tả xu hướng này, không giải thích nguyên nhân."'
    ly_do: Review n43.
