nhan_dinh:
  - id: n1
    cau: 'Mô tả (description): sự phù hợp qua thí nghiệm Asch (1951, 1956; chi tiết ở trang riêng) và phân tích tổng hợp Bond & Smith (1996) về khác biệt văn hóa.'
    loai: lich-su
    nguon:
      - asch1956
      - bond1996
    trich: 'Culture and conformity: A meta-analysis of studies using Asch''s (1952b, 1956) line judgment task'
    vi_tri: Tên bài Bond & Smith (1996); Asch (1956) là báo cáo tổng hợp
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Thí nghiệm Asch (1951, 1956) về sự phù hợp, các yếu tố làm tăng phù hợp, và phân tích tổng hợp Bond & Smith (1996) về khác biệt văn hóa." Chữ mới: bỏ "các yếu tố làm tăng phù hợp" và nói chi tiết Asch ở trang riêng. Lý do: Asch có trang nhà thi-nghiem/asch, bài này chỉ tóm một câu. Review (Claude Sonnet 5.5, 10/11/2026): dung. Tên bài Bond & Smith (1996) và Asch (1956) khớp; mô tả trên trang khớp chữ ghi.'
    luot_2: dung
    luot_2_nguon: [ "https://eclass.uowm.gr/modules/document/file.php/NURED262/%CE%A0%CE%A1%CE%A9%CE%A4%CE%9F%CE%A4%CE%A5%CE%A0%CE%91%20%CE%91%CE%A1%CE%98%CE%A1%CE%91/Asch%20studies%20in%20independence%20and%20conformity%201956%20PM.pdf", "https://d-r-b-o-b.github.io/teaching/web_PSY333/Week_12/Ashe_meta.pdf" ]
    luot_2_ghi_chu: Asch 1951 là chương Guetzkow (dẫn trong tài liệu tham khảo của Asch 1956); không mở riêng.
    review: dung
  - id: n2
    cau: '"Hầu hết chúng ta đã từng ở trong tình huống này, và không ít lần chọn phương án thứ hai" (tình huống ăn cùng nhóm bảy người).'
    loai: phat-hien
    nguon:
      - asch1956
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ: "Hầu hết chúng ta đã từng ở trong tình huống này, và không ít lần chọn phương án thứ hai. Câu hỏi là: vì sao…". Chữ mới: "Câu hỏi là: nếu bạn chọn phương án thứ hai, vì sao…". Lý do: khẳng định về "hầu hết chúng ta" không có nguồn. Tình huống ăn chung là ví dụ giả định (gia-dinh). Review (Claude Sonnet 5.5, 10/11/2026): dung. giữ da-bo: khẳng định "hầu hết chúng ta đã từng…" không còn trên trang; "phương án thứ hai" nay chỉ danh sách tĩnh ngay trên trang (không phải câu hỏi quiz trộn thứ tự); tình huống ăn chung là ví dụ giả định, câu hỏi mở không khẳng định gì cần nguồn.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Câu mô tả trải nghiệm chung ('hầu hết chúng ta đã từng...'), không có nguồn nghiên cứu nào cho tần suất; không kiểm được, nên làm mềm hoặc bỏ. Cũng dựa vào vị trí lựa chọn ('phương án thứ hai'): thứ tự lựa chọn của câu hỏi bị trộn."
    review: dung
  - id: n3
    cau: Khi làm một mình, người ta sai chưa tới 1% số lần (khoảng 0,7% theo trang nhà Asch).
    loai: so-lieu
    nguon:
      - asch1956
    trich: in contrast with errors of less than 1 per cent under control conditions
    vi_tri: Tóm tắt, mục 14; bảng 3 (đối chứng)
    ket_qua: dung
    ghi_chu: 'Dùng ở ô thu gọn "Tự trải nghiệm" và ở khung Vững chắc. Khớp n10 của hồ sơ thi-nghiem/asch. Review (Claude Sonnet 5.5, 10/11/2026): dung. đọc lại Asch 1956 toàn văn: "errors of less than 1 per cent under control conditions"; 95% nhóm đối chứng không sai lần nào.'
    luot_2: dung
    luot_2_nguon: [ "https://eclass.uowm.gr/modules/document/file.php/NURED262/%CE%A0%CE%A1%CE%A9%CE%A4%CE%9F%CE%A4%CE%A5%CE%A0%CE%91%20%CE%91%CE%A1%CE%98%CE%A1%CE%91/Asch%20studies%20in%20independence%20and%20conformity%201956%20PM.pdf" ]
    luot_2_ghi_chu: Khớp 0,7% (mean 0,08 lỗi/12 lượt).
    review: dung
  - id: n4
    cau: Khi cả nhóm cố tình trả lời sai, khoảng 37% số câu trả lời của người tham gia thật cũng sai theo.
    loai: so-lieu
    nguon:
      - asch1956
      - asch1955
    trich: wrong judgments in 36.8 per cent of the cases
    vi_tri: Asch 1955; bảng 3 bài 1956 (N = 123)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "khoảng 1/3 số câu trả lời". Chữ mới: "khoảng 37%". Lý do: 36,8% (bảng 3, N = 123); trang nhà dùng 37%; "một phần ba" thấp hơn số thật. Review (Claude Sonnet 5.5, 10/11/2026): dung. đọc lại Asch 1956 bảng 3: trung bình 36,8% trên các lượt tới hạn, N = 123; trang viết "khoảng 37%".'
    luot_2: dung
    luot_2_nguon: [ "https://eclass.uowm.gr/modules/document/file.php/NURED262/%CE%A0%CE%A1%CE%A9%CE%A4%CE%9F%CE%A4%CE%A5%CE%A0%CE%91%20%CE%91%CE%A1%CE%98%CE%A1%CE%91/Asch%20studies%20in%20independence%20and%20conformity%201956%20PM.pdf", "https://archive.org/download/solomon-asch_confirmaty/solomon_original_djvu.txt" ]
    luot_2_ghi_chu: Con số 36,8% là trung bình trên 12 lượt tới hạn, 123 người.
    review: dung
  - id: n5
    cau: Khoảng ba phần tư số người tham gia làm theo số đông ít nhất một lần.
    loai: so-lieu
    nguon:
      - asch1956
    trich: Only one-fourth of the subjects in the three experimental groups showed errorless performances
    vi_tri: Mục III, kết quả định lượng; bảng 3 (29/123 không sai lần nào)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "3/4 số người" ở ô thu gọn, "Tính theo người: 75% … 25% không bao giờ làm theo" ở bảng và phần kể lại. Chữ mới: "khoảng 3/4"; phần kể lại rút về một câu ở mục Nghiên cứu then chốt (link trang nhà). Lý do: 29/123 = 24% không sai lần nào, tức khoảng 76% làm theo ít nhất một lần; nay nói "khoảng", khớp trang nhà. Review (Claude Sonnet 5.5, 10/11/2026): dung. đọc lại Asch 1956: 24% nhóm thí nghiệm không sai lần nào (tối đa 76% sai ít nhất một lần); trang viết "khoảng ba phần tư".'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/solomon-asch_confirmaty/solomon_original_djvu.txt", "https://eclass.uowm.gr/modules/document/file.php/NURED262/%CE%A0%CE%A1%CE%A9%CE%A4%CE%9F%CE%A4%CE%A5%CE%A0%CE%91%20%CE%91%CE%A1%CE%98%CE%A1%CE%91/Asch%20studies%20in%20independence%20and%20conformity%201956%20PM.pdf" ]
    review: dung
  - id: n6
    cau: 'Sự phù hợp (conformity): ta thay đổi hành vi của mình cho khớp với nhóm, kể cả khi mình không đồng ý với nhóm.'
    loai: dinh-nghia
    nguon:
      - openstax-ls
    trich: Conformity is the change in a person's behavior to go along with the group, even if he does not agree with the group.
    vi_tri: OpenStax Psychology 2e, mục 12.4
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ta thay đổi hành vi hay ý kiến của mình cho khớp với nhóm, dưới áp lực thật hay tưởng tượng của nhóm đó". Chữ mới theo định nghĩa của OpenStax. Lý do: "ý kiến" và "áp lực thật hay tưởng tượng" không có trong nguồn đã mở (APA Dictionary không mở được bằng công cụ). Review (Claude Sonnet 5.5, 10/11/2026): dung. trang khớp định nghĩa OpenStax 12.4.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/12-4-conformity-compliance-and-obedience" ]
    review: dung
  - id: n7
    cau: 'Có hai động cơ khác nhau: làm theo vì tin nhóm biết điều mình không biết (ảnh hưởng thông tin), và làm theo vì không muốn lạc lõng (ảnh hưởng chuẩn mực).'
    loai: dinh-nghia
    nguon:
      - deutsch1955
      - openstax-ls
    trich: normative social influence as an influence to conform with the | defined as an influence to accept information obtained from another as evidence about reality
    vi_tri: Deutsch & Gerard 1955, mục Hypotheses
    ket_qua: dung
    ghi_chu: 'Ví dụ "đi theo đám đông ra cửa thoát hiểm" là tình huống giả định (gia-dinh). Review (Claude Sonnet 5.5, 10/11/2026): dung. D&G 1955 mở được toàn văn (Internet Archive): hai loại ảnh hưởng chuẩn mực và thông tin; ví dụ cửa thoát hiểm là giả định.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/12-4-conformity-compliance-and-obedience" ]
    luot_2_ghi_chu: Hai động cơ khớp OpenStax; bài D&G 1955 chưa mở được toàn văn (xem n24).
    review: dung
  - id: n8
    cau: Thí nghiệm Asch dùng bài toán mà đáp án rất rõ, để xem nhóm có làm lệch được phán đoán ấy không.
    loai: phat-hien
    nguon:
      - asch1956
    trich: in contrast with errors of less than 1 per cent under control conditions
    vi_tri: 'Bảng 3, nhóm đối chứng: 95% không sai lần nào'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thí nghiệm dưới đây được thiết kế để tách [hai động cơ] ra". Chữ mới: bài toán đáp án rất rõ, xem nhóm có làm lệch được phán đoán. Lý do: Asch không thiết kế để tách hai động cơ; chính phần phỏng vấn cho thấy cả hai cùng xuất hiện. Review (Claude Sonnet 5.5, 10/11/2026): dung. khớp nhóm đối chứng của Asch 1956 (dưới 1% lỗi); câu viết không gán cho Asch ý định tách hai động cơ.'
    luot_2: dung
    luot_2_nguon: [ "https://eclass.uowm.gr/modules/document/file.php/NURED262/%CE%A0%CE%A1%CE%A9%CE%A4%CE%9F%CE%A4%CE%A5%CE%A0%CE%91%20%CE%91%CE%A1%CE%98%CE%A1%CE%91/Asch%20studies%20in%20independence%20and%20conformity%201956%20PM.pdf", "https://archive.org/download/solomon-asch_confirmaty/solomon_original_djvu.txt" ]
    review: dung
  - id: n9
    cau: Trong thí nghiệm kinh điển của Asch, người tham gia so sánh độ dài đường thẳng trước một nhóm "chim mồi" đồng loạt nói sai.
    loai: phat-hien
    nguon:
      - asch1956
    trich: All but one of the group had met previously with the experimenter and were instructed to respond on certain trials with wrong and unanimous judgments.
    vi_tri: Mục II.A
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: phần kể lại dài (nhóm 7–9 người, 12/18 lượt gài bẫy, bảng số liệu, các biến thể quy mô nhóm và người đồng minh). Chữ mới: một câu và link thi-nghiem/asch. Lý do: Asch có trang nhà đã khóa; các bài khác chỉ tóm một câu, không thêm số. Review (Claude Sonnet 5.5, 10/11/2026): dung. Asch 1956 mục II: tất cả trừ một người trong nhóm đã được dặn trả lời sai và nhất trí ở một số lượt; chữ trên trang đúng và ngắn.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/solomon-asch_confirmaty/solomon_original_djvu.txt", "https://eclass.uowm.gr/modules/document/file.php/NURED262/%CE%A0%CE%A1%CE%A9%CE%A4%CE%9F%CE%A4%CE%A5%CE%A0%CE%91%20%CE%91%CE%A1%CE%98%CE%A1%CE%91/Asch%20studies%20in%20independence%20and%20conformity%201956%20PM.pdf" ]
    luot_2_ghi_chu: "'Chim mồi' = người được dặn trước (confederate)."
    review: dung
  - id: n10
    cau: Phần thiết kế, số liệu và biến thể (quy mô nhóm, một người cùng phòng nói đúng) kể ở trang thí nghiệm Asch.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: src/content/docs/thi-nghiem/asch.md có mục "Nghiên cứu then chốt" với thiết kế, 36,8%, 0,7%, nhóm 3 người và một người cùng phòng nói đúng; link /psyche/thi-nghiem/asch/. Review (Claude Sonnet 5.5, 10/11/2026): dung. Chỉ nói về site: đã mở src/content/docs/thi-nghiem/asch.md, mục "Nghiên cứu then chốt" có thiết kế, 36,8%, 0,7%, nhóm 3 người, một người cùng phòng nói đúng; link /psyche/thi-nghiem/asch/ có trong trang.'
    review: dung
  - id: n11
    cau: Bond và Smith (1996) gộp 133 nghiên cứu dùng kiểu bài đo phán đoán đường thẳng theo Asch (cả bản Asch lẫn bản Crutchfield), ở 17 quốc gia.
    loai: so-lieu
    nguon:
      - bond1996
    trich: The literature search produced 133 studies drawn from 17 countries.
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(phần lớn theo đúng mô hình Asch, một phần theo biến thể Crutchfield)". Chữ mới: "(gồm cả bản theo mô hình Asch và bản theo biến thể Crutchfield)". Lý do: B&S thấy 44/50 nghiên cứu dùng chất liệu của Asch (1956) theo mô hình Asch, 28/47 nghiên cứu dùng chất liệu khác theo Crutchfield; không có tỉ lệ chung "phần lớn". Review (Claude Sonnet 5.5, 10/11/2026): dung. Bond & Smith 1996 toàn văn: 68 báo cáo, 133 thí nghiệm, 17 nước; 44/50 theo chất liệu Asch dùng mô hình Asch, 28/47 theo chất liệu khác dùng mô hình Crutchfield. Đã sửa câu dẫn "Hơn bốn mươi năm sau" thành "Khoảng bốn mươi năm sau" (1956 đến 1996 là đúng 40 năm; xem doi_chu).'
    luot_2: dung
    luot_2_nguon: [ "https://d-r-b-o-b.github.io/teaching/web_PSY333/Week_12/Ashe_meta.pdf" ]
    review: dung
  - id: n12
    cau: Ở Mỹ, mức phù hợp trong bài đo này thấp dần kể từ những năm 1950.
    loai: so-lieu
    nguon:
      - bond1996
    trich: An analysis of U.S. studies found that conformity has declined since the 1950s.
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Phù hợp ở Mỹ đã giảm kể từ những năm 1950. Người Mỹ ngày nay ít làm theo số đông trong bài đo này hơn người Mỹ thời Asch." Chữ mới: "trong các nghiên cứu ở Mỹ, mức phù hợp trong bài đo này thấp dần theo thời gian". Lý do: nguồn nói về các nghiên cứu ở Mỹ, không nói về "người Mỹ ngày nay". Review (Claude Sonnet 5.5, 10/11/2026): dung. B&S tóm tắt: "An analysis of U.S. studies found that conformity has declined since the 1950s"; trang nói đúng phạm vi nghiên cứu ở Mỹ.'
    luot_2: dung
    luot_2_nguon: [ "https://d-r-b-o-b.github.io/teaching/web_PSY333/Week_12/Ashe_meta.pdf" ]
    luot_2_ghi_chu: Xu hướng tuyến tính, không có xu hướng cong (Larsen).
    review: dung
  - id: n13
    cau: Các nước "cộng đồng" có mức phù hợp cao hơn các nước "cá nhân"; mối liên hệ thấy ở cả ba cách đo văn hóa.
    loai: so-lieu
    nguon:
      - bond1996
    trich: Results from 3 surveys were used to assess a country's individualism-collectivism, and for each survey the measures were found to be significantly related to conformity.
    vi_tri: Tóm tắt
    ket_qua: dung
