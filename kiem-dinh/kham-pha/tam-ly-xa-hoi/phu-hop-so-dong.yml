  - id: n26
    cau: "Gợi ý cho người điều hành họp: đừng nêu ý kiến trước rồi hỏi mọi người; để mọi người viết ý kiến riêng trước khi thảo luận. Gợi ý rút từ một biến thể của Asch (trả lời bằng văn bản, số lỗi còn khoảng một phần ba, mẫu 14 người, Asch nói chưa chứng minh được chênh lệch bằng thống kê), chưa kiểm trực tiếp trong cuộc họp."
    loai: loi-khuyen
    nguon:
      - asch1956
    trich: The mean frequency of errors was 1.50, or 12.5 per cent of all critical estimates, about one-third of the errors found in Experiment 1. | Because of the small number of cases in this variation and the great range of errors in Experiment 1, we cannot establish a conclusive difference statistically
    vi_tri: Thí nghiệm 4, "The Import of Public Judgments"
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "đừng hỏi ý kiến bằng cách giơ tay theo lượt nghe người đầu tiên nói trước… Một lượt viết độc lập chính là cách tạo ra ''người phá vỡ sự nhất trí'' cho cả nhóm." Chữ mới: nêu là gợi ý rút từ biến thể 14 người, chưa kiểm trực tiếp. Lý do: "tạo ra người phá vỡ nhất trí" là suy diễn không có trong nguồn. Khớp n38–n40 của trang nhà. Review (Claude Sonnet 5.5, 10/11/2026): sai (quá mạnh): "làm số lỗi giảm" thiếu giới hạn mà Asch tự nêu: mẫu 14 người, số lỗi 12,5% (khoảng một phần ba của 36,8%), "we cannot establish a conclusive difference statistically". Đã sửa trên trang: thêm "còn khoảng một phần ba" và "chính Asch nói chưa chứng minh được chênh lệch bằng thống kê", như trang nhà thi-nghiem/asch.'
    luot_2: dung
    luot_2_nguon: [ "https://eclass.uowm.gr/modules/document/file.php/NURED262/%CE%A0%CE%A1%CE%A9%CE%A4%CE%9F%CE%A4%CE%A5%CE%A0%CE%91%20%CE%91%CE%A1%CE%98%CE%A1%CE%91/Asch%20studies%20in%20independence%20and%20conformity%201956%20PM.pdf" ]
    luot_2_ghi_chu: Trang đã ghi rõ chưa kiểm trực tiếp trong cuộc họp; suy ra từ biến thể trả lời bằng văn bản.
