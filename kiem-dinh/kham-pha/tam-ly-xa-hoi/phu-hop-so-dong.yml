    cau: Các đánh giá có sẵn là một dạng "ý kiến của số đông" bạn thấy trước khi tự đánh giá; đây chỉ là phép loại suy với Asch, không phải kết quả của thí nghiệm (Asch không thử đánh giá trực tuyến).
