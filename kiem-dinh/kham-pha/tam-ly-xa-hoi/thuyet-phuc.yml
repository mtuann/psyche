      - chaiken1980
      - kruglanski1999
    ly_do: Chưa có bằng chứng ngã ngũ về việc hai đường có tách biệt hay là một liên tục; bài gốc nêu đánh đổi là ở mức tác động; hai mô hình khác nhau (ELM, HSM) mô tả hiện tượng tương tự. Nhãn tranh cãi được giữ như cũ (G1 không phản đối).
