    trich: the postulated tradeoff is not in the occurrence of central and peripheral processes, but in the impact of these processes on attitudes and judgments
    vi_tri: Petty & Wegener 1999, Postulate 6
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hai quá trình thường chạy đồng thời và tương tác với nhau, chứ không rạch ròi như trong phòng thí nghiệm… hai mô hình bổ sung cho nhau hơn là loại trừ lẫn nhau". Chữ mới: dẫn đúng Postulate 6, bỏ "thường", "bổ sung cho nhau hơn là loại trừ". Lý do: Petty & Wegener chỉ nói quá trình không loại trừ nhau về việc xảy ra; "thường" và quan hệ bổ sung với HSM không có nguồn đã mở. Review (Claude Sonnet 5.5, 10/11/2026): sai (khung không nói bằng chứng nào mâu thuẫn): khung nhãn Đang tranh cãi chỉ trích Petty & Wegener (1999) và Chaiken (1980), vốn là các mô hình hai quá trình cùng phía, nên người đọc không thấy vì sao "tranh cãi". Tranh cãi thật là mô hình đơn đường (Kruglanski & Thompson 1999, Psychological Inquiry 10(2), 83–109; tóm tắt đọc qua OpenAlex): lập luận và dấu hiệu ngoại vi là hai loại bằng chứng xử lý như nhau, không có hai đường khác bản chất. Đã thêm câu này và nguồn vào khung. Nhãn Đang tranh cãi chốt: hai mô hình cạnh tranh chưa phân xử, không có tổng hợp hay tái lập lớn.'
    nhan: tranh-cai
    co_so:
