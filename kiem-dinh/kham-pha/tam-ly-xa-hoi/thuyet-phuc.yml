  - id: n4
    cau: 'Đường trung tâm: khi động lực và khả năng đều cao, ta xem xét cẩn thận lập luận; lập luận mạnh hay yếu có ảnh hưởng rõ rệt đến việc thuyết phục.'
    loai: phat-hien
    nguon:
      - petty1981
      - petty1983
    trich: influenced primarily by the quality of the arguments in the message
    vi_tri: Petty, Cacioppo & Goldman 1981, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Thuyết phục chỉ xảy ra nếu lập luận thực sự mạnh." Chữ mới: "Lập luận mạnh hay yếu có ảnh hưởng rõ rệt đến việc thuyết phục có xảy ra hay không." Lý do: nguồn chỉ nói lập luận mạnh thuyết phục hơn yếu ở nhóm liên quan cao; "chỉ xảy ra nếu" quá mạnh. Review (Claude Sonnet 5.5, 10/11/2026): dung. Petty, Cacioppo & Goldman 1981 (tóm tắt, bản quét đã OCR): ở liên quan cao thái độ chủ yếu chịu ảnh hưởng của chất lượng lập luận; chữ trên trang không nói "chỉ".'
    luot_2: dung
    luot_2_nguon: [ "https://www.uni-muenster.de/imperia/md/content/psyifp/aeechterhoff/wintersemester2011-12/attitudesandsocialjudgment/petty_cacioppo_goldman_1981_jpsp.pdf", "https://richardepetty.com/wp-content/uploads/2019/01/1984-jpsp-pettycacioppo.pdf" ]
    review: dung
  - id: n5
    cau: 'Đường ngoại vi: khi động lực hoặc khả năng thấp, ta dựa vào dấu hiệu ngoại vi: người nói nổi tiếng hay đáng tin, cảm xúc dễ chịu, số lượng lập luận, nhạc nền dễ chịu.'
    loai: dinh-nghia
    nguon:
      - petty1986
    trich: number of arguments, pleasant music, visual salience
    vi_tri: Mục VII (các biến ngoại vi); Fig. 1 liệt kê "positive/negative affect; attractive/expert sources; distraction; repetition; number of arguments"
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "người nói có nổi tiếng không, giọng điệu có dễ chịu không, lập luận có nhiều không" và "ai nói, giọng điệu ra sao, nhạc nền có bắt tai không". Chữ mới: "nổi tiếng hay đáng tin, cảm xúc dễ chịu hay không…" và "nhạc nền có dễ chịu không". Lý do: Petty & Cacioppo (1986) không liệt kê "giọng điệu"; liệt kê cảm xúc, nguồn hấp dẫn/chuyên gia, số lập luận, nhạc dễ chịu. Review (Claude Sonnet 5.5, 10/11/2026): dung. Petty & Cacioppo 1986: số lập luận, nhạc dễ chịu, nguồn hấp dẫn/chuyên gia, cảm xúc là dấu hiệu ngoại vi; không còn "giọng điệu".'
    luot_2: dung
    luot_2_nguon: [ "https://richardepetty.com/wp-content/uploads/2019/01/1986-advances-pettycacioppo.pdf" ]
    luot_2_ghi_chu: "'Nhạc nền' là ví dụ về cue cảm xúc (chương nêu 'theme music ... induced a general pleasantness')."
    review: dung
  - id: n6
    cau: 'Postulate 7: thái độ hình thành qua đường trung tâm bền hơn, khó lung lay hơn trước phản biện, dự đoán hành vi tốt hơn.'
    loai: phat-hien
    nguon:
