nhan_dinh:
  - id: n1
    cau: "Mô tả (description): mô hình ELM của Petty và Cacioppo (1986) mô tả hai đường mà quảng cáo có thể tác động lên ta — trung tâm (lập luận) và ngoại vi (người nổi tiếng, cảm xúc, số lượng lập luận) — tùy việc ta có suy nghĩ kỹ hay không."
    loai: phat-hien
    nguon:
      - petty1986
    trich: Fig. 1. Central and peripheral routes to persuasion.
    vi_tri: Hình 1
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cho thấy quảng cáo tác động lên ta qua hai đường". Chữ mới: "mô hình ELM… mô tả"; giữ mô tả. Lý do: ELM là mô hình, "cho thấy" mạnh hơn. Review (Claude Sonnet 5.5, 10/11/2026): sai (không khớp chữ): hồ sơ ghi chữ mới là "mô tả" nhưng description trên trang vẫn viết "cho thấy quảng cáo tác động lên ta qua hai đường", mạnh hơn nguồn (ELM là mô hình). Đã sửa description thành "mô tả hai đường mà quảng cáo có thể tác động lên ta".'
    luot_2: dung
    luot_2_nguon: [ "https://richardepetty.com/wp-content/uploads/2019/01/1986-advances-pettycacioppo.pdf", "https://openstax.org/books/psychology-2e/pages/12-3-attitudes-and-persuasion" ]
    luot_2_ghi_chu: Cột 'số lượng lập luận' là dấu hiệu ngoại vi theo Petty & Cacioppo 1984 (n14).
    review: sai
  - id: n2
    cau: Con đường ta đi không do quảng cáo quyết định một mình mà phụ thuộc vào việc ta có muốn (động lực) và có thể (khả năng) suy nghĩ kỹ hay không.
    loai: phat-hien
    nguon:
      - petty1986
    trich: 'Variables can affect the amount and direction of attitude change by: (A) serving as persuasive arguments, (B) serving as peripheral cues, and/or (C) affecting the extent or direction of issue and argument elaboration.'
    vi_tri: Postulate 3 (mục IV)
    ket_qua: dung
    ghi_chu: 'G1: khớp. Động lực và khả năng là hai điều kiện của ELM (Fig. 1: "motivation to process", "ability to process"). Review (Claude Sonnet 5.5, 10/11/2026): dung. Petty & Cacioppo 1986, Postulate 3 và Hình 1 (động lực và khả năng xử lý).'
    luot_2: dung
    luot_2_nguon: [ "https://richardepetty.com/wp-content/uploads/2019/01/1986-advances-pettycacioppo.pdf" ]
    review: dung
  - id: n3
    cau: 'ELM: khả năng xử lý sâu một thông điệp phụ thuộc vào động lực (vấn đề có liên quan đến ta không) và khả năng (thời gian, kiến thức, sự tập trung); từ đó có hai đường thuyết phục.'
    loai: dinh-nghia
    nguon:
