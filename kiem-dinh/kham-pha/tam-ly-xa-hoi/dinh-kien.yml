nhan_dinh:
  - id: n1
    cau: 'Mô tả (description): 5 mức biểu hiện định kiến của Allport (1954), giả thuyết tiếp xúc và phân tích tổng hợp 515 nghiên cứu của Pettigrew và Tropp (2006), tranh luận chưa ngã ngũ về thiên kiến ngầm và IAT.'
    loai: lich-su
    nguon:
      - ptt2006
      - allport-tomtat
    trich: With 713 independent samples from 515 studies, the meta-analysis finds that intergroup contact typically reduces intergroup prejudice.
    vi_tri: Tóm tắt Pettigrew & Tropp 2006
    ket_qua: dung
    ghi_chu: '"5 mức" xem n6 (chỗ khó về nguồn Allport). Review (Claude Sonnet 5.5, 10/11/2026): dung. "5 mức" nay có nguồn bậc 2 (n6); phân tích tổng hợp 515 nghiên cứu khớp tóm tắt P&T 2006.'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1037/0022-3514.90.5.751", "https://api.openalex.org/works/doi:10.1037/0022-3514.74.6.1464", "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/142C913E7FA9E121277B29E994124EC5/S2398063X18000258a.pdf/div-class-title-the-contact-hypothesis-re-evaluated-div.pdf" ]
    luot_2_ghi_chu: Mức 5 bậc của Allport chưa mở được nguồn gốc (xem n6).
    review: dung
  - id: n2
    cau: 'Bertrand và Mullainathan (2004): gửi gần 5.000 hồ sơ giả tới tin tuyển dụng ở Boston và Chicago, tên gợi người da trắng hoặc người Mỹ gốc Phi được gán ngẫu nhiên; hồ sơ tên da trắng nhận nhiều hơn 50% lời mời phỏng vấn.'
    loai: phat-hien
    nguon:
      - bertrand2004
    trich: White names receive 50 percent more callbacks for interviews.
    vi_tri: Tóm tắt; NBER WP 9873 mục Introduction ("nearly 5000 resumes")
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hàng nghìn hồ sơ giả (gần như giống hệt nhau, chỉ khác tên)". Chữ mới: "gần 5.000 hồ sơ giả (cùng kiểu, tên được gán ngẫu nhiên)". Lý do: "gần như giống hệt" không đúng: hồ sơ có hai mức chất lượng được tạo ra, tên mới là yếu tố gán ngẫu nhiên; số "gần 5.000" từ nguồn. Năm 2004 là năm công bố (G1: thí nghiệm làm 2001–2002); trang đã viết "công bố năm 2004". Review (Claude Sonnet 5.5, 10/11/2026): dung. Bertrand & Mullainathan 2004: "White names receive 50 percent more callbacks"; gần 5.000 hồ sơ (NBER 9873); Boston và Chicago.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nber.org/system/files/working_papers/w9873/w9873.pdf" ]
    luot_2_ghi_chu: Bản đọc là bản NBER 9873 (7/2003); tên bài in AER 2004. 'Hồ sơ giả' = fictitious resumes.
    review: dung
  - id: n3
    cau: Thí nghiệm thực địa làm từ tháng 7/2001 đến 1/2002 (Boston) và 5/2002 (Chicago); bài công bố năm 2004.
    loai: lich-su
    nguon:
      - bertrand2004
    trich: The experiment was carried on between July 2001 and January 2002 in Boston
    vi_tri: NBER WP 9873, mục Experimental design
    ket_qua: dung
    ghi_chu: 'G1 đã sửa trang cũ ("Trong một nghiên cứu công bố năm 2004"); đối chiếu lại bản NBER: khớp. Trang không nêu năm làm thực địa; ghi lại để nhất quán. Review (Claude Sonnet 5.5, 10/11/2026): dung. không nằm trên trang; khớp NBER 9873.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nber.org/system/files/working_papers/w9873/w9873.pdf" ]
    review: dung
  - id: n4
    cau: Nghiên cứu cho thấy sự khác biệt trong đối xử, chứ không cho biết nhà tuyển dụng có ý thức về điều đó hay không.
    loai: phat-hien
    nguon:
      - bertrand2004
    trich: We find little evidence that our results are driven by employers inferring something other than race
    vi_tri: Tóm tắt (OpenAlex)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Định kiến không phải lúc nào cũng là sự thù ghét có ý thức — nó thường len lỏi qua những phán đoán tưởng chừng ''khách quan''." Chữ mới: câu trên. Lý do: bài không đo ý thức của nhà tuyển dụng; "thường len lỏi" là khẳng định không nguồn. Review (Claude Sonnet 5.5, 10/11/2026): dung. câu chỉ nói nghiên cứu cho thấy khác biệt đối xử, không đo ý thức; đúng với thiết kế.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nber.org/system/files/working_papers/w9873/w9873.pdf" ]
    review: dung
  - id: n5
    cau: 'Ba khái niệm: khuôn mẫu (niềm tin về nhóm), định kiến (thái độ và cảm xúc dành cho một người vì họ thuộc nhóm), phân biệt đối xử (hành vi đối xử bất công vì tư cách nhóm).'
    loai: dinh-nghia
    nguon:
      - openstax-dk
    trich: Prejudice is common against people who are members of an unfamiliar cultural group.
    vi_tri: OpenStax 12.5
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Định kiến: thái độ (thường là tiêu cực) dành cho một nhóm người". Chữ mới: "thái độ và cảm xúc dành cho một người dựa trên việc họ thuộc một nhóm (ở bài này ta bàn chủ yếu về định kiến tiêu cực)". Lý do: OpenStax nêu định kiến có thể tích cực hay tiêu cực ("both positive and negative"); định nghĩa: "attitude and feeling toward an individual based solely on one''s membership in a particular social group". Review (Claude Sonnet 5.5, 10/11/2026): dung. OpenStax 12.5 (đọc lại): định kiến là thái độ và cảm xúc dành cho một người dựa trên tư cách nhóm.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/12-5-prejudice-and-discrimination" ]
    review: dung
  - id: n6
    cau: "Theo cách tóm tắt thường gặp của thang do Allport (1954) nêu (Windisch và cộng sự, 2022), định kiến biểu hiện ở 5 mức: nói xấu, tránh né, phân biệt đối xử, tấn công thân thể, diệt chủng; các hình thức bạo lực nặng hơn dựa trên những hành vi định kiến ở mức thấp hơn, nói xấu chỉ là điểm khởi đầu."
    loai: lich-su
    nguon:
      - windisch2022
      - allport-tomtat
    trich: Allport's (1954) scale of prejudice makes it clear how hate speech/cyberhate is connected to more extreme forms of violence motivated by specific biases, with hate speech (or antilocution) being only the starting point.
    vi_tri: Windisch và cộng sự 2022, mục Introduction (mô tả năm mức); sách Allport 1954 không mở được
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Gordon Allport mô tả… Allport cảnh báo: các mức độ này không tách rời — mức 1 tạo ''đất'' cho các mức sau leo thang." Chữ mới: "Theo cách tóm tắt thường gặp của thang… (chưa mở được sách gốc)"; "Theo các tóm tắt ấy, nói xấu tự nó có thể không gây hại nhưng tạo đất…". Lý do: sách Allport (1954) khóa mượn trên Internet Archive (HTTP 401/403); thứ tự 5 mức và câu "sets the stage" chỉ đối chiếu qua nguồn thứ cấp bậc 3 (ghi chú giảng, và Wikipedia dẫn Watson 2007, tr. 45–46). CHỖ KHÓ cho review: nhận định này chỉ có nguồn phụ; chuẩn mục 2 đòi thêm một nguồn bậc 1–2 đọc được. Đã thử Dovidio, Glick & Rudman (2005) và Mullen & Leader (2005): không mở được. Đề nghị: giữ chữ "theo tóm tắt", hoặc chủ repo duyệt nguồn. Review (Claude Sonnet 5.5, 10/11/2026): sai (không đúng nguồn): vế "nói xấu tự nó có thể không gây hại nhưng tạo đất" và "lời lẽ miệt thị, đùa cợt … thường được xem là vô hại" chỉ có ở ghi chú giảng bậc 3, không có ở nguồn bậc 2. Đã tìm được nguồn bậc 2 mở được: tổng quan hệ thống Windisch, Wiedlitzka, Olaghere & Jenaway (2022, Campbell Syst Rev 18(2): e1243, toàn văn PMC9133687) mô tả đủ năm mức theo Allport (1954): antilocution, avoidance, discrimination, physical attack, extermination, và nói "hate speech (or antilocution) being only the starting point"; hình thức nặng hơn dựa trên mức thấp hơn. PNAS 2025 (PMC12684897) mô tả lại thang cùng thứ tự. Quyết giữ thang với chữ "theo cách tóm tắt thường gặp", dẫn Windisch 2022; bỏ hai vế không nguồn; mục Nguồn gộp một dòng Allport kèm ghi chú.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không mở được toàn văn Allport (1954) (Internet Archive trả 401, mượn có kiểm soát); bài của Sage xác nhận antilocution là hình thức đầu và 'most elementary', nhưng thang năm mức đủ thứ tự chưa kiểm được ở nguồn bậc 1–2.
    review: sai
  - id: n7
    cau: 'Giả thuyết tiếp xúc của Allport: tiếp xúc giữa các nhóm giảm định kiến khi có bốn điều kiện: địa vị ngang nhau, mục tiêu chung, hợp tác giữa các nhóm, được thể chế, luật pháp hoặc phong tục ủng hộ.'
    loai: lich-su
    nguon:
      - ptt2006
    trich: equal status between the groups in the situation; common goals; intergroup cooperation; and the support of authorities, law, or custom.
    vi_tri: Pettigrew & Tropp 2006, mục Introduction
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Cùng trong cuốn sách, Allport đưa ra giả thuyết tiếp xúc… nhưng chỉ khi hội đủ bốn điều kiện". Chữ mới thêm "(theo cách Pettigrew và Tropp, 2006, tóm lại)" và nói "giảm khi có bốn điều kiện". Lý do: nguồn đọc được là bài tóm lại; P&T (2006) cho thấy các điều kiện không bắt buộc (n10). Review (Claude Sonnet 5.5, 10/11/2026): sai (quá mạnh): trang viết Allport đưa ra giả thuyết tiếp xúc "nhưng chỉ khi hội đủ bốn điều kiện", trong khi P&T 2006 viết "Allport held that reduced prejudice will result when four features of the contact situation are present" và chính phân tích của họ thấy các điều kiện không bắt buộc. Đã sửa thành "khi hội đủ bốn điều kiện … phân tích của chính họ lại thấy các điều kiện này không bắt buộc".'
    luot_2: dung
    luot_2_nguon: [ "https://ns1.serendipstudio.org/oneworld/system/files/annurev.psych_.49.1.65-2.pdf", "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/142C913E7FA9E121277B29E994124EC5/S2398063X18000258a.pdf/div-class-title-the-contact-hypothesis-re-evaluated-div.pdf" ]
    review: sai
  - id: n8
    cau: 'Pettigrew và Tropp (2006): 713 mẫu độc lập từ 515 nghiên cứu về tiếp xúc liên nhóm, phân tích tổng hợp.'
    loai: so-lieu
    nguon:
      - ptt2006
    trich: With 713 independent samples from 515 studies, the meta-analysis finds that intergroup contact typically reduces intergroup prejudice.
    vi_tri: Tóm tắt
    ket_qua: dung
    ghi_chu: 'G1: khớp. Review (Claude Sonnet 5.5, 10/11/2026): dung. P&T 2006 toàn văn (Internet Archive): 713 mẫu độc lập, 515 nghiên cứu.'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1037/0022-3514.90.5.751" ]
    review: dung
  - id: n9
    cau: Tiếp xúc liên nhóm nhìn chung làm giảm định kiến; hiệu ứng có ý nghĩa, không do thiên lệch chọn người tham gia hay thiên lệch xuất bản; hiệu ứng lan ra cả nhóm ngoài.
    loai: phat-hien
    nguon:
      - ptt2006
    trich: Multiple tests indicate that this finding appears not to result from either participant selection or publication biases, and the more rigorous studies yield larger mean effects. These contact effects typically generalize to the entire outgroup
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hiệu ứng có ý nghĩa thống kê, không phải do thiên lệch chọn mẫu hay thiên lệch xuất bản". Chữ mới: "không do thiên lệch chọn người tham gia hay thiên lệch xuất bản". Lý do: nguồn nói "appears not to result", nên viết mềm ở khung nhãn là "không phải do" → giữ ở thân bài như G1 đã xác nhận KHỚP; đã làm mềm "tái lập tốt nhất" (n12). Review (Claude Sonnet 5.5, 10/11/2026): sai (quá mạnh nhẹ): trang viết "không phải do thiên lệch chọn mẫu hay thiên lệch xuất bản" trong khi nguồn viết "appears not to result from either participant selection or publication biases". Đã sửa thành "dường như không do" ở thân bài và ở khung Vững chắc.'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1037/0022-3514.90.5.751" ]
    review: sai
  - id: n10
    cau: Khi bốn điều kiện của Allport được đáp ứng, hiệu ứng lớn hơn; nhưng các điều kiện không bắt buộc.
    loai: phat-hien
    nguon:
      - ptt2006
    trich: A global indicator of Allport's optimal contact conditions demonstrates that contact under these conditions typically leads to even greater reduction in prejudice.
    vi_tri: Tóm tắt
    ket_qua: dung
    ghi_chu: 'G1: khớp. Tóm tắt: "these conditions are not essential for prejudice reduction". Review (Claude Sonnet 5.5, 10/11/2026): dung. P&T 2006 tóm tắt: điều kiện tối ưu "even greater reduction"; "these conditions are not essential".'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1037/0022-3514.90.5.751" ]
    review: dung
  - id: n11
    cau: "Khung Vững chắc: tiếp xúc liên nhóm thường làm giảm định kiến; hiệu ứng dường như không do thiên lệch xuất bản; nghiên cứu chặt chẽ cho hiệu ứng lớn hơn; 27 thí nghiệm ngẫu nhiên có đo kết quả sau một thời gian cho cùng kết luận nhưng yếu hơn đáng kể với định kiến chủng tộc, sắc tộc, và chưa có nghiên cứu về định kiến chủng tộc, sắc tộc của người trưởng thành."
    loai: nhan
    nguon:
      - ptt2006
      - paluck2019
    trich: We find the evidence from this updated dataset to be consistent with Pettigrew and Tropp's (2006) conclusion that contact "typically reduces prejudice."
    vi_tri: Paluck và cộng sự 2019, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đây là một trong những phát hiện được tái lập tốt nhất trong tâm lý học về định kiến." (G1 ghi chú: Paluck 2019 xác nhận nhưng thấy hiệu ứng "substantially weaker" với định kiến chủng tộc, sắc tộc). Chữ mới: bỏ câu "được tái lập tốt nhất" (không nguồn), thêm kết quả Paluck 2019. Lý do: nhãn Vững chắc giữ nhưng giới hạn nêu rõ. Review (Claude Sonnet 5.5, 10/11/2026): dung. Nhãn Vững chắc chốt, sát ranh với Khá vững: đạt mục 4 vì có phân tích tổng hợp 713 mẫu, 515 nghiên cứu, 38 nước (P&T 2006, đã mở toàn văn) và phân tích tổng hợp 27 thí nghiệm ngẫu nhiên có đo sau thời gian (Paluck 2019) cùng chiều ("typically reduces prejudice"), không có thất bại tái lập lớn. Lý do sát ranh: Paluck 2019 thấy hiệu ứng yếu hơn đáng kể với định kiến chủng tộc, sắc tộc, chưa có nghiên cứu về người lớn, và kết luận "phải lấp khoảng trống trước khi giả thuyết dẫn dắt chính sách một cách đáng tin" (tóm tắt Paluck). Đã thêm giới hạn ấy vào khung và đổi "không phải do" thành "dường như không do". Chữ cuối khớp nguồn.'
    nhan: vung-chac
    co_so:
      - ptt2006
      - paluck2019
    ly_do: 'Mục 4: Pettigrew & Tropp 2006 (713 mẫu, 515 nghiên cứu, 38 nước) và Paluck 2019 (27 thí nghiệm ngẫu nhiên, cùng kết luận "typically reduces prejudice") cùng chiều, đúng ở nhiều nhóm mục tiêu và nhiều nước. Giới hạn: hiệu ứng yếu hơn đáng kể với định kiến chủng tộc, sắc tộc; thiếu nghiên cứu về định kiến của người trưởng thành. Chỗ khó: có thể xem Khá vững; giữ Vững chắc vì có hai bằng chứng độc lập cùng chiều, chủ repo duyệt.'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1037/0022-3514.90.5.751", "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/142C913E7FA9E121277B29E994124EC5/S2398063X18000258a.pdf/div-class-title-the-contact-hypothesis-re-evaluated-div.pdf" ]
    luot_2_ghi_chu: Nhãn Vững chắc đạt thước đo (phân tích tổng hợp + cập nhật cùng chiều), có ghi giới hạn.
    review: dung
  - id: n12
    cau: "Paluck và cộng sự (2019): 27 thí nghiệm ngẫu nhiên có đo kết quả sau một thời gian (gần hai phần ba công bố sau P&T 2006); thấy tiếp xúc nhìn chung giảm định kiến nhưng yếu hơn đáng kể với định kiến chủng tộc, sắc tộc; chưa có nghiên cứu về định kiến chủng tộc, sắc tộc của người trưởng thành."
    loai: tai-lap
    nguon:
      - paluck2019
    trich: our meta-analysis suggests that contact's effects vary, with interventions directed at ethnic or racial prejudice generating substantially weaker effects.
    vi_tri: Tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/142C913E7FA9E121277B29E994124EC5/S2398063X18000258a.pdf/div-class-title-the-contact-hypothesis-re-evaluated-div.pdf" ]
    luot_2_ghi_chu: Vế 'thiếu nghiên cứu về định kiến của người trưởng thành' bài giới hạn ở định kiến chủng tộc/sắc tộc (có 6 nghiên cứu người lớn khác).
    review: sai
    ghi_chu: "Review (Claude Sonnet 5.5, 10/11/2026): sai (thiếu phạm vi): trang viết \"27 thí nghiệm ngẫu nhiên\" và khoảng trống ở \"định kiến của người trưởng thành\"; tóm tắt Paluck 2019 nói 27 nghiên cứu \"that feature random assignment and delayed outcome measures\", và khoảng trống là \"the absence of studies addressing adults' racial or ethnic prejudices\". Đã sửa trên trang: \"có đo kết quả sau một thời gian\", \"định kiến chủng tộc, sắc tộc của người trưởng thành\"."
  - id: n13
    cau: "Khung Khá vững: bốn điều kiện của Allport làm tiếp xúc hiệu quả hơn; bằng chứng chủ yếu đến từ so sánh giữa các nghiên cứu; trong 27 thí nghiệm ngẫu nhiên có đo kết quả sau một thời gian chưa có thí nghiệm nào thao túng có hệ thống bốn điều kiện."
    loai: nhan
    nguon:
      - ptt2006
      - paluck2019
    trich: no randomized study with over-time outcome measurement has systematically varied, as part of its experimental design, Allport's facilitating conditions
    vi_tri: Paluck và cộng sự 2019, phần Discussion
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (G1: ĐÁNG NGỜ): "cho hiệu ứng giảm định kiến mạnh hơn hẳn so với tiếp xúc ''cho có''". Trang đã áp sửa G1 (thêm câu Paluck 2019). Chữ mới: bỏ "mạnh hơn" → "lớn hơn" và bỏ "so với tiếp xúc cho có". Lý do: "mạnh hơn hẳn" quá mức nguồn. Review (Claude Sonnet 5.5, 10/11/2026): sai (thiếu phạm vi): "chưa có thí nghiệm ngẫu nhiên nào thao túng có hệ thống bốn điều kiện" chỉ đúng trong 27 thí nghiệm có đo kết quả sau một thời gian mà Paluck 2019 tập hợp. Đã thêm phạm vi trên trang. Nhãn Khá vững chốt: P&T 2006 (so sánh giữa nghiên cứu, hiệu ứng lớn hơn khi điều kiện tối ưu) nhưng chưa có thao túng thực nghiệm và các điều kiện được chính P&T thấy không bắt buộc; đạt "Khá vững", không đạt "Vững chắc".'
    nhan: kha-vung
    co_so:
      - ptt2006
      - paluck2019
    ly_do: 'Mục 4, Khá vững: P&T 2006 thấy hiệu ứng lớn hơn khi có điều kiện tối ưu (chỉ số tổng hợp, so sánh giữa nghiên cứu); Paluck 2019 nêu bốn điều kiện ít được ủng hộ thực nghiệm. Chưa có tái lập lớn thao túng điều kiện.'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1037/0022-3514.90.5.751", "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/142C913E7FA9E121277B29E994124EC5/S2398063X18000258a.pdf/div-class-title-the-contact-hypothesis-re-evaluated-div.pdf" ]
    luot_2_ghi_chu: Nhãn Khá vững phù hợp thước đo. Giới hạn ở 27 thí nghiệm có đo sau thời gian.
    review: sai
