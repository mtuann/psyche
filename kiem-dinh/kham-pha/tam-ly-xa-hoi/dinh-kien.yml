    cau: "Paluck 2019: bốn điều kiện của Allport ít được ủng hộ thực nghiệm; trong 27 thí nghiệm ngẫu nhiên có đo kết quả sau một thời gian chưa có thí nghiệm nào thao túng chúng có hệ thống."
    loai: phat-hien
