    review: sai
    ghi_chu: 'Review (Claude Sonnet 5.5, 10/11/2026): sai (quá mạnh, thiếu giới hạn): trang viết tiếp xúc có chất lượng "hiệu quả hơn nhiều so với việc chỉ ở gần nhau" và khuyên thiết kế theo bốn điều kiện như điều chắc; P&T 2006 chỉ thấy hiệu ứng "even greater" khi có điều kiện tối ưu và các điều kiện không bắt buộc, Paluck 2019 chưa thấy thí nghiệm thao túng chúng. Đã sửa thành "có thể hiệu quả hơn", kèm P&T và "gợi ý suy ra, chưa kiểm trực tiếp". Nhãn Khá vững chốt cho nền (P&T), lời khuyên đã ghi chưa kiểm.'
