  - id: n15
    cau: 'Greenwald, McGhee và Schwartz (1998): IAT đo thời gian phản ứng khi ghép cặp các khái niệm (ví dụ da trắng–tốt, da đen–xấu so với ghép ngược lại); chênh lệch tốc độ được diễn giải là độ mạnh của liên tưởng.'
    loai: phat-hien
    nguon:
      - greenwald1998
    trich: performance is faster than when less associated categories
    vi_tri: Tóm tắt
    ket_qua: dung
    ghi_chu: 'G1: khớp. Chỉ đọc tóm tắt (OpenAlex; toàn văn không mở được qua các nguồn đã thử). Review (Claude Sonnet 5.5, 10/11/2026): dung. Greenwald, McGhee & Schwartz 1998 tóm tắt (OpenAlex): IAT đo chênh lệch tốc độ khi hai khái niệm chung phím; "da trắng/da đen" là ví dụ trong tóm tắt.'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1037/0022-3514.74.6.1464" ]
