  - id: n41
    cau: "Quiz 1: thứ tự thang 5 mức của Allport theo cách tóm tắt thường gặp: nói xấu, tránh né, phân biệt đối xử, tấn công thân thể, diệt chủng; giải thích: nói xấu là điểm khởi đầu và các hình thức bạo lực nặng hơn dựa trên những hành vi định kiến ở mức thấp hơn (Windisch và cộng sự, 2022)."
    loai: lich-su
    nguon:
      - windisch2022
      - allport-tomtat
    trich: The last level, extermination, includes ultimate acts of violence against members of specific groups, an expression of prejudice that systematically eradicates an entire group of people (e.g., genocide).
    vi_tri: Windisch và cộng sự 2022, mục Introduction
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ (giải thích): "Điểm quan trọng của Allport: các mức độ không tách rời — lời nói miệt thị ''vô hại'' hôm nay tạo đất cho phân biệt đối xử ngày mai." Chữ mới: "Theo các tóm tắt của thang: nói xấu tự nó có thể không gây hại nhưng tạo đất cho các mức nặng hơn." Cùng chỗ khó với n6 (chỉ có nguồn phụ). Review (Claude Sonnet 5.5, 10/11/2026): sai (không đúng nguồn): giải thích quiz "nói xấu tự nó có thể không gây hại nhưng tạo đất cho các mức nặng hơn" chỉ có ở ghi chú giảng bậc 3. Đã sửa theo Windisch và cộng sự 2022 (nói xấu là điểm khởi đầu, bạo lực nặng hơn dựa trên mức thấp hơn); thứ tự năm mức đã có nguồn bậc 2 (n6); lựa chọn nhiễu không dựa vào vị trí.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Như n6: thứ tự 5 mức của Allport chưa kiểm được ở nguồn bậc 1–2 mở được."
    review: sai
  - id: n42
    cau: 'Quiz 2: bốn điều kiện: địa vị ngang nhau, mục tiêu chung, hợp tác giữa các nhóm, được thể chế/luật pháp/phong tục ủng hộ; thiếu các điều kiện này tiếp xúc vẫn có thể có tác dụng, nhưng hiệu quả nhìn chung thấp hơn; trong điều kiện không thuận lợi có thể làm tăng định kiến.'
    loai: phat-hien
    nguon:
      - ptt2006
    trich: equal status between the groups in the situation; common goals; intergroup cooperation; and the support of authorities, law, or custom.
    vi_tri: Mục Introduction
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Thiếu các điều kiện này, tiếp xúc vẫn có thể có tác dụng, nhưng hiệu quả yếu hơn — và trong trường hợp xấu (bất bình đẳng, cạnh tranh) còn phản tác dụng." Chữ mới: câu trên. Lý do: n29. Review (Claude Sonnet 5.5, 10/11/2026): dung. P&T 2006: bốn điều kiện; "not essential"; Amir 1976 về điều kiện không thuận lợi.'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1037/0022-3514.90.5.751", "https://ns1.serendipstudio.org/oneworld/system/files/annurev.psych_.49.1.65-2.pdf" ]
    review: dung
  - id: n43
    cau: 'Quiz 3: 713 mẫu độc lập từ 515 nghiên cứu, tiếp xúc giảm định kiến; hiệu ứng mạnh hơn khi bốn điều kiện được đáp ứng nhưng không bắt buộc; sau đó kiểm lại trên 27 thí nghiệm ngẫu nhiên (hiệu ứng yếu hơn với định kiến chủng tộc).'
    loai: phat-hien
    nguon:
      - ptt2006
      - paluck2019
    trich: these conditions are not essential for prejudice reduction
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (giải thích): "Một trong những phát hiện được tái lập tốt nhất trong tâm lý học về định kiến — và là cơ sở khoa học cho nhiều chính sách hòa hợp." Chữ mới: kết quả kiểm lại của Paluck 2019. Lý do: "tái lập tốt nhất" và "cơ sở cho nhiều chính sách" không nguồn. Review (Claude Sonnet 5.5, 10/11/2026): dung. P&T 2006 và Paluck 2019 (đã thêm "có đo kết quả sau một thời gian" vào giải thích).'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1037/0022-3514.90.5.751", "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/142C913E7FA9E121277B29E994124EC5/S2398063X18000258a.pdf/div-class-title-the-contact-hypothesis-re-evaluated-div.pdf" ]
    review: dung
  - id: n44
    cau: 'Quiz 4: IAT đo tốc độ phản ứng khi ghép cặp các khái niệm, được diễn giải là độ mạnh của liên tưởng tự động.'
    loai: phat-hien
    nguon:
      - greenwald1998
    trich: This performance difference implicitly measures differential association of the 2 concepts with the attribute.
    vi_tri: Tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ (giải thích): "vừa là điểm mạnh (khó giả vờ) vừa là điểm yếu (khó biết chắc nó đo cái gì)". Chữ mới: "điểm yếu là khó biết chắc nó đo cái gì". Lý do: bỏ "điểm mạnh (khó giả vờ)": không có nguồn đã mở. Review (Claude Sonnet 5.5, 10/11/2026): dung. Greenwald 1998 tóm tắt: IAT "implicitly measures differential association"; lời giải thích quiz nói đúng và không dựa vào vị trí lựa chọn.'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1037/0022-3514.74.6.1464" ]
    review: dung
  - id: n45
    cau: 'Quiz 5: IAT chỉ dự đoán hành vi ở mức yếu (khoảng r = 0,14; vi hành vi r = 0,07) và không tốt hơn các biện pháp hỏi trực tiếp; phe bênh vực cho rằng hiệu ứng nhỏ ở cấp cá nhân có thể tạo hậu quả lớn ở cấp xã hội.'
    loai: so-lieu
