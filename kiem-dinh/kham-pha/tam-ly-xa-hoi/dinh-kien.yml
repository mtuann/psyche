    review: dung
  - id: n16
    cau: IAT được dùng rất rộng rãi (một trang web trình diễn thu hơn 600.000 lượt làm bài, 1998–2000) và gây nhiều tranh cãi.
    loai: so-lieu
    nguon:
      - nosek2002
    trich: Respondents at an Internet site completed over 600,000 tasks between October 1998
    vi_tri: Tóm tắt Nosek và cộng sự 2002
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "IAT nhanh chóng trở thành công cụ đo ''thiên kiến ngầm'' phổ biến nhất trong tâm lý học — và cũng là công cụ gây tranh cãi nhất". Chữ mới: "được dùng rất rộng rãi (riêng một trang web… hơn 600.000 lượt) — và cũng gây nhiều tranh cãi". Lý do: "phổ biến nhất", "gây tranh cãi nhất" là so sánh cực đại không nguồn. Review (Claude Sonnet 5.5, 10/11/2026): dung. Nosek 2002 tóm tắt: hơn 600.000 IAT trên một trang web từ 10/1998 đến 4/2000; "gây nhiều tranh cãi" có Oswald 2013, Payne 2017.'
    luot_2: dung
    luot_2_nguon: [ "https://osf.io/download/wt5sv/" ]
    luot_2_ghi_chu: "'Gây nhiều tranh cãi' có Oswald 2013, Payne 2017."
    review: dung
  - id: n17
    cau: 'Oswald và cộng sự (2013): phân tích tổng hợp: tương quan trung bình giữa IAT và hành vi khoảng r = 0,14; với vi hành vi khoảng r = 0,07 (giải thích chưa tới 1%); IAT không dự đoán tốt hơn các biện pháp hỏi trực tiếp đơn giản; ít cho biết ai sẽ phân biệt đối xử với ai.'
    loai: so-lieu
    nguon:
      - oswald2013
    trich: performed no better than simple explicit measures
    vi_tri: Tóm tắt; Bảng 1 (Overall .14 [.10, .19]; Microbehavior .07 [-.03, .18])
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "tức IAT giải thích chưa tới 1% sự khác biệt" gắn với cả hai số; "không dự đoán tốt hơn các biện pháp hỏi trực tiếp". Chữ mới: "…chưa tới 1% sự khác biệt về vi hành vi" và "không hơn các biện pháp hỏi trực tiếp đơn giản". Lý do: r = 0,14 giải thích khoảng 2%; chỉ r = 0,07 (0,5%) dưới 1%. Nguồn: "no better than simple explicit measures". Khoảng tin cậy của vi hành vi gồm cả 0. Review (Claude Sonnet 5.5, 10/11/2026): dung. Oswald 2013 toàn văn (Internet Archive): bảng 1 overall .14 [.10, .19]; microbehavior .07 [–.03, .18]; "the IAT did not predict microbehaviors well and no better than explicit measures"; "the IAT provides little insight into who will discriminate against whom". r = 0,07 giải thích khoảng 0,5% phương sai, đúng "chưa tới 1%".'
    luot_2: dung
    luot_2_nguon: [ "https://api.osf.io/v2/files/553e57a38c5e4a219919a20e/", "https://arxiv.org/pdf/2312.14984", "https://api.openalex.org/works/doi:10.1037/a0032734" ]
    luot_2_ghi_chu: Số 0,07 đọc qua trích dẫn Oswald 2015 trong arXiv; bài Oswald 2013 chưa mở toàn văn (chỉ tóm tắt). r = 0,148 làm tròn là 0,15, 'khoảng 0,14' chấp nhận được.
    review: dung
  - id: n18
    cau: Greenwald và cộng sự (2009) từng đưa ra con số lạc quan hơn (r trung bình 0,236 cho Black–White), chủ yếu do dùng tiêu chí chọn nghiên cứu khác nhau.
    loai: so-lieu
    nguon:
      - greenwald2009
      - greenwald2015
    trich: The difference between the estimates of the 2 reviews was due mostly to their use of different policies for including effect sizes.
    vi_tri: Tóm tắt Greenwald, Banaji & Nosek 2015; Greenwald 2009 bảng (.236)
    ket_qua: dung
    ghi_chu: 'G1: khớp. Oswald: r̄ = .148 theo tóm tắt 2015, trang ghi khoảng 0,14 theo Bảng 1 của Oswald. Review (Claude Sonnet 5.5, 10/11/2026): dung. Greenwald, Banaji & Nosek 2015: .236 (GPUB) so với .148 (Oswald), khác chủ yếu do chính sách chọn hiệu ứng; Greenwald 2009 toàn văn: số .236 cho nhóm Black–White. Đã thêm "cho các bài về … da đen–da trắng" trên trang.'
    luot_2: dung
    luot_2_nguon: [ "https://api.osf.io/v2/files/553e57a38c5e4a219919a20e/", "https://api.openalex.org/works/doi:10.1037/pspa0000016" ]
    review: dung
  - id: n19
    cau: 'Greenwald, Banaji và Nosek (2015): hiệu ứng thống kê nhỏ vẫn có thể có hậu quả xã hội lớn vì ảnh hưởng nhiều người cùng lúc hoặc lặp lại với cùng một người.'
    loai: phat-hien
    nguon:
      - greenwald2015
    trich: both meta-analyses estimated aggregate correlational effect sizes that were large enough to explain discriminatory impacts that are societally significant
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nếu một thiên lệch nhỏ ảnh hưởng đến hàng triệu quyết định (tuyển dụng, cho vay, kết án...)". Chữ mới: "nhiều người cùng lúc hoặc lặp lại với cùng một người". Lý do: tóm tắt nói "can affect many people simultaneously or … repeatedly affect single persons"; ví dụ tuyển dụng, cho vay, kết án không có trong nguồn. Review (Claude Sonnet 5.5, 10/11/2026): dung. Greenwald, Banaji & Nosek 2015 tóm tắt (OpenAlex): "can affect many people simultaneously or … repeatedly affect single persons"; chữ trong mục nghiên cứu khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://api.osf.io/v2/files/553e57a38c5e4a219919a20e/", "https://api.openalex.org/works/doi:10.1037/pspa0000016" ]
    luot_2_ghi_chu: Bản đọc là bản thảo ngày 2/9/2014 trên OSF.
    review: dung
  - id: n20
    cau: 'Khung Đang tranh cãi: IAT đo được gì và có nên dùng nó để "chẩn đoán" con người? Phê bình: thiếu ổn định qua vài tuần, phần lớn phương sai mang tính tình huống, dự đoán hành vi yếu; bênh vực: hiệu ứng nhỏ vẫn có thể gây hậu quả xã hội đáng kể khi ảnh hưởng nhiều người cùng lúc hay lặp lại với cùng một người, và hạn chế về độ tin cậy ít gây vấn đề ở cấp hệ thống, nơi mẫu lớn.'
    loai: nhan
    nguon:
      - oswald2013
      - payne2017
      - greenwald2015
      - nosek2002
    trich: unstable across a few weeks
    vi_tri: Payne và cộng sự 2017, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "điểm IAT thiếu ổn định khi đo lại, chịu ảnh hưởng của yếu tố tình huống, và dự đoán hành vi… rất kém… không hơn gì hỏi trực tiếp". Chữ mới: "thiếu ổn định qua vài tuần, phần lớn phương sai mang tính tình huống, dự đoán… ở mức yếu… không hơn các biện pháp hỏi trực tiếp đơn giản". Lý do: bám nguồn (Payne: "unstable across a few weeks"; "most of the systematic variance… is situational"); "rất kém" bỏ. Review (Claude Sonnet 5.5, 10/11/2026): sai (không nguồn): khung Đang tranh cãi viết phe bênh vực đáp lại "hiệu ứng nhỏ nhân với hàng triệu quyết định" và "IAT vẫn hữu ích để thăm dò các liên tưởng tự động". Bản thảo Greenwald, Banaji & Nosek (OSF/PsyArXiv, đọc toàn văn) không có "hàng triệu quyết định" và không có câu về "thăm dò"; có: ảnh hưởng nhiều người cùng lúc hay lặp lại với một người, và độ tin cậy hạn chế, hiệu ứng nhỏ "not problematic in diagnosing system-level discrimination". Đã sửa trên trang theo đó. Nhãn Đang tranh cãi chốt: hai phân tích tổng hợp (Greenwald 2009, Oswald 2013) khác nhau nhiều về hiệu ứng và về cách diễn giải, chưa phân xử.'
    nhan: tranh-cai
    co_so:
      - oswald2013
      - payne2017
      - greenwald2015
    ly_do: 'Mục 4: hai phân tích tổng hợp (Greenwald 2009 r = 0,236 và Oswald 2013 r = 0,14) khác nhau vì tiêu chí chọn; phía phê bình và phía bênh vực cùng thừa nhận hiệu ứng nhỏ nhưng diễn giải khác (hiệu quả cấp cá nhân so với cấp tập thể: Payne 2017 thấy IAT cấp tập thể liên hệ mạnh với chênh lệch tổng hợp); bằng chứng chất lượng cao mâu thuẫn về cách diễn giải.'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1080/1047840X.2017.1335568", "https://api.osf.io/v2/files/553e57a38c5e4a219919a20e/", "https://api.openalex.org/works/doi:10.1037/a0032734" ]
    luot_2_ghi_chu: Nhãn Đang tranh cãi đạt thước đo (hai phân tích tổng hợp, hai cách diễn giải cạnh tranh).
    review: sai
  - id: n21
    cau: 'Nosek và cộng sự (2002): người da đen làm bài thể hiện ưa thích nhẹ người da trắng hơn da đen trên IAT (d = 0,16), dù tự báo cáo ưu ái nhóm mình rõ rệt; ở bài dùng khuôn mặt, xu hướng đảo chiều.'
    loai: so-lieu
    nguon:
      - nosek2002
    trich: Black respondents showed a weak preference for White over Black
    vi_tri: Mục Results (race IAT, đối chiếu bản tác giả)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (G1: ĐÁNG NGỜ): "Thậm chí người da đen làm bài cũng thường cho kết quả ''thiên vị da trắng''". Trang đã áp sửa G1; chữ hiện tại: "Ngay cả người da đen làm bài, dù tự báo cáo ưu ái nhóm mình rõ rệt, trên IAT tính trung bình lại không ưu ái nhóm mình, thậm chí hơi nghiêng về phía da trắng". Đối chiếu lại bản tác giả: trên bài chủng tộc d = 0,16 nghiêng da trắng; bài khuôn mặt đảo chiều. Chữ trên trang khớp. Review (Claude Sonnet 5.5, 10/11/2026): dung. Nosek 2002 toàn văn (bản OSF, mở lại): người da đen explicit ưa da đen (d = .80) nhưng IAT "weak preference for White over Black (d = .16)"; chú thích 6: ở tập dữ liệu thận trọng (mỗi IP một lần) bài khuôn mặt đảo thành hơi nghiêng về da đen. Chữ trên trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://osf.io/download/wt5sv/" ]
    luot_2_ghi_chu: Câu khớp; 'ở bài dùng khuôn mặt, xu hướng đảo chiều' đúng ở bộ dữ liệu thận trọng (một IP một lần), không phải toàn bộ.
    review: dung
  - id: n22
    cau: Điểm IAT có thể phản ánh các đánh giá văn hóa mà người làm bài không tán thành (cách diễn giải của chính nhóm tác giả), chứ không hẳn là thái độ của cá nhân.
    loai: phat-hien
    nguon:
      - nosek2002
    trich: the role of culturally imposed evaluations of social groups and the permeability of such evaluations into the minds of individual members of the culture
    vi_tri: Mục Discussion
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cho thấy IAT có thể đo khuôn mẫu văn hóa mà người làm bài không tán thành, chứ không hẳn là thái độ thù ghét của cá nhân." Chữ mới: "gợi ý rằng điểm IAT có thể phản ánh các đánh giá văn hóa… (một cách diễn giải của chính nhóm tác giả)". Lý do: "cho thấy" mạnh hơn nguồn (tác giả chỉ nêu "raise many questions"); "thù ghét" bỏ. Review (Claude Sonnet 5.5, 10/11/2026): dung. Nosek 2002, Discussion: "raise many questions … the role of culturally imposed evaluations …"; trang viết "gợi ý", "một cách diễn giải của chính nhóm tác giả".'
    luot_2: dung
    luot_2_nguon: [ "https://osf.io/download/wt5sv/" ]
    review: dung
  - id: n23
    cau: 'Điểm đồng thuận giữa hai phe: không nên dùng điểm IAT của một cá nhân để kết luận người đó "có định kiến"; nhóm bênh vực IAT cảnh báo dùng thước đo này để chẩn đoán cá nhân có nguy cơ phân loại sai cao; IAT không phải công cụ chẩn đoán cá nhân.'
    loai: phat-hien
    nguon:
      - g1l04
    trich: attempts to diagnostically use such measures for individuals risk undesirably high rates of erroneous classifications
    vi_tri: Greenwald, Banaji & Nosek 2015, theo G1-L04
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "không nên dùng điểm IAT của một cá nhân để kết luận người đó ''có định kiến'', càng không nên dùng nó để ra quyết định tuyển dụng hay kỷ luật." Chữ mới: câu trên. Lý do: vế "tuyển dụng hay kỷ luật" không có nguồn; câu trích là của Greenwald, Banaji & Nosek (2015) theo G1 (không mở lại toàn văn: không tìm được bản mở). Chỗ khó: nhận định nhờ G1; review nên mở lại bài nếu có bản. Review (Claude Sonnet 5.5, 10/11/2026): dung. đã mở toàn văn bản thảo Greenwald, Banaji & Nosek (OSF): "Attempts to use such measures diagnostically for individuals therefore risk undesirably high rates of erroneous classifications"; phía Oswald (2013) nói IAT "provides little insight into who will discriminate against whom". Chữ "điểm đồng thuận" là diễn giải hợp lý của hai nguồn ấy.'
    luot_2: dung
    luot_2_nguon: [ "https://api.osf.io/v2/files/553e57a38c5e4a219919a20e/", "https://api.openalex.org/works/doi:10.1037/a0032734" ]
    luot_2_ghi_chu: Vế 'phe Oswald đồng ý' chỉ có tóm tắt Oswald 2013 (yếu dự đoán), không có câu nói trực tiếp về chẩn đoán cá nhân.
    review: dung
  - id: n24
    cau: 'Phân loại xã hội: trong các thí nghiệm nhóm tối thiểu của Tajfel (1971), chỉ cần xếp người tham gia vào hai nhóm trên cơ sở rất tầm thường (được cho biết theo sở thích tranh Klee hay Kandinsky, thực tế xếp ngẫu nhiên), họ đã có xu hướng ưu ái nhóm mình.'
    loai: phat-hien
    nguon:
      - tajfel1971
    trich: the subjects favoured their own group in the distribution of real rewards and penalities in a situation in which nothing but the variable of fairly irrelevant classification distinguished between the ingroup and the outgroup
    vi_tri: Tóm tắt (Summary), tr. 149
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chỉ cần chia người tham gia vào hai nhóm hoàn toàn ngẫu nhiên, họ đã bắt đầu ưu ái phe mình". Chữ mới: câu trên. Lý do: bài 1971 nói nhóm hình thành theo "classification" ít liên quan (sở thích tranh, hoặc ước lượng điểm), và "assigned randomly" thực tế; người tham gia không biết là ngẫu nhiên; "bắt đầu" bỏ. Review (Claude Sonnet 5.5, 10/11/2026): sai (một phần): nhóm tối thiểu Tajfel 1971 đã mở toàn văn (Internet Archive): thí nghiệm 2 chia theo "ưa tranh Klee hay Kandinsky" nhưng thực tế xếp ngẫu nhiên, người tham gia ưu ái nhóm mình khi chia phần thưởng; câu của mục này đúng. Nhưng câu đầu mục trên trang viết "Não ta tự động chia thế giới thành phe mình và phe họ" mạnh hơn Tajfel (không đo "não" hay "tự động"). Đã sửa thành "Ta có xu hướng chia người khác thành phe mình và phe họ".'
    luot_2: khong-chac
    luot_2_ghi_chu: "Không mở được toàn văn Tajfel et al. (1971): chỉ có tóm tắt (xác nhận 'favoured their own group ... fairly irrelevant classification'). Chi tiết 'Klee hay Kandinsky, thực tế xếp ngẫu nhiên' chỉ gặp ở nguồn thứ cấp bậc 3."
    review: sai
  - id: n25
    cau: 'Học tập xã hội: theo OpenStax, trẻ em học thái độ định kiến từ cha mẹ, thầy cô, bạn bè và truyền thông; định kiến duy trì nhờ học tập xã hội và sự tuân theo chuẩn mực xã hội.'
    loai: phat-hien
    nguon:
      - openstax-dk
    trich: 'Children learn prejudiced attitudes and beliefs from society: their parents, teachers, friends, the media, and other sources of socialization'
    vi_tri: OpenStax 12.5
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nhiều định kiến được học từ gia đình, bạn bè, trường học và truyền thông — trẻ em tiếp thu thái độ của người lớn xung quanh từ trước khi kịp hiểu những thái độ đó có nghĩa gì." Chữ mới: theo OpenStax. Lý do: vế "từ trước khi kịp hiểu" không có nguồn. Cùng sửa ở mục Điều gì đang xảy ra. Review (Claude Sonnet 5.5, 10/11/2026): dung. OpenStax 12.5 (đọc lại): "Children learn prejudiced attitudes and beliefs from society: their parents, teachers, friends, the media".'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/12-5-prejudice-and-discrimination" ]
    review: dung
  - id: n26
    cau: Các nhóm cảm thấy bị đe dọa hoặc cạnh tranh có thể nhìn nhóm ngoài tiêu cực hơn (một phân tích tổng hợp, 95 mẫu, 5 loại đe dọa liên hệ dương với thái độ tiêu cực với nhóm ngoài); mục tiêu chung buộc các nhóm hợp tác là một điều kiện của tiếp xúc giảm định kiến, như trong Robbers Cave.
    loai: phat-hien
    nguon:
      - robbers
      - ptt2006
    trich: The meta-analysis, involving 95 samples, revealed that 5 different threat types had a positive relationship with negative outgroup attitudes.
    vi_tri: Riek và cộng sự (2006), tóm tắt, theo hồ sơ thi-nghiem/robbers-cave (đã khóa)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Khi các nhóm cạnh tranh việc làm, tài nguyên, địa vị — hoặc chỉ cần tin rằng mình đang cạnh tranh — định kiến bùng lên." Chữ mới: câu trên. Lý do: "hoặc chỉ cần tin rằng" không có nguồn đã mở; thay bằng kết quả đã khóa ở trang nhà (khớp nk1 và nk2 của Robbers Cave); ở bài này chỉ tóm, link trang nhà. Review (Claude Sonnet 5.5, 10/11/2026): dung. Riek và cộng sự 2006 theo trang Robbers Cave đã khóa (95 mẫu, 5 loại đe dọa): trang nhà có đúng câu; chỉ tóm một câu và link về.'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1207/s15327957pspr1004_4", "https://api.openalex.org/works/doi:10.1086/222258", "https://ns1.serendipstudio.org/oneworld/system/files/annurev.psych_.49.1.65-2.pdf" ]
    review: dung
  - id: n27
    cau: 'Pettigrew (1998): bốn cơ chế trung gian của tiếp xúc: hiểu biết hơn về nhóm ngoài, thay đổi hành vi, gắn kết cảm xúc (tình bạn), đánh giá lại nhóm mình.'
    loai: phat-hien
    nguon:
      - pettigrew1998
    trich: 'The chapter proposes four processes: learning about the outgroup, changed behavior, affective ties, and ingroup reappraisal.'
    vi_tri: Tóm tắt
    ket_qua: dung
    ghi_chu: 'G1: khớp. Review (Claude Sonnet 5.5, 10/11/2026): dung. Pettigrew 1998 (đọc lại): bốn quá trình: học về nhóm ngoài, đổi hành vi, gắn kết cảm xúc, đánh giá lại nhóm mình.'
    luot_2: dung
    luot_2_nguon: [ "https://ns1.serendipstudio.org/oneworld/system/files/annurev.psych_.49.1.65-2.pdf" ]
    review: dung
  - id: n28
    cau: Pettigrew (1998) coi tình bạn liên nhóm là con đường tiếp xúc đặc biệt mạnh vì kích hoạt cả bốn cơ chế; cảm xúc tích cực với một người có thể lan ra cả nhóm của họ.
    loai: phat-hien
    nguon:
      - pettigrew1998
    trich: because it potentially invokes all four mediating processes
    vi_tri: Mục A Reformulation of Intergroup Contact Theory
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (G1: KHÔNG KIỂM ĐƯỢC): "Dạng tiếp xúc mạnh nhất là tình bạn liên nhóm". Chữ mới: "Pettigrew (1998) coi tình bạn liên nhóm là một con đường tiếp xúc đặc biệt mạnh vì nó kích hoạt cả bốn cơ chế". Lý do: nguồn chỉ nói "potent", chưa có số so sánh với các dạng tiếp xúc khác; câu bỏ "mạnh nhất". Review (Claude Sonnet 5.5, 10/11/2026): dung. Pettigrew 1998: "Intergroup friendship is potent because it potentially invokes all four mediating processes".'
    luot_2: dung
    luot_2_nguon: [ "https://ns1.serendipstudio.org/oneworld/system/files/annurev.psych_.49.1.65-2.pdf" ]
    review: dung
  - id: n29
    cau: Tiếp xúc trong điều kiện không thuận lợi có thể làm tăng định kiến và căng thẳng giữa các nhóm (Amir, 1976, dẫn trong P&T 2006); một nghiên cứu ở Alabama thấy định kiến tăng khi cả bốn điều kiện đều bị vi phạm.
    loai: phat-hien
    nguon:
      - ptt2006
      - pettigrew1998
    trich: contact under unfavorable conditions "may increase prejudice and intergroup tension"
    vi_tri: Pettigrew & Tropp 2006, mục Introduction; Pettigrew 1998, mục Initial Empirical Evidence
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "tiếp xúc hời hợt, gượng ép, hoặc trong thế cạnh tranh có thể phản tác dụng — đúng như Allport đã cảnh báo từ 1954". Chữ mới: câu trên. Lý do: "hời hợt, gượng ép" không có nguồn; "Allport cảnh báo" cần sách gốc (n6). Cùng sửa ngộ nhận 2 và đáp án quiz 2. Review (Claude Sonnet 5.5, 10/11/2026): dung. P&T 2006: "contact under unfavorable conditions may increase prejudice and intergroup tension" (Amir 1976, tr. 308); Pettigrew 1998: nghiên cứu Alabama (Sims & Patrick 1936) thấy định kiến tăng khi cả bốn điều kiện bị vi phạm, sinh viên da trắng miền Bắc tăng định kiến chống da đen theo từng năm ở miền Nam.'
    luot_2: dung
    luot_2_nguon: [ "https://ns1.serendipstudio.org/oneworld/system/files/annurev.psych_.49.1.65-2.pdf" ]
    luot_2_ghi_chu: Vế 'Amir 1976 dẫn trong P&T 2006' chưa mở được toàn văn P&T 2006.
    review: dung
  - id: n30
    cau: Điểm IAT của bạn không phải "bản chẩn đoán" con người bạn; đừng dùng nó để tự kết tội mình hay đánh giá người khác.
    loai: loi-khuyen
    nguon:
      - g1l04
      - oswald2013
    trich: attempts to diagnostically use such measures for individuals risk undesirably high rates of erroneous classifications
    vi_tri: Greenwald, Banaji & Nosek 2015, theo G1-L04; Oswald 2013 (r = 0,14)
    ket_qua: dung
    ghi_chu: "Gắn nhãn Đang tranh cãi của khung n20; lời khuyên nhẹ, đúng quy tắc nội dung của site (không chẩn đoán). Review (Claude Sonnet 5.5, 10/11/2026): dung. lời khuyên nhẹ (không dùng IAT để kết tội ai), dựa trên cảnh báo của chính phía bênh vực (n23) và Oswald 2013; không phải chẩn đoán."
    luot_2: dung
    luot_2_nguon: [ "https://api.osf.io/v2/files/553e57a38c5e4a219919a20e/" ]
    review: dung
  - id: n31
    cau: 'Một phân tích tổng hợp (Forscher và cộng sự, 2019): các quy trình làm đổi điểm đo ngầm thường chỉ đổi hành vi rất ít, và thay đổi ở điểm đo ngầm không giải thích thay đổi ở hành vi; điều đó gợi ý hiệu quả của các khóa "xóa thiên kiến vô thức" dựa trên IAT chưa có bằng chứng rõ ràng.'
    loai: phat-hien
    nguon:
      - forscher2019
    trich: generally produced trivial changes in behavior
    vi_tri: Tóm tắt (OpenAlex, bị cắt đầu)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (G1: KHÔNG KIỂM ĐƯỢC): "Hiệu quả của các khóa huấn luyện ''xóa thiên kiến vô thức'' dựa trên IAT cũng chưa có bằng chứng rõ ràng." Chữ mới: câu trên. Lý do: Forscher 2019 xét các quy trình thực nghiệm, không xét các khóa huấn luyện; phần "gợi ý" là suy luận, ghi rõ trên trang. Chỉ đọc tóm tắt. Review (Claude Sonnet 5.5, 10/11/2026): dung. tóm tắt Forscher 2019: "generally produced trivial changes in behavior", "changes in implicit measures did not mediate changes in explicit measures or behavior"; phần "gợi ý" về khóa học là diễn giải và đã ghi "gợi ý".'
    luot_2: dung
    luot_2_nguon: [ "https://osf.io/download/b5m97/" ]
    luot_2_ghi_chu: Bản đọc là bản thảo tác giả (OSF). Phần 'khóa xóa thiên kiến vô thức chưa có bằng chứng' là diễn giải rộng hơn bài, nhưng câu có chữ 'gợi ý'.
    review: dung
  - id: n32
    cau: 'Theo Pettigrew (1998), sự ủng hộ của cơ quan có thẩm quyền thiết lập chuẩn mực chấp nhận và làm tiếp xúc được đón nhận hơn; gợi ý suy ra: quy trình tuyển dụng công bằng và người có ảnh hưởng công khai lên án định kiến có thể giúp tiếp xúc liên nhóm dễ thành công (chưa kiểm trực tiếp).'
    loai: loi-khuyen
    nguon:
      - pettigrew1998
    trich: Authority support establishes norms of acceptance.
    vi_tri: Mục Allport's conditions, đoạn về authority support
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Quy trình tuyển dụng công bằng, chính sách chống phân biệt đối xử được thực thi nghiêm, và việc người có ảnh hưởng công khai lên án định kiến, đều tạo ''khí hậu'' khiến tiếp xúc liên nhóm dễ thành công hơn." Chữ mới: câu trên. Lý do: nguồn chỉ nói về điều kiện ủng hộ của thể chế; các ví dụ cụ thể là suy luận. Review (Claude Sonnet 5.5, 10/11/2026): dung. Pettigrew 1998: "Authority support establishes norms of acceptance"; phần quy trình tuyển dụng và người có ảnh hưởng là suy ra, đã ghi chưa kiểm trực tiếp.'
    luot_2: dung
    luot_2_nguon: [ "https://ns1.serendipstudio.org/oneworld/system/files/annurev.psych_.49.1.65-2.pdf" ]
    luot_2_ghi_chu: Gợi ý tuyển dụng/lên án định kiến là suy ra, đã ghi chưa kiểm trực tiếp.
    review: dung
  - id: n33
    cau: Phân tích tổng hợp của Pettigrew và Tropp bao gồm 38 quốc gia.
    loai: so-lieu
    nguon:
      - ptt2006
    trich: Combined, 250,089 individuals from 38 nations
    vi_tri: Mục Method
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "bao phủ hàng chục quốc gia". Chữ mới: "bao gồm 38 quốc gia". Lý do: có số cụ thể (G1: khớp "38 nations"). Review (Claude Sonnet 5.5, 10/11/2026): dung. P&T 2006 toàn văn (mở lại): "Combined, 250,089 individuals from 38 nations".'
    luot_2: dung
    luot_2_nguon: [ "https://www.iser.osaka-u.ac.jp/static/resources/docs/dp/DP1319.pdf" ]
    luot_2_ghi_chu: Chỉ có nguồn thứ cấp (bản thảo thảo luận ISER 2025) trích P&T 2006; bài gốc không mở được (trang trường chặn). Con số 515 khớp tóm tắt gốc.
    review: dung
  - id: n34
    cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm chứng giả thuyết tiếp xúc trực tiếp trên người Việt, và cũng chưa tìm thấy dữ liệu IAT trên mẫu Việt Nam.
    loai: thoi-su
    nguon:
      - tim-kiem-vn
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chúng tôi chưa tìm thấy… và cũng chưa có dữ liệu IAT trên mẫu Việt Nam" (G1: là kết quả tìm kiếm của site, không kiểm). Chữ mới thêm mốc, đổi "chưa có" thành "chưa tìm thấy". Tìm 10/11/2026 trên Crossref: "intergroup contact hypothesis Vietnam prejudice" (8 kết quả đầu: chương tổng quan, không có mẫu Việt Nam) và "implicit association test Vietnamese" (không có mẫu Việt Nam); chưa tìm Project Implicit hay tạp chí trong nước. Review (Claude Sonnet 5.5, 10/11/2026): dung. thời sự có mốc 11/2026, hạn 2027-11-01, nguồn tim-kiem-vn; câu "chưa tìm thấy", không khẳng định chưa có.'
    het_han: '2027-11-01'
    luot_2: dung
    luot_2_nguon: [ "https://api.crossref.org/works?query=intergroup%20contact%20prejudice%20Vietnam%20experiment&rows=6", "https://api.crossref.org/works?query=implicit%20association%20test%20Vietnamese%20participants&rows=6" ]
    luot_2_ghi_chu: "Câu 'chưa tìm thấy' có mốc; tìm kiếm hạn chế. Ngày kiểm: 2026-11-10."
    review: dung
  - id: n35
    cau: 'Điều đó không có nghĩa Việt Nam "không có định kiến": bài này chỉ không có bằng chứng thực nghiệm về người Việt để dẫn; cần nghiên cứu có thiết kế (đo trước–sau, có nhóm đối chứng); Paluck và cộng sự (2019) chỉ ra khoảng trống: chưa có thí nghiệm ngẫu nhiên có đo kết quả sau một thời gian về định kiến chủng tộc, sắc tộc của người trưởng thành.'
    loai: loi-khuyen
    nguon:
      - paluck2019
    trich: most notably the absence of studies addressing adults' racial or ethnic prejudices
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "định kiến vùng miền, với người nhiễm HIV, người đồng tính, người khuyết tật hay lao động nhập cư đều là những hiện tượng xã hội có thật — nhưng hiện chủ yếu được ghi nhận qua báo chí và quan sát… Các chương trình giao lưu văn hóa giữa các dân tộc… là ứng viên tự nhiên để kiểm chứng." Chữ mới: câu trên. Lý do: danh sách nhóm bị định kiến ở Việt Nam và "chủ yếu qua báo chí" không có nguồn. Review (Claude Sonnet 5.5, 10/11/2026): sai (quá mạnh): "khoảng trống lớn ở các nghiên cứu về định kiến của người trưởng thành" rộng hơn nguồn; Paluck 2019 nói "the absence of studies addressing adults'' racial or ethnic prejudices". Đã sửa thành "chưa có thí nghiệm ngẫu nhiên có đo kết quả sau một thời gian về định kiến chủng tộc, sắc tộc của người trưởng thành".'
    luot_2: dung
    luot_2_nguon: [ "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/142C913E7FA9E121277B29E994124EC5/S2398063X18000258a.pdf/div-class-title-the-contact-hypothesis-re-evaluated-div.pdf" ]
    luot_2_ghi_chu: Phạm vi bài là định kiến chủng tộc/sắc tộc ở người lớn; câu 'định kiến của người trưởng thành' nên thêm 'chủng tộc/sắc tộc'.
    review: sai
  - id: n36
    cau: 'Ngộ nhận: "Có điểm IAT cao nghĩa là bạn phân biệt chủng tộc": điểm IAT của một cá nhân không đủ để kết luận; nhóm tác giả của Nosek và cộng sự (2002) nêu khả năng nó phản ánh các đánh giá văn hóa.'
    loai: phat-hien
    nguon:
      - nosek2002
    trich: the role of culturally imposed evaluations of social groups and the permeability of such evaluations into the minds of individual members of the culture
    vi_tri: Mục Discussion
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (đã áp sửa G1): "Người da đen làm bài, tính trung bình, cũng không cho thấy ưu ái nhóm mình như khi tự báo cáo" và "phản ánh cả những khuôn mẫu văn hóa mà bạn không hề tán thành". Chữ mới: câu trên. Lý do: "phản ánh" chắc chắn → "nêu khả năng"; vế người da đen chuyển sang n21. Review (Claude Sonnet 5.5, 10/11/2026): dung. Nosek 2002 (n22); nội dung ngộ nhận không nói quá ("nêu khả năng").'
    luot_2: dung
    luot_2_nguon: [ "https://osf.io/download/wt5sv/", "https://api.osf.io/v2/files/553e57a38c5e4a219919a20e/" ]
    review: dung
  - id: n37
    cau: 'Ngộ nhận "Cứ tiếp xúc là hết định kiến": tiếp xúc trong điều kiện không thuận lợi có thể làm tăng định kiến (xem n29).'
    loai: phat-hien
    nguon:
      - ptt2006
    trich: contact under unfavorable conditions "may increase prejudice and intergroup tension"
    vi_tri: Mục Introduction
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Tiếp xúc trong thế bất bình đẳng, trong cạnh tranh, hoặc tiếp xúc tiêu cực có thể làm định kiến tệ hơn. Allport đưa ra bốn điều kiện chính là vì lý do này." Chữ mới: như n29. Lý do: vế "bất bình đẳng, cạnh tranh" và "chính là vì lý do này" không có nguồn. Review (Claude Sonnet 5.5, 10/11/2026): dung. P&T 2006 (Amir 1976) và Pettigrew 1998 (Alabama); trang viết "có thể làm tăng".'
    luot_2: dung
    luot_2_nguon: [ "https://ns1.serendipstudio.org/oneworld/system/files/annurev.psych_.49.1.65-2.pdf" ]
    review: dung
  - id: n38
    cau: 'Ngộ nhận "Định kiến chỉ là chuyện của kẻ xấu tính": định kiến nảy sinh từ phân loại nhóm, chuẩn mực xã hội và cạnh tranh; người tử tế vẫn có thể mang định kiến.'
    loai: phat-hien
    nguon:
      - openstax-dk
      - tajfel1971
    trich: Prejudice and discrimination persist in society due to social learning and conformity to social norms.
    vi_tri: OpenStax 12.5
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…cách não phân loại nhóm, từ chuẩn mực xã hội và từ cạnh tranh tài nguyên — những người tử tế vẫn có thể mang định kiến mà không hay biết." Chữ mới: bỏ "mà không hay biết". Lý do: "không hay biết" thuộc về tranh luận IAT (n20), không có nguồn riêng. Review (Claude Sonnet 5.5, 10/11/2026): dung. OpenStax 12.5 (học tập xã hội, chuẩn mực), Tajfel 1971 (phân loại), Riek 2006 (cạnh tranh, đe dọa); câu cuối "người tử tế vẫn có thể mang định kiến" là khái quát từ các cơ chế ấy, chấp nhận.'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1002/ejsp.2420010202", "https://openstax.org/books/psychology-2e/pages/12-5-prejudice-and-discrimination", "https://api.openalex.org/works/doi:10.1207/s15327957pspr1004_4", "https://api.openalex.org/works/doi:10.1037/0022-3514.74.6.1464" ]
    review: dung
  - id: n39
    cau: 'Ngộ nhận "Giảm được định kiến trong đầu là tự khắc hết phân biệt đối xử": thái độ và hành vi không trùng khít; ở cấp cá nhân điểm IAT liên hệ yếu với hành vi, nhưng ở cấp tập thể (quốc gia, bang, hạt) mức thiên kiến ngầm trung bình liên hệ mạnh với mức chênh lệch và phân biệt đối xử.'
    loai: phat-hien
    nguon:
      - payne2017
      - oswald2013
    trich: studies of aggregate levels of implicit bias (i.e., countries, states, counties) are strongly associated with aggregate levels of disparities and discrimination
    vi_tri: Payne và cộng sự 2017, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "quy trình tuyển dụng thiên lệch hay luật lệ phân biệt vẫn tạo ra bất bình đẳng ngay cả khi thái độ cá nhân đã cải thiện — và ngược lại." Chữ mới: câu trên. Lý do: vế cũ là khẳng định không nguồn; thay bằng kết quả tóm tắt Payne 2017. Review (Claude Sonnet 5.5, 10/11/2026): dung. Payne, Vuletich & Lundberg 2017 tóm tắt: cấp cá nhân liên hệ yếu, cấp tổng hợp (quốc gia, bang, hạt) "strongly associated" với chênh lệch.'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1080/1047840X.2017.1335568" ]
    review: dung
  - id: n40
    cau: 'Đọc thêm: Vì sao ta làm theo số đông? (thí nghiệm Asch và sự phù hợp); Quảng cáo thuyết phục ta thế nào? (mô hình ELM).'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: hai trang có trong src/data/trang.yml; tiêu đề và nội dung khớp (phu-hop-so-dong: Asch; thuyet-phuc: ELM). Đã sửa ở phu-hop-so-dong (n40 hồ sơ ấy): trang này giữ. Review (Claude Sonnet 5.5, 10/11/2026): dung. Chỉ nói về site: phu-hop-so-dong (Asch, sự phù hợp) và thuyet-phuc (ELM) có trong trang.yml và có file, tên và nội dung khớp.'
