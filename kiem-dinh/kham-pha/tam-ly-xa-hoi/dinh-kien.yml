    vi_tri: Tóm tắt
    ket_qua: dung
    ghi_chu: 'G1: khớp. Review (Claude Sonnet 5.5, 10/11/2026): dung. Oswald 2013 (n17) và Greenwald, Banaji & Nosek 2015 (n19).'
