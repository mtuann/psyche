nhan_dinh:
  - id: n1
    cau: Ophir, Nass và Wagner (2009) thấy người đa nhiệm truyền thông nặng làm kém hơn ở các bài kiểm tra kiểm soát nhận thức, nhưng nhiều kết quả sau chưa lặp lại; Uncapher và Wagner (2018) tổng quan một thập kỷ nghiên cứu (mô tả của trang).
    loai: phat-hien
    nguon:
      - ophir2009
      - wiradhany2017
      - uncapher2018
    trich: Results showed that heavy media multitaskers are more susceptible to interference from irrelevant environmental stimuli and from irrelevant representations in memory.
    vi_tri: Tóm tắt Ophir 2009
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (description): "người đa nhiệm truyền thông nặng chuyển đổi nhiệm vụ kém hơn" (nói như kết quả chắc; không lặp lại ở bốn nghiên cứu sau, G1 #1). Chữ mới thêm "nhiều kết quả sau chưa lặp lại". Review (Claude Sonnet 5.5, 10/11/2026): dung. Ophir 2009 (tóm tắt Europe PMC): nhóm nặng dễ nhiễu hơn, chuyển đổi nhiệm vụ kém hơn; Wiradhany 2017 (toàn văn): kết quả chuyển đổi không lặp lại ở bốn nghiên cứu sau; Parry & le Roux 2021: "ten years on, we are no closer to understanding". Khớp chữ mô tả.'
    review: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1073/pnas.0903620106", "https://doi.org/10.1073/pnas.1611612115" ]
    luot_2_ghi_chu: Ophir 2009 (tóm tắt, toàn văn bản PDF lưu trữ) và Uncapher & Wagner 2018 khớp; "chưa lặp lại" khớp Wiradhany & Nieuwenstein 2017 và Parry & le Roux 2021.
  - id: n2
    cau: Não người gần như không làm tốt được hai việc đòi hỏi chú ý cùng lúc; cái gọi là "đa nhiệm" thường thực chất là chuyển đổi nhiệm vụ, và mỗi lần chuyển đều tốn "phí chuyển đổi" (chậm hơn, sai nhiều hơn).
    loai: phat-hien
    nguon:
      - watson2010
      - kiesel2010
      - pashler1994
    trich: Whereas the vast majority of participants showed significant performance decrements in dual-task conditions
    vi_tri: Tóm tắt Watson & Strayer 2010
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Não người không làm được…" (G1 #5: tuyệt đối hóa); G1 đã sửa thành "gần như không". Phần "thực chất là chuyển đổi nhiệm vụ… tốn phí" suy từ Kiesel (2010) về switch cost; "thực chất" là cách nói của trang. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: "…cái ta gọi là ''đa nhiệm'' thực chất là chuyển đổi nhiệm vụ…" Chữ mới: "…thường thực chất là chuyển đổi nhiệm vụ…" Lý do: nguồn (Watson & Strayer 2010: đa số giảm hiệu suất, 2,5% không; Pashler 1994: "stubborn bottleneck") cho thấy hai việc đòi hỏi chú ý thường gây nhiễu, không cho phép nói chắc "thực chất" cho mọi người.'
    review: sai
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.3758/PBR.17.4.479", "https://doi.org/10.1037/a0019842", "https://kops.uni-konstanz.de/bitstreams/5a39a685-94f4-4ab0-b450-6bc0145db6c7/download" ]
    luot_2_ghi_chu: 'Watson & Strayer: đa số giảm hiệu suất khi làm hai việc đòi hỏi chú ý (có ngoại lệ ~2,5%). Kiesel và cộng sự 2010: phí chuyển đổi là hiện tượng chuẩn của tâm lý học nhận thức. "Gần như" đã chừa chỗ cho ngoại lệ.'
  - id: n3
    cau: Nhóm đa nhiệm nhiều nhất lại chuyển đổi nhiệm vụ kém hơn, dù kết quả này chưa được các nghiên cứu sau lặp lại.
    loai: phat-hien
    nguon:
      - ophir2009
      - wiradhany2017
    trich: Ophir et al.'s finding of increased switch costs in HMMs was not replicated in four subsequent studies
    vi_tri: Wiradhany 2017, tr. 2621
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "những người đa nhiệm nhiều nhất lại thường là những người chuyển đổi nhiệm vụ kém nhất" (G1 #1: sai, kết luận mạnh hơn nguồn). Theo G1-L03 (22/10/2026): sửa đã áp. Review (Claude Sonnet 5.5, 10/11/2026): dung. Wiradhany 2017 (toàn văn): "Ophir et al.''s finding of increased switch costs in HMMs was not replicated in four subsequent studies"; chữ trang chỉ nói chưa lặp lại.'
    review: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1073/pnas.0903620106", "https://doi.org/10.5817/cp2021-2-7" ]
    luot_2_ghi_chu: 'Ophir: phí chuyển đổi của nhóm nặng lớn hơn 167 ms. Parry & le Roux (toàn văn): bằng chứng không ủng hộ ý cho rằng đa nhiệm giúp chuyển đổi tốt hơn và "not associated with attenuated abilities to manage tasks", tức không lặp lại kết quả chuyển đổi kém.'
  - id: n4
    cau: Đa nhiệm truyền thông (media multitasking) là dùng nhiều luồng truyền thông cùng lúc, hẹp hơn "đa nhiệm" nói chung; ví dụ vừa xem TV vừa lướt điện thoại, vừa học vừa nghe nhạc.
    loai: dinh-nghia
    nguon:
      - uncapher2018
    trich: individuals who differ in the extent to which they simultaneously engage with multiple media streams, or "media multitasking."
    vi_tri: Tóm tắt Uncapher & Wagner 2018
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ có thêm "đa nhiệm truyền thông gắn liền với các thiết bị được thiết kế để giành giật chú ý của bạn" (không nguồn); đã bỏ. Review (Claude Sonnet 5.5, 10/11/2026): dung. Uncapher & Wagner 2018 (tóm tắt Europe PMC) định nghĩa đa nhiệm truyền thông là cùng lúc dùng nhiều luồng truyền thông. Ví dụ của trang là minh họa.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.3758/s13414-017-1408-4", "https://doi.org/10.1073/pnas.1611612115" ]
    luot_2_ghi_chu: Bài Ophir 2009 chưa mở; mô tả qua bản tái lập. Chi tiết 'bài chuyển đổi nhiệm vụ' và 'luyện tập mỗi ngày' không kiểm trực tiếp.
    review: dung
  - id: n5
    cau: 'Herbert Simon viết từ năm 1971 rằng trong thế giới thừa mứa thông tin, thứ khan hiếm không phải thông tin mà là chú ý: "sự giàu có về thông tin tạo ra sự nghèo nàn về chú ý".'
    loai: lich-su
    nguon:
      - wiki-simon
      - simon1971
    trich: Hence a wealth of information creates a poverty of attention and a need to allocate that attention efficiently among the overabundance of information sources that might consume it.
    vi_tri: Simon 1971, tr. 40–41 (toàn văn, gwern.net)
    ket_qua: dung
    ghi_chu: 'Nguồn bậc ba (trích Simon). Chỗ khó: lượt 2 nên đối chiếu bản gốc. Theo G1-L03 (22/10/2026): KHỚP (Simon 1971). Review (Claude Sonnet 5.5, 10/11/2026): dung. Đã mở bản gốc: Simon (1971), toàn văn, tr. 40–41: "Hence a wealth of information creates a poverty of attention and a need to allocate that attention efficiently among the overabundance of information sources that might consume it". Khớp; không còn chỉ dựa Wikipedia.'
    review: dung
    luot_2: dung
    luot_2_nguon: [ "https://atelierdesfuturs.org/wp-content/uploads/2025/07/1971-simon.pdf" ]
    luot_2_ghi_chu: Toàn văn bài Simon (in trong Greenberger, Johns Hopkins Press, 1971), tr. 40-41, cùng đoạn "information consumes the attention of its recipients"; ý "chú ý là thứ khan hiếm" đúng.
  - id: n6
    cau: Các nền tảng miễn phí bán sự chú ý của bạn cho nhà quảng cáo; mỗi thông báo, video tự chạy, gợi ý là một cái móc câu được tính toán để giữ bạn ở lại; bạn đang đấu với cả một ngành công nghiệp nghìn tỷ đô được tối ưu hóa để thắng mình.
    loai: phat-hien
    ket_qua: da-bo
    ghi_chu: 'Bỏ khỏi trang: không có nguồn đã mở (khẳng định về thiết kế nền tảng và quy mô ngành). Chữ cũ: toàn bộ ba câu cuối của đoạn "Điều gì đang xảy ra?" (trừ phần Simon). Review (Claude Sonnet 5.5, 10/11/2026): dung. Đã bỏ; kiểm trang: không còn câu về nền tảng bán chú ý, móc câu, ngành công nghiệp nghìn tỷ đô. Review lần 2 (Claude Sonnet 5.5, 10/11/2026): dung. Lượt 2 chấm đúng câu gốc là quá mạnh (quy mô ngành quảng cáo là cả ngành, "mỗi thông báo là cái móc được tính toán" không có nguồn đo); câu đã bỏ khỏi trang (ket_qua da-bo) từ review lần 1 nên không còn gì để sửa. Không thêm câu thay thế "cau_dung": bản đó cần số Magna/GroupM chưa mở toàn văn và trang không cần. Kiểm trang: chỉ còn Simon (1971), không còn quảng cáo, móc, nghìn tỷ.'
    review: dung
    luot_2: qua-manh
    luot_2_nguon: [ "https://doi.org/10.1016/j.chb.2019.07.016", "https://www.axios.com/2024/12/09/ad-revenue-growth-2024" ]
    luot_2_ghi_chu: 'câu đúng: Nhiều nền tảng miễn phí kiếm tiền từ quảng cáo dựa trên thời gian và sự chú ý của người dùng, và nhiều tính năng (thông báo, tự phát video, gợi ý) được thiết kế để giữ người dùng ở lại; ngành quảng cáo toàn cầu cỡ khoảng một nghìn tỷ đô la năm 2024.; Mô hình kinh doanh quảng cáo là có thật; quảng cáo toàn cầu khoảng 0,93-1,04 nghìn tỷ USD năm 2024 (Magna, GroupM) nhưng đó là cả ngành quảng cáo, không riêng ngành chú ý. "Mỗi thông báo/video/gợi ý là cái móc được tính toán" và "tối ưu hóa để thắng mình" là khái quát mạnh, không có nguồn đo; thông báo cũng có chức năng chính đáng.'
  - id: n7
    cau: 'Ophir và cộng sự (2009): nhóm nghiên cứu ở Stanford cho sinh viên làm bảng hỏi để tính chỉ số đa nhiệm truyền thông, rồi chọn hai nhóm ở hai đầu (đa nhiệm nặng và nhẹ).'
    loai: phat-hien
    nguon:
      - ophir2009
      - wiradhany2017
    trich: A trait media multitasking index was developed to identify groups of heavy and light media multitaskers.
    vi_tri: Tóm tắt Ophir 2009; Wiradhany 2017 ("one standard deviation below or above the group mean")
    ket_qua: dung
    ghi_chu: 'Theo G1-L03 (22/10/2026): khớp, nhưng "khoảng 100 sinh viên làm bảng hỏi" SAI (n8). Review (Claude Sonnet 5.5, 10/11/2026): dung. Ophir 2009 (tóm tắt) và Wiradhany 2017 (toàn văn): chỉ số đa nhiệm truyền thông, chọn nhóm cao/thấp một độ lệch chuẩn quanh trung bình. Khớp.'
    review: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1073/pnas.0903620106" ]
    luot_2_ghi_chu: Bảng hỏi 262 sinh viên Stanford; chọn nhóm cách trung bình từ 1 độ lệch chuẩn trở lên ở hai phía.
  - id: n8
    cau: 'Theo thông cáo của Stanford, khoảng 100 sinh viên làm ba bài kiểm tra khả năng kiểm soát nhận thức: lọc nhiễu từ môi trường, lọc nhiễu từ trí nhớ, và chuyển đổi giữa các nhiệm vụ.'
    loai: so-lieu
    nguon:
      - stanford2009
      - ophir2009
    trich: But after putting about 100 students through a series of three tests
    vi_tri: Thông cáo Stanford (ScienceDaily)
    ket_qua: da-sua
