    luot_2_ghi_chu: Thiết kế mô tả đúng; Ward 2017 gốc chưa mở nhưng thiết kế ba vị trí xác nhận qua bản tái lập. 'Đang tranh cãi' hợp lý.
    review: sai
  - id: n35
    cau: 'Gom thông báo không khẩn cấp vào vài khung giờ cố định, thay vì tắt hẳn hay để chúng "ting" liên tục (lời khuyên, bằng chứng sơ bộ; không gắn nhãn).'
    loai: loi-khuyen
    nguon:
      - stothart2015
      - fitz2019
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: lời khuyên "tắt thông báo, đặt 2–3 khung giờ" cần nghiên cứu về gom thông báo, chưa tìm. Chữ trang giữ nguyên; lượt 2 và review quyết định hạ nhãn hay bỏ. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ (Áp dụng 2): tiêu đề kèm chip Khá vững; "Mỗi thông báo là một lần chuyển đổi nhiệm vụ bắt buộc — và phí chuyển đổi thì chắc chắn tồn tại. Hãy tắt thông báo của mọi ứng dụng không khẩn cấp, đặt 2–3 khung giờ… Bạn không bỏ lỡ gì cả". Chữ mới: bỏ chip Khá vững; nêu Stothart 2015 và Fitz 2019 (237 người: gom ba đợt tốt hơn nhận như thường, tắt hẳn lại tăng lo âu và sợ bỏ lỡ); lời khuyên "gom vào vài khung giờ, thay vì tắt hẳn", thêm câu bằng chứng sơ bộ. Lý do: lượt 2 đúng (quá mạnh): chưa đủ cho nhãn Khá vững; bằng chứng chỉ có hai nghiên cứu, chủ yếu tự báo cáo; "tắt hẳn" trái với kết quả Fitz; "bạn không bỏ lỡ gì cả" không nguồn nên bỏ.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://scholars.duke.edu/publication/1402953" ]
    luot_2_ghi_chu: "câu đúng: Có bằng chứng sơ bộ: một thử nghiệm ngẫu nhiên hai tuần (n = 237) cho thấy gom thông báo ba lần mỗi ngày giúp thấy tập trung và chủ động hơn; chưa đủ cho nhãn Khá vững (gom theo giờ ít lợi, tắt hẳn lại tăng lo âu).; Chỉ đọc qua trang Duke Scholars và tóm tắt thứ cấp; chưa mở bài gốc. Nhãn Đang tranh cãi/sơ bộ hợp hơn."
    review: sai
    trich: delivering notifications in predictable intervals throughout the day (Fitz 2019); cellular phone notifications alone significantly disrupted performance on an attention-demanding task, even when participants did not directly interact with a mobile device (Stothart 2015)
    vi_tri: Fitz 2019, tóm tắt (qua Duke Scholars); Stothart 2015, tóm tắt (Europe PMC)
  - id: n36
    cau: Chỉ riêng việc nhận một thông báo cũng có thể làm giảm hiệu suất ở bài đòi hỏi chú ý, kể cả khi người ta không chạm vào điện thoại (Stothart và cộng sự, 2015); trong một thí nghiệm ngẫu nhiên ngoài đời (Fitz và cộng sự, 2019; 237 người), nhóm nhận thông báo gom thành ba đợt mỗi ngày cảm thấy tập trung, năng suất và kiểm soát điện thoại tốt hơn nhóm nhận như thường lệ; nhóm không nhận thông báo nào lo âu và sợ bỏ lỡ nhiều hơn.
    loai: phat-hien
    nguon:
      - stothart2015
      - fitz2019
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: lời khuyên không nguồn riêng ("không bỏ lỡ gì cả" cũng là khẳng định chung). Xem n35. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: "Mỗi thông báo là một lần chuyển đổi nhiệm vụ bắt buộc; hãy tắt thông báo… bạn không bỏ lỡ gì cả." Chữ mới: nêu kết quả Stothart 2015 và Fitz 2019 như phát hiện. Lý do: câu cũ không nguồn riêng ("bắt buộc", "không bỏ lỡ gì cả"). Fitz: 237 người, ba đợt/ngày so với như thường và không thông báo (nhóm gom thấy tập trung, năng suất, tâm trạng, kiểm soát điện thoại hơn; nhóm không thông báo lo âu và sợ bỏ lỡ hơn). Stothart: thông báo đủ làm giảm hiệu suất bài đòi hỏi chú ý dù không chạm điện thoại.'
    review: sai
    trich: cellular phone notifications alone significantly disrupted performance on an attention-demanding task, even when participants did not directly interact with a mobile device during the task
    vi_tri: Stothart 2015, tóm tắt; Fitz 2019, tóm tắt (Duke Scholars)
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/xhp0000100", "https://doi.org/10.1016/j.chb.2019.07.016" ]
    luot_2_ghi_chu: n = 237, thí nghiệm ngẫu nhiên ngoài đời. Tóm tắt Fitz có một câu lạ ("lower productivity") nhưng so với đối chứng nhóm gom thông báo báo cáo năng suất và tập trung hơn như trang nói.
  - id: n37
    cau: 'Thử tự quan sát mức đa nhiệm của chính mình: ghi chép mỗi lần "nhảy" sang điện thoại trong một giờ học; đây là cách tự quan sát thói quen, chưa có nghiên cứu cho thấy việc ghi chép cải thiện sự tập trung (lời khuyên, không gắn nhãn).'
    loai: loi-khuyen
    nguon:
      - sanbonmatsu2013
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: nhãn Khá vững cho việc tự ghi chép là lời khuyên suy từ Sanbonmatsu; lượt 2 quyết định. Chữ cũ có thêm "Hầu hết mọi người đều sốc khi thấy con số thật… Đo được mới quản được." (không nguồn): đã thay bằng "Đây là cách tự quan sát, không phải cách đo có kiểm soát." Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: tiêu đề "3. Tự đo mức đa nhiệm của mình trong một tuần" kèm chip Khá vững. Chữ mới: tiêu đề "3. Thử quan sát mức đa nhiệm của chính mình" (giữ id cũ), bỏ chip; câu nêu Sanbonmatsu 2013 (tự đánh giá quá cao), nói rõ đây là tự quan sát và chưa có nghiên cứu cho thấy việc ghi chép cải thiện tập trung. Lý do: lượt 2 đúng (quá mạnh): không có nghiên cứu kiểm chứng lời khuyên tự theo dõi nên không đủ nhãn Khá vững; chữ "trong một tuần" của tiêu đề cũ không khớp thí nghiệm một giờ học trong thân.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://doi.org/10.1073/pnas.1611612115" ]
    luot_2_ghi_chu: "câu đúng: Tự theo dõi mức đa nhiệm của mình là gợi ý hợp lý, nhưng không có bằng chứng trực tiếp (ngoài việc người đa nhiệm nặng hay đánh giá quá cao khả năng của mình, Sanbonmatsu 2013) rằng việc này cải thiện tập trung; không nên gắn nhãn Khá vững.; Không tìm được nghiên cứu kiểm chứng lời khuyên tự theo dõi trong một tuần."
