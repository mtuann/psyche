    trich: there was no difference between smartphone location conditions on performance
    vi_tri: Tóm tắt Ruiz Pardo & Minda 2022
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Dự đoán theo nghiên cứu gốc: buổi 3 sẽ nhanh và chính xác nhất, buổi 1 tệ nhất — dù bạn không hề chạm vào điện thoại" (chưa kiểm được thiết kế gốc). "các lần làm lại phần lớn không thấy" là chữ cũ của trang; nguồn: một lần làm lại và một tổng hợp, không phải "phần lớn các lần làm lại": chỗ khó. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ (cau): "…nhất là khi các lần làm lại phần lớn không thấy hiệu ứng". Chữ trang: "nhất là khi lần làm lại có đăng ký trước và phân tích tổng hợp không thấy hiệu ứng này". Lý do: cau lệch trang; nguồn là một lần làm lại và một tổng hợp (Böttger 2023 thì thấy khác, xem n34). Chữ trang không đổi, chỉ sửa cau cho khớp.'
