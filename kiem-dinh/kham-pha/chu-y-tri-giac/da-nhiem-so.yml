    luot_2_ghi_chu: Nhãn 'Đang tranh cãi' đúng.
    review: dung
  - id: n34
    cau: 'Đang tranh cãi: điện thoại để đâu khi cần tập trung (sự hiện diện của điện thoại có làm giảm tập trung không): Ward 2017 báo cáo hiệu ứng; lần làm lại đăng ký trước (Ruiz Pardo & Minda 2022) không thấy; phân tích tổng hợp 33 nghiên cứu (Hartanto 2024) không thấy; phân tích tổng hợp 22 nghiên cứu gộp việc dùng và sự hiện diện (Böttger 2023) thấy tác động tiêu cực chung.'
    loai: nhan
    nhan: tranh-cai
    co_so:
      - ward2017
      - ruiz2022
      - hartanto2024
      - boettger2023
    ly_do: 'Ward 2017 báo cáo hiệu ứng; lần làm lại có đăng ký trước (Ruiz Pardo & Minda 2022) không thấy; phân tích tổng hợp 33 nghiên cứu (Hartanto 2024) d = −0,02 không thấy; phân tích tổng hợp 22 nghiên cứu (Böttger 2023) gộp việc dùng và sự hiện diện thấy tác động tiêu cực chung, kết quả không đồng nhất giữa lĩnh vực nhận thức và quốc gia. Bằng chứng chất lượng cao mâu thuẫn nhau theo thước đo.'
    nguon:
      - ward2017
      - ruiz2022
      - hartanto2024
      - boettger2023
    ket_qua: da-sua
    ghi_chu: 'Nhãn cũ: Khá vững (mục áp dụng 1); G1 #4 đề xuất Đang tranh cãi. Chữ cũ: "Bài học rẻ nhất từ Ward: không cần tắt nguồn hay cai nghiện — chỉ cần để điện thoại ở phòng khác… Để điện thoại ra xa vẫn là cách rẻ để bớt bị gián đoạn." Chữ mới: Ward gợi ý, nhưng làm lại và tổng hợp không thấy; "chúng tôi chưa thể khuyên làm theo". Chỗ khó: Parry (2023) thấy tác động nhỏ lên trí nhớ làm việc (theo G1), chưa mở; có thể đáng nêu. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ (Áp dụng 1): "…phân tích tổng hợp 33 nghiên cứu (Hartanto và cộng sự, 2024) kết luận hầu như không có lý do để cho rằng cách ly hoàn toàn khỏi điện thoại cải thiện hiệu suất." Chữ mới: thêm "còn một phân tích tổng hợp khác, gộp cả việc dùng lẫn sự hiện diện của điện thoại (Böttger và cộng sự, 2023), lại thấy tác động tiêu cực chung." Lý do: Böttger 2023 (22 nghiên cứu, Behav Sci) báo "significant overall negative effect of smartphone use and presence", trái chiều với Hartanto (d = −0,02); câu cũ chỉ nêu một phía. Nhãn Đang tranh cãi vững hơn (hai phân tích tổng hợp trái chiều cộng một làm lại đăng ký trước không thấy hiệu ứng).'
