    ket_qua: da-sua
    ghi_chu: 'Đối chiếu tên bài, tạp chí, tập, trang với OpenAlex và bản PDF (Wiradhany, Watson). Hartanto: trang ghi "Technology, Mind, and Behavior, 5(1), 1–14": chưa kiểm số trang. Chữ cũ: ghi chú nguồn Ophir "~100 sinh viên Stanford làm bài kiểm tra, chỉ số đa nhiệm truyền thông…" (G1 #3 đã sửa). Quy ước "Hartanto, A., và cộng sự" là cách viết của trang, không phải APA đầy đủ. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: mục Nguồn có 11 mục, không có các nguồn mới. Chữ mới: thêm Böttger (2023), Fitz (2019), Stothart (2015). Siêu dữ liệu đối chiếu Crossref: Hartanto (Technology, Mind, and Behavior 5(1) 1–14 khớp); Parry & le Roux (Cyberpsychology 15(2), art. 7); Ruiz Pardo & Minda (Acta Psychol 230, 103717); Ward (JACR 2(2) 140–154); Uncapher (PNAS 115(40) 9889–9896); Ophir (PNAS 106(37) 15583–15587); Wiradhany (APP 79(8) 2620–2641); Kiesel (Psychol Bull 136(5) 849–874); Sanbonmatsu (PLoS ONE 8(1) e54402); Watson & Strayer (PBR 17(4) 479–485); Böttger (Behav Sci 13(9) 751); Fitz (CHB 101, 84–94); Stothart (JEP:HPP 41(4) 893–897). Simon (1971) đã đọc toàn văn, tr. 37–52 theo trang là chương trong sách (bản PDF có số trang 37–72 của cả hội thảo).'
    review: sai
    luot_2: dung
    luot_2_nguon: [ "https://api.crossref.org/works/10.1037/xhp0000100", "https://web.archive.org/web/2009/http://news.stanford.edu/news/2009/august24/multitask-research-study-082409.html", "https://atelierdesfuturs.org/wp-content/uploads/2025/07/1971-simon.pdf" ]
    luot_2_ghi_chu: 'Đối chiếu Crossref cho Böttger, Fitz, Hartanto (5(1) 1-14), Kiesel, Ophir, Parry (15(2) art. 7), Ruiz Pardo (230, 103717), Sanbonmatsu, Stothart, Uncapher, Ward, Watson, Wiradhany: đều khớp. Simon 1971: tr. 37-52 là cách trích dẫn phổ biến của riêng bài Simon (bản PDF dài 36 trang vì có phần thảo luận, nên có nguồn ghi 37-72). Ophir "~100 sinh viên" khớp thông cáo và tổng 103 người trong ba phần thí nghiệm.'
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: 'Mô tả (description): "…người đa nhiệm truyền thông nặng chuyển đổi nhiệm vụ kém hơn…"'
    moi: '"…thấy người đa nhiệm truyền thông nặng làm kém hơn ở các bài kiểm tra kiểm soát nhận thức, nhưng nhiều kết quả sau chưa lặp lại…"'
    ly_do: Hồ sơ n1.
  - cu: Đoạn "Vì sao các ứng dụng làm vậy?… Mỗi thông báo… móc câu… ngành công nghiệp nghìn tỷ đô…"; "đa nhiệm truyền thông gắn liền với các thiết bị được thiết kế để giành giật chú ý"
    moi: Chỉ giữ khái niệm nền kinh tế chú ý và câu của Simon (1971)
    ly_do: Hồ sơ n4–n6.
  - cu: 'Ophir: "kiểm soát nhận thức dàn trải (breadth-biased cognitive control)… có lợi khi cần bắt sóng rộng…"'
    moi: '"kết quả chuyển đổi kém nhiều khả năng do người đa nhiệm nặng khó gạt bỏ nhiễu từ bộ quy tắc của nhiệm vụ kia (theo tóm tắt bài gốc)."'
    ly_do: Hồ sơ n11, n30.
  - cu: 'Uncapher và Wagner: "tiếp nối công trình của người đồng nghiệp quá cố Clifford Nass… chú ý, trí nhớ làm việc, trí nhớ dài hạn, trí thông minh lỏng"; "tương quan âm nhưng nhỏ, rõ nhất ở các bài kiểm tra trí nhớ và chú ý… hai cảnh báo của Wagner… bài tích hợp đa giác quan"'
    moi: '"tổng quan các nghiên cứu… đến năm 2018"; "Theo tóm tắt… thường ở các bài đòi hỏi duy trì chú ý hướng đích… nhiều nghiên cứu không thấy khác biệt… (118 phép đo, Parry và le Roux 2021)"'
    ly_do: Hồ sơ n12–n15.
  - cu: 'Ward: "nhóm để điện thoại trên bàn làm bài kém nhất, nhóm để ở phòng khác làm tốt nhất… một phần tâm trí luôn bận rộn kìm nén ham muốn kiểm tra nó"; "Điện thoại đều úp mặt, tắt tiếng."'
    moi: '"Theo các tác giả, chỉ riêng sự hiện diện của điện thoại đã làm giảm năng lực nhận thức có sẵn… giả thuyết brain drain…"; ba vị trí theo mô tả của lần làm lại 2022'
    ly_do: Hồ sơ n16–n18.
  - cu: 'Khung Vững chắc: "chuyển đổi nhiệm vụ luôn tốn phí… được tái hiện suốt hàng chục năm… Điểm này không còn tranh cãi."'
    moi: '"chuyển đổi nhiệm vụ thường tốn phí… được tổng quan trong nhiều bài (Kiesel và cộng sự, 2010)…"'
    ly_do: Hồ sơ n21.
  - cu: 'Khung Khá vững: "…nhiều nghiên cứu không tìm thấy khác biệt…"'
    moi: '"…được tổng quan bởi Uncapher và Wagner (2018) và Parry và le Roux (2021)…"'
    ly_do: Hồ sơ n22.
  - cu: 'Khung Đang tranh cãi: "chính Wagner cũng nhấn mạnh còn quá sớm…"'
    moi: '"Uncapher và Wagner (2018) nêu cần thêm nghiên cứu để xác định chiều nhân quả."'
    ly_do: Hồ sơ n24.
  - cu: 'Khung bác bỏ: "Không có bằng chứng ủng hộ hai ý này."'
    moi: '"Chúng tôi không tìm thấy bằng chứng ủng hộ hai ý này."'
    ly_do: Hồ sơ n27.
  - cu: 'Lý thuyết: "mất vài trăm mili-giây… Cộng dồn hàng chục lần nhảy…"; "Kiểm soát nhận thức dàn trải… săn bắt–hái lượm"; "Vòng xoáy chú ý trong nền kinh tế chú ý"'
    moi: '"…chuẩn bị và chuyển bộ quy tắc… (Kiesel và cộng sự, 2010)"; "Dễ bị nhiễu…"; bỏ mục vòng xoáy'
    ly_do: Hồ sơ n29–n31.
  - cu: 'Áp dụng 1: "Bài học rẻ nhất… để điện thoại ở phòng khác… Để điện thoại ra xa vẫn là cách rẻ…"'
    moi: '"Ward và cộng sự (2017) gợi ý… Nhưng lần làm lại… và phân tích tổng hợp 33 nghiên cứu… chưa thể khuyên làm theo."'
    ly_do: Hồ sơ n34.
  - cu: 'Áp dụng 3: "Hầu hết mọi người đều sốc khi thấy con số thật… Đo được mới quản được."'
    moi: '"Đây là cách tự quan sát, không phải cách đo có kiểm soát."'
    ly_do: Hồ sơ n37.
  - cu: 'Áp dụng 4: "ảo giác năng suất… luôn thắng… hệ quả trực tiếp của switch cost"'
    moi: '"Với đa số người, làm hai việc đòi hỏi chú ý cùng lúc thì kém hơn… thường phù hợp hơn…"'
    ly_do: Hồ sơ n38.
  - cu: 'Tự thử: "Dự đoán theo nghiên cứu gốc: buổi 3 sẽ nhanh và chính xác nhất…"'
    moi: '"Nếu hiệu ứng trong nghiên cứu gốc có thật, buổi 3 sẽ tốt nhất và buổi 1 kém nhất."'
    ly_do: Hồ sơ n39.
  - cu: 'Mục Việt Nam: "Chúng tôi chưa tìm thấy nghiên cứu thực nghiệm nào về đa nhiệm truyền thông trên người Việt. Mọi con số…"; hai đoạn "Nhưng hiện trường Việt Nam thì ai cũng thấy…" và ca dao'
    moi: '"Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu thực nghiệm nào đo tác động nhận thức… Có một khảo sát hành vi… Các con số… chủ yếu từ…"; bỏ hai đoạn sau'
    ly_do: Hồ sơ n40–n42.
  - cu: 'Ngộ nhận: "(phần lớn là người trẻ, dùng nhiều thiết bị nhất)"; bullet "Vừa nghe nhạc vừa học giúp tập trung hơn"; "các nghiên cứu làm lại về sau phần lớn không thấy… Dù vậy, điện thoại trong tầm mắt vẫn là nguồn gián đoạn…"'
    moi: '"(sinh viên Stanford)"; bỏ bullet nhạc; "lần làm lại có đăng ký trước và tổng hợp không thấy điều này"'
    ly_do: Hồ sơ n43–n45.
  - cu: 'Quiz 3, 4: đáp án "…úp mặt, tắt tiếng, không ai chạm vào… kìm nén…"; "các nền tảng miễn phí… bán sự chú ý"; lời giải thích "…ngành công nghiệp được tối ưu hóa để thắng bạn"'
    moi: Đáp án "Các tác giả báo cáo… giải thích là điện thoại chiếm một phần nguồn lực nhận thức có hạn"; "…khan hiếm không phải thông tin mà là sự chú ý…"; giải thích theo Simon
    ly_do: Hồ sơ n49, n50.
  - cu: 'Đọc thêm: "…mỗi lần chuyển đổi nhiệm vụ là một lần đánh thức Hệ 2 tốn kém."'
    moi: '"…tư duy nhanh và tư duy chậm."'
    ly_do: Hồ sơ n51.
  - cu: "Thu gọn: \"cái ta gọi là 'đa nhiệm' thực chất là chuyển đổi nhiệm vụ\"; Ophir Kết quả: \"Nguyên nhân: họ dễ bị nhiễu…\"; quiz 1: \"…vì họ khó gạt bỏ thông tin gây nhiễu hơn.\""
    moi: '"…thường thực chất là…"; "Cụ thể, họ dễ bị nhiễu…"; "…nhiều khả năng vì họ khó gạt bỏ…"'
    ly_do: Review n2, n9, n47.
  - cu: 'Khung Khá vững (đa nhiệm và nhận thức): "hiệu ứng nhỏ, nhiều nghiên cứu không tìm thấy khác biệt…"'
    moi: Thêm số của Parry và le Roux (khoảng 0,14 nói chung, 0,09 ở bài kiểm tra hiệu suất)
    ly_do: Review n22.
  - cu: 'Khung Đang tranh cãi: "Khả năng lớn nhất là vòng xoáy hai chiều — và Uncapher…"; quiz 2: "rất có thể cả hai chiều cùng đúng", "giả thuyết hợp lý nhất hiện nay"'
    moi: '"Cũng có thể cả hai chiều cùng đúng… nhưng chưa có bằng chứng quyết định"; "có thể cả hai chiều cùng đúng"; "một giả thuyết hợp lý"'
    ly_do: Review n26.
  - cu: 'Khung Đã bị bác bỏ: "đa nhiệm nhiều giúp ta giỏi đa nhiệm, và não làm được hai việc khó cùng lúc" (kèm ngoại lệ "đi bộ")'
    moi: 'Khung Khá vững: "đa nhiệm truyền thông nhiều không đi kèm khả năng đa nhiệm hay kiểm soát nhận thức tốt hơn" (bỏ ví dụ đi bộ)'
    ly_do: Review n27, n28.
  - cu: 'Áp dụng 1: "…Hartanto… kết luận hầu như không có lý do… Vì vậy"'
    moi: Thêm "còn một phân tích tổng hợp khác, gộp cả việc dùng lẫn sự hiện diện của điện thoại (Böttger và cộng sự, 2023), lại thấy tác động tiêu cực chung."
    ly_do: Review n34.
  - cu: 'Áp dụng 2: tiêu đề kèm chip Khá vững; "Mỗi thông báo là một lần chuyển đổi nhiệm vụ bắt buộc… Hãy tắt thông báo của mọi ứng dụng không khẩn cấp… Bạn không bỏ lỡ gì cả…"'
    moi: Tiêu đề không chip (giữ id cũ); đoạn nêu Stothart 2015 và Fitz 2019, lời khuyên "gom vào vài khung giờ, thay vì tắt hẳn", "bằng chứng từ ít nghiên cứu"
    ly_do: Review n35, n36.
  - cu: 'Áp dụng 3: "3. Tự đo mức đa nhiệm của mình trong một tuần" kèm chip Khá vững'
    moi: '"3. Thử quan sát mức đa nhiệm của chính mình" (giữ id cũ), không chip; nêu Sanbonmatsu 2013 và nói chưa có nghiên cứu về hiệu quả của việc ghi chép'
    ly_do: Review n37.
  - cu: 'Ở Việt Nam: "Các con số trong bài chủ yếu từ sinh viên Mỹ và châu Âu."'
    moi: '"Các nghiên cứu kể trong bài chủ yếu làm với sinh viên ở Mỹ, Canada và châu Âu; lần làm lại của Wiradhany và Nieuwenstein (2017) có thêm một mẫu sinh viên Indonesia."'
    ly_do: Review n41.
  - cu: "Nguồn: 11 mục; Ngộ nhận 2 có khoảng trắng cuối dòng"
    moi: Thêm Böttger 2023, Fitz 2019, Stothart 2015; bỏ khoảng trắng cuối dòng
    ly_do: Review n52, n45.
