    ghi_chu: 'Bỏ khỏi trang: mô hình không có nguồn đã mở. Review (Claude Sonnet 5.5, 10/11/2026): dung. Đã bỏ; kiểm trang: không còn "vòng xoáy chú ý" về thiết kế nền tảng. Review lần 2 (Claude Sonnet 5.5, 10/11/2026): dung. Chiều nhân quả "kiểm tra liên tục thành suy yếu chú ý" chưa xác định (Uncapher & Wagner 2018); câu gốc đã bỏ (da-bo). Phần còn lại trên trang (n26, n28) đã viết hai chiều, "chưa có bằng chứng quyết định", khớp cau_dung của lượt 2. Kiểm trang: không còn "vòng xoáy chú ý" kiểu nền tảng thiết kế, "ý chí thua".'
