    ghi_chu: 'Chữ cũ: "Hai ngộ nhận bị dữ liệu bác bỏ thẳng thừng. Thứ nhất, Ophir… cho thấy nhóm đa nhiệm nặng chuyển đổi nhiệm vụ kém hơn" và "luôn là chuyển đổi nối tiếp… Ngoại lệ duy nhất" (G1 #1, #5). Chữ mới: "không có bằng chứng ủng hộ", Ophir chưa lặp lại, ngoại lệ 2,5%. Chỗ khó: bác bỏ ý "giỏi đa nhiệm" dựa chủ yếu vào Sanbonmatsu, một nghiên cứu; lượt 2 cân nhắc. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: khung "Đã bị bác bỏ: đa nhiệm nhiều giúp ta giỏi đa nhiệm, và não làm được hai việc khó cùng lúc". Chữ mới: khung "Khá vững: đa nhiệm truyền thông nhiều không đi kèm khả năng đa nhiệm hay kiểm soát nhận thức tốt hơn". Lý do: lượt 2 đúng (quá mạnh): vế "não làm được hai việc khó cùng lúc" có ngoại lệ (2,5% supertaskers, Watson & Strayer 2010) và vế "đa nhiệm giúp giỏi đa nhiệm" chỉ có dữ liệu tương quan (Sanbonmatsu 2013: tương quan âm với OSPAN; Parry & le Roux 2021: liên hệ nhỏ theo chiều xấu; Ophir chưa lặp lại), không phải kiểm tra thất bại liên tục; luyện tập chưa được thử trong các nghiên cứu này. Nhãn Khá vững.'
