    ghi_chu: 'Chữ cũ: "thường tự đánh giá khả năng đa nhiệm của mình cao — trong khi thực tế họ làm kém hơn" (so sánh không rõ đối tượng). Chữ mới nói rõ: cao hơn thực tế. Review (Claude Sonnet 5.5, 10/11/2026): dung. Sanbonmatsu 2013 (toàn văn): hoạt động đa nhiệm tương quan dương với khả năng đa nhiệm tự đánh giá (quá cao), tương quan âm với OSPAN. Khớp.'
    luot_2: dung
