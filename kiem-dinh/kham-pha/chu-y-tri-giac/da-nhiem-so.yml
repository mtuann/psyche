  - id: n40
    cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu thực nghiệm nào đo tác động nhận thức của đa nhiệm truyền thông trên người Việt; có một khảo sát hành vi đa nhiệm trong lớp học ở 257 sinh viên một trường đại học ở Hà Nội (2026), nhưng đó không phải bài kiểm tra nhận thức.
    loai: thoi-su
    nguon:
      - tim-kiem-vn
      - hanoi2026
    trich: This study uses the Media Multitasking-Revised (MMT-R) scale to assess the level of multitasking behaviour in the classroom among 257 students from various academic disciplines.
    vi_tri: Tóm tắt (OpenAlex)
    het_han: '2028-11-01'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chúng tôi chưa tìm thấy nghiên cứu thực nghiệm nào về đa nhiệm truyền thông trên người Việt. Mọi con số trong bài đều từ sinh viên Mỹ và châu Âu." Chữ mới thêm mốc, giới hạn câu ("đo tác động nhận thức") và nêu khảo sát Hà Nội; "chủ yếu từ sinh viên Mỹ và châu Âu" mềm hơn "mọi con số" (Sanbonmatsu ở Utah, Wiradhany ở Hà Lan, Hartanto ở Singapore có thể). Review (Claude Sonnet 5.5, 10/11/2026): dung. Thời sự có mốc "11/2026", `het_han` có trong hồ sơ. Tự tìm lại Europe PMC ngày 10/11/2026: (media multitasking OR smartphone presence OR brain drain OR multitasking) AND (Vietnam OR Vietnamese) AND (cognitive OR attention): không có nghiên cứu nhận thức về đa nhiệm truyền thông ở người Việt. Khảo sát Hà Nội: Crossref xác nhận (Engineering and Technology for Sustainable Development 36(3), 115–125, 2026), tóm tắt lượt 1: thang MMT-R, 257 sinh viên, hành vi trong lớp học.'
    review: dung
    luot_2: dung
    luot_2_nguon: [ "https://jst.vn/index.php/etsd/article/view/1057", "https://doi.org/10.51316/jst.191.etsd.2026.36.3.15" ]
    luot_2_ghi_chu: 'Khảo sát hành vi bằng thang MMT-R, không có bài kiểm tra nhận thức. Phần phủ định ("chưa tìm thấy") hợp lý: tìm tiếng Anh/Việt qua Semantic Scholar/tìm web không thấy nghiên cứu thực nghiệm trên người Việt; mang tính chưa tìm thấy, đúng cách diễn đạt của trang.'
