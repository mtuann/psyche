  - cu: 'Ngộ nhận: "Chú ý là tài nguyên có hạn; đa nhiệm chỉ là chuyển đổi nhanh…"; "…đã chứng minh điều ngược lại…"; "suy giảm tương đương lái xe khi say, và điện thoại rảnh tay cũng nguy hiểm như cầm tay"'
