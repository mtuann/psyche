nhan_dinh:
  - id: n1
    cau: Mù không chú ý được nêu trong Simons và Chabris (1999) và mù thay đổi trong Simons và Levin (1998).
    loai: lich-su
    nguon:
      - simons1999
      - simons1998
    trich: Daniel J Simons, Christopher F Chabris, Perception, 1999, volume 28, pages 1059–1074
    vi_tri: Simons 1999, trang đầu; Simons & Levin 1998
    ket_qua: dung
    ghi_chu: Mô tả (description). "Mù không chú ý" là thuật ngữ có từ trước (Mack và Rock 1998); trang chỉ gắn hai nghiên cứu với hai hiện tượng.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
    luot_2_ghi_chu: "Đọc toàn văn PDF (Perception 1999). Chú ý: 46% là tỉ lệ không thấy ở mọi điều kiện (khỉ đột lẫn người cầm ô), không riêng khỉ đột."
  - id: n2
    cau: 'Video bóng rổ: hai đội chuyền bóng nhanh, một đội áo trắng, một đội áo đen; nhiệm vụ đếm số lần chuyền của đội áo trắng.'
    loai: phat-hien
    nguon:
      - simons1999
    trich: Each tape showed two teams of three players, one team wearing white shirts and the other wearing black shirts
    vi_tri: Simons 1999, 2 Method
    ket_qua: dung
    ghi_chu: Mô tả tình huống của trang là bản tóm lược của video gốc; "rất nhanh" là mô tả của trang, không đếm.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
    luot_2_ghi_chu: "Đọc toàn văn PDF (Perception 1999). Chú ý: 46% là tỉ lệ không thấy ở mọi điều kiện (khỉ đột lẫn người cầm ô), không riêng khỉ đột."
  - id: n3
    cau: Trong video, người mặc đồ khỉ đột đi giữa sân, dừng lại, đấm ngực rồi đi ra.
    loai: phat-hien
    nguon:
      - simons1999
    trich: the Gorilla walked from right to left into the live basketball-passing event, stopped in the middle of the players as the action continued all around it, turned to face the camera, thumped its chest, and then resumed walking across the screen
    vi_tri: Simons 1999, mục Discussion (điều kiện bổ sung)
    ket_qua: dung
    ghi_chu: Cảnh đấm ngực thuộc điều kiện bổ sung (video 62 s); video điều kiện chính chỉ cho khỉ đột đi ngang (5 s).
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
    luot_2_ghi_chu: "Đọc toàn văn PDF (Perception 1999). Chú ý: 46% là tỉ lệ không thấy ở mọi điều kiện (khỉ đột lẫn người cầm ô), không riêng khỉ đột."
  - id: n4
    cau: Khỉ đột ở trên màn hình nhiều giây liền, ngay giữa khung hình.
    loai: phat-hien
    nguon:
      - simons1999
    trich: this action began after 35 s and lasted 9 s in a stimulus tape 62 s long
    vi_tri: Simons 1999, Discussion
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nó ở trên màn hình suốt 9 giây" (trong thu-gon và quiz 1). 9 giây là của điều kiện bổ sung; điều kiện chính 5 giây (trang nhà ghi 5 giây). Chữ mới "nhiều giây liền". Review (Claude Sonnet 5.5, 10/11/2026): dung. Simons & Chabris 1999 (toàn văn): khỉ đột đi vào giữa trận, "stopped in the middle of the players…", 9 giây trong video bổ sung 62 giây (điều kiện chính ngắn hơn). Chữ trang "nhiều giây liền" đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
    luot_2_ghi_chu: "Đọc toàn văn PDF (Perception 1999). Chú ý: 46% là tỉ lệ không thấy ở mọi điều kiện (khỉ đột lẫn người cầm ô), không riêng khỉ đột."
    review: dung
  - id: n5
    cau: Hầu hết mọi người đều tin chắc "làm sao mà không thấy được một con khỉ đột".
    loai: phat-hien
    nguon:
      - simons2011
    trich: 'Unexpected Events: 77.5% agreed that "people generally notice when something unexpected enters their field of view, even when they''re paying attention to something else."'
    vi_tri: Simons & Chabris 2011, Results
    ket_qua: da-lam-mem
    ghi_chu: "Khảo sát hỏi niềm tin chung về vật bất ngờ, không hỏi riêng khỉ đột; \"hầu hết\" khớp 77,5%. Review (Claude Sonnet 5.5, 10/11/2026): dung. Simons & Chabris 2011 (toàn văn, Results): 77,5% đồng ý \"people generally notice when something unexpected enters their field of view, even when they're paying attention to something else\". Câu của trang là tóm tắt phổ thông (\"hầu hết… tin\"); khảo sát hỏi vật bất ngờ nói chung, không riêng khỉ đột."
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059", "https://doi.org/10.1371/journal.pone.0022757", "https://doi.org/10.3758/BF03208840" ]
    luot_2_ghi_chu: "Nhận định tổng quát/lời khuyên/giải thích phù hợp các nguồn trên. n22 'Vững chắc': nhiều lần lặp độc lập nhưng tôi không tìm được phân tích tổng hợp chính thức; người review cân nhắc. n38, n39 là lời khuyên suy ra, không có thử nghiệm trực tiếp."
    review: dung
  - id: n6
    cau: Khoảng một nửa số người xem không thấy con khỉ đột (46% trong thí nghiệm chính; 50% ở bản đấm ngực), dù con khỉ đột đi ngay giữa màn hình suốt nhiều giây.
    loai: so-lieu
    nguon:
      - simons1999
    trich: Out of all 192 observers across all conditions, 54% noticed the unexpected event and 46% failed to notice the unexpected event
    vi_tri: Simons 1999, Results; Discussion (50% ở điều kiện bổ sung)
    ket_qua: dung
    ghi_chu: 'Trang nhà ghi 46% trong 192 người (khỉ đột hoặc người cầm ô). Ở bản đấm ngực: "only 50% noticed the event". Trang này nói "khoảng một nửa", nhất quán với trang nhà.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
    luot_2_ghi_chu: "Đọc toàn văn PDF (Perception 1999). Chú ý: 46% là tỉ lệ không thấy ở mọi điều kiện (khỉ đột lẫn người cầm ô), không riêng khỉ đột."
  - id: n7
    cau: Khi được hỏi trước, đa số người tin chắc rằng mình sẽ thấy (xem khảo sát ở mục Mức độ chắc chắn).
    loai: phat-hien
    nguon:
      - simons2011
    trich: unexpected objects generally grab attention (78%)
    vi_tri: Tóm tắt Simons & Chabris 2011
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "trước khi xem, hầu hết họ cũng tin chắc như bạn rằng mình sẽ thấy" (người xem năm 1999 không được hỏi trước; theo G1-L03 #2). Chữ mới trỏ tới khảo sát 2009. Review (Claude Sonnet 5.5, 10/11/2026): dung. Như n5: 77,5% (làm tháng 6/2009, 1.500 người sau gia quyền). Chữ trang trỏ tới khảo sát, không nói người xem 1999 được hỏi trước.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1371/journal.pone.0022757" ]
    luot_2_ghi_chu: Con số 78% khớp. Không xác minh được ngày thực hiện (6/2009) từ tóm tắt.
    review: dung
  - id: n8
    cau: 'Sự chú ý giống đèn pin hơn camera an ninh: một chùm sáng hẹp soi rõ một vùng nhỏ, những gì ngoài chùm sáng có thể đi qua mà ta không hay biết.'
    loai: dinh-nghia
    nguon:
      - simons1999
    trich: we perceive and remember only those objects and details that receive focused attention
    vi_tri: Tóm tắt Simons 1999
    ket_qua: da-lam-mem
    ghi_chu: 'Ẩn dụ của trang; nguồn nói ta chỉ nhận thức và nhớ những vật nhận được chú ý tập trung. Chữ giữ vì có "có thể". Review (Claude Sonnet 5.5, 10/11/2026): dung. Ẩn dụ đèn pin có "có thể"; Simons 1999: "we perceive and remember only those objects and details that receive focused attention".'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059", "https://doi.org/10.1371/journal.pone.0022757", "https://doi.org/10.3758/BF03208840" ]
    luot_2_ghi_chu: "Nhận định tổng quát/lời khuyên/giải thích phù hợp các nguồn trên. n22 'Vững chắc': nhiều lần lặp độc lập nhưng tôi không tìm được phân tích tổng hợp chính thức; người review cân nhắc. n38, n39 là lời khuyên suy ra, không có thử nghiệm trực tiếp."
    review: dung
  - id: n9
    cau: Mù không chú ý (inattentional blindness) là không thấy một vật hoàn toàn nhìn thấy được, chỉ vì chú ý đang bận ở chỗ khác.
    loai: dinh-nghia
    nguon:
      - simons1999
    trich: without attention, we may not even perceive objects (`inattentional blindness')
    vi_tri: Tóm tắt Simons 1999
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
    luot_2_ghi_chu: "Đọc toàn văn PDF (Perception 1999). Chú ý: 46% là tỉ lệ không thấy ở mọi điều kiện (khỉ đột lẫn người cầm ô), không riêng khỉ đột."
  - id: n10
    cau: 'Mù không chú ý khác với "không nhìn": vật lạ đi qua ngay vùng bạn đang nhìn, nhưng bạn không nhận ra nó vì chú ý đang dồn cho việc đếm bóng.'
    loai: phat-hien
    nguon:
      - simons1999
    trich: Objects can pass through the spatial extent of attentional focus (and the fovea) and still not be 'seen' if they are not specifically being attended.
    vi_tri: Simons 1999, Discussion (v)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "mắt bạn vẫn hướng về phía con khỉ đột, ánh sáng từ nó vẫn vào võng mạc — nhưng não không ''đăng ký'' nó, vì toàn bộ ''ngân sách'' chú ý đã dồn cho việc đếm bóng." Bài gốc không đo hướng nhìn của mắt (không có eye tracking); chữ mới chỉ nói vật đi qua vùng đang nhìn. Quiz 1 giải thích sửa tương ứng. Review (Claude Sonnet 5.5, 10/11/2026): dung. Simons 1999 (toàn văn), Discussion: vật có thể đi qua vùng chú ý và cả hố mắt mà vẫn không được "thấy"; chữ trang không nói về hướng nhìn.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
    luot_2_ghi_chu: "Đọc toàn văn PDF (Perception 1999). Chú ý: 46% là tỉ lệ không thấy ở mọi điều kiện (khỉ đột lẫn người cầm ô), không riêng khỉ đột."
    review: dung
  - id: n11
    cau: 'Simons và Chabris dựng lại một ý tưởng cũ của Ulric Neisser bằng video hiện đại: hai đội chuyền bóng rổ, người xem đếm số lần chuyền của một đội, giữa video có người mặc đồ khỉ đột đi ngang.'
    loai: lich-su
    nguon:
      - simons1999
    trich: The actions of the players, and this unexpected event, were designed to mimic the stimuli used by Neisser and colleagues.
    vi_tri: Simons 1999, 2.2 Materials
    ket_qua: da-lam-mem
    ghi_chu: 'Trang này nay chỉ tóm một câu và link về trang nhà thi-nghiem/khi-dot-vo-hinh (đã khóa). Chữ cũ có cả đoạn kể chi tiết; đã rút gọn, bỏ chi tiết về độ khó nhiệm vụ, tỉ lệ một phần ba và câu "Tôi bỏ lỡ cái đó á?!" (đã có ở trang nhà hay không cần). Review (Claude Sonnet 5.5, 10/11/2026): dung. Simons 1999 (toàn văn), 2.2 Materials: các hành động được dựng "to mimic the stimuli used by Neisser and colleagues". Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
    luot_2_ghi_chu: "Đọc toàn văn PDF (Perception 1999). Chú ý: 46% là tỉ lệ không thấy ở mọi điều kiện (khỉ đột lẫn người cầm ô), không riêng khỉ đột."
    review: dung
  - id: n12
    cau: Trong thí nghiệm nổi tiếng nhất về mù không chú ý, khoảng một nửa số người xem mải đếm đường chuyền bóng không thấy người mặc đồ khỉ đột đi ngang qua.
    loai: so-lieu
    nguon:
      - simons1999
    trich: 46% failed to notice the unexpected event
    vi_tri: Simons 1999, Results
    ket_qua: dung
    ghi_chu: Tóm một câu, không thêm số, khớp trang nhà (46%, "khoảng một nửa").
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059" ]
    luot_2_ghi_chu: "Đọc toàn văn PDF (Perception 1999). Chú ý: 46% là tỉ lệ không thấy ở mọi điều kiện (khỉ đột lẫn người cầm ô), không riêng khỉ đột."
  - id: n13
    cau: Thiết kế và kết quả đầy đủ của thí nghiệm con khỉ đột ở trang "Con khỉ đột đi giữa sân mà không ai thấy".
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: thi-nghiem/khi-dot-vo-hinh có trong src/data/trang.yml, tiêu đề "Con khỉ đột đi giữa sân mà không ai thấy (Mù không chú ý)"; link /psyche/thi-nghiem/khi-dot-vo-hinh/. Review (Claude Sonnet 5.5, 10/11/2026): dung. thi-nghiem/khi-dot-vo-hinh có trong src/data/trang.yml và đã khóa (khoa.json); tiêu đề "Con khỉ đột đi giữa sân mà không ai thấy (Mù không chú ý)"; link `/psyche/thi-nghiem/khi-dot-vo-hinh/` đúng.'
    review: dung
  - id: n14
    cau: Mù thay đổi (change blindness) là không nhận ra một thay đổi lớn, vì ta không lưu chi tiết của cảnh vật như tưởng.
    loai: dinh-nghia
    nguon:
      - simons1999
      - simons1998
    trich: we often do not detect large changes to objects and scenes (`change blindness')
    vi_tri: Tóm tắt Simons 1999
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ khẳng định "vì não không hề lưu chi tiết…"; nguồn: "We apparently do not retain a detailed visual representation of our surroundings from one view to the next". Giữ chữ, vì tác giả dùng "apparently"; trang đã đặt trong định nghĩa. Review (Claude Sonnet 5.5, 10/11/2026): dung. Simons 1999 và Simons & Levin 1998: "we often do not detect large changes… We apparently do not retain a detailed visual representation"; chữ trang là định nghĩa, có hedge qua "như ta tưởng".'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.3758/BF03208840" ]
    luot_2_ghi_chu: Đọc toàn văn PDF (gwern.net). Cửa che khoảng 1 s; 15 người đi đường; thí nghiệm 2 toàn sinh viên, nhóm thí nghiệm 1 luôn phát hiện.
    review: dung
  - id: n15
    cau: 'Simons và Levin làm thí nghiệm ngoài đời thật: một người của nhóm nghiên cứu chặn người đi đường ở sân trường Cornell để hỏi đường; đang nói chuyện, hai người khiêng một cánh cửa gỗ đi ngang che khuất tầm nhìn khoảng một giây.'
    loai: phat-hien
    nguon:
      - simons1998
    trich: The door blocked the pedestrian's view for approximately 1 sec
    vi_tri: Simons & Levin 1998, Method
    ket_qua: dung
