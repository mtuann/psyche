    cau: 'Vững chắc: chú ý tập trung vào một việc có thể khiến ta bỏ lỡ vật hiển nhiên khác.'
    loai: nhan
    nhan: vung-chac
    co_so:
      - simons1999
      - ekelund2022
    ly_do: 'Cùng nhãn ở trang nhà thi-nghiem/khi-dot-vo-hinh (đã khóa; căn cứ ở đó: Simons và Chabris 1999, Ekelund 2022 phân tích tổng hợp 14 nghiên cứu, Drew 2013, Hyman 2010, Chabris 2011, Nobre 2020); trang này chỉ dẫn lại, không thêm căn cứ.'
    nguon:
      - simons1999
      - ekelund2022
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đã được tìm thấy với nhiều loại nhiệm vụ, nhiều loại ''vật lạ'', trong phòng thí nghiệm lẫn ngoài đời. Hiệu ứng con khỉ đột là một trong những phát hiện được lặp lại nhiều nhất của tâm lý học nhận thức." ("được lặp lại nhiều nhất" không có nguồn). Chữ mới khớp trang nhà và link về nhà. Chỗ khó: co_so là hồ sơ trang nhà, không phải nguồn đã mở ở đây; Simons 1999 mở được xác nhận video và màn hình đơn giản. Review (Claude Sonnet 5.5, 10/11/2026): dung. Nhãn Vững chắc đạt thước đo theo căn cứ của trang nhà đã khóa (kiem-dinh/thi-nghiem/khi-dot-vo-hinh n31): phân tích tổng hợp Ekelund 2022 (14 nghiên cứu, 1.153 người: 62% người mới và 56% chuyên gia bị mù không chú ý), nhiều thí nghiệm cùng chiều ở nhiều bối cảnh (Simons 1999: 46% trong 192 người; Hyman 2010; Chabris 2011; Drew 2013); không có thất bại tái lập lớn. Trang này chỉ dẫn lại. Đọc lại Ekelund (tóm tắt Europe PMC): khớp. Ranh giới: Ekelund đo chuyên môn, không phải "có hiện tượng hay không", nên căn cứ chính vẫn là thí nghiệm gốc cộng với các lặp lại; chủ repo duyệt.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059", "https://doi.org/10.1371/journal.pone.0022757", "https://doi.org/10.3758/BF03208840" ]
    luot_2_ghi_chu: "Nhận định tổng quát/lời khuyên/giải thích phù hợp các nguồn trên. n22 'Vững chắc': nhiều lần lặp độc lập nhưng tôi không tìm được phân tích tổng hợp chính thức; người review cân nhắc. n38, n39 là lời khuyên suy ra, không có thử nghiệm trực tiếp."
