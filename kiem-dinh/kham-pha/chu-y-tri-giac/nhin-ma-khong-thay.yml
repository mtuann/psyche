    ghi_chu: 'Chữ cũ: "suy giảm tương đương lái xe khi say, và điện thoại rảnh tay cũng nguy hiểm như cầm tay." Chỗ khó: Đã bị bác bỏ cần các kiểm tra đủ mạnh liên tục thất bại; chỉ một thí nghiệm mô phỏng mở được: lượt 2 và review cân nhắc đổi nhãn hay thêm nguồn. Chữ trang đã làm mềm. Review (Claude Sonnet 5.5, 10/11/2026): dung. Nhãn Đã bị bác bỏ giữ cho ý "mắt vẫn nhìn đường nên không sao": Strayer 2006 (40 người, phanh chậm hơn, 3 tai nạn mô phỏng so với 0; cả cầm tay lẫn rảnh tay) và phân tích tổng hợp Horrey & Wickens 2006 (23 nghiên cứu, rảnh tay không loại bỏ chi phí). Thêm Horrey & Wickens vào cơ sở; có hai nguồn cùng chiều, một tổng hợp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1518/001872006777724471", "https://doi.org/10.1016/j.aap.2008.01.009" ]
    luot_2_ghi_chu: Có phân tích tổng hợp, nên nhãn 'Khá vững' không cao hơn thước đo (có thể cao hơn).
    review: dung
  - id: n44
    cau: Với đa số người, làm hai việc đòi hỏi chú ý cùng lúc thì kém hơn làm riêng từng việc.
    loai: phat-hien
    nguon:
      - watson2010
    trich: Whereas the vast majority of participants showed significant performance decrements in dual-task conditions
    vi_tri: Tóm tắt Watson & Strayer 2010
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chú ý là tài nguyên có hạn; đa nhiệm chỉ là chuyển đổi nhanh giữa các việc, mỗi lần chuyển đều tốn chi phí." (cơ chế "chỉ là chuyển đổi nhanh" không có nguồn đã mở ở trang này; bài Đa nhiệm có phần riêng). Review (Claude Sonnet 5.5, 10/11/2026): dung. Watson & Strayer 2010 (toàn văn lượt 1): "the vast majority of participants showed significant performance decrements in dual-task conditions". Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1518/001872006777724471", "https://doi.org/10.1016/j.aap.2008.01.009" ]
    luot_2_ghi_chu: Có phân tích tổng hợp, nên nhãn 'Khá vững' không cao hơn thước đo (có thể cao hơn).
    review: dung
  - id: n45
    cau: 'Ngộ nhận: "Nếu có chuyện lạ xảy ra ngay trước mắt, chắc chắn tôi sẽ thấy." 78% người Mỹ tin như vậy, và khoảng một nửa số người trong thí nghiệm con khỉ đột đã cho thấy điều ngược lại với chính mình.'
    loai: phat-hien
    nguon:
      - simons2011
      - simons1999
    trich: unexpected objects generally grab attention (78%)
    vi_tri: Tóm tắt Simons & Chabris 2011; Simons 1999, Results
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "đã chứng minh điều ngược lại". Review (Claude Sonnet 5.5, 10/11/2026): dung. 78% (Simons & Chabris 2011) và "khoảng một nửa" (46% trong 192 người; Simons 1999). Chữ trang mềm.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1371/journal.pone.0022757" ]
    luot_2_ghi_chu: Con số 78% khớp. Không xác minh được ngày thực hiện (6/2009) từ tóm tắt.
    review: dung
  - id: n46
    cau: 'Quiz 1: người xem không thấy khỉ đột vì chú ý dồn vào việc đếm bóng, không còn đủ để đăng ký vật lạ; khỉ đột đi qua ngay vùng đang nhìn, nhiều giây liền; đây là định nghĩa của mù không chú ý.'
    loai: phat-hien
    nguon:
      - simons1999
    trich: Objects can pass through the spatial extent of attentional focus (and the fovea) and still not be 'seen' if they are not specifically being attended.
    vi_tri: Simons 1999, Discussion (v)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mắt vẫn hướng về phía con khỉ đột và ánh sáng vẫn vào võng mạc. Vấn đề nằm ở khâu xử lý của não: không có chú ý thì không có nhận thức về vật đó." Đã bỏ phần về mắt (n10), "dù ở giữa màn hình 9 giây" thành "nhiều giây" (n4). Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ (câu hỏi quiz 1): "…dù nó ở ngay giữa màn hình 9 giây?" Chữ mới: "…dù nó ở ngay giữa màn hình nhiều giây?" Lý do: hồ sơ n4 đã đổi "9 giây" thành "nhiều giây" nhưng câu hỏi quiz còn sót; 9 giây chỉ ở video bổ sung (62 giây), điều kiện chính ngắn hơn (Simons 1999).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059", "https://doi.org/10.1371/journal.pone.0022757", "https://doi.org/10.3758/BF03208840" ]
    luot_2_ghi_chu: "Nhận định tổng quát/lời khuyên/giải thích phù hợp các nguồn trên. n22 'Vững chắc': nhiều lần lặp độc lập nhưng tôi không tìm được phân tích tổng hợp chính thức; người review cân nhắc. n38, n39 là lời khuyên suy ra, không có thử nghiệm trực tiếp."
    review: sai
  - id: n47
    cau: 'Quiz 2: thí nghiệm cánh cửa cho thấy ngay cả khi nhìn thẳng và nói chuyện với một người, ta vẫn có thể không nhận ra người đó bị đổi thành người khác; thí nghiệm khỉ đột dùng vật xuất hiện bất ngờ; đây là mù thay đổi.'
    loai: phat-hien
    nguon:
      - simons1998
    trich: Only half of the pedestrians detected the change.
    vi_tri: Tóm tắt Simons & Levin 1998
    ket_qua: dung
    ghi_chu: 'Theo G1-L03: KHỚP.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059", "https://doi.org/10.1371/journal.pone.0022757", "https://doi.org/10.3758/BF03208840" ]
    luot_2_ghi_chu: "Nhận định tổng quát/lời khuyên/giải thích phù hợp các nguồn trên. n22 'Vững chắc': nhiều lần lặp độc lập nhưng tôi không tìm được phân tích tổng hợp chính thức; người review cân nhắc. n38, n39 là lời khuyên suy ra, không có thử nghiệm trực tiếp."
  - id: n48
    cau: 'Quiz 3: 78% người Mỹ đồng ý (khảo sát Simons & Chabris 2011); niềm tin này có thể khiến ta chủ quan, tin rằng sẽ tự động thấy nguy hiểm nên vừa lái xe vừa làm việc khác.'
    loai: phat-hien
    nguon:
      - simons2011
    trich: unexpected objects generally grab attention (78%)
    vi_tri: Tóm tắt Simons & Chabris 2011
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Vì nó khiến ta chủ quan"; thêm "có thể". Khoảng cách giữa ta tưởng và thực sự thấy "có thể khiến ta chủ quan trong những việc cần chú ý" (cũ: "chính là nơi tai nạn xảy ra"). Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp n24, n26; đáp án có "có thể".'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1371/journal.pone.0022757" ]
    luot_2_ghi_chu: Con số 78% khớp. Không xác minh được ngày thực hiện (6/2009) từ tóm tắt.
    review: dung
  - id: n49
    cau: 'Quiz 4: theo Strayer, Drews và Crouch (2006), điện thoại rảnh tay cũng gây suy giảm như cầm tay, và mức suy giảm có thể nghiêm trọng như lái xe khi say ở nồng độ cồn 0,08%.'
    loai: phat-hien
    nguon:
      - strayer2006
    trich: the impairments associated with using a cell phone while driving can be as profound as those associated with driving while drunk
    vi_tri: Tóm tắt Strayer 2006
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "suy giảm tương đương lái xe khi say ở ngưỡng vi phạm"; lời giải thích cũ "Vấn đề nằm ở cuộc trò chuyện chiếm mất chú ý, không phải ở việc tay có bận hay không. Đây là áp dụng trực tiếp của mù không chú ý vào đời sống." (cơ chế không có trong tóm tắt) đã thay. Review (Claude Sonnet 5.5, 10/11/2026): dung. Strayer 2006 (toàn văn): cầm tay và rảnh tay không khác nhau về mức suy giảm (p > 0,25); "as profound as" khớp. Giải thích quiz không dựa vào vị trí lựa chọn.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1518/001872006777724471", "https://doi.org/10.1016/j.aap.2008.01.009" ]
    luot_2_ghi_chu: Có phân tích tổng hợp, nên nhãn 'Khá vững' không cao hơn thước đo (có thể cao hơn).
    review: dung
  - id: n50
    cau: 'Quiz 5: tình huống tìm chìa khóa lúc vội rồi tìm lại thì thấy ngay: có thể là một dạng "nhìn mà không thấy", nhưng chỉ là một cách giải thích có thể; chưa thể kết luận.'
    loai: phat-hien
    nguon:
      - simons1999
    trich: Our results suggest that the likelihood of noticing an unexpected object depends on the similarity of that object to other objects in the display and on how difficult the priming monitoring task is.
    vi_tri: Tóm tắt Simons 1999
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: đáp án "Lúc vội, chú ý của bạn bị chiếm bởi sự lo lắng và việc khác, nên mắt ''quét'' qua mà não không đăng ký." và lời giải thích "Đây là phiên bản đời thường của mù không chú ý. Cách khắc phục: dừng lại, hít thở…" (lời khuyên không nguồn). Đã thay bằng "có thể là" và bỏ lời khuyên. Hai lựa chọn nhiễu ("chìa khóa tự di chuyển", "trí nhớ có vấn đề nghiêm trọng") là phương án nhiễu. Review (Claude Sonnet 5.5, 10/11/2026): dung. Câu hỏi giả định (tìm chìa khóa) ghi `gia-dinh`; đáp án đúng nói "có thể là" và nêu chưa kết luận; không trái nhận định nào.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059", "https://doi.org/10.1371/journal.pone.0022757", "https://doi.org/10.3758/BF03208840" ]
    luot_2_ghi_chu: "Nhận định tổng quát/lời khuyên/giải thích phù hợp các nguồn trên. n22 'Vững chắc': nhiều lần lặp độc lập nhưng tôi không tìm được phân tích tổng hợp chính thức; người review cân nhắc. n38, n39 là lời khuyên suy ra, không có thử nghiệm trực tiếp."
    review: dung
  - id: n51
    cau: 'Chân trang "Đọc thêm": liên kết tới "Mắt thấy có phải là thật?" và "Giữa bữa tiệc ồn ào, sao bạn vẫn nghe thấy tên mình?"; và liên kết tới trang Ngộ nhận.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: kham-pha/chu-y-tri-giac/ao-giac-thi-giac, nghe-chon-loc, ngo-nhan/index đều có trong src/data/trang.yml. Review (Claude Sonnet 5.5, 10/11/2026): dung. Ba trang (ao-giac-thi-giac, nghe-chon-loc cùng lô; ngo-nhan/index) có trong src/data/trang.yml; tiêu đề khớp; ngo-nhan chưa dựng nên link thành "sắp có" tới khi lên.'
    review: dung
  - id: n52
    cau: 'Mục Nguồn: Simons & Chabris (1999), Perception 28(9), 1059–1074; Simons & Levin (1998), Psychon Bull Rev 5(4), 644–649; Simons & Chabris (2011), PLoS ONE 6(8), e22757; Strayer, Drews & Crouch (2006), Hum Factors 48(2), 381–391; Watson & Strayer (2010), Psychon Bull Rev 17(4), 479–485 (thông tin sách báo).'
    loai: lich-su
    nguon:
      - simons1999
      - simons1998
      - simons2011
      - strayer2006
      - watson2010
    ket_qua: dung
    ghi_chu: Đối chiếu tên bài, tạp chí, tập, trang với bản PDF (Simons 1999, 1998, 2011, Watson) và OpenAlex (Strayer). Mô tả trong ngoặc của Nguồn ("8/15 người đi đường không nhận ra", "78%") khớp n18, n24.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1068/p281059", "https://doi.org/10.3758/BF03208840", "https://doi.org/10.1371/journal.pone.0022757", "https://doi.org/10.1518/001872006777724471" ]
    luot_2_ghi_chu: Tập, trang, năm của Perception 28(9) 1059–1074, PBR 5(4) 644–649, PLoS ONE 6(8) e22757, Hum Factors 48(2) 381–391 khớp. Watson & Strayer 2010 chưa mở.
