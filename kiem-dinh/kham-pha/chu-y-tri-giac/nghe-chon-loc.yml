    cau: 'Ngộ nhận: "Càng cố tập trung thì càng không bị phân tâm bởi tên mình." Chưa hẳn: Conway và cộng sự (2001) cho thấy người có khả năng kiểm soát chú ý (trí nhớ làm việc) thấp hơn lại dễ bị tên mình "bắt" hơn; khác biệt này thấy ở mức nhóm người, chưa rõ cố gắng thêm trong một buổi có thay đổi được kết quả không.'
    loai: phat-hien
    nguon:
      - conway2001
    trich: Clearly, the low-span subjects detected their own names more often.
    vi_tri: Conway 2001, Results
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đây là khác biệt cá nhân tương đối ổn định, không phải cứ cố gắng trong một buổi là thay đổi được." (không nguồn về độ ổn định). Review (Claude Sonnet 5.5, 10/11/2026): dung. Conway 2001 (qua trích lượt 1) và Röer & Cowan 2021: người span thấp dễ nhận ra tên hơn; nêu rõ khác biệt giữa nhóm người, chưa rõ nỗ lực thêm. Khớp, thận trọng.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.3758/bf03196169", "https://doi.org/10.1037/xlm0000874" ]
    luot_2_ghi_chu: Khác biệt thấy giữa các nhóm người, không đo hiệu quả của cố gắng thêm; câu viết thận trọng đúng.
    review: dung
  - id: n60
    cau: 'Quiz 1: trong nhiệm vụ đọc đuổi của Cherry (1953), người tham gia nhận ra từ tai bị bỏ qua chỉ những thay đổi vật lý (giọng nam đổi giọng nữ, tiếng nói đổi thành một tiếng "bíp"), còn nội dung thì gần như không biết gì.'
    loai: phat-hien
    nguon:
      - cherry1953
    trich: In no case in which normal human speech was used did the listening subjects fail to identify it as speech; in every such instance they were unable to identify any word or phrase heard in the rejected ear
    vi_tri: Cherry 1953, mục 6
    ket_qua: dung
    ghi_chu: 'Theo G1-L03: câu 1 mơ hồ, đã sửa thành "tiếng bíp".'
    luot_2: dung
    luot_2_nguon: [ "https://www.smithsrisca.co.uk/PSYcherry1953.html" ]
    luot_2_ghi_chu: Chỉ đọc tóm tắt thứ cấp; Cherry 1953 chưa mở được. n14 'phần lớn không nhận ra' khớp tóm tắt nhưng cần đối chiếu.
  - id: n61
    cau: 'Quiz 2: trong lần làm lại của Wood và Cowan (1995), khoảng một phần ba (34,6%) người tham gia nhớ đã nghe thấy tên mình; các nghiên cứu sau thuật lại 33% cho Moray; lần làm lại có đăng ký trước năm 2021 ra 29%; tỉ lệ không cố định, có nghiên cứu thấy cao hơn, tới khoảng một nửa.'
    loai: so-lieu
    nguon:
      - wood1995
      - conway2001
      - roer2021
    trich: only 34.6% of the participants recalled hearing their name in the channel to be ignored
    vi_tri: Tóm tắt Wood & Cowan 1995
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: câu hỏi về Moray, đáp án "4 trên 12 người", giải thích "lặp lại gần như nguyên vẹn 36 năm sau". Đã đổi câu hỏi sang Wood và Cowan. Hai lựa chọn nhiễu ("khoảng 90%", "khoảng một nửa") giữ. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ (giải thích quiz 2): "…Conway và cộng sự (2001) thuật lại con số 33% cho nghiên cứu gốc của Moray (1959), và lần làm lại có đăng ký trước năm 2021 ra 29%." Chữ mới: "các nghiên cứu sau thuật lại con số 33%…; Tỉ lệ không cố định: có nghiên cứu thấy cao hơn, tới khoảng một nửa." Lý do: như n35; đáp án đúng (34,6%) vẫn đúng với Wood & Cowan.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0278-7393.21.1.255", "https://doi.org/10.3758/bf03196169", "https://doi.org/10.1037/xlm0000874", "https://pmc.ncbi.nlm.nih.gov/articles/PMC8908911/" ]
    luot_2_ghi_chu: "Con số đúng. Lưu ý: tỉ lệ không cố định ở một phần ba: Conway 2001 trung bình khoảng 43% và Naveh-Benjamin 2014 ở người trẻ 48-58% (theo Röer & Cowan 2021)."
    review: sai
  - id: n62
    cau: 'Quiz 3: theo kết luận của Moray (1959), kích thích duy nhất được thấy xuyên qua hàng rào chú ý là tên của chính người tham gia; dù được lặp hay dặn riêng phải nhớ, các kích thích trung tính vẫn không xuyên qua được.'
    loai: phat-hien
    nguon:
      - moray1959
    trich: a specific set for numbers will not break through the attentional barrier set up in this task
    vi_tri: Tóm tắt Moray 1959
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "kích thích duy nhất xuyên qua được". Thêm "được thấy". Câu giải thích "dù được lặp hàng chục lần" thành "lặp" (danh sách từ 35 lần). Review (Claude Sonnet 5.5, 10/11/2026): dung. Moray 1959 (toàn văn): thí nghiệm III, nhóm dặn nhớ các con số ở tai kia không nhớ nhiều hơn nhóm không dặn ("a specific set for numbers will not break through"); kết luận về tên riêng; "kích thích duy nhất được thấy" đúng chữ trang.'
    luot_2: dung
    luot_2_nguon: [ "https://www.tutor2u.net/psychology/reference/moray-1959" ]
    luot_2_ghi_chu: Chỉ đọc qua tài liệu thứ cấp (tutor2u); bài gốc QJEP 1959 chưa mở được (bị chặn).
    review: dung
  - id: n63
    cau: 'Quiz 4: thí nghiệm "nhảy tai" của Treisman (1960): đôi khi người tham gia lỡ lặp lại một hai từ của tai kia, đúng phần nối tiếp hợp nghĩa; chứng tỏ nội dung kênh bị bỏ qua vẫn được xử lý ở mức nào đó; thách thức mô hình lọc sớm nguyên bản.'
    loai: phat-hien
    nguon:
      - treisman1960
    trich: Subjects occasionally repeated one or two words, at the break, from the wrong ear, but never transferred to it for longer than this.
    vi_tri: Tóm tắt Treisman 1960
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: đáp án đúng "Người tham gia vô thức đọc đuổi theo phần có nghĩa sang tai kia mà không hay biết…" (SAI, phóng đại, G1 #6) và "chứng minh". Đã sửa cả đáp án và giải thích. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ (giải thích quiz 4): "Kết quả này giáng một đòn mạnh vào mô hình lọc sớm nguyên bản của Broadbent." Chữ mới: "…thách thức mô hình lọc sớm nguyên bản của Broadbent." Lý do: Treisman 1960 (toàn văn) chỉ nêu "one explanation might be" bộ lọc nâng ngưỡng; "đòn mạnh" quá mạnh.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/xlm0000874", "https://pmc.ncbi.nlm.nih.gov/articles/PMC8908911/" ]
    luot_2_ghi_chu: "Các mô hình (Broadbent 1958, Treisman 1960/1964, Deutsch & Deutsch 1963, Lavie 1995) mô tả đúng như tài liệu chuẩn, nhưng không mở bài gốc. n53, n55, n56 (thời sự): tìm Europe PMC ngày 10/11/2026 không thấy nghiên cứu hiệu ứng bữa tiệc cocktail ở người Việt; Röer & Cowan dùng người nói tiếng Đức, các nghiên cứu còn lại tiếng Anh. n54 là kiến thức ngôn ngữ chuẩn. n49, n50 'Khá vững' chấp nhận được (Moray, Wood & Cowan, Röer & Cowan)."
    review: sai
  - id: n64
    cau: 'Quiz 5: theo Conway, Cowan và Bunting (2001), người có dung lượng trí nhớ làm việc thấp hơn dễ nghe thấy tên mình ở kênh bị bỏ qua hơn, vì khả năng kiểm soát, gạt bỏ nhiễu của họ kém hơn.'
    loai: phat-hien
    nguon:
      - conway2001
    trich: 20% of high-span subjects and 65% of low-span subjects reported hearing their name
    vi_tri: Conway 2001
    ket_qua: dung
    ghi_chu: 'Theo G1-L03: KHỚP. Lời giải thích "không phải dấu hiệu tai thính… phản ánh hàng rào kiểm soát lỏng lẻo hơn" là cách giải thích của các tác giả (n33).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.3758/bf03196169", "https://doi.org/10.1037/xlm0000874" ]
    luot_2_ghi_chu: Con số 65% so với 20% (Conway 2001) không đọc được trong bản mở; hướng kết quả được xác nhận bởi hai nghiên cứu. n37 'Khá vững' hợp lý (hai nghiên cứu cùng chiều, nhưng Röer & Cowan lưu ý bảng hỏi nhạy kém với khác biệt trí nhớ làm việc).
  - id: n65
    cau: 'Xem thêm: "Nhìn mà không thấy" và "Mắt thấy có phải là thật?" cùng nhóm Chú ý–tri giác.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: hai trang có trong src/data/trang.yml. Review (Claude Sonnet 5.5, 10/11/2026): dung. Hai trang có trong src/data/trang.yml (nhin-ma-khong-thay, ao-giac-thi-giac); tiêu đề khớp "Nhìn mà không thấy" và "Mắt thấy có phải là thật?"; cùng lĩnh vực tri-giac-chu-y.'
    review: dung
  - id: n66
    cau: 'Mục Nguồn: Broadbent (1958); Bronkhorst (2015), Atten Percept Psychophys 77(5), 1465–1487; Cherry (1953), J Acoust Soc Am 25(5), 975–979; Conway, Cowan & Bunting (2001), Psychon Bull Rev 8(2), 331–335; Deutsch & Deutsch (1963), Psychol Rev 70, 80–90; Lavie (1995), JEP:HPP 21(3), 451–468; Moray (1959), QJEP 11(1), 56–60; Röer & Cowan (2021), JEP:LMC 47(2), 234–242; Snowden & Gray (2025), Perception 54(12), 931–947; Treisman (1960), QJEP 12(4), 242–248; Treisman (1964), Br Med Bull 20(1), 12–16; Wood & Cowan (1995), JEP:LMC 21(1), 255–260.'
    loai: lich-su
    nguon:
      - cherry1953
      - moray1959
      - treisman1960
      - wood1995
      - conway2001
      - roer2021
      - lavie1995
      - deutsch1963
      - bronkhorst2015
      - snowden2025
    ket_qua: da-sua
    ghi_chu: 'Đối chiếu tên bài, tạp chí, tập, trang với bản PDF (Cherry, Moray, Conway) và OpenAlex (còn lại; Treisman 1964 và Deutsch & Deutsch 1963 chỉ theo trích dẫn). Tựa Wood & Cowan khớp OpenAlex. Chú ý: tựa trong Conway 2001 ghi Wood & Cowan là "Attention and memory in the classic selective listening procedure of Cherry (1953)" (tiêu đề đầy đủ của bài khác với tiêu đề OpenAlex; trang theo OpenAlex/DOI). Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: mục Nguồn có 10 mục (Broadbent … Wood & Cowan). Chữ mới: thêm Bronkhorst (2015) và Snowden & Gray (2025). Đối chiếu Crossref (tập, trang): Bronkhorst APP 77(5) 1465–1487; Snowden & Gray Perception 54(12) 931–947. Mở lại PDF: Deutsch & Deutsch Psychol Rev 70(1) 80–90; Treisman QJEP 12(4) 242–248; Wood & Cowan JEP:LMC 21(1) 255–260; Moray QJEP 11(1) 56–60; Cherry JASA 25(5) 975–979 khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0278-7393.21.1.255", "https://doi.org/10.3758/bf03196169", "https://doi.org/10.1037/xlm0000874" ]
    luot_2_ghi_chu: "Các tham chiếu khớp: Wood & Cowan JEP:LMC 21(1) 255–260; Conway PBR 2001; Röer & Cowan JEP:LMC 2021 (47(2) 234-242). Cherry/Moray/Treisman/Lavie/Deutsch chưa kiểm tập trang."
    review: sai
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: '"Chuyện này xảy ra với hầu hết chúng ta."; "trong thí nghiệm phòng lab đầu tiên…"'
    moi: '"Nhiều người từng gặp chuyện này."; "trong một thí nghiệm phòng lab kinh điển…"'
    ly_do: Hồ sơ n2, n3.
  - cu: 'Đáp án: "Chỉ khoảng một phần ba — 4 trên 12 người trong thí nghiệm của Moray (1959)… hai phần ba số người bỏ lỡ hoàn toàn"'
    moi: '"Chỉ khoảng một phần ba: 34,6% trong lần làm lại của Wood và Cowan (1995)… Conway (2001) thuật lại 33% cho Moray…"; "…khoảng hai phần ba số người không nhận ra"'
    ly_do: Hồ sơ n4, n5. 4/12 không có trong Moray 1959.
  - cu: '"Nhà khoa học người Anh Colin Cherry là người đầu tiên đưa hiện tượng này vào phòng thí nghiệm"'
    moi: '"Nhà khoa học Colin Cherry đưa hiện tượng này vào phòng thí nghiệm"'
    ly_do: Hồ sơ n8.
  - cu: 'Cherry: "…hay tiếng nói bị thay bằng một tiếng ''bíp''…"; "Khi tiếng nói bị phát ngược… phần lớn không nhận ra"; "họ thậm chí không tách nổi hai luồng…"; "khi hai tai nhận hai giọng khác nhau…"; "Cherry kết luận … chủ yếu dựa vào đặc điểm vật lý"'
    moi: Các câu đã sửa theo Cherry (tiếng "bíp" 400 Hz, tiếng phát ngược, tách được hai luồng nhờ ý nghĩa, mỗi tai một thông điệp cùng người đọc, kết luận của Cherry, Broadbent dựa vào đó)
    ly_do: 'Hồ sơ n13–n19 (các sửa của G1-L03 #1–#4 đã có trên trang cũ; ghi lại để hồ sơ đủ).'
  - cu: 'Moray: "ví dụ: ''An, bạn có thể đổi tai nghe bây giờ''"; "trong một số đoạn…"; "Trong bảng hỏi sau thí nghiệm, 4 trên 12 người (khoảng 1/3) cho biết…"; "có xu hướng chuyển tai nhiều hơn"'
    moi: '"ví dụ: ''An, hãy đổi sang tai kia''"; "trong một nửa số chỉ dẫn…"; "20 trên 39 chỉ dẫn có tên được nghe, so với 4 trên 36… Các nghiên cứu sau thuật lại… khoảng một phần ba"; "nghe thấy chỉ dẫn nhiều hơn một chút (0,80 so với 0,33)… chưa đạt mức có ý nghĩa thống kê 5%"'
    ly_do: Hồ sơ n21–n26.
  - cu: 'Treisman: "đọc đuổi theo… sang tai kia mà không hay biết" (quiz 4); ví dụ "I saw the girl furniture over"'
    moi: '"lỡ lặp lại một hai từ… không bao giờ theo sang lâu hơn"; bỏ ví dụ'
    ly_do: 'Hồ sơ n27, n63 (G1-L03 #5–#6 đã áp ở trang cũ).'
  - cu: 'Wood và Cowan: "Họ không ''nghe lén'' được cả hai tai cùng lúc."'
    moi: (bỏ)
    ly_do: Hồ sơ n30.
  - cu: 'Khung "Vững chắc: ta có thể theo dõi một luồng… tín hiệu gắn với bản thân có thể lọt qua" (đã được tìm thấy lại nhiều lần… hiệu ứng nền tảng)'
    moi: Khung Khá vững cùng ý chính; "…chưa có phân tích tổng hợp và số lần làm lại còn ít."
    ly_do: Hồ sơ n34.
  - cu: 'Khung Khá vững 1/3: "…Moray (1959, 4/12 người) và Wood và Cowan (1995, 34,6%) — hai nghiên cứu độc lập cách nhau 36 năm cho kết quả gần như trùng khớp…"'
    moi: '"Con số khoảng 1/3 thấy ở Wood và Cowan (1995, 34,6%) và Röer và Cowan (2021, 29%); Conway… thuật lại 33% cho Moray"'
    ly_do: Hồ sơ n35.
  - cu: 'Khung bác bỏ: "…dù danh sách từ được lặp đi lặp lại hàng chục lần."; ngộ nhận: "dù lặp lại hàng chục lần"'
    moi: '"…không nhận ra danh sách từ được lặp 35 lần"; "dù danh sách từ lặp 35 lần"'
    ly_do: Hồ sơ n43, n44, n57.
  - cu: '"Quan điểm hiện đại nghiêng về hướng cả hai cơ chế…"; "Ngày nay, hầu hết nhà nghiên cứu… Cuộc tranh luận không còn là ''ai đúng''…"'
    moi: '"Một số nhà nghiên cứu đề xuất dung hòa… (Lavie, 1995)"; "Lavie (1995) đề xuất… cũng còn được bàn cãi." Thêm Lavie vào mục Nguồn.'
    ly_do: Hồ sơ n38b, n42, n48.
  - cu: 'Áp dụng 1: nhãn Vững chắc, "cách hiệu quả nhất… tai nghe chống ồn…"; Áp dụng 2: "hiệu quả hơn hẳn… ngưỡng chú ý thấp nhất… Các hệ thống cảnh báo an toàn…"; Áp dụng 3: "mỗi lần chú ý nhảy sang kênh bị bỏ qua đều đi kèm lỗi… lái xe… họp"'
    moi: 'Áp dụng 1: nhãn Khá vững, suy luận có giới hạn; Áp dụng 2: "có thể dễ thu hút chú ý… cũng chỉ khoảng một phần ba…"; bỏ câu cảnh báo an toàn; Áp dụng 3: "Wood và Cowan (1995) thấy người nghe thấy tên mình mắc thêm lỗi… bài này không đo lái xe hay họp hành."'
    ly_do: Hồ sơ n49–n52.
  - cu: 'Mục Việt Nam: "Chúng tôi chưa tìm thấy…"; "Các thí nghiệm gốc và hầu hết các lần làm lại…"; "tên riêng của người Việt thường có cấu trúc hai–ba âm tiết…"'
    moi: '"Tính đến 11/2026, chúng tôi chưa tìm thấy…"; "Các nghiên cứu gốc (Cherry, Moray, Wood và Cowan, Conway và cộng sự) đều thực hiện với người nói tiếng Anh."; "liệu độ dài và cấu trúc của tên riêng… chưa có dữ liệu"'
    ly_do: Hồ sơ n53–n56.
  - cu: 'Ngộ nhận: "(Moray, 1959; Wood và Cowan, 1995)"; "Đây là khác biệt cá nhân tương đối ổn định…"'
    moi: '"(Wood và Cowan, 1995; Röer và Cowan, 2021)"; "…chưa rõ cố gắng thêm trong một buổi có thay đổi được kết quả hay không."'
    ly_do: Hồ sơ n58, n59.
  - cu: 'Quiz 2: "Trong thí nghiệm của Moray (1959), bao nhiêu người nhận ra tên mình…?" đáp án "(4 trên 12 người)"; giải thích "lặp lại gần như nguyên vẹn 36 năm sau"'
