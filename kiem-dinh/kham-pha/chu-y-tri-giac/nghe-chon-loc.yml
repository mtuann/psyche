    luot_2_ghi_chu: "Con số đúng. Lưu ý: tỉ lệ không cố định ở một phần ba: Conway 2001 trung bình khoảng 43% và Naveh-Benjamin 2014 ở người trẻ 48-58% (theo Röer & Cowan 2021)."
  - id: n6
    cau: 'Hiệu ứng bữa tiệc cocktail (cocktail party effect): khả năng theo dõi một dòng âm thanh mình quan tâm giữa nhiều âm thanh cạnh tranh, đồng thời vẫn bắt được những tín hiệu đặc biệt quan trọng, điển hình là tên mình, từ phần âm thanh đang bị bỏ qua.'
    loai: dinh-nghia
    nguon:
      - conway2001
    trich: the cocktail party phenomenon, which refers to a situation in which one can attend to only part of a noisy environment, yet highly pertinent stimuli such as one's own name can suddenly capture attention
