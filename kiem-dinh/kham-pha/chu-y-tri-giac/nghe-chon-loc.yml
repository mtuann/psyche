nhan_dinh:
  - id: n1
    cau: 'Hiệu ứng bữa tiệc cocktail: khả năng theo dõi một giọng nói giữa đám đông ồn ào nhưng vẫn "bắt" được tên mình từ phía bị bỏ qua; từ nhiệm vụ nghe hai tai của Cherry (1953) và Moray (1959) đến cuộc tranh luận bộ lọc sớm/muộn của Broadbent và Treisman.'
    loai: lich-su
    nguon:
      - cherry1953
      - moray1959
      - conway2001
    trich: Broadbent's (1958) model has been seriously challenged, however, by demonstrations of semantic processing of unattended information. For example, Moray (1959) found that some subjects detect their own name
    vi_tri: Conway 2001, mở bài
    ket_qua: dung
    ghi_chu: Mô tả (description).
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/xlm0000874", "https://pmc.ncbi.nlm.nih.gov/articles/PMC8908911/" ]
    luot_2_ghi_chu: "Các mô hình (Broadbent 1958, Treisman 1960/1964, Deutsch & Deutsch 1963, Lavie 1995) mô tả đúng như tài liệu chuẩn, nhưng không mở bài gốc. n53, n55, n56 (thời sự): tìm Europe PMC ngày 10/11/2026 không thấy nghiên cứu hiệu ứng bữa tiệc cocktail ở người Việt; Röer & Cowan dùng người nói tiếng Đức, các nghiên cứu còn lại tiếng Anh. n54 là kiến thức ngôn ngữ chuẩn. n49, n50 'Khá vững' chấp nhận được (Moray, Wood & Cowan, Röer & Cowan)."
  - id: n2
    cau: Nhiều người từng gặp chuyện nghe thấy tên mình từ xa giữa nơi ồn ào; tuy vậy không phải ai cũng nhận ra tên mình trong thí nghiệm.
    loai: phat-hien
    nguon:
      - conway2001
    trich: Contrary to popular belief, not all subjects demonstrate this "cocktail party effect."
    vi_tri: Conway 2001, mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chuyện này xảy ra với hầu hết chúng ta." (mâu thuẫn với con số khoảng một phần ba trong phòng thí nghiệm). Chữ mới "Nhiều người từng gặp chuyện này". Tình huống đám cưới là minh họa (gia-dinh). Review (Claude Sonnet 5.5, 10/11/2026): dung. Conway 2001 mở bài: "Contrary to popular belief, not all subjects demonstrate this cocktail party effect". Tình huống đám cưới là minh họa (gia-dinh).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0278-7393.21.1.255", "https://doi.org/10.3758/bf03196169", "https://doi.org/10.1037/xlm0000874", "https://pmc.ncbi.nlm.nih.gov/articles/PMC8908911/" ]
    luot_2_ghi_chu: "Con số đúng. Lưu ý: tỉ lệ không cố định ở một phần ba: Conway 2001 trung bình khoảng 43% và Naveh-Benjamin 2014 ở người trẻ 48-58% (theo Röer & Cowan 2021)."
    review: dung
  - id: n3
    cau: Trong một thí nghiệm kinh điển, người tham gia đeo tai nghe, đọc đuổi một thông điệp ở tai này, còn ở tai kia (bị yêu cầu bỏ qua) người ta chèn tên của chính người tham gia.
    loai: phat-hien
    nguon:
      - moray1959
    trich: Subjects were required to shadow ten short passages of light fiction. ... instructions were interpolated ... prefixed by the subject's own name.
    vi_tri: Moray 1959, Experiment II
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "trong thí nghiệm phòng lab đầu tiên kiểm tra hiện tượng này" ("đầu tiên" không có nguồn); chữ mới "một thí nghiệm phòng lab kinh điển". Review (Claude Sonnet 5.5, 10/11/2026): dung. Moray 1959 (toàn văn), Thí nghiệm II: 10 đoạn văn nhẹ, chỉ dẫn xen vào, một nửa mở đầu bằng tên người tham gia. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0278-7393.21.1.255", "https://doi.org/10.3758/bf03196169", "https://doi.org/10.1037/xlm0000874", "https://pmc.ncbi.nlm.nih.gov/articles/PMC8908911/" ]
    luot_2_ghi_chu: "Con số đúng. Lưu ý: tỉ lệ không cố định ở một phần ba: Conway 2001 trung bình khoảng 43% và Naveh-Benjamin 2014 ở người trẻ 48-58% (theo Röer & Cowan 2021)."
    review: dung
  - id: n4
    cau: 'Đáp án: chỉ khoảng một phần ba nhận ra tên mình: 34,6% trong lần làm lại của Wood và Cowan (1995), gần với 33% mà các nghiên cứu sau thuật lại cho Moray (1959) và 29% của lần làm lại có đăng ký trước (Röer và Cowan, 2021); tỉ lệ không cố định (43% đến 58% ở vài nghiên cứu khác, theo Röer và Cowan); ở các lần đo gần một phần ba, đa số không biết tên mình vừa được nhắc.'
    loai: so-lieu
    nguon:
      - wood1995
      - roer2021
      - conway2001
    trich: Twenty-nine percent of the participants reported noticing their own name ... This is fairly comparable to the 33 percent from Moray (1959) and the 35 percent from Wood and Cowan (1995), and somewhat lower as the 43 percent from Conway et al. (2001) ... and the 58 and 48 percent of younger adults in Experiments 1 and 4 of Naveh-Benjamin et al. (2014).
    vi_tri: Röer & Cowan 2021, Experiment 1, Results và Discussion; Wood & Cowan 1995, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chỉ khoảng một phần ba — 4 trên 12 người trong thí nghiệm của Moray (1959)." Moray 1959 không nêu "4 trên 12 người": bảng III báo cáo theo số lần phát (20 trên 39 chỉ dẫn có tên được nghe, 4 trên 36 chỉ dẫn không tên), con số 33% là của Conway thuật lại. Theo G1-L03: "4/12" không kiểm được; đã kiểm toàn văn Moray: không có. Ngoài ra "hai phần ba số người bỏ lỡ hoàn toàn" thành "không nhận ra". Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: "Chỉ khoảng một phần ba: 34,6% (Wood và Cowan, 1995), gần với 33% (Conway thuật lại cho Moray); đa số còn lại không biết tên mình vừa được nhắc." Chữ mới: thêm 29% (Röer và Cowan, 2021) và nói rõ tỉ lệ không cố định: Conway 2001 khoảng 43%, Naveh-Benjamin 2014 48–58% ở người trẻ (theo Röer & Cowan 2021, mục Discussion, đã đọc toàn văn); "đa số không biết" chỉ gắn với các lần đo gần 1/3. Lý do: lượt 2 báo dải rộng hơn 1/3; Wood & Cowan (toàn văn): 34,6% của những người được chèn tên (9/26 trong 34 sinh viên), tự dẫn Moray 33,3% (12 người). Nguồn của 33% là Wood & Cowan và Röer & Cowan, không phải Moray 1959 (bài gốc không nêu).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0278-7393.21.1.255", "https://doi.org/10.3758/bf03196169", "https://doi.org/10.1037/xlm0000874", "https://pmc.ncbi.nlm.nih.gov/articles/PMC8908911/" ]
    luot_2_ghi_chu: "Con số đúng. Lưu ý: tỉ lệ không cố định ở một phần ba: Conway 2001 trung bình khoảng 43% và Naveh-Benjamin 2014 ở người trẻ 48-58% (theo Röer & Cowan 2021)."
    review: sai
  - id: n5
    cau: 'Bộ lọc chú ý mạnh (khoảng hai phần ba số người không nhận ra tên mình) nhưng không tuyệt đối: những tín hiệu "quan trọng với mình" như tên riêng vẫn có thể lọt qua.'
    loai: phat-hien
    nguon:
