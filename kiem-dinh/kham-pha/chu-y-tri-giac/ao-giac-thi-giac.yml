    ghi_chu: "Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: \"Nói cách khác, thứ mà sách giáo khoa phương Tây trình bày như một 'đặc điểm chung của mắt người' hóa ra lại mang đậm dấu ấn của môi trường sống.\" Chữ mới: kết quả \"được dẫn như bằng chứng\" thị giác chịu ảnh hưởng môi trường sống, nhưng Amir & Firestone (2026) cho rằng bằng chứng không nhất quán (Rivers 1905 thấy người Urali và Sholaga ở Ấn Độ bị ảo giác mạnh hơn cả người Anh; dữ liệu Segall có chỗ tự mâu thuẫn; dữ liệu nhiều người tham gia bị loại, có nhóm quá nửa) và giả thuyết \"thế giới thợ mộc\" gần như chắc chắn sai. Lý do: lượt 2 đúng (câu quá mạnh); đã đọc toàn văn Amir & Firestone mục 5. Cũng viết lại câu dẫn: \"Điều bất ngờ nhất… không phải ai cũng bị lừa như nhau\" thành \"…mức bị lừa khác nhau giữa các nhóm người. Đó là kết quả được báo cáo ban đầu\"."
