    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đoạn B dài hơn" (B là dạng đầu mũi tên `<--->`, trông ngắn hơn). Chữ mới: đoạn A trông dài hơn. Lý do: đoạn có cánh xòe ra ngoài (tails) trông dài hơn. Ghi lại bản vẽ chữ trong trang: A là `>-------<` (cánh xòe ra). Review (Claude Sonnet 5.5, 10/11/2026): dung. Amir & Firestone 2026, mục 2.1: Müller-Lyer (1889) thấy đoạn kết thúc bằng góc tù (cánh xòe ra) trông dài hơn đoạn kết thúc bằng góc nhọn (đầu mũi tên); khớp chữ trang và bản vẽ chữ (A là cánh xòe). Wikipedia chỉ còn là nguồn phụ.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1073/pnas.0409314102" ]
