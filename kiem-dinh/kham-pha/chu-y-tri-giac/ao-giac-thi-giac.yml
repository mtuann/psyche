    ly_do: 'Mức bị ảo giác Müller-Lyer khác nhau giữa người với người: người lớn cao tuổi bị mạnh hơn người trẻ, độc lập với thị lực (Chen 2025: 8,20% so với 4,33%, p = 0,001); ở trẻ 4–17 tuổi mức này giảm theo tuổi và cao hơn ở trẻ khiếm thị bẩm sinh (Lin 2023); Amir & Firestone 2026 ghi ảo giác mạnh hơn ở trẻ em so với người lớn. Nhãn chỉ nói về ý "ai cũng như nhau", không về giải thích văn hóa.'
    nguon:
      - chen2025
      - lin2023
      - amir2026
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thị giác được ''học'' từ môi trường, không chỉ do cấu tạo mắt." Chữ mới: "theo giải thích của Segall và cộng sự, thị giác có thể được định hình một phần bởi môi trường" (có giả thuyết thay thế như sắc tố võng mạc, theo Wikipedia về Jahoda). Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: nhãn Đã bị bác bỏ, thân: "Mức độ bị ảo giác khác nhau rõ rệt giữa các nền văn hóa; theo giải thích của Segall và cộng sự, thị giác có thể được định hình một phần bởi môi trường." Chữ mới: nhãn giữ Đã bị bác bỏ, thân nêu khác biệt giữa người với người: người lớn cao tuổi bị Müller-Lyer mạnh hơn người trẻ (8,20% so với 4,33%, Chen 2025) và mức này đổi theo tuổi ở trẻ em (Lin 2023); khác biệt văn hóa "đang tranh cãi". Lý do: đạo lý của ngộ nhận không được dựa vào kết luận văn hóa đang bị phản biện (n21).'
