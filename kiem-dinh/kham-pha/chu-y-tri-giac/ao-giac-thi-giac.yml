    ly_do: Segall và cộng sự (1963, 1966; qua Henrich 2010) báo cáo khác biệt lớn giữa xã hội; nghiên cứu cùng thời (Rivers 1905) cho chiều ngược, dữ liệu Segall có chỗ tự mâu thuẫn và loại dữ liệu nhiều (Amir & Firestone 2026), van der Kamp 2013 gọi truyền thống này "long, but controversial".
    nguon:
