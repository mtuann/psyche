    cau: 'Vững chắc: ảo giác Müller-Lyer tồn tại và đo được một cách ổn định.'
    loai: nhan
    nhan: vung-chac
    co_so:
      - bruno2009
      - amir2026
      - henrich2010
    ly_do: "Tổng quan định lượng 18 nghiên cứu về Müller-Lyer (Bruno & Franz 2009): hiệu ứng lên phán đoán thị giác lớn hơn lên động tác cầm nắm và gần như mọi hiệu ứng cầm nắm lớn hơn 0; Amir & Firestone (2026) tổng hợp hơn một thế kỷ nghiên cứu ở nhiều nhóm người và một số loài. Không có tranh cãi về sự tồn tại; phần tranh cãi (văn hóa) tách sang khung Đang tranh cãi."
    nguon:
      - bruno2009
      - amir2026
      - henrich2010
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Müller-Lyer và vòng tròn Ebbinghaus đã được đo đi đo lại hơn một thế kỷ, với cùng một hướng sai lệch." (Ebbinghaus không có nguồn đã mở; "một thế kỷ" không có). Chữ mới: Müller-Lyer, mô tả 1889, đo trong nhiều nghiên cứu kể cả liên văn hóa. Chỗ khó: Vững chắc theo thước đo cần phân tích tổng hợp hay hai tái lập lớn; chưa mở nguồn như vậy, nên lượt 2 và review cân nhắc hạ Khá vững. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: "Vững chắc: các ảo giác hình học tồn tại và đo được một cách ổn định" (thân: "…kể cả so sánh giữa nhiều xã hội (Segall…; Henrich…)"). Chữ mới: "Vững chắc: ảo giác Müller-Lyer tồn tại và đo được một cách ổn định"; thân dẫn tổng quan định lượng 18 nghiên cứu của Bruno & Franz (2009) và Amir & Firestone (2026), bỏ viện dẫn so sánh liên văn hóa (nay đang tranh cãi). Lý do: nhãn Vững chắc cần tổng hợp; thu hẹp về Müller-Lyer, nơi có Bruno & Franz (median hiệu ứng lên phán đoán thị giác lớn hơn lên cầm nắm, gần như mọi hiệu ứng cầm nắm lớn hơn 0) và Amir & Firestone (tổng quan một thế kỷ, ảo giác thấy ở nhiều nhóm và loài). Ranh giới thước đo: Bruno & Franz không phải tổng hợp về mọi ảo giác hình học nên bỏ "các ảo giác hình học"; chủ repo duyệt nhãn.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/rev0000549", "https://doi.org/10.1073/pnas.0409314102" ]
    luot_2_ghi_chu: Không tìm được phân tích tổng hợp riêng; nhưng sự tồn tại và đo được của ảo giác không bị tranh cãi. Thước đo mục 4 áp cho nhãn này hơi lỏng.
