    cau: Ngay cả khi đã đo bằng thước và biết chắc hai đoạn bằng nhau, nhìn lại ta thường vẫn thấy chúng khác nhau; kiến thức thường không "sửa" ngay được cảm giác.
    loai: phat-hien
    nguon:
