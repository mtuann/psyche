    ghi_chu: 'Chữ cũ: "Người Mỹ và châu Âu…", "15 xã hội được đo bằng cùng một bộ hình vẽ" (chi tiết "cùng một bộ hình" không mở được); đã sửa theo n14, n12. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: "Nghiên cứu của … phát hiện điều gì…?"; giải thích: "…cho thấy đây là vấn đề môi trường học được, không phải mắt tốt hay kém." Chữ mới: "…báo cáo điều gì…?"; giải thích nói đây là kết quả báo cáo, các tác giả giải thích bằng môi trường sống, và phân tích lại gần đây cho rằng bằng chứng không nhất quán. Lý do: lượt 2 chưa chắc (xếp hạng từng nhóm). Đã mở lại: Henrich 2010 (sinh viên Mỹ, nhóm gốc Âu ở Johannesburg; San không bị) và Amir & Firestone 2026 xác nhận; chỉ phần diễn giải "môi trường học được" quá mạnh.'
