    trich: its prominent role as Fodor's indisputable example of "cognitive impenetrability"
    vi_tri: 'Henrich 2010, mục Müller-Lyer; Wikipedia (Day: "you don''t change the perception of illusions very much with experience")'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Kiến thức không ''sửa'' được cảm giác. Điều đó gợi ý rằng phần xử lý này diễn ra trước khi lý trí kịp can thiệp — và nó tuân theo những ''mẹo'' mà não đã học". Chữ mới: "thường", bỏ phần suy diễn về thứ tự xử lý, chỉ nói ảo giác từng được nêu làm ví dụ về xử lý ít chịu ảnh hưởng của niềm tin. Lý do: van der Kamp 2013 thấy sai lệch với hình Judd có thể thay đổi sau luyện tập có phản hồi; "kiến thức" khác "luyện tập có phản hồi" nhưng nguồn không cho phép nói chắc. Review (Claude Sonnet 5.5, 10/11/2026): dung. Fodor (1983, tr. 66), trích trong Amir & Firestone 2026: người đã thấy hai đoạn được đo bằng nhau vẫn thấy đoạn này dài hơn đoạn kia. Chữ trang đã mềm ("thường").'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC12414450/" ]
    luot_2_ghi_chu: Ảo giác không do mắt kém; khác nhau theo tuổi nên 'ai cũng như nhau' sai. Phần 'biết rồi vẫn thấy' là tính chất kinh điển (không thể hóa được bằng kiến thức), không mở nguồn riêng.
