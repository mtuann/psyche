    vi_tri: Henrich 2010, mục Müller-Lyer, Hình 2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "người phương Tây dễ bị ''lừa'' hơn nhiều nền văn hóa khác" (nói chung cho mọi ảo giác, trong khi ảo giác ngang–dọc đảo chiều). Chữ mới chỉ nói Müller-Lyer. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: "…và phát hiện rằng người phương Tây dễ bị ảo giác Müller-Lyer hơn nhiều nền văn hóa khác." Chữ mới: "…và nghiên cứu kinh điển cho rằng người phương Tây dễ bị ảo giác Müller-Lyer hơn nhiều nền văn hóa khác, một kết luận nay đang bị phản biện." Lý do: Amir & Firestone (Psychol Rev 2026) xem lại dữ liệu và thấy bằng chứng về khác biệt văn hóa không nhất quán; mô tả không được nói như phát hiện chắc.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1126/science.139.3556.769" ]
    luot_2_ghi_chu: "Số xã hội (15), năm, tạp chí đúng; Henrich 2010 mở đầu bằng Müller-Lyer; van der Kamp 2013: Atten Percept Psychophys 75(5), 1027–1038 (Crossref khớp, nhưng bài về ảo giác Judd)."
    review: sai
