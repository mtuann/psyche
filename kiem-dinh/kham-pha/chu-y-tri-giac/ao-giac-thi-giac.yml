      - segall1963
      - vdk2013
      - henrich2010
    ket_qua: da-sua
    ghi_chu: 'G1 #1: nhãn cũ Vững chắc, đã hạ Khá vững và thêm giới hạn (áp dụng trong theo G1-L03 (22/10/2026)). Đối chiếu van der Kamp 2013: "There is a long, but controversial, tradition of research that has (purportedly) demonstrated that individuals from different cultures vary in their susceptibility to illusory drawings". Review (Claude Sonnet 5.5, 10/11/2026): sai. Chữ cũ: nhãn Khá vững, "mức độ bị ảo giác khác nhau rõ rệt giữa các nền văn hóa". Chữ mới: nhãn Đang tranh cãi, "mức độ bị ảo giác Müller-Lyer có khác nhau theo nền văn hóa hay không, và vì sao". Lý do: lượt 2 đúng; Amir & Firestone (Psychol Rev 2026, đọc toàn văn) cho rằng bằng chứng về biến thiên văn hóa không nhất quán (Rivers 1905 trái chiều, dữ liệu Segall tự mâu thuẫn, loại dữ liệu); đạt thước đo "bằng chứng chất lượng cao mâu thuẫn nhau". Chưa có tái lập lớn nên không viết "đã bị bác bỏ".'
    luot_2: qua-manh
    luot_2_nguon: [ "https://doi.org/10.1037/rev0000549", "https://doi.org/10.1126/science.139.3556.769" ]
    luot_2_ghi_chu: "câu đúng: Đang tranh cãi: các nghiên cứu kinh điển (Segall và cộng sự) báo cáo khác biệt giữa các nền văn hóa, nhưng phân tích lại năm 2026 cho rằng bằng chứng đó không nhất quán và còn nghi vấn phương pháp.; Nhãn 'Khá vững' cao hơn thước đo: dữ liệu chủ yếu từ các nghiên cứu những năm 1960, chưa có tái lập lớn có đăng ký trước, và có tổng quan phản biện mạnh."
