  - id: n32
    cau: 'Khung "Đang tranh cãi": nguyên nhân của hiệu ứng Flynn là gì (bốn họ giải thích: giáo dục, dinh dưỡng–sức khỏe, môi trường nhận thức, quen với bài kiểm tra).'
    loai: nhan
    nhan: tranh-cai
    co_so:
      - pietschnig2015
      - neisser1997
      - dickens2001
    ly_do: 'Neisser 1997 nêu các nhóm giả thuyết (quen bài kiểm tra, sức khỏe và dinh dưỡng, giáo dục, nuôi dạy, văn hóa); Pietschnig 2015 xét nhiều nhóm yếu tố; Dickens & Flynn 2001 đề xuất bội số xã hội. Mọi nguồn đồng ý nguyên nhân là môi trường ("far too rapid to result from genetic changes") nhưng không có đồng thuận yếu tố nào chính: tranh cãi.'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Hầu hết đồng ý nguyên nhân là môi trường (không phải di truyền)". Giữ (Neisser 1997: "These gains are far too rapid to result from genetic changes"); thêm nguồn. Review (Claude Opus 5.5, 09/11/2026): Các nguồn đồng ý nguyên nhân là môi trường nhưng không thống nhất yếu tố chính; Dickens & Flynn tự nói chưa chứng minh được tác nhân nào: Đang tranh cãi hợp.'
    luot_2: dung
