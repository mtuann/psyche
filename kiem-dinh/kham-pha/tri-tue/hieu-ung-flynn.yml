    ly_do: 'Pietschnig & Voracek 2015: 0,41 so với 0,21 điểm mỗi năm (lưu động so với kết tinh); Flynn 1987 và Neisser 1997 cùng chiều. Chi tiết nhạy cảm với cách phân loại bài và mẫu: chưa có tổng hợp thứ hai, nên khá vững.'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "tăng mạnh nhất" (trên trang giữ); Flynn 1987 viết "một số mức tăng lớn nhất"; trang ở thân bài đã làm mềm, khung giữ ý của Pietschnig (fluid cao nhất trong bốn nhóm). Review (Claude Opus 5.5, 09/11/2026): Một phân tích tổng hợp (Pietschnig 2015) cùng Flynn 1987, Neisser 1997 cùng chiều; độ lớn theo lĩnh vực nhạy với cách phân loại bài: Khá vững hợp.'
