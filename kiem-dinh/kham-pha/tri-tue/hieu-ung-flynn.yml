    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4152423/" ]
    luot_2_ghi_chu: 30 năm × 0,3 ≈ 9 điểm, nên 'khoảng 91' đúng phép tính.
