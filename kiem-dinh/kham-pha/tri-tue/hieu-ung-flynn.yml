    loai: dinh-nghia
    nguon:
      - teasdale2005
      - pietschnig2015
    trich: The phenomenon, now termed the Flynn Effect
    vi_tri: Teasdale & Owen 2005, tóm tắt
    ket_qua: dung
    ghi_chu: Đã mở toàn văn.
    luot_2: dung
