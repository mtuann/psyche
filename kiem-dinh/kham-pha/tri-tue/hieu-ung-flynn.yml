    cau: 'Pietschnig và Voracek (2015) là một phân tích tổng hợp lớn về hiệu ứng Flynn, công bố sau phân tích tổng hợp của Trahan và cộng sự (2014): 271 mẫu độc lập, gần 4 triệu người, 31 quốc gia, giai đoạn 1909–2013.'
