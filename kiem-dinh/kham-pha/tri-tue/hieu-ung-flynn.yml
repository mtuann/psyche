    trich: The remaining variation ( 1 - h 2) is associated with environmental differences | produces a multiplier effect
    vi_tri: Neisser 1996, mục Genetics; Dickens & Flynn 2001
    ket_qua: dung
    ghi_chu: Cùng nội dung với nhận định Dickens & Flynn; "tính di truyền của IQ rất thấp" là phương án nhiễu.
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf", "https://gwern.net/doc/iq/2001-dickens.pdf" ]
  - id: n58
    cau: 'Quiz 4: Bratsberg và Rogeberg (2018) thấy mức giảm điểm xuất hiện ngay cả giữa các anh em trai cùng nhà, loại trừ các giải thích dựa trên khác biệt giữa các gia đình (sinh sản kém ưu thế, nhập cư), cho thấy nguyên nhân là môi trường; so sánh trong gia đình là thiết kế chính.'
    loai: phat-hien
    nguon:
      - bratsberg2018
    trich: we show that the observed Flynn effect, its turning point, and subsequent decline can all be fully recovered from within-family variation
    vi_tri: Bratsberg & Rogeberg 2018, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (đáp án đúng): "loại trừ các giải thích di truyền và nhập cư"; đã sửa như thân bài. Giải thích "anh em cùng nhà chia sẻ phần lớn gene và hoàn cảnh gia đình" là mô tả chung về anh em ruột (suy luận hợp lý). Review (Claude Opus 5.5, 09/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6042097/" ]
    review: dung
  - id: n59
    cau: 'Quiz 5: điểm kiểm tra tăng không đồng nghĩa con người thông minh hơn theo mọi nghĩa vì mức tăng lớn nhất ở suy luận trừu tượng dạng bài kiểm tra (Raven), bài gần kiến thức học ở trường tăng ít nhất; Flynn đề nghị gọi điều bài IQ đo là "khả năng giải quyết vấn đề trừu tượng".'
    loai: phat-hien
    nguon:
      - neisser1997
      - flynn1987
    trich: IQ tests measure abstract problem-solving ability (APSA)
    vi_tri: Flynn 1987; Neisser 1997
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (đáp án đúng): "trong khi trí khôn ngoan, óc sáng tạo và khả năng xoay xở trong đời sống là những khía cạnh khác mà bài kiểm tra đo rất hạn chế" (không nguồn); đã thay như thân bài. Review (Claude Opus 5.5, 09/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/20161104214157/http://www.americanscientist.org/issues/feature/rising-scores-on-intelligence-tests/99999", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.101.2.171.pdf" ]
    review: dung
doi_chu:
  - cu: (trang cũ không có hộp tóm tắt đầu trang)
    moi: Hộp ::tom-tat tự dựng từ ý chính của bốn khung nhãn (bản mới thêm).
    ly_do: Hộp dựng từ ý chính; ý chính các khung giữ như bản cũ.
  - cu: '"Flynn — một nhà triết học và khoa học chính trị người New Zealand — đọc các cuốn sổ tay chấm điểm ..."; "mâu thuẫn với niềm tin phổ biến lúc bấy giờ rằng con người đang ngày càng ngu đi"; "được đặt tên theo ông"'
    moi: '"nhà nghiên cứu ở Đại học Otago ... so sánh điểm ... qua các lần chuẩn hóa"; "đi ngược giả thuyết trước đó rằng IQ ... giảm vì những người điểm thấp sinh nhiều con hơn"; "về sau được gọi là hiệu ứng Flynn"'
    ly_do: Toàn văn Flynn 1984; Bratsberg 2018; Teasdale 2005.
  - cu: '"trẻ Mỹ sinh năm 1932"; "gần một nửa rơi dưới 80"'
    moi: '"trẻ em Mỹ năm 1932"; (bỏ "gần một nửa")'
    ly_do: G1 mục 8; Neisser 1997.
  - cu: 'Flynn 1984: "2,91 điểm mỗi thập kỷ"; Flynn 1987: "Mức tăng khoảng 3 điểm/thập kỷ ở hầu hết các nước"; "21 điểm trong 30 năm"; "Jensen"; Trahan "2,93"; Daley "Nhật Bản, Hàn Quốc ... quy luật chung"; "nhóm quen thuộc với bài kiểm tra"'
    moi: '"13,8 điểm trong 46 năm ... khoảng 3 điểm"; "5 đến 25 điểm trong một thế hệ"; "hơn 20 điểm trong 30 năm"; (bỏ Jensen); "2,31 ... 2,93 với bản hiện đại"; "một vùng nông thôn Kenya"; "bài gần kiến thức học ở trường tăng ít nhất"'
    ly_do: Sửa theo G1 (22/10/2026), đã đối chiếu lại nguồn.
  - cu: 'Sundet: "đo lường nhất quán bằng cùng một bài kiểm tra"; Bratsberg: "cặp cha–con"; "loại trừ các giải thích di truyền hay do nhập cư"; Teasdale: "tăng từ thập niên 1950 đến giữa 1990, rồi chững lại và giảm"'
    moi: Hai bài giữ nguyên từ 1954, bài toán đổi dạng giữa 1990; "anh em trai"; "giải thích dựa trên khác biệt giữa các gia đình ... theo các tác giả"; "đạt đỉnh cuối thập niên 1990 rồi giảm vừa phải"
    ly_do: Toàn văn các bài.
  - cu: 'Khung Vững chắc: "một trong những phát hiện được tái lập tốt nhất trong tâm lý học ... ở cả nam lẫn nữ"; khung Đang tranh cãi: "Phần Lan", "Ở nhiều nước đang phát triển"'
    moi: '"một phát hiện được tái lập tốt ... cả trẻ em lẫn người lớn"; "Na Uy, Đan Mạch (và theo Pietschnig, cả Phần Lan)"; "Ở một số nơi khác, như vùng nông thôn Kenya"'
    ly_do: Bỏ xếp hạng và phạm vi không kiểm được.
  - cu: 'Lý thuyết: "nội dung học chuyển từ học thuộc lòng sang tư duy phân tích"; "ít phơi nhiễm chì"; "giải thích tốt nhất quỹ đạo chung"; "giải thích mà chính Flynn ưa thích ... cặp kính khoa học"; "áp lực thời gian và các dạng câu hỏi mẹo"'
    moi: '"đi học lâu hơn"; "những yếu tố đã được đề xuất ... Sundet"; "dường như là nguyên nhân chính"; "Dickens và Flynn (2001) lập luận ..."; "làm lại cùng một bài chỉ tăng 5–6 điểm (Neisser 1997)"'
    ly_do: Bỏ cụm không nguồn.
  - cu: 'Áp dụng 2: "trí khôn ngoan, óc sáng tạo, kiến thức thực tế ... tăng ít hơn nhiều, hoặc không được bài kiểm tra đo"; Áp dụng 3: "tức là có thể thay đổi được"; Việt Nam: "Với tốc độ mở rộng giáo dục và cải thiện dinh dưỡng"; "chưa tìm thấy ..."'
    moi: '"bài gần kiến thức học ở trường tăng ít nhất (Neisser 1997); Flynn đề nghị gọi ... khả năng giải quyết vấn đề trừu tượng"; "theo Bratsberg và Rogeberg ... từ đó có thể suy ra"; "Nếu giáo dục và dinh dưỡng cải thiện ..."; "Tính đến 11/2026, ..."'
    ly_do: Bỏ cụm không nguồn; câu thời sự.
  - cu: 'Ngộ nhận: "Thay đổi di truyền cần hàng nghìn năm"; "cho thấy có điều gì đó thực chất đã thay đổi"; "các nghiên cứu còn tranh luận ... g"; "ở nhiều nơi khác, điểm vẫn đang tăng"; quiz 4 và 5 (đáp án đúng cũ)'
    moi: '"Vốn gen ... khó thay đổi đáng kể trong vài thập niên (Neisser 1997)"; "gợi ý rằng không chỉ là kỹ năng làm bài"; "dường như không nằm ở g (Pietschnig 2015)"; "ở một số nơi khác"; quiz 4 và 5 viết như thân bài'
    ly_do: Làm mềm theo nguồn.
  - cu: '"Phân tích tổng hợp chính thức đầu tiên về hiệu ứng Flynn: 271 mẫu độc lập"'
    moi: '"Một phân tích tổng hợp lớn về hiệu ứng Flynn, công bố sau phân tích tổng hợp của Trahan và cộng sự (2014): 271 mẫu độc lập"'
    ly_do: "Review: xem ghi_chu n20."
  - cu: '"Dickens và Flynn (2001) lập luận rằng công nghiệp hóa, ... — đúng kiểu tư duy mà bài Raven đo lường. Cách hiểu này nhấn mạnh thói quen tư duy thay đổi chứ không phải não bộ "tốt hơn"."'
    moi: '"Dickens và Flynn (2001) gợi ý vài yếu tố có thể đã khởi động hiệu ứng: ... Chính họ nói rõ chưa chứng minh được yếu tố nào trong số này thật sự góp phần."'
    ly_do: "Review: xem ghi_chu n39."
