  - id: n39
    cau: Dickens và Flynn (2001) gợi ý vài yếu tố có thể đã khởi động hiệu ứng (công nghiệp hóa làm công việc phức tạp hơn, nhiều thời gian rảnh hơn cho đọc sách và trò chơi trí tuệ, máy móc đòi hỏi nhận thức nhiều hơn, gia đình ít con hơn); theo họ, những thay đổi này có thể khiến thế hệ sau coi trọng việc giải quyết vấn đề trừu tượng hơn hẳn thế hệ trước, rồi được hiệu ứng bội số khuếch đại; họ nói rõ chưa chứng minh được yếu tố nào thật sự góp phần.
    loai: phat-hien
    nguon:
      - dickens2001
    trich: "We can suggest several possible triggers ... However, we want to emphasize that we cannot, at present, show that any of the specific triggers we suggest have actually contributed to IQ gains over time | Thanks to industrialization, it is likely that the cognitive complexity of the average person's job has increased over the last century. ... Increased leisure time is another possible trigger ... the machinery we increasingly surround ourselves with ... have increased the demands on our cognitive capacities. The shift to fewer children in each family ... may have played a role. Some or all of these may have contributed to a significant attitude shift: The current generation may take abstract problem solving far more seriously than preceding generations did. | once whatever triggers the process gets it going, the individual and social multipliers begin their work"
    vi_tri: Dickens & Flynn 2001, tr. 352 (cuối mục mô hình, trước "Three Formal Models")
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đây là giải thích mà chính Flynn ưa thích: ... Flynn gọi đó là việc đeo ''cặp kính khoa học''". "Cặp kính khoa học" không kiểm được trong nguồn đã mở (là lời của Flynn 2007, sách chưa đọc), và "Flynn ưa thích" không nguồn; đã bỏ. "Đúng kiểu tư duy mà bài Raven đo" là diễn giải nhẹ (Flynn 1987 gọi là khả năng giải quyết vấn đề trừu tượng). Review (Claude Opus 5.5, 09/11/2026): Lượt 2 đúng. Đã mở toàn văn (gwern.net): Dickens & Flynn chỉ nêu các "tác nhân khởi động có thể có" và tự nói chưa chứng minh được; "đúng kiểu tư duy mà bài Raven đo" và "thói quen tư duy chứ không phải não bộ tốt hơn" không có trong bài (gần nhất là "attitude shift: ... take abstract problem solving far more seriously"). Chữ cũ: "Dickens và Flynn (2001) lập luận rằng công nghiệp hóa, công nghệ và nghề nghiệp ngày càng đòi hỏi nhiều hơn ở nhận thức, và con người tự chọn hay được đặt vào những môi trường đòi hỏi hơn — đúng kiểu tư duy mà bài Raven đo lường. Cách hiểu này nhấn mạnh thói quen tư duy thay đổi chứ không phải não bộ "tốt hơn"." Chữ mới: "Dickens và Flynn (2001) gợi ý vài yếu tố có thể đã khởi động hiệu ứng: ... Theo họ, những thay đổi này có thể khiến thế hệ sau coi trọng việc giải quyết vấn đề trừu tượng hơn hẳn thế hệ trước, rồi được hiệu ứng bội số khuếch đại. Chính họ nói rõ chưa chứng minh được yếu tố nào trong số này thật sự góp phần." Tiêu đề gạch đầu dòng giữ.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://gwern.net/doc/iq/2001-dickens.pdf" ]
    luot_2_ghi_chu: "câu đúng: Dickens và Flynn (2001) gợi ý (và nói rõ chưa chứng minh được) rằng công nghiệp hóa, nghề nghiệp và công nghệ đòi hỏi nhận thức nhiều hơn có thể là yếu tố khởi phát, rồi được hiệu ứng bội số khuếch đại; về sau Flynn hiểu hiệu ứng này là thói quen tư duy trừu tượng thay đổi chứ không phải não bộ \"tốt hơn\".; Dickens & Flynn 2001 chỉ nêu công nghiệp hóa, nghề phức tạp hơn, công nghệ là các 'yếu tố khởi phát có thể', tự nói chưa chứng minh được; ý 'đúng kiểu tư duy Raven đo' và 'thói quen tư duy chứ không phải não tốt hơn' không có trong bài (là ý của Flynn ở các sách sau)."
    review: sai
