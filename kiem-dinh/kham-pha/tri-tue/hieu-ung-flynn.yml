  - id: n1
    cau: Ulric Neisser (1997) từng đứng đầu nhóm chuyên gia của Hiệp hội Tâm lý Hoa Kỳ về vấn đề trí thông minh.
    loai: lich-su
    nguon:
      - neisser1996
    trich: Ulric Neisser (Chair)
    vi_tri: Neisser và cộng sự 1996, trang tiêu đề (báo cáo của nhóm APA)
    ket_qua: dung
    ghi_chu: 'theo G1-L01 (22/10/2026). Đã mở toàn văn báo cáo APA: Neisser là chủ tịch (Chair) của nhóm.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf" ]
    luot_2_ghi_chu: Nhóm chuyên gia của APA, báo cáo 1996; năm 1997 là năm bài American Scientist.
  - id: n2
    cau: Nếu chấm trẻ em Mỹ năm 1932 theo chuẩn của năm 1997, điểm trung bình của chúng chỉ khoảng 80.
    loai: so-lieu
    nguon:
      - neisser1997
    trich: Judging the American children of 1932 by today's standards—considering the scores they would have obtained if they had somehow taken a test normalized this year—we find that their average IQ would have been only about 80!
    vi_tri: Neisser 1997, trang 4 của bản lưu
    ket_qua: da-sua
    ghi_chu: 'theo G1-L01 (22/10/2026). Chữ cũ (G1, mục 8): "trẻ Mỹ sinh năm 1932 cho làm bài kiểm tra chuẩn hóa năm 1997". Neisser nói về trẻ em Mỹ năm 1932; đã sửa. Vế "gần một nửa rơi dưới 80" (không có trong nguồn) đã bỏ. Review (Claude Opus 5.5, 09/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/20161104214157/http://www.americanscientist.org/issues/feature/rising-scores-on-intelligence-tests/99999" ]
    review: dung
  - id: n3
    cau: Gần như không em nào năm 1932 đạt mức "rất xuất sắc", còn gần một phần tư sẽ bị xếp loại "kém" (IQ dưới 70).
    loai: so-lieu
    nguon:
      - neisser1997
    trich: Hardly any of them would have scored "very superior," but nearly one-quarter would have appeared to be "deficient." | those with scores under 70 as "intellectually deficient"
    vi_tri: Neisser 1997, trang 4
    ket_qua: dung
    ghi_chu: theo G1-L01 (22/10/2026). Đã mở lại bản lưu; "dưới 70" theo định nghĩa của chính bài.
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/20161104214157/http://www.americanscientist.org/issues/feature/rising-scores-on-intelligence-tests/99999" ]
    luot_2_ghi_chu: Neisser định nghĩa 'intellectually deficient' là dưới 70.
  - id: n4
    cau: 'Suốt thế kỷ 20, điểm IQ trung bình ở hàng chục quốc gia tăng đều đặn khoảng 3 điểm mỗi thập kỷ: mỗi thế hệ làm cùng một bài đạt điểm cao hơn thế hệ trước.'
    loai: so-lieu
    nguon:
      - neisser1997
      - pietschnig2015
    trich: The rate of gain on standard broad-spectrum IQ tests amounts to three IQ points per decade | IQ gains across more than one century (1909–2013), based on 271 independent samples ... from 31 countries ... 0.28 [full-scale]
    vi_tri: Neisser 1997, trang 1; Pietschnig & Voracek 2015
    ket_qua: dung
    ghi_chu: 'theo G1-L01 (22/10/2026). "Hàng chục quốc gia": 31 nước (Pietschnig).'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/20161104214157/http://www.americanscientist.org/issues/feature/rising-scores-on-intelligence-tests/99999", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf" ]
    luot_2_ghi_chu: Pietschnig & Voracek 2015 thấy mức tăng không tuyến tính (nhanh, chậm xen kẽ); 'đều đặn' theo Neisser 1997, chấp nhận được ở mức tóm lược.
