    cau: 'Vì điểm trung bình tăng khoảng 3 điểm mỗi thập kỷ, bài kiểm tra dùng chuẩn cũ làm điểm số bị thổi phồng: IQ 100 theo chuẩn năm 1980 có thể chỉ tương đương khoảng 91 theo chuẩn năm 2010; vì vậy các bài kiểm tra uy tín phải chuẩn hóa lại định kỳ.'
