    ly_do: 'Hai phân tích tổng hợp về mức tăng và nhận xét của Sundet 2004 về chuẩn hóa lại; nhãn cho nguyên tắc phương pháp (chuẩn hóa lại định kỳ) xét theo đồng thuận của người dùng test (Sundet 2004: "has long been known"), ghi rõ theo chuẩn kiểm định.'
