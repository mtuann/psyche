    vi_tri: Dickens & Flynn 2001, phần mở đầu
    ket_qua: dung
    ghi_chu: Đã mở toàn văn. "Không cần thay đổi gene" là hệ quả của mô hình (môi trường mới phải mạnh và nhất quán).
