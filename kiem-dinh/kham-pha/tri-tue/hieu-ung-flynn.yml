    ghi_chu: 'Chữ cũ: "hiện tượng này được đặt tên theo ông". Nguồn chỉ nói về sau được gọi là hiệu ứng Flynn (không nói ai đặt tên); đã viết lại. Review (Claude Opus 5.5, 09/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn.'
