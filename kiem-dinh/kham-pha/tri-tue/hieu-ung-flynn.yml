    cau: 'Dickens và Flynn (2001) giải thích nghịch lý IQ có tính di truyền cao nhưng điểm trung bình của quần thể tăng nhanh bằng mô hình bội số xã hội: lợi thế ban đầu nhỏ làm đứa trẻ tự chọn và được đặt vào môi trường nhận thức phong phú hơn, môi trường đó khuếch đại lợi thế, nên thay đổi môi trường nhỏ có thể được nhân lên ở cấp quần thể.'
