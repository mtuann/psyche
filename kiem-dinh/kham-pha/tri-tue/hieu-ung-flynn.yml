    cau: 'Khung "Vững chắc": điểm kiểm tra IQ tăng khoảng 3 điểm mỗi thập kỷ suốt thế kỷ 20.'
    loai: nhan
    nhan: vung-chac
    co_so:
      - pietschnig2015
      - trahan2014
      - flynn1984
      - flynn1987
    ly_do: 'Hai phân tích tổng hợp độc lập cùng chiều: Trahan 2014 (285 nghiên cứu, 2,31 điểm mỗi thập kỷ, 2,93 với các bản hiện đại) và Pietschnig & Voracek 2015 (271 mẫu, gần 4 triệu người, 31 nước, 2,8 điểm mỗi thập kỷ); hai nghiên cứu của Flynn (1984, 1987) mở đầu. Thước đo mục 4: có tổng hợp chất lượng tốt, cùng chiều, ở nhiều quần thể; giới hạn: mức tăng giảm dần gần đây (nêu ở khung khác).'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đây là một trong những phát hiện được tái lập tốt nhất trong tâm lý học — ... ở cả nam lẫn nữ, cả trẻ em lẫn người lớn". Bỏ "một trong những ... tốt nhất" (xếp hạng không kiểm được) và "ở cả nam lẫn nữ" (chưa kiểm). Review (Claude Opus 5.5, 09/11/2026): Đạt Vững chắc: hai phân tích tổng hợp độc lập cùng chiều (Trahan 2014, tóm tắt OpenAlex: 2,31 điểm mỗi thập kỷ trên 285 nghiên cứu, 2,93 với 53 phép so sánh bản hiện đại, "robustness across different age groups, measures, samples"; Pietschnig 2015: 2,8), nhiều nước. "Khoảng 3" nằm trong khoảng.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1177%252F1461444812470428.zip/10.1177%252F1745691615577701.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4152423/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf" ]
