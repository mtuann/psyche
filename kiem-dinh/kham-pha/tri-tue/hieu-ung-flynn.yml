  - id: n6
    cau: Năm 1984, James R. Flynn, nhà nghiên cứu ở Đại học Otago (New Zealand), so sánh điểm của người Mỹ trên cùng các bài kiểm tra IQ qua các lần chuẩn hóa khác nhau và phát hiện điểm tăng theo thời gian.
    loai: lich-su
    nguon:
      - flynn1984
    trich: University of Otago, Dunedin, New Zealand | every Stanford-Binet and Wechsler standardization sample from 1932 to 1978 established norms of a higher standard than its predecessor
    vi_tri: Flynn 1984, trang tiêu đề và tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Flynn — một nhà triết học và khoa học chính trị người New Zealand — đọc các cuốn sổ tay chấm điểm của những bài kiểm tra IQ phổ biến và phát hiện ... điểm thô tăng". "Nhà triết học và khoa học chính trị" và "đọc sổ tay chấm điểm" không kiểm được trong nguồn (bài ghi Otago, Department of Political Studies ở trang tiêu đề; phương pháp là so các mẫu chuẩn hóa); đã sửa. Review (Claude Opus 5.5, 09/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.95.1.29.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf" ]
    luot_2_ghi_chu: "Neisser 1996: nhiều nhà đo lường đã thấy điểm tăng trước đó, Flynn là người đầu tiên mô tả có hệ thống; chữ 'phát hiện' nên hiểu theo nghĩa ấy."
    review: dung
  - id: n7
    cau: Cùng một loại bài kiểm tra, người làm bài vào thập niên 1970 đạt điểm cao hơn hẳn so với chuẩn của thập niên 1930.
    loai: phat-hien
    nguon:
      - flynn1984
    trich: every Stanford-Binet and Wechsler standardization sample from 1932 to 1978 established norms of a higher standard than its predecessor
    vi_tri: Flynn 1984, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Cùng một bài kiểm tra, cùng cách chấm, ... người làm bài vào thập niên 1970 đạt điểm cao hơn hẳn người làm bài vào thập niên 1930". Các lần chuẩn hóa dùng các phiên bản khác nhau; đã viết "so với chuẩn của thập niên 1930". Review (Claude Opus 5.5, 09/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.95.1.29.pdf" ]
    review: dung
  - id: n8
    cau: Điều này đi ngược giả thuyết trước đó rằng IQ của dân số đang giảm vì những người điểm thấp sinh nhiều con hơn.
    loai: lich-su
    nguon:
      - bratsberg2018
    trich: The increase seemingly contradicted the earlier hypothesis that IQs were declining due to an inverse correlation between IQ and fertility—so-called dysgenic fertility
    vi_tri: Bratsberg & Rogeberg 2018, mở đầu
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "mâu thuẫn với niềm tin phổ biến lúc bấy giờ rằng con người đang ngày càng ngu đi". "Niềm tin phổ biến" không có nguồn; đã thay bằng giả thuyết có tên (sinh sản kém ưu thế) theo Bratsberg & Rogeberg (2018). Review (Claude Opus 5.5, 09/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://gwern.net/doc/genetics/selection/1937-cattell-thefightforournationalintelligence.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.101.2.171.pdf" ]
    luot_2_ghi_chu: Flynn 1987 dùng cả dữ liệu Leicester 1936–1949 của chính Cattell cho thấy điểm tăng.
    review: dung
