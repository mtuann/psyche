    ly_do: 'Dữ liệu quân dịch Na Uy (Sundet 2004: dừng từ giữa thập niên 1990), Đan Mạch (Teasdale 2005: đỉnh cuối thập niên 1990 rồi giảm), Phần Lan (nêu trong Pietschnig 2015); Bratsberg 2018 cho thấy sự giảm ở Na Uy do môi trường. Nhưng phạm vi (chủ yếu vài nước phát triển) và tính lâu dài chưa rõ; phân tích tổng hợp thấy mức tăng giảm dần chứ chưa đảo chiều: tranh cãi.'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Na Uy, Đan Mạch, Phần Lan và một số nước châu Âu"; "Ở nhiều nước đang phát triển, điểm kiểm tra vẫn đang tăng" (không nguồn). Đã sửa: "Na Uy, Đan Mạch (và theo Pietschnig, cả Phần Lan)"; "Ở một số nơi khác, như vùng nông thôn Kenya". Review (Claude Opus 5.5, 09/11/2026): Dữ liệu Na Uy, Đan Mạch; Bratsberg 2018 cho thấy sự giảm do môi trường; Trahan 2014 không thấy hiệu ứng giảm dần còn Pietschnig 2015 thấy: bằng chứng chất lượng cao chưa thống nhất, Đang tranh cãi hợp.'
