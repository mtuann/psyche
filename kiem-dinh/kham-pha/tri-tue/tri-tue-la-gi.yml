    vi_tri: Neisser và cộng sự 1996; Hartshorne & Germine 2015
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ngày nay hầu hết các nhà nghiên cứu chấp nhận một mô hình phân tầng". Đã làm mềm thành "một quan điểm phổ biến" (Neisser 1996: "one common view today").'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf" ]
    luot_2_ghi_chu: "'Nổi tiếng nhất' là nhận xét, chấp nhận được."
  - id: n35
    cau: Theo một nghiên cứu lớn (gần 50 nghìn người làm bài trực tuyến cùng dữ liệu chuẩn hóa của các bài test), các năng lực kiểu "lỏng" đạt đỉnh sớm ở tuổi trưởng thành, các năng lực kiểu "kết tinh" như từ vựng đạt đỉnh muộn hơn ở tuổi trung niên, nhưng thời điểm đạt đỉnh khác nhau khá nhiều giữa từng năng lực.
