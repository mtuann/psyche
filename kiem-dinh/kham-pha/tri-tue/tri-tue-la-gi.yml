    ghi_chu: 'Chữ cũ: "các cơ chế (positive manifold, tương tác gen–môi trường) nhiều khả năng cũng đúng, vì chúng đã được tái hiện ở rất nhiều quần thể". Tương tác gen–môi trường không lặp lại nhất quán (Hanscombe 2012), nên bỏ; giữ positive manifold. Đây là suy luận (nêu rõ "nhiều khả năng") dựa trên nguồn.'
