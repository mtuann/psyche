nhan_dinh:
  - id: n1
    cau: IQ đo một khía cạnh của trí thông minh (khả năng nhận thức trừu tượng như lý luận, trí nhớ, tốc độ xử lý); sự tháo vát, khả năng thuyết phục, óc sáng tạo, sự kiên trì nằm ngoài những gì bài test IQ đo.
    loai: dinh-nghia
    nguon:
      - neisser1996
      - pearson-wais
    trich: Other individual characteristics--interpersonal skills, aspects of personality, etc.--are probably of equal or greater importance, but at this point we do not have equally reliable instruments to measure them. | verbal comprehension, perceptual reasoning, working memory, and processing speed
    vi_tri: Neisser và cộng sự 1996, mục Job performance; Pearson, trang WAIS-IV
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Sự tháo vát của Bình, khả năng thuyết phục, óc sáng tạo, sự kiên trì — tất cả nằm ngoài những gì bài test IQ đo". Ví dụ An và Bình là giả định (gia-dinh). "Sáng tạo" liên hệ yếu với IQ (r = .17, Strenze 2015) chứ không "nằm ngoài" hoàn toàn: đã giữ câu chung ("khía cạnh") và để chi tiết ở mục Strenze.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf", "https://web.archive.org/web/20161104214157/http://www.americanscientist.org/issues/feature/rising-scores-on-intelligence-tests/99999" ]
    luot_2_ghi_chu: Neisser 1996 nêu sáng tạo, óc thực tế, nhạy cảm xã hội nằm ngoài bài test và kiên trì là đặc điểm khác trí tuệ; 'tháo vát', 'thuyết phục' không có nguyên văn nhưng cùng tinh thần (practical sense, social sensitivity).
  - id: n2
    cau: Năm 1904, Charles Spearman thấy khi so điểm các môn học (cổ ngữ, tiếng Pháp, tiếng Anh, toán) với khả năng phân biệt âm thanh, ánh sáng, trọng lượng và năng khiếu âm nhạc của học sinh, các cặp phép đo tương quan dương với nhau.
    loai: phat-hien
    nguon:
      - spearman1904
      - neisser1997
    trich: 'In view of this community being discovered between such diverse functions as in-school Cleverness, out-of-school Common Sense, Sensory Discrimination, and Musical Talent... | Discrimination correlates with Talent in the four branches of study, Classics, French, English, and Mathematics, by an average of 0.51 | the British psychologist Charles Spearman | The whole thus forms a perfectly constant Hierarchy in the following order: Classics, French, English, and Mathematics.'
    vi_tri: Spearman 1904, các mục III–V (psychclassics, chap1)
    ket_qua: da-sua
    ghi_chu: 'theo G1-L01 (22/10/2026). Chữ cũ (G1, mục 1): "toán, ngôn ngữ, trí nhớ, phân loại hình ảnh". Spearman không dùng bài trí nhớ hay phân loại hình ảnh. Chữ trên trang hiện khớp đề xuất của G1; đã đối chiếu lại toàn văn. Quốc tịch "người Anh" của Spearman: Neisser 1997 ("the British psychologist Charles Spearman").'
    luot_2: dung
    luot_2_nguon: [ "http://psychclassics.yorku.ca/Spearman/chap5.htm" ]
    luot_2_ghi_chu: Phân biệt ánh sáng, trọng lượng ở các loạt thí nghiệm đầu; âm thanh (pitch), môn học và năng khiếu âm nhạc ở loạt IV; mọi tương quan báo cáo đều dương.
  - id: n3
    cau: Về sau, hiện tượng các bài kiểm tra nhận thức tương quan dương với nhau được gọi là positive manifold (đa tạp dương).
    loai: dinh-nghia
    nguon:
      - neisser1996
      - spearman1904
    trich: all such correlations are typically positive and form what is called a "positive manifold." Spearman (1927) showed that in any such manifold, some portion of the variance of scores on each test can be mathematically attributed to a "general factor," or g.
    vi_tri: Neisser và cộng sự 1996, mục Intelligence tests (Spearman 1904 không có từ "manifold")
    ket_qua: da-sua
    ghi_chu: 'theo G1-L01 (22/10/2026). Chữ cũ (G1, mục 2): "Ông gọi hiện tượng này là positive manifold". Từ "manifold" không có trong toàn văn Spearman (1904); chữ trên trang hiện: "Về sau, ... được gọi là". Thuật ngữ do Neisser và cộng sự (1996) dùng (không gán cho Spearman 1904).'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf" ]
  - id: n4
    cau: Spearman đề xuất rằng đằng sau mọi hoạt động trí tuệ có một chức năng chung (về sau gọi là g) cộng với các yếu tố riêng của từng hoạt động (về sau gọi là s); cách giải thích này về sau gọi là thuyết hai nhân tố.
    loai: lich-su
    nguon:
      - spearman1904
      - neisser1996
    trich: all branches of intellectual activity have in common one fundamental function ( or group of functions ), whereas the remaining or specific elements of the activity seem in every case to be wholly different from that in all the others | Some theorists (e.g., Spearman, 1927) have emphasized the importance of a general factor, g
    vi_tri: Spearman 1904, mục kết luận IV; Neisser và cộng sự 1996
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Spearman đề xuất thuyết hai nhân tố: ... yếu tố chung g ... yếu tố riêng s". Ký hiệu g và tên "thuyết hai nhân tố" là cách gọi về sau (Spearman 1927); bài 1904 nói "một chức năng nền chung" cộng "các yếu tố riêng". Đã viết lại cho đúng.'
    luot_2: dung
    luot_2_nguon: [ "http://psychclassics.yorku.ca/Spearman/chap5.htm", "https://web.archive.org/web/20161104214157/http://www.americanscientist.org/issues/feature/rising-scores-on-intelligence-tests/99999" ]
    luot_2_ghi_chu: "Ký hiệu g, s và tên 'thuyết hai nhân tố' có sau 1904 (Neisser 1997: 'Spearman christened it g')."
  - id: n5
    cau: Điểm toán của An cao một phần vì g của An cao, một phần vì năng khiếu toán riêng (s) của An tốt.
    loai: phat-hien
    nguon:
      - neisser1996
    trich: the overall pattern of correlations can be roughly described as produced by individual differences in g plus differences in the specific abilities sampled by particular tests
    vi_tri: Neisser và cộng sự 1996
    ket_qua: dung
    ghi_chu: Ví dụ An là giả định (gia-dinh) minh họa mô hình g + s; mô hình có nguồn.
    luot_2: dung
    luot_2_nguon: [ "http://psychclassics.yorku.ca/Spearman/chap5.htm" ]
    luot_2_ghi_chu: Ví dụ minh họa đúng với mô hình chung + riêng của Spearman; không phải phát hiện thực nghiệm.
  - id: n6
    cau: IQ hiện đại là điểm số chuẩn hóa từ các bài kiểm tra, trung bình 100, độ lệch chuẩn 15.
    loai: dinh-nghia
    nguon:
      - neisser1996
    trich: By convention, overall intelligence test scores are usually converted to a scale in which the mean is 100 and the standard deviation is 15.
    vi_tri: Neisser và cộng sự 1996, mục Intelligence tests
    ket_qua: dung
    ghi_chu: Đã mở toàn văn.
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/20161104214157/http://www.americanscientist.org/issues/feature/rising-scores-on-intelligence-tests/99999" ]
  - id: n7
    cau: Khoảng 68% dân số nằm trong 85–115; IQ 130 thuộc nhóm cao nhất khoảng 2%.
    loai: so-lieu
    nguon:
      - neisser1996
      - neisser1997
    trich: Approximately 95% of the population has scores within two standard deviations of the mean, i.e., between 70 and 130. | In any normal distribution of scores with a mean of 100 and a standard deviation of 15, about 2.25 percent of the population can be expected to fall into each of those categories.
    vi_tri: Neisser và cộng sự 1996; Neisser 1997, trang 4 của bản lưu
    ket_qua: dung
    ghi_chu: 68% trong 85–115 là suy ra từ phân phối chuẩn (một độ lệch chuẩn); 2,25% theo Neisser 1997.
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/20161104214157/http://www.americanscientist.org/issues/feature/rising-scores-on-intelligence-tests/99999" ]
  - id: n8
    cau: 'IQ là thang thứ bậc, không phải thang tỉ lệ: IQ 130 không có nghĩa "thông minh gấp 1,3 lần" người IQ 100.'
    loai: dinh-nghia
    nguon:
      - neisser1996
    trich: By convention, overall intelligence test scores are usually converted to a scale in which the mean is 100 and the standard deviation is 15.
    vi_tri: Neisser và cộng sự 1996
    ket_qua: da-lam-mem
    ghi_chu: Điểm chuẩn hóa là vị trí so với nhóm chuẩn; câu "thang thứ bậc, không phải thang tỉ lệ" là diễn giải thống kê chuẩn; nguồn chỉ cung cấp quy ước thang. Đã giữ vì đúng định nghĩa; ghi lại cho review.
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/20161104214157/http://www.americanscientist.org/issues/feature/rising-scores-on-intelligence-tests/99999" ]
    luot_2_ghi_chu: Phần 'không phải thang tỉ lệ' chắc chắn đúng; IQ là thang thứ bậc hay khoảng thì giới đo lường còn bàn, nên có thể viết 'IQ cho biết thứ hạng tương đối, không phải thang tỉ lệ'.
  - id: n9
    cau: 'Thang Wechsler dành cho người lớn (WAIS) cho bốn chỉ số: hiểu ngôn ngữ, lý luận tri giác, trí nhớ làm việc, tốc độ xử lý.'
    loai: dinh-nghia
    nguon:
      - pearson-wais
    trich: verbal comprehension, perceptual reasoning, working memory, and processing speed
    vi_tri: Pearson, trang sản phẩm WAIS-IV
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "đo bốn nhóm năng lực". Thay "đo bốn nhóm năng lực" bằng "cho bốn chỉ số" (đúng tên của nhà phát hành); nguồn là trang nhà sản xuất đọc qua công cụ web (bậc 2, chưa đọc tài liệu kỹ thuật); ghi trong phần nguồn.'
    luot_2: sai
    luot_2_nguon: [ "https://www.pearsonassessments.com/content/dam/school/global/clinical/us/assets/wais-5/wais-5-overview-brochure.pdf" ]
    luot_2_ghi_chu: "câu đúng: Thang Wechsler dành cho người lớn bản thứ tư (WAIS-IV, 2008) cho bốn chỉ số: hiểu ngôn ngữ, lý luận tri giác, trí nhớ làm việc, tốc độ xử lý; bản thứ năm (WAIS-5, 2024) có năm chỉ số chính: hiểu ngôn ngữ, thị giác–không gian, lý luận lỏng, trí nhớ làm việc, tốc độ xử lý.; Bốn chỉ số là của WAIS-IV (2008). WAIS-5 (Pearson, chuẩn hóa 2023–2024) có năm chỉ số chính: lý luận tri giác tách thành thị giác–không gian và lý luận lỏng."
  - id: n10
    cau: Ma trận Raven (dạng bài điền hình còn thiếu vào dãy hình) hầu như không dùng ngôn ngữ, được thiết kế để ít phụ thuộc văn hóa và học vấn (culturally reduced), thường dùng làm phép đo khả năng suy luận trừu tượng "ít chữ", dù điểm Raven vẫn thay đổi mạnh theo thế hệ.
    loai: phat-hien
    nguon:
      - flynn1987
    trich: Culturally reduced content has maximized culturally influenced performance. That is, the effort to avoid culturally loaded words or symbols has made the test the purest measure of those problem-solving skills that are most subject to cultural determination.
    vi_tri: Flynn 1987, mục Dutch data (Assessment)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(Raven, 1938) ... nên ít phụ thuộc vào trình độ học vấn và văn hóa hơn, và được xem là một trong những phép đo ''sạch'' nhất của khả năng suy luận trừu tượng". Bỏ năm 1938 (không kiểm được trong hồ sơ), đổi "sạch" thành "ít phụ thuộc văn hóa (culturally reduced)" và thêm "dù điểm Raven vẫn thay đổi mạnh theo thế hệ" vì Flynn (1987) nói chính vì vậy bài này phản ánh kỹ năng chịu ảnh hưởng văn hóa nhất.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.101.2.171.pdf", "https://web.archive.org/web/20161104214157/http://www.americanscientist.org/issues/feature/rising-scores-on-intelligence-tests/99999" ]
  - id: n11
    cau: Spearman thu thập điểm số của học sinh ở nhiều môn học và nhiều phép đo khác (phân biệt âm thanh, ánh sáng, trọng lượng; năng khiếu âm nhạc; đánh giá "óc thực tế"), rồi tính hệ số tương quan giữa các cặp phép đo.
    loai: phat-hien
    nguon:
      - spearman1904
    trich: In view of this community being discovered between such diverse functions as in-school Cleverness, out-of-school Common Sense, Sensory Discrimination, and Musical Talent...
    vi_tri: Spearman 1904
    ket_qua: da-sua
    ghi_chu: 'theo G1-L01 (22/10/2026). Chữ cũ: "nhiều bài kiểm tra nhận thức và môn học ... tính ma trận tương quan — một kỹ thuật thống kê mà ông gần như phát minh ra (tiền thân của phân tích nhân tố ngày nay)". Vế "gần như phát minh ... tiền thân của phân tích nhân tố" không có nguồn trong hồ sơ nên bỏ; "bài kiểm tra nhận thức" (trong đó có trí nhớ) không khớp G1, đã liệt kê đúng các phép đo.'
    luot_2: dung
    luot_2_nguon: [ "http://psychclassics.yorku.ca/Spearman/chap5.htm" ]
    luot_2_ghi_chu: "'Óc thực tế' tương ứng Common Sense."
  - id: n12
    cau: Tương quan dương xuất hiện giữa các cặp phép đo, từ đó Spearman đề xuất mọi hoạt động trí tuệ có chung một chức năng nền cộng các yếu tố riêng; bài báo này thường được coi là điểm khởi đầu của nghiên cứu về g.
    loai: lich-su
    nguon:
      - spearman1904
      - neisser1996
