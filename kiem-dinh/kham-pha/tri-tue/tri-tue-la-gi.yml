  - id: n58
    cau: 'Quiz 1–5: positive manifold là xu hướng điểm các bài kiểm tra nhận thức khác nhau tương quan dương; Strenze: IQ tương quan mạnh nhất với học vấn (.56), rồi nghề nghiệp (.43), thu nhập .20; r = .20 nghĩa là giải thích khoảng 4%; hiệu ứng Flynn là bằng chứng cho môi trường (Pietschnig và Voracek: gần 4 triệu người, 31 nước); heritability là thống kê về quần thể trong một môi trường, tăng theo tuổi.'
    loai: phat-hien
    nguon:
      - neisser1996
      - strenze2007
      - pietschnig2015
      - haworth2010
    trich: all such correlations are typically positive and form what is called a "positive manifold." | .56, .43, and .20, respectively | almost 4 million participants, from 31 countries | The heritability of general cognitive ability increases significantly and linearly
    vi_tri: Các nguồn như các nhận định tương ứng ở trên
    ket_qua: da-sua
    ghi_chu: 'Năm câu quiz lặp lại các nhận định trên; câu 4 đã sửa: đáp án đúng cũ "không thể thay đổi ... bắt buộc phải đến từ môi trường (giáo dục, dinh dưỡng, y tế)" thành "khó thay đổi ... được cho là chủ yếu đến từ môi trường (dinh dưỡng, sức khỏe, học hành)"; giải thích cũ "ở hầu hết các dạng bài" thành "cả bốn nhóm bài". Các câu còn lại khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1016%252Fj.indcrop.2012.02.030.zip/10.1016%252Fj.intell.2006.09.004.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1177%252F1461444812470428.zip/10.1177%252F1745691615577701.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf" ]
doi_chu:
  - cu: (trang cũ không có hộp tóm tắt đầu trang)
    moi: Hộp ::tom-tat tự dựng từ ý chính của bốn khung nhãn của trang (bản mới thêm).
    ly_do: Ý chính của khung Vững chắc 1 đã đổi.
  - cu: 'Khung Vững chắc: "đã được tái hiện liên tục trong hơn 120 năm, trên mọi châu lục và mọi lứa tuổi ... một trong những phát hiện vững chắc nhất"'
    moi: '"được thấy lại liên tục từ Spearman (1904) đến nay, kể cả trong 97 mẫu từ 31 nước ngoài phương Tây (Warne và Burningham, 2019)"'
    ly_do: Không kiểm được "mọi châu lục", "vững chắc nhất".
  - cu: '"toán, ngôn ngữ, trí nhớ, phân loại hình ảnh"; "Ông gọi hiện tượng này là positive manifold"; "thuyết hai nhân tố ... g ... s"; "một kỹ thuật thống kê mà ông gần như phát minh ra"'
    moi: '"điểm các môn học (cổ ngữ, tiếng Pháp, tiếng Anh, toán) với khả năng phân biệt âm thanh, ánh sáng, trọng lượng và năng khiếu âm nhạc"; "Về sau, ... được gọi là positive manifold"; "về sau gọi là g ... thuyết hai nhân tố"; (bỏ vế "gần như phát minh")'
    ly_do: G1 mục 1 và 2; toàn văn Spearman 1904.
  - cu: '"số liệu gốc từ Strenze (2007)" cho .53/.17/.05; "IQ dự báo tốt những gì liên quan đến xử lý thông tin trừu tượng ... công việc phức tạp"'
    moi: '"Bảng 25.1, tổng hợp kết quả của nhiều phân tích tổng hợp"; "liên hệ khá mạnh với học vấn và hiệu suất công việc, ... gần như không liên hệ với hạnh phúc"'
    ly_do: G1 mục 3; Strenze 2015, Bảng 25.1.
  - cu: 'Tucker-Drob và Briley: "Ảnh hưởng của gen tăng dần theo tuổi ... tương tác gen–môi trường"'
    moi: Độ ổn định theo thời gian; tỉ lệ di truyền tăng theo tuổi dẫn Haworth và cộng sự (2010); tương quan gen–SES dẫn Turkheimer (2003) và Hanscombe (2012), đổi "một số nghiên cứu ở Mỹ" thành "một nghiên cứu sinh đôi ở Mỹ"
    ly_do: G1 mục 4.
  - cu: 'Pietschnig: "đà tăng này bắt buộc phải đến từ môi trường: giáo dục phổ cập, dinh dưỡng, y tế tốt hơn"'
    moi: '"được cho là chủ yếu đến từ môi trường ... các yếu tố gắn với tốc độ lịch sử sống"'
    ly_do: Pietschnig và Voracek không nói "bắt buộc" hay "giáo dục phổ cập".
  - cu: 'Khung Khá vững: "học tốt (và môi trường tốt) cũng giúp điểm IQ cao hơn"; Khung Đã bị bác bỏ: "IQ không đo trí tuệ cảm xúc, kỹ năng xã hội, sự kiên trì hay may mắn"; Khung Đang tranh cãi: "nằm trong số những khái niệm bị hiểu sai nhiều nhất"'
    moi: '"học thêm cũng làm điểm IQ cao hơn (1–5 điểm mỗi năm — Ritchie và Tucker-Drob, 2018)"; nhận xét báo cáo APA (Neisser 1996); "hay bị hiểu sai"'
    ly_do: Bỏ cụm không nguồn.
  - cu: '"Ngày nay hầu hết các nhà nghiên cứu chấp nhận một mô hình phân tầng"; "Trí tuệ lỏng đạt đỉnh sớm và giảm dần"; "chỉ cần cải thiện môi trường ... tăng vù vù"'
    moi: '"Một quan điểm phổ biến ngày nay"; theo Hartshorne và Germine (2015), kèm lưu ý đỉnh khác nhau; "vẫn có thể tăng đáng kể"'
    ly_do: Làm mềm; thêm nguồn.
  - cu: 'Gardner: "thiếu bằng chứng là độc lập và đo được riêng rẽ ... g vẫn là mô hình có bằng chứng thực nghiệm mạnh nhất"'
    moi: Ba phê bình có nguồn (Neisser 1996; Waterhouse 2006; Visser và cộng sự 2006); "g vẫn là khung có nhiều bằng chứng thực nghiệm nhất cho cấu trúc của các bài kiểm tra nhận thức"
    ly_do: Có nguồn.
  - cu: 'Áp dụng 1: "Giá trị thực tế lớn nhất ... là chẩn đoán ... lời tiên tri tự ứng nghiệm"; Áp dụng 2: "can thiệp giáo dục sớm, dinh dưỡng ... đặc biệt ở những trẻ thiệt thòi"; Áp dụng 3: "Hầu hết các bài test IQ trên mạng ..."; Áp dụng 4 (tiêu đề "Muốn giỏi việc gì, luyện đúng việc đó")'
    moi: Viết theo Neisser (1996) và Ritchie và Tucker-Drob (2018); tiêu đề 4 đổi thành "IQ chỉ là một phần của câu chuyện"
    ly_do: Bỏ cụm không nguồn; mốc Hiệp hội.
  - cu: '"Chúng tôi chưa tìm thấy nghiên cứu công bố nào ..."; "các bài test IQ được chuẩn hóa trên quần thể phương Tây ... lịch sử tâm lý học đã có những ví dụ đau đớn"; "(positive manifold, tương tác gen–môi trường) nhiều khả năng cũng đúng"'
    moi: '"Tính đến 11/2026, ..."; "nhiều bài test phổ biến được chuẩn hóa ở các nước phương Tây"; "chỉ có thể nói positive manifold nhiều khả năng cũng có ở người Việt ... 97 mẫu từ 31 nước ngoài phương Tây"'
    ly_do: Câu thời sự; bỏ cụm không nguồn.
  - cu: '"Ma trận Raven (Raven, 1938) ... được xem là một trong những phép đo sạch nhất"; Ngộ nhận: "IQ vẫn là một trong những yếu tố dự báo ... tốt nhất mà tâm lý học từng tìm ra"; "can thiệp môi trường ... nhất là ở trẻ nhỏ và trẻ thiệt thòi"'
    moi: Bỏ năm 1938; "culturally reduced ... điểm Raven vẫn thay đổi mạnh theo thế hệ"; "khá mạnh ... không vượt trội hẳn so với điểm học bạ hay hoàn cảnh gia đình — Strenze, 2007"; "mỗi năm đi học thêm ... 1–5 điểm"
    ly_do: Flynn 1987; Strenze 2007; Ritchie 2018.
