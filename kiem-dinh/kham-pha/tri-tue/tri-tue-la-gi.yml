    ly_do: 'Strenze 2007 (phân tích tổng hợp nghiên cứu dọc): r = .56 với học vấn, .43 với nghề nghiệp; Strenze 2015: .53 với hiệu suất công việc (cấp trên đánh giá). Mẫu chủ yếu phương Tây; mức giữa các nghiên cứu khác nhau (khoảng tin cậy rộng ở Strenze 2007); quan hệ hai chiều (Ritchie 2018). Khá vững theo thước đo.'
