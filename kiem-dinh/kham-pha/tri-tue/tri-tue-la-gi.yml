    nguon:
      - neisser1996
      - waterhouse2006
      - visser2006
    trich: (Critics of the theory argue, however, that some of these are more appropriately described as special talents than as forms of "intelligence.") | these theories lack adequate empirical support and should not be the basis for educational practice | Factor analysis revealed a large g factor having substantial loadings for tests assessing purely cognitive abilities
    vi_tri: Neisser và cộng sự 1996; Waterhouse 2006, tóm tắt; Visser và cộng sự 2006, tóm tắt (200 người lớn, 8 miền)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "các trí tuệ này thiếu bằng chứng là độc lập và đo được riêng rẽ — chúng vẫn tương quan với nhau"; "g vẫn là mô hình có bằng chứng thực nghiệm mạnh nhất". Đã thay bằng ba phê bình có nguồn; "g ... có nhiều bằng chứng nhất cho cấu trúc của các bài kiểm tra nhận thức" (Neisser 1996, Warne 2019, Visser 2006).'
    luot_2: dung
