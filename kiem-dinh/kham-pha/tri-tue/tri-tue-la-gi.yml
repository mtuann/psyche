    cau: 'Khung "Đang tranh cãi": khác biệt IQ giữa người với người do gen quyết định bao nhiêu phần.'
    loai: nhan
    nhan: tranh-cai
    co_so:
      - neisser1996
      - haworth2010
      - hanscombe2012
      - turkheimer2003
    ly_do: 'Heritability có thật và tăng theo tuổi (Neisser 1996; Haworth 2010: 41% đến 66%); con số thay đổi theo quần thể, độ tuổi, môi trường; nghiên cứu về tương tác gen–SES mâu thuẫn (Turkheimer 2003 so với Hanscombe 2012). Bằng chứng chất lượng cao mâu thuẫn: tranh cãi.'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "bản thân khái niệm này nằm trong số những khái niệm bị hiểu sai nhiều nhất trong tâm lý học". Đổi thành "hay bị hiểu sai": "nhiều nhất" không kiểm được; Neisser 1996 nêu các hiểu sai thường gặp.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC2889158/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1046%252Fj.0001-2815.2002.00008.x.zip/10.1046%252Fj.0956-7976.2003.psci_1475.x.pdf" ]
    luot_2_ghi_chu: "câu đúng: Khung \"Đang tranh cãi\": khác biệt IQ giữa người với người gắn với khác biệt gen đến mức nào (ước lượng thay đổi theo tuổi, quần thể và phương pháp).; Nhãn Đang tranh cãi chấp nhận được (ước lượng khác nhau theo tuổi, quần thể, phương pháp), nhưng chữ 'do gen quyết định' là cách nói nhân quả–định mệnh mà chính trang (n36, n54) bác; với chủ đề nhạy nên viết như tỉ lệ phương sai."
  - id: n32
    cau: 'Khung "Đã bị bác bỏ": "IQ cao đảm bảo thành công và hạnh phúc trong đời".'
    loai: nhan
    nhan: bac-bo
    co_so:
      - strenze2007
      - strenze2015
      - neisser1996
    ly_do: 'Dữ liệu tổng hợp: IQ chỉ r = .20 với thu nhập, .17 với sáng tạo, .05 với hạnh phúc (Strenze 2007, 2015); báo cáo APA: bài test dự báo dưới một nửa phương sai của kết quả công việc, các đặc điểm khác có thể quan trọng ngang hoặc hơn. Khẳng định "đảm bảo" bị bác bỏ bởi chính các hệ số này.'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "IQ không đo trí tuệ cảm xúc, kỹ năng xã hội, sự kiên trì hay may mắn — mà đời sống thì cần tất cả những thứ đó". Liệt kê "trí tuệ cảm xúc, sự kiên trì, may mắn" không có nguồn; đã thay bằng nhận xét của báo cáo APA (kỹ năng giao tiếp, tính cách).'
    luot_2: dung
    luot_2_nguon: [ "https://gwern.net/doc/iq/2015-strenze.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1016%252Fj.indcrop.2012.02.030.zip/10.1016%252Fj.intell.2006.09.004.pdf" ]
    luot_2_ghi_chu: Tương quan nhỏ với thu nhập và gần không với hạnh phúc trong các phân tích tổng hợp bác bỏ chữ 'đảm bảo'.
