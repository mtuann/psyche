    cau: Một báo cáo của nhóm chuyên gia APA nhận xét rằng bài test IQ dự báo dưới một nửa phương sai của kết quả công việc và các đặc điểm khác (kỹ năng giao tiếp, tính cách) có thể quan trọng ngang hoặc hơn.
