    luot_2_ghi_chu: "Visser: tải g thấp ở các bài vận động, âm nhạc, nội tâm; câu đã có 'nhất là các bài về năng lực nhận thức thuần túy' nên chấp nhận được."
  - id: n40
    cau: Các bài test IQ cho nhiều điểm thành phần, nên có thể dùng để mô tả điểm mạnh và yếu nhận thức (một người có thể làm bài ngôn ngữ tốt hơn bài không gian và ngược lại); dùng điểm số để dán nhãn "thông minh/dốt" là lạm dụng vì test chỉ đo một lát cắt.
    loai: loi-khuyen
    nguon:
      - neisser1996
    trich: Their performance can then be scored to yield several subscores as well as an overall score. | do relatively better on verbal than on spatial items, for example, while another may show the opposite pattern
    vi_tri: Neisser và cộng sự 1996, mục Intelligence tests
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Giá trị thực tế lớn nhất của test IQ là chẩn đoán: một học sinh đọc kém nhưng lý luận tốt cần cách dạy khác ... nhãn dán có thể trở thành lời tiên tri tự ứng nghiệm". "Lớn nhất", ví dụ học sinh đọc kém, "tự ứng nghiệm" không có nguồn; đã bỏ và viết theo Neisser (1996). Không viết như lời khuyên can thiệp.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1016/j.jsp.2018.10.007&resultType=core", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf" ]
    luot_2_ghi_chu: "câu đúng: Các bài test IQ cho nhiều điểm thành phần, nhưng chênh lệch giữa các điểm này thường kém tin cậy hơn điểm chung, nên chỉ chuyên gia mới diễn giải điểm mạnh–yếu, và thận trọng; dùng điểm số để dán nhãn \"thông minh/dốt\" là lạm dụng vì test chỉ đo một lát cắt.; Phần 'dán nhãn là lạm dụng' đúng; nhưng dùng điểm thành phần để mô tả điểm mạnh–yếu (phân tích hồ sơ nhận thức) bị nhiều nghiên cứu nghi ngờ về độ tin cậy và giá trị thêm so với điểm chung (McGill, Dombrowski & Canivez 2018)."
