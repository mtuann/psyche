    ghi_chu: 'Chữ cũ: "IQ cao giúp học tốt hơn, nhưng học tốt (và môi trường tốt) cũng giúp điểm IQ cao hơn". Đã thay bằng "học thêm cũng làm điểm IQ cao hơn (mỗi năm đi học thêm khoảng 1–5 điểm — Ritchie và Tucker-Drob, 2018)", có nguồn. "Môi trường tốt" bỏ (không nguồn).'
    luot_2: qua-manh
    luot_2_nguon: [ "https://gwern.net/doc/iq/2015-strenze.pdf", "https://api.openalex.org/works/doi:10.1037/apl0000994", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0002-9432.71.2.245.zip/10.1037%252F0003-066X.51.2.77.pdf" ]
    luot_2_ghi_chu: 'câu đúng: Khung "Khá vững": IQ dự báo kết quả học tập và công việc ở mức vừa phải (r ≈ .5 với số năm học; với hiệu suất công việc khoảng .3–.5 tùy cách hiệu chỉnh).; Nhãn Khá vững hợp, nhưng khoảng r ≈ .4–.6 cho hiệu suất công việc dựa vào ước lượng cũ (Hunter & Hunter 1984, .53); phân tích lại của Sackett và cộng sự (2022) hạ độ hiệu lực của các phép tuyển chọn khoảng .10–.20. Với học vấn .56 (Strenze 2007) thì đúng.'
