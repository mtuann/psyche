  - id: n2
    cau: Năm 1999, một phân tích tổng hợp gộp 128 nghiên cứu về tác động của thưởng ngoài lên hứng thú nội tại (mô tả của trang).
    loai: so-lieu
    nguon:
      - dkr1999
    trich: A meta-analysis of 128 studies examined the effects of extrinsic rewards on intrinsic motivation.
    vi_tri: DKR 1999, tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://depts.washington.edu/techdocs/papers/deciExtrinsicRewardsAndIntrinsicMotivation99.pdf", "https://doi.org/10.1037/0033-2909.125.6.627" ]
  - id: n3
    cau: Một loạt thí nghiệm từ thập niên 1970 (Deci 1971; Lepper và cộng sự 1973) cho thấy phần thưởng bên ngoài có thể làm giảm hứng thú với việc ta từng yêu thích, nên câu trả lời có thể khác với điều ta tưởng.
    loai: phat-hien
    nguon:
      - deci1971
      - lepper1973
    trich: when money was used as an external reward, intrinsic motivation tended to decrease
    vi_tri: Deci 1971, tóm tắt; Lepper 1973, tóm tắt (kết quả expected-award)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Trực giác của nhiều người là \"vẫn vẽ như cũ, vì mình thích mà\"." (khẳng định về trực giác của "nhiều người", không có nguồn; Deci 1971 mở bài còn nói nhiều sách giáo khoa lúc ấy đã kết luận thưởng làm giảm hứng thú: "the conclusion being that external rewards decrease intrinsic motivation"). Chữ mới: "Có thể bạn sẽ nghĩ \"vẫn vẽ như cũ, vì mình thích mà\"." (giả định, gia-dinh). Tình huống 200.000 đồng cho mỗi bức vẽ và "hai tháng sau" là giả định minh họa, không phải nhận định.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fh0030644.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fh0034974.zip/10.1037%252Fh0035519.pdf" ]
  - id: n4
    cau: 'Hiện tượng này gọi là hiệu ứng xói mòn (undermining effect): phần thưởng bên ngoài, trong một số điều kiện, làm giảm hứng thú bên trong với việc ta từng yêu thích; không xảy ra với mọi loại thưởng.'
    loai: dinh-nghia
    nguon:
      - dkr1999
    trich: engagement-contingent, completion-contingent, and performance-contingent rewards significantly undermined free-choice intrinsic motivation ... In accord with the motivational and attributional theories, which predict that tangible rewards do not undermine intrinsic motivation when they are not expected or not contingent on task behavior, there was no significant undermining in those cases.
    vi_tri: DKR 1999, tóm tắt; Discussion
    ket_qua: dung
    ghi_chu: 'Tên "undermining effect" là cách dùng của chính DKR 1999 (và Lepper 1973 trong tên bài: "Undermining children''s intrinsic interest").'
    luot_2: dung
    luot_2_nguon: [ "https://depts.washington.edu/techdocs/papers/deciExtrinsicRewardsAndIntrinsicMotivation99.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fh0034974.zip/10.1037%252Fh0035519.pdf" ]
    luot_2_ghi_chu: Cụm 'hiệu ứng xói mòn (undermining effect)' là thuật ngữ chuẩn của DKR/Cerasoli.
  - id: n5
    cau: Động lực nội tại (intrinsic motivation) là làm vì bản thân việc đó đã thú vị.
    loai: dinh-nghia
    nguon:
      - ryan2000
    trich: intrinsic motivation, which refers to doing an activity for the inherent satisfaction of the activity itself
    vi_tri: Ryan & Deci 2000, tr. 71 (mục Basic psychological needs / the term extrinsic motivation)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://selfdeterminationtheory.org/SDT/documents/2000_RyanDeci_SDT.pdf" ]
  - id: n6
    cau: Động lực ngoại tại (extrinsic motivation) là làm vì phần thưởng hay sức ép bên ngoài (ví dụ điểm số, lương).
    loai: dinh-nghia
    nguon:
      - ryan2000
    trich: The term extrinsic motivation refers to the performance of an activity in order to attain some separable outcome
    vi_tri: Ryan & Deci 2000, tr. 71
    ket_qua: dung
    ghi_chu: Ví dụ "điểm số", "lương" là minh họa của trang (separable outcome); định nghĩa của nguồn nói "kết quả tách rời", trang viết "phần thưởng hay sức ép bên ngoài".
    luot_2: dung
    luot_2_nguon: [ "https://selfdeterminationtheory.org/SDT/documents/2000_RyanDeci_SDT.pdf" ]
  - id: n7
    cau: Năm 1971, Edward Deci hỏi liệu động lực ngoại tại có thể làm xói mòn động lực nội tại, và ông đo hành vi của người tham gia trong phòng thí nghiệm.
    loai: lich-su
    nguon:
      - deci1971
    trich: what will happen to his intrinsic motivation for performing this activity? ... The primary measure of motivation was the amount of time during the 8-minute free choice situation which they spent working on the puzzle.
    vi_tri: Deci 1971, mở bài; Experiment I, Method
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "ông không hỏi ý kiến — ông đo hành vi thật trong phòng thí nghiệm." Chữ mới: "ông không chỉ hỏi ý kiến — ông đo hành vi trong phòng thí nghiệm." Lý do: Deci cũng thu điểm tự đánh giá mức thú vị (thang 9 điểm) bên cạnh thời gian tự nguyện, và Thí nghiệm II là thực địa.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fh0030644.pdf" ]
  - id: n8
    cau: Deci làm hai thí nghiệm trong phòng lab (mỗi thí nghiệm 24 sinh viên) và một thí nghiệm thực địa (8 sinh viên).
    loai: so-lieu
    nguon:
      - deci1971
    trich: Each of the 24 subjects ... Twelve of the subjects were in the control group and 12 in the experimental group ... The subjects were eight students who worked on two four-man staffs of headline writers.
    vi_tri: Deci 1971, Experiment I Method; Experiment II Method; Experiment III Method (12 + 12)
    ket_qua: dung
    luot_2: dung
