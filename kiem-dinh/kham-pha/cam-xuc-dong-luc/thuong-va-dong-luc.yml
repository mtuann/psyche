  - id: n80
    cau: 'Quiz 2: theo phân tích tổng hợp DKR (1999), thưởng cụ thể, hứa trước, gắn với việc tham gia hoặc hoàn thành một nhiệm vụ thú vị xói mòn mạnh nhất; thưởng bất ngờ gần như không có hiệu ứng; lời khen mang tính thông tin tăng hứng thú (d ≈ −0,28 đến −0,40).'
    loai: so-lieu
    nguon:
      - dkr1999
    trich: (d = -0.40, -0.36, and -0.28, respectively) ... Positive feedback enhanced both free-choice behavior (d = 0.33)
    vi_tri: DKR 1999, tóm tắt; mục Unexpected Tangible Rewards
    ket_qua: dung
    ghi_chu: Tham gia −0,40 và hoàn thành −0,36 đều lớn hơn làm tốt −0,28; thưởng bất ngờ d = 0,01. Lời giải thích dựa vào nội dung, không vào vị trí đáp án.
    luot_2: sai
    luot_2_nguon: [ "https://depts.washington.edu/techdocs/papers/deciExtrinsicRewardsAndIntrinsicMotivation99.pdf" ]
    luot_2_ghi_chu: "câu đúng: Theo phân tích tổng hợp DKR (1999), thưởng cụ thể, hứa trước, gắn với việc tham gia hoặc hoàn thành nhiệm vụ thú vị xói mòn mạnh nhất (d ≈ −0,28 đến −0,40); thưởng bất ngờ gần như không có hiệu ứng (d ≈ 0,01); lời khen mang tính thông tin tăng hứng thú (d ≈ +0,33).; Phần 'tham gia hoặc hoàn thành xói mòn mạnh nhất' và 'bất ngờ gần như không có' đúng; nhưng khoảng d ≈ −0,28 đến −0,40 đứng cuối câu, ngay sau 'lời khen ... tăng hứng thú', nên đọc ra như d của lời khen; đúng ra d của lời khen là +0,33."
  - id: n81
    cau: 'Quiz 3: nhóm trẻ được thưởng bất ngờ trong nghiên cứu của Lepper và cộng sự (1973) không bị giảm hứng thú vẽ vì lúc vẽ trẻ không biết sẽ có thưởng, nên không suy luận "mình vẽ vì được thưởng"; chỉ khi thưởng hứa trước, trẻ mới quy hành vi cho phần thưởng.'
    loai: phat-hien
    nguon:
      - lepper1973
    trich: in the unexpected-award condition, subjects had no knowledge of the reward until after they had finished with the activity
    vi_tri: Lepper 1973, tóm tắt
    ket_qua: dung
    ghi_chu: Phần "suy luận" là giải thích của giả thuyết quá biện minh, đã ghi như "cốt lõi của giả thuyết".
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fh0034974.zip/10.1037%252Fh0035519.pdf" ]
  - id: n82
    cau: 'Quiz 4: thưởng cho việc nhàm chán ít rủi ro hơn vì hiệu ứng xói mòn chỉ "có cái để xói" khi đã có hứng thú nội tại từ trước; với việc nhàm chán, các nghiên cứu không thấy thưởng làm giảm hứng thú.'
    loai: phat-hien
    nguon:
      - dkr1999
    trich: the reliable undermining of intrinsic motivation by tangible rewards does not extend to dull–boring tasks
    vi_tri: DKR 1999, mục Interesting Versus Boring Tasks
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ (giải thích): "Với việc nhàm chán, hứng thú nội tại gần như bằng không, nên thưởng chỉ còn tác dụng thúc đẩy hành vi — đúng chức năng của nó." Chữ mới: "…các nghiên cứu không thấy thưởng làm giảm hứng thú, vì không có nhiều hứng thú nội tại để mất." Lý do: bỏ "gần như bằng không" và "tác dụng thúc đẩy hành vi", không có trong nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://depts.washington.edu/techdocs/papers/deciExtrinsicRewardsAndIntrinsicMotivation99.pdf" ]
  - id: n83
    cau: 'Quiz 5: Eisenberger và Cameron (1996) phản biện rằng tác hại của phần thưởng chỉ xuất hiện trong những điều kiện hẹp, dễ tránh.'
    loai: phat-hien
    nguon:
      - ec1996
    trich: detrimental effects of reward occur under highly restricted, easily avoidable conditions
    vi_tri: Eisenberger & Cameron 1996, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'G1-L04 #3 (quiz câu 5). Chữ cũ: đáp án đúng "Điều kiện phòng thí nghiệm khác đời thực và cách đo bằng thời gian rảnh kém trực tiếp hơn tự báo cáo". Chữ hiện trên trang khớp đề xuất; đối chiếu lại tóm tắt E&C khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/8937264/", "https://depts.washington.edu/techdocs/papers/deciExtrinsicRewardsAndIntrinsicMotivation99.pdf" ]
    luot_2_ghi_chu: Chỉ đọc tóm tắt bài E&C 1996.
  - id: n84
    cau: 'Quiz 5, lời giải thích: phê bình này không bác bỏ hiệu ứng, nhưng nhắc ta thận trọng khi áp dụng kết quả phòng thí nghiệm vào đời sống; nên hiệu ứng trong đời thực được gắn nhãn "Đang tranh cãi".'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: khung :::tranh-cai[hiệu ứng trong đời thực lớn đến đâu?] có trên trang (mục Mức độ chắc chắn). Phần "không bác bỏ hiệu ứng" là nhận định của trang, khớp nhãn n45 (khung tranh cãi).'
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: '"Trực giác của nhiều người là \"vẫn vẽ như cũ, vì mình thích mà\"."'
    moi: '"Có thể bạn sẽ nghĩ \"vẫn vẽ như cũ, vì mình thích mà\"."'
    ly_do: Hồ sơ n3.
  - cu: '"ông không hỏi ý kiến — ông đo hành vi thật trong phòng thí nghiệm."'
    moi: '"ông không chỉ hỏi ý kiến — ông đo hành vi trong phòng thí nghiệm."'
    ly_do: Hồ sơ n7.
  - cu: '"giai đoạn 1 tự do chơi"'
    moi: '"giai đoạn 1 mọi người ghép hình như nhau, không ai được trả"'
    ly_do: Hồ sơ n10.
  - cu: '"Sau mỗi giai đoạn, người nghiên cứu rời khỏi phòng vài phút"'
    moi: '"Giữa mỗi buổi, người nghiên cứu rời khỏi phòng 8 phút"'
    ly_do: Hồ sơ n13.
  - cu: '"Deci chỉ đo thời gian … thước đo của hứng thú nội tại, không phải của sự vâng lời."'
    moi: '"Thước đo chính của Deci là thời gian … được coi là thước đo hứng thú nội tại."'
    ly_do: Hồ sơ n14.
  - cu: '"dành ít thời gian tự nguyện cho câu đố hơn hẳn — và ít hơn nhóm đối chứng. Tiền đã làm xói mòn hứng thú."'
    moi: '"dành ít thời gian tự nguyện cho câu đố hơn lúc đầu, trong khi nhóm đối chứng không giảm. Với chỉ 12 người mỗi nhóm, … p < 0,10 …"'
    ly_do: 'G1-L04 #1; hồ sơ n15, n16.'
  - cu: '"hứng thú có xu hướng tăng lên"'
    moi: '"nhóm được khen không giảm thời gian tự nguyện, trong khi nhóm đối chứng giảm; so với nhóm đối chứng, hứng thú có xu hướng tăng"'
    ly_do: Hồ sơ n18.
  - cu: '"Từ đây Deci đề xuất lý thuyết đánh giá nhận thức"'
    moi: '"Về sau, Deci và Ryan (1985) phát triển các kết quả như vậy thành lý thuyết đánh giá nhận thức"'
    ly_do: Hồ sơ n19.
  - cu: '"bút dạ màu — thứ trẻ nào cũng mê"'
    moi: '"thứ những trẻ được chọn vốn đã thích"'
    ly_do: Hồ sơ n21.
  - cu: '"Một nhóm được hứa thưởng trước nếu vẽ đẹp"'
    moi: '"Một nhóm được hứa trước một tấm giấy khen \"Người chơi giỏi\" nếu đồng ý vẽ (phần thưởng không phụ thuộc vẽ đẹp hay xấu)"'
    ly_do: 'G1-L04 #2; hồ sơ n22.'
  - cu: '"Hai tuần sau … vẽ ít hơn hẳn hai nhóm còn lại."'
    moi: '"Một đến hai tuần sau … vẽ ít hơn rõ rệt hai nhóm còn lại."'
    ly_do: 'Hồ sơ n23 (G1-L04: "hai tuần" không kiểm được; toàn văn ghi 1–2 tuần).'
  - cu: '"một kết luận mà Eisenberger và Cameron (1996) sau đó mô tả như việc hiệu ứng xói mòn \"phần lớn chỉ là huyền thoại\""'
    moi: '"một kết luận mà Eisenberger và Cameron (1996) sau đó đẩy xa hơn, theo cách Deci và cộng sự kể lại là cho rằng hiệu ứng xói mòn phần lớn là huyền thoại"'
    ly_do: Hồ sơ n27.
  - cu: '"Thưởng cụ thể gây hại nhiều hơn ở trẻ em so với sinh viên đại học."'
    moi: '"Thưởng cụ thể có xu hướng gây hại nhiều hơn ở trẻ em so với sinh viên đại học, còn lời khen có xu hướng tăng hứng thú tự chọn rõ hơn ở sinh viên so với trẻ em."'
    ly_do: Hồ sơ n37.
  - cu: '"phần lớn nghiên cứu đo hứng thú bằng thời gian tự chọn trong phòng thí nghiệm, trên sinh viên Mỹ và trẻ em;"'
    moi: '"phần lớn nghiên cứu là thí nghiệm trong phòng thí nghiệm hay điều kiện giống phòng thí nghiệm, đo hứng thú bằng thời gian tự chọn, trên trẻ em và sinh viên;"'
    ly_do: Hồ sơ n40.
  - cu: '"Eisenberger và Cameron (1996) phản biện rằng điều kiện phòng thí nghiệm … không giống đời thực, và cách đo bằng \"thời gian rảnh\" kém trực tiếp hơn tự báo cáo" (khung và quiz câu 5)'
    moi: '"…tác hại của phần thưởng chỉ xuất hiện trong những điều kiện rất hẹp và dễ tránh…"'
    ly_do: 'G1-L04 #3; hồ sơ n46, n83.'
  - cu: '"### 4. Với việc nhàm chán, cứ thưởng thoải mái"; "thưởng vẫn hiệu quả và ít rủi ro, vì không có hứng thú nội tại nào để mất"'
    moi: '"### 4. Với việc nhàm chán, thưởng ít rủi ro hơn" (id cũ giữ); "các nghiên cứu không thấy thưởng làm giảm hứng thú, vì vốn không có nhiều hứng thú nội tại để mất"'
    ly_do: Hồ sơ nhãn mục 4 và câu thân bài.
  - cu: '"128 nghiên cứu trong phân tích tổng hợp 1999 cũng chủ yếu đến từ phương Tây."'
    moi: '"… đều là thí nghiệm công bố bằng tiếng Anh trong các cơ sở dữ liệu PsycINFO và ERIC (1971 đến 8/1997), nên nhiều khả năng cũng chủ yếu đến từ phương Tây."'
    ly_do: Hồ sơ mục Việt Nam.
  - cu: '"Chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra hiệu ứng xói mòn trên người Việt Nam."'
    moi: '"Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra trực tiếp hiệu ứng xói mòn trên người Việt Nam (tìm trên Crossref ngày 10/11/2026; chưa tìm Google Scholar hay tạp chí trong nước)."'
    ly_do: Câu thời sự, mốc và hạn.
  - cu: '"văn hóa thưởng – phạt trong giáo dục và gia đình ở Việt Nam có những nét riêng"'
    moi: '"cách thưởng – phạt trong giáo dục và gia đình ở Việt Nam có thể có những nét riêng"'
    ly_do: Hồ sơ mục Việt Nam.
  - cu: '"thưởng giúp *bắt đầu* và *duy trì số lượng*, nhưng"'
    moi: '"thưởng có thể tăng *số lượng* công việc (Cerasoli và cộng sự, 2014), nhưng"'
    ly_do: Hồ sơ mục Ngộ nhận.
  - cu: '"đều an toàn, thậm chí có lợi."'
    moi: '"đều không thấy làm giảm hứng thú; riêng lời khen còn có xu hướng tăng hứng thú."'
    ly_do: Hồ sơ mục Ngộ nhận.
  - cu: 'Quiz 1: "ghi lại hứng thú thật, không phải lời nói hay thành tích dưới áp lực thưởng"'
    moi: '"không dựa vào lời nói hay thành tích lúc đang được thưởng, nên được dùng như một thước đo hứng thú nội tại"'
    ly_do: Hồ sơ quiz 1.
  - cu: 'Quiz 4: "hứng thú nội tại gần như bằng không, nên thưởng chỉ còn tác dụng thúc đẩy hành vi — đúng chức năng của nó"'
    moi: '"các nghiên cứu không thấy thưởng làm giảm hứng thú, vì không có nhiều hứng thú nội tại để mất"'
    ly_do: Hồ sơ quiz 4.
