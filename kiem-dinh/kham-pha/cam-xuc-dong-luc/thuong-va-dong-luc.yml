    cau: Theo lý thuyết đánh giá nhận thức, mỗi phần thưởng có mặt kiểm soát và mặt thông tin; tiền thưởng hứa trước nghiêng về mặt kiểm soát, lời khen chân thành nghiêng về mặt thông tin.
