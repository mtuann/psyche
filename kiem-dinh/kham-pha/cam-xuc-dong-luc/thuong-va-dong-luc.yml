    ghi_chu: 'G1-L04 (mục thuong-va-dong-luc #1, SAI: kết luận mạnh hơn nguồn). Chữ cũ: "dành ít thời gian tự nguyện cho câu đố hơn hẳn — và ít hơn nhóm đối chứng. Tiền đã làm xói mòn hứng thú." Chữ hiện trên trang khớp đề xuất của G1; đối chiếu lại Bảng 1 của Deci: nhóm thưởng 248,2 giây (T1) xuống 198,5 (T3); đối chứng 213,9 lên 241,8.'
