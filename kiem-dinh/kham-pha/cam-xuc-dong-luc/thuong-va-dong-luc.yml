    ghi_chu: 'Chữ cũ: "giai đoạn 1 tự do chơi". Chữ mới: "giai đoạn 1 mọi người ghép hình như nhau, không ai được trả". Lý do: ở cả ba buổi người tham gia ghép các hình theo yêu cầu; chỉ có 8 phút giữa buổi là tự do (xem n14).'
