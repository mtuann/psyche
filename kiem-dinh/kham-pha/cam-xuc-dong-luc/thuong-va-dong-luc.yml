    trich: The puzzle is made up of seven pieces of plastic ... These seven pieces can be fitted together to form millions of different configurations ... At all three sessions, both the experimental and control subjects found the task interesting and enjoyable. The session averages ranged from 7.25 to 8.00
    vi_tri: Deci 1971, Experiment I, Method và Results (thang 9 điểm)
    ket_qua: dung
    ghi_chu: '"Vô số hình khối" là cách nói gọn của "millions of different configurations".'
