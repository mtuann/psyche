    trich: CET proposes that rewards can be interpreted by recipients primarily as controllers of their behavior or, alternatively, as indicators of their competence ... With engagement-contingent rewards ... the reward is likely to be experienced as controlling the task behavior ... the informational aspect of verbal rewards is generally expected to be salient
    vi_tri: DKR 1999, mục Cognitive Evaluation Theory và Reward Contingencies; Verbal Rewards
