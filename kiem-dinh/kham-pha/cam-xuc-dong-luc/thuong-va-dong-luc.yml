    cau: 'Thí nghiệm lab dùng câu đố Soma: bộ 7 mảnh nhựa có thể ghép thành vô số hình khối khác nhau, một trò chơi trí tuệ mà sinh viên thấy khá cuốn.'
    loai: phat-hien
    nguon:
