    ghi_chu: 'Chữ cũ: "Deci chỉ đo thời gian mỗi người tự nguyện chơi ghép hình … thước đo của hứng thú nội tại, không phải của sự vâng lời." Chữ mới: "Thước đo chính của Deci là thời gian … được coi là thước đo hứng thú nội tại." Lý do: Deci còn thu điểm tự đánh giá mức thú vị cuối mỗi buổi (thước đo phụ), nên "chỉ" không đúng; "không phải của sự vâng lời" là diễn giải của trang, không có trong bài.'
