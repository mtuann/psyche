    cau: 'Joseph và cộng sự (2015): với dòng mixed EI, giá trị gia tăng sụp đổ về gần bằng không (β = -.02) khi kiểm soát đầy đủ.'
    loai: so-lieu
    nguon:
      - j2015
    trich: the mixed EI–job performance relationship becomes nil (β = –.02)
    vi_tri: j2015, Abstract
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf" ]
  - id: n69
    cau: 'Theo Joseph và Newman (2010), EQ năng lực dự báo hiệu suất ở công việc đòi hỏi nhiều lao động cảm xúc (r = .22) nhưng không ở công việc ít đòi hỏi (r = .00), dù mỗi nhóm chỉ có 3–4 nghiên cứu; Côté (2014) cũng cho rằng cần tính đến bối cảnh công việc.'
    loai: phat-hien
    nguon:
      - jn2010
      - cote2014
    trich: 'EQ năng lực: High emotional labor .22 (ρ̂ .24); Low emotional labor .00 (ρ̂ .01) (jn2010); Côté: support for the situation-specific and moderator models suggests that the organizational context and employee dispositions should be considered'
    vi_tri: jn2010, Bảng 3; cote2014, Abstract
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Điểm đồng thuận duy nhất: …" (không nguồn nói "duy nhất"). Chữ mới có dẫn hai nguồn. Review (Claude Opus 5.5, 10/11/2026): sai. Lượt 2 đúng (quá mạnh): chỉ Joseph & Newman (2010) kiểm điều tiết theo lao động cảm xúc, mỗi nhóm 3–4 nghiên cứu; Côté (2014) chỉ nói cần tính tới bối cảnh. Chữ cũ: "Một điểm các nghiên cứu cùng thấy: hiệu quả của EQ phụ thuộc loại công việc — việc càng đòi hỏi lao động cảm xúc, EQ càng có đất dụng võ (Joseph và Newman, 2010; Côté, 2014)." Chữ mới: "Một điểm đáng chú ý: theo Joseph và Newman (2010), EQ năng lực dự báo hiệu suất ở công việc đòi hỏi nhiều lao động cảm xúc (r = .22) nhưng không ở công việc ít đòi hỏi (r = .00), dù mỗi nhóm chỉ có 3–4 nghiên cứu; Côté (2014) cũng cho rằng cần tính đến bối cảnh công việc."'
    luot_2: qua-manh
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1002%252Fjlac.19345140116.zip/10.1002%252Fjob.714.pdf" ]
    luot_2_ghi_chu: "câu đúng: Joseph và Newman (2010) thấy EQ năng lực dự báo hiệu suất ở việc nhiều lao động cảm xúc (r = .22; 4 nghiên cứu, N = 220) nhưng không ở việc ít lao động cảm xúc (r = .00; 3 nghiên cứu, N = 223); mẫu nhỏ, chưa có tái lập độc lập.; 'Các nghiên cứu cùng thấy' nói quá: chỉ một phân tích tổng hợp, mỗi nhóm 3–4 nghiên cứu, chưa tái lập độc lập."
    review: sai
  - id: n70
    cau: 'Đang tranh cãi: EQ là yếu tố dự báo thành công trong đời tốt nhất, quan trọng hơn IQ (chưa có nghiên cứu đo thẳng; ở hiệu suất công việc, hiệu ứng nhỏ hơn nhiều so với lời quảng bá).'
    loai: nhan
    nguon:
      - jn2010
      - j2015
    nhan: tranh-cai
    co_so:
      - jn2010
      - j2015
    ly_do: 'Không phân tích tổng hợp nào đã đọc ủng hộ: EQ năng lực ρ ≈ .17 so với năng lực nhận thức ≈ .40 với hiệu suất (Joseph và Newman 2010, Bảng 4); EQ mixed ρ ≈ .42 ở bản 2010 nhưng hạ còn .29 và gần bằng không sau kiểm soát (2015). Chưa có nghiên cứu đo "thành công trong đời", nên không đủ cho Đã bị bác bỏ; hiệu ứng nhỏ hơn nhiều so với tuyên bố: Đang tranh cãi (review D5-L4 đổi từ Đã bị bác bỏ).'
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó: "Đã bị bác bỏ" cho một thông điệp quảng cáo rộng ("thành công trong đời"), bằng chứng chỉ đo hiệu suất công việc; đề nghị review cân nhắc có hạ thành "Đang tranh cãi" hay không. Chữ ở trang đã nói rõ đây là thông điệp truyền thông. Review (Claude Opus 5.5, 10/11/2026): sai. Đổi nhãn Đã bị bác bỏ thành Đang tranh cãi. Thước đo mục 4: Bác bỏ cần các kiểm tra đủ mạnh liên tục thất bại, mà chưa có nghiên cứu nào đo "thành công trong đời"; dữ liệu tổng hợp chỉ về hiệu suất công việc, nơi EQ năng lực nhỏ hơn nhiều so với lời quảng bá (ρ ≈ .17 so với .40) và EQ mixed ngang IQ trước khi kiểm soát (.42) rồi về gần 0 (Joseph và cộng sự 2015). Đúng ý "hiệu ứng nhỏ hơn nhiều so với tuyên bố ban đầu" của Đang tranh cãi. Chữ khung viết rõ vì sao không xếp Bác bỏ. Hộp ::tom-tat đổi theo.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf" ]
    luot_2_ghi_chu: "Hai phân tích tổng hợp không ủng hộ tuyên bố 'tốt nhất, hơn IQ'; bài không đưa số IQ riêng, nhưng đủ cho nhãn bác bỏ phần tuyên bố mạnh này. Phạm vi: hiệu suất công việc, không phải 'thành công trong đời'."
    review: sai
  - id: n71
    cau: Đây là thông điệp trên trang bìa Time năm 1995, không phải kết luận khoa học.
    loai: lich-su
    nguon:
      - time1995bia
      - penguin1995
      - time1995
    trich: What's Your EQ? It's not your IQ. It's not even a number.
    vi_tri: penguin1995
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ có dẫn nguyên câu trong ngoặc kép: "có thể là yếu tố dự báo thành công trong đời tốt nhất". Xem n7. Review (Claude Opus 5.5, 10/11/2026): dung. Ảnh bìa Time 2/10/1995 (đã xem): "emotional intelligence may be the best predictor of success in life". Chữ trên trang đổi "mạnh nhất" thành "tốt nhất" (như n7).'
    luot_2: khong-chac
    luot_2_nguon: [ "https://content.time.com/time/subscriber/article/0,33009,983503,00.html" ]
    luot_2_ghi_chu: Không đọc được chữ trên bìa nên không xác nhận được rằng 'thông điệp trên bìa' đúng như trang mô tả (xem n6, n7). Nửa sau (không phải kết luận khoa học) khớp phân tích tổng hợp.
    review: dung
  - id: n72
    cau: 'Chúng tôi không tìm thấy phân tích tổng hợp nào ủng hộ thông điệp ấy: EQ năng lực tương quan với hiệu suất ρ ≈ .17, thấp hơn năng lực nhận thức (≈ .40); EQ mixed cao hơn (≈ .42) nhưng phần lớn là tính cách, sự tự tin và IQ "đội lốt".'
    loai: so-lieu
    nguon:
      - jn2010
      - j2015
    trich: Job performance .17 .22 .42 .19c .10c .07c .09c .06c .40d
    vi_tri: jn2010, Bảng 4 (cột 9 "Cognitive ability" .40, theo Hunter & Hunter 1984); j2015, Abstract
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Không có phân tích tổng hợp nào ủng hộ nó: mối liên hệ … ở mức khiêm tốn…". Lý do: khẳng định phủ định mạnh; chữ mới nói "chúng tôi không tìm thấy" và thêm số. Hunter & Hunter 1984 là nguồn của .40 trong bảng của Joseph và Newman. Review (Claude Opus 5.5, 10/11/2026): dung. Số khớp Bảng 4 Joseph & Newman 2010; khung nay ghi rõ dữ liệu là về hiệu suất công việc (n70).'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1002%252Fjlac.19345140116.zip/10.1002%252Fjob.714.pdf" ]
    luot_2_ghi_chu: Câu có số mixed (.42) hơi cao hơn IQ (.40) và đã thừa nhận; phạm vi 'chúng tôi không tìm thấy' hợp với các phân tích tổng hợp đã đọc.
    review: dung
  - id: n73
    cau: EQ năng lực (Salovey và Mayer 1990; Mayer và Salovey 1997) khác EQ tự báo cáo/trait/mixed (Bar-On với EQ-i năm 1997; Goleman; thang 33 câu của Schutte và cộng sự 1998) và EQ truyền thông (lời hứa thành công).
    loai: lich-su
    nguon:
      - jn2010
      - schutte1998
      - mayer2008
    trich: A factor analysis of the responses of 346 adults suggested the creation of a 33-item scale
    vi_tri: 'schutte1998, tóm tắt (Nova Southeastern University); jn2010, tài liệu tham khảo: Bar-On (1997), EQ-i'
    ket_qua: dung
    ghi_chu: Bar-On 1997 chỉ kiểm được qua danh mục tham khảo của jn2010 và petrides2001 (EQ-i là thang tự báo cáo). Xếp Goleman vào mixed theo mayer2008 và jn2010.
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.2190.zip/10.2190%252FDUGG-P24E-52WK-6CDG.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.97.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf" ]
  - id: n74
    cau: Khi ai đó nói "khoa học đã chứng minh EQ quan trọng hơn IQ", hãy hỏi lại họ nói về EQ nào, đo bằng gì.
    loai: loi-khuyen
    nguon:
      - jn2010
    trich: It is critical to distinguish these two, because measures based on the two EI definitions do not have the same content, predictive validity, or subgroup differences.
    vi_tri: jn2010, Bảng 7 (khuyến nghị 1)
    ket_qua: dung
