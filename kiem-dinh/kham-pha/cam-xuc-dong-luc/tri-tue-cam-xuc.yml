    ghi_chu: 'Chữ cũ: "thì là lạm dụng". "Cho con học gì" nằm ngoài nguồn (nguồn nói về tuyển dụng); giữ như mở rộng hợp lý, ghi rõ đây là suy luận. Review (Claude Opus 5.5, 10/11/2026): dung. Mức "thận trọng" đúng.'
