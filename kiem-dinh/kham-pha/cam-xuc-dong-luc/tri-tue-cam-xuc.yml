  - id: n57
    cau: 'Lập luận của Locke có hai ý: EI không phải một dạng trí tuệ (theo ông là tổ hợp thói quen, kỹ năng, lựa chọn), và được định nghĩa rộng đến mức không còn nghĩa rõ ràng.'
    loai: phat-hien
    nguon:
      - locke2005
    trich: the concept of emotional intelligence (EI) is invalid both because it is not a form of intelligence and because it is defined so broadly and inclusively that it has no intelligible meaning
    vi_tri: 'locke2005, Abstract; tr. 426: "some combination of assorted habits, skills and/or choices"'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "EQ hoặc là trí tuệ áp dụng vào lĩnh vực cảm xúc — thì không phải khái niệm mới; hoặc là một bó tính cách và kỹ năng — thì không phải trí tuệ" (ở thân bài và ở mục Các lý thuyết giải thích: "bài toán logic của Locke", "nếu EQ là bó gồm lạc quan, tự tin, khéo giao tiếp"). Lý do: nguồn không trình bày lưỡng đề này; chữ mới theo abstract và tr. 426. Review (Claude Opus 5.5, 10/11/2026): dung. Khớp Locke 2005.'
    luot_2: dung
