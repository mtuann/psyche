    ghi_chu: 'Chữ cũ: "đôi khi phản ứng phù hợp chính là thể hiện sự giận dữ một cách có kiểm soát". Lý do: không có nguồn đã mở; chữ mới theo định nghĩa của Mayer và Salovey. Review (Claude Opus 5.5, 10/11/2026): dung. Khớp định nghĩa trích qua Joseph & Newman 2010.'
