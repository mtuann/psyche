    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "r ≈ .17, chưa hiệu chỉnh" và "r ≈ .42". Lý do: Bảng 4 ghi các hệ số với hiệu suất đã hiệu chỉnh cho độ tin cậy của tiêu chí và hạn chế biên độ, nên là ρ và không phải "chưa hiệu chỉnh". Cũng dùng ở khung Bác bỏ (n72). Review (Claude Opus 5.5, 10/11/2026): dung. ρ .17 và .42 là hệ số đã hiệu chỉnh độ tin cậy tiêu chí và hạn chế biên độ (Bảng 4); chữ trang nói đúng loại hiệu chỉnh.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf" ]
    luot_2_ghi_chu: "Khớp: .17 và .42 là hệ số hiệu chỉnh độ tin cậy tiêu chí và hạn chế biên độ (Table 4); hệ số hiệu chỉnh đầy đủ là .18 và .47."
