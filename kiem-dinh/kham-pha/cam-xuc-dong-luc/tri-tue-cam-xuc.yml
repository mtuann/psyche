  - id: n96
    cau: Nguyen và cộng sự (2020) khảo sát 1.593 học sinh Việt Nam bằng bản dịch tiếng Việt của thang TEIQue, thấy nam sinh có điểm EI chung cao hơn nữ sinh và sự ấm áp của cha mẹ liên quan đến EI cao hơn ở con.
    loai: so-lieu
    nguon:
      - nguyen2020
    trich: Results from 1,593 students revealed that boys had significantly higher overall EI, Well-Being, and Self-Control subscale scores than girls. The warmth of parents during childhood was associated with higher EI
    vi_tri: nguyen2020, Abstract
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "1.593 thanh thiếu niên", "nam giới điểm cao hơn nữ giới". Lý do: nguồn nói "students"/"adolescents" (học sinh) và "boys"/"girls"; tránh đọc thành người trưởng thành. Theo G1-L04: KHỚP abstract. Review (Claude Opus 5.5, 10/11/2026): dung. Lượt 2 không mở được. Tóm tắt (Crossref 10.1177/1066480719896558, Family Journal 28(4), 441–454): "Trait Emotional Intelligence Questionnaire—Adolescent Short Form, which has been translated into Vietnamese ... Results from 1,593 students revealed that boys had significantly higher overall EI ... The warmth of parents during childhood was associated with higher EI". Thêm tập, trang vào mục Nguồn của trang.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không mở được bài gốc nên không xác nhận được cỡ mẫu và kết quả.
    review: dung
  - id: n97
    cau: Lê (2025) khảo sát 256 sinh viên sư phạm TP.HCM bằng thang REIS; Nguyễn Minh Anh và cộng sự (2025) khảo sát 164 sinh viên năm nhất bằng thang BarOn EQ-i.
    loai: so-lieu
    nguon:
      - le2025
      - nguyenma2025
    trich: Mẫu nghiên cứu gồm 164 sinh viên … thang đo trí tuệ cảm xúc BarOn EQ-i
    vi_tri: 'le2025: 256 sinh viên Trường ĐH Sư phạm TP.HCM, REIS; nguyenma2025, tóm tắt'
    ket_qua: dung
    ghi_chu: 'Theo G1-L04: tìm thấy và khớp. Đã mở trang tạp chí của Lê và cộng sự (tập 1, số 98, 20/6/2025, 256 sinh viên, REIS) và tóm tắt Nguyễn Minh Anh. Chữ "chưa truy được bản công bố gốc" đã bỏ khỏi trang theo G1 (đối chiếu lại: chữ hiện trên trang khớp đề xuất). Chưa xác nhận REIS là bảng hỏi tự báo cáo. Review (Claude Opus 5.5, 10/11/2026): dung. Lượt 2 không mở được. Trang tạp chí (vjol.info.vn/tckhtruongdhsaigon/article/view/138636, đã mở): "khảo sát bằng trắc nghiệm trí tuệ cảm xúc REIS trên 256 sinh viên trường ĐHSP TPHCM", xuất bản 20/6/2025, tập 1 số 98. Tóm tắt Nguyễn Minh Anh và cộng sự 2025 (Crossref 10.59775/1859-3968.273): "thang đo trí tuệ cảm xúc BarOn EQ-i ... 164 sinh viên".'
    luot_2: khong-chac
    luot_2_ghi_chu: Không mở được bài gốc.
    review: dung
  - id: n98
    cau: Các nghiên cứu ấy đều dùng thang đo (TEIQue, REIS, BarOn EQ-i), không phải bài test năng lực kiểu MSCEIT.
    loai: phat-hien
    nguon:
      - nguyen2020
      - le2025
      - nguyenma2025
      - pekaar2018
    vi_tri: nguyen2020; le2025; nguyenma2025
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "tất cả đều dùng thang tự báo cáo và mang tính mô tả". Lý do: chưa xác nhận REIS là tự báo cáo, và Nguyen 2020 có phân tích hồi quy nên không chỉ mô tả; chữ mới nói điều xác nhận được. Review (Claude Opus 5.5, 10/11/2026): dung. TEIQue (Nguyen 2020) và EQ-i là thang trait EI (Petrides & Furnham 2001); REIS là thang tự báo cáo: Pekaar và cộng sự 2018 (tóm tắt ở repub.eur.nl/pub/103053): "The REIS was strongly correlated with other self-reported EI instruments and weakly to moderately correlated with an ability EI test". Ba nghiên cứu Việt Nam đều không dùng bài test năng lực.'
    luot_2: khong-chac
    luot_2_ghi_chu: TEIQue, REIS, EQ-i vốn là thang tự báo cáo (Joseph & Newman 2010 xếp EQ-i vào mixed), nhưng chưa kiểm từng nghiên cứu.
    review: dung
