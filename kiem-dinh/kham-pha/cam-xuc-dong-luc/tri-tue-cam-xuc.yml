  - id: n75
    cau: Tự báo cáo "đụng" tính cách vì nội dung câu hỏi giống nhau (ví dụ minh họa của trang) và vì cùng phương pháp tự đánh giá (yếu tố phương pháp tự báo cáo).
    loai: phat-hien
    nguon:
      - jn2010
      - j2015
    trich: self-reported ability EI greatly reflects the self-report method factor and does a poor job of reflecting the ability EI trait factor
    vi_tri: jn2010, mục Discriminant validity
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "người lạc quan có xu hướng chấm mình cao ở mọi thang tích cực". Lý do: không có nguồn đã mở cho hành vi này; chữ mới theo kết luận về yếu tố phương pháp. Hai câu ví dụ là minh họa của trang (gia-dinh), đã ghi "ví dụ minh họa". Review (Claude Opus 5.5, 10/11/2026): dung. Chấp nhận (ví dụ giả định, gia-dinh).'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf" ]
    luot_2_ghi_chu: Phần 'yếu tố phương pháp tự báo cáo' là suy luận hợp lý của trang; ví dụ minh họa là ví dụ giả định.
    review: dung
  - id: n76
    cau: Petrides và Furnham (2001) đề xuất gọi dòng EQ tự báo cáo là trait EI và xem nó như một khía cạnh của tính cách.
    loai: lich-su
    nguon:
      - pf2001
    trich: trait EI can be conceptualized as a distinct composite construct at the primary level of hierarchical trait structures
    vi_tri: pf2001, Abstract
    ket_qua: dung
    ghi_chu: '"Một cách gọi trung thực hơn là ''trí tuệ''" là nhận xét của trang, không phải của nguồn; nguồn kết luận trait EI là cấu trúc tổng hợp riêng ở mức cơ bản của hệ tính cách. Review (Claude Opus 5.5, 10/11/2026): dung. Lượt 2 không mở được. Tóm tắt Petrides & Furnham 2001 (Crossref, đã mở): "sets out the theoretical foundation of emotional intelligence (EI) as a constellation of traits and self-perceived abilities ... trait EI can be conceptualized as a distinct composite construct at the primary level of hierarchical trait structures". "Đề xuất gọi là trait EI, xem như một khía cạnh tính cách" khớp; câu không nói họ là người đầu tiên dùng tên này. Vế "cách gọi trung thực hơn" là nhận xét của trang.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf" ]
    luot_2_ghi_chu: Không mở được Petrides & Furnham 2001, nên không xác nhận được rằng họ đề xuất tên 'trait EI' và xem nó là khía cạnh của tính cách.
    review: dung
  - id: n77
    cau: Mayer, Salovey và Caruso (2008) đáp lại bằng cách phân biệt EI như một nhóm năng lực với một "hỗn hợp các nét tích cực" như hạnh phúc, tự trọng, lạc quan, và chỉ bảo vệ dòng năng lực.
    loai: lich-su
    nguon:
      - mayer2008
    trich: some researchers focus on EI as a distinct group of mental abilities, and other researchers instead study an eclectic mix of positive traits such as happiness, self-esteem, and optimism
    vi_tri: mayer2008, Abstract
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "siết chặt định nghĩa về dòng năng lực và từ chối bảo vệ dòng mixed — một sự nhượng bộ đáng kể". Lý do: "nhượng bộ" và "từ chối bảo vệ" là diễn giải; abstract chỉ nói phân biệt hai loại và EI như năng lực có giá trị. Review (Claude Opus 5.5, 10/11/2026): dung. Khớp tóm tắt Mayer, Salovey & Caruso 2008.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/18793038/" ]
