nhan_dinh:
  - id: n1
    cau: 'Từ "EQ" đang được dùng cho ba thứ khác nhau: EQ năng lực, EQ tự báo cáo (trait hay mixed), và EQ trên truyền thông.'
    loai: dinh-nghia
    nguon:
      - jn2010
      - mayer2008
    trich: application of the EI label to 2 distinct sets of constructs (i.e., ability-based EI and mixed-based EI)
    vi_tri: jn2010, Abstract
    ket_qua: dung
    ghi_chu: Hai nghĩa đầu có trong nguồn; nghĩa thứ ba (truyền thông) là cách phân loại của trang, kiểm ở n6–n9, n13.
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1002%252Fjlac.19345140116.zip/10.1002%252Fjob.714.pdf" ]
    luot_2_ghi_chu: Phần 'EQ trên truyền thông' là cách phân loại của trang (xem n6–n9, n71); hai nghĩa đầu khớp tài liệu.
  - id: n2
    cau: Hai nghĩa EQ (tính cách, năng lực) được khoa học đo bằng hai cách khác nhau và cho ra hai kết luận khác nhau về việc EQ có dự báo thành công hay không.
    loai: phat-hien
    nguon:
      - jn2010
    trich: mixed-based EI is an empirically stronger (albeit theoretically weaker) predictor of job performance than is ability-based EI
    vi_tri: jn2010, Introduction
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "hai cách hoàn toàn khác — và cho ra hai kết luận hoàn toàn khác". Chữ mới: "hai cách khác nhau … hai kết luận khác nhau". Lý do: nguồn cho thấy hai dòng khác nhau về độ mạnh dự báo (ρ ≈ .17 so với .42), không phải đối lập hoàn toàn. Ví dụ Hùng và Mai là tình huống giả định (gia-dinh). Review (Claude Opus 5.5, 10/11/2026): dung. Khớp Joseph & Newman 2010 (ability so với mixed).'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf" ]
    review: dung
  - id: n3
    cau: 'Năm 1990 Salovey và Mayer đăng một bài báo lý thuyết đặt ra khái niệm trí tuệ cảm xúc: một tập hợp kỹ năng xử lý thông tin liên quan đến cảm xúc.'
    loai: lich-su
    nguon:
      - sm1990
    trich: This article presents a framework for emotional intelligence, a set of skills hypothesized to contribute to the accurate appraisal and expression of emotion in oneself and in others, the effective regulation of emotion in self and others, and the use of feelings to motivate, plan, and achieve in one's life.
    vi_tri: sm1990, Abstract
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.2190.zip/10.2190%252FDUGG-P24E-52WK-6CDG.pdf", "https://doi.org/10.2190/DUGG-P24E-52WK-6CDG" ]
    luot_2_ghi_chu: Số báo ghi 1989–90, DOI/ghi năm 1990.
  - id: n4
    cau: Khái niệm này chỉ đến được với đông đảo công chúng sau năm 1995 (nhờ cuốn sách của Goleman).
    loai: lich-su
    nguon:
      - time1995
      - locke2005
    trich: coined by Yale psychologist Peter Salovey and the University of New Hampshire's John Mayer five years ago
    vi_tri: 'time1995, đoạn nói về Goleman; locke2005: "Following Salovey and Mayer, Daniel Goleman (1995) popularized the concept of EI"'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Bài báo khi đó gần như không ai để ý." Không có nguồn đã mở nói thẳng điều này (tìm kiếm chỉ thấy nguồn phổ thông). Chữ mới chỉ nói điều nguồn xác nhận: Time 1995 viết khái niệm do Salovey và Mayer đặt ra năm năm trước; Locke 2005 nói Goleman làm nó phổ biến. Review (Claude Opus 5.5, 10/11/2026): dung. Time 1995 (trang 2): khái niệm "about to bound into the national conversation ... thanks to a new book".'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf" ]
    review: dung
  - id: n5
    cau: 'Daniel Goleman, một nhà báo khoa học của New York Times, xuất bản cuốn Emotional Intelligence: Why It Can Matter More Than IQ năm 1995.'
    loai: lich-su
    nguon:
      - time1995
      - jn2010
    trich: Goleman, a Harvard psychology Ph.D. and a New York Times science writer
    vi_tri: 'time1995; jn2010, tài liệu tham khảo: "Goleman, D. (1995). Emotional intelligence: Why it can matter more than IQ"'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "nhà báo khoa học Daniel Goleman" ở thân bài và "phóng viên khoa học của New York Times" ở mục Goleman; mới gộp thành "một nhà báo khoa học của New York Times" theo Time (tả ông là "science writer"). Nhan đề sách khớp danh mục tham khảo của Joseph và Newman (2010). Review (Claude Opus 5.5, 10/11/2026): dung. Lượt 2 nói chức danh không có trong nguồn đã mở. Đã mở Time 1995, trang 2 (content.time.com ...983503-2): "Goleman, a Harvard psychology Ph.D. and a New York Times science writer".'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf" ]
    luot_2_ghi_chu: Chức danh 'nhà báo khoa học của New York Times' không có trong nguồn đã mở (kiến thức chung); nhan đề và năm đúng.
    review: dung
  - id: n6
    cau: Số báo Time ngày 2/10/1995 có bìa "What's Your EQ?".
    loai: lich-su
    nguon:
      - time1995
      - penguin1995
    trich: 'The 1995 Time cover read: "What''s Your EQ? It''s not your IQ. It''s not even a number."'
    vi_tri: 'penguin1995 (reader''s guide); time1995: số ra Monday, Oct. 2, 1995'
    ket_qua: dung
    ghi_chu: "Bài của Gibbs đề ngày 2/10/1995. Reader's guide của Penguin tả bìa cùng năm; trang không ghi ngày bìa, ngày lấy theo số báo của bài Time. Review (Claude Opus 5.5, 10/11/2026): dung. Lượt 2 chưa chắc vì chữ nằm trong ảnh bìa. Đã mở trang bìa (content.time.com/time/covers/0,16641,19951002,00.html: \"Emotional Intelligence - Oct. 2, 1995\") và xem ảnh bìa 1101951002_400.jpg: chữ \"WHAT'S YOUR EQ?\"."
    luot_2: khong-chac
    luot_2_nguon: [ "https://content.time.com/time/covers/0,16641,19951002,00.html", "https://content.time.com/time/subscriber/article/0,33009,983503,00.html" ]
    luot_2_ghi_chu: Xác nhận được số báo, ngày và chủ đề; dòng chữ trên bìa 'What's Your EQ?' là chữ trong ảnh bìa, không đọc được qua văn bản trang đã mở (bản bài đọc cũng bị cắt).
    review: dung
  - id: n7
    cau: Lời quảng bá trên bìa Time nói trí tuệ cảm xúc có thể là yếu tố dự báo thành công trong đời tốt nhất.
    loai: lich-su
    nguon:
      - time1995bia
      - penguin1995
    trich: It's not your IQ. It's not even a number. But emotional intelligence may be the best predictor of success in life, redefining what it means to be smart.
    vi_tri: Ảnh bìa Time 2/10/1995 (content.time.com, ảnh 1101951002_400.jpg)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: dòng chữ đặt trong ngoặc kép "có thể là yếu tố dự báo thành công trong đời tốt nhất" (ở thân bài và ở khung Bác bỏ). Chữ mới: bỏ ngoặc kép, nói "lời quảng bá", "mạnh nhất", theo bản kể lại của Penguin, vì chưa thấy nguyên văn bìa. Review (Claude Opus 5.5, 10/11/2026): dung. Ảnh bìa Time 2/10/1995 (đã xem): "It''s not your IQ. It''s not even a number. But emotional intelligence may be the best predictor of success in life, redefining what it means to be smart." Đổi "mạnh nhất" thành "tốt nhất" cho sát chữ "best" và khớp tiêu đề khung nhãn.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://content.time.com/time/subscriber/article/0,33009,983503,00.html" ]
    luot_2_ghi_chu: Bài nói cảm xúc có thể là thước đo trí thông minh thật sự, nhưng cụm 'yếu tố dự báo thành công trong đời mạnh nhất' trên bìa không đọc được bằng văn bản (chữ trong ảnh bìa).
    review: dung
  - id: n8
    cau: Cuốn sách nằm trong danh sách bán chạy của New York Times hơn một năm.
    loai: so-lieu
    nguon:
      - penguin1995
    trich: more than a full year on the New York Times bestseller list
    vi_tri: penguin1995, reader's guide
    ket_qua: da-bo
    luot_2: khong-chac
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1002%252Fjlac.19345140116.zip/10.1002%252Fjob.714.pdf" ]
    luot_2_ghi_chu: Không nguồn bậc 1–2 đã mở nào nêu thời gian 'hơn một năm' trên danh sách bán chạy.
    ghi_chu: "Review (Claude Opus 5.5, 10/11/2026): sai. Lượt 2 chưa chắc: chỉ có reader's guide của nhà xuất bản (nguồn bậc 3, quảng bá) cho \"hơn một năm\"; không tìm thấy nguồn bậc 1–2. Bỏ câu. Chữ cũ: \"Cuốn sách nằm trong danh sách bán chạy của New York Times hơn một năm, và từ viết tắt EQ lan nhanh trên báo chí.\" Chữ mới: \"Từ viết tắt EQ lan nhanh trên báo chí.\" (n9)."
    review: sai
  - id: n9
    cau: Từ viết tắt EQ lan nhanh trên báo chí.
    loai: lich-su
    nguon:
      - time1995
    trich: handily shortened to EQ, thanks to a new book, Emotional Intelligence (Bantam; $23.95) by Daniel Goleman
    vi_tri: time1995
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "từ EQ trở thành một hiện tượng toàn cầu — khóa học EQ, test EQ, sách dạy con EQ mọc lên khắp nơi, trong đó có Việt Nam". Chữ mới chỉ nói điều Time 1995 xác nhận. Lý do: không có nguồn đã mở cho "hiện tượng toàn cầu" và "khắp nơi"; phần Việt Nam xem n91. Review (Claude Opus 5.5, 10/11/2026): dung. Time 1995 trang 2: "handily shortened to EQ"; chính bài Time và bìa "What''s your EQ?" là dấu vết. "Lan nhanh" là cách nói khái quát, chấp nhận.'
    luot_2: dung
    luot_2_nguon: [ "https://content.time.com/time/subscriber/article/0,33009,983503,00.html" ]
    luot_2_ghi_chu: Câu lịch sử khái quát; có dấu vết trên báo chí (Time) nhưng 'lan nhanh' không đo được.
    review: dung
  - id: n10
    cau: Nhiều nhà nghiên cứu phê bình khái niệm trí tuệ cảm xúc, và cuộc tranh luận vẫn chưa ngã ngũ.
    loai: phat-hien
    nguon:
      - locke2005
      - matthews2002
      - jn2010
    trich: critics remain dubious on the definition and measurement of EI
    vi_tri: jn2010, Discussion
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "giới khoa học bắt đầu cãi nhau dữ dội, và cuộc cãi vã kéo dài đến tận hôm nay". Lý do: nguồn nói phê bình và tranh luận, không có số đo "dữ dội". Review (Claude Opus 5.5, 10/11/2026): dung. Khớp Locke 2005, Matthews 2002, Joseph và cộng sự 2015.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1002%252Fjlac.19345140116.zip/10.1002%252Fjob.318.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf" ]
    review: dung
  - id: n11
