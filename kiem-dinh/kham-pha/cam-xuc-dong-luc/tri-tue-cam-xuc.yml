  - id: n85
    cau: 'Đang tranh cãi: nhắm vào kỹ năng cụ thể (điều tiết cảm xúc) thay vì "nâng EQ" chung chung; theo mô hình thác, trong các nhánh EQ năng lực chỉ điều tiết cảm xúc liên hệ trực tiếp với hiệu suất công việc.'
    loai: nhan
    nguon:
      - jn2010
    nhan: tranh-cai
    co_so:
      - jn2010
    ly_do: "Chỉ một phân tích tổng hợp (Joseph và Newman 2010), mô hình đường dẫn trên dữ liệu tương quan về hiệu suất công việc, chưa tái lập độc lập, chưa có thử nghiệm huấn luyện; lời khuyên là suy rộng từ mô hình: Đang tranh cãi (review D5-L4 hạ từ Khá vững)."
    ket_qua: da-sua
    ghi_chu: 'Tiêu đề mục đưa lời khuyên "luyện kỹ năng cụ thể"; nội dung kiểm ở n86–n87. Review (Claude Opus 5.5, 10/11/2026): sai. Lượt 2 đúng (quá mạnh): mô hình thác là mô hình đường dẫn trên tương quan tổng hợp về hiệu suất công việc, không về "làm việc với người khác" hay quan hệ; chưa có thử nghiệm huấn luyện; chỉ một phân tích tổng hợp. Chữ cũ: tiêu đề "2. Muốn cải thiện quan hệ, luyện kỹ năng cụ thể thay vì "nâng EQ" chung chung :nhan[kha-vung]" và "muốn làm việc với người khác tốt hơn, khâu quyết định là điều tiết cảm xúc". Chữ mới: tiêu đề "2. Nhắm vào kỹ năng cụ thể thay vì "nâng EQ" chung chung :nhan[tranh-cai]" (giữ id cũ bằng { #2-muon-cai-thien-quan-he-luyen-ky-nang-cu-the-thay-vi-nang-eq-chung-chung-kha-vung }) và "trong các nhánh EQ năng lực, chỉ điều tiết cảm xúc liên hệ trực tiếp với hiệu suất công việc ... mô hình tổng hợp tương quan về hiệu suất công việc (không phải về các mối quan hệ)".'
    luot_2: qua-manh
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf" ]
    luot_2_ghi_chu: "câu đúng: Đang tranh cãi: theo mô hình thác (tương quan tổng hợp, về hiệu suất công việc), điều tiết cảm xúc là khâu cuối trong chuỗi; chưa có thử nghiệm huấn luyện cho thấy rèn khâu này giúp làm việc với người khác tốt hơn.; Dữ liệu là tương quan tổng hợp về hiệu suất công việc, không phải về 'làm việc với người khác'; chưa có thử nghiệm huấn luyện. Chỉ hợp ở mức 'đang tranh cãi' (gợi ý)."
    review: sai
