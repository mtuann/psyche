nhan_dinh:
- id: n1
  cau: 'Từ "EQ" đang được dùng cho ba thứ khác nhau: EQ năng lực, EQ tự báo cáo (trait hay mixed), và EQ trên truyền thông.'
  loai: dinh-nghia
  nguon:
  - jn2010
  - mayer2008
  trich: application of the EI label to 2 distinct sets of constructs (i.e., ability-based EI and mixed-based EI)
  vi_tri: jn2010, Abstract
  ket_qua: dung
  ghi_chu: Hai nghĩa đầu có trong nguồn; nghĩa thứ ba (truyền thông) là cách phân loại của trang, kiểm ở n6–n9, n13.
- id: n2
  cau: Hai nghĩa EQ (tính cách, năng lực) được khoa học đo bằng hai cách khác nhau và cho ra hai kết luận khác nhau về việc EQ có dự báo thành công hay không.
  loai: phat-hien
  nguon:
  - jn2010
  trich: mixed-based EI is an empirically stronger (albeit theoretically weaker) predictor of job performance than is ability-based EI
  vi_tri: jn2010, Introduction
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "hai cách hoàn toàn khác — và cho ra hai kết luận hoàn toàn khác". Chữ mới: "hai cách khác nhau … hai kết luận khác nhau". Lý do: nguồn cho thấy hai dòng khác nhau về độ mạnh dự báo (ρ ≈ .17 so với .42), không phải đối lập hoàn toàn. Ví dụ Hùng và Mai là tình huống giả định (gia-dinh).'
- id: n3
  cau: 'Năm 1990 Salovey và Mayer đăng một bài báo lý thuyết đặt ra khái niệm trí tuệ cảm xúc: một tập hợp kỹ năng xử lý thông tin liên quan đến cảm xúc.'
  loai: lich-su
  nguon:
  - sm1990
  trich: This article presents a framework for emotional intelligence, a set of skills hypothesized to contribute to the accurate appraisal and expression of emotion in oneself and in others, the effective regulation of emotion in self and others, and the use of feelings to motivate, plan, and achieve in one's life.
  vi_tri: sm1990, Abstract
  ket_qua: dung
- id: n4
  cau: Khái niệm này chỉ đến được với đông đảo công chúng sau năm 1995 (nhờ cuốn sách của Goleman).
  loai: lich-su
  nguon:
  - time1995
  - locke2005
  trich: coined by Yale psychologist Peter Salovey and the University of New Hampshire's John Mayer five years ago
  vi_tri: 'time1995, đoạn nói về Goleman; locke2005: "Following Salovey and Mayer, Daniel Goleman (1995) popularized the concept of EI"'
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Bài báo khi đó gần như không ai để ý." Không có nguồn đã mở nói thẳng điều này (tìm kiếm chỉ thấy nguồn phổ thông). Chữ mới chỉ nói điều nguồn xác nhận: Time 1995 viết khái niệm do Salovey và Mayer đặt ra năm năm trước; Locke 2005 nói Goleman làm nó phổ biến.'
- id: n5
  cau: 'Daniel Goleman, một nhà báo khoa học của New York Times, xuất bản cuốn Emotional Intelligence: Why It Can Matter More Than IQ năm 1995.'
  loai: lich-su
  nguon:
  - time1995
  - jn2010
  trich: Goleman, a Harvard psychology Ph.D. and a New York Times science writer
  vi_tri: 'time1995; jn2010, tài liệu tham khảo: "Goleman, D. (1995). Emotional intelligence: Why it can matter more than IQ"'
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "nhà báo khoa học Daniel Goleman" ở thân bài và "phóng viên khoa học của New York Times" ở mục Goleman; mới gộp thành "một nhà báo khoa học của New York Times" theo Time (tả ông là "science writer"). Nhan đề sách khớp danh mục tham khảo của Joseph và Newman (2010).'
- id: n6
  cau: Số báo Time ngày 2/10/1995 có bìa "What's Your EQ?".
  loai: lich-su
  nguon:
  - time1995
  - penguin1995
  trich: 'The 1995 Time cover read: "What''s Your EQ? It''s not your IQ. It''s not even a number."'
  vi_tri: 'penguin1995 (reader''s guide); time1995: số ra Monday, Oct. 2, 1995'
  ket_qua: dung
  ghi_chu: Bài của Gibbs đề ngày 2/10/1995. Reader's guide của Penguin tả bìa cùng năm; trang không ghi ngày bìa, ngày lấy theo số báo của bài Time.
- id: n7
  cau: Lời quảng bá trên bìa Time nói trí tuệ cảm xúc có thể là yếu tố dự báo thành công trong đời mạnh nhất.
  loai: lich-su
  nguon:
  - penguin1995
  trich: What's Your EQ? It's not your IQ. It's not even a number.
  vi_tri: penguin1995; phần còn lại của dòng chữ chỉ có ở bản kể lại của Penguin ("may be the strongest predictor of success in life")
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: dòng chữ đặt trong ngoặc kép "có thể là yếu tố dự báo thành công trong đời tốt nhất" (ở thân bài và ở khung Bác bỏ). Chữ mới: bỏ ngoặc kép, nói "lời quảng bá", "mạnh nhất", theo bản kể lại của Penguin, vì chưa thấy nguyên văn bìa.'
- id: n8
  cau: Cuốn sách nằm trong danh sách bán chạy của New York Times hơn một năm.
  loai: so-lieu
  nguon:
  - penguin1995
  trich: more than a full year on the New York Times bestseller list
  vi_tri: penguin1995, reader's guide
  ket_qua: dung
- id: n9
  cau: Từ viết tắt EQ lan nhanh trên báo chí.
  loai: lich-su
  nguon:
  - time1995
  trich: handily shortened to EQ, thanks to a new book, Emotional Intelligence (Bantam; $23.95) by Daniel Goleman
  vi_tri: time1995
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "từ EQ trở thành một hiện tượng toàn cầu — khóa học EQ, test EQ, sách dạy con EQ mọc lên khắp nơi, trong đó có Việt Nam". Chữ mới chỉ nói điều Time 1995 xác nhận. Lý do: không có nguồn đã mở cho "hiện tượng toàn cầu" và "khắp nơi"; phần Việt Nam xem n91.'
- id: n10
  cau: Nhiều nhà nghiên cứu phê bình khái niệm trí tuệ cảm xúc, và cuộc tranh luận vẫn chưa ngã ngũ.
  loai: phat-hien
  nguon:
  - locke2005
  - matthews2002
  - jn2010
  trich: critics remain dubious on the definition and measurement of EI
  vi_tri: jn2010, Discussion
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "giới khoa học bắt đầu cãi nhau dữ dội, và cuộc cãi vã kéo dài đến tận hôm nay". Lý do: nguồn nói phê bình và tranh luận, không có số đo "dữ dội".'
- id: n11
  cau: EQ năng lực là khả năng xử lý thông tin cảm xúc (nhận biết, thấu hiểu, điều tiết), đo bằng bài test giải quyết vấn đề có đáp án đúng/sai như MSCEIT.
  loai: dinh-nghia
  nguon:
  - mayer2008
  - msceit2003
  trich: Some individuals have a greater capacity than others to carry out sophisticated information processing about emotions and emotion-relevant stimuli and to use this information as a guide to thinking and behavior.
  vi_tri: mayer2008, Abstract; msceit2003, mục MSCEIT V2.0
  ket_qua: dung
- id: n12
  cau: EQ tự báo cáo (trait EI hay mixed EI) là người ta tự đánh giá mình, đo bằng bảng hỏi như EQ-i của Bar-On hay thang 33 câu của Schutte, và gần với đo tính cách.
  loai: dinh-nghia
  nguon:
  - pf2001
  - j2015
  - schutte1998
  trich: trait EI can be conceptualized as a distinct composite construct at the primary level of hierarchical trait structures
  vi_tri: 'pf2001, Abstract; j2015, Abstract: mixed EI "commonly called trait EI or mixed EI"'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "EQ-i của Bar-On hay thang của Goleman". Chữ mới: "thang 33 câu của Schutte" (Schutte 1998: thang 33 mục rút từ 62 mục, 346 người lớn, tóm tắt). Lý do: không có nguồn đã mở nói thang của Goleman là bảng hỏi tự báo cáo. EQ-i là thang tự báo cáo theo Petrides và Furnham (2001, nghiên cứu với BarOn EQ-i); sách hướng dẫn kỹ thuật Bar-On 1997 không đọc được.'
- id: n13
  cau: Tuyên bố EQ quyết định thành công hơn IQ (EQ trên truyền thông) không được các phân tích tổng hợp nêu ở dưới ủng hộ.
  loai: phat-hien
  nguon:
  - jn2010
  - j2015
  trich: mixed-based EI is an empirically stronger (albeit theoretically weaker) predictor
  vi_tri: 'jn2010; j2015 Abstract: mixed EI–job performance relationship becomes nil (β = -.02)'
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "tuyên bố này chưa bao giờ được chứng minh". Chữ mới nêu rõ phạm vi (các phân tích tổng hợp đã nêu). Chi tiết số ở n43, n53.'
- id: n14
  cau: Câu hỏi "EQ có thật không?" không có một đáp án duy nhất; đáp án phụ thuộc vào bạn đang hỏi về EQ nào.
  loai: phat-hien
  nguon:
  - jn2010
  trich: relationships between ability-based EI and job performance are shown to be inconsistent
  vi_tri: jn2010, Abstract
  ket_qua: dung
  ghi_chu: Suy luận từ việc hai dòng EQ cho kết quả khác nhau.
- id: n15
  cau: 'Salovey và Mayer (1990) là bài báo lý thuyết, không phải thực nghiệm: hệ thống lại các nghiên cứu rời rạc về cảm xúc và trí tuệ rồi đề xuất khung khái niệm mới.'
  loai: lich-su
  nguon:
  - sm1990
  trich: We then explore the literature on intelligence, and especially social intelligence, to examine the place of emotion in traditional intelligence conceptions. A framework for integrating the research on emotion-related skills is then described.
  vi_tri: sm1990, Abstract
  ket_qua: dung
- id: n16
  cau: Khái niệm "trí tuệ xã hội" có từ đầu thế kỷ 20.
  loai: lich-su
  nguon:
  - jn2010
  - sm1990
  trich: Although EI researchers tend to attribute the first mention of social intelligence to Thorndike (1920; ...), Dewey introduced the concept in 1909
  vi_tri: jn2010, Discussion; sm1990, mục Social Intelligence
  ket_qua: dung
- id: n17
  cau: Bài báo mở đầu bằng câu hỏi "trí tuệ cảm xúc" có phải một mâu thuẫn trong thuật ngữ, vì một truyền thống tư tưởng vẫn coi cảm xúc là thứ cản trở lý trí.
  loai: lich-su
  nguon:
  - sm1990
  trich: Is "emotional intelligence" a contradiction in terms? One tradition in Western thought has viewed emotions as disorganized interruptions of mental activity
  vi_tri: sm1990, mở bài
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "cảm xúc vốn bị xem là thứ đối lập với lý trí". Chữ mới thu hẹp thành "một truyền thống tư tưởng", đúng như bài viết.'
- id: n18
  cau: Salovey và Mayer định nghĩa trí tuệ cảm xúc là khả năng theo dõi cảm xúc của mình và của người khác, phân biệt các cảm xúc, và dùng thông tin đó để dẫn dắt suy nghĩ và hành động.
  loai: dinh-nghia
  nguon:
  - sm1990
  trich: We define emotional intelligence as the subset of social intelligence that involves the ability to monitor one's own and others' feelings and emotions, to discriminate among them and to use this information to guide one's thinking and actions.
  vi_tri: sm1990, mục Emotional Intelligence
  ket_qua: dung
  ghi_chu: Cũng là đáp án quiz câu 1.
- id: n19
  cau: 'Khung gốc gồm ba nhóm kỹ năng: đánh giá và biểu đạt cảm xúc, điều tiết cảm xúc, dùng cảm xúc để thúc đẩy bản thân, lập kế hoạch và đạt mục tiêu.'
  loai: lich-su
  nguon:
  - sm1990
  trich: the accurate appraisal and expression of emotion in oneself and in others, the effective regulation of emotion in self and others, and the use of feelings to motivate, plan, and achieve in one's life
  vi_tri: sm1990, Abstract
  ket_qua: dung
- id: n20
  cau: Sau bảy năm, Mayer và Salovey (1997) tinh chỉnh lý thuyết thành mô hình bốn nhánh, phiên bản "EQ năng lực" chuẩn mà các nghiên cứu sau này dùng.
  loai: lich-su
  nguon:
  - msceit2003
  - mayer2008
  trich: The MSCEIT is intended to measure four branches, or skill groups, of EI ... (Mayer & Salovey, 1997).
  vi_tri: msceit2003, Introduction
  ket_qua: dung
  ghi_chu: 'Theo MSCEIT 2003 kể lại: chương sách Mayer và Salovey 1997 không đọc được. "Chuẩn" nghĩa là nền của MSCEIT.'
- id: n21
  cau: 'Bốn nhánh là: nhận biết cảm xúc (khuôn mặt, tranh ảnh), dùng cảm xúc hỗ trợ tư duy (ví dụ niềm vui có thể giúp lên kế hoạch cho một bữa tiệc), thấu hiểu cảm xúc (cảm xúc biến đổi ra sao), quản lý cảm xúc.'
  loai: lich-su
  nguon:
  - msceit2003
  trich: (a) perceiving emotions, (b) using emotions to facilitate thought, (c) understanding emotions, and (d) managing emotions. ... Perceiving emotions is measured with the faces and pictures tasks; ... whether joy may assist planning a party.
  vi_tri: msceit2003, mục The MSCEIT V2.0 và Introduction
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đọc cảm xúc qua khuôn mặt, giọng nói, tranh ảnh" và "tâm trạng vui giúp nảy ra nhiều ý tưởng". Chữ mới theo nhiệm vụ MSCEIT (faces, pictures; joy và kế hoạch bữa tiệc). Lý do: "giọng nói" và "nảy ra nhiều ý tưởng" không có trong nguồn đã mở. Ví dụ bực bội thành giận dữ là minh họa (gia-dinh).'
- id: n22
  cau: EQ năng lực là năng lực xử lý thông tin, đo được bằng bài test có đáp án đúng/sai, không phải tự đánh giá tính cách.
  loai: dinh-nghia
  nguon:
  - mayer2008
  - msceit2003
  trich: EI--conceptualized as an ability--is an important variable both conceptually and empirically
  vi_tri: mayer2008, Abstract
  ket_qua: dung
- id: n23
  cau: Bốn nhánh xếp theo thứ tự của mô hình (nhận biết, hỗ trợ tư duy, thấu hiểu, quản lý).
  loai: lich-su
  nguon:
  - msceit2003
  trich: (a) perceiving emotion accurately, (b) using emotion to facilitate thought, (c) understanding emotion, and (d) managing emotion
  vi_tri: msceit2003, Introduction
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "xếp theo độ phức tạp tăng dần". Lý do: không có nguồn đã mở nói "độ phức tạp" (chương 1997 không đọc được); nguồn chỉ cho thứ tự.'
- id: n24
  cau: Goleman viết một cuốn sách đại chúng, lấy khái niệm của Salovey và Mayer làm điểm xuất phát nhưng mở rộng ra nhiều.
  loai: lich-su
  nguon:
  - locke2005
  trich: Following Salovey and Mayer, Daniel Goleman (1995) popularized the concept of EI.
  vi_tri: locke2005, tr. 426
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "cuốn sách đại chúng tổng hợp nghiên cứu về não bộ, cảm xúc và hành vi, lấy khung của Salovey và Mayer làm điểm xuất phát". Lý do: phần "tổng hợp nghiên cứu về não bộ…" không có nguồn đã mở.'
- id: n25
  cau: Theo mô tả của Locke (2005), Goleman gộp vào EI cả tự thúc đẩy và kiên trì, trì hoãn thỏa mãn, kiềm chế xung động, đồng cảm và kỹ năng xã hội.
  loai: lich-su
  nguon:
  - locke2005
  trich: 'According to Goleman, EI involves: self-motivation and persistence; skill at introspection; delay of gratification; self-control of impulses, moods and emotions; empathy; and social skills'
  vi_tri: locke2005, tr. 426
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "năm thành phần: tự nhận thức, tự điều tiết, động lực, đồng cảm và kỹ năng xã hội … có cả tính cách (như lạc quan, tự tin)". Lý do: danh sách năm thành phần (thuộc các phiên bản sau của Goleman) và "lạc quan, tự tin" không có trong nguồn đã mở; danh sách của Locke lấy từ sách 1995.'
- id: n26
  cau: Khái niệm bị mở rộng từ "năng lực" sang một "hỗn hợp" (mixed model) gồm năng lực, tính cách và động cơ, khiến nó hấp dẫn với công chúng nhưng khó kiểm chứng.
  loai: phat-hien
  nguon:
  - mayer2008
  - jn2010
  trich: a schism has developed in which some researchers focus on EI as a distinct group of mental abilities, and other researchers instead study an eclectic mix of positive traits such as happiness, self-esteem, and optimism
  vi_tri: 'mayer2008, Abstract; jn2010: "a grab-bag of everything that is not cognitive ability"'
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Goleman đã lặng lẽ đổi định nghĩa EQ"; "hấp dẫn với công chúng" là nhận xét của trang. Chữ mới: "khái niệm đã được mở rộng".'
- id: n27
  cau: Bài của Time (1995) ghi Goleman không hề dùng chữ EQ trong sách; chữ EQ do báo chí rút gọn từ nhan đề.
  loai: lich-su
  nguon:
  - time1995
  trich: Goleman never even uses the phrase EQ in his book.
  vi_tri: time1995
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "bản thân Goleman cho biết ông chuộng cách viết tắt EI hơn EQ" dẫn Penguin reader''s guide. Lý do: reader''s guide không nói điều đó (đã đọc). Thay bằng câu của Time.'
- id: n28
  cau: MSCEIT là bài test giải các nhiệm vụ cảm xúc (nhìn khuôn mặt cho biết cảm xúc, dự đoán cảm xúc chuyển biến ra sao), không có tự đánh giá.
  loai: dinh-nghia
  nguon:
  - msceit2003
  trich: In the changes task (20 free-standing items), respondents select an emotion that results from the intensification of another feeling.
  vi_tri: msceit2003, mục The MSCEIT V2.0
  ket_qua: dung
- id: n29
  cau: Bài báo kiểm định MSCEIT V2.0 trên 2.112 người trong mẫu chuẩn hóa và 21 chuyên gia về cảm xúc.
  loai: so-lieu
  nguon:
  - msceit2003
  trich: Twenty-one emotions experts endorsed many of the same answers, as did 2,112 members of the standardization sample
  vi_tri: msceit2003, Abstract
  ket_qua: dung
- id: n30
  cau: 'Đáp án "đúng" được chấm theo hai cách: theo đa số người bình thường chọn (consensus scoring) và theo các chuyên gia chọn.'
  loai: dinh-nghia
  nguon:
  - msceit2003
  trich: Each score can be calculated according to a general consensus method. ... The other way to score the test is according to an expert scoring method.
  vi_tri: msceit2003, mục General and expert consensus scoring
  ket_qua: dung
- id: n31
  cau: Chuyên gia và đa số chọn nhiều đáp án giống nhau, và chuyên gia đồng thuận với nhau cao hơn, đặc biệt ở những câu có đáp án rõ ràng (như đọc cảm xúc trên khuôn mặt).
  loai: phat-hien
  nguon:
  - msceit2003
  trich: Twenty-one emotions experts endorsed many of the same answers, as did 2,112 members of the standardization sample, and exhibited superior agreement, particularly when research provides clearer answers to test questions (e.g., emotional perception in faces).
  vi_tri: msceit2003, Abstract; tương quan tần suất chọn giữa hai nhóm r(705) = .908
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "chuyên gia và đa số đồng thuận với nhau ở mức cao". Lý do: chữ gần với abstract hơn ("many of the same answers"; "superior agreement" của chuyên gia). Cũng áp cho lý thuyết MSCEIT, Ngộ nhận (đã sửa "chỉ" thành "đặc biệt" theo G1, khớp nguồn).'
- id: n32
  cau: Độ tin cậy của bài test ở mức chấp nhận được.
  loai: so-lieu
  nguon:
  - msceit2003
  trich: The MSCEIT achieved reasonable reliability
  vi_tri: msceit2003, Abstract; toàn bộ test split-half r = .93 (đa số), .91 (chuyên gia)
  ket_qua: dung
- id: n33
  cau: Phân tích nhân tố cho thấy các mô hình một, hai và bốn nhân tố đều khớp khá tốt, mô hình bốn nhân tố khớp nhất.
  loai: phat-hien
  nguon:
  - msceit2003
  trich: There was a progressively better fit of models from the one- to the four-factor model, but all fit fairly well
  vi_tri: msceit2003, mục Confirmatory factor analyses
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "phân tích nhân tố ủng hộ cấu trúc bốn nhánh". Lý do: tác giả kết luận một, hai và bốn nhân tố đều là cách biểu diễn khả dĩ; bốn nhân tố khớp tốt hơn.'
- id: n34
  cau: MSCEIT là một bằng chứng quan trọng cho thấy EQ có thể đo như một năng lực.
  loai: phat-hien
  nguon:
  - msceit2003
  trich: one-, two-, and four-factor models provide viable representations of the EI domain
  vi_tri: msceit2003, Discussion
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "bằng chứng mạnh nhất". Lý do: so sánh "mạnh nhất" không có nguồn; tác giả chính họ nói kết quả chỉ "viable".'
- id: n35
  cau: 'Câu hỏi gai góc: nếu "đúng" nghĩa là "đa số chọn", ta đo năng lực hay đo sự giống đám đông?'
  loai: phat-hien
  nguon:
  - msceit2003
  trich: If the general and the expert consensus diverge too far as to the correct answers on a test, a complication arises, because the two methods yield potentially different scores for each person.
  vi_tri: msceit2003, Introduction
  ket_qua: dung
  ghi_chu: Câu hỏi tu từ; các tác giả tự nêu vấn đề đồng thuận đám đông và chuyên gia, nên không phải điều trang tự đặt ra.
- id: n36
  cau: Joseph và Newman (2010) thực hiện phân tích tổng hợp các nghiên cứu về EQ và hiệu suất công việc và đề xuất mô hình thác.
  loai: lich-su
  nguon:
  - jn2010
  trich: The cascading model of EI is empirically confirmed via meta-analytic data
  vi_tri: jn2010, Abstract
  ket_qua: dung
- id: n37
  cau: 'Mô hình thác: nhận biết cảm xúc, rồi thấu hiểu cảm xúc, rồi điều tiết cảm xúc, rồi hiệu suất công việc.'
  loai: phat-hien
  nguon:
  - jn2010
  trich: emotion perception must causally precede emotion understanding, which in turn precedes conscious emotion regulation and job performance
  vi_tri: jn2010, Abstract
  ket_qua: dung
- id: n38
  cau: Trong mô hình thác chỉ có điều tiết cảm xúc ảnh hưởng trực tiếp đến hiệu suất; hai nhánh trước tác động gián tiếp qua nó.
  loai: phat-hien
  nguon:
  - jn2010
  trich: much of the relationship between emotion perception and emotion regulation is mediated by emotion understanding
  vi_tri: jn2010, mục Results (kiểm định mô hình)
  ket_qua: dung
  ghi_chu: 'Chỗ khó nhỏ: tác giả thấy thêm đường trực tiếp từ nhận biết sang điều tiết (β = .10), nhỏ hơn đường gián tiếp (.23). Không có đường trực tiếp từ hai nhánh trước tới hiệu suất trong mô hình. Câu trên trang giữ đúng về hiệu suất.'
- id: n39
  cau: EQ năng lực tương quan r = .22 với hiệu suất ở công việc đòi hỏi nhiều lao động cảm xúc (4 nghiên cứu, tổng N = 220).
  loai: so-lieu
  nguon:
  - jn2010
  trich: Performance-based EI ... High emotional labor 4 220 .22 .24
  vi_tri: jn2010, Bảng 3 (r = .22, ρ̂ = .24)
  ket_qua: dung
  ghi_chu: 'Theo G1-L04 (ghi chú: không kiểm được; nay đã đọc toàn văn). Hệ số r là chưa hiệu chỉnh.'
- id: n40
  cau: Ở công việc ít đòi hỏi lao động cảm xúc, tương quan của EQ năng lực là r = .00 (3 nghiên cứu, N = 223), và sau khi kiểm soát IQ và tính cách phần đóng góp riêng của nó ở nhóm việc này còn âm.
  loai: so-lieu
  nguon:
  - jn2010
  trich: Low emotional labor 3 223 .00 .01; the semipartial correlation of performance-based EI with job performance was negative for low emotional labor jobs
  vi_tri: jn2010, Bảng 3 và mục Incremental validity (Bảng 5)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "ở công việc ít đòi hỏi lao động cảm xúc (lập trình, kế toán) thì mối liên hệ biến mất, thậm chí hơi âm" (bản G1 đã bỏ "r = .00", "N = 226"). Chữ mới có số kiểm được: r = .00, 3 nghiên cứu, N = 223 (không phải 226). G1 xếp r = .00 vào ĐÁNG NGỜ.'
- id: n41
  cau: EQ năng lực (đo bằng bài test) mới là loại dự báo hiệu suất ở việc nhiều lao động cảm xúc nhưng không ở việc ít lao động cảm xúc; EQ mixed và EQ năng lực tự báo cáo tương quan với hiệu suất ở cả hai loại việc.
  loai: phat-hien
  nguon:
  - jn2010
  trich: Self-report mixed EI ... High emotional labor 4 270 .37 .59; Low emotional labor 3 300 .27 .43
  vi_tri: jn2010, Bảng 3
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "EQ chỉ dự báo hiệu suất ở những công việc đòi hỏi nhiều lao động cảm xúc" (không phân loại EQ). Lý do: với EQ mixed, r = .37 (nhiều lao động cảm xúc) và .27 (ít); với năng lực tự báo cáo r = .20 và .14; chỉ EQ năng lực đo bằng test là ≈ 0 ở việc ít lao động cảm xúc.'
- id: n42
  cau: 'Ví dụ công việc: nhiều lao động cảm xúc như nhân viên bán lẻ, môi giới bất động sản, nhân viên tổng đài; ít lao động cảm xúc như công nhân nhà máy, thợ cơ khí, nhà nghiên cứu phát triển.'
  loai: phat-hien
  nguon:
  - jn2010
  trich: Examples of low emotional labor jobs include military policeman, cigarette factory worker, Air Force mechanic, and research and development scientist; examples of high emotional labor jobs are retail salesperson, real estate agent, call center employee, and residential counselor.
  vi_tri: jn2010, mục Method (mã hóa lao động cảm xúc)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "bán hàng, chăm sóc khách hàng, y tế" và "lập trình, kế toán" (cả ở thân bài và đáp án quiz câu 4). Lý do: y tế, lập trình, kế toán không nằm trong ví dụ của nguồn; chữ mới lấy ví dụ của chính bài. Định nghĩa lao động cảm xúc cũng đổi từ "quản lý cảm xúc của mình và người khác" thành "biểu lộ cảm xúc theo yêu cầu công việc" (mục mã hóa: "expected to express positive emotion as part of this job").'
- id: n43
  cau: EQ năng lực tương quan với hiệu suất ở mức khiêm tốn (ρ ≈ .17) và EQ tự báo cáo/mixed cho con số cao hơn (ρ ≈ .42), đã hiệu chỉnh độ tin cậy của thước đo hiệu suất và hạn chế biên độ.
  loai: so-lieu
  nguon:
  - jn2010
  trich: Job performance .17 .22 .42 ... Note. Correlations with job performance are corrected for attenuation in the criterion and range restriction.
  vi_tri: 'jn2010, Bảng 4 (hàng 10: năng lực dựa trên test .17; tự báo cáo năng lực .22; mixed .42)'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "r ≈ .17, chưa hiệu chỉnh" và "r ≈ .42". Lý do: Bảng 4 ghi các hệ số với hiệu suất đã hiệu chỉnh cho độ tin cậy của tiêu chí và hạn chế biên độ, nên là ρ và không phải "chưa hiệu chỉnh". Cũng dùng ở khung Bác bỏ (n72).'
- id: n44
  cau: EQ mixed là loại có nền tảng lý thuyết yếu hơn EQ năng lực.
  loai: phat-hien
  nguon:
  - jn2010
  trich: mixed-based EI is an empirically stronger (albeit theoretically weaker) predictor of job performance than is ability-based EI
  vi_tri: jn2010, Introduction
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "nền tảng lý thuyết yếu nhất". Lý do: nguồn so sánh hai loại ("weaker"), không xếp hạng "yếu nhất".'
- id: n45
  cau: Khi đưa IQ và Big Five vào mô hình, EQ năng lực đo bằng test gần như không đóng góp thêm (ΔR² = .002 tổng thể).
  loai: so-lieu
  nguon:
  - jn2010
  trich: Change in R2 .002 .015 .017 .023 .037 .009 .142 .196 .078
  vi_tri: 'jn2010, Bảng 5c (mô hình VII: năng lực dựa trên test .002; VIII: tự báo cáo năng lực .023; IX: mixed .142)'
  ket_qua: dung
  ghi_chu: 'Số thêm .002 và .023: chỉ để rõ câu "gần như không đóng góp"; không đưa vào trang.'
- id: n46
  cau: EQ mixed có đóng góp thêm ΔR² = .14 sau khi kiểm soát IQ và Big Five, nhưng các tác giả cho rằng chưa rõ vì sao và khuyên hết sức thận trọng khi dùng nó, vì khái niệm mixed thiếu chặt chẽ.
  loai: so-lieu
  nguon:
  - jn2010
  trich: Exercise extreme caution when using mixed EI measures. Grab-bag measures of EI ... appear to exhibit some incremental validity over cognitive ability and personality measures on average (based on nine studies), but it is not clear why.
  vi_tri: jn2010, Bảng 5c (.142) và Bảng 7
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "các tác giả cảnh báo không nên tin con số này" và dẫn thêm "số liệu lao động cảm xúc tổng hợp trong Côté (2014)". Lý do: tác giả nói chưa rõ vì sao và khuyên thận trọng khi áp dụng, không nói không tin con số; số lao động cảm xúc lấy thẳng từ bài Joseph và Newman, bỏ dẫn Côté ở câu này (Côté vẫn dùng ở khung Tranh cãi).'
- id: n47
  cau: Joseph và Newman, cùng Jin và O'Boyle (2015), quay lại câu hỏi vì sao EQ mixed lại dự báo hiệu suất tốt đến thế.
  loai: lich-su
  nguon:
  - j2015
  trich: These criterion-related validity results are problematic, given the paucity of evidence and the questionable construct validity of mixed EI measures themselves.
  vi_tri: j2015, Abstract
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Vẫn nhóm tác giả trên quay lại". Lý do: bài 2015 có thêm Jin và O''Boyle.'
- id: n48
  cau: Một nghiên cứu báo cáo tương quan hiệu chỉnh tới ρ̂ = .47 giữa EQ mixed và hiệu suất công việc, cao bất thường.
  loai: so-lieu
  nguon:
  - j2015
  - jn2010
  trich: suggesting self-reported/mixed EI is one of the best known predictors of job performance (e.g., ρ = .47; Joseph & Newman, 2010b)
  vi_tri: j2015, Abstract; jn2010, Bảng 3 (mixed ρ̂ = .47)
  ket_qua: dung
- id: n49
  cau: Bài 2015 cập nhật phân tích tổng hợp với hiệu suất theo đánh giá của cấp trên, như bản 2010.
  loai: phat-hien
  nguon:
  - j2015
  trich: whereas Joseph and Newman used a narrower definition of the criterion to include only supervisor-rated job performance
  vi_tri: j2015, Discussion
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "chỉ tính các nghiên cứu dùng đánh giá của cấp trên — loại bỏ đánh giá tự chấm dễ thổi phồng". Lý do: bản 2010 đã dùng đánh giá cấp trên; 2015 cập nhật số nghiên cứu (k = 15 so với 9); không có nguồn nói đánh giá tự chấm "thổi phồng" là lý do.'
- id: n50
  cau: Ước tính mới là ρ̂ = .29.
  loai: so-lieu
  nguon:
  - j2015
  trich: an updated estimate of the meta-analytic correlation between mixed EI and supervisor-rated job performance is ρ̂ = .29
  vi_tri: j2015, Abstract; Bảng 2 (k = 15, N = 2.168)
  ket_qua: dung
- id: n51
  cau: Các thang mixed EI trùng lắp với bảy khái niệm quen thuộc (EQ năng lực, sự tự tin vào năng lực bản thân, tự đánh giá hiệu suất, tính tận tâm, ổn định cảm xúc, hướng ngoại, năng lực nhận thức chung), multiple R = .79.
  loai: so-lieu
  nguon:
  - j2015
  trich: ability EI, self-efficacy, and self-rated performance, in addition to Conscientiousness, Emotional Stability, Extraversion, and general mental ability; multiple R = .79
  vi_tri: j2015, Abstract
  ket_qua: dung
- id: n52
  cau: Multiple R = .79 tương ứng R² = .62, tức khoảng 62% phương sai của thang mixed EI do các khái niệm cũ giải thích.
  loai: so-lieu
  nguon:
  - j2015
  trich: R2 .62
  vi_tri: j2015, Bảng 5 (hồi quy mixed EI theo các biến) và Bảng 6
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "gần như toàn bộ nội dung thang đo đã được các khái niệm cũ bao phủ". Lý do: R² = .62 nghĩa là khoảng 62%, không phải gần như toàn bộ.'
- id: n53
  cau: Sau khi kiểm soát các biến trùng lắp, mối liên hệ giữa mixed EI và hiệu suất công việc gần như biến mất (β = -.02).
  loai: so-lieu
  nguon:
  - j2015
  trich: the mixed EI–job performance relationship becomes nil (β = –.02) after controlling for the set of covariates listed above
  vi_tri: j2015, Abstract
  ket_qua: dung
- id: n54
  cau: 'Kết luận của họ: mixed EI dự báo được hiệu suất không phải vì nó đo một thứ mới, mà vì vô tình đo lại tính cách, sự tự tin và năng lực nhận thức.'
  loai: phat-hien
  nguon:
  - j2015
  trich: mixed EI instruments assess a combination of ability EI and self-perceptions, in addition to personality and cognitive ability
  vi_tri: j2015, Abstract
  ket_qua: dung
- id: n55
  cau: Edwin Locke là đồng tác giả của lý thuyết đặt mục tiêu, một tên tuổi lớn trong tâm lý học tổ chức.
  loai: lich-su
  nguon:
  - locke2005
  trich: 'His goal-setting theory (with Latham) was rated as #1 in importance among 73 management theories.'
  vi_tri: locke2005, tiểu sử tác giả
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "cha đẻ của lý thuyết đặt mục tiêu". Lý do: Locke ghi là lý thuyết "(với Latham)".'
- id: n56
  cau: Bài của Locke (2005) có nhan đề "Why emotional intelligence is an invalid concept" (Vì sao trí tuệ cảm xúc là một khái niệm không hợp lệ).
  loai: lich-su
  nguon:
  - locke2005
  trich: Why emotional intelligence is an invalid concept
  vi_tri: locke2005, nhan đề
  ket_qua: dung
- id: n57
  cau: 'Lập luận của Locke có hai ý: EI không phải một dạng trí tuệ (theo ông là tổ hợp thói quen, kỹ năng, lựa chọn), và được định nghĩa rộng đến mức không còn nghĩa rõ ràng.'
  loai: phat-hien
  nguon:
  - locke2005
  trich: the concept of emotional intelligence (EI) is invalid both because it is not a form of intelligence and because it is defined so broadly and inclusively that it has no intelligible meaning
  vi_tri: 'locke2005, Abstract; tr. 426: "some combination of assorted habits, skills and/or choices"'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "EQ hoặc là trí tuệ áp dụng vào lĩnh vực cảm xúc — thì không phải khái niệm mới; hoặc là một bó tính cách và kỹ năng — thì không phải trí tuệ" (ở thân bài và ở mục Các lý thuyết giải thích: "bài toán logic của Locke", "nếu EQ là bó gồm lạc quan, tự tin, khéo giao tiếp"). Lý do: nguồn không trình bày lưỡng đề này; chữ mới theo abstract và tr. 426.'
- id: n58
  cau: 'Matthews, Zeidner và Roberts (2002) dành cả một cuốn sách (Emotional Intelligence: Science and Myth) để rà soát bằng chứng, kết luận bằng chứng cho một khái niệm EI được xác định rõ còn thưa và bác bỏ một số tuyên bố quá đà trên truyền thông.'
  loai: phat-hien
  nguon:
  - matthews2002
  trich: scientific evidence for a clearly identified construct of EI is sparse ... debunks some of the more extravagant claims that appear in the popular media
  vi_tri: matthews2002, lời giới thiệu sách (OpenAlex)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "kết luận rằng phần lớn những gì được quảng cáo về EQ vượt xa dữ liệu thực tế". Lý do: tóm tắt chỉ nói bằng chứng thưa và "một số" tuyên bố quá đà; sách không đọc toàn văn.'
- id: n59
  cau: 'Vững chắc: EQ tự báo cáo trùng lắp lớn với tính cách Big Five.'
  loai: nhan
  nguon:
  - jn2010
  - j2015
  - oboyle2011
  nhan: vung-chac
  co_so:
  - jn2010
  - j2015
  - oboyle2011
  ly_do: 'Hai phân tích tổng hợp độc lập (Joseph và Newman 2010; Joseph và cộng sự 2015, multiple R = .79) và O''Boyle 2011 (ba dòng EQ tương quan khác nhau với Big Five) cùng chiều; không có thất bại tái lập; kết quả nhất quán qua nhiều thang đo. Giới hạn: dữ liệu chủ yếu từ nghiên cứu nơi làm việc.'
  ket_qua: dung
  ghi_chu: Đạt thước đo Vững chắc (tổng hợp, cùng chiều, không có kết quả ngược).
- id: n60
  cau: Các phân tích tổng hợp đã nêu cho thấy thang EQ tự đánh giá tương quan từ vừa đến mạnh với các đặc điểm Big Five, đặc biệt là ổn định cảm xúc, tận tâm và hướng ngoại.
  loai: so-lieu
  nguon:
  - jn2010
  - j2015
  trich: Self-report mixed EI ... Emotional Stability .45, Extraversion .40, Conscientiousness .33, Agreeableness .36, Openness .26
  vi_tri: jn2010, Bảng 4 (cột mixed EI; r quan sát); j2015, Bảng 2
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Mọi phân tích tổng hợp đều cho cùng một kết quả". Lý do: chỉ có hai bài đã đọc; chữ mới nói "các phân tích đã nêu".'
- id: n61
  cau: Hỏi "bạn có kiểm soát cảm xúc tốt không" cho đáp án khá gần với hỏi "bạn có phải người điềm tĩnh, có tổ chức không" (minh họa).
  loai: phat-hien
  nguon:
  - jn2010
  trich: Self-report mixed EI ... Emotional Stability .45, Conscientiousness .33
  vi_tri: jn2010, Bảng 4
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "gần như trùng với". Lý do: r = .45 và .33 là mức vừa. Ví dụ hai câu hỏi là minh họa (gia-dinh).'
- id: n62
  cau: 'Khá vững: EQ năng lực có một phần trùng với năng lực nhận thức chung.'
  loai: nhan
  nguon:
  - jn2010
  - maccann2014
  nhan: kha-vung
  co_so:
  - jn2010
  - maccann2014
  ly_do: Hai phân tích cùng chiều (tổng hợp Joseph và Newman 2010, ρ̂ = .39 cho nhánh thấu hiểu; mô hình phân cấp MacCann 2014 trên 688 sinh viên), nhưng mức trùng lắp chính xác còn tranh cãi, chưa có tái lập lớn, mẫu của MacCann là sinh viên Mỹ nên chưa đạt Vững chắc.
  ket_qua: dung
  ghi_chu: 'Khớp trang nhà kham-pha/tri-tue/tri-tue-la-gi: "điểm các bài đo EQ tương quan dương với IQ" (Waterhouse 2006). Trang nhà không có nhãn riêng cho câu này.'
- id: n63
  cau: 'EQ dạng năng lực (MSCEIT) tương quan có ý nghĩa với IQ, đặc biệt ở nhánh "thấu hiểu cảm xúc": ρ = .39 với năng lực nhận thức chung.'
  loai: so-lieu
  nguon:
  - jn2010
  trich: Cognitive ability ... Emotion understanding 20 4,581 .31 .39
  vi_tri: jn2010, Bảng 3 (r = .31, ρ̂ = .39; k = 20, N = 4.581)
  ket_qua: dung
  ghi_chu: 'Theo G1-L04 (ghi chú: không kiểm được, nay đọc toàn văn). Hệ số ρ̂ = .39 với "cognitive ability" (trang viết nhân tố g).'
- id: n64
  cau: 'MacCann và cộng sự (2014): EQ năng lực là một "nhân tố tầng hai" của trí tuệ, nằm trong cùng hệ phân cấp với g.'
  loai: phat-hien
  nguon:
  - maccann2014
  trich: a hierarchical solution (with cognitive g at the highest level and EI representing a 2nd-stratum factor that loads onto g at λ = .80)
  vi_tri: maccann2014, Abstract
  ket_qua: dung
  ghi_chu: Trang gọi "nhân tố g"; nguồn nói "cognitive g". Mẫu 688 sinh viên.
- id: n65
  cau: Mức độ trùng lắp chính xác giữa EQ năng lực và năng lực nhận thức vẫn còn tranh cãi.
  loai: phat-hien
  nguon:
  - maccann2014
  trich: 'adequate fit for 2 models: (a) an oblique 8-factor model ... and (b) a hierarchical solution'
  vi_tri: maccann2014, Abstract
  ket_qua: dung
  ghi_chu: Hai mô hình đều khớp, nên chưa kết luận được chỉ bằng dữ liệu của bài này.
- id: n66
  cau: 'Đang tranh cãi: EQ có dự báo hiệu suất công việc vượt ra ngoài IQ và tính cách hay không.'
  loai: nhan
  nguon:
  - oboyle2011
  - j2015
  - jn2010
  nhan: tranh-cai
  co_so:
  - oboyle2011
  - j2015
  - jn2010
  ly_do: 'Các tổng hợp chất lượng cao mâu thuẫn: O''Boyle 2011 thấy giá trị dự báo gia tăng ở các dòng tự báo cáo; Joseph và cộng sự 2015 thấy gần như bằng không (β = -.02) sau khi kiểm soát; Joseph và Newman 2010 thấy EQ năng lực gần như không thêm gì và mixed thêm ΔR² = .14 không rõ vì sao. Khớp "bằng chứng chất lượng cao mâu thuẫn nhau".'
  ket_qua: dung
- id: n67
  cau: 'O''Boyle và cộng sự (2011): cả ba dòng đo EQ đều tương quan hiệu chỉnh .24–.30 với hiệu suất, và hai dòng dựa trên tự báo cáo có giá trị dự báo gia tăng lớn nhất sau khi kiểm soát IQ và Big Five.'
  loai: so-lieu
  nguon:
  - oboyle2011
  trich: The three streams have corrected correlations ranging from 0.24 to 0.30 with job performance. ... Streams 2 and 3 have the largest incremental validity beyond cognitive ability and the Five Factor Model (FFM).
  vi_tri: oboyle2011, Abstract
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "vẫn giữ được một phần giá trị dự báo gia tăng sau khi kiểm soát IQ và Big Five" (cho cả ba dòng). Lý do: abstract chỉ nói dòng 2 và 3 có giá trị gia tăng lớn nhất.'
- id: n68
  cau: 'Joseph và cộng sự (2015): với dòng mixed EI, giá trị gia tăng sụp đổ về gần bằng không (β = -.02) khi kiểm soát đầy đủ.'
  loai: so-lieu
  nguon:
  - j2015
  trich: the mixed EI–job performance relationship becomes nil (β = –.02)
  vi_tri: j2015, Abstract
  ket_qua: dung
- id: n69
  cau: 'Một điểm các nghiên cứu cùng thấy: hiệu quả của EQ phụ thuộc loại công việc; việc càng đòi hỏi lao động cảm xúc, EQ càng có đất dụng võ.'
  loai: phat-hien
  nguon:
  - jn2010
  - cote2014
  trich: 'EQ năng lực: High emotional labor .22 (ρ̂ .24); Low emotional labor .00 (ρ̂ .01) (jn2010); Côté: support for the situation-specific and moderator models suggests that the organizational context and employee dispositions should be considered'
  vi_tri: jn2010, Bảng 3; cote2014, Abstract
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Điểm đồng thuận duy nhất: …" (không nguồn nói "duy nhất"). Chữ mới có dẫn hai nguồn.'
- id: n70
  cau: 'Đã bị bác bỏ: EQ là yếu tố dự báo thành công trong đời tốt nhất, quan trọng hơn IQ.'
  loai: nhan
  nguon:
  - jn2010
  - j2015
  nhan: bac-bo
  co_so:
  - jn2010
  - j2015
  ly_do: 'Không phân tích tổng hợp nào đã đọc ủng hộ: EQ năng lực ρ ≈ .17 so với năng lực nhận thức ≈ .40 với hiệu suất (Joseph và Newman 2010, Bảng 4); EQ mixed ρ ≈ .42 ở bản 2010 nhưng hạ còn .29 và bằng không sau kiểm soát (2015). Không nghiên cứu nào đo "thành công trong đời".'
  ket_qua: dung
  ghi_chu: 'Chỗ khó: "Đã bị bác bỏ" cho một thông điệp quảng cáo rộng ("thành công trong đời"), bằng chứng chỉ đo hiệu suất công việc; đề nghị review cân nhắc có hạ thành "Đang tranh cãi" hay không. Chữ ở trang đã nói rõ đây là thông điệp truyền thông.'
- id: n71
  cau: Đây là thông điệp trên trang bìa Time năm 1995, không phải kết luận khoa học.
  loai: lich-su
  nguon:
  - penguin1995
  - time1995
  trich: What's Your EQ? It's not your IQ. It's not even a number.
  vi_tri: penguin1995
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ có dẫn nguyên câu trong ngoặc kép: "có thể là yếu tố dự báo thành công trong đời tốt nhất". Xem n7.'
- id: n72
  cau: 'Chúng tôi không tìm thấy phân tích tổng hợp nào ủng hộ thông điệp ấy: EQ năng lực tương quan với hiệu suất ρ ≈ .17, thấp hơn năng lực nhận thức (≈ .40); EQ mixed cao hơn (≈ .42) nhưng phần lớn là tính cách, sự tự tin và IQ "đội lốt".'
  loai: so-lieu
  nguon:
  - jn2010
  - j2015
  trich: Job performance .17 .22 .42 .19c .10c .07c .09c .06c .40d
  vi_tri: jn2010, Bảng 4 (cột 9 "Cognitive ability" .40, theo Hunter & Hunter 1984); j2015, Abstract
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Không có phân tích tổng hợp nào ủng hộ nó: mối liên hệ … ở mức khiêm tốn…". Lý do: khẳng định phủ định mạnh; chữ mới nói "chúng tôi không tìm thấy" và thêm số. Hunter & Hunter 1984 là nguồn của .40 trong bảng của Joseph và Newman.'
- id: n73
  cau: EQ năng lực (Salovey và Mayer 1990; Mayer và Salovey 1997) khác EQ tự báo cáo/trait/mixed (Bar-On với EQ-i năm 1997; Goleman; thang 33 câu của Schutte và cộng sự 1998) và EQ truyền thông (lời hứa thành công).
  loai: lich-su
  nguon:
  - jn2010
  - schutte1998
  - mayer2008
  trich: A factor analysis of the responses of 346 adults suggested the creation of a 33-item scale
  vi_tri: 'schutte1998, tóm tắt (Nova Southeastern University); jn2010, tài liệu tham khảo: Bar-On (1997), EQ-i'
  ket_qua: dung
  ghi_chu: Bar-On 1997 chỉ kiểm được qua danh mục tham khảo của jn2010 và petrides2001 (EQ-i là thang tự báo cáo). Xếp Goleman vào mixed theo mayer2008 và jn2010.
- id: n74
  cau: Khi ai đó nói "khoa học đã chứng minh EQ quan trọng hơn IQ", hãy hỏi lại họ nói về EQ nào, đo bằng gì.
  loai: loi-khuyen
  nguon:
  - jn2010
  trich: It is critical to distinguish these two, because measures based on the two EI definitions do not have the same content, predictive validity, or subgroup differences.
  vi_tri: jn2010, Bảng 7 (khuyến nghị 1)
  ket_qua: dung
- id: n75
  cau: Tự báo cáo "đụng" tính cách vì nội dung câu hỏi giống nhau (ví dụ minh họa của trang) và vì cùng phương pháp tự đánh giá (yếu tố phương pháp tự báo cáo).
  loai: phat-hien
  nguon:
  - jn2010
  - j2015
  trich: self-reported ability EI greatly reflects the self-report method factor and does a poor job of reflecting the ability EI trait factor
  vi_tri: jn2010, mục Discriminant validity
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "người lạc quan có xu hướng chấm mình cao ở mọi thang tích cực". Lý do: không có nguồn đã mở cho hành vi này; chữ mới theo kết luận về yếu tố phương pháp. Hai câu ví dụ là minh họa của trang (gia-dinh), đã ghi "ví dụ minh họa".'
- id: n76
  cau: Petrides và Furnham (2001) đề xuất gọi dòng EQ tự báo cáo là trait EI và xem nó như một khía cạnh của tính cách.
  loai: lich-su
  nguon:
  - pf2001
  trich: trait EI can be conceptualized as a distinct composite construct at the primary level of hierarchical trait structures
  vi_tri: pf2001, Abstract
  ket_qua: dung
  ghi_chu: '"Một cách gọi trung thực hơn là ''trí tuệ''" là nhận xét của trang, không phải của nguồn; nguồn kết luận trait EI là cấu trúc tổng hợp riêng ở mức cơ bản của hệ tính cách.'
- id: n77
  cau: Mayer, Salovey và Caruso (2008) đáp lại bằng cách phân biệt EI như một nhóm năng lực với một "hỗn hợp các nét tích cực" như hạnh phúc, tự trọng, lạc quan, và chỉ bảo vệ dòng năng lực.
  loai: lich-su
  nguon:
  - mayer2008
  trich: some researchers focus on EI as a distinct group of mental abilities, and other researchers instead study an eclectic mix of positive traits such as happiness, self-esteem, and optimism
  vi_tri: mayer2008, Abstract
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "siết chặt định nghĩa về dòng năng lực và từ chối bảo vệ dòng mixed — một sự nhượng bộ đáng kể". Lý do: "nhượng bộ" và "từ chối bảo vệ" là diễn giải; abstract chỉ nói phân biệt hai loại và EI như năng lực có giá trị.'
- id: n78
  cau: Chấm điểm theo đồng thuận (consensus scoring) nghĩa là "đúng" = "đa số chọn"; đa số có thể sai, và chính các tác giả nêu vấn đề khi đáp án đám đông và chuyên gia lệch nhau.
  loai: phat-hien
  nguon:
  - msceit2003
  trich: If the general and the expert consensus diverge too far as to the correct answers on a test, a complication arises
  vi_tri: msceit2003, Introduction
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Đa số có thể sai — nhất là với những câu hỏi cảm xúc tinh tế, nơi chuyên gia và đám đông bất đồng". Lý do: "câu tinh tế" không có trong nguồn.'
- id: n79
  cau: Bài báo 2003 cho thấy các chuyên gia đồng thuận vượt trội rõ nhất ở những câu có đáp án rõ ràng (như đọc cảm xúc trên khuôn mặt).
  loai: phat-hien
  nguon:
  - msceit2003
  trich: exhibited superior agreement, particularly when research provides clearer answers to test questions (e.g., emotional perception in faces)
  vi_tri: msceit2003, Abstract
  ket_qua: dung
  ghi_chu: 'Đã sửa ở G1 ("chỉ" thành "đặc biệt"); chữ hiện trên trang khớp đề xuất của G1 và nguồn (đối chiếu lại). Xuất hiện ở bốn chỗ: mục Các lý thuyết, Ngộ nhận.'
- id: n80
  cau: Đo cảm xúc khó "sạch" như đo toán (nhận xét của trang, rút từ khó khăn của chấm theo đồng thuận).
  loai: phat-hien
  nguon:
  - msceit2003
  trich: the applied use of EI tests must proceed with great caution
  vi_tri: msceit2003, Discussion
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "không bao giờ ''sạch''" (hai chỗ: Các lý thuyết giải thích, Ngộ nhận). Lý do: "không bao giờ" quá tuyệt đối; tác giả chỉ nói phải dùng hết sức thận trọng.'
- id: n81
  cau: Đừng mua "test EQ online" để đo trí tuệ.
  loai: nhan
  nguon:
  - jn2010
  - j2015
  - pf2001
  nhan: vung-chac
  co_so:
  - jn2010
  - j2015
  - pf2001
  ly_do: 'Mở rộng từ khung Vững chắc về trùng lắp tự báo cáo–tính cách: tổng hợp (jn2010, j2015) và pf2001 cùng chiều. Lời khuyên giới hạn ở thang tự báo cáo; không áp cho MSCEIT.'
  ket_qua: dung
  ghi_chu: Nhãn nằm ở tiêu đề mục; nội dung kiểm ở n82–n84.
- id: n82
  cau: Các bảng hỏi EQ tự báo cáo là bạn tự chấm mình khéo léo, điềm tĩnh, đồng cảm đến đâu; kết quả phản ánh cách bạn nhìn mình và một phần tính cách Big Five nhiều hơn là năng lực xử lý cảm xúc thật sự.
  loai: phat-hien
  nguon:
  - jn2010
  - j2015
  trich: self-reported ability EI greatly reflects the self-report method factor and does a poor job of reflecting the ability EI trait factor
  vi_tri: jn2010, mục Discriminant validity
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Hầu hết các bài test EQ trên mạng là bảng hỏi tự báo cáo". Lý do: không có khảo sát về các test trên mạng; chữ mới nói về bảng hỏi tự báo cáo nói chung (EQ-i, thang Schutte).'
- id: n83
  cau: Điểm tự báo cáo về "năng lực" chỉ tương quan yếu (r = .12) với điểm đo bằng bài test năng lực.
  loai: so-lieu
  nguon:
  - jn2010
  trich: convergent validity ... the correlation to be quite weak (ρ̂ Self-Report Ability.Performance-Based Ability = .12)
  vi_tri: jn2010, mục Discriminant, Convergent, and Incremental Validity; Bảng 4
  ket_qua: da-sua
  ghi_chu: Câu mới thêm vào trang (chữ cũ không có số).
- id: n84
  cau: Dùng bảng hỏi EQ để quyết định tuyển ai, cho con học gì thì nên hết sức thận trọng.
  loai: loi-khuyen
  nguon:
  - jn2010
  trich: Exercise extreme caution when using mixed EI measures. ... use of these measures for personnel decisions may be difficult to defend, without extensive local validation.
  vi_tri: jn2010, Bảng 7 (khuyến nghị 2)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "thì là lạm dụng". "Cho con học gì" nằm ngoài nguồn (nguồn nói về tuyển dụng); giữ như mở rộng hợp lý, ghi rõ đây là suy luận.'
- id: n85
  cau: 'Khá vững: muốn làm việc với người khác tốt hơn, khâu quyết định là điều tiết cảm xúc (theo mô hình thác).'
  loai: nhan
  nguon:
  - jn2010
  nhan: kha-vung
  co_so:
  - jn2010
  ly_do: Chỉ một phân tích tổng hợp (mô hình thác xác nhận bằng dữ liệu tổng hợp, tương quan), chưa tái lập độc lập, chưa có thử nghiệm huấn luyện.
  ket_qua: dung
  ghi_chu: Tiêu đề mục đưa lời khuyên "luyện kỹ năng cụ thể"; nội dung kiểm ở n86–n87.
- id: n86
  cau: 'Mô hình thác gợi ý một thứ tự ưu tiên: khâu quyết định là điều tiết cảm xúc; đây là gợi ý từ mô hình tổng hợp tương quan, chưa phải kết quả của thử nghiệm huấn luyện.'
  loai: loi-khuyen
  nguon:
  - jn2010
  trich: Hypothesis 5 ... emotion regulation → job performance (path .12)
  vi_tri: jn2010, mục Results
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đây là kỹ năng có thể luyện (kỹ thuật hít thở, đặt tên cảm xúc, trì hoãn phản ứng)". Lý do: không có nguồn đã mở cho khả năng luyện hay các kỹ thuật; chữ mới nói rõ giới hạn và dẫn bài Nén cảm xúc có tốt? Thêm "mục tiêu cụ thể rõ ràng hơn "nâng EQ lên 10 điểm"" là nhận xét của trang.'
- id: n87
  cau: Cách điều tiết cảm xúc được bàn ở bài "Nén cảm xúc có tốt?".
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm: kham-pha/cam-xuc-dong-luc/dieu-tiet-cam-xuc có trong src/data/trang.yml, tiêu đề "Nén cảm xúc có tốt?"; đường dẫn đúng.'
- id: n88
  cau: 'Tuyển dụng (nhãn Đang tranh cãi): nội dung thang tự báo cáo trùng lắp với tính cách và năng lực nhận thức, và chưa rõ nó đo gì, nên Joseph và Newman (2010) khuyên hết sức thận trọng khi dùng chúng để ra quyết định nhân sự.'
  loai: loi-khuyen
  nguon:
  - jn2010
  trich: we caution against their application in organizations. That is, without further investigation of the constructs that mixed EI measures assess, selection practitioners will be relying upon inventories with limited construct validity
  vi_tri: jn2010, Discussion
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "thang tự báo cáo dễ ''diễn'' (ai cũng biết nên chọn đáp án ''tôi luôn bình tĩnh'')" và "hãy đo thẳng tính cách Big Five và năng lực nhận thức". Lý do: không có nguồn đã mở cho "dễ diễn" và cho lời khuyên đo thẳng Big Five. Nhãn Đang tranh cãi giữ vì tranh luận về giá trị gia tăng (khung Tranh cãi).'
- id: n89
  cau: Với EQ năng lực (MSCEIT), giá trị trong tuyển dụng vẫn đang tranh cãi và phụ thuộc loại công việc.
  loai: nhan
  nguon:
  - jn2010
  - oboyle2011
  nhan: tranh-cai
  co_so:
  - jn2010
  - oboyle2011
  ly_do: Hai tổng hợp cho kết quả khác nhau về giá trị gia tăng; phụ thuộc loại công việc (r = .22 so với .00). Khớp khung Tranh cãi của trang.
  ket_qua: dung
- id: n90
  cau: 'Khá vững: người khéo ăn khéo nói chưa chắc đã giỏi đọc cảm xúc qua một bài test khách quan; điểm EQ năng lực chỉ tương quan yếu với Big Five (r từ .12 đến .25).'
  loai: nhan
  nguon:
  - jn2010
  trich: '1. Performance-based ability EI: Conscientiousness .12, Emotional Stability .17, Agreeableness .25, Extraversion .15, Openness .18'
  vi_tri: jn2010, Bảng 4
  nhan: kha-vung
  co_so:
  - jn2010
  ly_do: Một tổng hợp chất lượng tốt (Joseph và Newman 2010), một nghiên cứu độc lập; hệ số thấp nhưng cùng chiều. Chưa có tái lập; kết luận phụ thuộc cách đo.
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Người khéo … có thể đơn giản là hướng ngoại + dễ chịu + tận tâm … Ngược lại, người trầm tính, vụng giao tiếp vẫn có thể đọc vị cảm xúc người khác rất chính xác." Lý do: không có nguồn đã mở cho phần "ngược lại"; chữ mới dùng hệ số Bảng 4. Câu "khéo ăn khéo nói" là ví dụ minh họa.'
- id: n91
  cau: 'Ở Việt Nam, các khóa học EQ đang thành một xu hướng: người trưởng thành tìm đến các khóa đào tạo EQ để xử lý căng thẳng và các mối quan hệ (VnExpress, 2024).'
  loai: thoi-su
  nguon:
  - vnexpress2024
  trich: EQV's clients are mostly "aged 18-40"
  vi_tri: vnexpress2024 (bài đề ngày 22/7/2024)
  het_han: '2027-11-01'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "các khóa học EQ cho trẻ em được quảng cáo rầm rộ — từ lớp kỹ năng sống đến trại hè rèn EQ". Lý do: bài đã đọc nói về khóa cho người trưởng thành, không nói trẻ em; không tìm được nguồn cho trại hè rèn EQ.'
- id: n92
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy đánh giá độc lập nào về hiệu quả của các khóa học EQ thương mại ở Việt Nam, cũng như khảo sát nào về việc các khóa ấy dạy theo nghĩa năng lực hay nghĩa mixed.
  loai: thoi-su
  nguon:
  - tim-kiem-vn
  vi_tri: Crossref 10/11/2026, hai truy vấn về hiệu quả đào tạo EQ ở Việt Nam
  het_han: '2028-11-01'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "chưa có đánh giá độc lập nào về hiệu quả … và hầu hết chúng dạy theo nghĩa mixed EI (tự tin, giao tiếp, lạc quan)". Lý do: "hầu hết dạy mixed" không có nguồn, bỏ; thêm mốc 11/2026. Chưa tìm Google Scholar hay tạp chí trong nước.'
- id: n93
  cau: Phân tích tổng hợp của Elfenbein và Ambady (2002) thấy cảm xúc được nhận ra chính xác hơn khi người biểu lộ và người nhận cùng một nhóm văn hóa.
  loai: phat-hien
  nguon:
  - elfenbein2002
  trich: Accuracy was higher when emotions were both expressed and recognized by members of the same national, ethnic, or regional group, suggesting an in-group advantage.
  vi_tri: elfenbein2002, Abstract
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "các nền văn hóa Á Đông, trong đó có Việt Nam, thường có quy tắc thể hiện cảm xúc kiềm chế hơn — ít bộc lộ cảm xúc mạnh ra mặt" và "Văn hóa Việt Nam vốn đề cao ''khéo ăn khéo nói''… ''khéo'' gần với sự tinh tế xã hội…" (hai câu bị bỏ: không có nguồn; câu thứ nhất khái quát về cả Á Đông và Việt Nam). Chữ mới dẫn kết quả tổng hợp. Trang Cảm xúc cơ bản (cùng lô) cũng dẫn Elfenbein và Ambady.'
- id: n94
  cau: Mẫu chuẩn hóa của MSCEIT chủ yếu là người Mỹ (1.240 trong 2.112 người), làm bài bằng tiếng Anh, không có người Việt.
  loai: so-lieu
  nguon:
  - msceit2003
  trich: Most participants were from the United States (1,240), with others from South Africa (231), India (194), the Philippines (170), the United Kingdom (115), Scotland (122), and Canada (37); all testing was conducted in English.
  vi_tri: msceit2003, mục Participants
  ket_qua: da-sua
  ghi_chu: 'Chữ mới. Chữ cũ: "được chuẩn hóa trên mẫu phương Tây … một người Việt Nam đọc khuôn mặt theo chuẩn Việt Nam có thể bị chấm ''sai'' theo chuẩn Mỹ". Lý do: mẫu có 34% người châu Á và nhiều nước, nên "phương Tây" không đúng; câu "chấm sai theo chuẩn Mỹ" là suy luận của trang, đã ghi rõ là suy luận.'
- id: n95
  cau: Việc đó đặt câu hỏi về tính công bằng của các bài test nhận biết cảm xúc trên khuôn mặt khi dùng cho người Việt; đây là suy luận của chúng tôi, chưa có nghiên cứu kiểm tra trực tiếp.
  loai: phat-hien
  nguon:
  - elfenbein2002
  - msceit2003
  trich: all testing was conducted in English
  vi_tri: msceit2003; elfenbein2002
  ket_qua: dung
  ghi_chu: Câu suy luận đã ghi rõ là suy luận; vẫn có nguồn cho hai tiền đề.
- id: n96
  cau: Nguyen và cộng sự (2020) khảo sát 1.593 học sinh Việt Nam bằng bản dịch tiếng Việt của thang TEIQue, thấy nam sinh có điểm EI chung cao hơn nữ sinh và sự ấm áp của cha mẹ liên quan đến EI cao hơn ở con.
  loai: so-lieu
  nguon:
  - nguyen2020
  trich: Results from 1,593 students revealed that boys had significantly higher overall EI, Well-Being, and Self-Control subscale scores than girls. The warmth of parents during childhood was associated with higher EI
  vi_tri: nguyen2020, Abstract
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "1.593 thanh thiếu niên", "nam giới điểm cao hơn nữ giới". Lý do: nguồn nói "students"/"adolescents" (học sinh) và "boys"/"girls"; tránh đọc thành người trưởng thành. Theo G1-L04: KHỚP abstract.'
- id: n97
  cau: Lê (2025) khảo sát 256 sinh viên sư phạm TP.HCM bằng thang REIS; Nguyễn Minh Anh và cộng sự (2025) khảo sát 164 sinh viên năm nhất bằng thang BarOn EQ-i.
  loai: so-lieu
  nguon:
  - le2025
  - nguyenma2025
  trich: Mẫu nghiên cứu gồm 164 sinh viên … thang đo trí tuệ cảm xúc BarOn EQ-i
  vi_tri: 'le2025: 256 sinh viên Trường ĐH Sư phạm TP.HCM, REIS; nguyenma2025, tóm tắt'
  ket_qua: dung
  ghi_chu: 'Theo G1-L04: tìm thấy và khớp. Đã mở trang tạp chí của Lê và cộng sự (tập 1, số 98, 20/6/2025, 256 sinh viên, REIS) và tóm tắt Nguyễn Minh Anh. Chữ "chưa truy được bản công bố gốc" đã bỏ khỏi trang theo G1 (đối chiếu lại: chữ hiện trên trang khớp đề xuất). Chưa xác nhận REIS là bảng hỏi tự báo cáo.'
- id: n98
  cau: Các nghiên cứu ấy đều dùng thang đo (TEIQue, REIS, BarOn EQ-i), không phải bài test năng lực kiểu MSCEIT.
  loai: phat-hien
  nguon:
  - nguyen2020
  - le2025
  - nguyenma2025
  vi_tri: nguyen2020; le2025; nguyenma2025
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "tất cả đều dùng thang tự báo cáo và mang tính mô tả". Lý do: chưa xác nhận REIS là tự báo cáo, và Nguyen 2020 có phân tích hồi quy nên không chỉ mô tả; chữ mới nói điều xác nhận được.'
- id: n99
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào trên mẫu Việt Nam kiểm định mô hình EQ năng lực (MSCEIT) hay đo giá trị dự báo gia tăng của EQ so với IQ và tính cách.
  loai: thoi-su
  nguon:
  - tim-kiem-vn
  vi_tri: Crossref 10/11/2026, ba truy vấn đầu trong lần tìm
  het_han: '2028-11-01'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Chúng tôi chưa tìm thấy nghiên cứu nào…" (không mốc). Chữ mới thêm mốc. Lần tìm: Crossref, ba truy vấn nêu ở nguồn; OpenAlex bị giới hạn lượt gọi nên không dùng được; chưa tìm Google Scholar hay tạp chí trong nước.'
- id: n100
  cau: Các con số về "EQ dự báo hiệu suất" trong bài lấy từ các phân tích tổng hợp quốc tế, không tách riêng người Việt; áp dụng sang Việt Nam cần thận trọng.
  loai: phat-hien
  nguon:
  - jn2010
  - j2015
  vi_tri: jn2010, Bảng 3–4 (không có phân tách theo quốc gia)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đều đến từ mẫu phương Tây". Lý do: các phân tích tổng hợp đã đọc không ghi quốc gia của mẫu, nên không khẳng định được "phương Tây".'
- id: n101
  cau: '"Khoa học đã chứng minh EQ quan trọng hơn IQ.": thông điệp trên bìa Time 1995, không phải kết luận của phân tích tổng hợp nào chúng tôi tìm thấy; EQ năng lực chỉ liên hệ khiêm tốn với hiệu suất, còn EQ mixed thì phần lớn là IQ và tính cách.'
  loai: phat-hien
  nguon:
  - jn2010
  - j2015
  trich: the mixed EI–job performance relationship becomes nil (β = –.02)
  vi_tri: j2015, Abstract; jn2010, Bảng 4
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "không phải kết luận của phân tích tổng hợp nào. Dữ liệu tổng hợp cho thấy EQ (dù đo kiểu gì) cũng chỉ liên hệ khiêm tốn …, và một phần trong đó thực chất là IQ và tính cách". Lý do: ρ mixed ≈ .42 (2010) không "khiêm tốn"; chữ mới tách hai loại.'
- id: n102
  cau: Các bảng hỏi EQ tự báo cáo đo cách bạn tự nhìn mình, gần với đo tính cách hơn là đo năng lực; MSCEIT là bài thi giải quyết tình huống có đáp án đúng, không phải bảng hỏi.
  loai: phat-hien
  nguon:
  - jn2010
  - msceit2003
  - pf2001
  trich: the content of mixed EI measures strongly overlaps with a set of well-known psychological constructs
  vi_tri: j2015, Abstract; msceit2003
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Đa số các test này là thang tự báo cáo" (về test online). Lý do: xem n82.'
- id: n103
  cau: Điều tiết cảm xúc, theo định nghĩa của Mayer và Salovey (1997, trích qua Joseph và Newman 2010), là điều chỉnh có ý thức cảm xúc để thúc đẩy sự phát triển cảm xúc và trí tuệ, chứ không phải đè nén mọi cảm xúc tiêu cực; EQ năng lực là khả năng, không phải tính khí vui vẻ.
  loai: dinh-nghia
  nguon:
  - jn2010
  trich: conscious [emphasis added] regulation of emotions to enhance emotional and intellectual growth
  vi_tri: jn2010, mục Emotion regulation and job performance (trích Mayer & Salovey 1997, tr. 14)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đôi khi phản ứng phù hợp chính là thể hiện sự giận dữ một cách có kiểm soát". Lý do: không có nguồn đã mở; chữ mới theo định nghĩa của Mayer và Salovey.'
- id: n104
  cau: MSCEIT gây tranh cãi vì chấm điểm theo đồng thuận ("đúng" = "đa số chọn") và mức đồng thuận của chuyên gia cao nhất ở những câu có đáp án rõ ràng.
  loai: phat-hien
  nguon:
  - msceit2003
  trich: exhibited superior agreement, particularly when research provides clearer answers to test questions
  vi_tri: msceit2003, Abstract
  ket_qua: dung
  ghi_chu: Đã sửa ở G1 ("chỉ" thành "cao nhất"/"đặc biệt"); chữ hiện trên trang khớp nguồn.
- id: n105
  cau: 'Đọc thêm có ba liên kết: "IQ đo được gì?" (kham-pha/tri-tue/tri-tue-la-gi), "Nén cảm xúc có tốt?" (dieu-tiet-cam-xuc), "Cảm xúc có mấy loại cơ bản?" (cam-xuc-co-ban).'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm: ba trang có trong src/data/trang.yml và tiêu đề khớp (đọc đầu file của ba trang). Trang nhà EQ–IQ là tri-tue-la-gi, ở đó có một câu về EQ (Waterhouse 2006), khớp khung Khá vững ở đây.'
- id: n106
  cau: 'Quiz 1: theo định nghĩa gốc của Salovey và Mayer (1990), trí tuệ cảm xúc là khả năng theo dõi cảm xúc của mình và người khác, phân biệt các cảm xúc, và dùng thông tin đó để dẫn dắt suy nghĩ và hành động; định nghĩa gốc nhấn mạnh "khả năng" xử lý thông tin cảm xúc (đánh giá, điều tiết, sử dụng).'
  loai: dinh-nghia
  nguon:
  - sm1990
  trich: the ability to monitor one's own and others' feelings and emotions, to discriminate among them and to use this information to guide one's thinking and actions
  vi_tri: sm1990, mục Emotional Intelligence
  ket_qua: dung
- id: n107
  cau: 'Quiz 1 (giải thích): những thứ như tự thúc đẩy, kiên trì, kỹ năng xã hội là phần được thêm vào khi khái niệm được mở rộng (theo mô tả của Locke về Goleman), và là một nguồn gốc của tranh cãi.'
  loai: phat-hien
  nguon:
  - locke2005
  trich: 'According to Goleman, EI involves: self-motivation and persistence; ... empathy; and social skills'
  vi_tri: locke2005, tr. 426
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Bó tính cách lạc quan/tự tin là thứ Goleman thêm vào sau, và đó chính là nguồn gốc của mọi tranh cãi." Lý do: lạc quan, tự tin không có trong danh sách của nguồn; "mọi tranh cãi" quá mạnh.'
- id: n108
  cau: 'Quiz 2: Joseph và cộng sự (2015) ước tính mức trùng lắp multiple R = .79, và sau khi loại phần trùng lắp, mối liên hệ với hiệu suất gần như biến mất (β = -.02); đây là một đòn phê bình quan trọng nhắm vào dòng mixed EI.'
  loai: so-lieu
  nguon:
  - j2015
  trich: multiple R = .79; ... becomes nil (β = –.02)
  vi_tri: j2015, Abstract
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "đòn phê bình mạnh nhất". Lý do: "mạnh nhất" không có nguồn so sánh.'
- id: n109
  cau: 'Quiz 3: mô hình thác của Joseph và Newman (2010) mô tả trình tự nhận biết cảm xúc, thấu hiểu cảm xúc, điều tiết cảm xúc, hiệu suất công việc; chỉ điều tiết ảnh hưởng trực tiếp đến hiệu suất.'
  loai: phat-hien
  nguon:
  - jn2010
  trich: emotion perception must causally precede emotion understanding, which in turn precedes conscious emotion regulation and job performance
  vi_tri: jn2010, Abstract
  ket_qua: dung
  ghi_chu: 'Như n38; giải thích của quiz viết "bạn phải nhận biết được cảm xúc trước, rồi mới thấu hiểu…": phù hợp ý "precede" của nguồn.'
- id: n110
  cau: 'Quiz 4: EQ năng lực dự báo hiệu suất ở công việc nhiều lao động cảm xúc (r = .22), còn ở việc ít lao động cảm xúc mối liên hệ gần như không có; giá trị của EQ phụ thuộc việc công việc có đòi hỏi xử lý cảm xúc hay không.'
  loai: so-lieu
  nguon:
  - jn2010
  trich: High emotional labor 4 220 .22 .24; Low emotional labor 3 223 .00 .01
  vi_tri: jn2010, Bảng 3
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "(bán hàng, chăm sóc khách hàng): r = .22; còn ở công việc kỹ thuật thuần túy (lập trình, kế toán) … thậm chí hơi âm" và "điều kiện biên quan trọng nhất". Lý do: ví dụ nghề theo nguồn (n42); bỏ "hơi âm" khỏi đáp án (chỉ đúng sau khi kiểm soát IQ, tính cách); "quan trọng nhất" bỏ. Xem n40–n41.'
- id: n111
  cau: 'Quiz: các phương án nhiễu (ví dụ "IQ → EQ → tính cách → hiệu suất", "chỉ ở người có IQ trên 130") là phương án sai của câu hỏi, không phải nhận định.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'gia-dinh: phương án nhiễu; kiểm trên trang không trái nhận định nào. Lời giải thích không dựa vào vị trí lựa chọn (đã đọc cả bốn câu).'
- id: n112
  cau: 'Mô tả trang: từ "EQ" đang chỉ ba khái niệm khác nhau, và khoa học nói gì về khả năng dự báo thành công của nó.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm trên trang: mục Điều gì đang xảy ra nêu ba nghĩa; khung nhãn nói về dự báo hiệu suất. Mô tả vẫn nói "Salovey & Mayer (1990)", "Goleman (1995)", MSCEIT: khớp thân bài.'
- id: n113
  cau: Trang có hộp ::tom-tat dựng từ các khung nhãn.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm trong src/content/docs/kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc.md và bản xem hộp (tạo từ khung nhãn lúc build): chữ trong hộp là chữ của khung nhãn đã kiểm ở trên.'
doi_chu:
- cu: (không có)
  moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
  ly_do: Bố cục C (kế hoạch).
- cu: '"hai cách hoàn toàn khác — và cho ra hai kết luận hoàn toàn khác".'
  moi: Hai nghĩa EQ (tính cách, năng lực) được khoa học đo bằng hai cách khác nhau và cho ra hai kết luận khác nhau về việc EQ có dự báo thành công hay không.
  ly_do: nguồn cho thấy hai dòng khác nhau về độ mạnh dự báo (ρ ≈ .17 so với .42), không phải đối lập hoàn toàn. (hồ sơ n2)
- cu: '"Bài báo khi đó gần như không ai để ý." Không có nguồn đã mở nói thẳng điều này (tìm kiếm chỉ thấy nguồn phổ thông).'
  moi: Khái niệm này chỉ đến được với đông đảo công chúng sau năm 1995 (nhờ cuốn sách của Goleman).
  ly_do: 'Chữ cũ: "Bài báo khi đó gần như không ai để ý." Không có nguồn đã mở nói thẳng điều này (tìm kiếm chỉ thấy nguồn phổ thông). Chữ mới chỉ nói điều nguồn xác nhận: Time 1995 viết khái niệm do Salovey và Mayer đặt ra năm năm trước; Locke 2005 nói Goleman làm nó phổ biến. (hồ sơ n4)'
- cu: '"nhà báo khoa học Daniel Goleman" ở thân bài và "phóng viên khoa học của New York Times" ở mục Goleman; mới gộp thành "một nhà báo khoa học của New York Times" theo Time (tả ông là "science writer"). Nhan đề sách khớp danh mục tham khảo của Joseph và Newman (2010).'
  moi: 'Daniel Goleman, một nhà báo khoa học của New York Times, xuất bản cuốn Emotional Intelligence: Why It Can Matter More Than IQ năm 1995.'
  ly_do: 'Chữ cũ: "nhà báo khoa học Daniel Goleman" ở thân bài và "phóng viên khoa học của New York Times" ở mục Goleman; mới gộp thành "một nhà báo khoa học của New York Times" theo Time (tả ông là "science writer"). Nhan đề sách khớp danh mục tham khảo của Joseph và Newman (2010). (hồ sơ n5)'
- cu: dòng chữ đặt trong ngoặc kép "có thể là yếu tố dự báo thành công trong đời tốt nhất" (ở thân bài và ở khung Bác bỏ).
  moi: Lời quảng bá trên bìa Time nói trí tuệ cảm xúc có thể là yếu tố dự báo thành công trong đời mạnh nhất.
  ly_do: 'Chữ cũ: dòng chữ đặt trong ngoặc kép "có thể là yếu tố dự báo thành công trong đời tốt nhất" (ở thân bài và ở khung Bác bỏ). Chữ mới: bỏ ngoặc kép, nói "lời quảng bá", "mạnh nhất", theo bản kể lại của Penguin, vì chưa thấy nguyên văn bìa. (hồ sơ n7)'
- cu: '"từ EQ trở thành một hiện tượng toàn cầu — khóa học EQ, test EQ, sách dạy con EQ mọc lên khắp nơi, trong đó có Việt Nam".'
  moi: Từ viết tắt EQ lan nhanh trên báo chí.
  ly_do: không có nguồn đã mở cho "hiện tượng toàn cầu" và "khắp nơi"; phần Việt Nam xem n91. (hồ sơ n9)
- cu: '"giới khoa học bắt đầu cãi nhau dữ dội, và cuộc cãi vã kéo dài đến tận hôm nay".'
  moi: Nhiều nhà nghiên cứu phê bình khái niệm trí tuệ cảm xúc, và cuộc tranh luận vẫn chưa ngã ngũ.
  ly_do: nguồn nói phê bình và tranh luận, không có số đo "dữ dội". (hồ sơ n10)
- cu: '"EQ-i của Bar-On hay thang của Goleman".'
  moi: EQ tự báo cáo (trait EI hay mixed EI) là người ta tự đánh giá mình, đo bằng bảng hỏi như EQ-i của Bar-On hay thang 33 câu của Schutte, và gần với đo tính cách.
  ly_do: không có nguồn đã mở nói thang của Goleman là bảng hỏi tự báo cáo. EQ-i là thang tự báo cáo theo Petrides và Furnham (2001, nghiên cứu với BarOn EQ-i); sách hướng dẫn kỹ thuật Bar-On 1997 không đọc được. (hồ sơ n12)
- cu: '"tuyên bố này chưa bao giờ được chứng minh".'
  moi: Tuyên bố EQ quyết định thành công hơn IQ (EQ trên truyền thông) không được các phân tích tổng hợp nêu ở dưới ủng hộ.
  ly_do: 'Chữ cũ: "tuyên bố này chưa bao giờ được chứng minh". Chữ mới nêu rõ phạm vi (các phân tích tổng hợp đã nêu). Chi tiết số ở n43, n53. (hồ sơ n13)'
- cu: '"cảm xúc vốn bị xem là thứ đối lập với lý trí".'
  moi: Bài báo mở đầu bằng câu hỏi "trí tuệ cảm xúc" có phải một mâu thuẫn trong thuật ngữ, vì một truyền thống tư tưởng vẫn coi cảm xúc là thứ cản trở lý trí.
  ly_do: 'Chữ cũ: "cảm xúc vốn bị xem là thứ đối lập với lý trí". Chữ mới thu hẹp thành "một truyền thống tư tưởng", đúng như bài viết. (hồ sơ n17)'
- cu: '"đọc cảm xúc qua khuôn mặt, giọng nói, tranh ảnh" và "tâm trạng vui giúp nảy ra nhiều ý tưởng".'
  moi: 'Bốn nhánh là: nhận biết cảm xúc (khuôn mặt, tranh ảnh), dùng cảm xúc hỗ trợ tư duy (ví dụ niềm vui có thể giúp lên kế hoạch cho một bữa tiệc), thấu hiểu cảm xúc (cảm xúc biến đổi ra sao), quản lý cảm xúc.'
  ly_do: '"giọng nói" và "nảy ra nhiều ý tưởng" không có trong nguồn đã mở. (hồ sơ n21)'
- cu: '"xếp theo độ phức tạp tăng dần".'
  moi: Bốn nhánh xếp theo thứ tự của mô hình (nhận biết, hỗ trợ tư duy, thấu hiểu, quản lý).
  ly_do: không có nguồn đã mở nói "độ phức tạp" (chương 1997 không đọc được); nguồn chỉ cho thứ tự. (hồ sơ n23)
- cu: '"cuốn sách đại chúng tổng hợp nghiên cứu về não bộ, cảm xúc và hành vi, lấy khung của Salovey và Mayer làm điểm xuất phát".'
  moi: Goleman viết một cuốn sách đại chúng, lấy khái niệm của Salovey và Mayer làm điểm xuất phát nhưng mở rộng ra nhiều.
  ly_do: phần "tổng hợp nghiên cứu về não bộ…" không có nguồn đã mở. (hồ sơ n24)
- cu: '"năm thành phần: tự nhận thức, tự điều tiết, động lực, đồng cảm và kỹ năng xã hội … có cả tính cách (như lạc quan, tự tin)".'
  moi: Theo mô tả của Locke (2005), Goleman gộp vào EI cả tự thúc đẩy và kiên trì, trì hoãn thỏa mãn, kiềm chế xung động, đồng cảm và kỹ năng xã hội.
  ly_do: danh sách năm thành phần (thuộc các phiên bản sau của Goleman) và "lạc quan, tự tin" không có trong nguồn đã mở; danh sách của Locke lấy từ sách 1995. (hồ sơ n25)
- cu: '"Goleman đã lặng lẽ đổi định nghĩa EQ"; "hấp dẫn với công chúng" là nhận xét của trang.'
  moi: Khái niệm bị mở rộng từ "năng lực" sang một "hỗn hợp" (mixed model) gồm năng lực, tính cách và động cơ, khiến nó hấp dẫn với công chúng nhưng khó kiểm chứng.
  ly_do: 'Chữ cũ: "Goleman đã lặng lẽ đổi định nghĩa EQ"; "hấp dẫn với công chúng" là nhận xét của trang. Chữ mới: "khái niệm đã được mở rộng". (hồ sơ n26)'
- cu: '"bản thân Goleman cho biết ông chuộng cách viết tắt EI hơn EQ" dẫn Penguin reader''s guide.'
  moi: Bài của Time (1995) ghi Goleman không hề dùng chữ EQ trong sách; chữ EQ do báo chí rút gọn từ nhan đề.
  ly_do: reader's guide không nói điều đó (đã đọc). Thay bằng câu của Time. (hồ sơ n27)
- cu: '"chuyên gia và đa số đồng thuận với nhau ở mức cao".'
  moi: Chuyên gia và đa số chọn nhiều đáp án giống nhau, và chuyên gia đồng thuận với nhau cao hơn, đặc biệt ở những câu có đáp án rõ ràng (như đọc cảm xúc trên khuôn mặt).
  ly_do: chữ gần với abstract hơn ("many of the same answers"; "superior agreement" của chuyên gia). (hồ sơ n31)
- cu: '"phân tích nhân tố ủng hộ cấu trúc bốn nhánh".'
  moi: Phân tích nhân tố cho thấy các mô hình một, hai và bốn nhân tố đều khớp khá tốt, mô hình bốn nhân tố khớp nhất.
  ly_do: tác giả kết luận một, hai và bốn nhân tố đều là cách biểu diễn khả dĩ; bốn nhân tố khớp tốt hơn. (hồ sơ n33)
- cu: '"bằng chứng mạnh nhất".'
  moi: MSCEIT là một bằng chứng quan trọng cho thấy EQ có thể đo như một năng lực.
  ly_do: so sánh "mạnh nhất" không có nguồn; tác giả chính họ nói kết quả chỉ "viable". (hồ sơ n34)
- cu: '"ở công việc ít đòi hỏi lao động cảm xúc (lập trình, kế toán) thì mối liên hệ biến mất, thậm chí hơi âm" (bản G1 đã bỏ "r = .00", "N = 226").'
  moi: Ở công việc ít đòi hỏi lao động cảm xúc, tương quan của EQ năng lực là r = .00 (3 nghiên cứu, N = 223), và sau khi kiểm soát IQ và tính cách phần đóng góp riêng của nó ở nhóm việc này còn âm.
  ly_do: 'Chữ cũ: "ở công việc ít đòi hỏi lao động cảm xúc (lập trình, kế toán) thì mối liên hệ biến mất, thậm chí hơi âm" (bản G1 đã bỏ "r = .00", "N = 226"). Chữ mới có số kiểm được: r = .00, 3 nghiên cứu, N = 223 (không phải 226). G1 xếp r = .00 vào ĐÁNG NGỜ. (hồ sơ n40)'
- cu: '"EQ chỉ dự báo hiệu suất ở những công việc đòi hỏi nhiều lao động cảm xúc" (không phân loại EQ).'
  moi: EQ năng lực (đo bằng bài test) mới là loại dự báo hiệu suất ở việc nhiều lao động cảm xúc nhưng không ở việc ít lao động cảm xúc; EQ mixed và EQ năng lực tự báo cáo tương quan với hiệu suất ở cả hai loại việc.
  ly_do: với EQ mixed, r = .37 (nhiều lao động cảm xúc) và .27 (ít); với năng lực tự báo cáo r = .20 và .14; chỉ EQ năng lực đo bằng test là ≈ 0 ở việc ít lao động cảm xúc. (hồ sơ n41)
- cu: '"bán hàng, chăm sóc khách hàng, y tế" và "lập trình, kế toán" (cả ở thân bài và đáp án quiz câu 4).'
  moi: 'Ví dụ công việc: nhiều lao động cảm xúc như nhân viên bán lẻ, môi giới bất động sản, nhân viên tổng đài; ít lao động cảm xúc như công nhân nhà máy, thợ cơ khí, nhà nghiên cứu phát triển.'
  ly_do: 'y tế, lập trình, kế toán không nằm trong ví dụ của nguồn; chữ mới lấy ví dụ của chính bài. Định nghĩa lao động cảm xúc cũng đổi từ "quản lý cảm xúc của mình và người khác" thành "biểu lộ cảm xúc theo yêu cầu công việc" (mục mã hóa: "expected to express positive emotion as part of this job"). (hồ sơ n42)'
- cu: '"r ≈ .17, chưa hiệu chỉnh" và "r ≈ .42".'
  moi: EQ năng lực tương quan với hiệu suất ở mức khiêm tốn (ρ ≈ .17) và EQ tự báo cáo/mixed cho con số cao hơn (ρ ≈ .42), đã hiệu chỉnh độ tin cậy của thước đo hiệu suất và hạn chế biên độ.
  ly_do: Bảng 4 ghi các hệ số với hiệu suất đã hiệu chỉnh cho độ tin cậy của tiêu chí và hạn chế biên độ, nên là ρ và không phải "chưa hiệu chỉnh". (hồ sơ n43)
- cu: '"nền tảng lý thuyết yếu nhất".'
  moi: EQ mixed là loại có nền tảng lý thuyết yếu hơn EQ năng lực.
  ly_do: nguồn so sánh hai loại ("weaker"), không xếp hạng "yếu nhất". (hồ sơ n44)
- cu: '"các tác giả cảnh báo không nên tin con số này" và dẫn thêm "số liệu lao động cảm xúc tổng hợp trong Côté (2014)".'
  moi: EQ mixed có đóng góp thêm ΔR² = .14 sau khi kiểm soát IQ và Big Five, nhưng các tác giả cho rằng chưa rõ vì sao và khuyên hết sức thận trọng khi dùng nó, vì khái niệm mixed thiếu chặt chẽ.
  ly_do: tác giả nói chưa rõ vì sao và khuyên thận trọng khi áp dụng, không nói không tin con số; số lao động cảm xúc lấy thẳng từ bài Joseph và Newman, bỏ dẫn Côté ở câu này (Côté vẫn dùng ở khung Tranh cãi). (hồ sơ n46)
- cu: '"Vẫn nhóm tác giả trên quay lại".'
  moi: Joseph và Newman, cùng Jin và O'Boyle (2015), quay lại câu hỏi vì sao EQ mixed lại dự báo hiệu suất tốt đến thế.
  ly_do: bài 2015 có thêm Jin và O'Boyle. (hồ sơ n47)
- cu: '"chỉ tính các nghiên cứu dùng đánh giá của cấp trên — loại bỏ đánh giá tự chấm dễ thổi phồng".'
  moi: Bài 2015 cập nhật phân tích tổng hợp với hiệu suất theo đánh giá của cấp trên, như bản 2010.
  ly_do: bản 2010 đã dùng đánh giá cấp trên; 2015 cập nhật số nghiên cứu (k = 15 so với 9); không có nguồn nói đánh giá tự chấm "thổi phồng" là lý do. (hồ sơ n49)
- cu: '"gần như toàn bộ nội dung thang đo đã được các khái niệm cũ bao phủ".'
  moi: Multiple R = .79 tương ứng R² = .62, tức khoảng 62% phương sai của thang mixed EI do các khái niệm cũ giải thích.
  ly_do: R² = .62 nghĩa là khoảng 62%, không phải gần như toàn bộ. (hồ sơ n52)
- cu: '"cha đẻ của lý thuyết đặt mục tiêu".'
  moi: Edwin Locke là đồng tác giả của lý thuyết đặt mục tiêu, một tên tuổi lớn trong tâm lý học tổ chức.
  ly_do: Locke ghi là lý thuyết "(với Latham)". (hồ sơ n55)
- cu: '"EQ hoặc là trí tuệ áp dụng vào lĩnh vực cảm xúc — thì không phải khái niệm mới; hoặc là một bó tính cách và kỹ năng — thì không phải trí tuệ" (ở thân bài và ở mục Các lý thuyết giải thích: "bài toán logic của Locke", "nếu EQ là bó gồm lạc quan, tự tin, khéo giao tiếp").'
  moi: 'Lập luận của Locke có hai ý: EI không phải một dạng trí tuệ (theo ông là tổ hợp thói quen, kỹ năng, lựa chọn), và được định nghĩa rộng đến mức không còn nghĩa rõ ràng.'
  ly_do: nguồn không trình bày lưỡng đề này; chữ mới theo abstract và tr. 426. (hồ sơ n57)
- cu: '"kết luận rằng phần lớn những gì được quảng cáo về EQ vượt xa dữ liệu thực tế".'
  moi: 'Matthews, Zeidner và Roberts (2002) dành cả một cuốn sách (Emotional Intelligence: Science and Myth) để rà soát bằng chứng, kết luận bằng chứng cho một khái niệm EI được xác định rõ còn thưa và bác bỏ một số tuyên bố quá đà trên truyền thông.'
  ly_do: tóm tắt chỉ nói bằng chứng thưa và "một số" tuyên bố quá đà; sách không đọc toàn văn. (hồ sơ n58)
- cu: '"Mọi phân tích tổng hợp đều cho cùng một kết quả".'
  moi: Các phân tích tổng hợp đã nêu cho thấy thang EQ tự đánh giá tương quan từ vừa đến mạnh với các đặc điểm Big Five, đặc biệt là ổn định cảm xúc, tận tâm và hướng ngoại.
  ly_do: chỉ có hai bài đã đọc; chữ mới nói "các phân tích đã nêu". (hồ sơ n60)
- cu: '"gần như trùng với".'
  moi: Hỏi "bạn có kiểm soát cảm xúc tốt không" cho đáp án khá gần với hỏi "bạn có phải người điềm tĩnh, có tổ chức không" (minh họa).
  ly_do: r = .45 và .33 là mức vừa. (hồ sơ n61)
- cu: '"vẫn giữ được một phần giá trị dự báo gia tăng sau khi kiểm soát IQ và Big Five" (cho cả ba dòng).'
  moi: 'O''Boyle và cộng sự (2011): cả ba dòng đo EQ đều tương quan hiệu chỉnh .24–.30 với hiệu suất, và hai dòng dựa trên tự báo cáo có giá trị dự báo gia tăng lớn nhất sau khi kiểm soát IQ và Big Five.'
  ly_do: abstract chỉ nói dòng 2 và 3 có giá trị gia tăng lớn nhất. (hồ sơ n67)
- cu: '"Điểm đồng thuận duy nhất: …" (không nguồn nói "duy nhất").'
  moi: 'Một điểm các nghiên cứu cùng thấy: hiệu quả của EQ phụ thuộc loại công việc; việc càng đòi hỏi lao động cảm xúc, EQ càng có đất dụng võ.'
  ly_do: 'Chữ cũ: "Điểm đồng thuận duy nhất: …" (không nguồn nói "duy nhất"). Chữ mới có dẫn hai nguồn. (hồ sơ n69)'
- cu: (xem ghi_chu)
  moi: Đây là thông điệp trên trang bìa Time năm 1995, không phải kết luận khoa học.
  ly_do: 'Chữ cũ có dẫn nguyên câu trong ngoặc kép: "có thể là yếu tố dự báo thành công trong đời tốt nhất". Xem n7. (hồ sơ n71)'
- cu: '"Không có phân tích tổng hợp nào ủng hộ nó: mối liên hệ … ở mức khiêm tốn…".'
  moi: 'Chúng tôi không tìm thấy phân tích tổng hợp nào ủng hộ thông điệp ấy: EQ năng lực tương quan với hiệu suất ρ ≈ .17, thấp hơn năng lực nhận thức (≈ .40); EQ mixed cao hơn (≈ .42) nhưng phần lớn là tính cách, sự tự tin và IQ "đội lốt".'
  ly_do: khẳng định phủ định mạnh; chữ mới nói "chúng tôi không tìm thấy" và thêm số. Hunter & Hunter 1984 là nguồn của .40 trong bảng của Joseph và Newman. (hồ sơ n72)
- cu: '"người lạc quan có xu hướng chấm mình cao ở mọi thang tích cực".'
  moi: Tự báo cáo "đụng" tính cách vì nội dung câu hỏi giống nhau (ví dụ minh họa của trang) và vì cùng phương pháp tự đánh giá (yếu tố phương pháp tự báo cáo).
  ly_do: không có nguồn đã mở cho hành vi này; chữ mới theo kết luận về yếu tố phương pháp. Hai câu ví dụ là minh họa của trang (gia-dinh), đã ghi "ví dụ minh họa". (hồ sơ n75)
- cu: '"siết chặt định nghĩa về dòng năng lực và từ chối bảo vệ dòng mixed — một sự nhượng bộ đáng kể".'
  moi: Mayer, Salovey và Caruso (2008) đáp lại bằng cách phân biệt EI như một nhóm năng lực với một "hỗn hợp các nét tích cực" như hạnh phúc, tự trọng, lạc quan, và chỉ bảo vệ dòng năng lực.
  ly_do: '"nhượng bộ" và "từ chối bảo vệ" là diễn giải; abstract chỉ nói phân biệt hai loại và EI như năng lực có giá trị. (hồ sơ n77)'
- cu: '"Đa số có thể sai — nhất là với những câu hỏi cảm xúc tinh tế, nơi chuyên gia và đám đông bất đồng".'
  moi: Chấm điểm theo đồng thuận (consensus scoring) nghĩa là "đúng" = "đa số chọn"; đa số có thể sai, và chính các tác giả nêu vấn đề khi đáp án đám đông và chuyên gia lệch nhau.
  ly_do: '"câu tinh tế" không có trong nguồn. (hồ sơ n78)'
- cu: '"không bao giờ ''sạch''" (hai chỗ: Các lý thuyết giải thích, Ngộ nhận).'
  moi: Đo cảm xúc khó "sạch" như đo toán (nhận xét của trang, rút từ khó khăn của chấm theo đồng thuận).
  ly_do: '"không bao giờ" quá tuyệt đối; tác giả chỉ nói phải dùng hết sức thận trọng. (hồ sơ n80)'
- cu: '"Hầu hết các bài test EQ trên mạng là bảng hỏi tự báo cáo".'
  moi: Các bảng hỏi EQ tự báo cáo là bạn tự chấm mình khéo léo, điềm tĩnh, đồng cảm đến đâu; kết quả phản ánh cách bạn nhìn mình và một phần tính cách Big Five nhiều hơn là năng lực xử lý cảm xúc thật sự.
  ly_do: không có khảo sát về các test trên mạng; chữ mới nói về bảng hỏi tự báo cáo nói chung (EQ-i, thang Schutte). (hồ sơ n82)
- cu: (xem ghi_chu)
  moi: Điểm tự báo cáo về "năng lực" chỉ tương quan yếu (r = .12) với điểm đo bằng bài test năng lực.
  ly_do: Câu mới thêm vào trang (chữ cũ không có số). (hồ sơ n83)
- cu: '"thì là lạm dụng". "Cho con học gì" nằm ngoài nguồn (nguồn nói về tuyển dụng); giữ như mở rộng hợp lý, ghi rõ đây là suy luận.'
  moi: Dùng bảng hỏi EQ để quyết định tuyển ai, cho con học gì thì nên hết sức thận trọng.
  ly_do: 'Chữ cũ: "thì là lạm dụng". "Cho con học gì" nằm ngoài nguồn (nguồn nói về tuyển dụng); giữ như mở rộng hợp lý, ghi rõ đây là suy luận. (hồ sơ n84)'
- cu: '"Đây là kỹ năng có thể luyện (kỹ thuật hít thở, đặt tên cảm xúc, trì hoãn phản ứng)".'
  moi: 'Mô hình thác gợi ý một thứ tự ưu tiên: khâu quyết định là điều tiết cảm xúc; đây là gợi ý từ mô hình tổng hợp tương quan, chưa phải kết quả của thử nghiệm huấn luyện.'
  ly_do: không có nguồn đã mở cho khả năng luyện hay các kỹ thuật; chữ mới nói rõ giới hạn và dẫn bài Nén cảm xúc có tốt? Thêm "mục tiêu cụ thể rõ ràng hơn "nâng EQ lên 10 điểm"" là nhận xét của trang. (hồ sơ n86)
- cu: '"thang tự báo cáo dễ ''diễn'' (ai cũng biết nên chọn đáp án ''tôi luôn bình tĩnh'')" và "hãy đo thẳng tính cách Big Five và năng lực nhận thức".'
  moi: 'Tuyển dụng (nhãn Đang tranh cãi): nội dung thang tự báo cáo trùng lắp với tính cách và năng lực nhận thức, và chưa rõ nó đo gì, nên Joseph và Newman (2010) khuyên hết sức thận trọng khi dùng chúng để ra quyết định nhân sự.'
  ly_do: không có nguồn đã mở cho "dễ diễn" và cho lời khuyên đo thẳng Big Five. Nhãn Đang tranh cãi giữ vì tranh luận về giá trị gia tăng (khung Tranh cãi). (hồ sơ n88)
- cu: '"Người khéo … có thể đơn giản là hướng ngoại + dễ chịu + tận tâm … Ngược lại, người trầm tính, vụng giao tiếp vẫn có thể đọc vị cảm xúc người khác rất chính xác."'
  moi: 'Khá vững: người khéo ăn khéo nói chưa chắc đã giỏi đọc cảm xúc qua một bài test khách quan; điểm EQ năng lực chỉ tương quan yếu với Big Five (r từ .12 đến .25).'
  ly_do: không có nguồn đã mở cho phần "ngược lại"; chữ mới dùng hệ số Bảng 4. Câu "khéo ăn khéo nói" là ví dụ minh họa. (hồ sơ n90)
- cu: '"các khóa học EQ cho trẻ em được quảng cáo rầm rộ — từ lớp kỹ năng sống đến trại hè rèn EQ".'
  moi: 'Ở Việt Nam, các khóa học EQ đang thành một xu hướng: người trưởng thành tìm đến các khóa đào tạo EQ để xử lý căng thẳng và các mối quan hệ (VnExpress, 2024).'
  ly_do: bài đã đọc nói về khóa cho người trưởng thành, không nói trẻ em; không tìm được nguồn cho trại hè rèn EQ. (hồ sơ n91)
- cu: '"chưa có đánh giá độc lập nào về hiệu quả … và hầu hết chúng dạy theo nghĩa mixed EI (tự tin, giao tiếp, lạc quan)".'
  moi: Tính đến 11/2026, chúng tôi chưa tìm thấy đánh giá độc lập nào về hiệu quả của các khóa học EQ thương mại ở Việt Nam, cũng như khảo sát nào về việc các khóa ấy dạy theo nghĩa năng lực hay nghĩa mixed.
  ly_do: '"hầu hết dạy mixed" không có nguồn, bỏ; thêm mốc 11/2026. Chưa tìm Google Scholar hay tạp chí trong nước. (hồ sơ n92)'
- cu: '"các nền văn hóa Á Đông, trong đó có Việt Nam, thường có quy tắc thể hiện cảm xúc kiềm chế hơn — ít bộc lộ cảm xúc mạnh ra mặt" và "Văn hóa Việt Nam vốn đề cao ''khéo ăn khéo nói''… ''khéo'' gần với sự tinh tế xã hội…" (hai câu bị bỏ: không có nguồn; câu thứ nhất khái quát về cả Á Đông và Việt Nam).'
  moi: Phân tích tổng hợp của Elfenbein và Ambady (2002) thấy cảm xúc được nhận ra chính xác hơn khi người biểu lộ và người nhận cùng một nhóm văn hóa.
  ly_do: 'Chữ cũ: "các nền văn hóa Á Đông, trong đó có Việt Nam, thường có quy tắc thể hiện cảm xúc kiềm chế hơn — ít bộc lộ cảm xúc mạnh ra mặt" và "Văn hóa Việt Nam vốn đề cao ''khéo ăn khéo nói''… ''khéo'' gần với sự tinh tế xã hội…" (hai câu bị bỏ: không có nguồn; câu thứ nhất khái quát về cả Á Đông và Việt Nam). Chữ mới dẫn kết quả tổng hợp. Trang Cảm xúc cơ bản (cùng lô) cũng dẫn Elfenbein và Ambady. (hồ sơ n93)'
- cu: '"được chuẩn hóa trên mẫu phương Tây … một người Việt Nam đọc khuôn mặt theo chuẩn Việt Nam có thể bị chấm ''sai'' theo chuẩn Mỹ".'
  moi: Mẫu chuẩn hóa của MSCEIT chủ yếu là người Mỹ (1.240 trong 2.112 người), làm bài bằng tiếng Anh, không có người Việt.
  ly_do: mẫu có 34% người châu Á và nhiều nước, nên "phương Tây" không đúng; câu "chấm sai theo chuẩn Mỹ" là suy luận của trang, đã ghi rõ là suy luận. (hồ sơ n94)
- cu: '"1.593 thanh thiếu niên", "nam giới điểm cao hơn nữ giới".'
  moi: Nguyen và cộng sự (2020) khảo sát 1.593 học sinh Việt Nam bằng bản dịch tiếng Việt của thang TEIQue, thấy nam sinh có điểm EI chung cao hơn nữ sinh và sự ấm áp của cha mẹ liên quan đến EI cao hơn ở con.
  ly_do: 'nguồn nói "students"/"adolescents" (học sinh) và "boys"/"girls"; tránh đọc thành người trưởng thành. Theo G1-L04: KHỚP abstract. (hồ sơ n96)'
- cu: '"tất cả đều dùng thang tự báo cáo và mang tính mô tả".'
  moi: Các nghiên cứu ấy đều dùng thang đo (TEIQue, REIS, BarOn EQ-i), không phải bài test năng lực kiểu MSCEIT.
  ly_do: chưa xác nhận REIS là tự báo cáo, và Nguyen 2020 có phân tích hồi quy nên không chỉ mô tả; chữ mới nói điều xác nhận được. (hồ sơ n98)
- cu: '"Chúng tôi chưa tìm thấy nghiên cứu nào…" (không mốc).'
  moi: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào trên mẫu Việt Nam kiểm định mô hình EQ năng lực (MSCEIT) hay đo giá trị dự báo gia tăng của EQ so với IQ và tính cách.
  ly_do: 'Chữ cũ: "Chúng tôi chưa tìm thấy nghiên cứu nào…" (không mốc). Chữ mới thêm mốc. Lần tìm: Crossref, ba truy vấn nêu ở nguồn; OpenAlex bị giới hạn lượt gọi nên không dùng được; chưa tìm Google Scholar hay tạp chí trong nước. (hồ sơ n99)'
- cu: '"đều đến từ mẫu phương Tây".'
  moi: Các con số về "EQ dự báo hiệu suất" trong bài lấy từ các phân tích tổng hợp quốc tế, không tách riêng người Việt; áp dụng sang Việt Nam cần thận trọng.
  ly_do: các phân tích tổng hợp đã đọc không ghi quốc gia của mẫu, nên không khẳng định được "phương Tây". (hồ sơ n100)
- cu: '"không phải kết luận của phân tích tổng hợp nào. Dữ liệu tổng hợp cho thấy EQ (dù đo kiểu gì) cũng chỉ liên hệ khiêm tốn …, và một phần trong đó thực chất là IQ và tính cách".'
  moi: '"Khoa học đã chứng minh EQ quan trọng hơn IQ.": thông điệp trên bìa Time 1995, không phải kết luận của phân tích tổng hợp nào chúng tôi tìm thấy; EQ năng lực chỉ liên hệ khiêm tốn với hiệu suất, còn EQ mixed thì phần lớn là IQ và tính cách.'
  ly_do: ρ mixed ≈ .42 (2010) không "khiêm tốn"; chữ mới tách hai loại. (hồ sơ n101)
- cu: '"Đa số các test này là thang tự báo cáo" (về test online).'
  moi: Các bảng hỏi EQ tự báo cáo đo cách bạn tự nhìn mình, gần với đo tính cách hơn là đo năng lực; MSCEIT là bài thi giải quyết tình huống có đáp án đúng, không phải bảng hỏi.
  ly_do: xem n82. (hồ sơ n102)
- cu: '"đôi khi phản ứng phù hợp chính là thể hiện sự giận dữ một cách có kiểm soát".'
  moi: Điều tiết cảm xúc, theo định nghĩa của Mayer và Salovey (1997, trích qua Joseph và Newman 2010), là điều chỉnh có ý thức cảm xúc để thúc đẩy sự phát triển cảm xúc và trí tuệ, chứ không phải đè nén mọi cảm xúc tiêu cực; EQ năng lực là khả năng, không phải tính khí vui vẻ.
  ly_do: không có nguồn đã mở; chữ mới theo định nghĩa của Mayer và Salovey. (hồ sơ n103)
- cu: '"Bó tính cách lạc quan/tự tin là thứ Goleman thêm vào sau, và đó chính là nguồn gốc của mọi tranh cãi."'
  moi: 'Quiz 1 (giải thích): những thứ như tự thúc đẩy, kiên trì, kỹ năng xã hội là phần được thêm vào khi khái niệm được mở rộng (theo mô tả của Locke về Goleman), và là một nguồn gốc của tranh cãi.'
  ly_do: lạc quan, tự tin không có trong danh sách của nguồn; "mọi tranh cãi" quá mạnh. (hồ sơ n107)
- cu: '"đòn phê bình mạnh nhất".'
  moi: 'Quiz 2: Joseph và cộng sự (2015) ước tính mức trùng lắp multiple R = .79, và sau khi loại phần trùng lắp, mối liên hệ với hiệu suất gần như biến mất (β = -.02); đây là một đòn phê bình quan trọng nhắm vào dòng mixed EI.'
  ly_do: '"mạnh nhất" không có nguồn so sánh. (hồ sơ n108)'
- cu: '"(bán hàng, chăm sóc khách hàng): r = .22; còn ở công việc kỹ thuật thuần túy (lập trình, kế toán) … thậm chí hơi âm" và "điều kiện biên quan trọng nhất".'
  moi: 'Quiz 4: EQ năng lực dự báo hiệu suất ở công việc nhiều lao động cảm xúc (r = .22), còn ở việc ít lao động cảm xúc mối liên hệ gần như không có; giá trị của EQ phụ thuộc việc công việc có đòi hỏi xử lý cảm xúc hay không.'
  ly_do: ví dụ nghề theo nguồn (n42); bỏ "hơi âm" khỏi đáp án (chỉ đúng sau khi kiểm soát IQ, tính cách); "quan trọng nhất" bỏ. Xem n40–n41. (hồ sơ n110)
