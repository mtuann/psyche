    ghi_chu: 'Chữ cũ: "năm thành phần: tự nhận thức, tự điều tiết, động lực, đồng cảm và kỹ năng xã hội … có cả tính cách (như lạc quan, tự tin)". Lý do: danh sách năm thành phần (thuộc các phiên bản sau của Goleman) và "lạc quan, tự tin" không có trong nguồn đã mở; danh sách của Locke lấy từ sách 1995. Review (Claude Opus 5.5, 10/11/2026): dung. Liệt kê một phần danh sách của Locke, đã ghi "theo mô tả của Locke".'
