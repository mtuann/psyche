    review: dung
  - id: n111
    cau: 'Quiz: các phương án nhiễu (ví dụ "IQ → EQ → tính cách → hiệu suất", "chỉ ở người có IQ trên 130") là phương án sai của câu hỏi, không phải nhận định.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'gia-dinh: phương án nhiễu; kiểm trên trang không trái nhận định nào. Lời giải thích không dựa vào vị trí lựa chọn (đã đọc cả bốn câu). Review (Claude Opus 5.5, 10/11/2026): dung. Phương án nhiễu, không phải nhận định.'
    review: dung
  - id: n112
    cau: 'Mô tả trang: từ "EQ" đang chỉ ba khái niệm khác nhau, và khoa học nói gì về khả năng dự báo thành công của nó.'
    loai: dinh-nghia
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên trang: mục Điều gì đang xảy ra nêu ba nghĩa; khung nhãn nói về dự báo hiệu suất. Mô tả vẫn nói "Salovey & Mayer (1990)", "Goleman (1995)", MSCEIT: khớp thân bài. Review (Claude Opus 5.5, 10/11/2026): dung. Soát loại: câu nói về nội dung khoa học (EQ chỉ ba khái niệm), không chỉ về site; đổi loai ve-site thành dinh-nghia, thêm nguồn. Lượt 2 đã kiểm (dung, Joseph & Newman 2010; Joseph và cộng sự 2015).'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252Fa0017286.pdf", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0037681.pdf" ]
    luot_2_ghi_chu: "Câu loại ve-site (không qua lượt 2; review kiểm trên trang); ghi để đối chiếu: ý 'EQ chỉ ba khái niệm' khớp Joseph & Newman 2010."
    nguon:
      - jn2010
      - j2015
    review: dung
  - id: n113
    cau: Trang có hộp ::tom-tat dựng từ các khung nhãn.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trong src/content/docs/kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc.md và bản xem hộp (tạo từ khung nhãn lúc build): chữ trong hộp là chữ của khung nhãn đã kiểm ở trên. Review (Claude Opus 5.5, 10/11/2026): dung. Trang có ::tom-tat; hộp sinh từ khung nhãn.'
    review: dung
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: '"hai cách hoàn toàn khác — và cho ra hai kết luận hoàn toàn khác".'
    moi: Hai nghĩa EQ (tính cách, năng lực) được khoa học đo bằng hai cách khác nhau và cho ra hai kết luận khác nhau về việc EQ có dự báo thành công hay không.
    ly_do: nguồn cho thấy hai dòng khác nhau về độ mạnh dự báo (ρ ≈ .17 so với .42), không phải đối lập hoàn toàn. (hồ sơ n2)
  - cu: '"Bài báo khi đó gần như không ai để ý." Không có nguồn đã mở nói thẳng điều này (tìm kiếm chỉ thấy nguồn phổ thông).'
    moi: Khái niệm này chỉ đến được với đông đảo công chúng sau năm 1995 (nhờ cuốn sách của Goleman).
    ly_do: 'Chữ cũ: "Bài báo khi đó gần như không ai để ý." Không có nguồn đã mở nói thẳng điều này (tìm kiếm chỉ thấy nguồn phổ thông). Chữ mới chỉ nói điều nguồn xác nhận: Time 1995 viết khái niệm do Salovey và Mayer đặt ra năm năm trước; Locke 2005 nói Goleman làm nó phổ biến. (hồ sơ n4)'
  - cu: '"nhà báo khoa học Daniel Goleman" ở thân bài và "phóng viên khoa học của New York Times" ở mục Goleman; mới gộp thành "một nhà báo khoa học của New York Times" theo Time (tả ông là "science writer"). Nhan đề sách khớp danh mục tham khảo của Joseph và Newman (2010).'
    moi: 'Daniel Goleman, một nhà báo khoa học của New York Times, xuất bản cuốn Emotional Intelligence: Why It Can Matter More Than IQ năm 1995.'
    ly_do: 'Chữ cũ: "nhà báo khoa học Daniel Goleman" ở thân bài và "phóng viên khoa học của New York Times" ở mục Goleman; mới gộp thành "một nhà báo khoa học của New York Times" theo Time (tả ông là "science writer"). Nhan đề sách khớp danh mục tham khảo của Joseph và Newman (2010). (hồ sơ n5)'
  - cu: dòng chữ đặt trong ngoặc kép "có thể là yếu tố dự báo thành công trong đời tốt nhất" (ở thân bài và ở khung Bác bỏ).
    moi: Lời quảng bá trên bìa Time nói trí tuệ cảm xúc có thể là yếu tố dự báo thành công trong đời mạnh nhất.
    ly_do: 'Chữ cũ: dòng chữ đặt trong ngoặc kép "có thể là yếu tố dự báo thành công trong đời tốt nhất" (ở thân bài và ở khung Bác bỏ). Chữ mới: bỏ ngoặc kép, nói "lời quảng bá", "mạnh nhất", theo bản kể lại của Penguin, vì chưa thấy nguyên văn bìa. (hồ sơ n7)'
  - cu: '"từ EQ trở thành một hiện tượng toàn cầu — khóa học EQ, test EQ, sách dạy con EQ mọc lên khắp nơi, trong đó có Việt Nam".'
    moi: Từ viết tắt EQ lan nhanh trên báo chí.
    ly_do: không có nguồn đã mở cho "hiện tượng toàn cầu" và "khắp nơi"; phần Việt Nam xem n91. (hồ sơ n9)
  - cu: '"giới khoa học bắt đầu cãi nhau dữ dội, và cuộc cãi vã kéo dài đến tận hôm nay".'
    moi: Nhiều nhà nghiên cứu phê bình khái niệm trí tuệ cảm xúc, và cuộc tranh luận vẫn chưa ngã ngũ.
    ly_do: nguồn nói phê bình và tranh luận, không có số đo "dữ dội". (hồ sơ n10)
  - cu: '"EQ-i của Bar-On hay thang của Goleman".'
    moi: EQ tự báo cáo (trait EI hay mixed EI) là người ta tự đánh giá mình, đo bằng bảng hỏi như EQ-i của Bar-On hay thang 33 câu của Schutte, và gần với đo tính cách.
    ly_do: không có nguồn đã mở nói thang của Goleman là bảng hỏi tự báo cáo. EQ-i là thang tự báo cáo theo Petrides và Furnham (2001, nghiên cứu với BarOn EQ-i); sách hướng dẫn kỹ thuật Bar-On 1997 không đọc được. (hồ sơ n12)
  - cu: '"tuyên bố này chưa bao giờ được chứng minh".'
    moi: Tuyên bố EQ quyết định thành công hơn IQ (EQ trên truyền thông) không được các phân tích tổng hợp nêu ở dưới ủng hộ.
    ly_do: 'Chữ cũ: "tuyên bố này chưa bao giờ được chứng minh". Chữ mới nêu rõ phạm vi (các phân tích tổng hợp đã nêu). Chi tiết số ở n43, n53. (hồ sơ n13)'
  - cu: '"cảm xúc vốn bị xem là thứ đối lập với lý trí".'
    moi: Bài báo mở đầu bằng câu hỏi "trí tuệ cảm xúc" có phải một mâu thuẫn trong thuật ngữ, vì một truyền thống tư tưởng vẫn coi cảm xúc là thứ cản trở lý trí.
    ly_do: 'Chữ cũ: "cảm xúc vốn bị xem là thứ đối lập với lý trí". Chữ mới thu hẹp thành "một truyền thống tư tưởng", đúng như bài viết. (hồ sơ n17)'
  - cu: '"đọc cảm xúc qua khuôn mặt, giọng nói, tranh ảnh" và "tâm trạng vui giúp nảy ra nhiều ý tưởng".'
    moi: 'Bốn nhánh là: nhận biết cảm xúc (khuôn mặt, tranh ảnh), dùng cảm xúc hỗ trợ tư duy (ví dụ niềm vui có thể giúp lên kế hoạch cho một bữa tiệc), thấu hiểu cảm xúc (cảm xúc biến đổi ra sao), quản lý cảm xúc.'
    ly_do: '"giọng nói" và "nảy ra nhiều ý tưởng" không có trong nguồn đã mở. (hồ sơ n21)'
  - cu: '"xếp theo độ phức tạp tăng dần".'
    moi: Bốn nhánh xếp theo thứ tự của mô hình (nhận biết, hỗ trợ tư duy, thấu hiểu, quản lý).
    ly_do: không có nguồn đã mở nói "độ phức tạp" (chương 1997 không đọc được); nguồn chỉ cho thứ tự. (hồ sơ n23)
  - cu: '"cuốn sách đại chúng tổng hợp nghiên cứu về não bộ, cảm xúc và hành vi, lấy khung của Salovey và Mayer làm điểm xuất phát".'
    moi: Goleman viết một cuốn sách đại chúng, lấy khái niệm của Salovey và Mayer làm điểm xuất phát nhưng mở rộng ra nhiều.
    ly_do: phần "tổng hợp nghiên cứu về não bộ…" không có nguồn đã mở. (hồ sơ n24)
  - cu: '"năm thành phần: tự nhận thức, tự điều tiết, động lực, đồng cảm và kỹ năng xã hội … có cả tính cách (như lạc quan, tự tin)".'
    moi: Theo mô tả của Locke (2005), Goleman gộp vào EI cả tự thúc đẩy và kiên trì, trì hoãn thỏa mãn, kiềm chế xung động, đồng cảm và kỹ năng xã hội.
    ly_do: danh sách năm thành phần (thuộc các phiên bản sau của Goleman) và "lạc quan, tự tin" không có trong nguồn đã mở; danh sách của Locke lấy từ sách 1995. (hồ sơ n25)
  - cu: '"Goleman đã lặng lẽ đổi định nghĩa EQ"; "hấp dẫn với công chúng" là nhận xét của trang.'
    moi: Khái niệm bị mở rộng từ "năng lực" sang một "hỗn hợp" (mixed model) gồm năng lực, tính cách và động cơ, khiến nó hấp dẫn với công chúng nhưng khó kiểm chứng.
    ly_do: 'Chữ cũ: "Goleman đã lặng lẽ đổi định nghĩa EQ"; "hấp dẫn với công chúng" là nhận xét của trang. Chữ mới: "khái niệm đã được mở rộng". (hồ sơ n26)'
  - cu: '"bản thân Goleman cho biết ông chuộng cách viết tắt EI hơn EQ" dẫn Penguin reader''s guide.'
    moi: Bài của Time (1995) ghi Goleman không hề dùng chữ EQ trong sách; chữ EQ do báo chí rút gọn từ nhan đề.
    ly_do: reader's guide không nói điều đó (đã đọc). Thay bằng câu của Time. (hồ sơ n27)
  - cu: '"chuyên gia và đa số đồng thuận với nhau ở mức cao".'
    moi: Chuyên gia và đa số chọn nhiều đáp án giống nhau, và chuyên gia đồng thuận với nhau cao hơn, đặc biệt ở những câu có đáp án rõ ràng (như đọc cảm xúc trên khuôn mặt).
    ly_do: chữ gần với abstract hơn ("many of the same answers"; "superior agreement" của chuyên gia). (hồ sơ n31)
  - cu: '"phân tích nhân tố ủng hộ cấu trúc bốn nhánh".'
    moi: Phân tích nhân tố cho thấy các mô hình một, hai và bốn nhân tố đều khớp khá tốt, mô hình bốn nhân tố khớp nhất.
    ly_do: tác giả kết luận một, hai và bốn nhân tố đều là cách biểu diễn khả dĩ; bốn nhân tố khớp tốt hơn. (hồ sơ n33)
  - cu: '"bằng chứng mạnh nhất".'
    moi: MSCEIT là một bằng chứng quan trọng cho thấy EQ có thể đo như một năng lực.
    ly_do: so sánh "mạnh nhất" không có nguồn; tác giả chính họ nói kết quả chỉ "viable". (hồ sơ n34)
  - cu: '"ở công việc ít đòi hỏi lao động cảm xúc (lập trình, kế toán) thì mối liên hệ biến mất, thậm chí hơi âm" (bản G1 đã bỏ "r = .00", "N = 226").'
    moi: Ở công việc ít đòi hỏi lao động cảm xúc, tương quan của EQ năng lực là r = .00 (3 nghiên cứu, N = 223), và sau khi kiểm soát IQ và tính cách phần đóng góp riêng của nó ở nhóm việc này còn âm.
    ly_do: 'Chữ cũ: "ở công việc ít đòi hỏi lao động cảm xúc (lập trình, kế toán) thì mối liên hệ biến mất, thậm chí hơi âm" (bản G1 đã bỏ "r = .00", "N = 226"). Chữ mới có số kiểm được: r = .00, 3 nghiên cứu, N = 223 (không phải 226). G1 xếp r = .00 vào ĐÁNG NGỜ. (hồ sơ n40)'
  - cu: '"EQ chỉ dự báo hiệu suất ở những công việc đòi hỏi nhiều lao động cảm xúc" (không phân loại EQ).'
    moi: EQ năng lực (đo bằng bài test) mới là loại dự báo hiệu suất ở việc nhiều lao động cảm xúc nhưng không ở việc ít lao động cảm xúc; EQ mixed và EQ năng lực tự báo cáo tương quan với hiệu suất ở cả hai loại việc.
    ly_do: với EQ mixed, r = .37 (nhiều lao động cảm xúc) và .27 (ít); với năng lực tự báo cáo r = .20 và .14; chỉ EQ năng lực đo bằng test là ≈ 0 ở việc ít lao động cảm xúc. (hồ sơ n41)
  - cu: '"bán hàng, chăm sóc khách hàng, y tế" và "lập trình, kế toán" (cả ở thân bài và đáp án quiz câu 4).'
    moi: 'Ví dụ công việc: nhiều lao động cảm xúc như nhân viên bán lẻ, môi giới bất động sản, nhân viên tổng đài; ít lao động cảm xúc như công nhân nhà máy, thợ cơ khí, nhà nghiên cứu phát triển.'
    ly_do: 'y tế, lập trình, kế toán không nằm trong ví dụ của nguồn; chữ mới lấy ví dụ của chính bài. Định nghĩa lao động cảm xúc cũng đổi từ "quản lý cảm xúc của mình và người khác" thành "biểu lộ cảm xúc theo yêu cầu công việc" (mục mã hóa: "expected to express positive emotion as part of this job"). (hồ sơ n42)'
  - cu: '"r ≈ .17, chưa hiệu chỉnh" và "r ≈ .42".'
    moi: EQ năng lực tương quan với hiệu suất ở mức khiêm tốn (ρ ≈ .17) và EQ tự báo cáo/mixed cho con số cao hơn (ρ ≈ .42), đã hiệu chỉnh độ tin cậy của thước đo hiệu suất và hạn chế biên độ.
    ly_do: Bảng 4 ghi các hệ số với hiệu suất đã hiệu chỉnh cho độ tin cậy của tiêu chí và hạn chế biên độ, nên là ρ và không phải "chưa hiệu chỉnh". (hồ sơ n43)
  - cu: '"nền tảng lý thuyết yếu nhất".'
    moi: EQ mixed là loại có nền tảng lý thuyết yếu hơn EQ năng lực.
    ly_do: nguồn so sánh hai loại ("weaker"), không xếp hạng "yếu nhất". (hồ sơ n44)
  - cu: '"các tác giả cảnh báo không nên tin con số này" và dẫn thêm "số liệu lao động cảm xúc tổng hợp trong Côté (2014)".'
    moi: EQ mixed có đóng góp thêm ΔR² = .14 sau khi kiểm soát IQ và Big Five, nhưng các tác giả cho rằng chưa rõ vì sao và khuyên hết sức thận trọng khi dùng nó, vì khái niệm mixed thiếu chặt chẽ.
    ly_do: tác giả nói chưa rõ vì sao và khuyên thận trọng khi áp dụng, không nói không tin con số; số lao động cảm xúc lấy thẳng từ bài Joseph và Newman, bỏ dẫn Côté ở câu này (Côté vẫn dùng ở khung Tranh cãi). (hồ sơ n46)
  - cu: '"Vẫn nhóm tác giả trên quay lại".'
    moi: Joseph và Newman, cùng Jin và O'Boyle (2015), quay lại câu hỏi vì sao EQ mixed lại dự báo hiệu suất tốt đến thế.
    ly_do: bài 2015 có thêm Jin và O'Boyle. (hồ sơ n47)
  - cu: '"chỉ tính các nghiên cứu dùng đánh giá của cấp trên — loại bỏ đánh giá tự chấm dễ thổi phồng".'
    moi: Bài 2015 cập nhật phân tích tổng hợp với hiệu suất theo đánh giá của cấp trên, như bản 2010.
    ly_do: bản 2010 đã dùng đánh giá cấp trên; 2015 cập nhật số nghiên cứu (k = 15 so với 9); không có nguồn nói đánh giá tự chấm "thổi phồng" là lý do. (hồ sơ n49)
  - cu: '"gần như toàn bộ nội dung thang đo đã được các khái niệm cũ bao phủ".'
    moi: Multiple R = .79 tương ứng R² = .62, tức khoảng 62% phương sai của thang mixed EI do các khái niệm cũ giải thích.
    ly_do: R² = .62 nghĩa là khoảng 62%, không phải gần như toàn bộ. (hồ sơ n52)
  - cu: '"cha đẻ của lý thuyết đặt mục tiêu".'
    moi: Edwin Locke là đồng tác giả của lý thuyết đặt mục tiêu, một tên tuổi lớn trong tâm lý học tổ chức.
    ly_do: Locke ghi là lý thuyết "(với Latham)". (hồ sơ n55)
  - cu: '"EQ hoặc là trí tuệ áp dụng vào lĩnh vực cảm xúc — thì không phải khái niệm mới; hoặc là một bó tính cách và kỹ năng — thì không phải trí tuệ" (ở thân bài và ở mục Các lý thuyết giải thích: "bài toán logic của Locke", "nếu EQ là bó gồm lạc quan, tự tin, khéo giao tiếp").'
    moi: 'Lập luận của Locke có hai ý: EI không phải một dạng trí tuệ (theo ông là tổ hợp thói quen, kỹ năng, lựa chọn), và được định nghĩa rộng đến mức không còn nghĩa rõ ràng.'
    ly_do: nguồn không trình bày lưỡng đề này; chữ mới theo abstract và tr. 426. (hồ sơ n57)
  - cu: '"kết luận rằng phần lớn những gì được quảng cáo về EQ vượt xa dữ liệu thực tế".'
    moi: 'Matthews, Zeidner và Roberts (2002) dành cả một cuốn sách (Emotional Intelligence: Science and Myth) để rà soát bằng chứng, kết luận bằng chứng cho một khái niệm EI được xác định rõ còn thưa và bác bỏ một số tuyên bố quá đà trên truyền thông.'
    ly_do: tóm tắt chỉ nói bằng chứng thưa và "một số" tuyên bố quá đà; sách không đọc toàn văn. (hồ sơ n58)
  - cu: '"Mọi phân tích tổng hợp đều cho cùng một kết quả".'
    moi: Các phân tích tổng hợp đã nêu cho thấy thang EQ tự đánh giá tương quan từ vừa đến mạnh với các đặc điểm Big Five, đặc biệt là ổn định cảm xúc, tận tâm và hướng ngoại.
    ly_do: chỉ có hai bài đã đọc; chữ mới nói "các phân tích đã nêu". (hồ sơ n60)
  - cu: '"gần như trùng với".'
    moi: Hỏi "bạn có kiểm soát cảm xúc tốt không" cho đáp án khá gần với hỏi "bạn có phải người điềm tĩnh, có tổ chức không" (minh họa).
    ly_do: r = .45 và .33 là mức vừa. (hồ sơ n61)
  - cu: '"vẫn giữ được một phần giá trị dự báo gia tăng sau khi kiểm soát IQ và Big Five" (cho cả ba dòng).'
    moi: 'O''Boyle và cộng sự (2011): cả ba dòng đo EQ đều tương quan hiệu chỉnh .24–.30 với hiệu suất, và hai dòng dựa trên tự báo cáo có giá trị dự báo gia tăng lớn nhất sau khi kiểm soát IQ và Big Five.'
    ly_do: abstract chỉ nói dòng 2 và 3 có giá trị gia tăng lớn nhất. (hồ sơ n67)
  - cu: '"Điểm đồng thuận duy nhất: …" (không nguồn nói "duy nhất").'
    moi: 'Một điểm các nghiên cứu cùng thấy: hiệu quả của EQ phụ thuộc loại công việc; việc càng đòi hỏi lao động cảm xúc, EQ càng có đất dụng võ.'
    ly_do: 'Chữ cũ: "Điểm đồng thuận duy nhất: …" (không nguồn nói "duy nhất"). Chữ mới có dẫn hai nguồn. (hồ sơ n69)'
  - cu: (xem ghi_chu)
    moi: Đây là thông điệp trên trang bìa Time năm 1995, không phải kết luận khoa học.
    ly_do: 'Chữ cũ có dẫn nguyên câu trong ngoặc kép: "có thể là yếu tố dự báo thành công trong đời tốt nhất". Xem n7. (hồ sơ n71)'
  - cu: '"Không có phân tích tổng hợp nào ủng hộ nó: mối liên hệ … ở mức khiêm tốn…".'
    moi: 'Chúng tôi không tìm thấy phân tích tổng hợp nào ủng hộ thông điệp ấy: EQ năng lực tương quan với hiệu suất ρ ≈ .17, thấp hơn năng lực nhận thức (≈ .40); EQ mixed cao hơn (≈ .42) nhưng phần lớn là tính cách, sự tự tin và IQ "đội lốt".'
    ly_do: khẳng định phủ định mạnh; chữ mới nói "chúng tôi không tìm thấy" và thêm số. Hunter & Hunter 1984 là nguồn của .40 trong bảng của Joseph và Newman. (hồ sơ n72)
  - cu: '"người lạc quan có xu hướng chấm mình cao ở mọi thang tích cực".'
    moi: Tự báo cáo "đụng" tính cách vì nội dung câu hỏi giống nhau (ví dụ minh họa của trang) và vì cùng phương pháp tự đánh giá (yếu tố phương pháp tự báo cáo).
    ly_do: không có nguồn đã mở cho hành vi này; chữ mới theo kết luận về yếu tố phương pháp. Hai câu ví dụ là minh họa của trang (gia-dinh), đã ghi "ví dụ minh họa". (hồ sơ n75)
  - cu: '"siết chặt định nghĩa về dòng năng lực và từ chối bảo vệ dòng mixed — một sự nhượng bộ đáng kể".'
    moi: Mayer, Salovey và Caruso (2008) đáp lại bằng cách phân biệt EI như một nhóm năng lực với một "hỗn hợp các nét tích cực" như hạnh phúc, tự trọng, lạc quan, và chỉ bảo vệ dòng năng lực.
    ly_do: '"nhượng bộ" và "từ chối bảo vệ" là diễn giải; abstract chỉ nói phân biệt hai loại và EI như năng lực có giá trị. (hồ sơ n77)'
  - cu: '"Đa số có thể sai — nhất là với những câu hỏi cảm xúc tinh tế, nơi chuyên gia và đám đông bất đồng".'
    moi: Chấm điểm theo đồng thuận (consensus scoring) nghĩa là "đúng" = "đa số chọn"; đa số có thể sai, và chính các tác giả nêu vấn đề khi đáp án đám đông và chuyên gia lệch nhau.
    ly_do: '"câu tinh tế" không có trong nguồn. (hồ sơ n78)'
  - cu: '"không bao giờ ''sạch''" (hai chỗ: Các lý thuyết giải thích, Ngộ nhận).'
    moi: Đo cảm xúc khó "sạch" như đo toán (nhận xét của trang, rút từ khó khăn của chấm theo đồng thuận).
    ly_do: '"không bao giờ" quá tuyệt đối; tác giả chỉ nói phải dùng hết sức thận trọng. (hồ sơ n80)'
  - cu: '"Hầu hết các bài test EQ trên mạng là bảng hỏi tự báo cáo".'
    moi: Các bảng hỏi EQ tự báo cáo là bạn tự chấm mình khéo léo, điềm tĩnh, đồng cảm đến đâu; kết quả phản ánh cách bạn nhìn mình và một phần tính cách Big Five nhiều hơn là năng lực xử lý cảm xúc thật sự.
    ly_do: không có khảo sát về các test trên mạng; chữ mới nói về bảng hỏi tự báo cáo nói chung (EQ-i, thang Schutte). (hồ sơ n82)
  - cu: (xem ghi_chu)
    moi: Điểm tự báo cáo về "năng lực" chỉ tương quan yếu (r = .12) với điểm đo bằng bài test năng lực.
    ly_do: Câu mới thêm vào trang (chữ cũ không có số). (hồ sơ n83)
  - cu: '"thì là lạm dụng". "Cho con học gì" nằm ngoài nguồn (nguồn nói về tuyển dụng); giữ như mở rộng hợp lý, ghi rõ đây là suy luận.'
    moi: Dùng bảng hỏi EQ để quyết định tuyển ai, cho con học gì thì nên hết sức thận trọng.
    ly_do: 'Chữ cũ: "thì là lạm dụng". "Cho con học gì" nằm ngoài nguồn (nguồn nói về tuyển dụng); giữ như mở rộng hợp lý, ghi rõ đây là suy luận. (hồ sơ n84)'
  - cu: '"Đây là kỹ năng có thể luyện (kỹ thuật hít thở, đặt tên cảm xúc, trì hoãn phản ứng)".'
    moi: 'Mô hình thác gợi ý một thứ tự ưu tiên: khâu quyết định là điều tiết cảm xúc; đây là gợi ý từ mô hình tổng hợp tương quan, chưa phải kết quả của thử nghiệm huấn luyện.'
    ly_do: không có nguồn đã mở cho khả năng luyện hay các kỹ thuật; chữ mới nói rõ giới hạn và dẫn bài Nén cảm xúc có tốt? Thêm "mục tiêu cụ thể rõ ràng hơn "nâng EQ lên 10 điểm"" là nhận xét của trang. (hồ sơ n86)
  - cu: '"thang tự báo cáo dễ ''diễn'' (ai cũng biết nên chọn đáp án ''tôi luôn bình tĩnh'')" và "hãy đo thẳng tính cách Big Five và năng lực nhận thức".'
    moi: 'Tuyển dụng (nhãn Đang tranh cãi): nội dung thang tự báo cáo trùng lắp với tính cách và năng lực nhận thức, và chưa rõ nó đo gì, nên Joseph và Newman (2010) khuyên hết sức thận trọng khi dùng chúng để ra quyết định nhân sự.'
    ly_do: không có nguồn đã mở cho "dễ diễn" và cho lời khuyên đo thẳng Big Five. Nhãn Đang tranh cãi giữ vì tranh luận về giá trị gia tăng (khung Tranh cãi). (hồ sơ n88)
  - cu: '"Người khéo … có thể đơn giản là hướng ngoại + dễ chịu + tận tâm … Ngược lại, người trầm tính, vụng giao tiếp vẫn có thể đọc vị cảm xúc người khác rất chính xác."'
    moi: 'Khá vững: người khéo ăn khéo nói chưa chắc đã giỏi đọc cảm xúc qua một bài test khách quan; điểm EQ năng lực chỉ tương quan yếu với Big Five (r từ .12 đến .25).'
    ly_do: không có nguồn đã mở cho phần "ngược lại"; chữ mới dùng hệ số Bảng 4. Câu "khéo ăn khéo nói" là ví dụ minh họa. (hồ sơ n90)
  - cu: '"các khóa học EQ cho trẻ em được quảng cáo rầm rộ — từ lớp kỹ năng sống đến trại hè rèn EQ".'
    moi: 'Ở Việt Nam, các khóa học EQ đang thành một xu hướng: người trưởng thành tìm đến các khóa đào tạo EQ để xử lý căng thẳng và các mối quan hệ (VnExpress, 2024).'
    ly_do: bài đã đọc nói về khóa cho người trưởng thành, không nói trẻ em; không tìm được nguồn cho trại hè rèn EQ. (hồ sơ n91)
  - cu: '"chưa có đánh giá độc lập nào về hiệu quả … và hầu hết chúng dạy theo nghĩa mixed EI (tự tin, giao tiếp, lạc quan)".'
    moi: Tính đến 11/2026, chúng tôi chưa tìm thấy đánh giá độc lập nào về hiệu quả của các khóa học EQ thương mại ở Việt Nam, cũng như khảo sát nào về việc các khóa ấy dạy theo nghĩa năng lực hay nghĩa mixed.
    ly_do: '"hầu hết dạy mixed" không có nguồn, bỏ; thêm mốc 11/2026. Chưa tìm Google Scholar hay tạp chí trong nước. (hồ sơ n92)'
  - cu: '"các nền văn hóa Á Đông, trong đó có Việt Nam, thường có quy tắc thể hiện cảm xúc kiềm chế hơn — ít bộc lộ cảm xúc mạnh ra mặt" và "Văn hóa Việt Nam vốn đề cao ''khéo ăn khéo nói''… ''khéo'' gần với sự tinh tế xã hội…" (hai câu bị bỏ: không có nguồn; câu thứ nhất khái quát về cả Á Đông và Việt Nam).'
    moi: Phân tích tổng hợp của Elfenbein và Ambady (2002) thấy cảm xúc được nhận ra chính xác hơn khi người biểu lộ và người nhận cùng một nhóm văn hóa.
    ly_do: 'Chữ cũ: "các nền văn hóa Á Đông, trong đó có Việt Nam, thường có quy tắc thể hiện cảm xúc kiềm chế hơn — ít bộc lộ cảm xúc mạnh ra mặt" và "Văn hóa Việt Nam vốn đề cao ''khéo ăn khéo nói''… ''khéo'' gần với sự tinh tế xã hội…" (hai câu bị bỏ: không có nguồn; câu thứ nhất khái quát về cả Á Đông và Việt Nam). Chữ mới dẫn kết quả tổng hợp. Trang Cảm xúc cơ bản (cùng lô) cũng dẫn Elfenbein và Ambady. (hồ sơ n93)'
  - cu: '"được chuẩn hóa trên mẫu phương Tây … một người Việt Nam đọc khuôn mặt theo chuẩn Việt Nam có thể bị chấm ''sai'' theo chuẩn Mỹ".'
    moi: Mẫu chuẩn hóa của MSCEIT chủ yếu là người Mỹ (1.240 trong 2.112 người), làm bài bằng tiếng Anh, không có người Việt.
    ly_do: mẫu có 34% người châu Á và nhiều nước, nên "phương Tây" không đúng; câu "chấm sai theo chuẩn Mỹ" là suy luận của trang, đã ghi rõ là suy luận. (hồ sơ n94)
  - cu: '"1.593 thanh thiếu niên", "nam giới điểm cao hơn nữ giới".'
    moi: Nguyen và cộng sự (2020) khảo sát 1.593 học sinh Việt Nam bằng bản dịch tiếng Việt của thang TEIQue, thấy nam sinh có điểm EI chung cao hơn nữ sinh và sự ấm áp của cha mẹ liên quan đến EI cao hơn ở con.
    ly_do: 'nguồn nói "students"/"adolescents" (học sinh) và "boys"/"girls"; tránh đọc thành người trưởng thành. Theo G1-L04: KHỚP abstract. (hồ sơ n96)'
  - cu: '"tất cả đều dùng thang tự báo cáo và mang tính mô tả".'
    moi: Các nghiên cứu ấy đều dùng thang đo (TEIQue, REIS, BarOn EQ-i), không phải bài test năng lực kiểu MSCEIT.
    ly_do: chưa xác nhận REIS là tự báo cáo, và Nguyen 2020 có phân tích hồi quy nên không chỉ mô tả; chữ mới nói điều xác nhận được. (hồ sơ n98)
  - cu: '"Chúng tôi chưa tìm thấy nghiên cứu nào…" (không mốc).'
    moi: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào trên mẫu Việt Nam kiểm định mô hình EQ năng lực (MSCEIT) hay đo giá trị dự báo gia tăng của EQ so với IQ và tính cách.
    ly_do: 'Chữ cũ: "Chúng tôi chưa tìm thấy nghiên cứu nào…" (không mốc). Chữ mới thêm mốc. Lần tìm: Crossref, ba truy vấn nêu ở nguồn; OpenAlex bị giới hạn lượt gọi nên không dùng được; chưa tìm Google Scholar hay tạp chí trong nước. (hồ sơ n99)'
  - cu: '"đều đến từ mẫu phương Tây".'
    moi: Các con số về "EQ dự báo hiệu suất" trong bài lấy từ các phân tích tổng hợp quốc tế, không tách riêng người Việt; áp dụng sang Việt Nam cần thận trọng.
    ly_do: các phân tích tổng hợp đã đọc không ghi quốc gia của mẫu, nên không khẳng định được "phương Tây". (hồ sơ n100)
  - cu: '"không phải kết luận của phân tích tổng hợp nào. Dữ liệu tổng hợp cho thấy EQ (dù đo kiểu gì) cũng chỉ liên hệ khiêm tốn …, và một phần trong đó thực chất là IQ và tính cách".'
    moi: '"Khoa học đã chứng minh EQ quan trọng hơn IQ.": thông điệp trên bìa Time 1995, không phải kết luận của phân tích tổng hợp nào chúng tôi tìm thấy; EQ năng lực chỉ liên hệ khiêm tốn với hiệu suất, còn EQ mixed thì phần lớn là IQ và tính cách.'
    ly_do: ρ mixed ≈ .42 (2010) không "khiêm tốn"; chữ mới tách hai loại. (hồ sơ n101)
  - cu: '"Đa số các test này là thang tự báo cáo" (về test online).'
    moi: Các bảng hỏi EQ tự báo cáo đo cách bạn tự nhìn mình, gần với đo tính cách hơn là đo năng lực; MSCEIT là bài thi giải quyết tình huống có đáp án đúng, không phải bảng hỏi.
    ly_do: xem n82. (hồ sơ n102)
  - cu: '"đôi khi phản ứng phù hợp chính là thể hiện sự giận dữ một cách có kiểm soát".'
    moi: Điều tiết cảm xúc, theo định nghĩa của Mayer và Salovey (1997, trích qua Joseph và Newman 2010), là điều chỉnh có ý thức cảm xúc để thúc đẩy sự phát triển cảm xúc và trí tuệ, chứ không phải đè nén mọi cảm xúc tiêu cực; EQ năng lực là khả năng, không phải tính khí vui vẻ.
    ly_do: không có nguồn đã mở; chữ mới theo định nghĩa của Mayer và Salovey. (hồ sơ n103)
  - cu: '"Bó tính cách lạc quan/tự tin là thứ Goleman thêm vào sau, và đó chính là nguồn gốc của mọi tranh cãi."'
    moi: 'Quiz 1 (giải thích): những thứ như tự thúc đẩy, kiên trì, kỹ năng xã hội là phần được thêm vào khi khái niệm được mở rộng (theo mô tả của Locke về Goleman), và là một nguồn gốc của tranh cãi.'
    ly_do: lạc quan, tự tin không có trong danh sách của nguồn; "mọi tranh cãi" quá mạnh. (hồ sơ n107)
  - cu: '"đòn phê bình mạnh nhất".'
    moi: 'Quiz 2: Joseph và cộng sự (2015) ước tính mức trùng lắp multiple R = .79, và sau khi loại phần trùng lắp, mối liên hệ với hiệu suất gần như biến mất (β = -.02); đây là một đòn phê bình quan trọng nhắm vào dòng mixed EI.'
    ly_do: '"mạnh nhất" không có nguồn so sánh. (hồ sơ n108)'
