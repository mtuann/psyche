    vi_tri: msceit2003, mục Confirmatory factor analyses
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "phân tích nhân tố ủng hộ cấu trúc bốn nhánh". Lý do: tác giả kết luận một, hai và bốn nhân tố đều là cách biểu diễn khả dĩ; bốn nhân tố khớp tốt hơn. Review (Claude Opus 5.5, 10/11/2026): dung. Khớp.'
    luot_2: dung
