    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đọc cảm xúc qua khuôn mặt, giọng nói, tranh ảnh" và "tâm trạng vui giúp nảy ra nhiều ý tưởng". Chữ mới theo nhiệm vụ MSCEIT (faces, pictures; joy và kế hoạch bữa tiệc). Lý do: "giọng nói" và "nảy ra nhiều ý tưởng" không có trong nguồn đã mở. Ví dụ bực bội thành giận dữ là minh họa (gia-dinh). Review (Claude Opus 5.5, 10/11/2026): dung. Ví dụ bữa tiệc là minh họa; cấu trúc bốn nhánh đúng.'
