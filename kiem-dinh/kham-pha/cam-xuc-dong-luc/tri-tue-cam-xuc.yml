    cau: Chuyên gia và đa số chọn nhiều đáp án giống nhau, và chuyên gia đồng thuận với nhau cao hơn, đặc biệt ở những câu có đáp án rõ ràng (như đọc cảm xúc trên khuôn mặt).
    loai: phat-hien
    nguon:
      - msceit2003
    trich: Twenty-one emotions experts endorsed many of the same answers, as did 2,112 members of the standardization sample, and exhibited superior agreement, particularly when research provides clearer answers to test questions (e.g., emotional perception in faces).
    vi_tri: msceit2003, Abstract; tương quan tần suất chọn giữa hai nhóm r(705) = .908
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "chuyên gia và đa số đồng thuận với nhau ở mức cao". Lý do: chữ gần với abstract hơn ("many of the same answers"; "superior agreement" của chuyên gia). Cũng áp cho lý thuyết MSCEIT, Ngộ nhận (đã sửa "chỉ" thành "đặc biệt" theo G1, khớp nguồn). Review (Claude Opus 5.5, 10/11/2026): dung. Khớp Mayer và cộng sự 2003.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.97.pdf" ]
    review: dung
