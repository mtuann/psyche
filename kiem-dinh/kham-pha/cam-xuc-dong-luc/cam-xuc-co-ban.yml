  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Chính từ dòng nghiên cứu này, Ekman đề xuất danh sách sáu cảm xúc cơ bản". Chữ mới nói bộ ảnh chia theo sáu loại, lấy từ Tomkins. Lý do: bài 1969 nói rõ lấy từ danh sách sơ cấp của Tomkins (tám loại: hứng thú, vui, ngạc nhiên, sợ, giận, đau khổ, ghê tởm–khinh miệt, xấu hổ). Lý lịch ai "đề xuất" không xác nhận được từ bài.'
