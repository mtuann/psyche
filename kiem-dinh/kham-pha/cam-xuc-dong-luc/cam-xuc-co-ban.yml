  ghi_chu: 'Chữ cũ: "người phân biệt được bực, thất vọng, tủi thân ... có thể điều tiết cảm xúc tốt hơn. Đây là đề xuất từ lý thuyết kiến tạo, chưa phải lời khuyên đã được kiểm chứng bằng thử nghiệm — nhưng ... vô hại và có thể hữu ích." Chữ mới dẫn Kashdan và cộng sự 2015 và bỏ "vô hại". Lý do: tóm tắt có nói bằng chứng cho can thiệp, nên "chưa kiểm chứng bằng thử nghiệm" quá mạnh; "vô hại" không có nguồn. Chỉ tóm tắt. Ví dụ "bực, thất vọng, tủi thân" là giả định.'
