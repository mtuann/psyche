  cau: 'Các tác giả kết luận có một "yếu tố xuyên văn hóa" trong nét mặt: sự liên kết giữa chuyển động cơ mặt và các cảm xúc cơ bản; mỗi văn hóa vẫn khác nhau ở điều gây ra cảm xúc và quy tắc thể hiện.'
