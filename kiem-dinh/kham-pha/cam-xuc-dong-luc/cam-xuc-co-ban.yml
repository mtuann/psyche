nhan_dinh:
- id: n1
  cau: 'Mô tả của trang: nghiên cứu của Ekman (1969) với người Fore ở Papua New Guinea, danh sách 6 cảm xúc cơ bản, và phê bình của Lisa Feldman Barrett về việc nét mặt có phải "chữ viết chung" của cảm xúc.'
  loai: lich-su
  nguon:
  - ekman1969
  - barrett2019
  trich: The observers' task was to select a word from a list of six affects for each picture.
  vi_tri: 'Ekman 1969, tr. 87; Barrett 2019, tóm tắt: "people do sometimes smile when happy, frown when sad ... more than what would be expected by chance. Yet there is substantial variation"'
  ket_qua: dung
  ghi_chu: Cụm "chữ viết chung" là cách nói của trang, không trích.
- id: n2
  cau: Với bộ ảnh nét mặt chuẩn trong nghiên cứu của Ekman, phần lớn người xem ở Mỹ, Brazil và Nhật chọn đúng nhãn dự kiến.
  loai: so-lieu
  nguon: &id001
  - ekman1969
  trich: The data from the three literate samples support our contention of a pan-cultural element in facial affect display.
  vi_tri: 'Ekman 1969, Bảng 1 (cột Mỹ, Brazil, Nhật: 63–97%) và tr. 88'
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Hầu như ai cũng đoán đúng." Chữ mới: "Với bộ ảnh nét mặt chuẩn trong nghiên cứu sắp kể, phần lớn người xem ở Mỹ, Brazil và Nhật cũng chọn đúng nhãn dự kiến." Lý do: câu cũ nói về mọi người, nguồn chỉ có ba mẫu sinh viên đại học và đáp đúng 63–97% tùy cảm xúc.'
- id: n3
  cau: Khuôn mặt "mắt trợn tròn miệng há hốc" có thể bị gọi là sợ hay ngạc nhiên (chỗ nhập nhằng sẽ gặp ở dưới).
  loai: phat-hien
  nguon: *id001
  trich: Fear (F) 88 F ... 26 Su
  vi_tri: 'Ekman 1969, Bảng 1, hàng Fear: Nhật 71% sợ, 26% ngạc nhiên; Borneo 40% sợ, 33% ngạc nhiên'
  ket_qua: dung
  ghi_chu: Ba khuôn mặt của mục Tự trải nghiệm là ví dụ giả định (gia-dinh); chỉ ý "dễ lẫn sợ và ngạc nhiên" cần nguồn.
- id: n4
  cau: Cuối thập niên 1960, Paul Ekman mang câu hỏi về nét mặt đến người Fore ở vùng núi Papua New Guinea.
  loai: lich-su
  nguon:
  - ekman1969
  - ekman1971
  trich: We studied the Fore most influenced by contacts with Westerners ... as well as those least influenced by these recent contacts who have preferred to remain in their isolated hamlets in the mountains.
  vi_tri: 'Ekman 1969, tr. 87 (nhận 17/10/1968, đăng 4/1969); Ekman & Friesen 1971, mục Subjects: "South East Highlands of New Guinea"'
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "mang chính câu hỏi này đến một bộ tộc sống tách biệt trong rừng núi Papua New Guinea" và "một người chưa từng tiếp xúc với văn hóa phương Tây". Chữ mới: "người Fore ở vùng núi", "một người ít tiếp xúc". Lý do: mẫu 1969 đã tiếp xúc nhiều với phương Tây (G1; Ekman & Friesen 1971); nhất quán với phần Điều gì đang xảy ra.'
- id: n5
  cau: Nếu người ở mọi nền văn hóa đều đọc nét mặt giống nhau, cảm xúc có thể là "phần cứng" sinh học chung; nếu không, cảm xúc có thể là thứ học từ văn hóa.
  loai: phat-hien
  nguon: &id002
  - ekman1971
  trich: Universals in facial behavior associated with emotion can be explained from a number of nonexclusive viewpoints as being due to evolution, innate neural programs, or learning experiences common to human development regardless of culture
  vi_tri: Ekman & Friesen 1971, Discussion, đoạn 4
  ket_qua: dung
  ghi_chu: 'Câu suy luận có "có thể": chính tác giả nói hiểu theo tiến hóa hay học tập chung đều được; câu giữ "có thể", không nói chắc.'
- id: n6
  cau: Charles Darwin đã viết về nét mặt thể hiện cảm xúc phổ quát từ năm 1872.
  loai: lich-su
  nguon: *id001
  trich: our findings support Darwin's (4) suggestion that facial expressions of emotion are similar among humans, regardless of culture, because of their evolutionary origin
  vi_tri: 'Ekman 1969, tr. 86–87; tài liệu tham khảo 4: Darwin, The Expression of the Emotions in Man and Animals (1872)'
  ket_qua: dung
- id: n7
  cau: Đến thập niên 1960, nhiều học giả cho rằng mỗi nền văn hóa có "ngôn ngữ" nét mặt riêng.
  loai: lich-su
  nguon:
  - ekman1969
  - ekman1971
  trich: This finding contradicts (i) the theory (1) that facial displays of emotion are socially learned and therefore culturally variable
  vi_tri: 'Ekman 1969, tr. 86 (tài liệu 1: Klineberg 1940, La Barre 1947); Ekman & Friesen 1971, tr. 124'
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "nhiều nhà nhân học cho rằng". Chữ mới: "nhiều học giả cho rằng". Lý do: nguồn dẫn Klineberg (tâm lý xã hội) và La Barre (nhân học), Birdwhistell; không chỉ nhà nhân học.'
- id: n8
  cau: 'Ekman kiểm tra trực tiếp: cho người ở các nền văn hóa khác nhau xem cùng một bộ ảnh nét mặt và yêu cầu chọn từ chỉ cảm xúc.'
  loai: phat-hien
  nguon: *id001
  trich: The observers' task was to select a word from a list of six affects for each picture.
  vi_tri: Ekman 1969, tr. 87
  ket_qua: dung
- id: n9
  cau: Người Fore là cộng đồng ở vùng cao nguyên Papua New Guinea còn biệt lập cho tới cuối thập niên 1950.
  loai: lich-su
  nguon: *id002
  trich: Until 12 years ago, this was an isolated, Neolithic, material culture
  vi_tri: Ekman & Friesen 1971, mục Method, Subjects ("South East Highlands of New Guinea")
  ket_qua: dung
  ghi_chu: Bài 1971 viết khoảng 1970, "12 năm trước" tương ứng cuối thập niên 1950; bài 1969 cũng viết "12 years ago" (viết 1968, khoảng 1956). Chấp nhận "cuối thập niên 1950" theo bài 1971.
- id: n10
  cau: Người Fore trong nghiên cứu năm 1969 đã tiếp xúc khá nhiều với người phương Tây; ở nghiên cứu năm 1971, Ekman mới chọn riêng những người gần như chưa tiếp xúc.
  loai: lich-su
  nguon:
  - ekman1971
  - ekman1969
  - barrett2019
  trich: members of two preliterate cultures who had extensive contact with Western cultures (the Sadong of Borneo and the Fore of New Guinea), although the latter results were not as strong (Ekman, Sorenson, & Friesen, 1969)
  vi_tri: 'Ekman & Friesen 1971, tr. 125; Ekman 1969, tr. 87: "We report in detail only on the most Westernized Fore"'
  ket_qua: da-sua
  ghi_chu: 'G1 (SAI, đã áp vào trang): chữ cũ nói mẫu Fore 1969 là người "gần như chưa tiếp xúc"; chữ mới như trên. Đối chiếu lại: chữ hiện trên trang khớp trích của Ekman & Friesen 1971 và Ekman 1969.'
- id: n11
  cau: Người tham gia ở 5 mẫu xem cùng một bộ ảnh nét mặt của người phương Tây, rồi chọn từ cảm xúc phù hợp.
  loai: phat-hien
