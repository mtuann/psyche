- id: n14
  cau: Với vui, sợ, giận và ghê tởm, người Fore chọn đúng nhãn ở tỉ lệ trên mức may rủi (khoảng 17% với 6 lựa chọn), nhưng thấp hơn người Mỹ.
  loai: so-lieu
  nguon: *id001
  trich: Happy (H) 97 H ... 82 H; Fear 88 F ... 54 F; Anger 69 A ... 50 A; Disgust-contempt 82 D ... 44 D
  vi_tri: Ekman 1969, Bảng 1, cột United States và Fore responses
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Người Fore nhận diện đúng ở tỉ lệ trên mức may rủi trong mọi cảm xúc. Nhưng có hai điểm đáng chú ý:". Chữ mới: chỉ nói vui, sợ, giận, ghê tởm trên may rủi, và tách riêng ngạc nhiên, buồn (n17). Lý do: ở nhóm trả lời bằng tiếng Fore, nhãn được chọn nhiều nhất cho ngạc nhiên là "sợ" (45%) và cho buồn là "giận" (56%); bài 1969 nói ngạc nhiên và buồn chỉ nhận ra ở 2/3 mẫu. Mức may rủi 1/6 = 16,7% là phép tính từ 6 lựa chọn.'
