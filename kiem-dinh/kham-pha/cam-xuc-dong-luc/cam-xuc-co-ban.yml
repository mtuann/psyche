  cau: 'Hai mẫu "tiền biết chữ" là người Fore ở New Guinea (trả lời bằng hai ngôn ngữ: Pidgin và tiếng Fore) và người ở Borneo.'
  loai: phat-hien
  nguon: *id001
  trich: There were two subsamples in the most Westernized Fore; one subsample performed the judgment task by using Pidgin translations of the affect terms, and the other subsample used the affect terms of their own Fore language. The Borneo sample was the Sadong
  vi_tri: Ekman 1969, tr. 87–88
