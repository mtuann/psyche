- id: n19
  cau: 'Ở người Fore, các cảm xúc tiêu cực thấp hơn rõ rệt và hay bị gọi nhầm sang cảm xúc khác: ghê tởm lẫn với giận, sợ lẫn với giận hoặc ngạc nhiên.'
