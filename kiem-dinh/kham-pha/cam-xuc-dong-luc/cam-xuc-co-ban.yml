  vi_tri: Ekman 1969, Bảng 1, cột Fore responses (hàng phụ là lựa chọn nhiều thứ hai)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "các nét mặt giận – sợ – ghê tởm – buồn cũng dễ bị nhầm lẫn." Chữ mới nêu cặp nhầm cụ thể theo bảng (ghê tởm → giận 30%, sợ → giận 25%, ngạc nhiên và Nhật: sợ → ngạc nhiên 26%). "Ngạc nhiên" không phải cảm xúc tiêu cực nên bỏ khỏi nhóm "tiêu cực".'
