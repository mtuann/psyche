doi_chu:
- cu: (không có)
  moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
  ly_do: Bố cục C (kế hoạch).
- cu: '**vui, giận, sợ**. Hầu như ai cũng đoán đúng. Nhưng câu hỏi thú vị hơn là: *một người chưa từng tiếp xúc với văn hóa phương Tây có đoán giống bạn không?* Vào cuối thập niên 1960, nhà tâm lý học Paul Ekman mang chính câu hỏi này đến một bộ tộc sống tách biệt trong rừng núi Papua New Guinea.'
  moi: '**vui, giận, sợ** (khuôn mặt thứ ba cũng có thể bị gọi là ngạc nhiên, và chính chỗ nhập nhằng ấy sẽ xuất hiện ở dưới). Với bộ ảnh nét mặt chuẩn trong nghiên cứu sắp kể, phần lớn người xem ở Mỹ, Brazil và Nhật cũng chọn đúng nhãn dự kiến. Nhưng câu hỏi thú vị hơn là: *một người ít tiếp xúc với văn hóa phương Tây có đoán giống bạn không?* Vào cuối thập niên 1960, nhà tâm lý học Paul Ekman mang chính câu hỏi này đến người Fore ở vùng núi Papua New Guinea.'
  ly_do: Hồ sơ n2, n4.
- cu: nhiều nhà nhân học cho rằng mỗi nền văn hóa
  moi: nhiều học giả cho rằng mỗi nền văn hóa
  ly_do: Hồ sơ n7.
- cu: '**Kết quả chính.** Người Fore nhận diện đúng ở tỉ lệ **trên mức may rủi** trong mọi cảm xúc. Nhưng có hai điểm đáng chú ý:'
  moi: '**Kết quả chính.** Với vui, sợ, giận và ghê tởm, người Fore chọn đúng nhãn ở tỉ lệ **trên mức may rủi**, nhưng thấp hơn người Mỹ (bảng dưới). Với ngạc nhiên và buồn thì khác: ở nhóm trả lời bằng tiếng Fore, nhãn được chọn nhiều nhất cho nét mặt ngạc nhiên là "sợ" (45%), cho nét mặt buồn là "giận" (56%).'
  ly_do: Hồ sơ n14, n17.
- cu: 'Nét mặt **vui** được nhận diện tốt nhất ở mọi nền văn hóa (82–99%). Các cảm xúc tiêu cực thì thấp hơn rõ rệt, và hay bị **lẫn lộn với nhau**: nét mặt ngạc nhiên thường bị người Fore gọi là "sợ", các nét mặt giận – sợ – ghê tởm – buồn cũng dễ bị nhầm lẫn. Ở các mẫu biết chữ,'
  moi: 'Nét mặt **vui** được nhận diện tốt nhất (hoặc ngang tốt nhất) ở cả sáu nhóm (82–99%). Các cảm xúc tiêu cực thì thấp hơn rõ rệt ở người Fore, và hay bị **gọi nhầm sang cảm xúc khác**: ghê tởm lẫn với giận, sợ lẫn với giận hoặc ngạc nhiên. Ở các mẫu biết chữ,'
  ly_do: Hồ sơ n18, n19.
- cu: '**Danh sách 6 cảm xúc cơ bản.** Chính từ dòng nghiên cứu này, Ekman đề xuất danh sách sáu cảm xúc cơ bản: **vui, buồn, giận, sợ, ghê tởm, ngạc nhiên**. Lưu ý: trong bảng số liệu gốc năm 1969, "ghê tởm" được gộp chung với "khinh miệt" thành một mục. Danh sách này sau đó trở thành một trong những ý tưởng nổi tiếng — và gây tranh cãi — nhất của tâm lý học.'
  moi: '**Danh sách 6 cảm xúc cơ bản.** Bộ ảnh của dòng nghiên cứu này chia theo sáu loại: **vui, buồn, giận, sợ, ghê tởm, ngạc nhiên** (lấy từ danh sách tám "cảm xúc sơ cấp" của Tomkins, bỏ hứng thú và xấu hổ), về sau thường được gọi là "sáu cảm xúc cơ bản" của Ekman. Lưu ý: trong bảng số liệu gốc năm 1969, "ghê tởm" được gộp chung với "khinh miệt" thành một mục. Danh sách này trở thành một trong những ý tưởng nổi tiếng — và gây tranh cãi — nhất của tâm lý học.'
  ly_do: Hồ sơ n23.
- cu: kể một câu chuyện (ví dụ "một người bạn của anh ta vừa chết"), rồi yêu cầu chọn khuôn mặt phù hợp trong ba bức ảnh. Tỉ lệ đúng đa số ở trên mức may rủi — nhưng **cặp sợ – ngạc nhiên** vẫn là chỗ khó phân biệt nhất
  moi: kể một câu chuyện (ví dụ "con của anh ta vừa chết", cho nét mặt buồn), rồi yêu cầu chọn khuôn mặt phù hợp trong ba bức ảnh (người lớn). Người Fore chọn đúng ở trên mức may rủi trong mọi phép phân biệt, trừ một — **sợ so với ngạc nhiên**, chỗ họ không phân biệt được
  ly_do: Hồ sơ n26, n27, n28.
- cu: (1) cảm xúc được nhận diện đúng ở **trên mức may rủi** ở mọi nền văn hóa được nghiên cứu;
  moi: (1) cảm xúc được nhận diện đúng ở **trên mức may rủi** giữa các nền văn hóa trong những nghiên cứu được gộp (chỉ 5 trong 162 mẫu có một cảm xúc không hơn may rủi);
  ly_do: Hồ sơ n30.
- cu: :::vung-chac[nét mặt cảm xúc được nhận diện đúng ở trên mức may rủi trong nhiều nền văn hóa]
  moi: :::vung-chac[khi chọn nhãn cảm xúc từ một danh sách cho sẵn, người xem ở nhiều nền văn hóa nhận diện ảnh nét mặt dàn dựng đúng ở trên mức may rủi]
  ly_do: Hồ sơ n36.
- cu: Tổng quan năm 2019 của Barrett và cộng sự cho thấy cơ sở khoa học của việc suy ra trạng thái cảm xúc bên trong từ chuyển động cơ mặt còn yếu hơn nhiều so với quảng cáo. Dùng công nghệ này để ra quyết định quan trọng về con người là điều đáng cân nhắc kỹ.
  moi: Barrett và cộng sự (2019) kết luận không thể tự tin suy ra cảm xúc từ một cái cười hay cau mày, và nêu ví dụ một sản phẩm thương mại quảng cáo rằng các cảm xúc đó được truyền đạt bằng nét mặt riêng biệt, phổ quát. Dùng công nghệ này để ra quyết định quan trọng về con người là điều đáng cân nhắc kỹ.
  ly_do: Hồ sơ n55.
- cu: Nhiều hệ thống AI quảng cáo khả năng nhận biết cảm xúc từ khuôn mặt để tuyển dụng, giám sát lớp học hay an ninh.
  moi: Nhiều công ty quảng cáo phần mềm nhận biết cảm xúc từ khuôn mặt; theo Barrett và cộng sự (2019), niềm tin rằng nét mặt cho biết cảm xúc còn ảnh hưởng tới quyết định pháp lý, an ninh và giáo dục.
  ly_do: Hồ sơ n54.
- cu: Ở nhiều nền văn hóa châu Á, người ta có xu hướng tiết chế biểu lộ cảm xúc tiêu cực trước người ngoài hơn người phương Tây. Hiểu điều này giúp ta tránh suy diễn
  moi: Một khảo sát ở 32 nước thấy ở đâu người ta cũng biểu lộ nhiều hơn với người trong nhóm so với người ngoài nhóm, còn mức biểu lộ chung và chuẩn mực cho từng cảm xúc khác nhau giữa văn hóa đề cao cá nhân và văn hóa đề cao tập thể (Matsumoto và cộng sự, 2008). Hiểu điều này giúp ta tránh suy diễn
  ly_do: Hồ sơ n59.
- cu: Đây là đề xuất từ lý thuyết kiến tạo, chưa phải lời khuyên đã được kiểm chứng bằng thử nghiệm — nhưng gọi tên cảm xúc cụ thể hơn là một thói quen vô hại và có thể hữu ích.
  moi: 'Đây là đề xuất từ lý thuyết kiến tạo: nghiên cứu về "độ chi tiết cảm xúc" thấy người phân biệt cảm xúc tinh hơn ít dùng cách tự điều chỉnh có hại khi rất căng thẳng (Kashdan và cộng sự, 2015), nhưng đó chưa phải lời khuyên chắc chắn rằng gọi tên cảm xúc thì điều tiết tốt hơn. Thử gọi tên cảm xúc cụ thể hơn là việc dễ làm và có thể hữu ích.'
  ly_do: Hồ sơ n62.
- cu: Phần lớn bằng chứng đến từ Mỹ, châu Âu, Nhật Bản, Papua New Guinea và một số cộng đồng biệt lập khác.
  moi: Theo Barrett và cộng sự (2019), phần lớn người tham gia các nghiên cứu được gộp năm 2002 đến từ các nước công nghiệp hóa; còn lại là một số cộng đồng nhỏ, biệt lập (Papua New Guinea, Borneo và nơi khác).
  ly_do: Hồ sơ n67.
- cu: Sáu là con số từ danh sách của Ekman; các lý thuyết khác đề xuất danh sách khác nhau, dài hơn hoặc ngắn hơn.
  moi: Sáu là con số từ danh sách của Ekman, lấy từ danh sách tám cảm xúc sơ cấp của Tomkins (bỏ hứng thú và xấu hổ); các lý thuyết khác đề xuất danh sách khác.
  ly_do: Hồ sơ n70.
- cu: Đây là cách giải thích của chính Ekman và Friesen (1971). Hai nét mặt cũng có điểm chung (mắt mở to), nhưng người Fore vẫn phân biệt được ngạc nhiên với sợ, chỉ nhầm theo chiều ngược lại, nên "nét mặt giống nhau" chưa giải thích đủ.
  moi: Đây là cách giải thích Ekman và Friesen (1971) đề xuất. Người Fore vẫn phân biệt được ngạc nhiên với sợ, chỉ không phân biệt được sợ với ngạc nhiên, nên cặp này không đơn giản là "hai nét mặt giống nhau".
  ly_do: Hồ sơ n79.
- cu: Ta giỏi đọc mặt "người nhà" hơn vì quen với cách họ biểu hiện và vì chia sẻ cùng quy tắc biểu hiện văn hóa. Đây là một trong những bằng chứng cho thấy văn hóa thực sự can thiệp vào việc đọc cảm xúc.
  moi: Theo các tác giả, lợi thế này có thể liên quan đến việc người biểu lộ và người nhận chung quy tắc biểu hiện và giải mã. Đây là một gợi ý rằng văn hóa can thiệp vào việc đọc cảm xúc.
  ly_do: Hồ sơ n84.
- cu: Đây là một phần lý do vì sao người Đông Á và người phương Tây có thể "thấy" khác nhau trên cùng một khuôn mặt (Jack và cộng sự, 2012).
  moi: 'Một hướng giải thích liên quan, chưa được kiểm chứng riêng: người Đông Á và người phương Tây có thể "thấy" khác nhau trên cùng một khuôn mặt (Jack và cộng sự, 2012).'
  ly_do: Hồ sơ n41.
- cu: Vì Việt Nam thuộc khu vực văn hóa Đông Á, cách người Việt đọc nét mặt có thể chịu ảnh hưởng tương tự
  moi: Vì người Việt có thể gần người Đông Á về văn hóa, cách người Việt đọc nét mặt có thể chịu ảnh hưởng tương tự
  ly_do: Hồ sơ n69.
- cu: Những người Fore trong nghiên cứu đầu tiên "gần như chưa tiếp xúc" (theo G1-L04, trang cũ); quiz câu 1 hỏi mẫu 1969 "sống gần như tách biệt"
  moi: Mẫu 1969 đã tiếp xúc khá nhiều với người phương Tây; mẫu 1971 chọn theo tiêu chí chặt; quiz câu 1 hỏi về tiêu chí chọn năm 1971
  ly_do: Hồ sơ n10, n25, n74 (đã áp từ G1-L04 ở trang cũ).
- cu: 'Đáp án quiz câu 3: hai nét mặt dùng chung nhiều chuyển động cơ mặt (mắt mở to, miệng há), nên dễ bị nhầm lẫn'
  moi: Có thể vì trong đời sống người Fore, chuyện đáng sợ hầu như luôn đến bất ngờ, nên hai cảm xúc này ít được tách bạch
  ly_do: Hồ sơ n78 (đã áp từ G1-L04).
- cu: '"hơn 1.000 công trình"; "năm nhà khoa học có quan điểm ban đầu khác nhau"'
  moi: '"một khối lượng lớn nghiên cứu"'
  ly_do: Hồ sơ n49 (đã áp từ G1-L04).
