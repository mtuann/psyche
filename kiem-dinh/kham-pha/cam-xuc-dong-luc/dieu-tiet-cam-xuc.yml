  - id: n72
    cau: 'Quiz 5: người có thói quen kìm nén có các mối quan hệ xã hội kém hơn (Gross và John, 2003); các tác giả gợi ý vì họ thấy mình "không thật", ngại chia sẻ cảm xúc và tránh sự gần gũi, còn bạn bè có thể nhận ra nỗ lực kìm nén; họ cũng trải nghiệm ít cảm xúc tích cực và nhiều cảm xúc tiêu cực hơn. Lời giải thích: đây là kết quả tương quan, chưa chứng minh được nhân quả.'
    loai: phat-hien
    nguon:
      - gj2003
    trich: suppressors experience and express lesser positive emotion, yet experience greater negative emotion. Study 4 indicates that ... suppression is associated with worse interpersonal functioning.
    vi_tri: Gross & John 2003, tóm tắt tr. 348; tr. 357
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: đáp án đúng "Vì cảm xúc là tín hiệu xã hội — khi che giấu cảm xúc, người đối diện vẫn cảm nhận được sự ''không thật'', làm giảm gắn kết và tin tưởng"; lời giải thích "nó làm méo mó kênh giao tiếp cảm xúc giữa người với người, và cái giá đó tích lũy theo thời gian". Chữ mới như câu. Lý do: xem n33, n56 ("tin tưởng", "tích lũy theo thời gian" không phải kết quả). Phương án nhiễu "không bao giờ cảm thấy cảm xúc tích cực", "luôn tránh giao tiếp" là điều sai thật. Lời giải thích không dựa vào vị trí. Review (Claude Opus 5.5, 10/11/2026): dung. Như n33, n56: đã mở toàn văn Gross & John 2003, các ý đều có và được ghi là gợi ý; Study 3 nói người hay kìm nén trải nghiệm ít tích cực, nhiều tiêu cực.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/12916575/" ]
    luot_2_ghi_chu: Chi tiết 'các tác giả gợi ý vì họ thấy mình không thật, ngại chia sẻ, bạn bè nhận ra' không xác nhận được (chưa mở toàn văn).
