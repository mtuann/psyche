    review: dung
  - id: n68
    cau: 'Quiz 1: trong thí nghiệm của Gross (1998), cả hai nhóm đều giảm được biểu hiện bên ngoài, nhưng chỉ nhóm tái đánh giá giảm được trải nghiệm kinh tởm; nhóm kìm nén còn tăng hoạt động hệ thần kinh giao cảm. Lời giải thích: kìm nén che được "mặt" nhưng không làm dịu được "lòng", và hoạt động giao cảm còn tăng.'
    loai: phat-hien
    nguon:
      - gross1998
      - gj2003
    trich: Compared with the control condition, both reappraisal and suppression were effective in reducing emotion-expressive behavior. However, reappraisal decreased disgust experience, whereas suppression increased sympathetic activation.
    vi_tri: Gross 1998, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ của lời giải thích: "... và cơ thể còn phải trả giá bằng sự căng thẳng sinh lý cao hơn." Chữ mới: "hoạt động hệ thần kinh giao cảm còn tăng" (đúng chữ tóm tắt). Phương án nhiễu là điều sai thật. Review (Claude Opus 5.5, 10/11/2026): dung. Khớp tóm tắt Gross 1998.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9457784/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf" ]
    luot_2_ghi_chu: Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở).
