  - id: n49
    cau: "Người hay kìm nén có các mối quan hệ xã hội kém hơn (Gross và John, 2003); cái giá sinh lý và trí nhớ dựa chủ yếu vào thí nghiệm của cùng một nhóm; cái giá xã hội có một phân tích tổng hợp các nghiên cứu tương quan (Chervonsky và Hunt, 2017: 43 bài; kìm nén đi cùng hỗ trợ xã hội và chất lượng quan hệ thấp hơn)."
    loai: phat-hien
    nguon:
      - gj2003
      - chervonsky2017
    ket_qua: da-sua
    ghi_chu: 'Câu giới hạn thêm vào khung n46 ("phần lớn là các thí nghiệm đơn lẻ của cùng một nhóm ... chưa có phân tích tổng hợp riêng"); "chưa có" là tình trạng trong các nguồn đã mở, review xem lại. Review (Claude Opus 5.5, 10/11/2026): sai. Lượt 2 đúng. Chervonsky & Hunt (2017), Emotion 17(4), 669–683, tóm tắt (PubMed 28080085, đã mở): "Forty-three papers ... allowing for 105 effect sizes ... greater suppression of emotion was significantly associated with poorer social wellbeing, including more negative first impressions, lower social support, lower social satisfaction and quality, and poorer romantic relationship quality." Chữ cũ: "Giới hạn: phần lớn là các thí nghiệm đơn lẻ của cùng một nhóm nghiên cứu và các nghiên cứu tương quan, chưa có phân tích tổng hợp riêng cho từng cái giá này." Chữ mới: "Giới hạn: cái giá sinh lý và trí nhớ dựa chủ yếu vào thí nghiệm của cùng một nhóm nghiên cứu. Cái giá xã hội có một phân tích tổng hợp (Chervonsky và Hunt, 2017: 43 bài; kìm nén đi cùng hỗ trợ xã hội và chất lượng quan hệ thấp hơn), nhưng các nghiên cứu được gộp là tương quan." Không viết "chưa có phân tích tổng hợp" cho hai cái giá còn lại (chưa tìm đủ). Thêm Chervonsky & Hunt 2017 vào mục Nguồn.'
    trich: Study 4 indicates that using reappraisal is associated with better interpersonal functioning, whereas using suppression is associated with worse interpersonal functioning. [Gross & John 2003] | Forty-three papers ... allowing for 105 effect sizes to be calculated. Meta-analyses revealed that greater suppression of emotion was significantly associated with poorer social wellbeing, including more negative first impressions, lower social support, lower social satisfaction and quality, and poorer romantic relationship quality. [Chervonsky & Hunt 2017]
    vi_tri: Gross & John 2003, tóm tắt tr. 348
    luot_2: sai
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/28080085/", "https://pubmed.ncbi.nlm.nih.gov/12916575/" ]
    luot_2_ghi_chu: "câu đúng: Người hay kìm nén có các mối quan hệ xã hội kém hơn (Gross và John, 2003; phân tích tổng hợp Chervonsky & Hunt 2017: 43 bài, 105 hệ số, kìm nén đi cùng hỗ trợ xã hội, chất lượng quan hệ thấp hơn); bằng chứng về cái giá sinh lý và trí nhớ chủ yếu là các thí nghiệm của nhóm Gross, chưa thấy phân tích tổng hợp riêng.; Phần 'chưa có phân tích tổng hợp riêng cho từng cái giá' sai với cái giá xã hội. Chưa tìm thấy phân tích tổng hợp riêng cho cái giá sinh lý và trí nhớ (chưa tìm kỹ)."
    review: sai
  - id: n50
    cau: 'Khá vững: không chiến lược nào luôn tốt hay luôn xấu; hiệu quả phụ thuộc bối cảnh (khung nhãn; trước là "Đang tranh cãi: ''tái đánh giá luôn tốt, kìm nén luôn xấu'' có phải quy tắc chung?").'
    loai: nhan
    nhan: kha-vung
    co_so:
      - webb2012
      - gj2003
    ly_do: Webb và cộng sự (2012) thấy kìm nén biểu hiện có hiệu quả (d+ = 0,32) và hiệu quả của các chiến lược thay đổi theo loại cảm xúc, mục đích và thiết kế nghiên cứu; Gross & John (2003) thấy kìm nén có cái giá khi dùng thành thói quen. Hai nhóm bằng chứng không mâu thuẫn nhau mà cho thấy kết luận phụ thuộc bối cảnh. Không có nghiên cứu chất lượng cao nào mâu thuẫn, nên không đạt "Đang tranh cãi"; chỉ có tổng hợp từ tóm tắt Webb (toàn văn bị embargo) và mẫu chủ yếu phương Tây nên "Khá vững" thay vì "Vững chắc".
    nguon:
      - webb2012
      - gj2003
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: khung "Đang tranh cãi" với tiêu đề "''tái đánh giá luôn tốt, kìm nén luôn xấu'' có phải quy tắc chung?". Chữ mới: khung "Khá vững" với tiêu đề "không chiến lược nào luôn tốt hay luôn xấu: hiệu quả phụ thuộc bối cảnh". Lý do: thước đo mục 4 chỉ cho "Đang tranh cãi" khi bằng chứng chất lượng cao mâu thuẫn nhau hay một tái lập lớn thất bại; ở đây chỉ có điều kiện của kết quả, không có mâu thuẫn. Đề nghị review xác nhận việc đổi nhãn và hộp ::tom-tat theo đó. Review (Claude Opus 5.5, 10/11/2026): dung. Chốt Khá vững (đổi từ Đang tranh cãi ở lượt 1): không có bằng chứng chất lượng cao mâu thuẫn; Webb 2012 cho thấy hiệu quả phụ thuộc loại cảm xúc, mục đích, thiết kế; Gross & John cho thấy cái giá của thói quen. Không đạt Vững chắc vì chỉ đọc tóm tắt Webb và mẫu chủ yếu phương Tây.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/22582737/", "https://pubmed.ncbi.nlm.nih.gov/17352561/" ]
    luot_2_ghi_chu: Nhãn 'khá vững' phù hợp.
    review: dung
  - id: n51
    cau: Kìm nén biểu hiện có hiệu quả trong các thí nghiệm (d+ = 0,32), và trong nhiều tình huống xã hội (đám tang, phòng họp, khi chăm người bệnh) người ta có lý do chính đáng để tạm giữ vẻ ngoài.
    loai: phat-hien
