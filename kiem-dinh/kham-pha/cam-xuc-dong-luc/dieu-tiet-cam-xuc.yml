    cau: 'Aldao và cộng sự: phân tích tổng hợp các nghiên cứu tương quan về tâm bệnh thấy né tránh, nhai lại và kìm nén thường đi cùng triệu chứng tâm lý nặng hơn (nhai lại rõ nhất); tái đánh giá và chấp nhận đi cùng triệu chứng nhẹ hơn, ở mức nhỏ đến vừa.'
    loai: phat-hien
    nguon:
      - aldao2010
      - aldao-pmc
    trich: We found a large effect size for rumination, medium to large for avoidance, problem solving, and suppression, and small to medium for reappraisal and acceptance. | Problem-solving, acceptance, and reappraisal are often seen as adaptive strategies (Aldao et al., 2010)
    vi_tri: Aldao 2010, tóm tắt; PMC6305959 (Discussion, Table 1)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "né tránh, nhai lại và kìm nén thường đi cùng triệu chứng nặng hơn, trong khi tái đánh giá, chấp nhận và giải quyết vấn đề thường đi cùng triệu chứng nhẹ hơn". Chữ mới thêm "nhai lại rõ nhất", "ở mức nhỏ đến vừa" và bỏ "giải quyết vấn đề" khỏi nhóm nhẹ hơn. Lý do: tóm tắt cho độ lớn (rumination lớn; avoidance, problem solving, suppression vừa đến lớn; reappraisal, acceptance nhỏ đến vừa) nhưng không nói chiều của giải quyết vấn đề, và toàn văn không mở được. Chiều của mối liên hệ theo tóm lược thứ cấp. Chỗ khó: nếu lượt 2 mở được toàn văn, có thể đưa giải quyết vấn đề trở lại. Review (Claude Opus 5.5, 10/11/2026): dung. Khớp tóm tắt Aldao 2010 (độ lớn) và tóm lược thứ cấp (chiều).'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/20015584/" ]
    luot_2_ghi_chu: Tóm tắt không nêu chiều; chiều (nhai lại, né tránh, kìm nén đi cùng triệu chứng nặng hơn; tái đánh giá và chấp nhận nhẹ hơn) hợp với lời tác giả 'surprising given the prominence of reappraisal and acceptance in treatment'. Lưu ý giải quyết vấn đề (problem solving) cũng ở mức vừa đến lớn nhưng không được liệt kê trong câu.
