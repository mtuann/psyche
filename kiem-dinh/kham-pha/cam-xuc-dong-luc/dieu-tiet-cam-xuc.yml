    trich: Suppressors should be less likely to share their actual emotional experiences ... they should be uncomfortable with and actively avoid close relationships. ... Potential friends may well sense their reluctance to open up emotionally ... | peers were able to detect when individuals used suppression to regulate their emotions.
    vi_tri: Gross & John 2003, tr. 357 (Study 4 mở đầu; kết quả Study 3)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Một phần lý do: khi bạn che giấu cảm xúc, người đối diện vẫn cảm nhận được sự ''không thật'', khiến sự gắn kết giảm sút." Chữ mới: ghi là gợi ý của các tác giả và nêu ba ý có trong bài (thấy mình không thật, ngại chia sẻ, bạn bè nhận ra). Lý do: Study 3 cho thấy bạn bè nhận ra việc kìm nén, nhưng "gắn kết giảm sút vì người đối diện cảm nhận sự không thật" là giả thuyết ("may well sense"), không phải kết quả. Review (Claude Opus 5.5, 10/11/2026): dung. Lượt 2 chưa chắc vì không mở được toàn văn. Đã mở Gross & John 2003 (PDF onlineacademiccommunity.uvic.ca): "This sense of not being true to oneself, of being inauthentic ... may well lead to negative feelings about the self and alienate the individual"; "Suppressors should be less likely to share their actual emotional experiences ... they should be uncomfortable with and actively avoid close relationships"; "Potential friends may well sense their reluctance to open up emotionally ... noticing their efforts to suppress"; Study 3: "peers were able to detect when individuals used suppression". Chữ "các tác giả gợi ý" đúng mức.'
    luot_2: khong-chac
    luot_2_ghi_chu: Chưa mở được toàn văn Gross & John 2003 (APA chặn; bản Stanford/CiteSeerX không còn) nên không xác nhận được phần 'các tác giả gợi ý'.
