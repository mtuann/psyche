    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Hộp sinh lúc build từ các khung nhãn của trang (src/plugins); chữ của hộp đổi theo khung nhãn: khung "kìm nén đi kèm cái giá" nay là Khá vững (n46). Review kiểm bản xem. Review (Claude Opus 5.5, 10/11/2026): dung. Hộp sinh từ khung nhãn (src/plugins/thanh-phan.mjs); sau review khung đầu là Khá vững (n43) nên hộp đổi theo.'
    review: dung
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch); khung "kìm nén đi kèm cái giá" nay là Khá vững (hồ sơ n46) và khung "không chiến lược nào luôn tốt hay luôn xấu" là Khá vững (n50) nên hộp đổi theo.
  - cu: '"cảm xúc bên trong vẫn y nguyên, cơ thể còn căng hơn, trí nhớ và quan hệ xã hội phải trả giá"'
    moi: '"trải nghiệm cảm xúc tiêu cực không giảm, cơ thể còn bị kích hoạt mạnh hơn; các nghiên cứu sau cho thấy trí nhớ và quan hệ xã hội cũng có thể phải trả giá"'
    ly_do: 'Hồ sơ n1: "vẫn y nguyên" khái quát quá mức (cảm xúc tích cực có giảm).'
  - cu: '"dù bề ngoài người dùng cách A trông có vẻ bình tĩnh nhất"'
    moi: '"dù từ bên ngoài, cả hai cách đều có thể trông bình tĩnh"'
    ly_do: 'Hồ sơ n6: cả hai chiến lược đều giảm biểu hiện ở Gross (1998).'
  - cu: '"…trước khi phản ứng cảm xúc hình thành đầy đủ — tốn ít công sức mà hiệu quả lan tới cả trải nghiệm bên trong"'
    moi: '"… — hiệu quả lan tới cả trải nghiệm bên trong"'
    ly_do: 'Hồ sơ n8: "tốn ít công sức" không có trong nguồn.'
  - cu: '"Cơn sóng bên trong vẫn ở đó, nguyên vẹn."'
    moi: '"Với cảm xúc tiêu cực, trải nghiệm bên trong không giảm đi."'
    ly_do: 'Hồ sơ n9: giới hạn ở cảm xúc tiêu cực.'
  - cu: '"xem một đoạn phim gây kinh tởm — cảnh một ca phẫu thuật —"'
    moi: '"xem một đoạn phim gây kinh tởm"'
    ly_do: 'Hồ sơ n16: nội dung phim không xác nhận được.'
  - cu: nhóm tái đánh giá "xem phim một cách khách quan, tách rời, 'sao cho không cảm thấy gì'"; nhóm đối chứng "chỉ xem bình thường"
    moi: nhóm tái đánh giá được yêu cầu nghĩ về đoạn phim "sao cho không cảm thấy gì"; đối chứng "chỉ xem phim"
    ly_do: 'Hồ sơ n17: "khách quan, tách rời" không có trong tóm tắt.'
  - cu: '"tăng hoạt động của hệ thần kinh giao cảm (tim đập nhanh hơn, da dẫn điện mạnh hơn)"'
    moi: '"tăng hoạt động của hệ thần kinh giao cảm (cơ thể bị kích hoạt mạnh hơn)"'
    ly_do: 'Hồ sơ n21 (G1-L04 mục #3).'
  - cu: '"Richards và Gross cho người tham gia xem các slide hình ảnh tiêu cực kèm thông tin nói, với chỉ dẫn kìm nén, tái đánh giá, hoặc không điều tiết. Sau đó kiểm tra trí nhớ"'
    moi: tách ba nghiên cứu (phim; slide kèm thông tin đi kèm; thói quen thường ngày)
    ly_do: Hồ sơ n22.
  - cu: '"nhóm kìm nén nhớ kém hẳn các chi tiết được trình bày bằng lời nói (dù slide gây cảm xúc mạnh hay nhẹ), trong khi trí nhớ với chi tiết hình ảnh không bị ảnh hưởng. Nhóm tái đánh giá ... thậm chí còn nhớ chi tiết hình ảnh tốt hơn nhóm đối chứng"'
    moi: '"kìm nén làm trí nhớ kém đi, cả với chi tiết của đoạn phim lẫn với slide; tái đánh giá không làm trí nhớ kém đi"'
    ly_do: 'Hồ sơ n23: tách lời nói/hình ảnh không xác nhận được; Ortner (2013) kể ngược lại.'
  - cu: '"Ở một nghiên cứu đời thực (nhật ký hằng ngày), những người có thói quen kìm nén cũng nhớ kém hơn về các sự kiện cảm xúc trong đời mình."'
    moi: '"Ở nghiên cứu thứ ba, người có thói quen kìm nén báo cáo trí nhớ của mình kém hơn và cũng làm kém hơn ở bài kiểm tra trí nhớ khách quan"'
    ly_do: 'Hồ sơ n24: tóm tắt không nhắc nhật ký.'
  - cu: '"khi kìm nén, một phần tâm trí bạn bận rộn ''tự giám sát'' ... nên còn ít ''bộ nhớ làm việc''"'
    moi: '"Cách giải thích thường dùng (Gross và John, 2003): ... có thể chiếm nguồn lực nhận thức"'
    ly_do: 'Hồ sơ n25: giả thuyết ("may consume").'
  - cu: '"mức độ hạnh phúc cao hơn"'
    moi: '"hài lòng với cuộc sống hơn"'
    ly_do: Hồ sơ n29.
  - cu: '"ít cảm xúc tích cực hơn nhưng lại nhiều cảm xúc tiêu cực hơn"'
    moi: '"trải nghiệm nhiều cảm xúc tiêu cực hơn (dù không để lộ ra nhiều hơn)"'
    ly_do: 'Hồ sơ n30 (G1-L04 mục #1).'
  - cu: (không có)
    moi: '"Đây là các nghiên cứu tương quan, không chứng minh nhân quả."'
    ly_do: 'Hồ sơ n32: làm rõ bản chất nghiên cứu.'
  - cu: '"Một phần lý do: khi bạn che giấu cảm xúc, người đối diện vẫn cảm nhận được sự ''không thật'', khiến sự gắn kết giảm sút."'
    moi: '"Các tác giả gợi ý một phần lý do: người hay kìm nén thấy mình ''không thật'', ngại chia sẻ cảm xúc và tránh các mối quan hệ gần gũi, còn bạn bè của họ có thể nhận ra những nỗ lực kìm nén ấy."'
    ly_do: 'Hồ sơ n33: giả thuyết của tác giả, không phải kết quả.'
  - cu: '"hiệu quả trung bình khá: d+ = 0.36"'
    moi: '"hiệu quả từ nhỏ đến vừa: d+ = 0,36"'
    ly_do: 'Hồ sơ n35 (G1-L04 mục #2).'
  - cu: '"có hiệu quả trong ngắn hạn — chủ yếu lên hành vi —"'
    moi: '"có hiệu quả (d+ = 0,32)"'
    ly_do: Hồ sơ n37.
  - cu: '"gần như vô tác dụng"'
    moi: '"không có hiệu quả" (d+ = −0,04 và −0,12)'
    ly_do: Hồ sơ n38.
  - cu: (không có số)
    moi: '"(d+ = 0,36)", "(d+ = 0,45)", "(d+ = 0,23)"'
    ly_do: 'Hồ sơ n39: tóm tắt nêu số.'
  - cu: '"né tránh, nhai lại và kìm nén ... nặng hơn, trong khi tái đánh giá, chấp nhận và giải quyết vấn đề ... nhẹ hơn"'
    moi: '"... (nhai lại rõ nhất), trong khi tái đánh giá và chấp nhận ... nhẹ hơn, ở mức nhỏ đến vừa"'
    ly_do: 'Hồ sơ n41: chiều của giải quyết vấn đề không xác nhận được.'
  - cu: '"đã được tìm thấy lại trong nhiều nghiên cứu sau đó, ở cả đo lường chủ quan, hành vi và sinh lý, và được củng cố bởi phân tích tổng hợp"'
    moi: '"được củng cố bởi phân tích tổng hợp của Webb và cộng sự (2012): kìm nén biểu hiện có hiệu quả (d+ = 0,32), còn kìm nén trải nghiệm cảm xúc thì không (d+ = −0,04)"'
    ly_do: Hồ sơ n44.
  - cu: 'Khung Vững chắc: "kìm nén giảm biểu hiện bên ngoài, nhưng không giảm trải nghiệm cảm xúc"'
    moi: '"... không giảm trải nghiệm cảm xúc tiêu cực bên trong" kèm "Riêng với cảm xúc tích cực, kìm nén lại làm giảm cả trải nghiệm"'
    ly_do: 'Hồ sơ n45 (G1-L04 mục #4; chữ đã áp ở trang cũ, đối chiếu lại).'
  - cu: nhãn "Vững chắc" cho khung "kìm nén đi kèm cái giá sinh lý và nhận thức"
    moi: nhãn "Khá vững", kèm câu giới hạn
    ly_do: 'Hồ sơ n46: chưa có phân tích tổng hợp hay tái lập lớn cho từng cái giá.'
  - cu: '"làm suy giảm trí nhớ bằng lời nói cả trong phòng thí nghiệm lẫn đời sống hằng ngày"'
    moi: '"làm trí nhớ về thông tin đi kèm kém đi trong phòng thí nghiệm và ở người có thói quen kìm nén"'
    ly_do: Hồ sơ n48.
  - cu: (không có)
    moi: '"Giới hạn: phần lớn là các thí nghiệm đơn lẻ của cùng một nhóm nghiên cứu và các nghiên cứu tương quan, chưa có phân tích tổng hợp riêng cho từng cái giá này."'
    ly_do: Hồ sơ n49.
  - cu: 'khung nhãn "Đang tranh cãi": ''tái đánh giá luôn tốt, kìm nén luôn xấu'' có phải quy tắc chung?'
    moi: 'khung nhãn "Khá vững": không chiến lược nào luôn tốt hay luôn xấu: hiệu quả phụ thuộc bối cảnh'
    ly_do: 'Hồ sơ n50: không có bằng chứng chất lượng cao mâu thuẫn nhau.'
  - cu: '"kìm nén biểu hiện có hiệu quả ngắn hạn lên hành vi — ... tạm thời giữ vẻ ngoài là điều cần thiết và thích ứng"'
    moi: '"kìm nén biểu hiện có hiệu quả trong các thí nghiệm (d+ = 0,32), và ... người ta có lý do chính đáng để tạm giữ vẻ ngoài"'
    ly_do: Hồ sơ n51.
  - cu: '"tái đánh giá không phải lúc nào cũng khả thi: khi cảm xúc quá dữ dội hoặc thời gian quá gấp, việc ''nghĩ khác đi'' có thể bất khả thi ..."'
    moi: '"Hiệu quả của các chiến lược thay đổi theo loại cảm xúc, mục đích sử dụng và thiết kế nghiên cứu, nên không có chiến lược nào hay hay dở cho mọi lúc mọi nơi."'
    ly_do: 'Hồ sơ n52: vế cường độ/thời gian không có nguồn.'
  - cu: '"Cảm xúc là một quá trình unfolding theo thời gian. Can thiệp càng sớm, bạn càng thay đổi được ... áp lực bên trong vẫn nguyên."'
    moi: '"Cảm xúc diễn ra theo thời gian. Theo mô hình, can thiệp càng sớm, bạn càng có thể thay đổi ... với cảm xúc tiêu cực, trải nghiệm bên trong không giảm."'
    ly_do: Hồ sơ n53.
  - cu: '"... chiếm dụng bộ nhớ làm việc ... Tái đánh giá cũng tốn công sức lúc đầu, nhưng một khi góc nhìn mới đã hình thành, cảm xúc tự dịu xuống mà không cần ''gồng'' liên tục."'
    moi: '"Theo Gross và John (2003), ... có thể chiếm nguồn lực nhận thức; ... còn tái đánh giá thì không."'
    ly_do: Hồ sơ n54.
  - cu: '"đối phương vẫn nhận ra sự căng thẳng không lời — sự ''không thật'' đó làm giảm sự gắn kết và tin tưởng"'
    moi: '"Gross và John (2003) gợi ý rằng khi kìm nén, người ta thấy mình ''không thật'', ngại chia sẻ cảm xúc ..., trong khi bạn bè có thể nhận ra nỗ lực kìm nén ấy"'
    ly_do: Hồ sơ n56.
  - cu: nhãn "Vững chắc"; "Tái đánh giá hiệu quả nhất khi cảm xúc chưa lên đến đỉnh — đừng đợi ..."
    moi: nhãn "Khá vững"; "Theo mô hình quá trình, can thiệp càng sớm thì càng có thể thay đổi nhiều khâu của cảm xúc, nên hãy thử diễn giải lại ngay từ đầu ..."
    ly_do: Hồ sơ n57.
  - cu: '"Kìm nén không làm cảm xúc biến mất — nó chỉ đẩy chi phí sang hệ thần kinh và sự tập trung của bạn."'
    moi: '"Trong các thí nghiệm, kìm nén không làm trải nghiệm cảm xúc tiêu cực giảm đi, mà đi kèm hoạt động giao cảm tăng và trí nhớ về thông tin đi kèm kém đi."'
    ly_do: Hồ sơ n59.
  - cu: '"kìm nén biểu hiện có hiệu quả ngắn hạn. Vấn đề chỉ nảy sinh khi nó trở thành chiến lược duy nhất: hãy hẹn với chính mình một thời điểm sau đó để xử lý cảm xúc thật — viết ra, tâm sự ..."'
    moi: '"... có hiệu quả trong các thí nghiệm. Điều đáng lưu ý là thói quen dùng nó thường xuyên ... Bài này không dẫn bằng chứng so sánh các cách xử lý cảm xúc sau đó, nên không đưa ra cách cụ thể."'
    ly_do: 'Hồ sơ n60: lời khuyên cụ thể không có nguồn.'
  - cu: '"Vì kìm nén làm suy giảm trí nhớ bằng lời nói, sau một cuộc họp ... đừng tin hoàn toàn vào trí nhớ của mình ..."'
    moi: '"Trong thí nghiệm, kìm nén làm trí nhớ về thông tin đi kèm kém đi. Chưa có nghiên cứu trực tiếp về các cuộc họp thật, nhưng ... ghi chép lại hay xin biên bản ... là việc không tốn gì."'
    ly_do: Hồ sơ n61.
  - cu: '"Các nghiên cứu then chốt ở trên thực hiện chủ yếu ở Mỹ và các nước phương Tây."'
    moi: '"Ba nghiên cứu then chốt ở trên của nhóm Gross đều làm ở Hoa Kỳ (Stanford, Berkeley)."'
    ly_do: Hồ sơ n62.
  - cu: '"Chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra trực tiếp sự khác biệt giữa tái đánh giá và kìm nén trên người Việt."'
    moi: '"Tính đến 11/2026, chúng tôi chưa tìm thấy thí nghiệm nào so sánh trực tiếp ... Chúng tôi chỉ thấy hai nghiên cứu cắt ngang trên người bị bỏng ..."'
    ly_do: 'Hồ sơ n63: lần tìm thấy hai nghiên cứu gần kề.'
  - cu: '"văn hóa Việt Nam ... đề cao sự kiềm chế, giữ thể diện và hòa khí. Có giả thuyết ... cái giá sinh lý và nhận thức nhiều khả năng vẫn tồn tại"'
    moi: '"Butler, Lee và Gross (2007) thấy rằng hậu quả xã hội tiêu cực của kìm nén yếu đi ở những người mang giá trị Á Đông nhiều hơn ... chưa có dữ liệu để nói cái giá sinh lý hay nhận thức ... có đổi theo văn hóa hay không."'
    ly_do: Hồ sơ n64.
  - cu: '"Nghiên cứu cho thấy điều ngược lại ở cấp độ cơ thể: kìm nén làm tăng hoạt động hệ thần kinh giao cảm và về lâu dài đi cùng nhiều cảm xúc tiêu cực hơn, ít cảm xúc tích cực hơn"'
    moi: '"Trong thí nghiệm của Gross (1998), kìm nén đi kèm tăng hoạt động hệ thần kinh giao cảm; còn ở người hay kìm nén, nghiên cứu tương quan thấy ít cảm xúc tích cực và nhiều cảm xúc tiêu cực hơn"'
    ly_do: Hồ sơ n65.
  - cu: '"Tái đánh giá hiệu quả là tìm một cách diễn giải khác mà vẫn đúng với sự thật ... Đó là mở rộng góc nhìn, không phải tô hồng thực tế."'
    moi: '"Tái đánh giá là diễn giải lại ý nghĩa của tình huống để đổi tác động cảm xúc của nó ... bài không khẳng định cách nào hiệu quả hơn."'
    ly_do: Hồ sơ n66.
  - cu: '"Kìm nén biểu hiện có hiệu quả ngắn hạn ... Cái hại nằm ở việc chỉ biết kìm nén, kéo dài, mà không bao giờ xử lý cảm xúc thật bên dưới."'
    moi: '"Kìm nén biểu hiện có hiệu quả trong các thí nghiệm ... Điều đáng lưu ý là việc dùng nó thường xuyên, thành thói quen."'
    ly_do: Hồ sơ n67.
  - cu: '"... và cơ thể còn phải trả giá bằng sự căng thẳng sinh lý cao hơn." (lời giải thích quiz 1)'
    moi: '"... và hoạt động hệ thần kinh giao cảm còn tăng."'
    ly_do: Hồ sơ n68.
  - cu: '"Cùng một ''lượng'' nỗ lực điều tiết, đặt càng sớm ... thì ảnh hưởng càng sâu." (lời giải thích quiz 2)'
    moi: '"Theo mô hình quá trình, can thiệp càng sớm ... thì càng có thể thay đổi cả quỹ đạo của nó."'
    ly_do: Hồ sơ n69.
  - cu: 'quiz 3: "làm suy giảm loại trí nhớ nào?" với đáp án "chi tiết được trình bày bằng lời nói; trí nhớ hình ảnh không bị ảnh hưởng"'
    moi: '"ảnh hưởng thế nào đến trí nhớ?" với đáp án "thông tin gặp trong lúc kìm nén (chi tiết của phim, của slide) kém đi; tái đánh giá thì không"'
    ly_do: Hồ sơ n70.
  - cu: 'quiz 4: "kìm nén biểu hiện có hiệu quả ngắn hạn lên hành vi, nhưng kìm nén trải nghiệm cảm xúc hay suy nghĩ thì gần như vô tác dụng"'
    moi: '"kìm nén biểu hiện có hiệu quả (d+ = 0,32), nhưng kìm nén trải nghiệm cảm xúc hay suy nghĩ thì không"'
    ly_do: Hồ sơ n71.
