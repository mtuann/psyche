    vi_tri: Webb 2012, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "kìm nén biểu hiện có hiệu quả ngắn hạn lên hành vi — trong nhiều tình huống xã hội (...), tạm thời giữ vẻ ngoài là điều cần thiết và thích ứng." Chữ mới như câu. Lý do: bỏ "ngắn hạn lên hành vi" (không xác nhận) và "cần thiết và thích ứng" (đánh giá giá trị, không phải kết quả); ví dụ đám tang, phòng họp là minh họa của trang, không phải dữ liệu. Review (Claude Opus 5.5, 10/11/2026): dung. Số khớp tóm tắt Webb; ví dụ tình huống là minh họa.'
