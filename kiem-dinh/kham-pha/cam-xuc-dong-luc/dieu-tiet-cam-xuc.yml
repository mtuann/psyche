    review: dung
  - id: n17
    cau: 'Ba nhóm nhận ba chỉ dẫn: tái đánh giá ("nghĩ về đoạn phim sao cho không cảm thấy gì"), kìm nén ("cư xử sao cho người nhìn vào không biết bạn đang cảm thấy gì"), đối chứng (chỉ xem phim).'
    loai: phat-hien
    nguon:
      - gross1998
    trich: Participants were told to either (a) think about the film in such a way that they would feel nothing (reappraisal, a form of antecedent-focused emotion regulation), (b) behave in such a way that someone watching them would not know they were feeling anything (suppression, a form of response-focused emotion regulation), or (c) watch the film (a control condition).
    vi_tri: Gross 1998, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: nhóm tái đánh giá "xem phim một cách khách quan, tách rời, ''sao cho không cảm thấy gì''"; nhóm đối chứng "chỉ xem bình thường". Chữ mới: "nghĩ về đoạn phim ''sao cho không cảm thấy gì''"; "chỉ xem phim". Lý do: "khách quan, tách rời" là chi tiết của toàn văn, không có trong tóm tắt và không mở được toàn văn; Gross & John (2003, tr. 349) kể lại chỉ dẫn là "think about the film they are watching so that they would not respond emotionally". Review (Claude Opus 5.5, 10/11/2026): dung. Khớp tóm tắt Gross 1998.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9457784/" ]
    luot_2_ghi_chu: Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở).
    review: dung
