    trich: Five studies tested two general hypotheses ... Study 1 presents new measures of the habitual use of reappraisal and suppression. | The final 10 items are shown in Table 2
    vi_tri: Gross & John 2003, tóm tắt tr. 348; mục Study 1, tr. 351
    ket_qua: dung
