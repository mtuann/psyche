  - id: n71
    cau: 'Quiz 4: phân tích tổng hợp của Webb, Miles và Sheeran (2012): thay đổi nhận thức (d+ = 0,36) hiệu quả hơn điều tiết phản ứng (d+ = 0,16); kìm nén biểu hiện có hiệu quả (d+ = 0,32), nhưng kìm nén trải nghiệm cảm xúc hay suy nghĩ thì không. Lời giải thích: ngay trong cùng một nhóm chiến lược, các biến thể nhỏ cũng cho hiệu quả khác nhau rõ rệt.'
