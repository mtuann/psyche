    vi_tri: Webb 2012, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "kìm nén biểu hiện có hiệu quả ngắn hạn lên hành vi, nhưng kìm nén trải nghiệm cảm xúc hay suy nghĩ thì gần như vô tác dụng". Chữ mới như câu. Lý do: xem n37–n38. Câu về "các biến thể nhỏ" khớp n40. Review (Claude Opus 5.5, 10/11/2026): dung. Khớp tóm tắt Webb.'
