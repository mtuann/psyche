  - id: n22
    cau: 'Richards và Gross: ở nghiên cứu 1, người tham gia xem một đoạn phim với chỉ dẫn kìm nén; ở nghiên cứu 2, xem các slide hình ảnh tiêu cực kèm thông tin đi kèm (tên, nghề, nguyên nhân bị thương của người trong ảnh) với chỉ dẫn kìm nén hoặc tái đánh giá; sau đó kiểm tra trí nhớ; nghiên cứu 3 hỏi về thói quen kìm nén và tái đánh giá thường ngày.'
    loai: phat-hien
    nguon:
      - richards2000
      - ortner2013
    trich: Study 1 experimentally manipulated expressive suppression during film viewing ... Study 2 manipulated expressive suppression and reappraisal during slide viewing. ... Study 3 examined individual differences in typical expressive suppression and reappraisal | the verbal information presented concurrently with the images was contextually related to the emotionally-evocative slides (i.e., the name, occupation, and cause of injury in the individual in the picture)
    vi_tri: Richards & Gross 2000, tóm tắt; Ortner 2013, Discussion (mô tả thông tin đi kèm slide)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Richards và Gross cho người tham gia xem các slide hình ảnh tiêu cực kèm thông tin nói, với chỉ dẫn kìm nén, tái đánh giá, hoặc không điều tiết. Sau đó kiểm tra trí nhớ" (gộp các nghiên cứu như một). Chữ mới tách ba nghiên cứu theo tóm tắt. Lý do: tóm tắt cho thấy ba nghiên cứu khác nhau; "thông tin nói" thay bằng "thông tin đi kèm" vì chỉ có Ortner (2013) mô tả nội dung, không xác nhận hình thức trình bày. Toàn văn không mở được. Số người mỗi nghiên cứu không có trên trang. Review (Claude Opus 5.5, 10/11/2026): dung. Khớp tóm tắt Richards & Gross 2000 và Ortner 2013.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/10981843/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf" ]
    luot_2_ghi_chu: Tên và nghề được Butler xác nhận; 'nguyên nhân bị thương' không xác nhận được qua nguồn đã mở. Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở).
    review: dung
  - id: n23
    cau: Kìm nén làm trí nhớ kém đi, cả với chi tiết của đoạn phim (nghiên cứu 1) lẫn với slide (nghiên cứu 2); tái đánh giá không làm trí nhớ kém đi (nghiên cứu 2).
    loai: phat-hien
    nguon:
      - richards2000
      - gj2003
    trich: Study 1 ... showing that suppression led to poorer memory for the details of the film. Study 2 manipulated expressive suppression and reappraisal during slide viewing. Only suppression led to poorer slide memory.
    vi_tri: Richards & Gross 2000, tóm tắt; Gross & John 2003, tr. 350
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhóm kìm nén nhớ kém hẳn các chi tiết được trình bày bằng lời nói (dù slide gây cảm xúc mạnh hay nhẹ), trong khi trí nhớ với chi tiết hình ảnh không bị ảnh hưởng. Nhóm tái đánh giá không hề bị suy giảm trí nhớ — thậm chí còn nhớ chi tiết hình ảnh tốt hơn nhóm đối chứng". Chữ mới: như câu. Lý do: tóm tắt chỉ nói "poorer slide memory"; việc tách trí nhớ lời nói với hình ảnh, "dù slide mạnh hay nhẹ" và "tái đánh giá nhớ hình ảnh tốt hơn đối chứng" không xác nhận được (toàn văn không mở được). Ortner 2013 còn kể Richards & Gross là "reduced non-verbal memory" do kìm nén, trái chữ cũ. Không dùng nữa. Review (Claude Opus 5.5, 10/11/2026): dung. Khớp tóm tắt.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/10981843/" ]
    luot_2_ghi_chu: Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở).
    review: dung
  - id: n24
    cau: Ở nghiên cứu thứ ba, người có thói quen kìm nén báo cáo trí nhớ của mình kém hơn và cũng làm kém hơn ở bài kiểm tra trí nhớ khách quan; tái đánh giá không có mối liên hệ ấy.
    loai: phat-hien
    nguon:
      - richards2000
    trich: Study 3 examined individual differences in typical expressive suppression and reappraisal and found that suppression was associated with poorer self-reported and objective memory but that reappraisal was not.
    vi_tri: Richards & Gross 2000, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ở một nghiên cứu đời thực (nhật ký hằng ngày), những người có thói quen kìm nén cũng nhớ kém hơn về các sự kiện cảm xúc trong đời mình." Chữ mới như câu. Lý do: tóm tắt không nhắc nhật ký hằng ngày hay "các sự kiện cảm xúc trong đời"; đó là nghiên cứu về khác biệt cá nhân với trí nhớ tự báo cáo và khách quan. Review (Claude Opus 5.5, 10/11/2026): dung. Khớp tóm tắt.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/10981843/" ]
    luot_2_ghi_chu: Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở).
    review: dung
  - id: n25
    cau: 'Cách giải thích: kìm nén đòi hỏi phải liên tục tự quản lý các phản ứng cảm xúc đang trỗi dậy, việc này có thể chiếm nguồn lực nhận thức vốn dành cho việc ghi nhận thông tin xung quanh.'
    loai: phat-hien
    nguon:
      - gj2003
    trich: because suppression comes late in the emotion-generative process, it requires the individual to effortfully manage emotion response tendencies as they continually arise. These repeated efforts may consume cognitive resources that could otherwise be used for optimal performance in the social contexts in which the emotions arise.
    vi_tri: Gross & John 2003, tr. 349
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Lời giải thích của các tác giả: khi kìm nén, một phần tâm trí bạn bận rộn ''tự giám sát'' — ''mặt mình có lộ gì không? ...'' — nên còn ít ''bộ nhớ làm việc'' để ghi nhận thông tin xung quanh." Chữ mới: dẫn Gross & John (2003) kể rằng kìm nén "có thể" (may) chiếm nguồn lực nhận thức. Lý do: "tự giám sát" và "bộ nhớ làm việc" là chữ của toàn văn Richards & Gross không mở được; Gross & John nói đây là giả thuyết ("may consume"). Review (Claude Opus 5.5, 10/11/2026): dung. Gross & John 2003 (toàn văn): "These repeated efforts may consume cognitive resources"; "This replicated finding suggests that using suppression as a regulation strategy is cognitively taxing in a way that reappraisal is not".'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf" ]
    luot_2_ghi_chu: Cách giải thích (gánh nặng nhận thức), do Richards & Gross đề xuất theo Butler.
    review: dung
