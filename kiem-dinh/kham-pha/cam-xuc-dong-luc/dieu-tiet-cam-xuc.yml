      - webb2012
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó: theo thước đo mục 4, "Vững chắc" cần phân tích tổng hợp chất lượng tốt và đúng ở nhiều quần thể; phần quần thể chưa kiểm được (toàn văn Webb bị embargo). Nếu lượt 2 hay review không đồng ý, hạ xuống "Khá vững". G1-L04 mục #4: khung đã giới hạn ở cảm xúc tiêu cực (xem n45). Review (Claude Opus 5.5, 10/11/2026): sai. Lượt 2 đúng (quá mạnh). Bằng chứng tổng hợp đọc được không tách tác động của kìm nén biểu hiện lên trải nghiệm: d+ = 0,32 của Webb là hiệu quả chung gộp nhiều loại kết quả, d+ = −0,04 là của chiến lược khác (cố nén trải nghiệm). Còn lại là thí nghiệm của cùng nhóm (Gross 1998; Gross & Levenson theo Gross & John 2003 kể lại), mẫu phương Tây: thước đo mục 4 cho Khá vững. Chữ cũ: khung Vững chắc. Chữ mới: khung Khá vững, nêu rõ giới hạn của số Webb. Hộp ::tom-tat đổi theo (sinh từ khung).'
    luot_2: qua-manh
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf", "https://pubmed.ncbi.nlm.nih.gov/22582737/" ]
    luot_2_ghi_chu: "câu đúng: Khá vững: kìm nén giảm biểu hiện bên ngoài, nhưng trong nhiều thí nghiệm không giảm trải nghiệm cảm xúc tiêu cực bên trong (Gross 1998; Gross & Levenson 1997; Harris 2001).; Chưa có phân tích tổng hợp nào đọc được tách riêng tác động của kìm nén biểu hiện lên trải nghiệm: d+ = 0,32 của Webb là hiệu quả chung (chủ yếu giảm biểu hiện), còn d+ = −0,04 là chiến lược khác (cố nén chính trải nghiệm). Bằng chứng đọc được: nhiều thí nghiệm cùng chiều, phù hợp 'khá vững', chưa tới 'vững chắc' theo thước đo mục 4."
    review: sai
  - id: n44
    cau: 'Kết quả cốt lõi của Gross (1998): cả hai chiến lược đều che được "mặt", chỉ tái đánh giá làm dịu được "lòng"; Gross và John (2003) tóm lại rằng các thí nghiệm khác cũng thấy kìm nén cảm xúc tiêu cực không làm giảm trải nghiệm; d+ = 0,32 của Webb và cộng sự (2012) là hiệu quả chung của kìm nén biểu hiện, còn d+ = −0,04 là của chiến lược cố nén chính trải nghiệm.'
    loai: phat-hien
    nguon:
      - gross1998
      - gj2003
      - webb2012
    trich: reappraisal decreased disgust experience, whereas suppression increased sympathetic activation [Gross 1998] | whereas suppressing negative emotions left intact the experience of negative emotion [Gross & John 2003] | suppressing the expression of emotion proved effective (d(+) = 0.32), but suppressing the experience of emotion or suppressing thoughts of the emotion-eliciting event did not (d(+) = -0.04 and -0.12, respectively) [Webb 2012]
    vi_tri: Gross 1998 và Webb 2012, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "đã được tìm thấy lại trong nhiều nghiên cứu sau đó, ở cả đo lường chủ quan, hành vi và sinh lý, và được củng cố bởi phân tích tổng hợp". Chữ mới: bỏ "nhiều nghiên cứu sau đó ... đo lường chủ quan, hành vi và sinh lý" và nêu số của Webb. Lý do: không mở được nguồn nào xác nhận từng loại đo lường ở các nghiên cứu sau; tóm tắt Webb chỉ nói kết cục gồm trải nghiệm, hành vi, sinh lý mà không chia kết quả theo loại. Review (Claude Opus 5.5, 10/11/2026): sai. Lượt 2 đúng (quá mạnh): "được củng cố bởi Webb ... kìm nén trải nghiệm cảm xúc thì không (d+ = −0,04)" dùng số của chiến lược cố nén trải nghiệm như bằng chứng rằng kìm nén biểu hiện không giảm trải nghiệm. Chữ cũ: "... được củng cố bởi phân tích tổng hợp của Webb và cộng sự (2012): kìm nén biểu hiện có hiệu quả (d+ = 0,32), còn kìm nén trải nghiệm cảm xúc thì không (d+ = −0,04)." Chữ mới: "Gross và John (2003) tóm lại rằng các thí nghiệm khác cũng thấy kìm nén cảm xúc tiêu cực không làm giảm trải nghiệm. Phân tích tổng hợp của Webb và cộng sự (2012) thấy kìm nén biểu hiện có hiệu quả chung (d+ = 0,32), nhưng con số này gộp nhiều loại kết quả; còn d+ = −0,04 là của một chiến lược khác (cố nén chính trải nghiệm cảm xúc), nên chưa phải bằng chứng tổng hợp trực tiếp cho ý này."'
    luot_2: qua-manh
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/22582737/", "https://pubmed.ncbi.nlm.nih.gov/9457784/" ]
    luot_2_ghi_chu: "câu đúng: Kết quả cốt lõi của Gross (1998): cả hai chiến lược đều giảm biểu hiện bên ngoài, chỉ tái đánh giá làm giảm trải nghiệm kinh tởm, còn kìm nén thì làm tăng hoạt hóa giao cảm. Phân tích tổng hợp Webb và cộng sự (2012) thấy kìm nén biểu hiện có hiệu quả chung d+ = 0,32 và thay đổi nhận thức d+ = 0,36; cố nén chính trải nghiệm cảm xúc (d+ = −0,04) hay suy nghĩ (−0,12) thì không có hiệu quả.; Các con số Webb đúng, nhưng 'củng cố' kết quả của Gross là suy diễn: d+ = −0,04 là hiệu quả của chiến lược 'cố nén chính cảm xúc đang trải nghiệm', không phải tác động của việc nén biểu hiện lên trải nghiệm."
    review: sai
