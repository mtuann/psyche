      - burn-jts2026
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra trực tiếp sự khác biệt giữa tái đánh giá và kìm nén trên người Việt." Chữ mới: nêu mốc "Tính đến 11/2026", đổi thành "thí nghiệm", và nêu hai nghiên cứu cắt ngang đã tìm thấy. Lý do: lần tìm Europe PMC 10/11/2026 thấy hai nghiên cứu ở người Việt (bỏng) có đo tái đánh giá và kìm nén bằng ERQ: Eur Burn J 2026 (256 người, ERQ-SF: tái đánh giá liên hệ dương, kìm nén liên hệ âm với HRQoL) và J Trauma Stress 2026 (146 người, hai chiến lược không điều tiết mối liên hệ). Câu cũ nói "không có nghiên cứu nào" có thể gây hiểu nhầm. Chưa tìm Google Scholar và tạp chí trong nước; OpenAlex hết hạn mức ngày 10/11/2026. Review (Claude Opus 5.5, 10/11/2026): dung. Đã mở Europe PMC cho hai DOI: Eur Burn J 2026 (256 người, Vietnam National Burn Hospital, "Cognitive reappraisal showed positive, whereas expressive suppression showed negative associations with HRQoL") và J Trauma Stress 2026 (N = 146, "did not moderate the association between emotion reactivity and mental health outcomes"). Có mốc, het_han 2028-11-01.'
    het_han: '2028-11-01'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.3390/ebj7040051", "https://doi.org/10.1002/jts.70022" ]
    luot_2_ghi_chu: "Đã tìm Europe PMC cùng ngày (emotion regulation, reappraisal, suppression với Vietnam/Vietnamese): không thấy thí nghiệm nào so sánh trực tiếp hai chiến lược trên người Việt."
    review: dung
  - id: n64
    cau: Butler, Lee và Gross (2007) thấy hậu quả xã hội tiêu cực của kìm nén yếu đi ở những người mang giá trị Á Đông nhiều hơn; nghiên cứu ấy không có mẫu người Việt.
    loai: phat-hien
    nguon:
      - butler2007
    trich: These deleterious effects were reduced when individuals with more Asian values suppressed, and these reductions were mediated by cultural differences in the responsiveness of the suppressors.
    vi_tri: Butler 2007, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "văn hóa Việt Nam — cũng như nhiều nền văn hóa Đông Á — đề cao sự kiềm chế, giữ thể diện và hòa khí. Có giả thuyết cho rằng ..., cái giá xã hội của kìm nén có thể thấp hơn ..., nhưng cái giá sinh lý và nhận thức nhiều khả năng vẫn tồn tại, vì đó là cơ chế chung của con người." Chữ mới: dẫn Butler (2007) và nói chưa có dữ liệu về cái giá sinh lý hay nhận thức theo văn hóa. Lý do: cũ là suy luận không nguồn; "đề cao ... của văn hóa Việt Nam" không có nguồn đã mở; "cơ chế chung" không được kiểm. Mẫu của Butler: người Mỹ có giá trị Âu và giá trị Á (theo tóm tắt); không có người Việt. Review (Claude Opus 5.5, 10/11/2026): dung. Khớp tóm tắt Butler 2007.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/17352561/" ]
    luot_2_ghi_chu: Chỉ đọc tóm tắt; mẫu là người Mỹ (giá trị Đông Á/Tây Âu), không nêu mẫu người Việt.
    review: dung
  - id: n65
    cau: 'Ngộ nhận 1: trong thí nghiệm của Gross (1998) kìm nén đi kèm tăng hoạt động hệ thần kinh giao cảm; ở người hay kìm nén, nghiên cứu tương quan thấy ít cảm xúc tích cực và nhiều cảm xúc tiêu cực hơn (Gross và John, 2003). Bình tĩnh thật sự và "giữ mặt lạnh" là hai việc khác nhau.'
    loai: phat-hien
    nguon:
      - gross1998
      - gj2003
    trich: suppression increased sympathetic activation | suppressors experience and express lesser positive emotion, yet experience greater negative emotion
    vi_tri: Gross 1998, tóm tắt; Gross & John 2003, tóm tắt tr. 348
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nghiên cứu cho thấy điều ngược lại ở cấp độ cơ thể: kìm nén làm tăng hoạt động hệ thần kinh giao cảm và về lâu dài đi cùng nhiều cảm xúc tiêu cực hơn, ít cảm xúc tích cực hơn." Chữ mới như câu. Lý do: "về lâu dài" cần phân biệt thí nghiệm một lần với nghiên cứu tương quan về thói quen; bỏ "tốt cho sức khỏe" vì không có dữ liệu về sức khỏe thể chất. Review (Claude Opus 5.5, 10/11/2026): dung. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9457784/", "https://pubmed.ncbi.nlm.nih.gov/12916575/" ]
    luot_2_ghi_chu: Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở).
    review: dung
  - id: n66
    cau: 'Ngộ nhận 2: tái đánh giá là diễn giải lại ý nghĩa của tình huống để đổi tác động cảm xúc của nó, ví dụ nhìn nhận áp lực của sếp thay vì mặc định "sếp ghét mình"; các nghiên cứu ở đây không so sánh cách diễn giải sát sự thật với cách tô hồng, nên bài không khẳng định cách nào hiệu quả hơn.'
    loai: dinh-nghia
    nguon:
      - gj2003
    trich: Cognitive reappraisal is a form of cognitive change that involves construing a potentially emotion-eliciting situation in a way that changes its emotional impact
    vi_tri: Gross & John 2003, tr. 349
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Tái đánh giá hiệu quả là tìm một cách diễn giải khác mà vẫn đúng với sự thật ... Đó là mở rộng góc nhìn, không phải tô hồng thực tế." Chữ mới như câu. Lý do: khẳng định "hiệu quả là khi diễn giải đúng với sự thật" không có nguồn; Gross & John định nghĩa tái đánh giá chỉ là diễn giải lại để đổi tác động cảm xúc. Ví dụ về sếp là minh họa (gia-dinh). Review (Claude Opus 5.5, 10/11/2026): dung. Khớp định nghĩa của Gross & John 2003.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf" ]
    luot_2_ghi_chu: Câu nói bài không so sánh diễn giải sát sự thật với tô hồng, hợp với các nghiên cứu được trích.
    review: dung
  - id: n67
    cau: 'Ngộ nhận 3: kìm nén biểu hiện có hiệu quả trong các thí nghiệm (Webb và cộng sự, 2012), và trong nhiều tình huống xã hội là lựa chọn có lý do; điều đáng lưu ý là việc dùng nó thường xuyên, thành thói quen (Gross và John, 2003).'
    loai: phat-hien
    nguon:
      - webb2012
      - gj2003
    trich: suppressing the expression of emotion proved effective (d(+) = 0.32) | Study 5 shows ... using suppression is related negatively.
    vi_tri: Webb 2012 và Gross & John 2003, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Kìm nén biểu hiện có hiệu quả ngắn hạn (Webb ...) và ... là lựa chọn đúng đắn. Cái hại nằm ở việc chỉ biết kìm nén, kéo dài, mà không bao giờ xử lý cảm xúc thật bên dưới." Chữ mới như câu. Lý do: bỏ "ngắn hạn" và vế "không bao giờ xử lý cảm xúc thật bên dưới" (không có nguồn); Gross & John đo thói quen dùng thường xuyên, không đo "chỉ biết kìm nén". Review (Claude Opus 5.5, 10/11/2026): dung. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/22582737/", "https://pubmed.ncbi.nlm.nih.gov/12916575/" ]
