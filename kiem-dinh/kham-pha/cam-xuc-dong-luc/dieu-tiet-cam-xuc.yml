      - richards2000
      - gj2003
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: khung "Vững chắc". Chữ mới: "Khá vững", kèm câu giới hạn. Lý do: thước đo mục 4 yêu cầu phân tích tổng hợp hay hai tái lập lớn có đăng ký trước cho "Vững chắc"; ba cái giá chỉ có thí nghiệm đơn lẻ của cùng nhóm và nghiên cứu tương quan. Đề nghị review xác nhận việc hạ nhãn. Review (Claude Opus 5.5, 10/11/2026): dung. Chốt Khá vững (hạ từ Vững chắc ở lượt 1): cái giá sinh lý và trí nhớ dựa vào thí nghiệm của cùng nhóm; cái giá xã hội có phân tích tổng hợp Chervonsky & Hunt 2017 nhưng gồm nghiên cứu tương quan. Thêm chervonsky2017 vào co_so.'
