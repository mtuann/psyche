    ghi_chu: 'Chữ cũ: "xem một đoạn phim gây kinh tởm — cảnh một ca phẫu thuật —". Chữ mới bỏ "cảnh một ca phẫu thuật". Lý do: nội dung đoạn phim không có trong tóm tắt và toàn văn không mở được. "Máy móc ghi lại" là cách nói của trang cho "were recorded". Review (Claude Opus 5.5, 10/11/2026): dung. Khớp tóm tắt Gross 1998.'
    luot_2: dung
