  - id: n69
    cau: 'Quiz 2: theo mô hình quá trình, tái đánh giá (can thiệp sớm) thường hiệu quả hơn kìm nén (can thiệp muộn) vì can thiệp trước khi phản ứng cảm xúc hình thành đầy đủ có thể thay đổi cả quỹ đạo cảm xúc; can thiệp muộn thì cảm xúc đã bùng lên, chỉ còn cách ghìm đầu ra hành vi. Lời giải thích: theo mô hình, càng sớm càng có thể thay đổi cả quỹ đạo.'
    loai: phat-hien
    nguon:
      - gj2003
    trich: This means that reappraisal can thus efficiently alter the entire subsequent emotion trajectory.
    vi_tri: Gross & John 2003, tr. 349
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ của lời giải thích: "Cùng một ''lượng'' nỗ lực điều tiết, đặt càng sớm trong chuỗi hình thành cảm xúc thì ảnh hưởng càng sâu." Chữ mới như câu. Lý do: ví von "lượng nỗ lực" không có trong nguồn; nói rõ là suy ra từ mô hình. Lời giải thích không dựa vào vị trí lựa chọn. Review (Claude Opus 5.5, 10/11/2026): dung. Câu hỏi đặt trong khung "Theo mô hình quá trình", lời giải thích có "theo mô hình": chấp nhận; lưu ý Webb d+ = 0,00 cho chuyển hướng chú ý đã xử lý ở hình (n15).'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/22582737/", "https://pubmed.ncbi.nlm.nih.gov/9457784/" ]
    luot_2_ghi_chu: "'Thường hiệu quả hơn' khớp Webb; lưu ý attentional deployment (sớm) d+ = 0,00."
    review: dung
  - id: n70
    cau: 'Quiz 3: Richards và Gross (2000) phát hiện kìm nén làm trí nhớ về thông tin gặp trong lúc kìm nén (chi tiết của phim, của slide) kém đi; tái đánh giá thì không. Lời giải thích: kìm nén đòi hỏi phải liên tục quản lý phản ứng cảm xúc, việc này có thể chiếm nguồn lực nhận thức dành cho ghi nhận thông tin xung quanh.'
    loai: phat-hien
    nguon:
      - richards2000
      - gj2003
    trich: Study 1 ... suppression led to poorer memory for the details of the film. Study 2 ... Only suppression led to poorer slide memory.
    vi_tri: Richards & Gross 2000, tóm tắt; Gross & John 2003, tr. 349–350
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: câu hỏi "làm suy giảm loại trí nhớ nào?", đáp án đúng "Trí nhớ với các chi tiết được trình bày bằng lời nói; trí nhớ hình ảnh không bị ảnh hưởng, và tái đánh giá không gây suy giảm nào", phương án nhiễu "Trí nhớ với chi tiết hình ảnh", lời giải thích "tâm trí bận ''tự giám sát'' ... thông tin bằng lời nói". Chữ mới như câu; phương án nhiễu đổi thành "sự kiện thời thơ ấu" và "tái đánh giá làm trí nhớ kém hơn". Lý do: xem n23–n24 (tách lời nói/hình ảnh không xác nhận được). Lời giải thích không dựa vào vị trí lựa chọn. Review (Claude Opus 5.5, 10/11/2026): dung. Khớp tóm tắt Richards & Gross và Gross & John 2003.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/10981843/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf" ]
    luot_2_ghi_chu: Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở).
