nhan_dinh:
  - id: n1
    cau: 'Mô tả (description) của trang: thí nghiệm của James Gross (1998) cho thấy kìm nén biểu hiện cảm xúc làm "mặt lạnh" nhưng không làm "lòng nguội": trải nghiệm cảm xúc tiêu cực không giảm, cơ thể còn bị kích hoạt mạnh hơn.'
    loai: phat-hien
    nguon:
      - gross1998
      - gj2003
    trich: Compared with the control condition, both reappraisal and suppression were effective in reducing emotion-expressive behavior. However, reappraisal decreased disgust experience, whereas suppression increased sympathetic activation. | Although participants who suppressed showed much less expressive behavior, they experienced as much negative emotion as participants who just watched.
    vi_tri: Gross 1998, tóm tắt; Gross & John 2003, tr. 349 (mục Experimental Findings)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "cảm xúc bên trong vẫn y nguyên, cơ thể còn căng hơn". Chữ mới: "trải nghiệm cảm xúc tiêu cực không giảm, cơ thể còn bị kích hoạt mạnh hơn". Lý do: "vẫn y nguyên" khái quát cho mọi cảm xúc, trong khi với cảm xúc tích cực kìm nén làm giảm cả trải nghiệm (Gross & John 2003, tr. 349), và thí nghiệm gốc chỉ dùng phim gây kinh tởm. Vế trí nhớ và quan hệ xã hội viết là "các nghiên cứu sau cho thấy ... cũng có thể phải trả giá" (xem n2, n24, n31). Review (Claude Opus 5.5, 10/11/2026): dung. Khớp tóm tắt Gross 1998 và Gross & John 2003 (toàn văn đã mở lại, bản uvic.ca).'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9457784/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf" ]
    luot_2_ghi_chu: Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở).
    review: dung
  - id: n2
    cau: 'Mô tả: các nghiên cứu sau cho thấy trí nhớ và quan hệ xã hội cũng có thể phải trả giá khi kìm nén.'
    loai: phat-hien
    nguon:
      - richards2000
      - gj2003
    trich: Suppression—but not reappraisal—led to memory impairment for social information presented while the individual was regulating emotions. | suppression is associated with worse interpersonal functioning.
    vi_tri: Gross & John 2003, tr. 350 và tóm tắt tr. 348; Richards & Gross 2000, tóm tắt
    ket_qua: dung
    ghi_chu: 'theo G1-L04 (22/10/2026): kiểm ở chế độ tiết kiệm, không có câu trích; kiểm lại ở D5-L4 lượt 1 bằng nguồn ghi ở trên.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/10981843/", "https://pubmed.ncbi.nlm.nih.gov/12916575/" ]
    luot_2_ghi_chu: Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở).
  - id: n3
    cau: 'Tự trải nghiệm: tình huống bị sếp phê bình trong buổi họp, Cách A (giữ vẻ mặt bình thản) và Cách B (tự nhủ cách hiểu khác) là tình huống giả định để minh họa, không phải số liệu.'
    loai: phat-hien
    nguon:
      - gj2003
    trich: For example, during an admissions interview, one might view the give and take as an opportunity to find out how much one likes the school, rather than as a test of one's worth. | For example, one might keep a poker face while holding a great hand during a card game.
    vi_tri: Gross & John 2003, tr. 349 (ví dụ của chính tác giả cho hai chiến lược)
    ket_qua: dung
    ghi_chu: 'gia-dinh: tình huống minh họa; ví dụ cùng kiểu với ví dụ của Gross & John (2003). Không có con số hay phát hiện nào ở đoạn này.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9457784/" ]
    luot_2_ghi_chu: Ví dụ giả định (gia-dinh), không phải nhận định; không trái với nhận định nào của trang.
  - id: n4
    cau: Kìm nén biểu cảm (expressive suppression) là che giấu đầu ra bên ngoài của cảm xúc đã bùng lên bên trong.
    loai: dinh-nghia
    nguon:
      - gj2003
    trich: Expressive suppression is a form of response modulation that involves inhibiting ongoing emotion-expressive behavior (Gross, 1998).
    vi_tri: Gross & John 2003, tr. 349
    ket_qua: dung
    ghi_chu: Vế "cảm xúc vẫn bùng lên bên trong" là cách nói của trang cho "ongoing" (hành vi biểu hiện đang diễn ra sau khi phản ứng đã phát sinh); với cảm xúc tích cực trải nghiệm có giảm (xem n45).
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf", "https://pubmed.ncbi.nlm.nih.gov/9457784/" ]
  - id: n5
    cau: Tái đánh giá nhận thức (cognitive reappraisal) là diễn giải lại tình huống để cảm xúc ngay từ đầu đã bớt dữ dội.
    loai: dinh-nghia
    nguon:
      - gj2003
    trich: Cognitive reappraisal is a form of cognitive change that involves construing a potentially emotion-eliciting situation in a way that changes its emotional impact (Lazarus & Alfert, 1964).
    vi_tri: Gross & John 2003, tr. 349
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf", "https://pubmed.ncbi.nlm.nih.gov/9457784/" ]
  - id: n6
    cau: Trong tình huống ở đầu bài, nghiên cứu cho thấy hai cách khác nhau rất xa về "cái giá" phải trả, dù từ bên ngoài cả hai đều có thể trông bình tĩnh.
    loai: phat-hien
    nguon:
      - gross1998
      - gj2003
    trich: Compared with the control condition, both reappraisal and suppression were effective in reducing emotion-expressive behavior. | Although participants who suppressed showed much less expressive behavior, they experienced as much negative emotion as participants who just watched.
    vi_tri: Gross 1998, tóm tắt; Gross & John 2003, tr. 349
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "dù bề ngoài người dùng cách A trông có vẻ bình tĩnh nhất". Chữ mới: "dù từ bên ngoài, cả hai cách đều có thể trông bình tĩnh". Lý do: ở Gross (1998) cả hai chiến lược đều giảm biểu hiện bên ngoài so với đối chứng, nên "A trông bình tĩnh nhất" không có trong nguồn. Mô tả "rất xa" là cách nói của trang cho chênh lệch về trải nghiệm và sinh lý ở n19–n21. Review (Claude Opus 5.5, 10/11/2026): dung. "Khác nhau rất xa" là cách nói của trang cho chênh lệch trải nghiệm và sinh lý; chấp nhận.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9457784/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf" ]
    luot_2_ghi_chu: "'Khác nhau rất xa' hơi mạnh; ý chính (khác nhau về cái giá dù bên ngoài giống nhau) đúng."
    review: dung
  - id: n7
    cau: 'James Gross gọi khung nhìn này là mô hình quá trình điều tiết cảm xúc: cảm xúc hình thành qua chuỗi tình huống, chú ý, đánh giá, phản ứng; có thể can thiệp ở từng mắt xích (chọn hay sửa tình huống, chuyển hướng chú ý, diễn giải lại, kìm nén phản ứng).'
    loai: lich-su
    nguon:
      - gross1998rgp
      - gj2003
    trich: 'According to a process model of emotion regulation, emotion may be regulated at five points in the emotion generative process: (a) selection of the situation, (b) modification of the situation, (c) deployment of attention, (d) change of cognitions, and (e) modulation of responses.'
    vi_tri: Gross 1998 (Rev Gen Psychol), tóm tắt; Gross & John 2003, tr. 348–349 và Hình 1
    ket_qua: dung
    ghi_chu: 'theo G1-L04 (22/10/2026): kiểm ở chế độ tiết kiệm, không có câu trích; kiểm lại ở D5-L4 lượt 1 bằng nguồn ghi ở trên. Hình gross-model: xem n11–n15.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/22582737/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf" ]
    luot_2_ghi_chu: Chỉ đọc tóm tắt Webb; mô tả năm họ chiến lược (chọn/sửa tình huống, chú ý, đánh giá, phản ứng) là mô hình của Gross, khớp với taxonomy Webb.
  - id: n8
    cau: Can thiệp sớm (antecedent-focused), điển hình là tái đánh giá, diễn ra trước khi phản ứng cảm xúc hình thành đầy đủ; hiệu quả lan tới cả trải nghiệm bên trong.
    loai: dinh-nghia
    nguon:
      - gj2003
      - gross1998
    trich: Antecedent-focused strategies refer to things we do before the emotion response tendencies have become fully activated and have changed our behavior and peripheral physiological responses. | reappraisal decreased disgust experience
    vi_tri: Gross & John 2003, tr. 348; Gross 1998, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "bạn diễn giải lại ... — tốn ít công sức mà hiệu quả lan tới cả trải nghiệm bên trong". Chữ mới bỏ "tốn ít công sức mà". Lý do: "tốn ít công sức" không có trong nguồn đã đọc; Gross & John chỉ nói can thiệp sớm thay đổi quỹ đạo cảm xúc một cách hiệu quả (efficiently) và rằng kìm nén đòi hỏi quản lý liên tục. Review (Claude Opus 5.5, 10/11/2026): dung. Khớp trích Gross & John 2003.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9457784/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf" ]
    review: dung
  - id: n9
    cau: 'Can thiệp muộn (response-focused), điển hình là kìm nén: phản ứng đã bùng lên, chỉ còn cách ghìm lại những gì lộ ra ngoài (nét mặt, giọng nói, cử chỉ); với cảm xúc tiêu cực, trải nghiệm bên trong không giảm đi.'
    loai: phat-hien
    nguon:
      - gj2003
      - gross1998
    trich: 'By contrast, suppression is a response-focused strategy: it comes relatively late in the emotion-generative process, and primarily modifies the behavioral aspect of the emotion response tendencies. | whereas suppressing negative emotions left intact the experience of negative emotion'
    vi_tri: Gross & John 2003, tr. 349 (hai chỗ)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Cơn sóng bên trong vẫn ở đó, nguyên vẹn." Chữ mới: "Với cảm xúc tiêu cực, trải nghiệm bên trong không giảm đi." Lý do: với cảm xúc tích cực kìm nén làm giảm trải nghiệm (Gross & John 2003, tr. 349). "Nét mặt, giọng nói, cử chỉ" là cách mô tả hành vi biểu hiện của trang. Review (Claude Opus 5.5, 10/11/2026): dung. Khớp Gross & John 2003 ("suppressing negative emotions left intact the experience of negative emotion").'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9457784/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf" ]
    review: dung
  - id: n10
    cau: Tái đánh giá thay đổi "bộ phim" đang chiếu trong đầu; kìm nén chỉ giữ gương mặt không phản chiếu bộ phim đó (ví von tóm các điều trên).
    loai: phat-hien
    nguon:
      - gross1998
    trich: reappraisal decreased disgust experience, whereas suppression increased sympathetic activation
    vi_tri: Gross 1998, tóm tắt
    ket_qua: dung
    ghi_chu: Ví von của trang, khớp n19–n21 (chỉ đúng cho cảm xúc tiêu cực).
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9457784/" ]
    luot_2_ghi_chu: Ẩn dụ, không thêm khẳng định mới.
