    trich: suppression increased sympathetic activation
    vi_tri: Gross 1998, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'theo G1-L04 (22/10/2026), mục cần sửa #3 (ĐÁNG NGỜ). Chữ cũ: "tăng hoạt động của hệ thần kinh giao cảm (tim đập nhanh hơn, da dẫn điện mạnh hơn)". Chữ mới: "(cơ thể bị kích hoạt mạnh hơn)". Lý do: tóm tắt chỉ nói "increased sympathetic activation"; thí nghiệm gần nhất của Gross & Levenson (1993) thấy nhịp tim giảm khi kìm nén. Đối chiếu lại: chữ trên trang khớp tóm tắt. "Cơ thể căng hơn cả khi không kìm nén" = so với nhóm đối chứng (Compared with the control condition). Review (Claude Opus 5.5, 10/11/2026): dung. Khớp tóm tắt ("suppression increased sympathetic activation").'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9457784/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf" ]
    luot_2_ghi_chu: Chỉ đọc được tóm tắt (PubMed); toàn văn Gross 1998 / Richards & Gross 2000 / Gross & John 2003 / Webb 2012 không mở được (APA chặn, không có bản mở).
