    trich: (e) modulation of responses. | The first four of these processes are antecedent-focused, whereas the fifth is response-focused.
    vi_tri: Gross 1998, tóm tắt; Gross & John 2003, chú thích Hình 1
    ket_qua: da-lam-mem
    ghi_chu: 'Hình gross-model (src/hinh/gross-model.html), đã đối chiếu với Hình 1 của Gross & John 2003 và tóm tắt Gross 1998 (Rev Gen Psychol): số 5. Hình là sơ đồ ước lệ, đã nói rõ trong chú thích; không có số liệu. Nhãn "Kiềm chế biểu hiện" khác chữ "kìm nén" trong thân bài nhưng cùng khái niệm (gợi ý người giao thống nhất chữ, không sửa trong phần này). Review (Claude Opus 5.5, 10/11/2026): sai. Lượt 2 ghi dung nhưng nêu đúng chỗ: Webb 2012 thấy chuyển hướng chú ý (can thiệp sớm) d+ = 0,00, nên "càng sớm càng đổi được quỹ đạo" chỉ là dự đoán của mô hình, trong khi dòng chữ của hình viết như sự thật. Chữ cũ (hình gross-model): "Mỗi chiến lược “chặn” cảm xúc ở một mắt xích: can thiệp càng sớm, càng đổi được cả quỹ đạo cảm xúc." Chữ mới: "Mỗi chiến lược “chặn” ở một mắt xích; theo mô hình, can thiệp càng sớm càng có thể đổi cả quỹ đạo." Gross & John 2003 (toàn văn): "reappraisal can thus efficiently alter the entire subsequent emotion trajectory" (lập luận của mô hình). Hình đổi: người gom thêm gross-model vào HINH_DA_SUA.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/22582737/", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0278-7393.25.4.1011.zip/10.1037%252F1528-3542.3.1.48.pdf" ]
    luot_2_ghi_chu: "'Càng sớm càng đổi được quỹ đạo' là lập luận lý thuyết của mô hình; Webb 2012 cho attentional deployment d+ = 0,00 nên không phải quy luật thực nghiệm. Giữ dung vì chú thích hình viết như dự đoán của mô hình."
