    cau: Nhóm kìm nén còn tăng hoạt động của hệ thần kinh giao cảm (cơ thể bị kích hoạt mạnh hơn); mặt lạnh nhưng cơ thể căng hơn cả khi không kìm nén.
    loai: phat-hien
