      - chervonsky2017
    ly_do: 'Mỗi cái giá dựa trên một thí nghiệm hay một loạt thí nghiệm của cùng một nhóm (Gross 1998: tăng hoạt động giao cảm; Richards & Gross 2000: trí nhớ kém hơn, ba nghiên cứu) và nghiên cứu tương quan (Gross & John 2003: quan hệ xã hội); Gross & John (tr. 350) gọi phát hiện về trí nhớ là "replicated finding". Chưa có phân tích tổng hợp hay tái lập lớn có đăng ký trước cho từng cái giá; mẫu chủ yếu phương Tây.'
    nguon:
