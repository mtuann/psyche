    cau: 'Lời dẫn cuối bài và mục Đọc thêm: trang Hỗ trợ có đường dây, nơi khám đã kiểm chứng, gợi ý chọn nơi; link Trầm cảm, Tìm giúp đỡ, Đối phó stress.'
