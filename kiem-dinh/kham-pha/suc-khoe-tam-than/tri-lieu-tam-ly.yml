    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "giả dược tâm lý (psychological placebo — gặp gỡ, được lắng nghe nhưng không nhận kỹ thuật trị liệu thật)". Viết lại gần định nghĩa chung; tóm tắt Powers không định nghĩa. chỗ khó: định nghĩa giả dược tâm lý khác nhau giữa các thử nghiệm.'
