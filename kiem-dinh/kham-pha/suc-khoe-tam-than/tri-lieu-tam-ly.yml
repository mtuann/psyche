  - id: n39
    cau: Suy nghĩ tự động là những ý nghĩ thoáng qua, thành thói quen, mà ta tin ngay không kiểm chứng.
    loai: dinh-nghia
    nguon:
      - apa-dict
    trich: 'automatic thoughts: thoughts that are instantaneous, habitual, and nonconscious. Automatic thoughts affect a person''s mood and actions. Helping individuals to become aware of the presence and impact of negative automatic thoughts, and then to test their validity, is a central task of cognitive therapy.'
    vi_tri: APA Dictionary, automatic thoughts
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Từ bộ ba này sinh ra các suy nghĩ tự động". Bỏ quan hệ "sinh ra" (không có trong định nghĩa); thêm "thành thói quen".'
    luot_2: dung
    luot_2_nguon:
      - https://dictionary.apa.org/automatic-thoughts
    luot_2_ghi_chu: '''Tin ngay không kiểm chứng'' là diễn ý hợp lý của ''nonconscious, habitual''.'
  - id: n40
    cau: 'Trị liệu gồm hai mũi: tái cấu trúc nhận thức (nhận ra và kiểm tra suy nghĩ như giả thuyết, đối chiếu bằng chứng) và can thiệp hành vi (đối mặt dần với điều né tránh, quay lại hoạt động có ý nghĩa).'
    loai: dinh-nghia
    nguon:
      - apa-dict
      - nice-ng222
    trich: The objective of the therapy is to identify these faulty cognitions and replace them with more adaptive ones, a process known as cognitive restructuring. The therapist … helps the client correct and revise their perceptions and attitudes by citing evidence to the contrary [APA]; Behavioural activation … plan practical changes that reduce avoidance and focus on behaviours that are linked to improved mood [NICE bảng 2]
    vi_tri: APA Dictionary; NICE NG222 bảng 2
    ket_qua: da-sua
    ghi_chu: Thêm ví dụ "quay lại các hoạt động có ý nghĩa" (kích hoạt hành vi).
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1007/s10608-012-9476-1
      - https://dictionary.apa.org/cognitive-therapy
