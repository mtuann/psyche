  - id: n72
    cau: 'Câu hỏi 2: Cuijpers 2023: g = 0,79, còn 0,47 sau hiệu chỉnh; CBT chỉ hơn liệu pháp khác 0,06.'
    loai: so-lieu
    nguon:
      - cuijpers2023
    trich: 'The main effect size indicating the overall difference between CBT and control conditions after treatment was g=0.79 (95% CI: 0.70‐0.89) … The effect size was smaller for studies with low risk of bias (g=0.60; 95% CI: 0.49‐0.71) and after adjusting for publication bias (g=0.47, 95% CI: 0.35‐0.59 using the trim and fill procedure). A total of 42% of patients receiving CBT responded to treatment, while the response rate was only 19% in control groups, with a NNT of 4.7 in favor of CBT.'
    vi_tri: Cuijpers 2023
    ket_qua: da-sua
    ghi_chu: 'Giải thích cũ: "cứ khoảng 5 người điều trị thì 1 người hưởng lợi thêm so với không điều trị (NNT = 4,7)". "So với không điều trị" thành "so với nhóm đối chứng" (đối chứng gồm chăm sóc thông thường); "hưởng lợi" thành "đáp ứng". Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): lượt 2 khong-chac vì không mở được toàn văn. Toàn văn Cuijpers 2023 (bản PMC9840507 lưu ở Internet Archive ngày 29/6/2023; lượt 1 đã đọc, nay đọc lại): bảng 2 "Only low risk of bias 90 0.60 (0.49‐0.71) … Publication bias correction 349 0.47 (0.35‐0.59)", chú thích bảng "The reported publication bias correction is that using the trim and fill procedure"; Kết quả: "The response rate was 0.42 (95% CI: 0.39‐0.45) in CBT and 0.19 (95% CI: 0.18‐0.21) in the control conditions, which resulted in a RR of 2.13 (95% CI: 1.96‐2.32) and a NNT of 4.7 (95% CI: 4.0‐5.5)"; bảng 3: tỉ lệ đáp ứng ước tính ở 228/238 so sánh. NNT 4,7 do bài tính từ RR gộp (phương pháp: NNT = 1/hiệu số nguy cơ, gộp riêng), không phải 1/(0,42 − 0,19) ≈ 4,3 từ hai tỉ lệ gộp riêng; giữ số của bài. Số 0,47 là trim and fill (chỉ hiệu chỉnh sai lệch xuất bản), không phải gộp cả lọc nguy cơ sai lệch như một nguồn bậc 3 viết. Giữ các số. Lô sửa nhỏ sau S5 (chủ repo quyết 20/11/2026): bỏ «42% so với 19%» khỏi đáp án (số chưa xác nhận bằng nguồn mở); NNT không có trong đáp án.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1002/wps.21069&resultType=core&format=json" ]
    luot_2_ghi_chu: g = 0,79 và g = 0,06 (CBT so liệu pháp khác) khớp tóm tắt. g = 0,47 sau hiệu chỉnh sai lệch xuất bản không có trong tóm tắt và không mở được toàn văn (PMC, Wiley, kho VU chặn bot; các bài bình luận mở như Mental Elf, Carlat không nêu số này). Review cần đối chiếu bảng kết quả trong toàn văn.
  - id: n73
    cau: 'Câu hỏi 3: Powers 2008 (d = 0,34 so với 0,86): một phần đáng kể hiệu quả có vẻ đến từ những gì giả dược cũng có; phần chênh còn lại gợi ý kỹ thuật riêng góp thêm, nhưng tỉ lệ vẫn đang tranh cãi.'
    loai: phat-hien
    nguon:
      - powers2008
      - baskin2003
    trich: A comprehensive literature search produced 32 randomized controlled trials (N = 1,479) … There was a clear overall advantage of treatment compared to waitlist (d = 0.86), psychological placebo (d = 0.34), and pill-placebo (d = 0.36) conditions at posttreatment … Treatment gains were maintained at follow-up (d = 0.76).
    vi_tri: Powers 2008
    ket_qua: da-lam-mem
    ghi_chu: 'Đáp án cũ: "…phần vượt trội còn lại (d = 0,34) và hiệu quả duy trì sau trị liệu cho thấy kỹ thuật thật vẫn đóng góp thêm, nên không thể gọi toàn bộ là giả dược." Làm mềm ("có vẻ", "gợi ý"), vì Baskin 2003.'
    luot_2: dung
    luot_2_nguon:
      - https://dare.uva.nl/id/7886da1f-5790-4005-8ecb-747aca121038
      - https://doi.org/10.1146/annurev-clinpsy-050718-095424
  - id: n74
    cau: 'Câu hỏi 4: tâm động và nhân văn cũng có bằng chứng; khi so trực tiếp các liệu pháp chính quy khác nhau không nhiều; nên tìm người có chuyên môn, bàn phương pháp phù hợp, xây dựng sự tin tưởng.'
    loai: loi-khuyen
    nguon:
      - cuijpers2023
      - driessen2015
      - elliott2021
      - wampold2015
    trich: 'CBT was significantly more effective than other psychotherapies, but the difference was small (g=0.06; 95% CI: 0-0.12) and became non-significant in most sensitivity analyses. The effects of CBT did not differ significantly from those of pharmacotherapies at the short term, but were significantly larger at 6-12 month follow-up (g=0.34; 95% CI: 0.09-0.58), although the number of trials was small, and the difference was not significant in all sensitivity analyses. Combined treatment was more effective than pharmacotherapies alone … but it was not more effective than CBT alone at either time point.'
    vi_tri: Cuijpers 2023; Driessen 2015; Elliott 2021
    ket_qua: da-sua
    ghi_chu: 'Đáp án cũ: "liệu pháp tâm động (Shedler, 2010) và liệu pháp nhân văn (Elliott và cộng sự, 2021) đều có bằng chứng hiệu quả tương đương CBT (chênh lệch chỉ g = 0,06)… vì yếu tố chung giải thích phần lớn hiệu quả." Sai chỗ: g = 0,06 là CBT so với mọi liệu pháp khác trong trầm cảm, không riêng tâm động, nhân văn; "yếu tố chung giải thích phần lớn" đang tranh cãi. Sửa; giải thích bỏ "kỳ thị", thay "định kiến".'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1002/wps.21069
      - https://doi.org/10.1016/j.cpr.2015.07.004
      - https://strathprints.strath.ac.uk/74362
      - https://doi.org/10.1037/pst0000172
