  - id: n36
    cau: 'Tên "phán quyết chim Dodo" bắt nguồn từ bài của Rosenzweig năm 1936, mượn lời con chim Dodo: "Ai cũng thắng, và ai cũng phải có giải".'
    loai: lich-su
    nguon:
      - wampold2015
      - rosenzweig1936
    trich: 'Rosenzweig S. Some implicit common factors in diverse methods of psychotherapy: "At last the Dodo said, Everybody has won and all must have prizes" Am J Orthopsychiatry. 1936; 6:412–5. [Wampold 2015, tài liệu tham khảo 1]; The so-called common factors have a long history in psychiatry, originating with a seminal article by S. Rosenzweig in 1936'
    vi_tri: Wampold 2015, mở đầu và tài liệu tham khảo
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(Dodo bird verdict, theo Rosenzweig, 1936: mọi người đều thắng)". Dịch đủ câu trích. Tên gọi "Dodo bird verdict" phổ biến sau này (Luborsky 1975); trang chỉ nói "theo bài của Rosenzweig", không nói ông đặt tên.'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1037/0033-2909.122.3.203
    luot_2_ghi_chu: Chữ 'phán quyết' (verdict) phổ biến từ Luborsky và cộng sự 1975; Rosenzweig 1936 là nơi lời con Dodo được dùng lần đầu. 'Bắt nguồn từ' chấp nhận được.
