    cau: 'Bộ ba nhận thức của Beck: niềm tin tiêu cực về bản thân, thế giới, tương lai, gắn với trầm cảm.'
    loai: dinh-nghia
    nguon:
      - apa-dict
    trich: 'cognitive triad: a set of three beliefs thought to characterize major depressive episodes. These are negative beliefs about the self, the world, and the future. … [proposed in 1976 by Aaron T. Beck]'
    vi_tri: APA Dictionary, cognitive triad
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Beck đề xuất rằng trầm cảm (và sau này là lo âu) được duy trì bởi bộ ba nhận thức". APA Dictionary: bộ ba "được cho là đặc trưng của giai đoạn trầm cảm"; bỏ "(và sau này là lo âu)" (bộ ba là của trầm cảm) và "được duy trì bởi" thành "gắn với".'
    luot_2: dung
