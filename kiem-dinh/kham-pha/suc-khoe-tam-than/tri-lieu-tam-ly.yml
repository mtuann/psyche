    luot_2_ghi_chu: "câu đúng: Imamura và cộng sự (2021): 951 điều dưỡng ở một bệnh viện đa khoa lớn tại Hà Nội, so hai chương trình qua điện thoại thông minh với nhóm đối chứng; chỉ chương trình CBT theo thứ tự cố định giảm triệu chứng trầm cảm, ở mức nhỏ sau 3 tháng, không còn khác biệt sau 7 tháng; chương trình còn lại không cho thấy hiệu quả có ý nghĩa thống kê.; Mọi con số và chiều kết quả khớp (toàn văn qua Europe PMC). Chỉ vế cuối quá mạnh: bài viết 'failed to show a significant intervention effect', tức không thấy khác biệt có ý nghĩa thống kê, không phải đã chứng minh 'không có hiệu quả'. Thêm 'một bệnh viện' cho rõ mẫu (một bệnh viện, không phải điều dưỡng cả Hà Nội) là tùy chọn."
