      - https://doi.org/10.1186/s13033-020-00342-1
      - https://doi.org/10.1038/s41598-021-90320-5
    luot_2_ghi_chu: '''Còn ít'' là nhận định thận trọng, thời sự, cần mốc và hạn.'
  - id: n58
    cau: 'Murphy và cộng sự (2020): 32 xã, 8 tỉnh, 376 người lớn có triệu chứng trầm cảm (không gồm người nặng); chương trình tự quản lý có hỗ trợ (sổ tay kèm người hướng dẫn, hai tháng) giảm tỉ lệ còn triệu chứng so với nhóm chăm sóc thông thường chờ nhận chương trình sau: 26,4% so với 42,3% sau hai tháng.'
    loai: so-lieu
    nguon:
      - murphy2020
    trich: The cluster randomized trial included 376 adults in 32 communes in eight provinces. … Patients with severe symptoms were excluded … received a two-month course of SSM, consisting of a workbook and supportive coaching. Those in communes randomized to the delayed group received enhanced treatment as usual and … received the SSM intervention after 4 months. … At 2 months, 26.4% of the intervention group and 42.3% of the delayed group had SRQ-20 scores > 7.
    vi_tri: Murphy 2020, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Thêm mới. "Dựa trên CBT": toàn văn (Europe PMC PMC7014690, mục Background): "Supported-self management (SSM) for depression, a psychosocial intervention using a task-sharing approach and based on cognitive behavioural therapy (CBT) principles". "Còn triệu chứng" = điểm SRQ-20 > 7 (sàng lọc, không phải chẩn đoán); trang viết "còn triệu chứng trầm cảm", không viết "bị trầm cảm".'
    luot_2: dung
