    trich: A comprehensive literature search produced 32 randomized controlled trials (N = 1,479) … There was a clear overall advantage of treatment compared to waitlist (d = 0.86), psychological placebo (d = 0.34), and pill-placebo (d = 0.36) conditions at posttreatment … Treatment gains were maintained at follow-up (d = 0.76). [Powers]; alliance, empathy, expectations [Wampold]
    vi_tri: Powers 2008; Wampold 2015
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "trị liệu thật không chỉ là giả dược — nhưng một phần đáng kể hiệu quả đến từ những yếu tố mà giả dược cũng có". Làm mềm: "trong các thử nghiệm này", "có vẻ"; vì Baskin 2003 thấy với giả dược tương đương về cấu trúc, khác biệt gần như không còn (n33).'
