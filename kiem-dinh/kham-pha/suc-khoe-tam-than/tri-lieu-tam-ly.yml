      - https://doi.org/10.1037/a0023626
    luot_2_ghi_chu: 'câu đúng: Chưa thấy trị liệu tâm lý kém hiệu quả hơn ở các nước thu nhập thấp-trung bình hay nền văn hóa ngoài phương Tây, nhưng liệu pháp được điều chỉnh theo văn hóa có phần hiệu quả hơn; chưa đủ bằng chứng để nói các cơ chế tâm lý là phổ quát.; Không nguồn nào kiểm trực tiếp tính phổ quát của cơ chế; bằng chứng chỉ nói về hiệu quả.'
  - id: n64
    cau: Một phân tích tổng hợp mà Wampold (2015) dẫn thấy liệu pháp được điều chỉnh theo văn hóa hiệu quả hơn bản không điều chỉnh, mức chênh nhỏ (d = 0,32); phân tích ấy nói về người bệnh thuộc các nhóm thiểu số chủng tộc, sắc tộc, trong bối cảnh liệu pháp được xây dựng cho nhóm văn hóa chiếm đa số ở Bắc Mỹ và Tây Âu.
    loai: so-lieu
    nguon:
      - wampold2015
      - benish2011
    trich: A recent meta-analysis demonstrated that adapting evidence-based treatments by using an explanation congruent with the cultural group's beliefs (i.e., using the cultural "myth" as the explanation) was more effective than unadapted evidence-based treatments, although the effect was modest (d=0.32, n=21) [Wampold 2015] || "ethnic and racial minority clients"; "dominant cultural groups within North America and Western Europe" [Benish 2011, tóm tắt]
    vi_tri: Wampold 2015, mục Cultural adaptation; Benish 2011, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Thêm mới (thay ý "cách triển khai cần Việt hóa" bằng bằng chứng). Wampold kể lại (Benish 2011); theo X kể lại. Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): theo ghi chú lượt 2 (Benish, Quintana & Wampold 2011, lượt 2 đọc): thêm "các nghiên cứu ấy chủ yếu làm với người thuộc nhóm thiểu số ở Bắc Mỹ". Lượt 1 chưa đọc Benish 2011; vế mới dựa vào lượt 2. Review (17/11/2026): lượt 2 bổ sung khong-chac với vế "chủ yếu làm với người thuộc nhóm thiểu số ở Bắc Mỹ". Review đọc tóm tắt Benish, Quintana & Wampold 2011 (Europe PMC, PMID 21604860): tóm tắt nói "ethnic and racial minority clients" và liệu pháp thông thường hợp với "dominant cultural groups within North America and Western Europe"; không nói các nghiên cứu làm ở đâu. Viết lại vế cuối đúng theo tóm tắt: "phân tích ấy nói về người bệnh thuộc các nhóm thiểu số chủng tộc, sắc tộc, trong bối cảnh liệu pháp được xây dựng cho nhóm văn hóa chiếm đa số ở Bắc Mỹ và Tây Âu"; bỏ "chủ yếu", "ở Bắc Mỹ" như nơi làm nghiên cứu.'
    luot_2: khong-chac
    luot_2_nguon: [ "http://web.archive.org/web/20250630215110/https://onlinelibrary.wiley.com/doi/full/10.1002/wps.20238", "https://pubmed.ncbi.nlm.nih.gov/21604860/" ]
    luot_2_ghi_chu: "Vế đầu đúng: Wampold dẫn một phân tích tổng hợp (Benish 2011, 21 nghiên cứu), d = 0,32, Wampold gọi là 'modest'. Vế cuối 'các nghiên cứu ấy chủ yếu làm với người thuộc nhóm thiểu số ở Bắc Mỹ': tóm tắt của Benish chỉ nói về khách hàng thuộc nhóm thiểu số chủng tộc, sắc tộc, đặt trong bối cảnh Bắc Mỹ và Tây Âu; không nói các nghiên cứu làm ở đâu. Toàn văn Benish đóng (OpenAlex: closed), Wampold không nói về nơi làm. Nếu không mở được toàn văn Benish thì viết: 'các nghiên cứu ấy làm với người thuộc nhóm thiểu số chủng tộc, sắc tộc (ở các nước phương Tây)', hay bỏ 'ở Bắc Mỹ'."
