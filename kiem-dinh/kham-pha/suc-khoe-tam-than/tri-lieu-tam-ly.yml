    trich: Participants were recruited from nurses in a large general hospital in Hanoi … 951 participants were randomly allocated … Program B showed a statistically significant effect on improving depressive symptoms at 3-month (p = 0.048), but not at 7-month (p = 0.92); Cohen's d was -0.18 … and 0.03
    vi_tri: Imamura 2021, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Thêm mới. Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): theo ghi chú lượt 2: nói rõ chỉ một trong hai chương trình có hiệu quả. Review (17/11/2026): lượt 2 bổ sung qua-manh ("chương trình còn lại không có hiệu quả"): sửa theo câu đúng: "không cho thấy hiệu quả có ý nghĩa thống kê" (bài: "failed to show a significant intervention effect"); thêm "ở một bệnh viện đa khoa lớn" cho rõ mẫu.'
