    ghi_chu: 'Chữ cũ: "Phần lớn thân chủ trị liệu là người đang vật lộn với lo âu, trầm cảm mức nhẹ–trung bình… Quan niệm này chính là rào cản khiến nhiều người Việt trì hoãn…". Bỏ "phần lớn" và "nhiều người Việt" (không nguồn định lượng); dẫn NHS, WHO.'
