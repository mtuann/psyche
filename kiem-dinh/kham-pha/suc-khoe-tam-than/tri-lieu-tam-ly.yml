    cau: Tính đến 11/2026, ở Việt Nam đã có một số thử nghiệm ngẫu nhiên về can thiệp tâm lý dựa trên CBT, dù còn ít.
    loai: thoi-su
    nguon:
      - tim-kiem-vn-tri-lieu
      - murphy2020
      - imamura2021
    trich: 'Tìm Europe PMC 16/11/2026: 17 kết quả; có kết quả đã công bố: Murphy 2020, Imamura 2021, Watanabe 2024, Tran 2023, Niemi 2016'
    vi_tri: Europe PMC
    het_han: '2027-11-01'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chúng tôi chưa tìm thấy nghiên cứu công bố nào kiểm tra hiệu quả của các liệu pháp tâm lý trên người Việt." Sai: có ít nhất các thử nghiệm Murphy 2020 (tự quản lý có hỗ trợ dựa trên CBT, 376 người, 8 tỉnh), Imamura 2021 (CBT qua điện thoại, 951 điều dưỡng). Viết lại. chỗ khó: câu "chưa tìm thấy" của trang cũ là thời sự không có mốc, nay sai. Review (17/11/2026): câu thời sự có het_han nhưng trên trang chưa có mốc: thêm "Tính đến 11/2026," ở đầu câu.'
    luot_2: dung
