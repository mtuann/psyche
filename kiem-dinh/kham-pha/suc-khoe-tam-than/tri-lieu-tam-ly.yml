    luot_2_ghi_chu: 'Cuijpers 2023: chỉ đọc được tóm tắt (PubMed Central không cho toàn văn máy đọc; Wiley, kho VU và TUM chặn).'
  - id: n24
    cau: CBT chỉ hơn liệu pháp tâm lý khác một chút (g = 0,06, mất ý nghĩa trong phần lớn phân tích độ nhạy); ngang thuốc ngắn hạn nhưng hơn thuốc ở 6–12 tháng (g = 0,34, ít thử nghiệm, không vững trong mọi phân tích độ nhạy); kết hợp hơn thuốc đơn độc nhưng không hơn CBT đơn độc.
    loai: so-lieu
    nguon:
      - cuijpers2023
    trich: 'CBT was significantly more effective than other psychotherapies, but the difference was small (g=0.06; 95% CI: 0-0.12) and became non-significant in most sensitivity analyses. The effects of CBT did not differ significantly from those of pharmacotherapies at the short term, but were significantly larger at 6-12 month follow-up (g=0.34; 95% CI: 0.09-0.58), although the number of trials was small, and the difference was not significant in all sensitivity analyses. Combined treatment was more effective than pharmacotherapies alone … but it was not more effective than CBT alone at either time point.'
    vi_tri: Cuijpers 2023, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…CBT chỉ hơn các liệu pháp tâm lý khác một chút xíu (g = 0,06…); ngang ngửa thuốc trong ngắn hạn nhưng hơn thuốc ở 6–12 tháng (g = 0,34)…". Thêm giới hạn của g = 0,34 (ít thử nghiệm, không vững) theo tóm tắt. chỗ khó: so sánh với thuốc. Kế hoạch nâng cấp S5 (20/11/2026): chữ của nhận định không đổi; ngay sau đoạn có thêm lời rào về thuốc (n77). Đưa vào danh sách lượt 2 S5 như nhận định cùng chỗ.'
    luot_2: dung
    luot_2_nguon: [ "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=9840507&rettype=xml", "https://pubmed.ncbi.nlm.nih.gov/36640411/" ]
    luot_2_ghi_chu: "«Tóm tắt Cuijpers 2023: CBT… more effective than other psychotherapies, but the difference was small (g=0.06; 95% CI: 0‐0.12) and became non‐significant in most sensitivity analyses; did not differ significantly from those of pharmacotherapies at the short term, but were significantly larger at 6‐12 month follow‐up (g=0.34; 95% CI: 0.09‐0.58), although the number of trials was small, and the difference was not significant in all sensitivity analyses; Combined treatment was more effective than pharmacotherapies alone… but it was not more effective than CBT alone at either time point. Khớp từng vế. An toàn: n77 đặt ngay sau đoạn này, giảm nguy cơ đọc thành gợi ý bỏ thuốc.»"
