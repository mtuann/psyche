  - id: n62
    cau: 'Câu cũ: "Thứ ba, kênh hỗ trợ đầu tiên của người Việt thường là gia đình — vừa là điểm tựa, vừa là rủi ro…"'
    loai: phat-hien
    vi_tri: mục Ở Việt Nam, trang cũ
    ket_qua: da-bo
    ghi_chu: 'Bỏ: không tìm được nguồn có bình duyệt về "kênh hỗ trợ đầu tiên của người Việt thường là gia đình" trong lô này. Cùng đoạn, câu "nhà trị liệu cần hiểu áp lực thi cử, hiếu thảo, giữ thể diện gia đình" cũng bỏ (không nguồn). Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): lượt 2 khong-chac: câu đã bỏ ở lượt 1, đã kiểm trang (grep "gia đình", "kênh hỗ trợ" 17/11/2026): không còn. Giữ da-bo.'
    luot_2: khong-chac
    luot_2_ghi_chu: 'Không tìm được nguồn bậc 1–2 nói gia đình là kênh hỗ trợ đầu tiên của người Việt và ''vừa là điểm tựa vừa là rủi ro''. Ngo 2014 chỉ có thành phần hỗ trợ gia đình và bối cảnh văn hóa tập thể. Câu cũ: bỏ hay tìm nghiên cứu về tìm kiếm giúp đỡ ở Việt Nam.'
  - id: n63
    cau: Các cơ chế tâm lý "nhiều khả năng là phổ quát" (câu cũ).
    loai: phat-hien
