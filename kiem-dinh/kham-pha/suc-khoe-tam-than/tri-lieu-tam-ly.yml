    ly_do: 'Bằng chứng chất lượng cao được diễn giải trái ngược: khác biệt giữa các liệu pháp rất nhỏ (Cuijpers 2023: g = 0,06; Wampold 2015: tối đa khoảng d = 0,20), giả dược tương đương về cấu trúc gần ngang trị liệu thật (Baskin 2003); nhưng trị liệu vẫn hơn giả dược tâm lý thông thường (Powers 2008). Wampold tự nhận đây là tranh luận lâu dài ("both embraced and dismissed, creating some tension"). Đang tranh cãi.'
