  - id: n29
    cau: 'Trị liệu tâm lý hiệu quả hơn không điều trị: rất nhiều thử nghiệm và phân tích tổng hợp cho thấy giảm triệu chứng rõ hơn danh sách chờ hay chăm sóc thông thường; với trầm cảm g = 0,79, vẫn có ý nghĩa sau hiệu chỉnh sai lệch.'
    loai: nhan
    nguon:
      - cuijpers2023
      - hofmann2012
      - shedler2010
      - elliott2021
    trich: 'The main effect size indicating the overall difference between CBT and control conditions after treatment was g=0.79 (95% CI: 0.70‐0.89) … The effect size was smaller for studies with low risk of bias (g=0.60; 95% CI: 0.49‐0.71) and after adjusting for publication bias (g=0.47, 95% CI: 0.35‐0.59 using the trim and fill procedure). [Cuijpers]; The first major meta-analysis of psychotherapy outcome studies included 475 studies and yielded an overall effect size … of 0.85 for patients who received psychotherapy compared with untreated controls (Smith, Glass, & Miller, 1980) [Shedler 2010, kể lại]'
    vi_tri: Cuijpers 2023; Shedler 2010 tr. 99
    nhan: vung-chac
    co_so:
      - cuijpers2023
      - hofmann2012
      - elliott2021
      - driessen2015
    ly_do: 'Nhiều phân tích tổng hợp lớn, độc lập, cùng chiều: CBT với trầm cảm (409 thử nghiệm, g = 0,79, còn 0,47 sau hiệu chỉnh), tổng quan 269 phân tích tổng hợp về CBT, liệu pháp nhân văn so với không trị liệu (0,88), trị liệu tâm động ngắn hạn so với đối chứng (Driessen 2015); hiệu quả còn sau hiệu chỉnh sai lệch xuất bản; có ở nhiều quần thể (Cuijpers 2023 ghi số thử nghiệm ở nước không phương Tây tăng). Đạt Vững chắc cho so sánh với không điều trị.'
    ket_qua: da-sua
    ghi_chu: 'Thân cũ: "Hàng trăm thử nghiệm… và hàng trăm phân tích tổng hợp… Đây là một trong những kết luận được tái hiện nhiều nhất trong tâm lý học lâm sàng." Bỏ câu cuối (không nguồn); thêm số Cuijpers.'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1002/wps.21069
      - https://doi.org/10.1037/bul0000465
    luot_2_ghi_chu: 'Nhãn Vững chắc hợp thước đo (nhiều phân tích tổng hợp lớn cùng chiều, có cả nước thu nhập thấp-trung bình). Vế ''sau hiệu chỉnh sai lệch'' chỉ xác nhận được ở mức ''remained similar in sensitivity analyses'' (tóm tắt). Cuijpers 2023: chỉ đọc được tóm tắt (PubMed Central không cho toàn văn máy đọc; Wiley, kho VU và TUM chặn).'
  - id: n30
    cau: 'CBT hiệu quả với trầm cảm và lo âu ở mức vừa, nhưng khiêm tốn hơn con số thô: g = 0,79 còn 0,47 sau hiệu chỉnh; không phải ai được CBT cũng đáp ứng, nên một phần người bệnh cần thêm hay đổi hướng điều trị.'
    loai: nhan
    nguon:
      - cuijpers2023
      - carpenter2018
    trich: 'The main effect size indicating the overall difference between CBT and control conditions after treatment was g=0.79 (95% CI: 0.70‐0.89) … The effect size was smaller for studies with low risk of bias (g=0.60; 95% CI: 0.49‐0.71) and after adjusting for publication bias (g=0.47, 95% CI: 0.35‐0.59 using the trim and fill procedure). A total of 42% of patients receiving CBT responded to treatment, while the response rate was only 19% in control groups, with a NNT of 4.7 in favor of CBT.'
    vi_tri: Cuijpers 2023
    nhan: kha-vung
    co_so:
      - cuijpers2023
      - carpenter2018
    ly_do: 'Phân tích tổng hợp lớn với trầm cảm (Cuijpers 2023) và với lo âu so với giả dược (Carpenter 2018: g = 0,56) cùng chiều; giới hạn: hiệu ứng giảm rõ khi chỉ tính nghiên cứu ít sai lệch và sau hiệu chỉnh sai lệch xuất bản, dị biệt rất cao, khác nhau giữa các rối loạn. Khá vững.'
    ket_qua: da-sua
    ghi_chu: 'Ý chính cũ: "CBT hiệu quả với lo âu và trầm cảm ở mức trung bình — nhưng con số thật khiêm tốn hơn quảng cáo". Bỏ "quảng cáo" (không rõ ai quảng cáo); giữ nhãn. Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): lượt 2 khong-chac vì không mở được toàn văn. Toàn văn Cuijpers 2023 (bản PMC9840507 lưu ở Internet Archive ngày 29/6/2023; lượt 1 đã đọc, nay đọc lại): bảng 2 "Only low risk of bias 90 0.60 (0.49‐0.71) … Publication bias correction 349 0.47 (0.35‐0.59)", chú thích bảng "The reported publication bias correction is that using the trim and fill procedure"; Kết quả: "The response rate was 0.42 (95% CI: 0.39‐0.45) in CBT and 0.19 (95% CI: 0.18‐0.21) in the control conditions, which resulted in a RR of 2.13 (95% CI: 1.96‐2.32) and a NNT of 4.7 (95% CI: 4.0‐5.5)"; bảng 3: tỉ lệ đáp ứng ước tính ở 228/238 so sánh. NNT 4,7 do bài tính từ RR gộp (phương pháp: NNT = 1/hiệu số nguy cơ, gộp riêng), không phải 1/(0,42 − 0,19) ≈ 4,3 từ hai tỉ lệ gộp riêng; giữ số của bài. Số 0,47 là trim and fill (chỉ hiệu chỉnh sai lệch xuất bản), không phải gộp cả lọc nguy cơ sai lệch như một nguồn bậc 3 viết. Giữ các số. Lô sửa nhỏ sau S5 (chủ repo quyết 20/11/2026): bỏ «42% so với 19%, hơn một nửa…» ở khung nhãn (số chưa xác nhận bằng nguồn mở, lượt 2 S5 khong-chac); giữ số ở mục kể nghiên cứu (n22). Nhãn không đổi.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1002/wps.21069&resultType=core&format=json", "https://pubmed.ncbi.nlm.nih.gov/36640411/" ]
    luot_2_ghi_chu: "Tóm tắt Cuijpers 2023 (đọc qua Europe PMC) xác nhận g = 0,79 so với nhóm đối chứng, «moderate to large». Không xác nhận được g = 0,47 sau hiệu chỉnh sai lệch xuất bản: toàn văn (PMC, Wiley, kho VU) chặn truy cập tự động; tóm tắt còn nói hiệu quả «remained similar in sensitivity analyses», nên cần review đọc bảng toàn văn trước khi giữ cụm «khiêm tốn hơn con số thô». Cuijpers 2023 chỉ về trầm cảm: phần «và lo âu» trong ý chính cần nguồn riêng trong co_so. Câu «không phải ai cũng đáp ứng» hợp lý, không gần lời khuyên thuốc."
  - id: n31
    cau: Johnsen và Friborg (2015) cho rằng hiệu quả của CBT với trầm cảm giảm dần theo năm công bố; phân tích làm lại năm 2017 (Cristea và cộng sự) và Cuijpers 2023 không thấy xu hướng này.
    loai: phat-hien
    nguon:
      - johnsen2015
      - cristea2017
      - cuijpers2023
    trich: The metaregressions examining the temporal trends indicated that the effects of CBT have declined linearly and steadily since its introduction [Johnsen]; Year of publication does not appear to be a reliable and independent moderator of the effectiveness of CBT for depression. The linear "fall" reported by Johnsen and Friborg (2015) is most likely a spurious finding. [Cristea]; There was no reduction of the effect size of CBT according to the publication year [Cuijpers 2023]
    vi_tri: tóm tắt ba bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "một phân tích 70 nghiên cứu từ 1977–2014 cho thấy hiệu quả của CBT có xu hướng giảm dần theo thời gian (Johnsen và Friborg, 2015) — có thể vì các nghiên cứu đời đầu chọn bệnh nhân đẹp hơn, hoặc vì chính các nhà trị liệu đời đầu là những người giỏi nhất." Kết quả này bị phản bác bởi phân tích làm lại (Cristea 2017, cùng tạp chí) và không lặp lại trong Cuijpers 2023; trang cũ chỉ nêu một phía và thêm lời giải thích không nguồn. Sửa: nêu cả hai, bỏ lời giải thích. chỗ khó: hai phân tích tổng hợp mâu thuẫn; bên mới hơn, nhiều thử nghiệm hơn không thấy suy giảm.'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1037/bul0000015
      - https://doi.org/10.1037/bul0000062
      - https://doi.org/10.1002/wps.21069
