    trich: Key challenges included cultural factors (e.g., a lack of recognition of depression as a health-related entity amenable to professional treatment, relatively low levels of psychological mindedness useful for understanding of psychological interventions)
    vi_tri: Ngo 2014, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Thứ hai, rào cản văn hóa: một số khảo sát cho thấy kỳ thị là rào cản lớn khiến người Việt ngại tìm đến trị liệu; dù kỳ thị đang giảm ở thế hệ trẻ, việc che giấu và né tránh… vẫn phổ biến, một phần vì quan niệm đi khám tâm thần là điên." Không dẫn được khảo sát cụ thể; "kỳ thị đang giảm ở thế hệ trẻ" không nguồn. Thay bằng điều Ngo 2014 ghi nhận.'
