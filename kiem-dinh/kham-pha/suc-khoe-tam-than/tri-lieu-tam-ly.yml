  - id: n33
    cau: Phe yếu tố chung cho rằng phần lớn tác dụng đến từ những gì mọi liệu pháp đều có (liên minh trị liệu, đồng cảm, kỳ vọng); một phân tích tổng hợp thấy trị liệu thật không hơn rõ giả dược tâm lý được thiết kế tương đương về số buổi, thời lượng, người thực hiện (Baskin 2003).
    loai: phat-hien
    nguon:
      - wampold2015
      - baskin2003
    trich: 'Results indicate that comparisons between active treatments and structurally inequivalent placebos produced larger effects than comparisons between active treatments and structurally equivalent placebos: moreover, the latter comparison produced negligible effects, indicating that active treatments were not demonstrably superior to well-designed placebos. [Baskin]'
    vi_tri: Baskin 2003, tóm tắt; Wampold 2015
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Điều này gợi ý phần lớn tác dụng đến từ các yếu tố chung… liên minh trị liệu…, sự đồng cảm, và kỳ vọng sẽ khỏi." Ghi là luận điểm của một phe; thêm Baskin 2003 (bằng chứng chính của phe này về giả dược). chỗ khó.'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1037/0022-006X.71.6.973
    luot_2_ghi_chu: Chỉ đọc tóm tắt; 'người thực hiện' tương ứng 'training of therapist'.
  - id: n34
    cau: Phe kỹ thuật đặc thù chỉ ra rằng trong nhiều thử nghiệm trị liệu thật vẫn hơn giả dược tâm lý (d = 0,34 với lo âu xã hội), và với một số rối loạn lo âu, kỹ thuật như tiếp xúc có vai trò rõ.
    loai: phat-hien
    nguon:
      - powers2008
      - carpenter2018
      - craske2014
    trich: psychological placebo (d = 0.34) [Powers]; Interventions primarily using exposure strategies had larger effect sizes than those using cognitive or cognitive and behavioral techniques, though this difference did not reach significance. [Carpenter]; Exposure therapy is an effective approach for treating anxiety disorders [Craske]
    vi_tri: Powers 2008; Carpenter 2018; Craske 2014
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Phe kỹ thuật đặc thù phản bác: các nghiên cứu so sánh thường dùng phiên bản làm cho có của liệu pháp đối thủ, và hiệu quả vượt trội giả dược tâm lý (d = 0,34) chứng tỏ kỹ thuật thật vẫn đóng góp thêm." Lập luận "phiên bản làm cho có" (không thật, non-bona fide) thật ra là lập luận của phe yếu tố chung để giải thích vì sao có khác biệt nhỏ (Wampold; Elliott 2021 dùng cho so sánh CBT với liệu pháp nhân văn); trang cũ gán ngược. Sửa. "chứng tỏ" thành "chỉ ra". chỗ khó: vế "kỹ thuật như tiếp xúc có vai trò rõ" dựa trên bằng chứng chưa đủ mạnh (khác biệt trong Carpenter chưa có ý nghĩa); lượt 2 xét có nên làm mềm thêm.'
    luot_2: dung
    luot_2_nguon:
