nhan_dinh:
  - id: n1
    cau: 'Mô tả: CBT của Beck và bằng chứng từ các phân tích tổng hợp lớn; tranh luận về yếu tố chung và hiệu ứng giả dược; liệu pháp tâm động và nhân văn.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Câu mô tả nội dung trang; đã kiểm trên trang. Mô tả cũ "Bản nháp: … bằng chứng từ hàng trăm phân tích tổng hợp…": bỏ "Bản nháp"; "hàng trăm phân tích tổng hợp" đổi vì trang nói 269 phân tích (Hofmann 2012) cùng một phân tích 409 thử nghiệm. review (17/11/2026): đã kiểm trên trang và dist/ (npm run build:xem), khớp.'
    review: dung
  - id: n2
    cau: 'Hộp đầu trang: bài giới thiệu bằng chứng, không phải lời khuyên điều trị, không để tự chẩn đoán; link trang Hỗ trợ.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên trang. Chữ cũ (hộp warning) "Bản nháp đang chờ rà soát chuyên môn…"; như hồ sơ tram-cam n2 (dải chờ rà soát ở khung trang). review (17/11/2026): đã kiểm trên trang và dist/ (npm run build:xem), khớp.'
    review: dung
  - id: n3
    cau: Hai người mất ngủ vì lo âu là ví dụ giả định của chúng tôi.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'gia-dinh: ghi rõ trên trang. Đã kiểm. review (17/11/2026): đã kiểm trên trang và dist/ (npm run build:xem), khớp.'
    review: dung
  - id: n4
    cau: 'Điểm khác giữa trị liệu và lời an ủi nằm ở cấu trúc: nhà trị liệu làm việc với một mô hình về cách vấn đề được duy trì và dùng kỹ thuật có chủ đích để can thiệp vào vòng lặp; lời an ủi xoa dịu nhất thời.'
    loai: dinh-nghia
    nguon:
      - apa-dict
    trich: 'cognitive therapy: … The objective of the therapy is to identify these faulty cognitions and replace them with more adaptive ones, a process known as cognitive restructuring. The therapist takes the role of an active guide'
    vi_tri: APA Dictionary, cognitive therapy
    ket_qua: dung
    ghi_chu: Giữ chữ cũ (bỏ "cách tâm trí duy trì" thành "cách vấn đề được duy trì"). Mô tả theo mô hình nhận thức – hành vi; ví dụ trong hộp là giả định.
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1007/s10608-012-9476-1
      - https://dictionary.apa.org/psychotherapy
    luot_2_ghi_chu: Định nghĩa đối chiếu; vế 'lời an ủi xoa dịu nhất thời' là diễn giải, không cần số.
  - id: n5
    cau: 'Sự lắng nghe, quan tâm của bạn thân không vô ích: WHO xem việc giữ liên lạc, trò chuyện với người mình tin là một phần của tự chăm sóc, và sự đồng cảm là một trong các "yếu tố chung" của trị liệu; nhưng trò chuyện với bạn không thay được trị liệu khi cần.'
    loai: phat-hien
    nguon:
      - wampold2015
      - who-dep-2026
    trich: 'The evidence supports the conclusion that the common factors are important for producing the benefits of psychotherapy. … alliance, empathy, expectations || What you can do: … stay connected to friends and family … talk to someone you trust about your feelings [WHO Depression, Self-care]'
    vi_tri: Wampold 2015, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Thêm mới, để hộp không ngầm nói lời an ủi là vô ích (khớp mục Ngộ nhận). Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): viết lại theo câu đúng của lượt 2: giữ liên lạc, trò chuyện với người mình tin là tự chăm sóc (WHO); đồng cảm là một yếu tố chung của trị liệu (Wampold 2015); trò chuyện với bạn không thay được trị liệu khi cần. Bỏ ý "quan tâm của bạn thân là một phần của yếu tố chung".'
    luot_2: dung
    luot_2_nguon: [ "https://www.who.int/news-room/fact-sheets/detail/depression", "http://web.archive.org/web/20250630215110/https://onlinelibrary.wiley.com/doi/full/10.1002/wps.20238" ]
    luot_2_ghi_chu: Khớp. WHO đặt 'seek help from a healthcare provider' ngay trong danh sách tự chăm sóc, hợp với ý trò chuyện với bạn không thay được trị liệu khi cần. Wampold đọc qua bản lưu Wayback (30/6/2025) của trang Wiley; PMC4592639 chặn bot. Wampold cũng nói tương quan empathy–kết quả có thể một phần do đặc điểm người bệnh, nhưng câu trên trang không nói con số nên không cần thêm.
  - id: n6
    cau: Trị liệu tâm lý là dịch vụ tâm lý do người được đào tạo chuyên môn thực hiện, chủ yếu qua trò chuyện và tương tác, để đánh giá và giúp thay đổi phản ứng cảm xúc, lối nghĩ, hành vi gây khổ sở.
    loai: dinh-nghia
    nguon:
      - apa-dict
    trich: 'psychotherapy: any psychological service provided by a trained professional that primarily uses forms of communication and interaction to assess, diagnose, and treat dysfunctional emotional reactions, ways of thinking, and behavior patterns.'
    vi_tri: APA Dictionary, psychotherapy
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trị liệu tâm lý (psychotherapy — chữa lành bằng lời nói) là quá trình một người được đào tạo dùng các cuộc trò chuyện có cấu trúc…". Theo định nghĩa của APA; bỏ "chữa lành bằng lời nói" (không phải nghĩa của từ).'
    luot_2: dung
    luot_2_nguon:
      - https://dictionary.apa.org/psychotherapy
  - id: n7
    cau: 'Câu hỏi đặt ra: vì sao những cuộc trò chuyện lại thay đổi được cách một người nghĩ, cảm thấy và hành động?'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Câu hỏi dẫn dắt của trang, không khẳng định. Chữ cũ "làm sao những lời nói trong một căn phòng lại thay đổi được một bộ não?" đổi để không ngầm khẳng định cơ chế thần kinh (bài không có nguồn về não). Đã kiểm trên trang. review (17/11/2026): đã kiểm trên trang và dist/ (npm run build:xem), khớp.'
    review: dung
  - id: n8
    cau: Theo trường phái nhận thức – hành vi, nhiều đau khổ tâm lý được duy trì bởi các vòng lặp suy nghĩ – cảm xúc – né tránh; trị liệu nhắm vào việc chen vào vòng lặp bằng kỹ thuật có chủ đích.
    loai: phat-hien
    nguon:
      - apa-dict
      - hofmannhay2018
    trich: 'cognitive therapy: … based on the concept that emotional and behavioral problems in an individual are, at least in part, the result of maladaptive or faulty ways of thinking [APA]; Avoidance is typically considered a maladaptive behavioral response … leading to the maintenance of anxiety disorders [Hofmann & Hay]'
    vi_tri: APA Dictionary; Hofmann & Hay 2018
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Câu trả lời ngắn gọn: vì phần lớn đau khổ tâm lý được duy trì bởi các vòng lặp… Trị liệu hiệu quả là trị liệu chen vào được vòng lặp đó…". Đây là quan điểm của một trường phái, không phải câu trả lời chung: làm mềm ("Một câu trả lời, của trường phái nhận thức – hành vi: nhiều…").'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1007/s10608-012-9476-1
  - id: n9
    cau: 'Phần lớn liệu pháp thuộc một số nhóm lớn: nhận thức – hành vi, tâm động (từ truyền thống phân tâm học), nhân văn (đặt mối quan hệ và sự chấp nhận làm trung tâm), cùng các liệu pháp tích hợp.'
    loai: dinh-nghia
    nguon:
      - apa-dict
    trich: 'There are many types of psychotherapy, but generally they fall into four major categories: psychodynamic psychotherapy, cognitive therapy or behavior therapy, humanistic therapy, and integrative psychotherapy. [psychotherapy]; psychodynamic psychotherapy: those forms of psychotherapy, falling within or deriving from the psychoanalytic tradition'
    vi_tri: APA Dictionary
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hiện nay có hàng trăm thương hiệu trị liệu, nhưng hầu hết đều thuộc ba gia đình lớn…". APA Dictionary kể bốn nhóm (thêm tích hợp); bỏ "hàng trăm thương hiệu" (không nguồn định lượng).'
    luot_2: dung
    luot_2_nguon:
