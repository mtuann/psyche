  - id: n12
    cau: 'Rush và cộng sự (1977): 41 người bệnh trầm cảm ngoại trú chia ngẫu nhiên vào trị liệu nhận thức (tối đa 20 buổi trong 12 tuần) hay imipramine (tối đa 12 tuần).'
    loai: phat-hien
    nguon:
      - rush1977
    trich: Forty-one unipolar depressed outpatients were randomly assigned to individual treatment with either cognitive therapy (N = 19) or imipramine (N = 22). … For the cognitive therapy patients, the treatment protocol specified a maximum of 20 interviews over a period of 12 weeks. The pharmacotherapy patients received up to 250 mg/day of imipramine for a maximum of 12 weeks.
    vi_tri: Rush 1977, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đây là thử nghiệm ngẫu nhiên có đối chứng nghiêm ngặt đầu tiên của bất kỳ liệu pháp trò chuyện nào: bệnh nhân trầm cảm được chia ngẫu nhiên… theo dõi tối đa 12 tuần." "Đầu tiên của bất kỳ liệu pháp trò chuyện nào" sai (đã có thử nghiệm ngẫu nhiên về trị liệu tâm lý trước 1977); bỏ. Thêm cỡ mẫu. Không ghi liều thuốc trên trang (bài không nói liều).'
    luot_2: dung
    luot_2_nguon:
      - https://link.springer.com/article/10.1007/BF01173502
    luot_2_ghi_chu: 'Đọc tóm tắt trên Springer. Bài theo dõi Kovacs 1981 ghi 44 người: khác cách đếm, trang dùng 41 của bài gốc là đúng.'
  - id: n13
    cau: Cả hai nhóm đều giảm triệu chứng rõ; nhóm trị liệu nhận thức cải thiện nhiều hơn và ít người bỏ dở hơn.
    loai: phat-hien
    nguon:
      - rush1977
    trich: Both treatment groups showed statistically significant decreases in depressive symptomatology. Cognitive therapy resulted in significantly greater improvement than did pharmacotherapy on both a self-administered measure of depression … and clinical ratings … The dropout rate was significantly higher with pharmacotherapy (8 Ss) than with cognitive therapy (1 S).
    vi_tri: Rush 1977, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Liệu pháp nhận thức thắng thuốc sau 12 tuần". Viết lại sát tóm tắt.'
    luot_2: dung
    luot_2_nguon:
      - https://link.springer.com/article/10.1007/BF01173502
      - https://doi.org/10.1001/archpsyc.1981.01780260035003
  - id: n14
    cau: 'Theo dõi sau một năm (Kovacs 1981): nhóm từng trị liệu nhận thức tự đánh giá triệu chứng thấp hơn; các khác biệt khác không có ý nghĩa thống kê.'
    loai: phat-hien
    nguon:
      - kovacs1981
    trich: Self-rated depressive symptomatology was significantly lower for those who, one year earlier, had completed cognitive therapy than for those who had been in the clinical trial's pharmacotherapy cell. While there were several other interesting trends in favor of the cognitive-therapy patients, none of the between-group differences were significant.
    vi_tri: Kovacs 1981, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "một năm sau, nhóm trị liệu vẫn giữ được hiệu quả tốt hơn, trong khi nhóm thuốc có nguy cơ tái phát cao hơn khi ngưng thuốc." Quá mạnh: chỉ triệu chứng tự đánh giá khác có ý nghĩa; khác biệt về tái phát không có ý nghĩa thống kê. Sửa theo tóm tắt. chỗ khó: so sánh với thuốc.'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1001/archpsyc.1981.01780260035003
    luot_2_ghi_chu: Chỉ đọc tóm tắt; theo dõi 35 người hoàn thành.
  - id: n15
    cau: 'Đây là mẫu nhỏ; các thử nghiệm lớn hơn về sau cho thấy bức tranh khiêm tốn hơn: trong ngắn hạn, CBT và thuốc hiệu quả gần ngang nhau.'
    loai: phat-hien
    nguon:
      - cuijpers2023
    trich: The effects of CBT did not differ significantly from those of pharmacotherapies at the short term
    vi_tri: Cuijpers 2023, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Thay câu cũ "Nghiên cứu này đặt ra một chuẩn mực mới: từ đây, mọi liệu pháp tâm lý muốn được coi là có bằng chứng đều phải vượt qua bài kiểm tra thử nghiệm ngẫu nhiên có đối chứng" (không nguồn) và lời dẫn "tổng quan của Quỹ Lasker" (không mở được).'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1002/wps.21069
    luot_2_ghi_chu: 'Cuijpers 2023: chỉ đọc được tóm tắt (PubMed Central không cho toàn văn máy đọc; Wiley, kho VU và TUM chặn).'
  - id: n16
    cau: Hofmann và cộng sự (2012) tìm thấy 269 phân tích tổng hợp về CBT và xem xét mẫu đại diện 106 phân tích, bao phủ nhiều vấn đề (lo âu, trầm cảm, rối loạn ăn uống, mất ngủ, đau mạn tính…).
    loai: so-lieu
    nguon:
      - hofmann2012
    trich: 'We identified 269 meta-analytic studies and reviewed of those a representative sample of 106 meta-analyses examining CBT for the following problems: substance use disorder, schizophrenia …, depression and dysthymia, …, anxiety disorders, somatoform disorders, eating disorders, insomnia, … chronic pain and fatigue'
    vi_tri: Hofmann 2012, tóm tắt
    ket_qua: dung
    ghi_chu: 'Giữ chữ cũ (diễn đạt lại "rà soát các cơ sở dữ liệu"). Thêm định nghĩa phân tích tổng hợp: "nghiên cứu gộp kết quả của nhiều nghiên cứu để ước tính hiệu quả chung".'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1007/s10608-012-9476-1
    luot_2_ghi_chu: Toàn văn PMC3584580.
  - id: n17
    cau: Bằng chứng mạnh nhất ủng hộ CBT cho rối loạn lo âu, rối loạn dạng cơ thể, bulimia, kiểm soát cơn giận và căng thẳng nói chung.
    loai: phat-hien
    nguon:
      - hofmann2012
    trich: The strongest support exists for CBT of anxiety disorders, somatoform disorders, bulimia, anger control problems, and general stress.
    vi_tri: Hofmann 2012, tóm tắt
    ket_qua: dung
    ghi_chu: Giữ. "chứng cuồng ăn (bulimia)" đổi thành "chứng ăn uống vô độ rồi tìm cách thải ra (bulimia)" cho đúng nghĩa.
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1007/s10608-012-9476-1
  - id: n18
    cau: Trong 11 tổng quan có so sánh tỉ lệ đáp ứng, CBT cao hơn nhóm so sánh ở 7, chỉ một tổng quan thấy CBT thấp hơn.
    loai: so-lieu
    nguon:
      - hofmann2012
    trich: Eleven studies compared response rates between CBT and other treatments or control conditions. CBT showed higher response rates than the comparison conditions in 7 of these reviews and only one review reported that CBT had lower response rates than comparison treatments.
    vi_tri: Hofmann 2012, tóm tắt
    ket_qua: da-sua
    ghi_chu: Thêm vế "chỉ một tổng quan thấy CBT thấp hơn".
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1007/s10608-012-9476-1
  - id: n19
    cau: Các tác giả kết luận nền tảng bằng chứng của CBT rất mạnh, nhưng vẫn cần thêm thử nghiệm ngẫu nhiên, và chưa có phân tích tổng hợp nào riêng cho các nhóm như dân tộc thiểu số hay người thu nhập thấp.
    loai: phat-hien
    nguon:
      - hofmann2012
    trich: In general, the evidence-base of CBT is very strong. However, additional research is needed to examine the efficacy of CBT for randomized-controlled studies. Moreover, except for children and elderly populations, no meta-analytic studies of CBT have been reported on specific subgroups, such as ethnic minorities and low income samples.
    vi_tri: Hofmann 2012, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nền tảng bằng chứng của CBT rất vững — dù các tác giả cũng lưu ý vẫn cần thêm nghiên cứu chất lượng cao". Thêm ý về nhóm dân tộc thiểu số, thu nhập thấp (liên quan mục Ở Việt Nam).'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1007/s10608-012-9476-1
  - id: n20
    cau: 'Theo các tác giả, Cuijpers và cộng sự (2023) là phân tích tổng hợp lớn nhất từng có về một loại liệu pháp tâm lý cho một rối loạn: 409 thử nghiệm ngẫu nhiên, 52.702 người bệnh trầm cảm, so CBT với đối chứng (chăm sóc thông thường, danh sách chờ), liệu pháp khác, thuốc, điều trị kết hợp.'
    loai: so-lieu
    nguon:
      - cuijpers2023
    trich: We included 409 trials (518 comparisons) with 52,702 patients, thus conducting the largest meta-analysis ever of a specific type of psychotherapy for a mental disorder.
    vi_tri: Cuijpers 2023, tóm tắt
    ket_qua: da-sua
    ghi_chu: Thêm "theo các tác giả" (lời tự nhận của bài).
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1002/wps.21069
    luot_2_ghi_chu: 'Cuijpers 2023: chỉ đọc được tóm tắt (PubMed Central không cho toàn văn máy đọc; Wiley, kho VU và TUM chặn).'
  - id: n21
    cau: 'CBT hơn nhóm đối chứng ở mức vừa đến lớn (g = 0,79); chỉ tính nghiên cứu ít nguy cơ sai lệch: g = 0,60; sau hiệu chỉnh sai lệch xuất bản: g = 0,47.'
    loai: so-lieu
    nguon:
      - cuijpers2023
    trich: 'The main effect size indicating the overall difference between CBT and control conditions after treatment was g=0.79 (95% CI: 0.70‐0.89) … The effect size was smaller for studies with low risk of bias (g=0.60; 95% CI: 0.49‐0.71) and after adjusting for publication bias (g=0.47, 95% CI: 0.35‐0.59 using the trim and fill procedure).'
    vi_tri: Cuijpers 2023, Kết quả, bảng 2
    ket_qua: dung
    ghi_chu: 'Số khớp toàn văn (bảng 2: 0,79; 0,60; 0,47, phương pháp trim and fill). Hình cuijpers-funnel (chép nguyên từ trang cũ) dùng cùng số. Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): lượt 2 khong-chac vì không mở được toàn văn. Toàn văn Cuijpers 2023 (bản PMC9840507 lưu ở Internet Archive ngày 29/6/2023; lượt 1 đã đọc, nay đọc lại): bảng 2 "Only low risk of bias 90 0.60 (0.49‐0.71) … Publication bias correction 349 0.47 (0.35‐0.59)", chú thích bảng "The reported publication bias correction is that using the trim and fill procedure"; Kết quả: "The response rate was 0.42 (95% CI: 0.39‐0.45) in CBT and 0.19 (95% CI: 0.18‐0.21) in the control conditions, which resulted in a RR of 2.13 (95% CI: 1.96‐2.32) and a NNT of 4.7 (95% CI: 4.0‐5.5)"; bảng 3: tỉ lệ đáp ứng ước tính ở 228/238 so sánh. NNT 4,7 do bài tính từ RR gộp (phương pháp: NNT = 1/hiệu số nguy cơ, gộp riêng), không phải 1/(0,42 − 0,19) ≈ 4,3 từ hai tỉ lệ gộp riêng; giữ số của bài. Số 0,47 là trim and fill (chỉ hiệu chỉnh sai lệch xuất bản), không phải gộp cả lọc nguy cơ sai lệch như một nguồn bậc 3 viết. Giữ các số. Review (17/11/2026): 0,47 là phép trim and fill trên mọi so sánh (349), không cộng dồn với phép chỉ tính nghiên cứu ít sai lệch (0,60): trang thêm "một phép tính riêng, không cộng dồn với phép lọc trước"; hình cuijpers-funnel đổi "qua ba lần lọc" (aria-label, chú thích) thành "theo ba cách tính" cùng lý do.'
    luot_2: khong-chac
    luot_2_ghi_chu: 'g = 0,79 đúng. g = 0,60 (ít nguy cơ sai lệch) và g = 0,47 (sau hiệu chỉnh sai lệch xuất bản) không xác nhận được. Không mở được toàn văn Cuijpers 2023 (chỉ tóm tắt); tóm tắt không có 42%/19%, NNT, g = 0,60, g = 0,47. Chỉ nguồn bậc 3 nhắc các số này và chúng không khớp nhau: Mad in America ghi 42% so với 19% và 0,47 ''sau khi tính sai lệch xuất bản và nghiên cứu nguy cơ sai lệch cao'' (không phải chỉ hiệu chỉnh xuất bản), và NNT 3,6 (có lẽ cho thuyên giảm); Mental Elf ghi chỉ 9 so sánh ít nguy cơ sai lệch, không ghi số. Cần review mở toàn văn (bảng 1–2) để chốt.'
  - id: n22
    cau: '42% người được CBT đáp ứng (giảm ít nhất một nửa triệu chứng; tỉ lệ phần lớn ước tính từ điểm trung bình của từng thử nghiệm), so với 19% ở nhóm đối chứng (NNT = 4,7: cứ khoảng 5 người được điều trị thì có thêm 1 người đáp ứng).'
    loai: so-lieu
    nguon:
      - cuijpers2023
    trich: A total of 42% of patients receiving CBT responded to treatment, while the response rate was only 19% in control groups, with a NNT of 4.7 in favor of CBT.
    vi_tri: Cuijpers 2023, Thảo luận
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(cứ khoảng 5 người điều trị thì 1 người hưởng lợi thêm — NNT = 4,7)". "Hưởng lợi" đổi thành "đáp ứng" cho sát định nghĩa của bài (đáp ứng = giảm 50% triệu chứng). Hình (chép nguyên) vẫn ghi "hưởng lợi thêm"; không sửa hình (HINH_DA_SUA), lượt 2 xét có cần sửa không. Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): lượt 2 khong-chac. Toàn văn Cuijpers 2023 (bản PMC9840507 lưu ở Internet Archive ngày 29/6/2023; lượt 1 đã đọc, nay đọc lại): bảng 2 "Only low risk of bias 90 0.60 (0.49‐0.71) … Publication bias correction 349 0.47 (0.35‐0.59)", chú thích bảng "The reported publication bias correction is that using the trim and fill procedure"; Kết quả: "The response rate was 0.42 (95% CI: 0.39‐0.45) in CBT and 0.19 (95% CI: 0.18‐0.21) in the control conditions, which resulted in a RR of 2.13 (95% CI: 1.96‐2.32) and a NNT of 4.7 (95% CI: 4.0‐5.5)"; bảng 3: tỉ lệ đáp ứng ước tính ở 228/238 so sánh. NNT 4,7 do bài tính từ RR gộp (phương pháp: NNT = 1/hiệu số nguy cơ, gộp riêng), không phải 1/(0,42 − 0,19) ≈ 4,3 từ hai tỉ lệ gộp riêng; giữ số của bài. Số 0,47 là trim and fill (chỉ hiệu chỉnh sai lệch xuất bản), không phải gộp cả lọc nguy cơ sai lệch như một nguồn bậc 3 viết. Giữ các số. Thêm vào trang: tỉ lệ đáp ứng "phần lớn ước tính từ điểm trung bình của từng thử nghiệm" và định nghĩa đáp ứng (giảm ít nhất một nửa triệu chứng: "response (i.e., a 50% reduction of depressive symptoms compared to baseline)"). Hình cuijpers-funnel sửa cho khớp ("có thêm 1 người đáp ứng"; thêm vào HINH_DA_SUA).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1002/wps.21069", "https://www.constantinyvesplessen.com/pdfs/Cuijpers%20et%20al.%20-%202023%20-%20Cognitive%20behavior%20therapy%20vs.%20control%20conditions,.pdf" ]
    luot_2_ghi_chu: "Khớp từng số. 228/238 nhóm CBT có tỉ lệ ước tính, nên 'phần lớn ước tính từ điểm trung bình' đúng (ước tính từ trung bình đầu, cuối, độ lệch chuẩn và cỡ mẫu). Đọc toàn văn bản PDF của nhà xuất bản (có dòng tải từ Wiley) do một đồng tác giả (Plessen) đăng; Wiley và PMC chặn bot. Bối cảnh: NNT 4,7 cao lên 8,0 khi hiệu chỉnh sai lệch xuất bản và 6,3 khi chỉ tính nghiên cứu ít sai lệch."
