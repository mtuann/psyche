  - id: n76
    cau: 'Khung cũ "Đã bị bác bỏ: trị liệu tâm lý chỉ là hiệu ứng giả dược / nói chuyện an ủi".'
    loai: nhan
    vi_tri: khung "Mức độ chắc chắn" của trang cũ
    nhan: bac-bo
    co_so:
      - (đã bỏ)
    ly_do: Đã bỏ khỏi trang.
    ket_qua: da-bo
    ghi_chu: 'Bỏ khung. Thân cũ: "Nếu chỉ là giả dược, trị liệu thật đã không vượt trội giả dược tâm lý và giả dược thuốc một cách nhất quán…". Không đạt thước đo Đã bị bác bỏ: Baskin 2003 (phân tích tổng hợp) thấy trị liệu thật không hơn rõ giả dược tâm lý được thiết kế tương đương về cấu trúc, và Wampold 2005 (cùng nhóm) viết "when properly designed, psychological placebos are as effective as accepted psychotherapies"; nên câu "trị liệu thật vượt trội giả dược một cách nhất quán" sai. Ý "trị liệu có tác dụng thật so với không điều trị" đã nằm ở khung Vững chắc (n29); câu hỏi trị liệu hơn giả dược bao nhiêu nằm ở khung Đang tranh cãi (n35). chỗ khó: bỏ một nhãn. Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): lượt 2 qua-manh cho khung cũ: đã kiểm trang (grep "bac-bo", "Đã bị bác bỏ" 17/11/2026): khung đã bỏ hẳn; ý Vững chắc (n29) và Đang tranh cãi (n35) đúng như câu đúng của lượt 2. Giữ da-bo.'
    luot_2: qua-manh
    luot_2_nguon:
      - https://doi.org/10.1037/0022-006X.71.6.973
      - https://dare.uva.nl/id/7886da1f-5790-4005-8ecb-747aca121038
      - https://doi.org/10.1146/annurev-clinpsy-050718-095424
    luot_2_ghi_chu: 'câu đúng: Vững chắc: trị liệu tâm lý hiệu quả hơn hẳn không điều trị. Đang tranh cãi: bao nhiêu phần hiệu quả nhờ kỹ thuật riêng, bao nhiêu nhờ những gì giả dược tâm lý cũng có.; Nhãn ''Đã bị bác bỏ'' không đạt thước đo: các kiểm tra đủ mạnh không liên tục thất bại; với giả dược tương đương cấu trúc, trị liệu thật không hơn rõ (Baskin 2003). Chính trang xếp câu này vào Đang tranh cãi (n35). Khung cũ phải bỏ hay đổi nhãn.'
  - id: n77
    cau: 'Các con số so CBT với thuốc là kết quả gộp từ các thử nghiệm, không phải lời khuyên cho ai cụ thể. Đừng tự ý ngừng hay đổi thuốc: mọi thay đổi về thuốc hãy bàn với bác sĩ kê đơn.'
    loai: loi-khuyen
    nguon:
      - nice-ng222
    trich: '1.4.12 Advise people taking antidepressant medication to talk with the person who prescribed their medication … [NICE NG222; trích như tram-cam n25, n40]'
    vi_tri: NICE NG222 1.4.12
    ket_qua: da-sua
    ghi_chu: 'Kế hoạch nâng cấp S5 (20/11/2026): thêm mới, đoạn riêng ngay sau đoạn Kết quả của mục Cuijpers và cộng sự (2023), cạnh câu «hơn thuốc ở 6–12 tháng (g = 0,34…)» (n24), để câu ấy không bị đọc như lời khuyên bỏ thuốc (kiem-sinh-hoc-cam-xuc.md [A][CG], phản biện P7). Vế đầu là câu về cách đọc số của trang; vế sau là lời rào, cùng ý với tram-cam n25, n40 (dùng lại nguồn nice-ng222 đã có trong hồ sơ này). Không nói thêm lý do (triệu chứng ngừng thuốc) để không thêm khẳng định mới vào trang.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nice.org.uk/guidance/ng222/chapter/Recommendations" ]
    luot_2_ghi_chu: "«NICE 1.4.12: Advise people taking antidepressant medication to talk with the person who prescribed their medication… if they want to stop taking it…; 1.4.13 stopping abruptly… may have withdrawal symptoms. An toàn: đây là lời nhắc theo hướng an toàn (bàn với bác sĩ), không khuyên dùng hay ngừng thuốc: đạt chuẩn mục 5.»"
  - id: n78
    cau: 'Đây không phải lý do để tự ý ngừng hay đổi thuốc: mọi thay đổi về thuốc hãy bàn với bác sĩ kê đơn (cuối ngộ nhận «Hết liệu trình là khỏi hẳn…», sau câu CBT tốt hơn thuốc ở 6–12 tháng).'
