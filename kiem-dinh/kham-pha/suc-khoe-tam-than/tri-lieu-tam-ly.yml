  - id: n69
    cau: 'Hết liệu trình không có nghĩa khỏi hẳn: không phải ai được trị liệu cũng đáp ứng, nhiều người cần thêm phương án; người đã đỡ cũng có thể tái phát; NICE khuyên các liệu trình phòng tái phát (như CBT nhóm) tập trung rèn kỹ năng để giữ ổn định; với trầm cảm, có bằng chứng (từ ít thử nghiệm, không vững trong mọi phân tích độ nhạy) rằng hiệu quả của CBT ở 6–12 tháng sau điều trị tốt hơn thuốc.'
    loai: phat-hien
    nguon:
      - cuijpers2023
      - nice-ng222
    trich: 'A total of 42% of patients receiving CBT responded to treatment, while the response rate was only 19% in control groups, with a NNT of 4.7 in favor of CBT. CBT was significantly more effective than other psychotherapies, but the difference was small (g=0.06; 95% CI: 0-0.12) and became non-significant in most sensitivity analyses. The effects of CBT did not differ significantly from those of pharmacotherapies at the short term, but were significantly larger at 6-12 month follow-up (g=0.34; 95% CI: 0.09-0.58), although the number of trials was small, and the difference was not significant in all sensitivity analyses. Combined treatment was more effective than pharmacotherapies alone … but it was not more effective than CBT alone at either time point. [Cuijpers]; discuss with people who have remitted … whether they wish to continue with their psychological therapy for relapse prevention [NICE 1.8.8] || 1.8.6 For people starting group CBT or MBCT for relapse prevention, offer a course of therapy with an explicit focus on the development of relapse prevention skills and what is needed to stay well. [NICE NG222]'
    vi_tri: Cuijpers 2023; NICE NG222 1.8
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…58% còn lại cần thêm phương án… đó là lý do CBT chú trọng dạy kỹ năng tự xử lý để phòng tái phát, và vì sao hiệu quả dài hạn của nó hơn thuốc." Làm rõ "từ ít thử nghiệm" (g = 0,34 không vững trong mọi phân tích độ nhạy); "58%" thành "phần lớn còn lại" (58% là phép trừ của trang, không có trong bài). chỗ khó: so sánh với thuốc. Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): vế phòng tái phát nay dẫn NICE NG222 1.8.6–1.8.7 (mở được, toàn văn); 42% và 6–12 tháng như n22, n24. Câu trên trang đổi "CBT dạy kỹ năng tự xử lý một phần là để phòng tái phát" thành "Hướng dẫn NICE khuyên các liệu trình phòng tái phát (như CBT nhóm) tập trung rèn kỹ năng để giữ ổn định". Review (17/11/2026): trang viết "hiệu quả của nó", đọc như hiệu quả của liệu trình phòng tái phát (sai: g = 0,34 của Cuijpers 2023 là CBT cấp so với thuốc); đổi thành "hiệu quả của CBT ở 6–12 tháng sau điều trị", thêm "không vững trong mọi phân tích độ nhạy" theo gợi ý lượt 2 bổ sung. Kế hoạch nâng cấp S5 (20/11/2026): chữ của nhận định không đổi; cuối gạch đầu dòng thêm lời rào về thuốc (n78). Đưa vào danh sách lượt 2 S5 như nhận định cùng đoạn. Lô sửa nhỏ sau S5 (chủ repo quyết 20/11/2026): bỏ «42% đáp ứng nghĩa là phần lớn còn lại…» (lượt 2 S5 khong-chac).'
    luot_2: dung
    luot_2_nguon: [ "https://www.nice.org.uk/guidance/ng222/chapter/Recommendations", "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1002/wps.21069&resultType=core&format=json" ]
    luot_2_ghi_chu: "NICE 1.8.6: CBT nhóm hay MBCT phòng tái phát «with an explicit focus on the development of relapse prevention skills and what is needed to stay well» (khuyến nghị 1.8.5 nhắm người đã thuyên giảm có nguy cơ tái phát cao; câu viết chung hơn một chút nhưng không sai). Tóm tắt Cuijpers 2023: CBT hơn thuốc ở 6–12 tháng (g = 0,34) «although the number of trials was small, and the difference was not significant in all sensitivity analyses», khớp phần rào đón. Trang kèm câu không tự ý ngừng hay đổi thuốc ngay sau: tốt cho mục 5."
