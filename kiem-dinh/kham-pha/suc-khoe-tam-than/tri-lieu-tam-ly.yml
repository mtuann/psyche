  - id: n42
    cau: 'Mô hình bối cảnh của Wampold (một người ủng hộ yếu tố chung): ba con đường là mối quan hệ thật, kỳ vọng (từ lời giải thích hợp lý về vấn đề và cách điều trị), và các hành động có lợi cho sức khỏe mà liệu pháp khuyến khích.'
    loai: phat-hien
    nguon:
      - wampold2015
    trich: 'The three pathways of the contextual model involve: a) the real relationship, b) the creation of expectations through explanation of disorder and the treatment involved, and c) the enactment of health promoting actions.'
    vi_tri: Wampold 2015, The contextual model
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ba thứ quyết định phần lớn kết quả: liên minh trị liệu…, kỳ vọng…, và một nghi thức chữa lành có ý nghĩa (một lời giải thích mạch lạc… + các bước hành động cụ thể)." Sửa theo đúng ba con đường của bài; bỏ "quyết định phần lớn kết quả".'
    luot_2: dung
    luot_2_nguon:
      - https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11303923/
      - https://doi.org/10.1002/wps.20238
    luot_2_ghi_chu: Không mở được toàn văn Wampold 2015 (PMC chặn bằng captcha, Wiley 403; chỉ có tóm tắt). Ba con đường xác nhận qua bài 2024 của chính nhóm Wampold; cách gọi đường thứ ba là 'hành động có lợi cho sức khỏe' khớp mô tả thường gặp của mô hình bối cảnh nhưng chưa đọc được chữ gốc 2015.
  - id: n43
    cau: 'Theo tổng quan của Wampold: tương quan giữa liên minh trị liệu và kết quả khoảng r = 0,27; khác biệt giữa các nhà trị liệu (d ≈ 0,35) lớn hơn khác biệt thường gặp giữa các liệu pháp (tối đa khoảng d = 0,20).'
    loai: so-lieu
    nguon:
      - wampold2015
    trich: The most recent meta-analysis of the alliance included nearly 200 studies involving over 14,000 patients and found that the aggregate correlation between alliance and outcome was about .27, which is equivalent to a Cohen's d of 0.57 … A meta-analysis of therapist effects in clinical trials found modest therapist effects (d=0.35, n=29) … if they do find differences among various types of treatment, typically find at most differences of approximately d=0.20
    vi_tri: Wampold 2015, mục Alliance, Therapist effects, Treatment differences
    ket_qua: da-sua
    ghi_chu: 'Thêm mới, thay câu cũ ở mục Áp dụng "Một nhà trị liệu giỏi với phương pháp thường thường tốt hơn một nhà trị liệu dở với phương pháp xịn" (n55). chỗ khó: số do một phe tổng hợp. Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): lượt 2 khong-chac cho d ≈ 0,35. Toàn văn Wampold 2015 (bản PMC4592639 lưu ở Internet Archive ngày 24/8/2024), mục Therapist effects: "A meta-analysis of therapist effects in clinical trials found modest therapist effects (d=0.35, n=29; see Figure 1)". Số 0,35 là của thử nghiệm lâm sàng (Hình 1); bài nói thêm ở bối cảnh tự nhiên khác biệt lớn hơn. Giữ số, ghi đúng là "trong các thử nghiệm lâm sàng" ở hồ sơ.'
    luot_2: khong-chac
    luot_2_nguon:
      - https://doi.org/10.1037/a0022186
      - https://doi.org/10.1037/pst0000172
      - https://doi.org/10.1037/0033-2909.122.3.203
    luot_2_ghi_chu: 'r ≈ 0,27 và ''tối đa khoảng d = 0,20'' xác nhận qua nguồn gốc mà Wampold dẫn. d ≈ 0,35 cho khác biệt giữa nhà trị liệu không xác nhận được: không mở được toàn văn Wampold 2015, và theo trí nhớ (chưa kiểm) bảng của bài có thể ghi một số khác (khoảng 0,55). Cần review đọc bảng 1 của Wampold 2015.'
  - id: n44
    cau: Điều này có thể giải thích vì sao các trường phái cho kết quả gần như nhau; bằng chứng về liên minh trị liệu chủ yếu là tương quan, chưa chứng minh nhân quả.
    loai: phat-hien
    nguon:
      - wampold2015
    trich: There have been a number of criticisms of the conclusion that alliance is an important factor in psychotherapy, most of which have focused on the correlational nature of alliance research.
    vi_tri: Wampold 2015, mục Alliance
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Điều này giải thích vì sao…: chúng khác vỏ kỹ thuật nhưng chia sẻ chung ruột". Làm mềm "có thể giải thích"; thêm giới hạn tương quan. (Wampold cho rằng các phê bình này không làm giảm tầm quan trọng của liên minh; trang nêu giới hạn một cách trung lập.)'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1146/annurev-clinpsy-050718-095424
  - id: n45
    cau: Liệu pháp tâm động bắt nguồn từ truyền thống phân tâm học, chú trọng động lực và cảm xúc ít được ý thức, giúp hiểu khuôn mẫu lặp lại trong các mối quan hệ; nhiều dạng hiện đại là trị liệu ngắn hạn.
    loai: dinh-nghia
    nguon:
      - apa-dict
      - shedler2010
    trich: 'psychodynamic psychotherapy: those forms of psychotherapy, falling within or deriving from the psychoanalytic tradition, that view individuals as reacting to unconscious forces … [APA]; short-term (< 40 hours) psychodynamic therapy [Shedler, kể Abbass 2006]'
    vi_tri: APA Dictionary; Shedler 2010 tr. 100–101
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thay vì nằm trên ghế sofa nhiều năm, phiên bản hiện đại thường ngắn hạn (dưới 40 buổi), tập trung vào các mẫu hình quan hệ lặp lại (ví dụ: luôn chọn người yêu coi thường mình — có thể vì đang vô thức diễn lại mối quan hệ với cha mẹ)". "Dưới 40 buổi" sai đơn vị (Abbass 2006: dưới 40 giờ); bỏ ví dụ người yêu (có thể đọc như diễn giải tâm lý cho cá nhân) và "thường" (không có số liệu tỉ lệ). Shedler mô tả các đặc điểm của trị liệu tâm động (tr. 99–100): lượt 2 đối chiếu "khuôn mẫu lặp lại trong quan hệ".'
    luot_2: dung
    luot_2_nguon:
      - https://dictionary.apa.org/psychodynamic-psychotherapy
      - https://www.apa.org/pubs/journals/releases/amp-65-2-98.pdf
      - https://doi.org/10.1002/14651858.CD004687.pub3
  - id: n46
    cau: 'Shedler (2010) dẫn tổng quan Cochrane của Abbass và cộng sự (2006) về trị liệu tâm động ngắn hạn (dưới 40 giờ): cải thiện so với đối chứng 0,97, tăng lên 1,51 khi đánh giá hơn 9 tháng sau trị liệu; chính các tác giả tổng quan dặn đọc dè dặt vì mỗi loại rối loạn có ít nghiên cứu, dị biệt lớn, kết quả không luôn giữ trong phân tích độ nhạy.'
    loai: so-lieu
    nguon:
      - shedler2010
      - abbass2006
    trich: included 23 randomized controlled trials of 1,431 patients (Abbass, Hancock, Henderson, & Kisely, 2006). The studies compared patients with a range of common mental disorders who received short-term (< 40 hours) psychodynamic therapy with controls (wait list, minimal treatment, or "treatment as usual") and yielded an overall effect size of 0.97 for general symptom improvement. The effect size increased to 1.51 when the patients were assessed at long-term follow-up (> 9 months posttreatment). || However, only a small number of studies contributed data for each category of disorder, there was significant heterogeneity between studies, and results were not always maintained in sensitivity analyses. … these findings should be interpreted with caution. [Abbass 2006, tóm tắt]
    vi_tri: Shedler 2010, tr. 100–101
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Shedler (2010) tổng hợp 8 phân tích tổng hợp và thấy hiệu quả tương đương các liệu pháp có bằng chứng khác — … tăng lên sau khi kết thúc trị liệu (từ 0,97 lên 1,51 ở lần theo dõi sau 9 tháng)". Số 0,97 và 1,51 là của Abbass 2006 mà Shedler kể lại (theo X kể lại); "sau 9 tháng" thành "hơn 9 tháng". Bỏ "tổng hợp 8 phân tích tổng hợp" (Shedler là bài tổng quan tường thuật, không gộp số). Bỏ "như thể trị liệu đã khởi động một quá trình tự thay đổi" (diễn giải không nguồn). Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): theo ghi chú lượt 2: thêm câu tổng quan Cochrane tự dặn đọc dè dặt.'
    luot_2: dung
    luot_2_nguon: [ "https://www.briancollinson.ca/wp-content/uploads/2010/06/Shedler-Efficacy-of-Psychodynamic-Psychotherapy-T-LAP-10-9-20091.pdf", "https://pubmed.ncbi.nlm.nih.gov/17054212/" ]
    luot_2_ghi_chu: Khớp. Bản Shedler đọc được là bản tác giả 'in press, revised 10-9-2009' ('may not exactly replicate the final version'); bản APA không tải được. Shedler ghi chú (chú thích 7) rằng các con số lấy từ mô hình hiệu ứng ngẫu nhiên đã bỏ một nghiên cứu ngoại lai. Abbass 2006 đã có bản cập nhật 2014 (CD004687.pub4); câu chỉ nói điều Shedler dẫn nên không sai.
  - id: n47
    cau: Shedler cho rằng hiệu quả của liệu pháp tâm động tương đương các liệu pháp "có bằng chứng" khác; cách ông diễn giải bị một số nhà nghiên cứu phản biện.
    loai: phat-hien
    nguon:
      - shedler2010
      - mckay2011
    trich: Effect sizes for psychodynamic therapy are as large as those reported for other therapies that have been actively promoted as "empirically supported" and "evidence based." [Shedler]; Comments on the original article … [McKay 2011, bình luận]; The atypical method used to compute this effect size may provide an inflated estimate of efficacy (for discussion, see Thombs, Bassel, & Jewett, 2009) [Shedler, chú thích 8]
    vi_tri: Shedler 2010, tóm tắt và chú thích 8; McKay 2011
    ket_qua: da-sua
    ghi_chu: 'Thêm vế phản biện. chỗ khó: tóm tắt McKay 2011 nghiêng về đồng tình phần lớn với Shedler (phản biện chủ yếu về cơ chế); phản biện về cách tính hiệu ứng là Thombs 2009 (Shedler tự dẫn). Lượt 2 xét chọn nguồn phản biện rõ hơn.'
    luot_2: dung
    luot_2_nguon:
      - https://www.apa.org/pubs/journals/releases/amp-65-2-98.pdf
      - https://pubmed.ncbi.nlm.nih.gov/20141265/
  - id: n48
    cau: Phân tích tổng hợp năm 2015 về trầm cảm (54 nghiên cứu) thấy trị liệu tâm động ngắn hạn hiệu quả hơn nhóm đối chứng và không khác các liệu pháp tâm lý khác.
    loai: phat-hien
    nguon:
      - driessen2015
    trich: 54 studies (33 randomized clinical trials) totaling 3946 subjects were included. STPP was significantly more effective than control conditions at post-treatment on depression … (d=0.49 to 0.69) … No significant differences were found between individual STPP and other psychotherapies at post-treatment (d=-0.14) and follow-up (d=-0.06)
    vi_tri: Driessen 2015, tóm tắt
    ket_qua: da-sua
    ghi_chu: Thêm mới, để phần tâm động có một phân tích tổng hợp riêng (không chỉ qua Shedler).
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1016/j.cpr.2015.07.004
  - id: n49
    cau: 'Liệu pháp lấy thân chủ làm trung tâm do Carl Rogers phát triển từ đầu thập niên 1940: nhà trị liệu không chỉ đạo mà tạo điều kiện bằng thấu hiểu đồng cảm, chấp nhận, tôn trọng để thân chủ tự khám phá, thay đổi.'
    loai: dinh-nghia
    nguon:
      - apa-dict
    trich: 'client-centered therapy: a form of psychotherapy developed by Carl Rogers in the early 1940s. According to Rogers, an orderly process of client self-discovery and actualization occurs in response to the therapist''s consistent empathic understanding of, acceptance of, and respect for the client''s frame. … nondirective'
    vi_tri: APA Dictionary, client-centered therapy
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Do Carl Rogers khai sinh, trường phái này cho rằng con người vốn có xu hướng tự hoàn thiện, và đau khổ nảy sinh khi ta phải đeo mặt nạ để được chấp nhận. … ba điều kiện: chấp nhận vô điều kiện, đồng cảm sâu sắc, và chân thành." Viết lại theo APA Dictionary (thêm mốc 1940s); bỏ "đeo mặt nạ" (diễn giải không nguồn).'
    luot_2: dung
    luot_2_nguon:
      - https://dictionary.apa.org/client-centered-therapy
  - id: n50
    cau: 'Elliott và cộng sự (2021): phân tích tổng hợp 91 nghiên cứu (2009–2018) về liệu pháp nhân văn – trải nghiệm: trước–sau d = 0,86; hơn nhóm không trị liệu 0,88; tương đương các liệu pháp khác −0,08; CBT có lợi thế nhỏ chưa rõ ràng (−0,26), nhưng nghiên cứu phần lớn do nhóm CBT thực hiện; với trầm cảm, lo âu kết quả lẫn lộn hơn.'
    loai: so-lieu
    nguon:
      - elliott2021
    trich: A key part of this review is a meta-analysis of 91 studies of the effectiveness/efficacy of HEPs, published between 2009 and 2018 … (1) HEPs were associated with large pre-post client change (d = .86). (2) In controlled studies, clients in HEPs generally showed large gains relative to clients who received no therapy (.88). (3) In comparative outcome studies, HEPs in general were statistically and clinically equivalent in effectiveness to other therapies (-.08). (4) Overall, CBT appeared to have an equivocal advantage over HEPs (-.26). However, these studies were overwhelmingly delivered by CBT researchers in largely non-bona fide versions of HEPs as comparison conditions. … Findings were more mixed for depression and anxiety.
    vi_tri: Elliott 2021, tóm tắt (Strathprints)
    ket_qua: da-sua
    ghi_chu: Chữ cũ có 0,86, 0,88, −0,08 và "kết quả với trầm cảm và lo âu thì lẫn lộn hơn"; thêm kết quả so với CBT (−0,26) và giới hạn mà chính tác giả nêu, để không chỉ nêu phía thuận.
    luot_2: dung
    luot_2_nguon:
      - https://strathprints.strath.ac.uk/74362
    luot_2_ghi_chu: Tóm tắt ở kho Strathclyde; tóm tắt nêu phần lớn so sánh do nhà nghiên cứu CBT thực hiện, thường dùng bản HEP không chính quy.
  - id: n51
    cau: Trong thử nghiệm thuốc, giả dược là viên không hoạt chất mà người bệnh có thể không biết; trong trị liệu, khó có "trị liệu giả" mà thân chủ không nhận ra, và giả dược tâm lý cũng chứa yếu tố chung có thể có tác dụng thật.
    loai: phat-hien
    nguon:
      - baskin2003
      - wampold2015
    trich: Placebo treatments in psychotherapy cannot adequately control for all common factors, which thereby attenuates their effects vis-a-vis active treatments.
    vi_tri: Baskin 2003, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "không thể giả vờ trị liệu mà thân chủ không biết: ngay cả nhóm giả dược tâm lý… cũng chứa đầy yếu tố chung có tác dụng thật". Làm mềm "không thể" thành "khó", "có tác dụng thật" thành "có thể có tác dụng thật".'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1037/0022-006X.71.6.973
  - id: n52
    cau: 'Áp dụng 1: liên minh trị liệu là một trong những yếu tố dự báo kết quả được nghiên cứu nhiều nhất; sau vài buổi đầu, tự hỏi có được lắng nghe không phán xét, có cách hiểu mạch lạc và kế hoạch rõ ràng không; bằng cấp, giấy phép vẫn quan trọng; không hợp thì tìm người khác là bình thường. (Chip Khá vững.)'
    loai: loi-khuyen
    nguon:
      - wampold2015
    trich: Alliance is the most researched common factor. … the aggregate correlation between alliance and outcome was about .27
    vi_tri: Wampold 2015, mục Alliance
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (tiêu đề): "Chọn nhà trị liệu bằng cảm giác làm việc chung, không chỉ bằng bằng cấp"; thân: "Vì yếu tố chung… giải thích phần lớn hiệu quả, buổi gặp đầu tiên rất đáng để đánh giá… Một nhà trị liệu giỏi với phương pháp thường thường tốt hơn một nhà trị liệu dở với phương pháp xịn." Bỏ "giải thích phần lớn hiệu quả" (đang tranh cãi, n35) và câu so sánh (không nguồn trực tiếp); nói rõ bằng cấp, giấy phép vẫn quan trọng (trang Hỗ trợ). Giữ chip Khá vững: liên minh – kết quả là tương quan vừa, nhất quán qua gần 200 nghiên cứu, nhưng là tương quan. chỗ khó: chip nhãn cho lời khuyên.'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1037/pst0000172
    luot_2_ghi_chu: 'Chip Khá vững hợp: mối liên hệ vững qua 295 nghiên cứu nhưng chỉ là tương quan.'
  - id: n53
    cau: 'Áp dụng 2: theo phân tích 409 thử nghiệm, CBT hiệu quả hơn nhóm đối chứng ở mức vừa đến lớn; trị liệu giúp được nhiều người, nhưng không phải ai cũng đỡ sau một liệu trình, và chưa đỡ không phải lỗi của người bệnh; hướng dẫn NICE ghi rằng khi trầm cảm chưa đáp ứng, người có chuyên môn bàn với người bệnh các phương án tiếp theo.'
    loai: lam-sang
    nguon:
      - cuijpers2023
      - nice-ng222
    trich: A total of 42% of patients receiving CBT responded to treatment, while the response rate was only 19% in control groups, with a NNT of 4.7 in favor of CBT. [Cuijpers]; If a person's depression has not responded … discuss further treatment options … switching to a psychological therapy … changing to a combination [NICE 1.9]
    vi_tri: Cuijpers 2023; NICE NG222 mục 1.9
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…hãy trao đổi với nhà trị liệu để đổi phương pháp, đổi nhà trị liệu, hoặc cân nhắc kết hợp với bác sĩ tâm thần. Kiên trì thử tiếp một thứ không hiệu quả với mình không phải là dũng cảm." Bỏ câu cuối (có thể đọc như khuyên bỏ điều trị sớm); "cân nhắc kết hợp" thành "gặp bác sĩ tâm thần để đánh giá thêm" (không khuyên dùng thuốc). Chip Vững chắc cho ý "trị liệu hiệu quả nhưng không phải ai cũng đáp ứng": hai vế đều có phân tích tổng hợp lớn. chỗ khó: chip cho lời khuyên. Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): lượt 2 khong-chac vì không mở được toàn văn. Toàn văn Cuijpers 2023 (bản PMC9840507 lưu ở Internet Archive ngày 29/6/2023; lượt 1 đã đọc, nay đọc lại): bảng 2 "Only low risk of bias 90 0.60 (0.49‐0.71) … Publication bias correction 349 0.47 (0.35‐0.59)", chú thích bảng "The reported publication bias correction is that using the trim and fill procedure"; Kết quả: "The response rate was 0.42 (95% CI: 0.39‐0.45) in CBT and 0.19 (95% CI: 0.18‐0.21) in the control conditions, which resulted in a RR of 2.13 (95% CI: 1.96‐2.32) and a NNT of 4.7 (95% CI: 4.0‐5.5)"; bảng 3: tỉ lệ đáp ứng ước tính ở 228/238 so sánh. NNT 4,7 do bài tính từ RR gộp (phương pháp: NNT = 1/hiệu số nguy cơ, gộp riêng), không phải 1/(0,42 − 0,19) ≈ 4,3 từ hai tỉ lệ gộp riêng; giữ số của bài. Số 0,47 là trim and fill (chỉ hiệu chỉnh sai lệch xuất bản), không phải gộp cả lọc nguy cơ sai lệch như một nguồn bậc 3 viết. Giữ các số. Kế hoạch nâng cấp S5 (20/11/2026): chữ cũ «Nghĩa là trị liệu **đáng thử** — nhưng nếu sau một liệu trình mà bạn không đỡ, đó không phải lỗi của bạn. Hãy bàn với nhà trị liệu về việc đổi phương pháp, đổi người trị liệu, hoặc gặp bác sĩ tâm thần để đánh giá thêm.»; chữ mới «Nghĩa là trị liệu giúp được nhiều người, nhưng không phải ai cũng đỡ sau một liệu trình, và chưa đỡ không phải lỗi của người bệnh. Hướng dẫn NICE ghi rằng khi trầm cảm chưa đáp ứng điều trị, người có chuyên môn bàn với người bệnh các phương án tiếp theo, như chuyển sang một liệu pháp tâm lý hay kết hợp các hướng điều trị.». Lý do: chuyển từ lời khuyên cá nhân sang mô tả bằng chứng và hướng dẫn (kiem-sinh-hoc-cam-xuc.md [A][CG], phản biện P7); bỏ «đổi người trị liệu», «gặp bác sĩ tâm thần» (không có trong trích NICE). Số 42%/19% và chip giữ. loai đổi loi-khuyen thành lam-sang (nay là câu về hiệu quả điều trị và hướng dẫn lâm sàng). Lượt 2 cũ (khong-chac về 42%/19%, đã được lượt 1 D7-L1 đối chiếu toàn văn) đã xóa, cần kiểm lại vế NICE 1.9. Lô sửa nhỏ sau S5 (chủ repo quyết 20/11/2026): bỏ «42% … so với 19%» (lượt 2 S5 khong-chac); thay bằng g «vừa đến lớn» có trong tóm tắt Cuijpers 2023 (Europe PMC: g=0.79, moderate to large).'
    luot_2: dung
    luot_2_nguon: [ "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1002/wps.21069&resultType=core&format=json", "https://www.nice.org.uk/guidance/ng222/chapter/Recommendations" ]
    luot_2_ghi_chu: "Tóm tắt: 409 thử nghiệm, «moderate to large effects compared to control conditions» (g = 0,79). NICE NG222 mục 1.9.1 (khi chưa đáp ứng thì «discuss with them» các nguyên nhân), 1.9.3 («other treatments can be tried»), 1.9.6 (chuyển liệu pháp tâm lý khác…). Câu chỉ nói người có chuyên môn bàn phương án, không khuyên thuốc cụ thể: đạt mục 5."
  - id: n54
    cau: 'Áp dụng 3: CBT tự giúp không có người hướng dẫn vẫn hiệu quả nhỏ đến vừa với trầm cảm (g = 0,45); một phân tích dữ liệu từng người bệnh (39 thử nghiệm) thấy CBT qua mạng có hướng dẫn hiệu quả hơn loại không hướng dẫn ngay sau điều trị, nhất là với trầm cảm vừa đến nặng; các kết quả này nói về những chương trình dựa trên phương pháp đã được kiểm chứng, không phải về mọi nội dung tự giúp trên mạng. (Chip Khá vững.)'
    loai: lam-sang
    nguon:
      - cuijpers2023
      - karyotaki2021
    trich: 'CBT was also effective as unguided self-help intervention (g=0.45; 95% CI: 0.31-0.60) [Cuijpers 2023]; Of 42 eligible RCTs, 39 studies comprising 9751 participants … Guided iCBT was associated with more effectiveness than unguided iCBT (MD in posttreatment PHQ-9 scores, -0.8) …, but we found no evidence of a difference at 6 or 12 months … guided iCBT was associated with overall better outcomes in patients with baseline PHQ-9 greater than 9. [Karyotaki 2021]'
    vi_tri: Cuijpers 2023; Karyotaki 2021, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trị liệu qua màn hình và tự giúp có hướng dẫn cũng có bằng chứng… các phiên bản có hướng dẫn (qua tin nhắn, video) thường tốt hơn… không phải video chữa lành trôi nổi trên mạng". Thêm nguồn cho "có hướng dẫn tốt hơn" (Karyotaki 2021: chỉ ngay sau điều trị); bỏ ví dụ "tin nhắn, video" và câu về "video chữa lành" (không nguồn). Kế hoạch nâng cấp S5 (20/11/2026): chữ cũ câu cuối «Đây là lựa chọn thực tế khi chi phí hoặc khoảng cách là rào cản — miễn là nội dung dựa trên phương pháp đã được kiểm chứng.»; chữ mới «Các kết quả này nói về những chương trình dựa trên phương pháp đã được kiểm chứng, không phải về mọi nội dung tự giúp trên mạng.». Lý do: bỏ lời khuyên cá nhân («lựa chọn thực tế»), chỉ giới hạn phạm vi của bằng chứng (kiem-sinh-hoc-cam-xuc.md [A][CG]). Hai số liệu và chip giữ. loai đổi loi-khuyen thành lam-sang. Lượt 2 cũ (dung) đã xóa.'
    luot_2: dung
    luot_2_nguon: [ "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=9840507&rettype=xml", "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1001/jamapsychiatry.2020.4364&format=json&resultType=core" ]
    luot_2_ghi_chu: "«Cuijpers 2023: CBT was also effective as unguided self‐help intervention (g=0.45; 95% CI: 0.31‐0.60). Karyotaki 2021: Of 42 eligible RCTs, 39 studies… contributed IPD; Guided iCBT was associated with more effectiveness than unguided iCBT (… posttreatment PHQ-9…), but we found no evidence of a difference at 6 or 12 months; benefits were more substantial in individuals with moderate to severe depression. Khớp. Câu cuối (chương trình dựa trên phương pháp đã kiểm chứng) là giới hạn hợp lý. An toàn: không gợi ý thay điều trị bằng tự giúp; ổn.»"
  - id: n55
    cau: 'Áp dụng 4: nên gặp người có chuyên môn khi buồn, lo, căng thẳng kéo dài nhiều tuần không dịu, ảnh hưởng rõ đến học, làm, ngủ, quan hệ, hay phải dùng rượu bia, chất kích thích; có ý nghĩ về cái chết hay tự làm hại thì tìm giúp đỡ ngay; không cần "đủ nặng"; đây là gợi ý, không phải để tự chẩn đoán, chỉ người có chuyên môn mới chẩn đoán được (link Hỗ trợ).'
    loai: loi-khuyen
    nguon:
      - who-dep-2026
      - nhs-tt
    trich: Seek care if you have symptoms of depression. … If you think you are in immediate danger of harming yourself, contact any available emergency services or a crisis line. [WHO]; You do not need to have a diagnosed mental health condition. [NHS]
    vi_tri: WHO; NHS
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ có chip Vững chắc và "gọi 115, không chờ đợi, không để mai tính"; "Số điện thoại khẩn cấp… có ở trang Hỗ trợ". Bỏ chip nhãn (lời khuyên khi nào tìm giúp đỡ không phải kết luận về bằng chứng có thể xếp nhãn); bỏ số 115 (lời giao D7-L1); lời dẫn Hỗ trợ ở cuối bài. Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): thêm câu "gợi ý để tìm người nói chuyện, không phải để tự chẩn đoán: chỉ người có chuyên môn mới chẩn đoán được (xem trang Hỗ trợ)" ngay sau danh sách dấu hiệu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/mental-health/conditions/depression-in-adults/diagnosis/", "https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/stress/", "https://www.samhsa.gov/find-support/how-to-cope/signs-of-needing-help", "https://www.who.int/news-room/fact-sheets/detail/depression" ]
    luot_2_ghi_chu: "Khớp. 'Không cần đủ nặng': NHS khuyên gặp bác sĩ chỉ cần thấy khó đương đầu hay tự làm không đỡ, không đòi mức nặng. Câu có lời rào và link Hỗ trợ (phần link là chuyện của site). Không gần chẩn đoán."
  - id: n56
    cau: Phần lớn con số ở trên đến từ thử nghiệm ở các nước phương Tây.
