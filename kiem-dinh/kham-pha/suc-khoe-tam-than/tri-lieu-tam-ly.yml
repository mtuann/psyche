  - id: n66
    cau: 'Ngộ nhận 1: "trị liệu chỉ là nói chuyện cho nhẹ lòng" chỉ đúng một phần: lắng nghe, kỳ vọng có thể có tác dụng; nhưng trị liệu có cấu trúc, do người được đào tạo, và trong nhiều thử nghiệm hiệu quả hơn hẳn không điều trị, hơn giả dược "chỉ lắng nghe" (d = 0,34 với lo âu xã hội), hiệu quả còn sau khi kết thúc.'
    loai: phat-hien
    nguon:
      - powers2008
      - cuijpers2023
      - apa-dict
      - baskin2003
    trich: A comprehensive literature search produced 32 randomized controlled trials (N = 1,479) … There was a clear overall advantage of treatment compared to waitlist (d = 0.86), psychological placebo (d = 0.34), and pill-placebo (d = 0.36) conditions at posttreatment … Treatment gains were maintained at follow-up (d = 0.76).
    vi_tri: Powers 2008; APA Dictionary
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một phần đúng — sự lắng nghe và kỳ vọng có tác dụng thật… Nhưng trị liệu thật vượt trội giả dược chỉ lắng nghe (d = 0,34) và hiệu quả duy trì nhiều tháng sau khi kết thúc, điều lời an ủi thông thường không làm được." Thêm "trong nhiều thử nghiệm", "với lo âu xã hội"; bỏ "điều lời an ủi thông thường không làm được" (không có nghiên cứu so với lời an ủi của bạn bè). chỗ khó: Baskin 2003 (n33) cho thấy giả dược tương đương về cấu trúc gần ngang trị liệu; vế "hơn giả dược" chỉ đúng với giả dược thông thường.'
    luot_2: dung
    luot_2_nguon:
      - https://dare.uva.nl/id/7886da1f-5790-4005-8ecb-747aca121038
    luot_2_ghi_chu: Gọi giả dược tâm lý là 'chỉ lắng nghe' là giản lược; Baskin 2003 cho thấy với giả dược tương đương về cấu trúc thì khác biệt không đáng kể, nên giữ 'trong nhiều thử nghiệm'.
  - id: n67
    cau: 'Ngộ nhận 2: "CBT tốt nhất, trường phái khác vô dụng" sai; khi so trực tiếp, CBT chỉ hơn 0,06; tâm động và nhân văn cũng có bằng chứng hiệu quả, dù ít nghiên cứu hơn.'
    loai: phat-hien
    nguon:
      - cuijpers2023
      - driessen2015
      - elliott2021
    trich: 'CBT was significantly more effective than other psychotherapies, but the difference was small (g=0.06; 95% CI: 0-0.12) and became non-significant in most sensitivity analyses. The effects of CBT did not differ significantly from those of pharmacotherapies at the short term, but were significantly larger at 6-12 month follow-up (g=0.34; 95% CI: 0.09-0.58), although the number of trials was small, and the difference was not significant in all sensitivity analyses. Combined treatment was more effective than pharmacotherapies alone … but it was not more effective than CBT alone at either time point. A key part of this review is a meta-analysis of 91 studies of the effectiveness/efficacy of HEPs, published between 2009 and 2018 … (1) HEPs were associated with large pre-post client change (d = .86). (2) In controlled studies, clients in HEPs generally showed large gains relative to clients who received no therapy (.88). (3) In comparative outcome studies, HEPs in general were statistically and clinically equivalent in effectiveness to other therapies (-.08). (4) Overall, CBT appeared to have an equivocal advantage over HEPs (-.26). However, these studies were overwhelmingly delivered by CBT researchers in largely non-bona fide versions of HEPs as comparison conditions. … Findings were more mixed for depression and anxiety.'
    vi_tri: Cuijpers 2023; Driessen 2015; Elliott 2021
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Liệu pháp tâm động và nhân văn đều có bằng chứng hiệu quả tương đương." Làm mềm: "cũng có bằng chứng hiệu quả, dù ít nghiên cứu hơn" (Elliott 2021: CBT có lợi thế nhỏ chưa rõ, −0,26; kết quả với trầm cảm, lo âu lẫn lộn).'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1002/wps.21069
      - https://doi.org/10.1016/j.cpr.2015.07.004
      - https://strathprints.strath.ac.uk/74362
  - id: n68
    cau: 'Ngộ nhận 3: đi trị liệu không có nghĩa là "có vấn đề nặng"; không cần chẩn đoán mới được gặp người có chuyên môn; nhiều người đi trị liệu vì khó khăn phổ biến (lo âu, buồn chán, căng thẳng công việc, rắc rối quan hệ); quan niệm này có thể khiến người ta trì hoãn.'
    loai: loi-khuyen
    nguon:
      - nhs-tt
