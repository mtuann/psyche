    luot_2_ghi_chu: Toàn văn PMC7014690. Nhóm chứng là chăm sóc thông thường 'tăng cường'.
  - id: n59
    cau: 'Imamura và cộng sự (2021): 951 điều dưỡng ở một bệnh viện đa khoa lớn tại Hà Nội, so hai chương trình qua điện thoại thông minh với nhóm đối chứng; chỉ chương trình CBT theo thứ tự cố định giảm triệu chứng trầm cảm, ở mức nhỏ sau 3 tháng, không còn khác biệt sau 7 tháng; chương trình còn lại không cho thấy hiệu quả có ý nghĩa thống kê.'
    loai: so-lieu
    nguon:
