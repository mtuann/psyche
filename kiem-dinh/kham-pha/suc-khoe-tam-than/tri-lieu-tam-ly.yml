    trich: cognitive therapy … emotional and behavioral problems … are, at least in part, the result of maladaptive or faulty ways of thinking … [cognitive therapy]; Helping individuals to become aware of … negative automatic thoughts, and then to test their validity [automatic thoughts]
    vi_tri: APA Dictionary
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "…duy trì cảm xúc và hành vi tiêu cực…" Thêm "góp phần" (APA: "at least in part").'
