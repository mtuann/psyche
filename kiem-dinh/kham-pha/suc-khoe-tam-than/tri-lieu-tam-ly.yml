    ghi_chu: 'Chữ cũ: "các mô hình trị liệu qua màn hình, tự giúp có hướng dẫn — những hình thức đã có bằng chứng — đáng được đầu tư hơn là chỉ trông chờ vào phòng khám truyền thống." Bỏ lời khuyên chính sách "đáng được đầu tư hơn"; thêm người không chuyên được giám sát (WHO).'
