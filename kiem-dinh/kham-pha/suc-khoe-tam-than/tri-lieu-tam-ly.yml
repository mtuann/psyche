  - cu: 'Mục Cuijpers và cộng sự (2023): sau đoạn Kết quả không có lời rào về thuốc'
    moi: 'Thêm đoạn «Các con số so CBT với thuốc là kết quả gộp từ các thử nghiệm, không phải lời khuyên cho ai cụ thể. Đừng tự ý ngừng hay đổi thuốc: mọi thay đổi về thuốc hãy bàn với bác sĩ kê đơn.»'
    ly_do: 'Kế hoạch nâng cấp S5 (20/11/2026); hồ sơ n77.'
  - cu: 'Áp dụng 2: «Nghĩa là trị liệu đáng thử — nhưng nếu sau một liệu trình mà bạn không đỡ, đó không phải lỗi của bạn. Hãy bàn với nhà trị liệu về việc đổi phương pháp, đổi người trị liệu, hoặc gặp bác sĩ tâm thần để đánh giá thêm.»; Áp dụng 3: «Đây là lựa chọn thực tế khi chi phí hoặc khoảng cách là rào cản — miễn là nội dung dựa trên phương pháp đã được kiểm chứng.»'
    moi: 'Áp dụng 2: mô tả bằng chứng (không phải ai cũng đỡ, không phải lỗi của người bệnh) và hướng dẫn NICE khi chưa đáp ứng; Áp dụng 3: giới hạn phạm vi của bằng chứng (chương trình dựa trên phương pháp đã kiểm chứng)'
    ly_do: 'Kế hoạch nâng cấp S5 (20/11/2026); hồ sơ n53, n54.'
  - cu: 'Ngộ nhận «Hết liệu trình là khỏi hẳn…» kết thúc ở «…tốt hơn thuốc.»'
    moi: 'Thêm «Đây không phải lý do để tự ý ngừng hay đổi thuốc: mọi thay đổi về thuốc hãy bàn với bác sĩ kê đơn.»'
