nhan_dinh:
  - id: n1
    cau: 'Mô tả: dấu hiệu nên tìm người có chuyên môn, các vai trò bác sĩ tâm thần, nhà tâm lý lâm sàng, tham vấn viên khác nhau thế nào, buổi gặp đầu tiên thường diễn ra ra sao.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Câu mô tả nội dung của chính trang; đã kiểm trên trang (các mục tương ứng có). Mô tả cũ có "Bản nháp:"; bỏ (dải chờ rà soát làm ở khung trang). review (17/11/2026): đã kiểm trên trang và dist/ (npm run build:xem), khớp.'
    review: dung
  - id: n2
    cau: 'Hộp đầu trang: nếu đang gặp nguy hiểm ngay thì xem trang Hỗ trợ (số cấp cứu, đường dây đã kiểm chứng); bài không dùng để tự chẩn đoán, chỉ người có chuyên môn mới chẩn đoán được.'
    loai: lam-sang
    nguon:
      - apa-anx
      - apa-dep
    trich: A diagnosis is made by a qualified health professional. [APA anxiety]; To diagnose depression, a healthcare professional will conduct a thorough diagnostic evaluation [APA depression]
    vi_tri: APA
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (hộp warning): "Bản nháp đang chờ rà soát chuyên môn. Bài viết này chưa được người có chuyên môn đọc lại…". Như hồ sơ tram-cam n2. Vế "trang Hỗ trợ có số cấp cứu…" là câu về site: đã kiểm trên src/content/docs/ho-tro/index.md.'
    luot_2: dung
    luot_2_nguon:
      - https://www.who.int/news-room/fact-sheets/detail/depression
      - https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content
    luot_2_ghi_chu: Câu đúng chuẩn mục 5 (đầu trang dẫn tới Hỗ trợ, nhắc không tự chẩn đoán). Số điện thoại ở trang Hỗ trợ không thuộc phần này.
  - id: n3
    cau: Ví dụ đau răng là ví dụ giả định của chúng tôi.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'gia-dinh: ghi rõ trên trang. Đã kiểm. review (17/11/2026): đã kiểm trên trang và dist/ (npm run build:xem), khớp.'
    review: dung
  - id: n4
    cau: Với sức khỏe tâm thần, nhiều người chờ đến khi không chịu nổi mới tìm người giúp; WHO ghi ngay ở các nước thu nhập cao, chỉ khoảng một phần ba người bị trầm cảm được điều trị.
    loai: so-lieu
    nguon:
      - who-dep-2026
    trich: In high-income countries, only about one third of people with depression receive mental health treatment (3). Barriers to effective care include a lack of investment in mental health care, lack of trained health care providers and social stigma
    vi_tri: WHO Depression, Overview (dẫn Evans-Lacko 2018)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Với sức khỏe tâm thần, đa số chúng ta cũng hành xử y hệt: chờ đến khi không chịu nổi mới tìm người giúp. Nhưng cũng như răng, tâm trí càng được can thiệp sớm thì thường càng đỡ vất vả." Bỏ "đa số" (không nguồn); thay bằng số của WHO; ý "can thiệp sớm" đưa vào khung nhãn (n25) với nguồn.'
    luot_2: dung
    luot_2_nguon:
      - https://www.who.int/news-room/fact-sheets/detail/depression
    luot_2_ghi_chu: Fact sheet cập nhật 11/09/2026. Vế 'nhiều người chờ đến khi không chịu nổi' là diễn giải chung, không có số.
  - id: n5
    cau: Trang này không có bài tự đánh giá hay bảng tự chấm điểm nào (các câu hỏi ở mục "Thử suy ngẫm" chỉ để ôn lại nội dung bài), và Psyche không làm công cụ tự chẩn đoán.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Đã kiểm: trang không có ::cong-cu; trang Hỗ trợ (đã khóa) ghi "Psyche không có và sẽ không có công cụ tự chẩn đoán". Chữ cũ "Psyche Zero" đổi thành "Psyche" (tên site mới); bỏ "và sẽ không bao giờ có" (lời hứa về tương lai, đã có ở trang Hỗ trợ). Review (17/11/2026): câu cũ "Không có bài kiểm tra nào trên trang này" sai trên trang: trang có mục "Thử suy ngẫm" (5 câu hỏi). Sửa thành "không có bài tự đánh giá hay bảng tự chấm điểm nào (các câu hỏi ở mục Thử suy ngẫm chỉ để ôn lại nội dung bài)"; đã kiểm lại trên dist/: không có ::cong-cu, câu mới đúng.'
    review: sai
  - id: n6
    cau: Nếu điều gì đang diễn ra với mình, kéo dài nhiều tuần, ảnh hưởng cuộc sống thì tìm người có chuyên môn trò chuyện là hợp lý, dù có bị rối loạn nào hay không; không cần "đủ nặng".
    loai: loi-khuyen
    nguon:
      - nhs-tt
      - who-dep-2026
    trich: You do not need to have a diagnosed mental health condition. [NHS talking therapies]; Seek care if you have symptoms of depression. [WHO]
    vi_tri: NHS, How to get talking therapies; WHO
    ket_qua: da-sua
    ghi_chu: Thêm vế "dù bạn có bị rối loạn nào hay không" (NHS); bỏ ý ngầm "có/không" như một phép thử.
    luot_2: dung
    luot_2_nguon:
      - https://www.who.int/news-room/fact-sheets/detail/depression
      - https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content
    luot_2_ghi_chu: Lời khuyên tìm trò chuyện, không phải chẩn đoán.
  - id: n7
    cau: Buồn, lo, căng thẳng là phần bình thường của cuộc sống và tự chúng không phải dấu hiệu của rối loạn.
    loai: lam-sang
    nguon:
      - icd11-cddr
    trich: Some depression of mood is a normal reaction to severe adverse life events … [Depressive episode]; Anxiety and worry are normal emotional/cognitive states that commonly occur when people are under stress. [6B00]
    vi_tri: CDDR tr. 213, 267
    ket_qua: da-sua
    ghi_chu: Thêm vế "tự chúng không phải dấu hiệu của rối loạn" cho khớp trang Hỗ trợ (đã khóa).
    luot_2: dung
    luot_2_nguon:
      - https://www.who.int/news-room/fact-sheets/detail/depression
  - id: n8
    cau: 'Dấu hiệu nên cân nhắc tìm giúp đỡ: buồn bã, trống rỗng, lo âu hay căng thẳng kéo dài từ hai tuần trở lên không dịu; ảnh hưởng rõ đến học, làm, ngủ, ăn, các mối quan hệ.'
    loai: loi-khuyen
    nguon:
      - who-dep-2026
      - apa-dep
      - apa-anx
    trich: They last most of the day, nearly every day, for at least two weeks. [WHO]; Interferes with work, school, or relationships [APA, When to Seek Help for Anxiety]
    vi_tri: WHO; APA
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "kéo dài nhiều tuần và không dịu đi dù hoàn cảnh đã ổn hơn"; ví dụ "nghỉ học/nhiều ngày không làm được việc, sụt cân hoặc tăng cân rõ rệt, mất ngủ triền miên". Đổi thành "từ hai tuần trở lên" cho khớp trang Hỗ trợ (đã khóa, cùng nguồn WHO, SAMHSA, NIMH); bỏ "dù hoàn cảnh đã ổn hơn" (ICD-11: có biến cố vẫn có thể là trầm cảm) và các ví dụ như ngưỡng.'
    luot_2: dung
    luot_2_nguon:
      - https://www.who.int/news-room/fact-sheets/detail/depression
      - https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content
    luot_2_ghi_chu: 'gần chẩn đoán: ngưỡng ''từ hai tuần trở lên'' trùng tiêu chí thời gian của giai đoạn trầm cảm (WHO); câu chỉ dùng làm ngưỡng ''cân nhắc tìm giúp đỡ'' nên đúng, nhưng phải luôn đi kèm lời nhắc chỉ chuyên gia mới chẩn đoán (n12) và không được biến thành bảng tự chấm. Với lo âu, hai tuần không phải tiêu chí chẩn đoán (ICD-11 cho rối loạn lo âu lan tỏa đòi nhiều tháng), nên không nên trình bày như tiêu chí.'
  - id: n9
    cau: 'Dấu hiệu: dùng rượu, chất kích thích ngày càng nhiều để chịu đựng cảm xúc.'
    loai: loi-khuyen
    nguon:
      - who-dep-2026
      - icd11-cddr
    trich: avoid or cut down on alcohol and don't use illicit drugs, which can make depression worse [WHO]; Depressive episodes may be associated with increased consumption of alcohol or other substances [ICD-11]
    vi_tri: WHO Self-care; CDDR tr. 213
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "dùng rượu, thuốc hay các hành vi khác (chơi game thâu đêm, tự làm đau...) để chịu đựng cảm xúc". Bỏ "chơi game thâu đêm" (không nguồn) và "tự làm đau" (chuyển vào mục tự hại, n11, theo hướng dẫn đưa tin an toàn: không liệt kê hành vi tự hại); khớp trang Hỗ trợ.'
    luot_2: dung
    luot_2_nguon:
      - https://www.who.int/news-room/fact-sheets/detail/depression
      - https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content
  - id: n10
    cau: 'Dấu hiệu: người thân nói bạn thay đổi nhiều, và bạn cũng thấy mình không còn là mình.'
    loai: loi-khuyen
    nguon:
      - icd11-cddr
    trich: Assessment of the presence or absence of symptoms should be made relative to typical functioning of the individual.
    vi_tri: CDDR tr. 212
    ket_qua: dung
    ghi_chu: 'Giữ chữ cũ. Nguồn gián tiếp: ICD-11 đánh giá triệu chứng so với mức hoạt động thường ngày của chính người ấy. chỗ khó: dấu hiệu này không có trong danh sách của WHO, SAMHSA trang Hỗ trợ dùng; lượt 2 xét có cần nguồn trực tiếp hơn không (ví dụ SAMHSA "Signs You Need To Seek Help").'
    luot_2: dung
    luot_2_nguon:
      - https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content
    luot_2_ghi_chu: mhGAP xếp 'thay đổi hành vi rõ' vào biểu hiện thường gặp (chủ yếu của loạn thần); dùng làm dấu hiệu nên tìm giúp đỡ là hợp lý.
  - id: n11
    cau: 'Có ý nghĩ tự làm hại bản thân, hay nghĩ mọi người sẽ tốt hơn nếu không có mình: tìm giúp đỡ ngay, gọi cấp cứu hay đến khoa cấp cứu gần nhất; số khẩn cấp ở trang Hỗ trợ.'
    loai: loi-khuyen
    nguon:
      - who-dep-2026
      - paho-living
    trich: If you think you are in immediate danger of harming yourself, contact any available emergency services or a crisis line. [WHO]; Seek help from the emergency services or a health-care professional. [PAHO]
    vi_tri: WHO Self-care; PAHO 2021
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…gọi 115 hoặc đến khoa cấp cứu gần nhất". Bỏ số 115 khỏi bài (lời giao D7-L1); số ở trang Hỗ trợ.'
    luot_2: dung
    luot_2_nguon:
      - https://www.who.int/news-room/fact-sheets/detail/depression
      - https://www.nhs.uk/nhs-services/mental-health-services/where-to-get-urgent-help-for-mental-health/
    luot_2_ghi_chu: 'Đúng hướng dẫn đưa tin an toàn: không mô tả cách thức, có đường tới trợ giúp.'
  - id: n12
    cau: 'Danh sách dấu hiệu giúp quyết định có nên tìm người nói chuyện, không phải để tự chẩn đoán: chỉ người có chuyên môn mới chẩn đoán được.'
    loai: loi-khuyen
    nguon:
      - apa-anx
    trich: A diagnosis is made by a qualified health professional.
    vi_tri: APA
    ket_qua: da-sua
    ghi_chu: 'Thêm mới (lời giao D7-L1). Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): câu nay thêm "chỉ người có chuyên môn mới chẩn đoán được", ngay sau danh sách dấu hiệu (link Hỗ trợ cùng đoạn).'
    luot_2: dung
    luot_2_nguon: [ "https://www.who.int/news/item/08-03-2024-new-manual-released-to-support-diagnosis-of-mental--behavioural-and-neurodevelopmental-disorders-added-in-icd-11", "https://www.samhsa.gov/find-support/how-to-cope/signs-of-needing-help" ]
    luot_2_ghi_chu: Lời rào đúng. Không gần chẩn đoán.
  - id: n13
    cau: Nguyên tắc "không cần đủ nặng mới được tìm giúp đỡ" là nguyên tắc trang Hỗ trợ cũng dùng.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên src/content/docs/ho-tro/index.md: "Bạn không cần phải đủ nặng mới được tìm sự giúp đỡ." review (17/11/2026): đã kiểm trên trang và dist/ (npm run build:xem), khớp.'
    review: dung
  - id: n14
    cau: Ba vai trò chính tóm từ bảng chi tiết ở trang Hỗ trợ.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: bảng "Các loại chuyên gia khác nhau thế nào?" ở trang Hỗ trợ có bốn vai trò (thêm nhân viên công tác xã hội); bài tóm ba. Chữ cũ "đồng bộ với bảng chi tiết" đổi thành "tóm từ". review (17/11/2026): đã kiểm trên trang và dist/ (npm run build:xem), khớp.'
    review: dung
  - id: n15
    cau: Bác sĩ chuyên khoa tâm thần là bác sĩ y khoa học chuyên khoa tâm thần; chẩn đoán, điều trị bằng thuốc và phương pháp khác, chỉ định nhập viện khi cần.
    loai: dinh-nghia
    nguon:
      - healthdirect-psy
    trich: Psychiatrists are medical doctors who have completed specialised training in how to diagnose, treat and prevent mental, emotional and behavioural disorders. They work in different ways and can use a combination of treatments, including counselling, psychotherapy and medicines. They can arrange admission to hospital if needed.
    vi_tri: Healthdirect, What does a psychiatrist do?
    ket_qua: dung
    ghi_chu: Giữ như trang cũ và trang Hỗ trợ (đã khóa). Nguồn mô tả vai trò ở Úc; quy định về phạm vi hành nghề ở Việt Nam không kiểm riêng ở lô này (trang Hỗ trợ dùng cùng nguồn).
    luot_2: dung
    luot_2_nguon:
      - https://dictionary.apa.org/psychiatrist
      - https://pbgdpl.cantho.gov.vn/attachment/2200
    luot_2_ghi_chu: APA không nói về chỉ định nhập viện; vế ấy dựa vào Điều 62 Luật Khám bệnh, chữa bệnh (người hành nghề quyết định điều trị nội trú). Luật số 15/2023/QH15, bản đăng trên Cổng PBGDPL TP Cần Thơ (file .doc của văn bản ký ngày 09/01/2023).
  - id: n16
    cau: Trong ba vai trò, chỉ bác sĩ được kê đơn thuốc.
    loai: lam-sang
    nguon:
      - tt26-2025
    trich: 'Điều 2. Thẩm quyền kê đơn thuốc: Người hành nghề khám bệnh, chữa bệnh có chứng chỉ hành nghề hoặc giấy phép hành nghề khám bệnh, chữa bệnh với chức danh là bác sỹ, y sỹ có thẩm quyền kê đơn thuốc.'
    vi_tri: TT 26/2025/TT-BYT, Điều 2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Là người duy nhất trong ba vai trò được kê đơn thuốc." Diễn đạt lại, giữ nghĩa (y sỹ cũng kê đơn nhưng không thuộc ba vai trò). Thông tư chỉ về thuốc hóa dược, sinh phẩm.'
    luot_2: dung
    luot_2_nguon:
      - https://luatvietnam.vn/y-te/thong-tu-26-2025-tt-byt-quy-dinh-ke-don-thuoc-hoa-duoc-sinh-pham-tai-co-so-kham-chua-benh-404246-d1.html
      - https://pbgdpl.cantho.gov.vn/attachment/2200
    luot_2_ghi_chu: 'Trong ba vai trò (bác sĩ tâm thần, nhà tâm lý lâm sàng, tham vấn viên) chỉ bác sĩ kê đơn: đúng. Ngoài ba vai trò, y sỹ cũng được kê đơn. Văn bản đọc qua luatvietnam.vn (chưa mở được bản trên vbpl/chinhphu); TT 26/2025 hiệu lực 01/07/2025.'
  - id: n17
    cau: "Tính đến 11/2026, theo các văn bản pháp luật hiện hành: Luật Khám bệnh, chữa bệnh 2023 (hiệu lực 01/01/2024) xếp nhà tâm lý lâm sàng là chức danh phải có giấy phép hành nghề; theo phạm vi hành nghề ở Thông tư 32/2023/TT-BYT, công việc là đánh giá, xây dựng và thực hiện các can thiệp tâm lý tại cơ sở khám bệnh, chữa bệnh; không kê đơn thuốc (theo Thông tư 26/2025/TT-BYT, người kê đơn là bác sĩ, y sĩ)."
    loai: thoi-su
    nguon:
      - luat-kbcb-d26
      - tt26-2025
      - tt32-2023
    trich: 'Điều 26. Chức danh chuyên môn phải có giấy phép hành nghề 1. … h) Tâm lý lâm sàng || Điều 11 khoản 11: Phạm vi hành nghề của người hành nghề có chức danh chuyên môn là tâm lý lâm sàng quy định tại Phụ lục số XVI … bao gồm đánh giá các rối loạn tâm thần, chỉ định, xây dựng và triển khai các can thiệp tâm lý tại các cơ sở khám bệnh, chữa bệnh. [TT 32/2023]'
    vi_tri: Luật 15/2023/QH15 Điều 26 khoản 1 điểm h; TT 26/2025 Điều 2
    ket_qua: da-sua
    ghi_chu: 'Khớp trang cũ và trang Hỗ trợ (đã khóa). Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): theo ghi chú lượt 2: phạm vi công việc ghi theo Thông tư 32/2023/TT-BYT (Điều 11 khoản 11, Phụ lục XVI: "cung cấp các dịch vụ chăm sóc liên tục và toàn diện về nhận thức, hành vi, cảm xúc, tâm lý xã hội …, bao gồm đánh giá các rối loạn tâm thần, chỉ định, xây dựng và triển khai các can thiệp tâm lý tại các cơ sở khám bệnh, chữa bệnh"); không kê đơn theo Thông tư 26/2025/TT-BYT Điều 2. Review (17/11/2026): lượt 2 bổ sung dung, ghi có tin Bộ Y tế dự thảo sửa Thông tư 32: đổi loại thành thoi-su, trang viết kèm mốc "theo các văn bản pháp luật hiện hành tính đến 11/2026", het_han 2027-05-01 (6 tháng, ngắn hơn các câu thời sự khác vì văn bản đang được dự thảo sửa; tới hạn thì kiểm Thông tư 32 và văn bản sửa đổi, nếu có). Trang Hỗ trợ (đã khóa) ghi cùng nội dung về giấy phép và kê đơn.'
    luot_2: dung
    luot_2_nguon: [ "https://luatvietnam.vn/y-te/luat-15-2023-qh15-242305-d1.html", "https://trungtamytekhanhson.khanhhoa.gov.vn/wp-content/uploads/2024/01/Th%C3%B4ng-t%C6%B0-32-2023-TT-BYT.pdf", "https://luatvietnam.vn/y-te/thong-tu-26-2025-tt-byt-quy-dinh-ke-don-thuoc-hoa-duoc-sinh-pham-tai-co-so-kham-chua-benh-404246-d1.html" ]
    luot_2_ghi_chu: "Khớp cả ba văn bản. TT 26/2025 quy định kê đơn thuốc hóa dược, sinh phẩm trong điều trị ngoại trú, hiệu lực 01/7/2025. Luật và TT 32 đọc ở luatvietnam.vn (cơ sở dữ liệu pháp luật) và bản PDF trên cổng của Trung tâm Y tế Khánh Sơn (Khánh Hòa); bản PDF này không kèm Phụ lục XVI. Câu có tính thời sự (văn bản có thể bị sửa: tìm thấy tin Bộ Y tế dự thảo sửa TT 32): nên viết kèm mốc 'tính đến 11/2026' và đặt het_han. Lộ trình kiểm tra năng lực của Hội đồng Y khoa Quốc gia với tâm lý lâm sàng từ 01/01/2029 (Điều 120.3c) không mâu thuẫn với câu."
    het_han: 2027-05-01
  - id: n18
    cau: 'Tham vấn viên được đào tạo rất khác nhau; Luật Khám bệnh, chữa bệnh 2023 không đặt chuẩn đào tạo chung và đây không phải chức danh phải có giấy phép hành nghề theo luật này; công việc: lắng nghe, hỗ trợ, tư vấn.'
    loai: lam-sang
    nguon:
      - luat-kbcb-d26
    trich: 'Điều 26 khoản 1 liệt kê: Bác sỹ; Y sỹ; Điều dưỡng; Hộ sinh; Kỹ thuật y; Dinh dưỡng lâm sàng; Cấp cứu viên ngoại viện; Tâm lý lâm sàng; Lương y; Người có bài thuốc gia truyền … (không có tham vấn, tư vấn tâm lý)'
    vi_tri: Luật 15/2023/QH15 Điều 26
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hiện chưa có giấy phép hành nghề quốc gia riêng như hai vai trò trên… phù hợp với những khó khăn ở mức độ nhẹ, hoặc như bước đầu để được hướng đến đúng nơi". Sửa cho khớp trang Hỗ trợ (đã khóa, chỉ nói theo Luật KBCB 2023); bỏ "phù hợp với khó khăn mức nhẹ" (không nguồn, dễ đọc như lời khuyên chọn trị liệu).'
    luot_2: dung
    luot_2_nguon:
      - https://pbgdpl.cantho.gov.vn/attachment/2200
    luot_2_ghi_chu: Toàn văn Luật không có chữ 'tham vấn'. Vế 'được đào tạo rất khác nhau' và 'lắng nghe, hỗ trợ, tư vấn' không có nguồn bậc 1–2 riêng; là hệ quả hợp lý của việc không có chuẩn chung, nên giữ lời lẽ thận trọng.
  - id: n19
    cau: Các vai trò bổ sung cho nhau; có người được bác sĩ theo dõi thuốc đồng thời gặp nhà tâm lý để trị liệu.
    loai: lam-sang
    nguon:
      - nice-ng222
    trich: Combination of individual cognitive behavioural therapy (CBT) and an antidepressant … Sessions with a therapist provide immediate support while the medication takes time to work
    vi_tri: NICE NG222 bảng 2
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Nhiều người được điều trị kết hợp: bác sĩ theo dõi thuốc, nhà tâm lý đồng hành trị liệu." Làm mềm "Nhiều người" thành "Có người" (không có số liệu về tỉ lệ).'
    luot_2: dung
    luot_2_nguon:
      - https://www.who.int/news-room/fact-sheets/detail/depression
      - https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content
    luot_2_ghi_chu: Kết hợp thuốc và trị liệu là hướng dẫn của WHO; câu không khuyên cá nhân dùng thuốc.
  - id: n20
    cau: 'Gợi ý khi chọn nơi hỗ trợ: hỏi đào tạo, giấy phép, chứng chỉ; chi phí, thời lượng; cách bảo mật; không hợp thì tìm người khác là bình thường.'
    loai: loi-khuyen
    nguon:
      - healthdirect-couns
      - nhs-tt
    trich: Your counsellor should discuss confidentiality in your first session. [Healthdirect]; Before choosing a private therapist, make sure they're registered with a professional organisation [NHS]
    vi_tri: Healthdirect; NHS
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…Một nơi làm việc nghiêm túc sẽ trả lời thẳng thắn những câu hỏi này." Thay câu cuối bằng gợi ý của trang Hỗ trợ (đã khóa): "Nếu bạn không thấy hợp với một người, việc tìm người khác là bình thường."'
    luot_2: dung
    luot_2_nguon:
      - https://pbgdpl.cantho.gov.vn/attachment/2200
      - https://doi.org/10.1037/pst0000172
      - https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content
    luot_2_ghi_chu: Lời khuyên hỏi giấy phép có căn cứ luật; 'không hợp thì tìm người khác' dựa trên liên minh trị liệu đi kèm kết quả (tương quan).
  - id: n21
    cau: 'Buổi gặp đầu: người có chuyên môn hỏi lý do đến, từ khi nào, ảnh hưởng ra sao; hỏi bối cảnh: giấc ngủ, ăn uống, công việc, học tập, quan hệ, tiền sử sức khỏe bản thân và gia đình, rượu, chất kích thích, thuốc đang dùng.'
    loai: lam-sang
    nguon:
      - bdi-consult
      - healthdirect-couns
      - apa-dep
    trich: You should expect a thorough assessment of your mental health problem/s. The assessment could cover … Whether there is any family history of depression or bipolar disorder? … The quality of your relationships … Your drug and alcohol history? … information about any medications you are taking [Black Dog]; During your first appointment with a counsellor, they will ask you questions about yourself and what you want help with. [Healthdirect]
    vi_tri: Black Dog Institute; Healthdirect
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mô tả chung dưới đây dựa trên thực hành phổ biến". Nay dẫn tài liệu cho người bệnh của Black Dog Institute và Healthdirect; thêm tiền sử gia đình, rượu, chất.'
    luot_2: dung
    luot_2_nguon:
      - https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content
    luot_2_ghi_chu: Giấc ngủ, ăn uống không ghi riêng trong đoạn bệnh sử nhưng có trong biểu hiện thường gặp (sleep problems) và khám trạng thái tâm thần.
  - id: n22
    cau: 'Họ cũng có thể hỏi về ý nghĩ tự làm hại bản thân: đó là câu hỏi thường lệ để giữ an toàn.'
    loai: lam-sang
    nguon:
      - bdi-consult
    trich: What is the risk of self-harm or harm to others?
    vi_tri: Black Dog Institute, các mục đánh giá
    ket_qua: da-sua
    ghi_chu: 'Thêm mới (để người đọc không bất ngờ; trang Hỗ trợ dẫn Dazzi 2014: hỏi về ý nghĩ tự sát không làm tăng ý nghĩ ấy).'
    luot_2: dung
    luot_2_nguon:
      - https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content
      - https://doi.org/10.1017/S0033291714001299
  - id: n23
    cau: Bạn được nói theo nhịp của mình, có quyền nói "chuyện này tôi chưa muốn kể" và đặt câu hỏi; sau đánh giá, người có chuyên môn thường giải thích nhận định và đề xuất hướng đi; bạn có quyền hỏi, xin ý kiến thứ hai.
    loai: loi-khuyen
    nguon:
      - bdi-consult
    trich: you should expect … being given sufficient time to express your thoughts and feelings … After assessing you … the mental health professional should inform you … A management strategy should be recommended … Oppportunity to ask questions and raise concerns. Professional support if you request a referral for a second opinion.
    vi_tri: Black Dog Institute
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Không ai ép bạn nói điều bạn chưa sẵn sàng… Một nhà chuyên môn tốt sẽ tôn trọng điều đó"; "có thể chỉ là một số thay đổi trong sinh hoạt và hẹn tái khám". Viết lại theo Black Dog; bỏ ví dụ "thay đổi sinh hoạt" (dễ đọc như lời khuyên điều trị).'
    luot_2: dung
    luot_2_nguon:
      - https://iris.who.int/server/api/core/bitstreams/6ded7ffd-9d69-493a-b48a-0b3e6250c173/content
      - https://pbgdpl.cantho.gov.vn/attachment/2200
    luot_2_ghi_chu: '''Xin ý kiến thứ hai'' không ghi thành chữ trong Luật nhưng không bị cấm và phù hợp quyền lựa chọn; giữ ở dạng lời khuyên.'
  - id: n24
    cau: Luật Khám bệnh, chữa bệnh 2023 (Điều 10) ghi quyền của người bệnh được giữ bí mật thông tin trong hồ sơ bệnh án và thông tin đời tư đã cung cấp, trừ một số trường hợp luật định; ở nhiều nước, ngoại lệ thường gặp là khi bạn hay người khác có nguy cơ bị hại.
    loai: lam-sang
    nguon:
      - luat-kbcb-d10
      - healthdirect-couns
    trich: Được giữ bí mật thông tin trong hồ sơ bệnh án và thông tin khác về đời tư mà người bệnh đã cung cấp cho người hành nghề trong quá trình khám bệnh, chữa bệnh, trừ trường hợp người bệnh đồng ý chia sẻ thông tin theo quy định của pháp luật hoặc trường hợp quy định tại khoản 3 và khoản 4 Điều 69 [Luật, Điều 10 khoản 2]; By law, a counsellor must keep what you tell them confidential … However, there are some exceptions. This includes times when you or another person is thought to be at risk of harm. [Healthdirect]
    vi_tri: Luật 15/2023/QH15 Điều 10 khoản 2; Healthdirect
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Những gì bạn chia sẻ được bảo mật theo quy định nghề nghiệp. Ngoại lệ hiếm hoi là khi có nguy cơ gây hại nghiêm trọng cho bạn hoặc người khác — người có chuyên môn có trách nhiệm can thiệp để bảo vệ an toàn." Ở Việt Nam, ngoại lệ do Điều 69 của Luật quy định (cung cấp hồ sơ bệnh án theo yêu cầu cơ quan có thẩm quyền), không phải đúng ngoại lệ "nguy cơ gây hại"; ngoại lệ ấy là của Úc (Healthdirect). Viết lại tách hai ý; bỏ "hiếm hoi". chỗ khó: quy định pháp lý về bảo mật; chưa đọc Điều 69 và các quy định riêng cho tham vấn ngoài cơ sở khám chữa bệnh.'
    luot_2: dung
    luot_2_nguon:
      - https://pbgdpl.cantho.gov.vn/attachment/2200
      - https://www.apa.org/ethics/code/ethics-code-2017.pdf
