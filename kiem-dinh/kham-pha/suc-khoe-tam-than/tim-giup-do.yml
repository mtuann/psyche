    luot_2_ghi_chu: 'NHS tách ''ý nghĩ tự tử'' (gọi 111, bác sĩ gia đình khẩn) khỏi ''nguy hiểm tính mạng'' (999). Ở Việt Nam không có tầng 111, nên đưa ''ý nghĩ tự làm hại'' vào mức giúp đỡ ngay là thận trọng và hợp lý. ''Đang say'' mơ hồ: nên hiểu là say kèm nguy hiểm.'
  - id: n38
    cau: 'Sớm, đừng chờ thêm: cảm xúc tiêu cực kéo dài từ hai tuần trở lên không dịu; ảnh hưởng rõ đến học, làm, ngủ, ăn, quan hệ; phải dùng rượu, chất kích thích để chịu đựng.'
    loai: loi-khuyen
    nguon:
      - who-dep-2026
      - apa-dep
    trich: Seek care if you have symptoms of depression. [WHO]
    vi_tri: WHO
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Trong vài ngày tới: cảm xúc tiêu cực kéo dài nhiều tuần…". "Nhiều tuần" thành "từ hai tuần trở lên" (n8). "Trong vài ngày tới" là lời khuyên của trang, không có nguồn chỉ khung thời gian; giữ vì không trái nguồn. chỗ khó. Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): "Sớm, trong vài ngày tới" không có nguồn cho khung thời gian (ghi chú lượt 2): viết mềm thành "Sớm, đừng chờ thêm".'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/mental-health/conditions/depression-in-adults/diagnosis/", "https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/low-mood-sadness-depression/", "https://www.samhsa.gov/find-support/how-to-cope/signs-of-needing-help", "https://www.who.int/news-room/fact-sheets/detail/depression" ]
    luot_2_ghi_chu: "Ba mốc khớp nguồn chính thức (NHS, SAMHSA, WHO). Ý 'phải dùng rượu, chất kích thích để chịu đựng' là dấu hiệu nên tìm giúp đỡ: SAMHSA nêu việc dùng rượu, ma túy ngày càng nhiều và hậu quả của nó; NHS và WHO khuyên không dùng rượu, chất để giải tỏa vì làm tình trạng tệ hơn. Câu là gợi ý tìm người nói chuyện, không phải tiêu chí chẩn đoán; không gần chẩn đoán miễn là trang giữ lời rào đi kèm (n47)."
