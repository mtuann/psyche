doi_chu:
  - cu: 'description "Bản nháp: các dấu hiệu nên tìm chuyên gia sức khỏe tâm thần, phân biệt bác sĩ tâm thần / nhà tâm lý lâm sàng / tham vấn viên…"'
    moi: description không có "Bản nháp", không dùng gạch chéo
    ly_do: Hồ sơ n1.
  - cu: Hộp warning "Bản nháp đang chờ rà soát chuyên môn"
    moi: Hộp note "Trước khi đọc" (nguy hiểm ngay thì xem Hỗ trợ) và ::tom-tat
    ly_do: Hồ sơ n2.
  - cu: 'Tự trải nghiệm: "đa số chúng ta cũng hành xử y hệt"; "tâm trí càng được can thiệp sớm thì thường càng đỡ vất vả"; hộp "Câu hỏi để tự kiểm" ("Psyche Zero"; "và sẽ không bao giờ có")'
    moi: '"nhiều người"; số của WHO; hộp "Câu hỏi để tự hỏi" ("Psyche"; "dù bạn có bị rối loạn nào hay không")'
    ly_do: Hồ sơ n3–n6.
  - cu: 'Các dấu hiệu: "kéo dài nhiều tuần… dù hoàn cảnh đã ổn hơn"; "(chơi game thâu đêm, tự làm đau...)"; "gọi 115"'
    moi: '"từ hai tuần trở lên"; "rượu, chất kích thích ngày càng nhiều"; "gọi cấp cứu", số ở trang Hỗ trợ; thêm câu "không phải để tự chẩn đoán"'
    ly_do: Hồ sơ n7–n13.
  - cu: 'Các vai trò: "đồng bộ với bảng"; tham vấn viên "hiện chưa có giấy phép hành nghề quốc gia riêng… phù hợp với những khó khăn ở mức độ nhẹ"; "Nhiều người được điều trị kết hợp"; "Một nơi làm việc nghiêm túc sẽ trả lời thẳng thắn"'
    moi: '"tóm từ bảng"; theo Luật KBCB 2023 như trang Hỗ trợ; "Có người"; "Nếu không thấy hợp với một người, việc tìm người khác là bình thường"'
    ly_do: Hồ sơ n14–n20.
  - cu: 'Buổi gặp đầu tiên: "dựa trên thực hành phổ biến"; "một số thay đổi trong sinh hoạt và hẹn tái khám"; bảo mật "theo quy định nghề nghiệp. Ngoại lệ hiếm hoi…"'
    moi: Dẫn Black Dog, Healthdirect; thêm câu hỏi về tự hại là thường lệ; bảo mật theo Luật KBCB 2023 Điều 10 và ngoại lệ thường gặp ở nhiều nước
    ly_do: Hồ sơ n21–n25.
  - cu: 'Rào cản: "Phần lớn người tìm đến… không có rối loạn nặng"; "nghe những câu chuyện như vậy mỗi ngày"; "đường dây nóng"'
    moi: Theo NHS ("không cần có chẩn đoán"); "được đào tạo để lắng nghe"; "các đường dây"
    ly_do: Hồ sơ n26–n29.
  - cu: 'Ba khung nhãn: Vững chắc (can thiệp sớm); Khá vững (trị liệu và thuốc); Đang tranh cãi (hệ thống ở Việt Nam)'
    moi: Khá vững (với trầm cảm, điều trị sớm hơn đi kèm kết quả tốt hơn); Khá vững (trị liệu và thuốc); khung "Ở Việt Nam" có số liệu WHO 2020 và nguồn
    ly_do: Hồ sơ n30–n36.
  - cu: 'Tóm tắt để hành động: "(gọi 115 / đến cấp cứu)"; say, ngộ độc trong ngoặc ở mục vài ngày'
    moi: Bỏ số; say, ngộ độc, hành vi nguy hiểm vào mục ngay lập tức
    ly_do: Hồ sơ n37–n40.
  - cu: Năm câu hỏi (câu 2 "chưa có giấy phép hành nghề quốc gia riêng"; câu 4 so với răng sâu; câu 5 "gọi 115", "ranh giới khẩn cấp duy nhất")
    moi: Sửa theo Luật KBCB 2023, NHS, Ghio 2014; bỏ số; bỏ "duy nhất"
    ly_do: Hồ sơ n41–n45.
  - cu: Mục Nguồn (trang Hỗ trợ "cũng đang chờ rà soát chuyên môn"; Luật KBCB 2023; DSM-5-TR)
    moi: Trang Hỗ trợ (đã kiểm), Luật KBCB 2023 Điều 10, 26, WHO, Atlas 2020, Ghio 2014, Ngo 2014, Black Dog, Healthdirect, NHS
    ly_do: Hồ sơ n46.
