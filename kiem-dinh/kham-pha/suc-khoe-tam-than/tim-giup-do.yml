    ly_do: 'Như hồ sơ tram-cam n32 và lo-au n32: các phân tích tổng hợp lớn cùng chiều (CBT với trầm cảm, thuốc với trầm cảm, CBT với lo âu so với giả dược), hướng dẫn WHO và NICE thống nhất; giới hạn: hiệu quả vừa, dị biệt lớn, sai lệch xuất bản, hơn một nửa người bệnh không đáp ứng với hướng đầu tiên. Khá vững.'
    ket_qua: da-sua
    ghi_chu: 'Khung cũ cùng nhãn và ý; thân cũ "Các hướng dẫn điều trị quốc tế ghi nhận…". Thêm "các phân tích tổng hợp lớn cho thấy hiệu quả ở mức vừa"; "phác đồ" thành "hướng điều trị". Review (17/11/2026): "các phân tích tổng hợp lớn cho thấy hiệu quả ở mức vừa" thành "hiệu quả trung bình ở mức từ nhỏ đến vừa", cho khớp tram-cam n32 (sau lượt 2) và co_so: thuốc chống trầm cảm SMD khoảng 0,30 (Cipriani 2018, nhỏ), CBT g 0,47–0,79 (Cuijpers 2023). Nhãn Khá vững giữ.'
    luot_2: dung
    luot_2_nguon:
      - https://www.who.int/news-room/fact-sheets/detail/depression
      - https://doi.org/10.1038/s41398-019-0460-3
    luot_2_ghi_chu: Nhãn Vững chắc (nếu có) hợp cho vế 'giúp được nhiều người' (nhiều phân tích tổng hợp, WHO). Câu không khuyên cá nhân dùng hay ngừng thuốc.
  - id: n33
    cau: Theo hồ sơ quốc gia trong WHO Mental Health Atlas 2020 (số liệu mới nhất của WHO chúng tôi tìm được, tính đến 11/2026), Việt Nam có khoảng 4 người làm chuyên môn sức khỏe tâm thần trên 100.000 dân.
    loai: thoi-su
