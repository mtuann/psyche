    trich: 'Mental health workers per 100 000 population, 2014 and 2020: 3.91 [2014] 4.16 [2020]'
    vi_tri: Atlas 2020 hồ sơ Việt Nam, tr. 2, biểu đồ nhân lực
    het_han: '2027-11-01'
    ket_qua: da-sua
    ghi_chu: 'Thêm mới, thay khung cũ "Đang tranh cãi: hệ thống chăm sóc sức khỏe tâm thần ở Việt Nam đang ở đâu?" (n36). Chữ trích từ PDF bị xáo thứ tự; đọc số theo biểu đồ (hai cột 2014, 2020, trục 3,70–4,20). Không tìm được hồ sơ quốc gia Atlas 2024 của Việt Nam trên trang WHO (đường dẫn kiểu 2020 trả 404, 16/11/2026). chỗ khó: lượt 2 nên mở PDF và nhìn biểu đồ.'
    luot_2: dung
    luot_2_nguon:
