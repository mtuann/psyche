  - id: n30
    cau: Với trầm cảm, được điều trị sớm hơn đi kèm kết quả điều trị tốt hơn.
    loai: nhan
    nguon:
      - ghio2014
    trich: Pooled data indicates the overall positive effect of shorter duration of untreated illness both in a patient's response to treatment (RR 1.70) and remission (RR 1.65). … in particular in patients presenting with a first episode of depression. … Only three studies reported comparable data … The heterogeneity of the selected studies was cause for limitations
    vi_tri: Ghio 2014, tóm tắt
    nhan: kha-vung
    co_so:
      - ghio2014
    ly_do: 'Tổng quan hệ thống và phân tích tổng hợp (Ghio 2014): thời gian không điều trị ngắn hơn đi kèm đáp ứng (RR 1,70) và thuyên giảm (RR 1,65) tốt hơn, các nghiên cứu khác cùng chiều. Giới hạn: chỉ 3 nghiên cứu gộp được, dị biệt cao, nghiên cứu quan sát (có thể nhiễu: người được điều trị sớm có thể khác người điều trị muộn), với trầm cảm tái phát bằng chứng yếu hơn. Khá vững.'
    ket_qua: da-sua
    ghi_chu: 'Khung cũ: "Vững chắc: can thiệp sớm thường cho kết quả tốt hơn can thiệp muộn" với thân "nguyên tắc chung được công nhận rộng rãi trong y khoa". Không có nguồn đạt thước đo Vững chắc cho mọi tình trạng sức khỏe tâm thần; với trầm cảm có tổng quan hệ thống Ghio 2014 nhưng chỉ 3 nghiên cứu gộp được, dị biệt cao, thiết kế quan sát. Hạ nhãn và thu hẹp ý chính về trầm cảm. chỗ khó: đổi nhãn (Vững chắc → Khá vững). Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): lượt 2 ghi dung; nhãn giữ Khá vững (mức tối đa lượt 2 đề nghị).'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1016/j.jad.2013.10.002
      - https://doi.org/10.1038/s41398-019-0460-3
    luot_2_ghi_chu: 'Câu viết ''đi kèm'' (tương quan) là đúng mức. Nhãn: chỉ một phân tích tổng hợp gộp 3 nghiên cứu quan sát, dị biệt lớn, cộng một tổng quan tường thuật; theo thước đo mục 4 tối đa là Khá vững. Nếu khung đang ghi Vững chắc thì là quá mạnh, cần hạ. Chỉ đọc tóm tắt.'
  - id: n31
    cau: 'Tổng quan Ghio 2014: chỉ 3 nghiên cứu đủ số liệu để gộp, các nghiên cứu khác nhau nhiều, nghiên cứu quan sát nên chưa tách được hẳn nguyên nhân.'
    loai: so-lieu
    nguon:
      - ghio2014
    trich: Ten studies were identified as meeting the inclusion criteria. Only three studies reported comparable data and were consequently used for the meta-analysis. … The heterogeneity of the selected studies was cause for limitations
    vi_tri: Ghio 2014, tóm tắt
    ket_qua: da-sua
    ghi_chu: Thêm mới. "Nghiên cứu quan sát" là suy từ đề tài (thời gian chưa điều trị không thể phân ngẫu nhiên); tóm tắt không ghi thiết kế.
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1016/j.jad.2013.10.002
    luot_2_ghi_chu: Chỉ đọc tóm tắt. Vế 'nghiên cứu quan sát' tóm tắt không ghi chữ, nhưng thời gian chưa điều trị không thể chia ngẫu nhiên nên các nghiên cứu này tất yếu là quan sát.
