    vi_tri: WHO; PAHO
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ngay lập tức (gọi 115 / đến cấp cứu)…"; tình trạng say, ngộ độc nằm trong ngoặc ở mục "vài ngày tới". Bỏ số 115; đưa say, ngộ độc, hành vi nguy hiểm lên mục "ngay lập tức". chỗ khó: danh sách tình huống khẩn cấp; chỉ "gây hại người khác" và "say, ngộ độc" là suy từ thông lệ cấp cứu (trang Hỗ trợ: "Nếu có nguy cơ bạo lực"), không có câu nguồn riêng.'
