  - id: n36
    cau: 'Khung "Đang tranh cãi: hệ thống chăm sóc sức khỏe tâm thần ở Việt Nam đang ở đâu?"'
    loai: nhan
    vi_tri: khung "Mức độ chắc chắn" của trang cũ
    nhan: tranh-cai
    co_so:
      - (đã bỏ)
    ly_do: Đã bỏ khỏi trang.
    ket_qua: da-bo
    ghi_chu: 'Bỏ khung nhãn: đây không phải một khẳng định có bằng chứng mâu thuẫn mà là mô tả hiện trạng (thời sự), dùng nhãn Đang tranh cãi là sai thước đo (chuan-kiem-dinh mục 4). Thay bằng khung "Ở Việt Nam" có số liệu và nguồn (n33–n35). Thân cũ: "Nhu cầu ngày càng được nói đến công khai, nhưng nguồn lực chuyên môn, khung pháp lý cho một số vai trò, và dịch vụ ở tuyến cơ sở vẫn đang trong quá trình hoàn thiện… đến tháng 10/2026." Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): lượt 2 sai cho khung cũ "Đang tranh cãi" về hệ thống ở Việt Nam. Khung đã bỏ ở lượt 1, thay bằng khung "Ở Việt Nam" không có nhãn (n33–n35), đúng đề nghị thứ nhất của lượt 2. Đã kiểm trang (17/11/2026): không còn khung nhãn nào nói về hệ thống ở Việt Nam. Giữ da-bo.'
    luot_2: sai
    luot_2_nguon:
      - https://cdn.who.int/media/docs/default-source/mental-health/mental-health-atlas-2020-country-profiles/vnm.pdf?sfvrsn=3c00af7f_4&download=true
      - https://doi.org/10.1891/0889-8391.28.3.156
    luot_2_ghi_chu: 'câu đúng: Bỏ nhãn ''Đang tranh cãi'' cho khung này. Nếu giữ khung nhãn, ý chính phải là một khẳng định, ví dụ: ''Khá vững: Việt Nam còn thiếu nhân lực sức khỏe tâm thần (khoảng 4 người trên 100.000 dân theo Atlas 2020 của WHO) và dịch vụ trị liệu tâm lý còn ít.''; Nhãn không khớp thước đo mục 4. ''Đang tranh cãi'' đòi bằng chứng chất lượng cao mâu thuẫn nhau. Các nguồn về hệ thống ở Việt Nam (Atlas WHO, Ngo 2014) cùng chiều về tình trạng thiếu nhân lực, và ý chính lại là một câu hỏi. Đây là mô tả hiện trạng (thời sự, cần mốc), không phải điểm khoa học tranh cãi.'
  - id: n37
    cau: 'Cần giúp đỡ ngay (gọi cấp cứu, đến khoa cấp cứu): ý nghĩ hay hành vi tự làm hại; cảm thấy có thể gây hại người khác; đang say, ngộ độc hay có hành vi nguy hiểm.'
