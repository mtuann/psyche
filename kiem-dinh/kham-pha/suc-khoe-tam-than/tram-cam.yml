    ly_do: Hồ sơ n53; báo cáo D1.2 mục 4.
  - cu: 'Mục «Chuyên gia phân biệt bằng cách nào?»: câu dẫn «Mô tả dưới đây chỉ để hiểu chung, không phải bảng để tự chấm điểm…», bốn gạch đầu dòng (hai dấu hiệu cốt lõi; các triệu chứng khác; ít nhất hai tuần, suy giảm rõ; loại trừ), đoạn «Cũng vì vậy, chẩn đoán là một quy trình…»'
    moi: 'Ba đoạn văn xuôi: chẩn đoán không phải tự đối chiếu với danh sách; cách người có chuyên môn đánh giá (trò chuyện, tiền sử, khám, xét nghiệm, cả bức tranh, loại trừ); dấu hiệu nên đi khám nói chung, link Tìm giúp đỡ và Hỗ trợ'
