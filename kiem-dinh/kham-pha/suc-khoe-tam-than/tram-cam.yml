    luot_2_ghi_chu: "ICD-11 CDDR (WHO 2024), giai đoạn trầm cảm (tr. 231): «not better accounted for by bereavement», «not a manifestation of another medical condition… not due to the effects of a substance or medication», cần «significant impairment»; rối loạn trầm cảm đơn/tái diễn đòi không có tiền sử giai đoạn hưng cảm, hỗn hợp, hưng cảm nhẹ (loại trừ lưỡng cực). Phần «trò chuyện, hỏi tiền sử» là mô tả quy trình đánh giá chung, hợp lý. Câu chống tự chẩn đoán, đạt mục 5."
