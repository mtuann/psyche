  - id: n13
    cau: ICD-11 và DSM-5-TR mô tả giai đoạn trầm cảm khá giống nhau.
    loai: lam-sang
    nguon:
      - icd11-cddr
      - apa-dep
    trich: The concurrent presence of at least five of the following characteristic symptoms occurring for most of the day, nearly every day, during a period lasting at least 2 weeks is required for diagnosis. At least one symptom from the affective cluster must be present. [ICD-11] / a diagnosis of depression requires that the above symptoms occur for most of the day, nearly every day, for more than two weeks, along with a clear change in day-to-day functioning [APA, danh sách 9 triệu chứng như DSM-5-TR]
    vi_tri: CDDR tr. 212–213; APA What is depression
    ket_qua: dung
    ghi_chu: 'chỗ khó: hai hệ thống cùng đòi ít nhất 5 triệu chứng trong 2 tuần, ít nhất một là khí sắc trầm hay mất hứng thú; ICD-11 thêm triệu chứng "tuyệt vọng về tương lai" (12 triệu chứng chia ba nhóm), DSM-5-TR có 9. "Khá giống nhau" là nhận xét của trang; không mở được bản in DSM-5-TR (chỉ tài liệu chính thức của APA cho người đọc).'
    luot_2: dung
    luot_2_nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
      - https://www.psychiatry.org/patients-families/depression/what-is-depression
    luot_2_ghi_chu: 'Khác biệt chính: ICD-11 có thêm ''tuyệt vọng về tương lai'' (10 triệu chứng so với 9). ''Khá giống nhau'' đúng mức.'
  - id: n14
    cau: 'Chẩn đoán không phải việc tự đối chiếu mình với một danh sách: chỉ người có chuyên môn mới chẩn đoán được (kèm link Hỗ trợ, ở đầu mục «Chuyên gia phân biệt bằng cách nào?»).'
    loai: loi-khuyen
    nguon:
      - apa-dep
      - apa-anx
    trich: A diagnosis is made by a qualified health professional.
    vi_tri: APA What are anxiety disorders, Treatment
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ ở cuối mục: "Điểm quan trọng nhất của danh sách này không phải để bạn tự chấm điểm cho mình". Đưa lên đầu danh sách và bỏ ngưỡng đếm triệu chứng (n47). Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): lượt 2 (n15) đề nghị danh sách đứng sát lời "chỉ người có chuyên môn mới chẩn đoán được": câu dẫn danh sách nay thêm "chỉ người có chuyên môn mới chẩn đoán được (xem trang Hỗ trợ)". Kế hoạch nâng cấp S5 (20/11/2026): chữ cũ «Mô tả dưới đây chỉ để hiểu chung, không phải bảng để tự chấm điểm: chỉ người có chuyên môn mới chẩn đoán được (xem trang Hỗ trợ)»; chữ mới «Nhưng chẩn đoán không phải việc tự đối chiếu mình với một danh sách: chỉ người có chuyên môn mới chẩn đoán được (xem trang Hỗ trợ)». Lý do: danh sách triệu chứng (n15–n17) đã bỏ, câu dẫn không còn trỏ tới danh sách; ý giữ nguyên. Lượt 2 cũ (dung) đã xóa, cần kiểm lại.'
    luot_2: dung
    luot_2_nguon: [ "https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content", "https://www.psychiatry.org/patients-families/depression/what-is-depression" ]
    luot_2_ghi_chu: "«CDDR, phần mở đầu: The CDDR are written to allow for the exercise of clinical judgement, and it is the diagnosing health professional who is responsible for developing a diagnostic formulation. APA: a healthcare professional will conduct a thorough diagnostic evaluation. An toàn: câu đúng tinh thần chuẩn mục 5, có link Hỗ trợ ngay đó.»"
  - id: n15
    cau: 'Cần có ít nhất một trong hai dấu hiệu cốt lõi: tâm trạng trầm buồn, hoặc mất hẳn hứng thú, niềm vui với các hoạt động vốn thích.'
    loai: lam-sang
    nguon:
      - icd11-cddr
      - apa-dep
    trich: At least one symptom from the affective cluster must be present. … Depressed mood … Markedly diminished interest or pleasure in activities, especially those normally found to be enjoyable to the individual
    vi_tri: CDDR tr. 212
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ cùng ý ("ít nhất một trong hai triệu chứng cốt lõi phải có mặt: (1) khí sắc trầm buồn…, hoặc (2) mất hẳn hứng thú"); diễn đạt lại. Kế hoạch nâng cấp S5 (20/11/2026): bỏ gạch đầu dòng «Cần có ít nhất một trong hai dấu hiệu cốt lõi…» khỏi trang. Lý do: bốn gạch đầu dòng gần như tiêu chí chẩn đoán, dễ thành bảng tự kiểm (kiem-sinh-hoc-cam-xuc.md [A][CG], phản biện P7); lô thận trọng tạm chờ chuyên gia. Nội dung vẫn đúng theo nguồn; thay bằng mô tả cách người có chuyên môn đánh giá (n17, n18, n19). Lượt 2 cũ đã xóa.'
    luot_2: dung
    luot_2_nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
    luot_2_ghi_chu: "gần chẩn đoán: viết theo dạng tiêu chí ('Cần có ít nhất…'). Nội dung đúng; nên giữ ngay cạnh lời 'chỉ chuyên gia mới chẩn đoán được' và không thêm số đếm triệu chứng."
  - id: n16
    cau: 'Chuyên gia xem xét thêm các triệu chứng: khó tập trung hay khó quyết định; cảm giác vô giá trị hay tội lỗi quá mức; tuyệt vọng về tương lai; ý nghĩ lặp lại về cái chết; giấc ngủ, thèm ăn hay cân nặng thay đổi rõ; mệt mỏi, thiếu năng lượng; bồn chồn hay chậm chạp đến mức người khác nhận thấy.'
    loai: lam-sang
    nguon:
      - icd11-cddr
      - who-dep-2026
    trich: Reduced ability to concentrate … or marked indecisiveness; Beliefs of low self-worth or excessive and inappropriate guilt; Hopelessness about the future; Recurrent thoughts of death …; Significantly disrupted sleep … or excessive sleep; Significant change in appetite … or significant weight change; Psychomotor agitation or retardation (observable by others …); Reduced energy, fatigue
    vi_tri: CDDR tr. 212–213 (nhóm nhận thức – hành vi và nhóm thực vật)
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ: "Bảy triệu chứng còn lại trong danh sách gồm…" (theo DSM-5-TR, đếm 7). Nay liệt kê theo ICD-11 (thêm "tuyệt vọng về tương lai"), không đếm, để không thành bảng tự chấm. Kế hoạch nâng cấp S5 (20/11/2026): bỏ gạch đầu dòng liệt kê các triệu chứng khác (khó tập trung, vô giá trị, tuyệt vọng, ý nghĩ về cái chết, ngủ ăn, mệt, bồn chồn) khỏi trang. Lý do như n15: danh sách triệu chứng gần nguyên tiêu chí ICD-11. Lượt 2 cũ đã xóa.'
    luot_2: dung
    luot_2_nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
    luot_2_ghi_chu: "gần chẩn đoán: danh sách triệu chứng gần như nguyên tiêu chí ICD-11; đã khung là 'chuyên gia xem xét', không có ngưỡng đếm. Nên giữ như vậy."
  - id: n17
    cau: 'Người có chuyên môn xem xét cả bức tranh: các thay đổi kéo dài bao lâu, có mặt gần như mỗi ngày hay không, và ảnh hưởng đến học tập, công việc, gia đình hay các mối quan hệ tới mức nào.'
    loai: lam-sang
    nguon:
      - icd11-cddr
    trich: The concurrent presence of at least five of the following characteristic symptoms occurring for most of the day, nearly every day, during a period lasting at least 2 weeks is required for diagnosis. At least one symptom from the affective cluster must be present. … The mood disturbance results in significant impairment in personal, family, social, educational, occupational or other important areas of functioning. If functioning is maintained, it is only through significant additional effort.
    vi_tri: CDDR tr. 212–213
    ket_qua: da-sua
    ghi_chu: 'Kế hoạch nâng cấp S5 (20/11/2026): chữ cũ (gạch đầu dòng) «Các triệu chứng kéo dài ít nhất hai tuần, gần như mỗi ngày, và gây suy giảm rõ trong học tập, công việc, gia đình hay các mối quan hệ (nếu vẫn làm được việc thì chỉ nhờ cố gắng nhiều hơn hẳn)»; chữ mới (văn xuôi) «Họ xem xét cả bức tranh: các thay đổi kéo dài bao lâu, có mặt gần như mỗi ngày hay không, và ảnh hưởng đến học tập, công việc, gia đình hay các mối quan hệ tới mức nào». Lý do: bỏ dạng tiêu chí thời gian (mốc hai tuần vẫn có ở mục «Điều gì đang xảy ra?» theo WHO, n8), chỉ nói những gì người có chuyên môn xem xét; không thêm khẳng định mới. Lượt 2 cũ đã xóa.'
    luot_2: dung
    luot_2_nguon: [ "https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content" ]
    luot_2_ghi_chu: "«CDDR, giai đoạn trầm cảm (tr. 212–213): most of the day, nearly every day, during a period lasting at least 2 weeks; significant impairment in personal, family, social, educational, occupational… functioning. Câu không nêu ngưỡng đếm triệu chứng: tốt.»"
  - id: n18
    cau: 'Người có chuyên môn cũng phải loại trừ các khả năng khác, như một bệnh cơ thể (ví dụ rối loạn nội tiết, bệnh thần kinh), tác dụng của thuốc, rượu hay chất kích thích, phản ứng tang chế bình thường, hay rối loạn lưỡng cực (khi người ấy từng có giai đoạn hưng cảm).'
    loai: lam-sang
    nguon:
      - icd11-cddr
      - apa-dep
    trich: The symptoms are not better accounted for by bereavement. The symptoms are not a manifestation of another medical condition (e.g. a brain tumour), and are not due to the effects of a substance or medication … There is no history of manic, mixed or hypomanic episodes, which would indicate the presence of a bipolar disorder. [ICD-11]; screen for underlying medical conditions that may mimic depression — such as hormonal imbalances, vitamin deficiencies, neurological problems and drug or alcohol use [APA]
    vi_tri: CDDR tr. 213, 244; APA, How Is Depression Treated?
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ba điều kiện đi kèm: … gây đau khổ hoặc suy giảm rõ rệt; không giải thích được bằng chất kích thích hay một bệnh cơ thể khác; và người đó chưa từng có giai đoạn hưng cảm". Thêm tang chế (ICD-11) và ví dụ bệnh cơ thể (APA). Kế hoạch nâng cấp S5 (20/11/2026): chữ cũ (gạch đầu dòng) «Chuyên gia phải **loại trừ** các khả năng khác: một bệnh cơ thể…, và rối loạn lưỡng cực…»; chữ mới (văn xuôi) «Họ cũng phải loại trừ các khả năng khác, như một bệnh cơ thể…, hay rối loạn lưỡng cực…». Lý do: chuyển từ danh sách sang văn xuôi; nội dung giữ. Lượt 2 cũ đã xóa.'
    luot_2: dung
    luot_2_nguon: [ "https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content", "https://www.psychiatry.org/patients-families/depression/what-is-depression" ]
    luot_2_ghi_chu: "«CDDR tr. 213–214: not better accounted for by bereavement; not a manifestation of another medical condition (e.g. a brain tumour), not due to a substance or medication…, including withdrawal; 6A70 (tr. 244): no history of manic, mixed or hypomanic episodes, which would indicate… bipolar disorder. Ví dụ rối loạn nội tiết, bệnh thần kinh khớp APA (hormonal imbalances, neurological problems, drug or alcohol use). Phần tang chế: ICD-11 nói triệu chứng trầm cảm trong tang chế bình thường thì không tính, nhưng giai đoạn trầm cảm vẫn có thể chồng lên tang chế; câu «loại trừ phản ứng tang chế bình thường» đúng.»"
  - id: n19
    cau: 'Chẩn đoán do người có chuyên môn thực hiện: trò chuyện kỹ, hỏi tiền sử, khám cơ thể và khi cần làm xét nghiệm để loại trừ bệnh khác.'
    loai: lam-sang
    nguon:
      - apa-dep
    trich: To diagnose depression, a healthcare professional will conduct a thorough diagnostic evaluation that includes a comprehensive interview to discuss your symptoms in addition to your personal, medical and family histories. Moreover, a physical examination should be performed … Laboratory and imaging tests may also be included in the evaluation as part of the medical screening.
    vi_tri: APA, How Is Depression Treated?
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chẩn đoán là một quy trình có cấu trúc, do người có chuyên môn thực hiện sau khi trò chuyện và loại trừ nhiều khả năng khác". Thêm khám cơ thể, xét nghiệm theo APA. Kế hoạch nâng cấp S5 (20/11/2026): câu chuyển lên đầu đoạn thứ hai của mục, bỏ «Cũng vì vậy,» ở đầu; chữ của nhận định không đổi, giữ lượt 2 cũ. Cùng đoạn với n17, n18 nên đưa vào danh sách lượt 2 S5.'
    luot_2: dung
    luot_2_nguon: [ "https://www.psychiatry.org/patients-families/depression/what-is-depression" ]
    luot_2_ghi_chu: "«APA: comprehensive interview… personal, medical and family histories. Moreover, a physical examination should be performed to screen for underlying medical conditions… Laboratory and imaging tests may also be included.»"
  - id: n20
    cau: 'Hai người cùng «buồn» có thể ở hai tình trạng rất khác nhau, và một người không có đủ các dấu hiệu mà các hệ thống chẩn đoán mô tả vẫn có thể cần được giúp đỡ.'
    loai: loi-khuyen
    nguon:
      - nhs-tt
      - icd11-cddr
    trich: You do not need to have a diagnosed mental health condition. [NHS, về việc dùng dịch vụ trị liệu tâm lý]
    vi_tri: NHS talking therapies, How to get talking therapies
    ket_qua: da-sua
    ghi_chu: 'Thêm vế sau ("người không có đủ các dấu hiệu vẫn có thể cần được giúp đỡ") để danh sách không bị đọc như ngưỡng "phải đủ mới được giúp". Kế hoạch nâng cấp S5 (20/11/2026): chữ cũ «…và một người không có đủ các dấu hiệu trên vẫn có thể cần được giúp đỡ»; chữ mới «…không có đủ các dấu hiệu mà các hệ thống chẩn đoán mô tả…». Lý do: danh sách «trên» đã bỏ. Lượt 2 cũ đã xóa.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nice.org.uk/guidance/ng222/chapter/Recommendations", "https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content" ]
    luot_2_ghi_chu: "«NICE NG222: Less severe depression encompasses subthreshold and mild depression, và có các lựa chọn điều trị cho nhóm này (bảng 1), nên người chưa đủ tiêu chí vẫn có thể được giúp. CDDR: một mức buồn bã là phản ứng bình thường, phân biệt bằng severity, range and duration, nên hai người cùng buồn có thể khác nhau.»"
  - id: n21
    cau: WHO kể tên kích hoạt hành vi, CBT, liệu pháp liên cá nhân (IPT) và liệu pháp giải quyết vấn đề là liệu pháp tâm lý hiệu quả với trầm cảm, và xem liệu pháp tâm lý là hướng điều trị đầu tiên.
    loai: lam-sang
    nguon:
      - who-dep-2026
      - nice-ng222
    trich: 'Psychological treatments are the first treatments for depression. … Effective psychological treatments for depression include: behavioural activation, cognitive behavioural therapy, interpersonal psychotherapy, problem-solving therapy.'
    vi_tri: WHO, Diagnosis and treatment; NICE NG222 bảng 1, 2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "liệu pháp nhận thức – hành vi (CBT) giúp nhận diện…; IPT…; kích hoạt hành vi… Các hướng dẫn như NICE (Anh) xếp các liệu pháp này ở vị trí ưu tiên, đặc biệt với trầm cảm nhẹ đến trung bình." NICE NG222 xếp tự giúp có hướng dẫn đứng đầu bảng 1 (trầm cảm nhẹ hơn) và kết hợp CBT với thuốc đứng đầu bảng 2 (nặng hơn); câu "xếp ưu tiên" không khớp hẳn. Nay dẫn WHO.'
    luot_2: dung
    luot_2_nguon:
