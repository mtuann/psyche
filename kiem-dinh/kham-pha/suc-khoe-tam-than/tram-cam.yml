    nguon:
      - icd11-cddr
    trich: The concurrent presence of at least five of the following characteristic symptoms occurring for most of the day, nearly every day, during a period lasting at least 2 weeks is required for diagnosis. At least one symptom from the affective cluster must be present.
    vi_tri: CDDR tr. 212
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ (thân bài): "một giai đoạn trầm cảm nặng được xem xét khi trong cùng một khoảng hai tuần, người đó có từ năm triệu chứng trở lên trong một danh sách chín triệu chứng…"; câu hỏi 2: "Theo DSM-5-TR, để xem xét chẩn đoán… cần điều kiện nào? … Từ năm triệu chứng trở lên…". Nội dung đúng (ICD-11 cũng đòi ít nhất 5), nhưng bỏ ngưỡng đếm và câu hỏi về ngưỡng: danh sách kèm ngưỡng đếm là bảng tự chấm điểm, trái quy tắc không có công cụ tự chẩn đoán (chuan-kiem-dinh mục 5, lời giao D7-L1). Thân bài giữ mô tả các nhóm triệu chứng (n15–n18), không đếm. Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): lượt 2 khong-chac vì không mở được văn bản tiêu chí DSM; ngưỡng đã bỏ khỏi trang ở lượt 1, giữ da-bo. Đã kiểm trang: không còn "5/9", "năm triệu chứng" (grep 17/11/2026).'
    luot_2: khong-chac
    luot_2_nguon:
      - https://www.psychiatry.org/patients-families/depression/what-is-depression
    luot_2_ghi_chu: 'Ngưỡng 5/9 là tiêu chí A quen thuộc của DSM-5/DSM-5-TR, nhưng văn bản tiêu chí ở psychiatryonline.org bị chặn (403) và tài liệu mở của APA không nêu con số 5; chỉ thấy ở bản in lại thứ cấp. Theo yêu cầu chỉ dùng tài liệu chính thức của APA nên ghi khong-chac. gần chẩn đoán: con số ''năm trong chín triệu chứng'' là ngưỡng đếm, dễ thành bảng tự chấm; nên bỏ con số khỏi thân bài và câu hỏi, hay giữ ở mục Nguồn kèm lời ''chỉ chuyên gia áp dụng''.'
  - id: n48
    cau: 'Câu hỏi 1: theo ICD-11, giai đoạn trầm cảm khác nỗi buồn ở mức độ, độ lan rộng, thời gian kéo dài (ít nhất hai tuần, gần như mỗi ngày, suy giảm rõ); trầm cảm vẫn có thể bắt đầu sau một biến cố.'
