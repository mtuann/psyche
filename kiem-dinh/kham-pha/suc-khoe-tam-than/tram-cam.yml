      - https://www.who.int/news-room/fact-sheets/detail/depression
      - https://www.nice.org.uk/guidance/ng222/chapter/Recommendations
  - id: n51
    cau: 'Câu hỏi 4: câu "Cố lên, do em yếu đuối thôi" ít giúp được vì trầm cảm không phải dấu hiệu yếu đuối; điều người thân có thể làm là lắng nghe không phán xét, kiên nhẫn, khuyến khích và giúp tìm người có chuyên môn.'
    loai: loi-khuyen
    nguon:
      - paho-living
      - who-dep-2026
    trich: Depression can happen to anyone and is not a sign of weakness. … Make it clear that you want to help, listen without judgement, and offer support. … Encourage them to seek professional help and offer to go with them to appointments. … Be patient
    vi_tri: WHO/PAHO 2021
    ket_qua: da-sua
    ghi_chu: 'Câu cũ (câu hỏi 5): "Người thân nói cố lên, nghĩ tích cực vào… Vì sao lời khuyên này có hại? → Vì nó tầm thường hóa… khiến người bệnh thêm mặc cảm và ít dám tìm sự giúp đỡ". WHO/PAHO lại khuyên người thân "Encourage them to focus on the positive", nên "nghĩ tích cực" không phải điều có hại; đổi lời trong câu hỏi thành "do em yếu đuối thôi" (trái với "not a sign of weakness") và bỏ "có hại", "thêm mặc cảm" (không nguồn).'
    luot_2: dung
    luot_2_nguon:
      - https://www.nhs.uk/mental-health/conditions/depression-in-adults/overview/
    luot_2_ghi_chu: Phần việc người thân nên làm (lắng nghe, kiên nhẫn, giúp tìm người có chuyên môn) là lời khuyên chung, không trái nguồn nào; lượt 2 không tìm được một câu nguồn nói đủ cả bốn ý.
  - id: n52
    cau: Giải thích câu hỏi 4 nhắc mục "Khi người thân đang gặp khó khăn" ở trang Hỗ trợ.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên src/content/docs/ho-tro/index.md: có mục "## Khi người thân đang gặp khó khăn". review (17/11/2026): đã kiểm trên trang và dist/ (npm run build:xem), khớp.'
    review: dung
  - id: n53
    cau: Mục Nguồn cũ ghi DSM-5-TR "5/9 triệu chứng trong hai tuần" và NICE NG222 "SSRI/SNRI là thuốc đầu tay cho trầm cảm trung bình–nặng"; dòng "Trang Hỗ trợ của Psyche Zero" nằm trong mục Nguồn.
    loai: lam-sang
    nguon:
      - nice-ng222
    vi_tri: mục Nguồn
    ket_qua: da-sua
    ghi_chu: 'Chú thích nguồn cũ có hai điều: ngưỡng 5/9 (bỏ cùng n47) và "SSRI/SNRI là thuốc đầu tay cho trầm cảm trung bình–nặng" (NG222 không xếp như vậy, xem n23). Mục Nguồn mới chỉ liệt kê nguồn, không chú thích nội dung. Dòng tham chiếu trang Hỗ trợ (không phải nguồn) bỏ khỏi mục Nguồn, theo báo cáo D1.2 mục 4; link Hỗ trợ đã ở thân bài. Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): lượt 2 qua-manh cho chú thích nguồn cũ ("SSRI/SNRI đầu tay", "5/9"). Đã kiểm trang hiện tại (grep 17/11/2026): không còn chữ "đầu tay", "5/9" hay ngưỡng đếm; mục Nguồn không có chú thích nội dung. Giữ da-sua.'
    luot_2: qua-manh
    luot_2_nguon:
      - https://www.nice.org.uk/guidance/ng222/chapter/Recommendations
    luot_2_ghi_chu: 'câu đúng: NICE NG222 (2022): với trầm cảm nặng hơn (vừa và nặng), thuốc chống trầm cảm có thể là SSRI, SNRI hay thuốc khác; SSRI nên được cân nhắc là lựa chọn đầu tiên cho phần lớn người bệnh.; NICE chỉ đặt SSRI làm lựa chọn đầu, không xếp SNRI ngang hàng; và thuốc không phải lựa chọn đầu tay duy nhất. Vế DSM-5-TR ''5/9 triệu chứng trong hai tuần'': khong-chac như n47 (không mở được tài liệu chính thức của APA có con số 5). gần chẩn đoán: mục Nguồn có ngưỡng đếm ''5/9'', cùng lý do như n47.'
  - id: n54
    cau: 'Không cần tự xác định mình đã «đủ» hay chưa: khi tâm trạng nặng nề kéo dài và bắt đầu ảnh hưởng đến cuộc sống thì nên gặp người có chuyên môn; có ý nghĩ về cái chết hay tự làm hại bản thân thì tìm giúp đỡ ngay (kèm link bài Khi nào nên tìm sự giúp đỡ chuyên môn? và trang Hỗ trợ).'
    loai: loi-khuyen
    nguon:
      - who-dep-2026
      - nhs-tt
    trich: 'Seek care if you have symptoms of depression. … If you think you are in immediate danger of harming yourself, contact any available emergency services or a crisis line. [WHO]; You do not need to have a diagnosed mental health condition. [NHS]'
    vi_tri: WHO, Self-care; NHS talking therapies, How to get talking therapies
    ket_qua: da-sua
    ghi_chu: 'Kế hoạch nâng cấp S5 (20/11/2026): thêm mới ở cuối mục «Chuyên gia phân biệt bằng cách nào?», thay cho danh sách triệu chứng đã bỏ: dấu hiệu nên đi khám nói chung, không liệt kê triệu chứng, dẫn tới bài Tìm giúp đỡ và trang Hỗ trợ. Cùng ý với n42, n43 ở mục «Khi nào nên tìm sự giúp đỡ» (dùng lại nguồn và trích của hai nhận định ấy); không lặp nguyên mục. Phần link là chuyện của site (tests/link.test.mjs kiểm).'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/mental-health/conditions/depression-in-adults/overview/", "https://www.nice.org.uk/guidance/ng222/chapter/Recommendations" ]
    luot_2_ghi_chu: "«NHS: It's important to seek help… if you think you may be depressed… it's best not to delay. Lời khuyên tìm giúp đỡ ngay khi có ý nghĩ tự hại là chuẩn chung của các hướng dẫn. An toàn: câu tránh được việc tự chấm ngưỡng («không cần tự xác định mình đã đủ hay chưa»): tốt.»"
doi_chu:
  - cu: 'description: "Bản nháp: phân biệt nỗi buồn thông thường với rối loạn trầm cảm nặng theo DSM-5-TR, các hướng điều trị có bằng chứng ở mức liệt kê, và những ngộ nhận phổ biến."'
    moi: 'description: "Nỗi buồn thông thường khác rối loạn trầm cảm ở mức độ, độ lan rộng và thời gian kéo dài, theo mô tả của ICD-11 và DSM-5-TR; …"'
