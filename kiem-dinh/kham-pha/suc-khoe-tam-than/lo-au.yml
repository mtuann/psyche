    nhanh: mo/sktt-than-trong-wt
    ly_do: "Kế hoạch nâng cấp S5 (20/11/2026): lô thận trọng tạm, chờ chuyên gia: mục «Điều gì đang xảy ra?» viết lại ba gạch đầu dòng (lo âu lan tỏa, hoảng sợ, lo âu xã hội) ở mức khái niệm, bỏ danh sách triệu chứng và mốc thời gian (kiem-sinh-hoc-cam-xuc.md [A][CG]; phản biện P7)"
