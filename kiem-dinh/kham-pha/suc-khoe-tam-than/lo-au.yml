    ghi_chu: 'Chữ cũ: "Nếu có cơn hoảng sợ khiến bạn tưởng mình sắp chết, việc đi khám để loại trừ nguyên nhân cơ thể và được đánh giá đúng là bước hợp lý." Viết rõ hơn: triệu chứng như đau tim thì gọi cấp cứu (an toàn: không tự kết luận là "chỉ hoảng sợ"). chỗ khó: lời khuyên khi có triệu chứng cơ thể.'
