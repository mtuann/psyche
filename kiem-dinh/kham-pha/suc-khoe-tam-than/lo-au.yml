    trich: Essential (required) features … (6B00, 6B01, 6B04) [ICD-11]; As identified in the Diagnostic and Statistical Manual of Mental Disorders (DSM-5-TR), anxiety disorders include the following [APA]
    vi_tri: CDDR tr. 266–285; APA
    nhan: vung-chac
    co_so:
