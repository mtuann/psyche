nhan_dinh:
  - id: n1
    cau: 'Mô tả: lo lắng bình thường khác rối loạn lo âu thế nào theo ICD-11 và DSM-5-TR (lo âu lan tỏa, hoảng sợ, lo âu xã hội); vòng luẩn quẩn tránh né; các hướng điều trị ở mức giới thiệu chung.'
    loai: lam-sang
    nguon:
      - icd11-cddr
      - apa-anx
    trich: Anxiety and worry are normal emotional/cognitive states that commonly occur when people are under stress. At optimal levels, anxiety and worry may help to direct problem-solving efforts, focus attention adaptively and increase alertness. Normal anxiety and worry are usually sufficiently self-regulated that they do not interfere with functioning or cause marked distress. In generalized anxiety disorder, the anxiety or worry is excessive, persistent and intense, and may have a significant negative impact on functioning.
    vi_tri: CDDR tr. 266–267
    ket_qua: da-sua
    ghi_chu: 'Mô tả cũ: "Bản nháp: các rối loạn lo âu chính theo DSM-5-TR (lo âu lan tỏa, hoảng sợ, ám ảnh sợ xã hội)…". Bỏ "Bản nháp"; thêm ICD-11.'
    luot_2: dung
    luot_2_nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
      - https://www.psychiatry.org/patients-families/anxiety-disorders/what-are-anxiety-disorders
  - id: n2
    cau: Chỉ người có chuyên môn mới chẩn đoán được rối loạn lo âu; bài không dùng để tự chẩn đoán (lời dẫn đầu trang, link Hỗ trợ).
    loai: lam-sang
