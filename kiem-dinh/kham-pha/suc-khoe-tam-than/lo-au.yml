  - id: n5
    cau: Lo lắng tương xứng với tình huống và tự hết khác với lo lắng quá mức, khó kiểm soát, kéo dài, lan sang nhiều mặt cuộc sống; đó là kiểu lo lắng các hệ thống chẩn đoán dùng để mô tả rối loạn lo âu khi nó gây khổ sở hay suy giảm rõ.
    loai: lam-sang
    nguon:
      - icd11-cddr
      - who-anx-2026
    trich: Anxiety and worry are normal emotional/cognitive states that commonly occur when people are under stress. At optimal levels, anxiety and worry may help to direct problem-solving efforts, focus attention adaptively and increase alertness. Normal anxiety and worry are usually sufficiently self-regulated that they do not interfere with functioning or cause marked distress. In generalized anxiety disorder, the anxiety or worry is excessive, persistent and intense, and may have a significant negative impact on functioning. [ICD-11]; people with anxiety disorders often experience fear and worry that is both intense and excessive … They are difficult to control, cause significant distress and can last a long time if untreated. [WHO]
    vi_tri: CDDR tr. 266–267; WHO Overview
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đó là dạng mà y học gọi là rối loạn lo âu". Thêm điều kiện khổ sở hay suy giảm rõ (ICD-11, WHO).'
    luot_2: dung
    luot_2_nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
  - id: n6
    cau: 'Ẩn dụ: lo lắng là hệ thống báo động bình thường; rối loạn lo âu như chiếc báo động reo cả lúc không có cháy.'
    loai: dinh-nghia
    nguon:
      - icd11-cddr
    trich: Anxiety and worry are normal emotional/cognitive states that commonly occur when people are under stress. At optimal levels, anxiety and worry may help to direct problem-solving efforts, focus attention adaptively and increase alertness. Normal anxiety and worry are usually sufficiently self-regulated that they do not interfere with functioning or cause marked distress. In generalized anxiety disorder, the anxiety or worry is excessive, persistent and intense, and may have a significant negative impact on functioning.
    vi_tri: CDDR tr. 266–267
    ket_qua: dung
    ghi_chu: Ẩn dụ của trang cũ, giữ; khớp ICD-11 (lo âu bình thường có ích, rối loạn khi quá mức, kéo dài).
    luot_2: dung
    luot_2_nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
    luot_2_ghi_chu: Ẩn dụ, không phải định nghĩa chuẩn; không trái nguồn.
