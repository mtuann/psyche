  - id: n32
    cau: 'CBT, kể cả các kỹ thuật tiếp xúc, giảm triệu chứng của nhiều rối loạn lo âu: khá vững.'
    loai: nhan
    nguon:
      - carpenter2018
      - who-anx-2026
    vi_tri: khung "Mức độ chắc chắn"
    nhan: kha-vung
    co_so:
      - carpenter2018
      - craske2014
      - who-anx-2026
    ly_do: 'Phân tích tổng hợp 41 thử nghiệm có nhóm giả dược: hiệu quả vừa (g = 0,56), cùng chiều với WHO và NICE. Giới hạn: hiệu quả khác nhau nhiều giữa các rối loạn (nhỏ đến vừa với hoảng sợ, lo âu xã hội), mạnh hơn ở mẫu hoàn tất so với phân tích theo ý định điều trị, nhiều người không đỡ hay tái phát (Craske 2014). Khá vững.'
    ket_qua: da-sua
    ghi_chu: 'Ý chính cũ: "CBT — đặc biệt là tiếp xúc dần dần — có hiệu quả với lo âu" (Khá vững). Giữ nhãn; sửa ý chính và thân theo Carpenter 2018. Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): đổi "nhất là" thành "kể cả" theo câu đúng của lượt 2 (Carpenter 2018: tiếp xúc hơn các kỹ thuật khác chưa có ý nghĩa thống kê). Review (17/11/2026): "nhất là" thành "kể cả" khớp câu đúng của lượt 2; lượt 2 bổ sung dung; nhãn Khá vững đạt thước đo (Carpenter 2018 g = 0,56 so với giả dược, khác nhau giữa các rối loạn). Đạt.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/29451967/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC12004241/", "https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders" ]
    luot_2_ghi_chu: "Có nhiều phân tích tổng hợp cùng chiều, nhưng hiệu quả so với giả dược chỉ vừa, phụ thuộc loại đối chứng (danh sách chờ thổi phồng), nhỏ hơn với hoảng sợ, lo âu xã hội: nhãn Khá vững hợp thước đo, không quá mạnh. Trích Carpenter từ tóm tắt (PubMed)."
  - id: n33
    cau: Theo WHO, rối loạn lo âu là kết quả của sự tương tác phức tạp giữa yếu tố xã hội, tâm lý và sinh học; người từng bị bạo hành, mất mát nặng hay trải nghiệm bất lợi dễ bị hơn.
    loai: lam-sang
    nguon:
      - who-anx-2026
    trich: Anxiety disorders, like other mental health conditions, result from a complex interaction of social, psychological and biological factors. Anyone can have an anxiety disorder, but people who have lived through abuse, severe losses or other adverse experiences are more likely to develop one.
    vi_tri: WHO, Contributing factors and prevention
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Lo âu có yếu tố sinh học (tính khí, gen) nhưng cũng gắn chặt với stress kéo dài, chấn thương và môi trường sống." Dẫn WHO.'
    luot_2: dung
    luot_2_nguon:
      - https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders
  - id: n34
    cau: Phân tích tổng hợp các nghiên cứu sinh đôi ước tính gen giải thích khoảng 43% khác biệt về nguy cơ rối loạn hoảng sợ và 32% với lo âu lan tỏa; với rối loạn hoảng sợ, phần còn lại chủ yếu thuộc về môi trường riêng của mỗi người; với lo âu lan tỏa ở nữ, môi trường chung của gia đình có thể cũng góp phần.
    loai: so-lieu
    nguon:
      - hettema2001
    trich: These yielded heritabilities of 0.43 for panic disorder and 0.32 for generalized anxiety disorder. For panic disorder, the remaining variance in liability could be attributed primarily to nonshared environment. For generalized anxiety disorder, this was true for men, but for women, a potentially significant role for common familial environment was also seen.
    vi_tri: Hettema 2001, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Thêm mới. Vế "phần còn lại phần lớn đến từ trải nghiệm riêng" đúng với hoảng sợ và với lo âu lan tỏa ở nam; ở nữ, môi trường gia đình chung có thể có vai trò. chỗ khó: câu tóm có thể quá gọn; lượt 2 xem có cần thêm "ở nam" không. Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): sửa vế sau theo Hettema 2001 (lượt 2 qua-manh): chỉ với hoảng sợ phần còn lại chủ yếu là môi trường riêng; với lo âu lan tỏa ở nữ, môi trường chung có thể góp phần. Bỏ "trải nghiệm riêng" (môi trường riêng trong mô hình sinh đôi gồm cả sai số đo), dùng "môi trường riêng". Review (17/11/2026): câu trên trang khớp tóm tắt Hettema 2001 (lượt 2 bổ sung dung), "có thể cũng góp phần" đúng mức "potentially". Đạt.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/11578982/" ]
    luot_2_ghi_chu: "Khớp từng ý. Chỉ đọc tóm tắt; tóm tắt có đủ các con số. 'Có thể cũng góp phần' đúng mức thận trọng của bài ('potentially', kết luận: 'the role of family environment in generalized anxiety disorder is uncertain')."
  - id: n35
    cau: Rối loạn lo âu hình thành từ nhiều yếu tố cùng tác động (gen, trải nghiệm, hoàn cảnh); ở mỗi người cụ thể, chưa thể tách rõ yếu tố nào góp bao nhiêu.
    loai: nhan
    nguon:
      - who-anx-2026
      - hettema2001
    vi_tri: khung "Mức độ chắc chắn"
    nhan: kha-vung
    co_so:
