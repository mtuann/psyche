    ghi_chu: 'Chữ cũ: "Sai về lâu dài. Tránh né… duy trì và khuếch đại nỗi sợ, vì não không bao giờ có cơ hội học rằng thứ đó an toàn." Làm mềm ("thường là không", "có thể giữ") theo Hofmann & Hay (có lúc tránh né là thích nghi).'
    luot_2: dung
    luot_2_nguon:
      - https://europepmc.org/article/MED/29550689
      - https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders
  - id: n37
    cau: 'Ngộ nhận "chỉ cần bình tĩnh, hít thở sâu": kỹ năng thư giãn có thể giúp giảm triệu chứng, nhưng rối loạn lo âu là tình trạng kéo dài, khó kiểm soát; điều trị có bằng chứng là các liệu pháp có cấu trúc như CBT, và khi cần là thuốc do bác sĩ kê.'
    loai: lam-sang
    nguon:
