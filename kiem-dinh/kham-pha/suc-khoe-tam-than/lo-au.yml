    vi_tri: APA
    ket_qua: da-sua
    ghi_chu: 'Thêm mới (lời giao D7-L1: danh sách dấu hiệu kèm "chỉ chuyên gia mới chẩn đoán được").'
    luot_2: dung
    luot_2_nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
  - id: n8
    cau: ICD-11 ghi rằng ở mức vừa phải, lo âu và lo lắng giúp tập trung giải quyết vấn đề và tỉnh táo hơn; lo lắng bình thường thường tự điều chỉnh được, không cản trở cuộc sống.
    loai: dinh-nghia
    nguon:
      - icd11-cddr
    trich: Anxiety and worry are normal emotional/cognitive states that commonly occur when people are under stress. At optimal levels, anxiety and worry may help to direct problem-solving efforts, focus attention adaptively and increase alertness. Normal anxiety and worry are usually sufficiently self-regulated that they do not interfere with functioning or cause marked distress. In generalized anxiety disorder, the anxiety or worry is excessive, persistent and intense, and may have a significant negative impact on functioning.
    vi_tri: CDDR tr. 266–267, 6B00 Boundary with normality
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Lo lắng vốn là một cơ chế sinh tồn: tim đập nhanh, cơ căng, đầu óc cảnh giác — tất cả để chuẩn bị cho ta đối phó với nguy hiểm." Viết lại theo ICD-11.'
    luot_2: dung
    luot_2_nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
    luot_2_ghi_chu: ICD-11 viết 'optimal levels' (mức tối ưu); 'mức vừa phải' là cách dịch chấp nhận được.
  - id: n9
    cau: Rối loạn khi nỗi sợ hay lo lắng mạnh, quá mức, kéo dài, khó kiểm soát, gây khổ sở hay cản trở việc học, việc làm, gia đình và các mối quan hệ.
    loai: lam-sang
    nguon:
      - who-anx-2026
    trich: people with anxiety disorders often experience fear and worry that is both intense and excessive. … They are difficult to control, cause significant distress and can last a long time if untreated. Anxiety disorders interfere with daily activities and can impair a person's family, social and school or working life.
    vi_tri: WHO Overview
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "khi hệ thống này kích hoạt quá mạnh, quá thường xuyên, hoặc trước những thứ không thực sự nguy hiểm, và bắt đầu chiếm lấy cuộc sống". Viết theo WHO.'
    luot_2: dung
    luot_2_nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
      - https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders
  - id: n10
    cau: Tính đến 11/2026, WHO ước tính năm 2023 có khoảng 470 triệu người trên thế giới bị rối loạn lo âu, nhiều hơn mọi nhóm rối loạn tâm thần khác, và chỉ khoảng 1 trong 4 người cần điều trị được điều trị.
    loai: thoi-su
    nguon:
      - who-anx-2026
    trich: In 2023, 470 million people in the world had an anxiety disorder, making anxiety disorders the most common of all mental disorders. Although highly effective treatments for anxiety disorders exist, only about 1 in 4 people in need (27.6%) receive any treatment.
    vi_tri: WHO Overview (tờ thông tin cập nhật 15/9/2026)
    het_han: '2027-11-01'
    ket_qua: da-sua
    ghi_chu: 'Thêm mới (lời giao: số liệu dịch tễ là thời sự, có mốc và hạn).'
    luot_2: dung
    luot_2_nguon:
      - https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders
    luot_2_ghi_chu: 'Thời sự: kiểm ngày 16/11/2026. WHO viết ''receive any treatment'' (nhận bất kỳ điều trị nào).'
  - id: n11
    cau: Có nhiều rối loạn lo âu khác nhau, tùy nỗi sợ tập trung vào đâu; ba dạng thường được nhắc là lo âu lan tỏa, hoảng sợ, lo âu xã hội.
    loai: lam-sang
    nguon:
      - who-anx-2026
    trich: 'There are several different kinds of anxiety disorders, including: generalized anxiety disorder …; panic disorder …; social anxiety disorder …; agoraphobia …; separation anxiety disorder …; specific phobias …; and selective mutism'
    vi_tri: WHO, Symptoms and patterns
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ba dạng phổ biến nhất". Không có nguồn xếp ba dạng này là phổ biến nhất (ám ảnh sợ đặc hiệu thường phổ biến hơn); đổi thành "thường được nhắc đến".'
    luot_2: dung
    luot_2_nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
  - id: n12
    cau: 'Rối loạn lo âu lan tỏa: lo lắng quá mức về nhiều chuyện khác nhau của đời sống hằng ngày (công việc, tiền bạc, sức khỏe, gia đình…), hoặc cảm giác bất an không gắn với chuyện gì cụ thể.'
    loai: lam-sang
    nguon:
      - icd11-cddr
      - apa-anx
    trich: 'Marked symptoms of anxiety are required for diagnosis, manifested in either: general apprehensiveness that is not restricted to any particular environmental circumstance (i.e. "free-floating anxiety"); or excessive worry (apprehensive expectation) about negative events occurring in several different aspects of everyday life (e.g. work, finances, health, family). … muscle tension or motor restlessness; sympathetic autonomic overactivity as evidenced by frequent gastrointestinal symptoms such as nausea and/or abdominal distress, heart palpitations, sweating …; subjective experience of nervousness, restlessness or being "on edge"; difficulty concentrating; irritability; sleep disturbances … The symptoms are not transient and persist for at least several months, for more days than not.'
    vi_tri: CDDR tr. 266
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…hầu như mỗi ngày trong ít nhất sáu tháng… kèm bồn chồn, dễ mệt, khó tập trung, căng cơ, rối loạn giấc ngủ". "Sáu tháng" là ngưỡng của DSM-5-TR; tài liệu chính thức của APA đọc được không ghi con số, ICD-11 ghi "ít nhất vài tháng". Viết theo ICD-11, không ghi ngưỡng số. chỗ khó: ngưỡng thời gian khác giữa hai hệ thống. Kế hoạch nâng cấp S5 (20/11/2026): chữ cũ còn hai câu sau «Đi kèm thường là căng cơ hay bồn chồn, cảm giác "căng như dây đàn", khó tập trung, dễ cáu, khó ngủ, và các dấu hiệu cơ thể như tim đập nhanh, đổ mồ hôi, buồn nôn. Theo ICD-11, các triệu chứng không thoáng qua mà kéo dài ít nhất vài tháng, phần lớn các ngày.»; chữ mới chỉ giữ câu đầu. Lý do: gạch đầu dòng cũ gần như một bảng tiêu chí (triệu chứng và thời gian; kiem-sinh-hoc-cam-xuc.md [A][CG], phản biện P7); lô thận trọng tạm chờ chuyên gia giữ ở mức khái niệm: chỉ nói nỗi sợ tập trung vào đâu, dùng chữ đã có. Không thêm khẳng định mới; nguồn và trích giữ (trích dài hơn câu mới). Lượt 2 cũ đã xóa.'
  - id: n13
    cau: 'Rối loạn hoảng sợ: nỗi sợ xoay quanh chính các cơn hoảng sợ lặp lại, những đợt sợ hãi dữ dội ập đến nhanh, và nỗi lo rằng cơn sẽ trở lại.'
    loai: lam-sang
    nguon:
      - icd11-cddr
      - apa-anx
    trich: Recurrent panic attacks, which are discrete episodes of intense fear or apprehension characterized by the rapid and concurrent onset of several characteristic symptoms … palpitations or increased heart rate … sensations of shortness of breath … chest pain … feelings of dizziness … fear of losing control or going mad; fear of imminent death. At least some of the panic attacks are unexpected … seem to arise "out of the blue". Panic attacks are followed by persistent concern or worry (e.g. for several weeks) about their recurrence or their perceived negative significance (e.g. that the physiological symptoms may be those of a myocardial infarction), or by behaviours intended to avoid their recurrence (e.g. only leaving the home with a trusted companion).
    vi_tri: CDDR tr. 271
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…và sau đó là ít nhất một tháng lo sợ cơn tiếp theo… (ví dụ không dám đi xa, không dám tập thể dục)". "Ít nhất một tháng" là ngưỡng DSM-5-TR, không có trong tài liệu chính thức của APA đọc được; ICD-11 ghi "ví dụ vài tuần". Viết theo ICD-11 (cả hai ví dụ). Kế hoạch nâng cấp S5 (20/11/2026): chữ cũ «các cơn hoảng sợ lặp lại, trong đó ít nhất một số cơn đến bất ngờ, "từ trên trời rơi xuống". Cơn hoảng sợ là những đợt sợ hãi dữ dội ập đến nhanh, kèm tim đập nhanh, khó thở, đau ngực, chóng mặt, sợ mất kiểm soát hay sợ sắp chết. Sau đó người ấy lo lắng kéo dài về việc cơn sẽ trở lại hay về ý nghĩa của nó (ví dụ sợ mình bị đau tim), hoặc thay đổi cách sống để tránh cơn (ví dụ chỉ ra khỏi nhà khi có người đi cùng).»; chữ mới «nỗi sợ xoay quanh chính các cơn hoảng sợ lặp lại, những đợt sợ hãi dữ dội ập đến nhanh, và nỗi lo rằng cơn sẽ trở lại». Lý do: gạch đầu dòng cũ gần như một bảng tiêu chí (triệu chứng và thời gian; kiem-sinh-hoc-cam-xuc.md [A][CG], phản biện P7); lô thận trọng tạm chờ chuyên gia giữ ở mức khái niệm: chỉ nói nỗi sợ tập trung vào đâu, dùng chữ đã có. Không thêm khẳng định mới; nguồn và trích giữ (trích dài hơn câu mới). Lượt 2 cũ đã xóa.'
  - id: n14
    cau: 'Rối loạn lo âu xã hội (còn gọi ám ảnh sợ xã hội): nỗi sợ rõ rệt và quá mức trong các tình huống xã hội, vì sợ mình bị người khác đánh giá tiêu cực, chê cười hay từ chối.'
    loai: lam-sang
    nguon:
      - icd11-cddr
      - apa-anx
    trich: Marked and excessive fear or anxiety that occurs consistently in one or more social situations such as social interactions (e.g. having a conversation), doing something while feeling observed (e.g. eating or drinking in the presence of others) or performing in front of others (e.g. giving a speech) … The individual is concerned that they will act in a way, or show anxiety symptoms, that will be negatively evaluated by others (i.e. be humiliating, be embarrassing, lead to rejection or be offensive). Relevant social situations are consistently avoided or endured with intense fear or anxiety. The symptoms are not transient – that is, they persist for an extended period of time (e.g. at least several months). [ICD-11]; The fear or anxiety causes problems with daily functioning and lasts at least six months. [APA, Social Anxiety Disorder]
    vi_tri: CDDR tr. 284; APA
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ám ảnh sợ xã hội: nỗi sợ rõ rệt trước các tình huống xã hội có thể bị người khác soi xét… kéo dài ít nhất sáu tháng". Thêm tên ICD-11 (social anxiety disorder), thời gian theo cả hai hệ thống. Kế hoạch nâng cấp S5 (20/11/2026): chữ cũ còn ví dụ tình huống («như trò chuyện, ăn uống khi bị nhìn, thuyết trình»), câu «Người ấy né tránh các tình huống này hoặc chịu đựng trong lo sợ dữ dội, và tình trạng kéo dài (ICD-11 lấy ví dụ: ít nhất vài tháng; tài liệu của Hiệp hội Tâm thần học Hoa Kỳ theo DSM-5-TR ghi: ít nhất sáu tháng).»; chữ mới bỏ ví dụ, câu né tránh và mốc thời gian. Nguồn apa-anx nay chỉ còn đỡ phần nỗi sợ bị đánh giá (phần sáu tháng đã bỏ). Lý do: gạch đầu dòng cũ gần như một bảng tiêu chí (triệu chứng và thời gian; kiem-sinh-hoc-cam-xuc.md [A][CG], phản biện P7); lô thận trọng tạm chờ chuyên gia giữ ở mức khái niệm: chỉ nói nỗi sợ tập trung vào đâu, dùng chữ đã có. Không thêm khẳng định mới; nguồn và trích giữ (trích dài hơn câu mới). Lượt 2 cũ đã xóa.'
  - id: n15
    cau: 'Mô tả ba dạng là mô tả chung để hiểu, không dùng để tự chẩn đoán: chỉ người có chuyên môn mới chẩn đoán được (kèm link Hỗ trợ, ngay trước danh sách).'
    loai: loi-khuyen
    nguon:
      - apa-anx
    trich: A diagnosis is made by a qualified health professional.
    vi_tri: APA
    ket_qua: da-sua
    ghi_chu: 'Thêm mới. Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): câu dẫn danh sách ba rối loạn nay có "chỉ người có chuyên môn mới chẩn đoán được; xem trang Hỗ trợ" ngay trước danh sách. Kế hoạch nâng cấp S5 (20/11/2026): chữ cũ «mô tả chung, **không phải bảng để tự chấm điểm**: chỉ người có chuyên môn mới chẩn đoán được»; chữ mới «mô tả chung để hiểu, **không dùng để tự chẩn đoán**: chỉ người có chuyên môn mới chẩn đoán được». Lý do: ba gạch đầu dòng nay không còn là bảng triệu chứng; giữ lời rào. Lượt 2 cũ đã xóa.'
  - id: n16
    cau: 'Chuyên gia phải loại trừ: bệnh cơ thể (ví dụ cường giáp), tác dụng của cà phê, thuốc, rượu hay chất kích thích (kể cả khi ngừng dùng), hay một rối loạn khác giải thích tốt hơn.'
    loai: lam-sang
    nguon:
      - icd11-cddr
      - apa-anx
    trich: The symptoms are not a manifestation of another medical condition (e.g. hyperthyroidism), and are not due to the effects of a substance or medication on the central nervous system (e.g. caffeine, cocaine), including withdrawal effects (e.g. alcohol, benzodiazepines). [6B00]; see your doctor to rule out medical conditions that may cause similar symptoms [APA]
    vi_tri: CDDR tr. 266 (6B00), tr. 271 (6B01)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "không giải thích được bằng chất kích thích, bệnh cơ thể hay một rối loạn khác". Thêm ví dụ theo ICD-11.'
    luot_2: dung
    luot_2_nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
  - id: n17
    cau: Một cơn hoảng sợ đơn lẻ, hay sự hồi hộp khi phải nói trước đám đông, rất thường gặp và tự nó chưa phải là rối loạn.
    loai: lam-sang
    nguon:
      - icd11-cddr
    trich: Panic attacks are common in the general population, particularly in response to anxiety-provoking life events. … the presence of panic attacks is not in itself sufficient to assign a diagnosis of panic disorder. [6B01]; Many individuals experience fear in social situations (e.g. it is common for individuals to experience anxiety about speaking in public) [6B04]
    vi_tri: CDDR tr. 271–272, 285
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (giải thích câu hỏi 3): "Một cơn hoảng sợ đơn lẻ khá phổ biến và chưa phải là rối loạn". Đưa vào thân bài, thêm nói trước đám đông.'
    luot_2: dung
    luot_2_nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
  - id: n18
    cau: Rối loạn lo âu hay đi cùng trầm cảm.
    loai: lam-sang
    nguon:
      - who-anx-2026
      - icd11-cddr
    trich: Anxiety disorders increase the risk for depression and substance use disorders [WHO]; Social anxiety disorder frequently co-occurs with … depressive disorders. [ICD-11]
    vi_tri: WHO; CDDR tr. 285
    ket_qua: da-sua
    ghi_chu: Thêm mới.
    luot_2: dung
    luot_2_nguon:
      - https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders
      - https://www.psychiatry.org/patients-families/anxiety-disorders/what-are-anxiety-disorders
  - id: n19
    cau: Các mô hình nhận thức – hành vi nhấn mạnh tránh né là một cơ chế duy trì lo âu.
    loai: phat-hien
    nguon:
      - hofmannhay2018
    trich: Avoidance is typically considered a maladaptive behavioral response to excessive fear and anxiety, leading to the maintenance of anxiety disorders.
    vi_tri: Hofmann & Hay 2018, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Có một cơ chế duy trì lo âu mà hầu như rối loạn nào cũng có: tránh né." Bỏ "hầu như rối loạn nào cũng có" (không nguồn định lượng); ghi là quan điểm của mô hình nhận thức – hành vi.'
    luot_2: dung
    luot_2_nguon:
      - https://europepmc.org/article/MED/29550689
    luot_2_ghi_chu: Toàn văn (PMC5879019 qua NCBI E-utilities).
  - id: n20
    cau: 'Vòng tránh né: tránh cho nhẹ nhõm, sự nhẹ nhõm "thưởng" hành vi tránh, và mỗi lần tránh là mất cơ hội học rằng thứ đó không nguy hiểm; càng sợ càng tránh càng sợ hơn.'
    loai: phat-hien
    nguon:
      - hofmannhay2018
      - craske2014
    trich: We will first revisit the role of avoidance learning in the development and maintenance of anxiety disorders [Hofmann & Hay]; Research suggests that anxious individuals show deficits in the mechanisms believed to underlie exposure therapy, such as inhibitory learning. [Craske]
    vi_tri: tóm tắt hai bài
    ket_qua: dung
    ghi_chu: 'Mô tả mô hình học tránh né (giữ chữ cũ). Chỉ đọc tóm tắt: cơ chế "nhẹ nhõm củng cố tránh né" là nội dung phổ biến của mô hình học tránh né mà Hofmann & Hay nói tới; lượt 2 nên đối chiếu toàn văn (PMC5879019). chỗ khó: câu giải thích cơ chế.'
    luot_2: dung
    luot_2_nguon:
      - https://europepmc.org/article/MED/29550689
    luot_2_ghi_chu: Ý 'mất cơ hội học rằng thứ đó không nguy hiểm' là cách diễn giải phổ biến của mô hình học tập (tránh né chống lại sự dập tắt), khớp với 'resistant to extinction' trong bài.
  - id: n21
    cau: 'Với rối loạn lo âu, "tránh hẳn thứ gây sợ" có thể giữ nỗi sợ lại lâu dài; liệu pháp tiếp xúc làm ngược lại: đối mặt có kế hoạch, có kiểm soát để học lại rằng báo động reo nhầm.'
    loai: lam-sang
    nguon:
      - who-anx-2026
      - craske2014
    trich: These include exposure therapy, during which people learn to face their fears. [WHO]; Exposure therapy is an effective approach for treating anxiety disorders [Craske]
    vi_tri: WHO, Diagnosis and treatment; Craske 2014
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "là chiến lược duy trì lo âu về lâu dài. Các liệu pháp hiệu quả nhất hiện nay làm điều ngược lại: đối mặt dần dần…". Làm mềm: "có thể giữ nỗi sợ lại"; bỏ "hiệu quả nhất" (xem n24).'
    luot_2: dung
    luot_2_nguon:
      - https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders
      - https://europepmc.org/article/MED/29550689
  - id: n22
    cau: Các nhà nghiên cứu lưu ý không phải mọi hành vi tránh đều có hại; tùy mục đích, có lúc tránh né là một cách đối phó hợp lý.
    loai: phat-hien
    nguon:
      - hofmannhay2018
    trich: We will argue that there are occasions when avoidance behaviors can serve as effective coping strategies to enhance the person's perception of control … We conclude that avoidance behaviors can be a valuable therapeutic element, depending on the function of these behaviors.
    vi_tri: Hofmann & Hay 2018, tóm tắt
    ket_qua: da-sua
    ghi_chu: Thêm mới, để câu về tránh né không tuyệt đối.
    luot_2: dung
    luot_2_nguon:
      - https://europepmc.org/article/MED/29550689
  - id: n23
    cau: WHO ghi các liệu pháp tâm lý dựa trên nguyên tắc CBT, gồm liệu pháp tiếp xúc, có nhiều bằng chứng nhất cho nhiều rối loạn lo âu.
    loai: lam-sang
    nguon:
      - who-anx-2026
    trich: The psychological interventions with the most evidence for treating a range of anxiety disorders are those based on principles of cognitive-behavioural therapy. These include exposure therapy, during which people learn to face their fears.
    vi_tri: WHO, Diagnosis and treatment
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "CBT được xem là hướng điều trị tâm lý có bằng chứng mạnh nhất cho các rối loạn lo âu. Với ám ảnh sợ, thành phần cốt lõi là tiếp xúc dần dần…". Dẫn WHO.'
    luot_2: dung
    luot_2_nguon:
      - https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders
  - id: n24
    cau: NICE khuyên CBT cho rối loạn hoảng sợ, CBT cá nhân cho lo âu xã hội, và CBT hay thư giãn ứng dụng cho lo âu lan tỏa; với lo âu lan tỏa, NICE giới thiệu các bước nhẹ hơn trước như tự giúp có hướng dẫn.
    loai: lam-sang
    nguon:
      - nice-cg113
      - nice-cg159
    trich: '1.2.12 For people with GAD whose symptoms have not improved after education and active monitoring in step 1, offer 1 or more of the following as a first-line intervention …: individual non-facilitated self-help, individual guided self-help, psychoeducational groups … 1.2.18 If a person with GAD chooses a high-intensity psychological intervention, offer either CBT or applied relaxation. … 1.3.13 CBT should be used. [panic, CG113]; 1.3.2 Offer adults with social anxiety disorder individual cognitive behavioural therapy (CBT) that has been specifically developed to treat social anxiety disorder [CG159]'
    vi_tri: NICE CG113 1.2.12, 1.2.18, 1.3.13; CG159 1.3.2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Với lo âu lan tỏa, CBT tập trung vào các kiểu lo lắng và hành vi duy trì nó." Thay bằng khuyến nghị cụ thể của NICE (mô hình chăm sóc từng bước).'
    luot_2: dung
    luot_2_nguon:
      - https://www.nice.org.uk/guidance/cg113/chapter/Recommendations
      - https://www.nice.org.uk/guidance/cg159/chapter/Recommendations
  - id: n25
    cau: Theo WHO, thuốc chống trầm cảm như nhóm SSRI có thể hữu ích cho người lớn bị rối loạn lo âu.
    loai: lam-sang
    nguon:
      - who-anx-2026
      - apa-anx
    trich: Antidepressant medications, such as selective serotonin reuptake inhibitors (SSRIs), can also be useful in treating adults with anxiety disorders.
    vi_tri: WHO, Diagnosis and treatment
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Thuốc: các nhóm SSRI, SNRI được các hướng dẫn (như NICE) nhắc đến…". Dẫn WHO. chỗ khó: lời về thuốc.'
    luot_2: dung
    luot_2_nguon:
      - https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders
  - id: n26
    cau: NICE xếp thuốc là một lựa chọn bên cạnh liệu pháp tâm lý cho lo âu lan tỏa, và là lựa chọn cho người không muốn hay không dùng được CBT với lo âu xã hội; chỉ bác sĩ kê đơn và theo dõi thuốc.
    loai: lam-sang
    nguon:
      - nice-cg113
      - nice-cg159
      - tt26-2025
    trich: 1.2.17 … Offer either an individual high-intensity psychological intervention … or drug treatment … there is no evidence that either mode of treatment … is better. [CG113]; 1.3.5 For adults who decline cognitive behavioural interventions and express a preference for a pharmacological intervention … 1.3.6 … offer a selective serotonin reuptake inhibitor (SSRI) [CG159]; Người hành nghề … với chức danh là bác sỹ, y sỹ có thẩm quyền kê đơn thuốc [TT 26/2025 Điều 2]
    vi_tri: CG113 1.2.17; CG159 1.3.5–1.3.6; TT 26/2025 Điều 2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Thuốc thường được cân nhắc khi triệu chứng nặng, kéo dài, hoặc khi liệu pháp tâm lý đơn thuần chưa đủ." Với lo âu lan tỏa có suy giảm rõ, NICE cho chọn ngang hàng liệu pháp hay thuốc; viết lại theo NICE. "Chỉ bác sĩ" ở đây là cách nói gọn: TT 26/2025 cho bác sỹ và y sỹ kê đơn. chỗ khó: lời về thuốc.'
    luot_2: dung
    luot_2_nguon:
      - https://www.nice.org.uk/guidance/cg113/chapter/Recommendations
      - https://www.nice.org.uk/guidance/cg159/chapter/Recommendations
    luot_2_ghi_chu: CG159 nói 'người từ chối CBT'; 'không dùng được' rộng hơn chữ gốc một chút.
  - id: n27
    cau: WHO ghi thuốc an thần nhóm benzodiazepine nhìn chung không được khuyên dùng cho rối loạn lo âu, vì nguy cơ lệ thuộc cao và hiệu quả lâu dài hạn chế; NICE chỉ chấp nhận dùng ngắn hạn trong khủng hoảng với lo âu lan tỏa, và khuyên không dùng cho rối loạn hoảng sợ.
    loai: lam-sang
    nguon:
      - who-anx-2026
      - nice-cg113
    trich: Benzodiazepines, which have historically been prescribed for anxiety disorders, are generally not recommended for anxiety disorders because of their high potential for dependence as well as their limited long-term effectiveness. [WHO]; 1.2.26 Do not offer a benzodiazepine for the treatment of GAD in primary or secondary care except as a short-term measure during crises. … 1.3.20 Benzodiazepines are associated with a less good outcome in the long term and should not be prescribed for the treatment of individuals with panic disorder. [NICE]
    vi_tri: WHO; CG113 1.2.26, 1.3.20
    ket_qua: da-sua
    ghi_chu: 'Thêm mới (trang cũ chỉ nói ở mục Ngộ nhận: "Tự dùng thuốc an thần có thể gây phụ thuộc").'
    luot_2: dung
    luot_2_nguon:
      - https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders
      - https://www.nice.org.uk/guidance/cg113/chapter/Recommendations
  - id: n28
    cau: Tiếp xúc trong trị liệu được lên kế hoạch cùng người có chuyên môn, thường đi từng bước, phù hợp với từng người; khác với việc bị người khác ép vào tình huống đáng sợ.
    loai: lam-sang
    nguon:
      - craske2014
      - nice-cg113
    trich: The primary aim of this paper is to provide examples to clinicians for how to apply this model to optimize exposure therapy with anxious clients [Craske]; 1.3.14 CBT should be delivered only by suitably trained and supervised people who can demonstrate that they adhere closely to empirically grounded treatment protocols. [CG113]
    vi_tri: Craske 2014; CG113 1.3.14
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "các kỹ thuật đối mặt dần dần trong sách vở khác hẳn việc tự ép mình vào tình huống gây sợ một cách đột ngột — cách sau có thể làm mọi thứ tệ đi. Tiếp xúc trị liệu được thiết kế theo từng bước, có người có chuyên môn đồng hành." Không tìm được nguồn cho "có thể làm mọi thứ tệ đi" (trị liệu tiếp xúc cường độ cao, flooding, cũng là một dạng có bằng chứng); bỏ vế ấy, giữ ý "có kế hoạch, cùng người có chuyên môn".'
    luot_2: dung
    luot_2_nguon:
      - https://www.psychiatry.org/patients-families/anxiety-disorders/what-are-anxiety-disorders
      - https://europepmc.org/article/MED/24864005
  - id: n29
    cau: Các rối loạn lo âu là những rối loạn có thật, được mô tả với tiêu chí rõ ràng (loại nỗi sợ, thời gian, mức khổ sở hay suy giảm, tình trạng loại trừ) trong ICD-11 và DSM-5-TR.
    loai: nhan
    nguon:
