    ly_do: 'Câu về sự tồn tại của tiêu chí chẩn đoán chuẩn: ICD-11 (WHO) và DSM-5-TR (APA) đều mô tả các rối loạn này với tiêu chí bắt buộc, thời gian, mức suy giảm và ranh giới với lo âu bình thường; WHO mô tả cùng các dạng. Nguồn chuẩn bậc 2 thống nhất.'
    ket_qua: da-sua
    ghi_chu: 'Ý chính cũ: "các rối loạn lo âu là những chẩn đoán có thật, có tiêu chí rõ ràng". Đổi "chẩn đoán" thành "rối loạn", thêm "tình trạng loại trừ".'
    luot_2: dung
    luot_2_nguon:
