    ghi_chu: 'Chữ cũ: "Nguy hiểm. Tự dùng thuốc an thần có thể gây phụ thuộc và che lấp vấn đề gốc. Mọi dùng thuốc đều cần bác sĩ chỉ định." Bỏ "che lấp vấn đề gốc" (không nguồn); dẫn WHO.'
