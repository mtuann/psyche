      - who-anx-2026
    ly_do: 'Phân tích tổng hợp nghiên cứu gia đình và sinh đôi (Hettema 2001) cho thấy cả gen (di truyền 0,32–0,43) và môi trường đều góp phần; WHO mô tả cùng mô hình. Giới hạn: số nghiên cứu sinh đôi lớn ít (chỉ hoảng sợ và lo âu lan tỏa có hơn một), mẫu chủ yếu phương Tây, ước lượng di truyền là của quần thể, không áp được cho từng người. Khá vững.'
    ket_qua: da-sua
    ghi_chu: 'Khung cũ: "Đang tranh cãi: lo âu là bệnh của não hay bệnh của hoàn cảnh?" và thân "Giới nghiên cứu tranh luận về tỉ trọng của từng yếu tố — và câu trả lời ảnh hưởng đến việc nên can thiệp ở cấp độ cá nhân, gia đình hay xã hội." Không tìm được bằng chứng chất lượng cao mâu thuẫn nhau theo cách đặt câu hỏi "não hay hoàn cảnh"; WHO và các nghiên cứu sinh đôi cùng chiều về mô hình nhiều yếu tố. Đổi thành Khá vững với ý chính mới. chỗ khó: đổi nhãn (Đang tranh cãi → Khá vững) và đổi đối tượng của nhãn.'
    luot_2: dung
    luot_2_nguon:
      - https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders
      - https://europepmc.org/article/MED/11578982
    luot_2_ghi_chu: 'Nhãn (nếu Vững chắc hay Khá vững) hợp thước đo: ý ''nhiều yếu tố cùng tác động'' có phân tích tổng hợp sinh đôi và nguồn chuẩn WHO; vế ''ở mỗi người chưa thể tách'' là đúng về mặt phương pháp (hệ số di truyền là số của quần thể).'
  - id: n36
    cau: 'Ngộ nhận "Tránh hẳn thứ gây sợ là cách tốt nhất": thường là không; với rối loạn lo âu, tránh né có thể giữ nỗi sợ lâu dài; đối mặt có kế hoạch, cùng người có chuyên môn, là cốt lõi của liệu pháp tiếp xúc.'
    loai: lam-sang
    nguon:
