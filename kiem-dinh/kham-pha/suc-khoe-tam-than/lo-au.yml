      - apa-anx
    trich: Anxiety and worry are normal emotional/cognitive states that commonly occur when people are under stress. At optimal levels, anxiety and worry may help to direct problem-solving efforts, focus attention adaptively and increase alertness. Normal anxiety and worry are usually sufficiently self-regulated that they do not interfere with functioning or cause marked distress. In generalized anxiety disorder, the anxiety or worry is excessive, persistent and intense, and may have a significant negative impact on functioning.
    vi_tri: CDDR tr. 267
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: đáp án có "(với lo âu lan tỏa là ít nhất sáu tháng)"; phương án nhiễu "chỉ xảy ra với người yếu thần kinh". Bỏ ngưỡng sáu tháng (n12); đổi "yếu thần kinh" thành "yếu đuối".'
    luot_2: dung
    luot_2_nguon:
      - https://iris.who.int/server/api/core/bitstreams/dcf73611-9e0f-4d5c-85f6-85a58b0da6de/content
  - id: n44
    cau: 'Câu hỏi 2: tránh né có thể giữ lo âu lâu dài vì nhẹ nhõm tức thì thưởng hành vi tránh và lấy mất cơ hội học rằng thứ đó không nguy hiểm.'
    loai: phat-hien
    nguon:
      - hofmannhay2018
    trich: Avoidance is typically considered a maladaptive behavioral response to excessive fear and anxiety, leading to the maintenance of anxiety disorders.
    vi_tri: Hofmann & Hay 2018
    ket_qua: da-lam-mem
    ghi_chu: 'Câu cũ: "Vì sao tránh hẳn thứ gây sợ lại duy trì lo âu về lâu dài?" Làm mềm "có thể giữ".'
    luot_2: dung
    luot_2_nguon:
      - https://europepmc.org/article/MED/29550689
  - id: n45
    cau: 'Câu hỏi 3: theo ICD-11, ở rối loạn hoảng sợ các cơn lặp lại và nỗi lo rằng cơn sẽ trở lại thành một nỗi sợ kéo dài, gây khổ sở hay cản trở cuộc sống; cơn hoảng sợ đơn lẻ khá thường gặp và tự nó chưa phải rối loạn.'
    loai: lam-sang
    nguon:
      - icd11-cddr
    trich: Recurrent panic attacks, which are discrete episodes of intense fear or apprehension characterized by the rapid and concurrent onset of several characteristic symptoms … palpitations or increased heart rate … sensations of shortness of breath … chest pain … feelings of dizziness … fear of losing control or going mad; fear of imminent death. At least some of the panic attacks are unexpected … seem to arise "out of the blue". Panic attacks are followed by persistent concern or worry (e.g. for several weeks) about their recurrence or their perceived negative significance (e.g. that the physiological symptoms may be those of a myocardial infarction), or by behaviours intended to avoid their recurrence (e.g. only leaving the home with a trusted companion). … Panic attacks are common in the general population
    vi_tri: CDDR tr. 271–272
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "Theo DSM-5-TR… kèm ít nhất một tháng lo sợ cơn tiếp theo…". Đổi sang ICD-11 (ngưỡng một tháng của DSM-5-TR không kiểm được qua tài liệu chính thức của APA). Kế hoạch nâng cấp S5 (20/11/2026): đáp án cũ «Rối loạn hoảng sợ có các cơn lặp lại, một số cơn đến bất ngờ, kèm lo lắng kéo dài về cơn tiếp theo hay thay đổi cách sống để tránh cơn, và gây suy giảm rõ.»; đáp án mới «Ở rối loạn hoảng sợ, các cơn lặp lại và nỗi lo rằng cơn sẽ trở lại thành một nỗi sợ kéo dài, gây khổ sở hay cản trở cuộc sống.». Lý do: đáp án cũ dựa vào chữ đã bỏ ở n13 (cơn bất ngờ, thay đổi cách sống), gần như chép tiêu chí; sửa tối thiểu cho khớp chữ mới. Câu hỏi, phương án nhiễu và giải thích giữ. Lượt 2 cũ đã xóa.'
  - id: n46
    cau: 'Câu hỏi 4: liệu pháp dựa trên CBT, gồm tiếp xúc, có nhiều bằng chứng nhất; SSRI có thể hữu ích, do bác sĩ kê; benzodiazepine nhìn chung không được khuyên dùng; WHO và NICE đặt CBT ở vị trí trung tâm.'
    loai: lam-sang
    nguon:
      - who-anx-2026
      - nice-cg113
      - nice-cg159
    trich: The psychological interventions with the most evidence … are those based on principles of cognitive-behavioural therapy. … Antidepressant medications, such as SSRIs, can also be useful … Benzodiazepines … are generally not recommended
    vi_tri: WHO; NICE
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: đáp án "…tiếp xúc trị liệu khác hẳn việc tự ép mình đối mặt đột ngột"; phương án nhiễu "Cứ đối mặt đột ngột với nỗi sợ lớn nhất là khỏi nhanh nhất"; giải thích "Tự ngập trong nỗi sợ… có thể làm mọi thứ tệ đi". Bỏ phần không nguồn (n28); phương án nhiễu mới: "Thuốc an thần là lựa chọn tốt nhất về lâu dài" (sai theo WHO).'
    luot_2: dung
    luot_2_nguon:
      - https://www.who.int/news-room/fact-sheets/detail/anxiety-disorders
      - https://www.nice.org.uk/guidance/cg113/chapter/Recommendations
  - id: n47
    cau: 'Câu hỏi 5: với người bạn ngày càng ít ra khỏi nhà vì sợ lên cơn, điều hữu ích là lắng nghe không phán xét, không ép, khuyến khích tìm người có chuyên môn, vì tránh né ngày càng rộng có thể làm nỗi sợ bám lâu hơn.'
    loai: loi-khuyen
    nguon:
      - paho-living
      - who-anx-2026
    trich: listen without judgement, and offer support … Encourage them to seek professional help [PAHO, về trầm cảm]; People with symptoms of anxiety should seek care. … Usually they avoid the situations that make them anxious. [WHO]
    vi_tri: PAHO 2021; WHO Anxiety
    ket_qua: da-sua
    ghi_chu: 'Câu cũ: "…vì tránh né ngày càng rộng là dấu hiệu vòng luẩn quẩn đang siết chặt"; giải thích "Ép đối mặt hay bao bọc tránh né đều không giúp". Làm mềm; nguồn về cách giúp người thân của WHO/PAHO viết cho trầm cảm, áp dụng chung (ghi rõ để lượt 2 xét).'
    luot_2: dung
    luot_2_nguon:
      - https://europepmc.org/article/MED/29550689
      - https://www.psychiatry.org/patients-families/anxiety-disorders/what-are-anxiety-disorders
    luot_2_ghi_chu: Ý 'không ép' khớp n28 (tiếp xúc có kế hoạch, từng bước).
  - id: n48
    cau: Mục Nguồn cũ ghi chú thích DSM-5-TR (lo âu lan tỏa ≥6 tháng, 3/6 triệu chứng; hoảng sợ ≥1 tháng; lo âu xã hội ≥6 tháng), NICE CG113, và dòng tham chiếu trang Hỗ trợ.
    loai: lam-sang
    nguon:
      - apa-anx
    vi_tri: mục Nguồn
    ket_qua: da-sua
    ghi_chu: 'Bỏ chú thích ngưỡng của DSM-5-TR (không kiểm được qua tài liệu chính thức của APA, trừ lo âu xã hội sáu tháng, đã đưa vào thân bài; ngưỡng đếm "3/6 triệu chứng" là kiểu bảng tự chấm). Dòng tham chiếu trang Hỗ trợ bỏ khỏi mục Nguồn (báo cáo D1.2 mục 4). Sau lượt 2 (Claude Opus 5.5, agent làm lô, 17/11/2026): lượt 2 khong-chac cho ngưỡng DSM ở chú thích nguồn cũ. Đã kiểm trang (grep 17/11/2026): không còn "3/6", "một tháng", "sáu tháng" cho lo âu lan tỏa; chỉ còn "ít nhất sáu tháng" của lo âu xã hội, theo tài liệu chính thức của APA (lượt 2 xác nhận). Giữ da-sua.'
    luot_2: khong-chac
    luot_2_nguon:
      - https://www.psychiatry.org/patients-families/anxiety-disorders/what-are-anxiety-disorders
      - https://www.nice.org.uk/guidance/cg113/chapter/Recommendations
    luot_2_ghi_chu: 'Lo âu xã hội ≥6 tháng: xác nhận qua APA. Lo âu lan tỏa ''≥6 tháng, 3/6 triệu chứng'' và hoảng sợ ''≥1 tháng'': đúng theo hiểu biết chung về DSM-5, nhưng không mở được văn bản tiêu chí của APA (psychiatryonline.org 403), nên ghi khong-chac theo yêu cầu. gần chẩn đoán: ''3/6 triệu chứng'' là ngưỡng đếm, dễ thành bảng tự chấm; nên bỏ số đếm hay để kèm lời ''chỉ chuyên gia áp dụng''.'
  - id: n49
    cau: 'Ở dạng nào cũng vậy, người có chuyên môn xem xét cả bức tranh: nỗi sợ kéo dài bao lâu, mạnh đến đâu, và gây khổ sở hay cản trở cuộc sống tới mức nào.'
    loai: lam-sang
    nguon:
      - icd11-cddr
      - who-anx-2026
    trich: 'people with anxiety disorders often experience fear and worry that is both intense and excessive. … They are difficult to control, cause significant distress and can last a long time if untreated. Anxiety disorders interfere with daily activities and can impair a person''s family, social and school or working life. [WHO]; The symptoms are not transient and persist for at least several months, for more days than not. [ICD-11, 6B00]; The symptoms are not transient – that is, they persist for an extended period of time (e.g. at least several months). [ICD-11, 6B04]'
    vi_tri: WHO Overview (trích như n9); CDDR tr. 266, 284 (trích như n12, n14)
    ket_qua: da-sua
    ghi_chu: 'Kế hoạch nâng cấp S5 (20/11/2026): thêm mới sau ba gạch đầu dòng, thay cho các mốc thời gian đã bỏ ở n12–n14: nói ở mức khái niệm rằng người có chuyên môn xét thời gian, cường độ và mức khổ sở hay cản trở, không nêu ngưỡng. Trích lấy lại từ n9 (WHO) và n12, n14 (ICD-11), không mở nguồn mới; câu không nêu ngưỡng nên chỉ cần nguồn cho thấy thời gian kéo dài và mức khổ sở, cản trở là điều được xét.'
doi_chu:
  - cu: 'description "Bản nháp: các rối loạn lo âu chính theo DSM-5-TR (lo âu lan tỏa, hoảng sợ, ám ảnh sợ xã hội)…"'
    moi: description không có "Bản nháp", thêm ICD-11
    ly_do: Hồ sơ n1.
  - cu: Hộp warning "Bản nháp đang chờ rà soát chuyên môn"
    moi: Hộp note "Trước khi đọc" và ::tom-tat
    ly_do: Hồ sơ n2, n3.
  - cu: Tự trải nghiệm, hộp "Điểm khác biệt cốt lõi" ("dạng mà y học gọi là rối loạn lo âu")
    moi: '"(ví dụ giả định của chúng tôi)"; thêm điều kiện khổ sở, suy giảm; câu "chỉ người có chuyên môn…"'
    ly_do: Hồ sơ n4–n7.
  - cu: 'Mục "Điều gì đang xảy ra?": "cơ chế sinh tồn"; "Ba dạng phổ biến nhất"; ngưỡng sáu tháng, một tháng; "Ám ảnh sợ xã hội"'
    moi: Theo ICD-11 và WHO; thêm số liệu WHO 2023 có mốc; "Ba dạng thường được nhắc đến"; thời gian theo ICD-11 (và APA cho lo âu xã hội); loại trừ, cơn đơn lẻ, đi cùng trầm cảm
    ly_do: Hồ sơ n8–n18.
  - cu: 'Mục "Vòng luẩn quẩn tránh né": "hầu như rối loạn nào cũng có"; "là chiến lược duy trì lo âu"; "Các liệu pháp hiệu quả nhất hiện nay…"'
    moi: '"Các mô hình nhận thức – hành vi nhấn mạnh…"; "có thể giữ nỗi sợ lại lâu dài"; thêm câu không phải mọi tránh né đều có hại'
    ly_do: Hồ sơ n19–n22.
  - cu: Mục "Các hướng điều trị có bằng chứng" (CBT "mạnh nhất"; SSRI, SNRI "khi triệu chứng nặng"; kết hợp; "cách sau có thể làm mọi thứ tệ đi")
    moi: Theo WHO, NICE CG113, CG159; thêm benzodiazepine; tiếp xúc có kế hoạch cùng người có chuyên môn
    ly_do: Hồ sơ n23–n28.
  - cu: Ba khung nhãn (Vững chắc; Khá vững CBT; Đang tranh cãi "bệnh của não hay bệnh của hoàn cảnh")
    moi: Vững chắc; Khá vững (CBT, số của Carpenter 2018); Khá vững (nhiều yếu tố cùng tác động)
    ly_do: Hồ sơ n29–n35.
  - cu: Ba ngộ nhận ("Sai về lâu dài"; "người cận thị"; "che lấp vấn đề gốc")
    moi: Viết lại theo Hofmann & Hay, WHO
    ly_do: Hồ sơ n36–n38.
  - cu: 'Khi nào nên tìm giúp đỡ: "kéo dài nhiều tháng"; "gọi 115 ngay"'
    moi: Bỏ ngưỡng "nhiều tháng"; triệu chứng như đau tim thì gọi cấp cứu; số ở trang Hỗ trợ
    ly_do: Hồ sơ n39–n41.
  - cu: Năm câu hỏi (câu 3 "Theo DSM-5-TR… ít nhất một tháng"; câu 4 "đối mặt đột ngột")
    moi: Năm câu hỏi, câu 3 theo ICD-11, câu 4 về thuốc an thần
    ly_do: Hồ sơ n43–n47.
  - cu: Mục Nguồn (DSM-5-TR kèm ngưỡng; NICE CG113; trang Hỗ trợ)
    moi: ICD-11 CDDR, WHO, APA, NICE CG113, CG159, các phân tích tổng hợp
    ly_do: Hồ sơ n48.
  - cu: 'Mục «Điều gì đang xảy ra?»: câu dẫn «mô tả chung, không phải bảng để tự chấm điểm»; ba gạch đầu dòng kèm triệu chứng và thời gian (lo âu lan tỏa: căng cơ, khó ngủ… ít nhất vài tháng; hoảng sợ: tim đập nhanh, khó thở… thay đổi cách sống; lo âu xã hội: né tránh, vài tháng / sáu tháng)'
    moi: 'Câu dẫn «mô tả chung để hiểu, không dùng để tự chẩn đoán»; mỗi dạng một câu nói nỗi sợ tập trung vào đâu; thêm câu «người có chuyên môn xem xét cả bức tranh» trước đoạn loại trừ'
    ly_do: 'Kế hoạch nâng cấp S5 (20/11/2026), lô thận trọng tạm chờ chuyên gia; hồ sơ n12–n15, n49.'
  - cu: 'Câu hỏi 3, đáp án đúng: «…một số cơn đến bất ngờ, kèm lo lắng kéo dài về cơn tiếp theo hay thay đổi cách sống để tránh cơn, và gây suy giảm rõ»'
    moi: '«Ở rối loạn hoảng sợ, các cơn lặp lại và nỗi lo rằng cơn sẽ trở lại thành một nỗi sợ kéo dài, gây khổ sở hay cản trở cuộc sống»'
    ly_do: 'Kế hoạch nâng cấp S5 (20/11/2026); hồ sơ n45.'
mo_khoa:
