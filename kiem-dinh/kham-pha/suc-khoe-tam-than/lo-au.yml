      - https://www.psychiatry.org/patients-families/anxiety-disorders/what-are-anxiety-disorders
    luot_2_ghi_chu: 'Nhãn: câu kiểm trực tiếp được trong hai hệ thống phân loại; Vững chắc (nếu là nhãn của khung) hợp thước đo.'
  - id: n30
    cau: Một phân tích tổng hợp 41 thử nghiệm có nhóm giả dược (2.843 người) thấy CBT hiệu quả hơn giả dược ở mức vừa; hiệu quả lớn với lo âu lan tỏa, nhỏ đến vừa với lo âu xã hội và rối loạn hoảng sợ; liệu pháp chủ yếu dùng tiếp xúc có hiệu quả lớn hơn một chút nhưng chưa có ý nghĩa thống kê.
    loai: so-lieu
    nguon:
      - carpenter2018
    trich: We included 41 studies that randomly assigned patients (N = 2,843) … Findings demonstrated moderate placebo-controlled effects of CBT on target disorder symptoms (Hedges' g = 0.56) … Large effect sizes were found for OCD, GAD, and acute stress disorder, and small to moderate effect sizes were found for PTSD, SAD, and PD. … Interventions primarily using exposure strategies had larger effect sizes … though this difference did not reach significance.
    vi_tri: Carpenter 2018, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Thân khung cũ: "Nhiều thử nghiệm ngẫu nhiên có đối chứng cho thấy CBT, nhất là các kỹ thuật tiếp xúc, giúp giảm đáng kể triệu chứng của các ám ảnh sợ và rối loạn hoảng sợ. Với lo âu lan tỏa, bằng chứng cũng ủng hộ CBT và một số thuốc theo chỉ định." Thay bằng số của Carpenter 2018 (với hoảng sợ, hiệu quả so với giả dược chỉ nhỏ đến vừa).'
    luot_2: dung
    luot_2_nguon:
      - https://europepmc.org/article/MED/29451967
    luot_2_ghi_chu: Chỉ đọc tóm tắt. 41 thử nghiệm gồm cả OCD, PTSD, rối loạn stress cấp; câu của trang không nói 41 thử nghiệm chỉ về ba rối loạn lo âu, nên vẫn đúng.
  - id: n31
    cau: Một phần đáng kể người bệnh chưa đỡ hay bị tái phát nỗi sợ sau trị liệu tiếp xúc.
    loai: phat-hien
