  - id: n34
    cau: 'Mô hình hai hệ thống: hệ cảm xúc–xã hội thay đổi sớm quanh tuổi dậy thì, hệ kiểm soát tiếp tục cải thiện đến tận tuổi đôi mươi, nên giữa tuổi teen dễ tổn thương nhất trước mạo hiểm; đây là mô hình giải thích, không phải kết quả đo trực tiếp.'
    loai: phat-hien
    nguon:
      - steinberg2008
      - steinberg2008b
    trich: The differing timetables of these changes make mid-adolescence a time of heightened vulnerability to risky and reckless behavior.
    vi_tri: Steinberg 2008, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hệ cảm xúc–xã hội chín sớm (có lợi cho việc tách khỏi gia đình, kết bạn, tìm bạn đời) … Sự lệch nhịp là cái giá của một lịch trình phát triển vốn có lý do của nó." Chữ mới: bỏ phần "có lợi … tìm bạn đời" và "cái giá của … có lý do của nó". Lý do: không có nguồn mở; phần thích nghi chuyển sang n35. Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Steinberg 2008 (bản PMC2396566, lưu ở Wayback 26/08/2024): tóm tắt. Trang ghi rõ là mô hình giải thích.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/18509515/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/" ]
    review: dung
  - id: n35
    cau: Steinberg (2008), dẫn Spear (2000), nêu giả thuyết rằng đặc điểm điển hình của tuổi teen như tìm kiếm cái mới và mạo hiểm có thể đã mang tính thích nghi tiến hóa, giúp thanh thiếu niên rời nhóm gốc và vượt qua bước chuyển từ phụ thuộc sang độc lập; ở người có thể biểu hiện qua rượu, ma túy và hành vi có vấn đề.
    loai: phat-hien
    nguon:
      - steinberg2008
    trich: Such adolescent-typical features may have been adaptive evolutionarily in helping adolescents to disperse from the natal unit and to negotiate with success the developmental transition from dependence to independence.
    vi_tri: Steinberg 2008, mục về động lực tìm kiếm cảm giác (trích Spear 2000, tr. 446–447)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một số nhà nghiên cứu lập luận rằng sự mạo hiểm của tuổi teen không phải lỗi hệ thống mà có chức năng: khám phá môi trường mới, thử giới hạn, học cách tự lập … Vấn đề chỉ nảy sinh khi môi trường hiện đại (xe máy, ma túy, mạng xã hội) biến những lần thử thành cái giá quá đắt." Chữ mới: bám Steinberg 2008 (giả thuyết; Spear 2000). Lý do: bỏ "môi trường hiện đại (xe máy, mạng xã hội)" (không có trong nguồn); thêm "đây là giả thuyết". Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Steinberg 2008 (bản PMC2396566, lưu ở Wayback 26/08/2024): "Such adolescent-typical features may have been adaptive evolutionarily in helping adolescents to disperse from the natal unit and to negotiate with success the developmental transition from dependence to independence. In the human adolescent, these propensities may be expressed, however, in alcohol and drug use". Lượt 2 không mở được; review xác nhận.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/18509515/" ]
    luot_2_ghi_chu: "Việc Steinberg 2008 dẫn Spear (2000) về giả thuyết thích nghi tiến hóa nằm trong toàn văn (chưa mở được: PMC chặn tải tự động); tóm tắt không có."
    review: dung
  - id: n36
    cau: 'Các nguồn không ủng hộ việc xem não teen như phiên bản lỗi của não người lớn: teen hiểu biết, lý luận logic, đánh giá rủi ro chính xác không kém người lớn (Steinberg 2008), và mô hình hai hệ thống giải thích mạo hiểm của teen đúng hơn các mô hình quy cho thiếu năng lực nhận thức (Shulman 2016).'
    loai: phat-hien
    nguon:
      - steinberg2008
      - shulman2016
    trich: the dual systems model provides a far more accurate account of adolescent risk taking than prior models that have attributed adolescent recklessness to cognitive deficiencies
    vi_tri: Shulman 2016, tóm tắt; Steinberg 2008 (Reyna & Farley 2006)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Cách khung sai lầm nhất là xem não teen như một phiên bản lỗi của não người lớn. Đúng hơn, đó là một bộ não đang trong quá trình tinh chỉnh: tỉa synap nghĩa là não đang học cách dùng hiệu quả hơn dựa trên trải nghiệm — dùng hoặc mất. Điều này cũng có nghĩa tuổi teen là cửa sổ vàng để học kỹ năng, ngôn ngữ, nhạc cụ". Chữ mới: bám hai nguồn; bỏ "dùng hoặc mất" và "cửa sổ vàng …". Lý do: không có nguồn mở cho hai ý đó. Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Steinberg 2008 (bản PMC2396566, lưu ở Wayback 26/08/2024): "adolescents are knowledgeable, logical, reality-based, and accurate … as their elders" (dẫn Reyna & Farley 2006); Shulman 2016 câu trích khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/" ]
    review: dung
  - id: n37
    cau: 'Khá vững (chip ở Áp dụng 1): nói chuyện khi "nguội", đừng giảng đạo lý khi đang "nóng".'
    loai: nhan
    nhan: kha-vung
    co_so:
      - steinberg2008
      - gardner2005
    ly_do: 'Cơ sở: Steinberg 2008 mô tả rằng khi chơi một mình, mức liều lĩnh của các nhóm tuổi tương đương và teen hiểu biết, lý luận không kém người lớn; chương trình giáo dục thường thay đổi hiểu biết nhiều hơn hành vi. Phần "nên nói lúc bình tĩnh" là suy luận từ mô hình, chưa có thử nghiệm riêng, nên "khá vững" ở mức tối đa; review xem lại nhãn.'
    nguon:
      - steinberg2008
      - gardner2005
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ: "Rủi ro bùng lên trong trạng thái nóng … Vì vậy, bài học an toàn giao thông hay phòng chống ma túy nên được gieo vào lúc bình tĩnh." Chữ mới: thêm "Theo Steinberg (2008)", "Theo mô hình", và câu "Việc nên nói chuyện lúc bình tĩnh là suy luận của chúng tôi từ mô hình, chưa có thử nghiệm riêng." Lý do: lời khuyên là suy luận, cần nói rõ. Review (Claude Opus 5.5, 10/11/2026): sai. Lượt 2: qua-manh. Đồng ý: nguồn (Steinberg 2008) xác nhận cơ chế (một mình thì liều ngang người lớn, teen lý luận không kém người lớn, giáo dục đổi hiểu biết hơn hành vi), không kiểm lời khuyên "nói chuyện lúc nguội"; chính trang ghi đây là suy luận chưa có thử nghiệm. Chip Khá vững gắn lên lời khuyên cao hơn bằng chứng: đã bỏ chip :nhan[kha-vung] ở tiêu đề Áp dụng 1, giữ id cũ { #1-noi-chuyen-khi-nguoi-dung-giang-dao-ly-khi-dang-nong-kha-vung }. Thân mục giữ (n38 và các câu có nguồn).'
    luot_2: qua-manh
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/" ]
    luot_2_ghi_chu: "câu đúng: Bằng chứng ủng hộ rằng quyết định của thiếu niên giống người lớn khi ít kích động cảm xúc; lời khuyên nói chuyện lúc 'nguội' là suy ra từ mô hình, chưa được kiểm chứng can thiệp.; Nguồn xác nhận cơ chế (kích hoạt cảm xúc làm tăng mạo hiểm), không kiểm tra lời khuyên 'nói chuyện khi nguội, đừng giảng khi nóng' có hiệu quả; nhãn 'Khá vững' cho lời khuyên cao hơn bằng chứng."
    review: sai
  - id: n38
    cau: Steinberg (2008) ghi rằng các chương trình giáo dục về nguy cơ ở tuổi teen thường thay đổi hiểu biết nhiều hơn thay đổi hành vi.
    loai: phat-hien
    nguon:
