nhan_dinh:
  - id: n1
    cau: 'Mô tả: vỏ não trước trán trưởng thành muộn, hệ phần thưởng nhạy bén ở giữa tuổi teen; mô hình "mất cân bằng phát triển" đề xuất lời giải thích cho việc teen có thể hiểu nguy hiểm mà vẫn liều; khoa học nói gì về trách nhiệm của người chưa thành niên.'
    loai: phat-hien
    nguon:
      - steinberg2008
      - steinberg2009
    trich: The differing timetables of these changes make mid-adolescence a time of heightened vulnerability to risky and reckless behavior.
    vi_tri: Steinberg 2008, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Mô tả (description). Chữ cũ: "Vỏ não trước trán hoàn thiện sau cùng, hệ phần thưởng nhạy bén nhất ở giữa tuổi teen — mô hình mất cân bằng phát triển giải thích vì sao teen hiểu nguy hiểm mà vẫn liều". Chữ mới: "trưởng thành muộn", "nhạy bén ở giữa tuổi teen", "đề xuất lời giải thích cho việc teen có thể hiểu nguy hiểm mà vẫn liều". Lý do: "hoàn thiện sau cùng" quá mạnh (Gogtay: thùy thái dương bên chín muộn nhất trên toàn vỏ não); "nhạy bén nhất" thì Shulman 2016 nói đỉnh có thể ở cuối tuổi teen; "giải thích" thành "đề xuất" vì mô hình còn bị phê bình. Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Steinberg 2008 (bản PMC2396566, lưu ở Wayback 26/08/2024): "make mid-adolescence a time of heightened vulnerability"; mô tả đã dùng "đề xuất", "trưởng thành muộn".'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/18509515/", "https://pubmed.ncbi.nlm.nih.gov/19327037/", "https://pubmed.ncbi.nlm.nih.gov/16793895/" ]
    review: dung
  - id: n2
    cau: 'Tự trải nghiệm: bạn 16 tuổi giải được bài toán khó, tranh luận sắc sảo, nhưng tối thứ Bảy nhận lời thách đố lạng lách khi có đám bạn hò reo, dù biết nguy hiểm.'
    loai: phat-hien
    nguon:
      - steinberg2008
    trich: The fact that adolescents are knowledgeable, logical, reality-based, and accurate in the ways in which they think about risky activity – or, at least, as knowledgeable, logical, reality-based, and accurate as their elders – but engage in higher rates of risky behavior than adults
    vi_tri: Steinberg 2008, Introduction (dẫn Reyna & Farley 2006)
    ket_qua: dung
    ghi_chu: Tình huống giả định (gia-dinh); khớp mô tả của Steinberg 2008 về teen hiểu biết nhưng mạo hiểm.
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/" ]
    luot_2_ghi_chu: Ví dụ giả định, nhất quán với nguồn.
  - id: n3
    cau: Theo mô hình "hai hệ thống" của Steinberg, hệ phần thưởng nhạy cảm cao vào khoảng giữa tuổi teen, còn hệ kiểm soát ở vỏ não trước trán tiếp tục trưởng thành đến tận đầu hay giữa tuổi đôi mươi; sự có mặt của bạn bè đạp thêm vào "chân ga".
    loai: phat-hien
    nguon:
      - steinberg2008
      - shulman2016
    trich: self-regulatory competence, which occurs gradually and is not complete until the mid-20s, makes mid-adolescence a time of heightened vulnerability
    vi_tri: 'Steinberg 2008, mục Introduction; Shulman 2016: "cognitive control increase gradually and linearly throughout adolescence and into the early 20s"'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Não tuổi teen không hỏng — nó đang lệch nhịp. … hệ phần thưởng đạt đỉnh nhạy cảm vào giữa tuổi teen, trong khi hệ kiểm soát … phải đến đầu tuổi đôi mươi mới hoàn thiện." Chữ mới: "Theo mô hình hai hệ thống của Steinberg, …; nhạy cảm cao vào khoảng giữa tuổi teen …; tiếp tục trưởng thành đến tận đầu hay giữa tuổi đôi mươi". Lý do: nêu rõ đây là mô hình; Steinberg 2008 nói "mid-20s", Shulman 2016 nói "early 20s". Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Steinberg 2008 (bản PMC2396566, lưu ở Wayback 26/08/2024): "not complete until the mid-20s"; Shulman 2016 "into the early 20s" (lượt 2 đọc). Trang ghi "đầu hay giữa tuổi đôi mươi".'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/18509515/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/" ]
    luot_2_ghi_chu: Mô hình 'dual systems' của Steinberg (Shulman 2016 xác nhận).
    review: dung
  - id: n4
    cau: 'Từ khoảng 10 tuổi đến đầu tuổi đôi mươi, não bộ trải qua nhiều thay đổi cấu trúc, trong đó có hai quá trình được nói tới nhiều: tỉa synap và myelin hóa.'
    loai: phat-hien
    nguon:
      - gogtay2004
      - steinberg2008
    trich: Studies of GM maturation show a loss in cortical GM density over time (15, 16), which temporally correlates with postmortem findings of increased synaptic pruning during adolescence and early adulthood (17–19).
    vi_tri: Gogtay 2004, mục Introduction
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "não bộ trải qua đợt đại tu lớn thứ hai trong đời (sau giai đoạn sơ sinh), gồm hai quá trình song song". Chữ mới: "nhiều thay đổi cấu trúc, trong đó có hai quá trình được nói tới nhiều". Lý do: "đợt đại tu lớn thứ hai trong đời" không có trong nguồn đã mở. Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Gogtay 2004 (PDF của PNAS, bản lưu Wayback 31/01/2022; bài truy cập mở): câu trích ở Introduction khớp. "đại tu lớn thứ hai" đã bỏ.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC3621648/" ]
    luot_2_ghi_chu: Tổng quan bậc 2 vừa phải (Arain 2013, Neuropsychiatr Dis Treat); 'từ khoảng 10 tuổi' theo mốc dậy thì.
    review: dung
  - id: n5
    cau: Việc chất xám vỏ não giảm dần trên MRI có thể một phần do tỉa synap (Gogtay và cộng sự đoán); đây là một phần của phát triển bình thường.
    loai: phat-hien
    nguon:
      - gogtay2004
    trich: We speculate that it may be driven at least partially by the process of synaptic pruning (43) together with trophic glial and vascular changes and/or cell shrinkage (44).
    vi_tri: Gogtay 2004, Discussion
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Tỉa synap: não loại bỏ bớt các kết nối thần kinh ít được dùng để tinh chỉnh mạng lưới … Chất xám giảm dần theo một làn sóng từ phía sau ra phía trước, và vỏ não trước trán … hoàn thiện sau cùng." Chữ mới: nói rõ đó là suy đoán của các tác giả ("speculate"), thêm thứ tự giảm chất xám theo nguồn. Lý do: Gogtay nói nguyên nhân "unknown", suy đoán một phần do tỉa synap. Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Gogtay 2004 (PDF của PNAS, bản lưu Wayback 31/01/2022; bài truy cập mở), Discussion: "the primary cause for loss of GM density is unknown. We speculate that it may be driven at least partially by the process of synaptic pruning (43) together with trophic glial and vascular changes and/or cell shrinkage". Lượt 2 không mở được toàn văn; review xác nhận.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/15148381/" ]
    luot_2_ghi_chu: Cần toàn văn PNAS để xác nhận 'Gogtay đoán một phần do tỉa synap'. PMC và PNAS chặn tải tự động (kiểm tra trình duyệt, 403); chưa mở được.
    review: dung
  - id: n6
    cau: 'Chất xám giảm theo thứ tự: vùng cảm giác–vận động và thị giác bậc thấp trước, vùng liên kết bậc cao sau; trong thùy trán, vỏ não trước trán lưng–bên mất chất xám muộn nhất, vào cuối tuổi vị thành niên.'
    loai: phat-hien
    nguon:
      - gogtay2004
    trich: Frontal and occipital poles lose GM early, and in the frontal lobe, the GM maturation ultimately involves the dorsolateral prefrontal cortex, which loses GM only at the end of adolescence.
    vi_tri: Gogtay 2004, Results
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chất xám giảm dần theo một làn sóng từ phía sau ra phía trước, và vỏ não trước trán là nơi hoàn thiện sau cùng." Chữ mới như trên. Lý do: cực trán mất chất xám sớm (ngoại lệ của "từ sau ra trước"); trên toàn vỏ não vùng chín muộn nhất là thùy thái dương bên. Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Gogtay 2004 (PDF của PNAS, bản lưu Wayback 31/01/2022; bài truy cập mở), Results: "Frontal and occipital poles lose GM early, and in the frontal lobe, the GM maturation ultimately involves the dorsolateral prefrontal cortex, which loses GM only at the end of adolescence"; tóm tắt: "higher-order association cortices mature only after lower-order somatosensory and visual cortices". Khớp.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/15148381/" ]
    luot_2_ghi_chu: Nửa đầu khớp tóm tắt; 'vỏ não trước trán lưng–bên mất chất xám muộn nhất, cuối tuổi vị thành niên' cần toàn văn, chưa mở được.
    review: dung
  - id: n7
    cau: 'Myelin hóa: các sợi thần kinh được bọc myelin giúp tín hiệu truyền nhanh và ổn định hơn; quá trình này kéo dài sang thập niên thứ hai của đời và có thể còn lâu hơn.'
    loai: phat-hien
    nguon:
      - steinberg2008
      - gogtay2004
    trich: myelination is ongoing well into the second decade of life and perhaps beyond
    vi_tri: 'Steinberg 2008, mục về vỏ não trước trán; Gogtay 2004: "the dorsolateral prefrontal cortex matures last, coinciding with its later myelination"'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Quá trình này cũng kéo dài đến đầu tuổi trưởng thành, hoàn thiện muộn nhất ở các vùng trán." Chữ mới: "kéo dài sang thập niên thứ hai của đời và có thể còn lâu hơn (Steinberg 2008); vỏ não trước trán lưng–bên chín muộn, trùng với myelin hóa muộn hơn (Gogtay 2004)". Lý do: bám nguồn; Steinberg còn nói tỉa synap ở vỏ não trước trán chủ yếu hoàn tất vào giữa tuổi teen. Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Steinberg 2008 (bản PMC2396566, lưu ở Wayback 26/08/2024): "myelination is ongoing well into the second decade of life and perhaps beyond"; Gogtay 2004: "the dorsolateral prefrontal cortex matures last, coinciding with its later myelination". Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC3621648/" ]
    luot_2_ghi_chu: "'Có thể còn lâu hơn': Arain nêu đến 24 tuổi."
    review: dung
  - id: n8
    cau: Theo mô hình của Steinberg (2008), hệ cảm xúc–xã hội — gồm hạnh nhân và nhân accumbens — trở nên nhạy với phần thưởng quanh tuổi dậy thì, liên quan tái cấu trúc hệ dopamine.
    loai: phat-hien
    nguon:
      - steinberg2008
    trich: Risk-taking increases between childhood and adolescence as a result of changes around the time of puberty in the brain's socio-emotional system leading to increased reward-seeking, especially in the presence of peers, fueled mainly by a dramatic remodeling of the brain's dopaminergic system.
    vi_tri: 'Steinberg 2008, tóm tắt; Introduction: "Key nodes of these networks comprise the amygdala, nucleus accumbens, orbitofrontal cortex, medial prefrontal cortex, and superior temporal sulcus"'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hệ limbic — cụm cấu trúc sâu trong não phụ trách cảm xúc và phần thưởng, nổi bật là nhân accumbens — lại trở nên nhạy cảm bất thường với phần thưởng vào giữa tuổi teen, một phần do sự tái cấu trúc mạnh mẽ của hệ dopamine quanh tuổi dậy thì." Chữ mới: "theo mô hình của Steinberg (2008), hệ cảm xúc–xã hội — gồm các cấu trúc như hạnh nhân và nhân accumbens — … liên quan đến sự tái cấu trúc …". Lý do: thuật ngữ "limbic" không dùng trong nguồn (dùng "socio-emotional system"); "bất thường", "một phần do" mạnh hơn nguồn ("fueled mainly by"). Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Steinberg 2008 (bản PMC2396566, lưu ở Wayback 26/08/2024): "Key nodes of these networks comprise the amygdala, nucleus accumbens, orbitofrontal cortex, medial prefrontal cortex, and superior temporal sulcus"; tóm tắt: "fueled mainly by a dramatic remodeling of the brain''s dopaminergic system". Lượt 2 không mở được toàn văn; review xác nhận.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/18509515/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/" ]
    luot_2_ghi_chu: Tóm tắt Steinberg 2008 khớp ý chính; việc nêu 'hạnh nhân và nhân accumbens' nằm trong toàn văn (PMC chặn tải tự động), chưa mở được. Shulman 2016 chỉ nói 'dopamine-rich limbic regions', 'ventral striatum'.
    review: dung
  - id: n9
    cau: 'Kết quả là một sự lệch pha về thời gian: độ nhạy với phần thưởng tăng cao ở giữa tuổi teen khi khả năng tự kiểm soát còn đang tiếp tục trưởng thành.'
    loai: phat-hien
    nguon:
      - steinberg2008
      - steinberg2008b
    trich: The differing timetables of these changes – the increase in reward-seeking, which occurs early and is relatively abrupt, and the increase in self-regulatory competence, which occurs gradually and is not complete until the mid-20s
    vi_tri: Steinberg 2008, Introduction
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "khả năng bị kích thích bởi phần thưởng lên đến đỉnh điểm đúng lúc khả năng tự kiểm soát còn đang dang dở". Chữ mới: "độ nhạy với phần thưởng tăng cao … còn đang tiếp tục trưởng thành". Lý do: nói "tăng cao", không nói "đỉnh điểm" (Shulman 2016 nói đỉnh có thể ở cuối tuổi teen). Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Steinberg 2008 (bản PMC2396566, lưu ở Wayback 26/08/2024): câu trích khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/18509515/", "https://pubmed.ncbi.nlm.nih.gov/16793895/" ]
    review: dung
  - id: n10
    cau: 'Gogtay và cộng sự (2004): nhóm NIMH chụp MRI 13 trẻ khỏe mạnh, mỗi 2 năm trong 8–10 năm (từ 4 đến 21 tuổi), tổng cộng 52 lượt chụp, dựng thành "phim" time-lapse về chất xám vỏ não.'
    loai: so-lieu
    nguon:
      - gogtay2004
    trich: Thirteen healthy children for whom anatomic brain MRI scans were obtained every 2 years, for 8–10 years, were studied.
    vi_tri: 'Gogtay 2004, tóm tắt; Bảng 1: "Total no. of scans 52"'
    ket_qua: dung
    ghi_chu: 'Trang thêm "tổng cộng 52 lượt chụp" (Bảng 1). "NIMH" theo mục Discussion: "referral bias of the National Institute of Mental Health study". Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Gogtay 2004 (PDF của PNAS, bản lưu Wayback 31/01/2022; bài truy cập mở): tóm tắt "Thirteen healthy children … every 2 years, for 8–10 years"; Bảng 1 và Discussion "These analyses are based on 52 scans"; Methods "recruited from the community for an ongoing National Institute of Mental Health study". Khớp.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/15148381/" ]
    luot_2_ghi_chu: Khớp 13 trẻ, mỗi 2 năm, 8–10 năm, 4–21 tuổi. 'Tổng cộng 52 lượt chụp' và 'nhóm NIMH' không có trong tóm tắt; toàn văn chưa mở được.
    review: dung
  - id: n11
    cau: Các vùng liên kết bậc cao chín muộn hơn các vùng cảm giác–vận động và thị giác bậc thấp mà chúng tích hợp; các vùng cổ xưa hơn chín trước các vùng mới hơn.
    loai: phat-hien
    nguon:
      - gogtay2004
    trich: (i) higher-order association cortices mature only after lower-order somatosensory and visual cortices, the functions of which they integrate, are developed, and (ii) phylogenetically older brain areas mature earlier than newer ones.
    vi_tri: Gogtay 2004, tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/15148381/" ]
  - id: n12
    cau: Trên toàn vỏ não, thùy thái dương bên là vùng chín muộn nhất; cực trán và cực chẩm mất chất xám sớm.
    loai: phat-hien
    nguon:
      - gogtay2004
    trich: Similar to the frontal pole, the occipital pole matured early. Lateral temporal lobes were the last to mature.
    vi_tri: Gogtay 2004, Discussion
    ket_qua: da-sua
    ghi_chu: 'Câu thêm khi sửa n6 (chữ cũ: "vỏ não trước trán … hoàn thiện cuối cùng"). Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Gogtay 2004 (PDF của PNAS, bản lưu Wayback 31/01/2022; bài truy cập mở), Discussion: "Similar to the frontal pole, the occipital pole matured early. Lateral temporal lobes were the last to mature." Khớp.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/15148381/" ]
    luot_2_ghi_chu: Chi tiết 'thùy thái dương bên chín muộn nhất; cực trán và cực chẩm mất chất xám sớm' nằm trong toàn văn Gogtay 2004 (chưa mở được), không có trong tóm tắt.
    review: dung
  - id: n13
    cau: 'Giới hạn của Gogtay và cộng sự: chỉ 13 trẻ, IQ trung bình khoảng 125, mẫu không đại diện (thiên lệch lựa chọn do nghiên cứu của NIMH); chất xám trên MRI là thước đo gián tiếp.'
    loai: so-lieu
    nguon:
      - gogtay2004
    trich: These analyses are based on 52 scans, in which 1,976 anatomical models were created, giving sufficient power to track change, but are from only 13 children. In addition, this is a nonrepresentative population with an average IQ of 125
    vi_tri: Gogtay 2004, Discussion; Bảng 1 (IQ 125,8 ± 12,7)
    ket_qua: dung
    ghi_chu: 'Câu thêm vào trang. Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Gogtay 2004 (PDF của PNAS, bản lưu Wayback 31/01/2022; bài truy cập mở), Discussion: "from only 13 children. In addition, this is a nonrepresentative population with an average IQ of 125, reflecting a referral bias of the National Institute of Mental Health study"; Bảng 1: IQ 125,8 ± 12,7. Khớp.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/15148381/" ]
    luot_2_ghi_chu: Chỉ 13 trẻ khớp. IQ trung bình ~125 và 'thiên lệch lựa chọn' cần toàn văn, chưa mở được.
    review: dung
  - id: n14
    cau: Galvan và cộng sự (2006) quét fMRI 41 người — 16 trẻ em 7–11 tuổi, 13 vị thành niên 13–17 tuổi, 12 người lớn 23–29 tuổi — làm nhiệm vụ có phần thưởng với các mức giá trị khác nhau; 37 người (13, 12, 12) có dữ liệu để phân tích sau khi loại 4 người cử động quá mức.
    loai: so-lieu
    nguon:
      - galvan2006
    trich: Sixteen children (seven females; aged 7–11, with mean age of 9.8 years), 13 adolescents (six females; aged 13–17, with mean age of 16 years), and 12 right-handed healthy adults (six females; aged 23–29, with mean age of 25 years) participated in the fMRI experiment. … Three children and one adolescent were excluded from the analysis due to excessive motion
    vi_tri: Galvan 2006, Materials and Methods, "Participants"; tóm tắt "Thirty-seven participants (7–29 years of age)"
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "quét não của 37 người — 16 trẻ em, 13 vị thành niên và 12 người lớn". Chữ mới: "41 người (16, 13, 12), 37 người có dữ liệu phân tích (13, 12, 12)". Lý do: 16+13+12 = 41, không phải 37; 37 là số người sau khi loại 4 người cử động quá mức. Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Galvan 2006 (PDF của J Neurosci, bản lưu Wayback 28/10/2026; bài truy cập mở), Participants: "Sixteen children (… aged 7–11 …), 13 adolescents (… aged 13–17 …), and 12 … adults (… aged 23–29 …) participated in the fMRI experiment"; "Three children and one adolescent were excluded from the analysis due to excessive motion". 41 quét, 37 phân tích (13, 12, 12): đúng. Tóm tắt viết "Thirty-seven participants … were scanned", lệch nhẹ với Methods; trang theo Methods.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/16793895/", "https://api.crossref.org/works/10.1523/jneurosci.1062-06.2006" ]
    luot_2_ghi_chu: 37 người 7–29 tuổi khớp tóm tắt. Phân nhóm (16/13/12 và 13/12/12) và 4 người bị loại do cử động cần toàn văn; PMC/jneurosci chặn tải tự động.
    review: dung
  - id: n15
    cau: Ở vị thành niên, nhân accumbens hoạt động mạnh hơn cả trẻ em lẫn người lớn; hoạt động giống người lớn về mức lan rộng và độ nhạy với giá trị phần thưởng, nhưng biên độ bị phóng đại.
    loai: phat-hien
    nguon:
      - galvan2006
    trich: Accumbens activity in adolescents looked like that of adults in both extent of activity and sensitivity to reward values, although the magnitude of activity was exaggerated.
    vi_tri: Galvan 2006, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "mức độ phản ứng đã như người lớn nhưng biên độ thì phóng đại". Chữ mới: "giống người lớn về mức lan rộng và độ nhạy với giá trị phần thưởng, nhưng biên độ bị phóng đại" (bám tóm tắt). Phần "mạnh hơn cả trẻ em lẫn người lớn": tóm tắt "exaggerated accumbens activity, relative to prefrontal activity in adolescents, compared with children and adults". Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Galvan 2006 (PDF của J Neurosci, bản lưu Wayback 28/10/2026; bài truy cập mở): tóm tắt "Accumbens activity in adolescents looked like that of adults in both extent of activity and sensitivity to reward values, although the magnitude of activity was exaggerated".'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/16793895/" ]
    luot_2_ghi_chu: "Tóm tắt: 'exaggerated accumbens activity ... in adolescents, compared with children and adults'."
    review: dung
  - id: n16
    cau: Mức lan rộng của hoạt động ở vỏ não ổ mắt ở vị thành niên giống trẻ em hơn là người lớn.
    loai: phat-hien
    nguon:
      - galvan2006
    trich: In contrast, the extent of orbital frontal cortex activity in adolescents looked more like that of children than adults, with less focal patterns of activity.
    vi_tri: Galvan 2006, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "vỏ não ổ mắt … ở vị thành niên lại hoạt động giống trẻ em hơn là người lớn". Chữ mới: "mức lan rộng của hoạt động ở vỏ não ổ mắt … giống trẻ em hơn". Lý do: bám chữ "extent of activity" của tóm tắt. Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Galvan 2006 (PDF của J Neurosci, bản lưu Wayback 28/10/2026; bài truy cập mở): "the extent of orbital frontal cortex activity in adolescents looked more like that of children than adults".'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/16793895/" ]
    review: dung
  - id: n17
    cau: Các tác giả cho rằng hệ thống dưới vỏ đang chín bị kích hoạt quá mức so với hệ thống kiểm soát từ trên xuống chín muộn hơn, khiến vị thành niên nghiêng về lợi ích trước mắt; đây là một nghiên cứu nhỏ, cắt ngang.
    loai: phat-hien
    nguon:
      - galvan2006
    trich: These findings suggest that maturing subcortical systems become disproportionately activated relative to later maturing top-down control systems, biasing the adolescent's action toward immediate over long-term gains.
    vi_tri: Galvan 2006, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Các tác giả kết luận: …". Chữ mới: "Các tác giả cho rằng …" và thêm nhận xét về quy mô và thiết kế (so sánh nhóm tuổi khác nhau, không theo dõi dọc). Lý do: tóm tắt dùng "suggest". Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Galvan 2006 (PDF của J Neurosci, bản lưu Wayback 28/10/2026; bài truy cập mở): "These findings suggest that maturing subcortical systems become disproportionately activated relative to later maturing top–down control systems".'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/16793895/" ]
    luot_2_ghi_chu: "37 người, cắt ngang: 'nghiên cứu nhỏ'."
    review: dung
  - id: n18
    cau: 'Gardner và Steinberg (2005): 306 người trong ba nhóm tuổi 13–16, 18–22, từ 24 trở lên; mỗi người làm một nhiệm vụ lái xe trên máy tính một mình hoặc có hai bạn cùng tuổi, chia ngẫu nhiên.'
    loai: so-lieu
    nguon:
      - gardner2005
      - steinberg2008
    trich: In this study, 306 individuals in 3 age groups--adolescents (13-16), youths (18-22), and adults (24 and older)--completed 2 questionnaire measures assessing risk preference and risky decision making, and 1 behavioral task measuring risk taking. Participants in each age group were randomly assigned to complete the measures either alone or with 2 same-aged peers.
    vi_tri: 'Gardner & Steinberg 2005, tóm tắt; Steinberg 2008: "a video driving game … the longer they drive, the more points they earn but that if the car crashes into the wall, all the points that have been accumulated are lost"'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thiết kế trò chơi lái xe trên máy tính ("Chicken"): người chơi cố đi xa nhất có thể mà không đâm vào tường. Ba nhóm tuổi … mỗi nhóm chơi trong hai điều kiện: một mình hoặc có hai bạn cùng tuổi ngồi xem". Chữ mới: thêm cỡ mẫu 306, "chia ngẫu nhiên"; bỏ tên "Chicken". Lý do: tên trò chơi không có trong nguồn đã mở (Steinberg 2008 mô tả là "video driving game"); "ngồi xem" bỏ vì tóm tắt chỉ nói "with 2 same-aged peers". Tên Margo Gardner theo Crossref. Review (Claude Opus 5.5, 10/11/2026): dung. Tóm tắt Gardner & Steinberg 2005 (Europe PMC): 306 người, ba nhóm tuổi, chia ngẫu nhiên một mình hay với 2 bạn cùng tuổi. Mô tả trò chơi theo Steinberg 2008 (toàn văn). Khớp; tên "Chicken" đã bỏ.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/16060809/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3075496/" ]
    review: dung
  - id: n19
    cau: Khi chơi một mình, mức liều lĩnh của cả ba nhóm tuổi tương đương nhau; khi có bạn bè, nhóm 13–16 liều gấp đôi, nhóm 18–22 liều hơn khoảng 50%, người lớn không thay đổi.
    loai: so-lieu
    nguon:
      - steinberg2008
      - gardner2005
    trich: When subjects were alone, levels of risky driving were comparable across the three age groups. However, the presence of friends doubled risk-taking among the adolescents, increased it by fifty percent among the youths, but had no effect on the adults
    vi_tri: Steinberg 2008, mục về bạn bè (tóm lược bài Gardner & Steinberg 2005)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Khi chơi một mình, cả ba nhóm liều lĩnh ngang nhau — bằng chứng cho thấy teen không phải lúc nào cũng bốc đồng hơn người lớn." Chữ mới: "Theo mô tả của Steinberg (2008) về nghiên cứu này, …". Lý do: số liệu lấy từ bài của chính Steinberg (tác giả) mô tả, chưa mở toàn văn Gardner 2005. Tóm tắt của Gardner 2005 còn nói rủi ro và quyết định rủi ro giảm theo tuổi nói chung: không mâu thuẫn nhưng nên nêu. Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Steinberg 2008 (bản PMC2396566, lưu ở Wayback 26/08/2024): "When subjects were alone, levels of risky driving were comparable across the three age groups. However, the presence of friends doubled risk-taking among the adolescents, increased it by fifty percent among the youths, but had no effect on the adults". Lượt 2 không mở được; review xác nhận. Trang ghi "Theo mô tả của Steinberg (2008)".'
    luot_2: khong-chac
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/16060809/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3075496/" ]
    luot_2_ghi_chu: Chiều khớp (thanh thiếu niên nhiều nhất, người lớn không đổi; một mình thì tương đương, theo Chein 2011). 'Gấp đôi' và '50%' là số cụ thể, tóm tắt Gardner & Steinberg không nêu; toàn văn chưa mở được (bản mở chặn).
    review: dung
  - id: n20
    cau: Bài gốc kết luận sự có mặt của bạn bè làm tăng liều lĩnh, hiệu ứng mạnh hơn ở tuổi teen và thanh niên so với người lớn.
    loai: phat-hien
    nguon:
      - gardner2005
    trich: participants took more risks, focused more on the benefits than the costs of risky behavior, and made riskier decisions when in peer groups than alone; and (c) peer effects on risk taking and risky decision making were stronger among adolescents and youths than adults.
    vi_tri: Gardner & Steinberg 2005, tóm tắt
    ket_qua: dung
    ghi_chu: Thay câu cũ "Đây là một trong những minh chứng thực nghiệm rõ ràng nhất …" (nhận xét không kiểm được).
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/16060809/" ]
  - id: n21
    cau: 'Steinberg (2008): hành vi mạo hiểm tăng từ tuổi thơ lên tuổi teen vì hệ cảm xúc–xã hội thay đổi quanh tuổi dậy thì; rồi giảm về tuổi trưởng thành vì hệ kiểm soát nhận thức cải thiện khả năng tự điều chỉnh, chưa hoàn tất cho đến giữa tuổi đôi mươi.'
    loai: phat-hien
    nguon:
      - steinberg2008
    trich: Risk-taking declines between adolescence and adulthood because of changes in the brain's cognitive control system – changes which improve individuals' capacity for self-regulation.
    vi_tri: Steinberg 2008, tóm tắt; Introduction ("not complete until the mid-20s")
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hệ cảm xúc–xã hội "chín" sớm; … hệ kiểm soát nhận thức … hoàn thiện muộn, kéo dài suốt tuổi teen và đầu tuổi đôi mươi". Chữ mới: "thay đổi quanh tuổi dậy thì", "chưa hoàn tất cho đến giữa tuổi đôi mươi". Lý do: bám nguồn. Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Steinberg 2008 (bản PMC2396566, lưu ở Wayback 26/08/2024): tóm tắt và "not complete until the mid-20s". Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/18509515/" ]
    review: dung
  - id: n22
    cau: 'Điểm mấu chốt của mô hình: sự lệch nhịp giữa hai hệ thống khiến giữa tuổi teen dễ tổn thương nhất trước hành vi mạo hiểm.'
    loai: phat-hien
    nguon:
      - steinberg2008
    trich: The differing timetables of these changes make mid-adolescence a time of heightened vulnerability to risky and reckless behavior.
    vi_tri: Steinberg 2008, tóm tắt
    ket_qua: dung
    ghi_chu: Đây là điều mô hình nói, không phải kết quả đo trực tiếp.
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/18509515/" ]
  - id: n23
    cau: Steinberg và cộng sự (2008) khảo sát 935 người từ 10 đến 30 tuổi (đa dạng về kinh tế–xã hội và sắc tộc) bằng cả tự báo cáo lẫn đo hành vi.
    loai: so-lieu
    nguon:
      - steinberg2008b
    trich: a socioeconomically and ethnically diverse sample of 935 individuals between the ages of 10 and 30, using self-report and behavioral measures of each construct
    vi_tri: Steinberg 2008b, tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/18999337/" ]
    luot_2_ghi_chu: Steinberg và cộng sự 2008, Developmental Psychology.
  - id: n24
    cau: 'Tìm kiếm cảm giác mạnh (sensation seeking) đi theo đường cong: tăng từ 10 đến 15 tuổi rồi giảm hoặc giữ nguyên; tính bốc đồng giảm đều đặn từ 10 tuổi trở đi.'
    loai: so-lieu
    nguon:
      - steinberg2008b
    trich: sensation seeking increasing between 10 and 15 and declining or remaining stable thereafter. In contrast, age differences in impulsivity, which are unrelated to puberty, follow a linear pattern, with impulsivity declining steadily from age 10 on.
    vi_tri: Steinberg 2008b, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "xu hướng tìm kiếm phần thưởng đi theo đường cong — tăng từ tiền teen lên đỉnh ở giữa tuổi teen rồi giảm". Chữ mới: "tìm kiếm cảm giác mạnh (sensation seeking) … tăng từ 10 đến 15 tuổi rồi giảm hoặc giữ nguyên". Lý do: thước đo là sensation seeking, không phải "phần thưởng"; nguồn nói "giảm hoặc giữ nguyên". Review (Claude Opus 5.5, 10/11/2026): dung. Tóm tắt Steinberg và cộng sự 2008 (Europe PMC): "sensation seeking increasing between 10 and 15 and declining or remaining stable thereafter … impulsivity declining steadily from age 10 on"; 935 người 10–30 tuổi. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/18999337/" ]
    review: dung
  - id: n25
    cau: Sự kết hợp "ham cảm giác mạnh cao + tự kiểm soát chưa xong" ở giữa tuổi teen được các tác giả coi là có thể giải thích sự mạo hiểm.
    loai: phat-hien
    nguon:
      - steinberg2008b
    trich: Heightened vulnerability to risk taking in middle adolescence may be due to the combination of relatively higher inclinations to seek excitement and relatively immature capacities for self-control that are typical of this period of development.
    vi_tri: Steinberg 2008b, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "chính là công thức của sự mạo hiểm". Chữ mới: "được các tác giả coi là có thể giải thích". Lý do: nguồn dùng "may be due to". Review (Claude Opus 5.5, 10/11/2026): dung. Tóm tắt Steinberg và cộng sự 2008: "may be due to the combination …". Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/18999337/" ]
    review: dung
  - id: n26
    cau: Bài tổng quan của chính nhóm Steinberg (Shulman và cộng sự, 2016) rà soát bằng chứng từ 2008, kết luận nhìn chung bằng chứng ủng hộ mô hình hai hệ thống và "tái khẳng định" nó, dù thừa nhận là bản đơn giản hóa.
    loai: lich-su
    nguon:
      - shulman2016
    trich: Recent findings (since 2008) generally support the dual systems model.
    vi_tri: 'Shulman 2016, Highlights; Abstract: "Although it is admittedly an oversimplification, as a heuristic device, the dual systems model provides a far more accurate account of adolescent risk taking than prior models"'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một bài tổng quan sau đó (Shulman và cộng sự, 2016) đã rà soát lại toàn bộ bằng chứng và tái khẳng định mô hình này." Chữ mới: "của chính nhóm Steinberg … rà soát bằng chứng từ 2008 … tái khẳng định … dù thừa nhận là bản đơn giản hóa". Lý do: Steinberg là đồng tác giả của bài tổng quan ("toàn bộ" quá mạnh; bài là tổng quan có chọn lọc của chính tác giả mô hình). Review (Claude Opus 5.5, 10/11/2026): dung. Shulman 2016 (lượt 2 đọc PMC6990093): "Recent findings (since 2008) generally support the dual systems model"; "admittedly an oversimplification". Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/" ]
    luot_2_ghi_chu: Shulman, Smith, Silva, Icenogle, Duell, Chein, Steinberg (2016).
    review: dung
  - id: n27
    cau: 'Các tác giả khác phê bình mô hình: chưa đủ tinh vi, và giữa tuổi teen chưa chắc là đỉnh của mạo hiểm; phân tích tổng hợp của Defoe và cộng sự (2015) thấy teen mạo hiểm hơn người lớn (g = 0,37) nhưng ngang trẻ em ở nhiều nhiệm vụ trong phòng thí nghiệm (g = 0).'
    loai: phat-hien
    nguon:
      - shulman2016
      - defoe2015
    trich: adolescents take more risks (g = .37) than adults … adolescents and children take equal levels of risk (g = -.00)
    vi_tri: Shulman 2016, mục 2 ("critiques of this viewpoint … Pfeifer and Allen, 2012 … Defoe et al., 2014"); Defoe 2015, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Câu thêm vào trang (cân bằng chữ "tái khẳng định"). Chữ "Defoe và cộng sự, 2015" là năm đăng chính thức; Shulman ghi 2014 (bản trực tuyến). Review (Claude Opus 5.5, 10/11/2026): dung. Tóm tắt Defoe 2015 (Europe PMC): "adolescents take more risks (g = .37) than adults … adolescents and children take equal levels of risk (g = -.00)". Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/25365761/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/" ]
    review: dung
  - id: n28
    cau: 'Khá vững: vỏ não trước trán trưởng thành muộn; độ nhạy phần thưởng cao ở giữa tuổi teen.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - gogtay2004
      - steinberg2008b
      - galvan2006
      - shulman2016
      - defoe2015
    ly_do: 'Việc các vùng liên kết bậc cao chín muộn thấy trong MRI dọc 13 trẻ (Gogtay 2004) và được tổng quan của Steinberg 2008 nhắc tới; độ nhạy phần thưởng cao ở khoảng giữa tuổi teen thấy trong tự báo cáo của 935 người (Steinberg 2008b) và một nghiên cứu fMRI nhỏ (Galvan 2006); nhưng Shulman 2016 nói đỉnh có thể ở cuối tuổi teen, một số nghiên cứu không thấy teen nhạy phần thưởng hơn, Defoe 2015 thấy teen mạo hiểm hơn người lớn nhưng ngang trẻ em ở nhiều nhiệm vụ phòng thí nghiệm. Chưa có phân tích tổng hợp hay tái lập đăng ký trước cho cả hai ý; mẫu chủ yếu phương Tây; hai ý khác nhau, khung gộp theo ý yếu hơn: "khá vững".'
    nguon:
      - gogtay2004
      - steinberg2008b
      - galvan2006
      - shulman2016
      - defoe2015
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: khung "Vững chắc: vỏ não trước trán hoàn thiện sau cùng; độ nhạy phần thưởng đạt đỉnh ở giữa tuổi teen — làn sóng hoàn thiện từ sau ra trước … đã được ghi nhận qua nhiều nghiên cứu MRI độc lập (Gogtay 2004) …". Chữ mới: khung "Khá vững: vỏ não trước trán trưởng thành muộn; độ nhạy phần thưởng cao ở giữa tuổi teen", nêu giới hạn và phê bình. Lý do: khung gộp hai ý (theo bài học đợt 3–4: theo ý yếu hơn); ý "đạt đỉnh ở giữa tuổi teen" còn tranh luận; "nhiều nghiên cứu MRI độc lập" dẫn chỉ một nghiên cứu (Gogtay, 13 trẻ). Đổi nhãn làm đổi dòng Tóm tắt nhanh. Review nên xem lại. Review (Claude Opus 5.5, 10/11/2026): dung. Nhãn Khá vững (đổi từ Vững chắc) đúng thước đo: khung gộp hai ý; ý vỏ não trước trán chín muộn dựa một nghiên cứu dọc 13 trẻ (Gogtay 2004, toàn văn đã mở); ý độ nhạy phần thưởng có dữ liệu cùng chiều (Steinberg 2008b, Galvan 2006) nhưng có phân tích tổng hợp không thấy teen hơn trẻ em trong phòng thí nghiệm (Defoe 2015). Không đạt Vững chắc; chưa tới mức Đang tranh cãi cho ý chung vì Defoe vẫn thấy teen mạo hiểm hơn người lớn (g = 0,37) và hơn trẻ em ở nhiệm vụ "nóng".'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/", "https://pubmed.ncbi.nlm.nih.gov/16793895/", "https://pubmed.ncbi.nlm.nih.gov/25365761/" ]
    luot_2_ghi_chu: "Nhiều nghiên cứu cùng chiều, có ngoại lệ (kích hoạt vân lúc chờ thưởng, Defoe): 'Khá vững' không vượt thước đo."
    review: dung
  - id: n29
    cau: 'Khá vững: bạn bè khuếch đại hành vi mạo hiểm ở tuổi teen.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - gardner2005
      - shulman2016
      - steinberg2008
    ly_do: 'Gardner & Steinberg 2005 (306 người, ngẫu nhiên) và Shulman 2016 (tổng quan nhóm Steinberg: vị thành niên bị thúc đẩy bởi sự có mặt của bạn bè hơn người lớn, dẫn Chein 2011, Smith 2014); nghiên cứu về lái xe của thiếu niên cũng cùng chiều (Simons-Morton 2005, qua Steinberg 2008). Giới hạn: chưa có phân tích tổng hợp hay tái lập lớn có đăng ký trước, nhiều nghiên cứu cùng nhóm tác giả, mẫu phương Tây; nên "khá vững".'
    nguon:
      - gardner2005
      - shulman2016
      - steinberg2008
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hiệu ứng … đã được tái lập qua nhiều biến thể thí nghiệm (Gardner và Steinberg, 2005 và các nghiên cứu tiếp nối). Mức độ khuếch đại … thay đổi theo bối cảnh cụ thể, nhưng hướng của hiệu ứng thì nhất quán." Chữ mới: dẫn Shulman 2016 (Chein 2011; Smith 2014), "chưa có tái lập lớn có đăng ký trước". Lý do: "đã được tái lập qua nhiều biến thể" chưa dẫn nguồn riêng; "thay đổi theo bối cảnh" không có nguồn, nay chỉ nói "hướng nhất quán trong các nguồn đã đọc". Review (Claude Opus 5.5, 10/11/2026): dung. Nhãn Khá vững: Gardner & Steinberg 2005 (tóm tắt: "peer effects … were stronger among adolescents and youths than adults") cộng các nghiên cứu Shulman 2016 dẫn; chưa có tái lập lớn có đăng ký trước, nhiều nghiên cứu cùng nhóm. Đúng thước đo.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/16060809/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3075496/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/" ]
    luot_2_ghi_chu: "Nhiều thí nghiệm cùng hướng, chưa có tái lập đăng ký trước: 'Khá vững'."
    review: dung
  - id: n30
    cau: 'Shulman và cộng sự (2016): các thí nghiệm thao tác bối cảnh xã hội thấy vị thành niên bị thúc đẩy bởi sự có mặt của bạn bè để mạo hiểm hơn người lớn (dẫn Chein 2011; Gardner & Steinberg 2005; Smith 2014).'
    loai: phat-hien
    nguon:
      - shulman2016
    trich: Studies that have manipulated the social context have found that adolescents are more induced by peer presence to take risks than are adults
    vi_tri: Shulman 2016, mục 4.3 (tác động của bạn bè)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3075496/" ]
    luot_2_ghi_chu: Tên tác giả trích trong bản đã mở bị lược khỏi văn bản; Chein 2011 và Gardner & Steinberg 2005 xác nhận riêng.
  - id: n31
    cau: 'Đang tranh cãi: "não chưa hoàn thiện" có làm giảm trách nhiệm của người chưa thành niên?'
    loai: nhan
    nhan: tranh-cai
    co_so:
      - steinberg2009
    ly_do: 'Câu hỏi giao giữa khoa học, pháp luật và đạo đức. Steinberg 2009 (tóm tắt): chính sách "cannot, and should not, be dictated solely by studies of adolescent development" nhưng nên "informed by the lessons of developmental science", và chính ông kết luận các bài học ấy "offer strong support for the maintenance of a separate juvenile justice system". Bằng chứng khoa học không tự phân xử được câu hỏi giá trị (mức trách nhiệm), nên trong bốn nhãn của site Đang tranh cãi là nhãn đúng nhất; review (10/11/2026) giữ nhãn và thêm vào thân khung kết luận của Steinberg để người đọc thấy lập trường của nguồn. Giới hạn: chưa mở nguồn của phía phản đối.'
    nguon:
      - steinberg2009
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đây là nơi khoa học giao với pháp luật và đạo đức — và các nhà khoa học cũng chia rẽ." Chữ mới: bỏ "và các nhà khoa học cũng chia rẽ". Lý do: không có nguồn mở về sự chia rẽ của các nhà khoa học; thay bằng điều Steinberg 2009 viết. Chỗ khó: nhãn "đang tranh cãi" dựa trên bản chất giá trị của câu hỏi hơn là hai bằng chứng mâu thuẫn. Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại tóm tắt Steinberg 2009 (Europe PMC). Nhãn giữ (lý do ở ly_do). Thân khung trước đây chỉ nêu lời cảnh báo của Steinberg mà không nêu kết luận của ông (ủng hộ mạnh hệ thống tư pháp riêng cho người chưa thành niên), dễ đọc thành Steinberg trung lập; review thêm câu: "Bản thân ông kết luận rằng, ở Mỹ, các bài học ấy ủng hộ mạnh việc duy trì một hệ thống tư pháp riêng cho người chưa thành niên" (cùng chỗ sửa với n46).'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/19327037/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/" ]
    luot_2_ghi_chu: "Là câu hỏi quy phạm/pháp lý: các nguồn không thống nhất, hợp 'Đang tranh cãi'."
    review: dung
  - id: n32
    cau: 'Steinberg (2009): chính sách tư pháp "không thể và không nên" bị quyết định chỉ bởi nghiên cứu phát triển, nhưng cách đối xử với người chưa thành niên vi phạm pháp luật nên được tham khảo từ khoa học phát triển.'
    loai: phat-hien
    nguon:
      - steinberg2009
    trich: Although justice system policy and practice cannot, and should not, be dictated solely by studies of adolescent development, the ways in which we respond to juvenile offending should be informed by the lessons of developmental science.
    vi_tri: Steinberg 2009, tóm tắt
    ket_qua: dung
