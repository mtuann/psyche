    trich: most systematic research on health education indicates that even the best programs are far more successful at changing individuals' knowledge than in altering their behavior
    vi_tri: Steinberg 2008, Introduction
    ket_qua: dung
    luot_2: khong-chac
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/18509515/" ]
    luot_2_ghi_chu: Nhận định của Steinberg 2008 về chương trình giáo dục đổi hiểu biết hơn hành vi nằm trong toàn văn (chưa mở được).
    ghi_chu: 'Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Steinberg 2008 (bản PMC2396566, lưu ở Wayback 26/08/2024): "most systematic research on health education indicates that even the best programs are far more successful at changing individuals'' knowledge than in altering their behavior". Lượt 2 không mở được; review xác nhận.'
    review: dung
  - id: n39
    cau: Theo mô hình, rủi ro tăng lên khi hệ cảm xúc–xã hội được kích hoạt mạnh (ví dụ có bạn bè, cảm xúc dâng cao); khi không được kích hoạt mạnh, hệ kiểm soát đủ mạnh để điều tiết, kể cả ở đầu tuổi teen.
    loai: phat-hien
    nguon:
      - steinberg2008
    trich: Indeed, when the socio-emotional network is not highly activated (for example, when individuals are not emotionally excited or are alone), the cognitive control network is strong enough to impose regulatory control over impulsive and risky behavior, even in early adolescence
    vi_tri: Steinberg 2008, mục về bạn bè
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/" ]
  - id: n40
    cau: 'Khá vững (chip ở Áp dụng 2): thiết kế môi trường thay vì trông chờ "tự kiềm chế".'
    loai: nhan
    nhan: kha-vung
    co_so:
      - steinberg2008
    ly_do: 'Steinberg 2008 lập luận rằng nỗ lực giảm mạo hiểm nên tập trung vào bối cảnh hơn là kiến thức, dẫn nghiên cứu về hành khách cùng tuổi và tai nạn (Simons-Morton 2005); đây là lập luận của một tác giả, không có phân tích tổng hợp hay thử nghiệm can thiệp trong nguồn đã mở. Giới hạn: một nguồn chính; nên "khá vững" ở mức tối đa; review xem lại.'
    nguon:
      - steinberg2008
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ: "Vì chân phanh sinh học chưa lắp xong, chiến lược hiệu quả nhất là giảm số tình huống cần đến phanh: hạn chế để teen lái xe chở nhiều bạn cùng lúc vào ban đêm, quản lý tiền tiêu vặt và thời gian online, giữ rượu bia và chất gây nghiện ngoài tầm với. Đây cũng là logic đằng sau nhiều chính sách giới hạn độ tuổi trên thế giới". Chữ mới: lập luận của Steinberg (2008) và nghiên cứu của Simons-Morton 2005, kèm "ví dụ của chúng tôi". Lý do: "hiệu quả nhất", "tiền tiêu vặt", "thời gian online", "rượu bia", "nhiều chính sách trên thế giới" không có nguồn mở; bỏ. Review (Claude Opus 5.5, 10/11/2026): sai. Lượt 2: qua-manh. Đồng ý: Steinberg 2008 lập luận nên thay đổi bối cảnh ("should therefore focus on changing the context") và dẫn Simons-Morton 2005 về hành khách cùng tuổi; không nguồn đã mở nào kiểm hiệu quả của cách "thiết kế môi trường". Đã bỏ chip :nhan[kha-vung] ở tiêu đề Áp dụng 2, giữ id cũ { #2-thiet-ke-moi-truong-thay-vi-trong-cho-tu-kiem-che-kha-vung }. Thân mục giữ, đã ghi là lập luận của Steinberg và ví dụ của site.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/", "https://pubmed.ncbi.nlm.nih.gov/18509515/" ]
    luot_2_ghi_chu: "câu đúng: Mô hình nhấn mạnh vai trò bối cảnh nên khuyến nghị thay đổi bối cảnh là hợp lý, nhưng hiệu quả của cách này chưa được kiểm chứng bằng nguồn đã đọc.; Các nguồn mở xác nhận vai trò bối cảnh trong mô hình, không có thử nghiệm can thiệp 'thiết kế môi trường' nào đã đọc; nhãn 'Khá vững' cho khuyến nghị là cao hơn bằng chứng."
    review: sai
  - id: n41
    cau: 'Steinberg (2008): nỗ lực giảm mạo hiểm ở tuổi teen nên tập trung thay đổi bối cảnh nơi hành vi mạo hiểm xảy ra hơn là chủ yếu thay đổi điều teen biết và cách teen nghĩ; có bạn cùng tuổi trong xe làm tăng nguy cơ tai nạn nghiêm trọng khi người lái là thiếu niên (Simons-Morton và cộng sự, 2005).'
    loai: phat-hien
    nguon:
      - steinberg2008
    trich: efforts to prevent or minimize adolescent risk-taking should therefore focus on changing the context in which risky activity takes place rather than mainly attempting, as current practice does, to change what adolescents know and the ways they think.
    vi_tri: Steinberg 2008, tóm tắt (cuối đoạn mở đầu); "the presence of same-aged passengers in a car driven by an adolescent driver significantly increases the risk of a serious accident (Simons-Morton, Lerner, & Springer, 2005)"
    ket_qua: dung
    ghi_chu: 'Nguồn thứ cấp cho Simons-Morton (qua Steinberg 2008). Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Steinberg 2008 (bản PMC2396566, lưu ở Wayback 26/08/2024): "efforts to prevent or minimize adolescent risk-taking should therefore focus on changing the context …"; "the presence of same-aged passengers in a car driven by an adolescent driver significantly increases the risk of a serious accident (Simons-Morton, Lerner, & Springer, 2005)". Simons-Morton dẫn qua Steinberg, trang ghi "ông dẫn nghiên cứu". Khớp.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/18509515/" ]
    luot_2_ghi_chu: "Câu có hai phần: khuyến nghị của Steinberg 2008 (toàn văn chưa mở được) và Simons-Morton 2005 về bạn cùng tuổi trong xe (bài gốc chưa tìm được bản mở)."
    review: dung
  - id: n42
    cau: 'Áp dụng 3: các nguồn đã đọc chỉ kiểm tra tác động của bạn bè lên hành vi mạo hiểm, chưa kiểm tra hiệu quả của các chương trình dùng ảnh hưởng của bạn bè theo hướng tích cực; vì vậy không đưa ra khuyến nghị.'
    loai: phat-hien
    nguon:
      - shulman2016
      - gardner2005
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ: "Cùng một cơ chế khiến bạn bè khuếch đại rủi ro cũng có thể khuếch đại điều tốt: teen cũng nhạy với sự công nhận của bạn bè khi làm việc tốt. Các chương trình dùng đàn anh đàn chị hướng dẫn, hoạt động nhóm lành mạnh hay thử thách tập thể tích cực đều đang khai thác đúng chân ga này — chỉ khác hướng đi." Chữ mới: câu nói không có nguồn và không đưa khuyến nghị. Lý do: không mở được nguồn kiểm chứng ảnh hưởng tích cực của bạn bè hay chương trình đàn anh; bỏ khẳng định và chip nhãn (id mục giữ). Chỗ khó: Shulman 2016 thấy bạn bè làm tăng rủi ro, không nói về điều tốt. Review (Claude Opus 5.5, 10/11/2026): sai. Thân mục đúng (Gardner 2005, Shulman 2016 chỉ kiểm bạn bè làm tăng mạo hiểm; không kiểm chương trình dùng bạn bè theo hướng tích cực; đây là câu về phạm vi nguồn, kiểm được bằng tóm tắt hai bài). Nhưng tiêu đề mục vẫn là lời khuyên "3. Dùng sức mạnh của bạn bè theo hướng tích cực", trái với thân mục. Tiêu đề mới: "3. Bạn bè có thể là ảnh hưởng tích cực?", giữ id cũ.'
    luot_2: khong-chac
    luot_2_ghi_chu: Là câu về phạm vi các nguồn site đã đọc, không kiểm được từ bên ngoài; bản thân khoảng trống ('chưa kiểm tra') là khẳng định về văn liệu, nên chuyển thành ve-site hoặc ghi rõ phạm vi.
    review: sai
  - id: n43
    cau: 'Áp dụng 4: các nguồn đã đọc không kiểm tra việc học một kỹ năng ở tuổi teen có hiệu quả hơn các tuổi khác hay không, nên không đưa ra lời khuyên về "thời điểm vàng"; điều có nguồn: chất xám vỏ não giảm dần trong tuổi teen, một phần có thể do tỉa synap.'
    loai: phat-hien
    nguon:
      - gogtay2004
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ: "Tỉa synap hoạt động theo nguyên tắc dùng hoặc mất: kết nối nào được dùng nhiều sẽ được giữ lại và myelin hóa. Tuổi teen vì vậy là thời điểm vàng để đầu tư vào ngoại ngữ, nhạc cụ, thể thao, kỹ năng tư duy — những đường cao tốc thần kinh được xây lúc này sẽ phục vụ cả đời … đừng lãng phí giai đoạn não dẻo nhất." Chữ mới: không đưa lời khuyên, giữ điều Gogtay nói. Lý do: "dùng hoặc mất" và "thời điểm vàng" không có trong nguồn đã mở (Gogtay nói cơ chế chưa rõ); lời khuyên học tập cần nguồn riêng. Chip nhãn bỏ, id mục giữ. Review (Claude Opus 5.5, 10/11/2026): sai. Phần có nguồn (chất xám giảm trong tuổi teen, một phần có thể do tỉa synap) khớp Gogtay 2004 (Mở toàn văn Gogtay 2004 (PDF của PNAS, bản lưu Wayback 31/01/2022; bài truy cập mở)). Nhưng tiêu đề mục vẫn là lời khuyên "4. Tận dụng ''cửa sổ'' học hỏi của não đang tỉa", trái với thân mục (không đưa lời khuyên về thời điểm vàng). Tiêu đề mới: "4. Tuổi teen có ''cửa sổ'' học hỏi riêng?", giữ id cũ.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/15148381/" ]
    luot_2_ghi_chu: Phần 'chất xám giảm, một phần có thể do tỉa synap' cần toàn văn Gogtay 2004 (chưa mở được); phần còn lại là câu về phạm vi nguồn đã đọc.
    review: sai
  - id: n44
    cau: Các nghiên cứu nêu trong bài chủ yếu thực hiện ở Mỹ.
    loai: lich-su
    nguon:
      - gogtay2004
      - steinberg2009
    trich: This review begins with a brief overview of the history, rationale, and workings of the American juvenile justice system.
    vi_tri: 'Steinberg 2009, tóm tắt; Gogtay 2004, Discussion: "the National Institute of Mental Health study"'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hầu hết nghiên cứu về não vị thành niên thực hiện ở Mỹ và châu Âu." Chữ mới: "Các nghiên cứu nêu trong bài chủ yếu thực hiện ở Mỹ". Lý do: câu cũ nói chung về toàn ngành, không kiểm được; chỉ nói điều bài dẫn. Đã kiểm địa điểm cho Gogtay 2004 (NIMH, Mỹ) và Steinberg 2009 (hệ thống tư pháp Mỹ); với Galvan 2006, Gardner & Steinberg 2005, Steinberg và cộng sự 2008 chưa kiểm đơn vị nơi làm việc từ nguồn đã mở (các tác giả Galvan, Casey, Steinberg ở Mỹ theo hiểu biết chung): chữ "chủ yếu" giữ ở mức đó. Review (Claude Opus 5.5, 10/11/2026): dung. Gogtay (NIMH, Bethesda), Galvan (địa chỉ trong PDF J Neurosci: Weill Cornell, New York), Steinberg (Temple): Mỹ; Defoe là tổng hợp quốc tế nhưng chỉ dẫn một câu. "chủ yếu ở Mỹ" đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/16060809/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3075496/", "https://pubmed.ncbi.nlm.nih.gov/15148381/", "https://pubmed.ncbi.nlm.nih.gov/16793895/" ]
    luot_2_ghi_chu: Suy từ cơ quan tác giả; Defoe là phân tích tổng hợp quốc tế.
    review: dung
  - id: n45
    cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu chụp não (MRI/fMRI) về phát triển não vị thành niên trên người Việt, cũng như thí nghiệm kiểu Gardner và Steinberg trên thiếu niên Việt.
    loai: thoi-su
    nguon:
      - tim-kiem-vn
    het_han: '2028-11-01'
    ket_qua: da-sua
    ghi_chu: 'Europe PMC ngày 10/11/2026, ba truy vấn nêu ở nguồn: không có. Chữ cũ: "Chúng tôi chưa tìm thấy dữ liệu chụp não (MRI/fMRI) về phát triển não vị thành niên trên người Việt" (không có mốc). Chữ mới: thêm "Tính đến 11/2026" và vế "thí nghiệm kiểu Gardner và Steinberg". Chưa tìm Google Scholar hay tạp chí trong nước; OpenAlex bị giới hạn lượt. Review (Claude Opus 5.5, 10/11/2026): dung. Có mốc "Tính đến 11/2026", het_han; lượt 2 tìm độc lập trên Europe PMC cũng không thấy.'
    luot_2: dung
    luot_2_nguon: [ "https://www.ebi.ac.uk/europepmc/webservices/rest/search?format=json&query=(TITLE%3A%22brain%20development%22%20OR%20TITLE%3A%22cortical%22%20OR%20TITLE%3A%22gray%20matter%22)%20AND%20(TITLE%3Aadolescen*)%20AND%20(AFF%3A%22Hanoi%22%20OR%20AFF%3A%22Ho%20Chi%20Minh%22%20OR%20TITLE%3AVietnam*)", "https://www.ebi.ac.uk/europepmc/webservices/rest/search?format=json&query=(%22risk%20taking%22%20OR%20%22risk-taking%22)%20AND%20(Vietnam%20OR%20Vietnamese)%20AND%20adolescen*%20AND%20(peer)%20AND%20(driving%20OR%20%22decision%20making%22)" ]
    luot_2_ghi_chu: "Phạm vi: Europe PMC; không phủ tạp chí trong nước."
    review: dung
  - id: n46
    cau: 'Steinberg (2009) bàn về việc dùng khoa học phát triển trong hệ thống tư pháp người chưa thành niên của Mỹ, qua ba vấn đề (trách nhiệm hình sự, năng lực ra tòa, tác động của hình phạt); ông kết luận khoa học phát triển ủng hộ mạnh việc duy trì một hệ thống tư pháp riêng cho người chưa thành niên, đồng thời nhấn mạnh chính sách không thể và không nên được quyết định chỉ bởi các nghiên cứu phát triển.'
    loai: lich-su
    nguon:
      - steinberg2009
    trich: 'Taken together, the lessons of developmental science offer strong support for the maintenance of a separate juvenile justice system in which adolescents are judged, tried, and sanctioned in developmentally appropriate ways.'
    vi_tri: 'Steinberg 2009, tóm tắt (Europe PMC)'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "khoa học phát triển đã được trích dẫn trong các tranh luận về tư pháp người chưa thành niên ở nhiều nước (Steinberg, 2009) … một trong nhiều nguồn tham khảo … bên cạnh văn hóa, đạo đức và thực tiễn xã hội". Chữ mới: "hệ thống tư pháp … của Mỹ", "một trong các cân nhắc". Lý do: tóm tắt nói về Mỹ, không nói "nhiều nước"; "văn hóa, đạo đức, thực tiễn" là diễn giải của người viết. Review (Claude Opus 5.5, 10/11/2026): sai. Lượt 2: sai. Đồng ý. Chữ cũ: "Steinberg (2009) bàn về việc dùng khoa học phát triển trong hệ thống tư pháp người chưa thành niên của Mỹ. Như chính ông nhấn mạnh, khoa học chỉ nên là một trong các cân nhắc cho nhà làm luật." Tóm tắt nói rõ ông có kết luận chính sách: "offer strong support for the maintenance of a separate juvenile justice system", qua ba vấn đề "criminal culpability … competence to stand trial … impact of punitive sanctions". Chữ mới nêu ba vấn đề và kết luận ấy, giữ lời cảnh báo "cannot, and should not, be dictated solely". Câu "Bài viết này không đưa ra khuyến nghị …" là lập trường của site, giữ. Khung Đang tranh cãi sửa theo (n31).'
    luot_2: sai
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/19327037/" ]
    luot_2_ghi_chu: "câu đúng: Steinberg (2009) bàn về việc dùng khoa học phát triển trong tư pháp người chưa thành niên của Mỹ: khoa học không thể và không nên một mình quyết định chính sách, nhưng bài kết luận khoa học phát triển ủng hộ mạnh việc duy trì hệ thống tư pháp riêng, qua ba vấn đề: trách nhiệm hình sự, năng lực ra tòa, tác động của chế tài trừng phạt.; Tóm tắt nói rõ kết luận có tính khuyến nghị chính sách; phần 'khoa học chỉ nên là một trong các cân nhắc' đúng."
