    cau: 'Câu hỏi 2: tỉa synap là quá trình loại bỏ các kết nối thần kinh ít được dùng để tinh chỉnh mạng lưới não, được cho là góp phần vào việc chất xám giảm trong tuổi teen, song song với myelin hóa; không phải sự hư hại.'
