    cau: 'Đọc thêm: trang "Tuổi teen: mình là ai?" (kham-pha/phat-trien/ban-sac-tuoi-teen) và "Bắt nạt và áp lực thi cử?" (kham-pha/phat-trien/tam-ly-hoc-duong).'
