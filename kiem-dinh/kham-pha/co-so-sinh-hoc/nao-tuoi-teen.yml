  - id: n55
    cau: 'Câu hỏi 3: thí nghiệm lái xe của Gardner và Steinberg (2005) — khi chơi một mình các nhóm tuổi liều ngang nhau; khi có bạn bè xem, nhóm 13–16 liều gấp đôi, nhóm 18–22 hơn khoảng 50%, người lớn không thay đổi (theo Steinberg 2008).'
    loai: so-lieu
    nguon:
      - steinberg2008
      - gardner2005
    trich: the presence of friends doubled risk-taking among the adolescents, increased it by fifty percent among the youths, but had no effect on the adults
    vi_tri: Steinberg 2008
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: câu hỏi nêu trò chơi "Chicken", giải thích "rất quan trọng: nó bác bỏ ý tưởng teen là những cá nhân bốc đồng trong mọi hoàn cảnh … bối cảnh xã hội mới là chất xúc tác". Chữ mới: bỏ "Chicken"; giải thích nói "theo mô tả của Steinberg (2008)", "bối cảnh xã hội là một yếu tố khuếch đại rủi ro". Lý do: như n18, n19. Lựa chọn nhiễu ("luôn liều hơn trong mọi điều kiện", "người lớn liều hơn teen khi có bạn bè") sai. Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Steinberg 2008 (bản PMC2396566, lưu ở Wayback 26/08/2024): số liệu gấp đôi, 50%, không đổi khớp (xem n19).'
    luot_2: khong-chac
