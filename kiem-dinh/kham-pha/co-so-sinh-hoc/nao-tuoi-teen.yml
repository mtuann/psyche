    trich: psychological and neural reflections of better cognitive control increase gradually and linearly throughout adolescence and into the early 20s
    vi_tri: 'Shulman 2016, tóm tắt; Steinberg 2008: "not complete until the mid-20s"'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Con số 25 thường gặp trên báo chí chỉ là cách nói gọn — các nhà nghiên cứu nhấn mạnh phát triển là một phổ liên tục, không có đường ranh cứng nào mà qua một đêm não bỗng xong. Đừng dùng nó như một mốc pháp lý hay tâm lý tuyệt đối." Chữ mới: dẫn Shulman và Steinberg; "chúng tôi không tìm thấy một mốc cứng ở tuổi 25". Lý do: "thường gặp trên báo chí" và "các nhà nghiên cứu nhấn mạnh" không có nguồn mở; hai nguồn nêu "đầu tuổi 20" (Shulman) và "giữa tuổi 20" (Steinberg). Review (Claude Opus 5.5, 10/11/2026): dung. Shulman 2016 "into the early 20s"; Mở toàn văn Steinberg 2008 (bản PMC2396566, lưu ở Wayback 26/08/2024) "not complete until the mid-20s". Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/" ]
    review: dung
  - id: n49
    cau: 'Ngộ nhận: teen không hẳn liều vì không hiểu nguy hiểm; teen hiểu biết, lý luận và đánh giá rủi ro chính xác không kém người lớn nhưng vẫn mạo hiểm nhiều hơn; khi chơi một mình các nhóm tuổi liều ngang nhau, khi có bạn bè teen liều hơn.'
