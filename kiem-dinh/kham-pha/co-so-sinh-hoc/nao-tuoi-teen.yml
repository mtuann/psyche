    trich: These findings suggest that maturing subcortical systems become disproportionately activated relative to later maturing top-down control systems
    vi_tri: Galvan 2006, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đây là bằng chứng não trực tiếp cho mô hình lệch nhịp". Chữ mới: "Đây là một bằng chứng não ủng hộ mô hình lệch nhịp (từ một nghiên cứu nhỏ)". Lý do: "trực tiếp" mạnh hơn nguồn (tác giả dùng "suggest"). Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Galvan 2006 (PDF của J Neurosci, bản lưu Wayback 28/10/2026; bài truy cập mở): "suggest"; "một bằng chứng … từ một nghiên cứu nhỏ" đúng mức.'
