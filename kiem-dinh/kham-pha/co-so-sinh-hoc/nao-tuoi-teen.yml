  - id: n53
    cau: 'Câu hỏi 1: theo mô hình "mất cân bằng phát triển" của Steinberg (2008), giữa tuổi teen dễ mạo hiểm nhất vì hệ phần thưởng nhạy cảm đúng lúc hệ kiểm soát ở vỏ não trước trán còn chưa hoàn thiện; điểm mấu chốt là sự lệch nhịp giữa hai hệ thống; teen hiểu nguy hiểm.'
    loai: phat-hien
    nguon:
      - steinberg2008
    trich: The differing timetables of these changes make mid-adolescence a time of heightened vulnerability to risky and reckless behavior.
    vi_tri: Steinberg 2008, tóm tắt
    ket_qua: dung
    ghi_chu: 'Lựa chọn nhiễu ("vỏ não trước trán hoàn toàn chưa hoạt động", "không hiểu khái niệm nguy hiểm") sai (gia-dinh). Lời giải thích không dựa vào vị trí lựa chọn. Review (Claude Opus 5.5, 10/11/2026): sai. Hồ sơ ghi "hệ phần thưởng nhạy cảm đúng lúc …", nhưng lựa chọn đúng của câu hỏi 1 trên trang vẫn viết "đạt đỉnh nhạy cảm", điều lượt 1 đã đổi ở n3, n9 (Shulman 2016: đỉnh có thể ở cuối tuổi teen). Đổi thành "nhạy cảm cao đúng lúc …".'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/18509515/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/" ]
