    ghi_chu: 'Chữ cũ: "… theo nguyên tắc dùng hoặc mất, song song với myelin hóa" và "Đây cũng là lý do tuổi teen là cửa sổ vàng để học kỹ năng mới". Chữ mới: "được cho là góp phần vào việc chất xám giảm", bỏ "dùng hoặc mất" và "cửa sổ vàng". Lý do: như n36, n43. Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Gogtay 2004 (PDF của PNAS, bản lưu Wayback 31/01/2022; bài truy cập mở): "We speculate that it may be driven at least partially by the process of synaptic pruning"; "được cho là góp phần" đúng mức.'
