    nguon:
      - steinberg2008
      - gardner2005
    trich: The fact that adolescents are knowledgeable, logical, reality-based, and accurate in the ways in which they think about risky activity – or, at least, as knowledgeable, logical, reality-based, and accurate as their elders – but engage in higher rates of risky behavior than adults
    vi_tri: Steinberg 2008, Introduction
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Sai. Trong trạng thái bình tĩnh, teen đánh giá rủi ro không kém người lớn là bao (Gardner và Steinberg, 2005). Vấn đề là khi phần thưởng và bạn bè xuất hiện, hệ thống phần thưởng lấn át khả năng kiềm chế — các em biết nhưng không thắng được cơn thôi thúc lúc đó." Chữ mới: dẫn Steinberg 2008 (Reyna & Farley 2006). Lý do: tóm tắt Gardner 2005 thấy "risky decision making decreased with age", nên không dẫn bài ấy cho "đánh giá rủi ro không kém"; "không thắng được cơn thôi thúc" là diễn giải. Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Steinberg 2008 (bản PMC2396566, lưu ở Wayback 26/08/2024): câu trích (Reyna & Farley 2006) và mô tả Gardner & Steinberg khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3075496/" ]
    review: dung
  - id: n50
    cau: 'Ngộ nhận: chất xám giảm trên MRI trong tuổi teen là một phần của phát triển bình thường; nguyên nhân chưa rõ, Gogtay và cộng sự đoán một phần do tỉa synap cùng thay đổi tế bào thần kinh đệm, mạch máu, co nhỏ tế bào; myelin hóa diễn ra song song.'
    loai: phat-hien
    nguon:
      - gogtay2004
    trich: Although changes in sulcal and gyral folding patterns or other nonatrophic processes such as dehydration could influence the GM density, the primary cause for loss of GM density is unknown.
    vi_tri: Gogtay 2004, Discussion
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Không phải mất tế bào ồ ạt — đó là quá trình tinh chỉnh: loại bỏ kết nối ít dùng để mạng lưới còn lại hoạt động hiệu quả hơn, song song với việc bọc myelin tăng tốc các kết nối được giữ lại." Chữ mới: nói nguyên nhân chưa rõ, đây là suy đoán của tác giả. Lý do: nguồn nói "primary cause … is unknown". Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Gogtay 2004 (PDF của PNAS, bản lưu Wayback 31/01/2022; bài truy cập mở): "the primary cause for loss of GM density is unknown. We speculate … synaptic pruning (43) together with trophic glial and vascular changes and/or cell shrinkage"; "pruning [and] myelination may often occur in parallel". Khớp.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/15148381/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3621648/" ]
    luot_2_ghi_chu: Phần 'phát triển bình thường' và myelin hóa song song có nguồn; phần 'Gogtay đoán một phần do tỉa synap cùng thay đổi tế bào đệm, mạch máu, co nhỏ tế bào' cần toàn văn Gogtay (chưa mở được).
    review: dung
  - id: n51
    cau: 'Ngộ nhận: mạo hiểm và tìm cái mới ở tuổi teen theo mô hình gắn với tìm kiếm phần thưởng và ảnh hưởng của bạn bè, không phải thái độ chống đối; chưa có nguồn đã mở đo trực tiếp "chống đối người lớn".'
    loai: phat-hien
    nguon:
      - steinberg2008
    trich: increased reward-seeking, especially in the presence of peers
    vi_tri: Steinberg 2008, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hành vi thử giới hạn ở tuổi teen phần lớn là biểu hiện của lịch trình phát triển (tìm kiếm sự mới lạ, sự công nhận của bạn bè), không phải âm mưu chống đối cá nhân nào." Chữ mới: "Theo mô hình hai hệ thống, … gắn với tìm kiếm phần thưởng và ảnh hưởng của bạn bè (Steinberg 2008), chứ không phải một thái độ chống đối; chúng tôi chưa mở nguồn nào đo trực tiếp". Lý do: "phần lớn" và "sự công nhận của bạn bè" không kiểm được. Review (Claude Opus 5.5, 10/11/2026): dung. Mở toàn văn Steinberg 2008 (bản PMC2396566, lưu ở Wayback 26/08/2024): "increased reward-seeking, especially in the presence of peers"; trang đã rào "chưa mở nguồn nào đo trực tiếp".'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/18509515/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6990093/" ]
