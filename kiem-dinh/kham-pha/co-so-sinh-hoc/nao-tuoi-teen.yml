  - id: n56
    cau: 'Câu hỏi 4: Galvan và cộng sự (2006): nhân accumbens ở teen hoạt động mạnh hơn cả trẻ em lẫn người lớn, còn vỏ não ổ mắt giống trẻ em hơn người lớn; một bằng chứng não ủng hộ mô hình lệch nhịp (từ một nghiên cứu nhỏ).'
    loai: phat-hien
    nguon:
