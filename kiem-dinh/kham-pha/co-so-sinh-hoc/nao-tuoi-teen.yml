    luot_2_ghi_chu: Không mở trang nên không so từng mục. Metadata thật khớp bản ghi cho Defoe 2015 (Psychol Bull 141:48), Galvan 2006 (J Neurosci 26:6885), Gardner & Steinberg 2005 (Dev Psychol 41:625), Gogtay 2004 (PNAS 101:8174), Shulman 2016 (Dev Cogn Neurosci 17:103), Steinberg 2008 (Dev Rev 28:78), Steinberg 2009 (Annu Rev Clin Psychol 5:459), Steinberg và cộng sự 2008 (Dev Psychol). Cần so với danh sách trên trang.
