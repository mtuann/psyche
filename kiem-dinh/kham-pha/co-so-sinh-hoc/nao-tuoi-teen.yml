    cau: 'Ngộ nhận: các nguồn đã đọc mô tả khả năng tự kiểm soát cải thiện dần qua tuổi teen đến đầu hay giữa tuổi đôi mươi, không phải một mốc "qua một đêm"; chúng tôi không tìm thấy một mốc cứng ở tuổi 25.'
