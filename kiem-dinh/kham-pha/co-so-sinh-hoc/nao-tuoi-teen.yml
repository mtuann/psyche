doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch). Khung đầu đổi nhãn nên dòng tóm tắt đầu cũng đổi (hồ sơ n28).
  - cu: 'mô tả: "Vỏ não trước trán hoàn thiện sau cùng, hệ phần thưởng nhạy bén nhất ở giữa tuổi teen — mô hình … giải thích vì sao teen hiểu nguy hiểm mà vẫn liều"'
    moi: '"Vỏ não trước trán trưởng thành muộn, hệ phần thưởng nhạy bén ở giữa tuổi teen — mô hình … đề xuất lời giải thích …"'
    ly_do: Hồ sơ n1.
  - cu: 'đáp án mở đầu: "Não tuổi teen không hỏng — nó đang lệch nhịp. … phải đến đầu tuổi đôi mươi mới hoàn thiện."'
    moi: '"Theo mô hình hai hệ thống của Steinberg, … tiếp tục trưởng thành đến tận đầu hay giữa tuổi đôi mươi."'
    ly_do: Hồ sơ n3.
  - cu: 'mục Điều gì đang xảy ra: "đợt đại tu lớn thứ hai trong đời"; tỉa synap và myelin hóa; "hệ limbic … nhạy cảm bất thường"'
    moi: '"nhiều thay đổi cấu trúc"; tỉa synap là suy đoán của Gogtay; myelin hóa kéo dài sang thập niên thứ hai; "hệ cảm xúc–xã hội … theo mô hình của Steinberg (2008)"'
    ly_do: Hồ sơ n4–n9.
  - cu: 'Gogtay: "Chất xám giảm dần (phản ánh tỉa synap và myelin hóa) theo một làn sóng từ vùng cảm giác–thị giác … ra phía trước … vỏ não trước trán … hoàn thiện cuối cùng … bằng chứng hình ảnh trực quan nhất …"'
    moi: thứ tự chín muộn theo nguồn (vỏ não trước trán lưng–bên muộn nhất trong thùy trán, thùy thái dương bên muộn nhất toàn vỏ não), kèm giới hạn mẫu (13 trẻ, IQ 125)
    ly_do: Hồ sơ n6, n10–n13.
  - cu: 'Galvan: "quét não của 37 người — 16 trẻ em, 13 vị thành niên và 12 người lớn"; "Adriana Galvan"; "hoạt động giống trẻ em hơn"; "Các tác giả kết luận"'
    moi: '"41 người (16, 13, 12); 37 người (13, 12, 12) có dữ liệu phân tích"; "Galvan"; "mức lan rộng của hoạt động … giống trẻ em hơn"; "Các tác giả cho rằng … nghiên cứu nhỏ, cắt ngang"'
    ly_do: Hồ sơ n14–n17, n59.
  - cu: 'Gardner: "M Gardner … ("Chicken") … một mình hoặc có hai bạn cùng tuổi ngồi xem"; "Đây là một trong những minh chứng thực nghiệm rõ ràng nhất …"'
    moi: '"Margo Gardner … 306 người … trò chơi lái xe trên máy tính …"; "Theo mô tả của Steinberg (2008) …"; "Bài gốc kết luận …"'
    ly_do: Hồ sơ n18–n20, n59.
  - cu: 'Steinberg 2008: "hệ cảm xúc–xã hội chín sớm … hệ kiểm soát … hoàn thiện muộn, kéo dài … đầu tuổi đôi mươi"'
    moi: '"thay đổi quanh tuổi dậy thì … chưa hoàn tất cho đến giữa tuổi đôi mươi"'
    ly_do: Hồ sơ n21.
  - cu: 'Steinberg và cộng sự 2008: "xu hướng tìm kiếm phần thưởng … tăng từ tiền teen lên đỉnh ở giữa tuổi teen rồi giảm"; "chính là công thức của sự mạo hiểm"; "Shulman … rà soát lại toàn bộ bằng chứng và tái khẳng định"'
    moi: '"tìm kiếm cảm giác mạnh … tăng từ 10 đến 15 tuổi rồi giảm hoặc giữ nguyên"; "được các tác giả coi là có thể giải thích"; "tổng quan của chính nhóm Steinberg … tái khẳng định … thừa nhận đơn giản hóa; các tác giả khác phê bình (Defoe …)"'
    ly_do: Hồ sơ n24–n27.
  - cu: 'khung "Vững chắc: vỏ não trước trán hoàn thiện sau cùng; độ nhạy phần thưởng đạt đỉnh ở giữa tuổi teen"'
    moi: 'khung "Khá vững: vỏ não trước trán trưởng thành muộn; độ nhạy phần thưởng cao ở giữa tuổi teen" với giới hạn và phê bình'
    ly_do: Hồ sơ n28.
  - cu: 'khung Khá vững: "Hiệu ứng … đã được tái lập qua nhiều biến thể thí nghiệm …"'
    moi: dẫn Shulman 2016 (Chein 2011; Smith 2014); "chưa có tái lập lớn có đăng ký trước"
    ly_do: Hồ sơ n29, n30.
  - cu: 'khung Đang tranh cãi: "… và các nhà khoa học cũng chia rẽ"'
    moi: bỏ vế đó
    ly_do: Hồ sơ n31.
  - cu: 'mục Các lý thuyết: "hệ cảm xúc–xã hội chín sớm (có lợi cho việc tách khỏi gia đình, kết bạn, tìm bạn đời)"; "Góc nhìn thích nghi … môi trường hiện đại (xe máy, ma túy, mạng xã hội)"; "Não đang xây … tỉa synap … dùng hoặc mất … cửa sổ vàng"'
    moi: mô hình hai hệ thống (không có phần "có lợi cho …"); giả thuyết thích nghi theo Steinberg 2008 / Spear 2000; "Các nguồn … không ủng hộ cách nhìn xem não teen như phiên bản lỗi …"
    ly_do: Hồ sơ n34–n36.
  - cu: câu "Vì sao tiến hóa lại thiết kế ra một bộ não lệch nhịp như vậy?"
    moi: '"Vì sao não tuổi teen có thể lệch nhịp như vậy?"'
    ly_do: Không phải số liệu; bỏ cách nói "tiến hóa thiết kế" (hồ sơ n35).
  - cu: 'Áp dụng 1: "… khả năng suy luận của các em không có vấn đề gì …; Vì vậy, bài học … nên được gieo vào lúc bình tĩnh"'
    moi: '"Theo Steinberg (2008), …; Theo mô hình …; … Việc nên nói chuyện lúc bình tĩnh là suy luận của chúng tôi …"'
    ly_do: Hồ sơ n37–n39.
  - cu: 'Áp dụng 2: "chiến lược hiệu quả nhất …: hạn chế để teen lái xe chở nhiều bạn …, quản lý tiền tiêu vặt …, giữ rượu bia …; logic đằng sau nhiều chính sách giới hạn độ tuổi trên thế giới"'
    moi: lập luận của Steinberg 2008 (đổi bối cảnh) và Simons-Morton 2005; "Một ví dụ minh họa là hạn chế để thiếu niên chở nhiều bạn cùng tuổi — đây là ví dụ của chúng tôi"
    ly_do: Hồ sơ n40, n41.
  - cu: 'Áp dụng 3 (Dùng sức mạnh của bạn bè theo hướng tích cực) và Áp dụng 4 (Tận dụng cửa sổ học hỏi): lời khuyên và chip "Khá vững"'
    moi: mỗi mục một đoạn ngắn nói các nguồn đã đọc chưa kiểm tra điều đó, không đưa khuyến nghị; bỏ chip; giữ id mục cũ
    ly_do: Hồ sơ n42, n43.
  - cu: 'mục Ở Việt Nam: "Hầu hết nghiên cứu về não vị thành niên thực hiện ở Mỹ và châu Âu. Chúng tôi chưa tìm thấy dữ liệu chụp não …"; "… ở nhiều nước … văn hóa, đạo đức và thực tiễn xã hội"'
    moi: '"Các nghiên cứu nêu trong bài chủ yếu thực hiện ở Mỹ. Tính đến 11/2026, chúng tôi chưa tìm thấy … cũng như thí nghiệm kiểu Gardner và Steinberg …"; "hệ thống tư pháp … của Mỹ", "một trong các cân nhắc"'
    ly_do: Hồ sơ n44–n46.
  - cu: 'Ngộ nhận: "bị hỏng": "… vừa sai khoa học, vừa khiến người lớn đối xử với teen như bệnh nhân"; "tuổi 25 … thường gặp trên báo chí"; "Teen liều vì không hiểu nguy hiểm. Sai. … (Gardner và Steinberg, 2005)"; "Tỉa synap … mất tế bào"; "chống đối"'
    moi: xem hồ sơ n47–n51 (dẫn Steinberg 2008, Shulman 2016, Gogtay 2004; bỏ các câu không có nguồn)
    ly_do: Hồ sơ n47–n51.
  - cu: 'câu hỏi 2: "… theo nguyên tắc dùng hoặc mất … Đây cũng là lý do tuổi teen là cửa sổ vàng"; câu hỏi 3: "trò chơi lái xe Chicken … rất quan trọng …"; câu hỏi 4: "bằng chứng não trực tiếp"; câu hỏi 5: "25 chỉ là cách nói gọn trên báo chí"'
    moi: xem hồ sơ n54–n57
    ly_do: Hồ sơ n54–n57.
  - cu: danh sách Nguồn (7 mục)
    moi: thêm Defoe và cộng sự (2015)
    ly_do: Hồ sơ n58.
  - cu: 'tiêu đề Áp dụng 1 và 2 có chip :nhan[kha-vung]'
    moi: 'bỏ chip, giữ id cũ { #1-noi-chuyen-khi-nguoi-dung-giang-dao-ly-khi-dang-nong-kha-vung }, { #2-thiet-ke-moi-truong-thay-vi-trong-cho-tu-kiem-che-kha-vung }'
    ly_do: Review, hồ sơ n37, n40 (nhãn cho lời khuyên chưa được kiểm trực tiếp).
  - cu: 'tiêu đề "3. Dùng sức mạnh của bạn bè theo hướng tích cực"; "4. Tận dụng "cửa sổ" học hỏi của não đang tỉa"'
    moi: '"3. Bạn bè có thể là ảnh hưởng tích cực?"; "4. Tuổi teen có "cửa sổ" học hỏi riêng?" (id cũ giữ)'
    ly_do: Review, hồ sơ n42, n43 (tiêu đề là lời khuyên trái với thân mục).
  - cu: 'khung Đang tranh cãi: "… nên được tham khảo từ những bài học của khoa học phát triển (Steinberg, 2009)."'
    moi: 'thêm "Bản thân ông kết luận rằng, ở Mỹ, các bài học ấy ủng hộ mạnh việc duy trì một hệ thống tư pháp riêng cho người chưa thành niên"'
    ly_do: Review, hồ sơ n31, n46.
  - cu: 'mục Ở Việt Nam: "Steinberg (2009) bàn về … của Mỹ. Như chính ông nhấn mạnh, khoa học chỉ nên là một trong các cân nhắc cho nhà làm luật."'
    moi: '"… của Mỹ, qua ba vấn đề: … Ông kết luận rằng khoa học phát triển ủng hộ mạnh việc duy trì một hệ thống tư pháp riêng …; đồng thời ông nhấn mạnh chính sách không thể và không nên được quyết định chỉ bởi các nghiên cứu phát triển."'
    ly_do: Review, hồ sơ n46 (lượt 2 sai).
  - cu: 'câu hỏi 1, lựa chọn đúng: "hệ phần thưởng … đạt đỉnh nhạy cảm đúng lúc …"'
    moi: '"hệ phần thưởng … nhạy cảm cao đúng lúc …"'
    ly_do: Review, hồ sơ n53.
