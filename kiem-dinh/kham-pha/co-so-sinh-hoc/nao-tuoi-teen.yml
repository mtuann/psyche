  - id: n33
    cau: Nói "não chưa hoàn thiện nên miễn trách nhiệm" là suy diễn quá đà; nói "não bộ không liên quan gì" cũng bỏ qua bằng chứng.
    loai: loi-khuyen
    nguon:
