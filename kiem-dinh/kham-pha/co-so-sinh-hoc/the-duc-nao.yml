    trich: The aerobic exercise group did not demonstrate greater changes in serum BDNF levels compared with the stretching group
    vi_tri: Erickson, Results
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "BDNF máu tăng sau khi tập chưa chứng minh được BDNF trong não cũng tăng... BDNF là phân tử lớn, khó vượt qua hàng rào máu–não". Chữ mới bỏ "phân tử lớn, khó vượt hàng rào" (không có nguồn mở được). Chỗ chưa chắc. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp: Erickson không thấy BDNF huyết thanh khác nhau giữa nhóm; Rasmussen (não là một nguồn); Walsh bàn nguồn và cơ chế.'
