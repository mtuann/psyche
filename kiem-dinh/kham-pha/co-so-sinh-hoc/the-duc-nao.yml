  - id: n47
    cau: 'Dumitru và cộng sự (2025, Science): giải trình tự RNA nhân đơn thấy tế bào tiền thân đang tăng sinh ở hồi hải mã người trưởng thành; các nhóm nghiên cứu vẫn cho kết quả khác nhau.'
    loai: so-lieu
    nguon:
