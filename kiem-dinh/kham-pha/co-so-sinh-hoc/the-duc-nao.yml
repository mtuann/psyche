  - id: n63
    cau: Thể trạng, chế độ ăn, khí hậu nóng ẩm và không khí đô thị có thể làm thay đổi cân bằng lợi ích–rủi ro; đi bộ ngoài đường nhiều khói bụi hay nắng gắt có thể khác với nơi không khí sạch hơn (suy đoán, chưa có nghiên cứu được dẫn).
    loai: loi-khuyen
    nguon:
      - erickson2011
    ket_qua: da-bo
    ghi_chu: 'Suy luận đã ghi rõ là suy đoán. Chữ cũ: "ô nhiễm không khí bản thân nó đã được chứng minh là hại não" (không kiểm được; báo cáo Lancet 2020/2024 mở được không có tóm tắt), "văn hóa vận động của người cao tuổi Việt Nam đã vô tình đi trước khoa học một bước", "đi bộ trong công viên sáng sớm có lẽ là phiên bản tối ưu". Đã bỏ cả ba (da-bo một phần). Nguồn nêu Erickson chỉ để nói đây là bối cảnh nghiên cứu, không hỗ trợ suy đoán. Chỗ khó. Review (Claude Sonnet 5.5, 10/11/2026): sai (trang chưa sửa như hồ sơ ghi). Hồ sơ ghi da-bo nhưng trang còn đoạn "thể trạng, chế độ ăn, khí hậu nóng ẩm và không khí đô thị đều có thể làm thay đổi cân bằng lợi ích–rủi ro ... Đi bộ ngoài đường nhiều khói bụi hay nắng gắt có thể khác": suy đoán không nguồn (nguồn Erickson không hỗ trợ). Đã bỏ hẳn đoạn này khỏi trang, giữ câu "Điều còn thiếu là bằng chứng trên chính người Việt". Nay da-bo đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/27156248/" ]
    luot_2_ghi_chu: Câu hedge 'có thể' và tự ghi là suy đoán; Tainio cho thấy chênh lệch chỉ xảy ra ở mức cực đoan; phần nắng gắt không có nguồn.
