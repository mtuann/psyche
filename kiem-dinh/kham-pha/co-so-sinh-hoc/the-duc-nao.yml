  co_so:
  - erickson2011
  ly_do: 'Erickson loại trừ người có bệnh tim mạch, đái tháo đường, và yêu cầu bác sĩ đồng ý: nên "chưa được kiểm chứng" cho các đối tượng đó là mô tả đúng nguồn. Lời khuyên hỏi bác sĩ là thận trọng chung, chưa mở hướng dẫn (ví dụ WHO) để dẫn.'
  nguon:
