    ghi_chu: 'Chữ cũ: "khẳng định vẫn còn đến tận tuổi già" và "bằng cùng một kỹ thuật nhuộm mô". Chữ mới theo tóm tắt; bỏ "cùng một kỹ thuật" (cả hai dùng mô sau chết, nhưng không xác nhận "cùng kỹ thuật"). Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp tóm tắt Boldrini: hàng nghìn tế bào non ở hồi răng, 14–79 tuổi.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/29625071/" ]
