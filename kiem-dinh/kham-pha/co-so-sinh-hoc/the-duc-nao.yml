  - id: n52
    cau: 'Pereira và cộng sự (2007): ở chuột, tập luyện làm tăng thể tích máu ở hồi răng, tương quan với sinh tế bào thần kinh mới; ở người, tập luyện tác động chủ yếu lên thể tích máu ở hồi răng, tương quan với chức năng tim phổi và nhận thức.'
    loai: so-lieu
    nguon:
      - pereira2007
    trich: exercise-induced increases in dentate gyrus CBV were found to correlate with postmortem measurements of neurogenesis ... exercise was found to have a primary effect on dentate gyrus CBV, and the CBV changes were found to selectively correlate with cardiopulmonary and cognitive function
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ở người, các nghiên cứu MRI cũng ghi nhận tăng chất xám ở vùng trán và thái dương sau rèn luyện aerobic... bằng chứng ở người lại vững hơn". Chữ mới theo Pereira và nêu Erickson (tập luyện làm tăng thể tích máu và tưới máu hồi hải mã, trích dẫn tham chiếu 15, 16). Nhãn "khá vững" cũ cho mạch máu đã bỏ: "có manh mối". Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp tóm tắt Pereira (chuột: CBV hồi răng tương quan với sinh tế bào thần kinh mới; người: tác động chính lên CBV hồi răng, tương quan với chức năng tim phổi và nhận thức).'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/17374720/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n53
    cau: 'Vận động có lợi ích nhỏ đến vừa cho giấc ngủ, giảm triệu chứng trầm cảm và lo âu ở người không có chẩn đoán, và hạ nhẹ huyết áp; chúng tôi chưa dẫn nghiên cứu nào kiểm chứng rằng các lợi ích này giải thích lợi ích của vận động với não (suy đoán của chúng tôi).'
    loai: phat-hien
    nguon:
      - kredlow2015
      - rebar2015
      - cornelissen2013
    trich: Regular exercise has small beneficial effects on total sleep time and sleep efficiency, small-to-medium beneficial effects on sleep onset latency, and moderate beneficial effects on sleep quality.
    vi_tri: Kredlow, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "mỗi thứ này đều đã được chứng minh là ảnh hưởng đến nhận thức. Rất có thể một phần... đi qua các con đường này". Chữ mới: giả thuyết, chưa có nghiên cứu kiểm chứng; bỏ "đã được chứng minh ảnh hưởng nhận thức" (không có nguồn). Review (Claude Sonnet 5.5, 10/11/2026): sai (lượt 2: khong-chac; loại lời khuyên không đúng). Câu cũ "Một giả thuyết là một phần não khỏe hơn nhờ tập đi qua các con đường này" không gán cho ai, nên là suy đoán không nguồn. Đã viết lại: phần có nguồn (Kredlow, Rebar, Cornelissen; n54) tách rõ khỏi phần suy đoán, nói thẳng là "suy đoán của chúng tôi, chưa dẫn nghiên cứu". Loại đổi từ loi-khuyen sang phat-hien (câu không khuyên điều gì).'
    luot_2: khong-chac
    luot_2_ghi_chu: "Câu tự ghi là giả thuyết chưa có nghiên cứu: tác dụng của tập lên giấc ngủ, tâm trạng, huyết áp có nguồn (Kredlow, Rebar, Cornelissen) nhưng vai trò trung gian cho 'não khỏe hơn' chưa thấy kiểm chứng."
    review: sai
  - id: n54
    cau: Vận động có lợi ích nhỏ đến vừa cho giấc ngủ (Kredlow 2015); giảm triệu chứng trầm cảm (SMD −0,50) và lo âu (−0,38) ở người không có chẩn đoán (Rebar 2015); hạ huyết áp tâm thu 3,5 mmHg sau tập sức bền (Cornelissen 2013).
    loai: so-lieu
    nguon:
      - kredlow2015
      - rebar2015
      - cornelissen2013
    trich: 'Physical activity reduced depression by a medium effect [SMD = -0.50; 95% CI: -0.93 to -0.06] and anxiety by a small effect (SMD = -0.38; 95% CI: -0.66 to -0.11) ... Systolic BP (SBP) was reduced after endurance (-3.5 mm Hg [confidence limits -4.6 to -2.3])'
    vi_tri: Rebar, tóm tắt; Cornelissen, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ngủ sâu hơn, bớt lo âu/trầm cảm, huyết áp và đường huyết ổn định hơn". Chữ mới theo nguồn; bỏ "ngủ sâu hơn" và "đường huyết" (không có nguồn). Không viết như lời khuyên điều trị; có lời dẫn Hỗ trợ. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp tóm tắt ba nguồn (Kredlow: lợi ích nhỏ đến vừa với giấc ngủ; Rebar: SMD −0,50 và −0,38 ở người không lâm sàng; Cornelissen: SBP −3,5 mmHg sau tập sức bền ở người trưởng thành). Có lời dẫn Hỗ trợ, không viết thành lời khuyên điều trị.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/25596964/", "https://pubmed.ncbi.nlm.nih.gov/25739893/", "https://pubmed.ncbi.nlm.nih.gov/23525435/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n55
    cau: 'Thay đổi hồi hải mã trong thử nghiệm Erickson được đo sau một năm; hai phân tích tổng hợp thấy hiệu quả ở chương trình dài (Aghjayan: trên 3.900 phút; Wilckens: trên 24 tuần) nhưng đó là so sánh giữa các nhóm nghiên cứu, không phải thử nghiệm trực tiếp về thời lượng; chúng tôi không thấy bằng chứng cho lời hứa "7 ngày tập là trí nhớ tăng vùn vụt".'
    loai: phat-hien
    nguon:
      - aghjayan2022
      - wilckens2021
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: nhãn "vững chắc"; "Ai quảng cáo "7 ngày tập là trí nhớ tăng vùn vụt" thì đang bán hàng". Chữ mới: "khá vững"; "chúng tôi không thấy bằng chứng". Lý do: vững chắc cần tổng hợp không mâu thuẫn; lời quy kết về người quảng cáo không kiểm được. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chip Khá vững không hợp: ở bảng phân nhóm Aghjayan, khác biệt giữa các nhóm "liều" không có ý nghĩa (Q = 0,19, p = 0,909) và nhóm can thiệp 40–65 tuần không có ý nghĩa (g = 0,13) trong khi nhóm 18–39 tuần có; nghĩa là "tính bằng tháng" chỉ là gợi ý từ hai phân tích gộp, lại nằm trong chủ đề đang tranh cãi (n39, n40); đây cũng là lời khuyên chưa được kiểm trực tiếp. Đã bỏ chip (giữ id cũ), thêm câu nói rõ giới hạn (p = 0,91). Không còn là câu loại nhan.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/33315276/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC9053291/" ]
    luot_2_ghi_chu: Khớp.
    review: sai
  - id: n56
    cau: 'Đang tranh cãi (Áp dụng 1): liều trong thử nghiệm Erickson, đi bộ 40 phút, 3 buổi/tuần.'
    loai: nhan
    nhan: tranh-cai
    co_so:
      - erickson2011
      - firth2018
      - balbim2024
    ly_do: Lợi ích lên hồi hải mã của phác đồ chưa được các phân tích tổng hợp xác nhận nhất quán (n39).
    nguon:
      - erickson2011
      - firth2018
      - balbim2024
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: tiêu đề "Liều đã được kiểm chứng" nhãn khá vững; "đi bộ nhanh... hơi thở gấp, nói chuyện được nhưng không hát được"; "bắt đầu từ 15–20 phút". Chữ mới: phác đồ đúng như nghiên cứu (10 phút, +5/tuần, nhịp tim dự trữ). Lý do: các chi tiết cũ không có trong nguồn. Id mục cũ giữ bằng { #…-kha-vung }. Review (Claude Sonnet 5.5, 10/11/2026): dung. Chip Đang tranh cãi chỉ nói về lợi ích của phác đồ này với hồi hải mã (cùng căn cứ với n39); nội dung phác đồ khớp Methods. Câu "bắt đầu nhẹ và tăng dần như trong nghiên cứu" nói đúng là cách làm của nghiên cứu.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2020/https://www.pnas.org/content/108/7/3017.full", "https://pubmed.ncbi.nlm.nih.gov/21282661/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC9053291/" ]
    luot_2_ghi_chu: Nhãn 'tranh cãi' cho 'liều' là thận trọng; không có thử nghiệm so liều trực tiếp.
    review: dung
  - id: n57
    cau: Nếu muốn thử, bắt đầu nhẹ và tăng dần như trong nghiên cứu là cách làm của chính nghiên cứu.
    loai: loi-khuyen
    nguon:
      - erickson2011
    trich: Participants started by walking for 10 min and increased walking duration weekly by 5-min increments until a duration of 40 min was achieved at week 7
    vi_tri: Erickson, Methods
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "không cần chạy marathon, không cần phòng gym đắt tiền... nguyên tắc quan trọng nhất là đều đặn". Chữ mới bỏ hai câu không có nguồn. Lời khuyên vận động đời thường có nhãn bằng chứng (tranh-cai). Review (Claude Sonnet 5.5, 10/11/2026): dung. Câu chỉ nói cách làm của chính nghiên cứu (10 phút, thêm 5 phút mỗi tuần), không khuyên liều điều trị; mục 4 cạnh đó kèm lời hỏi bác sĩ.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC7719906/" ]
    luot_2_ghi_chu: Khớp WHO 2020; trong Erickson cũng tăng dần 10 -> 40 phút.
    review: dung
  - id: n58
    cau: 'Vận động có lợi ích nhỏ đến vừa cho giấc ngủ, tâm trạng (ở người không có chẩn đoán) và huyết áp; chúng tôi chưa dẫn nghiên cứu nào kiểm chứng riêng chuyện kết hợp vận động đều với ngủ đủ và giao tiếp xã hội cho nhận thức, nên đó chỉ là suy đoán, không phải khuyến nghị đã kiểm chứng.'
    loai: phat-hien
    nguon:
      - kredlow2015
      - rebar2015
      - cornelissen2013
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: tiêu đề "Đừng đặt cược vào một "viên thuốc": kết hợp vận động + ngủ + giao tiếp", nhãn khá vững; "đi bộ cùng bạn... có cơ sở khoa học"; "Không có bằng chứng rằng chỉ cần tập mà thức khuya... não vẫn khỏe". Chữ mới: gợi ý chưa kiểm chứng; bỏ các câu không có nguồn. Review (Claude Sonnet 5.5, 10/11/2026): sai. Nhãn Đang tranh cãi không hợp mục 4 (không có bằng chứng chất lượng cao mâu thuẫn, mà là chưa có nghiên cứu); đã bỏ chip (giữ id cũ). Câu "Một cách nghĩ là kết hợp vận động đều với ngủ đủ và giao tiếp xã hội" là lời khuyên không nguồn: đã đổi thành "chỉ là suy đoán". Không còn là câu loại nhan.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/25596964/" ]
    luot_2_ghi_chu: Nhãn 'tranh cãi' thận trọng, hợp.
    review: sai
  - id: n59
    cau: 'Thử nghiệm Erickson loại trừ người có bệnh tim mạch hay đái tháo đường và yêu cầu bác sĩ riêng đồng ý, nên phác đồ chưa được kiểm chứng cho người có các bệnh đó; người có bệnh nền nên hỏi bác sĩ trước khi bắt đầu hay tăng cường độ.'
    loai: phat-hien
    nguon:
