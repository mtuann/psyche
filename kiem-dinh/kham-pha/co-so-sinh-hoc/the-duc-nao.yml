    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "còn g = 0,18 — nhỏ nhưng có thật". Chữ mới thêm khoảng tin cậy và bỏ "nhưng có thật". Review (Claude Sonnet 5.5, 10/11/2026): dung. g = 0,28 (p = 0,002); phân tích sau với các nghiên cứu chất lượng cao: g = 0,18 [0,03–0,32] (toàn văn PMC9053291, mục Quality assessment).'
    luot_2: dung
