  - id: n41
    cau: 'Đang tranh cãi: cơ chế BDNF ở người, và chuyện não người lớn có sinh tế bào thần kinh mới không.'
    loai: nhan
    nhan: tranh-cai
    co_so:
      - erickson2011
      - rasmussen2009
      - fujimura2002
      - sorrells2018
      - boldrini2018
      - dumitru2025
    ly_do: 'BDNF: nguồn máu (tiểu cầu và não) còn bàn cãi, và thử nghiệm Erickson không thấy BDNF khác nhau giữa hai nhóm; neurogenesis: ba nghiên cứu (2018, 2018, 2025) trái chiều. Mục 4: bằng chứng chất lượng cao mâu thuẫn.'
    nguon:
      - erickson2011
      - rasmussen2009
      - fujimura2002
      - sorrells2018
      - boldrini2018
      - dumitru2025
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "~99% đến từ tiểu cầu... không có bằng chứng não "tiết" BDNF ra máu khi tập... gần như không còn sau tuổi 13". Chữ mới theo nguồn: Fujimura (tiểu cầu chứa BDNF), Rasmussen 2009 (não 70–80%), Sorrells ("không phát hiện" ở người trưởng thành), Boldrini (14–79 tuổi), Dumitru 2025. Lý do: Rasmussen 2009 trái hẳn câu cũ "không có bằng chứng não tiết BDNF". Review (Claude Sonnet 5.5, 10/11/2026): dung. Đang tranh cãi hợp mục 4: (i) nguồn BDNF máu: Fujimura (tiểu cầu chứa BDNF) và Rasmussen (não 70–80%), thử nghiệm Erickson không thấy nhóm đi bộ có BDNF khác; (ii) neurogenesis: Sorrells không thấy, Boldrini thấy, Dumitru 2025 thấy tế bào tiền thân tăng sinh. Khung nói cả hai là "kém chắc chắn ở người", đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/29513649/", "https://pubmed.ncbi.nlm.nih.gov/29625071/", "https://pubmed.ncbi.nlm.nih.gov/40608919/", "https://pubmed.ncbi.nlm.nih.gov/17374720/" ]
    luot_2_ghi_chu: Đúng nhãn 'đang tranh cãi'.
    review: dung
  - id: n42
    cau: 'Đã bị bác bỏ: tập thể dục chữa khỏi sa sút trí tuệ.'
    loai: nhan
    nhan: bac-bo
    co_so:
      - lamb2018
      - forbes2015
    ly_do: 'Thử nghiệm ngẫu nhiên DAPA (494 người sa sút trí tuệ nhẹ đến vừa, BMJ 2018): bốn tháng tập aerobic và sức mạnh cường độ vừa đến cao không làm chậm sa sút nhận thức (ADAS-cog sau 12 tháng kém hơn một chút ở nhóm tập, chênh lệch 1,4, 95% CI 0,2–2,6). Tổng quan Cochrane 2015 (17 thử nghiệm, 1.067 người): không có bằng chứng rõ ràng về lợi ích nhận thức (SMD 0,43, 95% CI −0,05 đến 0,92; chất lượng rất thấp). Tuyên bố "chữa khỏi" không có kiểm tra nào ủng hộ và kiểm tra lớn nhất thất bại.'
    nguon:
      - lamb2018
      - forbes2015
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "không có chuyện thần dược 2 tuần. Và chưa có bằng chứng nào... chỉ nói về duy trì và làm chậm suy giảm ở người chưa bệnh". Chữ mới: "chúng tôi không thấy bằng chứng", lời dẫn tới Hỗ trợ; bỏ "làm chậm" (không có nguồn). Chỗ khó. Review (Claude Sonnet 5.5, 10/11/2026): sai (lượt 2: qua-manh). Tách vế. Vế "tập vài tuần là não to ra" chưa có kiểm tra nào nên không thể "bị bác bỏ": đã bỏ khỏi khung (ý "không thấy bằng chứng cho lời hứa 2 tuần, thay đổi đo sau một năm" đã nằm ở Áp dụng 2). Vế "chữa sa sút trí tuệ" giữ nhãn Bác bỏ nhưng thu hẹp thành "chữa khỏi" và thêm DAPA, Cochrane; khung nay nêu cả hai. Chỗ chưa chắc: Cochrane 2015 tìm tài liệu đến 10/2013 và ghi "không rõ ràng", không phải "không có tác dụng"; nếu người gom thấy nhãn này mạnh thì hạ xuống không nhãn. Đã sửa trang (khung, ngộ nhận Alzheimer, Nguồn: thêm Lamb 2018, Forbes 2015).'
    luot_2: qua-manh
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/29769247/", "https://pubmed.ncbi.nlm.nih.gov/25874613/", "https://pubmed.ncbi.nlm.nih.gov/33315276/" ]
    luot_2_ghi_chu: "câu đúng: Chưa có bằng chứng cho 'tập vài tuần là não to ra'; với sa sút trí tuệ, thử nghiệm lớn (DAPA) và tổng quan Cochrane không thấy lợi ích nhận thức; vận động có lợi cho thể chất và sinh hoạt hằng ngày.; Nhãn 'đã bị bác bỏ' quá mạnh cho vế 'vài tuần là não to ra' (chưa có kiểm tra đủ mạnh); vế 'chữa sa sút trí tuệ' có DAPA, Cochrane."
    review: sai
    trich: A moderate to high intensity aerobic and strength exercise training programme does not slow cognitive impairment in people with mild to moderate dementia. ... The review revealed no evidence of benefit from exercise on cognition, neuropsychiatric symptoms, or depression.
    vi_tri: Lamb 2018, tóm tắt (Conclusion); Forbes 2015, tóm tắt (Authors' conclusions)
