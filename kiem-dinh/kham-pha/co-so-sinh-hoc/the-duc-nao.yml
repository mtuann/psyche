    ghi_chu: 'Chữ cũ: "Hiệu quả rõ nhất ở nhóm 55–68 tuổi (nhóm 69–85 không còn rõ), và với các chương trình kéo dài". Chữ mới theo "significant effect ... but not". Lý do: nguồn không nói "rõ nhất". Review (Claude Sonnet 5.5, 10/11/2026): dung. Đúng tóm tắt. Lưu ý từ bảng phân nhóm của toàn văn: so sánh giữa các nhóm "liều" (thấp, vừa, cao) không có ý nghĩa (Q = 0,19, p = 0,909); trang ở Áp dụng 2 đã nói rõ điều này.'
