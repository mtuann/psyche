    ghi_chu: 'Chữ cũ: tiêu đề "cập nhật bằng phân tích mới nhất". Chữ mới bỏ "mới nhất" (có Ciria 2023 sau đó). Id mục cũ giữ bằng { #aghjayan-va-cong-su-2022-cap-nhat-bang-phan-tich-moi-nhat-ve-tri-nho-su-kien }. Review (Claude Sonnet 5.5, 10/11/2026): dung. 36 nghiên cứu, 2.750 người, tuổi trung bình 70,82; tiêu đề trang đã bỏ "mới nhất"; id cũ giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC9053291/" ]
    luot_2_ghi_chu: Khớp.
