  - id: n39
    cau: 'Đang tranh cãi: vận động aerobic đều đặn giúp người lớn tuổi giữ được thể tích hồi hải mã.'
    loai: nhan
    nhan: tranh-cai
    co_so:
      - erickson2011
      - firth2018
      - wilckens2021
      - balbim2024
    ly_do: 'Một RCT dương (Erickson 2011) nhưng các phân tích tổng hợp mâu thuẫn nhau: Wilckens 2021 dương, Firth 2018 chỉ hồi hải mã trái, Balbim 2024 không có ý nghĩa. Mục 4: "bằng chứng chất lượng cao mâu thuẫn nhau".'
    nguon:
      - erickson2011
      - firth2018
      - wilckens2021
      - balbim2024
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: nhãn "vững chắc", "bằng chứng can thiệp trên con người". Chữ mới: "đang tranh cãi". Lý do: ba phân tích tổng hợp không đồng ý; thước đo mục 4 đòi cùng chiều. Nhãn mới thêm, phải qua lượt 2. Review (Claude Sonnet 5.5, 10/11/2026): dung. Đang tranh cãi hợp mục 4: một RCT dương (Erickson) và ba phân tích tổng hợp không đồng ý (Wilckens dương; Firth chỉ hồi hải mã trái; Balbim không có ý nghĩa, p = 0,073), bằng chứng chất lượng cao mâu thuẫn nhau. Đã đối chiếu tóm tắt cả ba.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/33315276/", "https://pubmed.ncbi.nlm.nih.gov/29113943/", "https://pubmed.ncbi.nlm.nih.gov/37943486/" ]
    luot_2_ghi_chu: Đúng nhãn 'đang tranh cãi'.
    review: dung
