    cau: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên trang: có ::tom-tat. Review (Claude Sonnet 5.5, 10/11/2026): dung. Loại ve-site đúng; trang có ::tom-tat ngay dưới frontmatter, dựng từ ý chính của khung nhãn (nay: ba khung Đang tranh cãi và một khung Đã bị bác bỏ).'
    luot_2: khong-chac
    luot_2_ghi_chu: "Loại ve-site/ví dụ giả định: không qua lượt 2 (review kiểm thẳng trên trang)."
    review: dung
  - id: n74
    cau: 'Hình erickson-hippocampus có các số +2,12%, +1,97%, −1,40%, −1,43% và dòng "Theo các tác giả: +2% ≈ đảo ngược 1–2 năm teo do tuổi"; chú thích ghi cả "theo các tác giả" và mức teo 1–2% mỗi năm; tiêu đề hình nói "toàn hồi hải mã".'
    loai: so-lieu
    nguon:
      - erickson2011
    trich: the aerobic exercise group demonstrated an increase in volume of the left and right hippocampus by 2.12% and 1.97% ... a 1.40% and 1.43% decline
    vi_tri: Erickson, Results; Fig. 1A
    ket_qua: da-sua
    ghi_chu: 'Hình đúng các số (đối chiếu từng số trong src/hinh/erickson-hippocampus.html). Câu "đảo ngược 1–2 năm" là cách tính của tác giả: trong hình không có "theo các tác giả"; ghi cho người giao (không sửa hình). Review (Claude Sonnet 5.5, 10/11/2026): sai (hình). Dòng "+2% ≈ đảo ngược 1–2 năm teo não do tuổi tác" là cách tính của tác giả (Discussion: "Because hippocampal volume shrinks 1–2% annually, a 2% increase ... is equivalent to adding between 1 and 2 y"), hình không ghi: đã sửa dòng cuối thành "Theo các tác giả: +2% ≈ đảo ngược 1–2 năm teo do tuổi", caption thêm "theo các tác giả ... (mức teo 1–2% mỗi năm)", caption cũng bỏ "đúng như quy luật tự nhiên" (trang đã bỏ ở n16) thành "phù hợp với mức teo 1–2% mỗi năm đã biết"; tiêu đề caption nói "toàn hồi hải mã" (đúng n4). Số trong hình đều khớp Results. Đã thêm erickson-hippocampus vào HINH_DA_SUA trong tests/chuyen.test.mjs.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2020/https://www.pnas.org/content/108/7/3017.full", "https://pubmed.ncbi.nlm.nih.gov/21282661/" ]
    luot_2_ghi_chu: Khớp.
    review: sai
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: Khung "vững chắc" cho tập aerobic giữ thể tích hồi hải mã; khung "khá vững" cho nhận thức khiêm tốn
    moi: 'Hai khung "đang tranh cãi"; thêm mục "Các tổng hợp về hồi hải mã và về toàn bộ nhận thức: kết quả trái chiều"'
    ly_do: Hồ sơ n39, n40 (Firth 2018, Wilckens 2021, Balbim 2024, Ciria 2023).
  - cu: 'Mục BDNF: "~99% đến từ tiểu cầu... không có bằng chứng não tiết BDNF ra máu khi tập"'
    moi: 'Tiểu cầu chứa BDNF; Rasmussen 2009: não đóng góp 70–80%; Erickson: không khác biệt giữa hai nhóm'
    ly_do: Hồ sơ n41, n44, n51, n65.
  - cu: 'Erickson: "đi bộ nhanh 40 phút/ngày"; nhóm đi bộ cũng cải thiện trí nhớ; BDNF cao hơn'
    moi: Tăng dần đến 40 phút mỗi buổi, 3 buổi/tuần; cả hai nhóm cải thiện trí nhớ; không khác biệt BDNF giữa nhóm
    ly_do: Hồ sơ n3, n12, n18, n20.
  - cu: 'Áp dụng 1: "Liều đã được kiểm chứng: đi bộ nhanh 40 phút, 3 buổi/tuần" (khá vững), 3 và 4 tương tự'
    moi: '"Liều trong thử nghiệm Erickson..." (đang tranh cãi); 2 khá vững; 3 đang tranh cãi'
    ly_do: 'Hồ sơ n55–n59. Tiêu đề mục 1 và 3 đổi, id cũ giữ bằng { #id-cu }; mục 2 đổi nhãn (id cũ có -vung-chac giữ bằng { #id-cu }).'
  - cu: 'Mục Việt Nam: không mốc; "đi trước khoa học một bước"; "ô nhiễm không khí... hại não"; "phiên bản tối ưu"'
    moi: '"Tính đến 11/2026"; bỏ các câu không có nguồn'
    ly_do: Hồ sơ n61–n63.
  - cu: 'Ngộ nhận: "Sai", "Sai và nguy hiểm"'
    moi: '"Chưa có bằng chứng như vậy", "Chúng tôi không thấy bằng chứng"; lời dẫn Hỗ trợ'
    ly_do: Hồ sơ n64–n67.
  - cu: 'Tiêu đề: "Aghjayan và cộng sự (2022): cập nhật bằng phân tích mới nhất về trí nhớ sự kiện"'
    moi: '"Aghjayan và cộng sự (2022): phân tích tổng hợp về trí nhớ sự kiện"'
    ly_do: Hồ sơ n30.
  - cu: 'Khung Đã bị bác bỏ: "tập vài tuần là não to ra / tập thể dục chữa được sa sút trí tuệ"'
    moi: Khung Đã bị bác bỏ chỉ còn "tập thể dục chữa khỏi sa sút trí tuệ", dẫn DAPA (Lamb 2018) và Cochrane (Forbes 2015); vế "vài tuần" bỏ khỏi khung
    ly_do: Review, hồ sơ n42 (lượt 2 qua-manh).
  - cu: 'Hộp "Xem đáp án": "phần trước của hồi hải mã ... to ra khoảng 2% ... teo đi khoảng 1,4%"'
    moi: '"thể tích hồi hải mã ... tăng khoảng 2% (tăng chọn lọc ở phần trước) ... giảm khoảng 1,4%"'
    ly_do: "Review, hồ sơ n4 (lượt 2 sai): 2% và 1,4% là toàn hồi hải mã."
  - cu: 'Tiêu đề mục: "Erickson và cộng sự (2011): một năm đi bộ, não đảo ngược 1–2 năm tuổi già"'
    moi: '"... một năm đi bộ, hồi hải mã to ra khoảng 2%" (id cũ giữ bằng { #id-cu })'
    ly_do: 'Review: "đảo ngược 1–2 năm" là cách tính của tác giả, không nên đặt thành tiêu đề.'
  - cu: '"Nhiều người coi đó là quy luật tất yếu của tuổi già."'
    moi: '"Erickson và cộng sự cho rằng sự mất thể tích này ở tuổi già không phải là tất yếu."'
    ly_do: Review, hồ sơ n8.
  - cu: 'Trí nhớ không gian: "cả hai nhóm đều cải thiện độ chính xác sau một năm"'
    moi: thêm "nhưng nhóm đi bộ không cải thiện hơn nhóm giãn cơ"
    ly_do: Review, hồ sơ n18.
  - cu: 'Mục Mức độ chắc chắn và Áp dụng: chip Khá vững (Áp dụng 2, 4), Đang tranh cãi (Áp dụng 3); "Một cách nghĩ là kết hợp vận động đều với ngủ đủ và giao tiếp xã hội"; "Một giả thuyết là ... đi qua các con đường này"'
    moi: Bỏ ba chip (id tiêu đề giữ nguyên); thêm câu về Aghjayan (p = 0,91); đổi hai câu thành "suy đoán của chúng tôi"
    ly_do: Review, hồ sơ n53, n55, n58, n59.
  - cu: 'Mục Việt Nam: đoạn "thể trạng, chế độ ăn, khí hậu nóng ẩm và không khí đô thị ... Đi bộ ngoài đường nhiều khói bụi ... suy đoán"'
    moi: Bỏ đoạn, giữ "Điều còn thiếu là bằng chứng trên chính người Việt."
    ly_do: Review, hồ sơ n63 (hồ sơ ghi da-bo mà trang còn).
  - cu: 'Ngộ nhận: "Chưa có bằng chứng như vậy." (tập càng nặng)'
    moi: '"Chúng tôi không thấy bằng chứng như vậy."'
    ly_do: Review, hồ sơ n64.
  - cu: 'Hình erickson-hippocampus: dòng "+2% ≈ đảo ngược 1–2 năm teo não do tuổi tác"; chú thích "tương đương ... đúng như quy luật tự nhiên"'
    moi: '"Theo các tác giả: +2% ≈ đảo ngược 1–2 năm teo do tuổi"; chú thích "theo các tác giả ..." và "phù hợp với mức teo 1–2% mỗi năm đã biết"; tiêu đề chú thích "toàn hồi hải mã"'
    ly_do: Review, hồ sơ n74. erickson-hippocampus đã thêm vào HINH_DA_SUA.
  - cu: 'Mục các lý thuyết: "(Neeper và cộng sự, 1995)" và "tăng 2–3 lần khi tập" (Rasmussen); "tranh luận về mức độ và ý nghĩa vẫn chưa kết thúc" (Dumitru)'
    moi: '"theo Erickson và cộng sự, 2011 kể lại" kèm kết quả ở chuột của Rasmussen; "sự giải phóng BDNF từ não tăng 2–3 lần"; "các nhóm nghiên cứu vẫn cho kết quả khác nhau"'
    ly_do: Review, hồ sơ n47, n48, n44.
  - cu: Hồi hải mã "đóng vai trò trung tâm"
    moi: '"đóng vai trò quan trọng"'
    ly_do: Review, hồ sơ n6.
