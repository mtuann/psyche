  - id: n48
    cau: Ở động vật gặm nhấm, chạy bộ làm tăng BDNF trong hồi hải mã (Neeper và cộng sự, 1995, theo Erickson và cộng sự, 2011 kể lại); ở chuột, mRNA của BDNF ở hồi hải mã và vỏ não tăng 3–5 lần sau khi chạy trên băng chuyền (Rasmussen và cộng sự, 2009).
    loai: phat-hien
    nguon:
      - neeper1995
      - erickson2011
      - rasmussen2009
    trich: Exercise increases levels of BDNF in the hippocampus (5, 7, 20) ... In mice, exercise induced a three- to fivefold increase in BDNF mRNA expression in the hippocampus and cortex
    vi_tri: Erickson, mục "BDNF Is Associated with Changes in Hippocampal Volume"; Rasmussen 2009, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "một cách rõ ràng, và BDNF thúc đẩy sự sống sót của tế bào thần kinh mới". Chữ mới bỏ nửa sau. Chỗ khó: bài Neeper không mở được; xác nhận qua Erickson kể lại (tham chiếu 7, 8). Review (Claude Sonnet 5.5, 10/11/2026): sai (nguồn). Bài Neeper 1995 không mở được (Nature, không có tóm tắt) nhưng được trang dẫn là nguồn trực tiếp. Viết lại "theo Erickson kể lại" và thêm kết quả ở chuột của Rasmussen 2009 (đọc tóm tắt, Europe PMC). Nguồn Neeper trong hồ sơ vẫn ghi toan_van: false.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/19666694/", "https://pubmed.ncbi.nlm.nih.gov/7816089/" ]
    luot_2_ghi_chu: Chi tiết hồi hải mã ở chuột có Rasmussen; Neeper chỉ đọc tiêu đề.
    review: sai
  - id: n49
    cau: Một nghiên cứu ở 18 nam sinh viên thấy BDNF huyết thanh, huyết tương và trong tiểu cầu đều tăng ngay sau khi tập gắng sức (Cho và cộng sự, 2012).
    loai: so-lieu
