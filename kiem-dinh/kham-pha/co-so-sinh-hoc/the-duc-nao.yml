    cau: 'Firth và cộng sự (2018): 14 thử nghiệm (737 người) không thấy tác dụng có ý nghĩa của tập aerobic lên tổng thể tích hồi hải mã; thấy tác dụng ở hồi hải mã trái, do tập luyện ngăn mất thể tích.'
