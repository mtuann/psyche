nhan_dinh:
  - id: n1
    cau: 'Mô tả: đi bộ 40 phút, ba buổi mỗi tuần có thực sự làm hồi hải mã to ra, bằng chứng từ thử nghiệm Erickson (2011), các phân tích tổng hợp về hồi hải mã và nhận thức (kết quả trái chiều), và các cơ chế như BDNF.'
    loai: phat-hien
    nguon:
      - erickson2011
      - firth2018
      - ciria2023
    trich: Exercise training increased hippocampal volume by 2%
    vi_tri: Erickson, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đi bộ 40 phút mỗi ngày... các phân tích tổng hợp về nhận thức". Chữ mới: "40 phút, ba buổi mỗi tuần" (đúng phác đồ) và thêm các tổng hợp về hồi hải mã, kết quả trái chiều. Review (Claude Sonnet 5.5, 10/11/2026): dung. Mô tả ở frontmatter khớp cau; "40 phút, ba buổi mỗi tuần" đúng phác đồ (Methods).'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2020/https://www.pnas.org/content/108/7/3017.full", "https://pubmed.ncbi.nlm.nih.gov/21282661/", "https://pubmed.ncbi.nlm.nih.gov/20223924/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n2
    cau: Tình huống ông A đi bộ 40 phút mỗi sáng, ông B ít vận động, bác sĩ nhận xét trí nhớ, là ví dụ giả định.
    loai: ve-site
    ket_qua: dung
    ghi_chu: "gia-dinh. Ví dụ giả định, không khẳng định điều gì về bằng chứng; kiểm trên trang. Review (Claude Sonnet 5.5, 10/11/2026): dung. Loại ve-site (gia-dinh): ví dụ giả định ông A, ông B, không khẳng định điều gì về bằng chứng; không trái nhận định nào của trang."
    luot_2: khong-chac
    luot_2_ghi_chu: "Loại ve-site/ví dụ giả định: không qua lượt 2 (review kiểm thẳng trên trang)."
    review: dung
  - id: n3
    cau: Một thử nghiệm ngẫu nhiên có đối chứng (2011) cho 120 người lớn tuổi ít vận động đi bộ, tăng dần đến 40 phút mỗi buổi, 3 buổi/tuần, trong một năm, chụp MRI trước, giữa và sau.
    loai: phat-hien
    nguon:
      - erickson2011
    trich: Participants started by walking for 10 min and increased walking duration weekly by 5-min increments until a duration of 40 min was achieved at week 7
    vi_tri: 'Erickson, Methods: Training Protocol'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cho 120 người lớn tuổi đi bộ đúng "liều" như ông A trong một năm, rồi chụp MRI trước và sau". Chữ mới thêm "ít vận động", "tăng dần", "giữa". Lý do: Erickson mục Methods. Review (Claude Sonnet 5.5, 10/11/2026): dung. Trang khớp cau; toàn văn Erickson (Wayback, mở lại ở review): 120 người, ít vận động (hoạt động thể chất không quá 30 phút trong 6 tháng), MRI trước, sau 6 tháng và sau 1 năm.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2020/https://www.pnas.org/content/108/7/3017.full", "https://pubmed.ncbi.nlm.nih.gov/21282661/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n4
    cau: Nhóm đi bộ tăng khoảng 2% thể tích hồi hải mã (tăng chọn lọc ở phần trước), nhóm chỉ tập giãn cơ giảm khoảng 1,4%, nằm trong mức teo 1–2% mỗi năm ở người lớn tuổi.
    loai: so-lieu
    nguon:
      - erickson2011
    trich: the aerobic exercise group demonstrated an increase in volume of the left and right hippocampus by 2.12% and 1.97%, respectively, over the 1-y period, whereas the stretching control group displayed a 1.40% and 1.43% decline ... aerobic exercise selectively increased the volume of the anterior hippocampus
    vi_tri: 'Erickson, Results (Fig. 1A: toàn hồi hải mã trái, phải; Fig. 2: chọn lọc ở phần trước); Discussion: "stretching control group demonstrated a 1.4% decline"'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "vùng não liên quan đến trí nhớ... to ra ~2%... teo ~1,4% — đúng bằng lượng teo não tự nhiên của 1–2 năm tuổi già". Chữ mới: "phần trước hồi hải mã", "nằm trong mức teo 1–2%/năm". Lý do: 1,4% xấp xỉ teo một năm (1–2%/năm), không phải "1–2 năm"; 2% mới tương đương 1–2 năm. Review (Claude Sonnet 5.5, 10/11/2026): sai. Đọc lại toàn văn: 2,12% và 1,97% là thể tích toàn hồi hải mã trái và phải; phần trước chỉ được nêu là tăng chọn lọc (Fig. 2), không phải con số 2%. Chữ cũ trên trang (hộp "Xem đáp án"): "phần trước của hồi hải mã ... to ra khoảng 2% ... teo đi khoảng 1,4%". Chữ mới: "thể tích hồi hải mã ... tăng khoảng 2% (tăng chọn lọc ở phần trước) ... giảm khoảng 1,4%". Đã sửa trang.'
    luot_2: sai
    luot_2_nguon: [ "https://web.archive.org/web/2020/https://www.pnas.org/content/108/7/3017.full", "https://pubmed.ncbi.nlm.nih.gov/21282661/" ]
    luot_2_ghi_chu: "câu đúng: Nhóm đi bộ tăng khoảng 2% thể tích toàn hồi hải mã (trái +2,12%, phải +1,97%), tăng chọn lọc ở phần trước; nhóm giãn cơ giảm khoảng 1,4%.; Các số 2% và 1,4% là cho toàn hồi hải mã trái/phải; phần trước chỉ được nêu là tăng chọn lọc, không phải con số 2%."
    review: sai
  - id: n5
    cau: Các phân tích tổng hợp về thể tích hồi hải mã cho kết quả trái chiều, hiệu quả lên nhận thức khiêm tốn và bị đặt câu hỏi, và còn tranh luận về cơ chế.
    loai: phat-hien
    nguon:
      - firth2018
      - wilckens2021
      - balbim2024
      - ciria2023
    trich: AET does not seem to impact hippocampal volume in cognitively unimpaired, healthy older individuals
    vi_tri: Balbim 2024, tóm tắt; xem n39–n43
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hiệu quả lên trí nhớ thực tế khá khiêm tốn, và các nhà khoa học vẫn đang tranh cãi gay gắt về cơ chế". Chữ mới thêm kết quả trái chiều của tổng hợp (mới thêm vào trang). Lý do: thiếu bằng chứng tổng hợp. Review (Claude Sonnet 5.5, 10/11/2026): dung. Câu tóm các tổng hợp ở n34–n40; khớp trang.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/29113943/", "https://pubmed.ncbi.nlm.nih.gov/37943486/", "https://pubmed.ncbi.nlm.nih.gov/33315276/", "https://pubmed.ncbi.nlm.nih.gov/36973359/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n6
    cau: Hồi hải mã (hippocampus) là một cấu trúc nhỏ hình con ngựa biển nằm sâu trong não, đóng vai trò quan trọng trong việc hình thành trí nhớ mới.
    loai: dinh-nghia
    nguon:
      - erickson2011
      - pereira2007
    trich: Deterioration of the hippocampus precedes and leads to memory impairment in late adulthood
    vi_tri: 'Erickson, mở bài; Pereira: "a hippocampal subregion important for memory"'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ như trên; giữ ý, nguồn chỉ xác nhận vai trò với trí nhớ; "hình con ngựa biển" là mô tả giải phẫu thông thường (tên "hippocampus"); chưa mở giáo trình giải phẫu. Review (Claude Sonnet 5.5, 10/11/2026): sai (nhẹ). "Trung tâm" mạnh hơn nguồn (Erickson: suy giảm hồi hải mã đi trước và dẫn đến suy giảm trí nhớ; Pereira: vùng con "quan trọng cho trí nhớ"). Đã đổi trang và cau thành "vai trò quan trọng". "Hình con ngựa biển" là nghĩa tên gọi, giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/8-2-parts-of-the-brain-involved-with-memory" ]
    luot_2_ghi_chu: "'Hình con ngựa biển' là nghĩa tên gọi, không kiểm riêng."
    review: sai
  - id: n7
    cau: Ở người lớn tuổi không sa sút trí tuệ, hồi hải mã teo khoảng 1–2% thể tích mỗi năm, và sự teo này làm tăng nguy cơ suy giảm nhận thức.
    loai: so-lieu
    nguon:
      - erickson2011
    trich: Hippocampal volume shrinks 1–2% annually in older adults without dementia (1), and this loss of volume increases the risk for developing cognitive impairment (2).
    vi_tri: Erickson, Discussion
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "từ khoảng tuổi trung niên, hồi hải mã bắt đầu teo dần... trí nhớ giảm và nguy cơ sa sút trí tuệ tăng". Chữ mới theo Erickson: "người lớn tuổi không sa sút trí tuệ"; "suy giảm nhận thức". Lý do: "tuổi trung niên" và "sa sút trí tuệ" không có trong câu của nguồn. Review (Claude Sonnet 5.5, 10/11/2026): dung. Trang khớp trích (Erickson Discussion, "Hippocampal volume shrinks 1–2% annually in older adults without dementia ... increases the risk for developing cognitive impairment"); trang ghi "theo Erickson và cộng sự".'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2020/https://www.pnas.org/content/108/7/3017.full", "https://pubmed.ncbi.nlm.nih.gov/21282661/" ]
    luot_2_ghi_chu: Là câu Erickson trích từ tài liệu khác.
    review: dung
  - id: n8
    cau: Erickson và cộng sự cho rằng sự mất thể tích hồi hải mã ở tuổi già không phải là tất yếu.
    loai: phat-hien
    nguon:
      - erickson2011
    trich: we demonstrate that loss of hippocampal volume in late adulthood is not inevitable and can be reversed with moderate-intensity exercise
    vi_tri: Erickson, Discussion
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Lâu nay người ta coi đó là "quy luật tất yếu"". Chữ mới: "Nhiều người coi". Chỗ khó: câu về quan niệm chung, nguồn chỉ nói tác giả phản bác "inevitable". Review (Claude Sonnet 5.5, 10/11/2026): sai. Câu "Nhiều người coi đó là quy luật tất yếu" nói về quan niệm chung, nguồn chỉ có lời tác giả: "loss of hippocampal volume in late adulthood is not inevitable and can be reversed with moderate-intensity exercise". Đã viết lại theo nguồn: "Erickson và cộng sự cho rằng sự mất thể tích này ở tuổi già không phải là tất yếu." (loại đổi từ lich-su sang phat-hien).'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2020/https://www.pnas.org/content/108/7/3017.full", "https://pubmed.ncbi.nlm.nih.gov/21282661/" ]
    luot_2_ghi_chu: Erickson xem đó là quan niệm cần bác; câu là mô tả quan niệm.
    review: sai
  - id: n9
    cau: Các nghiên cứu trên động vật gặm nhấm cho thấy vận động làm tăng sự tăng sinh và sống sót của tế bào ở hồi hải mã.
    loai: phat-hien
    nguon:
      - erickson2011
      - pereira2007
    trich: Exercise enhances learning and improves retention, which is accompanied by increased cell proliferation and survival in the hippocampus of rodents
    vi_tri: Erickson, mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Thập niên 2000... nghi ngờ quy luật này. Quan sát trên động vật cho thấy chuột chạy bánh xe mỗi ngày sinh ra nhiều tế bào thần kinh mới ở hồi hải mã hơn chuột nằm yên". Chữ mới theo Erickson. Lý do: "thập niên 2000" và "bánh xe" không có trong nguồn. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp trích Erickson (mở bài): tăng sinh và sống sót tế bào ở hồi hải mã của động vật gặm nhấm.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/10195220/", "https://pubmed.ncbi.nlm.nih.gov/19666694/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n10
    cau: 'Thử nghiệm Erickson: 120 người lớn tuổi (55–80 tuổi), ít vận động, không có sa sút trí tuệ.'
    loai: so-lieu
    nguon:
      - erickson2011
    trich: be between the ages of 55 and 80 y ... currently sedentary, defined as being physically active for 30 min or less in the last 6 mo
    vi_tri: 'Erickson, Methods: Participants'
    ket_qua: da-sua
