    loai: thoi-su
    nguon:
      - tim-kiem-vn
    het_han: '2028-11-01'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "… và hiện tại chúng ta chưa có." Chữ mới: "… và tính đến 11/2026 chúng tôi chưa tìm thấy." Phần "được bàn ở mọi gia đình Việt" là nhận xét văn hóa không có nguồn, giữ như lời dẫn (không phải khẳng định nghiên cứu). Review (Claude Opus 5.5, 10/11/2026): sai. Lượt 2: qua-manh. Đồng ý: "là chuyện được bàn ở mọi gia đình Việt" là khái quát không nguồn. Cách lượt 2 đề xuất ("quan niệm quen thuộc ở Việt Nam") vẫn là khẳng định chưa có khảo sát, nên viết lại thành câu không khẳng định về người Việt: "Những câu hỏi kiểu ''con nhà tông'' … chính là điều nghiên cứu sinh đôi tìm cách trả lời." Phần "tính đến 11/2026 chúng tôi chưa tìm thấy" giữ (thời sự, het_han 2028-11-01).'
    luot_2: qua-manh
    luot_2_nguon: [ "https://www.ebi.ac.uk/europepmc/webservices/rest/search?format=json&query=(TITLE%3Atwin*%20OR%20TITLE%3A%22twin%20study%22)%20AND%20(TITLE%3AVietnam*%20OR%20AFF%3A%22Hanoi%22%20OR%20AFF%3A%22Ho%20Chi%20Minh%22)%20AND%20(TITLE%3Aheritab*%20OR%20TITLE%3Aintelligence%20OR%20TITLE%3Apersonality%20OR%20TITLE%3Acognitive)", "https://www.ebi.ac.uk/europepmc/webservices/rest/search?format=json&query=(%22Vietnamese%20twins%22%20OR%20%22twin%20registry%22)%20AND%20Vietnam%20AND%20(intelligence%20OR%20personality%20OR%20IQ)" ]
    luot_2_ghi_chu: "câu đúng: Câu hỏi 'con nhà tông' là quan niệm quen thuộc ở Việt Nam (chưa có khảo sát); để có con số cho người Việt cần nghiên cứu trên người Việt, và tính đến 10/11/2026 chưa thấy nghiên cứu nào.; Phần 'chưa tìm thấy' đúng. 'Được bàn ở mọi gia đình Việt' là khái quát không có nguồn."
