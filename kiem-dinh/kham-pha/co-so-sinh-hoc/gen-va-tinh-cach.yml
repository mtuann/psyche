    trich: These correlations vary within a narrow range (0.64 to 0.74)
    vi_tri: 'Bouchard 1990, mục Results (Bảng 2: Newman, Shields, Juel-Nielsen, Minnesota)'
    ket_qua: da-sua
    ghi_chu: 'Hai nguồn đếm số nghiên cứu khác nhau (bốn và năm); khoảng của Bouchard là ở phép đo chính, các phép đo phụ cao hơn (đến 0,78). Review (Claude Opus 5.5, 10/11/2026): sai. Chữ cũ: "…, và năm nghiên cứu ở người trưởng thành ở châu Âu và Hoa Kỳ cho 0,68–0,78 (Neisser và cộng sự, 1996)". Lượt 2: sai (Bouchard 1996 Bảng 5.1 cho 0,64–0,78 ở phép đo chính, 0,69–0,78 trung bình các phép đo), nhưng lượt 2 không mở Neisser 1996. Review không mở được Neisser 1996 bằng đường hợp lệ (APA có tường phí; bản trong bộ Internet Archive bị chặn ở review vì là bản sao của bài có tường phí; tìm kiếm không thấy câu ".68 to .78" ở nguồn mở nào). Hai lượt cho hai khoảng khác nhau, không phân xử được: bỏ nửa câu về năm nghiên cứu, giữ phần hai lượt cùng xác nhận (bốn nghiên cứu, 0,64–0,74, Bouchard 1990 Bảng 2) và thêm tên ba nước theo Bảng 2 (Newman: Mỹ, Shields: Anh, Juel-Nielsen: Đan Mạch). Chữ mới: "bốn nghiên cứu nuôi tách nhau, ở Mỹ, Anh và Đan Mạch, cho tương quan IQ từ 0,64 đến 0,74 (Bouchard và cộng sự, 1990, Bảng 2)".'
