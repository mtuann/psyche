    cau: 'Đã bị bác bỏ: "heritability 60% nghĩa là 60% con người bạn do gen định đoạt".'
    loai: nhan
    nhan: bac-bo
    co_so:
      - neisser1996
      - jansen2015
    ly_do: 'Khẳng định bị bác là cách hiểu "tính di truyền 60% nghĩa là 60% con người một cá nhân do gen". Đây là hiểu sai về định nghĩa, không phải giả thuyết đã qua kiểm tra thực nghiệm: tính di truyền là phần khác biệt giữa người với người trong một quần thể gắn với khác biệt gen (Jansen 2015; Neisser 1996), đổi theo quần thể (Turkheimer 2003). Review (10/11/2026) giữ Đã bị bác bỏ: trong bốn nhãn của site đây là nhãn cho "khẳng định không còn giá trị"; thẻ ngộ nhận gen-quyet-dinh trong src/data/ngo-nhan.yml dùng bac-bo cho cùng cách hiểu sai. Thân khung đã nói rõ "sai về định nghĩa" để người đọc không hiểu là đã có thí nghiệm bác bỏ.'
    nguon:
      - neisser1996
      - jansen2015
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đây là cách hiểu sai phổ biến nhất — và đã bị bác bỏ rõ ràng. Tính di truyền … mô tả nguồn gốc của khác biệt giữa người với người …". Chữ mới: "Đây là một cách hiểu sai phổ biến — và nó sai về định nghĩa … gắn với khác biệt về gen … (Neisser và cộng sự, 1996)". Lý do: "phổ biến nhất" không kiểm được; "đã bị bác bỏ rõ ràng" đổi thành "sai về định nghĩa". Review (Claude Opus 5.5, 10/11/2026): dung. Đọc lại thước đo mục 4: nhãn Đã bị bác bỏ được định nghĩa cho bằng chứng thực nghiệm; câu này sai về định nghĩa. Giữ nhãn vì: không nhãn nào khác hợp hơn (Đang tranh cãi sẽ ngụ ý còn bàn), site đã dùng bac-bo cho cùng ngộ nhận ở ngo-nhan.yml, và thân khung nói rõ lý do là định nghĩa. ly_do viết lại.'
    luot_2: dung
