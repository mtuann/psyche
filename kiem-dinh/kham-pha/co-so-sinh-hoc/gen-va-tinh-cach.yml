    luot_2_ghi_chu: "Không mở trang nên không so từng mục với danh sách. Metadata thật khớp bản ghi cho Bouchard 1990 (Science 250:223), Galton 1875 (Fraser's Magazine; J. Anthropol. Inst. 5:391, 1876), Haworth 2010 (Mol Psychiatry 15:1112), Plomin & Daniels 1987 (BBS), Polderman 2015 (Nat Genet 47:702), Turkheimer 2003 (Psychol Sci 14:623), Vukasović & Bratko 2015 (Psychol Bull 141:769), Leo 1987 (Time), Lewis 2014 (LiveScience). Chưa kiểm: Neisser 1996, Segal 2012."
