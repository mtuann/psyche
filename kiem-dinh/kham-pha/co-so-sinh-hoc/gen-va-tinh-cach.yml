    luot_2_ghi_chu: 348 là mọi cặp Minnesota đã nghiên cứu (cả nuôi chung), khớp cách câu viết 'hai trong số 348 cặp'; hơn 100 bộ nuôi tách và ~50 giờ khớp Bouchard 1990 tr.224.
