    luot_2_ghi_chu: "câu đúng: Chưa có bằng chứng trực tiếp rằng hiểu đúng về di truyền giúp nuôi dạy tốt hơn; điều có nguồn là tính di truyền không làm giảm giá trị của nuôi dạy và giáo dục (Bouchard 1990). Nhãn nên bỏ hoặc hạ xuống mức chưa kiểm chứng.; Nguồn chỉ cho thấy tính di truyền không làm giảm giá trị của nuôi dạy. Không nguồn nào kiểm tra việc 'hiểu đúng về di truyền' khiến nuôi dạy tỉnh táo hơn; nhãn 'Khá vững' gắn lên hiệu quả của lời khuyên là cao hơn bằng chứng."
