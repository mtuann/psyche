    luot_2_ghi_chu: "câu đúng: Bốn nghiên cứu sinh đôi cùng trứng nuôi tách nhau cho tương quan IQ 0,64–0,74 ở phép đo chính; thêm nghiên cứu SATSA (Thụy Điển), năm nghiên cứu cho 0,64–0,78 ở phép đo chính (trung bình các phép đo 0,69–0,78).; Nửa đầu đúng (0,64–0,74, bốn nghiên cứu). Nửa sau 'năm nghiên cứu ... 0,68–0,78' không khớp bảng của Bouchard 1996: phép đo chính 0,64–0,78, trung bình các phép đo 0,69–0,78. Nếu số 0,68–0,78 lấy từ nguồn khác (Neisser và cộng sự 1996), chưa mở được bản gốc."
