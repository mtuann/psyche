  - id: n38
    cau: 'Khá vững: tính di truyền của trí tuệ và tính cách ở mức vài chục phần trăm.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - polderman2015
      - vukasovic2015
      - haworth2010
      - bouchard1990
    ly_do: 'Hai phân tích tổng hợp (Polderman: 49% trên 17.804 tính trạng; Vukasović & Bratko: 40% với tính cách, 62 kích thước hiệu ứng độc lập, hơn 100.000 người) cùng chiều với hai nghiên cứu lớn về IQ (Haworth, Bouchard). Giới hạn: con số khác nhau theo tính trạng, tuổi, thiết kế (twin 47% so với gia đình và con nuôi 22% ở tính cách), mẫu chủ yếu phương Tây; hệ số phụ thuộc quần thể (Turkheimer 2003). "Khá vững" đúng theo thước đo (nhiều nghiên cứu cùng chiều nhưng kết quả khác nhau nhiều giữa các nghiên cứu và mẫu phương Tây).'
    nguon:
      - polderman2015
      - vukasovic2015
      - haworth2010
      - bouchard1990
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Các ước tính thường rơi vào khoảng 40–60% … Polderman … trung bình 49% …; Bouchard … khoảng 70% cho IQ …; Haworth … 41% → 66% …". Chữ mới: "từ 40% đến 70%", thêm Vukasović & Bratko (2015). Lý do: khoảng "40–60%" mâu thuẫn với 66% và 70% ngay trong câu; thêm số của tính cách. Review (Claude Opus 5.5, 10/11/2026): sai. Nhãn Khá vững đúng thước đo (hai phân tích tổng hợp cùng chiều, con số khác nhau nhiều theo tính trạng, tuổi, thiết kế; mẫu chủ yếu phương Tây). Nhưng thân khung viết "49% trên hàng chục nghìn tính trạng"; tóm tắt Polderman 2015: 17.804 tính trạng (chưa tới hai chục nghìn). Chữ mới: "49% trên 17.804 tính trạng". Số Vukasović & Bratko (62 kích thước hiệu ứng, hơn 100.000 người, 0,40; 0,47; 0,22) và Haworth (41%, 55%, 66%, 11.000 cặp, bốn nước) khớp tóm tắt Europe PMC.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/25985137/", "https://pubmed.ncbi.nlm.nih.gov/25961374/", "https://gwern.net/doc/iq/1990-bouchard.pdf" ]
    luot_2_ghi_chu: "Có tổng hợp lớn, đa số mẫu phương Tây, hệ số thay đổi theo tuổi và SES: 'Khá vững' hợp."
    review: sai
