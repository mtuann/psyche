    ghi_chu: 'Đã đối chiếu với Crossref (10/11/2026) các mục có DOI. Chữ cũ: 5 mục. Thêm Leo 1987, Lewis 2014, Neisser 1996, Turkheimer 2003, Vukasović & Bratko 2015 vì bài dẫn các nguồn này; xếp lại theo bảng chữ cái. Segal (2012) là sách, chưa đọc được: nguồn phụ, không dẫn nhận định nào vào nó. Review (Claude Opus 5.5, 10/11/2026): dung. Lượt 2 ghi khong-chac vì không so được với trang. Review so từng mục trên trang với Crossref (10/11/2026): Bouchard 1990 Science 250(4978) 223–228; Haworth 2010 Mol Psychiatry 15(11) 1112–1120 (24 tác giả, đủ); Plomin & Daniels 1987 BBS 10(1) 1–16; Polderman 2015 Nat Genet 47(7) 702–709; Turkheimer 2003 Psychol Sci 14(6) 623–628; Vukasović & Bratko 2015 Psychol Bull 141(4) 769–785; Neisser 1996 Am Psychol 51(2) 77–101 (11 tác giả): khớp. Time: John Leo, "Behavior: Exploring the traits of twins", 12/1/1987 (mở lại bản lưu ở time.com): khớp. Galton 1875 Fraser''s Magazine 12, 566–576 khớp lượt 1 và lượt 2 (galton.org). Segal 2012 là sách, không có nhận định nào dựa vào. Neisser 1996 còn dùng cho n43, n47, n51 (định nghĩa, chiều cao) như lượt 1 đã đọc.'
