  - id: n36
    cau: 'Bốn nghiên cứu nuôi tách nhau, ở Mỹ, Anh và Đan Mạch, cho tương quan IQ từ 0,64 đến 0,74 (Bouchard và cộng sự, 1990, Bảng 2).'
    loai: so-lieu
