  - id: n34
    cau: 'Hình tinh-di-truyen-theo-tuoi, chú thích: tính di truyền của khả năng nhận thức chung tăng dần theo tuổi (Haworth, 11.000 cặp); cột cuối khoảng 70% cho IQ người trưởng thành từ một nghiên cứu khác (Bouchard 1990, sinh đôi nuôi tách nhau), không phải điểm tiếp theo trên cùng một đường; "tính di truyền" là thống kê trên quần thể.'
    loai: dinh-nghia
    nguon:
      - haworth2010
      - neisser1996
    trich: Given a trait on which individuals vary, however, one can ask what fraction of that variation is associated with differences in their genotypes (this is the heritability of the trait)
    vi_tri: Neisser 1996
    ket_qua: da-sua
    ghi_chu: 'Chú thích hình nhất quán với định nghĩa (n13). Review (Claude Opus 5.5, 10/11/2026): sai. Hình đặt cột Bouchard (~70%, sinh đôi nuôi tách nhau, người trưởng thành) cạnh ba cột Haworth (sinh đôi nuôi cùng, 9–17 tuổi) trên cùng một thang, dễ đọc thành một dãy liên tục sau 66%. Số đều đúng. Chú thích cũ: "Cột cuối: ước tính khoảng 70% … (Bouchard và cộng sự, 1990)." Chú thích mới: "… ở người trưởng thành, từ một nghiên cứu khác (Bouchard và cộng sự, 1990; sinh đôi nuôi tách nhau), nên không phải điểm tiếp theo trên cùng một đường với ba cột đầu." Cần thêm tinh-di-truyen-theo-tuoi vào HINH_DA_SUA.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC2889158/", "https://gwern.net/doc/iq/1990-bouchard.pdf" ]
    luot_2_ghi_chu: Chú thích hợp với nguồn.
    review: sai
