    ghi_chu: 'Chữ cũ trong ngoặc: "(bạn bè riêng, thầy cô riêng, cách cha mẹ đối xử với từng đứa khác nhau, cả những sự kiện ngẫu nhiên)". Chữ mới: "(như bạn bè, thầy cô, cách được đối xử — ví dụ minh họa của chúng tôi, không phải danh sách của bài gốc)". Lý do: danh sách ví dụ không có trong tóm tắt, toàn văn chưa mở được. Review (Claude Opus 5.5, 10/11/2026): dung. Tóm tắt Plomin & Daniels 1987 theo câu trích (nonshared environment là nguồn chính của phương sai môi trường); trang ghi danh sách ví dụ là của site.'
