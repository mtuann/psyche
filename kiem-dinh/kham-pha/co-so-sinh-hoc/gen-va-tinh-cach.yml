    cau: 'Mô tả: nghiên cứu sinh đôi nuôi tách nhau của Bouchard và cộng sự; trung bình khoảng một nửa khác biệt giữa người với người trong các quần thể đã nghiên cứu gắn với khác biệt về gen; tính di truyền không có nghĩa số phận đã định.'
    loai: phat-hien
    nguon:
      - polderman2015
      - neisser1996
    trich: across all traits the reported heritability is 49%
    vi_tri: 'Polderman 2015, tóm tắt; Neisser 1996: "Heritability does not imply immutability"'
    ket_qua: da-lam-mem
    ghi_chu: 'Mô tả (description). Chữ cũ: "gen giải thích khoảng một nửa khác biệt giữa người với người". Chữ mới: "trung bình khoảng một nửa khác biệt giữa người với người trong các quần thể đã nghiên cứu gắn với khác biệt về gen". Lý do: "gen giải thích" dễ đọc thành nguyên nhân cho từng người; tính di truyền là thống kê theo quần thể. Review (Claude Opus 5.5, 10/11/2026): dung. Tóm tắt Polderman 2015 (Europe PMC): "across all traits the reported heritability is 49%". Mô tả khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://gwern.net/doc/iq/1990-bouchard.pdf", "https://pubmed.ncbi.nlm.nih.gov/25985137/" ]
    luot_2_ghi_chu: "'Khoảng một nửa' ở mức tổng hợp (49%); IQ người lớn trong MISTRA ~70%."
    review: dung
  - id: n2
    cau: Năm 1979, hai người đàn ông 39 tuổi, Jim Lewis và Jim Springer, gặp nhau lần đầu; họ là sinh đôi cùng trứng bị tách nhau từ khi mới vài tuần tuổi.
    loai: lich-su
    nguon:
      - livescience2014
      - time1987
    trich: Separated four weeks after birth in 1940, the Jim twins grew up 45 miles apart in Ohio and were reunited in 1979.
    vi_tri: 'Time 1987, đoạn đầu; LiveScience: "reunited at the age of 39 in 1979"'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "được hai gia đình khác nhau ở Ohio nhận nuôi". Chữ mới: "được nuôi ở hai gia đình khác nhau ở Ohio". Lý do: nguồn đã mở nói "grew up 45 miles apart in Ohio", không nói "nhận nuôi". Nguồn bậc 3 (báo); dữ kiện nghiên cứu gốc (Bouchard 1990) không nêu riêng cặp Jim. Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại Time (bản lưu ở time.com/archive/6708046, John Leo, 12/1/1987): "Separated four weeks after birth in 1940, the Jim twins grew up 45 miles apart in Ohio and were reunited in 1979". Khớp; "nhận nuôi" đã bỏ.'
    luot_2: dung
    luot_2_nguon: [ "https://content.time.com/time/magazine/article/0,9171,963211,00.html", "https://www.livescience.com/47288-twin-study-importance-of-genetics.html" ]
    luot_2_ghi_chu: "Time 14/1/1987 (John Leo) và LiveScience/NBC 2014: nguồn phổ thông, đúng cho giai thoại."
