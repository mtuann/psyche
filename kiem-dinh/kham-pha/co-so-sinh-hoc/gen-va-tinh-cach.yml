  - cu: 'khung Đã bị bác bỏ: "Đây là cách hiểu sai phổ biến nhất — và đã bị bác bỏ rõ ràng."'
    moi: '"Đây là một cách hiểu sai phổ biến — và nó sai về định nghĩa."'
    ly_do: Hồ sơ n43.
  - cu: 'mục Các lý thuyết: "Gen cộng gộp, mỗi gen một chút … Hàng nghìn biến thể gen …"; ví dụ đứa trẻ ham đọc và ly hôn không đánh dấu'
    moi: '"Gen cộng gộp. … ảnh hưởng của gen cộng dồn …"; "(Ví dụ minh họa của chúng tôi:)", "(ví dụ minh họa: cha mẹ ly hôn)"'
    ly_do: Hồ sơ n45, n46, n47.
  - cu: 'Áp dụng 2: "tính di truyền khoảng 40–60%"; Áp dụng 3: "Đây là điểm nhiều người nhầm nhất."; Giới hạn: "Hầu hết dữ liệu … (Mỹ, châu Âu, Úc)"'
    moi: '"khoảng 40% (47% trong các nghiên cứu sinh đôi; …)"; "… Neisser và cộng sự (1996) viết rằng tính di truyền không hàm ý bất biến …"; "Dữ liệu trong bài chủ yếu đến từ các xã hội phương Tây; … (Neisser …)"'
    ly_do: Hồ sơ n50, n51, n53.
  - cu: 'mục Ở Việt Nam: "Chúng tôi chưa tìm thấy nghiên cứu sinh đôi nào trên người Việt. … MISTRA ở Mỹ, các sổ đăng ký sinh đôi ở Thụy Điển …, phân tích tổng hợp của Polderman — đều … phương Tây … con số 40–60% …"; "… hiện tại chúng ta chưa có."'
    moi: '"Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu sinh đôi nào về trí tuệ hay tính cách trên người Việt. … MISTRA ở Mỹ; … Mỹ, Anh và Đan Mạch (Neisser …) … khoảng 40% cho tính cách, khoảng 41–70% cho trí tuệ tùy tuổi …"; "… tính đến 11/2026 chúng tôi chưa tìm thấy."'
    ly_do: Hồ sơ n55–n58.
  - cu: 'Ngộ nhận: "Ngay cả cặp cùng trứng nuôi cùng nhau vẫn khác nhau — … các yếu tố ngẫu nhiên trong phát triển."'
    moi: '"Ngay cả cặp cùng trứng nuôi tách nhau cũng chỉ có tương quan IQ khoảng 0,64–0,74 …, không phải 1; phần khác biệt còn lại … không do gen."'
    ly_do: Hồ sơ n60.
