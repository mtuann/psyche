      - bouchard1990
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: khung "Vững chắc: … đã được tìm thấy lại trong nhiều nghiên cứu độc lập ở nhiều nước, không chỉ ở Minnesota. Đây là một trong những kết quả được lặp lại vững chắc nhất của di truyền học hành vi." Chữ mới: khung "Khá vững: … bốn nghiên cứu nuôi tách nhau cho tương quan IQ từ 0,64 đến 0,74 …, năm nghiên cứu … 0,68–0,78 (Neisser …) … chưa phải vững chắc". Lý do: không có nguồn cho "một trong những kết quả lặp lại vững chắc nhất"; theo thước đo, chưa có tổng hợp riêng và mẫu hẹp. Đổi nhãn làm đổi dòng Tóm tắt nhanh. Review nên xem lại. Review (Claude Opus 5.5, 10/11/2026): dung. Nhãn Khá vững (đổi từ Vững chắc) đúng thước đo. Thân khung đã sửa theo n36, n37 (bỏ số của Neisser và cụm "chủ yếu người da trắng" chưa kiểm được); co_so, ly_do viết lại cho khớp.'
