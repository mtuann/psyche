    ghi_chu: 'Chữ cũ: "Một nhóm ở Hà Lan và Úc đã làm điều mà không nghiên cứu đơn lẻ nào làm được …; gần như toàn bộ nghiên cứu". Chữ mới: "Một nhóm nghiên cứu quốc tế … (các cặp có thể trùng lặp …) — theo các tác giả, gần như toàn bộ …". Lý do: nơi làm việc của các tác giả không kiểm được từ tóm tắt; "partly dependent twin pairs" nghĩa các cặp có thể xuất hiện lặp. Chỉ đọc tóm tắt. Review (Claude Opus 5.5, 10/11/2026): dung. Tóm tắt Polderman 2015: "17,804 traits from 2,748 publications including 14,558,903 partly dependent twin pairs, virtually all published twin studies of complex traits". Khớp.'
