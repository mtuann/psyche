    ghi_chu: 'Chữ cũ: "Không có gen thông minh hay gen hướng ngoại đơn lẻ. Hàng nghìn biến thể gen, mỗi cái góp một phần rất nhỏ, cộng lại thành khuynh hướng chung. Đó là lý do phân tích tổng hợp 2015 thấy mô hình gen cộng gộp giải thích được phần lớn dữ liệu." Chữ mới: chỉ nói điều tóm tắt Polderman xác nhận. Lý do: "hàng nghìn biến thể, mỗi cái một phần rất nhỏ" là kết quả của nghiên cứu phân tử (GWAS), chưa mở nguồn nào trong lô này. Review (Claude Opus 5.5, 10/11/2026): dung. Tóm tắt Polderman 2015: "For a majority (69%) of traits … solely due to additive genetic variation"; câu GWAS đã bỏ.'
    luot_2: dung
