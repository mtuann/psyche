    cau: 'Đang tranh cãi: con số chính xác là bao nhiêu, và phương pháp sinh đôi có thổi phồng nó không.'
    loai: nhan
    nhan: tranh-cai
    co_so:
      - bouchard1990
      - turkheimer2003
      - polderman2015
      - vukasovic2015
    ly_do: Con số khác nhau theo thiết kế (twin 0,47 so với gia đình và con nuôi 0,22, Vukasović & Bratko 2015); chính Bouchard 1990 nêu và kiểm các lời phê bình về xếp nhà nhận nuôi giống nhau, môi trường trước sinh chung, tiếp xúc sau khi gặp lại; Turkheimer 2003 thấy tính di truyền phụ thuộc mức kinh tế–xã hội. Không có tái lập lớn thất bại, nhưng có bằng chứng chất lượng cao khác nhau về con số; nên "đang tranh cãi" cho câu hỏi cụ thể "bao nhiêu", trong khi hướng chung (gen đóng góp vào khác biệt) được nhiều tổng hợp ủng hộ.
    nguon:
      - bouchard1990
      - turkheimer2003
      - polderman2015
      - vukasovic2015
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một số nhà phê bình cho rằng … mẫu nhỏ, các cặp nuôi tách nhau đôi khi vẫn lớn lên trong môi trường khá tương đồng, và giả định … gây tranh cãi. Phe ủng hộ đáp lại bằng sự nhất quán … Con số chính xác còn được bàn tiếp; hướng chung thì ít ai phủ nhận." Chữ mới: viện dẫn Bouchard 1990 (tự nêu lời phê bình), Turkheimer 2003 và Polderman; bỏ "ít ai phủ nhận" và "Phe ủng hộ đáp lại …". Lý do: không có nguồn mở cho các câu bị bỏ; thay bằng điều nguồn nói. Review (Claude Opus 5.5, 10/11/2026): dung. Nhãn Đang tranh cãi cho câu hỏi "con số chính xác bao nhiêu, phương pháp sinh đôi có thổi phồng không": các thiết kế cho số khác hẳn nhau (sinh đôi 0,47 so với gia đình và con nuôi 0,22, Vukasović & Bratko 2015, tóm tắt), tính di truyền đổi theo mức kinh tế–xã hội (Turkheimer 2003, tóm tắt). Đạt điều kiện "bằng chứng chất lượng cao mâu thuẫn nhau" về độ lớn.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/25961374/", "https://pubmed.ncbi.nlm.nih.gov/25985137/" ]
    luot_2_ghi_chu: "Các thiết kế cho số khác hẳn: hợp 'Đang tranh cãi' (về độ lớn và phương pháp)."
