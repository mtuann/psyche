    ghi_chu: 'Chữ cũ: "Đây là điểm nhiều người nhầm nhất." Chữ mới: thêm câu dẫn Neisser (1996) và ví dụ chiều cao. Lý do: "nhiều người nhầm nhất" không kiểm được; thêm nguồn cho phần còn lại ("chiếc bánh" là ví dụ so sánh của chúng tôi). Review (Claude Opus 5.5, 10/11/2026): sai. Hồ sơ ghi đã bỏ "Đây là điểm nhiều người nhầm nhất" (không kiểm được), nhưng trang vẫn còn câu ấy ở đầu mục Áp dụng 3. Review đã bỏ: đoạn nay mở đầu "Neisser và cộng sự (1996) viết rằng …". Câu trích Neisser về chiều cao do lượt 1 đọc; lượt 2 xác nhận ý bằng nguồn khác (chiều cao tăng theo thế kỷ, eLife 2016).'
