  - id: n11
    cau: Sinh đôi cùng trứng chia sẻ gần như 100% gen; sinh đôi khác trứng chia sẻ khoảng 50% gen (trung bình), như anh chị em thường.
    loai: dinh-nghia
    nguon:
      - jansen2015
    trich: Monozygotic (MZ) twins, being genetically identical, share all additive as well as non-additive … genetic effects, while dizygotic (DZ) twins share on average 50 % of their additive and 25 % of their non-additive genetic effects.
    vi_tri: Jansen 2015, mục Introduction
    ket_qua: dung
    ghi_chu: Nguồn nói "50% hiệu ứng gen cộng gộp"; trang nói "khoảng 50% gen" (mức đơn giản hóa chấp nhận được).
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC2889158/" ]
  - id: n12
    cau: Nếu một đặc điểm chủ yếu do gen thì cặp cùng trứng giống nhau hơn cặp khác trứng, kể cả khi lớn lên ở hai gia đình khác nhau (logic của thiết kế).
    loai: phat-hien
    nguon:
      - jansen2015
      - bouchard1990
    trich: In the "classical twin design", heritability estimates are based on the comparison of within MZ and DZ twin
    vi_tri: Jansen 2015, mục Introduction
    ket_qua: dung
    ghi_chu: Suy luận về thiết kế nghiên cứu, không phải kết quả.
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC2889158/", "https://gwern.net/doc/iq/1990-bouchard.pdf" ]
  - id: n13
    cau: 'Tính di truyền (heritability) là con số thống kê: trong một quần thể cụ thể, bao nhiêu phần trăm khác biệt giữa người với người gắn với khác biệt về gen.'
    loai: dinh-nghia
    nguon:
      - jansen2015
      - neisser1996
    trich: Given a trait on which individuals vary, however, one can ask what fraction of that variation is associated with differences in their genotypes (this is the heritability of the trait)
    vi_tri: 'Neisser 1996, mục Genetics and environment; Jansen 2015: "Heritability is defined as the proportion of variation … that arises from genetic influences."'
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC2889158/", "https://pubmed.ncbi.nlm.nih.gov/25985137/" ]
    luot_2_ghi_chu: Heritability là thống kê quần thể, không phải của cá nhân.
  - id: n14
    cau: Galton đề xuất năm 1875 dùng sinh đôi như một phương pháp mới để phân biệt tác động của nature và nurture; cặp từ ấy có ngay trong nhan đề bài của ông.
    loai: lich-su
    nguon:
      - galton1875
    trich: I have therefore attacked the problem from the opposite side, seeking for some new method by which it would be possible to weigh in just scales the respective effects of nature and nurture
    vi_tri: Galton 1875, tr. 566
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Galton lần đầu đề xuất phương pháp này (và cũng là người đặt ra cặp khái niệm nature và nurture)". Chữ mới: "đề xuất đó là một phương pháp mới … cặp từ có ngay trong nhan đề bài của ông". Lý do: "lần đầu" chỉ là lời của Galton ("some new method"); "đặt ra cặp khái niệm" không kiểm được (cặp từ đã có từ trước theo hiểu biết chung, chưa có nguồn mở). Review (Claude Opus 5.5, 10/11/2026): dung. Câu trích Galton 1875 ("some new method … nature and nurture") và nhan đề khớp; lượt 2 mở bản galton.org. "lần đầu", "đặt ra cặp khái niệm" đã bỏ khỏi trang.'
    luot_2: dung
    luot_2_nguon: [ "https://galton.org/essays/1870-1879/galton-1875-history-of-twins.htm" ]
    luot_2_ghi_chu: "Nhan đề đầy đủ: 'The History of Twins, as a Criterion of the Relative Powers of Nature and Nurture' (Fraser's Magazine 1875; J. Anthropol. Inst. 5:391, 1876)."
