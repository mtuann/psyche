- id: n48
  cau: 'Đã bị bác bỏ: mọi đặc điểm tâm lý đều là thích nghi.'
  loai: nhan
  nhan: bac-bo
  co_so:
  - gould1979
  ly_do: 'Nguyên tắc phương pháp, xét theo đồng thuận của giáo trình sinh học tiến hóa và bài của Gould & Lewontin: khẳng định "mọi đặc điểm đều là thích nghi" bị phản bác bằng các ví dụ ngược (sản phẩm phụ, trôi dạt) và không phải là điều tâm lý học tiến hóa chủ lưu nói. Khung đã tách nửa sau cũ (tiêu chuẩn nêu ra không bằng lựa chọn thực) vì chỉ có một nghiên cứu và một tổng quan, không đủ cho "bác bỏ" (theo bài học đợt 3–4: khung gộp hai ý theo ý yếu hơn).'
  nguon:
  - gould1979
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: khung "mọi đặc điểm tâm lý đều là thích nghi, và tiêu chuẩn nêu ra bằng lựa chọn thực tế", hai bác bỏ, (2) r ≈ 0,03. Chữ mới: chỉ ý 1; ý 2 chuyển sang khung Khá vững (n46). Lý do: ý 2 không đủ bằng chứng cho "đã bị bác bỏ", và r ≈ 0,03 sai. Cũng đổi "trôi dạt gen (thay đổi ngẫu nhiên)" thành "cố định ngẫu nhiên các alen" theo tóm tắt Gould & Lewontin.'
