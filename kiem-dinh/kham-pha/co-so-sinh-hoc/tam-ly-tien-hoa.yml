nhan_dinh:
- id: n1
  cau: Từ chọn lọc giới tính của Darwin đến nghiên cứu chọn bạn đời ở 37 nền văn hóa của Buss (1989), nhiều "lời giải thích" của tâm lý học tiến hóa bị gọi là chuyện kể vừa vặn (mô tả).
  loai: lich-su
  nguon:
  - buss1989
  - gould1979
  trich: We fault the adaptationist programme ... for its reliance upon plausibility alone as a criterion for accepting speculative tales
  vi_tri: Gould & Lewontin, tóm tắt; Buss, tóm tắt
  ket_qua: dung
  ghi_chu: 'Mô tả (description). "37 nền văn hóa" là cách nói của nhan đề Buss ("37 cultures"): 37 mẫu từ 33 nước (n17).'
- id: n2
  cau: Tình huống Mai ghen khi người yêu bấm "thích" ảnh người lạ, và Nam đã có bạn gái nhưng vẫn ngắm người đẹp, là ví dụ giả định.
  loai: ve-site
  ket_qua: dung
  ghi_chu: gia-dinh. Ví dụ giả định, không khẳng định điều gì về bằng chứng; kiểm trên trang.
- id: n3
  cau: Một số nhà tâm lý học nói não ta được "lập trình" từ thời tổ tiên săn bắn hái lượm, nơi ngoại hình có thể báo hiệu khả năng sinh sản.
  loai: phat-hien
  nguon:
  - buss1989
  trich: Characteristics signaling reproductive capacity were valued more by males than by females.
  vi_tri: Buss, tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "nơi ghen tuông giữ được bạn tình và ngoại hình báo hiệu sức khỏe sinh sản". Chữ mới: "nơi ngoại hình có thể báo hiệu khả năng sinh sản". Lý do: Buss (1989) nói về dấu hiệu khả năng sinh sản và nguồn lực; phần "ghen tuông giữ bạn tình" không có trong nguồn đã mở.'
- id: n4
  cau: Tâm lý học tiến hóa dùng chọn lọc tự nhiên và chọn lọc giới tính để giải thích đặc điểm tâm lý và hành vi của con người.
  loai: dinh-nghia
  nguon:
  - buss1989
  trich: Five predictions were made about sex differences in human mate preferences based on evolutionary conceptions of parental investment, sexual selection, human reproductive capacity
  vi_tri: Buss, tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "dùng chọn lọc tự nhiên để giải thích hành vi con người hiện đại". Chữ mới thêm chọn lọc giới tính và "đặc điểm tâm lý". Lý do: sát cách Buss dùng khung tiến hóa. Chưa mở mục từ APA Dictionary (trang không tải được).'
- id: n5
  cau: Ngành này có những nghiên cứu xuyên văn hóa ấn tượng và cũng hứng những phê bình sắc bén.
  loai: phat-hien
  nguon:
  - buss1989
  - gould1979
  trich: The 37 samples ... combined, they are the largest ever obtained on mate preferences.
  vi_tri: Buss, mục 2.1 (đoạn về mẫu)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "…hứng những phê bình sắc bén nhất trong tâm lý học". Chữ mới bỏ "nhất trong tâm lý học" vì không kiểm được xếp hạng.'
- id: n6
  cau: 'Năm 1859, Darwin xuất bản Nguồn gốc các loài và đề xuất chọn lọc tự nhiên: cá thể thích nghi tốt hơn với môi trường thì sống sót và sinh sản nhiều hơn, truyền đặc điểm cho đời sau.'
  loai: lich-su
  nguon:
  - buss1989
  - gould1979
  trich: Individuals lacking favored characteristics tend to become no one's ancestors
  vi_tri: Buss, mục 1 (dẫn Darwin 1859; 1871)
  ket_qua: dung
  ghi_chu: 'Sách Darwin (1859) không đọc được: chỉ là nguồn phụ; Buss dẫn Darwin 1859, 1871 cho chọn lọc tự nhiên và giới tính, Gould & Lewontin nói tới "natural selection as an optimizing agent". Định nghĩa phổ thông của chọn lọc tự nhiên.'
- id: n7
  cau: Một số đặc điểm dường như không giúp sống sót, như đuôi công rực rỡ.
  loai: lich-su
  nguon:
  - buss1989
  trich: who is differentially excluded from and included in mating (Darwin 1871)
  vi_tri: Buss, mục 1
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "dường như... vô dụng cho sinh tồn: đuôi công rực rỡ (nặng nề, dễ bị thú dữ phát hiện), sừng hươu khổng lồ". Chữ mới bỏ chi tiết (nặng nề, bị thú dữ phát hiện, sừng hươu) vì nguồn đã mở không có.'
- id: n8
  cau: 'Darwin đề xuất chọn lọc giới tính trong Nguồn gốc con người (1871): một số đặc điểm tiến hóa vì giúp thu hút bạn tình hoặc đánh bại đối thủ cùng giới.'
  loai: lich-su
  nguon:
  - buss1989
  trich: Favored mate characteristics that show some heritability will typically be represented more frequently in subsequent generations.
  vi_tri: Buss, mục 1 (dẫn Darwin 1871); từ khóa "intrasexual competition" ở phần thảo luận
  ket_qua: dung
  ghi_chu: Nguồn phụ (Darwin 1871 là sách, không đọc được). "Đánh bại đối thủ cùng giới" khớp "human intrasexual competition" trong phần thảo luận của Buss.
- id: n9
  cau: 'Hơn một thế kỷ sau, các nhà tâm lý học, trong đó có Buss, áp dụng logic này cho tâm trí: sở thích chọn bạn đời có thể phản ánh áp lực chọn lọc tổ tiên từng chịu; một số người cho rằng một số hành vi là "phần mềm cũ chạy trên phần cứng mới" (cách nói ví von).'
  loai: lich-su
  nguon:
  - buss1989
  trich: current mate preferences may reflect prior selection pressures
  vi_tri: Buss, mục 1
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: danh sách Cosmides, Tooby, Buss; "não là tập hợp mô-đun... như ghen tuông, sợ rắn, thèm đồ ngọt"; "thèm đồ ngọt vốn là thích nghi, nay thành béo phì". Chữ mới: chỉ ví dụ chọn bạn đời của Buss, có ghi rõ là cách nói ví von. Lý do: phần mô-đun và ví dụ đồ ngọt không có nguồn đã mở.'
- id: n10
  cau: 'Buss khảo sát 10.047 người ở 37 mẫu: phụ nữ chuộng "triển vọng tài chính" hơn nam ở 36/37 mẫu (có ý nghĩa); nam chuộng ngoại hình hơn ở cả 37/37 mẫu theo đúng chiều (34 mẫu có ý nghĩa).'
  loai: so-lieu
  nguon:
  - buss1989
  trich: In 36 of 37 samples, the predicted sex difference emerged ... All 37 samples show sex differences in the predicted direction, with 34 significant beyond the .05 level.
  vi_tri: Buss, mục 3.1 và 3.4
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "36/37 nền văn hóa; nam chuộng ngoại hình hơn ở cả 37/37". Chữ mới: đơn vị là mẫu; 37/37 là theo chiều, 34 mẫu có ý nghĩa. Lý do: Buss 3.4.'
- id: n11
  cau: 'Lý giải: vì người nữ đầu tư sinh học nhiều hơn (mang thai, nuôi con), họ kén hơn về nguồn lực nuôi con; người nam cần dấu hiệu khả năng sinh sản (trẻ, khỏe, ngoại hình).'
  loai: phat-hien
  nguon:
  - buss1989
  trich: In humans and other mammals, male parental investment tends to be less than female parental investment
  vi_tri: Buss, mục 1.1
  ket_qua: dung
  ghi_chu: Là lập luận của Buss (từ Trivers 1972), không phải kết quả đo.
- id: n12
  cau: 'Gould và Lewontin (1979) cảnh báo không phải đặc điểm nào cũng là thích nghi: nhiều thứ chỉ là sản phẩm phụ của cấu trúc (spandrel).'
  loai: lich-su
  nguon:
  - gould1979
  trich: production of non-adaptive structures by developmental correlation with selected features
  vi_tri: Tóm tắt
  ket_qua: dung
- id: n13
  cau: Tên "chuyện kể vừa vặn" (just-so stories) lấy theo tập truyện Just So Stories của Rudyard Kipling.
  loai: lich-su
  nguon:
  - gould1979
  trich: reliance upon plausibility alone as a criterion for accepting speculative tales
  vi_tri: Tóm tắt (nội dung phê bình)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…của Rudyard Kipling, 1902, chuyên bịa chuyện giải thích "vì sao voi có vòi dài"". Chữ mới bỏ năm và ví dụ. Chỗ khó: tóm tắt Gould & Lewontin không dùng cụm "just-so"; nguồn gốc tên là kiến thức văn học, chưa mở toàn văn để đối chiếu.'
- id: n14
  cau: 'Các nhà phê bình mô tả thói quen: thấy một hành vi, nghĩ ra một câu chuyện tiến hóa nghe hợp lý, rồi coi như đã giải thích xong.'
  loai: phat-hien
  nguon:
  - gould1979
  trich: proposing an adaptive story for each considered separately ... reliance upon plausibility alone as a criterion for accepting speculative tales
  vi_tri: Tóm tắt
  ket_qua: dung
  ghi_chu: Mô tả phê bình của Gould & Lewontin về "adaptationist programme".
- id: n15
  cau: Điều người ta nói mình muốn ở bạn đời hầu như không dự báo được họ thực sự có cảm tình với ai khi gặp người thật (Eastwick và Finkel, 2008, hẹn hò tốc độ).
  loai: phat-hien
  nguon:
  - eastwick2008
  trich: participants' ideal preferences, assessed before the speed-dating event, failed to predict what inspired their actual desire at the event
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "(Eastwick và cộng sự, 2014: tương quan r ≈ 0,03 — gần như bằng không)". Chữ mới: dẫn Eastwick & Finkel (2008). Lý do: r ≈ 0,03 trong tóm tắt Eastwick 2014 là chênh lệch giữa hai giới ở mức dự báo của ngoại hình và triển vọng kiếm tiền, không phải tương quan giữa tiêu chuẩn nêu ra và sự thu hút.'
- id: n16
  cau: Buss khảo sát 31 phẩm chất của bạn đời lý tưởng (18 chấm điểm, 13 xếp hạng).
  loai: so-lieu
  nguon:
  - buss1989
  trich: The third section requested subjects to rate each of 18 characteristics ... Interspersed among the 13 characteristics were the target variables
  vi_tri: Buss, mục 2.2
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "32 phẩm chất của bạn đời lý tưởng (chấm điểm + xếp hạng)". Chữ mới: 31 (18 + 13). Lý do: Buss mục 2.2.'
- id: n17
  cau: Mẫu gồm 10.047 người, 37 mẫu từ 33 nước thuộc 6 châu lục và 5 đảo.
  loai: so-lieu
  nguon:
  - buss1989
  trich: 37 samples drawn from 33 countries located on six continents and five islands (total N = 10,047)
  vi_tri: Buss, tóm tắt
  ket_qua: dung
- id: n18
  cau: Trung bình khoảng 272 người mỗi mẫu.
  loai: so-lieu
  nguon:
  - buss1989
  trich: The mean sample size for the 37 samples is 272.
  vi_tri: Buss, mục 2.1
  ket_qua: dung
- id: n19
  cau: 'Năm dự báo tiến hóa được kiểm chứng: nữ chuộng năng lực kiếm tiền và tham vọng; nam chuộng trẻ và ngoại hình; trinh tiết.'
  loai: phat-hien
  nguon:
  - buss1989
  trich: The predictions centered on how each sex valued earning capacity, ambition-industriousness, youth, physical attractiveness, and chastity.
  vi_tri: Buss, tóm tắt
  ket_qua: dung
  ghi_chu: Trên trang, "nữ chuộng... nam chuộng..." là cách tóm tắt năm dự báo; dự báo trinh tiết là nam coi trọng hơn nữ (Buss mục 1.1).
- id: n20
  cau: Nhóm còn thu thập tuổi kết hôn thực tế ở 27 nước để kiểm chứng chéo.
  loai: phat-hien
  nguon:
  - buss1989
  trich: For 27 countries, demographic data on actual age at marriage provided a validity check on questionnaire data.
  vi_tri: Buss, tóm tắt
  ket_qua: dung
- id: n21
  cau: Nữ đánh giá "triển vọng tài chính tốt" cao hơn nam ở 36/37 mẫu có ý nghĩa thống kê; ngoại lệ duy nhất là mẫu Tây Ban Nha (cùng chiều nhưng chưa có ý nghĩa).
  loai: so-lieu
  nguon:
  - buss1989
  trich: The sole exception was the sample from Spain, which showed the predicted direction of the sex difference, but not significantly so.
  vi_tri: Buss, mục 3.1
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "ở 36/37 nền văn hóa (ngoại lệ duy nhất: Tây Ban Nha)". Chữ mới thêm "mẫu", "có ý nghĩa thống kê", và nói Tây Ban Nha cùng chiều. Lý do: Buss 3.1.'
- id: n22
  cau: Nam đánh giá "ngoại hình" cao hơn nữ ở cả 37/37 mẫu theo đúng chiều, 34 mẫu có ý nghĩa thống kê.
  loai: so-lieu
  nguon:
  - buss1989
  trich: All 37 samples show sex differences in the predicted direction, with 34 significant beyond the .05 level.
  vi_tri: Buss, mục 3.4
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "ở cả 37/37". Chữ mới thêm "theo đúng chiều" và 34 mẫu có ý nghĩa. Lý do: Buss 3.4 (Ấn Độ, Ba Lan, Thụy Điển không có ý nghĩa ở thang chấm điểm).'
- id: n23
  cau: Nam muốn bạn đời trẻ hơn, nữ muốn bạn đời lớn tuổi hơn, ở cả 37 mẫu; khớp với tuổi kết hôn thực tế (chú rể 28,2; cô dâu 25,3).
  loai: so-lieu
  nguon:
  - buss1989
  trich: Both preferred age of marriage and preferred mate age correspond closely in absolute value to the actual mean ages of grooms (28.2) and brides (25.3).
  vi_tri: Buss, mục 3.2 và 3.2 (kiểm chứng tuổi kết hôn)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "cả hai giới đều muốn người chồng lớn tuổi hơn vợ". Chữ mới nói rõ nam muốn bạn đời trẻ hơn (2,66 năm), nữ muốn lớn tuổi hơn (3,42 năm). Lý do: Buss 3.2.'
- id: n24
  cau: '"Tham vọng, siêng năng": nữ cao hơn nam theo đúng chiều ở 34/37 mẫu (29 mẫu có ý nghĩa); ba mẫu (Colombia, Tây Ban Nha, Zulu) có chiều ngược lại, chỉ mẫu Zulu có ý nghĩa.'
  loai: so-lieu
  nguon:
  - buss1989
  trich: Three samples - Colombian, Spanish, and South African Zulu - show the opposite sex difference, significant only in the Zulu sample.
  vi_tri: Buss, mục 3.3
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "nữ cao hơn ở 34/37 (ngoại lệ: người Zulu ở Nam Phi)". Chữ mới: ba ngoại lệ, 29 mẫu có ý nghĩa. Lý do: Buss 3.3.'
- id: n25
  cau: 'Trinh tiết là tiêu chí biến thiên văn hóa nhất, và chỉ 23/37 mẫu có khác biệt giới có ý nghĩa: các mẫu Trung Quốc, Ấn Độ, Indonesia, Iran, Đài Loan đánh giá rất cao; Thụy Điển, Na Uy, Phần Lan, Hà Lan, Tây Đức, Pháp coi là không liên quan hay không quan trọng.'
  loai: so-lieu
  nguon:
  - buss1989
  trich: chastity shows greater cross-cultural variability than any other rated variable in this study
  vi_tri: Buss, mục 3.5 và mục 4
  ket_qua: da-sua
