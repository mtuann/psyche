    trich: We mapped changes in affective orofacial reactions of "liking"/"disliking" elicited by sucrose or quinine tastes after D-Ala2-N-Me-Phe4-Glycol5-enkephalin (DAMGO) microinjections in rats
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "vào từng điểm nhỏ trong nhân accumbens". Chữ mới thêm "vỏ giữa" và lượng ăn. DAMGO là chất kích hoạt thụ thể μ-opioid: kiến thức dược học chung. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp tóm tắt Peciña & Berridge 2005 (PMC6726018): DAMGO vi tiêm vào vỏ giữa, "liking"/"disliking" với sucrose, quinine.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/16354936/" ]
    luot_2_ghi_chu: Khớp.
