    cau: Fiorillo và cộng sự (2003) ghi neuron dopamine với các tín hiệu báo trước những xác suất phần thưởng khác nhau.
    loai: phat-hien
    nguon:
      - fiorillo2003
    trich: Using distinct stimuli to indicate the probability of reward
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Vẫn ghi neuron dopamine trên khỉ". Chữ mới bỏ "trên khỉ" vì tóm tắt không nêu loài (chỗ khó). Review (Claude Sonnet 5.5, 10/11/2026): dung. Tóm tắt Fiorillo không nêu loài; trang không ghi loài ở thiết kế (chỉ ghi "ở động vật" trong khung đang tranh cãi cũ, nay là khung chú ý). Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/12649484/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
