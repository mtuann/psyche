- id: n53
  cau: Cụm từ "hormone hạnh phúc" xuất hiện trong các nội dung sức khỏe tiếng Việt, nơi dopamine được liệt kê cùng serotonin, endorphin, oxytocin (ví dụ bài Vinmec viết dopamine "giúp cảm thấy dễ chịu"), một cách mô tả không phân biệt "muốn" với "thích".
