    vi_tri: Berridge & Robinson, tóm tắt; Schultz 2016
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ba khung lý thuyết dưới đây không mâu thuẫn nhau". Chữ mới nêu chỗ không khớp. Lý do: Berridge & Robinson 1998 nói thẳng "no" cho vai trò trong hedonic reward learning. Chỗ khó. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp: B&R 1998 nói dopamine không cần cho học liên hệ khoái cảm; Schultz mô tả dopamine như tín hiệu dạy học: nói "không hoàn toàn khớp" là đúng mức.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9858756/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4826767/" ]
    luot_2_ghi_chu: "Khớp: hai khung chưa khớp nhau."
    review: dung
  - id: n44
    cau: Theo Peciña và Berridge, hệ opioid tại một điểm nóng rất nhỏ trong nhân accumbens của chuột khuếch đại cái "thích" với vị ngọt ("lớp sơn khoái cảm" là ẩn dụ của trang).
    loai: phat-hien
    nguon:
      - pecina2005
    trich: Our maps indicate that opioid-induced increases in sucrose hedonic impact are generated by a localized cubic millimeter site
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Khoái cảm thật sự — liking — được tạo ra bởi hệ opioid tại những "điểm nóng"... Dopamine không cầm cọ vẽ này." Chữ mới bỏ câu cuối và nói là kết quả ở chuột. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp Peciña & Berridge 2005; "lớp sơn khoái cảm" là ẩn dụ của trang, đã ghi.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/16354936/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n45
    cau: 'Ghép lại, theo các khung này (và còn tranh luận): dopamine liên quan đến việc muốn theo đuổi và có thể đến việc học xem thứ gì đáng theo đuổi; ở chuột, opioid khuếch đại cái thích.'
    loai: phat-hien
    nguon:
      - berridge1998
      - schultz2016
      - pecina2005
    trich: dopamine may be more important to incentive salience
    vi_tri: Berridge & Robinson, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "dopamine giúp bạn học cái gì đáng theo đuổi và muốn theo đuổi nó; opioid cho bạn thích nó khi đã có trong tay... người ta lẫn lộn ba việc này thành một". Chữ mới thận trọng, ghi "còn tranh luận". Review (Claude Sonnet 5.5, 10/11/2026): dung. Câu cuối "có thể ra đời vì lẫn lộn những việc này" là suy đoán có hạn định ("có thể"); chấp nhận.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9858756/", "https://pubmed.ncbi.nlm.nih.gov/16354936/", "https://pubmed.ncbi.nlm.nih.gov/9054347/" ]
    luot_2_ghi_chu: Câu đã ghi 'còn tranh luận', 'ở chuột'.
    review: dung
  - id: n46
    cau: 'Từ nghiên cứu ở động vật của Fiorillo và cộng sự (2003), trong đó hoạt động dopamine tăng dần theo mức không chắc chắn của phần thưởng, đến hành vi dùng điện thoại là một bước suy đoán.'
    loai: phat-hien
    nguon:
      - fiorillo2003
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: nhãn khá vững; "thí nghiệm của Fiorillo cho thấy sự không chắc chắn duy trì hoạt động dopamine cho đến phút quyết định. Hiểu điều này giúp bạn tập trung vào... thiết kế môi trường". Chữ mới: "nghiên cứu ở động vật", "bước suy đoán", lời khuyên đổi môi trường thành "hướng thử, không phải khuyến nghị đã kiểm chứng". Lý do: khẳng định quá sức nguồn. Review (Claude Sonnet 5.5, 10/11/2026): sai. Chip Đang tranh cãi không hợp mục 4 (xem n39) và đặt trên một lời khuyên. Đã bỏ chip (giữ id cũ) và đổi loại: câu này chỉ nói đó là suy đoán từ nghiên cứu ở động vật.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/35933619/", "https://pubmed.ncbi.nlm.nih.gov/42946727/" ]
    luot_2_ghi_chu: Hợp 'tranh cãi'; cách nghĩ về lịch thưởng biến đổi là giả thuyết.
    review: sai
  - id: n47
    cau: 'Bạn có thể thử đổi môi trường (tắt thông báo, để điện thoại xa tầm tay): một thử nghiệm trên 221 người trưởng thành, mỗi người một tuần bật và một tuần tắt thông báo, thấy họ tự báo cáo ít mất tập trung và ít tăng động hơn ở tuần tắt (Kushlev và cộng sự, 2016); thử nghiệm không đo dopamine và không bàn về nghiện.'
    loai: loi-khuyen
    nguon:
      - kushlev2016
    ket_qua: da-sua
    ghi_chu: 'Không có nguồn kiểm chứng hiệu quả; trang ghi rõ không phải khuyến nghị đã kiểm chứng, nhãn tranh-cai. Chỗ khó: thiếu nguồn thực nghiệm về tắt thông báo (chưa tìm). Review (Claude Sonnet 5.5, 10/11/2026): sai (không nguồn). Lời khuyên "tắt thông báo, để điện thoại xa tầm tay" chưa có nguồn thực nghiệm (hồ sơ lượt 1 tự ghi). Tìm thấy Kushlev, Proulx & Dunn (2016, CHI): 221 người, một tuần bật thông báo (điện thoại trong tầm tay) và một tuần tắt (điện thoại xa tầm tay); khi bật, họ tự báo cáo mất tập trung và tăng động nhiều hơn. Chỉ có tóm tắt (Crossref, OpenAlex); thông báo trong trang nói rõ không đo dopamine. Đã viết lại và đổi "không phải khuyến nghị đã kiểm chứng" thành "không phải khuyến nghị về dopamine".'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/35600564/" ]
    luot_2_ghi_chu: Câu đã ghi 'một hướng thử, không phải khuyến nghị đã kiểm chứng'; thử nghiệm nhỏ (N=51, N=70).
    review: sai
    trich: Participants reported higher levels of inattention and hyperactivity when alerts were on than when alerts were off.
    vi_tri: Kushlev, Proulx & Dunn 2016, tóm tắt (Crossref/OpenAlex)
  - id: n48
    cau: 'Bài tập tự hỏi "mình thực sự sẽ thích nó, hay chỉ đang muốn nó?" dựa trên khung wanting/liking ở chuột; chúng tôi không có nghiên cứu nào kiểm chứng riêng bài tập này.'
    loai: loi-khuyen
    nguon:
      - berridge1998
      - pecina2005
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: nhãn "vững chắc"; "hãy nhận diện: đó là wanting đang lái xe... Câu hỏi đơn giản này đưa hệ "muốn" tự động ra ánh sáng của ý thức". Chữ mới: nhãn khá vững; "có thể thử hình dung (ví von)"; bỏ câu "đưa hệ muốn ra ánh sáng của ý thức". Review (Claude Sonnet 5.5, 10/11/2026): sai. Chip Khá vững đặt trên một bài tập mà thân mục tự nói không có nghiên cứu kiểm chứng: mâu thuẫn. Đã bỏ chip (giữ id cũ); câu nay nói đúng mức: dựa trên khung ở chuột, chưa có nghiên cứu riêng cho bài tập. Loại lời khuyên giữ, có nguồn của khung (Berridge & Robinson 1998, Peciña & Berridge 2005).'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9858756/", "https://pubmed.ncbi.nlm.nih.gov/16354936/", "https://pubmed.ncbi.nlm.nih.gov/29760524/" ]
    luot_2_ghi_chu: "'Khá vững' vừa mức: nhiều thí nghiệm chuột, ít bằng chứng ở người, còn tranh luận."
    review: sai
  - id: n49
    cau: 'Tắt thông báo và để điện thoại xa tầm tay có thể giúp một số người bớt xao lãng (Kushlev và cộng sự, 2016), nhưng nếu có, lý do không phải là "xả được dopamine", vì không có cơ chế nào như vậy được nêu; chúng tôi chưa dẫn bằng chứng về hiệu quả của việc "tạm cắt giảm hành vi cưỡng chế" nói chung, và không tìm thấy nghiên cứu nào ủng hộ các gói "reset não 7 ngày" hay bảng xếp hạng "hoạt động X tăng dopamine bao nhiêu %".'
    loai: loi-khuyen
    nguon:
      - sepah2019
      - kushlev2016
      - harvard2020
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đó là kỹ thuật kiểm soát kích thích của liệu pháp hành vi-nhận thức: giảm tiếp xúc với tín hiệu gây cám dỗ thì cám dỗ giảm. Đừng trả tiền cho các gói "reset não 7 ngày", đừng tin những bảng xếp hạng... — chúng không đo được gì cả." Chữ mới: "có thể giúp một số người", "chưa dẫn bằng chứng", "không tìm thấy nghiên cứu nào ủng hộ" gói reset và bảng xếp hạng. Review (Claude Sonnet 5.5, 10/11/2026): sai (lượt 2: qua-manh). Nhãn Đã bị bác bỏ không hợp mục 4 (xem n36); đã bỏ chip (tiêu đề không đổi). Vế "có thể giúp một số người bớt xao lãng" của câu cũ ("tạm cắt giảm hành vi cưỡng chế, ít lướt điện thoại, tắt thông báo một cuối tuần") không có nguồn: đã thu về phần có nguồn (Kushlev 2016: tắt thông báo). Không viết như lời khuyên điều trị.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://www.health.harvard.edu/blog/dopamine-fasting-misunderstanding-science-spawns-a-maladaptive-fad-2020022618917", "https://www.irishtimes.com/life-and-style/health-family/how-to-feel-nothing-now-in-order-to-feel-more-later-1.4095491" ]
    luot_2_ghi_chu: "câu đúng: Không có bằng chứng cho 'detox dopamine' theo nghĩa đen; nhãn 'bác bỏ' không đúng thước đo vì chưa có kiểm tra nào.; Cùng lý do với n36: nhãn 'bác bỏ' cao hơn thước đo vì không có thử nghiệm nào; phần 'giữ cái hữu ích' (giảm kích thích) là hướng CBT theo Harvard Health."
    review: sai
  - id: n50
    cau: 'Vì neuron dopamine phản ứng với bất ngờ và không chắc chắn (Schultz và cộng sự, 1997; Fiorillo và cộng sự, 2003, ở động vật), có thể nghĩ đến việc thiết kế phần thưởng biến đổi cho thói quen tốt; về cơ chế thì nghe hợp lý, nhưng chúng tôi chưa dẫn được bằng chứng ở người.'
    loai: phat-hien
    nguon:
      - schultz1997
      - fiorillo2003
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "bằng chứng ở người còn rất hạn chế". Chữ mới: "chưa dẫn được bằng chứng ở người". Lý do: không có nguồn đã kiểm cho "rất hạn chế". Review (Claude Sonnet 5.5, 10/11/2026): sai. Chip Đang tranh cãi không hợp mục 4 (xem n39); câu "một số người đề xuất" không gán cho ai. Đã bỏ chip (tiêu đề không đổi), bỏ "một số người đề xuất" thành "có thể nghĩ đến", dẫn Schultz 1997, Fiorillo 2003.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4826767/" ]
    luot_2_ghi_chu: "Nhãn 'tranh cãi' thận trọng: chưa có thử nghiệm về 'dùng bất ngờ có chủ ý'."
    review: sai
  - id: n51
    cau: Các thí nghiệm gốc về dopamine ở trang này chủ yếu thực hiện trên khỉ và chuột.
    loai: phat-hien
    nguon:
      - schultz1997
      - berridge1998
      - pecina2005
      - fiorillo2003
    trich: dopamine neurons ... in alert monkeys; rats were depleted of dopamine
    vi_tri: Schultz 1997; Berridge & Robinson 1998
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đều thực hiện trên khỉ và chuột trong phòng thí nghiệm phương Tây". Chữ mới: "chủ yếu"; bỏ "phương Tây" (không kiểm được nơi làm từng thí nghiệm). Ở người có ghi neuron đơn lẻ và hình ảnh não (Schultz 2016). Review (Claude Sonnet 5.5, 10/11/2026): dung. "Chủ yếu trên khỉ và chuột": Schultz 1997 (khỉ), Berridge (chuột), Fiorillo (neuron dopamine, tóm tắt không nêu loài), Peciña (chuột).'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9054347/", "https://pubmed.ncbi.nlm.nih.gov/9858756/", "https://pubmed.ncbi.nlm.nih.gov/16354936/", "https://pubmed.ncbi.nlm.nih.gov/12649484/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n52
    cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra sai số dự đoán phần thưởng hay phân biệt wanting/liking trên người Việt.
    loai: thoi-su
    nguon:
      - tim-kiem-vn
    het_han: '2028-11-01'
    ket_qua: da-sua
    ghi_chu: 'Europe PMC ngày 10/11/2026 (OpenAlex bị giới hạn lượt): 107 kết quả (dopamine AND Vietnam*...), chỉ xem năm kết quả đầu, không thấy kiểm tra riêng. Chữ cũ: không mốc, thêm "và cũng khó có, vì đây là cấp độ neuron đơn lẻ" (đã bỏ: ở người có ghi hình não và có thể có nghiên cứu hành vi). Chưa tìm Google Scholar hay tạp chí trong nước. Chỗ chưa chắc: không đọc hết các kết quả. Review (Claude Sonnet 5.5, 10/11/2026): dung. Câu thời sự có mốc "Tính đến 11/2026", het_han 2028-11-01, nguon là truy vấn Europe PMC đã mở; kiem_lai_truoc của bài (2028-05) không muộn hơn het_han. Hạn chế đã ghi (chỉ xem năm kết quả đầu).'
    luot_2: dung
    luot_2_nguon: [ "https://www.ebi.ac.uk/europepmc/webservices/rest/search?format=json&query=dopamine%20reward%20prediction%20error%20Vietnam", "https://www.ebi.ac.uk/europepmc/webservices/rest/search?format=json&query=Vietnamese%20adolescents%20reward%20fMRI%20OR%20dopamine%20wanting%20liking" ]
    luot_2_ghi_chu: Câu 'chưa tìm thấy' đúng ở ngày 2026-11-10.
    review: dung
  - id: n53
    cau: Cụm từ "hormone hạnh phúc" xuất hiện trong các nội dung sức khỏe tiếng Việt, nơi dopamine được liệt kê cùng serotonin, endorphin, oxytocin (ví dụ bài Vinmec viết dopamine "giúp cảm thấy dễ chịu"), một cách mô tả không phân biệt "muốn" với "thích".
    loai: thoi-su
    nguon:
      - vinmec
    trich: dopamine giúp cảm thấy dễ chịu, serotonin làm giảm buồn phiền chán nản, oxytocin là hormone tình yêu và endorphin
    vi_tri: Vinmec, đoạn mở đầu
    het_han: '2028-11-01'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "rất phổ biến... như một "bộ tứ" — mà không phân biệt chất dẫn truyền thần kinh với hormone... Trào lưu "detox dopamine" cũng đã lan sang các cộng đồng năng suất tiếng Việt". Chữ mới: một ví dụ có link, mốc 11/2026; bỏ câu về trào lưu detox (không tìm được nguồn tiếng Việt; tìm 10/11/2026 chủ yếu ra trang tiếng Anh) và bỏ "không phân biệt chất dẫn truyền với hormone" (Long Châu có phân biệt). Review (Claude Sonnet 5.5, 10/11/2026): dung. Vinmec mở lại 10/11/2026: "dopamine giúp cảm thấy dễ chịu, serotonin làm giảm buồn phiền chán nản, oxytocin ... endorphin ...". Câu nói "một ví dụ", mốc, het_han có.'
    luot_2: dung
    luot_2_nguon: [ "https://www.vinmec.com/vie/bai-viet/hormones-hanh-phuc-la-gi-va-lam-nao-de-tang-cuong-vi" ]
    luot_2_ghi_chu: Vinmec, mở 2026-11-10.
    review: dung
  - id: n54
    cau: '"Dopamine là hormone hạnh phúc" là ngộ nhận: dopamine chủ yếu được nghiên cứu như chất dẫn truyền thần kinh; vai trò nổi bật là báo sai số dự đoán và liên quan đến động lực; các thí nghiệm ở chuột cho thấy khoái cảm vị giác không phụ thuộc vào dopamine.'
    loai: phat-hien
    nguon:
      - schultz2016
      - berridge1998
    trich: dopamine systems are not needed either to mediate the hedonic pleasure of reinforcers
    vi_tri: Berridge & Robinson 1998, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "công việc cốt lõi... không phải tạo ra khoái cảm. Khoái cảm thuộc về hệ opioid." Chữ mới giảm xuống mức nguồn. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp Schultz 2016 và B&R 1998; trang không nói tuyệt đối.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4826767/", "https://pubmed.ncbi.nlm.nih.gov/2493791/", "https://pubmed.ncbi.nlm.nih.gov/9858756/", "https://openstax.org/books/psychology-2e/pages/3-2-cells-of-the-nervous-system" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n55
    cau: '"Càng nhiều dopamine càng hạnh phúc" là ngộ nhận: phần thưởng được dự đoán đầy đủ không làm neuron dopamine bùng phát; chuột tổn thương hệ dopamine vẫn có phản ứng thích vị ngọt gần như không đổi.'
    loai: phat-hien
    nguon:
      - schultz1997
      - berridge1989
    trich: fails to be activated by the predicted reward; Taste reactivity was essentially unchanged
    vi_tri: Schultz 1997, Hình 1; Berridge 1989, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "không kích hoạt... chút nào"; "bị phá hủy dopamine vẫn "thích" vị ngọt bình thường". Chữ mới như n4, n25. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp Schultz 1997 (Hình 1) và Berridge 1989 ("essentially unchanged").'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4826767/", "https://pubmed.ncbi.nlm.nih.gov/2493791/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n56
    cau: '"Nghiện điện thoại vì dopamine tăng quá cao" là đơn giản hóa; dopamine có thể là một mắt xích, không phải toàn bộ lời giải thích.'
    loai: loi-khuyen
    nguon:
      - schultz2016
    trich: Drugs of addiction generate, hijack, and amplify the dopamine reward signal
    vi_tri: Schultz 2016, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Dopamine là một mắt xích trong vòng lặp nghiện (cùng với thói quen, kiểm soát ức chế, thiết kế sản phẩm)". Chữ mới: "có thể là", bỏ danh sách yếu tố không có nguồn. Chỗ khó: nguồn chỉ nói về thuốc gây nghiện. Review (Claude Sonnet 5.5, 10/11/2026): dung. Ngộ nhận đã làm mềm ("đơn giản hóa", "có thể là một mắt xích"); Schultz 2016: thuốc gây nghiện tạo ra, chiếm đoạt và khuếch đại tín hiệu dopamine; không nói điện thoại.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4826767/", "https://pubmed.ncbi.nlm.nih.gov/29760524/", "https://pubmed.ncbi.nlm.nih.gov/42946727/" ]
    luot_2_ghi_chu: Câu là nhận xét thận trọng, đúng.
    review: dung
  - id: n57
    cau: '"Detox dopamine vài ngày sẽ reset não" là ngộ nhận: chúng tôi không tìm thấy cơ chế nào cho việc xả dopamine; chính người phổ biến thuật ngữ nói cái tên không nên hiểu theo nghĩa đen.'
    loai: phat-hien
    nguon:
      - sepah2019
    trich: The title's not to be taken literally.
    vi_tri: Irish Times (NYT)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chính người tạo ra thuật ngữ cũng nói nó chỉ là ẩn dụ cho một kỹ thuật hành vi cũ". Chữ mới như n38. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp n36, n38; "không tìm thấy" là mức đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://www.health.harvard.edu/blog/dopamine-fasting-misunderstanding-science-spawns-a-maladaptive-fad-2020022618917", "https://www.irishtimes.com/life-and-style/health-family/how-to-feel-nothing-now-in-order-to-feel-more-later-1.4095491" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n58
    cau: '"Vùng não sáng lên khi quét não nghĩa là người ta sướng" là suy luận ngược (reverse inference), vốn không chặt chẽ: một vùng "sáng" có thể phản ánh nhiều quá trình.'
    loai: dinh-nghia
    nguon:
      - poldrack2006
    trich: Such inferences are not deductively valid, but can still provide some information.
    vi_tri: Poldrack 2006, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "lỗi suy luận ngược: ... chứ không riêng gì khoái cảm". Chữ mới nói "không chặt chẽ" theo Poldrack 2006. Review (Claude Sonnet 5.5, 10/11/2026): dung. Poldrack 2006: suy luận ngược "not deductively valid, but can still provide some information"; trang nói "không chặt chẽ", đúng mức.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/16406760/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n59
    cau: 'Quiz 1: neuron dopamine của khỉ phản ứng mạnh nhất với phần thưởng bất ngờ, chưa được dự đoán.'
    loai: phat-hien
    nguon:
      - schultz1997
    trich: The dopamine neuron is activated by this unpredicted occurrence of juice.
    vi_tri: Schultz 1997, Hình 1
    ket_qua: dung
    ghi_chu: Lời giải thích không dựa vào vị trí lựa chọn.
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4826767/", "https://pubmed.ncbi.nlm.nih.gov/9054347/" ]
    luot_2_ghi_chu: Khớp.
  - id: n60
    cau: 'Quiz 2: phần thưởng được dự đoán nhưng không đến thì hoạt động neuron dopamine giảm xuống dưới mức nền (sai số dự đoán âm).'
    loai: phat-hien
    nguon:
      - schultz1997
      - schultz2016
    trich: show depressed activity with less reward than predicted (negative prediction error)
    vi_tri: Schultz 2016, tóm tắt
    ket_qua: dung
    ghi_chu: 'Quiz: đáp án đúng "giảm xuống dưới mức nền (sai số dự đoán âm)": nguồn dùng "depressed activity"; chấp nhận "dưới mức nền" ở mức quiz, giữ nguyên chữ vì khớp nghĩa "ức chế" ở n18.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4826767/" ]
    luot_2_ghi_chu: Khớp.
  - id: n61
    cau: 'Quiz 3: thí nghiệm 6-OHDA (1989): chuột bị tổn thương dopamine không còn tự ăn nhưng phản ứng miệng-mặt với vị ngọt gần như không đổi; các tác giả dùng làm lập luận tách wanting khỏi liking.'
    loai: phat-hien
    nguon:
      - berridge1989
    trich: Taste reactivity was essentially unchanged.
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chứng minh... hoàn toàn bình thường... Đây là bằng chứng tách rời". Chữ mới theo n25, n26. Lời giải thích không dựa vào vị trí lựa chọn. Review (Claude Sonnet 5.5, 10/11/2026): dung. Quiz 3 khớp n24–n26; lời giải thích không dựa vào vị trí lựa chọn.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/2493791/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n62
    cau: 'Quiz 4: câu hỏi "Vì sao trang này nói không có cơ sở khoa học cho detox dopamine theo nghĩa đen?"; đáp án đúng: không có cơ chế hay nghiên cứu nào cho thấy xả được dopamine, Sepah nói tên không nên hiểu theo nghĩa đen; giải thích: Parkinson liên quan mất neuron dopamine; tắt thông báo có thể giúp một số người bớt xao lãng (Kushlev 2016) nhưng không phải vì "reset dopamine".'
    loai: phat-hien
    nguon:
      - sepah2019
      - kalia2015
      - kushlev2016
    trich: The title's not to be taken literally.
    vi_tri: Irish Times; Kalia & Lang
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ có "kỹ thuật kiểm soát kích thích của CBT" và "thiếu nó trầm trọng là bệnh Parkinson, không phải tập trung cao độ". Chữ mới như n36, n49. Review (Claude Sonnet 5.5, 10/11/2026): sai (phụ thuộc n36, n49). Câu hỏi cũ "bị coi là sai về mặt khoa học" và lời giải thích "cắt giảm bớt hành vi cưỡng chế có thể có ích với một số người" không còn khớp với trang sau khi bỏ nhãn Bác bỏ và thu vế lời khuyên về phần có nguồn. Đã sửa câu hỏi và lời giải thích; lời giải thích không dựa vào vị trí lựa chọn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.health.harvard.edu/blog/dopamine-fasting-misunderstanding-science-spawns-a-maladaptive-fad-2020022618917", "https://www.irishtimes.com/life-and-style/health-family/how-to-feel-nothing-now-in-order-to-feel-more-later-1.4095491", "https://pubmed.ncbi.nlm.nih.gov/25904081/" ]
    luot_2_ghi_chu: Khớp; 'cắt giảm hành vi cưỡng chế có ích' hợp hướng CBT trong Harvard Health.
    review: sai
  - id: n63
    cau: 'Quiz 5: Peciña và Berridge (2005): phản ứng "thích" tăng ở một điểm nóng khoảng 1 mm³, trong khi ở mọi vùng của vỏ giữa chuột ăn nhiều hơn; nghiên cứu không đo dopamine.'
    loai: phat-hien
    nguon:
      - pecina2005
    trich: Opioid circuits for stimulating food intake are widely distributed, whereas hedonic "liking" circuits are more tightly localized
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "tăng gấp khoảng bốn lần... Khoái cảm là việc của opioid, không phải dopamine". Chữ mới như n30, n31. Câu hỏi đổi hẳn để hết "gấp bốn lần". Lời giải thích không dựa vào vị trí lựa chọn. Review (Claude Sonnet 5.5, 10/11/2026): dung. Quiz 5 khớp n30, n31; lời giải thích không dựa vào vị trí lựa chọn.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/16354936/" ]
    luot_2_ghi_chu: Khớp; tóm tắt không có phép đo dopamine.
    review: dung
  - id: n64
    cau: 'Đọc thêm: link tới thuong-va-dong-luc ("khi nào phần thưởng làm xói mòn hứng thú") và cam-xuc-co-ban ("Ekman, các cảm xúc cơ bản và tranh luận về nét mặt").'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Đã kiểm: các trang /kham-pha/cam-xuc-dong-luc/... chưa có trong src/content/docs (chưa chuyển); link chưa chạy cho đến khi có trang. Ghi cho người giao. Review (Claude Sonnet 5.5, 10/11/2026): sai (mô tả). Cả hai id có trong trang.yml; trang chưa chuyển nên thành chữ "sắp có", tự thành link khi trang lên. Mô tả cũ của cam-xuc-co-ban "''thích'' và ''muốn'' trong cảm xúc" không đúng với trang đích (trang cũ nói về Ekman 1969, 6 cảm xúc cơ bản, phê bình của Barrett; không có chữ "muốn" hay "dopamine"). Đã đổi mô tả hai link theo mô tả trang đích.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Loại ve-site: không qua lượt 2 (review kiểm thẳng trên trang)."
    review: sai
  - id: n65
    cau: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên trang: có ::tom-tat. Review (Claude Sonnet 5.5, 10/11/2026): dung. Loại ve-site đúng; trang có ::tom-tat dưới frontmatter, dựng từ ý chính của khung nhãn (nay: hai khung Khá vững).'
    luot_2: khong-chac
    luot_2_ghi_chu: "Loại ve-site: không qua lượt 2 (review kiểm thẳng trên trang)."
    review: dung
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: 'Schultz, Dayan và Montague (1997): "ghi hoạt động... ánh đèn"; "giảm xuống dưới mức nền"'
    moi: Bài tổng hợp ghi chép và mô hình TD; "kích thích thị giác"; "bị ức chế"
    ly_do: Hồ sơ n15, n18.
  - cu: 'Peciña và Berridge (2005): "tăng gấp khoảng bốn lần", "dopamine đứng ngoài câu chuyện"'
    moi: Bỏ "gấp bốn lần"; "nghiên cứu này không đo dopamine"
    ly_do: Hồ sơ n30, n31, n63.
  - cu: Khung "vững chắc" cho phân biệt muốn (dopamine) và thích (opioid)
    moi: Khung "khá vững"
    ly_do: Hồ sơ n35 (thước đo mục 4).
  - cu: 'Detox: "nhà tâm lý học Cameron Sepah... kỹ thuật kiểm soát kích thích của CBT"'
    moi: Trích lời Sepah qua NYT (Irish Times); bỏ phần CBT; "chúng tôi không tìm thấy cơ chế"
    ly_do: Hồ sơ n36, n38, n49, n57, n62.
  - cu: 'Áp dụng 1 và 2: nhãn khá vững / vững chắc; "hãy nhận diện", "tập trung vào thiết kế môi trường"'
    moi: 'Áp dụng 1: đang tranh cãi, "hướng thử"; Áp dụng 2: khá vững, "có thể thử hình dung"'
    ly_do: Hồ sơ n46, n47, n48.
  - cu: 'Olds và Milner: "hộp Skinner", "thường xuyên và đều đặn trong thời gian dài", "công chúng ghép nối"'
    moi: Theo Schultz (2016) kể lại; bỏ các chi tiết
    ly_do: Hồ sơ n11–n14.
  - cu: Ba khung "không mâu thuẫn nhau"
    moi: '"không hoàn toàn khớp nhau"'
    ly_do: Hồ sơ n43.
  - cu: 'Việt Nam: không mốc; "cũng khó có"; "detox đã lan sang các cộng đồng năng suất tiếng Việt"'
    moi: '"Tính đến 11/2026"; ví dụ Vinmec; bỏ câu về trào lưu detox'
    ly_do: Hồ sơ n52, n53.
  - cu: 'Khung Vững chắc: "neuron dopamine mã hóa sai số dự đoán phần thưởng"; "hàng trăm nghiên cứu ghi hình não ... theo một phân tích tổng hợp"'
    moi: Khung Khá vững, kèm lý do; "một phân tích tổng hợp 35 nghiên cứu fMRI ở người ... thể vân là vùng chính (Garrison 2013)"
    ly_do: Review, hồ sơ n32 (mục 4 cần tổng hợp riêng cho khẳng định), n34 (lượt 2 sai).
  - cu: "Khung Đã bị bác bỏ: \"'detox dopamine' theo nghĩa đen\""
    moi: "Aside :::note \"Không có cơ chế, không có bằng chứng: 'detox dopamine' theo nghĩa đen\" (không nhãn), thêm Harvard Health 2020; Mô tả frontmatter đổi theo; Áp dụng 3 bỏ chip Bác bỏ"
    ly_do: Review, hồ sơ n36, n49 (lượt 2 qua-manh; không có kiểm tra thất bại).
  - cu: "Khung Đang tranh cãi: \"dopamine có phải 'thủ phạm' gây nghiện mạng xã hội và game gacha không\"; chip Đang tranh cãi ở Áp dụng 1 và 4; chip Khá vững ở Áp dụng 2"
    moi: 'Aside :::note "Chưa đủ bằng chứng: ..."; bỏ ba chip (id tiêu đề giữ nguyên)'
    ly_do: Review, hồ sơ n39, n46, n48, n50 (không hợp mục 4).
  - cu: 'Kết quả Olds & Milner: "Chuột nhấn cần nhiều hơn ... đến mức quên ăn uống một lúc (theo Schultz, 2016; bài gốc ...)"'
    moi: '"Theo cách Schultz (2016) kể lại, ở một số vùng chuột nhấn cần nhiều hơn ..."'
    ly_do: Review, hồ sơ n12.
  - cu: 'Áp dụng 1: "... bạn có thể thử đổi môi trường (tắt thông báo, để điện thoại xa tầm tay)" không nguồn; Áp dụng 3: "tạm cắt giảm các hành vi cưỡng chế ... có thể giúp một số người bớt xao lãng"; Áp dụng 4: "một số người đề xuất"'
    moi: 'Thêm Kushlev 2016 (221 người, tuần bật và tuần tắt thông báo); Áp dụng 3 thu về "tắt thông báo và để điện thoại xa tầm tay"; Áp dụng 4: "có thể nghĩ đến" kèm Schultz 1997, Fiorillo 2003'
    ly_do: Review, hồ sơ n47, n49, n50.
  - cu: 'Quiz 4: "Vì sao detox dopamine theo nghĩa đen bị coi là sai về mặt khoa học?"; giải thích "Cắt giảm bớt hành vi cưỡng chế có thể có ích với một số người"'
    moi: '"Vì sao trang này nói không có cơ sở khoa học cho detox dopamine theo nghĩa đen?"; giải thích dẫn Kushlev 2016 cho tắt thông báo'
    ly_do: Review, hồ sơ n62.
  - cu: 'Mở bài: "Trong các lời khuyên sức khỏe, dopamine thường được xếp vào nhóm hormone hạnh phúc"; hai câu trích không ghi là minh họa'
    moi: '"Hai câu giả định, kiểu lời khuyên về dopamine: ... Trong một số nội dung sức khỏe, dopamine được xếp vào nhóm ..."'
    ly_do: Review, hồ sơ n1, n2.
  - cu: "Đọc thêm: cam-xuc-co-ban \"'thích' và 'muốn' trong cảm xúc\"; thuong-va-dong-luc \"phần thưởng ảnh hưởng động lực ra sao\""
    moi: 'cam-xuc-co-ban: "Ekman, các cảm xúc cơ bản và tranh luận về nét mặt"; thuong-va-dong-luc: "khi nào phần thưởng làm xói mòn hứng thú"'
    ly_do: Review, hồ sơ n64 (mô tả không đúng trang đích).
