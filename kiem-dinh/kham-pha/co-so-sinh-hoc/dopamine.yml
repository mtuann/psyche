    cau: 'Có một đáp ứng mới: hoạt động tăng dần cho đến thời điểm phần thưởng có thể đến, tăng theo mức không chắc chắn, lớn nhất ở xác suất 50%.'
    loai: phat-hien
    nguon:
      - fiorillo2003
    trich: a previously unobserved response covaried with uncertainty and consisted of a gradual increase in activity until the potential time of reward ... maximal at P = 0.5
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "tăng dần, duy trì ... mạnh nhất khi xác suất là 50%". Chữ mới: "tăng theo mức không chắc chắn, lớn nhất ở 50%". Lý do: "duy trì" và "mạnh nhất" không phải lời của tóm tắt; cực đại là của độ không chắc chắn. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp tóm tắt: "a gradual increase in activity until the potential time of reward", "maximal at P = 0.5" (mô tả mức không chắc chắn, không phải mức hoạt động).'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/12649484/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
