    cau: 'Ba khung trả lời ba câu hỏi khác nhau nhưng không hoàn toàn khớp: Berridge và Robinson (1998) kết luận dopamine không cần cho học liên hệ khoái cảm, còn Schultz mô tả dopamine như tín hiệu dạy học.'
