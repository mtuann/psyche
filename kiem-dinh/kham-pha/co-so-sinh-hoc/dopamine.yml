    cau: Chỉ ở một điểm nóng khoảng 1 mm³ ở vùng trước-lưng của vỏ giữa, DAMGO làm tăng phản ứng "thích" với vị ngọt; ở mọi vùng của vỏ giữa, DAMGO đều làm chuột ăn nhiều hơn.
    loai: so-lieu
    nguon:
      - pecina2005
    trich: opioid-induced increases in sucrose hedonic impact are generated by a localized cubic millimeter site in a rostrodorsal region of the medial shell. In contrast, all regions of the medial shell generated DAMGO-induced robust increases in eating behavior and food intake.
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "phản ứng "thích" tăng gấp khoảng bốn lần bình thường. Ở các điểm xung quanh... không tăng "thích"". Chữ mới bỏ "gấp bốn lần" (tóm tắt không nêu; toàn văn không mở được) và nói đủ phạm vi. Review (Claude Sonnet 5.5, 10/11/2026): dung. "a localized cubic millimeter site in a rostrodorsal region of the medial shell"; "all regions of the medial shell generated DAMGO-induced robust increases in eating". Khớp; không còn "gấp bốn lần".'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/16354936/" ]
    luot_2_ghi_chu: "Khớp: 'vùng trước-lưng' = rostrodorsal; 1 mm³ = cubic millimeter."
    review: dung
  - id: n31
    cau: Theo các tác giả, mạch opioid kích thích ăn phân bố rộng, còn mạch "thích" khu trú hơn nhiều; nghiên cứu này không đo dopamine.
    loai: phat-hien
    nguon:
      - pecina2005
    trich: Opioid circuits for stimulating food intake are widely distributed, whereas hedonic "liking" circuits are more tightly localized in the rostromedial shell of the nucleus accumbens.
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Khoái cảm thật sự được tạo ra bởi hệ opioid — dopamine đứng ngoài câu chuyện này." Chữ mới theo tóm tắt. Lý do: nghiên cứu không đo dopamine nên không nói được "đứng ngoài". Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp: "Opioid circuits for stimulating food intake are widely distributed, whereas hedonic liking circuits are more tightly localized"; nghiên cứu không đo dopamine.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/16354936/" ]
    luot_2_ghi_chu: Khớp tóm tắt.
    review: dung
  - id: n32
    cau: 'Khá vững: neuron dopamine mã hóa sai số dự đoán phần thưởng.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - schultz2016
      - garrison2013
      - schultz1997
    ly_do: 'Nhiều nghiên cứu cùng chiều nhiều thập kỷ ở khỉ, chuột và (ghi neuron đơn lẻ, ghi hình) ở người; tổng quan của Schultz 2016. Nhưng thước đo mục 4 cho Vững chắc đòi phân tích tổng hợp hay tổng quan hệ thống chất lượng tốt cho chính khẳng định: Garrison 2013 là phân tích tổng hợp 35 nghiên cứu fMRI về não (không đo dopamine), còn Schultz 2016 là tổng quan kể; bằng chứng về neuron chủ yếu ở động vật; chưa tái lập lớn có đăng ký trước.'
    nguon:
      - schultz2016
      - garrison2013
      - schultz1997
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đã được tái lập rộng rãi... Phát hiện của Schultz và cộng sự (1997)". Chữ mới: "Mẫu hình... đã được thấy lại", thêm Garrison 2013 và nói ghi hình não không đo riêng dopamine. Lý do: kể rõ giới hạn. Review (Claude Sonnet 5.5, 10/11/2026): sai (sát ranh). Lượt 2 cho dung "nhẹ". Đối chiếu mục 4: Vững chắc cần ít nhất một phân tích tổng hợp hay tổng quan hệ thống chất lượng tốt cho khẳng định; ở đây không có cái nào về hoạt động neuron dopamine. Hạ xuống Khá vững; thân khung nay nói rõ lý do. Lõi RPE vẫn rất vững ở mức nghiên cứu cơ bản (nhiều phòng thí nghiệm, nhiều loài). Nếu người gom nhận ngành thần kinh học là chuẩn khác, có thể đưa lại Vững chắc: sửa :::kha-vung thành :::vung-chac, và mở lại hồ sơ.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4826767/", "https://pubmed.ncbi.nlm.nih.gov/23567522/", "https://pubmed.ncbi.nlm.nih.gov/29760524/" ]
    luot_2_ghi_chu: Nhiều phòng thí nghiệm, nhiều loài; có tổng quan và phân tích tổng hợp fMRI; còn tranh luận về vai trò rộng hơn (Berke 2018) nhưng lõi RPE vững. Mức 'vững chắc' chấp nhận được, nhẹ.
    review: sai
  - id: n33
    cau: Tổng quan của chính Schultz (2016) kết luận rằng hầu hết neuron dopamine ở não giữa của người, khỉ và động vật gặm nhấm đều báo hiệu sai số dự đoán phần thưởng.
    loai: phat-hien
    nguon:
      - schultz2016
    trich: Most dopamine neurons in the midbrain of humans, monkeys, and rodents signal a reward prediction error
    vi_tri: Schultz 2016, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: dấu trích dẫn Việt hóa "hầu hết neuron...". Chữ mới bỏ dấu trích (là bản dịch). Review (Claude Sonnet 5.5, 10/11/2026): dung. Schultz 2016, tóm tắt: "Most dopamine neurons in the midbrain of humans, monkeys, and rodents signal a reward prediction error"; trang khớp (bản dịch, không để trong dấu trích).'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4826767/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n34
    cau: Một phân tích tổng hợp 35 nghiên cứu fMRI ở người (446 điểm tọa độ) thấy tín hiệu sai số dự đoán ở nhiều vùng não, trong đó thể vân là vùng chính (Garrison và cộng sự, 2013); ghi hình não không đo riêng dopamine.
    loai: so-lieu
    nguon:
      - schultz2016
      - garrison2013
    trich: This added another 7 studies making a total of 35 whole-brain activation studies ... a total of 446 foci identified across the 35 studies. // The striatum was the key brain area encoding for prediction error
    vi_tri: 'Garrison 2013, bản tác giả (uhra.herts.ac.uk/id/eprint/3623): mục 2.1, 2.2, Table 1 (35 nghiên cứu, 446 foci); tóm tắt (striatum)'
    ket_qua: da-sua
    ghi_chu: 'Mới thêm cho khung n32. Review (Claude Sonnet 5.5, 10/11/2026): sai (lượt 2: sai). Garrison 2013 gồm 35 nghiên cứu fMRI với 446 điểm tọa độ (đã đọc bản tác giả), không phải "hàng trăm nghiên cứu"; "hàng trăm" là lời của Schultz 2016 ("hundreds of human neuro imaging studies") và là ước lượng của ông, không phải phân tích tổng hợp. Chữ cũ: "Hàng trăm nghiên cứu ghi hình não ở người cho thấy ... trong đó thể vân là vùng chính theo một phân tích tổng hợp (Garrison)". Đã viết lại theo Garrison.'
    luot_2: sai
    luot_2_nguon: [ "https://uhra.herts.ac.uk/id/eprint/3623/2/904929.pdf", "https://pubmed.ncbi.nlm.nih.gov/23567522/" ]
    luot_2_ghi_chu: "câu đúng: Phân tích tổng hợp của Garrison và cộng sự (2013) gồm 35 nghiên cứu ghi hình não ở người, cho thấy thể vân là vùng chính mã hóa sai số dự đoán.; Không phải 'hàng trăm' nghiên cứu: phân tích tổng hợp Garrison dùng 35 nghiên cứu fMRI; thể vân là vùng chính (đúng)."
    review: sai
  - id: n35
    cau: 'Khá vững: phân biệt "muốn" (dopamine) và "thích" (opioid).'
    loai: nhan
    nhan: kha-vung
    co_so:
      - berridge1989
      - berridge1998
      - pecina2005
    ly_do: Nhiều thí nghiệm ở chuột cùng chiều, nhưng chủ yếu từ một nhóm nghiên cứu; chưa dẫn được bằng chứng trực tiếp ở người; chưa có phân tích tổng hợp hay tái lập lớn; một mâu thuẫn nhỏ trong chính khung là Berridge và Robinson 1998 nói dopamine không cần cho học liên hệ khoái cảm, còn Schultz 2016 mô tả dopamine như tín hiệu dạy học.
    nguon:
      - berridge1989
      - berridge1998
      - pecina2005
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: nhãn "vững chắc", "chứng minh nhất quán", "gấp nhiều lần", "khung chuẩn trong nghiên cứu nghiện hiện nay". Chữ mới: "khá vững", nói rõ giới hạn; bỏ "khung chuẩn trong nghiên cứu nghiện" (không kiểm được). Lý do: thước đo mục 4 cho vững chắc cần tổng hợp hoặc hai tái lập lớn. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khá vững hợp mục 4: nhiều thí nghiệm ở chuột cùng chiều (Berridge 1989, B&R 1998, Peciña 2005) nhưng chủ yếu một nhóm nghiên cứu, chưa tổng hợp hay tái lập lớn, chưa có bằng chứng trực tiếp ở người. Thân khung nói đúng những giới hạn này.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9858756/", "https://pubmed.ncbi.nlm.nih.gov/16354936/", "https://pubmed.ncbi.nlm.nih.gov/29760524/" ]
    luot_2_ghi_chu: "'Khá vững' vừa mức; ở người ít bằng chứng trực tiếp."
    review: dung
  - id: n36
    cau: 'Chúng tôi không tìm thấy cơ chế sinh học nào cho việc "xả" dopamine ra khỏi não, cũng không thấy nghiên cứu nào ủng hộ "detox dopamine" theo nghĩa đen; chính người phổ biến thuật ngữ nói tên gọi không nên hiểu theo nghĩa đen.'
    loai: phat-hien
    nguon:
      - sepah2019
      - kalia2015
      - harvard2020
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "dopamine không phải độc tố tích tụ... không thể "đào thải"... (thiếu dopamine trầm trọng là bệnh Parkinson, không phải "tập trung cao độ")... nhà tâm lý học Cameron Sepah... chỉ là kỹ thuật kiểm soát kích thích của CBT". Chữ mới: "chúng tôi không tìm thấy nghiên cứu nào cho thấy xả được dopamine"; Parkinson liên quan mất neuron ở chất đen; trích lời Sepah qua NYT; bỏ "nhà tâm lý học" và "CBT". Lý do: các chi tiết đó không kiểm được (Medium bị chặn). Review (Claude Sonnet 5.5, 10/11/2026): sai (lượt 2: qua-manh). Nhãn Đã bị bác bỏ không hợp mục 4: không có kiểm tra thực nghiệm nào thất bại và không có bằng chứng gốc bị rút; ly_do cũ tự nhận "vắng cơ sở". Chọn cách nói thẳng "không có cơ chế, không có bằng chứng" không gắn nhãn: khung đổi từ :::bac-bo thành :::note, nêu rõ lý do không gắn nhãn; câu không còn loại nhan. Thêm nguồn Harvard Health (Grinspoon 2020, bậc 3, đã mở đọc). Cũng đổi phần Mô tả frontmatter ("không có cơ sở khoa học" thành "không tìm thấy cơ chế hay bằng chứng nào ủng hộ").'
    luot_2: qua-manh
    luot_2_nguon: [ "https://www.health.harvard.edu/blog/dopamine-fasting-misunderstanding-science-spawns-a-maladaptive-fad-2020022618917", "https://www.irishtimes.com/life-and-style/health-family/how-to-feel-nothing-now-in-order-to-feel-more-later-1.4095491", "https://pubmed.ncbi.nlm.nih.gov/25904081/" ]
    luot_2_ghi_chu: "câu đúng: Không có cơ chế hay nghiên cứu nào ủng hộ việc 'xả dopamine' ra khỏi não; người phổ biến thuật ngữ cũng nói không nên hiểu theo nghĩa đen (chưa có thử nghiệm trực tiếp nào bác bỏ).; 'Đã bị bác bỏ' đòi hỏi kiểm tra đủ mạnh thất bại; chưa có thí nghiệm nào kiểm chứng việc 'xả dopamine' vì không có cơ chế; mức đúng là 'không có bằng chứng, cơ chế không tồn tại'."
    review: sai
    trich: "\"Dopamine is just a mechanism that explains how addictions can become reinforced and makes for a catchy title,\" he wrote in an email. \"The title's not to be taken literally.\" // The dopamine fast, created by California psychiatrist Dr. Cameron Sepah, has very little to do with either fasting or dopamine."
    vi_tri: Irish Times (bản đăng lại NYT, 2019); Harvard Health Blog 26/2/2020, đoạn mở đầu
