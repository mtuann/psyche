    cau: Cameron Sepah (2019) nói với The New York Times rằng cái tên "dopamine fasting" "không nên được hiểu theo nghĩa đen" và dopamine "chỉ là một cơ chế giải thích vì sao nghiện có thể được củng cố, và làm nên một cái tên bắt tai".
    loai: lich-su
    nguon:
      - sepah2019
    trich: '"Dopamine is just a mechanism that explains how addictions can become reinforced and makes for a catchy title," he wrote in an email. "The title''s not to be taken literally."'
    vi_tri: Irish Times, đăng lại NYT (7/11/2019)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chính người phổ biến thuật ngữ — nhà tâm lý học Cameron Sepah (2019)... thực chất đó chỉ là một kỹ thuật kiểm soát kích thích của CBT". Chữ mới: trích đúng lời; bỏ "nhà tâm lý học" (nguồn gọi là "Dr", giáo sư UCSF Medical School) và phần CBT (chỉ có trên Medium, bị chặn). Cũng đổi trong ngộ nhận, quiz và danh mục nguồn. Review (Claude Sonnet 5.5, 10/11/2026): dung. Trích khớp Irish Times (bản đăng lại NYT) và Harvard Health: Sepah viết trong email cho NYT: "The title''s not to be taken literally". Trang đã bỏ "nhà tâm lý học" và phần CBT.'
    luot_2: dung
    luot_2_nguon: [ "https://www.irishtimes.com/life-and-style/health-family/how-to-feel-nothing-now-in-order-to-feel-more-later-1.4095491", "https://www.health.harvard.edu/blog/dopamine-fasting-misunderstanding-science-spawns-a-maladaptive-fad-2020022618917" ]
    luot_2_ghi_chu: Trích từ bài NYT (Irish Times đăng lại) và Harvard Health; Sepah trả lời qua email.
    review: dung
  - id: n39
    cau: 'Chúng tôi chưa dẫn được bằng chứng nhân quả trực tiếp ở người cho việc dopamine gây nghiện mạng xã hội hay game gacha; có lập luận cơ chế từ động vật (Fiorillo 2003) và từ thuốc gây nghiện (Schultz 2016).'
    loai: phat-hien
    nguon:
      - fiorillo2003
      - schultz2016
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "lịch trình củng cố biến đổi vốn đã được chứng minh là tạo hành vi bền bỉ nhất từ thời Skinner... nghiện là đa yếu tố (thói quen, kiểm soát ức chế...)". Chữ mới bỏ hai ý này (không có nguồn đã mở), thêm lời dẫn tới Hỗ trợ. Review (Claude Sonnet 5.5, 10/11/2026): sai (nhãn). Đang tranh cãi không hợp mục 4 (không có bằng chứng chất lượng cao mâu thuẫn, không có tái lập thất bại; tình trạng thật là chưa có nghiên cứu trực tiếp). Hồ sơ lượt 1 cũng nói "chỉ gần nghĩa". Đã đổi khung từ :::tranh-cai thành :::note "Chưa đủ bằng chứng: ...", giữ nguyên thân; câu không còn loại nhan. Fiorillo (tóm tắt) và Schultz 2016 ("Drugs of addiction generate, hijack, and amplify the dopamine reward signal") khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9607763/", "https://pubmed.ncbi.nlm.nih.gov/42946727/", "https://pubmed.ncbi.nlm.nih.gov/35933619/" ]
    luot_2_ghi_chu: Hợp 'đang tranh cãi'.
    review: sai
