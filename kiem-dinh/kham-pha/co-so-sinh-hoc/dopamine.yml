  - id: n42
    cau: 'Khung incentive salience: dopamine gán sức hút cho các dấu hiệu báo phần thưởng; wanting là muốn, không nhất thiết thích; ví dụ biểu tượng ứng dụng, tiếng "ting" là minh họa của trang.'
    loai: dinh-nghia
    nguon:
      - berridge1998
    trich: dopamine systems may mediate the incentive salience of rewards, modulating their motivational value in a manner separable from hedonia and reward learning
    vi_tri: Tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Dopamine gán... nam châm tâm lý... nhìn thấy biểu tượng ứng dụng... bỗng dưng thấy thôi thúc" như khẳng định. Chữ mới ghi rõ minh họa. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp B&R 1998: "dopamine systems may mediate the incentive salience of rewards"; ví dụ biểu tượng ứng dụng, tiếng "ting" đã ghi là minh họa của trang.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9858756/" ]
