nhan_dinh:
  - id: n1
    cau: Trong một số nội dung sức khỏe, dopamine được xếp vào nhóm "hormone hạnh phúc" cùng serotonin, endorphin, oxytocin (ví dụ một bài của Vinmec).
    loai: thoi-su
    nguon:
      - vinmec
    trich: Các hormone hạnh phúc do cơ thể sản xuất bao gồm dopamine giúp cảm thấy dễ chịu, serotonin làm giảm buồn phiền chán nản, oxytocin là hormone tình yêu và endorphin
    vi_tri: Vinmec, đoạn mở đầu
    het_han: '2028-11-01'
    ket_qua: dung
    ghi_chu: 'Ví dụ một trang; "thường" chỉ kiểm bằng một ví dụ. Mốc 11/2026. Review (Claude Sonnet 5.5, 10/11/2026): sai (nhẹ). "Thường" dựa trên một ví dụ duy nhất (Vinmec). Trang đã đổi thành "Trong một số nội dung sức khỏe ... (ví dụ ...)". Vinmec mở lại 10/11/2026: mô tả bài viết đúng trích; het_han 2028-11-01 giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.vinmec.com/vie/bai-viet/hormones-hanh-phuc-la-gi-va-lam-nao-de-tang-cuong-vi" ]
    luot_2_ghi_chu: Câu thời sự; Vinmec mở 2026-11-10.
    review: sai
  - id: n2
    cau: Các câu trích "Buồn thì làm gì đó cho tăng dopamine đi", "Detox dopamine 7 ngày để reset não" là lời khuyên phổ biến (ví dụ minh họa).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'gia-dinh. Câu trích minh họa, không khẳng định điều gì về bằng chứng. Review (Claude Sonnet 5.5, 10/11/2026): dung. Loại ve-site (gia-dinh): hai câu minh họa, không khẳng định điều gì về bằng chứng. Trang đã thêm "Hai câu giả định, kiểu lời khuyên về dopamine" để người đọc không hiểu là trích dẫn thật.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Loại ve-site: không qua lượt 2 (review kiểm thẳng trên trang). Là ví dụ minh họa lời khuyên phổ biến."
    review: dung
  - id: n3
    cau: Chuột bị phá hủy phần lớn dopamine ở nhân accumbens và thể vân vẫn có phản ứng "thích" vị ngọt gần như không đổi.
    loai: phat-hien
    nguon:
      - berridge1998
      - berridge1989
    trich: rats were depleted of dopamine in the nucleus accumbens and neostriatum by up to 99% ... We found normal hedonic reaction patterns to sucrose vs. quinine
    vi_tri: Berridge & Robinson 1998, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "bị phá hủy gần như toàn bộ dopamine trong não vẫn tỏ ra thích vị ngọt như bình thường". Chữ mới nói đúng vùng và mức (đến 99% ở accumbens, thể vân). Lý do: tóm tắt Berridge & Robinson 1998. Review (Claude Sonnet 5.5, 10/11/2026): dung. Berridge & Robinson 1998 (tóm tắt Europe PMC, PMID 9858756): "depleted of dopamine in the nucleus accumbens and neostriatum by up to 99%", "normal hedonic reaction patterns to sucrose vs. quinine". Trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9858756/" ]
    luot_2_ghi_chu: Khớp; 'gần như không đổi' hợp 'normal'.
    review: dung
  - id: n4
    cau: Phần thưởng được báo trước chắc chắn không làm neuron dopamine bùng phát.
    loai: phat-hien
    nguon:
      - schultz1997
      - schultz2016
    trich: The dopamine neuron is activated by the reward-predicting stimulus but fails to be activated by the predicted reward
    vi_tri: Schultz 1997, chú thích Hình 1 (giữa)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "không khiến neuron dopamine phản ứng gì". Chữ mới: "không làm neuron bùng phát". Lý do: nguồn nói "fails to be activated", không nói không phản ứng gì. Review (Claude Sonnet 5.5, 10/11/2026): dung. Schultz 1997, chú thích Hình 1: "fails to be activated by the predicted reward"; trang dùng "không làm bùng phát".'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4826767/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n5
    cau: 'Dopamine không đơn giản là "chất gây sướng": một vai trò được ghi nhận rõ của nó là báo cho não biết điều vừa xảy ra tốt hơn hay tệ hơn dự đoán (sai số dự đoán phần thưởng).'
    loai: phat-hien
    nguon:
      - schultz2016
    trich: Most dopamine neurons in the midbrain of humans, monkeys, and rodents signal a reward prediction error
    vi_tri: Schultz 2016, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Dopamine không phải "chất gây sướng". Công việc chính của nó là báo...". Chữ mới: "không đơn giản là", "một vai trò được ghi nhận rõ". Lý do: "công việc chính" mạnh hơn nguồn. Review (Claude Sonnet 5.5, 10/11/2026): dung. Một vai trò được ghi nhận rõ, đúng mức Schultz 2016 (tóm tắt: hầu hết neuron dopamine ... báo sai số dự đoán).'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4826767/", "https://pubmed.ncbi.nlm.nih.gov/9858756/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n6
    cau: Theo các thí nghiệm ở chuột của Berridge và cộng sự, cái "thích" được khuếch đại ở những điểm nóng nhỏ bởi hệ opioid; theo khung của họ, dopamine liên quan đến cái "muốn"; ở chuột hai thứ này có thể tách rời.
    loai: phat-hien
    nguon:
      - pecina2005
      - berridge1998
    trich: We conclude instead that dopamine may be more important to incentive salience
    vi_tri: Berridge & Robinson 1998, tóm tắt; Peciña & Berridge 2005, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "do một hệ khác đảm nhiệm: hệ opioid. Dopamine điều khiển cái "muốn"... có thể tách rời nhau hoàn toàn". Chữ mới nêu là kết quả ở chuột của nhóm Berridge và bỏ "hoàn toàn". Review (Claude Sonnet 5.5, 10/11/2026): dung. Phát biểu đã gắn "theo các thí nghiệm ở chuột của Berridge và cộng sự", "theo khung của họ"; khớp B&R 1998 và Peciña 2005.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/16354936/", "https://pubmed.ncbi.nlm.nih.gov/9858756/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n7
    cau: Chúng tôi không tìm thấy cơ chế hay nghiên cứu nào ủng hộ "detox dopamine" theo nghĩa đen (xả dopamine ra khỏi não).
    loai: phat-hien
    nguon:
      - sepah2019
    trich: The title's not to be taken literally.
    vi_tri: Irish Times (NYT), đoạn Sepah
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "không có cơ sở khoa học nào cả". Chữ mới nói về việc không tìm thấy. Lý do: không thể chứng minh phủ định; chỉ tìm thấy lời của người phổ biến (n47) và kết quả tìm kiếm (News-Medical, Digital Zen, chỉ blog, không dùng làm nguồn). Review (Claude Sonnet 5.5, 10/11/2026): dung. Phủ định đã viết ở mức "chúng tôi không tìm thấy". Nguồn mở lại: Irish Times (bản đăng lại NYT) và bài Harvard Health (Grinspoon, 26/2/2020: "dopamine fasting ... has very little to do with either fasting or dopamine"; Sepah: "The title''s not to be taken literally"). Đã thêm Harvard Health vào nguồn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.health.harvard.edu/blog/dopamine-fasting-misunderstanding-science-spawns-a-maladaptive-fad-2020022618917", "https://www.irishtimes.com/life-and-style/health-family/how-to-feel-nothing-now-in-order-to-feel-more-later-1.4095491" ]
    luot_2_ghi_chu: Không có nghiên cứu hay cơ chế 'xả' dopamine; câu mang tính 'chúng tôi không tìm thấy'.
    review: dung
  - id: n8
    cau: Dopamine chủ yếu được nghiên cứu như một chất dẫn truyền thần kinh trong não, dù truyền thông gọi là "hormone hạnh phúc".
    loai: dinh-nghia
    nguon:
      - schultz2016
      - berridge1998
    trich: mesolimbic and neostriatal dopamine systems
    vi_tri: Berridge & Robinson 1998, tóm tắt; Schultz 2016
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Dopamine là một chất dẫn truyền thần kinh — không phải hormone theo đúng nghĩa sinh học". Chữ mới: "chủ yếu được nghiên cứu như". Lý do: tránh khẳng định tuyệt đối về hormone; chưa mở APA Dictionary. Review (Claude Sonnet 5.5, 10/11/2026): dung. Câu ở mức "chủ yếu được nghiên cứu như chất dẫn truyền thần kinh"; không khẳng định tuyệt đối. Không mở được APA Dictionary (trang chạy bằng JavaScript).'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4826767/", "https://openstax.org/books/psychology-2e/pages/3-2-cells-of-the-nervous-system", "https://www.vinmec.com/vie/bai-viet/hormones-hanh-phuc-la-gi-va-lam-nao-de-tang-cuong-vi" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n9
    cau: Các neuron sản xuất dopamine tập trung ở vùng não giữa (VTA và chất đen), gửi tín hiệu đến nhân accumbens và thể vân.
    loai: dinh-nghia
    nguon:
      - berridge1998
      - kalia2015
    trich: loss of dopaminergic neurons in the substantia nigra; mesolimbic and neostriatal dopamine systems
    vi_tri: Kalia & Lang, tóm tắt; Berridge & Robinson, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ có "vùng xử lý động lực". Chữ mới bỏ cụm này; "VTA" suy từ "mesolimbic", chưa thấy tên VTA trong tóm tắt (chỗ khó). Review (Claude Sonnet 5.5, 10/11/2026): dung. Nơi sản xuất và đích gửi tín hiệu là kiến thức giáo trình; Schultz 2016 có từ khóa substantia nigra, ventral tegmental area, striatum; B&R 1998: mesolimbic và neostriatal.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4826767/", "https://pubmed.ncbi.nlm.nih.gov/9858756/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n10
    cau: Ngộ nhận "dopamine = chất gây sướng" thường được gắn với dòng nghiên cứu bắt đầu từ thí nghiệm năm 1954 của Olds và Milner.
    loai: lich-su
    nguon:
      - schultz2016
      - olds1954
    trich: The study of reward processing in the brain started when Olds and Milner introduced electrodes into the brains of rats
    vi_tri: Schultz 2016, đoạn mở đầu
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "bắt nguồn từ một thí nghiệm nổi tiếng năm 1954, rồi được thổi phồng trong nhiều thập kỷ". Chữ mới: "thường được gắn với dòng nghiên cứu bắt đầu từ". Lý do: "bắt nguồn" và "thổi phồng" không có nguồn. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp Schultz 2016: "The study of reward processing in the brain started when Olds and Milner ..."; trang nói "thường được gắn với", đúng mức.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/13233369/", "https://pubmed.ncbi.nlm.nih.gov/7353169/" ]
    luot_2_ghi_chu: Lịch sử đúng; toàn văn Olds & Milner không mở được (chỉ bản ghi PubMed).
    review: dung
  - id: n11
    cau: Olds và Milner đặt điện cực vào vùng vách (septal area) và các vùng não khác của chuột; mỗi lần nhấn cần gạt, não nhận một dòng điện nhỏ.
    loai: phat-hien
    nguon:
      - olds1954
      - schultz2016
    trich: Olds and Milner introduced electrodes into the brains of rats and subjected them to small electric currents when they pressed a lever. ... Olds and Milner placed electrodes in different brain regions.
    vi_tri: Schultz 2016, đoạn 4; nhan đề Olds 1954 trong danh mục
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "rồi đặt chuột vào hộp Skinner có cần gạt". Chữ mới bỏ "hộp Skinner" (không có trong nguồn đã mở). Bài gốc không mở được; theo Schultz 2016 kể lại (đã ghi trên trang). Vùng vách theo nhan đề bài gốc. Review (Claude Sonnet 5.5, 10/11/2026): dung. Đúng theo Schultz 2016 (đã mở toàn văn PMC4826767); bài gốc không mở được; trang ghi "phần này theo Schultz (2016) kể lại". Vùng vách theo nhan đề bài gốc.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/13233369/" ]
    luot_2_ghi_chu: Chỉ đọc tiêu đề/bản ghi PubMed, toàn văn trả phí; phần 'lever' là cách mô tả chuẩn của thí nghiệm.
    review: dung
  - id: n12
    cau: Theo cách Schultz (2016) kể lại, ở một số vùng chuột nhấn cần nhiều hơn để nhận thêm kích thích, đến mức quên ăn uống một lúc.
    loai: phat-hien
    nguon:
      - schultz2016
    trich: The rats pressed more to get more electric shocks to their brains. The animals were so fascinated by the lever pressing that they forgot to eat and drink for a while.
    vi_tri: Schultz 2016, đoạn 4
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "tự kích thích "thường xuyên và đều đặn trong thời gian dài" — sẵn sàng học hành vi mới chỉ để được kích thích". Chữ mới theo Schultz 2016. Lý do: câu trích cũ không thấy ở nguồn mở được. Review (Claude Sonnet 5.5, 10/11/2026): sai (nguồn). Lượt 2: khong-chac. Schultz 2016 (đọc lại toàn văn): "The animals were so fascinated by the lever pressing that they forgot to eat and drink for a while." Nhưng chi tiết "quên ăn uống" không có trong tóm tắt bài gốc 1954 (không mở được; APA bị chặn; bài không có trong bộ Wikipedia scholarly sources corpus mà review thử). Câu cũ đặt thành kết quả của Olds và Milner; đã viết lại thành "theo cách Schultz (2016) kể lại" để chỉ xác nhận mức nguồn đã đọc.'
    luot_2: khong-chac
    luot_2_ghi_chu: Toàn văn Olds & Milner 1954 không mở được (trả phí); chi tiết 'quên ăn uống' không có trong bản ghi PubMed nên không xác nhận được.
    review: sai
  - id: n13
    cau: Điều này được diễn giải là đã tìm thấy một cơ sở thần kinh của phần thưởng; về sau các nghiên cứu khác (như Corbett và Wise, 1980) gắn tự kích thích não với các đường dẫn dopamine.
    loai: lich-su
    nguon:
      - schultz2016
    trich: Olds and Milner had found a physical correlate for reward in the brain!
    vi_tri: 'Schultz 2016; Corbett & Wise: nhan đề trong danh mục tham khảo'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "diễn giải là não có một "trung tâm phần thưởng"... công chúng ghép nối: dopamine = chất gây sướng". Chữ mới theo Schultz 2016 và dẫn Corbett & Wise qua nhan đề. Lý do: "công chúng ghép nối" không kiểm được. Review (Claude Sonnet 5.5, 10/11/2026): dung. Schultz 2016: "Subsequent studies showed that about half of the effective locations for electrical self-stimulation are connected with dopamine neurons" (dẫn Corbett & Wise 1980); trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/7353169/" ]
    luot_2_ghi_chu: Khớp; Olds&Milner 1954 'cơ sở thần kinh của phần thưởng' là diễn giải.
    review: dung
  - id: n14
    cau: Theo những gì chúng tôi đọc được, thí nghiệm gốc của Olds và Milner không đo dopamine; liên kết với dopamine là diễn giải của các nghiên cứu về sau.
    loai: lich-su
    nguon:
      - schultz2016
      - olds1954
    trich: 'Corbett & Wise (1980): Intracranial self-stimulation in relation to the ascending dopaminergic systems of the midbrain'
    vi_tri: Schultz 2016, danh mục tham khảo
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Olds và Milner không hề đo dopamine — liên kết này là diễn giải chồng chất". Chữ mới thêm "theo những gì chúng tôi đọc được" vì không mở được bài gốc (chỗ khó). Review (Claude Sonnet 5.5, 10/11/2026): dung. Câu đã làm mềm "theo những gì chúng tôi đọc được"; đúng (tự kích thích bằng điện, không đo dopamine; Corbett & Wise là nghiên cứu sau gắn với đường dẫn dopamine).'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/13233369/", "https://pubmed.ncbi.nlm.nih.gov/7353169/" ]
    luot_2_ghi_chu: Chỉ đọc bản ghi PubMed của Olds & Milner (không có đo dopamine ở tiêu đề); toàn văn không mở.
    review: dung
  - id: n15
    cau: 'Schultz, Dayan và Montague (1997) là bài tổng hợp: ghi hoạt động từng neuron dopamine ở vùng não giữa của khỉ tỉnh táo trong nhiệm vụ học điều kiện (kích thích thị giác báo trước phần thưởng là nước trái cây), cùng mô hình học tăng cường TD.'
    loai: phat-hien
    nguon:
      - schultz1997
    trich: single dopamine neurons is recorded in alert monkeys while they perform behavioral acts and receive rewards ... Before learning, a drop of appetitive fruit juice occurs in the absence of prediction
    vi_tri: Schultz 1997, đoạn thứ 3 của phần mở bài; chú thích Hình 1
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Wolfram Schultz và cộng sự ghi hoạt động... một tín hiệu (ánh đèn)". Chữ mới: bài tổng hợp, "kích thích thị giác". Lý do: bài 1997 là tổng hợp ghi chép (và mô hình TD), chú thích Hình 1 chỉ nói "conditioned visual stimulus"; "ánh đèn" không có. Review (Claude Sonnet 5.5, 10/11/2026): dung. Schultz, Dayan & Montague 1997 là bài tổng hợp ghi chép và mô hình TD (bản gatsby.ucl.ac.uk); trang đã sửa đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9054347/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4826767/" ]
    luot_2_ghi_chu: Chi tiết 'khỉ tỉnh táo' và 'nước trái cây' không có trong tóm tắt; bài Science không mở được, nên dựa vào mô tả của Schultz 2016 (khỉ, nước trái cây).
    review: dung
  - id: n16
    cau: Phần thưởng bất ngờ làm neuron dopamine bùng phát mạnh.
    loai: phat-hien
    nguon:
      - schultz1997
    trich: Before learning, a drop of appetitive fruit juice occurs in the absence of prediction—hence a positive error in the prediction of reward. The dopamine neuron is activated by this unpredicted occurrence of juice.
    vi_tri: Schultz 1997, chú thích Hình 1 (trên)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4826767/" ]
    luot_2_ghi_chu: Khớp.
  - id: n17
    cau: Sau khi học xong, neuron bùng phát với tín hiệu báo trước, còn phần thưởng đã được dự đoán thì không làm neuron bùng phát.
    loai: phat-hien
    nguon:
      - schultz1997
    trich: After learning, the conditioned stimulus predicts reward, and the reward occurs according to the prediction—hence no error in the prediction of reward. The dopamine neuron is activated by the reward-predicting stimulus but fails to be activated by the predicted reward
    vi_tri: Schultz 1997, chú thích Hình 1 (giữa)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đáp ứng "chuyển" sang tín hiệu báo trước... neuron gần như im lặng". Chữ mới sát chú thích hình. Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp chú thích Hình 1 (giữa).'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4826767/" ]
    luot_2_ghi_chu: "Khớp: neuron bùng phát ở tín hiệu báo trước (Schultz 2016: responds to reward-predicting stimuli)."
    review: dung
  - id: n18
    cau: Phần thưởng được dự đoán nhưng không đến thì hoạt động neuron bị ức chế đúng lúc phần thưởng lẽ ra đến.
    loai: phat-hien
    nguon:
      - schultz1997
      - schultz2016
    trich: The activity of the dopamine neuron is depressed exactly at the time when the reward would have occurred.
    vi_tri: 'Schultz 1997, chú thích Hình 1 (dưới); Schultz 2016: "depressed activity"'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "giảm xuống dưới mức nền". Chữ mới: "bị ức chế". Lý do: nguồn dùng "depressed", không nói "dưới mức nền". Review (Claude Sonnet 5.5, 10/11/2026): dung. "depressed exactly at the time when the reward would have occurred"; trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4826767/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n19
    cau: 'Sai số dự đoán = thực tế − dự đoán: neuron không báo "có sướng không" mà báo "có bất ngờ không — và theo hướng nào".'
    loai: dinh-nghia
    nguon:
      - schultz2016
    trich: The dopamine response thus reflects a reward prediction error and can be described by the simple difference between obtained and predicted reward
    vi_tri: Schultz 2016, mục "Reward prediction error"
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4826767/" ]
    luot_2_ghi_chu: Khớp.
