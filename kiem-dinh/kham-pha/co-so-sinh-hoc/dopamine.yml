  - id: n27
    cau: 'Berridge và Robinson (1998) là bài tổng quan kèm nghiên cứu mới: chuột mất đến 99% dopamine ở nhân accumbens và thể vân, rồi đo phản ứng miệng-mặt với vị ngọt, vị đắng, học lại giá trị vị và thuốc tăng khoái cảm.'
    loai: phat-hien
    nguon:
      - berridge1998
    trich: rats were depleted of dopamine in the nucleus accumbens and neostriatum by up to 99% using 6-hydroxydopamine
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một bài tổng quan lớn, gom bằng chứng từ thần kinh học, điện sinh lý và hành vi". Chữ mới thêm nghiên cứu mới. Lý do: tóm tắt nói rõ có "a new study". Review (Claude Sonnet 5.5, 10/11/2026): dung. Berridge & Robinson 1998 (tóm tắt Europe PMC, PMID 9858756): 99%, ba thí nghiệm (phản ứng hedonic và ghê, học giá trị vị mới, tăng khoái cảm bằng benzodiazepine); trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9858756/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: n28
    cau: Chuột vẫn có phản ứng "thích" bình thường; các tác giả kết luận hệ dopamine không cần để tạo ra khoái cảm cũng không cần cho việc học các mối liên hệ khoái cảm mới, và đề xuất dopamine có thể quan trọng hơn cho "wanting".
    loai: phat-hien
    nguon:
      - berridge1998
    trich: We conclude that dopamine systems are not needed either to mediate the hedonic pleasure of reinforcers or to mediate predictive associations involved in hedonic reward learning. We conclude instead that dopamine may be more important to incentive salience
    vi_tri: Tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Dopamine cần cho wanting... Hệ dopamine cần cho việc "muốn"". Chữ mới: "có thể quan trọng hơn" theo "may be". Review (Claude Sonnet 5.5, 10/11/2026): dung. Khớp: "dopamine systems are not needed either to mediate the hedonic pleasure ... or to mediate predictive associations involved in hedonic reward learning ... dopamine may be more important to incentive salience".'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/9858756/" ]
    luot_2_ghi_chu: Đây là kết luận của tác giả; site đã ghi 'các tác giả'.
