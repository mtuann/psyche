nhan_dinh:
- id: n1
  cau: Dopamine thường được xếp vào nhóm "hormone hạnh phúc" cùng serotonin, endorphin, oxytocin trong các lời khuyên sức khỏe.
  loai: thoi-su
  nguon:
  - vinmec
  trich: Các hormone hạnh phúc do cơ thể sản xuất bao gồm dopamine giúp cảm thấy dễ chịu, serotonin làm giảm buồn phiền chán nản, oxytocin là hormone tình yêu và endorphin
  vi_tri: Vinmec, đoạn mở đầu
  het_han: '2028-11-01'
  ket_qua: dung
  ghi_chu: Ví dụ một trang; "thường" chỉ kiểm bằng một ví dụ. Mốc 11/2026.
- id: n2
  cau: Các câu trích "Buồn thì làm gì đó cho tăng dopamine đi", "Detox dopamine 7 ngày để reset não" là lời khuyên phổ biến (ví dụ minh họa).
  loai: ve-site
  ket_qua: dung
  ghi_chu: gia-dinh. Câu trích minh họa, không khẳng định điều gì về bằng chứng.
- id: n3
  cau: Chuột bị phá hủy phần lớn dopamine ở nhân accumbens và thể vân vẫn có phản ứng "thích" vị ngọt gần như không đổi.
  loai: phat-hien
  nguon:
  - berridge1998
  - berridge1989
  trich: rats were depleted of dopamine in the nucleus accumbens and neostriatum by up to 99% ... We found normal hedonic reaction patterns to sucrose vs. quinine
  vi_tri: Berridge & Robinson 1998, tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "bị phá hủy gần như toàn bộ dopamine trong não vẫn tỏ ra thích vị ngọt như bình thường". Chữ mới nói đúng vùng và mức (đến 99% ở accumbens, thể vân). Lý do: tóm tắt Berridge & Robinson 1998.'
- id: n4
  cau: Phần thưởng được báo trước chắc chắn không làm neuron dopamine bùng phát.
  loai: phat-hien
  nguon:
  - schultz1997
  - schultz2016
  trich: The dopamine neuron is activated by the reward-predicting stimulus but fails to be activated by the predicted reward
  vi_tri: Schultz 1997, chú thích Hình 1 (giữa)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "không khiến neuron dopamine phản ứng gì". Chữ mới: "không làm neuron bùng phát". Lý do: nguồn nói "fails to be activated", không nói không phản ứng gì.'
- id: n5
  cau: 'Dopamine không đơn giản là "chất gây sướng": một vai trò được ghi nhận rõ của nó là báo cho não biết điều vừa xảy ra tốt hơn hay tệ hơn dự đoán (sai số dự đoán phần thưởng).'
  loai: phat-hien
  nguon:
  - schultz2016
  trich: Most dopamine neurons in the midbrain of humans, monkeys, and rodents signal a reward prediction error
  vi_tri: Schultz 2016, tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Dopamine không phải "chất gây sướng". Công việc chính của nó là báo...". Chữ mới: "không đơn giản là", "một vai trò được ghi nhận rõ". Lý do: "công việc chính" mạnh hơn nguồn.'
- id: n6
  cau: Theo các thí nghiệm ở chuột của Berridge và cộng sự, cái "thích" được khuếch đại ở những điểm nóng nhỏ bởi hệ opioid; theo khung của họ, dopamine liên quan đến cái "muốn"; ở chuột hai thứ này có thể tách rời.
  loai: phat-hien
  nguon:
  - pecina2005
  - berridge1998
  trich: We conclude instead that dopamine may be more important to incentive salience
  vi_tri: Berridge & Robinson 1998, tóm tắt; Peciña & Berridge 2005, tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "do một hệ khác đảm nhiệm: hệ opioid. Dopamine điều khiển cái "muốn"... có thể tách rời nhau hoàn toàn". Chữ mới nêu là kết quả ở chuột của nhóm Berridge và bỏ "hoàn toàn".'
- id: n7
  cau: Chúng tôi không tìm thấy cơ chế hay nghiên cứu nào ủng hộ "detox dopamine" theo nghĩa đen (xả dopamine ra khỏi não).
  loai: phat-hien
  nguon:
  - sepah2019
  trich: The title's not to be taken literally.
  vi_tri: Irish Times (NYT), đoạn Sepah
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "không có cơ sở khoa học nào cả". Chữ mới nói về việc không tìm thấy. Lý do: không thể chứng minh phủ định; chỉ tìm thấy lời của người phổ biến (n47) và kết quả tìm kiếm (News-Medical, Digital Zen, chỉ blog, không dùng làm nguồn).'
- id: n8
  cau: Dopamine chủ yếu được nghiên cứu như một chất dẫn truyền thần kinh trong não, dù truyền thông gọi là "hormone hạnh phúc".
  loai: dinh-nghia
  nguon:
  - schultz2016
  - berridge1998
  trich: mesolimbic and neostriatal dopamine systems
  vi_tri: Berridge & Robinson 1998, tóm tắt; Schultz 2016
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Dopamine là một chất dẫn truyền thần kinh — không phải hormone theo đúng nghĩa sinh học". Chữ mới: "chủ yếu được nghiên cứu như". Lý do: tránh khẳng định tuyệt đối về hormone; chưa mở APA Dictionary.'
- id: n9
  cau: Các neuron sản xuất dopamine tập trung ở vùng não giữa (VTA và chất đen), gửi tín hiệu đến nhân accumbens và thể vân.
  loai: dinh-nghia
  nguon:
  - berridge1998
  - kalia2015
  trich: loss of dopaminergic neurons in the substantia nigra; mesolimbic and neostriatal dopamine systems
  vi_tri: Kalia & Lang, tóm tắt; Berridge & Robinson, tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: Chữ cũ có "vùng xử lý động lực". Chữ mới bỏ cụm này; "VTA" suy từ "mesolimbic", chưa thấy tên VTA trong tóm tắt (chỗ khó).
- id: n10
  cau: Ngộ nhận "dopamine = chất gây sướng" thường được gắn với dòng nghiên cứu bắt đầu từ thí nghiệm năm 1954 của Olds và Milner.
  loai: lich-su
  nguon:
  - schultz2016
  - olds1954
  trich: The study of reward processing in the brain started when Olds and Milner introduced electrodes into the brains of rats
  vi_tri: Schultz 2016, đoạn mở đầu
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "bắt nguồn từ một thí nghiệm nổi tiếng năm 1954, rồi được thổi phồng trong nhiều thập kỷ". Chữ mới: "thường được gắn với dòng nghiên cứu bắt đầu từ". Lý do: "bắt nguồn" và "thổi phồng" không có nguồn.'
- id: n11
  cau: Olds và Milner đặt điện cực vào vùng vách (septal area) và các vùng não khác của chuột; mỗi lần nhấn cần gạt, não nhận một dòng điện nhỏ.
  loai: phat-hien
  nguon:
  - olds1954
  - schultz2016
  trich: Olds and Milner introduced electrodes into the brains of rats and subjected them to small electric currents when they pressed a lever. ... Olds and Milner placed electrodes in different brain regions.
  vi_tri: Schultz 2016, đoạn 4; nhan đề Olds 1954 trong danh mục
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "rồi đặt chuột vào hộp Skinner có cần gạt". Chữ mới bỏ "hộp Skinner" (không có trong nguồn đã mở). Bài gốc không mở được; theo Schultz 2016 kể lại (đã ghi trên trang). Vùng vách theo nhan đề bài gốc.'
- id: n12
  cau: Chuột nhấn cần nhiều hơn để nhận thêm kích thích ở một số vùng, đến mức quên ăn uống một lúc.
  loai: phat-hien
  nguon:
  - schultz2016
  trich: The rats pressed more to get more electric shocks to their brains. The animals were so fascinated by the lever pressing that they forgot to eat and drink for a while.
  vi_tri: Schultz 2016, đoạn 4
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "tự kích thích "thường xuyên và đều đặn trong thời gian dài" — sẵn sàng học hành vi mới chỉ để được kích thích". Chữ mới theo Schultz 2016. Lý do: câu trích cũ không thấy ở nguồn mở được.'
- id: n13
  cau: Điều này được diễn giải là đã tìm thấy một cơ sở thần kinh của phần thưởng; về sau các nghiên cứu khác (như Corbett và Wise, 1980) gắn tự kích thích não với các đường dẫn dopamine.
  loai: lich-su
  nguon:
  - schultz2016
  trich: Olds and Milner had found a physical correlate for reward in the brain!
  vi_tri: 'Schultz 2016; Corbett & Wise: nhan đề trong danh mục tham khảo'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "diễn giải là não có một "trung tâm phần thưởng"... công chúng ghép nối: dopamine = chất gây sướng". Chữ mới theo Schultz 2016 và dẫn Corbett & Wise qua nhan đề. Lý do: "công chúng ghép nối" không kiểm được.'
- id: n14
  cau: Theo những gì chúng tôi đọc được, thí nghiệm gốc của Olds và Milner không đo dopamine; liên kết với dopamine là diễn giải của các nghiên cứu về sau.
  loai: lich-su
  nguon:
  - schultz2016
  - olds1954
  trich: 'Corbett & Wise (1980): Intracranial self-stimulation in relation to the ascending dopaminergic systems of the midbrain'
  vi_tri: Schultz 2016, danh mục tham khảo
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Olds và Milner không hề đo dopamine — liên kết này là diễn giải chồng chất". Chữ mới thêm "theo những gì chúng tôi đọc được" vì không mở được bài gốc (chỗ khó).'
- id: n15
  cau: 'Schultz, Dayan và Montague (1997) là bài tổng hợp: ghi hoạt động từng neuron dopamine ở vùng não giữa của khỉ tỉnh táo trong nhiệm vụ học điều kiện (kích thích thị giác báo trước phần thưởng là nước trái cây), cùng mô hình học tăng cường TD.'
  loai: phat-hien
  nguon:
  - schultz1997
  trich: single dopamine neurons is recorded in alert monkeys while they perform behavioral acts and receive rewards ... Before learning, a drop of appetitive fruit juice occurs in the absence of prediction
  vi_tri: Schultz 1997, đoạn thứ 3 của phần mở bài; chú thích Hình 1
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Wolfram Schultz và cộng sự ghi hoạt động... một tín hiệu (ánh đèn)". Chữ mới: bài tổng hợp, "kích thích thị giác". Lý do: bài 1997 là tổng hợp ghi chép (và mô hình TD), chú thích Hình 1 chỉ nói "conditioned visual stimulus"; "ánh đèn" không có.'
- id: n16
  cau: Phần thưởng bất ngờ làm neuron dopamine bùng phát mạnh.
  loai: phat-hien
  nguon:
  - schultz1997
  trich: Before learning, a drop of appetitive fruit juice occurs in the absence of prediction—hence a positive error in the prediction of reward. The dopamine neuron is activated by this unpredicted occurrence of juice.
  vi_tri: Schultz 1997, chú thích Hình 1 (trên)
  ket_qua: dung
- id: n17
  cau: Sau khi học xong, neuron bùng phát với tín hiệu báo trước, còn phần thưởng đã được dự đoán thì không làm neuron bùng phát.
  loai: phat-hien
  nguon:
  - schultz1997
  trich: After learning, the conditioned stimulus predicts reward, and the reward occurs according to the prediction—hence no error in the prediction of reward. The dopamine neuron is activated by the reward-predicting stimulus but fails to be activated by the predicted reward
  vi_tri: Schultz 1997, chú thích Hình 1 (giữa)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đáp ứng "chuyển" sang tín hiệu báo trước... neuron gần như im lặng". Chữ mới sát chú thích hình.'
- id: n18
  cau: Phần thưởng được dự đoán nhưng không đến thì hoạt động neuron bị ức chế đúng lúc phần thưởng lẽ ra đến.
  loai: phat-hien
  nguon:
  - schultz1997
  - schultz2016
  trich: The activity of the dopamine neuron is depressed exactly at the time when the reward would have occurred.
  vi_tri: 'Schultz 1997, chú thích Hình 1 (dưới); Schultz 2016: "depressed activity"'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "giảm xuống dưới mức nền". Chữ mới: "bị ức chế". Lý do: nguồn dùng "depressed", không nói "dưới mức nền".'
- id: n19
  cau: 'Sai số dự đoán = thực tế − dự đoán: neuron không báo "có sướng không" mà báo "có bất ngờ không — và theo hướng nào".'
  loai: dinh-nghia
  nguon:
  - schultz2016
  trich: The dopamine response thus reflects a reward prediction error and can be described by the simple difference between obtained and predicted reward
  vi_tri: Schultz 2016, mục "Reward prediction error"
  ket_qua: dung
- id: n20
  cau: Fiorillo và cộng sự (2003) ghi neuron dopamine với các tín hiệu báo trước những xác suất phần thưởng khác nhau.
  loai: phat-hien
  nguon:
  - fiorillo2003
  trich: Using distinct stimuli to indicate the probability of reward
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Vẫn ghi neuron dopamine trên khỉ". Chữ mới bỏ "trên khỉ" vì tóm tắt không nêu loài (chỗ khó).'
- id: n21
  cau: Đáp ứng ngắn của neuron thay đổi đều đặn theo xác suất phần thưởng, phù hợp với mã hóa chênh lệch giữa phần thưởng thực và dự đoán.
  loai: phat-hien
  nguon:
  - fiorillo2003
  trich: the phasic activation of dopamine neurons varied monotonically across the full range of probabilities, supporting past claims that this response codes the discrepancy between predicted and actual reward
  vi_tri: Tóm tắt
  ket_qua: dung
- id: n22
  cau: 'Có một đáp ứng mới: hoạt động tăng dần cho đến thời điểm phần thưởng có thể đến, tăng theo mức không chắc chắn, lớn nhất ở xác suất 50%.'
  loai: phat-hien
  nguon:
  - fiorillo2003
  trich: a previously unobserved response covaried with uncertainty and consisted of a gradual increase in activity until the potential time of reward ... maximal at P = 0.5
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "tăng dần, duy trì ... mạnh nhất khi xác suất là 50%". Chữ mới: "tăng theo mức không chắc chắn, lớn nhất ở 50%". Lý do: "duy trì" và "mạnh nhất" không phải lời của tóm tắt; cực đại là của độ không chắc chắn.'
- id: n23
  cau: Các tác giả gợi ý tín hiệu này có thể liên quan đến học dựa trên chú ý và hành vi chấp nhận rủi ro.
  loai: phat-hien
  nguon:
  - fiorillo2003
  trich: The coding of uncertainty suggests a possible role for dopamine signals in attention-based learning and risk-taking behavior.
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Dopamine... bị thu hút bởi chính sự không chắc chắn". Chữ mới theo gợi ý của tác giả.'
- id: n24
  cau: Berridge, Venier và Robinson (1989) tiêm 6-OHDA vào vùng chất đen của chuột; chuột trở nên biếng ăn (aphagia), không tự ăn nữa.
  loai: phat-hien
  nguon:
  - berridge1989
  trich: taste reactivity was examined in rats made aphagic by intranigral 6-OHDA injections
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "phá hủy hệ dopamine bằng 6-OHDA... biếng ăn hoàn toàn: không tự đi tìm hay ăn". Chữ mới: tổn thương qua tiêm vào chất đen; "không tự ăn". Lý do: "hoàn toàn" và "tìm thức ăn" không có trong tóm tắt.'
- id: n25
  cau: Khi cho vị ngọt vào miệng, phản ứng miệng-mặt (taste reactivity) của chuột gần như không đổi.
  loai: phat-hien
  nguon:
  - berridge1989
  trich: Taste reactivity was essentially unchanged.
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "biểu cảm mặt thư giãn, thè lưỡi, liếm môi... hoàn toàn bình thường". Chữ mới: "gần như không đổi", bỏ danh sách biểu hiện. Lý do: tóm tắt chỉ nói "essentially unchanged".'
- id: n26
  cau: 'Các tác giả lập luận: nếu dopamine tạo ra khoái cảm thì tổn thương dopamine phải làm đổi phản ứng này; điều đó đã không xảy ra.'
  loai: phat-hien
  nguon:
  - berridge1989
  trich: The persistence of normal taste reactivity argues against both an anhedonia and a global sensorimotor arousal interpretation
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Nếu dopamine tạo ra sung sướng, phá hủy dopamine phải xóa luôn cảm giác thích — nó đã không làm vậy." Chữ mới thêm "các tác giả lập luận".'
- id: n27
  cau: 'Berridge và Robinson (1998) là bài tổng quan kèm nghiên cứu mới: chuột mất đến 99% dopamine ở nhân accumbens và thể vân, rồi đo phản ứng miệng-mặt với vị ngọt, vị đắng, học lại giá trị vị và thuốc tăng khoái cảm.'
  loai: phat-hien
  nguon:
  - berridge1998
  trich: rats were depleted of dopamine in the nucleus accumbens and neostriatum by up to 99% using 6-hydroxydopamine
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Một bài tổng quan lớn, gom bằng chứng từ thần kinh học, điện sinh lý và hành vi". Chữ mới thêm nghiên cứu mới. Lý do: tóm tắt nói rõ có "a new study".'
- id: n28
  cau: Chuột vẫn có phản ứng "thích" bình thường; các tác giả kết luận hệ dopamine không cần để tạo ra khoái cảm cũng không cần cho việc học các mối liên hệ khoái cảm mới, và đề xuất dopamine có thể quan trọng hơn cho "wanting".
  loai: phat-hien
  nguon:
  - berridge1998
  trich: We conclude that dopamine systems are not needed either to mediate the hedonic pleasure of reinforcers or to mediate predictive associations involved in hedonic reward learning. We conclude instead that dopamine may be more important to incentive salience
  vi_tri: Tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Dopamine cần cho wanting... Hệ dopamine cần cho việc "muốn"". Chữ mới: "có thể quan trọng hơn" theo "may be".'
- id: n29
  cau: Peciña và Berridge (2005) vi tiêm DAMGO (chất kích hoạt thụ thể μ-opioid) vào từng điểm nhỏ trong vỏ giữa của nhân accumbens ở chuột, đo phản ứng "thích" với vị ngọt và lượng ăn.
  loai: phat-hien
  nguon:
  - pecina2005
  trich: We mapped changes in affective orofacial reactions of "liking"/"disliking" elicited by sucrose or quinine tastes after D-Ala2-N-Me-Phe4-Glycol5-enkephalin (DAMGO) microinjections in rats
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "vào từng điểm nhỏ trong nhân accumbens". Chữ mới thêm "vỏ giữa" và lượng ăn. DAMGO là chất kích hoạt thụ thể μ-opioid: kiến thức dược học chung.'
- id: n30
  cau: Chỉ ở một điểm nóng khoảng 1 mm³ ở vùng trước-lưng của vỏ giữa, DAMGO làm tăng phản ứng "thích" với vị ngọt; ở mọi vùng của vỏ giữa, DAMGO đều làm chuột ăn nhiều hơn.
  loai: so-lieu
  nguon:
  - pecina2005
  trich: opioid-induced increases in sucrose hedonic impact are generated by a localized cubic millimeter site in a rostrodorsal region of the medial shell. In contrast, all regions of the medial shell generated DAMGO-induced robust increases in eating behavior and food intake.
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "phản ứng "thích" tăng gấp khoảng bốn lần bình thường. Ở các điểm xung quanh... không tăng "thích"". Chữ mới bỏ "gấp bốn lần" (tóm tắt không nêu; toàn văn không mở được) và nói đủ phạm vi.'
- id: n31
  cau: Theo các tác giả, mạch opioid kích thích ăn phân bố rộng, còn mạch "thích" khu trú hơn nhiều; nghiên cứu này không đo dopamine.
  loai: phat-hien
  nguon:
  - pecina2005
  trich: Opioid circuits for stimulating food intake are widely distributed, whereas hedonic "liking" circuits are more tightly localized in the rostromedial shell of the nucleus accumbens.
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Khoái cảm thật sự được tạo ra bởi hệ opioid — dopamine đứng ngoài câu chuyện này." Chữ mới theo tóm tắt. Lý do: nghiên cứu không đo dopamine nên không nói được "đứng ngoài".'
- id: n32
  cau: 'Vững chắc: neuron dopamine mã hóa sai số dự đoán phần thưởng.'
  loai: nhan
  nhan: vung-chac
  co_so:
  - schultz2016
  - garrison2013
  - schultz1997
  ly_do: 'Tổng quan Schultz 2016 (ghi neuron ở người, khỉ, chuột) và phân tích tổng hợp ALE các nghiên cứu ghi hình (Garrison 2013: thể vân là vùng chính mã hóa sai số dự đoán) cùng chiều; đúng ở nhiều loài. Giới hạn: ghi hình não không đo riêng dopamine; chưa tìm thấy tái lập lớn có đăng ký trước. Chỗ khó: thước đo mục 4 cần tổng hợp hay tổng quan hệ thống: Schultz 2016 là tổng quan kể, Garrison 2013 là phân tích tổng hợp về não chứ không riêng neuron dopamine.'
  nguon:
  - schultz2016
  - garrison2013
  - schultz1997
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đã được tái lập rộng rãi... Phát hiện của Schultz và cộng sự (1997)". Chữ mới: "Mẫu hình... đã được thấy lại", thêm Garrison 2013 và nói ghi hình não không đo riêng dopamine. Lý do: kể rõ giới hạn.'
- id: n33
  cau: Tổng quan của chính Schultz (2016) kết luận rằng hầu hết neuron dopamine ở não giữa của người, khỉ và động vật gặm nhấm đều báo hiệu sai số dự đoán phần thưởng.
  loai: phat-hien
  nguon:
  - schultz2016
  trich: Most dopamine neurons in the midbrain of humans, monkeys, and rodents signal a reward prediction error
  vi_tri: Schultz 2016, tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: dấu trích dẫn Việt hóa "hầu hết neuron...". Chữ mới bỏ dấu trích (là bản dịch).'
- id: n34
  cau: Hàng trăm nghiên cứu ghi hình não ở người cho thấy tín hiệu sai số dự đoán ở các cấu trúc thưởng, trong đó thể vân là vùng chính theo một phân tích tổng hợp (Garrison và cộng sự, 2013).
  loai: so-lieu
  nguon:
  - schultz2016
  - garrison2013
  trich: The striatum was the key brain area encoding for prediction error
  vi_tri: 'Garrison 2013, tóm tắt; Schultz 2016: "hundreds of human neuro imaging studies"'
  ket_qua: dung
  ghi_chu: Mới thêm cho khung n32.
- id: n35
  cau: 'Khá vững: phân biệt "muốn" (dopamine) và "thích" (opioid).'
  loai: nhan
  nhan: kha-vung
  co_so:
  - berridge1989
  - berridge1998
  - pecina2005
  ly_do: Nhiều thí nghiệm ở chuột cùng chiều, nhưng chủ yếu từ một nhóm nghiên cứu; chưa dẫn được bằng chứng trực tiếp ở người; chưa có phân tích tổng hợp hay tái lập lớn; một mâu thuẫn nhỏ trong chính khung là Berridge và Robinson 1998 nói dopamine không cần cho học liên hệ khoái cảm, còn Schultz 2016 mô tả dopamine như tín hiệu dạy học.
  nguon:
  - berridge1989
  - berridge1998
  - pecina2005
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: nhãn "vững chắc", "chứng minh nhất quán", "gấp nhiều lần", "khung chuẩn trong nghiên cứu nghiện hiện nay". Chữ mới: "khá vững", nói rõ giới hạn; bỏ "khung chuẩn trong nghiên cứu nghiện" (không kiểm được). Lý do: thước đo mục 4 cho vững chắc cần tổng hợp hoặc hai tái lập lớn.'
- id: n36
  cau: 'Đã bị bác bỏ: "detox dopamine" theo nghĩa đen.'
  loai: nhan
  nhan: bac-bo
  co_so:
  - sepah2019
  - kalia2015
  ly_do: 'Nguyên tắc: không có cơ chế sinh học nào được nêu cho việc xả dopamine; chính người phổ biến thuật ngữ nói cái tên không nên hiểu theo nghĩa đen. Chưa có thử nghiệm nào kiểm chứng vì ý tưởng không dựa trên cơ chế; theo nhãn mục 4 "bằng chứng gốc không còn giá trị". Chỗ khó: không có "kiểm tra đủ mạnh thất bại" mà là vắng cơ sở, nên người giao quyết có đổi nhãn không.'
  nguon:
  - sepah2019
  - kalia2015
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "dopamine không phải độc tố tích tụ... không thể "đào thải"... (thiếu dopamine trầm trọng là bệnh Parkinson, không phải "tập trung cao độ")... nhà tâm lý học Cameron Sepah... chỉ là kỹ thuật kiểm soát kích thích của CBT". Chữ mới: "chúng tôi không tìm thấy nghiên cứu nào cho thấy xả được dopamine"; Parkinson liên quan mất neuron ở chất đen; trích lời Sepah qua NYT; bỏ "nhà tâm lý học" và "CBT". Lý do: các chi tiết đó không kiểm được (Medium bị chặn).'
- id: n37
  cau: Bệnh Parkinson liên quan đến mất neuron dopamine ở chất đen.
  loai: dinh-nghia
  nguon:
  - kalia2015
  trich: loss of dopaminergic neurons in the substantia nigra
  vi_tri: Kalia & Lang 2015, tóm tắt
  ket_qua: dung
  ghi_chu: 'Dopamine là chất mà não cần cho vận động: suy ra từ Parkinson (đặc trưng vận động), ghi rõ.'
- id: n38
  cau: Cameron Sepah (2019) nói với The New York Times rằng cái tên "dopamine fasting" "không nên được hiểu theo nghĩa đen" và dopamine "chỉ là một cơ chế giải thích vì sao nghiện có thể được củng cố, và làm nên một cái tên bắt tai".
  loai: lich-su
  nguon:
  - sepah2019
  trich: '"Dopamine is just a mechanism that explains how addictions can become reinforced and makes for a catchy title," he wrote in an email. "The title''s not to be taken literally."'
  vi_tri: Irish Times, đăng lại NYT (7/11/2019)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "chính người phổ biến thuật ngữ — nhà tâm lý học Cameron Sepah (2019)... thực chất đó chỉ là một kỹ thuật kiểm soát kích thích của CBT". Chữ mới: trích đúng lời; bỏ "nhà tâm lý học" (nguồn gọi là "Dr", giáo sư UCSF Medical School) và phần CBT (chỉ có trên Medium, bị chặn). Cũng đổi trong ngộ nhận, quiz và danh mục nguồn.'
- id: n39
  cau: 'Đang tranh cãi: dopamine có phải "thủ phạm" gây nghiện mạng xã hội và game gacha không.'
  loai: nhan
  nhan: tranh-cai
  co_so:
  - fiorillo2003
  - schultz2016
  ly_do: 'Có lập luận cơ chế (Fiorillo 2003 ở động vật; Schultz 2016 về thuốc gây nghiện) nhưng không có nghiên cứu về điện thoại hay game; chưa dẫn được bằng chứng nhân quả ở người. Theo mục 4, "đang tranh cãi" chỉ gần nghĩa; thiếu nhãn "chưa đủ bằng chứng": người giao quyết.'
  nguon:
  - fiorillo2003
  - schultz2016
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "lịch trình củng cố biến đổi vốn đã được chứng minh là tạo hành vi bền bỉ nhất từ thời Skinner... nghiện là đa yếu tố (thói quen, kiểm soát ức chế...)". Chữ mới bỏ hai ý này (không có nguồn đã mở), thêm lời dẫn tới Hỗ trợ.'
- id: n40
  cau: Theo tổng quan của Schultz (2016), thuốc gây nghiện tạo ra, chiếm đoạt và khuếch đại tín hiệu dopamine.
  loai: phat-hien
  nguon:
  - schultz2016
  trich: Drugs of addiction generate, hijack, and amplify the dopamine reward signal
  vi_tri: Schultz 2016, tóm tắt
  ket_qua: dung
  ghi_chu: Mới thêm cho khung n39.
- id: n41
  cau: 'Khung sai số dự đoán: dopamine là tín hiệu "dạy học" của não (thực tế − dự đoán), cho các vùng khác biết có cần cập nhật kỳ vọng hay không.'
  loai: dinh-nghia
  nguon:
  - schultz1997
  - schultz2016
  trich: Rewards produce learning ... Reward prediction errors ... are crucial for basic forms of learning about rewards
  vi_tri: Schultz 2016, tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: Thêm "theo khung này".
- id: n42
  cau: 'Khung incentive salience: dopamine gán sức hút cho các dấu hiệu báo phần thưởng; wanting là muốn, không nhất thiết thích; ví dụ biểu tượng ứng dụng, tiếng "ting" là minh họa của trang.'
  loai: dinh-nghia
  nguon:
  - berridge1998
  trich: dopamine systems may mediate the incentive salience of rewards, modulating their motivational value in a manner separable from hedonia and reward learning
  vi_tri: Tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Dopamine gán... nam châm tâm lý... nhìn thấy biểu tượng ứng dụng... bỗng dưng thấy thôi thúc" như khẳng định. Chữ mới ghi rõ minh họa.'
- id: n43
  cau: 'Ba khung trả lời ba câu hỏi khác nhau nhưng không hoàn toàn khớp: Berridge và Robinson (1998) kết luận dopamine không cần cho học liên hệ khoái cảm, còn Schultz mô tả dopamine như tín hiệu dạy học.'
  loai: phat-hien
  nguon:
  - berridge1998
  - schultz2016
  trich: dopamine systems are not needed ... to mediate predictive associations involved in hedonic reward learning
  vi_tri: Berridge & Robinson, tóm tắt; Schultz 2016
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Ba khung lý thuyết dưới đây không mâu thuẫn nhau". Chữ mới nêu chỗ không khớp. Lý do: Berridge & Robinson 1998 nói thẳng "no" cho vai trò trong hedonic reward learning. Chỗ khó.'
- id: n44
  cau: Theo Peciña và Berridge, hệ opioid tại một điểm nóng rất nhỏ trong nhân accumbens của chuột khuếch đại cái "thích" với vị ngọt ("lớp sơn khoái cảm" là ẩn dụ của trang).
  loai: phat-hien
  nguon:
  - pecina2005
  trich: Our maps indicate that opioid-induced increases in sucrose hedonic impact are generated by a localized cubic millimeter site
  vi_tri: Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Khoái cảm thật sự — liking — được tạo ra bởi hệ opioid tại những "điểm nóng"... Dopamine không cầm cọ vẽ này." Chữ mới bỏ câu cuối và nói là kết quả ở chuột.'
- id: n45
  cau: 'Ghép lại, theo các khung này (và còn tranh luận): dopamine liên quan đến việc muốn theo đuổi và có thể đến việc học xem thứ gì đáng theo đuổi; ở chuột, opioid khuếch đại cái thích.'
  loai: phat-hien
  nguon:
  - berridge1998
  - schultz2016
  - pecina2005
  trich: dopamine may be more important to incentive salience
  vi_tri: Berridge & Robinson, tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "dopamine giúp bạn học cái gì đáng theo đuổi và muốn theo đuổi nó; opioid cho bạn thích nó khi đã có trong tay... người ta lẫn lộn ba việc này thành một". Chữ mới thận trọng, ghi "còn tranh luận".'
- id: n46
  cau: 'Tranh cãi (Áp dụng 1): một cách nghĩ về thông báo điện thoại và gacha (lịch thưởng biến đổi).'
  loai: nhan
  nhan: tranh-cai
  co_so:
  - fiorillo2003
  ly_do: Suy đoán từ nghiên cứu động vật sang hành vi dùng điện thoại; chưa có nghiên cứu về điện thoại. Mục này giữ nhãn "đang tranh cãi" (đổi từ "khá vững").
  nguon:
  - fiorillo2003
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: nhãn khá vững; "thí nghiệm của Fiorillo cho thấy sự không chắc chắn duy trì hoạt động dopamine cho đến phút quyết định. Hiểu điều này giúp bạn tập trung vào... thiết kế môi trường". Chữ mới: "nghiên cứu ở động vật", "bước suy đoán", lời khuyên đổi môi trường thành "hướng thử, không phải khuyến nghị đã kiểm chứng". Lý do: khẳng định quá sức nguồn.'
- id: n47
  cau: 'Một hướng thử, không phải khuyến nghị đã kiểm chứng: đổi môi trường (tắt thông báo, để điện thoại xa tầm tay).'
  loai: loi-khuyen
  nguon:
  - fiorillo2003
  ket_qua: da-lam-mem
