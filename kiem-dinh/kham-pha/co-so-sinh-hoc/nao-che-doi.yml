    ly_do: Trái chiếm ưu thế ngôn ngữ ở đa số người (Gazzaniga 2005); Sperry 1981 mô tả các sở trường bên phải là phi lời, không tuần tự, không gian và hình ảnh; Nielsen 2013 (1.011 người) thấy các nút lệch trái gồm vùng ngôn ngữ, các nút lệch phải gồm mạng chú ý. Có ngoại lệ (J.W. ở Gazzaniga và cộng sự 1996). Nhiều nghiên cứu cùng chiều nhưng chưa có phân tích tổng hợp riêng nên "khá vững".
