    ghi_chu: 'Chữ cũ: "huyền thoại … rất phổ biến ở Việt Nam — từ các bài trắc nghiệm vui trên mạng xã hội đến những khóa học kích hoạt não phải cho trẻ được quảng cáo rầm rộ … Sperry và Gazzaniga chưa bao giờ nói có người não trái và người não phải". Chữ mới: không khẳng định mức độ phổ biến ở Việt Nam; dẫn khảo sát ở Anh và Hà Lan; nói nghiên cứu não chẻ nói về chức năng bán cầu, không về kiểu người. Lý do: không mở được nguồn nào kiểm mức độ phổ biến ở Việt Nam (bài báo VTC News 2016 tìm thấy qua tìm kiếm nhưng không mở được, 523); "chưa bao giờ nói" là phủ định tuyệt đối không kiểm được. Review (Claude Opus 5.5, 10/11/2026): dung. Trang không còn khẳng định mức độ phổ biến ở Việt Nam; dẫn Dekker 2012 cho Anh và Hà Lan (đã kiểm ở n43).'
