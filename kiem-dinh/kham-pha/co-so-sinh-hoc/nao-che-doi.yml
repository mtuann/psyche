    review: dung
  - id: n70
    cau: 'Câu hỏi 1: khi hỏi "bạn vừa thấy gì?", bệnh nhân trả lời "ring", vì chỉ bán cầu trái (nơi có ngôn ngữ) được hỏi, và nó chỉ thấy chữ RING; bán cầu phải thấy KEY nhưng không nói được.'
    loai: phat-hien
    nguon:
      - mcgill
      - sperry1981
    trich: 'But when the visual stimuli were projected in the subjects'' left visual field or when they were asked to feel objects with their left hand, their performance was quite different: they could not describe the stimuli or objects concerned. In fact, for the visual stimuli, they even said that they hadn''t seen anything at all!'
    vi_tri: McGill
    ket_qua: dung
    ghi_chu: 'Ví dụ minh họa (n3); lựa chọn nhiễu "Không thấy gì cả — vì thông tin bị kẹt ở thể chai đã cắt" sai ở chỗ cơ chế: thông tin không "kẹt", đi vào bán cầu phải. gia-dinh.'
    luot_2: dung
    luot_2_nguon: [ "https://authors.library.caltech.edu/records/yqt43-qe292", "https://people.psych.ucsb.edu/gazzaniga/michael/PDF/Forty-five%20years%20of%20split-brain%20research%20and%20still%20going%20strong.pdf" ]
    luot_2_ghi_chu: Kịch bản giả định, nhất quán với Gazzaniga, Bogen & Sperry 1962.
  - id: n71
    cau: 'Câu hỏi 2: nhà nghiên cứu chiếu hình khoảng 1/10 giây để mắt không kịp liếc sang, đảm bảo thông tin chỉ đến một bán cầu.'
    loai: cong-cu
    nguon:
      - gazzaniga1962
      - mcgill
    trich: By flashing these items quickly enough that the subjects' eyes had no time to move, Gazzaniga was able to "talk" to just one of the hemispheres at a time.
    vi_tri: McGill
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://authors.library.caltech.edu/records/yqt43-qe292" ]
    luot_2_ghi_chu: Như n2.
  - id: n72
    cau: 'Câu hỏi 3: khi tay trái (bán cầu phải) chọn đúng chìa khóa, điều đó chứng tỏ bán cầu phải nhận biết được vật thể nhưng không diễn đạt bằng lời; "biết" và "nói được" do hai bán cầu khác nhau đảm nhận khi cầu nối bị cắt.'
    loai: phat-hien
    nguon:
      - sperry1981
      - mcgill
    trich: Thus the right hemisphere cannot express itself in complex sentences, but it clearly can recognize words.
    vi_tri: McGill
    ket_qua: dung
    ghi_chu: Lời giải thích không dựa vào vị trí lựa chọn.
    luot_2: dung
    luot_2_nguon: [ "https://authors.library.caltech.edu/records/yqt43-qe292" ]
  - id: n73
    cau: 'Câu hỏi 4: Sperry nhận giải Nobel năm 1981 cùng David Hubel và Torsten Wiesel; nửa còn lại thuộc về Hubel và Wiesel cho nghiên cứu về xử lý thông tin thị giác.'
    loai: lich-su
    nguon:
      - nobel1981
    trich: one half awarded to Roger W. Sperry … the other half jointly to David H. Hubel and Torsten N. Wiesel "for their discoveries concerning information processing in the visual system"
    vi_tri: nobelprize.org
    ket_qua: dung
    ghi_chu: Lựa chọn nhiễu "1968 cùng Gazzaniga", "1990 cùng Bogen" sai (gia-dinh).
    luot_2: dung
    luot_2_nguon: [ "https://www.nobelprize.org/prizes/medicine/1981/press-release/" ]
    luot_2_ghi_chu: Như n29.
  - id: n74
    cau: 'Câu hỏi 5: thí nghiệm móng vuốt gà/cảnh tuyết cho thấy "người phiên dịch" ở não trái dựng chuyện để lấp chỗ trống thông tin; phân loại tính cách theo não trái/phải không có bằng chứng; bệnh nhân não chẻ sinh hoạt đời thường gần như bình thường.'
    loai: phat-hien
    nguon:
      - mcgill
      - gazzaniga2005
      - nielsen2013
      - sperry1981
    trich: Experiments like this show just how ready the brain is to provide language-based explanations for behaviour.
    vi_tri: McGill; Nielsen 2013; Sperry 1981
    ket_qua: dung
    ghi_chu: Ghép của n32, n44, n68; nhất quán.
    luot_2: dung
    luot_2_nguon: [ "https://mmp.planetary.org/scien/gazzm/gazzm82.htm", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3897366/", "https://authors.library.caltech.edu/records/yqt43-qe292" ]
  - id: n75
    cau: 'Danh sách Nguồn của trang: các mục (Corballis 2014; Dekker 2012; Gazzaniga 1962, 1967, 1978, 1996, 2005; Knecht 2000; Nguyen 2020; Nielsen 2013; Nisbett & Wilson 1977; Sperry 1961, 1968, 1981) đúng tác giả, năm, nhan đề, tạp chí, tập, trang, DOI.'
    loai: lich-su
    nguon:
      - gazzaniga1962
      - gazzaniga1967
      - sperry1961
      - sperry1968
      - gazzaniga1996
    ket_qua: da-sua
    ghi_chu: 'Đã đối chiếu với Crossref và Europe PMC (10/11/2026) cho các mục có DOI. Chữ cũ: danh sách có 6 mục; thêm Corballis, Dekker, Gazzaniga 2005, Knecht, Nguyen, Nielsen, Nisbett & Wilson, Sperry 1981 vì bài dẫn các nguồn này; xếp lại theo bảng chữ cái. Gazzaniga & LeDoux (1978) là sách, không có DOI; Gazzaniga 1996 không ghi DOI trên trang (có thể thêm). Sperry 1961 có trong danh sách nhưng không có dẫn trong thân bài ngoài mục "Sperry (1961)": đúng. Review (Claude Opus 5.5, 10/11/2026): dung. Lượt 2 ghi khong-chac vì không so được với trang. Review so từng mục trên trang với Crossref (10/11/2026): Sperry 1961 Science 133(3466) 1749–1757; Sperry 1968 Am Psychol 23(10) 723–733; Gazzaniga & Sperry 1967 Brain 90(1) 131–148; Gazzaniga 2005 Nat Rev Neurosci 6(8) 653–659; Nisbett & Wilson 1977 Psychol Rev 84(3) 231–259; Dekker 2012 Front Psychol 3, 429; Nielsen 2013 PLoS ONE 8(8) e71275: khớp. Gazzaniga 1962, 1996, Knecht 2000, Nguyen 2020 khớp bản ghi Europe PMC (Nguyen 2020: Nguyễn Đức Liên, Đặng Anh Tuấn, Cao Vũ Hùng, viết APA đúng). Gazzaniga & LeDoux 1978 (Plenum, New York) khớp tài liệu 90 của Gazzaniga 2005; bài giảng Nobel Sperry 1981 khớp nobelprize.org. Review thêm DOI cho Gazzaniga và cộng sự 1996 (10.1093/brain/119.4.1255).'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.1073/pnas.48.10.1765", "https://people.psych.ucsb.edu/gazzaniga/michael/PDF/Forty-five%20years%20of%20split-brain%20research%20and%20still%20going%20strong.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3743825/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3897366/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3475349/", "https://pubmed.ncbi.nlm.nih.gov/11099452/", "https://pubmed.ncbi.nlm.nih.gov/32109876/", "https://pubmed.ncbi.nlm.nih.gov/8813288/", "https://api.openalex.org/works/doi:10.1037/0033-295X.84.3.231", "https://api.openalex.org/works/doi:10.1126/science.133.3466.1749" ]
    luot_2_ghi_chu: "Không được mở trang nên không so được từng mục với danh sách Nguồn của trang. Đã đối chiếu metadata thật (tên bài, tạp chí, tập, trang, năm) cho Gazzaniga 1962, 1967, 1996, 2005, Corballis 2014, Dekker 2012, Knecht 2000, Nguyen 2020, Nielsen 2013, Nisbett & Wilson 1977, Sperry 1961: đều đúng với bản ghi. Chưa kiểm: Gazzaniga & LeDoux 1978, Sperry 1968 và 1981. Cần so với danh sách trên trang (V1 Crossref)."
    review: dung
