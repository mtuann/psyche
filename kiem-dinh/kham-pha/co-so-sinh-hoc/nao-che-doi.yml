    ly_do: Sperry mô tả mỗi bán cầu có vùng nhận thức riêng, gần như tách biệt (Sperry 1981), nhưng Gazzaniga (2005) viết rằng trong hàng chục trường hợp ghi nhận, chưa trường hợp nào cho phép khẳng định mỗi bán cầu có ý thức đầy đủ về bản thân. Hai nguồn bậc 1 không đồng ý về mức độ; câu hỏi liên quan khái niệm "ý thức", không phân xử được bằng dữ liệu.
