    trich: when the patient is asked to explain why his left hand is pointing at the shovel, his talking hemisphere—the left one—has no access to the information seen by the right, and so instead interprets his behaviour by responding that the reason is that you use a shovel to clean out the chicken house!
    vi_tri: 'McGill (nt); Weber State: "Immediately the left hemisphere made up a story about what it could see --- the chicken. It said the right hemisphere chose the shovel to clean out a chicken shed."'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: có dấu nháy kép quanh câu trả lời và "không chút ngập ngừng". Chữ mới: bỏ dấu nháy (diễn lại ý) và bỏ "không chút ngập ngừng" (giữ "ngay", theo Weber State). Review (Claude Opus 5.5, 10/11/2026): dung. Khớp McGill và Weber State ("to clean out a chicken shed"); trang không đặt trong nháy, diễn lại ý.'
    luot_2: dung
