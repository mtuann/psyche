  - id: n43
    cau: 'Đã bị bác bỏ: "người não trái" và "người não phải".'
    loai: nhan
    nhan: bac-bo
    co_so:
      - nielsen2013
      - corballis2014
      - dekker2012
    ly_do: 'Khẳng định bị bác là "có người thuộc tuýp não trái (logic) và tuýp não phải (sáng tạo)". Nielsen 2013 (1.011 người, 7–29 tuổi), phép kiểm tra trực tiếp lớn nhất: dữ liệu "not consistent with a whole-brain phenotype of greater left-brained or greater right-brained network strength"; Corballis 2014 (tổng quan): cặp não trái/phải "owe more to the power of myth than to the scientific evidence", tư duy sáng tạo "favoring neither hemisphere"; Dekker 2012 xếp "left- and right brain learners" vào huyền thoại thần kinh. Không có bằng chứng ủng hộ nào trong các nguồn đã mở. Review (10/11/2026) chốt Đã bị bác bỏ: phép kiểm tra trực tiếp đủ mạnh thất bại, bằng chứng gốc mà huyền thoại dựa vào (nghiên cứu não chẻ) nói về chức năng chứ không về kiểu người; thẻ ngộ nhận nao-trai-phai trong src/data/ngo-nhan.yml cũng dùng bac-bo với cùng căn cứ.'
    nguon:
      - nielsen2013
      - corballis2014
      - dekker2012
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Không có bằng chứng nào cho thấy …; Nghiên cứu não chẻ nói về chuyên biệt hóa chức năng …; Các bài kiểm tra trên mạng không có cơ sở khoa học." Chữ mới: thêm dẫn Nielsen 2013 và Corballis 2014; đổi "không có cơ sở khoa học" thành "chưa có cơ sở khoa học". Lý do: thêm nguồn cho nhãn. Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại Nielsen 2013, Corballis 2014, Dekker 2012 (toàn văn Europe PMC): ba câu trích khớp; "hơn 80%" khớp Bảng (Anh 91%, Hà Lan 86% với câu "Differences in hemispheric dominance (left brain, right brain) can help explain individual differences amongst learners"). Nhãn Đã bị bác bỏ giữ (lý do ở ly_do); không hạ xuống Đang tranh cãi vì không có bằng chứng chất lượng nào ủng hộ phía kia.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC3743825/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3897366/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3475349/" ]
    luot_2_ghi_chu: "Ở mức biên: chủ yếu một phân tích 1.011 người + tổng quan, nhưng không có bằng chứng ủng hộ; hợp lý với 'Đã bị bác bỏ' cho kiểu người não trái/phải."
