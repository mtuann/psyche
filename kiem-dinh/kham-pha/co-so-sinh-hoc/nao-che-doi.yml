    ket_qua: da-sua
    ghi_chu: 'Câu thêm khi sửa n35. Cụm "dưới thể chai" là diễn giải: nguồn nói tài nguyên xử lý được chia sẻ sau phẫu thuật; viết là "có các đường chia sẻ nguồn lực xử lý" chưa nói rõ cơ chế dưới vỏ. Review (Claude Opus 5.5, 10/11/2026): sai. Chữ trên trang: "có các đường chia sẻ nguồn lực xử lý dưới thể chai". Gazzaniga 2005 (mốc 1982) chỉ nói "Holtzman showed that processing resources are shared between the two hemispheres even after they have been surgically separated"; không nói tới đường nối dưới thể chai (cơ chế), và ghi_chu lượt 1 cũng nói chữ cuối không nêu cơ chế, khác với trang. Chữ mới: "ngay cả sau khi đã bị tách bằng phẫu thuật, chúng vẫn dùng chung nguồn lực xử lý (Gazzaniga, 2005)".'
