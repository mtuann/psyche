    ghi_chu: 'Chữ cũ: "não ta rất giỏi bịa ra lý do cho những việc ta làm mà ta không hiểu rõ động cơ. Trong đời thường, điều này xuất hiện mỗi khi ta chắc nịch giải thích …". Chữ mới: câu có nguồn (Nisbett & Wilson) và "có thể xuất hiện". Lý do: câu cũ là khái quát chưa có nguồn từ bệnh nhân sang người bình thường. Review (Claude Opus 5.5, 10/11/2026): dung. Nisbett & Wilson 1977, tóm tắt: "their reports are based on a priori, implicit causal theories". Khớp.'
