nhan_dinh:
  - id: n1
    cau: 'Mô tả: khi thể chai bị cắt, hai bán cầu không còn trao đổi thông tin trực tiếp và mỗi bên xử lý riêng phần mình.'
    loai: phat-hien
    nguon:
      - sperry1981
    trich: The operation severed all neural cross connections for direct communication between the two hemispheres.
    vi_tri: Nobel lecture, mục "Contrasting evidence from commissurotomy"
    ket_qua: da-lam-mem
    ghi_chu: 'Mô tả (description). Chữ cũ: "mỗi bán cầu não sống một đời riêng". Chữ mới: "hai bán cầu không còn trao đổi thông tin trực tiếp và mỗi bên xử lý riêng phần mình". Lý do: "sống một đời riêng" mạnh hơn nguồn; Sperry nói "gần như tách biệt" về tri giác, học và trí nhớ, và Gazzaniga (2005) nói chưa trường hợp nào cho phép khẳng định mỗi bán cầu có ý thức đầy đủ về bản thân. Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại bài giảng Nobel của Sperry (1981): "The operation severed all neural cross connections for direct communication between the two hemispheres"; Mở lại Gazzaniga (2005), bản PDF của tác giả: "blocks the interhemispheric transfer of perceptual, sensory, motor, gnostic…". Mô tả trên trang khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://authors.library.caltech.edu/records/yqt43-qe292", "https://people.psych.ucsb.edu/gazzaniga/michael/PDF/Forty-five%20years%20of%20split-brain%20research%20and%20still%20going%20strong.pdf" ]
    luot_2_ghi_chu: "Gazzaniga 2005: cắt thể chai chặn chuyển thông tin tri giác, cảm giác, vận động giữa hai bán cầu."
    review: dung
  - id: n2
    cau: Hai chữ được chiếu chớp nhoáng khoảng 1/10 giây khi bệnh nhân nhìn một điểm giữa màn hình, nên mắt không kịp di chuyển.
    loai: cong-cu
    nguon:
      - gazzaniga1962
      - mcgill
    trich: Visual tests were conducted with tachistoscopic presentation of stimuli at 1/10 and 1/100 sec.
    vi_tri: 'Gazzaniga 1962, tr. 1766; McGill: "By flashing these items quickly enough that the subjects'' eyes had no time to move"'
    ket_qua: dung
    ghi_chu: Bài báo 1962 dùng 1/10 và 1/100 giây; trang nói "chỉ 1/10 giây" như ví dụ.
    luot_2: dung
    luot_2_nguon: [ "https://authors.library.caltech.edu/records/yqt43-qe292" ]
    luot_2_ghi_chu: Bài 1962 dùng 1/10 và 1/100 giây; lý do mắt không kịp liếc là lẽ thường của kỹ thuật, bài không nói rõ. Cặp chữ là minh họa.
  - id: n3
    cau: Trong ví dụ KEY/RING, miệng bệnh nhân nói "ring", còn tay trái lấy ra chiếc chìa khóa, thứ mà miệng khẳng định không thấy.
    loai: phat-hien
    nguon:
      - gazzaniga1962
      - mcgill
    trich: when the name of an object is projected so that a subject with a severed corpus callosum sees it with the right hemisphere only, he will say that he doesn't see anything … But if the experimenter then asks the subject to use his left hand to choose a card with a drawing of the object whose name he saw
    vi_tri: McGill, đoạn về chữ chiếu vào bán cầu phải
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "tay trái … lại chính xác lấy ra chiếc chìa khóa". Chữ mới: "lại lấy ra chiếc chìa khóa", thêm câu nói đây là ví dụ minh họa và ở bệnh nhân W.J. tay trái chọn đúng ở mức cao hơn ngẫu nhiên (hơn mức ngẫu nhiên 30%) chứ không phải lúc nào cũng đúng (Gazzaniga 1962, tr. 1766). Cặp chữ KEY/RING chưa tìm thấy trong nguồn đã mở (gia-dinh: tình huống giả định). Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại Gazzaniga, Bogen & Sperry (1962), PDF ở authors.library.caltech.edu (tr. 1766): nửa trái thị trường "profound agnosia", tay trái chọn đúng "at a level 30 per cent above chance". Trang ghi rõ KEY/RING là ví dụ minh họa và W.J. không phải lúc nào cũng đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://authors.library.caltech.edu/records/yqt43-qe292" ]
    luot_2_ghi_chu: "Kịch bản minh họa, phù hợp với Gazzaniga, Bogen & Sperry 1962 (nửa trái thị trường: không nói được, tay trái chọn đúng ở mức trên ngẫu nhiên). Gazzaniga, Bogen & Sperry 1962 không dùng cặp KEY/RING."
    review: dung
  - id: n4
    cau: 'W.J.: tay trái chọn đúng hình ở mức cao hơn ngẫu nhiên (khoảng 30% trên mức ngẫu nhiên với hình đơn giản), chứ không phải lúc nào cũng đúng.'
    loai: so-lieu
    nguon:
      - gazzaniga1962
    trich: the subject can retrieve the corresponding figure at a level 30 percent above chance from among a series of five or more patterns on cards placed within easy reach of the left hand. He is unable to perform above chance, however, when colors are used
    vi_tri: Gazzaniga 1962, tr. 1766
    ket_qua: dung
    ghi_chu: Câu thêm khi sửa n3, n19.
    luot_2: dung
    luot_2_nguon: [ "https://authors.library.caltech.edu/records/yqt43-qe292" ]
    luot_2_ghi_chu: "Khớp: 'cao hơn ngẫu nhiên 30%' cho hình, số, chữ đơn giản; không hơn ngẫu nhiên với màu."
  - id: n5
    cau: Mọi thứ ở nửa trái tầm nhìn được xử lý bởi bán cầu phải, và nửa phải tầm nhìn đi vào bán cầu trái; ở người bình thường cũng vậy.
    loai: dinh-nghia
    nguon:
      - mcgill
    trich: Information projected in the subjects' left visual field was received by the right hemisphere, while information projected in the right visual field was received by the left.
    vi_tri: McGill, đoạn thứ ba
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://authors.library.caltech.edu/records/yqt43-qe292", "https://www.nobelprize.org/prizes/medicine/1981/sperry/lecture/" ]
    luot_2_ghi_chu: Nửa phải thị trường vào bán cầu trái; chiều ngược lại và 'người bình thường cũng vậy' là giải phẫu đường thị giác chéo chuẩn.
  - id: n6
    cau: Tay phải do bán cầu trái điều khiển, tay trái do bán cầu phải điều khiển.
    loai: dinh-nghia
    nguon:
      - embryo-sperry
    trich: he knew that each hemisphere of the brain is responsible for movement and vision on the opposite side of the body
    vi_tri: Embryo Project, mục "Roger Sperry's Split Brain Experiments"
    ket_qua: dung
    ghi_chu: Nguồn bậc 3; kiến thức giải phẫu cơ bản, trùng khớp mô tả của Gazzaniga 1962 (tay trái liên quan bán cầu không trội).
    luot_2: dung
    luot_2_nguon: [ "https://authors.library.caltech.edu/records/yqt43-qe292" ]
    luot_2_ghi_chu: Điều khiển tay chéo bên (đường chính).
  - id: n7
    cau: Ngôn ngữ nằm ở bán cầu trái ở đa số mọi người; bán cầu phải ở hầu hết mọi người gần như không nói được.
    loai: phat-hien
    nguon:
      - gazzaniga2005
      - sperry1981
      - knecht2000
    trich: In the vast majority of the population, the left hemisphere is dominant for language
    vi_tri: 'Gazzaniga 2005, đoạn sau "Akelaitis got it wrong"; Sperry 1981: "in the typical righthander brain … is not only mute and agraphic"'
    ket_qua: dung
    ghi_chu: 'Knecht 2000: ưu thế ngôn ngữ bên phải ở 4% người thuận tay phải hẳn, 27% người thuận tay trái hẳn.'
    luot_2: dung
    luot_2_nguon: [ "https://people.psych.ucsb.edu/gazzaniga/michael/PDF/Forty-five%20years%20of%20split-brain%20research%20and%20still%20going%20strong.pdf", "https://pubmed.ncbi.nlm.nih.gov/11099452/" ]
    luot_2_ghi_chu: "Knecht 2000: ưu thế ngôn ngữ phải gặp 4–27% tùy mức thuận tay trái."
  - id: n8
    cau: Thể chai là một "cây cầu" gồm khoảng 200 triệu sợi thần kinh nối hai bán cầu.
    loai: so-lieu
    nguon:
      - mcgill
    trich: The largest of these bundles, known as the corpus callosum, consists of about 200 million axons running from one hemisphere to the other.
    vi_tri: McGill, đoạn đầu
    ket_qua: dung
    ghi_chu: 'Câu cũ "thông tin qua lại tức thì": đã sửa thành "rất nhanh", xem n9.'
    luot_2: dung
    luot_2_nguon: [ "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC13536589/fullTextXML", "https://pmc.ncbi.nlm.nih.gov/articles/PMC13093777/" ]
    luot_2_ghi_chu: Hai tổng quan mở (2026) cho 180–200+ triệu sợi; 'khoảng 200 triệu' ổn. Nobel 1981 chỉ nói 'millions of nerve fibers'.
  - id: n9
    cau: Ở người bình thường thông tin qua lại rất nhanh giữa hai bán cầu qua thể chai nên ta không nhận ra sự chia chéo; nếu cắt cầu thì mỗi bán cầu chỉ biết những gì phía mình nhận được.
    loai: phat-hien
    nguon:
      - sperry1961
      - sperry1981
    trich: Normally, right and left brain halves are in direct communication through a series of commissures
    vi_tri: Sperry 1961, mục "Functions of the Corpus callosum"; Sperry 1981
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "thông tin qua lại tức thì". Chữ mới: "rất nhanh". Lý do: "tức thì" là nói quá; nguồn chỉ nói "direct communication". Review (Claude Opus 5.5, 10/11/2026): dung. Chữ "rất nhanh" trên trang; Sperry 1961, 1981 nói "direct communication". Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://people.psych.ucsb.edu/gazzaniga/michael/PDF/Forty-five%20years%20of%20split-brain%20research%20and%20still%20going%20strong.pdf", "https://authors.library.caltech.edu/records/yqt43-qe292" ]
    luot_2_ghi_chu: Còn các đường dưới vỏ (xem n37) nên 'chỉ biết phía mình' đúng cho các chức năng được kiểm trong bài.
    review: dung
  - id: n10
    cau: Sperry ở Caltech cắt thể chai của mèo và khỉ để xem mỗi bán cầu hoạt động ra sao; con vật học bằng một mắt (một bán cầu) không chuyển được sang bán cầu kia.
    loai: phat-hien
    nguon:
      - sperry1961
      - embryo-sperry
    trich: Again, statistical comparison of the learning curves for the first and second paws indicated complete absence of any transfer of learning from one to the other hemisphere.
    vi_tri: Sperry 1961, đoạn về mèo (mắt có miếng bịt của Myers) và khỉ
    ket_qua: dung
    ghi_chu: Chi tiết "hình tròn có thức ăn, hình thập thì không" là ví dụ minh họa (gia-dinh), nguồn dùng ví dụ tròn/thập tương tự.
    luot_2: dung
    luot_2_nguon: [ "https://authors.library.caltech.edu/records/yqt43-qe292", "https://people.psych.ucsb.edu/gazzaniga/michael/PDF/Forty-five%20years%20of%20split-brain%20research%20and%20still%20going%20strong.pdf", "https://www.nobelprize.org/prizes/medicine/1981/sperry/lecture/" ]
    luot_2_ghi_chu: "Nobel lecture: các nghiên cứu động vật thập niên 1950, Myers (Chicago) và Sperry (Caltech)."
