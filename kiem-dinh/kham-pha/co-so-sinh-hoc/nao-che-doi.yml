    trich: Each brain half, in other words, appeared to have its own, largely separate, cognitive domain with its own private perceptual, learning and memory experiences, all of which were seemingly oblivious of corresponding events in the other hemisphere.
    vi_tri: Sperry 1981, mục "Contrasting evidence from commissurotomy"
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "mỗi bán cầu dường như có cảm giác, nhận thức, ý muốn riêng và tách biệt — như hai dòng ý thức chạy song song". Chữ mới: "vùng nhận thức riêng, gần như tách biệt — tri giác, quá trình học và chuỗi trí nhớ riêng … như hai dòng nhận thức chạy song song". Lý do: nguồn đã mở không nói "ý muốn" hay "ý thức" song song; dẫn Sperry 1968 (chưa mở được tóm tắt) kèm bài giảng Nobel làm căn cứ. Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại bài giảng Nobel của Sperry (1981): "Each brain half … appeared to have its own, largely separate, cognitive domain with its own private perceptual, learning and memory experiences"; "its own separate chain of memories". Khớp trang. Sperry 1968 không mở được (không có trong bộ Internet Archive); câu dựa vào bài giảng Nobel, trang đã ghi.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nobelprize.org/prizes/medicine/1981/sperry/lecture/" ]
    review: dung
