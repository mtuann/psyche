    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Thuận tay liên quan đến phân bố chức năng vận động, không phải tuýp tính cách. Đa số người thuận tay trái vẫn có trung tâm ngôn ngữ ở bán cầu trái." Chữ mới: số liệu Knecht; "tư duy sáng tạo không nghiêng hẳn về bán cầu nào" (Corballis 2014). Lý do: câu cũ không có nguồn; "đa số" khớp 73% ở người thuận tay trái hẳn. Chỉ đọc tóm tắt. Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại tóm tắt Knecht 2000 (Europe PMC): 326 người khỏe mạnh, 4%, 15%, 27%. Khớp; 73% người thuận tay trái hẳn vẫn trội trái nên "đa số" đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/11099452/" ]
    luot_2_ghi_chu: "73% người thuận tay trái hẳn vẫn trội trái: 'đa số' đúng."
