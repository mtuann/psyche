  - id: n12
    cau: Ca mổ cắt các cầu nối giữa hai bán cầu do bác sĩ phẫu thuật thần kinh Joseph Bogen và Philip Vogel thực hiện ở Los Angeles (đầu thập niên 1960).
    loai: lich-su
    nguon:
      - sperry1981
      - gazzaniga2005
      - gazzaniga1962
    trich: These were patients of the neurosurgeons Joseph Bogen and his chief, Phillip Vogel of the White Memorial Medical Center in Los Angeles.
    vi_tri: Sperry 1981, mục "Contrasting evidence from commissurotomy"; Gazzaniga 1962 (tests carried out from the 6th to 20th weeks after surgery; bài báo duyệt 2/8/1962)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Năm 1962, … thực hiện một ca mổ". Chữ mới: "Đầu thập niên 1960". Lý do: bài báo 1962 cho biết thử nghiệm từ tuần 6 đến tuần 20 sau mổ, nên ca mổ ở khoảng 1962 hoặc ngay trước đó; năm chính xác không ghi trong nguồn đã mở. Tiêu đề mục đổi tương ứng, giữ id cũ. Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại bài giảng Nobel của Sperry (1981): "patients of the neurosurgeons Joseph Bogen and his chief, Phillip Vogel of the White Memorial Medical Center in Los Angeles". "Đầu thập niên 1960" khớp bài 1962 (thử nghiệm 6–20 tuần sau mổ). Tiêu đề mục đã đổi, id cũ giữ.'
