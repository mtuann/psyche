    loai: lich-su
    nguon:
      - gazzaniga1967
      - sperry1981
    trich: Gazzaniga, M. S. & Sperry, R. W. Language after section of the cerebral commissures. Brain, 1967, 90, (I), 131-148.
    vi_tri: Sperry 1981, tài liệu tham khảo 8 (nhan đề, tập, trang); chữ trong bài Brain không mở được
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "một trong những minh họa nổi tiếng nhất, được mô tả trong bài báo … Brain (Gazzaniga & Sperry, 1967)" và tiêu đề mục "thí nghiệm KEY/RING". Chữ mới: "ví dụ minh họa cho kiểu bài kiểm tra mà nhóm Sperry và Gazzaniga dùng; công trình … được trình bày trong bài …"; tiêu đề đổi, giữ id cũ. Lý do: chưa mở được toàn văn bài Brain 1967 để kiểm cặp chữ KEY/RING; không tìm thấy nó trong Sperry 1981 hay Gazzaniga 2005. Ghi cho người giao: hình thi-nghiem-key-ring (chú thích "Nguồn: mô tả theo Gazzaniga & Sperry (1967)") và câu hỏi 1 dùng tên "thí nghiệm KEY/RING"; hình giữ nguyên. Review (Claude Opus 5.5, 10/11/2026): dung. Bài Brain 1967 vẫn không mở được (không có trong bộ wikipedia-scholarly-sources-corpus của Internet Archive, OUP có tường phí); nhan đề, tập, trang khớp Crossref. Trang gọi KEY/RING là ví dụ minh họa: đúng mức. Để khớp, review sửa thêm: câu hỏi 1 "Trong thí nghiệm KEY/RING" thành "Trong ví dụ KEY/RING"; chú thích hình sửa (xem n34).'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/6023071/" ]
    luot_2_ghi_chu: Đã đối chiếu nhan đề, tạp chí, năm, tập, trang. Chỉ đọc bản ghi, không đọc bài; KEY/RING là minh họa của site.
