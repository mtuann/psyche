  - id: n33
    cau: 'Gazzaniga và LeDoux (1978) đưa ra khái niệm "người phiên dịch" của não trái: hệ thống tạo ra "câu chuyện" vượt quá thông tin thực sự có, theo họ nằm dưới nhu cầu tìm lời giải thích của con người.'
    loai: lich-su
    nguon:
      - gazzaniga2005
    trich: Gazzaniga and LeDoux introduced the concept of a left brain 'interpreter', which creates a schema or 'story' about events that goes beyond the actual available information. They postulated that the interpreter underlies the human drive to seek explanations for why events occur
    vi_tri: Gazzaniga 2005, Timeline (1971–1973)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Gazzaniga gọi cơ chế này là người phiên dịch: một hệ thống ở não trái luôn tìm cách kể một câu chuyện mạch lạc về những gì ta làm — kể cả khi nó không thực sự biết tại sao". Chữ mới bám nguồn (câu chuyện vượt quá thông tin có sẵn; nhu cầu tìm lời giải thích). Sách 1978 là nguồn phụ; chưa đọc được. Review (Claude Opus 5.5, 10/11/2026): dung. Mở lại Gazzaniga (2005), bản PDF của tác giả, mốc thời gian: "Gazzaniga and LeDoux introduced the concept of a left brain ‘interpreter’, which creates a schema or ‘story’ about events that goes beyond the actual available information. They postulated that the interpreter underlies the human drive to seek explanations"; tài liệu 90 là The Integrated Mind (Plenum, 1978). Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://people.psych.ucsb.edu/gazzaniga/michael/PDF/Forty-five%20years%20of%20split-brain%20research%20and%20still%20going%20strong.pdf" ]
    luot_2_ghi_chu: Năm 1978 theo mốc thời gian của Gazzaniga 2005.
