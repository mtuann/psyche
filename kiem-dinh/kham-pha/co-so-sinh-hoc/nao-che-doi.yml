    cau: 'Ngộ nhận: ở 326 người khỏe mạnh, ưu thế ngôn ngữ bên phải gặp ở 4% người thuận tay phải hẳn, 15% người thuận cả hai tay và 27% người thuận tay trái hẳn; nên đa số người thuận tay trái vẫn có ưu thế ngôn ngữ ở bán cầu trái.'
    loai: so-lieu
    nguon:
      - knecht2000
    trich: The incidence of right-hemisphere language dominance was found to increase linearly with the degree of left-handedness, from 4% in strong right-handers (handedness = 100) to 15% in ambidextrous individuals and 27% in strong left-handers (handedness = -100).
