    cau: Sperry tổng kết ở Science 1961 rằng não bị chẻ "trong nhiều khía cạnh hành xử như hai bộ não riêng biệt".
    loai: lich-su
    nguon:
      - sperry1961
    trich: The split brain behaves in many respects like two separate brains
    vi_tri: Sperry 1961, nhan đề phụ
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1126/science.133.3466.1749" ]
