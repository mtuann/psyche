    cau: Theo Gazzaniga kể lại, một bệnh nhân được cho xem đồng thời móng vuốt gà ở bán cầu trái và cảnh tuyết ở bán cầu phải; tay phải chọn con gà, tay trái chọn xẻng xúc tuyết, đều đúng.
    loai: phat-hien
    nguon:
      - mcgill
      - weber
    trich: In the test shown here, the patient's left hand is pointing at the card with a picture of a snow shovel, because the right hemisphere, which controls this hand, has seen the projected image of a winter scene. Meanwhile, his right hand is pointing at the card with a picture of a chicken, because his left hemisphere has seen the image of a chicken's foot.
    vi_tri: McGill, đoạn về "left-hemisphere interpreter"; Weber State, bước 1–2 (ghi nguồn Gazzaniga 1998, Sci Am)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Bệnh nhân P.S. được cho xem …". Chữ mới: "Theo Gazzaniga kể lại, một bệnh nhân …". Lý do: tên bệnh nhân "P.S." và chi tiết của sách Gazzaniga & LeDoux (1978) không mở được (sách in, không có bản mở); thí nghiệm mô tả qua McGill và Weber State (bậc 3, dẫn Gazzaniga 1998). Chi tiết "bệnh nhân" và kết quả khớp hai nguồn. Review (Claude Opus 5.5, 10/11/2026): dung. Câu ghi "Theo Gazzaniga kể lại"; mô tả khớp McGill, Weber State và trang lưu bài Scientific American 1998 mà lượt 2 mở. Nguồn bậc 3 cho chi tiết thí nghiệm; ý chính (người phiên dịch) có Gazzaniga 2005 (bậc 1).'
    luot_2: dung
    luot_2_nguon: [ "https://mmp.planetary.org/scien/gazzm/gazzm82.htm" ]
    luot_2_ghi_chu: Trang của chính Gazzaniga (kể lại thí nghiệm, Sci. Am. 1998).
