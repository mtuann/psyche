  - id: n34
    cau: 'Hình thi-nghiem-key-ring: ví dụ minh họa KEY ở nửa trái, RING ở nửa phải thị trường; bán cầu phải thấy KEY (tay trái chọn chìa khóa), bán cầu trái thấy RING (miệng nói "ring"); chú thích: minh họa kiểu bài kiểm tra của nhóm Sperry và Gazzaniga, cách làm theo Gazzaniga, Bogen & Sperry (1962).'
    loai: phat-hien
    nguon:
      - gazzaniga1962
      - sperry1981
      - mcgill
    trich: 'When very simple geometric designs, or single large numbers or letters are flashed to this half-field, the subject can retrieve the corresponding figure at a level 30 per cent above chance from among a series of five or more patterns on cards placed within easy reach of the left hand.'
    vi_tri: 'Gazzaniga, Bogen & Sperry 1962, tr. 1766; Sperry 1981; McGill'
    ket_qua: da-sua
    ghi_chu: 'Hình ghi rõ "mô tả thiết kế, không phải số liệu". Hình không có số. Ghi lại cho người giao: chú thích hình ghi "Nguồn: mô tả theo Gazzaniga & Sperry (1967)" và gọi là "thí nghiệm kinh điển"; chúng tôi chưa kiểm được cặp chữ KEY/RING trong bài Brain 1967 (xem n27). Hình giữ nguyên. Review (Claude Opus 5.5, 10/11/2026): sai. Chú thích cũ: "Sơ đồ mô tả thiết kế thí nghiệm kinh điển của Gazzaniga và Sperry (1967) … Nguồn: mô tả theo Gazzaniga & Sperry (1967)", tiêu đề hình "Thí nghiệm KEY / RING". Cặp chữ KEY/RING không kiểm được ở bài 1967 (không mở được) hay ở các nguồn đã mở, và trang đã gọi nó là ví dụ minh họa: hình nói khác trang. Chú thích mới: "Sơ đồ minh họa kiểu bài kiểm tra mà nhóm Sperry và Gazzaniga dùng ở bệnh nhân não chẻ … Cặp chữ KEY/RING là ví dụ minh họa. Nguồn: cách làm theo Gazzaniga, Bogen & Sperry (1962)."; tiêu đề hình "Ví dụ KEY / RING (minh họa thiết kế, không phải số liệu)"; aria-label "Sơ đồ minh họa bài kiểm tra KEY RING ở bệnh nhân não chẻ". Hình đã sửa: cần thêm thi-nghiem-key-ring vào HINH_DA_SUA (tests/chuyen.test.mjs).'
    luot_2: dung
    luot_2_nguon: [ "https://authors.library.caltech.edu/records/yqt43-qe292", "https://people.psych.ucsb.edu/gazzaniga/michael/PDF/Forty-five%20years%20of%20split-brain%20research%20and%20still%20going%20strong.pdf" ]
    luot_2_ghi_chu: Minh họa; khớp mô tả Gazzaniga, Bogen & Sperry 1962.
    review: sai
  - id: n35
    cau: 'Khá vững: khi cầu nối bị cắt, hai bán cầu không còn trao đổi thông tin trực tiếp.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - gazzaniga2005
      - sperry1981
      - gazzaniga1962
    ly_do: Nhiều nhóm độc lập (Caltech, Harvard, Yale, Ohio, Dartmouth, UC Davis, Ý) cùng thấy kiểu kết quả này suốt hơn 40 năm (Gazzaniga 2005), Zaidel tái khẳng định bằng kỹ thuật kính tiếp xúc (Sperry 1981). Chưa có phân tích tổng hợp hay tái lập đăng ký trước (chỉ vài chục bệnh nhân), nên chưa đủ "vững chắc" theo thước đo; không có thất bại tái lập nào trong nguồn đã mở.
    nguon:
      - gazzaniga2005
      - sperry1981
      - gazzaniga1962
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: khung "Vững chắc: hai bán cầu hoạt động độc lập khi cầu nối bị cắt" (mỗi bán cầu xử lý thông tin độc lập; hàng chục năm nghiên cứu). Chữ mới: khung "Khá vững: khi cầu nối bị cắt, hai bán cầu không còn trao đổi thông tin trực tiếp", nêu giới hạn (nhóm rất nhỏ, chưa tổng hợp) và nói hai bán cầu không độc lập hoàn toàn (Holtzman và Gazzaniga 1982 thấy chúng chia sẻ nguồn lực xử lý, theo Gazzaniga 2005). Lý do: nhãn "Vững chắc" đòi phân tích tổng hợp hoặc hai tái lập lớn; "độc lập" mạnh hơn nguồn. Đổi nhãn làm đổi dòng Tóm tắt nhanh. Review (Claude Opus 5.5, 10/11/2026): dung. Nhãn Khá vững đạt thước đo mục 4: nhiều nhóm độc lập cùng chiều suốt hơn 40 năm (Gazzaniga 2005: Caltech, Harvard, Yale, Ohio, Dartmouth, UC Davis, Ý), nhưng vài chục bệnh nhân, không có phân tích tổng hợp hay tái lập đăng ký trước, nên chưa đạt Vững chắc. Đổi từ Vững chắc là đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://people.psych.ucsb.edu/gazzaniga/michael/PDF/Forty-five%20years%20of%20split-brain%20research%20and%20still%20going%20strong.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC7305066/" ]
    luot_2_ghi_chu: "Bằng chứng: nhiều ca qua nhiều nhóm, không có phân tích tổng hợp/tái lập đăng ký trước; 'Khá vững' không vượt thước đo."
    review: dung
