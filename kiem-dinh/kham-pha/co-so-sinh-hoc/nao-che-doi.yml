    trich: The Nobel Prize in Physiology or Medicine 1981 was divided, one half awarded to Roger W. Sperry "for his discoveries concerning the functional specialization of the cerebral hemispheres", the other half jointly to David H. Hubel and Torsten N. Wiesel "for their discoveries concerning information processing in the visual system"
    vi_tri: nobelprize.org, trang tổng kết 1981
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chính phát hiện này (hai dòng ý thức), cùng toàn bộ công trình về chuyên biệt hóa …, đã mang lại cho ông giải Nobel … chia cùng David Hubel và Torsten Wiesel". Chữ mới: "Toàn bộ công trình về chuyên biệt hóa chức năng hai bán cầu đã mang lại … một nửa giải; nửa còn lại chia cho Hubel và Wiesel, vì công trình về xử lý thông tin thị giác". Lý do: lời trao giải nói về chuyên biệt hóa chức năng, không riêng "hai dòng ý thức"; Sperry nhận 1/2, Hubel và Wiesel mỗi người 1/4. Review (Claude Opus 5.5, 10/11/2026): dung. Trang tổng kết Nobel 1981: một nửa cho Sperry "for his discoveries concerning the functional specialization of the cerebral hemispheres", nửa còn lại cho Hubel và Wiesel. Khớp.'
    luot_2: dung
