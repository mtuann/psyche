nhan_dinh:
  - id: n1
    cau: Học ngắt quãng giúp nhớ lâu hơn học dồn trong một đêm, và tự kiểm tra giúp nhớ lâu hơn đọc lại (mô tả của trang).
    loai: phat-hien
    nguon:
      - cepeda2008
      - rowland2014
    trich: Many spacing studies have shown that no gap results in worse final test performance than does a brief gap.
    vi_tri: Cepeda 2008, mở bài; Rowland 2014, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Mô tả (description). Chữ cũ: "Học ngắt quãng và tự kiểm tra giúp nhớ lâu hơn học dồn trong một đêm"; chữ mới tách hai so sánh (tự kiểm tra so với đọc lại, không so với học dồn). Lý do: tự kiểm tra được so với đọc lại (Rowland 2014; Roediger & Karpicke 2006), không so với học dồn. Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.132.3.354", "https://doi.org/10.1111/j.1467-9280.2006.01693.x" ]
    luot_2_ghi_chu: Gộp ý của hai bài đã mở.
    review: dung
  - id: n2
    cau: Một tuần sau, nhiều khả năng Bình (học rải) nhớ tốt hơn An (học dồn); ngay sau khi học xong, chưa chắc An hơn Bình, vì các tổng hợp không thấy học dồn thắng ổn định ở bài kiểm tra ngay sau đó.
    loai: loi-khuyen
    nguon:
      - cepeda2006
      - cepeda2008
    trich: For retention intervals less than 1 min, spaced presentations improved final-test performance by 9%, compared with massed presentations ... there is no hint that massed presentation was preferable to spaced, whether retention interval was very short (less than 1 min) or very long (over 30 days).
    vi_tri: 'Cepeda 2008, Results; Cepeda 2006 tóm tắt: "the ISI producing maximal retention increased as retention interval increased"'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Bình nhớ tốt hơn hẳn". Chữ mới: "nhiều khả năng Bình nhớ tốt hơn". Lý do: ở mốc 7 ngày, khoảng cách tối ưu chỉ cải thiện 10% so với khoảng cách 0 ngày (Cepeda 2008). Hai bạn An và Bình, 4 tiếng, 4 tối là tình huống giả định (gia-dinh); "An có thể làm tốt hơn một chút" suy từ việc khoảng cách tối ưu tăng theo thời gian cần nhớ (nên ở thời gian rất ngắn khoảng cách ngắn là tối ưu). Không có số đo trực tiếp cho đúng tình huống này. Review (Claude Sonnet 5.5, 09/11/2026): sai. Chữ cũ: "ngay sau khi học xong, An có thể làm tốt hơn một chút vì kiến thức còn nóng". Mở lại Cepeda 2006 (toàn văn, mục massed vs spaced): 271 phép so sánh, học rải hơn học dồn cả ở khoảng giữ dưới 1 phút (+9%), chỉ 12 trong 271 phép không thấy lợi; lợi thế của học dồn chỉ thấy ở khoảng giữ vài giây (Peterson). Lượt 2 đúng. Chữ mới: "chưa chắc An hơn Bình". Cũng sửa câu hỏi Tự trải nghiệm ("ai làm tốt hơn") cho khỏi gài sẵn An thắng. Lưu ý: tổng hợp so học dồn với khoảng cách ngắn nhất cho cùng một mục, không đúng 1:1 với tình huống 4 giờ so 4 buổi.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.132.3.354", "https://doi.org/10.1111/j.1467-9280.2008.02209.x" ]
    luot_2_ghi_chu: 'câu đúng: Một tuần sau, nhiều khả năng Bình (học rải) nhớ tốt hơn An (học dồn); ngay sau khi học, hai bạn có thể ngang nhau, và học dồn chỉ tạo cảm giác thành thạo cao hơn thực tế (Cepeda 2006, 2008).; Phần "một tuần sau Bình nhớ tốt hơn" đúng. Phần "ngay sau khi học An có thể làm tốt hơn" không có trong dữ liệu tổng hợp: Cepeda 2006 thấy học rải hơn học dồn cả ở khoảng giữ dưới 1 phút (+9%); chỉ vài trong 271 phép so sánh không thấy lợi (12/271). Lợi thế tức thời của học dồn chỉ thấy ở khoảng giữ vài giây (Peterson).'
    review: sai
  - id: n3
    cau: Hiệu ứng thời điểm của các buổi học đã được đo đạc trong hàng trăm thí nghiệm.
    loai: so-lieu
    nguon:
