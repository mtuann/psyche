    cau: Cepeda và cộng sự (2006) là một phân tích tổng hợp, gom các nghiên cứu so sánh học ngắt quãng với học dồn trong các nhiệm vụ nhớ bằng lời, rồi phân tích gộp.
    loai: dinh-nghia
    nguon:
      - cepeda2006
    trich: The authors performed a meta-analysis of the distributed practice effect to illuminate the effects of temporal variables that have been neglected in previous reviews.
    vi_tri: Tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "gom mọi nghiên cứu so sánh…". Chữ mới bỏ "mọi" (nhóm tìm được; Cepeda 2008 nói tổng hợp xem "more than 400 reports"). Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.132.3.354" ]
    review: dung
