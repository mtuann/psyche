    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.132.3.354" ]
  - id: n4
    cau: Còn hình dạng của việc quên theo thời gian được trình bày kỹ trong bài "Vì sao ta quên?".
    loai: ve-site
    ket_qua: dung
