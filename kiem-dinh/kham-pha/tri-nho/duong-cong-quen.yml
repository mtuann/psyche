  - id: n5
    cau: Học dồn (massed practice) là nhồi mọi thứ vào một buổi dài; học ngắt quãng (spaced/distributed practice) là chia thành nhiều buổi cách nhau bởi những khoảng nghỉ.
    loai: dinh-nghia
    nguon:
      - cepeda2006
    trich: Effects of spacing (consecutive massed presentations vs. spaced learning episodes) and lag (less spaced vs. more spaced learning episodes) were examined
    vi_tri: Tóm tắt (Cepeda 2006)
    ket_qua: dung
    ghi_chu: Định nghĩa theo cách dùng của Cepeda 2006. "Cùng tổng thời gian" là điều kiện so sánh điển hình, không phải chữ của tóm tắt.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.132.3.354" ]
  - id: n6
    cau: Học liền một mạch dễ cảm thấy hiệu quả, vì kiến thức còn tươi và ta làm bài tập trơn tru ngay lúc đó; cảm giác trơn tru lúc học không dự báo được trí nhớ một tuần sau.
    loai: phat-hien
    nguon:
      - roediger2006
    trich: subjects in the SSSS condition were more confident that they would remember the passage in 1 week than were subjects in the SSST or STTT condition
    vi_tri: Experiment 2, Results
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Trực giác của hầu hết chúng ta nghiêng về học dồn: học liền một mạch cảm thấy hiệu quả…" (khẳng định về trực giác của "hầu hết", không nguồn đã mở). Chữ mới bỏ "trực giác của hầu hết", dựa vào kết quả có thật: nhóm đọc dồn (SSSS) tin mình sẽ nhớ tốt hơn nhưng sau 1 tuần nhớ kém hơn (40% so với 61%). Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1467-9280.2006.01693.x", "https://doi.org/10.1111/j.1467-9280.2008.02209.x" ]
    luot_2_ghi_chu: '"Không dự báo được" hơi mạnh nhưng được R&K đo trực tiếp (dự đoán ngược với kết quả).'
    review: dung
  - id: n7
    cau: 'Từ thế kỷ 19, Ebbinghaus (1885) đặt vấn đề ấy một cách khoa học: ông tự làm người tham gia duy nhất, học thuộc các danh sách âm tiết vô nghĩa, rồi đo xem mình quên nhanh đến đâu bằng phương pháp "tiết kiệm" (học lại nhanh hơn lần đầu bao nhiêu phần trăm).'
    loai: lich-su
    nguon:
      - ebbinghaus1885
      - cepeda2008
      - murre2015
    trich: In all experiments reported by Ebbinghaus [9], he used only himself as a subject.
    vi_tri: 'Murre & Dros, Introduction; Cepeda 2008: "there is a large literature on such effects going back to the 19th century"'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Người đầu tiên đặt vấn đề này một cách khoa học là Hermann Ebbinghaus (1885)". Chữ mới: "Từ thế kỷ 19, … đã đặt vấn đề", vì Cepeda 2008 chỉ nói văn liệu về hiệu ứng ngắt quãng "going back to the 19th century", không nói ai đầu tiên. Âm tiết "DAX", "BOK", "ZUF" là ví dụ minh họa của trang (gia-dinh). Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Ebbinghaus/memory8.htm" ]
    luot_2_ghi_chu: Đọc chương VIII và các chương khác trên psychclassics; đặc điểm tự làm đối tượng và âm tiết vô nghĩa quen thuộc, chương VIII nói "for my own personality".
    review: dung
  - id: n8
    cau: Ebbinghaus cũng nhận thấy việc rải các buổi học ra nhiều ngày giúp ông tốn ít công sức học lại hơn.
    loai: phat-hien
    nguon:
      - ebbinghaus1885
    trich: with any considerable number of repetitions a suitable distribution of them over a space of time is decidedly more advantageous than the massing of them at a single time
    vi_tri: Chương 8 (psychclassics.yorku.ca/Ebbinghaus/memory8.htm)
    ket_qua: dung
    ghi_chu: 'theo G1-L01 (22/10/2026): KHỚP (L32; nguồn của trang đang link chương 7, câu nằm ở chương 8; đã thêm chương 8 vào mục Nguồn). Review (Claude Sonnet 5.5, 09/11/2026): dung. Ebbinghaus ch. 8 (đã mở): "38 repetitions, distributed in a certain way over the three preceding days, had just as favorable an effect as 68 repetitions made on the day just previous" nên "tốn ít công sức học lại hơn" đúng; ông nói điều này chỉ cho điều kiện rất hạn chế.'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Ebbinghaus/memory8.htm" ]
    review: dung
  - id: n9
    cau: Ebbinghaus chỉ là một người, với âm tiết vô nghĩa; hơn một thế kỷ sau, hàng trăm thí nghiệm đã kiểm tra lại điều ông thấy.
    loai: lich-su
    nguon:
      - ebbinghaus1885
      - cepeda2006
    trich: 38 repetitions, distributed in a certain way over the three preceding days, had just as favorable an effect as 68 repetitions made on the day just previous. [Ebbinghaus, ch. 8] | This review found 839 assessments of distributed practice in 317 experiments located in 184 articles. [Cepeda 2006]
    vi_tri: Tóm tắt (Cepeda 2006)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…bằng hàng trăm thí nghiệm trên hàng nghìn người" (không có tổng số người trong nguồn đã mở); chữ mới bỏ "trên hàng nghìn người". "Hơn một thế kỷ": 1885 đến 2006. Review (Claude Sonnet 5.5, 09/11/2026): sai. Chữ cũ: "Phải hơn một thế kỷ sau, các nhà nghiên cứu mới trả lời được câu hỏi của ông bằng hàng trăm thí nghiệm." Lượt 2 đúng: mâu thuẫn với n8 (chính Ebbinghaus ở chương 8 đã thấy 38 lần lặp rải trong 3 ngày bằng 68 lần lặp dồn một ngày) và nghiên cứu liên tục từ Jost 1897; điều chưa trả lời được lâu là khoảng cách tối ưu. Đã mở chương 8 psychclassics.yorku.ca.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://doi.org/10.1037/0033-2909.132.3.354", "https://psychclassics.yorku.ca/Ebbinghaus/memory8.htm" ]
    luot_2_ghi_chu: 'câu đúng: Ebbinghaus (1885) đã thấy lợi ích của rải học; qua hơn một thế kỷ nghiên cứu, hàng trăm thí nghiệm (317 trong Cepeda 2006) xác nhận hiệu ứng, và các nghiên cứu như Cepeda 2008 mới bắt đầu đo khoảng cách tối ưu.; Câu nói "phải hơn một thế kỷ sau mới trả lời được" mâu thuẫn với n8 và với lịch sử: Ebbinghaus đã thấy lợi ích của rải học, nghiên cứu liên tục từ Jost 1897. Điều hơn một thế kỷ chưa trả lời được là khoảng cách tối ưu (Cepeda 2008: vẫn chưa nói chắc được).'
    review: sai
