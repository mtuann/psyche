    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nó phụ thuộc nhiều vào cơ chế điều hành trung ương" (G1 xếp phần này KHỚP, nhưng chính G1 ghi nhóm Baddeley về sau thấy điều hành không bắt buộc). Đã viết lại để nêu cả giả định ban đầu lẫn kết quả về sau, theo Baddeley (2021). Review (Claude Opus 5.5, 09/11/2026): Baddeley 2000 (toàn văn): "Conscious awareness is assumed to be the principal mode of retrieval from the buffer"; bộ đệm "assumed to be controlled by the central executive". Baddeley 2021 (toàn văn): "A final tentative proposal was that access to the buffer was dependent entirely on the central executive ... the central executive is not essential for providing access". Đủ cho câu; không cần mở Allen 2012.'
