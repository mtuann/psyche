  - id: n34
    cau: 'Khung "Vững chắc": hai việc cùng "kênh" gây nhiễu cho nhau nhiều hơn hai việc khác kênh.'
    loai: nhan
    nhan: vung-chac
    co_so:
      - oberauer2018
      - baddeley2021
    ly_do: 'Tổng quan 16 chuyên gia (Oberauer 2018) xếp "nhiễu nhiều hơn khi cùng lĩnh vực" (Benchmark 5.2.1) và "vẫn nhiễu, ít hơn, khi khác lĩnh vực" (5.2.2) ở mức A, quan sát được ở nhiều nhiệm vụ và chất liệu; Baddeley (2021) kể lại loạt thí nghiệm nhiệm vụ kép và nghiên cứu bệnh nhân. Thước đo mục 4: một tổng quan hệ thống chất lượng tốt, cùng chiều, không có thất bại tái lập lớn. Giới hạn nêu trên trang: khác kênh vẫn nhiễu.'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (ý chính): "trí nhớ làm việc gồm nhiều thành phần riêng biệt", kèm "Mô hình ... có ảnh hưởng nhất trong lĩnh vực này", "50 năm". Lý do: khẳng định "gồm nhiều thành phần riêng biệt" là về lý thuyết (còn tranh luận: Cowan, tài nguyên chung); điều có bằng chứng vững là hiệu ứng cùng kênh/khác kênh. Đã đổi ý chính, nêu thêm khác kênh vẫn nhiễu, đổi "có ảnh hưởng nhất" thành "một trong những khung ... có ảnh hưởng nhất". Review (Claude Opus 5.5, 09/11/2026): Giữ Vững chắc. Oberauer và cộng sự 2018 là tổng quan đồng thuận của 16 chuyên gia trên Psychological Bulletin, tiêu chí chọn ghi rõ (phải tái lập được, tốt nhất ở nhiều phòng thí nghiệm; khái quát qua phương pháp, chất liệu, quần thể); Benchmark 5.2.1 và 5.2.2 xếp A vì thấy nhất quán ở miền lời nói, không gian, thị giác và nhiều mô hình thí nghiệm (complex span, serial recall, Brown-Peterson). Đạt thước đo mục 4 (tổng quan chất lượng tốt, cùng chiều, không có thất bại tái lập lớn). Lượt 2 đòi phân tích tổng hợp, nhưng thước đo chấp nhận tổng quan; khung đã nêu giới hạn (khác kênh vẫn nhiễu).'
    luot_2: khong-chac
    luot_2_nguon: [ "https://app.nova.edu/toolbox/instructionalproducts/edd8124/articles/1974-Baddeley_and_Hitch.pdf", "https://doi.org/10.1017/S0140525X01003922" ]
    luot_2_ghi_chu: Không tìm phân tích tổng hợp hay tái lập lớn cho "cùng kênh nhiễu hơn khác kênh"; theo thước đo mục 4 thì Vững chắc cần chúng; nên hạ Khá vững hoặc nêu nguồn tổng hợp.
    review: dung
    nguon:
      - oberauer2018
      - baddeley2021
  - id: n35
    cau: 'Khung "Vững chắc": trí nhớ ngắn hạn cho lời nói phụ thuộc mạnh vào âm thanh của từ (giống âm thì nhớ kém, từ dài thì nhớ ít).'
    loai: nhan
    nhan: vung-chac
    co_so:
      - oberauer2018
      - conrad1964
      - baddeley1966a
      - btb1975
    ly_do: 'Oberauer 2018: hiệu ứng tương tự âm thanh (Benchmark 8.1.1) xếp A; hiệu ứng độ dài từ (Benchmark 7) xếp B, vững và quan sát ở nhiều ngôn ngữ. Các bài gốc (Conrad 1964; Baddeley 1966a; Baddeley và cộng sự 1975) mô tả hiệu ứng. Cách giải thích (vòng lặp âm vị) còn tranh luận riêng với độ dài từ (Mattys 2018), nên khung chỉ khẳng định hiệu ứng, không khẳng định cơ chế.'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thông tin lời nói được giữ dưới dạng mã âm thanh"; "sức chứa dự đoán được từ tốc độ đọc trong 2 giây — rất khó giải thích nếu không có vòng lặp âm vị". Lý do: "rất khó giải thích" mạnh hơn bằng chứng (cách giải thích độ dài từ còn tranh cãi). Đã viết lại ý chính theo hiệu ứng quan sát được. Review (Claude Opus 5.5, 09/11/2026): Giữ Vững chắc, không theo câu đề xuất của lượt 2. Khung khẳng định hiệu ứng, không khẳng định cơ chế: tương tự âm (Oberauer 2018, Benchmark 8.1.1, A; Conrad 1964; Baddeley 1966a) và độ dài từ theo số âm tiết (Benchmark 7: "robust", "observed consistently in various languages"; xếp B vì chỉ thuộc miền lời nói, không vì yếu). Chỗ còn tranh cãi là cơ chế và hiệu ứng theo thời lượng phát âm (n23, n26); thân khung đã nói rõ.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://doi.org/10.1017/S0140525X01003922" ]
    luot_2_ghi_chu: 'câu đúng: Khá vững: ngắn hạn cho lời nói phụ thuộc mạnh vào âm thanh (giống âm thì nhớ kém); hiệu ứng độ dài từ thấy được nhưng còn tranh cãi về cơ chế.; Giống âm làm nhớ kém rất vững; "từ dài thì nhớ ít" thì cơ chế và tính tổng quát còn tranh cãi (n26 trên cùng trang), chưa tìm tái lập lớn hay phân tích tổng hợp.'
    review: dung
    nguon:
      - oberauer2018
      - conrad1964
      - baddeley1966a
      - btb1975
  - id: n36
    cau: 'Khung "Khá vững": bộ đệm tập (episodic buffer).'
    loai: nhan
    nhan: kha-vung
    co_so:
      - baddeley2000
      - baddeley2021
    ly_do: 'Đề xuất của Baddeley (2000), có thêm thực nghiệm (Baddeley 2021 kể lại: cơ chế điều hành không bắt buộc cho truy cập bộ đệm). Chưa có tổng quan hệ thống riêng cho riêng thành phần này trong hồ sơ; vai trò chính xác còn được làm rõ. Mức "khá vững" theo thước đo: nhiều nghiên cứu cùng chiều nhưng còn giới hạn.'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "được cộng đồng nghiên cứu chấp nhận rộng rãi". Đã viết "được nhiều nhà nghiên cứu dùng": không có nguồn đo mức chấp nhận. Review (Claude Opus 5.5, 09/11/2026): Giữ Khá vững. Đã mở toàn văn Baddeley 2000: căn cứ gồm nhớ ngay đoạn văn ở bệnh nhân mất trí nhớ nặng, PV nhớ được 1 từ rời nhưng 5 từ trong câu, ảnh hưởng của độ giống hình ảnh lên nhớ lời, nhớ câu có nghĩa đến 16 từ; Baddeley 2021 kể loạt thí nghiệm nhiệm vụ kép sau đó (sửa giả định truy cập qua điều hành). Chưa có tổng quan hệ thống riêng, và mô hình cạnh tranh (Cowan) giải thích cùng hiện tượng bằng trí nhớ dài hạn được kích hoạt, nên không lên Vững chắc; chưa có bằng chứng chất lượng cao bác bỏ, nên không xuống Đang tranh cãi. Khung đã nêu bằng chứng trực tiếp ít hơn và vai trò còn được làm rõ.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không mở được Baddeley 2000/2012/2021; chưa có phân tích tổng hợp trong tay để xác nhận Khá vững (có quan điểm Cowan/Oberauer không cần bộ đệm riêng). Cần Opus xem nhãn.
    review: dung
    nguon:
      - baddeley2000
      - baddeley2021
