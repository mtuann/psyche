  ly_do: 'Tổng quan 16 chuyên gia (Oberauer 2018) xếp "nhiễu nhiều hơn khi cùng lĩnh vực" (Benchmark 5.2.1) và "vẫn nhiễu, ít hơn, khi khác lĩnh vực" (5.2.2) ở mức A, quan sát được ở nhiều nhiệm vụ và chất liệu; Baddeley (2021) kể lại loạt thí nghiệm nhiệm vụ kép và nghiên cứu bệnh nhân. Thước đo mục 4: một tổng quan hệ thống chất lượng tốt, cùng chiều, không có thất bại tái lập lớn. Giới hạn nêu trên trang: khác kênh vẫn nhiễu.'
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ (ý chính): "trí nhớ làm việc gồm nhiều thành phần riêng biệt", kèm "Mô hình ... có ảnh hưởng nhất trong lĩnh vực này", "50 năm". Lý do: khẳng định "gồm nhiều thành phần riêng biệt" là về lý thuyết (còn tranh luận: Cowan, tài nguyên chung); điều có bằng chứng vững là hiệu ứng cùng kênh/khác kênh. Đã đổi ý chính, nêu thêm khác kênh vẫn nhiễu, đổi "có ảnh hưởng nhất" thành "một trong những khung ... có ảnh hưởng nhất".'
