nhan_dinh:
- id: n1
  cau: Nhiều người thấy việc giữ một dãy số trong đầu khó hơn khi đồng thời nhẩm hát một bài có lời.
  loai: phat-hien
  nguon:
  - oberauer2018
  - btb1975
  trich: Distractor processing can involve concurrent articulation of unrelated verbal material, often referred to as "articulatory suppression" | The disruption of memory caused by concurrent processing of distractors is substantial when the memory items and distractors come from the same content domain
  vi_tri: Oberauer và cộng sự 2018, Benchmark 5.2.1; Baddeley và cộng sự 1975, thí nghiệm ức chế phát âm
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Hầu hết mọi người làm việc 1 khá dễ, còn việc 2 thì các con số ''bay'' mất". Chữ mới: "Nhiều người thấy việc 1 khá dễ, còn việc 2 thì các con số dễ ''rơi'' mất". Lý do: "hầu hết" không có số liệu; đây là bài tập minh họa (gia-dinh), nguyên lý (nhiệm vụ lời nói chen vào trí nhớ lời nói) có nguồn.'
- id: n2
  cau: Theo mô hình trí nhớ làm việc, giữ dãy số bằng lời và hát nhẩm lời bài hát cùng dùng một ngăn xử lý âm thanh nên hai việc tranh nhau ngăn đó.
  loai: phat-hien
  nguon:
  - baddeley2021
  - oberauer2018
  trich: This comprised an acoustic-verbal temporary store in which information would fade unless refreshed by vocal or sub-vocal rehearsal. | The disruption of memory caused by concurrent processing of distractors is substantial when the memory items and distractors come from the same content domain
  vi_tri: Baddeley 2021, mục mô hình vòng lặp; Oberauer và cộng sự 2018, Benchmark 5.2.1
  ket_qua: da-lam-mem
  ghi_chu: 'Thêm "theo mô hình trí nhớ làm việc": cách giải thích bằng "ngăn" là của mô hình; thuyết khác (Cowan) giải thích theo chú ý chung (xem khung "Đang tranh cãi").'
- id: n3
  cau: Giữ dãy số trong khi hình dung đường đi (việc hình ảnh–không gian) thường ít chen lấn hơn so với hát nhẩm lời, vì hai việc dùng hai ngăn khác nhau.
  loai: phat-hien
  nguon:
  - oberauer2018
  - baddeley2021
  trich: The disruption of memory caused by concurrent processing of distractors is less serious, but still present, when the memory items and distractors come from different domains | tracking disrupted the visuo-spatial but not the verbal STM task
  vi_tri: Oberauer và cộng sự 2018, Benchmark 5.2.2; Baddeley 2021, mục bảng phác họa
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Việc này thường dễ hơn việc 2, vì hình ảnh không gian dùng một ngăn khác, không chen lấn". Chữ mới: "nên ít chen lấn ... hơn". Lý do: khác kênh vẫn gây nhiễu, chỉ ít hơn (Benchmark 5.2.2). Tình huống là minh họa (gia-dinh).'
- id: n4
  cau: Trí nhớ làm việc (working memory) là nơi não vừa giữ thông tin trong vài giây vừa thao tác với nó, khác với cách nhìn trí nhớ ngắn hạn như một kho chứa thụ động.
  loai: dinh-nghia
  nguon:
  - baddeley2021
  trich: we were interested in its functional importance, in what it did, rather than its simple storage capacity | the essence of working memory is the capacity to maintain information while simultaneously processing it
  vi_tri: Baddeley 2021, mục thí nghiệm nhiệm vụ kép và mục tác nhân điều hành
  ket_qua: dung
  ghi_chu: theo G1-L01 (22/10/2026). Đã đọc lại Baddeley (2021).
- id: n5
  cau: Năm 1974 Alan Baddeley và Graham Hitch đề xuất mô hình trí nhớ làm việc nhiều ngăn dưới sự điều phối của một thành phần điều hành trung tâm.
  loai: lich-su
  nguon:
  - baddeley2021
  trich: The three components comprised the Central Executive, an attentional control system, aided by two temporary storage systems, one verbal and subsequently named the phonological loop and its visual equivalent, the visuospatial sketchpad | Our three component model first appeared as an invited chapter ... (Baddeley & Hitch, 1974)
  vi_tri: Baddeley 2021, mục thí nghiệm nhiệm vụ kép
  ket_qua: dung
  ghi_chu: Chương sách 1974 chưa mở được toàn văn; theo Baddeley (2021) kể lại.
- id: n6
  cau: Baddeley và Hitch dùng thí nghiệm nhiệm vụ kép (làm hai việc cùng lúc) để thử xem trí nhớ ngắn hạn có phải một ngăn duy nhất.
  loai: phat-hien
  nguon:
  - baddeley2021
  trich: Our basic paradigm was to require participants to hear and repeat back sequences of digits varying in length from zero to eight digits while at the same time requiring them to perform tasks involving processes that might reasonably be assumed to depend on the hypothetical working memory system.
  vi_tri: Baddeley 2021, mục thí nghiệm nhiệm vụ kép
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Baddeley và Hitch tổng hợp một loạt thí nghiệm". Theo Baddeley (2021) đây là loạt thí nghiệm của chính họ (ba việc: suy luận bằng lời, hiểu văn bản, học danh sách từ), không phải tổng hợp nghiên cứu của người khác; đã viết "thực hiện một loạt thí nghiệm".'
- id: n7
  cau: Nếu trí nhớ ngắn hạn là một ngăn duy nhất thì việc nào chiếm chỗ cũng làm việc khác kém đi; nếu mô hình kho chung đúng, hiệu suất phải sụp đổ khi tải gần bằng độ dài dãy số.
  loai: phat-hien
  nguon:
  - baddeley2021
  trich: In each case, we assumed that the longer the concurrently repeated novel digit sequence the greater the load on the STS should be and the poorer the performance. Indeed, if the modal model was correct, performance should break down completely when the load approached digit span.
  vi_tri: Baddeley 2021, mục thí nghiệm nhiệm vụ kép
  ket_qua: dung
  ghi_chu: 'Đã đối chiếu: câu trên trang là diễn đạt lại logic của thí nghiệm theo Baddeley (2021).'
- id: n8
  cau: Khi phải giữ tới 8 chữ số trong lúc suy luận bằng lời, người tham gia chậm hơn khoảng một nửa nhưng tỉ lệ sai gần như không đổi (khoảng 5%).
  loai: so-lieu
  nguon:
  - baddeley2021
  trich: In the reasoning task for example, response times became systematically slower as concurrent digit load increased, but only by about 50% at the maximum load of eight digits while even more surprisingly, error rates remained constant at around 5%.
  vi_tri: Baddeley 2021, mục thí nghiệm nhiệm vụ kép (kể lại Baddeley & Hitch 1974)
  ket_qua: da-sua
  ghi_chu: 'theo G1-L01 (22/10/2026). Chữ cũ (G1, mục 3): "năng lực suy luận chỉ giảm nhẹ", kèm link hỏng "[Baddeley và Hitch, 1974]". Chữ trên trang hiện khớp đề xuất của G1 (đối chiếu lại Baddeley 2021): chậm khoảng một nửa, sai khoảng 5%; link DOI chương sách đã thêm. Số liệu theo Baddeley kể lại, chưa mở chương gốc.'
- id: n9
  cau: Vòng lặp âm vị gồm một kho âm thanh nơi vết âm thanh phai dần nếu không được làm mới và một quá trình nhẩm lại ("giọng nói trong đầu") làm mới vết đó.
  loai: dinh-nghia
  nguon:
  - baddeley2021
  trich: This comprised an acoustic-verbal temporary store in which information would fade unless refreshed by vocal or sub-vocal rehearsal.
  vi_tri: Baddeley 2021, mục mô hình vòng lặp
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "vết âm thanh phai dần trong khoảng 2 giây". Lý do: G1 xếp "khoảng 2 giây" là KHÔNG KIỂM ĐƯỢC; Baddeley (2021) chỉ nói phai dần nếu không làm mới. Con số 2 giây có ở Baddeley, Thomson & Buchanan (1975) nhưng là dung lượng tính theo lượng lời đọc được, không phải thời gian phai: tách thành nhận định riêng về dung lượng 2 giây.'
- id: n10
  cau: Dung lượng của vòng lặp âm vị ước chừng bằng số từ người đó đọc được trong khoảng 2 giây.
  loai: so-lieu
  nguon:
  - btb1975
  trich: Span could be predicted on the basis of the number of words which the subject can read in approximately 2 sec
  vi_tri: Baddeley và cộng sự 1975, tóm tắt (3)
  ket_qua: da-sua
  ghi_chu: 'Chữ mới thêm vào trang (G1 xếp mục "khoảng 2 giây" KHÔNG KIỂM ĐƯỢC vì chưa mở được tóm tắt bài 1975). Đã mở toàn văn PDF: tóm tắt ghi đúng như trích.'
- id: n11
  cau: Bảng phác họa không gian–thị giác giữ hình ảnh và vị trí trong không gian.
  loai: dinh-nghia
  nguon:
  - baddeley2021
  trich: We proposed a visuo-spatial component to the original model | tracking disrupted the visuo-spatial but not the verbal STM task | distinguish between the visual and spatial components of working memory
  vi_tri: Baddeley 2021, mục bảng phác họa
  ket_qua: dung
  ghi_chu: Ví dụ "khuôn mặt vừa thấy, đường đi vừa hình dung" là minh họa (gia-dinh).
- id: n12
  cau: 'Cơ chế điều hành trung ương là thành phần có dung lượng chú ý hạn chế: tập trung chú ý, chia và chuyển chú ý giữa các việc, và kết nối với trí nhớ dài hạn.'
  loai: dinh-nghia
  nguon:
  - baddeley2021
  trich: any adequate executive system would need to focus attention and to inhibit the processing of irrelevant distractors. It would need to be able to divide attention ... and where necessary to switch attention between tasks. Finally it would require the capacity to access and manipulate information from LTM | a single executive system of limited attentional capacity
  vi_tri: Baddeley 2021, mục cơ chế điều hành
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "ông chủ ... quyết định thông tin nào được giữ, chuyển sự tập trung giữa các việc, và kết nối với trí nhớ dài hạn". Bỏ "quyết định thông tin nào được giữ" (cách nói ví von, không có trong nguồn) và "chuyển sự tập trung" (Baddeley 2021: đề xuất chức năng chuyển chú ý chưa được ủng hộ mạnh); giữ tập trung, chia chú ý, kết nối trí nhớ dài hạn, dung lượng chú ý hạn chế.'
- id: n13
  cau: Conrad cho 387 người xem các dãy 6 chữ cái trình bày bằng mắt rồi nhớ lại ngay.
  loai: so-lieu
  nguon:
  - conrad1964
  trich: Sequences of 6 letters of the alphabet were visually presented for immediate recall to 387 subjects.
  vi_tri: Conrad 1964, tóm tắt
  ket_qua: dung
  ghi_chu: theo G1-L01 (22/10/2026). Đã mở toàn văn PDF và đối chiếu.
- id: n14
  cau: 'Conrad ghi lại loại lỗi nhầm lẫn khi nhớ lại: lỗi có quan hệ có hệ thống với chữ cái gốc.'
  loai: phat-hien
  nguon:
  - conrad1964
  trich: Errors showed a systematic relationship to original stimuli.
  vi_tri: Conrad 1964, tóm tắt
  ket_qua: dung
  ghi_chu: theo G1-L01 (22/10/2026). Đã mở toàn văn.
- id: n15
  cau: Các lỗi nhầm lẫn tập trung vào những chữ cái nghe giống nhau (như B, P, T, V).
  loai: phat-hien
  nguon:
  - conrad1964
  trich: The following letters were used; BCPTVFMNSX. | confusions are relatively high within the two groups BCPTV and FMNSX and relatively low between them | when an error of recall is made, the substituted letter is likely to be one which sounds like the correct letter
  vi_tri: Conrad 1964, mục Method và mục Results (tr. 77–78)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "nghe giống nhau — B nhầm thành C, D, P, T" và quiz "(B–C–D–P–T)" (G1, mục 2: ĐÁNG NGỜ). Đã mở toàn văn: bộ chữ cái là BCPTVFMNSX, không có D; chữ trên trang hiện ("như B, P, T, V") đúng với nhóm BCPTV. Quiz đã sửa tương ứng.'
- id: n16
  cau: Chữ cái được chiếu bằng mắt, nhưng lỗi vẫn tập trung vào chữ nghe giống nhau; theo Conrad, điều này cho thấy đa số người tham gia nhẩm tên chữ cái thay vì giữ hình dạng.
  loai: phat-hien
  nguon:
  - conrad1964
  trich: There is of course no mystery in the fact that visually presented memory material should yield acoustically related errors. It merely indicates that the majority of subjects verbalize the stimuli, rather than attempting to store them in visual form.
  vi_tri: Conrad 1964, mục Discussion (tr. 78)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "chứ không phải những chữ cái trông giống nhau ... Kết luận: dù thông tin đi vào bằng mắt, não vẫn chuyển nó thành mã âm thanh". Conrad không đặt phép so sánh trực tiếp với độ giống hình dạng của chữ cái, và nói "đa số người" nhẩm tên; đã bỏ vế "chứ không phải trông giống" và viết đúng mức Conrad nói. Quiz đổi "chứng tỏ não mã hóa" thành "cho thấy đa số người nhớ ... dưới dạng âm thanh".'
- id: n17
  cau: Mẫu lỗi khi nhớ lại trùng khớp với mẫu nhầm lẫn khi nghe các chữ cái trong tiếng ồn trắng (tương quan hạng +0,64).
  loai: so-lieu
  nguon:
  - conrad1964
  trich: Considering all 90 cells, a value of +0.64 was obtained. | even with visual presentation material to be memorized, when recall errors occurred they were similar in nature to hearing errors when the signal was partially masked by white noise.
  vi_tri: Conrad 1964, tr. 78
  ket_qua: dung
  ghi_chu: theo G1-L01 (22/10/2026). Số +0,64 là thêm mới (đã mở toàn văn).
- id: n18
  cau: Thí nghiệm của Conrad (1964) là một trong những bằng chứng nền tảng cho vòng lặp âm vị.
  loai: lich-su
  nguon:
  - oberauer2018
  - baddeley2021
  trich: Increasing the phonological similarity between memoranda leads to worse serial recall performance (Conrad & Hull, 1964; Farrell & Lewandowsky, 2003). | acoustic similarity between remembered letter sequences ... had a major effect on recall accuracy, even when the letters were presented visually
  vi_tri: Oberauer và cộng sự 2018, Benchmark 8.1.1; Baddeley 2021 (trích Conrad & Hull 1964 khác bài với Conrad 1964)
  ket_qua: dung
  ghi_chu: Hiệu ứng tương tự âm thanh được xếp loại A trong Oberauer (2018); tổng quan trích Conrad & Hull (1964), một bài khác của cùng tác giả. Bài Conrad (1964) là bài mô tả hiệu ứng.
- id: n19
  cau: Với các dãy từ, sự giống nhau về âm thanh làm trí nhớ ngắn hạn kém đi rất nhiều, còn sự giống nhau về ý nghĩa chỉ ảnh hưởng chút ít.
  loai: phat-hien
  nguon:
  - baddeley1966a
  trich: There was a large adverse effect of acoustic similarity on STM (72.5 per cent.) which was significantly greater (p < 0.001) than the small (6.3 per cent.) but reliable effect (p < 0.05) of semantic similarity.
