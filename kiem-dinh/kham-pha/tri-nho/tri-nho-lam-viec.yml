    vi_tri: Cowan 2001; Baddeley 2021
    ket_qua: da-lam-mem
    ghi_chu: 'Cùng nội dung với các nhận định Cowan ở mục Mức độ chắc chắn; đáp án đã đổi "không cần các ngăn riêng — chỉ là" thành "thay vì các ngăn riêng, ... là" (xem nhận định về mô hình nhúng). Review (Claude Opus 5.5, 09/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1017/S0140525X01003922", "https://psychclassics.yorku.ca/Miller/" ]
    review: dung
doi_chu:
  - cu: (trang cũ không có hộp tóm tắt đầu trang)
    moi: Hộp ::tom-tat tự dựng từ ý chính bốn khung nhãn của trang (bản mới thêm).
    ly_do: Hộp dựng từ ý chính của khung nhãn; ý chính của hai khung "Vững chắc" đã đổi (xem hai mục bên dưới).
  - cu: 'Khung Vững chắc 1: "trí nhớ làm việc gồm nhiều thành phần riêng biệt"; "tìm thấy lại nhiều lần trong 50 năm"; "khung lý thuyết có ảnh hưởng nhất"'
    moi: 'Khung Vững chắc 1: "hai việc cùng kênh gây nhiễu cho nhau nhiều hơn hai việc khác kênh"; dẫn Oberauer và cộng sự (2018); nêu khác kênh vẫn nhiễu; "một trong những khung ... có ảnh hưởng nhất"'
    ly_do: Xem ghi_chu của nhận định tương ứng.
  - cu: 'Khung Vững chắc 2: "thông tin lời nói được giữ dưới dạng mã âm thanh"; "rất khó giải thích nếu không có vòng lặp âm vị"'
    moi: 'Khung Vững chắc 2: "trí nhớ ngắn hạn cho lời nói phụ thuộc mạnh vào âm thanh của từ"; hiệu ứng tương tự âm và độ dài từ vững, cách giải thích còn nhiều hướng'
    ly_do: Xem ghi_chu của nhận định tương ứng.
  - cu: 'Khung Khá vững: "được cộng đồng nghiên cứu chấp nhận rộng rãi"'
    moi: '"được nhiều nhà nghiên cứu dùng"'
    ly_do: Xem ghi_chu của nhận định tương ứng.
  - cu: 'Tự trải nghiệm: "Hầu hết mọi người ... các con số bay mất"; "Ba ngăn này chính là phát hiện trung tâm"'
    moi: '"Nhiều người ... dễ rơi mất"; "Lý do theo mô hình trí nhớ làm việc"; "Cách chia ngăn này chính là ý trung tâm"'
    ly_do: Xem ghi_chu của nhận định tương ứng.
  - cu: '"vết âm thanh phai dần trong khoảng 2 giây"'
    moi: '"phai dần nếu không được làm mới"; dung lượng ước chừng bằng lượng lời đọc được trong khoảng 2 giây'
    ly_do: Xem ghi_chu của nhận định tương ứng.
  - cu: 'Conrad: "chứ không phải những chữ cái trông giống nhau ... não vẫn chuyển nó thành mã âm thanh"; quiz "chứng tỏ não mã hóa"'
    moi: '"dù các chữ cái được chiếu bằng mắt ... Theo Conrad, điều này cho thấy đa số người tham gia nhẩm tên các chữ cái ..."; "+0,64"; quiz "cho thấy đa số người nhớ ... dưới dạng âm thanh"'
    ly_do: Xem ghi_chu của nhận định tương ứng.
  - cu: '"nói một âm vô nghĩa" (thân bài và quiz 3)'
    moi: '"lặp đi lặp lại một âm không liên quan"; thêm "(nhưng vẫn còn với tài liệu nghe)"'
    ly_do: Xem ghi_chu của nhận định tương ứng.
  - cu: '"Đây là bằng chứng khó cãi cho vòng lặp âm vị"'
    moi: '"một trong những bằng chứng chính ... dù cơ chế ... giải thích theo nhiều cách (Mattys và cộng sự, 2018)"'
    ly_do: Xem ghi_chu của nhận định tương ứng.
  - cu: '"một số bệnh nhân mất trí nhớ ... cả một câu chuyện dài hơn nhiều"'
    moi: '"hai bệnh nhân mất trí nhớ nặng ... một câu chuyện ngắn ngay sau khi nghe"'
    ly_do: Xem ghi_chu của nhận định tương ứng.
  - cu: '"phụ thuộc nhiều vào cơ chế điều hành trung ương"'
    moi: giả định ban đầu, và nhóm Baddeley về sau thấy không bắt buộc (Baddeley, 2021)
    ly_do: Xem ghi_chu của nhận định tương ứng.
  - cu: '"vòng lặp âm vị tiến hóa để phục vụ học ngôn ngữ"; "tốt hơn cả chỉ số thông minh chung"; "Một cách nhìn: ... đặc điểm — nó buộc não phải chọn lọc"; "không ai tranh cãi"'
    moi: '"chức năng quan trọng ... là giúp học ngôn ngữ"; "khả năng lặp lại từ vô nghĩa ... dự báo vốn từ một năm sau"; (bỏ câu "buộc não phải chọn lọc"); "các bên đều thừa nhận"'
    ly_do: Xem ghi_chu của nhận định tương ứng.
  - cu: 'Áp dụng: "vài chục giây", "cách dùng đúng một hệ thống"; "Quy tắc ngón tay cái"; "mật khẩu đều được thiết kế"; "Nhớ ngược khó hơn vì"'
    moi: '"khoảng 4 ... suy ra"; "suy ra từ những kết quả trên"; "thường được viết thành nhóm"; "Nhớ ngược đòi hỏi vừa giữ vừa đảo thứ tự"'
    ly_do: Xem ghi_chu của nhận định tương ứng.
  - cu: '"Chúng tôi chưa tìm thấy nghiên cứu nào kiểm tra trực tiếp mô hình này trên người Việt."; "Chữ số tiếng Việt đều là từ một âm tiết"'
    moi: '"Tính đến 11/2026, ..."; "theo suy luận từ các kết quả trên, không nên lấy chuẩn ... kể cả tiếng Việt"'
    ly_do: Xem ghi_chu của nhận định tương ứng.
  - cu: 'Ngộ nhận: "Bằng chứng 50 năm qua ủng hộ nhiều ngăn chuyên biệt"; "thiên tài cũng không giữ được 20 chữ số"; "ta chỉ có thể luân phiên nhanh ... không thể làm thật sự song song"'
    moi: '"Nhiều bằng chứng ... dù cách giải thích còn bàn cãi"; "đặc điểm chung của mọi người ... gom nhóm giúp nhớ nhiều ký tự hơn"; "gây nhiễu nhau rõ rệt trong các thí nghiệm nhiệm vụ kép"'
    ly_do: Xem ghi_chu của nhận định tương ứng.
  - cu: '"trong khi đồng thời giữ trong đầu một dãy chữ số. Kết quả: khi phải giữ tới 8 chữ số, người tham gia suy luận chậm hơn khoảng một nửa, nhưng tỉ lệ sai gần như không đổi (khoảng 5%)"'
    moi: '"trong khi liên tục đọc to, lặp đi lặp lại một dãy 6 chữ số ngẫu nhiên — gần bằng sức chứa trí nhớ ngắn hạn của nhiều người. Kết quả: thời gian suy luận tăng từ khoảng 2,8 lên 4,3 giây (chậm hơn khoảng một nửa), nhưng tỉ lệ sai chỉ nhích từ khoảng 8% lên 10%"'
    ly_do: "Review: số liệu theo Bảng III của chương 1974 (xem ghi_chu n8)."
  - cu: (không có)
    moi: '"Về sau, Baddeley, Lewis và Vallar (1984) thấy hiệu ứng mất cả với tài liệu nghe nếu ức chế kéo dài sang cả lúc nhớ lại."; thêm Baddeley, Lewis & Vallar (1984) vào mục Nguồn'
    ly_do: "Review: điều kiện biên của hiệu ứng (xem ghi_chu n25)."
  - cu: '"Ở trẻ em, ... dự báo vốn từ một năm sau chứ không phải ngược lại (theo Baddeley, 2021, kể lại nghiên cứu của Gathercole và Baddeley, 1989)"'
    moi: '"Ở trẻ 4–5 tuổi, ... dự báo vốn từ một năm sau (Gathercole và Baddeley, 1989). Từ khoảng 5 tuổi trở đi thì chiều ngược lại trội hơn ... (Gathercole và cộng sự, 1992)"; thêm Gathercole và cộng sự (1992) vào mục Nguồn'
    ly_do: "Review: xem ghi_chu n43."
  - cu: '"Ngược lại, nghe nhạc không lời ... thường ít gây hại hơn — dù với việc đòi hỏi ngôn ngữ, ngay cả nhạc không lời cũng có thể gây nhiễu nhẹ."'
    moi: '"Nghe nhạc không lời ... thường ít gây hại hơn, vì nhiễu do âm thanh chủ yếu thấy ở các việc ghi nhớ bằng lời. Nhưng với việc phải nhớ chữ hay số theo đúng thứ tự, ngay cả nhạc không lời cũng có thể làm nhớ kém đi."'
    ly_do: "Review: xem ghi_chu n50."
  - cu: '"### 5. Tự đo bàn nháp của mình :nhan[kha-vung]"; "Site có công cụ [đo độ dài trí nhớ chữ số] (nhớ xuôi và nhớ ngược). Thử làm rồi đọc phần giải thích: bạn sẽ thấy con số của mình nằm đâu so với nghiên cứu, và vì sao 7 ± 2 không hẳn đúng với mọi người."'
    moi: '"### 5. Tự đo bàn nháp của mình { #5-tu-do-ban-nhap-cua-minh-kha-vung }"; "Khi công cụ [đo độ dài trí nhớ chữ số] lên site, bạn có thể tự đo cả nhớ xuôi lẫn nhớ ngược."'
    ly_do: "Review: công cụ chưa lên site; tiêu đề không có nhận định nhãn; giữ id cũ (xem ghi_chu n54, n55)."
