    cau: Vừa nghe giảng vừa đọc tin nhắn (cùng kênh ngôn ngữ) gây xung đột; nghe nhạc không lời trong lúc làm việc hình ảnh thường ít gây hại hơn vì nhiễu do âm thanh chủ yếu thấy ở việc ghi nhớ bằng lời; nhưng với việc phải nhớ chữ hay số theo đúng thứ tự, ngay cả nhạc không lời cũng có thể làm nhớ kém đi.
