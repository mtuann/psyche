    cau: Khi bắt người tham gia lặp đi lặp lại một âm không liên quan trong lúc học (ức chế phát âm), hiệu ứng độ dài từ biến mất với tài liệu nhìn thấy nhưng vẫn còn với tài liệu nghe; về sau Baddeley, Lewis và Vallar (1984) thấy hiệu ứng mất cả với tài liệu nghe nếu ức chế kéo dài sang cả lúc nhớ lại.
    loai: phat-hien
    nguon:
      - btb1975
      - blv1984
      - oberauer2018
    trich: When articulation is suppressed by requiring the subject to articulate an irrelevant sound, the word length effect disappears with visual presentation, but remains when presentation is auditory. | the tendency for long words to be less well remembered than short is abolished by articulatory suppression, even when presentation is auditory, provided suppression occurs during both input and recall | articulatory suppression during presentation reduces or eliminates the word length effect with visual presentation but not with auditory presentation ... unless articulatory suppression also occurs during recall
    vi_tri: Baddeley và cộng sự 1975, tóm tắt (4) và thí nghiệm VIII; Baddeley, Lewis & Vallar 1984, tóm tắt; Oberauer và cộng sự 2018, Benchmark 7, Boundary conditions
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nói một âm vô nghĩa" (trang và quiz). Tóm tắt ghi "irrelevant sound" (âm không liên quan); thí nghiệm cụ thể cho người tham gia đếm từ một đến tám. Đã đổi "vô nghĩa" thành "không liên quan" và thêm vế "vẫn còn với tài liệu nghe". Review (Claude Opus 5.5, 09/11/2026): Câu về bài 1975 đúng (tóm tắt (4); thí nghiệm VII–VIII: người tham gia đếm 1–8 từ trước khi danh sách hiện đến hết danh sách, tức chỉ lúc học; trang đã ghi "trong lúc học"). Lượt 2 đúng ở chỗ thiếu điều kiện: Baddeley, Lewis & Vallar (1984, tóm tắt) và Oberauer và cộng sự (2018, toàn văn) ghi hiệu ứng mất cả với tài liệu nghe nếu ức chế kéo dài sang lúc nhớ lại. Đã thêm câu "Về sau, Baddeley, Lewis và Vallar (1984) thấy hiệu ứng mất cả với tài liệu nghe nếu ức chế kéo dài sang cả lúc nhớ lại." và mục nguồn tương ứng.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://doi.org/10.1017/S0140525X01003922" ]
    luot_2_ghi_chu: Tóm tắt thứ cấp (không mở được) của Baddeley, Lewis, Vallar 1984 cho rằng ức chế xóa hiệu ứng độ dài từ cả với trình bày nghe nếu ức chế ở cả lúc học và nhớ lại; câu "vẫn còn với tài liệu nghe" có thể sai hay thiếu điều kiện. Cần mở BTB 1975 và BLV 1984. Chỗ cần Opus xem.
