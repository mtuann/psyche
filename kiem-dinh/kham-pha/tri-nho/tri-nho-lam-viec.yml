    cau: Hai bệnh nhân mất trí nhớ nặng vẫn nhớ tốt một câu chuyện ngắn ngay sau khi nghe, dài hơn nhiều so với sức chứa của vòng lặp âm vị; điều này đòi hỏi một nơi "buộc" thông tin lại.
    loai: phat-hien
    nguon:
      - baddeley2021
      - baddeley2000
    trich: We were also puzzled by data from two highly intelligent but densely amnesic patients who as expected scored zero on both the Rivermead Behavioral Memory Test and on the delayed prose recall of the WMS. Atypically however, they performed well on immediate recall of the short story component of the Rivermead test
    vi_tri: Baddeley 2021, mục bộ đệm tập
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "một số bệnh nhân mất trí nhớ ... vẫn nhớ được cả một câu chuyện dài hơn nhiều so với sức chứa". Theo Baddeley (2021): hai bệnh nhân, "câu chuyện ngắn" (phần truyện của bài Rivermead). Đã viết "hai bệnh nhân ... câu chuyện ngắn ngay sau khi nghe". Quiz câu 4 giữ ý tương tự (nói "bệnh nhân mất trí nhớ vẫn nhớ được cả câu chuyện dài hơn nhiều"): ghi lại cho review. Review (Claude Opus 5.5, 09/11/2026): Baddeley 2021 (toàn văn PMC, mở lại): hai bệnh nhân mất trí nhớ nặng, điểm 0 ở bài Rivermead và nhớ lại văn xuôi trì hoãn, nhưng nhớ ngay phần truyện ngắn của bài Rivermead tốt (điểm 12 và 9,5); "How could our model of working memory hold an extended paragraph?". Baddeley 2000 (toàn văn, IA), mục Prose recall: một đoạn văn 15–20 ý, ở một số bệnh nhân mất trí nhớ nặng nhớ ngay có thể gần bình thường, vượt xa sức chứa giả định của các hệ phụ. Câu khớp.'
    luot_2: khong-chac
    luot_2_ghi_chu: Không mở được Baddeley 2000 và Baddeley & Wilson 2002; chỉ thấy tên bài. Con số "hai bệnh nhân" chưa kiểm.
