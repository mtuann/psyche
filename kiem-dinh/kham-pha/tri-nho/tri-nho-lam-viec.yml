nhan_dinh:
  - id: n1
    cau: Nhiều người thấy việc giữ một dãy số trong đầu khó hơn khi đồng thời nhẩm hát một bài có lời.
    loai: phat-hien
    nguon:
      - oberauer2018
      - btb1975
    trich: Distractor processing can involve concurrent articulation of unrelated verbal material, often referred to as "articulatory suppression" | The disruption of memory caused by concurrent processing of distractors is substantial when the memory items and distractors come from the same content domain
    vi_tri: Oberauer và cộng sự 2018, Benchmark 5.2.1; Baddeley và cộng sự 1975, thí nghiệm ức chế phát âm
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Hầu hết mọi người làm việc 1 khá dễ, còn việc 2 thì các con số ''bay'' mất". Chữ mới: "Nhiều người thấy việc 1 khá dễ, còn việc 2 thì các con số dễ ''rơi'' mất". Lý do: "hầu hết" không có số liệu; đây là bài tập minh họa (gia-dinh), nguyên lý (nhiệm vụ lời nói chen vào trí nhớ lời nói) có nguồn. Review (Claude Opus 5.5, 09/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://app.nova.edu/toolbox/instructionalproducts/edd8124/articles/1974-Baddeley_and_Hitch.pdf" ]
    luot_2_ghi_chu: '"Nhiều người thấy" là câu hedge.'
    review: dung
  - id: n2
    cau: Theo mô hình trí nhớ làm việc, giữ dãy số bằng lời và hát nhẩm lời bài hát cùng dùng một ngăn xử lý âm thanh nên hai việc tranh nhau ngăn đó.
    loai: phat-hien
    nguon:
      - baddeley2021
      - oberauer2018
    trich: This comprised an acoustic-verbal temporary store in which information would fade unless refreshed by vocal or sub-vocal rehearsal. | The disruption of memory caused by concurrent processing of distractors is substantial when the memory items and distractors come from the same content domain
    vi_tri: Baddeley 2021, mục mô hình vòng lặp; Oberauer và cộng sự 2018, Benchmark 5.2.1
    ket_qua: da-lam-mem
    ghi_chu: 'Thêm "theo mô hình trí nhớ làm việc": cách giải thích bằng "ngăn" là của mô hình; thuyết khác (Cowan) giải thích theo chú ý chung (xem khung "Đang tranh cãi"). Review (Claude Opus 5.5, 09/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://app.nova.edu/toolbox/instructionalproducts/edd8124/articles/1974-Baddeley_and_Hitch.pdf", "https://doi.org/10.1111/j.2044-8295.1964.tb00899.x" ]
    review: dung
  - id: n3
    cau: Giữ dãy số trong khi hình dung đường đi (việc hình ảnh–không gian) thường ít chen lấn hơn so với hát nhẩm lời, vì hai việc dùng hai ngăn khác nhau.
    loai: phat-hien
    nguon:
      - oberauer2018
      - baddeley2021
    trich: The disruption of memory caused by concurrent processing of distractors is less serious, but still present, when the memory items and distractors come from different domains | tracking disrupted the visuo-spatial but not the verbal STM task
    vi_tri: Oberauer và cộng sự 2018, Benchmark 5.2.2; Baddeley 2021, mục bảng phác họa
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Việc này thường dễ hơn việc 2, vì hình ảnh không gian dùng một ngăn khác, không chen lấn". Chữ mới: "nên ít chen lấn ... hơn". Lý do: khác kênh vẫn gây nhiễu, chỉ ít hơn (Benchmark 5.2.2). Tình huống là minh họa (gia-dinh). Review (Claude Opus 5.5, 09/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://app.nova.edu/toolbox/instructionalproducts/edd8124/articles/1974-Baddeley_and_Hitch.pdf" ]
    luot_2_ghi_chu: Dẫn qua tổng kết của B&H.
    review: dung
  - id: n4
    cau: Trí nhớ làm việc (working memory) là nơi não vừa giữ thông tin trong vài giây vừa thao tác với nó, khác với cách nhìn trí nhớ ngắn hạn như một kho chứa thụ động.
    loai: dinh-nghia
    nguon:
      - baddeley2021
    trich: we were interested in its functional importance, in what it did, rather than its simple storage capacity | the essence of working memory is the capacity to maintain information while simultaneously processing it
    vi_tri: Baddeley 2021, mục thí nghiệm nhiệm vụ kép và mục tác nhân điều hành
    ket_qua: dung
    ghi_chu: theo G1-L01 (22/10/2026). Đã đọc lại Baddeley (2021).
    luot_2: dung
    luot_2_nguon: [ "https://app.nova.edu/toolbox/instructionalproducts/edd8124/articles/1974-Baddeley_and_Hitch.pdf" ]
  - id: n5
    cau: Năm 1974 Alan Baddeley và Graham Hitch đề xuất mô hình trí nhớ làm việc nhiều ngăn dưới sự điều phối của một thành phần điều hành trung tâm.
    loai: lich-su
    nguon:
      - baddeley2021
    trich: The three components comprised the Central Executive, an attentional control system, aided by two temporary storage systems, one verbal and subsequently named the phonological loop and its visual equivalent, the visuospatial sketchpad | Our three component model first appeared as an invited chapter ... (Baddeley & Hitch, 1974)
    vi_tri: Baddeley 2021, mục thí nghiệm nhiệm vụ kép
    ket_qua: dung
    ghi_chu: Chương sách 1974 chưa mở được toàn văn; theo Baddeley (2021) kể lại.
    luot_2: dung
    luot_2_nguon: [ "https://app.nova.edu/toolbox/instructionalproducts/edd8124/articles/1974-Baddeley_and_Hitch.pdf" ]
    luot_2_ghi_chu: Chương 1974 nêu rõ executive và phonemic loop; vùng hình ảnh được nhắc qua Brooks.
  - id: n6
    cau: Baddeley và Hitch dùng thí nghiệm nhiệm vụ kép (làm hai việc cùng lúc) để thử xem trí nhớ ngắn hạn có phải một ngăn duy nhất.
    loai: phat-hien
    nguon:
      - baddeley2021
    trich: Our basic paradigm was to require participants to hear and repeat back sequences of digits varying in length from zero to eight digits while at the same time requiring them to perform tasks involving processes that might reasonably be assumed to depend on the hypothetical working memory system.
    vi_tri: Baddeley 2021, mục thí nghiệm nhiệm vụ kép
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Baddeley và Hitch tổng hợp một loạt thí nghiệm". Theo Baddeley (2021) đây là loạt thí nghiệm của chính họ (ba việc: suy luận bằng lời, hiểu văn bản, học danh sách từ), không phải tổng hợp nghiên cứu của người khác; đã viết "thực hiện một loạt thí nghiệm". Review (Claude Opus 5.5, 09/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://app.nova.edu/toolbox/instructionalproducts/edd8124/articles/1974-Baddeley_and_Hitch.pdf" ]
    review: dung
  - id: n7
    cau: Nếu trí nhớ ngắn hạn là một ngăn duy nhất thì việc nào chiếm chỗ cũng làm việc khác kém đi; nếu mô hình kho chung đúng, hiệu suất phải sụp đổ khi tải gần bằng độ dài dãy số.
    loai: phat-hien
    nguon:
      - baddeley2021
    trich: In each case, we assumed that the longer the concurrently repeated novel digit sequence the greater the load on the STS should be and the poorer the performance. Indeed, if the modal model was correct, performance should break down completely when the load approached digit span.
    vi_tri: Baddeley 2021, mục thí nghiệm nhiệm vụ kép
    ket_qua: dung
    ghi_chu: 'Đã đối chiếu: câu trên trang là diễn đạt lại logic của thí nghiệm theo Baddeley (2021).'
    luot_2: dung
    luot_2_nguon: [ "https://app.nova.edu/toolbox/instructionalproducts/edd8124/articles/1974-Baddeley_and_Hitch.pdf" ]
  - id: n8
    cau: Trong thí nghiệm III của Baddeley và Hitch (1974), khi người tham gia vừa suy luận bằng lời vừa liên tục đọc to một dãy 6 chữ số ngẫu nhiên (gần bằng sức chứa của nhiều người), thời gian suy luận tăng từ 2,79 lên 4,27 giây (chậm hơn khoảng một nửa), còn tỉ lệ sai chỉ từ 8,1% lên 10,3%.
    loai: so-lieu
    nguon:
      - bh1974
      - baddeley2021
    trich: "In the fourth condition, S was given a random six-digit sequence to repeat cyclically at a four- to five-digit per second rate. | Table III: Control 2.79 s, 8.1% errors; Random 6-digit No. 4.27 s, 10.3% errors | increasing the preload from two to six letters, a load which approaches the memory span for many Ss"
    vi_tri: Baddeley & Hitch 1974, thí nghiệm III và Bảng III (tr. 54); thí nghiệm II (tr. 53) cho "gần bằng sức chứa"
    ket_qua: da-sua
    ghi_chu: 'theo G1-L01 (22/10/2026). Chữ cũ (G1, mục 3): "năng lực suy luận chỉ giảm nhẹ", kèm link hỏng "[Baddeley và Hitch, 1974]". Chữ trên trang hiện khớp đề xuất của G1 (đối chiếu lại Baddeley 2021): chậm khoảng một nửa, sai khoảng 5%; link DOI chương sách đã thêm. Số liệu theo Baddeley kể lại, chưa mở chương gốc. Review (Claude Opus 5.5, 09/11/2026): Lượt 2 đúng. Đã mở chương 1974 (PDF nova.edu): thí nghiệm III cho đọc to lặp lại một dãy 6 chữ số ngẫu nhiên (4–5 chữ số mỗi giây) trong lúc suy luận; thời gian 2,79 s (đối chứng) lên 4,27 s, tỉ lệ sai 8,1% lên 10,3% (Bảng III); chương không có điều kiện 8 chữ số. "8 chữ số, chậm khoảng 50%, sai khoảng 5%" là Baddeley (2021) nhớ lại, không khớp chương gốc mà trang dẫn. Chữ cũ: "giữ trong đầu một dãy chữ số ... khi phải giữ tới 8 chữ số ... chậm hơn khoảng một nửa, nhưng tỉ lệ sai gần như không đổi (khoảng 5%)". Chữ mới: "liên tục đọc to, lặp đi lặp lại một dãy 6 chữ số ngẫu nhiên — gần bằng sức chứa trí nhớ ngắn hạn của nhiều người ... thời gian suy luận tăng từ khoảng 2,8 lên 4,3 giây (chậm hơn khoảng một nửa), nhưng tỉ lệ sai chỉ nhích từ khoảng 8% lên 10%".'
    luot_2: khong-chac
    luot_2_nguon: [ "https://app.nova.edu/toolbox/instructionalproducts/edd8124/articles/1974-Baddeley_and_Hitch.pdf" ]
    luot_2_ghi_chu: Không tìm thấy trong chương 1974 mức tải "tới 8 chữ số" và "sai khoảng 5%"; số liệu chương cho 6 chữ số, sai 8-10%. Có thể số này lấy từ tổng kết sau của Baddeley (chưa mở được). Cần lượt 1 chỉ ra nguồn chính xác hoặc sửa theo số liệu chương.
    review: sai
  - id: n9
    cau: Vòng lặp âm vị gồm một kho âm thanh nơi vết âm thanh phai dần nếu không được làm mới và một quá trình nhẩm lại ("giọng nói trong đầu") làm mới vết đó.
    loai: dinh-nghia
    nguon:
      - baddeley2021
    trich: This comprised an acoustic-verbal temporary store in which information would fade unless refreshed by vocal or sub-vocal rehearsal.
    vi_tri: Baddeley 2021, mục mô hình vòng lặp
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "vết âm thanh phai dần trong khoảng 2 giây". Lý do: G1 xếp "khoảng 2 giây" là KHÔNG KIỂM ĐƯỢC; Baddeley (2021) chỉ nói phai dần nếu không làm mới. Con số 2 giây có ở Baddeley, Thomson & Buchanan (1975) nhưng là dung lượng tính theo lượng lời đọc được, không phải thời gian phai: tách thành nhận định riêng về dung lượng 2 giây. Review (Claude Opus 5.5, 09/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://app.nova.edu/toolbox/instructionalproducts/edd8124/articles/1974-Baddeley_and_Hitch.pdf", "https://doi.org/10.1017/S0140525X01003922" ]
    review: dung
  - id: n10
    cau: Dung lượng của vòng lặp âm vị ước chừng bằng số từ người đó đọc được trong khoảng 2 giây.
    loai: so-lieu
    nguon:
      - btb1975
    trich: Span could be predicted on the basis of the number of words which the subject can read in approximately 2 sec
    vi_tri: Baddeley và cộng sự 1975, tóm tắt (3)
    ket_qua: da-sua
    ghi_chu: 'Chữ mới thêm vào trang (G1 xếp mục "khoảng 2 giây" KHÔNG KIỂM ĐƯỢC vì chưa mở được tóm tắt bài 1975). Đã mở toàn văn PDF: tóm tắt ghi đúng như trích. Review (Claude Opus 5.5, 09/11/2026): chữ cuối trên trang khớp trích và nguồn đã dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1017/S0140525X01003922", "https://app.nova.edu/toolbox/instructionalproducts/edd8124/articles/1974-Baddeley_and_Hitch.pdf" ]
    luot_2_ghi_chu: Không mở được toàn văn Baddeley, Thomson, Buchanan 1975.
    review: dung
