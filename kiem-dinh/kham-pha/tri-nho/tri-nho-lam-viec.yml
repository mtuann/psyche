    trich: While the syllabic word-length effect itself is robust (Tehan, Hendry, & Kocinski, 2001), its interpretation remains controversial. | The syllable-based word-length effect is a key finding for theories of verbal WM and has been observed consistently in various languages.
    vi_tri: Mattys và cộng sự 2018, phần mở đầu; Oberauer và cộng sự 2018, Benchmark 7
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Đây là bằng chứng ''khó cãi'' cho vòng lặp âm vị ... được kiểm tra và đúng". Chữ mới: "một trong những bằng chứng chính ... dù cơ chế vẫn được giải thích theo nhiều cách". Lý do: Mattys (2018) nói cách giải thích còn tranh cãi; Oberauer xếp hiệu ứng ở mức B. Review (Claude Opus 5.5, 09/11/2026): Soát loại: câu ở thân bài, không phải khung nhãn, và hồ sơ không có nhan, co_so, ly_do: đổi loai từ nhan sang phat-hien (lượt 2 đã kiểm: dung). Oberauer 2018, Benchmark 7: hiệu ứng độ dài từ theo số âm tiết "robust", xếp B; Mattys 2018: cách giải thích còn tranh cãi. Câu khớp.'
