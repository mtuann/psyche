    ghi_chu: 'chưa chắc: Baddeley (2021) nói liên kết hai chiều giữa kho con và trí nhớ dài hạn, không nói rõ "hai chiều với cơ chế điều hành". Hình là của người giao (không sửa); đề nghị người giao sửa chú thích ("Các thành phần liên hệ với nhau và với trí nhớ dài hạn") hay xác nhận bằng Baddeley (2000), Hình 4. Review (Claude Opus 5.5, 09/11/2026): Đã dựng trang 421 của Baddeley (2000) thành ảnh và xem Hình 1: ba thành phần đều nối với cơ chế điều hành trung ương bằng mũi tên hai đầu. Chú thích "Các ngăn trao đổi hai chiều với cơ chế điều hành trung ương" khớp hình gốc; không sửa hình, không cần thêm vào HINH_DA_SUA. Hình của site bỏ tầng trí nhớ dài hạn (đã ghi minh họa ước lệ).'
