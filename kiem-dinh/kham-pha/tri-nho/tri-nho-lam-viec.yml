    cau: Bảng phác họa không gian–thị giác giữ hình ảnh và vị trí trong không gian.
    loai: dinh-nghia
    nguon:
      - baddeley2021
    trich: We proposed a visuo-spatial component to the original model | tracking disrupted the visuo-spatial but not the verbal STM task | distinguish between the visual and spatial components of working memory
    vi_tri: Baddeley 2021, mục bảng phác họa
    ket_qua: dung
    ghi_chu: Ví dụ "khuôn mặt vừa thấy, đường đi vừa hình dung" là minh họa (gia-dinh).
    luot_2: dung
