    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1371/journal.pone.0022757" ]
    review: dung
  - id: n7
    cau: 'Khi nhớ lại, ta thường dựng lại sự kiện từ các mảnh: một phần từ những gì thật sự đã thấy, một phần từ thông tin đến sau sự kiện, kể cả điều người khác kể và chính câu hỏi khiến ta phải nhớ.'
    loai: phat-hien
    nguon:
      - loftus1974
      - loftus2005
    trich: we would like to propose that two kinds of information go into one's memory for some complex occurrence. The first is information gleaned during the perception of the original event; the second is external information supplied after the fact.
    vi_tri: Loftus & Palmer, Discussion, tr. 588
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "mỗi lần nhớ lại, ta dựng lại sự kiện từ các mảnh: một phần từ những gì thật sự đã thấy, một phần từ hiểu biết chung, từ điều người khác kể, và từ chính câu hỏi… Phần lớn thời gian, việc dựng lại này đủ chính xác." Chữ mới bỏ "hiểu biết chung" (nguồn đã mở không nói), đổi "mỗi lần" thành "thường", bỏ "phần lớn thời gian… đủ chính xác" (không có nguồn đã mở nói điều ấy). Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1016/S0022-5371(74)80011-3", "https://doi.org/10.1101/lm.94705" ]
    review: dung
