    tin của bài (PLoS ONE 6(8), e22757).'
- id: n7
  cau: 'Khi nhớ lại, ta thường dựng lại sự kiện từ các mảnh: một phần từ những gì thật sự đã thấy, một phần từ thông tin đến sau sự kiện, kể cả điều người khác kể và chính câu hỏi khiến ta phải
    nhớ.'
  loai: phat-hien
  nguon:
  - loftus1974
  - loftus2005
  trich: we would like to propose that two kinds of information go into one's memory for some complex occurrence. The first is information gleaned during the perception of the original event;
    the second is external information supplied after the fact.
  vi_tri: Loftus & Palmer, Discussion, tr. 588
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "mỗi lần nhớ lại, ta dựng lại sự kiện từ các mảnh: một phần từ những gì thật sự đã thấy, một phần từ hiểu biết chung, từ điều người khác kể, và từ chính câu hỏi… Phần lớn thời
    gian, việc dựng lại này đủ chính xác." Chữ mới bỏ "hiểu biết chung" (nguồn đã mở không nói), đổi "mỗi lần" thành "thường", bỏ "phần lớn thời gian… đủ chính xác" (không có nguồn đã mở nói điều
    ấy).'
