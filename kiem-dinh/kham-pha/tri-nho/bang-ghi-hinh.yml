  trich: University of Washington [...] Forty-five students participated in groups of various sizes.
  vi_tri: Tr. 585–586
  ket_qua: dung
  ghi_chu: '"Mỹ" suy từ University of Washington; "tiếng Anh" suy từ câu hỏi gốc.'
