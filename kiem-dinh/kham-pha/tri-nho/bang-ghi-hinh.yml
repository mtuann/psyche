- id: n32
  cau: Tính đến 11/2026, theo những gì chúng tôi tìm được, thí nghiệm cụ thể này chưa được làm lại trong một dự án tái lập quy mô lớn, đăng ký trước.
  loai: thoi-su
  nguon:
  - zwaan2025
  - tim-kiem-vn
  het_han: '2027-11-01'
  ket_qua: dung
  ghi_chu: 'Zwaan (8/9/2025): "the study has never been directly replicated at scale using modern methods"; ông và Eerland nộp đề xuất tái lập nhiều phòng thí nghiệm (chờ tài trợ). OpenAlex tìm
    ngày 9/11/2026: chỉ thấy một bản làm lại nhỏ (60 học sinh một trường quốc tế ở Hàng Châu, doi 10.63313/ssh.9104, tạp chí không rõ, không đăng ký trước), không phải tái lập lớn. G1-L01 ghi
    lại câu trích của Zwaan; Zwaan là blog (bậc 3), nên đây là câu thời sự có hạn chứ không phải căn cứ chính của nhãn.'
- id: n33
  cau: Bản thân các tác giả cũng nêu hai cách giải thích.
  loai: phat-hien
  nguon:
  - loftus1974
  trich: Two interpretations of this finding are possible.
  vi_tri: Experiment I, Discussion, tr. 586
  ket_qua: dung
- id: n34
  cau: 'Thiên lệch khi trả lời: người tham gia không chắc xe chạy 30 hay 40 dặm/giờ, và từ "đâm sầm" đẩy câu trả lời lên cao hơn, còn ký ức thì không đổi.'
  loai: phat-hien
  nguon:
  - loftus1974
  trich: A subject is uncertain whether to say 30 mph or 40 mph, for example, and the verb smashed biases his response towards the higher estimate.
  vi_tri: Experiment I, Discussion
  ket_qua: dung
- id: n35
  cau: 'Ký ức thật sự thay đổi: từ "đâm sầm" khiến người ta lưu lại một phiên bản "nghiêm trọng hơn" của vụ tai nạn, rồi một tuần sau phiên bản ấy "gợi ra" cả mảnh kính vỡ.'
  loai: phat-hien
  nguon:
  - loftus1974
  trich: The verb smashed may change a subject's memory such that he "sees" the accident as being more severe than it actually was. [...] Since broken glass is commensurate with a severe accident,
    the subject is more likely to think that broken glass was present.
  vi_tri: Experiment I, Discussion; Experiment II, Discussion, tr. 586–588
  ket_qua: dung
- id: n36
  cau: Thí nghiệm 2 được thiết kế để cho thêm manh mối giữa hai khả năng ấy, và kết quả phù hợp với khả năng thứ hai.
  loai: phat-hien
  nguon:
  - loftus1974
  trich: The second experiment was designed to provide additional insights into the origin of the differential speed estimates. [...] These results are consistent with the view that the questions
    asked subsequent to an event can cause a reconstruction in one's memory of that event.
  vi_tri: Tr. 587; Tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Thí nghiệm 2 được thiết kế để ủng hộ khả năng thứ hai"; chữ mới theo chữ của bài ("additional insights") và "consistent with" (phù hợp với), không "ủng hộ chắc chắn".'
- id: n37
  cau: Câu hỏi ký ức gốc bị ghi đè hay chỉ khó truy cập hơn vẫn được nghiên cứu trong nhiều năm sau đó.
  loai: phat-hien
  nguon:
  - loftus2005
  trich: investigators have explored the fate of the original memory traces after exposure to misinformation appears to have made them inaccessible.
  vi_tri: Tóm tắt (Europe PMC)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "tranh luận về việc ký ức gốc bị ghi đè hay chỉ khó truy cập hơn vẫn tiếp tục trong nhiều năm sau đó"; chữ mới bỏ "tranh luận" (tóm tắt Loftus 2005 chỉ nói các nhà nghiên cứu
    đã khảo sát số phận của dấu vết gốc); không dựa vào toàn văn.'
- id: n38
  cau: Khi hỏi người khác về một sự việc, đặc biệt là trẻ em, nên dùng câu hỏi mở thay vì câu hỏi gài sẵn câu trả lời; đây là suy luận từ nghiên cứu thông tin sai lệch.
  loai: loi-khuyen
  nguon:
  - loftus1974
  - lamb2007
  trich: the form of a question (in this case, changes in a single word) can markedly and systematically affect a witness's answer to that question.
  vi_tri: 'Loftus & Palmer, Experiment I, Discussion, tr. 586; Lamb và cộng sự (2007), tóm tắt: quy trình phỏng vấn có cấu trúc cải thiện chất lượng phỏng vấn trẻ em'
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ kết bằng "Đây là áp dụng trực tiếp từ các nghiên cứu về thông tin sai lệch"; chữ mới ghi là suy luận, chưa phải kết quả so sánh trực tiếp hai kiểu hỏi. Ví dụ "Nó đánh con phải
    không?" là minh họa giả định (gia-dinh), không phải trích dẫn. Lamb 2007 chỉ đọc tóm tắt: nói quy trình có cấu trúc cải thiện phỏng vấn trẻ em, không nói riêng "câu hỏi mở".'
- id: n39
  cau: 'Cảm giác chắc chắn không đảm bảo ký ức đúng: ký ức sai có thể sống động và đi kèm cảm giác rất tự tin; khi hai người nhớ khác nhau về cùng một chuyện, có thể không ai nói dối.'
  loai: phat-hien
  nguon:
  - simons2011
  - loftus2005
  trich: most memory experts agree that an isolated expression of confidence is at best a limited predictor of memory accuracy
  vi_tri: 'Simons & Chabris (2011), Discussion, mục Confident Testimony; Loftus (2005), tóm tắt: người ta có thể "come to believe falsely that they experienced rich complex events that never,
    in fact, occurred"'
  ket_qua: dung
  ghi_chu: 'Vế "có thể không ai nói dối" là suy luận hợp lý từ hai nguồn trên (một người có thể tin điều sai mà không cố ý); trang đã viết "có thể". Chỗ khó: vế "sống động" chỉ được tóm tắt Loftus
    2005 ủng hộ gián tiếp (các "rich" false memories).'
- id: n40
  cau: Nếu một sự kiện quan trọng, ghi chép lại sớm, trước khi trao đổi với người khác, giúp giữ phiên bản ít bị pha trộn hơn; đây là suy luận, chưa phải một phát hiện được kiểm tra riêng.
  loai: loi-khuyen
  nguon:
  - loftus1974
  trich: Over time, information from these two sources may be integrated in such a way that we are unable to tell from which source some specific detail is recalled.
  vi_tri: Mục Discussion, tr. 588
  ket_qua: dung
  ghi_chu: Câu đã tự ghi là suy luận; nguồn nói ngoại lực sau sự kiện hòa vào ký ức theo thời gian, từ đó suy ra lợi ích của ghi chép sớm. Không có nguồn kiểm chính điều ghi chép sớm có giúp hay
    không.
- id: n41
  cau: Thí nghiệm dùng đoạn phim ngắn cho sinh viên xem, không phải một vụ tai nạn thật xảy ra trước mắt nhân chứng; vì thế mức độ sai lệch ngoài đời có thể khác.
  loai: phat-hien
  nguon:
  - loftus1974
  trich: These films were segments from longer driver's education films borrowed from the Evergreen Safety Council and the Seattle Police Department.
  vi_tri: Experiment I, Method
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Thí nghiệm dùng phim ngắn trong phòng thí nghiệm; người xem không bị căng thẳng như nhân chứng thật và biết hậu quả của câu trả lời không lớn." Chữ mới bỏ hai vế tâm lý (căng
    thẳng, hậu quả) không có nguồn đã mở; giữ phần bài nói được: phim cho sinh viên xem.'
- id: n42
  cau: Thí nghiệm gốc được làm với sinh viên Mỹ, bằng tiếng Anh.
