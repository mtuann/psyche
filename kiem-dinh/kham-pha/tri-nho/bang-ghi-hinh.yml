    ghi_chu: Câu đã tự ghi là suy luận; nguồn nói ngoại lực sau sự kiện hòa vào ký ức theo thời gian, từ đó suy ra lợi ích của ghi chép sớm. Không có nguồn kiểm chính điều ghi chép sớm có giúp hay không.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1016/S0022-5371(74)80011-3" ]
    luot_2_ghi_chu: Đã ghi rõ là suy luận; không có thí nghiệm riêng.
