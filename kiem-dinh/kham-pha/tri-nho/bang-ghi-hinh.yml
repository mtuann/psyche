nhan_dinh:
  - id: n1
    cau: Thí nghiệm Loftus và Palmer (1974) cho thấy chỉ một động từ trong câu hỏi cũng làm thay đổi điều nhân chứng ước lượng và có thể cả điều họ nhớ.
    loai: phat-hien
    nguon:
      - loftus1974
    trich: The question, "About how fast were the cars going when they smashed into each other ?" elicited higher estimates of speed than questions which used the verbs collided, bumped, contacted, or hit in place of smashed.
    vi_tri: Tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Mô tả (description) của trang. Chữ cũ: "…làm thay đổi ký ức của nhân chứng"; chữ mới: "…thay đổi điều nhân chứng ước lượng và có thể cả điều họ nhớ". Lý do: các tác giả viết "consistent with the view that the questions asked subsequent to an event can cause a reconstruction in one''s memory" (phù hợp với quan điểm), không viết là đã chứng minh. Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1016/S0022-5371(74)80011-3" ]
    luot_2_ghi_chu: "'Có thể cả điều họ nhớ': bài nêu hai cách giải thích, câu viết đã rào đón."
    review: dung
  - id: n2
    cau: Nếu bạn bắt đầu "thấy" lại bát canh trong đầu, đó có thể là ký ức thật, hoặc là một mảnh vừa được câu hỏi ghép thêm; rất khó phân biệt hai trường hợp từ bên trong.
    loai: phat-hien
    nguon:
      - loftus1974
    trich: Over time, information from these two sources may be integrated in such a way that we are unable to tell from which source some specific detail is recalled.
    vi_tri: Mục Discussion, tr. 588
    ket_qua: dung
    ghi_chu: Tình huống bữa canh là ví dụ giả định (gia-dinh) của trang; chỉ phần nhận định chung "khó phân biệt nguồn của chi tiết" được kiểm.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1016/S0022-5371(74)80011-3" ]
  - id: n3
    cau: 'Điều thí nghiệm dưới đây đo được: người nghe câu hỏi có từ dẫn dắt "nhớ" ra chi tiết không có trong sự kiện.'
    loai: phat-hien
    nguon:
      - loftus1974
    trich: those subjects who received the verb smashed were more likely to say "yes" to the question, "Did you see any broken glass?", even though broken glass was not present in the film.
    vi_tri: Tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1016/S0022-5371(74)80011-3" ]
  - id: n4
    cau: 'Nhiều người hình dung trí nhớ như một cuốn băng: sự kiện được ghi lại nguyên vẹn, ký ức có thể mờ đi nhưng không bị sửa.'
    loai: phat-hien
    nguon:
      - simons2011
    trich: 'Video Memory: 63.0% agreed that “human memory works like a video camera, accurately recording the events we see and hear so that we can review and inspect them later.”'
    vi_tri: Results, mục Video Memory
    ket_qua: dung
    ghi_chu: Câu mô tả niềm tin phổ biến; dựa vào mục khảo sát. Vế "không bị sửa" là cách diễn giải của trang cho "ghi lại chính xác".
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1371/journal.pone.0022757" ]
  - id: n5
    cau: Trong một khảo sát đại diện ở Mỹ, 63% người được hỏi đồng ý rằng trí nhớ hoạt động như máy quay phim.
    loai: so-lieu
    nguon:
      - simons2011
    trich: 'Video Memory: 63.0% agreed that “human memory works like a video camera, accurately recording the events we see and hear so that we can review and inspect them later.”'
