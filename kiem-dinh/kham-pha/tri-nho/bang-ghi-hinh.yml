  - id: n52
    cau: 'Quiz 4: câu hỏi gợi ý có thể làm thay đổi điều người ta nhớ, nên cần cẩn thận khi hỏi và khi đánh giá lời khai; nghiên cứu cho thấy trí nhớ có thể bị dẫn dắt chứ không cho thấy nó luôn sai.'
    loai: loi-khuyen
    nguon:
      - loftus1974
      - loftus2005
    trich: These results are consistent with the view that the questions asked subsequent to an event can cause a reconstruction in one's memory of that event.
    vi_tri: Tóm tắt (Loftus & Palmer)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ của lời giải thích: "Phần lớn ký ức của ta đủ chính xác cho đời sống hằng ngày. Nghiên cứu cho thấy trí nhớ có thể bị dẫn dắt, chứ không phải nó luôn sai." Đã bỏ câu đầu (không nguồn đã mở nói tỉ lệ chính xác); câu sau giữ. Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1016/S0022-5371(74)80011-3", "https://doi.org/10.1101/lm.94705" ]
    luot_2_ghi_chu: "Câu rào đón đúng: nghiên cứu cho thấy trí nhớ có thể bị dẫn dắt, không phải luôn sai."
    review: dung
