- id: n28
  cau: 'Vững chắc: trí nhớ được dựng lại và có thể bị thông tin sau sự kiện làm sai lệch.'
  loai: nhan
  nhan: vung-chac
  co_so: &id001
  - loftus2005
  - blank2014
  - loftus1974
  ly_do: 'Hiện tượng thông tin sai lệch được nhiều thập kỷ nghiên cứu xác nhận ở nhiều kiểu thí nghiệm và cả ở loài khác (Loftus 2005: "observed in a variety of human and nonhuman species"); phân
    tích tổng hợp 25 nghiên cứu (155 hiệu ứng) về cảnh báo sau sự kiện (Blank & Launay 2014) xuất phát từ hiệu ứng đã được xác lập qua "hundreds of studies" và vẫn thấy hiệu ứng còn lại sau cảnh
    báo (giảm còn dưới một nửa). Nhãn chỉ nói hiệu ứng có thật và có thể xảy ra, không nói độ lớn hay tần suất ngoài đời.'
  nguon: *id001
  ket_qua: dung
  ghi_chu: 'Chỗ khó: thước đo mục 4 đòi phân tích tổng hợp hay tổng quan hệ thống chất lượng tốt; Loftus 2005 là tổng quan kể (narrative), Blank & Launay là phân tích tổng hợp về một mặt khác
    (cảnh báo). Không tìm được phân tích tổng hợp trực tiếp về độ lớn hiệu ứng thông tin sai lệch mở được. Giữ Vững chắc vì nhãn hẹp (hiệu ứng có thật); lượt 2 và review cân nhắc.'
