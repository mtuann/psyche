- id: n45
  cau: 'Đã bị bác bỏ: "Trí nhớ hoạt động như máy quay phim."'
  loai: nhan
  nhan: bac-bo
  co_so: &id003
  - loftus2005
  - blank2014
  - simons2011
  ly_do: 'Mô hình "máy quay phim" (ghi lại chính xác, không bị sửa) trái với hiện tượng thông tin sai lệch đã được xác lập qua nhiều thập kỷ (Loftus 2005; Blank & Launay 2014) và với đồng thuận
    chuyên gia: cả 16 chuyên gia trong khảo sát của Simons & Chabris (2011) không đồng ý với mệnh đề "human memory works like a video camera, accurately recording the events we see and hear".
    Thẻ ngộ nhận tri-nho-may-quay của site có cùng nhãn.'
  nguon: *id003
  ket_qua: dung
  ghi_chu: Đây là nhãn của ngộ nhận (niềm tin sai). Đồng thuận chuyên gia (16 người) là bằng chứng bậc 2 yếu hơn phân tích tổng hợp; xem n28 về chỗ khó của nền tảng.
- id: n46
  cau: Độ sống động và cảm giác chắc chắn có thể đi kèm cả ký ức sai.
  loai: phat-hien
  nguon:
  - simons2011
  - loftus2005
  trich: When people are wrongly convicted of crimes and later exonerated by DNA testing, the primary evidence often came in the form of a confident, but faulty, eyewitness identification
  vi_tri: Simons & Chabris (2011), Discussion, mục Confident Testimony
  ket_qua: dung
  ghi_chu: 'Chỗ khó như n39: "sống động" (vividness) không có nguồn đã mở nói trực tiếp; nguồn nói về sự tự tin (confidence) và về các ký ức sai "phong phú" (Loftus 2005).'
