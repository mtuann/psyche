  - id: n45
    cau: 'Đã bị bác bỏ: "Trí nhớ hoạt động như máy quay phim."'
    loai: nhan
    nhan: bac-bo
    co_so: &id002
      - loftus2005
      - blank2014
      - simons2011
    ly_do: 'Mô hình "máy quay phim" (ghi lại chính xác, không bị sửa) trái với hiện tượng thông tin sai lệch đã được xác lập qua nhiều thập kỷ (Loftus 2005; Blank & Launay 2014) và với đồng thuận chuyên gia: cả 16 chuyên gia trong khảo sát của Simons & Chabris (2011) không đồng ý với mệnh đề "human memory works like a video camera, accurately recording the events we see and hear". Thẻ ngộ nhận tri-nho-may-quay của site có cùng nhãn.'
    nguon: *id002
    ket_qua: dung
    ghi_chu: 'Đây là nhãn của ngộ nhận (niềm tin sai). Đồng thuận chuyên gia (16 người) là bằng chứng bậc 2 yếu hơn phân tích tổng hợp; xem n28 về chỗ khó của nền tảng. Review (Claude Sonnet 5.5, 09/11/2026): dung. Nhãn của ngộ nhận "máy quay phim": Đã bị bác bỏ, khớp thẻ tri-nho-may-quay trong ngo-nhan.yml (bac-bo) và đồng thuận chuyên gia (Simons & Chabris 2011: 16 chuyên gia không ai đồng ý); nền là hiện tượng thông tin sai lệch (n28).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1371/journal.pone.0022757", "https://doi.org/10.1016/S0022-5371(74)80011-3" ]
    luot_2_ghi_chu: "Đạt Đã bị bác bỏ: hiểu biết chuyên gia và nhiều thí nghiệm cho thấy trí nhớ không ghi nguyên vẹn."
    review: dung
  - id: n46
    cau: Độ sống động và cảm giác chắc chắn có thể đi kèm cả ký ức sai.
    loai: phat-hien
    nguon:
      - simons2011
