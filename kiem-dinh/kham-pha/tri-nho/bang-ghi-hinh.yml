    ket_qua: dung
    ghi_chu: 'Chỗ khó như n39: "sống động" (vividness) không có nguồn đã mở nói trực tiếp; nguồn nói về sự tự tin (confidence) và về các ký ức sai "phong phú" (Loftus 2005).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/1467-9280.02453" ]
    luot_2_ghi_chu: Chỉ đọc tóm tắt; 'có thể đi kèm' là rào đón thích hợp.
