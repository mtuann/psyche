- id: n49
  cau: 'Quiz 1: điều thay đổi giữa các nhóm trong thí nghiệm 1 là một động từ trong câu hỏi về tốc độ; mọi người xem cùng các đoạn phim.'
  loai: phat-hien
  nguon:
  - loftus1974
  trich: Nine subjects were asked, "About how fast were the cars going when they hit each other?" Equal numbers of the remaining subjects were interrogated with the verbs smashed, collided, bumped,
    and contacted in place of hit.
  vi_tri: Experiment I, Method
  ket_qua: dung
  ghi_chu: Câu hỏi 1 và lời giải thích ("Mọi người xem cùng các đoạn phim; chỉ động từ khác"). Nhóm có thứ tự phim khác nhau nhưng cùng bộ phim.
- id: n50
  cau: 'Quiz 2: thí nghiệm 2 hỏi về kính vỡ để kiểm tra xem ký ức về vụ tai nạn có thật sự thay đổi hay không, chứ không chỉ cách trả lời về tốc độ; phim không có kính vỡ.'
  loai: phat-hien
  nguon:
  - loftus1974
  trich: The second experiment was designed to provide additional insights into the origin of the differential speed estimates.
  vi_tri: Experiment I, Discussion, tr. 587; Experiment II, Method
  ket_qua: dung
  ghi_chu: 'Lời giải thích: "Nếu người nghe chữ "đâm sầm" "nhớ" ra kính vỡ nhiều hơn, đó là dấu hiệu ký ức của họ đã khác đi": đúng ý bài, nhưng bài chỉ nói "consistent with" (n36).'
- id: n51
  cau: 'Quiz 3: nhóm "không hỏi tốc độ" là nhóm đối chứng, cho biết tỉ lệ nhớ nhầm kính vỡ khi không có từ dẫn dắt (12%); nhờ đó thấy "đâm sầm" làm tăng tỉ lệ nhớ nhầm còn "tông" thì gần như không.'
  loai: phat-hien
  nguon:
  - loftus1974
  trich: Response Smashed Hit Control Yes 16 7 6 No 34 43 44
  vi_tri: Table 2
  ket_qua: dung
  ghi_chu: Bài gọi nhóm này là "Control". "Gần như không" so 14% với 12% là cách diễn đạt mô tả của trang (bài không kiểm riêng cặp này). Link "Vì sao cần nhóm đối chứng?" (/psyche/bang-chung/thi-nghiem-doi-chung/)
    đã kiểm có trong site.
- id: n52
  cau: 'Quiz 4: câu hỏi gợi ý có thể làm thay đổi điều người ta nhớ, nên cần cẩn thận khi hỏi và khi đánh giá lời khai; nghiên cứu cho thấy trí nhớ có thể bị dẫn dắt chứ không cho thấy nó luôn
    sai.'
  loai: loi-khuyen
  nguon:
  - loftus1974
  - loftus2005
  trich: These results are consistent with the view that the questions asked subsequent to an event can cause a reconstruction in one's memory of that event.
  vi_tri: Tóm tắt (Loftus & Palmer)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ của lời giải thích: "Phần lớn ký ức của ta đủ chính xác cho đời sống hằng ngày. Nghiên cứu cho thấy trí nhớ có thể bị dẫn dắt, chứ không phải nó luôn sai." Đã bỏ câu đầu (không
    nguồn đã mở nói tỉ lệ chính xác); câu sau giữ.'
