    cau: 'Vững chắc: trí nhớ được dựng lại và có thể bị thông tin sau sự kiện làm sai lệch.'
    loai: nhan
    nhan: vung-chac
    co_so:
      - loftus2005
      - blank2014
      - loftus1974
      - edmar2026
    ly_do: 'Hiện tượng thông tin sai lệch được nhiều thập kỷ nghiên cứu xác nhận ở nhiều kiểu thí nghiệm và cả ở loài khác (Loftus 2005: "observed in a variety of human and nonhuman species"); phân tích tổng hợp 25 nghiên cứu (155 hiệu ứng) về cảnh báo sau sự kiện (Blank & Launay 2014) xuất phát từ hiệu ứng đã được xác lập qua "hundreds of studies" và vẫn thấy hiệu ứng còn lại sau cảnh báo (giảm còn dưới một nửa). Nhãn chỉ nói hiệu ứng có thật và có thể xảy ra, không nói độ lớn hay tần suất ngoài đời. Review thêm: Edmar, Enquist & Luke (2026, bản thảo PsyArXiv, chưa bình duyệt) phân tích tổng hợp 480 nghiên cứu, 1.998 hiệu ứng, N = 59.079, g = 0,694 [0,259; 1,128], I2 = 92%, "support the robustness of the misinformation effect"; Blank & Launay (2014) là phân tích tổng hợp bình duyệt về cảnh báo sau sự kiện (hiệu ứng còn lại, giảm còn dưới một nửa).'
    nguon:
      - loftus2005
      - blank2014
      - loftus1974
      - edmar2026
    ket_qua: dung
    ghi_chu: 'Chỗ khó: thước đo mục 4 đòi phân tích tổng hợp hay tổng quan hệ thống chất lượng tốt; Loftus 2005 là tổng quan kể (narrative), Blank & Launay là phân tích tổng hợp về một mặt khác (cảnh báo). Không tìm được phân tích tổng hợp trực tiếp về độ lớn hiệu ứng thông tin sai lệch mở được. Giữ Vững chắc vì nhãn hẹp (hiệu ứng có thật); lượt 2 và review cân nhắc. Review (Claude Sonnet 5.5, 09/11/2026): dung. Nhãn Vững chắc, mục 4: nhãn hẹp (hiệu ứng thông tin sai lệch có thật và có thể làm sai lệch ký ức), đạt nhờ phân tích tổng hợp trực tiếp 480 nghiên cứu (bản thảo, ghi rõ chưa bình duyệt trên trang) cộng phân tích tổng hợp bình duyệt Blank & Launay 2014 và tổng quan Loftus 2005; không có thất bại tái lập; kết quả lẫn lộn giữa các nghiên cứu (I2 92%) đã ghi trên trang. Đã thêm hai phân tích tổng hợp vào khung (lượt 1 chỉ dẫn tổng quan kể). Khá vững sẽ hợp hơn nếu coi bản thảo là không đủ; chủ repo cân nhắc.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1101/lm.94705", "https://doi.org/10.1037/h0101798", "https://doi.org/10.1016/S0022-5371(74)80011-3" ]
    luot_2_ghi_chu: "Nhãn Vững chắc ở mức chấp nhận: có tổng quan 30 năm (tự thuật, không hệ thống) và phân tích tổng hợp 25 nghiên cứu (Blank và Launay 2014). Chưa thấy phân tích tổng hợp riêng hiệu ứng chính; nên giữ cách nói 'có thể bị làm sai lệch'."
    review: dung
