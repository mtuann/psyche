    cau: Tính đến 11/2026, theo những gì chúng tôi tìm được, thí nghiệm cụ thể này chưa có kết quả tái lập quy mô lớn, đăng ký trước; một bản làm lại nhỏ năm 2021 không thấy cách đặt câu hỏi ảnh hưởng đến ước lượng tốc độ, và một dự án tái lập quốc tế khoảng 20 ngôn ngữ đang được chuẩn bị (Zwaan, 6/2026).
    loai: thoi-su
    nguon:
      - zwaan2025
      - zwaan2026
      - raghunath2021
      - tim-kiem-vn
    het_han: '2027-11-01'
    ket_qua: da-sua
    ghi_chu: 'Zwaan (8/9/2025): "the study has never been directly replicated at scale using modern methods"; ông và Eerland nộp đề xuất tái lập nhiều phòng thí nghiệm (chờ tài trợ). OpenAlex tìm ngày 9/11/2026: chỉ thấy một bản làm lại nhỏ (60 học sinh một trường quốc tế ở Hàng Châu, doi 10.63313/ssh.9104, tạp chí không rõ, không đăng ký trước), không phải tái lập lớn. G1-L01 ghi lại câu trích của Zwaan; Zwaan là blog (bậc 3), nên đây là câu thời sự có hạn chứ không phải căn cứ chính của nhãn. Review (Claude Sonnet 5.5, 09/11/2026): sai. Mở Zwaan 2/6/2026 (substack): dự án quốc tế khoảng 20 ngôn ngữ, đang bàn thiết kế, không ghi số phòng thí nghiệm, không nhắc đăng ký trước, chưa có kết quả; nên trang chỉ nói "đang được chuẩn bị". Raghunath, Fultz & Sanchez (2021, Proc HFES 65(1), 848–853, OpenAlex tóm tắt): không thấy cách đặt câu hỏi ("made contact" với "smashed into") ảnh hưởng ước lượng tốc độ; là bản thay đổi so với thiết kế gốc (có thêm chất lượng hình, cách trình bày), nên trang chỉ gọi là "bản làm lại nhỏ" và dùng chữ trung tính. Nhãn Khá vững vẫn hợp: có kết quả không tái hiện ở một bản nhỏ nhưng không phải tái lập lớn có đăng ký trước.'
    luot_2: dung
    luot_2_nguon: [ "https://rolfzwaan.substack.com/p/replication-through-a-kaleidoscope", "https://doi.org/10.1177/1071181321651302" ]
    luot_2_ghi_chu: Kiểm 9/11/2026. Chưa có tái lập lớn đã công bố; nên ghi thêm rằng một dự án quốc tế đang làm (Zwaan, 6/2026, không rõ có đăng ký trước hay không) và có tái lập nhỏ năm 2021 không thấy hiệu ứng tốc độ.
    trich: Results showed that neither question phrasing, visual quality, nor presentation modality of car crashes affected speed estimates. [Raghunath, Fultz & Sanchez 2021] | a large international replication of the famous Loftus and Palmer (1974) study ... will be conducted in about 20 languages [Zwaan, 2/6/2026]
