    trich: We have biases and selectively recall instances supporting learning styles while ignoring disconfirming evidence.
    vi_tri: 'Hattie & O''Leary (2025), mục "main reasons"; Roediger & Karpicke 2006, Exp. 2: nhóm SSSS tin sẽ nhớ tốt hơn nhưng nhớ kém hơn sau 1 tuần'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Cảm giác dễ dàng bị nhầm với hiệu quả. Học theo cách mình thích cảm thấy trôi chảy hơn, nhưng… cảm giác dễ dàng lúc học thường không phản ánh hiệu quả về lâu dài." (suy luận, vế "học theo cách mình thích cảm thấy trôi chảy hơn" không có nguồn). Chữ mới dùng ý của Hattie & O''Leary (thiên lệch hồi tưởng) và link về duong-cong-quen. Review (Claude Sonnet 5.5, 09/11/2026): dung. Mở toàn văn Hattie & O''Leary 2025: "We have biases and selectively recall instances supporting learning styles while ignoring disconfirming evidence" (danh sách lý do vì sao ý tưởng còn phổ biến). Vế thứ hai (cảm giác học trôi chảy có thể không phản ánh hiệu quả lâu dài) trang đã nêu riêng và có nguồn Roediger & Karpicke 2006 qua link duong-cong-quen. Lượt 2 chỉ tìm không ra vì cách diễn đạt.'
    luot_2: khong-chac
