    ghi_chu: 'theo G1-L01 (22/10/2026): KHỚP (L45); đọc lại toàn văn PMC. "Nhỏ" theo thang của site (0,2–0,5). Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    review: dung
