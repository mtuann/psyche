  - id: n15
    cau: Một tổng quan năm 2025 gộp 17 phân tích tổng hợp; trong đó bốn phân tích tổng hợp kiểm tra trực tiếp việc dạy khớp phong cách (143 nghiên cứu, 401 hiệu ứng) cho hiệu ứng gần bằng 0 (d = 0,04).
    loai: so-lieu
    nguon:
      - hattie2025
    trich: There are currently four meta-analyses in the Visible Learning database that specifically address the matching hypothesis relative to academic outcomes. These meta-analyses capture findings from 143 studies and summarize 401 effects with an overall effect size of d = 0.04 (se = 0.21).
    vi_tri: Tóm tắt (Hattie & O'Leary 2025)
    ket_qua: da-sua
    ghi_chu: 'theo G1-L01 (22/10/2026): KHỚP (L46). Review (Claude Sonnet 5.5, 09/11/2026): sai. Mở toàn văn Hattie & O''Leary 2025 (Springer, mở): d = 0,04 là của bốn phân tích tổng hợp về giả thuyết khớp; gộp 17 phân tích tổng hợp thì trung bình d = 0,40 vì lẫn các nghiên cứu tương quan (r = 0,24). Chữ cũ "dựa trên 17 phân tích tổng hợp thấy ... d = 0,04" dễ hiểu là cả 17. Lưu ý se = 0,21 rộng: "gần bằng 0" là ước lượng trung bình, không phải khoảng tin cậy hẹp.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1007/s10648-025-10002-w" ]
    luot_2_ghi_chu: d = 0,04 là của bốn phân tích tổng hợp về giả thuyết khớp (143 nghiên cứu, 401 hiệu ứng) trong 17; toàn bộ 17 gộp lại cho d ≈ 0,40 vì lẫn nghiên cứu tương quan.
    review: sai
  - id: n16
    cau: Trong một khảo sát đăng năm 2012 với 242 giáo viên quan tâm đến khoa học não (137 người ở vùng Dorset, Anh; 105 người ở vùng quanh Amsterdam, Hà Lan), 93% giáo viên Anh và 96% giáo viên Hà Lan đồng ý rằng học sinh học tốt hơn khi được dạy theo phong cách học của mình.
    loai: so-lieu
    nguon:
      - dekker2012
    trich: Individuals learn better when they receive information in their preferred learning style (e.g., auditory, visual, kinesthetic). 93 96 4 3 3 1
    vi_tri: 'Table 1 (cột "Incorrect" UK, NL); Participants: "The total sample of 242 participants included 137 teachers from the Dorset region of the UK and 105 teachers from several regions in the NL surrounding the Amsterdam area"'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Trong một khảo sát năm 2012, 93% giáo viên ở Anh và 96% ở Hà Lan đồng ý…" Chữ mới nêu mẫu: 242 giáo viên "interested in the neuroscience of learning" ở hai vùng, vì G1 ghi mẫu này không đại diện cho toàn quốc. "Incorrect" trong bảng nghĩa là người trả lời đồng ý với mệnh đề sai; "đồng ý" ở đây suy từ cách bảng chấm điểm. Chỗ khó nhỏ: bảng gọi đây là "myth assertion", câu hỏi trả lời đúng/sai/không biết, không dùng chữ "agree". Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    review: dung
