    cau: Một phân tích tổng hợp năm 2024 gộp 21 nghiên cứu (1.712 người) tìm thấy một lợi ích nhỏ trung bình (g = 0,31).
    loai: so-lieu
    nguon:
      - clinton2024
    trich: A systematic search of the research findings yielded 21 eligible studies with 101 effect sizes and 1,712 participants for the meta-analysis. [...] there was an overall benefit of matching instruction to learning styles, g = 0.31, SE = 0.12, 95% CI = [0.05, 0.57], p = 0.02.
    vi_tri: Tóm tắt (Clinton-Lisell & Litzinger 2024); PMC11270031
