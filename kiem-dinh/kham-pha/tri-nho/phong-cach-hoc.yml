    review: dung
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: '"Với hầu hết mọi người, cách học tốt nhất phụ thuộc vào nội dung… Đây là một gợi ý quan trọng cho phần dưới đây."'
    moi: '"Rất có thể cách học hợp lý phụ thuộc vào nội dung… Đó là một gợi ý để suy nghĩ…, không phải kết quả của một nghiên cứu cụ thể."'
    ly_do: Hồ sơ n2.
  - cu: '"Phổ biến nhất là chia người học thành ba nhóm: nhìn, nghe và vận động."'
    moi: '"Một cách chia rất quen thuộc là ba nhóm: nhìn, nghe và vận động (cách chia VARK thêm nhóm đọc–viết)."'
    ly_do: Hồ sơ n4.
  - cu: '"Điều này đúng, và chẳng ai phản đối: có người thích đọc, có người thích nghe giảng."'
    moi: '"Điều này đúng: … Pashler và cộng sự (2008) thấy nhiều bằng chứng rằng người ta nói ra các sở thích như vậy khi được hỏi."'
    ly_do: Hồ sơ n5.
  - cu: '"Trong một khảo sát năm 2012, 93% giáo viên ở Anh và 96% ở Hà Lan…"'
    moi: '"Trong một khảo sát đăng năm 2012 với 242 giáo viên quan tâm đến khoa học não (137 người ở vùng Dorset, Anh; 105 người ở vùng quanh Amsterdam, Hà Lan), 93% giáo viên Anh và 96% giáo viên Hà Lan…"'
    ly_do: Hồ sơ n16.
  - cu: '"…các tổng hợp gần nhất cho hiệu ứng rất nhỏ hoặc bằng 0."'
    moi: '"…các tổng hợp gần nhất cho hiệu ứng từ nhỏ đến gần bằng 0 (các tác giả của phân tích tổng hợp 2024 cũng không khuyên áp dụng rộng rãi)."'
    ly_do: Hồ sơ n20.
  - cu: '"Chỉ là học theo cách mình thích không làm mình học tốt hơn." (khung Vững chắc)'
    moi: '"Chỉ là các nghiên cứu cho đến nay gần như không thấy học theo cách mình thích làm mình học tốt hơn."'
    ly_do: Hồ sơ n24.
  - cu: '"Nó dễ chịu. Ý tưởng "ai cũng giỏi theo cách riêng" mang tính tôn trọng và lạc quan."'
    moi: '"Nó hợp với mong muốn cá nhân hóa việc dạy. Hattie và O''Leary (2025) kể sự hấp dẫn của việc cá nhân hóa trong số các lý do…"'
    ly_do: Hồ sơ n26.
  - cu: '"Cảm giác dễ dàng bị nhầm với hiệu quả. Học theo cách mình thích cảm thấy trôi chảy hơn…"'
    moi: '"Ta nhớ những lần cách ưa thích có vẻ hiệu quả. Hattie và O''Leary (2025) cho rằng ta dễ nhớ… và như bài Học dồn có nhớ lâu? cho thấy, cảm giác học trôi chảy có thể không phản ánh hiệu quả về lâu dài."'
    ly_do: Hồ sơ n27.
  - cu: '"Bản đồ, sơ đồ, hình học: học bằng hình. … Điều này đúng với mọi người." và "Dùng hai kỹ thuật có bằng chứng vững chắc cho mọi người: [ôn tập rải ra nhiều lần và tự kiểm tra](…/vi-sao-ta-quen/#ap-dung-vao-doi-song)."'
    moi: '"Chọn cách học theo nội dung và mục tiêu: … Các ví dụ cụ thể ở đây là suy luận của chúng tôi…"; "Dùng hai kỹ thuật có bằng chứng vững chắc: […](…/duong-cong-quen/#ap-dung-vao-doi-song)."'
    ly_do: Hồ sơ n28, n29, n30.
  - cu: '"**Giới hạn.** … Người có khiếm khuyết về giác quan hoặc khó khăn học tập cụ thể (ví dụ khó đọc) cần những điều chỉnh riêng, đó là chuyện khác với "phong cách học"."'
    moi: '"**Giới hạn.** … Trang này không bàn về nhu cầu hỗ trợ riêng của người có khiếm khuyết… hãy trao đổi với giáo viên hoặc chuyên gia."'
    ly_do: Hồ sơ n31 (bỏ khẳng định không nguồn, giữ lời chuyển tuyến).
  - cu: '"Chúng tôi chưa tìm thấy khảo sát… niềm tin này phổ biến ở cả 18 quốc gia được khảo sát…"'
    moi: '"Tính đến 11/2026, chúng tôi chưa tìm thấy khảo sát… Tổng quan năm 2020 gộp các khảo sát từ 18 quốc gia và thấy niềm tin này phổ biến…"'
    ly_do: Hồ sơ n32, n33.
  - cu: '"Một tổng hợp năm 2025 dựa trên 17 phân tích tổng hợp thấy rằng ở các nghiên cứu thật sự kiểm tra việc dạy khớp phong cách, hiệu ứng gần bằng 0 (d = 0,04)"'
    moi: '"Một tổng quan năm 2025 gộp 17 phân tích tổng hợp. Trong đó, bốn phân tích tổng hợp kiểm tra trực tiếp việc dạy khớp phong cách (143 nghiên cứu, 401 hiệu ứng) cho hiệu ứng gần bằng 0 (d = 0,04)"'
    ly_do: Review n15.
  - cu: Khung :::vung-chac[người ta có sở thích học khác nhau] "Sở thích là có thật. Chỉ là các nghiên cứu cho đến nay gần như không thấy học theo cách mình thích làm mình học tốt hơn."
    moi: 'Khung :::kha-vung[người ta có sở thích học khác nhau]: sở thích tự khai (Pashler 2008), chưa có phân tích tổng hợp riêng, nên Khá vững; việc học theo sở thích có giúp học tốt hơn là chuyện khác (xem khung Đã bị bác bỏ)'
    ly_do: 'Review n23: nhãn theo thước đo mục 4.'
