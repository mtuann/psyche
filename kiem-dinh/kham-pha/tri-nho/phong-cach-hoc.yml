  - id: n23
    cau: 'Khá vững: người ta có sở thích học khác nhau.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - pashler2008
      - hattie2025
    ly_do: 'Pashler và cộng sự (2008): "ample evidence that children and adults will, if asked, express preferences about how they prefer information to be presented to them"; Hattie & O''Leary (2025) nói các nghiên cứu tương quan về phong cách báo "modest relationships" (r = 0,24). Là bằng chứng tự khai, từ một tổng quan (chưa tìm thấy phân tích tổng hợp riêng về mức phổ biến hay độ ổn định của sở thích): theo mục 4, Vững chắc cần phân tích tổng hợp hay tổng quan hệ thống, nên chỉ Khá vững. Nhãn không nói sở thích dự báo kết quả học (việc ấy ở khung Đã bị bác bỏ).'
    nguon:
      - pashler2008
      - hattie2025
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó: thước đo mục 4 đòi phân tích tổng hợp; "sở thích học khác nhau" gần như hiển nhiên và được tổng quan của Pashler xác nhận (bậc 2), không có phân tích tổng hợp riêng đã mở. Theo bài học đợt 3–4: khung gộp hai ý theo ý yếu hơn; ý thứ hai ("học theo cách mình thích không làm mình học tốt hơn") đã có nhãn bác bỏ ở n19. Lượt 2/review cân nhắc tách hay đổi nhãn. Review (Claude Sonnet 5.5, 09/11/2026): sai. Nhãn đổi từ Vững chắc sang Khá vững. Lý do: thước đo mục 4 đòi phân tích tổng hợp/tổng quan hệ thống; Pashler 2008 là tổng quan kể (bậc 2) và chỉ nói về sở thích nói ra khi được hỏi; đã mở Hattie & O''Leary, không có phân tích tổng hợp trực tiếp về sở thích. Không xung đột với trang đã khóa (doc-nhan-chac-chan chỉ gắn nhãn cho việc dạy khớp phong cách, Đã bị bác bỏ). Khung trên trang đã đổi sang :::kha-vung và bỏ nửa câu thứ hai lặp ý của khung Đã bị bác bỏ (nay nói tách rõ).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1539-6053.2009.01038.x" ]
    luot_2_ghi_chu: Bằng chứng là ưa thích tự khai, không phải hiệu quả học.
    review: sai
