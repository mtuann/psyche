    review: dung
  - id: n33
    cau: Tổng quan năm 2020 gộp các khảo sát từ 18 quốc gia và thấy niềm tin này phổ biến, nên có thể nó cũng phổ biến ở Việt Nam, nhưng đó chỉ là phỏng đoán.
    loai: phat-hien
    nguon:
      - newton2020
    trich: We identified 37 studies representing 15,405 educators from 18 countries around the world, spanning 2009 to early 2020.
    vi_tri: Tóm tắt (Newton & Salvi 2020)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "niềm tin này phổ biến ở cả 18 quốc gia được khảo sát". Chữ mới: "gộp các khảo sát từ 18 quốc gia và thấy niềm tin này phổ biến" (tỉ lệ giữa các nghiên cứu từ 58% đến 97,6%; không kiểm từng nước). Phần "phỏng đoán" tự ghi rõ. Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    review: dung
  - id: n34
    cau: 'Đã bị bác bỏ (chip): "Dạy đúng phong cách học giúp học tốt hơn."'
    loai: nhan
    nhan: bac-bo
    co_so: &id002
      - pashler2008
      - hattie2025
      - clinton2024
    ly_do: Như n19. Khớp nhãn thẻ ngộ nhận phong-cach-hoc (src/data/ngo-nhan.yml).
    nguon: *id002
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1539-6053.2009.01038.x", "https://doi.org/10.1007/s10648-025-10002-w", "https://doi.org/10.3389/fpsyg.2024.1428732" ]
    luot_2_ghi_chu: Xem n19 về g = 0,31 của phân tích 2024.
    ghi_chu: 'Review (Claude Sonnet 5.5, 09/11/2026): dung. Như n19; trang nhắc g = 0,31 (Clinton-Lisell & Litzinger 2024) ở mục "Các tổng hợp gần đây", nên không cần thêm.'
    review: dung
  - id: n35
    cau: 'Đã bị bác bỏ (chip): "Có người thiên não trái, có người thiên não phải."'
    loai: nhan
    nhan: bac-bo
    co_so: &id003
      - nielsen2013
    ly_do: 'Phân tích kết nối chức năng lúc nghỉ ở nhiều người cho thấy lateralization là đặc điểm cục bộ của từng nút, không phải kiểu người: "our data are not consistent with a whole-brain phenotype of greater “left-brained” or greater “right-brained” network strength across individuals" (Nielsen và cộng sự 2013). Thẻ ngộ nhận nao-trai-phai của site có nhãn Đã bị bác bỏ.'
    nguon: *id003
    ket_qua: dung
    ghi_chu: 'Chỗ khó: dựa một nghiên cứu hình ảnh não lớn (không phải tổng hợp hay tái lập). Nhãn đứng ở thẻ ngộ nhận nao-trai-phai (khóa ở D8-L3); trang này chỉ nhắc lại. Nếu thẻ khóa nhãn khác thì sửa theo. Người giao/review cân nhắc. Review (Claude Sonnet 5.5, 09/11/2026): dung. Chip Đã bị bác bỏ cho ngộ nhận não trái/phải: Nielsen và cộng sự 2013 (1.011 người, không thấy "left-brained" hay "right-brained" toàn não), khớp thẻ nao-trai-phai (bac-bo). Dựa một nghiên cứu hình ảnh lớn hơn là phân tích tổng hợp: chấp nhận ở mức chip của ngộ nhận; nếu thẻ ngộ nhận khóa nhãn khác thì sửa theo.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1371/journal.pone.0071275", "https://doi.org/10.3389/fpsyg.2012.00429" ]
    luot_2_ghi_chu: Căn cứ chủ yếu là một nghiên cứu hình ảnh lớn (1.011 người) cộng khảo sát về 'huyền thoại thần kinh'; đủ cho khẳng định 'không có kiểu người thiên một bán cầu', nhưng nhãn 'Đã bị bác bỏ' dựa vào một nghiên cứu lớn hơn là nhiều kiểm tra liên tiếp. Chấp nhận.
    review: dung
  - id: n36
    cau: 'Quiz 1: sở thích học khác nhau là có thật, nội dung khác nhau hợp với cách học khác nhau; điều thiếu bằng chứng là việc khớp cách dạy với kiểu người giúp học tốt hơn.'
    loai: phat-hien
    nguon:
      - pashler2008
      - hattie2025
    trich: We conclude therefore, that at present, there is no adequate evidence base to justify incorporating learning-styles assessments into general educational practice.
    vi_tri: Tóm tắt (Pashler 2008)
    ket_qua: dung
    ghi_chu: 'Giải thích: "Sở thích là có thật, và nội dung khác nhau hợp với cách học khác nhau." Vế "nội dung khác nhau hợp với cách học khác nhau" chỉ có Hattie & O''Leary (task complexity) ủng hộ gián tiếp; trang giữ nhưng ghi ở n28 là suy luận. Câu đáp án "Một số nội dung học bằng hình dễ hơn học bằng lời" là mệnh đề minh họa (gia-dinh). Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    review: dung
  - id: n37
    cau: 'Quiz 2: kết quả ủng hộ giả thuyết khớp phải là kết quả bắt chéo: học sinh "nhìn" học tốt hơn với cách dạy bằng hình, và học sinh "nghe" học tốt hơn với cách dạy bằng lời; nếu cả hai nhóm đều học tốt hơn với hình, đó là ưu điểm của hình, không phải của việc "khớp".'
    loai: phat-hien
    nguon:
      - pashler2008
    trich: the instructional method that proves most effective for students with one learning style is not the most effective method for students with a different learning style.
    vi_tri: Tóm tắt (Pashler 2008)
    ket_qua: dung
    ghi_chu: Vế "ưu điểm của hình, không phải của việc khớp" là suy luận logic từ tiêu chí bắt chéo.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1539-6053.2009.01038.x" ]
  - id: n38
    cau: 'Quiz 3: mức độ phổ biến của một niềm tin không phải là bằng chứng; kinh nghiệm cá nhân khó tách được tác dụng của việc khớp phong cách khỏi các yếu tố khác; đó là việc của thí nghiệm có đối chứng.'
    loai: phat-hien
    nguon:
      - hattie2025
    trich: We have biases and selectively recall instances supporting learning styles while ignoring disconfirming evidence.
    vi_tri: Hattie & O'Leary (2025), mục "main reasons"
    ket_qua: dung
    ghi_chu: '"Gần 90% giáo viên" ở câu hỏi: n17 (89%). Phần còn lại là lập luận phương pháp (suy luận); xem trang Vì sao cần nhóm đối chứng.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1539-6053.2009.01038.x" ]
    luot_2_ghi_chu: Câu là lập luận phương pháp luận khớp với tiêu chí của Pashler và cộng sự.
  - id: n39
    cau: 'Quiz 4: phân tích tổng hợp năm 2024 tìm thấy g = 0,31 nhưng các tác giả không khuyên áp dụng vì chỉ khoảng một phần tư số phép đo cho kiểu kết quả bắt chéo cần thiết và chất lượng nghiên cứu thấp.'
    loai: phat-hien
    nguon:
