nhan_dinh:
  - id: n1
    cau: Ý tưởng dạy học khớp với phong cách nhìn, nghe hay vận động rất phổ biến (mô tả của trang).
    loai: phat-hien
    nguon:
      - newton2020
      - dekker2012
    trich: We identified 37 studies representing 15,405 educators from 18 countries around the world, spanning 2009 to early 2020. [...] weighted percentage of 89.1%, ranging from 58 to 97.6%.
    vi_tri: Newton & Salvi (2020), tóm tắt
    ket_qua: dung
    ghi_chu: 'Mô tả (description). "Phổ biến" = niềm tin phổ biến ở nhà giáo dục (n20). Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    review: dung
  - id: n2
    cau: 'Với "phong cách học" (nhìn, nghe, vận động), rất có thể cách học hợp lý phụ thuộc vào nội dung cần học nhiều hơn là vào "kiểu người": bản đồ thì nên nhìn, phát âm thì nên nghe; đây là gợi ý để suy nghĩ, không phải kết quả của một nghiên cứu cụ thể.'
    loai: loi-khuyen
    nguon:
      - hattie2025
    trich: educators should focus on teaching students how to select and apply adaptive learning strategies that align more closely with task complexity and learning goals.
    vi_tri: Hattie & O'Leary (2025), tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ (khung "Bạn nhận ra điều gì?"): "Với hầu hết mọi người, cách học tốt nhất phụ thuộc vào nội dung cần học nhiều hơn là vào "kiểu người". … Đây là một gợi ý quan trọng". Chữ mới: "Rất có thể…" và "gợi ý để suy nghĩ, không phải kết quả của một nghiên cứu cụ thể". Ví dụ đường đi, phát âm là tình huống giả định (gia-dinh). Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    review: dung
  - id: n3
    cau: Một tổng quan năm 2004 đếm được 71 mô hình phong cách học khác nhau (Coffield và cộng sự, 2004).
    loai: so-lieu
    nguon:
      - coffield2004
    trich: Coffield et al. (2004) identified 71 different learning style models, which they subdivided into 13 major and 58 minor models.
    vi_tri: McGill Journal of Education (bài tổng quan kể lại Coffield 2004), tr. đầu bài
    ket_qua: dung
    ghi_chu: 'Theo "McGill Journal of Education kể lại" (bài tổng quan trên mje.mcgill.ca), không mở được bản gốc Coffield 2004 (các bản PDF ở ulb.be, ERIC trả 403/404). G1-L01 cũng chỉ có nguồn thứ cấp. Viết ở mức "theo bài tổng quan kể lại"; trang đã nêu "theo Coffield và cộng sự (2004)" nhưng không nói kể lại; người giao cân nhắc thêm "(theo McGill Journal of Education)" hay tìm bản gốc. Review (Claude Sonnet 5.5, 09/11/2026): dung. Không mở được bản gốc Coffield 2004; con số 71 mô hình (13 chính, 58 phụ) là điều Coffield nêu và nhiều nguồn thứ cấp dẫn lại (bài tổng quan McGill Journal of Education). Trang viết "một tổng quan năm 2004 đếm được 71 mô hình (Coffield và cộng sự, 2004)": chấp nhận, nhưng còn chỗ treo: chưa mở được bản gốc.'
    review: dung
  - id: n4
    cau: 'Một cách chia rất quen thuộc là ba nhóm: nhìn, nghe và vận động (cách chia VARK thêm nhóm đọc–viết).'
    loai: dinh-nghia
    nguon:
      - newton2020
      - dekker2012
    trich: categorizes individuals as one or more of Visual, Auditory, Read-Write and Kinesthetic learners.
    vi_tri: 'Newton & Salvi (2020), mục Introduction; Dekker: "(e.g., auditory, visual, kinesthetic)"'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Phổ biến nhất là chia người học thành ba nhóm: nhìn, nghe và vận động." Chữ mới: "một cách chia rất quen thuộc" (không đo được "phổ biến nhất") và nêu VARK. Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1007/s10648-025-10002-w", "https://doi.org/10.1111/j.1539-6053.2009.01038.x" ]
    luot_2_ghi_chu: Chỉ đọc phần mô tả VARK trong EPR 2025; VAK (nhìn, nghe, vận động) là cách chia gốc.
    review: dung
  - id: n5
    cau: 'Người ta có sở thích học khác nhau: có người thích đọc, có người thích nghe giảng; Pashler và cộng sự (2008) thấy nhiều bằng chứng rằng người ta nói ra các sở thích như vậy khi được hỏi.'
    loai: phat-hien
    nguon:
      - pashler2008
    trich: Our review of the literature disclosed ample evidence that children and adults will, if asked, express preferences about how they prefer information to be presented to them.
    vi_tri: Tóm tắt (Pashler 2008)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Điều này đúng, và chẳng ai phản đối". Chữ mới bỏ "chẳng ai phản đối" (không kiểm được) và dẫn Pashler 2008. Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1539-6053.2009.01038.x" ]
    review: dung
  - id: n6
    cau: 'Khẳng định thứ hai: dạy khớp với phong cách của từng người thì họ học tốt hơn; các nhà nghiên cứu gọi đây là giả thuyết khớp (meshing hypothesis).'
    loai: dinh-nghia
    nguon:
      - pashler2008
    trich: The most common-but not the only-hypothesis about the instructional relevance of learning styles is the meshing hypothesis, according to which instruction is best provided in a format that matches the preferences of the learner
    vi_tri: Tóm tắt (Pashler 2008)
    ket_qua: dung
    ghi_chu: 'Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    review: dung
  - id: n7
    cau: Giả thuyết khớp là khẳng định quan trọng vì nó dẫn đến việc phân loại học sinh và thiết kế bài giảng riêng cho từng nhóm.
    loai: dinh-nghia
    nguon:
      - pashler2008
    trich: Proponents of learning-style assessment contend that optimal instruction requires diagnosing individuals' learning style and tailoring instruction accordingly.
    vi_tri: Tóm tắt (Pashler 2008)
    ket_qua: dung
    ghi_chu: 'Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    review: dung
  - id: n8
    cau: Năm 2008, bốn nhà tâm lý học nhận thức xem xét lại các nghiên cứu về phong cách học (Pashler và cộng sự, 2008).
    loai: lich-su
    nguon:
      - pashler2008
    trich: The authors of the present review were charged with determining whether these practices are supported by scientific evidence.
    vi_tri: 'Tóm tắt (Pashler 2008); tác giả: Pashler, McDaniel, Rohrer, Bjork (Psychological Science in the Public Interest 9(3), 12/2008)'
    ket_qua: dung
    ghi_chu: 'Bốn tác giả. "Nhà tâm lý học nhận thức": theo G1-L01 và hồ sơ nghề nghiệp của họ (không kiểm riêng). Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    review: dung
  - id: n9
    cau: 'Để kiểm tra giả thuyết khớp cần một thiết kế: phân loại người học theo phong cách; chia ngẫu nhiên mỗi nhóm sang các cách học; cho tất cả làm cùng một bài kiểm tra; giả thuyết chỉ được ủng hộ nếu kết quả "bắt chéo": người "nhìn" học tốt hơn bằng hình, người "nghe" học tốt hơn bằng lời.'
    loai: phat-hien
    nguon:
      - pashler2008
    trich: First, students must be divided into groups on the basis of their learning styles, and then students from each group must be randomly assigned to receive one of multiple instructional methods. Next, students must then sit for a final test that is the same for all students. Finally, in order to demonstrate that optimal learning requires that students receive instruction tailored to their putative learning style, the experiment must reveal a specific type of interaction between learning style and instructional method
    vi_tri: Tóm tắt (Pashler 2008)
    ket_qua: dung
    ghi_chu: 'theo G1-L01 (22/10/2026): KHỚP (L34–41). Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    review: dung
  - id: n10
    cau: Rất ít nghiên cứu dùng thiết kế này, và trong những nghiên cứu đó, Pashler và cộng sự gần như không tìm thấy bằng chứng cho kiểu kết quả bắt chéo, trong khi một số nghiên cứu cho kết quả trái ngược hẳn.
    loai: phat-hien
    nguon:
      - pashler2008
    trich: we found virtually no evidence for the interaction pattern mentioned above [...] very few studies have even used an experimental methodology capable of testing the validity of learning styles applied to education. Moreover, of those that did use an appropriate method, several found results that flatly contradict the popular meshing hypothesis.
    vi_tri: Tóm tắt (Pashler 2008)
    ket_qua: dung
    ghi_chu: 'theo G1-L01 (22/10/2026): KHỚP. Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    review: dung
