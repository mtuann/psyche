    cau: 'Đã bị bác bỏ: dạy khớp với phong cách học giúp học tốt hơn.'
    loai: nhan
    nhan: bac-bo
    co_so: &id001
      - pashler2008
      - hattie2025
      - clinton2024
      - newton2020
    ly_do: 'Các nghiên cứu có thiết kế phù hợp gần như không tìm thấy bằng chứng (Pashler 2008: "virtually no evidence"; "flatly contradict"), tổng hợp 17 phân tích tổng hợp cho d = 0,04 ở các nghiên cứu kiểm đúng giả thuyết (Hattie & O''Leary 2025), và phân tích tổng hợp 2024 (21 nghiên cứu) thấy g = 0,31 nhưng chỉ 26% số phép đo cho kiểu bắt chéo và chất lượng thấp, nên chính các tác giả không khuyên áp dụng. Các kiểm tra đủ mạnh liên tục thất bại, dù nhiều phiên bản chưa bao giờ được kiểm tra. Khớp nhãn ở bang-chung/do-lon-hieu-ung (d = 0,04, Đã bị bác bỏ) và thẻ ngộ nhận phong-cach-hoc.'
    nguon: *id001
    ket_qua: dung
    ghi_chu: 'Chỗ khó: g = 0,31 của Clinton-Lisell & Litzinger (2024) lớn hơn nhiều so với 0,04 của Hattie & O''Leary (2025). Đã giải thích trên trang (chất lượng thấp, 26%). Giữ Đã bị bác bỏ vì khớp nhãn của các trang đã khóa; lượt 2 và review cân nhắc "Đang tranh cãi" cho phần "hiệu ứng nhỏ nhưng khác 0". Review (Claude Sonnet 5.5, 09/11/2026): dung. Đã bị bác bỏ cho "dạy khớp phong cách giúp học tốt hơn": khớp doc-nhan-chac-chan, bang-chung/do-lon-hieu-ung (d = 0,04) và thẻ ngộ nhận phong-cach-hoc (bac-bo). Giữ vì Pashler 2008 ("virtually no evidence"; vài nghiên cứu "flatly contradict"), Hattie 2025 (bốn tổng hợp, d = 0,04) và chính Clinton-Lisell & Litzinger 2024 (g = 0,31 nhưng 26% có dạng bắt chéo, chất lượng thấp, "too small and too infrequent to warrant widespread adoption"). Trang đã nêu g = 0,31 ở mục "Các tổng hợp gần đây" và trong khung; không cần đổi nhãn.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1111/j.1539-6053.2009.01038.x", "https://doi.org/10.1007/s10648-025-10002-w", "https://doi.org/10.3389/fpsyg.2024.1428732" ]
    luot_2_ghi_chu: "Đạt Đã bị bác bỏ ở mức chấp nhận. Lưu ý: phân tích tổng hợp 2024 (Clinton-Lisell và Litzinger) thấy g = 0,31 nhưng chỉ 26% kết quả có dạng bắt chéo, chất lượng nghiên cứu thấp, và kết luận 'quá nhỏ và quá hiếm để áp dụng rộng'. Nên nhắc đến."
