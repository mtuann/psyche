  - id: n15
    cau: Murre và Dros (hai nhà nghiên cứu ở Hà Lan) làm lại thí nghiệm, cố bám sát bản gốc trong điều kiện cho phép.
    loai: phat-hien
    nguon:
      - murre2015
    trich: All of this was aimed at following Ebbinghaus as closely as possible.
    vi_tri: 'Methods, Procedure; Affiliation: University of Amsterdam'
    ket_qua: da-sua
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1371/journal.pone.0120644" ]
    luot_2_ghi_chu: Bài tự nhận là 'close enough to be called a replication', có khác biệt (tiếng Hà Lan, 10 lần thử mỗi mốc, 75 ngày, không cố định giờ trong ngày). 'Gần giống nhất có thể' hơi mạnh nhưng chấp nhận được; nên nói 'gần giống nhất trong điều kiện cho phép'.
    ghi_chu: 'Review (Claude Sonnet 5.5, 09/11/2026): sai. Chữ cũ: "theo cách gần giống nhất có thể". Bài chỉ nói mục tiêu là bám sát Ebbinghaus ("as closely as possible") và tự nhận là bản làm lại đủ gần; vẫn có khác biệt (số lần thử mỗi mốc, giờ trong ngày không cố định), nên "gần giống nhất có thể" nói như đã đạt. Chữ mới: "cố bám sát bản gốc trong điều kiện cho phép" (theo gợi ý lượt 2).'
    review: sai
