    ghi_chu: 'Chữ cũ (đã sửa theo G1-L01 #2): "Ai cũng quên theo cùng một đường cong." Chữ mới: "…theo một hình dạng giống nhau". Vế "quên những chi tiết không dùng đến là bình thường" dựa vào Nørby (quên có chức năng) và OpenStax (storage decay: "unused information tends to fade"). Review (Claude Sonnet 5.5, 09/11/2026): sai. Chữ cũ: "Ai cũng quên theo một hình dạng giống nhau". "Ai cũng" khái quát từ một người (Dros) so với Ebbinghaus ("resemblance of the four graphs remarkable" là so các đồ thị trong bài) và 210 bộ dữ liệu (Rubin & Wenzel, bốn họ hàm khớp phần lớn), không từ "mọi người". Chữ mới: "Nhiều nghiên cứu thấy quên theo cùng một hình dạng". Vế "quên chi tiết không dùng đến là bình thường" giữ (Nørby; OpenStax storage decay).'
