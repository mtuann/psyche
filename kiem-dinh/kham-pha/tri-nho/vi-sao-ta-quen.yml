nhan_dinh:
  - id: n1
    cau: Đường cong quên của Ebbinghaus, lần tái lập năm 2015, và hai cách nhớ lâu hơn có bằng chứng vững chắc.
    loai: lich-su
    nguon:
      - murre2015
      - ebbinghaus1885
    trich: We present a successful replication of Ebbinghaus ’ classic forgetting curve from 1880 based on the method of savings.
    vi_tri: Tóm tắt (Murre & Dros)
    ket_qua: dung
    ghi_chu: Mô tả (description) của trang. Phần "hai cách nhớ lâu hơn có bằng chứng vững chắc" kiểm ở n44 và n50 (khung nhãn).
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1371/journal.pone.0120644" ]
  - id: n2
    cau: Năm 1879, nhà nghiên cứu người Đức Hermann Ebbinghaus tự học thuộc các danh sách âm tiết vô nghĩa rồi đo xem mình quên nhanh đến đâu.
    loai: lich-su
    nguon:
      - ebbinghaus1885
      - murre2015
    trich: The investigations in question fell in the year 1879-80 and comprised 163 double tests.
    vi_tri: Ebbinghaus, chương 7
    ket_qua: dung
    ghi_chu: 'theo G1-L01 (22/10/2026): KHỚP (L14). "Người Đức": Murre & Dros tả đây là "the first non-German replication" và Ebbinghaus chịu ảnh hưởng triết gia Đức Herbart. Các âm tiết "DAX", "BOK", "ZUF" là ví dụ minh họa của trang, đã ghi rõ trong chữ (gia-dinh), không phải âm tiết trong bài gốc.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1371/journal.pone.0120644", "https://psychclassics.yorku.ca/Ebbinghaus/memory3.htm" ]
    luot_2_ghi_chu: Ebbinghaus là người tham gia duy nhất; thí nghiệm 1879-80.
  - id: n3
    cau: 'Ebbinghaus quên nhanh lúc đầu rồi chậm dần: phần lớn sụt giảm xảy ra trong vài giờ đầu, sau đó đường cong thoải dần.'
    loai: phat-hien
    nguon:
      - ebbinghaus1885
    trich: forgetting would be very rapid at the beginning of the process and very slow at the end
    vi_tri: Chương 7, mục nhận xét về kết quả
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "sau đó, đường cong gần như nằm ngang"; chữ mới: "thoải dần". Lý do: Bảng 3 của Murre & Dros: tiết kiệm 35,8% sau 9 giờ nhưng vẫn giảm tiếp còn 21,1% sau 31 ngày, nên không "gần như nằm ngang". Ebbinghaus: "after 8 hours the work to be made up amounted to two thirds ... after a whole month fully one fifth of the first work persisted". Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1371/journal.pone.0120644" ]
    luot_2_ghi_chu: Tiết kiệm giảm nhanh trong 9 giờ đầu rồi thoải dần.
    review: dung
  - id: n4
    cau: '"Tiết kiệm" của Ebbinghaus không phải tỉ lệ phần trăm kiến thức còn nhớ, như một số tài liệu vẫn viết.'
    loai: dinh-nghia
    nguon:
      - murre2015
      - openstax2e
    trich: Savings is defined as the relative amount of time saved on the second learning trial as a result of having had the first.
    vi_tri: 'Murre & Dros, mục Introduction; OpenStax 8.3: "an average person will lose 50% of the memorized information after 20 minutes and 70% of the information after 24 hours (Ebbinghaus, 1885/1964)"'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "…như nhiều trang mạng vẫn viết"; chữ mới: "…như một số tài liệu vẫn viết". Lý do: không đếm được "nhiều trang mạng"; giáo trình mở OpenStax 8.3 là ví dụ có thật của cách viết sai ấy. Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1371/journal.pone.0120644" ]
    review: dung
  - id: n5
    cau: 'Quên không hẳn là lỗi của trí nhớ: một bài tổng quan cho rằng quên còn có những chức năng có ích, chẳng hạn giúp cập nhật kiến thức và điều tiết cảm xúc.'
    loai: dinh-nghia
    nguon:
      - norby2015
    trich: forgetting does not have exclusively negative consequences; it also serves valuable, indeed vital, functions.
    vi_tri: Tóm tắt (Nørby, 2015)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Quên không phải là lỗi của trí nhớ. Nó là một phần của cách trí nhớ hoạt động… Nếu cái gì cũng nhớ mãi, việc tìm lại điều quan trọng sẽ khó hơn nhiều." Chữ mới dẫn Nørby (2015) và bỏ câu giả định về việc tìm lại điều quan trọng (không có nguồn đã mở). Chỉ đọc tóm tắt; tóm tắt nói quên giúp điều tiết cảm xúc, thu nhận kiến thức (trừu tượng hóa) và "ensuring that knowledge is current". Ví dụ màu áo, giá món đồ là minh họa của trang (gia-dinh). Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1177/1745691615596787" ]
    luot_2_ghi_chu: Nørby 2015, tổng quan; chỉ đọc tóm tắt. Giả định đây là bài tổng quan mà trang dẫn; nếu trang dẫn bài khác thì cần đối chiếu.
    review: dung
  - id: n6
    cau: 'Quên có hình dạng khá đều đặn: dốc ở đầu, thoải về sau.'
    loai: phat-hien
    nguon:
      - rubin1996
      - murre2015
    trich: The best fits were to the logarithmic function, the power function, the exponential in the square root of time, and the hyperbola in the square root of time.
    vi_tri: 'Rubin & Wenzel (1996), tóm tắt: 210 bộ dữ liệu; Murre & Dros: bốn đồ thị rất giống nhau'
    ket_qua: dung
    ghi_chu: Cả bốn hàm tốt nhất đều giảm nhanh lúc đầu rồi chậm dần. Chỉ đọc tóm tắt Rubin & Wenzel; hình dạng cụ thể của các hàm là kiến thức toán, không phải câu trích.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1371/journal.pone.0120644", "https://doi.org/10.1037/0033-295X.103.4.734" ]
    luot_2_ghi_chu: Rubin và Wenzel 1996 (chỉ đọc tóm tắt) cho thấy hình dạng chung.
  - id: n7
    cau: Ebbinghaus được xem là người đầu tiên làm một loạt thí nghiệm chặt chẽ về hình dạng của việc quên.
    loai: lich-su
    nguon:
      - murre2015
    trich: he was the first to carry out a series of rigorous experiments on the shape of forgetting, which he completed in 1880.
    vi_tri: Introduction (Murre & Dros)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Ebbinghaus là người đầu tiên đo được hình dạng ấy." Chữ mới giữ đúng chữ của nguồn: "series of rigorous experiments" và có dẫn Murre & Dros. Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1371/journal.pone.0120644" ]
    luot_2_ghi_chu: Câu dùng 'được xem là', thận trọng.
    review: dung
  - id: n8
    cau: Ebbinghaus là người tham gia duy nhất.
    loai: phat-hien
    nguon:
      - murre2015
      - ebbinghaus1885
    trich: In all experiments reported by Ebbinghaus [9], he used only himself as a subject.
    vi_tri: Murre & Dros, Introduction
    ket_qua: dung
    ghi_chu: 'Ebbinghaus chương 7: "for a certain individual".'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1371/journal.pone.0120644" ]
  - id: n9
    cau: Ông dùng âm tiết vô nghĩa để tránh việc ý nghĩa của từ giúp ông nhớ.
    loai: lich-su
    nguon:
      - murre2015
    trich: the poem fragments he tried to learn (from Byron’s Don Juan) were deemed too variable in the meanings they evoked and therefore likely to cause measurement error [8] (p. 14–17). He, therefore, introduced nonsense syllables, which had more uniform characteristics than existing words or other verbal material.
    vi_tri: Introduction (Murre & Dros)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Ebbinghaus/memory3.htm" ]
  - id: n10
    cau: Trong phần lớn các lần thử, ông học 8 danh sách, mỗi danh sách 13 âm tiết, đến khi đọc thuộc lòng không sai hai lần liên tiếp.
    loai: phat-hien
    nguon:
      - ebbinghaus1885
    trich: Each double test consisted in learning eight series of 13 syllables each (with the exception of 38 double tests taken from 11-12 A.M. which contained only six series each) ... The learning was continued until two errorless recitations of the series in question were possible.
    vi_tri: Chương 7, §29
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mỗi lần thử, ông học 8 danh sách". Chữ mới thêm "Trong phần lớn các lần": 38 trong 163 lần thử chỉ có 6 dãy. (G1 ghi KHỚP nhưng có chú thích ngoại lệ này.) Review (Claude Sonnet 5.5, 09/11/2026): dung. Chữ cuối trên trang khớp trích và nguồn đã ghi (đối chiếu lại).'
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Ebbinghaus/memory4.htm", "https://psychclassics.yorku.ca/Ebbinghaus/memory3.htm" ]
    luot_2_ghi_chu: Giai đoạn 1879-80; 38 trong 163 phép thử kép chỉ có 6 danh sách (chương 7), nên 'phần lớn' đúng.
    review: dung
  - id: n11
    cau: Sau một khoảng thời gian, ông học lại các danh sách đó và đo thời gian.
    loai: phat-hien
    nguon:
