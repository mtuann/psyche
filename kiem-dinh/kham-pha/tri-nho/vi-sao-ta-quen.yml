    trich: Savings is defined as the relative amount of time saved on the second learning trial as a result of having had the first.
    vi_tri: 'Murre & Dros, Introduction; Ebbinghaus chương 7: "relearning them after a definite time"'
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://psychclassics.yorku.ca/Ebbinghaus/memory7.htm" ]
  - id: n12
    cau: Nếu lần đầu mất 1.000 giây mà lần sau chỉ mất 600 giây, ông đã tiết kiệm được 40%; tiết kiệm càng nhiều nghĩa là dấu vết trí nhớ còn lại càng nhiều, kể cả khi ông không thể tự nhớ ra một âm tiết nào.
    loai: dinh-nghia
    nguon:
      - murre2015
    trich: certain inaccessible representations, seemingly forgotten, can still be relearned faster compared with others
    vi_tri: Concluding Remark (Murre & Dros)
    ket_qua: dung
    ghi_chu: Số 1.000 giây và 600 giây là ví dụ giả định (gia-dinh); phép tính (1000−600)/1000 = 40% đúng theo định nghĩa. Murre & Dros nói thêm "the subjects may not be consciously aware they still possess traces of the memory representations, which cannot be recalled or recognized but that do show savings".
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1371/journal.pone.0120644" ]
    luot_2_ghi_chu: Ví dụ số học 1.000 s và 600 s cho 40% đúng theo định nghĩa.
