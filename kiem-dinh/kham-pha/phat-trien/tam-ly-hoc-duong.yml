  - id: n11
    cau: 'Modecki và cộng sự (2014): phân tích tổng hợp 80 nghiên cứu; bắt nạt truyền thống phổ biến gấp đôi bắt nạt trên mạng; hai dạng tương quan cao.'
    loai: so-lieu
    nguon:
      - modecki2014
    trich: In our meta-analytic review, traditional bullying was twice as common as cyber bullying. Cyber and traditional bullying were also highly correlated
    vi_tri: Modecki (2014), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chỉ đọc tóm tắt. Chữ cũ: "…khoảng 35% dính líu đến bắt nạt truyền thống… khoảng 15% dính líu đến bắt nạt trên mạng… hơn 300.000 thanh thiếu niên… em nào bị bắt nạt trên mạng thì nhiều khả năng cũng bị bắt nạt ngoài đời, và ngược lại". Chữ mới: "…bắt nạt truyền thống phổ biến gấp đôi bắt nạt trên mạng và hai dạng này tương quan cao". Lý do: 35%, 15%, 300.000 và "với vai trò nạn nhân hoặc kẻ bắt nạt" không có trong tóm tắt, không mở được toàn văn (các nguồn thứ cấp cũng mâu thuẫn về việc 35% là nạn nhân hay tổng). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Tóm tắt Modecki 2014 (Europe PMC, đọc lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/25168105" ]
