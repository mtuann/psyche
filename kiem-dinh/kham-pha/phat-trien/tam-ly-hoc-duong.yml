nhan_dinh:
  - id: n1
    cau: Ba tiêu chí của định nghĩa bắt nạt học đường (theo Olweus và CDC); chương trình can thiệp nào hiệu quả theo các phân tích tổng hợp; bắt nạt trên mạng và trực tiếp liên quan thế nào; áp lực thi cử qua PISA 2015 và một nghiên cứu dọc ở Huế (mô tả của trang).
    loai: phat-hien
    nguon:
      - holt2015
      - tran2024
      - oecd2017
    trich: Of the 3 core features of bullying set forth in the CDC uniform definition of bullying, most studies (n = 34) specified that aggressive acts were measured and tapped into the repeated nature of bullying (n = 31); approximately a quarter (n = 12) attempted to assess a power imbalance or differential.
    vi_tri: Holt (2015); Trần (2024); OECD (2017)
    ket_qua: da-sua
    ghi_chu: 'Mô tả khớp nội dung trang sau khi sửa. Chữ cũ: "…bắt nạt trên mạng khác gì bắt nạt trực tiếp, và vì sao học sinh châu Á — trong đó có Việt Nam — lo âu về bài vở đến vậy." Chữ mới: "…bắt nạt trên mạng và trực tiếp liên quan thế nào, và áp lực thi cử qua số liệu PISA 2015 và một nghiên cứu dọc ở Huế." Lý do: Việt Nam không có số liệu PISA 2015 cho chỉ số lo âu (OECD 2017), nên không thể nói học sinh Việt lo âu "đến vậy" theo PISA; "định nghĩa của Olweus" đổi thành "theo Olweus và CDC". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cdc.gov/youth-violence/about/about-bullying.html", "https://link.springer.com/article/10.1007/s11292-010-9109-1", "https://europepmc.org/article/MED/33715780", "https://europepmc.org/article/MED/25168105", "https://web.archive.org/web/20240117003558if_/https://read.oecd.org/10.1787/9789264273856-en?format=pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC11442093/" ]
    luot_2_ghi_chu: Các thành phần đều có nguồn đã mở.
    review: dung
  - id: n2
    cau: Chỉ tình huống (c) hội đủ ba dấu hiệu của định nghĩa bắt nạt (ba tình huống là ví dụ giả định); (a) là xung đột ngang hàng, (b) là sự cố đơn lẻ.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Tình huống Minh và (a), (b), (c): gia-dinh. Lời giải thích không dựa vào vị trí lựa chọn. Chữ cũ: "…ba dấu hiệu mà nhà nghiên cứu Dan Olweus dùng để định nghĩa bắt nạt". Chữ mới: "…ba dấu hiệu trong định nghĩa bắt nạt theo Olweus và theo CDC". Lý do: Nguồn đã mở nêu ba nét cốt lõi của định nghĩa CDC; định nghĩa Olweus theo sách không mở được. Review (Claude Opus 5.5, 10/11/2026): Đổi loại dinh-nghia thành ve-site: ba tình huống là ví dụ giả định của trang (lượt 2 ghi "không qua lượt 2"); lời giải áp dụng định nghĩa ở thân bài (n4, n5), không có khẳng định mới. Đã kiểm trên trang: không trái nhận định nào.'
    review: dung
  - id: n3
    cau: 'Bắt nạt không nằm ở mức độ nặng nhẹ của một hành động đơn lẻ mà ở mẫu hình của nó: lặp đi lặp lại, có chênh lệch quyền lực.'
    loai: dinh-nghia
    nguon:
      - holt2015
    trich: Of the 3 core features of bullying set forth in the CDC uniform definition of bullying, most studies (n = 34) specified that aggressive acts were measured and tapped into the repeated nature of bullying (n = 31); approximately a quarter (n = 12) attempted to assess a power imbalance or differential.
    vi_tri: Holt (2015), mục Results
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.cdc.gov/youth-violence/about/about-bullying.html", "https://europepmc.org/article/MED/23297789" ]
  - id: n4
    cau: Theo định nghĩa trong sách của Olweus (1993), một học sinh bị bắt nạt khi em bị phơi nhiễm, lặp đi lặp lại và kéo dài, trước những hành động tiêu cực của một hoặc nhiều học sinh khác, trong quan hệ chênh lệch sức mạnh.
    loai: dinh-nghia
    nguon:
      - holt2015
      - olweus2013
    trich: Of the 3 core features of bullying set forth in the CDC uniform definition of bullying … aggressive acts … repeated nature … power imbalance (Holt 2015)
    vi_tri: Holt (2015); sách Olweus (1993) không mở được
    ket_qua: da-lam-mem
    ghi_chu: 'Chỗ chưa mở: lời nguyên văn của Olweus (1993, sách) chỉ kiểm qua mô tả thứ cấp (kết quả tìm kiếm, không phải trang đã mở); Holt (2015) xác nhận ba nét cốt lõi của định nghĩa CDC. Lượt 2 nên tìm toàn văn. Chữ cũ: "…do nhà tâm lý học người Na Uy Dan Olweus — người tiên phong nghiên cứu lĩnh vực này từ những năm 1970 — đề xuất: một học sinh bị bắt nạt khi em bị phơi nhiễm… (Olweus, 1993)". Chữ mới: "…bắt nguồn từ công trình của nhà tâm lý học Dan Olweus. Theo định nghĩa trong sách của ông (Olweus, 1993; chúng tôi không mở được sách gốc)… Định nghĩa thống nhất của CDC cũng gồm ba nét cốt lõi (Holt và cộng sự, 2015)". Lý do: Bỏ quốc tịch và "từ những năm 1970" (không kiểm được); nêu rõ chưa mở sách. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Chỉ dẫn qua Holt 2015 và nói rõ không mở được sách.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC9658371/" ]
    luot_2_ghi_chu: Sách 1993 không mở được; dùng bài Olweus 1994 (J Child Psychol Psychiatry) qua trích dẫn trong PMC9658371. Cùng định nghĩa.
    review: dung
  - id: n5
    cau: Ba tiêu chí (cố ý gây hại, lặp lại theo thời gian, chênh lệch quyền lực) là bộ lọc phân biệt bắt nạt với một vụ xung đột tay đôi hay một sự cố đơn lẻ.
    loai: dinh-nghia
    nguon:
      - holt2015
    trich: Of the 3 core features of bullying set forth in the CDC uniform definition of bullying, most studies (n = 34) specified that aggressive acts were measured and tapped into the repeated nature of bullying (n = 31); approximately a quarter (n = 12) attempted to assess a power imbalance or differential.
    vi_tri: Holt (2015), mục Results
    ket_qua: da-sua
    ghi_chu: 'Cụm "cố ý gây hại" là cách diễn đạt của Olweus; CDC dùng "aggressive acts". Chữ cũ: "…phân biệt bắt nạt với những thứ trông giống nó: đùa giỡn thô bạo giữa bạn bè ngang sức (rough-and-tumble play), hay một vụ xung đột tay đôi." Chữ mới: "…phân biệt bắt nạt với những thứ trông giống nó: một vụ xung đột tay đôi hay một sự cố đơn lẻ." Lý do: Bỏ "rough-and-tumble play" (không có nguồn đã mở). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cdc.gov/youth-violence/about/about-bullying.html", "https://europepmc.org/article/MED/23297789" ]
    review: dung
  - id: n6
    cau: Trong 47 nghiên cứu mà Holt và cộng sự tổng hợp, chỉ khoảng một phần tư (12) cố đánh giá chênh lệch quyền lực, nên số liệu giữa các nghiên cứu khó so sánh.
    loai: so-lieu
    nguon:
      - holt2015
    trich: approximately a quarter (n = 12) attempted to assess a power imbalance or differential.
    vi_tri: Holt (2015), mục Results (đoạn về đo lường bắt nạt)
    ket_qua: dung
    ghi_chu: '"Khó so sánh" là suy ra của trang từ chuyện các nghiên cứu đo khác nhau; Holt cũng nêu vấn đề tương tự ở phần Discussion.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4702491/" ]
  - id: n7
    cau: Bắt nạt có thể diễn ra trực tiếp (thể chất, lời nói, quan hệ như tẩy chay) hay trên mạng; Modecki (2014) đo cả hai dạng và thấy chúng tương quan cao.
    loai: dinh-nghia
    nguon:
      - holt2015
      - modecki2014
    trich: types of bullying assessed (eg, physical, relational) (Holt 2015); Cyber and traditional bullying were also highly correlated (Modecki 2014)
    vi_tri: Holt (2015), Methods; Modecki (2014), tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Bắt nạt có nhiều hình thức: thể chất (đánh, xô đẩy, phá đồ), lời nói (chế nhạo, đe dọa, đặt biệt danh), quan hệ (tẩy chay, tung tin đồn, cô lập khỏi nhóm), và trên mạng (cyberbullying — quấy rối qua điện thoại, mạng xã hội)." Chữ mới: "Bắt nạt có thể diễn ra trực tiếp (thể chất, lời nói, quan hệ như tẩy chay) hay trên mạng… Modecki… đo cả hai dạng và thấy chúng tương quan cao với nhau." Lý do: Danh sách ví dụ chi tiết không có trong nguồn đã mở; giữ phân loại chung. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/25168105", "https://europepmc.org/article/MED/23297789" ]
    luot_2_ghi_chu: "Bắt nạt trực tiếp (thể chất, lời nói, quan hệ) và mạng: Modecki đo cả hai dạng; Kowalski 2014 cho thấy tương tự."
    review: dung
  - id: n8
    cau: '(Đã bỏ) Bắt nạt trên mạng có vài nét riêng: kẻ bắt nạt có thể ẩn danh, nạn nhân bị tấn công cả khi về nhà, nội dung xấu hổ lan đến hàng trăm người trong vài giờ.'
    loai: phat-hien
    ket_qua: da-bo
    ghi_chu: 'Không có nguồn đã mở; Olweus (2013) còn nói nhiều tuyên bố về bắt nạt mạng trên truyền thông bị phóng đại. Chữ cũ: "Bắt nạt trên mạng có vài nét riêng: kẻ bắt nạt có thể ẩn danh, nạn nhân bị tấn công cả khi đã về nhà, và một nội dung xấu hổ có thể lan đến hàng trăm người chỉ trong vài giờ." Chữ mới: (bỏ) Lý do: Không kiểm được. Review (Claude Opus 5.5, 10/11/2026): Đã kiểm: trang không còn câu ẩn danh, lan "hàng trăm người".'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu đã bỏ khỏi trang; không qua lượt 2.
    review: dung
  - id: n9
    cau: Báo cáo UNESCO (2019) tổng hợp dữ liệu từ 144 quốc gia và vùng lãnh thổ; gần một phần ba học sinh từng bị bắt nạt ít nhất một lần ở trường trong tháng trước đó; bắt nạt qua mạng và điện thoại đang tăng.
    loai: so-lieu
    nguon:
      - unnews2019
    trich: '"nearly one-in-three boys and girls have been bullied at least once at school over the last month"; "covering 144 countries and territories in all regions"; "online and mobile phone bullying is on the rise"'
    vi_tri: Bản tin LHQ 01/2019 về báo cáo UNESCO
    ket_qua: da-sua
    ghi_chu: 'Bản tin không nêu "32%" hay tỉ lệ bắt nạt mạng; không mở được bản gốc UNESCO. Chữ cũ: "…gần một phần ba học sinh trên thế giới từng bị bắt nạt ít nhất một lần trong tháng trước đó, và khoảng một phần mười là nạn nhân của bắt nạt trên mạng (UNESCO, 2019)." Chữ mới: "…gần một phần ba học sinh từng bị bắt nạt ít nhất một lần ở trường trong tháng trước đó, và bắt nạt qua mạng và điện thoại đang tăng (theo bản tin của Liên Hợp Quốc về báo cáo)." Lý do: "Một phần mười" cho bắt nạt mạng không kiểm được; nguồn nói "đang tăng". Thêm "ở trường". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Đọc lại bản tin LHQ (news.un.org, 10/11/2026): "nearly one-in-three boys and girls have been bullied at least once at school over the last month"; "covering 144 countries and territories"; "online and mobile phone bullying is on the rise". Lượt 2 không chắc vì chỉ thử mở báo cáo gốc (unesdoc chặn, review cũng nhận 403); trang đã ghi rõ "theo bản tin của Liên Hợp Quốc về báo cáo", đúng mức "theo X kể lại".'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.unesco.org/en/articles/behind-numbers-ending-school-violence-and-bullying" ]
    luot_2_ghi_chu: "Chỉ xác nhận được '144 quốc gia và vùng lãnh thổ' (trang nhà UNESCO qua Wayback). Toàn văn báo cáo bị Cloudflare chặn: không xác nhận được 'gần một phần ba bị bắt nạt trong tháng trước' và 'bắt nạt qua mạng và điện thoại đang tăng'."
    review: dung
  - id: n10
    cau: Theo UNESCO, học sinh thường xuyên bị bắt nạt có nguy cơ cảm thấy bị xa lánh cao gần gấp ba lần và vắng mặt ở trường cao hơn gấp đôi so với các bạn khác.
    loai: so-lieu
    nguon:
