  - id: n20
    cau: Olweus kể lại cách mối quan tâm và nghiên cứu của ông về bắt nạt bắt đầu, và cho rằng bị bắt nạt không chỉ là chuyện vô hại, thoáng qua (Olweus, 2013).
    loai: lich-su
    nguon:
      - olweus2013
    trich: After sketching how my own interest and research into bullying problems began … being involved in such problems is not just a harmless and passing school problem
    vi_tri: Olweus (2013), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chỉ đọc tóm tắt. Chữ cũ: "Dan Olweus bắt đầu nghiên cứu tình trạng học sinh ức hiếp nhau ở Thụy Điển/Na Uy từ đầu thập niên 1970… Cuốn sách đầu tiên của ông, Aggression in the Schools (1978), là công trình khoa học có hệ thống đầu tiên về chủ đề này; đến Bullying at School (1993), ông hệ thống hóa định nghĩa ba tiêu chí…" Chữ mới: "Dan Olweus là nhà nghiên cứu đã gắn tên mình với việc nghiên cứu bắt nạt học đường và với [OBPP]; năm 2013 ông kể lại cách mối quan tâm và nghiên cứu của mình về bắt nạt bắt đầu, và cho rằng việc bị bắt nạt không chỉ là chuyện "vô hại, thoáng qua"." Lý do: Không kiểm được thời điểm, nơi, lý do ban đầu, "đầu tiên"; chỉ giữ điều tóm tắt 2013 nói. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Tóm tắt Olweus 2013 (Europe PMC, đọc lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/23297789" ]
    review: dung
  - id: n21
    cau: (Đã bỏ) Olweus bắt đầu nghiên cứu từ đầu thập niên 1970 sau một số vụ học sinh tự tử; sách 1978 là công trình khoa học có hệ thống đầu tiên về chủ đề; OBPP là chương trình can thiệp toàn trường đầu tiên trên thế giới.
    loai: lich-su
    ket_qua: da-bo
    ghi_chu: 'Không có nguồn đã mở nói ba điều này (sách không mở được). Chữ cũ: "…từ đầu thập niên 1970, sau một số vụ học sinh tự tử được cho là liên quan đến việc bị bắt nạt… là công trình khoa học có hệ thống đầu tiên… chương trình can thiệp toàn trường đầu tiên trên thế giới." Chữ mới: (bỏ) Lý do: Không kiểm được; liên quan đến chủ đề tự tử nên càng không để câu chưa kiểm. Review (Claude Opus 5.5, 10/11/2026): Đã kiểm: trang không còn "1970", "đầu tiên", "tự tử" gắn với Olweus.'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu đã bỏ khỏi trang; không qua lượt 2.
    review: dung
  - id: n22
    cau: OBPP là chương trình toàn trường, thiết kế để giảm bắt nạt và cải thiện quan hệ bạn bè ở học sinh tiểu học, THCS.
    loai: dinh-nghia
    nguon:
      - olweus-limber2010
    trich: The Olweus Bullying Prevention Program (OBPP) is a comprehensive, school-wide program that was designed to reduce bullying and achieve better peer relations among students in elementary, middle, and junior high school grades.
    vi_tri: Olweus & Limber (2010), tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/20397997" ]
  - id: n23
    cau: 'OBPP hoạt động ở ba cấp: toàn trường (khảo sát ẩn danh, ban chống bắt nạt, tập huấn nhân viên, tăng giám sát ở điểm nóng), lớp học (họp lớp định kỳ, nội quy rõ ràng), cá nhân (làm việc với em bắt nạt, nạn nhân và phụ huynh).'
    loai: dinh-nghia
    nguon:
      - jkacap2026
    trich: 'It operates across three levels: 1) schoolwide, involving anonymous surveys, anti-bullying committees, staff training, and increased supervision in identified hotspots; 2) classroom-level, with regular class meetings and the establishment of clear behavioral expectations; and 3) individual-level, targeting bullies and victims through counseling and parental involvement.'
    vi_tri: Harsono & Febriyana (2026), mục School-level bullying interventions
    ket_qua: da-sua
    ghi_chu: 'Nguồn là tổng quan thứ cấp 2026, không phải sách của Olweus. Chữ cũ: "toàn trường (thành lập ban điều phối, khảo sát ẩn danh học sinh, xây dựng nội quy chung chống bắt nạt, tăng cường giám sát ở "điểm nóng"…, họp phụ huynh), lớp học (đặt nội quy lớp, tổ chức thảo luận định kỳ), và cá nhân (can thiệp với từng em bắt nạt, nạn nhân và phụ huynh các em)". Chữ mới: "toàn trường (khảo sát ẩn danh, ban chống bắt nạt, tập huấn nhân viên, tăng giám sát ở các "điểm nóng"), lớp học (họp lớp định kỳ, nội quy rõ ràng) và cá nhân…"; thêm "theo một bài tổng quan năm 2026". Lý do: Khớp chữ của tổng quan; bỏ "họp phụ huynh" ở cấp toàn trường và "nội quy chung" (nguồn xếp phụ huynh ở cấp cá nhân). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Đọc lại tổng quan Harsono & Febriyana 2026 (PMC12782987): câu trích nguyên văn; trang ghi "theo một bài tổng quan năm 2026". Chưa mở được mô tả chính thức của OBPP; đủ cho mức "theo X kể lại".'
    luot_2: khong-chac
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC8356322/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC8558185/" ]
    luot_2_ghi_chu: Khớp một phần; không mở được mô tả chính thức của OBPP để xác nhận 'khảo sát ẩn danh, ban chống bắt nạt, tăng giám sát ở điểm nóng, làm việc với em bắt nạt, nạn nhân và phụ huynh'.
    review: dung
  - id: n24
    cau: '(Đã bỏ) OBPP dựa trên bốn nguyên tắc: người lớn ấm áp, quan tâm và tham gia; đặt giới hạn vững chắc; kỷ luật không thù địch nhất quán; người lớn là gương mẫu có thẩm quyền; "không dựa trên trừng phạt nặng mà trên sự kết hợp ấm áp và giới hạn".'
    loai: dinh-nghia
    ket_qua: da-bo
    ghi_chu: 'Không mở được sách Olweus (1993); tổng quan 2026 và Olweus & Limber (2010) tóm tắt không nêu bốn nguyên tắc. Chữ cũ: "Nền tảng của chương trình là bốn nguyên tắc: môi trường có sự ấm áp, quan tâm và tham gia của người lớn; đặt giới hạn vững chắc…" và gạch đầu dòng "Mô hình của Olweus: ấm áp + giới hạn vững chắc". Chữ mới: (bỏ cả hai chỗ; thay bằng bullet "Chương trình toàn trường" theo Gaffney 2021) Lý do: Không kiểm được. Review (Claude Opus 5.5, 10/11/2026): Đã kiểm: trang không còn "bốn nguyên tắc", "ấm áp + giới hạn".'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu đã bỏ khỏi trang; không qua lượt 2.
    review: dung
  - id: n25
    cau: Các nghiên cứu ở Na Uy cho bằng chứng thuyết phục về hiệu quả của OBPP; các đánh giá ở Mỹ không đồng nhất nhưng cho thấy tác động tích cực lên việc học sinh tự báo cáo dính líu vào bắt nạt và hành vi chống đối xã hội.
    loai: phat-hien
    nguon:
      - olweus-limber2010
    trich: Several large-scale studies from Norway are reviewed, which provide compelling evidence of the program's effectiveness in Norwegian schools. Studies that have evaluated the OBPP in diverse settings in the United States have not been uniformly consistent, but they have shown that the OBPP has had a positive impact on students' self-reported involvement in bullying and antisocial behavior.
    vi_tri: Olweus & Limber (2010), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đánh giá triển khai OBPP ở Mỹ cho thấy chương trình làm giảm đáng kể tỉ lệ bắt nạt và nạn nhân khi được thực hiện đúng (Olweus và Limber, 2010)." Chữ mới: "Olweus và Limber (2010) thấy các nghiên cứu ở Na Uy cho bằng chứng thuyết phục về hiệu quả; các đánh giá ở Mỹ không đồng nhất, nhưng cho thấy chương trình có tác động tích cực lên việc học sinh tự báo cáo dính líu vào bắt nạt và hành vi chống đối xã hội." Lý do: Tóm tắt nói "không đồng nhất", không nói "giảm đáng kể" hay "khi được thực hiện đúng". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Tóm tắt Olweus & Limber 2010 (đọc lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/20397997" ]
    review: dung
  - id: n26
    cau: Ttofi và Farrington rà soát tài liệu (kể cả báo cáo chưa công bố, ngôn ngữ ngoài tiếng Anh) và chọn 89 báo cáo mô tả 53 chương trình, trong đó 44 chương trình có đủ dữ liệu tính cỡ hiệu ứng.
    loai: so-lieu
    nguon:
      - ttofi2011
    trich: 622 reports concerned with bullying prevention were found, and 89 of these reports (describing 53 different program evaluations) were included; 44 provided data permitting an effect size.
    vi_tri: Ttofi & Farrington (2011), tóm tắt (bản ghi NCJRS)
    ket_qua: da-sua
    ghi_chu: 'Trich theo kết quả công cụ đọc web của bản ghi OJP (tóm tắt của bài). Chữ cũ: "…rà soát toàn bộ tài liệu đến giữa năm 2009 (35 tạp chí đọc tay toàn bộ, 18 cơ sở dữ liệu điện tử…)… phân tích tổng hợp lớn nhất về chủ đề này tính đến thời điểm đó." Chữ mới: "…rà soát tài liệu nhiều nguồn, kể cả báo cáo chưa công bố và ngôn ngữ ngoài tiếng Anh…" Lý do: Số tạp chí, cơ sở dữ liệu, mốc 2009 và "lớn nhất" không có trong phần đã đọc. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Đọc lại bản ghi NCJRS (ojp.gov, tóm tắt đã xuất bản của Ttofi & Farrington 2011, 10/11/2026): "89 of these reports (describing 53 different program evaluations) … 44 provided data".'
    luot_2: dung
    luot_2_nguon: [ "https://link.springer.com/article/10.1007/s11292-010-9109-1" ]
    review: dung
  - id: n27
    cau: 'Trung bình các chương trình chống bắt nạt có hiệu quả thật: bắt nạt giảm khoảng 20–23% và nạn nhân giảm khoảng 17–20% (Ttofi và Farrington, 2011).'
    loai: so-lieu
    nguon:
      - ttofi2011
    trich: on average, bullying decreased by 20-23 percent and victimization decreased by 17-20 percent.
    vi_tri: Ttofi & Farrington (2011), tóm tắt (bản ghi NCJRS)
    ket_qua: dung
    ghi_chu: Một bản tóm tắt khác của bài nêu trung bình ~20% cho bắt nạt; giữ khoảng 20–23% theo bản đã mở.
    luot_2: dung
    luot_2_nguon: [ "https://link.springer.com/article/10.1007/s11292-010-9109-1" ]
  - id: n28
    cau: Chương trình hiệu quả hơn khi triển khai chuyên sâu và khi có họp phụ huynh, phương pháp kỷ luật vững chắc, tăng cường giám sát ở sân chơi.
    loai: phat-hien
    nguon:
      - ttofi2011
    trich: More intensive programs were more effective, as were those including parent meetings, firm disciplinary methods, and improved playground supervision.
    vi_tri: Ttofi & Farrington (2011), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…được triển khai chuyên sâu, dài hơi." Chữ mới: "…triển khai chuyên sâu." Lý do: "Dài hơi" không có trong tóm tắt. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Đọc lại bản ghi NCJRS (ojp.gov, tóm tắt đã xuất bản của Ttofi & Farrington 2011, 10/11/2026): câu trích nguyên văn.'
    luot_2: dung
    luot_2_nguon: [ "https://link.springer.com/article/10.1007/s11292-010-9109-1" ]
    review: dung
  - id: n29
    cau: Chương trình có thành phần "làm việc với bạn cùng lứa" liên quan đến tăng tỉ lệ nạn nhân (Ttofi và Farrington, 2011); phát hiện này cần đọc thận trọng vì Gaffney và cộng sự (2021) thấy sự tham gia không chính thức của bạn bè gắn với hiệu quả lớn hơn.
    loai: phat-hien
    nguon:
      - ttofi2011
      - gaffney2021
    trich: Work with peers was associated with an increase in victimization. (Ttofi 2011); informal peer involvement and information for parents were associated with larger effect sizes for school-bullying victimization outcomes (Gaffney 2021)
    vi_tri: Ttofi & Farrington (2011), tóm tắt; Gaffney (2021), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó: tóm tắt không nói "work with peers" gồm hoạt động nào; hai phân tích mã hóa thành phần khác nhau, nên không coi là mâu thuẫn trực tiếp. Chữ cũ: "…các chương trình cho học sinh "làm việc với nhau theo nhóm bạn" (work with peers — ví dụ bắt nạn nhân và kẻ bắt nạt ngồi lại "hòa giải" với nhau) lại liên quan đến việc tăng tỉ lệ nạn nhân. Bài học: can thiệp sai cách có thể hại nhiều hơn lợi." Chữ mới: "…các chương trình có thành phần "làm việc với bạn cùng lứa" (work with peers) lại liên quan đến việc tăng tỉ lệ nạn nhân… cần đọc thận trọng: tóm tắt không nêu rõ các hoạt động cụ thể" + kết quả của Gaffney 2021. Lý do: Ví dụ "bắt hòa giải" và "bài học" không có trong tóm tắt; thêm kết quả không đồng nhất của phân tích sau. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Đọc lại bản ghi NCJRS (ojp.gov, tóm tắt đã xuất bản của Ttofi & Farrington 2011, 10/11/2026): "Work with peers was associated with an increase in victimization"; Gaffney 2021 (Europe PMC) khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://link.springer.com/article/10.1007/s11292-010-9109-1", "https://europepmc.org/article/MED/33715780" ]
    review: dung
  - id: n30
    cau: 'Phân tích cập nhật (Gaffney, Ttofi và Farrington, 2019): 100 đánh giá; các chương trình giảm hành vi bắt nạt khoảng 19–20% và nạn nhân khoảng 15–16%; khác biệt lớn giữa các nghiên cứu.'
    loai: so-lieu
    nguon:
      - gaffney2019
    trich: a total of 100 evaluations (with 103 independent effect sizes) were eligible … reduce school-bullying perpetration by approximately 19–20% ad school-bullying victimization by approximately 15–16%. Effect sizes vary greatly across studies
    vi_tri: Gaffney (2019), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Trich từ bản tóm tắt qua API Semantic Scholar (có lỗi gõ "ad" trong nguồn). Chữ cũ: "…với gần gấp đôi số đánh giá (100 chương trình)…". Chữ mới: "Một phân tích cập nhật của cùng nhóm, với 100 đánh giá, thấy… khác biệt lớn giữa các nghiên cứu". Lý do: Nguồn nói 100 "evaluations", không phải 100 chương trình; số chương trình của bài 2011 là 53 (44 có số liệu). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Tóm tắt Gaffney 2019 (Semantic Scholar, đọc lại). Ghi thêm: tóm tắt nói "no publication bias".'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC8356322/", "https://europepmc.org/article/MED/33715780" ]
    review: dung
  - id: n31
    cau: Gaffney, Ttofi và Farrington (2021) thấy cách tiếp cận toàn trường, chính sách chống bắt nạt, nội quy lớp học, thông tin cho phụ huynh, sự tham gia không chính thức của bạn bè và làm việc với nạn nhân gắn với hiệu quả lớn hơn; số lượng thành phần không liên quan đến hiệu quả.
    loai: phat-hien
    nguon:
      - gaffney2021
    trich: the presence of a number of intervention components (e.g., whole-school approach, anti-bullying policies, classroom rules, information for parents, informal peer involvement, and work with victims) were significantly associated with larger effect sizes for school-bullying perpetration outcomes. … Meta-regression analyses showed no significant relationship between effectiveness and the number of intervention components
    vi_tri: Gaffney (2021), tóm tắt
    ket_qua: dung
    ghi_chu: Câu mới thêm (Gaffney 2021 là nguồn bắt buộc của lời giao).
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/33715780" ]
  - id: n32
    cau: 'Kowalski và cộng sự (2014): liên hệ mạnh nhất với việc thực hiện bắt nạt mạng là niềm tin chuẩn mực về gây hấn và sự tách rời đạo đức; liên hệ mạnh nhất với việc bị bắt nạt mạng là căng thẳng và ý nghĩ tự tử; các liên hệ không cho biết chiều nhân quả.'
    loai: phat-hien
    nguon:
      - kowalski2014
    trich: among the strongest associations with cyberbullying perpetration were normative beliefs about aggression and moral disengagement, and the strongest associations with cyberbullying victimization were stress and suicidal ideation. … issues dealing with causality or directionality of these associations
    vi_tri: Kowalski (2014), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…dự báo mạnh nhất của việc bị bắt nạt trên mạng chính là đang bị bắt nạt ngoài đời — và trong các yếu tố gắn với hành vi bắt nạt mạng, mạnh nhất là những niềm tin "gây hấn là bình thường" cùng sự tách rời đạo đức". Chữ mới: "…các liên hệ mạnh nhất với việc bị bắt nạt mạng là căng thẳng và ý nghĩ tự tử…" (vế bắt nạt mạng của người gây hấn giữ nguyên). Lý do: Tóm tắt nói liên hệ mạnh nhất của victimization là stress và ý nghĩ tự tử, không phải "đang bị bắt nạt ngoài đời"; không dùng từ "dự báo" (cắt ngang). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/24512111" ]
    review: dung
  - id: n33
    cau: 'Holt và cộng sự (2015): phân tích tổng hợp 47 nghiên cứu cắt ngang (38,3% từ Mỹ, 61,7% ngoài Mỹ), 280 cỡ hiệu ứng, về dính líu vào bắt nạt (nạn nhân, kẻ bắt nạt, vừa bắt nạt vừa bị bắt nạt) và ý nghĩ, hành vi tự tử.'
    loai: so-lieu
    nguon:
      - holt2015
    trich: We searched multiple online databases … to identify cross-sectional studies published through July 2013. … 47 studies (38.3% from the United States, 61.7% in non-US samples) met inclusion criteria. … A total of 280 effect sizes were extracted
    vi_tri: Holt (2015), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…47 nghiên cứu (61,7% mẫu ngoài nước Mỹ)…" (mô tả mẫu). Chữ mới: "…47 nghiên cứu cắt ngang (38,3% từ Mỹ, 61,7% ngoài Mỹ)…". Lý do: Thêm "cắt ngang" theo tóm tắt (cần cho hạn chế nhân quả). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/25560447", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4702491/" ]
    review: dung
  - id: n34
    cau: Mọi vai trò dính líu vào bắt nạt đều liên quan đến nguy cơ cao hơn của ý nghĩ và hành vi tự tử, tỉ số chênh từ 2,12 đến 4,02.
    loai: so-lieu
    nguon:
      - holt2015
    trich: each of the predictors were associated with risk for suicidal ideation and behavior (range, 2.12 [95% confidence interval (CI), 1.67-2.69] to 4.02 [95% CI, 2.39-6.76])
    vi_tri: Holt (2015), tóm tắt, Results
    ket_qua: da-sua
    ghi_chu: 'Có dị biệt đáng kể giữa các nghiên cứu (tóm tắt). Chữ cũ: "…trong đó nhóm vừa bắt nạt vừa bị bắt nạt (bully-victim) có nguy cơ cao nhất." Chữ mới: (bỏ vế "bully-victim có nguy cơ cao nhất") Lý do: Tóm tắt không nói nhóm nào cao nhất. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/25560447" ]
    review: dung
  - id: n35
    cau: 'van Geel và cộng sự (2014): bị bạn bè ức hiếp liên quan đến ý nghĩ tự tử (OR 2,23) và hành vi tự tử (OR 2,55); bắt nạt mạng liên quan đến ý nghĩ tự tử mạnh hơn bắt nạt truyền thống.'
    loai: so-lieu
    nguon:
      - vangeel2014
    trich: Peer victimization was found to be related to both suicidal ideation (odds ratio, 2.23 [95% CI, 2.10-2.37]) and suicide attempts (2.55 [1.95 -3.34]) … Cyberbullying was more strongly related to suicidal ideation compared with traditional bullying.
    vi_tri: van Geel (2014), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…ý nghĩ tự tử cao gấp khoảng 2,2 lần và hành vi tự tử gấp khoảng 2,5 lần — và liên hệ giữa bắt nạt mạng với ý nghĩ tự tử (OR = 3,1) còn mạnh hơn có ý nghĩa thống kê so với bắt nạt truyền thống (OR = 2,2)." Chữ mới: "…OR 2,23… OR 2,55… bắt nạt mạng liên quan đến ý nghĩ tự tử mạnh hơn bắt nạt truyền thống". Lý do: OR 3,1 và 2,2 cho hai dạng không có trong tóm tắt; "cao gấp 2,2 lần" diễn giải sai OR thành nguy cơ. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/24615300" ]
    review: dung
  - id: n36
    cau: Các nghiên cứu được tổng hợp là cắt ngang nên không cho biết chiều nhân quả; phần lớn học sinh bị bắt nạt không đi đến bước đường cùng; bắt nạt không phải "chuyện trẻ con".
    loai: phat-hien
    nguon:
      - holt2015
      - ttofi-dep2011
    trich: We searched … to identify cross-sectional studies … (Holt); Although causal inferences are tentative … (Ttofi 2011)
    vi_tri: Holt (2015), tóm tắt; Ttofi (2011), tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: '"Phần lớn học sinh… không đi đến bước đường cùng" là suy ra từ cỡ hiệu ứng (OR không phải xác suất tuyệt đối), nguồn không nêu tỉ lệ trực tiếp. Chữ cũ: "Đây là mối liên hệ tương quan, không phải "bị bắt nạt thì sẽ..."." Chữ mới: "Đây là mối liên hệ… Các nghiên cứu được tổng hợp là cắt ngang nên không cho biết chiều nhân quả…" Lý do: Thêm lý do theo nguồn. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Vế "phần lớn học sinh bị bắt nạt không đi đến bước đường cùng" là suy ra từ cỡ hiệu ứng (OR 2–4 trên tỉ lệ nền); câu có mục đích đưa tin an toàn, không thêm con số.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4702491/" ]
    review: dung
  - id: n37
    cau: Nếu bị bắt nạt kéo dài và quá sức chịu đựng, hãy nói với người lớn tin cậy (cha mẹ, thầy cô) hoặc tìm người có chuyên môn, như UNICEF khuyên. Nếu nghĩ đến việc tự làm hại mình, hãy nói ngay với người có chuyên môn; xem Hỗ trợ.
    loai: loi-khuyen
    nguon:
      - unicef-cyber
    trich: If you think you’re being bullied, the first step is to seek help from someone you trust such as your parents, a close family member or another trusted adult. … search for a child helpline in your country to talk to a professional counsellor. If the bullying is happening on a social platform, consider blocking the bully and formally reporting their behaviour … It can be helpful to collect evidence – text messages and screen shots of social media posts
    vi_tri: Ttofi (2011), tóm tắt (chỉ làm cơ sở chung)
    ket_qua: da-sua
    ghi_chu: 'Lời dẫn an toàn theo yêu cầu của lời giao (chỉ nói nên tìm người có chuyên môn và dẫn Hỗ trợ), không phải nhận định khoa học; không có nguồn nghiên cứu riêng. Nội dung không có chi tiết về cách tự hại. Chữ cũ: "…hãy nói ra với một người lớn mà bạn tin tưởng — cha mẹ, thầy cô — hoặc tìm đến dịch vụ hỗ trợ tâm lý… Nếu bạn hoặc người thân đang nghĩ đến việc tự làm hại mình, hãy gọi 115." Chữ mới: "…hoặc tìm người có chuyên môn… Nếu bạn hoặc người thân đang nghĩ đến việc tự làm hại mình, hãy nói ngay với người có chuyên môn; xem [Hỗ trợ](/psyche/ho-tro/) để biết nơi liên hệ." Lý do: Theo lời giao: dẫn Hỗ trợ thay vì chỉ một số điện thoại không kiểm ở trang này. Review (Claude Opus 5.5, 10/11/2026): Lượt 2 không chắc đúng chỗ: câu không có nguồn, và vế "xin giúp đỡ là dấu hiệu của sức mạnh" không có nguồn nào. Bỏ vế ấy; lời khuyên tìm người lớn tin cậy, người có chuyên môn theo UNICEF (đọc 10/11/2026). Lời dẫn Hỗ trợ giữ, không có chi tiết về cách tự hại, không thêm số đường dây nóng; doi_chu.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Lời khuyên tìm người lớn tin cậy và 'xin giúp đỡ là dấu hiệu của sức mạnh': không có nguồn bậc 1-2 cụ thể cho câu này trong lượt 2."
    review: sai
  - id: n38
    cau: 'Liên kết [Hỗ trợ](/psyche/ho-tro/) (ở mục Holt, áp dụng #3 và #4) trỏ tới trang Hỗ trợ của site.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: src/content/docs/ho-tro/index.md và ho-tro/index trong src/data/trang.yml. Review (Claude Opus 5.5, 10/11/2026): Đã kiểm: ho-tro/index có trang và bản ghi; ba chỗ dẫn Hỗ trợ (mục Holt, áp dụng 3, 4) còn trên trang.'
    review: dung
  - id: n39
    cau: 'Trần và cộng sự (2024): nghiên cứu dọc ba năm (2018–2021) trên học sinh của 4 trường trung học ở thành phố Huế; 611 em được mời, 341 em có đủ dữ liệu ở cả hai đợt; các em học lớp 6 lúc đầu và lớp 9 lúc cuối; dùng thang ESSA.'
    loai: so-lieu
    nguon:
      - tran2024
      - sun2011
    trich: A three-year longitudinal study was conducted using a self-reported questionnaire with 611 students from four secondary schools in Hue City, Vietnam. … At the four schools, prior to conducting the baseline survey, 611 students were invited … the records of 341 students were used in the analysis.
    vi_tri: Tran (2024), Abstract và Methods (Participants)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…trên 611 học sinh của 4 trường trung học… Có 341 em hoàn thành cả hai đợt khảo sát." và "ESSA… xây dựng và kiểm định trên học sinh Trung Quốc rồi kiểm định lại trên học sinh TP. Hồ Chí Minh". Chữ mới: "611 em được mời, 341 em có đủ dữ liệu ở cả hai đợt (lúc đầu học lớp 6, cuối là lớp 9)… ESSA, xây dựng và kiểm định trên học sinh Trung Quốc; Sun và cộng sự, 2011". Lý do: 611 là số được mời (517 và 479 tham gia hai đợt; 341 phân tích); bỏ "kiểm định lại trên học sinh TP. Hồ Chí Minh" (bài Tran nêu một kiểm định ESSA ở Việt Nam không rõ địa điểm; chưa mở). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC11442093/" ]
    luot_2_ghi_chu: Chia 2018-2021 khớp.
    review: dung
  - id: n40
    cau: 'ESSA có năm khía cạnh: áp lực từ việc học, khối lượng bài vở, lo lắng về điểm số, kỳ vọng vào bản thân, cảm giác chán nản; xây dựng và kiểm định trên hơn 2.000 thanh thiếu niên Trung Quốc.'
    loai: cong-cu
    nguon:
      - sun2011
    trich: 'The final 16-item ESSA contains five latent variables: Pressure from study, Workload, Worry about grades, Self-expectation, and Despondency … more than 2,000 Chinese adolescents'
    vi_tri: Sun (2011), tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1177/0734282910394976", "https://pmc.ncbi.nlm.nih.gov/articles/PMC11442093/" ]
  - id: n41
    cau: Điểm stress học tập trung bình của 341 em tăng từ 46,4 (2018) lên 53,5 (2021).
    loai: so-lieu
    nguon:
      - tran2024
    trich: The mean ESSA score of 341 students increased from 46.4 ± 7.6 (mean ± SD) to 53.5 ± 10.8, from 2018 to 2021.
    vi_tri: Tran (2024), Abstract; Bảng điểm ESSA
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC11442093/" ]
  - id: n42
    cau: 'Các yếu tố đo ở đợt đầu gắn với stress cao hơn ở đợt sau: là nữ, điểm thấp hơn, đi học thêm, nhiều anh chị em hơn, cha có học vấn cao hơn; các yếu tố lối sống không liên quan.'
    loai: phat-hien
    nguon:
      - tran2024
    trich: the number of siblings, higher father’s educational attainment level, female gender, lower academic scores, and attending extra classes were associated with overall academic stress. In contrast, no associations were observed between the variables of lifestyle, parental concentration, and parental acceptance and overall academic stress.
    vi_tri: Tran (2024), Abstract (Results)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Các yếu tố gắn với stress cao hơn gồm: là nữ, điểm số thấp hơn, đi học thêm, đông anh chị em, và cha có trình độ học vấn cao hơn." Chữ mới: Danh sách như cũ, thêm "đo ở đợt đầu… ở đợt sau" và "các yếu tố lối sống không liên quan". Lý do: Nêu rõ thiết kế (yếu tố đầu kỳ liên quan stress cuối kỳ) và kết quả âm tính. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC11442093/" ]
    review: dung
  - id: n43
    cau: Đợt khảo sát cuối diễn ra năm 2021 giữa đại dịch COVID-19 và các em đã lên lớp cuối cấp, nên mức tăng stress không chỉ do một nguyên nhân; việc đi học thêm gắn với stress cao hơn là liên hệ quan sát.
    loai: phat-hien
    nguon:
      - tran2024
    trich: the timing of the follow-up survey, which was conducted in 2021 during the COVID-19 pandemic when restrictions on daily life were significant in Vietnam … baseline survey was conducted when the students were in the first grade of secondary school (the sixth grade). A follow-up survey was conducted three years later … the ninth grade.
    vi_tri: Tran (2024), Discussion
    ket_qua: dung
    ghi_chu: Câu mới thêm; "không chứng minh học thêm gây stress" là suy luận về thiết kế quan sát, được nguồn nói gián tiếp (tác giả viết "associated").
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC11442093/" ]
  - id: n44
    cau: Theo các tác giả, đây là nghiên cứu dọc đầu tiên về stress học tập và các yếu tố liên quan ở học sinh trung học cơ sở Việt Nam.
    loai: lich-su
    nguon:
      - tran2024
    trich: To the best of our knowledge, this was the first longitudinal study on academic stress and its associated factors among Vietnamese subjects to focus on middle school students.
    vi_tri: Tran (2024), Discussion
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đây là một trong số ít nghiên cứu dọc về stress học tập trên học sinh Việt Nam được công bố quốc tế." Chữ mới: "Theo các tác giả, đây là nghiên cứu dọc đầu tiên… ở học sinh trung học cơ sở Việt Nam." Lý do: Theo chữ của tác giả, "to the best of our knowledge". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC11442093/" ]
    luot_2_ghi_chu: Đúng là lời của tác giả.
    review: dung
  - id: n45
    cau: 'Nhãn "Khá vững": bắt nạt được định nghĩa bằng ba tiêu chí — cố ý gây hại, lặp lại theo thời gian, chênh lệch quyền lực; đây là định nghĩa quy ước và các nghiên cứu đo nó khác nhau.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - holt2015
      - olweus2013
    ly_do: "Một định nghĩa quy ước dùng chung (định nghĩa thống nhất của CDC, ba nét cốt lõi, theo Holt 2015; Olweus; Gaffney 2019 dùng làm tiêu chí chọn nghiên cứu), không phải kết luận rút từ phân tích tổng hợp; và cách đo không thống nhất (Holt 2015: chỉ 12/47 nghiên cứu cố đo chênh lệch quyền lực; Olweus 2013 bàn các vấn đề định nghĩa và đo). Không đạt Vững chắc; Khá vững như lượt 2 đề nghị."
    nguon:
      - holt2015
      - olweus2013
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Định nghĩa của Olweus đã được giới nghiên cứu dùng thống nhất suốt hơn 40 năm và được UNESCO, CDC Mỹ cùng nhiều tổ chức khác chấp nhận." Chữ mới: "Ba tiêu chí này là nền của định nghĩa theo Olweus và của định nghĩa thống nhất của CDC… Nhãn nói về định nghĩa, không về tỉ lệ: nhiều nghiên cứu không đo đủ ba tiêu chí". Lý do: "Thống nhất suốt hơn 40 năm" bị Holt (2015) làm yếu (nhiều nghiên cứu không đo đủ ba tiêu chí); "UNESCO… chấp nhận" không kiểm được. Review (Claude Opus 5.5, 10/11/2026): Lượt 2 quá mạnh đúng. Đổi khung sang Khá vững, thân khung nói rõ là định nghĩa quy ước và nêu số 12/47 của Holt; hộp tóm tắt tự dựng theo; doi_chu.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://www.cdc.gov/youth-violence/about/about-bullying.html", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4702491/", "https://europepmc.org/article/MED/23297789" ]
    luot_2_ghi_chu: "câu đúng: Nhãn 'Khá vững': ba tiêu chí là đồng thuận quy ước của CDC và Olweus, nhưng cách đo khác nhau giữa các nghiên cứu.; Ba tiêu chí là định nghĩa quy ước (CDC, Olweus), không phải kết luận được tổng hợp bằng phân tích tổng hợp; cách đo khác nhau (Holt: chỉ 12/47 nghiên cứu đo chênh lệch quyền lực). Nhãn 'Vững chắc' cao hơn thước đo mục 4."
    review: sai
  - id: n46
    cau: 'Nhãn "Vững chắc": bị bắt nạt gắn liền với trầm cảm về sau và với ý nghĩ tự tử.'
    loai: nhan
    nhan: vung-chac
    co_so:
      - ttofi-dep2011
      - holt2015
      - vangeel2014
      - unnews2019
    ly_do: 'Nhiều tổng quan hệ thống và phân tích tổng hợp cùng chiều: trầm cảm về sau OR 1,99 (1,74 sau kiểm soát) trên 28 nghiên cứu dọc, theo dõi trung bình 6,9 năm (Ttofi 2011); ý nghĩ và hành vi tự tử OR 2,12–4,02 trên 47 nghiên cứu, 61,7% ngoài Mỹ (Holt 2015); OR 2,23 và 2,55 (van Geel 2014); UNESCO: vắng mặt gấp đôi. Đạt "Vững chắc" cho liên hệ (không phải nhân quả, xem khung "đang tranh cãi"). Hạn chế: Holt chỉ gồm nghiên cứu cắt ngang.'
    nguon:
      - ttofi-dep2011
      - holt2015
      - vangeel2014
      - unnews2019
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: Tiêu đề khung: "bị bắt nạt gắn liền với lo âu, trầm cảm và kết quả học tập kém hơn" và "đã được tái hiện nhất quán qua hàng trăm nghiên cứu". Chữ mới: "bị bắt nạt gắn liền với trầm cảm về sau và với ý nghĩ tự tử" kèm OR và nguồn. Lý do: Không mở được nguồn cho "lo âu" và "kết quả học tập kém hơn", và "hàng trăm nghiên cứu" không kiểm được. Review (Claude Opus 5.5, 10/11/2026): Nhãn Vững chắc cho liên hệ (không phải nhân quả) đạt thước đo: ba phân tích tổng hợp cùng chiều (Ttofi 2011 dọc, 28 nghiên cứu, OR 1,99 và 1,74, tóm tắt OpenAlex đọc lại; Holt 2015; van Geel 2014), nhiều quần thể (Holt 61,7% ngoài Mỹ); Olweus 2013 viết "convincing evidence". UNESCO qua bản tin LHQ chỉ là bổ sung.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC5371173/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4702491/", "https://europepmc.org/article/MED/24615300" ]
    luot_2_ghi_chu: "Hướng nhất quán qua nhiều tổng hợp và nhiều quần thể (Holt 61,7% ngoài Mỹ; NAMHS Việt Nam aOR 4,71). Ý nghĩ tự tử chủ yếu từ nghiên cứu cắt ngang: 'gắn liền' đúng, không nói nhân quả. Nhãn không cao hơn thước đo."
    review: dung
  - id: n47
    cau: 'Nhãn "Khá vững": chương trình chống bắt nạt ở trường học có hiệu quả ở mức vừa phải.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - ttofi2011
      - gaffney2019
      - gaffney2021
      - kiva2011
      - olweus-limber2010
    ly_do: 'Hai phân tích tổng hợp cách nhau một thập niên cùng chiều: giảm bắt nạt ~20% và nạn nhân ~15–20% (Ttofi 2011; Gaffney 2019, 100 đánh giá); KiVa có thử nghiệm ngẫu nhiên nhóm (78 trường). Nhưng khác biệt giữa các nghiên cứu rất lớn, nghi thiên lệch trong thành phần (hai phân tích về thành phần không thống nhất), và OBPP ở Mỹ không đồng nhất; chưa có tái lập lớn đăng ký trước. Nên Khá vững.'
    nguon:
      - ttofi2011
      - gaffney2019
      - gaffney2021
      - kiva2011
      - olweus-limber2010
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hai phân tích tổng hợp cách nhau một thập niên đều kết luận các chương trình làm giảm hành vi bắt nạt khoảng 15–20%. Hiệu quả… phụ thuộc vào việc có họp phụ huynh, kỷ luật vững chắc, giám sát sân chơi và triển khai đủ chuyên sâu hay không." Chữ mới: "…khoảng 20% và nạn nhân khoảng 15–20%… thành phần nào quan trọng thì các phân tích chưa hoàn toàn thống nhất (Ttofi và Farrington, 2011; Gaffney và cộng sự, 2021), và các đánh giá OBPP ở Mỹ không đồng nhất". Lý do: Số liệu đúng hơn (bắt nạt ~20%, nạn nhân 15–20%) và nêu sự không thống nhất về thành phần. Review (Claude Opus 5.5, 10/11/2026): Nhãn Khá vững đạt thước đo (hai phân tích tổng hợp, nhiều RCT, không thấy thiên lệch xuất bản theo Gaffney 2019, nhưng khác biệt giữa các nghiên cứu rất lớn và thành phần không thống nhất). Có thể xét Vững chắc ở lần kiểm lại; giữ Khá vững cho thận trọng.'
    luot_2: dung
    luot_2_nguon: [ "https://link.springer.com/article/10.1007/s11292-010-9109-1", "https://europepmc.org/article/MED/33715780", "https://pmc.ncbi.nlm.nih.gov/articles/PMC8356322/" ]
    luot_2_ghi_chu: Nhãn 'Khá vững' không cao hơn thước đo.
    review: dung
  - id: n48
    cau: 'Nhãn "Khá vững": bắt nạt trên mạng ít phổ biến hơn bắt nạt trực tiếp, nhưng hai dạng chồng lấp lớn.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - modecki2014
    ly_do: Một phân tích tổng hợp 80 nghiên cứu (Modecki 2014) cùng chiều; chưa mở được phân tích tổng hợp thứ hai; cách đo làm tỉ lệ khác nhau nhiều. Chỉ đọc tóm tắt. Khá vững theo mục 4 (một tổng hợp, kết quả phụ thuộc cách đo).
    nguon:
      - modecki2014
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Tỉ lệ 35% so với 15% trong phân tích của Modecki… là con số trung bình gộp — tỉ lệ cụ thể dao động mạnh giữa các nghiên cứu tùy cách đo." Chữ mới: "…bắt nạt truyền thống phổ biến gấp đôi bắt nạt trên mạng… cách đo khác nhau làm tỉ lệ khác nhau." Lý do: Bỏ 35%/15% (không kiểm được). Review (Claude Opus 5.5, 10/11/2026): Nhãn Khá vững đạt thước đo (một phân tích tổng hợp 80 nghiên cứu, cách đo làm tỉ lệ khác nhau nhiều).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/25168105", "https://europepmc.org/article/MED/24512111" ]
    luot_2_ghi_chu: Nhãn 'Khá vững' không cao hơn thước đo (phân tích tổng hợp 80 nghiên cứu, cách đo khác nhau).
    review: dung
  - id: n49
    cau: 'Nhãn "Đang tranh cãi": bắt nạt "gây ra" tự tử ở mức độ nào.'
    loai: nhan
    nhan: tranh-cai
    co_so:
      - holt2015
      - vangeel2014
      - ttofi-dep2011
    ly_do: Liên hệ mạnh (OR 2–4) và nhất quán, nhưng Holt (2015) chỉ gồm nghiên cứu cắt ngang, van Geel (2014) tổng hợp cả nghiên cứu cắt ngang, và tác giả của tổng hợp về trầm cảm viết "causal inferences are tentative"; chưa có bằng chứng nhân quả đủ mạnh. Nhãn tranh cãi cho phần nhân quả; liên hệ thì Vững chắc (n46).
    nguon:
      - holt2015
      - vangeel2014
      - ttofi-dep2011
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Các phân tích tổng hợp đều là nghiên cứu cắt ngang… cũng chưa tách hết vai trò của các yếu tố trung gian như trầm cảm có sẵn. Giới nghiên cứu đồng thuận rằng bắt nạt là một yếu tố nguy cơ nghiêm trọng…" Chữ mới: "Phân tích của Holt và cộng sự (2015) chỉ gồm các nghiên cứu cắt ngang… tác giả của tổng hợp về trầm cảm cũng nói các suy luận nhân quả chỉ là tạm thời… Bắt nạt là một yếu tố nguy cơ đáng nghiêm túc". Lý do: "Đều là cắt ngang" và "đồng thuận" không kiểm được cho cả các tổng hợp; "trầm cảm có sẵn" không có trong nguồn. Review (Claude Opus 5.5, 10/11/2026): Nhãn Đang tranh cãi cho phần nhân quả đạt thước đo: liên hệ mạnh nhưng Holt 2015 chỉ cắt ngang và Ttofi 2011 viết "causal inferences are tentative".'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4702491/" ]
    luot_2_ghi_chu: "Nhãn 'Đang tranh cãi' hợp lý: liên hệ mạnh nhất quán nhưng nhân quả chưa xác định."
    review: dung
  - id: n50
    cau: 'Nhãn "Khá vững": chính sách kỷ luật "không khoan nhượng" chưa có bằng chứng ủng hộ; kỷ luật vững chắc trong chương trình toàn trường thì gắn với hiệu quả lớn hơn (Ttofi và Farrington, 2011).'
    loai: nhan
    nhan: kha-vung
    co_so:
      - ttofi2011
      - apa2008
    ly_do: Một tổng quan có hệ thống của APA (2008) về kỷ luật học đường nói chung thấy dữ liệu ít và có xu hướng mâu thuẫn với giả định của chính sách không khoan nhượng; chưa có phân tích tổng hợp riêng cho bắt nạt về mức độ trừng phạt, và một phân tích tổng hợp thành phần (Ttofi 2011) thấy kỷ luật vững chắc gắn với hiệu quả lớn hơn. Không đạt Đã bị bác bỏ (không có chuỗi kiểm tra đủ mạnh liên tục thất bại); Khá vững cho mệnh đề hẹp hơn.
    nguon:
      - ttofi2011
      - apa2008
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó: "trừng phạt nặng" ≠ "firm discipline" ≠ "zero tolerance". Lượt 2 và review cân nhắc có nên hạ thành "chưa đủ bằng chứng". Chữ cũ: "Bằng chứng ủng hộ kỷ luật vững chắc, nhất quán và không thù địch — chứ không phải các biện pháp loại trừ kiểu "đuổi học ngay lập tức"… Đáng chú ý, phân tích của Ttofi và Farrington còn phát hiện các chương trình ép nạn nhân và kẻ bắt nạt "làm việc với nhau" theo nhóm bạn lại liên quan đến tăng tỉ lệ nạn nhân." Chữ mới: "Bằng chứng ủng hộ kỷ luật vững chắc (Ttofi và Farrington, 2011…). Còn các chính sách "không khoan nhượng"… tổng quan của APA (2008)…". Lý do: "Nhất quán và không thù địch" không có trong tóm tắt; vế "ép… làm việc với nhau" không đúng với nguồn (xem n29). Review (Claude Opus 5.5, 10/11/2026): Lượt 2 không chắc đúng chỗ: nhãn Đã bị bác bỏ cho "trừng phạt thật nặng là cách tốt nhất" không có nguồn kiểm trực tiếp, và Ttofi 2011 còn thấy kỷ luật vững chắc gắn với hiệu quả. Đọc lại tóm tắt APA 2008 (OpenAlex) và Ttofi 2011 (NCJRS). Đổi khung thành Khá vững cho mệnh đề hẹp ("không khoan nhượng" chưa có bằng chứng ủng hộ), nêu rõ giới hạn; doi_chu.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://link.springer.com/article/10.1007/s11292-010-9109-1", "https://europepmc.org/article/MED/33715780" ]
    luot_2_ghi_chu: Nguồn đã mở nói biện pháp kỷ luật 'vững chắc' có hiệu quả lớn hơn, nhưng không có nguồn nào đã mở bác bỏ trực tiếp 'trừng phạt thật nặng là cách tốt nhất' (báo cáo về chính sách không khoan nhượng chưa mở được). Không xác nhận được nhãn 'Đã bị bác bỏ'.
    trich: there are surprisingly few data that could directly test the assumptions of a zero tolerance approach to school discipline, and the data that are available tend to contradict those assumptions [APA 2008, tóm tắt OpenAlex] | More intensive programs were more effective, as were programs including parent meetings, firm disciplinary methods, and improved playground supervision. [Ttofi & Farrington 2011, NCJRS]
    review: sai
  - id: n51
    cau: 'Nhãn "Đã bị bác bỏ": "bắt nạt chỉ là chuyện trẻ con, lớn lên tự hết": từng bị bắt nạt dự báo trầm cảm về sau (OR ≈ 2,0; ≈ 1,7 sau kiểm soát; theo dõi trung bình 6,9 năm), từng bắt nạt dự báo phạm tội về sau (OR hiệu chỉnh ≈ 1,8).'
    loai: nhan
    nhan: bac-bo
    co_so:
      - ttofi-dep2011
      - ttofi-off2011
      - olweus2013
    ly_do: Hai tổng quan hệ thống các nghiên cứu dọc (28 nghiên cứu mỗi tổng quan) cùng chiều và Olweus (2013) kết luận bắt nạt "không chỉ là vấn đề vô hại và thoáng qua". Nhãn xét theo các tổng quan hệ thống đã mở; đây là liên hệ dự báo, các tác giả viết suy luận nhân quả là tạm thời.
    nguon:
      - ttofi-dep2011
      - ttofi-off2011
      - olweus2013
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…từng bắt nạt người khác ở trường là yếu tố dự báo phạm tội sau này (tỉ số chênh hiệu chỉnh khoảng 1,9)… (Ttofi, Farrington, Lösel và Loeber, 2011; Ttofi, Farrington và Lösel, 2012)". Chữ mới: "…tỉ số chênh hiệu chỉnh khoảng 1,8; Ttofi và cộng sự, 2011… Olweus (2013) cũng kết luận bắt nạt không chỉ là vấn đề vô hại và thoáng qua". Lý do: OR hiệu chỉnh là 1,82 (đúng 1,8, không phải 1,9); bài Ttofi 2012 (bạo lực) không mở được nên bỏ khỏi trang và danh sách nguồn. Review (Claude Opus 5.5, 10/11/2026): Lượt 2 không chắc chỉ vì không đọc được tóm tắt Ttofi 2011 (trầm cảm): review đọc được qua OpenAlex (10/11/2026): "mean follow-up period of 6.9 years … OR=1.99 … controlling for up to 20 … OR=1.74 … Although causal inferences are tentative". Olweus 2013 (tóm tắt): "Recent meta-analyses of the long-term outcomes … provide convincing evidence that being involved in such problems is not just a harmless and passing school problem". Hai tổng quan hệ thống các nghiên cứu dọc (28 nghiên cứu mỗi bài) cùng chiều trực tiếp bác mệnh đề "lớn lên tự hết": giữ Đã bị bác bỏ.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/21370293", "https://pmc.ncbi.nlm.nih.gov/articles/PMC5371173/" ]
    luot_2_ghi_chu: Phần phạm tội khớp. Các con số trầm cảm (OR ~2,0; ~1,7 sau kiểm soát; 6,9 năm) không xác nhận được (tóm tắt Ttofi 2011 bị ẩn); 'gấp đôi' khớp Moore 2017. Nhãn 'Đã bị bác bỏ' cho 'chỉ là chuyện trẻ con' hợp lý về hướng.
    review: dung
  - id: n52
    cau: 'Từng bị bắt nạt dự báo trầm cảm sau trung bình 6,9 năm theo dõi, tỉ số chênh 1,99 (1,74 sau khi kiểm soát tới 20 yếu tố nguy cơ tuổi thơ); từng bắt nạt dự báo phạm tội: OR 2,50, hiệu chỉnh 1,82 (theo dõi tới 11 năm).'
    loai: so-lieu
    nguon:
      - ttofi-dep2011
      - ttofi-off2011
    trich: The probability of being depressed up to 36 years later (mean follow-up period of 6.9 years) was much higher … (odds ratio (OR)=1.99 …). … OR=1.74 (Ttofi dep); … OR = 2.50; … OR = 1.82 (Ttofi off)
    vi_tri: Ttofi (2011), hai tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…dự báo trầm cảm sau trung bình gần 7 năm (tỉ số chênh khoảng 2,0; vẫn khoảng 1,7…)". Chữ mới: Giữ "khoảng 2,0 / 1,7", thêm 6,9 năm; đổi phạm tội 1,9 → 1,8. Lý do: Số liệu đúng theo tóm tắt. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Tóm tắt Ttofi 2011 (trầm cảm) đọc được qua OpenAlex: OR 1,99 (CI 1,71–2,32), 1,74 (1,54–1,97), 6,9 năm, tới 20 yếu tố. Lượt 2 không chắc; nay đã giải quyết.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/21370293" ]
    luot_2_ghi_chu: "Phần phạm tội (OR 2,50; hiệu chỉnh 1,82; tới 11 năm) khớp. Phần trầm cảm (OR 1,99; 1,74 sau kiểm soát 20 yếu tố; 6,9 năm) không xác nhận được: tóm tắt Ttofi 2011 (J Aggress Confl Peace Res) bị nhà xuất bản ẩn; Moore 2017 chỉ nêu 'twice as likely'."
    review: dung
  - id: n53
    cau: Salmivalli và cộng sự (1996) xem bắt nạt như một quá trình nhóm và xét các vai trò tham gia của học sinh trong mối liên hệ với địa vị xã hội trong nhóm.
    loai: lich-su
    nguon:
      - salmivalli1996
    trich: Bullying was investigated as a group process … among 573 Finnish sixth-grade children … The Participant Roles assigned to the subject were Victim, Bully, Reinforcer of the bully, Assistant of the bully, Defender of the victim, and Outsider. … The sociometric status of the children was found to be connected to their Participant Roles.
    vi_tri: Salmivalli 1996, tóm tắt (OpenAlex)
    ket_qua: da-sua
    ghi_chu: 'Chỗ chưa mở: chỉ đọc được tiêu đề; sáu vai trò (nạn nhân, kẻ bắt nạt, người cổ vũ, người tiếp tay, người bảo vệ, người ngoài cuộc) kiểm qua kết quả tìm kiếm, không qua trang đã mở nên trang chỉ nói "những người tiếp tay, cổ vũ, đứng ngoài cuộc và bảo vệ" như gợi ý của cách nhìn này. Lượt 2 nên tìm toàn văn. Chữ cũ: "Salmivalli… chỉ ra rằng… ngoài kẻ bắt nạt và nạn nhân còn có các vai trò khác: người tiếp tay, người cổ vũ (cười, reo hò — vô tình "thưởng"), người ngoài cuộc (đứng nhìn, im lặng — sự im lặng cũng là một thông điệp), người bảo vệ. Kẻ bắt nạt thường có địa vị xã hội cao… (Salmivalli và cộng sự, 1996)." Chữ mới: "Salmivalli… xem bắt nạt như một quá trình nhóm và xét các vai trò tham gia… Cách nhìn này gợi ý rằng ngoài kẻ bắt nạt và nạn nhân còn có những người tiếp tay, cổ vũ, đứng ngoài cuộc và bảo vệ." Lý do: Bỏ "địa vị xã hội cao" và các mô tả vai trò (không mở được nguồn nói điều đó). Review (Claude Opus 5.5, 10/11/2026): Review đọc được tóm tắt qua OpenAlex (lượt 1 chỉ có tiêu đề): câu đúng. Trang thêm cỡ mẫu và các vai theo tóm tắt, bỏ chữ "gợi ý"; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/8759042" ]
    review: dung
  - id: n54
    cau: Chương trình KiVa của Phần Lan nhấn mạnh vai trò của người chứng kiến.
    loai: dinh-nghia
    nguon:
      - frcha2026
    trich: Another widely implemented intervention is the KiVa program, developed in Finland. This program emphasizes the role of bystanders in bullying situations
    vi_tri: Marano (2026), mục 6.1
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…các chương trình hiệu quả như KiVa của Phần Lan nhắm vào người chứng kiến: dạy cả lớp cách không cổ vũ và dám bảo vệ bạn." Chữ mới: "…chương trình KiVa của Phần Lan nhấn mạnh vai trò của người chứng kiến (theo một tổng quan năm 2026)." Lý do: Bỏ mô tả nội dung huấn luyện (không kiểm được). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Marano 2026 (PMC13408263) đọc lại.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC11513876/" ]
    luot_2_ghi_chu: "Cũng nêu: ít dữ liệu cho thấy tác dụng của KiVa qua trung gian hành vi người chứng kiến."
    review: dung
  - id: n55
    cau: Thử nghiệm ngẫu nhiên ở 78 trường, 8.237 học sinh lớp 4–6, sau 9 tháng KiVa có tác động tốt lên 7 trong 11 biến, gồm bắt nạt và bị bắt nạt do học sinh tự báo cáo.
    loai: phat-hien
    nguon:
      - kiva2011
    trich: Altogether, 78 schools were randomly assigned to intervention (39 schools, 4,207 students) and control conditions (39 schools, 4,030 students). … after 9 months of implementation, the intervention had consistent beneficial effects on 7 of the 11 dependent variables, including self- and peer-reported victimization and self-reported bullying.
    vi_tri: Kärnä (2011), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…đánh giá quy mô lớn ở Phần Lan (78 trường, hơn 8.000 học sinh) cho thấy nó giảm được cả tỉ lệ bắt nạt lẫn nạn nhân (Kärnä và cộng sự, 2011)." Chữ mới: "…một thử nghiệm ngẫu nhiên ở 78 trường với hơn 8.000 học sinh lớp 4–6 thấy sau 9 tháng chương trình có tác động tốt lên nhiều chỉ số, kể cả bắt nạt và bị bắt nạt do học sinh tự báo cáo". Lý do: Nêu thiết kế ngẫu nhiên, lớp 4–6, 9 tháng, 7/11 biến. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Tóm tắt Kärnä 2011 (đọc lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/21291444" ]
    review: dung
  - id: n56
    cau: 'Nhãn "Đang tranh cãi": vai trò của người chứng kiến và bạn cùng lứa trong chương trình chống bắt nạt (KiVa có hiệu quả; Gaffney 2021: tham gia không chính thức của bạn bè gắn với hiệu quả lớn hơn; Ttofi 2011: làm việc với bạn cùng lứa gắn với tăng nạn nhân).'
    loai: nhan
    nhan: tranh-cai
    co_so:
      - kiva2011
      - gaffney2021
      - ttofi2011
    ly_do: "Hai phân tích tổng hợp thành phần cho kết quả trái chiều về vai trò bạn cùng lứa (Ttofi 2011 so với Gaffney 2021; mã hóa thành phần khác nhau); thử nghiệm KiVa đánh giá cả chương trình, không tách phần người chứng kiến. Bằng chứng tốt mâu thuẫn: Đang tranh cãi."
    nguon:
      - kiva2011
      - gaffney2021
      - ttofi2011
      - frcha2026
      - unicef-cyber
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: Tiêu đề mục 2 (":nhan[kha-vung]") và "Đa số vụ bắt nạt diễn ra trước mặt người khác. Bạn không cần lao vào can ngăn một cách nguy hiểm: chỉ cần không cười theo, không chia sẻ clip bắt nạt, và sau đó đến bên nạn nhân… cũng đã phá vỡ "phần thưởng xã hội" nuôi dưỡng kẻ bắt nạt. Các chương trình như KiVa thành công chính nhờ huấn luyện cả lớp làm điều này". Chữ mới: "Chương trình KiVa… nhấn mạnh vai trò của người chứng kiến, và một thử nghiệm ngẫu nhiên… Những việc như không cười theo… là gợi ý thực hành hợp lý theo hướng này; chúng tôi không có nghiên cứu nào đo riêng từng hành vi ấy." Lý do: Bỏ "đa số vụ bắt nạt diễn ra trước mặt người khác" và "phần thưởng xã hội" (không kiểm được); KiVa nhắm cả lớp nhưng không có nguồn nói "thành công chính nhờ" điều đó. Review (Claude Opus 5.5, 10/11/2026): Lượt 2 quá mạnh đúng. Đổi chip sang Đang tranh cãi, tiêu đề "Người chứng kiến: hướng đi hứa hẹn, bằng chứng chưa thống nhất" (giữ id cũ), thân mục nêu cả hai chiều; bỏ các hành vi gợi ý không nguồn, thay bằng lời khuyên của UNICEF; doi_chu.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC11513876/", "https://europepmc.org/article/MED/21291444", "https://link.springer.com/article/10.1007/s11292-010-9109-1", "https://europepmc.org/article/MED/33715780" ]
    luot_2_ghi_chu: "câu đúng: Nhãn 'Đang tranh cãi': vai trò của người chứng kiến/bạn cùng lứa trong chương trình chống bắt nạt; KiVa hiệu quả nhưng chưa rõ qua cơ chế người chứng kiến.; Bằng chứng về vai trò người chứng kiến mâu thuẫn (Ttofi 2011 thấy làm việc với bạn cùng lứa đi cùng tăng nạn nhân; Gaffney 2021 thấy sự tham gia không chính thức của bạn bè hiệu quả hơn; chưa chứng minh KiVa tác động qua người chứng kiến). Nhãn 'Khá vững' cao hơn thước đo; 'chìa khóa bị bỏ quên' mạnh hơn bằng chứng."
    trich: after 9 months of implementation, the intervention had consistent beneficial effects on 7 of the 11 dependent variables [Kärnä 2011] | The presence of informal peer involvement and information for parents were associated with larger effect sizes for school-bullying victimization outcomes [Gaffney 2021] | Work with peers was associated with an increase in victimization. [Ttofi 2011] | It is important to listen to your friend … support them in finding a trusted adult who can help them [UNICEF]
    review: sai
  - id: n57
    cau: Ttofi và Farrington (2011) thấy họp phụ huynh đi cùng hiệu quả lớn hơn, và Gaffney và cộng sự (2021) thấy thông tin cho phụ huynh gắn với hiệu quả lớn hơn.
    loai: phat-hien
    nguon:
      - ttofi2011
      - gaffney2021
    trich: More intensive programs were more effective, as were those including parent meetings (Ttofi); information for parents were associated with larger effect sizes (Gaffney)
    vi_tri: Ttofi (2011), tóm tắt; Gaffney (2021), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Phân tích của Ttofi và Farrington chỉ ra họp phụ huynh là một trong những thành phần hiệu quả nhất." Chữ mới: "Ttofi và Farrington (2011) thấy họp phụ huynh đi cùng hiệu quả lớn hơn, và Gaffney… thông tin cho phụ huynh gắn với hiệu quả lớn hơn." Lý do: Tóm tắt không xếp "một trong hiệu quả nhất". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://link.springer.com/article/10.1007/s11292-010-9109-1", "https://europepmc.org/article/MED/33715780" ]
    review: dung
  - id: n58
    cau: 'Nhãn "Khá vững": cha mẹ và nhà trường "cùng một phe" (thành phần phụ huynh gắn với hiệu quả lớn hơn).'
    loai: nhan
    nhan: kha-vung
    co_so:
      - ttofi2011
      - gaffney2021
    ly_do: Hai phân tích tổng hợp thành phần cùng chiều (Ttofi 2011; Gaffney 2021), nhưng đó là liên hệ giữa thành phần và kích thước hiệu quả trong các nghiên cứu có sẵn, không phải thí nghiệm riêng, và hai phân tích mã hóa thành phần khác nhau. Khá vững.
    nguon:
      - ttofi2011
      - gaffney2021
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: Tiêu đề mục 3 (":nhan[kha-vung]") giữ nguyên chip. Chữ mới: Giữ chip; nội dung mục viết lại theo n57 và n59. Lý do: Nhãn nay có co_so và lý do. Review (Claude Opus 5.5, 10/11/2026): Nhãn Khá vững đạt thước đo (hai phân tích thành phần cùng chiều cho thành phần phụ huynh; là so sánh nhóm con).'
    luot_2: dung
    luot_2_nguon: [ "https://link.springer.com/article/10.1007/s11292-010-9109-1", "https://europepmc.org/article/MED/33715780" ]
    luot_2_ghi_chu: Nhãn 'Khá vững' không cao hơn thước đo (so sánh nhóm con, không thí nghiệm riêng).
    review: dung
  - id: n59
    cau: UNICEF khuyên trẻ bị bắt nạt tìm sự giúp đỡ của cha mẹ, người thân hay một người lớn tin cậy; với bắt nạt trên mạng, có thể chặn tài khoản quấy rối, báo cáo với nền tảng và lưu bằng chứng (tin nhắn, ảnh chụp màn hình).
    loai: loi-khuyen
    nguon:
      - unicef-cyber
    trich: If you think you’re being bullied, the first step is to seek help from someone you trust such as your parents, a close family member or another trusted adult. … search for a child helpline in your country to talk to a professional counsellor. If the bullying is happening on a social platform, consider blocking the bully and formally reporting their behaviour … It can be helpful to collect evidence – text messages and screen shots of social media posts
    vi_tri: Gaffney (2021), tóm tắt (chỉ làm cơ sở chung)
    ket_qua: da-sua
    ghi_chu: 'Các bước cụ thể không có nguồn đã mở; đã ghi rõ trên trang. Chữ cũ: "…cha mẹ cần tin lời con trước, ghi lại diễn biến… và làm việc với giáo viên chủ nhiệm thay vì xông vào "xử" phụ huynh nhà kia — điều này thường khiến con bị trả đũa nặng hơn. Với bắt nạt trên mạng: lưu bằng chứng… chặn… báo cáo…". Chữ mới: "Các gợi ý cụ thể dưới đây là thông lệ thực hành, chưa phải kết quả của nghiên cứu mà chúng tôi đã kiểm: … cha mẹ có thể lắng nghe con trước, ghi lại diễn biến… trao đổi với giáo viên chủ nhiệm." Lý do: Bỏ "thường khiến con bị trả đũa nặng hơn" (không kiểm được); "cần" → "có thể". Review (Claude Opus 5.5, 10/11/2026): Lượt 2 không chắc đúng chỗ: các bước cho cha mẹ ("ghi lại diễn biến", "trao đổi với giáo viên chủ nhiệm") không có nguồn đã mở; lời rào "thông lệ thực hành" không thay được nguồn. Viết lại ở mức UNICEF nêu (đọc 10/11/2026); doi_chu.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Gợi ý cho cha mẹ (lắng nghe con, ghi lại diễn biến, lưu bằng chứng, chặn, báo cáo nền tảng): trang tự nhận là thông lệ thực hành, không có nguồn bậc 1-2 cho câu này trong lượt 2."
    review: sai
  - id: n60
    cau: Nếu bị bắt nạt kéo dài làm em lo lắng nhiều hay thay đổi rõ về ăn, ngủ, đi học, hãy tìm người có chuyên môn; xem Hỗ trợ.
    loai: loi-khuyen
    nguon:
      - unicef-cyber
    trich: Physically – tired (loss of sleep), or experiencing symptoms like stomach aches and headaches … Skipping school is another common effect of cyberbullying … if you feel bad and it doesn’t stop, then it’s worth getting help … talk to a professional counsellor
    vi_tri: Holt (2015), tóm tắt (chỉ làm cơ sở chung)
    ket_qua: da-sua
    ghi_chu: 'Lời dẫn an toàn theo lời giao, không phải chẩn đoán. Chữ cũ: (không có) Chữ mới: "Nếu bị bắt nạt kéo dài làm em lo lắng nhiều hay thay đổi rõ về ăn, ngủ, đi học, hãy tìm người có chuyên môn; xem [Hỗ trợ]". Lý do: Theo lời giao cho chủ đề bắt nạt kéo dài. Review (Claude Opus 5.5, 10/11/2026): Lượt 2 không chắc vì không có nguồn: thêm UNICEF (ảnh hưởng của bắt nạt trên mạng; "worth getting help"; người tư vấn chuyên môn), trang ghi nguồn trong câu; doi_chu. Câu không chẩn đoán, dẫn Hỗ trợ, không có số đường dây nóng.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Lời khuyên (tìm người có chuyên môn khi bị bắt nạt kéo dài ảnh hưởng ăn, ngủ, đi học): không có nguồn bậc 1-2 cụ thể cho câu này trong lượt 2."
    review: dung
  - id: n61
    cau: 'Kowalski và cộng sự (2014): niềm tin gây hấn là bình thường và tách rời đạo đức nằm trong các liên hệ mạnh nhất với việc thực hiện bắt nạt mạng; các cách nói "chỉ đùa thôi", "nó đáng bị thế" là ví dụ minh họa của chúng tôi.'
    loai: phat-hien
    nguon:
      - kowalski2014
    trich: among the strongest associations with cyberbullying perpetration were normative beliefs about aggression and moral disengagement
    vi_tri: Kowalski (2014), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Để gây hại cho người khác mà không cắn rứt, con người có một bộ "thủ thuật" tâm lý: đổ lỗi cho nạn nhân…, gọi hành vi bằng cái tên nhẹ nhàng hơn…, hay phân tán trách nhiệm… Nhận diện được các thủ thuật này… là bước đầu để vô hiệu hóa chúng." Chữ mới: "…niềm tin rằng gây hấn là bình thường và sự tách rời đạo đức… nằm trong các liên hệ mạnh nhất… Các cách nói "chỉ đùa thôi"… là ví dụ minh họa của chúng tôi". Lý do: Danh sách ba "thủ thuật" và "bước đầu để vô hiệu hóa" không có trong nguồn đã mở; giữ phần Kowalski xác nhận. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Ví dụ "chỉ đùa thôi" là minh họa, nói rõ.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/24512111" ]
    luot_2_ghi_chu: Các cách nói 'chỉ đùa thôi' là minh họa của trang, đúng như tự nhận.
    review: dung
  - id: n62
    cau: 'Gaffney và cộng sự (2021): các thành phần như cách tiếp cận toàn trường, chính sách chống bắt nạt, nội quy lớp học và thông tin cho phụ huynh gắn với hiệu quả lớn hơn; đây là liên hệ giữa thành phần và hiệu quả, không phải thí nghiệm riêng.'
    loai: phat-hien
    nguon:
      - gaffney2021
    trich: the presence of a number of intervention components (e.g., whole-school approach, anti-bullying policies, classroom rules, information for parents, …) were significantly associated with larger effect sizes
    vi_tri: Gaffney (2021), tóm tắt
    ket_qua: dung
    ghi_chu: Bullet "Chương trình toàn trường" thay thế bullet "Mô hình Olweus" (n24).
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/33715780" ]
    luot_2_ghi_chu: Gaffney 2021 dùng dữ liệu của phân tích tổng hợp trước, so sánh nhóm con; đúng là liên hệ, không phải thí nghiệm riêng.
  - id: n63
    cau: Lo âu về thi cử liên quan âm đến thành tích học tập (238 nghiên cứu; liên hệ nhỏ đến vừa, rõ nhất ở cấp THCS).
    loai: phat-hien
    nguon:
      - vonderembse2018
    trich: Results of 238 studies from 1988 to the present … test anxiety was significantly and negatively related to a wide range of educational performance outcomes … Results were most pronounced at the middle grades level. … The magnitude … was in the small to moderate range.
    vi_tri: von der Embse (2018), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Câu mới thêm; thay vế "một chút căng thẳng giúp tập trung" (n65). Chữ cũ: (không có; thay cho đoạn "Ở các nền giáo dục chịu ảnh hưởng văn hóa Nho giáo, điểm số… thể diện của cả gia đình… Phần Lan chứng minh có thể vừa học giỏi vừa ít lo âu, nếu văn hóa học đường ít so sánh và cạnh tranh hơn") Chữ mới: "Lo âu về thi cử liên quan âm đến thành tích học tập (von der Embse và cộng sự, 2018, 238 nghiên cứu…); PISA 2015 cho thấy các nước có động lực thành tích cao cũng thường có nhiều học sinh lo âu…; Trần và cộng sự (2024) bàn luận rằng cha mẹ quá kiểm soát…" Lý do: Bỏ "thể diện gia đình/Nho giáo" và "Phần Lan… nếu văn hóa ít so sánh" (không kiểm được). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Tóm tắt von der Embse 2018 (đọc lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/29156362" ]
    review: dung
  - id: n64
    cau: Trần và cộng sự (2024) bàn luận rằng cha mẹ quá kiểm soát có thể để lại cho trẻ ít thời gian thư giãn và ngủ; đó là phần bàn luận, không phải kết quả đo.
    loai: phat-hien
    nguon:
      - tran2024
    trich: students with overbearing parents often have limited time for relaxation, play, and casual interactions with neighbors and are sleep deprived. This leads to heightened anxiety, particularly when facing intense pressure from examinations.
    vi_tri: Tran (2024), Discussion
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC11442093/" ]
    luot_2_ghi_chu: Đúng là phần bàn luận của Tran và cộng sự 2024, không phải kết quả đo.
  - id: n65
    cau: 'Nhãn "Khá vững": lo âu về thi cử đi cùng thành tích thấp hơn, ở mức liên hệ nhỏ đến vừa; chúng tôi không có nguồn cho việc căng thẳng vừa phải có lợi cho thi cử.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - vonderembse2018
      - oecd2017
    ly_do: Một phân tích tổng hợp 30 năm (238 nghiên cứu) và PISA 2015 (lo âu liên quan âm với điểm khoa học, toán, đọc) cùng chiều; liên hệ nhỏ đến vừa, chủ yếu cắt ngang, chưa có tái lập lớn đăng ký trước. Khá vững. Giả thuyết Yerkes–Dodson (căng thẳng vừa phải có lợi) không được bài này kiểm hay nêu, nên trang không khẳng định.
    nguon:
      - vonderembse2018
      - oecd2017
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: Tiêu đề mục 4 "Quản lý áp lực thi cử: phân biệt "lo âu vừa phải" với "lo âu độc hại"" và "Một chút căng thẳng trước kỳ thi là bình thường và thậm chí giúp tập trung." Chữ mới: Tiêu đề "Áp lực thi cử: khi nào cần để ý" (giữ id cũ); "Chúng tôi không có nguồn cho việc một mức căng thẳng "vừa phải" có lợi cho thi cử." Lý do: Không có nguồn đã mở cho Yerkes–Dodson trong bối cảnh thi cử; von der Embse thấy liên hệ âm. Review (Claude Opus 5.5, 10/11/2026): Nhãn Khá vững đạt thước đo (một phân tích tổng hợp 238 nghiên cứu, liên hệ nhỏ đến vừa, chủ yếu tương quan; PISA cùng chiều).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/29156362", "https://web.archive.org/web/20240117003558if_/https://read.oecd.org/10.1787/9789264273856-en?format=pdf" ]
    luot_2_ghi_chu: Nhãn 'Khá vững' không cao hơn thước đo. 'Chúng tôi không có nguồn cho căng thẳng vừa phải có lợi' là tự nhận, đúng.
    review: dung
  - id: n66
    cau: Theo NHS, học sinh căng thẳng vì thi cử có thể ngủ không ngon, ăn uống thay đổi hay thấy tương lai vô vọng, và nên tìm giúp đỡ khi lo âu hay buồn chán nặng, kéo dài và ảnh hưởng đến sinh hoạt hằng ngày; khi đó hãy nói với người lớn tin cậy và tìm người có chuyên môn; xem Hỗ trợ.
    loai: loi-khuyen
    nguon:
      - nhs-exam
    trich: "Children and young people who are stressed may: … not sleep well … lose interest in food or eat more than normal … feel hopeless about the future … Get help if your child's anxiety or low mood is severe, persists and interferes with their everyday life. Seeing a GP is a good place to start."
