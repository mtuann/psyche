    trich: '"nearly three times more likely to feel shunned" and "more than twice as likely to miss school"'
    vi_tri: Bản tin LHQ 01/2019
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "…nguy cơ cảm thấy mình là "người ngoài" ở trường cao gần gấp ba lần và vắng mặt ở trường cao hơn gấp đôi so với các bạn không bị bắt nạt (UNESCO, 2019)." Chữ mới: "…cảm thấy bị xa lánh cao gần gấp ba lần và vắng mặt ở trường cao hơn gấp đôi so với các bạn khác." Lý do: Theo chữ của bản tin ("shunned"); so với "các bạn khác", không phải "các bạn không bị bắt nạt". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Đọc lại bản tin LHQ (news.un.org, 10/11/2026): "Frequently bullied children are nearly three times more likely to feel shunned and more than twice as likely to miss school." Câu đi ngay sau lời dẫn bản tin.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.unesco.org/en/articles/behind-numbers-ending-school-violence-and-bullying" ]
