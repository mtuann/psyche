    trich: Brazil 0.60 80.8 56.0 …; Costa Rica 0.60 81.2 55.2 …; Singapore 0.57 76.3 59.9 …; Finland -0.41 48.6 17.8 …; Netherlands -0.54 39.1 14.5 …; Switzerland -0.44 33.5 20.6
    vi_tri: OECD (2017), Overview, Hình III.1.2, Part 1/2, cột "Index of schoolwork-related anxiety"
    ket_qua: da-sua
    ghi_chu: 'Chỉ số theo bảng; "nhóm cao nhất" = ba nước cao nhất. Thứ hạng PISA của Singapore không có trong phần đã mở nên trang không nêu. Chữ cũ: "Singapore — một trong những nền giáo dục đứng đầu thế giới — có chỉ số lo âu này cao nhất trong các nước tham gia (OECD, 2017), trong khi Phần Lan (cũng thuộc top đầu) lại thấp nhất." Chữ mới: "Singapore nằm trong nhóm có chỉ số lo âu cao nhất (0,57, sau Brazil và Costa Rica, cùng 0,60), trong khi Phần Lan thấp (−0,41; Hà Lan −0,54 và Thụy Sĩ −0,44 còn thấp hơn)". Lý do: Sai: Singapore thứ ba, Phần Lan không thấp nhất; thứ hạng giáo dục không kiểm được. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
