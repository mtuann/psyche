nhan_dinh:
- id: n1
  cau: Ba tiêu chí của định nghĩa bắt nạt học đường (theo Olweus và CDC); chương trình can thiệp nào hiệu quả theo các phân tích tổng hợp; bắt nạt trên mạng và trực tiếp liên quan thế nào; áp lực thi cử qua PISA 2015 và một nghiên cứu dọc ở Huế (mô tả của trang).
  loai: phat-hien
  nguon:
  - holt2015
  - tran2024
  - oecd2017
  trich: Of the 3 core features of bullying set forth in the CDC uniform definition of bullying, most studies (n = 34) specified that aggressive acts were measured and tapped into the repeated nature of bullying (n = 31); approximately a quarter (n = 12) attempted to assess a power imbalance or differential.
  vi_tri: Holt (2015); Trần (2024); OECD (2017)
  ket_qua: da-sua
  ghi_chu: 'Mô tả khớp nội dung trang sau khi sửa. Chữ cũ: "…bắt nạt trên mạng khác gì bắt nạt trực tiếp, và vì sao học sinh châu Á — trong đó có Việt Nam — lo âu về bài vở đến vậy." Chữ mới: "…bắt nạt trên mạng và trực tiếp liên quan thế nào, và áp lực thi cử qua số liệu PISA 2015 và một nghiên cứu dọc ở Huế." Lý do: Việt Nam không có số liệu PISA 2015 cho chỉ số lo âu (OECD 2017), nên không thể nói học sinh Việt lo âu "đến vậy" theo PISA; "định nghĩa của Olweus" đổi thành "theo Olweus và CDC".'
- id: n2
  cau: Chỉ tình huống (c) hội đủ ba dấu hiệu của định nghĩa bắt nạt (ba tình huống là ví dụ giả định); (a) là xung đột ngang hàng, (b) là sự cố đơn lẻ.
  loai: dinh-nghia
  nguon:
  - holt2015
  trich: Of the 3 core features of bullying set forth in the CDC uniform definition of bullying, most studies (n = 34) specified that aggressive acts were measured and tapped into the repeated nature of bullying (n = 31); approximately a quarter (n = 12) attempted to assess a power imbalance or differential.
  vi_tri: Holt (2015), mục Results
  ket_qua: da-sua
  ghi_chu: 'Tình huống Minh và (a), (b), (c): gia-dinh. Lời giải thích không dựa vào vị trí lựa chọn. Chữ cũ: "…ba dấu hiệu mà nhà nghiên cứu Dan Olweus dùng để định nghĩa bắt nạt". Chữ mới: "…ba dấu hiệu trong định nghĩa bắt nạt theo Olweus và theo CDC". Lý do: Nguồn đã mở nêu ba nét cốt lõi của định nghĩa CDC; định nghĩa Olweus theo sách không mở được.'
- id: n3
  cau: 'Bắt nạt không nằm ở mức độ nặng nhẹ của một hành động đơn lẻ mà ở mẫu hình của nó: lặp đi lặp lại, có chênh lệch quyền lực.'
  loai: dinh-nghia
  nguon:
  - holt2015
  trich: Of the 3 core features of bullying set forth in the CDC uniform definition of bullying, most studies (n = 34) specified that aggressive acts were measured and tapped into the repeated nature of bullying (n = 31); approximately a quarter (n = 12) attempted to assess a power imbalance or differential.
  vi_tri: Holt (2015), mục Results
  ket_qua: dung
- id: n4
  cau: Theo định nghĩa trong sách của Olweus (1993), một học sinh bị bắt nạt khi em bị phơi nhiễm, lặp đi lặp lại và kéo dài, trước những hành động tiêu cực của một hoặc nhiều học sinh khác, trong quan hệ chênh lệch sức mạnh.
  loai: dinh-nghia
  nguon:
  - holt2015
  - olweus2013
  trich: Of the 3 core features of bullying set forth in the CDC uniform definition of bullying … aggressive acts … repeated nature … power imbalance (Holt 2015)
  vi_tri: Holt (2015); sách Olweus (1993) không mở được
  ket_qua: da-lam-mem
  ghi_chu: 'Chỗ chưa mở: lời nguyên văn của Olweus (1993, sách) chỉ kiểm qua mô tả thứ cấp (kết quả tìm kiếm, không phải trang đã mở); Holt (2015) xác nhận ba nét cốt lõi của định nghĩa CDC. Lượt 2 nên tìm toàn văn. Chữ cũ: "…do nhà tâm lý học người Na Uy Dan Olweus — người tiên phong nghiên cứu lĩnh vực này từ những năm 1970 — đề xuất: một học sinh bị bắt nạt khi em bị phơi nhiễm… (Olweus, 1993)". Chữ mới: "…bắt nguồn từ công trình của nhà tâm lý học Dan Olweus. Theo định nghĩa trong sách của ông (Olweus, 1993; chúng tôi không mở được sách gốc)… Định nghĩa thống nhất của CDC cũng gồm ba nét cốt lõi (Holt và cộng sự, 2015)". Lý do: Bỏ quốc tịch và "từ những năm 1970" (không kiểm được); nêu rõ chưa mở sách.'
- id: n5
  cau: Ba tiêu chí (cố ý gây hại, lặp lại theo thời gian, chênh lệch quyền lực) là bộ lọc phân biệt bắt nạt với một vụ xung đột tay đôi hay một sự cố đơn lẻ.
  loai: dinh-nghia
  nguon:
  - holt2015
  trich: Of the 3 core features of bullying set forth in the CDC uniform definition of bullying, most studies (n = 34) specified that aggressive acts were measured and tapped into the repeated nature of bullying (n = 31); approximately a quarter (n = 12) attempted to assess a power imbalance or differential.
  vi_tri: Holt (2015), mục Results
  ket_qua: da-sua
  ghi_chu: 'Cụm "cố ý gây hại" là cách diễn đạt của Olweus; CDC dùng "aggressive acts". Chữ cũ: "…phân biệt bắt nạt với những thứ trông giống nó: đùa giỡn thô bạo giữa bạn bè ngang sức (rough-and-tumble play), hay một vụ xung đột tay đôi." Chữ mới: "…phân biệt bắt nạt với những thứ trông giống nó: một vụ xung đột tay đôi hay một sự cố đơn lẻ." Lý do: Bỏ "rough-and-tumble play" (không có nguồn đã mở).'
- id: n6
  cau: Trong 47 nghiên cứu mà Holt và cộng sự tổng hợp, chỉ khoảng một phần tư (12) cố đánh giá chênh lệch quyền lực, nên số liệu giữa các nghiên cứu khó so sánh.
  loai: so-lieu
  nguon:
  - holt2015
  trich: approximately a quarter (n = 12) attempted to assess a power imbalance or differential.
  vi_tri: Holt (2015), mục Results (đoạn về đo lường bắt nạt)
  ket_qua: dung
  ghi_chu: '"Khó so sánh" là suy ra của trang từ chuyện các nghiên cứu đo khác nhau; Holt cũng nêu vấn đề tương tự ở phần Discussion.'
- id: n7
  cau: Bắt nạt có thể diễn ra trực tiếp (thể chất, lời nói, quan hệ như tẩy chay) hay trên mạng; Modecki (2014) đo cả hai dạng và thấy chúng tương quan cao.
  loai: dinh-nghia
  nguon:
  - holt2015
  - modecki2014
  trich: types of bullying assessed (eg, physical, relational) (Holt 2015); Cyber and traditional bullying were also highly correlated (Modecki 2014)
  vi_tri: Holt (2015), Methods; Modecki (2014), tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Bắt nạt có nhiều hình thức: thể chất (đánh, xô đẩy, phá đồ), lời nói (chế nhạo, đe dọa, đặt biệt danh), quan hệ (tẩy chay, tung tin đồn, cô lập khỏi nhóm), và trên mạng (cyberbullying — quấy rối qua điện thoại, mạng xã hội)." Chữ mới: "Bắt nạt có thể diễn ra trực tiếp (thể chất, lời nói, quan hệ như tẩy chay) hay trên mạng… Modecki… đo cả hai dạng và thấy chúng tương quan cao với nhau." Lý do: Danh sách ví dụ chi tiết không có trong nguồn đã mở; giữ phân loại chung.'
- id: n8
  cau: '(Đã bỏ) Bắt nạt trên mạng có vài nét riêng: kẻ bắt nạt có thể ẩn danh, nạn nhân bị tấn công cả khi về nhà, nội dung xấu hổ lan đến hàng trăm người trong vài giờ.'
  loai: phat-hien
  ket_qua: da-bo
  ghi_chu: 'Không có nguồn đã mở; Olweus (2013) còn nói nhiều tuyên bố về bắt nạt mạng trên truyền thông bị phóng đại. Chữ cũ: "Bắt nạt trên mạng có vài nét riêng: kẻ bắt nạt có thể ẩn danh, nạn nhân bị tấn công cả khi đã về nhà, và một nội dung xấu hổ có thể lan đến hàng trăm người chỉ trong vài giờ." Chữ mới: (bỏ) Lý do: Không kiểm được.'
- id: n9
  cau: Báo cáo UNESCO (2019) tổng hợp dữ liệu từ 144 quốc gia và vùng lãnh thổ; gần một phần ba học sinh từng bị bắt nạt ít nhất một lần ở trường trong tháng trước đó; bắt nạt qua mạng và điện thoại đang tăng.
  loai: so-lieu
  nguon:
  - unnews2019
  trich: '"nearly one-in-three boys and girls have been bullied at least once at school over the last month"; "covering 144 countries and territories in all regions"; "online and mobile phone bullying is on the rise"'
  vi_tri: Bản tin LHQ 01/2019 về báo cáo UNESCO
  ket_qua: da-sua
  ghi_chu: 'Bản tin không nêu "32%" hay tỉ lệ bắt nạt mạng; không mở được bản gốc UNESCO. Chữ cũ: "…gần một phần ba học sinh trên thế giới từng bị bắt nạt ít nhất một lần trong tháng trước đó, và khoảng một phần mười là nạn nhân của bắt nạt trên mạng (UNESCO, 2019)." Chữ mới: "…gần một phần ba học sinh từng bị bắt nạt ít nhất một lần ở trường trong tháng trước đó, và bắt nạt qua mạng và điện thoại đang tăng (theo bản tin của Liên Hợp Quốc về báo cáo)." Lý do: "Một phần mười" cho bắt nạt mạng không kiểm được; nguồn nói "đang tăng". Thêm "ở trường".'
- id: n10
  cau: Theo UNESCO, học sinh thường xuyên bị bắt nạt có nguy cơ cảm thấy bị xa lánh cao gần gấp ba lần và vắng mặt ở trường cao hơn gấp đôi so với các bạn khác.
  loai: so-lieu
  nguon:
  - unnews2019
  trich: '"nearly three times more likely to feel shunned" and "more than twice as likely to miss school"'
  vi_tri: Bản tin LHQ 01/2019
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "…nguy cơ cảm thấy mình là "người ngoài" ở trường cao gần gấp ba lần và vắng mặt ở trường cao hơn gấp đôi so với các bạn không bị bắt nạt (UNESCO, 2019)." Chữ mới: "…cảm thấy bị xa lánh cao gần gấp ba lần và vắng mặt ở trường cao hơn gấp đôi so với các bạn khác." Lý do: Theo chữ của bản tin ("shunned"); so với "các bạn khác", không phải "các bạn không bị bắt nạt".'
- id: n11
  cau: 'Modecki và cộng sự (2014): phân tích tổng hợp 80 nghiên cứu; bắt nạt truyền thống phổ biến gấp đôi bắt nạt trên mạng; hai dạng tương quan cao.'
  loai: so-lieu
  nguon:
  - modecki2014
  trich: In our meta-analytic review, traditional bullying was twice as common as cyber bullying. Cyber and traditional bullying were also highly correlated
  vi_tri: Modecki (2014), tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chỉ đọc tóm tắt. Chữ cũ: "…khoảng 35% dính líu đến bắt nạt truyền thống… khoảng 15% dính líu đến bắt nạt trên mạng… hơn 300.000 thanh thiếu niên… em nào bị bắt nạt trên mạng thì nhiều khả năng cũng bị bắt nạt ngoài đời, và ngược lại". Chữ mới: "…bắt nạt truyền thống phổ biến gấp đôi bắt nạt trên mạng và hai dạng này tương quan cao". Lý do: 35%, 15%, 300.000 và "với vai trò nạn nhân hoặc kẻ bắt nạt" không có trong tóm tắt, không mở được toàn văn (các nguồn thứ cấp cũng mâu thuẫn về việc 35% là nạn nhân hay tổng).'
- id: n12
  cau: Các tác giả Modecki cho rằng việc dính líu vào nhiều dạng gây hấn (polyaggression) nên là mục tiêu chính của can thiệp và chính sách; cách đo khác nhau làm tỉ lệ khác nhau.
  loai: phat-hien
  nguon:
  - modecki2014
  trich: suggesting that polyaggression involvement should be a primary target for interventions and policy. … A number of measurement features moderated variability in bullying prevalence
  vi_tri: Modecki (2014), tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…nguồn lực phòng ngừa nên nhắm vào hành vi bắt nạt nói chung, thay vì tách riêng "chống bắt nạt mạng" như một vấn đề hoàn toàn khác". Chữ mới: "…việc dính líu vào nhiều dạng gây hấn cùng lúc nên là mục tiêu chính của can thiệp và chính sách, thay vì tách riêng…". Lý do: Theo chữ "polyaggression involvement" của tóm tắt; thêm điểm cách đo ảnh hưởng tỉ lệ.'
- id: n13
  cau: (Đã bỏ) Bắt nạt thường đạt đỉnh ở cấp trung học cơ sở (khoảng 11–14 tuổi), đúng độ tuổi nhu cầu được bạn bè chấp nhận lên cao nhất.
  loai: phat-hien
  ket_qua: da-bo
  ghi_chu: 'Không có nguồn đã mở. Chữ cũ: "Bắt nạt thường đạt đỉnh ở cấp trung học cơ sở (khoảng 11–14 tuổi) — đúng độ tuổi mà nhu cầu được bạn bè chấp nhận lên cao nhất." Chữ mới: (bỏ) Lý do: Không kiểm được.'
- id: n14
  cau: PISA 2015 đo chỉ số lo âu liên quan đến bài vở ở học sinh 15 tuổi; trung bình OECD, 55% (55,5% trong bảng) học sinh nói dù đã chuẩn bị kỹ vẫn rất lo âu khi làm bài; ở mọi nước tham gia, nữ lo âu hơn nam.
  loai: so-lieu
  nguon:
  - oecd2017
  trich: Some 55% of students say they are very anxious for a test even if they are well prepared. In all countries, girls reported greater schoolwork-related anxiety than boys
  vi_tri: OECD (2017), Overview, Editorial và Hình III.1.2 (OECD average 0.01; 55.5%)
  ket_qua: dung
  ghi_chu: Câu hỏi PISA dịch "Even if I am well prepared for a test I feel very anxious"; trang viết "dù đã chuẩn bị kỹ, em vẫn rất căng thẳng"; đổi "căng thẳng" thành "lo âu" cho khớp "anxious".
- id: n15
  cau: Singapore nằm trong nhóm có chỉ số lo âu bài vở cao nhất (0,57, sau Brazil và Costa Rica cùng 0,60), Phần Lan thấp (−0,41; Hà Lan −0,54 và Thụy Sĩ −0,44 còn thấp hơn).
  loai: so-lieu
  nguon:
  - oecd2017
  trich: Brazil 0.60 80.8 56.0 …; Costa Rica 0.60 81.2 55.2 …; Singapore 0.57 76.3 59.9 …; Finland -0.41 48.6 17.8 …; Netherlands -0.54 39.1 14.5 …; Switzerland -0.44 33.5 20.6
  vi_tri: OECD (2017), Overview, Hình III.1.2, Part 1/2, cột "Index of schoolwork-related anxiety"
  ket_qua: da-sua
  ghi_chu: 'Chỉ số theo bảng; "nhóm cao nhất" = ba nước cao nhất. Thứ hạng PISA của Singapore không có trong phần đã mở nên trang không nêu. Chữ cũ: "Singapore — một trong những nền giáo dục đứng đầu thế giới — có chỉ số lo âu này cao nhất trong các nước tham gia (OECD, 2017), trong khi Phần Lan (cũng thuộc top đầu) lại thấp nhất." Chữ mới: "Singapore nằm trong nhóm có chỉ số lo âu cao nhất (0,57, sau Brazil và Costa Rica, cùng 0,60), trong khi Phần Lan thấp (−0,41; Hà Lan −0,54 và Thụy Sĩ −0,44 còn thấp hơn)". Lý do: Sai: Singapore thứ ba, Phần Lan không thấp nhất; thứ hạng giáo dục không kiểm được.'
- id: n16
  cau: Nhật Bản, Hồng Kông, Ma Cao và Đài Bắc Trung Hoa có chỉ số lo âu bài vở cao hơn mức trung bình OECD (0,01).
  loai: so-lieu
  nguon:
  - oecd2017
  trich: Japan 0.26; Hong Kong (China) 0.33; Macao (China) 0.37; Chinese Taipei 0.39; OECD average 0.01
  vi_tri: OECD (2017), Overview, Hình III.1.2
  ket_qua: dung
  ghi_chu: Trang cũ nêu Nhật Bản, Hồng Kông, Ma Cao; thêm Đài Bắc Trung Hoa. Chỉ so giá trị chỉ số; ý nghĩa thống kê của từng nước không kiểm (bảng tô đậm trong PDF).
- id: n17
  cau: OECD ghi nhận các nước mà học sinh có động lực thành tích cao cũng thường là nước nhiều học sinh lo âu về bài thi; tần suất kiểm tra không liên quan đến mức lo âu.
  loai: phat-hien
  nguon:
  - oecd2017
  trich: PISA results show that countries where students are highly motivated to achieve also tend to be the countries where many students feel anxious about a test, even if they are well prepared for it. … the frequency of tests is also unrelated to students’ level of schoolwork-related anxiety.
  vi_tri: OECD (2017), Overview, Editorial và mục Students' well-being
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Nói cách khác: học giỏi và lo âu không loại trừ nhau — ở nhiều nơi, chúng đi cùng nhau." Chữ mới: "OECD ghi nhận rằng các nước mà học sinh có động lực thành tích cao cũng thường là nước nhiều học sinh lo âu về bài thi, trong khi tần suất kiểm tra không liên quan đến mức lo âu". Lý do: Nguồn nói về động lực thành tích, không phải "học giỏi".'
- id: n18
  cau: Phần Lan, Hà Lan và Thụy Sĩ cho thấy kết quả học tập tốt có thể đi cùng học sinh hài lòng với cuộc sống.
  loai: phat-hien
  nguon:
  - oecd2017
  trich: Finland, the Netherlands and Switzerland seem able to combine good learning outcomes with highly satisfied students.
  vi_tri: OECD (2017), Overview, Editorial
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Phần Lan chứng minh có thể vừa học giỏi vừa ít lo âu, nếu văn hóa học đường ít so sánh và cạnh tranh hơn." Chữ mới: "Phần Lan, Hà Lan và Thụy Sĩ cho thấy kết quả học tập tốt có thể đi cùng học sinh hài lòng với cuộc sống (OECD, 2017)." Lý do: Nguồn nói về hài lòng cuộc sống, không nói "văn hóa ít so sánh".'
- id: n19
  cau: Việt Nam không có số liệu cho chỉ số lo âu liên quan đến bài vở trong báo cáo PISA 2015 (Tập III).
  loai: so-lieu
  nguon:
  - oecd2017
  trich: Viet Nam m m m m m
  vi_tri: OECD (2017), Overview, Hình III.1.2 (ô "m" = thiếu số liệu)
  ket_qua: dung
  ghi_chu: Đây là nội dung của báo cáo 2017, không phải khẳng định thời sự về tình trạng hiện nay.
- id: n20
  cau: Olweus kể lại cách mối quan tâm và nghiên cứu của ông về bắt nạt bắt đầu, và cho rằng bị bắt nạt không chỉ là chuyện vô hại, thoáng qua (Olweus, 2013).
  loai: lich-su
  nguon:
  - olweus2013
  trich: After sketching how my own interest and research into bullying problems began … being involved in such problems is not just a harmless and passing school problem
  vi_tri: Olweus (2013), tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chỉ đọc tóm tắt. Chữ cũ: "Dan Olweus bắt đầu nghiên cứu tình trạng học sinh ức hiếp nhau ở Thụy Điển/Na Uy từ đầu thập niên 1970… Cuốn sách đầu tiên của ông, Aggression in the Schools (1978), là công trình khoa học có hệ thống đầu tiên về chủ đề này; đến Bullying at School (1993), ông hệ thống hóa định nghĩa ba tiêu chí…" Chữ mới: "Dan Olweus là nhà nghiên cứu đã gắn tên mình với việc nghiên cứu bắt nạt học đường và với [OBPP]; năm 2013 ông kể lại cách mối quan tâm và nghiên cứu của mình về bắt nạt bắt đầu, và cho rằng việc bị bắt nạt không chỉ là chuyện "vô hại, thoáng qua"." Lý do: Không kiểm được thời điểm, nơi, lý do ban đầu, "đầu tiên"; chỉ giữ điều tóm tắt 2013 nói.'
- id: n21
  cau: (Đã bỏ) Olweus bắt đầu nghiên cứu từ đầu thập niên 1970 sau một số vụ học sinh tự tử; sách 1978 là công trình khoa học có hệ thống đầu tiên về chủ đề; OBPP là chương trình can thiệp toàn trường đầu tiên trên thế giới.
  loai: lich-su
  ket_qua: da-bo
  ghi_chu: 'Không có nguồn đã mở nói ba điều này (sách không mở được). Chữ cũ: "…từ đầu thập niên 1970, sau một số vụ học sinh tự tử được cho là liên quan đến việc bị bắt nạt… là công trình khoa học có hệ thống đầu tiên… chương trình can thiệp toàn trường đầu tiên trên thế giới." Chữ mới: (bỏ) Lý do: Không kiểm được; liên quan đến chủ đề tự tử nên càng không để câu chưa kiểm.'
- id: n22
  cau: OBPP là chương trình toàn trường, thiết kế để giảm bắt nạt và cải thiện quan hệ bạn bè ở học sinh tiểu học, THCS.
  loai: dinh-nghia
  nguon:
  - olweus-limber2010
  trich: The Olweus Bullying Prevention Program (OBPP) is a comprehensive, school-wide program that was designed to reduce bullying and achieve better peer relations among students in elementary, middle, and junior high school grades.
  vi_tri: Olweus & Limber (2010), tóm tắt
  ket_qua: dung
- id: n23
  cau: 'OBPP hoạt động ở ba cấp: toàn trường (khảo sát ẩn danh, ban chống bắt nạt, tập huấn nhân viên, tăng giám sát ở điểm nóng), lớp học (họp lớp định kỳ, nội quy rõ ràng), cá nhân (làm việc với em bắt nạt, nạn nhân và phụ huynh).'
  loai: dinh-nghia
  nguon:
  - jkacap2026
  trich: 'It operates across three levels: 1) schoolwide, involving anonymous surveys, anti-bullying committees, staff training, and increased supervision in identified hotspots; 2) classroom-level, with regular class meetings and the establishment of clear behavioral expectations; and 3) individual-level, targeting bullies and victims through counseling and parental involvement.'
  vi_tri: Harsono & Febriyana (2026), mục School-level bullying interventions
  ket_qua: da-sua
  ghi_chu: 'Nguồn là tổng quan thứ cấp 2026, không phải sách của Olweus. Chữ cũ: "toàn trường (thành lập ban điều phối, khảo sát ẩn danh học sinh, xây dựng nội quy chung chống bắt nạt, tăng cường giám sát ở "điểm nóng"…, họp phụ huynh), lớp học (đặt nội quy lớp, tổ chức thảo luận định kỳ), và cá nhân (can thiệp với từng em bắt nạt, nạn nhân và phụ huynh các em)". Chữ mới: "toàn trường (khảo sát ẩn danh, ban chống bắt nạt, tập huấn nhân viên, tăng giám sát ở các "điểm nóng"), lớp học (họp lớp định kỳ, nội quy rõ ràng) và cá nhân…"; thêm "theo một bài tổng quan năm 2026". Lý do: Khớp chữ của tổng quan; bỏ "họp phụ huynh" ở cấp toàn trường và "nội quy chung" (nguồn xếp phụ huynh ở cấp cá nhân).'
- id: n24
  cau: '(Đã bỏ) OBPP dựa trên bốn nguyên tắc: người lớn ấm áp, quan tâm và tham gia; đặt giới hạn vững chắc; kỷ luật không thù địch nhất quán; người lớn là gương mẫu có thẩm quyền; "không dựa trên trừng phạt nặng mà trên sự kết hợp ấm áp và giới hạn".'
  loai: dinh-nghia
  ket_qua: da-bo
  ghi_chu: 'Không mở được sách Olweus (1993); tổng quan 2026 và Olweus & Limber (2010) tóm tắt không nêu bốn nguyên tắc. Chữ cũ: "Nền tảng của chương trình là bốn nguyên tắc: môi trường có sự ấm áp, quan tâm và tham gia của người lớn; đặt giới hạn vững chắc…" và gạch đầu dòng "Mô hình của Olweus: ấm áp + giới hạn vững chắc". Chữ mới: (bỏ cả hai chỗ; thay bằng bullet "Chương trình toàn trường" theo Gaffney 2021) Lý do: Không kiểm được.'
- id: n25
  cau: Các nghiên cứu ở Na Uy cho bằng chứng thuyết phục về hiệu quả của OBPP; các đánh giá ở Mỹ không đồng nhất nhưng cho thấy tác động tích cực lên việc học sinh tự báo cáo dính líu vào bắt nạt và hành vi chống đối xã hội.
  loai: phat-hien
  nguon:
  - olweus-limber2010
  trich: Several large-scale studies from Norway are reviewed, which provide compelling evidence of the program's effectiveness in Norwegian schools. Studies that have evaluated the OBPP in diverse settings in the United States have not been uniformly consistent, but they have shown that the OBPP has had a positive impact on students' self-reported involvement in bullying and antisocial behavior.
  vi_tri: Olweus & Limber (2010), tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đánh giá triển khai OBPP ở Mỹ cho thấy chương trình làm giảm đáng kể tỉ lệ bắt nạt và nạn nhân khi được thực hiện đúng (Olweus và Limber, 2010)." Chữ mới: "Olweus và Limber (2010) thấy các nghiên cứu ở Na Uy cho bằng chứng thuyết phục về hiệu quả; các đánh giá ở Mỹ không đồng nhất, nhưng cho thấy chương trình có tác động tích cực lên việc học sinh tự báo cáo dính líu vào bắt nạt và hành vi chống đối xã hội." Lý do: Tóm tắt nói "không đồng nhất", không nói "giảm đáng kể" hay "khi được thực hiện đúng".'
- id: n26
  cau: Ttofi và Farrington rà soát tài liệu (kể cả báo cáo chưa công bố, ngôn ngữ ngoài tiếng Anh) và chọn 89 báo cáo mô tả 53 chương trình, trong đó 44 chương trình có đủ dữ liệu tính cỡ hiệu ứng.
  loai: so-lieu
  nguon:
  - ttofi2011
  trich: 622 reports concerned with bullying prevention were found, and 89 of these reports (describing 53 different program evaluations) were included; 44 provided data permitting an effect size.
  vi_tri: Ttofi & Farrington (2011), tóm tắt (bản ghi NCJRS)
  ket_qua: da-sua
  ghi_chu: 'Trich theo kết quả công cụ đọc web của bản ghi OJP (tóm tắt của bài). Chữ cũ: "…rà soát toàn bộ tài liệu đến giữa năm 2009 (35 tạp chí đọc tay toàn bộ, 18 cơ sở dữ liệu điện tử…)… phân tích tổng hợp lớn nhất về chủ đề này tính đến thời điểm đó." Chữ mới: "…rà soát tài liệu nhiều nguồn, kể cả báo cáo chưa công bố và ngôn ngữ ngoài tiếng Anh…" Lý do: Số tạp chí, cơ sở dữ liệu, mốc 2009 và "lớn nhất" không có trong phần đã đọc.'
- id: n27
  cau: 'Trung bình các chương trình chống bắt nạt có hiệu quả thật: bắt nạt giảm khoảng 20–23% và nạn nhân giảm khoảng 17–20% (Ttofi và Farrington, 2011).'
  loai: so-lieu
  nguon:
  - ttofi2011
  trich: on average, bullying decreased by 20-23 percent and victimization decreased by 17-20 percent.
  vi_tri: Ttofi & Farrington (2011), tóm tắt (bản ghi NCJRS)
  ket_qua: dung
  ghi_chu: Một bản tóm tắt khác của bài nêu trung bình ~20% cho bắt nạt; giữ khoảng 20–23% theo bản đã mở.
- id: n28
  cau: Chương trình hiệu quả hơn khi triển khai chuyên sâu và khi có họp phụ huynh, phương pháp kỷ luật vững chắc, tăng cường giám sát ở sân chơi.
  loai: phat-hien
  nguon:
  - ttofi2011
  trich: More intensive programs were more effective, as were those including parent meetings, firm disciplinary methods, and improved playground supervision.
  vi_tri: Ttofi & Farrington (2011), tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…được triển khai chuyên sâu, dài hơi." Chữ mới: "…triển khai chuyên sâu." Lý do: "Dài hơi" không có trong tóm tắt.'
- id: n29
  cau: Chương trình có thành phần "làm việc với bạn cùng lứa" liên quan đến tăng tỉ lệ nạn nhân (Ttofi và Farrington, 2011); phát hiện này cần đọc thận trọng vì Gaffney và cộng sự (2021) thấy sự tham gia không chính thức của bạn bè gắn với hiệu quả lớn hơn.
  loai: phat-hien
  nguon:
  - ttofi2011
  - gaffney2021
  trich: Work with peers was associated with an increase in victimization. (Ttofi 2011); informal peer involvement and information for parents were associated with larger effect sizes for school-bullying victimization outcomes (Gaffney 2021)
  vi_tri: Ttofi & Farrington (2011), tóm tắt; Gaffney (2021), tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chỗ khó: tóm tắt không nói "work with peers" gồm hoạt động nào; hai phân tích mã hóa thành phần khác nhau, nên không coi là mâu thuẫn trực tiếp. Chữ cũ: "…các chương trình cho học sinh "làm việc với nhau theo nhóm bạn" (work with peers — ví dụ bắt nạn nhân và kẻ bắt nạt ngồi lại "hòa giải" với nhau) lại liên quan đến việc tăng tỉ lệ nạn nhân. Bài học: can thiệp sai cách có thể hại nhiều hơn lợi." Chữ mới: "…các chương trình có thành phần "làm việc với bạn cùng lứa" (work with peers) lại liên quan đến việc tăng tỉ lệ nạn nhân… cần đọc thận trọng: tóm tắt không nêu rõ các hoạt động cụ thể" + kết quả của Gaffney 2021. Lý do: Ví dụ "bắt hòa giải" và "bài học" không có trong tóm tắt; thêm kết quả không đồng nhất của phân tích sau.'
- id: n30
  cau: 'Phân tích cập nhật (Gaffney, Ttofi và Farrington, 2019): 100 đánh giá; các chương trình giảm hành vi bắt nạt khoảng 19–20% và nạn nhân khoảng 15–16%; khác biệt lớn giữa các nghiên cứu.'
  loai: so-lieu
  nguon:
  - gaffney2019
  trich: a total of 100 evaluations (with 103 independent effect sizes) were eligible … reduce school-bullying perpetration by approximately 19–20% ad school-bullying victimization by approximately 15–16%. Effect sizes vary greatly across studies
  vi_tri: Gaffney (2019), tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Trich từ bản tóm tắt qua API Semantic Scholar (có lỗi gõ "ad" trong nguồn). Chữ cũ: "…với gần gấp đôi số đánh giá (100 chương trình)…". Chữ mới: "Một phân tích cập nhật của cùng nhóm, với 100 đánh giá, thấy… khác biệt lớn giữa các nghiên cứu". Lý do: Nguồn nói 100 "evaluations", không phải 100 chương trình; số chương trình của bài 2011 là 53 (44 có số liệu).'
- id: n31
  cau: Gaffney, Ttofi và Farrington (2021) thấy cách tiếp cận toàn trường, chính sách chống bắt nạt, nội quy lớp học, thông tin cho phụ huynh, sự tham gia không chính thức của bạn bè và làm việc với nạn nhân gắn với hiệu quả lớn hơn; số lượng thành phần không liên quan đến hiệu quả.
  loai: phat-hien
  nguon:
  - gaffney2021
  trich: the presence of a number of intervention components (e.g., whole-school approach, anti-bullying policies, classroom rules, information for parents, informal peer involvement, and work with victims) were significantly associated with larger effect sizes for school-bullying perpetration outcomes. … Meta-regression analyses showed no significant relationship between effectiveness and the number of intervention components
  vi_tri: Gaffney (2021), tóm tắt
  ket_qua: dung
  ghi_chu: Câu mới thêm (Gaffney 2021 là nguồn bắt buộc của lời giao).
- id: n32
  cau: 'Kowalski và cộng sự (2014): liên hệ mạnh nhất với việc thực hiện bắt nạt mạng là niềm tin chuẩn mực về gây hấn và sự tách rời đạo đức; liên hệ mạnh nhất với việc bị bắt nạt mạng là căng thẳng và ý nghĩ tự tử; các liên hệ không cho biết chiều nhân quả.'
  loai: phat-hien
  nguon:
  - kowalski2014
  trich: among the strongest associations with cyberbullying perpetration were normative beliefs about aggression and moral disengagement, and the strongest associations with cyberbullying victimization were stress and suicidal ideation. … issues dealing with causality or directionality of these associations
  vi_tri: Kowalski (2014), tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…dự báo mạnh nhất của việc bị bắt nạt trên mạng chính là đang bị bắt nạt ngoài đời — và trong các yếu tố gắn với hành vi bắt nạt mạng, mạnh nhất là những niềm tin "gây hấn là bình thường" cùng sự tách rời đạo đức". Chữ mới: "…các liên hệ mạnh nhất với việc bị bắt nạt mạng là căng thẳng và ý nghĩ tự tử…" (vế bắt nạt mạng của người gây hấn giữ nguyên). Lý do: Tóm tắt nói liên hệ mạnh nhất của victimization là stress và ý nghĩ tự tử, không phải "đang bị bắt nạt ngoài đời"; không dùng từ "dự báo" (cắt ngang).'
- id: n33
  cau: 'Holt và cộng sự (2015): phân tích tổng hợp 47 nghiên cứu cắt ngang (38,3% từ Mỹ, 61,7% ngoài Mỹ), 280 cỡ hiệu ứng, về dính líu vào bắt nạt (nạn nhân, kẻ bắt nạt, vừa bắt nạt vừa bị bắt nạt) và ý nghĩ, hành vi tự tử.'
  loai: so-lieu
  nguon:
  - holt2015
  trich: We searched multiple online databases … to identify cross-sectional studies published through July 2013. … 47 studies (38.3% from the United States, 61.7% in non-US samples) met inclusion criteria. … A total of 280 effect sizes were extracted
  vi_tri: Holt (2015), tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…47 nghiên cứu (61,7% mẫu ngoài nước Mỹ)…" (mô tả mẫu). Chữ mới: "…47 nghiên cứu cắt ngang (38,3% từ Mỹ, 61,7% ngoài Mỹ)…". Lý do: Thêm "cắt ngang" theo tóm tắt (cần cho hạn chế nhân quả).'
- id: n34
  cau: Mọi vai trò dính líu vào bắt nạt đều liên quan đến nguy cơ cao hơn của ý nghĩ và hành vi tự tử, tỉ số chênh từ 2,12 đến 4,02.
  loai: so-lieu
  nguon:
  - holt2015
  trich: each of the predictors were associated with risk for suicidal ideation and behavior (range, 2.12 [95% confidence interval (CI), 1.67-2.69] to 4.02 [95% CI, 2.39-6.76])
  vi_tri: Holt (2015), tóm tắt, Results
  ket_qua: da-sua
  ghi_chu: 'Có dị biệt đáng kể giữa các nghiên cứu (tóm tắt). Chữ cũ: "…trong đó nhóm vừa bắt nạt vừa bị bắt nạt (bully-victim) có nguy cơ cao nhất." Chữ mới: (bỏ vế "bully-victim có nguy cơ cao nhất") Lý do: Tóm tắt không nói nhóm nào cao nhất.'
- id: n35
  cau: 'van Geel và cộng sự (2014): bị bạn bè ức hiếp liên quan đến ý nghĩ tự tử (OR 2,23) và hành vi tự tử (OR 2,55); bắt nạt mạng liên quan đến ý nghĩ tự tử mạnh hơn bắt nạt truyền thống.'
  loai: so-lieu
  nguon:
  - vangeel2014
  trich: Peer victimization was found to be related to both suicidal ideation (odds ratio, 2.23 [95% CI, 2.10-2.37]) and suicide attempts (2.55 [1.95 -3.34]) … Cyberbullying was more strongly related to suicidal ideation compared with traditional bullying.
  vi_tri: van Geel (2014), tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…ý nghĩ tự tử cao gấp khoảng 2,2 lần và hành vi tự tử gấp khoảng 2,5 lần — và liên hệ giữa bắt nạt mạng với ý nghĩ tự tử (OR = 3,1) còn mạnh hơn có ý nghĩa thống kê so với bắt nạt truyền thống (OR = 2,2)." Chữ mới: "…OR 2,23… OR 2,55… bắt nạt mạng liên quan đến ý nghĩ tự tử mạnh hơn bắt nạt truyền thống". Lý do: OR 3,1 và 2,2 cho hai dạng không có trong tóm tắt; "cao gấp 2,2 lần" diễn giải sai OR thành nguy cơ.'
- id: n36
  cau: Các nghiên cứu được tổng hợp là cắt ngang nên không cho biết chiều nhân quả; phần lớn học sinh bị bắt nạt không đi đến bước đường cùng; bắt nạt không phải "chuyện trẻ con".
  loai: phat-hien
  nguon:
  - holt2015
  - ttofi-dep2011
  trich: We searched … to identify cross-sectional studies … (Holt); Although causal inferences are tentative … (Ttofi 2011)
  vi_tri: Holt (2015), tóm tắt; Ttofi (2011), tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: '"Phần lớn học sinh… không đi đến bước đường cùng" là suy ra từ cỡ hiệu ứng (OR không phải xác suất tuyệt đối), nguồn không nêu tỉ lệ trực tiếp. Chữ cũ: "Đây là mối liên hệ tương quan, không phải "bị bắt nạt thì sẽ..."." Chữ mới: "Đây là mối liên hệ… Các nghiên cứu được tổng hợp là cắt ngang nên không cho biết chiều nhân quả…" Lý do: Thêm lý do theo nguồn.'
- id: n37
  cau: Nếu bị bắt nạt kéo dài và quá sức chịu đựng, hãy nói với người lớn tin cậy hoặc tìm người có chuyên môn; xin giúp đỡ là dấu hiệu của sức mạnh. Nếu nghĩ đến việc tự làm hại mình, hãy nói ngay với người có chuyên môn; xem Hỗ trợ.
  loai: loi-khuyen
  nguon:
  - ttofi-dep2011
  trich: High quality effective anti-bullying programmes could be viewed as an early form of public health promotion.
  vi_tri: Ttofi (2011), tóm tắt (chỉ làm cơ sở chung)
  ket_qua: da-sua
  ghi_chu: 'Lời dẫn an toàn theo yêu cầu của lời giao (chỉ nói nên tìm người có chuyên môn và dẫn Hỗ trợ), không phải nhận định khoa học; không có nguồn nghiên cứu riêng. Nội dung không có chi tiết về cách tự hại. Chữ cũ: "…hãy nói ra với một người lớn mà bạn tin tưởng — cha mẹ, thầy cô — hoặc tìm đến dịch vụ hỗ trợ tâm lý… Nếu bạn hoặc người thân đang nghĩ đến việc tự làm hại mình, hãy gọi 115." Chữ mới: "…hoặc tìm người có chuyên môn… Nếu bạn hoặc người thân đang nghĩ đến việc tự làm hại mình, hãy nói ngay với người có chuyên môn; xem [Hỗ trợ](/psyche/ho-tro/) để biết nơi liên hệ." Lý do: Theo lời giao: dẫn Hỗ trợ thay vì chỉ một số điện thoại không kiểm ở trang này.'
- id: n38
  cau: 'Liên kết [Hỗ trợ](/psyche/ho-tro/) (ở mục Holt, áp dụng #3 và #4) trỏ tới trang Hỗ trợ của site.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm: src/content/docs/ho-tro/index.md và ho-tro/index trong src/data/trang.yml.'
- id: n39
  cau: 'Trần và cộng sự (2024): nghiên cứu dọc ba năm (2018–2021) trên học sinh của 4 trường trung học ở thành phố Huế; 611 em được mời, 341 em có đủ dữ liệu ở cả hai đợt; các em học lớp 6 lúc đầu và lớp 9 lúc cuối; dùng thang ESSA.'
  loai: so-lieu
  nguon:
  - tran2024
  - sun2011
  trich: A three-year longitudinal study was conducted using a self-reported questionnaire with 611 students from four secondary schools in Hue City, Vietnam. … At the four schools, prior to conducting the baseline survey, 611 students were invited … the records of 341 students were used in the analysis.
  vi_tri: Tran (2024), Abstract và Methods (Participants)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…trên 611 học sinh của 4 trường trung học… Có 341 em hoàn thành cả hai đợt khảo sát." và "ESSA… xây dựng và kiểm định trên học sinh Trung Quốc rồi kiểm định lại trên học sinh TP. Hồ Chí Minh". Chữ mới: "611 em được mời, 341 em có đủ dữ liệu ở cả hai đợt (lúc đầu học lớp 6, cuối là lớp 9)… ESSA, xây dựng và kiểm định trên học sinh Trung Quốc; Sun và cộng sự, 2011". Lý do: 611 là số được mời (517 và 479 tham gia hai đợt; 341 phân tích); bỏ "kiểm định lại trên học sinh TP. Hồ Chí Minh" (bài Tran nêu một kiểm định ESSA ở Việt Nam không rõ địa điểm; chưa mở).'
- id: n40
  cau: 'ESSA có năm khía cạnh: áp lực từ việc học, khối lượng bài vở, lo lắng về điểm số, kỳ vọng vào bản thân, cảm giác chán nản; xây dựng và kiểm định trên hơn 2.000 thanh thiếu niên Trung Quốc.'
  loai: cong-cu
  nguon:
  - sun2011
  trich: 'The final 16-item ESSA contains five latent variables: Pressure from study, Workload, Worry about grades, Self-expectation, and Despondency … more than 2,000 Chinese adolescents'
  vi_tri: Sun (2011), tóm tắt
  ket_qua: dung
- id: n41
  cau: Điểm stress học tập trung bình của 341 em tăng từ 46,4 (2018) lên 53,5 (2021).
  loai: so-lieu
  nguon:
  - tran2024
  trich: The mean ESSA score of 341 students increased from 46.4 ± 7.6 (mean ± SD) to 53.5 ± 10.8, from 2018 to 2021.
  vi_tri: Tran (2024), Abstract; Bảng điểm ESSA
  ket_qua: dung
- id: n42
  cau: 'Các yếu tố đo ở đợt đầu gắn với stress cao hơn ở đợt sau: là nữ, điểm thấp hơn, đi học thêm, nhiều anh chị em hơn, cha có học vấn cao hơn; các yếu tố lối sống không liên quan.'
  loai: phat-hien
  nguon:
  - tran2024
  trich: the number of siblings, higher father’s educational attainment level, female gender, lower academic scores, and attending extra classes were associated with overall academic stress. In contrast, no associations were observed between the variables of lifestyle, parental concentration, and parental acceptance and overall academic stress.
  vi_tri: Tran (2024), Abstract (Results)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Các yếu tố gắn với stress cao hơn gồm: là nữ, điểm số thấp hơn, đi học thêm, đông anh chị em, và cha có trình độ học vấn cao hơn." Chữ mới: Danh sách như cũ, thêm "đo ở đợt đầu… ở đợt sau" và "các yếu tố lối sống không liên quan". Lý do: Nêu rõ thiết kế (yếu tố đầu kỳ liên quan stress cuối kỳ) và kết quả âm tính.'
- id: n43
  cau: Đợt khảo sát cuối diễn ra năm 2021 giữa đại dịch COVID-19 và các em đã lên lớp cuối cấp, nên mức tăng stress không chỉ do một nguyên nhân; việc đi học thêm gắn với stress cao hơn là liên hệ quan sát.
  loai: phat-hien
  nguon:
  - tran2024
  trich: the timing of the follow-up survey, which was conducted in 2021 during the COVID-19 pandemic when restrictions on daily life were significant in Vietnam … baseline survey was conducted when the students were in the first grade of secondary school (the sixth grade). A follow-up survey was conducted three years later … the ninth grade.
  vi_tri: Tran (2024), Discussion
  ket_qua: dung
  ghi_chu: Câu mới thêm; "không chứng minh học thêm gây stress" là suy luận về thiết kế quan sát, được nguồn nói gián tiếp (tác giả viết "associated").
- id: n44
  cau: Theo các tác giả, đây là nghiên cứu dọc đầu tiên về stress học tập và các yếu tố liên quan ở học sinh trung học cơ sở Việt Nam.
  loai: lich-su
  nguon:
  - tran2024
  trich: To the best of our knowledge, this was the first longitudinal study on academic stress and its associated factors among Vietnamese subjects to focus on middle school students.
  vi_tri: Tran (2024), Discussion
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đây là một trong số ít nghiên cứu dọc về stress học tập trên học sinh Việt Nam được công bố quốc tế." Chữ mới: "Theo các tác giả, đây là nghiên cứu dọc đầu tiên… ở học sinh trung học cơ sở Việt Nam." Lý do: Theo chữ của tác giả, "to the best of our knowledge".'
- id: n45
  cau: 'Nhãn "Vững chắc": bắt nạt được định nghĩa bằng ba tiêu chí — cố ý gây hại, lặp lại theo thời gian, chênh lệch quyền lực.'
  loai: nhan
  nhan: vung-chac
  co_so:
  - holt2015
  - olweus2013
  ly_do: 'Là nhãn cho một định nghĩa, xét theo đồng thuận của văn bản chính thức (định nghĩa thống nhất của CDC, ba nét cốt lõi, theo Holt 2015) và của người đề xuất (Olweus), không theo phân tích tổng hợp. Nhãn không nói về tỉ lệ: Holt (2015) cho thấy chỉ ~1/4 nghiên cứu cố đo chênh lệch quyền lực.'
  nguon:
  - holt2015
  - olweus2013
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Định nghĩa của Olweus đã được giới nghiên cứu dùng thống nhất suốt hơn 40 năm và được UNESCO, CDC Mỹ cùng nhiều tổ chức khác chấp nhận." Chữ mới: "Ba tiêu chí này là nền của định nghĩa theo Olweus và của định nghĩa thống nhất của CDC… Nhãn nói về định nghĩa, không về tỉ lệ: nhiều nghiên cứu không đo đủ ba tiêu chí". Lý do: "Thống nhất suốt hơn 40 năm" bị Holt (2015) làm yếu (nhiều nghiên cứu không đo đủ ba tiêu chí); "UNESCO… chấp nhận" không kiểm được.'
- id: n46
  cau: 'Nhãn "Vững chắc": bị bắt nạt gắn liền với trầm cảm về sau và với ý nghĩ tự tử.'
  loai: nhan
  nhan: vung-chac
  co_so:
  - ttofi-dep2011
  - holt2015
  - vangeel2014
  - unnews2019
  ly_do: 'Nhiều tổng quan hệ thống và phân tích tổng hợp cùng chiều: trầm cảm về sau OR 1,99 (1,74 sau kiểm soát) trên 28 nghiên cứu dọc, theo dõi trung bình 6,9 năm (Ttofi 2011); ý nghĩ và hành vi tự tử OR 2,12–4,02 trên 47 nghiên cứu, 61,7% ngoài Mỹ (Holt 2015); OR 2,23 và 2,55 (van Geel 2014); UNESCO: vắng mặt gấp đôi. Đạt "Vững chắc" cho liên hệ (không phải nhân quả, xem khung "đang tranh cãi"). Hạn chế: Holt chỉ gồm nghiên cứu cắt ngang.'
  nguon:
  - ttofi-dep2011
  - holt2015
  - vangeel2014
  - unnews2019
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: Tiêu đề khung: "bị bắt nạt gắn liền với lo âu, trầm cảm và kết quả học tập kém hơn" và "đã được tái hiện nhất quán qua hàng trăm nghiên cứu". Chữ mới: "bị bắt nạt gắn liền với trầm cảm về sau và với ý nghĩ tự tử" kèm OR và nguồn. Lý do: Không mở được nguồn cho "lo âu" và "kết quả học tập kém hơn", và "hàng trăm nghiên cứu" không kiểm được.'
- id: n47
  cau: 'Nhãn "Khá vững": chương trình chống bắt nạt ở trường học có hiệu quả ở mức vừa phải.'
  loai: nhan
  nhan: kha-vung
  co_so:
  - ttofi2011
  - gaffney2019
  - gaffney2021
  - kiva2011
  - olweus-limber2010
  ly_do: 'Hai phân tích tổng hợp cách nhau một thập niên cùng chiều: giảm bắt nạt ~20% và nạn nhân ~15–20% (Ttofi 2011; Gaffney 2019, 100 đánh giá); KiVa có thử nghiệm ngẫu nhiên nhóm (78 trường). Nhưng khác biệt giữa các nghiên cứu rất lớn, nghi thiên lệch trong thành phần (hai phân tích về thành phần không thống nhất), và OBPP ở Mỹ không đồng nhất; chưa có tái lập lớn đăng ký trước. Nên Khá vững.'
  nguon:
  - ttofi2011
  - gaffney2019
  - gaffney2021
  - kiva2011
  - olweus-limber2010
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Hai phân tích tổng hợp cách nhau một thập niên đều kết luận các chương trình làm giảm hành vi bắt nạt khoảng 15–20%. Hiệu quả… phụ thuộc vào việc có họp phụ huynh, kỷ luật vững chắc, giám sát sân chơi và triển khai đủ chuyên sâu hay không." Chữ mới: "…khoảng 20% và nạn nhân khoảng 15–20%… thành phần nào quan trọng thì các phân tích chưa hoàn toàn thống nhất (Ttofi và Farrington, 2011; Gaffney và cộng sự, 2021), và các đánh giá OBPP ở Mỹ không đồng nhất". Lý do: Số liệu đúng hơn (bắt nạt ~20%, nạn nhân 15–20%) và nêu sự không thống nhất về thành phần.'
- id: n48
  cau: 'Nhãn "Khá vững": bắt nạt trên mạng ít phổ biến hơn bắt nạt trực tiếp, nhưng hai dạng chồng lấp lớn.'
  loai: nhan
  nhan: kha-vung
  co_so:
  - modecki2014
  ly_do: Một phân tích tổng hợp 80 nghiên cứu (Modecki 2014) cùng chiều; chưa mở được phân tích tổng hợp thứ hai; cách đo làm tỉ lệ khác nhau nhiều. Chỉ đọc tóm tắt. Khá vững theo mục 4 (một tổng hợp, kết quả phụ thuộc cách đo).
  nguon:
  - modecki2014
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Tỉ lệ 35% so với 15% trong phân tích của Modecki… là con số trung bình gộp — tỉ lệ cụ thể dao động mạnh giữa các nghiên cứu tùy cách đo." Chữ mới: "…bắt nạt truyền thống phổ biến gấp đôi bắt nạt trên mạng… cách đo khác nhau làm tỉ lệ khác nhau." Lý do: Bỏ 35%/15% (không kiểm được).'
- id: n49
  cau: 'Nhãn "Đang tranh cãi": bắt nạt "gây ra" tự tử ở mức độ nào.'
  loai: nhan
  nhan: tranh-cai
  co_so:
  - holt2015
  - vangeel2014
  - ttofi-dep2011
  ly_do: Liên hệ mạnh (OR 2–4) và nhất quán, nhưng Holt (2015) chỉ gồm nghiên cứu cắt ngang, van Geel (2014) tổng hợp cả nghiên cứu cắt ngang, và tác giả của tổng hợp về trầm cảm viết "causal inferences are tentative"; chưa có bằng chứng nhân quả đủ mạnh. Nhãn tranh cãi cho phần nhân quả; liên hệ thì Vững chắc (n46).
  nguon:
  - holt2015
  - vangeel2014
  - ttofi-dep2011
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Các phân tích tổng hợp đều là nghiên cứu cắt ngang… cũng chưa tách hết vai trò của các yếu tố trung gian như trầm cảm có sẵn. Giới nghiên cứu đồng thuận rằng bắt nạt là một yếu tố nguy cơ nghiêm trọng…" Chữ mới: "Phân tích của Holt và cộng sự (2015) chỉ gồm các nghiên cứu cắt ngang… tác giả của tổng hợp về trầm cảm cũng nói các suy luận nhân quả chỉ là tạm thời… Bắt nạt là một yếu tố nguy cơ đáng nghiêm túc". Lý do: "Đều là cắt ngang" và "đồng thuận" không kiểm được cho cả các tổng hợp; "trầm cảm có sẵn" không có trong nguồn.'
- id: n50
  cau: 'Nhãn "Đã bị bác bỏ": "trừng phạt thật nặng là cách tốt nhất để xóa bắt nạt".'
  loai: nhan
  nhan: bac-bo
  co_so:
  - ttofi2011
  - apa2008
  ly_do: 'Ttofi & Farrington (2011): các chương trình có "firm disciplinary methods" hiệu quả hơn (kỷ luật vững chắc, không phải trừng phạt nặng); tổng quan của APA (2008) về chính sách "không khoan nhượng" thấy rất ít dữ liệu kiểm trực tiếp các giả định và dữ liệu có sẵn có xu hướng mâu thuẫn với chúng. Là nhãn xét theo đồng thuận của các tổng quan này, không phải một phân tích tổng hợp riêng cho bắt nạt; APA nói về kỷ luật học đường nói chung, không riêng bắt nạt.'
  nguon:
  - ttofi2011
  - apa2008
  ket_qua: da-sua
  ghi_chu: 'Chỗ khó: "trừng phạt nặng" ≠ "firm discipline" ≠ "zero tolerance". Lượt 2 và review cân nhắc có nên hạ thành "chưa đủ bằng chứng". Chữ cũ: "Bằng chứng ủng hộ kỷ luật vững chắc, nhất quán và không thù địch — chứ không phải các biện pháp loại trừ kiểu "đuổi học ngay lập tức"… Đáng chú ý, phân tích của Ttofi và Farrington còn phát hiện các chương trình ép nạn nhân và kẻ bắt nạt "làm việc với nhau" theo nhóm bạn lại liên quan đến tăng tỉ lệ nạn nhân." Chữ mới: "Bằng chứng ủng hộ kỷ luật vững chắc (Ttofi và Farrington, 2011…). Còn các chính sách "không khoan nhượng"… tổng quan của APA (2008)…". Lý do: "Nhất quán và không thù địch" không có trong tóm tắt; vế "ép… làm việc với nhau" không đúng với nguồn (xem n29).'
- id: n51
  cau: 'Nhãn "Đã bị bác bỏ": "bắt nạt chỉ là chuyện trẻ con, lớn lên tự hết": từng bị bắt nạt dự báo trầm cảm về sau (OR ≈ 2,0; ≈ 1,7 sau kiểm soát; theo dõi trung bình 6,9 năm), từng bắt nạt dự báo phạm tội về sau (OR hiệu chỉnh ≈ 1,8).'
  loai: nhan
  nhan: bac-bo
  co_so:
  - ttofi-dep2011
  - ttofi-off2011
  - olweus2013
  ly_do: Hai tổng quan hệ thống các nghiên cứu dọc (28 nghiên cứu mỗi tổng quan) cùng chiều và Olweus (2013) kết luận bắt nạt "không chỉ là vấn đề vô hại và thoáng qua". Nhãn xét theo các tổng quan hệ thống đã mở; đây là liên hệ dự báo, các tác giả viết suy luận nhân quả là tạm thời.
  nguon:
  - ttofi-dep2011
  - ttofi-off2011
  - olweus2013
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…từng bắt nạt người khác ở trường là yếu tố dự báo phạm tội sau này (tỉ số chênh hiệu chỉnh khoảng 1,9)… (Ttofi, Farrington, Lösel và Loeber, 2011; Ttofi, Farrington và Lösel, 2012)". Chữ mới: "…tỉ số chênh hiệu chỉnh khoảng 1,8; Ttofi và cộng sự, 2011… Olweus (2013) cũng kết luận bắt nạt không chỉ là vấn đề vô hại và thoáng qua". Lý do: OR hiệu chỉnh là 1,82 (đúng 1,8, không phải 1,9); bài Ttofi 2012 (bạo lực) không mở được nên bỏ khỏi trang và danh sách nguồn.'
- id: n52
  cau: 'Từng bị bắt nạt dự báo trầm cảm sau trung bình 6,9 năm theo dõi, tỉ số chênh 1,99 (1,74 sau khi kiểm soát tới 20 yếu tố nguy cơ tuổi thơ); từng bắt nạt dự báo phạm tội: OR 2,50, hiệu chỉnh 1,82 (theo dõi tới 11 năm).'
  loai: so-lieu
  nguon:
  - ttofi-dep2011
  - ttofi-off2011
  trich: The probability of being depressed up to 36 years later (mean follow-up period of 6.9 years) was much higher … (odds ratio (OR)=1.99 …). … OR=1.74 (Ttofi dep); … OR = 2.50; … OR = 1.82 (Ttofi off)
  vi_tri: Ttofi (2011), hai tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…dự báo trầm cảm sau trung bình gần 7 năm (tỉ số chênh khoảng 2,0; vẫn khoảng 1,7…)". Chữ mới: Giữ "khoảng 2,0 / 1,7", thêm 6,9 năm; đổi phạm tội 1,9 → 1,8. Lý do: Số liệu đúng theo tóm tắt.'
- id: n53
  cau: Salmivalli và cộng sự (1996) xem bắt nạt như một quá trình nhóm và xét các vai trò tham gia của học sinh trong mối liên hệ với địa vị xã hội trong nhóm.
  loai: lich-su
  nguon:
  - salmivalli1996
  trich: 'Bullying as a group process: Participant roles and their relations to social status within the group'
  vi_tri: Tiêu đề bài (Crossref)
  ket_qua: da-sua
  ghi_chu: 'Chỗ chưa mở: chỉ đọc được tiêu đề; sáu vai trò (nạn nhân, kẻ bắt nạt, người cổ vũ, người tiếp tay, người bảo vệ, người ngoài cuộc) kiểm qua kết quả tìm kiếm, không qua trang đã mở nên trang chỉ nói "những người tiếp tay, cổ vũ, đứng ngoài cuộc và bảo vệ" như gợi ý của cách nhìn này. Lượt 2 nên tìm toàn văn. Chữ cũ: "Salmivalli… chỉ ra rằng… ngoài kẻ bắt nạt và nạn nhân còn có các vai trò khác: người tiếp tay, người cổ vũ (cười, reo hò — vô tình "thưởng"), người ngoài cuộc (đứng nhìn, im lặng — sự im lặng cũng là một thông điệp), người bảo vệ. Kẻ bắt nạt thường có địa vị xã hội cao… (Salmivalli và cộng sự, 1996)." Chữ mới: "Salmivalli… xem bắt nạt như một quá trình nhóm và xét các vai trò tham gia… Cách nhìn này gợi ý rằng ngoài kẻ bắt nạt và nạn nhân còn có những người tiếp tay, cổ vũ, đứng ngoài cuộc và bảo vệ." Lý do: Bỏ "địa vị xã hội cao" và các mô tả vai trò (không mở được nguồn nói điều đó).'
- id: n54
  cau: Chương trình KiVa của Phần Lan nhấn mạnh vai trò của người chứng kiến.
  loai: dinh-nghia
  nguon:
  - frcha2026
  trich: Another widely implemented intervention is the KiVa program, developed in Finland. This program emphasizes the role of bystanders in bullying situations
  vi_tri: Marano (2026), mục 6.1
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…các chương trình hiệu quả như KiVa của Phần Lan nhắm vào người chứng kiến: dạy cả lớp cách không cổ vũ và dám bảo vệ bạn." Chữ mới: "…chương trình KiVa của Phần Lan nhấn mạnh vai trò của người chứng kiến (theo một tổng quan năm 2026)." Lý do: Bỏ mô tả nội dung huấn luyện (không kiểm được).'
- id: n55
  cau: Thử nghiệm ngẫu nhiên ở 78 trường, 8.237 học sinh lớp 4–6, sau 9 tháng KiVa có tác động tốt lên 7 trong 11 biến, gồm bắt nạt và bị bắt nạt do học sinh tự báo cáo.
  loai: phat-hien
  nguon:
  - kiva2011
  trich: Altogether, 78 schools were randomly assigned to intervention (39 schools, 4,207 students) and control conditions (39 schools, 4,030 students). … after 9 months of implementation, the intervention had consistent beneficial effects on 7 of the 11 dependent variables, including self- and peer-reported victimization and self-reported bullying.
  vi_tri: Kärnä (2011), tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…đánh giá quy mô lớn ở Phần Lan (78 trường, hơn 8.000 học sinh) cho thấy nó giảm được cả tỉ lệ bắt nạt lẫn nạn nhân (Kärnä và cộng sự, 2011)." Chữ mới: "…một thử nghiệm ngẫu nhiên ở 78 trường với hơn 8.000 học sinh lớp 4–6 thấy sau 9 tháng chương trình có tác động tốt lên nhiều chỉ số, kể cả bắt nạt và bị bắt nạt do học sinh tự báo cáo". Lý do: Nêu thiết kế ngẫu nhiên, lớp 4–6, 9 tháng, 7/11 biến.'
- id: n56
  cau: 'Nhãn "Khá vững": người chứng kiến là "chìa khóa" bị bỏ quên (KiVa; sự tham gia không chính thức của bạn bè gắn với hiệu quả lớn hơn).'
  loai: nhan
  nhan: kha-vung
  co_so:
  - kiva2011
  - gaffney2021
  - frcha2026
  ly_do: Một thử nghiệm ngẫu nhiên nhóm của KiVa (78 trường) và một phân tích tổng hợp thành phần (Gaffney 2021) cùng chiều; chưa có tái lập lớn hay phân tích tổng hợp riêng cho vai trò người chứng kiến, và Ttofi 2011 từng thấy "work with peers" liên quan tăng nạn nhân (n29). Khá vững.
  nguon:
  - kiva2011
  - gaffney2021
  - frcha2026
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: Tiêu đề mục 2 (":nhan[kha-vung]") và "Đa số vụ bắt nạt diễn ra trước mặt người khác. Bạn không cần lao vào can ngăn một cách nguy hiểm: chỉ cần không cười theo, không chia sẻ clip bắt nạt, và sau đó đến bên nạn nhân… cũng đã phá vỡ "phần thưởng xã hội" nuôi dưỡng kẻ bắt nạt. Các chương trình như KiVa thành công chính nhờ huấn luyện cả lớp làm điều này". Chữ mới: "Chương trình KiVa… nhấn mạnh vai trò của người chứng kiến, và một thử nghiệm ngẫu nhiên… Những việc như không cười theo… là gợi ý thực hành hợp lý theo hướng này; chúng tôi không có nghiên cứu nào đo riêng từng hành vi ấy." Lý do: Bỏ "đa số vụ bắt nạt diễn ra trước mặt người khác" và "phần thưởng xã hội" (không kiểm được); KiVa nhắm cả lớp nhưng không có nguồn nói "thành công chính nhờ" điều đó.'
- id: n57
  cau: Ttofi và Farrington (2011) thấy họp phụ huynh đi cùng hiệu quả lớn hơn, và Gaffney và cộng sự (2021) thấy thông tin cho phụ huynh gắn với hiệu quả lớn hơn.
  loai: phat-hien
  nguon:
  - ttofi2011
  - gaffney2021
  trich: More intensive programs were more effective, as were those including parent meetings (Ttofi); information for parents were associated with larger effect sizes (Gaffney)
  vi_tri: Ttofi (2011), tóm tắt; Gaffney (2021), tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Phân tích của Ttofi và Farrington chỉ ra họp phụ huynh là một trong những thành phần hiệu quả nhất." Chữ mới: "Ttofi và Farrington (2011) thấy họp phụ huynh đi cùng hiệu quả lớn hơn, và Gaffney… thông tin cho phụ huynh gắn với hiệu quả lớn hơn." Lý do: Tóm tắt không xếp "một trong hiệu quả nhất".'
- id: n58
  cau: 'Nhãn "Khá vững": cha mẹ và nhà trường "cùng một phe" (thành phần phụ huynh gắn với hiệu quả lớn hơn).'
  loai: nhan
  nhan: kha-vung
  co_so:
  - ttofi2011
  - gaffney2021
  ly_do: Hai phân tích tổng hợp thành phần cùng chiều (Ttofi 2011; Gaffney 2021), nhưng đó là liên hệ giữa thành phần và kích thước hiệu quả trong các nghiên cứu có sẵn, không phải thí nghiệm riêng, và hai phân tích mã hóa thành phần khác nhau. Khá vững.
  nguon:
  - ttofi2011
  - gaffney2021
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: Tiêu đề mục 3 (":nhan[kha-vung]") giữ nguyên chip. Chữ mới: Giữ chip; nội dung mục viết lại theo n57 và n59. Lý do: Nhãn nay có co_so và lý do.'
- id: n59
  cau: 'Các gợi ý cụ thể cho cha mẹ (lắng nghe con, ghi lại diễn biến, trao đổi với giáo viên chủ nhiệm; với bắt nạt mạng: lưu bằng chứng, chặn, báo cáo nền tảng, nói với người lớn tin cậy) là thông lệ thực hành, chưa phải kết quả của nghiên cứu đã kiểm.'
  loai: loi-khuyen
  nguon:
  - gaffney2021
  trich: information for parents were associated with larger effect sizes for school-bullying victimization outcomes
  vi_tri: Gaffney (2021), tóm tắt (chỉ làm cơ sở chung)
  ket_qua: da-lam-mem
  ghi_chu: 'Các bước cụ thể không có nguồn đã mở; đã ghi rõ trên trang. Chữ cũ: "…cha mẹ cần tin lời con trước, ghi lại diễn biến… và làm việc với giáo viên chủ nhiệm thay vì xông vào "xử" phụ huynh nhà kia — điều này thường khiến con bị trả đũa nặng hơn. Với bắt nạt trên mạng: lưu bằng chứng… chặn… báo cáo…". Chữ mới: "Các gợi ý cụ thể dưới đây là thông lệ thực hành, chưa phải kết quả của nghiên cứu mà chúng tôi đã kiểm: … cha mẹ có thể lắng nghe con trước, ghi lại diễn biến… trao đổi với giáo viên chủ nhiệm." Lý do: Bỏ "thường khiến con bị trả đũa nặng hơn" (không kiểm được); "cần" → "có thể".'
- id: n60
  cau: Nếu bị bắt nạt kéo dài làm em lo lắng nhiều hay thay đổi rõ về ăn, ngủ, đi học, hãy tìm người có chuyên môn; xem Hỗ trợ.
  loai: loi-khuyen
  nguon:
  - holt2015
  trich: Future research should address mental health implications of bullying involvement to prevent suicidal ideation/behavior.
  vi_tri: Holt (2015), tóm tắt (chỉ làm cơ sở chung)
  ket_qua: da-sua
  ghi_chu: 'Lời dẫn an toàn theo lời giao, không phải chẩn đoán. Chữ cũ: (không có) Chữ mới: "Nếu bị bắt nạt kéo dài làm em lo lắng nhiều hay thay đổi rõ về ăn, ngủ, đi học, hãy tìm người có chuyên môn; xem [Hỗ trợ]". Lý do: Theo lời giao cho chủ đề bắt nạt kéo dài.'
- id: n61
  cau: 'Kowalski và cộng sự (2014): niềm tin gây hấn là bình thường và tách rời đạo đức nằm trong các liên hệ mạnh nhất với việc thực hiện bắt nạt mạng; các cách nói "chỉ đùa thôi", "nó đáng bị thế" là ví dụ minh họa của chúng tôi.'
  loai: phat-hien
  nguon:
  - kowalski2014
  trich: among the strongest associations with cyberbullying perpetration were normative beliefs about aggression and moral disengagement
  vi_tri: Kowalski (2014), tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Để gây hại cho người khác mà không cắn rứt, con người có một bộ "thủ thuật" tâm lý: đổ lỗi cho nạn nhân…, gọi hành vi bằng cái tên nhẹ nhàng hơn…, hay phân tán trách nhiệm… Nhận diện được các thủ thuật này… là bước đầu để vô hiệu hóa chúng." Chữ mới: "…niềm tin rằng gây hấn là bình thường và sự tách rời đạo đức… nằm trong các liên hệ mạnh nhất… Các cách nói "chỉ đùa thôi"… là ví dụ minh họa của chúng tôi". Lý do: Danh sách ba "thủ thuật" và "bước đầu để vô hiệu hóa" không có trong nguồn đã mở; giữ phần Kowalski xác nhận.'
- id: n62
  cau: 'Gaffney và cộng sự (2021): các thành phần như cách tiếp cận toàn trường, chính sách chống bắt nạt, nội quy lớp học và thông tin cho phụ huynh gắn với hiệu quả lớn hơn; đây là liên hệ giữa thành phần và hiệu quả, không phải thí nghiệm riêng.'
  loai: phat-hien
  nguon:
  - gaffney2021
  trich: the presence of a number of intervention components (e.g., whole-school approach, anti-bullying policies, classroom rules, information for parents, …) were significantly associated with larger effect sizes
  vi_tri: Gaffney (2021), tóm tắt
  ket_qua: dung
  ghi_chu: Bullet "Chương trình toàn trường" thay thế bullet "Mô hình Olweus" (n24).
- id: n63
  cau: Lo âu về thi cử liên quan âm đến thành tích học tập (238 nghiên cứu; liên hệ nhỏ đến vừa, rõ nhất ở cấp THCS).
  loai: phat-hien
  nguon:
  - vonderembse2018
  trich: Results of 238 studies from 1988 to the present … test anxiety was significantly and negatively related to a wide range of educational performance outcomes … Results were most pronounced at the middle grades level. … The magnitude … was in the small to moderate range.
  vi_tri: von der Embse (2018), tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Câu mới thêm; thay vế "một chút căng thẳng giúp tập trung" (n65). Chữ cũ: (không có; thay cho đoạn "Ở các nền giáo dục chịu ảnh hưởng văn hóa Nho giáo, điểm số… thể diện của cả gia đình… Phần Lan chứng minh có thể vừa học giỏi vừa ít lo âu, nếu văn hóa học đường ít so sánh và cạnh tranh hơn") Chữ mới: "Lo âu về thi cử liên quan âm đến thành tích học tập (von der Embse và cộng sự, 2018, 238 nghiên cứu…); PISA 2015 cho thấy các nước có động lực thành tích cao cũng thường có nhiều học sinh lo âu…; Trần và cộng sự (2024) bàn luận rằng cha mẹ quá kiểm soát…" Lý do: Bỏ "thể diện gia đình/Nho giáo" và "Phần Lan… nếu văn hóa ít so sánh" (không kiểm được).'
- id: n64
  cau: Trần và cộng sự (2024) bàn luận rằng cha mẹ quá kiểm soát có thể để lại cho trẻ ít thời gian thư giãn và ngủ; đó là phần bàn luận, không phải kết quả đo.
  loai: phat-hien
  nguon:
  - tran2024
  trich: students with overbearing parents often have limited time for relaxation, play, and casual interactions with neighbors and are sleep deprived. This leads to heightened anxiety, particularly when facing intense pressure from examinations.
  vi_tri: Tran (2024), Discussion
  ket_qua: dung
- id: n65
  cau: 'Nhãn "Khá vững": lo âu về thi cử đi cùng thành tích thấp hơn, ở mức liên hệ nhỏ đến vừa; chúng tôi không có nguồn cho việc căng thẳng vừa phải có lợi cho thi cử.'
  loai: nhan
  nhan: kha-vung
  co_so:
  - vonderembse2018
  - oecd2017
  ly_do: Một phân tích tổng hợp 30 năm (238 nghiên cứu) và PISA 2015 (lo âu liên quan âm với điểm khoa học, toán, đọc) cùng chiều; liên hệ nhỏ đến vừa, chủ yếu cắt ngang, chưa có tái lập lớn đăng ký trước. Khá vững. Giả thuyết Yerkes–Dodson (căng thẳng vừa phải có lợi) không được bài này kiểm hay nêu, nên trang không khẳng định.
  nguon:
  - vonderembse2018
  - oecd2017
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: Tiêu đề mục 4 "Quản lý áp lực thi cử: phân biệt "lo âu vừa phải" với "lo âu độc hại"" và "Một chút căng thẳng trước kỳ thi là bình thường và thậm chí giúp tập trung." Chữ mới: Tiêu đề "Áp lực thi cử: khi nào cần để ý" (giữ id cũ); "Chúng tôi không có nguồn cho việc một mức căng thẳng "vừa phải" có lợi cho thi cử." Lý do: Không có nguồn đã mở cho Yerkes–Dodson trong bối cảnh thi cử; von der Embse thấy liên hệ âm.'
- id: n66
  cau: Nếu căng thẳng về thi cử kéo dài và ảnh hưởng đến giấc ngủ, ăn uống, việc đến trường, hay em nói những điều cho thấy mất hy vọng, hãy nói với người lớn tin cậy và tìm người có chuyên môn; xem Hỗ trợ.
  loai: loi-khuyen
  nguon:
  - vonderembse2018
  trich: Implications for researchers and educators are discussed including the use of evidence-based assessment and interventions when warranted.
  vi_tri: von der Embse (2018), tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Lời dẫn an toàn theo lời giao, không phải chẩn đoán; không liệt kê dấu hiệu lâm sàng. Chữ cũ: "…khi lo âu đi kèm mất ngủ kéo dài, đau đầu/đau bụng trước mỗi kỳ thi, né tránh đến trường, hay suy nghĩ "thi trượt thì đời mình coi như bỏ" — đó là dấu hiệu cần hỗ trợ, không phải "cố thêm chút nữa"." Chữ mới: "…kéo dài và ảnh hưởng đến giấc ngủ, ăn uống, việc đến trường, hay em nói những điều cho thấy mất hy vọng, đó là lúc cần nói với người lớn tin cậy và tìm người có chuyên môn; xem Hỗ trợ." Lý do: Bỏ danh sách triệu chứng giống dấu hiệu lâm sàng; chỉ dẫn tới người có chuyên môn.'
- id: n67
  cau: Cha mẹ có thể cân nhắc xem thêm giờ học có thực sự giúp con hay không; nghiên cứu ở Huế thấy đi học thêm gắn với stress cao hơn (liên hệ quan sát).
  loai: loi-khuyen
  nguon:
  - tran2024
  trich: attending extra classes were associated with overall academic stress.
  vi_tri: Tran (2024), Abstract
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "…cha mẹ nên cân nhắc: thêm giờ học có thực sự giúp con, hay chỉ đổi điểm số lấy sức khỏe tinh thần?" Chữ mới: "…cha mẹ có thể cân nhắc xem thêm giờ học có thực sự giúp con hay không, nhưng đó là liên hệ quan sát." Lý do: Bỏ vế "đổi điểm số lấy sức khỏe tinh thần" (khẳng định nhân quả không có nguồn).'
- id: n68
  cau: 'Nhãn "Vững chắc": nhận diện đúng bằng ba câu hỏi (chủ ý gây hại, lặp lại, chênh lệch quyền lực).'
  loai: nhan
  nhan: vung-chac
  co_so:
  - holt2015
  - olweus2013
  ly_do: 'Như n45: áp dụng định nghĩa theo đồng thuận của văn bản chính thức (CDC, theo Holt 2015) và Olweus; không phải công cụ chẩn đoán (trang nói rõ).'
  nguon:
  - holt2015
  - olweus2013
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Nếu cả ba đều "có", đó là bắt nạt — và cần can thiệp nghiêm túc, không phải "khuyên hai bên làm hòa" cho xong." Chữ mới: "…cần được nhà trường, gia đình xử lý nghiêm túc. Ba câu hỏi này là cách áp dụng định nghĩa nêu ở trên, không phải công cụ chẩn đoán." Lý do: Bỏ "không phải khuyên hai bên làm hòa" (không có nguồn).'
- id: n69
  cau: 'Nghiên cứu dọc ở Huế (Trần và cộng sự, 2024): học sinh đi học thêm có mức stress học tập cao hơn, và điểm stress trung bình của nhóm tăng từ 2018 đến 2021, giai đoạn có đại dịch và các em lên lớp cuối cấp.'
  loai: phat-hien
  nguon:
  - tran2024
  trich: attending extra classes were associated with overall academic stress … The mean ESSA score of 341 students increased
  vi_tri: Tran (2024), Abstract, Discussion
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Ở Việt Nam, một ngày của nhiều học sinh là: học chính khóa ở trường, rồi học thêm buổi tối, rồi làm bài tập đến khuya… Điều này không có nghĩa học thêm luôn xấu, nhưng đặt câu hỏi cho mỗi gia đình…" Chữ mới: "Học thêm và stress học tập… tăng từ 2018 đến 2021, một giai đoạn có đại dịch COVID-19 và các em lên lớp cuối cấp. Điều này không có nghĩa học thêm luôn xấu, nhưng đặt câu hỏi…" Lý do: Bỏ mô tả "một ngày của nhiều học sinh" (không có nguồn), thêm bối cảnh COVID.'
- id: n70
  cau: (Đã bỏ) Trong văn hóa chịu ảnh hưởng Nho giáo, điểm số là thể diện của cha mẹ; "con nhà người ta" khiến nhiều em cảm thấy mình là gánh nặng.
  loai: phat-hien
  ket_qua: da-bo
  ghi_chu: 'Không có nguồn đã mở. Chữ cũ: "Trong văn hóa chịu ảnh hưởng Nho giáo, điểm số không chỉ phản ánh năng lực của đứa trẻ mà còn là thể diện của cha mẹ — "con nhà người ta" trở thành thước đo khiến nhiều em cảm thấy mình là gánh nặng mỗi khi điểm kém." Chữ mới: (bỏ) Lý do: Không kiểm được.'
- id: n71
  cau: (Đã bỏ) Kỳ thi tốt nghiệp THPT gắn với tuyển sinh đại học ở Việt Nam mang tính định đoạt cao; Hàn Quốc có kỳ thi suneung cả nước điều chỉnh giờ bay; Singapore đứng đầu PISA 2015 về lo âu bài vở.
  loai: phat-hien
  ket_qua: da-bo
  ghi_chu: 'Không có nguồn đã mở; vế Singapore sai (xem n15). Chữ cũ: Đoạn "Kỳ thi "một cửa"…" (kỳ thi một buổi sáng quyết định lối rẽ; suneung; Singapore đứng đầu PISA về lo âu; "Điểm chung của các nền giáo dục Đông Á… động lực cao đi cùng lo âu rất cao"). Chữ mới: (thay bằng đoạn "So sánh quốc tế": Việt Nam không có số liệu PISA 2015 cho chỉ số này; động lực cao và lo âu đi cùng nhau ở cấp nước theo OECD). Lý do: Không kiểm được; vế Singapore sai.'
- id: n72
  cau: (Đã bỏ) Báo chí trong nước thường xuyên đưa tin về bạo lực học đường; clip tung lên mạng làm nạn nhân bị tổn thương hai lần; điều này khớp với phát hiện của Modecki.
  loai: phat-hien
  ket_qua: da-bo
  ghi_chu: 'Không có nguồn đã mở (tần suất đưa tin báo chí, thiệt hại hai lần). Chữ cũ: Đoạn "Bạo lực học đường trên báo chí Việt Nam…". Chữ mới: (bỏ) Lý do: Không kiểm được.'
- id: n73
  cau: (Đã bỏ) Giáo viên chủ nhiệm là người gần học sinh nhất và là người đầu tiên có thể nhận ra dấu hiệu; việc ép nạn nhân và kẻ bắt nạt "bắt tay làm hòa" trước lớp là kiểu "làm việc theo nhóm bạn" mà Ttofi và Farrington cảnh báo.
  loai: phat-hien
  ket_qua: da-bo
  ghi_chu: 'Không có nguồn đã mở; nối với phát hiện của Ttofi là suy diễn quá xa (xem n29). Chữ cũ: Đoạn "Vai trò của giáo viên chủ nhiệm…". Chữ mới: Thay bằng đoạn "Bắt nạt ở trường": khảo sát ẩn danh, xử lý từng vụ việc riêng, nội quy rõ ràng là thành phần mô tả của OBPP (n74); chưa tìm thấy nghiên cứu đã mở so sánh cách "ép hai bên bắt tay làm hòa". Lý do: Không kiểm được.'
- id: n74
  cau: Khảo sát ẩn danh định kỳ, xử lý từng vụ việc riêng với từng bên và nội quy rõ ràng nằm trong các thành phần được mô tả của OBPP.
  loai: dinh-nghia
  nguon:
  - jkacap2026
  trich: schoolwide, involving anonymous surveys … classroom-level, with … clear behavioral expectations; and … individual-level, targeting bullies and victims through counseling and parental involvement.
  vi_tri: Harsono & Febriyana (2026)
  ket_qua: da-sua
  ghi_chu: '"Chưa tìm thấy nghiên cứu đã mở so sánh cách ép bắt tay làm hòa" là kết quả tìm của chúng tôi (không phải khẳng định thời sự về Việt Nam): xem n75. Chữ cũ: "Cách làm có bằng chứng hơn: trường tổ chức khảo sát ẩn danh định kỳ (như Bảng hỏi Bắt nạt/Nạn nhân của Olweus)… xử lý từng vụ việc riêng với từng bên; và đặt nội quy rõ ràng, thực thi nhất quán." Chữ mới: "…khảo sát ẩn danh định kỳ là một phần của chương trình như OBPP; xử lý từng vụ việc riêng với từng bên và đặt nội quy rõ ràng cũng nằm trong các thành phần được mô tả của chương trình này." Lý do: "Có bằng chứng hơn" và "Bảng hỏi Olweus" không kiểm được; viết đúng mức mô tả của tổng quan.'
- id: n75
  cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào đã mở so sánh cách "ép hai bên bắt tay làm hòa" với các cách xử lý khác ở Việt Nam.
  loai: thoi-su
  het_han: '2028-11-01'
  nguon:
  - cantho2025
  - hovn2025
  ket_qua: da-sua
  ghi_chu: 'Lần tìm: Europe PMC 10/11/2026, truy vấn "(Vietnam OR Vietnamese) AND bullying AND (adolescents OR students)" (701 kết quả; các kết quả đầu là khảo sát cắt ngang, không phải so sánh cách xử lý). Tìm chưa kỹ (không dùng Google Scholar, không tìm tạp chí trong nước); lượt 2 và review nên tìm thêm. Chữ cũ: (không có) Chữ mới: Câu thời sự mới, có mốc và hạn, thay cho phê phán cách làm của giáo viên chủ nhiệm (n73). Lý do: Quy tắc câu "chưa tìm thấy": mốc, hạn, nguồn là lần tìm.'
- id: n76
  cau: 'Khảo sát cắt ngang công bố năm 2025 trên 1.054 học sinh 15–18 tuổi ở Cần Thơ: 37,4% có triệu chứng trầm cảm theo thang tự báo cáo (không phải chẩn đoán); áp lực học tập và bạo lực giữa người với người nằm trong các yếu tố liên quan.'
  loai: so-lieu
  nguon:
  - cantho2025
  trich: A cross-sectional study was conducted with 1,054 students aged 15-18 years, recruited from eight high schools … The findings revealed that 37.4% of adolescents in Can Tho City, Vietnam, experienced depressive symptoms. Factors influencing depression … include cognitive distortions, academic pressure, exposure to interpersonal violence
  vi_tri: Tran (2025), tóm tắt
  ket_qua: dung
  ghi_chu: Câu mới thêm. Chỉ đọc tóm tắt; "triệu chứng, không phải chẩn đoán" theo thang CESD-R.
- id: n77
  cau: Nghiên cứu công bố năm 2025 trên 714 thanh thiếu niên Việt Nam thấy stress và lo âu làm trung gian hoàn toàn cho mối liên hệ giữa bắt nạt (bị bắt nạt và bắt nạt người khác) với trầm cảm; cả hai nghiên cứu dựa trên bảng hỏi tự báo cáo, tóm tắt không nêu thiết kế dọc.
  loai: so-lieu
  nguon:
  - hovn2025
  trich: stress … and anxiety … fully mediated the relationship between being bullied and depression. Similarly, stress … and anxiety … fully mediated the relationship between bullying others and depression.
  vi_tri: Ho (2025), tóm tắt
  ket_qua: dung
  ghi_chu: 'Câu mới thêm. Chỗ chưa chắc: tóm tắt không nói thiết kế (cắt ngang hay dọc) nên trang chỉ nói "đi cùng nhau"; lượt 2 nên mở toàn văn.'
- id: n78
  cau: '"Bắt nạt trên mạng nguy hiểm và phổ biến hơn bắt nạt trực tiếp" là ngộ nhận về độ phổ biến: bắt nạt truyền thống phổ biến gấp đôi; Olweus (2013) cho rằng một số tuyên bố về bắt nạt mạng trên truyền thông bị phóng đại nhiều.'
  loai: phat-hien
  nguon:
  - modecki2014
  - olweus2013
  trich: traditional bullying was twice as common as cyber bullying (Modecki); several recent claims about cyber bullying made in the media and by some researchers are greatly exaggerated and lack scientific support (Olweus)
  vi_tri: Modecki (2014), tóm tắt; Olweus (2013), tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Thực tế ngược lại về độ phổ biến: bắt nạt truyền thống khoảng 35%, bắt nạt trên mạng khoảng 15%… Bắt nạt mạng đáng lo vì tính ẩn danh và lan truyền nhanh, nhưng nạn nhân thường là cùng một em bị bắt nạt ngoài đời — tách hai vấn đề ra xử lý riêng là kém hiệu quả." Chữ mới: "…bắt nạt truyền thống phổ biến gấp đôi bắt nạt trên mạng… hai dạng tương quan cao… tách chúng ra xử lý riêng không hẳn hiệu quả; Olweus (2013) còn nhận xét…". Lý do: Bỏ 35/15, "ẩn danh và lan truyền nhanh", "cùng một em" (không kiểm được); thêm nhận xét của Olweus 2013.'
- id: n79
  cau: '(Đã bỏ) Ngộ nhận "Kẻ bắt nạt là đứa hư hỏng, thiếu tự tin…": nhiều kẻ bắt nạt có địa vị xã hội cao, kỹ năng xã hội không kém, bắt nạt vì có lợi (được chú ý, được nể sợ).'
  loai: phat-hien
  ket_qua: da-bo
  ghi_chu: 'Không mở được nguồn cho địa vị xã hội và động cơ; Salmivalli 1996 chỉ đọc được tiêu đề. Chữ cũ: Cả gạch đầu dòng ngộ nhận "Kẻ bắt nạt là đứa hư hỏng, thiếu tự tin, gia đình có vấn đề." Chữ mới: (bỏ) Lý do: Không kiểm được.'
- id: n80
  cau: Xung đột ngang sức giữa bạn bè khác với bắt nạt, vốn có chênh lệch quyền lực và lặp lại theo định nghĩa; nhầm lẫn hai thứ có thể khiến vụ bắt nạt bị bỏ qua.
  loai: dinh-nghia
  nguon:
  - holt2015
  trich: Of the 3 core features of bullying set forth in the CDC uniform definition of bullying, most studies (n = 34) specified that aggressive acts were measured and tapped into the repeated nature of bullying (n = 31); approximately a quarter (n = 12) attempted to assess a power imbalance or differential.
  vi_tri: Holt (2015)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Xung đột ngang hàng thì đúng là bình thường và là cơ hội học kỹ năng xã hội… Nhầm lẫn hai thứ này là lý do nhiều vụ bắt nạt bị bỏ qua cho đến khi quá muộn." Chữ mới: "Xung đột ngang sức giữa bạn bè khác với bắt nạt… Nhầm lẫn hai thứ này có thể khiến vụ bắt nạt bị bỏ qua." Lý do: Bỏ "bình thường và là cơ hội học kỹ năng xã hội" và "cho đến khi quá muộn" (không có nguồn).'
- id: n81
  cau: '"Cho con học thêm càng nhiều càng tốt" không có bằng chứng ủng hộ trong nghiên cứu ở Huế, nơi đi học thêm gắn với stress học tập cao hơn.'
  loai: phat-hien
  nguon:
  - tran2024
  trich: attending extra classes were associated with overall academic stress.
  vi_tri: Tran (2024), Abstract
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…"càng nhiều càng tốt" là một niềm tin chưa có bằng chứng — và cái giá có thể là giấc ngủ, sức khỏe tinh thần của con." Chữ mới: "…"càng nhiều càng tốt" không có bằng chứng ủng hộ trong nghiên cứu này." Lý do: Bỏ vế "cái giá là giấc ngủ, sức khỏe tinh thần" (nghiên cứu Huế không thấy liên hệ của giấc ngủ/lối sống với stress).'
- id: n82
  cau: '"Áp lực thi cử giúp học sinh cố gắng hơn, càng áp lực càng giỏi": lo âu về thi cử liên quan âm với thành tích (von der Embse 2018), PISA 2015 thấy lo âu liên quan âm với điểm; nước có động lực cao cũng nhiều lo âu.'
  loai: phat-hien
  nguon:
  - vonderembse2018
  - oecd2017
  trich: test anxiety was significantly and negatively related to a wide range of educational performance outcomes (von der Embse); anxiety about schoolwork, homework and tests is negatively related to performance (OECD)
  vi_tri: von der Embse (2018), tóm tắt; OECD (2017), Overview
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "PISA 2015 cho thấy các nước lo âu về bài vở cao nhất không phải là các nước học kém nhất — nhưng Phần Lan chứng minh có thể đạt đỉnh cao mà không cần đỉnh lo âu. Áp lực vừa phải có thể tạo động lực; áp lực quá mức và kéo dài thì bào mòn cả sức khỏe lẫn kết quả học tập." Chữ mới: "Lo âu về thi cử nhìn chung liên quan đến thành tích thấp hơn (von der Embse…), và PISA 2015 thấy lo âu về bài vở liên quan âm với điểm… các nước có động lực cao cũng nhiều lo âu." Lý do: Bỏ "áp lực vừa phải tạo động lực" (không có nguồn), "bào mòn sức khỏe" (không kiểm).'
- id: n83
  cau: 'Các liên kết "Đọc thêm" (Tuổi teen: mình là ai?; Não tuổi teen khác gì não người lớn?; Khi nào nên tìm sự giúp đỡ chuyên môn?) trỏ tới trang của site.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Chỗ cần chú ý: trong worktree chỉ có phat-trien/ban-sac-tuoi-teen.md; kham-pha/co-so-sinh-hoc/nao-tuoi-teen và kham-pha/suc-khoe-tam-than/tim-giup-do chưa có (lô khác). Link không đổi so với trước; kiểm khi gom nhánh.'
- id: n84
  cau: 'Câu hỏi 1: ba tiêu chí của bắt nạt là hành vi gây hại có chủ ý, lặp đi lặp lại, trong quan hệ chênh lệch quyền lực; lời giải thích: ba tiêu chí phân biệt bắt nạt với xung đột ngang hàng hay sự cố đơn lẻ.'
  loai: dinh-nghia
  nguon:
  - holt2015
  trich: Of the 3 core features of bullying set forth in the CDC uniform definition of bullying, most studies (n = 34) specified that aggressive acts were measured and tapped into the repeated nature of bullying (n = 31); approximately a quarter (n = 12) attempted to assess a power imbalance or differential.
  vi_tri: Holt (2015)
  ket_qua: dung
  ghi_chu: Lời giải thích không dựa vào vị trí lựa chọn.
- id: n85
  cau: 'Câu hỏi 2: Ttofi và Farrington (2011) — trung bình giảm khoảng 20% bắt nạt và 17–20% nạn nhân; hiệu quả hơn khi họp phụ huynh, kỷ luật vững chắc, tăng giám sát; thành phần "làm việc với bạn cùng lứa" liên quan tăng nạn nhân (cần đọc thận trọng).'
  loai: phat-hien
  nguon:
  - ttofi2011
  - gaffney2021
  trich: on average, bullying decreased by 20-23 percent and victimization decreased by 17-20 percent. … Work with peers was associated with an increase in victimization.
  vi_tri: Ttofi (2011), tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…hiệu quả nhất khi có họp phụ huynh… — còn ép "làm việc theo nhóm bạn" lại liên quan đến tăng nạn nhân." và lời giải thích "…can thiệp sai cách (hòa giải ép buộc khi chênh lệch quyền lực còn nguyên) có thể hại nhiều hơn lợi." Chữ mới: "…hiệu quả hơn khi có họp phụ huynh… còn thành phần "làm việc với bạn cùng lứa" lại liên quan đến tăng nạn nhân (một phát hiện cần đọc thận trọng)." và lời giải thích mới nêu Gaffney 2021. Lý do: "Hiệu quả nhất", "ép làm việc nhóm", "hòa giải ép buộc" không có trong nguồn.'
- id: n86
  cau: 'Câu hỏi 3: Modecki (2014) — bắt nạt truyền thống phổ biến gấp đôi bắt nạt mạng và hai dạng tương quan cao; kết luận thực hành của tác giả.'
  loai: so-lieu
  nguon:
  - modecki2014
  trich: traditional bullying was twice as common as cyber bullying. Cyber and traditional bullying were also highly correlated
  vi_tri: Modecki (2014), tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "…(khoảng 35% so với khoảng 15%), hai dạng chồng lấp rất lớn — em bị bắt nạt trên mạng nhiều khả năng cũng bị bắt nạt ngoài đời." Lời giải thích: "…vì nạn nhân thường là cùng một người." Chữ mới: "…phổ biến gấp đôi bắt nạt trên mạng, và hai dạng tương quan cao với nhau." Lời giải thích: "…việc dính líu vào nhiều dạng gây hấn cùng lúc nên là mục tiêu chính…" Lựa chọn nhiễu: "…và hai dạng không liên quan gì nhau." Lý do: 35/15 không kiểm được; lựa chọn nhiễu đổi để vẫn sai rõ ràng và không trái nhận định nào.'
- id: n87
  cau: 'Câu hỏi 4: Trần và cộng sự (2024) — đi học thêm, là nữ, điểm số thấp hơn gắn với stress học tập cao hơn; điểm trung bình tăng từ 46,4 lên 53,5.'
  loai: so-lieu
  nguon:
  - tran2024
  trich: female gender, lower academic scores, and attending extra classes were associated with overall academic stress … increased from 46.4 ± 7.6 to 53.5 ± 10.8
  vi_tri: Tran (2024), Abstract
  ket_qua: dung
  ghi_chu: Giữ nguyên câu hỏi và lời giải thích; "đi cùng" được hiểu là liên hệ.
- id: n88
  cau: Tiêu đề và mô tả trang, mục "Đọc thêm", lời dẫn Hỗ trợ khớp với nội dung trang sau khi sửa; trang là bài mở rộng, dựa trên tre-hoc-the-nao (src/data/trang.yml), kiem_lai_truoc 2028-05.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm trong src/data/trang.yml (dua_tren: tre-hoc-the-nao, kiem_lai_truoc: 2028-05). Đề xuất: giữ hạn 2028-05; nếu cần hạn ngắn hơn thì 2027-11 vì có số liệu thời sự về Việt Nam (n75) và nghiên cứu mới về chương trình chống bắt nạt.'
- id: n89
  cau: 'NAMHS (đại diện quốc gia, 10–17 tuổi, dữ liệu 2021): 1,2% vị thành niên Việt Nam báo cáo bị bắt nạt trong ba tháng qua và 0,8% bắt nạt người khác; bị bắt nạt gắn với rối loạn tâm thần đánh giá bằng phỏng vấn chẩn đoán (aOR 4,71; KTC 1,82–12,21); các con số thấp xa mức "gần một phần ba" của UNESCO, có thể do định nghĩa và cách đo khác nhau.'
  loai: so-lieu
  nguon:
  - namhs-bully2025
  trich: 'For bullying victimisation, both Kenya (4.1%, 95% CI 3.4-5.0) and Indonesia (2.6%, 95% CI 1.9-3.6) had significantly higher prevalence than Vietnam (1.2%, 95% CI 0.9-1.67). … bullying perpetration (…) Vietnam (0.8%, 95% CI 0.5-1.2). … Vietnam: aOR 4.71, 95% CI 1.82-12.21'
  vi_tri: Findings từ NAMHS (2025), tóm tắt, Results
  ket_qua: dung
  ghi_chu: Câu mới thêm sau khi tìm số liệu quốc gia (Europe PMC 10/11/2026). Vế "có thể do định nghĩa và cách đo" là suy luận của trang, đã ghi "có thể"; khoảng thời gian 3 tháng so với "tháng trước" của UNESCO là khác biệt thật.
doi_chu:
- cu: (không có)
  moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
  ly_do: Bố cục C (kế hoạch).
- cu: '"…bắt nạt trên mạng khác gì bắt nạt trực tiếp, và vì sao học sinh châu Á — trong đó có Việt Nam — lo âu về bài vở đến vậy."'
  moi: '"…bắt nạt trên mạng và trực tiếp liên quan thế nào, và áp lực thi cử qua số liệu PISA 2015 và một nghiên cứu dọc ở Huế."'
  ly_do: Việt Nam không có số liệu PISA 2015 cho chỉ số lo âu (OECD 2017), nên không thể nói học sinh Việt lo âu "đến vậy" theo PISA; "định nghĩa của Olweus" đổi thành "theo Olweus và CDC". (nhận định n1)
- cu: '"…ba dấu hiệu mà nhà nghiên cứu Dan Olweus dùng để định nghĩa bắt nạt".'
  moi: '"…ba dấu hiệu trong định nghĩa bắt nạt theo Olweus và theo CDC".'
  ly_do: Nguồn đã mở nêu ba nét cốt lõi của định nghĩa CDC; định nghĩa Olweus theo sách không mở được. (nhận định n2)
- cu: '"…do nhà tâm lý học người Na Uy Dan Olweus — người tiên phong nghiên cứu lĩnh vực này từ những năm 1970 — đề xuất: một học sinh bị bắt nạt khi em bị phơi nhiễm… (Olweus, 1993)".'
  moi: '"…bắt nguồn từ công trình của nhà tâm lý học Dan Olweus. Theo định nghĩa trong sách của ông (Olweus, 1993; chúng tôi không mở được sách gốc)… Định nghĩa thống nhất của CDC cũng gồm ba nét cốt lõi (Holt và cộng sự, 2015)".'
  ly_do: Bỏ quốc tịch và "từ những năm 1970" (không kiểm được); nêu rõ chưa mở sách. (nhận định n4)
- cu: '"…phân biệt bắt nạt với những thứ trông giống nó: đùa giỡn thô bạo giữa bạn bè ngang sức (rough-and-tumble play), hay một vụ xung đột tay đôi."'
  moi: '"…phân biệt bắt nạt với những thứ trông giống nó: một vụ xung đột tay đôi hay một sự cố đơn lẻ."'
  ly_do: Bỏ "rough-and-tumble play" (không có nguồn đã mở). (nhận định n5)
- cu: '"Bắt nạt có nhiều hình thức: thể chất (đánh, xô đẩy, phá đồ), lời nói (chế nhạo, đe dọa, đặt biệt danh), quan hệ (tẩy chay, tung tin đồn, cô lập khỏi nhóm), và trên mạng (cyberbullying — quấy rối qua điện thoại, mạng xã hội)."'
  moi: '"Bắt nạt có thể diễn ra trực tiếp (thể chất, lời nói, quan hệ như tẩy chay) hay trên mạng… Modecki… đo cả hai dạng và thấy chúng tương quan cao với nhau."'
  ly_do: Danh sách ví dụ chi tiết không có trong nguồn đã mở; giữ phân loại chung. (nhận định n7)
- cu: '"Bắt nạt trên mạng có vài nét riêng: kẻ bắt nạt có thể ẩn danh, nạn nhân bị tấn công cả khi đã về nhà, và một nội dung xấu hổ có thể lan đến hàng trăm người chỉ trong vài giờ."'
  moi: (bỏ)
  ly_do: Không kiểm được. (nhận định n8)
- cu: '"…gần một phần ba học sinh trên thế giới từng bị bắt nạt ít nhất một lần trong tháng trước đó, và khoảng một phần mười là nạn nhân của bắt nạt trên mạng (UNESCO, 2019)."'
  moi: '"…gần một phần ba học sinh từng bị bắt nạt ít nhất một lần ở trường trong tháng trước đó, và bắt nạt qua mạng và điện thoại đang tăng (theo bản tin của Liên Hợp Quốc về báo cáo)."'
  ly_do: '"Một phần mười" cho bắt nạt mạng không kiểm được; nguồn nói "đang tăng". Thêm "ở trường". (nhận định n9)'
- cu: '"…nguy cơ cảm thấy mình là "người ngoài" ở trường cao gần gấp ba lần và vắng mặt ở trường cao hơn gấp đôi so với các bạn không bị bắt nạt (UNESCO, 2019)."'
  moi: '"…cảm thấy bị xa lánh cao gần gấp ba lần và vắng mặt ở trường cao hơn gấp đôi so với các bạn khác."'
  ly_do: Theo chữ của bản tin ("shunned"); so với "các bạn khác", không phải "các bạn không bị bắt nạt". (nhận định n10)
- cu: '"…khoảng 35% dính líu đến bắt nạt truyền thống… khoảng 15% dính líu đến bắt nạt trên mạng… hơn 300.000 thanh thiếu niên… em nào bị bắt nạt trên mạng thì nhiều khả năng cũng bị bắt nạt ngoài đời, và ngược lại".'
  moi: '"…bắt nạt truyền thống phổ biến gấp đôi bắt nạt trên mạng và hai dạng này tương quan cao".'
  ly_do: 35%, 15%, 300.000 và "với vai trò nạn nhân hoặc kẻ bắt nạt" không có trong tóm tắt, không mở được toàn văn (các nguồn thứ cấp cũng mâu thuẫn về việc 35% là nạn nhân hay tổng). (nhận định n11)
- cu: '"…nguồn lực phòng ngừa nên nhắm vào hành vi bắt nạt nói chung, thay vì tách riêng "chống bắt nạt mạng" như một vấn đề hoàn toàn khác".'
  moi: '"…việc dính líu vào nhiều dạng gây hấn cùng lúc nên là mục tiêu chính của can thiệp và chính sách, thay vì tách riêng…".'
  ly_do: Theo chữ "polyaggression involvement" của tóm tắt; thêm điểm cách đo ảnh hưởng tỉ lệ. (nhận định n12)
- cu: '"Bắt nạt thường đạt đỉnh ở cấp trung học cơ sở (khoảng 11–14 tuổi) — đúng độ tuổi mà nhu cầu được bạn bè chấp nhận lên cao nhất."'
  moi: (bỏ)
  ly_do: Không kiểm được. (nhận định n13)
- cu: '"Singapore — một trong những nền giáo dục đứng đầu thế giới — có chỉ số lo âu này cao nhất trong các nước tham gia (OECD, 2017), trong khi Phần Lan (cũng thuộc top đầu) lại thấp nhất."'
  moi: '"Singapore nằm trong nhóm có chỉ số lo âu cao nhất (0,57, sau Brazil và Costa Rica, cùng 0,60), trong khi Phần Lan thấp (−0,41; Hà Lan −0,54 và Thụy Sĩ −0,44 còn thấp hơn)".'
  ly_do: 'Sai: Singapore thứ ba, Phần Lan không thấp nhất; thứ hạng giáo dục không kiểm được. (nhận định n15)'
- cu: '"Nói cách khác: học giỏi và lo âu không loại trừ nhau — ở nhiều nơi, chúng đi cùng nhau."'
  moi: '"OECD ghi nhận rằng các nước mà học sinh có động lực thành tích cao cũng thường là nước nhiều học sinh lo âu về bài thi, trong khi tần suất kiểm tra không liên quan đến mức lo âu".'
  ly_do: Nguồn nói về động lực thành tích, không phải "học giỏi". (nhận định n17)
- cu: '"Phần Lan chứng minh có thể vừa học giỏi vừa ít lo âu, nếu văn hóa học đường ít so sánh và cạnh tranh hơn."'
  moi: '"Phần Lan, Hà Lan và Thụy Sĩ cho thấy kết quả học tập tốt có thể đi cùng học sinh hài lòng với cuộc sống (OECD, 2017)."'
  ly_do: Nguồn nói về hài lòng cuộc sống, không nói "văn hóa ít so sánh". (nhận định n18)
- cu: '"Dan Olweus bắt đầu nghiên cứu tình trạng học sinh ức hiếp nhau ở Thụy Điển/Na Uy từ đầu thập niên 1970… Cuốn sách đầu tiên của ông, Aggression in the Schools (1978), là công trình khoa học có hệ thống đầu tiên về chủ đề này; đến Bullying at School (1993), ông hệ thống hóa định nghĩa ba tiêu chí…"'
  moi: '"Dan Olweus là nhà nghiên cứu đã gắn tên mình với việc nghiên cứu bắt nạt học đường và với [OBPP]; năm 2013 ông kể lại cách mối quan tâm và nghiên cứu của mình về bắt nạt bắt đầu, và cho rằng việc bị bắt nạt không chỉ là chuyện "vô hại, thoáng qua"."'
  ly_do: Không kiểm được thời điểm, nơi, lý do ban đầu, "đầu tiên"; chỉ giữ điều tóm tắt 2013 nói. (nhận định n20)
- cu: '"…từ đầu thập niên 1970, sau một số vụ học sinh tự tử được cho là liên quan đến việc bị bắt nạt… là công trình khoa học có hệ thống đầu tiên… chương trình can thiệp toàn trường đầu tiên trên thế giới."'
  moi: (bỏ)
  ly_do: Không kiểm được; liên quan đến chủ đề tự tử nên càng không để câu chưa kiểm. (nhận định n21)
- cu: '"toàn trường (thành lập ban điều phối, khảo sát ẩn danh học sinh, xây dựng nội quy chung chống bắt nạt, tăng cường giám sát ở "điểm nóng"…, họp phụ huynh), lớp học (đặt nội quy lớp, tổ chức thảo luận định kỳ), và cá nhân (can thiệp với từng em bắt nạt, nạn nhân và phụ huynh các em)".'
  moi: '"toàn trường (khảo sát ẩn danh, ban chống bắt nạt, tập huấn nhân viên, tăng giám sát ở các "điểm nóng"), lớp học (họp lớp định kỳ, nội quy rõ ràng) và cá nhân…"; thêm "theo một bài tổng quan năm 2026".'
  ly_do: Khớp chữ của tổng quan; bỏ "họp phụ huynh" ở cấp toàn trường và "nội quy chung" (nguồn xếp phụ huynh ở cấp cá nhân). (nhận định n23)
- cu: '"Nền tảng của chương trình là bốn nguyên tắc: môi trường có sự ấm áp, quan tâm và tham gia của người lớn; đặt giới hạn vững chắc…" và gạch đầu dòng "Mô hình của Olweus: ấm áp + giới hạn vững chắc".'
  moi: (bỏ cả hai chỗ; thay bằng bullet "Chương trình toàn trường" theo Gaffney 2021)
  ly_do: Không kiểm được. (nhận định n24)
- cu: '"Đánh giá triển khai OBPP ở Mỹ cho thấy chương trình làm giảm đáng kể tỉ lệ bắt nạt và nạn nhân khi được thực hiện đúng (Olweus và Limber, 2010)."'
  moi: '"Olweus và Limber (2010) thấy các nghiên cứu ở Na Uy cho bằng chứng thuyết phục về hiệu quả; các đánh giá ở Mỹ không đồng nhất, nhưng cho thấy chương trình có tác động tích cực lên việc học sinh tự báo cáo dính líu vào bắt nạt và hành vi chống đối xã hội."'
  ly_do: Tóm tắt nói "không đồng nhất", không nói "giảm đáng kể" hay "khi được thực hiện đúng". (nhận định n25)
- cu: '"…rà soát toàn bộ tài liệu đến giữa năm 2009 (35 tạp chí đọc tay toàn bộ, 18 cơ sở dữ liệu điện tử…)… phân tích tổng hợp lớn nhất về chủ đề này tính đến thời điểm đó."'
  moi: '"…rà soát tài liệu nhiều nguồn, kể cả báo cáo chưa công bố và ngôn ngữ ngoài tiếng Anh…"'
  ly_do: Số tạp chí, cơ sở dữ liệu, mốc 2009 và "lớn nhất" không có trong phần đã đọc. (nhận định n26)
- cu: '"…được triển khai chuyên sâu, dài hơi."'
  moi: '"…triển khai chuyên sâu."'
  ly_do: '"Dài hơi" không có trong tóm tắt. (nhận định n28)'
- cu: '"…các chương trình cho học sinh "làm việc với nhau theo nhóm bạn" (work with peers — ví dụ bắt nạn nhân và kẻ bắt nạt ngồi lại "hòa giải" với nhau) lại liên quan đến việc tăng tỉ lệ nạn nhân. Bài học: can thiệp sai cách có thể hại nhiều hơn lợi."'
  moi: '"…các chương trình có thành phần "làm việc với bạn cùng lứa" (work with peers) lại liên quan đến việc tăng tỉ lệ nạn nhân… cần đọc thận trọng: tóm tắt không nêu rõ các hoạt động cụ thể" + kết quả của Gaffney 2021.'
  ly_do: Ví dụ "bắt hòa giải" và "bài học" không có trong tóm tắt; thêm kết quả không đồng nhất của phân tích sau. (nhận định n29)
- cu: '"…với gần gấp đôi số đánh giá (100 chương trình)…".'
  moi: '"Một phân tích cập nhật của cùng nhóm, với 100 đánh giá, thấy… khác biệt lớn giữa các nghiên cứu".'
  ly_do: Nguồn nói 100 "evaluations", không phải 100 chương trình; số chương trình của bài 2011 là 53 (44 có số liệu). (nhận định n30)
- cu: '"…dự báo mạnh nhất của việc bị bắt nạt trên mạng chính là đang bị bắt nạt ngoài đời — và trong các yếu tố gắn với hành vi bắt nạt mạng, mạnh nhất là những niềm tin "gây hấn là bình thường" cùng sự tách rời đạo đức".'
  moi: '"…các liên hệ mạnh nhất với việc bị bắt nạt mạng là căng thẳng và ý nghĩ tự tử…" (vế bắt nạt mạng của người gây hấn giữ nguyên).'
  ly_do: Tóm tắt nói liên hệ mạnh nhất của victimization là stress và ý nghĩ tự tử, không phải "đang bị bắt nạt ngoài đời"; không dùng từ "dự báo" (cắt ngang). (nhận định n32)
- cu: '"…47 nghiên cứu (61,7% mẫu ngoài nước Mỹ)…" (mô tả mẫu).'
  moi: '"…47 nghiên cứu cắt ngang (38,3% từ Mỹ, 61,7% ngoài Mỹ)…".'
  ly_do: Thêm "cắt ngang" theo tóm tắt (cần cho hạn chế nhân quả). (nhận định n33)
- cu: '"…trong đó nhóm vừa bắt nạt vừa bị bắt nạt (bully-victim) có nguy cơ cao nhất."'
  moi: (bỏ vế "bully-victim có nguy cơ cao nhất")
  ly_do: Tóm tắt không nói nhóm nào cao nhất. (nhận định n34)
- cu: '"…ý nghĩ tự tử cao gấp khoảng 2,2 lần và hành vi tự tử gấp khoảng 2,5 lần — và liên hệ giữa bắt nạt mạng với ý nghĩ tự tử (OR = 3,1) còn mạnh hơn có ý nghĩa thống kê so với bắt nạt truyền thống (OR = 2,2)."'
  moi: '"…OR 2,23… OR 2,55… bắt nạt mạng liên quan đến ý nghĩ tự tử mạnh hơn bắt nạt truyền thống".'
  ly_do: OR 3,1 và 2,2 cho hai dạng không có trong tóm tắt; "cao gấp 2,2 lần" diễn giải sai OR thành nguy cơ. (nhận định n35)
- cu: '"Đây là mối liên hệ tương quan, không phải "bị bắt nạt thì sẽ..."."'
  moi: '"Đây là mối liên hệ… Các nghiên cứu được tổng hợp là cắt ngang nên không cho biết chiều nhân quả…"'
  ly_do: Thêm lý do theo nguồn. (nhận định n36)
- cu: '"…hãy nói ra với một người lớn mà bạn tin tưởng — cha mẹ, thầy cô — hoặc tìm đến dịch vụ hỗ trợ tâm lý… Nếu bạn hoặc người thân đang nghĩ đến việc tự làm hại mình, hãy gọi 115."'
  moi: '"…hoặc tìm người có chuyên môn… Nếu bạn hoặc người thân đang nghĩ đến việc tự làm hại mình, hãy nói ngay với người có chuyên môn; xem [Hỗ trợ](/psyche/ho-tro/) để biết nơi liên hệ."'
  ly_do: 'Theo lời giao: dẫn Hỗ trợ thay vì chỉ một số điện thoại không kiểm ở trang này. (nhận định n37)'
- cu: '"…trên 611 học sinh của 4 trường trung học… Có 341 em hoàn thành cả hai đợt khảo sát." và "ESSA… xây dựng và kiểm định trên học sinh Trung Quốc rồi kiểm định lại trên học sinh TP. Hồ Chí Minh".'
  moi: '"611 em được mời, 341 em có đủ dữ liệu ở cả hai đợt (lúc đầu học lớp 6, cuối là lớp 9)… ESSA, xây dựng và kiểm định trên học sinh Trung Quốc; Sun và cộng sự, 2011".'
  ly_do: 611 là số được mời (517 và 479 tham gia hai đợt; 341 phân tích); bỏ "kiểm định lại trên học sinh TP. Hồ Chí Minh" (bài Tran nêu một kiểm định ESSA ở Việt Nam không rõ địa điểm; chưa mở). (nhận định n39)
- cu: '"Các yếu tố gắn với stress cao hơn gồm: là nữ, điểm số thấp hơn, đi học thêm, đông anh chị em, và cha có trình độ học vấn cao hơn."'
  moi: Danh sách như cũ, thêm "đo ở đợt đầu… ở đợt sau" và "các yếu tố lối sống không liên quan".
  ly_do: Nêu rõ thiết kế (yếu tố đầu kỳ liên quan stress cuối kỳ) và kết quả âm tính. (nhận định n42)
- cu: '"Đây là một trong số ít nghiên cứu dọc về stress học tập trên học sinh Việt Nam được công bố quốc tế."'
  moi: '"Theo các tác giả, đây là nghiên cứu dọc đầu tiên… ở học sinh trung học cơ sở Việt Nam."'
  ly_do: Theo chữ của tác giả, "to the best of our knowledge". (nhận định n44)
- cu: '"Định nghĩa của Olweus đã được giới nghiên cứu dùng thống nhất suốt hơn 40 năm và được UNESCO, CDC Mỹ cùng nhiều tổ chức khác chấp nhận."'
  moi: '"Ba tiêu chí này là nền của định nghĩa theo Olweus và của định nghĩa thống nhất của CDC… Nhãn nói về định nghĩa, không về tỉ lệ: nhiều nghiên cứu không đo đủ ba tiêu chí".'
  ly_do: '"Thống nhất suốt hơn 40 năm" bị Holt (2015) làm yếu (nhiều nghiên cứu không đo đủ ba tiêu chí); "UNESCO… chấp nhận" không kiểm được. (nhận định n45)'
- cu: 'Tiêu đề khung: "bị bắt nạt gắn liền với lo âu, trầm cảm và kết quả học tập kém hơn" và "đã được tái hiện nhất quán qua hàng trăm nghiên cứu".'
  moi: '"bị bắt nạt gắn liền với trầm cảm về sau và với ý nghĩ tự tử" kèm OR và nguồn.'
  ly_do: Không mở được nguồn cho "lo âu" và "kết quả học tập kém hơn", và "hàng trăm nghiên cứu" không kiểm được. (nhận định n46)
- cu: '"Hai phân tích tổng hợp cách nhau một thập niên đều kết luận các chương trình làm giảm hành vi bắt nạt khoảng 15–20%. Hiệu quả… phụ thuộc vào việc có họp phụ huynh, kỷ luật vững chắc, giám sát sân chơi và triển khai đủ chuyên sâu hay không."'
  moi: '"…khoảng 20% và nạn nhân khoảng 15–20%… thành phần nào quan trọng thì các phân tích chưa hoàn toàn thống nhất (Ttofi và Farrington, 2011; Gaffney và cộng sự, 2021), và các đánh giá OBPP ở Mỹ không đồng nhất".'
  ly_do: Số liệu đúng hơn (bắt nạt ~20%, nạn nhân 15–20%) và nêu sự không thống nhất về thành phần. (nhận định n47)
- cu: '"Tỉ lệ 35% so với 15% trong phân tích của Modecki… là con số trung bình gộp — tỉ lệ cụ thể dao động mạnh giữa các nghiên cứu tùy cách đo."'
  moi: '"…bắt nạt truyền thống phổ biến gấp đôi bắt nạt trên mạng… cách đo khác nhau làm tỉ lệ khác nhau."'
  ly_do: Bỏ 35%/15% (không kiểm được). (nhận định n48)
- cu: '"Các phân tích tổng hợp đều là nghiên cứu cắt ngang… cũng chưa tách hết vai trò của các yếu tố trung gian như trầm cảm có sẵn. Giới nghiên cứu đồng thuận rằng bắt nạt là một yếu tố nguy cơ nghiêm trọng…"'
  moi: '"Phân tích của Holt và cộng sự (2015) chỉ gồm các nghiên cứu cắt ngang… tác giả của tổng hợp về trầm cảm cũng nói các suy luận nhân quả chỉ là tạm thời… Bắt nạt là một yếu tố nguy cơ đáng nghiêm túc".'
  ly_do: '"Đều là cắt ngang" và "đồng thuận" không kiểm được cho cả các tổng hợp; "trầm cảm có sẵn" không có trong nguồn. (nhận định n49)'
- cu: '"Bằng chứng ủng hộ kỷ luật vững chắc, nhất quán và không thù địch — chứ không phải các biện pháp loại trừ kiểu "đuổi học ngay lập tức"… Đáng chú ý, phân tích của Ttofi và Farrington còn phát hiện các chương trình ép nạn nhân và kẻ bắt nạt "làm việc với nhau" theo nhóm bạn lại liên quan đến tăng tỉ lệ nạn nhân."'
  moi: '"Bằng chứng ủng hộ kỷ luật vững chắc (Ttofi và Farrington, 2011…). Còn các chính sách "không khoan nhượng"… tổng quan của APA (2008)…".'
  ly_do: '"Nhất quán và không thù địch" không có trong tóm tắt; vế "ép… làm việc với nhau" không đúng với nguồn (xem n29). (nhận định n50)'
- cu: '"…từng bắt nạt người khác ở trường là yếu tố dự báo phạm tội sau này (tỉ số chênh hiệu chỉnh khoảng 1,9)… (Ttofi, Farrington, Lösel và Loeber, 2011; Ttofi, Farrington và Lösel, 2012)".'
  moi: '"…tỉ số chênh hiệu chỉnh khoảng 1,8; Ttofi và cộng sự, 2011… Olweus (2013) cũng kết luận bắt nạt không chỉ là vấn đề vô hại và thoáng qua".'
  ly_do: OR hiệu chỉnh là 1,82 (đúng 1,8, không phải 1,9); bài Ttofi 2012 (bạo lực) không mở được nên bỏ khỏi trang và danh sách nguồn. (nhận định n51)
- cu: '"…dự báo trầm cảm sau trung bình gần 7 năm (tỉ số chênh khoảng 2,0; vẫn khoảng 1,7…)".'
  moi: Giữ "khoảng 2,0 / 1,7", thêm 6,9 năm; đổi phạm tội 1,9 → 1,8.
  ly_do: Số liệu đúng theo tóm tắt. (nhận định n52)
- cu: '"Salmivalli… chỉ ra rằng… ngoài kẻ bắt nạt và nạn nhân còn có các vai trò khác: người tiếp tay, người cổ vũ (cười, reo hò — vô tình "thưởng"), người ngoài cuộc (đứng nhìn, im lặng — sự im lặng cũng là một thông điệp), người bảo vệ. Kẻ bắt nạt thường có địa vị xã hội cao… (Salmivalli và cộng sự, 1996)."'
  moi: '"Salmivalli… xem bắt nạt như một quá trình nhóm và xét các vai trò tham gia… Cách nhìn này gợi ý rằng ngoài kẻ bắt nạt và nạn nhân còn có những người tiếp tay, cổ vũ, đứng ngoài cuộc và bảo vệ."'
  ly_do: Bỏ "địa vị xã hội cao" và các mô tả vai trò (không mở được nguồn nói điều đó). (nhận định n53)
- cu: '"…các chương trình hiệu quả như KiVa của Phần Lan nhắm vào người chứng kiến: dạy cả lớp cách không cổ vũ và dám bảo vệ bạn."'
  moi: '"…chương trình KiVa của Phần Lan nhấn mạnh vai trò của người chứng kiến (theo một tổng quan năm 2026)."'
  ly_do: Bỏ mô tả nội dung huấn luyện (không kiểm được). (nhận định n54)
- cu: '"…đánh giá quy mô lớn ở Phần Lan (78 trường, hơn 8.000 học sinh) cho thấy nó giảm được cả tỉ lệ bắt nạt lẫn nạn nhân (Kärnä và cộng sự, 2011)."'
  moi: '"…một thử nghiệm ngẫu nhiên ở 78 trường với hơn 8.000 học sinh lớp 4–6 thấy sau 9 tháng chương trình có tác động tốt lên nhiều chỉ số, kể cả bắt nạt và bị bắt nạt do học sinh tự báo cáo".'
  ly_do: Nêu thiết kế ngẫu nhiên, lớp 4–6, 9 tháng, 7/11 biến. (nhận định n55)
- cu: 'Tiêu đề mục 2 (":nhan[kha-vung]") và "Đa số vụ bắt nạt diễn ra trước mặt người khác. Bạn không cần lao vào can ngăn một cách nguy hiểm: chỉ cần không cười theo, không chia sẻ clip bắt nạt, và sau đó đến bên nạn nhân… cũng đã phá vỡ "phần thưởng xã hội" nuôi dưỡng kẻ bắt nạt. Các chương trình như KiVa thành công chính nhờ huấn luyện cả lớp làm điều này".'
  moi: '"Chương trình KiVa… nhấn mạnh vai trò của người chứng kiến, và một thử nghiệm ngẫu nhiên… Những việc như không cười theo… là gợi ý thực hành hợp lý theo hướng này; chúng tôi không có nghiên cứu nào đo riêng từng hành vi ấy."'
  ly_do: Bỏ "đa số vụ bắt nạt diễn ra trước mặt người khác" và "phần thưởng xã hội" (không kiểm được); KiVa nhắm cả lớp nhưng không có nguồn nói "thành công chính nhờ" điều đó. (nhận định n56)
- cu: '"Phân tích của Ttofi và Farrington chỉ ra họp phụ huynh là một trong những thành phần hiệu quả nhất."'
  moi: '"Ttofi và Farrington (2011) thấy họp phụ huynh đi cùng hiệu quả lớn hơn, và Gaffney… thông tin cho phụ huynh gắn với hiệu quả lớn hơn."'
  ly_do: Tóm tắt không xếp "một trong hiệu quả nhất". (nhận định n57)
- cu: Tiêu đề mục 3 (":nhan[kha-vung]") giữ nguyên chip.
  moi: Giữ chip; nội dung mục viết lại theo n57 và n59.
  ly_do: Nhãn nay có co_so và lý do. (nhận định n58)
- cu: '"…cha mẹ cần tin lời con trước, ghi lại diễn biến… và làm việc với giáo viên chủ nhiệm thay vì xông vào "xử" phụ huynh nhà kia — điều này thường khiến con bị trả đũa nặng hơn. Với bắt nạt trên mạng: lưu bằng chứng… chặn… báo cáo…".'
  moi: '"Các gợi ý cụ thể dưới đây là thông lệ thực hành, chưa phải kết quả của nghiên cứu mà chúng tôi đã kiểm: … cha mẹ có thể lắng nghe con trước, ghi lại diễn biến… trao đổi với giáo viên chủ nhiệm."'
  ly_do: Bỏ "thường khiến con bị trả đũa nặng hơn" (không kiểm được); "cần" → "có thể". (nhận định n59)
- cu: (không có)
  moi: '"Nếu bị bắt nạt kéo dài làm em lo lắng nhiều hay thay đổi rõ về ăn, ngủ, đi học, hãy tìm người có chuyên môn; xem [Hỗ trợ]".'
  ly_do: Theo lời giao cho chủ đề bắt nạt kéo dài. (nhận định n60)
- cu: '"Để gây hại cho người khác mà không cắn rứt, con người có một bộ "thủ thuật" tâm lý: đổ lỗi cho nạn nhân…, gọi hành vi bằng cái tên nhẹ nhàng hơn…, hay phân tán trách nhiệm… Nhận diện được các thủ thuật này… là bước đầu để vô hiệu hóa chúng."'
  moi: '"…niềm tin rằng gây hấn là bình thường và sự tách rời đạo đức… nằm trong các liên hệ mạnh nhất… Các cách nói "chỉ đùa thôi"… là ví dụ minh họa của chúng tôi".'
  ly_do: Danh sách ba "thủ thuật" và "bước đầu để vô hiệu hóa" không có trong nguồn đã mở; giữ phần Kowalski xác nhận. (nhận định n61)
- cu: (không có; thay cho đoạn "Ở các nền giáo dục chịu ảnh hưởng văn hóa Nho giáo, điểm số… thể diện của cả gia đình… Phần Lan chứng minh có thể vừa học giỏi vừa ít lo âu, nếu văn hóa học đường ít so sánh và cạnh tranh hơn")
  moi: '"Lo âu về thi cử liên quan âm đến thành tích học tập (von der Embse và cộng sự, 2018, 238 nghiên cứu…); PISA 2015 cho thấy các nước có động lực thành tích cao cũng thường có nhiều học sinh lo âu…; Trần và cộng sự (2024) bàn luận rằng cha mẹ quá kiểm soát…"'
  ly_do: Bỏ "thể diện gia đình/Nho giáo" và "Phần Lan… nếu văn hóa ít so sánh" (không kiểm được). (nhận định n63)
- cu: 'Tiêu đề mục 4 "Quản lý áp lực thi cử: phân biệt "lo âu vừa phải" với "lo âu độc hại"" và "Một chút căng thẳng trước kỳ thi là bình thường và thậm chí giúp tập trung."'
  moi: 'Tiêu đề "Áp lực thi cử: khi nào cần để ý" (giữ id cũ); "Chúng tôi không có nguồn cho việc một mức căng thẳng "vừa phải" có lợi cho thi cử."'
  ly_do: Không có nguồn đã mở cho Yerkes–Dodson trong bối cảnh thi cử; von der Embse thấy liên hệ âm. (nhận định n65)
- cu: '"…khi lo âu đi kèm mất ngủ kéo dài, đau đầu/đau bụng trước mỗi kỳ thi, né tránh đến trường, hay suy nghĩ "thi trượt thì đời mình coi như bỏ" — đó là dấu hiệu cần hỗ trợ, không phải "cố thêm chút nữa"."'
  moi: '"…kéo dài và ảnh hưởng đến giấc ngủ, ăn uống, việc đến trường, hay em nói những điều cho thấy mất hy vọng, đó là lúc cần nói với người lớn tin cậy và tìm người có chuyên môn; xem Hỗ trợ."'
  ly_do: Bỏ danh sách triệu chứng giống dấu hiệu lâm sàng; chỉ dẫn tới người có chuyên môn. (nhận định n66)
- cu: '"…cha mẹ nên cân nhắc: thêm giờ học có thực sự giúp con, hay chỉ đổi điểm số lấy sức khỏe tinh thần?"'
  moi: '"…cha mẹ có thể cân nhắc xem thêm giờ học có thực sự giúp con hay không, nhưng đó là liên hệ quan sát."'
  ly_do: Bỏ vế "đổi điểm số lấy sức khỏe tinh thần" (khẳng định nhân quả không có nguồn). (nhận định n67)
- cu: '"Nếu cả ba đều "có", đó là bắt nạt — và cần can thiệp nghiêm túc, không phải "khuyên hai bên làm hòa" cho xong."'
  moi: '"…cần được nhà trường, gia đình xử lý nghiêm túc. Ba câu hỏi này là cách áp dụng định nghĩa nêu ở trên, không phải công cụ chẩn đoán."'
  ly_do: Bỏ "không phải khuyên hai bên làm hòa" (không có nguồn). (nhận định n68)
- cu: '"Ở Việt Nam, một ngày của nhiều học sinh là: học chính khóa ở trường, rồi học thêm buổi tối, rồi làm bài tập đến khuya… Điều này không có nghĩa học thêm luôn xấu, nhưng đặt câu hỏi cho mỗi gia đình…"'
  moi: '"Học thêm và stress học tập… tăng từ 2018 đến 2021, một giai đoạn có đại dịch COVID-19 và các em lên lớp cuối cấp. Điều này không có nghĩa học thêm luôn xấu, nhưng đặt câu hỏi…"'
  ly_do: Bỏ mô tả "một ngày của nhiều học sinh" (không có nguồn), thêm bối cảnh COVID. (nhận định n69)
- cu: '"Trong văn hóa chịu ảnh hưởng Nho giáo, điểm số không chỉ phản ánh năng lực của đứa trẻ mà còn là thể diện của cha mẹ — "con nhà người ta" trở thành thước đo khiến nhiều em cảm thấy mình là gánh nặng mỗi khi điểm kém."'
  moi: (bỏ)
  ly_do: Không kiểm được. (nhận định n70)
- cu: Đoạn "Kỳ thi "một cửa"…" (kỳ thi một buổi sáng quyết định lối rẽ; suneung; Singapore đứng đầu PISA về lo âu; "Điểm chung của các nền giáo dục Đông Á… động lực cao đi cùng lo âu rất cao").
  moi: '(thay bằng đoạn "So sánh quốc tế": Việt Nam không có số liệu PISA 2015 cho chỉ số này; động lực cao và lo âu đi cùng nhau ở cấp nước theo OECD).'
  ly_do: Không kiểm được; vế Singapore sai. (nhận định n71)
- cu: Đoạn "Bạo lực học đường trên báo chí Việt Nam…".
  moi: (bỏ)
  ly_do: Không kiểm được. (nhận định n72)
- cu: Đoạn "Vai trò của giáo viên chủ nhiệm…".
  moi: 'Thay bằng đoạn "Bắt nạt ở trường": khảo sát ẩn danh, xử lý từng vụ việc riêng, nội quy rõ ràng là thành phần mô tả của OBPP (n74); chưa tìm thấy nghiên cứu đã mở so sánh cách "ép hai bên bắt tay làm hòa".'
  ly_do: Không kiểm được. (nhận định n73)
- cu: '"Cách làm có bằng chứng hơn: trường tổ chức khảo sát ẩn danh định kỳ (như Bảng hỏi Bắt nạt/Nạn nhân của Olweus)… xử lý từng vụ việc riêng với từng bên; và đặt nội quy rõ ràng, thực thi nhất quán."'
  moi: '"…khảo sát ẩn danh định kỳ là một phần của chương trình như OBPP; xử lý từng vụ việc riêng với từng bên và đặt nội quy rõ ràng cũng nằm trong các thành phần được mô tả của chương trình này."'
  ly_do: '"Có bằng chứng hơn" và "Bảng hỏi Olweus" không kiểm được; viết đúng mức mô tả của tổng quan. (nhận định n74)'
- cu: (không có)
  moi: Câu thời sự mới, có mốc và hạn, thay cho phê phán cách làm của giáo viên chủ nhiệm (n73).
  ly_do: 'Quy tắc câu "chưa tìm thấy": mốc, hạn, nguồn là lần tìm. (nhận định n75)'
- cu: '"Thực tế ngược lại về độ phổ biến: bắt nạt truyền thống khoảng 35%, bắt nạt trên mạng khoảng 15%… Bắt nạt mạng đáng lo vì tính ẩn danh và lan truyền nhanh, nhưng nạn nhân thường là cùng một em bị bắt nạt ngoài đời — tách hai vấn đề ra xử lý riêng là kém hiệu quả."'
  moi: '"…bắt nạt truyền thống phổ biến gấp đôi bắt nạt trên mạng… hai dạng tương quan cao… tách chúng ra xử lý riêng không hẳn hiệu quả; Olweus (2013) còn nhận xét…".'
  ly_do: Bỏ 35/15, "ẩn danh và lan truyền nhanh", "cùng một em" (không kiểm được); thêm nhận xét của Olweus 2013. (nhận định n78)
- cu: Cả gạch đầu dòng ngộ nhận "Kẻ bắt nạt là đứa hư hỏng, thiếu tự tin, gia đình có vấn đề."
  moi: (bỏ)
  ly_do: Không kiểm được. (nhận định n79)
- cu: '"Xung đột ngang hàng thì đúng là bình thường và là cơ hội học kỹ năng xã hội… Nhầm lẫn hai thứ này là lý do nhiều vụ bắt nạt bị bỏ qua cho đến khi quá muộn."'
  moi: '"Xung đột ngang sức giữa bạn bè khác với bắt nạt… Nhầm lẫn hai thứ này có thể khiến vụ bắt nạt bị bỏ qua."'
  ly_do: Bỏ "bình thường và là cơ hội học kỹ năng xã hội" và "cho đến khi quá muộn" (không có nguồn). (nhận định n80)
- cu: '"…"càng nhiều càng tốt" là một niềm tin chưa có bằng chứng — và cái giá có thể là giấc ngủ, sức khỏe tinh thần của con."'
  moi: '"…"càng nhiều càng tốt" không có bằng chứng ủng hộ trong nghiên cứu này."'
  ly_do: Bỏ vế "cái giá là giấc ngủ, sức khỏe tinh thần" (nghiên cứu Huế không thấy liên hệ của giấc ngủ/lối sống với stress). (nhận định n81)
- cu: '"PISA 2015 cho thấy các nước lo âu về bài vở cao nhất không phải là các nước học kém nhất — nhưng Phần Lan chứng minh có thể đạt đỉnh cao mà không cần đỉnh lo âu. Áp lực vừa phải có thể tạo động lực; áp lực quá mức và kéo dài thì bào mòn cả sức khỏe lẫn kết quả học tập."'
  moi: '"Lo âu về thi cử nhìn chung liên quan đến thành tích thấp hơn (von der Embse…), và PISA 2015 thấy lo âu về bài vở liên quan âm với điểm… các nước có động lực cao cũng nhiều lo âu."'
  ly_do: Bỏ "áp lực vừa phải tạo động lực" (không có nguồn), "bào mòn sức khỏe" (không kiểm). (nhận định n82)
- cu: '"…hiệu quả nhất khi có họp phụ huynh… — còn ép "làm việc theo nhóm bạn" lại liên quan đến tăng nạn nhân." và lời giải thích "…can thiệp sai cách (hòa giải ép buộc khi chênh lệch quyền lực còn nguyên) có thể hại nhiều hơn lợi."'
  moi: '"…hiệu quả hơn khi có họp phụ huynh… còn thành phần "làm việc với bạn cùng lứa" lại liên quan đến tăng nạn nhân (một phát hiện cần đọc thận trọng)." và lời giải thích mới nêu Gaffney 2021.'
  ly_do: '"Hiệu quả nhất", "ép làm việc nhóm", "hòa giải ép buộc" không có trong nguồn. (nhận định n85)'
- cu: '"…(khoảng 35% so với khoảng 15%), hai dạng chồng lấp rất lớn — em bị bắt nạt trên mạng nhiều khả năng cũng bị bắt nạt ngoài đời." Lời giải thích: "…vì nạn nhân thường là cùng một người."'
  moi: '"…phổ biến gấp đôi bắt nạt trên mạng, và hai dạng tương quan cao với nhau." Lời giải thích: "…việc dính líu vào nhiều dạng gây hấn cùng lúc nên là mục tiêu chính…" Lựa chọn nhiễu: "…và hai dạng không liên quan gì nhau."'
  ly_do: 35/15 không kiểm được; lựa chọn nhiễu đổi để vẫn sai rõ ràng và không trái nhận định nào. (nhận định n86)
