  - id: n14
    cau: PISA 2015 đo chỉ số lo âu liên quan đến bài vở ở học sinh 15 tuổi; trung bình OECD, 55% (55,5% trong bảng) học sinh nói dù đã chuẩn bị kỹ vẫn rất lo âu khi làm bài; ở mọi nước tham gia, nữ lo âu hơn nam.
