    vi_tri: Modecki (2014), tóm tắt; Olweus (2013), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Thực tế ngược lại về độ phổ biến: bắt nạt truyền thống khoảng 35%, bắt nạt trên mạng khoảng 15%… Bắt nạt mạng đáng lo vì tính ẩn danh và lan truyền nhanh, nhưng nạn nhân thường là cùng một em bị bắt nạt ngoài đời — tách hai vấn đề ra xử lý riêng là kém hiệu quả." Chữ mới: "…bắt nạt truyền thống phổ biến gấp đôi bắt nạt trên mạng… hai dạng tương quan cao… tách chúng ra xử lý riêng không hẳn hiệu quả; Olweus (2013) còn nhận xét…". Lý do: Bỏ 35/15, "ẩn danh và lan truyền nhanh", "cùng một em" (không kiểm được); thêm nhận xét của Olweus 2013. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Tóm tắt Olweus 2013: "greatly exaggerated and lack scientific support".'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/25168105", "https://europepmc.org/article/MED/23297789" ]
    review: dung
  - id: n79
    cau: '(Đã bỏ) Ngộ nhận "Kẻ bắt nạt là đứa hư hỏng, thiếu tự tin…": nhiều kẻ bắt nạt có địa vị xã hội cao, kỹ năng xã hội không kém, bắt nạt vì có lợi (được chú ý, được nể sợ).'
    loai: phat-hien
    ket_qua: da-bo
    ghi_chu: 'Không mở được nguồn cho địa vị xã hội và động cơ; Salmivalli 1996 chỉ đọc được tiêu đề. Chữ cũ: Cả gạch đầu dòng ngộ nhận "Kẻ bắt nạt là đứa hư hỏng, thiếu tự tin, gia đình có vấn đề." Chữ mới: (bỏ) Lý do: Không kiểm được. Review (Claude Opus 5.5, 10/11/2026): Đã kiểm: trang không còn ngộ nhận "kẻ bắt nạt là đứa hư hỏng".'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu đã bỏ khỏi trang; không qua lượt 2.
    review: dung
  - id: n80
    cau: Xung đột ngang sức giữa bạn bè khác với bắt nạt, vốn có chênh lệch quyền lực và lặp lại theo định nghĩa; nhầm lẫn hai thứ có thể khiến vụ bắt nạt bị bỏ qua.
    loai: dinh-nghia
    nguon:
      - holt2015
    trich: Of the 3 core features of bullying set forth in the CDC uniform definition of bullying, most studies (n = 34) specified that aggressive acts were measured and tapped into the repeated nature of bullying (n = 31); approximately a quarter (n = 12) attempted to assess a power imbalance or differential.
    vi_tri: Holt (2015)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Xung đột ngang hàng thì đúng là bình thường và là cơ hội học kỹ năng xã hội… Nhầm lẫn hai thứ này là lý do nhiều vụ bắt nạt bị bỏ qua cho đến khi quá muộn." Chữ mới: "Xung đột ngang sức giữa bạn bè khác với bắt nạt… Nhầm lẫn hai thứ này có thể khiến vụ bắt nạt bị bỏ qua." Lý do: Bỏ "bình thường và là cơ hội học kỹ năng xã hội" và "cho đến khi quá muộn" (không có nguồn). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cdc.gov/youth-violence/about/about-bullying.html", "https://europepmc.org/article/MED/23297789" ]
    luot_2_ghi_chu: Phần 'nhầm lẫn có thể khiến vụ bắt nạt bị bỏ qua' là suy luận; phần định nghĩa đúng.
    review: dung
  - id: n81
    cau: '"Cho con học thêm càng nhiều càng tốt" không có bằng chứng ủng hộ trong nghiên cứu ở Huế, nơi đi học thêm gắn với stress học tập cao hơn.'
    loai: phat-hien
    nguon:
      - tran2024
    trich: attending extra classes were associated with overall academic stress.
    vi_tri: Tran (2024), Abstract
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…"càng nhiều càng tốt" là một niềm tin chưa có bằng chứng — và cái giá có thể là giấc ngủ, sức khỏe tinh thần của con." Chữ mới: "…"càng nhiều càng tốt" không có bằng chứng ủng hộ trong nghiên cứu này." Lý do: Bỏ vế "cái giá là giấc ngủ, sức khỏe tinh thần" (nghiên cứu Huế không thấy liên hệ của giấc ngủ/lối sống với stress). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC11442093/" ]
    luot_2_ghi_chu: Nghiên cứu Huế không đo lợi ích học tập của học thêm; 'không có bằng chứng ủng hộ' trong phạm vi nghiên cứu ấy là đúng.
    review: dung
  - id: n82
    cau: '"Áp lực thi cử giúp học sinh cố gắng hơn, càng áp lực càng giỏi": lo âu về thi cử liên quan âm với thành tích (von der Embse 2018), PISA 2015 thấy lo âu liên quan âm với điểm; nước có động lực cao cũng nhiều lo âu.'
    loai: phat-hien
    nguon:
      - vonderembse2018
      - oecd2017
    trich: test anxiety was significantly and negatively related to a wide range of educational performance outcomes (von der Embse); anxiety about schoolwork, homework and tests is negatively related to performance (OECD)
    vi_tri: von der Embse (2018), tóm tắt; OECD (2017), Overview
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "PISA 2015 cho thấy các nước lo âu về bài vở cao nhất không phải là các nước học kém nhất — nhưng Phần Lan chứng minh có thể đạt đỉnh cao mà không cần đỉnh lo âu. Áp lực vừa phải có thể tạo động lực; áp lực quá mức và kéo dài thì bào mòn cả sức khỏe lẫn kết quả học tập." Chữ mới: "Lo âu về thi cử nhìn chung liên quan đến thành tích thấp hơn (von der Embse…), và PISA 2015 thấy lo âu về bài vở liên quan âm với điểm… các nước có động lực cao cũng nhiều lo âu." Lý do: Bỏ "áp lực vừa phải tạo động lực" (không có nguồn), "bào mòn sức khỏe" (không kiểm). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/29156362", "https://web.archive.org/web/20240117003558if_/https://read.oecd.org/10.1787/9789264273856-en?format=pdf" ]
    review: dung
  - id: n83
    cau: 'Các liên kết "Đọc thêm" (Tuổi teen: mình là ai?; Não tuổi teen khác gì não người lớn?; Khi nào nên tìm sự giúp đỡ chuyên môn?) trỏ tới trang của site.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Chỗ cần chú ý: trong worktree chỉ có phat-trien/ban-sac-tuoi-teen.md; kham-pha/co-so-sinh-hoc/nao-tuoi-teen và kham-pha/suc-khoe-tam-than/tim-giup-do chưa có (lô khác). Link không đổi so với trước; kiểm khi gom nhánh. Review (Claude Opus 5.5, 10/11/2026): Đã kiểm: ban-sac-tuoi-teen có trang; co-so-sinh-hoc/nao-tuoi-teen và suc-khoe-tam-than/tim-giup-do có bản ghi ở trang.yml (chưa có trang trong worktree, hiện "sắp có"); kiểm lại khi gom.'
    review: dung
  - id: n84
    cau: 'Câu hỏi 1: ba tiêu chí của bắt nạt là hành vi gây hại có chủ ý, lặp đi lặp lại, trong quan hệ chênh lệch quyền lực; lời giải thích: ba tiêu chí phân biệt bắt nạt với xung đột ngang hàng hay sự cố đơn lẻ.'
    loai: dinh-nghia
    nguon:
      - holt2015
    trich: Of the 3 core features of bullying set forth in the CDC uniform definition of bullying, most studies (n = 34) specified that aggressive acts were measured and tapped into the repeated nature of bullying (n = 31); approximately a quarter (n = 12) attempted to assess a power imbalance or differential.
    vi_tri: Holt (2015)
    ket_qua: dung
    ghi_chu: Lời giải thích không dựa vào vị trí lựa chọn.
    luot_2: dung
    luot_2_nguon: [ "https://www.cdc.gov/youth-violence/about/about-bullying.html", "https://europepmc.org/article/MED/23297789" ]
    luot_2_ghi_chu: "Ba tiêu chí: gây hại có chủ ý, lặp lại, chênh lệch quyền lực."
  - id: n85
    cau: 'Câu hỏi 2: Ttofi và Farrington (2011) — trung bình giảm khoảng 20% bắt nạt và 17–20% nạn nhân; hiệu quả hơn khi họp phụ huynh, kỷ luật vững chắc, tăng giám sát; thành phần "làm việc với bạn cùng lứa" liên quan tăng nạn nhân (cần đọc thận trọng).'
    loai: phat-hien
    nguon:
      - ttofi2011
      - gaffney2021
    trich: on average, bullying decreased by 20-23 percent and victimization decreased by 17-20 percent. … Work with peers was associated with an increase in victimization.
    vi_tri: Ttofi (2011), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…hiệu quả nhất khi có họp phụ huynh… — còn ép "làm việc theo nhóm bạn" lại liên quan đến tăng nạn nhân." và lời giải thích "…can thiệp sai cách (hòa giải ép buộc khi chênh lệch quyền lực còn nguyên) có thể hại nhiều hơn lợi." Chữ mới: "…hiệu quả hơn khi có họp phụ huynh… còn thành phần "làm việc với bạn cùng lứa" lại liên quan đến tăng nạn nhân (một phát hiện cần đọc thận trọng)." và lời giải thích mới nêu Gaffney 2021. Lý do: "Hiệu quả nhất", "ép làm việc nhóm", "hòa giải ép buộc" không có trong nguồn. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Đọc lại bản ghi NCJRS (ojp.gov, tóm tắt đã xuất bản của Ttofi & Farrington 2011, 10/11/2026): '
    luot_2: dung
    luot_2_nguon: [ "https://link.springer.com/article/10.1007/s11292-010-9109-1" ]
    review: dung
  - id: n86
    cau: 'Câu hỏi 3: Modecki (2014) — bắt nạt truyền thống phổ biến gấp đôi bắt nạt mạng và hai dạng tương quan cao; kết luận thực hành của tác giả.'
    loai: so-lieu
    nguon:
      - modecki2014
    trich: traditional bullying was twice as common as cyber bullying. Cyber and traditional bullying were also highly correlated
    vi_tri: Modecki (2014), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…(khoảng 35% so với khoảng 15%), hai dạng chồng lấp rất lớn — em bị bắt nạt trên mạng nhiều khả năng cũng bị bắt nạt ngoài đời." Lời giải thích: "…vì nạn nhân thường là cùng một người." Chữ mới: "…phổ biến gấp đôi bắt nạt trên mạng, và hai dạng tương quan cao với nhau." Lời giải thích: "…việc dính líu vào nhiều dạng gây hấn cùng lúc nên là mục tiêu chính…" Lựa chọn nhiễu: "…và hai dạng không liên quan gì nhau." Lý do: 35/15 không kiểm được; lựa chọn nhiễu đổi để vẫn sai rõ ràng và không trái nhận định nào. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/25168105" ]
    review: dung
  - id: n87
    cau: 'Câu hỏi 4: Trần và cộng sự (2024) — đi học thêm, là nữ, điểm số thấp hơn gắn với stress học tập cao hơn; điểm trung bình tăng từ 46,4 lên 53,5.'
    loai: so-lieu
    nguon:
      - tran2024
    trich: female gender, lower academic scores, and attending extra classes were associated with overall academic stress … increased from 46.4 ± 7.6 to 53.5 ± 10.8
    vi_tri: Tran (2024), Abstract
    ket_qua: dung
    ghi_chu: Giữ nguyên câu hỏi và lời giải thích; "đi cùng" được hiểu là liên hệ.
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC11442093/" ]
    luot_2_ghi_chu: Câu hỏi 4 gom 'đi học thêm, là nữ, điểm thấp hơn' (còn có nhiều anh chị em, cha học vấn cao).
  - id: n88
    cau: Tiêu đề và mô tả trang, mục "Đọc thêm", lời dẫn Hỗ trợ khớp với nội dung trang sau khi sửa; trang là bài mở rộng, dựa trên tre-hoc-the-nao (src/data/trang.yml), kiem_lai_truoc 2027-11.
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Đã kiểm trong src/data/trang.yml (dua_tren: tre-hoc-the-nao, kiem_lai_truoc: 2028-05). Đề xuất: giữ hạn 2028-05; nếu cần hạn ngắn hơn thì 2027-11 vì có số liệu thời sự về Việt Nam (n75) và nghiên cứu mới về chương trình chống bắt nạt. Review (Claude Opus 5.5, 10/11/2026): Câu cũ ghi kiem_lai_truoc 2028-05; trang.yml nay ghi 2027-11 (người giao đã đổi). Sửa câu trong hồ sơ; 2027-11 không muộn hơn het_han sớm nhất của bài (n75: 2028-11-01).'
    review: sai
  - id: n89
    cau: 'NAMHS (đại diện quốc gia, 10–17 tuổi, dữ liệu 2021): 1,2% vị thành niên Việt Nam báo cáo bị bắt nạt trong ba tháng qua và 0,8% bắt nạt người khác; bị bắt nạt gắn với rối loạn tâm thần đánh giá bằng phỏng vấn chẩn đoán (aOR 4,71; KTC 1,82–12,21); các con số thấp xa mức "gần một phần ba" của UNESCO, có thể do định nghĩa và cách đo khác nhau.'
    loai: so-lieu
    nguon:
      - namhs-bully2025
    trich: 'For bullying victimisation, both Kenya (4.1%, 95% CI 3.4-5.0) and Indonesia (2.6%, 95% CI 1.9-3.6) had significantly higher prevalence than Vietnam (1.2%, 95% CI 0.9-1.67). … bullying perpetration (…) Vietnam (0.8%, 95% CI 0.5-1.2). … Vietnam: aOR 4.71, 95% CI 1.82-12.21'
    vi_tri: Findings từ NAMHS (2025), tóm tắt, Results
    ket_qua: dung
    ghi_chu: Câu mới thêm sau khi tìm số liệu quốc gia (Europe PMC 10/11/2026). Vế "có thể do định nghĩa và cách đo" là suy luận của trang, đã ghi "có thể"; khoảng thời gian 3 tháng so với "tháng trước" của UNESCO là khác biệt thật.
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC12312254/" ]
    luot_2_ghi_chu: Phần so sánh với 'gần một phần ba' của UNESCO là diễn giải của trang (UNESCO toàn văn không mở được).
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: '"…bắt nạt trên mạng khác gì bắt nạt trực tiếp, và vì sao học sinh châu Á — trong đó có Việt Nam — lo âu về bài vở đến vậy."'
    moi: '"…bắt nạt trên mạng và trực tiếp liên quan thế nào, và áp lực thi cử qua số liệu PISA 2015 và một nghiên cứu dọc ở Huế."'
    ly_do: Việt Nam không có số liệu PISA 2015 cho chỉ số lo âu (OECD 2017), nên không thể nói học sinh Việt lo âu "đến vậy" theo PISA; "định nghĩa của Olweus" đổi thành "theo Olweus và CDC". (nhận định n1)
  - cu: '"…ba dấu hiệu mà nhà nghiên cứu Dan Olweus dùng để định nghĩa bắt nạt".'
    moi: '"…ba dấu hiệu trong định nghĩa bắt nạt theo Olweus và theo CDC".'
    ly_do: Nguồn đã mở nêu ba nét cốt lõi của định nghĩa CDC; định nghĩa Olweus theo sách không mở được. (nhận định n2)
  - cu: '"…do nhà tâm lý học người Na Uy Dan Olweus — người tiên phong nghiên cứu lĩnh vực này từ những năm 1970 — đề xuất: một học sinh bị bắt nạt khi em bị phơi nhiễm… (Olweus, 1993)".'
    moi: '"…bắt nguồn từ công trình của nhà tâm lý học Dan Olweus. Theo định nghĩa trong sách của ông (Olweus, 1993; chúng tôi không mở được sách gốc)… Định nghĩa thống nhất của CDC cũng gồm ba nét cốt lõi (Holt và cộng sự, 2015)".'
    ly_do: Bỏ quốc tịch và "từ những năm 1970" (không kiểm được); nêu rõ chưa mở sách. (nhận định n4)
  - cu: '"…phân biệt bắt nạt với những thứ trông giống nó: đùa giỡn thô bạo giữa bạn bè ngang sức (rough-and-tumble play), hay một vụ xung đột tay đôi."'
    moi: '"…phân biệt bắt nạt với những thứ trông giống nó: một vụ xung đột tay đôi hay một sự cố đơn lẻ."'
    ly_do: Bỏ "rough-and-tumble play" (không có nguồn đã mở). (nhận định n5)
  - cu: '"Bắt nạt có nhiều hình thức: thể chất (đánh, xô đẩy, phá đồ), lời nói (chế nhạo, đe dọa, đặt biệt danh), quan hệ (tẩy chay, tung tin đồn, cô lập khỏi nhóm), và trên mạng (cyberbullying — quấy rối qua điện thoại, mạng xã hội)."'
    moi: '"Bắt nạt có thể diễn ra trực tiếp (thể chất, lời nói, quan hệ như tẩy chay) hay trên mạng… Modecki… đo cả hai dạng và thấy chúng tương quan cao với nhau."'
    ly_do: Danh sách ví dụ chi tiết không có trong nguồn đã mở; giữ phân loại chung. (nhận định n7)
  - cu: '"Bắt nạt trên mạng có vài nét riêng: kẻ bắt nạt có thể ẩn danh, nạn nhân bị tấn công cả khi đã về nhà, và một nội dung xấu hổ có thể lan đến hàng trăm người chỉ trong vài giờ."'
    moi: (bỏ)
    ly_do: Không kiểm được. (nhận định n8)
  - cu: '"…gần một phần ba học sinh trên thế giới từng bị bắt nạt ít nhất một lần trong tháng trước đó, và khoảng một phần mười là nạn nhân của bắt nạt trên mạng (UNESCO, 2019)."'
    moi: '"…gần một phần ba học sinh từng bị bắt nạt ít nhất một lần ở trường trong tháng trước đó, và bắt nạt qua mạng và điện thoại đang tăng (theo bản tin của Liên Hợp Quốc về báo cáo)."'
    ly_do: '"Một phần mười" cho bắt nạt mạng không kiểm được; nguồn nói "đang tăng". Thêm "ở trường". (nhận định n9)'
  - cu: '"…nguy cơ cảm thấy mình là "người ngoài" ở trường cao gần gấp ba lần và vắng mặt ở trường cao hơn gấp đôi so với các bạn không bị bắt nạt (UNESCO, 2019)."'
    moi: '"…cảm thấy bị xa lánh cao gần gấp ba lần và vắng mặt ở trường cao hơn gấp đôi so với các bạn khác."'
    ly_do: Theo chữ của bản tin ("shunned"); so với "các bạn khác", không phải "các bạn không bị bắt nạt". (nhận định n10)
  - cu: '"…khoảng 35% dính líu đến bắt nạt truyền thống… khoảng 15% dính líu đến bắt nạt trên mạng… hơn 300.000 thanh thiếu niên… em nào bị bắt nạt trên mạng thì nhiều khả năng cũng bị bắt nạt ngoài đời, và ngược lại".'
    moi: '"…bắt nạt truyền thống phổ biến gấp đôi bắt nạt trên mạng và hai dạng này tương quan cao".'
    ly_do: 35%, 15%, 300.000 và "với vai trò nạn nhân hoặc kẻ bắt nạt" không có trong tóm tắt, không mở được toàn văn (các nguồn thứ cấp cũng mâu thuẫn về việc 35% là nạn nhân hay tổng). (nhận định n11)
  - cu: '"…nguồn lực phòng ngừa nên nhắm vào hành vi bắt nạt nói chung, thay vì tách riêng "chống bắt nạt mạng" như một vấn đề hoàn toàn khác".'
    moi: '"…việc dính líu vào nhiều dạng gây hấn cùng lúc nên là mục tiêu chính của can thiệp và chính sách, thay vì tách riêng…".'
    ly_do: Theo chữ "polyaggression involvement" của tóm tắt; thêm điểm cách đo ảnh hưởng tỉ lệ. (nhận định n12)
  - cu: '"Bắt nạt thường đạt đỉnh ở cấp trung học cơ sở (khoảng 11–14 tuổi) — đúng độ tuổi mà nhu cầu được bạn bè chấp nhận lên cao nhất."'
    moi: (bỏ)
    ly_do: Không kiểm được. (nhận định n13)
  - cu: '"Singapore — một trong những nền giáo dục đứng đầu thế giới — có chỉ số lo âu này cao nhất trong các nước tham gia (OECD, 2017), trong khi Phần Lan (cũng thuộc top đầu) lại thấp nhất."'
    moi: '"Singapore nằm trong nhóm có chỉ số lo âu cao nhất (0,57, sau Brazil và Costa Rica, cùng 0,60), trong khi Phần Lan thấp (−0,41; Hà Lan −0,54 và Thụy Sĩ −0,44 còn thấp hơn)".'
    ly_do: 'Sai: Singapore thứ ba, Phần Lan không thấp nhất; thứ hạng giáo dục không kiểm được. (nhận định n15)'
  - cu: '"Nói cách khác: học giỏi và lo âu không loại trừ nhau — ở nhiều nơi, chúng đi cùng nhau."'
    moi: '"OECD ghi nhận rằng các nước mà học sinh có động lực thành tích cao cũng thường là nước nhiều học sinh lo âu về bài thi, trong khi tần suất kiểm tra không liên quan đến mức lo âu".'
    ly_do: Nguồn nói về động lực thành tích, không phải "học giỏi". (nhận định n17)
  - cu: '"Phần Lan chứng minh có thể vừa học giỏi vừa ít lo âu, nếu văn hóa học đường ít so sánh và cạnh tranh hơn."'
    moi: '"Phần Lan, Hà Lan và Thụy Sĩ cho thấy kết quả học tập tốt có thể đi cùng học sinh hài lòng với cuộc sống (OECD, 2017)."'
    ly_do: Nguồn nói về hài lòng cuộc sống, không nói "văn hóa ít so sánh". (nhận định n18)
  - cu: '"Dan Olweus bắt đầu nghiên cứu tình trạng học sinh ức hiếp nhau ở Thụy Điển/Na Uy từ đầu thập niên 1970… Cuốn sách đầu tiên của ông, Aggression in the Schools (1978), là công trình khoa học có hệ thống đầu tiên về chủ đề này; đến Bullying at School (1993), ông hệ thống hóa định nghĩa ba tiêu chí…"'
    moi: '"Dan Olweus là nhà nghiên cứu đã gắn tên mình với việc nghiên cứu bắt nạt học đường và với [OBPP]; năm 2013 ông kể lại cách mối quan tâm và nghiên cứu của mình về bắt nạt bắt đầu, và cho rằng việc bị bắt nạt không chỉ là chuyện "vô hại, thoáng qua"."'
    ly_do: Không kiểm được thời điểm, nơi, lý do ban đầu, "đầu tiên"; chỉ giữ điều tóm tắt 2013 nói. (nhận định n20)
  - cu: '"…từ đầu thập niên 1970, sau một số vụ học sinh tự tử được cho là liên quan đến việc bị bắt nạt… là công trình khoa học có hệ thống đầu tiên… chương trình can thiệp toàn trường đầu tiên trên thế giới."'
    moi: (bỏ)
    ly_do: Không kiểm được; liên quan đến chủ đề tự tử nên càng không để câu chưa kiểm. (nhận định n21)
  - cu: '"toàn trường (thành lập ban điều phối, khảo sát ẩn danh học sinh, xây dựng nội quy chung chống bắt nạt, tăng cường giám sát ở "điểm nóng"…, họp phụ huynh), lớp học (đặt nội quy lớp, tổ chức thảo luận định kỳ), và cá nhân (can thiệp với từng em bắt nạt, nạn nhân và phụ huynh các em)".'
    moi: '"toàn trường (khảo sát ẩn danh, ban chống bắt nạt, tập huấn nhân viên, tăng giám sát ở các "điểm nóng"), lớp học (họp lớp định kỳ, nội quy rõ ràng) và cá nhân…"; thêm "theo một bài tổng quan năm 2026".'
    ly_do: Khớp chữ của tổng quan; bỏ "họp phụ huynh" ở cấp toàn trường và "nội quy chung" (nguồn xếp phụ huynh ở cấp cá nhân). (nhận định n23)
  - cu: '"Nền tảng của chương trình là bốn nguyên tắc: môi trường có sự ấm áp, quan tâm và tham gia của người lớn; đặt giới hạn vững chắc…" và gạch đầu dòng "Mô hình của Olweus: ấm áp + giới hạn vững chắc".'
    moi: (bỏ cả hai chỗ; thay bằng bullet "Chương trình toàn trường" theo Gaffney 2021)
    ly_do: Không kiểm được. (nhận định n24)
  - cu: '"Đánh giá triển khai OBPP ở Mỹ cho thấy chương trình làm giảm đáng kể tỉ lệ bắt nạt và nạn nhân khi được thực hiện đúng (Olweus và Limber, 2010)."'
    moi: '"Olweus và Limber (2010) thấy các nghiên cứu ở Na Uy cho bằng chứng thuyết phục về hiệu quả; các đánh giá ở Mỹ không đồng nhất, nhưng cho thấy chương trình có tác động tích cực lên việc học sinh tự báo cáo dính líu vào bắt nạt và hành vi chống đối xã hội."'
    ly_do: Tóm tắt nói "không đồng nhất", không nói "giảm đáng kể" hay "khi được thực hiện đúng". (nhận định n25)
  - cu: '"…rà soát toàn bộ tài liệu đến giữa năm 2009 (35 tạp chí đọc tay toàn bộ, 18 cơ sở dữ liệu điện tử…)… phân tích tổng hợp lớn nhất về chủ đề này tính đến thời điểm đó."'
    moi: '"…rà soát tài liệu nhiều nguồn, kể cả báo cáo chưa công bố và ngôn ngữ ngoài tiếng Anh…"'
    ly_do: Số tạp chí, cơ sở dữ liệu, mốc 2009 và "lớn nhất" không có trong phần đã đọc. (nhận định n26)
  - cu: '"…được triển khai chuyên sâu, dài hơi."'
    moi: '"…triển khai chuyên sâu."'
    ly_do: '"Dài hơi" không có trong tóm tắt. (nhận định n28)'
  - cu: '"…các chương trình cho học sinh "làm việc với nhau theo nhóm bạn" (work with peers — ví dụ bắt nạn nhân và kẻ bắt nạt ngồi lại "hòa giải" với nhau) lại liên quan đến việc tăng tỉ lệ nạn nhân. Bài học: can thiệp sai cách có thể hại nhiều hơn lợi."'
    moi: '"…các chương trình có thành phần "làm việc với bạn cùng lứa" (work with peers) lại liên quan đến việc tăng tỉ lệ nạn nhân… cần đọc thận trọng: tóm tắt không nêu rõ các hoạt động cụ thể" + kết quả của Gaffney 2021.'
    ly_do: Ví dụ "bắt hòa giải" và "bài học" không có trong tóm tắt; thêm kết quả không đồng nhất của phân tích sau. (nhận định n29)
  - cu: '"…với gần gấp đôi số đánh giá (100 chương trình)…".'
    moi: '"Một phân tích cập nhật của cùng nhóm, với 100 đánh giá, thấy… khác biệt lớn giữa các nghiên cứu".'
    ly_do: Nguồn nói 100 "evaluations", không phải 100 chương trình; số chương trình của bài 2011 là 53 (44 có số liệu). (nhận định n30)
  - cu: '"…dự báo mạnh nhất của việc bị bắt nạt trên mạng chính là đang bị bắt nạt ngoài đời — và trong các yếu tố gắn với hành vi bắt nạt mạng, mạnh nhất là những niềm tin "gây hấn là bình thường" cùng sự tách rời đạo đức".'
    moi: '"…các liên hệ mạnh nhất với việc bị bắt nạt mạng là căng thẳng và ý nghĩ tự tử…" (vế bắt nạt mạng của người gây hấn giữ nguyên).'
    ly_do: Tóm tắt nói liên hệ mạnh nhất của victimization là stress và ý nghĩ tự tử, không phải "đang bị bắt nạt ngoài đời"; không dùng từ "dự báo" (cắt ngang). (nhận định n32)
  - cu: '"…47 nghiên cứu (61,7% mẫu ngoài nước Mỹ)…" (mô tả mẫu).'
    moi: '"…47 nghiên cứu cắt ngang (38,3% từ Mỹ, 61,7% ngoài Mỹ)…".'
    ly_do: Thêm "cắt ngang" theo tóm tắt (cần cho hạn chế nhân quả). (nhận định n33)
  - cu: '"…trong đó nhóm vừa bắt nạt vừa bị bắt nạt (bully-victim) có nguy cơ cao nhất."'
    moi: (bỏ vế "bully-victim có nguy cơ cao nhất")
    ly_do: Tóm tắt không nói nhóm nào cao nhất. (nhận định n34)
  - cu: '"…ý nghĩ tự tử cao gấp khoảng 2,2 lần và hành vi tự tử gấp khoảng 2,5 lần — và liên hệ giữa bắt nạt mạng với ý nghĩ tự tử (OR = 3,1) còn mạnh hơn có ý nghĩa thống kê so với bắt nạt truyền thống (OR = 2,2)."'
    moi: '"…OR 2,23… OR 2,55… bắt nạt mạng liên quan đến ý nghĩ tự tử mạnh hơn bắt nạt truyền thống".'
    ly_do: OR 3,1 và 2,2 cho hai dạng không có trong tóm tắt; "cao gấp 2,2 lần" diễn giải sai OR thành nguy cơ. (nhận định n35)
  - cu: '"Đây là mối liên hệ tương quan, không phải "bị bắt nạt thì sẽ..."."'
    moi: '"Đây là mối liên hệ… Các nghiên cứu được tổng hợp là cắt ngang nên không cho biết chiều nhân quả…"'
    ly_do: Thêm lý do theo nguồn. (nhận định n36)
  - cu: '"…hãy nói ra với một người lớn mà bạn tin tưởng — cha mẹ, thầy cô — hoặc tìm đến dịch vụ hỗ trợ tâm lý… Nếu bạn hoặc người thân đang nghĩ đến việc tự làm hại mình, hãy gọi 115."'
    moi: '"…hoặc tìm người có chuyên môn… Nếu bạn hoặc người thân đang nghĩ đến việc tự làm hại mình, hãy nói ngay với người có chuyên môn; xem [Hỗ trợ](/psyche/ho-tro/) để biết nơi liên hệ."'
    ly_do: 'Theo lời giao: dẫn Hỗ trợ thay vì chỉ một số điện thoại không kiểm ở trang này. (nhận định n37)'
  - cu: '"…trên 611 học sinh của 4 trường trung học… Có 341 em hoàn thành cả hai đợt khảo sát." và "ESSA… xây dựng và kiểm định trên học sinh Trung Quốc rồi kiểm định lại trên học sinh TP. Hồ Chí Minh".'
    moi: '"611 em được mời, 341 em có đủ dữ liệu ở cả hai đợt (lúc đầu học lớp 6, cuối là lớp 9)… ESSA, xây dựng và kiểm định trên học sinh Trung Quốc; Sun và cộng sự, 2011".'
    ly_do: 611 là số được mời (517 và 479 tham gia hai đợt; 341 phân tích); bỏ "kiểm định lại trên học sinh TP. Hồ Chí Minh" (bài Tran nêu một kiểm định ESSA ở Việt Nam không rõ địa điểm; chưa mở). (nhận định n39)
  - cu: '"Các yếu tố gắn với stress cao hơn gồm: là nữ, điểm số thấp hơn, đi học thêm, đông anh chị em, và cha có trình độ học vấn cao hơn."'
    moi: Danh sách như cũ, thêm "đo ở đợt đầu… ở đợt sau" và "các yếu tố lối sống không liên quan".
    ly_do: Nêu rõ thiết kế (yếu tố đầu kỳ liên quan stress cuối kỳ) và kết quả âm tính. (nhận định n42)
  - cu: '"Đây là một trong số ít nghiên cứu dọc về stress học tập trên học sinh Việt Nam được công bố quốc tế."'
    moi: '"Theo các tác giả, đây là nghiên cứu dọc đầu tiên… ở học sinh trung học cơ sở Việt Nam."'
    ly_do: Theo chữ của tác giả, "to the best of our knowledge". (nhận định n44)
  - cu: '"Định nghĩa của Olweus đã được giới nghiên cứu dùng thống nhất suốt hơn 40 năm và được UNESCO, CDC Mỹ cùng nhiều tổ chức khác chấp nhận."'
    moi: '"Ba tiêu chí này là nền của định nghĩa theo Olweus và của định nghĩa thống nhất của CDC… Nhãn nói về định nghĩa, không về tỉ lệ: nhiều nghiên cứu không đo đủ ba tiêu chí".'
    ly_do: '"Thống nhất suốt hơn 40 năm" bị Holt (2015) làm yếu (nhiều nghiên cứu không đo đủ ba tiêu chí); "UNESCO… chấp nhận" không kiểm được. (nhận định n45)'
  - cu: 'Tiêu đề khung: "bị bắt nạt gắn liền với lo âu, trầm cảm và kết quả học tập kém hơn" và "đã được tái hiện nhất quán qua hàng trăm nghiên cứu".'
    moi: '"bị bắt nạt gắn liền với trầm cảm về sau và với ý nghĩ tự tử" kèm OR và nguồn.'
    ly_do: Không mở được nguồn cho "lo âu" và "kết quả học tập kém hơn", và "hàng trăm nghiên cứu" không kiểm được. (nhận định n46)
  - cu: '"Hai phân tích tổng hợp cách nhau một thập niên đều kết luận các chương trình làm giảm hành vi bắt nạt khoảng 15–20%. Hiệu quả… phụ thuộc vào việc có họp phụ huynh, kỷ luật vững chắc, giám sát sân chơi và triển khai đủ chuyên sâu hay không."'
    moi: '"…khoảng 20% và nạn nhân khoảng 15–20%… thành phần nào quan trọng thì các phân tích chưa hoàn toàn thống nhất (Ttofi và Farrington, 2011; Gaffney và cộng sự, 2021), và các đánh giá OBPP ở Mỹ không đồng nhất".'
    ly_do: Số liệu đúng hơn (bắt nạt ~20%, nạn nhân 15–20%) và nêu sự không thống nhất về thành phần. (nhận định n47)
  - cu: '"Tỉ lệ 35% so với 15% trong phân tích của Modecki… là con số trung bình gộp — tỉ lệ cụ thể dao động mạnh giữa các nghiên cứu tùy cách đo."'
    moi: '"…bắt nạt truyền thống phổ biến gấp đôi bắt nạt trên mạng… cách đo khác nhau làm tỉ lệ khác nhau."'
    ly_do: Bỏ 35%/15% (không kiểm được). (nhận định n48)
  - cu: '"Các phân tích tổng hợp đều là nghiên cứu cắt ngang… cũng chưa tách hết vai trò của các yếu tố trung gian như trầm cảm có sẵn. Giới nghiên cứu đồng thuận rằng bắt nạt là một yếu tố nguy cơ nghiêm trọng…"'
    moi: '"Phân tích của Holt và cộng sự (2015) chỉ gồm các nghiên cứu cắt ngang… tác giả của tổng hợp về trầm cảm cũng nói các suy luận nhân quả chỉ là tạm thời… Bắt nạt là một yếu tố nguy cơ đáng nghiêm túc".'
    ly_do: '"Đều là cắt ngang" và "đồng thuận" không kiểm được cho cả các tổng hợp; "trầm cảm có sẵn" không có trong nguồn. (nhận định n49)'
  - cu: '"Bằng chứng ủng hộ kỷ luật vững chắc, nhất quán và không thù địch — chứ không phải các biện pháp loại trừ kiểu "đuổi học ngay lập tức"… Đáng chú ý, phân tích của Ttofi và Farrington còn phát hiện các chương trình ép nạn nhân và kẻ bắt nạt "làm việc với nhau" theo nhóm bạn lại liên quan đến tăng tỉ lệ nạn nhân."'
    moi: '"Bằng chứng ủng hộ kỷ luật vững chắc (Ttofi và Farrington, 2011…). Còn các chính sách "không khoan nhượng"… tổng quan của APA (2008)…".'
    ly_do: '"Nhất quán và không thù địch" không có trong tóm tắt; vế "ép… làm việc với nhau" không đúng với nguồn (xem n29). (nhận định n50)'
  - cu: '"…từng bắt nạt người khác ở trường là yếu tố dự báo phạm tội sau này (tỉ số chênh hiệu chỉnh khoảng 1,9)… (Ttofi, Farrington, Lösel và Loeber, 2011; Ttofi, Farrington và Lösel, 2012)".'
    moi: '"…tỉ số chênh hiệu chỉnh khoảng 1,8; Ttofi và cộng sự, 2011… Olweus (2013) cũng kết luận bắt nạt không chỉ là vấn đề vô hại và thoáng qua".'
    ly_do: OR hiệu chỉnh là 1,82 (đúng 1,8, không phải 1,9); bài Ttofi 2012 (bạo lực) không mở được nên bỏ khỏi trang và danh sách nguồn. (nhận định n51)
  - cu: '"…dự báo trầm cảm sau trung bình gần 7 năm (tỉ số chênh khoảng 2,0; vẫn khoảng 1,7…)".'
    moi: Giữ "khoảng 2,0 / 1,7", thêm 6,9 năm; đổi phạm tội 1,9 → 1,8.
    ly_do: Số liệu đúng theo tóm tắt. (nhận định n52)
  - cu: '"Salmivalli… chỉ ra rằng… ngoài kẻ bắt nạt và nạn nhân còn có các vai trò khác: người tiếp tay, người cổ vũ (cười, reo hò — vô tình "thưởng"), người ngoài cuộc (đứng nhìn, im lặng — sự im lặng cũng là một thông điệp), người bảo vệ. Kẻ bắt nạt thường có địa vị xã hội cao… (Salmivalli và cộng sự, 1996)."'
    moi: '"Salmivalli… xem bắt nạt như một quá trình nhóm và xét các vai trò tham gia… Cách nhìn này gợi ý rằng ngoài kẻ bắt nạt và nạn nhân còn có những người tiếp tay, cổ vũ, đứng ngoài cuộc và bảo vệ."'
    ly_do: Bỏ "địa vị xã hội cao" và các mô tả vai trò (không mở được nguồn nói điều đó). (nhận định n53)
  - cu: '"…các chương trình hiệu quả như KiVa của Phần Lan nhắm vào người chứng kiến: dạy cả lớp cách không cổ vũ và dám bảo vệ bạn."'
    moi: '"…chương trình KiVa của Phần Lan nhấn mạnh vai trò của người chứng kiến (theo một tổng quan năm 2026)."'
    ly_do: Bỏ mô tả nội dung huấn luyện (không kiểm được). (nhận định n54)
  - cu: '"…đánh giá quy mô lớn ở Phần Lan (78 trường, hơn 8.000 học sinh) cho thấy nó giảm được cả tỉ lệ bắt nạt lẫn nạn nhân (Kärnä và cộng sự, 2011)."'
    moi: '"…một thử nghiệm ngẫu nhiên ở 78 trường với hơn 8.000 học sinh lớp 4–6 thấy sau 9 tháng chương trình có tác động tốt lên nhiều chỉ số, kể cả bắt nạt và bị bắt nạt do học sinh tự báo cáo".'
    ly_do: Nêu thiết kế ngẫu nhiên, lớp 4–6, 9 tháng, 7/11 biến. (nhận định n55)
  - cu: 'Tiêu đề mục 2 (":nhan[kha-vung]") và "Đa số vụ bắt nạt diễn ra trước mặt người khác. Bạn không cần lao vào can ngăn một cách nguy hiểm: chỉ cần không cười theo, không chia sẻ clip bắt nạt, và sau đó đến bên nạn nhân… cũng đã phá vỡ "phần thưởng xã hội" nuôi dưỡng kẻ bắt nạt. Các chương trình như KiVa thành công chính nhờ huấn luyện cả lớp làm điều này".'
    moi: '"Chương trình KiVa… nhấn mạnh vai trò của người chứng kiến, và một thử nghiệm ngẫu nhiên… Những việc như không cười theo… là gợi ý thực hành hợp lý theo hướng này; chúng tôi không có nghiên cứu nào đo riêng từng hành vi ấy."'
    ly_do: Bỏ "đa số vụ bắt nạt diễn ra trước mặt người khác" và "phần thưởng xã hội" (không kiểm được); KiVa nhắm cả lớp nhưng không có nguồn nói "thành công chính nhờ" điều đó. (nhận định n56)
  - cu: '"Phân tích của Ttofi và Farrington chỉ ra họp phụ huynh là một trong những thành phần hiệu quả nhất."'
    moi: '"Ttofi và Farrington (2011) thấy họp phụ huynh đi cùng hiệu quả lớn hơn, và Gaffney… thông tin cho phụ huynh gắn với hiệu quả lớn hơn."'
    ly_do: Tóm tắt không xếp "một trong hiệu quả nhất". (nhận định n57)
  - cu: Tiêu đề mục 3 (":nhan[kha-vung]") giữ nguyên chip.
    moi: Giữ chip; nội dung mục viết lại theo n57 và n59.
    ly_do: Nhãn nay có co_so và lý do. (nhận định n58)
  - cu: '"…cha mẹ cần tin lời con trước, ghi lại diễn biến… và làm việc với giáo viên chủ nhiệm thay vì xông vào "xử" phụ huynh nhà kia — điều này thường khiến con bị trả đũa nặng hơn. Với bắt nạt trên mạng: lưu bằng chứng… chặn… báo cáo…".'
    moi: '"Các gợi ý cụ thể dưới đây là thông lệ thực hành, chưa phải kết quả của nghiên cứu mà chúng tôi đã kiểm: … cha mẹ có thể lắng nghe con trước, ghi lại diễn biến… trao đổi với giáo viên chủ nhiệm."'
    ly_do: Bỏ "thường khiến con bị trả đũa nặng hơn" (không kiểm được); "cần" → "có thể". (nhận định n59)
  - cu: (không có)
    moi: '"Nếu bị bắt nạt kéo dài làm em lo lắng nhiều hay thay đổi rõ về ăn, ngủ, đi học, hãy tìm người có chuyên môn; xem [Hỗ trợ]".'
    ly_do: Theo lời giao cho chủ đề bắt nạt kéo dài. (nhận định n60)
  - cu: '"Để gây hại cho người khác mà không cắn rứt, con người có một bộ "thủ thuật" tâm lý: đổ lỗi cho nạn nhân…, gọi hành vi bằng cái tên nhẹ nhàng hơn…, hay phân tán trách nhiệm… Nhận diện được các thủ thuật này… là bước đầu để vô hiệu hóa chúng."'
    moi: '"…niềm tin rằng gây hấn là bình thường và sự tách rời đạo đức… nằm trong các liên hệ mạnh nhất… Các cách nói "chỉ đùa thôi"… là ví dụ minh họa của chúng tôi".'
    ly_do: Danh sách ba "thủ thuật" và "bước đầu để vô hiệu hóa" không có trong nguồn đã mở; giữ phần Kowalski xác nhận. (nhận định n61)
  - cu: (không có; thay cho đoạn "Ở các nền giáo dục chịu ảnh hưởng văn hóa Nho giáo, điểm số… thể diện của cả gia đình… Phần Lan chứng minh có thể vừa học giỏi vừa ít lo âu, nếu văn hóa học đường ít so sánh và cạnh tranh hơn")
    moi: '"Lo âu về thi cử liên quan âm đến thành tích học tập (von der Embse và cộng sự, 2018, 238 nghiên cứu…); PISA 2015 cho thấy các nước có động lực thành tích cao cũng thường có nhiều học sinh lo âu…; Trần và cộng sự (2024) bàn luận rằng cha mẹ quá kiểm soát…"'
    ly_do: Bỏ "thể diện gia đình/Nho giáo" và "Phần Lan… nếu văn hóa ít so sánh" (không kiểm được). (nhận định n63)
  - cu: 'Tiêu đề mục 4 "Quản lý áp lực thi cử: phân biệt "lo âu vừa phải" với "lo âu độc hại"" và "Một chút căng thẳng trước kỳ thi là bình thường và thậm chí giúp tập trung."'
    moi: 'Tiêu đề "Áp lực thi cử: khi nào cần để ý" (giữ id cũ); "Chúng tôi không có nguồn cho việc một mức căng thẳng "vừa phải" có lợi cho thi cử."'
    ly_do: Không có nguồn đã mở cho Yerkes–Dodson trong bối cảnh thi cử; von der Embse thấy liên hệ âm. (nhận định n65)
  - cu: '"…khi lo âu đi kèm mất ngủ kéo dài, đau đầu/đau bụng trước mỗi kỳ thi, né tránh đến trường, hay suy nghĩ "thi trượt thì đời mình coi như bỏ" — đó là dấu hiệu cần hỗ trợ, không phải "cố thêm chút nữa"."'
    moi: '"…kéo dài và ảnh hưởng đến giấc ngủ, ăn uống, việc đến trường, hay em nói những điều cho thấy mất hy vọng, đó là lúc cần nói với người lớn tin cậy và tìm người có chuyên môn; xem Hỗ trợ."'
    ly_do: Bỏ danh sách triệu chứng giống dấu hiệu lâm sàng; chỉ dẫn tới người có chuyên môn. (nhận định n66)
  - cu: '"…cha mẹ nên cân nhắc: thêm giờ học có thực sự giúp con, hay chỉ đổi điểm số lấy sức khỏe tinh thần?"'
    moi: '"…cha mẹ có thể cân nhắc xem thêm giờ học có thực sự giúp con hay không, nhưng đó là liên hệ quan sát."'
    ly_do: Bỏ vế "đổi điểm số lấy sức khỏe tinh thần" (khẳng định nhân quả không có nguồn). (nhận định n67)
  - cu: '"Nếu cả ba đều "có", đó là bắt nạt — và cần can thiệp nghiêm túc, không phải "khuyên hai bên làm hòa" cho xong."'
    moi: '"…cần được nhà trường, gia đình xử lý nghiêm túc. Ba câu hỏi này là cách áp dụng định nghĩa nêu ở trên, không phải công cụ chẩn đoán."'
    ly_do: Bỏ "không phải khuyên hai bên làm hòa" (không có nguồn). (nhận định n68)
  - cu: '"Ở Việt Nam, một ngày của nhiều học sinh là: học chính khóa ở trường, rồi học thêm buổi tối, rồi làm bài tập đến khuya… Điều này không có nghĩa học thêm luôn xấu, nhưng đặt câu hỏi cho mỗi gia đình…"'
    moi: '"Học thêm và stress học tập… tăng từ 2018 đến 2021, một giai đoạn có đại dịch COVID-19 và các em lên lớp cuối cấp. Điều này không có nghĩa học thêm luôn xấu, nhưng đặt câu hỏi…"'
    ly_do: Bỏ mô tả "một ngày của nhiều học sinh" (không có nguồn), thêm bối cảnh COVID. (nhận định n69)
  - cu: '"Trong văn hóa chịu ảnh hưởng Nho giáo, điểm số không chỉ phản ánh năng lực của đứa trẻ mà còn là thể diện của cha mẹ — "con nhà người ta" trở thành thước đo khiến nhiều em cảm thấy mình là gánh nặng mỗi khi điểm kém."'
    moi: (bỏ)
    ly_do: Không kiểm được. (nhận định n70)
  - cu: Đoạn "Kỳ thi "một cửa"…" (kỳ thi một buổi sáng quyết định lối rẽ; suneung; Singapore đứng đầu PISA về lo âu; "Điểm chung của các nền giáo dục Đông Á… động lực cao đi cùng lo âu rất cao").
    moi: '(thay bằng đoạn "So sánh quốc tế": Việt Nam không có số liệu PISA 2015 cho chỉ số này; động lực cao và lo âu đi cùng nhau ở cấp nước theo OECD).'
    ly_do: Không kiểm được; vế Singapore sai. (nhận định n71)
  - cu: Đoạn "Bạo lực học đường trên báo chí Việt Nam…".
    moi: (bỏ)
    ly_do: Không kiểm được. (nhận định n72)
  - cu: Đoạn "Vai trò của giáo viên chủ nhiệm…".
    moi: 'Thay bằng đoạn "Bắt nạt ở trường": khảo sát ẩn danh, xử lý từng vụ việc riêng, nội quy rõ ràng là thành phần mô tả của OBPP (n74); chưa tìm thấy nghiên cứu đã mở so sánh cách "ép hai bên bắt tay làm hòa".'
    ly_do: Không kiểm được. (nhận định n73)
  - cu: '"Cách làm có bằng chứng hơn: trường tổ chức khảo sát ẩn danh định kỳ (như Bảng hỏi Bắt nạt/Nạn nhân của Olweus)… xử lý từng vụ việc riêng với từng bên; và đặt nội quy rõ ràng, thực thi nhất quán."'
    moi: '"…khảo sát ẩn danh định kỳ là một phần của chương trình như OBPP; xử lý từng vụ việc riêng với từng bên và đặt nội quy rõ ràng cũng nằm trong các thành phần được mô tả của chương trình này."'
    ly_do: '"Có bằng chứng hơn" và "Bảng hỏi Olweus" không kiểm được; viết đúng mức mô tả của tổng quan. (nhận định n74)'
  - cu: (không có)
    moi: Câu thời sự mới, có mốc và hạn, thay cho phê phán cách làm của giáo viên chủ nhiệm (n73).
    ly_do: 'Quy tắc câu "chưa tìm thấy": mốc, hạn, nguồn là lần tìm. (nhận định n75)'
  - cu: '"Thực tế ngược lại về độ phổ biến: bắt nạt truyền thống khoảng 35%, bắt nạt trên mạng khoảng 15%… Bắt nạt mạng đáng lo vì tính ẩn danh và lan truyền nhanh, nhưng nạn nhân thường là cùng một em bị bắt nạt ngoài đời — tách hai vấn đề ra xử lý riêng là kém hiệu quả."'
    moi: '"…bắt nạt truyền thống phổ biến gấp đôi bắt nạt trên mạng… hai dạng tương quan cao… tách chúng ra xử lý riêng không hẳn hiệu quả; Olweus (2013) còn nhận xét…".'
    ly_do: Bỏ 35/15, "ẩn danh và lan truyền nhanh", "cùng một em" (không kiểm được); thêm nhận xét của Olweus 2013. (nhận định n78)
  - cu: Cả gạch đầu dòng ngộ nhận "Kẻ bắt nạt là đứa hư hỏng, thiếu tự tin, gia đình có vấn đề."
    moi: (bỏ)
    ly_do: Không kiểm được. (nhận định n79)
  - cu: '"Xung đột ngang hàng thì đúng là bình thường và là cơ hội học kỹ năng xã hội… Nhầm lẫn hai thứ này là lý do nhiều vụ bắt nạt bị bỏ qua cho đến khi quá muộn."'
    moi: '"Xung đột ngang sức giữa bạn bè khác với bắt nạt… Nhầm lẫn hai thứ này có thể khiến vụ bắt nạt bị bỏ qua."'
    ly_do: Bỏ "bình thường và là cơ hội học kỹ năng xã hội" và "cho đến khi quá muộn" (không có nguồn). (nhận định n80)
  - cu: '"…"càng nhiều càng tốt" là một niềm tin chưa có bằng chứng — và cái giá có thể là giấc ngủ, sức khỏe tinh thần của con."'
    moi: '"…"càng nhiều càng tốt" không có bằng chứng ủng hộ trong nghiên cứu này."'
    ly_do: Bỏ vế "cái giá là giấc ngủ, sức khỏe tinh thần" (nghiên cứu Huế không thấy liên hệ của giấc ngủ/lối sống với stress). (nhận định n81)
  - cu: '"PISA 2015 cho thấy các nước lo âu về bài vở cao nhất không phải là các nước học kém nhất — nhưng Phần Lan chứng minh có thể đạt đỉnh cao mà không cần đỉnh lo âu. Áp lực vừa phải có thể tạo động lực; áp lực quá mức và kéo dài thì bào mòn cả sức khỏe lẫn kết quả học tập."'
    moi: '"Lo âu về thi cử nhìn chung liên quan đến thành tích thấp hơn (von der Embse…), và PISA 2015 thấy lo âu về bài vở liên quan âm với điểm… các nước có động lực cao cũng nhiều lo âu."'
    ly_do: Bỏ "áp lực vừa phải tạo động lực" (không có nguồn), "bào mòn sức khỏe" (không kiểm). (nhận định n82)
  - cu: '"…hiệu quả nhất khi có họp phụ huynh… — còn ép "làm việc theo nhóm bạn" lại liên quan đến tăng nạn nhân." và lời giải thích "…can thiệp sai cách (hòa giải ép buộc khi chênh lệch quyền lực còn nguyên) có thể hại nhiều hơn lợi."'
    moi: '"…hiệu quả hơn khi có họp phụ huynh… còn thành phần "làm việc với bạn cùng lứa" lại liên quan đến tăng nạn nhân (một phát hiện cần đọc thận trọng)." và lời giải thích mới nêu Gaffney 2021.'
    ly_do: '"Hiệu quả nhất", "ép làm việc nhóm", "hòa giải ép buộc" không có trong nguồn. (nhận định n85)'
  - cu: '"…(khoảng 35% so với khoảng 15%), hai dạng chồng lấp rất lớn — em bị bắt nạt trên mạng nhiều khả năng cũng bị bắt nạt ngoài đời." Lời giải thích: "…vì nạn nhân thường là cùng một người."'
    moi: '"…phổ biến gấp đôi bắt nạt trên mạng, và hai dạng tương quan cao với nhau." Lời giải thích: "…việc dính líu vào nhiều dạng gây hấn cùng lúc nên là mục tiêu chính…" Lựa chọn nhiễu: "…và hai dạng không liên quan gì nhau."'
    ly_do: 35/15 không kiểm được; lựa chọn nhiễu đổi để vẫn sai rõ ràng và không trái nhận định nào. (nhận định n86)
  - cu: '"…hoặc tìm người có chuyên môn; xin giúp đỡ là dấu hiệu của sức mạnh, không phải của yếu đuối."'
    moi: '"…hoặc tìm người có chuyên môn, như UNICEF khuyên."'
    ly_do: 'Review: vế "xin giúp đỡ là dấu hiệu của sức mạnh" không có nguồn; lời khuyên nói với người lớn tin cậy, tìm người có chuyên môn theo UNICEF. (nhận định n37)'
  - cu: Khung ":::vung-chac[bắt nạt được định nghĩa bằng ba tiêu chí…]" … "Nhãn nói về định nghĩa, không về tỉ lệ…"
    moi: 'Khung ":::kha-vung[…cùng ý chính…]" … "Nhưng đây là một định nghĩa quy ước, không phải một kết quả đo được, và các nghiên cứu đo nó khác nhau: trong 47 nghiên cứu…, chỉ khoảng một phần tư cố đánh giá chênh lệch quyền lực. Vì vậy nhãn là "khá vững"…"'
    ly_do: "Review: Vững chắc đòi phân tích tổng hợp hay tái lập lớn; một định nghĩa quy ước không đạt, và Holt 2015 cho thấy cách đo không thống nhất (lượt 2 quá mạnh). (nhận định n45)"
  - cu: Khung ":::bac-bo['trừng phạt thật nặng là cách tốt nhất để xóa bắt nạt']" … "Nhãn dựa trên đồng thuận của các tổng quan này…"
    moi: Khung ":::kha-vung[chính sách kỷ luật "không khoan nhượng" chưa có bằng chứng ủng hộ]" … "Nhãn chỉ là "khá vững" vì tổng quan của APA không riêng cho bắt nạt, và chưa có phân tích tổng hợp nào so sánh trực tiếp mức độ trừng phạt…"
    ly_do: 'Review: Đã bị bác bỏ đòi các kiểm tra đủ mạnh liên tục thất bại; nguồn chỉ có tổng quan APA 2008 (kỷ luật học đường nói chung: "surprisingly few data … tend to contradict"), còn Ttofi 2011 thấy kỷ luật vững chắc gắn với hiệu quả lớn hơn. (nhận định n50)'
  - cu: '"(chúng tôi chỉ đọc được tiêu đề và thông tin xuất bản, không mở được toàn văn). Cách nhìn này gợi ý rằng ngoài kẻ bắt nạt và nạn nhân còn có những người tiếp tay, cổ vũ, đứng ngoài cuộc và bảo vệ."'
    moi: '"Trong nghiên cứu trên 573 học sinh lớp 6 ở Phần Lan, ngoài kẻ bắt nạt và nạn nhân, các tác giả xếp học sinh vào các vai người tiếp tay và người cổ vũ kẻ bắt nạt, người bảo vệ nạn nhân, và người đứng ngoài (chúng tôi chỉ đọc được tóm tắt)."'
    ly_do: 'Review đọc được tóm tắt Salmivalli 1996 qua OpenAlex: "573 Finnish sixth-grade children … Victim, Bully, Reinforcer of the bully, Assistant of the bully, Defender of the victim, and Outsider". (nhận định n53)'
  - cu: '"### 1. Nhận diện đúng: dùng "bộ lọc" ba tiêu chí :nhan[vung-chac]"'
    moi: '"### 1. Nhận diện đúng: dùng "bộ lọc" ba tiêu chí :nhan[kha-vung] { #1-nhan-dien-dung-dung-bo-loc-ba-tieu-chi-vung-chac }"'
    ly_do: "Review: như n45; id cũ giữ. (nhận định n68)"
  - cu: '"### 2. Người chứng kiến là "chìa khóa" bị bỏ quên :nhan[kha-vung]" … "Những việc như không cười theo, không chia sẻ clip bắt nạt và sau đó đến hỏi thăm bạn bị bắt nạt là gợi ý thực hành hợp lý theo hướng này; chúng tôi không có nghiên cứu nào đo riêng từng hành vi ấy."'
    moi: '"### 2. Người chứng kiến: hướng đi hứa hẹn, bằng chứng chưa thống nhất :nhan[tranh-cai] { #2-nguoi-chung-kien-la-chia-khoa-bi-bo-quen-kha-vung }" … "Nhưng phân tích trước đó của Ttofi và Farrington (2011) lại thấy thành phần "làm việc với bạn cùng lứa" đi cùng tỉ lệ nạn nhân tăng, và thử nghiệm KiVa đánh giá cả chương trình chứ không tách riêng phần dành cho người chứng kiến. Vì vậy chưa thể nói người chứng kiến là "chìa khóa". Khi bạn mình bị bắt nạt trên mạng, UNICEF khuyên lắng nghe bạn và giúp bạn tìm một người lớn tin cậy."'
    ly_do: "Review: hai phân tích tổng hợp thành phần cho kết quả trái chiều về vai trò bạn cùng lứa (Ttofi 2011; Gaffney 2021), nên Đang tranh cãi (lượt 2 quá mạnh); các hành vi gợi ý cũ không có nguồn, thay bằng lời khuyên của UNICEF. Id cũ giữ. (nhận định n56)"
  - cu: '"Các gợi ý cụ thể dưới đây là thông lệ thực hành, chưa phải kết quả của nghiên cứu mà chúng tôi đã kiểm: khi con bị bắt nạt, cha mẹ có thể lắng nghe con trước, ghi lại diễn biến (ngày giờ, ai làm gì, có ai chứng kiến) và trao đổi với giáo viên chủ nhiệm. Với bắt nạt trên mạng, có thể lưu bằng chứng (chụp màn hình), chặn tài khoản quấy rối, báo cáo với nền tảng và nói với người lớn tin cậy."'
    moi: '"UNICEF khuyên trẻ bị bắt nạt tìm sự giúp đỡ của cha mẹ, người thân hay một người lớn tin cậy; với bắt nạt trên mạng, có thể chặn tài khoản quấy rối, báo cáo với nền tảng và lưu bằng chứng (tin nhắn, ảnh chụp màn hình). Đây là lời khuyên của một tổ chức, chưa phải kết quả của nghiên cứu mà chúng tôi đã kiểm."'
    ly_do: 'Review: các bước "ghi lại diễn biến", "trao đổi với giáo viên chủ nhiệm" không có nguồn đã mở; giữ phần UNICEF nêu. (nhận định n59)'
  - cu: '"…hãy tìm người có chuyên môn; xem [Hỗ trợ]…" (bắt nạt kéo dài) và "Nếu căng thẳng về thi cử kéo dài và ảnh hưởng đến giấc ngủ, ăn uống, việc đến trường, hay em nói những điều cho thấy mất hy vọng, đó là lúc cần nói với người lớn tin cậy và tìm người có chuyên môn…"'
    moi: '"…hãy tìm người có chuyên môn (với bắt nạt trên mạng, UNICEF nêu mất ngủ, đau đầu, đau bụng, nghỉ học trong các ảnh hưởng thường gặp)…" và "Theo NHS (Anh), học sinh căng thẳng vì thi cử có thể ngủ không ngon, ăn uống thay đổi hay thấy tương lai vô vọng, và nên tìm giúp đỡ khi lo âu hay buồn chán nặng, kéo dài và ảnh hưởng đến sinh hoạt hằng ngày: khi đó hãy nói với người lớn tin cậy và tìm người có chuyên môn…"'
    ly_do: "Review: thêm nguồn cho hai lời dẫn an toàn (lượt 2 không chắc vì không có nguồn): UNICEF, NHS. Không thêm số đường dây nóng. (nhận định n60, n66)"
  - cu: '"…khảo sát ẩn danh định kỳ là một phần của chương trình như OBPP; xử lý từng vụ việc riêng với từng bên và đặt nội quy rõ ràng cũng nằm trong các thành phần được mô tả của chương trình này."'
    moi: '"…khảo sát ẩn danh là một phần của chương trình như OBPP; đặt nội quy rõ ràng, làm việc riêng với em bắt nạt, em bị bắt nạt và phụ huynh cũng nằm trong các thành phần được mô tả của chương trình này (theo một bài tổng quan năm 2026)."'
    ly_do: 'Review: tổng quan 2026 viết "anonymous surveys" (không nói định kỳ) và "individual-level, targeting bullies and victims through counseling and parental involvement" (không phải "xử lý từng vụ việc riêng với từng bên"). (nhận định n74)'
  - cu: "Mục Nguồn: (không có)"
    moi: 'Thêm NHS "Help your child beat exam stress" và UNICEF "Cyberbullying: What is it and how to stop it".'
    ly_do: "Review: nguồn của n37, n56, n59, n60, n66."
