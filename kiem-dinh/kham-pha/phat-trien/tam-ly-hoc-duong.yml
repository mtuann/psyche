    ket_qua: da-sua
    ghi_chu: '"Chưa tìm thấy nghiên cứu đã mở so sánh cách ép bắt tay làm hòa" là kết quả tìm của chúng tôi (không phải khẳng định thời sự về Việt Nam): xem n75. Chữ cũ: "Cách làm có bằng chứng hơn: trường tổ chức khảo sát ẩn danh định kỳ (như Bảng hỏi Bắt nạt/Nạn nhân của Olweus)… xử lý từng vụ việc riêng với từng bên; và đặt nội quy rõ ràng, thực thi nhất quán." Chữ mới: "…khảo sát ẩn danh định kỳ là một phần của chương trình như OBPP; xử lý từng vụ việc riêng với từng bên và đặt nội quy rõ ràng cũng nằm trong các thành phần được mô tả của chương trình này." Lý do: "Có bằng chứng hơn" và "Bảng hỏi Olweus" không kiểm được; viết đúng mức mô tả của tổng quan. Review (Claude Opus 5.5, 10/11/2026): Lượt 2 không chắc đúng chỗ: tổng quan 2026 (PMC12782987, đọc lại) không có "định kỳ" và "xử lý từng vụ việc riêng với từng bên"; viết lại theo chữ nguồn và ghi "theo một bài tổng quan năm 2026"; doi_chu.'
