    ket_qua: da-sua
    ghi_chu: 'Lời dẫn an toàn theo lời giao, không phải chẩn đoán; không liệt kê dấu hiệu lâm sàng. Chữ cũ: "…khi lo âu đi kèm mất ngủ kéo dài, đau đầu/đau bụng trước mỗi kỳ thi, né tránh đến trường, hay suy nghĩ "thi trượt thì đời mình coi như bỏ" — đó là dấu hiệu cần hỗ trợ, không phải "cố thêm chút nữa"." Chữ mới: "…kéo dài và ảnh hưởng đến giấc ngủ, ăn uống, việc đến trường, hay em nói những điều cho thấy mất hy vọng, đó là lúc cần nói với người lớn tin cậy và tìm người có chuyên môn; xem Hỗ trợ." Lý do: Bỏ danh sách triệu chứng giống dấu hiệu lâm sàng; chỉ dẫn tới người có chuyên môn. Review (Claude Opus 5.5, 10/11/2026): Lượt 2 không chắc vì không có nguồn: NHS "Help your child beat exam stress" (đọc 10/11/2026) nêu đúng các dấu hiệu và khi nào tìm giúp đỡ. Trang ghi nguồn trong câu; doi_chu. Không chẩn đoán, không thêm số đường dây nóng.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Lời khuyên tìm người lớn tin cậy/chuyên môn: không có nguồn bậc 1-2 cụ thể cho câu này trong lượt 2."
