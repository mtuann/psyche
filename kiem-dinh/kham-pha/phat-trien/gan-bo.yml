  - id: n15
    cau: 'Bowlby (1958): gắn bó của bé với mẹ do các hành vi đặc trưng của loài (khóc, cười, bám, bú, đi theo), không phải vai trò cung cấp thức ăn của mẹ.'
    loai: lich-su
    trich: '(không áp dụng: câu đã bỏ)'
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ: cả đoạn "Trong bài báo ''The nature of the child''s tie to his mother'' (1958), Bowlby lập luận… bé không yêu mẹ vì mẹ cho bú". Đã bỏ cùng mục Bowlby 1958 trong danh sách nguồn; đổi tiêu đề mục thành "Bowlby (1969): một lý thuyết về gắn bó" giữ id cũ. Lý do: chưa mở được bài 1958 (International Journal of Psychoanalysis; không có trong kho kiểm được); không nguồn đã mở nào nêu các ý ấy. Lượt 2 có thể tìm bản đọc được để đưa lại. Review (Claude Opus 5.5, 10/11/2026): Đã kiểm: trang không còn đoạn Bowlby 1958; tiêu đề mục đổi, id cũ giữ bằng { #bowlby-1958-1969-gan-bo-la-mot-he-thong-ban-nang }. Bài 1958 không có trong bộ Internet Archive đã dò.'
    luot_2: khong-chac
    luot_2_ghi_chu: 'Bowlby 1958 (Int J Psychoanal 39, 350): không mở được bài gốc; OpenStax nêu Bowlby 1969 và Harlow nhưng không nêu danh sách "khóc, cười, bám, bú, đi theo" của 1958.'
    review: dung
  - id: n16
    cau: 'Bowlby (1969): kết hợp các khái niệm tiến hóa, sinh học, phát triển và nhận thức thành lý thuyết gắn bó; có khái niệm mô hình làm việc nội tại để hiểu tính liên tục của hành vi gắn bó.'
    loai: lich-su
    nguon:
      - fearon2010
    trich: John Bowlby's (1969) theory of parent–child attachment was revolutionary in the way it integrated evolutionary, biological, developmental, and cognitive concepts into a unified account of human attachment behavior ... the concept of an internal working model as a framework for understanding continuities in attachment behavior across context and over time.
    vi_tri: Fearon 2010, mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hành vi gắn bó là thích nghi về mặt tiến hóa (bé ở gần người bảo vệ thì sống sót cao hơn), và… mô hình làm việc nội tại — một kỳ vọng ngầm…". Chữ mới theo Fearon 2010. Lý do: bản gốc Bowlby chưa mở; hai chi tiết cũ chưa kiểm. Review (Claude Opus 5.5, 10/11/2026): Trang ghi "theo Fearon và cộng sự, 2010, tóm lại", đúng bậc nguồn; OpenStax Lifespan Development (2024), mục 4.4 cũng viết lý thuyết của Bowlby "united the biological and cognitive components of attachment" và nêu mô hình làm việc nội tại.'
    luot_2: khong-chac
    luot_2_ghi_chu: Bowlby 1969 là sách; OpenStax và Parolin 2016 xác nhận khái niệm hệ thống gắn bó và mô hình làm việc nội tại nói chung, nhưng chưa xác nhận "kết hợp các khái niệm tiến hóa, sinh học, phát triển và nhận thức" từ chính sách.
    review: dung
  - id: n17
    cau: Ainsworth thiết kế "tình huống lạ" để quan sát gắn bó trong phòng thí nghiệm; quy trình gồm 8 phân đoạn, mỗi phân đoạn tối đa khoảng 3 phút (tổng khoảng 20 phút).
    loai: phat-hien
