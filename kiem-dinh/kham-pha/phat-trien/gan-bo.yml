    luot_2_ghi_chu: Danh sách hành vi cụ thể (khóc, cười, bám, bò theo) và tên "hệ thống hành vi gắn bó" của Bowlby không có trong nguồn đã mở; ý chính (hệ thống bẩm sinh duy trì gần gũi) khớp.
