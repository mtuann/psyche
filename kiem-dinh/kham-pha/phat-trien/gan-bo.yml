  - id: n14
    cau: Người chăm sóc là "nơi trú ẩn an toàn" (safe haven) khi bé hoảng sợ.
    loai: dinh-nghia
    nguon:
      - groh2012
      - openstax-9
    trich: safe haven to effectively relieve their distress [Groh 2012] | The attachment figure is used as a secure base to explore the environment and is sought out in times of stress. [OpenStax 2e 9.3]
    vi_tri: Groh 2012, mở bài (dòng 84 của bản chữ)
    ket_qua: dung
    ghi_chu: 'Chỗ khó: Groh 2012 dùng cụm "safe haven" khi nói về người chăm sóc giúp trẻ giảm căng thẳng; chưa có nguồn nêu hai vai trò safe haven + secure base cùng lúc của Bowlby/Ainsworth. Review (Claude Opus 5.5, 10/11/2026): Ý "người chăm sóc là nơi bé tìm đến khi hoảng sợ" có ở OpenStax 2e 9.3 ("sought out in times of stress"); thuật ngữ safe haven dùng như Groh 2012. Thêm nguồn; câu ở mức định nghĩa chung, đúng.'
