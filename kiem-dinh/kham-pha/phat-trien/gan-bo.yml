    moi: …cho thấy chỉ nhìn bé có khóc khi xa mẹ hay không thì chưa đủ; cách bé đón mẹ khi mẹ quay lại cho biết nhiều hơn — …
    ly_do: Review D6-L3, hồ sơ n1.
