    ghi_chu: 'Chữ cũ trong lời giải thích: "không phân biệt được các kiểu gắn bó — bé an toàn hoàn toàn có thể khóc to". Chữ mới mềm hơn. Phân loại dựa vào đoàn tụ thuộc sách 1978 (chưa mở): nêu ở hồ sơ. Review (Claude Opus 5.5, 10/11/2026): Câu hỏi cũ "điểm mấu chốt để phân loại" và lời giải thích "khóc nhiều hay ít lúc chia tay không cho biết kiểu gắn bó" mạnh hơn nguồn (xem n6). Đã viết lại câu hỏi (phân biệt bé an toàn với bé kháng cự, khi cả hai đều khóc) và lời giải thích theo OpenStax và Ainsworth & Bell; lựa chọn giữ nguyên; doi_chu.'
