    ghi_chu: 'Chữ cũ: "Điểm then chốt của Bowlby — và cũng là điểm gây tranh cãi nhất thời bấy giờ — là: bé gắn bó với mẹ không phải vì mẹ cho bé ăn." Chữ mới tóm Harlow một câu, link về trang nhà. Nhãn khớp trang nhà (kết quả ở khỉ; suy rộng sang người là Đang tranh cãi ở trang nhà). Lý do: không nguồn đã mở nêu "gây tranh cãi nhất thời bấy giờ" và quy câu cho Bowlby 1958. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Link /psyche/thi-nghiem/harlow/ có trang (src/content/docs/thi-nghiem/harlow.md, trang nhà); chỉ tóm một câu, không thêm số.'
