    moi: '"…chỉ nhìn bé có khóc khi bạn ra khỏi phòng hay không thì chưa xếp được kiểu gắn bó, vì bé gắn bó an toàn và bé kháng cự đều có thể khóc. Điều giúp phân biệt nằm nhiều ở **lúc bạn quay lại**…"'
