    ghi_chu: 'Chữ cũ: "Rất nhiều yếu tố sau này — chất lượng chăm sóc tiếp tục, bạn bè, trường học, biến cố cuộc đời — vẫn có thể làm thay đổi quỹ đạo". Bỏ liệt kê (các tổng hợp không đo yếu tố ấy). Suy luận từ cỡ hiệu ứng, ghi nguồn các số. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
