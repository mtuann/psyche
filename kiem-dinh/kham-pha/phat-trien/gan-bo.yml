    vi_tri: Ainsworth & Bell 1970, mở bài
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "hoàn toàn bất lực: không tự kiếm ăn, không tự tránh nguy hiểm". Chữ mới mềm hơn. Là nhận xét phổ thông; nguồn mở bài của Ainsworth & Bell chỉ định nghĩa hành vi gắn bó (ghi cho người giao nếu muốn nguồn trực tiếp hơn). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
