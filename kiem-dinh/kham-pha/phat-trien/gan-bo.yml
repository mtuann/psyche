    ghi_chu: 'Chữ cũ: "nghĩ ra cách nhìn thấy gắn bó". Chữ mới: "thiết kế quy trình để quan sát". 8 phân đoạn khớp; mỗi phân đoạn chuẩn 3 phút ("the standard length of an episode was 3 minutes"; phân đoạn 1 ngắn): tổng "khoảng 20 phút" là phép cộng của người kiểm (7 × 3 phút + phân đoạn 1), không phải câu nguyên văn. Review (Claude Opus 5.5, 10/11/2026): Đọc lại toàn văn Ainsworth & Bell 1970 (PDF JSTOR lưu ở Internet Archive, bộ wikipedia-scholarly-sources-corpus, tệp 10.2307%252F1127388.pdf): tám phân đoạn theo thứ tự chuẩn, "the standard length of an episode was 3 minutes"; tổng khoảng 20 phút là phép cộng gần đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=6532729", "https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development" ]
    luot_2_ghi_chu: Tám phân đoạn khớp; "tối đa khoảng 3 phút" khớp bảng thời gian của Solomon 2019 (bản chuyển thể cho chó theo thời gian chuẩn của Ainsworth); tổng khoảng 20 phút không được nguồn nêu rõ.
    review: dung
