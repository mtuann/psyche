nhan_dinh:
  - id: n1
    cau: 'Trang mô tả: thí nghiệm "tình huống lạ" của Ainsworth cho thấy chỉ nhìn bé có khóc khi xa mẹ hay không thì chưa đủ; cách bé đón mẹ khi mẹ quay lại cho biết nhiều hơn; cùng các kiểu gắn bó được mô tả từ đó.'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Mô tả (description). Chữ cũ: "và bốn kiểu gắn bó giữa bé với người chăm sóc". Chữ mới: "cùng các kiểu gắn bó được mô tả từ đó". Lý do: bốn kiểu là kết quả của nhiều nghiên cứu (Ainsworth ba kiểu; Main & Solomon kiểu thứ tư). Review (Claude Opus 5.5, 10/11/2026): Đổi loại phat-hien thành ve-site (mô tả của trang). Chữ cũ "điều quan trọng không phải là bé có khóc khi xa mẹ hay không" mạnh hơn nguồn: OpenStax 2e 9.3 viết Ainsworth phân loại "based on how the infants/toddlers responded to the separation and reunion" (cả lúc chia tay). Đã sửa mô tả cho khớp thân bài mới (n6, n41); doi_chu.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Câu mô tả trang (ve-site): không qua lượt 2 (câu về chính trang, ví dụ giả định hay lời dẫn)"
    review: sai
  - id: n2
    cau: 'Tình huống tự trải nghiệm: bé 14 tháng, phòng chơi lạ, người lạ vào, mẹ ra khỏi phòng rồi quay lại.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Bé 14 tháng nằm trong khoảng 12–18 tháng. Ba mô tả (a), (b), (c) là minh họa (gia-dinh). Review (Claude Opus 5.5, 10/11/2026): Đổi loại phat-hien thành ve-site: tình huống tự trải nghiệm là ví dụ giả định của trang (gia-dinh). Đã kiểm trên trang: bé 14 tháng nằm trong khoảng 12–18 tháng mà thân bài nêu; ba mô tả có lời rào không dùng để xếp loại."
    luot_2: khong-chac
    luot_2_ghi_chu: "Tình huống minh họa giả định: không qua lượt 2 (câu về chính trang, ví dụ giả định hay lời dẫn)"
    review: dung
  - id: n3
    cau: 'Bé (a): òa khóc khi mẹ đi, khi mẹ về vừa bám chặt vừa đẩy ra, giận dỗi, mãi không nín: kiểu kháng cự/mập mờ.'
    loai: phat-hien
    nguon:
      - openstax-9
      - ainsworth1970
    trich: In cases of resistant attachment, children tend to show clingy behavior, but then they reject the attachment figure's attempts to interact with them
    vi_tri: OpenStax 9.3; Ainsworth & Bell 1970 (contact-resisting)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(a) Bé òa khóc ngay khi bạn đi, và khi bạn về thì bám chặt lấy bạn không rời" (mô tả không có "đẩy ra", nên có thể là bé an toàn; lời giải thích lại xếp là kháng cự). Chữ mới thêm "vừa đẩy ra, giận dỗi, mãi không nín". Lý do: chữ cũ khớp bé an toàn khóc to hơn là kiểu kháng cự. Review (Claude Opus 5.5, 10/11/2026): Khớp OpenStax 2e 9.3 (đọc lại 10/11/2026); trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development", "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=6532729" ]
    luot_2_ghi_chu: Mô tả minh họa khớp mô tả kiểu kháng cự (C); là ví dụ giả định.
    review: dung
  - id: n4
    cau: 'Bé (b): không tỏ vẻ gì khi mẹ đi, khi mẹ về vẫn mải chơi, quay mặt đi: kiểu tránh né; các nhà nghiên cứu cho rằng đó nhiều khả năng là phản ứng phòng thủ.'
    loai: phat-hien
    nguon:
      - ainsworth1970
      - openstax-9
    trich: Proximity-avoiding behavior … ignoring the adult, pointedly avoiding … Such behavior occurs in the reunion episodes, and is more frequent than avoidance of the stranger. ; the incidence of ambivalent (contact-resisting) and probably defensive (proximity-avoiding) patterns of behavior in the reunion episodes
    vi_tri: Ainsworth & Bell 1970, mục Discussion, mục 5
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "đó là một chiến lược phòng thủ". Chữ mới: "nhiều khả năng là phản ứng phòng thủ". Lý do: Ainsworth & Bell viết "probably defensive". Review (Claude Opus 5.5, 10/11/2026): Đọc lại toàn văn Ainsworth & Bell 1970 (PDF JSTOR lưu ở Internet Archive, bộ wikipedia-scholarly-sources-corpus, tệp 10.2307%252F1127388.pdf): mục Thảo luận có "probably defensive (proximity-avoiding) patterns of behavior in the reunion episodes", khớp "nhiều khả năng là phản ứng phòng thủ".'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development", "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=6532729" ]
    luot_2_ghi_chu: 'Mô tả khớp. "Nhiều khả năng là phản ứng phòng thủ": Solomon 2019 nêu kiểu tránh né là "adaptation to negative expectations about the responsiveness of the caregiver"; từ "defensive" của Ainsworth & Bell 1970 không mở được nên không trích nguyên.'
    review: dung
  - id: n5
    cau: 'Bé (c): hơi mếu khi mẹ đi, khi về bò lại gần, được ôm thì nín và quay lại chơi: kiểu an toàn, dùng người chăm sóc làm bệ đỡ để khám phá.'
    loai: phat-hien
    nguon:
      - openstax-9
      - ainsworth1970
    trich: In secure attachment, the parent provides a secure base for the toddler, allowing him to securely explore his environment.
    vi_tri: OpenStax 9.3
    ket_qua: dung
    ghi_chu: 'Ainsworth & Bell 1970: lúc mẹ trở lại, khám phá phục hồi (Episode 5). "Hơi mếu": hành vi minh họa (gia-dinh). Review (Claude Opus 5.5, 10/11/2026): Khớp OpenStax 2e 9.3 (đọc lại 10/11/2026); trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development" ]
    review: dung
  - id: n6
    cau: Chỉ nhìn bé có khóc khi mẹ ra khỏi phòng hay không thì chưa xếp được kiểu gắn bó, vì bé an toàn và bé kháng cự đều có thể khóc; điều giúp phân biệt nằm nhiều ở lúc mẹ quay lại.
    loai: phat-hien
    nguon:
      - ainsworth1970
      - openstax-9
    trich: Based on how the infants/toddlers responded to the separation and reunion, Ainsworth identified three types ... Securely attached children were distressed when their caregivers left the room ... During separation in the Strange Situation, they [resistant] became extremely disturbed [OpenStax 2e 9.3] | Some infants (37 percent) cried minimally if at all in episode 6, and yet searched strongly. Some (20 percent) cried desperately, but searched weakly or not at all. [Ainsworth & Bell 1970]
    vi_tri: Ainsworth & Bell 1970, Results (Crying and search)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "gần như không đánh giá bé qua việc bé có khóc… hay không". Chữ mới thay bằng điều nguồn nói (khóc và tìm kiếm không đi cùng nhau; các hành vi tránh né, kháng cự tăng ở các lần đoàn tụ). Cách xếp loại A/B/C dựa vào đoàn tụ thuộc sách 1978 (chưa mở). Review (Claude Opus 5.5, 10/11/2026): Chữ cũ "các nhà nghiên cứu không dựa vào việc bé có khóc khi mẹ ra khỏi phòng hay không để xếp kiểu gắn bó" mạnh hơn nguồn: OpenStax 2e 9.3 ghi phân loại dựa vào cả lúc chia tay và đoàn tụ, và mô tả mức buồn lúc chia tay khác nhau giữa các kiểu. Điều nguồn ủng hộ: khóc lúc chia tay riêng nó chưa đủ (bé an toàn và kháng cự đều buồn; Ainsworth & Bell: khóc và tìm kiếm không đi cùng nhau). Đã sửa đoạn đáp án; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=6532729" ]
    luot_2_ghi_chu: Solomon và cộng sự 2019, Attachment & Human Development (bài về chó, tả lại quy trình của Ainsworth cho trẻ).
    review: sai
  - id: n7
    cau: Ba mô tả minh họa không dùng để xếp loại hay chẩn đoán một em bé cụ thể.
    loai: ve-site
    trich: '(không áp dụng: lời rào của trang)'
    ket_qua: da-sua
    ghi_chu: 'Câu thêm vào trang (rào chẩn đoán). Chữ cũ không có. Lý do: quy tắc nội dung (không viết như chẩn đoán). Review (Claude Opus 5.5, 10/11/2026): Đổi loại loi-khuyen thành ve-site: lời rào của trang về cách dùng ba mô tả minh họa, không có khẳng định cần nguồn. Đã kiểm trên trang (cuối đoạn đáp án); không chẩn đoán.'
    luot_2: dung
    luot_2_nguon: [ "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=6532729" ]
    luot_2_ghi_chu: Một mô tả hành vi không đủ để xếp loại; câu là cảnh báo đúng.
    review: dung
  - id: n8
    cau: 'Kiểu thứ tư (vô tổ chức): bé có hành vi mâu thuẫn, khó hiểu khi mẹ quay lại.'
    loai: phat-hien
    nguon:
      - fearon2010
      - openstax-9
    trich: These seemingly inexplicable, contradictory, and fragmentary behaviors observed during the SSP are considered by many to represent relational processes at special risk for psychopathology
    vi_tri: Fearon 2010, mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hiếm gặp hơn… đông cứng khi bạn quay lại". Chữ mới bỏ "hiếm gặp hơn" (không so với kiểu nào) và "đông cứng" (chưa kiểm). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development" ]
    review: dung
