  - id: n33
    cau: 'van IJzendoorn và Kroonenberg (1988): gần 2.000 lượt phân loại ở 8 nước; khác biệt trong cùng một nước lớn gấp khoảng 1,5 lần khác biệt giữa các nước.'
    loai: so-lieu
    nguon:
      - vij1988
    trich: In this study, a wider perspective is taken by examining almost 2,000 Strange Situation classifications obtained in 8 different countries. ... Intracultural variation was nearly 1.5 times the crosscultural variation.
    vi_tri: van IJzendoorn & Kroonenberg 1988, tóm tắt (OpenAlex)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "32 mẫu từ 8 nước, 1.990 lượt phân loại… kiểu an toàn phổ biến nhất ở mọi nước… 65% an toàn, 21% tránh né, 14% kháng cự" và "gấp 1,5 lần". Chữ mới: "gần 2.000 lượt… gần 1,5 lần". Lý do: tóm tắt không nêu 32 mẫu, 1.990, tỉ lệ 65/21/14, hay "mọi nước"; bài gốc chưa mở. Review (Claude Opus 5.5, 10/11/2026): Khớp tóm tắt van IJzendoorn & Kroonenberg 1988 (OpenAlex, đọc lại 10/11/2026).'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.2307/1130396" ]
    luot_2_ghi_chu: van IJzendoorn & Kroonenberg 1988, Child Development 59, 147–156.
    review: dung
  - id: n34
    cau: Kiểu tránh né (A) tương đối nhiều hơn ở Tây Âu, kiểu kháng cự (C) nhiều hơn ở Israel và Nhật Bản.
    loai: phat-hien
    nguon:
      - vij1988
    trich: A classifications emerge as relatively more prevalent in Western European countries and C classifications as relatively more frequent in Israel and Japan.
    vi_tri: van IJzendoorn & Kroonenberg 1988, tóm tắt
    ket_qua: dung
