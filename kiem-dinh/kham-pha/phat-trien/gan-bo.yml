    ghi_chu: 'Chữ cũ: "chính là dấu hiệu của kiểu tránh né… Đừng nhầm chiến lược phòng thủ với sự trưởng thành". Chữ mới mềm hơn, thêm lời rào chẩn đoán. Review (Claude Opus 5.5, 10/11/2026): Đọc lại toàn văn Ainsworth & Bell 1970 (PDF JSTOR lưu ở Internet Archive, bộ wikipedia-scholarly-sources-corpus, tệp 10.2307%252F1127388.pdf): "probably defensive (proximity-avoiding)". Khớp.'
    luot_2: dung
