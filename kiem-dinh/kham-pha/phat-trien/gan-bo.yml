    vi_tri: Groh 2012, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: "Thêm d = 0,17 của nhóm tránh né; kháng cự (0,03) và vô tổ chức (0,08) không có ý nghĩa thống kê (không có trên trang cũ). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu."
