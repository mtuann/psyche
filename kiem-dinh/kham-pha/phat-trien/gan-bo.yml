    ghi_chu: 'Chữ cũ: "bám mẹ ở tuổi 1–2 là đúng lịch trình phát triển, và chính cảm giác an toàn khi bám mới tạo ra sự tự lập thật sự sau này". Chữ mới mềm: vế tự lập là giả thuyết, nguồn chưa mở. Review (Claude Opus 5.5, 10/11/2026): Đọc lại toàn văn Ainsworth & Bell 1970 (PDF JSTOR lưu ở Internet Archive, bộ wikipedia-scholarly-sources-corpus, tệp 10.2307%252F1127388.pdf): khớp tóm tắt; trang nói rõ phần "an toàn tạo tự lập" là giả thuyết.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development", "https://api.openalex.org/works/doi:10.2307/1127506" ]
    review: dung
  - id: n60
    cau: 'Ngộ nhận "Bé không khóc khi xa mẹ là ngoan, độc lập": hành vi ít khóc, phớt lờ mẹ lúc đoàn tụ là hành vi của kiểu tránh né, nhiều khả năng là phản ứng phòng thủ, không dùng để xếp loại một em bé cụ thể.'
