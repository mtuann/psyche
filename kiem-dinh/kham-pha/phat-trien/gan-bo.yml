    loai: phat-hien
    nguon:
      - ainsworth1970
    trich: Attachment behaviors are behaviors which promote proximity or contact.
    vi_tri: Ainsworth & Bell 1970, mở bài
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "không phải là tự lập, mà là giữ một người chăm sóc ở gần mình bằng mọi giá — khóc, cười, bám, bò theo". Chữ mới bỏ "bằng mọi giá" và vế "không phải tự lập". Ainsworth & Bell 1970: crying và search tăng khi mẹ vắng; "cười", "bò theo" chưa kiểm. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
