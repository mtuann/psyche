    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.2307/1130396" ]
    luot_2_ghi_chu: van IJzendoorn & Kroonenberg 1988, Child Development 59, 147–156.
  - id: n35
    cau: 'Rothbaum và cộng sự (2000): ba giả thuyết cốt lõi (nhạy cảm → an toàn; an toàn → năng lực xã hội; bệ đỡ an toàn) được đo bằng các thước đo thiên về tự chủ, cá nhân hóa, khám phá; so sánh Mỹ và Nhật thấy sự nhạy cảm, năng lực xã hội và bệ đỡ an toàn được hiểu rất khác ở Nhật; kêu gọi cách tiếp cận bản địa.'
    loai: phat-hien
    nguon:
      - rothbaum2000
    trich: 'Attachment theorists use measures of sensitivity, competence, and secure base that are biased toward Western ways of thinking: The measures emphasize the child''s autonomy, individuation, and exploration. In Japan, sensitivity, competence, and secure base are viewed very differently ... The authors call for an indigenous approach to the psychology of attachment.'
    vi_tri: Rothbaum 2000, tóm tắt (OpenAlex)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ở Nhật, ''nhạy cảm'' có thể nghĩa là đoán trước nhu cầu của bé để bé không phải khóc đòi (văn hóa amae…), chứ không phải khuyến khích bé tự khám phá như ở Mỹ" và "gây tranh luận lớn". Chữ mới theo tóm tắt (không amae). Bài gốc chưa mở; chữ cũ về amae có thể đúng nhưng chưa kiểm. Cũng sửa ba giả thuyết cho đúng tóm tắt. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Không còn chữ "amae".'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/11080829" ]
    luot_2_ghi_chu: Rothbaum, Weisz, Pott, Miyake & Morelli 2000, American Psychologist.
    review: dung
  - id: n36
    cau: 'Giáo trình: gắn bó thay đổi theo văn hóa, một yếu tố Ainsworth không tính đến.'
    loai: phat-hien
    nguon:
      - openstax-9
    trich: others have noted that attachment varies from culture to culture, a factor not accounted for in Ainsworth's research (Rothbaum, Weisz, Pott, Miyake, & Morelli, 2000; van Ijzendoorn & Sagi-Schwartz, 2008)
    vi_tri: OpenStax 9.3
    ket_qua: dung
    ghi_chu: Câu thêm vào trang (khung Đang tranh cãi).
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development" ]
  - id: n37
    cau: 'Các kiểu gắn bó trong tình huống lạ có thể được mã hóa tin cậy: tổng hợp gần 80 nghiên cứu (hơn 6.000 cặp mẹ–bé) cho độ tin cậy và giá trị phân biệt của kiểu D.'
    loai: phat-hien
    nguon:
      - vij1999
    trich: During the past 10 years nearly 80 studies on disorganized attachment involving more than 6,000 infant-parent dyads have been carried out. The current series of meta-analyses have established the reliability and discriminant validity of disorganized infant attachment.
    vi_tri: van IJzendoorn 1999, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "các nhà mã hóa được đào tạo đều phân loại ra cùng bốn kiểu" (độ tin cậy cho cả bốn kiểu). Chữ mới nêu độ tin cậy của kiểu D theo tóm tắt; độ tin cậy của A, B, C chưa kiểm ở nguồn đã mở. Review (Claude Opus 5.5, 10/11/2026): Khớp tóm tắt van IJzendoorn 1999. Câu vẫn ở khung (nay Khá vững, n38).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/16506532" ]
    luot_2_ghi_chu: Chữ "cặp mẹ–bé" thay cho "infant-parent dyads" là nhỏ (có cả cha).
    review: dung
  - id: n38
    cau: "Khung Khá vững: hành vi của bé trong tình huống lạ được chấm khá nhất quán; kiểu an toàn là phổ biến nhất."
    loai: nhan
    nguon:
      - ainsworth1970
      - vij1999
      - openstax-9
      - openstax-ls-4-4
      - fraley2003
    nhan: kha-vung
    co_so:
      - ainsworth1970
      - vij1999
      - openstax-9
      - openstax-ls-4-4
      - fraley2003
    ly_do: "Độ tin cậy chấm hành vi cao trong nghiên cứu gốc (Ainsworth & Bell 1970) và tổng hợp về kiểu D (van IJzendoorn 1999); hai giáo trình bậc 2 ghi kiểu an toàn phổ biến nhất. Chưa có tổng hợp về độ tin cậy của cả bốn kiểu trong nguồn đã mở, tóm tắt tổng hợp 1988 không nêu kiểu an toàn chiếm đa số ở mọi nước, và Fraley & Spieker 2003 (1.139 trẻ) thấy khác biệt chủ yếu là liên tục, không theo loại: Khá vững."
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "từ phòng thí nghiệm Baltimore năm 1978 đến hàng trăm nghiên cứu… bốn kiểu… tất cả 8 nước". Chữ mới theo nguồn đã mở. Chỗ khó: review cân nhắc hạ Khá vững nếu coi độ tin cậy của bốn kiểu chưa đủ nguồn. Review (Claude Opus 5.5, 10/11/2026): Lượt 1 nêu sát ranh. Nhãn cũ Vững chắc cho "các kiểu ... mã hóa tin cậy" chỉ có tổng hợp cho kiểu D; cho cả bốn kiểu chưa có tổng hợp nào đã mở, và có nghiên cứu lớn cho thấy các "kiểu" là cách chia một biến thiên liên tục (Fraley & Spieker 2003, tóm tắt OpenAlex). Hạ xuống Khá vững, viết lại ý chính và thân khung theo điều nguồn nói, thêm giới hạn; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/16506532", "https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development" ]
    luot_2_ghi_chu: "Nhãn Vững chắc: có phân tích tổng hợp (van IJzendoorn 1999); hợp thước đo cho phần mã hóa tin cậy."
    trich: Reliability coefficients (rho) for two independent scorers for 14 randomly selected cases were ... 0.93 ... 0.97 [Ainsworth & Bell 1970] | The current series of meta-analyses have established the reliability and discriminant validity of disorganized infant attachment [vIJ 1999] | The most common type of attachment ... is called secure attachment [OpenStax 2e 9.3] | The results indicate that variation in attachment patterns is largely continuous, not categorical. [Fraley & Spieker 2003]
    review: sai
  - id: n39
    cau: 'Khung Khá vững: gắn bó thời thơ ấu dự báo ở mức nhỏ đến vừa các kết quả cảm xúc–xã hội sau này.'
    loai: nhan
    nguon: &id002
      - fearon2010
      - groh2012
      - groh2017
    nhan: kha-vung
    co_so: *id002
    ly_do: 'Hai phân tích tổng hợp lớn (69 mẫu và 42 mẫu), d từ 0,15 đến 0,34, là tương quan, hiệu ứng nhỏ đến vừa, ở các mẫu chủ yếu phương Tây: Khá vững.'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "tổng cộng hơn 10.000 trẻ… làm tăng nguy cơ… đặc biệt là kiểu vô tổ chức". Chữ mới: số trẻ từng tổng hợp; "liên hệ", kiểu vô tổ chức nổi bật với hành vi hướng ngoại. Review (Claude Opus 5.5, 10/11/2026): Nhãn Khá vững đạt thước đo mục 4 (hai phân tích tổng hợp, hiệu ứng nhỏ đến vừa, tương quan, mẫu chủ yếu phương Tây).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/20438450", "https://europepmc.org/article/MED/22235928" ]
    luot_2_ghi_chu: "Khá vững hợp lý (không cao hơn): có tổng hợp nhưng hiệu ứng nhỏ đến vừa."
    review: dung
  - id: n40
    cau: 'Khung Đang tranh cãi: thuyết gắn bó là phổ quát hay chỉ là một lý thuyết phương Tây?'
    loai: nhan
    nguon: &id003
      - rothbaum2000
      - vij1988
      - openstax-9
    nhan: tranh-cai
    co_so: *id003
    ly_do: 'Rothbaum 2000 chất vấn thước đo thiên về giá trị phương Tây; tổng hợp 1988 thấy khác biệt trong cùng một nước lớn hơn giữa các nước và có khác biệt theo vùng (A nhiều ở Tây Âu, C ở Israel và Nhật); giáo trình ghi gắn bó thay đổi theo văn hóa: chưa có tái lập đa văn hóa có đăng ký trước: Đang tranh cãi.'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Phe còn lại đáp rằng kiểu an toàn vẫn chiếm đa số ở mọi nền văn hóa đã nghiên cứu, và ''nhạy cảm'' chỉ khác nhau ở hình thức biểu hiện." Bỏ. Lý do: không nguồn đã mở nào nói; thay bằng giáo trình và van IJzendoorn & Kroonenberg 1988. Review (Claude Opus 5.5, 10/11/2026): Nhãn Đang tranh cãi đạt thước đo: nguồn bình duyệt chỉ hai chiều (Rothbaum 2000; van IJzendoorn & Kroonenberg 1988); OpenStax Lifespan Development (2024), mục 4.4 cũng nêu khác biệt văn hóa (trẻ Đức hay bị xếp tránh né hơn trẻ Mỹ).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/11080829", "https://api.openalex.org/works/doi:10.2307/1130396" ]
    luot_2_ghi_chu: Hai nguồn bình duyệt nhấn mạnh hai chiều khác nhau; nhãn Đang tranh cãi khớp thước đo.
    review: dung
  - id: n41
    cau: "Khung Khá vững: chỉ nhìn bé khóc nhiều hay ít khi mẹ đi thì chưa biết gắn bó có an toàn hay không."
    loai: nhan
    nguon:
      - ainsworth1970
      - openstax-9
    nhan: kha-vung
    co_so:
      - ainsworth1970
      - openstax-9
    ly_do: 'Một nghiên cứu gốc đọc toàn văn (56 bé) và giáo trình bậc 2 cùng chiều: mức khóc lúc chia tay không tách được bé an toàn với bé kháng cự, và bé ít khóc (tránh né) được xếp không an toàn. Chưa có tổng hợp; dữ liệu chủ yếu từ một quy trình và mẫu phương Tây: Khá vững. Phần "hư/ngoan" là phán xét giá trị, trang nói rõ nghiên cứu không trả lời.'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ngộ nhận phổ biến nhất — và cũng là ngộ nhận bị dữ liệu bác bỏ rõ ràng nhất… điểm chẩn đoán… đó chính là một kiểu gắn bó không an toàn". Chữ mới mềm hơn. Chỗ khó: thước đo Đã bị bác bỏ (các kiểm tra mạnh liên tục thất bại) khó áp vào một niềm tin về giá trị; review cân nhắc hạ khung hay đổi thành Khá vững cho vế "khóc không cho biết kiểu gắn bó". Review (Claude Opus 5.5, 10/11/2026): Lượt 1 nêu sát ranh. Đã bị bác bỏ cần các kiểm tra đủ mạnh liên tục thất bại; ở đây đối tượng là một niềm tin về giá trị ("hư", "ngoan") và chỉ có một nghiên cứu gốc cộng giáo trình, nên không đạt. Chữ cũ "việc bé khóc nhiều hay ít khi mẹ đi không cho biết kiểu gắn bó" cũng mạnh hơn nguồn (OpenStax: phân loại dựa vào cả chia tay và đoàn tụ). Viết lại thành khung Khá vững cho vế kiểm được; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.2307/1127506", "https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development" ]
    luot_2_ghi_chu: Bell & Ainsworth 1972, Child Development 43, 1171–1190 (tóm tắt đọc qua OpenAlex). Kết quả ngược với ý "bé khóc đáp lại là hư"; vì là nghiên cứu quan sát nhỏ, nhãn "bác bỏ" dựa cả vào tổng hợp độ nhạy cảm (De Wolff 1997).
    trich: Some infants (37 percent) cried minimally if at all in episode 6, and yet searched strongly. Some (20 percent) cried desperately, but searched weakly or not at all. [Ainsworth & Bell 1970] | Securely attached children were distressed when their caregivers left ... With avoidant attachment, the child ... does not care if the parent leaves ... When the parent does return, the child is slow to show a positive reaction. [OpenStax 2e 9.3]
