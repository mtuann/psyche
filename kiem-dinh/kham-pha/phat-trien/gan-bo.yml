doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: mà là bé làm gì khi mẹ quay lại — và bốn kiểu gắn bó giữa bé với người chăm sóc.
    moi: mà là bé làm gì khi mẹ quay lại — cùng các kiểu gắn bó được mô tả từ đó.
    ly_do: '"bốn kiểu" là của Ainsworth (ba kiểu) cộng Main & Solomon (kiểu thứ tư), không phải kết quả của một thí nghiệm.'
  - cu: '> (a) Bé òa khóc ngay khi bạn đi, và khi bạn về thì bám chặt lấy bạn không rời.'
    moi: '> (a) Bé òa khóc ngay khi bạn đi; khi bạn về, bé vừa bám chặt lấy bạn vừa đẩy ra, giận dỗi, mãi không nín.'
    ly_do: Chữ cũ mô tả bé khóc rồi bám chặt, nhưng lời giải thích xếp bé vào kiểu "vừa bám vừa đẩy ra"; một bé khóc rồi bám chặt có thể là bé an toàn (chính trang nói bé an toàn có thể khóc to).
  - cu: các nhà nghiên cứu gần như **không đánh giá** bé qua việc bé có khóc khi bạn ra khỏi phòng hay không. Điểm mấu chốt nằm ở **lúc bạn quay lại**
    moi: các nhà nghiên cứu không dựa vào việc bé có khóc khi bạn ra khỏi phòng hay không để xếp kiểu gắn bó. Điểm quan trọng nằm ở **lúc bạn quay lại**
    ly_do: '"gần như không đánh giá" là cách nói không kiểm được; Ainsworth & Bell 1970 chỉ ra khóc và tìm kiếm không đi cùng nhau ở nhiều bé.'
  - cu: '- Bé (b) thuộc kiểu **tránh né**: trông có vẻ "độc lập", nhưng đó là một chiến lược phòng thủ.'
    moi: '- Bé (b) thuộc kiểu **tránh né**: trông có vẻ "độc lập", nhưng các nhà nghiên cứu cho rằng đó nhiều khả năng là một phản ứng phòng thủ.'
    ly_do: 'Ainsworth & Bell 1970: "probably defensive"; chữ cũ khẳng định "là".'
  - cu: 'Còn một kiểu thứ tư hiếm gặp hơn — bé có hành vi mâu thuẫn, đông cứng khi bạn quay lại — sẽ được nói đến ở phần sau.

      :::'
    moi: 'Còn một kiểu thứ tư — bé có hành vi mâu thuẫn, khó hiểu khi bạn quay lại — sẽ được nói đến ở phần sau. Ba mô tả trên chỉ minh họa cách các nhà nghiên cứu phân loại; chúng không dùng để xếp loại hay chẩn đoán một em bé cụ thể.

      :::'
    ly_do: 'Bỏ "hiếm gặp hơn" (không so được với kiểu tránh né) và "đông cứng" (chưa kiểm); thêm lời rào: không xếp loại một em bé cụ thể.'
  - cu: 'một em bé sơ sinh hoàn toàn bất lực: không tự kiếm ăn, không tự tránh nguy hiểm.'
    moi: một em bé sơ sinh phụ thuộc rất nhiều vào người chăm sóc để được nuôi và được bảo vệ.
    ly_do: Chữ cũ "hoàn toàn bất lực" nói chắc hơn và không có nguồn.
  - cu: 'Nhà tâm thần học người Anh John Bowlby gọi đây là **hệ thống hành vi gắn bó** (attachment behavioral system): một hệ thống bản năng có mục tiêu duy nhất là duy trì sự gần gũi'
    moi: 'John Bowlby gọi đây là **hệ thống hành vi gắn bó** (attachment behavioral system): một hệ thống có mục tiêu là duy trì sự gần gũi'
    ly_do: 'Bỏ "nhà tâm thần học người Anh", "bản năng", "duy nhất": không có trong nguồn đã mở (Ainsworth & Bell: hành vi gắn bó là hành vi giúp duy trì gần gũi hay tiếp xúc).'
  - cu: 'Điểm then chốt của Bowlby — và cũng là điểm gây tranh cãi nhất thời bấy giờ — là: bé gắn bó với mẹ **không phải vì mẹ cho bé ăn**. Gắn bó là một nhu cầu độc lập, có chức năng riêng: được bảo vệ và được vỗ về khi sợ hãi.'
    moi: 'Một điểm then chốt của thuyết gắn bó là: gắn bó không chỉ là chuyện **được cho ăn**; thí nghiệm khỉ con của Harlow gợi ý điều tương tự ([Khỉ con cần mẹ vải hay mẹ sắt?](/psyche/thi-nghiem/harlow/); kết quả ở khỉ, suy sang người có giới hạn). Gắn bó có chức năng riêng: người chăm sóc cho bé cảm giác an toàn.'
    ly_do: 'Chữ cũ: "Điểm then chốt của Bowlby — và cũng là điểm gây tranh cãi nhất thời bấy giờ — là… không phải vì mẹ cho bé ăn. Gắn bó là một nhu cầu độc lập…". Bỏ phần quy cho Bowlby 1958 (bài gốc chưa mở) và "gây tranh cãi nhất"; thêm link về trang nhà Harlow, nhãn khớp trang nhà (kết quả ở khỉ).'
  - cu: chính là hình ảnh của gắn bó **khỏe mạnh**, chứ không phải "hư" hay "nhõng nhẽo".
    moi: chính là hình ảnh mà thuyết gắn bó coi là gắn bó **an toàn**, chứ không phải "hư" hay "nhõng nhẽo".
    ly_do: '"khỏe mạnh" và phủ định "hư" là đánh giá của trang, thay bằng điều thuyết nói (gắn bó an toàn).'
  - cu: '### Bowlby (1958, 1969): gắn bó là một hệ thống bản năng


      Trong bài báo "The nature of the child''s tie to his mother" (1958), Bowlby lập luận rằng sự gắn bó của bé với mẹ được trung gian bởi các kiểu hành vi đặc trưng của loài — khóc, cười, bám, bú, đi theo — chứ không phải bởi vai trò "cung cấp thức ăn" của mẹ. Nói cách khác, bé không "yêu mẹ vì mẹ cho bú"; bé có một hệ thống hành vi riêng để giữ mẹ ở gần.


      Trong tập đầu'
    moi: '### Bowlby (1969): một lý thuyết về gắn bó { #bowlby-1958-1969-gan-bo-la-mot-he-thong-ban-nang }


      Trong tập đầu'
    ly_do: 'Bỏ đoạn Bowlby 1958 ("The nature of the child''s tie to his mother"): chưa mở được bài, không nguồn đã mở nào nêu các ý "khóc, cười, bám, bú, đi theo" và "không yêu mẹ vì mẹ cho bú". Đổi tiêu đề (bỏ "1958" và "hệ thống bản năng"), giữ id mục cũ.'
  - cu: '- Bowlby, J. (1958). The nature of the child''s tie to his mother. *International Journal of Psychoanalysis*, 39, 350–373.

      '
    moi: ''
    ly_do: Bài 1958 không còn được dẫn trong bài (chưa mở được); bỏ khỏi danh sách.
  - cu: 'Trong tập đầu của bộ ba *Attachment and Loss* (1969; tái bản 1982), Bowlby phát triển đầy đủ lý thuyết: hành vi gắn bó là thích nghi về mặt tiến hóa (bé ở gần người bảo vệ thì sống sót cao hơn), và qua tương tác lặp đi lặp lại với người chăm sóc, bé hình thành **mô hình làm việc nội tại** (internal working model) — một "kỳ vọng" ngầm về việc người chăm sóc có sẵn sàng giúp đỡ khi mình cần hay không.'
    moi: Trong tập đầu của bộ ba *Attachment and Loss* (1969; tái bản 1982), Bowlby kết hợp các khái niệm tiến hóa, sinh học, phát triển và nhận thức thành một lý thuyết về gắn bó, trong đó có khái niệm **mô hình làm việc nội tại** (internal working model) — một khung để hiểu vì sao hành vi gắn bó có tính liên tục qua bối cảnh và theo thời gian (theo Fearon và cộng sự, 2010, tóm lại).
    ly_do: Chữ cũ ("bé ở gần người bảo vệ thì sống sót cao hơn", mô hình làm việc nội tại là "kỳ vọng ngầm…") chưa kiểm được ở bản gốc; thay bằng cách Fearon và cộng sự 2010 tóm tắt lý thuyết.
  - cu: '"Chương trình" sinh tồn của bé vì thế không phải là tự lập, mà là **giữ một người chăm sóc ở gần mình bằng mọi giá** — khóc, cười, bám, bò theo.'
    moi: '"Chương trình" sinh tồn của bé vì thế thiên về **giữ một người chăm sóc ở gần mình** — bằng các hành vi như khóc, cười, bám, bò theo.'
    ly_do: 'Chữ cũ "không phải là tự lập… bằng mọi giá" nói chắc hơn nguồn; Ainsworth & Bell 1970: hành vi gắn bó là hành vi giúp duy trì gần gũi hay tiếp xúc ("Attachment behaviors are behaviors which promote proximity or contact"). Danh sách hành vi cụ thể (khóc, cười, bám, bò theo) chưa kiểm ở bản gốc Bowlby.'
  - cu: Mary Ainsworth là người nghĩ ra cách **nhìn thấy** gắn bó trong phòng thí nghiệm.
    moi: Mary Ainsworth là người thiết kế quy trình để **quan sát** gắn bó trong phòng thí nghiệm.
    ly_do: '"nghĩ ra" nói như người đầu tiên duy nhất; nguồn chỉ nói bà dùng và mô tả quy trình.'
  - cu: Mọi thứ được quay lại và mã hóa, nhưng trọng số lớn nhất đặt vào **hành vi của bé trong hai lần đoàn tụ với mẹ**.
    moi: Hành vi của bé được ghi lại và mã hóa (ở nghiên cứu 1970, người quan sát ghi bằng máy ghi âm), và các hành vi tránh né, kháng cự nổi lên rõ nhất ở **hai lần đoàn tụ với mẹ**.
    ly_do: 'Chữ cũ "quay lại" và "trọng số lớn nhất": nguồn 1970 ghi bằng máy ghi âm; trọng số của lần đoàn tụ thuộc cách phân loại ở sách 1978 (chưa mở). Nguồn 1970 chỉ nói các hành vi tránh né, kháng cự tăng ở các lần đoàn tụ.'
  - cu: 'Từ nghiên cứu gốc ở Baltimore, Ainsworth và cộng sự phân biệt ba kiểu:'
    moi: 'Ainsworth và cộng sự mô tả ba kiểu (nghiên cứu 1970 mô tả các hành vi tránh né và kháng cự khi đoàn tụ):'
    ly_do: 'Bài 1970 không nêu bộ ba A, B, C: bộ này thường được dẫn tới sách 1978 (chưa mở); giáo trình dẫn "Ainsworth & Bell, 1970". Bỏ "Baltimore" (chỉ là nơi đặt trường).'
  - cu: 'Trông "độc lập", nhưng các nhà nghiên cứu xem đây là một chiến lược phòng thủ: bé đã học được rằng thể hiện nhu cầu thì không được đáp ứng, nên "tắt" biểu hiện ra ngoài.'
    moi: Trông "độc lập", nhưng Ainsworth và Bell (1970) cho rằng việc tránh mẹ khi đoàn tụ nhiều khả năng là phản ứng phòng thủ, và Ainsworth sau đó cho rằng các bé này thường có người chăm sóc thiếu nhạy cảm với nhu cầu của bé (theo giáo trình).
    ly_do: Chữ cũ ("đã học được rằng thể hiện nhu cầu thì không được đáp ứng, nên tắt biểu hiện") không có nguồn; thay bằng điều Ainsworth & Bell 1970 và giáo trình nói.
  - cu: ', rất khó vỗ về, và không quay lại chơi được. Kiểu này gắn với sự chăm sóc thiếu nhất quán: lúc đáp ứng, lúc không.'
    moi: ', rất khó vỗ về.'
    ly_do: Giáo trình không nói "không quay lại chơi được" và không nêu nguyên nhân chăm sóc thiếu nhất quán cho kiểu kháng cự; bỏ.
  - cu: 'Ainsworth và cộng sự đề xuất một "phân bố chuẩn": khoảng **70% an toàn, 20% tránh né, 10% kháng cự** — các số tròn từ mẫu Baltimore ban đầu (Ainsworth và Bell, 1970) — con số sau này được dùng làm mốc so sánh cho mọi nghiên cứu khác.'
    moi: Kiểu an toàn là kiểu phổ biến nhất (theo giáo trình). Bài của Ainsworth và Bell (1970) mô tả 56 bé khoảng 1 tuổi và nêu hành vi, chứ không nêu tỉ lệ ba kiểu; chúng tôi chưa mở được nguồn nào cho con số "70% / 20% / 10%" từng được nhắc nhiều, nên không ghi ở đây.
    ly_do: 'Chữ cũ gán "phân bố chuẩn 70/20/10" cho Ainsworth & Bell 1970: bài đó không có con số ấy (mô tả hành vi của 56 trẻ). Bỏ; chưa có nguồn đã mở. Quiz câu 2 đổi theo.'
  - cu: 'Một số bé không xếp vừa vào ba kiểu trên: khi mẹ quay lại, bé có những hành vi **mâu thuẫn và mất phương hướng** — đang tiến về phía mẹ thì đột nhiên đông cứng, đứng sững nhìn vào khoảng không; đi loạng choạng, hoặc tỏ ra sợ chính người mình đang tìm đến.'
    moi: 'Một số bé không xếp vừa vào ba kiểu trên: trong tình huống lạ, bé có những hành vi **khó hiểu, mâu thuẫn và rời rạc** (Fearon và cộng sự, 2010).'
    ly_do: 'Chữ cũ liệt kê hành vi cụ thể (đông cứng, đi loạng choạng, sợ người mình tìm đến) chưa kiểm được ở bản gốc Main & Solomon; Fearon: "inexplicable, contradictory, and fragmentary behaviors".'
  - cu: 'Kiểu D đặc biệt gắn với những trải nghiệm đáng sợ: bạo hành, bỏ bê nghiêm trọng, hoặc người chăm sóc mà chính họ cũng đang hoảng loạn — khiến bé rơi vào nghịch lý không lối thoát: **nguồn an toàn duy nhất đồng thời là nguồn đe dọa**. Trong các mẫu nguy cơ thấp, tỉ lệ nhóm D chỉ khoảng 10–15%; ở các mẫu nguy cơ cao, con số này cao hơn nhiều (van IJzendoorn, Schuengel và Bakermans-Kranenburg, 1999).'
    moi: 'Kiểu D gặp nhiều hơn ở các bối cảnh nguy cơ cao: khoảng 15% ở gia đình trung lưu bình thường, và có thể gấp hai đến ba lần ở các bối cảnh khác và nhóm lâm sàng (ví dụ bị bạo hành). Hành vi đáng sợ của người chăm sóc có thể đóng một vai trò, nhưng không phải nguyên nhân duy nhất (van IJzendoorn, Schuengel và Bakermans-Kranenburg, 1999).'
    ly_do: 'Chữ cũ: "đặc biệt gắn với… bạo hành, bỏ bê nghiêm trọng, hoặc người chăm sóc hoảng loạn… nghịch lý nguồn an toàn duy nhất đồng thời là nguồn đe dọa… 10–15%". Tóm tắt van IJzendoorn 1999: khoảng 15% ở gia đình trung lưu bình thường, gấp 2–3 lần ở bối cảnh khác (như bạo hành); hành vi đáng sợ của cha mẹ "may play an important role but not the only causal factor". Bỏ nghịch lý (chưa kiểm).'
  - cu: gắn bó không an toàn liên hệ với các vấn đề hành vi hướng ngoại sau này (không vâng lời, gây hấn) ở mức *d* = 0,31 — một hiệu ứng nhỏ đến vừa. Trẻ nhóm vô tổ chức có nguy cơ cao nhất (*d* = 0,34), trong khi nhóm tránh né (*d* = 0,12) và kháng cự (*d* = 0,11) chỉ nhỉnh hơn chút ít
    moi: gắn bó không an toàn liên hệ với các vấn đề hành vi hướng ngoại sau này (không vâng lời, gây hấn) ở mức *d* = 0,31 — một hiệu ứng nhỏ đến vừa. Trẻ nhóm vô tổ chức có nguy cơ cao nhất (*d* = 0,34), trong khi nhóm tránh né (*d* = 0,12) chỉ nhỉnh hơn chút ít và nhóm kháng cự (*d* = 0,11, khoảng tin cậy gồm 0) chưa thấy khác biệt chắc chắn
    ly_do: 'Fearon 2010: kháng cự d = 0,11 với khoảng tin cậy (−0,04; 0,26): không có ý nghĩa thống kê; chữ cũ gộp "chỉ nhỉnh hơn".'
  - cu: 'Groh và cộng sự (2012) với 42 mẫu (4.614 trẻ): gắn bó không an toàn cũng liên hệ với các triệu chứng hướng nội (lo âu, trầm cảm), nhưng yếu hơn nhiều: *d* = 0,15'
    moi: 'Groh và cộng sự (2012) với 42 mẫu (4.614 trẻ): gắn bó không an toàn cũng liên hệ với các triệu chứng hướng nội (lo âu, trầm cảm), nhưng yếu hơn nhiều: *d* = 0,15 (trong ba nhóm, chỉ nhóm tránh né có liên hệ riêng rõ, *d* = 0,17)'
    ly_do: 'Thêm điều Groh 2012 nói: tránh né d = 0,17, kháng cự 0,03 và vô tổ chức 0,08 không có ý nghĩa thống kê.'
  - cu: 'Nói cách khác: gắn bó thời thơ ấu **nghiêng** cán cân phát triển, chứ không **quyết định** nó. Rất nhiều yếu tố sau này — chất lượng chăm sóc tiếp tục, bạn bè, trường học, biến cố cuộc đời — vẫn có thể làm thay đổi quỹ đạo.'
    moi: 'Nói cách khác: gắn bó thời thơ ấu **nghiêng** cán cân phát triển, chứ không **quyết định** nó: hiệu ứng ở mức nhỏ đến vừa nghĩa là phần lớn khác biệt về hành vi và cảm xúc sau này không được giải thích bởi kiểu gắn bó sớm.'
    ly_do: Bỏ liệt kê "chất lượng chăm sóc tiếp tục, bạn bè, trường học, biến cố" (các tổng hợp không đo); thay bằng điều hiệu ứng nhỏ đến vừa suy ra.
  - cu: 'Phân tích tổng hợp đa văn hóa lớn của van IJzendoorn và Kroonenberg (1988) — 32 mẫu từ 8 nước, 1.990 lượt phân loại — cho thấy: **kiểu an toàn (B) là phổ biến nhất ở mọi nước được nghiên cứu**, với tỉ lệ trung bình khoảng 65% an toàn, 21% tránh né, 14% kháng cự. Nhưng có hai chi tiết đáng chú ý:'
    moi: 'Phân tích tổng hợp đa văn hóa của van IJzendoorn và Kroonenberg (1988) — gần 2.000 lượt phân loại ở 8 nước — thấy hai điều đáng chú ý:'
    ly_do: 'Chữ cũ: "32 mẫu… 1.990 lượt", "kiểu an toàn phổ biến nhất ở mọi nước", "65% / 21% / 14%": tóm tắt (đã mở) chỉ nói "almost 2,000" lượt, 8 nước, không nêu các số kia; chỉ thấy các con số ở Wikipedia (bậc 3). Bỏ cho tới khi mở được bài.'
  - cu: 'Tuy nhiên, một bài báo gây tranh luận lớn của Rothbaum và cộng sự (2000) trên *American Psychologist* cho rằng chính **lý thuyết** đã mang màu sắc phương Tây: ba giả thuyết cốt lõi — người chăm sóc "nhạy cảm", trẻ "năng lực xã hội", và "bệ đỡ an toàn" để khám phá — đều ngầm đề cao giá trị **độc lập, tự chủ** của phương Tây. Ở Nhật, "nhạy cảm" có thể nghĩa là đoán trước nhu cầu của bé để bé **không phải** khóc đòi (văn hóa *amae* — sự nương tựa được chấp nhận), chứ không phải khuyến khích bé tự khám phá như ở Mỹ. Nhóm tác giả kêu gọi'
    moi: 'Tuy nhiên, một bài báo của Rothbaum và cộng sự (2000) trên *American Psychologist* cho rằng chính **lý thuyết** đã mang màu sắc phương Tây: ba giả thuyết cốt lõi — người chăm sóc "nhạy cảm" dẫn tới gắn bó an toàn, gắn bó an toàn dẫn tới năng lực xã hội, và trẻ dùng người chăm sóc làm "bệ đỡ an toàn" để khám phá — được đo bằng những thước đo thiên về tự chủ, cá nhân hóa và khám phá của phương Tây. So sánh Mỹ và Nhật, họ thấy sự nhạy cảm, năng lực xã hội và bệ đỡ an toàn được hiểu rất khác ở Nhật. Nhóm tác giả kêu gọi'
    ly_do: Chữ cũ về "amae" và "đoán trước nhu cầu để bé không phải khóc đòi" không có trong tóm tắt (bài gốc chưa mở); ba giả thuyết sửa lại đúng như tóm tắt (nhạy cảm → an toàn; an toàn → năng lực xã hội; bệ đỡ an toàn). Bỏ "gây tranh luận lớn".
  - cu: ':::vung-chac[bốn kiểu gắn bó được phát hiện ổn định; kiểu an toàn là phổ biến nhất ở mọi nơi đã nghiên cứu]

      Từ phòng thí nghiệm Baltimore năm 1978 đến hàng trăm nghiên cứu sau này, các nhà mã hóa được đào tạo đều phân loại ra cùng bốn kiểu hành vi trong tình huống lạ. Phân tích tổng hợp đa văn hóa (1988) xác nhận kiểu an toàn chiếm đa số ở tất cả 8 nước được đưa vào — dù tỉ lệ các kiểu không an toàn có dao động theo nơi chốn.

      :::'
    moi: ':::vung-chac[các kiểu gắn bó trong tình huống lạ có thể được mã hóa tin cậy; kiểu an toàn là phổ biến nhất]

      Tổng hợp gần 80 nghiên cứu về kiểu vô tổ chức (van IJzendoorn và cộng sự, 1999) cho thấy nhiều nhà nghiên cứu mã hóa được kiểu này một cách tin cậy; giáo trình ghi kiểu an toàn là kiểu phổ biến nhất, và tổng hợp đa văn hóa (1988) thấy khác biệt trong cùng một nước lớn hơn khác biệt giữa các nước, với kiểu tránh né nhiều hơn ở Tây Âu và kiểu kháng cự nhiều hơn ở Nhật Bản và Israel. Giới hạn: đây là về cách mã hóa hành vi trong tình huống lạ, không nói rằng kiểu gắn bó của một em bé cụ thể là cố định.

      :::'
    ly_do: 'Chữ cũ: "từ phòng thí nghiệm Baltimore năm 1978 đến hàng trăm nghiên cứu… đều phân loại ra cùng bốn kiểu" và "chiếm đa số ở tất cả 8 nước" không có nguồn đã mở. Chữ mới theo tóm tắt van IJzendoorn 1999 (độ tin cậy mã hóa D), giáo trình, van IJzendoorn & Kroonenberg 1988.'
  - cu: 'Các phân tích tổng hợp lớn (Fearon và cộng sự, 2010; Groh và cộng sự, 2012) với tổng cộng hơn 10.000 trẻ cho thấy gắn bó không an toàn — đặc biệt là kiểu vô tổ chức — làm tăng nguy cơ các vấn đề hành vi và cảm xúc sau này. Nhưng hiệu ứng chỉ ở mức nhỏ đến vừa (*d* ≈ 0,15–0,34): dự báo được xu hướng của nhóm, không định đoạt số phận của từng đứa trẻ.'
    moi: 'Các phân tích tổng hợp lớn (Fearon và cộng sự, 2010: 5.947 trẻ; Groh và cộng sự, 2012: 4.614 trẻ) cho thấy gắn bó không an toàn liên hệ với các vấn đề hành vi và cảm xúc sau này, và kiểu vô tổ chức nổi bật với hành vi hướng ngoại. Hiệu ứng chỉ ở mức nhỏ đến vừa (*d* ≈ 0,15–0,34) và là tương quan: nhìn được xu hướng của nhóm, không định đoạt số phận của từng đứa trẻ.'
    ly_do: 'Chữ cũ: "tổng cộng hơn 10.000 trẻ" (hai tổng hợp có thể chồng mẫu, không nên cộng), "làm tăng nguy cơ" (ngôn ngữ nhân quả), "đặc biệt là kiểu vô tổ chức" cho cả hai loại vấn đề (với hướng nội, vô tổ chức không có ý nghĩa thống kê).'
  - cu: Một phe (Rothbaum và cộng sự, 2000) cho rằng các khái niệm "nhạy cảm", "tự khám phá", "năng lực xã hội" đều thấm đẫm giá trị cá nhân chủ nghĩa phương Tây và kêu gọi lý thuyết bản địa. Phe còn lại đáp rằng kiểu an toàn vẫn chiếm đa số ở mọi nền văn hóa đã nghiên cứu, và "nhạy cảm" chỉ khác nhau ở hình thức biểu hiện. Cuộc tranh luận này chưa ngã ngũ.
    moi: Rothbaum và cộng sự (2000) cho rằng các khái niệm "nhạy cảm", "năng lực xã hội", "bệ đỡ an toàn" được đo bằng thước đo thiên về giá trị tự chủ của phương Tây, và kêu gọi cách tiếp cận bản địa với gắn bó. Giáo trình cũng ghi rằng gắn bó thay đổi theo văn hóa, một yếu tố nghiên cứu của Ainsworth không tính đến. Tổng hợp 1988 thì thấy khác biệt trong cùng một nước lớn hơn khác biệt giữa các nước. Cuộc tranh luận về tính phổ quát chưa ngã ngũ.
    ly_do: 'Chữ cũ nêu "phe còn lại đáp rằng… nhạy cảm chỉ khác nhau ở hình thức biểu hiện": không nguồn đã mở nào nói vậy; thay bằng giáo trình và van IJzendoorn & Kroonenberg 1988.'
  - cu: Đây là ngộ nhận phổ biến nhất — và cũng là ngộ nhận bị dữ liệu bác bỏ rõ ràng nhất. Trong tình huống lạ, điểm chẩn đoán là **lúc đoàn tụ**, không phải lúc chia tay. Bé tránh né trông có vẻ "ngoan, độc lập" vì không khóc, nhưng đó chính là một kiểu gắn bó *không an toàn*. Ngược lại, bé an toàn hoàn toàn có thể khóc khi mẹ đi — miễn là khi mẹ về, bé tìm đến mẹ, được vỗ về và quay lại chơi tiếp.
    moi: 'Trong tình huống lạ, việc bé khóc nhiều hay ít khi mẹ đi không cho biết kiểu gắn bó; điểm quan trọng là **lúc đoàn tụ**. Ainsworth và Bell (1970) thấy khóc và tìm kiếm mẹ không đi cùng nhau ở nhiều bé: có bé ít khóc mà tìm kiếm mạnh, có bé khóc dữ mà tìm kiếm yếu. Bé tránh né trông có vẻ "ngoan, độc lập" vì không khóc, nhưng việc tránh mẹ lúc đoàn tụ nhiều khả năng là phản ứng phòng thủ, và giáo trình xếp đó là kiểu *không an toàn*. "Hư" hay "ngoan" là phán xét về hành vi, không phải điều dữ liệu về gắn bó trả lời được.'
    ly_do: 'Chữ cũ: "ngộ nhận phổ biến nhất… bị dữ liệu bác bỏ rõ ràng nhất" (không đo), "điểm chẩn đoán" (từ dễ đọc như chẩn đoán), "đó chính là một kiểu không an toàn". Chữ mới theo Ainsworth & Bell 1970 và giáo trình. Chỗ khó: nhãn Đã bị bác bỏ gắn vào một niềm tin về giá trị; giữ cho phần có dữ liệu (khóc không cho biết kiểu gắn bó).'
  - cu: 'Qua hàng nghìn lần tương tác, bé rút ra một "kỳ vọng" ngầm: khi mình hoảng sợ, người chăm sóc có đến không? Bé được đáp ứng nhất quán sẽ mang kỳ vọng "người ta sẽ đến" — và chính kỳ vọng đó giúp bé dám rời mẹ đi khám phá, vì biết có thể quay về bất cứ lúc nào.'
    moi: Theo giáo trình, Bowlby cho rằng gắn bó lành mạnh cần người chăm sóc đáp ứng nhu cầu của bé và những tương tác vui vẻ hai chiều, và người chăm sóc là một "bệ đỡ an toàn" cho bé khám phá. Khái niệm mô hình làm việc nội tại giúp hiểu vì sao các kiểu hành vi gắn bó có tính liên tục.
    ly_do: Chữ cũ ("hàng nghìn lần tương tác", "kỳ vọng ngầm", "người ta sẽ đến") chưa kiểm được ở bản gốc; thay bằng giáo trình và Fearon 2010.
  - cu: 'Cha mẹ của bé an toàn có xu hướng **nhận ra tín hiệu của bé, diễn giải đúng và đáp ứng kịp thời**. Ngược lại, cha mẹ của bé tránh né thường từ chối hoặc khó chịu khi bé cần ôm ấp; cha mẹ của bé kháng cự thì đáp ứng thất thường, lúc có lúc không. Liên hệ này là có thật, nhưng chỉ ở mức vừa phải: cách chăm sóc giải thích được một phần, không phải toàn bộ khác biệt giữa các bé.'
    moi: 'Theo giáo trình, bé an toàn có người chăm sóc nhạy cảm và đáp ứng nhu cầu, còn bé tránh né nhiều khả năng có người chăm sóc thiếu nhạy cảm, ít chú ý đến nhu cầu của bé. Liên hệ này là có thật nhưng chỉ ở mức vừa phải: tổng hợp 66 nghiên cứu (De Wolff và van IJzendoorn, 1997) thấy *r* = 0,24 ở 21 nghiên cứu dùng tình huống lạ, và kết luận sự nhạy cảm "quan trọng nhưng không phải điều kiện duy nhất".'
    ly_do: Chữ cũ về cha mẹ bé tránh né "từ chối hoặc khó chịu khi bé cần ôm ấp" và cha mẹ bé kháng cự "đáp ứng thất thường" không có nguồn đã mở (giáo trình chỉ nêu thiếu nhạy cảm ở nhóm tránh né). Thêm số của De Wolff & van IJzendoorn 1997.
  - cu: 'Phân tích tổng hợp của Groh và cộng sự (2017) — 109 mẫu, 11.440 trẻ — cho thấy khí chất chỉ liên hệ **yếu** với gắn bó (*d* = 0,14): khí chất có vai trò, nhưng không phải câu chuyện chính'
    moi: 'Phân tích tổng hợp của Groh và cộng sự (2017) — 109 mẫu, 11.440 trẻ — cho thấy khí chất chỉ liên hệ **yếu** với gắn bó không an toàn nói chung (*d* = 0,14), nhưng liên hệ vừa với kiểu kháng cự (*d* = 0,30): khí chất có vai trò, nhưng không phải câu chuyện chính'
    ly_do: Thêm số d = 0,30 với kiểu kháng cự (cùng tóm tắt) để chữ "yếu" khỏi gây hiểu lầm.
  - cu: 'Không cần phải "hoàn hảo" từng giây — không cha mẹ nào làm được. Điều nghiên cứu ủng hộ là sự **nhất quán trong xu hướng**: khi bé khóc, sợ, đau, bạn nhận ra và đến với bé đủ thường xuyên để bé hình thành kỳ vọng "mình sẽ được giúp". Một lần bạn bận không đến ngay không "hỏng" gắn bó của bé.'
    moi: Không cần phải "hoàn hảo" từng giây — không cha mẹ nào làm được. Điều nghiên cứu có ủng hộ là sự nhạy cảm của người chăm sóc liên hệ ở mức vừa phải với gắn bó an toàn của bé (De Wolff và van IJzendoorn, 1997); tổng hợp ấy là tương quan và không đo xem một lần chưa đến ngay có ảnh hưởng gì.
    ly_do: Chữ cũ "nhất quán trong xu hướng", "kỳ vọng mình sẽ được giúp", "một lần bạn bận… không hỏng" không có nguồn; thay bằng điều De Wolff & van IJzendoorn nói và nêu rõ giới hạn.
  - cu: '### 2. Đừng "luyện tự lập" bằng cách bỏ mặc bé khóc :nhan[kha-vung]


      Quan niệm "cứ để nó khóc cho quen, mới tự lập được" đi ngược lại toàn bộ logic của thuyết gắn bó: bé học được sự tự tin để rời xa mẹ **chính từ** kinh nghiệm "mẹ luôn ở đó khi mình cần". Bé bị bỏ mặc khi khóc không học được tự lập — bé học được rằng kêu cũng vô ích, và chuyển sang chiến lược tránh né.'
    moi: '### 2. Bỏ mặc bé khóc để "luyện tự lập": có hại cho gắn bó không? :nhan[tranh-cai] { #2-dung-luyen-tu-lap-bang-cach-bo-mac-be-khoc-kha-vung }


      Logic của thuyết gắn bó gợi ý rằng sự đáp ứng của người chăm sóc quan trọng (xem mục 1), nên nhiều người lo cách "cứ để nó khóc cho quen" làm bé học rằng kêu cũng vô ích. Nhưng chúng tôi chưa tìm thấy nghiên cứu nào cho thấy điều đó. Các thử nghiệm ngẫu nhiên về can thiệp hành vi cho giấc ngủ của bé (trong đó có kiểu cho bé khóc trong khoảng thời gian có kiểm soát) chưa thấy ảnh hưởng xấu lên gắn bó hay cảm xúc sau 12 tháng và sau 5 năm (Gradisar và cộng sự, 2016: 43 bé; Price và cộng sự, 2012: 225 gia đình). Đó là các chương trình có cấu trúc, không phải bỏ mặc kéo dài, và cỡ mẫu còn nhỏ. Bài này không khuyên về cách dỗ ngủ: nếu bạn băn khoăn, hãy hỏi bác sĩ nhi khoa.'
    ly_do: 'Chữ cũ: nhãn Khá vững; "đi ngược lại toàn bộ logic của thuyết gắn bó… bé bị bỏ mặc khi khóc… chuyển sang chiến lược tránh né" không có nguồn nào kiểm. Các thử nghiệm ngẫu nhiên (Gradisar 2016, Price 2012) không thấy tác hại lên gắn bó. Đổi nhãn Khá vững thành Đang tranh cãi, giữ id mục cũ; không khuyên về cách dỗ ngủ.'
  - cu: 'Bowlby nói về "hình mẫu gắn bó" chứ không bắt buộc là mẹ đẻ: bố, ông bà, người chăm sóc gắn bó lâu dài đều có thể trở thành bệ đỡ an toàn của bé, và bé có thể có **thứ bậc** nhiều hình mẫu gắn bó. Điều quan trọng là tính ổn định và chất lượng tương tác, không phải danh xưng.'
    moi: Giáo trình nói về người chăm sóc chính chứ không bắt buộc là mẹ đẻ, và một tổng hợp 11 nghiên cứu (Fox và cộng sự, 1991) xếp kiểu gắn bó của cùng một bé với cả mẹ lẫn bố, thấy hai kiểu liên hệ với nhau. Điều quan trọng với thuyết là sự nhạy cảm và đáp ứng của người chăm sóc, không phải danh xưng.
    ly_do: Chữ cũ về bố, ông bà, "thứ bậc nhiều hình mẫu" của Bowlby chưa kiểm được ở bản gốc; ông bà không có nguồn. Thay bằng giáo trình và Fox 1991.
  - cu: '### 4. Bé bám mẹ là bình thường — đừng "chữa" :nhan[vung-chac]


      Ở tuổi 1–2, việc bé bám riết lấy mẹ, khóc khi mẹ đi khuất là **đúng lịch trình phát triển**, không phải dấu hiệu hư hay nhõng nhẽo. Nhu cầu gần gũi sẽ tự giảm dần khi hệ thống khám phá của bé mạnh lên — với điều kiện bé cảm thấy đủ an toàn để dám rời ra.'
    moi: '### 4. Bé bám mẹ là bình thường — đừng "chữa" :nhan[kha-vung] { #4-be-bam-me-la-binh-thuong-dung-chua-vung-chac }


      Ở khoảng 1 tuổi, việc bé tìm gần mẹ và khóc khi mẹ đi khuất là hành vi gắn bó thường thấy (Ainsworth và Bell, 1970: khi mẹ vắng, bé khóc và tìm kiếm nhiều hơn), không phải dấu hiệu "hư" hay "nhõng nhẽo". Nếu bạn lo lắng về mức độ bám của một em bé cụ thể, hãy hỏi bác sĩ nhi khoa hay chuyên viên tâm lý trẻ em; xem thêm [Hỗ trợ](/psyche/ho-tro/).'
    ly_do: 'Chữ cũ: nhãn Vững chắc; "đúng lịch trình phát triển ở tuổi 1–2" và "Nhu cầu gần gũi sẽ tự giảm dần… với điều kiện…" không có nguồn (nghiên cứu 1970 chỉ có bé khoảng 1 tuổi, 56 bé). Đổi nhãn Vững chắc thành Khá vững, giữ id mục cũ; thêm lời dẫn tới người có chuyên môn.'
  - cu: Chúng tôi chưa tìm thấy nghiên cứu nào dùng "tình huống lạ" trên trẻ em Việt Nam.** Mọi con số phân bố kiểu gắn bó ở trên đều đến từ các mẫu phương Tây, Nhật Bản, Israel, Trung Quốc — chưa có dữ liệu Việt Nam để so sánh.
    moi: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào dùng "tình huống lạ" trên trẻ em Việt Nam.** Các kết quả về kiểu gắn bó ở trên đến từ nghiên cứu ở các nơi khác (như Tây Âu, Nhật Bản, Israel), chưa có dữ liệu Việt Nam để so sánh.
    ly_do: Thêm mốc thời gian (thoi-su). Chữ cũ "mọi con số phân bố… Trung Quốc" không kiểm được (trang đã bỏ các số phân bố); thay bằng các nơi tóm tắt 1988 nêu.
  - cu: việc **ông bà chăm cháu** cực kỳ phổ biến, nhiều bé gắn bó sâu sắc với ông bà không kém gì cha mẹ. Thuyết gắn bó hoàn toàn cho phép điều này (bé có thể có nhiều hình mẫu gắn bó theo thứ bậc), nhưng chưa có nghiên cứu nào kiểm chứng bằng tình huống lạ xem "bệ đỡ an toàn" chính của trẻ Việt thường là ai, và tỉ lệ các kiểu gắn bó ra sao.
    moi: 'việc **ông bà tham gia nuôi dạy cháu** khá nhiều (một thử nghiệm ngẫu nhiên ở Việt Nam mở bài: "grandparents are significantly involved in the upbringing of grandchildren", Hoang và cộng sự, 2022). Chúng tôi chưa tìm thấy nghiên cứu nào kiểm chứng bằng tình huống lạ xem "bệ đỡ an toàn" chính của trẻ Việt thường là ai, và tỉ lệ các kiểu gắn bó ra sao.'
    ly_do: 'Chữ cũ "cực kỳ phổ biến", "nhiều bé gắn bó sâu sắc với ông bà không kém cha mẹ", "thuyết cho phép (thứ bậc)": không nguồn đã mở nào nói; thay bằng điều Hoang 2022 nói.'
  - cu: 'Một gợi ý từ nghiên cứu đa văn hóa: khác biệt *trong cùng một nước* còn lớn hơn khác biệt *giữa các nước* (van IJzendoorn và Kroonenberg, 1988).'
    moi: 'Một gợi ý từ nghiên cứu đa văn hóa: khác biệt *trong cùng một nước* lớn gấp khoảng 1,5 lần khác biệt *giữa các nước* (van IJzendoorn và Kroonenberg, 1988).'
    ly_do: Thêm số "gần 1,5 lần" từ tóm tắt.
  - cu: 'Ngược lại: bám mẹ ở tuổi 1–2 là đúng lịch trình phát triển, và chính cảm giác an toàn khi bám mới tạo ra sự tự lập thật sự sau này.'
    moi: 'Ngược lại: ở khoảng 1 tuổi, bé tìm gần mẹ khi mẹ vắng là hành vi gắn bó thường thấy (Ainsworth và Bell, 1970). Nói rằng cảm giác an toàn khi bám tạo ra sự tự lập về sau là một giả thuyết của thuyết gắn bó, không phải điều chúng tôi mở được nguồn kiểm.'
    ly_do: Chữ cũ "đúng lịch trình… chính cảm giác an toàn khi bám mới tạo ra sự tự lập thật sự" nói chắc hơn nguồn.
  - cu: Trong tình huống lạ, "không khóc, phớt lờ mẹ lúc đoàn tụ" chính là dấu hiệu của kiểu **tránh né** — một kiểu gắn bó không an toàn. Đừng nhầm chiến lược phòng thủ với sự trưởng thành.
    moi: Trong tình huống lạ, "ít khóc, phớt lờ mẹ lúc đoàn tụ" là hành vi của kiểu **tránh né** — được xếp là kiểu gắn bó không an toàn. Ainsworth và Bell (1970) cho rằng việc tránh mẹ như vậy nhiều khả năng là phản ứng phòng thủ. Đây là cách các nhà nghiên cứu mô tả hành vi trong một tình huống thí nghiệm, không dùng để xếp loại một em bé cụ thể.
    ly_do: Bỏ "chính là dấu hiệu" và "đừng nhầm…" (kết luận tuyệt đối, dễ đọc như chẩn đoán); nêu "nhiều khả năng phòng thủ" và lời rào.
  - cu: Các phân tích tổng hợp cho hiệu ứng dự báo chỉ ở mức nhỏ đến vừa. Gắn bó thời thơ ấu nghiêng cán cân, không định đoạt số phận — chất lượng chăm sóc về sau vẫn có thể thay đổi quỹ đạo.
    moi: 'Các phân tích tổng hợp cho hiệu ứng dự báo chỉ ở mức nhỏ đến vừa. Gắn bó thời thơ ấu nghiêng cán cân, không định đoạt số phận: phần lớn khác biệt về hành vi và cảm xúc sau này không được giải thích bởi kiểu gắn bó sớm.'
    ly_do: Bỏ "chất lượng chăm sóc về sau vẫn có thể thay đổi quỹ đạo" (các tổng hợp không đo).
  - cu: Bố, ông bà hay bất kỳ người chăm sóc ổn định, nhạy cảm nào cũng có thể là bệ đỡ an toàn của bé.
    moi: Giáo trình nói về người chăm sóc chính chứ không nhất thiết là mẹ, và nghiên cứu đã xếp kiểu gắn bó của bé với cả bố (Fox và cộng sự, 1991).
    ly_do: Chữ cũ về ông bà và "bất kỳ người chăm sóc ổn định, nhạy cảm nào" không có nguồn; thay bằng giáo trình và Fox 1991.
  - cu: '> Bé khóc nhiều hay ít lúc chia tay không phân biệt được các kiểu gắn bó — bé an toàn hoàn toàn có thể khóc to.'
    moi: '> Việc bé khóc nhiều hay ít lúc chia tay không cho biết kiểu gắn bó — bé an toàn vẫn có thể khóc to (Ainsworth và Bell, 1970 thấy khóc và tìm kiếm không đi cùng nhau ở nhiều bé).'
    ly_do: Làm mềm "không phân biệt được… hoàn toàn có thể" cho khớp nguồn.
  - cu: '? Phân bố "chuẩn" mà Ainsworth và cộng sự đề xuất là gì?

      - 50% an toàn, 30% tránh né, 20% kháng cự.

      + Khoảng 70% an toàn, 20% tránh né, 10% kháng cự — và phân tích tổng hợp đa văn hóa sau này cho tỉ lệ trung bình 65% / 21% / 14%.

      - 90% an toàn, 10% còn lại chia đều.

      > Con số 70–20–10 là mốc so sánh kinh điển từ nghiên cứu gốc; phân tích tổng hợp 32 mẫu từ 8 nước (van IJzendoorn và Kroonenberg, 1988) cho tỉ lệ trung bình 65% an toàn, 21% tránh né, 14% kháng cự — và kiểu an toàn phổ biến nhất ở mọi nước.'
    moi: '? Trong "tình huống lạ", kiểu gắn bó nào là phổ biến nhất?

      - Kiểu tránh né.

      + Kiểu an toàn.

      - Kiểu kháng cự.

      > Theo giáo trình, kiểu an toàn là kiểu phổ biến nhất. Tổng hợp gần 2.000 lượt phân loại ở 8 nước (van IJzendoorn và Kroonenberg, 1988) thấy kiểu tránh né nhiều hơn ở Tây Âu và kiểu kháng cự nhiều hơn ở Nhật Bản và Israel, và khác biệt trong cùng một nước lớn gấp khoảng 1,5 lần khác biệt giữa các nước.'
    ly_do: Câu hỏi cũ dựa vào "phân bố chuẩn 70/20/10" của Ainsworth và các số 65/21/14 (không nguồn đã mở nào có các số này). Thay bằng câu về kiểu phổ biến nhất, giải thích theo giáo trình và tóm tắt 1988 (không dựa vào vị trí lựa chọn).
  - cu: '+ Khi đoàn tụ, bé có hành vi mâu thuẫn, mất phương hướng: đang tiến về phía mẹ thì đông cứng, hoặc tỏ ra sợ chính người mình tìm đến.'
    moi: + Khi đoàn tụ, bé có hành vi khó hiểu, mâu thuẫn và rời rạc, không theo một chiến lược nhất quán.
    ly_do: Chữ cũ liệt kê hành vi cụ thể chưa kiểm được.
  - cu: '> Nhóm D (Main và Solomon, 1986, 1990) là những bé không xếp vừa vào ba kiểu "có tổ chức": hành vi của bé thiếu một chiến lược nhất quán, thường gắn với trải nghiệm đáng sợ như bạo hành, hoặc người chăm sóc vừa là nguồn an toàn vừa là nguồn đe dọa.'
    moi: '> Nhóm D (Main và Solomon, 1986, 1990) là những bé không xếp vừa vào ba kiểu còn lại: hành vi của bé thiếu một chiến lược nhất quán, và gặp nhiều hơn ở các bối cảnh nguy cơ cao như bạo hành (van IJzendoorn và cộng sự, 1999).'
    ly_do: Chữ cũ "người chăm sóc vừa là nguồn an toàn vừa là nguồn đe dọa" chưa kiểm được; bỏ.
  - cu: + Gắn bó không an toàn liên hệ với các vấn đề hành vi hướng ngoại sau này ở mức nhỏ đến vừa (d = 0,31); nhóm vô tổ chức có nguy cơ cao nhất.
    moi: + Gắn bó không an toàn liên hệ với các vấn đề hành vi hướng ngoại sau này ở mức nhỏ đến vừa (d = 0,31); nhóm vô tổ chức có mức liên hệ cao nhất.
    ly_do: '"nguy cơ cao nhất" nói như nhân quả; Fearon báo mức liên hệ (d).'
  - cu: + Ba giả thuyết cốt lõi của thuyết (về sự nhạy cảm, năng lực xã hội và bệ đỡ an toàn) thấm đẫm giá trị độc lập/tự chủ của phương Tây, nên cần các lý thuyết gắn bó "bản địa" cho từng nền văn hóa.
    moi: + Ba giả thuyết cốt lõi của thuyết (về sự nhạy cảm, năng lực xã hội và bệ đỡ an toàn) được đo bằng thước đo thiên về giá trị tự chủ của phương Tây, nên cần các cách tiếp cận gắn bó "bản địa" cho từng nền văn hóa.
    ly_do: 'Bám tóm tắt Rothbaum 2000: "measures… emphasize autonomy, individuation, exploration".'
  - cu: '> Điểm của Rothbaum và cộng sự không phải là bác bỏ gắn bó, mà là chất vấn tính phổ quát của *cách diễn giải* phương Tây: ví dụ ở Nhật, "nhạy cảm" có thể nghĩa là đoán trước nhu cầu để bé không phải khóc (văn hóa nương tựa amae), chứ không phải khuyến khích bé tự khám phá như ở Mỹ.'
    moi: '> Điểm của Rothbaum và cộng sự không phải là bác bỏ gắn bó, mà là chất vấn tính phổ quát của *cách đo và diễn giải* phương Tây: họ so sánh Mỹ và Nhật và thấy sự nhạy cảm, năng lực xã hội và bệ đỡ an toàn được hiểu rất khác ở Nhật.'
    ly_do: Chữ cũ về "amae" và cách hiểu "nhạy cảm" ở Nhật không có trong tóm tắt (bài gốc chưa mở).
