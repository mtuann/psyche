    luot_2_ghi_chu: 'Định nghĩa "safe haven" (nơi trú ẩn an toàn khi bé hoảng sợ): các nguồn đã mở chỉ dùng từ này (Solomon 2019: "safe haven effect"; OpenStax: "sought out in times of stress") mà không định nghĩa theo Bowlby/Ainsworth; APA Dictionary không tải được qua máy.'
