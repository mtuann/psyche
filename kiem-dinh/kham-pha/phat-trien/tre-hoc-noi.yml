    ghi_chu: 'Chữ cũ: "đã định hình nhiều chính sách giáo dục mầm non" (không nguồn). Chữ mới theo Golinkoff. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
