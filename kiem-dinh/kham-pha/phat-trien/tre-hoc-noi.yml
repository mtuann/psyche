    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: cả hai trang có trong src/content/docs/kham-pha/phat-trien/ với tiêu đề khớp. Review (Claude Opus 5.5, 10/11/2026): Hai trang có trong src/content/docs/kham-pha/phat-trien/, tiêu đề khớp ("Trẻ con học khác người lớn thế nào?", "Bé bám mẹ là tốt hay xấu?"), link đúng.'
    review: dung
  - id: n55
    cau: 'Câu 1: hẹp dần theo ngôn ngữ mẹ đẻ là trẻ ngày càng giỏi phân biệt âm tiếng mẹ đẻ và mất dần khả năng phân biệt âm không có trong tiếng mẹ đẻ.'
    loai: dinh-nghia
    nguon:
      - kuhl2006
    trich: The results show a significant increase in performance for the native-language contrast in the first year, a decline in nonnative perception over the same time period
    vi_tri: Kuhl 2006, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ trong lời giải thích: "trẻ Nhật kém dần". Chữ mới: "có xu hướng kém đi". Lý do: mức giảm ở trẻ Nhật không có ý nghĩa thống kê riêng. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối khớp Kuhl và cộng sự 2006 (lượt 1 và lượt 2 cùng đọc toàn văn); trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/16472309" ]
    review: dung
  - id: n56
    cau: 'Câu 2: ở trẻ học tiếng Anh nghe phụ âm không có trong tiếng Anh, khả năng phân biệt giảm rõ rệt từ 6–8 sang 10–12 tháng; giảm trong khoảng 6–12 tháng nếu âm không có trong môi trường của trẻ.'
    loai: phat-hien
    nguon:
      - kuhl2006
      - werker1984
    trich: a decrease in nonnative consonant perception occurs between 6–8 and 10–12 months of age (Werker & Tees, 1984)
    vi_tri: Kuhl 2006, mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "gần như không còn"; lời giải thích "mất đi trong khoảng 8–10 tháng". Chữ mới theo Kuhl 2006. Đã bỏ "tiếng Hindi" ở câu hỏi (xem nhận định về Werker & Tees). Lời giải thích không dựa vào vị trí lựa chọn. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Câu hỏi không còn "tiếng Hindi".'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2016/http://ilabs.washington.edu/kuhl/pdf/Kuhl_etal_2006.pdf", "https://europepmc.org/article/MED/12861072" ]
    review: dung
  - id: n57
    cau: "Câu 3: nhóm xem TV không học được dù nghe cùng thời gian (thậm chí nhiều âm tiết hơn) với nhóm gặp người thật; đáp án: không có tương tác xã hội trực tiếp, yếu tố mà các tác giả cho là quan trọng với việc học ngôn ngữ ở trẻ nhỏ."
    loai: phat-hien
    nguon:
      - kuhl2003
    trich: infants heard significantly more syllables in Experiment 2 when compared with Experiment 1 | suggesting an important role for social interaction in early language learning
    vi_tri: Kuhl 2003, mở bài
    ket_qua: da-sua
    ghi_chu: 'Đáp án "vì không có tương tác xã hội trực tiếp — yếu tố mở cổng cho việc học ngôn ngữ" là diễn giải của tác giả ("suggesting…"); khớp mức "gợi ý". Chỗ khó: cách nói "yếu tố mở cổng" mạnh hơn nguồn ("an important role"); lượt 2 xét nếu cần sửa chữ đáp án. Review (Claude Opus 5.5, 10/11/2026): Câu hỏi còn chữ cũ "dù nghe cùng lượng âm thanh" mà n22 đã sửa ở thân bài (nhóm DVD nghe nhiều âm tiết hơn); đáp án "yếu tố “mở cổng” cho việc học ngôn ngữ" mạnh hơn nguồn ("an important role", lượt 1 đã ghi chỗ khó). Đã sửa câu hỏi và đáp án; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2016/http://ilabs.washington.edu/kuhl/pdf/Kuhl_etal_2003.pdf" ]
    luot_2_ghi_chu: '"Yếu tố đề xuất": tác giả gợi ý tương tác xã hội; đúng mức.'
    review: sai
  - id: n58
    cau: 'Câu 4: trẻ có thể hiểu một số từ từ khoảng 6 tháng, khi chưa nói được từ nào; nghe hiểu thường đi trước nói; đếm từ nói được có thể đánh giá thấp những gì trẻ biết.'
    loai: phat-hien
    nguon:
      - bergelson2012
    trich: infants already know the meanings of several common words from the age of 6 mo onward
    vi_tri: Bergelson & Swingley 2012, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ở 10–11 tháng tuổi, trẻ hiểu được hàng chục từ… nhiều tháng… quy luật chung… Cha mẹ nên đọc tín hiệu…". Chữ mới theo Bergelson & Swingley; bỏ lời khuyên không nhãn. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/22331874", "https://www.nidcd.nih.gov/health/speech-and-language" ]
    review: dung
  - id: n59
    cau: 'Câu 5: con số 30 triệu từ gắn nhãn Đang tranh cãi vì Sperry và cộng sự (2019) không ủng hộ khẳng định của Hart và Risley, và học giới tranh luận về cách đo và ý nghĩa.'
    loai: phat-hien
    nguon:
      - sperry2019
      - golinkoff2019
    trich: Results do not support Hart and Risley's claim
    vi_tri: Sperry 2019, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "trẻ… nghe được nhiều hơn hẳn", "dựa trên mẫu nhỏ", "Điểm đồng thuận hiện nay…". Chữ mới theo Sperry và Golinkoff. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/29707767", "https://europepmc.org/article/MED/30102419" ]
    review: dung
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: Vì sao trẻ sơ sinh phân biệt được âm của mọi ngôn ngữ rồi hẹp dần theo tiếng mẹ đẻ
    moi: Vì sao trẻ sơ sinh phân biệt được âm của nhiều ngôn ngữ rồi hẹp dần theo tiếng mẹ đẻ
    ly_do: '"mọi ngôn ngữ" nói chắc hơn nguồn (Kuhl 2003: "many, if not all" trong tổng quan; chưa kiểm cho mọi ngôn ngữ).'
  - cu: '> Một em bé 6 tháng tuổi người Việt, chưa từng nghe tiếng Hindi, có phân biệt được hai âm "t" của tiếng Hindi không? Và khi em được 12 tháng tuổi, khả năng đó còn không?'
    moi: '> Một em bé 6 tháng tuổi trong gia đình chỉ nói tiếng Anh, chưa từng nghe một thứ tiếng khác (chẳng hạn tiếng Hindi), có phân biệt được hai âm lạ của thứ tiếng ấy không? Và khi em gần 12 tháng tuổi, khả năng đó còn không?'
    ly_do: 'Câu hỏi nói về "em bé người Việt", nhưng chưa có nghiên cứu nào trên trẻ Việt (xem thời sự); đổi sang trẻ nghe tiếng Anh, đúng nhóm các nghiên cứu về hẹp dần. Bỏ "hai âm t của tiếng Hindi": chưa mở được bài Werker & Tees nên không kiểm được âm cụ thể; Hindi chỉ còn là ví dụ về một thứ tiếng lạ.'
  - cu: 'Ở 6 tháng tuổi: **có** — trẻ phân biệt được, dù chưa từng nghe tiếng Hindi bao giờ. Ở 12 tháng tuổi: **gần như không còn**, nếu em chỉ nghe tiếng Việt. Trẻ sinh ra với đôi tai "quốc tế", rồi trong năm đầu đời đôi tai ấy dần trở thành "chuyên gia" của riêng tiếng mẹ đẻ.'
    moi: 'Ở 6–8 tháng tuổi: nhiều khả năng **có** — các nghiên cứu cho thấy trẻ phân biệt được các cặp âm không có trong tiếng mẹ đẻ. Ở 10–12 tháng tuổi: khả năng ấy **giảm rõ rệt**, nếu em chỉ nghe tiếng mẹ đẻ. Trong năm đầu đời, đôi tai của trẻ dần trở thành "chuyên gia" của riêng tiếng mẹ đẻ.'
    ly_do: Chữ cũ nói chắc cho một em bé cụ thể ("có", "gần như không còn", "người Việt"); nguồn nói về nhóm trẻ và mức suy giảm, không phải mọi trẻ. Bỏ "sinh ra với đôi tai quốc tế" (chưa có nguồn cho trẻ sơ sinh).
  - cu: trong 6 tháng đầu đời, trẻ phân biệt được các cặp âm của hầu hết mọi ngôn ngữ, kể cả những cặp âm người lớn bản ngữ không nghe ra.
    moi: trong nửa đầu năm đầu đời, trẻ phân biệt được nhiều cặp âm của các ngôn ngữ trên thế giới, kể cả những cặp âm người lớn khó phân biệt.
    ly_do: 'Kuhl 2003: "infants readily discern differences among the phonetic units used in the world''s languages"; "6 tháng đầu", "hầu hết mọi", "người lớn bản ngữ không nghe ra" nói chắc hơn nguồn.'
  - cu: 'rồi từ đầu tiên vào khoảng sinh nhật đầu tiên và giai đoạn "bùng nổ từ vựng" vào khoảng 18 tháng tuổi. Điểm then chốt: **trẻ hiểu trước khi nói được**.'
    moi: 'rồi từ đầu tiên vào khoảng sinh nhật đầu tiên và việc bắt đầu ghép từ vào khoảng 18 tháng tuổi. Điểm then chốt: **trẻ thường hiểu một số từ trước khi nói được**.'
    ly_do: 'Giáo trình nêu từ đầu tiên ~12 tháng và ghép từ ~18 tháng, không nêu "bùng nổ từ vựng"; Bergelson & Swingley: hiểu từ từ khoảng 6 tháng.'
  - cu: '**Thiết kế.** Janet Werker và Richard Tees theo dõi dọc cùng một nhóm trẻ học tiếng Anh, cho nghe các cặp phụ âm của tiếng Hindi và tiếng Salish — những âm không tồn tại trong tiếng Anh. Trẻ được dạy quay đầu về phía loa khi nghe thấy âm thay đổi để nhận thưởng.'
    moi: '**Thiết kế.** Janet Werker và Richard Tees cho trẻ học tiếng Anh nghe các cặp phụ âm không có trong tiếng Anh, ở nhiều độ tuổi trong năm đầu đời.'
    ly_do: 'Chưa mở được bài gốc nên bỏ: "theo dõi dọc cùng một nhóm", tên hai ngôn ngữ (Hindi, Salish) và chi tiết quay đầu nhận thưởng. Giữ điều Kuhl 2006 nói: Werker & Tees thấy phụ âm không phải tiếng mẹ đẻ giảm giữa 6–8 và 10–12 tháng.'
  - cu: '**Kết quả.** Ở 6–8 tháng tuổi, gần như tất cả trẻ đều phân biệt được các cặp âm lạ. Nhưng đến 10–12 tháng tuổi, chỉ còn rất ít trẻ làm được, dù các em vẫn phân biệt tốt các phụ âm tiếng Anh'
    moi: '**Kết quả.** Khả năng phân biệt phụ âm không có trong tiếng mẹ đẻ giảm từ 6–8 tháng sang 10–12 tháng tuổi (theo lời kể lại của Kuhl và cộng sự, 2006); trẻ vẫn phân biệt tốt các phụ âm tiếng Anh'
    ly_do: Bỏ "gần như tất cả" và "rất ít" (tỉ lệ chưa kiểm được ở bài gốc); giữ chiều của kết quả theo Kuhl 2006.
  - cu: 'Ở 6–8 tháng tuổi, trẻ Mỹ và trẻ Nhật phân biệt /r/–/l/ ngang nhau. Đến 10–12 tháng tuổi, trẻ Mỹ **giỏi lên** rõ rệt, còn trẻ Nhật **kém đi** — cùng một quá trình: kinh nghiệm với tiếng mẹ đẻ vừa *tăng cường* khả năng nghe âm quen, vừa *làm mờ* khả năng nghe âm lạ. Nhóm tác giả gọi đây là sự "cam kết thần kinh" với các đặc tính âm thanh của tiếng mẹ đẻ'
    moi: 'Ở 6–8 tháng tuổi, trẻ Mỹ và trẻ Nhật phân biệt /r/–/l/ ngang nhau (khoảng 65% đúng). Đến 10–12 tháng tuổi, trẻ Mỹ **giỏi lên** (63,7% lên 73,8%), còn trẻ Nhật có xu hướng **kém đi** (64,7% xuống 59,9%; mức giảm riêng của nhóm Nhật không có ý nghĩa thống kê, và trẻ Nhật vẫn trên mức ngẫu nhiên). Nhóm tác giả giải thích bằng sự "cam kết thần kinh" với các đặc tính âm thanh của tiếng mẹ đẻ: kinh nghiệm với tiếng mẹ đẻ vừa *tăng cường* khả năng nghe âm quen, vừa làm giảm khả năng nghe âm lạ'
    ly_do: 'Chữ cũ: "trẻ Nhật kém đi" và "cùng một quá trình…" nói chắc hơn nguồn: ở nhóm Nhật mức giảm không có ý nghĩa thống kê (F(1,24) = 1,26); tương tác tuổi × ngôn ngữ có ý nghĩa. Thêm số liệu.'
  - cu: '**Thiết kế.** 32 trẻ Mỹ 9 tháng tuổi được tiếp xúc với tiếng Quan Thoại qua 12 buổi, mỗi buổi 25 phút: người bản ngữ đọc sách và chơi cùng trẻ. Nhóm đối chứng cũng đến phòng thí nghiệm đủ 12 buổi nhưng chỉ nghe tiếng Anh. Thí nghiệm 2 lặp lại với cùng nội dung nhưng phát qua **TV hoặc băng tiếng** — không có người tương tác.'
    moi: '**Thiết kế.** Thí nghiệm 1: 32 trẻ Mỹ khoảng 9 tháng tuổi bắt đầu chương trình tiếp xúc với tiếng Quan Thoại (21 trẻ hoàn thành và được kiểm tra) qua 12 buổi trong 4 tuần, mỗi buổi 25 phút: người bản ngữ đọc sách 10 phút và chơi đồ chơi cùng trẻ 15 phút. Nhóm đối chứng cũng đến đủ 12 buổi nhưng chỉ nghe tiếng Anh. Thí nghiệm 2 dùng 32 trẻ khác (28 trẻ hoàn thành), xem các đoạn phim DVD có cùng người nói và tài liệu, phát qua **TV có hình và tiếng, hoặc chỉ tiếng** — không có người tương tác.'
    ly_do: Chữ cũ "32 trẻ" là số bắt đầu ở TN1; chỉ 21 trẻ hoàn thành (10 + 11). Thêm 10 + 15 phút đọc/chơi, "băng tiếng" thành DVD chỉ tiếng (nhóm A), TN2 có 32 trẻ riêng.
  - cu: Sau 12 buổi tiếp xúc trực tiếp (tổng cộng khoảng 5 giờ nghe), trẻ Mỹ phân biệt được cặp phụ âm tiếng Quan Thoại **ngang với trẻ cùng tuổi ở Đài Loan**. Nhưng nhóm xem TV hoặc nghe băng **không học được gì** — kết quả ngang với nhóm đối chứng chưa từng nghe tiếng Quan Thoại. Cùng một lượng âm thanh, chỉ khác ở chỗ có người thật tương tác hay không
    moi: Sau 12 buổi tiếp xúc trực tiếp (tổng cộng 5 giờ), trẻ Mỹ phân biệt được cặp phụ âm tiếng Quan Thoại **ngang với trẻ cùng tuổi ở Đài Loan** (so với số liệu đã công bố trước đó của nhóm tác giả). Nhưng nhóm xem TV hoặc nghe băng **không cho thấy việc học nào** — kết quả không khác nhóm đối chứng chưa từng nghe tiếng Quan Thoại. Cùng thời gian tiếp xúc (thậm chí nhiều âm tiết hơn), chỉ khác ở chỗ có người thật tương tác hay không
    ly_do: '"Không học được gì" thành "không cho thấy việc học nào"; "cùng một lượng âm thanh" sai: nhóm DVD nghe nhiều âm tiết hơn nhóm trực tiếp (P < 0,01), cùng thời gian 5 giờ; Đài Loan là so với dữ liệu trước (t(57) = 0,67), không phải cùng thí nghiệm.'
  - cu: '- **2–4 tháng:** tiếng "gừ gừ", ê a nguyên âm (cooing).'
    moi: '- **Những tháng đầu:** tiếng "gừ gừ", ê a nguyên âm (cooing).'
    ly_do: Chưa có nguồn đã mở cho mốc 2–4 tháng; giáo trình chỉ nói cooing đến trước bập bẹ.
  - cu: '- **~18 tháng:** **bùng nổ từ vựng** — tốc độ học từ mới tăng vọt; trẻ bắt đầu ghép hai từ ("mẹ bế", "ăn nữa").'
    moi: '- **~18 tháng:** trẻ bắt đầu ghép các từ ("mẹ bế", "ăn nữa").'
    ly_do: Giáo trình chỉ nêu ghép từ ở ~18 tháng; "bùng nổ từ vựng, tốc độ học từ tăng vọt" chưa có nguồn. Hình lo-trinh-hoc-noi vẫn ghi "bùng nổ từ vựng" (hình không sửa, ghi cho người giao).
  - cu: 'Một chi tiết quan trọng: ở 10–11 tháng tuổi, trẻ hiểu được hàng chục từ nhưng gần như chưa nói được từ nào — kho từ "hiểu" luôn vượt xa kho từ "nói" ([Fenson và cộng sự, 1994](https://doi.org/10.2307/1166093)). Vì thế, đếm số từ trẻ *nói được* sẽ đánh giá thấp những gì trẻ thật sự *biết*.'
    moi: 'Một chi tiết quan trọng: trẻ có thể hiểu một số từ thông dụng từ khoảng 6 tháng tuổi, khi chưa nói được từ nào ([Bergelson và Swingley, 2012](https://doi.org/10.1073/pnas.1113380109)); tốc độ phát triển giao tiếp của từng trẻ khác nhau rất nhiều ([Fenson và cộng sự, 1994](https://doi.org/10.2307/1166093)). Vì thế, đếm số từ trẻ *nói được* có thể đánh giá thấp những gì trẻ thật sự *biết*.'
    ly_do: Chữ cũ ("10–11 tháng… hàng chục từ… luôn vượt xa") không kiểm được ở tóm tắt của Fenson (chỉ nói biến thiên rất rộng); thay bằng Bergelson & Swingley (hiểu từ từ 6 tháng) và Fenson (biến thiên).
  - cu: ':::vung-chac[hẹp dần theo tiếng mẹ đẻ trong khoảng 6–12 tháng tuổi]

      Hiện tượng này đã được lặp lại ở nhiều cặp ngôn ngữ (Anh–Hindi, Anh–Nhật, Tây Ban Nha–Catalan…), bằng nhiều phương pháp đo, và là một trong những phát hiện ổn định nhất của tâm lý học phát triển ngôn ngữ. Trẻ nào cũng trải qua: tai nghe "quốc tế" lúc 6 tháng, "chuyên gia tiếng mẹ đẻ" lúc 12 tháng.

      :::'
    moi: ':::vung-chac[hẹp dần theo tiếng mẹ đẻ trong khoảng 6–12 tháng tuổi]

      Trong chín tương phản phụ âm đã công bố, bảy cho thấy suy giảm giữa 6–8 và 10–12 tháng tuổi (hai thì không: tiếng "click" châu Phi và /d/–/th/ ở trẻ Pháp), và một phân tích tổng hợp về nguyên âm thấy khả năng phân biệt âm bản ngữ và không bản ngữ đổi theo hai chiều ngược nhau trong năm đầu; hiện tượng cũng được thấy với thanh điệu. Giới hạn: không phải mọi tương phản đều suy giảm, và phần lớn dữ liệu là ở trẻ nói tiếng Anh, Nhật.

      :::'
    ly_do: Chữ cũ liệt kê "Tây Ban Nha–Catalan" và "Anh–Hindi" mà không nguồn đã mở nào nêu; "trẻ nào cũng trải qua" và "một trong những phát hiện ổn định nhất" bỏ. Thay bằng điều Kuhl 2006 (7/9 tương phản suy giảm), Tsuji & Cristia 2014 và Mattock & Burnham 2006 nói.
  - cu: 'Thí nghiệm của Kuhl và cộng sự (2003) cho thấy 12 buổi chơi cùng người bản ngữ giúp trẻ 9 tháng tuổi học được cặp âm mới, trong khi xem TV hoặc nghe băng với cùng nội dung thì không. Giới hạn: cơ chế chính xác (sự chú ý, tín hiệu xã hội, hay điều gì khác) vẫn đang được làm rõ.'
    moi: 'Thí nghiệm của Kuhl và cộng sự (2003) cho thấy 12 buổi chơi cùng người bản ngữ giúp trẻ 9 tháng tuổi học được cặp âm mới, trong khi xem TV hoặc nghe băng với cùng nội dung thì không; một tổng hợp về "video deficit" ở trẻ 0–6 tuổi cũng thấy trẻ nhìn chung học kém hơn từ video so với người thật, mức khoảng nửa độ lệch chuẩn nhưng có thể bị ước lượng quá cao (Strouse và Samson, 2021). Giới hạn: thí nghiệm gốc nhỏ (21 và 28 trẻ hoàn thành) và chỉ đo học một cặp âm; cơ chế chính xác (sự chú ý, tín hiệu xã hội, hay điều gì khác) vẫn đang được làm rõ.'
    ly_do: Thêm cỡ mẫu và tổng hợp Strouse & Samson 2021 làm căn cứ cho nhãn Khá vững.
  - cu: 'Ít nhất với việc học phân biệt âm vị ở cuối năm đầu đời, nội dung ghi sẵn không có tác dụng dù lượng âm thanh y hệt. Trẻ học ngôn ngữ qua **con người**, không phải qua loa. (Lưu ý: kết luận này áp dụng cho học âm vị ở trẻ sơ sinh; với trẻ lớn hơn học từ vựng qua video có tương tác, bức tranh phức tạp hơn.)'
    moi: 'Ít nhất với việc học phân biệt âm vị ở cuối năm đầu đời, nội dung ghi sẵn không cho thấy tác dụng trong thí nghiệm của Kuhl và cộng sự (2003), dù thời gian nghe y hệt. Trẻ học ngôn ngữ tốt hơn qua **con người** so với qua loa. (Lưu ý: kết luận này áp dụng cho học âm vị ở trẻ sơ sinh; với trẻ lớn hơn, khoảng cách giữa video và người thật nhỏ đi, và video có phản hồi theo trẻ thì khác video thường, nên bức tranh phức tạp hơn: Strouse và Samson, 2021; Golinkoff và cộng sự, 2019.)'
    ly_do: '"Không có tác dụng" và "không phải qua loa" nói chắc hơn nguồn: một thí nghiệm; tổng hợp 2021 thấy "deficit" giảm theo tuổi. "Cùng lượng âm thanh" sai (xem n về TN2): thành "thời gian nghe".'
  - cu: 'Năm 1995, Betty Hart và Todd Risley ước tính trẻ gia đình thu nhập thấp nghe ít hơn trẻ gia đình trí thức khoảng **30 triệu từ** trước 3 tuổi — con số nổi tiếng này đã định hình nhiều chính sách giáo dục mầm non. Nhưng văn liệu sau này tranh cãi mạnh: Sperry, Sperry và Miller (2019) ghi âm trong các cộng đồng thu nhập thấp và thấy trẻ nghe được **nhiều hơn hẳn** con số Hart và Risley báo cáo, với khác biệt lớn giữa các cộng đồng; đổi lại, Golinkoff và cộng sự (2019) phản biện rằng điều quan trọng là **chất lượng lời nói hướng trực tiếp vào trẻ**, không phải tổng số từ nghe lỏm được ([Sperry, Sperry và Miller, 2019](https://doi.org/10.1111/cdev.13072); [Golinkoff và cộng sự, 2019](https://doi.org/10.1111/cdev.13128)). Điểm đồng thuận hiếm hoi: trò chuyện trực tiếp, đáp lại trẻ thì tốt cho ngôn ngữ của trẻ — còn con số "30 triệu" thì không nên dùng như sự thật đã chốt.'
    moi: 'Năm 1995, Betty Hart và Todd Risley ước tính rằng đến 4 tuổi, trẻ ở nhóm hưởng trợ cấp ("welfare") đã nghe ít hơn trẻ ở nhóm gia đình trí thức ("professional") khoảng **30 triệu từ** hướng tới trẻ — con số nổi tiếng này khơi ra nhiều nghiên cứu lặp lại và cả tranh luận. Nhưng văn liệu sau này tranh cãi: Sperry, Sperry và Miller (2019), với dữ liệu từ năm cộng đồng ở Mỹ (quan sát tại nhà 42 trẻ từ 18 đến 48 tháng), không ủng hộ khẳng định của Hart và Risley, thấy khác biệt lớn trong từng nhóm thu nhập, và cho rằng cách định nghĩa môi trường lời nói loại trừ nhiều người chăm sóc và lời nói nghe lỏm làm đánh giá thấp lượng từ trẻ thu nhập thấp nghe; đổi lại, Golinkoff và cộng sự (2019) phản biện rằng điều quan trọng là **chất lượng lời nói hướng trực tiếp vào trẻ**, không phải lời nghe lỏm ([Sperry, Sperry và Miller, 2019](https://doi.org/10.1111/cdev.13072); [Golinkoff và cộng sự, 2019](https://doi.org/10.1111/cdev.13128)). Vì vậy con số "30 triệu" không nên dùng như sự thật đã chốt.'
    ly_do: 'Chữ cũ: "trước 3 tuổi" (Golinkoff: "by the age of 4 years"), "đã định hình nhiều chính sách" (không nguồn), "ghi âm", "nhiều hơn hẳn" (tóm tắt Sperry nói "không ủng hộ", "bystander talk… underestimate"), "Điểm đồng thuận hiếm hoi" (không nguồn nào nói hai phía đồng thuận). Hart & Risley 1995 là sách, chưa mở; theo lời kể của Golinkoff và Sperry.'
  - cu: Kuhl cho rằng chính việc thống kê này dẫn đến "cam kết thần kinh" với tiếng mẹ đẻ.
    moi: Kuhl và cộng sự đề xuất rằng kinh nghiệm với tiếng mẹ đẻ dẫn đến "cam kết thần kinh" với âm của nó, và nêu việc trẻ 6–8 tháng tách từ bằng xác suất chuyển tiếp giữa các âm tiết như một ví dụ của học thống kê.
    ly_do: 'Chữ cũ nói chính học thống kê dẫn đến cam kết thần kinh: Kuhl 2003 chỉ nêu hai điều riêng (học thống kê; cam kết thần kinh).'
  - cu: Khung này giải thích tốc độ học nhanh và các mốc chung ở mọi nền văn hóa, nhưng khó giải thích chi tiết quá trình hẹp dần theo kinh nghiệm.
    moi: Khung này hợp với việc các mốc đầu (ê a, bập bẹ, từ đầu tiên) xuất hiện ở độ tuổi gần như nhau ở trẻ nhiều nền văn hóa (theo giáo trình).
    ly_do: Chữ cũ về "tốc độ học nhanh" và "khó giải thích hẹp dần" là đánh giá không có nguồn; giáo trình nói trẻ ở mọi nền văn hóa bập bẹ vào độ tuổi như nhau và nói từ đầu tiên ~12 tháng.
  - cu: 'Giả thuyết của Kuhl: bộ não trẻ chỉ "mở cổng" học ngôn ngữ tối đa khi có tương tác xã hội — ánh mắt, nụ cười, sự đáp lại. Điều này giải thích vì sao cùng một nội dung, người thật dạy được mà TV thì không.'
    moi: Kuhl và cộng sự (2003) gợi ý tương tác xã hội đóng vai trò quan trọng trong học ngôn ngữ ở trẻ nhỏ, có thể giống vai trò của tương tác xã hội trong việc chim học hót; điều này phù hợp với việc cùng nội dung, người thật dạy được mà TV thì không (chưa rõ do yếu tố nào của người thật).
    ly_do: Chữ cũ ("chỉ mở cổng", "ánh mắt, nụ cười, sự đáp lại", "giải thích") không có trong bài 2003 (tác giả viết "suggesting an important role… perhaps analogous to avian song learning"). Từ "cổng xã hội" thuộc bài khác của Kuhl, chưa mở.
  - cu: 'Michael Tomasello nhấn mạnh trẻ học ngôn ngữ để **làm việc** với người khác: chỉ trỏ, nhờ vả, chia sẻ chú ý. Theo hướng này, từ đầu tiên của trẻ thường là những từ "dùng được" nhất trong đời sống của em.'
    moi: 'Michael Tomasello nhấn mạnh vai trò của sự **chú ý chung** với người chăm sóc: trong nghiên cứu của Tomasello và Farrar (1986) trên 24 trẻ, trong những lúc mẹ và trẻ cùng chú ý vào một vật, cả mẹ lẫn trẻ nói nhiều hơn.'
    ly_do: Chữ cũ ("để làm việc với người khác", "từ đầu tiên là những từ dùng được nhất") không có nguồn đã mở; thay bằng điều tóm tắt Tomasello & Farrar 1986 nói.
  - cu: '### 1. Nói chuyện trực tiếp, đáp lại tiếng bập bẹ của trẻ :nhan[vung-chac]


      Khi trẻ "ba-ba", hãy đáp lại như một cuộc trò chuyện thật: "Ừ, ba-ba hả con?" Sự đáp lại kịp thời dạy trẻ rằng âm thanh có sức mạnh giao tiếp — đúng cơ chế "cổng xã hội" mà nghiên cứu của Kuhl chỉ ra.'
    moi: '### 1. Nói chuyện trực tiếp, đáp lại tiếng bập bẹ của trẻ :nhan[kha-vung] { #1-noi-chuyen-truc-tiep-dap-lai-tieng-bap-be-cua-tre-vung-chac }


      Khi trẻ "ba-ba", hãy đáp lại như một cuộc trò chuyện thật: "Ừ, ba-ba hả con?" Các nghiên cứu quan sát thấy cha mẹ đáp lại nhạy bén gắn với ngôn ngữ của trẻ tốt hơn (tổng hợp 36 nghiên cứu, r = 0,27); đây là tương quan, chưa nói được nhân quả (Madigan và cộng sự, 2019).'
    ly_do: 'Chữ cũ: Vững chắc; "dạy trẻ rằng âm thanh có sức mạnh giao tiếp — đúng cơ chế cổng xã hội". Chữ mới: Khá vững; dẫn Madigan 2019 (tương quan, "cannot speak to causal processes"). Giữ id mục cũ.'
  - cu: Trẻ 1 tuổi hiểu được hàng chục từ nhưng chỉ nói được vài từ là hoàn toàn bình thường — kho từ hiểu luôn đi trước kho từ nói.
    moi: Trẻ nhỏ có thể hiểu một số từ (từ khoảng 6 tháng) trước khi nói được từ nào, và tốc độ nói của từng trẻ khác nhau rất nhiều — nên việc trẻ hiểu nhiều hơn nói là điều thường gặp (Bergelson và Swingley, 2012; Fenson và cộng sự, 1994).
    ly_do: Chữ cũ "hàng chục từ… vài từ… hoàn toàn bình thường… luôn đi trước" nói chắc hơn và gần như một nhận định về bình thường/bất thường cho từng trẻ; thay bằng điều hai nguồn nói.
  - cu: Với việc học âm vị ở cuối năm đầu đời, video và băng tiếng không thay thế được người thật. Thời gian xem màn hình của trẻ sơ sinh tốt nhất nên được thay bằng thời gian chơi và trò chuyện cùng người thân — điều này có bằng chứng trực tiếp từ thí nghiệm của Kuhl và cộng sự (2003).
    moi: Với việc học âm vị ở cuối năm đầu đời, trong thí nghiệm của Kuhl và cộng sự (2003) video và băng tiếng không thay được người thật, và tổng hợp về "video deficit" cũng thấy trẻ nhỏ học kém hơn từ video (Strouse và Samson, 2021). Vì vậy nên ưu tiên thời gian chơi và trò chuyện cùng người thân cho trẻ sơ sinh; bằng chứng trực tiếp là thí nghiệm của Kuhl, còn việc "thay thời gian xem màn hình" là suy ra từ đó.
    ly_do: 'Chữ cũ "không thay thế được", "tốt nhất nên được thay", "bằng chứng trực tiếp" nói chắc hơn: một thí nghiệm về học âm, không đo việc thay thời gian xem màn hình.'
  - cu: Nếu lo lắng về sự chậm nói của trẻ (ví dụ sau 18 tháng vẫn chưa có từ nào có nghĩa), hãy trao đổi với bác sĩ nhi khoa thay vì tự kết luận từ bài viết này.
    moi: Nếu bạn lo lắng về sự phát triển ngôn ngữ của một em bé cụ thể, hãy trao đổi với bác sĩ nhi khoa hay chuyên viên ngôn ngữ trị liệu thay vì tự kết luận từ bài viết này; xem thêm [Hỗ trợ](/psyche/ho-tro/).
    ly_do: Bỏ ngưỡng "sau 18 tháng chưa có từ nào" (một mốc lâm sàng không có nguồn đã mở, dễ bị đọc như tiêu chí chẩn đoán); thêm link Hỗ trợ.
  - cu: Chúng tôi chưa tìm thấy nghiên cứu nào về hiện tượng hẹp dần thính giác hay lộ trình học nói được thực hiện trên trẻ em Việt Nam.
    moi: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu nào về hiện tượng hẹp dần thính giác hay lộ trình học nói được thực hiện trên trẻ em Việt Nam.
    ly_do: Thêm mốc thời gian (thoi-su).
  - cu: 'Một điểm đáng lưu ý: tiếng Việt là **ngôn ngữ thanh điệu** với 6 thanh, còn phần lớn nghiên cứu về hẹp dần được làm trên các ngôn ngữ không thanh điệu (tiếng Anh, tiếng Nhật). Lộ trình chi tiết ở trẻ Việt — ví dụ mốc hẹp dần với thanh điệu so với phụ âm — có thể khác, và cần nghiên cứu trực tiếp trên trẻ Việt Nam mới trả lời được.'
    moi: 'Một điểm đáng lưu ý: tiếng Việt là **ngôn ngữ thanh điệu** với 6 thanh, còn nghiên cứu về trẻ sơ sinh vốn tập trung vào phụ âm và nguyên âm (Mattock và Burnham, 2006). Với thanh điệu, trẻ Trung Quốc 6 và 9 tháng phân biệt tốt như nhau, còn trẻ Anh kém đi giữa 6 và 9 tháng, nên hẹp dần cũng thấy ở thanh điệu; lộ trình chi tiết ở trẻ Việt thì cần nghiên cứu trực tiếp trên trẻ Việt Nam mới trả lời được.'
    ly_do: Chữ cũ "phần lớn nghiên cứu… ngôn ngữ không thanh điệu (Anh, Nhật)" không kiểm được; thay bằng điều Mattock & Burnham 2006 nói (kể cả kết quả cho thanh điệu).
  - cu: Để *giữ* được khả năng phân biệt âm của một ngôn ngữ, trẻ cần tương tác trực tiếp với người nói thứ tiếng ấy — nghe loa thụ động không đủ (Kuhl và cộng sự, 2003).
    moi: Trong thí nghiệm của Kuhl và cộng sự (2003), trẻ 9 tháng học được cặp âm mới khi tiếp xúc với người thật nhưng không thấy việc học khi xem DVD hay chỉ nghe tiếng; nên chưa thể nói bật loa ngoại ngữ là đủ.
    ly_do: 'Chữ cũ nói về "giữ được" khả năng phân biệt và "không đủ" (chắc hơn nguồn: thí nghiệm về học lại cặp âm ở 9–10 tháng).'
  - cu: Con số này đến từ một nghiên cứu năm 1995 với mẫu nhỏ và đang bị tranh cãi mạnh trong văn liệu.
    moi: Con số này đến từ một nghiên cứu năm 1995 và đang bị tranh cãi trong văn liệu.
    ly_do: Bỏ "mẫu nhỏ" (cỡ mẫu của Hart & Risley chưa kiểm được trong nguồn đã mở).
  - cu: Bập bẹ chuẩn (6–8 tháng) cho thấy bộ máy phát âm của trẻ đã sẵn sàng cho ngôn ngữ, và âm sắc của tiếng bập bẹ đã mang "màu" của tiếng mẹ đẻ. Đó là luyện tập, không phải tiếng ồn.
    moi: Bập bẹ (khoảng 6–8 tháng) là một mốc trong phát triển tiếng nói, thường đến trước từ đầu tiên; giáo trình ghi âm điệu trẻ phát ra đã theo tiếng mẹ đẻ của gia đình (giáo trình nói về giai đoạn cooing).
    ly_do: Chữ cũ "bộ máy phát âm sẵn sàng", "âm sắc… mang màu của tiếng mẹ đẻ" (cho bập bẹ), "Đó là luyện tập" chưa có nguồn; giáo trình nói âm điệu theo tiếng mẹ đẻ ở cooing.
  - cu: 'Trẻ không chỉ nhại lại: các em tự tạo ra những câu chưa từng nghe và sửa dần theo quy tắc ngôn ngữ. Bắt chước chỉ là một phần.'
    moi: Giáo trình ghi Skinner cho rằng trẻ học ngôn ngữ qua củng cố và phản hồi, còn Chomsky (1957) phê bình và đề xuất trẻ sinh ra đã có năng lực học ngôn ngữ; các khung giải thích hiện nay (xem mục "Các lý thuyết giải thích") không dừng ở bắt chước.
    ly_do: Chữ cũ ("tự tạo ra những câu chưa từng nghe và sửa dần theo quy tắc") không có nguồn đã mở; thay bằng điều giáo trình nói.
  - cu: '> Đây là quá trình "được cái này, mất cái kia": Kuhl và cộng sự (2006) cho thấy trẻ Mỹ giỏi dần cặp /r/–/l/ trong khi trẻ Nhật kém dần — cùng một quá trình cam kết thần kinh với tiếng mẹ đẻ.'
    moi: '> Đây là quá trình "được cái này, mất cái kia": Kuhl và cộng sự (2006) thấy trẻ Mỹ giỏi lên ở cặp /r/–/l/ trong khi trẻ Nhật có xu hướng kém đi; các tác giả giải thích bằng sự cam kết thần kinh với tiếng mẹ đẻ.'
    ly_do: Khớp mức của nguồn (mức giảm ở trẻ Nhật không có ý nghĩa thống kê riêng).
  - cu: '? Trong thí nghiệm của Werker và Tees (1984), điều gì xảy ra với trẻ học tiếng Anh khi nghe các cặp phụ âm tiếng Hindi?'
    moi: '? Trong thí nghiệm của Werker và Tees (1984), điều gì xảy ra với trẻ học tiếng Anh khi nghe các cặp phụ âm không có trong tiếng Anh?'
    ly_do: 'Bỏ "tiếng Hindi" trong câu hỏi: chưa mở được bài gốc nên không kiểm được ngôn ngữ cụ thể.'
  - cu: '+ Trẻ 6–8 tháng tuổi phân biệt được, nhưng đến 10–12 tháng tuổi thì gần như không còn.

      > Khả năng phân biệt âm lạ mất đi trong khoảng 8–10 tháng tuổi nếu âm đó không xuất hiện trong môi trường của trẻ.'
    moi: '+ Trẻ 6–8 tháng tuổi phân biệt được, nhưng đến 10–12 tháng tuổi thì khả năng ấy giảm rõ rệt.

      > Khả năng phân biệt âm lạ giảm trong khoảng 6–12 tháng tuổi nếu âm đó không xuất hiện trong môi trường của trẻ.'
    ly_do: '"gần như không còn" và "8–10 tháng" nói chắc hơn nguồn (Kuhl 2006: giảm giữa 6–8 và 10–12 tháng).'
  - cu: '? Ở 10–11 tháng tuổi, trẻ hiểu được hàng chục từ nhưng gần như chưa nói được từ nào. Điều này cho thấy gì?

      - Trẻ chậm phát triển ngôn ngữ.

      + Khả năng nghe hiểu đi trước khả năng phát âm nhiều tháng; đếm từ nói được sẽ đánh giá thấp những gì trẻ biết.

      - Trẻ cố tình không chịu nói.

      > Hiểu trước, nói sau là quy luật chung. Cha mẹ nên đọc tín hiệu từ những gì trẻ hiểu (quay lại khi gọi tên, chỉ đúng đồ vật) chứ không chỉ đếm từ trẻ nói ra.'
    moi: '? Nghiên cứu cho thấy trẻ có thể hiểu một số từ từ khoảng 6 tháng tuổi, khi chưa nói được từ nào. Điều này cho thấy gì?

      - Trẻ chậm phát triển ngôn ngữ.

      + Khả năng nghe hiểu thường đi trước khả năng nói; chỉ đếm từ nói được có thể đánh giá thấp những gì trẻ biết.

      - Trẻ cố tình không chịu nói.

      > Bergelson và Swingley (2012) thấy trẻ 6–9 tháng nhìn đúng hình khi nghe tên các vật quen thuộc, tức đã hiểu một số từ trước khi nói được.'
    ly_do: Câu cũ ("hàng chục từ", "nhiều tháng", "quy luật chung", lời khuyên đọc tín hiệu) không kiểm được hay là lời khuyên thiếu nhãn; viết lại theo Bergelson & Swingley.
  - cu: '+ Vì các nghiên cứu sau này (ví dụ Sperry, Sperry và Miller, 2019) ghi nhận trẻ ở cộng đồng thu nhập thấp nghe được nhiều hơn hẳn, và học giới tranh luận về cách đo lẫn ý nghĩa của con số.

      - Vì 30 triệu là con số quá nhỏ so với thực tế.

      > Con số nổi tiếng này dựa trên mẫu nhỏ và cách ngoại suy gây tranh cãi. Điểm đồng thuận hiện nay chỉ dừng ở: trò chuyện trực tiếp, đáp lại trẻ thì tốt cho ngôn ngữ của trẻ — còn con số cụ thể thì chưa chốt được.'
    moi: '+ Vì các nghiên cứu sau này (ví dụ Sperry, Sperry và Miller, 2019) không ủng hộ khẳng định của Hart và Risley, và học giới tranh luận về cách đo lẫn ý nghĩa của con số.

      - Vì 30 triệu là con số quá nhỏ so với thực tế.

      > Sperry và cộng sự (2019) thấy khác biệt lớn trong từng nhóm thu nhập và cho rằng cách đo của Hart và Risley bỏ sót lời nói của nhiều người chăm sóc; Golinkoff và cộng sự (2019) đáp rằng chất lượng lời nói hướng vào trẻ mới là điều quan trọng. Con số cụ thể vì thế chưa chốt được.'
    ly_do: 'Chữ cũ: "nghe được nhiều hơn hẳn", "dựa trên mẫu nhỏ", "Điểm đồng thuận hiện nay…" (không có nguồn); viết lại theo Sperry 2019 và Golinkoff 2019.'
  - cu: '- Fenson, L., Dale'
    moi: '- Bergelson, E., & Swingley, D. (2012). At 6–9 months, human infants know the meanings of many common nouns. *Proceedings of the National Academy of Sciences*, 109(9), 3253–3258. <https://doi.org/10.1073/pnas.1113380109>

      - Fenson, L., Dale'
    ly_do: Thêm nguồn mới dùng ở trên (xếp theo chữ cái).
  - cu: '- Hart, B., & Risley'
    moi: '- Madigan, S., Prime, H., Graham, S. A., Rodrigues, M., Anderson, N., Khoury, J., & Jenkins, J. M. (2019). Parenting behavior and child language: A meta-analysis. *Pediatrics*, 144(4), e20183556. <https://doi.org/10.1542/peds.2018-3556>

      - Mattock, K., & Burnham, D. (2006). Chinese and English infants'' tone perception: Evidence for perceptual reorganization. *Infancy*, 10(3), 241–265. <https://doi.org/10.1207/s15327078in1003_3>

      - OpenStax. (2020). *Psychology 2e*, chương 9: Lifespan Development. <https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development>

      - Hart, B., & Risley'
    ly_do: Thêm nguồn mới dùng ở trên.
  - cu: '- Sperry, D. E., Sperry, L. L., & Miller'
    moi: '- Strouse, G. A., & Samson, M. (2021). Learning from video: A meta-analysis of the video deficit in children ages 0 to 6 years. *Child Development*, 92(1), e20–e38. <https://doi.org/10.1111/cdev.13429>

      - Tomasello, M., & Farrar, M. J. (1986). Joint attention and early language. *Child Development*, 57(6), 1454–1463. <https://doi.org/10.1111/j.1467-8624.1986.tb00470.x>

      - Tsuji, S., & Cristia, A. (2014). Perceptual attunement in vowels: A meta-analysis. *Developmental Psychobiology*, 56(2), 179–191. <https://doi.org/10.1002/dev.21179>

      - Sperry, D. E., Sperry, L. L., & Miller'
    ly_do: Thêm nguồn mới dùng ở trên.
  - cu: 'Hình lo-trinh-hoc-noi: "2–4 tháng: cooing" (chấm ở 1,5 tháng); "~18 tháng: bùng nổ từ vựng"; chú thích "…Các mốc là gần đúng và khác nhau ở từng trẻ; thứ tự các mốc thì rất ổn định."'
    moi: '"~2 tháng: cooing (ê a)" (chấm ở 2 tháng); "16–24 tháng: ghép từ, vốn từ tăng nhanh"; chú thích "…Trẻ thường đi qua các mốc theo thứ tự này, nhưng các mốc tuổi chỉ là gần đúng và thời điểm khác nhau rất nhiều giữa các trẻ."'
    ly_do: Review D6-L3, hồ sơ n8, n10 (OpenStax Lifespan Development 3.5; Fenson 1994; lượt 2 quá mạnh ở n10).
  - cu: '"Các mốc phát âm được ghi nhận khá ổn định:" và "**Những tháng đầu:** tiếng “gừ gừ”…"'
    moi: '"Trẻ thường đi qua các mốc phát âm theo thứ tự sau; mốc tuổi chỉ là gần đúng ([OpenStax Lifespan Development, mục 3.5](…)):" và "**Từ khoảng 2 tháng:** …"'
    ly_do: Review D6-L3, hồ sơ n6.
  - cu: ":::kha-vung[tương tác trực tiếp với người thật giúp trẻ học âm mới hiệu quả hơn hẳn nghe thụ động] … (Strouse và Samson, 2021). Giới hạn: …"
    moi: ":::kha-vung[… hiệu quả hơn nghe thụ động] … có thể bị ước lượng quá cao, và khoảng chênh nhỏ dần khi trẻ lớn hơn (Strouse và Samson, 2021). Vì vậy không nên trông vào video dạy ngoại ngữ để trẻ sơ sinh tự “thấm” âm. Giới hạn: …"
    ly_do: Review D6-L3, hồ sơ n27, n29.
  - cu: ":::bac-bo[cho trẻ xem video dạy ngoại ngữ là đủ để trẻ 'thấm' âm] … :::"
    moi: (bỏ cả khung; ý chính chuyển vào khung Khá vững ngay trên)
    ly_do: "Review D6-L3, hồ sơ n29: không đạt thước đo Đã bị bác bỏ; lượt 2 quá mạnh."
  - cu: '"Khung này hợp với việc các mốc đầu (ê a, bập bẹ, từ đầu tiên) xuất hiện ở độ tuổi gần như nhau ở trẻ nhiều nền văn hóa (theo giáo trình)."'
    moi: '"Khung này hợp với việc trẻ ở các nền văn hóa khác nhau đạt các mốc ngôn ngữ ở độ tuổi gần như nhau ([OpenStax Lifespan Development, mục 3.5](…))."'
    ly_do: Review D6-L3, hồ sơ n36.
  - cu: '"tiếng Việt là **ngôn ngữ thanh điệu** với 6 thanh, còn…"'
    moi: '"… với 6 thanh (Zhu và cộng sự, 2023), còn…"; thêm Zhu và cộng sự (2023) và OpenStax Lifespan Development vào mục Nguồn'
    ly_do: "Review D6-L3, hồ sơ n48: nguồn bình duyệt thay Wikipedia."
  - cu: 'Câu 3: "…dù nghe cùng lượng âm thanh với nhóm gặp người thật?"; đáp án "Vì không có tương tác xã hội trực tiếp — yếu tố “mở cổng” cho việc học ngôn ngữ ở trẻ sơ sinh."'
    moi: '"…dù nghe cùng thời gian (thậm chí nhiều âm tiết hơn) với nhóm gặp người thật?"; "Vì không có tương tác xã hội trực tiếp, yếu tố mà các tác giả cho là quan trọng với việc học ngôn ngữ ở trẻ nhỏ."'
    ly_do: Review D6-L3, hồ sơ n57, n22.
