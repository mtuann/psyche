    ghi_chu: 'Chữ cũ: "theo dõi dọc cùng một nhóm trẻ học tiếng Anh, cho nghe các cặp phụ âm của tiếng Hindi và tiếng Salish… Trẻ được dạy quay đầu… nhận thưởng" (cũng ở Tự trải nghiệm và câu hỏi 2: "tiếng Hindi"). Chữ mới bỏ các chi tiết ấy. Lý do: chưa mở được bài gốc (không có tóm tắt ở Europe PMC, Crossref, OpenAlex; một bài tìm web chỉ trả lời kể thứ cấp), Kuhl 2006 chỉ nêu "nonnative consonant" và độ tuổi. Chỗ khó: Hindi và Salish rất có thể đúng; lượt 2 tìm bản đọc được để đưa lại. Review (Claude Opus 5.5, 10/11/2026): Review thử mở Werker & Tees 1984 ở Internet Archive (bộ wikipedia-scholarly-sources-corpus): không có tệp; trang ghi rõ "theo lời kể lại của Kuhl và cộng sự, 2006"; OpenStax Lifespan Development (2024), mục 3.5 cũng dẫn Werker & Tees 1984 cho việc giảm khả năng phân biệt âm lạ ở 10–12 tháng. Khớp.'
