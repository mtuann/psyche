nhan_dinh:
  - id: n1
    cau: 'Trang mô tả: vì sao trẻ sơ sinh phân biệt được âm của nhiều ngôn ngữ rồi hẹp dần theo tiếng mẹ đẻ, và lộ trình từ bập bẹ đến từ đầu tiên.'
    loai: ve-site
    ket_qua: da-lam-mem
    ghi_chu: 'Mô tả (description). Chữ cũ: "âm của mọi ngôn ngữ". Chữ mới: "nhiều ngôn ngữ". Lý do: nguồn không nói "mọi". Review (Claude Opus 5.5, 10/11/2026): Đổi loại phat-hien thành ve-site: câu là mô tả (description) nội dung của chính trang. Đã kiểm trên trang: có mục hẹp dần theo tiếng mẹ đẻ và lộ trình từ bập bẹ đến từ đầu tiên; khớp.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Câu mô tả trang (ve-site): không qua lượt 2 (câu về chính trang, ví dụ giả định hay lời dẫn)"
    review: dung
  - id: n2
    cau: Người lớn học ngoại ngữ chật vật với những âm lạ, như người Nhật phân biệt /r/ và /l/ trong tiếng Anh.
    loai: phat-hien
    nguon:
      - kuhl2006
    trich: by adulthood, universal phonetic capacity is no longer in place – nonnative phonetic discrimination can be very difficult
    vi_tri: Kuhl 2006, mở bài (dẫn Iverson 2003; Miyawaki 1975)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2016/http://ilabs.washington.edu/kuhl/pdf/Kuhl_etal_2006.pdf", "https://europepmc.org/article/MED/16472309" ]
    luot_2_ghi_chu: Kuhl 2006 dùng cặp /r/–/l/ làm phụ âm bản ngữ của Mỹ và không bản ngữ của Nhật; người lớn Nhật khó phân biệt /r/–/l/ theo các nghiên cứu họ trích (Miyawaki 1975; Iverson 2003).
  - id: n3
    cau: Em bé 6 tháng trong gia đình chỉ nói tiếng Anh, chưa từng nghe một thứ tiếng khác, nhiều khả năng phân biệt được các cặp âm lạ; gần 12 tháng khả năng ấy giảm rõ rệt (nếu chỉ nghe tiếng mẹ đẻ).
    loai: phat-hien
    nguon:
      - kuhl2006
      - werker1984
    trich: a decrease in nonnative consonant perception occurs between 6–8 and 10–12 months of age (Werker & Tees, 1984)
    vi_tri: Kuhl 2006, mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một em bé 6 tháng tuổi người Việt… Ở 12 tháng tuổi: gần như không còn, nếu em chỉ nghe tiếng Việt." Chữ mới: trẻ nghe tiếng Anh; "nhiều khả năng có"; "giảm rõ rệt". Lý do: chưa có nghiên cứu trên trẻ Việt; "gần như không còn" nói chắc hơn nguồn; hai mức "6 tháng" và "12 tháng" là minh họa (gia-dinh). Hindi: xem nhận định về Werker & Tees. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Tình huống là minh họa (gia-dinh); Hindi chỉ là ví dụ trong câu hỏi, không gán cho Werker & Tees.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/12861072", "https://web.archive.org/web/2016/http://ilabs.washington.edu/kuhl/pdf/Kuhl_etal_2003.pdf" ]
    luot_2_ghi_chu: Câu dùng "nhiều khả năng", và điều kiện "nếu chỉ nghe tiếng mẹ đẻ" đúng.
    review: dung
  - id: n4
    cau: Trong năm đầu, trẻ dần giỏi phân biệt âm tiếng mẹ đẻ và mất dần khả năng phân biệt âm không có trong tiếng mẹ đẻ, từ khoảng 6 đến 12 tháng.
    loai: phat-hien
    nguon:
      - kuhl2006
      - kuhl2003
    trich: The results show a significant increase in performance for the native-language contrast in the first year, a decline in nonnative perception over the same time period
    vi_tri: 'Kuhl 2006, tóm tắt; Kuhl 2003: "decline sharply between 6 and 12 mo of age"'
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/16472309", "https://web.archive.org/web/2016/http://ilabs.washington.edu/kuhl/pdf/Kuhl_etal_2006.pdf" ]
  - id: n5
    cau: Trong nửa đầu năm đầu đời trẻ phân biệt được nhiều cặp âm của các ngôn ngữ trên thế giới.
    loai: phat-hien
    nguon:
      - kuhl2003
    trich: early in life, infants readily discern differences among the phonetic units used in the world's languages
    vi_tri: Kuhl 2003, mở bài
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "trong 6 tháng đầu đời, trẻ phân biệt được các cặp âm của hầu hết mọi ngôn ngữ, kể cả những cặp âm người lớn bản ngữ không nghe ra". Chữ mới nói theo nguồn. Lý do: "6 tháng đầu", "hầu hết mọi" và "người lớn bản ngữ không nghe ra" không có trong nguồn; Kuhl 2003 chỉ nói "early in life". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/12861072", "https://web.archive.org/web/2016/http://ilabs.washington.edu/kuhl/pdf/Kuhl_etal_2003.pdf" ]
    luot_2_ghi_chu: Câu dùng "nhiều khả năng", và điều kiện "nếu chỉ nghe tiếng mẹ đẻ" đúng.
    review: dung
  - id: n6
    cau: 'Lộ trình phát âm: từ khóc và gừ gừ, đến bập bẹ có âm tiết rõ ràng, từ đầu tiên vào khoảng sinh nhật đầu tiên, ghép từ vào khoảng 18 tháng.'
    loai: phat-hien
    nguon:
      - openstax-9
      - openstax-ls-3-5
    trich: When babies are about 12 months old, we expect them to say their first word for meaning, and to start combining words for meaning at about 18 months.
    vi_tri: OpenStax 9.3, mục ngôn ngữ
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "giai đoạn ''bùng nổ từ vựng'' vào khoảng 18 tháng tuổi". Chữ mới: "việc bắt đầu ghép từ vào khoảng 18 tháng". Lý do: giáo trình nêu ghép từ ở 18 tháng, không nêu bùng nổ từ vựng. "khóc và gừ gừ… bập bẹ có âm tiết rõ ràng" khớp mô tả cooing → babbling. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Cùng đoạn, câu dẫn danh sách mốc "Các mốc phát âm được ghi nhận khá ổn định" không có nguồn và bullet "Những tháng đầu: cooing": đã sửa thành "Trẻ thường đi qua các mốc phát âm theo thứ tự sau; mốc tuổi chỉ là gần đúng" và "Từ khoảng 2 tháng", dẫn OpenStax Lifespan Development (2024), mục 3.5 ("Infants and toddlers typically progress through several milestones…", "By two months of age… they also start cooing"); thêm openstax-ls-3-5 vào nguon; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development", "https://www.nidcd.nih.gov/health/speech-and-language", "https://europepmc.org/article/MED/22331874" ]
    luot_2_ghi_chu: "Bergelson & Swingley 2012: trẻ 6–9 tháng đã biết nghĩa vài danh từ quen."
    review: sai
  - id: n7
    cau: Trẻ thường hiểu một số từ trước khi nói được.
    loai: phat-hien
    nguon:
      - bergelson2012
    trich: infants already know the meanings of several common words from the age of 6 mo onward
    vi_tri: Bergelson & Swingley 2012, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "trẻ hiểu trước khi nói được" (chắc). Chữ mới: "thường hiểu một số từ trước khi nói được". Lý do: tóm tắt nói trẻ 6 tháng đã hiểu một số từ thông dụng; không đo "nói". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development", "https://www.nidcd.nih.gov/health/speech-and-language", "https://europepmc.org/article/MED/22331874" ]
    luot_2_ghi_chu: "Bergelson & Swingley 2012: trẻ 6–9 tháng đã biết nghĩa vài danh từ quen."
    review: dung
  - id: n8
    cau: 'Hình lo-trinh-hoc-noi: các mốc 0, 6, 12, 18, 24 tháng; "~2 tháng: cooing (ê a)".'
    loai: so-lieu
    nguon:
      - openstax-ls-3-5
    trich: "By two months of age, they are making facial expressions and smiling during social exchanges, and they also start cooing | Table 3.10: 2 months — Infants coo as they begin to practice vocalizations."
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó, hình không sửa: không mở được nguồn nào cho mốc 2–4 tháng (giáo trình chỉ nói cooing đến trước bập bẹ); trang đã đổi bullet thành "những tháng đầu". Người giao quyết định đổi chữ hình. Review (Claude Opus 5.5, 10/11/2026): Tìm được nguồn bậc 2: OpenStax Lifespan Development (2024), mục 3.5 ghi cooing từ khoảng 2 tháng; "2–4 tháng" không có nguồn. Đã sửa chữ hình thành "~2 tháng: cooing (ê a)" và dời chấm về mốc 2 tháng; doi_chu.'
    luot_2: khong-chac
    luot_2_ghi_chu: 'Mốc "2–4 tháng cooing": OpenStax nói trẻ "coo almost immediately", NIDCD gom 0–3 tháng "Coos and makes pleasure sounds"; khoảng 2–4 tháng không được nguồn đã mở xác nhận chính xác.'
    vi_tri: OpenStax Lifespan Development (2024), mục 3.5, mục Crying and Cooing và bảng 3.10
    review: sai
  - id: n9
    cau: 'Hình: "6–8 tháng: bập bẹ chuẩn" và "6–12 tháng: hẹp dần theo tiếng mẹ đẻ"; "~12 tháng: từ đầu tiên".'
    loai: so-lieu
    nguon:
      - long2024
      - kuhl2006
      - openstax-9
      - openstax-ls-3-5
    trich: When babies are about 12 months old, we expect them to say their first word for meaning
    vi_tri: 'OpenStax 9.3; Kuhl 2006 (6–12 tháng); Long 2024: "Babies usually start producing mature babbling at 7 months of age"'
    ket_qua: dung
    ghi_chu: 'Khớp các nguồn. Hình không sửa. Review (Claude Opus 5.5, 10/11/2026): Bập bẹ chuẩn: tóm tắt dễ hiểu của Long 2024 (Europe PMC) "Babies usually start producing mature babbling at 7 months", khớp 6–8 tháng; OpenStax Lifespan Development (2024), mục 3.5 ghi bập bẹ bắt đầu khoảng 4–6 tháng (bập bẹ nói chung, không phải bập bẹ chuẩn). Hẹp dần 6–12 tháng (Kuhl 2006) và từ đầu tiên khoảng 12 tháng (OpenStax 2e 9.3; Lifespan 3.5: "around twelve months is typical") khớp.'
    luot_2: khong-chac
    luot_2_ghi_chu: '"6–8 tháng bập bẹ chuẩn": NIDCD ghi bập bẹ giống tiếng nói ở 4–6 tháng và chuỗi âm dài–ngắn ở 7–12 tháng; không khớp chính xác. "6–12 tháng hẹp dần" và "~12 tháng từ đầu tiên" thì khớp (Kuhl 2003; OpenStax).'
    review: dung
  - id: n10
    cau: 'Hình: "16–24 tháng: ghép từ, vốn từ tăng nhanh"; chú thích "Trẻ thường đi qua các mốc theo thứ tự này, nhưng các mốc tuổi chỉ là gần đúng và thời điểm khác nhau rất nhiều giữa các trẻ".'
    loai: so-lieu
    nguon:
      - openstax-ls-3-5
      - fenson1994
    trich: Around sixteen to twenty-four months of age, children experience a vocabulary growth spurt | Infants and toddlers typically progress through several milestones in communication and language development [Lifespan 3.5] | Extensive variability exists in the rate of lexical, gestural, and grammatical development [Fenson 1994]
    ket_qua: da-sua
    ghi_chu: 'Hình sai/thiếu nguồn: giáo trình nêu "ghép từ ~18 tháng", không nêu "bùng nổ từ vựng" (trang đã sửa chữ tương ứng); "thứ tự rất ổn định" cũng chưa có nguồn. Hình không sửa: người giao quyết định đổi chữ hình thành "~18 tháng: bắt đầu ghép từ" và "thứ tự các mốc thường ổn định". Review (Claude Opus 5.5, 10/11/2026): Đồng ý lượt 2 (quá mạnh). OpenStax Lifespan Development (2024), mục 3.5 đặt "vocabulary growth spurt" ở 16–24 tháng (không phải mốc 18 tháng) và chỉ nói trẻ "typically progress through" các mốc; Fenson 1994: biến thiên rất rộng. Đã sửa chữ hình và chú thích theo cau_dung của lượt 2; doi_chu.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development", "https://europepmc.org/article/MED/7845413" ]
    luot_2_ghi_chu: 'câu đúng: Thứ tự các mốc đầu (cooing, bập bẹ, từ đầu, ghép từ) tương đối ổn định, nhưng thời điểm biến thiên rất rộng giữa trẻ; "bùng nổ từ vựng" ở khoảng 18 tháng chỉ có ở một số trẻ.; Chú thích hình nói "thứ tự các mốc rất ổn định" và vẽ "bùng nổ từ vựng ~18 tháng" như điểm cố định. Fenson (1.803 trẻ) cho thấy thời điểm và tốc độ biến thiên rất rộng; OpenStax lưu ý bùng nổ từ vựng không phổ quát.'
