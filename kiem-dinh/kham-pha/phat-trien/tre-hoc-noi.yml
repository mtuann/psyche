    review: dung
  - id: n32
    cau: 'Sperry, Sperry và Miller (2019): năm cộng đồng ở Mỹ, quan sát tại nhà 42 trẻ 18–48 tháng, không ủng hộ khẳng định của Hart và Risley, thấy khác biệt lớn trong từng nhóm thu nhập; cách định nghĩa loại trừ nhiều người chăm sóc và lời nghe lỏm làm đánh giá thấp lượng từ trẻ thu nhập thấp nghe.'
    loai: phat-hien
    nguon:
      - sperry2019
    trich: Results do not support Hart and Risley's claim, reveal substantial variation in vocabulary environments within each socioeconomic stratum, and suggest that definitions of verbal environments that exclude multiple caregivers and bystander talk disproportionately underestimate the number of words to which low-income children are exposed.
    vi_tri: Sperry 2019, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "ghi âm trong các cộng đồng thu nhập thấp và thấy trẻ nghe được nhiều hơn hẳn con số Hart và Risley báo cáo". Chữ mới theo tóm tắt (không ghi âm/nhiều hơn hẳn; năm cộng đồng trải theo thu nhập; 42 trẻ). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/29707767", "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=10370358" ]
    luot_2_ghi_chu: Sperry, Sperry & Miller 2019, Child Development.
    review: dung
  - id: n33
    cau: Golinkoff và cộng sự (2019) phản biện rằng điều quan trọng là chất lượng lời nói hướng trực tiếp vào trẻ, không phải lời nghe lỏm.
    loai: phat-hien
    nguon:
      - golinkoff2019
    trich: the vital ingredient to language learning—quality speech directed to children rather than overheard speech
    vi_tri: Golinkoff 2019, tóm tắt
    ket_qua: dung
