    ly_do: Phân tích tổng hợp (Tsuji & Cristia 2014, nguyên âm; hai chiều ngược nhau) cùng chiều với Kuhl 2006 (7/9 tương phản phụ âm suy giảm) và Mattock & Burnham 2006 (thanh điệu); đúng ở trẻ nói tiếng Anh, Nhật, Trung Quốc, Pháp; hai tương phản không suy giảm được nêu (tiếng "click" châu Phi, /d/–/th/ trẻ Pháp) và trang nêu là giới hạn. Không có thất bại tái lập lớn chưa giải thích trong nguồn đã mở. Chưa có phân tích tổng hợp riêng cho phụ âm (nguồn dùng là tổng quan trong bài Kuhl 2006).
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "đã được lặp lại ở nhiều cặp ngôn ngữ (Anh–Hindi, Anh–Nhật, Tây Ban Nha–Catalan…)… một trong những phát hiện ổn định nhất… Trẻ nào cũng trải qua". Chữ mới theo Kuhl 2006, Tsuji & Cristia 2014, Mattock & Burnham 2006. Chỗ khó: Vững chắc giữ vì có phân tích tổng hợp (nguyên âm) và nhiều nhóm; review cân nhắc có nên hạ Khá vững vì chưa có tổng hợp cho phụ âm. Review (Claude Opus 5.5, 10/11/2026): Nhãn Vững chắc đạt thước đo mục 4: có phân tích tổng hợp (Tsuji & Cristia 2014, nguyên âm, cả phương pháp hành vi và đo não; tóm tắt Europe PMC: hai chiều ngược nhau, có ý nghĩa từ khoảng 6 tháng), cùng chiều với tổng quan 7/9 tương phản phụ âm (Kuhl 2006) và thanh điệu (Mattock & Burnham 2006), ở trẻ Mỹ, Nhật, Anh, Trung Quốc, Pháp; giáo trình bậc 2 (OpenStax Lifespan Development (2024), mục 3.5) trình bày như kết luận chung. Hai tương phản không suy giảm được trang nêu là giới hạn; khung không nói "mọi cặp âm". Giữ Vững chắc.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/24273029", "https://web.archive.org/web/2016/http://ilabs.washington.edu/kuhl/pdf/Kuhl_etal_2006.pdf", "https://api.crossref.org/works/10.1207/s15327078in1003_3" ]
    luot_2_ghi_chu: 'Vững chắc có phân tích tổng hợp (nguyên âm) và nhiều quần thể (Mỹ, Nhật, Anh, Trung Quốc). Giới hạn: 2 trong 9 tương phản phụ âm không giảm; giữ cách viết tổng quát "hẹp dần", không nói mọi cặp âm.'
    review: dung
  - id: n27
    cau: 'Khung Khá vững: tương tác trực tiếp với người thật giúp trẻ học âm mới hiệu quả hơn nghe thụ động; tổng hợp video deficit khoảng nửa độ lệch chuẩn, có thể ước lượng quá cao, nhỏ dần khi trẻ lớn hơn; không nên trông vào video dạy ngoại ngữ để trẻ sơ sinh tự "thấm" âm.'
    loai: nhan
    nguon: &id002
      - kuhl2003
      - strouse2021
    nhan: kha-vung
    co_so: *id002
    ly_do: 'Một thí nghiệm hai phần có nhóm đối chứng (Kuhl 2003; 21 và 28 trẻ hoàn thành) chưa có tái lập có đăng ký trước, cùng chiều với tổng hợp "video deficit" (122 hiệu ứng, 59 báo cáo, khoảng nửa độ lệch chuẩn, có thể ước lượng quá cao); giới hạn nêu trên trang: chỉ một cặp âm, chưa rõ cơ chế. Khá vững, chưa tới Vững chắc.'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: nhãn Khá vững giữ nguyên; chữ trong khung thêm số trẻ và tổng hợp Strouse & Samson 2021. Lý do: làm căn cứ cho nhãn. Review (Claude Opus 5.5, 10/11/2026): Nhãn Khá vững đạt thước đo. Nhưng trang còn chữ "hiệu quả hơn hẳn" trong ý chính trong khi hồ sơ ghi "hiệu quả hơn" (Strouse 2021: khoảng nửa độ lệch chuẩn, có thể bị ước lượng quá cao): đã bỏ "hẳn". Khung nhận thêm từ khung Đã bị bác bỏ (n29, đã bỏ) vế "khoảng chênh nhỏ dần khi trẻ lớn hơn" (Strouse 2021: "the deficit decreased with age") và câu "không nên trông vào video dạy ngoại ngữ để trẻ sơ sinh tự “thấm” âm"; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/12861072", "https://europepmc.org/article/MED/33491209" ]
    luot_2_ghi_chu: "Khá vững: một thí nghiệm nhỏ cộng tổng hợp video deficit; hợp thước đo."
    review: sai
  - id: n28
    cau: 'Tổng hợp video deficit (59 báo cáo, 122 hiệu ứng, trẻ 0–6 tuổi): trẻ nhìn chung học kém hơn từ video, khoảng nửa độ lệch chuẩn, có thể bị ước lượng quá cao; deficit giảm theo tuổi.'
    loai: so-lieu
    nguon:
      - strouse2021
    trich: An average deficit of about half of a standard deviation was reported across 122 independent effect sizes from 59 reports, involving children ages 0-6 years.
    vi_tri: Strouse & Samson 2021, tóm tắt
    ket_qua: dung
    ghi_chu: Câu thêm vào trang.
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/33491209" ]
    luot_2_ghi_chu: Strouse & Samson 2021, Child Development.
  - id: n29
    cau: 'Khung Đã bị bác bỏ: cho trẻ xem video dạy ngoại ngữ là đủ để trẻ "thấm" âm.'
    loai: nhan
    nguon: &id003
      - kuhl2003
      - strouse2021
    nhan: bac-bo
    co_so: *id003
    ly_do: Thí nghiệm có đối chứng của Kuhl 2003 (không thấy việc học khi xem DVD hay nghe tiếng) và tổng hợp video deficit cùng chiều; nhưng đây là một thí nghiệm nhỏ và deficit giảm theo tuổi, nên khung chỉ nói "không cho thấy tác dụng trong thí nghiệm" chứ không "không có tác dụng".
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ: "nội dung ghi sẵn không có tác dụng dù lượng âm thanh y hệt. Trẻ học ngôn ngữ qua con người, không phải qua loa." Chữ mới mềm hơn. Chỗ khó: thước đo Đã bị bác bỏ cần các kiểm tra mạnh liên tục thất bại; ở đây là một thí nghiệm cộng một tổng hợp về video nói chung; review cân nhắc có nên hạ xuống Khá vững / Đang tranh cãi. Review (Claude Opus 5.5, 10/11/2026): Đồng ý lượt 2 (quá mạnh): Đã bị bác bỏ cần các kiểm tra đủ mạnh liên tục thất bại; ở đây chỉ một thí nghiệm nhỏ (Kuhl 2003) và một tổng hợp thấy video kém hơn khoảng nửa độ lệch chuẩn, không phải bằng 0. Câu đúng của lượt 2 (Khá vững) trùng với khung Khá vững ngay trên (n27), nên bỏ khung này và chuyển ý còn lại vào n27. Vế cũ "video có phản hồi theo trẻ thì khác video thường" không có trong nguồn đã dẫn (Strouse 2021 còn thấy video trực tiếp và ghi sẵn không khác nhau): bỏ theo khung; doi_chu.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://europepmc.org/article/MED/12861072", "https://europepmc.org/article/MED/33491209" ]
    luot_2_ghi_chu: 'câu đúng: Khung nên là Khá vững: trẻ học âm ngoại ngữ từ người thật tốt hơn từ video; thí nghiệm Kuhl 2003 không thấy học từ DVD, tổng hợp cho thấy học từ video kém hơn khoảng nửa độ lệch chuẩn.; Nhãn Đã bị bác bỏ cần các kiểm tra mạnh liên tục thất bại. Chỉ có một thí nghiệm nhỏ (28 trẻ, một ngôn ngữ) cộng một tổng hợp thấy "deficit" khoảng nửa độ lệch chuẩn (không phải bằng 0, có thể ước lượng quá cao, giảm theo tuổi). Bằng chứng ủng hộ Khá vững hơn là "bác bỏ".'
    review: sai
  - id: n30
    cau: Hart và Risley (1995) ước tính đến 4 tuổi, trẻ nhóm hưởng trợ cấp nghe ít hơn trẻ nhóm gia đình trí thức khoảng 30 triệu từ hướng tới trẻ.
    loai: phat-hien
    nguon:
      - golinkoff2019
    trich: HR estimated that by the age of 4 years, the most advantaged children had heard 30 million more words addressed to them than the least advantaged children.
    vi_tri: Golinkoff 2019, mục Introduction
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "trẻ gia đình thu nhập thấp nghe ít hơn trẻ gia đình trí thức khoảng 30 triệu từ trước 3 tuổi". Chữ mới: "đến 4 tuổi… nhóm welfare… professional". Lý do: Golinkoff viết "by the age of 4 years" và nhóm "welfare" / "professional". Sách gốc chưa mở (theo Golinkoff kể lại). Review (Claude Opus 5.5, 10/11/2026): Khớp Golinkoff 2019 (toàn văn PMC); sách Hart & Risley chưa mở, trang ghi theo Golinkoff kể lại ở mức con số và nhóm.'
    luot_2: dung
    luot_2_nguon: [ "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=10370358", "https://europepmc.org/article/MED/30102419", "https://europepmc.org/article/MED/29707767" ]
    luot_2_ghi_chu: Bài gốc Hart & Risley 1995 (sách) không mở được; xác nhận qua Golinkoff 2019 (đọc toàn văn PMC) và Sperry 2019.
    review: dung
  - id: n31
    cau: Con số 30 triệu từ khơi ra nhiều nghiên cứu lặp lại và cả tranh luận.
