    luot_2_nguon: [ "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=10370358" ]
    luot_2_ghi_chu: Golinkoff, Hoff, Rowe, Tamis-LeMonda & Hirsh-Pasek 2019, Child Development.
  - id: n34
    cau: 'Khung Đang tranh cãi: "khoảng cách 30 triệu từ".'
    loai: nhan
    nguon: &id004
      - sperry2019
      - golinkoff2019
    nhan: tranh-cai
    co_so: *id004
    ly_do: 'Một nghiên cứu mới (Sperry 2019, 42 trẻ, năm cộng đồng) không ủng hộ khẳng định gốc; bình luận phản biện (Golinkoff 2019) bảo vệ ý nghĩa của khoảng cách về chất lượng lời nói và nêu rằng có "multiple replications" của Hart & Risley: bằng chứng mâu thuẫn, chưa có tái lập lớn có đăng ký trước: Đang tranh cãi.'
    ket_qua: da-sua
    ghi_chu: 'Bỏ "Điểm đồng thuận hiếm hoi: trò chuyện trực tiếp, đáp lại trẻ thì tốt…" (không nguồn nào nêu sự đồng thuận ấy). Lý do: Golinkoff nhấn mạnh chất lượng lời nói hướng vào trẻ; Sperry không bàn. Review (Claude Opus 5.5, 10/11/2026): Nhãn Đang tranh cãi đạt thước đo: hai nguồn bình duyệt mâu thuẫn (Sperry 2019, Golinkoff 2019), không có tái lập lớn có đăng ký trước.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/29707767", "https://europepmc.org/article/MED/30102419" ]
    luot_2_ghi_chu: "Hai nguồn bình duyệt mâu thuẫn nhau: nhãn Đang tranh cãi khớp thước đo."
    review: dung
  - id: n35
    cau: 'Học thống kê: trẻ 6–8 tháng tách từ qua xác suất chuyển tiếp giữa các âm tiết; Kuhl và cộng sự đề xuất kinh nghiệm với tiếng mẹ đẻ dẫn đến cam kết thần kinh.'
    loai: lich-su
    nguon:
      - kuhl2003
    trich: Between 6 and 8 mo, infants segment words from ongoing speech by detecting transitional probabilities between syllables
    vi_tri: Kuhl 2003, mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Kuhl cho rằng chính việc thống kê này dẫn đến cam kết thần kinh". Chữ mới tách hai ý riêng của Kuhl 2003. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2016/http://ilabs.washington.edu/kuhl/pdf/Kuhl_etal_2003.pdf", "https://europepmc.org/article/MED/16472309" ]
    luot_2_ghi_chu: Kuhl 2003 trích nghiên cứu học thống kê cho tách từ ở 6–8 tháng; Kuhl 2006 đề xuất cam kết thần kinh.
    review: dung
  - id: n36
    cau: Chomsky đề xuất trẻ sinh ra đã có năng lực học ngôn ngữ; các mốc đầu giống nhau ở nhiều nền văn hóa.
    loai: lich-su
    nguon:
      - openstax-9
      - openstax-ls-3-5
    trich: Noam Chomsky (1957) criticized Skinner’s theory and proposed that we are all born with an innate capacity to learn language. [OpenStax 2e 9.3] | infants in different cultures achieve language development milestones at about the same ages, suggesting biological influences on language development [Lifespan 3.5]
    vi_tri: 'OpenStax 9.3, mục ngôn ngữ; OpenStax 9.1: "Infants in all cultures coo before they babble… utter their first word around 12 months"'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "giải thích tốc độ học nhanh và các mốc chung ở mọi nền văn hóa, nhưng khó giải thích chi tiết quá trình hẹp dần". Chữ mới: "hợp với việc các mốc đầu… ở nhiều nền văn hóa (theo giáo trình)". Lý do: hai đánh giá kia không có nguồn. Review (Claude Opus 5.5, 10/11/2026): OpenStax 2e 9.3 chỉ nói thứ tự học cấu trúc ngôn ngữ nhất quán giữa các văn hóa; ý "độ tuổi gần như nhau ở nhiều nền văn hóa" có ở OpenStax Lifespan Development (2024), mục 3.5. Thêm nguồn; câu trên trang viết lại theo đúng chữ giáo trình và dẫn link thay cho "(theo giáo trình)"; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development" ]
    luot_2_ghi_chu: 'OpenStax 9.3. Câu "khung hiện nay không dừng ở bắt chước": OpenStax nói ngôn ngữ vừa bẩm sinh vừa học qua tương tác.'
    review: dung
  - id: n37
    cau: Kuhl và cộng sự (2003) gợi ý tương tác xã hội đóng vai trò quan trọng trong học ngôn ngữ ở trẻ nhỏ, có thể giống vai trò của tương tác xã hội trong việc chim học hót.
    loai: phat-hien
    nguon:
      - kuhl2003
    trich: suggesting an important role for social interaction in early language learning, perhaps analogous to the role social interaction plays in avian song learning
    vi_tri: Kuhl 2003, mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Giả thuyết của Kuhl: bộ não trẻ chỉ ''mở cổng'' học ngôn ngữ tối đa khi có tương tác xã hội — ánh mắt, nụ cười, sự đáp lại. Điều này giải thích vì sao…". Chữ mới theo bài 2003. Lý do: bài viết "suggesting… perhaps analogous"; "cổng xã hội" là cách nói của bài khác chưa mở. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2016/http://ilabs.washington.edu/kuhl/pdf/Kuhl_etal_2003.pdf", "https://europepmc.org/article/MED/12861072" ]
    luot_2_ghi_chu: Câu dùng "gợi ý", đúng mức.
    review: dung
  - id: n38
    cau: 'Tomasello và Farrar (1986), 24 trẻ: trong lúc mẹ và trẻ cùng chú ý vào một vật, cả hai nói nhiều hơn.'
    loai: phat-hien
