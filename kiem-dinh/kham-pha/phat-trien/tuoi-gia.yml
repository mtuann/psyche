nhan_dinh:
  - id: n1
    cau: Nghiên cứu dọc Seattle chưa thấy suy giảm trung bình đáng tin cậy trước 60 tuổi, và các nghiên cứu khác thấy vốn từ vựng còn tăng đến khoảng thập niên 60 — nhưng sa sút trí tuệ là chuyện khác (mô tả của trang).
    loai: phat-hien
    nguon:
      - schaie2010
      - salthouse2019
    trich: We have generally shown that reliably replicable average age decrements in psychometric abilities do not occur prior to age 60, but that such reliable decrement can be found for all abilities by 74 years of age.
    vi_tri: 'Schaie & Willis (2010), mục "At What Age Is There a Reliably Detectable Decrement…"; Salthouse (2019) tóm tắt: "vocabulary knowledge increased until the decade of the 60''s"'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Nghiên cứu dọc Seattle cho thấy nhiều năng lực nhận thức giữ vững đến 60–70 tuổi; trí tuệ kết tinh thậm chí còn dày lên theo năm tháng — nhưng "lẫn" thật sự là chuyện khác". Chữ mới: "…chưa có suy giảm trung bình đáng tin cậy trước 60 tuổi, và vốn từ vựng còn tăng đến khoảng thập niên 60 — nhưng sa sút trí tuệ là chuyện khác". Lý do: "Đến 70 tuổi" và "trí tuệ kết tinh dày lên" mạnh hơn nguồn: nhóm Seattle nói trước 60; Salthouse 2019 nói vốn từ tăng đến thập niên 60. Review (Claude Opus 5.5, 10/11/2026): Lượt 2 không chắc đúng chỗ: câu cũ gắn kết quả vốn từ cho SLS, trong khi đó là kết quả của Salthouse 2019 (5.098 người, Virginia). Đã sửa mô tả ("các nghiên cứu khác thấy…"); doi_chu.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC3607395/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6367038/" ]
    luot_2_ghi_chu: "Phần 'chưa suy giảm đáng tin cậy trước 60' đúng với SLS. Phần 'vốn từ còn tăng đến thập niên 60' là kết quả của Salthouse 2019 (mẫu khác SLS: 5.098 người); nguồn SLS đã mở không nói điều ấy."
    review: sai
  - id: n2
    cau: Quên một từ rồi tự nhớ lại (tình huống 1) chỉ đáng lo khi xảy ra thường xuyên và ảnh hưởng sinh hoạt; quên những việc vừa xảy ra và hỏi đi hỏi lại cùng một câu (tình huống 2) là các dấu hiệu NHS nêu cho sa sút trí tuệ, nên nói chuyện với bác sĩ (lời giải thích câu hỏi mở đầu).
    loai: lam-sang
    nguon:
      - nhs
      - who2026
    trich: '"struggling to follow a conversation or find the right word"; "regularly forgetting recent events, names and faces"; "asking questions repetitively"; "it''s important to talk to a GP sooner rather than later if you''re worried about memory problems"'
    vi_tri: 'NHS, mục Early symptoms và Alzheimer''s; WHO: "affects memory, thinking and the ability to perform daily activities"'
    ket_qua: da-sua
    ghi_chu: 'Hai tình huống là ví dụ giả định (gia-dinh). Lượt 1 đầu đã viết "quên từ không nằm trong dấu hiệu sớm của NHS", nhưng NHS có liệt kê "find the right word": đã sửa về tần suất và mức ảnh hưởng sinh hoạt. Chữ cũ: "Quên một từ rồi tự nhớ lại sau (tình huống 1) là chuyện bình thường ở mọi lứa tuổi — chỉ là ở người già nó xảy ra thường xuyên hơn vì tốc độ truy xuất thông tin chậm lại. Còn quên hẳn một sự kiện vừa xảy ra hôm qua… là dấu hiệu thuộc nhóm nên đi khám để loại trừ các nguyên nhân bệnh lý." Chữ mới: "Quên một từ rồi tự nhớ lại sau (tình huống 1) chỉ đáng lo khi xảy ra thường xuyên và ảnh hưởng đến sinh hoạt; còn quên những việc vừa xảy ra và hỏi đi hỏi lại (tình huống 2) là các dấu hiệu mà NHS nêu… nên nói chuyện với bác sĩ." Lý do: Không có nguồn cho "bình thường ở mọi lứa tuổi" và "vì tốc độ truy xuất chậm lại"; NHS liệt kê cả khó tìm từ như dấu hiệu sớm, nên ranh giới là tần suất và ảnh hưởng. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Đọc lại trang NHS "Symptoms of dementia" (10/11/2026): "regularly forgetting recent events" và "asking questions repetitively" ở mục triệu chứng của bệnh Alzheimer, nguyên nhân thường gặp nhất của sa sút trí tuệ; "find the right word" ở danh sách dấu hiệu sớm. Hai tình huống là giả định.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/conditions/dementia/symptoms/", "https://www.who.int/news-room/fact-sheets/detail/dementia" ]
    luot_2_ghi_chu: Tình huống là ví dụ giả định; phần khẳng định (dấu hiệu NHS nêu, nên gặp bác sĩ) khớp NHS.
    review: dung
  - id: n3
    cau: Sa sút trí tuệ không phải hệ quả tất yếu của tuổi già (WHO).
    loai: lam-sang
    nguon:
      - who2026
      - nhs
    trich: '"Although more common after age 65, it is not an inevitable part of ageing." (WHO); "Dementia is not a natural part of ageing." (NHS)'
    vi_tri: WHO tờ thông tin Dementia, phần đầu; NHS, trang Symptoms
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Phần lớn người già không "lẫn"; và sự đãng trí thông thường khác hẳn với sa sút trí tuệ." Chữ mới: "Sa sút trí tuệ không phải hệ quả tất yếu của tuổi già (WHO), và những thay đổi nhận thức thông thường khác với sa sút trí tuệ." Lý do: Không mở được nguồn nêu tỉ lệ người già không bị sa sút trí tuệ; WHO và NHS nói "không tất yếu". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Đọc lại tờ thông tin WHO "Dementia" (10/11/2026): "not an inevitable part of ageing".'
    luot_2: dung
    luot_2_nguon: [ "https://www.who.int/news-room/fact-sheets/detail/dementia", "https://www.nhs.uk/conditions/dementia/symptoms/" ]
    review: dung
  - id: n4
    cau: Bài trả lời bằng dữ liệu của một nghiên cứu dọc về trí tuệ người lớn đã kéo dài hơn nửa thế kỷ (Seattle Longitudinal Study).
    loai: so-lieu
    nguon:
      - gerstorf2011
      - schaie2010
    trich: In total, the longitudinal data spanned 49 years with eight waves obtained at 7-year intervals (1956, 1963, 1970, 1977, 1984, 1991, 1998, and 2005).
    vi_tri: 'Gerstorf (2011), Participants and Procedure; Schaie & Willis (2010): "is still in progress"'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "…một trong những nghiên cứu dọc dài nhất về trí tuệ người lớn". Chữ mới: "…một nghiên cứu dọc về trí tuệ người lớn đã kéo dài hơn nửa thế kỷ". Lý do: Không kiểm được xếp hạng "một trong những dài nhất"; thời gian kéo dài thì kiểm được. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC3607395/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3134559/" ]
    luot_2_ghi_chu: Đến 2010 đã hơn 50 năm từ 1956; khớp 'hơn nửa thế kỷ'.
    review: dung
  - id: n5
    cau: Lão hóa nhận thức bình thường gồm tốc độ xử lý chậm lại (Salthouse, 1996), và khi làm hai việc cùng lúc thì chậm đi nhiều hơn so với người trẻ (Verhaeghen và cộng sự, 2003).
    loai: phat-hien
    nguon:
      - salthouse1996
      - verhaeghen2003
    trich: increased age in adulthood is associated with a decrease in the speed with which many processing operations can be executed [Salthouse 1996] | The effects of dual-task processing on latency were additive, and this additive cost was larger in older adults than in younger adults and larger than predicted from general slowing. … no specific age deficit was associated with this dual-task cost [accuracy] [Verhaeghen 2003]
    vi_tri: Salthouse (1996), tóm tắt
    ket_qua: da-sua
    ghi_chu: '"Khó làm hai việc cùng lúc" là cách diễn đạt đời thường của cơ chế "simultaneity". Chữ cũ: "…tốc độ xử lý chậm lại, thỉnh thoảng quên tên người, quên từ đang định nói, khó làm hai việc cùng lúc như hồi trẻ." Chữ mới: "…tốc độ xử lý chậm lại, khó làm hai việc cùng lúc hơn hồi trẻ (Salthouse, 1996)." Lý do: Bỏ "quên tên người, quên từ" vì không có nguồn đã mở nói đó là thay đổi thông thường. Review (Claude Opus 5.5, 10/11/2026): Lượt 2 không chắc đúng chỗ: tóm tắt Salthouse 1996 (đọc lại qua OpenAlex) chỉ nêu cơ chế "limited time" và "simultaneity" (sản phẩm của bước đầu mất đi trước khi bước sau xong), không nói về làm hai việc cùng lúc. Phân tích tổng hợp Verhaeghen 2003 (33 và 30 nghiên cứu; tóm tắt Europe PMC) thấy chi phí thời gian khi làm hai việc lớn hơn ở người lớn tuổi, nhưng không thấy ở độ chính xác: nên viết "chậm đi nhiều hơn", không viết "khó hơn". Đã sửa trang, thêm nguồn; doi_chu.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/8759042", "https://europepmc.org/article/MED/14518807" ]
    luot_2_ghi_chu: "Phần 'tốc độ xử lý chậm lại' khớp tóm tắt Salthouse 1996. 'Khó làm hai việc cùng lúc' không có trong tóm tắt 1996 (chỉ có cơ chế 'limited time' và 'simultaneity'); toàn văn 1996 không mở được. Làm hai việc cùng lúc: Verhaeghen và cộng sự 2003 (phân tích tổng hợp) thấy chi phí lớn hơn ở người lớn tuổi."
    review: sai
  - id: n6
    cau: "Sa sút trí tuệ là một tình trạng do nhiều bệnh gây tổn thương não, trong đó suy giảm nhận thức đủ nặng để cản trở cuộc sống hằng ngày: quên những việc vừa xảy ra, hỏi lặp lại, khó làm những việc từng làm thành thạo."
    loai: lam-sang
    nguon:
      - who2026
      - nhs
    trich: "\"Dementia is a condition that affects memory, thinking and the ability to perform daily activities. It can be caused by many different diseases that damage the brain.\" (WHO); \"Dementia is not a disease itself. It's a collection of symptoms that result from damage to the brain caused by different diseases\" (NHS); \"finding it hard to carry out familiar daily tasks\" (NHS)"
    vi_tri: WHO tờ thông tin, định nghĩa; NHS, Early symptoms
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…quên hẳn những việc vừa mới xảy ra, lạc ở nơi quen thuộc, không xoay xở được những việc từng làm thành thạo." Chữ mới: "…quên những việc vừa mới xảy ra, hỏi lặp lại, khó làm những việc từng làm thành thạo (WHO; NHS)." Lý do: NHS nói nhầm lẫn ở nơi không quen, không phải lạc ở nơi quen thuộc; chưa mở được nguồn nói điều sau. Review (Claude Opus 5.5, 10/11/2026): Đọc lại trang NHS "Symptoms of dementia" (10/11/2026): "Dementia is not a disease itself", nên chữ "một nhóm bệnh lý" sai định nghĩa (lượt 2 cũng ghi là gần đúng). Đã sửa thành "một tình trạng do nhiều bệnh gây tổn thương não" (WHO, NHS); doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.who.int/news-room/fact-sheets/detail/dementia", "https://www.nhs.uk/conditions/dementia/symptoms/" ]
    luot_2_ghi_chu: WHO/NHS gọi là hội chứng/nhóm triệu chứng do nhiều bệnh; 'nhóm bệnh' là cách nói gần đúng.
    review: sai
  - id: n7
    cau: "Nhầm lẫn hai chuyện này có thể khiến người ta chủ quan mà bỏ qua dấu hiệu cần được thăm khám: NHS lưu ý người thân có khi không để ý hay không coi trọng các dấu hiệu sớm trong một thời gian, và WHO nêu thiếu hiểu biết về sa sút trí tuệ là rào cản đối với chẩn đoán và chăm sóc."
    loai: loi-khuyen
    nguon:
      - who2026
      - nhs
    trich: '"There is often a lack of awareness and understanding of dementia, resulting in stigmatization and barriers to diagnosis and care." (WHO); "family and friends may not notice or take them seriously for some time" (NHS)'
    vi_tri: WHO tờ thông tin; NHS
    ket_qua: da-sua
    ghi_chu: 'Nửa sau ("hoảng loạn") là lập luận của trang, không có nguồn; đã viết "có thể". Chữ cũ: "Nhầm lẫn hai chuyện này gây ra hai cái hại ngược nhau… bỏ qua dấu hiệu bệnh cần chữa sớm; … hoảng loạn ("mình quên chìa khóa, chắc sắp lẫn rồi") trong khi đó chỉ là lão hóa thông thường." Chữ mới: "…có thể gây ra hai cái hại ngược nhau… bỏ qua dấu hiệu cần được thăm khám; … hoảng loạn khi gặp một lần quên vặt." Lý do: Làm mềm: bỏ "bệnh cần chữa sớm", "chỉ là lão hóa thông thường" (không kiểm được). Review (Claude Opus 5.5, 10/11/2026): Lượt 2 không chắc đúng chỗ: vế "hoảng loạn khi gặp một lần quên vặt" không có nguồn nào. Bỏ vế ấy, giữ vế có nguồn và nêu nguồn ngay trong câu (NHS, WHO, đọc lại 10/11/2026); doi_chu.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.nhs.uk/conditions/dementia/symptoms/" ]
    luot_2_ghi_chu: Không nguồn bậc 1-2 nào đã mở nói về 'hai cái hại ngược nhau' (chủ quan/hoảng loạn); chỉ phần 'nên gặp bác sĩ sớm' có nguồn.
    review: sai
