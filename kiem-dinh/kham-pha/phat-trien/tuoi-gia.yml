  - id: n50
    cau: 'Salthouse và Babcock (1991): trong hai nghiên cứu trên 460 người từ 18 đến 87 tuổi, khi kiểm soát thống kê tốc độ xử lý đơn giản thì liên hệ giữa tuổi và trí nhớ làm việc giảm nhiều nhất.'
    loai: phat-hien
    nguon:
      - salthouse1991
    trich: Two studies, involving a total of 460 adults between 18 and 87 years of age … Because the greatest attenuation of the age relations occurred with measures of simple processing speed, it was suggested that many of the age differences in working memory may be mediated by age-related reductions in the speed of executing elementary operations.
    vi_tri: Salthouse & Babcock (1991), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Salthouse và Babcock (1991) cho thấy tốc độ xử lý giải thích gần như toàn bộ khác biệt tuổi tác trong trí nhớ làm việc ở người từ 18 đến 87 tuổi." Chữ mới: "…trong hai nghiên cứu… trên 460 người từ 18 đến 87 tuổi, khi kiểm soát thống kê tốc độ xử lý đơn giản thì liên hệ giữa tuổi và trí nhớ làm việc giảm nhiều nhất." Lý do: Tóm tắt nói "greatest attenuation… may be mediated", không nói "gần như toàn bộ". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Tóm tắt Salthouse & Babcock 1991 đọc được qua OpenAlex (10/11/2026): "Two studies, involving a total of 460 adults between 18 and 87 years of age … the greatest attenuation of the age relations occurred with measures of simple processing speed". Lượt 2 không mở được; nay đã giải quyết.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Salthouse & Babcock 1991 (Dev Psychol 27:763-776): chỉ xác nhận được siêu dữ liệu qua Crossref; tóm tắt bị nhà xuất bản ẩn, toàn văn không có trong bộ Internet Archive đã thử; không xác nhận được 460 người, 18-87 tuổi và kết quả."
    review: dung
  - id: n51
    cau: Theo Salthouse (1996), khi xử lý chậm lại, các thao tác cần thiết có thể không kịp hoàn thành và sản phẩm các bước đầu có thể mất đi trước khi các bước sau xong; lý thuyết nhằm giải thích nhận thức lưu động.
    loai: dinh-nghia
    nguon:
      - salthouse1996
    trich: cognitive performance is degraded when processing is slow because relevant operations cannot be successfully executed (limited time) and because the products of early processing may no longer be available when later processing is complete (simultaneity).
    vi_tri: Salthouse (1996), tóm tắt ("Type A or fluid cognition")
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chậm lại thì mọi việc cần "băng thông" não — ghi nhớ nhanh, làm nhiều việc cùng lúc — đều kém đi, trong khi kiến thức đã "đóng gói" sẵn (Gc) ít bị ảnh hưởng." Chữ mới: Mô tả hai cơ chế "limited time" và "simultaneity" của Salthouse (1996), áp dụng cho nhận thức lưu động. Lý do: Câu cũ là ẩn dụ, và vế về Gc không có trong tóm tắt. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Tóm tắt Salthouse 1996 (OpenAlex) khớp, kể cả "Type A or fluid cognition".'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/8759042" ]
    luot_2_ghi_chu: Toàn văn không mở; tóm tắt khớp.
    review: dung
  - id: n52
    cau: 'Carstensen và cộng sự (1999), Carstensen (2006): nhận thức về thời gian có thể thay đổi; các mục tiêu xã hội cũng đổi ở người trẻ khi bị đặt vào hoàn cảnh hạn chế thời gian.'
    loai: phat-hien
    nguon:
      - carstensen1999
      - carstensen2006
    trich: the perception of time is malleable, and social goals change in both younger and older people when time constraints are imposed (1999); This motivational shift occurs with age but also appears in other contexts … that limit subjective future time (2006)
    vi_tri: Carstensen (1999) và (2006), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Khi chân trời thời gian còn dài (tuổi trẻ), ta ưu tiên thu thập thông tin và mở rộng quan hệ — kể cả thông tin tiêu cực, miễn là hữu ích. Khi chân trời thời gian thu hẹp (tuổi già), ta ưu tiên ý nghĩa cảm xúc: ở gần người thân, tránh thị phi, giữ tâm trạng tốt." Chữ mới: "…ưu tiên các mục tiêu liên quan đến thu thập kiến thức… ưu tiên các mục tiêu điều chỉnh cảm xúc. Lý thuyết cho rằng nhận thức về thời gian có thể thay đổi…" Lý do: Bỏ "mở rộng quan hệ", "kể cả thông tin tiêu cực", "tránh thị phi" (không có trong tóm tắt); thêm điểm "malleable" của chính nguồn. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC2790864/" ]
    luot_2_ghi_chu: Carstensen 1999 chưa mở; Carstensen 2006 khớp ý.
    review: dung
  - id: n53
    cau: Khái niệm dự trữ nhận thức được đề xuất để giải thích khoảng cách giữa mức tổn thương não và biểu hiện lâm sàng (Stern, 2009).
    loai: dinh-nghia
    nguon:
      - stern2009
    trich: The concept of reserve has been proposed to account for the disjunction between the degree of brain damage and its clinical outcome.
    vi_tri: Stern (2009), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một phần lời giải: học vấn, nghề nghiệp phức tạp, đời sống tinh thần phong phú giúp não xây dựng "dự trữ" — nhiều đường dẫn thay thế…" Chữ mới: "Khái niệm dự trữ nhận thức được đề xuất để giải thích khoảng cách giữa mức tổn thương não và biểu hiện lâm sàng (Stern, 2009)… "Dự trữ" là một cách hình dung, chưa phải cơ chế đã được xác lập từng chi tiết." Lý do: Tóm tắt không liệt kê yếu tố hay "đường dẫn thay thế". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC2739591/" ]
    review: dung
  - id: n54
    cau: WHO nêu học vấn thấp là một yếu tố nguy cơ của sa sút trí tuệ; SLS ghi nhận môi trường trí óc phức tạp gắn với ít suy giảm hơn.
    loai: phat-hien
    nguon:
      - who2026
      - schaie2010
    trich: '"physical inactivity, social isolation, and low educational attainment" (WHO); involvement in a complex and intellectually stimulating environment (Schaie & Willis 2010)'
    vi_tri: WHO, mục risk factors; Schaie & Willis (2010)
    ket_qua: dung
    ghi_chu: Trich WHO theo kết quả công cụ đọc web.
    luot_2: dung
    luot_2_nguon: [ "https://www.who.int/news-room/fact-sheets/detail/dementia", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3607395/" ]
  - id: n55
    cau: (Đã bỏ) Não cũng như cơ bắp, dùng thường xuyên thì giữ được lâu hơn.
    loai: phat-hien
    ket_qua: da-bo
    ghi_chu: 'Ẩn dụ không có nguồn. Chữ cũ: "Nói nôm na: não cũng như cơ bắp, dùng thường xuyên thì giữ được lâu hơn." Chữ mới: (bỏ) Lý do: Không kiểm được. Review (Claude Opus 5.5, 10/11/2026): Đã kiểm: trang không còn ẩn dụ "cơ bắp".'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu đã bỏ khỏi trang; không qua lượt 2.
    review: dung
  - id: n56
    cau: 'Nhãn "Khá vững": vận động thể chất, đời sống xã hội và hoạt động trí óc gắn với nguy cơ suy giảm nhận thức thấp hơn.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - who2026
      - schaie2010
    ly_do: WHO nêu các yếu tố nguy cơ (ít vận động, cô lập xã hội, học vấn thấp) và nói thay đổi hành vi có thể giảm nguy cơ; SLS ghi nhận môi trường trí óc phức tạp gắn với ít suy giảm hơn. Phần lớn là bằng chứng quan sát; chưa mở được phân tích tổng hợp hay thử nghiệm đối chứng riêng (Lancet Commission 2024 có nhưng không đọc được toàn văn), nên Khá vững.
    nguon:
      - who2026
      - schaie2010
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Các nghiên cứu dọc (kể cả SLS) nhất quán: người duy trì vận động thể chất, đời sống xã hội sôi nổi và hoạt động trí óc thường xuyên suy giảm chậm hơn." Chữ mới: "WHO nêu rằng vận động thể chất, đời sống xã hội và hoạt động trí óc gắn với nguy cơ… thấp hơn, và SLS cũng ghi nhận môi trường trí óc phức tạp gắn với ít suy giảm hơn. Phần lớn đây là liên hệ quan sát…" Lý do: "Nhất quán" và "vận động" trong SLS không có trong nguồn SLS đã mở; thêm cảnh báo quan sát. Review (Claude Opus 5.5, 10/11/2026): Nhãn Khá vững đạt thước đo. Đọc lại tờ thông tin WHO "Dementia" (10/11/2026): "Evidence suggests that people can reduce the risk of cognitive decline and dementia…", "being physically active", "staying socially and cognitively active"; chủ yếu bằng chứng quan sát.'
    luot_2: dung
    luot_2_nguon: [ "https://www.who.int/news-room/fact-sheets/detail/dementia", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3607395/" ]
    luot_2_ghi_chu: Nhãn 'Khá vững' không cao hơn thước đo (liên hệ quan sát, chưa mở tổng hợp riêng).
    review: dung
  - id: n57
    cau: 'Ví dụ vừa sức cho người lớn tuổi: đi bộ, đọc sách báo, chơi cờ, trò chuyện với bạn bè, học một kỹ năng mới.'
    loai: loi-khuyen
    nguon:
      - who2026
    trich: Recommended actions include being physically active and staying socially and cognitively active. (WHO, theo kết quả đọc trang)
    vi_tri: WHO, mục prevention
    ket_qua: da-lam-mem
    ghi_chu: 'Các ví dụ cụ thể là gợi ý minh họa; WHO chỉ nêu nhóm hành vi. Chữ cũ: "Không cần gì cao siêu: đi bộ mỗi ngày, đọc sách báo, chơi cờ, trò chuyện với bạn bè, học một kỹ năng mới ở mức vừa sức." Chữ mới: "Một vài ví dụ vừa sức: đi bộ, đọc sách báo, chơi cờ, trò chuyện với bạn bè, học một kỹ năng mới." Lý do: Bỏ "mỗi ngày" (không có tần suất trong nguồn); đánh dấu là ví dụ. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Ví dụ minh họa cho ba nhóm hành vi WHO nêu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.who.int/news-room/fact-sheets/detail/dementia" ]
    luot_2_ghi_chu: Các ví dụ cụ thể (đi bộ, đọc báo, chơi cờ) là minh họa cho ba nhóm hoạt động trên; riêng 'chơi cờ' không có nguồn.
    review: dung
  - id: n58
    cau: Gợi ý "học cái mới bằng cách móc vào cái cũ" là suy ra từ lý thuyết, chưa phải kết quả của một nghiên cứu cụ thể; các nghiên cứu huấn luyện của nhóm Seattle cho thấy người lớn tuổi vẫn cải thiện được kỹ năng nhận thức.
    loai: loi-khuyen
    nguon:
      - schaie2010
      - salthouse2019
    trich: cognitive interventions that have been successful in reversing carefully documented declines in ability performance and in improving the cognitive functions of older persons who have remained stable.
    vi_tri: Schaie & Willis (2010), đoạn đầu
    ket_qua: da-lam-mem
    ghi_chu: 'Ví dụ "nút này giống nút gọi ở máy bàn" là giả định (gia-dinh). Chữ cũ: ":nhan[kha-vung] "…chiến lược học hiệu quả nhất ở tuổi già là dựa vào vốn sẵn có… Đừng thi "tốc độ" với người trẻ — hãy thi "vốn"." Chữ mới: Bỏ chip nhãn; "Đây là một gợi ý suy ra từ lý thuyết, chưa phải kết quả của một nghiên cứu cụ thể mà chúng tôi đã kiểm: … có thể thuận lợi hơn khi học cái mới bằng cách liên hệ với vốn sẵn có". Lý do: "Hiệu quả nhất" không có nguồn; không có nghiên cứu đã mở kiểm chiến lược này nên không gắn nhãn. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Gợi ý nói rõ là suy ra; ví dụ máy bàn là giả định.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC3607395/" ]
    review: dung
  - id: n59
    cau: Các nhà nghiên cứu nêu khả năng tập trung vào thông tin tích cực có thể có lợi trong một số điều kiện và làm giảm hiệu suất nhận thức trong điều kiện khác (Reed và Carstensen, 2012); các ví dụ như bỏ qua cảnh báo rủi ro là suy luận của trang.
    loai: phat-hien
    nguon:
      - reed2012
    trich: We conclude with a discussion of future research directions with emphasis on the conditions where a focus on positive information may benefit and/or impair cognitive performance in older people.
    vi_tri: Reed & Carstensen (2012), tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Câu cuối mục (nhờ người tin cậy cùng xem xét) là lời khuyên thận trọng, nêu rõ là "nếu muốn thận trọng". Chữ cũ: ":nhan[kha-vung] "…người lớn tuổi có thể bỏ qua thông tin tiêu cực quan trọng — cảnh báo rủi ro sức khỏe, dấu hiệu lừa đảo, điều khoản bất lợi trong hợp đồng." Chữ mới: Bỏ chip; "Các nhà nghiên cứu đã nêu khả năng… (Reed và Carstensen, 2012). Các ví dụ cụ thể… là suy luận của chúng tôi, chưa có nghiên cứu nào đã kiểm". Lý do: Nguồn chỉ nêu hướng nghiên cứu tương lai, không có bằng chứng về bỏ qua cảnh báo; không gắn nhãn. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Tóm tắt Reed & Carstensen 2012 (đọc lại): câu cuối khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC3459016/" ]
    review: dung
  - id: n60
    cau: 'Nhãn "Khá vững": nên nói chuyện với bác sĩ sớm khi có các dấu hiệu ở cột phải của bảng, thay vì chờ.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - nhs
      - who2026
      - clarfield2003
    ly_do: NHS và WHO (văn bản chính thức) khuyên nói chuyện với bác sĩ khi lo về trí nhớ; chưa mở được hướng dẫn lâm sàng hay tổng quan hệ thống nói lợi ích của việc đi khám sớm với kết cục cụ thể, nên nhãn Khá vững (đồng thuận của văn bản chính thức), không phải Vững chắc.
    nguon:
      - nhs
      - who2026
      - clarfield2003
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: ":nhan[vung-chac]" cho "Biết đường ranh giữa "quên thường" và "nên đi khám"". Chữ mới: ":nhan[kha-vung]" cho "Khi nào nên nói chuyện với bác sĩ về trí nhớ" (đổi tiêu đề; giữ id cũ bằng { #… }). Lý do: Nhãn Vững chắc đòi tổng hợp/tái lập; ranh giới "quên thường/nên đi khám" không có nguồn. Tiêu đề mục đổi nên giữ id cũ bằng { #4-biet-duong-ranh-giua-quen-thuong-va-nen-di-kham-vung-chac }; hai tiêu đề mục 2 và 3 bỏ chip nên cũng giữ id cũ (…-kha-vung). Review (Claude Opus 5.5, 10/11/2026): Nhãn Khá vững: lời khuyên dựa trên văn bản chính thức (NHS "sooner rather than later"), chưa có tổng quan về lợi ích của khám sớm; không lên Vững chắc. Tiêu đề đổi, id cũ giữ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/conditions/dementia/symptoms/", "https://www.nhs.uk/conditions/dementia/diagnosis/" ]
    luot_2_ghi_chu: Nhãn 'Khá vững' không cao hơn thước đo (hướng dẫn lâm sàng).
    review: dung
  - id: n61
    cau: Một tổng hợp năm 2003 thấy khoảng 9% ca sa sút trí tuệ có nguyên nhân có thể đảo ngược và chỉ 0,6% thật sự hồi phục; các bệnh đi kèm vẫn nên được điều trị (Clarfield, 2003).
    loai: lam-sang
    nguon:
      - clarfield2003
    trich: Potentially reversible causes were seen in 9%, and only 0.6% of dementia cases actually reversed (0.29% partially, 0.31% fully). … comorbidity should always be treated for its own sake
    vi_tri: Clarfield (2003), tóm tắt, Results và Conclusions
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nhiều nguyên nhân gây suy giảm nhận thức (thiếu vitamin, rối loạn tuyến giáp, trầm cảm, tác dụng phụ của thuốc) là chữa được nếu phát hiện sớm — chủ quan "già quên là thường" có thể bỏ lỡ cơ hội đó." Chữ mới: "Chỉ một tỉ lệ nhỏ các ca sa sút trí tuệ có nguyên nhân có thể đảo ngược (…khoảng 9%… 0,6% thật sự hồi phục), nhưng các bệnh đi kèm vẫn nên được điều trị (Clarfield, 2003)." Lý do: "Nhiều nguyên nhân… chữa được" mạnh hơn nguồn: chỉ 9% có thể đảo ngược, 0,6% hồi phục; tổng hợp năm 2003 nên là số liệu cũ (ghi nhận). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Tóm tắt Clarfield 2003 (Europe PMC, đọc lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/14557220" ]
    review: dung
  - id: n62
    cau: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu dọc quy mô lớn nào về lão hóa nhận thức ở Việt Nam; các khảo sát đã công bố mà chúng tôi tìm thấy là cắt ngang, cỡ mẫu nhỏ hơn, ở một số địa phương.
    loai: thoi-su
    het_han: '2028-11-01'
    nguon:
      - tim-kiem-vn-gia
      - hanoi2026
    ket_qua: da-sua
    ghi_chu: 'Europe PMC ngày 10/11/2026 (hai truy vấn, nguon tim-kiem-vn-gia): kết quả đầu là khảo sát cắt ngang (Hà Nội 763 người 2023; Hải Dương 399 người; clock-drawing ở nông thôn). OpenAlex hết lượt nên không dùng. Chưa tìm Google Scholar hay tạp chí trong nước (lượt 2 và review nên tìm thêm, ví dụ Vietnam Aging Survey 2022 của UNFPA). Chữ cũ: "Chúng tôi chưa tìm thấy nghiên cứu dọc quy mô lớn nào về lão hóa nhận thức ở Việt Nam"; chữ mới thêm mốc, hạn và nêu cái đã tìm thấy. Chữ cũ: "Chúng tôi chưa tìm thấy nghiên cứu dọc quy mô lớn nào về lão hóa nhận thức ở Việt Nam". Chữ mới: "Tính đến 11/2026, chúng tôi chưa tìm thấy…; các khảo sát… tìm thấy có cỡ mẫu nhỏ hơn và chỉ ở một số địa phương, ví dụ khảo sát 763 người từ 60 tuổi ở Hà Nội năm 2023". Lý do: Quy tắc câu thời sự: mốc, hạn, nguồn là lần tìm. Review (Claude Opus 5.5, 10/11/2026): Câu thời sự có mốc "Tính đến 11/2026", het_han 2028-11-01, nguồn là lần tìm. Không tìm lại thêm.'
    luot_2: dung
    luot_2_nguon: [ "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=vietnam%20AND%20(longitudinal%20OR%20cohort)%20AND%20(cognitive%20decline%20OR%20dementia%20OR%20cognitive%20function)%20AND%20(older%20OR%20elderly)&format=json&resultType=lite&pageSize=10", "https://pmc.ncbi.nlm.nih.gov/articles/PMC12937493/" ]
    luot_2_ghi_chu: Kiểm lại hôm nay 2026-11-10; 'chưa tìm thấy' là kết quả tìm kiếm của lượt 2, không phải khẳng định không tồn tại.
    review: dung
  - id: n63
    cau: Một khảo sát cắt ngang năm 2023 trên 763 người từ 60 tuổi ở một phường đô thị và một xã nông thôn của Hà Nội.
    loai: so-lieu
    nguon:
      - hanoi2026
    trich: A cross-sectional study was conducted among 763 adults aged ≥60 years from one urban ward and one rural commune in Hanoi (June-December 2023).
    vi_tri: tóm tắt (Europe PMC, PMC12937493)
    ket_qua: dung
    ghi_chu: Chỉ đọc tóm tắt; trang chỉ nêu cỡ mẫu và năm.
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC12937493/" ]
  - id: n64
    cau: Tính đến 2024, Việt Nam có 14,2 triệu người từ 60 tuổi trở lên, chiếm 14,1% dân số; dự báo đến năm 2050 là 29,2 triệu người, khoảng 25%; Việt Nam là một trong những nước già hóa nhanh nhất thế giới (UNFPA).
    loai: thoi-su
    het_han: '2027-11-01'
    nguon:
      - unfpa2026
    trich: Viet Nam is one of the most rapidly ageing countries in the world (UNESCAP 2022). In 2024, there were 14.2 million people aged 60 and older, accounting for 14.1 percent of the total population, and by 2050, there will be 29.2 million and about 25 percent, respectively.
    vi_tri: UNFPA (2026), mục 2.1.3, tr. 38 của PDF
    ket_qua: da-sua
    ghi_chu: 'Số liệu thứ cấp (UNFPA dẫn UNESCAP 2022 và nguồn thống kê); nên đối chiếu Tổng cục Thống kê khi có. Báo cáo cũng nêu 11,9% năm 2019. Chữ cũ: "Việt Nam đang già hóa dân số rất nhanh và nhu cầu hiểu về lão hóa khỏe mạnh là cấp thiết." Chữ mới: "Việt Nam là một trong những nước già hóa dân số nhanh nhất thế giới: theo UNFPA, năm 2024 có 14,2 triệu người từ 60 tuổi trở lên, chiếm 14,1% dân số, và dự báo đến năm 2050 là 29,2 triệu người, khoảng 25%." Lý do: Câu cũ không có nguồn hay mốc. Review (Claude Opus 5.5, 10/11/2026): Lượt 2 không chắc vì mở một trang UNFPA khác. Review tải PDF báo cáo đánh giá (unfpa.org, 196 trang): mục 2.1.3, tr. 38 có nguyên văn "Viet Nam is one of the most rapidly ageing countries in the world (UNESCAP 2022). In 2024, there were 14.2 million people aged 60 and older, accounting for 14.1 percent of the total population, and by 2050, there will be 29.2 million and about 25 percent, respectively." Giữ cả ba số; het_han 2027-11-01.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://vietnam.unfpa.org/en/topics/ageing-0" ]
    luot_2_ghi_chu: Khớp phần 'khoảng 25% năm 2050' và 'một trong những nước già hóa nhanh nhất'. Không tìm thấy trên trang UNFPA đã mở các số 14,2 triệu người, 14,1% (2024) và 29,2 triệu (2050).
    review: dung
  - id: n65
    cau: Mạng lưới gia đình dày có thể là yếu tố bảo vệ nhận thức (WHO nêu cô lập xã hội là yếu tố nguy cơ), và hiệu ứng tích cực có thể càng rõ trong văn hóa gia đình Việt; đó là suy đoán.
    loai: phat-hien
    nguon:
      - who2026
      - carstensen1999
    trich: '"physical inactivity, social isolation, and low educational attainment" (WHO); emotional goals assume primacy when time is perceived as limited (Carstensen 1999)'
    vi_tri: WHO; Carstensen (1999)
    ket_qua: da-lam-mem
    ghi_chu: 'Suy đoán đã nói rõ trên trang. Chữ cũ: "…người cao tuổi Việt thường sống cùng con cháu (mạng lưới xã hội dày đặc — một yếu tố bảo vệ nhận thức), nhưng cũng có thể ít tiếp cận các hoạt động trí óc có cấu trúc hơn." Chữ mới: "…mạng lưới gia đình dày có thể là một yếu tố bảo vệ nhận thức (xã hội gắn với ít suy giảm theo WHO)… chúng tôi chưa tìm thấy dữ liệu về chúng và chỉ có thể suy đoán". Lý do: Bỏ "thường sống cùng con cháu" và "ít tiếp cận hoạt động trí óc" (không có nguồn đã mở). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Trang nói rõ là suy đoán.'
    luot_2: dung
    luot_2_nguon: [ "https://www.who.int/news-room/fact-sheets/detail/dementia" ]
    luot_2_ghi_chu: Phần còn lại tự nhận là suy đoán.
    review: dung
  - id: n66
    cau: '"Cứ già là lẫn" là ngộ nhận: sa sút trí tuệ không phải hệ quả tất yếu của tuổi già; những thay đổi thông thường theo tuổi khác với sa sút trí tuệ.'
    loai: lam-sang
    nguon:
      - who2026
      - nhs
    trich: '"it is not an inevitable part of ageing" (WHO)'
    vi_tri: WHO; NHS
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Sai. Đa số người cao tuổi không bị sa sút trí tuệ. Lão hóa nhận thức bình thường… khác hẳn sa sút trí tuệ (mất khả năng sinh hoạt) — không chỉ khác về mức độ." Chữ mới: "Sai. Sa sút trí tuệ không phải hệ quả tất yếu của tuổi già (WHO; NHS). Những thay đổi thông thường theo tuổi (xử lý chậm lại) khác với sa sút trí tuệ (ảnh hưởng đến sinh hoạt hằng ngày)." Lý do: Bỏ "đa số" và "không chỉ khác về mức độ". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Đọc lại tờ thông tin WHO "Dementia" (10/11/2026): Đọc lại trang NHS "Symptoms of dementia" (10/11/2026): "not a natural part of ageing".'
    luot_2: dung
    luot_2_nguon: [ "https://www.who.int/news-room/fact-sheets/detail/dementia", "https://www.nhs.uk/conditions/dementia/symptoms/" ]
    review: dung
  - id: n67
    cau: Một lần quên vặt chưa nói lên điều gì; NHS nêu các dấu hiệu sớm của sa sút trí tuệ gồm khó làm việc quen thuộc, khó theo dõi cuộc trò chuyện hay tìm từ, nhầm lẫn về thời gian và nơi chốn; với bệnh Alzheimer là thường xuyên quên những việc vừa xảy ra và hỏi lặp lại.
    loai: lam-sang
    nguon:
      - nhs
    trich: "Common early symptoms: \"finding it hard to carry out familiar daily tasks\"; \"struggling to follow a conversation or find the right word\"; \"being confused about time and place\" | Symptoms specific to Alzheimer's disease: \"regularly forgetting recent events, names and faces\"; \"asking questions repetitively\""
    vi_tri: NHS, Early symptoms
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Quên vặt rồi nhớ lại là bình thường ở mọi tuổi. Dấu hiệu đáng lo là quên hẳn thông tin vừa học và hỏi đi hỏi lại." Chữ mới: "Một lần quên vặt chưa nói lên điều gì. Các dấu hiệu sớm mà NHS nêu là… — xem bảng ở trên, và nói chuyện với bác sĩ nếu lo." Lý do: "Bình thường ở mọi tuổi" không có nguồn; NHS cũng liệt kê khó tìm từ. Review (Claude Opus 5.5, 10/11/2026): Đọc lại trang NHS "Symptoms of dementia" (10/11/2026): hai dấu hiệu "quên việc vừa xảy ra", "hỏi lặp lại" nằm ở mục triệu chứng của bệnh Alzheimer, không ở danh sách dấu hiệu sớm như chữ cũ nói. Đã tách hai danh sách; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/conditions/dementia/symptoms/" ]
    review: sai
  - id: n68
    cau: Tốc độ xử lý giảm theo tuổi nhưng vốn từ vựng còn tăng đến khoảng thập niên 60; nghiên cứu huấn luyện của nhóm Seattle cho thấy người lớn tuổi vẫn cải thiện được kỹ năng nhận thức ("não già không học được gì mới" là ngộ nhận).
    loai: phat-hien
    nguon:
      - salthouse2019
      - schaie2010
    trich: vocabulary knowledge increased until the decade of the 60's; cognitive interventions … successful in … improving the cognitive functions of older persons who have remained stable.
    vi_tri: Salthouse (2019) tóm tắt; Schaie & Willis (2010)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Học chậm hơn thì đúng; không học được thì sai. Vốn từ vựng và kiến thức (trí tuệ kết tinh) còn tăng đến tuổi 70, và người già hoàn toàn học được kỹ năng mới nếu có phương pháp phù hợp và đủ thời gian." Chữ mới: "Tốc độ xử lý giảm theo tuổi, nhưng vốn từ vựng còn tăng đến khoảng thập niên 60 (Salthouse, 2019), và các nghiên cứu huấn luyện của nhóm Seattle cho thấy người lớn tuổi vẫn cải thiện được kỹ năng nhận thức (Schaie và Willis, 2010)." Lý do: "Tuổi 70" mạnh hơn nguồn; "hoàn toàn học được… nếu có phương pháp phù hợp" không kiểm được. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6367038/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3607395/" ]
    review: dung
  - id: n69
    cau: Hiệu ứng tích cực là xu hướng xử lý thông tin (chú ý và nhớ cái tích cực hơn cái tiêu cực), không phải trạng thái cảm xúc thường trực; người cao tuổi vẫn có thể buồn và lo.
    loai: dinh-nghia
    nguon:
      - reed2012
    trich: The "positivity effect" refers to an age-related trend that favors positive over negative stimuli in cognitive processing.
    vi_tri: Reed & Carstensen (2012), tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Người già vẫn buồn, vẫn lo — chỉ là họ đầu tư năng lượng vào việc giữ tâm trạng tốt một cách chủ động hơn." Chữ mới: "người cao tuổi vẫn có thể buồn và lo." Lý do: Bỏ vế "đầu tư năng lượng… một cách chủ động" (không kiểm được). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Định nghĩa khớp Reed & Carstensen 2012.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC3459016/" ]
    luot_2_ghi_chu: Phần 'vẫn có thể buồn và lo' là suy luận hợp lý từ định nghĩa (xu hướng xử lý, không phải trạng thái).
    review: dung
  - id: n70
    cau: Các liên kết "Đọc thêm" (Tính cách có thay đổi theo tuổi?; Vì sao ta quên?) trỏ tới trang của site.
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Chỗ cần chú ý cho người giao: trong worktree chỉ có src/content/docs/kham-pha/tri-nho/vi-sao-ta-quen.md; /psyche/kham-pha/tinh-cach/tinh-cach-thay-doi/ chưa có trang trong worktree này (lô khác). Kiểm khi gom nhánh. Link trước đó đã có, không đổi. Review (Claude Opus 5.5, 10/11/2026): Đã kiểm: vi-sao-ta-quen có trang; kham-pha/tinh-cach/tinh-cach-thay-doi có bản ghi ở trang.yml (chưa có trang trong worktree, plugin sap-co hiện "sắp có"); kiểm lại khi gom.'
    review: dung
  - id: n71
    cau: 'Câu hỏi 1: nhóm Seattle kết luận trước 60 tuổi chưa thấy suy giảm trung bình đáng tin cậy; đến 74 tuổi suy giảm xuất hiện ở mọi năng lực (lời giải thích).'
    loai: phat-hien
    nguon:
      - schaie2010
    trich: We have generally shown that reliably replicable average age decrements in psychometric abilities do not occur prior to age 60, but that such reliable decrement can be found for all abilities by 74 years of age.
    vi_tri: Schaie & Willis (2010)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đây là tổng kết nổi tiếng từ nhóm nghiên cứu Seattle: suy giảm bắt đầu từ thập niên 60 và càng về sau càng rõ rệt." Chữ mới: "Đây là tổng kết của nhóm nghiên cứu Seattle (Schaie và Willis, 2010): nhìn chung suy giảm đáng tin cậy chưa có trước 60 tuổi và càng về sau càng rõ." Lý do: Bỏ "nổi tiếng" và "bắt đầu từ thập niên 60" (xem n13). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC3607395/" ]
    review: dung
  - id: n72
    cau: 'Câu hỏi 2: Cattell dự đoán Gf suy giảm sớm hơn Gc; vốn từ tăng đến khoảng thập niên 60 (lời giải thích).'
    loai: phat-hien
    nguon:
      - cattell1963
      - salthouse2019
    trich: gc will show a later and lesser drop.
    vi_tri: Cattell (1963), tr. 3
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trí tuệ lưu động đạt đỉnh ở tuổi trưởng thành trẻ rồi suy giảm dần; trí tuệ kết tinh tăng suốt tuổi trung niên và giữ vững đến tuổi già. Đó là lý do cụ 75 tuổi…" Chữ mới: "Cattell dự đoán trí tuệ lưu động suy giảm sớm hơn trí tuệ kết tinh, và số liệu… phù hợp: tốc độ giảm sớm, vốn từ vựng còn tăng đến khoảng thập niên 60… (ví dụ minh họa)." Lý do: Xem n22, n24. Câu hỏi và các lựa chọn không đổi. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fh0034974.zip/10.1037%252Fh0046743.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6367038/" ]
    review: dung
  - id: n73
    cau: 'Câu hỏi 3: hiệu ứng tích cực là xu hướng xử lý thông tin; trong nghiên cứu của Charles và cộng sự (2003), lợi thế nhớ ảnh tiêu cực giảm dần qua các nhóm tuổi lớn hơn (lời giải thích).'
    loai: phat-hien
    nguon:
      - charles2003
    trich: The relative number of negative images compared with positive and neutral images recalled decreased with each successively older age group.
    vi_tri: Charles và cộng sự (2003), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trong thí nghiệm của Charles, Mather và Carstensen (2003), người lớn tuổi nhớ ảnh tích cực nhiều hơn ảnh tiêu cực, còn người trẻ nhớ hai loại ngang nhau." Chữ mới: "…lợi thế nhớ ảnh tiêu cực (so với ảnh tích cực và trung tính) giảm dần qua các nhóm tuổi lớn hơn." Lý do: Xem n30. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/12825643" ]
    review: dung
  - id: n74
    cau: 'Câu hỏi 4: phân tích 100 nghiên cứu (7.129 người) cho thấy hiệu ứng đáng tin cậy nhưng lớn hơn khi không ràng buộc xử lý và khi so nhóm tuổi cách xa (lời giải thích).'
    loai: so-lieu
    nguon:
      - reed2014
    trich: The positivity effect is larger in studies that do not constrain (vs. constrain) cognitive processing … and in studies incorporating wider (vs. narrower) age comparisons.
    vi_tri: Reed và cộng sự (2014), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…nó mạnh nhất khi không bị ràng buộc trong xử lý, và khi so sánh các nhóm tuổi cách xa nhau. Khi bị xao nhãng chen ngang, hiệu ứng có thể yếu đi hoặc đảo ngược." Chữ mới: "…nó lớn hơn khi không ràng buộc quá trình xử lý thông tin, và khi so sánh các nhóm tuổi cách xa nhau." Lý do: Bỏ "yếu đi hoặc đảo ngược" khi xao nhãng (xem n33). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/24660792" ]
    review: dung
  - id: n75
    cau: 'Câu hỏi 5: các thay đổi thông thường theo tuổi khác sa sút trí tuệ, vốn ảnh hưởng đến sinh hoạt hằng ngày; dấu hiệu như quên thường xuyên những việc vừa xảy ra, hỏi lặp lại, khó làm việc quen thuộc là lúc nên nói chuyện với bác sĩ (lời giải thích và lựa chọn đúng).'
    loai: lam-sang
    nguon:
      - who2026
      - nhs
    trich: '"Dementia is a condition that affects memory, thinking and the ability to perform daily activities." (WHO)'
    vi_tri: WHO; NHS
    ket_qua: da-sua
    ghi_chu: 'Lời giải thích không dựa vào vị trí lựa chọn. Lựa chọn nhiễu ("quên gì cũng nên đi khám"; "phải chụp não") là nhiễu, không trái với nhận định nào của trang. Chữ cũ: Lựa chọn đúng: "Lão hóa bình thường: quên rồi nhớ lại được, mọi thứ chỉ chậm đi. Nên đi khám: quên hẳn như chưa từng xảy ra, hỏi lặp lại, và suy giảm ảnh hưởng đến sinh hoạt hàng ngày." Lời giải thích: "Nguyên tắc vàng: bình thường làm mọi thứ chậm đi; bệnh lý làm mất đi khả năng." Chữ mới: Lựa chọn đúng và lời giải thích viết lại theo n41 (ảnh hưởng đến sinh hoạt hằng ngày; nói chuyện với bác sĩ). Lý do: Quy tắc cũ không có nguồn (xem n41). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Đọc lại tờ thông tin WHO "Dementia" (10/11/2026): '
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/conditions/dementia/symptoms/", "https://www.who.int/news-room/fact-sheets/detail/dementia" ]
    review: dung
  - id: n76
    cau: 'Lời giải thích câu hỏi 5 và mục "Đọc thêm" không thay thế chẩn đoán: bài chỉ cung cấp thông tin giáo dục.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên trang: câu rào đón có ở mục "Phân biệt lão hóa bình thường…" và lời giải thích câu hỏi 5. Review (Claude Opus 5.5, 10/11/2026): Đã kiểm trên trang: câu rào đón ở đầu mục phân biệt và lời giải thích câu hỏi 5.'
    review: dung
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: '"Nghiên cứu dọc Seattle cho thấy nhiều năng lực nhận thức giữ vững đến 60–70 tuổi; trí tuệ kết tinh thậm chí còn dày lên theo năm tháng — nhưng "lẫn" thật sự là chuyện khác".'
    moi: '"…chưa có suy giảm trung bình đáng tin cậy trước 60 tuổi, và vốn từ vựng còn tăng đến khoảng thập niên 60 — nhưng sa sút trí tuệ là chuyện khác".'
    ly_do: '"Đến 70 tuổi" và "trí tuệ kết tinh dày lên" mạnh hơn nguồn: nhóm Seattle nói trước 60; Salthouse 2019 nói vốn từ tăng đến thập niên 60. (nhận định n1)'
  - cu: '"Quên một từ rồi tự nhớ lại sau (tình huống 1) là chuyện bình thường ở mọi lứa tuổi — chỉ là ở người già nó xảy ra thường xuyên hơn vì tốc độ truy xuất thông tin chậm lại. Còn quên hẳn một sự kiện vừa xảy ra hôm qua… là dấu hiệu thuộc nhóm nên đi khám để loại trừ các nguyên nhân bệnh lý."'
    moi: '"Quên một từ rồi tự nhớ lại sau (tình huống 1) chỉ đáng lo khi xảy ra thường xuyên và ảnh hưởng đến sinh hoạt; còn quên những việc vừa xảy ra và hỏi đi hỏi lại (tình huống 2) là các dấu hiệu mà NHS nêu… nên nói chuyện với bác sĩ."'
    ly_do: Không có nguồn cho "bình thường ở mọi lứa tuổi" và "vì tốc độ truy xuất chậm lại"; NHS liệt kê cả khó tìm từ như dấu hiệu sớm, nên ranh giới là tần suất và ảnh hưởng. (nhận định n2)
  - cu: '"Phần lớn người già không "lẫn"; và sự đãng trí thông thường khác hẳn với sa sút trí tuệ."'
    moi: '"Sa sút trí tuệ không phải hệ quả tất yếu của tuổi già (WHO), và những thay đổi nhận thức thông thường khác với sa sút trí tuệ."'
    ly_do: Không mở được nguồn nêu tỉ lệ người già không bị sa sút trí tuệ; WHO và NHS nói "không tất yếu". (nhận định n3)
  - cu: '"…một trong những nghiên cứu dọc dài nhất về trí tuệ người lớn".'
    moi: '"…một nghiên cứu dọc về trí tuệ người lớn đã kéo dài hơn nửa thế kỷ".'
    ly_do: Không kiểm được xếp hạng "một trong những dài nhất"; thời gian kéo dài thì kiểm được. (nhận định n4)
  - cu: '"…tốc độ xử lý chậm lại, thỉnh thoảng quên tên người, quên từ đang định nói, khó làm hai việc cùng lúc như hồi trẻ."'
    moi: '"…tốc độ xử lý chậm lại, khó làm hai việc cùng lúc hơn hồi trẻ (Salthouse, 1996)."'
    ly_do: Bỏ "quên tên người, quên từ" vì không có nguồn đã mở nói đó là thay đổi thông thường. (nhận định n5)
  - cu: '"…quên hẳn những việc vừa mới xảy ra, lạc ở nơi quen thuộc, không xoay xở được những việc từng làm thành thạo."'
    moi: '"…quên những việc vừa mới xảy ra, hỏi lặp lại, khó làm những việc từng làm thành thạo (WHO; NHS)."'
    ly_do: NHS nói nhầm lẫn ở nơi không quen, không phải lạc ở nơi quen thuộc; chưa mở được nguồn nói điều sau. (nhận định n6)
  - cu: '"Nhầm lẫn hai chuyện này gây ra hai cái hại ngược nhau… bỏ qua dấu hiệu bệnh cần chữa sớm; … hoảng loạn ("mình quên chìa khóa, chắc sắp lẫn rồi") trong khi đó chỉ là lão hóa thông thường."'
    moi: '"…có thể gây ra hai cái hại ngược nhau… bỏ qua dấu hiệu cần được thăm khám; … hoảng loạn khi gặp một lần quên vặt."'
    ly_do: 'Làm mềm: bỏ "bệnh cần chữa sớm", "chỉ là lão hóa thông thường" (không kiểm được). (nhận định n7)'
  - cu: (không có)
    moi: '"Nếu bạn đang lo về trí nhớ của mình hay của người thân, hãy nói chuyện với bác sĩ; xem thêm [Hỗ trợ](/psyche/ho-tro/)." (thêm vào đoạn cuối "Điều gì đang xảy ra?" và đoạn đầu mục "Phân biệt lão hóa bình thường với sa sút trí tuệ")'
    ly_do: 'Yêu cầu của lời giao cho chủ đề sa sút trí tuệ: chỉ nói nên tìm người có chuyên môn và dẫn Hỗ trợ. (nhận định n8)'
  - cu: '"Kết quả tổng kết của chính nhóm nghiên cứu rất đáng nhớ: trước 60 tuổi, chưa thấy mức suy giảm trung bình nào đáng tin cậy…; nhưng đến 74 tuổi, suy giảm đáng tin cậy xuất hiện ở mọi năng lực. Nói cách khác, suy giảm nhận thức bắt đầu từ thập niên 60…"'
    moi: '"…nhìn chung, trước 60 tuổi chưa thấy… nhưng đến 74 tuổi…; các phân tích gần đây hơn của nhóm thấy suy giảm nhỏ nhưng có ý nghĩa thống kê ở một số thế hệ từ thập niên 50 tuổi."'
    ly_do: Bỏ "bắt đầu từ thập niên 60" và thêm ngoại lệ chính nhóm nêu (n14). (nhận định n13)
  - cu: '"khả năng ngôn ngữ và vốn từ vựng giữ vững — thậm chí còn tăng — đến tận tuổi 70, trong khi tốc độ tri giác và tính toán số học là những năng lực "đi xuống" sớm nhất (Schaie, 2005)."'
    moi: '"…trong phân tích của Salthouse (2019) trên hơn 5.000 người, vốn từ vựng còn tăng đến khoảng thập niên 60 tuổi, trong khi tốc độ xử lý giảm gần như đều từ đầu tuổi trưởng thành và trí nhớ, suy luận giảm nhanh dần."'
    ly_do: '"Đến tuổi 70" và "tính toán số học đi xuống sớm nhất (Schaie 2005)" không kiểm được (sách in, không mở được); thay bằng số liệu đã đọc. (nhận định n16)'
  - cu: '"…tốc độ tri giác và tính toán số học là những năng lực "đi xuống" sớm nhất (Schaie, 2005)."'
    moi: (bỏ; thay bằng n16)
    ly_do: Không kiểm được. (nhận định n17)
  - cu: '"khác biệt giữa người với người rất lớn, và học vấn, độ phức tạp của công việc, mức độ hoạt động trí óc đều làm chậm quá trình suy giảm. Hai người cùng 75 tuổi có thể ở hai "tuổi nhận thức" hoàn toàn khác nhau."'
    moi: Danh sách yếu tố của Schaie & Willis (2010) và lời "chưa phải bằng chứng nhân quả".
    ly_do: '"Học vấn" không có trong danh sách (có "địa vị kinh tế–xã hội cao"); "làm chậm" là ngôn ngữ nhân quả, nguồn chỉ nêu "implicated"; bỏ câu "hai người cùng 75 tuổi" (không kiểm được). (nhận định n18)'
  - cu: '"Cattell đề xuất một phân biệt kinh điển trong bài báo "Theory of fluid and crystallized intelligence" (1963)".'
    moi: '"…đề xuất một phân biệt kinh điển (từ thập niên 1940); bài báo… (1963) là một thí nghiệm kiểm tra nó".'
    ly_do: Bài 1963 nói lý thuyết được nêu "20 năm trước". (nhận định n19)
  - cu: '"Đạt đỉnh ở tuổi trưởng thành trẻ rồi suy giảm dần."'
    moi: '"Cattell dự đoán Gf đạt cực đại sớm (khoảng 14–15 tuổi) rồi giảm đều từ khoảng 22 tuổi; số liệu hiện đại cũng cho thấy các năng lực tốc độ giảm gần như đều từ đầu tuổi trưởng thành (Salthouse, 2019)."'
    ly_do: Cattell nêu 14–15 tuổi và 22 tuổi; "tuổi trưởng thành trẻ" không khớp. (nhận định n22)
  - cu: '"Tăng suốt tuổi trung niên và giữ vững đến tuổi già."'
    moi: '"Giảm muộn hơn và ít hơn Gf theo dự đoán của Cattell; ở vốn từ vựng… còn tăng đến khoảng thập niên 60 tuổi (Salthouse, 2019)."'
    ly_do: Cattell nêu "later and lesser drop", không nêu "giữ vững đến tuổi già". (nhận định n24)
  - cu: '"Chính phân biệt này giải thích "nghịch lý" của tuổi già: … (Gc còn nguyên, thậm chí dày thêm). Già đi không phải là "kém thông minh đi" một cách đơn giản — mà là bản đồ trí tuệ được vẽ lại".'
    moi: '"Phân biệt này giúp hiểu vì sao tuổi già không phải là "kém thông minh đi" một cách đơn giản: … (một ví dụ giả định…). Nói gọn: bản đồ trí tuệ được vẽ lại, chứ không đơn giản là đi xuống".'
    ly_do: Làm mềm "giải thích" thành "giúp hiểu"; bỏ "Gc còn nguyên, thậm chí dày thêm". (nhận định n25)
  - cu: '"144 người thuộc ba nhóm tuổi (18–29, 41–53, 65–80) xem các bức ảnh tích cực, tiêu cực và trung tính, sau đó làm bài kiểm tra nhớ lại và nhận diện."'
    moi: '"người trẻ, trung niên và lớn tuổi xem các bức ảnh… rồi làm bài nhớ lại và nhận diện."'
    ly_do: Không mở được toàn văn; cỡ mẫu 144 và các khoảng tuổi không có trong tóm tắt. (nhận định n29)
  - cu: '"Kết quả: người lớn tuổi nhớ được nhiều ảnh tích cực hơn ảnh tiêu cực, trong khi người trẻ nhớ hai loại ngang nhau — và khác biệt tuổi tác lớn nhất nằm ở ảnh tiêu cực (người già nhớ kém hẳn)."'
    moi: '"…số ảnh tiêu cực được nhớ giảm dần qua từng nhóm tuổi lớn hơn, và ở nghiên cứu thứ hai, khác biệt tuổi tác lớn nhất nằm ở ảnh tiêu cực."'
    ly_do: Tóm tắt nói về số ảnh tiêu cực tương đối so với tích cực/trung tính; không nói "người trẻ nhớ hai loại ngang nhau" hay "người già nhớ ảnh tích cực nhiều hơn tiêu cực". (nhận định n30)
  - cu: '"Một nghiên cứu thứ hai (64 người, 19–30 so với 63–86 tuổi) loại trừ khả năng kết quả chỉ do tâm trạng lúc làm bài."'
    moi: (bỏ)
    ly_do: Không kiểm được. (nhận định n31)
  - cu: '"…nó mạnh nhất khi người tham gia được xử lý thông tin một cách tự nhiên, không bị ép buộc (khi có nhiệm vụ gây xao nhãng chen vào, hiệu ứng có thể yếu đi, thậm chí đảo ngược)."'
    moi: '"…nó lớn hơn trong các nghiên cứu không ràng buộc quá trình xử lý… và trong các nghiên cứu so sánh các nhóm tuổi cách xa nhau hơn."'
    ly_do: Tóm tắt không nói "đảo ngược" khi xao nhãng; nói "lớn hơn khi không ràng buộc" và "lớn hơn khi so tuổi xa nhau". (nhận định n33)
  - cu: '"…khi nhận thức được quỹ thời gian đời mình không còn nhiều, con người tự động ưu tiên các mục tiêu ý nghĩa về mặt cảm xúc — ở gần người thân yêu, tránh xung đột vô ích, giữ tâm trạng tốt."'
    moi: '"…khi nhận thức rằng thời gian còn lại là hữu hạn, con người ưu tiên các mục tiêu điều chỉnh cảm xúc hơn các mục tiêu thu thập kiến thức (Carstensen, Isaacowitz và Charles, 1999)."'
    ly_do: Bỏ "tự động" và ba ví dụ cụ thể (không có trong tóm tắt); dùng chữ "emotional goals… regulation of emotion". (nhận định n35)
  - cu: '"Hiệu ứng tích cực vì thế không phải là "lẫn", mà là một sự điều chỉnh có chủ đích của hệ thống động cơ."'
    moi: '"Theo lý thuyết này, hiệu ứng tích cực không phải dấu hiệu "lẫn", mà là hệ quả của sự chuyển hướng động cơ ấy."'
    ly_do: Bỏ "có chủ đích" (không kiểm được); nêu rõ "theo lý thuyết". (nhận định n36)
  - cu: 'Cột trái cũ: "Thỉnh thoảng quên tên người, quên từ — rồi tự nhớ lại sau; Thỉnh thoảng quên chìa khóa, kính để đâu; Làm nhiều việc cùng lúc chậm hơn, dễ xao nhãng hơn trước; … Thỉnh thoảng có quyết định chưa khôn ngoan".'
    moi: 'Cột trái mới: "Tốc độ xử lý chậm dần; Làm nhiều việc cùng lúc khó hơn trước; Học cái mới mất nhiều thời gian hơn…; Vốn từ vựng… còn tăng đến khoảng thập niên 60".'
    ly_do: Các hàng quên tên/từ/chìa khóa và "quyết định chưa khôn ngoan" không có nguồn đã mở; thay bằng điều Salthouse và Schaie nêu. (nhận định n37)
  - cu: '"Mất nhiều thời gian hơn để học cái mới, nhưng vẫn học được".'
    moi: '"Học cái mới mất nhiều thời gian hơn, nhưng vẫn học được" (ở bảng đã nối với nguồn); thêm chú thích của bảng.'
    ly_do: Giữ ý nhưng ghi rõ cơ sở và giới hạn. (nhận định n38)
  - cu: '"Quên hẳn thông tin vừa mới học; hỏi đi hỏi lại cùng một câu trong ngày".'
    moi: '"Thường xuyên quên những việc vừa xảy ra, tên và gương mặt; Hỏi lặp lại cùng một câu".'
    ly_do: Theo chữ của NHS; bỏ "trong ngày". (nhận định n39)
  - cu: '"Không xoay xở được những việc quen thuộc…; Lạc ở nơi quen thuộc; nhầm lẫn nghiêm trọng về thời gian, địa điểm; Để đồ vật vào chỗ kỳ lạ…; Suy giảm ảnh hưởng rõ rệt đến sinh hoạt hàng ngày".'
    moi: '"Thấy khó làm những việc quen thuộc hằng ngày; Khó theo dõi cuộc trò chuyện hay tìm từ; nhầm lẫn về thời gian và nơi chốn".'
    ly_do: Theo danh sách của NHS; hàng "để đồ vật vào chỗ kỳ lạ" và "lạc ở nơi quen thuộc" không có trong nguồn đã mở. (nhận định n40)
  - cu: '"Nguyên tắc vàng: lão hóa bình thường làm mọi thứ chậm đi; sa sút trí tuệ làm mất đi khả năng. Quên rồi nhớ lại = bình thường. Quên hẳn như chưa từng xảy ra + ảnh hưởng cuộc sống = cần đi khám."'
    moi: '"Bảng này chỉ minh họa… Điểm chung của các mô tả y tế là sa sút trí tuệ ảnh hưởng đến sinh hoạt hằng ngày (WHO)… hãy nói chuyện với bác sĩ; NHS khuyên nên làm sớm."'
    ly_do: Quy tắc "quên rồi nhớ lại = bình thường" không có nguồn và trái với NHS (khó tìm từ là dấu hiệu sớm); thay bằng câu bám WHO và NHS. (nhận định n41)
  - cu: Khung ":::vung-chac[trí tuệ kết tinh giữ vững đến tuổi già; trí tuệ lưu động suy giảm sớm hơn]… giữ vững đến tuổi 70… Đây là một trong những kết quả tái lập tốt nhất của tâm lý học lão hóa."
    moi: Khung ":::kha-vung[vốn từ vựng còn tăng đến khoảng thập niên 60; tốc độ xử lý và suy luận với vấn đề mới suy giảm sớm hơn]" kèm Salthouse 2019, Hartshorne & Germine 2015 và lý do chỉ khá vững.
    ly_do: 'Chưa có phân tích tổng hợp đã mở; "tái lập tốt nhất" không kiểm được; "tuổi 70" mạnh hơn nguồn. Đổi nhãn Vững chắc → Khá vững: các trang khác trỏ tới đoạn này cần xem lại (tom-tat tự dựng). (nhận định n43)'
  - cu: '"…Nhưng hiệu ứng này yếu đi hoặc đảo ngược khi người tham gia bị ép buộc, xao nhãng hoặc căng thẳng".'
    moi: '"…Nhưng hiệu ứng này khác nhau theo cách đo: lớn hơn khi quá trình xử lý không bị ràng buộc, và một số nghiên cứu không thấy khác biệt theo tuổi (Reed và Carstensen, 2012)".'
    ly_do: Tóm tắt không nói "đảo ngược", "căng thẳng". (nhận định n44)
  - cu: '"Khác biệt một phần đến từ cách đo và định nghĩa "đáng tin cậy" — cuộc tranh luận vẫn tiếp diễn."'
    moi: '"Khác biệt liên quan đến thiết kế nghiên cứu: so sánh cắt ngang và theo dõi dọc cho kết quả khác nhau (… Singh-Manoux … Salthouse, 2019 …) — cuộc tranh luận vẫn tiếp diễn."'
    ly_do: Câu cũ không có nguồn; câu mới nêu nguyên nhân khác biệt theo từng nguồn. (nhận định n45)
  - cu: '"Đa số người cao tuổi không bị sa sút trí tuệ; lão hóa nhận thức bình thường và sa sút trí tuệ là hai chuyện khác nhau về bản chất, không chỉ khác nhau về mức độ. … kỳ thị người cao tuổi còn minh mẫn."'
    moi: '"Sa sút trí tuệ không phải hệ quả tất yếu của tuổi già: WHO viết… Lão hóa nhận thức thông thường và sa sút trí tuệ khác nhau, dù giữa hai bên còn một vùng trung gian là suy giảm nhận thức nhẹ (NHS)… định kiến và thiếu hiểu biết là rào cản đối với việc chẩn đoán và chăm sóc (WHO)".'
    ly_do: Bỏ "đa số" (không có tỉ lệ), "khác về bản chất" (NHS nêu vùng trung gian MCI), "kỳ thị người cao tuổi còn minh mẫn" (không có nguồn). (nhận định n47)
  - cu: '"Salthouse và Babcock (1991) cho thấy tốc độ xử lý giải thích gần như toàn bộ khác biệt tuổi tác trong trí nhớ làm việc ở người từ 18 đến 87 tuổi."'
    moi: '"…trong hai nghiên cứu… trên 460 người từ 18 đến 87 tuổi, khi kiểm soát thống kê tốc độ xử lý đơn giản thì liên hệ giữa tuổi và trí nhớ làm việc giảm nhiều nhất."'
    ly_do: Tóm tắt nói "greatest attenuation… may be mediated", không nói "gần như toàn bộ". (nhận định n50)
  - cu: '"Chậm lại thì mọi việc cần "băng thông" não — ghi nhớ nhanh, làm nhiều việc cùng lúc — đều kém đi, trong khi kiến thức đã "đóng gói" sẵn (Gc) ít bị ảnh hưởng."'
    moi: Mô tả hai cơ chế "limited time" và "simultaneity" của Salthouse (1996), áp dụng cho nhận thức lưu động.
    ly_do: Câu cũ là ẩn dụ, và vế về Gc không có trong tóm tắt. (nhận định n51)
  - cu: '"Khi chân trời thời gian còn dài (tuổi trẻ), ta ưu tiên thu thập thông tin và mở rộng quan hệ — kể cả thông tin tiêu cực, miễn là hữu ích. Khi chân trời thời gian thu hẹp (tuổi già), ta ưu tiên ý nghĩa cảm xúc: ở gần người thân, tránh thị phi, giữ tâm trạng tốt."'
    moi: '"…ưu tiên các mục tiêu liên quan đến thu thập kiến thức… ưu tiên các mục tiêu điều chỉnh cảm xúc. Lý thuyết cho rằng nhận thức về thời gian có thể thay đổi…"'
    ly_do: Bỏ "mở rộng quan hệ", "kể cả thông tin tiêu cực", "tránh thị phi" (không có trong tóm tắt); thêm điểm "malleable" của chính nguồn. (nhận định n52)
  - cu: '"Một phần lời giải: học vấn, nghề nghiệp phức tạp, đời sống tinh thần phong phú giúp não xây dựng "dự trữ" — nhiều đường dẫn thay thế…"'
    moi: '"Khái niệm dự trữ nhận thức được đề xuất để giải thích khoảng cách giữa mức tổn thương não và biểu hiện lâm sàng (Stern, 2009)… "Dự trữ" là một cách hình dung, chưa phải cơ chế đã được xác lập từng chi tiết."'
    ly_do: Tóm tắt không liệt kê yếu tố hay "đường dẫn thay thế". (nhận định n53)
  - cu: '"Nói nôm na: não cũng như cơ bắp, dùng thường xuyên thì giữ được lâu hơn."'
    moi: (bỏ)
    ly_do: Không kiểm được. (nhận định n55)
  - cu: '"Các nghiên cứu dọc (kể cả SLS) nhất quán: người duy trì vận động thể chất, đời sống xã hội sôi nổi và hoạt động trí óc thường xuyên suy giảm chậm hơn."'
    moi: '"WHO nêu rằng vận động thể chất, đời sống xã hội và hoạt động trí óc gắn với nguy cơ… thấp hơn, và SLS cũng ghi nhận môi trường trí óc phức tạp gắn với ít suy giảm hơn. Phần lớn đây là liên hệ quan sát…"'
    ly_do: '"Nhất quán" và "vận động" trong SLS không có trong nguồn SLS đã mở; thêm cảnh báo quan sát. (nhận định n56)'
  - cu: '"Không cần gì cao siêu: đi bộ mỗi ngày, đọc sách báo, chơi cờ, trò chuyện với bạn bè, học một kỹ năng mới ở mức vừa sức."'
    moi: '"Một vài ví dụ vừa sức: đi bộ, đọc sách báo, chơi cờ, trò chuyện với bạn bè, học một kỹ năng mới."'
    ly_do: Bỏ "mỗi ngày" (không có tần suất trong nguồn); đánh dấu là ví dụ. (nhận định n57)
  - cu: '":nhan[kha-vung] "…chiến lược học hiệu quả nhất ở tuổi già là dựa vào vốn sẵn có… Đừng thi "tốc độ" với người trẻ — hãy thi "vốn"."'
    moi: 'Bỏ chip nhãn; "Đây là một gợi ý suy ra từ lý thuyết, chưa phải kết quả của một nghiên cứu cụ thể mà chúng tôi đã kiểm: … có thể thuận lợi hơn khi học cái mới bằng cách liên hệ với vốn sẵn có".'
    ly_do: '"Hiệu quả nhất" không có nguồn; không có nghiên cứu đã mở kiểm chiến lược này nên không gắn nhãn. (nhận định n58)'
  - cu: '":nhan[kha-vung] "…người lớn tuổi có thể bỏ qua thông tin tiêu cực quan trọng — cảnh báo rủi ro sức khỏe, dấu hiệu lừa đảo, điều khoản bất lợi trong hợp đồng."'
    moi: Bỏ chip; "Các nhà nghiên cứu đã nêu khả năng… (Reed và Carstensen, 2012). Các ví dụ cụ thể… là suy luận của chúng tôi, chưa có nghiên cứu nào đã kiểm".
    ly_do: Nguồn chỉ nêu hướng nghiên cứu tương lai, không có bằng chứng về bỏ qua cảnh báo; không gắn nhãn. (nhận định n59)
  - cu: '":nhan[vung-chac]" cho "Biết đường ranh giữa "quên thường" và "nên đi khám"".'
    moi: '":nhan[kha-vung]" cho "Khi nào nên nói chuyện với bác sĩ về trí nhớ" (đổi tiêu đề; giữ id cũ bằng { #… }).'
    ly_do: 'Nhãn Vững chắc đòi tổng hợp/tái lập; ranh giới "quên thường/nên đi khám" không có nguồn. Tiêu đề mục đổi nên giữ id cũ bằng { #4-biet-duong-ranh-giua-quen-thuong-va-nen-di-kham-vung-chac }; hai tiêu đề mục 2 và 3 bỏ chip nên cũng giữ id cũ (…-kha-vung). (nhận định n60)'
  - cu: '"Nhiều nguyên nhân gây suy giảm nhận thức (thiếu vitamin, rối loạn tuyến giáp, trầm cảm, tác dụng phụ của thuốc) là chữa được nếu phát hiện sớm — chủ quan "già quên là thường" có thể bỏ lỡ cơ hội đó."'
    moi: '"Chỉ một tỉ lệ nhỏ các ca sa sút trí tuệ có nguyên nhân có thể đảo ngược (…khoảng 9%… 0,6% thật sự hồi phục), nhưng các bệnh đi kèm vẫn nên được điều trị (Clarfield, 2003)."'
    ly_do: '"Nhiều nguyên nhân… chữa được" mạnh hơn nguồn: chỉ 9% có thể đảo ngược, 0,6% hồi phục; tổng hợp năm 2003 nên là số liệu cũ (ghi nhận). (nhận định n61)'
  - cu: '"Chúng tôi chưa tìm thấy nghiên cứu dọc quy mô lớn nào về lão hóa nhận thức ở Việt Nam".'
    moi: '"Tính đến 11/2026, chúng tôi chưa tìm thấy…; các khảo sát… tìm thấy có cỡ mẫu nhỏ hơn và chỉ ở một số địa phương, ví dụ khảo sát 763 người từ 60 tuổi ở Hà Nội năm 2023".'
    ly_do: 'Quy tắc câu thời sự: mốc, hạn, nguồn là lần tìm. (nhận định n62)'
  - cu: '"Việt Nam đang già hóa dân số rất nhanh và nhu cầu hiểu về lão hóa khỏe mạnh là cấp thiết."'
    moi: '"Việt Nam là một trong những nước già hóa dân số nhanh nhất thế giới: theo UNFPA, năm 2024 có 14,2 triệu người từ 60 tuổi trở lên, chiếm 14,1% dân số, và dự báo đến năm 2050 là 29,2 triệu người, khoảng 25%."'
    ly_do: Câu cũ không có nguồn hay mốc. (nhận định n64)
  - cu: '"…người cao tuổi Việt thường sống cùng con cháu (mạng lưới xã hội dày đặc — một yếu tố bảo vệ nhận thức), nhưng cũng có thể ít tiếp cận các hoạt động trí óc có cấu trúc hơn."'
    moi: '"…mạng lưới gia đình dày có thể là một yếu tố bảo vệ nhận thức (xã hội gắn với ít suy giảm theo WHO)… chúng tôi chưa tìm thấy dữ liệu về chúng và chỉ có thể suy đoán".'
    ly_do: Bỏ "thường sống cùng con cháu" và "ít tiếp cận hoạt động trí óc" (không có nguồn đã mở). (nhận định n65)
  - cu: '"Sai. Đa số người cao tuổi không bị sa sút trí tuệ. Lão hóa nhận thức bình thường… khác hẳn sa sút trí tuệ (mất khả năng sinh hoạt) — không chỉ khác về mức độ."'
    moi: '"Sai. Sa sút trí tuệ không phải hệ quả tất yếu của tuổi già (WHO; NHS). Những thay đổi thông thường theo tuổi (xử lý chậm lại) khác với sa sút trí tuệ (ảnh hưởng đến sinh hoạt hằng ngày)."'
    ly_do: Bỏ "đa số" và "không chỉ khác về mức độ". (nhận định n66)
  - cu: '"Quên vặt rồi nhớ lại là bình thường ở mọi tuổi. Dấu hiệu đáng lo là quên hẳn thông tin vừa học và hỏi đi hỏi lại."'
    moi: '"Một lần quên vặt chưa nói lên điều gì. Các dấu hiệu sớm mà NHS nêu là… — xem bảng ở trên, và nói chuyện với bác sĩ nếu lo."'
    ly_do: '"Bình thường ở mọi tuổi" không có nguồn; NHS cũng liệt kê khó tìm từ. (nhận định n67)'
  - cu: '"Học chậm hơn thì đúng; không học được thì sai. Vốn từ vựng và kiến thức (trí tuệ kết tinh) còn tăng đến tuổi 70, và người già hoàn toàn học được kỹ năng mới nếu có phương pháp phù hợp và đủ thời gian."'
    moi: '"Tốc độ xử lý giảm theo tuổi, nhưng vốn từ vựng còn tăng đến khoảng thập niên 60 (Salthouse, 2019), và các nghiên cứu huấn luyện của nhóm Seattle cho thấy người lớn tuổi vẫn cải thiện được kỹ năng nhận thức (Schaie và Willis, 2010)."'
    ly_do: '"Tuổi 70" mạnh hơn nguồn; "hoàn toàn học được… nếu có phương pháp phù hợp" không kiểm được. (nhận định n68)'
  - cu: '"Người già vẫn buồn, vẫn lo — chỉ là họ đầu tư năng lượng vào việc giữ tâm trạng tốt một cách chủ động hơn."'
    moi: '"người cao tuổi vẫn có thể buồn và lo."'
    ly_do: Bỏ vế "đầu tư năng lượng… một cách chủ động" (không kiểm được). (nhận định n69)
  - cu: '"Đây là tổng kết nổi tiếng từ nhóm nghiên cứu Seattle: suy giảm bắt đầu từ thập niên 60 và càng về sau càng rõ rệt."'
    moi: '"Đây là tổng kết của nhóm nghiên cứu Seattle (Schaie và Willis, 2010): nhìn chung suy giảm đáng tin cậy chưa có trước 60 tuổi và càng về sau càng rõ."'
    ly_do: Bỏ "nổi tiếng" và "bắt đầu từ thập niên 60" (xem n13). (nhận định n71)
  - cu: '"Trí tuệ lưu động đạt đỉnh ở tuổi trưởng thành trẻ rồi suy giảm dần; trí tuệ kết tinh tăng suốt tuổi trung niên và giữ vững đến tuổi già. Đó là lý do cụ 75 tuổi…"'
    moi: '"Cattell dự đoán trí tuệ lưu động suy giảm sớm hơn trí tuệ kết tinh, và số liệu… phù hợp: tốc độ giảm sớm, vốn từ vựng còn tăng đến khoảng thập niên 60… (ví dụ minh họa)."'
    ly_do: Xem n22, n24. Câu hỏi và các lựa chọn không đổi. (nhận định n72)
  - cu: '"Trong thí nghiệm của Charles, Mather và Carstensen (2003), người lớn tuổi nhớ ảnh tích cực nhiều hơn ảnh tiêu cực, còn người trẻ nhớ hai loại ngang nhau."'
    moi: '"…lợi thế nhớ ảnh tiêu cực (so với ảnh tích cực và trung tính) giảm dần qua các nhóm tuổi lớn hơn."'
    ly_do: Xem n30. (nhận định n73)
  - cu: '"…nó mạnh nhất khi không bị ràng buộc trong xử lý, và khi so sánh các nhóm tuổi cách xa nhau. Khi bị xao nhãng chen ngang, hiệu ứng có thể yếu đi hoặc đảo ngược."'
    moi: '"…nó lớn hơn khi không ràng buộc quá trình xử lý thông tin, và khi so sánh các nhóm tuổi cách xa nhau."'
    ly_do: Bỏ "yếu đi hoặc đảo ngược" khi xao nhãng (xem n33). (nhận định n74)
  - cu: 'Lựa chọn đúng: "Lão hóa bình thường: quên rồi nhớ lại được, mọi thứ chỉ chậm đi. Nên đi khám: quên hẳn như chưa từng xảy ra, hỏi lặp lại, và suy giảm ảnh hưởng đến sinh hoạt hàng ngày." Lời giải thích: "Nguyên tắc vàng: bình thường làm mọi thứ chậm đi; bệnh lý làm mất đi khả năng."'
    moi: Lựa chọn đúng và lời giải thích viết lại theo n41 (ảnh hưởng đến sinh hoạt hằng ngày; nói chuyện với bác sĩ).
    ly_do: Quy tắc cũ không có nguồn (xem n41). (nhận định n75)
  - cu: 'description: "Nghiên cứu dọc Seattle cho thấy chưa có suy giảm trung bình đáng tin cậy trước 60 tuổi, và vốn từ vựng còn tăng đến khoảng thập niên 60 — …"'
    moi: '"Nghiên cứu dọc Seattle chưa thấy suy giảm trung bình đáng tin cậy trước 60 tuổi, và các nghiên cứu khác thấy vốn từ vựng còn tăng đến khoảng thập niên 60 — …"'
    ly_do: "Review: số liệu vốn từ là của Salthouse 2019 (mẫu khác), không phải của SLS. (nhận định n1)"
  - cu: '"…tốc độ xử lý chậm lại, khó làm hai việc cùng lúc hơn hồi trẻ (Salthouse, 1996). Chuyện thứ hai là sa sút trí tuệ (dementia): một nhóm bệnh lý trong đó…"'
    moi: '"…tốc độ xử lý chậm lại (Salthouse, 1996), và khi làm hai việc cùng lúc thì chậm đi nhiều hơn so với người trẻ (Verhaeghen và cộng sự, 2003). Chuyện thứ hai là sa sút trí tuệ (dementia): một tình trạng do nhiều bệnh gây tổn thương não, trong đó…"'
    ly_do: 'Review: "simultaneity" của Salthouse 1996 là sản phẩm của bước đầu mất đi trước khi xong bước sau, không phải làm hai việc cùng lúc; chi phí làm hai việc theo tuổi lấy từ phân tích tổng hợp Verhaeghen 2003 (lớn hơn ở thời gian phản ứng, không có ở độ chính xác). NHS: sa sút trí tuệ "is not a disease itself"; WHO: "caused by many different diseases". (nhận định n5, n6)'
  - cu: '"Nhầm lẫn hai chuyện này có thể gây ra hai cái hại ngược nhau: người thì chủ quan ("già quên là bình thường mà") bỏ qua dấu hiệu cần được thăm khám; người thì hoảng loạn khi gặp một lần quên vặt."'
    moi: '"Nhầm lẫn hai chuyện này có thể khiến người ta chủ quan ("già quên là bình thường mà") mà bỏ qua dấu hiệu cần được thăm khám: NHS lưu ý người thân có khi không để ý hay không coi trọng các dấu hiệu sớm trong một thời gian, và WHO nêu thiếu hiểu biết về sa sút trí tuệ là rào cản đối với chẩn đoán và chăm sóc."'
    ly_do: 'Review: vế "hoảng loạn khi gặp một lần quên vặt" không có nguồn; giữ vế có nguồn (NHS, WHO). (nhận định n7)'
  - cu: 'Bảng, cột trái: "Làm nhiều việc cùng lúc khó hơn trước"'
    moi: '"Làm hai việc cùng lúc chậm hơn trước"'
    ly_do: "Review: theo Verhaeghen 2003 (chi phí thời gian khi làm hai việc lớn hơn ở người lớn tuổi; không thấy ở độ chính xác). (nhận định n37)"
  - cu: '"Các dấu hiệu sớm mà NHS nêu là quên thường xuyên những việc vừa xảy ra, hỏi lặp lại, khó làm việc quen thuộc, khó tìm từ, nhầm lẫn về thời gian và nơi chốn"'
    moi: '"Các dấu hiệu sớm của sa sút trí tuệ mà NHS nêu gồm khó làm việc quen thuộc, khó theo dõi cuộc trò chuyện hay tìm từ, nhầm lẫn về thời gian và nơi chốn; với bệnh Alzheimer, NHS nêu thường xuyên quên những việc vừa xảy ra và hỏi lặp lại"'
    ly_do: 'Review: trên trang NHS, "regularly forgetting recent events" và "asking questions repetitively" nằm ở mục triệu chứng của bệnh Alzheimer, không ở danh sách dấu hiệu sớm. (nhận định n67)'
  - cu: 'Hình gf-gc-curves: đường Gc tăng tới cuối trục; aria-label "trí tuệ kết tinh tăng dần rồi giữ vững"; chú thích "Gf … đạt đỉnh ở tuổi trưởng thành trẻ rồi suy giảm dần; … Gc … tăng suốt tuổi trung niên và giữ vững đến tuổi già."'
    moi: Đường Gc tăng đến khoảng trung niên muộn rồi chững lại và đi xuống nhẹ; aria-label "trí tuệ kết tinh tăng đến khoảng tuổi 60 rồi chững lại hay giảm, giảm muộn hơn và ít hơn"; chú thích "Gf … đạt đỉnh sớm rồi suy giảm dần; Gc … giảm muộn hơn và ít hơn, theo dự đoán của Cattell (1963). Ở vốn từ vựng, một chỉ báo của Gc, số liệu cho thấy tăng đến khoảng thập niên 60 rồi chững lại hay giảm, nhưng ở tuổi 70–80 vẫn cao hơn ở tuổi 20–40 (Salthouse, 2019); nhóm Seattle thấy trí tuệ kết tinh giảm dốc hơn từ cuối tuổi 70 (Schaie và Willis, 2010)." Thêm gf-gc-curves vào HINH_DA_SUA (tests/chuyen.test.mjs).
    ly_do: 'Review: Cattell 1963 tr. 3 "gc will show a later and lesser drop"; Salthouse 2019 (toàn văn) "a shift from increases at young ages to stability or declines after about age 60 … vocabulary measures were higher among adults in their 70’s and 80’s than among those in their 20’s, 30’s, and 40’s"; Schaie & Willis 2010 "crystallized abilities appear to show steeper decrement once the late 70s are reached". "Giữ vững đến tuổi già" mạnh hơn cả ba nguồn. (nhận định n26, n27)'
