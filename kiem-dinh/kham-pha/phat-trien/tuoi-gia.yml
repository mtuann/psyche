    cau: Nếu bạn lo về trí nhớ của mình hay người thân, hãy nói chuyện với bác sĩ; xem thêm Hỗ trợ.
    loai: loi-khuyen
    nguon:
      - nhs
    trich: '"it''s important to talk to a GP sooner rather than later if you''re worried about memory problems or other symptoms"'
    vi_tri: NHS, cuối trang Symptoms
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: (không có) Chữ mới: "Nếu bạn đang lo về trí nhớ của mình hay của người thân, hãy nói chuyện với bác sĩ; xem thêm [Hỗ trợ](/psyche/ho-tro/)." (thêm vào đoạn cuối "Điều gì đang xảy ra?" và đoạn đầu mục "Phân biệt lão hóa bình thường với sa sút trí tuệ") Lý do: Yêu cầu của lời giao cho chủ đề sa sút trí tuệ: chỉ nói nên tìm người có chuyên môn và dẫn Hỗ trợ. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Lời dẫn tới Hỗ trợ có ở mục "Điều gì đang xảy ra?" và đầu mục phân biệt; không có số đường dây nóng.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/conditions/dementia/symptoms/", "https://www.nhs.uk/conditions/dementia/diagnosis/" ]
    review: dung
