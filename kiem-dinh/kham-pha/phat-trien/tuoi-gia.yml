  - id: n16
    cau: Trong phân tích của Salthouse (2019) trên hơn 5.000 người, vốn từ vựng còn tăng đến khoảng thập niên 60 tuổi, trong khi tốc độ xử lý giảm gần như đều từ đầu tuổi trưởng thành và trí nhớ, suy luận giảm nhanh dần.
    loai: phat-hien
    nguon:
      - salthouse2019
    trich: normal cognitive aging is characterized by nearly linear declines from early adulthood in speed, and accelerating declines in memory and reasoning. However, vocabulary knowledge increased until the decade of the 60's in all three types of comparisons.
    vi_tri: Salthouse (2019), tóm tắt ("over 5,000 adults with cross-sectional data")
    ket_qua: da-sua
    ghi_chu: 'Chỉ đọc tóm tắt. Chữ cũ: "khả năng ngôn ngữ và vốn từ vựng giữ vững — thậm chí còn tăng — đến tận tuổi 70, trong khi tốc độ tri giác và tính toán số học là những năng lực "đi xuống" sớm nhất (Schaie, 2005)." Chữ mới: "…trong phân tích của Salthouse (2019) trên hơn 5.000 người, vốn từ vựng còn tăng đến khoảng thập niên 60 tuổi, trong khi tốc độ xử lý giảm gần như đều từ đầu tuổi trưởng thành và trí nhớ, suy luận giảm nhanh dần." Lý do: "Đến tuổi 70" và "tính toán số học đi xuống sớm nhất (Schaie 2005)" không kiểm được (sách in, không mở được); thay bằng số liệu đã đọc. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Đọc toàn văn Salthouse 2019 (bản tác giả, PMC6367038, qua NCBI E-utilities, 10/11/2026): "nearly linear declines in speed from the decade of the 30’s"; tóm tắt "from early adulthood"; N cắt ngang 5.098.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6367038/", "https://doi.org/10.1037/pag0000288" ]
    luot_2_ghi_chu: N = 5.098 cắt ngang.
    review: dung
  - id: n17
    cau: (Đã bỏ) Tốc độ tri giác và tính toán số học là những năng lực đi xuống sớm nhất trong SLS (Schaie, 2005).
    loai: phat-hien
    ket_qua: da-bo
    ghi_chu: 'Sách Schaie (2005) không mở được; không có nguồn khác đã mở nói điều này. Chữ cũ: "…tốc độ tri giác và tính toán số học là những năng lực "đi xuống" sớm nhất (Schaie, 2005)." Chữ mới: (bỏ; thay bằng n16) Lý do: Không kiểm được. Review (Claude Opus 5.5, 10/11/2026): Đã kiểm: trang không còn "Schaie, 2005" hay "tốc độ tri giác … sớm nhất".'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu đã bỏ khỏi trang; không qua lượt 2.
    review: dung
  - id: n18
    cau: 'Schaie và Willis (2010) liệt kê các yếu tố gắn với ít suy giảm hơn ở tuổi già: không bệnh tim mạch và bệnh mạn tính, môi trường thuận lợi gắn với địa vị kinh tế–xã hội cao, đời sống trí óc phức tạp và nhiều kích thích, tính cách linh hoạt ở tuổi trung niên, bạn đời có năng lực nhận thức cao, giữ được tốc độ xử lý tri giác cao; đây là liên hệ quan sát.'
    loai: phat-hien
    nguon:
      - schaie2010
    trich: (a) absence of cardiovascular and other chronic diseases; (b) a favorable environment mediated by high socioeconomic status; (c) involvement in a complex and intellectually stimulating environment; (d) flexible personality style at midlife; (e) high cognitive status of spouse; and (f) maintenance of high levels of perceptual processing speed.
    vi_tri: Schaie & Willis (2010), mục "What Variables Account for Individual Differences in Adulthood?"
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "khác biệt giữa người với người rất lớn, và học vấn, độ phức tạp của công việc, mức độ hoạt động trí óc đều làm chậm quá trình suy giảm. Hai người cùng 75 tuổi có thể ở hai "tuổi nhận thức" hoàn toàn khác nhau." Chữ mới: Danh sách yếu tố của Schaie & Willis (2010) và lời "chưa phải bằng chứng nhân quả". Lý do: "Học vấn" không có trong danh sách (có "địa vị kinh tế–xã hội cao"); "làm chậm" là ngôn ngữ nhân quả, nguồn chỉ nêu "implicated"; bỏ câu "hai người cùng 75 tuổi" (không kiểm được). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Đọc lại toàn văn Schaie & Willis 2010 (PMC3607395): danh sách (a)–(f) khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC3607395/" ]
    luot_2_ghi_chu: Bài là Schaie & Willis 2010 (ISSBD Bulletin), tổng hợp các yếu tố; đây là liên hệ quan sát.
    review: dung
  - id: n19
    cau: Raymond Cattell đã đề xuất phân biệt trí tuệ lưu động và trí tuệ kết tinh từ thập niên 1940.
    loai: lich-su
    nguon:
      - cattell1963
    trich: The theory of fluid and crystallized intelligence propounded 20 years ago by the author has since accumulated support.
    vi_tri: Cattell (1963), tóm tắt (tr. 1)
    ket_qua: da-sua
    ghi_chu: '1963 − 20 năm = khoảng 1943. Chữ cũ: "Cattell đề xuất một phân biệt kinh điển trong bài báo "Theory of fluid and crystallized intelligence" (1963)". Chữ mới: "…đề xuất một phân biệt kinh điển (từ thập niên 1940); bài báo… (1963) là một thí nghiệm kiểm tra nó". Lý do: Bài 1963 nói lý thuyết được nêu "20 năm trước". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Cattell 1963 (Internet Archive): "propounded 20 years ago".'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fh0034974.zip/10.1037%252Fh0046743.pdf" ]
    review: dung
  - id: n20
    cau: Bài năm 1963 là một thí nghiệm kiểm tra phân biệt ấy, trên 277 học sinh lớp 7–8.
    loai: phat-hien
    nguon:
      - cattell1963
    trich: By factoring culturally embedded with culture-fair intelligence measures on a background of pure personality primaries (N = 277 7th and 8th grade boys and girls), it is shown that 2 general factors indeed exist.
    vi_tri: Cattell (1963), tóm tắt (tr. 1)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fh0034974.zip/10.1037%252Fh0046743.pdf" ]
  - id: n21
    cau: Trí tuệ lưu động (Gf) là khả năng giải quyết vấn đề mới, suy luận trừu tượng, xử lý nhanh — ít phụ thuộc vào kiến thức đã học.
    loai: dinh-nghia
    nguon:
      - cattell1963
    trich: performances at speed, in any cognitive field, will load gf more than gc … [gf] shows more in tests requiring adaptation to new situations, where crystallized skills are of no particular advantage.
    vi_tri: Cattell (1963), tr. 3
    ket_qua: dung
    ghi_chu: '"Suy luận trừu tượng" theo cách mô tả phổ biến; bài gốc nhấn vào thích nghi với tình huống mới và làm theo tốc độ.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fh0034974.zip/10.1037%252Fh0046743.pdf" ]
  - id: n22
    cau: Cattell dự đoán Gf đạt cực đại sớm (khoảng 14–15 tuổi) rồi giảm đều từ khoảng 22 tuổi; số liệu hiện đại cũng cho thấy các năng lực tốc độ giảm gần như đều từ đầu tuổi trưởng thành (Salthouse, 2019).
    loai: phat-hien
    nguon:
      - cattell1963
      - salthouse2019
    trich: gf reaching an early maximum at 14—15 years … gf will decline from about age 22 continuously to old age, gc will show a later and lesser drop.
    vi_tri: Cattell (1963), tr. 3, mục c; Salthouse (2019) tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đạt đỉnh ở tuổi trưởng thành trẻ rồi suy giảm dần." Chữ mới: "Cattell dự đoán Gf đạt cực đại sớm (khoảng 14–15 tuổi) rồi giảm đều từ khoảng 22 tuổi; số liệu hiện đại cũng cho thấy các năng lực tốc độ giảm gần như đều từ đầu tuổi trưởng thành (Salthouse, 2019)." Lý do: Cattell nêu 14–15 tuổi và 22 tuổi; "tuổi trưởng thành trẻ" không khớp. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Cattell 1963 tr. 3 (đọc lại): "gf reaching an early maximum at 14—15 years … gf will decline from about age 22".'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fh0034974.zip/10.1037%252Fh0046743.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6367038/" ]
    review: dung
  - id: n23
    cau: Trí tuệ kết tinh (Gc) là kiến thức, vốn từ, kỹ năng tích lũy qua học tập và kinh nghiệm.
    loai: dinh-nghia
    nguon:
      - cattell1963
    trich: Before biological maturity (15-20 years of age) individual differences in … gf and gc will reflect mainly differences in cultural opportunity and interest.
    vi_tri: Cattell (1963), tr. 3
    ket_qua: dung
    ghi_chu: Gc là yếu tố của các bài đo "culturally embedded" (tóm tắt); mô tả "tích lũy qua học tập và kinh nghiệm" là cách diễn đạt phổ biến, bài gốc nói về cơ hội văn hóa.
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fh0034974.zip/10.1037%252Fh0046743.pdf" ]
  - id: n24
    cau: Gc giảm muộn hơn và ít hơn Gf theo dự đoán của Cattell; ở vốn từ vựng, một chỉ báo của Gc, số liệu cho thấy còn tăng đến khoảng thập niên 60 tuổi (Salthouse, 2019).
    loai: phat-hien
    nguon:
      - cattell1963
      - salthouse2019
    trich: gc will show a later and lesser drop. (Cattell, tr. 3); vocabulary knowledge increased until the decade of the 60's (Salthouse 2019)
    vi_tri: Cattell (1963), tr. 3; Salthouse (2019) tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Vốn từ vựng là chỉ báo thường dùng của Gc; Salthouse 2019 không dùng nhãn "Gc" trong tóm tắt. Chữ cũ: "Tăng suốt tuổi trung niên và giữ vững đến tuổi già." Chữ mới: "Giảm muộn hơn và ít hơn Gf theo dự đoán của Cattell; ở vốn từ vựng… còn tăng đến khoảng thập niên 60 tuổi (Salthouse, 2019)." Lý do: Cattell nêu "later and lesser drop", không nêu "giữ vững đến tuổi già". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Cattell 1963 tr. 3: "gc will show a later and lesser drop"; Đọc toàn văn Salthouse 2019 (bản tác giả, PMC6367038, qua NCBI E-utilities, 10/11/2026): vốn từ tăng đến khoảng thập niên 60. Schaie & Willis 2010 thêm: Gc "steeper decrement once the late 70s are reached"; câu nói rõ "theo dự đoán của Cattell" nên không sai.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fh0034974.zip/10.1037%252Fh0046743.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6367038/" ]
    review: dung
  - id: n25
    cau: Phân biệt Gf/Gc giúp hiểu vì sao tuổi già không phải là "kém thông minh đi" một cách đơn giản (ví dụ cụ 75 tuổi học điện thoại và dùng vốn sống trong nghề là ví dụ giả định).
    loai: phat-hien
    nguon:
      - cattell1963
      - salthouse2019
    trich: gc will show a later and lesser drop (Cattell); vocabulary knowledge increased until the decade of the 60's (Salthouse)
    vi_tri: như n22, n24
    ket_qua: da-lam-mem
    ghi_chu: 'Ví dụ cụ 75 tuổi: gia-dinh, không phải nhận định. Chữ cũ: "Chính phân biệt này giải thích "nghịch lý" của tuổi già: … (Gc còn nguyên, thậm chí dày thêm). Già đi không phải là "kém thông minh đi" một cách đơn giản — mà là bản đồ trí tuệ được vẽ lại". Chữ mới: "Phân biệt này giúp hiểu vì sao tuổi già không phải là "kém thông minh đi" một cách đơn giản: … (một ví dụ giả định…). Nói gọn: bản đồ trí tuệ được vẽ lại, chứ không đơn giản là đi xuống". Lý do: Làm mềm "giải thích" thành "giúp hiểu"; bỏ "Gc còn nguyên, thậm chí dày thêm". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Ví dụ cụ 75 tuổi là giả định, nói rõ trên trang.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fh0034974.zip/10.1037%252Fh0046743.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6367038/" ]
    luot_2_ghi_chu: Ví dụ cụ 75 tuổi là giả định; phần khẳng định (Gf giảm sớm hơn, Gc muộn và ít hơn) đúng.
    review: dung
  - id: n26
    cau: "Hình Gf-Gc: Gf đạt đỉnh sớm rồi suy giảm dần."
    loai: phat-hien
    nguon:
      - cattell1963
      - salthouse2019
    trich: gf reaching an early maximum at 14—15 years … decline from about age 22
    vi_tri: 'Hình gf-gc-curves (src/hinh/gf-gc-curves.html): nhãn "Gf — trí tuệ lưu động", chú thích'
    ket_qua: dung
    ghi_chu: 'Hình là sơ đồ ước lệ, không có số. Đỉnh ở "trưởng thành trẻ" trong hình hơi muộn so với Cattell (14–15) nhưng khớp "giảm đều từ đầu tuổi trưởng thành" của Salthouse 2019. Review (Claude Opus 5.5, 10/11/2026): Ngoài phạm vi review (hai lượt cùng dung) nhưng chạm vì sửa hình: chú thích đổi "đạt đỉnh ở tuổi trưởng thành trẻ" thành "đạt đỉnh sớm" cho khớp Cattell 1963 (14–15 tuổi) mà thân bài nêu; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fh0034974.zip/10.1037%252Fh0046743.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6367038/" ]
    luot_2_ghi_chu: Cattell đặt đỉnh gf ở 14-15 tuổi; 'đỉnh sớm' là đúng, hơi lệch chữ 'ở tuổi trưởng thành'.
    review: dung
  - id: n27
    cau: "Hình Gf-Gc: Gc giảm muộn hơn và ít hơn Gf (dự đoán của Cattell); vốn từ vựng tăng đến khoảng thập niên 60 rồi chững lại hay giảm, ở tuổi 70–80 vẫn cao hơn tuổi 20–40; nhóm Seattle thấy Gc giảm dốc hơn từ cuối tuổi 70."
    loai: phat-hien
    nguon:
      - cattell1963
      - salthouse2019
      - schaie2010
    trich: gc will show a later and lesser drop [Cattell 1963, tr. 3] | The age relations with vocabulary measures were generally similar in each type of comparison, with a shift from increases at young ages to stability or declines after about age 60. Nevertheless, it is noteworthy that the vocabulary measures were higher among adults in their 70’s and 80’s than among those in their 20’s, 30’s, and 40’s. [Salthouse 2019, Results] | whereas fluid abilities begin to decline earlier, crystallized abilities appear to show steeper decrement once the late 70s are reached [Schaie & Willis 2010]
    vi_tri: 'Hình gf-gc-curves: nhãn "Gc — trí tuệ kết tinh", chú thích'
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó (hình không sửa theo lời giao; người giao quyết): "giữ vững đến tuổi già" mạnh hơn nguồn ("giảm muộn hơn và ít hơn"; vốn từ tăng đến thập niên 60). Đường Gc trong hình đi ngang, không giảm. Ghi là dung vì hình là sơ đồ ước lệ; đề nghị người giao cân nhắc đổi chú thích. Review (Claude Opus 5.5, 10/11/2026): Lượt 2 quá mạnh đúng. Đọc lại Cattell 1963 (Internet Archive), toàn văn Salthouse 2019 và Schaie & Willis 2010: không nguồn nào nói Gc "giữ vững đến tuổi già"; SLS còn thấy Gc giảm dốc hơn từ cuối tuổi 70. Đã sửa hình (đường Gc chững lại rồi đi xuống nhẹ, aria-label, chú thích), thêm hình vào HINH_DA_SUA; doi_chu.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fh0034974.zip/10.1037%252Fh0046743.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6367038/" ]
    luot_2_ghi_chu: "câu đúng: Hình Gf-Gc: Gc tăng đến khoảng thập niên 60 rồi ổn định hay giảm nhẹ, giảm muộn hơn và ít hơn Gf; ở tuổi 70-80 vẫn cao hơn người trẻ.; Gc (vốn từ) tăng đến thập niên 60 rồi ổn định hay giảm nhẹ; không phải 'giữ vững' tuyệt đối."
    review: sai
  - id: n28
    cau: 'Hiệu ứng tích cực theo tuổi (positivity effect): so với người trẻ, người lớn tuổi chú ý và nhớ thông tin tích cực nhiều hơn tiêu cực.'
    loai: dinh-nghia
    nguon:
      - reed2012
    trich: The "positivity effect" refers to an age-related trend that favors positive over negative stimuli in cognitive processing. Relative to their younger counterparts, older people attend to and remember more positive than negative information.
    vi_tri: Reed & Carstensen (2012), tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC3459016/", "https://europepmc.org/article/MED/24660792" ]
  - id: n29
    cau: Trong hai nghiên cứu của Charles, Mather và Carstensen (2003), người trẻ, trung niên và lớn tuổi xem ảnh tích cực, tiêu cực, trung tính rồi làm bài nhớ lại và nhận diện.
    loai: phat-hien
    nguon:
      - charles2003
    trich: In Study 1, younger, middle-aged, and older adults were shown images on a computer screen and, after a distraction task, were asked first to recall as many as they could and then to identify previously shown images from a set of old and new ones.
    vi_tri: Charles và cộng sự (2003), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chỉ đọc tóm tắt; ba nhóm tuổi theo tóm tắt (nhóm tuổi cụ thể không kiểm được). Chữ cũ: "144 người thuộc ba nhóm tuổi (18–29, 41–53, 65–80) xem các bức ảnh tích cực, tiêu cực và trung tính, sau đó làm bài kiểm tra nhớ lại và nhận diện." Chữ mới: "người trẻ, trung niên và lớn tuổi xem các bức ảnh… rồi làm bài nhớ lại và nhận diện." Lý do: Không mở được toàn văn; cỡ mẫu 144 và các khoảng tuổi không có trong tóm tắt. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Tóm tắt Charles 2003 (Europe PMC, đọc lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/12825643" ]
    review: dung
  - id: n30
    cau: So với ảnh tích cực và trung tính, số ảnh tiêu cực được nhớ giảm dần qua từng nhóm tuổi lớn hơn; ở nghiên cứu thứ hai, khác biệt tuổi tác lớn nhất nằm ở ảnh tiêu cực.
    loai: phat-hien
    nguon:
      - charles2003
    trich: The relative number of negative images compared with positive and neutral images recalled decreased with each successively older age group. … In Study 2, the largest age differences in recall and recognition accuracy were also for the negative images.
    vi_tri: Charles và cộng sự (2003), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Kết quả: người lớn tuổi nhớ được nhiều ảnh tích cực hơn ảnh tiêu cực, trong khi người trẻ nhớ hai loại ngang nhau — và khác biệt tuổi tác lớn nhất nằm ở ảnh tiêu cực (người già nhớ kém hẳn)." Chữ mới: "…số ảnh tiêu cực được nhớ giảm dần qua từng nhóm tuổi lớn hơn, và ở nghiên cứu thứ hai, khác biệt tuổi tác lớn nhất nằm ở ảnh tiêu cực." Lý do: Tóm tắt nói về số ảnh tiêu cực tương đối so với tích cực/trung tính; không nói "người trẻ nhớ hai loại ngang nhau" hay "người già nhớ ảnh tích cực nhiều hơn tiêu cực". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Tóm tắt Charles 2003: Study 1 và Study 2 khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/12825643" ]
    review: dung
  - id: n31
    cau: (Đã bỏ) Nghiên cứu thứ hai có 64 người (19–30 so với 63–86 tuổi) và loại trừ khả năng kết quả chỉ do tâm trạng lúc làm bài.
    loai: so-lieu
    ket_qua: da-bo
    ghi_chu: 'Không mở được toàn văn Charles 2003 (bản Stanford, CiteSeerX không tải được); tóm tắt không có các điều này. Chữ cũ: "Một nghiên cứu thứ hai (64 người, 19–30 so với 63–86 tuổi) loại trừ khả năng kết quả chỉ do tâm trạng lúc làm bài." Chữ mới: (bỏ) Lý do: Không kiểm được. Review (Claude Opus 5.5, 10/11/2026): Đã kiểm: trang không còn "64 người", "144" hay "tâm trạng lúc làm bài".'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu đã bỏ khỏi trang; không qua lượt 2.
    review: dung
  - id: n32
    cau: 'Phân tích tổng hợp của Reed, Chan và Mikels (2014): 100 nghiên cứu với 7.129 người; hiệu ứng tích cực là đáng tin cậy.'
    loai: so-lieu
    nguon:
      - reed2014
    trich: we conducted a systematic meta-analysis of 100 empirical studies of the positivity effect (N = 7,129). Results indicate that the positivity effect is reliable and moderated by theoretically implicated methodological and sample characteristics.
    vi_tri: Reed và cộng sự (2014), tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/24660792" ]
  - id: n33
    cau: Hiệu ứng lớn hơn trong các nghiên cứu không ràng buộc quá trình xử lý thông tin và trong các nghiên cứu so sánh các nhóm tuổi cách xa nhau hơn.
    loai: phat-hien
    nguon:
      - reed2014
    trich: The positivity effect is larger in studies that do not constrain (vs. constrain) cognitive processing … and in studies incorporating wider (vs. narrower) age comparisons.
    vi_tri: Reed và cộng sự (2014), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…nó mạnh nhất khi người tham gia được xử lý thông tin một cách tự nhiên, không bị ép buộc (khi có nhiệm vụ gây xao nhãng chen vào, hiệu ứng có thể yếu đi, thậm chí đảo ngược)." Chữ mới: "…nó lớn hơn trong các nghiên cứu không ràng buộc quá trình xử lý… và trong các nghiên cứu so sánh các nhóm tuổi cách xa nhau hơn." Lý do: Tóm tắt không nói "đảo ngược" khi xao nhãng; nói "lớn hơn khi không ràng buộc" và "lớn hơn khi so tuổi xa nhau". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Tóm tắt Reed 2014 (Europe PMC, đọc lại).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/24660792" ]
    review: dung
  - id: n34
    cau: 'Người trẻ có xu hướng ngược lại: thiên về thông tin tiêu cực hơn tích cực.'
    loai: phat-hien
    nguon:
      - reed2014
    trich: older adults show a significant information processing bias toward positive versus negative information, whereas younger adults show the opposite pattern.
    vi_tri: Reed và cộng sự (2014), tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/24660792" ]
  - id: n35
    cau: 'Lý thuyết chọn lọc cảm xúc–xã hội (Carstensen): khi thời gian còn lại được nhận thức là hữu hạn, con người ưu tiên các mục tiêu điều chỉnh cảm xúc hơn các mục tiêu thu thập kiến thức.'
    loai: phat-hien
    nguon:
      - carstensen1999
    trich: When time is perceived as open-ended, knowledge-related goals are prioritized. In contrast, when time is perceived as limited, emotional goals assume primacy.
    vi_tri: Carstensen và cộng sự (1999), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…khi nhận thức được quỹ thời gian đời mình không còn nhiều, con người tự động ưu tiên các mục tiêu ý nghĩa về mặt cảm xúc — ở gần người thân yêu, tránh xung đột vô ích, giữ tâm trạng tốt." Chữ mới: "…khi nhận thức rằng thời gian còn lại là hữu hạn, con người ưu tiên các mục tiêu điều chỉnh cảm xúc hơn các mục tiêu thu thập kiến thức (Carstensen, Isaacowitz và Charles, 1999)." Lý do: Bỏ "tự động" và ba ví dụ cụ thể (không có trong tóm tắt); dùng chữ "emotional goals… regulation of emotion". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC2790864/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3459016/" ]
    review: dung
  - id: n36
    cau: Theo lý thuyết, hiệu ứng tích cực là hệ quả của sự chuyển hướng động cơ ấy, không phải dấu hiệu "lẫn".
    loai: phat-hien
    nguon:
      - charles2003
      - reed2012
    trich: Findings are consistent with socioemotional selectivity theory, which posits greater investment in emotion regulation with age. (Charles 2003)
    vi_tri: Charles và cộng sự (2003), tóm tắt; Reed & Carstensen (2012), tóm tắt ("conceptual basis articulated")
    ket_qua: da-lam-mem
    ghi_chu: '"Không phải dấu hiệu lẫn" là suy luận của trang, không có nguồn trực tiếp. Chữ cũ: "Hiệu ứng tích cực vì thế không phải là "lẫn", mà là một sự điều chỉnh có chủ đích của hệ thống động cơ." Chữ mới: "Theo lý thuyết này, hiệu ứng tích cực không phải dấu hiệu "lẫn", mà là hệ quả của sự chuyển hướng động cơ ấy." Lý do: Bỏ "có chủ đích" (không kiểm được); nêu rõ "theo lý thuyết". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Câu nói rõ "theo lý thuyết này".'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC3459016/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC2790864/" ]
    luot_2_ghi_chu: "'Theo lý thuyết': đúng như một khẳng định về lý thuyết."
    review: dung
  - id: n37
    cau: "Cột trái bảng: tốc độ xử lý chậm dần và làm hai việc cùng lúc chậm hơn là thay đổi thông thường theo tuổi."
    loai: lam-sang
    nguon:
      - salthouse1996
      - salthouse2019
      - verhaeghen2003
    trich: nearly linear declines from early adulthood in speed (Salthouse 2019); dual-task cost on latency "was larger in older adults than in younger adults" (Verhaeghen 2003)
    vi_tri: Salthouse (2019), (1996) tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: Cột trái cũ: "Thỉnh thoảng quên tên người, quên từ — rồi tự nhớ lại sau; Thỉnh thoảng quên chìa khóa, kính để đâu; Làm nhiều việc cùng lúc chậm hơn, dễ xao nhãng hơn trước; … Thỉnh thoảng có quyết định chưa khôn ngoan". Chữ mới: Cột trái mới: "Tốc độ xử lý chậm dần; Làm nhiều việc cùng lúc khó hơn trước; Học cái mới mất nhiều thời gian hơn…; Vốn từ vựng… còn tăng đến khoảng thập niên 60". Lý do: Các hàng quên tên/từ/chìa khóa và "quyết định chưa khôn ngoan" không có nguồn đã mở; thay bằng điều Salthouse và Schaie nêu. Review (Claude Opus 5.5, 10/11/2026): Như n5: "làm nhiều việc cùng lúc khó hơn" không có ở Salthouse 1996; Verhaeghen 2003 chỉ thấy chậm hơn (thời gian), không kém chính xác hơn. Đã sửa hàng bảng thành "Làm hai việc cùng lúc chậm hơn trước"; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6367038/", "https://europepmc.org/article/MED/14518807" ]
    review: sai
  - id: n38
    cau: Học cái mới mất nhiều thời gian hơn nhưng vẫn học được.
    loai: lam-sang
    nguon:
      - salthouse2019
      - schaie2010
    trich: cognitive interventions that have been successful in reversing carefully documented declines in ability performance and in improving the cognitive functions of older persons who have remained stable.
    vi_tri: Schaie & Willis (2010), đoạn đầu; Salthouse (2019) (tốc độ giảm)
    ket_qua: da-lam-mem
    ghi_chu: '"Mất nhiều thời gian hơn" là suy ra từ tốc độ xử lý giảm, không có nguồn đo trực tiếp thời gian học; "vẫn học được" theo các nghiên cứu huấn luyện của SLS. Chữ cũ: "Mất nhiều thời gian hơn để học cái mới, nhưng vẫn học được". Chữ mới: "Học cái mới mất nhiều thời gian hơn, nhưng vẫn học được" (ở bảng đã nối với nguồn); thêm chú thích của bảng. Lý do: Giữ ý nhưng ghi rõ cơ sở và giới hạn. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Đọc lại toàn văn Schaie & Willis 2010 (PMC3607395): huấn luyện: khoảng hai phần ba người tham gia cải thiện rõ. "Mất nhiều thời gian hơn" là suy ra từ tốc độ xử lý chậm, bảng nói rõ chỉ minh họa.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC3607395/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6367038/" ]
    luot_2_ghi_chu: Phần 'mất nhiều thời gian hơn' suy từ tốc độ xử lý chậm; phần 'vẫn học được' có nguồn SLS.
    review: dung
  - id: n39
    cau: 'Cột phải bảng: thường xuyên quên những việc vừa xảy ra, tên và gương mặt; hỏi lặp lại cùng một câu.'
    loai: lam-sang
    nguon:
      - nhs
    trich: '"regularly forgetting recent events, names and faces"; "asking questions repetitively"'
    vi_tri: NHS, Symptoms of dementia, phần Alzheimer's (hai dấu hiệu này nằm ở đó)
    ket_qua: da-sua
    ghi_chu: 'Trich theo tóm tắt của công cụ đọc web, không phải bản sao nguyên trang. Chữ cũ: "Quên hẳn thông tin vừa mới học; hỏi đi hỏi lại cùng một câu trong ngày". Chữ mới: "Thường xuyên quên những việc vừa xảy ra, tên và gương mặt; Hỏi lặp lại cùng một câu". Lý do: Theo chữ của NHS; bỏ "trong ngày". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Đọc lại trang NHS "Symptoms of dementia" (10/11/2026): hai dấu hiệu nằm ở mục triệu chứng của bệnh Alzheimer; tiêu đề cột "Dấu hiệu nên nói chuyện với bác sĩ" đúng với lời NHS "talk to a GP sooner rather than later if you''re worried about memory problems".'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/conditions/dementia/symptoms/" ]
    review: dung
  - id: n40
    cau: 'Cột phải bảng: thấy khó làm những việc quen thuộc hằng ngày; khó theo dõi cuộc trò chuyện hay tìm từ; nhầm lẫn về thời gian và nơi chốn.'
    loai: lam-sang
    nguon:
      - nhs
    trich: '"finding it hard to carry out familiar daily tasks"; "struggling to follow a conversation or find the right word"; "being confused about time and place"'
    vi_tri: NHS, Symptoms of dementia, mục Early symptoms
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Không xoay xở được những việc quen thuộc…; Lạc ở nơi quen thuộc; nhầm lẫn nghiêm trọng về thời gian, địa điểm; Để đồ vật vào chỗ kỳ lạ…; Suy giảm ảnh hưởng rõ rệt đến sinh hoạt hàng ngày". Chữ mới: "Thấy khó làm những việc quen thuộc hằng ngày; Khó theo dõi cuộc trò chuyện hay tìm từ; nhầm lẫn về thời gian và nơi chốn". Lý do: Theo danh sách của NHS; hàng "để đồ vật vào chỗ kỳ lạ" và "lạc ở nơi quen thuộc" không có trong nguồn đã mở. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Đọc lại trang NHS "Symptoms of dementia" (10/11/2026): ba dấu hiệu ở danh sách dấu hiệu sớm.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/conditions/dementia/symptoms/" ]
    review: dung
  - id: n41
    cau: Điểm chung của các mô tả y tế là sa sút trí tuệ ảnh hưởng đến sinh hoạt hằng ngày, còn thay đổi thông thường thì không; chúng tôi không có nguồn cho một ranh giới cứng giữa hai cột.
    loai: lam-sang
    nguon:
      - who2026
    trich: '"Dementia is a condition that affects memory, thinking and the ability to perform daily activities."'
    vi_tri: WHO, tờ thông tin, định nghĩa
    ket_qua: da-lam-mem
    ghi_chu: 'Vế "thay đổi thông thường thì không ảnh hưởng sinh hoạt" là suy ra, không có nguồn trực tiếp. Chữ cũ: "Nguyên tắc vàng: lão hóa bình thường làm mọi thứ chậm đi; sa sút trí tuệ làm mất đi khả năng. Quên rồi nhớ lại = bình thường. Quên hẳn như chưa từng xảy ra + ảnh hưởng cuộc sống = cần đi khám." Chữ mới: "Bảng này chỉ minh họa… Điểm chung của các mô tả y tế là sa sút trí tuệ ảnh hưởng đến sinh hoạt hằng ngày (WHO)… hãy nói chuyện với bác sĩ; NHS khuyên nên làm sớm." Lý do: Quy tắc "quên rồi nhớ lại = bình thường" không có nguồn và trái với NHS (khó tìm từ là dấu hiệu sớm); thay bằng câu bám WHO và NHS. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Đọc lại tờ thông tin WHO "Dementia" (10/11/2026): câu trích nguyên văn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.who.int/news-room/fact-sheets/detail/dementia", "https://www.nhs.uk/conditions/dementia/symptoms/" ]
    luot_2_ghi_chu: Câu tự nói không có nguồn cho ranh giới cứng; đúng.
    review: dung
  - id: n42
    cau: Chỉ bác sĩ sau khi thăm khám mới kết luận được; thông tin trong mục này chỉ là giáo dục chung, không phải chẩn đoán.
    loai: lam-sang
    nguon:
      - nhs
    trich: '"it''s important to talk to a GP sooner rather than later if you''re worried about memory problems or other symptoms"'
    vi_tri: NHS, cuối trang
    ket_qua: dung
    ghi_chu: Câu rào đón về phạm vi của trang; nguồn chỉ nói nên gặp bác sĩ.
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/conditions/dementia/diagnosis/", "https://www.nhs.uk/conditions/dementia/symptoms/" ]
    luot_2_ghi_chu: "Khớp: chẩn đoán qua thăm khám y tế; nội dung trang là giáo dục chung."
  - id: n43
    cau: 'Nhãn "Khá vững": vốn từ vựng còn tăng đến khoảng thập niên 60; tốc độ xử lý và suy luận với vấn đề mới suy giảm sớm hơn.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - salthouse2019
      - hartshorne2015
      - schaie2010
    ly_do: 'Phân tích của Salthouse (2019) trên hơn 5.000 người (cắt ngang, gần-dọc) thấy vốn từ tăng đến thập niên 60 và tốc độ giảm đều từ đầu tuổi trưởng thành; Hartshorne & Germine (2015, 48.537 người trực tuyến) thấy các năng lực đạt đỉnh ở độ tuổi rất khác nhau; SLS thấy suy giảm đáng tin cậy chưa có trước 60. Theo mục 4, "Vững chắc" cần phân tích tổng hợp hay tổng quan hệ thống: chưa mở được phân tích tổng hợp riêng cho điều này, và số liệu cắt ngang với số liệu dọc cho hình ảnh khác nhau (Salthouse 2019 nói hiệu ứng làm quen làm sai lệch số liệu dọc), nên Khá vững.'
    nguon:
      - salthouse2019
      - hartshorne2015
      - schaie2010
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó: Cattell và Horn không đọc được bản Horn & Cattell 1967; chỉ Cattell 1963. Lượt 2 và review cân nhắc. Chữ cũ: Khung ":::vung-chac[trí tuệ kết tinh giữ vững đến tuổi già; trí tuệ lưu động suy giảm sớm hơn]… giữ vững đến tuổi 70… Đây là một trong những kết quả tái lập tốt nhất của tâm lý học lão hóa." Chữ mới: Khung ":::kha-vung[vốn từ vựng còn tăng đến khoảng thập niên 60; tốc độ xử lý và suy luận với vấn đề mới suy giảm sớm hơn]" kèm Salthouse 2019, Hartshorne & Germine 2015 và lý do chỉ khá vững. Lý do: Chưa có phân tích tổng hợp đã mở; "tái lập tốt nhất" không kiểm được; "tuổi 70" mạnh hơn nguồn. Đổi nhãn Vững chắc → Khá vững: các trang khác trỏ tới đoạn này cần xem lại (tom-tat tự dựng). Review (Claude Opus 5.5, 10/11/2026): Nhãn Khá vững đạt thước đo mục 4. Đọc toàn văn Salthouse 2019 (bản tác giả, PMC6367038, qua NCBI E-utilities, 10/11/2026): khớp. Schaie & Willis 2010: "Our data do lend some support to the notion that fluid abilities tend to decline earlier than crystallized abilities. There are, however, important ability-by-age, ability-by-gender, and ability-by-cohort interactions" — thêm lý do không lên Vững chắc.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6367038/", "https://doi.org/10.1037/pag0000288" ]
    luot_2_ghi_chu: "Nhãn 'Khá vững' (không cao hơn thước đo): một nghiên cứu lớn nhất quán với tổng quan SLS, chưa có tái lập lớn có đăng ký trước."
    review: dung
  - id: n44
    cau: 'Nhãn "Khá vững": hiệu ứng tích cực theo tuổi là có thật, nhưng phụ thuộc điều kiện (Reed và cộng sự, 2014).'
    loai: nhan
    nhan: kha-vung
    co_so:
      - reed2014
      - reed2012
    ly_do: Có một phân tích tổng hợp 100 nghiên cứu (N = 7.129) thấy hiệu ứng đáng tin cậy nhưng bị điều tiết bởi đặc điểm phương pháp và mẫu; Reed & Carstensen (2012) nói một số nghiên cứu không thấy khác biệt theo tuổi. Có phân tích tổng hợp nhưng kết quả thay đổi nhiều theo thiết kế và chưa có tái lập lớn đăng ký trước, nên Khá vững.
    nguon:
      - reed2014
      - reed2012
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…Nhưng hiệu ứng này yếu đi hoặc đảo ngược khi người tham gia bị ép buộc, xao nhãng hoặc căng thẳng". Chữ mới: "…Nhưng hiệu ứng này khác nhau theo cách đo: lớn hơn khi quá trình xử lý không bị ràng buộc, và một số nghiên cứu không thấy khác biệt theo tuổi (Reed và Carstensen, 2012)". Lý do: Tóm tắt không nói "đảo ngược", "căng thẳng". Review (Claude Opus 5.5, 10/11/2026): Nhãn Khá vững đạt thước đo: có phân tích tổng hợp (100 nghiên cứu) nhưng hiệu ứng bị điều tiết mạnh và Reed & Carstensen 2012 ghi nhiều nghiên cứu không thấy khác biệt; chưa có tái lập lớn đăng ký trước.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/24660792" ]
    luot_2_ghi_chu: Nhãn 'Khá vững' không cao hơn thước đo (có phân tích tổng hợp nhưng phụ thuộc điều kiện).
    review: dung
  - id: n45
    cau: 'Nhãn "Đang tranh cãi": suy giảm nhận thức có bắt đầu trước 60 tuổi không? (SLS: chưa trước 60; Whitehall II: đã thấy từ 45–49).'
    loai: nhan
    nhan: tranh-cai
    co_so:
      - schaie2010
      - singh2012
      - salthouse2019
    ly_do: 'Hai nguồn có chất lượng cao cho kết quả khác chiều: SLS (không suy giảm đáng tin cậy trước 60 nhìn chung; nhỏ ở một số thế hệ từ thập niên 50) và Whitehall II (theo dõi 10 năm trên người 45–70 tuổi: "Cognitive decline is already evident in middle age (age 45-49)"). Salthouse (2019) cho rằng số liệu dọc bị sai lệch bởi hiệu ứng làm quen; Singh-Manoux cho rằng số liệu cắt ngang phóng đại suy giảm ở nữ. Khác biệt do thiết kế và đo lường, chưa ngã ngũ.'
    nguon:
      - schaie2010
      - singh2012
      - salthouse2019
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Khác biệt một phần đến từ cách đo và định nghĩa "đáng tin cậy" — cuộc tranh luận vẫn tiếp diễn." Chữ mới: "Khác biệt liên quan đến thiết kế nghiên cứu: so sánh cắt ngang và theo dõi dọc cho kết quả khác nhau (… Singh-Manoux … Salthouse, 2019 …) — cuộc tranh luận vẫn tiếp diễn." Lý do: Câu cũ không có nguồn; câu mới nêu nguyên nhân khác biệt theo từng nguồn. Review (Claude Opus 5.5, 10/11/2026): Nhãn Đang tranh cãi đạt thước đo (hai nguồn chất lượng cao khác chiều; tóm tắt Singh-Manoux 2012 đọc lại: "Cognitive decline is already evident in middle age (age 45-49)"; Salthouse 2019 toàn văn: số liệu dọc bị hiệu ứng quen bài làm lệch "at least up until about age 65").'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC3607395/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3281313/" ]
    luot_2_ghi_chu: Hai nguồn tốt mâu thuẫn; nhãn 'Đang tranh cãi' phù hợp.
    review: dung
  - id: n46
    cau: Nhóm Seattle kết luận suy giảm trung bình đáng tin cậy chưa xuất hiện trước 60; Singh-Manoux và cộng sự (2012, Whitehall II) cho rằng suy giảm nhỏ nhưng có ý nghĩa đã bắt đầu từ khoảng 45 tuổi.
    loai: phat-hien
    nguon:
      - schaie2010
      - singh2012
    trich: Cognitive decline is already evident in middle age (age 45-49).
    vi_tri: Singh-Manoux (2012), tóm tắt, Conclusions; Schaie & Willis (2010)
    ket_qua: dung
    ghi_chu: 'Whitehall II: 5.198 nam và 2.192 nữ, 45–70 tuổi, đo ba lần trong 10 năm; "nhỏ" theo mức giảm vài đến chục phần trăm của khoảng điểm.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC3607395/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3281313/" ]
    luot_2_ghi_chu: Singh-Manoux 2012 đúng là Whitehall II, BMJ.
  - id: n47
    cau: 'Nhãn "Đã bị bác bỏ": "già thì lẫn" — tuổi già đồng nghĩa với sa sút trí tuệ.'
    loai: nhan
    nhan: bac-bo
    co_so:
      - who2026
      - nhs
    ly_do: Theo văn bản chính thức của WHO ("not an inevitable part of ageing") và NHS ("not a natural part of ageing"). Đây là nhãn cho một niềm tin phổ biến, xét theo đồng thuận của văn bản chính thức chứ không theo phân tích tổng hợp; không có phân tích tổng hợp nào đã mở thử "già là lẫn".
    nguon:
      - who2026
      - nhs
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đa số người cao tuổi không bị sa sút trí tuệ; lão hóa nhận thức bình thường và sa sút trí tuệ là hai chuyện khác nhau về bản chất, không chỉ khác nhau về mức độ. … kỳ thị người cao tuổi còn minh mẫn." Chữ mới: "Sa sút trí tuệ không phải hệ quả tất yếu của tuổi già: WHO viết… Lão hóa nhận thức thông thường và sa sút trí tuệ khác nhau, dù giữa hai bên còn một vùng trung gian là suy giảm nhận thức nhẹ (NHS)… định kiến và thiếu hiểu biết là rào cản đối với việc chẩn đoán và chăm sóc (WHO)". Lý do: Bỏ "đa số" (không có tỉ lệ), "khác về bản chất" (NHS nêu vùng trung gian MCI), "kỳ thị người cao tuổi còn minh mẫn" (không có nguồn). Review (Claude Opus 5.5, 10/11/2026): Nhãn Đã bị bác bỏ cho mệnh đề "tuổi già đồng nghĩa với sa sút trí tuệ": WHO và NHS (đọc lại) nói rõ không tất yếu; SLS thêm bằng chứng trực tiếp: ở tuổi 81 chưa đến một nửa số người có suy giảm đáng tin cậy trong 7 năm (Schaie & Willis 2010). Đạt thước đo.'
    luot_2: dung
    luot_2_nguon: [ "https://www.who.int/news-room/fact-sheets/detail/dementia", "https://www.nhs.uk/conditions/dementia/symptoms/" ]
    review: dung
