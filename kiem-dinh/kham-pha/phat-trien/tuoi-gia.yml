  - id: n12
    cau: 'SLS đo năm năng lực trí tuệ cơ bản: hiểu nghĩa từ, định hướng không gian, suy luận quy nạp, tính toán số học, trôi chảy từ ngữ.'
    loai: phat-hien
    nguon:
      - gerstorf2011
    trich: five subtests from the 1948 PMA 11-17 version of Thurstone’s Primary Mental Abilities Test … Spatial Orientation … Inductive … Word fluency … Number … Verbal Meaning
    vi_tri: Gerstorf (2011), Measures
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC3134559/" ]
  - id: n13
    cau: Nhìn chung, trước 60 tuổi chưa thấy suy giảm trung bình đáng tin cậy ở các năng lực SLS đo, nhưng đến 74 tuổi suy giảm đáng tin cậy xuất hiện ở mọi năng lực.
    loai: phat-hien
    nguon:
      - schaie2010
    trich: We have generally shown that reliably replicable average age decrements in psychometric abilities do not occur prior to age 60, but that such reliable decrement can be found for all abilities by 74 years of age.
    vi_tri: Schaie & Willis (2010), mục "At What Age Is There a Reliably Detectable Decrement in Ability, and What Is Its Magnitude?"
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Kết quả tổng kết của chính nhóm nghiên cứu rất đáng nhớ: trước 60 tuổi, chưa thấy mức suy giảm trung bình nào đáng tin cậy…; nhưng đến 74 tuổi, suy giảm đáng tin cậy xuất hiện ở mọi năng lực. Nói cách khác, suy giảm nhận thức bắt đầu từ thập niên 60…" Chữ mới: "…nhìn chung, trước 60 tuổi chưa thấy… nhưng đến 74 tuổi…; các phân tích gần đây hơn của nhóm thấy suy giảm nhỏ nhưng có ý nghĩa thống kê ở một số thế hệ từ thập niên 50 tuổi." Lý do: Bỏ "bắt đầu từ thập niên 60" và thêm ngoại lệ chính nhóm nêu (n14). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Đọc lại toàn văn Schaie & Willis 2010 (PMC3607395): câu trích nguyên văn.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC3607395/" ]
    review: dung
  - id: n14
    cau: Các phân tích gần đây của nhóm Seattle thấy suy giảm nhỏ nhưng có ý nghĩa thống kê ở một số (không phải mọi) thế hệ từ thập niên 50 tuổi.
    loai: phat-hien
    nguon:
      - schaie2010
    trich: Analyses from the most recent phases of the SLS, however, suggested that small but statistically significant average decrement can be found for some, but not all, cohorts beginning in the sixth decade.
    vi_tri: Schaie & Willis (2010), cùng mục với n13
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC3607395/" ]
  - id: n15
    cau: Ngay ở tuổi 81, chưa đến một nửa số người có suy giảm đáng tin cậy trong 7 năm trước đó.
    loai: so-lieu
    nguon:
      - schaie2010
    trich: even at age 81, fewer than half of all observed individuals have shown reliable decremental change over the preceding 7 years.
    vi_tri: Schaie & Willis (2010), cùng mục
    ket_qua: dung
