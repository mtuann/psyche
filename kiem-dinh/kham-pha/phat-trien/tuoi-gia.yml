    cau: SLS có gần 6.000 người tham gia, đo lặp lại mỗi 7 năm.
    loai: so-lieu
    nguon:
      - gerstorf2011
    trich: The SLS is a cohort-sequential study that has collected data on close to 6,000 participants between the ages of 22 and 101 years. … Data have been collected at 7-year intervals since 1956.
    vi_tri: Gerstorf (2011), Participants and Procedure
    ket_qua: dung
