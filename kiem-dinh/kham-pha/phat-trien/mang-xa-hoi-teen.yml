  - id: n1
    cau: 'Mô tả: tranh luận Haidt (2024) và Orben & Przybylski (2019), hiệu ứng lên sức khỏe tâm thần teen, tương quan có phải nhân quả, dữ liệu CDC YRBS, và số liệu quốc gia của Việt Nam.'
    loai: phat-hien
    nguon:
      - orben2019
      - cdc1323
      - namhs-lancet2024
    trich: The association we find between digital technology use and adolescent well-being is negative but small, explaining at most 0.4% of the variation in well-being.
    vi_tri: Orben & Przybylski (2019), tóm tắt; CDC 2024; NAMHS 2024
    ket_qua: da-sua
    ghi_chu: 'Mô tả khớp nội dung trang sau khi sửa. Chữ cũ: "…và dữ liệu CDC YRBS nói gì." Chữ mới: "…dữ liệu CDC YRBS nói gì, và số liệu quốc gia của Việt Nam." Lý do: Trang nay có số liệu NAMHS (Việt Nam). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nature.com/articles/d41586-024-00902-2", "https://europepmc.org/article/MED/30944443", "https://pmc.ncbi.nlm.nih.gov/articles/PMC11559676/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC12312254/" ]
    luot_2_ghi_chu: Các thành phần đều có nguồn đã mở.
    review: dung
  - id: n2
    cau: Ở Mỹ, tỉ lệ teen báo cáo buồn bã dai dẳng đã tăng rõ trong thập kỷ 2010 (số liệu khảo sát đại diện quốc gia); câu hỏi là mạng xã hội có phải thủ phạm không (câu trả lời của mục "Tự trải nghiệm", An là ví dụ giả định).
