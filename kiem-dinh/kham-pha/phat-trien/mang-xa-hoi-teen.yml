    luot_2_ghi_chu: Các bài NAMHS đã mở không thấy dữ liệu mạng xã hội trong tóm tắt.
    review: dung
  - id: n52
    cau: 'Dam và cộng sự (2023): khảo sát trực tuyến 1.891 người tham gia ở Hà Nội, Tuyên Quang, Cần Thơ (9–10/2021; tuổi trung bình 17); 98,4% dùng mạng xã hội; FOMO càng cao thì PHQ-9 càng cao; FOMO và dùng Internet có vấn đề đi kèm tự hại/tự tử.'
    loai: so-lieu
    nguon:
      - dam2023
    trich: An online cross-sectional study was conducted in three cities in Vietnam (Hanoi, Tuyen Quang, and Can Tho) from September through to October 2021. … 1891 participants were recruited, with 98.4% having access to social media. … "FOMO score" and "self-harm and suicide" were positive factors of the PHQ-9 score … In terms of self-harm and suicide, "FOMO score" and "Problematic Internet use" were positive factors
    vi_tri: Dam (2023), Abstract và Results (tuổi TB 17,0, SD 2,8)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…khảo sát trực tuyến 1.891 vị thành niên ở Hà Nội, Tuyên Quang và Cần Thơ…: FOMO và việc dùng Internet có vấn đề cùng đi kèm nguy cơ tự hại/tự tử cao hơn." Chữ mới: "…khảo sát trực tuyến 1.891 người tham gia… (tháng 9–10/2021; tuổi trung bình 17)… đi kèm với tự hại/tự tử." Lý do: "Vị thành niên" → "người tham gia" (tuổi trung bình 17, SD 2,8); bỏ "nguy cơ cao hơn" (nguồn nói "yếu tố dương"). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC10246797/" ]
    review: dung
