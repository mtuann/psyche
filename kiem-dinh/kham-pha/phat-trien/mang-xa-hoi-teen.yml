  - id: n50
    cau: 'Việt Nam có khảo sát quốc gia riêng (NAMHS 2021): 5.996 hộ gia đình, 10–17 tuổi, phỏng vấn chẩn đoán; tỉ lệ có một trong sáu rối loạn tâm thần trong 12 tháng là 3,3% ở Việt Nam (12,1% Kenya; 5,5% Indonesia); ý nghĩ tự tử 12 tháng khoảng 1,4% (KTC 1,0–1,9%), cố tự tử khoảng 0,2% (0,1–0,3%).'
    loai: so-lieu
    nguon:
      - namhs-lancet2024
    trich: Prevalence of any mental disorder in the past 12 months was 12·1% (95% CI 10·9-13·5) in Kenya, 5·5% (4·3-6·9) in Indonesia, and 3·3% (2·7-4·1) in Viet Nam. … suicide ideation ranging from 1·4% in Indonesia (1·0-2·0) and Viet Nam (1·0-1·9) … suicide attempts ranging from 0·2% in Indonesia (0·1-0·4) and Viet Nam (0·1-0·3)
    vi_tri: Lancet (2024), tóm tắt, Findings
    ket_qua: da-sua
    ghi_chu: 'Câu mới thêm. Số "5.996 hộ" theo tóm tắt (Viet Nam). Ý nghĩ tự tử 1,4% là con số chung ghi cho Indonesia và Việt Nam trong tóm tắt (KTC khác nhau); số cố tự tử 0,2% cũng vậy. Chữ cũ: "Chưa có khảo sát quy mô quốc gia kiểu YRBS cho teen Việt Nam". Chữ mới: "Việt Nam có các khảo sát quốc gia riêng, đo khác nên không so trực tiếp được: NAMHS (2021…)". Lý do: Sai: có khảo sát quốc gia (NAMHS 2021; cũng GSHS Việt Nam 2019 theo một nghiên cứu về bạo lực học đường, chưa dùng trên trang). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Tóm tắt NAMHS (Lancet 2024) đọc lại trên Europe PMC: "suicide ideation ranging from 1·4% in Indonesia (1·0-2·0) and Viet Nam (1·0-1·9)… suicide attempts ranging from 0·2% in Indonesia (0·1-0·4) and Viet Nam (0·1-0·3)"; 5996 households; 3·3% (2·7-4·1). Lượt 2 không chắc vì không mở được; nay đã giải quyết. Số có khung "trong 12 tháng".'
    luot_2: khong-chac
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC12312253/" ]
    luot_2_ghi_chu: Xác nhận 5.996 hộ, 10-17 tuổi, 3,3% (12,1% Kenya; 5,5% Indonesia). Không tìm thấy trong nguồn mở nào 'ý nghĩ tự tử 12 tháng ~1,4% (KTC 1,0-1,9)' và 'cố tự tử ~0,2% (0,1-0,3)'; bài Lancet 2024 của NAMHS không mở được.
    review: dung
