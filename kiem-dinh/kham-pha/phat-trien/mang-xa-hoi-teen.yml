  - id: n15
    cau: YRBS 2021 và các đợt trước không hỏi về mạng xã hội; đợt 2023 mới thêm câu hỏi về tần suất dùng.
    loai: cong-cu
    nguon:
      - mmwr2023
    trich: '"These new questions assessed social media use" (MMWR su7304a1, danh sách chủ đề mới của 2023)'
    vi_tri: MMWR su7304a1 (Introduction)
    ket_qua: da-sua
    ghi_chu: '"Các đợt trước không hỏi" suy ra từ "new questions" của 2023; chưa đọc bảng câu hỏi các đợt trước. Chỗ chưa chắc nhỏ. Chữ cũ: "Lưu ý quan trọng: YRBS không hỏi gì về mạng xã hội" và "YRBS không đo việc dùng mạng xã hội". Chữ mới: "YRBS 2021 và các đợt trước không hỏi gì về nó; riêng đợt 2023 mới thêm câu hỏi về tần suất dùng". Lý do: Sai với 2023: CDC đã thêm câu hỏi về mạng xã hội. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC11559676/" ]
    review: dung
  - id: n16
    cau: 'YRBS 2023 (MMWR 2024): buồn bã dai dẳng 42,6% ở nhóm dùng mạng xã hội nhiều lần mỗi ngày so với 31,9% ở nhóm dùng ít hơn; đây là liên hệ cắt ngang.'
    loai: so-lieu
    nguon:
      - mmwr2023
    trich: 'Persistent sadness or hopelessness (Table 4 and Table 5): Overall: 42.6% of frequent users vs. 31.9% of less frequent users. [theo kết quả đọc trang su7304a3]'
    vi_tri: MMWR su7304a3, Bảng 4
    ket_qua: dung
    ghi_chu: Câu mới thêm; số theo công cụ đọc web, "frequent" = nhiều lần mỗi ngày trở lên.
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC11559676/" ]
  - id: n17
    cau: Dữ liệu 2021 thu thập mùa thu 2021, giữa đại dịch; các chỉ số như buồn bã dai dẳng đã tăng từ 30% (2013) lên 37% (2019) trước 2021.
    loai: so-lieu
    nguon:
      - mmwr2023
      - cdc1323
    trich: Experienced persistent feelings of sadness or hopelessness 30 30 31 37 42 40 (2013, 2015, 2017, 2019, 2021, 2023); the previous YRBS "was not administered until fall 2021 because of the COVID-19 pandemic."
    vi_tri: CDC (2024), Progress at a glance; MMWR su7304a1
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…nhưng CDC nhấn mạnh nhiều chỉ số đã xấu đi từ trước COVID." Chữ mới: "…báo cáo của CDC nêu nhiều chỉ số xấu đi từ 2013 đến 2023, và ở nhiều chỉ số (như buồn bã dai dẳng) số liệu đã tăng từ trước 2021 (30% năm 2013, 37% năm 2019)." Lý do: CDC không "nhấn mạnh" trước COVID; câu mới dựa trên số liệu bảng. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cdc.gov/yrbs/dstr/pdf/YRBS_Data-Summary-Trends_Report2023_508.pdf", "https://www.cdc.gov/yrbs/dstr/pdf/YRBS-2023-Data-Summary-Trend-Report.pdf" ]
    review: dung
  - id: n18
    cau: 'Orben & Przybylski (2019): phân tích đường cong đặc tả trên ba bộ dữ liệu (Monitoring the Future, YRBS, Millennium Cohort Study), 355.358 vị thành niên (chủ yếu 12–18 tuổi), khảo sát 2007–2016.'
    loai: so-lieu
    nguon:
      - orben2019
    trich: This paper’s analysis pipeline spans three nationally-representative datasets from the US and the UK … encompassing a total of 355,358, predominately 12 to 18-year-old, adolescents surveyed between the years of 2007 and 2016.
    vi_tri: Orben & Przybylski (2019), Methods (AAM)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…tổng cộng 355.358 vị thành niên, dữ liệu 2007–2016. … chạy mọi đặc tả phân tích hợp lý và báo cáo toàn bộ". Chữ mới: "…355.358 vị thành niên (chủ yếu 12–18 tuổi), khảo sát trong các năm 2007–2016… chạy nhiều đặc tả phân tích hợp lý và báo cáo kết quả". Lý do: "Mọi" và "toàn bộ" mạnh hơn nguồn (nguồn nói SCA áp dụng cho các đặc tả hợp lý). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Review đọc toàn văn bản tác giả Orben & Przybylski 2019 (Oxford ORA, uuid:5d844350…, tải PDF 10/11/2026): "three nationally-representative datasets from the US and the UK… a total of 355,358, predominately 12 to 18-year-old, adolescents surveyed between the years of 2007 and 2016". Lượt 2 không chắc vì không mở được toàn văn; nay đã giải quyết.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/30944443", "https://pmc.ncbi.nlm.nih.gov/articles/PMC10117262/" ]
    luot_2_ghi_chu: Xác nhận được ba bộ dữ liệu (MTF, YRBS, MCS) và n = 355.358; khoảng tuổi 12-18 và năm khảo sát 2007-2016 nằm trong toàn văn sau tường phí, không mở được.
    review: dung
  - id: n19
    cau: 'Liên hệ giữa dùng công nghệ số và sức khỏe tinh thần là âm nhưng rất nhỏ: giải thích tối đa 0,4% phương sai; tác giả kết luận hiệu ứng quá nhỏ để biện minh cho thay đổi chính sách.'
    loai: phat-hien
    nguon:
      - orben2019
    trich: The association we find between digital technology use and adolescent well-being is negative but small, explaining at most 0.4% of the variation in well-being. Taking the broader context of the data into account suggests that these effects are too small to warrant policy change.
    vi_tri: Orben & Przybylski (2019), tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/30944443" ]
  - id: n20
    cau: 'Trong cùng bộ dữ liệu, ăn khoai tây cho liên hệ nhỏ gần bằng công nghệ số (YRBS: β −0,042 so với −0,049) và đeo kính còn "tệ hơn" ở một bộ dữ liệu.'
    loai: so-lieu
    nguon:
      - orben2019
    trich: There is a smaller negative association for eating potatoes (median β = -.042 …); … wearing glasses (median β = -.061, median n = 7,963 …) [bộ MCS]; … technology use (median β = -.049) [YRBS]
    vi_tri: Orben & Przybylski (2019), Results (so sánh ở YRBS và MCS)
    ket_qua: da-sua
    ghi_chu: 'Hệ số của kính: so ở bộ dữ liệu MCS (−0,061, so với hệ số công nghệ của bộ đó; chưa đối chiếu số của MCS), nên chỉ ghi "ở một bộ dữ liệu". Bản tin OII nói glasses "worse association". Chữ cũ: "…tương đương với... ăn khoai tây; đeo kính cận còn "có hại" hơn." và "ăn khoai tây thường xuyên cho liên hệ tương đương, đeo kính cận còn tệ hơn". Chữ mới: "…ăn khoai tây cho liên hệ nhỏ tương tự và đeo kính còn "tệ hơn"." và "(ở YRBS, β −0,042 so với −0,049 của công nghệ số), đeo kính còn "tệ hơn" ở một bộ dữ liệu". Lý do: "Tương đương" thành "gần bằng" kèm số; "kính cận" thành "kính" (nguồn: wearing glasses). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Review đọc toàn văn bản tác giả Orben & Przybylski 2019 (Oxford ORA, uuid:5d844350…, tải PDF 10/11/2026): YRBS: công nghệ β −0,049, khoai tây −0,042; Thảo luận: "potatoes was nearly as negative as the association with technology use (0.9x, YRBS) and wearing glasses was more negatively associated with well-being (1.5x, MCS)". Đã giải quyết.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/30944443" ]
    luot_2_ghi_chu: "'Khoai tây' và 'đeo kính' có thật như phép so sánh của Orben & Przybylski (nhắc lại trong PMC9893300, PMC10132652) nhưng β cụ thể (-0,042 so với -0,049) nằm trong toàn văn sau tường phí, không mở được."
    review: dung
  - id: n21
    cau: Trong bộ YRBS, bị bắt nạt có liên hệ tiêu cực với sức khỏe tinh thần gấp 4,3 lần và hút cần sa gấp 2,7 lần so với mức liên hệ của công nghệ số; ngủ đủ và ăn sáng có liên hệ tích cực hơn hẳn.
    loai: so-lieu
    nguon:
      - orben2019
    trich: the association of mean technology use with well-being (median β = -.049) was exceeded by well-being’s association with being bullied (median β = -.212 …) … smoking marijuana (median β = -.132 …) … eating breakfast (median β = .116 …) and getting enough sleep (median β = .150 …)
    vi_tri: 'Orben & Przybylski (2019), Results, đoạn YRBS; OII press release: "2.7 times and 4.3 times"'
    ket_qua: da-sua
    ghi_chu: 'Tỉ lệ 4,3 = 0,212/0,049; 2,7 = 0,132/0,049 (tính lại). Hệ số của giấc ngủ và ăn sáng dương. Chữ cũ: "bị bắt nạt có liên hệ tiêu cực gấp 4,3 lần, hút cần sa gấp 2,7 lần" (không nêu so với cái gì, bộ dữ liệu nào). Chữ mới: "…(trong bộ YRBS) bị bắt nạt có liên hệ tiêu cực với sức khỏe tinh thần gấp 4,3 lần và hút cần sa gấp 2,7 lần so với mức liên hệ của công nghệ số". Lý do: Nêu rõ mẫu số và bộ dữ liệu. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Review đọc toàn văn bản tác giả Orben & Przybylski 2019 (Oxford ORA, uuid:5d844350…, tải PDF 10/11/2026): "smoking marijuana and bullying have much larger negative associations… (2.7x and 4.3x respectively for YRBS)"; ngủ đủ β 0,150, ăn sáng 0,116. Đã giải quyết.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/30944443" ]
    luot_2_ghi_chu: Tỉ số 4,3 lần (bị bắt nạt) và 2,7 lần (cần sa) so với công nghệ số, cùng 'ngủ đủ, ăn sáng', nằm trong toàn văn Orben & Przybylski 2019 sau tường phí; không mở được.
    review: dung
  - id: n22
    cau: 'Hạn chế: dữ liệu 2007–2016, trước kỷ nguyên TikTok và video ngắn, nên có thể khác với việc dùng mạng xã hội hiện nay (hạn chế do chúng tôi nêu).'
    loai: phat-hien
    nguon:
      - orben2019
    trich: adolescents surveyed between the years of 2007 and 2016
    vi_tri: Orben & Przybylski (2019), Methods
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "…phe phê bình cho rằng "mạng xã hội 2024" khác hẳn "màn hình 2012"." Chữ mới: "…nên có thể khác với việc dùng mạng xã hội hiện nay (đây là hạn chế do chúng tôi nêu, không phải kết quả của nghiên cứu)." Lý do: Không có nguồn đã mở nói phe phê bình đã nói vậy; giữ như suy luận của trang, ghi rõ. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Review đọc toàn văn bản tác giả Orben & Przybylski 2019 (Oxford ORA, uuid:5d844350…, tải PDF 10/11/2026): năm khảo sát 2007–2016 xác nhận; vế "trước kỷ nguyên TikTok" ghi rõ là suy luận của trang.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/30944443" ]
    luot_2_ghi_chu: Năm khảo sát 2007-2016 của Orben & Przybylski nằm trong toàn văn sau tường phí, không mở được; 'trước kỷ nguyên TikTok' là suy luận của trang.
    review: dung
  - id: n23
    cau: 'Orben, Dienlin & Przybylski (2019): dữ liệu dọc Understanding Society (Anh, 2009–2016), hơn 12.000 teen 10–15 tuổi (12.672), phân tích tách giữa người và trong cùng người.'
    loai: so-lieu
    nguon:
      - orben-dienlin2019
    trich: an eight-wave, large-scale, and nationally representative panel dataset (Understanding Society, the UK Household Longitudinal Study, 2009–2016) … While 12,672 10- to 15-y-olds took part, the precise number of participants for any analysis varied (range, n = 539 to 5,492; median, n = 1,699).
    vi_tri: Orben (2019, PNAS), Results và Methods
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…theo dõi khoảng 12.000 teen qua nhiều năm". Chữ mới: "…(Anh, 2009–2016) — hơn 12.000 teen 10–15 tuổi tham gia (số người trong mỗi phân tích ít hơn nhiều)…". Lý do: 12.672 tham gia nhưng mỗi phân tích có n = 539–5.492. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6534991/" ]
    luot_2_ghi_chu: Phân tích tách giữa người và trong cùng người là random-intercept cross-lagged.
    review: dung
  - id: n24
    cau: 'Hiệu ứng nhỏ, hai chiều và "tầm thường": dùng mạng xã hội nhiều dự báo hài lòng cuộc sống giảm nhẹ (β −0,04 đến −0,09 ở các mục có ý nghĩa; hệ số trung vị −0,05), hài lòng giảm dự báo dùng nhiều hơn (−0,02); ở nữ rõ hơn ở nam.'
    loai: phat-hien
    nguon:
      - orben-dienlin2019
    trich: Both median longitudinal effects were trivial in size (social media predicting life satisfaction, β = −0.05; life satisfaction predicting social media use, β = −0.02). … For females, however, social media was a predictor of slightly decreased life satisfaction across all domains, except satisfaction with appearance (b = −0.13 to −0.05 or β = −0.09 to −0.04)
    vi_tri: Orben (2019, PNAS), Results (Fig. 1–2)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…(β từ -0,04 đến -0,09), nhưng chiều ngược lại cũng đúng… Hiệu ứng ở nữ hơi rõ hơn nam, nhưng vẫn nhỏ". Chữ mới: "…(β từ -0,04 đến -0,09 ở các mục hài lòng có ý nghĩa; hệ số trung vị -0,05)… (hệ số trung vị -0,02). Hiệu ứng ở nữ hơi rõ hơn nam (nữ có tác động ở hầu hết các mục hài lòng, nam chỉ ở hai)". Lý do: Thêm hệ số trung vị và mô tả sự khác biệt giới theo nguồn. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6534991/" ]
    luot_2_ghi_chu: "Tiêu đề bài PNAS 2019: 'Social media's enduring effect on adolescent life satisfaction'."
    review: dung
  - id: n25
    cau: '(Đã bỏ) Przybylski: 99,75% mức hài lòng của một teen trong một năm không liên quan đến việc họ dùng mạng xã hội nhiều hay ít.'
    loai: so-lieu
    ket_qua: da-bo
    ghi_chu: 'Con số từ lời phát biểu, không có trong bài đã mở (PNAS). Chữ cũ: "Nói như Przybylski: 99,75% mức hài lòng… không liên quan…". Chữ mới: (bỏ) Lý do: Không kiểm được. Review (Claude Opus 5.5, 10/11/2026): Đã kiểm: trang không còn "99,75%".'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu đã bỏ khỏi trang; không qua lượt 2.
    review: dung
  - id: n26
    cau: 'Orben và cộng sự (2022): 84.011 người Anh 10–80 tuổi (cắt ngang) và 17.409 người 10–21 tuổi theo dõi dọc, tìm độ tuổi mà dùng mạng xã hội nhiều dự báo hài lòng giảm một năm sau.'
    loai: so-lieu
    nguon:
      - orben2022
    trich: Our analyses of two UK datasets comprising 84,011 participants (10-80 years old) … Longitudinal analyses of 17,409 participants (10-21 years old) suggest distinct developmental windows of sensitivity to social media in adolescence
    vi_tri: Orben (2022), tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC8960761/" ]
  - id: n27
    cau: 'Các cửa sổ nhạy cảm: nữ 11–13 tuổi, nam 14–15 tuổi, và 19 tuổi ở cả hai giới; hệ số nhỏ (β −0,07 đến −0,13); chiều ngược lại (hài lòng thấp → dùng nhiều) cũng tồn tại, không gắn với tuổi hay giới.'
    loai: phat-hien
    nguon:
      - orben2022
    trich: These windows occur at different ages for males (14-15 and 19 years old) and females (11-13 and 19 years old). Decreases in life satisfaction ratings also predicted subsequent increases in estimated social media use, however, these were not associated with age or sex.
    vi_tri: Orben (2022), tóm tắt; Results (age 11 β = −0,09; age 12 −0,12; age 13 −0,07; age 14 −0,10; age 15 −0,12; age 19 nữ −0,13)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC8960761/" ]
  - id: n28
    cau: Các tác giả suy đoán cửa sổ sớm có thể liên quan đến dậy thì (nữ dậy thì sớm hơn nam), nhưng dữ liệu không đo dậy thì nên chưa kiểm được.
    loai: phat-hien
    nguon:
      - orben2022
    trich: Speculatively, the sex difference in timing suggested that early increases in sensitivity to social media might be due to maturational processes such as puberty … these explanations cannot be tested directly in this dataset
    vi_tri: Orben (2022), Discussion
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…trùng với thời điểm dậy thì (nữ dậy thì sớm hơn nam)." Chữ mới: "Các tác giả suy đoán rằng cửa sổ sớm có thể liên quan đến dậy thì… nhưng dữ liệu không đo dậy thì nên chưa kiểm được." Lý do: Nguồn nêu là suy đoán ("speculatively"). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC8960761/" ]
    review: dung
  - id: n29
    cau: Hiệu ứng trung bình nhỏ không có nghĩa mọi teen đều như nhau — có các độ tuổi mà hiệu ứng rõ hơn một chút.
    loai: phat-hien
    nguon:
      - orben2022
    trich: distinct developmental windows of sensitivity to social media in adolescence
    vi_tri: Orben (2022), tóm tắt
    ket_qua: dung
    ghi_chu: Trang cũ viết "có nhóm tuổi dễ tổn thương hơn"; giữ vì "windows of sensitivity", nhưng "tổn thương" là cách diễn đạt của trang.
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC8960761/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6534991/" ]
  - id: n30
    cau: 'Nhãn "Khá vững": sức khỏe tâm thần tự báo cáo của teen Mỹ xấu đi rõ rệt trong thập kỷ 2010.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - cdc1121
      - cdc1323
      - cdc-yif2026
    ly_do: "Một hệ thống giám sát đại diện quốc gia (YRBS), nhiều đợt cùng chiều: buồn bã dai dẳng 28% (2011) → 42% (2021), nữ 36% → 57%. Nhưng chỉ một nguồn dữ liệu, một nước, chưa đối chiếu khảo sát quốc gia khác hay phân tích tổng hợp, và là tự báo cáo triệu chứng. Theo mục 4: Khá vững (Vững chắc đòi tổng hợp hay hai tái lập lớn và nhiều quần thể)."
    nguon:
      - cdc1121
      - cdc1323
      - cdc-yif2026
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó: thước đo nhãn dựa trên phân tích tổng hợp, ở đây không có; dùng khảo sát giám sát lặp lại. Chữ cũ: "…khủng hoảng là có thật, không phải ảo giác truyền thông." và tiêu đề "sức khỏe tâm thần của teen (Mỹ) xấu đi rõ rệt trong thập kỷ 2010". Chữ mới: "…mức tự báo cáo tăng là có thật, nhưng đó là tự báo cáo triệu chứng, không phải chẩn đoán, và nó chỉ nói về teen Mỹ." Số liệu thêm 2025: 33%. Lý do: Bỏ "khủng hoảng" và "ảo giác truyền thông" (cách nói mạnh); thêm giới hạn và số 2025. Review (Claude Opus 5.5, 10/11/2026): Lượt 1 nêu là chỗ khó; lời giao yêu cầu xem lại. Dữ liệu giám sát lặp lại của một hệ thống không thay được phân tích tổng hợp, và khung tự nói "chỉ nói về teen Mỹ" (không đạt "nhiều quần thể"). Hạ xuống Khá vững, thân khung nêu lý do; tiêu đề mục YRBS bỏ chữ "khủng hoảng là có thật" (giữ id cũ); doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cdc.gov/yrbs/dstr/pdf/YRBS_Data-Summary-Trends_Report2023_508.pdf", "https://www.cdc.gov/yrbs/dstr/pdf/YRBS-2023-Data-Summary-Trend-Report.pdf" ]
    luot_2_ghi_chu: Chỉ mở được YRBS của CDC (không phải phân tích tổng hợp); xu hướng tương tự nêu bởi Haidt/NSDUH chưa kiểm. Nhãn 'Vững chắc' dựa trên lặp lại ở nhiều khảo sát quốc gia; lượt 2 đã xác nhận phần YRBS.
    review: sai
  - id: n31
    cau: 'Nhãn "Khá vững": ở cấp độ cá nhân, thời gian dùng công nghệ chỉ liên hệ yếu với sức khỏe tinh thần.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - orben2019
      - orben-dienlin2019
      - orben2022
      - teague2026
    ly_do: 'Nhiều nghiên cứu lớn cùng chiều: tối đa 0,4% phương sai (355.358 teen; Orben & Przybylski 2019), β dọc −0,04 đến −0,13 và hai chiều (Orben và cộng sự 2019, 2022), phân tích tổng hợp 2026 trên 153 nghiên cứu dọc: r = 0,09–0,21 cho trầm cảm, hành vi, ý nghĩ tự hại. Nhưng đo bằng ước lượng tự báo cáo thô, kết quả khác nhau theo phân tích (0,4% phương sai tương ứng r khoảng 0,06, nhỏ hơn r 0,09–0,21), chủ yếu mẫu phương Tây, thiếu thực nghiệm. Khá vững.'
    nguon:
      - orben2019
      - orben-dienlin2019
      - orben2022
      - teague2026
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nghiên cứu lớn nhất… cho tối đa 0,4% phương sai; các nghiên cứu dọc cho hệ số β khoảng -0,04 đến -0,13… Lưu ý: … dữ liệu chủ yếu từ trước kỷ nguyên video ngắn." Chữ mới: "…Một phân tích tổng hợp 2026 trên 153 nghiên cứu dọc… thấy mạng xã hội liên hệ nhất quán nhưng khiêm tốn… (r = 0,09–0,21)… phần lớn dữ liệu từ trước kỷ nguyên video ngắn." Lý do: Thêm phân tích tổng hợp 2026 (nguồn bắt buộc của lời giao: các phân tích tổng hợp mới). Review (Claude Opus 5.5, 10/11/2026): Nhãn Khá vững đạt thước đo. Review đọc toàn văn bản tác giả Orben & Przybylski 2019 (Oxford ORA, uuid:5d844350…, tải PDF 10/11/2026): 0,4% xác nhận. Thân khung đã sửa chữ "khiêm tốn" (n32).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/30944443", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6534991/", "https://europepmc.org/article/MED/41801211" ]
    luot_2_ghi_chu: Nhãn 'Khá vững' không cao hơn thước đo.
    review: dung
  - id: n32
    cau: 'Teague và cộng sự (2026, JAMA Pediatrics): phân tích tổng hợp 153 nghiên cứu dọc (115 nhóm, 1.072 cỡ hiệu ứng, đăng ký trước PROSPERO); mạng xã hội liên hệ với trầm cảm, vấn đề hành vi, ý nghĩ tự hại và dùng chất (r = 0,09–0,21), thành tích học tập và tự nhận thức kém hơn (r = −0,07 đến −0,14); các tác giả kết luận dùng phương tiện số "liên hệ nhất quán với rủi ro".'
    loai: so-lieu
    nguon:
      - teague2026
    trich: Social media use was associated with higher depression, externalizing and internalizing behaviors, self-injurious thoughts, problematic internet use, and substance use (r = 0.09 … to r = 0.21 …) and also with lower academic achievement, poorer self-perception, and less positive development (r = -0.14 … to r = -0.07 …). … digital media use was consistently associated with risks to child and adolescent health and development, particularly for social media.
    vi_tri: Teague (2026), Abstract/Results
    ket_qua: da-sua
    ghi_chu: 'Câu mới thêm ở lượt 1; review sửa chữ "khiêm tốn". Review (Claude Opus 5.5, 10/11/2026): Lượt 2 không chắc đúng chỗ: tóm tắt (Europe PMC, đọc 10/11/2026) không nói "khiêm tốn". Trang sửa thành "ở mức nhỏ (r = 0,09–0,21)", link nguồn đổi sang DOI; doi_chu.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/41801211" ]
    luot_2_ghi_chu: Các con số và đăng ký trước PROSPERO khớp tóm tắt (JAMA Pediatrics, 2026). Tóm tắt kết luận 'consistently associated with risks'; chữ 'các tác giả nêu liên hệ khiêm tốn' không có trong tóm tắt, toàn văn sau tường phí.
    review: sai
  - id: n33
    cau: 'Nhãn "Đang tranh cãi": mạng xã hội có phải nguyên nhân chính của khủng hoảng không; Haidt (2024) cho rằng có; các nhà nghiên cứu như Odgers phản biện; Tổng Y sĩ Mỹ (2023) khuyến cáo thận trọng.'
    loai: nhan
    nhan: tranh-cai
    co_so:
      - orben2019
      - orben2022
      - teague2026
      - odgers2024
      - sg2023
    ly_do: 'Bằng chứng chất lượng cao không thống nhất về chỗ đáng kể nhất: hiệu ứng trung bình nhỏ và hai chiều (Orben và cộng sự), phân tích tổng hợp 2026 thấy liên hệ nhất quán nhưng khiêm tốn, trong khi Haidt cho rằng nhân quả; chưa có can thiệp thực nghiệm đủ mạnh. Odgers và Surgeon General: chỉ đọc qua nguồn thứ cấp, chưa mở nguồn gốc (Nature bị chặn, hhs.gov 403). Nhãn tranh cãi cho phần nhân quả.'
    nguon:
      - orben2019
      - orben2022
      - teague2026
      - odgers2024
      - sg2023
    ket_qua: da-sua
    ghi_chu: 'Chỗ chưa chắc: vế Odgers và Surgeon General chỉ qua nguồn thứ cấp. Chữ cũ: "Haidt (2024) nói có, dựa trên trùng khớp thời điểm (~2012), cơ chế hợp lý (ngủ, so sánh, bắt nạt) và dữ liệu nhiều nước. Giới nghiên cứu chuyên sâu phản biện: … nhiều giải thích khác chưa loại trừ được (đại dịch, áp lực học tập, bất bình đẳng, lo âu khí hậu, thay đổi cách hỏi khảo sát)." Chữ mới: "Haidt (2024) cho rằng có. Các nhà nghiên cứu như Odgers (Nature, 2024) phản biện, theo các tóm tắt thứ cấp… Một phân tích tổng hợp 2026 thấy liên hệ nhỏ nhưng nhất quán, và nhóm Orben thấy hiệu ứng trung bình nhỏ và hai chiều." Lý do: Bỏ "dựa trên…" và danh sách giải thích khác (không kiểm được). Review (Claude Opus 5.5, 10/11/2026): Nhãn Đang tranh cãi đạt thước đo: bằng chứng tốt khác chiều về nhân quả. Nay đã mở được Odgers 2024 (nature.com) và khuyến cáo Surgeon General (bản lưu), thay nguồn Wikipedia trong co_so.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nature.com/articles/d41586-024-00902-2", "https://web.archive.org/web/2024if_/https://www.hhs.gov/sites/default/files/sg-youth-mental-health-social-media-advisory.pdf" ]
    luot_2_ghi_chu: Nhãn 'Đang tranh cãi' hợp lý.
    review: dung
  - id: n34
    cau: "Odgers (Nature, 2024, bài điểm sách): tìm kiếm các hiệu ứng lớn như Haidt gợi ý cho ra liên hệ không có, nhỏ hoặc lẫn lộn; khi thấy liên hệ theo thời gian thì chúng gợi ý teen đã có vấn đề sức khỏe tâm thần dùng mạng xã hội nhiều hơn."
    loai: phat-hien
    nguon:
      - odgers2024
    trich: Hundreds of researchers, myself included, have searched for the kind of large effects suggested by Haidt. Our efforts have produced a mix of no, small and mixed associations. Most data are correlative. When associations over time are found, they suggest not that social-media use predicts or causes depression, but that young people who already have mental-health problems use such platforms more
    vi_tri: Wikipedia (tóm tắt thứ cấp qua công cụ đọc web), mục Criticism
    ket_qua: da-lam-mem
    ghi_chu: 'Chỗ chưa chắc: Nature (doi 10.1038/d41586-024-00902-2) chuyển hướng đăng nhập, chưa mở; nguồn bậc 3. Lượt 2 nên tìm bản mở. Chữ cũ: "Giới nghiên cứu chuyên sâu phản biện: bằng chứng nhân quả còn yếu, hiệu ứng đo được nhỏ…" Chữ mới: "Các nhà nghiên cứu như Odgers (Nature, 2024) phản biện, theo các tóm tắt thứ cấp mà chúng tôi đọc được (chưa mở bản gốc): …" Lý do: Gán cho một người phản biện cụ thể với nguồn nói rõ thứ cấp; bỏ "giới nghiên cứu chuyên sâu" (không kiểm được). Review (Claude Opus 5.5, 10/11/2026): Review mở được bài của Odgers trên nature.com (10/11/2026): chữ cũ đúng ý nhưng ghi "theo tóm tắt thứ cấp"; đã viết lại theo bài gốc và thay nguồn Wikipedia; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.nature.com/articles/d41586-024-00902-2" ]
    luot_2_ghi_chu: Nature 29/3/2024 (book review), đã đọc trực tiếp, không phải tóm tắt thứ cấp.
    review: dung
  - id: n35
    cau: "Tổng Y sĩ Mỹ (2023) ra khuyến cáo thận trọng: mạng xã hội có thể có lợi cho một số teen nhưng cũng có dấu hiệu rủi ro gây hại, chưa đủ bằng chứng để nói nó đủ an toàn, và các công ty công nghệ cần chia sẻ dữ liệu cho nhà nghiên cứu độc lập."
    loai: phat-hien
    nguon:
      - sg2023
    trich: while social media may have benefits for some children and adolescents, there are ample indicators that social media can also have a profound risk of harm to the mental health and well-being of children and adolescents. At this time, we do not yet have enough evidence to determine if social media is sufficiently safe … Ensure technology companies share data … with independent researchers
    vi_tri: HHS (2023), Advisory (hhs.gov 403, không mở được)
    ket_qua: da-lam-mem
    ghi_chu: 'Chỗ chưa chắc: không mở được trang HHS (403); lượt 2 và review nên mở. Đã viết "theo trang của HHS, chúng tôi chỉ đọc được đoạn trích". Chữ cũ: "…ra khuyến cáo thận trọng: mạng xã hội có cả lợi và hại, cần thêm dữ liệu từ chính các công ty công nghệ." Chữ mới: "…mạng xã hội có thể có cả lợi và hại, và cần thêm dữ liệu từ chính các công ty công nghệ (theo trang của HHS, chúng tôi chỉ đọc được đoạn trích)." Lý do: Làm mềm vì nguồn chưa mở trực tiếp. Review (Claude Opus 5.5, 10/11/2026): Review đọc khuyến cáo của Tổng Y sĩ Mỹ 2023 (PDF hhs.gov qua bản lưu Internet Archive 4/11/2026): chữ cũ đúng ý nhưng ghi "chỉ đọc được đoạn trích"; đã viết lại theo toàn văn; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2024if_/https://www.hhs.gov/sites/default/files/sg-youth-mental-health-social-media-advisory.pdf" ]
    review: dung
  - id: n36
    cau: 'Nhãn "Đã bị bác bỏ": "mạng xã hội hoàn toàn vô hại với teen".'
    loai: nhan
    nhan: bac-bo
    co_so:
      - teague2026
      - orben2022
    ly_do: Phân tích tổng hợp 2026 (153 nghiên cứu dọc) thấy mạng xã hội liên hệ nhất quán, khiêm tốn với trầm cảm và ý nghĩ tự hại (r = 0,09–0,21); Orben và cộng sự (2022) thấy các độ tuổi mà dùng nhiều dự báo hài lòng giảm nhẹ. Khẳng định "hoàn toàn vô hại" trái với các kết quả này. Nhãn xét theo đồng thuận của hai nguồn đã mở; liên hệ nhỏ và chưa nhân quả nên chỉ bác bỏ "hoàn toàn vô hại", không khẳng định có hại.
    nguon:
      - teague2026
      - orben2022
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "…cửa sổ nhạy cảm quanh tuổi dậy thì (nữ 11–13, nam 14–15) có bằng chứng dọc; nội dung độc hại (bắt nạt mạng, nội dung cổ vũ tự hại, so sánh ngoại hình) là rủi ro thật với nhóm dễ tổn thương." Chữ mới: "…phân tích tổng hợp 2026 thấy mạng xã hội liên hệ nhất quán với trầm cảm và ý nghĩ tự hại ở mức nhỏ (r = 0,09–0,21), và Orben và cộng sự (2022) thấy một nghiên cứu dọc có các độ tuổi…". Lý do: Bỏ "nội dung độc hại… rủi ro thật" (không có nguồn đã mở); thay bằng nguồn đọc được. Review (Claude Opus 5.5, 10/11/2026): Giữ Đã bị bác bỏ cho mệnh đề tuyệt đối "hoàn toàn vô hại": phân tích tổng hợp 153 nghiên cứu dọc (Teague 2026, tóm tắt đọc lại) thấy liên hệ nhất quán; Orben-Dienlin 2019 và Orben 2022 thấy hiệu ứng trong cùng người (nhỏ). Chỗ còn căng: phần nhân quả vẫn "đang tranh cãi" (n33); khung đã nói rõ "nhỏ ở mức trung bình" và không khẳng định có hại.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2024if_/https://www.hhs.gov/sites/default/files/sg-youth-mental-health-social-media-advisory.pdf", "https://europepmc.org/article/MED/41801211", "https://pmc.ncbi.nlm.nih.gov/articles/PMC8960761/" ]
    luot_2_ghi_chu: "Nhãn 'Đã bị bác bỏ' cho 'hoàn toàn vô hại': hợp lý."
    review: dung
  - id: n37
    cau: Các cửa sổ nhạy cảm khác nhau theo tuổi và giới (Orben và cộng sự, 2022); các yếu tố khác (tính cách, môi trường gia đình) có thể liên quan nhưng chúng tôi chưa có nguồn đã mở.
    loai: phat-hien
    nguon:
      - orben2022
    trich: distinct developmental windows of sensitivity to social media in adolescence … at different ages for males … and females
    vi_tri: Orben (2022), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mô hình nhạy cảm khác biệt (differential susceptibility)… Tuổi dậy thì (não bộ đang tái cấu trúc mạnh, nhạy cảm với đánh giá xã hội), giới tính, tính cách (hay lo âu, cầu toàn) và môi trường gia đình đều có thể khuếch đại hoặc giảm nhẹ tác động." Chữ mới: "Mức độ nhạy cảm khác nhau giữa các nhóm… Orben và cộng sự (2022) thấy các cửa sổ nhạy cảm khác nhau theo tuổi và giới. Các yếu tố khác… chúng tôi chưa có nguồn đã mở…, nên chỉ nêu như một khả năng." Lý do: Bỏ tên "differential susceptibility" và các yếu tố không có nguồn. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC8960761/" ]
    luot_2_ghi_chu: "'Chưa có nguồn đã mở' về yếu tố khác là tự nhận, đúng."
    review: dung
  - id: n38
    cau: Các nghiên cứu ở trên dùng ước lượng thời gian dùng do teen tự báo cáo; nghiên cứu tương lai có thể đo cách dùng chứ không chỉ số giờ (ví dụ hai teen cùng lướt 3 tiếng là ví dụ giả định).
    loai: phat-hien
    nguon:
      - orben2022
    trich: correlating a single-item life satisfaction measure and participant estimates of how much time they spend using social media on a typical day
    vi_tri: Orben (2022), Results (Fig. 1)
    ket_qua: da-sua
    ghi_chu: 'Ví dụ hai teen: gia-dinh. Chữ cũ: "…Hai teen cùng lướt 3 tiếng/ngày có thể đang làm hai việc hoàn toàn khác: … Nghiên cứu tương lai cần đo cách dùng… và cần dữ liệu thực từ công ty công nghệ thay vì tự báo cáo." Chữ mới: "…Các nghiên cứu ở trên dùng ước lượng thời gian dùng do teen tự báo cáo (Orben và cộng sự, 2022)… nghiên cứu tương lai có thể đo cách dùng…". Lý do: Bỏ "cần dữ liệu thực từ công ty" (không có nguồn mở); nêu bằng chứng về tự báo cáo. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Ví dụ hai teen là giả định.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC8960761/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6534991/" ]
    luot_2_ghi_chu: Ví dụ hai teen lướt 3 tiếng là giả định.
    review: dung
  - id: n39
    cau: Dữ liệu cắt ngang không cho biết chiều nhân quả; dữ liệu dọc cho thấy cả hai chiều tồn tại (dùng nhiều → hài lòng giảm nhẹ; hài lòng giảm → dùng nhiều); các phân tích tổng hợp thấy liên hệ nhỏ hoặc không đáng kể và bằng chứng thực nghiệm còn lẫn lộn (Orben và cộng sự, 2022); muốn kết luận nhân quả cần can thiệp.
    loai: phat-hien
    nguon:
      - orben2022
      - orben-dienlin2019
    trich: Meta-analyses have identified small or negligible negative links between social media use and well-being, while experimental evidence is mixed. Longitudinal observational studies … have found that they are either reciprocal
    vi_tri: Orben (2022), Introduction
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Hầu hết dữ liệu là cắt ngang… buồn cũng dẫn đến dùng nhiều hơn (trốn tránh, tìm đồng cảm)… loại nghiên cứu này còn rất ít." Chữ mới: "Dữ liệu cắt ngang… Dữ liệu dọc… cho thấy cả hai chiều đều tồn tại… Theo Orben và cộng sự (2022), các phân tích tổng hợp thấy liên hệ nhỏ hoặc không đáng kể và bằng chứng thực nghiệm còn lẫn lộn". Lý do: Bỏ "trốn tránh, tìm đồng cảm" (cơ chế, không kiểm được) và "còn rất ít" (nguồn nói "mixed"). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC8960761/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6534991/" ]
    review: dung
  - id: n40
    cau: 'Mục 1: số giờ dùng công nghệ liên hệ yếu với sức khỏe tinh thần ở cấp độ dân số (Orben và Przybylski, 2019); chưa có nghiên cứu đã mở cho thấy "cách dùng" quan trọng hơn "số giờ"; Tổng Y sĩ Mỹ (2023) khuyên gia đình lập kế hoạch dùng phương tiện số, thảo luận cởi mở về thời gian và nội dung, và nói với con về lợi ích, rủi ro của mạng xã hội.'
    loai: loi-khuyen
    nguon:
      - orben2019
      - sg2023
    trich: explaining at most 0.4% of the variation in well-being [Orben 2019] | Create a family media plan. … A family media plan can promote open family discussion and rules about media use and include topics such as balancing screen/online time, content boundaries… Discuss with children the benefits and risks of social media [Surgeon General 2023]
    vi_tri: Orben & Przybylski (2019), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: ":nhan[kha-vung] "Số giờ màn hình liên hệ yếu với sức khỏe tinh thần; cách dùng mới quan trọng. Dấu hiệu đáng lo… so sánh bản thân liên tục, bị bắt nạt/bình luận độc hại, xem nội dung cổ vũ tự hại hoặc rối loạn ăn uống, và dùng điện thoại để trốn tránh mọi cảm xúc khó chịu." Chữ mới: "Theo Orben và Przybylski (2019), số giờ… liên hệ yếu… Chúng tôi chưa có nghiên cứu đã mở cho thấy "cách dùng" quan trọng hơn "số giờ"; hỏi con đang xem gì… là thông lệ hợp lý, không phải kết quả của một nghiên cứu cụ thể." Lý do: Bỏ "cách dùng mới quan trọng" và danh sách "dấu hiệu đáng lo" (không có nguồn; gần với dấu hiệu lâm sàng). Review (Claude Opus 5.5, 10/11/2026): Lượt 2 không chắc đúng chỗ: lời khuyên "hỏi con đang xem gì" không có nguồn, lời rào "thông lệ hợp lý" không thay được nguồn. Thay bằng khuyến cáo có nguồn; doi_chu.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/30944443", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6534991/" ]
    luot_2_ghi_chu: Nguồn đã mở không cho thấy 'cách dùng quan trọng hơn số giờ' hay ngược lại; khẳng định 'chưa có nghiên cứu đã mở' là tự nhận của trang, không kiểm được ở lượt 2. Lời khuyên 'hỏi con đang xem gì' không có nguồn.
    review: sai
  - id: n41
    cau: 'Nhãn "Khá vững": số giờ dùng công nghệ liên hệ yếu với sức khỏe tinh thần, nên chỉ đếm giờ có thể bỏ sót nhiều điều.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - orben2019
      - teague2026
    ly_do: 'Như n31: liên hệ yếu theo thời gian dùng (0,4% phương sai) nhưng phân tích tổng hợp 2026 thấy liên hệ nhất quán khiêm tốn; chủ yếu mẫu phương Tây, đo tự báo cáo. Khá vững.'
    nguon:
      - orben2019
      - teague2026
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/30944443", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6534991/", "https://europepmc.org/article/MED/41801211" ]
    luot_2_ghi_chu: Phần 'nên chỉ đếm giờ có thể bỏ sót nhiều điều' là suy luận; nhãn 'Khá vững' không cao hơn thước đo.
    ghi_chu: "Review (Claude Opus 5.5, 10/11/2026): Nhãn Khá vững đạt thước đo (như n31)."
    review: dung
  - id: n42
    cau: 'Ngủ đủ giấc liên hệ với sức khỏe tinh thần mạnh hơn hẳn thời gian dùng màn hình (YRBS: β 0,150 so với −0,049); đây là liên hệ quan sát, chưa chứng minh rằng ngủ đủ cải thiện sức khỏe tinh thần.'
    loai: so-lieu
    nguon:
      - orben2019
    trich: a larger positive association for eating breakfast (median β = .116 …) and getting enough sleep (median β = .150, median n = 56,552, partial 𝜂2 = .022 …)
    vi_tri: Orben & Przybylski (2019), Results (YRBS)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trong cùng bộ dữ liệu của Orben và Przybylski, ngủ đủ giấc liên hệ… mạnh hơn hẳn thời gian dùng màn hình." (tiêu đề "…là can thiệp rẻ và chắc chắn nhất", chip vững chắc) Chữ mới: "…(ở YRBS: β 0,150 so với −0,049). Đó là liên hệ quan sát, chưa chứng minh rằng ngủ đủ giấc cải thiện sức khỏe tinh thần." Tiêu đề "Bảo vệ giấc ngủ là một việc đáng làm", chip khá vững, giữ id cũ. Lý do: "Can thiệp… chắc chắn nhất" không có nguồn (chỉ liên hệ quan sát); hạ Vững chắc → Khá vững. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Review đọc toàn văn bản tác giả Orben & Przybylski 2019 (Oxford ORA, uuid:5d844350…, tải PDF 10/11/2026): YRBS: ngủ đủ β 0,150 so với công nghệ −0,049. Đã giải quyết.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/30944443" ]
    luot_2_ghi_chu: Hệ số β so sánh trong YRBS (0,150 so với -0,049) nằm trong toàn văn Nature Human Behaviour sau tường phí; không mở được, không có bản mở nào đã tìm thấy.
    review: dung
  - id: n43
    cau: Tổng Y sĩ Mỹ (2023) khuyên cân nhắc hạn chế dùng điện thoại, máy tính bảng và máy tính ít nhất 1 giờ trước khi ngủ và suốt đêm; đó là khuyến cáo, chưa phải kết quả thử nghiệm mà chúng tôi đã kiểm.
    loai: loi-khuyen
    nguon:
      - sg2023
    trich: Since electronics can be a potential distraction after bedtime and can interfere with sleep, consider restricting the use of phones, tablets, and computers for at least 1 hour before bedtime and through the night.
    vi_tri: Orben & Przybylski (2019), Results
    ket_qua: da-sua
    ghi_chu: 'Các con số 30–60 phút không có nguồn đã mở. Chữ cũ: "Quy tắc đơn giản, dễ thực hiện: điện thoại sạc ngoài phòng ngủ, không lướt trước giờ ngủ 30–60 phút." Chữ mới: "Quy tắc cụ thể… là thông lệ thực hành, chưa phải kết quả của nghiên cứu mà chúng tôi đã kiểm." Lý do: Nêu rõ không có nguồn. Review (Claude Opus 5.5, 10/11/2026): Lượt 2 không chắc đúng chỗ: "30–60 phút", "sạc ngoài phòng ngủ" không có nguồn. Thay bằng khuyến cáo của Tổng Y sĩ Mỹ (toàn văn qua bản lưu); doi_chu.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Lời khuyên cụ thể (sạc ngoài phòng ngủ, không lướt 30-60 phút trước giờ ngủ): trang tự nhận không phải kết quả nghiên cứu; không nguồn bậc 1-2 trong lượt 2."
    review: sai
  - id: n44
    cau: 'Nhãn "Khá vững": giấc ngủ đủ liên hệ với sức khỏe tinh thần mạnh hơn thời gian dùng màn hình.'
    loai: nhan
    nhan: kha-vung
    co_so:
      - orben2019
    ly_do: 'Hai bộ dữ liệu lớn (YRBS và MTF; MTF: β sleep 0,246 so với −0,006) cùng chiều trong một bài; chưa mở được phân tích tổng hợp hay thử nghiệm đối chứng về can thiệp giấc ngủ. Khá vững cho liên hệ, không cho tác dụng nhân quả.'
    nguon:
      - orben2019
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: ":nhan[vung-chac]" cho "Bảo vệ giấc ngủ là can thiệp rẻ và chắc chắn nhất". Chữ mới: ":nhan[kha-vung]" cho "Bảo vệ giấc ngủ là một việc đáng làm". Lý do: Chỉ có liên hệ quan sát từ một bài; không đạt "Vững chắc". Review (Claude Opus 5.5, 10/11/2026): Lượt 2 không chắc vì không mở được Orben 2019; Review đọc toàn văn bản tác giả Orben & Przybylski 2019 (Oxford ORA, uuid:5d844350…, tải PDF 10/11/2026): YRBS β ngủ 0,150 so với −0,049; MTF 0,246 so với −0,006; Thảo luận: "getting enough sleep and regularly eating breakfast have much more positive associations… (ranging from 1.7x to 44.2x…)". Khá vững cho liên hệ (một bài, ba bộ dữ liệu; khuyến cáo Surgeon General cũng nêu liên hệ mạng xã hội với giấc ngủ kém), không cho tác dụng nhân quả: đạt thước đo.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/30944443" ]
    luot_2_ghi_chu: Nhãn dựa trên so sánh hệ số giấc ngủ với màn hình trong Orben & Przybylski 2019 (toàn văn sau tường phí, không mở được); không xác nhận được. Chưa mở tổng hợp nào khác so sánh trực tiếp hai yếu tố này.
    review: dung
  - id: n45
    cau: "Mục 3: Orben và cộng sự (2022) thấy các cửa sổ (nữ 11–13, nam 14–15, 19 tuổi) trong đó dùng nhiều dự báo hài lòng giảm nhẹ một năm sau; chỉ một nghiên cứu dọc ở Anh, chưa lặp lại, các tác giả chỉ suy đoán về dậy thì, nên không gắn nhãn; phân tích tổng hợp 2026 thấy liên hệ với trầm cảm mạnh hơn ở đầu tuổi vị thành niên."
    loai: loi-khuyen
    nguon:
      - orben2022
      - teague2026
    trich: distinct developmental windows of sensitivity to social media in adolescence, when higher estimated social media use predicts a decrease in life satisfaction ratings one year later [Orben 2022] | Associations between social media and depression were stronger in early adolescence (β = 0.09) [Teague 2026]
    vi_tri: Orben (2022), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Cửa sổ nhạy cảm… là lúc não bộ nhạy cảm nhất với đánh giá xã hội. Đây là giai đoạn nên trò chuyện nhiều hơn về so sánh trên mạng, áp lực ngoại hình và bắt nạt mạng — thay vì chỉ ra lệnh cấm." Chữ mới: "…đây là một nghiên cứu dọc ở Anh, và các tác giả chỉ suy đoán về dậy thì. Một gợi ý thực hành hợp lý (không phải kết quả của nghiên cứu): … trò chuyện với con về những điều con gặp trên mạng có thể hữu ích hơn chỉ ra lệnh cấm." Lý do: Bỏ "não bộ nhạy cảm nhất với đánh giá xã hội" (không có nguồn đã mở). Review (Claude Opus 5.5, 10/11/2026): Lời so sánh "trò chuyện… hữu ích hơn chỉ ra lệnh cấm" không có nguồn. Bỏ; tiêu đề đổi "Có thể có những độ tuổi nhạy cảm hơn", bỏ chip (xem n46), thêm kết quả điều tiết theo tuổi của Teague 2026; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC8960761/" ]
    luot_2_ghi_chu: Phần 'trò chuyện với con thay vì chỉ cấm' đã tự nhận là gợi ý thực hành, không phải kết quả nghiên cứu.
    review: sai
  - id: n46
    cau: '(Đã bỏ) Nhãn "Khá vững": chú ý ở ngưỡng dậy thì (các cửa sổ nhạy cảm).'
    loai: nhan
    ket_qua: da-bo
    ghi_chu: 'Lượt 1: chỗ khó, một nghiên cứu chưa tái lập. Review (Claude Opus 5.5, 10/11/2026): Lượt 2 quá mạnh đúng: một nghiên cứu dọc, chưa tái lập, không đạt Khá vững; cũng không đạt Đang tranh cãi (không có bằng chứng trái chiều) như câu đúng của lượt 2. Bỏ chip khỏi tiêu đề mục 3 (giữ id cũ { #3-chu-y-dac-biet-o-nguong-day-thi-kha-vung }), phát hiện vẫn kể ở n45 với lời "chưa được lặp lại"; doi_chu.'
    luot_2: qua-manh
