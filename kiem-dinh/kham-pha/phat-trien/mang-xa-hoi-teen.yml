  - id: n56
    cau: (Đã bỏ) TikTok và video ngắn chiếm vị trí áp đảo trong thời gian online của teen Việt; áp lực học tập và kỳ vọng gia đình là nguồn stress lớn được ghi nhận trong nhiều khảo sát trong nước.
    loai: phat-hien
    ket_qua: da-bo
    ghi_chu: 'Không có nguồn đã mở cho tỉ trọng TikTok; áp lực học tập chỉ có ở trang khác (Trần 2024). Chữ cũ: "TikTok và video ngắn chiếm vị trí áp đảo trong thời gian online của teen Việt… áp lực học tập và kỳ vọng gia đình là nguồn stress lớn được ghi nhận trong nhiều khảo sát trong nước." Chữ mới: "…chúng tôi không có nguồn đã mở về tỉ trọng TikTok… áp lực học tập là một yếu tố có thể liên quan (xem [Bắt nạt và áp lực thi cử]), nhưng đó là giả thuyết." Lý do: Không kiểm được; thêm liên kết trang nội bộ. Review (Claude Opus 5.5, 10/11/2026): Đã kiểm: trang không còn "áp đảo" hay "TikTok chiếm".'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu đã bỏ khỏi trang; không qua lượt 2.
    review: dung
