    cau: Một nghiên cứu cắt ngang (Vũ Thị Thúy Hằng & Nguyễn Thị Vân, công bố 25/12/2024, VNU Journal of Economics and Business) dùng thang BSMAS trên 13–17 tuổi, chọn mẫu quả cầu tuyết, ghi nhận tỉ lệ "nghiện mạng xã hội" cao, nữ dễ bị hơn nam.
