    vi_tri: Lancet (2024), Methods; CDC (2024)
    ket_qua: da-lam-mem
    ghi_chu: 'Suy luận về không so sánh được đã ghi rõ trên trang. Chữ cũ: (không có) Chữ mới: "Số này thấp so với tỉ lệ buồn bã tự báo cáo ở Mỹ, nhưng đó là hai cách đo khác nhau… nên không thể kết luận teen Việt "khỏe hơn" hay "ít buồn hơn"." Lý do: Câu mới thêm để không để lại ấn tượng sai khi đặt số Mỹ và số Việt cạnh nhau. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
