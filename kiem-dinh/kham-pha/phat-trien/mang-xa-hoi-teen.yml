    ket_qua: dung
    ghi_chu: 'Trích: "2025: 33% total, 24% male, 43% female" (trang Youth Health in Focus, đề 18/9/2026; cập nhật 14/8/2026). YRBS đợt sau là 2027 (hai năm một lần), nên đặt hạn 2027-11. Câu mới thêm.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cdc.gov/yrbs/youth-health-in-focus/mental-health.html", "https://www.cdc.gov/yrbs/yhif/files/2025/YHIF-2015-2025-Final-508.pdf" ]
    luot_2_ghi_chu: Kiểm lại hôm nay 2026-11-10 trên trang CDC; 2023 là 40% (nữ 53%, nam 28%) nên 2025 thấp hơn.
