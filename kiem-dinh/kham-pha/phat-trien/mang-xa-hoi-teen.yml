    cau: NAMHS đo bằng phỏng vấn chẩn đoán còn YRBS bằng một câu hỏi tự báo cáo, nên không thể kết luận teen Việt "khỏe hơn" hay "ít buồn hơn" teen Mỹ; không thấy dữ liệu mạng xã hội trong tóm tắt NAMHS.
