    cau: Các lời dẫn an toàn khác (khung ">" ở "Điều gì đang xảy ra?", ngộ nhận "cứ thu điện thoại là hết trầm cảm") chỉ nói nên nói với người tin cậy hay người có chuyên môn và dẫn Hỗ trợ, không có số điện thoại.
    loai: ve-site
