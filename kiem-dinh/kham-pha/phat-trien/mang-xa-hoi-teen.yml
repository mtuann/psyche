    vi_tri: Vu & Nguyen (2024), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một nghiên cứu tại Đại học Thương mại (chấp nhận đăng cuối 2024) dùng thang BSMAS trên teen 13–18 tuổi… mẫu thuận tiện". Chữ mới: "…(Vũ Thị Thúy Hằng và Nguyễn Thị Vân, công bố 25/12/2024 trên VNU Journal of Economics and Business) dùng thang BSMAS trên 13–17 tuổi, chọn mẫu theo kiểu quả cầu tuyết…". Danh mục nguồn đã sửa. Lý do: Nơi đăng là VNU Journal of Economics and Business (không phải "Đại học Thương mại"); tuổi 13 đến dưới 18; mẫu quả cầu tuyết, không phải "thuận tiện". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
