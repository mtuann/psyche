    trich: Attempted suicide 8 9 7 9 10 9 (2013–2023 Total) (CDC); "9.5% had attempted suicide" (MMWR)
    vi_tri: CDC (2024), bảng "Progress at a glance"; MMWR su7304a1
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "…10% đã từng cố tự tử (2021), 9% (2023)." Chữ mới: "…10% đã từng cố tự tử (2021), khoảng 9% (2023)." Lý do: Báo cáo xu hướng làm tròn 9, MMWR nêu 9,5%; viết "khoảng". Review (Claude Opus 5.5, 10/11/2026): Lượt 2 sai đúng: 9% (MMWR 9,5%) là trong 12 tháng qua. Đã sửa theo câu đúng của lượt 2; doi_chu.'
