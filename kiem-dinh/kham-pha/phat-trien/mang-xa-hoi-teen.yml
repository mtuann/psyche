    luot_2: dung
    luot_2_nguon: [ "https://www.cdc.gov/yrbs/dstr/pdf/YRBS_Data-Summary-Trends_Report2023_508.pdf", "https://www.cdc.gov/yrbs/dstr/pdf/YRBS-2023-Data-Summary-Trend-Report.pdf" ]
    luot_2_ghi_chu: Ví dụ 'An' là giả định.
    review: dung
  - id: n3
    cau: 'Haidt xuất bản năm 2024 cuốn The Anxious Generation, luận điểm: sự trỗi dậy của smartphone và mạng xã hội cùng sự suy giảm tự lập và chơi tự do đã "đại tu sửa" tuổi thơ và gây ra khủng hoảng sức khỏe tâm thần ở trẻ em và teen.'
    loai: lich-su
    nguon:
      - haidt-site
    trich: the rise of smartphones and social media, along with the decline of independence and free play, "rapidly rewired childhood and caused a global mental health crisis for kids and teens."
    vi_tri: anxiousgeneration.com/book
    ket_qua: da-sua
    ghi_chu: 'Chỉ đọc trang web chính thức của sách, không đọc sách. Chữ cũ: "Jonathan Haidt, nhà tâm lý học xã hội tại Đại học New York, xuất bản năm 2024… từ khoảng 2010–2015, tuổi thơ của trẻ em phương Tây đã bị "đại tu sửa"… từ tuổi thơ chơi tự do ngoài đời thực sang tuổi thơ gắn với điện thoại." Chữ mới: "Nhà tâm lý học Jonathan Haidt xuất bản năm 2024… sự trỗi dậy của smartphone và mạng xã hội, cùng với sự suy giảm tự lập và chơi tự do, đã "đại tu sửa" tuổi thơ… Ông nói về giai đoạn biến đổi 2010–2015." Lý do: Bỏ "nhà tâm lý học xã hội tại ĐH New York" và "trẻ em phương Tây" (không có trong nguồn đã mở); theo chữ của trang sách. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Trang sách anxiousgeneration.com/book (đọc lại): câu trích nguyên văn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.anxiousgeneration.com/book", "https://www.nature.com/articles/d41586-024-00902-2" ]
    review: dung
  - id: n4
    cau: (Đã bỏ) Haidt nói về giai đoạn biến đổi 2010–2015.
    loai: lich-su
    ket_qua: da-bo
    ghi_chu: 'Chỗ chưa chắc: nguồn bậc 3 (Wikipedia), sách không mở được; lượt 2 nên tìm nguồn bậc 1–2 (sách, bài của Haidt). Chữ cũ: "…từ khoảng 2010–2015…". Chữ mới: "…ông nói về giai đoạn biến đổi 2010–2015". Lý do: Làm mềm: bắt nguồn từ một trích dẫn qua nguồn bậc 3, không phải sách. Review (Claude Opus 5.5, 10/11/2026): Lượt 2 không chắc đúng chỗ: mốc chỉ có ở Wikipedia (bậc 3, không được làm nguồn duy nhất); trang sách, trang bốn chuẩn mực và bài Nature của Odgers không nêu. Đã bỏ khỏi trang; doi_chu.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://www.anxiousgeneration.com/the-issue" ]
    luot_2_ghi_chu: Nguồn mở chỉ nói 'đầu thập niên 2010'; mốc 2010-2015 không xác nhận được (không mở được sách hay trang tóm tắt có mốc này).
    review: sai
  - id: n5
    cau: (Đã bỏ) Điểm gãy Haidt nhấn mạnh là khoảng năm 2012, khi đa số teen Mỹ đã sở hữu smartphone.
    loai: lich-su
    ket_qua: da-bo
    ghi_chu: 'Không có nguồn đã mở (Wikipedia nói chung chung "khoảng 2010"; không có tỉ lệ sở hữu). Chữ cũ: "Điểm gãy ông nhấn mạnh là khoảng năm 2012, khi đa số teen Mỹ đã sở hữu smartphone." Chữ mới: (bỏ) Lý do: Không kiểm được. Review (Claude Opus 5.5, 10/11/2026): Đã kiểm: trang không còn "2012".'
    luot_2: khong-chac
    luot_2_ghi_chu: Câu đã bỏ khỏi trang; không qua lượt 2.
    review: dung
  - id: n6
    cau: Theo các đoạn trích sách trong bài điểm sách của Odgers (2024), Haidt cho rằng các công ty công nghệ đã "tái cấu trúc" tuổi thơ bằng nội dung gây nghiện và bằng việc thay thế chơi đùa, gặp gỡ trực tiếp; đây là các giả thuyết cơ chế của Haidt, Odgers cho rằng chúng chưa được khoa học ủng hộ.
    loai: lich-su
    nguon:
      - odgers2024
    trich: Haidt asserts that the great rewiring of children’s brains has taken place by “designing a firehose of addictive content that entered through kids’ eyes and ears”. And that “by displacing physical play and in-person socializing, these companies have rewired childhood…” … the book’s repeated suggestion that digital technologies are rewiring our children’s brains and causing an epidemic of mental illness is not supported by science.
    vi_tri: Odgers 2024, Nature, đoạn 1–2
    ket_qua: da-lam-mem
    ghi_chu: 'Chỗ chưa chắc: chỉ xác nhận qua nguồn bậc 3; sách không mở được. Lượt 2 nên tìm nguồn bậc 1–2. Chữ cũ: "Haidt liệt kê bốn tổn hại nền tảng… (1) tước đoạt xã hội — tương tác trực tiếp bị thay bằng kết nối nông trên mạng; (2) thiếu ngủ — dùng điện thoại khuya; (3) phân mảnh chú ý — thông báo liên tục; (4) nghiện — thuật toán tối ưu cho thời gian dùng." (và ở mục Lý thuyết: ánh sáng xanh, rèn não chuyển đổi tác vụ…) Chữ mới: "Theo mô tả của sách (chúng tôi không mở được sách gốc), Haidt nêu bốn tổn hại nền tảng: … Đây là các giả thuyết cơ chế của Haidt; chúng tôi chưa kiểm các cơ chế cụ thể bằng nguồn riêng." Lý do: Bỏ các mô tả chi tiết cơ chế (không có nguồn đã mở). Review (Claude Opus 5.5, 10/11/2026): Câu cũ (bốn tổn hại) chỉ có nguồn Wikipedia (bậc 3), trái chuẩn mục 2; không mở được sách hay trang nào của tác giả, nhà xuất bản nêu bốn tổn hại. Viết lại theo đoạn trích sách trong bài Nature của Odgers (mở được 10/11/2026), cả ở mục "Điều gì đang xảy ra?" và mục Lý thuyết; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.anxiousgeneration.com/the-issue", "https://www.anxiousgeneration.com/book" ]
    luot_2_ghi_chu: Đây là cách trình bày của Haidt (giả thuyết cơ chế), không phải kết quả đã chứng minh.
    review: sai
  - id: n7
    cau: 'Bốn chuẩn mực của Haidt: hoãn smartphone đến cấp 3, không mạng xã hội trước 16 tuổi, trường học không điện thoại từ đầu đến cuối buổi, và cho trẻ nhiều tự lập, chơi tự do và trách nhiệm hơn ở đời thực.'
    loai: lich-su
    nguon:
