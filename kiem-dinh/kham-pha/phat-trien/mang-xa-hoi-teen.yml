  - id: n47
    cau: 'Mục 4: nếu một bạn trẻ buồn bã kéo dài, mất hứng thú, nói về cái chết hoặc tự làm hại mình, đó là lúc cần người có chuyên môn; chỉ chuyên gia mới chẩn đoán được; WHO ghi nhận nhiều vấn đề sức khỏe tâm thần tuổi vị thành niên chưa được nhận ra và chưa được điều trị, và kỳ thị là một rào cản; xem Hỗ trợ.'
    loai: lam-sang
    nguon:
      - who-adol2025
    trich: adolescent mental health conditions "remain largely unrecognized and untreated"; "stigma (affecting readiness to seek help)" and "barriers to accessing care"
    vi_tri: WHO (2025), Adolescent mental health
    ket_qua: da-sua
    ghi_chu: 'Lời dẫn an toàn theo lời giao (không chẩn đoán, không liệt kê dấu hiệu để tự đối chiếu, không chi tiết về cách tự hại). Đã bỏ chip vững chắc: không có nguồn đã mở nói "nên đi khám khi…" như một khẳng định nghiên cứu; giữ id cũ. Chữ cũ: ":nhan[vung-chac]" "Buồn bã kéo dài trên hai tuần, mất hứng thú với mọi thứ, nói về cái chết hoặc tự làm hại mình — đó là lúc cần bác sĩ tâm thần/nhà tâm lý… Tại Việt Nam, gọi 115 khi khẩn cấp. Trầm cảm tuổi teen là bệnh lý có thể điều trị được." Chữ mới: "Nếu một bạn trẻ buồn bã kéo dài, mất hứng thú, nói về cái chết hoặc tự làm hại mình, đó là lúc cần người có chuyên môn… Chỉ chuyên gia mới chẩn đoán được… Xem [Hỗ trợ]." Tiêu đề "Khi lo về trầm cảm hoặc tự hại: tìm người có chuyên môn", bỏ chip, giữ id cũ. Lý do: Bỏ "hai tuần" (dạng tiêu chí chẩn đoán), "bệnh lý có thể điều trị được" (WHO fact sheet không nói điều đó), số 115 (dẫn Hỗ trợ theo lời giao). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Không có tiêu chí chẩn đoán, không chi tiết cách tự hại, dẫn Hỗ trợ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.who.int/news-room/fact-sheets/detail/adolescent-mental-health" ]
    luot_2_ghi_chu: Phần chỉ dấu hiệu và 'chỉ chuyên gia mới chẩn đoán' là lời dẫn an toàn, phù hợp tinh thần hướng dẫn WHO.
    review: dung
