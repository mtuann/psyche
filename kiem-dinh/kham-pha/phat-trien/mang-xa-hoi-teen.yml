    vi_tri: Orben (2022), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Dữ liệu dọc cho thấy chiều ngược lại cũng đúng: teen đang buồn có xu hướng chui vào mạng xã hội nhiều hơn." Chữ mới: "Dữ liệu dọc của Orben và cộng sự cho thấy chiều ngược lại cũng đúng: hài lòng với cuộc sống giảm dự báo dùng mạng xã hội nhiều hơn sau đó." Lý do: "Chui vào mạng xã hội" (động cơ) không có trong nguồn; hài lòng là biến đo. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6534991/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC8960761/" ]
    review: dung
  - id: n58
    cau: 'Ngộ nhận "hiệu ứng nhỏ nghĩa là vô hại": "nhỏ ở mức trung bình" không có nghĩa bằng không; các phân tích tổng hợp thấy liên hệ nhỏ nhưng nhất quán; chúng tôi chưa có nguồn nói với một số nhóm hiệu ứng "không hề nhỏ".'
    loai: phat-hien
    nguon:
      - teague2026
      - orben2022
    trich: Digital media use was "consistently associated with risks" to child and adolescent health, especially social media. … They also note the associations are modest.
    vi_tri: Teague (2026); Orben (2022)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ở quy mô hàng chục triệu teen, hiệu ứng nhỏ vẫn tạo ra số ca đáng kể ở mức cộng đồng; và "trung bình nhỏ" che giấu nhóm dễ tổn thương (tuổi dậy thì, đã có sẵn lo âu/trầm cảm) — với các em, hiệu ứng không hề nhỏ." Chữ mới: "…các phân tích tổng hợp thấy liên hệ nhỏ nhưng nhất quán, và Orben và cộng sự (2022) thấy các độ tuổi mà hiệu ứng rõ hơn một chút. Chúng tôi chưa có nguồn nói rằng với một số nhóm, hiệu ứng "không hề nhỏ"." Lý do: Bỏ tính toán "hàng chục triệu", "lo âu/trầm cảm có sẵn" (không có nguồn đã mở). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Chữ "nhỏ nhưng nhất quán" khớp tóm tắt Teague 2026 và Orben 2022.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/41801211", "https://pmc.ncbi.nlm.nih.gov/articles/PMC8960761/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6534991/" ]
    luot_2_ghi_chu: "Các phân tích tổng hợp nói 'nhỏ' (Orben 2022: 'small or negligible'; Teague 2026: nhất quán ở mức nhỏ-vừa); câu của trang khớp ở mức 'nhỏ nhưng nhất quán'; phần 'chưa có nguồn cho nhóm hiệu ứng không hề nhỏ' là tự nhận."
    review: dung
  - id: n59
    cau: 'Ngộ nhận "cấm tiệt mạng xã hội là giải pháp": chưa đủ bằng chứng thực nghiệm; Tổng Y sĩ Mỹ (2023) nói mạng xã hội có thể có cả lợi và hại: với một số teen, nó mang lại cộng đồng và sự hỗ trợ từ bạn bè, nhất là với những nhóm hay bị gạt ra lề.'
    loai: phat-hien
    nguon:
      - orben2022
      - sg2023
    trich: Meta-analyses have identified small or negligible negative links … while experimental evidence is mixed. (Orben 2022) | Social media can provide benefits for some youth by providing positive community and connection … especially important for youth who are often marginalized, including racial, ethnic, and sexual and gender minorities. (Surgeon General 2023)
    vi_tri: Orben (2022), Introduction
    ket_qua: da-sua
    ghi_chu: 'Vế Surgeon General: chưa mở nguồn trực tiếp (xem n35). Chữ cũ: "Mạng xã hội cũng là nơi nhiều teen tìm thấy cộng đồng và sự hỗ trợ (bạn bè, nhóm sở thích, teen thuộc nhóm thiểu số khó chia sẻ ngoài đời). Cấm đoán cực đoan có thể lấy đi cả mặt tích cực mà không giải quyết được gốc rễ." Chữ mới: "Chưa có đủ bằng chứng thực nghiệm để nói cấm tiệt mạng xã hội cải thiện sức khỏe tâm thần… Chúng tôi không có nguồn đã mở về mặt tích cực cụ thể…, nên không khẳng định." Lý do: Bỏ mặt tích cực cụ thể (không có nguồn đã mở). Review (Claude Opus 5.5, 10/11/2026): Review đọc khuyến cáo của Tổng Y sĩ Mỹ 2023 (PDF hhs.gov qua bản lưu Internet Archive 4/11/2026): vế lợi ích nay có nguồn; trang bỏ câu "chúng tôi không có nguồn… nên không khẳng định" và nêu lợi ích theo khuyến cáo; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2024if_/https://www.hhs.gov/sites/default/files/sg-youth-mental-health-social-media-advisory.pdf" ]
    review: dung
  - id: n60
    cau: 'Ngộ nhận "cứ thu điện thoại là hết trầm cảm": liên hệ giữa mạng xã hội và sức khỏe tâm thần là nhỏ và hai chiều nên chỉ thu điện thoại khó là cả lời giải; nếu lo, tìm người có chuyên môn; xem Hỗ trợ.'
    loai: loi-khuyen
    nguon:
      - orben-dienlin2019
    trich: social media use is not, in and of itself, a strong predictor of life satisfaction across the adolescent population. Instead, social media effects are nuanced, small at best, reciprocal over time, gender specific, and contingent on analytic methods.
    vi_tri: Orben (2019, PNAS), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trầm cảm là bệnh lý phức tạp (gen, môi trường, sang chấn, áp lực học tập...)… điều trị trầm cảm cần chuyên môn y tế — gọi 115…". Chữ mới: "Dữ liệu cho thấy liên hệ… là nhỏ và hai chiều, nên chỉ thu điện thoại khó là cả lời giải. Nếu lo về trầm cảm của một bạn trẻ, hãy tìm người có chuyên môn; xem Hỗ trợ." Lý do: Bỏ danh sách nguyên nhân trầm cảm (không có nguồn) và số 115. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Lời dẫn Hỗ trợ, không số điện thoại.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6534991/", "https://web.archive.org/web/2024if_/https://www.hhs.gov/sites/default/files/sg-youth-mental-health-social-media-advisory.pdf" ]
    luot_2_ghi_chu: Phần 'nếu lo, tìm người có chuyên môn' là lời dẫn tới Hỗ trợ, phù hợp WHO về thanh thiếu niên.
    review: dung
  - id: n61
    cau: 'Các liên kết "Đọc thêm" (Não tuổi teen khác gì não người lớn?; Buồn thường và trầm cảm khác nhau thế nào?; Tuổi teen: mình là ai?) trỏ tới trang của site.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Chỗ cần chú ý: trong worktree chỉ có phat-trien/ban-sac-tuoi-teen.md; co-so-sinh-hoc/nao-tuoi-teen và suc-khoe-tam-than/tram-cam chưa có (lô khác). Link không đổi; kiểm khi gom nhánh. Đã kiểm: trang.yml dua_tren (ban-sac-tuoi-teen, nao-tuoi-teen) khớp các link. Review (Claude Opus 5.5, 10/11/2026): Đã kiểm: ban-sac-tuoi-teen có trang; co-so-sinh-hoc/nao-tuoi-teen và suc-khoe-tam-than/tram-cam có bản ghi ở trang.yml (chưa có trang trong worktree, hiện "sắp có"); kiểm lại khi gom.'
    review: dung
  - id: n62
    cau: 'Câu hỏi 1: Orben & Przybylski (2019) trên 355.358 teen — công nghệ số giải thích tối đa 0,4% khác biệt về sức khỏe tinh thần — tương đương ăn khoai tây; bị bắt nạt và hút cần sa có liên hệ tiêu cực mạnh hơn nhiều lần.'
    loai: phat-hien
    nguon:
      - orben2019
    trich: explaining at most 0.4% of the variation in well-being; … being bullied (median β = -.212) … smoking marijuana (median β = -.132) [so với technology use −.049]
    vi_tri: Orben & Przybylski (2019)
    ket_qua: da-lam-mem
    ghi_chu: 'Lời giải thích không dựa vào vị trí lựa chọn. Chữ cũ: "…tương đương ăn khoai tây; bị bắt nạt và hút cần sa có liên hệ tiêu cực mạnh hơn nhiều lần." và lời giải thích "…giấc ngủ, bắt nạt, bữa sáng — liên hệ mạnh hơn hẳn." Chữ mới: "…trong cùng bộ dữ liệu, giấc ngủ, bắt nạt, bữa sáng liên hệ mạnh hơn hẳn."; lựa chọn đúng "…tương đương ăn khoai tây…" giữ (xem n20, nhỏ gần bằng). Lý do: "Tương đương" khoai tây hơi mạnh (−0,042 so với −0,049): giữ vì là cách nói tắt trong câu hỏi, nhưng lời giải thích nêu "trong cùng bộ dữ liệu". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. Review đọc toàn văn bản tác giả Orben & Przybylski 2019 (Oxford ORA, uuid:5d844350…, tải PDF 10/11/2026): "nearly as negative (0.9x, YRBS)": chữ "tương đương" trong lựa chọn đúng là cách nói tắt chấp nhận được. Đã giải quyết.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://europepmc.org/article/MED/30944443" ]
    luot_2_ghi_chu: 0,4% khớp tóm tắt. 'Tương đương ăn khoai tây' và 'bị bắt nạt, hút cần sa mạnh hơn nhiều lần' nằm trong toàn văn sau tường phí, không mở được.
    review: dung
  - id: n63
    cau: 'Câu hỏi 2: YRBS 2021 không hỏi về mạng xã hội nên không chứng minh mạng xã hội gây trầm cảm; muốn kết luận nhân quả cần thiết kế khác.'
    loai: phat-hien
    nguon:
      - mmwr2023
      - cdc1121
    trich: '"These new questions assessed social media use" (2023); In 2021, 42% of high school students felt so sad or hopeless …'
    vi_tri: MMWR su7304a1; CDC (2023)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Vì YRBS không hỏi gì về việc dùng mạng xã hội — nó chỉ cho thấy khủng hoảng sức khỏe tâm thần có thật…" Chữ mới: "Vì đợt YRBS 2021 không hỏi gì về việc dùng mạng xã hội — nó chỉ cho thấy mức buồn bã tự báo cáo tăng…" Lý do: Xem n15, n2; câu hỏi đổi "năm 2021". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC11559676/" ]
    luot_2_ghi_chu: YRBS 2021 không có câu hỏi này; DSTR 2013-2023 nói chung 'câu hỏi mới 2021 và 2023' cho nhiều chủ đề, nhưng MMWR 2024 nêu rõ 2023 là lần đầu cho tần suất dùng mạng xã hội.
    review: dung
  - id: n64
    cau: 'Câu hỏi 3: Orben và cộng sự (2022) — cửa sổ nhạy cảm nữ 11–13, nam 14–15; hiệu ứng vẫn nhỏ; chiều ngược lại cũng tồn tại.'
    loai: phat-hien
    nguon:
      - orben2022
    trich: These windows occur at different ages for males (14-15 and 19 years old) and females (11-13 and 19 years old).
    vi_tri: Orben (2022), tóm tắt
    ket_qua: dung
    ghi_chu: Câu hỏi dùng "quanh tuổi dậy thì" như mô tả địa phương của khoảng tuổi; phần "quanh tuổi dậy thì" đã được làm rõ ở n28.
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC8960761/" ]
    luot_2_ghi_chu: Câu hỏi 3 gom 'nữ 11-13, nam 14-15' (còn có 19 tuổi cả hai giới).
  - id: n65
    cau: 'Câu hỏi 4: dữ liệu dọc cho thấy hài lòng giảm cũng dự báo dùng mạng xã hội nhiều hơn; tương quan không cho biết chiều nhân quả; có thể cả hai chiều cùng đúng.'
    loai: phat-hien
    nguon:
      - orben2022
    trich: Decreases in life satisfaction ratings also predicted subsequent increases in estimated social media use
    vi_tri: Orben (2022), tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Dữ liệu dọc cho thấy teen đang buồn có xu hướng dùng mạng xã hội NHIỀU hơn" và lựa chọn đúng "…teen buồn tìm đến mạng xã hội để trốn tránh hoặc tìm đồng cảm…". Chữ mới: "Dữ liệu dọc cho thấy hài lòng với cuộc sống giảm dự báo dùng mạng xã hội nhiều hơn…" và lựa chọn đúng bỏ "để trốn tránh hoặc tìm đồng cảm". Lý do: Bỏ động cơ (không có nguồn); chữ "buồn" thay bằng biến đo. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6534991/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC8960761/" ]
    review: dung
  - id: n66
    cau: Trang là bài mở rộng, dựa trên ban-sac-tuoi-teen và nao-tuoi-teen, kiem_lai_truoc 2027-05 (src/data/trang.yml).
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Đã kiểm trong src/data/trang.yml. Đề xuất: hạ kiem_lai_truoc xuống 2027-05 (YRBS 2027 dự kiến, phân tích tổng hợp mới ra liên tục; chưa mở được Nature/hhs.gov). Người giao quyết. Review (Claude Opus 5.5, 10/11/2026): Câu cũ ghi kiem_lai_truoc 2028-05; trang.yml nay ghi 2027-05 (người giao đã đổi theo đề xuất). 2027-05 không muộn hơn het_han sớm nhất của bài (n13: 2027-11-01).'
    review: sai
doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: '"…và dữ liệu CDC YRBS nói gì."'
    moi: '"…dữ liệu CDC YRBS nói gì, và số liệu quốc gia của Việt Nam."'
    ly_do: Trang nay có số liệu NAMHS (Việt Nam). (nhận định n1)
  - cu: '"…sức khỏe tâm thần của teen xấu đi là có thật (dữ liệu không thể chối cãi)… một trong những tranh luận khoa học ồn ào nhất thập kỷ".'
    moi: '"…ở Mỹ, tỉ lệ teen báo cáo buồn bã dai dẳng đã tăng rõ trong thập kỷ 2010 (số liệu khảo sát đại diện quốc gia)… một tranh luận khoa học đang diễn ra".'
    ly_do: Bỏ "không thể chối cãi", "ồn ào nhất thập kỷ"; chỉ nói về teen Mỹ và tự báo cáo. (nhận định n2)
  - cu: '"Jonathan Haidt, nhà tâm lý học xã hội tại Đại học New York, xuất bản năm 2024… từ khoảng 2010–2015, tuổi thơ của trẻ em phương Tây đã bị "đại tu sửa"… từ tuổi thơ chơi tự do ngoài đời thực sang tuổi thơ gắn với điện thoại."'
    moi: '"Nhà tâm lý học Jonathan Haidt xuất bản năm 2024… sự trỗi dậy của smartphone và mạng xã hội, cùng với sự suy giảm tự lập và chơi tự do, đã "đại tu sửa" tuổi thơ… Ông nói về giai đoạn biến đổi 2010–2015."'
    ly_do: Bỏ "nhà tâm lý học xã hội tại ĐH New York" và "trẻ em phương Tây" (không có trong nguồn đã mở); theo chữ của trang sách. (nhận định n3)
  - cu: '"…từ khoảng 2010–2015…".'
    moi: '"…ông nói về giai đoạn biến đổi 2010–2015".'
    ly_do: 'Làm mềm: bắt nguồn từ một trích dẫn qua nguồn bậc 3, không phải sách. (nhận định n4)'
  - cu: '"Điểm gãy ông nhấn mạnh là khoảng năm 2012, khi đa số teen Mỹ đã sở hữu smartphone."'
    moi: (bỏ)
    ly_do: Không kiểm được. (nhận định n5)
  - cu: '"Haidt liệt kê bốn tổn hại nền tảng… (1) tước đoạt xã hội — tương tác trực tiếp bị thay bằng kết nối nông trên mạng; (2) thiếu ngủ — dùng điện thoại khuya; (3) phân mảnh chú ý — thông báo liên tục; (4) nghiện — thuật toán tối ưu cho thời gian dùng." (và ở mục Lý thuyết: ánh sáng xanh, rèn não chuyển đổi tác vụ…)'
    moi: '"Theo mô tả của sách (chúng tôi không mở được sách gốc), Haidt nêu bốn tổn hại nền tảng: … Đây là các giả thuyết cơ chế của Haidt; chúng tôi chưa kiểm các cơ chế cụ thể bằng nguồn riêng."'
    ly_do: Bỏ các mô tả chi tiết cơ chế (không có nguồn đã mở). (nhận định n6)
  - cu: '"…10% đã từng cố tự tử (2021), 9% (2023)."'
    moi: '"…10% đã từng cố tự tử (2021), khoảng 9% (2023)."'
    ly_do: Báo cáo xu hướng làm tròn 9, MMWR nêu 9,5%; viết "khoảng". (nhận định n12)
  - cu: '"Lưu ý quan trọng: YRBS không hỏi gì về mạng xã hội" và "YRBS không đo việc dùng mạng xã hội".'
    moi: '"YRBS 2021 và các đợt trước không hỏi gì về nó; riêng đợt 2023 mới thêm câu hỏi về tần suất dùng".'
    ly_do: 'Sai với 2023: CDC đã thêm câu hỏi về mạng xã hội. (nhận định n15)'
  - cu: '"…nhưng CDC nhấn mạnh nhiều chỉ số đã xấu đi từ trước COVID."'
    moi: '"…báo cáo của CDC nêu nhiều chỉ số xấu đi từ 2013 đến 2023, và ở nhiều chỉ số (như buồn bã dai dẳng) số liệu đã tăng từ trước 2021 (30% năm 2013, 37% năm 2019)."'
    ly_do: CDC không "nhấn mạnh" trước COVID; câu mới dựa trên số liệu bảng. (nhận định n17)
  - cu: '"…tổng cộng 355.358 vị thành niên, dữ liệu 2007–2016. … chạy mọi đặc tả phân tích hợp lý và báo cáo toàn bộ".'
    moi: '"…355.358 vị thành niên (chủ yếu 12–18 tuổi), khảo sát trong các năm 2007–2016… chạy nhiều đặc tả phân tích hợp lý và báo cáo kết quả".'
    ly_do: '"Mọi" và "toàn bộ" mạnh hơn nguồn (nguồn nói SCA áp dụng cho các đặc tả hợp lý). (nhận định n18)'
  - cu: '"…tương đương với... ăn khoai tây; đeo kính cận còn "có hại" hơn." và "ăn khoai tây thường xuyên cho liên hệ tương đương, đeo kính cận còn tệ hơn".'
    moi: '"…ăn khoai tây cho liên hệ nhỏ tương tự và đeo kính còn "tệ hơn"." và "(ở YRBS, β −0,042 so với −0,049 của công nghệ số), đeo kính còn "tệ hơn" ở một bộ dữ liệu".'
    ly_do: '"Tương đương" thành "gần bằng" kèm số; "kính cận" thành "kính" (nguồn: wearing glasses). (nhận định n20)'
  - cu: '"bị bắt nạt có liên hệ tiêu cực gấp 4,3 lần, hút cần sa gấp 2,7 lần" (không nêu so với cái gì, bộ dữ liệu nào).'
    moi: '"…(trong bộ YRBS) bị bắt nạt có liên hệ tiêu cực với sức khỏe tinh thần gấp 4,3 lần và hút cần sa gấp 2,7 lần so với mức liên hệ của công nghệ số".'
    ly_do: Nêu rõ mẫu số và bộ dữ liệu. (nhận định n21)
  - cu: '"…phe phê bình cho rằng "mạng xã hội 2024" khác hẳn "màn hình 2012"."'
    moi: '"…nên có thể khác với việc dùng mạng xã hội hiện nay (đây là hạn chế do chúng tôi nêu, không phải kết quả của nghiên cứu)."'
    ly_do: Không có nguồn đã mở nói phe phê bình đã nói vậy; giữ như suy luận của trang, ghi rõ. (nhận định n22)
  - cu: '"…theo dõi khoảng 12.000 teen qua nhiều năm".'
    moi: '"…(Anh, 2009–2016) — hơn 12.000 teen 10–15 tuổi tham gia (số người trong mỗi phân tích ít hơn nhiều)…".'
    ly_do: 12.672 tham gia nhưng mỗi phân tích có n = 539–5.492. (nhận định n23)
  - cu: '"…(β từ -0,04 đến -0,09), nhưng chiều ngược lại cũng đúng… Hiệu ứng ở nữ hơi rõ hơn nam, nhưng vẫn nhỏ".'
    moi: '"…(β từ -0,04 đến -0,09 ở các mục hài lòng có ý nghĩa; hệ số trung vị -0,05)… (hệ số trung vị -0,02). Hiệu ứng ở nữ hơi rõ hơn nam (nữ có tác động ở hầu hết các mục hài lòng, nam chỉ ở hai)".'
    ly_do: Thêm hệ số trung vị và mô tả sự khác biệt giới theo nguồn. (nhận định n24)
  - cu: '"Nói như Przybylski: 99,75% mức hài lòng… không liên quan…".'
    moi: (bỏ)
    ly_do: Không kiểm được. (nhận định n25)
  - cu: '"…trùng với thời điểm dậy thì (nữ dậy thì sớm hơn nam)."'
    moi: '"Các tác giả suy đoán rằng cửa sổ sớm có thể liên quan đến dậy thì… nhưng dữ liệu không đo dậy thì nên chưa kiểm được."'
    ly_do: Nguồn nêu là suy đoán ("speculatively"). (nhận định n28)
  - cu: '"…khủng hoảng là có thật, không phải ảo giác truyền thông." và tiêu đề "sức khỏe tâm thần của teen (Mỹ) xấu đi rõ rệt trong thập kỷ 2010".'
    moi: '"…mức tự báo cáo tăng là có thật, nhưng đó là tự báo cáo triệu chứng, không phải chẩn đoán, và nó chỉ nói về teen Mỹ." Số liệu thêm 2025: 33%.'
    ly_do: Bỏ "khủng hoảng" và "ảo giác truyền thông" (cách nói mạnh); thêm giới hạn và số 2025. (nhận định n30)
  - cu: '"Nghiên cứu lớn nhất… cho tối đa 0,4% phương sai; các nghiên cứu dọc cho hệ số β khoảng -0,04 đến -0,13… Lưu ý: … dữ liệu chủ yếu từ trước kỷ nguyên video ngắn."'
    moi: '"…Một phân tích tổng hợp 2026 trên 153 nghiên cứu dọc… thấy mạng xã hội liên hệ nhất quán nhưng khiêm tốn… (r = 0,09–0,21)… phần lớn dữ liệu từ trước kỷ nguyên video ngắn."'
    ly_do: 'Thêm phân tích tổng hợp 2026 (nguồn bắt buộc của lời giao: các phân tích tổng hợp mới). (nhận định n31)'
  - cu: '"Haidt (2024) nói có, dựa trên trùng khớp thời điểm (~2012), cơ chế hợp lý (ngủ, so sánh, bắt nạt) và dữ liệu nhiều nước. Giới nghiên cứu chuyên sâu phản biện: … nhiều giải thích khác chưa loại trừ được (đại dịch, áp lực học tập, bất bình đẳng, lo âu khí hậu, thay đổi cách hỏi khảo sát)."'
    moi: '"Haidt (2024) cho rằng có. Các nhà nghiên cứu như Odgers (Nature, 2024) phản biện, theo các tóm tắt thứ cấp… Một phân tích tổng hợp 2026 thấy liên hệ nhỏ nhưng nhất quán, và nhóm Orben thấy hiệu ứng trung bình nhỏ và hai chiều."'
    ly_do: Bỏ "dựa trên…" và danh sách giải thích khác (không kiểm được). (nhận định n33)
  - cu: '"Giới nghiên cứu chuyên sâu phản biện: bằng chứng nhân quả còn yếu, hiệu ứng đo được nhỏ…"'
    moi: '"Các nhà nghiên cứu như Odgers (Nature, 2024) phản biện, theo các tóm tắt thứ cấp mà chúng tôi đọc được (chưa mở bản gốc): …"'
    ly_do: Gán cho một người phản biện cụ thể với nguồn nói rõ thứ cấp; bỏ "giới nghiên cứu chuyên sâu" (không kiểm được). (nhận định n34)
  - cu: '"…ra khuyến cáo thận trọng: mạng xã hội có cả lợi và hại, cần thêm dữ liệu từ chính các công ty công nghệ."'
    moi: '"…mạng xã hội có thể có cả lợi và hại, và cần thêm dữ liệu từ chính các công ty công nghệ (theo trang của HHS, chúng tôi chỉ đọc được đoạn trích)."'
    ly_do: Làm mềm vì nguồn chưa mở trực tiếp. (nhận định n35)
  - cu: '"…cửa sổ nhạy cảm quanh tuổi dậy thì (nữ 11–13, nam 14–15) có bằng chứng dọc; nội dung độc hại (bắt nạt mạng, nội dung cổ vũ tự hại, so sánh ngoại hình) là rủi ro thật với nhóm dễ tổn thương."'
    moi: '"…phân tích tổng hợp 2026 thấy mạng xã hội liên hệ nhất quán với trầm cảm và ý nghĩ tự hại ở mức nhỏ (r = 0,09–0,21), và Orben và cộng sự (2022) thấy một nghiên cứu dọc có các độ tuổi…".'
    ly_do: Bỏ "nội dung độc hại… rủi ro thật" (không có nguồn đã mở); thay bằng nguồn đọc được. (nhận định n36)
  - cu: '"Mô hình nhạy cảm khác biệt (differential susceptibility)… Tuổi dậy thì (não bộ đang tái cấu trúc mạnh, nhạy cảm với đánh giá xã hội), giới tính, tính cách (hay lo âu, cầu toàn) và môi trường gia đình đều có thể khuếch đại hoặc giảm nhẹ tác động."'
    moi: '"Mức độ nhạy cảm khác nhau giữa các nhóm… Orben và cộng sự (2022) thấy các cửa sổ nhạy cảm khác nhau theo tuổi và giới. Các yếu tố khác… chúng tôi chưa có nguồn đã mở…, nên chỉ nêu như một khả năng."'
    ly_do: Bỏ tên "differential susceptibility" và các yếu tố không có nguồn. (nhận định n37)
  - cu: '"…Hai teen cùng lướt 3 tiếng/ngày có thể đang làm hai việc hoàn toàn khác: … Nghiên cứu tương lai cần đo cách dùng… và cần dữ liệu thực từ công ty công nghệ thay vì tự báo cáo."'
    moi: '"…Các nghiên cứu ở trên dùng ước lượng thời gian dùng do teen tự báo cáo (Orben và cộng sự, 2022)… nghiên cứu tương lai có thể đo cách dùng…".'
    ly_do: Bỏ "cần dữ liệu thực từ công ty" (không có nguồn mở); nêu bằng chứng về tự báo cáo. (nhận định n38)
  - cu: '"Hầu hết dữ liệu là cắt ngang… buồn cũng dẫn đến dùng nhiều hơn (trốn tránh, tìm đồng cảm)… loại nghiên cứu này còn rất ít."'
    moi: '"Dữ liệu cắt ngang… Dữ liệu dọc… cho thấy cả hai chiều đều tồn tại… Theo Orben và cộng sự (2022), các phân tích tổng hợp thấy liên hệ nhỏ hoặc không đáng kể và bằng chứng thực nghiệm còn lẫn lộn".'
    ly_do: Bỏ "trốn tránh, tìm đồng cảm" (cơ chế, không kiểm được) và "còn rất ít" (nguồn nói "mixed"). (nhận định n39)
  - cu: '":nhan[kha-vung] "Số giờ màn hình liên hệ yếu với sức khỏe tinh thần; cách dùng mới quan trọng. Dấu hiệu đáng lo… so sánh bản thân liên tục, bị bắt nạt/bình luận độc hại, xem nội dung cổ vũ tự hại hoặc rối loạn ăn uống, và dùng điện thoại để trốn tránh mọi cảm xúc khó chịu."'
    moi: '"Theo Orben và Przybylski (2019), số giờ… liên hệ yếu… Chúng tôi chưa có nghiên cứu đã mở cho thấy "cách dùng" quan trọng hơn "số giờ"; hỏi con đang xem gì… là thông lệ hợp lý, không phải kết quả của một nghiên cứu cụ thể."'
    ly_do: Bỏ "cách dùng mới quan trọng" và danh sách "dấu hiệu đáng lo" (không có nguồn; gần với dấu hiệu lâm sàng). (nhận định n40)
  - cu: '"Trong cùng bộ dữ liệu của Orben và Przybylski, ngủ đủ giấc liên hệ… mạnh hơn hẳn thời gian dùng màn hình." (tiêu đề "…là can thiệp rẻ và chắc chắn nhất", chip vững chắc)'
    moi: '"…(ở YRBS: β 0,150 so với −0,049). Đó là liên hệ quan sát, chưa chứng minh rằng ngủ đủ giấc cải thiện sức khỏe tinh thần." Tiêu đề "Bảo vệ giấc ngủ là một việc đáng làm", chip khá vững, giữ id cũ.'
    ly_do: '"Can thiệp… chắc chắn nhất" không có nguồn (chỉ liên hệ quan sát); hạ Vững chắc → Khá vững. (nhận định n42)'
  - cu: '"Quy tắc đơn giản, dễ thực hiện: điện thoại sạc ngoài phòng ngủ, không lướt trước giờ ngủ 30–60 phút."'
    moi: '"Quy tắc cụ thể… là thông lệ thực hành, chưa phải kết quả của nghiên cứu mà chúng tôi đã kiểm."'
    ly_do: Nêu rõ không có nguồn. (nhận định n43)
  - cu: '":nhan[vung-chac]" cho "Bảo vệ giấc ngủ là can thiệp rẻ và chắc chắn nhất".'
    moi: '":nhan[kha-vung]" cho "Bảo vệ giấc ngủ là một việc đáng làm".'
    ly_do: Chỉ có liên hệ quan sát từ một bài; không đạt "Vững chắc". (nhận định n44)
  - cu: '"Cửa sổ nhạy cảm… là lúc não bộ nhạy cảm nhất với đánh giá xã hội. Đây là giai đoạn nên trò chuyện nhiều hơn về so sánh trên mạng, áp lực ngoại hình và bắt nạt mạng — thay vì chỉ ra lệnh cấm."'
    moi: '"…đây là một nghiên cứu dọc ở Anh, và các tác giả chỉ suy đoán về dậy thì. Một gợi ý thực hành hợp lý (không phải kết quả của nghiên cứu): … trò chuyện với con về những điều con gặp trên mạng có thể hữu ích hơn chỉ ra lệnh cấm."'
    ly_do: Bỏ "não bộ nhạy cảm nhất với đánh giá xã hội" (không có nguồn đã mở). (nhận định n45)
  - cu: '":nhan[vung-chac]" "Buồn bã kéo dài trên hai tuần, mất hứng thú với mọi thứ, nói về cái chết hoặc tự làm hại mình — đó là lúc cần bác sĩ tâm thần/nhà tâm lý… Tại Việt Nam, gọi 115 khi khẩn cấp. Trầm cảm tuổi teen là bệnh lý có thể điều trị được."'
    moi: '"Nếu một bạn trẻ buồn bã kéo dài, mất hứng thú, nói về cái chết hoặc tự làm hại mình, đó là lúc cần người có chuyên môn… Chỉ chuyên gia mới chẩn đoán được… Xem [Hỗ trợ]." Tiêu đề "Khi lo về trầm cảm hoặc tự hại: tìm người có chuyên môn", bỏ chip, giữ id cũ.'
    ly_do: Bỏ "hai tuần" (dạng tiêu chí chẩn đoán), "bệnh lý có thể điều trị được" (WHO fact sheet không nói điều đó), số 115 (dẫn Hỗ trợ theo lời giao). (nhận định n47)
  - cu: '"hãy gọi ngay 115 (cấp cứu)… Trầm cảm là bệnh lý có thể điều trị được"; "…gọi 115 khi khẩn cấp hoặc tìm bác sĩ tâm thần/nhà tâm lý."'
    moi: '"hãy nói ngay với người bạn tin cậy, thầy cô hoặc người có chuyên môn… xem Hỗ trợ… Tìm giúp đỡ là dấu hiệu của sức mạnh."'
    ly_do: 'Theo lời giao: dẫn Hỗ trợ; bỏ "bệnh lý có thể điều trị được" và số 115. (nhận định n48)'
  - cu: '"Chưa có khảo sát quy mô quốc gia kiểu YRBS cho teen Việt Nam".'
    moi: '"Việt Nam có các khảo sát quốc gia riêng, đo khác nên không so trực tiếp được: NAMHS (2021…)".'
    ly_do: 'Sai: có khảo sát quốc gia (NAMHS 2021; cũng GSHS Việt Nam 2019 theo một nghiên cứu về bạo lực học đường, chưa dùng trên trang). (nhận định n50)'
  - cu: (không có)
    moi: '"Số này thấp so với tỉ lệ buồn bã tự báo cáo ở Mỹ, nhưng đó là hai cách đo khác nhau… nên không thể kết luận teen Việt "khỏe hơn" hay "ít buồn hơn"."'
    ly_do: Câu mới thêm để không để lại ấn tượng sai khi đặt số Mỹ và số Việt cạnh nhau. (nhận định n51)
  - cu: '"…khảo sát trực tuyến 1.891 vị thành niên ở Hà Nội, Tuyên Quang và Cần Thơ…: FOMO và việc dùng Internet có vấn đề cùng đi kèm nguy cơ tự hại/tự tử cao hơn."'
    moi: '"…khảo sát trực tuyến 1.891 người tham gia… (tháng 9–10/2021; tuổi trung bình 17)… đi kèm với tự hại/tự tử."'
    ly_do: '"Vị thành niên" → "người tham gia" (tuổi trung bình 17, SD 2,8); bỏ "nguy cơ cao hơn" (nguồn nói "yếu tố dương"). (nhận định n52)'
  - cu: '"Một nghiên cứu tại Đại học Thương mại (chấp nhận đăng cuối 2024) dùng thang BSMAS trên teen 13–18 tuổi… mẫu thuận tiện".'
    moi: '"…(Vũ Thị Thúy Hằng và Nguyễn Thị Vân, công bố 25/12/2024 trên VNU Journal of Economics and Business) dùng thang BSMAS trên 13–17 tuổi, chọn mẫu theo kiểu quả cầu tuyết…". Danh mục nguồn đã sửa.'
    ly_do: Nơi đăng là VNU Journal of Economics and Business (không phải "Đại học Thương mại"); tuổi 13 đến dưới 18; mẫu quả cầu tuyết, không phải "thuận tiện". (nhận định n53)
  - cu: '"…tất cả đều là nghiên cứu cắt ngang, mẫu thuận tiện…"'
    moi: '"…các nghiên cứu này là cắt ngang, mẫu không đại diện, và đo bằng bảng hỏi trực tuyến…"'
    ly_do: Phân biệt với khảo sát quốc gia NAMHS; mẫu thuận tiện → không đại diện. (nhận định n54)
  - cu: '"…chúng ta chưa có dữ liệu dọc đủ tốt để trả lời."'
    moi: '"Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu dọc đủ lớn…".'
    ly_do: 'Quy tắc câu thời sự: mốc, hạn, nguồn là lần tìm. (nhận định n55)'
  - cu: '"TikTok và video ngắn chiếm vị trí áp đảo trong thời gian online của teen Việt… áp lực học tập và kỳ vọng gia đình là nguồn stress lớn được ghi nhận trong nhiều khảo sát trong nước."'
    moi: '"…chúng tôi không có nguồn đã mở về tỉ trọng TikTok… áp lực học tập là một yếu tố có thể liên quan (xem [Bắt nạt và áp lực thi cử]), nhưng đó là giả thuyết."'
    ly_do: Không kiểm được; thêm liên kết trang nội bộ. (nhận định n56)
  - cu: '"Dữ liệu dọc cho thấy chiều ngược lại cũng đúng: teen đang buồn có xu hướng chui vào mạng xã hội nhiều hơn."'
    moi: '"Dữ liệu dọc của Orben và cộng sự cho thấy chiều ngược lại cũng đúng: hài lòng với cuộc sống giảm dự báo dùng mạng xã hội nhiều hơn sau đó."'
    ly_do: '"Chui vào mạng xã hội" (động cơ) không có trong nguồn; hài lòng là biến đo. (nhận định n57)'
  - cu: '"Ở quy mô hàng chục triệu teen, hiệu ứng nhỏ vẫn tạo ra số ca đáng kể ở mức cộng đồng; và "trung bình nhỏ" che giấu nhóm dễ tổn thương (tuổi dậy thì, đã có sẵn lo âu/trầm cảm) — với các em, hiệu ứng không hề nhỏ."'
    moi: '"…các phân tích tổng hợp thấy liên hệ nhỏ nhưng nhất quán, và Orben và cộng sự (2022) thấy các độ tuổi mà hiệu ứng rõ hơn một chút. Chúng tôi chưa có nguồn nói rằng với một số nhóm, hiệu ứng "không hề nhỏ"."'
    ly_do: Bỏ tính toán "hàng chục triệu", "lo âu/trầm cảm có sẵn" (không có nguồn đã mở). (nhận định n58)
  - cu: '"Mạng xã hội cũng là nơi nhiều teen tìm thấy cộng đồng và sự hỗ trợ (bạn bè, nhóm sở thích, teen thuộc nhóm thiểu số khó chia sẻ ngoài đời). Cấm đoán cực đoan có thể lấy đi cả mặt tích cực mà không giải quyết được gốc rễ."'
    moi: '"Chưa có đủ bằng chứng thực nghiệm để nói cấm tiệt mạng xã hội cải thiện sức khỏe tâm thần… Chúng tôi không có nguồn đã mở về mặt tích cực cụ thể…, nên không khẳng định."'
    ly_do: Bỏ mặt tích cực cụ thể (không có nguồn đã mở). (nhận định n59)
  - cu: '"Trầm cảm là bệnh lý phức tạp (gen, môi trường, sang chấn, áp lực học tập...)… điều trị trầm cảm cần chuyên môn y tế — gọi 115…".'
    moi: '"Dữ liệu cho thấy liên hệ… là nhỏ và hai chiều, nên chỉ thu điện thoại khó là cả lời giải. Nếu lo về trầm cảm của một bạn trẻ, hãy tìm người có chuyên môn; xem Hỗ trợ."'
    ly_do: Bỏ danh sách nguyên nhân trầm cảm (không có nguồn) và số 115. (nhận định n60)
  - cu: '"…tương đương ăn khoai tây; bị bắt nạt và hút cần sa có liên hệ tiêu cực mạnh hơn nhiều lần." và lời giải thích "…giấc ngủ, bắt nạt, bữa sáng — liên hệ mạnh hơn hẳn."'
    moi: '"…trong cùng bộ dữ liệu, giấc ngủ, bắt nạt, bữa sáng liên hệ mạnh hơn hẳn."; lựa chọn đúng "…tương đương ăn khoai tây…" giữ (xem n20, nhỏ gần bằng).'
    ly_do: '"Tương đương" khoai tây hơi mạnh (−0,042 so với −0,049): giữ vì là cách nói tắt trong câu hỏi, nhưng lời giải thích nêu "trong cùng bộ dữ liệu". (nhận định n62)'
  - cu: '"Vì YRBS không hỏi gì về việc dùng mạng xã hội — nó chỉ cho thấy khủng hoảng sức khỏe tâm thần có thật…"'
    moi: '"Vì đợt YRBS 2021 không hỏi gì về việc dùng mạng xã hội — nó chỉ cho thấy mức buồn bã tự báo cáo tăng…"'
    ly_do: Xem n15, n2; câu hỏi đổi "năm 2021". (nhận định n63)
  - cu: '"Dữ liệu dọc cho thấy teen đang buồn có xu hướng dùng mạng xã hội NHIỀU hơn" và lựa chọn đúng "…teen buồn tìm đến mạng xã hội để trốn tránh hoặc tìm đồng cảm…".'
    moi: '"Dữ liệu dọc cho thấy hài lòng với cuộc sống giảm dự báo dùng mạng xã hội nhiều hơn…" và lựa chọn đúng bỏ "để trốn tránh hoặc tìm đồng cảm".'
    ly_do: Bỏ động cơ (không có nguồn); chữ "buồn" thay bằng biến đo. (nhận định n65)
  - cu: '"…gây ra một cuộc khủng hoảng sức khỏe tâm thần ở trẻ em và teen; ông nói về giai đoạn biến đổi 2010–2015. Theo mô tả của sách (chúng tôi không mở được sách gốc), Haidt nêu bốn tổn hại nền tảng của "tuổi thơ gắn điện thoại": tước đoạt xã hội…, thiếu ngủ…, phân mảnh chú ý… và nghiện…"'
    moi: '"…gây ra một cuộc khủng hoảng sức khỏe tâm thần ở trẻ em và teen. Theo các đoạn trích sách trong bài điểm sách của Odgers (2024) (chúng tôi không mở được sách gốc), Haidt cho rằng các công ty công nghệ đã "tái cấu trúc" tuổi thơ bằng một "vòi rồng" nội dung gây nghiện và bằng việc thay thế chơi đùa, gặp gỡ trực tiếp."'
    ly_do: "Review: mốc 2010–2015 và danh sách bốn tổn hại chỉ có nguồn bậc 3 (Wikipedia), trái chuẩn mục 2; trang sách và trang nhà xuất bản không nêu. Thay bằng điều bài Nature của Odgers trích từ sách. (nhận định n4, n6)"
  - cu: 'Mục Lý thuyết: "Bốn tổn hại nền tảng của Haidt. Theo mô tả của sách…, Haidt nêu bốn con đường: tước đoạt xã hội…, thiếu ngủ, phân mảnh chú ý và nghiện. Đây là các giả thuyết cơ chế của Haidt; chúng tôi chưa kiểm các cơ chế cụ thể (như ánh sáng xanh hay thuật toán) bằng nguồn riêng."'
    moi: '"Các cơ chế Haidt nêu. Theo các đoạn trích trong bài điểm sách của Odgers (2024), Haidt nêu nội dung gây nghiện và việc thời gian online thay thế chơi đùa, gặp gỡ trực tiếp. Đây là các giả thuyết cơ chế của Haidt; Odgers cho rằng chúng chưa được khoa học ủng hộ. Chúng tôi chưa mở được sách để kiểm danh sách đầy đủ các cơ chế."'
    ly_do: "Review: như trên. (nhận định n6)"
  - cu: '"22% từng nghiêm túc nghĩ đến việc tự tử (nữ 30%, nam 14%), 10% đã từng cố tự tử." và "Từng nghiêm túc nghĩ đến tự tử: 22% (2021)…; 10% đã từng cố tự tử (2021), khoảng 9% (2023)."'
    moi: '"Cũng trong 12 tháng trước khảo sát, 22% đã nghiêm túc nghĩ đến việc tự tử (nữ 30%, nam 14%) và 10% đã cố tự tử." và "Nghiêm túc nghĩ đến tự tử trong 12 tháng qua: 22% (2021)…; cố tự tử trong 12 tháng qua: 10% (2021), khoảng 9% (2023)."'
    ly_do: 'Review (lượt 2 sai): câu hỏi YRBS là "during the past 12 months", không phải "từng" (cả đời). (nhận định n10, n12)'
  - cu: '"…xem [Hỗ trợ](/psyche/ho-tro/) để biết nơi liên hệ. Tìm giúp đỡ là dấu hiệu của sức mạnh, không phải yếu đuối."'
    moi: '"…xem [Hỗ trợ](/psyche/ho-tro/) để biết nơi liên hệ."'
    ly_do: "Review: câu cuối không có nguồn. (nhận định n48)"
  - cu: '"### CDC YRBS (2021, 2023): khủng hoảng là có thật, thủ phạm thì chưa rõ" và khung ":::vung-chac[sức khỏe tâm thần tự báo cáo của teen (Mỹ) xấu đi rõ rệt trong thập kỷ 2010]" … "Đây là dữ liệu khảo sát đại diện quốc gia, nhất quán qua nhiều đợt: mức tự báo cáo tăng là có thật, nhưng…"'
    moi: '"### CDC YRBS (2021, 2023): buồn bã tự báo cáo tăng, thủ phạm thì chưa rõ { #cdc-yrbs-2021-2023-khung-hoang-la-co-that-thu-pham-thi-chua-ro }" và ":::kha-vung[…cùng ý chính…]" … "Nhãn chỉ là "khá vững" vì chúng tôi mới dựa vào một hệ thống khảo sát của một nước (chưa đối chiếu các khảo sát khác hay phân tích tổng hợp), và đây là tự báo cáo triệu chứng, không phải chẩn đoán."'
    ly_do: 'Review: Vững chắc đòi phân tích tổng hợp hay hai tái lập lớn và nhiều quần thể; ở đây chỉ có YRBS (một nước). "Khủng hoảng là có thật" mạnh hơn điều trang đo (tự báo cáo). Id cũ giữ. (nhận định n30)'
  - cu: '"…thấy mạng xã hội liên hệ nhất quán nhưng khiêm tốn với trầm cảm, hành vi và ý nghĩ tự hại (r = 0,09–0,21)."'
    moi: '"…thấy mạng xã hội liên hệ nhất quán với trầm cảm, các vấn đề hành vi và ý nghĩ tự hại, ở mức nhỏ (r = 0,09–0,21)."; mục Nguồn: link DOI 10.1001/jamapediatrics.2026.0085, tên bài theo tóm tắt.'
    ly_do: 'Review: tóm tắt Teague 2026 viết "consistently associated with risks", không nói "khiêm tốn"; "nhỏ" là cách đọc r của trang. (nhận định n32)'
  - cu: '"Các nhà nghiên cứu như Odgers (Nature, 2024) phản biện, theo các tóm tắt thứ cấp mà chúng tôi đọc được (chưa mở bản gốc): phần lớn bằng chứng thực nghiệm không thấy hiệu ứng lớn hay nhất quán, và quan hệ ngược chiều có thể giải thích tương quan."'
    moi: '"Các nhà nghiên cứu như Odgers (Nature, 2024, bài điểm sách) phản biện: việc tìm kiếm các hiệu ứng lớn như Haidt gợi ý cho ra một hỗn hợp liên hệ không có, nhỏ hoặc lẫn lộn, và khi thấy liên hệ theo thời gian thì chúng gợi ý rằng teen đã có vấn đề sức khỏe tâm thần dùng mạng xã hội nhiều hơn."; thêm Odgers (2024) vào mục Nguồn.'
    ly_do: 'Review mở được bài gốc: "Our efforts have produced a mix of no, small and mixed associations… they suggest … that young people who already have mental-health problems use such platforms more". (nhận định n34)'
  - cu: '"…mạng xã hội có thể có cả lợi và hại, và cần thêm dữ liệu từ chính các công ty công nghệ (theo trang của HHS, chúng tôi chỉ đọc được đoạn trích)."; Ngộ nhận: "Chúng tôi không có nguồn đã mở về mặt tích cực cụ thể (như cộng đồng cho nhóm thiểu số), nên không khẳng định."'
    moi: '"…mạng xã hội có thể có lợi cho một số teen nhưng cũng có dấu hiệu rủi ro gây hại, chưa đủ bằng chứng để nói nó đủ an toàn, và các công ty công nghệ cần chia sẻ dữ liệu cho nhà nghiên cứu độc lập."; "…với một số teen, nó mang lại cộng đồng và sự hỗ trợ từ bạn bè, nhất là với những nhóm hay bị gạt ra lề."; mục Nguồn thêm link PDF.'
    ly_do: 'Review đọc toàn văn khuyến cáo (bản lưu Internet Archive): "may have benefits for some children and adolescents, there are ample indicators that social media can also have a profound risk of harm… we do not yet have enough evidence to determine if social media is sufficiently safe"; "Ensure technology companies share data"; "positive community… especially important for youth who are often marginalized". (nhận định n35, n59)'
  - cu: '"…hỏi con đang xem gì và trò chuyện về những điều con gặp trên mạng (bị bắt nạt, so sánh bản thân, nội dung gây khó chịu) là thông lệ hợp lý, không phải kết quả của một nghiên cứu cụ thể."'
    moi: '"Tổng Y sĩ Mỹ (2023) khuyên gia đình lập một kế hoạch dùng phương tiện số, có thảo luận cởi mở về thời gian dùng và giới hạn nội dung, và nói với con về lợi ích và rủi ro của mạng xã hội; đó là khuyến cáo, chưa phải kết quả của một thử nghiệm mà chúng tôi đã kiểm."'
    ly_do: 'Review: lời khuyên không có nguồn; thay bằng khuyến cáo có nguồn ("Create a family media plan… open family discussion… content boundaries"; "Discuss with children the benefits and risks of social media"). (nhận định n40)'
  - cu: '"Quy tắc cụ thể như sạc điện thoại ngoài phòng ngủ hay không lướt trước giờ ngủ 30–60 phút là thông lệ thực hành, chưa phải kết quả của nghiên cứu mà chúng tôi đã kiểm."'
    moi: '"Tổng Y sĩ Mỹ (2023) khuyên cân nhắc hạn chế dùng điện thoại, máy tính bảng và máy tính ít nhất 1 giờ trước khi ngủ và suốt đêm, vì thiết bị điện tử có thể làm xao nhãng và ảnh hưởng đến giấc ngủ; đó là khuyến cáo, chưa phải kết quả của một thử nghiệm mà chúng tôi đã kiểm."'
    ly_do: 'Review: "30–60 phút" và "sạc ngoài phòng ngủ" không có nguồn; khuyến cáo có nguồn: "consider restricting the use of phones, tablets, and computers for at least 1 hour before bedtime and through the night". (nhận định n43)'
  - cu: '"### 3. Chú ý đặc biệt ở ngưỡng dậy thì :nhan[kha-vung]" … "Một gợi ý thực hành hợp lý (không phải kết quả của nghiên cứu): ở các độ tuổi này, trò chuyện với con về những điều con gặp trên mạng có thể hữu ích hơn chỉ ra lệnh cấm."'
    moi: '"### 3. Có thể có những độ tuổi nhạy cảm hơn { #3-chu-y-dac-biet-o-nguong-day-thi-kha-vung }" (bỏ chip) … "Đây mới là một nghiên cứu dọc ở Anh, chưa được lặp lại, và các tác giả chỉ suy đoán về dậy thì, nên chúng tôi không gắn nhãn cho phát hiện này. Phân tích tổng hợp 2026 cũng thấy liên hệ giữa mạng xã hội và trầm cảm mạnh hơn ở đầu tuổi vị thành niên (Teague và cộng sự, 2026)."'
    ly_do: 'Review: một nghiên cứu chưa tái lập không đạt Khá vững (lượt 2 quá mạnh), cũng không đạt Đang tranh cãi (không có bằng chứng trái chiều): bỏ chip. Lời so sánh "hữu ích hơn chỉ ra lệnh cấm" không có nguồn; thay bằng điều tóm tắt Teague 2026 nêu ("stronger in early adolescence"). Id cũ giữ. (nhận định n45, n46)'
  - cu: "Hồ sơ: nguồn wiki-ag (Wikipedia, bậc 3)"
    moi: (bỏ khỏi danh sách nguồn của hồ sơ)
    ly_do: "Review: không còn nhận định nào dùng; các chỗ dùng trước đây (n4, n6, n33, n34) đã bỏ hay thay bằng Odgers 2024 và khuyến cáo Surgeon General."
