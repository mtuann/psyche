    ghi_chu: 'Chữ cũ: các khẳng định về áp lực "con nhà người ta", "ngành hot", "cưới xin theo sắp đặt", và Đài Loan (Lee & Beckert 2012, dẫn theo Seginer & Mahajna 2018). Đã bỏ phần Đài Loan (không mở được nguồn) và viết lại thành giả thuyết. Lần tìm VN như nhận định trước. Review (Claude Opus 5.5, 10/11/2026): Câu nêu rõ là giả thuyết của trang, chưa có số liệu; không khẳng định điều cần nguồn. Giữ loại thoi-su (có mốc ở đoạn đầu mục, het_han).'
    luot_2: khong-chac
    luot_2_ghi_chu: 'Giả thuyết của site, chính câu tự ghi "chưa có số liệu Việt Nam"; không có nguồn để kiểm: không qua lượt 2.'
    review: dung
  - id: n46
    cau: 'Nguyễn và cộng sự (2020): 1.593 học sinh Việt Nam; sự ấm áp của cha mẹ gắn với trí tuệ cảm xúc cao hơn; bao bọc quá mức và độc đoán từ mẹ gắn với trí tuệ cảm xúc thấp hơn.'
    loai: so-lieu
    nguon:
      - nguyen2020
    trich: Results from 1,593 students revealed that boys had significantly higher overall EI... The warmth of parents during childhood was associated with higher EI, while overprotectiveness and authoritarianism from mothers were associated with lower EI among adolescents.
    vi_tri: Nguyen 2020, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đặc biệt từ mẹ", và suy luận "môi trường gia đình độc đoán… đất cho foreclosure". Chữ mới nêu "từ mẹ" và bỏ suy luận (nghiên cứu không đo bản sắc). Thêm "cắt ngang" (tóm tắt: cross-sectional school survey). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://api.crossref.org/works/10.1177/1066480719896558" ]
    luot_2_ghi_chu: Nguyen và cộng sự 2020, "Perceived Parenting Styles and Emotional Intelligence Among Adolescents in Vietnam" (DOI 10.1177/1066480719896558). Cắt ngang; câu dùng "gắn với".
    review: dung
  - id: n47
    cau: "Câu hỏi mở: việc trình bày bản thân trước nhiều nhóm người xem khác nhau có làm thay đổi cách teen thử nghiệm bản sắc không? Tính đến 11/2026 chưa mở được nghiên cứu nào trả lời câu hỏi này ở teen Việt Nam."
    loai: thoi-su
    nguon:
      - tim-vn-teen
    trich: '(không áp dụng: câu hỏi mở của trang)'
    het_han: '2028-11-01'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "teen Việt Nam hôm nay phải quản lý nhiều phiên bản mình… ngoan hiền trên Facebook… chất trên TikTok… thật lòng trong nhóm chat kín… biến thành lo âu thường trực… chưa có nghiên cứu Việt Nam nào đo lường". Chữ mới: câu hỏi mở. Lý do: các mô tả cụ thể và hệ quả lo âu không có nguồn đã mở. Trang Mạng xã hội và teen (phần 2) cùng chủ đề. Review (Claude Opus 5.5, 10/11/2026): Đồng ý lượt 2: vế "teen có thể trình bày bản thân khác nhau… và việc trình diễn trước khán giả có thể thay đổi cách thử nghiệm bản sắc" là khẳng định không có nguồn. Viết lại thành câu hỏi thật sự, giữ phần "chưa mở được nghiên cứu" (thời sự, mốc 11/2026 ở đầu mục); doi_chu.'
    luot_2: khong-chac
    luot_2_ghi_chu: Ý đầu (teen trình bày bản thân khác nhau theo bối cảnh/khán giả và việc đó đổi cách thử bản sắc) là khẳng định bằng chứng không dẫn nguồn nào, chưa mở được nguồn. Phần "chưa mở được nghiên cứu ở teen Việt" là tự thuật.
    review: sai
  - id: n48
    cau: 'Ngộ nhận "Khủng hoảng bản sắc là bệnh, phải chữa": theo Marcia, khủng hoảng là giai đoạn dấn thân chọn giữa các lựa chọn, không phải chẩn đoán.'
    loai: dinh-nghia
    nguon:
      - marcia1966
    trich: Crisis refers to the adolescent's period of engagement in choosing among meaningful alternatives
    vi_tri: Marcia 1966, mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "một phần bình thường, thậm chí cần thiết, của phát triển. Chỉ khi băn khoăn biến thành vòng lặp lo âu kéo dài kèm triệu chứng trầm cảm thì mới là vấn đề sức khỏe tâm thần" (ngưỡng nói như tiêu chí, không nguồn). Chữ mới và lời dẫn tới Hỗ trợ. Review (Claude Opus 5.5, 10/11/2026): Đọc lại toàn văn Marcia 1966 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus, tệp 10.1037%252Fh0023281.pdf trong zip 10.1037%252Fa0017364.zip): định nghĩa "crisis" như câu.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories", "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=3394234" ]
    luot_2_ghi_chu: Hợp với định nghĩa của Marcia (khám phá giữa các lựa chọn); diễn đạt nguyên văn của Marcia 1966 không mở được.
    review: dung
  - id: n49
    cau: 'Ngộ nhận "Theo ý cha mẹ thì không có bản sắc": foreclosure là một trạng thái bản sắc (có cam kết, chưa khủng hoảng); Meeus: early closure thích ứng thuộc nhóm tốt nhất; Marcia: cứng nhắc hơn.'
    loai: phat-hien
    nguon:
      - marcia1966
      - meeus2012
    trich: A foreclosure subject is distinguished by not having experienced a crisis, yet expressing commitment.
    vi_tri: Marcia 1966, mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Sai… Trong môi trường ổn định, nó vận hành tốt; điểm yếu là tính giòn trước biến động". Chữ mới theo Marcia và Meeus. Review (Claude Opus 5.5, 10/11/2026): Đọc lại toàn văn Marcia 1966 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus, tệp 10.1037%252Fh0023281.pdf trong zip 10.1037%252Fa0017364.zip): foreclosure "distinguished by not having experienced a crisis, yet expressing commitment"; "rigidity". Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=3394234", "https://api.openalex.org/works/doi:10.1037/h0023281" ]
    review: dung
  - id: n50
    cau: 'Ngộ nhận "Thử nhiều thứ chứng tỏ không quyết đoán": moratorium khác diffusion ở "an active struggle to make commitments".'
    loai: phat-hien
    nguon:
      - marcia1966
    trich: he is distinguished from the identity-diffusion subject by the appearance of an active struggle to make commitments
    vi_tri: Marcia 1966, mở bài
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "đang chủ động thu hẹp các lựa chọn — đó là quyết đoán đang trong quá trình hình thành". Chữ mới theo câu của Marcia. Review (Claude Opus 5.5, 10/11/2026): Đọc lại toàn văn Marcia 1966 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus, tệp 10.1037%252Fh0023281.pdf trong zip 10.1037%252Fa0017364.zip): "an active struggle to make commitments" có nguyên văn. Khớp.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=3394234" ]
    luot_2_ghi_chu: Trích dẫn nguyên văn "an active struggle to make commitments" (Marcia) không tìm thấy trong nguồn đã mở (Meeus 2012 chỉ nói "active exploration and has made no commitment, or at best an unclear one"); sự phân biệt moratorium–diffusion (khám phá so với chưa cam kết) thì khớp.
    review: dung
