    ly_do: "Phân tích tổng hợp 124 nghiên cứu (Kroger 2010) dùng sẵn khung bốn trạng thái nhưng không kiểm tra tính phân biệt của chúng; xác nhận trực tiếp (quỹ đạo phân biệt, tương đối ổn định) mới có ở một nghiên cứu dọc (Meeus 2012, 1.313 teen Hà Lan); nghiên cứu gốc nhỏ (86 nam sinh viên). Nhiều nghiên cứu cùng chiều, mẫu đã đọc chủ yếu Mỹ và Hà Lan, chưa có tái lập lớn: Khá vững."
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đã được tái hiện trong hàng trăm nghiên cứu trên nhiều quốc gia… một trong những khung… được kiểm chứng kỹ nhất". Chữ mới theo nguồn. Chỗ khó: Vững chắc cần "đúng ở nhiều quần thể"; chỉ có Mỹ và Hà Lan đã đọc: review cân nhắc có nên hạ Khá vững. Review (Claude Opus 5.5, 10/11/2026): Lượt 1 nêu sát ranh. Vững chắc cần tổng hợp hay tái lập lớn ủng hộ đúng mệnh đề và đúng ở nhiều quần thể; Kroger 2010 là tổng hợp về thay đổi trạng thái (dùng sẵn khung), không kiểm "có thật và đo được"; chữ "có thật" mạnh hơn nguồn. Hạ xuống Khá vững, viết lại ý chính, thêm giới hạn; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=3394234", "https://europepmc.org/article/MED/20004962" ]
    luot_2_ghi_chu: Nhãn Vững chắc có phân tích tổng hợp (Kroger 2010) và nghiên cứu dọc lớn (Meeus 2012); hợp thước đo cho mệnh đề "có thật và đo được".
    review: sai
  - id: n30
    cau: 'Khung Vững chắc: bản sắc chín dần đến tận tuổi 20+, không xong trước 18.'
    loai: nhan
    nguon: &id002
      - kroger2010
      - meeus2012
      - luyckx2013
    nhan: vung-chac
    co_so: *id002
    ly_do: Phân tích tổng hợp 124 nghiên cứu (Kroger 2010) cùng chiều với nghiên cứu dọc Hà Lan (Meeus 2012) và khảo sát cắt ngang 5.834 người (Luyckx 2013, cam kết tăng đến 30 tuổi). Nhiều nguồn và có phân tích tổng hợp; dữ liệu đến khoảng 30 tuổi.
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Không có deadline…", nghiên cứu Hà Lan cũng "cho thấy… di chuyển qua lại". Chữ mới tách phần của từng nguồn. Chỗ khó: như khung trên (quần thể). Review (Claude Opus 5.5, 10/11/2026): Nhãn Vững chắc đạt thước đo mục 4: phân tích tổng hợp 124 nghiên cứu kiểm trực tiếp sự thay đổi theo tuổi (Kroger 2010: "large mean proportions of samples were not identity achieved by young adulthood"), cùng chiều với nghiên cứu dọc Hà Lan và khảo sát 5.834 người; không có kết quả ngược. Giới hạn về quần thể (phương Tây) và tuổi (đến khoảng 30) chưa có trong khung: review thêm một câu giới hạn; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/20004962", "https://api.crossref.org/works/10.1111/sode.12027" ]
    luot_2_ghi_chu: Vững chắc có phân tích tổng hợp và mẫu lớn; hợp thước đo.
    review: dung
  - id: n31
    cau: 'Khung Khá vững: có cam kết đi cùng thích ứng tốt hơn; kẹt trong khám phá nhai lại đi cùng trầm cảm nhiều hơn.'
    loai: nhan
    nguon: &id003
      - meeus2012
      - luyckx2013
    nhan: kha-vung
    co_so: *id003
    ly_do: 'Một nghiên cứu dọc (1.313 teen Hà Lan) và một khảo sát cắt ngang (5.834 người) cùng chiều; đều là tương quan, ở mẫu phương Tây; chưa có phân tích tổng hợp được đọc: Khá vững.'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Các tổng quan nghiên cứu cho thấy hạnh phúc cao nhất ở các trạng thái có cam kết (achievement, foreclosure) và thấp nhất ở các trạng thái chưa cam kết; căng thẳng tâm lý thì ngược lại". Chữ mới: Meeus 2012 và Luyckx 2013 (ít trầm cảm và phạm pháp; không có "hạnh phúc"). Lý do: không mở được tổng quan nào về hạnh phúc theo trạng thái. Review (Claude Opus 5.5, 10/11/2026): Nhãn Khá vững đạt thước đo (một nghiên cứu dọc và một khảo sát cắt ngang, tương quan).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/22089632", "https://api.crossref.org/works/10.1111/sode.12027" ]
    luot_2_ghi_chu: Khá vững hợp lý (đa số nghiên cứu cùng chiều nhưng cắt ngang, mẫu châu Âu).
    review: dung
  - id: n32
    cau: 'Khung Đang tranh cãi: hoãn quyết định để thử (moratorium) là tốt hay xấu, và foreclosure có tệ như ta tưởng?'
    loai: nhan
    nguon: &id004
      - meeus2012
      - marcia1966
      - luyckx2013
    nhan: tranh-cai
    co_so: *id004
    ly_do: 'Meeus 2012: moratorium có nhiều trầm cảm hơn achievement và early closure, early closure thích ứng thuộc nhóm tốt nhất; Marcia 1966: foreclosure đặt mục tiêu cao hơn mức đạt được, độc đoán hơn, cứng nhắc; kết quả khác chiều giữa hai nghiên cứu; chưa có tái lập: Đang tranh cãi.'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "moratorium bình thường, thậm chí cần thiết (khoảng lùi Erikson)… ranh giới chủ động thử hay quay cuồng lo âu… foreclosure… trong xã hội ổn định… thích ứng tốt — nhưng giòn". Chữ mới theo nguồn đã mở (xem doi_chu). Review (Claude Opus 5.5, 10/11/2026): Nhãn Đang tranh cãi đạt thước đo: Marcia 1966 (đọc lại toàn văn) và Meeus 2012 cho kết quả khác chiều về foreclosure/early closure.'
    luot_2: dung
    luot_2_nguon: [ "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=3394234" ]
    luot_2_ghi_chu: Đang tranh cãi hợp lý (kết quả theo kiểu moratorium và early closure).
    review: dung
  - id: n33
    cau: Trong nghiên cứu dọc Hà Lan, early closure có mức thích ứng thuộc nhóm tốt nhất cùng với achievement.
    loai: phat-hien
    nguon:
      - meeus2012
    trich: As expected, early closures were, together with achievers, the adolescents with the most optimal levels of psychosocial adjustment.
    vi_tri: Meeus 2012, Discussion
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=3394234" ]
  - id: n34
    cau: 'Theo Kroger 2010: trung bình 15% đổi sang trạng thái kém vững hơn trong các nghiên cứu dọc; không có nguồn ủng hộ 18 tuổi là hạn chót.'
    loai: phat-hien
    nguon:
      - kroger2010
    trich: the mean proportion of adolescents making progressive identity status changes was .36, compared with .15 who made regressive changes
    vi_tri: Kroger 2010, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (khung Bác bỏ): "15% người thậm chí đi lùi… Coi 18 tuổi là hạn chót không có cơ sở khoa học — nó chỉ tạo thêm áp lực không cần thiết cho teen". Bỏ "không có cơ sở khoa học" và "chỉ tạo thêm áp lực" (đánh giá không nguồn). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/20004962", "https://api.crossref.org/works/10.1111/sode.12027" ]
    luot_2_ghi_chu: '"Không có nguồn ủng hộ 18 tuổi là hạn chót" là khẳng định phủ định, khớp các nguồn trên.'
    review: dung
  - id: n35
    cau: 'Khung Đã bị bác bỏ: ai cũng phải tìm xong "mình là ai" trước 18 tuổi.'
    loai: nhan
    nguon: &id005
      - kroger2010
    nhan: bac-bo
    co_so: *id005
    ly_do: 'Tổng hợp 124 nghiên cứu: nhiều mẫu chưa đạt bản sắc vững chắc đến đầu tuổi 20; niềm tin ban đầu là một quan niệm đại chúng, không phải khẳng định nghiên cứu nào; bằng chứng bác bỏ là phân tích tổng hợp. Chỗ khó: đây là bác một quan niệm đại chúng.'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ như nhận định trước. Chữ mới nói điều tìm được. Review (Claude Opus 5.5, 10/11/2026): Nhãn Đã bị bác bỏ giữ: mệnh đề "ai cũng tìm xong bản sắc trước 18 tuổi" là một khẳng định kiểm được và bị phân tích tổng hợp 124 nghiên cứu phủ định trực tiếp (nhiều mẫu chưa đạt achievement ở đầu tuổi trưởng thành; 15% thoái lui trong các nghiên cứu dọc), cùng chiều với Meeus 2012 và Luyckx 2013. Khác với khung "bé khóc là hư" ở gan-bo (niềm tin giá trị), ở đây có dữ liệu đo đúng mệnh đề.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/20004962", "https://api.crossref.org/works/10.1111/sode.12027" ]
    luot_2_ghi_chu: 'Đã bị bác bỏ đúng cho "ai cũng phải xong trước 18": hai nguồn lớn cho thấy bản sắc còn tiếp diễn sau 18.'
    review: dung
  - id: n36
    cau: 'Erikson: bản sắc là một nhiệm vụ của tuổi teen; theo Marcia, "khủng hoảng" nghĩa là giai đoạn dấn thân chọn giữa các lựa chọn, không phải bệnh lý.'
    loai: dinh-nghia
    nguon:
      - marcia1966
      - openstax-9
    trich: Crisis refers to the adolescent's period of engagement in choosing among meaningful alternatives
    vi_tri: Marcia 1966, mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "bản sắc là nhiệm vụ, không phải món quà… xây dựng… khoảng lùi… không bị trừng phạt vì thử sai". Chữ mới theo giáo trình và Marcia. Lý do: diễn giải chưa kiểm ở bản gốc Erikson. Review (Claude Opus 5.5, 10/11/2026): Đọc lại toàn văn Marcia 1966 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus, tệp 10.1037%252Fh0023281.pdf trong zip 10.1037%252Fa0017364.zip): định nghĩa "crisis" như câu.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories", "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=3394234" ]
    luot_2_ghi_chu: '"Khủng hoảng" theo Marcia là giai đoạn khám phá và dấn thân (Meeus 2012 mô tả "active exploration"), không phải bệnh lý; định nghĩa nguyên văn của Marcia 1966 không mở được.'
    review: dung
  - id: n37
    cau: 'Marcia: moratorium khác diffusion ở "an active struggle to make commitments"; achievement khác foreclosure ở chỗ đã trải qua khủng hoảng và quyết định theo cách của mình.'
    loai: phat-hien
    nguon:
      - marcia1966
    trich: he is distinguished from the identity-diffusion subject by the appearance of an active struggle to make commitments
    vi_tri: Marcia 1966, mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hai câu hỏi quyết định tất cả… bơi về phía bờ / trôi". Chữ mới theo định nghĩa Marcia. Review (Claude Opus 5.5, 10/11/2026): Đọc lại toàn văn Marcia 1966 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus, tệp 10.1037%252Fh0023281.pdf trong zip 10.1037%252Fa0017364.zip): câu "he is distinguished from the identity-diffusion subject by the appearance of an active struggle to make commitments" có nguyên văn ở đoạn định nghĩa moratorium (lượt 2 tìm trong Meeus 2012 nên không thấy). Vế achievement khớp đoạn định nghĩa achievement.'
    luot_2: khong-chac
    luot_2_nguon: [ "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=3394234" ]
    luot_2_ghi_chu: Trích dẫn nguyên văn "an active struggle to make commitments" (Marcia) không tìm thấy trong nguồn đã mở (Meeus 2012 chỉ nói "active exploration and has made no commitment, or at best an unclear one"); sự phân biệt moratorium–diffusion (khám phá so với chưa cam kết) thì khớp.
    review: dung
  - id: n38
    cau: 'Meeus và cộng sự (2012) tách khám phá thành khám phá sâu và xem xét lại cam kết; Luyckx (2013): khám phá sâu gắn chặt với cam kết ở tuổi teen và đầu 20, khám phá nhai lại gắn với trầm cảm ở cuối tuổi 20.'
    loai: phat-hien
    nguon:
      - meeus2012
      - luyckx2013
    trich: Exploration in breadth and exploration in depth were strongly related to commitment processes especially in adolescence and emerging adulthood, but these exploration processes became increasingly associated with ruminative exploration and depressive symptoms in the late 20s.
    vi_tri: Luyckx 2013, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "lành mạnh", "giúp cam kết chắc hơn theo thời gian", "nhóm Meeus ở Utrecht", "bài học… cách thử mới quyết định". Chữ mới theo hai nguồn (cắt ngang) và "gợi ý". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/22089632", "https://api.crossref.org/works/10.1111/sode.12027" ]
    review: dung
  - id: n39
    cau: 'Mục 1: khám phá đào sâu đi cùng cam kết chắc hơn (Khá vững; dữ liệu quan sát); chưa có nghiên cứu cho thấy tự xếp mình vào một trạng thái rồi hành xử theo đó giúp ích; cách "thử có chủ đích" là suy ra, chưa thử nghiệm.'
    loai: nhan
    nguon: &id006
      - luyckx2013
      - meeus2012
    nhan: kha-vung
    co_so: *id006
    ly_do: "Nhãn gắn với liên hệ quan sát: khám phá đào sâu gắn với cam kết (Luyckx 2013, cắt ngang, 5.834 người; Meeus 2012, dọc): Khá vững. Phần lời khuyên không mang nhãn và được nói rõ là suy ra, chưa có thử nghiệm."
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ phân lời khuyên theo từng trạng thái (moratorium, diffusion, foreclosure) và đề nghị tự xếp loại; viết lại thành điều dữ liệu cho thấy và phần suy ra. Chỗ khó: nhãn gắn vào lời khuyên chưa có thử nghiệm trực tiếp; review cân nhắc. Review (Claude Opus 5.5, 10/11/2026): Đồng ý lượt 2 (quá mạnh): tiêu đề cũ "Xác định mình đang ở đâu, rồi hành xử cho đúng" gắn nhãn Khá vững cho một lời khuyên tự xếp loại chưa có bằng chứng can thiệp. Đổi tiêu đề thành điều dữ liệu cho thấy ("Khám phá đào sâu đi cùng cam kết chắc hơn"), giữ id cũ { #1-xac-dinh-minh-dang-o-dau-roi-hanh-xu-cho-dung-kha-vung }, thêm câu "Chưa có nghiên cứu nào cho thấy việc tự xếp mình vào một trạng thái rồi hành xử theo đó giúp ích"; doi_chu.'
    luot_2: qua-manh
    luot_2_nguon: [ "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=3394234" ]
    luot_2_ghi_chu: 'câu đúng: Có thể dùng bốn trạng thái để gọi tên trải nghiệm; liên hệ giữa trạng thái và thích ứng có nhưng là quan sát, chưa có nghiên cứu cho thấy tự xếp loại rồi hành xử theo đó cải thiện kết quả (nhãn nên là Đang tranh cãi hay nói rõ là chưa đủ bằng chứng).; Căn cứ chỉ là liên hệ giữa trạng thái bản sắc và thích ứng (quan sát); chưa có bằng chứng can thiệp rằng "xác định mình đang ở đâu rồi hành xử cho đúng" giúp ích. Khung Khá vững cho lời khuyên là cao hơn bằng chứng.'
    review: sai
  - id: n40
    cau: 'Mục 2: với cha mẹ, chọn sẵn hay cho không gian thử (Đang tranh cãi).'
    loai: nhan
    nguon: &id007
      - marcia1966
      - meeus2012
    nhan: tranh-cai
    co_so: *id007
    ly_do: 'Hai nghiên cứu cho kết quả khác chiều về foreclosure/early closure (Marcia 1966 so với Meeus 2012); không có nghiên cứu nào đo việc cha mẹ chọn hộ: Đang tranh cãi.'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: nhãn Khá vững; "Bắt con theo ngành mình chọn có thể cho kết quả ngắn hạn yên ổn… nhóm foreclosure kém linh hoạt khi môi trường đổi thay…". Chữ mới và nhãn Đang tranh cãi theo hai nguồn; id mục giữ nguyên; lời khuyên gắn nhãn là phần suy ra. Chỗ khó: chủ đề nhạy cảm với cha mẹ; review cân nhắc giọng. Review (Claude Opus 5.5, 10/11/2026): Nhãn Đang tranh cãi đạt thước đo; giọng trung tính, lời gợi ý nói rõ là suy ra; id cũ giữ { #2-voi-cha-me-ep-con-vao-chon-san-co-gia-cua-no-kha-vung }.'
    luot_2: dung
    luot_2_nguon: [ "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=3394234" ]
    luot_2_ghi_chu: 'Đang tranh cãi hợp lý: bằng chứng không chỉ một hướng cho "chọn sẵn" hay "cho không gian thử".'
    review: dung
  - id: n41
    cau: 'Mục 3: phân biệt đang thử với đang quay cuồng (Khá vững).'
    loai: nhan
    nguon: &id008
      - luyckx2013
    nhan: kha-vung
    co_so: *id008
    ly_do: 'Một khảo sát cắt ngang 5.834 người cho thấy khám phá nhai lại gắn với trầm cảm ở cuối tuổi 20; không có nghiên cứu nào đọc kiểm tra cách phân biệt "thử" với "quay cuồng" ở từng người; trang nói bài không giúp xác định trầm cảm: Khá vững cho phần có nguồn.'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: đặc điểm "thử nghiệm lành mạnh" (thu thập thông tin mới, loại dần…) và danh sách "mất ngủ, chán ăn, mất hứng thú mọi thứ" làm ngưỡng tìm giúp (không nguồn, gần tiêu chí chẩn đoán). Thay bằng Luyckx 2013, nêu giới hạn, dẫn tới Hỗ trợ. Review (Claude Opus 5.5, 10/11/2026): Nhãn Khá vững cho liên hệ có nguồn (Luyckx 2013); trang nói rõ không giúp xác định trầm cảm, dẫn tới Hỗ trợ; không còn danh sách triệu chứng làm ngưỡng.'
