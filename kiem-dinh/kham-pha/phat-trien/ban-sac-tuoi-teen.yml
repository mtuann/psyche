doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: 'Erikson cũng nhấn mạnh một khái niệm quan trọng: **psychosocial moratorium** — "khoảng lùi tâm lý–xã hội". Xã hội cho teen một khoảng thời gian được phép thử, được phép sai, được phép chưa quyết định (như thời gian đi học, gap year) trước khi phải gánh trách nhiệm người lớn. Thử nghiệm không phải lãng phí thời gian — nó là một phần của thiết kế.


      '
    moi: ''
    ly_do: 'Bỏ đoạn "psychosocial moratorium": không mở được Erikson 1968 hay nguồn nào nêu khái niệm này (giáo trình OpenStax không có; Marcia 1966 dùng "moratorium" là tên một trạng thái). Các nơi khác của trang không còn nhắc lại khái niệm.'
  - cu: 'Nếu có, bạn không hề "giả tạo" — bạn đang ở đúng giữa nhiệm vụ tâm lý lớn nhất của tuổi teen: **tìm ra mình là ai**. Erikson gọi đây là giai đoạn bản sắc (identity) đối đầu với lẫn lộn vai trò (role confusion). Cảm giác "nhiều phiên bản mình" là dấu hiệu của quá trình thử nghiệm, không phải dấu hiệu có gì đó sai ở bạn.'
    moi: Nếu có, đó có thể là một phần của việc **tìm ra mình là ai**, nhiệm vụ mà Erikson gắn với tuổi teen và gọi là bản sắc (identity) đối đầu với lẫn lộn vai trò (role confusion). Cảm giác "nhiều phiên bản mình" có thể là một phần của quá trình thử nghiệm mà các nhà nghiên cứu mô tả. Nếu cảm giác ấy kéo dài và làm bạn khó chịu, hãy nói chuyện với người bạn tin cậy hay người có chuyên môn; xem [Hỗ trợ](/psyche/ho-tro/).
    ly_do: Chữ cũ ("không hề giả tạo", "nhiệm vụ lớn nhất", "là dấu hiệu của… không phải dấu hiệu có gì sai") nói chắc về từng người, như một lời trấn an chẩn đoán; nguồn chỉ mô tả giai đoạn. Thêm lời dẫn tới Hỗ trợ.
  - cu: 'Giải quyết tốt, teen có được **fidelity** (sự trung thành với chính những giá trị mình đã chọn); không giải quyết được, teen rơi vào lẫn lộn: không biết mình thuộc về đâu, dễ bị lôi kéo theo đám đông hoặc buông xuôi.'
    moi: Giáo trình mô tả teen giải quyết tốt có cảm giác bản thân vững và giữ được niềm tin của mình trước khó khăn; còn teen chịu áp lực phải theo ý người khác hay không chủ động tìm kiếm có thể có cảm giác bản thân yếu, lúng túng về tương lai.
    ly_do: 'Chữ cũ: "fidelity" và "dễ bị lôi kéo theo đám đông hoặc buông xuôi" không có trong nguồn đã mở (giáo trình viết: "remain true to their beliefs and values"; "weak sense of self… role confusion… confused about the future").'
  - cu: Hai năm trước khi Erikson ra sách, học trò của ông là **James Marcia** đã biến lý thuyết trừu tượng này thành thứ đo được.
    moi: Hai năm trước khi Erikson ra sách, **James Marcia** (khi đó là nghiên cứu sinh ở Đại học Bang Ohio) đã dựa vào khái niệm của Erikson để đề xuất cách đo bản sắc bằng phỏng vấn.
    ly_do: 'Chữ cũ gọi Marcia là "học trò" của Erikson: bài 1966 ghi luận án tiến sĩ ở Ohio State với D. P. Crowne hướng dẫn, không nhắc Erikson là thầy; bỏ. "Biến thành thứ đo được" nói như người đầu tiên; bài còn liệt kê các cách đo trước đó (Bronson 1959, Gruen 1960, Block 1961).'
  - cu: '| **Đang khám phá** | **Moratorium** — "đang thử": Linh thử vẽ, thử học y, thử tìm hiểu du học, nhưng chưa quyết. Đây là trạng thái băn khoăn, lo âu nhưng đang tiến lên.'
    moi: '| **Đang khám phá** | **Moratorium** — "đang thử": Linh thử vẽ, thử học y, thử tìm hiểu du học, nhưng chưa quyết. Theo Marcia, đây là trạng thái đang trong khủng hoảng, cam kết còn mơ hồ nhưng đang nỗ lực để cam kết.'
    ly_do: Chữ cũ "lo âu nhưng đang tiến lên" không có trong nguồn; Marcia viết "an active struggle to make commitments".
  - cu: 'Lưu ý quan trọng: đây là các **trạng thái** (status), không phải các giai đoạn bắt buộc phải đi theo thứ tự.'
    moi: 'Lưu ý quan trọng: đây là các **trạng thái** (status), không phải các giai đoạn bắt buộc phải đi theo thứ tự. Sơ đồ cũng đã đơn giản hóa: Marcia (1966) ghi người ở diffusion có thể đã hoặc chưa trải qua khủng hoảng, điểm nhận diện là thiếu cam kết.'
    ly_do: 'Thêm giới hạn của sơ đồ: Marcia viết diffusion "may or may not have experienced a crisis period; his hallmark is a lack of commitment". Hình marcia-matrix đặt Diffusion ở ô "khám phá thấp, cam kết thấp": không sửa hình.'
  - cu: 'Ông cũng cảnh báo: khi xã hội không cho teen khoảng lùi để thử (moratorium), teen dễ rơi vào lẫn lộn vai trò hoặc bám víu vào một bản sắc cực đoan, cứng nhắc.'
    moi: Marcia (1966) mô tả người ở trạng thái foreclosure là người có sự cứng nhắc trong tính cách và sẽ cảm thấy bị đe dọa nếu giá trị của cha mẹ không còn dùng được.
    ly_do: Chữ cũ gán cho Erikson lời cảnh báo "bám víu vào một bản sắc cực đoan, cứng nhắc" khi thiếu moratorium (bài gốc chưa mở, không nguồn đã mở nói vậy); thay bằng mô tả của Marcia 1966 đã đọc.
  - cu: 'Giá trị của nó nằm ở khung nhìn — và chính Marcia là người đầu tiên biến khung nhìn ấy thành biến số đo được (sách *Identity: Youth and Crisis*, xem mục Nguồn).'
    moi: 'Giá trị của nó nằm ở khung nhìn; Marcia (1966) đề xuất một cách đo khung nhìn ấy bằng phỏng vấn, sau các nỗ lực đo bản sắc trước đó (sách *Identity: Youth and Crisis*, xem mục Nguồn).'
    ly_do: 'Chữ cũ "người đầu tiên biến… thành biến số đo được": bài Marcia liệt kê các nghiên cứu đo bản sắc trước đó (Bronson 1959, Gruen 1960, Block 1961, Rasmussen 1964).'
  - cu: '**Thiết kế.** Marcia phỏng vấn sâu **86 nam sinh viên đại học**, đánh giá mức độ "khủng hoảng" (có đang thử nghiệm, băn khoăn không) và "cam kết" (đã lựa chọn và gắn bó chưa) trong hai lĩnh vực: **nghề nghiệp** và **hệ tư tưởng** (tôn giáo, chính trị, giá trị sống).'
    moi: '**Thiết kế.** Marcia phỏng vấn **86 nam sinh viên đại học** (Hiram College), đánh giá mức độ "khủng hoảng" (giai đoạn dấn thân chọn giữa các lựa chọn có ý nghĩa) và "cam kết" (mức độ đầu tư cá nhân) trong **nghề nghiệp** và **hệ tư tưởng** (tôn giáo, chính trị).'
    ly_do: Bỏ "giá trị sống" (nguồn nêu nghề nghiệp, tôn giáo, chính trị) và "phỏng vấn sâu"; thêm Hiram College và định nghĩa theo bài gốc.
  - cu: '**Kết quả.** Các trạng thái "đo được" và khác nhau thật: người ở trạng thái achievement và moratorium **linh hoạt trong tư duy dưới áp lực**; người ở foreclosure — nhóm "nghe theo bố mẹ" — **đặt mục tiêu cao một cách phi thực tế** và có điểm độc đoán cao hơn hẳn; người ở diffusion thì **khó khăn khi phải suy nghĩ dưới căng thẳng**. Nói cách khác, cách bạn giải quyết câu hỏi "mình là ai" phản ánh ra cả cách bạn tư duy và ra quyết định'
    moi: '**Kết quả.** Các trạng thái khác nhau ở vài thước đo: người ở achievement làm tốt nhất bài tập nhận thức dưới căng thẳng (bỏ cuộc 1 trong 108 bài, so với 11 trong 120 ở diffusion), moratorium có điểm biến thiên nhiều hơn các nhóm còn lại; người ở foreclosure — nhóm gần với mong muốn của bố mẹ — **đặt mục tiêu cao hơn mức đạt được** (điểm chênh 5,06 so với 3,60 ở achievement) và có điểm thang độc đoán cao hơn (45,2 so với 34,3); lòng tự trọng thì không phân biệt được các nhóm. Đây là một nghiên cứu nhỏ trên nam sinh viên một trường'
    ly_do: 'Chữ cũ: "achievement và moratorium linh hoạt trong tư duy dưới áp lực" (sai với moratorium: Marcia thấy moratorium biến thiên điểm nhiều hơn); "độc đoán cao hơn hẳn"; "diffusion khó khăn khi suy nghĩ dưới căng thẳng" (diffusion kém achievement, không phải thấp nhất); câu kết "cách bạn giải quyết… phản ánh ra cả cách bạn tư duy" (suy diễn). Chữ mới theo Bảng 2, 3, 4 và Discussion của Marcia 1966.'
  - cu: 'Và một phát hiện gây bất ngờ: **đến đầu tuổi trưởng thành, vẫn còn một tỉ lệ lớn chưa đạt được bản sắc vững chắc**.'
    moi: 'Và một phát hiện đáng chú ý: **đến đầu tuổi trưởng thành, vẫn còn một tỉ lệ lớn chưa đạt được bản sắc vững chắc**.'
    ly_do: '"gây bất ngờ" là đánh giá không có nguồn.'
  - cu: 'Đúng vậy: các trạng thái là những cấu hình cam kết–khám phá **tương đối ổn định theo thời gian**, nhưng người ta có thể di chuyển giữa chúng. Nhóm teen lớn tuổi hơn có tỉ lệ achievement cao hơn và diffusion thấp hơn hẳn nhóm nhỏ tuổi hơn — bằng chứng cho giả thuyết phát triển của mô hình.'
    moi: 'Đúng vậy: các trạng thái là những cấu hình cam kết–khám phá **tương đối ổn định theo thời gian**. Nhóm teen lớn tuổi hơn có nhiều người achievement hơn và ít người diffusion hơn nhóm nhỏ tuổi hơn — ủng hộ giả thuyết phát triển của mô hình. (Trong nghiên cứu này foreclosure được gọi là *early closure*.)'
    ly_do: Chữ cũ "nhưng người ta có thể di chuyển giữa chúng" không phải điều Meeus 2012 nói (họ nhấn mạnh quỹ đạo ổn định); phần di chuyển là của Kroger 2010. Bỏ "hẳn". Thêm thuật ngữ early closure.
  - cu: 'Nghiên cứu còn phát hiện **hai kiểu moratorium**: kiểu cổ điển (đang thử, chưa cam kết) và kiểu "đang tìm kiếm" (đã có cam kết nhưng vẫn tiếp tục cân nhắc lại). Và quan trọng: các quỹ đạo bản sắc khác nhau đi kèm **mức độ thích ứng tâm lý–xã hội khác nhau một cách ổn định** — bản sắc không chỉ là chuyện "triết lý", nó gắn với việc bạn sống ổn hay không'
    moi: 'Nghiên cứu còn phát hiện **hai kiểu moratorium**: kiểu cổ điển (đang thử, chưa cam kết) và kiểu "đang tìm kiếm" (cam kết mạnh và chủ động, vẫn cân nhắc lại, nhưng chưa chốt quyết định; kiểu này không còn thấy ở nhóm teen lớn tuổi). Và các quỹ đạo bản sắc khác nhau đi kèm **mức độ thích ứng tâm lý–xã hội khác nhau một cách ổn định**: người achievement và early closure có ít triệu chứng trầm cảm và hành vi phạm pháp hơn người moratorium'
    ly_do: Thêm đặc điểm kiểu "đang tìm kiếm" theo bài; thay câu "bản sắc… gắn với việc bạn sống ổn hay không" bằng kết quả cụ thể (achievement, early closure ít trầm cảm và phạm pháp hơn moratorium).
  - cu: 'Điểm đáng chú ý nhất: càng về cuối tuổi 20, việc "khám phá" càng gắn với **khám phá kiểu nhai lại** (ruminative exploration — nghĩ đi nghĩ lại, loay hoay không quyết được) và với **triệu chứng trầm cảm**. Nói cách khác: thử nghiệm ở tuổi teen là bình thường và cần thiết; nhưng nếu đến tuổi 20+ mà vẫn quay cuồng trong vòng lặp băn khoăn không lối ra, đó là dấu hiệu liên quan đến sức khỏe tâm thần, không còn là "giai đoạn phát triển" nữa'
    moi: 'Điểm đáng chú ý nhất: càng về cuối tuổi 20, việc "khám phá" càng gắn với **khám phá kiểu nhai lại** (ruminative exploration — nghĩ đi nghĩ lại, loay hoay không quyết được) và với **triệu chứng trầm cảm**. Đây là mối liên hệ trong một khảo sát cắt ngang, không cho biết cái nào đến trước; nếu bạn thấy mình mắc kẹt trong vòng lặp băn khoăn và khó chịu kéo dài, hãy nói chuyện với người có chuyên môn, xem [Hỗ trợ](/psyche/ho-tro/)'
    ly_do: 'Chữ cũ: "thử nghiệm ở tuổi teen là bình thường và cần thiết" (không nguồn nói) và "đó là dấu hiệu liên quan đến sức khỏe tâm thần, không còn là giai đoạn phát triển nữa" (kết luận cho từng người từ một khảo sát cắt ngang, gần với chẩn đoán). Thay bằng lời nêu giới hạn và dẫn tới Hỗ trợ.'
  - cu: ':::vung-chac[4 trạng thái bản sắc của Marcia là có thật và đo được]

      Từ nghiên cứu gốc năm 1966 đến nay, mô hình khám phá × cam kết đã được tái hiện trong hàng trăm nghiên cứu trên nhiều quốc gia, với phân tích tổng hợp 124 nghiên cứu (Kroger và cộng sự, 2010) và các nghiên cứu dọc nhiều năm (Meeus và cộng sự, 2012). Đây là một trong những khung lý thuyết được kiểm chứng kỹ nhất về tuổi teen.

      :::'
    moi: ':::vung-chac[4 trạng thái bản sắc của Marcia là có thật và đo được]

      Từ nghiên cứu gốc năm 1966 (86 nam sinh viên) đến nay, mô hình khám phá × cam kết đã được dùng trong phân tích tổng hợp 124 nghiên cứu (Kroger và cộng sự, 2010) và được một nghiên cứu dọc năm đợt trên 1.313 teen Hà Lan xác nhận là các quỹ đạo phân biệt và tương đối ổn định (Meeus và cộng sự, 2012). Giới hạn: các nguồn chúng tôi đọc kỹ đến từ Mỹ và Hà Lan; thước đo lòng tự trọng của Marcia 1966 không phân biệt được các nhóm.

      :::'
    ly_do: 'Chữ cũ: "đã được tái hiện trong hàng trăm nghiên cứu trên nhiều quốc gia" (tóm tắt Kroger chỉ nói 124 nghiên cứu, không nêu quốc gia) và "một trong những khung… được kiểm chứng kỹ nhất" (đánh giá không có nguồn). Chữ mới theo nguồn và nêu giới hạn.'
  - cu: 'Cả phân tích tổng hợp (36% tiến bộ / 15% thoái lui / 49% ổn định theo thời gian) lẫn nghiên cứu dọc Hà Lan đều cho thấy: đến đầu tuổi trưởng thành vẫn còn nhiều người chưa đạt bản sắc vững chắc, và người ta có thể di chuyển qua lại giữa các trạng thái. Không có "deadline" cho việc tìm ra mình là ai.'
    moi: Phân tích tổng hợp (36% tiến bộ / 15% thoái lui / 49% ổn định theo thời gian) cho thấy đến đầu tuổi trưởng thành vẫn còn nhiều người chưa đạt bản sắc vững chắc, và người ta có thể di chuyển qua lại giữa các trạng thái; nghiên cứu dọc Hà Lan thấy nhóm teen lớn tuổi (đến 20 tuổi) có nhiều người achievement hơn nhóm nhỏ tuổi. Các nguồn này cho thấy 18 tuổi không phải mốc cố định của việc tìm ra mình là ai.
    ly_do: Chữ cũ gán cho cả nghiên cứu Hà Lan việc "di chuyển qua lại giữa các trạng thái" (Meeus nhấn mạnh quỹ đạo ổn định; di chuyển là của Kroger); "Không có deadline" đổi thành điều các nguồn cho thấy.
  - cu: ':::kha-vung[có cam kết đi cùng hạnh phúc cao hơn; kẹt trong lẫn lộn đi cùng lo âu, trầm cảm nhiều hơn]

      Các tổng quan nghiên cứu cho thấy hạnh phúc cao nhất ở các trạng thái **có cam kết** (achievement, foreclosure) và thấp nhất ở các trạng thái **chưa cam kết**; căng thẳng tâm lý thì ngược lại. Nghiên cứu trên gần 6.000 người (Luyckx và cộng sự, 2013) cho thấy kiểu khám phá "nhai đi nhai lại" gắn với triệu chứng trầm cảm. Nhưng đây là **tương quan**: chưa rõ bản sắc lỏng lẻo gây ra trầm cảm, hay trầm cảm khiến người ta khó cam kết — nhiều khả năng là cả hai chiều.

      :::'
    moi: ':::kha-vung[có cam kết đi cùng thích ứng tốt hơn; kẹt trong khám phá nhai lại đi cùng trầm cảm nhiều hơn]

      Trong nghiên cứu dọc ở Hà Lan (Meeus và cộng sự, 2012), các teen ở trạng thái **có cam kết** (achievement, early closure) có ít triệu chứng trầm cảm và hành vi phạm pháp hơn người ở moratorium. Nghiên cứu cắt ngang trên 5.834 người (Luyckx và cộng sự, 2013) thấy kiểu khám phá "nhai đi nhai lại" gắn với triệu chứng trầm cảm ở cuối tuổi 20. Nhưng đây là **tương quan** và chỉ vài nghiên cứu: chưa rõ bản sắc lỏng lẻo gây ra trầm cảm, hay trầm cảm khiến người ta khó cam kết.

      :::'
    ly_do: 'Chữ cũ: "Các tổng quan nghiên cứu cho thấy hạnh phúc cao nhất ở các trạng thái có cam kết… căng thẳng tâm lý thì ngược lại" (không mở được tổng quan nào về hạnh phúc theo trạng thái; "foreclosure" ở trạng thái "có cam kết" cũng chưa có nguồn); "nhiều khả năng là cả hai chiều". Chữ mới theo Meeus 2012 và Luyckx 2013.'
  - cu: 'Ở tuổi teen, moratorium là bình thường, thậm chí cần thiết (đó chính là "khoảng lùi" Erikson nói đến). Nhưng khám phá kéo dài kiểu loay hoay ở tuổi trưởng thành lại gắn với trầm cảm — ranh giới nằm ở chỗ: bạn đang **chủ động thử** hay đang **quay cuồng lo âu**. Tương tự, foreclosure (theo sẵn gia đình) trong nghiên cứu phương Tây thường bị đánh giá thấp hơn achievement, nhưng trong xã hội ổn định, truyền thống gia đình vững, nó có thể là lựa chọn thích ứng tốt — vấn đề là nó **giòn**: khi môi trường thay đổi đột ngột, người chưa từng tự lựa chọn sẽ chới với hơn.'
    moi: Trong nghiên cứu dọc Hà Lan, người moratorium có nhiều triệu chứng trầm cảm hơn người achievement và early closure; ở cuối tuổi 20, khám phá kiểu nhai lại gắn với trầm cảm (Luyckx và cộng sự, 2013). Nhưng kiểu moratorium "đang tìm kiếm" có cam kết mạnh và không đi kèm chậm quyết định như moratorium cổ điển (Meeus và cộng sự, 2012). Về foreclosure, Marcia (1966) thấy nhóm này đặt mục tiêu cao hơn mức đạt được và cứng nhắc hơn; ngược lại, trong nghiên cứu Hà Lan early closure có mức thích ứng thuộc nhóm tốt nhất cùng với achievement. Nghiên cứu còn ít và chưa thống nhất.
    ly_do: 'Chữ cũ: "moratorium là bình thường, thậm chí cần thiết (khoảng lùi Erikson)", "ranh giới… chủ động thử hay quay cuồng lo âu", "trong xã hội ổn định… có thể là lựa chọn thích ứng tốt — vấn đề là nó giòn" không có nguồn đã mở nêu như vậy. Chữ mới theo Meeus 2012, Luyckx 2013 và Marcia 1966.'
  - cu: Phân tích tổng hợp 124 nghiên cứu cho thấy đến đầu tuổi 20 vẫn còn tỉ lệ lớn chưa đạt bản sắc vững chắc, và 15% người thậm chí "đi lùi" về trạng thái kém vững hơn theo thời gian. Coi 18 tuổi là hạn chót không có cơ sở khoa học — nó chỉ tạo thêm áp lực không cần thiết cho teen.
    moi: Phân tích tổng hợp 124 nghiên cứu cho thấy đến đầu tuổi 20 vẫn còn tỉ lệ lớn chưa đạt bản sắc vững chắc, và trung bình 15% người trong các nghiên cứu dọc đổi sang trạng thái kém vững hơn. Chúng tôi không tìm thấy nguồn nào ủng hộ việc coi 18 tuổi là hạn chót.
    ly_do: '"không có cơ sở khoa học" và "chỉ tạo thêm áp lực không cần thiết" là đánh giá không có nguồn; nói điều tìm được.'
  - cu: '- **Erikson: bản sắc là nhiệm vụ, không phải món quà.** Teen không "khám phá ra" một bản ngã có sẵn như mở quà; teen **xây dựng** nó bằng cách thử các vai trò và giữ lại những gì phù hợp. "Khủng hoảng bản sắc" (identity crisis) trong ngôn ngữ của Erikson không phải bệnh lý — nó là giai đoạn băn khoăn cần thiết trước khi cam kết. Xã hội khôn ngoan là xã hội cho teen "khoảng lùi" (moratorium) để thử mà không bị trừng phạt vì thử sai.'
    moi: '- **Erikson: bản sắc là một nhiệm vụ của tuổi teen.** Giáo trình mô tả nhiệm vụ của giai đoạn 12–18 tuổi là xây dựng cảm giác về bản thân. "Khủng hoảng" (crisis) theo cách Marcia (1966) dùng nghĩa là giai đoạn dấn thân chọn giữa các lựa chọn có ý nghĩa, không phải bệnh lý.'
    ly_do: Chữ cũ ("không phải món quà… xây dựng… giữ lại những gì phù hợp", "băn khoăn cần thiết", "xã hội khôn ngoan… khoảng lùi") là diễn giải chưa kiểm được ở bản gốc Erikson; thay bằng giáo trình và định nghĩa "crisis" của Marcia.
  - cu: '- **Marcia: hai câu hỏi quyết định tất cả.** "Bạn có đang thử không?" (khám phá) và "Bạn đã chọn chưa?" (cam kết). Bốn câu trả lời có/không tạo ra 4 trạng thái. Điểm tinh tế: moratorium và diffusion đều "chưa chọn", nhưng khác nhau ở chỗ **có đang chủ động thử hay không** — một bên đang bơi về phía bờ, một bên đang trôi. Và achievement khác foreclosure ở chỗ **lựa chọn đó có phải của chính mình sau khi đã thử không**.'
    moi: '- **Marcia: hai tiêu chí, bốn trạng thái.** "Khủng hoảng" (có đang dấn thân chọn giữa các lựa chọn không) và "cam kết" (đã đầu tư cá nhân chưa). Marcia phân biệt moratorium với diffusion ở chỗ moratorium có "an active struggle to make commitments"; và achievement khác foreclosure ở chỗ achievement đã trải qua giai đoạn khủng hoảng và quyết định theo cách của mình, dù lựa chọn cuối có thể là một biến thể của mong muốn cha mẹ.'
    ly_do: 'Chữ cũ ("hai câu hỏi quyết định tất cả", ẩn dụ "bơi về phía bờ / trôi") là diễn giải; thay bằng định nghĩa Marcia 1966. Điểm mới: achievement vẫn có thể gần với mong muốn cha mẹ (Marcia: "even though his ultimate choice may be a variation of parental wishes").'
  - cu: 'Nghiên cứu sau này (ví dụ nhóm Meeus ở Utrecht) tách khám phá thành **khám phá sâu** (đào sâu, đánh giá lại cam kết hiện tại — lành mạnh) và **xem xét lại cam kết** (lung lay, muốn đổi hướng). Khám phá sâu giúp cam kết chắc hơn theo thời gian; còn kiểu "nhai lại" lo âu thì gắn với trầm cảm. Bài học: không phải cứ "thử nhiều" là tốt — **cách thử** mới quyết định.'
    moi: 'Nghiên cứu sau này (ví dụ Meeus và cộng sự, 2012) tách khám phá thành **khám phá sâu** (đào sâu các cam kết hiện tại) và **xem xét lại cam kết** (cân nhắc các lựa chọn khác). Luyckx và cộng sự (2013) thấy khám phá sâu gắn chặt với cam kết ở tuổi teen và đầu tuổi 20 (khảo sát cắt ngang), còn kiểu "nhai lại" gắn với trầm cảm ở cuối tuổi 20. Gợi ý: không chỉ lượng "thử" mà cả **cách thử** có thể quan trọng.'
    ly_do: 'Chữ cũ: "lành mạnh", "giúp cam kết chắc hơn theo thời gian" (Luyckx là cắt ngang), "Utrecht", "bài học… cách thử mới quyết định" (kết luận mạnh hơn nguồn).'
  - cu: 'Đang ở moratorium (thử nhiều thứ, chưa quyết)? Đừng vội ép mình "chốt" — hãy thử một cách có chủ đích: mỗi lựa chọn thử trong một khoảng thời gian xác định, ghi lại mình học được gì. Đang ở diffusion (trôi, né quyết định)? Bước nhỏ nhất có ích là **bắt đầu thử một thứ gì đó**, dù nhỏ — đăng ký một câu lạc bộ, thử một công việc part-time. Còn nếu đã ở foreclosure (theo sẵn lối gia đình) mà thấy ổn, không có gì phải xấu hổ — chỉ cần thành thật hỏi mình: "nếu được chọn lại từ đầu, mình có chọn thế này không?"'
    moi: 'Bốn trạng thái là cách nhà nghiên cứu mô tả nhóm người, không phải nhãn để gán cho bản thân. Điều dữ liệu cho thấy là khám phá đào sâu gắn với cam kết chắc hơn (Luyckx và cộng sự, 2013; Meeus và cộng sự, 2012). Một cách làm hợp lý suy ra từ đó (chưa có thử nghiệm riêng): thử có chủ đích, mỗi lựa chọn trong một khoảng thời gian xác định và ghi lại mình học được gì; và nếu đã có định hướng theo gia đình mà thấy ổn, thử hỏi mình: "nếu được chọn lại từ đầu, mình có chọn thế này không?"'
    ly_do: Chữ cũ phân lời khuyên theo từng trạng thái ("đang ở moratorium… diffusion… foreclosure"), dễ đọc như tự xếp loại; chưa có thử nghiệm kiểm các lời khuyên ấy. Thay bằng điều dữ liệu cho thấy và nêu rõ phần suy ra.
  - cu: '### 2. Với cha mẹ: ép con vào "chọn sẵn" có giá của nó :nhan[kha-vung]


      Bắt con theo ngành mình chọn có thể cho kết quả ngắn hạn yên ổn (con có cam kết, ít lo âu trước mắt), nhưng nghiên cứu cho thấy nhóm foreclosure **kém linh hoạt khi môi trường đổi thay** và đặt mục tiêu thiếu thực tế hơn. Cách tốt hơn: cho con "khoảng lùi" để thử — cùng con tìm hiểu các lựa chọn, thay vì chốt hộ con. Tôn trọng quyền thử của con không có nghĩa là bỏ mặc; nó có nghĩa là đồng hành.'
    moi: '### 2. Với cha mẹ: cho con không gian thử, thay vì chọn sẵn :nhan[tranh-cai] { #2-voi-cha-me-ep-con-vao-chon-san-co-gia-cua-no-kha-vung }


      Bằng chứng về "chọn sẵn" chưa thống nhất: Marcia (1966) thấy nhóm foreclosure đặt mục tiêu cao hơn mức đạt được và có điểm độc đoán cao hơn, còn nghiên cứu dọc ở Hà Lan thấy early closure có mức thích ứng thuộc nhóm tốt nhất (Meeus và cộng sự, 2012). Chúng tôi chưa tìm thấy nghiên cứu nào cho thấy việc cha mẹ chọn hộ làm tăng hay giảm điều gì. Một gợi ý hợp lý, suy ra chứ chưa được thử nghiệm: cùng con tìm hiểu các lựa chọn và cho con không gian thử, không bỏ mặc.'
    ly_do: 'Chữ cũ: nhãn Khá vững; "Bắt con theo ngành mình chọn… nhóm foreclosure kém linh hoạt khi môi trường đổi thay" (không có nghiên cứu nào đo việc cha mẹ ép) và "cách tốt hơn". Marcia 1966 và Meeus 2012 cho kết quả khác nhau về foreclosure. Đổi nhãn Khá vững thành Đang tranh cãi, giữ id mục cũ.'
  - cu: 'Thử nghiệm lành mạnh có đặc điểm: bạn thu thập thông tin mới, loại dần các lựa chọn, và dần tiến về một quyết định. Quay cuồng lo âu thì ngược lại: nghĩ mãi cùng một vòng, không có thông tin mới, càng nghĩ càng tệ — và nghiên cứu cho thấy kiểu này gắn với triệu chứng trầm cảm. Nếu bạn (hoặc con bạn) rơi vào vòng lặp thứ hai kéo dài, kèm mất ngủ, chán ăn, mất hứng thú mọi thứ, đó là lúc nên tìm sự giúp đỡ chuyên nghiệp — site có trang [Tìm giúp đỡ](/psyche/kham-pha/suc-khoe-tam-than/tim-giup-do/) với các địa chỉ hỗ trợ.'
    moi: 'Khám phá sâu đi cùng cam kết, còn kiểu khám phá "nhai lại" (nghĩ đi nghĩ lại, loay hoay không quyết được) ở cuối tuổi 20 gắn với triệu chứng trầm cảm (Luyckx và cộng sự, 2013): đây là tương quan trong khảo sát cắt ngang. Bài này không giúp bạn biết mình có trầm cảm hay không. Nếu bạn (hoặc con bạn) thấy mình mắc kẹt trong vòng lặp ấy và khó chịu kéo dài, hãy nói chuyện với người có chuyên môn; xem [Hỗ trợ](/psyche/ho-tro/) và [Tìm giúp đỡ](/psyche/kham-pha/suc-khoe-tam-than/tim-giup-do/).'
    ly_do: 'Chữ cũ: các đặc điểm "thử nghiệm lành mạnh" (thu thập thông tin mới, loại dần…) và danh sách "mất ngủ, chán ăn, mất hứng thú mọi thứ" làm ngưỡng tìm giúp: không có nguồn và gần với tiêu chí chẩn đoán. Thay bằng điều Luyckx 2013 nói, nêu giới hạn và dẫn tới Hỗ trợ.'
  - cu: 'Dữ liệu dọc nói rõ: bản sắc tiếp tục phát triển sang tận tuổi 20+, và 15% người còn "đi lùi" ở một thời điểm nào đó. Thay đổi nghề ở tuổi 30, đổi niềm tin ở tuổi 40 không phải thất bại — đó là bản sắc đang làm đúng việc của nó: cập nhật. Đừng dùng tuổi tác làm thước đo giá trị của quá trình này.'
    moi: Dữ liệu dọc cho thấy bản sắc tiếp tục phát triển sang tận tuổi 20+, và trung bình 15% người trong các nghiên cứu dọc đổi sang trạng thái kém vững hơn (Kroger và cộng sự, 2010). Các nguồn chúng tôi đọc chỉ trải đến khoảng 30 tuổi; chúng tôi chưa có dữ liệu cho tuổi sau đó.
    ly_do: 'Chữ cũ: "Thay đổi nghề ở tuổi 30, đổi niềm tin ở tuổi 40 không phải thất bại — đó là bản sắc đang làm đúng việc của nó" vượt quá dữ liệu (đến khoảng 30 tuổi); "đi lùi ở một thời điểm nào đó" thành tỉ lệ trung bình trong các nghiên cứu dọc.'
  - cu: '**Chúng tôi chưa tìm thấy nghiên cứu công bố nào về 4 trạng thái bản sắc của Marcia trên người Việt.** Hầu hết dữ liệu trong bài đến từ Mỹ và châu Âu (Hà Lan, Bỉ). Vì vậy mọi con số ở trên là "bản đồ vẽ từ đất nước khác" — các *cơ chế* (khám phá × cam kết, bản sắc chín dần theo tuổi) nhiều khả năng đúng phổ quát, nhưng *tỉ lệ* từng trạng thái ở Việt Nam có thể khác hẳn.'
    moi: '**Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu công bố nào về 4 trạng thái bản sắc của Marcia trên người Việt.** Các nguồn chúng tôi đọc kỹ đến từ Mỹ (Marcia, 1966) và Hà Lan (Meeus và cộng sự, 2012). Vì vậy các con số ở trên là "bản đồ vẽ từ nơi khác": chúng tôi chưa biết các *cơ chế* (khám phá × cam kết, bản sắc chín dần theo tuổi) hay *tỉ lệ* từng trạng thái ở Việt Nam có giống không.'
    ly_do: 'Thêm mốc thời gian (thoi-su). Chữ cũ: "Hầu hết dữ liệu… Mỹ và châu Âu (Hà Lan, Bỉ)" (Bỉ chưa kiểm) và "cơ chế… nhiều khả năng đúng phổ quát" (không có nguồn).'
  - cu: 'Có vài điểm văn hóa Việt Nam đáng suy ngẫm. Thứ nhất, áp lực **"con nhà người ta"** và truyền thống hiếu thảo khiến **foreclosure có thể phổ biến hơn** ở Việt Nam: chọn ngành theo nguyện vọng cha mẹ, theo "ngành hot", cưới xin theo sắp đặt — những lựa chọn được "chốt hộ" trước khi teen kịp thử. Theo một tổng quan nghiên cứu, ở Đài Loan — một xã hội Đông Á có nhiều nét tương đồng — đa số thanh thiếu niên được ghi nhận ở trạng thái foreclosure (Lee và Beckert, 2012, dẫn theo Seginer và Mahajna, 2018). Việt Nam chưa có số liệu tương đương, nhưng logic văn hóa tương tự gợi ý đây là giả thuyết đáng kiểm chứng, không phải kết luận.'
    moi: 'Có vài câu hỏi đáng suy ngẫm cho bối cảnh Việt Nam. Thứ nhất, một giả thuyết (chưa có số liệu): ở những gia đình kỳ vọng cao vào việc con chọn ngành học, foreclosure có thể phổ biến hơn. Đây là giả thuyết đáng kiểm chứng, không phải kết luận.'
    ly_do: 'Chữ cũ: các khẳng định về "con nhà người ta", "ngành hot", "cưới xin theo sắp đặt" (không nguồn) và về Đài Loan (Lee & Beckert 2012, dẫn qua Seginer & Mahajna 2018: chưa mở được cả hai). Bỏ phần Đài Loan; viết lại phần Việt Nam thành giả thuyết nói rõ chưa có số liệu.'
  - cu: 'Thứ hai, một nghiên cứu trên **1.593 học sinh Việt Nam** (Nguyễn và cộng sự, 2020) cho thấy sự ấm áp của cha mẹ gắn với trí tuệ cảm xúc cao hơn ở teen, trong khi sự bao bọc quá mức và độc đoán — đặc biệt từ mẹ — gắn với trí tuệ cảm xúc thấp hơn. Dù nghiên cứu này không đo bản sắc trực tiếp, nó gợi ý: môi trường gia đình độc đoán, ít cho con thử-sai, có thể đồng thời là đất cho foreclosure và cho khó khăn cảm xúc.'
    moi: Thứ hai, một nghiên cứu cắt ngang trên **1.593 học sinh Việt Nam** (Nguyễn và cộng sự, 2020) thấy sự ấm áp của cha mẹ gắn với trí tuệ cảm xúc cao hơn ở teen, trong khi sự bao bọc quá mức và độc đoán từ mẹ gắn với trí tuệ cảm xúc thấp hơn. Nghiên cứu này không đo bản sắc, nên chúng tôi không suy rộng sang foreclosure.
    ly_do: 'Chữ cũ: "đặc biệt từ mẹ" (tóm tắt chỉ nêu bao bọc, độc đoán "from mothers"), và suy luận "môi trường độc đoán… đất cho foreclosure" (vượt quá nghiên cứu không đo bản sắc). Bỏ suy luận.'
  - cu: 'Thứ ba, **bản sắc trên mạng xã hội**: teen Việt Nam hôm nay phải quản lý nhiều "phiên bản mình" cùng lúc — ngoan hiền trên Facebook có bố mẹ theo dõi, "chất" trên TikTok, thật lòng trong nhóm chat kín. Áp lực trình diễn bản sắc trước khán giả vô hình có thể khiến quá trình thử nghiệm tự nhiên biến thành lo âu thường trực: không còn "thử cho mình biết", mà "thử cho người ta thấy". Đây là hiện tượng mới mà cả Erikson lẫn Marcia đều chưa từng thấy — và cũng chưa có nghiên cứu Việt Nam nào đo lường nó một cách hệ thống.'
    moi: 'Thứ ba, một câu hỏi về **bản sắc trên mạng xã hội**: teen có thể trình bày bản thân khác nhau ở các nơi khác nhau, và việc trình diễn trước khán giả có thể thay đổi cách thử nghiệm bản sắc; đây là một câu hỏi mở, chúng tôi chưa mở được nghiên cứu nào cho thấy điều đó ở teen Việt Nam.'
    ly_do: 'Chữ cũ mô tả cụ thể hành vi của "teen Việt Nam hôm nay" (Facebook, TikTok, nhóm chat) và hệ quả lo âu thường trực: không có nguồn nào đã mở. Viết lại thành câu hỏi mở. (Trang mạng xã hội và teen ở phần 2.)'
  - cu: '- **"Khủng hoảng bản sắc là bệnh, phải chữa."** Không. Trong ngôn ngữ của Erikson và Marcia, "khủng hoảng" (crisis) nghĩa là giai đoạn thử nghiệm, băn khoăn trước khi quyết định — một phần bình thường, thậm chí cần thiết, của phát triển. Chỉ khi băn khoăn biến thành vòng lặp lo âu kéo dài kèm triệu chứng trầm cảm thì mới là vấn đề sức khỏe tâm thần.'
    moi: '- **"Khủng hoảng bản sắc là bệnh, phải chữa."** Theo cách Marcia dùng, "khủng hoảng" (crisis) nghĩa là giai đoạn dấn thân chọn giữa các lựa chọn có ý nghĩa, không phải một chẩn đoán. Nếu băn khoăn kéo dài và làm bạn khó chịu, hãy nói chuyện với người có chuyên môn; xem [Hỗ trợ](/psyche/ho-tro/).'
    ly_do: 'Chữ cũ: "một phần bình thường, thậm chí cần thiết, của phát triển" và "Chỉ khi băn khoăn biến thành vòng lặp lo âu… thì mới là vấn đề sức khỏe tâm thần" (ngưỡng nói như tiêu chí, không có nguồn). Thay bằng định nghĩa của Marcia và lời dẫn tới Hỗ trợ.'
  - cu: '- **"Theo ý cha mẹ thì không có bản sắc."** Sai. Foreclosure vẫn là một trạng thái bản sắc — có cam kết hẳn hoi, chỉ thiếu giai đoạn tự mình thử. Trong môi trường ổn định, nó vận hành tốt; điểm yếu của nó là tính giòn trước biến động, không phải sự "vô bản sắc".'
    moi: '- **"Theo ý cha mẹ thì không có bản sắc."** Theo Marcia, foreclosure vẫn là một trạng thái bản sắc: có cam kết, nhưng chưa trải qua giai đoạn khủng hoảng. Trong nghiên cứu dọc Hà Lan, early closure có mức thích ứng thuộc nhóm tốt nhất (Meeus và cộng sự, 2012); Marcia (1966) lại mô tả họ cứng nhắc hơn.'
    ly_do: 'Chữ cũ: "Sai… Trong môi trường ổn định, nó vận hành tốt; điểm yếu của nó là tính giòn" (không nguồn; "môi trường ổn định" không được đo). Thay bằng Marcia 1966 và Meeus 2012.'
  - cu: Nhầm lẫn moratorium với diffusion. Người ở moratorium đang **chủ động** thu hẹp các lựa chọn — đó là quyết đoán đang trong quá trình hình thành, không phải thiếu quyết đoán.
    moi: Theo Marcia, moratorium khác diffusion ở chỗ người moratorium có "an active struggle to make commitments", nên không đồng nghĩa với thiếu quyết đoán.
    ly_do: Chữ cũ "chủ động thu hẹp… quyết đoán đang hình thành" là diễn giải; thay bằng câu của Marcia.
  - cu: 'Dữ liệu dọc bác bỏ: 15% người "đi lùi" về trạng thái kém vững hơn ở một thời điểm nào đó, và các trạng thái có thể dịch chuyển qua lại. Bản sắc là quá trình bảo trì cả đời, không phải bài thi một lần.'
    moi: Trong các nghiên cứu dọc, trung bình 15% đổi sang trạng thái kém vững hơn và 36% tiến bộ (Kroger và cộng sự, 2010), nên các trạng thái có thể dịch chuyển. Các nguồn chúng tôi đọc chỉ đến khoảng 30 tuổi.
    ly_do: 'Chữ cũ: "bác bỏ", "bản sắc là quá trình bảo trì cả đời" (vượt quá dữ liệu đến khoảng 30 tuổi).'
  - cu: '> Đây là giai đoạn thứ năm trong 8 giai đoạn của Erikson (1968). Giải quyết tốt, teen có được fidelity — sự trung thành với những giá trị mình đã chọn; giải quyết dở, teen rơi vào lẫn lộn vai trò.'
    moi: '> Đây là giai đoạn thứ năm trong 8 giai đoạn của Erikson (theo giáo trình). Giải quyết tốt, teen có cảm giác bản thân vững và giữ được niềm tin của mình; không giải quyết được thì có thể rơi vào lẫn lộn vai trò.'
    ly_do: '"fidelity" và "giải quyết dở… rơi vào" không có trong nguồn đã mở; theo giáo trình.'
  - cu: '> Marcia đo hai trục này bằng phỏng vấn sâu về nghề nghiệp và hệ tư tưởng trên 86 nam sinh viên — và thấy mỗi trạng thái đi kèm cách tư duy, đặt mục tiêu khác nhau thật.'
    moi: '> Marcia đo hai tiêu chí này bằng phỏng vấn về nghề nghiệp, tôn giáo và chính trị trên 86 nam sinh viên — và thấy các trạng thái khác nhau ở một số thước đo như bài tập nhận thức dưới căng thẳng, cách đặt mục tiêu và thang độc đoán.'
    ly_do: Chữ cũ "phỏng vấn sâu về nghề nghiệp và hệ tư tưởng… mỗi trạng thái đi kèm cách tư duy… khác nhau thật" nói chắc hơn nguồn (lòng tự trọng không phân biệt được).
  - cu: '> Trong nghiên cứu gốc của Marcia, nhóm foreclosure đặt mục tiêu phi thực tế và có điểm độc đoán cao hơn — nhưng trong xã hội ổn định, foreclosure vẫn có thể vận hành tốt; điểm yếu của nó là "giòn" khi môi trường thay đổi.'
    moi: '> Trong nghiên cứu gốc của Marcia, nhóm foreclosure đặt mục tiêu cao hơn mức đạt được và có điểm độc đoán cao hơn; ngược lại, trong nghiên cứu dọc Hà Lan, early closure có mức thích ứng thuộc nhóm tốt nhất (Meeus và cộng sự, 2012).'
    ly_do: Chữ cũ "trong xã hội ổn định… vẫn có thể vận hành tốt… giòn" không có nguồn.
  - cu: '- Kroger, J., & Marcia, J. E. (2011). The identity statuses: Origins, meanings, and interpretations. Trong S. J. Schwartz, K. Luyckx, & V. L. Vignoles (Chủ biên), *Handbook of identity theory and research* (tr. 31–53). New York: Springer. <https://doi.org/10.1007/978-1-4419-7988-9_2>

      '
    moi: ''
    ly_do: Sách chương không được dẫn trong bài và chưa đọc; bỏ khỏi danh sách.
  - cu: '- Marcia, J. E. (1966).'
    moi: '- OpenStax. (2020). *Psychology 2e*, chương 9: Lifespan Development. <https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories>

      - Marcia, J. E. (1966).'
    ly_do: Thêm giáo trình đã dùng; xếp theo vị trí cũ gần các nguồn.
  - cu: '"Hai năm trước khi Erikson ra sách, **James Marcia** (khi đó là nghiên cứu sinh ở Đại học Bang Ohio) đã dựa vào khái niệm của Erikson để đề xuất cách đo bản sắc bằng phỏng vấn. Năm 1966, Marcia đề xuất: …"'
    moi: '"Năm 1966, hai năm trước khi Erikson ra sách, **James Marcia** công bố một cách đo bản sắc bằng phỏng vấn, dựa vào khái niệm của Erikson và phát triển từ luận án tiến sĩ của ông ở Đại học Bang Ohio. Marcia đề xuất: …"'
    ly_do: "Review D6-L3, hồ sơ n7 (Marcia 1966: luận án 1964 ở Ohio State; năm 1966 ở SUNY Buffalo)."
  - cu: '"**Ý tưởng.** Trong *Identity: Youth and Crisis*, Erikson hệ thống hóa quan sát lâm sàng nhiều năm … “sàng lọc” lại tất cả những gì mình từng đồng nhất hồi nhỏ (muốn giống bố, giống cô giáo, giống siêu nhân) …" và "**Hạn chế.** Đây là lý thuyết lâm sàng, không phải thí nghiệm: Erikson không đo đạc, không có nhóm đối chứng."'
    moi: '"**Ý tưởng.** Trong lý thuyết 8 giai đoạn …, giai đoạn tuổi teen … là lúc hình thành một bản sắc ổn định, trọn vẹn bằng cách trước hết thử nhiều vai trò khác nhau; … ([OpenStax Lifespan Development, mục 10.1](…))." và "**Hạn chế.** Đây là một lý thuyết, không phải kết quả thí nghiệm."'
    ly_do: "Review D6-L3, hồ sơ n12: chữ cũ dựa vào sách Erikson chưa mở."
  - cu: ":::vung-chac[4 trạng thái bản sắc của Marcia là có thật và đo được] … Giới hạn: các nguồn chúng tôi đọc kỹ đến từ Mỹ và Hà Lan; …"
    moi: ":::kha-vung[4 trạng thái bản sắc của Marcia đo được và phân biệt được với nhau] … Giới hạn: phân tích tổng hợp dùng sẵn bốn trạng thái chứ không kiểm tra chúng; xác nhận trực tiếp mới có ở một nghiên cứu dọc; …"
    ly_do: Review D6-L3, hồ sơ n29.
  - cu: 'Khung Vững chắc "bản sắc chín dần…": "…không phải mốc cố định của việc tìm ra mình là ai."'
    moi: 'thêm "Giới hạn: dữ liệu chỉ tới khoảng 30 tuổi và chủ yếu ở các nước phương Tây."'
    ly_do: Review D6-L3, hồ sơ n30.
  - cu: '### 1. Xác định mình đang ở đâu, rồi hành xử cho đúng :nhan[kha-vung] … "Điều dữ liệu cho thấy là …"'
    moi: '### 1. Khám phá đào sâu đi cùng cam kết chắc hơn :nhan[kha-vung] { #1-xac-dinh-minh-dang-o-dau-roi-hanh-xu-cho-dung-kha-vung } … "Điều dữ liệu quan sát cho thấy là … Chưa có nghiên cứu nào cho thấy việc tự xếp mình vào một trạng thái rồi hành xử theo đó giúp ích."'
    ly_do: Review D6-L3, hồ sơ n39 (lượt 2 quá mạnh).
  - cu: '"Thứ ba, một câu hỏi về **bản sắc trên mạng xã hội**: teen có thể trình bày bản thân khác nhau ở các nơi khác nhau, và việc trình diễn trước khán giả có thể thay đổi cách thử nghiệm bản sắc; …"'
    moi: '"Thứ ba, một câu hỏi mở về **bản sắc trên mạng xã hội**: việc trình bày bản thân trước nhiều nhóm người xem khác nhau có làm thay đổi cách teen thử nghiệm bản sắc không? …"'
    ly_do: Review D6-L3, hồ sơ n47.
  - cu: Hình marcia-matrix, chú thích kết thúc ở "…là Diffusion (“chưa tìm, chưa chọn”)."
    moi: thêm "Marcia (1966) ghi người ở diffusion có thể đã hoặc chưa từng trải qua giai đoạn khám phá; điểm nhận diện là thiếu cam kết."
    ly_do: 'Review D6-L3: Marcia 1966 (toàn văn) "The identity-diffusion subject may or may not have experienced a crisis period; his hallmark is a lack of commitment"; sơ đồ đặt Diffusion ở ô khám phá thấp như OpenStax Lifespan 10.1, nên giữ ô và thêm lời giới hạn.'
  - cu: Mục Nguồn (không có OpenStax Lifespan Development)
    moi: thêm OpenStax (2024), Lifespan Development, mục 10.1
    ly_do: "Review D6-L3: nguồn mới dẫn ở mục Erikson."
  - cu: "| | Chưa cam kết | Đã cam kết |"
    moi: "| Khám phá | Chưa cam kết | Đã cam kết |"
    ly_do: Ô tiêu đề cột đầu bỏ trống (axe empty-table-header, WCAG); tên cột nêu chiều của hàng.
mo_khoa:
  - ngay: 2026-11-10
    nhanh: moi/d6-l3
    ly_do: Bảng trạng thái bản sắc có ô tiêu đề cột đầu bỏ trống (axe empty-table-header); điền 'Khám phá'. Chưa lên main.
