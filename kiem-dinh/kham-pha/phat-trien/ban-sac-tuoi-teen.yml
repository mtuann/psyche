  - id: n53
    cau: 'Câu 1: nhiệm vụ trung tâm của tuổi teen (12–18) theo Erikson là bản sắc đối đầu với lẫn lộn vai trò; giai đoạn thứ năm.'
    loai: phat-hien
    nguon:
      - openstax-9
    trich: In adolescence (ages 12–18), children face the task of identity versus role confusion.
    vi_tri: OpenStax 9.2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ trong lời giải thích: "teen có được fidelity… giải quyết dở, teen rơi vào lẫn lộn vai trò". Chữ mới theo giáo trình. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
