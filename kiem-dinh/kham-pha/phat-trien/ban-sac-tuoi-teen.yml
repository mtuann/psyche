    ghi_chu: 'Chữ cũ: "Dữ liệu dọc bác bỏ… Bản sắc là quá trình bảo trì cả đời, không phải bài thi một lần". Chữ mới nêu giới hạn dữ liệu. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
