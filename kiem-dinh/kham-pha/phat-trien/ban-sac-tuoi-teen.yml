nhan_dinh:
  - id: n1
    cau: 'Trang mô tả: giai đoạn bản sắc của Erikson (1968), 4 trạng thái bản sắc của Marcia (1966), dữ liệu dọc cho thấy bản sắc chín dần tới tận tuổi 20+, và mối liên hệ với sức khỏe tâm thần.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Mô tả (description). Khớp các mục sau khi sửa; "mối liên hệ với sức khỏe tâm thần" là tương quan (Luyckx 2013). Review (Claude Opus 5.5, 10/11/2026): Đổi loại lich-su thành ve-site: câu là mô tả (description) nội dung của chính trang. Đã kiểm trên trang: có Erikson (1968), Marcia (1966), dữ liệu dọc tới tuổi 20+ và liên hệ với trầm cảm (tương quan); khớp.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Câu mô tả trang (ve-site): không qua lượt 2 (câu về chính trang, ví dụ giả định hay lời dẫn)"
    review: dung
  - id: n2
    cau: 'Linh, 17 tuổi (tình huống minh họa): cảm giác "nhiều phiên bản mình" có thể là một phần của việc tìm ra mình là ai, nhiệm vụ Erikson gắn với tuổi teen.'
    loai: ve-site
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "bạn không hề ''giả tạo'' — bạn đang ở đúng giữa nhiệm vụ tâm lý lớn nhất của tuổi teen… Cảm giác ''nhiều phiên bản mình'' là dấu hiệu của quá trình thử nghiệm, không phải dấu hiệu có gì đó sai ở bạn". Chữ mới mềm, thêm lời dẫn tới Hỗ trợ. Câu chuyện Linh và các nhóm bạn là minh họa (gia-dinh). Review (Claude Opus 5.5, 10/11/2026): Đổi loại phat-hien thành ve-site: chuyện của Linh là ví dụ giả định của trang (gia-dinh); ý "nhiệm vụ Erikson gắn với tuổi teen" đã có ở n4 (có nguồn). Đã kiểm trên trang: lời rào và link Hỗ trợ đúng.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Tình huống minh họa giả định (Linh, 17 tuổi): không qua lượt 2 (câu về chính trang, ví dụ giả định hay lời dẫn)"
    review: dung
  - id: n3
    cau: 'Erikson (1968) xuất bản Identity: Youth and Crisis; ông cho rằng đời người đi qua 8 giai đoạn, mỗi giai đoạn có một "khủng hoảng" cần giải quyết.'
    loai: lich-su
    nguon:
      - openstax-9
      - erikson1968
    trich: According to psychosocial theory, we experience eight stages of development over our lifespan, from infancy through late adulthood. ; In each stage of Erikson’s theory, there is a psychosocial task that we must master
    vi_tri: OpenStax 9.2
    ket_qua: da-lam-mem
    ghi_chu: 'Năm 1968 và nhan đề sách: Crossref xác nhận một bài điểm sách Science 161(3838) 1968 về "Identity: Youth and Crisis"; sách chưa mở. "Khủng hoảng không phải thảm họa mà là bước ngoặt phải lựa chọn" khớp định nghĩa "crisis" của Marcia (giai đoạn dấn thân chọn giữa các lựa chọn). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://api.crossref.org/works/10.1126/science.161.3838.257", "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
    luot_2_ghi_chu: Năm 1968 xác nhận bằng bài điểm sách đăng Science 161; tám giai đoạn mỗi giai đoạn một xung đột xác nhận OpenStax 9.2.
    review: dung
  - id: n4
    cau: Giai đoạn thứ năm của Erikson, khoảng 12–18 tuổi, là bản sắc đối đầu với lẫn lộn vai trò; teen phải ghép các mảnh trải nghiệm thành một cảm giác bản thân thống nhất và liên tục.
    loai: lich-su
    nguon:
      - openstax-9
      - marcia1966
    trich: the individual is required to synthesize childhood identifications in such a way that he can both establish a reciprocal relationship with his society and maintain a feeling of continuity within himself.
    vi_tri: Marcia 1966, mở bài (theo Erikson); OpenStax 9.2
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
  - id: n5
    cau: 'Giáo trình: teen giải quyết tốt có cảm giác bản thân vững và giữ được niềm tin; teen chịu áp lực theo ý người khác hay không chủ động tìm kiếm có thể có cảm giác bản thân yếu, lúng túng về tương lai.'
    loai: phat-hien
    nguon:
      - openstax-9
    trich: These teens will have a weak sense of self and experience role confusion. They are unsure of their identity and confused about the future.
    vi_tri: OpenStax 9.2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "fidelity (sự trung thành…); không giải quyết được… dễ bị lôi kéo theo đám đông hoặc buông xuôi". Chữ mới theo giáo trình. Lý do: "fidelity" và "đám đông/buông xuôi" không có trong nguồn đã mở. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu. OpenStax Lifespan Development (2024), mục 10.1 cũng mô tả tương tự.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
    review: dung
  - id: n6
    cau: 'Erikson: psychosocial moratorium, "khoảng lùi tâm lý–xã hội": xã hội cho teen khoảng thời gian được thử, được sai, chưa quyết định trước khi gánh trách nhiệm người lớn.'
    loai: lich-su
    nguon:
      - erikson1968
    trich: '(không áp dụng: câu đã bỏ)'
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ: cả đoạn "Erikson cũng nhấn mạnh một khái niệm quan trọng: psychosocial moratorium…" ở mục Điều gì đang xảy ra. Đã bỏ (các nơi khác của trang đã viết lại, không còn nhắc khái niệm này của Erikson). Lý do: không mở được Erikson 1968 hay nguồn nào nêu khái niệm (OpenStax không có; Marcia 1966 dùng "moratorium" làm tên trạng thái). Lượt 2 có thể tìm nguồn (giáo trình mở, Kroger & Marcia 2011) để đưa lại. Review (Claude Opus 5.5, 10/11/2026): Đã kiểm: trang không còn chữ "psychosocial moratorium" hay "khoảng lùi"; OpenStax Lifespan Development (2024), mục 10.1 chỉ nói moratorium (trạng thái của Marcia) "provides the psychological space and motivation to explore", không gán khái niệm cho Erikson.'
    luot_2: khong-chac
    luot_2_ghi_chu: '"Psychosocial moratorium" của Erikson (1968): không mở được sách Identity: Youth and Crisis; OpenStax, Marcia 1966 (tóm tắt) và Meeus 2012 không nêu khái niệm này.'
    review: dung
  - id: n7
    cau: Năm 1966, hai năm trước khi Erikson ra sách, Marcia công bố một cách đo bản sắc bằng phỏng vấn, dựa vào khái niệm của Erikson và phát triển từ luận án tiến sĩ ở Đại học Bang Ohio.
    loai: lich-su
    nguon:
      - marcia1966
    trich: This paper is based in part on a doctoral dissertation submitted to the Ohio State University (Marcia, 1964). | [địa chỉ tác giả ở đầu bài] State University of New York at Buffalo
    vi_tri: Marcia 1966, trang đầu (chú thích 1, địa chỉ tác giả)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "học trò của ông là James Marcia đã biến lý thuyết trừu tượng này thành thứ đo được". Chữ mới bỏ "học trò" (bài 1966 ghi luận án ở Ohio State, người hướng dẫn D. P. Crowne và G. A. Kelly) và "biến thành thứ đo được" (trước đó đã có cách đo khác). Review (Claude Opus 5.5, 10/11/2026): Đọc lại toàn văn Marcia 1966 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus, tệp 10.1037%252Fh0023281.pdf trong zip 10.1037%252Fa0017364.zip): luận án nộp ở Ohio State năm 1964, còn bài 1966 ghi địa chỉ State University of New York at Buffalo. Chữ trên trang "(khi đó là nghiên cứu sinh ở Đại học Bang Ohio)" đặt cạnh mốc 1966 là sai thời điểm. Đã viết lại câu; doi_chu.'
    luot_2: khong-chac
    luot_2_ghi_chu: Marcia 1966 (J Personality and Social Psychology 3, 551) xác nhận là bài đề xuất cách đo bằng phỏng vấn (86 nam sinh viên, tóm tắt), và Meeus 2012 xác nhận "Marcia (1966) distinguished four identity statuses"; nhưng chi tiết Marcia là nghiên cứu sinh ở Ohio State không đọc được trong nguồn đã mở.
    review: sai
  - id: n8
    cau: 'Marcia dùng hai tiêu chí: khủng hoảng ("crisis", giai đoạn dấn thân chọn giữa các lựa chọn có ý nghĩa) và cam kết ("commitment", mức độ đầu tư cá nhân), áp dụng cho nghề nghiệp, tôn giáo và chính trị.'
    loai: dinh-nghia
    nguon:
      - marcia1966
    trich: Crisis refers to the adolescent's period of engagement in choosing among meaningful alternatives; commitment refers to the degree of personal investment the individual exhibits.
    vi_tri: Marcia 1966, mở bài (trước phần Method)
    ket_qua: da-lam-mem
    ghi_chu: 'Trang gọi trục "khám phá (exploration)" và nói rõ trong bài gốc là "crisis" ✓ khớp. Chữ cũ liệt kê "hệ tư tưởng (tôn giáo, chính trị, giá trị sống)" cho hai lĩnh vực: bài gốc ba lĩnh vực nghề nghiệp, tôn giáo, chính trị; xem nhận định về thiết kế. Review (Claude Opus 5.5, 10/11/2026): Đọc lại toàn văn Marcia 1966 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus, tệp 10.1037%252Fh0023281.pdf trong zip 10.1037%252Fa0017364.zip): "crisis and commitment, applied to occupational choice, religion, and political ideology. Crisis refers to the adolescent''s period of engagement in choosing among meaningful alternatives; commitment refers to the degree of personal investment". Khớp từng vế.'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1037/h0023281", "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=3394234" ]
    luot_2_ghi_chu: Tóm tắt Marcia nói "occupation and ideology"; việc tách ý thức hệ thành tôn giáo và chính trị là cách chia thường dùng của Marcia, tóm tắt không liệt kê.
    review: dung
  - id: n9
    cau: 'Bốn trạng thái: moratorium (đang khủng hoảng, cam kết mơ hồ, nỗ lực để cam kết), achievement (đã trải qua khủng hoảng và cam kết), diffusion (thiếu cam kết), foreclosure (chưa trải qua khủng hoảng nhưng cam kết).'
    loai: dinh-nghia
    nguon:
      - marcia1966
    trich: The moratorium subject is in the crisis period with commitments rather vague; he is distinguished from the identity-diffusion subject by the appearance of an active struggle to make commitments.
    vi_tri: Marcia 1966, mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: Moratorium "băn khoăn, lo âu nhưng đang tiến lên" → "đang trong khủng hoảng, cam kết còn mơ hồ nhưng đang nỗ lực". Bảng 2×2 cũ đặt diffusion ở ô "không khám phá": Marcia viết diffusion "may or may not have experienced a crisis period; his hallmark is a lack of commitment"; trang thêm lời giới hạn. Hình marcia-matrix không có số liệu; ghi: Diffusion ở ô khám phá thấp là đơn giản hóa (hình không sửa). Review (Claude Opus 5.5, 10/11/2026): Đọc lại toàn văn Marcia 1966 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus, tệp 10.1037%252Fh0023281.pdf trong zip 10.1037%252Fa0017364.zip): định nghĩa bốn trạng thái khớp (moratorium "in the crisis period with commitments rather vague… active struggle to make commitments").'
    luot_2: dung
    luot_2_nguon: [ "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&rettype=xml&id=3394234" ]
    review: dung
  - id: n10
    cau: 'Achievement có thể là biến thể của mong muốn cha mẹ: đã xem xét nhiều lựa chọn và quyết định theo cách của mình.'
    loai: phat-hien
    nguon:
      - marcia1966
    trich: he has seriously considered several occupational choices and has made a decision on his own terms, even though his ultimate choice may be a variation of parental wishes.
    vi_tri: Marcia 1966, mở bài
    ket_qua: dung
    luot_2: khong-chac
    luot_2_ghi_chu: Câu khó hiểu ("achievement có thể là biến thể của mong muốn cha mẹ"); chưa tìm thấy nguồn đã mở nói điều này (Marcia 1966 bản đầy đủ không mở được).
    ghi_chu: 'Review (Claude Opus 5.5, 10/11/2026): Đọc lại toàn văn Marcia 1966 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus, tệp 10.1037%252Fh0023281.pdf trong zip 10.1037%252Fa0017364.zip): "…has made a decision on his own terms, even though his ultimate choice may be a variation of parental wishes." Lượt 2 không mở được; nay đã giải quyết.'
    review: dung
  - id: n11
    cau: 'Các trạng thái là trạng thái, không phải các giai đoạn bắt buộc theo thứ tự: người ta có thể tiến hay lùi giữa các trạng thái (ví dụ minh họa 15, 19, 24 tuổi).'
    loai: phat-hien
    nguon:
      - kroger2010
    trich: the mean proportion of adolescents making progressive identity status changes was .36, compared with .15 who made regressive changes and .49 who remained stable
    vi_tri: Kroger 2010, tóm tắt
    ket_qua: dung
    ghi_chu: Các tuổi 15, 19, 24 và chuyện "quay ngược lại" là minh họa (gia-dinh); khớp ý tiến bộ và thoái lui của Kroger 2010.
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/20004962" ]
    luot_2_ghi_chu: "Kroger, Martinussen & Marcia 2010, Journal of Adolescence: trạng thái đổi cả hai chiều, không theo trình tự bắt buộc."
  - id: n12
    cau: "Erikson: giai đoạn tuổi teen là lúc hình thành một bản sắc ổn định, trọn vẹn bằng cách trước hết thử nhiều vai trò; không hình thành được thì dẫn tới lẫn lộn vai trò. Hạn chế: đây là một lý thuyết, không phải kết quả thí nghiệm; Marcia (1966) đề xuất cách đo bằng phỏng vấn sau các nỗ lực đo bản sắc trước đó."
    loai: lich-su
    nguon:
      - openstax-ls-10-1
      - marcia1966
    trich: Erikson’s fifth psychosocial stage, identity versus role confusion, involves forming a stable and whole identity by first exploring various roles and identities ... Failing to develop an identity results in role confusion [Lifespan 10.1] | Previous studies have attempted to determine the extent of ego-identity achievement by means of an adjustment measure and the semantic differential technique (Bronson, 1959) ... [Marcia 1966]
    vi_tri: Marcia 1966, mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chính Marcia là người đầu tiên biến khung nhìn ấy thành biến số đo được". Chữ mới nêu các nỗ lực đo trước (Bronson 1959, Gruen 1960, Block 1961, Rasmussen 1964). "Lý thuyết lâm sàng, không đo đạc, không nhóm đối chứng" của Erikson chưa kiểm ở bản gốc (nhận xét chung của trang), ghi cho lượt 2. Review (Claude Opus 5.5, 10/11/2026): Đoạn "Ý tưởng" của mục Erikson (1968) chưa có nhận định nào trong hồ sơ: "hệ thống hóa quan sát lâm sàng nhiều năm", "mô tả chi tiết nhất", "sàng lọc lại những gì từng đồng nhất hồi nhỏ (giống bố, cô giáo, siêu nhân)" đều dựa vào sách Erikson chưa mở; vế "lý thuyết lâm sàng… không đo đạc, không nhóm đối chứng" lượt 1 cũng ghi chưa kiểm. Viết lại theo OpenStax Lifespan Development (2024), mục 10.1 và chỉ giữ "một lý thuyết, không phải kết quả thí nghiệm"; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1037/h0023281", "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
    luot_2_ghi_chu: 'Phần Marcia đề xuất cách đo bằng phỏng vấn sau các nỗ lực trước: khớp. "Erikson lâm sàng, không đo đạc, không nhóm đối chứng" không có nguồn trực tiếp đã mở nhưng không mâu thuẫn (OpenStax: Erikson sửa từ Freud).'
    review: sai
