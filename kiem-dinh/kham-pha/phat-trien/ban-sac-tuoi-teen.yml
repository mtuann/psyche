    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
    luot_2_ghi_chu: Stage 5 theo OpenStax Table 9.1.
    review: dung
  - id: n54
    cau: 'Câu 2: Marcia đo hai tiêu chí bằng phỏng vấn về nghề nghiệp, tôn giáo, chính trị trên 86 nam sinh viên; các trạng thái khác nhau ở một số thước đo.'
    loai: phat-hien
    nguon:
      - marcia1966
    trich: Statuses were determined for 86 college male Ss by means of individual interviews.
    vi_tri: Marcia 1966, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "phỏng vấn sâu về nghề nghiệp và hệ tư tưởng… mỗi trạng thái đi kèm cách tư duy, đặt mục tiêu khác nhau thật". Chữ mới mềm hơn (lòng tự trọng không phân biệt được). Đáp án "achievement = thử rồi chọn; moratorium = đang thử, chưa chọn; foreclosure = chọn theo người khác, chưa thử; diffusion = không thử, không chọn": diffusion "không thử" là đơn giản hóa (xem nhận định về bốn trạng thái). Review (Claude Opus 5.5, 10/11/2026): Đọc lại toàn văn Marcia 1966 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus, tệp 10.1037%252Fh0023281.pdf trong zip 10.1037%252Fa0017364.zip): "occupational choice, religion, and political ideology"; 86 nam sinh viên. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1037/h0023281" ]
    luot_2_ghi_chu: Phần "ideology = tôn giáo, chính trị" không có trong tóm tắt (chỉ nói "occupation and ideology").
    review: dung
  - id: n55
    cau: 'Câu 3: foreclosure khác achievement ở chỗ cả hai đã cam kết nhưng foreclosure theo sẵn người khác chưa thử; Marcia: foreclosure đặt mục tiêu cao hơn mức đạt được, độc đoán hơn; Meeus: early closure thích ứng thuộc nhóm tốt nhất.'
