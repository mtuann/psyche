    luot_2_ghi_chu: 'Kiểm lại 2026-11-10: Europe PMC ("Marcia" và "identity status" và Vietnam/Vietnamese: 3 kết quả, không liên quan) và Crossref ("identity status Marcia Vietnamese adolescents": chỉ có nghiên cứu bản sắc dân tộc của thanh niên Mỹ gốc Việt). Chưa thấy nghiên cứu về 4 trạng thái Marcia ở người Việt ở Việt Nam. Giới hạn: chưa tìm tạp chí trong nước. het_han: 2027-11.'
    review: dung
  - id: n45
    cau: 'Một giả thuyết: ở những gia đình kỳ vọng cao vào việc con chọn ngành học, foreclosure có thể phổ biến hơn (chưa có số liệu Việt Nam).'
