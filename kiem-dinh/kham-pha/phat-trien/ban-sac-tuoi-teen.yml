    trich: A foreclosure subject is distinguished by not having experienced a crisis, yet expressing commitment.
    vi_tri: Marcia 1966, mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ trong lời giải thích: "trong xã hội ổn định, foreclosure vẫn có thể vận hành tốt; điểm yếu của nó là giòn". Chữ mới theo Marcia và Meeus. Lời giải thích không dựa vào vị trí lựa chọn. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp nguồn và câu trích; trang đã sửa đúng như ghi_chu.'
