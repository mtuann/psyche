    trich: These in the 1+1 group were shown a single item in an empty display area. A small screen then rotated up, hiding the item from view, and the experimenter brought a second identical item into the display area
    vi_tri: Wynn 1992, đoạn thiết kế; Hình 1
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "một con búp bê… thêm một con búp bê nữa". Chữ mới: "một vật… một vật giống hệt". Lý do: bài gốc viết "item", không nói búp bê. Trẻ ở TN1: tuổi trung bình 5 tháng 1 ngày (4 tháng 19 ngày đến 5 tháng 16 ngày), 32 trẻ. Review (Claude Opus 5.5, 10/11/2026): Đọc lại bản quét Wynn 1992 (Internet Archive): "a single item... a second identical item", 32 trẻ, tuổi trung bình 5 tháng 1 ngày. Khớp.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/1508269", "https://europepmc.org/article/MED/11194253" ]
    luot_2_ghi_chu: Tóm tắt Wynn 1992 và mô tả thủ tục của Wynn trong tóm tắt Wakeley 2000; chi tiết "đặt thêm một vật sau màn" thuộc thủ tục chuẩn, không đọc được toàn văn Wynn.
    review: dung
  - id: n32
    cau: Trẻ nhìn kết quả phi lý lâu hơn kết quả hợp lý, ở cả phép cộng và phép trừ (khác biệt có ý nghĩa thống kê).
    loai: phat-hien
