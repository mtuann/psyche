    ly_do: 'Bằng chứng theo hai hướng: Baillargeon 1987 cho thấy trẻ 3,5–4,5 tháng nhìn lâu hơn ở tình huống phi lý (sớm hơn mốc khoảng 9 tháng của Piaget); Bjork & Cummings 1984 cho thấy lỗi AB có thể do cách đo và trí nhớ; nhưng kết quả của Wynn không lặp lại nhất quán (Wakeley 2000). Mốc tuổi thay đổi theo cách đo là điều các nguồn ủng hộ; chưa có tái lập lớn có đăng ký trước: Đang tranh cãi'
    ket_qua: da-lam-mem
    ghi_chu: 'Đổi chữ: "hạn chế của trí nhớ làm việc" thành "vấn đề về trí nhớ" (Bjork & Cummings nói "memory problem"). Vế McGarrigle & Donaldson (trẻ 4–5 tuổi, gấu nghịch ngợm, hàng nút) đã bỏ (xem nhận định da-bo), thay bằng Baillargeon 1987. Review (Claude Opus 5.5, 10/11/2026): Nhãn Đang tranh cãi đạt thước đo (kết quả đổi theo cách đo; Wynn chưa lặp lại được). Review thêm vào khung một câu McGarrigle & Donaldson 1974 (toàn văn, xem n38) và nguồn tương ứng; doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories", "https://europepmc.org/article/MED/11194253" ]
    luot_2_ghi_chu: Đang tranh cãi là nhãn khớp thước đo.
    review: dung
  - id: n38
    cau: 'McGarrigle & Donaldson (1974): 50 trong 80 trẻ 4–6 tuổi bảo toàn khi hàng bị một chú gấu "nghịch ngợm" làm xáo trộn, so với 13 khi người làm thí nghiệm tự tay xếp lại.'
    loai: phat-hien
    trich: Eighty children aged between 4 years 2 months and 6 years 3 months were tested on length and number conservation, both when the transformation occurred because of a direct action by the experimenter and when it happened ‘accidentally’ as the by-product of an activity directed towards a different goal. Fifty children conserved when the transformation was ‘accidental’, whereas only 13 were successful when it was intentional. | E lifted teddy out of the box, and showed him to the child, explaining ... teddy was very naughty
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ ở khung Đang tranh cãi: "McGarrigle và Donaldson (1974) cho thấy trẻ 4–5 tuổi trả lời đúng bài toán bảo toàn khi tình huống có ý nghĩa với trẻ (như chú gấu ''nghịch ngợm'' làm xáo trộn hàng nút…)". Đã bỏ khỏi trang và khỏi danh sách nguồn; thay bằng Baillargeon 1987. Lý do: Crossref xác nhận bài (Cognition 3(4), 341–350, 1974) nhưng không mở được toàn văn hay tóm tắt; độ tuổi, chú gấu, hàng nút không kiểm được. Review (Claude Opus 5.5, 10/11/2026): Lượt 1 bỏ vì không mở được bài; review mở được toàn văn (Internet Archive). Chữ cũ "4–5 tuổi", "hàng nút" sai chi tiết (bài: 4 tuổi 2 tháng đến 6 tuổi 3 tháng, quân đếm và sợi dây). Đưa lại vào khung Đang tranh cãi với số liệu đúng nguồn; ket_qua đổi da-bo thành da-sua; doi_chu.'
    luot_2: khong-chac
    luot_2_ghi_chu: Chi tiết McGarrigle & Donaldson 1974 (trẻ 4–5 tuổi, chú gấu nghịch ngợm) không mở được (không có tóm tắt hay toàn văn).
    nguon:
      - mcgarrigle1974
    vi_tri: Tóm tắt; mục Method, Materials and Situations
    review: sai
