    luot_2_ghi_chu: 'câu đúng: Bốn giai đoạn theo độ tuổi gần đúng, cùng các phát hiện hiện đại (có cái còn tranh cãi, như phép cộng–trừ của trẻ 5 tháng) gợi ý trẻ thể hiện năng lực sớm hơn mốc Piaget khi bài kiểm tra phù hợp hơn.; Chú thích gom ba phát hiện thành bằng chứng chắc cho "năng lực xuất hiện sớm hơn Piaget". Phát hiện của Wynn đã có một lần lặp lại không thấy hiệu ứng (Wakeley, 68 trẻ); OpenStax chỉ nói chung "nhiều nghiên cứu cho rằng" trẻ đạt mốc sớm hơn.'
