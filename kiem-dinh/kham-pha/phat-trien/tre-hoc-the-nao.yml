    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "rút ra từ nguyên lý chung của tâm lý học phát triển". Chữ mới thêm "và vài tổng hợp nhỏ" và lời dẫn đến người có chuyên môn (không chẩn đoán qua bài). Lời khuyên "hỏi người có chuyên môn" là điều quy tắc trang, không cần nguồn nghiên cứu. Review (Claude Opus 5.5, 10/11/2026): Đổi loại loi-khuyen thành ve-site: câu tự mô tả các lời khuyên của trang và lời dẫn tới người có chuyên môn, không có khẳng định cần nguồn. Đã kiểm trên trang (đoạn Giới hạn); không chẩn đoán.'
    luot_2: khong-chac
    luot_2_ghi_chu: 'Lời dẫn tự mô tả của trang; lời khuyên "hỏi bác sĩ nhi khoa khi lo" là chuẩn thực hành, không phải khẳng định bằng chứng kiểm được: không qua lượt 2 (câu về chính trang, ví dụ giả định hay lời dẫn)'
