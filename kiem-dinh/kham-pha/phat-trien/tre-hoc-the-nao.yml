    trich: young infants could fail Piaget's task simply because it requires them to coordinate separate actions on separate objects.
    vi_tri: Baillargeon 1987, mở bài; Bjork & Cummings 1984, tóm tắt ("a memory problem rather than a conceptual one")
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đòi hỏi phối hợp vận động và trí nhớ phức tạp hơn nhiều". Chữ mới gắn từng vế vào nguồn nói điều ấy (phối hợp hành động: Baillargeon; trí nhớ: Bjork & Cummings) và bỏ "phức tạp hơn nhiều". Review (Claude Opus 5.5, 10/11/2026): Mở lại toàn văn Baillargeon 1987 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus, zip 10.1037%252F0002-9432.71.2.245.zip): tóm tắt và mục Phương pháp khớp câu và câu trích; lượt 2 không mở được, nay đã giải quyết. Đoạn mở đầu: "young infants could fail Piaget''s task simply because it requires them to coordinate separate actions on separate objects".'
    luot_2: khong-chac
    luot_2_ghi_chu: 'Piaget dùng nhiệm vụ thò tay tìm (OpenStax: trẻ "reach for the hidden toy") và Diamond 1985 xác nhận lỗi AB liên quan khả năng nhớ/làm theo ý định; nhưng phần "Baillargeon chỉ đo thời gian nhìn" thuộc bài gốc Baillargeon 1987 không mở được.'
