    trich: The 4½-month-olds, and the 3½-month-olds who were fast habituators, looked reliably longer at the impossible than at the possible event
    vi_tri: Baillargeon 1987, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó: hình ghi "3,5 tháng" không nêu hạn định, nhưng ở 3,5 tháng chỉ nhóm nhanh chán (fast habituators) cho kết quả; "hiểu" là diễn giải của tác giả. Hình sai/thiếu hạn định thì ghi lại, không sửa: người giao quyết định có thêm "(nhóm nhanh chán)" vào chú thích. Review (Claude Opus 5.5, 10/11/2026): Mở lại toàn văn Baillargeon 1987 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus, zip 10.1037%252F0002-9432.71.2.245.zip): tóm tắt và mục Phương pháp khớp câu và câu trích; lượt 2 không mở được, nay đã giải quyết. Chữ hình cũ "3,5 tháng: hiểu vật thể tồn tại khi khuất" bỏ mất hạn định nhóm nhanh chán và nói diễn giải của tác giả như sự thật. Đã sửa chữ hình thành hai dòng "4,5 tháng (và 3,5 tháng, nhóm nhanh chán): nhìn lâu hơn / khi vật bị che “biến mất” (Baillargeon, 1987)"; doi_chu.'
    luot_2: khong-chac
    luot_2_ghi_chu: Bài gốc Baillargeon 1987 (Developmental Psychology 23, 655) đóng sau APA PsycNET; không có bản mở, tóm tắt trên Crossref/OpenAlex/PubMed/Semantic Scholar trống; chỉ xác nhận được tiêu đề "Object permanence in 3½- and 4½-month-old infants". Chi tiết thí nghiệm màn quay (habituation, hộp, nhóm nhanh chán, đối chứng, kết luận) chưa được xác nhận bằng nguồn bậc 1–2 đọc được. OpenStax chỉ nói chung rằng nhiều nghiên cứu (Baillargeon 2004) thấy trẻ đạt mốc sớm hơn Piaget.
    review: sai
