    trich: they produced a pattern of errors supportive of the notion that search errors result from a memory problem rather than from a conceptual one
    vi_tri: Bjork & Cummings 1984, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "hạn chế của trí nhớ làm việc". Chữ mới: "vấn đề về trí nhớ". Lý do: tóm tắt không nói "trí nhớ làm việc". Bjork & Cummings: AB error phần lớn là sản phẩm của bài hai-chỗ-giấu, không thấy ở các bài ít ràng buộc hơn. Review (Claude Opus 5.5, 10/11/2026): Khớp tóm tắt Bjork & Cummings 1984 (đọc lại toàn văn): "memory problem rather than ... conceptual one".'
