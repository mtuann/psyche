    ghi_chu: 'Chữ cũ: "đồng hóa, điều ứng và cân bằng". Chữ mới bỏ "cân bằng" (giáo trình không nêu). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp OpenStax Psychology 2e 9.2 (đọc lại 10/11/2026); trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
    luot_2_ghi_chu: OpenStax Psychology 2e, mục 9.2 (Piaget, Erikson).
    review: dung
  - id: n42
    cau: 'Hạn chế của Piaget: bài tìm đồ của ông đòi hỏi nhiều kỹ năng cùng lúc (phối hợp hành động, trí nhớ), nên có thể đánh giá thấp năng lực sớm của trẻ.'
    loai: phat-hien
    nguon:
      - baillargeon1987
      - bjork1984
    trich: young infants could fail Piaget's task simply because it requires them to coordinate separate actions on separate objects.
    vi_tri: Baillargeon 1987, mở bài
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "bài kiểm tra của ông đòi hỏi nhiều kỹ năng cùng lúc (ngôn ngữ, vận động, trí nhớ) nên đánh giá thấp". Chữ mới nói về bài tìm đồ, bỏ "ngôn ngữ", "đánh giá thấp" thành "có thể". Review (Claude Opus 5.5, 10/11/2026): Khớp Baillargeon 1987 (toàn văn, phối hợp hành động) và Bjork & Cummings 1984 (trí nhớ); "có thể" đúng mức.'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/4042750", "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
    luot_2_ghi_chu: Câu dùng "có thể", đúng mức.
    review: dung
  - id: n43
    cau: 'Vygotsky nhấn mạnh vai trò của tương tác xã hội: trẻ có thể làm được nhiều hơn khi có người hiểu biết hơn hỗ trợ, trong "vùng phát triển gần".'
    loai: dinh-nghia
    nguon:
      - openstax-ls-5-3
    trich: The ZPD encompasses the activities a child cannot complete alone but can accomplish with the aid of a more skilled adult or peer, often referred to as the “more knowledgeable other” (Huang, 2021).
    vi_tri: OpenStax Lifespan Development 5.3, mục The Zone of Proximal Development
    ket_qua: da-lam-mem
    ghi_chu: 'Chỗ khó: chỉ có nguồn bậc 3 (Wikipedia dẫn Penguin Dictionary of Psychology); APA Dictionary và OpenStax chương 9 không mở được mục này. Lượt 2 tìm nguồn bậc 2 (giáo trình mở, từ điển APA). Đã viết ở mức định nghĩa chung; chữ cũ thêm "người lớn và bạn bè… gợi ý" và câu suy luận nối với McGarrigle & Donaldson (đã bỏ). Review (Claude Opus 5.5, 10/11/2026): Tìm được nguồn bậc 2: OpenStax Lifespan Development (2024), mục 5.3 định nghĩa vùng phát triển gần đúng như câu (người lớn hay bạn giỏi hơn hỗ trợ). Thay nguồn Wikipedia bằng giáo trình này; trang thêm thuật ngữ tiếng Anh và link; doi_chu.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Vùng phát triển gần (ZPD): OpenStax 9.2/9.3 chỉ nói Vygotsky đề xuất lý thuyết văn hóa–xã hội, không có định nghĩa ZPD; APA Dictionary không tải được qua máy."
    review: dung
  - id: n44
    cau: 'Elizabeth Spelke và cộng sự: nhận thức dựa một phần trên vài "hệ lõi" biểu diễn vật thể, hành động, số lượng và không gian, có gốc rễ sâu từ rất sớm.'
    loai: lich-su
    nguon:
      - spelke2007
    trich: Human cognition is founded, in part, on four systems for representing objects, actions, number, and space. ... Each system has deep roots in human phylogeny and ontogeny
    vi_tri: Spelke & Kinzler 2007, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "trẻ sinh ra đã có sẵn vài ''hệ lõi'' về vật thể, số lượng, không gian — khớp với phát hiện của Baillargeon và Wynn. Trải nghiệm sau đó mài giũa chứ không tạo ra từ con số không". Chữ mới theo tóm tắt (bốn hệ, "deep roots in ontogeny"). Lý do: tóm tắt không nói "sinh ra đã có sẵn" hay vai trò của trải nghiệm; "gần với phát hiện của Baillargeon và Wynn" là nhận xét của trang. Review (Claude Opus 5.5, 10/11/2026): Khớp tóm tắt Spelke & Kinzler 2007 (lượt 2 dung).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/17181705" ]
    luot_2_ghi_chu: Spelke & Kinzler 2007, Developmental Science, "Core knowledge" (tóm tắt Europe PMC).
    review: dung
