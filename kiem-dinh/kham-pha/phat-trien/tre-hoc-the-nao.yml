nhan_dinh:
  - id: n1
    cau: Bốn giai đoạn nhận thức của Piaget, hai thí nghiệm kinh điển về bảo toàn và lỗi A-not-B, và những hiệu chỉnh quan trọng của nghiên cứu hiện đại (mô tả của trang).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Mô tả (description). Nội dung khớp các mục của trang sau khi sửa; hai thí nghiệm: bảo toàn (OpenStax 9.1, 9.2) và A-not-B (Bjork & Cummings). Review (Claude Opus 5.5, 10/11/2026): Đổi loại lich-su thành ve-site: câu là mô tả (description) nội dung của chính trang. Đã kiểm trên trang: có bốn giai đoạn, thí nghiệm bảo toàn, A-not-B và các nghiên cứu về sau; khớp.'
    luot_2: khong-chac
    luot_2_ghi_chu: "Câu mô tả trang (ve-site): không qua lượt 2 (câu về chính trang, ví dụ giả định hay lời dẫn)"
    review: dung
  - id: n2
    cau: Trẻ 5 tuổi (tiền thao tác) thường chưa nhận ra hai cốc có lượng nước bằng nhau; có em chỉ vào chiếc cốc cao. Trẻ 8 tuổi (thao tác cụ thể) thường nói hai cốc bằng nhau vì chỉ rót sang.
    loai: phat-hien
    nguon:
      - openstax-9
    trich: Children in this stage cannot perform mental operations because they have not developed an understanding of conservation
    vi_tri: OpenStax 9.2, mục tiền thao tác; "master the concept of conservation" ở mục thao tác cụ thể
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Trẻ 5 tuổi thường chỉ vào chiếc cốc cao và nói ''cốc này nhiều hơn''". Chữ mới: "thường chưa nhận ra hai cốc bằng nhau; có em chỉ vào chiếc cốc cao". Lý do: giáo trình chỉ nói trẻ tiền thao tác chưa hiểu bảo toàn, không nêu câu trả lời điển hình; bản gốc (Piaget & Inhelder) chưa mở được. Tình huống 5 tuổi và 8 tuổi là minh họa (gia-dinh). Review (Claude Opus 5.5, 10/11/2026): Khớp OpenStax 9.2; McGarrigle & Donaldson 1974 (toàn văn) cũng thấy trẻ 4–6 tuổi phần lớn không bảo toàn ở thủ tục chuẩn. Tình huống là minh họa (gia-dinh).'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
    luot_2_ghi_chu: OpenStax xếp hiểu bảo toàn vào 7–11 tuổi, tiền thao tác (2–7) chưa hiểu bảo toàn. Câu dùng "thường", đúng mức; chi tiết "chỉ vào cốc cao" là ví dụ minh họa, khớp mô tả.
    review: dung
  - id: n3
    cau: Piaget cho rằng ở hai giai đoạn ấy trẻ tư duy theo hai cách khác nhau.
    loai: lich-su
    nguon:
      - openstax-9
    trich: they cannot understand adult logic or mentally manipulate information
    vi_tri: OpenStax 9.2, mục tiền thao tác
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Piaget cho rằng trẻ tư duy theo một cách khác hẳn, chứ không phải ''kém thông minh hơn''". Chữ mới bỏ vế "không phải kém thông minh" (nguồn không nói) và "khác hẳn". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp OpenStax Psychology 2e 9.2 (đọc lại 10/11/2026); trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
    luot_2_ghi_chu: OpenStax Psychology 2e, mục 9.2 (Piaget, Erikson).
    review: dung
  - id: n4
    cau: Jean Piaget quan sát trẻ em và đề xuất rằng trẻ không phải "người lớn thu nhỏ" biết ít hơn mà tư duy khác về chất.
    loai: lich-su
    nguon:
      - openstax-9
    trich: Like Freud and Erikson, Piaget thought development unfolds in a series of stages approximately associated with age ranges.
    vi_tri: OpenStax 9.2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đầu thế kỷ 20, Jean Piaget…". Chữ mới bỏ mốc "đầu thế kỷ 20" (chưa có nguồn mở nêu năm). "Khác về chất" là cách nói gọn của ý các giai đoạn có logic riêng (OpenStax: trẻ tiền thao tác "cannot understand adult logic"). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp OpenStax Psychology 2e 9.2 (đọc lại 10/11/2026); trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
    luot_2_ghi_chu: OpenStax Psychology 2e, mục 9.2 (Piaget, Erikson).
    review: dung
  - id: n5
    cau: 'Trẻ xây dựng hiểu biết qua hai quá trình: đồng hóa (nhét trải nghiệm mới vào khuôn sẵn có) và điều ứng (sửa lại khuôn khi nó không còn đúng).'
    loai: dinh-nghia
    nguon:
      - openstax-9
    trich: assimilation is when they take in information that is comparable to what they already know. Accommodation describes when they change their schemata based on new information.
    vi_tri: OpenStax 9.2, mục Piaget
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
    luot_2_ghi_chu: OpenStax Psychology 2e, mục 9.2 (Piaget, Erikson).
  - id: n6
    cau: Piaget mô tả bốn giai đoạn nối tiếp nhau; độ tuổi chỉ là gần đúng.
    loai: lich-su
    nguon:
      - openstax-9
    trich: Piaget thought development unfolds in a series of stages approximately associated with age ranges.
    vi_tri: OpenStax 9.2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chính Piaget cũng nói trẻ có thể qua các giai đoạn ở tuổi khác nhau và mang đặc điểm của nhiều giai đoạn cùng lúc, nhưng thứ tự thì không đổi và không thể nhảy cóc". Chữ mới: "theo Piaget các giai đoạn nối tiếp nhau theo một thứ tự". Lý do: không nguồn đã mở nào nói các vế bị bỏ; giáo trình chỉ nói "approximately". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp OpenStax Psychology 2e 9.2 (đọc lại 10/11/2026); trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
    luot_2_ghi_chu: OpenStax Psychology 2e, mục 9.2 (Piaget, Erikson).
    review: dung
  - id: n7
    cau: 'Giai đoạn vận động cảm giác: 0–2 tuổi; học qua giác quan và vận động; hình thành tính bền vững của vật thể.'
    loai: phat-hien
    nguon:
      - openstax-9
    trich: The first stage is the sensorimotor stage, which lasts from birth to about 2 years old. During this stage, children learn about the world through their senses and motor behavior.
    vi_tri: OpenStax 9.2; "Between 5 and 8 months old, the child develops object permanence", mục 9.3
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
    luot_2_ghi_chu: Mốc 0–2 tuổi theo OpenStax; OpenStax nêu tính bền vững vật thể ở 5–8 tháng theo nghiên cứu hiện đại.
  - id: n8
    cau: 'Giai đoạn tiền thao tác: 2–7 tuổi; dùng ngôn ngữ và biểu tượng; chơi giả vờ; chưa hiểu bảo toàn; còn khó nhìn từ góc nhìn của người khác.'
    loai: phat-hien
    nguon:
      - openstax-9
    trich: Piaget’s second stage is the preoperational stage, which is from approximately 2 to 7 years old. In this stage, children can use symbols to represent words, images, and ideas, which is why children in this stage engage in pretend play.
    vi_tri: 'OpenStax 9.2 (egocentrism: "not able to take the perspective of others")'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "tư duy còn ''dính'' vào một chiều". Chữ mới: "chưa hiểu bảo toàn; còn khó nhìn từ góc nhìn của người khác". Lý do: ý "dính vào một chiều" không có trong nguồn đã mở. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp OpenStax Psychology 2e 9.2 (đọc lại 10/11/2026); trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
    luot_2_ghi_chu: Bảng 9.2 của OpenStax ghi 2–6 nhưng văn bản ghi 2–7; câu dùng 2–7 (con số thường gặp).
    review: dung
  - id: n9
    cau: 'Giai đoạn thao tác cụ thể: 7–11 tuổi; suy luận logic với sự vật cụ thể; hiểu bảo toàn và tính đảo ngược.'
    loai: phat-hien
    nguon:
      - openstax-9
    trich: Piaget’s third stage is the concrete operational stage, which occurs from about 7 to 11 years old. ... they also understand the principle of reversibility
    vi_tri: OpenStax 9.2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hiểu bảo toàn, phân loại, sắp xếp". Chữ mới: "hiểu bảo toàn và tính đảo ngược". Lý do: giáo trình không nhắc phân loại, sắp xếp. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp OpenStax Psychology 2e 9.2 (đọc lại 10/11/2026); trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
    review: dung
  - id: n10
    cau: 'Giai đoạn thao tác hình thức: khoảng 11 tuổi trở đi; suy nghĩ về ý tưởng trừu tượng và tình huống giả định.'
    loai: phat-hien
    nguon:
      - openstax-9
    trich: The fourth, and last, stage in Piaget’s theory is the formal operational stage, which is from about age 11 to adulthood. ... can also deal with abstract ideas and hypothetical situations.
    vi_tri: OpenStax 9.2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Khoảng 11–12 tuổi trở đi | Tư duy trừu tượng, giả thiết, suy luận có hệ thống". Chữ mới: "Khoảng 11 tuổi trở đi | Suy nghĩ về ý tưởng trừu tượng và tình huống giả định". Lý do: giáo trình ghi "about age 11". Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp OpenStax Psychology 2e 9.2 (đọc lại 10/11/2026); trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
    review: dung
  - id: n11
    cau: 'Thí nghiệm bảo toàn: trẻ xem nước được rót từ cốc thấp, rộng sang cốc cao, hẹp ngay trước mặt rồi được hỏi về lượng nước.'
    loai: phat-hien
    nguon:
      - openstax-9
    trich: children may observe a quantity of liquid poured from a short, fat glass into a tall, skinny glass.
    vi_tri: OpenStax 9.1, mục các phương pháp nghiên cứu phát triển
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Piaget cho trẻ xem hai cốc giống hệt nhau đựng lượng nước bằng nhau… hỏi: cốc nào nhiều nước hơn?". Chữ mới theo mô tả giáo trình. Lý do: chi tiết "hai cốc giống hệt, nước bằng nhau, câu hỏi cụ thể" cần bản gốc (Piaget & Inhelder), chưa mở được. Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp OpenStax Psychology 2e 9.2 (đọc lại 10/11/2026); trang đã sửa đúng như ghi_chu. Chiều rót ngược với ví dụ của giáo trình, không đổi ý nghĩa nhiệm vụ.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
    luot_2_ghi_chu: "OpenStax mô tả rót từ cao–hẹp sang thấp–rộng (ngược chiều câu), nhưng thủ tục cùng loại: trẻ nhìn nước được rót sang bình khác hình rồi được hỏi về lượng; chiều rót không đổi ý nghĩa nhiệm vụ."
    review: dung
  - id: n12
    cau: Trẻ tiền thao tác chưa hiểu bảo toàn (có em cho rằng cốc cao chứa nhiều nước hơn); từ khoảng 7 tuổi trẻ hiểu lượng nước không đổi và giải thích được bằng tính đảo ngược.
    loai: phat-hien
    nguon:
      - openstax-9
    trich: You can pour water from the fat glass back to the thin glass and still have the same amount
    vi_tri: OpenStax 9.2, mục thao tác cụ thể
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trẻ dưới khoảng 7 tuổi thường nói chiếc cốc cao có nhiều nước hơn — các em bị ''dính'' vào một chiều duy nhất là chiều cao, bỏ qua chiều rộng đã hẹp đi". Chữ mới: "chưa hiểu bảo toàn; có em cho rằng cốc cao chứa nhiều nước hơn". Lý do: lời giải thích "dính vào một chiều" không có trong nguồn đã mở. Chưa kiểm được tỉ lệ trẻ chọn cốc cao (cần bản gốc). Review (Claude Opus 5.5, 10/11/2026): Chữ cuối trên trang khớp OpenStax Psychology 2e 9.2 (đọc lại 10/11/2026); trang đã sửa đúng như ghi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
    luot_2_ghi_chu: Chi tiết "có em cho cốc cao nhiều hơn" khớp ví dụ pizza của OpenStax (trẻ tiền thao tác nghĩ mình có nhiều hơn).
    review: dung
  - id: n13
    cau: 'Bảo toàn: hiểu rằng lượng của một chất không đổi dù hình dạng bên ngoài thay đổi.'
    loai: dinh-nghia
    nguon:
      - openstax-9
    trich: conservation, which is the idea that even if you change the appearance of something, it is still equal in size as long as nothing has been removed or added
    vi_tri: OpenStax 9.2
