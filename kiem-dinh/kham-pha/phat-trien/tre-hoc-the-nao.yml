    cau: Piaget cho rằng trẻ chỉ bắt đầu chia sẻ niềm tin vật tồn tại liên tục từ khoảng 9 tháng.
    loai: lich-su
    nguon:
      - baillargeon1987
    trich: Piaget (1954) held that infants do not begin to share this belief until they reach about 9 months of age.
    vi_tri: Baillargeon 1987, mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "mốc 8–9 tháng của Piaget" (cũng ở khung Bác bỏ: "trước 8–9 tháng"). Chữ mới: "khoảng 9 tháng". Lý do: bài Baillargeon viết "about 9 months". Piaget 1954 chưa mở; theo Baillargeon kể lại. Review (Claude Opus 5.5, 10/11/2026): Mở lại toàn văn Baillargeon 1987 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus, zip 10.1037%252F0002-9432.71.2.245.zip): tóm tắt và mục Phương pháp khớp câu và câu trích; lượt 2 không mở được, nay đã giải quyết. Câu "about 9 months" ở đoạn mở đầu; khung Khá vững mới ghi "theo Baillargeon, 1987, kể lại".'
    luot_2: khong-chac
    luot_2_ghi_chu: 'Mốc "khoảng 9 tháng" theo Piaget (1954): không mở được sách gốc; OpenStax chỉ nêu 5–8 tháng theo nghiên cứu hiện đại, không nêu mốc 9 tháng của Piaget.'
