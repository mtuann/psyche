doi_chu:
  - cu: (không có)
    moi: Hộp Tóm tắt nhanh (::tom-tat) dựng từ ý chính của các khung nhãn
    ly_do: Bố cục C (kế hoạch).
  - cu: Trẻ 5 tuổi thường chỉ vào chiếc cốc cao và nói "cốc này nhiều hơn". Trẻ 8 tuổi thường nói "hai cốc bằng nhau, vì chỉ rót sang thôi mà". Cùng một lượng nước, nhưng hai câu trả lời khác hẳn nhau — Piaget cho rằng trẻ **tư duy theo một cách khác hẳn**, chứ không phải "kém thông minh hơn".
    moi: Trẻ 5 tuổi thường chưa nhận ra hai cốc có lượng nước bằng nhau; có em chỉ vào chiếc cốc cao và nói "cốc này nhiều hơn". Trẻ 8 tuổi thường nói "hai cốc bằng nhau, vì chỉ rót sang thôi mà". Cùng một lượng nước, nhưng hai cách trả lời khác nhau — Piaget cho rằng ở hai giai đoạn ấy trẻ **tư duy theo hai cách khác nhau**.
    ly_do: 'Chi tiết "chỉ vào cốc cao" chưa kiểm được ở bản gốc (giáo trình chỉ nói trẻ tiền thao tác chưa hiểu bảo toàn): hạ thành "có em"; bỏ vế "không phải kém thông minh" (nguồn không nói).'
  - cu: Đầu thế kỷ 20, Jean Piaget quan sát
    moi: Jean Piaget quan sát
    ly_do: 'Bỏ mốc "đầu thế kỷ 20": giáo trình không nêu năm; chưa có nguồn đã mở cho mốc này.'
  - cu: Độ tuổi chỉ là gần đúng — chính Piaget cũng nói trẻ có thể qua các giai đoạn ở tuổi khác nhau và mang đặc điểm của nhiều giai đoạn cùng lúc, nhưng thứ tự thì không đổi và không thể nhảy cóc.
    moi: Độ tuổi chỉ là gần đúng, và theo Piaget các giai đoạn nối tiếp nhau theo một thứ tự.
    ly_do: Chưa mở được nguồn nào cho vế "chính Piaget cũng nói… nhiều giai đoạn cùng lúc… không thể nhảy cóc"; giáo trình chỉ nói các giai đoạn gắn với độ tuổi "approximately" và nối tiếp nhau.
  - cu: '| Tiền thao tác (preoperational) | 2–7 tuổi | Dùng ngôn ngữ và biểu tượng; chơi giả vờ; tư duy còn "dính" vào một chiều |'
    moi: '| Tiền thao tác (preoperational) | 2–7 tuổi | Dùng ngôn ngữ và biểu tượng; chơi giả vờ; chưa hiểu bảo toàn; còn khó nhìn từ góc nhìn của người khác |'
    ly_do: Giáo trình không có ý "dính vào một chiều"; thay bằng điều giáo trình nói (chưa hiểu bảo toàn, tự cho mình là trung tâm).
  - cu: '| Suy luận logic với sự vật cụ thể; hiểu bảo toàn, phân loại, sắp xếp |'
    moi: '| Suy luận logic với sự vật cụ thể; hiểu bảo toàn và tính đảo ngược |'
    ly_do: Giáo trình nói bảo toàn và đảo ngược; không nhắc phân loại, sắp xếp.
  - cu: '| Thao tác hình thức (formal operational) | Khoảng 11–12 tuổi trở đi | Tư duy trừu tượng, giả thiết, suy luận có hệ thống |'
    moi: '| Thao tác hình thức (formal operational) | Khoảng 11 tuổi trở đi | Suy nghĩ về ý tưởng trừu tượng và tình huống giả định |'
    ly_do: Giáo trình ghi "about age 11 to adulthood", không phải 11–12; "suy luận có hệ thống" không có trong nguồn đã mở. Hình piaget-timeline cũng đặt mốc ở 11.
  - cu: '**Thiết kế.** Piaget cho trẻ xem hai cốc giống hệt nhau đựng lượng nước bằng nhau, rồi ngay trước mặt trẻ rót nước từ một cốc sang chiếc cốc cao và hẹp hơn, và hỏi: cốc nào nhiều nước hơn?'
    moi: '**Thiết kế.** Trẻ xem nước được rót từ một cốc thấp, rộng sang một cốc cao, hẹp ngay trước mặt, rồi được hỏi về lượng nước ở hai cốc (mô tả thí nghiệm bảo toàn của Piaget trong giáo trình OpenStax).'
    ly_do: Chi tiết "hai cốc giống hệt đựng lượng nước bằng nhau, hỏi cốc nào nhiều hơn" chưa kiểm được ở bản gốc (Piaget & Inhelder); viết theo mô tả của giáo trình.
  - cu: '**Kết quả.** Trẻ dưới khoảng 7 tuổi thường nói chiếc cốc cao có nhiều nước hơn — các em bị "dính" vào một chiều duy nhất là chiều cao, bỏ qua chiều rộng đã hẹp đi. Từ khoảng 7 tuổi, trẻ trả lời hai lượng bằng nhau và giải thích được ("rót qua rót lại thì vẫn thế"). Piaget gọi đây là **bảo toàn**: hiểu rằng lượng của một chất không đổi dù hình dạng bên ngoài thay đổi ([Piaget, 1952](https://psycnet.apa.org/record/1953-04356-000)).'
    moi: '**Kết quả.** Theo giáo trình, trẻ ở giai đoạn tiền thao tác (khoảng 2–7 tuổi) chưa hiểu **bảo toàn**; có em cho rằng chiếc cốc cao chứa nhiều nước hơn. Từ khoảng 7 tuổi, trẻ hiểu rằng lượng nước không đổi và giải thích được ("rót qua rót lại thì vẫn thế", tức tính đảo ngược). Piaget gọi đó là **bảo toàn**: hiểu rằng lượng của một chất không đổi dù hình dạng bên ngoài thay đổi ([OpenStax Psychology 2e, mục 9.2](https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories)).'
    ly_do: Bỏ lời giải thích "dính vào một chiều" (không có trong nguồn đã mở) và đổi dẫn Piaget 1952 (The child's conception of number, nói về số, chưa mở được) sang giáo trình đã đọc; "thường nói cốc cao nhiều hơn" hạ thành "có em".
  - cu: 'Piaget xem đây là bằng chứng tính bền vững của vật thể chưa hoàn chỉnh: trẻ hiểu đồ vật vẫn tồn tại khi khuất mắt, nhưng còn lẫn lộn giữa hành động của mình với vị trí của đồ vật (Piaget, 1954).'
    moi: Theo Piaget, đây là bằng chứng trẻ còn gắn đồ vật với hành động của chính mình và chưa nắm trọn tính bền vững của vật thể (Piaget, 1954, theo Bjork và Cummings, 1984, kể lại).
    ly_do: 'Bjork & Cummings tóm: Piaget coi lỗi AB là bằng chứng trẻ "egocentrically concerned with their own actions" và chưa hiểu "permanence of objects"; chữ cũ nói trẻ "hiểu đồ vật vẫn tồn tại", ngược với tóm tắt đó. Bài gốc Piaget 1954 chưa mở.'
  - cu: khả năng giữ mục tiêu trong đầu và cưỡng lại thói quen cũ tăng dần, gắn với sự trưởng thành của vỏ não trước trán ([Diamond và Goldman-Rakic, 1989]
    moi: khả năng giữ mục tiêu trong đầu và cưỡng lại thói quen cũ tăng dần; các tác giả cho rằng sự trưởng thành của vỏ não trước trán có thể nằm sau tiến bộ này (dựa trên so sánh với khỉ rhesus bị cắt bỏ vùng ấy) ([Diamond và Goldman-Rakic, 1989]
    ly_do: Tóm tắt viết "may underlie", dựa trên khỉ rhesus; chữ cũ "gắn với" nói chắc hơn.
  - cu: Các thí nghiệm đối chứng (không đặt hộp) loại trừ cách giải thích khác. Baillargeon kết luận trẻ sơ sinh đã hiểu rằng chiếc hộp vẫn tồn tại dù bị che khuất và một vật rắn không thể đi xuyên qua vật rắn khác — sớm hơn nhiều so với mốc 8–9 tháng của Piaget
    moi: Các thí nghiệm đối chứng (không đặt hộp) loại trừ cách giải thích khác. Baillargeon kết luận trẻ nhỏ đã hiểu rằng chiếc hộp vẫn tồn tại dù bị che khuất và tấm màn không thể quay xuyên qua chỗ chiếc hộp — sớm hơn nhiều so với mốc khoảng 9 tháng của Piaget
    ly_do: Bài gốc nêu mốc "about 9 months", không phải 8–9; kết luận của tóm tắt là về hộp và tấm màn quay, không phải "vật rắn đi xuyên vật rắn" nói chung.
  - cu: Tìm bằng tay đòi hỏi phối hợp vận động và trí nhớ phức tạp hơn nhiều; có thể trẻ "hiểu" từ sớm nhưng chưa "làm được".
    moi: Tìm bằng tay đòi hỏi phối hợp các hành động riêng rẽ (Baillargeon, 1987) và có thể cả trí nhớ (Bjork và Cummings, 1984); có thể trẻ "hiểu" từ sớm nhưng chưa "làm được".
    ly_do: Gắn từng vế vào nguồn nói điều ấy; chữ cũ "phức tạp hơn nhiều" bỏ vì không có nguồn đo mức phức tạp.
  - cu: Karen Wynn cho trẻ 5 tháng tuổi xem một con búp bê trên sân khấu, che màn lại, rồi đặt thêm một con búp bê nữa sau màn. Khi mở màn ra, có lúc là hai con (1 + 1 = 2, hợp lý), có lúc chỉ còn một con (1 + 1 = 1, phi lý).
    moi: Karen Wynn cho trẻ 5 tháng tuổi xem một vật trên sân khấu, che màn lại, rồi đặt thêm một vật giống hệt sau màn. Khi mở màn ra, có lúc là hai vật (1 + 1 = 2, hợp lý), có lúc chỉ còn một (1 + 1 = 1, phi lý).
    ly_do: Bài gốc nói "item" (vật), không nói búp bê.
  - cu: '**Kết quả.** Trẻ nhìn kết quả phi lý lâu hơn hẳn kết quả hợp lý, ở cả phép cộng lẫn phép trừ. Wynn kết luận trẻ 5 tháng tuổi đã tính được kết quả của phép toán đơn giản trên số lượng nhỏ — trong khi theo Piaget, khái niệm số phải đợi đến giai đoạn thao tác cụ thể ([Wynn, 1992](https://doi.org/10.1038/358749a0)).'
    moi: '**Kết quả.** Trẻ nhìn kết quả phi lý lâu hơn kết quả hợp lý (khác biệt có ý nghĩa thống kê), ở cả phép cộng lẫn phép trừ. Wynn kết luận trẻ 5 tháng tuổi đã tính được kết quả của phép toán đơn giản trên số lượng nhỏ ([Wynn, 1992](https://doi.org/10.1038/358749a0)). Tuy vậy, một nghiên cứu lặp lại thủ tục này trên 68 trẻ 5 tháng tuổi không thấy bằng chứng nhất quán rằng trẻ cộng trừ được ([Wakeley, Rivera và Langer, 2000](https://doi.org/10.1111/1467-8624.00244)), nên cách diễn giải còn tranh luận.'
    ly_do: 'Bỏ "hẳn" (Bảng 1 của Wynn: p < 0,05 một phía); bỏ vế "theo Piaget, khái niệm số phải đợi… thao tác cụ thể" (chưa mở được nguồn Piaget về số); thêm bản lặp lại Wakeley 2000 không thấy kết quả của Wynn.'
  - cu: ':::vung-chac[trẻ tư duy khác người lớn về chất, không chỉ kém hơn về lượng]

      Ý tưởng cốt lõi của Piaget — trẻ xây dựng hiểu biết qua tương tác với thế giới, và cách trẻ lý giải sự vật ở mỗi độ tuổi có logic riêng — đã được vô số nghiên cứu ở nhiều nền văn hóa khẳng định suốt gần một thế kỷ.

      :::'
    moi: ':::kha-vung[trẻ xây dựng hiểu biết qua tương tác với thế giới, với cách lý giải riêng ở từng độ tuổi]

      Ý tưởng cốt lõi của Piaget — trẻ xây dựng hiểu biết qua tương tác với thế giới, và cách trẻ lý giải sự vật ở mỗi độ tuổi có logic riêng — vẫn là nền của các giáo trình hiện hành. Giới hạn: các nghiên cứu hiện đại cho thấy trẻ làm được nhiều điều sớm hơn mốc của Piaget khi cách đo phù hợp hơn (xem khung "Đang tranh cãi" bên dưới).

      :::'
    ly_do: 'Hạ Vững chắc xuống Khá vững: không mở được phân tích tổng hợp hay tái lập lớn nào cho ý này; "vô số nghiên cứu ở nhiều nền văn hóa… gần một thế kỷ" không có nguồn đã mở.'
  - cu: 'Trẻ thường hiểu bảo toàn sau khi đã chơi giả vờ thành thạo, và tư duy trừu tượng xuất hiện sau tư duy cụ thể. Thứ tự này ít khi đảo lộn. Giới hạn: đây là xu hướng trung bình của nhóm, không phải lịch trình bắt buộc của từng trẻ.'
    moi: 'Giáo trình trình bày các giai đoạn theo thứ tự này: chơi giả vờ và biểu tượng (tiền thao tác), rồi hiểu bảo toàn (thao tác cụ thể), rồi tư duy trừu tượng (thao tác hình thức). Giới hạn: đây là mô tả xu hướng của nhóm, không phải lịch trình bắt buộc của từng trẻ, và chúng tôi chưa mở được phân tích độc lập nào kiểm tra tính ổn định của thứ tự ấy.'
    ly_do: Bỏ "ít khi đảo lộn" (không có nguồn đo); nói rõ nguồn là giáo trình và nêu giới hạn.
  - cu: 'McGarrigle và Donaldson (1974) cho thấy trẻ 4–5 tuổi trả lời đúng bài toán bảo toàn khi tình huống có ý nghĩa với trẻ (như chú gấu "nghịch ngợm" làm xáo trộn hàng nút — bài toán bảo toàn số lượng), và lỗi A-not-B có thể phản ánh hạn chế của trí nhớ làm việc hơn là thiếu khái niệm vật thể ([McGarrigle và Donaldson, 1974](https://doi.org/10.1016/0010-0277(74)90003-1); '
    moi: 'Baillargeon (1987) đo thời gian nhìn thay vì bắt trẻ thò tay tìm, và lỗi A-not-B có thể phản ánh vấn đề về trí nhớ hơn là thiếu khái niệm vật thể ([Baillargeon, 1987](https://doi.org/10.1037/0012-1649.23.5.655); '
    ly_do: 'Bỏ vế McGarrigle & Donaldson (1974; 4–5 tuổi, chú gấu, hàng nút): không mở được bài hay tóm tắt (Crossref chỉ có siêu dữ liệu), nên không kiểm được; thay bằng điều Baillargeon 1987 đã kiểm. Bjork & Cummings nói "memory problem", không nói "trí nhớ làm việc".'
  - cu: 'Trẻ không "tải" kiến thức có sẵn mà tự xây dựng qua đồng hóa, điều ứng và cân bằng. Hạn chế: bài kiểm tra của ông đòi hỏi nhiều kỹ năng cùng lúc (ngôn ngữ, vận động, trí nhớ) nên đánh giá thấp năng lực sớm của trẻ.'
    moi: 'Trẻ không "tải" kiến thức có sẵn mà tự xây dựng qua đồng hóa và điều ứng. Hạn chế: bài tìm đồ của ông đòi hỏi nhiều kỹ năng cùng lúc (phối hợp hành động, trí nhớ) nên có thể đánh giá thấp năng lực sớm của trẻ.'
    ly_do: Bỏ "cân bằng" (giáo trình không nêu); "bài kiểm tra… ngôn ngữ" chưa có nguồn, giữ phần Baillargeon và Bjork & Cummings nói; "đánh giá thấp" hạ thành "có thể".
  - cu: 'Lev Vygotsky nhấn mạnh vai trò của người lớn và bạn bè: trẻ làm được nhiều hơn khi có người gợi ý, trong "vùng phát triển gần". Điều này giải thích vì sao cách đặt đề bài (như thí nghiệm của McGarrigle và Donaldson) thay đổi kết quả đến vậy.'
    moi: 'Lev Vygotsky nhấn mạnh vai trò của tương tác xã hội: trẻ có thể làm được nhiều hơn khi có người hiểu biết hơn (người lớn hay bạn bè) hỗ trợ, trong "vùng phát triển gần".'
    ly_do: 'Bỏ câu suy luận nối vùng phát triển gần với một nghiên cứu chưa mở được (McGarrigle & Donaldson); viết lại ý Vygotsky ở mức định nghĩa chung. Nguồn duy nhất đã mở là Wikipedia (bậc 3): xem hồ sơ.'
  - cu: Elizabeth Spelke và cộng sự cho rằng trẻ sinh ra đã có sẵn vài "hệ lõi" về vật thể, số lượng, không gian — khớp với phát hiện của Baillargeon và Wynn. Trải nghiệm sau đó mài giũa chứ không tạo ra từ con số không.
    moi: Elizabeth Spelke và cộng sự cho rằng nhận thức con người dựa một phần trên vài "hệ lõi" biểu diễn vật thể, hành động, số lượng và không gian, có gốc rễ sâu từ rất sớm — hướng giải thích này gần với phát hiện của Baillargeon và Wynn.
    ly_do: Viết theo tóm tắt của Spelke & Kinzler 2007 (bốn hệ lõi, "deep roots in ontogeny"); bỏ "sinh ra đã có sẵn" và "trải nghiệm mài giũa" (tóm tắt không nói).
  - cu: Trẻ có trí nhớ làm việc nhỏ hơn và khả năng kiềm chế kém hơn người lớn. Nhiều "lỗi" của trẻ (như A-not-B) có thể là lỗi của bộ nhớ và sự kiềm chế, không phải của khái niệm.
    moi: Khả năng giữ mục tiêu trong đầu và cưỡng lại thói quen cũ còn đang phát triển ở trẻ nhỏ. Nhiều "lỗi" của trẻ (như A-not-B) có thể là lỗi của bộ nhớ và sự kiềm chế, không phải của khái niệm.
    ly_do: Bỏ "trí nhớ làm việc nhỏ hơn… kém hơn người lớn" (không có nguồn đã mở đo điều đó); thay bằng điều Diamond & Goldman-Rakic và Bjork & Cummings nói.
  - cu: 'Trẻ ở giai đoạn thao tác cụ thể học phân số tốt hơn khi được cắt bánh thật, gấp giấy thật, thay vì chỉ nhìn công thức. Nguyên tắc chung: **từ tay đến đầu** — thao tác với vật thật trước, rồi mới dần rút về ký hiệu.'
    moi: 'Dạy toán bằng vật thật (cắt bánh, gấp giấy…) cho kết quả nhỉnh hơn chỉ dùng ký hiệu: tổng hợp 55 nghiên cứu thấy hiệu ứng nhỏ đến vừa, và còn tùy cách dạy (Carbonneau và cộng sự, 2013). Nguyên tắc chung: **từ tay đến đầu** — thao tác với vật thật trước, rồi mới dần rút về ký hiệu.'
    ly_do: Chữ cũ về phân số chưa có nguồn; thay bằng phân tích tổng hợp Carbonneau 2013 (55 nghiên cứu, hiệu ứng nhỏ đến vừa).
  - cu: 'Khi trẻ 5 tuổi nói cốc cao "nhiều nước hơn", em đang dùng đúng logic của giai đoạn mình: tập trung vào chiều nổi bật nhất. Thay vì sửa ngay ("sai rồi!"), hãy hỏi lại: "Nếu mình rót ngược lại cốc cũ thì sao?"'
    moi: 'Một câu trả lời "sai" ở bài kiểm tra chưa chắc là trẻ không hiểu gì: lỗi có thể đến từ cách đo hay từ trí nhớ (Baillargeon, 1987; Bjork và Cummings, 1984). Khi trẻ 5 tuổi nói cốc cao "nhiều nước hơn", thay vì sửa ngay ("sai rồi!"), hãy hỏi lại: "Nếu mình rót ngược lại cốc cũ thì sao?" — một gợi ý hợp lý suy ra từ khái niệm đảo ngược, chưa có thử nghiệm riêng.'
    ly_do: 'Bỏ "đúng logic của giai đoạn mình: tập trung vào chiều nổi bật nhất" (không có nguồn); nêu rõ phần "hỏi lại" là suy ra từ lý thuyết.'
  - cu: '### 3. Chơi giả vờ là "phòng thí nghiệm" tư duy :nhan[kha-vung]


      Chơi đóng vai bác sĩ, chơi bán hàng là cách trẻ luyện dùng biểu tượng — một vật thay cho vật khác, một hành động thay cho cả câu chuyện. Đây chính là nền tảng của tư duy biểu tượng ở giai đoạn tiền thao tác. Dành thời gian cho chơi tự do không có cấu trúc không phải là "chơi cho qua giờ".'
    moi: '### 3. Chơi giả vờ có phải là "phòng thí nghiệm" tư duy? :nhan[tranh-cai] { #3-choi-gia-vo-la-phong-thi-nghiem-tu-duy-kha-vung }


      Chơi đóng vai bác sĩ, chơi bán hàng là hoạt động dùng biểu tượng — một vật thay cho vật khác, một hành động thay cho cả câu chuyện — và gắn với giai đoạn tiền thao tác. Nhưng tổng quan của Lillard và cộng sự (2013) kết luận bằng chứng hiện có chưa ủng hộ khẳng định mạnh rằng chơi giả vờ có vai trò nhân quả độc nhất với sự phát triển, nên đừng xem nó là điều kiện bắt buộc. Chơi tự do vẫn là hoạt động bình thường của trẻ và không cần phải biện minh bằng lợi ích phát triển.'
    ly_do: Chữ cũ nói chơi giả vờ "chính là nền tảng của tư duy biểu tượng" (Khá vững); Lillard 2013 kết luận bằng chứng không ủng hộ khẳng định nhân quả mạnh (kể cả với bảo toàn). Đổi nhãn Khá vững thành Đang tranh cãi, giữ id mục cũ.
  - cu: '**Giới hạn.** Các lời khuyên trên rút ra từ nguyên lý chung của tâm lý học phát triển, không phải công thức đảm bảo cho từng trẻ.'
    moi: '**Giới hạn.** Các lời khuyên trên rút ra từ nguyên lý chung và vài tổng hợp nhỏ, không phải công thức đảm bảo cho từng trẻ. Nếu bạn lo lắng về sự phát triển của một em bé cụ thể, hãy hỏi bác sĩ nhi khoa hay chuyên viên phát triển trẻ em thay vì tự kết luận từ bài này.'
    ly_do: Thêm lời dẫn tới người có chuyên môn (không chẩn đoán qua bài).
  - cu: 'Một gợi ý chung: các nghiên cứu liên văn hóa cho thấy **thứ tự** xuất hiện các năng lực nhận thức nhìn chung ổn định ở nhiều nền văn hóa, nhưng **tốc độ** và mức độ tư duy trừu tượng đạt được chịu ảnh hưởng của môi trường giáo dục và trải nghiệm. Đây chỉ là gợi ý gián tiếp, chưa phải bằng chứng trực tiếp cho trẻ Việt Nam.'
    moi: 'Chúng tôi chưa mở được tổng hợp nào cho việc thứ tự các năng lực có giống nhau ở các nền văn hóa hay không, nên bài này không khẳng định điều đó cho trẻ Việt Nam: cần nghiên cứu trực tiếp mới trả lời được.'
    ly_do: Chữ cũ dựa vào "các nghiên cứu liên văn hóa" không có nguồn đã mở; thay bằng lời nói rõ khoảng trống.
  - cu: Chúng tôi chưa tìm thấy nghiên cứu thực nghiệm nào kiểm tra các giai đoạn của Piaget trên trẻ em Việt Nam, nên không thể khẳng định lộ trình chi tiết có giống hệt hay không.
    moi: Tính đến 11/2026, chúng tôi chưa tìm thấy nghiên cứu thực nghiệm nào kiểm tra các giai đoạn của Piaget trên trẻ em Việt Nam, nên không thể khẳng định lộ trình chi tiết có giống hệt hay không.
    ly_do: Thêm mốc thời gian cho câu thời sự (thoi-su).
  - cu: 'Sai ở điểm cốt lõi: trẻ lý giải thế giới bằng logic riêng của từng giai đoạn, không phải bằng logic người lớn phiên bản lỗi.'
    moi: 'Sai ở điểm cốt lõi: theo Piaget, trẻ lý giải thế giới bằng cách riêng của từng giai đoạn, không phải bằng logic người lớn phiên bản lỗi.'
    ly_do: Nói rõ đây là quan điểm của Piaget.
  - cu: Nhồi công thức cho trẻ chưa sẵn sàng thường chỉ tạo ra học vẹt. Trẻ cần thao tác cụ thể trước khi trừu tượng hóa có ý nghĩa.
    moi: Theo giáo trình, trẻ ở giai đoạn thao tác cụ thể mới suy nghĩ logic được về sự việc cụ thể; và các lớp dạy toán bằng vật thật cho kết quả nhỉnh hơn lớp chỉ dùng ký hiệu (tổng hợp 55 nghiên cứu, hiệu ứng nhỏ đến vừa).
    ly_do: Chữ cũ "thường chỉ tạo ra học vẹt" không có nguồn; thay bằng điều giáo trình và Carbonneau 2013 nói.
  - cu: Thí nghiệm của Wynn cho thấy trẻ 5 tháng tuổi đã phân biệt được kết quả đúng sai của phép cộng trừ đơn giản. Điều trẻ thiếu là ký hiệu số học, không phải cảm nhận về số lượng.
    moi: Thí nghiệm của Wynn (1992) cho thấy trẻ 5 tháng tuổi nhìn lâu hơn khi kết quả phép cộng trừ đơn giản "sai", dù một lần lặp lại không thấy kết quả ấy (Wakeley và cộng sự, 2000). Đừng kết luận rằng trẻ nhỏ hoàn toàn không có cảm nhận về số lượng, nhưng cũng đừng xem chuyện trẻ 5 tháng "làm toán" là đã chốt.
    ly_do: Bỏ "Điều trẻ thiếu là ký hiệu số học" (không có nguồn); thêm bản lặp lại không thấy kết quả của Wynn.
  - cu: Piaget dùng độ tuổi gần đúng và thừa nhận trẻ khác nhau đi với tốc độ khác nhau. Dùng bảng tuổi
    moi: Giáo trình ghi các độ tuổi của Piaget là gần đúng. Dùng bảng tuổi
    ly_do: Chữ cũ "thừa nhận trẻ khác nhau đi với tốc độ khác nhau" chưa có nguồn.
  - cu: '? Vì sao trẻ 5 tuổi nói chiếc cốc cao, hẹp "nhiều nước hơn"?

      - Vì trẻ chưa biết đếm.

      + Vì trẻ tập trung vào một chiều duy nhất (chiều cao) mà bỏ qua chiều rộng đã hẹp đi.

      - Vì trẻ cố tình trả lời sai để trêu người lớn.

      > Hiện tượng "dính vào một chiều" (centration) đặc trưng của giai đoạn tiền thao tác: trẻ không thiếu thông tin, chỉ xử lý thông tin theo cách khác.'
    moi: '? Theo giáo trình, vì sao trẻ ở giai đoạn tiền thao tác thường chưa hiểu bảo toàn lượng nước?

      - Vì trẻ chưa biết đếm.

      + Vì trẻ chưa thực hiện được các thao tác tư duy như đảo ngược (rót ngược lại thì lượng nước vẫn thế).

      - Vì trẻ cố tình trả lời sai để trêu người lớn.

      > Theo giáo trình, trẻ tiền thao tác chưa thực hiện được thao tác tư duy; sang giai đoạn thao tác cụ thể, trẻ hiểu bảo toàn và tính đảo ngược. Đó là cách nghĩ của giai đoạn, không phải trẻ cố tình trả lời sai.'
    ly_do: Đáp án cũ dựa vào "dính vào một chiều" (centration), không có trong nguồn đã mở; viết lại theo giáo trình.
  - cu: Khi chỉ cần nhìn, trẻ 3–4 tháng tuổi đã tỏ ra hiểu vật thể vẫn tồn tại khi bị che khuất.
    moi: Khi chỉ cần nhìn, trẻ 3,5–4,5 tháng tuổi đã nhìn lâu hơn ở tình huống phi lý; Baillargeon diễn giải đó là dấu hiệu trẻ hiểu vật thể vẫn tồn tại khi bị che khuất.
    ly_do: Đúng độ tuổi của bài (3,5 và 4,5 tháng) và nói rõ đó là diễn giải.
  - cu: Diamond và Goldman-Rakic (1989) cho thấy khoảng trễ cần để gây lỗi tăng dần theo tuổi, gắn với sự trưởng thành của vỏ não trước trán.
    moi: Diamond và Goldman-Rakic (1989) cho thấy khoảng trễ cần để gây lỗi tăng dần theo tuổi, và cho rằng sự trưởng thành của vỏ não trước trán có thể nằm sau điều đó.
    ly_do: Khớp mức của tóm tắt ("may underlie").
  - cu: Theo Piaget, khái niệm số thuộc về giai đoạn thao tác cụ thể (từ khoảng 7 tuổi). Thí nghiệm của Wynn (1992) cho thấy trẻ 5 tháng tuổi đã có kỳ vọng đúng về phép cộng trừ đơn giản — sớm hơn hàng năm trời.
    moi: 'Theo giáo trình, hiểu bảo toàn số lượng thuộc giai đoạn thao tác cụ thể (từ khoảng 7 tuổi). Thí nghiệm của Wynn (1992) cho thấy trẻ 5 tháng tuổi nhìn lâu hơn khi kết quả phép cộng trừ "sai" — nếu diễn giải của Wynn đúng, sớm hơn hàng năm trời (một lần lặp lại không thấy kết quả này: Wakeley và cộng sự, 2000).'
    ly_do: Chữ cũ nói chắc hơn nguồn và dựa vào mốc "khái niệm số" của Piaget chưa mở được; thêm bản lặp lại.
