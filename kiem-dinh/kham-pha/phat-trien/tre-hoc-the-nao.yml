    ghi_chu: 'Chữ cũ: "Piaget xem đây là bằng chứng tính bền vững của vật thể chưa hoàn chỉnh: trẻ hiểu đồ vật vẫn tồn tại khi khuất mắt, nhưng còn lẫn lộn giữa hành động của mình với vị trí của đồ vật (Piaget, 1954)". Chữ mới theo tóm tắt Bjork & Cummings (Piaget 1954 theo họ kể lại). Lý do: chữ cũ nói trẻ "hiểu đồ vật vẫn tồn tại", tóm tắt nói trẻ chưa nắm tính bền vững. Bài gốc Piaget 1954 chưa mở. Review (Claude Opus 5.5, 10/11/2026): Mở lại toàn văn Bjork & Cummings 1984 (PDF phòng thí nghiệm Bjork): câu trích nằm ở tóm tắt; trang ghi "Piaget, 1954, theo Bjork và Cummings, 1984, kể lại", đúng bậc nguồn. OpenStax Lifespan Development 3.4 cũng viết Piaget diễn giải lỗi A-not-B là hiểu biết về tính bền vững chưa trọn.'
