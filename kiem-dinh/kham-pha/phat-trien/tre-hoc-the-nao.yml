  - id: n46
    cau: 'Mục 1: dạy bằng trải nghiệm cụ thể trước khi trừu tượng hóa (Khá vững).'
    loai: nhan
    nguon: &id005
      - carbonneau2013
    nhan: kha-vung
    co_so: *id005
    ly_do: 'Tổng hợp 55 nghiên cứu (N = 7.237, từ mầm non đến đại học) thấy dạy toán bằng vật thật nhỉnh hơn chỉ dùng ký hiệu, hiệu ứng nhỏ đến vừa, tùy đặc điểm cách dạy và thiết kế nghiên cứu: Khá vững (một phân tích tổng hợp nhưng hiệu ứng nhỏ đến vừa, nhiều biến điều tiết).'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Trẻ ở giai đoạn thao tác cụ thể học phân số tốt hơn khi được cắt bánh thật, gấp giấy thật". Chữ mới: dạy toán bằng vật thật; hiệu ứng nhỏ đến vừa. Lý do: chữ cũ về phân số và về giai đoạn thao tác cụ thể không có nguồn; "từ tay đến đầu" là cách nói của trang. Review (Claude Opus 5.5, 10/11/2026): Nhãn Khá vững đạt thước đo: một phân tích tổng hợp (Carbonneau 2013, 55 nghiên cứu), hiệu ứng nhỏ đến vừa, nhiều biến điều tiết.'
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1037/a0031084", "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories" ]
    luot_2_ghi_chu: "Nhãn Khá vững: một phân tích tổng hợp nhưng hiệu ứng thay đổi theo điều kiện, không cần cao hơn."
    review: dung
  - id: n47
    cau: 'Dạy toán bằng vật thật cho kết quả nhỉnh hơn chỉ dùng ký hiệu: tổng hợp 55 nghiên cứu thấy hiệu ứng nhỏ đến vừa, tùy cách dạy.'
    loai: so-lieu
    nguon:
      - carbonneau2013
    trich: Statistically significant results were identified with small to moderate effect sizes, as measured by Cohen's d, in favor of the use of manipulatives
    vi_tri: Carbonneau và cộng sự 2013, tóm tắt (55 nghiên cứu, N = 7.237)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://api.openalex.org/works/doi:10.1037/a0031084" ]
    luot_2_ghi_chu: 'Carbonneau, Marley & Selig 2013 (J Educational Psychology). "Nhỏ đến vừa, tùy cách dạy": khớp.'
  - id: n48
    cau: 'Mục 2: một câu trả lời "sai" chưa chắc là không hiểu; hỏi lại thay vì sửa ngay (Khá vững).'
    loai: nhan
    nguon: &id006
      - baillargeon1987
      - bjork1984
    nhan: kha-vung
    co_so:
      - baillargeon1987
      - bjork1984
      - mcgarrigle1974
    ly_do: 'Phần "lỗi có thể do cách đo hay trí nhớ" có Baillargeon 1987 và Bjork & Cummings 1984; phần "hỏi lại: nếu rót ngược lại?" là gợi ý suy ra từ khái niệm đảo ngược, chưa có thử nghiệm riêng, và trang nói rõ như vậy: Khá vững cho phần có nguồn.'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "em đang dùng đúng logic của giai đoạn mình: tập trung vào chiều nổi bật nhất". Chữ mới bỏ vế ấy, nêu phần gợi ý là suy ra. Chỗ khó: nhãn gắn vào lời khuyên chưa có thử nghiệm trực tiếp; review cân nhắc. Review (Claude Opus 5.5, 10/11/2026): Nhãn gắn với ý chính "trả lời sai chưa chắc là không hiểu", không gắn với gợi ý hỏi lại (trang nói rõ gợi ý chưa có thử nghiệm riêng). Ý chính có ba nghiên cứu cùng chiều (Baillargeon 1987, Bjork & Cummings 1984, McGarrigle & Donaldson 1974: "traditional procedures may underestimate children''s cognitive abilities"), chưa có tổng hợp: Khá vững đạt thước đo. Thêm McGarrigle vào co_so.'
    luot_2: khong-chac
    luot_2_ghi_chu: 'Nhãn Khá vững cho lời khuyên "hỏi lại thay vì sửa ngay": chưa mở được nghiên cứu hay tổng quan làm căn cứ (McGarrigle & Donaldson 1974 không mở được; OpenStax không nêu).'
    review: dung
  - id: n49
    cau: 'Mục 3: chơi giả vờ có phải là "phòng thí nghiệm" tư duy (Đang tranh cãi).'
    loai: nhan
    nguon: &id007
      - lillard2013
    nhan: tranh-cai
    co_so: *id007
    ly_do: 'Tổng quan của Lillard 2013: với ngôn ngữ, kể chuyện, điều tiết cảm xúc, nghiên cứu hiện có "insufficient to draw conclusions"; với chức năng điều hành, kỹ năng xã hội, bằng chứng nghiêng chống lại vai trò nhân quả quyết định; với bảo toàn, trí tuệ, sáng tạo có kết quả không nhất quán và không lặp lại được. Bằng chứng không ủng hộ khẳng định mạnh: Đang tranh cãi.'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: nhãn Khá vững; "Đây chính là nền tảng của tư duy biểu tượng ở giai đoạn tiền thao tác. Dành thời gian cho chơi tự do… không phải là chơi cho qua giờ". Chữ mới: nhãn Đang tranh cãi; dẫn Lillard 2013; id mục giữ { #3-choi-gia-vo-la-phong-thi-nghiem-tu-duy-kha-vung }. Lý do: tổng quan kết luận bằng chứng không ủng hộ khẳng định nhân quả mạnh. Review (Claude Opus 5.5, 10/11/2026): Nhãn Đang tranh cãi khớp tóm tắt Lillard 2013; id mục cũ giữ bằng { #3-choi-gia-vo-la-phong-thi-nghiem-tu-duy-kha-vung } (đã kiểm trên trang).'
    luot_2: dung
    luot_2_nguon: [ "https://europepmc.org/article/MED/22905949" ]
