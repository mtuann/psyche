    nhan: kha-vung
    co_so: *id001
    ly_do: 'Giáo trình hiện hành (OpenStax 9.2) vẫn trình bày ý cốt lõi của Piaget; nhưng chưa mở được phân tích tổng hợp hay tái lập lớn có đăng ký trước nào cho ý này, và các nghiên cứu mới (Baillargeon; Bjork & Cummings) cho thấy trẻ làm được nhiều điều sớm hơn mốc của Piaget khi cách đo phù hợp hơn: nên Khá vững, không Vững chắc.'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: Vững chắc, "trẻ tư duy khác người lớn về chất…, đã được vô số nghiên cứu ở nhiều nền văn hóa khẳng định suốt gần một thế kỷ". Chữ mới: Khá vững, "vẫn là nền của các giáo trình hiện hành" kèm giới hạn. Lý do: không có nguồn đã mở cho "vô số nghiên cứu… nhiều nền văn hóa"; thước đo Vững chắc cần phân tích tổng hợp hay tái lập lớn. Review (Claude Opus 5.5, 10/11/2026): Nhãn Khá vững đạt thước đo mục 4: giáo trình bậc 2 (OpenStax 9.2) giữ ý cốt lõi, nhiều nghiên cứu cùng chiều nhưng chưa có tổng hợp; giáo trình nêu phê bình (Courage & Howe 2002; Siegler 2005). Không cao hơn.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories", "https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development" ]
    luot_2_ghi_chu: "Nhãn Khá vững không cao hơn thước đo: nhiều nghiên cứu cùng chiều nhưng có phê bình về tính liên tục của phát triển (OpenStax 9.2: Courage & Howe 2002; Siegler 2005). Nguồn đọc được là giáo trình, chưa phải tổng quan hệ thống; mức Khá vững hợp lý."
    review: dung
  - id: n36
    cau: "Khung Khá vững: với bài bảo toàn gốc của Piaget, trẻ dưới khoảng 7 tuổi thường trả lời sai."
    loai: nhan
