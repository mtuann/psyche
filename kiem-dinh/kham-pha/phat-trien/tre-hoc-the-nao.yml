  - cu: 'Hình piaget-timeline: "3,5 tháng: hiểu vật thể tồn tại khi khuất (Baillargeon, 1987)"; "5 tháng: phân biệt 1+1=2 và 1+1=1 (Wynn, 1992)"; "~4–5 tuổi: bảo toàn khi đề bài có ngữ cảnh (McGarrigle & Donaldson, 1974)"; chú thích "…ba phát hiện hiện đại cho thấy năng lực nhận thức xuất hiện sớm hơn mốc Piaget đưa ra — khi bài kiểm tra phù hợp với trẻ hơn."'
    moi: '"4,5 tháng (và 3,5 tháng, nhóm nhanh chán): nhìn lâu hơn / khi vật bị che “biến mất” (Baillargeon, 1987)"; "5 tháng: nhìn lâu hơn khi 1+1=1 (Wynn, 1992); / một lần lặp lại không thấy (Wakeley và cộng sự, 2000)"; "4–6 tuổi: dễ bảo toàn hơn khi bị xáo “tình cờ” (McGarrigle & Donaldson, 1974)"; chú thích "…ba phát hiện về sau gợi ý trẻ thể hiện một số năng lực sớm hơn mốc Piaget khi bài kiểm tra phù hợp với trẻ hơn. Kết quả của Wynn chưa được lặp lại nhất quán, và cách diễn giải thời gian nhìn còn bàn cãi."; aria-label tương ứng; nhãn chữ canh trái để không tràn khung'
    ly_do: Review D6-L3, hồ sơ n20–n23 (Baillargeon 1987 và McGarrigle & Donaldson 1974 đọc toàn văn; lượt 2 quá mạnh ở n23).
