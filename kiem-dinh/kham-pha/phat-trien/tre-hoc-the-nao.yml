    trich: infants in the 1 + 1 group looked longer at 1, whereas infants in the 2 - 1 group looked longer at 2. Thus, both groups looked longer at the incorrect than at the correct outcomes
    vi_tri: 'Wynn 1992, Bảng 1 (TN1: p < 0,05 một phía; TN2 lặp lại cùng hướng)'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "lâu hơn hẳn". Chữ mới: "lâu hơn… (khác biệt có ý nghĩa thống kê)". Lý do: Bảng 1: t = 2,078, p < 0,05 một phía ở TN1 (và 1,795 ở TN2), không phải khác biệt lớn. Review (Claude Opus 5.5, 10/11/2026): Bản quét Wynn 1992: "infants in the two groups differed significantly... both groups looked longer at the incorrect than at the correct outcomes". Lượt 2 không mở được toàn văn; nay đã giải quyết.'
    luot_2: khong-chac
    luot_2_ghi_chu: Chiều kết quả (trẻ nhìn phi lý lâu hơn) và ý nghĩa thống kê của Wynn 1992 không có trong tóm tắt đọc được; toàn văn Nature đóng. Wakeley 2000 chỉ cho biết "unlike Wynn, we found no systematic evidence".
