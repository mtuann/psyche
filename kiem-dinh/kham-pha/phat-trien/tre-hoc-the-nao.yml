  - id: n22
    cau: 'Hình: 4–6 tuổi dễ bảo toàn hơn khi hàng bị xáo "tình cờ" (McGarrigle & Donaldson, 1974).'
    loai: so-lieu
    trich: Eighty children aged between 4 years 2 months and 6 years 3 months were tested on length and number conservation, both when the transformation occurred because of a direct action by the experimenter and when it happened ‘accidentally’ as the by-product of an activity directed towards a different goal. Fifty children conserved when the transformation was ‘accidental’, whereas only 13 were successful when it was intentional.
    ket_qua: da-sua
    ghi_chu: 'Chỗ khó, hình không sửa: không mở được bài McGarrigle & Donaldson 1974 hay tóm tắt (Crossref chỉ có siêu dữ liệu), nên không kiểm được độ tuổi 4–5 và kết quả. Trang đã bỏ vế McGarrigle ở khung Đang tranh cãi và ở danh sách nguồn; hình còn nhãn này. Người giao quyết định bỏ mục thứ ba của hình hay chờ lượt 2 tìm bản đọc được. Review (Claude Opus 5.5, 10/11/2026): Mở được toàn văn McGarrigle & Donaldson 1974 (Internet Archive). Trẻ 4 tuổi 2 tháng đến 6 tuổi 3 tháng, không phải "~4–5 tuổi"; điều kiện là biến đổi "tình cờ" (chú gấu nghịch ngợm), không phải "đề bài có ngữ cảnh". Đã sửa chữ hình; doi_chu.'
    luot_2: khong-chac
    luot_2_ghi_chu: 'McGarrigle & Donaldson 1974 (Cognition 3, 341; DOI 10.1016/0010-0277(74)90003-1): Crossref/OpenAlex/PubMed không có tóm tắt, không mở được toàn văn; tuổi 4–5 và ngữ cảnh "gấu nghịch ngợm" chưa xác nhận.'
    nguon:
      - mcgarrigle1974
