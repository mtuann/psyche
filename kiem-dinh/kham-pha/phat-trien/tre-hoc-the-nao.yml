    ly_do: "Nhiều nghiên cứu dùng thủ tục chuẩn lặp lại kết quả bảo toàn của Piaget (theo McGarrigle & Donaldson 1974 kể lại, bốn nghiên cứu dẫn tên; chính bài ấy: 13/80 trẻ 4–6 tuổi bảo toàn ở thủ tục chuẩn); giáo trình bậc 2 xếp bảo toàn vào khoảng 7–11 tuổi. Chưa mở được tổng hợp; kết quả đổi theo cách hỏi: Khá vững."
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trẻ thường hiểu bảo toàn sau khi đã chơi giả vờ thành thạo… Thứ tự này ít khi đảo lộn". Chữ mới: nguồn là giáo trình; bỏ "ít khi đảo lộn", thêm giới hạn. Chỗ khó: nhãn dựa chủ yếu vào giáo trình; review cân nhắc có nên hạ. Review (Claude Opus 5.5, 10/11/2026): Nhãn cũ "thứ tự xuất hiện của các năng lực nhận thức tương đối ổn định" chỉ dựa vào việc giáo trình trình bày lý thuyết theo thứ tự, không có nghiên cứu nào kiểm tra tính ổn định (chính trang ghi vậy), và OpenStax 9.2 nêu các nghiên cứu ủng hộ mô hình phát triển liên tục: chưa đạt thước đo Khá vững ("nhiều nghiên cứu cùng chiều"). Đổi ý chính sang điều có nguồn: kết quả của bài bảo toàn gốc lặp lại được (McGarrigle & Donaldson 1974, toàn văn). Sửa theo lời giải thích câu 5 (n63). doi_chu.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/9-2-lifespan-theories", "https://openstax.org/books/psychology-2e/pages/9-3-stages-of-development" ]
    luot_2_ghi_chu: "Nhãn Khá vững không cao hơn thước đo: nhiều nghiên cứu cùng chiều nhưng có phê bình về tính liên tục của phát triển (OpenStax 9.2: Courage & Howe 2002; Siegler 2005). Nguồn đọc được là giáo trình, chưa phải tổng quan hệ thống; mức Khá vững hợp lý."
    trich: Piaget's findings have been replicated by many investigators using standardized procedures based on Piaget's original method (Elkind, 1961; Dodwell, 1960; Hood, 1962; Smedslund, 1964). | Fifty children conserved when the transformation was ‘accidental’, whereas only 13 were successful when it was intentional.
