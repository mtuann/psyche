  - id: n40
    cau: "Khung Khá vững: trẻ dưới 9 tháng đã phần nào hiểu vật bị che khuất vẫn còn đó."
    loai: nhan
    nguon:
      - openstax-ls-3-4
      - openstax-9
      - baillargeon1987
      - rivera1999
    nhan: kha-vung
    co_so:
      - openstax-ls-3-4
      - openstax-9
      - baillargeon1987
      - rivera1999
    ly_do: "Hai giáo trình bậc 2 (OpenStax Lifespan 3.4; Psychology 2e 9.2) cùng viết trẻ hiểu tính bền vững của vật thể sớm hơn Piaget, dựa trên nhiều nghiên cứu không đòi thò tay tìm (Baillargeon 1987 toàn văn, có đối chứng). Giới hạn: không có tổng hợp hay tái lập lớn, và Rivera 1999 thấy trẻ nhìn lâu hơn vòng quay 180° cả khi không có hộp (giải thích bằng sở thích tri giác): Khá vững, không đủ cho Đã bị bác bỏ."
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "trước 8–9 tháng". Chữ mới: "trước khoảng 9 tháng". Lý do: Baillargeon 1987 ghi "about 9 months". Chỗ khó: thước đo Đã bị bác bỏ cần các kiểm tra mạnh liên tục thất bại; ở đây là một bộ thí nghiệm chính và một phê bình phương pháp, không có tổng hợp. Review cân nhắc có nên hạ xuống Đang tranh cãi. Review (Claude Opus 5.5, 10/11/2026): Nhãn cũ Đã bị bác bỏ cho "trẻ sơ sinh hoàn toàn không có khái niệm vật thể": thước đo mục 4 cần các kiểm tra đủ mạnh liên tục thất bại; ở đây chỉ có một bộ thí nghiệm thời gian nhìn và một phê bình phương pháp, không có tổng hợp, và có nghiên cứu cho kết quả ngược với đối chứng của Baillargeon (Rivera, Wakeley & Langer 1999, tóm tắt Europe PMC). Viết lại thành khung Khá vững cho mệnh đề thuận, nêu giới hạn và Rivera 1999; doi_chu.'
    luot_2: khong-chac
    luot_2_ghi_chu: Cần tổng quan hệ thống hay tái lập lớn về hiểu biết vật thể khuất ở trẻ sơ sinh để đỡ nhãn "Đã bị bác bỏ"; nguồn đã mở (OpenStax, Diamond 1985, Wynn/Wakeley) chỉ cho thấy nhiều nghiên cứu thấy trẻ đạt mốc sớm hơn và bài Wynn còn tranh cãi; không đủ để xác nhận mức "bác bỏ" cho câu "hoàn toàn không có khái niệm vật thể".
    trich: we’ve learned that Piaget underestimated their cognitive abilities, and that infants understand object permanence and other qualities of objects earlier than he theorized (Ebersbach, 2009; Woodward & Needham, 2008) [OpenStax Lifespan 3.4] | infants also looked longer at possible 180 degree rotations in Experiment 2, in which no obstruction was present [Rivera 1999]
    vi_tri: OpenStax Lifespan Development 3.4, mục Piaget; tóm tắt Rivera 1999
    review: sai
  - id: n41
    cau: 'Piaget: trẻ tự xây dựng kiến thức qua đồng hóa và điều ứng, không "tải" kiến thức có sẵn.'
    loai: lich-su
    nguon:
