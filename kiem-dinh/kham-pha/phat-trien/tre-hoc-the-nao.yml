    trich: This improvement marks the development of the ability to hold a goal in mind in the absence of external cues, and to use that remembered goal to guide behavior despite the pull of previous reinforcement to act otherwise.
    vi_tri: Diamond & Goldman-Rakic 1989, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Trẻ có trí nhớ làm việc nhỏ hơn và khả năng kiềm chế kém hơn người lớn". Chữ mới: theo Diamond & Goldman-Rakic và Bjork & Cummings. Lý do: không nguồn đã mở so sánh trẻ với người lớn. Review (Claude Opus 5.5, 10/11/2026): Khớp tóm tắt Diamond & Goldman-Rakic 1989 và Bjork & Cummings 1984.'
