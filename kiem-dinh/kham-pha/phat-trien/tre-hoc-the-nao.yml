  - id: n60
    cau: "Câu 2: Baillargeon đo thời gian nhìn thay vì bắt trẻ thò tay tìm; Piaget bắt trẻ thò tay tìm đồ, việc đòi hỏi phối hợp các hành động riêng rẽ; khi chỉ cần nhìn, trẻ 3,5–4,5 tháng nhìn lâu hơn ở tình huống phi lý, Baillargeon diễn giải là trẻ hiểu vật vẫn tồn tại."
    loai: phat-hien
    nguon:
      - baillargeon1987
    trich: young infants could fail Piaget's task simply because it requires them to coordinate separate actions on separate objects
    vi_tri: Baillargeon 1987, tóm tắt; "requires them to coordinate separate actions" ở mở bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "trẻ 3–4 tháng tuổi đã tỏ ra hiểu vật thể vẫn tồn tại". Chữ mới: "3,5–4,5 tháng… nhìn lâu hơn…; Baillargeon diễn giải". Lý do: đúng độ tuổi và nói rõ là diễn giải. Review (Claude Opus 5.5, 10/11/2026): Mở lại toàn văn Baillargeon 1987 (PDF, Internet Archive, bộ wikipedia-scholarly-sources-corpus, zip 10.1037%252F0002-9432.71.2.245.zip): tóm tắt và mục Phương pháp khớp câu và câu trích; lượt 2 không mở được, nay đã giải quyết. Lời giải thích trên trang còn chữ "khó hơn nhiều so với chỉ nhìn" (lượt 1 đã bỏ "phức tạp hơn nhiều" ở thân bài nhưng sót ở đây): đã sửa thành "Piaget bắt trẻ thò tay tìm đồ, việc đòi hỏi phối hợp các hành động riêng rẽ; Baillargeon chỉ đo thời gian nhìn"; doi_chu.'
    luot_2: khong-chac
    luot_2_ghi_chu: Bài gốc Baillargeon 1987 (Developmental Psychology 23, 655) đóng sau APA PsycNET; không có bản mở, tóm tắt trên Crossref/OpenAlex/PubMed/Semantic Scholar trống; chỉ xác nhận được tiêu đề "Object permanence in 3½- and 4½-month-old infants". Không xác nhận được phần Baillargeon đo thời gian nhìn và kết quả 3,5–4,5 tháng; phần Piaget bắt trẻ thò tay tìm khớp OpenStax.
