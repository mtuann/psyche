nhan_dinh:
  - id: s1
    cau: 'Psyche là site tiếng Việt giúp người không học chuyên ngành hiểu tâm lý học như một khoa học thực nghiệm. Mỗi trang trả lời một câu hỏi: bằng chứng nói gì, và chắc chắn đến đâu?'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Mô tả site: AGENTS.md (đầu), plans/lam-lai/README.md; câu "bằng chứng nói gì, và chắc chắn đến đâu?" cũng ở trang bat-dau/cach-kiem-chung (đã khóa).'
  - id: n1
    cau: Trong tâm lý học, psyche là tâm trí nói chung, phân biệt với cơ thể; chữ này từng mang nghĩa linh hồn.
    loai: dinh-nghia
    nguon:
      - apa-psyche
    trich: in psychology, the mind in its totality, as distinguished from the physical organism. The term, which historically had come to refer to the soul or the very essence of life, derives from the character of Psyche in Greek mythology
    vi_tri: mục từ "psyche"
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Psyche là "tâm trí" trong tiếng Hy Lạp, gốc của chữ psychology; Zero là bắt đầu từ con số 0." Chữ mới theo định nghĩa của APA Dictionary (bậc 2); bỏ "gốc của chữ psychology" (APA không nói, chưa mở được nguồn từ nguyên bậc 2) và câu về chữ "Zero" (site đổi tên thành Psyche).'
    luot_2: dung
    luot_2_nguon: [ "https://dictionary.apa.org/psyche" ]
    luot_2_ghi_chu: Khớp mục APA Dictionary.
  - id: s2
    cau: 'Psyche là bản làm lại của Psyche Zero (bản đầu của site, 10/2026): từng trang được kiểm chứng lại từ đầu rồi mới lên site mới.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'plans/lam-lai/README.md (Quyết định: tên site, luật 1); bản build thật chỉ có trang đã khóa (src/ban-build.mjs). Câu cũ ở bản nháp đầu "bản cũ vẫn mở" đã bỏ: ngày 17/11/2026 https://mtuann.github.io/psyche-zero/ trả 404 (báo cáo D8-L4).'
  - id: s3
    cau: 'Nguyên tắc 1: mọi kết luận quan trọng đều có nhãn mức độ chắc chắn, kèm giải thích và nguồn.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: AGENTS.md, Quy tắc nội dung; plans/ben-vung/chuan-kiem-dinh.md mục 4 (mỗi khung nhãn có co_so); tools/khoa.mjs chặn khóa nhãn thiếu co_so, ly_do.
  - id: s4
    cau: 'Nguyên tắc 2: nói thẳng về khủng hoảng tái lập; khi một hiệu ứng nổi tiếng không tái lập được, chúng tôi nói rõ.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: AGENTS.md, Quy tắc nội dung ("nói thẳng về kết quả tái lập"); loại nhận định tai-lap và thước đo nhãn (Đang tranh cãi khi tái lập lớn thất bại), chuan-kiem-dinh.md mục 1, 4.
  - id: s5
    cau: 'Nguyên tắc 3: ưu tiên phân tích tổng hợp hơn nghiên cứu đơn lẻ; ghi cỡ mẫu, năm, thiết kế.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'AGENTS.md ("ưu tiên phân tích tổng hợp"); chuan-kiem-dinh.md mục 2 (bậc 2 cho câu về tình trạng bằng chứng). "Ghi cỡ mẫu, năm, thiết kế": khuôn hộp hồ sơ nghiên cứu (:::ho-so-nghien-cuu) và phần kể nghiên cứu ở các bài thí nghiệm.'
  - id: s6
    cau: 'Nguyên tắc 4: tương quan không phải nhân quả.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Nguyên tắc viết của site; trang nhà của khái niệm: bang-chung/tuong-quan-nhan-qua (đã khóa).'
  - id: s7
    cau: 'Nguyên tắc 5: nói rõ giới hạn văn hóa; phần lớn nghiên cứu được làm ở phương Tây; khi chưa có dữ liệu về người Việt, chúng tôi nói là chưa có.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: Khung "Ở Việt Nam" (:::o-viet-nam) và câu thời sự "chưa tìm thấy nghiên cứu ở Việt Nam" có mốc và hạn (chuan-kiem-dinh.md mục 1, thoi-su). "Phần lớn nghiên cứu làm ở phương Tây" có trang nhà bang-chung/mau-va-chon-mau (WEIRD, đã khóa).
  - id: s8
    cau: 'Nguyên tắc 6: không bịa; mọi tên nghiên cứu, năm, cỡ mẫu, số liệu đều được tra cứu và đối chiếu với nguồn.'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'tools/khoa.mjs: mọi nhận định (trừ câu về chính site) phải có nguồn trong hồ sơ mới khóa được; bản thật chỉ có trang đã khóa.'
  - id: s9
    cau: 'Nguyên tắc 7: khoa học, không phải self-help; chúng tôi viết "nghiên cứu gợi ý rằng…", không hứa "làm 5 bước này bạn sẽ hạnh phúc".'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Nguyên tắc viết (AGENTS.md: không lời khuyên điều trị; lời khuyên là khẳng định về bằng chứng, chuan-kiem-dinh.md mục 1).'
  - id: s10
    cau: 'Nguyên tắc 8: mỗi nghiên cứu một trang nhà; nghiên cứu kinh điển được kể chi tiết ở một trang, nơi khác chỉ tóm một câu và dẫn về đó.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: AGENTS.md, Quy tắc nội dung; src/data/nghien-cuu.yml (trang_nha); câu cùng ý ở bat-dau/cach-kiem-chung (đã khóa).
  - id: s11
