- cu: 'Tóm tắt bài Big Five: "Chiều cao nhất: <tên chiều> (x/5)"'
  moi: '"Đã làm bài thử (điểm từng chiều xem ở trang công cụ)"'
  ly_do: Tránh nêu "chiều cao nhất" (như Bất ổn cảm xúc) ngoài bối cảnh giải thích của công cụ
ghi_chu: 'Trang công cụ: chữ của trang và của công cụ (src/scripts/cong-cu/nhat-ky.js, chung/loai.js). Không phải nhật ký cảm xúc: người đọc không ghi gì ở đây. Không có số liệu nghiên cứu trong mã.'
