nguon:
- id: mdn-localstorage
  ten: 'MDN Web Docs, Window: localStorage property (mục Value, Exceptions), đọc ngày 17/11/2026'
  link: https://developer.mozilla.org/en-US/docs/Web/API/Window/localStorage
  toan_van: true
nhan_dinh:
- id: s1
  cau: Kết quả các bài thử, lượt chơi thẻ ngộ nhận và các phần "Thử suy ngẫm" được lưu chỉ trên trình duyệt này (trong localStorage); Psyche không có máy chủ lưu dữ liệu, và không gửi kết quả của bạn đi đâu.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'src/scripts/cong-cu/chung/luu.js (khóa localStorage psyche-zero); src/scripts/quiz.js lưu bản ghi quiz qua đó; tìm fetch, XMLHttpRequest, sendBeacon, WebSocket trong src/scripts/: không có (17/11/2026). Thẻ ngộ nhận (D8-L3) lưu kind myths như site cũ.'
- id: n1
  cau: Dữ liệu trong localStorage mất nếu bạn xóa dữ liệu duyệt web, và không tự đồng bộ sang thiết bị khác; trình duyệt có thể chặn lưu (chế độ riêng tư, người dùng tắt lưu dữ liệu trang web).
  loai: dinh-nghia
  nguon:
  - mdn-localstorage
  trich: allows you to access a Storage object for the Document's origin; the stored data is saved across browser sessions. … (localStorage data for a document loaded in a "private browsing" or "incognito" session is cleared when the last "private" tab is closed.) … The request violates a policy decision. For example, the user has configured the browsers to prevent the page from persisting data.
  vi_tri: mục mô tả, Exceptions (SecurityError)
  ket_qua: dung
  ghi_chu: '"Không tự đồng bộ sang thiết bị khác": localStorage gắn với nguồn (origin) của tài liệu trong trình duyệt ấy (MDN: "Storage object for the Document''s origin"); "mất khi xóa dữ liệu duyệt web" là hệ quả của lưu trong trình duyệt. Câu cảnh báo trong công cụ ("chế độ riêng tư hay đã tắt lưu dữ liệu trang web") cùng nguồn.'
- id: s2
  cau: Kết quả đã lưu khi dùng Psyche Zero (bản cũ của site) vẫn còn ở đây, vì hai bản dùng chung chỗ lưu.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Hai bản cùng nguồn https://mtuann.github.io (localStorage theo nguồn) và cùng khóa psyche-zero, dữ liệu phiên bản 1 y như progress.js của site cũ (chung/luu.js, tests/cong-cu.test.mjs "kho: khóa và phiên bản như site cũ"). Câu mới.'
- id: s3
  cau: 'Bạn có thể tải một file sao lưu và khôi phục ở nơi khác; khôi phục là gộp, không ghi đè: các bản ghi trong file được thêm vào, không có gì bị xóa; gộp cùng một file nhiều lần không tạo bản ghi trùng lặp; trước khi gộp, bạn thấy số bản ghi mới sẽ được thêm.'
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'src/scripts/cong-cu/du-lieu-cua-toi.js (taiVe, xemTruoc dùng soSanh, nhap dùng gop); chung/luu.js gop: hợp theo id (tests/cong-cu.test.mjs: không mất, không nhân đôi, lũy đẳng); luồng trên ba trình duyệt: tests/trinh-duyet/kiem-cong-cu.mjs (gộp lại cùng file: "không có bản ghi nào mới").'
- id: s4
  cau: Xóa toàn bộ kết quả qua hai bước (hỏi lại trước khi xóa); xóa kết quả không bật lại việc lưu trang khi đã tắt.
  loai: ve-site
  ket_qua: dung
  ghi_chu: du-lieu-cua-toi.js (hoiXoa; giữ tùy chọn ngoai-tuyen false sau xoaHet); tests/trinh-duyet/kiem-cong-cu.mjs.
- id: s5
  cau: Khi bật (mặc định), trình duyệt lưu các trang bạn đã mở trên máy này, cùng trang Hỗ trợ, để đọc lại được khi mất mạng; mỗi lần site cập nhật, bản lưu cũ được thay; trang chưa mở lần nào thì chưa đọc được khi mất mạng; tắt thì các trang đã lưu bị xóa, kết quả bài thử không bị ảnh hưởng.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'src/scripts/ngoai-tuyen/sw.js (điều hướng: mạng trước rồi lưu; lưu sẵn ho-tro/ lúc cài; phiên bản mới xóa bộ nhớ đệm psyche- cũ), dang-ky.js (mặc định đăng ký; tùy chọn false thì gỡ và xóa bộ nhớ đệm); du-lieu-cua-toi.js (tat chỉ xóa bộ nhớ đệm psyche-, không đụng khóa kết quả). tests/trinh-duyet/kiem-ngoai-tuyen.mjs (Chromium, WebKit: trang đã mở đọc được khi mất mạng; trang chưa mở hiện "Đang mất mạng"; tắt thì gỡ, xóa).'
- id: s6
  cau: Trình duyệt không hỗ trợ service worker thì công cụ nói rõ không lưu được trang để đọc khi mất mạng.
  loai: ve-site
  ket_qua: dung
  ghi_chu: du-lieu-cua-toi.js (coSw).
