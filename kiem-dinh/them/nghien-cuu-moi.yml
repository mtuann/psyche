- id: z2
  cau: 'Phân tích tổng hợp 35 thử nghiệm ngẫu nhiên có đối chứng với 5.734 người tham gia cho thấy tập kết hợp (aerobic và kháng lực) cải thiện nhận thức tổng thể với g = 0,32 (khoảng tin cậy 95%: 0,17–0,46).'
  loai: so-lieu
  nguon:
  - zhang2025
  trich: 'The meta-analysis included 35 RCTs with 5,734 participants, revealing a positive effect of CT on global cognition (g = 0.32, 95% CI: 0.17-0.46, p < 0.001).'
  vi_tri: tóm tắt, Results
  ket_qua: da-sua
  ghi_chu: Thêm khoảng tin cậy (có trong tóm tắt); chữ cũ không có.
- id: z3
  cau: Lợi ích rõ hơn ở người từ 65 tuổi trở lên (g = 0,33) và cũng thấy ở người có bệnh (g = 0,28); các chương trình dài 13–26 tuần có hiệu quả có ý nghĩa thống kê (g = 0,21).
  loai: so-lieu
  nguon:
  - zhang2025
  trich: 'older adults (≥65 years) exhibited greater cognitive benefits (g = 0.33; 95% CI: 0.14-0.51, p < 0.05) compared to younger populations. Significant effects were also observed in clinical populations (g = 0.28 …). … medium-length interventions (13-26 weeks) demonstrating significant effects (g = 0.21; 95% CI: 0.05-0.37, p = 0.011).'
  vi_tri: tóm tắt, Results
  ket_qua: dung
- id: z4
