  ghi_chu: 'Giải quyết sau lượt 2 (Claude Opus 5.5, 17/11/2026): lượt 2 dung, ghi chú đây là cách đọc của site. Chữ trên trang nay nói rõ: "nên chúng tôi đọc g = 0,32 là hiệu quả nhỏ; tác giả không tự xếp mức". Chữ cũ: "hiệu quả ở khoảng nhỏ đến vừa". Review (Claude Opus 5.5, agent riêng, 17/11/2026): vế "tác giả không tự xếp mức" sai: toàn văn (PMC11987655) viết "The overall findings indicate moderate effects of CT on global cognition" (Discussion) và "Concurrent training yield moderate improvements" (Conclusions); tóm tắt không xếp mức. Đã sửa: "tác giả thì gọi đây là hiệu quả mức vừa (moderate)"; giữ cách đọc của site theo mốc Cohen (z5). ket_qua đổi từ da-lam-mem thành da-sua.'
