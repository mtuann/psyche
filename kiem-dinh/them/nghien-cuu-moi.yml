- id: b1
  cau: 'Boyce và cộng sự (2024), Collabra: Psychology 10(1), 125685, 20 tác giả (danh sách như trên trang).'
  loai: so-lieu
  nguon:
  - boyce2024
  trich: '"title": "Estimating the Replicability of Psychology Experiments After an Initial Failure to Replicate", "volume": "10", "issue": "1", article-number 125685; 20 tác giả, từ Boyce tới Frank'
  vi_tri: siêu dữ liệu Crossref (api.crossref.org, 17/11/2026)
  ket_qua: dung
  luot_2: dung
  luot_2_nguon:
  - https://doi.org/10.1525/collabra.125685
  luot_2_ghi_chu: Siêu dữ liệu từ Crossref.
- id: b2
  cau: Nhóm tác giả làm lại 17 thí nghiệm mà lần tái lập đầu đã thất bại; ở 5 trong 17 trường hợp (29%), lần làm lại tái lập được phần lớn hay toàn bộ kết quả gốc, nhưng với độ lớn hiệu ứng nhỏ hơn; 12 trường hợp còn lại vẫn thất bại.
  loai: tai-lap
  nguon:
  - boyce2024
  trich: Here, we report 17 re-replications of experiments for which an original replication had failed. In 5/17 of these "rescue" projects (29%), the "rescue" study mostly or fully replicated the original results, albeit with a smaller effect size; in the other 12, the second replication was also judged to have failed.
  vi_tri: tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "5/17 (29%) lần giải cứu đã khôi phục được hiệu ứng gốc". Chữ mới theo đúng tóm tắt: "tái lập được phần lớn hay toàn bộ" (mostly or fully replicated).'
  luot_2: dung
  luot_2_nguon:
  - https://doi.org/10.1525/collabra.125685
  luot_2_ghi_chu: Tóm tắt từ Crossref.
- id: b3
  cau: 'Tác giả phỏng đoán các lần thành công là nhờ mẫu lớn hơn hay đổi cách làm (như thêm câu hỏi kiểm tra sự chú ý), và khuyên: nếu lần tái lập thất bại không có điểm yếu rõ ràng, có lẽ nên dừng sau một lần.'
  loai: phat-hien
  nguon:
  - boyce2024
  trich: We speculate that successful rescue projects were due to larger sample sizes or methodological changes such as attention checks. In the absence of obvious weaknesses in a failed replication study's sample or procedure, however, it may be most efficient to stop pursuing an effect after a single failed replication.
  vi_tri: tóm tắt
  ket_qua: dung
  luot_2: dung
  luot_2_nguon:
  - https://doi.org/10.1525/collabra.125685
  luot_2_ghi_chu: Tóm tắt từ Crossref.
- id: b4
  cau: 17 trường hợp là một mẫu nhỏ, nên tỉ lệ 29% còn rất không chắc chắn.
  loai: phat-hien
  nguon:
  - boyce2024
  trich: In 5/17 of these "rescue" projects (29%)
  vi_tri: tóm tắt
  ket_qua: dung
  ghi_chu: 'Câu giới hạn mới (them-noi-dung.md mục 6: tin nói rõ giới hạn). Lập luận thống kê: khoảng tin cậy 95% của tỉ lệ 5/17 (Wilson) khoảng 13–53%, tự tính; không nêu con số trên trang.'
  luot_2: dung
  luot_2_nguon:
  - https://doi.org/10.1525/collabra.125685
  luot_2_ghi_chu: 'Suy luận thống kê đúng: với 17 trường hợp, khoảng tin cậy 95% của 5/17 rộng (khoảng 13% đến 53% theo Wilson, tự tính). Đây là nhận xét của site, không phải của tác giả; không sai.'
- id: b5
  cau: 'Bài Vì sao nhiều phát hiện nổi tiếng không lặp lại được? viết rằng tái lập thất bại không có nghĩa phát hiện gốc là bịa: có thể hiệu ứng có thật nhưng nhỏ hơn.'
  loai: ve-site
  ket_qua: dung
  review: dung
  ghi_chu: 'src/content/docs/bang-chung/khung-hoang-tai-lap.md dòng 65: "Tái lập thất bại không có nghĩa phát hiện gốc là bịa. Có thể hiệu ứng thật nhưng nhỏ hơn, hoặc chỉ đúng trong một số điều kiện nhất định." (trang đã khóa).'
- id: d1
  cau: Dawson và de Meza (2026), Psychological Review, đăng trực tuyến tháng 7/2026.
  loai: so-lieu
  nguon:
  - dawson2026
  trich: '"container-title": "Psychological Review", "published-online": 2026-07-20'
  vi_tri: siêu dữ liệu Crossref (api.crossref.org, 17/11/2026)
  ket_qua: dung
  luot_2: dung
  luot_2_nguon:
  - https://doi.org/10.1037/rev0000644
  luot_2_ghi_chu: Siêu dữ liệu Crossref và Europe PMC.
- id: d2
  cau: 'Theo tóm tắt, đây là một bài lý thuyết: tác giả đề xuất một mô hình giải thích (lý thuyết tín hiệu).'
  loai: phat-hien
  nguon:
  - dawson2026
  trich: We propose a signaling theory according to which the role of self-deception is to better inform others.
  vi_tri: tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Giải quyết sau lượt 2 (Claude Opus 5.5, 17/11/2026): lượt 2 khong-chac (chỉ đọc tóm tắt, không loại trừ được bài có phân tích dữ liệu hay mô phỏng). Bỏ vế "không phải một thí nghiệm hay một phân tích dữ liệu mới" (tóm tắt không nói); giữ phần tóm tắt xác nhận ("We propose a signaling theory"), nói rõ "theo tóm tắt". Review (Claude Opus 5.5, agent riêng, 17/11/2026): đạt. Tự mở tóm tắt (OpenAlex, bản PsycInfo; Crossref: journal-article, Psychological Review, đăng trực tuyến 20/7/2026): "We propose a signaling theory…"; câu chỉ nói điều tóm tắt xác nhận, có "theo tóm tắt".'
  luot_2: khong-chac
  luot_2_ghi_chu: 'chỗ khó: tóm tắt nói ''We propose a signaling theory'' và ''Evidence supports this interpretation'', nghĩa là bài đề xuất lý thuyết nhưng có viện dẫn bằng chứng; tôi không mở được toàn văn nên không loại trừ việc bài có phân tích dữ liệu hay mô phỏng riêng. Phần ''một bài lý thuyết, đề xuất mô hình'' thì đúng.'
- id: d3
  cau: 'Câu hỏi của bài: tự tin thái quá thúc ta hành động, còn ác cảm mất mát kìm ta lại; nếu tự tin thái quá có lợi, vì sao lại có thêm một thiên kiến kéo theo chiều ngược lại?'
  loai: phat-hien
  nguon:
  - dawson2026
  trich: Overconfidence is a call to action, while loss aversion curbs initiative. … Moreover, if overconfidence is adaptive, why is it at least partially canceled by loss aversion?
  vi_tri: tóm tắt
  ket_qua: dung
  luot_2: dung
  luot_2_nguon:
  - https://doi.org/10.1037/rev0000644
  luot_2_ghi_chu: Chỉ đọc được tóm tắt; khớp.
- id: d4
  cau: Ác cảm mất mát (loss aversion) là xu hướng cố tránh những gì ta thấy là mất mát, nhiều một cách không cân xứng.
  loai: dinh-nghia
  nguon:
  - apa-behavioral-economics
  trich: loss aversion (the tendency to go to disproportionately great lengths to avoid perceived losses)
  vi_tri: mục "behavioral economics"
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "mất một khoản thấy đau hơn được cùng khoản đó" (cách nói phổ thông, chưa có nguồn mở được). Chữ mới theo định nghĩa của APA Dictionary.'
  luot_2: dung
  luot_2_nguon:
  - https://dictionary.apa.org/behavioral-economics
  - https://doi.org/10.2307/2937956
- id: d5
  cau: 'Theo mô hình, tự tin thái quá cài sẵn là tín hiệu đáng tin về năng lực thật: quyết định sai vì quá tin vào mình gây thiệt hại ít hơn cho người giỏi, còn lợi ích của việc được coi là giỏi tăng theo năng lực.'
  loai: phat-hien
  nguon:
  - dawson2026
  trich: Since the decision error associated with high self-belief is less burdensome for the more able, and the benefit of being perceived as able increases with ability, hardwired overconfidence is a credible signal of true ability.
  vi_tri: tóm tắt
  ket_qua: dung
  luot_2: dung
  luot_2_nguon:
  - https://doi.org/10.1037/rev0000644
  luot_2_ghi_chu: Chỉ đọc được tóm tắt; khớp.
- id: d6
  cau: Ác cảm mất mát bù bớt cái giá của những quyết định quá tự tin; vì thường được giấu kín, nó không làm mất vai trò tín hiệu của sự tự tin; tác giả cho rằng lời khuyên của Kahneman nên bỏ cả hai thiên kiến là thiếu cơ sở.
  loai: phat-hien
  nguon:
  - dawson2026
  trich: A further implication of signaling is that loss aversion is part of the equilibrium. It partially ameliorates the decision costs of overconfidence, but as it is usually hidden, it does not eliminate its signaling role. … Kahneman's advice that individuals eliminate both overconfidence and loss aversion is poorly founded.
  vi_tri: tóm tắt
  ket_qua: dung
  luot_2: dung
  luot_2_nguon:
  - https://doi.org/10.1037/rev0000644
  luot_2_ghi_chu: Chỉ đọc được tóm tắt; khớp.
- id: d7
  cau: Chúng tôi chỉ đọc được tóm tắt; tóm tắt nói bằng chứng hiện có ủng hộ cách hiểu này, nhưng không nêu bằng chứng ấy là gì.
  loai: phat-hien
  nguon:
  - dawson2026
  trich: Evidence supports this interpretation.
  vi_tri: tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Giải quyết sau lượt 2 (Claude Opus 5.5, 17/11/2026): lượt 2 khong-chac: vế "mô hình vẫn cần được kiểm định bằng dữ liệu" không có trong tóm tắt (nhận xét của site). Bỏ vế ấy; câu mới chỉ nói điều kiểm được trên chính tóm tắt (câu duy nhất về bằng chứng là "Evidence supports this interpretation."). Chữ trước nữa (site cũ): "… cần được kiểm định độc lập". Review (Claude Opus 5.5, agent riêng, 17/11/2026): đạt. Tóm tắt (OpenAlex) chỉ có một câu về bằng chứng, "Evidence supports this interpretation.", không nêu bằng chứng nào; câu trên trang nói đúng vậy.'
  luot_2: khong-chac
  luot_2_ghi_chu: 'chỗ khó: tóm tắt chỉ nói ''Evidence supports this interpretation''. Vế ''mô hình vẫn cần được kiểm định bằng dữ liệu'' không có trong tóm tắt (là nhận xét của site, chưa xác nhận được vì không mở toàn văn); vì vậy câu gán cho tóm tắt điều tóm tắt không nói.'
- id: d8
  cau: (bỏ) Theo cách gắn nhãn của site, mô hình đang ở mức Đang tranh cãi.
  loai: nhan
  nguon:
  - dawson2026
  trich: (không có)
  vi_tri: ''
  ket_qua: da-bo
  ghi_chu: 'Bỏ: nhãn của site nói về tình trạng bằng chứng của một khẳng định theo thước đo mục 4; một bài lý thuyết chưa có kiểm định không có cơ sở (co_so) để xếp nhãn. Thay bằng câu d9. Giải quyết sau lượt 2 (Claude Opus 5.5, 17/11/2026): lượt 2 khong-chac, đồng ý không gắn nhãn cho mô hình lý thuyết: giữ da-bo.'
  nhan: tranh-cai
  co_so:
  - dawson2026
  ly_do: đã bỏ
  luot_2: khong-chac
  luot_2_ghi_chu: 'chỗ khó: câu đã đánh dấu (bỏ). Một mô hình lý thuyết mới, mới công bố, chưa có tổng quan hay tái lập nào: ''Đang tranh cãi'' hàm ý bằng chứng mâu thuẫn mà tôi không tìm thấy; thước đo nhãn không rõ có áp dụng cho mô hình lý thuyết. Nếu giữ, nên bỏ nhãn hay nói chưa đủ bằng chứng; không đánh giá thêm.'
- id: d9
  cau: Bài Kẻ dốt hay tự tin thái quá? kể các phê bình thống kê nhắm vào hiệu ứng Dunning–Kruger (Krueger và Mueller, 2002; Gignac và Zajenkowski, 2020); mô hình của Dawson và de Meza bàn một câu hỏi khác, không kiểm định hiệu ứng Dunning–Kruger, nên không dùng được để nói hiệu ứng ấy đúng hay sai.
  loai: ve-site
  ket_qua: da-sua
  review: dung
  ghi_chu: 'src/content/docs/kham-pha/tu-duy/dunning-kruger.md (đã khóa): mục "Krueger và Mueller (2002): phê bình thống kê", "Gignac và Zajenkowski (2020)". Vế sau suy từ d2, d5 (tóm tắt không nhắc Dunning–Kruger). Chữ cũ "nếu đúng, sự tự tin cao lại đi cùng năng lực cao — trái với cách hiểu phổ thông" đã bỏ (diễn giải xa hơn tóm tắt).'
