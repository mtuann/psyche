- id: z3
  cau: 'Ở người từ 65 tuổi trở lên, hiệu quả có ý nghĩa thống kê (g = 0,33; khoảng tin cậy 95%: 0,14–0,51), còn ở nhóm 18–65 tuổi (chỉ 4 thử nghiệm) thì chưa đạt ý nghĩa thống kê; tác giả đọc đây là lợi ích lớn hơn ở người cao tuổi, nhưng khi chính bài kiểm định ảnh hưởng của tuổi bằng hồi quy tổng hợp (meta-regression), khác biệt giữa hai nhóm tuổi không có ý nghĩa thống kê (p = 0,69). Ở người có bệnh, g = 0,28; các chương trình dài 13–26 tuần có hiệu quả có ý nghĩa thống kê (g = 0,21).'
  loai: so-lieu
  nguon:
  - zhang2025
  - zhang2025-pmc
  trich: 'Participants aged over 65 exhibited significant effects (g = 0.33, 95% CI: 0.14 to 0.51; p < 0.05), whereas those aged 18 to 65 did not (p = 0.099), indicating greater cognitive benefits from exercise in older adults. Clinical populations demonstrated significant effects (g = 0.28, 95% CI: 0.11 to 0.46; p < 0.001) … Bảng 3: 18–65, k = 4, g = 0,24 (0,00 đến 0,48); >65, k = 31, g = 0,33 (0,14 đến 0,51) … Bảng 4 (Meta-regression analysis for potential heterogeneity): Age (18–65 years, >65 years), k = 36, R² = 0,03, p value 0.69'
  vi_tri: toàn văn, Results (Participants moderators), Bảng 3, Bảng 4
  ket_qua: da-sua
  luot_2: qua-manh
  luot_2_nguon:
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC11987655/
  luot_2_ghi_chu: 'câu đúng: Ở người từ 65 tuổi trở lên, tập kết hợp có hiệu quả có ý nghĩa thống kê (g = 0,33; KTC 95%: 0,14-0,51), còn ở nhóm 18-65 tuổi thì chưa đạt ý nghĩa thống kê (p = 0,099); tác giả diễn giải là lợi ích lớn hơn ở người cao tuổi, nhưng đây là so sánh có/không đạt ý nghĩa thống kê giữa các nhóm con, chưa phải phép kiểm định sự khác biệt. Ở người có bệnh g = 0,28; ở các chương trình 13-26 tuần g = 0,21 (có ý nghĩa).; chỗ khó: các số đều đúng; vấn đề là ''rõ hơn'' dựa trên so sánh ý nghĩa thống kê giữa các nhóm con (g = 0,33 gần bằng g chung 0,32, khoảng tin cậy rộng), nên nói mạnh hơn bằng chứng. Câu trích dùng đúng lời tác giả nên nếu giữ thì nên thêm ''theo tác giả'' và giới hạn này.'
  ghi_chu: 'Giải quyết sau lượt 2 (Claude Opus 5.5, 17/11/2026): lượt 2 qua-manh, đồng ý. Chữ cũ: "Lợi ích rõ hơn ở người từ 65 tuổi trở lên (g = 0,33) và cũng thấy ở người có bệnh (g = 0,28)". Đã tự mở toàn văn (Bảng 3): nhóm 18–65 chỉ 4 thử nghiệm, g = 0,24, p = 0,099. Câu mới theo cau_dung; không nêu p = 0,099 và g của nhóm trẻ (giữ tin ngắn). Khác cau_dung: thêm "khoảng tin cậy" và viết "đó là so sánh nhóm nào đạt…"; review xem. Review (Claude Opus 5.5, agent riêng, 17/11/2026): tự mở toàn văn (Europe PMC fullTextXML PMC11987655). Các số đúng (Bảng 3; tóm tắt: >65 g = 0,33, 0,14–0,51; người có bệnh g = 0,28; 13–26 tuần g = 0,21). Nhưng vế "không phải phép kiểm định khác biệt giữa hai nhóm" chưa đúng hẳn: bài có kiểm định tuổi bằng hồi quy tổng hợp (Bảng 4: tuổi, k = 36, p = 0,69, không có ý nghĩa), và ghi "the 95% CI for all factors overlapped". Đã sửa câu theo Bảng 4 (thêm "chỉ 4 thử nghiệm" theo Bảng 3); câu mới cùng hướng thận trọng với cau_dung của lượt 2, chính xác hơn theo toàn văn.'
