  ghi_chu: 'src/content/docs/kham-pha/co-so-sinh-hoc/the-duc-nao.md (đã khóa) dòng 70 ":::tranh-cai[tập aerobic cải thiện nhận thức đến mức nào]" và dòng 71 (Smith 2010 g ≈ 0,12–0,16; Ciria 2023 d = 0,05 sau hiệu chỉnh). Chữ cũ "đã kết luận khá vững … (g ≈ 0,12–0,18)" sai với bài hiện nay: đã sửa.'
