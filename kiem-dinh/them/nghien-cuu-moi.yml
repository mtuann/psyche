ghi_chu: 'Dòng cập nhật: 5 tin của Psyche Zero (13/10/2026, mục 4 viết lại 22/10/2026) kiểm lại như nhận định; không tin nào bị bỏ cả tin, các câu không kiểm được trong từng tin đã bỏ hay làm mềm. Nguồn chỉ mở được tóm tắt (bốn bài) và tóm tắt cộng Public Significance Statement (Ferguson): mọi câu viết ở mức tóm tắt xác nhận được (chuan-kiem-dinh.md mục 3, V3: "viết lại ở mức tóm tắt xác nhận được").'
