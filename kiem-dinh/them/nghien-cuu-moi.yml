- id: z2
  cau: 'Phân tích tổng hợp 35 thử nghiệm ngẫu nhiên có đối chứng với 5.734 người tham gia cho thấy tập kết hợp (aerobic và kháng lực) cải thiện nhận thức tổng thể với g = 0,32 (khoảng tin cậy 95%: 0,17–0,46).'
