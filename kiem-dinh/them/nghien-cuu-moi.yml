  vi_tri: Lakens 2013
  ket_qua: dung
  ghi_chu: Cùng nguồn với trang nhà bang-chung/do-lon-hieu-ung (đã khóa, link trên trang). Mốc đề xuất cho d; g là d hiệu chỉnh cho mẫu nhỏ, cùng thang.
