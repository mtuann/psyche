- cu: '"Trang được cập nhật định kỳ mỗi quý." "Cập nhật lần cuối: tháng 10/2026." và dòng cuối "Trang này sẽ được cập nhật mỗi quý. Nếu bạn thấy một nghiên cứu mới … hãy ghi chú lại"'
  moi: Bỏ; mỗi tin có ngày, tin mới thêm lên đầu, đính chính bằng tin mới (s1); câu về năm tin chuyển từ Psyche Zero (s3)
  ly_do: 'Dòng cập nhật (tầng cap-nhat): ngày ở từng mục, không cần dòng "cập nhật lần cuối". Lời hứa "mỗi quý" là việc của kế hoạch (máy canh hằng quý, đợt 9), không ghi trên trang để khỏi thành câu thời sự.'
- cu: Tiêu đề "## 1. …" đến "## 5. …"; mỗi tin có các mục Nghiên cứu, Câu hỏi nghiên cứu, Phát hiện chính, Vì sao đáng chú ý, Đọc thêm
  moi: 'Tiêu đề "## 13/10/2026: …" có id cố định; các mục Nghiên cứu, Câu hỏi, Phát hiện chính, Giới hạn, Liên quan (gộp Vì sao đáng chú ý và Đọc thêm)'
  ly_do: 'Dòng cập nhật: mỗi mục có ngày (tests/them.test.mjs); them-noi-dung.md mục 6: tin nói rõ giới hạn và bài liên quan. Thứ tự: năm tin cùng ngày, tin cuối của trang cũ đứng đầu.'
