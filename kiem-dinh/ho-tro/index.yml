  - id: n74
    cau: "Nếu bạn thấy thông tin nào đã thay đổi, xin hãy báo cho chúng tôi."
    loai: ve-site
    ket_qua: da-bo
    review: sai
    ghi_chu: "Người gom (Claude Opus 5.5, 30/10/2026): giữ câu mời như trang cũ, chưa thêm đường báo: repo còn riêng tư nên link GitHub Issues ra 404 với người đọc. Khi repo công khai hay có địa chỉ liên hệ thì thêm (ghi ở báo cáo D2-L1). Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): sai. Câu mời báo nhưng cả site chưa có đường báo nào (Footer.astro chỉ có link Hỗ trợ và giấy phép; repo riêng tư nên Issues ra 404). Người đọc thấy số sai không làm theo được. Người gom (Claude Opus 5.5) sửa theo review: Bỏ câu cho tới khi có đường báo (email hay issue công khai); khi có thì viết kèm link, ví dụ \"Nếu bạn thấy thông tin nào đã thay đổi, xin báo ở <link>.\""
  - id: n75
    cau: "Mục \"Nguồn đã dùng để kiểm chứng\" liệt kê đúng các nguồn đã mở ở hồ sơ này."
    loai: ve-site
    ket_qua: da-sua
    review: sai
    ghi_chu: "Đối chiếu với danh sách nguon của hồ sơ. Đổi so với trang cũ: bỏ Báo Lào Cai, Tuổi Trẻ (12/10/2025, không nói 24/7 hay miễn phí), Thư viện pháp luật (trả 403), Tuổi Trẻ/PLO (111), Vietnam News (Ngày Mai), Find A Helpline (CSAGA), trang Bạch Mai, và số 112 (trang không nói 112). Thêm Luật Viễn thông 2023, TT 22/2014, QĐ 01/2008, TT 26/2025, cổng pháp luật Cần Thơ, WHO, SAMHSA, NIMH, Healthdirect, NHS Health Careers. Sửa tên báo cáo 111: trang cũ ghi \"Báo cáo số 14/BC-BMTE ngày 20/01/2026\", bản PDF đăng trên tongdai111.vn để trống số và ngày (\"Số: /BC-BMTE\", \"ngày tháng 01 năm 2026\"), nên ghi \"tháng 01/2026\". Bỏ câu \"Số của Bệnh viện Tâm thần Trung ương 2 mới chỉ đối chiếu được với trang chính thức\" (nay mọi số đều chỉ đối chiếu trang chính thức). Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): sai. So danh sách nguon của hồ sơ với khối \"Nguồn đã dùng để kiểm chứng\": thiếu hope-hyvongsong và findahelpline-vn, là hai nguồn đã mở cho câu \"chưa tìm thấy đường dây quốc gia 24/7\" (n25; Find A Helpline chỉ có link ở thân trang); dazzi2014 có link ngay trong câu. Các nguồn còn lại khớp. Người gom (Claude Opus 5.5) sửa theo review: Thêm một dòng: \"Câu về đường dây quốc gia 24/7: danh bạ [Find A Helpline](https://findahelpline.com/countries/vn) và trang của các đường dây đã liệt kê ở đó, như [HOPE](https://hyvongsong.com) (12:00–00:00 hằng ngày, không 24/7).\""
