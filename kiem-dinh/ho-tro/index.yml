  - id: n62
    cau: "Thận trọng với nơi hứa \"chữa khỏi\" nhanh chóng, cam kết kết quả, hoặc chỉ dựa vào một bài trắc nghiệm."
    loai: loi-khuyen
    trich: null
    ket_qua: da-bo
    ghi_chu: "Người gom (Claude Opus 5.5, 30/10/2026): bỏ: lời khuyên không tìm được nguồn chính thức (chuẩn: lời khuyên cũng phải có nguồn). Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Dòng đã bỏ khỏi trang; lượt 2 khong-chac, không có nguồn chính thức. Bỏ là đúng chuẩn."
    luot_2: khong-chac
    luot_2_ghi_chu: 'Không tìm được nguồn bậc 1 (NHS, NIMH, SAMHSA, WHO, APA) nói đúng ý "thận trọng với nơi hứa chữa khỏi nhanh, cam kết kết quả, hay chỉ dựa vào một bài trắc nghiệm". Trang APA về chọn nhà trị liệu chặn máy, trang Mind trả 403. Chỉ thấy ở trang của phòng khám và dịch vụ thương mại. NIMH (psychotherapies) gần nhất: nên hỏi mục tiêu, khung thời gian, cách đánh giá tiến bộ. Luật Khám bệnh, chữa bệnh Điều 7 cấm quảng cáo gian dối về khám chữa bệnh, nhưng không nói đúng ý này. Lời khuyên hợp lý; nên tìm nguồn chính thức hoặc ghi là lời khuyên của site.'
    review: dung
