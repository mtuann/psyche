    ghi_chu: "Chữ cũ: \"Chẩn đoán cần một người có chuyên môn, gặp và trò chuyện với bạn.\" Chữ mới theo câu chuẩn của chuan-kiem-dinh.md mục 5; bỏ \"gặp và trò chuyện\" vì khám từ xa cũng có và không nguồn nào ở đây nói phải gặp trực tiếp."
