nhan_dinh:
  # Hộp khẩn cấp
  - id: n1
    cau: "Nếu bạn hoặc ai đó đang gặp nguy hiểm ngay lúc này: gọi Cấp cứu 115, hoặc đến khoa cấp cứu của bệnh viện gần nhất."
    loai: loi-khuyen
    nguon: [ who-suicide-friend, qd01-2008-byt ]
    trich: "If you think someone is in immediate danger, don’t leave them alone. Contact the emergency services, a crisis line, a health worker or a family member."
    vi_tri: "WHO 2021, mục What you can do; QĐ 01/2008, Điều 6 k1 điểm a: tiếp nhận yêu cầu cấp cứu \"qua số điện thoại cấp cứu 115\""
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/behaviours/help-for-suicidal-thoughts/", "https://datafiles.chinhphu.vn/cpp/files/vbpq/2022/01/27-btttt.pdf" ]
    luot_2_ghi_chu: Mở 30/10/2026. Lời khuyên khớp NHS (gọi cấp cứu hoặc đến khoa cấp cứu); 115 là số cấp cứu y tế theo quy hoạch kho số.
  - id: n2
    cau: "115 là số Cấp cứu (cấp cứu y tế)."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [ tt22-2014-btttt, qd01-2008-byt ]
    trich: "115 là số dịch vụ gọi Cấp cứu y tế;"
    vi_tri: "TT 22/2014, Điều 13 k1 điểm b"
    ket_qua: dung
    ghi_chu: "chỗ khó: TT 22/2014 đã được sửa bởi TT 27/2021; Thông tư 21/2025/TT-BKHCN (hiệu lực 20/11/2025) quy định nội dung, trình tự phê duyệt quy hoạch kho số. Chưa mở được bản quy hoạch kho số mới, nên chưa xác nhận TT 22/2014 còn hiệu lực ở điều này. Các số 113, 114, 115 vẫn được nhắc như số khẩn cấp hiện hành trong Quyết định 01/2008/QĐ-BYT và báo cáo 111 năm 2025."
    luot_2: dung
    luot_2_nguon: [ "https://datafiles.chinhphu.vn/cpp/files/vbpq/2022/01/27-btttt.pdf", "https://vanban.chinhphu.vn/default.aspx?pageid=27160&docid=205070" ]
    luot_2_ghi_chu: Mở 30/10/2026. Bản PDF là ảnh quét có lớp chữ hỏng dấu, đã đọc dòng 115 ở cả mạng cố định và di động. Bộ KH&CN có Thông tư 34/2026/TT-BKHCN về quy hoạch kho số (mst.gov.vn, 27/06/2026); chưa xác nhận được nó có thay Thông tư 22/2014 hay đổi số 115 không, nhưng các trang nhà nước năm 2025–2026 vẫn dùng 113, 114, 115.
  - id: n3
    cau: "Nếu có nguy cơ bạo lực: gọi Công an 113."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [ tt22-2014-btttt ]
    trich: "113 là số dịch vụ gọi Công an;"
    vi_tri: "Điều 13 k1 điểm b"
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://datafiles.chinhphu.vn/cpp/files/vbpq/2022/01/27-btttt.pdf", "https://bocongan.gov.vn/bai-viet/gop-phan-dam-bao-an-ninh-trat-tu-an-toan-xa-hoi-tren-dia-ban-tinh-bac-lieu-d23-t40579" ]
    luot_2_ghi_chu: Mở 30/10/2026.
  - id: n4
    cau: "Nếu không muốn ở một mình, hãy gọi hoặc nhắn cho một người bạn tin tưởng và nhờ họ ở bên bạn."
    loai: loi-khuyen
    nguon: [ who-depression ]
    trich: "talk to someone you trust about your feelings"
    vi_tri: "mục tự chăm sóc (self-care)"
    ket_qua: dung
    ghi_chu: "WHO khuyên nói chuyện với người mình tin; phần \"nhờ họ ở bên\" khớp lời khuyên của WHO 2021 cho người giúp (\"don’t leave them alone\")."
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/behaviours/help-for-suicidal-thoughts/" ]
    luot_2_ghi_chu: Mở 30/10/2026.
  - id: n5
    cau: "Các cuộc gọi đến 113, 114, 115 được miễn phí."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [ luat-vien-thong-2023, tt22-2014-btttt ]
    trich: "c) Cung cấp miễn phí dịch vụ viễn thông khẩn cấp cho người sử dụng dịch vụ điện thoại."
    vi_tri: "Luật Viễn thông 2023, Điều 25 k1 (dịch vụ gọi đến các số khẩn cấp của công an, cứu hỏa, cấp cứu) và k3 điểm c, tr. 22 Công báo; hiệu lực 01/7/2024 (Điều 72). TT 22/2014 Điều 13: 113, 114, 115 là số dịch vụ khẩn cấp"
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/01/luat24.pdf", "https://datafiles.chinhphu.vn/cpp/files/vbpq/2022/01/27-btttt.pdf" ]
    luot_2_ghi_chu: Mở 30/10/2026. Luật có hiệu lực từ 01/07/2024 (Công báo số 29+30, 05/01/2024). Số 113, 114, 115 là số dịch vụ khẩn cấp theo Phụ lục Thông tư 27/2021/TT-BTTTT. Luật miễn phí cuộc gọi (dịch vụ viễn thông), không nói về chi phí dịch vụ cấp cứu.
  - id: n6
    cau: "Bạn không cần phải \"đủ nặng\" mới được tìm sự giúp đỡ. Nếu điều gì đó đang làm bạn khổ sở, việc tìm người nói chuyện là hợp lý."
    loai: loi-khuyen
    nguon: [ nimh-help, who-depression ]
    trich: "If these activities do not help or symptoms worsen, talk to a health care provider."
    vi_tri: "NIMH, nhánh triệu chứng nhẹ; WHO: \"seek help from a healthcare provider\""
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/low-mood-sadness-depression/" ]
    luot_2_ghi_chu: Mở 30/10/2026. NHS khuyên tìm người nói chuyện, kể cả chuyên gia, ngay cả khi chỉ là tâm trạng xuống, không đòi phải nặng.
  # Các đường dây hỗ trợ
  - id: n7
    cau: "Dưới đây chỉ gồm những số mà chúng tôi kiểm chứng được từ nguồn chính thức, tính đến tháng 10/2026."
    loai: ve-site
    ket_qua: da-sua
    review: dung
    ghi_chu: "Kiểm trên hồ sơ này: mọi số trên trang có nguồn chính thức (n13–n33). Chữ cũ: \"Dưới đây chỉ gồm những số mà chúng tôi kiểm chứng được từ nguồn chính thức.\" Chữ mới thêm \"tính đến tháng 10/2026\" (khẳng định thời sự cần mốc). Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Mọi số ở bảng đường dây có nguồn chính thức: 115, 113 (văn bản pháp luật), 111 (tongdai111.vn), Ngày Mai (duongdaynongngaymai.vn, mở lại 30/10/2026: 096 306 1414, 13h00–20h30, Thứ 4–Chủ nhật), CSAGA (csaga.org.vn, mở lại 30/10/2026: 024 3333 55 99). Có mốc tháng 10/2026."
  - id: n8
    cau: "Psyche không gọi thử các số này và không thể cam kết thay các tổ chức về giờ làm việc, chi phí hay cách họ bảo mật thông tin."
    loai: ve-site
    ket_qua: da-sua
    review: dung
    ghi_chu: "Lượt 1 không gọi số nào (lời giao). Chữ cũ \"Psyche Zero\", chữ mới \"Psyche\" (tên site mới). Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Lời giao các lượt cấm gọi; review cũng không gọi."
  - id: n9
    cau: "115 là số cấp cứu y tế: gọi khi có tình huống sức khỏe nguy hiểm đến tính mạng, kể cả khi đã tự làm hại hoặc sắp tự làm hại."
    loai: loi-khuyen
    nguon: [ who-suicide-friend, paho-living-depression ]
    trich: "If they’re thinking about self-harm, or have already intentionally harmed themselves, don’t leave them alone. Seek help from the emergency services or a health-care professional."
    vi_tri: "WHO/PAHO 2021, mục What you can do"
    ket_qua: da-sua
    ghi_chu: 'Người gom (Claude Opus 5.5, 30/10/2026): sửa theo cau_dung của lượt 2 (qua-manh). Chữ cũ "Mọi trường hợp nguy hiểm đến tính mạng" rộng hơn Thông tư 27/2021/TT-BTTTT (115 là cấp cứu y tế; cháy 114, an ninh 113). Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Chữ cuối (bảng và khung khẩn cấp) đã theo cau_dung của lượt 2: "Tình huống sức khỏe nguy hiểm đến tính mạng, kể cả khi đã tự làm hại hoặc sắp tự làm hại"; khớp WHO/PAHO và NHS (hai lượt).'
    luot_2: qua-manh
    luot_2_nguon: [ "https://datafiles.chinhphu.vn/cpp/files/vbpq/2022/01/27-btttt.pdf", "https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/behaviours/help-for-suicidal-thoughts/" ]
    luot_2_ghi_chu: 'câu đúng: 115 là số cấp cứu y tế: gọi khi có tình huống sức khỏe nguy hiểm đến tính mạng, kể cả khi đã tự làm hại hoặc sắp tự làm hại.; Mở 30/10/2026. Phần "kể cả nguy cơ tự làm hại" đúng (NHS: tự làm hại hay sắp tự làm hại thì gọi xe cấp cứu). Nhưng "mọi trường hợp nguy hiểm đến tính mạng" rộng hơn văn bản: cháy là 114, bạo lực, tội phạm là 113. Chỉ cần thu hẹp về "cấp cứu y tế".'
    review: dung
  - id: n10
    cau: "115: 24/7; cuộc gọi miễn phí."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [ qd01-2008-byt, luat-vien-thong-2023 ]
    trich: "Công tác cấp cứu, hồi sức tích cực và chống độc phải bảo đảm hoạt động liên tục 24/24 giờ."
    vi_tri: "QĐ 01/2008, Điều 2 k4; miễn phí: Luật Viễn thông 2023, Điều 25 k3 điểm c"
    ket_qua: da-sua
    ghi_chu: "chỗ khó: LuatVietnam không hiện tình trạng hiệu lực của QĐ 01/2008 (cần đăng nhập); trang không thấy ghi bị thay thế. Không tìm được trang chính thức của một trung tâm 115 cấp quốc gia. Người gom (Claude Opus 5.5, 30/10/2026): sửa theo cau_dung của lượt 2 (qua-manh). Chữ cũ \"24/7, miễn phí\": luật chỉ bảo đảm cuộc gọi miễn phí (Luật Viễn thông 2023, Điều 25), không nói dịch vụ cấp cứu, xe miễn phí. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Chữ cuối \"24/7, cuộc gọi miễn phí\" theo cau_dung của lượt 2; QĐ 01/2008 (24/24), Luật Viễn thông 2023 Điều 25 (cuộc gọi miễn phí)."
    luot_2: qua-manh
    luot_2_nguon: [ "https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/01/luat24.pdf", "https://xaydungchinhsach.chinhphu.vn/quy-dinh-moi-ve-truc-kham-chua-benh-tu-1-1-2024-119240103065651053.htm" ]
    luot_2_ghi_chu: 'câu đúng: 115: 24/7; cuộc gọi miễn phí.; Mở 30/10/2026. 24/7 đúng. Văn bản chỉ bảo đảm miễn phí cuộc gọi. Tôi không tìm được văn bản chính thức nói dịch vụ cấp cứu, vận chuyển 115 miễn phí; các bài tìm thấy (chưa mở được trang chính thức) cho thấy giá vận chuyển cấp cứu ngoại viện do từng tỉnh quy định, ví dụ Hà Nội theo Quyết định 45/2017/QĐ-UBND. Viết "miễn phí" không kèm "cuộc gọi" có thể làm người đọc hiểu cả dịch vụ miễn phí.'
    review: dung
