  - cu: "Kiểm tra lần cuối: 13/10/2026. Các số điện thoại được đối chiếu với trang web chính thức của từng tổ chức và ít nhất một nguồn độc lập, trừ khi có ghi chú khác. Danh sách được kiểm tra lại bằng tay mỗi quý. Nếu bạn thấy thông tin nào đã thay đổi, xin hãy báo cho chúng tôi."
    moi: "Kiểm tra lần cuối: 30/10/2026. Hạn kiểm tra lại: 30/01/2027. Các số điện thoại được đối chiếu với trang web chính thức của từng tổ chức; số miễn phí của 113, 114, 115 được đối chiếu với văn bản pháp luật. Danh sách được kiểm tra lại bằng tay mỗi quý. Nếu bạn thấy thông tin nào đã thay đổi, xin hãy báo cho chúng tôi."
