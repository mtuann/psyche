  - id: n25
    cau: "Tính đến tháng 10/2026, chúng tôi chưa tìm thấy đường dây quốc gia 24/7 dành riêng cho sức khỏe tâm thần người lớn hay phòng chống tự sát ở Việt Nam."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [ findahelpline-vn, ngaymai, hope-hyvongsong, tongdai111 ]
    trich: "Phục vụ từ 12:00 đến 00:00 hằng ngày"
    vi_tri: "hyvongsong.com/ho-tro-khung-hoang (HOPE, đường dây khủng hoảng 086 50 444 00); Find A Helpline liệt kê 5 dịch vụ ở Việt Nam (Ngày Mai, HOPE, 111, đường dây bạo lực giới, Ngôi nhà Bình yên)"
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"Theo những gì chúng tôi tìm được (tháng 10/2026), Việt Nam chưa có đường dây quốc gia 24/7…\". Chữ mới: \"Tính đến tháng 10/2026, chúng tôi chưa tìm thấy…\": khẳng định phủ định chỉ nói được ở mức điều mình đã tìm. Đã xem: các dịch vụ trên Find A Helpline; Ngày Mai (13:00–20:30, T4–CN); HOPE (12:00–00:00 hằng ngày, tổ chức phi lợi nhuận lập năm 2025, không nói phạm vi quốc gia); 111 (24/24 nhưng cho trẻ em); tìm \"tổng đài quốc gia sức khỏe tâm thần 24/7 Bộ Y tế 2026\" không ra. Chỗ khó: Bộ Y tế, Bộ Công an đã đề xuất một tổng đài cấp cứu quốc gia tích hợp 113, 114, 115 (Tuổi Trẻ 11/12/2025): kiểm lại mỗi quý. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Cách viết đủ thận trọng: có mốc \"Tính đến tháng 10/2026\", chủ ngữ \"chúng tôi chưa tìm thấy\" (không khẳng định Việt Nam không có), phạm vi hẹp (quốc gia, 24/7, riêng sức khỏe tâm thần người lớn hay phòng chống tự sát), và câu sau chỉ đường 115/cấp cứu; có het_han 2027-01-30. Hai lượt tìm độc lập cùng không thấy. Về HOPE: mở hyvongsong.com 30/10/2026 (trang chủ, /ho-tro-khung-hoang/, /meet-our-staff/, /connect/, /faqs/, /disclaimer/). Trang nói rõ số (Hotline 086 50 444 00; văn phòng 081 21 512 20), giờ (\"Phục vụ từ 12:00 đến 00:00 hằng ngày\"), đối tượng (\"những ai đang vật lộn với ý nghĩ tự sát hoặc bị ảnh hưởng bởi vấn đề này\"), và ai vận hành (HOPE, lập năm 2025, văn phòng ở Đà Nẵng; Ban quản trị là tình nguyện viên, có tên: Giám đốc điều hành Merijn Mattheijssen, Tổng quản lý Mai Bảo Trâm…; \"hoạt động kết hợp với Psychologists Vietnam\"; chi phí vận hành do Merijn Mattheijssen tài trợ cá nhân). Điểm yếu: tư cách tự mô tả không nhất quán (\"tổ chức phi lợi nhuận\" ở trang chủ, \"doanh nghiệp xã hội đã được đăng ký\" ở FAQ mà không ghi mã số hay link, \"dự án cộng đồng… không phải cơ sở y tế\" ở miễn trừ trách nhiệm), số nhân sự lệch (\"hơn 30\" và \"hơn 15\" chuyên viên), không nói chi phí cuộc gọi. Đề xuất: đủ điều kiện để thêm (số, giờ, người vận hành đều có trên trang chính thức), là đường dây phòng chống tự sát duy nhất hai lượt tìm thấy, nên đáng thêm sau khi qua lượt 1 và lượt 2 như các dòng khác, với chữ chỉ nói điều trang HOPE nói, ví dụ dòng bảng: \"Đường dây HOPE | 086 50 444 00 | Người có ý nghĩ tự sát hay đang khủng hoảng cảm xúc, và người thân. Do HOPE, một dự án cộng đồng lập năm 2025 ở Đà Nẵng, vận hành với tình nguyện viên; không phải cơ sở y tế | 12:00–00:00 hằng ngày; trang không ghi chi phí, hãy hỏi khi gọi\". Khi thêm thì câu \"Ngoài giờ làm việc của các đường dây trên…\" vẫn đúng; chủ repo quyết vì tư cách pháp lý chưa kiểm được. Câu n25 hiện có giữ nguyên."
    luot_2: khong-chac
    luot_2_nguon: [ "https://findahelpline.com/countries/vn", "https://hyvongsong.com/", "https://bvtt-tphcm.org.vn/lien-he/" ]
    luot_2_ghi_chu: "Câu phủ định, không có nguồn bậc 1 nào xác nhận được. Lượt 2 tìm độc lập (30/10/2026) cũng không thấy đường dây quốc gia 24/7 riêng cho sức khỏe tâm thần người lớn hay phòng chống tự sát. Nhưng Find A Helpline có liệt kê một đường dây phòng chống tự sát mà trang có thể chưa nhắc: HOPE – Suicide Prevention Hotline, 0865 044 400, tổ chức phi lợi nhuận lập năm 2025, 12:00–00:00 hằng ngày (không 24/7, không phải của nhà nước). Bệnh viện Tâm thần TP.HCM có hotline 1900.1267 (không ghi giờ). Người gom nên xem có thêm HOPE vào trang không (sau khi kiểm như các đường dây khác), và giữ câu phủ định kèm mốc thời gian."
