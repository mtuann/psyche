  - cu: ["Đào tạo Bác sĩ y khoa, chuyên khoa tâm thần Chuyên ngành tâm lý lâm sàng Rất khác nhau Công tác xã hội", "Giấy phép Giấy phép hành nghề bác sĩ Là chức danh phải có giấy phép hành nghề theo Luật Khám bệnh, chữa bệnh 2023 (có hiệu lực từ 01/01/2024) Hiện chưa có giấy phép hành nghề quốc gia riêng Đăng ký hành nghề theo Nghị định 110/2024/NĐ-CP", "Kê đơn thuốc Có Không (kê đơn là phạm vi của bác sĩ) Không Không"]
