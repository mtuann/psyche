    ghi_chu: "Kiểm trên hồ sơ này (lan[0].ngay, het_han của các câu thời sự). Chữ cũ: \"Kiểm tra lần cuối: 13/10/2026.\" Chữ mới: ngày kiểm của lượt 1 và hạn kiểm lại (lời giao D2-L1). Review nên đổi ngày nếu lượt 2 kiểm lại số ở ngày khác. Dòng trạng thái kiểm định do PageTitle sinh từ hồ sơ có thể lặp ý: review xem có cần giữ câu này không. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. lan[0].ngay 2026-10-30 và het_han 2027-01-30 của mọi câu thời sự trong hồ sơ; khớp. Nếu sửa trang sau review thì ngày phải đổi theo lần kiểm mới."
  - id: n72
    cau: "Số của các tổ chức và bệnh viện được đối chiếu với trang web chính thức của từng nơi (Bệnh viện Tâm thần Trung ương 1: bản lưu của trang); các số 113, 114, 115, giờ trực của 115 và việc gọi miễn phí được đối chiếu với văn bản pháp luật."
    loai: ve-site
    ket_qua: da-sua
    review: sai
    ghi_chu: "Kiểm trên hồ sơ này (n2–n33). Chữ cũ: \"…đối chiếu với trang web chính thức của từng tổ chức và ít nhất một nguồn độc lập, trừ khi có ghi chú khác.\" Lượt 1 không đối chiếu nguồn độc lập cho từng số (chỉ trang chính thức, theo chuẩn), nên bỏ vế ấy. Bệnh viện TW1 đối chiếu bản lưu của trang chính thức: đã ghi ở mục nguồn trên trang. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): sai. Vế đầu chưa đúng hết: số 113 và 115 (và giờ 24/7 của 115) đối chiếu với văn bản pháp luật (TT 22/2014, QĐ 01/2008), không phải trang web của \"từng tổ chức\"; số Bệnh viện Tâm thần Trung ương 1 đối chiếu bản lưu của trang chính thức. Người gom (Claude Opus 5.5) sửa theo review: Số của các tổ chức và bệnh viện được đối chiếu với trang web chính thức của từng nơi (Bệnh viện Tâm thần Trung ương 1: bản lưu của trang); các số 113, 114, 115, giờ trực của 115 và việc gọi miễn phí được đối chiếu với văn bản pháp luật."
