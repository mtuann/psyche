    ket_qua: da-sua
    review: null
    ghi_chu: "Kiểm ở AGENTS.md (Quy tắc nội dung: \"Không có công cụ tự chẩn đoán\") và danh sách công cụ CONG_CU trong src/plugins/thanh-phan.mjs (review xác nhận). Chữ cũ \"Psyche Zero\", chữ mới \"Psyche\"."
