nhan_dinh:
  # Hộp khẩn cấp
  - id: n1
    cau: "Nếu bạn hoặc ai đó đang gặp nguy hiểm ngay lúc này: gọi Cấp cứu 115, hoặc đến khoa cấp cứu của bệnh viện gần nhất."
    loai: loi-khuyen
    nguon: [who-suicide-friend, qd01-2008-byt]
    trich: "If you think someone is in immediate danger, don’t leave them alone. Contact the emergency services, a crisis line, a health worker or a family member."
    vi_tri: "WHO 2021, mục What you can do; QĐ 01/2008, Điều 6 k1 điểm a: tiếp nhận yêu cầu cấp cứu \"qua số điện thoại cấp cứu 115\""
    ket_qua: dung
  - id: n2
    cau: "115 là số Cấp cứu (cấp cứu y tế)."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [tt22-2014-btttt, qd01-2008-byt]
    trich: "115 là số dịch vụ gọi Cấp cứu y tế;"
    vi_tri: "TT 22/2014, Điều 13 k1 điểm b"
    ket_qua: dung
    ghi_chu: "chỗ khó: TT 22/2014 đã được sửa bởi TT 27/2021; Thông tư 21/2025/TT-BKHCN (hiệu lực 20/11/2025) quy định nội dung, trình tự phê duyệt quy hoạch kho số. Chưa mở được bản quy hoạch kho số mới, nên chưa xác nhận TT 22/2014 còn hiệu lực ở điều này. Các số 113, 114, 115 vẫn được nhắc như số khẩn cấp hiện hành trong Quyết định 01/2008/QĐ-BYT và báo cáo 111 năm 2025."
  - id: n3
    cau: "Nếu có nguy cơ bạo lực: gọi Công an 113."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [tt22-2014-btttt]
    trich: "113 là số dịch vụ gọi Công an;"
    vi_tri: "Điều 13 k1 điểm b"
    ket_qua: dung
  - id: n4
    cau: "Nếu không muốn ở một mình, hãy gọi hoặc nhắn cho một người bạn tin tưởng và nhờ họ ở bên bạn."
    loai: loi-khuyen
    nguon: [who-depression]
    trich: "talk to someone you trust about your feelings"
    vi_tri: "mục tự chăm sóc (self-care)"
    ket_qua: dung
    ghi_chu: "WHO khuyên nói chuyện với người mình tin; phần \"nhờ họ ở bên\" khớp lời khuyên của WHO 2021 cho người giúp (\"don’t leave them alone\")."
  - id: n5
    cau: "Các cuộc gọi đến 113, 114, 115 được miễn phí."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [luat-vien-thong-2023, tt22-2014-btttt]
    trich: "c) Cung cấp miễn phí dịch vụ viễn thông khẩn cấp cho người sử dụng dịch vụ điện thoại."
    vi_tri: "Luật Viễn thông 2023, Điều 25 k1 (dịch vụ gọi đến các số khẩn cấp của công an, cứu hỏa, cấp cứu) và k3 điểm c, tr. 22 Công báo; hiệu lực 01/7/2024 (Điều 72). TT 22/2014 Điều 13: 113, 114, 115 là số dịch vụ khẩn cấp"
    ket_qua: dung
  - id: n6
    cau: "Bạn không cần phải \"đủ nặng\" mới được tìm sự giúp đỡ. Nếu điều gì đó đang làm bạn khổ sở, việc tìm người nói chuyện là hợp lý."
    loai: loi-khuyen
    nguon: [nimh-help, who-depression]
    trich: "If these activities do not help or symptoms worsen, talk to a health care provider."
    vi_tri: "NIMH, nhánh triệu chứng nhẹ; WHO: \"seek help from a healthcare provider\""
    ket_qua: dung
  # Các đường dây hỗ trợ
  - id: n7
    cau: "Dưới đây chỉ gồm những số mà chúng tôi kiểm chứng được từ nguồn chính thức, tính đến tháng 10/2026."
    loai: ve-site
    ket_qua: da-sua
    review: null
    ghi_chu: "Kiểm trên hồ sơ này: mọi số trên trang có nguồn chính thức (n13–n33). Chữ cũ: \"Dưới đây chỉ gồm những số mà chúng tôi kiểm chứng được từ nguồn chính thức.\" Chữ mới thêm \"tính đến tháng 10/2026\" (khẳng định thời sự cần mốc)."
  - id: n8
    cau: "Psyche không gọi thử các số này và không thể cam kết thay các tổ chức về giờ làm việc, chi phí hay cách họ bảo mật thông tin."
    loai: ve-site
    ket_qua: da-sua
    review: null
    ghi_chu: "Lượt 1 không gọi số nào (lời giao). Chữ cũ \"Psyche Zero\", chữ mới \"Psyche\" (tên site mới)."
  - id: n9
    cau: "115 dành cho mọi trường hợp nguy hiểm đến tính mạng, kể cả nguy cơ tự làm hại."
    loai: loi-khuyen
    nguon: [who-suicide-friend, paho-living-depression]
    trich: "If they’re thinking about self-harm, or have already intentionally harmed themselves, don’t leave them alone. Seek help from the emergency services or a health-care professional."
    vi_tri: "WHO/PAHO 2021, mục What you can do"
    ket_qua: dung
  - id: n10
    cau: "115: 24/7, miễn phí."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [qd01-2008-byt, luat-vien-thong-2023]
    trich: "Công tác cấp cứu, hồi sức tích cực và chống độc phải bảo đảm hoạt động liên tục 24/24 giờ."
    vi_tri: "QĐ 01/2008, Điều 2 k4; miễn phí: Luật Viễn thông 2023, Điều 25 k3 điểm c"
    ket_qua: dung
    ghi_chu: "chỗ khó: LuatVietnam không hiện tình trạng hiệu lực của QĐ 01/2008 (cần đăng nhập); trang không thấy ghi bị thay thế. Không tìm được trang chính thức của một trung tâm 115 cấp quốc gia."
  - id: n11
    cau: "113 dành cho nguy cơ bạo lực, cần can thiệp khẩn cấp."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [tt22-2014-btttt, luat-vien-thong-2023]
    trich: "Dịch vụ viễn thông khẩn cấp là dịch vụ gọi đến các số dịch vụ khẩn cấp của cơ quan công an, cứu hỏa, cấp cứu."
    vi_tri: "Luật Viễn thông 2023, Điều 25 k1; TT 22/2014 Điều 13: \"113 là số dịch vụ gọi Công an\""
    ket_qua: dung
    ghi_chu: "Nguồn nói 113 là số khẩn cấp của công an; \"nguy cơ bạo lực\" là ví dụ của trường hợp khẩn cấp cần công an."
  - id: n12
    cau: "113: 24/7."
    loai: thoi-su
    het_han: 2027-01-30
    ket_qua: da-bo
    ghi_chu: "Chữ cũ ô Thời gian của 113: \"24/7, miễn phí\"; chữ mới: \"Miễn phí\". Không tìm được văn bản hay trang chính thức của Bộ Công an nói giờ trực của số 113 (Thông tư 28/2020/TT-BCA nói trực ban hình sự 24/24 giờ để tiếp nhận tin báo tội phạm, không nói số 113; báo Lâm Đồng nói Cảnh sát 113 tỉnh trực 24/24 là nguồn báo, một địa phương). Bỏ phần 24/7 theo quy tắc chỉ đưa điều kiểm chứng được; chủ repo có thể thêm lại khi có nguồn chính thức."
  - id: n13
    cau: "Tổng đài quốc gia bảo vệ trẻ em: số 111."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [tongdai111, bc111-2025]
    trich: "Tổng đài Quốc Gia BVTE là dịch vụ công đặc biệt thành lập theo quy định của Luật trẻ em 2016"
    vi_tri: "trang chủ tongdai111.vn; báo cáo tr. 1: \"Tổng đài điện thoại quốc gia bảo vệ trẻ em (Tổng đài 111)\""
    ket_qua: dung
  - id: n14
    cau: "111 dành cho trẻ em, và người lớn lo lắng cho một trẻ em (bị xâm hại, bạo lực, bỏ rơi…)."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [tongdai111, bc111-2025]
    trich: "Nhóm người gọi từ 18 tuổi trở lên chiếm tỷ lệ cao nhất với 22.577 cuộc (67,34%)"
    vi_tri: "báo cáo, mục I.2.1 (tr. 1); trang chủ nêu các trường hợp \"bị mua bán, bị đánh cắp, bị bỏ rơi, bỏ mặc\", \"tư vấn về xâm hại bạo lực\""
    ket_qua: dung
  - id: n15
    cau: "Tổng đài 111 do Cục Bà mẹ và Trẻ em, Bộ Y tế vận hành."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [bc111-2025, tongdai111]
    trich: "BỘ Y TẾ / CỤC BÀ MẸ VÀ TRẺ EM … Cục Bà mẹ và Trẻ em báo cáo Thứ trưởng tình hình trẻ em thông qua việc tiếp nhận thông tin và tư vấn, hỗ trợ, can thiệp của Tổng đài điện thoại quốc gia bảo vệ trẻ em"
    vi_tri: "báo cáo, đầu văn bản (tr. 1); chân trang tongdai111.vn: \"Tổng đài Quốc gia Bảo vệ Trẻ em, Cục Bà mẹ và Trẻ em, 35 Trần Phú, Hà Nội\""
    ket_qua: dung
    ghi_chu: "Phần lịch sử trên tongdai111.vn còn nhắc Bộ LĐ-TB&XH (cơ quan chủ quản cũ); báo cáo tháng 01/2026 mang tiêu đề Bộ Y tế."
  - id: n16
    cau: "111: 24/7, miễn phí."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [tongdai111, bc111-2025]
    trich: "Tổng đài hoạt động 24/24 … các cuộc gọi đến tổng đài là hoàn toàn miễn phí"
    vi_tri: "trang chủ tongdai111.vn; báo cáo mục II: \"liên tục 24/24h hàng ngày\""
    ket_qua: dung
  - id: n17
    cau: "Đường dây nóng Ngày Mai: 096 306 1414."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [ngaymai]
    trich: "096 306 1414"
    vi_tri: "trang chủ, ô hotline"
    ket_qua: dung
  - id: n18
    cau: "Ngày Mai dành cho: sơ cứu và hỗ trợ tâm lý qua điện thoại cho người trầm cảm và người thân của họ."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [ngaymai]
    trich: "Sơ cứu và hỗ trợ tâm lý miễn phí qua điện thoại cho người trầm cảm và người thân của họ;"
    vi_tri: "trang chủ, mục hoạt động"
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Hỗ trợ tâm lý cho người đang gặp khó khăn về cảm xúc, trầm cảm\". Chữ mới theo đúng trang của Ngày Mai (đối tượng là người trầm cảm và người thân; thêm \"sơ cứu\"), vì chữ cũ rộng hơn trang nói."
  - id: n19
    cau: "Ngày Mai do một nhóm tình nguyện viên vận hành."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [ngaymai]
    trich: "triển khai bởi một nhóm tình nguyện viên"
    vi_tri: "trang chủ, phần giới thiệu (\"Ngày mai là sáng kiến cộng đồng, phi lợi nhuận\")"
    ket_qua: da-sua
