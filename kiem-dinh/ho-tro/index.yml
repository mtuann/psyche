  - cu: "Đường dây nóng Ngày Mai 096 306 1414 Hỗ trợ tâm lý cho người đang gặp khó khăn về cảm xúc, trầm cảm 13:00–20:30, Thứ Tư đến Chủ nhật; miễn phí (cước gọi theo nhà mạng)"
    moi: "Đường dây nóng Ngày Mai 096 306 1414 Sơ cứu và hỗ trợ tâm lý qua điện thoại cho người trầm cảm và người thân của họ. Do một nhóm tình nguyện viên vận hành 13:00–20:30, Thứ Tư đến Chủ nhật; dịch vụ miễn phí"
    ly_do: "Theo trang chính thức của Ngày Mai: đối tượng, đơn vị vận hành; trang không nói về cước gọi (n18, n19, n21)."
  - cu: "CSAGA 024 3333 5599 Người bị bạo lực gia đình, bạo lực trên cơ sở giới; cộng đồng LGBTQ+ Giờ làm việc chưa được công bố rõ; hãy hỏi khi gọi"
    moi: "CSAGA 024 3333 5599 Tư vấn miễn phí cho người bị bạo lực gia đình, bạo lực trên cơ sở giới; cộng đồng LGBTQ+ Trang của CSAGA không ghi giờ trực; hãy hỏi khi gọi"
