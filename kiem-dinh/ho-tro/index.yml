  - cu: ["cảm giác buồn bã, trống rỗng, lo âu hay căng thẳng kéo dài nhiều tuần và không dịu đi;", "bạn dùng rượu, chất kích thích hay các hành vi khác để chịu đựng;", "người thân nói rằng bạn thay đổi nhiều;"]
    moi: ["cảm giác buồn bã, trống rỗng, lo âu hay căng thẳng kéo dài từ hai tuần trở lên và không dịu đi;", "bạn dùng rượu hay chất kích thích ngày càng nhiều;"]
