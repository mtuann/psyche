    nguon: [ dazzi2014, who-suicide-friend ]
    trich: "None found a statistically significant increase in suicidal ideation among participants asked about suicidal thoughts."
    vi_tri: "Dazzi 2014, tóm tắt (Europe PMC, PMID 24998511); WHO 2021: \"Asking someone if they are thinking about suicide does not make them act on their feelings.\""
    ket_qua: dung
    ghi_chu: "Bài là tổng quan tài liệu (review), không phải phân tích tổng hợp; \"tổng quan các nghiên cứu\" đúng mức. Chỉ đọc tóm tắt."
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/24998511/", "https://doi.org/10.1017/S0033291714001299" ]
    luot_2_ghi_chu: 'Đọc tóm tắt qua NCBI E-utilities (PMID 24998511), 30/10/2026. Đây là tổng quan ngắn (bài bình luận), không phải phân tích tổng hợp; câu "một tổng quan các nghiên cứu" là đúng mức. NIMH (5 Action Steps) cũng nói: "Studies show that asking people if they are suicidal does not increase suicidal behavior or thoughts."'
