  - cu: "Theo những gì chúng tôi tìm được (tháng 10/2026), Việt Nam chưa có đường dây quốc gia 24/7 dành riêng cho sức khỏe tâm thần người lớn hay phòng chống tự sát. Ngoài giờ làm việc của các đường dây trên, nếu có nguy cơ tự làm hại, hãy gọi 115 hoặc đến khoa cấp cứu."
    moi: "Tính đến tháng 10/2026, chúng tôi chưa tìm thấy đường dây quốc gia 24/7 dành riêng cho sức khỏe tâm thần người lớn hay phòng chống tự sát ở Việt Nam. Ngoài giờ làm việc của các đường dây trên, nếu có nguy cơ tự làm hại, hãy gọi 115 hoặc đến khoa cấp cứu."
    ly_do: "Làm mềm khẳng định phủ định về mức điều đã tìm; mốc thời gian đặt đầu câu (n25)."
  - cu: "Các số dưới đây là tổng đài của bệnh viện, dùng để hỏi thông tin và đặt lịch khám. Đây không phải đường dây khủng hoảng."
    moi: "Các số dưới đây là số tổng đài hay số điện thoại chung mà bệnh viện công bố trên trang web của mình. Đây không phải đường dây khủng hoảng."
    ly_do: "Trang bệnh viện không nói số ấy dùng để đặt lịch (n28)."
  - cu: ["Viện Sức khỏe Tâm thần, Bệnh viện Bạch Mai (Hà Nội) 024 3576 5344", "Bệnh viện Tâm thần Trung ương 2 (Biên Hòa, Đồng Nai) 0251 3822 965", "Bệnh viện Tâm thần TP.HCM 028 9234 675"]
    moi: ["Bệnh viện Tâm thần Trung ương 2 (Đồng Nai) 0251 3822 965", "Bệnh viện Tâm thần TP.HCM 028 3923 4675"]
