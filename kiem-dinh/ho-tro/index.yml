    trich: null
    ket_qua: null
    ghi_chu: "chưa chắc: Healthdirect (Úc) nói tham vấn viên không thuộc cơ quan quản lý quốc gia và mỗi người được đào tạo theo một hay nhiều cách tiếp cận, nhưng đó là Úc. Ở Việt Nam, chức danh này không có trong Điều 26 Luật KBCB nên luật y tế không đặt chuẩn đào tạo; chưa tìm được văn bản nào nói trực tiếp. Chủ repo quyết giữ, viết lại (\"Luật chưa quy định chuẩn đào tạo chung\") hay bỏ."
  - id: n47
    cau: "Nhân viên công tác xã hội: đào tạo công tác xã hội, hoặc ngành gần như xã hội học, tâm lý học."
    loai: dinh-nghia
    nguon: [nd110-2024]
    trich: "Đã tốt nghiệp trung cấp, cao đẳng, đại học, sau đại học chuyên ngành công tác xã hội"
    vi_tri: "điều kiện hành nghề, điều kiện 1 (các ngành khác được chấp nhận: xã hội học, tâm lý học, giáo dục đặc biệt…)"
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Công tác xã hội\"; chữ mới thêm \"hoặc ngành gần như xã hội học, tâm lý học\", vì Nghị định 110/2024 nhận cả các ngành này."
  - id: n48
    cau: "Bác sĩ chuyên khoa tâm thần: giấy phép hành nghề bác sĩ."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [luat-kbcb-2023]
    trich: "Chức danh chuyên môn phải có giấy phép hành nghề bao gồm: … Bác sỹ"
    vi_tri: "Điều 26 k1"
    ket_qua: dung
  - id: n49
    cau: "Tâm lý lâm sàng là chức danh phải có giấy phép hành nghề theo Luật Khám bệnh, chữa bệnh 2023 (có hiệu lực từ 01/01/2024)."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [luat-kbcb-2023]
    trich: "Chức danh chuyên môn phải có giấy phép hành nghề bao gồm: … Tâm lý lâm sàng"
    vi_tri: "Điều 26 k1; ngày hiệu lực 01/01/2024"
    ket_qua: dung
    ghi_chu: "Điều 121 k8: người đề nghị cấp giấy phép chức danh tâm lý lâm sàng từ 01/01/2024 đến hết 31/12/2028 không phải kiểm tra đánh giá năng lực; Điều 120 k3: kiểm tra đánh giá năng lực áp dụng từ 01/01/2029. Trang không nói chi tiết này; câu trên trang vẫn đúng."
  - id: n50
    cau: "Tham vấn viên / chuyên viên tư vấn tâm lý không nằm trong các chức danh phải có giấy phép hành nghề của Luật Khám bệnh, chữa bệnh 2023."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [luat-kbcb-2023]
    trich: "Chức danh chuyên môn phải có giấy phép hành nghề bao gồm: Bác sỹ; Y sỹ; Điều dưỡng; Hộ sinh; Kỹ thuật y; Dinh dưỡng lâm sàng; Cấp cứu viên ngoại viện; Tâm lý lâm sàng; Lương y; Người có bài thuốc gia truyền…"
    vi_tri: "Điều 26 k1 (danh sách đủ); k2: Chính phủ có thể bổ sung chức danh"
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"Hiện chưa có giấy phép hành nghề quốc gia riêng\". Chữ mới chỉ nói điều đã kiểm (không có trong danh sách Điều 26); câu cũ là khẳng định phủ định rộng hơn (mọi loại giấy phép quốc gia), chưa kiểm hết được. Điều 26 k2 cho Chính phủ bổ sung chức danh: kiểm lại mỗi quý."
  - id: n51
    cau: "Nhân viên công tác xã hội: giấy chứng nhận đăng ký hành nghề công tác xã hội theo Nghị định 110/2024/NĐ-CP."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [nd110-2024]
    trich: "Có giấy chứng nhận đăng ký hành nghề công tác xã hội do cơ quan nhà nước có thẩm quyền cấp còn hiệu lực."
    vi_tri: "điều kiện hành nghề, điều kiện 4; \"Nghị định số 110/2024/NĐ-CP có hiệu lực từ ngày 15/10/2024\""
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Đăng ký hành nghề theo Nghị định 110/2024/NĐ-CP\"; chữ mới gọi đúng tên giấy tờ trong nghị định. Ý không đổi."
  - id: n52
    cau: "Bác sĩ chuyên khoa tâm thần được kê đơn thuốc."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [tt26-2025-byt]
    trich: "bác sỹ, y sỹ"
    vi_tri: "Điều 2 (thẩm quyền kê đơn: người hành nghề có giấy phép với chức danh bác sỹ, y sỹ); hiệu lực 01/07/2025 (Điều 13)"
    ket_qua: dung
  - id: n53
    cau: "Nhà tâm lý lâm sàng không kê đơn thuốc (theo quy định về kê đơn, người kê đơn là bác sĩ, y sĩ)."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [tt26-2025-byt, healthdirect-psych]
    trich: "bác sỹ, y sỹ"
    vi_tri: "TT 26/2025, Điều 2; Healthdirect: \"A psychologist is not a medical doctor and can't prescribe medicines.\""
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Không (kê đơn là phạm vi của bác sĩ)\"; chữ mới: \"Không (theo quy định về kê đơn, người kê đơn là bác sĩ, y sĩ)\": TT 26/2025 cho cả y sĩ kê đơn. Chỉ xem thông tư về thuốc hóa dược, sinh phẩm; TT 55/2025 (thuốc cổ truyền) chưa xem."
  - id: n54
    cau: "Tham vấn viên và nhân viên công tác xã hội không kê đơn thuốc."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [tt26-2025-byt]
    trich: "bác sỹ, y sỹ"
    vi_tri: "Điều 2: chỉ hai chức danh này có thẩm quyền kê đơn"
    ket_qua: dung
  - id: n55
    cau: "Bác sĩ chuyên khoa tâm thần thường chẩn đoán, điều trị bằng thuốc và các phương pháp khác, chỉ định nhập viện khi cần."
    loai: dinh-nghia
    nguon: [healthdirect-psych]
    trich: "use a combination of treatments, including counselling, psychotherapy and medicines"
    vi_tri: "đoạn Psychiatrists (chẩn đoán, điều trị rối loạn; có thể sắp xếp nhập viện khi cần)"
    ket_qua: dung
    ghi_chu: "Nguồn của Úc, mô tả vai trò chung; phạm vi hành nghề ở Việt Nam (Thông tư 32/2023/TT-BYT) chưa mở được."
  - id: n56
    cau: "Nhà tâm lý lâm sàng thường đánh giá tâm lý, trị liệu tâm lý."
    loai: dinh-nghia
    nguon: [nhs-careers-cp, healthdirect-psych]
    trich: "deliver psychological therapy but also train practitioners and other supervising staff"
    vi_tri: "NHS Health Careers: đánh giá bằng \"direct observation, interviews and techniques such as psychometric testing\"; Healthdirect: psychologists \"focus on providing psychotherapy (talk therapy)\""
    ket_qua: dung
    ghi_chu: "chỗ khó: nguồn của Anh và Úc; phạm vi hành nghề của chức danh tâm lý lâm sàng ở Việt Nam (Thông tư 32/2023/TT-BYT) chưa mở được. Lượt 2 nên tìm phụ lục phạm vi hành nghề."
  - id: n57
    cau: "Tham vấn viên / chuyên viên tư vấn tâm lý thường lắng nghe, hỗ trợ, tư vấn."
    loai: dinh-nghia
    nguon: [healthdirect-counsellors]
    trich: "ask questions and listen to you in a way that is: non-judgemental, safe, and confidential"
    vi_tri: "mục What do counsellors do; \"provide advice on the difficulties you are facing\""
    ket_qua: dung
  - id: n58
    cau: "Nhân viên công tác xã hội thường kết nối dịch vụ, hỗ trợ và bảo vệ người yếu thế."
    loai: dinh-nghia
    nguon: [healthdirect-sw]
    trich: "Social workers can provide counselling, information and referrals to other services."
    vi_tri: "đầu trang; \"advocacy and support for disadvantaged people\""
    ket_qua: dung
  - id: n59
    cau: "Theo Nghị định 96/2023/NĐ-CP, để được cấp giấy phép, nhà tâm lý lâm sàng phải có 9 tháng thực hành khám bệnh, chữa bệnh."
    loai: thoi-su
    het_han: 2027-01-30
    nguon: [nd96-2023]
    trich: "Thời gian thực hành khám bệnh, chữa bệnh đối với tâm lý lâm sàng là 09 tháng."
    vi_tri: "Nghị định 96/2023, Điều 3 k6 (Hệ thống pháp luật ghi khoản 6; cổng Cần Thơ ghi Điều 3)"
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"…phải có 9 tháng thực hành có người hướng dẫn tại cơ sở phù hợp\". Chữ mới: \"…9 tháng thực hành khám bệnh, chữa bệnh\": Điều 3 chỉ nói thời gian; điều kiện về cơ sở hướng dẫn ở Điều 5–6 chưa mở. Chỗ khó: Bộ Y tế có dự thảo sửa Nghị định 96/2023 (2025); chưa xác nhận đã ban hành hay đổi thời gian này: kiểm lại mỗi quý."
  # Gợi ý khi chọn nơi hỗ trợ
  - id: n60
    cau: "Hỏi về đào tạo, giấy phép hoặc chứng chỉ hành nghề."
    loai: loi-khuyen
    nguon: [healthdirect-mhp, healthdirect-counsellors]
    trich: "What qualifications do they have?"
    vi_tri: "Healthdirect, mục chọn chuyên gia; Counsellors: \"check that any counsellor you plan to see is a member of a professional body\""
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"…, và người giám sát chuyên môn (nếu có).\" Bỏ phần người giám sát: không nguồn nào đã mở khuyên hỏi điều này."
  - id: n61
    cau: "Hỏi về chi phí, thời lượng mỗi buổi và cách họ bảo mật thông tin của bạn."
    loai: loi-khuyen
    nguon: [healthdirect-mhp]
    trich: "If you are concerned about confidentiality, ask your mental health professional at the start of your appointment."
    vi_tri: "mục bảo mật; câu hỏi gợi ý \"How much will treatment cost?\", \"What can I expect from our appointments?\""
    ket_qua: dung
  - id: n62
    cau: "Thận trọng với nơi hứa \"chữa khỏi\" nhanh chóng, cam kết kết quả, hoặc chỉ dựa vào một bài trắc nghiệm."
    loai: loi-khuyen
    trich: null
    ket_qua: null
    ghi_chu: "chưa chắc: chưa tìm được nguồn chính thức (trang APA \"How to choose a psychologist\" chặn máy đọc; NHS, Healthdirect không nói). Lời khuyên hợp lý và ít rủi ro; chủ repo quyết giữ (lượt 2 tìm nguồn, ví dụ quy định cấm quảng cáo sai sự thật về khám chữa bệnh) hay bỏ."
  - id: n63
    cau: "Nếu bạn không thấy hợp với một người, việc tìm người khác là bình thường."
    loai: loi-khuyen
    nguon: [healthdirect-mhp]
    trich: "You may have to meet a few mental health professionals before you find the right person for you."
    vi_tri: "mục chọn chuyên gia; \"Don't be put off if the first person you try doesn't work out.\""
    ket_qua: dung
  # Khi người thân đang gặp khó khăn
  - id: n64
    cau: "Lắng nghe trước, khuyên sau. Cho họ biết bạn sẵn sàng nghe."
    loai: loi-khuyen
    nguon: [who-suicide-friend, paho-living-depression]
    trich: "Let them know that you are there to listen."
    vi_tri: "WHO 2021, mục What you can do; WHO/PAHO: \"listen without judgement, and offer support\""
    ket_qua: da-sua
    ghi_chu: "Chữ cũ câu sau: \"Thường người ta cần được nghe hơn là cần lời giải.\" Chữ mới: \"Cho họ biết bạn sẵn sàng nghe.\" (theo WHO): câu cũ là khẳng định chung không nguồn nào đã mở nói."
  - id: n65
    cau: "Tránh phán xét (\"Có gì đâu mà buồn\", \"Cố lên là được\")."
    loai: loi-khuyen
    nguon: [paho-living-depression]
    trich: "Make it clear that you want to help, listen without judgement, and offer support."
    vi_tri: "mục What you can do"
    ket_qua: dung
    ghi_chu: "Hai câu trong ngoặc là ví dụ minh họa (gia-dinh)."
  - id: n66
    cau: "Một tổng quan các nghiên cứu cho thấy việc hỏi về ý nghĩ tự sát không làm tăng ý nghĩ đó (Dazzi và cộng sự, 2014)."
    loai: phat-hien
    nguon: [dazzi2014, who-suicide-friend]
    trich: "None found a statistically significant increase in suicidal ideation among participants asked about suicidal thoughts."
    vi_tri: "Dazzi 2014, tóm tắt (Europe PMC, PMID 24998511); WHO 2021: \"Asking someone if they are thinking about suicide does not make them act on their feelings.\""
    ket_qua: dung
    ghi_chu: "Bài là tổng quan tài liệu (review), không phải phân tích tổng hợp; \"tổng quan các nghiên cứu\" đúng mức. Chỉ đọc tóm tắt."
  - id: n67
    cau: "Hỏi thẳng nếu bạn lo họ có ý nghĩ tự làm hại."
    loai: loi-khuyen
    nguon: [who-suicide-friend]
    trich: "If you know someone who may be considering suicide, talk to them about it."
    vi_tri: "WHO 2021, khung REMEMBER; \"It’s OK to talk about suicide.\""
    ket_qua: dung
  - id: n68
    cau: "Khuyến khích và giúp họ tìm chuyên gia: cùng tìm thông tin, đặt lịch, đi cùng."
    loai: loi-khuyen
    nguon: [who-suicide-friend, paho-living-depression]
    trich: "Encourage them to seek help from a health worker, such as a doctor or mental health professional, or a counsellor or social worker. And offer to accompany them to an appointment."
    vi_tri: "WHO 2021, mục What you can do"
    ket_qua: dung
  - id: n69
    cau: "Nếu có nguy hiểm ngay, gọi 115 và ở bên họ."
    loai: loi-khuyen
    nguon: [who-suicide-friend]
    trich: "If you think someone is in immediate danger, don’t leave them alone. Contact the emergency services"
    vi_tri: "mục What you can do"
    ket_qua: dung
  - id: n70
    cau: "Chăm sóc chính bạn. Hỗ trợ người khác rất tốn sức; bạn cũng xứng đáng được giúp."
    loai: loi-khuyen
    nguon: [paho-living-depression]
    trich: "Take care of yourself too. Try to find ways to relax and continue doing things you enjoy."
    vi_tri: "mục What you can do; khung REMEMBER: \"it’s important to look after yourself too\""
    ket_qua: dung
  # Thông tin trên trang
  - id: n71
    cau: "Kiểm tra lần cuối: 30/10/2026. Hạn kiểm tra lại: 30/01/2027."
    loai: ve-site
    ket_qua: da-sua
    review: null
    ghi_chu: "Kiểm trên hồ sơ này (lan[0].ngay, het_han của các câu thời sự). Chữ cũ: \"Kiểm tra lần cuối: 13/10/2026.\" Chữ mới: ngày kiểm của lượt 1 và hạn kiểm lại (lời giao D2-L1). Review nên đổi ngày nếu lượt 2 kiểm lại số ở ngày khác. Dòng trạng thái kiểm định do PageTitle sinh từ hồ sơ có thể lặp ý: review xem có cần giữ câu này không."
  - id: n72
    cau: "Các số điện thoại được đối chiếu với trang web chính thức của từng tổ chức; số miễn phí của 113, 114, 115 được đối chiếu với văn bản pháp luật."
    loai: ve-site
    ket_qua: da-sua
    review: null
    ghi_chu: "Kiểm trên hồ sơ này (n2–n33). Chữ cũ: \"…đối chiếu với trang web chính thức của từng tổ chức và ít nhất một nguồn độc lập, trừ khi có ghi chú khác.\" Lượt 1 không đối chiếu nguồn độc lập cho từng số (chỉ trang chính thức, theo chuẩn), nên bỏ vế ấy. Bệnh viện TW1 đối chiếu bản lưu của trang chính thức: đã ghi ở mục nguồn trên trang."
  - id: n73
    cau: "Danh sách được kiểm tra lại bằng tay mỗi quý."
    loai: ve-site
    ket_qua: dung
    review: null
    ghi_chu: "Review kiểm: workflow nhắc mỗi quý (ho-tro-quarterly.yml của site cũ) đã chép sang repo mới chưa (việc của D2-L1, ngoài phần lượt 1 này). Chưa chép thì câu chưa đúng."
  - id: n74
    cau: "Nếu bạn thấy thông tin nào đã thay đổi, xin hãy báo cho chúng tôi."
    loai: ve-site
    ket_qua: dung
    review: null
    ghi_chu: "Câu mời, giữ như trang cũ. Trang không chỉ cách báo (không có link hay địa chỉ): review hay chủ repo quyết thêm đường báo (ví dụ GitHub Issues) hay giữ."
  - id: n75
    cau: "Mục \"Nguồn đã dùng để kiểm chứng\" liệt kê đúng các nguồn đã mở ở hồ sơ này."
    loai: ve-site
    ket_qua: da-sua
    review: null
    ghi_chu: "Đối chiếu với danh sách nguon của hồ sơ. Đổi so với trang cũ: bỏ Báo Lào Cai, Tuổi Trẻ (12/10/2025, không nói 24/7 hay miễn phí), Thư viện pháp luật (trả 403), Tuổi Trẻ/PLO (111), Vietnam News (Ngày Mai), Find A Helpline (CSAGA), trang Bạch Mai, và số 112 (trang không nói 112). Thêm Luật Viễn thông 2023, TT 22/2014, QĐ 01/2008, TT 26/2025, cổng pháp luật Cần Thơ, WHO, SAMHSA, NIMH, Healthdirect, NHS Health Careers. Sửa tên báo cáo 111: trang cũ ghi \"Báo cáo số 14/BC-BMTE ngày 20/01/2026\", bản PDF đăng trên tongdai111.vn để trống số và ngày (\"Số: /BC-BMTE\", \"ngày tháng 01 năm 2026\"), nên ghi \"tháng 01/2026\". Bỏ câu \"Số của Bệnh viện Tâm thần Trung ương 2 mới chỉ đối chiếu được với trang chính thức\" (nay mọi số đều chỉ đối chiếu trang chính thức)."
doi_chu:
  # Ghi tay theo chữ hiển thị (chưa build được: agent khác đang build). Sau build:xem, chạy
  # node tools/chuyen/so-chu.mjs ho-tro/index --doi-chu để khớp đúng chuỗi khối và bổ sung chỗ còn thiếu.
  - cu: "Dưới đây chỉ gồm những số mà chúng tôi kiểm chứng được từ nguồn chính thức. Psyche Zero không gọi thử các số này và không thể cam kết thay các tổ chức về giờ làm việc, chi phí hay cách họ bảo mật thông tin. Hãy hỏi trực tiếp khi gọi."
    moi: "Dưới đây chỉ gồm những số mà chúng tôi kiểm chứng được từ nguồn chính thức, tính đến tháng 10/2026. Psyche không gọi thử các số này và không thể cam kết thay các tổ chức về giờ làm việc, chi phí hay cách họ bảo mật thông tin. Hãy hỏi trực tiếp khi gọi."
    ly_do: "Thêm mốc thời gian cho khẳng định thời sự; tên site mới (n7, n8)."
  - cu: "Công an 113 Nguy cơ bạo lực, cần can thiệp khẩn cấp 24/7, miễn phí"
