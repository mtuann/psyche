    luot_2: dung
    luot_2_nguon: [ "https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/26-vbhn-vpqh.pdf", "https://www.nami.org/about-mental-illness/treatments/types-of-mental-health-professionals/" ]
    luot_2_ghi_chu: Mở 30/10/2026. Văn bản hợp nhất 26/VBHN-VPQH (2026) của Luật 15/2023/QH15.
