  # Khi nào nên tìm chuyên gia
  - id: n36
    cau: "Buồn, lo lắng, căng thẳng là một phần bình thường của cuộc sống. Chúng không tự động là dấu hiệu của rối loạn."
    loai: lam-sang
    nguon: [ who-depression ]
    trich: "is different from regular mood changes and feelings about everyday life"
    vi_tri: "mục Overview"
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/low-mood-sadness-depression/", "https://www.nhs.uk/mental-health/advice-for-life-situations-and-events/how-to-help-someone-with-depression/" ]
    luot_2_ghi_chu: Mở 30/10/2026.
  - id: n37
    cau: "Nên cân nhắc tìm chuyên gia khi cảm giác buồn bã, trống rỗng, lo âu hay căng thẳng kéo dài từ hai tuần trở lên và không dịu đi."
    loai: loi-khuyen
    nguon: [ samhsa-signs, nimh-help, who-depression ]
    trich: "two or more weeks with changes to your thoughts, moods, or body that make it hard to manage work, school, home, or relationships"
    vi_tri: "SAMHSA, đầu danh sách dấu hiệu; NIMH: \"Have you had severe symptoms for 2 weeks or more?\"; WHO: \"for at least two weeks\""
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"kéo dài nhiều tuần\"; chữ mới: \"kéo dài từ hai tuần trở lên\", theo mốc mà SAMHSA, NIMH và WHO cùng dùng. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. SAMHSA \"two or more weeks\", NIMH \"2 weeks or more\", WHO \"at least two weeks\" (hai lượt); chữ cuối \"từ hai tuần trở lên\"."
    luot_2: dung
    luot_2_nguon: [ "https://www.nimh.nih.gov/health/publications/my-mental-health-do-i-need-help", "https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/low-mood-sadness-depression/" ]
    luot_2_ghi_chu: Mở 30/10/2026. NIMH áp dụng cho cảm giác "sad, stressed, or worried".
    review: dung
  - id: n38
    cau: "Nên cân nhắc tìm chuyên gia khi nó ảnh hưởng rõ đến việc học, công việc, giấc ngủ, ăn uống hay các mối quan hệ."
    loai: loi-khuyen
    nguon: [ samhsa-signs ]
    trich: "make it hard to manage work, school, home, or relationships … Changes in how you sleep … Changes in your eating"
    vi_tri: "danh sách dấu hiệu, mục thời gian và mục Body changes"
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.nimh.nih.gov/health/publications/my-mental-health-do-i-need-help", "https://www.nhs.uk/mental-health/advice-for-life-situations-and-events/how-to-help-someone-with-depression/" ]
    luot_2_ghi_chu: Mở 30/10/2026.
  - id: n39
    cau: "Nên cân nhắc tìm chuyên gia khi bạn dùng rượu hay chất kích thích ngày càng nhiều."
    loai: loi-khuyen
    nguon: [ samhsa-signs ]
    trich: "Needing to use drugs or alcohol more and more often to keep from getting sick"
    vi_tri: "mục Body changes; mục Thoughts: \"Focusing only on getting and using alcohol or drugs\""
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"bạn dùng rượu, chất kích thích hay các hành vi khác để chịu đựng\". Chữ mới: \"bạn dùng rượu hay chất kích thích ngày càng nhiều\": bỏ \"các hành vi khác\" (quá rộng, không nguồn nào nêu) và \"để chịu đựng\" (SAMHSA nói dùng ngày càng nhiều, không nói lý do). Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. SAMHSA \"Needing to use drugs or alcohol more and more often\"; chữ cuối bỏ \"hành vi khác\", \"để chịu đựng\"."
    luot_2: dung
    luot_2_nguon: [ "https://www.nimh.nih.gov/health/publications/warning-signs-of-suicide", "https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/low-mood-sadness-depression/" ]
    luot_2_ghi_chu: Mở 30/10/2026.
    review: dung
  - id: n40
    cau: "Nên cân nhắc tìm chuyên gia khi người thân nói rằng bạn thay đổi nhiều."
    loai: loi-khuyen
    ket_qua: da-bo
    ghi_chu: "Chữ cũ: \"người thân nói rằng bạn thay đổi nhiều;\" (một dòng danh sách). Bỏ: SAMHSA, NIMH, WHO không nêu dấu hiệu này; danh sách còn lại đã có các dấu hiệu có nguồn. Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. Dòng đã bỏ khỏi danh sách (kiểm trên trang); không nguồn nào nêu."
    luot_2: dung
    luot_2_nguon: [ "https://www.nhs.uk/mental-health/advice-for-life-situations-and-events/how-to-help-someone-with-depression/" ]
    luot_2_ghi_chu: Mở 30/10/2026.
    review: dung
  - id: n41
    cau: "Khi có ý nghĩ tự làm hại bản thân hoặc nghĩ rằng mọi người sẽ tốt hơn nếu không có mình, hãy tìm giúp đỡ ngay, không cần chờ."
    loai: loi-khuyen
    nguon: [ nimh-help, who-suicide-friend ]
    trich: "If you are having thoughts of suicide or urges to hurt yourself, get immediate help."
    vi_tri: "NIMH; WHO 2021 liệt kê \"No-one will miss me when I’m gone\" là dấu hiệu cảnh báo"
    ket_qua: dung
    ghi_chu: "Đưa tin an toàn: câu không mô tả cách thức, đi kèm số 115 và khoa cấp cứu ở đầu trang."
    luot_2: dung
    luot_2_nguon: [ "https://www.nimh.nih.gov/health/publications/my-mental-health-do-i-need-help", "https://www.nimh.nih.gov/health/publications/warning-signs-of-suicide" ]
    luot_2_ghi_chu: Mở 30/10/2026.
  - id: n42
    cau: "Psyche không có và sẽ không có công cụ tự chẩn đoán."
    loai: ve-site
    ket_qua: da-sua
    review: dung
    ghi_chu: "Kiểm ở AGENTS.md (Quy tắc nội dung: \"Không có công cụ tự chẩn đoán\") và danh sách công cụ CONG_CU trong src/plugins/thanh-phan.mjs (review xác nhận). Chữ cũ \"Psyche Zero\", chữ mới \"Psyche\". Review (Claude Opus 5.5 (agent review D2-L1, 30/10/2026)): dung. CONG_CU trong src/plugins/thanh-phan.mjs chỉ có stroop; trai-nghiem/ trong trang.yml (stroop, do-dai-tri-nho, ao-giac-thi-giac, mu-thay-doi, tri-nho-sai, wason-246, linda, big-five-mini, neo-gia, ebbinghaus, tri-nho-tu) không có công cụ chẩn đoán; AGENTS.md cấm."
  - id: n43
    cau: "Chỉ người có chuyên môn mới chẩn đoán được."
    loai: lam-sang
    nguon: [ healthdirect-psych, luat-kbcb-2023 ]
    trich: "Psychiatrists are medical doctors who have completed specialised training"
    vi_tri: "Healthdirect: bác sĩ tâm thần chẩn đoán và điều trị rối loạn tâm thần; Luật KBCB 2023, Điều 26: khám, chữa bệnh do người có giấy phép hành nghề theo chức danh"
