ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Đây là "hiệu ứng giãn cách", một trong những phát hiện vững nhất của tâm lý học. Phân tích tổng hợp năm 2006 gộp hơn 300 thí nghiệm cho thấy ôn cách quãng cho kết quả nhớ lâu tốt hơn học dồn với cùng tổng thời gian. Khoảng cách tốt nhất dài hơn khi bạn cần nhớ lâu hơn.'' → mới ''Đây là "hiệu ứng giãn cách". Phân tích tổng hợp năm 2006 gộp 317 thí nghiệm cho thấy học ngắt quãng giúp nhớ lâu hơn học dồn. Khoảng cách tốt nhất giữa các lần ôn dài hơn khi bạn cần nhớ lâu hơn.'' | trang: cũ ''kham-pha/tri-nho/vi-sao-ta-quen'' → mới ''kham-pha/tri-nho/duong-cong-quen'''
