ghi_chu: 'chỗ khó: sửa khẳng định "giúp ngủ ngon và sâu" thành "giúp ngủ ngon suốt đêm": tổng quan 2013 thấy giấc ngủ sóng chậm (ngủ sâu) TĂNG ở nửa đầu đêm, nên câu cũ "Ngủ sau khi uống rượu là giấc ngủ nông và đứt quãng, không phải ngủ sâu" sai. Nguồn là tổng quan định tính (không phải phân tích tổng hợp). Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). khang_dinh: cũ ''Uống chút rượu trước khi ngủ giúp ngủ ngon và sâu.'' → mới ''Uống chút rượu trước khi ngủ giúp ngủ ngon suốt đêm.'' | giai_thich: cũ ''Rượu đúng là giúp thiếp đi nhanh hơn, nhưng tổng quan nghiên cứu năm 2013 cho thấy nó phá vỡ cấu trúc giấc ngủ: đè nén giấc ngủ REM, khiến nửa sau của đêm chập chờn và hay tỉnh giấc. Ngủ sau khi uống rượu là giấc ngủ “nông và đứt quãng”, không phải ngủ sâu.'' → mới ''Tổng quan các nghiên cứu trên người khỏe mạnh (2013) cho thấy ở mọi liều, rượu giúp thiếp đi nhanh hơn và nửa đầu đêm ngủ liền hơn, nhưng nửa sau của đêm bị gián đoạn nhiều hơn. Giấc ngủ REM đầu tiên đến muộn hơn ở mọi liều, và ở liều vừa và cao, tổng thời gian ngủ REM giảm.'''
