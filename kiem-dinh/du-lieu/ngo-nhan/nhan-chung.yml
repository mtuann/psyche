ghi_chu: 'Câu cũ "khoảng 7 trên 10 vụ án được minh oan bằng ADN theo Innocence Project" không còn trên trang của tổ chức (17/11/2026: "More than 60% of our clients were wrongfully convicted based on eyewitness misidentification"); viết lại kèm mốc thời gian. Bỏ nguồn nhan-chung-innocence (tin về các vụ ở Missouri, không cần). Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Nhận dạng nhầm là nguyên nhân hàng đầu gây án oan ở Mỹ: nó xuất hiện trong khoảng 7 trên 10 vụ án được minh oan bằng ADN theo Innocence Project. Trí nhớ không ghi hình nguyên vẹn mà dựng lại mỗi lần nhớ, nên nhân chứng có thể rất thành thật, rất chắc chắn mà vẫn chỉ nhầm người.'' → mới ''Tính đến 11/2026, tổ chức Innocence Project (Mỹ) cho biết hơn 60% thân chủ của họ đã bị kết án oan dựa trên nhận dạng nhầm của nhân chứng. Trí nhớ không ghi hình nguyên vẹn mà được dựng lại, và có thể bị thông tin sau sự kiện làm sai lệch; cảm giác nhớ rõ và chắc chắn có thể đi kèm cả ký ức sai.'' | nguon: cũ [''nhan-chung-ip'', ''nhan-chung-innocence''] → mới [''nhan-chung-ip'', ''loftus2005'']'
