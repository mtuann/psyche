ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Phân tích tổng hợp 24 nghiên cứu theo dõi theo thời gian với hơn 17.000 trẻ em (2018) thấy chơi game bạo lực liên quan đến hành vi hung hăng sau đó, nhưng mức độ rất nhỏ (β ≈ 0,08–0,11). Một nhóm nhà nghiên cứu khác cho rằng mối liên hệ này bị thổi phồng và không có ý nghĩa thực tế. Bằng chứng hiện tại: có tín hiệu nhỏ, chưa đủ để kết luận game “gây” bạo lực.'' → mới ''Phân tích tổng hợp 24 nghiên cứu theo dõi theo thời gian với hơn 17.000 trẻ em và thiếu niên (2018) thấy chơi game bạo lực đi cùng hành vi gây hấn về sau, nhưng ở mức nhỏ (β ≈ 0,08–0,11). Các nhà nghiên cứu khác, như Ferguson và Kilburn (2010), cho rằng những hiệu ứng như vậy bị ước lượng quá cao và quá yếu để có ý nghĩa thực tế. Bằng chứng hiện tại: có tín hiệu nhỏ, chưa đủ để kết luận game "gây" bạo lực.'' | nguon: cũ [''prescott2018''] → mới [''prescott2018'', ''ferguson2010''] | trang: cũ None → mới ''thi-nghiem/bandura'''
