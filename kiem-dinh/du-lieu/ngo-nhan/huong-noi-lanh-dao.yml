ghi_chu: 'Bỏ link tới kham-pha/tinh-cach/big-five (trang ấy không bàn về lãnh đạo). Câu cũ "hướng ngoại dự báo tốt ai NỔI LÊN, nhưng dự báo kém hơn nhiều về ai lãnh đạo HIỆU QUẢ" mạnh hơn tóm tắt (tóm tắt: hướng ngoại là tương quan nhất quán nhất ở cả hai tiêu chí). Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Phân tích tổng hợp (Judge và cộng sự, 2002) thấy hướng ngoại dự báo tốt ai sẽ NỔI LÊN làm lãnh đạo, nhưng dự báo kém hơn nhiều về ai lãnh đạo HIỆU QUẢ. Hướng nội hay hướng ngoại chỉ là một mảnh ghép; tận tâm và ổn định cảm xúc cũng quan trọng không kém.'' → mới ''Phân tích tổng hợp 73 mẫu (Judge và cộng sự, 2002) thấy hướng ngoại là đặc điểm đi cùng khả năng lãnh đạo nhất quán nhất, nhưng tương quan chỉ ở mức vừa (r = .31); tận tâm (.28), cởi mở (.24) và ổn định cảm xúc cũng liên quan. Tương quan ở mức vừa nghĩa là có nhiều ngoại lệ: không đặc điểm nào quyết định ai lãnh đạo giỏi.'' | trang: cũ ''kham-pha/tinh-cach/big-five'' → mới None'
