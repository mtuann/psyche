    trich: meta-analyzed 222 correlations from 73 samples. Overall, the correlations with leadership were Neuroticism = -.24, Extraversion = .31, Openness to Experience = .24, Agreeableness = .08, and Conscientiousness = .28 ... Extraversion was the most consistent correlate of leadership across study settings and leadership criteria (leader emergence and leadership effectiveness).
