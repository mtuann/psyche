ghi_chu: 'chỗ khó: nhãn Đã bị bác bỏ dựa trên một phân tích tổng hợp lớn ủng hộ chiều ngược lại; chưa mở nghiên cứu nào kiểm tra trực tiếp "bổ sung tính cách" (như Klohnen & Luo 2003). Câu cũ "Chưa có bằng chứng nhất quán rằng tính cách trái ngược làm người ta hấp dẫn nhau hơn" chưa có nguồn mở được, viết lại theo Montoya 2008. Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Phân tích tổng hợp 313 nghiên cứu cho thấy sự giống nhau, cả thực tế lẫn cảm nhận, liên quan khá mạnh đến sức hút giữa hai người. Chưa có bằng chứng nhất quán rằng tính cách trái ngược làm người ta hấp dẫn nhau hơn.'' → mới ''Phân tích tổng hợp 313 nghiên cứu cho thấy sự giống nhau, cả thực tế lẫn cảm nhận, đi cùng sức hút rõ rệt giữa hai người; ở những cặp đã quen nhau lâu, chỉ sự giống nhau theo cảm nhận còn liên quan. Bằng chứng nghiêng về "giống nhau thì hút nhau", không ủng hộ "khác nhau thì hút nhau".'''
