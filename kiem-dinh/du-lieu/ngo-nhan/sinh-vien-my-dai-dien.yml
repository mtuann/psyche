ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Ước tính khoảng 96% mẫu nghiên cứu tâm lý đến từ các nước phương Tây công nghiệp hóa — chỉ khoảng 12% dân số thế giới — và 68% từ Mỹ. Ở nhiều lĩnh vực, kết quả trên mẫu WEIRD này là ngoại lệ chứ không phải chuẩn mực của loài người (Henrich và cộng sự, 2010).'' → mới ''Theo một phân tích các tạp chí tâm lý học hàng đầu giai đoạn 2003–2007 (Arnett, 2008, do Henrich và cộng sự dẫn), 96% người tham gia đến từ các nước phương Tây công nghiệp hóa, vốn chỉ chiếm khoảng 12% dân số thế giới, và 68% từ Mỹ. Tổng quan dữ liệu so sánh giữa các nền văn hóa của Henrich và cộng sự (2010) thấy người ở các xã hội "WEIRD" thường là ngoại lệ, không đại diện tốt cho loài người.'''
