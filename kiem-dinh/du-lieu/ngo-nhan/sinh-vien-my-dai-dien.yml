    trich: 'Trang nhà bang-chung/mau-va-chon-mau (đã khóa): "Henrich, Heine và Norenzayan dẫn một phân tích của Arnett (2008) ... 68% người tham gia đến từ Mỹ, và 96% đến từ các nước phương Tây công nghiệp hóa ... chỉ chiếm khoảng 12% dân số thế giới."'
    ket_qua: da-sua
    ghi_chu: 'Cũ "Ước tính khoảng 96% mẫu nghiên cứu tâm lý": ghi rõ phạm vi (tạp chí hàng đầu 2003–2007) và nguồn gốc con số (Arnett 2008).'
