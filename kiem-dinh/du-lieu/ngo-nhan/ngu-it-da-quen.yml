ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Thí nghiệm 14 ngày cho thấy nhóm ngủ 4–6 tiếng/đêm suy giảm nhận thức tích lũy dần, tương đương thức trắng 1–2 đêm — trong khi cảm giác buồn ngủ tự báo cáo gần như không tăng thêm. “Quen” chỉ là cảm giác; não thì không quen được.'' → mới ''Trong thí nghiệm 14 ngày, người chỉ được nằm giường 4 hoặc 6 tiếng mỗi đêm suy giảm nhận thức tích lũy dần, tới mức tương đương thức trắng tới 2 đêm, trong khi cảm giác buồn ngủ tự báo cáo chỉ tăng thêm chút ít sau mấy ngày đầu. "Quen" chỉ là cảm giác: người tham gia gần như không nhận ra mình đang suy giảm.'''
