  ly_do: Thí nghiệm ngẫu nhiên liều–đáp ứng có kiểm soát chặt (48 người).
  ket_qua: dung
  ghi_chu: 'chỗ khó: cơ sở chính là một thí nghiệm (48 người), chưa có phân tích tổng hợp trong hồ sơ.'
- id: g1
  cau: 'Van Dongen 2003: nằm giường 4 hay 6 tiếng mỗi đêm trong 14 ngày gây suy giảm nhận thức tích lũy, tương đương tới 2 đêm thức trắng.'
  loai: phat-hien
  truong:
  - giai_thich
  nguon:
  - vandongen2003
  trich: randomization to one of three sleep doses (4 h, 6 h, or 8 h time in bed per night), which were maintained for 14 consecutive days ... chronic restriction of sleep to 6 h or less per night produced cognitive performance deficits equivalent to up to 2 nights of total sleep deprivation
  ket_qua: da-sua
  ghi_chu: 'Cũ "nhóm ngủ 4–6 tiếng/đêm ... tương đương thức trắng 1–2 đêm": là thời gian nằm giường; nguồn nói "tới 2 đêm".'
- id: g2
  cau: Buồn ngủ tự báo cáo chỉ tăng thêm ít sau phản ứng ban đầu; người tham gia phần lớn không nhận ra mình suy giảm.
  loai: phat-hien
  truong:
  - giai_thich
  nguon:
  - vandongen2003
  trich: Subjective sleepiness ratings showed an acute response to sleep restriction but only small further increases on subsequent days ... Sleepiness ratings suggest that subjects were largely unaware of these increasing cognitive deficits
  ket_qua: da-sua
  ghi_chu: 'Cũ "não thì không quen được": thay bằng điều nguồn nói.'
