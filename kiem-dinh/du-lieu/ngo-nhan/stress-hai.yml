ghi_chu: 'chỗ khó: đổi nhãn Đã bị bác bỏ → Đang tranh cãi: cơ sở duy nhất của thẻ cũ là Crum 2013, mà trang nhà stress-co-hai (đã khóa) xếp "đổi niềm tin có giúp khỏe hơn và làm việc tốt hơn?" vào Đang tranh cãi. Khẳng định gồm hai vế ("lúc nào cũng có hại", "càng tránh càng tốt"): vế đầu trái với mô tả phản ứng báo động (Selye), vế sau chưa có nghiên cứu mở được. Lượt 2 (Opus) xem lại nhãn. Đáp án trò chơi đổi từ Sai sang Còn tranh cãi. Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). nhan: cũ ''bac-bo'' → mới ''tranh-cai'' | giai_thich: cũ ''Thí nghiệm năm 2013 cho thấy người được xem video về mặt tích cực của căng thẳng, sau một tuần, tự báo cáo hiệu suất làm việc tốt hơn và ít triệu chứng sức khỏe tiêu cực hơn nhóm được xem video về mặt hại — cùng một mức căng thẳng, cách nhìn khác nhau cho kết quả khác nhau. Dĩ nhiên, căng thẳng kéo dài quá sức vẫn có hại; điểm mấu chốt là căng thẳng không phải lúc nào cũng là kẻ thù.'' → mới ''Tim đập nhanh khi căng thẳng là phản ứng báo động bình thường: cơ thể huy động năng lượng để đối phó, và theo mô hình của Selye, điều đáng lo là căng thẳng kéo dài không lối thoát chứ không phải một đợt căng thẳng ngắn. Việc nhìn stress theo hướng tích cực có giúp ích không thì chưa chắc: trong một thí nghiệm năm 2013, người xem video về mặt có lợi của stress báo cáo ít triệu chứng hơn và tự đánh giá làm việc tốt hơn, nhưng đều là tự báo cáo.'' | nguon: cũ [''crum2013''] → mới [''selye1936'', ''crum2013''] | trang: cũ None → mới ''kham-pha/cang-thang-giac-ngu/stress-co-hai'''
