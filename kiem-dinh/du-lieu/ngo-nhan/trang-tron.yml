ghi_chu: 'chỗ khó: chỉ mở được tên bài và tóm tắt tiếng Pháp của Rotton & Kelly 1985 (37 nghiên cứu); kết luận "không tìm thấy mối liên hệ đáng tin" chưa đọc được. Có nghiên cứu lẻ thấy liên hệ (động kinh 2006, tội phạm 1984 ở Ấn Độ, giấc ngủ 2013) nên nhãn cần lượt 2 xem lại. Bỏ câu "ta dễ nhớ những đêm trăng tròn hỗn loạn" (không có nguồn). Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Phân tích tổng hợp năm 1985 không tìm thấy mối liên hệ đáng tin giữa pha mặt trăng và các hành vi này, và các kết quả dương tính lẻ tẻ không lặp lại được. Niềm tin vẫn tồn tại vì ta dễ nhớ những đêm trăng tròn hỗn loạn mà quên những đêm trăng tròn bình thường.'' → mới ''Phân tích tổng hợp năm 1985 gộp 37 nghiên cứu về pha mặt trăng và các rối loạn hành vi không tìm thấy mối liên hệ đáng tin. Ở một khoa cấp cứu tại Mỹ, số liệu 4 năm với 150.999 lượt khám không thấy ngày trăng tròn có nhiều lượt khám, xe cấp cứu hay ca nhập viện hơn; một nghiên cứu khác trên 1.444 ca chấn thương nặng trong một năm cũng không thấy khác biệt, kể cả các ca do bạo lực.'' | nguon: cũ [''rotton1985''] → mới [''rotton1985'', ''thompson1996'', ''coates1989'']'
