ghi_chu: 'Thẻ về sức khỏe tâm thần (lam-sang): viết theo tờ thông tin hiện hành của WHO (cập nhật 11/9/2026, đọc 17/11/2026) thay cho thông cáo năm 2017; câu "Chỉ chuyên gia mới chẩn đoán được" và link tới trang Hỗ trợ theo chuan-kiem-dinh.md mục 5, không phải nhận định. Thay nguồn who2017 bằng who2026. Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Theo Tổ chức Y tế Thế giới, trầm cảm là buồn bã kéo dài kèm mất hứng thú với mọi việc và không làm nổi sinh hoạt thường ngày trong ít nhất hai tuần, cùng hàng loạt triệu chứng khác: mất năng lượng, rối loạn ăn ngủ, khó tập trung, cảm giác vô dụng hay tội lỗi. Đây là một bệnh lý có cách điều trị hiệu quả — và chính định kiến “cố vui lên là hết” khiến nhiều người ngại tìm giúp đỡ.'' → mới ''Theo Tổ chức Y tế Thế giới (WHO), trầm cảm khác với những thay đổi tâm trạng thường ngày: tâm trạng buồn, trống rỗng hay mất hứng thú kéo dài gần như cả ngày, gần như mỗi ngày, ít nhất hai tuần, kèm các triệu chứng khác như khó tập trung, rối loạn giấc ngủ, mệt mỏi, cảm giác tội lỗi hay vô dụng. Chỉ chuyên gia mới chẩn đoán được. Trầm cảm có cách điều trị hiệu quả, và sự kỳ thị là một trong những rào cản khiến người bệnh không được chăm sóc.'' | nguon: cũ [''who2017''] → mới [''who2026''] | trang: cũ None → mới ''ho-tro/index'''
