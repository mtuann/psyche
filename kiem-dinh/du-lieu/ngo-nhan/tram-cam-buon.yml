- id: g1
  cau: Theo WHO, giai đoạn trầm cảm khác thay đổi tâm trạng thường ngày, kéo dài gần như cả ngày, gần như mỗi ngày, ít nhất hai tuần, kèm triệu chứng khác (khó tập trung, tội lỗi hay vô dụng, rối loạn giấc ngủ, mệt mỏi…).
  loai: lam-sang
  truong:
  - giai_thich
  nguon:
  - who2026
  trich: 'During a depressive episode, a person experiences a depressed mood (feeling sad, irritable, empty). They may feel a loss of pleasure or interest in activities. A depressive episode is different from regular mood fluctuations. They last most of the day, nearly every day, for at least two weeks. Other symptoms are also present, which may include: poor concentration feelings of excessive guilt or low self-worth ... disrupted sleep ... feeling very tired'
  ket_qua: da-sua
  ghi_chu: 'Cũ "kèm mất hứng thú với mọi việc và không làm nổi sinh hoạt thường ngày ... mất năng lượng, rối loạn ăn ngủ...": viết theo tờ thông tin 2026.'
  luot_2: dung
  luot_2_nguon:
  - https://www.who.int/news-room/fact-sheets/detail/depression
  luot_2_ghi_chu: Trang WHO cập nhật 11/9/2026, mở ngày 17/11/2026.
- id: g2
  cau: Trầm cảm có cách điều trị hiệu quả; kỳ thị là một rào cản của việc được chăm sóc.
  loai: lam-sang
  truong:
  - giai_thich
  nguon:
  - who2026
  trich: There is effective treatment for mild, moderate and severe depression ... Barriers to effective care include a lack of investment in mental health care, lack of trained health care providers and social stigma associated with mental disorders.
  ket_qua: da-sua
  ghi_chu: 'Cũ "chính định kiến cố vui lên là hết khiến nhiều người ngại tìm giúp đỡ": nguồn nói kỳ thị là rào cản, không nói riêng định kiến này.'
  luot_2: dung
  luot_2_nguon:
  - https://www.who.int/news-room/fact-sheets/detail/depression
