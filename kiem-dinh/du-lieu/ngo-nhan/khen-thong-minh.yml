      kiem_mau: chủ repo, 5 nhận định ngẫu nhiên của lô (plans/lam-lai/bao-cao/d8-l3-kiem-mau.yml), đạt, 17/11/2026
ghi_chu: 'chỗ khó: đổi nhãn Đã bị bác bỏ → Đang tranh cãi: tìm thấy lần làm lại sát của Li & Bates 2019 (624 trẻ, nghiên cứu 1 làm lại Mueller & Dweck 1998) không thấy hiệu ứng ở các thước đo động lực. Bỏ chi tiết "nói dối về điểm số" (không có trong tóm tắt, chưa mở toàn văn). Đáp án trò chơi đổi từ Sai sang Còn tranh cãi. Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). nhan: cũ ''bac-bo'' → mới ''tranh-cai'' | giai_thich: cũ ''Trong loạt 6 thí nghiệm năm 1998, trẻ được khen “con thông minh quá” có xu hướng chọn bài dễ để giữ hình ảnh, bỏ cuộc sớm khi gặp khó và nói dối về điểm số nhiều hơn nhóm được khen nỗ lực. Khen vào quá trình (“con đã thử nhiều cách”) nuôi tư duy cầu tiến; khen vào “bản chất” thông minh thì cho kết quả ngược lại.'' → mới ''Trong 6 thí nghiệm năm 1998 với học sinh lớp 5, sau một lần thất bại, trẻ từng được khen "thông minh" kém bền bỉ, kém thích thú và làm bài kém hơn trẻ được khen nỗ lực. Nhưng một lần làm lại sát thí nghiệm này ở trẻ Trung Quốc 9–13 tuổi (2019) không thấy khác biệt ở cả 8 thước đo động lực và cách giải thích thất bại, chỉ thấy một khác biệt sát ngưỡng ở điểm làm bài. Khen thế nào là tốt nhất vẫn đang được nghiên cứu.'' | nguon: cũ [''mueller1998''] → mới [''mueller1998'', ''li2019'']'
nguon:
  - id: mueller1998
    ten: Mueller và cộng sự (1998). Praise for intelligence can undermine children's motivation and performance
    link: https://doi.org/10.1037/0022-3514.75.1.33
  - id: li2019
    ten: 'Li và cộng sự (2019). You can’t change your basic ability, but you work at things, and that’s how we get hard things done: Testing the role of growth mindset on response to setbacks, educational attainment, and cognitive ability'
    link: https://doi.org/10.1037/xge0000669
nhan_dinh:
  - id: nhan
    cau: 'Khen trẻ "thông minh" giúp trẻ tự tin và học giỏi hơn: đang tranh cãi.'
    loai: nhan
    truong:
      - khang_dinh
      - nhan
    nhan: tranh-cai
    nguon:
      - mueller1998
      - li2019
    co_so:
      - mueller1998
      - li2019
    ly_do: 'Thước đo mục 4, Đang tranh cãi: bằng chứng mâu thuẫn (6 thí nghiệm 1998 thấy khen trí thông minh có hại sau thất bại; lần làm lại sát 2019 không thấy ở 8 thước đo động lực). Không có bằng chứng nào cho vế "giúp tự tin và học giỏi hơn"; điều còn tranh cãi là khen thông minh có hại hay không.'
    ket_qua: da-sua
    ghi_chu: 'chỗ khó: xem ghi_chu hồ sơ. Sau lượt 2 (Opus 5.5, 17/11/2026): Lượt 2 dung; ghi rõ phần tranh cãi vào ly_do. Review (Claude Opus 5.5, 17/11/2026): đạt (Đang tranh cãi). Tóm tắt Mueller & Dweck 1998 (OpenAlex): 6 nghiên cứu, học sinh lớp 5, sau thất bại kém bền bỉ, kém thích thú, làm bài kém hơn; Li & Bates 2019 (Europe PMC): 624 trẻ 9–13 tuổi, Study 1 "closely replicated", p = .049 ở điểm làm bài, không ở 8 thước đo động lực (mean p = .48).'
    luot_2: dung
    luot_2_nguon:
      - https://pubmed.ncbi.nlm.nih.gov/9686450/
      - https://pubmed.ncbi.nlm.nih.gov/31464486/
    luot_2_ghi_chu: Không có bằng chứng tốt cho vế 'giúp tự tin và học giỏi hơn'; điều còn tranh cãi là khen thông minh có hại hay không. Nhãn 'đang tranh cãi' chấp nhận được; review có thể cân nhắc viết rõ phần tranh cãi.
  - id: g1
    cau: 'Mueller & Dweck 1998 (6 nghiên cứu, học sinh lớp 5): sau thất bại, trẻ được khen thông minh kém bền bỉ, kém thích thú, làm bài kém hơn trẻ được khen nỗ lực.'
    loai: phat-hien
    truong:
      - giai_thich
    nguon:
      - mueller1998
    trich: six studies demonstrated that praise for intelligence had more negative consequences ... Fifth graders praised for intelligence ... After failure, they also displayed less task persistence, less task enjoyment, more low-ability attributions, and worse task performance than children praised for effort.
    ket_qua: da-sua
    ghi_chu: 'Cũ nêu "chọn bài dễ ... nói dối về điểm số": bỏ chi tiết chưa kiểm được; giữ điều tóm tắt nói.'
    luot_2: dung
    luot_2_nguon:
      - https://pubmed.ncbi.nlm.nih.gov/9686450/
  - id: g2
    cau: 'Li & Bates 2019: làm lại sát Mueller & Dweck ở trẻ Trung Quốc 9–13 tuổi; không khác biệt ở 8 thước đo động lực và quy kết, chỉ điểm làm bài sau thất bại sát ngưỡng (p = .049).'
    loai: tai-lap
    truong:
      - giai_thich
    nguon:
      - li2019
    trich: Study 1 closely replicated Mueller and Dweck (1998). Growth mindset manipulation was associated with performance on a moderate difficulty postfailure test (p = .049), but not with any of the 8 motivation and attribution measures used by Mueller and Dweck (1998)
    ket_qua: da-sua
    ghi_chu: Câu mới (nguồn mới, tìm khi kiểm). Câu cũ "Khen vào quá trình nuôi tư duy cầu tiến; khen vào bản chất cho kết quả ngược lại" đã bỏ.
    luot_2: dung
    luot_2_nguon:
      - https://pubmed.ncbi.nlm.nih.gov/31464486/
    luot_2_ghi_chu: Tuổi 9–13 là của cả loạt nghiên cứu.
