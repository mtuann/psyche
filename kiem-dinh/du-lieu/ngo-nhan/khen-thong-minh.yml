  nguon:
  - mueller1998
  trich: six studies demonstrated that praise for intelligence had more negative consequences ... Fifth graders praised for intelligence ... After failure, they also displayed less task persistence, less task enjoyment, more low-ability attributions, and worse task performance than children praised for effort.
  ket_qua: da-sua
  ghi_chu: 'Cũ nêu "chọn bài dễ ... nói dối về điểm số": bỏ chi tiết chưa kiểm được; giữ điều tóm tắt nói.'
- id: g2
  cau: 'Li & Bates 2019: làm lại sát Mueller & Dweck ở trẻ Trung Quốc 9–13 tuổi; không khác biệt ở 8 thước đo động lực và quy kết, chỉ điểm làm bài sau thất bại sát ngưỡng (p = .049).'
  loai: tai-lap
  truong:
  - giai_thich
  nguon:
  - li2019
  trich: Study 1 closely replicated Mueller and Dweck (1998). Growth mindset manipulation was associated with performance on a moderate difficulty postfailure test (p = .049), but not with any of the 8 motivation and attribution measures used by Mueller and Dweck (1998)
  ket_qua: da-sua
  ghi_chu: Câu mới (nguồn mới, tìm khi kiểm). Câu cũ "Khen vào quá trình nuôi tư duy cầu tiến; khen vào bản chất cho kết quả ngược lại" đã bỏ.
