  ten: 'Li và cộng sự (2019). You can’t change your basic ability, but you work at things, and that’s how we get hard things done: Testing the role of growth mindset on response to setbacks, educational attainment, and cognitive ability'
  link: https://doi.org/10.1037/xge0000669
