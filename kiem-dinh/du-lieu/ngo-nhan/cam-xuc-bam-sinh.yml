ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Người các nền văn hóa nhận diện nét mặt đúng trên mức may rủi, nhưng tổng quan năm 2019 kết luận các biểu hiện cảm xúc không đủ ổn định và đặc trưng để coi là “dấu vân tay” phổ quát — cách ta cảm nhận và gọi tên cảm xúc còn phụ thuộc ngữ cảnh và khái niệm ta có.'' → mới ''Khi chọn nhãn cảm xúc từ một danh sách cho sẵn, người ở nhiều nền văn hóa nhận diện ảnh nét mặt dàn dựng đúng trên mức may rủi. Nhưng bài tổng quan năm 2019 kết luận nét mặt không đủ ổn định và đặc trưng để coi là "dấu vân tay" phổ quát của cảm xúc; cảm xúc có phải "chương trình" sinh học phổ quát hay được não dựng lên từ cảm giác cơ thể, kinh nghiệm và văn hóa thì vẫn chưa ngã ngũ.'' | nguon: cũ [''barrett2019''] → mới [''barrett2019'', ''elfenbein2002'']'
