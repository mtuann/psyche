ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Người các nền văn hóa nhận diện nét mặt đúng trên mức may rủi, nhưng tổng quan năm 2019 kết luận các biểu hiện cảm xúc không đủ ổn định và đặc trưng để coi là “dấu vân tay” phổ quát — cách ta cảm nhận và gọi tên cảm xúc còn phụ thuộc ngữ cảnh và khái niệm ta có.'' → mới ''Khi chọn nhãn cảm xúc từ một danh sách cho sẵn, người ở nhiều nền văn hóa nhận diện ảnh nét mặt dàn dựng đúng trên mức may rủi. Nhưng bài tổng quan năm 2019 kết luận nét mặt không đủ ổn định và đặc trưng để coi là "dấu vân tay" phổ quát của cảm xúc; cảm xúc có phải "chương trình" sinh học phổ quát hay được não dựng lên từ cảm giác cơ thể, kinh nghiệm và văn hóa thì vẫn chưa ngã ngũ.'' | nguon: cũ [''barrett2019''] → mới [''barrett2019'', ''elfenbein2002'']'
nguon:
  - id: barrett2019
    ten: 'Barrett và cộng sự (2019). Emotional expressions reconsidered: Challenges to inferring emotion from human facial movements'
    link: https://doi.org/10.1177/1529100619832930
  - id: elfenbein2002
    ten: 'Elfenbein và cộng sự (2002). On the universality and cultural specificity of emotion recognition: A meta-analysis'
    link: https://doi.org/10.1037/0033-2909.128.2.203
nhan_dinh:
  - id: nhan
    cau: 'Cảm xúc của mọi người đều giống nhau, bẩm sinh nguyên khối: đang tranh cãi.'
    loai: nhan
    truong:
      - khang_dinh
      - nhan
    nhan: tranh-cai
    nguon:
      - barrett2019
      - elfenbein2002
    co_so:
      - barrett2019
      - elfenbein2002
    ly_do: Khớp khung tranh-cai[cảm xúc có phải là chương trình sinh học phổ quát?] của trang nhà cam-xuc-co-ban (đã khóa).
    ket_qua: dung
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1177/1529100619832930
    luot_2_ghi_chu: 'Chỗ khó: nhãn dựa trên một tổng quan, không có phân tích tổng hợp; chấp nhận được cho ''đang tranh cãi''.'
  - id: g1
    cau: Chọn nhãn từ danh sách cho sẵn, người nhiều nền văn hóa nhận diện ảnh nét mặt dàn dựng đúng trên mức may rủi.
    loai: phat-hien
    truong:
      - giai_thich
    nguon:
      - elfenbein2002
    trich: 'Elfenbein & Ambady 2002 (tóm tắt): "Emotions were universally recognized at better-than-chance levels." Điều kiện "chọn từ danh sách cho sẵn", "ảnh dàn dựng" theo trang nhà cam-xuc-co-ban (đã khóa, hồ sơ n30, n36).'
    ket_qua: da-sua
    ghi_chu: 'Thêm điều kiện "danh sách cho sẵn", "ảnh dàn dựng" theo trang nhà. Sau lượt 2 (Opus 5.5, 17/11/2026): Lượt 2 khong-chac (không mở được Elfenbein 2002). Tôi đọc được tóm tắt trên Europe PMC: nhận diện trên mức may rủi ở mọi nền văn hóa. Giữ câu, khớp khung vung-chac của trang nhà.'
    luot_2: khong-chac
    luot_2_nguon:
      - https://doi.org/10.1177/1529100619832930
    luot_2_ghi_chu: 'Đã tìm Europe PMC, PubMed: chưa mở được Elfenbein & Ambady 2002 hay thân bài Barrett 2019 để xác nhận ''nhiều nền văn hóa nhận diện ảnh dàn dựng đúng trên mức may rủi''.'
  - id: g2
    cau: 'Barrett 2019: nét mặt không đủ ổn định, đặc trưng để làm "dấu vân tay" phổ quát; tranh luận chưa ngã ngũ.'
    loai: phat-hien
    truong:
      - giai_thich
    nguon:
      - barrett2019
    trich: 'Trang nhà: "Phe kiến tạo (Barrett) cho rằng cảm xúc được não dựng lên từ cảm giác cơ thể, kinh nghiệm và văn hóa — nét mặt chỉ là một manh mối, không phải dấu vân tay của cảm xúc. Cả hai phe đều có bằng chứng"'
    ket_qua: da-sua
    ghi_chu: 'Cũ "tổng quan năm 2019 kết luận ... cách ta cảm nhận và gọi tên cảm xúc còn phụ thuộc ngữ cảnh": thêm rằng tranh luận chưa ngã ngũ (trang nhà).'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1177/1529100619832930
    luot_2_ghi_chu: Chỉ đọc tóm tắt; 'tranh luận chưa ngã ngũ' là diễn giải hợp lý, không có trong tóm tắt.
  - id: trang
    cau: 'Bài liên quan của thẻ là kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban'
    loai: ve-site
    truong:
      - trang
    ket_qua: dung
    ghi_chu: 'Review thêm (Claude Opus 5.5, 17/11/2026): thẻ có trường trang mà hồ sơ thiếu câu về site. Trang đã khóa (khoa.json), "Đọc thêm" hiện ở dist/ngo-nhan/; trang có Ekman 1969, Elfenbein & Ambady 2002 và khung tranh-cai[cảm xúc có phải là chương trình sinh học phổ quát?].'
    review: dung
