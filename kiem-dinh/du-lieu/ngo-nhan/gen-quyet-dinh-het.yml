ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Con số “tính di truyền 40–60%” là thống kê trên cả quần thể, không phải tỉ lệ “do gen định đoạt” trong một con người cụ thể. Cùng một bộ gen, môi trường và nỗ lực khác nhau vẫn cho kết quả khác nhau — gen đặt khoảng khả năng, không viết sẵn kết cục.'' → mới ''Tính di truyền là con số thống kê trên một quần thể: bao nhiêu phần trăm khác biệt giữa người với người gắn với khác biệt về gen, không phải phần "do gen định đoạt" trong một con người cụ thể. Phân tích tổng hợp gần như mọi nghiên cứu sinh đôi trong 50 năm (2015) cho tính di truyền trung bình 49% trên mọi tính trạng; nghĩa là khoảng một nửa khác biệt còn lại gắn với những thứ khác ngoài gen.'''
