ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Mỗi lần nhớ lại, ta dựng lại ký ức từ các mảnh, và ký ức có thể bị thay đổi bởi câu hỏi gợi ý hay thông tin nghe được sau đó. Đây là một trong những phát hiện được tái lập nhiều nhất của tâm lý học trí nhớ. Một khảo sát đại diện ở Mỹ công bố năm 2011 cho thấy 63% người được hỏi vẫn tin trí nhớ giống máy quay.'' → mới ''Mỗi lần nhớ lại, ta dựng lại ký ức, và ký ức có thể bị thông tin nghe được sau sự kiện làm sai lệch: hiện tượng này đã được nghiên cứu trong nhiều thập kỷ, với nhiều kiểu thí nghiệm. Dù vậy, trong một khảo sát đại diện ở Mỹ (công bố năm 2011), 63% người được hỏi đồng ý rằng trí nhớ hoạt động như máy quay phim.'''
