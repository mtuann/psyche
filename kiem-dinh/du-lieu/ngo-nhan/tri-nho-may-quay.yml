    ten: 'Simons và cộng sự (2011). What people believe about how memory works: A representative survey of the U.S. population'
    link: https://doi.org/10.1371/journal.pone.0022757
  - id: loftus2005
    ten: 'Loftus (2005). Planting misinformation in the human mind: A 30-year investigation of the malleability of memory'
    link: https://doi.org/10.1101/lm.94705
