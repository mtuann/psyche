    trich: 'Trang nhà (đã khóa): "Hiện tượng thông tin sai lệch (misinformation effect) đã được nghiên cứu trong nhiều thập kỷ với nhiều kiểu thí nghiệm khác nhau; bài tổng quan của Elizabeth Loftus năm 2005 tổng kết 30 năm nghiên cứu"'
    ket_qua: da-sua
    ghi_chu: 'Cũ "Đây là một trong những phát hiện được tái lập nhiều nhất của tâm lý học trí nhớ": mạnh hơn nguồn đã kiểm; viết theo trang nhà.'
