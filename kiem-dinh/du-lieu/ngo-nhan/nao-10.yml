  luot_2_ghi_chu: Lời của Beyerstein (nhà tâm lý học thần kinh) trên Scientific American, bậc 3 thuật lại chương sách của ông (Beyerstein 1999). Chưa tìm được nguồn bậc 1–2 mở; review cân nhắc.
