  ly_do: 'OECD (theo Dekker 2012) xếp là huyền thoại thần kinh. Chưa có trong hồ sơ một tổng quan bậc 2 về bằng chứng thần kinh học (ghi hình, tổn thương): chưa đạt chữ của thước đo mục 4.'
  ket_qua: null
  ghi_chu: 'chỗ khó: cơ sở chính là bài phổ thông của Beyerstein (Scientific American, bậc 3) và một khảo sát (bậc 1 về niềm tin, không về não); cần tổng quan bậc 2, như chương của Beyerstein trong Mind Myths (Della Sala, 1999, chưa mở được). Sau lượt 2 (Opus 5.5, 18/11/2026): Lượt 2 dung, nhưng sau khi bỏ nguồn bậc 3 thì cơ sở chỉ còn sự phân loại của OECD: để chưa có kết quả, cần một nguồn bậc 2 trước khi khóa.'
