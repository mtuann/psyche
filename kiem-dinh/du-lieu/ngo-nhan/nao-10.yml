nhan_dinh:
- id: nhan
  cau: Khẳng định "con người chỉ dùng 10% bộ não" đã bị bác bỏ.
  loai: nhan
  truong:
  - khang_dinh
  - nhan
  nhan: bac-bo
  nguon:
  - torrijosmuelas2021
  - dekker2012
  co_so:
  - torrijosmuelas2021
  - dekker2012
  ly_do: 'Tổng quan hệ thống 2021 (Torrijos-Muelas và cộng sự, toàn văn PMC7835631) coi đây là huyền thoại thần kinh dai dẳng nhất và nêu phản chứng: không vùng não nào "nghỉ" hoàn toàn, kể cả khi ngủ (dẫn OECD 2007); OECD xếp là huyền thoại thần kinh (Dekker 2012). Khẳng định không có bằng chứng gốc và trái với dữ liệu về hoạt động não: đạt "Đã bị bác bỏ" (mục 4).'
  ket_qua: dung
  ghi_chu: 'chỗ khó: cơ sở chính là bài phổ thông của Beyerstein (Scientific American, bậc 3) và một khảo sát (bậc 1 về niềm tin, không về não); cần tổng quan bậc 2, như chương của Beyerstein trong Mind Myths (Della Sala, 1999, chưa mở được). Sau lượt 2 (Opus 5.5, 17/11/2026): Lượt 2 dung, nhưng sau khi bỏ nguồn bậc 3 thì cơ sở chỉ còn sự phân loại của OECD: để chưa có kết quả, cần một nguồn bậc 2 trước khi khóa. Sau lượt 2 (Opus 5.5, 17/11/2026): Lượt 2 riêng cho nhãn: dung (Opus). Tôi tự đọc câu trích trong Torrijos-Muelas 2021: "no one single brain area is 100% out of work, even when sleeping". Không dùng bài tổng quan 2021 thứ ba (PMC8548459, Rousseau) vì chưa tự đọc. Hết chưa có kết quả. Review (Claude Opus 5.5, 17/11/2026): đạt. Tự mở toàn văn Torrijos-Muelas 2021 (Europe PMC, PMC7835631): "The myth about only 10% of brain use seems to be the most enduring neuromyth", "no one single brain area is 100% out of work, even when sleeping (… OECD, 2007)"; Dekker 2012 (PMC3475349): câu Brazil (Herculano-Houzel 2002, OECD) và Bảng 1 "We only use 10% of our brain" 48 / 46.'
  luot_2: dung
  luot_2_nguon:
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC7835631/
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC3475349/
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC8548459/
  luot_2_ghi_chu: 'Tổng quan hệ thống 24 khảo sát (Torrijos-Muelas 2021) và tổng quan can thiệp (Rousseau 2021) đều coi câu này là huyền thoại thần kinh. OECD 2002/2007 xếp nó vào nhóm huyền thoại; tổng quan nêu chứng cứ phản bác: không vùng não nào ngừng hoạt động hoàn toàn, kể cả khi ngủ. Khẳng định chưa bao giờ có bằng chứng gốc, và dữ liệu hình ảnh não trái với nó: hợp ''Đã bị bác bỏ'' theo mục 4. Đã đọc toàn văn cả ba bài qua Europe PMC. Chưa mở được nguồn riêng về chuyển hóa năng lượng của não; câu nhãn không cần điều này.'
