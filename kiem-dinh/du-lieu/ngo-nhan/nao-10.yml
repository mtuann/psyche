ghi_chu: 'Bỏ câu "não chiếm khoảng 2% khối lượng cơ thể nhưng dùng khoảng 20% năng lượng lúc nghỉ": chưa mở được nguồn bậc 1–2 nói con số này (Raichle & Gusnard 2002, PNAS: PMC không cho tải toàn văn). Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Các kỹ thuật chụp não như PET và fMRI cho thấy hầu như mọi vùng não đều hoạt động trong một ngày bình thường, và tổn thương ở gần như bất kỳ vùng nào cũng gây hậu quả. Não chỉ chiếm khoảng 2% khối lượng cơ thể nhưng dùng khoảng 20% năng lượng lúc nghỉ; một cơ quan "tốn kém" như vậy khó có 90% bỏ không. Dù vậy, khảo sát năm 2012 cho thấy gần một nửa giáo viên được hỏi ở Anh và Hà Lan vẫn tin điều này.'' → mới ''Theo nhà thần kinh học Barry Beyerstein, chưa ai tìm thấy vùng não nào "nằm im chờ việc": ghi hoạt động não (điện não đồ, PET, fMRI) hay kích thích điện trong lúc phẫu thuật đều không thấy vùng như vậy, và tổn thương ở hầu như vùng nào cũng để lại một khiếm khuyết nào đó. Dù vậy, trong một khảo sát năm 2012, gần một nửa giáo viên được hỏi ở Anh và Hà Lan (48% và 46%) vẫn tin điều này.'''
