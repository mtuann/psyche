ghi_chu: 'Thay nguồn statology-mean-median (trang web hướng dẫn, bậc 3) bằng von Hippel 2005 (bài có bình duyệt mà trang nhà thong-ke-mo-ta dẫn). Thêm "thường": quy tắc trung bình bị kéo theo đuôi là quy tắc thường đúng, không phải luật (trang nhà, von Hippel 2005). Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Khi phân phối lệch — như thu nhập, nơi vài người rất giàu kéo đuôi phân phối dài ra — trung bình cộng bị kéo lên xa khỏi đa số. Lúc đó trung vị (giá trị đứng giữa) mới mô tả “người điển hình” tốt hơn.'' → mới ''Khi phân phối lệch, như thu nhập, nơi một số ít người thu nhập rất cao kéo đuôi phân phối dài ra, trung bình thường bị kéo về phía đuôi nhiều hơn trung vị. Trung vị (giá trị đứng chính giữa) cho biết người đứng giữa kiếm bao nhiêu, nên thường mô tả "người điển hình" tốt hơn.'' | nguon: cũ [''statology-mean-median''] → mới [''vonhippel2005'']'
