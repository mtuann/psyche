ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Một nghiên cứu tái lập với 200 người không thấy thay đổi testosterone, cortisol hay hành vi chấp nhận rủi ro. Năm 2016, tác giả chính của nghiên cứu gốc tuyên bố bà không còn tin hiệu ứng này là thật. Có thể có một hiệu ứng nhỏ lên cảm giác tự tin tự báo cáo, nhưng phần này vẫn đang tranh cãi.'' → mới ''Một nghiên cứu tái lập với cỡ mẫu lớn (2015) không thấy "tư thế quyền lực" làm thay đổi hormone hay mức chấp nhận rủi ro. Năm 2016, tác giả chính của nghiên cứu gốc viết rằng bà không còn tin hiệu ứng này là thật, và thừa nhận phần đo cảm giác quyền lực tự báo cáo trong bài gốc đã được chọn theo kết quả.'''
