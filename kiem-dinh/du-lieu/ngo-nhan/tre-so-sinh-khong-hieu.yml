ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Trẻ vài tháng tuổi đã phân biệt được âm thanh của mọi ngôn ngữ trên thế giới và âm thầm học thống kê từ giọng nói xung quanh — trước cả khi bập bẹ. Thí nghiệm của Kuhl và cộng sự (2003) cho thấy chỉ cần người thật trò chuyện vài giờ, trẻ 9 tháng đã “mở tai” với âm ngoại ngữ.'' → mới ''Trẻ vài tháng tuổi đã phân biệt được nhiều cặp âm, kể cả âm không có trong tiếng mẹ đẻ; trong khoảng 6–12 tháng tuổi, khả năng ấy hẹp dần theo tiếng mẹ đẻ. Trong thí nghiệm của Kuhl và cộng sự (2003), sau 12 buổi chơi với người bản ngữ (tổng cộng 5 giờ), trẻ Mỹ 9 tháng tuổi phân biệt được một cặp phụ âm tiếng Quan Thoại; xem video hay nghe băng cùng nội dung thì không.'' | nguon: cũ [''kuhl2003''] → mới [''werker1984'', ''kuhl2003'']'
nguon:
  - id: werker1984
    ten: 'Werker và cộng sự (1984). Cross-language speech perception: Evidence for perceptual reorganization during the first year of life'
    link: https://doi.org/10.1016/S0163-6383(84)80022-3
  - id: kuhl2003
    ten: 'Kuhl và cộng sự (2003). Foreign-language experience in infancy: Effects of short-term exposure and social interaction on phonetic learning'
    link: https://doi.org/10.1073/pnas.1532872100
nhan_dinh:
  - id: nhan
    cau: 'Trẻ sơ sinh chẳng hiểu gì về ngôn ngữ xung quanh: đã bị bác bỏ.'
    loai: nhan
    truong:
      - khang_dinh
      - nhan
    nhan: bac-bo
    nguon:
