    ly_do: 'Trang nhà tre-hoc-noi (đã khóa): khung vung-chac[hẹp dần theo tiếng mẹ đẻ trong khoảng 6–12 tháng tuổi]; kha-vung về học qua người thật.'
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1073/pnas.1113380109", "https://web.archive.org/web/2017/https://www.pnas.org/content/pnas/100/15/9096.full.pdf" ]
    luot_2_ghi_chu: "Chỗ khó: bằng chứng từ 6 tháng tuổi (không phải sơ sinh vài tuần) và từ một vài nghiên cứu; nhãn 'bác bỏ' hợp với câu 'chẳng hiểu gì' nhưng nên ghi rõ độ tuổi."
  - id: g1
    cau: Trẻ nhỏ phân biệt được cả âm không có trong tiếng mẹ đẻ; khả năng này hẹp dần trong khoảng 6–12 tháng.
    loai: phat-hien
    truong:
      - giai_thich
    nguon:
      - werker1984
    trich: 'Trang nhà: "Khả năng phân biệt phụ âm không có trong tiếng mẹ đẻ giảm từ 6–8 tháng sang 10–12 tháng tuổi"; khung vung-chac[hẹp dần theo tiếng mẹ đẻ trong khoảng 6–12 tháng tuổi]'
    ket_qua: da-sua
    ghi_chu: 'Cũ "phân biệt được âm thanh của mọi ngôn ngữ trên thế giới và âm thầm học thống kê từ giọng nói": "mọi ngôn ngữ" quá rộng (trang nhà: không phải mọi tương phản đều suy giảm), "học thống kê" chưa có nguồn trong hồ sơ.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1073/pnas.1532872100" ]
  - id: g2
    cau: 'Kuhl 2003: 12 buổi (5 giờ) với người thật, trẻ 9 tháng học được cặp phụ âm Quan Thoại; video, băng thì không.'
    loai: phat-hien
    truong:
      - giai_thich
    nguon:
      - kuhl2003
    trich: 'Trang nhà: "Sau 12 buổi tiếp xúc trực tiếp (tổng cộng 5 giờ), trẻ Mỹ phân biệt được cặp phụ âm tiếng Quan Thoại ... Nhưng nhóm xem TV hoặc nghe băng không cho thấy việc học nào"'
    ket_qua: da-sua
    ghi_chu: 'Cũ "chỉ cần người thật trò chuyện vài giờ, trẻ 9 tháng đã mở tai với âm ngoại ngữ": viết cụ thể theo trang nhà.'
    luot_2: dung
    luot_2_nguon: [ "https://web.archive.org/web/2017/https://www.pnas.org/content/pnas/100/15/9096.full.pdf" ]
    luot_2_ghi_chu: 12 buổi x 25 phút = 5 giờ; đọc toàn văn qua bản lưu Internet Archive.
