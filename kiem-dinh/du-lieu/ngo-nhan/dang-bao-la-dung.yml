ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Năm 2023 có hơn 10.000 bài báo bị rút lại — mức kỷ lục, trong đó hơn 8.000 bài từ các tạp chí Hindawi do quy trình phản biện bị thao túng. Bình duyệt là bộ lọc quan trọng nhưng không hoàn hảo; đọc báo khoa học vẫn cần con mắt kiểm chứng.'' → mới ''Theo tin của tạp chí Nature, năm 2023 có hơn 10.000 bài báo nghiên cứu bị rút lại, phá các kỷ lục hằng năm; hơn 8.000 bài trong số đó từ các tạp chí của Hindawi, với lý do gồm thao túng có hệ thống quy trình xuất bản và phản biện. Bình duyệt là bộ lọc quan trọng nhưng không hoàn hảo; đọc báo khoa học vẫn cần con mắt kiểm chứng.'''
