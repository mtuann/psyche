  - waterhouse2006
  ly_do: 'Khẳng định "làm trẻ thông minh hơn" vượt ra ngoài điều từng được kiểm (cải thiện ngắn ở bài không gian của sinh viên đại học, theo tóm tắt Rauscher & Hinton 2006); tổng quan Waterhouse 2006: không đủ bằng chứng thực nghiệm. Đạt "Đã bị bác bỏ" cho khẳng định như viết, không phải cho hiệu ứng ngắn hạn.'
  ket_qua: dung
  ghi_chu: 'chỗ khó: chỉ mở được tóm tắt của Waterhouse 2006 ("lack adequate empirical support"); hai phân tích tổng hợp chưa đọc được. Sau lượt 2 (Opus 5.5, 18/11/2026): Hết "chưa chắc": cơ sở nay là bài của tác giả gốc (đã đọc) và Waterhouse 2006.'
  luot_2: dung
  luot_2_nguon:
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC9988829/
