ghi_chu: 'chỗ khó: chưa mở được tóm tắt hay toàn văn của Chabris 1999 (thư ngắn trên Nature) và Pietschnig 2010 (Intelligence); g1, g2 để chưa có kết quả. Câu cuối cũ "Không có bằng chứng nghe Mozart làm tăng trí thông minh lâu dài" thay bằng câu theo tóm tắt Waterhouse 2006. Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Nghiên cứu gốc năm 1993 làm trên sinh viên đại học, không phải trẻ em, và chỉ đo một nhiệm vụ không gian trong thời gian ngắn ngay sau khi nghe nhạc. Các phân tích tổng hợp sau đó (1999, 2010) thấy hiệu ứng rất nhỏ hoặc gần như không có, kèm dấu hiệu thiên lệch xuất bản. Không có bằng chứng nghe Mozart làm tăng trí thông minh lâu dài.'' → mới ''Nghiên cứu gốc năm 1993 làm trên sinh viên đại học, không phải trẻ em, và chỉ đo một nhiệm vụ không gian trong thời gian ngắn ngay sau khi nghe nhạc. Các phân tích tổng hợp sau đó (1999, 2010) thấy hiệu ứng rất nhỏ hoặc gần như không có, kèm dấu hiệu thiên lệch xuất bản. Một bài tổng quan năm 2006 kết luận "hiệu ứng Mozart" không có đủ bằng chứng để làm cơ sở cho việc dạy học.'' | nguon: cũ [''chabris1999'', ''pietschnig2010''] → mới [''chabris1999'', ''pietschnig2010'', ''waterhouse2006'']'
