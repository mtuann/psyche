- id: g1
  cau: Hiệu ứng Mozart ban đầu là một cải thiện ngắn ở bài không gian–thời gian của sinh viên đại học ngay sau khi nghe một bản sonata của Mozart (K. 448).
  loai: phat-hien
  truong:
  - giai_thich
  nguon:
  - rauscher2006
  trich: “The Mozart effect” originally referred to the phenomenon of a brief enhancement of spatial-temporal abilities in college students after listening to a Mozart piano sonata (K. 448).
  ket_qua: da-sua
  ghi_chu: 'chưa chắc: phần "nhiệm vụ không gian" có nguồn (Oberleiter 2023, chưa có bản ghi nguồn); "sinh viên đại học" chưa mở được bài gốc Rauscher 1993. Sau lượt 2 (Opus 5.5, 18/11/2026): Nguồn lượt 2 dẫn (bài của chính tác giả gốc); bỏ nguồn Chabris 1999 không mở được. Lượt 2 (với câu cũ): dung (Bài phản hồi của chính Rauscher (Educational Psychologist 2006). Không mở được thư Nature 1993; chi tiết ''sinh viên đại học'' khớp với ''adult''.).'
  vi_tri: Rauscher & Hinton 2006, tr. 233, tóm tắt (bản PDF ở trang của Đại học Wisconsin Oshkosh)
- id: g2
  cau: Các tác giả gốc (Rauscher & Hinton 2006) gọi ý nhạc Mozart làm tăng trí thông minh nói chung là một ngộ nhận.
  loai: phat-hien
  truong:
  - giai_thich
  nguon:
  - rauscher2006
  trich: Much of the controversy concerning the Mozart effect is due to the misconception that Mozart’s music can enhance general intelligence
  ket_qua: da-sua
  ghi_chu: 'chưa chắc: Crossref, Europe PMC, OpenAlex, Semantic Scholar đều không có tóm tắt; cần toàn văn. Sau lượt 2 (Opus 5.5, 18/11/2026): Thay câu về hai phân tích tổng hợp 1999, 2010 (không mở được; lượt 2 lưu ý theo bản chép tóm tắt Pietschnig 2010 thì so với im lặng d = 0,37, nên "rất nhỏ hoặc gần như không có" sai một phần). Rauscher & Hinton còn dẫn một phân tích tổng hợp 36 nghiên cứu thấy hiệu ứng ngắn hạn ở bài xoay hình: thẻ không nói hiệu ứng ngắn hạn không có. Lượt 2 (với câu cũ): khong-chac (Không mở được tóm tắt chính thức của Pietschnig 2010 (ScienceDirect chặn, Crossref và OpenAlex không có tóm tắt) và thư Chabris 1999 (Nature). Bài 2023 (PMC) chỉ nói hiệu ứng là do mẫu nhỏ và thiên lệch. Lưu ý: theo bản chép tóm tắt Pietschnig 2010, hiệu ứng so với im lặng là d = 0,37 (''small''), giữa hai điều kiện nhạc d = 0,15, có thiên lệch xuất bản; nếu đúng thì ''rất nhỏ hoặc gần như không có'' chỉ đúng cho hiệu ứng riêng của Mozart.).'
  vi_tri: 'Rauscher & Hinton 2006, mục Music listening: The Mozart effect'
