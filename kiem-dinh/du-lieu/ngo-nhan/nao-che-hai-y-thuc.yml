  ket_qua: da-sua
  ghi_chu: 'Cũ "hai bán cầu xử lý thông tin độc lập: tay trái biết điều miệng không nói được": viết theo trang nhà.'
- id: g2
  cau: 'Sperry: mỗi bán cầu dường như có vùng nhận thức riêng; Gazzaniga (2005): chưa có trường hợp cho phép khẳng định mỗi bán cầu có ý thức đầy đủ về bản thân.'
  loai: lich-su
  truong:
  - giai_thich
  nguon:
  - gazzaniga1967
  trich: 'Trang nhà: "Sperry cho rằng mỗi bán cầu dường như có vùng nhận thức riêng, chạy song song. Gazzaniga (2005) viết rằng trong hàng chục trường hợp ... chưa có trường hợp nào cho phép khẳng định mỗi bán cầu có ý thức đầy đủ về bản thân."'
  ket_qua: da-sua
  ghi_chu: 'Cũ "nhiều người cho rằng ý thức vẫn thống nhất ở mức độ nào đó, chỉ là đường truyền thông tin bị cắt": viết theo trang nhà. Gazzaniga 2005 và Sperry 1981 chưa có bản ghi nguồn (để lô dọn nguồn).'
