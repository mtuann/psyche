    cau: Bài liên quan của thẻ là kham-pha/tri-nho/phong-cach-hoc
    loai: ve-site
    truong:
      - trang
    ket_qua: dung
    ghi_chu: 'Trang nhà đã khóa, nhãn Đã bị bác bỏ cho đúng khẳng định này. Review (Claude Opus 5.5, 17/11/2026): kham-pha/tri-nho/phong-cach-hoc có trong trang.yml, đã khóa (khoa.json); dist/ngo-nhan/ hiện "Đọc thêm" trỏ đúng trang; trang bàn đúng ngộ nhận: khung bac-bo[dạy khớp với phong cách học giúp học tốt hơn].'
    review: dung
