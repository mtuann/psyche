    ly_do: Bằng chứng chất lượng cao mâu thuẫn (Sorrells 2018 và Boldrini 2018); khớp trang nhà.
    ket_qua: da-sua
    ghi_chu: 'chỗ khó: xem ghi_chu hồ sơ. Review (Claude Opus 5.5, 17/11/2026): đạt (Đang tranh cãi). Tóm tắt Spalding 2013 (Europe PMC): "700 new neurons are added in each hippocampus per day … modest decline during aging"; Sorrells 2018: "young neurons were not detected in the dentate gyrus" ở người lớn 18–77; Boldrini 2018: 14–79 tuổi, "thousands of immature neurons". Bằng chứng chất lượng cao mâu thuẫn: đúng chữ thước đo.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/29513649/", "https://doi.org/10.1016/j.stem.2018.03.015" ]
  - id: g1
    cau: 'Spalding 2013 (carbon-14 từ thử hạt nhân): khoảng 700 tế bào thần kinh mới mỗi ngày ở mỗi hồi hải mã người trưởng thành, giảm nhẹ theo tuổi.'
    loai: so-lieu
    truong:
      - giai_thich
    nguon:
      - spalding2013
    trich: measuring the concentration of nuclear-bomb-test-derived 14C in genomic DNA ... In adult humans, 700 new neurons are added in each hippocampus per day ... with a modest decline during aging
