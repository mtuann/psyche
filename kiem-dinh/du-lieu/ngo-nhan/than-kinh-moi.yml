    ghi_chu: 'Trang đã khóa, có khung tranh-cai về sinh tế bào thần kinh ở người lớn. Review (Claude Opus 5.5, 17/11/2026): kham-pha/co-so-sinh-hoc/the-duc-nao có trong trang.yml, đã khóa (khoa.json); dist/ngo-nhan/ hiện "Đọc thêm" trỏ đúng trang; trang bàn đúng ngộ nhận: khung tranh-cai[cơ chế BDNF ở người, và chuyện não người lớn có sinh tế bào thần kinh mới không].'
