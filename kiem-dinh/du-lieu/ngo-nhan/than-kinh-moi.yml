    ghi_chu: 'Cũ "nhóm nghiên cứu ở Viện Karolinska (2013) chứng minh": bỏ "chứng minh" (trang nhà xếp tranh cãi), bỏ tên viện (chưa kiểm).'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1016/j.cell.2013.05.002" ]
  - id: g2
    cau: Sorrells 2018 không thấy tế bào thần kinh non ở người trưởng thành; Boldrini 2018 thấy ở người 14–79 tuổi.
    loai: phat-hien
    truong:
