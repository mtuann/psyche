ghi_chu: 'chỗ khó: đổi nhãn Đã bị bác bỏ → Đang tranh cãi cho khớp trang the-duc-nao (đã khóa): khung tranh-cai[cơ chế BDNF ở người — và chuyện não người lớn có sinh tế bào thần kinh mới không]. Câu cũ "chứng minh ... mỗi ngày" mạnh hơn trang nhà. Đáp án trò chơi đổi từ Sai sang Còn tranh cãi. Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). nhan: cũ ''bac-bo'' → mới ''tranh-cai'' | giai_thich: cũ ''Dùng phương pháp “xác định tuổi” tế bào bằng carbon-14 từ các vụ thử hạt nhân, nhóm nghiên cứu ở Viện Karolinska (2013) chứng minh hồi hải mã của người trưởng thành vẫn sinh tế bào thần kinh mới mỗi ngày, dù tốc độ giảm dần theo tuổi. Phát hiện này mới chắc chắn ở hồi hải mã — vùng liên quan đến trí nhớ — chứ chưa phải toàn bộ não.'' → mới ''Năm 2013, một nghiên cứu đo carbon-14 (từ các vụ thử hạt nhân) trong ADN tế bào hồi hải mã ước tính mỗi ngày có khoảng 700 tế bào thần kinh mới ở mỗi hồi hải mã người trưởng thành, giảm nhẹ theo tuổi. Nhưng chuyện này vẫn đang tranh luận: Sorrells và cộng sự (2018) không thấy tế bào thần kinh non ở người trưởng thành, còn Boldrini và cộng sự (2018) thấy chúng ở người 14–79 tuổi.'' | nguon: cũ [''spalding2013''] → mới [''spalding2013'', ''sorrells2018'', ''boldrini2018''] | trang: cũ None → mới ''kham-pha/co-so-sinh-hoc/the-duc-nao'''
