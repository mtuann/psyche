    trich: 'Trang nhà (đã khóa): "Sorrells và cộng sự (2018) không thấy tế bào thần kinh non ở người trưởng thành, Boldrini và cộng sự (2018) thấy chúng ở người 14–79 tuổi"'
    ket_qua: da-sua
    ghi_chu: Câu mới theo trang nhà.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1038/nature25975", "https://doi.org/10.1016/j.stem.2018.03.015" ]
