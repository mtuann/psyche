# Hồ sơ kiểm định thẻ ngộ nhận (D8-L3, lượt 1). Cấu trúc: plans/ben-vung/chuan-kiem-dinh.md mục 6. Khóa: node tools/khoa.mjs khoa du-lieu/ngo-nhan/thuong-ngoai#cap,giai_thich,khang_dinh,nguon,nhan,trang
ban_ghi: ngo-nhan/thuong-ngoai
muc: V3
lan:
  - so: 1
    ngay: '2026-11-17'
    nhanh: moi/d8-l3
    ma_bam: null
    nguoi:
      luot_1: Claude Opus 5.5 (agent làm lô D8-L3)
      luot_2: 'Claude Opus (agent riêng, phần a: plans/lam-lai/bao-cao/d8-l3-luot-2-a.yml); giải quyết chỗ lệch: Claude Opus 5.5 (agent làm lô), 18/11/2026'
      review: 'Claude Opus 5.5 (agent review nội dung D8-L3, không làm lượt 1 hay lượt 2, 17/11/2026)'
