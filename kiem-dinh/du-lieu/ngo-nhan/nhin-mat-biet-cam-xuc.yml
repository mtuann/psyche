nguon:
  - id: barrett2019
    ten: 'Barrett và cộng sự (2019). Emotional expressions reconsidered: Challenges to inferring emotion from human facial movements'
    link: https://doi.org/10.1177/1529100619832930
nhan_dinh:
  - id: nhan
    cau: 'Nhìn nét mặt là biết chính xác người ta cảm thấy gì: đang tranh cãi.'
    loai: nhan
    truong:
      - khang_dinh
      - nhan
    nhan: tranh-cai
    nguon:
      - barrett2019
    co_so:
      - barrett2019
    ly_do: 'Tổng quan 2019 (Psychological Science in the Public Interest): nét mặt không đủ ổn định và đặc trưng; trang nhà cam-xuc-co-ban (đã khóa) xếp câu hỏi chương trình phổ quát là Đang tranh cãi.'
    ket_qua: dung
    ghi_chu: 'chỗ khó: có thể lập luận là Đã bị bác bỏ cho chữ "chính xác"; giữ Đang tranh cãi như trang nhà.'
    luot_2: dung
    luot_2_nguon:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/
    luot_2_ghi_chu: Vế 'biết chính xác' gần như không có ủng hộ; tranh cãi là về mức độ phổ quát. Nhãn chấp nhận được.
  - id: g1
    cau: 'Barrett 2019: người ta đôi khi cười khi vui, cau mày khi buồn, nhíu mày khi giận nhiều hơn mức may rủi.'
    loai: phat-hien
    truong:
      - giai_thich
    nguon:
      - barrett2019
    trich: The available scientific evidence suggests that people do sometimes smile when happy, frown when sad, scowl when angry, and so on, as proposed by the common view, more than what would be expected by chance.
    ket_qua: da-sua
    ghi_chu: 'chưa chắc: "bị thổi phồng bởi cách trắc nghiệm ép chọn" là lập luận của Barrett 2019 theo trang nhà kể lại; chưa đọc toàn văn đoạn ấy. Sau lượt 2 (Opus 5.5, 17/11/2026): Hết chưa chắc: bỏ "tỉ lệ bị thổi phồng bởi cách trắc nghiệm ép chọn" (chỉ có ở lời kể của trang nhà, không đọc được thân bài); viết theo tóm tắt. Lượt 2 (với câu cũ): dung.'
    vi_tri: tóm tắt (Europe PMC)
    luot_2: dung
    luot_2_nguon: [ "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:%2210.1177/1529100619832930%22&resultType=core&format=json" ]
    luot_2_ghi_chu: Tóm tắt Barrett và cộng sự 2019 (PSPI, PMC6640856).
  - id: g2
    cau: 'Barrett 2019: cách biểu lộ thay đổi nhiều giữa văn hóa, tình huống, con người; cùng một kiểu cử động mặt có thể ứng với nhiều cảm xúc, và thường truyền đạt điều khác cảm xúc.'
    loai: phat-hien
    truong:
      - giai_thich
    nguon:
      - barrett2019
    trich: how people communicate anger, disgust, fear, happiness, sadness, and surprise varies substantially across cultures, situations, and even across people within a single situation. Furthermore, similar configurations of facial movements variably express instances of more than one emotion category. In fact, a given configuration of facial movements, such as a scowl, often communicates something other than an emotional state.
    ket_qua: da-sua
    vi_tri: tóm tắt (Europe PMC)
    ghi_chu: 'Sau lượt 2 (Opus 5.5, 17/11/2026): Viết sát tóm tắt. Lượt 2 (với câu cũ): dung.'
    luot_2: dung
    luot_2_nguon: [ "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:%2210.1177/1529100619832930%22&resultType=core&format=json" ]
    luot_2_ghi_chu: Tóm tắt Barrett và cộng sự 2019.
  - id: trang
    cau: Bài liên quan của thẻ là kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban
    loai: ve-site
    truong:
      - trang
    ket_qua: dung
    ghi_chu: 'Trang nhà đã khóa. Review (Claude Opus 5.5, 17/11/2026): kham-pha/cam-xuc-dong-luc/cam-xuc-co-ban có trong trang.yml, đã khóa (khoa.json); dist/ngo-nhan/ hiện "Đọc thêm" trỏ đúng trang; trang bàn đúng ngộ nhận: Jack 2012, Barrett và khung tranh-cai[cảm xúc có phải là chương trình sinh học phổ quát?]; mục "Đừng đọc cảm xúc chỉ từ khuôn mặt".'
    review: dung
