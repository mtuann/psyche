ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Phân tích tổng hợp 42 bộ dữ liệu với hơn 600.000 người năm 2018 cho thấy mỗi năm đi học thêm giúp tăng khoảng 1–5 điểm IQ, và hiệu ứng này kéo dài suốt đời. Gen có ảnh hưởng lớn đến trí tuệ, nhưng “cố định bất biến” thì không đúng.'' → mới ''Thứ bậc tương đối (ai cao hơn ai) khá ổn định và càng ổn định khi lớn tuổi; nhưng điểm của cả một thế hệ có thể tăng (hiệu ứng Flynn), và phân tích tổng hợp 42 bộ dữ liệu với hơn 600.000 người (2018) ước tính mỗi năm đi học thêm làm điểm IQ tăng khoảng 1–5 điểm. Gen có ảnh hưởng lớn đến trí tuệ, nhưng "sinh ra sao cả đời vậy" thì không đúng.'' | trang: cũ None → mới ''kham-pha/tri-tue/tri-tue-la-gi'''
