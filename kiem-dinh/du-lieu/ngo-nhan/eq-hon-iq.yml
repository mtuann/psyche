ghi_chu: 'chỗ khó: đổi nhãn Đã bị bác bỏ → Đang tranh cãi cho khớp trang nhà tri-tue-cam-xuc (đã khóa): khung tranh-cai["EQ là yếu tố dự báo thành công trong đời tốt nhất, quan trọng hơn IQ"]. Đáp án trò chơi đổi từ Sai sang Còn tranh cãi. Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). nhan: cũ ''bac-bo'' → mới ''tranh-cai'' | giai_thich: cũ ''Phân tích tổng hợp năm 2011 thấy trí tuệ cảm xúc liên hệ với hiệu suất công việc ở mức vừa phải (r ≈ 0,24–0,30), nhưng không có bằng chứng nó dự báo thành công nghề nghiệp tốt hơn IQ. EQ là một năng lực có thật và hữu ích, nhưng khẩu hiệu “EQ quan trọng hơn IQ” thì không đứng vững.'' → mới "Đây là thông điệp trên bìa tạp chí Time năm 1995, không phải kết luận khoa học, và dữ liệu tổng hợp chủ yếu nói về hiệu suất công việc. Một phân tích tổng hợp (O''Boyle và cộng sự, 2011) thấy EQ tương quan .24–.30 với hiệu suất và dự báo thêm được ngoài IQ và tính cách; một phân tích khác (Joseph và cộng sự, 2015) thấy phần dự báo thêm ấy gần bằng 0 khi kiểm soát đầy đủ. Trong phân tích tổng hợp của Joseph và Newman (2010), EQ năng lực tương quan với hiệu suất (ρ ≈ .17) thấp hơn năng lực nhận thức." | nguon: cũ [''oboyle2011''] → mới [''oboyle2011'', ''joseph2015'', ''joseph2010''] | trang: cũ None → mới ''kham-pha/cam-xuc-dong-luc/tri-tue-cam-xuc'''
