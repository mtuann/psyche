  - id: oboyle2011
    ten: 'O''Boyle và cộng sự (2011). The relation between emotional intelligence and job performance: A meta-analysis'
    link: https://doi.org/10.1002/job.714
  - id: joseph2015
    ten: Joseph và cộng sự (2015). Why does self-reported emotional intelligence predict job performance? A meta-analytic investigation of mixed EI
    link: https://doi.org/10.1037/a0037681
  - id: joseph2010
    ten: 'Joseph và cộng sự (2010). Emotional intelligence: An integrative meta-analysis and cascading model'
    link: https://doi.org/10.1037/a0017286
nhan_dinh:
  - id: nhan
    cau: 'EQ quyết định thành công nghề nghiệp nhiều hơn IQ: đang tranh cãi.'
    loai: nhan
    truong:
      - khang_dinh
      - nhan
    nhan: tranh-cai
    nguon:
      - oboyle2011
      - joseph2015
      - joseph2010
    co_so:
      - oboyle2011
      - joseph2015
      - joseph2010
    ly_do: 'Khớp trang nhà (đã khóa): hai phân tích tổng hợp cho kết quả khác nhau về giá trị dự báo thêm; chưa có phân tích tổng hợp nào ủng hộ "EQ quan trọng hơn IQ".'
    ket_qua: da-sua
    ghi_chu: 'chỗ khó: xem ghi_chu hồ sơ. Sau lượt 2 (Opus 5.5, 17/11/2026): Lượt 2 dung. Giữ Đang tranh cãi (khớp trang nhà); thẻ đã nói rõ phân tích tổng hợp không ủng hộ phần "nhiều hơn IQ" ở mức tóm tắt (Joseph & Newman 2010). Review (Claude Opus 5.5, 17/11/2026): đạt (Đang tranh cãi). Tóm tắt O''Boyle 2011 (OpenAlex): ba dòng EI tương quan 0,24–0,30 với hiệu suất, dự báo thêm ngoài năng lực nhận thức và Big Five; Joseph 2015 (Europe PMC): mixed EI ρ = .29, "becomes nil (β = -.02) after controlling"; Joseph & Newman 2010: "positively predicts performance for high emotional labor jobs and negatively … for low". Khớp khung tranh-cai của trang nhà. Con số .17 ở trang nhà tri-tue-cam-xuc: chờ chủ repo (báo cáo).'
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1002/job.714
      - https://doi.org/10.1037/a0037681
      - https://doi.org/10.1037/a0017286
    luot_2_ghi_chu: Hai phân tích tổng hợp mâu thuẫn về phần dự báo thêm của EQ nên 'đang tranh cãi' hợp thước đo. Riêng vế 'nhiều hơn IQ' thì không phân tích tổng hợp nào ủng hộ (EQ năng lực tương quan thấp hơn năng lực nhận thức); review có thể cân nhắc nói rõ điều này trong giải thích.
  - id: g1
    cau: Thông điệp "EQ quan trọng hơn IQ" là của bìa Time năm 1995.
    loai: lich-su
    truong:
      - giai_thich
    nguon:
      - joseph2010
    trich: 'Trang nhà: "Đây là thông điệp trên trang bìa Time năm 1995 (EQ có thể là yếu tố dự báo thành công trong đời tốt nhất), không phải kết luận khoa học."'
    ket_qua: da-sua
    ghi_chu: Câu mới theo trang nhà; nguồn Time chưa có bản ghi, dùng câu đã khóa của trang nhà.
    luot_2: dung
    luot_2_nguon:
      - https://content.time.com/time/covers/0,16641,19951002,00.html
    luot_2_ghi_chu: Bìa Time 2/10/1995 có thông điệp này. Cũng là phụ đề sách của Goleman 1995 ('Why it can matter more than IQ'); nếu trang ngụ ý Time là nguồn gốc thì nên nói kèm Goleman.
  - id: g2
    cau: 'O''Boyle 2011: ba dòng đo EQ tương quan hiệu chỉnh .24–.30 với hiệu suất; dòng 2, 3 dự báo thêm ngoài IQ và Big Five.'
    loai: so-lieu
    truong:
      - giai_thich
    nguon:
      - oboyle2011
    trich: The three streams have corrected correlations ranging from 0.24 to 0.30 with job performance ... Streams 2 and 3 have the largest incremental validity beyond cognitive ability and the Five Factor Model
    ket_qua: da-sua
    ghi_chu: 'Cũ "không có bằng chứng nó dự báo thành công nghề nghiệp tốt hơn IQ": thay bằng hai phía của tranh luận.'
    luot_2: dung
    luot_2_nguon:
      - https://api.crossref.org/works/10.1002/job.714
  - id: g3
    cau: 'Joseph 2015: phần dự báo thêm của EQ dạng hỗn hợp gần bằng 0 khi kiểm soát đầy đủ.'
    loai: phat-hien
    truong:
      - giai_thich
    nguon:
      - joseph2015
    trich: 'Trang nhà: "Phe hoài nghi (Joseph và cộng sự, 2015) chỉ ra rằng với dòng mixed EI, giá trị gia tăng đó sụp đổ về gần bằng không (β = -.02) khi kiểm soát đầy đủ."'
    ket_qua: da-sua
    ghi_chu: Câu mới theo trang nhà.
    luot_2: dung
    luot_2_nguon:
      - https://pubmed.ncbi.nlm.nih.gov/25243996/
    luot_2_ghi_chu: 'Các biến kiểm soát: EQ năng lực, tự tin năng lực, tự đánh giá hiệu suất, Big Five, năng lực nhận thức chung.'
  - id: g4
    cau: 'Joseph & Newman 2010: liên hệ giữa EQ năng lực và hiệu suất không nhất quán: dương ở công việc nhiều lao động cảm xúc, âm ở công việc ít lao động cảm xúc.'
    loai: phat-hien
    truong:
      - giai_thich
    nguon:
      - joseph2010
    trich: relationships between ability-based EI and job performance are shown to be inconsistent (i.e., EI positively predicts performance for high emotional labor jobs and negatively predicts performance for low emotional labor jobs)
    ket_qua: da-sua
    ghi_chu: 'Câu mới theo trang nhà. Sau lượt 2 (Opus 5.5, 17/11/2026): Lượt 2 khong-chac với "ρ ≈ .17 ... thấp hơn năng lực nhận thức" (nguồn kể lại ghi .16 hay .18); tôi cũng không mở được toàn văn. Viết lại ở mức tóm tắt. Trang nhà tri-tue-cam-xuc (đã khóa) ghi ρ ≈ .17 (hồ sơ n43): ghi vào báo cáo, không sửa trang. Lượt 2 (với câu cũ): khong-chac (Không mở được toàn văn Joseph & Newman 2010 (tóm tắt không có hệ số). Nguồn kể lại ghi 0,16; nguồn khác ghi .18. Chưa xác nhận được ρ ≈ .17 và con số của năng lực nhận thức trong cùng bài.).'
    vi_tri: tóm tắt (Europe PMC)
    luot_2: dung
    luot_2_nguon: [ "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:%2210.1037/a0017286%22&resultType=core&format=json" ]
    luot_2_ghi_chu: Tóm tắt của Joseph & Newman 2010 (J Appl Psychol, doi 10.1037/a0017286) qua Europe PMC; chỉ đọc tóm tắt, tóm tắt nói đúng điều câu viết.
