ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Phân tích tổng hợp năm 2014 gộp 5 nghiên cứu đoàn hệ với hơn 1,25 triệu trẻ và 5 nghiên cứu bệnh-chứng, không tìm thấy liên hệ giữa tiêm chủng (kể cả vắc-xin sởi-quai bị-rubella) và tự kỷ: tỉ số odds gộp là 0,99, tức gần như bằng nhau giữa nhóm tiêm và không tiêm. Đây là một trong những ngộ nhận bị bác bỏ kỹ nhất trong y học.'' → mới ''Phân tích tổng hợp năm 2014 gộp 5 nghiên cứu đoàn hệ với hơn 1,25 triệu trẻ và 5 nghiên cứu bệnh-chứng, không tìm thấy liên hệ giữa tiêm chủng (kể cả vắc-xin sởi-quai bị-rubella) và tự kỷ: ở các nghiên cứu đoàn hệ, tỉ số odds gộp là 0,99, tức gần như bằng nhau giữa nhóm tiêm và không tiêm.'''
