    truong:
      - giai_thich
    nguon:
      - taylor2014
    trich: 'Five cohort studies involving 1,256,407 children, and five case-control studies involving 9,920 children ... no relationship between vaccination and autism (OR: 0.99; 95% CI: 0.92 to 1.06) ... nor ... MMR (OR: 0.84; 95% CI: 0.70 to 1.01)'
    ket_qua: da-sua
    ghi_chu: Thêm "ở các nghiên cứu đoàn hệ" cho OR 0,99. Bỏ câu "Đây là một trong những ngộ nhận bị bác bỏ kỹ nhất trong y học" (so sánh không có nguồn).
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1016/j.vaccine.2014.04.085" ]
    luot_2_ghi_chu: "Cohort: MMR OR 0,84 (0,70–1,01); case-control có OR 0,90 và 0,85 với p<0,05 theo chiều giảm."
