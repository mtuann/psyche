ghi_chu: 'Việc treo của kế hoạch: câu cũ "Big Five ... có bằng chứng dự báo tốt hơn" lệch trang MBTI (đã khóa, n24: "chưa có so sánh trực tiếp hai khung"); đã sửa cho khớp. Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Các đặc điểm tính cách phân bố liên tục, phần đông mọi người ở gần giữa. Chia đôi thành "loại" làm mất thông tin và khiến kết quả kém ổn định: nhiều người nhận loại khác khi làm lại sau vài tuần. Giới nghiên cứu dùng mô hình Big Five, đo theo các chiều liên tục và có bằng chứng dự báo tốt hơn.'' → mới ''Điểm của MBTI phân bố liên tục, không chia thành hai cụm, nên cắt đôi mỗi thang ở điểm giữa thành "loại" làm mất thông tin: hai người có điểm sát vạch nhận hai nhãn trái ngược, và nhiều người nhận loại khác khi làm lại sau vài tuần. Giới nghiên cứu thường dùng mô hình Big Five, đo theo các chiều liên tục; Big Five có bằng chứng dự báo hiệu quả công việc, còn MBTI chưa có bằng chứng tương đương (chưa có nghiên cứu so sánh trực tiếp hai khung).'' | nguon: cũ [''pittenger1993'', ''pittenger2005''] → mới [''pittenger1993'', ''pittenger2005'', ''mccrae1989'', ''barrick1991''] | trang: cũ None → mới ''kham-pha/tinh-cach/mbti'''
