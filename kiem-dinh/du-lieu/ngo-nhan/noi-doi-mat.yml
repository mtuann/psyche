  ghi_chu: 'Cũ "Phần lớn các dấu hiệu ... kể cả tránh nhìn, liên hệ rất yếu": đọc toàn văn (DukeSpace), tránh nhìn gần như bằng 0; nêu số dấu hiệu. Sau lượt 2 (Opus 5.5, 17/11/2026): Lượt 2 khong-chac (d chỉ có ở thân bài). Tôi đọc toàn văn từ kho lưu trữ công khai của Đại học Duke (DukeSpace, bản của tác giả, hdl.handle.net/10161/14941), Bảng 3: "027 Eye contact ... 0.01; 028 Gaze aversion ... 0.03". Giữ.'
  vi_tri: tóm tắt; Bảng 3
  luot_2: khong-chac
  luot_2_nguon:
  - https://doi.org/10.1037/0033-2909.129.1.74
  luot_2_ghi_chu: Tóm tắt DePaulo 2003 xác nhận 158 dấu hiệu, 'many behaviors showed no discernible links, or only weak links'; d = 0,01 và 0,03 của giao tiếp bằng mắt và tránh nhìn chỉ có trong thân bài, không có bản mở (đã tìm Europe PMC, PubMed, OpenAlex).
