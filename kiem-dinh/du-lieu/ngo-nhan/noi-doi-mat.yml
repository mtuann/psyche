ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Phân tích tổng hợp gần 25.000 người phán đoán cho thấy con người chỉ phân biệt đúng nói thật hay nói dối khoảng 54% số lần, chỉ hơn đoán may (50%) một chút. Phần lớn các dấu hiệu hành vi mà ta hay tin, kể cả tránh nhìn, liên hệ rất yếu với việc nói dối.'' → mới ''Phân tích tổng hợp gần 25.000 người phán đoán cho thấy con người chỉ phân biệt đúng nói thật hay nói dối khoảng 54% số lần, chỉ hơn đoán may (50%) một chút. Trong 158 dấu hiệu hành vi được tổng hợp ở một phân tích khác, nhiều dấu hiệu không liên hệ hoặc chỉ liên hệ yếu với việc nói dối; riêng nhìn vào mắt người đối diện và tránh nhìn thì gần như không liên hệ gì.'''
