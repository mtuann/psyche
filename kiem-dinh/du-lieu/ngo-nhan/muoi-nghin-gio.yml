ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Phân tích tổng hợp 88 nghiên cứu năm 2014 thấy luyện tập có chủ đích giải thích được 26% khác biệt thành tích trong game, 21% trong âm nhạc, 18% trong thể thao — nhưng chỉ 4% trong học tập và dưới 1% trong các ngành nghề. Luyện tập đúng cách rất quan trọng, nhưng “10.000 giờ” không phải công thức đảm bảo cho mọi lĩnh vực.'' → mới ''Phân tích tổng hợp năm 2014 thấy luyện tập có chủ đích giải thích được 26% khác biệt thành tích trong trò chơi (như cờ), 21% trong âm nhạc, 18% trong thể thao, nhưng chỉ 4% trong học tập và dưới 1% trong các ngành nghề. Luyện tập đúng cách quan trọng, nhưng "10.000 giờ" không phải công thức bảo đảm cho mọi lĩnh vực.'''
