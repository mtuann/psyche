ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Một thang đo phải chứng minh “độ giá trị” — điểm số thực sự phản ánh khái niệm cần đo, chứ không phải thứ gì khác na ná (Cronbach & Meehl, 1955). Tên gọi hay, câu hỏi nghe hợp lý không đảm bảo điều đó; phải kiểm tra bằng dữ liệu.'' → mới ''Một thang đo phải chứng minh "độ giá trị": điểm số thật sự phản ánh khái niệm cần đo, chứ không phải thứ gì khác. Cronbach và Meehl (1955) trình bày cách hiểu "giá trị cấu trúc" (construct validity). Tên gọi hay, câu hỏi nghe hợp lý không bảo đảm điều đó; phải kiểm tra bằng dữ liệu.'''
