ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Hàng trăm nghiên cứu nhỏ từng ủng hộ ý này. Nhưng hai dự án tái lập lớn, đăng ký trước, với 2.141 người ở 23 phòng thí nghiệm (2016) và 3.531 người ở 36 phòng thí nghiệm (2021, do chính một nhà nghiên cứu ủng hộ lý thuyết dẫn đầu) đều thấy hiệu ứng gần bằng 0. Người ủng hộ cho rằng cách gây "cạn kiệt" trong các thử nghiệm này quá yếu. Hiện nay, nếu có hiệu ứng thì nó rất nhỏ.'' → mới ''Một phân tích tổng hợp trước đây từng thấy hiệu ứng ở mức vừa. Nhưng hai dự án tái lập lớn, đăng ký trước, với 2.141 người ở 23 phòng thí nghiệm (2016) và 3.531 người ở 36 phòng thí nghiệm (2021) đều thấy hiệu ứng gần bằng 0 (d = 0,04 và 0,06). Hiện nay, nếu có hiệu ứng thì nó rất nhỏ.'''
