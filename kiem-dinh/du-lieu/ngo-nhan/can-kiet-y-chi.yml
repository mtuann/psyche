  ly_do: 'Thước đo mục 4: một tái lập lớn có đăng ký trước thất bại là điều kiện của Đang tranh cãi; ở đây có hai (2016, 2021), gần với "các kiểm tra đủ mạnh liên tục thất bại" của Đã bị bác bỏ. Giữ Đang tranh cãi vì hai trang đã khóa (bat-dau/doc-nhan-chac-chan, bang-chung/do-lon-hieu-ung) dùng chính ví dụ này với nhãn Đang tranh cãi; đổi nhãn thì phải mở khóa cả hai trang (ghi trong báo cáo).'
  ket_qua: dung
  luot_2: dung
  luot_2_nguon:
  - https://doi.org/10.1177/1745691616652873
  - https://doi.org/10.1177/0956797621989733
  luot_2_ghi_chu: 'Chỗ khó: hai tái lập lớn có đăng ký trước đều không thấy hiệu ứng; ''đang tranh cãi'' là mức thận trọng, có thể bàn nâng lên ''đã bị bác bỏ''.'
  ghi_chu: 'Sau lượt 2 (Opus 5.5, 17/11/2026): Lượt 2 dung, hỏi có nên Đã bị bác bỏ: giữ Đang tranh cãi để khớp trang đã khóa; đưa chủ repo quyết.'
