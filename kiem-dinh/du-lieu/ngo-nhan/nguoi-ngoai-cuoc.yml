muc: V3
lan:
  - so: 1
    ngay: '2026-11-17'
    nhanh: moi/d8-l3
    ma_bam: null
    nguoi:
      luot_1: Claude Opus 5.5 (agent làm lô D8-L3)
      luot_2: 'Claude Opus (agent riêng, phần a: plans/lam-lai/bao-cao/d8-l3-luot-2-a.yml); giải quyết chỗ lệch: Claude Opus 5.5 (agent làm lô), 18/11/2026'
      review: null
      kiem_mau: null
ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Trong phòng thí nghiệm, mỗi cá nhân đúng là ít ra tay hơn khi có người khác (phân tích tổng hợp năm 2011 xác nhận). Nhưng phân tích camera giám sát 219 vụ xung đột thật ở Anh, Hà Lan và Nam Phi (2020) cho thấy ít nhất một người can thiệp trong khoảng 9/10 vụ, và càng đông người thì càng có nhiều khả năng ai đó giúp. Hiệu ứng có thật ở cấp độ từng người, nhưng câu nói phổ biến ở trên thì gây hiểu lầm.'' → mới ''Trong các thí nghiệm, mỗi cá nhân đúng là ít ra tay hơn khi có người khác hiện diện (phân tích tổng hợp năm 2011 xác nhận), nhất là khi tình huống mập mờ. Nhưng phân tích camera giám sát 219 vụ xung đột thật ở Anh, Hà Lan và Nam Phi (2020) cho thấy khoảng 9 trên 10 vụ có ít nhất một người can thiệp, và càng đông người thì càng dễ có ai đó giúp. Hiệu ứng có thật ở cấp từng người, nhưng câu nói phổ biến ở trên thì gây hiểu lầm.'' | trang: cũ None → mới ''thi-nghiem/darley-latane'''
nguon:
  - id: fischer2011
    ten: 'Fischer và cộng sự (2011). The bystander-effect: A meta-analytic review on bystander intervention in dangerous and non-dangerous emergencies'
    link: https://doi.org/10.1037/a0023304
  - id: philpot2020
    ten: Philpot và cộng sự (2020). Would I be helped? Cross-national CCTV footage shows that intervention is the norm in public conflicts
    link: https://doi.org/10.1037/amp0000469
nhan_dinh:
  - id: nhan
    cau: '"Càng đông người chứng kiến, nạn nhân càng khó được giúp": đang tranh cãi.'
    loai: nhan
    truong:
      - khang_dinh
      - nhan
    nhan: tranh-cai
    nguon:
      - fischer2011
      - philpot2020
    co_so:
      - fischer2011
      - philpot2020
    ly_do: 'Trang nhà darley-latane (đã khóa): hiệu ứng ở mức cá nhân vững chắc (Fischer 2011), nhưng ở mức cả đám đông ngoài đời thì ngược lại (Philpot 2020). Câu nói về nạn nhân (mức nhóm) có bằng chứng hai chiều.'
    ket_qua: dung
    ghi_chu: 'chỗ khó: nhãn của khẳng định mức nhóm, khác nhãn vững chắc của hiệu ứng mức cá nhân ở trang nhà; lượt 2 xem lại.'
    luot_2: dung
    luot_2_nguon:
      - https://pubmed.ncbi.nlm.nih.gov/21534650/
      - https://pubmed.ncbi.nlm.nih.gov/31157529/
    luot_2_ghi_chu: Mỗi người ít giúp hơn (phòng thí nghiệm) nhưng ngoài đời nạn nhân vẫn thường được giúp; nhãn hợp.
  - id: g1
    cau: 'Phân tích tổng hợp 2011: có người khác hiện diện thì mỗi người ít giúp hơn; hiệu ứng yếu đi khi tình huống nguy hiểm rõ ràng.'
    loai: phat-hien
    truong:
      - giai_thich
    nguon:
      - fischer2011
    trich: 'Trang nhà darley-latane (đã khóa): "hiệu ứng yếu đi khi nguy hiểm rõ ràng"; Fischer 2011 (tóm tắt): the bystander effect was attenuated when situations were perceived as dangerous'
    ket_qua: da-sua
    ghi_chu: 'Thêm "nhất là khi tình huống mập mờ" cho khớp trang nhà; "Trong phòng thí nghiệm" thành "Trong các thí nghiệm". Sau lượt 2 (Opus 5.5, 18/11/2026): Theo lượt 2: biến điều tiết là mức nguy hiểm, không phải "mập mờ". Lượt 2 (với câu cũ): dung (Biến điều tiết trong bài là mức nguy hiểm, không phải ''mập mờ''; ''mập mờ'' là cách diễn giải theo lời giải thích của tác giả. Nên viết sát hơn: ''nhất là khi tình huống không nguy hiểm, khó nhận ra là khẩn cấp''.).'
    luot_2: dung
    luot_2_nguon: [ "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:%2210.1037/a0023304%22&resultType=core&format=json" ]
    luot_2_ghi_chu: Tóm tắt Fischer và cộng sự 2011 (Psychol Bull, doi 10.1037/a0023304).
  - id: g2
    cau: 'Camera 219 vụ xung đột ở Anh, Hà Lan, Nam Phi: khoảng 9/10 vụ có người can thiệp; càng đông càng dễ có người giúp.'
    loai: so-lieu
    truong:
      - giai_thich
    nguon:
      - philpot2020
    trich: 'Trang nhà: "Trong 219 xung đột công cộng quay bằng camera ở Anh, Hà Lan và Nam Phi, 9 trên 10 vụ có ít nhất một người ra tay giúp, và càng đông người chứng kiến thì càng dễ có ai đó giúp (Philpot và cộng sự, 2020)."'
    ket_qua: dung
    luot_2: dung
    luot_2_nguon:
      - https://pubmed.ncbi.nlm.nih.gov/31157529/
  - id: trang
    cau: Bài liên quan của thẻ là thi-nghiem/darley-latane
    loai: ve-site
    truong:
      - trang
    ket_qua: dung
    ghi_chu: Trang nhà đã khóa của hiệu ứng người ngoài cuộc, có cả Fischer 2011 và Philpot 2020.
