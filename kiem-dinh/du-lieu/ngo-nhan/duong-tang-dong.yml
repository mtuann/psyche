ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Phân tích tổng hợp năm 1995 gộp các thí nghiệm mù đôi có giả dược (cả trẻ, cha mẹ lẫn người quan sát đều không biết trẻ được ăn đường hay chất tạo ngọt) không thấy đường ảnh hưởng đến hành vi hay nhận thức của trẻ; không loại trừ được một hiệu ứng rất nhỏ ở một số trẻ. Kỳ vọng của người lớn, cùng bối cảnh như tiệc sinh nhật, có thể khiến họ "thấy" trẻ hiếu động hơn.'' → mới ''Phân tích tổng hợp năm 1995 gộp các thí nghiệm mù đôi có giả dược (cả trẻ, cha mẹ lẫn người nghiên cứu đều không biết trẻ được ăn đường hay chất tạo ngọt) không thấy đường ảnh hưởng đến hành vi hay nhận thức của trẻ; không loại trừ được một tác dụng nhỏ hay tác dụng ở một nhóm trẻ. Niềm tin mạnh của cha mẹ có thể đến từ kỳ vọng và những liên tưởng quen thuộc.'' | trang: cũ None → mới ''bang-chung/thi-nghiem-doi-chung'''
