    ten: Le Texier (2019). Debunking the Stanford Prison Experiment
    link: https://doi.org/10.1037/amp0000401
  - id: zimbardo2020
    ten: 'Zimbardo và cộng sự (2020). Continuing to acknowledge the power of dehumanizing environments: Comment on Haslam et al. (2019) and Le Texier (2019)'
    link: https://doi.org/10.1037/amp0000593
nhan_dinh:
  - id: nhan
    cau: 'Thí nghiệm nhà tù Stanford chứng minh hoàn cảnh biến người tốt thành kẻ ác: đang tranh cãi.'
    loai: nhan
    truong:
      - khang_dinh
      - nhan
    nhan: tranh-cai
    nguon:
      - letexier2019
      - zimbardo2020
    co_so:
      - letexier2019
      - zimbardo2020
    ly_do: Khớp khung tranh-cai[kết luận gốc tình huống biến người bình thường thành tàn ác] của trang nhà zimbardo (đã khóa).
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/amp0000401", "https://doi.org/10.1037/amp0000593", "https://doi.org/10.1037/amp0000627" ]
    luot_2_ghi_chu: "Chỗ khó: tranh luận giữa phê bình lưu trữ và phản hồi của tác giả gốc, không có tổng hợp; 'đang tranh cãi' hợp, không có tái lập đối chiếu."
  - id: g1
    cau: 'Le Texier 2019 (hồ sơ lưu trữ, phỏng vấn 15 người): cai ngục được hướng dẫn cụ thể, dữ liệu thiên lệch và không đủ, người tham gia hiếm khi nhập vai hoàn toàn.'
    loai: lich-su
    truong:
      - giai_thich
    nguon:
      - letexier2019
    trich: interviews with 15 of the participants ... the biased and incomplete collection of data ... the guards received precise instructions regarding the treatment of the prisoners ... participants were almost never completely immersed by the situation
    ket_qua: da-sua
    ghi_chu: Thêm "không đầy đủ" (incomplete).
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/amp0000401" ]
  - id: g2
    cau: Zimbardo và Haney (2020) phản hồi, bảo vệ sức mạnh của môi trường phi nhân tính.
    loai: lich-su
    truong:
      - giai_thich
    nguon:
      - zimbardo2020
    trich: 'Trang nhà (đã khóa): "Một bên (Zimbardo và các cộng sự, trong phản hồi năm 2020) vẫn bảo vệ sức mạnh của môi trường phi nhân tính (Zimbardo và Haney, 2020)"'
    ket_qua: da-sua
    ghi_chu: 'Cũ "Nhóm của Zimbardo đã phản bác, cho rằng phê bình này bỏ qua bối cảnh": viết theo trang nhà.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1037/amp0000593" ]
    luot_2_ghi_chu: American Psychologist 2020, 75(3), 400-402.
  - id: trang
    cau: Bài liên quan của thẻ là thi-nghiem/zimbardo
    loai: ve-site
    truong:
      - trang
    ket_qua: dung
    ghi_chu: 'Trang nhà đã khóa. Review (Claude Opus 5.5, 17/11/2026): thi-nghiem/zimbardo có trong trang.yml, đã khóa (khoa.json); dist/ngo-nhan/ hiện "Đọc thêm" trỏ đúng trang; trang bàn đúng ngộ nhận: khung tranh-cai[kết luận gốc tình huống biến người bình thường thành tàn ác].'
    review: dung
