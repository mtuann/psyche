ghi_chu: 'Thay nguồn hplt2019 (bản ghi PubMed của chính Le Texier 2019) bằng zimbardo2020 (phản hồi của Zimbardo và Haney, trang nhà dẫn). Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Điều tra lại hồ sơ lưu trữ và phỏng vấn 15 người tham gia (Le Texier, 2019) cho thấy các “cai ngục” đã được hướng dẫn cách đối xử với “tù nhân”, dữ liệu thu thập thiếu khách quan, và người tham gia hiếm khi thật sự “nhập vai”. Nhóm của Zimbardo đã phản bác, cho rằng phê bình này bỏ qua bối cảnh — nên đây vẫn là cuộc tranh luận mở, không phải kết luận đã ngã ngũ.'' → mới ''Điều tra lại hồ sơ lưu trữ và phỏng vấn 15 người tham gia (Le Texier, 2019) cho thấy các "cai ngục" đã được hướng dẫn cụ thể cách đối xử với "tù nhân", dữ liệu thu thập thiếu khách quan và không đầy đủ, và người tham gia hiếm khi thật sự nhập vai hoàn toàn. Zimbardo và Haney (2020) phản hồi, vẫn bảo vệ sức mạnh của môi trường phi nhân tính; đây vẫn là cuộc tranh luận mở.'' | nguon: cũ [''letexier2019'', ''hplt2019''] → mới [''letexier2019'', ''zimbardo2020''] | trang: cũ None → mới ''thi-nghiem/zimbardo'''
nguon:
