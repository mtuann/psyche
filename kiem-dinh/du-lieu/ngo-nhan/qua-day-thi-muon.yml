    ket_qua: dung
    ghi_chu: 'chỗ khó: một nghiên cứu (rất lớn, cắt ngang có mô hình hóa); lượt 2 xem có cần tổng quan.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/29729947/" ]
  - id: g1
    cau: 'Hartshorne 2018 (669.498 người): khả năng học ngữ pháp giữ gần nguyên đến 17,4 tuổi rồi giảm dần đều.'
    loai: so-lieu
    truong:
      - giai_thich
    nguon:
      - hartshorne2018
    trich: a dataset of unprecedented size (669,498 native and non-native English speakers) ... grammar-learning ability ... is preserved almost to the crux of adulthood (17.4 years old) and then declines steadily
    ket_qua: da-sua
    ghi_chu: Câu mới thay câu về Johnson & Newport 1989.
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/29729947/" ]
    luot_2_ghi_chu: Bài tiếp theo (Cognition 2021) mô tả là 'sharp decline' bắt đầu cuối tuổi vị thành niên.
  - id: g2
    cau: Khả năng giảm dần, không mất ngay sau dậy thì; người bắt đầu muộn khó đạt ngữ pháp như bản ngữ hơn.
    loai: phat-hien
    truong:
      - giai_thich
    nguon:
      - hartshorne2018
    trich: '"then declines steadily"; "The results support the existence of a sharply-defined critical period for language acquisition, but the age of offset is much later than previously speculated."'
    ket_qua: da-sua
    ghi_chu: 'Cũ "Người lớn vẫn học và dùng tốt ngoại ngữ; không có cánh cửa nào đóng sập": giữ ý giảm dần, bỏ "dùng tốt" (chưa có nguồn).'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC6559801/" ]
