ghi_chu: 'Thay Johnson & Newport 1989 (bản PDF trên trang cá nhân là bản quét, không đọc được chữ) bằng Hartshorne, Tenenbaum & Pinker 2018 (mẫu rất lớn). Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Tuổi bắt đầu càng sớm thì càng dễ đạt mức như người bản xứ ở ngữ pháp (Johnson & Newport, 1989) — nhưng đó là chuyện “giỏi đến mức nào”, không phải “học được hay không”. Người lớn vẫn học và dùng tốt ngoại ngữ; không có cánh cửa nào đóng sập sau dậy thì.'' → mới ''Một phân tích dữ liệu của 669.498 người nói tiếng Anh (2018) ước tính khả năng học ngữ pháp gần như giữ nguyên đến khoảng 17,4 tuổi rồi mới giảm dần đều, tức là muộn hơn tuổi dậy thì nhiều. Khả năng ấy giảm dần chứ không mất đi ngay sau dậy thì; người lớn vẫn học được ngoại ngữ, chỉ là khó đạt ngữ pháp như người bản ngữ hơn.'' | nguon: cũ [''johnson1989''] → mới [''hartshorne2018'']'
nguon:
  - id: hartshorne2018
    ten: 'Hartshorne và cộng sự (2018). A critical period for second language acquisition: Evidence from 2/3 million English speakers'
    link: https://doi.org/10.1016/j.cognition.2018.04.007
