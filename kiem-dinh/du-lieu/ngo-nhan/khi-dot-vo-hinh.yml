ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Trong thí nghiệm “con khỉ đột vô hình” năm 1999, người xem được nhờ đếm số lần chuyền bóng và khoảng một nửa không hề thấy một người mặc đồ khỉ đột đi ngang giữa màn hình. Hiện tượng “mù không chú ý” này cho thấy ta chỉ nhận thức được những gì mình đang chú ý đến — mắt “thấy” nhưng não không “ghi nhận”.'' → mới ''Trong thí nghiệm "con khỉ đột vô hình" năm 1999, người xem được nhờ đếm số đường chuyền bóng, và 46% trong 192 người không để ý đến sự kiện bất ngờ (một người mặc đồ khỉ đột hay một người phụ nữ cầm ô đi ngang qua). Các tác giả cho rằng ta chỉ nhận thức và nhớ được những gì nhận được sự chú ý tập trung: mắt nhìn thấy, nhưng ta không nhận ra.'' | trang: cũ None → mới ''thi-nghiem/khi-dot-vo-hinh'''
