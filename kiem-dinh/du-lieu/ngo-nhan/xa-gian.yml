    ly_do: 'Phân tích tổng hợp 154 nghiên cứu, 10.189 người: hoạt động tăng kích động không hiệu quả (g = −0,02); thí nghiệm 2002 thấy ngược với lý thuyết xả giận.'
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1016/j.cpr.2024.102414", "https://doi.org/10.1177/0146167202289002" ]
    luot_2_ghi_chu: Phân tích tổng hợp 154 nghiên cứu (2024) và thí nghiệm Bushman 2002; đạt thước đo 'bác bỏ'.
  - id: g1
    cau: 'Thí nghiệm 2002: nhóm đấm bao cát và nghĩ về người làm mình giận giận hơn và hung hăng nhất, so với nhóm không đấm bao cát.'
    loai: phat-hien
    truong:
      - giai_thich
    nguon:
      - bushman2002
    trich: People in the rumination group felt angrier than did people in the distraction or control groups. People in the rumination group were also most aggressive ... There also was a no punching bag control group.
    ket_qua: da-sua
    ghi_chu: 'Cũ "so với người ngồi yên": nhóm đối chứng là nhóm không đấm bao cát; sửa cho đúng.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1177/0146167202289002" ]
    luot_2_ghi_chu: Bushman 2002, PSPB 28(6) 724-731.
  - id: g2
    cau: 'Phân tích tổng hợp 2024, 154 nghiên cứu: hoạt động làm dịu (thở sâu, chánh niệm, thiền) giảm giận; hoạt động tăng kích động (đấm bao cát, chạy bộ) nhìn chung không tác dụng.'
    loai: so-lieu
    truong:
      - giai_thich
    nguon:
      - kjaervik2024
    trich: arousal-decreasing activities (e.g., deep breathing, mindfulness, meditation) ... based on 154 studies ... arousal-decreasing activities decreased anger and aggression (g = -0.63) ... arousal-increasing activities were ineffective overall (g = -0.02)
    ket_qua: da-sua
    ghi_chu: 'Cũ "thở chậm, thư giãn cơ, chánh niệm"; tóm tắt nêu thở sâu, chánh niệm, thiền. Cũ "như trút giận gần như không có tác dụng": nêu đúng ví dụ của bài.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1016/j.cpr.2024.102414" ]
