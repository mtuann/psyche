ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Trong một thí nghiệm năm 2002, người đấm bao cát trong lúc nghĩ về người làm mình giận lại giận và hung hăng hơn so với người ngồi yên. Phân tích tổng hợp năm 2024 gộp 154 nghiên cứu cho thấy các hoạt động làm dịu cơ thể (thở chậm, thư giãn cơ, chánh niệm) giảm giận rõ rệt, còn các hoạt động làm tăng kích động như trút giận gần như không có tác dụng.'' → mới ''Trong một thí nghiệm năm 2002, người đấm bao cát trong lúc nghĩ về người làm mình giận lại giận và hung hăng hơn so với người không đấm bao cát. Phân tích tổng hợp năm 2024 gộp 154 nghiên cứu cho thấy các hoạt động làm dịu cơ thể (thở sâu, chánh niệm, thiền) giảm giận rõ rệt, còn các hoạt động làm tăng kích động như đấm bao cát hay chạy bộ nhìn chung không có tác dụng.'''
nguon:
  - id: bushman2002
    ten: Bushman (2002). Does venting anger feed or extinguish the flame? Catharsis, rumination, distraction, anger, and aggressive responding
    link: https://doi.org/10.1177/0146167202289002
  - id: kjaervik2024
    ten: 'Kjærvik và cộng sự (2024). A meta-analytic review of anger management activities that increase or decrease arousal: What fuels or douses rage?'
    link: https://doi.org/10.1016/j.cpr.2024.102414
nhan_dinh:
  - id: nhan
    cau: 'Trút giận (đấm gối, la hét) giúp bớt giận: đã bị bác bỏ.'
    loai: nhan
    truong:
      - khang_dinh
