ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''"Hiệu ứng kiểm tra" đã được lặp lại rất nhiều lần, ở cả phòng thí nghiệm lẫn lớp học. Trong một thí nghiệm năm 2006, người tự kiểm tra nhớ kém hơn một chút sau 5 phút nhưng nhớ tốt hơn rõ rệt sau một tuần so với người đọc lại. Bài tổng quan năm 2013 xếp tự kiểm tra vào nhóm kỹ thuật học hiệu quả cao, còn đọc lại và tô đậm vào nhóm hiệu quả thấp.'' → mới ''"Hiệu ứng kiểm tra" đã được lặp lại nhiều lần. Trong một thí nghiệm năm 2006, người đọc lại nhớ tốt hơn một chút ở bài kiểm tra sau 5 phút, nhưng người tự kiểm tra nhớ tốt hơn rõ rệt ở bài kiểm tra sau 2 ngày và sau một tuần. Bài tổng quan năm 2013 xếp tự kiểm tra vào nhóm kỹ thuật học hiệu quả cao, còn đọc lại và tô đậm vào nhóm hiệu quả thấp.'' | trang: cũ ''kham-pha/tri-nho/vi-sao-ta-quen'' → mới ''kham-pha/tri-nho/duong-cong-quen'''
