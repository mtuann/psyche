ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Can thiệp “tư duy về stress” (Crum và cộng sự, 2013) cho thấy nhóm được hướng dẫn nhìn stress tích cực tự báo cáo làm việc tốt hơn sau một tuần. Nhưng hiệu ứng còn nhỏ, đo bằng tự báo cáo, và việc tái lập đúng giao thức gốc vẫn là câu hỏi mở — chưa đủ để nói “nghĩ tích cực là đủ”.'' → mới ''Nhiều thử nghiệm cho thấy niềm tin về stress đổi được qua một can thiệp ngắn. Các thử nghiệm của Crum và cộng sự (2013, 2023) cho kết quả tích cực về sức khỏe và hiệu quả làm việc, nhưng chủ yếu là tự báo cáo; các nhóm khác thấy kết quả chưa nhất quán, nhất là ở chỉ số sinh lý. Vì vậy chưa đủ để nói "nghĩ tích cực là đủ".'' | nguon: cũ [''crum2013''] → mới [''crum2013'', ''crum2023'']'
