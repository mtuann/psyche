ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Can thiệp “tư duy về stress” (Crum và cộng sự, 2013) cho thấy nhóm được hướng dẫn nhìn stress tích cực tự báo cáo làm việc tốt hơn sau một tuần. Nhưng hiệu ứng còn nhỏ, đo bằng tự báo cáo, và việc tái lập đúng giao thức gốc vẫn là câu hỏi mở — chưa đủ để nói “nghĩ tích cực là đủ”.'' → mới ''Nhiều thử nghiệm cho thấy niềm tin về stress đổi được qua một can thiệp ngắn. Các thử nghiệm của Crum và cộng sự (2013, 2023) cho kết quả tích cực về sức khỏe và hiệu quả làm việc, nhưng chủ yếu là tự báo cáo; các nhóm khác thấy kết quả chưa nhất quán, nhất là ở chỉ số sinh lý. Vì vậy chưa đủ để nói "nghĩ tích cực là đủ".'' | nguon: cũ [''crum2013''] → mới [''crum2013'', ''crum2023'']'
nguon:
  - id: crum2013
    ten: 'Crum và cộng sự (2013). Rethinking stress: The role of mindsets in determining the stress response'
    link: https://doi.org/10.1037/a0031201
  - id: crum2023
    ten: 'Crum và cộng sự (2023). Evaluation of the "rethink stress" mindset intervention: A metacognitive approach to changing mindsets'
    link: https://doi.org/10.1037/xge0001396
nhan_dinh:
  - id: nhan
    cau: 'Chỉ cần nghĩ tích cực về stress thì stress tự thành có lợi: đang tranh cãi.'
    loai: nhan
    truong:
      - khang_dinh
      - nhan
    nhan: tranh-cai
    nguon:
      - crum2013
      - crum2023
    co_so:
      - crum2013
      - crum2023
    ly_do: Khớp khung tranh-cai[đổi niềm tin có giúp khỏe hơn và làm việc tốt hơn?] của trang nhà stress-co-hai (đã khóa).
    ket_qua: dung
    luot_2: khong-chac
    luot_2_nguon:
      - https://doi.org/10.1037/a0031201
      - https://doi.org/10.1037/xge0001396
      - https://pubmed.ncbi.nlm.nih.gov/35794485/
    luot_2_ghi_chu: 'Chỗ khó: câu ''chỉ cần nghĩ tích cực... stress tự thành có lợi'' mạnh hơn bằng chứng (can thiệp quan niệm về stress cho lợi ích khiêm tốn, chủ yếu tự báo cáo; Yeager 2022 thấy lợi ích với căng thẳng sinh lý ở thanh thiếu niên). Không tìm được tổng hợp mở để quyết ''đang tranh cãi''. Nên xem lại nhãn: có thể qua-manh nếu câu giữ chữ ''chỉ cần''.'
    ghi_chu: 'Sau lượt 2 (Opus 5.5, 17/11/2026): Lượt 2 khong-chac, gợi ý chữ "chỉ cần" mạnh hơn bằng chứng. Giữ Đang tranh cãi cho khớp khung tranh-cai của trang nhà stress-co-hai (đã khóa): khẳng định là ngộ nhận được đem ra kiểm, nhãn nói tình trạng bằng chứng về lợi ích của việc đổi niềm tin (khiêm tốn, chủ yếu tự báo cáo). Lượt 2 bổ sung xem lại nếu muốn "Đã bị bác bỏ" cho chữ "chỉ cần".'
  - id: g1
    cau: Niềm tin về stress đổi được qua can thiệp ngắn.
    loai: phat-hien
    truong:
      - giai_thich
    nguon:
      - crum2013
    trich: 'In Study 2, we demonstrate that stress mindsets can be altered by watching short, multimedia film clips (tóm tắt); trang nhà: khung kha-vung[niềm tin về stress có thể thay đổi qua can thiệp ngắn]'
    ket_qua: da-sua
    ghi_chu: Câu mới theo trang nhà.
    luot_2: dung
    luot_2_nguon:
      - https://doi.org/10.1037/a0031201
      - https://doi.org/10.1037/xge0001396
  - id: g2
    cau: 'Crum 2013, 2023: kết quả tích cực nhưng chủ yếu tự báo cáo; các nhóm khác chưa nhất quán, nhất là chỉ số sinh lý.'
    loai: phat-hien
    truong:
      - giai_thich
    nguon:
      - crum2013
      - crum2023
    trich: 'Trang nhà: "Các thử nghiệm của Crum và cộng sự (2013, 2023) cho kết quả tích cực, nhưng ở các biến sức khỏe và hiệu suất đó chủ yếu là tự báo cáo. Các nhóm khác thấy kết quả chưa nhất quán, nhất là ở chỉ số sinh lý"'
    ket_qua: da-sua
    ghi_chu: 'Cũ "hiệu ứng còn nhỏ ... việc tái lập đúng giao thức gốc vẫn là câu hỏi mở": viết theo trang nhà. Sau lượt 2 (Opus 5.5, 17/11/2026): Lượt 2 xác nhận phần Crum (tự báo cáo), chưa thấy nguồn mở cho "các nhóm khác chưa nhất quán". Câu theo trang nhà đã khóa (khung tranh-cai: phân tích tổng hợp 2019 không thấy khác biệt sinh lý; hồ sơ trang nhà đã qua hai lượt). Giữ.'
    luot_2: khong-chac
    luot_2_nguon:
      - https://doi.org/10.1037/a0031201
      - https://doi.org/10.1037/xge0001396
    luot_2_ghi_chu: Đã xác nhận Crum 2023 báo cáo chủ yếu tự khai và Crum 2013 có cortisol; chưa tìm được nguồn mở cho 'các nhóm khác chưa nhất quán, nhất là chỉ số sinh lý' (Europe PMC, PubMed).
