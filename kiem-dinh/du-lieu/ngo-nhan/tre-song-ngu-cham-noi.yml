ghi_chu: 'chỗ khó: bỏ link tới kham-pha/phat-trien/tre-hoc-noi (trang ấy không bàn về song ngữ). Thêm nguồn Hoff 2012 (bậc 1) vì nguồn cũ là bài giảng của I-LABS (viện nghiên cứu, không bình duyệt). Cơ sở còn mỏng: một nghiên cứu ở gia đình có điều kiện kinh tế cao; cần tổng quan. Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Trẻ song ngữ đạt các mốc ngôn ngữ — bập bẹ, từ đầu tiên, ghép từ — ở cùng độ tuổi với trẻ đơn ngữ, miễn là tính cả hai ngôn ngữ. Cảm giác “chậm” thường đến từ việc chỉ đếm số từ của một ngôn ngữ.'' → mới ''Trẻ học hai ngôn ngữ từ nhỏ đạt các mốc ngôn ngữ ở cùng độ tuổi với trẻ đơn ngữ, như nói từ đầu tiên vào khoảng 12 tháng. Nếu chỉ so một ngôn ngữ, trẻ song ngữ có thể biết ít từ hơn trẻ đơn ngữ; nhưng tính cả hai ngôn ngữ thì tổng vốn từ tương đương (nghiên cứu năm 2012 ở trẻ 22–30 tháng).'' | nguon: cũ [''ilabs-bilingual''] → mới [''hoff2012'', ''ilabs-bilingual''] | trang: cũ ''kham-pha/phat-trien/tre-hoc-noi'' → mới None'
nguon:
  - id: hoff2012
    ten: Hoff và cộng sự (2012). Dual language exposure and early bilingual development
    link: https://doi.org/10.1017/s0305000910000759
  - id: ilabs-bilingual
    ten: Institute for Learning & Brain Sciences và cộng sự (n.d.). Milestones in bilingual language acquisition
    link: https://modules.ilabs.uw.edu/module/bilingual-language-development/milestones-in-bilingual-language-acquisition/
  - id: petitto2001
    ten: 'Petitto (2001). Bilingual signed and spoken language acquisition from birth: Implications for the mechanisms underlying early bilingual language acquisition'
    link: https://doi.org/10.1017/s0305000901004718
nhan_dinh:
  - id: nhan
    cau: 'Trẻ học hai ngôn ngữ cùng lúc sẽ chậm nói: đã bị bác bỏ.'
    loai: nhan
    truong:
      - khang_dinh
      - nhan
    nhan: bac-bo
    nguon:
      - hoff2012
      - petitto2001
      - ilabs-bilingual
    co_so:
      - hoff2012
      - petitto2001
      - ilabs-bilingual
    ly_do: 'Hai nghiên cứu bậc 1 (Petitto 2001: mốc cùng lúc; Hoff 2012: tổng vốn từ tương đương) cùng chiều với bài giảng của I-LABS. Cơ sở mỏng (mẫu nhỏ, gia đình kinh tế cao), chưa có tổng quan: chỗ khó còn lại.'
    ket_qua: dung
    ghi_chu: 'chỗ khó: xem ghi_chu hồ sơ.'
    luot_2: dung
    luot_2_nguon:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC6168212/
      - https://pubmed.ncbi.nlm.nih.gov/11449947/
    luot_2_ghi_chu: So từng ngôn ngữ thì vốn từ trẻ song ngữ thấp hơn (Hoff 2012); trang nên giữ sắc thái này.
  - id: g1
    cau: 'Petitto 2001 (6 trẻ song ngữ, theo dõi một năm): trẻ đạt các mốc ngôn ngữ đầu đời ở mỗi ngôn ngữ cùng lúc, như trẻ đơn ngữ.'
    loai: phat-hien
    truong:
      - giai_thich
    nguon:
      - petitto2001
      - ilabs-bilingual
    trich: Three children acquiring Langues des Signes Québécoise and French, and three children acquiring French and English ... videotaped regularly over one year ... both groups achieved their early linguistic milestones in each of their languages at the same time (and similarly to monolinguals)
    ket_qua: da-sua
    ghi_chu: 'Cũ "bập bẹ, từ đầu tiên, ghép từ ... miễn là tính cả hai ngôn ngữ": viết theo đúng trang nguồn. Sau lượt 2 (Opus 5.5, 17/11/2026): Bỏ "từ đầu tiên khoảng 12 tháng" (chỉ có ở bài giảng I-LABS); dùng nguồn lượt 2 tìm. Lượt 2 (với câu cũ): khong-chac (Vế mốc ngôn ngữ cùng tuổi đúng (Petitto 2001, mẫu nhỏ). Vế ''từ đầu tiên khoảng 12 tháng'' không có trong các tóm tắt và toàn văn đã đọc.).'
    vi_tri: tóm tắt (PubMed 11449947)
    luot_2: dung
    luot_2_nguon: [ "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:%2210.1017/s0305000901004718%22&resultType=core&format=json" ]
    luot_2_ghi_chu: Tóm tắt Petitto và cộng sự 2001 (J Child Lang); 3 + 3 = 6 trẻ.
  - id: g2
    cau: 'Hoff 2012 (22–30 tháng): so từng ngôn ngữ, trẻ đơn ngữ hơn về từ vựng và ngữ pháp; tổng vốn từ tương đương.'
    loai: phat-hien
    truong:
      - giai_thich
    nguon:
      - hoff2012
    trich: compared the language development of equivalently high-SES samples of bilingually and monolingually developing children from 1 ; 10 to 2 ; 6. The monolingually developing children were significantly more advanced ... in single language comparisons, but they were comparable on a measure of total vocabulary.
    ket_qua: da-sua
    ghi_chu: 'Cũ "Cảm giác chậm thường đến từ việc chỉ đếm số từ của một ngôn ngữ": thay bằng kết quả có nguồn.'
    luot_2: dung
    luot_2_nguon:
      - https://pubmed.ncbi.nlm.nih.gov/21418730/
