ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Phân tích tổng hợp 78 nghiên cứu năm 1993 xác nhận hiện tượng “lười xã hội”: mỗi cá nhân thường bỏ ít nỗ lực hơn khi làm chung so với khi làm riêng, nhất là khi đóng góp của từng người khó được đánh giá. Nhóm chỉ vượt trội khi có phân công rõ ràng, trách nhiệm cá nhân và công việc có ý nghĩa — còn “càng đông càng tốt” thì không đúng.'' → mới ''Phân tích tổng hợp 78 nghiên cứu năm 1993 xác nhận hiện tượng "lười xã hội": mỗi người thường bỏ ít công sức hơn khi làm chung so với khi làm riêng, ở nhiều loại việc và nhiều nhóm người. Mức lười thay đổi theo hoàn cảnh: nó chịu ảnh hưởng mạnh của việc đóng góp của từng người có được đánh giá không, kỳ vọng về đồng đội, ý nghĩa của công việc và văn hóa.'''
