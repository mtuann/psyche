ghi_chu: 'Bỏ thí nghiệm 96 sinh viên (nguồn thoi-mien-osu: thông cáo báo chí về một báo cáo hội nghị, bậc 3, chưa thấy bài đăng có bình duyệt). Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Tổng quan năm 2025 về các nghiên cứu của Steven Jay Lynn kết luận thôi miên không giúp nhớ chính xác hơn trong bất kỳ nghiên cứu nào, thậm chí có khi còn làm tệ đi; ngược lại, nó làm tăng việc nhớ ra những chuyện chưa từng xảy ra và khiến người ta tự tin hơn vào ký ức sai. Trong một thí nghiệm với 96 sinh viên, nhóm bị thôi miên không đoán đúng ngày tháng các sự kiện hơn nhóm đối chứng, nhưng lại ít chịu sửa đáp án khi được báo có thể sai.'' → mới ''Một tổng quan năm 2025 về các nghiên cứu của Steven Jay Lynn kết luận: trong mọi nghiên cứu, thôi miên không giúp nhớ chính xác hơn, có khi còn làm nhớ kém đi. Ngược lại, trong nhiều nghiên cứu, thôi miên làm người ta "nhớ" ra những chuyện chưa từng xảy ra, ký ức ấy tồn tại lâu, và người ta khá tự tin vào nó.'' | nguon: cũ [''krackow2025'', ''thoi-mien-osu''] → mới [''krackow2025'']'
nguon:
- id: krackow2025
  ten: Krackow và cộng sự (2025). Does hypnosis aid memory retrieval? A review of Steven Jay Lynn's research
  link: https://doi.org/10.1080/00207144.2025.2508410
- id: steblay1994
  ten: 'Steblay (1994). Evidence for hypnotically refreshed testimony: The view from the laboratory'
  link: https://doi.org/10.1007/bf01499329
nhan_dinh:
- id: nhan
  cau: 'Thôi miên giúp nhớ lại chính xác: đã bị bác bỏ.'
  loai: nhan
  truong:
  - khang_dinh
  - nhan
  nhan: bac-bo
  nguon:
  - krackow2025
  - steblay1994
  co_so:
  - krackow2025
  - steblay1994
  ly_do: 'Thước đo mục 4, Đã bị bác bỏ cho khẳng định "giúp nhớ lại chính xác": tổng quan 2025 (không nghiên cứu nào của Lynn thấy tăng nhớ chính xác) và phân tích tổng hợp 1994 (24 nghiên cứu: chỉ một điều kiện nghiêng về thôi miên, các điều kiện khác ngược lại, lỗi và ký ức giả tăng, tự tin tăng). Không có tổng hợp nào ủng hộ khẳng định như viết.'
  ket_qua: dung
  ghi_chu: 'chỗ khó: cơ sở là tổng quan tường thuật các nghiên cứu của một nhóm (Lynn); lượt 2 xem có cần tổng quan rộng hơn. Sau lượt 2 (Opus 5.5, 18/11/2026): Giữ Đã bị bác bỏ; thêm Steblay 1994 vào co_so và vào thẻ để nói rõ kết quả lẫn lộn, như lượt 2 gợi ý.'
  luot_2: dung
  luot_2_nguon:
  - https://pubmed.ncbi.nlm.nih.gov/40574575/
  - https://doi.org/10.1007/bf01499329
  luot_2_ghi_chu: Phân tích tổng hợp 1994 có một điều kiện nghiêng về thôi miên (câu hỏi không dẫn dắt, trễ 1–2 ngày, d = 0,46) nhưng các điều kiện khác ngược lại, kèm nhiều lỗi và ký ức giả. Khẳng định 'nhớ lại chính xác' không đứng vững; review có thể cân nhắc nhắc kết quả lẫn lộn này.
- id: g1
  cau: 'Tổng quan 2025 về các nghiên cứu của Steven Jay Lynn: thôi miên không làm tăng nhớ chính xác ở nghiên cứu nào trong số đó, có khi cản trở.'
  loai: phat-hien
  truong:
  - giai_thich
  nguon:
  - krackow2025
  trich: Hypnosis did not enhance accurate recall in any study and in some cases impeded recall.
  ket_qua: da-sua
  luot_2: qua-manh
  luot_2_nguon:
  - https://pubmed.ncbi.nlm.nih.gov/40574575/
  luot_2_ghi_chu: 'câu đúng: Tổng quan 2025 về các nghiên cứu của Steven Jay Lynn: thôi miên không làm tăng nhớ chính xác ở nghiên cứu nào trong số đó, có khi cản trở.; ''Bất kỳ nghiên cứu nào'' chỉ trong phạm vi các nghiên cứu của Lynn, không phải mọi nghiên cứu; phân tích tổng hợp Steblay & Bothwell 1994 có một điều kiện thôi miên giúp nhớ đúng hơn.'
  ghi_chu: 'Sau lượt 2 (Opus 5.5, 18/11/2026): Đồng ý lượt 2 (qua-manh), lấy đúng cau_dung: phạm vi là các nghiên cứu của Lynn.'
- id: g2
  cau: Thôi miên làm tăng việc nhớ ra chuyện chưa từng xảy ra; ký ức ấy tồn tại lâu và người ta khá tự tin vào nó.
  loai: phat-hien
  truong:
  - giai_thich
  nguon:
  - krackow2025
  trich: In numerous studies, hypnosis increased recall of never-experienced events; this recall persisted over time, and participants were at least moderately confident in their recall of these never-experienced events.
  ket_qua: da-sua
  ghi_chu: 'Cũ "khiến người ta tự tin hơn vào ký ức sai": nguồn nói "ít nhất khá tự tin", không so sánh; sửa.'
  luot_2: dung
  luot_2_nguon:
  - https://pubmed.ncbi.nlm.nih.gov/40574575/
