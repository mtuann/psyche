- id: g4
  cau: 'Steblay & Bothwell 1994 (24 nghiên cứu): thôi miên giúp nhớ đúng hơn với câu hỏi không dẫn dắt sau 1–2 ngày (d = 0,46), nhưng kém hơn khi hỏi trong 24 giờ (d = −0,29) hay sau một tuần (d = −0,24); nhiều lỗi và ký ức giả hơn, tự tin hơn.'
  loai: so-lieu
  truong:
  - giai_thich
  nguon:
  - steblay1994
  trich: meta-analytic review of 24 research studies. Recall accuracy for nonleading questions after a 1- to 2-day delay favored the hypnotized subjects (d=.46); however, less accurate recall was evidenced for hypnotized subjects following a delay of less tan 24 hours (d=−.29) or a one-week delay (d=−.24). The recall of hypnotized subjects also displayed more intrusion of uncued errors and higher levels of pseudomemory. Hypnotized subjects also expressed higher levels of confidence
  vi_tri: tóm tắt (Europe PMC)
  ket_qua: da-sua
  ghi_chu: 'Sau lượt 2 (Opus 5.5, 18/11/2026): Câu mới theo ghi chú của lượt 2 (nguồn tự mở).'
