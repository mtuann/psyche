ghi_chu: 'Bỏ thí nghiệm 96 sinh viên (nguồn thoi-mien-osu: thông cáo báo chí về một báo cáo hội nghị, bậc 3, chưa thấy bài đăng có bình duyệt). Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Tổng quan năm 2025 về các nghiên cứu của Steven Jay Lynn kết luận thôi miên không giúp nhớ chính xác hơn trong bất kỳ nghiên cứu nào, thậm chí có khi còn làm tệ đi; ngược lại, nó làm tăng việc nhớ ra những chuyện chưa từng xảy ra và khiến người ta tự tin hơn vào ký ức sai. Trong một thí nghiệm với 96 sinh viên, nhóm bị thôi miên không đoán đúng ngày tháng các sự kiện hơn nhóm đối chứng, nhưng lại ít chịu sửa đáp án khi được báo có thể sai.'' → mới ''Một tổng quan năm 2025 về các nghiên cứu của Steven Jay Lynn kết luận: trong mọi nghiên cứu, thôi miên không giúp nhớ chính xác hơn, có khi còn làm nhớ kém đi. Ngược lại, trong nhiều nghiên cứu, thôi miên làm người ta "nhớ" ra những chuyện chưa từng xảy ra, ký ức ấy tồn tại lâu, và người ta khá tự tin vào nó.'' | nguon: cũ [''krackow2025'', ''thoi-mien-osu''] → mới [''krackow2025'']'
