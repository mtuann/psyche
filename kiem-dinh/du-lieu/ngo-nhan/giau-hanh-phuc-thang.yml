ghi_chu: 'chỗ khó: trang nhà tien-va-hanh-phuc (đã khóa) xếp "tiền có mua được hạnh phúc cảm xúc không?" và "con số 75.000 USD" vào Đang tranh cãi. Thẻ giữ Đã bị bác bỏ vì khẳng định nói về hình dạng "đường thẳng", mà mọi bộ dữ liệu đã kể đều thấy quan hệ theo logarit; lượt 2 (Opus) xem lại. Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Kahneman và Deaton (2010) thấy hạnh phúc cảm xúc chững lại quanh ngưỡng khoảng 75.000 USD/năm, trong khi đánh giá cuộc sống vẫn tăng chậm theo thu nhập. Nghiên cứu sau này (Killingsworth, 2021) thấy hạnh phúc vẫn tăng tiếp nhưng không đều — tóm lại không phải đường thẳng vô hạn.'' → mới ''Kahneman và Deaton (2010) thấy đánh giá cuộc sống tăng theo logarit thu nhập, còn hạnh phúc cảm xúc không cải thiện thêm sau khoảng 75.000 USD/năm. Killingsworth (2021) đo cảm xúc theo thời gian thực và thấy hạnh phúc vẫn tăng theo logarit thu nhập, không có ngưỡng; mâu thuẫn này được hòa giải năm 2023 trên dữ liệu người Mỹ nhưng vẫn còn bị bình luận. Dù theo cách nào, quan hệ là theo logarit: thu nhập càng cao, mỗi đồng thêm vào đi cùng mức tăng hạnh phúc càng nhỏ, không phải đường thẳng.'' | nguon: cũ [''kahneman2010''] → mới [''kahneman2010'', ''killingsworth2021'', ''killingsworth2023'']'
