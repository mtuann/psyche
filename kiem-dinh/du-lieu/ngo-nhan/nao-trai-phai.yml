  trich: Lateralized brain regions subserve functions such as language and visuospatial processing.
  ket_qua: dung
- id: g2
  cau: 'Phân tích ảnh chụp não lúc nghỉ của 1.011 người 7–29 tuổi: lệch bán cầu là đặc điểm cục bộ, không có kiểu "não trái hơn" hay "não phải hơn" trên toàn bộ não.'
  loai: phat-hien
  truong:
  - giai_thich
  nguon:
  - nielsen2013
  trich: Data were analyzed from publicly available resting state scans for 1011 individuals between the ages of 7 and 29 ... Lateralization of brain connections appears to be a local rather than global property of brain networks, and our data are not consistent with a whole-brain phenotype of greater "left-brained" or greater "right-brained" network strength across individuals.
  ket_qua: da-sua
  ghi_chu: 'Cũ: "không thấy ai có toàn bộ mạng lưới bên trái hay bên phải mạnh hơn hẳn" (mạnh hơn bài: bài nói về kiểu hình toàn não ở cấp quần thể); viết theo tóm tắt và trang nhà.'
