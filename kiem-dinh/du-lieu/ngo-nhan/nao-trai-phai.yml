  co_so:
  - nielsen2013
  ly_do: Khớp khung bac-bo của trang nhà nao-che-doi (đã khóa); Nielsen 2013 (1.011 người) không thấy kiểu não toàn cục. Corballis 2014 (trang nhà dẫn) chưa có bản ghi nguồn.
  ket_qua: dung
  luot_2: khong-chac
  luot_2_nguon:
  - https://doi.org/10.1371/journal.pone.0071275
  luot_2_ghi_chu: 'Chỗ khó: chỉ Nielsen 2013 (một nghiên cứu lớn, tóm tắt đọc được bị cắt kết luận); đã tìm Europe PMC, PubMed không thấy tổng hợp mở để đối chiếu nhãn ''bác bỏ''.'
  ghi_chu: 'Sau lượt 2 (Opus 5.5, 18/11/2026): Lượt 2 khong-chac (tóm tắt đọc được bị cắt). Tôi đọc đủ tóm tắt Nielsen 2013 trên Europe PMC: "our data are not consistent with a whole-brain phenotype of greater left-brained or greater right-brained network strength"; nhãn khớp khung bac-bo của trang nhà nao-che-doi (đã khóa, cũng dẫn tổng quan Corballis 2014). Giữ Đã bị bác bỏ.'
- id: g1
  cau: Ngôn ngữ thường thiên về bán cầu trái; đó là chuyên biệt hóa chức năng.
  loai: phat-hien
  truong:
  - giai_thich
  nguon:
  - nielsen2013
  trich: Lateralized brain regions subserve functions such as language and visuospatial processing.
  ket_qua: dung
  luot_2: khong-chac
  luot_2_ghi_chu: Chưa mở nguồn.
  ghi_chu: 'Sau lượt 2 (Opus 5.5, 18/11/2026): Lượt 2 chưa mở nguồn; câu có trong tóm tắt Nielsen 2013 ("Lateralized brain regions subserve functions such as language").'
- id: g2
  cau: 'Phân tích ảnh chụp não lúc nghỉ của 1.011 người 7–29 tuổi: lệch bán cầu là đặc điểm cục bộ, không có kiểu "não trái hơn" hay "não phải hơn" trên toàn bộ não.'
  loai: phat-hien
  truong:
  - giai_thich
  nguon:
  - nielsen2013
  trich: Data were analyzed from publicly available resting state scans for 1011 individuals between the ages of 7 and 29 ... Lateralization of brain connections appears to be a local rather than global property of brain networks, and our data are not consistent with a whole-brain phenotype of greater "left-brained" or greater "right-brained" network strength across individuals.
  ket_qua: da-sua
  ghi_chu: 'Cũ: "không thấy ai có toàn bộ mạng lưới bên trái hay bên phải mạnh hơn hẳn" (mạnh hơn bài: bài nói về kiểu hình toàn não ở cấp quần thể); viết theo tóm tắt và trang nhà. Sau lượt 2 (Opus 5.5, 18/11/2026): Lượt 2 xác nhận 1.011 người 7–29 tuổi; phần kết luận có trong tóm tắt đủ (trích ở trên).'
  luot_2: khong-chac
  luot_2_nguon:
  - https://doi.org/10.1371/journal.pone.0071275
  luot_2_ghi_chu: Đã xác nhận 1011 người 7–29 tuổi; phần kết luận trong tóm tắt đã đọc bị cắt, chưa xác nhận.
