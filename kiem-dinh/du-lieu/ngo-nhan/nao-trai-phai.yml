ghi_chu: 'Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Một số chức năng có thiên lệch về một bán cầu, chẳng hạn ngôn ngữ thường thiên về bên trái. Nhưng đó là đặc điểm của từng chức năng, không phải "kiểu người". Khi phân tích kết nối não lúc nghỉ của 1.011 người từ 7 đến 29 tuổi, các nhà nghiên cứu không thấy ai có toàn bộ mạng lưới bên trái hay bên phải mạnh hơn hẳn.'' → mới ''Một số chức năng thiên về một bán cầu, như ngôn ngữ thường thiên về bên trái; nhưng đó là phân công chức năng, không phải "kiểu người". Khi phân tích ảnh chụp não lúc nghỉ của 1.011 người từ 7 đến 29 tuổi, các nhà nghiên cứu thấy các kết nối lệch về một bán cầu là đặc điểm cục bộ, không gom thành kiểu "não trái hơn" hay "não phải hơn" trên toàn bộ não.'' | trang: cũ None → mới ''kham-pha/co-so-sinh-hoc/nao-che-doi'''
