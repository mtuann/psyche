    luot_2: khong-chac
    luot_2_ghi_chu: Câu đã bỏ, quá mơ hồ ('lập trình') để kiểm; không nguồn nào nói thẳng. Elliot & Maier 2014 chỉ nói màu có thể ảnh hưởng và bằng chứng còn sơ khai.
