ghi_chu: 'Bỏ các ý chưa đọc được trong toàn văn Bridgman 2019 (chỉ mở được tóm tắt): năm 1943 và 1954, "do giới tư vấn quản trị tạo ra", "Maslow cho rằng các nhu cầu chồng lấn nhau". Đã sửa src/data/ngo-nhan.yml ở D8-L3 (lượt 1). giai_thich: cũ ''Maslow mô tả một thứ bậc nhu cầu (năm 1943 và 1954) nhưng không vẽ kim tự tháp. Hình kim tự tháp do giới tư vấn quản trị tạo ra về sau, và nó khiến thứ bậc trông cứng nhắc hơn ý ông: Maslow cho rằng các nhu cầu chồng lấn nhau, không cần thỏa mãn trọn vẹn bậc dưới mới đến bậc trên.'' → mới ''Maslow mô tả một thứ bậc nhu cầu nhưng chưa bao giờ vẽ kim tự tháp. Một khảo cứu lịch sử năm 2019 lần lại cách hình kim tự tháp ra đời và trở thành biểu tượng nổi tiếng nhất của ngành quản trị; bài cũng ghi nhận lý thuyết của Maslow ít được nghiên cứu thực nghiệm ủng hộ.'''
