    ghi_chu: 'Bài 1989 là bài tổng hợp chương trình nghiên cứu của chính nhóm (tóm tắt nói "research program"), không phải báo cáo thí nghiệm mới. Watts 2018 và Kidd 2013 là tái lập và nghiên cứu khác, đúng khi không nằm trong nguon. Có thể thiếu bài gốc sớm nhất: Mischel và Ebbesen (1970), "Attention in delay of gratification" (JPSP 16(3) 329-337, Crossref 10.1037/h0029815), chưa có trong nguon.yml; người gom quyết có thêm không.'
