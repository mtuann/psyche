    trich: 'Crossref: "Studies of independence and conformity: I. A minority of one against a unanimous majority", Asch, Psychological Monographs 70(9) 1-70; bibbase: Asch, "Effects of group pressure upon the modification and distortion of judgments", Guetzkow (ed.), Groups, leadership and men, Carnegie Press, 1951'
    ket_qua: dung
    ghi_chu: 1951 là chương sách (không mở được toàn văn; chỉ có mục thư mục), 1956 là chuyên khảo 70 trang. Bond và Smith (1996), Franzen và Mader (2023) trang nhà dẫn là phân tích tổng hợp và bản tái lập, không phải bài gốc, đúng là không nằm trong nguon. Xem hồ sơ nguon/asch1951 (n4 chưa chắc ở số trang).
    luot_2: dung
    luot_2_nguon: [ "https://api.crossref.org/works/10.1037/h0093718", "https://openlibrary.org/search.json?title=Groups%2C+leadership+and+men" ]
    luot_2_ghi_chu: Asch 1956 là Psychological Monographs 70(9), 1–70. Asch 1951 chương sách Carnegie Press 1951 (Open Library xác nhận); số trang 177–190 là theo trích dẫn quen thuộc, chưa đọc được trang sách.
