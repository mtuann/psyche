  - id: cepeda
    ten: Bản ghi Crossref của Cepeda và cộng sự (2006), DOI 10.1037/0033-2909.132.3.354, kèm tóm tắt PubMed (PMID 16719566)
    link: https://api.crossref.org/works/10.1037%2F0033-2909.132.3.354
nhan_dinh:
  - id: n1
    cau: 'Tên "Cepeda và cộng sự (2006): học ngắt quãng có nhớ lâu hơn học dồn không?" đúng với nội dung bài Cepeda, Pashler, Vul, Wixted và Rohrer (2006)'
    loai: dinh-nghia
    truong:
      - ten
    nguon:
      - cepeda
    trich: 'Distributed practice in verbal recall tasks: A review and quantitative synthesis, Cepeda và cộng sự, Psychological Bulletin 132(3) 354-380; tóm tắt: "The authors performed a meta-analysis of the distributed practice effect ... 839 assessments of distributed practice in 317 experiments located in 184 articles. Effects of spacing (consecutive massed presentations vs. spaced learning episodes) and lag ... were examined"'
    ket_qua: dung
    ghi_chu: Đây là phân tích tổng hợp (839 phép so sánh, 317 thí nghiệm), không phải một thí nghiệm; tên hỏi theo kết luận chính của bài (ngắt quãng và khoảng nghỉ cùng quyết định mức nhớ), "học dồn" là tên site dùng cho massed practice.
    luot_2: dung
    luot_2_nguon: [ "https://api.crossref.org/works/10.1037/0033-2909.132.3.354" ]
  - id: n2
    cau: Nghiên cứu này là bài báo Cepeda, Pashler, Vul, Wixted và Rohrer (2006), nguon ghi chính bài đó (một bài gốc)
    loai: lich-su
    truong:
      - nguon
    nguon:
      - cepeda
    trich: 'Distributed practice in verbal recall tasks: A review and quantitative synthesis, Cepeda và cộng sự, Psychological Bulletin 132(3) 354-380'
    ket_qua: dung
    ghi_chu: Hồ sơ chỉ có một nguồn, chính bài; không có bài gốc nào khác để thiếu.
    luot_2: dung
    luot_2_nguon: [ "https://api.crossref.org/works/10.1037/0033-2909.132.3.354" ]
  - id: n-tn
    cau: Trang nhà của nghiên cứu là kham-pha/tri-nho/duong-cong-quen
    loai: ve-site
    truong:
      - trang_nha
    ket_qua: dung
    ghi_chu: 'có mục riêng "Cepeda và cộng sự (2006): 317 thí nghiệm nói gì?" (thiết kế và kết quả); vi-sao-ta-quen và doc-nhan-chac-chan chỉ nhắc'
    review: dung
