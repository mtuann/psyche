    trich: 'The magical number 4 in short-term memory: A reconsideration of mental storage capacity, Cowan, Behavioral and Brain Sciences 24(1) 87-114; tóm tắt: "Miller (1956) summarized evidence that people can remember about seven chunks in short-term memory (STM) tasks. However, that number was meant more as a rough estimate ... there is a more precise capacity limit, but that it is only three to five chunks ... the smaller capacity limit is real."'
    ket_qua: dung
    ghi_chu: Tên có dấu hỏi vì Cowan nêu 3-5 mục (khoảng 4), tranh luận còn tiếp; ghi_chu của trang nhà tri-nho-lam-viec nói con số còn bàn cãi.
    luot_2: dung
