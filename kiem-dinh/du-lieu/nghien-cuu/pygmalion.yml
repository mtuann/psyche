    trich: 'Crossref: "Teachers'' Expectancies: Determinants of Pupils'' IQ Gains" (Psychological Reports 19(1) 115-118; tóm tắt: 18 lớp, khoảng 20% trẻ được báo với giáo viên là có tiềm năng, tám tháng sau những trẻ đó (chọn ngẫu nhiên) tăng IQ nhiều hơn nhóm đối chứng); "Pygmalion in the classroom" (The Urban Review 3(1) 16-20); Open Library: Pygmalion in the classroom, Holt, Rinehart and Winston, 1968'
    ket_qua: dung
    ghi_chu: 'Bài Urban Review (5 trang) và sách là của chính hai tác giả; bài 1966 có tóm tắt đọc được; chưa mở toàn văn sách. Rosenthal và Fode 1963 (chuột) là nghiên cứu trước, không phải Pygmalion: đúng khi không có trong nguon. Thorndike 1968 là bình luận; Raudenbush 1984, Jussim & Harber 2005 là tổng hợp.'
