    ket_qua: dung
    ghi_chu: Nội dung bài là khảo sát niềm tin của người Mỹ về trí nhớ, không phải thí nghiệm con khỉ đột (đó là Simons & Chabris 1999, hồ sơ khi-dot-vo-hinh). Trang nhà nhin-ma-khong-thay nhắc khảo sát này ở một đoạn (78% đồng ý ...), không phải phần chính của trang.
