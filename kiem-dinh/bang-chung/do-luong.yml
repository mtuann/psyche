nhan_dinh:
  - id: dl1
    cau: Báo cáo World Happiness Report 2024 được công bố ngày 20/3/2024, Ngày Quốc tế Hạnh phúc của Liên Hợp Quốc, và được báo đưa tin ngày 21/3/2024.
    loai: lich-su
    nguon:
      - vir2024
    trich: The findings, announced on March 20 to mark the United Nations’ International Day of Happiness | March 21, 2024
    vi_tri: Vietnam Investment Review, đầu bài
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "tin này lan khắp báo chí Việt Nam ngày 20/3/2024". Lý do: bài đã đọc (VIR) đăng 21/3/2024 và nói báo cáo công bố ngày 20/3; "lan khắp báo chí" không kiểm được, bỏ.'
    luot_2: dung
    luot_2_nguon: [ "https://files.worldhappiness.report/WHR24.pdf", "https://wellbeing.hmc.ox.ac.uk/events/world-happiness-report-2024-global-launch", "https://en.baochinhphu.vn/viet-nam-jumps-11-steps-in-world-happiness-report-2024-111240321110305123.htm" ]
    luot_2_ghi_chu: Ngày 20/3 là Ngày Quốc tế Hạnh phúc của Liên Hợp Quốc (thông tin chung); trang Oxford không tự nói liên hệ này. Metadata PDF tạo ngày 18/3/2024, không mâu thuẫn.
  - id: dl2
    cau: Trong World Happiness Report 2024, Việt Nam xếp thứ 54 trên 143 quốc gia và vùng lãnh thổ, tăng 11 bậc so với năm 2023 (từ hạng 65).
    loai: so-lieu
    nguon:
      - vir2024
      - whr2024-du-lieu
      - whr2023-du-lieu
    trich: Vietnam has been ranked 54th out of 143 countries and territories in the World Happiness Report 2024, climbing 11 places from last year.
    vi_tri: VIR, đoạn đầu; tệp dữ liệu Hình 2.1 của WHR 2024 và WHR 2023
    ket_qua: dung
    ghi_chu: 'Đã đối chiếu dữ liệu gốc: tệp WHR24_Data_Figure_2.1.xls có 143 nước, Việt Nam ở hàng 54 (điểm 6,043); tệp WHR23_Data_Figure_2.1.xls có Việt Nam ở hàng 65 (điểm 5,763). 65 trừ 54 bằng 11. (Bài Báo Chính phủ ghi "từ hạng 75", mâu thuẫn với "tăng 11 bậc" của chính bài đó; dữ liệu gốc xác nhận 65.)'
    luot_2: dung
    luot_2_nguon: [ "https://files.worldhappiness.report/WHR24_Data_Figure_2.1.xls", "https://files.worldhappiness.report/WHR23_Data_Figure_2.1.xls", "https://files.worldhappiness.report/WHR24.pdf" ]
    luot_2_ghi_chu: Một bài báo tiếng Anh ghi nhầm "từ hạng 75"; số trong tệp WHR chính thức khớp câu.
  - id: dl3
    cau: Phần Lan đứng đầu bảng xếp hạng World Happiness Report 2024.
    loai: so-lieu
    nguon:
      - whr2024-ch2
      - whr2024-du-lieu
    trich: a full six points (on the 0 to 10 scale) between Finland at the top and Afghanistan at the bottom
    vi_tri: 'WHR 2024, chương 2, phần Ranking of Happiness; tệp dữ liệu Hình 2.1 (hàng 1: Finland, điểm 7,74)'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Phần Lan đứng đầu năm thứ bảy liên tiếp" (chỉ có bài VIR nói "seventh successive year"). Lý do: không kiểm được "thứ bảy liên tiếp" từ nguồn bậc 1 đã mở; chỉ giữ "đứng đầu".'
    luot_2: dung
    luot_2_nguon: [ "https://files.worldhappiness.report/WHR24_Data_Figure_2.1.xls", "https://files.worldhappiness.report/WHR24.pdf" ]
  - id: dl4
    cau: Bảng xếp hạng World Happiness Report dựa trên dữ liệu của Gallup World Poll.
    loai: phat-hien
    nguon:
      - whr2024-ch2
    trich: The Gallup World Poll, which remains the principal source of data in this report
    vi_tri: WHR 2024, chương 2, phần mở đầu
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "do các nhà khoa học hàng đầu thế giới phân tích" (lời của bài VIR, không phải nhận định kiểm được); bỏ.'
    luot_2: dung
    luot_2_nguon: [ "https://files.worldhappiness.report/WHR24.pdf" ]
  - id: dl5
    cau: 'Gallup World Poll yêu cầu mỗi người đánh giá cuộc sống hiện tại của mình bằng hình ảnh một cái thang: bậc 10 là cuộc sống tốt nhất có thể đối với họ, bậc 0 là tồi tệ nhất.'
    loai: phat-hien
    nguon:
      - whr2024-ch2
    trich: asks respondents to evaluate their current life as a whole using the image of a ladder, with the best possible life for them as a 10 and worst possible as a 0.
    vi_tri: WHR 2024, chương 2, phần mở đầu
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "cuộc đời tệ nhất có thể ... cuộc đời tốt nhất có thể, bạn đang đứng ở bậc nào?" Chữ mới sát nguồn: "best possible life for them" (tốt nhất có thể đối với họ).'
    luot_2: dung
    luot_2_nguon: [ "https://files.worldhappiness.report/WHR24.pdf" ]
  - id: dl6
    cau: Thứ hạng của mỗi nước dựa trên điểm trung bình của câu trả lời thang này trong ba năm (2021–2023).
    loai: phat-hien
    nguon:
      - whr2024-ch2
    trich: Countries are ranked according to their self-assessed life evaluations (answers to the Cantril ladder question in the Gallup World Poll), averaged over the years 2021-2023.
    vi_tri: WHR 2024, chương 2, phần Ranking of Happiness 2021-2023
    ket_qua: da-lam-mem
    ghi_chu: Câu thêm so với trang cũ (trang cũ nói cả bảng "dựng lên từ đó" mà không nêu trung bình ba năm).
    luot_2: dung
    luot_2_nguon: [ "https://files.worldhappiness.report/WHR24.pdf" ]
  - id: dl7
    cau: Điểm của mỗi nước dựa trên câu trả lời cho một câu hỏi duy nhất (thang Cantril).
    loai: phat-hien
    nguon:
      - whr2024-ch2
    trich: scores are based on individuals’ own assessments of their lives, in particular their answers to the single-item Cantril ladder life-evaluation question.
    vi_tri: WHR 2024, chương 2, chú thích của Hình 2.1
    ket_qua: dung
    ghi_chu: 'Chữ cũ: "Một câu hỏi, một con số — và cả một bảng xếp hạng quốc gia được dựng lên từ đó." Giữ ý, theo đúng chữ "single-item".'
    luot_2: dung
    luot_2_nguon: [ "https://files.worldhappiness.report/WHR24.pdf" ]
  - id: dl8
    cau: 'Nhà nghiên cứu phải định nghĩa thao tác (operational definition) cho các khái niệm như hạnh phúc, lo âu, trí thông minh: mô tả chính xác điều mình đo và đo bằng cách nào, ví dụ qua điểm của một bài kiểm tra hay câu trả lời của một bảng hỏi.'
    loai: dinh-nghia
    nguon:
      - openstax-psy2e
    trich: An operational definition is a precise description of our variables | In operationalizing learning, we might choose to look at performance on a test
    vi_tri: OpenStax Psychology 2e, mục 2.2 (Research designs, phần Variables) và mục 2.3
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Đo lường là việc gán con số cho những thứ không quan sát trực tiếp được — hạnh phúc, lo âu, trí thông minh, tính cách — thông qua những biểu hiện quan sát được, thường là câu trả lời cho một loạt câu hỏi". Lý do: viết lại theo khái niệm định nghĩa thao tác của giáo trình; "tính cách" bỏ vì không nêu trong nguồn; ví dụ hạnh phúc, lo âu, trí thông minh là các khái niệm tâm lý quen thuộc (suy luận, không phải trích).'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings" ]
    luot_2_ghi_chu: Ví dụ trong câu (hạnh phúc, lo âu, trí thông minh) là ví dụ của trang; OpenStax dùng ví dụ học đại số. Định nghĩa đúng.
  - id: dl9
    cau: 'Mọi thang đo cần trả lời hai câu hỏi: độ tin cậy và độ giá trị.'
    loai: phat-hien
    nguon:
      - openstax-psy2e
    trich: Reliability and validity are two important considerations that must be made with any type of data collection.
    vi_tri: OpenStax Psychology 2e, mục 2.3
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Vì cái được đo là vô hình, một thang đo tốt phải vượt qua hai bài kiểm tra". Bỏ vế "vì vô hình" (suy luận của site) và "vượt qua".'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings", "https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf" ]
    luot_2_ghi_chu: Standards 2014 xếp ba nền tảng (validity, reliability/precision, fairness); cách nói "hai câu hỏi" là rút gọn dạy học, không sai.
  - id: dl10
    cau: Độ tin cậy (reliability) là khả năng cho cùng một kết quả một cách nhất quán; nếu đo đi đo lại mà kết quả lúc nào cũng khác nhau thì phép đo không đáng tin.
    loai: dinh-nghia
    nguon:
      - openstax-psy2e
    trich: Reliability refers to the ability to consistently produce a given result.
    vi_tri: OpenStax Psychology 2e, mục 2.3
    ket_qua: dung
    ghi_chu: Ví dụ cái thước kẻ đo bàn mười lần là minh họa của site, không phải trích nguồn.
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings" ]
  - id: dl11
    cau: Test-retest là cho cùng một nhóm người làm bài test hai lần, cách nhau một khoảng thời gian; hệ số tương quan hai lần đo cho biết thang đo ổn định theo thời gian.
    loai: dinh-nghia
    nguon:
      - openstax-psy2e
      - aera2014
    trich: test-retest reliability (the degree to which the outcomes of a particular measure remain consistent over multiple administrations) | coefficients obtained by administration of the same form on separate occasions (test-retest coefficients)
    vi_tri: OpenStax Psychology 2e, mục 2.3; Standards 2014, phần Reliability/Precision
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings" ]
  - id: dl12
    cau: Nhất quán nội tại (internal consistency) là mức độ các câu hỏi cùng đo một thứ tương quan với nhau; nếu các câu hỏi của một thang đo gần như không liên hệ với nhau thì khó coi chúng cùng đo một thứ.
    loai: dinh-nghia
    nguon:
      - openstax-psy2e
      - tavakol2011
    trich: internal consistency (the degree to which different items on a survey that measure the same thing correlate with one another) | Internal consistency describes the extent to which all the items in a test measure the same concept or construct and hence it is connected to the inter-relatedness of the items within the test.
    vi_tri: OpenStax Psychology 2e, mục 2.3; Tavakol & Dennick 2011
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một thang đo ''lo âu'' mà người trả lời câu ''tôi thấy bồn chồn'' rất cao nhưng câu ''tôi thấy căng thẳng'' rất thấp thì có gì đó không ổn". Lý do: ví dụ minh họa của site; thay bằng định nghĩa của giáo trình, giữ ý.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings" ]
  - id: dl13
    cau: Ngoài test-retest và nhất quán nội tại còn có độ nhất quán giữa những người chấm (inter-rater reliability).
    loai: dinh-nghia
    nguon:
      - openstax-psy2e
    trich: inter-rater reliability (the degree to which two or more different observers agree on what has been observed)
    vi_tri: OpenStax Psychology 2e, mục 2.3
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Có hai cách kiểm tra độ tin cậy phổ biến". Lý do: "phổ biến" không có nguồn, và nguồn kể ba loại; viết "hai trong các cách ... thường dùng với thang đo bằng câu hỏi" (Standards 2014 xếp test-retest và nhất quán nội tại thành hai trong các loại hệ số) và nêu thêm loại thứ ba.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings", "https://openstax.org/books/psychology-2e/pages/2-2-approaches-to-research" ]
  - id: dl14
    cau: Độ giá trị (validity) là mức độ một công cụ đo chính xác điều nó được cho là đo.
    loai: dinh-nghia
    nguon:
      - openstax-psy2e
    trich: Validity refers to the extent to which a given instrument or tool accurately measures what it’s supposed to measure
    vi_tri: OpenStax Psychology 2e, mục 2.3
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings" ]
  - id: dl15
    cau: 'Tiêu chuẩn AERA, APA, NCME (2014): giá trị là mức độ bằng chứng và lý thuyết ủng hộ cách diễn giải điểm số cho một mục đích đã định; điều được đánh giá là cách diễn giải điểm số, không phải bản thân bài test.'
    loai: dinh-nghia
    nguon:
      - aera2014
    trich: Validity refers to the degree to which evidence and theory support the interpretations of test scores for proposed uses of tests. | It is the interpretations of test scores for proposed uses that are evaluated, not the test itself.
    vi_tri: 'Standards 2014, phần Introduction của Part I (Foundations: Validity)'
    ket_qua: dung
    ghi_chu: Câu thêm so với trang cũ.
    luot_2: dung
    luot_2_nguon: [ "https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf" ]
  - id: dl16
    cau: 'Ví dụ trong giáo trình OpenStax: một cân bếp không được hiệu chỉnh đúng có thể luôn báo thiếu hoặc thừa, nhưng cùng một lượng ngũ cốc luôn cho cùng một số; cân ấy rất tin cậy nhưng kết quả sai, tức không có giá trị.'
    loai: dinh-nghia
    nguon:
      - openstax-psy2e
    trich: If the scale is not properly calibrated, it may consistently under- or overestimate the amount of cereal that’s being measured. While the scale is highly reliable in producing consistent results
    vi_tri: OpenStax Psychology 2e, mục 2.3
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "một cái cân lúc nào cũng báo nặng hơn thực tế 5 kg ... bước lên mười lần, mười lần cùng một số" (ví dụ của site, con số 5 kg do site đặt). Thay bằng ví dụ cân bếp của giáo trình.'
    luot_2: dung
