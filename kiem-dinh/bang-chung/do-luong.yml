    ghi_chu: 'Chữ cũ: "Dưới 0,70 mà vẫn tự tin kết luận, hoặc giấu nhẹm con số". Bỏ "giấu nhẹm" (quy động cơ). Suy luận từ dl26 và dl28 (mốc 0,70 chỉ là quy ước).'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4205511/", "https://rd.springer.com/content/pdf/10.1007/s11165-016-9602-2.pdf" ]
    luot_2_ghi_chu: Lời khuyên thực hành, đúng, kèm quy ước.
  - id: dl37
    cau: Nội dung các câu hỏi của một bài test nên khớp với khái niệm cần đo; ví dụ một quiz "đo IQ" toàn hỏi kiến thức đố vui thì nội dung không khớp.
    loai: loi-khuyen
    nguon:
      - aera2014
    trich: Important validity evidence can be obtained from an analysis of the relationship between the content of a test and the construct it is intended to measure.
    vi_tri: Standards 2014, phần Evidence Based on Test Content
    ket_qua: da-sua
    ghi_chu: Ví dụ quiz đo IQ là minh họa của site (gia-dinh). Chữ cũ có thêm ví dụ "quiz đo trầm cảm chỉ hỏi 'hôm nay bạn có buồn không' một lần"; bỏ vì không có nguồn và vì không nên gợi ý công cụ tự chẩn đoán.
    luot_2: dung
    luot_2_nguon: [ "https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf" ]
  - id: dl38
    cau: Tiêu chuẩn 2014 nêu rằng thông tin về bài test nên được ghi rõ để người dùng có thể quyết định dùng bài nào, chấm điểm và diễn giải ra sao; vì vậy cần hỏi ai đứng sau thang đo và có tài liệu để người khác kiểm lại không.
    loai: loi-khuyen
    nguon:
      - aera2014
    trich: Information relating to tests should be clearly documented so that those who use tests can make informed decisions regarding which test to use for a specific purpose, how to administer the chosen test, and how to interpret test scores.
    vi_tri: Standards 2014, Chương 7 (Documentation), Standard 7.0
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Không rõ tác giả, không có nghiên cứu công bố, không ai ngoài công ty bán test kiểm chứng". Viết lại theo Standard 7.0 (không nguồn cho "công ty bán test").'
    luot_2: dung
    luot_2_nguon: [ "https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf" ]
  - id: dl39
    cau: Năm 1949, Forer cho 39 sinh viên làm một bài trắc nghiệm rồi phát cho mỗi em một bản "mô tả tính cách" ghi sẵn tên nhưng giống hệt nhau (13 nhận xét); trung bình các em chấp nhận khoảng 10 trên 13 nhận xét là đúng với mình.
    loai: phat-hien
    nguon:
      - forer1949
    trich: At the next meeting the 39 students were given DIB's to fill out | all sketches were identical | consists of 13 statements | Mean acceptance was 10.2 items.
    vi_tri: Forer 1949, tr. 119–121 (Procedure, Results)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một dấu hiệu kinh điển: kết quả lúc nào cũng nịnh người làm ... Một bài test tính cách mà ai làm xong cũng nhận được ''bạn là người đặc biệt, sâu sắc và hiếm có'' ... được thiết kế để bạn chia sẻ, không phải để đo." Lý do: câu tổng quát và động cơ ("thiết kế để chia sẻ") không có nguồn; thay bằng thí nghiệm của Forer (1949), kết quả 10,2 trên 13 (bản đọc được ghi "Mean acceptance was 10.2 items").'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fh0034974.zip/10.1037%252Fh0059240.pdf" ]
  - id: dl40
    cau: Nếu mọi người nhận cùng một mô tả mà đều thấy đúng, thì việc thấy đúng không phải bằng chứng rằng bài test đo được điều gì.
    loai: phat-hien
    nguon:
      - forer1949
    trich: 'THE FALLACY OF PERSONAL VALIDATION: A CLASSROOM DEMONSTRATION OF GULLIBILITY'
    vi_tri: Forer 1949, tên bài
    ket_qua: da-lam-mem
    ghi_chu: Suy luận từ thí nghiệm của Forer (mô tả giống hệt cho mọi người vẫn được chấp nhận đúng); Forer gọi đó là "fallacy of personal validation".
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fh0034974.zip/10.1037%252Fh0059240.pdf" ]
    luot_2_ghi_chu: Đúng với kết luận của Forer ("fallacy of personal validation"); câu này không khẳng định bài test nào vô giá trị.
  - id: dl41
    cau: 'Độ tin cậy là điều kiện cần nhưng không đủ của độ giá trị: một thang đo nhất quán vẫn có thể không đo đúng thứ định đo.'
    loai: nhan
    nguon:
      - openstax-psy2e
      - tavakol2011
    trich: While any valid measure is by necessity reliable, the reverse is not necessarily true. | An instrument cannot be valid unless it is reliable.
    vi_tri: OpenStax Psychology 2e, mục 2.3; Tavakol & Dennick 2011
    ket_qua: dung
    nhan: vung-chac
    co_so:
      - 'OpenStax Psychology 2e, mục 2.3: "any valid measure is by necessity reliable, the reverse is not necessarily true"; ví dụ cân bếp'
      - 'Tavakol & Dennick (2011), bài tổng quan phương pháp: "An instrument cannot be valid unless it is reliable"'
    ly_do: 'Là nguyên tắc của lý thuyết đo lường, không phải phát hiện thực nghiệm; thước đo mục 4 viết cho phát hiện thực nghiệm. Xét theo đồng thuận của giáo trình mở có bình duyệt và bài tổng quan phương pháp: hai nguồn độc lập nêu cùng điều, kèm ví dụ minh họa, không nguồn nào phản bác. Cùng cách xử lý với trang p-value (D4-L1).'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings", "https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf" ]
    luot_2_ghi_chu: "Nhãn cho nguyên tắc phương pháp xét theo đồng thuận giáo trình và Standards 2014: đạt mức vững cho khẳng định này."
  - id: dl42
    cau: Các mốc alpha như 0,70 chỉ là quy ước tham khảo; mức cần thiết phụ thuộc mục đích dùng điểm số.
    loai: nhan
    nguon:
      - aera2014
      - taber2018
      - tavakol2011
      - metsamuuronen2025
    trich: A higher degree of reliability/precision is required for score uses that have more significant consequences for test takers. | characterisation of the qualitative merits of specific values seems highly variable between studies | There are different reports about the acceptable values of alpha, ranging from 0.70 to 0.95.
    vi_tri: AERA, APA, NCME 2014 (Standards) (Standard 2.0); Taber 2018; Tavakol & Dennick 2011
    ket_qua: dung
    nhan: kha-vung
    co_so:
      - 'Tiêu chuẩn 2014 (Standard 2.0, phần Comment): độ tin cậy cần cao hơn khi hệ quả lớn hơn'
      - 'Taber (2018): mô tả bằng lời cho từng mức alpha biến thiên rất lớn giữa các nghiên cứu'
      - 'Tavakol & Dennick (2011): mức chấp nhận được trong các báo cáo từ 0,70 đến 0,95'
      - 'Metsämuuronen & Niemensivu (2025), trích Nunnally (1978): 0,80 chưa đủ ở nhiều bối cảnh ứng dụng'
    ly_do: 'Các nguồn cùng chiều về điểm "tùy mục đích", nhưng không có phân tích tổng hợp hay thử nghiệm quyết định mốc nào; con số cụ thể khác nhau giữa các tác giả. Theo mục 4: nhiều nguồn cùng chiều nhưng còn giới hạn, nên Khá vững (không phải Vững chắc). Nunnally (1978) chỉ đọc qua trích dẫn.'
    luot_2: dung
    luot_2_nguon: [ "https://rd.springer.com/content/pdf/10.1007/s11165-016-9602-2.pdf", "https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf" ]
    luot_2_ghi_chu: Nhãn theo đồng thuận tổng quan phương pháp.
  - id: dl43
    cau: 'Trong bài tập giả định (quiz 4 câu về hạnh phúc, test-retest 0,85, alpha 0,45): test-retest 0,85 là khá cao (gần bằng 0,82 của SWLS) nên quiz ổn định theo thời gian; alpha 0,45 là thấp (dưới mốc khoảng 0,70 thường dùng), nguyên nhân có thể là các câu ít liên hệ với nhau hoặc ít câu hỏi.'
    loai: phat-hien
    nguon:
      - diener1985
      - tavakol2011
      - taber2018
    trich: The two-month test-retest correlation coefficient was .82, and coefficient alpha was .87. | A low value of alpha could be due to a low number of questions, poor inter-relatedness between items or heterogeneous constructs. | A value of around 0.70 or greater is widely considered desirable
    vi_tri: Diener 1985, tr. 72; Tavakol & Dennick 2011; Taber 2018
    ket_qua: da-sua
    ghi_chu: 'gia-dinh: quiz và các số 0,85 và 0,45 do site đặt. Chữ cũ: "Test-retest 0,85 là cao" (không mốc); "Alpha 0,45 là thấp (dưới ngưỡng 0,70) ... Thang đo lỏng lẻo về mặt nội tại". Thêm so sánh với SWLS và nguyên nhân có thể có theo nguồn; "khá cao" thay "cao".'
    luot_2: dung
    luot_2_nguon: [ "https://labs.psychology.illinois.edu/~ediener/Documents/Diener-Emmons-Larsen-Griffin_1985.pdf", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4205511/" ]
    luot_2_ghi_chu: Bài tập giả định, phép đọc số đúng.
  - id: dl44
    cau: 'Trong bài tập giả định: quiz có thể ổn định (tin cậy cao) mà vẫn không đo đúng điều nó tuyên bố, vì các câu hỏi như "Bạn có nhiều tiền không?" và "Bữa sáng hôm nay có ngon không?" đo những thứ khác với "hạnh phúc" như một trạng thái tâm lý chung; đây là vấn đề độ giá trị.'
    loai: dinh-nghia
    nguon:
      - openstax-psy2e
      - aera2014
    trich: While any valid measure is by necessity reliable, the reverse is not necessarily true. | Important validity evidence can be obtained from an analysis of the relationship between the content of a test and the construct it is intended to measure.
    vi_tri: OpenStax Psychology 2e, mục 2.3; Standards 2014, Evidence Based on Test Content
    ket_qua: dung
    ghi_chu: 'gia-dinh: quiz do site đặt; nhận xét "đo những thứ khác với hạnh phúc" là phán đoán về một quiz giả định, theo tiêu chí nội dung của Standards 2014.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings", "https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf" ]
  - id: dl45
    cau: 'Quiz 1: cái cân luôn báo nặng hơn thực tế 5 kg và cho cùng một số mười lần là độ tin cậy cao nhưng độ giá trị thấp; giáo trình OpenStax dùng đúng kiểu ví dụ này.'
    loai: dinh-nghia
    nguon:
      - openstax-psy2e
    trich: While the scale is highly reliable in producing consistent results | While any valid measure is by necessity reliable, the reverse is not necessarily true.
    vi_tri: OpenStax Psychology 2e, mục 2.3
    ket_qua: dung
    ghi_chu: 'gia-dinh: số 5 kg do site đặt. Phương án sai: "độ giá trị cao nhưng độ tin cậy thấp", "cả hai cùng cao".'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings" ]
  - id: dl46
    cau: 'Quiz 2: alpha rất cao (như 0,97) không tự động là tốt hơn, vì có thể do các câu hỏi lặp lại nhau; và độ giá trị là câu hỏi khác với độ nhất quán nội tại.'
    loai: dinh-nghia
    nguon:
      - tavakol2011
    trich: If alpha is too high it may suggest that some items are redundant as they are testing the same question but in a different guise. | Validity is concerned with the extent to which an instrument measures what it is intended to measure.
    vi_tri: Tavakol & Dennick 2011
    ket_qua: dung
    ghi_chu: 'gia-dinh: thang 10 câu, alpha 0,97 do site đặt. Phương án sai: "chắc chắn có độ giá trị cao nhất", "chứng tỏ thang đo vô dụng".'
    luot_2: dung
    luot_2_nguon: [ "https://pmc.ncbi.nlm.nih.gov/articles/PMC4205511/", "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings" ]
  - id: dl47
    cau: 'Quiz 3: alpha tóm tắt độ nhất quán nội tại; độ ổn định giữa hai lần đo là test-retest, còn khả năng dự đoán thuộc về độ giá trị.'
    loai: dinh-nghia
    nguon:
      - tavakol2011
      - openstax-psy2e
    trich: to provide a measure of the internal consistency of a test or scale | test-retest reliability (the degree to which the outcomes of a particular measure remain consistent over multiple administrations)
    vi_tri: Tavakol & Dennick 2011; OpenStax Psychology 2e, mục 2.3
    ket_qua: dung
    ghi_chu: 'Phương án sai: "độ ổn định giữa hai lần đo cách nhau vài tháng", "mức điểm số dự đoán được kết quả thực tế".'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings", "https://www.testingstandards.net/uploads/7/6/6/4/76643089/9780935302356.pdf" ]
doi_chu:
  - cu: 'Mô tả (description): "nhận ra một bài test dỏm"'
    moi: '"các câu hỏi nên đặt ra trước khi tin một bài test"'
    ly_do: Bỏ chữ "dỏm" (đánh giá cảm tính).
  - cu: '"tin này lan khắp báo chí Việt Nam ngày 20/3/2024"; "do các nhà khoa học hàng đầu thế giới phân tích"; "Phần Lan đứng đầu năm thứ bảy liên tiếp"; "cuộc đời tệ nhất có thể ... tốt nhất có thể"; "Một câu hỏi, một con số — và cả một bảng xếp hạng quốc gia được dựng lên từ đó"'
    moi: '"tin này được các báo trong nước đưa ngày 21/3/2024, sau khi báo cáo được công bố ngày 20/3"; "dựa trên dữ liệu của Gallup World Poll"; "Phần Lan đứng đầu"; "cuộc sống tốt nhất có thể đối với bạn ... tồi tệ nhất"; thứ hạng dựa trên điểm trung bình ba năm (2021–2023); dẫn thêm World Happiness Report 2024'
    ly_do: 'dl1 đến dl7: theo dữ liệu gốc của World Happiness Report.'
  - cu: '"gán con số cho những thứ không quan sát trực tiếp được — hạnh phúc, lo âu, trí thông minh, tính cách — thông qua những biểu hiện quan sát được"; "Vì cái được đo là vô hình, một thang đo tốt phải vượt qua hai bài kiểm tra"'
    moi: '"định nghĩa thao tác (operational definition) ... mô tả chính xác điều mình đo và đo bằng cách nào"; "mọi thang đo cần trả lời hai câu hỏi"'
    ly_do: 'dl8, dl9: theo OpenStax Psychology 2e.'
  - cu: '"Có hai cách kiểm tra độ tin cậy phổ biến"; "Một thang đo ''lo âu'' mà người trả lời câu ''tôi thấy bồn chồn'' rất cao nhưng câu ''tôi thấy căng thẳng'' rất thấp thì có gì đó không ổn"'
    moi: '"Hai trong các cách kiểm tra độ tin cậy thường dùng với thang đo bằng câu hỏi (ngoài ra còn độ nhất quán giữa những người chấm)"; định nghĩa nhất quán nội tại theo giáo trình'
    ly_do: dl10 đến dl13.
  - cu: '"một cái cân lúc nào cũng báo nặng hơn thực tế 5 kg ... bước lên mười lần, mười lần cùng một số"; "Ví dụ kinh điển"'
    moi: Ví dụ cân bếp không hiệu chỉnh của giáo trình OpenStax; thêm định nghĩa giá trị theo Tiêu chuẩn 2014
    ly_do: dl14 đến dl18.
  - cu: '"Các nhà tâm lý học còn phân biệt nhiều loại độ giá trị ... Khái niệm giá trị cấu trúc được đặt nền móng trong bài báo của Cronbach và Meehl năm 1955"'
    moi: Bốn kiểu giá trị của ủy ban APA (1950–1954); "Thuật ngữ giá trị cấu trúc xuất hiện trong báo cáo của Ủy ban Trắc nghiệm Tâm lý của APA ... Cronbach và Meehl (1955) trình bày cách hiểu của họ"; Tiêu chuẩn 2014 nói về các loại bằng chứng
    ly_do: 'dl19 đến dl21: theo bài 1955 và Tiêu chuẩn 2014.'
  - cu: '"đề xuất một con số duy nhất để tóm tắt mức độ ''đồng lòng''"; "Nếu các câu hỏi mỗi câu nói một thứ khác nhau, alpha tụt về gần 0"'
    moi: '"do nhà tâm lý học Lee Cronbach phát triển năm 1951"; "Alpha thấp khi các câu hỏi ít liên hệ với nhau; alpha cũng phụ thuộc số câu hỏi"'
    ly_do: dl22 đến dl24.
  - cu: Bảng năm hàng alpha (≥ 0,90 rất tốt; 0,80–0,89 tốt; 0,70–0,79 chấp nhận được; 0,60–0,69 đáng ngờ; < 0,60 kém); "Ngưỡng 0,70 bắt nguồn từ cuốn Psychometric Theory của Jim Nunnally ... 0,70 chỉ là mức tối thiểu cho giai đoạn nghiên cứu ban đầu"
    moi: Bảng ba dòng theo Tavakol & Dennick (2011); Taber (2018) về cách gọi biến thiên; Tiêu chuẩn 2014 về mục đích; Nunnally (1978) theo trích của Metsämuuronen và Niemensivu (2025), chỉ giữ hai câu đọc được
    ly_do: 'dl25 đến dl30: các nhãn bằng lời và nguồn gốc ngưỡng 0,70 không kiểm được.'
  - cu: '"Nhìn chung, tôi hài lòng với cuộc sống của mình" (ví dụ câu SWLS); "Ngay trong nghiên cứu gốc, thang đo này đạt alpha 0,87 và hệ số test-retest 0,82 sau 2 tháng"; "Đó là lý do thang đo 5 câu này được dùng trong hàng nghìn nghiên cứu suốt bốn thập kỷ — không phải vì nó ''đúng tuyệt đối'', mà vì độ tin cậy của nó đã được kiểm chứng công khai"'
    moi: '"Tôi hài lòng với cuộc sống của mình"; "trên 176 sinh viên đại học ở Mỹ ... 76 sinh viên làm lại sau 2 tháng"; "theo OpenAlex, bài gốc năm 1985 được trích dẫn hơn 31.000 lần (tính đến 10/2026)"'
    ly_do: dl31 đến dl34.
