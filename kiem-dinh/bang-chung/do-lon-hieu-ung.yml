  - id: h25
    cau: Nhãn Đang tranh cãi cho "cạn kiệt ý chí" (hàng ba của bảng).
    loai: nhan
    nhan: tranh-cai
    nguon:
      - vohs2021
      - hagger2016
    co_so:
      - vohs2021
      - hagger2016
    ly_do: 'Một tái lập lớn có đăng ký trước (36 phòng thí nghiệm, N = 3.531) không thấy hiệu ứng (d = 0,06, không có ý nghĩa), phân tích khám phá thấy d = 0,08; đạt điều kiện "một tái lập lớn đăng ký trước thất bại" của "Đang tranh cãi". Hagger 2016 (23 phòng thí nghiệm, N = 2.141, d = 0,04) cùng chiều. Review (Claude Sonnet 5.5, 30/10/2026): khớp nhãn ở trang đã khóa bat-dau/doc-nhan-chac-chan; thêm Hagger 2016.'
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1177/1745691616652873", "https://doi.org/10.1177/0956797621989733" ]
    luot_2_ghi_chu: "Biên giới giữa 'Đang tranh cãi' và 'Đã bị bác bỏ': hai tái lập lớn có đăng ký trước (Hagger 2016, Vohs 2021) đều không thấy hiệu ứng, nhưng còn phân tích thăm dò và tổng hợp cũ có hiệu ứng trung bình. Nhãn trên trang chấp nhận được; chủ repo cân nhắc."
    trich: Confirmatory tests found a nonsignificant result (d = 0.06) (Vohs 2021) | Multiple laboratories (k = 23, total N = 2,141) ... the size of the ego-depletion effect was small with 95% confidence intervals (CIs) that encompassed zero (d = 0.04, 95% CI [-0.07, 0.15])
    ghi_chu: 'Review (Claude Sonnet 5.5, 30/10/2026): dung. Nhãn "Đang tranh cãi" cho cạn kiệt ý chí khớp trang đã khóa bat-dau/doc-nhan-chac-chan (ví dụ ở khung "Đang tranh cãi", nhãn tranh-cai; hồ sơ n19 đã qua review Opus). Hai tái lập lớn có đăng ký trước (Hagger 2016: 23 phòng thí nghiệm, N = 2.141, d = 0,04; Vohs 2021: 36 phòng thí nghiệm, N = 3.531, d = 0,06) là "kiểm tra đủ mạnh"; chưa xếp "Đã bị bác bỏ" vì Vohs 2021 (Crossref đọc lại 30/10/2026): phân tích khám phá trên toàn mẫu cho d = 0,08 có ý nghĩa thống kê, phân tích Bayes cho dữ liệu "about equally likely" dưới hai giả thuyết, hiệu ứng lớn hơn ở người báo cáo mệt hơn. Đã thêm hagger2016 vào nguon và co_so của câu cho khớp hồ sơ đã khóa. Cạnh biên với "Đã bị bác bỏ" như lượt 2 đã ghi; giữ để nhất quán toàn site (bat-dau/doc-nhan-chac-chan, ngo-nhan.yml). Trang dẫn riêng Vohs 2021 ở hàng bảng (d = 0,06 của phân tích xác nhận), đúng.'
    review: dung
