nhan_dinh:
  - id: h1
    cau: Với một mẫu rất lớn (ví dụ 50.000 người), một chênh lệch nhỏ đến mức không ai nhận ra trong đời sống vẫn có thể có ý nghĩa thống kê.
    loai: phat-hien
    nguon:
      - bangdiwala2016
    trich: a small effect can have a small p-value if the sample size is large or the variability is low … With small sample sizes, meaningless effects can be statistically significant if the variability is low
    vi_tri: Bangdiwala 2016, đoạn bàn về nguyên tắc 5 của ASA
    ket_qua: dung
    ghi_chu: 'gia-dinh: tin "nghe nhạc khi làm việc … 50.000 người" do site tự viết (đã ghi trên trang).'
    luot_2: dung
    luot_2_nguon: [ "https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full" ]
    luot_2_ghi_chu: "Nguyên lý thống kê chuẩn: sai số chuẩn giảm theo căn bậc hai của n, nên n=50.000 phát hiện được chênh lệch rất nhỏ. Lakens: hiệu ứng nhỏ vẫn có thể quan trọng."
  - id: h2
    cau: '"Có ý nghĩa thống kê" cho biết kết quả khó có thể chỉ do may rủi nếu thật ra không có hiệu ứng nào.'
    loai: dinh-nghia
    nguon:
      - lakens2013
    trich: statistical significance (how likely is the pattern of results observed in an experiment, given the assumption that there is no effect in the population)
    vi_tri: Introduction
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/introductory-statistics-2e/pages/1-2-data-sampling-and-variation-in-data-and-sampling" ]
    luot_2_ghi_chu: "Cách diễn đạt phổ thông chấp nhận được của p; chặt hơn: xác suất của dữ liệu cực đoan như vậy nếu giả thuyết không đúng."
  - id: h3
    cau: '"Có ý nghĩa thống kê" không cho biết hiệu ứng lớn hay nhỏ, quan trọng hay không.'
    loai: dinh-nghia
    nguon:
      - bangdiwala2016
    trich: A p-value, or statistical significance, does not measure the size of an effect or the importance of a result.
    vi_tri: Bangdiwala 2016 (trích nguyên tắc 5 của ASA)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full" ]
    luot_2_ghi_chu: "Đúng: p không đo độ lớn."
  - id: h4
    cau: Mẫu càng lớn, những hiệu ứng càng nhỏ càng dễ có ý nghĩa thống kê.
    loai: phat-hien
    nguon:
      - bangdiwala2016
    trich: a small effect can have a small p-value if the sample size is large or the variability is low
    vi_tri: Bangdiwala 2016, Bảng 1 và đoạn kèm theo
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full" ]
    luot_2_ghi_chu: "Quan hệ công suất kiểm định: n càng lớn, hiệu ứng càng nhỏ vẫn đạt p<0,05."
  - id: h5
    cau: Độ lớn hiệu ứng (effect size) đo chênh lệch hay mối quan hệ lớn đến đâu, theo một thang chuẩn hóa không phụ thuộc vào cỡ mẫu.
    loai: dinh-nghia
    nguon:
      - lakens2013
    trich: Such standardized effect sizes allow researchers to communicate the practical significance of their results … instead of only reporting the statistical significance
    vi_tri: Introduction
    ket_qua: dung
    ghi_chu: '"Không phụ thuộc cỡ mẫu" là tính chất của số đo chuẩn hóa (chia cho độ lệch chuẩn); Lakens nói chuẩn hóa để so sánh giữa các nghiên cứu. Ước lượng độ lớn vẫn có khoảng tin cậy rộng khi mẫu nhỏ (Lakens, mục cuối).'
    luot_2: dung
    luot_2_nguon: [ "https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full" ]
    luot_2_ghi_chu: Ước lượng chuẩn hóa, không phụ thuộc hệ thống vào n (độ chính xác thì có).
  - id: h6
    cau: d của Cohen đo chênh lệch giữa hai nhóm bằng số độ lệch chuẩn; d = 0,5 nghĩa là trung bình nhóm này cao hơn nhóm kia nửa độ lệch chuẩn; g của Hedges gần giống d.
    loai: dinh-nghia
    nguon:
      - lakens2013
    trich: Cohen's d in between-subject designs can be readily interpreted as a percentage of the standard deviation, such that a Cohen's d of 0.5 means the difference equals half a standard deviation. … the difference between Hedges's g and Cohen's d is very small, especially in sample sizes above 20
    vi_tri: Interpreting Cohen's d; mục về Hedges's g
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full" ]
    luot_2_ghi_chu: g là d có hiệu chỉnh thiên lệch mẫu nhỏ.
  - id: h7
    cau: r là hệ số tương quan giữa hai biến.
    loai: dinh-nghia
    nguon:
      - openstax23
    trich: The correlation coefficient is usually represented by the letter r.
    vi_tri: OpenStax 2.3
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full" ]
    luot_2_ghi_chu: Định nghĩa chuẩn (Pearson r). Lakens chỉ nêu r là họ effect size; định nghĩa là kiến thức giáo trình.
  - id: h8
    cau: Cohen (1988) đề xuất gọi d = 0,2 là nhỏ, 0,5 là trung bình và 0,8 là lớn.
    loai: lich-su
    nguon:
      - lakens2013
    trich: A commonly used interpretation is to refer to effect sizes as small (d = 0.2), medium (d = 0.5), and large (d = 0.8) based on benchmarks suggested by Cohen (1988).
    vi_tri: Interpreting Cohen's d
    ket_qua: dung
    ghi_chu: Cohen (1988) là sách in, không mở được; đọc qua Lakens (2013). "Mốc d = 0,2/0,5/0,8" thuộc Cohen (1988) theo Lakens; vi_tri trang trong sách chưa kiểm.
    luot_2: dung
    luot_2_nguon: [ "https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full" ]
    luot_2_ghi_chu: Cohen 1992 (A power primer, https://doi.org/10.1037/0033-2909.112.1.155) nêu 'operationally defined small, medium, and large effects'.
  - id: h9
    cau: 'Hình: hai phân bố chuẩn (độ lệch chuẩn 1) cách nhau d = 0,2; 0,5; 0,8 chồng nhau 92%, 80%, 69%.'
    loai: so-lieu
    nguon:
      - lakens2013
    trich: the common language effect size … can be calculated directly from Cohen's d (Lakens; định nghĩa "chồng lấn" là phần diện tích chung của hai đường cong do site nêu)
    vi_tri: Hình src/hinh/hieu-ung-d.html
    ket_qua: dung
    ghi_chu: 'Tính lại 30/10/2026 bằng Python statistics.NormalDist: chồng lấn = 2·Φ(−d/2) = 0,9203; 0,8026; 0,6892, làm tròn 92%, 80%, 69%. Chưa mở được nguồn bậc 1–2 định nghĩa số đo "chồng lấn" (OVL): đây là phép tính từ công thức phân bố chuẩn, hình tự nêu định nghĩa trong chú thích. Lượt 2 kiểm lại phép tính.'
    luot_2: dung
    luot_2_nguon: [ "https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full" ]
    luot_2_ghi_chu: "Tự tính: OVL = 2Φ(−d/2): d=0,2 -> 0,920; d=0,5 -> 0,803; d=0,8 -> 0,689. Xác suất vượt trội Φ(d/√2): 0,556; 0,638; 0,714. Làm tròn 92%, 80%, 69%: khớp."
  - id: h10
    cau: 'Hình: xác suất một người chọn ngẫu nhiên từ nhóm B có điểm cao hơn một người chọn ngẫu nhiên từ nhóm A là 56%, 64%, 71% số cặp ứng với d = 0,2; 0,5; 0,8.'
    loai: so-lieu
    nguon:
      - lakens2013
    trich: expresses the probability that a randomly sampled person from one group will have a higher observed measurement than a randomly sampled person from the other group
    vi_tri: Lakens 2013, phần về common language effect size (McGraw & Wong 1992)
    ket_qua: dung
    ghi_chu: 'Lakens định nghĩa CL (probability of superiority) và nói tính trực tiếp từ d. Tính lại bằng Python: Φ(d/√2) = 0,5562; 0,6382; 0,7142 → 56%, 64%, 71% (giả sử phân bố chuẩn, cùng độ lệch chuẩn).'
    luot_2: dung
    luot_2_nguon: [ "https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full" ]
    luot_2_ghi_chu: "Tự tính: OVL = 2Φ(−d/2): d=0,2 -> 0,920; d=0,5 -> 0,803; d=0,8 -> 0,689. Xác suất vượt trội Φ(d/√2): 0,556; 0,638; 0,714. Làm tròn 56%, 64%, 71%: khớp."
  - id: h11
    cau: Nếu điểm số của hai nhóm theo phân bố chuẩn với cùng độ lệch chuẩn, thì ngay cả với d = 0,8, hai nhóm vẫn chồng lên nhau khoảng 69%; nếu chọn ngẫu nhiên một người ở mỗi nhóm, người ở nhóm can thiệp chỉ cao hơn trong khoảng 71% số cặp.
    loai: so-lieu
    nguon:
      - lakens2013
    trich: expresses the probability that a randomly sampled person from one group will have a higher observed measurement than a randomly sampled person from the other group
    vi_tri: Lakens 2013 (CL)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Ngay cả với hiệu ứng lớn d = 0,8, hai nhóm vẫn chồng lên nhau khoảng 69%." (không nêu điều kiện phân bố chuẩn, cùng độ lệch chuẩn). Chữ mới thêm điều kiện. Con số: h9, h10. Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; tự tính lại OVL = 2Φ(−d/2): 0,920; 0,803; 0,689 và Φ(d/√2): 0,556; 0,638; 0,714 (Python, 30/10/2026); khớp 92/80/69% và 56/64/71% với điều kiện chuẩn, cùng độ lệch chuẩn. Đây là phép tính, không phải câu nguồn: phần "xác suất vượt trội" có định nghĩa ở Lakens 2013, phần "chồng lấn" là diện tích chung của hai đường cong (chú thích hình nói rõ). dung.'
    luot_2: dung
    luot_2_nguon: [ "https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full" ]
    luot_2_ghi_chu: "Tự tính: OVL = 2Φ(−d/2): d=0,2 -> 0,920; d=0,5 -> 0,803; d=0,8 -> 0,689. Xác suất vượt trội Φ(d/√2): 0,556; 0,638; 0,714. 68,9% ≈ 69%, 71,4% ≈ 71%: khớp (giả định chuẩn, cùng độ lệch chuẩn)."
    review: dung
  - id: h12
    cau: Ngay cả khi một can thiệp có hiệu ứng lớn, vẫn có không ít người ở nhóm đối chứng làm tốt hơn người ở nhóm can thiệp.
    loai: phat-hien
    nguon:
      - lakens2013
    trich: expresses the probability that a randomly sampled person from one group will have a higher observed measurement than a randomly sampled person from the other group
    vi_tri: Lakens 2013 (CL)
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "vẫn có rất nhiều người ở nhóm đối chứng làm tốt hơn nhiều người ở nhóm can thiệp". Với d = 0,8, khoảng 29% số cặp có người nhóm đối chứng cao hơn (1 − 0,714); "rất nhiều" là cách nói, đổi thành "không ít". Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; với d = 0,8, khoảng 29% số cặp là người nhóm đối chứng cao hơn: "không ít" đúng. dung.'
    luot_2: dung
    luot_2_nguon: [ "https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full" ]
    luot_2_ghi_chu: "Với d=0,8, 71,4% cặp nhóm can thiệp cao hơn, nên khoảng 28,6% cặp nhóm đối chứng cao hơn: đúng."
    review: dung
  - id: h13
    cau: Theo Lakens (2013) kể lại, Cohen coi các mốc 0,2 / 0,5 / 0,8 chỉ nên dùng khi kết quả quá mới để so với các nghiên cứu liên quan.
    loai: lich-su
    nguon:
      - lakens2013
    trich: The only reason to use these benchmarks is because findings are extremely novel, and cannot be compared to related findings in the literature (Cohen, 1988).
    vi_tri: Interpreting Cohen's d
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Cohen tự coi các mốc 0,2 / 0,5 / 0,8 chỉ là quy ước khi không có cơ sở nào tốt hơn." Chữ mới bám câu của Lakens; Cohen (1988) gốc chưa mở được. Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; câu ghi "Theo Lakens (2013) kể lại"; Lakens: "The only reason to use these benchmarks is because findings are extremely novel, and cannot be compared to related findings in the literature (Cohen, 1988)". Cohen 1988 (sách) chưa mở được; đã nói rõ là kể lại. dung.'
    luot_2: dung
    luot_2_nguon: [ "https://www.frontiersin.org/articles/10.3389/fpsyg.2013.00863/full" ]
    luot_2_ghi_chu: Lakens kể lại Cohen 1988; câu viết 'theo Lakens kể lại' đúng.
    review: dung
  - id: h14
    cau: Các tổng hợp sau này cho thấy hiệu ứng điển hình trong tâm lý học khá khiêm tốn.
    loai: phat-hien
    nguon:
      - richard2003
      - gignac2016
      - funder2019
    trich: social psychological effects typically yield a value of r equal to .21
