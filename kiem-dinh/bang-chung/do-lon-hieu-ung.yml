    ly_do: 'Có phân tích tổng hợp (Rowland 2014, g = 0,50) và một phân tích tổng hợp thứ hai về lớp học cùng cỡ (Yang và cộng sự 2021, g = 0,50, theo PMC10950551 kể lại); nhiều tổng hợp khác (Adesope 2017) cùng chiều, g khoảng 0,50–0,63 theo PMC11461721. Không có thất bại tái lập lớn đã biết. Còn hạn chế: toàn văn Rowland chưa mở được, nhãn này cần khớp trang nhà kham-pha/tri-nho/duong-cong-quen khi D4–D5 làm trang ấy. Review (Claude Sonnet 5.5, 30/10/2026): đủ một tổng hợp thứ hai cùng chiều, không có thất bại tái lập lớn.'
