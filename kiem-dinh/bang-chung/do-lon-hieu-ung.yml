  - id: h27
    cau: 'Một lý do thường được nêu cho việc hiệu ứng co lại là thiên lệch xuất bản: kết quả mạnh dễ được đăng hơn kết quả không có hiệu ứng, nên các nghiên cứu đã đăng có thể phóng đại hiệu ứng.'
    loai: phat-hien
    nguon:
      - franco2014
    trich: Strong results are 40 percentage points more likely to be published than are null results and 60 percentage points more likely to be written up.
    vi_tri: Tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Một lý do: các tạp chí ưu tiên đăng kết quả ''có hiệu ứng'', nên những nghiên cứu tình cờ cho hiệu ứng lớn dễ được đăng hơn." Franco 2014 (221 thí nghiệm khảo sát ở Mỹ) cho thấy kết quả mạnh dễ được đăng hơn, và chủ yếu do tác giả không viết bài; không nói "tạp chí ưu tiên". Chữ mới bám nguồn và nói "một lý do thường được nêu" (nguồn không chứng minh đây là lý do chính của việc co lại). Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; Franco 2014 (Europe PMC đọc lại): "Strong results are 40 percentage points more likely to be published than are null results … Authors do not write up and submit null findings"; câu nói "một lý do thường được nêu", không khẳng định đó là nguyên nhân chính. dung.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1126/science.aac4716" ]
    luot_2_ghi_chu: Thiên lệch xuất bản là giải thích thường nêu (cùng với phân tích linh hoạt); câu viết 'một lý do thường được nêu' thận trọng. Bài OSC không chứng minh nguyên nhân.
    review: dung
