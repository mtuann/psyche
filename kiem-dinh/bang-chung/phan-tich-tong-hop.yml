nhan_dinh:
  - id: pt1
    cau: Một thí nghiệm đơn lẻ, dù nổi tiếng, khó trả lời trọn vẹn câu hỏi "hiệu ứng người ngoài cuộc có thật không"; gộp nhiều nghiên cứu lại là cách thường dùng để có một ước lượng chính xác hơn.
    loai: dinh-nghia
    nguon:
      - cochrane-ch10
    trich: Potential advantages of meta-analyses include an improvement in precision, the ability to answer questions not posed by individual studies, and the opportunity to settle controversies arising from conflicting claims.
    vi_tri: Cochrane Handbook, chương 10, phần Key Points
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "câu trả lời đáng tin nhất không đến từ một thí nghiệm đơn lẻ". Lý do: "đáng tin nhất" mạnh hơn nguồn; Cochrane nói ưu điểm của phân tích tổng hợp là tăng độ chính xác và giúp giải quyết tranh cãi.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10" ]
    luot_2_ghi_chu: Cochrane 10, Key Points. Câu chung về lý do gộp; Fischer 2011 cũng gộp vì nghiên cứu lẻ khác nhau về tình huống.
  - id: pt2
    cau: Năm 2011, Fischer và cộng sự gộp các nghiên cứu về hiệu ứng người ngoài cuộc mà họ tìm được, từ thập niên 1960 đến năm 2010.
    loai: phat-hien
    nguon:
      - fischer2011
    trich: The present work (a) integrates the bystander literature from the 1960s to 2010
    vi_tri: Fischer và cộng sự 2011, Tóm tắt; tr. 522 (Search of Studies)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "họ gộp toàn bộ các nghiên cứu về hiệu ứng người ngoài cuộc ... làm điều mà không thí nghiệm đơn lẻ nào làm được". Lý do: "toàn bộ" mạnh hơn nguồn; các tác giả tìm trong các cơ sở dữ liệu, liên hệ nhà nghiên cứu và loại bài theo tiêu chí (tr. 522), nên chỉ là các nghiên cứu tìm được và đủ điều kiện.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf", "https://doi.org/10.1037/a0023304" ]
    luot_2_ghi_chu: Tóm tắt Fischer và cộng sự 2011 (Psychological Bulletin 137(4)), toàn văn ở Internet Archive.
  - id: pt3
    cau: Phân tích của Fischer và cộng sự gồm 105 hiệu ứng độc lập từ 53 bài báo, với hơn 7.700 người tham gia.
    loai: so-lieu
    nguon:
      - fischer2011
    trich: We obtained a total of 153 effect size estimates with a final sample of N = 105 fully independent effect size estimates from N = 53 articles on the basis of more than 7,700 participants
    vi_tri: Fischer và cộng sự 2011, tr. 523 (Final Sample of Studies and Calculation of Effect Sizes)
    ket_qua: dung
    ghi_chu: Số 53 bài báo thêm so với chữ cũ (chữ cũ chỉ có 105 và 7.700); lấy từ cùng đoạn của nguồn.
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf" ]
    luot_2_ghi_chu: Mục Final Sample of Studies, tr. 523.
  - id: pt4
    cau: Độ lớn gộp của hiệu ứng người ngoài cuộc là g = −0,35 (mô hình hiệu ứng cố định).
    loai: so-lieu
    nguon:
      - fischer2011
    trich: In a fixed effects model, data from over 7,700 participants and 105 independent effect sizes revealed an overall effect size of g = -0.35.
    vi_tri: Fischer và cộng sự 2011, Tóm tắt; tr. 523 (Mean Effect Sizes)
    ket_qua: dung
    ghi_chu: Chữ cũ không nói "mô hình hiệu ứng cố định"; thêm cho đúng nguồn (mô hình hiệu ứng ngẫu nhiên cho −0,33, tr. 523). Trang nhà (Darley và Latané) nêu cùng g = −0,35.
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf" ]
    luot_2_ghi_chu: Mục Mean Effect Sizes. Mô hình hiệu ứng ngẫu nhiên cho −0,33.
  - id: pt5
    cau: Kỹ thuật đằng sau con số đó có tên là phân tích tổng hợp.
    loai: dinh-nghia
    nguon:
      - cochrane-ch10
      - fischer2011
    trich: Meta-analysis is the statistical combination of results from two or more separate studies. | should be submitted to a meta-analytic integration
    vi_tri: Cochrane Handbook, chương 10, Key Points; Fischer 2011, tên bài
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf", "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10" ]
    luot_2_ghi_chu: "Fischer gọi công trình là meta-analysis (tiêu đề: A Meta-Analytic Review)."
  - id: pt6
    cau: Cochrane Handbook nhấn mạnh rằng phân tích tổng hợp có thể gây hiểu lầm nghiêm trọng nếu thiếu chú ý đến thiết kế nghiên cứu, thiên lệch trong từng nghiên cứu, khác biệt giữa các nghiên cứu và thiên lệch khi báo cáo.
    loai: phat-hien
    nguon:
      - cochrane-ch10
    trich: they also have the potential to mislead seriously, particularly if specific study designs, within-study biases, variation across studies, and reporting biases are not carefully considered.
    vi_tri: Cochrane Handbook, chương 10, Key Points
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nghe có vẻ như phép màu thống kê — và đúng là nó gần như vậy ... một ''kính lúp'' cực mạnh để nhìn vào bất kỳ lĩnh vực nào của tâm lý học". Lý do: câu hùng biện không có nguồn, trái với lời cảnh báo của Cochrane; thay bằng lời cảnh báo ấy.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10" ]
    luot_2_ghi_chu: Cochrane 10, Key Points.
  - id: pt7
    cau: Trang Darley và Latané có ở /psyche/thi-nghiem/darley-latane/ (thí nghiệm gốc của hiệu ứng người ngoài cuộc).
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: src/content/docs/thi-nghiem/darley-latane.md có trong repo; src/data/trang.yml có id thi-nghiem/darley-latane.'
  - id: pt8
    cau: Phân tích tổng hợp là kỹ thuật thống kê gộp kết quả của hai hay nhiều nghiên cứu riêng lẻ thành một ước lượng chung.
    loai: dinh-nghia
    nguon:
      - cochrane-ch10
    trich: Meta-analysis is the statistical combination of results from two or more separate studies.
    vi_tri: Cochrane Handbook, chương 10, Key Points
    ket_qua: dung
    ghi_chu: 'Chữ cũ: "gộp kết quả của nhiều nghiên cứu độc lập về cùng một câu hỏi". Giữ ý, thêm "hai hay nhiều" theo Cochrane; điều kiện "cùng một câu hỏi" xem pt51.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10" ]
    luot_2_ghi_chu: Cochrane 10, Key Points.
  - id: pt9
    cau: Cách phổ biến là gộp kết quả đã tóm tắt của từng nghiên cứu (độ lớn hiệu ứng và sai số của nó), không phải dữ liệu thô của từng người; cũng có loại phân tích dùng dữ liệu thô của từng người tham gia.
    loai: dinh-nghia
    nguon:
      - cochrane-ch10
    trich: The basic data required for the analysis are therefore an estimate of the intervention effect and its standard error from each study. | either through re-analysis of individual participant data or from aggregate statistics presented in the study reports
    vi_tri: Cochrane Handbook, chương 10, mục 10.3.1; mục 10.9 (time-to-event)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Lưu ý: gộp kết quả, không phải gộp dữ liệu thô." Lý do: tuyệt đối hóa; Cochrane nói dữ liệu cơ bản là ước lượng và sai số của từng nghiên cứu, và có phân tích dựa trên dữ liệu từng người tham gia.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10" ]
    luot_2_ghi_chu: Mục 10.2.1 và 10.3; dữ liệu từng người (individual participant data) có chương riêng (Chương 26), mục 10.11.3 nhắc tới.
  - id: pt10
    cau: 'Ước lượng chung là một trung bình có trọng số: ước lượng của nghiên cứu lớn, chính xác hơn được tính nặng hơn ước lượng của nghiên cứu nhỏ.'
    loai: dinh-nghia
    nguon:
      - cochrane-ch10
    trich: Most meta-analysis methods are variations on a weighted average of the effect estimates from the different studies. | Thus, larger studies, which have smaller standard errors, are given more weight than smaller studies, which have larger standard errors.
    vi_tri: Cochrane Handbook, chương 10, Key Points; mục 10.3 (phương pháp phương sai nghịch đảo)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Mỗi nghiên cứu đóng góp một ''phiếu bầu''". Lý do: ẩn dụ "phiếu bầu" dễ nhầm với đếm phiếu, cách Cochrane coi là không chấp nhận được (pt11); thay bằng "ước lượng". "Hầu hết phương pháp là biến thể của trung bình có trọng số" (Cochrane): đã viết "một trung bình có trọng số" cho phương pháp phương sai nghịch đảo nêu ở trích.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10" ]
    luot_2_ghi_chu: Mục 10.2.1 (trung bình có trọng số) và 10.3.
  - id: pt11
    cau: Cách đếm xem bao nhiêu nghiên cứu "nói có" (đếm phiếu theo ý nghĩa thống kê) bị Cochrane Handbook coi là có hạn chế nghiêm trọng và không chấp nhận được.
    loai: phat-hien
    nguon:
      - cochrane-ch12
    trich: Synthesis methods that involve vote counting based on statistical significance have serious limitations and are unacceptable.
    vi_tri: Cochrane Handbook, chương 12, Key Points
    ket_qua: da-sua
    ghi_chu: 'gia-dinh: ví dụ 20 nghiên cứu về trà xanh (12 có, 5 không, 3 không rõ) là tình huống giả định. Chữ cũ: "Đếm số nghiên cứu thì rối". Lý do: nguồn nói cụ thể về cách đếm theo ý nghĩa thống kê; thay chữ mơ hồ bằng lời của Cochrane.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-12" ]
    luot_2_ghi_chu: Câu này ở Chương 12 (Key Points và mục 12.2.2.1), không phải Chương 10; câu trên trang không nêu chương nên vẫn đúng.
  - id: pt12
    cau: Phân tích tổng hợp quy kết quả của mỗi nghiên cứu về cùng một thước đo, gọi là độ lớn hiệu ứng, rồi tính trung bình có trọng số.
    loai: dinh-nghia
    nguon:
      - cochrane-ch10
      - fischer2011
    trich: to choose suitable effect measures for comparing intervention groups. | The effect size g recommended by Hedges and Becker (1986) was used in the statistical analysis.
    vi_tri: Cochrane Handbook, chương 10, Key Points; Fischer 2011, tr. 523
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10" ]
    luot_2_ghi_chu: Mục 10.2.1.
  - id: pt13
    cau: Kết quả là một ước lượng chung kèm khoảng tin cậy, cho biết ước lượng ấy chính xác đến mức nào.
    loai: dinh-nghia
    nguon:
      - cochrane-ch10
    trich: The standard error of the summary intervention effect can be used to derive a confidence interval, which communicates the precision (or uncertainty) of the summary estimate
    vi_tri: Cochrane Handbook, chương 10, mục 10.2.1
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "chúng ta chắc chắn đến mức nào". Lý do: khoảng tin cậy nói về độ chính xác (precision) của ước lượng, không phải mức "chắc chắn" về hiệu ứng.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10" ]
    luot_2_ghi_chu: Mục 10.2.1.
  - id: pt14
    cau: Kết quả của phân tích tổng hợp thường được vẽ thành forest plot (biểu đồ rừng), hiển thị ước lượng hiệu ứng và khoảng tin cậy của từng nghiên cứu và của ước lượng gộp.
    loai: dinh-nghia
    nguon:
      - cochrane-ch10
    trich: A forest plot displays effect estimates and confidence intervals for both individual studies and meta-analyses
    vi_tri: Cochrane Handbook, chương 10, mục 10.2
    ket_qua: dung
    ghi_chu: 'Chữ cũ: "trông đáng sợ nhưng đọc rất dễ một khi biết quy tắc". Bỏ vế đánh giá chủ quan.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10" ]
    luot_2_ghi_chu: Mục 10.2.1.
  - id: pt15
    cau: Trên forest plot, mỗi dòng ngang là một nghiên cứu; điểm (khối vuông) là hiệu ứng nghiên cứu đó ước lượng; đường ngang hai bên là khoảng tin cậy.
    loai: dinh-nghia
    nguon:
      - cochrane-ch10
    trich: Each study is represented by a block at the point estimate of intervention effect with a horizontal line extending either side of the block. | the horizontal line depicts the confidence interval
    vi_tri: Cochrane Handbook, chương 10, mục 10.2
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10", "https://pmc.ncbi.nlm.nih.gov/articles/PMC1120528/" ]
    luot_2_ghi_chu: Cochrane 10.2.1; Lewis & Clarke 2001 (BMJ) mô tả khối vuông. Diện tích khối là trọng số (câu không nói, không sai).
  - id: pt16
    cau: Khoảng tin cậy là dải hiệu ứng tương thích với kết quả của nghiên cứu.
    loai: dinh-nghia
    nguon:
      - cochrane-ch10
    trich: The confidence interval depicts the range of intervention effects compatible with the study’s result.
    vi_tri: Cochrane Handbook, chương 10, mục 10.2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "vùng mà hiệu ứng ''thật'' nhiều khả năng nằm trong đó". Lý do: cách diễn giải ấy là hiểu sai thường gặp về khoảng tin cậy; Cochrane nói "range of intervention effects compatible with the study''s result".'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10" ]
    luot_2_ghi_chu: Mục 10.2.1.
  - id: pt17
    cau: Với các thước đo dạng chênh lệch (như g), giá trị 0 nghĩa là không có chênh lệch giữa hai nhóm; trên forest plot, vạch thẳng đứng ở số 0 là vạch "không có hiệu ứng".
    loai: dinh-nghia
    nguon:
      - cochrane-ch6
    trich: For difference measures, a value of 0 represents no difference between the groups.
    vi_tri: Cochrane Handbook, chương 6, mục 6.1
    ket_qua: dung
    ghi_chu: 'Vế "vạch thẳng đứng" là cách vẽ của hình trên trang (đã kiểm trên hình: cột 30 của dòng trục); Handbook mô tả hình forest plot bằng ảnh nên chỉ trích được phần giá trị 0.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-06", "https://pmc.ncbi.nlm.nih.gov/articles/PMC1120528/" ]
    luot_2_ghi_chu: "Cochrane 6 (mục 6.1, đo chênh lệch); Lewis & Clarke 2001: 'line of no effect'."
  - id: pt18
    cau: 'Nếu khoảng tin cậy của một nghiên cứu cắt qua vạch 0, "không có hiệu ứng" vẫn nằm trong các giá trị tương thích với kết quả đó: riêng nghiên cứu ấy chưa đủ để khẳng định có hiệu ứng, và cũng chưa đủ để khẳng định không có.'
    loai: dinh-nghia
    nguon:
      - cochrane-ch10
      - cochrane-ch15
    trich: The confidence interval depicts the range of intervention effects compatible with the study’s result. | A common mistake is to confuse ‘no evidence of an effect’ with ‘evidence of no effect’. When the confidence intervals are too wide (e.g. including no effect), it is wrong to claim that the experimental intervention has ‘no effect’
    vi_tri: Cochrane Handbook, chương 10, mục 10.2; chương 15, mục về diễn đạt kết quả
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nghiên cứu đó chưa đủ bằng chứng để khẳng định hiệu ứng tồn tại". Thêm vế "cũng chưa đủ để khẳng định không có" (nguồn: lỗi hay gặp là nhầm "chưa có bằng chứng về hiệu ứng" với "có bằng chứng là không có hiệu ứng").'
    luot_2: dung
