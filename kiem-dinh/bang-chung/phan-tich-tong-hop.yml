    ghi_chu: 'Chữ cũ: "Nhớ ''ngăn kéo hồ sơ'' chứ — các nghiên cứu cho kết quả ''không có gì'' thường không được đăng?" Lý do: "thường không được đăng" mạnh hơn nguồn ("more likely ... to be available").'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13" ]
    luot_2_ghi_chu: Cochrane 13.1.
  - id: pt39
    cau: Funnel plot (biểu đồ phễu) là biểu đồ phân tán ước lượng hiệu ứng của từng nghiên cứu theo thước đo kích thước hay độ chính xác của nghiên cứu đó.
    loai: dinh-nghia
    nguon:
      - cochrane-ch13
    trich: A funnel plot is a simple scatter plot of intervention effect estimates from individual studies against a measure of each study’s size or precision.
    vi_tri: Cochrane Handbook, chương 13, mục 13.3.4.2
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13" ]
    luot_2_ghi_chu: Mục 13.3.4.2.
  - id: pt40
    cau: Trên funnel plot, mỗi chấm là một nghiên cứu, trục ngang là hiệu ứng đo được, trục dọc là độ chính xác (nghiên cứu càng lớn, chấm càng cao).
    loai: dinh-nghia
    nguon:
      - cochrane-ch13
    trich: it is most common to plot the effect estimates on the horizontal scale, and thus the measure of study size on the vertical axis
    vi_tri: Cochrane Handbook, chương 13, mục 13.3.4.2
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13" ]
    luot_2_ghi_chu: Mục 13.3.4.2; Cochrane khuyên trục dọc là sai số chuẩn (vẽ ngược, nên nghiên cứu lớn ở trên), khớp câu.
  - id: pt41
    cau: 'Nghiên cứu nhỏ cho ước lượng dao động rộng hơn nghiên cứu lớn, nên bình thường các chấm xếp thành hình phễu đối xứng: nghiên cứu lớn chụm lại gần đáp án ở đỉnh, nghiên cứu nhỏ tỏa rộng ở đáy.'
    loai: dinh-nghia
    nguon:
      - cochrane-ch13
    trich: Effect estimates from small studies will therefore typically scatter more widely at the bottom of the graph, with the spread narrowing among larger studies. Ideally, the plot should approximately resemble a symmetrical (inverted) funnel.
    vi_tri: Cochrane Handbook, chương 13, mục 13.3.4.2
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Nếu mọi thứ bình thường, các chấm xếp thành hình phễu đối xứng ... tỏa đều cả hai bên". Làm mềm theo nguồn: "typically", "approximately".'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13" ]
    luot_2_ghi_chu: Mục 13.3.4.2. 'Đáp án' ở đỉnh hiểu là hiệu ứng thật khi không có thiên lệch (Hình 13.3.b, panel A).
  - id: pt42
    cau: Nếu một góc đáy phễu trống, ví dụ do thiếu các nghiên cứu nhỏ không có ý nghĩa thống kê, thì có thể các nghiên cứu đó đã được làm nhưng chưa được công bố; khi đó ước lượng gộp có xu hướng phóng đại hiệu ứng.
    loai: phat-hien
    nguon:
      - cochrane-ch13
    trich: this will lead to an asymmetrical appearance of the funnel plot with a gap at the bottom corner of the graph | the summary estimate calculated in a meta-analysis will tend to over-estimate the intervention effect
    vi_tri: Cochrane Handbook, chương 13, mục 13.3.4.2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "thì rất có thể những nghiên cứu đó đã được làm nhưng không được đăng ... con số gộp có thể đang bị thổi phồng vì chỉ tính những nghiên cứu ''đẹp''". Lý do: "rất có thể" mạnh hơn nguồn ("if there is bias due to missing evidence"); sửa thành điều kiện.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13" ]
    luot_2_ghi_chu: Mục 13.3.4.2.
  - id: pt43
    cau: 'Phễu lệch chỉ là một dấu hiệu: nó cũng có thể do các lý do khác ngoài thiên lệch xuất bản (Cochrane gọi chung là hiệu ứng nghiên cứu nhỏ).'
    loai: dinh-nghia
    nguon:
      - cochrane-ch13
    trich: the funnel plot should be seen as a generic means of displaying small-study effects | Small-study effects may be due to reasons other than non-reporting bias
    vi_tri: Cochrane Handbook, chương 13, mục 13.3.4.2
    ket_qua: dung
    ghi_chu: Câu thêm so với trang cũ (trang cũ chỉ nói phễu khuyết là "dấu hiệu cảnh báo").
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13" ]
    luot_2_ghi_chu: Mục 13.3.4.3.
  - id: pt44
    cau: Trong phân tích của Fischer, đồ thị phễu tương đối đối xứng, và thử trim-and-fill không đổi ước lượng.
    loai: phat-hien
    nguon:
      - fischer2011
    trich: The funnel plot was relatively symmetrical and thus no studies had to be imputed by the Trim and Fill analysis. | With this additional control, the estimated effect size for the bystander effect did not change
    vi_tri: Fischer 2011, tr. 532 (Controlling Publication Bias)
    ket_qua: dung
    ghi_chu: Câu thêm so với trang cũ; cùng ý với trang nhà Darley và Latané.
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf" ]
    luot_2_ghi_chu: Mục Controlling Publication Bias.
  - id: pt45
    cau: 'Hình funnel-demo gồm hai phễu: phễu bên trái đối xứng, phễu bên phải khuyết một bên đáy; chú thích nói phễu khuyết là dấu hiệu đáng ngờ có thiên lệch xuất bản.'
    loai: ve-site
    nguon:
      - cochrane-ch13
    trich: will lead to an asymmetrical appearance of the funnel plot with a gap at the bottom corner of the graph
    vi_tri: src/hinh/funnel-demo.html; Cochrane Handbook, chương 13, mục 13.3.4.2
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên src/hinh/funnel-demo.html: phễu phải không có chấm nào ở phía trái đường giữa từ hàng thứ hai trở xuống (x < 520 khi y > 270), phễu trái cân đối; hình không có số liệu. Chú thích hình chưa nhắc rằng phễu lệch còn có thể do lý do khác (xem pt43); ghi lại cho người giao, không sửa hình.'
  - id: pt46
    cau: Gộp càng nhiều dữ liệu, ước lượng càng chính xác.
    loai: dinh-nghia
    nguon:
      - cochrane-ch10
    trich: Potential advantages of meta-analyses include an improvement in precision
    vi_tri: Cochrane Handbook, chương 10, Key Points
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Càng nhiều càng tốt." Làm rõ: nói về độ chính xác, không về chất lượng.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10" ]
    luot_2_ghi_chu: Đúng theo nghĩa độ chính xác thống kê (khoảng tin cậy hẹp hơn); không có nghĩa là hết thiên lệch (Cochrane 10.1, 13.3). Các câu pt52, pt53 đã nói giới hạn này.
  - id: pt47
    cau: Khi chỉ có vài nghiên cứu nhỏ, mức dao động giữa các nghiên cứu được ước lượng rất kém và khoảng tin cậy có thể sai.
    loai: phat-hien
    nguon:
      - cochrane-ch10
    trich: When there is little information, either because there are few studies or if the studies are small with few events, a random-effects analysis will provide poor estimates of the amount of heterogeneity | This approach can yield overly narrow confidence intervals for the summary effect, particularly when there are few studies
    vi_tri: Cochrane Handbook, chương 10, mục 10.10.4 và 10.10.4.3
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Vài nghiên cứu nhỏ gộp lại vẫn là bằng chứng yếu." Lý do: nguồn nói cụ thể về ước lượng mức dao động và khoảng tin cậy khi ít nghiên cứu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10" ]
    luot_2_ghi_chu: Mục 10.10.4.2 và 10.10.4.4.
  - id: pt48
    cau: Nếu khoảng tin cậy gộp cắt qua vạch 0, ước lượng gộp chưa loại trừ được "không có hiệu ứng".
    loai: dinh-nghia
    nguon:
      - cochrane-ch15
    trich: When the confidence intervals are too wide (e.g. including no effect), it is wrong to claim that the experimental intervention has ‘no effect’
    vi_tri: Cochrane Handbook, chương 15, mục về diễn đạt kết quả
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "đáp án chung còn chưa chắc chắn". Lý do: nói đúng điều khoảng tin cậy cho biết.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-15", "https://pmc.ncbi.nlm.nih.gov/articles/PMC1120528/" ]
    luot_2_ghi_chu: "Cochrane 15.3; Lewis & Clarke 2001: 'Significance is achieved ... if the diamond is clear of the line of no effect.'"
  - id: pt49
    cau: Cochrane khuyến nghị chỉ gộp khi người tham gia, can thiệp, so sánh và kết quả đo đủ giống nhau để cho một con số có nghĩa.
    loai: loi-khuyen
    nguon:
      - cochrane-ch10
    trich: Undertake (or display) a meta-analysis only if participants, interventions, comparisons and outcomes are judged to be sufficiently similar to ensure an answer that is clinically meaningful.
    vi_tri: Cochrane Handbook, chương 10, MECIR C62 (mục 10.10.1)
    ket_qua: da-sua
    ghi_chu: 'Cochrane viết cho can thiệp y tế; trang dùng như nguyên tắc chung của phương pháp. Chữ cũ: "Các nghiên cứu có quá khác nhau không? Tác giả có giải thích được vì sao không?" (không nguồn); viết lại thành khuyến nghị của Cochrane.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10" ]
    luot_2_ghi_chu: MECIR C62 (mức bắt buộc), mục 10.10.
  - id: pt50
    cau: Phễu lệch chưa chứng minh có thiên lệch xuất bản.
    loai: dinh-nghia
    nguon:
      - cochrane-ch13
    trich: Small-study effects may be due to reasons other than non-reporting bias
    vi_tri: Cochrane Handbook, chương 13, mục 13.3.4.2
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13" ]
    luot_2_ghi_chu: Mục 13.3.4.5.
  - id: pt51
    cau: Cochrane khuyến nghị định trước (trong đề cương) việc điều tra mối liên hệ giữa đặc điểm nghiên cứu và độ lớn hiệu ứng, tức các phân tích nhóm con.
    loai: loi-khuyen
    nguon:
      - cochrane-ch10
    trich: Where possible these investigations should be specified a priori (i.e. in the protocol for the systematic review).
    vi_tri: Cochrane Handbook, chương 10, mục 10.10.1
    ket_qua: da-sua
    ghi_chu: 'Cochrane viết cho can thiệp y tế; trang dùng như nguyên tắc chung của phương pháp. Chữ cũ: "Phân tích tổng hợp cũng có thể bị ''đào bới'' — kế hoạch cần được khóa trước" và "Ai làm, đăng ở đâu". Lý do: nguồn khuyến nghị định trước các phân tích nhóm con; vế "bị đào bới" và "đăng ở đâu" không có nguồn nên bỏ.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10" ]
    luot_2_ghi_chu: Mục 10.11.5.2.
  - id: pt52
    cau: 'Phân tích tổng hợp chỉ tốt bằng các nghiên cứu nó gộp vào và cách chọn chúng: kết quả có thể gây hiểu lầm nếu thiếu chú ý đến câu hỏi, tiêu chí chọn nghiên cứu, thiên lệch trong từng nghiên cứu và các bước khác trước khi gộp.'
    loai: dinh-nghia
    nguon:
      - cochrane-ch10
    trich: results of meta-analyses can be very misleading if suitable attention has not been given to formulating the review question; specifying eligibility criteria; identifying and selecting studies; collecting appropriate data; considering risk of bias
    vi_tri: Cochrane Handbook, chương 10, mục 10.1
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Nguyên tắc vàng: phân tích tổng hợp chỉ tốt bằng các nghiên cứu nó gộp vào. Gộp 50 nghiên cứu dở không cho ra một kết luận hay — người ta gọi đùa là ''rác vào, rác ra''". Bỏ vế "gọi đùa" (không nguồn), viết theo lời Cochrane.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10" ]
    luot_2_ghi_chu: Mục 10.1.
  - id: pt53
    cau: Phân tích tổng hợp gộp kết quả theo trọng số, và kết luận chỉ đáng tin bằng chất lượng các nghiên cứu được gộp.
    loai: nhan
    nguon:
      - cochrane-ch10
      - cochrane-ch12
      - cochrane-ch13
    trich: Most meta-analysis methods are variations on a weighted average of the effect estimates from the different studies. | results of meta-analyses can be very misleading if suitable attention has not been given to formulating the review question
    vi_tri: Cochrane Handbook, chương 10, Key Points và mục 10.1; chương 12 và 13 (lời nhắc về đếm phiếu và thiếu kết quả)
    ket_qua: dung
    nhan: vung-chac
    co_so:
      - 'Cochrane Handbook (chương 10): tài liệu hướng dẫn chuẩn của tổ chức tổng quan hệ thống lớn nhất, mô tả phân tích tổng hợp là trung bình có trọng số và nêu rõ các điều kiện để kết quả không gây hiểu lầm'
      - 'Cochrane Handbook (chương 12, 13): đếm phiếu theo ý nghĩa thống kê là không chấp nhận được; thiếu kết quả làm lệch ước lượng'
    ly_do: 'Là nguyên tắc phương pháp, không phải phát hiện thực nghiệm; thước đo mục 4 viết cho phát hiện thực nghiệm. Xét theo đồng thuận của tài liệu hướng dẫn: ba chương của Cochrane Handbook, tài liệu chuẩn của lĩnh vực, nêu nhất quán các điều này; không có nguồn nào phản bác. Cùng cách xử lý với trang p-value (D4-L1).'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10", "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13" ]
    luot_2_ghi_chu: "Nội dung đúng. Đây là nguyên tắc phương pháp, xét theo đồng thuận: Cochrane Handbook (hướng dẫn phương pháp chuẩn) nói rõ cả hai vế, nên mức Vững chắc là hợp. Danh sách không ghi nhãn nào được gán, nên chỉ xét nội dung; lượt 1 kiểm nhãn trong hồ sơ."
  - id: pt54
    cau: 'Fischer và cộng sự (2011): hiệu ứng người ngoài cuộc có độ lớn gộp g = −0,35 và yếu đi khi nguy hiểm rõ ràng.'
    loai: nhan
    nguon:
      - fischer2011
    trich: In a fixed effects model, data from over 7,700 participants and 105 independent effect sizes revealed an overall effect size of g = -0.35. | The bystander effect was attenuated when situations were perceived as dangerous (compared with non-dangerous)
    vi_tri: Fischer 2011, Tóm tắt
    ket_qua: dung
    nhan: kha-vung
    co_so:
      - 'Fischer và cộng sự (2011): phân tích tổng hợp 105 hiệu ứng độc lập, hơn 7.700 người, thập niên 1960 đến 2010; kết quả giữ nguyên ở mô hình hiệu ứng ngẫu nhiên; phễu cân, trim-and-fill không đổi ước lượng'
    ly_do: Một phân tích tổng hợp tốt, nhưng là mã hóa lại các nghiên cứu cũ; các biến điều chỉnh tương quan với nhau; chưa có thí nghiệm hay tái lập lớn cho riêng yếu tố nguy hiểm; mẫu chủ yếu theo văn liệu tiếng Anh và tiếng Đức (tr. 522). Khá vững theo mục 4, cùng mức mà hồ sơ trang nhà Darley và Latané (n31) cho phát hiện "khi nguy hiểm rõ ràng, hiệu ứng yếu đi". Khung chỉ nói độ lớn gộp và chiều của yếu đi, không nói về cơ chế.
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf" ]
    luot_2_ghi_chu: "Nội dung khớp tóm tắt Fischer 2011. Danh sách không ghi nhãn. Theo mục 4: hiệu ứng chính (g âm) có một phân tích tổng hợp tốt, đủ cho Vững chắc; vế 'yếu đi khi nguy hiểm' dựa trên so sánh giữa các nghiên cứu (biến điều chỉnh mã hóa lại, không định trước) trong một phân tích tổng hợp, hợp với Khá vững hơn là Vững chắc. Nếu khung gộp hai vế mà gán Vững chắc thì nên xem lại."
  - id: pt55
    cau: Mức "Khá vững" của khung thứ hai trùng với mức trang Darley và Latané dùng cho phát hiện "khi nguy hiểm rõ ràng, hiệu ứng yếu đi".
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm: src/content/docs/thi-nghiem/darley-latane.md, mục "Mức độ chắc chắn", có khung kha-vung[khi nguy hiểm rõ ràng, hiệu ứng yếu đi]; hồ sơ kiem-dinh/thi-nghiem/darley-latane.yml n31 nhan: kha-vung.'
  - id: pt56
    cau: 'Trong hình bài tập (ba nghiên cứu giả định): nghiên cứu A (200 người) có điểm hiệu ứng dương nhỏ và khoảng tin cậy hẹp nhất trong ba nghiên cứu, không chạm vạch 0, chỉ vừa nhích khỏi vạch 0; nghiên cứu B (40 người) có điểm hiệu ứng lớn nhất và khoảng tin cậy rất rộng, cắt qua vạch 0; nghiên cứu C (150 người) có hiệu ứng gần bằng 0 và khoảng tin cậy cắt qua vạch 0 ở cả hai phía; hình thoi gộp dương, nhỏ, chạm sát vạch 0.'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'gia-dinh: toàn bộ số liệu là giả định. Đã kiểm trên hình (cột ký tự; vạch 0 ở cột 20, mỗi 0,2 cách 6 cột): A từ cột 21 đến 35, điểm ở 28; B từ 17 đến 50, điểm ở 34; C từ 12 đến 28, điểm ở 20; GỘP từ 20 đến 30, điểm ở 25 (chạm vạch 0). Độ rộng A 14 cột, C 16, B 33. Chữ cũ: hình cũ vẽ cả A, B, C và hình thoi nằm hẳn bên phải vạch 0 (trái với đáp án: B "cắt qua vạch 0", C "gần bằng 0", gộp "chạm vạch 0"); đã vẽ lại hình và chỉnh đáp án cho khớp (B "điểm lớn nhất", không còn "trông rất lớn"; "ba nghiên cứu lớn" thành "ba nghiên cứu").'
  - id: pt57
    cau: Nghiên cứu nhỏ cho ước lượng dao động rộng hơn nghiên cứu lớn, nên một con số "khủng" từ nghiên cứu nhỏ cần dè dặt.
    loai: dinh-nghia
    nguon:
      - cochrane-ch13
    trich: Effect estimates from small studies will therefore typically scatter more widely at the bottom of the graph, with the spread narrowing among larger studies.
    vi_tri: Cochrane Handbook, chương 13, mục 13.3.4.2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nghiên cứu nhỏ cho hiệu ứng ''khủng'' chính là kiểu kết quả hay bị thổi phồng do may rủi". Lý do: "hay bị thổi phồng" không có nguồn trực tiếp; nguồn nói ước lượng của nghiên cứu nhỏ phân tán rộng hơn. Dè dặt là suy luận từ đó.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13" ]
    luot_2_ghi_chu: Mục 13.3.4.2; Button 2013 về hiệu ứng bị thổi phồng ở nghiên cứu nhỏ cũng ủng hộ vế sau.
  - id: pt58
    cau: Ba nghiên cứu giả định cho ba con số khác nhau, nhưng các khoảng tin cậy chồng lên nhau nhiều, nên hình chưa cho thấy dao động vượt mức may rủi.
    loai: dinh-nghia
    nguon:
      - cochrane-ch10
    trich: If confidence intervals for the results of individual studies (generally depicted graphically using horizontal lines) have poor overlap, this generally indicates the presence of statistical heterogeneity.
    vi_tri: Cochrane Handbook, chương 10, mục 10.10.2
    ket_qua: da-sua
    ghi_chu: 'Suy luận từ câu của Cochrane (khoảng tin cậy chồng nhau ít thì gợi ý bất đồng; ở đây chồng nhiều). Đã kiểm trên hình: ba khoảng đều chứa các cột 21–28. Chữ cũ: "Ba nghiên cứu lớn cho ba câu chuyện khác nhau ... đây chính là tính không đồng nhất". Lý do: B không lớn, các khoảng chồng nhau, nên gọi là không đồng nhất là sai.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10" ]
    luot_2_ghi_chu: "Câu mô tả hình giả định; không xem được hình, chỉ xét lập luận: khoảng tin cậy chồng nhiều thì không gợi ý dao động vượt mức may rủi (Cochrane 10.10.2). Với ba nghiên cứu, mức dao động cũng ước lượng kém, nên 'chưa cho thấy' là cách nói đúng mức."
  - id: pt59
    cau: Khi khoảng tin cậy rộng và bao gồm cả "không có hiệu ứng", nhầm "chưa có bằng chứng về hiệu ứng" với "có bằng chứng là không có hiệu ứng" là một lỗi thường gặp.
    loai: phat-hien
    nguon:
      - cochrane-ch15
    trich: A common mistake is to confuse ‘no evidence of an effect’ with ‘evidence of no effect’.
    vi_tri: Cochrane Handbook, chương 15, mục về diễn đạt kết quả
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: kết luận "chưa đủ bằng chứng; cần thêm các nghiên cứu lớn, đăng ký trước". Lý do: vế "cần thêm các nghiên cứu lớn, đăng ký trước" không có nguồn; thay bằng cảnh báo của Cochrane.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-15" ]
    luot_2_ghi_chu: Mục 15.6.4.
  - id: pt60
    cau: Một tin tức chỉ đưa tin nghiên cứu B sẽ ưu ái một nghiên cứu hơn các nghiên cứu còn lại mà không có lý do chính đáng.
    loai: dinh-nghia
    nguon:
      - cochrane-ch12
    trich: some studies or findings are privileged above others without appropriate justification
    vi_tri: Cochrane Handbook, chương 12, mục 12.1
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "sẽ là ví dụ điển hình của việc đọc sai bằng chứng". Viết theo cách Cochrane nêu rủi ro của việc kể từng nghiên cứu một.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-12" ]
    luot_2_ghi_chu: Mục 12.2 (áp vào ví dụ tin tức chỉ đưa một nghiên cứu).
  - id: pt61
    cau: 'Quiz 1: khi đường ngang (khoảng tin cậy) của một nghiên cứu cắt qua vạch 0, "không có hiệu ứng" vẫn nằm trong các giá trị tương thích với kết quả đó, nên riêng nó chưa đủ để khẳng định có hiệu ứng; nhưng cũng không chứng minh được hiệu ứng bằng 0.'
    loai: dinh-nghia
    nguon:
      - cochrane-ch10
      - cochrane-ch15
    trich: The confidence interval depicts the range of intervention effects compatible with the study’s result. | A common mistake is to confuse ‘no evidence of an effect’ with ‘evidence of no effect’.
    vi_tri: Cochrane Handbook, chương 10, mục 10.2; chương 15
    ket_qua: dung
    ghi_chu: 'Phương án sai: "chắc chắn sai nên bị loại", "chắc chắn bằng đúng 0". Giải thích không dựa vào vị trí lựa chọn.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10", "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-15" ]
    luot_2_ghi_chu: Như pt18.
  - id: pt62
    cau: 'Quiz 2: với phương pháp phương sai nghịch đảo, trọng số của mỗi nghiên cứu tỉ lệ nghịch với phương sai của ước lượng, nên nghiên cứu có sai số chuẩn nhỏ (thường là nghiên cứu lớn) được tính nặng hơn.'
    loai: dinh-nghia
    nguon:
      - cochrane-ch10
    trich: the weight given to each study is chosen to be the inverse of the variance of the effect estimate (i.e. 1 over the square of its standard error). Thus, larger studies, which have smaller standard errors, are given more weight than smaller studies, which have larger standard errors.
    vi_tri: Cochrane Handbook, chương 10, mục 10.3
    ket_qua: dung
    ghi_chu: 'Phương án sai: "nghiên cứu lớn luôn được thiết kế tốt hơn", "nhiều tác giả hơn" là phương án nhiễu.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10" ]
    luot_2_ghi_chu: Mục 10.3.
  - id: pt63
    cau: 'Quiz 3: phễu khuyết một góc đáy có thể do thiếu các nghiên cứu nhỏ chưa được công bố, nhưng cũng có thể do các lý do khác; không chứng minh chắc chắn thiên lệch xuất bản.'
    loai: dinh-nghia
    nguon:
      - cochrane-ch13
    trich: the funnel plot should be seen as a generic means of displaying small-study effects | Small-study effects may be due to reasons other than non-reporting bias
    vi_tri: Cochrane Handbook, chương 13, mục 13.3.4.2
    ket_qua: dung
    ghi_chu: 'Phương án sai: "chứng minh chắc chắn có thiên lệch xuất bản", "chứng tỏ ước lượng gộp chắc chắn đúng".'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13" ]
    luot_2_ghi_chu: Mục 13.3.4.2 và 13.3.4.5.
  - id: pt64
    cau: 'Thử suy ngẫm 2: funnel plot khuyết một góc có thể gợi ý các nghiên cứu nhỏ, không có kết quả nổi bật, chưa được công bố.'
    loai: dinh-nghia
    nguon:
      - cochrane-ch13
    trich: this will lead to an asymmetrical appearance of the funnel plot with a gap at the bottom corner of the graph
    vi_tri: Cochrane Handbook, chương 13, mục 13.3.4.2
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Funnel plot khuyết một bên gợi ý các nghiên cứu ''xấu'' đã bị giấu." Lý do: "xấu", "bị giấu" không có nguồn; nguồn nói nghiên cứu nhỏ không có ý nghĩa thống kê chưa công bố.'
    luot_2: dung
    luot_2_nguon: [ "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-13" ]
    luot_2_ghi_chu: Mục 13.3.4.2; 'có thể gợi ý' đúng mức (13.3.4.5).
  - id: pt65
    cau: 'Thử suy ngẫm 3: phân tích của Fischer cho thấy hiệu ứng người ngoài cuộc yếu đi trong tình huống nguy hiểm.'
    loai: phat-hien
    nguon:
      - fischer2011
    trich: The bystander effect was attenuated when situations were perceived as dangerous (compared with non-dangerous)
    vi_tri: Fischer 2011, Tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252Fa0017364.zip/10.1037%252Fa0023304.pdf" ]
    luot_2_ghi_chu: Tóm tắt Fischer 2011.
doi_chu:
  - cu: 'Mô tả (description): "phát hiện thiên lệch xuất bản qua funnel plot"; "một con số"'
    moi: '"nhận ra dấu hiệu thiên lệch xuất bản qua funnel plot"; "một ước lượng chung"'
    ly_do: Funnel plot chỉ cho dấu hiệu, không "phát hiện" chắc chắn (pt43).
  - cu: '"câu trả lời đáng tin nhất không đến từ một thí nghiệm đơn lẻ"; "họ gộp toàn bộ ... điều mà không thí nghiệm đơn lẻ nào làm được"; "Nghe có vẻ như phép màu thống kê — và đúng là nó gần như vậy ... kính lúp cực mạnh"'
    moi: '"một thí nghiệm đơn lẻ ... khó trả lời trọn vẹn. Gộp nhiều nghiên cứu lại là cách thường dùng để có một ước lượng chính xác hơn"; "gộp các nghiên cứu ... mà họ tìm được"; "105 hiệu ứng độc lập từ 53 bài báo"; lời cảnh báo của Cochrane'
    ly_do: Bỏ chữ hùng biện, theo Fischer và Cochrane (pt1, pt2, pt3, pt6).
  - cu: '"gộp kết quả, không phải gộp dữ liệu thô"; "phiếu bầu"; "12 nghiên cứu nói có ... Đếm số nghiên cứu thì rối"'
    moi: '"Cách phổ biến là gộp kết quả đã tóm tắt ... cũng có loại phân tích dùng dữ liệu thô"; "ước lượng"; lời của Cochrane về đếm phiếu'
    ly_do: pt9, pt10, pt11.
  - cu: '"trông đáng sợ nhưng đọc rất dễ"; "vùng mà hiệu ứng ''thật'' nhiều khả năng nằm trong đó"; "Hình thoi càng hẹp, đáp án càng chắc chắn"'
    moi: '"dải hiệu ứng tương thích với kết quả của nghiên cứu ấy"; "ước lượng càng chính xác"; mục "Đọc forest plot trong một phút" giữ nguyên tên và id'
    ly_do: pt14, pt16, pt20.
  - cu: Hình minh họa forest plot đầu tiên (Nghiêm và Lê cắt vạch 0, Trần nằm hẳn bên phải, GỘP nằm bên phải)
    moi: 'Hình vẽ lại: Trần cắt vạch 0, Nghiêm, Lê và GỘP nằm hẳn bên trái'
    ly_do: Hình cũ trái với lời kể (pt21).
  - cu: '"càng đông người chứng kiến"; "0,2 nhỏ, 0,5 trung bình (trong tâm lý học)"; "−0,35 nằm giữa: hiệu ứng có thật, rõ ràng, nhưng không phải lúc nào cũng xảy ra"; "người ở một mình có khả năng giúp đỡ cao hơn ở mức vừa phải ... tuyên bố tuyệt đối"'
    moi: '"người khác chứng kiến thì giúp ít hơn"; "quy ước của Cohen (1988)"; "nhỏ đến vừa" theo Fischer; "g không phải là xác suất"; mục g gồm ba gạch đầu dòng'
    ly_do: pt22 đến pt27.
  - cu: '"khi tình huống rõ ràng là khẩn cấp thật sự, người ta giúp đỡ nhiều hơn bất kể đông hay ít người chứng kiến"'
    moi: '"hiệu ứng yếu đi khi ...; trong một số tình huống nguy hiểm, có thêm người chứng kiến thậm chí đi kèm với giúp đỡ nhiều hơn"; thêm lời lưu ý so sánh giữa các nghiên cứu'
    ly_do: pt29, pt30, pt32.
  - cu: '"50 năm nghiên cứu, ở nhiều quốc gia ... từ nhặt bút rơi đến can thiệp vào vụ cướp"; "Đương nhiên"; "đó là tín hiệu: có yếu tố nào đó đang điều chỉnh"; "Các nhà phân tích tổng hợp lúc này đi tìm ''thủ phạm''"; "nó là manh mối"'
    moi: '"nhiều thập niên ... từ làm rơi bút đến một vụ trộm có kẻ gây hại có mặt"; "có thể do khác biệt về người tham gia, tình huống hay phương pháp"; "có thể là manh mối ... cần thận trọng"'
    ly_do: pt33, pt35, pt36, pt37.
  - cu: '"Nhớ ''ngăn kéo hồ sơ'' chứ ... thường không được đăng"; "thì rất có thể ... thổi phồng vì chỉ tính những nghiên cứu ''đẹp''"'
    moi: Câu theo Cochrane về nghiên cứu "có ý nghĩa thống kê" dễ được công bố hơn; "thì có thể ... ước lượng gộp có xu hướng phóng đại"; thêm câu phễu lệch có thể do lý do khác và câu về phễu của Fischer
    ly_do: pt38, pt42, pt43, pt44.
  - cu: 'Bảng "Cách nhận ra": "Càng nhiều càng tốt"; "Vài nghiên cứu nhỏ gộp lại vẫn là bằng chứng yếu"; "đáp án chung còn chưa chắc chắn"; "Các nghiên cứu có quá khác nhau không?"; "Ai làm, đăng ở đâu, có đăng ký trước không ... đào bới ... khóa trước"; "chỉ mất hai phút"; "Gộp 50 nghiên cứu dở ... rác vào, rác ra"'
    moi: Các hàng viết lại theo Cochrane; câu "Phân tích tổng hợp chỉ tốt bằng ... cách chọn chúng"
    ly_do: pt46 đến pt52.
  - cu: (không có)
    moi: 'Mục "Mức độ chắc chắn": khung Vững chắc "Phân tích tổng hợp gộp kết quả theo trọng số, và kết luận chỉ đáng tin bằng chất lượng các nghiên cứu được gộp" và khung Khá vững "Fischer và cộng sự (2011): hiệu ứng người ngoài cuộc có độ lớn gộp g = −0,35 và yếu đi khi nguy hiểm rõ ràng"'
    ly_do: Khuôn 7 mục của đợt 4 (pt53, pt54).
  - cu: 'Mục "Thử một lần" (cấp ##); hình bài tập vẽ B có khoảng tin cậy không cắt vạch 0, C "gần bằng 0" trong khi hình nằm bên phải vạch 0; đáp án: "Ba nghiên cứu lớn cho ba câu chuyện khác nhau ... tính không đồng nhất"; "cần thêm các nghiên cứu lớn, đăng ký trước"'
    moi: '"### Thử một lần { #thu-mot-lan }" dưới mục mới "## Bài tập", giữ id cũ; hình và đáp án viết lại cho khớp nhau; bỏ lời khuyên "cần thêm ... đăng ký trước"; thêm "### Kiểm tra nhanh" (3 câu)'
    ly_do: Khuôn 7 mục; hình cũ sai (pt56 đến pt63).
  - cu: Mục "Tự suy ngẫm"; câu 1 "Rác vào, rác ra"; câu 2 "các nghiên cứu 'xấu' đã bị giấu"
    moi: '"## Thử suy ngẫm { #tu-suy-ngam }"; câu 1 bỏ trích "Rác vào, rác ra"; câu 2 "các nghiên cứu nhỏ, không có kết quả nổi bật, chưa được công bố"'
    ly_do: Khuôn 7 mục; pt64.
  - cu: 'Nguồn: chỉ Fischer và cộng sự (2011)'
    moi: Thêm Cochrane Handbook (chương 10, 12, 13, 15) và Lakens (2013)
    ly_do: Nguồn của các nhận định mới.
