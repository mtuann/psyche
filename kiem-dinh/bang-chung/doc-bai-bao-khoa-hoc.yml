doi_chu:
- cu: 'description: "… thứ tự đọc khôn ngoan từ abstract đến phương pháp, và peer review bảo đảm được điều gì — và không bảo đảm được điều gì."'
  moi: 'description: "… gợi ý thứ tự đọc từ abstract đến phương pháp, và peer review bảo đảm được điều gì, không bảo đảm được điều gì."'
  ly_do: '"khôn ngoan" không có nguồn (d19).'
- cu: '"số bài báo khoa học bị rút lại trong năm 2023 đã vượt 10.000 — một kỷ lục chưa từng có. Phần lớn đến từ các tạp chí của nhà xuất bản Hindawi (hơn 8.000 bài), sau khi điều tra phát hiện quy trình phản biện đã bị thao túng một cách có hệ thống"'
  moi: '"số bài báo nghiên cứu bị rút lại trong năm 2023 đã vượt 10.000, phá các kỷ lục hằng năm. Phần lớn đến từ các tạp chí của Hindawi, công ty con của nhà xuất bản Wiley: hơn 8.000 bài bị rút, với lý do gồm "thao túng có hệ thống quy trình xuất bản và phản biện""; thêm đoạn về special issues và tỉ lệ 0,2%'
  ly_do: Sát bản in (d1–d4).
- cu: '"Điều đáng suy nghĩ nhất: tất cả những bài báo đó đều đã vượt qua phản biện trước khi được đăng."'
  moi: '"Điều đáng suy nghĩ: những bài báo ấy được đăng qua quy trình phản biện của tạp chí, và quy trình đó, theo lý do chính nhà xuất bản nêu, đã bị xâm phạm."'
  ly_do: Không kết luận cho cả 10.000 bài (d6).
- cu: '"Hầu hết bài báo khoa học thực nghiệm đều tuân theo một cấu trúc chung gọi là IMRaD — viết tắt của bốn phần chính"; cột "Nhiệm vụ" của bảng IMRaD; "Cấu trúc chung này tồn tại để người đọc biết tìm thông tin ở đâu ... không cần đọc từ đầu đến cuối như đọc tiểu thuyết."'
  moi: '"thường theo"; cột "Nhiệm vụ" theo ICMJE và Carey; "Cấu trúc này giúp ... các tác giả khảo sát lịch sử của nó nhận xét rằng ..."; thêm hai đoạn về Sollaci và ICMJE'
  ly_do: d8–d16.
- cu: '"Abstract thường chỉ dài một đoạn, nhưng một abstract tốt phải trả lời được bốn câu hỏi: hỏi gì, làm thế nào, thấy gì, nghĩa là gì ... thì đó là abstract quảng cáo chứ không phải abstract khoa học"'
  moi: '"Theo hướng dẫn của ICMJE, abstract nên nêu bối cảnh, mục đích, ..."; bỏ nhãn "abstract quảng cáo"'
  ly_do: d17, d18.
- cu: 'Mục "Thứ tự đọc khôn ngoan": "Các nhà khoa học có kinh nghiệm hiếm khi đọc bài báo từ đầu đến cuối. Một thứ tự phổ biến và hiệu quả: ..." năm bước kèm "phần quan trọng nhất để đánh giá độ tin cậy", "kể chuyện ... bảo vệ và quảng bá", "đừng để kết luận của tác giả đi trước bằng chứng"'
  moi: 'Mục "Thứ tự đọc: không có cách duy nhất" theo Carey: không có thứ tự đúng duy nhất; "Một thứ tự thường gặp"; bước 3 theo Carey Table 2; bước 5 mô tả Discussion và Introduction; "đừng để diễn giải của tác giả đi trước bằng chứng" kèm lý do (Rules 5–6)'
  ly_do: d19–d25.
- cu: '"Một kết luận chỉ đáng tin bằng chính phương pháp đã tạo ra nó. Ba câu hỏi cốt lõi khi đọc mục Methods: ..."; "Nếu mục Methods quá sơ sài ..., thì chính sự sơ sài đó đã là một dấu hiệu cảnh báo: một nghiên cứu tốt không có lý do gì giấu cách mình làm."'
  moi: '"Methods cho biết kết luận được tạo ra bằng cách nào. ..."; mỗi câu hỏi kèm yêu cầu của ICMJE; "... thì chính sự sơ sài đó khiến bài khó được đánh giá, và đáng được coi là một dấu hiệu cảnh báo."'
  ly_do: d26–d30.
- cu: 'Bảng "Cách nhận ra": hàng Hình/bảng ("Mỗi điểm hoặc cột đại diện cho bao nhiêu người? ... Khoảng thể hiện độ bất định có rộng không?"), Methods ("có phân nhóm ngẫu nhiên không?"), Results ("Có dấu hiệu chỉ chọn trình bày những kết quả đẹp?"), Discussion ("hay chỉ kể một câu chuyện duy nhất?")'
  moi: 'Bỏ các vế không có nguồn; Results: "mọi kết quả đã nêu ở Methods có được báo cáo không"'
  ly_do: d31–d36.
- cu: '"Peer review ... là quy trình mà trước khi đăng, bản thảo được gửi cho 2–3 chuyên gia độc lập ... (thường ẩn danh) ... Họ có thể yêu cầu sửa chữa, bổ sung phân tích, hoặc đề nghị từ chối đăng."'
  moi: '"Peer review ... là việc các chuyên gia thường không thuộc ban biên tập đánh giá một bản thảo gửi tới tạp chí. Theo ICMJE, ..."'
  ly_do: d38–d40.
- cu: '"Người phản biện làm việc không công, trong thời gian hạn chế, và thường không được xem dữ liệu gốc. Họ có thể bỏ sót lỗi — thậm chí bỏ sót gian lận tinh vi."; "Nhiều lỗi chỉ lộ ra khi có người khác làm lại nghiên cứu"; "hàng nghìn bài báo đã vượt qua một quy trình phản biện bị "thao túng có hệ thống", rồi sau đó đồng loạt bị rút lại"'
  moi: '"Phản biện hầu như luôn là công việc tình nguyện ... thử nghiệm với 607 người phản biện ..."; "Gian lận và các thực hành đáng ngờ vẫn lọt vào ..."; "Không thay được việc kiểm chứng độc lập"; "hơn 8.000 bài của các tạp chí Hindawi bị rút, với lý do gồm ..."'
  ly_do: d41–d46.
- cu: '"hãy xem "đã qua phản biện" như một bộ lọc sơ bộ — bài báo đã đủ nghiêm túc để được đem ra bàn — chứ không phải con dấu bảo đảm."'
  moi: '"hãy xem "đã qua phản biện" như một bước đánh giá có ích nhưng không hoàn hảo: ICMJE ghi rằng giá trị thực của phản biện vẫn còn được bàn cãi, và một tổng quan của Cochrane ..."'
  ly_do: d47.
- cu: 'Mục "Mức độ chắc chắn" và "Bài tập" (mới); "Tự suy ngẫm"; đáp án Thử một lần: "15 người mỗi nhóm"'
  moi: Thêm hai khung nhãn (Vững chắc), phần "Bài tập" gồm "Thử một lần" (id thu-mot-lan giữ) và "Kiểm tra nhanh" 3 câu; "Thử suy ngẫm" (id tu-suy-ngam); "Khoảng 15 người mỗi nhóm"
  ly_do: Chuẩn hóa khuôn 7 mục (d48–d55).
