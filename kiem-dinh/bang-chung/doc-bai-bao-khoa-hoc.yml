  ket_qua: dung
  nhan: vung-chac
  co_so:
  - 'ICMJE (2026): IMRAD "usually" chia bài nghiên cứu gốc; Methods đủ chi tiết để làm lại'
  - 'Sollaci & Pereira (2004): IMRaD là kiểu duy nhất ở bốn tạp chí nội khoa thập niên 1980'
  - 'Carey và cộng sự (2020): Table 2 mô tả bốn phần giống ICMJE'
  ly_do: 'Là quy ước trình bày được hướng dẫn xuất bản nêu rõ, không phải phát hiện thực nghiệm; ba nguồn nhất quán. Giới hạn: số liệu độ phổ biến chỉ có cho tạp chí nội khoa và đến thập niên 1980; ICMJE dành cho tạp chí y khoa, nên câu trên trang nói "bài báo nghiên cứu gốc" và dùng "thường".'
