nhan_dinh:
- id: d1
  cau: 'Tháng 12 năm 2023, tạp chí Nature đưa tin: số lượt rút bài báo nghiên cứu năm 2023 đã vượt 10.000, phá các kỷ lục hằng năm.'
  loai: lich-su
  nguon:
  - vannoorden2023
  trich: The number of retractions issued for research articles in 2023 has passed 10,000 — smashing annual records
  vi_tri: Đoạn mở đầu (tr. 479); đăng trực tuyến 12/12/2023 theo Crossref
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "số bài báo khoa học bị rút lại trong năm 2023 đã vượt 10.000 — một kỷ lục chưa từng có". Chữ mới: "số lượt rút bài báo nghiên cứu ... phá các kỷ lục hằng năm". Lý do: bám bản tin ("retractions issued for research articles", "smashing annual records"); "chưa từng có" mạnh hơn.'
- id: d2
  cau: 'Phần lớn các lượt rút bài năm 2023 đến từ các tạp chí của Hindawi, công ty con của nhà xuất bản Wiley ở Luân Đôn: hơn 8.000 bài bị rút, với lý do gồm "thao túng có hệ thống quy trình xuất bản và phản biện".'
  loai: so-lieu
  nguon:
  - vannoorden2023
  trich: The bulk of 2023’s retractions were from journals owned by Hindawi, a London-based subsidiary of the publisher Wiley | Hindawi journals have pulled more than 8,000 articles, citing factors such as “concerns that the peer review process has been compromised” and “systematic manipulation of the publication and peer-review process”
  vi_tri: Bản in, tr. 479
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Phần lớn đến từ các tạp chí của nhà xuất bản Hindawi (hơn 8.000 bài), sau khi điều tra phát hiện quy trình phản biện bị thao túng một cách có hệ thống". Chữ mới: Hindawi là công ty con của Wiley; "thao túng có hệ thống" là lý do nêu trong thông báo rút bài (cùng lý do "quy trình phản biện bị xâm phạm"), cuộc điều tra do biên tập viên nội bộ và các nhà nghiên cứu liêm chính đề xuất. Lý do: bài báo nói "citing factors", không nói chính Nature phát hiện.'
- id: d3
  cau: Đa số các bài Hindawi bị rút nằm trong các số đặc biệt (special issues), loại số thường do biên tập viên khách phụ trách và bị kẻ gian lợi dụng để đăng nhanh bài kém chất lượng hay bài giả.
  loai: phat-hien
  nguon:
  - vannoorden2023
  trich: 'Most of the Hindawi retractions are from special issues: collections of articles that are often overseen by guest editors and that have become notorious for being exploited by scammers to rapidly publish low-quality or sham papers.'
  vi_tri: Bản in, tr. 479
  ket_qua: dung
  ghi_chu: Mục mới.
- id: d4
  cau: Tỉ lệ bài bị rút trong tổng số bài đăng, theo phân tích của Nature, năm 2022 vượt 0,2%.
  loai: so-lieu
  nguon:
  - vannoorden2023
  trich: In 2022, it exceeded 0.2%.
  vi_tri: Bản in, tr. 480
  ket_qua: dung
  ghi_chu: Mục mới (cho đúng quy mô).
- id: d5
  cau: Bài của Nature đăng ở Nature 624, trang 479–481, tác giả Richard Van Noorden.
  loai: lich-su
  nguon:
  - vannoorden2023
  trich: By Richard Van Noorden | Nature | Vol 624 | 21/28 December 2023 | 479
  vi_tri: Bản in; Crossref 10.1038/d41586-023-03974-8
  ket_qua: dung
- id: d6
  cau: Những bài Hindawi bị rút được đăng qua quy trình phản biện của tạp chí, và quy trình đó, theo lý do nhà xuất bản nêu, đã bị xâm phạm; vì thế "đã đăng" hay "đã qua phản biện" không đồng nghĩa với "đúng".
  loai: phat-hien
  nguon:
  - vannoorden2023
  - carey2020
  trich: concerns that the peer review process has been compromised | Published papers are not truths etched in stone.
  vi_tri: Van Noorden, tr. 479; Carey, Rule 6
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Điều đáng suy nghĩ nhất: tất cả những bài báo đó đều đã vượt qua phản biện trước khi được đăng." Chữ mới: bài được đăng qua quy trình phản biện của tạp chí, quy trình ấy đã bị xâm phạm. Lý do: "tất cả những bài báo đó" (cả 10.000) mạnh hơn nguồn: bài báo nói về Hindawi và một phần là bài hội nghị IEEE (khoảng một phần tư số lượt rút). Suy luận "đã được đăng qua quy trình phản biện" là của site.'
- id: d7
  cau: Thay vì tin vào con dấu, người đọc cần biết tự mình đánh giá một bài báo, và bước đầu là hiểu nó được cấu tạo ra sao.
  loai: loi-khuyen
  nguon:
  - carey2020
  trich: Published papers in high impact journals are not truths etched in stone.
  vi_tri: Rule 6
  ket_qua: dung
- id: d8
  cau: Bài báo khoa học thực nghiệm thường chia thành bốn phần Introduction, Methods, Results, Discussion; cấu trúc này gọi là IMRAD (viết là IMRaD).
  loai: dinh-nghia
  nguon:
  - icmje2026
  - sollaci2004
  trich: The text of articles reporting original research is usually divided into Introduction, Methods, Results, and Discussion sections. This so-called “IMRAD” structure
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 15, mục IV.A.1
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Hầu hết bài báo khoa học thực nghiệm đều tuân theo một cấu trúc chung". Chữ mới: "thường chia". Lý do: ICMJE nói "usually" và còn có kiểu bài khác (tổng quan, báo cáo ca); số liệu độ phổ biến chỉ có cho tạp chí nội khoa (d15).'
- id: d9
  cau: Introduction nêu bối cảnh và tầm quan trọng của vấn đề, và mục tiêu hay giả thuyết cụ thể của nghiên cứu.
  loai: dinh-nghia
  nguon:
  - icmje2026
  - carey2020
  trich: Provide a context or background for the study (that is, the nature of the problem and its significance). State the specific purpose or research objective of, or hypothesis tested by, the study or observation.
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 17, mục IV.A.3.c
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đặt câu hỏi: đã biết gì, chưa biết gì, nghiên cứu này muốn trả lời điều gì". Chữ mới theo ICMJE. Lý do: "đã biết gì, chưa biết gì" không có trong hướng dẫn.'
- id: d10
  cau: 'Methods mô tả cách làm: ai tham gia, đo lường bằng gì, phân tích ra sao, đủ chi tiết để người khác có thể làm lại.'
  loai: dinh-nghia
  nguon:
  - icmje2026
  - carey2020
  trich: The Methods section should aim to be sufficiently detailed such that others with access to the data would be able to reproduce the results. | Ideally, one should be able to recreate a project by reading the methods.
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 17; Carey, Table 2
  ket_qua: dung
- id: d11
  cau: Results trình bày đã thấy gì, theo thứ tự hợp lý, kết quả chính trước; phần bàn luận về ý nghĩa nằm ở mục sau.
  loai: dinh-nghia
  nguon:
  - icmje2026
  - carey2020
  trich: Present your results in logical sequence in the text, tables, and figures, giving the main or most important findings first. | The results should be objective observations.
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 17, mục IV.A.3.e; Carey, Table 2
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Trình bày đã thấy gì: số liệu, hình, bảng — chưa bàn luận, chưa vội kết luận". Lý do: bám ICMJE ("logical sequence", "most important findings first") và Carey ("objective observations").'
- id: d12
  cau: Discussion tóm tắt kết quả chính, giải thích kết quả có nghĩa là gì, nêu giới hạn của nghiên cứu và đặt nó vào bối cảnh bằng chứng đã có.
  loai: dinh-nghia
  nguon:
  - icmje2026
  - carey2020
  trich: It is useful to begin the discussion by briefly summarizing the main findings, and explore possible mechanisms or explanations for these findings. ... put your findings in the context of the totality of the relevant evidence. State the limitations of your study
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 18, mục IV.A.3.f
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Giải thích kết quả có nghĩa là gì, thừa nhận giới hạn, đối chiếu với nghiên cứu khác". Lý do: sát ICMJE; không đổi nghĩa đáng kể.'
- id: d13
  cau: Bài thường có thêm Abstract (tóm tắt) ở đầu và References (tài liệu tham khảo) ở cuối.
  loai: dinh-nghia
  nguon:
  - icmje2026
  trich: b. Abstract ... g. References
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 16 và 18, mục IV.A.3.b và g
  ket_qua: dung
- id: d14
  cau: 'Cấu trúc IMRaD tạo điều kiện cho việc đọc theo từng mô-đun: người đọc lướt từng phần để tìm thông tin cụ thể; muốn biết mẫu bao nhiêu người thì mở Methods, muốn xem số liệu thì mở Results.'
  loai: phat-hien
  nguon:
  - sollaci2004
  - icmje2026
  trich: facilitates modular reading | browse in each section of the article, looking for specific information
  vi_tri: Sollaci & Pereira, mục Discussion
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Cấu trúc chung này tồn tại để người đọc biết tìm thông tin ở đâu: ... không cần đọc từ đầu đến cuối như đọc tiểu thuyết." Chữ mới ghi là nhận xét của Sollaci và Pereira. Lý do: "tồn tại để" nói về lý do ra đời; chính Sollaci và Pereira viết rằng họ "did not find definite reasons" cho việc IMRAD chiếm ưu thế, chỉ nói nó thuận tiện đọc theo mô-đun.'
- id: d15
  cau: 'Khảo sát bốn tạp chí nội khoa hàng đầu (BMJ, JAMA, The Lancet, NEJM) từ 1935 đến 1985: IMRaD bắt đầu được dùng từ thập niên 1940, đạt 80% bài nghiên cứu gốc vào thập niên 1970 và là kiểu duy nhất trong thập niên 1980.'
  loai: so-lieu
  nguon:
  - sollaci2004
  trich: The IMRAD structure, in those journals, began to be used in the 1940s. In the 1970s, it reached 80% and, in the 1980s, was the only pattern adopted in original papers.
  vi_tri: Tóm tắt (Europe PMC)
  ket_qua: dung
  ghi_chu: Mục mới. Chỉ là nội khoa; phạm vi này ghi rõ trên trang.
- id: d16
  cau: Hướng dẫn của ICMJE gọi IMRaD không phải một khuôn xuất bản tùy tiện mà phản ánh quá trình khám phá khoa học.
  loai: phat-hien
  nguon:
  - icmje2026
  trich: This so-called “IMRAD” structure is not an arbitrary publication format but a reflection of the process of scientific discovery.
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 15
  ket_qua: dung
  ghi_chu: Mục mới.
- id: d17
  cau: Theo hướng dẫn của ICMJE, abstract nên nêu bối cảnh, mục đích, các bước tiến hành cơ bản (chọn người tham gia, bối cảnh, đo lường, phương pháp phân tích), kết quả chính (nêu độ lớn hiệu ứng cụ thể nếu có thể), kết luận chính, ghi các giới hạn quan trọng và không diễn giải vượt quá kết quả.
  loai: phat-hien
  nguon:
  - icmje2026
  trich: The abstract should provide the context or background for the study and should state the study’s purpose, basic procedures (selection of study participants, settings, measurements, analytical methods), main findings (giving specific effect sizes and their statistical and clinical significance, if possible), and principal conclusions. It should ... note important limitations, and not overinterpret findings.
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 16, mục IV.A.3.b
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "một abstract tốt phải trả lời được bốn câu hỏi: hỏi gì, làm thế nào, thấy gì, nghĩa là gì." Chữ mới theo ICMJE. Lý do: "bốn câu hỏi" là cách nói của site, không có nguồn.'
- id: d18
  cau: Nếu abstract chỉ toàn lời khẳng định mà không cho biết người ta đã làm gì với bao nhiêu người, bạn càng cần đọc kỹ phần Methods trước khi tin.
  loai: loi-khuyen
  nguon:
  - icmje2026
  trich: basic procedures (selection of study participants, settings, measurements, analytical methods), main findings (giving specific effect sizes
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 16
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "thì đó là abstract quảng cáo chứ không phải abstract khoa học". Lý do: nhãn "abstract quảng cáo" không có nguồn; ý khuyên đọc Methods giữ lại, suy từ yêu cầu của ICMJE về nội dung abstract.'
- id: d19
  cau: 'Không có một thứ tự đọc bài báo đúng duy nhất: có người xem kỹ hình và bảng (kể cả chú thích) trước phần chữ chính, có người đọc Results song song với hình và bảng; "không có cách nào đúng hay sai: hãy thử cả hai xem cách nào hợp với bạn".'
  loai: phat-hien
  nguon:
  - carey2020
  trich: 'Some people like to scrutinize the figures and tables (including legends) before reading any of the “main text” | There is no correct or incorrect approach: Try both to see what works best for you.'
  vi_tri: Rule 4
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: tiêu đề "Thứ tự đọc khôn ngoan" và "Các nhà khoa học có kinh nghiệm hiếm khi đọc bài báo từ đầu đến cuối. Một thứ tự phổ biến và hiệu quả:". Chữ mới: không có thứ tự đúng duy nhất. Lý do: "hiếm khi", "phổ biến và hiệu quả" không có nguồn; Carey nói không có cách đúng sai.'
- id: d20
  cau: 'Đọc Abstract trước tiên để có bản đồ toàn bài: câu hỏi là gì, làm bằng cách nào, thấy gì.'
  loai: loi-khuyen
  nguon:
  - carey2020
  trich: A brief overview of the research question, approach, results, and interpretation.
  vi_tri: Table 2, hàng Abstract
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: thêm "Nếu abstract đã không liên quan đến điều bạn quan tâm, dừng lại ở đây cho đỡ tốn thời gian." Bỏ câu thêm (suy luận từ Rule 1 "Pick your reading goal": mục đích đọc quyết định cách đọc, nhưng không có câu nói đúng điều này). Thứ tự này ghi là "thứ tự thường gặp", không phải quy tắc.'
- id: d21
  cau: Với mỗi hình, hiểu trục x và y, cách dùng màu và cách phân tích thống kê, và vì sao tác giả chọn cách vẽ đó.
  loai: loi-khuyen
  nguon:
  - carey2020
  trich: For each figure, work to understand each x- and y-axes, color scheme, statistical approach (if one was used), and why the particular plotting approach was used.
  vi_tri: Rule 4
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "xem dữ liệu "nói" gì trước khi đọc lời của tác giả. Chú ý trục đồ thị, cỡ mẫu, và độ lớn của hiệu ứng — đừng chỉ nhìn xem cột nào cao hơn." Chữ mới: theo Rule 4. Lý do: "cỡ mẫu" và "độ lớn hiệu ứng" không có trong Rule 4 (Carey không nhắc); riêng độ lớn hiệu ứng có ở d17, d30.'
- id: d22
  cau: Methods cho biết nghiên cứu làm gì và làm thế nào; lý tưởng nhất, đọc Methods là đủ để làm lại dự án, và nên quay lại Methods nhiều lần để hiểu rõ dữ liệu có được thế nào.
  loai: loi-khuyen
  nguon:
  - carey2020
  - icmje2026
  trich: Ideally, one should be able to recreate a project by reading the methods. | Do not be afraid to refer back to the methods section frequently to ensure a full understanding
  vi_tri: Table 2; Rule 4
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "phần quan trọng nhất để đánh giá độ tin cậy. Ai tham gia? Bao nhiêu người? Đo lường bằng công cụ gì? Phân tích bằng cách nào? Có nhóm đối chứng không?" Chữ mới theo Carey, câu hỏi chi tiết chuyển xuống d28–d30. Lý do: "quan trọng nhất" không có nguồn.'
- id: d23
  cau: Đọc phần chữ của Results và đối chiếu với hình và bảng.
  loai: loi-khuyen
  nguon:
  - carey2020
  trich: Others prefer to read through the results section while sequentially examining the figures and tables
  vi_tri: Rule 4
  ket_qua: dung
- id: d24
  cau: Discussion là nơi tác giả diễn giải kết quả và đặt nó vào bối cảnh các phát hiện đã có; Introduction nêu câu hỏi nghiên cứu và vì sao nó quan trọng.
  loai: dinh-nghia
  nguon:
  - carey2020
  trich: What do the results mean and how do they relate to previous findings in the literature? | Several paragraphs (or less) to present the research question and why it is important.
  vi_tri: Table 2
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đây là phần "kể chuyện": tác giả diễn giải, bảo vệ và quảng bá phát hiện của mình. Đọc sau khi bạn đã có nhận định độc lập từ dữ liệu, bạn sẽ khó bị dẫn dắt hơn." Chữ mới: mô tả theo Carey. Lý do: "kể chuyện", "bảo vệ và quảng bá" không có nguồn.'
- id: d25
  cau: 'Nguyên tắc nên giữ: đừng để diễn giải của tác giả đi trước bằng chứng; ngay cả các phần được coi là khách quan cũng do tác giả viết nên chịu ảnh hưởng từ cách diễn giải của họ, và người đọc nên phản biện lại diễn giải ấy để thử độ vững của kết luận.'
  loai: loi-khuyen
  nguon:
  - carey2020
  trich: even “objective” sections are written by and, therefore, influenced by the authors interpretations. | it is essential that the reader pushes back against the author’s interpretation to test the strength of their conclusions.
  vi_tri: Rules 5 và 6
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đừng để kết luận của tác giả đi trước bằng chứng". Chữ mới theo Rules 5–6. Lý do: nêu đúng điều Carey nói, thêm lý do.'
- id: d26
  cau: Methods cho biết kết luận được tạo ra bằng cách nào.
  loai: dinh-nghia
  nguon:
  - icmje2026
  trich: The guiding principle of the Methods section should be clarity about how and why a study was done in a particular way.
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 17
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Một kết luận chỉ đáng tin bằng chính phương pháp đã tạo ra nó." Lý do: câu cũ mạnh và không có nguồn.'
- id: d27
  cau: Một nghiên cứu nên mô tả tiêu chí tuyển chọn người tham gia (kể cả nhóm đối chứng), nguồn dân số và mức đại diện của mẫu so với nhóm người mà nghiên cứu muốn nói tới; vì vậy khi đọc Methods hãy hỏi ai tham gia, bao nhiêu người, được tuyển chọn thế nào và có đại diện không.
  loai: loi-khuyen
  nguon:
  - icmje2026
  trich: Clearly describe the selection of observational or experimental participants (healthy individuals or patients, including controls), including eligibility and exclusion criteria and a description of the source population. ... Comment on how representative the study sample is of the larger population of interest.
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 17, mục IV.A.3.d.i
  ket_qua: da-lam-mem
  ghi_chu: Chữ cũ không nêu căn cứ; thêm trích hướng dẫn của ICMJE.
- id: d28
  cau: Methods cần nêu phương pháp, thiết bị và quy trình đo đủ chi tiết để người khác làm lại kết quả; vì vậy hãy hỏi người ta đo cái gì, bằng công cụ nào.
  loai: loi-khuyen
  nguon:
  - icmje2026
  trich: Identify methods, equipment ... and procedures in sufficient detail to allow others to reproduce the results.
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 17, mục IV.A.3.d.ii
  ket_qua: da-lam-mem
  ghi_chu: 'Câu hỏi "công cụ đó có đo đúng thứ cần đo không, có ổn định khi đo lại không" là câu hỏi của site (khái niệm độ giá trị và độ tin cậy: trang do-luong, D4-L2 phần 1); trang không khẳng định đó là yêu cầu của ICMJE.'
- id: d29
  cau: ICMJE khuyên tránh chỉ dựa vào kiểm định giả thuyết như giá trị p vì nó không truyền đạt đủ thông tin về độ lớn hiệu ứng và độ chính xác của ước lượng; vì vậy hãy hỏi hiệu ứng lớn cỡ nào chứ không chỉ "có ý nghĩa thống kê hay không".
  loai: loi-khuyen
  nguon:
  - icmje2026
  trich: Avoid relying solely on statistical hypothesis testing, such as P values, which fail to convey important information about effect size and precision of estimates.
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 17, mục IV.A.3.d.iii
  ket_qua: da-lam-mem
  ghi_chu: Chữ cũ không có nguồn; ý trùng nguyên tắc 5 của ASA (trang p-value).
- id: d30
  cau: Theo ICMJE, Methods nên đủ chi tiết để người khác có dữ liệu có thể làm lại kết quả; nếu Methods quá sơ sài để trả lời những câu hỏi ở trên thì bài khó được đánh giá và đáng được coi là dấu hiệu cảnh báo.
  loai: loi-khuyen
  nguon:
  - icmje2026
  trich: The Methods section should aim to be sufficiently detailed such that others with access to the data would be able to reproduce the results.
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 17
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "một nghiên cứu tốt không có lý do gì giấu cách mình làm". Chữ mới: suy luận có điều kiện từ yêu cầu của ICMJE. Lý do: bỏ khẳng định về động cơ.'
- id: d31
  cau: 'Khi hỏi về Abstract: câu hỏi nghiên cứu là gì, kết luận chính là gì, có nêu cách làm và độ lớn hiệu ứng không.'
  loai: loi-khuyen
  nguon:
  - icmje2026
  trich: basic procedures ... main findings (giving specific effect sizes and their statistical and clinical significance, if possible), and principal conclusions
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 16
  ket_qua: da-lam-mem
  ghi_chu: Thêm "có nêu cách làm và độ lớn hiệu ứng không" theo d17.
- id: d32
  cau: 'Khi xem hình hoặc bảng: hỏi trục là gì, cách phân tích thống kê là gì, hiệu ứng lớn hay chỉ "có ý nghĩa thống kê".'
  loai: loi-khuyen
  nguon:
  - carey2020
  - icmje2026
  trich: work to understand each x- and y-axes, color scheme, statistical approach | giving specific effect sizes and their statistical and clinical significance
  vi_tri: Carey Rule 4; ICMJE tr. 16
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Mỗi điểm hoặc cột đại diện cho bao nhiêu người? ... Khoảng thể hiện độ bất định có rộng không?" Chữ mới: bỏ câu hỏi về số người và khoảng bất định (không có trong nguồn đã đọc cho phần hình). Lý do: bỏ chỗ không có nguồn.'
- id: d33
  cau: 'Khi đọc Methods: hỏi ai tham gia, tuyển chọn thế nào, đo bằng gì, có nhóm đối chứng không.'
  loai: loi-khuyen
  nguon:
  - icmje2026
  trich: including eligibility and exclusion criteria and a description of the source population | Identify methods, equipment ... and procedures
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 17
  ket_qua: da-sua
  ghi_chu: Chữ cũ thêm "có phân nhóm ngẫu nhiên không". Chữ mới bỏ cụm này khỏi phần nguồn của ICMJE (ICMJE nhắc nhóm đối chứng ở "participants ... including controls", không nhắc ngẫu nhiên ở mục Methods); ngẫu nhiên đã có ở trang thi-nghiem-doi-chung.
- id: d34
  cau: 'Khi đọc Results: hỏi lời mô tả có khớp hình không, và mọi kết quả đã nêu ở Methods có được báo cáo không.'
  loai: loi-khuyen
  nguon:
  - icmje2026
  trich: Provide data on all primary and secondary outcomes identified in the Methods section.
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 17, mục IV.A.3.e
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Có dấu hiệu chỉ chọn trình bày những kết quả đẹp?" Chữ mới theo ICMJE. Lý do: "kết quả đẹp" là cách nói của site; ICMJE yêu cầu báo cáo mọi kết quả chính và phụ đã nêu ở Methods.'
- id: d35
  cau: 'Khi đọc Discussion: hỏi tác giả có nêu giới hạn của nghiên cứu không, có xét cách giải thích khác cho kết quả không.'
  loai: loi-khuyen
  nguon:
  - icmje2026
  - carey2020
  trich: State the limitations of your study | Are there other, equally likely, explanations for what is observed?
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 18; Carey, Rule 6
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "hay chỉ kể một câu chuyện duy nhất?" bỏ vế sau; suy luận.'
- id: d36
  cau: 'Khi đọc References: hỏi các trích dẫn dẫn về nghiên cứu gốc hay chỉ là bài viết lại.'
  loai: loi-khuyen
  nguon:
  - icmje2026
  trich: Authors should provide direct references to original research sources whenever possible. | review articles do not always reflect original work accurately.
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 18, mục IV.A.3.g.i
  ket_qua: dung
- id: d37
  cau: Các trang liên kết trong bài (Mẫu và chọn mẫu, Bao nhiêu người là đủ?, Hiệu ứng lớn hay nhỏ?, p-value, Vì sao cần nhóm đối chứng?, Tương quan và nhân quả, Khủng hoảng tái lập) có trong trang.yml.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm: src/data/trang.yml có bang-chung/mau-va-chon-mau, co-mau-suc-manh, do-lon-hieu-ung, p-value, thi-nghiem-doi-chung, tuong-quan-nhan-qua, khung-hoang-tai-lap; liên kết đúng dạng /psyche/<trang>/.'
- id: d38
  cau: Peer review (phản biện đồng nghiệp) là việc các chuyên gia thường không thuộc ban biên tập đánh giá một bản thảo gửi tới tạp chí.
  loai: dinh-nghia
  nguon:
  - icmje2026
  trich: Peer review is the critical assessment of manuscripts submitted to journals by experts who are usually not part of the editorial staff.
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 5, mục II.C.2.c
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "quy trình mà trước khi đăng, bản thảo được gửi cho 2–3 chuyên gia độc lập trong cùng lĩnh vực (thường ẩn danh) để đánh giá: câu hỏi có đáng giá không, phương pháp có ổn không, kết luận có vượt quá dữ liệu không. Họ có thể yêu cầu sửa chữa, bổ sung phân tích, hoặc đề nghị từ chối đăng." Chữ mới theo ICMJE. Lý do: "2–3", "ẩn danh", danh sách điều được đánh giá không có nguồn; ICMJE nói số người phản biện và mở hay ẩn danh khác nhau giữa các tạp chí.'
- id: d39
  cau: Theo ICMJE, phản biện giúp bản thảo được xem xét công bằng trong cộng đồng khoa học, giúp biên tập viên quyết định bài nào hợp với tạp chí, và thường giúp tác giả và biên tập viên cải thiện chất lượng báo cáo.
  loai: phat-hien
  nguon:
  - icmje2026
  trich: the process facilitates a fair hearing for a manuscript among members of the scientific community. More practically, it helps editors decide which manuscripts are suitable for their journals. Peer review often helps authors and editors improve the quality of reporting.
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 5
  ket_qua: dung
  ghi_chu: Mục mới.
- id: d40
  cau: Số lượng và loại người phản biện, và việc phản biện mở hay ẩn danh, khác nhau giữa các tạp chí; tạp chí không bắt buộc làm theo khuyến nghị của người phản biện, dù thuận hay chê.
  loai: phat-hien
  nguon:
  - icmje2026
  trich: Journals may differ in the number and kinds of manuscripts they send for review, the number and types of reviewers they seek for each manuscript, whether the review process is open or anonymized | under no obligation to follow reviewer recommendations, favorable or negative
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 5–6
  ket_qua: dung
  ghi_chu: Mục mới.
- id: d41
  cau: Phản biện hầu như luôn là công việc tình nguyện của các nhà nghiên cứu.
  loai: phat-hien
  nguon:
  - tennant2020
  trich: which is almost invariably performed as a voluntary service by researchers
  vi_tri: Tennant & Ross-Hellauer, mục Discussion (chi phí)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Người phản biện làm việc không công, trong thời gian hạn chế, và thường không được xem dữ liệu gốc." Chữ mới: chỉ giữ "tình nguyện". Lý do: "thời gian hạn chế" không có nguồn; "thường không được xem dữ liệu gốc" trái ICMJE, nói biên tập viên có trách nhiệm bảo đảm người phản biện tiếp cận mọi tài liệu liên quan.'
- id: d42
  cau: Trong một thử nghiệm với 607 người phản biện của tạp chí BMJ, mỗi bản thảo thử được cài chín lỗi phương pháp lớn; ở bản đầu tiên, người phản biện phát hiện trung bình 2,58 trong chín lỗi.
  loai: so-lieu
  nguon:
  - schroter2008
  trich: 607 peer reviewers at the BMJ were randomized to two intervention groups | each of which had nine major and five minor methodological errors inserted | At baseline (Paper 1) reviewers found an average of 2.58 of the nine major errors
  vi_tri: Tóm tắt (Design, Results)
  ket_qua: dung
  ghi_chu: 'Mục mới. Kết luận của bài: biên tập viên không nên cho rằng người phản biện sẽ phát hiện phần lớn lỗi lớn.'
- id: d43
  cau: 'Schroter và cộng sự kết luận: biên tập viên không nên cho rằng người phản biện sẽ phát hiện phần lớn lỗi lớn.'
  loai: phat-hien
  nguon:
  - schroter2008
  trich: Editors should not assume that reviewers will detect most major errors
  vi_tri: Tóm tắt (Conclusions)
  ket_qua: dung
  ghi_chu: Mục mới.
- id: d44
  cau: Gian lận và các thực hành nghiên cứu đáng ngờ vẫn lọt vào kho văn bản khoa học dù có phản biện.
  loai: phat-hien
  nguon:
  - tennant2020
  trich: fraudulent behaviour, or questionable research practices, still enter the scholarly record at high proportions, even though peer review occurs
  vi_tri: Tennant & Ross-Hellauer, mục Peer review and reproducibility
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Người phản biện ... có thể bỏ sót lỗi — thậm chí bỏ sót gian lận tinh vi." Chữ mới theo Tennant. Lý do: "gian lận tinh vi" không có nguồn.'
- id: d45
  cau: Phản biện không thay được việc kiểm chứng độc lập bằng cách làm lại nghiên cứu.
  loai: phat-hien
  nguon:
  - tennant2020
  trich: fraudulent behaviour, or questionable research practices, still enter the scholarly record at high proportions, even though peer review occurs
  vi_tri: Tennant & Ross-Hellauer
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Nhiều lỗi chỉ lộ ra khi có người khác làm lại nghiên cứu một cách độc lập." Chữ mới: suy luận nhẹ hơn. Chỗ cho lượt 2: câu mang tính suy luận từ d44; liên kết khủng hoảng tái lập ở trang đã khóa.'
- id: d46
  cau: Hơn 8.000 bài của các tạp chí Hindawi bị rút, với lý do gồm "quy trình phản biện đã bị xâm phạm" và "thao túng có hệ thống quy trình xuất bản và phản biện".
  loai: phat-hien
  nguon:
  - vannoorden2023
  trich: citing factors such as “concerns that the peer review process has been compromised” and “systematic manipulation of the publication and peer-review process”
  vi_tri: Bản in, tr. 479
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "hàng nghìn bài báo đã vượt qua một quy trình phản biện bị "thao túng có hệ thống", rồi sau đó đồng loạt bị rút lại." Lý do: "hàng nghìn" nhẹ hơn thực tế (hơn 8.000), "đồng loạt" và "sau đó" không có nguồn.'
- id: d47
  cau: 'Nên xem "đã qua phản biện" như một bước đánh giá có ích nhưng không hoàn hảo: ICMJE ghi rằng giá trị thực của phản biện vẫn còn được bàn cãi, và một tổng quan của Cochrane kết luận hiện còn ít bằng chứng thực nghiệm ủng hộ việc dùng phản biện biên tập.'
  loai: loi-khuyen
  nguon:
  - icmje2026
  - jefferson2007
  trich: The actual value of peer review is widely debated | At present, little empirical evidence is available to support the use of editorial peer review
  vi_tri: ICMJE (PDF tháng 1/2026), tr. 5; Jefferson, Tóm tắt
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "hãy xem "đã qua phản biện" như một bộ lọc sơ bộ — bài báo đã đủ nghiêm túc để được đem ra bàn — chứ không phải con dấu bảo đảm." Chữ mới theo ICMJE và Jefferson. Lý do: "bộ lọc sơ bộ" và "đủ nghiêm túc" không có nguồn. Jefferson: chưa đọc phần thân, chỉ tóm tắt; câu trích đầy đủ nói "as a mechanism to ensure quality of biomedical research".'
- id: d48
  cau: Phản biện đồng nghiệp không phát hiện được mọi lỗi và không bảo đảm một bài báo đúng.
  loai: nhan
  nguon:
  - schroter2008
  - jefferson2007
  - tennant2020
  - icmje2026
  trich: Editors should not assume that reviewers will detect most major errors | At present, little empirical evidence is available to support the use of editorial peer review | still enter the scholarly record ... even though peer review occurs
  vi_tri: Schroter, Tóm tắt; Jefferson, Tóm tắt; Tennant, mục Peer review and reproducibility
  ket_qua: dung
  nhan: vung-chac
  co_so:
  - 'Schroter và cộng sự (2008): 607 người phản biện BMJ, trung bình 2,58/9 lỗi lớn được phát hiện'
  - 'Jefferson và cộng sự (2007), tổng quan Cochrane: ít bằng chứng thực nghiệm ủng hộ phản biện biên tập'
  - 'Tennant & Ross-Hellauer (2020): gian lận và thực hành đáng ngờ vẫn lọt vào dù có phản biện'
  - 'ICMJE (2026): giá trị thực của phản biện còn được bàn cãi; tạp chí không bắt buộc theo khuyến nghị'
  ly_do: 'Là nhận định phủ định ("không bảo đảm"), về một quy trình do con người thực hiện, không phải phát hiện thực nghiệm về hiệu ứng: bốn nguồn độc lập cùng chiều (thử nghiệm ngẫu nhiên, tổng quan hệ thống của Cochrane, tổng quan phân tích, hướng dẫn của ICMJE), không nguồn nào phản bác; thước đo mục 4 viết cho phát hiện thực nghiệm, nên xét theo mức đồng thuận như nhãn của p-value đã khóa. Jefferson chỉ đọc tóm tắt; chỗ cho review.'
