  cau: Tình huống giả định ở "Thử một lần" (30 sinh viên, nghe nhạc cổ điển, tăng IQ 9 điểm) không trùng với một nghiên cứu thật được nêu trong trang.
  loai: ve-site
  ket_qua: dung
  ghi_chu: gia-dinh. Tình huống ghi rõ là giả định; không có nhận định nào khác của trang dựa vào nó. Đã kiểm trên trang.
