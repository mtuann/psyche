  - id: d23
    cau: 'Nhãn Vững chắc: thí nghiệm ngẫu nhiên có đối chứng là cách mạnh nhất để kiểm tra một can thiệp.'
    loai: nhan
    nhan: vung-chac
    nguon:
      - openstax22
      - openstax23
      - hrobjartsson2010
    co_so:
      - openstax22
      - openstax23
      - hrobjartsson2010
    ly_do: 'Nguyên tắc phương pháp nền tảng, không phải phát hiện thực nghiệm cần tái lập: giáo trình mở nêu thí nghiệm có đối chứng và phân nhóm ngẫu nhiên là cách duy nhất để kết luận nhân quả; tổng quan Cochrane (2010) chọn thử nghiệm ngẫu nhiên có nhóm không điều trị vì phần lớn báo cáo giả dược thiếu thiết kế này. Giới hạn nêu trên trang (đạo đức, mẫu nhỏ, một lần) có nguồn (OpenStax 2.2; OSC 2015). Lượt 2 và review xem lại cách áp thước đo mục 4. Review (Claude Sonnet 5.5, 30/10/2026): xét theo đồng thuận giáo trình và tổng quan phương pháp (mục 4 áp dụng cho nguyên tắc phương pháp), không theo điều kiện tái lập.'
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://nobaproject.com/modules/research-designs", "https://openstax.org/books/psychology-2e/pages/2-2-approaches-to-research" ]
    luot_2_ghi_chu: "Nhãn Vững chắc cho nguyên lý phương pháp: đồng thuận giáo trình, không có phản biện đáng kể. Đạt."
    ghi_chu: 'Review (Claude Sonnet 5.5, 30/10/2026): dung. Nhãn "Vững chắc" cho nguyên tắc phương pháp: xét theo đồng thuận giáo trình (OpenStax 2.2, 2.3) và việc Cochrane 2010 chọn đúng thiết kế ấy; không phải phát hiện cần tái lập. Trang nêu rõ giới hạn (đạo đức, mẫu nhỏ). Đạt.'
    review: dung
