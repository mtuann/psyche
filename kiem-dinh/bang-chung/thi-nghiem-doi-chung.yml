  - id: d25
    cau: 'Nhãn Khá vững: so với không điều trị, giả dược nhìn chung không có tác dụng lâm sàng quan trọng, nhưng có thể ảnh hưởng đến một số kết quả tự báo cáo như đau và buồn nôn.'
    loai: nhan
    nhan: kha-vung
    nguon:
      - hrobjartsson2010
    co_so:
      - hrobjartsson2010
    ly_do: 'Một tổng quan Cochrane (2010, 202 thử nghiệm có dữ liệu, 60 tình trạng) cùng chiều với phiên bản 2001 và 2004; nhưng chỉ 16 thử nghiệm (8%) có nguy cơ sai lệch thấp, kết quả giữa các thử nghiệm không đồng nhất (ảnh hưởng lên đau từ không đáng kể đến quan trọng) và các tác giả nói khó tách khỏi báo cáo thiên lệch. Đúng điều kiện "Khá vững" (cùng chiều nhưng còn giới hạn) chứ chưa "Vững chắc". Chưa tìm tổng quan hay tái lập mới hơn: chỗ này lượt 2 và review cần xem lại ("Tính đến 10/2026"). Review (Claude Sonnet 5.5, 30/10/2026): Tính đến 10/2026 không thấy tổng quan thay thế (Europe PMC); giữ Khá vững.'
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/20091554/" ]
    luot_2_ghi_chu: "Nhãn Khá vững phù hợp: một tổng quan Cochrane nhưng chỉ 8% thử nghiệm sai lệch thấp, kết quả pain không đồng nhất. Đạt."
    ghi_chu: 'Review (Claude Sonnet 5.5, 30/10/2026): dung. Nhãn "Khá vững" đạt mục 4: một tổng quan Cochrane (202 thử nghiệm) cùng chiều với các bản trước, nhưng chỉ 8% thử nghiệm có nguy cơ sai lệch thấp, kết quả giữa các thử nghiệm không đồng nhất, các tác giả nói khó tách khỏi báo cáo thiên lệch: đúng "nhiều nghiên cứu cùng chiều nhưng còn giới hạn". Chưa lên "Vững chắc" vì các giới hạn ấy; chưa xuống "Đang tranh cãi" vì chưa thấy bằng chứng chất lượng cao mâu thuẫn. Tìm Europe PMC 30/10/2026 (tiêu đề có placebo, no treatment, meta-analysis hay systematic review, 2011-2026): không thấy tổng quan thay thế; Benedetti 2025 (đã trong hồ sơ) cùng nói phản ứng giả dược gồm hồi phục tự nhiên, hồi quy và thiên lệch. Câu trên trang đã nói "nhìn chung" và "có thể".'
    review: dung
