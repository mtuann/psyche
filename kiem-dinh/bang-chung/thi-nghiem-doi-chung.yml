  - id: q3
    cau: Mù đôi ngăn kỳ vọng của cả hai phía (người tham gia và người đo) ảnh hưởng đến kết quả.
    loai: dinh-nghia
    nguon:
      - openstax23
    trich: In a double-blind study, both the researchers and the participants are blind to group assignments.
    vi_tri: Mục 2.3
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings", "https://nobaproject.com/modules/research-designs" ]
    luot_2_ghi_chu: Khớp.
  - id: q4
    cau: Theo tổng quan Cochrane 2010, so với không điều trị, giả dược nhìn chung không có tác dụng lâm sàng quan trọng, nhưng trong một số bối cảnh có thể ảnh hưởng đến kết quả tự báo cáo như cảm giác đau; hai câu tuyệt đối ("mạnh như thuốc thật", "hoàn toàn không có tác dụng") đều quá mức; các tác giả còn thận trọng về báo cáo thiên lệch.
    loai: phat-hien
    nguon:
      - hrobjartsson2010
    trich: We did not find that placebo interventions have important clinical effects in general. However, in certain settings placebo interventions can influence patient-reported outcomes, especially pain and nausea
    vi_tri: Tóm tắt (Authors' conclusions)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (đáp án đúng): "…nhưng có thể có tác dụng nhỏ lên những kết quả tự báo cáo như cảm giác đau." Bỏ "nhỏ" như d18; giải thích "Bằng chứng cho một bức tranh ở giữa" giữ nguyên. Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; đáp án nói "trong một số bối cảnh có thể ảnh hưởng", giải thích không dựa vào vị trí. dung.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/20091554/" ]
    luot_2_ghi_chu: Khớp; 'mạnh như thuốc thật' và 'hoàn toàn không có tác dụng' đều không đúng với kết quả.
    review: dung
doi_chu:
  - cu: Hồi quy về trung bình. Người ta thường tìm đến một giải pháp đúng lúc đang căng thẳng nhất. Từ đỉnh điểm, lần đo sau gần như chắc chắn sẽ thấp hơn
    moi: Hồi quy về trung bình (Barnett và cộng sự, 2005). Nếu người ta tham gia đúng lúc điểm đang cao bất thường, lần đo sau thường thấp hơn
    ly_do: d2.
  - cu: Phân nhóm ngẫu nhiên làm cho hai nhóm giống nhau về mọi mặt tính trung bình
    moi: Phân nhóm ngẫu nhiên giúp, khi đủ đông người, hai nhóm ít khác nhau một cách có hệ thống về mọi mặt
    ly_do: d6.
  - cu: nhiều cha mẹ tin rằng ăn đường làm trẻ tăng động … không thấy đường ảnh hưởng đến hành vi hay nhận thức của trẻ … khiến họ "thấy" trẻ hiếu động
    moi: nhiều cha mẹ tin rằng đường ảnh hưởng đến hành vi của trẻ … dù chưa loại trừ được một tác dụng nhỏ hay tác dụng ở một nhóm trẻ nhất định … "thấy" trẻ thay đổi
    ly_do: d12–d14.
  - cu: trong hơn 200 thử nghiệm
    moi: trong hơn 200 thử nghiệm ngẫu nhiên
    ly_do: d15.
  - cu: Có tác dụng nhỏ lên các kết quả do người bệnh tự báo cáo, như cảm giác đau và buồn nôn.
    moi: Trong một số bối cảnh, giả dược có thể ảnh hưởng đến các kết quả do người bệnh tự báo cáo, nhất là cảm giác đau và buồn nôn. Ảnh hưởng lên cảm giác đau dao động từ không đáng kể đến quan trọng về lâm sàng.
    ly_do: d18.
  - cu: (ví dụ muốn tỏ ra lịch sự với người điều trị)
    moi: (bỏ)
    ly_do: 'd19: không có trong phần đã đọc.'
  - cu: Muốn làm hài lòng. Người tham gia biết nhà nghiên cứu mong đợi điều gì.
    moi: Muốn làm hài lòng. Người tham gia có thể trả lời theo điều họ nghĩ nhà nghiên cứu mong đợi.
    ly_do: d4.
  - cu: Một phần đáng kể có thể đến từ hồi phục tự nhiên
    moi: Một phần có thể đến từ hồi phục tự nhiên
    ly_do: d20.
  - cu: '"Không làm gì" là đối chứng yếu; "một hoạt động khác cũng hấp dẫn như vậy" là đối chứng mạnh hơn.'
    moi: Nhóm đối chứng nên giống nhóm can thiệp ở mọi mặt, trừ điều đang được kiểm tra. "Không làm gì" khác với "một hoạt động trông hấp dẫn tương tự".
    ly_do: d22.
  - cu: 'Khung Khá vững: "giả dược nhìn chung có tác dụng nhỏ, chủ yếu lên các kết quả tự báo cáo … giả dược ''mở'' … vẫn đang được nghiên cứu"'
    moi: '"giả dược nhìn chung không có tác dụng lâm sàng quan trọng, nhưng có thể ảnh hưởng đến một số kết quả tự báo cáo như đau và buồn nôn … chỉ 8% số thử nghiệm có nguy cơ sai lệch thấp"'
    ly_do: d18, d26.
  - cu: để không thể chọn kết quả đẹp nhất sau khi đã thấy dữ liệu
    moi: để tách điều được dự đoán trước khỏi điều chỉ được giải thích sau khi đã thấy dữ liệu (Nosek và cộng sự, 2018)
    ly_do: e4.
  - cu: 'Quiz câu 4, đáp án đúng: "…có thể có tác dụng nhỏ lên những kết quả tự báo cáo"'
    moi: '"…trong một số bối cảnh có thể ảnh hưởng đến những kết quả tự báo cáo"'
    ly_do: q4.
  - cu: (không có)
    moi: 'Thêm ba nguồn vào mục Nguồn: Barnett và cộng sự (2005), Benedetti (2025), Nosek và cộng sự (2018).'
    ly_do: Theo các câu đã gắn nguồn trong thân bài.
