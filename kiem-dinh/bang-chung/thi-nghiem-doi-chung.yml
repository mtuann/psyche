nhan_dinh:
  - id: d1
    cau: 'Điểm căng thẳng có thể giảm vì hồi phục tự nhiên: nhiều khó khăn tự dịu đi theo thời gian.'
    loai: phat-hien
    nguon:
      - benedetti2025
    trich: The placebo response is different from the placebo effect. Whereas the placebo response is the global response to a placebo, including spontaneous remission, regression to the mean, patients' and experimenters' biases, possible effects of cointerventions, as well as psychological factors
    vi_tri: Tóm tắt
    ket_qua: dung
    ghi_chu: '"Kỳ thi qua đi, dự án kết thúc" là ví dụ minh họa của site. Nguồn nói về "spontaneous remission" nói chung (y học); phạm vi căng thẳng tâm lý là suy rộng, lượt 2 xem lại.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/20091554/", "https://chiro.org/research/ABSTRACTS/Is_the_Placebo_Powerless.shtml" ]
    luot_2_ghi_chu: Khớp.
  - id: d2
    cau: 'Hồi quy về trung bình: nếu người ta tham gia đúng lúc điểm đang cao bất thường, lần đo sau thường thấp hơn, dù có làm gì hay không.'
    loai: dinh-nghia
    nguon:
      - barnett2005
    trich: Regression to the mean (RTM) is a statistical phenomenon that can make natural variation in repeated data look like real change. It happens when unusually large or small measurements tend to be followed by measurements that are closer to the mean.
    vi_tri: Tóm tắt (Background)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Người ta thường tìm đến một giải pháp đúng lúc đang căng thẳng nhất. Từ đỉnh điểm, lần đo sau gần như chắc chắn sẽ thấp hơn". Nguồn nói "tend to be followed by measurements closer to the mean" (xu hướng, không "gần như chắc chắn"), và không nói gì về việc người ta tìm giải pháp lúc căng thẳng nhất. Chữ mới bám định nghĩa. Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; Barnett 2005 tóm tắt: "unusually large or small measurements tend to be followed by measurements that are closer to the mean"; "thường", không "gần như chắc chắn". dung.'
    luot_2: dung
    luot_2_nguon: [ "https://academic.oup.com/ije/article/34/1/215/638559" ]
    luot_2_ghi_chu: Khớp; chọn người lúc điểm cao là điều kiện điển hình.
    review: dung
  - id: d3
    cau: 'Kỳ vọng: người tin rằng mình đang được giúp có thể cảm thấy, và trả lời bảng hỏi, tốt hơn.'
    loai: phat-hien
    nguon:
      - openstax23
      - benedetti2025
    trich: The placebo effect occurs when people's expectations or beliefs influence or determine their experience in a given situation.
    vi_tri: OpenStax 2.3, phần Experimenter bias and the placebo effect; Benedetti 2025, tóm tắt
    ket_qua: dung
    ghi_chu: '"Trả lời bảng hỏi" là ứng dụng cho kết quả tự báo cáo; Hróbjartsson 2010 nói kết quả tự báo cáo dễ bị báo cáo thiên lệch (d17).'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings", "https://nobaproject.com/modules/research-designs" ]
    luot_2_ghi_chu: Khớp.
  - id: d4
    cau: Người tham gia có thể trả lời theo điều họ nghĩ nhà nghiên cứu mong đợi.
    loai: phat-hien
    nguon:
      - openstax23
      - hrobjartsson2010
    trich: it is difficult to distinguish patient-reported effects of placebo from biased reporting
    vi_tri: 'Hróbjartsson 2010, Authors'' conclusions; OpenStax 2.3: participant and experimenter bias'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "Muốn làm hài lòng. Người tham gia biết nhà nghiên cứu mong đợi điều gì." Nguồn nói tới báo cáo thiên lệch và thiên lệch của người tham gia nói chung; cơ chế cụ thể "muốn làm hài lòng" không nằm trong nguồn đã mở. Chữ mới: "Người tham gia có thể trả lời theo điều họ nghĩ nhà nghiên cứu mong đợi." Lượt 2 xem lại. Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; câu mềm ("có thể trả lời theo điều họ nghĩ nhà nghiên cứu mong đợi"), nguồn nói tới báo cáo thiên lệch ở người tham gia nói chung (Cochrane 2010, OpenStax 2.3); đúng mức. dung.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings", "https://nobaproject.com/modules/research-designs" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: d5
    cau: Nhóm đối chứng là nhóm giống nhóm can thiệp, chỉ khác ở chỗ không nhận can thiệp; mọi yếu tố trên đều tác động lên cả hai nhóm, nên chênh lệch giữa hai nhóm mới là tác dụng của can thiệp.
    loai: dinh-nghia
    nguon:
      - openstax23
    trich: The two groups are designed to be the same except for one difference— experimental manipulation. … Since experimental manipulation is the only difference between the experimental and control groups, we can be sure that any differences between the two are due to experimental manipulation rather than chance.
    vi_tri: Mục 2.3, Designing an Experiment
    ket_qua: dung
    ghi_chu: Cụm "(hoặc nhận một thứ thay thế)" ứng với placebo (d9).
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings" ]
    luot_2_ghi_chu: Khớp.
  - id: d6
    cau: 'Phân nhóm ngẫu nhiên, khi đủ đông người, giúp hai nhóm ít khác nhau một cách có hệ thống về mọi mặt: tuổi, tính cách, mức căng thẳng ban đầu, và cả những yếu tố không ai nghĩ đến.'
    loai: phat-hien
    nguon:
      - openstax23
    trich: With sufficiently large samples, random assignment makes it unlikely that there are systematic differences between the groups.
    vi_tri: Mục 2.3, Designing an Experiment
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "làm cho hai nhóm giống nhau về mọi mặt tính trung bình". Nguồn nói "ít có khả năng khác nhau một cách có hệ thống khi mẫu đủ lớn". Chữ mới theo nguồn. Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; OpenStax 2.3: "With sufficiently large samples, random assignment makes it unlikely that there are systematic differences between the groups". dung.'
    luot_2: dung
    luot_2_nguon: [ "https://nobaproject.com/modules/research-designs", "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings" ]
    luot_2_ghi_chu: Khớp ('khi đủ đông' là điều kiện đúng).
    review: dung
  - id: d7
    cau: Nếu để người tham gia tự chọn nhóm, những người háo hức nhất có thể chọn dùng ứng dụng, và chính sự háo hức ấy có thể giải thích kết quả.
    loai: phat-hien
    nguon:
      - openstax23
    trich: if the groups were systematically different before the experiment began, we would not know the origin of any differences we find between the groups
    vi_tri: Mục 2.3, Designing an Experiment
    ket_qua: dung
    ghi_chu: Ví dụ "háo hức" là minh họa của site cho ý của nguồn (nhóm khác nhau từ trước thì không biết nguồn gốc khác biệt).
    luot_2: dung
    luot_2_nguon: [ "https://nobaproject.com/modules/research-designs" ]
    luot_2_ghi_chu: Khớp (Noba dùng ví dụ sinh viên tự chọn giáo sư).
  - id: d8
    cau: Thí nghiệm ngẫu nhiên có đối chứng là cách mạnh nhất để kết luận nhân quả.
    loai: phat-hien
    nguon:
      - openstax22
    trich: the only way a researcher can claim that the relationship between the variables is cause and effect is to perform an experiment.
    vi_tri: Mục 2.2, Correlational research
    ket_qua: dung
    ghi_chu: OpenStax nói "thí nghiệm" là cách duy nhất; "ngẫu nhiên có đối chứng" thêm từ d5, d6.
    luot_2: dung
    luot_2_nguon: [ "https://nobaproject.com/modules/research-designs", "https://openstax.org/books/psychology-2e/pages/2-2-approaches-to-research" ]
    luot_2_ghi_chu: Khớp; 'mạnh nhất' là đồng thuận của giáo trình.
  - id: d9
    cau: Giả dược (placebo) là một can thiệp trông giống thật nhưng không có thành phần được cho là có tác dụng, như viên thuốc đường hay một ứng dụng "nghe nhạc thư giãn" thay cho ứng dụng thiền.
    loai: dinh-nghia
    nguon:
      - openstax23
    trich: the control group receives a placebo (in this case a sugar pill). Now everyone gets a pill … Any differences in mood between the experimental and control groups can now be attributed to the drug itself rather than to experimenter bias or participant expectations
    vi_tri: Mục 2.3, Experimenter bias and the placebo effect
    ket_qua: dung
    ghi_chu: Ví dụ ứng dụng nghe nhạc là minh họa của site.
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings" ]
    luot_2_ghi_chu: Định nghĩa chuẩn; hai ví dụ (viên đường, ứng dụng nghe nhạc) là minh họa.
  - id: d10
    cau: 'Mù đơn: người tham gia không biết mình ở nhóm nào.'
    loai: dinh-nghia
    nguon:
      - openstax23
    trich: This situation is a single-blind study, meaning that one of the groups (participants) are unaware as to which group they are in (experiment or control group) while the researcher who developed the experiment knows which participants are in each group.
    vi_tri: Mục 2.3
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings", "https://nobaproject.com/modules/research-designs" ]
    luot_2_ghi_chu: Khớp; 'người đo kết quả' là cách nói chi tiết hơn của 'nhà nghiên cứu'.
  - id: d11
    cau: 'Mù đôi: cả người tham gia lẫn người đo kết quả đều không biết; điều này ngăn kỳ vọng của nhà nghiên cứu ảnh hưởng đến cách họ đo và ghi nhận.'
    loai: dinh-nghia
    nguon:
      - openstax23
    trich: In a double-blind study, both the researchers and the participants are blind to group assignments. … by doing so, we can control for both experimenter and participant expectations.
    vi_tri: Mục 2.3
    ket_qua: dung
    ghi_chu: 'OpenStax nói "nhà nghiên cứu", site nói "người đo kết quả" (người chấm điểm không biết nhóm: "the people who score the tests are unaware of who was assigned", cùng mục).'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings", "https://nobaproject.com/modules/research-designs" ]
    luot_2_ghi_chu: Khớp; 'người đo kết quả' là cách nói chi tiết hơn của 'nhà nghiên cứu'.
  - id: d12
    cau: Nhiều cha mẹ tin rằng đường ảnh hưởng đến hành vi của trẻ.
    loai: lich-su
    nguon:
      - wolraich1995
    trich: The strong belief of parents may be due to expectancy and common association.
    vi_tri: Tóm tắt (Conclusion)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "nhiều cha mẹ tin rằng ăn đường làm trẻ tăng động". Tóm tắt nói "behavior or cognition" và "strong belief of parents", không nói "tăng động". Chữ mới theo tóm tắt. Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; Wolraich 1995: "strong belief of parents"; không nói "tăng động". dung.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/7474248/", "https://pubmed.ncbi.nlm.nih.gov/7963081/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: d13
    cau: Thí nghiệm mù đôi cho trẻ ăn đường hoặc chất tạo ngọt mà người tham gia, cha mẹ và nhân viên nghiên cứu đều không biết; phân tích tổng hợp không thấy đường ảnh hưởng đến hành vi hay nhận thức của trẻ, dù chưa loại trừ được một tác dụng nhỏ hay tác dụng ở một nhóm trẻ nhất định.
    loai: phat-hien
    nguon:
      - wolraich1995
    trich: blind the subjects, parents, and research staff to the conditions … The meta-analytic synthesis of the studies to date found that sugar does not affect the behavior or cognitive performance of children. … However, a small effect of sugar or effects on subsets of children cannot be ruled out.
    vi_tri: Tóm tắt (Study selection, Conclusion)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "không thấy đường ảnh hưởng đến hành vi hay nhận thức của trẻ" (không có vế "chưa loại trừ"). Chữ mới thêm giới hạn của tác giả; thêm nêu rõ ai bị làm mù. Chỉ đọc tóm tắt (JAMA), 16 báo cáo, 23 nghiên cứu. Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; Wolraich 1995 tóm tắt (Europe PMC đọc lại): "does not affect the behavior or cognitive performance of children … However, a small effect of sugar or effects on subsets of children cannot be ruled out". dung.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/7474248/" ]
    luot_2_ghi_chu: Khớp. Bản tóm tắt qua công cụ; chữ thật của abstract PubMed.
    review: dung
  - id: d14
    cau: Niềm tin của người lớn, chứ không phải đường, có thể là thứ khiến họ "thấy" trẻ thay đổi.
    loai: phat-hien
    nguon:
      - wolraich1995
    trich: The strong belief of parents may be due to expectancy and common association.
    vi_tri: Tóm tắt (Conclusion)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "khiến họ thấy trẻ hiếu động". Tóm tắt nói "may be due to expectancy and common association"; chữ mới bỏ "hiếu động". Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; "có thể là thứ khiến họ thấy", mềm, theo "may be due to expectancy and common association". dung.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/7963081/", "https://pubmed.ncbi.nlm.nih.gov/7474248/" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: d15
    cau: Một tổng quan Cochrane so sánh giả dược với không điều trị gì trong hơn 200 thử nghiệm ngẫu nhiên, ở khoảng 60 tình trạng bệnh khác nhau (Hróbjartsson và Gøtzsche, 2010).
    loai: so-lieu
    nguon:
      - hrobjartsson2010
    trich: Outcome data were available in 202 out of 234 included trials, investigating 60 clinical conditions. … We included randomised placebo trials with a no-treatment control group investigating any health problem.
    vi_tri: Tóm tắt (Selection criteria, Main results)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "hơn 200 thử nghiệm" (thiếu "ngẫu nhiên"). 202/234 thử nghiệm có dữ liệu kết quả, 60 tình trạng. Đã thêm "ngẫu nhiên" theo tiêu chí chọn. Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; Cochrane 2010: 202/234 thử nghiệm có dữ liệu, 60 tình trạng; "hơn 200" đúng cả hai số. dung.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/20091554/" ]
    luot_2_ghi_chu: "Khớp: 'hơn 200' đúng với cả 234 và 202."
    review: dung
  - id: d16
    cau: Người ta hay nói giả dược có tác dụng rất mạnh.
    loai: lich-su
    nguon:
      - hrobjartsson2010
    trich: Placebo interventions are often claimed to substantially improve patient-reported and observer-reported outcomes in many clinical conditions
    vi_tri: Tóm tắt (Background)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://chiro.org/research/ABSTRACTS/Is_the_Placebo_Powerless.shtml" ]
    luot_2_ghi_chu: Câu lịch sử/niềm tin phổ biến; khớp với phần mở đầu của Hróbjartsson & Gøtzsche 2001 (qua trang chép abstract, không phải NEJM).
  - id: d17
    cau: Nhìn chung, các tác giả không thấy giả dược có tác dụng lâm sàng quan trọng.
    loai: phat-hien
    nguon:
      - hrobjartsson2010
    trich: We did not find that placebo interventions have important clinical effects in general.
    vi_tri: Tóm tắt (Authors' conclusions)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nhìn chung, giả dược không có tác dụng lâm sàng quan trọng." Đổi thành phát biểu về điều các tác giả thấy. Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; trích "We did not find that placebo interventions have important clinical effects in general". dung.'
    luot_2: dung
