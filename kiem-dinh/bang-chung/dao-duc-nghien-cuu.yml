nhan_dinh:
- id: e1
  cau: Tình huống giả định ở "Một tin tức" (200 sinh viên, căng thẳng mức vừa, cộng điểm môn học bắt buộc) không dựa trên một nghiên cứu thật.
  loai: ve-site
  ket_qua: dung
  ghi_chu: gia-dinh. Trang ghi rõ là tình huống giả định; không nhận định nào khác dựa vào nó.
- id: e2
  cau: Tuyên bố Helsinki yêu cầu kế hoạch nghiên cứu được nộp cho hội đồng đạo đức nghiên cứu để xem xét và phê duyệt trước khi nghiên cứu bắt đầu; Bộ luật đạo đức của APA yêu cầu xin phê duyệt trước khi tiến hành nghiên cứu khi cơ sở đòi phê duyệt.
  loai: phat-hien
  nguon:
  - helsinki2024
  - apa2017
  trich: The protocol must be submitted for consideration, comment, guidance, and approval to the concerned research ethics committee before the research begins. | When institutional approval is required, psychologists provide accurate information about their research proposals and obtain approval prior to conducting the research.
  vi_tri: Helsinki, mục Research Ethics Committees; APA 8.01
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đây chính là những câu hỏi mà đạo đức nghiên cứu phải trả lời — trước khi nghiên cứu bắt đầu, không phải sau khi có chuyện xảy ra." Chữ mới dẫn hai văn bản. Lý do: câu cũ là nhận định chung, nay có nguồn.'
- id: e3
  cau: 'Báo cáo Belmont mở đầu: nghiên cứu khoa học đã đem lại lợi ích xã hội đáng kể nhưng cũng đặt ra những câu hỏi đạo đức rắc rối; sự chú ý của công chúng được kéo tới nhờ các báo cáo về việc lạm dụng người tham gia trong thí nghiệm y sinh, đặc biệt trong Thế chiến II.'
  loai: lich-su
  nguon:
  - belmont1979
  trich: Scientific research has produced substantial social benefits. It has also posed some troubling ethical questions. Public attention was drawn to these questions by reported abuses of human subjects in biomedical experiments, especially during the Second World War.
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23192 (phần mở đầu)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Khoa học có thể mang lại lợi ích lớn, nhưng lịch sử cũng ghi nhận những nghiên cứu làm hại người tham gia: họ không được cho biết đầy đủ thông tin, không thực sự tự nguyện, hoặc bị chọn vì dễ tiếp cận, dễ ép buộc." Chữ mới: bám câu mở đầu của Belmont và nêu Tuskegee (e4). Lý do: câu cũ không có nguồn cụ thể.'
- id: e4
  cau: 'Belmont nhắc tới nghiên cứu giang mai ở Tuskegee: các nam giới da đen nghèo ở nông thôn được dùng để nghiên cứu diễn tiến tự nhiên của bệnh, và họ bị từ chối phương pháp điều trị hiệu quả đã có.'
  loai: lich-su
  nguon:
  - belmont1979
  trich: the Tuskegee syphilis study used disadvantaged, rural black men to study the untreated course of a disease ... These subjects were deprived of demonstrably effective treatment in order not to interrupt the project, long after such treatment became generally available.
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23194, mục B.3 (Justice)
  ket_qua: dung
  ghi_chu: Mục mới. Belmont ghi "in the 1940’s"; trang không nêu năm.
- id: e5
  cau: Belmont viết rằng cần xem xét việc chọn người tham gia có phải vì họ dễ tiếp cận, ở thế yếu hay dễ bị tác động, thay vì vì lý do liên quan trực tiếp đến vấn đề nghiên cứu.
  loai: phat-hien
  nguon:
  - belmont1979
  trich: being systematically selected simply because of their easy availability, their compromised position, or their manipulability, rather than for reasons directly related to the problem being studied
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23194
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "những nghiên cứu làm hại người tham gia: ... hoặc bị chọn vì dễ tiếp cận, dễ ép buộc". Chữ mới theo Belmont ("easy availability, compromised position, manipulability").'
- id: e6
  cau: 'Theo Belmont, các bộ quy tắc đạo đức có từ trước thường không đủ cho tình huống phức tạp: có lúc chúng mâu thuẫn nhau và thường khó diễn giải hay áp dụng; nên cần những nguyên tắc rộng hơn làm nền cho các quy tắc cụ thể.'
  loai: phat-hien
  nguon:
  - belmont1979
  trich: Such rules often are inadequate to cover complex situations; at times they come into conflict, and they are frequently difficult to interpret or apply. Broader ethical principles will provide a basis on which specific rules may be formulated, criticized and interpreted.
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23193
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Bảo vệ người tham gia vì thế không thể giao hoàn toàn cho lương tâm từng nhà nghiên cứu — cần nguyên tắc chung và cơ chế kiểm tra độc lập." Chữ mới theo Belmont; phần "cơ chế kiểm tra độc lập" chuyển sang e7. Lý do: câu cũ về "lương tâm từng nhà nghiên cứu" không có nguồn.'
- id: e7
  cau: Tuyên bố Helsinki yêu cầu hội đồng đạo đức nghiên cứu hoạt động minh bạch và có sự độc lập và quyền hạn để chống lại ảnh hưởng không chính đáng từ nhà nghiên cứu, bên tài trợ hay người khác.
  loai: phat-hien
  nguon:
  - helsinki2024
  trich: This committee must be transparent in its functioning and must have the independence and authority to resist undue influence from the researcher, the sponsor, or others.
  vi_tri: Helsinki, mục Research Ethics Committees
  ket_qua: dung
- id: e8
  cau: Ngày 12/7/1974, Đạo luật Nghiên cứu Quốc gia (National Research Act) được ký, lập ra Ủy ban Quốc gia về Bảo vệ Đối tượng Con người trong Nghiên cứu Y sinh và Hành vi; một nhiệm vụ của Ủy ban là xác định các nguyên tắc đạo đức cơ bản làm nền cho nghiên cứu với người.
  loai: lich-su
  nguon:
  - belmont1979
  trich: On July 12, 1974, the National Research Act (Pub. L. 93-348) was signed into law, thereby creating the National Commission for the Protection of Human Subjects of Biomedical and Behavioral Research. One of the charges to the Commission was to identify the basic ethical principles that should underlie the conduct of biomedical and behavioral research involving human subjects
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23192 (Summary)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Ủy ban được thành lập theo Đạo luật Nghiên cứu Quốc gia (National Research Act) năm 1974, với nhiệm vụ xác định các nguyên tắc đạo đức nền tảng cho mọi nghiên cứu liên quan đến con người." Chữ mới: thêm ngày 12/7/1974; "mọi nghiên cứu" đổi thành nghiên cứu y sinh và hành vi (đúng phạm vi Ủy ban).'
- id: e9
  cau: Báo cáo Belmont tóm tắt các nguyên tắc, rút ra từ cuộc thảo luận bốn ngày tại Trung tâm Hội nghị Belmont của Smithsonian vào tháng 2/1976 và các phiên họp hằng tháng trong gần bốn năm; được đăng trên Federal Register ngày 18/4/1979 để lấy ý kiến công chúng.
  loai: lich-su
  nguon:
  - belmont1979
  trich: 'It is the outgrowth of an intensive four-day period of discussions that were held in February 1976 at the Smithsonian Institution’s Belmont Conference Center supplemented by the monthly deliberations of the Commission that were held over a period of nearly four years. | Federal Register / Vol. 44, No. 76 / Wednesday, April 18, 1979 / Notices | Action: Notice of Report for Public Comment'
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23192
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Năm 1979, Ủy ban ... ban hành Báo cáo Belmont." Chữ mới: công bố trên Federal Register ngày 18/4/1979 (thông báo để lấy ý kiến công chúng). Lý do: văn bản đăng ở Federal Register là thông báo báo cáo để lấy ý kiến; nguồn cũ Wikipedia (ngày 30/9/1978) bỏ, không dùng bậc 3.'
- id: e10
  cau: 'Nguyên tắc tôn trọng con người gồm hai điều: cá nhân được đối xử như chủ thể tự quyết, và người có khả năng tự quyết hạn chế (do chưa trưởng thành, bệnh tật, khuyết tật tâm thần hay hoàn cảnh hạn chế tự do) được bảo vệ.'
  loai: dinh-nghia
  nguon:
  - belmont1979
  trich: 'Respect for persons incorporates at least two ethical convictions: First, that individuals should be treated as autonomous agents, and second, that persons with diminished autonomy are entitled to protection.'
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23193, mục B.1
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "(như trẻ em)". Chữ mới: "do chưa trưởng thành, bệnh tật, khuyết tật tâm thần hay hoàn cảnh hạn chế tự do". Lý do: Belmont nói "the immature and the incapacitated"; ví dụ "trẻ em" của trang là diễn giải của site.'
- id: e11
  cau: 'Belmont hiểu beneficence là một nghĩa vụ, với hai quy tắc bổ trợ nhau: không gây hại, và tối đa hóa lợi ích có thể có đồng thời tối thiểu hóa tác hại có thể có.'
  loai: dinh-nghia
  nguon:
  - belmont1979
  trich: 'beneficence is understood in a stronger sense, as an obligation. Two general rules have been formulated as complementary expressions of beneficent actions in this sense: (1) do not harm and (2) maximize possible benefits and minimize possible harms.'
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23194, mục B.2
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Không chỉ "tránh làm hại", mà phải chủ động tối đa hóa lợi ích và tối thiểu hóa rủi ro." Chữ mới: hai quy tắc đúng như Belmont (không gây hại cũng là một quy tắc). Lý do: "chỉ ... mà phải chủ động" gợi ý "không gây hại" không đủ, trong khi Belmont coi đó là một trong hai quy tắc.'
- id: e12
  cau: 'Nguyên tắc công bằng đặt câu hỏi: ai nên nhận lợi ích của nghiên cứu và ai nên gánh các gánh nặng của nó; đó là câu hỏi về "sự công bằng trong phân phối".'
  loai: dinh-nghia
  nguon:
  - belmont1979
  trich: Who ought to receive the benefits of research and bear its burdens? This is a question of justice, in the sense of “fairness in distribution” or “what is deserved.”
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23194, mục B.3
  ket_qua: dung
- id: e13
  cau: 'Belmont nêu ba yêu cầu áp dụng các nguyên tắc: đồng thuận thông tin (từ tôn trọng con người), đánh giá rủi ro và lợi ích (từ beneficence), lựa chọn người tham gia (từ công bằng).'
  loai: phat-hien
  nguon:
  - belmont1979
  trich: 'Applications of the general principles to the conduct of research leads to consideration of the following requirements: informed consent, risk/benefit assessment, and the selection of subjects of research. | Just as the principle of respect for persons finds expression in the requirements for consent, and the principle of beneficence in risk/benefit assessment, the principle of justice gives rise to ... fair procedures and outcomes in the selection of research subjects.'
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23194–23196, mục C
  ket_qua: dung
- id: e14
  cau: 'Belmont nêu ba nguyên tắc như khung phân tích chứ không phải bộ quy tắc: chúng "không phải lúc nào cũng áp dụng được để giải quyết dứt điểm" các vấn đề đạo đức cụ thể.'
  loai: phat-hien
  nguon:
  - belmont1979
  trich: These principles cannot always be applied so as to resolve beyond dispute particular ethical problems. The objective is to provide an analytical framework that will guide the resolution of ethical problems arising from research involving human subjects.
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23193
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Ba nguyên tắc đôi khi mâu thuẫn — ví dụ, bảo vệ thêm người yếu thế có thể đồng nghĩa với loại họ khỏi nghiên cứu có lợi. Vì vậy chúng dùng để định hướng xét đoán, không phải để bấm máy ra đáp án tự động." Chữ mới theo Belmont, thay ví dụ bằng ví dụ tù nhân (e15). Lý do: ví dụ cũ là của site; ví dụ của Belmont là tù nhân.'
- id: e15
  cau: Với tù nhân, tôn trọng con người đòi hỏi không tước cơ hội tình nguyện tham gia của họ, nhưng trong hoàn cảnh nhà tù họ có thể bị ép buộc tinh vi hay chịu ảnh hưởng không chính đáng, nên cũng đòi hỏi phải bảo vệ họ; Belmont gọi đó là một thế lưỡng nan.
  loai: phat-hien
  nguon:
  - belmont1979
  trich: On the one hand, it would seem that the principle of respect for perons requires that prisoners not be deprived of the opportunity to volunteer for research. On the other hand, under prison conditions they may be subtly coerced or unduly influenced ... Whether to allow prisoners to “volunteer” or to “protect” them presents a dilemma.
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23194
  ket_qua: dung
  ghi_chu: Mục mới.
- id: e16
  cau: 'Theo Belmont, có sự đồng thuận rộng rãi rằng quá trình đồng thuận gồm ba yếu tố: thông tin, hiểu được thông tin và tự nguyện.'
  loai: phat-hien
  nguon:
  - belmont1979
  trich: 'there is widespread agreement that the consent process can be analyzed as containing three elements: information, comprehension and voluntariness.'
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23195, mục C.1
  ket_qua: dung
- id: e17
  cau: 'Thông tin: các bộ quy tắc nghiên cứu thường liệt kê những điều phải cho biết, gồm quy trình, mục đích, rủi ro và lợi ích dự kiến, thủ tục thay thế (khi có điều trị), và lời mời đặt câu hỏi và rút lui bất cứ lúc nào.'
  loai: phat-hien
  nguon:
  - belmont1979
  trich: 'These items generally include: the research procedure, their purposes, risks and anticipated benefits, alternative procedures (where therapy is involved), and a statement offering the subject the opportunity to ask questions and to withdraw at any time from the research.'
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23195
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "người tham gia được biết trước nghiên cứu làm gì, rủi ro và lợi ích có thể có, và họ có quyền rút lui bất cứ lúc nào." Chữ mới thêm mục đích, thủ tục thay thế, đặt câu hỏi; "quyền rút lui" thành lời mời rút lui. Lý do: sát văn bản Belmont.'
- id: e18
  cau: 'Hiểu được thông tin: cách và bối cảnh truyền đạt quan trọng không kém chính thông tin; trình bày lộn xộn và vội, cho quá ít thời gian, hay hạn chế cơ hội đặt câu hỏi làm giảm khả năng lựa chọn có hiểu biết; phải thích ứng cách trình bày với khả năng người nhận; nhà nghiên cứu có trách nhiệm xác nhận người tham gia đã hiểu.'
  loai: phat-hien
  nguon:
  - belmont1979
  trich: The manner and context in which information is conveyed is as important as the information itself. For example, presenting information in a disorganized and rapid fashion, allowing too little time for consideration or curtailing opportunities for questioning, all may adversely affect a subject’s ability to make an informed choice. | it is necessary to adapt the presentation of the information to the subject’s capacities. Investigators are responsible for ascertaining that the subject has comprehended the information.
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23195
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "cách truyền đạt phải phù hợp với người nhận, không phải cứ đưa tờ giấy đầy thuật ngữ là xong." Chữ mới theo Belmont. Lý do: "tờ giấy đầy thuật ngữ" là ví dụ của site, không có trong Belmont.'
- id: e19
  cau: 'Tự nguyện: đồng ý chỉ là đồng thuận hợp lệ khi được đưa ra một cách tự nguyện, không bị ép buộc hay chịu ảnh hưởng không chính đáng; ảnh hưởng không chính đáng xảy ra khi có lời đề nghị thưởng quá mức, không chính đáng hay không phù hợp để đổi lấy sự tuân thủ, và những khích lệ bình thường vẫn có thể thành ảnh hưởng không chính đáng khi người tham gia đặc biệt dễ tổn thương.'
  loai: phat-hien
  nguon:
  - belmont1979
  trich: An agreement to participate in research constitutes a valid consent only if voluntarily given. | Undue influence, by contrast, occurs through an offer of an excessive, unwarranted, inappropriate or improper reward or other overture in order to obtain compliance. Also, inducements that would ordinarily be acceptable may become undue influences if the subject is especially vulnerable.
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23195
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "quyết định không bị ép buộc và không bị ảnh hưởng không chính đáng (ví dụ: phần thưởng lớn đến mức người ta không dám từ chối, hay điểm số gắn với việc tham gia)." Chữ mới theo Belmont: "thưởng quá mức, không chính đáng hay không phù hợp"; ví dụ điểm số chuyển sang APA 8.04 (e22). Lý do: "lớn đến mức không dám từ chối" và "điểm số" không có trong Belmont.'
- id: e20
  cau: 'Đồng thuận không chỉ là chữ ký: ký vào một tờ giấy mà không hiểu, hoặc hiểu nhưng không dám từ chối, đều chưa đáp ứng các yếu tố hiểu được thông tin và tự nguyện.'
  loai: phat-hien
  nguon:
  - belmont1979
  trich: Investigators are responsible for ascertaining that the subject has comprehended the information. | Unjustifiable pressures usually occur when persons in positions of authority or commanding influence—especially where possible sanctions are involved—urge a course of action for a subject.
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23195
  ket_qua: da-lam-mem
  ghi_chu: Suy luận của site từ e18, e19.
- id: e21
  cau: 'Bộ luật đạo đức của APA liệt kê những điều nhà tâm lý học phải thông báo cho người tham gia: mục đích, thời lượng và quy trình; quyền từ chối và rút lui; hậu quả của việc từ chối hay rút lui; các yếu tố có thể ảnh hưởng tới việc sẵn lòng tham gia như rủi ro, khó chịu; lợi ích dự kiến; giới hạn bảo mật; khích lệ; và người để liên hệ; kèm cơ hội đặt câu hỏi.'
  loai: phat-hien
  nguon:
  - apa2017
  trich: psychologists inform participants about (1) the purpose of the research, expected duration, and procedures; (2) their right to decline to participate and to withdraw ...; (3) the foreseeable consequences of declining or withdrawing; (4) reasonably foreseeable factors ... such as potential risks, discomfort, or adverse effects; (5) any prospective research benefits; (6) limits of confidentiality; (7) incentives for participation; and (8) whom to contact
  vi_tri: APA 8.02(a)
  ket_qua: dung
  ghi_chu: Mục mới (tóm gọn).
- id: e22
  cau: Khi tham gia nghiên cứu là yêu cầu của môn học hay cơ hội cộng điểm, Bộ luật APA yêu cầu người tham gia được lựa chọn các hoạt động thay thế tương đương; và yêu cầu nhà tâm lý học bảo vệ người tham gia là sinh viên, bệnh nhân hay cấp dưới khỏi hậu quả bất lợi khi từ chối hay rút lui.
  loai: phat-hien
  nguon:
  - apa2017
  trich: When psychologists conduct research with clients/patients, students, or subordinates as participants, psychologists take steps to protect the prospective participants from adverse consequences of declining or withdrawing from participation. | When research participation is a course requirement or an opportunity for extra credit, the prospective participant is given the choice of equitable alternative activities.
  vi_tri: APA 8.04(a), (b)
  ket_qua: dung
  ghi_chu: Mục mới (cho ví dụ điểm số).
- id: e23
  cau: Quy định liên bang Mỹ về bảo vệ người tham gia nghiên cứu (45 CFR 46) áp dụng cho nghiên cứu với người do một cơ quan liên bang thực hiện, tài trợ hay quản lý (khi cơ quan đó đã áp dụng chính sách); yêu cầu thông tin bằng ngôn ngữ người tham gia hiểu được, cơ hội đủ để thảo luận và cân nhắc, giảm thiểu khả năng ép buộc hay ảnh hưởng không chính đáng, nêu rõ tham gia là tự nguyện, và người tham gia có thể ngừng bất cứ lúc nào mà không bị phạt.
  loai: phat-hien
  nguon:
  - cfr45-46
  trich: all research involving human subjects conducted, supported, or otherwise subject to regulation by any Federal department or agency that takes appropriate administrative action to make the policy applicable | in language understandable to the subject | sufficient opportunity to discuss and consider whether or not to participate | minimize the possibility of coercion or undue influence | participation is voluntary, refusal to participate will involve no penalty ... the subject may discontinue participation at any time without penalty
  vi_tri: 46.101(a); 46.116(a), (b)(8)
  ket_qua: da-sua
  ghi_chu: 'Bản chữ cũ không nêu 45 CFR 46 (mục mới). Ghi chú cho lượt 2: câu trích 46.101 và 46.116 lấy qua công cụ đọc web của eCFR bản ngày 1/10/2026, từng điều riêng.'
- id: e24
  cau: IRB (Institutional Review Board) là hội đồng xem xét các kế hoạch nghiên cứu với người; theo quy định liên bang Mỹ, mỗi IRB có ít nhất năm thành viên với nền tảng khác nhau, trong đó có ít nhất một người có mối quan tâm chính ở lĩnh vực khoa học, ít nhất một người ở lĩnh vực ngoài khoa học, và ít nhất một người không thuộc cơ sở.
  loai: dinh-nghia
  nguon:
  - cfr45-46
  trich: Each IRB shall have at least five members, with varying backgrounds | at least one member whose primary concerns are in scientific areas | at least one member whose primary concerns are in nonscientific areas | at least one member who is not otherwise affiliated with the institution
  vi_tri: 45 CFR 46.107
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "hội đồng độc lập gồm các nhà khoa học và người ngoài ngành". Chữ mới theo 46.107. Lý do: "độc lập" không phải chữ của quy định (quy định đòi ít nhất một thành viên không thuộc cơ sở; tính độc lập nói ở Helsinki cho hội đồng đạo đức nghiên cứu, e7).'
- id: e25
  cau: Tuyên bố Helsinki gọi hội đồng này là hội đồng đạo đức nghiên cứu (research ethics committee).
  loai: dinh-nghia
  nguon:
  - helsinki2024
  trich: Research Ethics Committees
  vi_tri: Helsinki, tên mục
  ket_qua: dung
  ghi_chu: Mục mới.
- id: e26
  cau: Theo quy định liên bang Mỹ, IRB xem xét xem rủi ro có được giảm thiểu, rủi ro có hợp lý so với lợi ích dự kiến, việc chọn người tham gia có công bằng, và đồng thuận thông tin có được xin hay không.
  loai: phat-hien
  nguon:
  - cfr45-46
  trich: Risks to subjects are minimized | Risks to subjects are reasonable in relation to anticipated benefits, if any, to subjects | Selection of subjects is equitable | Informed consent will be sought from each prospective subject
  vi_tri: 45 CFR 46.111(a)(1)–(4)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "đánh giá rủi ro–lợi ích, kiểm tra quy trình đồng thuận, xem xét cách chọn người tham gia". Chữ mới theo 46.111. Lý do: thêm "giảm thiểu rủi ro", dùng đúng tiêu chí.'
- id: e27
  cau: IRB có thẩm quyền phê duyệt, yêu cầu sửa đổi để được phê duyệt, hoặc không phê duyệt các hoạt động nghiên cứu thuộc phạm vi quy định.
  loai: phat-hien
  nguon:
  - cfr45-46
  trich: An IRB shall review and have authority to approve, require modifications in (to secure approval), or disapprove
  vi_tri: 45 CFR 46.109(a)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "từ chối nếu rủi ro không thể chấp nhận được" (điều kiện từ chối). Lý do: bản quy định chỉ nêu thẩm quyền, không nêu riêng điều kiện "rủi ro không chấp nhận được" ở 46.109(a).'
- id: e28
  cau: Với nghiên cứu cần xem xét tại cuộc họp đầy đủ của IRB, quy định liên bang yêu cầu xem xét liên tục theo khoảng thời gian phù hợp với mức rủi ro, ít nhất mỗi năm một lần, trừ một số trường hợp ngoại lệ.
  loai: phat-hien
  nguon:
  - cfr45-46
  trich: An IRB shall conduct continuing review of research requiring review by the convened IRB ... at intervals appropriate to the degree of risk, not less than once per year. | Unless an IRB determines otherwise, continuing review of research is not required in the following circumstances
  vi_tri: 45 CFR 46.109(e), (f)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Giám sát tiếp trong quá trình nghiên cứu — duyệt một lần không phải là xong." Chữ mới thêm giới hạn (chỉ nghiên cứu cần xem xét tại cuộc họp đầy đủ, có ngoại lệ). Lý do: sau bản sửa 2018, nhiều nghiên cứu (như nghiên cứu duyệt rút gọn) không cần xem xét liên tục.'
- id: e29
  cau: Tuyên bố Helsinki nói hội đồng đạo đức nghiên cứu phải có quyền giám sát, đề nghị thay đổi, rút phê duyệt và đình chỉ nghiên cứu đang diễn ra.
  loai: phat-hien
  nguon:
  - helsinki2024
  trich: The committee must have the right to monitor, recommend changes to, withdraw approval for, and suspend ongoing research.
  vi_tri: Helsinki, mục Research Ethics Committees
  ket_qua: dung
  ghi_chu: Mục mới.
- id: e30
  cau: Các tiêu chí duyệt của IRB (giảm thiểu rủi ro, rủi ro hợp lý so với lợi ích, chọn người tham gia công bằng, đồng thuận thông tin) tương ứng ba ứng dụng của Belmont.
  loai: phat-hien
  nguon:
  - cfr45-46
  - belmont1979
  trich: Selection of subjects is equitable | informed consent, risk/benefit assessment, and the selection of subjects of research
  vi_tri: 46.111(a); Belmont tr. 23194–23195
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Nói ngắn gọn: IRB là "người gác cửa" đảm bảo ba nguyên tắc của Belmont được áp dụng vào từng nghiên cứu cụ thể, trước khi bất kỳ ai tham gia." Chữ mới ghi là nhận xét đối chiếu của site. Lý do: bỏ ẩn dụ "gác cửa" và "đảm bảo" (mạnh hơn nguồn).'
- id: e31
  cau: Phần về IRB mô tả khung quốc tế và khung của Hoa Kỳ; quy định cụ thể ở Việt Nam chưa nằm trong trang này.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm trên trang: không có đoạn nào nêu quy định Việt Nam. Ghi chú cho người giao: chưa có mục về quy định Việt Nam (không nêu trong lời giao nếu trang không nói tới).'
- id: e32
  cau: Trong thí nghiệm Milgram, người tham gia được mời vào một nghiên cứu "về trí nhớ và hình phạt", trong khi "học trò" là người cộng tác của Milgram và máy giật điện là giả; nhiều người tham gia căng thẳng rõ rệt.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm: khớp trang thi-nghiem/milgram.md (mục Thiết kế: nghiên cứu "về trí nhớ và hình phạt", "học trò" là người cộng tác, máy giật điện giả; đoạn mở đầu: "nhiều người căng thẳng rõ rệt"). Chữ cũ của trang đạo đức: "người tham gia bị đặt vào tình huống cực kỳ căng thẳng mà không được báo trước mức độ căng thẳng đó" (da-sua: "không được báo trước" không có trong trang nhà).'
- id: e33
  cau: 'Belmont nói việc không tiết lộ đầy đủ chỉ chính đáng khi: thật sự cần thiết cho mục tiêu nghiên cứu; không có rủi ro ẩn nào hơn mức tối thiểu; có kế hoạch giải thích sau khi thích hợp và phổ biến kết quả cho người tham gia.'
  loai: phat-hien
  nguon:
  - belmont1979
  trich: In all cases of research involving incomplete disclosure, such research is justified only if it is clear that (1) incomplete disclosure is truly necessary to accomplish the goals of the research, (2) there are no undisclosed risks to subjects that are more than minimal, and (3) there is an adequate plan for debriefing subjects, when appropriate, and for dissemination of research results to them.
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23195, mục C.1
  ket_qua: dung
  ghi_chu: Mục mới.
- id: e34
  cau: Đặt thí nghiệm Milgram cạnh các điều kiện của Belmont về không tiết lộ đầy đủ, ta thấy câu hỏi về beneficence (rủi ro tâm lý) và về đồng thuận thông tin (liệu họ có đồng ý nếu biết trước?); đây là cách đọc của site, không phải kết luận của Belmont.
  loai: phat-hien
  nguon:
  - belmont1979
  trich: there are no undisclosed risks to subjects that are more than minimal
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23195
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: nói thẳng "một câu hỏi lớn về beneficence ... và về đồng thuận thông tin". Chữ mới ghi là cách đọc của site. Lý do: suy luận của site, không nguồn nào kết luận về Milgram.'
- id: e35
  cau: Trong thí nghiệm Asch, mỗi người tham gia thật ngồi trong nhóm 7–9 người mà những người còn lại là "chim mồi" của nhà nghiên cứu, nên không biết mình đang ở trong một màn sắp đặt; câu hỏi đặt ra là về tôn trọng con người khi thông tin bị giấu bằng mưu mẹo.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm: khớp trang thi-nghiem/asch.md (mục Thiết kế: nhóm 7–9 người, một người tham gia thật, còn lại là "chim mồi"). Chữ cũ: "bị các "đồng bọn" gây sức ép mà không hề biết mình đang trong một màn sắp đặt"; đổi "đồng bọn" thành "chim mồi" (từ của trang nhà). Câu hỏi về tôn trọng con người là cách đọc của site (suy luận từ e16, e33).'
- id: e36
  cau: Các lần làm lại thí nghiệm Milgram thời nay dùng thủ tục đã giảm nhẹ.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm: khớp thi-nghiem/milgram.md (Burger dừng ở 150V; Doliński giảm cường độ vì lý do đạo đức). Trang đạo đức chỉ nhắc và dẫn về trang nhà, không nêu số.'
- id: e37
  cau: Bộ luật APA cho phép nghiên cứu dùng mưu mẹo chỉ khi nhà nghiên cứu xác định giá trị khoa học, giáo dục hay ứng dụng của nghiên cứu biện minh cho nó và không có cách nào không dùng mưu mẹo mà hiệu quả; không được dùng mưu mẹo về điều dự kiến gây đau thể xác hay đau khổ tinh thần nặng; và phải giải thích mưu mẹo cho người tham gia sớm nhất có thể, tốt nhất là khi họ kết thúc phần tham gia, muộn nhất là khi kết thúc thu thập dữ liệu.
  loai: phat-hien
  nguon:
  - apa2017
  trich: do not conduct a study involving deception unless they have determined that the use of deceptive techniques is justified by the study’s significant prospective scientific, educational, or applied value and that effective nondeceptive alternative procedures are not feasible. | do not deceive prospective participants about research that is reasonably expected to cause physical pain or severe emotional distress. | explain any deception ... as early as is feasible, preferably at the conclusion of their participation, but no later than at the conclusion of the data collection
  vi_tri: APA 8.07(a)–(c)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "nghiên cứu dùng mưu mẹo như vậy phải thuyết phục được IRB: mức độ lừa dối là tối thiểu, không còn cách nào khác để trả lời câu hỏi nghiên cứu, và người tham gia được giải thích đầy đủ (debriefing) ngay sau đó." Chữ mới theo APA 8.07. Lý do: "phải thuyết phục được IRB" không có trong 8.07 (8.01 yêu cầu phê duyệt khi cơ sở đòi), "mức độ lừa dối tối thiểu" không phải chữ của APA, "ngay sau đó" sai: APA cho phép muộn nhất đến khi kết thúc thu thập dữ liệu.'
- id: e38
  cau: Tiêu chuẩn 8.08 của Bộ luật APA yêu cầu cho người tham gia cơ hội kịp thời để nhận thông tin về bản chất, kết quả và kết luận của nghiên cứu, và sửa hiểu lầm nếu có; nếu thủ tục gây hại cho người tham gia thì phải tìm cách giảm hại.
  loai: phat-hien
  nguon:
  - apa2017
  trich: provide a prompt opportunity for participants to obtain appropriate information about the nature, results, and conclusions of the research, and they take reasonable steps to correct any misconceptions | When psychologists become aware that research procedures have harmed a participant, they take reasonable steps to minimize the harm.
  vi_tri: APA 8.08(a), (c)
  ket_qua: dung
  ghi_chu: Mục mới.
- id: e39
  cau: 'Dấu hiệu làm đúng: người tham gia được giải thích trước về quy trình, rủi ro, lợi ích và quyền rút lui; dấu hiệu cảnh báo: người tham gia không biết mình đang trong nghiên cứu hay không biết điều gì sẽ xảy ra.'
  loai: loi-khuyen
  nguon:
  - belmont1979
  - apa2017
  trich: a statement offering the subject the opportunity to ask questions and to withdraw at any time from the research | psychologists inform participants about (1) the purpose of the research, expected duration, and procedures
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23195; APA 8.02(a)
  ket_qua: dung
  ghi_chu: Suy luận của site từ e17, e21.
- id: e40
  cau: 'Dấu hiệu làm đúng: có hội đồng (IRB) duyệt kế hoạch trước khi thực hiện; dấu hiệu cảnh báo: chỉ một mình nhà nghiên cứu quyết định mọi thứ, không ai kiểm tra.'
  loai: loi-khuyen
  nguon:
  - helsinki2024
  - apa2017
  trich: before the research begins | obtain approval prior to conducting the research
  vi_tri: Helsinki; APA 8.01
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Có hội đồng độc lập (IRB) duyệt". Bỏ chữ "độc lập" (xem e24). Lưu ý: APA chỉ yêu cầu phê duyệt khi cơ sở đòi.'
- id: e41
  cau: 'Dấu hiệu làm đúng: việc tuyển người gắn với câu hỏi nghiên cứu, không chỉ vì họ dễ tiếp cận hay ở thế yếu; dấu hiệu cảnh báo: chọn người vì họ dễ tiếp cận, khó từ chối (học sinh, nhân viên cấp dưới, bệnh nhân).'
  loai: loi-khuyen
  nguon:
  - belmont1979
  - apa2017
  trich: selected simply because of their easy availability, their compromised position, or their manipulability, rather than for reasons directly related to the problem being studied | clients/patients, students, or subordinates
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23194; APA 8.04(a)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "không lợi dụng nhóm yếu thế". Lý do: "lợi dụng" mạnh hơn chữ của Belmont.'
- id: e42
  cau: 'Dấu hiệu làm đúng: phần thưởng hợp lý, và nếu tham gia là yêu cầu của môn học thì có lựa chọn thay thế tương đương; dấu hiệu cảnh báo: phần thưởng quá mức, hoặc gắn với điểm số, công việc mà không có lựa chọn thay thế.'
  loai: loi-khuyen
  nguon:
  - belmont1979
  - apa2017
  trich: an offer of an excessive, unwarranted, inappropriate or improper reward | the prospective participant is given the choice of equitable alternative activities
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23195; APA 8.04(b)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Phần thưởng hợp lý, không biến "tình nguyện" thành ép buộc trá hình." và "Phần thưởng lớn đến mức khó từ chối, hoặc gắn với điểm số, công việc." Chữ mới theo Belmont và APA 8.04. Lý do: bỏ "ép buộc trá hình" và "khó từ chối" (cách nói của site).'
- id: e43
  cau: 'Dấu hiệu làm đúng: rủi ro được đánh giá trước và giảm đến mức tối thiểu có thể; dấu hiệu cảnh báo: không thấy ai đánh giá rủi ro, hoặc rủi ro rõ ràng mà vẫn tiến hành.'
  loai: loi-khuyen
  nguon:
  - cfr45-46
  - helsinki2024
  trich: Risks to subjects are minimized | All medical research involving human participants must be preceded by careful assessment of predictable risks and burdens
  vi_tri: 46.111(a)(1); Helsinki, mục Risks, Burdens, and Benefits
  ket_qua: dung
- id: e44
  cau: 'Dấu hiệu làm đúng: có bước giải thích sau nghiên cứu (debriefing) khi dùng mưu mẹo; dấu hiệu cảnh báo: người tham gia ra về mà không bao giờ được biết sự thật về những gì họ trải qua.'
  loai: loi-khuyen
  nguon:
  - apa2017
  - belmont1979
  trich: explain any deception that is an integral feature of the design and conduct of an experiment to participants as early as is feasible | an adequate plan for debriefing subjects
  vi_tri: APA 8.07(c); Belmont tr. 23195
  ket_qua: dung
- id: e45
  cau: 'Dấu hiệu cảnh báo không tự động có nghĩa nghiên cứu "xấu": Belmont ghi nhận có trường hợp nói trước đầy đủ sẽ làm hỏng giá trị khoa học của nghiên cứu.'
  loai: phat-hien
  nguon:
  - belmont1979
  trich: A special problem of consent arises where informing subjects of some pertinent aspect of the research is likely to impair the validity of the research.
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23195
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "có nghiên cứu quan trọng buộc phải giấu một phần thông tin (nói trước thì người tham gia hành xử khác)". Chữ mới theo Belmont. Lý do: "nghiên cứu quan trọng" và "hành xử khác" là cách nói của site.'
- id: e46
  cau: 'Điểm mấu chốt: mưu mẹo chỉ chấp nhận được khi thật sự cần thiết cho nghiên cứu, không che giấu rủi ro đáng kể, được phê duyệt trước (khi cơ sở yêu cầu phê duyệt), và người tham gia được giải thích sau.'
  loai: loi-khuyen
  nguon:
  - belmont1979
  - apa2017
  trich: incomplete disclosure is truly necessary | there are no undisclosed risks to subjects that are more than minimal | When institutional approval is required, psychologists ... obtain approval prior
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23195; APA 8.01, 8.07
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "mưu mẹo phải được một hội đồng độc lập cho phép trước, ở mức tối thiểu cần thiết, và phải được giải thích sau." Chữ mới theo Belmont và APA; bỏ "hội đồng độc lập", "mức tối thiểu cần thiết" (không phải chữ nguồn).'
- id: e47
  cau: Các trang /psyche/thi-nghiem/milgram/ và /psyche/thi-nghiem/asch/ có trong site.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm: src/data/trang.yml có thi-nghiem/milgram và thi-nghiem/asch; hai trang có trong src/content/docs/thi-nghiem/.'
- id: e48
  cau: Đồng thuận có thông tin, đánh giá rủi ro và lợi ích, chọn người tham gia công bằng và xét duyệt độc lập trước khi nghiên cứu là các chuẩn đạo đức được các văn bản chính thức nêu.
  loai: nhan
  nguon:
  - belmont1979
  - apa2017
  - helsinki2024
  - cfr45-46
  trich: informed consent, risk/benefit assessment, and the selection of subjects of research | Free and informed consent is an essential component of respect for individual autonomy | Risks to subjects are minimized | The protocol must be submitted for ... approval to the concerned research ethics committee before the research begins
  vi_tri: Belmont tr. 23195; Helsinki (mục Informed Consent, Research Ethics Committees); 46.111(a); APA 8.02
  ket_qua: dung
  nhan: vung-chac
  co_so:
  - 'Belmont (1979): ba yêu cầu áp dụng: đồng thuận thông tin, đánh giá rủi ro/lợi ích, chọn người tham gia'
  - 'Helsinki (WMA, 2024): đồng thuận tự do và có thông tin; hội đồng đạo đức xem xét trước'
  - 'Bộ luật APA (2017) 8.01, 8.02: xin phê duyệt trước khi cơ sở đòi, thông báo đủ cho người tham gia'
  - '45 CFR 46.111, 46.116 (Mỹ): tiêu chí duyệt và yêu cầu đồng thuận'
  ly_do: 'Là chuẩn mực do văn bản chính thức quy định, không phải phát hiện thực nghiệm, nên xét theo mức đồng thuận của các văn bản chính thức (như nhãn của p-value đã khóa): bốn văn bản độc lập (Hoa Kỳ, quốc tế, nghề tâm lý) cùng nêu; không văn bản nào phản bác. Giới hạn: Helsinki viết cho nghiên cứu y học; hai văn bản của Mỹ; trang không nêu quy định Việt Nam (e31).'
- id: e49
  cau: Nghiên cứu dùng mưu mẹo chỉ được chấp nhận khi đáp ứng điều kiện chặt chẽ, và người tham gia phải được giải thích sau.
  loai: nhan
  nguon:
  - belmont1979
  - apa2017
  trich: incomplete disclosure is truly necessary to accomplish the goals of the research, (2) there are no undisclosed risks to subjects that are more than minimal, and (3) there is an adequate plan for debriefing | do not conduct a study involving deception unless ... explain any deception
  vi_tri: Belmont tr. 23195; APA 8.07, 8.08
  ket_qua: dung
  nhan: vung-chac
  co_so:
  - 'Belmont (1979), mục C.1: ba điều kiện cho việc không tiết lộ đầy đủ'
  - 'Bộ luật APA (2017) 8.07 và 8.08: biện minh, không dùng cho điều gây đau nặng, giải thích sau'
  ly_do: 'Chuẩn mực nghề nghiệp, không phải phát hiện thực nghiệm; hai văn bản độc lập (Belmont, APA) nêu cùng điều kiện cốt lõi (cần thiết; giải thích sau); không phản bác. Điều kiện không giống nhau từng chữ: Belmont thêm "không rủi ro ẩn hơn mức tối thiểu"; APA thêm "không dùng cho điều gây đau nặng".'
- id: e50
  cau: 'Tình huống 1 (điểm quá trình): cần xem lại tính tự nguyện; ảnh hưởng không chính đáng thường đến từ người có quyền lực và chế tài; APA 8.04 yêu cầu bảo vệ sinh viên khỏi hậu quả khi từ chối và, nếu tham gia là yêu cầu hay điểm cộng của môn học, cho lựa chọn thay thế tương đương; nếu đã có lựa chọn như vậy thì không còn vi phạm tiêu chuẩn này.'
  loai: loi-khuyen
  nguon:
  - belmont1979
  - apa2017
  trich: Unjustifiable pressures usually occur when persons in positions of authority or commanding influence—especially where possible sanctions are involved—urge a course of action for a subject. | the prospective participant is given the choice of equitable alternative activities
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23195; APA 8.04(b)
  ket_qua: da-lam-mem
  ghi_chu: 'gia-dinh. Chữ cũ: "Vi phạm tôn trọng con người (tính tự nguyện). Gắn điểm số vào việc tham gia là ảnh hưởng không chính đáng: sinh viên khó từ chối thật sự." Chữ mới: tùy vào lựa chọn thay thế. Lý do: APA 8.04(b) cho phép điểm cộng nếu có lựa chọn thay thế tương đương, nên "vi phạm" không tuyệt đối.'
- id: e51
  cau: 'Tình huống 2 (bệnh viện tâm thần, thuốc ngủ thương mại): Belmont nêu việc chọn người tham gia chỉ vì họ dễ tiếp cận, ở thế yếu hay dễ bị tác động thay vì lý do liên quan trực tiếp đến vấn đề nghiên cứu, và nói nghiên cứu không nên đặt gánh nặng lên những nhóm ít có khả năng hưởng lợi từ kết quả; cách sửa là tuyển người phù hợp với nhóm sẽ hưởng lợi, hoặc nêu lý do khoa học trực tiếp liên quan đến nhóm đó.'
  loai: loi-khuyen
  nguon:
  - belmont1979
  trich: such research should not unduly involve persons from groups unlikely to be among the beneficiaries of subsequent applications of the research | other less burdened classes of persons should be called upon first to accept these risks of research, except where the research is directly related to the specific conditions of the class involved
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23194, 23197
  ket_qua: da-lam-mem
  ghi_chu: 'gia-dinh. Chữ cũ: "Vi phạm công bằng (justice). Gánh nặng nghiên cứu dồn lên một nhóm dễ tổn thương được chọn vì "tiện", ... Cách sửa: ... hoặc có lý do khoa học rõ ràng và biện pháp bảo vệ thêm." Lý do: "vi phạm" thành "Belmont nêu"; tình huống không cho biết nghiên cứu có liên quan trực tiếp tới tình trạng của nhóm hay không.'
- id: e52
  cau: 'Tình huống 3 (tờ đồng thuận 8 trang trong 2 phút): Belmont nói trình bày vội, ít thời gian và hạn chế câu hỏi làm giảm khả năng lựa chọn có hiểu biết, và nhà nghiên cứu phải xác nhận người tham gia đã hiểu; cách sửa là giải thích bằng lời dễ hiểu, cho thời gian đọc và hỏi, kiểm tra xem người tham gia có nắm ý chính không.'
  loai: loi-khuyen
  nguon:
  - belmont1979
  trich: presenting information in a disorganized and rapid fashion, allowing too little time for consideration or curtailing opportunities for questioning, all may adversely affect a subject’s ability to make an informed choice | On occasion, it may be suitable to give some oral or written tests of comprehension.
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23195
  ket_qua: da-lam-mem
  ghi_chu: 'gia-dinh. Chữ cũ: "Vi phạm tôn trọng con người (yếu tố "hiểu được thông tin"). Ký vội một văn bản khó hiểu không phải là đồng thuận thật sự." Lý do: "vi phạm" và "không phải là đồng thuận thật sự" mạnh hơn Belmont (nói là có thể ảnh hưởng).'
- id: e53
  cau: 'Tình huống 4 (không giải thích sau nghiên cứu): APA 8.08 yêu cầu cho người tham gia cơ hội kịp thời nhận thông tin và sửa hiểu lầm, và giảm hại nếu thủ tục gây hại; việc đã được IRB duyệt không thay cho bước này; cách sửa là giải thích đầy đủ sau thí nghiệm và cho cơ hội hỏi trước khi người tham gia ra về.'
  loai: loi-khuyen
  nguon:
  - apa2017
  trich: provide a prompt opportunity for participants to obtain appropriate information about the nature, results, and conclusions of the research, and they take reasonable steps to correct any misconceptions
  vi_tri: APA 8.08(a), (c)
  ket_qua: da-sua
  ghi_chu: 'gia-dinh. Chữ cũ: "Vi phạm beneficence (và thực hành IRB). ... việc không debriefing bỏ qua trách nhiệm chăm sóc người tham gia sau nghiên cứu. Cách sửa: ... kiểm tra trạng thái người tham gia trước khi họ ra về." Chữ mới theo APA 8.08. Lý do: "vi phạm beneficence và thực hành IRB" và "kiểm tra trạng thái trước khi ra về" không có nguồn.'
- id: e54
  cau: 'Câu hỏi 1: Belmont nêu ba nguyên tắc cơ bản: tôn trọng con người, beneficence và công bằng, tương ứng với đồng thuận thông tin, đánh giá rủi ro và lợi ích, chọn người tham gia.'
  loai: phat-hien
  nguon:
  - belmont1979
  trich: the principles of respect for persons, beneficence and justice
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23193
  ket_qua: dung
  ghi_chu: Trùng e13.
- id: e55
  cau: 'Câu hỏi 2: Belmont phân tích đồng thuận thành ba yếu tố: thông tin, hiểu được thông tin và tự nguyện.'
  loai: phat-hien
  nguon:
  - belmont1979
  trich: information, comprehension and voluntariness
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23195
  ket_qua: dung
  ghi_chu: Trùng e16.
- id: e56
  cau: 'Câu hỏi 3: Belmont nêu ba điều kiện cho việc không tiết lộ đầy đủ: thật sự cần thiết cho mục tiêu nghiên cứu, không rủi ro ẩn nào hơn mức tối thiểu, và có kế hoạch giải thích sau khi thích hợp.'
  loai: phat-hien
  nguon:
  - belmont1979
  trich: (1) incomplete disclosure is truly necessary to accomplish the goals of the research, (2) there are no undisclosed risks to subjects that are more than minimal, and (3) there is an adequate plan for debriefing subjects, when appropriate
  vi_tri: 44 FR 23192–23197 (Federal Register 18/4/1979), tr. 23195
  ket_qua: dung
  ghi_chu: Trùng e33.
doi_chu:
- cu: 'Mục "Một tin tức": "Đây chính là những câu hỏi mà đạo đức nghiên cứu phải trả lời — trước khi nghiên cứu bắt đầu, không phải sau khi có chuyện xảy ra."'
  moi: '"Đây là những câu hỏi mà các văn bản về đạo đức nghiên cứu đòi hỏi phải được trả lời trước khi nghiên cứu bắt đầu: Tuyên bố Helsinki yêu cầu ... APA yêu cầu ..."'
  ly_do: Có nguồn (e2).
- cu: 'Mục "Vì sao cần có quy định đạo đức?": "Khoa học có thể mang lại lợi ích lớn, nhưng lịch sử cũng ghi nhận những nghiên cứu làm hại người tham gia: ... Bảo vệ người tham gia vì thế không thể giao hoàn toàn cho lương tâm từng nhà nghiên cứu — cần nguyên tắc chung và cơ chế kiểm tra độc lập."'
  moi: 'Viết lại theo Belmont: câu mở đầu, Tuskegee, quy tắc đạo đức thường không đủ; Helsinki: hội đồng độc lập.'
  ly_do: e3–e7.
- cu: '"Năm 1979, Ủy ban ... ban hành Báo cáo Belmont. Ủy ban được thành lập theo Đạo luật Nghiên cứu Quốc gia ... năm 1974, với nhiệm vụ xác định các nguyên tắc đạo đức nền tảng cho mọi nghiên cứu liên quan đến con người."'
  moi: '"Ngày 12/7/1974, Đạo luật ... được ký ... Một nhiệm vụ của Ủy ban là xác định các nguyên tắc đạo đức cơ bản làm nền cho nghiên cứu y sinh và hành vi với người ... Báo cáo được đăng trên Federal Register ngày 18/4/1979 để lấy ý kiến công chúng."'
  ly_do: e8, e9.
- cu: 'Bảng ba nguyên tắc: "(như trẻ em)"; "Không chỉ "tránh làm hại", mà phải chủ động tối đa hóa lợi ích và tối thiểu hóa rủi ro."; "Gánh nặng và lợi ích của nghiên cứu phải được phân chia công bằng."'
  moi: '"(như người chưa trưởng thành hay mất khả năng)"; "Belmont hiểu đây là một nghĩa vụ, với hai quy tắc: không gây hại, và tối đa hóa lợi ích ... tối thiểu hóa tác hại"; "Ai nên nhận lợi ích ... và ai nên gánh các gánh nặng"'
  ly_do: e10–e12.
- cu: '"Ba nguyên tắc đôi khi mâu thuẫn — ví dụ, bảo vệ thêm người yếu thế có thể đồng nghĩa với loại họ khỏi nghiên cứu có lợi. Vì vậy chúng dùng để định hướng xét đoán, không phải để bấm máy ra đáp án tự động."'
  moi: '"Belmont nêu ba nguyên tắc này như một khung phân tích ... Ví dụ, với tù nhân, ..."'
  ly_do: e14, e15.
- cu: 'Mục "Đồng thuận thông tin": ba yếu tố viết theo cách của site ("không phải cứ đưa tờ giấy đầy thuật ngữ là xong"; "phần thưởng lớn đến mức người ta không dám từ chối, hay điểm số gắn với việc tham gia")'
  moi: Ba yếu tố theo Belmont (thông tin, hiểu được thông tin, tự nguyện) với chữ sát văn bản; thêm đoạn APA 8.02 và 45 CFR 46.116
  ly_do: e16–e23.
- cu: 'Mục "Hội đồng đạo đức IRB": "hội đồng độc lập gồm các nhà khoa học và người ngoài ngành"; "từ chối nếu rủi ro không thể chấp nhận được"; "Giám sát tiếp ... duyệt một lần không phải là xong"; "IRB là "người gác cửa" đảm bảo ba nguyên tắc ..."'
  moi: Thành phần theo 46.107; tiêu chí duyệt theo 46.111; thẩm quyền theo 46.109(a); xem xét liên tục có điều kiện (46.109(e), (f)); Helsinki; "nhận xét của site khi đối chiếu hai văn bản"; câu về Việt Nam
  ly_do: e24–e31.
- cu: 'Mục "Soi vào Milgram và Asch": "người tham gia bị đặt vào tình huống cực kỳ căng thẳng mà không được báo trước mức độ căng thẳng đó"; "bị các "đồng bọn" gây sức ép"; "Chính những tranh luận kiểu này là một trong các lý do khiến hệ thống bảo vệ người tham gia được xây dựng."; "nghiên cứu dùng mưu mẹo như vậy phải thuyết phục được IRB: mức độ lừa dối là tối thiểu, ... ngay sau đó."'
