nhan_dinh:
- id: tk1
  cau: Tiêu đề "Năm 2024 thu nhập bình quân của người Việt tăng mạnh, đạt 5,4 triệu đồng" là của một bài đăng trên Vietstock ngày 19/5/2025.
  loai: lich-su
  nguon:
  - vietstock2025
  trich: Năm 2024 thu nhập bình quân của người Việt tăng mạnh, đạt 5,4 triệu đồng | 19/05/2025 10:30
  vi_tri: Vietstock, đầu bài
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "tiêu đề kiểu này xuất hiện trên nhiều báo". Lý do: chỉ kiểm được bài Vietstock; viết cụ thể bài đó và ngày đăng.'
- id: tk2
  cau: Cục Thống kê công bố thông cáo báo chí về kết quả Khảo sát mức sống dân cư năm 2024 ngày 16/5/2025.
  loai: lich-su
  nguon:
  - nso-thongcao
  trich: Thông cáo báo chí kết quả khảo sát mức sống dân cư năm 2024 | 16/05/2025
  vi_tri: nso.gov.vn, đầu và cuối trang
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "sau khi Cục Thống kê công bố Khảo sát mức sống dân cư năm 2024" (không ghi ngày). Thêm ngày theo trang nso.gov.vn.'
- id: tk3
  cau: Theo Cục Thống kê, thu nhập bình quân đầu người mỗi tháng theo giá hiện hành năm 2024 đạt 5,4 triệu đồng, tăng 9,1% so với năm 2023.
  loai: so-lieu
  nguon:
  - nso-thongcao
  - vietstock2025
  trich: Thu nhập bình quân 1 người 1 tháng năm 2024 theo giá hiện hành đạt 5,4 triệu đồng, tăng 9,1% so với năm 2023 | Theo Cục Thống kê, năm 2024 thu nhập bình quân đầu người/tháng theo giá hiện hành đạt 5,4 triệu đồng, tăng 9,1% so với năm 2023.
  vi_tri: Thông cáo của Cục Thống kê, mục II; Vietstock, đoạn đầu
  ket_qua: dung
  ghi_chu: 'Đã đối chiếu thông cáo (nso.gov.vn) với bài Vietstock: cùng số 5,4 triệu và 9,1%.'
- id: tk4
  cau: Nhóm 20% dân số có thu nhập cao nhất có thu nhập bình quân 11,8 triệu đồng/người/tháng; nhóm 20% dân số có thu nhập thấp nhất 1,6 triệu đồng/người/tháng; chênh nhau 7,4 lần.
  loai: so-lieu
  nguon:
  - nso-thongcao
  - vietstock2025
  trich: Nhóm hộ có thu nhập cao nhất (nhóm gồm 20% dân số có thu nhập cao nhất – nhóm 5) bình quân 1 người 1 tháng đạt 11,8 triệu đồng cao gấp 7,4 lần so với nhóm hộ có thu nhập thấp nhất (nhóm gồm 20% dân số có thu nhập thấp nhất – nhóm 1) với thu nhập bình quân chỉ đạt 1,6 triệu đồng/người/tháng.
  vi_tri: Thông cáo của Cục Thống kê, mục II
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "nhóm 20% hộ giàu nhất", "nhóm 20% nghèo nhất" (số 11,8 và 1,6 giữ nguyên). Lý do: thông cáo định nghĩa nhóm là "20% dân số", xếp theo thu nhập bình quân đầu người của hộ. Số 7,4 lần: 11,8 / 1,6 = 7,375, khớp thông cáo.'
- id: tk5
  cau: Tính từ số liệu trên, nhóm 20% dân số có thu nhập cao nhất chiếm khoảng 44% tổng thu nhập (11,8 × 20% ÷ 5,4), nhóm 20% thấp nhất khoảng 6% (1,6 × 20% ÷ 5,4).
  loai: so-lieu
  nguon:
  - nso-thongcao
  trich: Nhóm hộ có thu nhập cao nhất (nhóm gồm 20% dân số có thu nhập cao nhất – nhóm 5) bình quân 1 người 1 tháng đạt 11,8 triệu đồng | với thu nhập bình quân chỉ đạt 1,6 triệu đồng/người/tháng
  vi_tri: Thông cáo của Cục Thống kê, mục II
  ket_qua: dung
  ghi_chu: 'Suy luận từ số liệu của nguồn, có tính lại: 0,2 × 11,8 / 5,4 = 0,437; 0,2 × 1,6 / 5,4 = 0,059. Giả định mỗi nhóm đúng 20% dân số và 5,4 triệu là trung bình theo dân số; làm tròn. Câu mới so với trang cũ (thay cho câu "nhóm nhỏ người giàu đã kéo con số trung bình lên cao, che mất thực tế của hàng chục triệu người").'
- id: tk6
  cau: Tính đến 10/2026, thông cáo của Cục Thống kê và bài của Vietstock mà chúng tôi đọc đều không nêu trung vị thu nhập.
  loai: thoi-su
  nguon:
  - nso-thongcao
  - vietstock2025
  ket_qua: da-sua
  ghi_chu: 'chưa tìm thấy: ngày 30/10/2026 đã tìm "trung vị" và "median" trong toàn văn thông cáo (nso.gov.vn) và bài Vietstock đã tải: không có. Chữ cũ: "trong các bản tin, gần như không báo nào đưa trung vị ... Sự vắng mặt đó không phải ngẫu nhiên: trung bình cộng vừa dễ tính, vừa cho con số ''đẹp'' hơn để làm tiêu đề". Lý do: chỉ kiểm được hai văn bản; vế "gần như không báo nào" và lời giải thích động cơ không có nguồn nên bỏ.'
  het_han: 2027-10-30
- id: tk7
  cau: Thống kê mô tả (descriptive statistics) là việc tổ chức và tóm tắt dữ liệu, bằng biểu đồ hoặc bằng các con số.
  loai: dinh-nghia
  nguon:
  - openstax-stats-1-1
  trich: Organizing and summarizing data is called descriptive statistics. Two ways to summarize data are by graphing and by using numbers
  vi_tri: OpenStax Introductory Statistics 2e, mục 1.1
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "cách tóm tắt một dãy số dài bằng vài con số ngắn gọn, để ta nắm được ''bức tranh chung'' mà không cần đọc từng số liệu". Viết lại theo định nghĩa của giáo trình (gồm cả biểu đồ).'
- id: tk8
  cau: Ba con số tóm tắt "trung tâm" của một dãy số là trung bình, trung vị và yếu vị; trung bình và trung vị được dùng rộng rãi nhất.
  loai: dinh-nghia
  nguon:
  - openstax-stats-2-5
  trich: The two most widely used measures of the "center" of the data are the mean (average) and the median. | Another measure of the center is the mode.
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.5
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Ba con số tóm tắt phổ biến nhất là trung bình, trung vị và yếu vị." Lý do: giáo trình nói hai số được dùng rộng rãi nhất là trung bình và trung vị; yếu vị là số thứ ba.'
- id: tk9
  cau: Trung bình cộng là tổng tất cả các giá trị chia cho số lượng giá trị.
  loai: dinh-nghia
  nguon:
  - openstax-stats-2-5
  trich: To calculate the mean weight of 50 people, add the 50 weights together and divide by 50.
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.5
  ket_qua: dung
- id: tk10
  cau: Trong đời thường, người ta thường dùng từ "trung bình" (average) để chỉ trung bình cộng.
  loai: dinh-nghia
  nguon:
  - openstax-stats-2-5
  trich: The words "mean" and "average" are often used interchangeably.
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.5 (ghi chú NOTE)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đây là ''trung bình'' mà báo chí nhắc tới trong hầu hết các tin tức." Lý do: "hầu hết các tin tức" không có nguồn; nguồn chỉ nói hai từ "mean" và "average" thường dùng thay nhau và trong thực tế "average" được hiểu là trung bình cộng.'
- id: tk11
  cau: Trung bình dùng mọi giá trị trong dãy số và nhạy với giá trị cực đoan; trung vị không bị giá trị cực đoan kéo đi.
  loai: dinh-nghia
  nguon:
  - openstax-stats-2-5
  - openstax-stats-2-6
  trich: The median is generally a better measure of the center when there are extreme values or outliers because it is not affected by the precise numerical values of the outliers. | The mean is affected by outliers that do not influence the median.
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.5; OpenStax Introductory Statistics 2e, mục 2.6
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Điểm yếu chí mạng: rất nhạy với giá trị cực đoan. Một người duy nhất kiếm 1 tỉ mỗi tháng cũng đủ kéo trung bình của cả xóm lên trời." Lý do: "chí mạng" và ví dụ 1 tỉ không có nguồn; thay bằng ví dụ của giáo trình (tk12).'
- id: tk12
  cau: 'Ví dụ giáo trình: thị trấn 50 người, một người kiếm 5.000.000 USD mỗi năm và 49 người còn lại mỗi người kiếm 30.000 USD; trung bình là 129.400 USD, trung vị là 30.000 USD, và trung vị mô tả "trung tâm" tốt hơn.'
  loai: so-lieu
  nguon:
  - openstax-stats-2-5
  trich: in a small town of 50 people, one person earns $5,000,000 per year and the other 49 each earn $30,000. | = 129,400 | M = 30,000 (There are 49 people who earn $30,000 and one person who earns $5,000,000.) The median is a better measure of the "center" than the mean
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.5, Example 2.27
  ket_qua: dung
  ghi_chu: 'Đã tính lại: (5.000.000 + 49 × 30.000) / 50 = 6.470.000 / 50 = 129.400.'
- id: tk13
  cau: 'Trung vị là giá trị đứng ở chính giữa khi dãy số đã xếp theo thứ tự từ bé đến lớn: một nửa số giá trị nằm dưới nó, một nửa nằm trên nó; nếu dãy có số lượng chẵn, trung vị là trung bình của hai giá trị giữa.'
  loai: dinh-nghia
  nguon:
  - openstax-stats-2-5
  trich: To find the median weight of the 50 people, order the data and find the number that splits the data into two equal parts. | If n is an even number, the median is equal to the two middle values added together and divided by two after the data has been ordered.
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.5
  ket_qua: dung
- id: tk14
  cau: Nếu người kiếm nhiều nhất kiếm thêm nữa, trung vị vẫn không đổi.
  loai: dinh-nghia
  nguon:
  - openstax-stats-2-5
  trich: The median is generally a better measure of the center when there are extreme values or outliers because it is not affected by the precise numerical values of the outliers.
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.5
  ket_qua: da-sua
  ghi_chu: 'Suy luận từ định nghĩa: trung vị chỉ phụ thuộc vị trí giữa của dãy đã xếp, nên tăng giá trị lớn nhất không đổi thứ tự. Chữ cũ: "Dù người giàu nhất xóm kiếm thêm 10 tỉ nữa, trung vị vẫn đứng yên." (số 10 tỉ bỏ vì không cần).'
- id: tk15
  cau: Yếu vị là giá trị xuất hiện nhiều lần nhất trong dãy số; một dãy số có thể có nhiều yếu vị nếu các giá trị đó cùng xuất hiện nhiều nhất.
  loai: dinh-nghia
  nguon:
  - openstax-stats-2-5
  trich: The mode is the most frequent value. There can be more than one mode in a data set as long as those values have the same frequency and that frequency is the highest.
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.5
  ket_qua: dung
- id: tk16
  cau: Yếu vị tính được cả cho dữ liệu phân loại; ví dụ trong dãy "đỏ, đỏ, đỏ, xanh lá, xanh lá, vàng", yếu vị là "đỏ".
  loai: dinh-nghia
  nguon:
  - openstax-stats-2-5
  trich: 'The mode can be calculated for qualitative data as well as for quantitative data. For example, if the data set is: red, red, red, green, green, yellow, purple, black, blue, the mode is red.'
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.5
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Nó ít được báo chí nhắc tới, nhưng rất hữu ích ... ''cỡ áo nào bán chạy nhất'', ''khung giờ nào đông khách nhất'', ''lý do nghỉ việc nào được nêu nhiều nhất''." Lý do: vế "ít được báo chí nhắc tới" không có nguồn; ví dụ thay bằng ví dụ gần với giáo trình (gia-dinh). Vế "trung bình và trung vị cần số hoặc thứ tự": suy từ định nghĩa (cộng, xếp từ bé đến lớn).'
- id: tk17
  cau: 'Dãy 6, 7, 7, 8, 8, 9, 9, 10, 11, 60: trung bình là 13,5; trung vị là 8,5; yếu vị là 7, 8 và 9; số 60 một mình kéo trung bình cao hơn thu nhập của 9 trên 10 người; một nửa dãy dưới 8,5, một nửa trên.'
  loai: so-lieu
  nguon:
  - openstax-stats-2-5
  trich: To calculate the mean weight of 50 people, add the 50 weights together and divide by 50. | If n is an even number, the median is equal to the two middle values added together and divided by two after the data has been ordered. | The mode is the most frequent value.
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.5 (cách tính)
  ket_qua: da-sua
  ghi_chu: 'gia-dinh: dãy số do site tự đặt. Đã tính lại: tổng 135, 135 / 10 = 13,5; vị trí 5 và 6 là 8 và 9, (8 + 9) / 2 = 8,5; 7, 8, 9 mỗi số hai lần; 9 giá trị đầu đều nhỏ hơn 13,5; 5 giá trị nhỏ hơn 8,5 (6, 7, 7, 8, 8). Chữ cũ: "đã một mình kéo trung bình lên 13,5 triệu — cao hơn thu nhập của 9 trên 10 người"; chỉ đổi cách ngắt câu, giữ nghĩa. Chữ cũ: "kể đúng câu chuyện của ''người ở giữa''" đổi thành "cho biết ''người ở giữa''" cho bớt đánh giá.'
- id: tk18
  cau: Hình mean-vs-median vẽ 10 cột thu nhập giả định (6, 7, 7, 8, 8, 9, 9, 10, 11, 60) với đường trung bình 13,5 và đường trung vị 8,5.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm trên src/hinh/mean-vs-median.html: chiều cao cột theo tỉ lệ 3,5 px cho mỗi triệu (6 ra 21 px, 60 ra 210 px); đường nét liền ở y = 270,2 ứng 8,5, đường nét đứt ở y = 252,8 ứng 13,5; nhãn "Trung bình: 13,5" nằm trên đường 13,5 và "Trung vị: 8,5" nằm trên đường 8,5; chú thích hình khớp tk17.'
- id: tk19
  cau: Phân phối đối xứng là phân phối mà hình bên trái và bên phải một đường thẳng đứng là ảnh phản chiếu của nhau; khi đó trung bình và trung vị xấp xỉ bằng nhau.
  loai: dinh-nghia
  nguon:
  - openstax-stats-2-6
  trich: A distribution is symmetrical if a vertical line can be drawn at some point in the histogram such that the shape to the left and the right of the vertical line are mirror images of each other. | In symmetric distributions, we expect the mean and median to be approximately equal in value.
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.6
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đối xứng: chiều cao người trưởng thành, điểm IQ." Bỏ ví dụ vì không có nguồn (chiều cao gộp hai giới không đối xứng một đỉnh).'
- id: tk20
  cau: Lệch phải là đuôi dài về phía giá trị lớn, lệch trái là đuôi dài về phía giá trị nhỏ; khi lệch phải trung bình thường lớn hơn trung vị, khi lệch trái trung bình thường nhỏ hơn trung vị.
  loai: dinh-nghia
  nguon:
  - openstax-stats-2-6
  trich: A distribution of this type is called skewed to the left because it is pulled out to the left. | when the distribution of data is skewed to the left, the mean is often less than the median. When the distribution is skewed to the right, the mean is often greater than the median.
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.6
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Lệch phải: thu nhập, giá nhà, số lượt xem video, tài sản"; "Lệch trái: tuổi thọ ở nước phát triển ..., điểm thi khi đề quá dễ"; "Với thu nhập — luôn lệch phải — trung bình hầu như luôn cao hơn trung vị, và trung vị mới là con số gần với ''người điển hình'' hơn". Lý do: các ví dụ và "luôn", "hầu như luôn" không có nguồn đã mở; giáo trình chỉ nói "thường" (often).'
- id: tk21
  cau: Đuôi lệch về phía nào, trung bình bị kéo về phía đó nhiều hơn trung vị; vì vậy khoảng cách giữa trung bình và trung vị gợi ý dữ liệu có lệch hay không.
  loai: dinh-nghia
  nguon:
  - openstax-stats-2-6
  trich: The mean and the median both reflect the skewing, but the mean reflects it more so. | This is an important connection between the shape of the distribution and the relationship of the mean and median.
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.6
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "đuôi lệch về phía nào, trung bình bị kéo về phía đó." Thêm "nhiều hơn trung vị" theo nguồn; "cho biết" ở các chỗ dùng ý này (bảng "Khi nào dùng", bảng "Cách nhận ra") đổi thành "gợi ý" vì quy tắc có ngoại lệ (tk22).'
- id: tk22
  cau: Trong phân phối lệch phải, ba con số thường xếp theo thứ tự yếu vị < trung vị < trung bình; đây là quy tắc thường đúng chứ không phải luật, và có thể sai, nhất là với dữ liệu rời rạc hay phân phối nhiều đỉnh.
  loai: phat-hien
  nguon:
  - openstax-stats-2-6
  - vonhippel2005
  trich: Of the three statistics, the mean is the largest, while the mode is the smallest. | It is not, however, true for every data set. The most common exceptions occur in sets of discrete data. | This rule fails with surprising frequency. It can fail in multimodal distributions
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.6; von Hippel 2005, tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Một chi tiết thú vị: trong phân phối lệch phải, ba con số thường xếp theo thứ tự yếu vị < trung vị < trung bình ... nhìn thứ tự này là biết ngay dữ liệu đang lệch về đâu." Lý do: "biết ngay" mạnh hơn nguồn; thêm các ngoại lệ theo giáo trình và von Hippel (chỉ đọc tóm tắt).'
- id: tk23
  cau: 'Với dữ liệu đối xứng, không có giá trị quá khác biệt, thường dùng trung bình: nó dùng mọi giá trị, và ở phân phối đối xứng trung bình và trung vị gần như bằng nhau.'
  loai: loi-khuyen
  nguon:
  - openstax-stats-2-5
  - openstax-stats-2-6
  trich: The mean is the most common measure of the center. | In symmetric distributions, we expect the mean and median to be approximately equal in value.
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.5; OpenStax Introductory Statistics 2e, mục 2.6
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "(chiều cao, nhiệt độ)", "Dùng hết thông tin, tiện tính toán". Bỏ ví dụ và "tiện tính toán" (không nguồn).'
- id: tk24
  cau: Với dữ liệu lệch hoặc có giá trị cực đoan, thường dùng trung vị vì nó không bị vài giá trị rất lớn hay rất nhỏ kéo đi.
  loai: loi-khuyen
  nguon:
  - openstax-stats-2-5
  trich: The median is generally a better measure of the center when there are extreme values or outliers because it is not affected by the precise numerical values of the outliers.
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.5
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "(thu nhập, giá nhà, thời gian chờ)", "Không bị vài giá trị khổng lồ đánh lừa". Bỏ ví dụ không có nguồn; nguồn nói "generally better".'
- id: tk25
  cau: Với dữ liệu phân loại, cần biết "cái nào phổ biến nhất" thì dùng yếu vị; trung bình của "màu sắc" là vô nghĩa.
  loai: loi-khuyen
  nguon:
  - openstax-stats-2-5
  trich: The mode can be calculated for qualitative data as well as for quantitative data.
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.5
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "(cỡ áo, màu xe)". Vế "trung bình của màu sắc là vô nghĩa": suy từ định nghĩa trung bình (cộng các giá trị). Bỏ ví dụ.'
- id: tk26
  cau: Muốn mô tả đầy đủ hơn thì nêu cả trung bình lẫn trung vị, vì khoảng cách giữa hai con số gợi ý dữ liệu có lệch hay không.
  loai: loi-khuyen
  nguon:
  - openstax-stats-2-6
  trich: This is an important connection between the shape of the distribution and the relationship of the mean and median.
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.6
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Muốn mô tả đầy đủ và trung thực nhất ... tự nó đã kể một câu chuyện". Bỏ "trung thực nhất" và ẩn dụ; "cho biết" thành "gợi ý".'
- id: tk27
  cau: Khi bài báo chỉ ghi "trung bình" mà không nói rõ, thường đó là trung bình cộng, con số nhạy với giá trị cực đoan.
  loai: loi-khuyen
  nguon:
  - openstax-stats-2-5
  trich: The words "mean" and "average" are often used interchangeably. | The median is generally a better measure of the center when there are extreme values or outliers
  vi_tri: OpenStax Introductory Statistics 2e, mục 2.5 (ghi chú NOTE về "average" và "mean")
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "mặc định hiểu là trung bình cộng, con số dễ bị bóp méo nhất". Lý do: "dễ bị bóp méo nhất" mạnh hơn nguồn; thay bằng "nhạy với giá trị cực đoan".'
- id: tk28
  cau: Nếu có vài giá trị rất lớn, trung bình bị kéo lên so với trung vị.
  loai: dinh-nghia
  nguon:
  - openstax-stats-2-6
  trich: The mean is affected by outliers that do not influence the median.
