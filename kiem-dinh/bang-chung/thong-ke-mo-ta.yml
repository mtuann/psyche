  ghi_chu: 'Chữ cũ: "khi thấy ''trung bình'' đi kèm các từ thu nhập, lương, giá nhà, tài sản — hãy mặc định nghi ngờ ... chính sự vắng mặt đó cũng là một thông tin". Lý do: bỏ "mặc định nghi ngờ" và "vắng mặt là thông tin" (không nguồn).'
