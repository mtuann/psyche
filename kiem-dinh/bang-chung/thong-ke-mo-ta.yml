  ly_do: 'Là định nghĩa và tính chất toán học, không phải phát hiện thực nghiệm; thước đo mục 4 viết cho phát hiện thực nghiệm. Xét theo đồng thuận của giáo trình: giáo trình mở có bình duyệt, các ví dụ tính lại được, và không nguồn nào phản bác. Cùng cách xử lý với trang p-value (D4-L1).'
