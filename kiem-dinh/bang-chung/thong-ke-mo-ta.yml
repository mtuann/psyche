  moi: '"để biết khi nào con số trung bình dễ gây hiểu lầm trong tin tức"'
  ly_do: Bỏ chữ "đánh lừa" (quy động cơ).
- cu: '"tiêu đề kiểu này xuất hiện trên nhiều báo sau khi Cục Thống kê công bố Khảo sát mức sống dân cư năm 2024"; "Nghe qua, nhiều người sẽ nghĩ: ''người Việt bình thường kiếm khoảng 5,4 triệu mỗi tháng''"; "nhóm 20% hộ giàu nhất"; "20% nghèo nhất"; "Vậy ''người bình thường'' kiếm 5,4 triệu hay 1,6 triệu?"; "Nó chỉ không kể câu chuyện của phần đông. Một nhóm nhỏ người giàu đã kéo con số trung bình lên cao, che mất thực tế của hàng chục triệu người"; "gần như không báo nào đưa trung vị ... Sự vắng mặt đó không phải ngẫu nhiên"'
  moi: 'Tiêu đề của Vietstock ngày 19/5/2025; "Câu hỏi là: 5,4 triệu có phải số tiền mà một người Việt ''bình thường'' kiếm được không?"; "nhóm 20% dân số"; tính 44% và 6% từ chính số liệu; "Tính đến 10/2026, cả thông cáo ... lẫn bài của Vietstock ... đều không nêu trung vị thu nhập"; dẫn thêm thông cáo của Cục Thống kê'
  ly_do: 'tk1 đến tk6: bỏ phỏng đoán về người đọc và động cơ, ghi cụ thể điều kiểm được.'
- cu: '"là cách tóm tắt một dãy số dài bằng vài con số ngắn gọn, để ta nắm được ''bức tranh chung'' mà không cần đọc từng số liệu. Ba con số tóm tắt phổ biến nhất"'
  moi: '"là việc tổ chức và tóm tắt dữ liệu, bằng biểu đồ hoặc bằng các con số. Ba con số tóm tắt ''trung tâm'' ...; trong đó trung bình và trung vị được dùng rộng rãi nhất"'
  ly_do: tk7, tk8.
- cu: '"Đây là ''trung bình'' mà báo chí nhắc tới trong hầu hết các tin tức"; "tiện cho tính toán tiếp theo"; "Điểm yếu chí mạng"; "Một người duy nhất kiếm 1 tỉ mỗi tháng cũng đủ kéo trung bình của cả xóm lên trời"'
  moi: '"Trong đời thường, người ta thường dùng từ ''trung bình'' (average) để chỉ trung bình cộng"; "Điểm yếu: nhạy với giá trị cực đoan"; ví dụ thị trấn 50 người của giáo trình OpenStax'
  ly_do: tk10 đến tk12.
- cu: '"Dù người giàu nhất xóm kiếm thêm 10 tỉ nữa, trung vị vẫn đứng yên."; "Nó ít được báo chí nhắc tới, nhưng rất hữu ích ... cỡ áo ... khung giờ ... lý do nghỉ việc"'
  moi: '"Nếu người kiếm nhiều nhất kiếm thêm nữa, trung vị vẫn đứng yên."; định nghĩa yếu vị theo giáo trình, ví dụ "đỏ, đỏ, đỏ, xanh lá, xanh lá, vàng"'
  ly_do: tk14 đến tk16.
- cu: '"đã một mình kéo trung bình lên 13,5 triệu — cao hơn thu nhập của 9 trên 10 người trong xóm. Trong khi đó trung vị 8,5 triệu kể đúng câu chuyện của ''người ở giữa''"'
  moi: '"Người kiếm nhiều nhất (60 triệu) đã một mình kéo trung bình lên 13,5 triệu, cao hơn thu nhập của 9 trên 10 người trong xóm. Trong khi đó trung vị 8,5 triệu cho biết ''người ở giữa''"'
  ly_do: 'tk17: giữ số, bỏ lời thị phạm.'
- cu: 'Mục "Phân phối lệch": "nhiều dữ liệu đời thực lệch ... thay vì cân đối như hình chuông"; ví dụ thu nhập, giá nhà, số lượt xem video, tài sản; tuổi thọ ở nước phát triển, điểm thi khi đề quá dễ; chiều cao người trưởng thành, điểm IQ; "Với thu nhập — luôn lệch phải — trung bình hầu như luôn cao hơn trung vị"; "Nhìn thứ tự này là biết ngay dữ liệu đang lệch về đâu"'
  moi: 'Mục viết lại theo giáo trình OpenStax mục 2.6: định nghĩa đối xứng, lệch phải, lệch trái; "thường lớn hơn/nhỏ hơn"; "khoảng cách ... gợi ý dữ liệu có lệch hay không"; thêm ngoại lệ của quy tắc (OpenStax, von Hippel)'
  ly_do: 'tk19 đến tk22: bỏ các ví dụ không có nguồn.'
- cu: 'Bảng "Khi nào dùng con số nào": các ví dụ trong ngoặc (chiều cao, nhiệt độ; thu nhập, giá nhà, thời gian chờ; cỡ áo, màu xe); "tiện tính toán"; "Muốn mô tả đầy đủ và trung thực nhất ... tự nó đã kể một câu chuyện"'
  moi: Bảng viết lại, cột "Nên dùng" đổi thành "Thường dùng", bỏ ví dụ, "gợi ý dữ liệu có lệch hay không"
  ly_do: tk23 đến tk26.
- cu: Bảng "Cách nhận ra" hàng 1 ("con số dễ bị bóp méo nhất"), 2 ("luôn có vài đại gia"), 3 ("giấu trung vị ... một nửa bức tranh"), 4 ("tính cả trẻ em và người không đi làm"); mẹo "mặc định nghi ngờ ... sự vắng mặt đó cũng là một thông tin"
  moi: Các hàng và mẹo viết lại theo OpenStax và định nghĩa của Cục Thống kê
  ly_do: tk27 đến tk31.
- cu: (không có)
  moi: 'Mục "Mức độ chắc chắn": khung Vững chắc "Trung bình, trung vị và yếu vị mô tả các khía cạnh khác nhau của một dãy số; trung bình nhạy với giá trị cực đoan, trung vị thì không" và khung Khá vững "Khi dữ liệu lệch phải, trung bình thường lớn hơn trung vị, và yếu vị thường nhỏ nhất"'
  ly_do: Khuôn 7 mục của đợt 4 (tk32 đến tk34).
- cu: 'Mục "Thử một lần" (cấp ##); đáp án 2: "kéo trung bình lên gấp đôi", "(có thể là nhà sáng lập)", "trung vị 7,5 triệu kể đúng câu chuyện của nhân viên điển hình"'
  moi: '"### Thử một lần { #thu-mot-lan }" dưới mục mới "## Bài tập", giữ id cũ; đáp án chỉnh theo tk35, tk36; thêm "### Kiểm tra nhanh" (3 câu)'
  ly_do: Khuôn 7 mục (tk35 đến tk39).
- cu: Mục "Tự suy ngẫm"; câu 1 "Vì sao báo chí và các thông cáo báo chí thích đưa 'trung bình' hơn 'trung vị'? Ai được lợi khi độc giả chỉ nhìn thấy con số trung bình?"
  moi: '"## Thử suy ngẫm { #tu-suy-ngam }"; câu 1 "Khi một bản tin chỉ nêu trung bình thu nhập, người đọc dễ hiểu nhầm điều gì? Bạn muốn biết thêm con số nào để hiểu đúng?"'
  ly_do: Khuôn 7 mục; bỏ tiền đề quy động cơ của báo chí.
- cu: 'Mục Nguồn: chỉ bài Vietstock (qua Cục Thống kê)'
  moi: Thông cáo của Cục Thống kê, trang khái niệm của Cục Thống kê, Vietstock, OpenStax Introductory Statistics 2e, von Hippel (2005)
  ly_do: Nguồn của các nhận định mới.
