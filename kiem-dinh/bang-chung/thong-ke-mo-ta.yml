  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Thu nhập, tài sản, doanh thu: luôn có vài ''đại gia'' ở đuôi phân phối". Lý do: "luôn có vài đại gia" không có nguồn.'
- id: tk29
  cau: Nếu bài báo chỉ có trung bình, ta chưa biết dữ liệu lệch đến đâu, vì khoảng cách giữa trung bình và trung vị gợi ý mức lệch.
  loai: loi-khuyen
  nguon:
  - openstax-stats-2-6
  trich: This is an important connection between the shape of the distribution and the relationship of the mean and median.
