  - nso-ksms-trang
  trich: Thu nhập bình quân đầu người 01 tháng được tính bằng cách chia tổng thu nhập trong năm của hộ dân cư cho tổng dân số và chia cho 12 tháng. | thu nhập bình quân tháng của người lao động được cải thiện
  vi_tri: nso.gov.vn, trang khái niệm; nso.gov.vn, trang Kết quả khảo sát mức sống 2024 (bản tin thị trường lao động)
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "tính cả trẻ em và người không đi làm". "Kể cả trẻ em" suy từ "tổng dân số"; bỏ "người không đi làm" vì không được nêu riêng. Vế thứ hai chỉ cho thấy "thu nhập bình quân tháng của người lao động" là một chỉ tiêu được Cục Thống kê dùng; không nói về cách tính.'
- id: tk31
  cau: Khi bài báo chỉ nêu trung bình, nên tìm xem có nêu trung vị hay phân phối (như các nhóm 20%) không; nếu không, ta chưa thể biết con số trung bình đại diện cho "người điển hình" đến đâu.
  loai: loi-khuyen
