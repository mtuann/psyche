nhan_dinh:
  - id: m1
    cau: Bài báo năm 2010 "The weirdest people in the world?" do Joseph Henrich, Steven Heine và Ara Norenzayan, Đại học British Columbia, viết.
    loai: lich-su
    nguon:
      - henrich2010
    trich: The weirdest people in the world? Joseph Henrich Department of Psychology and Department of Economics, University of British Columbia | Steven J. Heine Department of Psychology, University of British Columbia
    vi_tri: Trang đầu; BBS (2010) 33:2/3
    ket_qua: dung
    ghi_chu: Ba tác giả và nơi công tác khớp trang đầu của bản tác giả. Năm 2010 theo nguon.yml (henrich2010) và Crossref.
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1017/S0140525X0999152X" ]
    luot_2_ghi_chu: "Henrich: Psychology và Economics, UBC. Bài đăng Behavioral and Brain Sciences 33(2-3), 2010."
  - id: m2
    cau: '"96% người được nghiên cứu trong tâm lý học đến từ các nước chỉ chiếm 12% dân số thế giới" (con số được ba nhà khoa học Đại học British Columbia nêu trong bài báo năm 2010).'
    loai: so-lieu
    nguon:
      - henrich2010
    trich: This means that 96% of psychological samples come from countries with only 12% of the world's population.
    vi_tri: mục 2.1, tr. 3
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"một khẳng định gây chấn động của ba nhà khoa học Đại học British Columbia vào năm 2010, được báo chí quốc tế đưa tin rộng rãi vào giữa năm đó\". Chữ mới: \"một con số được ba nhà khoa học ... nêu trong một bài báo năm 2010\". Lý do: không có nguồn đọc được cho \"gây chấn động\" và \"báo chí quốc tế đưa tin rộng rãi\" (xem m3); con số 96% và 12% khớp bài gốc. Câu trích dẫn là tít giả định kiểu báo. Review (Claude Opus 5.5, 30/10/2026): Trang khớp; con số 96%, 12% là của Arnett 2008 mà Henrich dẫn, đoạn dưới đã nói rõ."
    luot_2: dung
    luot_2_nguon: [ "https://www2.psych.ubc.ca/~henrich/pdfs/WeirdPeople.pdf" ]
    luot_2_ghi_chu: Toàn văn bản UBC của Henrich. Con số 96% là của Arnett 2008 mà Henrich dẫn.
    review: dung
  - id: m3
    cau: 'Khẳng định cũ: con số ấy "gây chấn động" và "được báo chí quốc tế đưa tin rộng rãi vào giữa năm 2010".'
    loai: lich-su
    ket_qua: da-bo
    ghi_chu: "Chữ cũ: \"một khẳng định gây chấn động ..., được báo chí quốc tế đưa tin rộng rãi vào giữa năm đó\". Bỏ: không mở được nguồn bậc 1 hay 2 nói mức phản ứng của báo chí hay của giới khoa học; đo mức đưa tin cần tìm báo, nguồn bậc 3. Review (Claude Opus 5.5, 30/10/2026): Bỏ là đúng: lượt 2 cũng không tìm được nguồn bậc 1–2 cho mức đưa tin; trang không còn chữ \"gây chấn động\"."
    luot_2: khong-chac
    luot_2_ghi_chu: Toàn văn bài và OpenAlex không có gì về phản ứng của báo chí. Không tìm thấy nguồn bậc 1-2 xác nhận 'gây chấn động' hay 'báo chí quốc tế đưa tin rộng rãi giữa năm 2010'. Nên bỏ hoặc thay bằng điều đo được (số lần trích dẫn) hoặc dẫn nguồn lịch sử.
    review: dung
  - id: m4
    cau: 'Theo phân tích của Arnett (2008) về các tạp chí hàng đầu của sáu chuyên ngành phụ trong tâm lý học, giai đoạn 2003–2007: 68% người tham gia đến từ Mỹ, và 96% đến từ các nước phương Tây công nghiệp hóa (Bắc Mỹ, châu Âu, Úc, Israel).'
    loai: so-lieu
    nguon:
      - henrich2010
    trich: A recent analysis of the top journals in six subdisciplines of psychology from 2003 to 2007 revealed that 68% of subjects came from the United States, and a full 96% of subjects were from Western industrialized countries, specifically those in North America and Europe, as well as Australia and Israel (Arnett 2008).
    vi_tri: mục 2.1, tr. 3
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Henrich, Heine và Norenzayan đã xem lại các tạp chí hàng đầu của sáu chuyên ngành phụ trong tâm lý học, giai đoạn 2003–2007. Kết quả: 68% ..., và toàn bộ 96% ...\". Chữ mới: Henrich, Heine và Norenzayan dẫn một phân tích của Arnett (2008); 96%, bỏ \"toàn bộ\". Lý do: bài gốc ghi rõ đây là phân tích của Arnett (2008), không phải của ba tác giả. Chưa đọc bài của Arnett (2008): số liệu ở đây là Henrich và cộng sự kể lại. Câu viết lại trong khung \"Một tin tức\" và đoạn kết quả nêu cùng nguồn. Review (Claude Opus 5.5, 30/10/2026): Henrich (bản UBC) tr. 3 nêu đúng 68%, 96%, sáu chuyên ngành phụ, 2003–2007, kèm \"(Arnett 2008)\"; trang ghi là phân tích của Arnett."
    luot_2: dung
    luot_2_nguon: [ "https://www2.psych.ubc.ca/~henrich/pdfs/WeirdPeople.pdf", "https://doi.org/10.1037/0003-066X.63.7.602" ]
    luot_2_ghi_chu: "Arnett: sáu tạp chí hàng đầu của APA; Henrich kể lại: 'six sub-disciplines', 2003-2007. Chỉ đọc tóm tắt Arnett; số từ Henrich."
    review: dung
  - id: m5
    cau: Có 73% tác giả chính của các bài báo ấy đang công tác tại các trường đại học ở Mỹ.
    loai: so-lieu
    nguon:
      - henrich2010
    trich: 73% of first authors were at American universities, and 99% were at universities in Western countries.
    vi_tri: mục 2.1, tr. 3
    ket_qua: dung
    ghi_chu: Khớp bài gốc (số 99% ở Tây phương không dùng trong trang). Cũng là số liệu của phân tích Arnett qua Henrich và cộng sự.
    luot_2: dung
    luot_2_nguon: [ "https://www2.psych.ubc.ca/~henrich/pdfs/WeirdPeople.pdf" ]
    luot_2_ghi_chu: Khớp.
  - id: m6
    cau: Các nước phương Tây công nghiệp hóa ấy chỉ chiếm khoảng 12% dân số thế giới.
    loai: so-lieu
    nguon:
      - henrich2010
    trich: This means that 96% of psychological samples come from countries with only 12% of the world's population.
    vi_tri: mục 2.1, tr. 3
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://www2.psych.ubc.ca/~henrich/pdfs/WeirdPeople.pdf" ]
    luot_2_ghi_chu: Con số 12% do Henrich nêu, không có phép tính riêng; khớp.
  - id: m7
    cau: 'WEIRD viết tắt của Western, Educated, Industrialized, Rich, Democratic: người phương Tây có học, công nghiệp hóa, giàu có, dân chủ.'
    loai: dinh-nghia
    nguon:
      - henrich2010
    trich: Western, Educated, Industrialized, Rich, and Democratic (WEIRD)
    vi_tri: Tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1017/S0140525X0999152X" ]
    luot_2_ghi_chu: WEIRD nói về xã hội, câu diễn đạt 'người' chấp nhận được.
  - id: m8
    cau: Henrich và cộng sự lập luận rằng mẫu người được nghiên cứu không chỉ hẹp mà còn là một trong những nhóm kém đại diện nhất cho loài người.
    loai: phat-hien
    nguon:
      - henrich2010
    trich: members of WEIRD societies, including young children, are among the least representative populations one could find for generalizing about humans.
    vi_tri: Tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1017/S0140525X0999152X" ]
    luot_2_ghi_chu: Khớp.
  - id: m9
    cau: Ở nhiều lĩnh vực mà Henrich và cộng sự xem xét, như nhận thức hình ảnh, cảm nhận công bằng, lý luận đạo đức và hợp tác, người thuộc xã hội WEIRD thường là ngoại lệ so với phần còn lại của loài người.
    loai: phat-hien
    nguon:
      - henrich2010
    trich: WEIRD subjects are particularly unusual compared with the rest of the species – frequent outliers. The domains reviewed include visual perception, fairness, cooperation, spatial reasoning, categorization and inferential induction, moral reasoning
    vi_tri: Tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"Ở nhiều lĩnh vực — nhận thức hình ảnh, ... — kết quả ở mẫu WEIRD thường là ngoại lệ, không phải chuẩn mực toàn nhân loại.\" Chữ mới giới hạn trong các lĩnh vực mà bài xem xét, nói về người thuộc xã hội WEIRD thay vì \"kết quả\", bỏ \"không phải chuẩn mực toàn nhân loại\". Lý do: bài chỉ xét cơ sở dữ liệu so sánh sẵn có, có hạn (tr. 5), và nói WEIRD là \"frequent outliers\", không nói mọi kết quả. Review (Claude Opus 5.5, 30/10/2026): Chữ cuối khớp trích (frequent outliers; các lĩnh vực trong danh sách của bài)."
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1017/S0140525X0999152X" ]
    luot_2_ghi_chu: Khớp. Henrich lưu ý không phải mọi hiệu ứng (ví dụ Perspective Drawing Illusion).
    review: dung
  - id: m10
    cau: 'Điểm chính của bài báo không phải là các nghiên cứu ấy làm sai, mà là phạm vi của kết luận: hỏi ai thì câu trả lời chắc chắn đúng cho những người như thế.'
    loai: phat-hien
    nguon:
      - henrich2010
    trich: there are no obvious a priori grounds for claiming that a particular behavioral phenomenon is universal based on sampling from a single subpopulation.
    vi_tri: Tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"Vấn đề không phải các nghiên cứu đó làm sai. Vấn đề là: hỏi ai, thì câu trả lời chỉ đúng cho những người như thế.\" Chữ mới: \"Điểm chính của bài báo ... hỏi ai thì câu trả lời chắc chắn đúng cho những người như thế\". Lý do: bài không nói \"chỉ đúng\" (có thể đúng ở nơi khác), mà nói chưa có cơ sở để coi hiện tượng là phổ quát; câu \"không phải các nghiên cứu làm sai\" là cách diễn giải, nên chuyển thành \"điểm chính của bài báo\". Suy luận từ tóm tắt. Review (Claude Opus 5.5, 30/10/2026): Chữ cuối đúng mức trích \"no obvious a priori grounds\"."
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1017/S0140525X0999152X" ]
    luot_2_ghi_chu: "Bài nhấn mạnh phạm vi khái quát hóa, không buộc tội làm sai: khớp."
    review: dung
  - id: m11
    cau: Mở rộng kết quả từ một nhóm hẹp ra cho cả nhân loại là bước nhảy chưa có cơ sở chắc từ trước.
    loai: phat-hien
    nguon:
      - henrich2010
    trich: there are no obvious a priori grounds for claiming that a particular behavioral phenomenon is universal based on sampling from a single subpopulation.
    vi_tri: Tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"đó là bước nhảy mà dữ liệu không hề bảo đảm\". Chữ mới sát câu của tóm tắt (\"no obvious a priori grounds\"). Review (Claude Opus 5.5, 30/10/2026): Khớp trích."
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1017/S0140525X0999152X" ]
    luot_2_ghi_chu: Khớp.
    review: dung
  - id: m12
    cau: Tổng thể (population) là nhóm người mà ta muốn kết luận về họ; mẫu (sample) là nhóm người ta thực sự đo đạc, hỏi han.
    loai: dinh-nghia
    nguon:
      - openstax-psy2e
      - openstax-stats2e
    trich: Researchers may work with (a) a large population or (b) a sample group that is a subset of the larger population. | Gathering information about an entire population often costs too much or is virtually impossible. Instead, we use a sample of the population.
    vi_tri: OpenStax Psychology 2e, mục 2.3 (chú thích hình); OpenStax Introductory Statistics 2e, mục 1.2
    ket_qua: dung
    ghi_chu: Hai ví dụ dưới định nghĩa (sinh viên một trường ở Hà Nội; khách hàng mua lần hai) là ví dụ giả định (gia-dinh); đã thêm chữ "Ví dụ giả định." vào trang và "có thể đã bỏ sót" thay cho "đã tự lọc mất".
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/introductory-statistics-2e/pages/1-2-data-sampling-and-variation-in-data-and-sampling", "https://www.openstax.org/books/psychology-2e/pages/2-2-approaches-to-research" ]
    luot_2_ghi_chu: Định nghĩa chuẩn.
  - id: m13
    cau: Hỏi thật nhiều người cùng một kiểu vẫn có thể cho kết quả lệch.
    loai: phat-hien
    nguon:
      - openstax-stats2e
      - squire1988
    trich: Biased samples that are not representative of the population give results that are inaccurate and not valid. | As a rule, the larger the sample, the smaller the sampling error.
    vi_tri: Introductory Statistics 2e, mục 1.2 (Critical Evaluation, Sampling Error); Squire 1988, tóm tắt
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"mẫu tốt không nhất thiết phải lớn — nó phải giống tổng thể ... Hỏi 50.000 người cùng một kiểu vẫn có thể kém tin cậy hơn hỏi 1.000 người được chọn cẩn thận.\" Chữ mới: \"mẫu tốt phải giống tổng thể ... Hỏi thật nhiều người cùng một kiểu vẫn có thể cho kết quả lệch.\" Lý do: so sánh 50.000 với 1.000 không có nguồn; giáo trình nói mẫu lớn hơn thì tốt hơn \"nếu có thể\" và sai số chọn mẫu giảm khi mẫu lớn (chỉ sai số ngẫu nhiên, không phải thiên lệch). Suy luận từ phân biệt sai số chọn mẫu và thiên lệch chọn mẫu. Review (Claude Opus 5.5, 30/10/2026): Khớp: OpenStax phân biệt sai số chọn mẫu (giảm khi mẫu lớn) với mẫu lệch."
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/introductory-statistics-2e/pages/1-2-data-sampling-and-variation-in-data-and-sampling", "https://doi.org/10.1017/S014555320001035X" ]
    luot_2_ghi_chu: Ví dụ Literary Digest.
    review: dung
  - id: m14
    cau: Mẫu tốt phải giống tổng thể ở những đặc điểm quan trọng.
    loai: phat-hien
    nguon:
      - openstax-stats2e
    trich: A sample should have the same characteristics as the population it is representing.
    vi_tri: mục 1.2
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/introductory-statistics-2e/pages/1-2-data-sampling-and-variation-in-data-and-sampling" ]
    luot_2_ghi_chu: Khớp.
  - id: m15
    cau: 'Chọn mẫu ngẫu nhiên: mỗi người trong tổng thể có cơ hội được chọn như nhau, như rút thăm.'
    loai: dinh-nghia
    nguon:
      - openstax-psy2e
      - openstax-stats2e
    trich: A random sample is a subset of a larger population in which every member of the population has an equal chance of being selected. | Lisa could put all 31 names in a hat, shake the hat, close her eyes, and pick out three names.
    vi_tri: OpenStax Psychology 2e, mục 2.3; Introductory Statistics 2e, mục 1.2
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/introductory-statistics-2e/pages/1-2-data-sampling-and-variation-in-data-and-sampling" ]
    luot_2_ghi_chu: Khớp.
  - id: m16
    cau: 'Chọn mẫu thuận tiện: lấy những người dễ tiếp cận nhất (sinh viên lớp mình, người qua đường, bạn bè trên mạng).'
    loai: dinh-nghia
    nguon:
      - openstax-stats2e
    trich: Convenience sampling involves using results that are readily available.
    vi_tri: mục 1.2
    ket_qua: dung
