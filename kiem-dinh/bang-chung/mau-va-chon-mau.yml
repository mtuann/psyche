  vi_tri: mục 2.3
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Sinh viên một trường đại học (thường ở thành phố lớn) khác xa giới trẻ nông thôn, người đã đi làm, người không học đại học." Lý do: "thường ở thành phố lớn", "giới trẻ nông thôn" không có nguồn; giữ điều giáo trình nói về sinh viên. Tình huống giả định (gia-dinh).'
- id: m58
  cau: 'Không đại diện cho người tiêu dùng nói chung: chỉ những người chọn bình chọn mới có mặt trong mẫu, và người theo dõi trang của hãng có thể vốn đã thích thương hiệu; đây là mẫu tự chọn, thuận tiện, có khả năng lệch về phía tích cực.'
  loai: loi-khuyen
  nguon:
  - openstax-stats2e
  trich: 'Self-selected samples: Responses only by people who choose to respond, such as call-in surveys, are often unreliable.'
  vi_tri: mục 1.2
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Người theo dõi trang ... vốn đã thích thương hiệu; người không quan tâm đã không bình chọn. Đây là mẫu tự chọn, thuận tiện, lệch về phía tích cực." Chữ mới thêm "có thể", "có khả năng". Tình huống giả định (gia-dinh).'
- id: q1
  cau: Một khảo sát thu được rất nhiều câu trả lời nhưng người trả lời được chọn theo cùng một cách lệch có thể sai nặng, vì mẫu lớn không tự sửa được thiên lệch chọn mẫu; cuộc thăm dò Literary Digest năm 1936 dự đoán sai người thắng cử, với danh sách gửi phiếu lệch và tỉ lệ trả lời khoảng 24%.
