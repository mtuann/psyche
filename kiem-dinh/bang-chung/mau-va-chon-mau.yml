    ghi_chu: "Review (Claude Opus 5.5, 30/10/2026): Nhãn Khá vững hợp mục 4 (xem ly_do). Thân khung khớp Henrich 2010 và tóm tắt Many Labs 2."
    nhan: kha-vung
    co_so:
      - 'Henrich, Heine & Norenzayan 2010: tổng quan cơ sở dữ liệu so sánh sẵn có, WEIRD thường là ngoại lệ ở nhiều lĩnh vực'
      - 'Klein và cộng sự 2018 (Many Labs 2, 28 phát hiện, 125 mẫu, 36 nước và vùng lãnh thổ): so sánh thăm dò WEIRD và ít WEIRD giải thích rất ít khác biệt'
    ly_do: "Nhiều so sánh cùng chiều (Henrich) nhưng là tổng quan chứ không phải phân tích tổng hợp; dữ liệu so sánh có hạn và nhiều hiệu ứng thiếu số liệu ngoài phương Tây; Many Labs 2 cho thấy ở các phát hiện đã kiểm tra, khác biệt do WEIRD nhỏ. Vì thế Khá vững (mục 4: còn giới hạn, kết quả khác nhau giữa các lĩnh vực), chưa đủ Vững chắc; không đến mức Đang tranh cãi vì không có bằng chứng chất lượng cao bác bỏ chiều chung. Review (Claude Opus 5.5, 30/10/2026): Giữ Khá vững. Lượt 2 đọc câu như một nguyên tắc phương pháp (mức đồng thuận cao, gần Vững chắc). Nhưng khung nói về bằng chứng cụ thể (WEIRD thường là ngoại lệ) và chính thân khung nêu giới hạn (tổng quan, Many Labs 2 thấy khác biệt WEIRD nhỏ), nên Khá vững đúng mức hơn."
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1017/S0140525X0999152X" ]
    luot_2_ghi_chu: Nguyên tắc phương pháp, đồng thuận (Henrich, giáo trình). Vững chắc về nguyên tắc.
