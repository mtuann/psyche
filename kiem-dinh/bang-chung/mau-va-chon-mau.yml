  ghi_chu: 'Chữ cũ: "làm một trong những cuộc thăm dò dư luận lớn nhất lịch sử: gửi khoảng 10 triệu phiếu bầu thử qua bưu điện và nhận về 2,4 triệu câu trả lời. Với ''mẫu'' khổng lồ ấy, tạp chí tự tin dự đoán ...". Chữ mới bỏ "một trong những ... lớn nhất", "10 triệu", "2,4 triệu", "qua bưu điện", "tự tin". Lý do: chỉ mở được tóm tắt của Lohr & Brick và Squire (toàn văn không mở được); tóm tắt chỉ nói tạp chí dự đoán sai Landon thắng, danh sách và tỉ lệ trả lời 24%. Wikipedia (bậc 3) nêu 10 triệu / 2,38 triệu nhưng không dùng làm nguồn duy nhất. Khi mở được toàn văn Squire (JSTOR, thư viện) có thể khôi phục số liệu.'
