  - id: m22
    cau: "Theo giáo trình OpenStax, phần lớn nghiên cứu ở các chuyên ngành tâm lý học trước nay dùng sinh viên đại học làm người tham gia."
    loai: phat-hien
    nguon:
      - openstax-psy2e
      - henrich2010
    trich: the vast majority of research in psychology subfields has historically involved students as research participants | 67% of the American samples (and 80% of the samples from other countries) were composed solely of undergraduates in psychology courses (Arnett 2008)
    vi_tri: OpenStax Psychology 2e, mục 2.3; Henrich và cộng sự, mục 2.1, tr. 3
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"Phần lớn nghiên cứu tâm lý học dùng mẫu thuận tiện: sinh viên đại học năm nhất cần điểm thưởng, tình nguyện viên đáp lại lời kêu gọi, người điền khảo sát online.\" Lý do: nguồn nói sinh viên là phần lớn người tham gia; nhãn \"mẫu thuận tiện\", \"năm nhất\", \"điểm thưởng\", \"tình nguyện viên\", \"khảo sát online\" không có nguồn đọc được. Số 67% và 80% là của Arnett (2008) qua Henrich (chỉ ở Journal of Personality and Social Psychology). Review (Claude Opus 5.5, 30/10/2026): Đã đọc OpenStax Psychology 2e mục 2.3: \"the vast majority of research in psychology subfields has historically involved students as research participants (Sears, 1986; Arnett, 2008)\". Câu có nguồn bậc 2 nhưng số liệu gốc (Arnett 2008) chỉ ở vài tạp chí hàng đầu, nên lượt 2 đúng là câu không ghi nguồn đọc như sự thật chung. Chữ cũ: \"Phần lớn nghiên cứu tâm lý học trước nay dùng sinh viên đại học làm người tham gia.\" Chữ mới: \"Theo giáo trình OpenStax, phần lớn nghiên cứu ở các chuyên ngành tâm lý học trước nay dùng sinh viên đại học làm người tham gia.\""
    luot_2: qua-manh
    luot_2_nguon: [ "https://www2.psych.ubc.ca/~henrich/pdfs/WeirdPeople.pdf", "https://doi.org/10.1037/0003-066X.63.7.602" ]
    luot_2_ghi_chu: "câu đúng: Trong các tạp chí hàng đầu (ví dụ Journal of Personality and Social Psychology), phần lớn mẫu là sinh viên tâm lý học (67% mẫu Mỹ, 80% mẫu ngoài Mỹ, theo Arnett 2008); các chuyên ngành khác (lâm sàng, phát triển) dùng nhiều loại mẫu hơn.; Số liệu này ở tạp chí JPSP, không phải toàn bộ tâm lý học; 'phần lớn nghiên cứu tâm lý học' nói rộng hơn bằng chứng."
    review: sai
