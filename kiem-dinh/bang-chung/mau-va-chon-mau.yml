    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Thiên lệch chọn mẫu (selection bias) xảy ra khi cách chọn mẫu khiến một số loại người có khả năng lọt vào mẫu cao hơn hẳn — và đặc điểm đó lại liên quan đến điều đang nghiên cứu.\" Lý do: giáo trình dùng tên sampling bias và không có điều kiện \"liên quan đến điều đang nghiên cứu\"; viết theo định nghĩa của giáo trình. Review (Claude Opus 5.5, 30/10/2026): Khớp định nghĩa OpenStax."
