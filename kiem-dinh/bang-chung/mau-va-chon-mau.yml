    cau: "Cách giải thích quen thuộc là người có điện thoại và ô tô khá giả hơn nên nghiêng về Landon; nhưng trong khảo sát Gallup 1937, chính nhóm này vẫn ủng hộ Roosevelt, và Lusinchi (2012) cho rằng nguyên nhân chính là người ủng hộ Landon gửi phiếu lại nhiều hơn hẳn người ủng hộ Roosevelt."
    loai: lich-su
    nguon:
      - "lusinchi2012"
      - "squire1988"
    trich: "The data presented by Squire (ibid.: 130) indicated that, as a group, 61 percent of telephone and car owners favored Roosevelt over Landon. | Landon's supporters were much more likely to return their straw ballots than Roosevelt's: nearly one-third versus only one-fifth. | the principal cause of the 1936 Literary Digest poll fiasco was most probably nonresponse bias"
    vi_tri: "Lusinchi 2012, tóm tắt; tr. 33 (số của Squire); tr. 38 (kết luận 3); tr. 46 (kết luận chung)"
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Danh sách ... năm 1936, chỉ những gia đình khá giả mới có điện thoại và ô tô, và nhóm này nghiêng về đảng Cộng hòa của Landon.\" Bỏ: không mở được nguồn bậc 1 hay 2 nói cơ chế này; Lusinchi (2012, Soc Sci Hist) đặt câu hỏi \"Were automobile and telephone owners to blame?\" (chỉ thấy nhan đề, không có tóm tắt), Squire (tóm tắt) chỉ nói mẫu và người trả lời đều lệch. Nên có nguồn toàn văn trước khi khôi phục. Review (Claude Opus 5.5, 30/10/2026): Lượt 1 bỏ câu cũ là đúng (câu cũ sai), nhưng bỏ hẳn thì trang không nói nguyên nhân mà các nghiên cứu sau tìm ra, nên đã viết lại theo câu đúng của lượt 2. Đã đọc toàn văn Lusinchi 2012 (Cambridge, bản mở): tóm tắt gọi đây là \"conventional explanation\" và nói nó sai \"because voters with telephones and cars backed Franklin D. Roosevelt\"; tr. 33 dẫn Squire 1988 tr. 130: 61% người có điện thoại và ô tô ủng hộ Roosevelt; tr. 38: người ủng hộ Landon gửi phiếu lại gần một phần ba, người ủng hộ Roosevelt chỉ một phần năm. Squire (tr. 131, theo Lusinchi kể lại) vẫn ước tính lệch mẫu 11 điểm, lệch không trả lời 7 điểm, nên trang giữ cả kết luận của Squire (m37) và ghi rõ đây là cách giải thích của Lusinchi. Chữ mới trên trang: \"Cách giải thích quen thuộc là người có điện thoại và ô tô khá giả hơn nên nghiêng về Landon. Nhưng trong khảo sát Gallup ấy, chính nhóm này vẫn ủng hộ Roosevelt. Lusinchi (2012) phân tích lại và cho rằng nguyên nhân chính là người ủng hộ Landon gửi phiếu lại nhiều hơn hẳn người ủng hộ Roosevelt.\""
    luot_2: qua-manh
    luot_2_nguon: [ "https://doi.org/10.1017/S014555320001035X" ]
    luot_2_ghi_chu: "câu đúng: Cách giải thích quen thuộc là người có điện thoại và ô tô khá giả hơn nên nghiêng về Landon; nhưng dữ liệu Gallup 1937 (Squire 1988) cho thấy ngay nhóm này vẫn ủng hộ Roosevelt (khoảng 61%), nên danh sách chỉ giải thích một phần; việc người ủng hộ Landon trả lời nhiều hơn cũng góp phần.; Câu 'chỉ gia đình khá giả mới có ... nghiêng về Landon' là 'cách giải thích quy ước', bị Squire, Cahalan và Lusinchi nghi ngờ; chủ sở hữu vẫn ủng hộ Roosevelt. Squire ước tính lệch danh sách 11 điểm, lệch không trả lời 7 điểm."
