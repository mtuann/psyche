    nhan: vung-chac
    co_so:
      - "Introductory Statistics 2e, mục 1.2: định nghĩa thiên lệch chọn mẫu và hệ quả (giáo trình mở, OpenStax)"
      - "Squire 1988 và Lohr & Brick 2017 (tóm tắt), Lusinchi 2012 (toàn văn): ví dụ lịch sử Literary Digest 1936, mẫu người trả lời lệch cho ước tính sai nặng nề"
    ly_do: "Là nguyên tắc nền của thống kê khảo sát, không phải phát hiện thực nghiệm riêng lẻ nên thước đo mục 4 (phân tích tổng hợp, tái lập) không áp dụng nguyên văn. Có định nghĩa ở giáo trình mở, có ví dụ lịch sử được hai nghiên cứu có bình duyệt phân tích; không có phản ví dụ. Chỗ khó cho review: thước đo nhãn viết cho phát hiện thực nghiệm; trang do-lon-hieu-ung dùng cùng cách (nguyên tắc thống kê gắn Vững chắc). Review (Claude Opus 5.5, 30/10/2026): Giữ Vững chắc. Nhãn cho nguyên tắc thống kê xét theo mức đồng thuận của giáo trình và tổng quan phương pháp: giáo trình mở có bình duyệt nêu thẳng (\"there can be incorrect conclusions\"), không nguồn nào phản bác; ví dụ Literary Digest được ba bài có bình duyệt phân tích, cùng kết luận ước tính lệch vì người trả lời không giống cử tri (dù còn bàn danh sách hay việc không trả lời góp phần lớn hơn). Câu nhãn đổi \"cho\" thành \"có thể cho\" theo giáo trình và theo chính trang (mẫu thuận tiện có lúc rất tốt)."
    luot_2: qua-manh
    luot_2_nguon: [ "https://openstax.org/books/introductory-statistics-2e/pages/1-2-data-sampling-and-variation-in-data-and-sampling", "https://doi.org/10.1017/S014555320001035X" ]
    luot_2_ghi_chu: "câu đúng: Mẫu lệch, không giống tổng thể ở những đặc điểm liên quan tới điều đang đo, có thể cho kết luận sai về tổng thể.; Giáo trình nói 'có thể sai'. Mẫu lệch không luôn dẫn đến kết luận sai (xem chính trang, mẫu thuận tiện); câu nhãn nên nói 'có thể'. Mức đồng thuận về nguyên tắc: cao (Vững chắc là hợp lý)."
