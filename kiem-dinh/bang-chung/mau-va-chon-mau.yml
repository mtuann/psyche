    cau: Năm 1936, tạp chí Literary Digest của Mỹ làm một cuộc thăm dò dư luận về cuộc bầu cử tổng thống, và dự đoán ứng viên Alf Landon sẽ thắng.
    loai: lich-su
    nguon:
      - lohr2017
    trich: The Literary Digest poll of 1936, which incorrectly predicted that Landon would defeat Roosevelt in the 1936 US presidential election
    vi_tri: Tóm tắt (OpenAlex)
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"làm một trong những cuộc thăm dò dư luận lớn nhất lịch sử: gửi khoảng 10 triệu phiếu bầu thử qua bưu điện và nhận về 2,4 triệu câu trả lời. Với 'mẫu' khổng lồ ấy, tạp chí tự tin dự đoán ...\". Chữ mới bỏ \"một trong những ... lớn nhất\", \"10 triệu\", \"2,4 triệu\", \"qua bưu điện\", \"tự tin\". Lý do: chỉ mở được tóm tắt của Lohr & Brick và Squire (toàn văn không mở được); tóm tắt chỉ nói tạp chí dự đoán sai Landon thắng, danh sách và tỉ lệ trả lời 24%. Wikipedia (bậc 3) nêu 10 triệu / 2,38 triệu nhưng không dùng làm nguồn duy nhất. Khi mở được toàn văn Squire (JSTOR, thư viện) có thể khôi phục số liệu. Review (Claude Opus 5.5, 30/10/2026): Chữ cuối đúng (Lusinchi 2012 tr. 26: dự đoán Landon 54%, Roosevelt 41%). Số phiếu gửi (khoảng 10 triệu) nay ở m34, nguồn Lusinchi 2012 toàn văn."
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1017/S014555320001035X", "https://doi.org/10.1086/269085" ]
    luot_2_ghi_chu: Lusinchi 2012 (Social Science History).
    review: dung
