  trich: We pursued this question by constructing an empirical review of studies involving large-scale comparative experimentation on important psychological or behavioral variables | Our examination of the representativeness of WEIRD subjects is necessarily restricted to the rather limited database currently available.
  vi_tri: mục 1, tr. 2–3 của bản tác giả
  ket_qua: dung
  ghi_chu: 'Câu trên trang: "Đây là một tổng quan, không phải phân tích tổng hợp, và mức khác biệt thay đổi theo từng hiệu ứng."; ý "mức khác biệt thay đổi" suy từ các lĩnh vực có khác biệt rất lớn (ảo ảnh) và có phần "universal" (phần 3.3 cuối: những điều không đổi giữa các nhóm).'
