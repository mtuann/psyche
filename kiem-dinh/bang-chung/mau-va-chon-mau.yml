  cau: Liên kết "Ai được hỏi thì kết quả mới đáng tin?" ở trang p-value trỏ về chính trang này; trang này có mặt trong src/data/trang.yml và trong nghien-cuu.yml là trang nhà của hồ sơ Henrich 2010.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm: src/data/trang.yml có id bang-chung/mau-va-chon-mau; src/data/nghien-cuu.yml (henrich2010) có trang_nha: bang-chung/mau-va-chon-mau.'
doi_chu:
- cu: 'Khung "Một tin tức": "một khẳng định gây chấn động của ba nhà khoa học ... được báo chí quốc tế đưa tin rộng rãi vào giữa năm đó"'
  moi: '"một con số được ba nhà khoa học Đại học British Columbia nêu trong một bài báo năm 2010"'
  ly_do: Không có nguồn cho mức phản ứng (hồ sơ m2, m3).
- cu: '"Henrich, Heine và Norenzayan đã xem lại các tạp chí hàng đầu ... toàn bộ 96% đến từ"'
  moi: '"dẫn một phân tích của Arnett (2008) ...; 96% đến từ"'
  ly_do: Phân tích là của Arnett (2008), Henrich và cộng sự dẫn lại (hồ sơ m4).
- cu: '"Ở nhiều lĩnh vực ... kết quả ở mẫu WEIRD thường là ngoại lệ, không phải chuẩn mực toàn nhân loại."'
  moi: '"Ở nhiều lĩnh vực mà các tác giả xem xét ... người thuộc xã hội WEIRD thường là ngoại lệ so với phần còn lại của loài người."'
  ly_do: Làm mềm theo tóm tắt bài gốc (m9).
- cu: '"Vấn đề không phải các nghiên cứu đó làm sai. Vấn đề là: hỏi ai, thì câu trả lời chỉ đúng cho những người như thế ... bước nhảy mà dữ liệu không hề bảo đảm."'
  moi: '"Điểm chính của bài báo không phải là ..., mà là phạm vi của kết luận: hỏi ai thì câu trả lời chắc chắn đúng cho những người như thế ... bước nhảy chưa có cơ sở chắc từ trước."'
  ly_do: Làm mềm theo tóm tắt (m10, m11).
- cu: Hai ví dụ giả định ở "Tổng thể và mẫu", câu "mẫu đã tự lọc mất nhóm bất mãn nhất"
  moi: Thêm "(Ví dụ giả định.)" cho cả hai; "mẫu có thể đã bỏ sót nhóm bất mãn nhất"
  ly_do: Chặt cách nói về ví dụ giả định (m12).
- cu: '"mẫu tốt không nhất thiết phải lớn — nó phải giống tổng thể ... Hỏi 50.000 người cùng một kiểu vẫn có thể kém tin cậy hơn hỏi 1.000 người được chọn cẩn thận."'
  moi: '"mẫu tốt phải giống tổng thể ... Hỏi thật nhiều người cùng một kiểu vẫn có thể cho kết quả lệch."'
  ly_do: So sánh 50.000 với 1.000 không có nguồn (m13).
- cu: 'Bảng ngẫu nhiên và thuận tiện: "Mẫu có xu hướng giống tổng thể nhất; sai số có thể tính được | Rẻ, nhanh, dễ làm | Tốn kém, khó thực hiện | Dễ bị lệch một cách hệ thống | Gọi điện ngẫu nhiên theo đầu số để thăm dò bầu cử"'
  moi: '"Mẫu có xu hướng giống tổng thể; sai số do chọn mẫu nhỏ dần khi mẫu lớn hơn | Dễ làm, vì dùng kết quả hay người có sẵn | Phải rút thăm từ danh sách của cả tổng thể | Có thể rất tốt ở vài trường hợp, nhưng lệch nặng ở trường hợp khác | Bỏ tên cả lớp vào mũ rồi rút ra vài người"; ví dụ "phát phiếu ở cổng trường" thêm "(ví dụ giả định)"'
  ly_do: Viết theo giáo trình OpenStax (m17–m21).
- cu: '"Phần lớn nghiên cứu tâm lý học dùng mẫu thuận tiện: sinh viên đại học năm nhất cần điểm thưởng, tình nguyện viên ..., người điền khảo sát online. Tiện — nhưng khi đó mẫu là ''sinh viên Mỹ 19 tuổi''"'
  moi: '"Phần lớn nghiên cứu tâm lý học trước nay dùng sinh viên đại học ... Sinh viên thường trẻ hơn, học vấn cao hơn và ít đa dạng hơn dân số chung ... mẫu là sinh viên"; thêm link tới OpenStax mục 2.3'
  ly_do: Giữ điều nguồn nói (m22–m24).
- cu: '"Thiên lệch chọn mẫu (selection bias) xảy ra khi ... khả năng lọt vào mẫu cao hơn hẳn — và đặc điểm đó lại liên quan đến điều đang nghiên cứu."; "Một vài dạng quen thuộc ở Việt Nam"; mẫu sống sót'
  moi: '"(sampling bias) ... ít có khả năng được chọn hơn ..., và có thể dẫn tới kết luận sai về tổng thể"; "Một vài dạng quen thuộc, kèm ví dụ giả định"; "Mẫu bỏ sót nhóm đã rời đi"; mẫu tự nguyện thêm "chỉ những người chọn trả lời", "có thể"'
  ly_do: Theo định nghĩa của giáo trình (m25–m27).
- cu: '"Hệ quả chung là khái quát hóa quá đà ... cả một ngành khoa học đã dùng kết quả từ sinh viên phương Tây để viết về ''bản chất con người''."'
  moi: '"... Henrich và cộng sự nhận xét rằng các nhà khoa học hành vi thường đưa ra kết luận rộng về tâm lý con người dựa trên mẫu chỉ từ các xã hội WEIRD."'
  ly_do: Sát câu tóm tắt (m30).
- cu: 'Mục "Bài học từ một cuộc thăm dò thảm họa": "một trong những cuộc thăm dò dư luận lớn nhất lịch sử: gửi khoảng 10 triệu phiếu ... qua bưu điện và nhận về 2,4 triệu ... một trong những chiến thắng cách biệt nhất ... năm 1936, chỉ những gia đình khá giả ... nghiêng về đảng Cộng hòa ... mẫu lớn không sửa được mẫu lệch — nó chỉ làm cho kết luận sai trở nên chắc chắn hơn."'
  moi: '"một cuộc thăm dò dư luận về cuộc bầu cử tổng thống, và dự đoán ... Landon sẽ thắng ... Roosevelt thắng với khoảng 61% ... Danh sách gửi phiếu được lập từ danh bạ điện thoại và danh sách đăng ký ô tô, và chỉ khoảng 24% người nhận phiếu trả lời. Squire (1988) ... cả cách chọn mẫu lẫn việc ai trả lời đều lệch ... Bài học: một mẫu lệch cho kết quả không chính xác ..."'
  ly_do: Chỉ mở được tóm tắt của Squire và Lohr & Brick; bỏ các số và cơ chế không có nguồn (m31–m38).
- cu: Mục "Cách nhận ra", câu 1 "và quan trọng nhất:"
  moi: '"và cả việc họ được tuyển vào nghiên cứu bằng cách nào."'
  ly_do: Không có nguồn xếp thứ tự (m40).
- cu: '"ví dụ, cơ chế nhận thức hình ảnh cơ bản ở người — thì sinh viên năm nhất cũng cho kết quả hữu ích. Vấn đề chỉ nảy sinh khi ta khái quát hóa ..."'
  moi: '"kết quả của mẫu thuận tiện có thể rất tốt trong một số trường hợp ... Nhưng Henrich và cộng sự cho thấy điều đó khó biết trước: ... ảo ảnh Müller-Lyer ... sinh viên Mỹ nằm ở đầu cực. Vấn đề nảy sinh khi ..."'
  ly_do: Ví dụ cũ trái bài gốc (m47–m49).
- cu: (không có)
  moi: 'Mục "Mức độ chắc chắn": khung Vững chắc "mẫu lệch ... cho kết luận sai về tổng thể" và khung Khá vững "kết quả từ mẫu WEIRD không thể mặc nhiên coi là đúng cho cả loài người"'
  ly_do: Khuôn 7 mục của đợt 4 (m50–m55).
- cu: 'Mục "Thử một lần" (cấp ##)'
  moi: 'Thành "### Thử một lần { #thu-mot-lan }" dưới mục mới "## Bài tập", giữ id cũ; đáp án 1 đổi "mẫu sống sót" thành "mẫu bỏ sót nhóm đã rời đi"; đáp án 2 bỏ "(thường ở thành phố lớn) khác xa giới trẻ nông thôn" thành "Sinh viên thường học vấn cao hơn dân số chung"; đáp án 3 thêm "chỉ những người chọn bình chọn mới có mặt", "có thể", "có khả năng"'
  ly_do: Khuôn 7 mục; làm mềm (m56–m58).
- cu: (không có)
  moi: Mục "### Kiểm tra nhanh" gồm khối quiz 3 câu (mỗi câu một đáp án đúng, có giải thích)
  ly_do: Khuôn 7 mục (q1–q3).
- cu: Mục "Tự suy ngẫm"
  moi: 'Đổi tên thành "Thử suy ngẫm", giữ id cũ { #tu-suy-ngam }; gợi ý câu 4 thêm "và về việc làm sao biết chắc điều đó"'
  ly_do: Khuôn 7 mục.
