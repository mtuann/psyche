nhan_dinh:
- id: m1
  cau: Bài báo năm 2010 "The weirdest people in the world?" do Joseph Henrich, Steven Heine và Ara Norenzayan, Đại học British Columbia, viết.
  loai: lich-su
  nguon:
  - henrich2010
  trich: The weirdest people in the world? Joseph Henrich Department of Psychology and Department of Economics, University of British Columbia | Steven J. Heine Department of Psychology, University of British Columbia
  vi_tri: Trang đầu; BBS (2010) 33:2/3
  ket_qua: dung
  ghi_chu: Ba tác giả và nơi công tác khớp trang đầu của bản tác giả. Năm 2010 theo nguon.yml (henrich2010) và Crossref.
- id: m2
  cau: '"96% người được nghiên cứu trong tâm lý học đến từ các nước chỉ chiếm 12% dân số thế giới" (con số được ba nhà khoa học Đại học British Columbia nêu trong bài báo năm 2010).'
  loai: so-lieu
  nguon:
  - henrich2010
  trich: This means that 96% of psychological samples come from countries with only 12% of the world's population.
  vi_tri: mục 2.1, tr. 3
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "một khẳng định gây chấn động của ba nhà khoa học Đại học British Columbia vào năm 2010, được báo chí quốc tế đưa tin rộng rãi vào giữa năm đó". Chữ mới: "một con số được ba nhà khoa học ... nêu trong một bài báo năm 2010". Lý do: không có nguồn đọc được cho "gây chấn động" và "báo chí quốc tế đưa tin rộng rãi" (xem m3); con số 96% và 12% khớp bài gốc. Câu trích dẫn là tít giả định kiểu báo.'
- id: m3
  cau: 'Khẳng định cũ: con số ấy "gây chấn động" và "được báo chí quốc tế đưa tin rộng rãi vào giữa năm 2010".'
  loai: lich-su
  ket_qua: da-bo
  ghi_chu: 'Chữ cũ: "một khẳng định gây chấn động ..., được báo chí quốc tế đưa tin rộng rãi vào giữa năm đó". Bỏ: không mở được nguồn bậc 1 hay 2 nói mức phản ứng của báo chí hay của giới khoa học; đo mức đưa tin cần tìm báo, nguồn bậc 3.'
- id: m4
  cau: 'Theo phân tích của Arnett (2008) về các tạp chí hàng đầu của sáu chuyên ngành phụ trong tâm lý học, giai đoạn 2003–2007: 68% người tham gia đến từ Mỹ, và 96% đến từ các nước phương Tây công nghiệp hóa (Bắc Mỹ, châu Âu, Úc, Israel).'
  loai: so-lieu
  nguon:
  - henrich2010
  trich: A recent analysis of the top journals in six subdisciplines of psychology from 2003 to 2007 revealed that 68% of subjects came from the United States, and a full 96% of subjects were from Western industrialized countries, specifically those in North America and Europe, as well as Australia and Israel (Arnett 2008).
  vi_tri: mục 2.1, tr. 3
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Henrich, Heine và Norenzayan đã xem lại các tạp chí hàng đầu của sáu chuyên ngành phụ trong tâm lý học, giai đoạn 2003–2007. Kết quả: 68% ..., và toàn bộ 96% ...". Chữ mới: Henrich, Heine và Norenzayan dẫn một phân tích của Arnett (2008); 96%, bỏ "toàn bộ". Lý do: bài gốc ghi rõ đây là phân tích của Arnett (2008), không phải của ba tác giả. Chưa đọc bài của Arnett (2008): số liệu ở đây là Henrich và cộng sự kể lại. Câu viết lại trong khung "Một tin tức" và đoạn kết quả nêu cùng nguồn.'
- id: m5
  cau: Có 73% tác giả chính của các bài báo ấy đang công tác tại các trường đại học ở Mỹ.
  loai: so-lieu
  nguon:
  - henrich2010
  trich: 73% of first authors were at American universities, and 99% were at universities in Western countries.
  vi_tri: mục 2.1, tr. 3
  ket_qua: dung
  ghi_chu: Khớp bài gốc (số 99% ở Tây phương không dùng trong trang). Cũng là số liệu của phân tích Arnett qua Henrich và cộng sự.
- id: m6
  cau: Các nước phương Tây công nghiệp hóa ấy chỉ chiếm khoảng 12% dân số thế giới.
  loai: so-lieu
  nguon:
  - henrich2010
  trich: This means that 96% of psychological samples come from countries with only 12% of the world's population.
  vi_tri: mục 2.1, tr. 3
  ket_qua: dung
- id: m7
  cau: 'WEIRD viết tắt của Western, Educated, Industrialized, Rich, Democratic: người phương Tây có học, công nghiệp hóa, giàu có, dân chủ.'
  loai: dinh-nghia
  nguon:
  - henrich2010
  trich: Western, Educated, Industrialized, Rich, and Democratic (WEIRD)
  vi_tri: Tóm tắt
  ket_qua: dung
- id: m8
  cau: Henrich và cộng sự lập luận rằng mẫu người được nghiên cứu không chỉ hẹp mà còn là một trong những nhóm kém đại diện nhất cho loài người.
  loai: phat-hien
  nguon:
  - henrich2010
  trich: members of WEIRD societies, including young children, are among the least representative populations one could find for generalizing about humans.
  vi_tri: Tóm tắt
  ket_qua: dung
- id: m9
  cau: Ở nhiều lĩnh vực mà Henrich và cộng sự xem xét, như nhận thức hình ảnh, cảm nhận công bằng, lý luận đạo đức và hợp tác, người thuộc xã hội WEIRD thường là ngoại lệ so với phần còn lại của loài người.
  loai: phat-hien
  nguon:
  - henrich2010
  trich: WEIRD subjects are particularly unusual compared with the rest of the species – frequent outliers. The domains reviewed include visual perception, fairness, cooperation, spatial reasoning, categorization and inferential induction, moral reasoning
  vi_tri: Tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Ở nhiều lĩnh vực — nhận thức hình ảnh, ... — kết quả ở mẫu WEIRD thường là ngoại lệ, không phải chuẩn mực toàn nhân loại." Chữ mới giới hạn trong các lĩnh vực mà bài xem xét, nói về người thuộc xã hội WEIRD thay vì "kết quả", bỏ "không phải chuẩn mực toàn nhân loại". Lý do: bài chỉ xét cơ sở dữ liệu so sánh sẵn có, có hạn (tr. 5), và nói WEIRD là "frequent outliers", không nói mọi kết quả.'
- id: m10
  cau: 'Điểm chính của bài báo không phải là các nghiên cứu ấy làm sai, mà là phạm vi của kết luận: hỏi ai thì câu trả lời chắc chắn đúng cho những người như thế.'
  loai: phat-hien
  nguon:
  - henrich2010
  trich: there are no obvious a priori grounds for claiming that a particular behavioral phenomenon is universal based on sampling from a single subpopulation.
  vi_tri: Tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Vấn đề không phải các nghiên cứu đó làm sai. Vấn đề là: hỏi ai, thì câu trả lời chỉ đúng cho những người như thế." Chữ mới: "Điểm chính của bài báo ... hỏi ai thì câu trả lời chắc chắn đúng cho những người như thế". Lý do: bài không nói "chỉ đúng" (có thể đúng ở nơi khác), mà nói chưa có cơ sở để coi hiện tượng là phổ quát; câu "không phải các nghiên cứu làm sai" là cách diễn giải, nên chuyển thành "điểm chính của bài báo". Suy luận từ tóm tắt.'
- id: m11
  cau: Mở rộng kết quả từ một nhóm hẹp ra cho cả nhân loại là bước nhảy chưa có cơ sở chắc từ trước.
  loai: phat-hien
  nguon:
  - henrich2010
  trich: there are no obvious a priori grounds for claiming that a particular behavioral phenomenon is universal based on sampling from a single subpopulation.
  vi_tri: Tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "đó là bước nhảy mà dữ liệu không hề bảo đảm". Chữ mới sát câu của tóm tắt ("no obvious a priori grounds").'
- id: m12
  cau: Tổng thể (population) là nhóm người mà ta muốn kết luận về họ; mẫu (sample) là nhóm người ta thực sự đo đạc, hỏi han.
  loai: dinh-nghia
  nguon:
  - openstax-psy2e
  - openstax-stats2e
  trich: Researchers may work with (a) a large population or (b) a sample group that is a subset of the larger population. | Gathering information about an entire population often costs too much or is virtually impossible. Instead, we use a sample of the population.
  vi_tri: OpenStax Psychology 2e, mục 2.3 (chú thích hình); OpenStax Introductory Statistics 2e, mục 1.2
  ket_qua: dung
  ghi_chu: Hai ví dụ dưới định nghĩa (sinh viên một trường ở Hà Nội; khách hàng mua lần hai) là ví dụ giả định (gia-dinh); đã thêm chữ "Ví dụ giả định." vào trang và "có thể đã bỏ sót" thay cho "đã tự lọc mất".
- id: m13
  cau: Hỏi thật nhiều người cùng một kiểu vẫn có thể cho kết quả lệch.
  loai: phat-hien
  nguon:
  - openstax-stats2e
  - squire1988
  trich: Biased samples that are not representative of the population give results that are inaccurate and not valid. | As a rule, the larger the sample, the smaller the sampling error.
  vi_tri: Introductory Statistics 2e, mục 1.2 (Critical Evaluation, Sampling Error); Squire 1988, tóm tắt
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "mẫu tốt không nhất thiết phải lớn — nó phải giống tổng thể ... Hỏi 50.000 người cùng một kiểu vẫn có thể kém tin cậy hơn hỏi 1.000 người được chọn cẩn thận." Chữ mới: "mẫu tốt phải giống tổng thể ... Hỏi thật nhiều người cùng một kiểu vẫn có thể cho kết quả lệch." Lý do: so sánh 50.000 với 1.000 không có nguồn; giáo trình nói mẫu lớn hơn thì tốt hơn "nếu có thể" và sai số chọn mẫu giảm khi mẫu lớn (chỉ sai số ngẫu nhiên, không phải thiên lệch). Suy luận từ phân biệt sai số chọn mẫu và thiên lệch chọn mẫu.'
- id: m14
  cau: Mẫu tốt phải giống tổng thể ở những đặc điểm quan trọng.
  loai: phat-hien
  nguon:
  - openstax-stats2e
  trich: A sample should have the same characteristics as the population it is representing.
  vi_tri: mục 1.2
  ket_qua: dung
- id: m15
  cau: 'Chọn mẫu ngẫu nhiên: mỗi người trong tổng thể có cơ hội được chọn như nhau, như rút thăm.'
  loai: dinh-nghia
  nguon:
  - openstax-psy2e
  - openstax-stats2e
  trich: A random sample is a subset of a larger population in which every member of the population has an equal chance of being selected. | Lisa could put all 31 names in a hat, shake the hat, close her eyes, and pick out three names.
  vi_tri: OpenStax Psychology 2e, mục 2.3; Introductory Statistics 2e, mục 1.2
  ket_qua: dung
- id: m16
  cau: 'Chọn mẫu thuận tiện: lấy những người dễ tiếp cận nhất (sinh viên lớp mình, người qua đường, bạn bè trên mạng).'
  loai: dinh-nghia
  nguon:
  - openstax-stats2e
  trich: Convenience sampling involves using results that are readily available.
  vi_tri: mục 1.2
  ket_qua: dung
  ghi_chu: Các ví dụ trong ngoặc là ví dụ giả định (gia-dinh).
- id: m17
  cau: Mẫu ngẫu nhiên có xu hướng giống tổng thể; sai số do chọn mẫu nhỏ dần khi mẫu lớn hơn.
  loai: phat-hien
  nguon:
  - openstax-psy2e
  - openstax-stats2e
  trich: Random samples are preferred because if the sample is large enough we can be reasonably sure that the participating individuals are representative of the larger population. | As a rule, the larger the sample, the smaller the sampling error.
  vi_tri: OpenStax Psychology 2e, mục 2.3; Introductory Statistics 2e, mục 1.2
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Mẫu có xu hướng giống tổng thể nhất; sai số có thể tính được". Lý do: "sai số có thể tính được" không có trong nguồn đã mở (giáo trình nói sai số chọn mẫu nhỏ dần khi mẫu lớn); bỏ "nhất" vì bài chỉ so sánh với mẫu không ngẫu nhiên.'
- id: m18
  cau: Chọn mẫu thuận tiện dễ làm, vì dùng kết quả hay người có sẵn.
  loai: phat-hien
  nguon:
  - openstax-stats2e
  trich: Convenience sampling involves using results that are readily available.
  vi_tri: mục 1.2
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Rẻ, nhanh, dễ làm". Lý do: nguồn chỉ nói "readily available"; "rẻ, nhanh" không có nguồn đọc được.'
- id: m19
  cau: Chọn mẫu ngẫu nhiên phải rút thăm từ danh sách của cả tổng thể.
  loai: phat-hien
  nguon:
  - openstax-stats2e
  trich: To choose a simple random sample of size three from the other members of her class, Lisa could put all 31 names in a hat
  vi_tri: mục 1.2
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Tốn kém, khó thực hiện". Lý do: không có nguồn đo chi phí hay độ khó; giữ điều kiện cần thấy trong ví dụ của giáo trình (phải có danh sách cả tổng thể). Suy luận từ ví dụ.'
- id: m20
  cau: Kết quả của chọn mẫu thuận tiện có thể rất tốt ở vài trường hợp, nhưng lệch nặng ở trường hợp khác.
  loai: phat-hien
  nguon:
  - openstax-stats2e
  trich: The results of convenience sampling may be very good in some cases and highly biased (favor certain outcomes) in others.
  vi_tri: mục 1.2
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Dễ bị lệch một cách hệ thống". Chữ mới sát giáo trình: có thể rất tốt hay lệch nặng tùy trường hợp.'
- id: m21
  cau: 'Ví dụ về chọn mẫu ngẫu nhiên: bỏ tên cả lớp vào mũ rồi rút ra vài người.'
  loai: dinh-nghia
  nguon:
  - openstax-stats2e
  trich: Lisa could put all 31 names in a hat, shake the hat, close her eyes, and pick out three names.
  vi_tri: mục 1.2
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Gọi điện ngẫu nhiên theo đầu số để thăm dò bầu cử". Lý do: ví dụ cũ không có nguồn, và gọi theo danh bạ điện thoại (như Literary Digest) không bảo đảm ngẫu nhiên; thay bằng ví dụ của giáo trình. Ví dụ "phát phiếu ở cổng trường" giữ, ghi "(ví dụ giả định)".'
- id: m22
  cau: Phần lớn nghiên cứu tâm lý học trước nay dùng sinh viên đại học làm người tham gia.
  loai: phat-hien
  nguon:
  - openstax-psy2e
  - henrich2010
  trich: the vast majority of research in psychology subfields has historically involved students as research participants | 67% of the American samples (and 80% of the samples from other countries) were composed solely of undergraduates in psychology courses (Arnett 2008)
  vi_tri: OpenStax Psychology 2e, mục 2.3; Henrich và cộng sự, mục 2.1, tr. 3
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Phần lớn nghiên cứu tâm lý học dùng mẫu thuận tiện: sinh viên đại học năm nhất cần điểm thưởng, tình nguyện viên đáp lại lời kêu gọi, người điền khảo sát online." Lý do: nguồn nói sinh viên là phần lớn người tham gia; nhãn "mẫu thuận tiện", "năm nhất", "điểm thưởng", "tình nguyện viên", "khảo sát online" không có nguồn đọc được. Số 67% và 80% là của Arnett (2008) qua Henrich (chỉ ở Journal of Personality and Social Psychology).'
- id: m23
  cau: Sinh viên thường trẻ hơn, học vấn cao hơn và ít đa dạng hơn dân số chung.
  loai: phat-hien
  nguon:
  - openstax-psy2e
  trich: College students tend to be younger, more educated, more liberal, and less diverse than the general population.
  vi_tri: mục 2.3
  ket_qua: dung
  ghi_chu: Giáo trình nói thêm "more liberal"; trang bỏ ý ấy.
- id: m24
  cau: Mẫu toàn sinh viên không phải "con người nói chung".
  loai: phat-hien
  nguon:
  - openstax-psy2e
  - henrich2010
  trich: relying on such a limited pool of research participants can be problematic because it is difficult to generalize findings to the larger population.
  vi_tri: OpenStax Psychology 2e, mục 2.3
  ket_qua: da-sua
