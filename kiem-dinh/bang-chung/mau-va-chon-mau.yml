  cau: Kết quả từ mẫu WEIRD không thể mặc nhiên coi là đúng cho cả loài người.
  loai: nhan
  nguon:
  - henrich2010
  - klein2018
  trich: there are no obvious a priori grounds for claiming that a particular behavioral phenomenon is universal based on sampling from a single subpopulation. | In moderation tests, very little heterogeneity was attributable to task order, administration in lab versus online, and exploratory WEIRD versus less WEIRD culture comparisons.
  vi_tri: Henrich và cộng sự, Tóm tắt; Klein và cộng sự 2018, Tóm tắt
  ket_qua: dung
  nhan: kha-vung
  co_so:
  - 'Henrich, Heine & Norenzayan 2010: tổng quan cơ sở dữ liệu so sánh sẵn có, WEIRD thường là ngoại lệ ở nhiều lĩnh vực'
  - 'Klein và cộng sự 2018 (Many Labs 2, 28 phát hiện, 125 mẫu, 36 nước và vùng lãnh thổ): so sánh thăm dò WEIRD và ít WEIRD giải thích rất ít khác biệt'
  ly_do: 'Nhiều so sánh cùng chiều (Henrich) nhưng là tổng quan chứ không phải phân tích tổng hợp; dữ liệu so sánh có hạn và nhiều hiệu ứng thiếu số liệu ngoài phương Tây; Many Labs 2 cho thấy ở các phát hiện đã kiểm tra, khác biệt do WEIRD nhỏ. Vì thế Khá vững (mục 4: còn giới hạn, kết quả khác nhau giữa các lĩnh vực), chưa đủ Vững chắc; không đến mức Đang tranh cãi vì không có bằng chứng chất lượng cao bác bỏ chiều chung.'
- id: m53
  cau: Henrich và cộng sự tổng hợp nhiều so sánh giữa các nhóm xã hội và thấy người WEIRD thường là ngoại lệ ở nhiều lĩnh vực.
  loai: phat-hien
  nguon:
  - henrich2010
  trich: our review of the comparative database from across the behavioral sciences suggests both that there is substantial variability in experimental results across populations and that WEIRD subjects are particularly unusual compared with the rest of the species
  vi_tri: Tóm tắt
  ket_qua: dung
- id: m54
  cau: Bài của Henrich và cộng sự là một tổng quan, không phải phân tích tổng hợp, và mức khác biệt thay đổi theo từng hiệu ứng.
  loai: phat-hien
  nguon:
