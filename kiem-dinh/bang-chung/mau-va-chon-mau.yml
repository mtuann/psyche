  cau: Bài báo của Henrich, Heine và Norenzayan không nói các nghiên cứu ấy làm sai; nó nói không có cơ sở chắc từ trước để coi một hiện tượng là phổ quát chỉ vì đã thấy ở một nhóm hẹp.
  loai: phat-hien
