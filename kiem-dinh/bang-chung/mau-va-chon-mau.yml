    cau: "Một khảo sát thu được rất nhiều câu trả lời nhưng người trả lời được chọn theo cùng một cách lệch có thể sai nặng, vì mẫu lớn không tự sửa được thiên lệch chọn mẫu; cuộc thăm dò Literary Digest năm 1936 gửi khoảng 10 triệu phiếu mà vẫn dự đoán sai người thắng cử: chỉ khoảng 24% người nhận trả lời, và người ủng hộ Landon gửi phiếu lại nhiều hơn hẳn."
    loai: phat-hien
    nguon:
