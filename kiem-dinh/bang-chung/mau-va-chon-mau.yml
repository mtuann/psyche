  cau: 'Không đại diện cho "giới trẻ Việt Nam": sinh viên thường học vấn cao hơn dân số chung, nên khác với người đã đi làm hay người không học đại học; mẫu chỉ nói được về sinh viên trường X.'
  loai: loi-khuyen
