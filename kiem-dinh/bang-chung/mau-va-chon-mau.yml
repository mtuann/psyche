    trich: "Biased samples that are not representative of the population give results that are inaccurate and not valid. | the survey had a 24% response rate. | Landon's supporters were much more likely to return their straw ballots than Roosevelt's: nearly one-third versus only one-fifth."
    vi_tri: Introductory Statistics 2e, mục 1.2; Lohr & Brick, tóm tắt
    ket_qua: da-sua
    ghi_chu: "Câu hỏi 1 của khối quiz. Suy luận từ phân biệt sai số chọn mẫu (giảm khi mẫu lớn) và thiên lệch chọn mẫu (không giảm vì mẫu lớn). Review (Claude Opus 5.5, 30/10/2026): Lượt 2 đúng: \"danh sách gửi phiếu lệch\" là điều còn tranh luận (Squire 1988: cả danh sách lẫn việc trả lời đều lệch; Lusinchi 2012: danh sách không phải nguyên nhân chính). Chữ cũ của lời giải thích: \"Thiên lệch chọn mẫu làm kết luận về tổng thể không chính xác. Cuộc thăm dò Literary Digest năm 1936 dự đoán sai người thắng cử, với danh sách gửi phiếu lệch và tỉ lệ trả lời khoảng 24%.\" Chữ mới: \"Mẫu lớn không tự sửa được thiên lệch chọn mẫu. Cuộc thăm dò Literary Digest năm 1936 gửi khoảng 10 triệu phiếu mà vẫn dự đoán sai người thắng cử: chỉ khoảng 24% người nhận trả lời, và người ủng hộ Landon gửi phiếu lại nhiều hơn hẳn.\" Câu hỏi vẫn đúng một đáp án +, lời giải thích không dựa vào vị trí."
    luot_2: qua-manh
    luot_2_nguon: [ "https://doi.org/10.1017/S014555320001035X", "https://openstax.org/books/introductory-statistics-2e/pages/1-2-data-sampling-and-variation-in-data-and-sampling" ]
    luot_2_ghi_chu: "câu đúng: Khảo sát thu nhiều câu trả lời nhưng chọn lệch có thể sai nặng, vì mẫu lớn không sửa thiên lệch; thăm dò Literary Digest 1936 dự đoán sai người thắng, với tỉ lệ trả lời khoảng 24% và người ủng hộ Landon trả lời nhiều hơn; các nghiên cứu sau còn tranh luận danh sách gửi phiếu góp bao nhiêu vào sai lệch.; Nguồn bất đồng về nguyên nhân: Squire cho cả danh sách lẫn không trả lời, Lusinchi 2012 cho rằng danh sách không đủ gây sai. 'Danh sách lệch' nói chắc quá."
