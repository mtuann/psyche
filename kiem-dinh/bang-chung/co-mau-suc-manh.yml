    ly_do: Câu về site (c5).
  - cu: '"cá có thật mà lưới không bắt được, tức nghiên cứu bỏ sót một hiệu ứng có thật"; "Nó chỉ trả lời câu hỏi: nếu hiệu ứng có thật, lưới của ta ..."'
    moi: '"tức nghiên cứu cho kết quả không có ý nghĩa dù hiệu ứng có thật"; "nếu hiệu ứng có thật ở một độ lớn đã giả định, ..."'
