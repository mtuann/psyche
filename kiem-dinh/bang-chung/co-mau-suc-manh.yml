  - id: c18
    cau: 'So hai nhóm độc lập bằng phép kiểm định t hai phía, mức ý nghĩa 0,05, công suất 0,8: d = 0,2 cần khoảng 394 người mỗi nhóm, d = 0,5 cần 64, d = 0,8 cần 26.'
    loai: so-lieu
    nguon:
      - cohen1992
    trich: 'The sample sizes necessary for .80 power to detect effects at these levels are tabled for eight standard statistical tests: (a) the difference between independent means'
    vi_tri: Tóm tắt (PubMed)
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Nhỏ (d = 0,2) ~400; Trung bình (d = 0,5) ~64; Lớn (d = 0,8) ~26\" và cột \"Ví dụ trực quan\" (\"Chênh lệch rất khó nhận ra bằng mắt thường\", \"có thể cảm nhận được\", \"ai cũng thấy\"). Chữ mới: 394, 64, 26 và cột công suất với 15 người mỗi nhóm. Lý do: tính lại bằng phân phối t không tâm (scipy.stats.nct, hai phía, α = 0,05): n nhỏ nhất đạt ≥ 0,8 là 394 (0,8006), 64 (0,8015), 26 (0,8075); cột \"ví dụ trực quan\" không có nguồn. Số d = 0,2, 0,5, 0,8 là mốc nổi tiếng của Cohen; tóm tắt không nêu số, Lakens (tr. 6–7) dùng d = 0,5 làm ví dụ cho mức trung bình. Định nghĩa d (chênh lệch hai trung bình chia độ lệch chuẩn) là của trang do-lon-hieu-ung đã khóa. Chỗ cho lượt 2: kiểm các số bằng công cụ khác (G*Power). Review (Claude Opus 5.5, 30/10/2026): Đúng: chữ trên trang khớp trích và vị trí đã ghi của nguồn."
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.112.1.155.pdf" ]
    luot_2_ghi_chu: "Tự tính: công suất kiểm định t hai mẫu độc lập, hai phía, α = 0,05, bằng phân phối t phi trung tâm chính xác (tích phân số theo phân phối khi bình phương, script Python tự viết, không dùng gói); kết quả trùng giá trị quen biết của G*Power. Kết quả: d = 0,2 cần 394 người mỗi nhóm (393 cho công suất 0,7996), d = 0,5 cần 64, d = 0,8 cần 26. Bảng 2 của Cohen 1992 ghi 393 cho hiệu ứng nhỏ; 'khoảng 394' vẫn đúng."
    review: dung
