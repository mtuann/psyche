    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Tính lạc quan nhất, con số này nằm trong khoảng 8–31% tùy tiểu lĩnh vực.\" Chữ mới theo tóm tắt: đây là khoảng ước tính của công suất trung vị, không phải \"tùy tiểu lĩnh vực\" và \"lạc quan nhất\". Lý do: tóm tắt không nói vậy. Review (Claude Opus 5.5, 30/10/2026): Lượt 2 đúng: tóm tắt trên Europe PMC (review đã mở) không có khoảng 8–31%, chỉ nói công suất trung bình \"very low\". Đoạn trích của lượt 1 (\"Empirically, we estimate ... between ∼8% and ∼31%\") nhiều khả năng ở khung Key points của trang nature.com, không phải tóm tắt; review không mở được trang (bị khóa). Chữ cũ: \"Tóm tắt của bài ước tính công suất trung vị ... nằm giữa khoảng 8% và 31%\". Chữ mới theo câu đúng của lượt 2: \"Phần bàn luận của bài ước tính công suất trung bình ... có lẽ không quá khoảng 8% đến 31%\"."
    luot_2: sai
