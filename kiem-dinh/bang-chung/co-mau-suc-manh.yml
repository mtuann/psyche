  - cu: 'Mục "Quy ước 0,8 của Cohen": "ông đề xuất một quy ước đã trở thành chuẩn mực cho cả ngành ... Con số 0,8 không phải định luật tự nhiên. Đó là một thỏa hiệp thực tế ... 0,8 là mức tối thiểu nên đạt, không phải mức lý tưởng. Trong những lĩnh vực mà sai lầm rất đắt giá (ví dụ thử nghiệm thuốc), người ta thường nhắm tới 0,9 hoặc cao hơn."'
    moi: 'Viết lại theo Lakens (2022) trích Cohen (1988): quy ước dùng khi không có cơ sở khác, "arbitrary but reasonable", tỉ lệ 4:1, hy vọng bị bỏ qua khi có cơ sở riêng; Lakens nói 80% thiếu lý lẽ vững; công suất 90–95% có thể phổ biến hơn.'
    ly_do: Câu cũ không có nguồn hoặc trái lời Cohen (c11–c16).
  - cu: '"Bảng dưới đây là ví dụ minh họa theo các bảng tra cứu chuẩn của Cohen"; cột "Ví dụ trực quan"; "~400"'
    moi: '"do chúng tôi tính lại"; cột "Công suất nếu chỉ có 15 người mỗi nhóm"; 394'
    ly_do: Số tính lại bằng phân phối t không tâm; bỏ cột không có nguồn (c17–c19).
  - cu: '"Mà trong tâm lý học, phần lớn hiệu ứng thật thuộc loại nhỏ đến trung bình ... Nghĩa là một nghiên cứu chỉ vài chục người thường không đủ ..."'
    moi: '"Mà trong tâm lý học xã hội, tổng hợp hơn 25.000 nghiên cứu cho thấy hiệu ứng điển hình có r khoảng 0,21 ... Với d khoảng 0,43, cần khoảng 86 người mỗi nhóm ..."; thêm đoạn cảnh báo của Lakens về mốc Cohen.'
    ly_do: Nêu số và phạm vi của nguồn (c21–c23).
  - cu: '"họ lấy 48 bài phân tích tổng hợp ... (tổng cộng 730 nghiên cứu) và tính ngược lại xem mỗi nghiên cứu có công suất bao nhiêu"; "chưa bằng một phần tư quy ước 0,8"; "Tính lạc quan nhất ... tùy tiểu lĩnh vực"; "bất thường thể tích não"; "Nghiên cứu trên động vật (thường dùng chuột): 18–31% — và nhóm tác giả còn nêu vấn đề đạo đức: rất nhiều động vật đã bị hy sinh ..."'
    moi: 49 bài tổng hợp, công suất của nghiên cứu cỡ trung vị mỗi bài; "chỉ bằng khoảng một phần tư"; "giữa khoảng 8% và 31%"; nghiên cứu cấu trúc não so sánh bệnh với đối chứng; hai bài tổng hợp trên động vật cho 18% và 31%; khía cạnh đạo đức ghi theo tóm tắt
    ly_do: Số và cách mô tả theo Nord và Button (c24–c29). "Chưa bằng một phần tư" sai (21/80 = 26%).
