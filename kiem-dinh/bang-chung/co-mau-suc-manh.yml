nhan_dinh:
  - id: c1
    cau: Ngày 17/5/2013, trang Spectrum (nay là The Transmitter) đưa tin về bài báo của Button và cộng sự trên Nature Reviews Neuroscience, nêu rằng công suất thống kê của các nghiên cứu thần kinh học chỉ vào khoảng 8% đến 31%.
    loai: lich-su
    nguon:
      - transmitter2013
      - button2013
    trich: 17 May 2013 | in most studies, the power ranges from just 8 percent to 31 percent.
    vi_tri: Bản tin của Virginia Hughes; Button và cộng sự, tóm tắt
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"phân tích 48 bài tổng hợp nghiên cứu cho thấy công suất thống kê của phần lớn nghiên cứu thần kinh học chỉ dao động từ 8% đến 31%\". Chữ mới bỏ số 48. Lý do: bản tin The Transmitter ghi 48, nhưng Nord và cộng sự (2017) và Research Digest của BPS đều ghi Button dùng 49 bài tổng hợp; hai nguồn lệch nhau nên trang không nêu số trong phần tin tức (số 49 chỉ nêu ở mục \"Power failure\", theo Nord và BPS). Review (Claude Opus 5.5, 30/10/2026): Đúng: chữ trên trang khớp trích và vị trí đã ghi của nguồn."
    luot_2: dung
    luot_2_nguon: [ "https://thetransmitter.org/spectrum/power-failure/" ]
    luot_2_ghi_chu: Trang Spectrum nay ở thetransmitter.org.
    review: dung
  - id: c2
    cau: Bản tin viết rằng ở công suất thấp như vậy, một kết quả "dương tính" chỉ đúng khoảng một nửa số lần hoặc ít hơn.
    loai: lich-su
    nguon:
      - transmitter2013
    trich: At this low power, a positive result is true only about half the time or less.
    vi_tri: Bản tin The Transmitter, đoạn nói về giá trị tiên đoán dương
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Với công suất thấp như vậy, một kết quả dương tính chỉ phản ánh hiệu ứng có thật khoảng một nửa thời gian, hoặc ít hơn.\" (viết như lời của trang). Chữ mới: ghi là lời của bản tin. Lý do: chưa đọc được toàn văn Button để kiểm trực tiếp ước tính \"một nửa\"; bản tin là nguồn bậc 3. Điều Button nói trong tóm tắt thì xem c34. Review (Claude Opus 5.5, 30/10/2026): Đúng: chữ trên trang khớp trích và vị trí đã ghi của nguồn."
    luot_2: dung
    luot_2_nguon: [ "https://thetransmitter.org/spectrum/power-failure/" ]
    luot_2_ghi_chu: Bản tin Spectrum 17/5/2013.
    review: dung
  - id: c3
    cau: 'Bài báo gốc có tên "Power failure: why small sample size undermines the reliability of neuroscience", của Button, Ioannidis, Mokrysz, Nosek, Flint, Robinson và Munafò, đăng trên Nature Reviews Neuroscience 14(5), trang 365–376, năm 2013.'
    loai: lich-su
    nguon:
      - button2013
    trich: 'Power failure: why small sample size undermines the reliability of neuroscience | Nature Reviews Neuroscience 14(5): 365-376'
    vi_tri: Siêu dữ liệu Crossref 10.1038/nrn3475 (đăng trực tuyến 10/4/2013)
    ket_qua: dung
    ghi_chu: 'Bản dịch tiêu đề "Mất điện: …" là của site (power vừa là công suất, vừa là điện).'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1038%252Fnrm2640.zip/10.1038%252Fnrn3475.pdf", "https://doi.org/10.1038/nrn3475" ]
    luot_2_ghi_chu: Toàn văn ở Internet Archive; trang cuối 376 (chân trang '376 | MAY 2013 | VOLUME 14').
  - id: c4
    cau: Tóm tắt của bài nói rằng công suất thống kê trung bình của các nghiên cứu thần kinh học rất thấp, và hệ quả gồm việc ước lượng hiệu ứng bị phóng đại và kết quả khó tái lập.
    loai: phat-hien
    nguon:
      - button2013
    trich: we show that the average statistical power of studies in the neurosciences is very low. The consequences of this include overestimates of effect size and low reproducibility of results.
    vi_tri: Tóm tắt (Europe PMC)
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"Thông điệp của nó cũng trực diện không kém: các nghiên cứu trong lĩnh vực này dùng mẫu quá nhỏ một cách có hệ thống, và điều đó khiến cả một ngành khoa học trở nên kém đáng tin.\" Chữ mới bám tóm tắt của bài. Lý do: \"một cách có hệ thống\" và \"cả một ngành kém đáng tin\" mạnh hơn tóm tắt, và Nord (2017) thấy công suất thấp không phải ở mọi nơi. Review (Claude Opus 5.5, 30/10/2026): Đúng: chữ trên trang khớp trích và vị trí đã ghi của nguồn."
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1038%252Fnrm2640.zip/10.1038%252Fnrn3475.pdf" ]
    luot_2_ghi_chu: Tóm tắt của bài.
    review: dung
  - id: c5
    cau: Bài giải thích con số 8–31% có nghĩa là gì và vì sao nó đáng để ý khi đọc tin khoa học.
    loai: ve-site
    ket_qua: dung
    ghi_chu: "Đã kiểm trên trang co-mau-suc-manh.md: mục Khái niệm giải thích công suất, mục \"Power failure\" nêu 8–31%, mục \"Cách nhận ra\" nói cách đọc tin. Review (Claude Opus 5.5, 30/10/2026): Đã kiểm trên trang: đúng."
    review: dung
  - id: c6
    cau: 'Công suất thống kê là xác suất một nghiên cứu phát hiện được hiệu ứng có thật: nếu hiệu ứng tồn tại, đó là xác suất cho kết quả có ý nghĩa thống kê.'
    loai: dinh-nghia
    nguon:
      - lakens2022
      - button2013
    trich: A true positive, determined by 1-β. A test yields a significant result when the alternative hypothesis is true. | A study with low statistical power has a reduced chance of detecting a true effect
    vi_tri: tr. 5; Button, Tóm tắt (bản preprint của tác giả, OSF)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.112.1.155.pdf" ]
    luot_2_ghi_chu: Cohen 1992 tr. 156.
  - id: c7
    cau: Sai lầm loại II (β) là trường hợp hiệu ứng có thật mà kiểm định cho kết quả không có ý nghĩa; công suất bằng 1 trừ β.
    loai: dinh-nghia
    nguon:
      - lakens2022
    trich: A false negative (or Type II error), determined by β, or 1 - power. A test yields a non-significant result, even though the alternative hypothesis is true.
    vi_tri: tr. 5 (bản preprint của tác giả, OSF)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.112.1.155.pdf" ]
    luot_2_ghi_chu: Cohen 1992 tr. 156.
  - id: c8
    cau: Công suất 0,8 nghĩa là 80% cơ hội phát hiện hiệu ứng có thật và 20% rủi ro bỏ sót.
    loai: dinh-nghia
    nguon:
      - lakens2022
    trich: the value .80 be used. This means that β is set at .20. | aim for 80% power
    vi_tri: tr. 6, 20 (bản preprint của tác giả, OSF)
    ket_qua: dung
    ghi_chu: Suy trực tiếp từ c7 (β = 1 − công suất = 0,2).
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.112.1.155.pdf" ]
    luot_2_ghi_chu: Cohen 1992 tr. 156; định nghĩa công suất như c6, c7.
  - id: c9
    cau: Cỡ mẫu càng lớn thì công suất càng cao.
    loai: phat-hien
    nguon:
      - lakens2022
    trich: Figure 1 illustrates how the statistical power increases as the number of observations (per group) increases in an independent t test with a two-sided alpha level of 0.05.
    vi_tri: tr. 6 (bản preprint của tác giả, OSF)
    ket_qua: dung
    ghi_chu: Bám phép ẩn dụ "mắt lưới càng mịn".
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.112.1.155.pdf" ]
    luot_2_ghi_chu: "Cohen 1992 tr. 156 (khi độ lớn hiệu ứng và α giữ nguyên). Tự tính: d = 0,5 cho công suất 26% với 15 người mỗi nhóm, 80% với 64."
  - id: c10
    cau: 'Công suất không nói hiệu ứng có tồn tại hay không; nó có điều kiện: nếu hiệu ứng thật có độ lớn đã giả định, nghiên cứu có bao nhiêu cơ hội phát hiện nó.'
    loai: dinh-nghia
    nguon:
      - lakens2022
    trich: conditional on the assumption of a specific effect size. They allow the inference that, assuming the true effect size is at least as large as that used in the a-priori power analysis, the maximum Type II error rate in a study is not larger than a desired value.
    vi_tri: tr. 7 (bản preprint của tác giả, OSF)
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.112.1.155.pdf" ]
    luot_2_ghi_chu: "Cohen 1992 tr. 156: công suất tính theo một độ lớn hiệu ứng giả định."
  - id: c11
    cau: Năm 1988, Jacob Cohen xuất bản cuốn Statistical Power Analysis for the Behavioral Sciences (ấn bản 2, Lawrence Erlbaum Associates), trong đó ông nêu quy ước công suất 0,8.
    loai: lich-su
    nguon:
      - lakens2022
      - cohen1988
    trich: The default use of 80% power (or a 20% Type II or β error) is based on a personal preference of Cohen (1988)
    vi_tri: tr. 20 (bản preprint của tác giả, OSF)
    ket_qua: dung
    ghi_chu: Nhà xuất bản và ấn bản theo nguon.yml (cohen1988) và danh mục của Lakens; sách in không đọc được.
    luot_2: dung
    luot_2_nguon: [ "https://online.ucpress.edu/collabra/article/8/1/33267/120491/Sample-Size-Justification", "https://api.openalex.org/works/doi:10.4324/9780203771587" ]
    luot_2_ghi_chu: Danh mục tham khảo của Lakens 2022; Lakens trích Cohen 1988 nêu quy ước 0,8. OpenAlex ghi bản in lại của Routledge 2013.
  - id: c12
    cau: 'Cohen đề nghị: khi nhà nghiên cứu không có cơ sở nào khác để đặt mức công suất mong muốn, hãy dùng 0,8, tức β = 0,2; ông gọi giá trị này là "tùy ý nhưng hợp lý".'
    loai: phat-hien
    nguon:
      - lakens2022
    trich: It is proposed here as a convention that, when the investigator has no other basis for setting the desired power value, the value .80 be used. This means that β is set at .20. This arbitrary but reasonable value is offered for several reasons
    vi_tri: tr. 20 (Lakens trích Cohen, 1988) (bản preprint của tác giả, OSF)
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"ông đề xuất một quy ước đã trở thành chuẩn mực cho cả ngành: khi thiết kế nghiên cứu, hãy nhắm tới công suất 0,8\". Chữ mới thêm điều kiện \"khi không có cơ sở nào khác\" và \"tùy ý nhưng hợp lý\". Lý do: đúng lời Cohen qua Lakens; \"chuẩn mực cho cả ngành\" không có nguồn. Review (Claude Opus 5.5, 30/10/2026): Đúng: chữ trên trang khớp trích và vị trí đã ghi của nguồn."
    luot_2: dung
    luot_2_nguon: [ "https://online.ucpress.edu/collabra/article/8/1/33267/120491/Sample-Size-Justification" ]
    luot_2_ghi_chu: Lakens 2022 trích nguyên văn Cohen 1988; chưa mở được bản in Cohen 1988 (sách, không có bản mở).
    review: dung
  - id: c13
    cau: 'Lý do chính của Cohen: mức α = 0,05 đã là quy ước ngầm, và β = 0,20 được chọn với ý rằng sai lầm loại I nghiêm trọng gấp khoảng bốn lần sai lầm loại II (0,20 chia 0,05).'
    loai: phat-hien
    nguon:
      - lakens2022
    trich: The chief among them takes into consideration the implicit convention for α of .05. The β of .20 is chosen with the idea that the general relative seriousness of these two kinds of errors is of the order of .20/.05, i.e., that Type I errors are of the order of four times as serious as Type II errors.
    vi_tri: tr. 20 (trích Cohen, 1988) (bản preprint của tác giả, OSF)
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Đó là một thỏa hiệp thực tế: công suất cao hơn đòi hỏi mẫu lớn hơn (tốn kém hơn, lâu hơn), còn công suất thấp hơn thì nghiên cứu gần như đánh bạc với tiền của người tài trợ và thời gian của người tham gia. Cohen chọn 0,8 như một điểm cân bằng hợp lý, và cộng đồng khoa học đã theo quy ước đó từ bấy giờ.\" Chữ mới: lý do Cohen tự nêu. Lý do: lập luận chi phí và \"người tài trợ\" không có nguồn, trái với lời Cohen. Review (Claude Opus 5.5, 30/10/2026): Đúng: chữ trên trang khớp trích và vị trí đã ghi của nguồn."
    luot_2: dung
    luot_2_nguon: [ "https://online.ucpress.edu/collabra/article/8/1/33267/120491/Sample-Size-Justification", "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1037%252F0022-3514.87.6.796.zip/10.1037%252F0033-2909.112.1.155.pdf" ]
    luot_2_ghi_chu: "Lakens 2022 trích Cohen 1988; Cohen 1992: 'a β:α ratio of 4:1'."
    review: dung
  - id: c14
    cau: Cohen hy vọng quy ước 0,8 sẽ bị bỏ qua mỗi khi nhà nghiên cứu có cơ sở riêng để chọn mức khác.
    loai: phat-hien
    nguon:
      - lakens2022
    trich: This .80 desired power convention is offered with the hope that it will be ignored whenever an investigator can find a basis in his substantive concerns in his specific research investigation to choose a value ad hoc.
    vi_tri: tr. 20 (trích Cohen, 1988) (bản preprint của tác giả, OSF)
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Cũng cần nói thêm: 0,8 là mức tối thiểu nên đạt, không phải mức lý tưởng.\" Chữ mới: lời Cohen. Lý do: \"tối thiểu nên đạt\" trái với đoạn Cohen: 0,8 chỉ là mặc định khi không có cơ sở khác. Review (Claude Opus 5.5, 30/10/2026): Đúng: chữ trên trang khớp trích và vị trí đã ghi của nguồn."
    luot_2: dung
    luot_2_nguon: [ "https://online.ucpress.edu/collabra/article/8/1/33267/120491/Sample-Size-Justification" ]
    luot_2_ghi_chu: Lakens 2022 trích Cohen 1988.
    review: dung
  - id: c15
    cau: Lakens (2022) viết rằng khuyến nghị mặc định 80% công suất thiếu một lý lẽ vững; điều nên rút ra từ Cohen là cần biện minh tỉ lệ sai lầm theo mức nghiêm trọng của từng loại sai lầm.
    loai: phat-hien
    nguon:
      - lakens2022
    trich: the default recommendation to aim for 80% power lacks a solid justification | What we should take away from Cohen is not that we should aim for 80% power, but that we should justify our error rates based on the relative seriousness of each error.
    vi_tri: tr. 6, 20 (bản preprint của tác giả, OSF)
    ket_qua: dung
