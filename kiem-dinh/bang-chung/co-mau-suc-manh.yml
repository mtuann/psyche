  - cu: '"phân tích 48 bài tổng hợp nghiên cứu cho thấy công suất thống kê của phần lớn nghiên cứu thần kinh học chỉ dao động từ 8% đến 31%. Với công suất thấp như vậy, một kết quả "dương tính" chỉ phản ánh hiệu ứng có thật khoảng một nửa thời gian, hoặc ít hơn."'
