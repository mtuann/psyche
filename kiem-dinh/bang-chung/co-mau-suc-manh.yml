    ghi_chu: "Review (Claude Opus 5.5, 30/10/2026): Nhãn Khá vững hợp mục 4 (nhiều phân tích cùng chiều, con số tùy giả định, Nord thấy không đồng đều); trich, vi_tri và co_so sửa theo c26 và c30 (số đính chính 0,46), không đổi nhãn hay chữ của khung."
    nhan: kha-vung
    co_so:
      - 'Button và cộng sự (2013): công suất trung bình có lẽ không quá 8–31% (trung vị chung 21%)'
      - 'Szucs & Ioannidis (2017): trung vị 0,46 cho hiệu ứng trung bình (bản đính chính 2021; bản 2017 ghi 0,44) ở tâm lý học và khoa học thần kinh nhận thức'
      - 'Nord và cộng sự (2017): tính lại ra 23%, nhưng không đồng đều (gen ứng viên 11%) và "far from a universal problem"'
    ly_do: 'Ba phân tích cùng chiều nhưng chưa phải tái lập lớn có đăng ký trước; con số phụ thuộc giả định về hiệu ứng thật và phương pháp tính (cùng một dữ liệu, Nord thấy nhiều nhóm). Vì thế Khá vững (mục 4: nhiều nghiên cứu cùng chiều nhưng còn giới hạn), không Vững chắc. Chưa đọc được toàn văn Button.'
    luot_2: dung
    luot_2_nguon: [ "https://archive.org/download/wikipedia-scholarly-sources-corpus/10.1038%252Fnrm2640.zip/10.1038%252Fnrn3475.pdf", "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5566862/fullTextXML", "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC5333800/fullTextXML" ]
    luot_2_ghi_chu: "Nội dung đúng: Button (21%), Szucs & Ioannidis (0,12/0,46/0,78 theo bản đính chính) đều dưới 0,8; Nord cho thấy con số đổi theo cách ước tính và nhóm nghiên cứu. Danh sách không ghi nhãn; nếu là Khá vững hay Vững chắc cho vế 'thấp hơn nhiều so với 0,8' thì đều có cơ sở (nhiều đánh giá cùng chiều)."
