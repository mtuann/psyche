    luot_2_ghi_chu: "câu đúng: Trong phần bàn luận (không phải tóm tắt), Button và cộng sự viết rằng công suất trung bình của các nghiên cứu thần kinh học có lẽ không quá khoảng 8% đến 31%.; Tóm tắt của Button không có khoảng 8–31%. Khoảng này ở mục Implications, và nói là công suất trung bình 'có lẽ không quá' khoảng 8–31%, gộp từ ba nhóm (8% hình ảnh não, 21% chung, 18% và 31% nghiên cứu trên động vật)."
