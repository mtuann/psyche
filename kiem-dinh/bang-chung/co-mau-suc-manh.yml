    ghi_chu: "Chữ cũ: \"Nên tin nghiên cứu B hơn. Với 200 người mỗi nhóm, công suất cao hơn nhiều, nên hiệu ứng nhỏ nhưng ổn định của nó đáng tin hơn. ... giá trị p = 0,04 sát nút 0,05 càng làm tăng nghi ngờ. Trong khoa học, một hiệu ứng nhỏ nhưng thật (B) có giá trị hơn một hiệu ứng lớn nhưng mong manh (A).\" Chữ mới: bỏ \"ổn định\", \"p sát nút làm tăng nghi ngờ\", \"có giá trị hơn\", thêm lưu ý cả hai cần tái lập. Lý do: các ý bỏ không có nguồn; công suất của B với d = 0,27 chỉ khoảng 0,76 (tính lại), nên \"công suất cao\" cũng bỏ. Review (Claude Opus 5.5, 30/10/2026): Đúng: chữ trên trang khớp trích và vị trí đã ghi của nguồn."
