    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"họ lấy 48 bài phân tích tổng hợp trong khoa học thần kinh (tổng cộng 730 nghiên cứu) và tính ngược lại xem mỗi nghiên cứu có công suất bao nhiêu\". Chữ mới: 49 bài và công suất của nghiên cứu cỡ trung vị mỗi bài. Lý do: Nord ghi N = 49 và nói Button chỉ báo công suất cho nghiên cứu cỡ trung vị của từng bài tổng hợp; BPS ghi 49 và 730; số 48 là của bản tin The Transmitter. Chưa đọc được Button toàn văn để kiểm trực tiếp (chỗ cho review). Review (Claude Opus 5.5, 30/10/2026): Đúng: chữ trên trang khớp trích và vị trí đã ghi của nguồn."
    luot_2: dung
