  - id: c46
    cau: 'Tình huống giả định ở "Thử một lần": nghiên cứu A (15 người mỗi nhóm, p = 0,04, hiệu ứng lớn) và nghiên cứu B (200 người mỗi nhóm, p = 0,008, hiệu ứng nhỏ) là nhất quán với nhau.'
