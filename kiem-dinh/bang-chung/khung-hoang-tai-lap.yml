    luot_2_ghi_chu: "Nhãn cho nguyên tắc phương pháp: đồng thuận trong tổng quan (Nosek 2022, Annual Review) và trong chính OSC, cơ chế có mô phỏng (Simmons 2011); nhưng bằng chứng về vai trò thực tế là tương quan. Câu 'có khả năng góp phần' đúng mức; nhãn hợp lý là Khá vững (Vững chắc nếu chỉ nói về cơ chế)."
