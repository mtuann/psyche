      - 'Nosek và cộng sự 2022 (tổng quan): thực hành chọn lọc làm giảm khả năng tái lập (lập luận và tương quan)'
    ly_do: "Bằng chứng chủ yếu là tương quan và lập luận; chưa có phép đo riêng mức đóng góp của từng yếu tố và OSC chỉ nêu là giải thích hợp lý. Vì thế Khá vững (mục 4: nhiều bằng chứng cùng chiều nhưng còn giới hạn), không phải Vững chắc. Review (Claude Opus 5.5, 30/10/2026): Giữ Khá vững. Lượt 2 lưu ý: cơ chế (mẫu nhỏ và thiên lệch xuất bản thổi phồng hiệu ứng) gần như đồng thuận, nhưng câu nhãn nói về vai trò thực tế của chúng trong thất bại tái lập, mà OSC chỉ gọi là \"plausible explanations\". Với vai trò thực tế, bằng chứng chủ yếu là tương quan, nên Khá vững đúng mức."
