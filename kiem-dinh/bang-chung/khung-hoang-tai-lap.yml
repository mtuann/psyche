  - id: q3
    cau: Registered Reports khác bài thông thường ở chỗ tạp chí phản biện kế hoạch nghiên cứu và nhận bài về nguyên tắc từ trước khi có kết quả; vì nhận bài dựa trên câu hỏi và phương pháp, kết quả không có hiệu ứng vẫn có thể được đăng.
    loai: dinh-nghia
    nguon:
      - nosek2022
    trich: Registered Reports is a publishing model in which authors receive in-principle acceptance of their proposed studies based on the importance of the question and the quality of the methodology before the outcomes are known
    vi_tri: Nosek và cộng sự 2022, tr. 731
    ket_qua: dung
    ghi_chu: Câu hỏi 3 của khối quiz.
    luot_2: dung
    luot_2_nguon: [ "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download", "http://web.archive.org/web/20250705011407/https://journals.sagepub.com/doi/pdf/10.1177/25152459211007467" ]
    luot_2_ghi_chu: "Scheel: 'the journal commits to publishing the final article ... regardless of whether the hypotheses are supported'."
