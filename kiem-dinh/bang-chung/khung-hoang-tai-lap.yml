  - id: q1
    cau: Trong 100 nghiên cứu gốc, 97 nghiên cứu có kết quả có ý nghĩa thống kê; ở bản làm lại, con số này là 36%; hiệu ứng trung bình còn khoảng một nửa so với bản gốc; không có nghĩa cả 100 nghiên cứu gốc bị chứng minh là sai.
    loai: so-lieu
    nguon:
      - osc2015
    trich: Ninety-seven percent of original studies had significant results. Thirty-six percent of replications had significant results | Zero. ... how many of the effects have we established are false? Zero.
    vi_tri: Tóm tắt; Conclusion, tr. 27
    ket_qua: dung
    ghi_chu: 'Câu hỏi 1 của khối quiz. Trích Conclusion: OSC nói dự án không xác lập được hiệu ứng nào là đúng hay là sai.'
    luot_2: dung
    luot_2_nguon: [ "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf" ]
  - id: q2
    cau: 'Một lần làm lại không thấy hiệu ứng: chưa thể kết luận phát hiện gốc là sai, vì làm lại không thành công chưa chắc nghĩa là bằng chứng gốc là dương tính giả; sai khác nhỏ về mẫu, bối cảnh hay quy trình cũng có thể đổi hiệu ứng.'
    loai: phat-hien
    nguon:
      - osc2015
    trich: It is also too easy to conclude that a failure to replicate a result means that the original evidence was a false positive. | unanticipated factors in the sample, setting, or procedure could still have altered the observed effect magnitudes
    vi_tri: Insights on Reproducibility, tr. 24
    ket_qua: dung
