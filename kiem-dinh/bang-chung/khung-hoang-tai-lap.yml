doi_chu:
  - cu: 'Khung "Một tin tức": tít "Hơn một nửa các phát hiện tâm lý nổi tiếng không vượt qua được bài kiểm tra lặp lại" — tin tức kiểu này phủ sóng báo chí khoa học vào tháng 8 năm 2015; "quy mô chưa từng có — hơn 270 nhà nghiên cứu — làm lại 100 nghiên cứu tâm lý đã công bố trên ba tạp chí uy tín"; "một nhóm độc lập ... cỡ mẫu lớn và thiết kế trung thực với bản gốc"'
    moi: Tít giả định "Hơn một nửa các nghiên cứu tâm lý được làm lại không cho kết quả có ý nghĩa thống kê như bản gốc"; "270 tác giả cùng làm lại 100 nghiên cứu ... đã công bố trong năm 2008 trên ba tạp chí, và công bố kết quả trên tạp chí Science tháng 8 năm 2015"; "một nhóm làm lại, dùng tài liệu gốc khi có và thiết kế được tính để có sức mạnh thống kê cao"
    ly_do: Tít cũ ("nổi tiếng", "báo chí phủ sóng") không có nguồn; số và mô tả theo bài gốc (k1–k3).
  - cu: '"chính các tác giả lại viết điều ngược lại ... cách khoa học tự sửa mình — tìm ra vấn đề bằng bằng chứng, rồi sửa bằng phương pháp tốt hơn"'
    moi: '"chính các tác giả viết rằng không nên đọc kết quả này như một thất bại của tâm lý học: dự án cho thấy khoa học đang hoạt động như nó nên làm ..."'
    ly_do: Sát lời kết của OSC (k8).
  - cu: '"Một phát hiện chỉ được coi là vững chắc khi nó sống sót qua nhiều lần tái lập độc lập ..."; "nhỏ hơn và mong manh hơn"'
    moi: '"Theo chính dự án năm 2015, một nghiên cứu đơn lẻ hầu như không bao giờ cho kết luận dứt khoát ..."; "hiệu ứng nhỏ hơn và bằng chứng yếu hơn"'
    ly_do: k10, k13.
  - cu: 'Mục "Vì sao con số lại chênh lệch": "ba nguyên nhân chính ... đều là lỗi hệ thống"; "Nhiều nghiên cứu tâm lý dùng vài chục người tham gia ..."; "thử ... cho đến khi ... Làm đủ nhiều lần thì kiểu gì cũng có lần trúng"; "Các tạp chí thích đăng ... bị từ chối hoặc chính nhà nghiên cứu cũng ngại gửi đăng"; bảng "Nguyên nhân | Hậu quả" với "nhờ đào bới dữ liệu" và "Báo chỉ đưa tin máy bay rơi"'
    moi: '"nêu ba yếu tố có thể góp phần ... cách làm và động cơ chung"; "1. Sức mạnh thống kê thấp (mẫu nhỏ) ... độ lớn hiệu ứng ... bị ước lượng cao"; "Càng làm nhiều lần, càng dễ gặp kết quả ''đẹp'' do may rủi"; "Nhà nghiên cứu có xu hướng công bố kết quả dương tính nhiều hơn ... động cơ ... ưu tiên điều mới"; bảng "Yếu tố | Hậu quả có thể"'
    ly_do: Làm mềm và có nguồn (k14–k23).
  - cu: 'Mục "Lối ra": "công khai toàn bộ kế hoạch — giả thuyết, cách tuyển người tham gia, cách phân tích ... đóng dấu thời gian ... p-hacking gần như không thể giấu được"; "định dạng bài báo ... cam kết đăng bài bất kể kết quả ... trực tiếp chữa bệnh thiên lệch xuất bản"; "Cả hai đều không phải thuốc tiên ... công khai là kẻ thù của gian lận phương pháp"'
    moi: '"xác định câu hỏi nghiên cứu và kế hoạch phân tích trước khi thấy kết quả, và công khai kế hoạch ấy ... phân biệt phân tích đã dự định từ trước với phân tích thêm vào sau"; "mô hình xuất bản ... nhận bài về nguyên tắc ... tỉ lệ kết quả không có hiệu ứng được báo cáo ... cao hơn nhiều"; "Theo Nosek và cộng sự (2022), ... chưa có nghiên cứu nào cho biết kết quả từ Registered Reports có tái lập tốt hơn trung bình hay không."'
    ly_do: Theo Nosek 2018, 2022 (k24–k28).
  - cu: '"chính việc phát hiện ra vấn đề — bằng một dự án công khai, minh bạch, được đăng trên Science — là bằng chứng khoa học đang hoạt động đúng"'
    moi: '"theo chính các tác giả, dự án này cho thấy khoa học đang hoạt động như nó nên làm ..."'
    ly_do: k31.
  - cu: 'Bảng "Dấu hiệu cảnh báo | Dấu hiệu đáng tin": "Kết quả quá đẹp, quá gọn | Kết quả có cả điểm mạnh lẫn hạn chế được thừa nhận"; câu hỏi cuối "Nếu câu trả lời là ''không ai'' ... thì hệ thống đó đang có vấn đề"'
    moi: '"Kết quả rất bất ngờ | Kết quả bất ngờ nhưng đã có nghiên cứu khác lặp lại"; cột đáng tin đổi "Dấu hiệu đáng tin hơn"; câu hỏi cuối thay bằng nhận xét của OSC về động cơ'
    ly_do: k34, k37.
