nhan_dinh:
  - id: k1
    cau: 'Open Science Collaboration: 270 tác giả cùng làm lại 100 nghiên cứu tâm lý đã công bố trong năm 2008 trên ba tạp chí.'
    loai: so-lieu
    nguon:
      - osc2015
    trich: In total, 100 replications were completed by 270 contributing authors. | We constructed a sampling frame and selection process ... sampling frame as 2008 articles of three important psychology journals
    vi_tri: Method, tr. 4 (bản của tác giả)
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"hơn 270 nhà nghiên cứu — làm lại 100 nghiên cứu tâm lý đã công bố trên ba tạp chí uy tín\"; \"quy mô chưa từng có\". Chữ mới: \"270 tác giả\"; \"đã công bố trong năm 2008 trên ba tạp chí\" (Psychological Science, JPSP, JEP:LMC). Lý do: bài ghi 270 contributing authors (không \"hơn\"); \"uy tín\" và \"chưa từng có\" không có nguồn đo; bài chỉ tự nhận là \"the first open, systematic evidence\" (tr. 25). Review (Claude Opus 5.5, 30/10/2026): Khớp OSC 2015 (\"270 contributing authors\"; khung chọn mẫu là bài năm 2008 của ba tạp chí)."
    luot_2: dung
    luot_2_nguon: [ "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf" ]
    luot_2_ghi_chu: Bản đã bình duyệt (bản tác giả) của OSC 2015.
    review: dung
  - id: k2
    cau: Kết quả được công bố trên tạp chí Science, tháng 8 năm 2015.
    loai: lich-su
    nguon:
      - osc2015
    trich: Science 349(6251) aac4716; issued 2015-08-28 (Crossref)
    vi_tri: Siêu dữ liệu Crossref 10.1126/science.aac4716
    ket_qua: dung
    ghi_chu: Ngày 28/8/2015 theo Crossref.
    luot_2: dung
    luot_2_nguon: [ "https://api.crossref.org/works/10.1126/science.aac4716" ]
  - id: k3
    cau: Mỗi nghiên cứu được một nhóm làm lại, dùng tài liệu gốc khi có và thiết kế được tính để có sức mạnh thống kê cao, nhằm giữ sát thiết kế của bản gốc.
    loai: phat-hien
    nguon:
      - osc2015
    trich: using high-powered designs and original materials when available | high fidelity to the original designs
    vi_tri: Tóm tắt; Method, tr. 4–5
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Mỗi nghiên cứu được một nhóm độc lập thực hiện lại với cỡ mẫu lớn và thiết kế trung thực với bản gốc.\" Lý do: nhóm làm lại liên hệ tác giả gốc và được họ xem xét thiết kế, nên bỏ \"độc lập\"; \"cỡ mẫu lớn\" thành thiết kế có sức mạnh thống kê cao (trung bình 92% để phát hiện hiệu ứng gốc); \"trung thực\" thành \"giữ sát\" (high fidelity). Review (Claude Opus 5.5, 30/10/2026): Khớp OSC 2015."
    luot_2: dung
    luot_2_nguon: [ "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf" ]
    review: dung
  - id: k4
    cau: Trong 100 nghiên cứu gốc, 97% báo cáo hiệu ứng có ý nghĩa thống kê.
    loai: so-lieu
    nguon:
      - osc2015
    trich: Ninety-seven percent of original studies had significant results.
    vi_tri: Tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf" ]
    luot_2_ghi_chu: "Tóm tắt: 'Ninety-seven percent of original studies had significant results'. Bốn bài có p hơi trên .05 nhưng được tác giả gốc diễn giải là dương tính."
  - id: k5
    cau: Khi làm lại, 36% cho hiệu ứng có ý nghĩa thống kê theo cùng hướng.
    loai: so-lieu
    nguon:
      - osc2015
      - nosek2022
    trich: Thirty-six percent of replications had significant results | Open Sci. Collab. (2015) replicated 100 findings from the articles published in 2008 in three psychology journals; 36% achieved significance in the same direction
    vi_tri: OSC, Tóm tắt; Nosek và cộng sự 2022, tr. 725
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf" ]
    luot_2_ghi_chu: 36% là 35 trên 97 hiệu ứng gốc có ý nghĩa.
  - id: k6
    cau: Độ lớn hiệu ứng ở lần làm lại trung bình chỉ còn khoảng một nửa so với ban đầu.
    loai: so-lieu
    nguon:
      - osc2015
      - nosek2022
    trich: Replication effects were half the magnitude of original effects | with effect sizes 49% as large as in the original studies
    vi_tri: OSC, Tóm tắt; Nosek và cộng sự 2022, tr. 725
    ket_qua: dung
    ghi_chu: Trung bình r của nghiên cứu gốc 0,403, của bản làm lại 0,197 (OSC, tr. 20).
    luot_2: dung
    luot_2_nguon: [ "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf" ]
    luot_2_ghi_chu: r trung bình 0,403 so với 0,197.
  - id: k7
    cau: 'Hình: 97% nghiên cứu gốc có ý nghĩa thống kê so với 36% khi làm lại; độ lớn hiệu ứng làm lại bằng khoảng một nửa gốc; 39% được đánh giá chủ quan là đã tái lập; 47% hiệu ứng gốc nằm trong khoảng tin cậy của hiệu ứng tái lập.'
    loai: so-lieu
    nguon:
      - osc2015
    trich: Ninety-seven percent of original studies had significant results. Thirty-six percent of replications had significant results; 47% of original effect sizes were in the 95% confidence interval of the replication effect size; 39% of effects were subjectively rated to have replicated the original result
    vi_tri: Tóm tắt
    ket_qua: dung
    ghi_chu: 'Chữ của hình osc-replication (src/hinh/osc-replication.html): số 97%, 36%, 100% và ~50% (độ lớn tương đối), 39%, 47%, chú thích và nhãn khớp bài gốc; hình không đổi.'
    luot_2: dung
    luot_2_nguon: [ "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf" ]
  - id: k8
    cau: 'Các tác giả viết rằng không nên đọc kết quả này như một thất bại của tâm lý học: dự án cho thấy khoa học đang hoạt động như nó nên làm, và tích lũy bằng chứng là cách cộng đồng khoa học tự sửa mình.'
    loai: phat-hien
    nguon:
      - osc2015
    trich: Any temptation to interpret these results as a defeat for psychology, or science more generally, must contend with the fact that this project demonstrates science behaving as it should. | Accumulating evidence is the scientific community's method of self-correction
    vi_tri: Conclusion, tr. 27–28
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Nhưng chính các tác giả lại viết điều ngược lại: đây không phải thất bại của tâm lý học, mà là cách khoa học tự sửa mình — tìm ra vấn đề bằng bằng chứng, rồi sửa bằng phương pháp tốt hơn.\" Lý do: \"rồi sửa bằng phương pháp tốt hơn\" là diễn giải thêm; bài nói \"accumulating evidence is the scientific community's method of self-correction\". Review (Claude Opus 5.5, 30/10/2026): Khớp lời kết của OSC."
    luot_2: dung
    luot_2_nguon: [ "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf" ]
    review: dung
  - id: k9
    cau: "Tái lập (replication) là làm lại một nghiên cứu với người tham gia mới, theo sát thiết kế cũ, để xem hiệu ứng có xuất hiện trở lại không."
    loai: dinh-nghia
    nguon:
      - "osc2015"
      - "nosek2022"
    trich: "Direct replication is the attempt to recreate the conditions believed sufficient for obtaining a previously observed finding ... and is the means of establishing reproducibility of a finding with new data. | Replication seems straightforward—do the same study again and see if the same outcome recurs—but it is not easy to determine what counts as the same study or same outcome. | There is no such thing as an exact replication."
    vi_tri: Phần mở đầu, tr. 3
    ket_qua: da-lam-mem
    ghi_chu: "Định nghĩa này là của tái lập trực tiếp (direct replication); trang dùng \"tái lập\" theo nghĩa ấy. Review (Claude Opus 5.5, 30/10/2026): Đã đọc Nosek và cộng sự 2022 (bản Tilburg), mục Replicability: \"There is no such thing as an exact replication. Even the most similar study designs will have inevitable, innumerable differences\". Chữ \"theo đúng thiết kế cũ\" mạnh hơn cả OSC (\"recreate the conditions believed sufficient\") lẫn Nosek. Chữ cũ: \"theo đúng thiết kế cũ\". Chữ mới: \"theo sát thiết kế cũ\". Giữ định nghĩa hẹp (tái lập trực tiếp) vì cả trang nói về kiểu tái lập của dự án năm 2015."
    luot_2: dung
    luot_2_nguon: [ "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download" ]
    luot_2_ghi_chu: "Câu tả đúng tái lập trực tiếp (loại OSC làm). Nosek 2022 định nghĩa rộng hơn: 'testing the reliability of a prior finding with different data'; nếu muốn chính xác có thể viết 'tái lập trực tiếp'."
    review: sai
  - id: k10
    cau: Theo chính dự án năm 2015, một nghiên cứu đơn lẻ hầu như không bao giờ cho kết luận dứt khoát về một hiệu ứng; bằng chứng đáng tin hơn khi nhiều lần làm lại độc lập cùng cho thấy hiệu ứng.
    loai: phat-hien
    nguon:
      - osc2015
    trich: a single study almost never provides definitive resolution for or against an effect and its explanation. | Scientific claims should not gain credence because of the status or authority of their originator but by the replicability of their supporting evidence.
    vi_tri: Conclusion, tr. 27; phần mở đầu, tr. 3
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"Một phát hiện chỉ được coi là vững chắc khi nó sống sót qua nhiều lần tái lập độc lập — không phải khi nó xuất hiện một lần thật ấn tượng trên báo.\" Lý do: \"chỉ ... khi\" và \"vững chắc\" mạnh hơn nguồn (nguồn nói một nghiên cứu hầu như không cho kết luận dứt khoát, và bằng chứng đáng tin nhờ khả năng tái lập). Review (Claude Opus 5.5, 30/10/2026): Đúng mức trích OSC."
    luot_2: dung
    luot_2_nguon: [ "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf" ]
    review: dung
  - id: k11
    cau: '"Không tái lập được" không đơn giản có nghĩa là "phát hiện đó sai".'
    loai: phat-hien
    nguon:
      - osc2015
    trich: It is also too easy to conclude that a failure to replicate a result means that the original evidence was a false positive.
    vi_tri: Insights on Reproducibility, tr. 24
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf", "http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632" ]
    luot_2_ghi_chu: "Simmons 2011: 'failures to replicate previous findings are never conclusive'."
  - id: k12
    cau: Trong dự án năm 2015, 36% đạt ý nghĩa thống kê, 39% được đánh giá chủ quan là "đã tái lập", và 47% hiệu ứng gốc nằm trong khoảng tin cậy của hiệu ứng tái lập.
    loai: so-lieu
    nguon:
      - osc2015
    trich: 47% of original effect sizes were in the 95% confidence interval of the replication effect size; 39% of effects were subjectively rated to have replicated the original result
    vi_tri: Tóm tắt
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf" ]
  - id: k13
    cau: Nhiều kết quả làm lại cho hiệu ứng nhỏ hơn và bằng chứng yếu hơn những gì bài báo gốc tuyên bố, thay vì biến mất hoàn toàn.
    loai: phat-hien
    nguon:
      - osc2015
    trich: A large portion of replications produced weaker evidence for the original findings
    vi_tri: Discussion, tr. 23
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"nhiều phát hiện không biến mất hoàn toàn, mà chỉ nhỏ hơn và mong manh hơn những gì bài báo gốc tuyên bố\". Chữ mới nói về kết quả làm lại (hiệu ứng nhỏ hơn, bằng chứng yếu hơn). \"Mong manh\" đổi thành \"bằng chứng yếu hơn\" theo nguồn; trung bình r làm lại 0,197 vẫn lớn hơn 0 (tr. 20). Review (Claude Opus 5.5, 30/10/2026): Khớp OSC (\"weaker evidence\")."
    luot_2: dung
    luot_2_nguon: [ "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf" ]
    luot_2_ghi_chu: "Kết hợp gốc và làm lại vẫn còn 68% có ý nghĩa (nếu giả định không thiên lệch), nên 'thay vì biến mất hoàn toàn' hợp với dữ liệu tổng; một số hiệu ứng thì gần như về 0 (ML2: 9/28 ngược chiều)."
    review: dung
  - id: k14
    cau: Open Science Collaboration và nhóm của Nosek (2022) nêu ba yếu tố có thể góp phần (sức mạnh thống kê thấp, p-hacking, thiên lệch xuất bản); cả ba thuộc về cách làm và động cơ chung của cộng đồng khoa học, không phải lỗi của một nhà nghiên cứu cụ thể.
    loai: phat-hien
    nguon:
      - osc2015
      - nosek2022
    trich: there are indications of cultural practices in scientific communication that may be responsible for the observed results. | Failing to report transparently the process and the context that produced the original findings may reduce their replicability.
    vi_tri: OSC, tr. 24; Nosek và cộng sự 2022, tr. 728
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"Có ba nguyên nhân chính, và cả ba đều là 'lỗi hệ thống' chứ không phải lỗi của một nhà nghiên cứu cụ thể\". Lý do: nguồn nói đây là các thực hành và động cơ \"may be responsible\"/\"plausible\", không \"nguyên nhân chính\"; \"lỗi hệ thống\" đổi thành \"cách làm và động cơ chung\" (OSC: \"incentives for individual scientists prioritize novelty over replication\"). Review (Claude Opus 5.5, 30/10/2026): Đúng mức: hai nguồn nói \"may be responsible\", \"plausible\"."
    luot_2: dung
    luot_2_nguon: [ "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download" ]
    luot_2_ghi_chu: "Nosek 2022: 'publication bias ... or questionable research practices that inflate reported effect sizes'; 'a complex system of policies, norms, and incentives'. OSC nói 'publication, selection, and reporting biases' (p-hacking nằm trong selection/reporting). Vế 'không phải lỗi của một nhà nghiên cứu cụ thể' là cách diễn giải của trang, hợp với khung 'văn hóa, động cơ' của hai nguồn (Nosek có nhắc cả yếu tố cá nhân)."
    review: dung
  - id: k15
    cau: Khi nghiên cứu có sức mạnh thống kê thấp lại đi cùng việc ưu tiên đăng kết quả dương tính, độ lớn hiệu ứng trong các bài đã đăng sẽ bị ước lượng cao một cách có hệ thống.
    loai: phat-hien
    nguon:
      - osc2015
    trich: In a discipline with low-powered research designs and an emphasis on positive results for publication, effect sizes will be systematically overestimated in the published literature.
    vi_tri: Cumulative evidence, tr. 20
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"Nhiều nghiên cứu tâm lý dùng vài chục người tham gia. Với mẫu nhỏ, ... Mẫu càng nhỏ, hiệu ứng 'có ý nghĩa thống kê' càng có khả năng bị thổi phồng.\" Chữ mới sát câu của OSC (có điều kiện: kèm ưu tiên kết quả dương tính). Câu \"vài chục người\" bỏ (k16). Review (Claude Opus 5.5, 30/10/2026): Gần nguyên văn OSC."
    luot_2: dung
    luot_2_nguon: [ "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf" ]
    review: dung
  - id: k16
    cau: Với mẫu nhỏ, một chút may rủi cũng đủ tạo ra hiệu ứng "đẹp", giống như tung đồng xu 10 lần mà được 8 lần ngửa rồi kết luận đồng xu bị lệch.
    loai: phat-hien
    nguon:
      - nosek2022
    trich: small samples, poorly controlled designs, and other factors that reduce statistical power and increase uncertainty
    vi_tri: Nosek và cộng sự 2022, tr. 728
    ket_qua: da-lam-mem
    ghi_chu: "Ví dụ đồng xu là phép so sánh minh họa (gia-dinh). Câu cũ \"Nhiều nghiên cứu tâm lý dùng vài chục người tham gia\" đã bỏ khỏi trang (k17). Review (Claude Opus 5.5, 30/10/2026): Phép so sánh minh họa; 8/10 ngửa với đồng xu công bằng có xác suất khoảng 5,5% (từ 8 trở lên), đúng là may rủi không hiếm."
    luot_2: dung
    luot_2_nguon: [ "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download" ]
    luot_2_ghi_chu: "Ví dụ minh họa: xác suất được 8 lần ngửa trở lên với đồng xu công bằng là 56/1024 ≈ 5,5%, đúng là chuyện may rủi không hiếm."
    review: dung
  - id: k17
    cau: 'Khẳng định cũ: "Nhiều nghiên cứu tâm lý dùng vài chục người tham gia."'
    loai: so-lieu
    ket_qua: da-bo
    ghi_chu: "Chữ cũ: \"Nhiều nghiên cứu tâm lý dùng vài chục người tham gia.\" Bỏ: OSC không nêu cỡ mẫu trung vị của nghiên cứu gốc trong bài chính; không có nguồn đã mở cho con số \"vài chục\" ở tâm lý nói chung. Review (Claude Opus 5.5, 30/10/2026): Bỏ được: lượt 2 tính từ dữ liệu OSC thấy \"vài chục người\" đúng với mẫu ấy, nhưng câu nói về tâm lý học nói chung; bảng ở mục Cách nhận ra vẫn có \"Cỡ mẫu nhỏ (vài chục người)\" như dấu hiệu, không phải số liệu."
    luot_2: dung
    luot_2_nguon: [ "https://raw.githubusercontent.com/CenterForOpenScience/rpp/master/data_allformats/RPPdataConverted.csv", "http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632" ]
    luot_2_ghi_chu: Tự tính từ dữ liệu chính thức của OSC 2015 (kho GitHub của Center for Open Science). Simmons 2011 lấy 20 quan sát mỗi ô (40 người, hai điều kiện) làm thiết kế cơ sở và yêu cầu 'at least 20 observations per cell'. Câu 'nhiều nghiên cứu dùng vài chục người' đúng với mẫu này.
    review: dung
  - id: k18
    cau: 'P-hacking là "đào" dữ liệu cho đến khi ra kết quả: thử biến này không được thì thử biến khác, loại vài điểm số liệu "lạ", đổi cách phân tích, cho đến khi chỉ số p nhỏ hơn 0,05.'
    loai: dinh-nghia
    nguon:
      - nosek2022
      - john2012
    trich: p-hacking, or other behaviors that leverage random chance to amplify effect sizes, obtain statistical significance, or specify overfitting models | 7. Deciding whether to exclude data after looking at the impact of doing so on the results
    vi_tri: Nosek và cộng sự 2022, tr. 728; John và cộng sự 2012, Bảng 1
    ket_qua: dung
    ghi_chu: Cách nói "nửa đùa nửa thật" của site giữ nguyên; nội dung khớp danh sách thực hành đáng ngờ của John và cộng sự.
    luot_2: dung
    luot_2_nguon: [ "http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632", "http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108" ]
  - id: k19
    cau: Càng làm nhiều lần, càng dễ gặp kết quả "đẹp" do may rủi, giống như bắn 100 mũi tên vào tường rồi vẽ hồng tâm quanh chỗ tên rơi nhiều nhất.
    loai: phat-hien
    nguon:
      - john2012
    trich: Questionable research practices (QRPs), such as excluding data points on the basis of post hoc criteria, can spuriously increase the likelihood of finding evidence in support of a hypothesis.
    vi_tri: John và cộng sự 2012, tr. 524
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"Làm đủ nhiều lần thì kiểu gì cũng có lần 'trúng'\". Lý do: \"kiểu gì cũng\" mạnh hơn nguồn (\"can spuriously increase the likelihood\"). Phép so sánh bắn tên vẽ hồng tâm là hình ảnh minh họa. Review (Claude Opus 5.5, 30/10/2026): Đúng mức John 2012; phép so sánh là minh họa."
    luot_2: dung
    luot_2_nguon: [ "http://web.archive.org/web/20250619034900/https://www.tandfonline.com/doi/full/10.1080/00031305.2016.1154108", "http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632" ]
    luot_2_ghi_chu: Phép so sánh (vẽ hồng tâm sau khi bắn) là minh họa của trang.
    review: dung
  - id: k20
    cau: Nhà nghiên cứu có xu hướng công bố kết quả dương tính nhiều hơn kết quả âm tính, và các động cơ trong khoa học ưu tiên điều mới hơn việc kiểm tra lại.
    loai: phat-hien
    nguon:
      - nosek2022
      - osc2015
      - asa-thong-cao
    trich: researchers are more likely to publish positive findings than negative findings | Reproducibility is not well understood because the incentives for individual scientists prioritize novelty over replication | research with statistically significant outcomes are much more likely to get published
    vi_tri: Nosek và cộng sự 2022, tr. 728; OSC, tr. 25; Thông cáo ASA, lời Utts
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Các tạp chí thích đăng kết quả 'đẹp': hiệu ứng mới, bất ngờ, có ý nghĩa thống kê. Kết quả 'không có gì xảy ra' thì bị từ chối hoặc chính nhà nghiên cứu cũng ngại gửi đăng\". Lý do: nguồn nói nhà nghiên cứu công bố kết quả dương tính nhiều hơn và động cơ ưu tiên điều mới; Utts nói thiên lệch biên tập ở một số lĩnh vực; không nguồn nào nói kết quả âm tính \"bị từ chối\" hay nhà nghiên cứu \"ngại\". Review (Claude Opus 5.5, 30/10/2026): Khớp OSC, Nosek 2022."
    luot_2: dung
    luot_2_nguon: [ "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download" ]
    review: dung
  - id: k21
    cau: Kết quả "không có gì xảy ra" vì thế dễ nằm im trong "ngăn kéo hồ sơ" (file drawer), không ai biết đến.
    loai: phat-hien
    nguon:
      - asa-thong-cao
    trich: the 'file-drawer effect,' in which research with statistically significant outcomes are much more likely to get published, while other work that might well be just as important scientifically is never seen in print
    vi_tri: Thông cáo ASA, lời Utts, trang 1
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"nhà nghiên cứu cũng ngại gửi đăng — hiện tượng gọi là ngăn kéo hồ sơ: những nghiên cứu âm tính nằm im trong ngăn kéo\". Chữ mới theo Utts (hiệu ứng ngăn kéo do thiên lệch đăng bài). Review (Claude Opus 5.5, 30/10/2026): Khớp lời Utts."
    luot_2: dung
    luot_2_nguon: [ "https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf" ]
    review: dung
  - id: k22
    cau: 'Bức tranh công bố bị lệch về một phía: thấy nhiều kết quả "thành công" hơn thực tế, và độ lớn hiệu ứng bị thổi phồng.'
    loai: phat-hien
    nguon:
      - nosek2022
    trich: Reporting biases favoring positive results will produce exaggerated effect sizes and false positive rates, particularly in low-powered research contexts
    vi_tri: Nosek và cộng sự 2022, tr. 728
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"chỉ thấy thành công, không thấy thất bại\". Chữ mới sát nguồn (hiệu ứng bị thổi phồng, dương tính giả tăng). Review (Claude Opus 5.5, 30/10/2026): Khớp Nosek 2022."
    luot_2: dung
    luot_2_nguon: [ "http://web.archive.org/web/20250705011407/https://journals.sagepub.com/doi/pdf/10.1177/25152459211007467", "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf" ]
    luot_2_ghi_chu: Scheel 2021 và OSC 2015 ('upwardly biased effect sizes').
    review: dung
  - id: k23
    cau: Sức mạnh thống kê thấp có thể làm hiệu ứng may rủi bị tưởng là thật; p-hacking cho kết quả "đẹp" nhờ chọn lọc cách phân tích; thiên lệch xuất bản làm chỉ thấy phát hiện "thành công".
    loai: phat-hien
    nguon:
      - nosek2022
      - osc2015
    trich: Reporting biases favoring positive results will produce exaggerated effect sizes and false positive rates, particularly in low-powered research contexts | Potentially problematic practices include selective reporting, selective analysis
    vi_tri: Nosek và cộng sự 2022, tr. 728; OSC, tr. 4
    ket_qua: da-lam-mem
    ghi_chu: "Bảng ba hàng. Chữ cũ: \"nhờ đào bới dữ liệu\"; hàng thiên lệch xuất bản \"Báo chỉ đưa tin máy bay rơi\". Chữ mới: \"nhờ chọn lọc cách phân tích\"; \"Chỉ những kết quả 'đẹp' được đăng\" (phép so sánh với báo chí không có nguồn). Cột \"Hậu quả có thể\" thay \"Hậu quả\". Review (Claude Opus 5.5, 30/10/2026): Khớp ba nguồn."
    luot_2: dung
    luot_2_nguon: [ "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download", "http://web.archive.org/web/20250804093838/https://journals.sagepub.com/doi/pdf/10.1177/0956797611417632" ]
    review: dung
  - id: k24
    cau: Đăng ký trước (preregistration) nghĩa là nhà nghiên cứu xác định câu hỏi nghiên cứu và kế hoạch phân tích trước khi thấy kết quả, và công khai kế hoạch ấy.
    loai: dinh-nghia
    nguon:
      - nosek2018
      - nosek2022
    trich: An effective solution is to define the research questions and analysis plan before observing the research outcomes-a process called preregistration. | Preregistration ensures that all studies are, in principle, discoverable
    vi_tri: Nosek và cộng sự 2018, tóm tắt; Nosek và cộng sự 2022, tr. 728
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"công khai toàn bộ kế hoạch — giả thuyết, cách tuyển người tham gia, cách phân tích — trước khi bắt đầu. Kế hoạch được lưu ở một nơi công cộng, có đóng dấu thời gian.\" Lý do: nguồn định nghĩa là xác định câu hỏi và kế hoạch phân tích trước khi thấy kết quả; \"đóng dấu thời gian\" và \"cách tuyển người tham gia\" không có trong nguồn đã mở. Phần \"công khai\" suy từ \"discoverable\" của Nosek 2022. Review (Claude Opus 5.5, 30/10/2026): Khớp Nosek 2018, 2022."
    luot_2: dung
    luot_2_nguon: [ "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download", "http://web.archive.org/web/20250705011407/https://journals.sagepub.com/doi/pdf/10.1177/25152459211007467" ]
    luot_2_ghi_chu: Scheel 2021 dùng khái niệm tương tự cho phần đăng ký của Registered Reports.
    review: dung
  - id: k25
    cau: Nhờ đó người đọc có thể phân biệt phân tích đã dự định từ trước với phân tích thêm vào sau, và biết mức tin cậy nên dành cho từng loại.
    loai: phat-hien
    nguon:
      - nosek2018
      - nosek2022
    trich: Preregistration distinguishes analyses and outcomes that result from predictions from those that result from postdictions. | Preregistration of analysis plans helps to calibrate confidence on the reliability of unplanned analyses
    vi_tri: Nosek và cộng sự 2018, tóm tắt; Nosek và cộng sự 2022, tr. 728
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Sau này ai cũng có thể đối chiếu: 'anh làm đúng như anh đã hứa không?' Cách này khiến p-hacking gần như không thể giấu được.\" Lý do: \"gần như không thể giấu được\" mạnh hơn nguồn; nguồn nói đăng ký trước giúp phân biệt phân tích đã dự đoán với phân tích sau khi xem kết quả và điều chỉnh mức tin cậy. Review (Claude Opus 5.5, 30/10/2026): Khớp Nosek 2018."
    luot_2: dung
    luot_2_nguon: [ "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download" ]
    review: dung
  - id: k26
    cau: Registered Reports là một mô hình xuất bản trong đó tạp chí phản biện kế hoạch nghiên cứu trước khi có kết quả và nhận bài "về nguyên tắc" dựa trên tầm quan trọng của câu hỏi và chất lượng phương pháp.
    loai: dinh-nghia
    nguon:
      - nosek2022
    trich: Registered Reports is a publishing model in which authors receive in-principle acceptance of their proposed studies based on the importance of the question and the quality of the methodology before the outcomes are known
    vi_tri: Nosek và cộng sự 2022, tr. 731
    ket_qua: da-lam-mem
    ghi_chu: "Chữ cũ: \"một định dạng bài báo trong đó tạp chí phản biện kế hoạch nghiên cứu trước khi dữ liệu được thu thập. Nếu kế hoạch đạt chuẩn, tạp chí cam kết đăng bài bất kể kết quả cuối cùng đẹp hay xấu.\" Chữ mới theo nguồn: \"in-principle acceptance ... before the outcomes are known\" (trước khi có kết quả, không phải trước khi thu thập dữ liệu; \"bất kể kết quả\" là hệ quả của nhận bài về nguyên tắc). Review (Claude Opus 5.5, 30/10/2026): Gần nguyên văn Nosek 2022."
    luot_2: dung
    luot_2_nguon: [ "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download", "http://web.archive.org/web/20250705011407/https://journals.sagepub.com/doi/pdf/10.1177/25152459211007467" ]
    review: dung
  - id: k27
    cau: 'Nhờ vậy một nghiên cứu được thiết kế tốt nhưng cho kết quả "không có gì xảy ra" vẫn được đăng: tỉ lệ kết quả không có hiệu ứng được báo cáo ở Registered Reports cao hơn nhiều so với bài thông thường.'
    loai: phat-hien
    nguon:
      - nosek2022
    trich: Registered Reports are also associated with ... a much higher proportion of reported null results (Scheel et al. 2020).
    vi_tri: Nosek và cộng sự 2022, tr. 731
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"vẫn được đăng — trực tiếp chữa bệnh thiên lệch xuất bản.\" Lý do: \"chữa\" mạnh hơn nguồn; nguồn (qua Scheel và cộng sự 2020) nói tỉ lệ kết quả không có hiệu ứng được báo cáo cao hơn nhiều. Số liệu của Scheel là Nosek kể lại, chưa đọc bài gốc. Review (Claude Opus 5.5, 30/10/2026): Khớp Nosek 2022 (Scheel 2020); lượt 2 đọc Scheel 2021 thấy cùng chiều."
    luot_2: dung
    luot_2_nguon: [ "http://web.archive.org/web/20250705011407/https://journals.sagepub.com/doi/pdf/10.1177/25152459211007467", "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download" ]
    luot_2_ghi_chu: Scheel 2021 (giả thuyết đầu của mỗi bài; 71 RR, 152 bài thường). Tác giả nói giảm thiên lệch xuất bản là 'a plausible factor', không chứng minh nhân quả; vế đầu (bài vẫn được đăng) là đúng theo thiết kế của RR.
    review: dung
  - id: k28
    cau: Theo Nosek và cộng sự (2022), đến thời điểm bài tổng quan ấy viết, chưa có nghiên cứu nào cho biết kết quả từ Registered Reports có tái lập tốt hơn trung bình hay không.
    loai: phat-hien
    nguon:
      - nosek2022
    trich: As of yet, there is no investigation of whether findings from Registered Reports are more replicable on average than other findings.
    vi_tri: Nosek và cộng sự 2022, tr. 731
    ket_qua: da-sua
    ghi_chu: "Chữ cũ: \"Cả hai đều không phải 'thuốc tiên': một kế hoạch đăng ký trước vẫn có thể dở, và không phải câu hỏi nào cũng hợp với định dạng Registered Reports. Nhưng chúng biến những thủ thuật ... công khai là kẻ thù của gian lận phương pháp.\" Lý do: các ý \"kế hoạch vẫn có thể dở\", \"không phải câu hỏi nào cũng hợp\" và câu hùng biện không có nguồn; thay bằng lời của Nosek và cộng sự, ghi rõ mốc \"đến thời điểm bài tổng quan ấy viết\" (2022). Chưa tìm sau 2022: câu chỉ nói Nosek 2022 đã viết gì. Review (Claude Opus 5.5, 30/10/2026): Câu ghi rõ mốc \"đến thời điểm bài tổng quan ấy viết\" và chỉ thuật lại Nosek 2022, nên để phat-hien, không cần thoi-su."
    luot_2: dung
    luot_2_nguon: [ "https://repository.tilburguniversity.edu/bitstreams/64a63169-7bdd-47b9-983c-1f96eeed45ee/download" ]
    review: dung
  - id: k29
    cau: 'Tái lập thất bại không có nghĩa phát hiện gốc là bịa: có thể hiệu ứng thật nhưng nhỏ hơn, hoặc chỉ đúng trong một số điều kiện nhất định.'
    loai: phat-hien
    nguon:
      - osc2015
    trich: Replications can fail if the replication methodology differs from the original in ways that interfere with observing the effect. | failure to identify the necessary and sufficient conditions to reproduce a finding indicates an incomplete theoretical understanding
    vi_tri: Phần mở đầu, tr. 3; Insights on Reproducibility, tr. 24
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://discovery.dundee.ac.uk/ws/files/7385883/RPP_SCIENCE_2015.pdf", "https://www.nature.com/articles/s41562-018-0399-z" ]
    luot_2_ghi_chu: Camerer 2018 chỉ đọc được tóm tắt.
  - id: k30
    cau: 'Tái lập thành công không có nghĩa phát hiện là chân lý vĩnh viễn: nó chỉ có nghĩa là, với cách làm đó, hiệu ứng xuất hiện trở lại.'
    loai: phat-hien
    nguon:
      - osc2015
    trich: It is too easy to conclude that successful replication means that the theoretical understanding of the original finding is correct. Direct replication mainly provides evidence for the reliability of a result.
    vi_tri: Insights on Reproducibility, tr. 23
    ket_qua: dung
    luot_2: dung
