  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Loại bỏ vài điểm dữ liệu ''ngoại lệ'' cho đến khi đạt ngưỡng." Chữ mới sát câu của khảo sát.'
- id: p28
  cau: Một cách p-hacking là chỉ báo cáo những nghiên cứu hay điều kiện cho kết quả "thành công".
  loai: phat-hien
  nguon:
  - john2012
  trich: 3. In a paper, failing to report all of a study's conditions | 6. In a paper, selectively reporting studies that "worked"
  vi_tri: John và cộng sự 2012, Bảng 1, mục 3 và 6
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Thử nhiều cách chia nhóm, nhiều mô hình, chỉ giữ lại cái cho kết quả tốt nhất." Lý do: các nguồn đã mở không có mục "chia nhóm" hay "nhiều mô hình"; thay bằng hai thực hành có trong khảo sát (không báo cáo mọi điều kiện, chỉ báo cáo nghiên cứu "thành công").'
- id: p29
  cau: Những cách làm này có thể làm tăng khả năng tìm ra bằng chứng "ủng hộ" một giả thuyết sai.
  loai: phat-hien
  nguon:
  - john2012
  trich: Questionable research practices (QRPs), such as excluding data points on the basis of post hoc criteria, can spuriously increase the likelihood of finding evidence in support of a hypothesis.
  vi_tri: John và cộng sự 2012, tr. 524
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Mỗi lần thử thêm là một lần ''tung xúc xắc'' nữa. Thử đủ nhiều, kiểu gì cũng có lần ra kết quả ''có ý nghĩa'' — dù thực tế chẳng có hiệu ứng gì." Lý do: "kiểu gì cũng" mạnh hơn nguồn ("can spuriously increase the likelihood"); chưa mở được bài mô phỏng gốc của Simmons, Nelson và Simonsohn (2011), chỉ đọc mô tả của John và cộng sự.'
- id: p30
  cau: Kết quả có được theo cách ấy ít có khả năng tái lập hơn khi người khác làm lại.
  loai: phat-hien
