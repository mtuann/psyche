  trich: 2. Deciding whether to collect more data after looking to see whether the results were significant
  vi_tri: John và cộng sự 2012, Bảng 1, mục 2
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Thu thập thêm người tham gia cho đến khi kết quả ''đẹp'', rồi dừng lại đúng lúc." Lý do: sát câu của khảo sát ("deciding whether to collect more data after looking to see whether the results were significant", mục 2; mục 4 là dừng sớm vì đã thấy kết quả mong muốn).'
- id: p26
  cau: Một cách p-hacking là đo nhiều biến kết quả (ví dụ 10 biến), chỉ báo cáo vài biến có p < 0,05 và bỏ qua các biến còn lại.
  loai: phat-hien
  nguon:
  - john2012
  trich: 1. In a paper, failing to report all of a study's dependent measures
  vi_tri: John và cộng sự 2012, Bảng 1, mục 1
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Đo 10 biến kết quả, chỉ báo cáo 2 biến có p < 0,05, lặng lẽ bỏ 8 biến còn lại." Lý do: các số 10, 2, 8 là ví dụ minh họa (gia-dinh), nay ghi "ví dụ 10 biến"; nguồn nói về việc không báo cáo mọi biến kết quả.'
- id: p27
  cau: Một cách p-hacking là quyết định có loại một số điểm dữ liệu hay không sau khi xem việc loại ấy làm kết quả đổi thế nào.
  loai: phat-hien
