nhan_dinh:
- id: p1
  cau: Năm 2016, Hiệp hội Thống kê Hoa Kỳ (ASA) ra một tuyên bố chính thức vì cách dùng và cách hiểu p-value hay bị sai lệch.
  loai: lich-su
  nguon:
  - asa-thong-cao
  trich: The American Statistical Association (ASA) has released a "Statement on Statistical Significance and P-Values" | In light of misuses of and misconceptions concerning p-values
  vi_tri: Thông cáo ASA, 7/3/2016, đoạn 1 và 3
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "phổ biến đến mức năm 2016, ASA phải ra một tuyên bố chính thức chỉ để nói: mọi người đang hiểu sai p-value". Lý do: "phải", "chỉ để nói", "mọi người đang hiểu sai" mạnh hơn nguồn; thông cáo nói tuyên bố đưa ra vì có "misuses and misconceptions".'
- id: p2
  cau: Tuyên bố do Ronald L. Wasserstein và Nicole A. Lazar soạn thảo, đăng trên The American Statistician, số 70(2), trang 129–133.
  loai: lich-su
  nguon:
  - wasserstein2016
  - asa-thong-cao
  trich: 'The ASA Statement on p-Values: Context, Process, and Purpose; The American Statistician 70(2) 129–133 (Crossref); Wasserstein, Lazar (tác giả)'
  vi_tri: Crossref 10.1080/00031305.2016.1154108; thông cáo ASA nêu Ron Wasserstein là giám đốc điều hành
  ket_qua: dung
  ghi_chu: Siêu dữ liệu khớp Crossref (tên bài, tạp chí, số 70, kỳ 2, trang 129–133, tác giả Wasserstein và Lazar). Chữ "soạn thảo" suy từ tác giả; thông cáo ghi Wasserstein là ASA executive director.
- id: p3
  cau: Theo thông cáo của ASA, đây là lần đầu Ban Giám đốc ASA, đại diện cho cộng đồng thống kê, ra một tuyên bố về những vấn đề này.
  loai: lich-su
  nguon:
  - asa-thong-cao
  trich: this is the first time that the community of statisticians, as represented by the ASA Board of Directors, has issued a statement to address these issues.
  vi_tri: Thông cáo ASA, lời Utts, cuối trang 2
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đây là lần đầu tiên trong lịch sử hiệp hội có một tuyên bố chính thức về cách dùng và cách hiểu p-value — một dấu hiệu cho thấy vấn đề đã nghiêm trọng đến mức nào." Lý do: nguồn nói lần đầu cộng đồng thống kê, qua Ban Giám đốc, ra tuyên bố về các vấn đề này (không nói "trong lịch sử hiệp hội" về riêng p-value); "dấu hiệu ... nghiêm trọng" là diễn giải, bỏ.'
- id: p4
  cau: Tuyên bố nêu sáu nguyên tắc, nhiều nguyên tắc trong đó nhằm sửa các hiểu lầm và cách dùng sai p-value.
  loai: phat-hien
  nguon:
  - asa-thong-cao
  trich: The statement's six principles, many of which address misconceptions and misuse of the p-value, are the following
  vi_tri: Thông cáo ASA, danh sách sáu nguyên tắc
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Tuyên bố nêu sáu nguyên tắc, mà ý chính có thể tóm gọn: p-value không trả lời những câu hỏi mà người ta vẫn tưởng nó trả lời." Chữ mới sát thông cáo ("many of which address misconceptions and misuse").'
- id: p5
  cau: 'Tung một đồng xu công bằng 10 lần: trong 1024 khả năng đều nhau, có 10 cách được đúng 9 lần ngửa và 1 cách được 10 lần ngửa, tổng 11/1024, khoảng 1,1%.'
  loai: so-lieu
  nguon:
  - openstax-stats2e-binomial
  trich: There are three characteristics of a binomial experiment.
  vi_tri: Mục 4.3 (mô hình nhị thức)
  ket_qua: dung
  ghi_chu: 'Tính trực tiếp: C(10,9) = 10, C(10,10) = 1, 2^10 = 1024, 11/1024 = 0,01074 (kiểm bằng math.comb của Python). Giáo trình mở nêu mô hình nhị thức; phép tính không cần nguồn khác. Ví dụ giả định.'
- id: p6
  cau: p-value là xác suất thu được kết quả "lạ" như thế này (hoặc lạ hơn), nếu giả thuyết "không có gì đặc biệt" là đúng.
  loai: dinh-nghia
  nguon:
  - greenland2016
  - openstax-psy2e
  trich: The P value is then the probability that the chosen test statistic would have been at least as large as its observed value if every model assumption were correct, including the test hypothesis. | Generally, psychologists consider differences to be statistically significant if there is less than a five percent chance of observing them if the groups did not actually differ from one another.
  vi_tri: Greenland và cộng sự, mục "P values and tests"; OpenStax Psychology 2e, mục 2.3
  ket_qua: dung
- id: p7
  cau: Theo cách nói của ASA, p-value cho biết dữ liệu không tương thích đến mức nào với một mô hình đã định trước.
  loai: dinh-nghia
  nguon:
  - asa-thong-cao
  trich: P-values can indicate how incompatible the data are with a specified statistical model.
  vi_tri: Thông cáo ASA, danh sách sáu nguyên tắc, nguyên tắc 1
  ket_qua: dung
- id: p8
  cau: p-value không phải xác suất giả thuyết đúng; đây là một hiểu lầm thường gặp, và là nguyên tắc thứ hai của tuyên bố ASA 2016.
  loai: dinh-nghia
  nguon:
  - asa-thong-cao
  - greenland2016
  trich: P-values do not measure the probability that the studied hypothesis is true, or the probability that the data were produced by random chance alone. | The P value assumes the test hypothesis is true—it is not a hypothesis probability
  vi_tri: Thông cáo ASA, danh sách sáu nguyên tắc, nguyên tắc 2; Greenland và cộng sự, "Common misinterpretations of single P values", mục 1
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Đây là hiểu lầm phổ biến nhất, và là điều tuyên bố ASA 2016 nhấn mạnh đầu tiên." Lý do: nguyên tắc 1 của ASA là về độ không tương thích, "không phải xác suất giả thuyết đúng" là nguyên tắc 2, nên "nhấn mạnh đầu tiên" sai; "phổ biến nhất" không có nguồn xếp hạng (Greenland chỉ xếp đầu danh sách các hiểu lầm thường gặp). Câu hỏi bài tập (đáp án A) sửa theo.'
- id: p9
  cau: 'Với p = 1,1% trong ví dụ đồng xu: không có nghĩa "xác suất đồng xu công bằng chỉ là 1,1%"; có nghĩa là nếu đồng xu công bằng thì kết quả 9/10 ngửa là chuyện hiếm (1,1%).'
  loai: phat-hien
  nguon:
  - greenland2016
  trich: The P value assumes the test hypothesis is true—it is not a hypothesis probability and may be far from any reasonable probability for the test hypothesis.
  vi_tri: Greenland và cộng sự, "Common misinterpretations", mục 1
  ket_qua: dung
- id: p10
  cau: Câu sai nói về đồng xu ("đồng xu công bằng với xác suất 1,1%"); câu đúng nói về dữ liệu trong một điều kiện giả định ("nếu đồng xu công bằng, dữ liệu này hiếm đến mức 1,1%").
  loai: phat-hien
  nguon:
  - asa-thong-cao
  - greenland2016
  trich: P-values do not measure the probability that the studied hypothesis is true, or the probability that the data were produced by random chance alone. | The P value is a probability computed assuming chance was operating alone.
  vi_tri: Thông cáo ASA, danh sách sáu nguyên tắc, nguyên tắc 2; Greenland và cộng sự, mục 2
  ket_qua: dung
- id: p11
  cau: Câu ta muốn trả lời thường là "giả thuyết có đúng không", nhưng p-value chỉ trả lời "dữ liệu có lạ không, nếu giả thuyết đúng"; một mình p-value không phải thước đo tốt cho bằng chứng về một mô hình hay giả thuyết.
  loai: phat-hien
  nguon:
  - asa-thong-cao
  - greenland2016
  trich: By itself, a p-value does not provide a good measure of evidence regarding a model or hypothesis. | The P value simply indicates the degree to which the data conform to the pattern predicted by the test hypothesis and all the other assumptions used in the test
  vi_tri: Thông cáo ASA, danh sách sáu nguyên tắc, nguyên tắc 6; Greenland và cộng sự, mục 1
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Vì sao ai cũng nhầm? Vì bộ não ta muốn biết ''giả thuyết có đúng không'' ... Muốn trả lời câu hỏi thứ nhất cần thêm nhiều thông tin khác mà một mình p-value không có." Lý do: "ai cũng nhầm" và lời giải thích về "bộ não" là nhận định tâm lý không có nguồn; giữ phần thống kê theo nguyên tắc 6 của ASA ("by itself, ... not a good measure of evidence").'
- id: p12
  cau: 'p = 0,03 trong quảng cáo thuốc không có nghĩa là "thuốc hiệu quả với xác suất 97%", cũng không có nghĩa "chỉ có 3% là do ngẫu nhiên"; nó chỉ có nghĩa: nếu thuốc thực ra vô tác dụng, thì chênh lệch quan sát được là chuyện hiếm ở mức 3%.'
  loai: phat-hien
  nguon:
  - asa-thong-cao
  - greenland2016
  trich: P-values do not measure the probability that the studied hypothesis is true, or the probability that the data were produced by random chance alone. | The P value for the null hypothesis is the probability that chance alone produced the observed association; for example, if the P value for the null hypothesis is 0.08, there is an 8 % probability that chance alone produced the association. No!
  vi_tri: Thông cáo ASA, danh sách sáu nguyên tắc, nguyên tắc 2; Greenland và cộng sự, mục 2
  ket_qua: dung
  ghi_chu: Ví dụ thuốc là giả định (gia-dinh).
- id: p13
  cau: 'Thay vì chỉ hỏi "có ý nghĩa thống kê không", ta có thể hỏi một câu hữu ích hơn: "hiệu ứng lớn cỡ nào?", và khoảng tin cậy là một cách trả lời.'
  loai: phat-hien
  nguon:
  - asa-thong-cao
  - greenland2016
  trich: that emphasize estimation over testing such as confidence, credibility, or prediction intervals | One must look at the confidence interval to determine which effect sizes of scientific or other substantive (e.g., clinical) importance are relatively compatible with the data, given the model.
  vi_tri: Thông cáo ASA, trang 2; Greenland và cộng sự, mục 1 (misinterpretation về ý nghĩa thống kê)
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Câu trả lời là khoảng tin cậy." Chữ mới: "khoảng tin cậy là một cách trả lời" (ASA liệt kê khoảng tin cậy cùng các phương pháp thay thế khác).'
- id: p14
  cau: Khoảng tin cậy 95% gồm các độ lớn hiệu ứng mà phép thử cho p lớn hơn 0,05; nếu khoảng này không chứa số 0, kết quả được gọi là "có ý nghĩa thống kê ở mức 5%", liên hệ với p < 0,05.
  loai: dinh-nghia
  nguon:
  - greenland2016
  trich: The effect sizes whose test produced P > 0.05 will typically define a range of sizes (e.g., from 11.0 to 19.5) that would be considered more compatible with the data | This range corresponds to a 1 − 0.05 = 0.95 or 95 % confidence interval
  vi_tri: Greenland và cộng sự, mục "Moving from tests to estimates"
  ket_qua: dung
- id: p15
  cau: Với khoảng tin cậy 95% từ 5 đến 35 phút, ước lượng tốt nhất là thêm 20 phút.
  loai: phat-hien
  nguon:
  - greenland2016
  trich: The effect size whose test produced P = 1 is the size most compatible with the data (in the sense of predicting what was in fact observed) if all the other assumptions used in the test (the statistical model) were correct, and provides a point estimate of the effect under those assumptions.
  vi_tri: Greenland và cộng sự, mục "Moving from tests to estimates"
  ket_qua: dung
  ghi_chu: Số liệu 20 phút, 5–35 phút là ví dụ giả định (gia-dinh); ước lượng điểm là giá trị tương thích nhất với dữ liệu.
- id: p16
  cau: Các giá trị trong khoảng từ 5 đến 35 phút tương thích với dữ liệu hơn các giá trị nằm ngoài khoảng, với điều kiện mô hình thống kê đúng.
  loai: phat-hien
  nguon:
  - greenland2016
  trich: a range of sizes ... that would be considered more compatible with the data (in the sense of the observations being closer to what the model predicted) than sizes outside the range—again, if the statistical model were correct.
  vi_tri: Greenland và cộng sự, mục "Moving from tests to estimates"
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Khoảng từ 5 đến 35 phút là vùng ''hợp lý'' cho hiệu ứng thật — các giá trị nằm trong khoảng này đều tương thích khá tốt với dữ liệu." Lý do: nguồn nói tương thích hơn giá trị ngoài khoảng, có điều kiện mô hình đúng; không nói "hợp lý cho hiệu ứng thật" hay "khá tốt".'
- id: p17
  cau: 'Khoảng tin cậy cho thấy những độ lớn của hiệu ứng tương thích với dữ liệu, kể cả hướng của hiệu ứng; p-value không đo độ lớn hay tầm quan trọng của kết quả: hai nghiên cứu cùng p = 0,03 có thể ẩn sau một hiệu ứng lớn hoặc một hiệu ứng nhỏ không đáng kể.'
  loai: phat-hien
  nguon:
  - asa-thong-cao
  - greenland2016
  trich: A p-value, or statistical significance, does not measure the size of an effect or the importance of a result. | Especially when a study is large, very minor effects or small assumption violations can lead to statistically significant tests of the null hypothesis.
  vi_tri: Thông cáo ASA, danh sách sáu nguyên tắc, nguyên tắc 5; Greenland và cộng sự, mục 1
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "cho thấy cả hướng, độ lớn và độ chắc chắn của hiệu ứng. Trong khi đó p-value chỉ cho một phán quyết ''có/không'' khô khan". Lý do: "độ chắc chắn" bỏ (khoảng tin cậy không cho xác suất rằng hiệu ứng nằm trong khoảng; Greenland nêu độ phủ là tính chất của dãy khoảng); nói thẳng điều ASA nguyên tắc 5 nói. Ý "hai nghiên cứu cùng p = 0,03 có thể ẩn sau hiệu ứng lớn hay nhỏ" suy từ nguyên tắc 5 và nhận xét về mẫu lớn.'
- id: p18
  cau: 0,05 là một quy ước, không phải chân lý toán học.
  loai: phat-hien
  nguon:
  - fisher1925
  trich: it is convenient to take this point as a limit in judging whether a deviation is to be considered significant or not.
  vi_tri: Fisher 1925, tr. 47
  ket_qua: dung
- id: p19
  cau: Ronald Fisher nêu ngưỡng 0,05 trong sách năm 1925 như một điểm tiện lợi để quyết định một chênh lệch có được coi là đáng kể hay không.
  loai: lich-su
  nguon:
  - fisher1925
  trich: The value for which P =.05, or 1 in 20, is 1.96 or nearly 2 ; it is convenient to take this point as a limit in judging whether a deviation is to be considered significant or not.
  vi_tri: Fisher 1925, Statistical Methods for Research Workers, tr. 47
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "một quy ước có từ những năm 1920, do nhà thống kê Ronald Fisher đề xuất như một ngưỡng tiện lợi, rồi dần thành ''luật bất thành văn''". Lý do: gắn với đoạn cụ thể trong sách 1925; "đề xuất" thành "nêu" (nguồn không nói Fisher là người đầu tiên hay duy nhất).'
- id: p20
  cau: Theo Jessica Utts, chủ tịch ASA năm 2016, ở một số lĩnh vực p-value đã trở thành "người gác cổng" quyết định công trình có được công bố hay không.
  loai: phat-hien
  nguon:
  - asa-thong-cao
  trich: Over time it appears the p-value has become a gatekeeper for whether work is publishable, at least in some fields
  vi_tri: Thông cáo ASA, lời Utts, trang 1
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "rồi dần thành ''luật bất thành văn'': p < 0,05 thì được công bố, p > 0,05 thì khó công bố." Chữ mới giới hạn "ở một số lĩnh vực" và nói là nhận xét của Utts, không phải sự thật chung.'
- id: p21
  cau: Theo Utts, thiên lệch biên tập này dẫn tới "ngăn kéo hồ sơ" (nghiên cứu có kết quả có ý nghĩa thống kê dễ được đăng hơn nhiều) và tới p-hacking.
  loai: phat-hien
  nguon:
  - asa-thong-cao
  trich: This apparent editorial bias leads to the 'file-drawer effect,' in which research with statistically significant outcomes are much more likely to get published | It also leads to practices called by such names as 'p-hacking' and 'data dredging'
  vi_tri: Thông cáo ASA, lời Utts, trang 1
  ket_qua: da-sua
  ghi_chu: 'Chữ cũ: "Hệ quả là cả một hệ thống khoa học bắt đầu ''săn'' con số 0,05 — và đó là cửa ngõ của p-hacking." Lý do: ý này là lời của Utts ("apparent editorial bias leads to ..."), không phải khẳng định lịch sử về "cả hệ thống"; đổi thành lời dẫn của Utts.'
- id: p22
  cau: 'ASA nhấn mạnh: kết luận khoa học không nên chỉ dựa vào việc p-value có vượt qua một ngưỡng cụ thể hay không.'
  loai: phat-hien
  nguon:
  - asa-thong-cao
  trich: Scientific conclusions and business or policy decisions should not be based only on whether a p-value passes a specific threshold.
  vi_tri: Thông cáo ASA, danh sách sáu nguyên tắc, nguyên tắc 3
  ket_qua: dung
- id: p23
  cau: p = 0,049 và p = 0,051 gần như giống nhau về mặt bằng chứng, vì p-value thay đổi liên tục, nhưng một bên được gọi là "thành công", bên kia là "thất bại"; ranh giới mong manh ấy không nên quyết định số phận một nghiên cứu.
  loai: phat-hien
  nguon:
  - greenland2016
  - asa-thong-cao
  trich: the P value can be viewed as a continuous measure of the compatibility between the data and the entire model used to compute it, ranging from 0 for complete incompatibility to 1 for perfect compatibility | Too often, however, the P value is degraded into a dichotomy
  vi_tri: Greenland và cộng sự, mục "Statistical significance"
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "... thật vô lý nếu ranh giới mong manh ấy quyết định số phận một nghiên cứu." Chữ mới bỏ "thật vô lý" (đánh giá). Hai giá trị 0,049 và 0,051 là ví dụ minh họa; suy luận từ việc p-value là thước đo liên tục (Greenland) và nguyên tắc 3 của ASA.'
- id: p24
  cau: p-hacking là việc thử đi thử lại nhiều cách phân tích cho đến khi p-value "rơi" xuống dưới 0,05, rồi chỉ báo cáo cách phân tích "thành công".
  loai: dinh-nghia
  nguon:
  - asa-thong-cao
  - nosek2022
  trich: practices called by such names as 'p-hacking' and 'data dredging' that emphasize the search for small p-values over other statistical and scientific reasoning | p-hacking, or other behaviors that leverage random chance to amplify effect sizes, obtain statistical significance, or specify overfitting models
  vi_tri: Thông cáo ASA, lời Utts; Nosek và cộng sự 2022, tr. 728
  ket_qua: dung
  ghi_chu: Câu mô tả ("thử đi thử lại ... chỉ báo cáo cách thành công") là cách diễn đạt của site, khớp với các thực hành trong khảo sát của John và cộng sự (p25–p28).
- id: p25
  cau: Một cách p-hacking là quyết định có thu thêm dữ liệu hay không sau khi đã xem kết quả có ý nghĩa chưa.
  loai: phat-hien
  nguon:
