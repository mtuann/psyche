  ghi_chu: 'Chữ cũ: "một hiệu ứng nhỏ xíu vẫn có thể cho p < 0,05 nếu mẫu đủ lớn" nay "rất nhỏ"; đổi cách nối câu, không đổi nghĩa.'
- id: q1
  cau: 'p-value hay ý nghĩa thống kê không đo độ lớn của hiệu ứng hay tầm quan trọng của kết quả (nguyên tắc 5); p = 0,001 vì thế không cho biết hiệu ứng lớn hay nhỏ. Nguyên tắc 2: p-value không phải xác suất giả thuyết đúng, nên p = 0,001 không có nghĩa "xác suất giả thuyết đúng là 99,9%".'
  loai: phat-hien
  nguon:
  - asa-thong-cao
  trich: A p-value, or statistical significance, does not measure the size of an effect or the importance of a result. | P-values do not measure the probability that the studied hypothesis is true, or the probability that the data were produced by random chance alone.
  vi_tri: Thông cáo ASA, danh sách sáu nguyên tắc, nguyên tắc 5 và 2
  ket_qua: dung
  ghi_chu: Câu hỏi 1 của khối quiz.
- id: q2
  cau: Ngưỡng 0,05 là quy ước; nguyên tắc thứ ba của ASA nói kết luận khoa học không nên chỉ dựa vào việc p-value có vượt một ngưỡng nhất định hay không, nên với p = 0,049 và p = 0,051 bằng chứng của hai nghiên cứu gần giống nhau.
  loai: phat-hien
  nguon:
  - asa-thong-cao
  - fisher1925
  - greenland2016
  trich: Scientific conclusions and business or policy decisions should not be based only on whether a p-value passes a specific threshold. | it is convenient to take this point as a limit
  vi_tri: Thông cáo ASA, danh sách sáu nguyên tắc, nguyên tắc 3; Fisher 1925, tr. 47
  ket_qua: dung
  ghi_chu: Câu hỏi 2 của khối quiz; suy luận như p23.
- id: q3
  cau: Báo cáo chọn lọc những kết quả có p dưới 0,05 là một trong các cách làm đáng ngờ được khảo sát ở các nhà tâm lý học; đăng ký trước kế hoạch và báo cáo đầy đủ là cách hạn chế vấn đề này.
  loai: phat-hien
  nguon:
  - john2012
  - nosek2022
  trich: 6. In a paper, selectively reporting studies that "worked" | guarding against p-hacking, hypothesizing after the results are known (or HARKing), and selective reporting by employing preregistration and transparency
  vi_tri: John và cộng sự 2012, Bảng 1; Nosek và cộng sự 2022, tr. 731
  ket_qua: dung
  ghi_chu: Câu hỏi 3 của khối quiz. Mục 6 và mục 1 của Bảng 1 (không báo cáo mọi biến).
- id: s1
  cau: Liên kết "Ai được hỏi thì kết quả mới đáng tin?" trong đáp án C trỏ tới trang bang-chung/mau-va-chon-mau.
  loai: ve-site
  ket_qua: dung
  ghi_chu: 'Đã kiểm: src/data/trang.yml có id bang-chung/mau-va-chon-mau; trang có trong src/content/docs/bang-chung/.'
doi_chu:
- cu: '"năm 2016, ASA phải ra một tuyên bố chính thức chỉ để nói: mọi người đang hiểu sai p-value"; "Đây là lần đầu tiên trong lịch sử hiệp hội ... một dấu hiệu cho thấy vấn đề đã nghiêm trọng đến mức nào"; "mà ý chính có thể tóm gọn"'
  moi: '"ra một tuyên bố chính thức vì cách dùng và cách hiểu p-value hay bị sai lệch"; "Theo thông cáo của ASA, đây là lần đầu Ban Giám đốc ASA, đại diện cho cộng đồng thống kê, ra một tuyên bố về những vấn đề này"; "nhiều nguyên tắc trong đó nhằm sửa các hiểu lầm và cách dùng sai p-value"'
  ly_do: Sát thông cáo của ASA (hồ sơ p1, p3, p4).
- cu: '"Đây là hiểu lầm phổ biến nhất, và là điều tuyên bố ASA 2016 nhấn mạnh đầu tiên."; đáp án A: "... và là điều tuyên bố ASA 2016 nhấn mạnh đầu tiên."'
  moi: '"Đây là một hiểu lầm thường gặp, và là nguyên tắc thứ hai của tuyên bố ASA 2016."'
  ly_do: Nguyên tắc 1 của ASA nói về độ không tương thích (p8).
- cu: '"Vì sao ai cũng nhầm? Vì bộ não ta muốn biết ... Muốn trả lời câu hỏi thứ nhất cần thêm nhiều thông tin khác mà một mình p-value không có."'
  moi: '"Vì sao dễ nhầm? Câu hỏi ta muốn trả lời thường là ... Một mình p-value không phải thước đo tốt cho bằng chứng về một mô hình hay giả thuyết."'
  ly_do: Bỏ lời giải thích tâm lý không có nguồn (p11).
- cu: '"Khoảng từ 5 đến 35 phút là vùng ''hợp lý'' ... tương thích khá tốt với dữ liệu."; "cho thấy cả hướng, độ lớn và độ chắc chắn ... p-value chỉ cho một phán quyết ''có/không'' khô khan"; ví dụ "Ví dụ:" thành "Ví dụ giả định:"'
  moi: '"Các giá trị trong khoảng từ 5 đến 35 phút tương thích với dữ liệu hơn các giá trị nằm ngoài khoảng, với điều kiện mô hình thống kê đúng."; "cho thấy những độ lớn của hiệu ứng tương thích với dữ liệu ... p-value không đo độ lớn hay tầm quan trọng"'
  ly_do: Sát Greenland và cộng sự và nguyên tắc 5 (p16, p17).
- cu: '"0,05 ... có từ những năm 1920, do nhà thống kê Ronald Fisher đề xuất ..., rồi dần thành ''luật bất thành văn'' ...; Hệ quả là cả một hệ thống khoa học bắt đầu ''săn'' con số 0,05 — và đó là cửa ngõ của p-hacking"; "thật vô lý nếu ranh giới mong manh ấy quyết định số phận"'
  moi: '"Ronald Fisher nêu nó trong sách năm 1925 ..."; "Theo Jessica Utts ... ở một số lĩnh vực p-value đã trở thành ''người gác cổng'' ..."; "Theo Utts, thiên lệch biên tập này dẫn tới ''ngăn kéo hồ sơ'' ... và tới p-hacking"; "Ranh giới mong manh ấy không nên quyết định số phận một nghiên cứu"'
  ly_do: Có nguồn cho từng ý (p18–p23).
- cu: 'Bốn gạch đầu dòng p-hacking: "Thu thập thêm người tham gia cho đến khi kết quả ''đẹp'' ..."; "Đo 10 biến ..."; "Loại bỏ vài điểm dữ liệu ''ngoại lệ'' cho đến khi đạt ngưỡng."; "Thử nhiều cách chia nhóm, nhiều mô hình ..."'
  moi: '"Quyết định có thu thêm dữ liệu hay không sau khi đã xem kết quả có ý nghĩa chưa."; "Đo nhiều biến kết quả (ví dụ 10 biến), chỉ báo cáo vài biến ..."; "Quyết định có loại một số điểm dữ liệu hay không sau khi xem việc loại ấy làm kết quả đổi thế nào."; "Chỉ báo cáo những nghiên cứu hay điều kiện cho kết quả ''thành công''."'
  ly_do: Viết theo bảng thực hành đáng ngờ của John và cộng sự 2012 (p25–p28).
- cu: '"Vì sao nguy hiểm? Mỗi lần thử thêm là một lần ''tung xúc xắc'' nữa. Thử đủ nhiều, kiểu gì cũng có lần ra kết quả ''có ý nghĩa'' ... Các kết quả p-hacking trông giống hệt kết quả thật trên giấy, nhưng không tái lập được ..."; "báo cáo đầy đủ và minh bạch — đã thử bao nhiêu cách ... phải nói hết ra"'
  moi: '"Những cách làm này có thể làm tăng khả năng tìm ra bằng chứng ''ủng hộ'' một giả thuyết sai. Kết quả có được theo cách ấy ít có khả năng tái lập hơn ..."; "báo cáo đầy đủ và minh bạch."'
  ly_do: Làm mềm theo nguồn (p29–p31).
- cu: 'Bảng tra cứu: "Tốt — cho biết độ lớn và độ chắc chắn của hiệu ứng."; "Dấu hiệu p-hacking — kết quả khó tin được."'
  moi: '"Tốt hơn: cho biết độ lớn và phạm vi các giá trị tương thích với dữ liệu."; "Dấu hiệu p-hacking: nên dè dặt với kết quả."'
  ly_do: p37, p38.
- cu: (không có)
  moi: 'Mục "Mức độ chắc chắn": khung Vững chắc "p-value không phải xác suất giả thuyết đúng, và không đo độ lớn hay tầm quan trọng của hiệu ứng" và khung Khá vững "p-hacking và báo cáo chọn lọc làm tăng khả năng có kết quả ''có ý nghĩa'' sai, và làm kết quả khó tái lập hơn"'
  ly_do: Khuôn 7 mục của đợt 4 (p39–p43).
