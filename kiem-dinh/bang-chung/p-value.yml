  - nosek2022
  trich: original findings that result from selective reporting, p-hacking, or other behaviors that leverage random chance to amplify effect sizes, obtain statistical significance, or specify overfitting models should be less likely to replicate than others
  vi_tri: Nosek và cộng sự 2022, tr. 728
  ket_qua: da-lam-mem
  ghi_chu: 'Chữ cũ: "Các kết quả p-hacking trông giống hệt kết quả thật trên giấy, nhưng không tái lập được khi người khác làm lại." Lý do: nguồn nói "should be less likely to replicate" (kỳ vọng), không nói "không tái lập được"; bỏ "giống hệt ... trên giấy" (không nguồn).'
- id: p31
  cau: 'Nguyên tắc thứ tư của ASA: suy luận đúng đòi hỏi báo cáo đầy đủ và minh bạch.'
