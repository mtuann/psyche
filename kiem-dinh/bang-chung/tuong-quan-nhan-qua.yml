    nguon:
      - freedman2012
      - openstax23
    trich: suggesting that residual confounding by smoking status, if present, attenuated the inverse associations
    vi_tri: 'Freedman, mục Discussion (nhiễu dư, residual confounding); OpenStax 2.3: "Even when we cannot point to clear confounding variables, we should not assume…"'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Nhưng không bao giờ kiểm soát được những biến chưa ai nghĩ tới." Chữ mới nêu cơ chế (chỉ điều chỉnh được biến đã đo, đo không hoàn hảo, nên còn nhiễu dư). Nguồn nói tới nhiễu dư; việc "biến chưa ai nghĩ tới không xử lý được" là hệ quả logic, không phải câu nguyên văn. Lượt 2 xem lại. Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; ý "chỉ xử lý được biến đã đo" là điều chuẩn của giáo trình phương pháp (OpenStax 2.3), nhiễu dư (residual confounding) có trong Freedman. dung.'
