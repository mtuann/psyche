  - id: t16
    cau: 'Còn khả năng thứ tư: nếu tìm đủ nhiều cặp biến, sẽ có những cặp tương quan mà không có mối liên hệ nhân quả nào.'
    loai: phat-hien
    nguon:
      - maurage2013
      - openstax23
    trich: We also show the peril of over-interpreting correlations in nutrition and health research by reporting high correlations between the number of Nobel laureates and various other measures, whether cogently related or not.
    vi_tri: 'Maurage 2013, tóm tắt; OpenStax 2.3: "whether it is attributable to coincidence or causation"'
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "sẽ có những cặp tương quan chỉ vì may rủi". Nguồn thấy tương quan cao giữa số giải Nobel và nhiều chỉ số khác dù có liên quan hợp lý hay không, và nói về "coincidence"; không nói thẳng cơ chế "tìm nhiều cặp". Chữ mới nhẹ hơn. Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; Maurage 2013 tóm tắt (đọc lại): "reporting high correlations between the number of Nobel laureates and various other measures, whether cogently related or not". Câu chung, hợp. dung.'
    luot_2: dung
