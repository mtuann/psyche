    cau: Mẫu lớn chỉ làm kết quả chính xác hơn, kể cả khi kết quả đó bị nhiễu; kiểm soát thống kê chỉ xử lý được các biến đã đo; phân nhóm ngẫu nhiên, khi đủ đông, làm các nhóm ít khác nhau một cách có hệ thống về mọi mặt, kể cả những mặt không ai đo.
    loai: phat-hien
    nguon:
      - freedman2012
      - openstax23
    trich: With sufficiently large samples, random assignment makes it unlikely that there are systematic differences between the groups.
    vi_tri: 'OpenStax 2.3 (Designing an Experiment); Freedman: mẫu 402.260 người vẫn cho chiều ngược khi chỉ điều chỉnh tuổi (t4)'
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (giải thích): "Phân nhóm ngẫu nhiên làm các nhóm giống nhau về mọi mặt, tính trung bình, kể cả những mặt không ai đo." Chữ mới thêm "khi đủ đông" và "ít khác nhau một cách có hệ thống" theo OpenStax. Đáp án đúng đổi tương ứng ("Chia người tham gia vào các nhóm một cách ngẫu nhiên" giữ nguyên). Câu hỏi đổi "loại bỏ được" thành "giúp cân bằng". "Mẫu lớn chỉ làm kết quả chính xác hơn" là hệ quả logic, minh họa bằng nghiên cứu cà phê (mẫu rất lớn vẫn nhiễu). Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; giải thích không dựa vào vị trí; "khi đủ đông" đúng OpenStax 2.3. dung.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings", "https://nobaproject.com/modules/research-designs" ]
    luot_2_ghi_chu: "Mẫu lớn không bỏ được sai lệch hệ thống: đúng nguyên lý thống kê (chuẩn trong giáo trình)."
    review: dung
  - id: q5
    cau: 'Hệ số tương quan r = −0,5: biến này cao thì biến kia có xu hướng thấp, ở mức khá rõ; dấu âm cho biết chiều, con số cho biết độ chặt; r không phải phần trăm thay đổi và không nói gì về nhân quả.'
    loai: dinh-nghia
    nguon:
      - openstax23
      - lakens2013
    trich: The sign—positive or negative—of the correlation coefficient indicates the direction of the relationship. (OpenStax) / a correlation (r) of 0.5 indicates 25% (r2) of the variance is explained by the difference between groups (Lakens)
    vi_tri: OpenStax 2.3; Lakens 2013, mục Effect sizes
    ket_qua: dung
    ghi_chu: '"Ở mức khá rõ" là cách nói của site cho |r| = 0,5 (Gignac: 0,30 đã là "lớn"; Funder & Ozer: 0,30 lớn). Lượt 2 xem lại.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings" ]
    luot_2_ghi_chu: "'r không phải phần trăm thay đổi': r² mới là phần phương sai chung; câu đúng."
