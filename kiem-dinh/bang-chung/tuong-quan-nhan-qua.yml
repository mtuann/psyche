    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Cách duy nhất để loại bỏ cả những biến gây nhiễu chưa biết là thí nghiệm có phân nhóm ngẫu nhiên." Phân nhóm ngẫu nhiên chỉ làm khác biệt có hệ thống "ít có khả năng" khi mẫu đủ lớn, nên "loại bỏ" thành "cân bằng", "duy nhất" thành "mạnh nhất". Link tới Vì sao cần nhóm đối chứng giữ nguyên. Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; "mạnh nhất để cân bằng", có điều kiện đủ đông ở câu khung thí nghiệm; đúng OpenStax 2.3. dung.'
