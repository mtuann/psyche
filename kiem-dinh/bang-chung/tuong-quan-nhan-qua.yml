nhan_dinh:
  - id: t1
    cau: '"Người uống cà phê sống lâu hơn" — một tiêu đề kiểu này từng xuất hiện trên nhiều báo năm 2012.'
    loai: lich-su
    ket_qua: da-bo
    ghi_chu: 'Chữ cũ: "một tiêu đề kiểu này từng xuất hiện trên nhiều báo năm 2012". Không mở được nguồn nào cho điều này (không thấy tiêu đề báo cụ thể gắn với nghiên cứu Freedman 2012 trong nguồn đã mở). Chữ mới: "một kiểu tiêu đề quen thuộc (site diễn đạt lại, không trích một tờ báo cụ thể)": ví dụ minh họa, không phải nhận định. Câu kế tiếp cũng đổi "Tin tức dựa trên một nghiên cứu thật" thành "Kiểu tin này có thể dựa trên một nghiên cứu thật". Review (Claude Sonnet 5.5, 30/10/2026): dung. Câu đã bỏ khỏi trang; chữ mới ("một kiểu tiêu đề quen thuộc (site diễn đạt lại, không trích một tờ báo cụ thể)") là ví dụ minh họa, ghi rõ, không phải nhận định. Lượt 2 tìm thấy tiêu đề kiểu này có thật nhưng không cần: trang không còn nói về một tờ báo.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/22591295/", "https://www.nih.gov/news-events/news-releases/nih-study-finds-coffee-drinkers-have-lower-risk-death" ]
    luot_2_ghi_chu: "Tiêu đề thực sự xuất hiện (Tufts: 'Coffee Drinkers Live Longer'); chỉ đọc kết quả tìm kiếm và thông cáo NIH qua tìm kiếm."
    review: dung
  - id: t2
    cau: Hơn 400.000 người Mỹ từ 50 đến 71 tuổi được theo dõi trong khoảng 13 năm.
    loai: so-lieu
    nguon:
      - freedman2012
    trich: among 229,119 men and 173,141 women in the National Institutes of Health-AARP Diet and Health Study who were 50 to 71 years of age at baseline. … During 14 years of follow-up (median, 13.6 years; total person-years, 5,148,760)
    vi_tri: Tóm tắt (Methods); mục Results
    ket_qua: dung
    ghi_chu: '229.119 + 173.141 = 402.260 người; theo dõi từ 1995 đến 2008, trung vị 13,6 năm. "Người Mỹ": thành viên AARP sống ở sáu bang và hai vùng đô thị của Mỹ (mục Methods, Study Population).'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/22591295/" ]
    luot_2_ghi_chu: "402.260 người, khoảng 12,8-13 năm theo dõi trung bình: khớp 'hơn 400.000' và 'khoảng 13 năm'."
  - id: t3
    cau: Sau khi tính đến các yếu tố như hút thuốc, người uống 2–3 tách cà phê mỗi ngày có nguy cơ tử vong thấp hơn khoảng 10–13% so với người không uống.
    loai: so-lieu
    nguon:
      - freedman2012
    trich: 'Adjusted hazard ratios for death among men who drank coffee as compared with those who did not were as follows: … 0.90 (95% CI, 0.86 to 0.93) for 2 or 3 cups, … the respective hazard ratios among women were … 0.87 (95% CI, 0.83 to 0.92)'
    vi_tri: Tóm tắt (Results)
    ket_qua: dung
    ghi_chu: HR 0,90 (nam) và 0,87 (nữ) tương ứng thấp hơn 10% và 13%. Đây là quan hệ thống kê sau điều chỉnh, các tác giả không kết luận nhân quả (t7).
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/22591295/" ]
    luot_2_ghi_chu: HR 0,90 và 0,87 tương ứng nguy cơ thấp hơn 10% và 13%; hiệu chỉnh gồm hút thuốc.
  - id: t4
    cau: 'Khi mới chỉ điều chỉnh theo tuổi, kết quả ngược lại: người uống cà phê có nguy cơ tử vong cao hơn.'
    loai: phat-hien
    nguon:
      - freedman2012
    trich: In age-adjusted models, the risk of death was increased among coffee drinkers.
    vi_tri: Tóm tắt (Results); mục Results, Coffee consumption and total mortality
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "khi chưa tính đến việc hút thuốc, kết quả ngược lại". Bài gốc nói mô hình chỉ điều chỉnh theo tuổi (age-adjusted), không nói "chưa tính hút thuốc" riêng. Chữ mới: "khi mới chỉ điều chỉnh theo tuổi". Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; Freedman 2012 tóm tắt (Europe PMC, đọc lại 30/10/2026): "In age-adjusted models, the risk of death was increased among coffee drinkers". dung.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/22591295/", "https://www.nih.gov/news-events/news-releases/nih-study-finds-coffee-drinkers-have-lower-risk-death" ]
    luot_2_ghi_chu: Khớp. Bản tóm tắt qua công cụ đọc web; chữ thật của abstract PubMed.
    review: dung
  - id: t5
    cau: Người uống cà phê cũng hay hút thuốc hơn.
    loai: phat-hien
    nguon:
      - freedman2012
    trich: However, coffee drinkers were also more likely to smoke
    vi_tri: Tóm tắt (Results)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "vì trong mẫu này, người uống nhiều cà phê cũng hay hút thuốc hơn". Bài gốc nói "coffee drinkers" (người uống cà phê) nói chung. Chữ mới bỏ "nhiều". Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; tóm tắt: "coffee drinkers were also more likely to smoke". dung.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/22591295/", "https://www.nih.gov/news-events/news-releases/nih-study-finds-coffee-drinkers-have-lower-risk-death" ]
    luot_2_ghi_chu: Khớp; thông cáo NIH (qua tìm kiếm) còn nói uống rượu, ăn thịt đỏ nhiều hơn.
    review: dung
  - id: t6
    cau: Điều chỉnh thêm theo việc hút thuốc và các yếu tố khác đã đủ đảo chiều kết luận.
    loai: phat-hien
    nguon:
      - freedman2012
    trich: after adjustment for tobacco-smoking status and other potential confounders, there was a significant inverse association between coffee consumption and mortality
    vi_tri: Tóm tắt (Results)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "Chỉ một yếu tố thứ ba đã đủ đảo chiều kết luận". Bài gốc điều chỉnh theo hút thuốc "và các yếu tố gây nhiễu tiềm tàng khác", không tách riêng tác dụng của hút thuốc. Chữ mới nói cả hai; câu ở khung nhãn và ở câu hỏi đầu của bài tập quiz đổi tương tự (t24, q1). Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; tóm tắt: sau khi điều chỉnh hút thuốc và các yếu tố gây nhiễu khác có liên quan nghịch có ý nghĩa. Chú ý (không đổi chữ): bài còn nói kết quả tương tự ở người chưa từng hút thuốc; trang chỉ nói "đủ đảo chiều" khi điều chỉnh thêm, không nói hút thuốc là nguyên nhân duy nhất, nên đúng. dung.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/22591295/" ]
    luot_2_ghi_chu: "Khớp; ghi chú: đảo chiều do hiệu chỉnh hút thuốc và các yếu tố khác, chủ yếu hút thuốc."
    review: dung
  - id: t7
    cau: Bản thân các tác giả viết rõ rằng nghiên cứu không thể kết luận cà phê gây ra tuổi thọ dài hơn; họ chỉ có thể nói hai thứ đi cùng nhau.
    loai: phat-hien
    nguon:
      - freedman2012
    trich: Whether this was a causal or associational finding cannot be determined from our data.
    vi_tri: Tóm tắt (Conclusions)
    ket_qua: dung
    ghi_chu: Chữ "chỉ có thể nói hai thứ đi cùng nhau" là cách nói của site cho "inversely associated"; bài gốc cũng kể tới nhân quả ngược và nhiễu dư (mục Discussion).
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/22591295/" ]
    luot_2_ghi_chu: "Khớp: tác giả nói không xác định được nhân quả."
  - id: t8
    cau: 'Hai biến tương quan khi chúng thay đổi cùng nhau: biến này cao thì biến kia thường cũng cao (tương quan dương), hoặc thường thấp (tương quan âm); mức độ đo bằng hệ số tương quan r, từ −1 đến +1.'
    loai: dinh-nghia
    nguon:
      - openstax23
    trich: A correlation coefficient is a number from -1 to +1 that indicates the strength and direction of the relationship between variables. … A positive correlation means that the variables move in the same direction.
    vi_tri: Mục 2.3, phần Correlational Research
    ket_qua: dung
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings" ]
    luot_2_ghi_chu: Định nghĩa chuẩn giáo trình. 'Các điểm gần một đường thẳng' là cách diễn đạt phổ biến, không bị OpenStax phản bác.
  - id: t9
    cau: 'r gần 0: mối quan hệ yếu, khó dự đoán biến này từ biến kia; r gần +1 hoặc −1: các điểm gần một đường thẳng, biến này dự đoán biến kia tốt.'
    loai: dinh-nghia
    nguon:
      - openstax23
    trich: The closer the number is to 1 (be it negative or positive), the more strongly related the variables are, and the more predictable changes in one variable will be as the other variable changes. The closer the number is to zero, the weaker the relationship … The stronger the correlation, the closer the data points are to a straight line.
    vi_tri: Mục 2.3, phần Correlational Research và chú thích Hình 2.12
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "r = 0: không có xu hướng đi cùng nhau theo đường thẳng. r gần +1 hoặc −1: các điểm gần như nằm trên một đường thẳng." Chữ mới bám OpenStax (mạnh, yếu, dự đoán được; "điểm gần một đường thẳng" có trong chú thích hình), bỏ khẳng định "r = 0 là không có xu hướng theo đường thẳng" mà nguồn không nói thẳng. Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; định nghĩa theo OpenStax 2.3; dung.'
    luot_2: dung
    luot_2_nguon: [ "https://openstax.org/books/psychology-2e/pages/2-3-analyzing-findings" ]
    luot_2_ghi_chu: Định nghĩa chuẩn giáo trình. 'Các điểm gần một đường thẳng' là cách diễn đạt phổ biến, không bị OpenStax phản bác.
    review: dung
  - id: t10
    cau: 'Hình: bốn biểu đồ phân tán dữ liệu giả lập (100 điểm mỗi ô) với r = 0,0; 0,3; 0,7 và −0,5.'
    loai: ve-site
    ket_qua: dung
    ghi_chu: 'Đã kiểm trên src/hinh/tuong-quan.html (đọc 30/10/2026): 400 điểm (circle), mỗi ô 100; tính hệ số tương quan Pearson từ tọa độ điểm của từng ô bằng Python statistics.correlation: 0,0; 0,3; 0,7; −0,5 (làm tròn một chữ số). Hạt giống cố định: tools/figures.py của site cũ (../psyche-zero/tools/figures.py, LCG seed). Review (Claude Sonnet 5.5, 30/10/2026): dung. Kiểm thẳng src/hinh/tuong-quan.html: 400 phần tử circle, 100 mỗi ô; tính hệ số Pearson từ tọa độ (y đảo) cho bốn ô: 0,0; 0,3; 0,7; −0,5 (làm tròn một chữ số); nhãn của hình "r = 0,0", "r = 0,3", "r = 0,7", "r = −0,5". Hình đã khớp trang (::hinh{ten="tuong-quan"}) và build:xem dựng được.'
    review: dung
  - id: t11
    cau: 'Chú thích hình: dữ liệu giả lập, không phải dữ liệu nghiên cứu thật; hạt giống cố định; hệ số r của mỗi ô được tạo đúng bằng con số ghi trên đầu.'
    loai: ve-site
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "(100 điểm mỗi ô, sinh bằng máy theo hạt giống cố định trong tools/figures.py)". Repo này không có tools/figures.py (chỉ có ở site cũ), nên bỏ tên file. Đã sửa src/hinh/tuong-quan.html. r của mỗi ô khớp (t10). Review (Claude Sonnet 5.5, 30/10/2026): dung. Chú thích trong hình đọc đúng: "Dữ liệu giả lập (100 điểm mỗi ô, sinh bằng máy theo hạt giống cố định), không phải dữ liệu nghiên cứu thật. Hệ số r ở mỗi ô được tạo đúng bằng con số ghi trên đầu." Không còn tên tools/figures.py (repo này không có); r của mỗi ô đã tính lại ở t10.'
    review: dung
  - id: t12
    cau: Ở ô r = 0,3, xu hướng khá mờ.
    loai: ve-site
    ket_qua: da-lam-mem
    ghi_chu: 'Chữ cũ: "bằng mắt khá khó thấy xu hướng". Câu nói về cảm nhận khi nhìn hình, không phải điều kiểm được bằng nguồn; chữ mới "xu hướng khá mờ" mô tả hình (đường tương quan yếu so với ô r = 0,7). Đã xem hình 30/10/2026. Review (Claude Sonnet 5.5, 30/10/2026): dung. Câu mô tả hình ở ô r = 0,3 (đám điểm có xu hướng yếu so với ô r = 0,7); đã xem tọa độ ở t10, r = 0,3; "khá mờ" là cách nói thận trọng, không phải số liệu.'
    review: dung
  - id: t13
    cau: Trong một tổng hợp về khác biệt cá nhân, các tác giả xếp r = 0,30 vào mức "lớn".
    loai: so-lieu
    nguon:
      - gignac2016
      - daderman2022
    trich: They therefore recommended that individual differences researchers consider correlation values of 0.10, 0.20, and 0.30 to be small, typical (medium), and large, respectively
    vi_tri: Dåderman và cộng sự (2022), chú thích 1 (kể lại Gignac & Szodorai 2016, tr. 75)
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "dù trong tâm lý học, đó đã là một tương quan khá lớn" (khẳng định chung không nguồn). Chữ mới gắn với Gignac & Szodorai (2016), qua nguồn kể lại vì ScienceDirect chặn bản gốc. Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; câu gắn "một tổng hợp về khác biệt cá nhân" và "các tác giả", đúng nguồn kể lại (Dåderman 2022, PMC9684842: 0,10, 0,20, 0,30 là nhỏ, điển hình, lớn; đọc lại 30/10/2026). Bản gốc Gignac & Szodorai chưa mở được; số đúng với hai nguồn kể lại độc lập. dung.'
    luot_2: dung
    luot_2_nguon: [ "https://forrt.org/curated_resources/effect-size-guidelines-for-individual-di/" ]
    luot_2_ghi_chu: Bài gốc gọi .30 là 'relatively large' (tương đối lớn); câu viết 'lớn' chấp nhận được. Đọc qua trang tổng hợp, không đọc toàn văn.
    review: dung
  - id: t14
