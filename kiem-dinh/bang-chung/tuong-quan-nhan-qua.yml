  - id: q2
    cau: Tương quan giữa sô-cô-la và giải Nobel (r = 0,79) giữa các nước không chứng minh nhân quả; các phân tích sau đó thấy hoạt động khoa học của mỗi nước dự đoán số giải Nobel tốt hơn sô-cô-la. Tương quan rất mạnh không làm cho kết luận nhân quả mạnh hơn; những yếu tố khác có thể tạo ra tương quan rất cao.
    loai: phat-hien
    nguon:
      - doi2014
      - maurage2013
    trich: a country's number of Nobel awards can be mainly predicted by its scientific achievements such as number of publications and research expenditure. Conversely, dietary habits and the global economy variable are only minor predictors
    vi_tri: Doi 2014, tóm tắt; Maurage 2013, tóm tắt
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ (đáp án đúng): "Một yếu tố thứ ba, như mức độ giàu có của quốc gia, liên quan đến cả hai." Doi 2014 thấy kinh tế (GDP) chỉ là yếu tố phụ, nên đổi. Đổi cả câu hỏi ("có khả năng cao nhất là do đâu?" thành "cho thấy điều gì?"). Giải thích cũ "Một biến gây nhiễu có thể tạo ra tương quan rất cao" thành "Những yếu tố khác…". Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; đáp án đúng nói "các phân tích sau đó thấy hoạt động khoa học của mỗi nước dự đoán số giải Nobel tốt hơn sô-cô-la", đúng Doi 2014 (dietary habits "only minor predictors"); giải thích không dựa vào vị trí. dung.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1056/NEJMon1211064", "https://pubmed.ncbi.nlm.nih.gov/?term=Maurage+Does+chocolate+consumption+really+boost+Nobel+Award+chances", "https://ideas.repec.org/a/plo/pone00/0092612.html" ]
    luot_2_ghi_chu: Khớp.
