    cau: Năm 2012, Messerli đăng trên tạp chí New England Journal of Medicine một bài viết ngắn về sô-cô-la và giải Nobel.
    loai: lich-su
    nguon:
      - messerli2012
    trich: Messerli FH. Chocolate consumption, cognitive function, and Nobel laureates. N Engl J Med 2012 Oct 367(16)
    vi_tri: Bản ghi Europe PMC/PubMed (PMID 23050509), tr. 1562–1564
    ket_qua: da-sua
    ghi_chu: 'Chữ cũ: "một bác sĩ tim mạch đăng … một bài viết nửa đùa nửa thật". Bản ghi cho biết tác giả, tên bài, tạp chí, 2012, số trang (3 trang). "Bài viết ngắn" thay "nửa đùa nửa thật": giọng đùa của tác giả không kiểm được (chưa đọc toàn văn); Kayser (2012) kể Messerli nêu giả thuyết flavanol và đề nghị một thử nghiệm ngẫu nhiên tương lai. Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; Messerli 2012: thử mở toàn văn lần nữa 30/10/2026. NEJM chặn bot; Crossref và Europe PMC chỉ có tên bài, tác giả, số trang (1562-1564), không có tóm tắt; không có bản mở hợp lệ nào khác tìm được, nên bài gốc vẫn chưa ai đọc. Trang chỉ nói điều kiểm được qua siêu dữ liệu (tác giả, năm, tạp chí, "bài viết ngắn") và qua Kayser 2012 (PMC3544694, toàn văn) kể lại. dung, kèm giới hạn đó.'
    luot_2: dung
    luot_2_nguon: [ "https://doi.org/10.1056/NEJMon1211064" ]
    luot_2_ghi_chu: Đúng tạp chí, năm; là bài ngắn (3 trang, mục Note). Chỉ đọc metadata (Crossref, Europe PMC), không đọc toàn văn.
