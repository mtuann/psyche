    ly_do: 'Nguyên tắc phương pháp, không phải phát hiện cần tái lập: giáo trình mở nói rõ dữ liệu tương quan không dùng được để kết luận nhân quả và chỉ thí nghiệm mới cho phép; ví dụ cà phê (Freedman 2012) cho thấy chiều kết quả đảo khi điều chỉnh thêm hút thuốc, và chính tác giả không kết luận nhân quả. Không có nghiên cứu nào mâu thuẫn; thước đo nhãn (chuan-kiem-dinh.md mục 4) viết cho phát hiện thực nghiệm, nên mức "Vững chắc" ở đây dựa trên tính nhất quán của giáo trình và ví dụ minh họa. Lượt 2 và review xem lại. Review (Claude Sonnet 5.5, 30/10/2026): xét theo đồng thuận giáo trình và tổng quan phương pháp (mục 4 áp dụng cho nguyên tắc phương pháp), không theo điều kiện tái lập.'
