    luot_2_ghi_chu: "Nhãn Vững chắc cho nguyên tắc phương pháp: đồng thuận tuyệt đối trong giáo trình và tổng quan phương pháp; không có bằng chứng ngược. Đạt."
    ghi_chu: 'Review (Claude Sonnet 5.5, 30/10/2026): dung. Nhãn "Vững chắc" cho một nguyên tắc phương pháp: thước đo mục 4 viết cho phát hiện thực nghiệm, nên xét theo đồng thuận của giáo trình mở (OpenStax 2.2, 2.3) và ví dụ Freedman 2012; không có nguồn nào mâu thuẫn, trang đã nói rõ đây là nguyên tắc, không phải phát hiện cần tái lập. Đạt.'
