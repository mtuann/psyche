    ghi_chu: 'Chữ cũ (đáp án và giải thích câu 1): "Tính hay không tính một biến gây nhiễu (hút thuốc)…" và "Khi chưa tính đến hút thuốc… sau khi tính, kết quả đảo chiều". Chữ mới theo t4, t6. Review (Claude Sonnet 5.5, 30/10/2026): chữ cuối trên trang khớp với câu mới và với trích; đáp án và giải thích không dựa vào vị trí lựa chọn. dung.'
    luot_2: dung
    luot_2_nguon: [ "https://pubmed.ncbi.nlm.nih.gov/22591295/", "https://www.nih.gov/news-events/news-releases/nih-study-finds-coffee-drinkers-have-lower-risk-death" ]
