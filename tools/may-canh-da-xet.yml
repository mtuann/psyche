- doi: 10.1002/14651858.cd004687.pub3
  thong_bao: 10.1002/14651858.cd004687.pub4
  ngay: 2026-11-17
  ket_luan: 'Abbass 2006 có bản cập nhật Cochrane 2014 (pub4; tóm tắt Europe PMC 24984083): 33 nghiên cứu, 2.173 người; STPP hơn đối chứng ở ngắn và trung hạn trừ triệu chứng cơ thể ngắn hạn; hiệu ứng dài hạn lớn hơn nhưng một số không có ý nghĩa; kết luận "continues to show promise, with modest to large gains" và dặn đọc thận trọng. Trang tri-lieu-tam-ly (n46) kể điều Shedler 2010 dẫn từ bản 2006 (0,97, 1,51) kèm lời dặn thận trọng của bản 2006: câu vẫn đúng như một lời kể về bản 2006, bản 2014 không bác kết luận ấy. Không đổi chữ trang, không đổi bản ghi abbass2006 (trang dẫn đúng bản 2006). Có thể bổ sung một câu về bản 2014 khi trang được mở vì lý do khác.'
