# Thông báo rút bài, bày tỏ quan ngại, đính chính đã xét (máy canh, tools/may-canh.mjs rut-bai): máy canh không báo lại.
# Mỗi mục một thông báo của một DOI:
#   - doi: 10.xxxx/…          # DOI của nguồn site dùng
#     thong_bao: 10.xxxx/…    # DOI của thông báo (rút, quan ngại, đính chính), như trong issue
#     ngay: 2026-11-17        # ngày xét
#     ket_luan: '…'           # đọc thông báo thấy gì, site xử lý ra sao (sửa trang nào, hay vì sao không cần sửa)
# Thông báo mới của cùng DOI vẫn được báo. Nguồn có rut_bai ở src/data/nguon.yml thì thông báo rút của nó coi như đã xét.
